answer: |-
  Your friend is correct about the formal system as Dana Scott reconstructed it: Jordan Howard Sobel's (1987) demonstration of modal collapse is logically valid within that specific axiomatization. If one accepts Scott's formalization as the definitive version of Gödel's argument, the system is indeed untenable for anyone who wishes to maintain a distinction between contingent and necessary truths.

  However, your friend's dismissal of emendations as *ad hoc* or theologically defanged relies on the assumption that Scott's formalization captures every philosophical commitment Gödel intended. It does not. The collapse arises not from the core theological intuition (that a being possessing all perfections must exist necessarily) but from the interaction between **unrestricted property comprehension** and the **definition of Essence**.

  Here is the strongest case for a principled emendation, in the spirit of C. Anthony Anderson's (1990) work, that blocks collapse while preserving the argument's theological force.

  ### 1. The Mechanism of Collapse: Where the Derivation Breaks
  To fix the argument, we must isolate exactly where Sobel's derivation exploits the axioms. The collapse proof ($\phi \to \Box \phi$) proceeds roughly as follows:

  1.  **Existence:** The axioms entail $\exists x G(x)$ (a God-like being exists).
  2.  **Essence:** The axioms entail that $G$ is an essence of $x$. In Gödel/Scott's **Definition 2**, $\phi$ is an essence of $x$ if $\phi(x)$ and $\phi$ necessarily entails *every* property $\psi$ that $x$ possesses:
      $$ \phi \text{ ess } x \iff \phi(x) \land \forall \psi [\psi(x) \to \Box \forall y (\phi(y) \to \psi(y))] $$
  3.  **Necessary Existence:** The axioms entail $NE(x)$, meaning if $\phi$ is an essence of $x$, it is necessarily instantiated: $\Box \exists y \phi(y)$.
  4.  **The Collapse Step:** Let $p$ be any true contingent proposition (e.g., "It is raining"). In higher-order logic with **unrestricted comprehension**, we can define a property $Q_p = \lambda z. p$ ("the property of being such that $p$").
  5.  **Entailment:** Since $p$ is true, $x$ possesses $Q_p$. Since $G$ is the essence of $x$, $G$ entails $Q_p$. Since $x$ exists necessarily, $Q_p$ is necessarily instantiated. Therefore, $p$ is necessarily true.

  The culprit is **Step 4**. The derivation assumes that for every true proposition $p$, there exists a corresponding property $Q_p$ in the domain over which the definition of *Essence* quantifies. This treats "being such that $p$" as a genuine property comparable to "being omnipotent" or "being good."

  ### 2. The Emendation: Restricting Property Comprehension
  The principled emendation is to **restrict the domain of properties** quantified over in the definitions of *God-like* and *Essence* to **intrinsic properties** (sometimes called "natural" or "substantive" properties), excluding "Cambridge properties" or trivial logical constructs like $\lambda z. p$.

  **The Modification:**
  We retain Gödel's Axioms 1–5 and the S5 modal framework, but we add a **Constraint on Property Comprehension**:
  > **Constraint:** The quantifiers $\forall \phi$ and $\exists \phi$ in Definitions 1 and 2 range only over *intrinsic* properties. A property $\phi$ is intrinsic if its instantiation by an individual does not depend on contingent facts external to that individual's nature.

  **Why This Blocks the Derivation:**
  The property $Q_p = \lambda z. p$ (where $p$ is a contingent truth like "Napoleon lost at Waterloo") is not an intrinsic property of God. God's nature does not logically entail contingent historical facts about Napoleon. Therefore, $Q_p$ is not in the domain of quantification for Definition 2 (Essence).
  *   Consequently, $G$ does not entail $Q_p$ *as an essence*.
  *   Consequently, the necessary existence of $G$ does not necessitate the instantiation of $Q_p$.
  *   Consequently, $p$ remains contingent.

  ### 3. Defending Against the "Ad Hoc" Objection
  Your friend suspects this restriction is a *deus ex machina* designed solely to save the conclusion. There are three strong arguments that this restriction is philosophically principled and independent of the collapse problem.

  **A. Historical and Textual Fidelity**
  Gödel was a Leibnizian. In the Leibnizian tradition (and in Gödel's own unpublished notes), "properties" in an ontological argument are not arbitrary sets of possible worlds (the modern model-theoretic view); they are *real definitions* or *concepts*. Leibniz explicitly distinguished between "real" properties (perfections) and "nominal" or extrinsic denominations. Scott's formalization imposes a modern, unrestricted higher-order logic onto a pre-modern metaphysical framework. Restricting the domain to intrinsic properties is not a patch; it is a **correction of translation** that aligns the formalism with Gödel's metaphysical intentions.

  **B. Independent Logical Motivation**
  Unrestricted property comprehension is independently controversial in higher-order logic due to paradoxes (e.g., Russell's Paradox, Properties of Properties). Many logicians (including Gödel himself in other contexts) favored predicative or restricted systems to avoid impredicativity. Restricting the ontology to intrinsic properties is a standard move in metaphysics to avoid "truth-maker" explosion. We do not need to posit a property for every true proposition to do metaphysics. Thus, the restriction is motivated by general logical hygiene, not just by the desire to save the ontological argument.

  **C. The Nature of "Positive"**
  Gödel's primitive notion is "Positive" (or "Perfection"). Axiom 1 states positivity is closed under necessary implication. If we allow trivial properties like $\lambda z. p$, we trivialize the notion of "Positive." If "being such that $p$" counts as a property entailed by God's nature, then God's nature is cluttered with infinite contingent facts. This violates the theological doctrine of **Divine Simplicity**, which Gödel likely respected. A principled theory of "Positive Properties" should inherently exclude extrinsic, disjunctive, or trivial properties. Anderson argues that "Positive" is an axiological notion, not a purely logical one; it tracks *value* and *nature*, not just truth conditions.

  ### 4. Defending Against the "Defanged" Objection
  Your friend argues that fixing the collapse renders the conclusion theologically uninteresting. This is incorrect. The emendation preserves the core theological payload:

  1.  **Necessary Existence is Retained:** The proof still concludes $\Box \exists x G(x)$. We still derive that a being possessing all *intrinsic perfections* exists necessarily. This is the massive metaphysical claim the argument is designed to secure.
  2.  **Perfections are Preserved:** Properties like "Omniscience," "Omnipotence," and "Moral Perfection" are paradigmatically intrinsic. They remain in the domain. The argument still proves that these specific, weighty properties are co-instantiated in a necessary being.
  3.  **Collapse is Not Required for Theism:** The theological point of the argument is to establish the *necessity of God*, not the *necessity of everything*. A theist *wants* to maintain the distinction between the Creator (Necessary) and Creation (Contingent). If the argument entails modal collapse, it actually proves *too much* (Spinozism), which is theologically undesirable. Blocking collapse makes the conclusion *more* compatible with orthodox theism, not less.

  ### 5. Summary of the Case
  You can tell your friend this:

  Sobel proved that **Scott's formalization** collapses. He did not prove that **Gödel's metaphysical project** collapses. The collapse is an artifact of modeling "properties" as unrestricted sets of worlds rather than as intrinsic natures.

  By adopting Anderson's restriction to **intrinsic properties**:
  1.  **We block the Sobel derivation** at the step where contingent truths are reified into properties of God.
  2.  **We remain faithful to Gödel's Leibnizian context**, which distinguished real definitions from extrinsic denominations.
  3.  **We preserve the theological conclusion** ($\Box \exists x G(x)$) while avoiding the heretical side-effect (Spinozistic necessitarianism).

  The emendation is not *ad hoc*; it is a necessary clarification of the metaphysical vocabulary the argument uses. It purchases consistency not by weakening the axioms, but by sharpening the definitions to match the intended ontology. The argument remains recognizably Gödel's because it still turns on the axiological notion of "Positive," the closure of perfections, and the S5 inference from possibility to necessity—it simply refuses to let logical trivialities count as perfections.
