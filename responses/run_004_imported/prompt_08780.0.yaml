answer: |-
  [Stand up, glass in hand. Don't tap the glass with a fork; just raise your voice slightly.]

  Good evening, everyone. For those who don't know me, I'm [Your Name], and apparently, by a vote I lost, I am the designated speaker for tonight.

  A while back, I found a used copy of Cicero's *On Old Age*. It's two thousand years old. I read it three times. I know, that sounds pretentious, but stick with me. Cicero writes about a Roman senator named Cato, who lays out the four big complaints people have about getting old. One: You can't be active anymore. Two: Your body falls apart. Three: You lose your pleasures. And Four: You're closer to death.

  Now, I know my Dad. And I know that if I stand up here and tell him "Eighty is the new sixty," he will interrupt me to correct my math. He thinks that's a lie we tell to avoid thinking about aging. So, I'm not going to say that. You're eighty, Dad. You've earned the number.

  Cicero was writing for rich Roman senators who owned farms and slaves. Dad, you spent forty-five years doing payroll and fixing lawnmowers in a hardware store. The contexts are different. Cato didn't have to deal with supply chain issues on power washers. But reading Cicero, I realized the structure of a life well-lived hasn't changed much since 44 BC.

  Let's look at Cato's first complaint: that old age withdraws you from active affairs. Cato argues that while the body slows, the mind guides. He tells a story about Appius Claudius, an old, blind senator who was carried into the senate house because his counsel was still needed to save the state.

  Dad, you sold the store last year. Technically, you're retired. But we all know you still show up twice a week to "make sure they're not screwing it up." [Pause for laughter/nods from the army buddies.] You aren't blind, but you see things the new owners miss. You proved Cato's point: you didn't withdraw from the work; you just changed your rank from General to Advisor.

  The second and third complaints—the body failing and the loss of pleasure—Cato admits are real. But he argues that the pleasure of *creation* outlasts the pleasure of *consumption*. He uses this image of an old farmer planting trees he knows he will never see grow. He asks: Why do you do it? For the next generation.

  That's the hardware store. You didn't build that place just to pay bills for forty years. You built it so it could stand without you. You planted a tree in 1978, and now the rest of us are sitting in its shade. The cousins here might be on their phones, but the roof over their heads and the education they got came from those trees you planted.

  Finally, the fourth complaint. Death. Cicero doesn't offer religious comfort. He offers logic. He says death is either the end, in which case there's nothing to feel, or it's a transition to somewhere better. Either way, it's not something to dread.

  I'm not going to get into the metaphysics of the afterlife at a dinner party. But I will say this: Most people spend their lives running from the end. You've spent yours building something that outlasts the end. That makes the proximity to it less scary.

  So, Dad. You aren't a Roman Senator. You're a veteran, a business owner, and a stubborn eighty-year-old who refuses to let the new management order the wrong stock of washers. But Cicero would have recognized you. He would recognize the value of your counsel, the legacy of your work, and your honesty about the timeline.

  To Cato, the goal of old age isn't to pretend you're young. It's to be fully, honestly, and usefully old.

  [Raise glass]

  To Dad. Happy 80th.

  [Drink]
