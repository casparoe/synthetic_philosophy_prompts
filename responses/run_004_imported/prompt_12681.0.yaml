answer: |-
  This is a profound question that touches on the philosophy of language, the nature of social norms, and legal theory. You have stumbled, quite accidentally, into a problem that has occupied philosophers from Ludwig Wittgenstein to H.L.A. Hart.

  You are asking whether a rule exists independently of its application in edge cases, or whether the rule is *constituted* by the history of its application. You are also asking whether, when that history runs out, we are discovering the truth or making a new law.

  Here is the serious take you requested.

  ### 1. The Ontological Question: Was there a "Fact of the Matter"?

  The short answer is: **No, there was likely no determinate fact of the matter about this specific scenario prior to this weekend.**

  This conclusion rests on what is known in philosophy as the **underdetermination of rules by practice**. This is most famously associated with Wittgenstein's *Philosophical Investigations* and Saul Kripke's interpretation of it (the "Kripkenstein" argument).

  The argument runs like this: A rule is not a physical object sitting in the room with you. It is a social practice. For the past ten years, your group has engaged in a pattern of behavior (playing hands, awarding bonuses, voiding misdeals) accompanied by a normative attitude ("this is how one *ought* to play").

  However, any finite set of past actions is compatible with an infinite number of possible rules.
  *   **Rule 1:** "Void all scores on a misdeal."
  *   **Rule 2:** "Void all scores on a misdeal, *unless* a player has successfully bid zero, in which case the bonus stands."
  *   **Rule 3:** "Void all scores on a misdeal, *unless* the misdeal is discovered after trick 4, in which case..."

  For a decade, Rule 1 and Rule 2 produced the exact same outcomes. Every time you voided a hand, no one had a zero bonus pending. Every time someone scored a zero bonus, there was no misdeal. Therefore, the history of your play is equally consistent with Rule 1 and Rule 2.

  When your friend insists there *must* be a fact about what rule you were following, they are operating under a **Platonist intuition about norms**. They believe the "True Rule" exists in some abstract space, and your job is to excavate it. But in social games, the rule *just is* the shared understanding of the players. If the shared understanding never extended to this case, the rule never extended to this case.

  To use a linguistic analogy: Imagine you have used the word "game" for ten years to refer to chess, poker, and soccer. You have never referred to "solitaire" as a game. If someone asks, "Does your definition of 'game' include solitaire?" there is no fact of the matter hidden in your past usage. Your past usage is compatible with "games are competitive activities" (excludes solitaire) and "games are structured play" (includes solitaire). The meaning is exhausted by the use; where there is no use, there is no meaning.

  So, neither side is "objectively right" about the past, because the past does not contain the data point required to distinguish the two hypotheses.

  ### 2. The Jurisprudential Question: Is there a Principled Basis for Decision?

  If there is no historical fact to discover, does that mean you are left with pure power politics (a vote)? Not necessarily. While you cannot find a *historical* fact, you can look for a **principled coherence**.

  This is where legal theory becomes useful. In law, this is called a "hard case" (a term coined by legal philosopher Ronald Dworkin). A hard case arises when existing statutes and precedents do not dictate a unique outcome.

  Legal positivists (like H.L.A. Hart) might say that when the "rule of recognition" runs out, the judge must exercise discretion and make new law. Dworkin, however, argued that even in hard cases, there is a "right answer" found not in the explicit rules, but in the **principles** that underlie the rules.

  You can apply this to your card game. Instead of asking "What did we do before?" (which yields no answer), ask "What principles justify the rules we have?"

  *   **Principle of the Zero Bonus:** Why does it exist? Usually, in Oh Hell variants, a zero bid bonus rewards high-risk skill and precise hand management. It is a recognition of a specific feat of play.
  *   **Principle of the Misdeal Void:** Why does it exist? Usually, to ensure fairness. A misdeal implies the random distribution of cards was flawed, compromising the integrity of the competition. It resets the state to "no game occurred."

  Now you have a conflict of principles: **Reward for Feat** vs. **Integrity of Conditions.**

  *   **The "Void" Argument:** If the deal was flawed, the feat itself is tainted. Perhaps the misdeal made the zero bid easier (or harder). Because the foundational condition (a fair deal) was absent, the feat cannot be legally recognized. The Void principle swallows the Bonus principle.
  *   **The "Bonus" Argument:** The zero bid is a distinct event from the trick-taking outcome. The player declared an intention and fulfilled it regardless of the card distribution. The misdeal voids the *trick scores*, but the zero bonus is a separate contract between the bidder and the table.

  If you argue through *these* principles, you are not merely voting; you are engaging in **constructive interpretation**. You are deciding which interpretation makes your shared practice the "best it can be."

  ### 3. The Social Ontology: The "Retroactive" Worry

  You asked if taking a vote feels like "treating that as having settled, retroactively, what the rule was all along." You are right to be uneasy about this.

  If you vote now, you are not discovering what the rule *was*; you are stipulating what the rule *is*. However, in social contexts, there is a subtle fiction we must maintain to keep the game going. We have to pretend, slightly, that we are clarifying the old rule, even if we are actually amending it.

  Why? Because if you admit "There was no rule, and we just made one up," it undermines the normative force of the game. It suggests that the rules are arbitrary. By framing the decision as "clarifying the intent of the game," you preserve the sense that you are playing the *same* game you played for ten years, rather than starting a new one.

  This is not dishonest; it is how all oral traditions work. Folklore changes when it encounters a new context, but the storytellers insist they are telling the "old story."

  ### 4. Conclusion and Recommendation

  To answer your specific questions:

  1.  **Is there a fact of the matter about which rule you had all actually been following?**
      No. The rule was indeterminate. Your shared understanding was a "partial function" that simply returned no value for this specific input. Both sides are honestly projecting a generalization onto a history that doesn't support one over the other.

  2.  **Is there any principled basis left for saying one side is objectively right?**
      Not "objectively right" in the sense of correspondence to past facts. But there is a basis for saying one side is **more coherent** with the spirit of the game. You must decide which principle matters more: the sanctity of the deal (Void) or the recognition of the bid (Bonus).

  3.  **Should you just take a vote?**
      Yes, but reframe the vote. Do not vote on "What was the rule?" (since that implies a truth exists). Vote on "What is the rule going forward, and does this feel consistent enough with the past that we can apply it to this hand?"

  **A Practical Suggestion:**
  The philosophical lesson here is the danger of **implicit normativity**. For ten years, you relied on "common knowledge" that was actually just "common experience." As soon as experience diverged, knowledge vanished.

  Settle the argument by acknowledging the indeterminacy. Say to your friend: *"We are both right that our past behavior supports our view. That means the rule was never written in the stars; it was only written in our habits. Since the habits ran out, we have to write the rule now."*

  Then, write it down. The moment you codify the rule, you create the fact of the matter that was missing before. Until then, you are not arguing about a game; you are arguing about the limits of human agreement. And on that, the skeptics have the better of it.
