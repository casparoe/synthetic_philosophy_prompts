answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two graduate students, ELIAS (Epistemicist) and SARAH (Supervaluationist), are finishing up their drinks. The conversation has clearly been going on for a while.*

  **Sarah:** Look, I get the appeal of keeping classical logic intact. I do. It's tidy. But you have to admit, Elias, the metaphysical cost is staggering. You're telling me that in the actual world, right now, there is a specific integer $n$ such that a man with $n$ hairs is bald, and a man with $n+1$ hairs is not bald?

  **Elias:** I am telling you that "bald" is a predicate that partitions the domain of men. If it partitions the domain, there must be a boundary. If there weren't a boundary, the predicate would be meaningless. The Sorites paradox forces us to choose: either we accept a sharp cutoff, or we accept that logic fails. I choose the cutoff.

  **Sarah:** But *why* that cutoff? That's the arbitrariness objection. Let's say the number is 5,432. What fact about the universe fixes 5,432 as the transition point rather than 5,433? Is there a little metaphysical switch that flips when the 5,433rd follicle emerges? It sounds like magic.

  **Elias:** It's not magic, Sarah, it's complexity. The meaning of "bald" is determined by our usage patterns over time. Those patterns are chaotic, sensitive to initial conditions, and incredibly dense. Just because we can't calculate the boundary doesn't mean it isn't fixed by the causal history of our linguistic interactions. Think of it like a chaotic system. You can't predict the weather three months out, but that doesn't mean the atmosphere is indeterminate. It just means you lack the data.

  **Sarah:** But weather is physical. Meaning is normative. When we use "bald," we aren't tracking a natural kind. We're engaging in a practice that is inherently loose. The Supervaluationist says there isn't one switch. There are thousands of equally admissible precisifications. On some precisifications, 5,432 is bald. On others, it isn't. The statement "Man X is bald" is super-true only if it's true on *all* admissible precisifications. In the borderline cases, it's neither true nor false. There is no fact of the matter to be ignorant *of*.

  **Elias:** And that's where you lose me. If there's no fact of the matter, then bivalence fails. If bivalence fails, classical logic crumbles. You can't validly infer $Q$ from $P$ and $P \rightarrow Q$ if $P$ is neither true nor false. You're sacrificing the engine of reasoning to save your intuition about hair.

  **Sarah:** We save validity, Elias. Supervaluationism preserves classical logic for the determinate cases. We only get gaps in the penumbra. But let's talk about the real problem for your view. Higher-order vagueness.

  **Elias:** Go on.

  **Sarah:** Okay, you say there's a sharp boundary between bald and not bald. Fine. But surely there's also a sharp boundary between "definitely bald" and "borderline bald"?

  **Elias:** Yes.

  **Sarah:** And a boundary between "definitely definitely bald" and "not definitely definitely bald"?

  **Elias:** In principle, yes.

  **Sarah:** This is the bullet that bites back. If vagueness is just ignorance, then you're claiming there is a precise point where my knowledge stops. But "knowability" itself seems vague. There isn't a sharp line between knowing something and not knowing it. By positing a sharp cutoff for "bald," you haven't solved vagueness; you've just pushed it back to the cutoff itself. Is the cutoff sharp? Well, is it *sharply* sharp? You end up with an infinite regress of sharp boundaries, which seems just as absurd as the original Sorites.

  **Elias:** I don't think it's a regress; I think it's just iterated margins for error. This is Williamson's point. Knowledge requires safety. If I know that $n$ is bald, I couldn't easily have been wrong. But in a Sorites series, $n$ and $n+1$ are indiscriminable. So, if I know $n$ is bald, $n+1$ must also be bald, otherwise my belief about $n$ wasn't safe.

  **Sarah:** Right, the margin-for-error principle.

  **Elias:** Exactly. The margin widens as you iterate. The boundary between "bald" and "not bald" is at $n$. The boundary between "known to be bald" and "not known to be bald" is at $n+k$. The boundary between "known to be known" is at $n+k+j$. The boundaries exist, they are just spaced out by the reliability of our discrimination. It explains why the cutoff seems vague to us. It's not that the world is fuzzy; it's that our epistemic access degrades as we approach the edge.

  **Sarah:** But that explains *why we don't know*, not *why the boundary exists*. You're conflating the epistemology with the metaphysics. You're saying, "We can't locate the line, therefore the line is hidden." I'm saying, "We can't locate the line because there is no line to locate."

  Consider the semantic intuition. When I say "Bob is bald," and Bob is a borderline case, I don't feel like I'm making a false claim. I also don't feel like I'm making a true claim. I feel like the question is inappropriate. Supervaluationism captures that inappropriateness. Epistemicism tells me I'm just wrong, and Bob is actually fully hairy, I'm just too stupid to see it.

  **Elias:** It's not about stupidity. It's about the nature of concepts. Concepts are tools. A tool has a limit. If I have a ruler that measures to the millimeter, there is a fact of the matter about whether an object is 10mm, even if my eye can't distinguish 10mm from 10.1mm. Vagueness is just the recognition that our linguistic rulers have a resolution limit. But the object being measured—the extension of the predicate—still has a definite length.

  **Sarah:** But the ruler *is* the language, Elias. There's no object outside the language we're measuring. The extension of "bald" is constituted by our dispositions to use it. And those dispositions are not sharp. If you polled every English speaker on 5,432 hairs, you'd get a split. Some say yes, some say no.

  **Elias:** And the aggregate of those dispositions fixes the reference. It's like a Supreme Court ruling. The law might be vague, but the ruling creates a sharp boundary. Usage is the court.

  **Sarah:** But the Court can issue a vague ruling! They can say "reasonable doubt" without defining the percentage. If Supervaluationism is right, "bald" is like "reasonable doubt." It's defined by a range of acceptable interpretations. You're insisting that somewhere in the judicial history, a judge secretly decided that 54.3% probability constitutes doubt, and we just don't know which judge it was.

  **Elias:** I'm insisting that communication works. If there were genuinely no fact of the matter, successful coordination on vague terms would be miraculous. How do we agree that a completely hairless man is bald and a lion is not, if there's no underlying extension anchoring the term?

  **Sarah:** We agree on the clear cases! That's all Supervaluationism requires. We agree on the intersection of all precisifications. We disagree on the penumbra. And that's fine. We don't need a sharp line to communicate; we just need enough overlap.

  **Elias:** But what happens in a legal contract? "The tenant must keep the premises clean." If "clean" is vague, and there's no sharp cutoff, how does the judge rule?

  **Sarah:** The judge precisifies. Context selects a specific admissible precisification. In a legal context, we tighten the standards. That doesn't mean there was a pre-existing sharp line in the English language; it means the context forced a decision.

  **Elias:** But the decision implies there was a gap to fill. If Epistemicism is true, the gap is only in our knowledge. The truth value was always there. This preserves the idea that every meaningful declarative sentence is either true or false. That is a huge theoretical virtue. You're willing to trash bivalence to save your intuition that 5,433 hairs isn't a magic number.

  **Sarah:** I'm willing to trash bivalence to save the intuition that meaning is grounded in use. If use is fuzzy, meaning is fuzzy. You're positing a "hidden precision" in usage that doesn't exist. You're saying our chaotic, messy, inconsistent dispositions somehow conspire to generate a single, precise integer extension for every predicate. That's the magic, Elias. Not my view. Yours.

  **Elias:** It's not magic, it's supervenience. The semantic facts supervene on the usage facts. Even if the usage facts are messy, the supervenient semantic fact can be sharp. Supervenience doesn't require a smooth mapping.

  **Sarah:** But *why* does it supervene sharply? What principle dictates that? If you can't give me a principle that selects 5,432 over 5,433 other than "usage did it," you're asking me to accept a brute, inexplicable necessity.

  **Elias:** And if you can't tell me where logic stops working without making validity context-dependent, you're asking me to accept that reasoning itself is fragile. I'd rather accept a brute semantic fact than a broken logic.

  **Sarah:** Fair. But I still think you haven't answered the higher-order charge. Even if I grant you the sharp boundary for "bald," you need a sharp boundary for "knowable." And since knowledge is a normative status, positing a sharp line there seems even more implausible than a sharp line for hair.

  **Elias:** I grant it's implausible. I don't grant it's false. The implausibility is the point. It explains why the paradox is so persuasive. If the cutoff were obvious, there would be no paradox. The fact that it's epistemically inaccessible is exactly what generates the Sorites intuition. You're mistaking the *feeling* of indeterminacy for indeterminacy itself.

  **Sarah:** And I think you're mistaking the *limits of representation* for the *structure of reality*. Or in this case, the structure of language. Look, we're not going to resolve this over cold coffee.

  **Elias:** No. But I think we've clarified the stakes. It's Classical Logic and Metaphysical Realism versus Semantic Indecision and Intuitive Usage.

  **Sarah:** Basically. You keep your sharp lines and your broken intuitions. I'll keep my fuzzy boundaries and my working logic.

  **Elias:** (Smiling) I'll take the logic. You can have the intuition.

  **Sarah:** Deal. But if you go bald, Elias, I'm not telling you when it happens. I wouldn't want to violate your margin for error.

  **Elias:** Please don't. I prefer not to know the exact number.

  **Sarah:** See? Even you admit ignorance is better.

  **Elias:** Ignorance of a fact is better than the absence of a fact. But I'll let you keep thinking there's no fact. It makes the coffee taste less bitter.

  **Sarah:** (Laughs) Cheers to that.
