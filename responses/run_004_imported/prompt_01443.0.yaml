      *   **Mother's Argument (The Materialist/Pragmatic View):**
          *   Premise: The body is just matter after death.
          *   Premise: Decomposition (worms) and Cremation (ash) are physically equivalent in terms of dignity.
          *   Conclusion: Don't spend money on preserving or housing the body (embalming, caskets).
          *   *Validity:* Logically sound regarding the *body itself*. The dead do not experience dignity or discomfort.
      *   **Brother's Argument (The Ritualist/Psychological View):**
