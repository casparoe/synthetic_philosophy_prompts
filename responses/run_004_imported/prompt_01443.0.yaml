      *   **User's Conflict:** Torn between respecting mother's explicit reasoning (which seemed sound) and the brother's point about the needs of the living/family obligations.
      *   **Core Question:** Was the mother right (it doesn't matter what happens to the body), or is the brother onto something her argument leaves out (the social/psychological function of ritual)?

