answer: |-
  A graduate student is building a model of the proposition "Desdemona loves Cassio" out of magnetic tiles. She places down a tile for *Desdemona*, a tile for *Cassio*, and a tile for *Loves* between them.

  Her advisor looks over her shoulder. "That's just a list of three tiles. You need a binding relation to unify them into a fact."

  So the student adds a tile labeled *Exemplification*.

  "Now you have four tiles," the advisor says. "What binds *Exemplification* to *Loves*?"

  "I'll add a meta-binding tile."

  "And what binds the meta-binding tile?"

  Frustrated, the student sweeps the magnets off the table.

  "Careful," says the advisor. "You've now created a new state of affairs. What binds *you* to the *sweeping*?"
