answer: |-
  The frost on the windshields matched the mood. Elena clicked her fob, the lights flashing against the gray concrete.

  "You still haven't solved the demon," Marcus said. He was leaning against his sedan, hands deep in his coat pockets.

  "We're at a funeral, Marcus."

  "Elias loved a good stalemate. Besides, you're doing it again. You're treating fittingness as a primitive."

  "I'm treating it as a constraint," Elena corrected, turning to face him. Her breath plumed in the cold. "The CEO example is old news. If the company pays you to admire him, that's a state-given reason. It's about the benefits of holding the attitude, not the object of the attitude."

  "Right. The standard move." Marcus pushed off the car. "But how do you sort them, Elena? How do you know which reasons are 'object-given' and which are 'state-given' without already knowing what makes the CEO admirable?"

  "Because the bonus doesn't reflect on his qualities."

  "That's the question!" His voice cracked, sharper than he intended. He softened it. "You're defining the right reasons as the ones that track admirableness. But admirableness is supposed to be *constituted* by the reasons. You're using the conclusion to filter the premises. It's circular."

  "It's not circular, it's structural. The reason has to cite a property of the object."

  "Which properties?" Marcus stepped closer. "If I admire him because he's rich, is that a property of the object? Yes. Does it make him admirable? No. So you need a further filter. You need 'fittingness' to sort the reasons, which means fittingness can't be *defined* by the reasons. You've begged the question."

  Elena hugged her arms across her chest. "If I abandon the analysis, I lose the normativity. I lose the link between value and rationality. You want me to say value is just out there, waiting?"

  "I want you to admit the analysis doesn't hold water. You're protecting the theory instead of the phenomenon."

  "I'm protecting the only way to make sense of why we should care about value at all!" She paused, the echo hanging between them. "You always thought I was hiding behind semantics."

  "I thought you were hiding behind a marriage of convenience between reasons and values." Marcus sighed, rubbing his temple. "Elias would have told you to drop the reductivism."

  "Elias would have told you to stop looking for counterexamples to everything that matters."

  They stood there, the silence heavier than the argument. Neither moved toward their door.

  "So," Marcus said quietly. "Object-given?"

  "Still," Elena said. She unlocked her car. "See you at the conference, Marcus."

  "Don't count on it."

  He watched her get in, then turned to his own door, the cold air settling back into the space between them.
