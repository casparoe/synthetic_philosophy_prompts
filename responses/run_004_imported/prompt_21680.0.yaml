answer: |-
  The form on Mara's screen was titled *Post-Divergence Reconciliation: Ontological Status Declaration*. It was the most important checkbox she would ever tick, and her cursor hovered over it like a nervous bird.

  Option A: *Numerical Identity (Transworld Continuity).*
  Option B: *Counterpart Relation (Similarity Only).*

  Below the options, a field waited for her digital signature. To the left of the screen, her left arm throbbed. A second-degree burn, blistering and raw, wrapped around her forearm. Except it didn't. Her arm was smooth, unblemished, resting on the cool desk surface. The pain was phantom, echoing from a body that no longer existed.

  Three hours ago, the containment grid had failed. Mara had engaged the Fork. It was standard protocol for Level-5 crises: split the operator's consciousness across two probability branches. In Branch Alpha, Mara stayed in the control room to manage the evacuation. In Branch Beta, Mara manually overridden the core seal.

  Branch Beta had succeeded. Branch Beta had also died. The radiation spike was instantaneous.

  Now, Mara sat in the quiet aftermath of Branch Alpha. She was the survivor. The system needed to know how to file the death certificate for Branch Beta.

  If she chose Option A, she was admitting that Branch Beta was literally *her*. That the woman who melted in the core was numerically identical to the woman sitting here typing. It meant the death was partial suicide. It meant she inherited Beta's final moments of terror and pain as actual memory, not just data logs. It meant she was a widow to herself.

  If she chose Option B, Branch Beta was merely a counterpart. A copy. A sufficiently similar distinct entity created for the task. Choosing this meant Mara owed the dead woman nothing but professional respect. The pain in her arm was just sympathetic resonance, a glitch in the neural link. She could go home to her husband, Julian, and tell him she lost a colleague. She could live without the ghost in her nerves.

  Mara stood up. The room swayed. The burn flared, sharp and acidic.

  She walked out of the control center, into the sterile white corridor. She needed to test the weight of the choice. She needed to see Julian.

  Julian was waiting in the family lounge, pacing. When he saw her, he stopped. His eyes went wide, then filled with a confusion that broke her heart. He had seen the feed. He had seen Branch Beta walk into the red light. He had seen the vitals flatline.

  "Mara?" he whispered.

  "I'm here," she said. Her voice sounded steady, but her left arm screamed.

  "They said… they said you went in."

  "I forked, Julian. You know the protocol."

  "One of you died." He took a step toward her, then hesitated. This was the hinge. This was the moment the metaphysics became flesh.

  If Option B was true, if Counterpart Theory held the weight of reality, then Julian was looking at the survivor of a tragedy that happened to someone else. She was the twin who didn't get sick. She could hug him, and it would be comfort.

  If Option A was true, if Transworld Identity was the law of this universe, then Julian was looking at a ghost. The person he loved had walked into the fire. This version was just the leftover husk, the branch that didn't bear the fruit. To hug him was to lie.

  Mara looked at her left arm. The skin was pale, perfect. But the pain was specific. It wasn't just heat; it was the memory of the metal searing into flesh, the specific angle of the valve she had twisted with burning fingers. It wasn't data. Data was cold. This was hot.

  "Does it hurt?" Julian asked, staring at her arm.

  "No," she lied.

  "Don't," he said, his voice cracking. "The feed… she screamed, Mara. She sounded like you."

  "Because it was me." The words slipped out before she could check them against Option B.

  Julian flinched. "Don't say that. You're standing here."

  "Am I?" Mara clenched her fist. The phantom blisters popped in her mind. She felt the panic of the airlock sealing, the realization that there was no way out. She felt the love for Julian that Beta had felt in those last seconds, a love so sharp it felt like another wound.

  If Beta was just a counterpart, those feelings belonged to a stranger. They were irrelevant simulations. But Mara couldn't dismiss them. They were too heavy. They anchored her to the chair in the core room that no longer existed.

  She thought about the form. If she signed Option B, the system would purge the emotional telemetry. She would be free of the pain. She could be the wife who came home safe. She could let Beta be a hero, a separate person who made a noble sacrifice.

  But if she did that, she was erasing the truth of the pain. She was calling her own suffering a glitch.

  Mara walked toward Julian. He didn't move. He was waiting to see who walked up to him. The survivor? Or the returned dead?

  She reached out with her right hand, keeping the burning left arm hidden at her side. She touched his face. He was warm. Real.

  "I remember the light," she said softly. "I remember thinking I didn't want to leave you."

  Julian's breath hitched. Tears spilled over. He didn't pull away. He leaned into her hand, but his eyes were terrified. He was mourning her while holding her. That was the cost of Option A. If they were the same, his grief was valid, but her existence was a paradox. She was a living wound.

  "If I go back," she said, "if I sign the form… I have to claim her."

  "She's gone, Mara."

  "No," she said. The burn pulsed in time with her heartbeat. "If she's gone, why does this hurt?"

  "Because you're human. Because you loved her."

  "Because I *am* her."

  She pulled her hand away. The temptation of Option B was seductive. It offered a clean line. A world where death was final and separate, where she could grow old without carrying the ash of the core in her nerves. It was the comfortable lie. It was Humphrey watching his counterpart win the election and feeling nothing but vague pride.

  But Mara felt no pride. She felt loss. You don't grieve a counterpart like you grieve a self. You don't feel their death in your phantom limbs.

  She turned away from Julian. She couldn't hug him. Not yet. To hug him would be to pretend the split hadn't cost her half her life.

  "I have to go back," she said.

  "Mara, please. Just come home."

  "I can't. Not until I file it right."

  She returned to the control room. The screen was still waiting. The cursor blinked.

  *Option B: Counterpart Relation.* It promised sanity. It promised that the woman in the fire was a copy, a tool, a distinct entity that had served its purpose and broken. It promised that Mara was whole.

  *Option A: Numerical Identity.* It admitted that she was fractured. That she was both the one who lived and the one who died. That the grief was not empathy, but memory.

  Mara looked at her left arm. The pain was unbearable, a constant reminder of the branch that was pruned. If she chose B, the system would suppress the sensation. It would treat the pain as a bug to be patched.

  She realized then that the pain was the only proof she had that she mattered. If she was just a counterpart, then Beta's sacrifice was just code execution. If she was the same, then Beta's sacrifice was *her* sacrifice. It meant something.

  Her hand shook as she moved the mouse.

  She clicked Option A.

  The system chimed, a somber tone. *Identity Consolidated. Integrating Telemetry.*

  The pain in her arm didn't vanish. It sharpened, becoming real, becoming hers. She gasped, gripping the desk. Tears streamed down her face, hot and sudden. She wasn't mourning a stranger anymore. She was mourning herself.

  She typed her signature.

  Mara stood up, clutching her burning arm. She walked out of the control room to find Julian. She wouldn't tell him she was safe. She would tell him they were still waiting for the body. She would let him grieve, because she was grieving too.

  She pushed open the door to the lounge. Julian looked up, hope warring with dread in his eyes.

  Mara held up her left arm. The skin was still smooth, but she held it like it was broken.

  "I'm here," she said, her voice thick with the smoke of a fire that happened in another world. "But we lost so much."

  Julian stood up. He didn't see a survivor. He saw the woman who died, walking on borrowed time. He opened his arms, and this time, Mara walked into them. She let the pain wash over her, the proof that she was whole enough to feel the missing piece.

  She wasn't a copy. She was the remainder. And for now, in this branching, drifting world, that had to be enough.
