prompt: |-
  Okay so this is a weird combo but bear with me. We had a whole argument at work during a design review about whether a service that gets forked into a new instance and then drifts from its parent's config counts as "the same" instance or just a copy that resembles the original, and one of my coworkers, who minored in philosophy, said this is basically the exact debate that metaphysicians have between "counterpart theory" and "transworld identity." So I went down a Wikipedia/SEP rabbit hole on my lunch break and now I'm kind of obsessed. From what I can tell, David Lewis's counterpart theory says that when you say someone "could have" done something different in another possible world, its not literally that same person doing it there, its a "counterpart" -- a similar enough other person -- while the transworld identity camp (Kripke? i think) says its literally, numerically the same individual showing up in more than one possible world. Apparently there's a classic example about a guy named Humphrey and an election that I only half get, something about how its supposed to be cold comfort for Humphrey that a mere counterpart of his wins in some other world, since that's not really him winning.

  Anyway, I'd love a short story that actually makes that distinction come alive instead of explaining it in a lecture-y way, kind of like how Permutation City makes you feel the personal identity stuff instead of just stating it. Setting-wise: a programmer (or whatever job you think fits better) builds or stumbles into something that literally forks her into diverging versions of herself across branching worlds/timelines, basically a git branch but for a human being. I want the actual plot and emotional stakes to hinge on which theory is true -- like, does she owe the same loyalty/grief/whatever to her other branches depending on whether they're "just" resembling counterparts versus literally, numerically her -- rather than that being trivia in the background. Please don't have anyone stop and monologue the two theories, show the difference through what happens and what people actually decide and feel. Somewhere around 1000-1500 words is probably the right length. Thanks!
