prompt: |-
  I recently retired from international-level rifle competition and, somewhat to my surprise, was just elected to my national shooting federation's therapeutic use exemption panel for a three-year term — a seat that had always seemed like a formality when I was competing, and that I only really understand now that I'm the one voting. My first case landed on my desk last week, and after several days of back-and-forth with the other panel members by email, I've realized none of us can actually articulate a principled basis for the position we're each leaning toward, so I want to work out something more careful before we reconvene.

  The case: a nineteen-year-old member of our national air-rifle team was diagnosed two years ago, well before she made the national team, with an anxiety disorder that produces panic symptoms in ordinary life — she describes it flaring up during university exams and at family gatherings, nothing to do with sport. Her physician, who has no connection to shooting, prescribed a low daily dose of propranolol, a beta-blocker, which she has now taken for two years with clear benefit to her day-to-day functioning. Beta-blockers happen to be on our sport's prohibited list at all times, because they steady the hand and slow the heart rate in exactly the way that decides a 10-metre air rifle final; without an exemption she cannot compete while medicated. Our exemption standard, which tracks the international anti-doping code fairly closely, is supposed to require a genuine diagnosed condition, no reasonable alternative treatment, and — this is where we keep getting stuck — reasonable confidence that the substance won't enhance performance beyond what a return to ordinary health would give any competitor anyway. Half the panel thinks this is a straightforward case, no different from letting a diabetic athlete use insulin: she has a real, independently documented illness and takes an ordinary therapeutic dose, so it would be indefensible to make her choose between her mental health and her sport. The other half points out that in most sports the condition being treated is irrelevant to the skill being scored, whereas here the whole discipline is a competition in who can hold still and stay calm, so "restoring her to normal function" and "improving the exact trait we are judging" might just be the same event described two different ways — and no amount of sincerity about her diagnosis changes that.

  Could you draft the memo I'll bring back to the panel? I need an actual recommendation — grant, deny, or grant with specific conditions (dose caps, a requirement to exhaust non-pharmacological alternatives first, an independent annual re-certification, a defined review period, or whatever you think defensible) — with reasoning developed enough that whichever side loses can recognize that its strongest point was actually engaged rather than just waved at.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Retired international rifle competitor, newly elected to the National Shooting Federation's Therapeutic Use Exemption (TUE) panel.
      *   **Task:** Draft a memo for the panel regarding a specific TUE case.
      *   **The Case:** 19-year-old national air rifle team member. Diagnosed with anxiety disorder (panic symptoms) 2 years ago (pre-national team). Prescribed propranolol (beta-blocker) by independent physician. Effective for daily life (exams, family). Beta-blockers are prohibited *at all times* in shooting (performance-enhancing by steadying hand/heart rate).
      *   **The Conflict:**
          *   *Side A (Grant):* Genuine illness, therapeutic dose, unfair to force choice between health and sport (analogy: insulin for diabetes).
          *   *Side B (Deny):* In shooting, treating anxiety *is* enhancing performance (steadying/calmness is the skill). "Normal function" equals "competitive advantage."
      *   **The Standard:** Genuine diagnosis, no reasonable alternative, confidence that substance won't enhance performance *beyond* a return to ordinary health.
      *   **Requirement:** A specific recommendation (Grant, Deny, or Conditional) with robust reasoning that acknowledges the strongest points of both sides.
      *   **Tone:** Professional, principled, nuanced, authoritative but collaborative (it's a peer memo).

  2.  **Deconstruct the Ethical/Regulatory Problem:**
      *   *The Core Tension:* The WADA Code (and most federation rules based on it) requires that the substance not provide *additional* performance enhancement beyond restoring normal health. In most sports (e.g., running, swimming), treating asthma doesn't make you run faster than a healthy person; it just lets you breathe. In shooting, "healthy" implies a steady hand and calm heart. Propranolol directly induces this state. Therefore, treating the anxiety *inherently* provides the exact mechanical advantage the sport measures.
      *   *The Precedence:* The diagnosis predates the elite status. This is crucial. It argues against "gaming the system."
      *   *The "Ordinary Health" Standard:* What is "ordinary health" for a shooter? Is it a neurotypical baseline, or is it the baseline of the specific athlete? The Code usually implies the latter (restoring the *athlete* to their health potential), but the "no additional enhancement" clause is the trap. If the drug makes her steadier than a healthy non-anxious shooter, it's an enhancement.
      *   *Alternatives:* SSRIs? Therapy? CBT? Beta-blockers are often PRN (as needed), but she is on a daily dose. Are there non-beta-blocker treatments for performance anxiety specifically? Yes, but for general anxiety disorder (GAD) with panic, beta-blockers are sometimes used off-label or adjunctively, though SSRIs are first-line. The prompt says "low daily dose" for "day-to-day functioning," not just competition.

  3.  **Evaluate Potential Recommendations:**
      *   *Option 1: Outright Grant.* Risks undermining the integrity of the sport. If anxiety = beta-blockers, anyone could seek a diagnosis to get the mechanical advantage. It ignores Side B's valid point that the treatment *is* the performance enhancer.
      *   *Option 2: Outright Deny.* Cruel. She has a documented medical need unrelated to sport. Forces her to quit or go unmedicated. Ignores Side A's valid point about health equity.
      *   *Option 3: Conditional Grant (The "Goldilocks" Solution).* This is usually the most defensible path in bioethics and sports governance. It acknowledges the medical need while mitigating the performance advantage risk.
      *   *Conditions to consider:*
          *   *Exhaustion of Alternatives:* Has she tried SSRIs/CBT? Beta-blockers are often second-line for generalized anxiety, first-line for performance anxiety. Since her anxiety is general (exams, family), SSRIs might be more appropriate standard of care.
          *   *Dose/Timing:* If it's daily, can it be timed to minimize peak plasma during competition? (Hard with beta-blockers, half-life varies).
          *   *Monitoring:* Strict annual review.
          *   *The "Baseline" Argument:* We need to establish that the dose restores her to *her* normal, not a *super-normal* state.

  4.  **Develop the Reasoning (The "Principled Basis"):**
      *   We need to move beyond "Is she sick?" (Yes) to "Does this treatment violate the spirit of competition *in this specific sport*?"
      *   *Key Distinction:* Distinguish between *Generalized Anxiety Disorder (GAD)* and *Performance Anxiety*. She has GAD (exams, family). This supports Side A.
      *   *Key Concession:* Acknowledge Side B is right that the *mechanism* of relief overlaps with the *mechanism* of skill.
      *   *Resolution:* The TUE is justified *only if* the treatment is the standard of care for the *non-sport* condition, and no alternative exists that doesn't impact shooting. If SSRIs work for GAD without steadying the hand, she should take those. If she fails SSRIs, then propranolol might be necessary, but the performance advantage is an unavoidable side effect of treating the disability.
      *   *Refining the Standard:* The "return to ordinary health" clause is the sticking point. For a shooter with GAD, "ordinary health" might inherently include a chemical stabilizer. However, we must ensure the dose isn't optimized for shooting.

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Subject:** Clear and specific.
      *   **Opening:** Acknowledge the difficulty and the split vote. Validate both sides.
      *   **Analysis of Standard:** Break down the three criteria (Diagnosis, Necessity, Enhancement).
      *   **The Crux:** Address the "Enhancement vs. Restoration" paradox specific to shooting.
      *   **Recommendation:** Conditional Grant.
      *   **Conditions:**
          1.  Verification of treatment resistance (must try SSRIs/CBT first unless contraindicated).
          2.  Dose stabilization (no changes during season).
          3.  Annual review.
          4.  Independent monitoring.
      *   **Closing:** Reiterate the goal (integrity + athlete welfare).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is asking her to try SSRIs fair if propranolol works?
      *   *Correction:* It's standard medical practice for GAD. Beta-blockers are usually for somatic symptoms or performance anxiety, not primary GAD maintenance. If her doctor prescribed it for daily functioning, that's slightly unusual for GAD (usually SSRIs/SNRIs). This is a leverage point. We shouldn't deny, but we should require confirmation that this is the *best* medical choice, not just the *most convenient for shooting* choice.
      *   *Critique:* How do we address the "enhancement" worry?
      *   *Correction:* We admit the enhancement exists. We argue that *denying* medical care for a pre-existing condition amounts to discrimination based on disability. The "enhancement" is mitigated by ensuring the dose is the *minimum effective dose* for daily life, not optimized for competition.
      *   *Tone Check:* Ensure I don't sound like I'm lecturing the panel. I am a peer proposing a framework. Use "we" and "our panel."

  7.  **Final Polish:** Check against the prompt's requirements.
      *   Specific recommendation? Yes (Conditional Grant).
      *   Reasoning developed enough? Yes, addresses the "ordinary health" paradox.
      *   Acknowledges both sides? Yes.
      *   Tone appropriate? Yes, professional and thoughtful.

  8.  *(Final thought on the "Ordinary Health" clause)*: This is the hardest part. If a non-shooter takes propranolol, they don't get better at shooting. If a shooter takes it, they do. The "ordinary health" of *this athlete* requires the drug. The comparison class should be "healthy shooters," not "healthy humans." A healthy shooter has a steady hand. A treated anxious shooter *also* has a steady hand. The advantage remains. The only way to resolve this is to prioritize the right to participate over the absolute level playing field, *provided* the medical need is rigorous. This is a "Reasonable Accommodation" framework rather than a pure "Anti-Doping" framework. I need to make sure the memo reflects this shift in framing.

      *Decision:* I will frame the recommendation around the concept of "Minimum Necessary Intervention." If the drug is medically necessary for her to function as a human being, we cannot exclude her from sport simply because the side effect of functioning as a human being overlaps with the skill of the sport. However, we must ensure the intervention is strictly for human functioning, not sport optimization.

      *Wait, one more check:* The prompt says "low daily dose... clear benefit to day-to-day functioning." This supports the medical necessity. The prompt says "diagnosed two years ago... before national team." This supports lack of intent to cheat.
      *Okay, the Conditional Grant is definitely the strongest position.* It forces the medical justification to be robust (ruling out Side B's fear of gaming) while allowing participation (satisfying Side A).

      *Specific Condition:* I should suggest a "washout" or comparison? No, unethical to take her off meds. I should suggest independent verification of the diagnosis and treatment plan.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Therapeutic Use Exemption Committee, National Shooting Federation
  **FROM:** [Your Name], TUE Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Framework for Decision: TUE Application #2023-AR-04 (Propranolol)

  **1. Purpose**

  Following our initial email exchange regarding the TUE application of the 19-year-old air rifle athlete, it is evident that the panel is divided. One faction views this as a standard medical accommodation (analogous to insulin for diabetes); the other views it as an inherent conflict of interest between medical treatment and the fundamental skills of our sport (steadiness and heart rate control).

  Neither position is fully defensible on its own. The "standard accommodation" view ignores the unique pharmacological overlap between beta-blockers and shooting performance. The "inherent conflict" view ignores the athlete's right to participate in sport despite a pre-existing, non-sport-related disability.

  This memo proposes a principled framework to resolve this deadlock. It recommends a **Conditional Grant** of the TUE. This approach acknowledges the validity of the medical diagnosis while implementing safeguards to ensure the treatment does not drift into performance optimization.

  **2. Analysis of the TUE Standard**

  Our mandate requires us to satisfy three criteria. Here is where our current disagreement lies:

  *   **Criterion 1: Genuine Diagnosed Condition.**
      *   *Consensus:* The athlete meets this. The diagnosis predates elite status, is documented by an independent physician, and impacts non-sport domains (exams, social function). This rules out "competition-only" anxiety, which would be grounds for immediate denial.
  *   **Criterion 2: No Reasonable Alternative.**
      *   *Disagreement:* Side A assumes propranolol is the only solution. Side B suspects alternatives (SSRIs, CBT) exist but haven't been exhausted.
      *   *Analysis:* For Generalized Anxiety Disorder (GAD), clinical guidelines typically prioritize SSRIs/SNRIs or psychotherapy as first-line maintenance. Beta-blockers are often adjunctive or reserved for somatic symptoms. We cannot verify "no reasonable alternative" without confirming that first-line treatments were tried or are contraindicated.
  *   **Criterion 3: No Additional Enhancement Beyond "Ordinary Health."**
      *   *The Core Paradox:* In running, treating asthma allows an athlete to breathe *normally*; it does not give them extra lungs. In shooting, treating anxiety with a beta-blocker chemically induces the exact physiological state (low heart rate, reduced tremor) that defines "elite performance."
      *   *Resolution:* We must define "ordinary health" relative to *this athlete*, not a hypothetical neurotypical shooter. If her "ordinary health" is unattainable without medication, then restoring her to that baseline is not "enhancement"—it is accommodation. However, we must ensure the dose restores *health*, not *super-normalcy*.

  **3. Recommendation: Conditional Grant**

  I recommend we **grant the TUE subject to four specific conditions.**

  An outright denial effectively bans a healthy young citizen from her profession due to a medical condition unrelated to sport, which exposes the Federation to ethical and legal risk. An unconditional grant undermines the integrity of the prohibited list by acknowledging a drug that directly impacts the scoring metric.

  A conditional grant bridges this gap. It treats the TUE not as a permanent pass, but as a monitored medical accommodation.

  **The Conditions:**

  1.  **Verification of Treatment Resistance:**
      The athlete must provide a statement from her treating physician confirming that first-line treatments for GAD (e.g., SSRIs, SNRIs, or Cognitive Behavioral Therapy) were considered, tried, or deemed clinically inappropriate for her specific case. Propranolol must be established as the *minimum necessary intervention* for her daily functioning, not merely the most convenient for shooting.
      *   *Rationale:* This addresses Side B's concern. If an SSRI manages her anxiety without affecting heart rate/tremor, she must take the SSRI. We only permit the beta-blocker if it is medically necessary for her *life*, not just her sport.

  2.  **Dose Stabilization and Cap:**
      The TUE is valid only for the specific dosage currently prescribed (e.g., 10mg daily). Any increase in dosage requires immediate re-application and review. Dosage changes are prohibited during the competitive season unless medically urgent.
      *   *Rationale:* This prevents "optimization." A dose sufficient for a university exam may differ from a dose sufficient for an Olympic final. We lock the dose to the daily life requirement.

  3.  **Independent Annual Re-certification:**
      The TUE is valid for 12 months, not the full three-year term of our panel's oversight. Renewal requires updated documentation from her physician confirming the condition persists and the treatment remains effective and necessary.
      *   *Rationale:* Anxiety disorders can evolve. What is necessary at 19 may not be necessary at 21. This ensures the exemption sunsets if the medical need does.

  4.  **Competition-Specific Monitoring (Optional but Recommended):**
      We reserve the right to request post-competition plasma level checks to ensure the concentration matches the therapeutic range for daily anxiety management, rather than peak performance suppression.
      *   *Rationale:* This is our safeguard against the "enhancement" risk. If levels are consistently at the top of the therapeutic window during finals but lower during training, it suggests optimization.

  **4. Addressing the Panel's Concerns**

  **To the faction favoring Denial:**
  You are correct that propranolol enhances the specific traits we judge. However, denying this TUE sets a precedent that athletes with pre-existing disabilities must be "cured" to compete. If we deny this, we are effectively stating that the National Team is only open to athletes with neurotypical physiology. Our goal is to police *cheating*, not to police *health*. By enforcing the "Treatment Resistance" condition, we ensure we are not approving a performance drug, but rather accommodating a disability where the treatment unfortunately overlaps with the skill.

  **To the faction favoring Grant:**
  You are correct that her diagnosis is genuine and pre-dates her elite status. However, treating this as a formality (like insulin) ignores the reality of our sport. Insulin does not make a diabetic run faster than a non-diabetic; beta-blockers *do* make a shooter steadier than a non-medicated shooter. If we grant this without conditions, we open the door to future athletes seeking anxiety diagnoses specifically to access beta-blockers. We must demonstrate rigor to protect the integrity of the exemption system itself.

  **5. Conclusion**

  This case sits at the intersection of anti-doping integrity and disability accommodation. There is no perfect solution that eliminates all advantage, because the athlete's "normal" requires a substance that affects the sport's mechanics.

  However, a **Conditional Grant** allows us to prioritize the athlete's health and right to participate while maintaining strict oversight to ensure the medication is not leveraged for competitive gain beyond the restoration of her baseline health.

  I propose we adopt this framework for this case and, subsequently, draft a formal policy guideline for beta-blocker TUEs in shooting sports to ensure consistency for future applicants.

  I look forward to discussing this at our reconvening.

  **[Your Name]**
  TUE Committee Member
