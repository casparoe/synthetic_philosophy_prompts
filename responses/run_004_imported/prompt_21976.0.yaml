  2.  **Deconstruct the Core Concepts:**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the set of *actual* observers in your reference class. Tends to favor hypotheses where you are "typical" but doesn't inherently boost hypotheses just because they have *more* observers. It avoids the "Presumptuous Philosopher" problem but runs into the "Doomsday Argument" problem.
      *   **SIA (Self-Indication Assumption):** Reason as if you are a random sample from the set of *possible* observers. Effectively weights hypotheses by the number of observers they contain. More observers = higher prior probability for that hypothesis. This leads to the "Presumptuous Philosopher" problem (favoring the theory with trillion times more observers regardless of evidence) but avoids the Doomsday Argument.
