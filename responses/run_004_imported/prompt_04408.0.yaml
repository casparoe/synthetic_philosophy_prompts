      *   *Key Move:* James must distinguish between *hypothetical* evidence (which the Shipowner ignored) and *unobtainable* evidence (which the Climber faces). James should argue the Shipowner failed because he *could* have inspected the ship. It wasn't a "forced" option where evidence was impossible. He chose intellectual sloth, not a passional leap. This actually aligns them somewhat, but James needs to defend the *principle* of the Will to Believe against Clifford's use of the Shipowner.
      *   *Wait, the prompt asks:* "James has to explain why the shipowner isn't secretly off the hook by his own logic." This implies James needs to show why the Shipowner case doesn't disprove James's theory, OR James needs to find a way to partially vindicate the Shipowner to test Clifford. Let's go with the former: James explains why the Shipowner falls *outside* the Will to Believe protection, thus saving his own theory, while challenging Clifford on where the line is drawn.
      *   *Actually, re-reading the prompt:* "James has to explain why the shipowner isn't secretly off the hook by his own logic." This suggests James needs to engage with Clifford's claim that the Shipowner is guilty *even if the ship arrives safely*. James might argue: "If the ship arrives safely, the belief worked. Why is he guilty?" Clifford says "Habit." James says "Results."
      *   *Decision:* James will argue that the Shipowner is a bad example for Clifford's universal rule because it's a case of *avoidable* evidence. James will pivot to where evidence *isn't* avoidable.

  5.  **Drafting - Segment 2: Clifford tackles the Mountain Climber:**
      *   *James's Example:* The climber must believe he can jump to have the confidence to make it. Belief creates the fact.
      *   *Clifford's Attack:* This is dangerous wishful thinking. What if he's wrong? He dies. But more importantly, what does this habit do to his character?
      *   *Clifford's Strategy:* Attack the epistemic integrity. Just because a belief *helps* make something true doesn't mean it's *true* before the act. It's a self-fulfilling prophecy, which is a trick, not knowledge. Also, what about the next climber who tries it without the skill?
      *   *Key Move:* Clifford must argue that relying on "faith" undermines the discipline required to actually be good at climbing. It encourages recklessness.

  6.  **Developing the Dialogue Flow:**
      *   **Opening:** Establish the tension. Clifford holds the Shipowner file; James holds the Climber sketch.
      *   **Round 1 (James on Shipowner):** James admits the Shipowner is reckless but argues it's because he ignored *available* evidence, not because he believed without *any* evidence. James distinguishes "business facts" from "moral/religious hypotheses."
