  **Move 1 (Elena): Score 0**
  Elena correctly identifies the core intuition of costly signaling—that waste can convey information—but misapplies the specific biological definition. The Handicap Principle (Zahavi) strictly requires a receiver whose fitness depends on interpreting the signal honestly; without a strategic receiver who changes behavior, the "signal" lacks evolutionary function. However, she is not entirely wrong that the *logic* of costliness is present, even if the taxonomy is loose.

  **Move 2 (Marcus): Score 2**
  Marcus is technically correct regarding standard signaling game theory. A signal requires a Sender, a Receiver, and a response that validates the cost; without a receiver who updates beliefs and acts (like the server returning for future tips), the act is economically indistinguishable from waste. He rightly points out that signaling is a relational mechanism, not just a property of the act itself.

  **Move 3 (Elena): Score 1**
  Elena pivots to "self-signaling" (Bénabou & Tirole), which is a valid economic theory where agents infer their own types from their actions. This saves the "signal" classification by internalizing the receiver. However, this score is limited because it concedes Marcus's point about external receivers and shifts the debate to a different theoretical framework without acknowledging the shift fully.

  **Move 4 (Marcus): Score 2**
  Marcus accurately distinguishes between signaling (conveying private information) and commitment devices (constraining future choices to make threats/promises credible, per Robert Frank). If Theo's generosity is a fixed disposition he cannot easily turn off, it functions as a commitment, not a strategic signal. This highlights a genuine mechanistic difference that Elena glosses over.

  **Move 5 (Elena): Score 1**
  Elena correctly notes that differential cost is the engine of all separating equilibria, whether for single acts or character traits. However, she scores lower here because she uses this to conflate Handicap and Commitment again; while both rely on cost, Handicap implies strategic choice, whereas Frank's commitment implies a constraint on choice. Her logic is sound, but her terminology remains imprecise.

  **Overlooked Factors**
  Both friends overlook **reputation externalities**: even if the server doesn't return, Elena and Marcus might tell others, making the tip a signal to the broader social network. They also ignore **impure altruism** (the "warm glow" effect), where Theo derives direct utility from the act of giving itself, rendering signaling theory unnecessary to explain the behavior. Finally, neither considers that tipping norms might function as a **conventional signal**, where the cost is arbitrary but agreed upon, rather than biologically costly.

  **Best Categorization: Self-Signaling**
  The behavior best fits **self-signaling**. Since the external receiver conditions for the Handicap Principle are absent (no future interaction with the server, friends already know Theo's wealth), the primary information update occurs internally. Theo observes his own costly action and updates his belief about his own generosity, which stabilizes his self-concept and influences future behavior. This aligns with Elena's Move 3 but accepts Marcus's Move 4 that the mechanism is about maintaining a disposition (self-concept) rather than strategic communication with others. It is distinct from a pure Handicap because the "receiver" is the self, and distinct from a pure Commitment Device because the disposition is reinforced by the act rather than strictly constraining it.
