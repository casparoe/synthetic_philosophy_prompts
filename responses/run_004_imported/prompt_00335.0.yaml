          *   *Mechanism:* A non-conscious mental state becomes conscious when targeted by a distinct, non-conscious *thought*.
          *   *Nature of HO state:* Conceptual, propositional, cognitive. "I am in state M."
          *   *Analogy:* Thinking about a problem.
      *   **Higher-Order Perception (HOP) / Inner Sense:**
          *   *Proponents:* John Locke (historical), William Lycan (modern).
          *   *Mechanism:* A non-conscious mental state becomes conscious when scanned by an internal *perceptual* mechanism.
          *   *Nature of HO state:* Non-conceptual, analog, quasi-sensory. Like seeing or hearing, but internal.
          *   *Analogy:* Scanning a barcode or feeling a heartbeat.

  3.  **Identify "What's at Stake" (The Crucial Part):**
