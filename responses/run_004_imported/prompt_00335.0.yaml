      *   **1. Conceptual Possession (Cognitive Sophistication):**
          *   HOT requires concepts (e.g., to think "I am seeing red," I need the concept 'red' and 'seeing').
          *   HOP does not necessarily require concepts (a baby or animal can "sense" pain without conceptualizing it).
          *   *Stake:* Animal consciousness, infant consciousness.
      *   **2. The Nature of Qualia/Phenomenology:**
          *   HOT often struggles to explain *what it feels like* (qualia). Thoughts are dry; consciousness is rich.
          *   HOP tries to capture the richness by making the HO state perceptual (rich, analog).
          *   *Stake:* Explaining the subjective "feel" of experience.
      *   **3. Error and Misrepresentation:**
