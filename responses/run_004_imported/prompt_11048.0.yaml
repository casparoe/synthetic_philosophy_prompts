      *   *Section 2: Solving the Inconsistency (Fund vs. Company).* This is the most important part.
          *   *Factor A: Epistemic Access.* You knew the company's industry. You don't know the fund's strategy. One is "calculated risk" (to you), the other is "true uncertainty."
          *   *Factor B: Agency.* Fund = trusting a person/algorithm. Company = trusting a market/product you understand.
          *   *Factor C: Portfolio Role.* Savings (safety) vs. Early-stage (growth).
