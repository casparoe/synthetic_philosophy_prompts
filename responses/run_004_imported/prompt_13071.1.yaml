prompt: |-
  Two months ago I joined the reproductive ethics advisory committee at the fertility clinic where my partner and I did our own IVF cycle with preimplantation genetic testing the year before (screening for an unrelated inherited condition on my side of the family). The clinic wanted a patient representative sitting alongside the physicians and the staff bioethicist, and I did not expect to be handed something this difficult so soon.

  A couple currently in treatment has several viable embryos. Testing done for an unrelated reason happened to show that two of the embryos carry a gene for a moderate, non-life-threatening skeletal condition affecting height and joint mobility, which runs in the male partner's family; he has the condition himself and is active in an online community of people who share it. Rather than asking us to screen the affected embryos out, as most couples in this situation do, the couple has specifically requested that we transfer one of the affected embryos ahead of the unaffected ones, saying they want a child who will grow up sharing this part of his life and his extended family's history with it rather than feeling like the odd one out at reunions. They raised this preference before testing even began, so nobody on the committee thinks it's a rationalization invented after the fact, and this is likely their last funded cycle, so a denial would effectively end their options with us.

  The committee is split roughly down the middle. One group wants to treat the request as asking us to knowingly cause a disability in a future child and is pushing for a flat rule against ever transferring an affected embryo when unaffected ones from the same cycle are available. The other group, including our genetic counselor, argues that this framing quietly assumes something false: that transferring an unaffected embryo instead would spare this couple's child the condition, when it would actually just result in a different child being born, since the embryos are separate individuals from the start. They also point out that we approved elective sex selection for family balancing last year on autonomy grounds and want to know why this case should be treated any more strictly. Because I'm new and not yet identified with either camp, the chair has asked me to draft the memo the committee will vote on this coming Thursday, and I would rather not hand them something that just restates one side's talking points. Please draft that memo: it should recommend, concretely, whether we approve the transfer, deny it, or approve it subject to specific conditions, propose a standard general enough to guide comparable requests in the future, and engage honestly with the strongest argument on whichever side it ultimately doesn't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** New patient representative on a Reproductive Ethics Advisory Committee at a fertility clinic.
      *   **Context:** Partner and I did IVF/PGT here previously (for an unrelated condition).
      *   **Case:** A couple wants to transfer an embryo *known* to carry a gene for a moderate, non-life-threatening skeletal condition (affects height/joint mobility). The male partner has this condition and values his community identity. They have unaffected embryos available. This is likely their last funded cycle.
      *   **Committee Split:**
          *   *Side A (Non-Maleficence/Harm):* Transferring an affected embryo is knowingly causing disability. Should be banned when unaffected exist.
          *   *Side B (Autonomy/Non-Identity):* Selecting unaffected doesn't spare *this* child (it creates a *different* child). Precedent exists for elective sex selection (autonomy).
      *   **Task:** Draft a memo for the committee vote.
      *   **Requirements:**
          *   Recommend a concrete decision (Approve, Deny, or Approve w/ Conditions).
          *   Propose a general standard for future cases.
          *   Engage honestly with the strongest argument of the side *not* adopted.
          *   Avoid simply restating one side's talking points (needs nuance/synthesis).

  2.  **Determine the Ethical Landscape:**
      *   **The Non-Identity Problem:** This is the core philosophical hurdle. If you choose Embryo A (affected) over Embryo B (unaffected), Embryo B is never born. Embryo A cannot claim they were harmed by being born with the condition, because the alternative was non-existence. This weakens the "harm" argument significantly.
      *   **Disability Rights Perspective:** The condition is moderate, non-life-threatening. The father lives well with it and values the community. This challenges the medical model of disability (something to be fixed) vs. the social model (something to be accommodated/valued).
      *   **Clinician Integrity/Mission:** Does facilitating this violate the clinic's mission to "create healthy families"? Or does "healthy" include psychosocial alignment?
      *   **Precedent:** Sex selection for family balancing was allowed. This establishes that non-medical preferences can outweigh strict medical optimization *if* autonomy is the guiding principle.
      *   **Slippery Slope:** If we allow this, do we allow deafness? Dwarfism? Serious genetic disorders? A standard is needed to draw the line.

  3.  **Formulate a Recommendation:**
      *   *Option 1: Deny.* Hard to justify given the Non-Identity Problem and the sex selection precedent. Risks alienating the disability community and ignores patient autonomy.
      *   *Option 2: Approve Unconditionally.* Risks setting a precedent for severe conditions. Might make staff uncomfortable.
      *   *Option 3: Approve with Conditions/Guidelines.* This is the most balanced approach. It respects autonomy but sets boundaries to prevent harm (e.g., severe suffering).
      *   *Decision:* **Approve subject to specific conditions.** This acknowledges the validity of the couple's request while establishing a framework to prevent future requests for conditions causing significant suffering.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Case Summary:** Briefly recap the facts (moderate condition, father affected, unaffected embryos available, last funded cycle).
      *   **Ethical Analysis (The "Meat"):**
          *   *Autonomy & Precedent:* Cite the sex selection case. If we trust parents to choose sex, why not genetic traits that don't impair life expectancy?
          *   *The Non-Identity Problem:* Address Side A's concern. Acknowledge the intuition of "causing harm," but explain the philosophical counter (no harm to the specific child).
          *   *Disability & Well-being:* Distinguish between "life not worth living" and "life with disability." This condition is moderate.
      *   **The Counter-Argument (Requirement):** I need to engage honestly with the side *not* fully adopted. If I recommend approval, I must address the "Harm/Non-Maleficence" concern seriously. I need to acknowledge that *some* conditions *should* be excluded (the line-drawing problem).
      *   **Proposed Policy/Standard:** This needs to be concrete.
          *   Criteria: Severity, life expectancy, pain/suffering, capacity for consent/relationship.
          *   Process: Counseling requirements, waiting period, second opinion?
      *   **Conclusion:** Reiterate the commitment to ethical care.

  5.  **Refining the Tone:**
      *   Must sound professional, empathetic, and ethically rigorous.
      *   As a patient rep, I should bring the patient perspective but remain objective.
      *   Avoid jargon where possible, but use ethical terms correctly (non-maleficence, autonomy, non-identity).
      *   *Self-Correction during drafting:* I initially thought about suggesting a psychological eval. But that might be stigmatizing. Better to focus on *medical severity* thresholds and *informed consent*.
      *   *Addressing the "Last Funded Cycle" aspect:* This adds urgency but shouldn't dictate the ethics. However, denying effectively ends their treatment, which is a significant burden to weigh against the theoretical harm.

  6.  **Developing the Policy Standard:**
      *   We can't just say "yes to everything." We need a threshold.
      *   Threshold: Conditions that significantly reduce life expectancy or cause severe, unmanageable pain/suffering should be excluded.
      *   This condition (skeletal, moderate) falls below that threshold.
      *   Process: Enhanced counseling to ensure understanding of medical realities vs. social identity.

  7.  **Final Review against Constraints:**
      *   Recommend concrete decision? Yes (Approve with conditions).
      *   Propose general standard? Yes (The "Significant Suffering" Threshold).
      *   Engage strongest opposing argument? Yes (The Non-Maleficence/Harm argument).
      *   Tone check: Is it balanced? Yes.

  8.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "causing disability" and "selecting a child who will have a disability" is clear. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Make sure I don't sound *too* academic. I am a patient rep, not a philosopher. The voice should be grounded but informed. I need to make sure I explicitly mention the sex selection precedent as requested in the prompt.

  *(Final Plan)*:
  1. Header.
  2. Recommendation (Approve w/ Conditions).
  3. Context/Case Summary.
  4. Ethical Framework (Autonomy, Non-Identity, Disability).
  5. Addressing the Opposition (Harm Principle).
  6. Proposed Policy Guidelines.
  7. Closing.

