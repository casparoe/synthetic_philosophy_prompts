answer: |-
  The departure board flickered. Platform 4: Berlin. Platform 5: Paris. Departure in twelve minutes.

  Elias sat on the hard plastic bench, his thumbs pressing into the palms of his hands. He was an actuary for a reinsurance firm; his entire life was built on pricing the improbable. He knew the difference between risk and uncertainty. Risk was a dice roll. Uncertainty was not knowing the rules of the game.

  Tonight, he knew the rules. And they were broken.

  He had seen the man in the concourse an hour ago. Not a skeleton, not a specter. Just a man in a charcoal suit holding a leather ledger, standing perfectly still in the flow of rushing commuters. When their eyes met, the man hadn't smiled. He had simply tapped a pen against the ledger, looked at Elias, and then looked at the departure board.

  Elias knew the lore. He knew the decision theory. This wasn't about fate in the mystical sense. This was about correlation. The Man—let's call him the Collector—was a perfect predictor. He didn't chase. He didn't hunt. He simply went to the location where his model said Elias would be at midnight.

  If Elias went to Berlin, the Collector would be in Berlin.
  If Elias went to Paris, the Collector would be in Paris.

  The problem wasn't that Elias would die. The problem was that Elias could not construct a rational argument for *where* to die without invalidating the argument itself.

  He pulled the two tickets from his pocket. The paper felt slick with sweat.

  "Okay," Elias whispered. "Update priors."

  He closed his eyes. He imagined himself choosing Berlin. He visualized the train ride, the arrival, the hotel check-in. In that simulation, he was a man who had decided on Berlin. But if he was the kind of man who decided on Berlin, the Collector's model would have flagged Berlin hours ago. The Collector would already be in the lobby of the Hotel Adlon, waiting. Therefore, the expected utility of Berlin was negative infinity.

  "Right," Elias muttered. "So, Paris."

  He shifted his mental weight. He imagined the Gare du Nord. The rain. The taxi. But the moment he felt the relief of committing to Paris, the logic inverted. If he was the kind of man who pivoted to Paris to avoid the prediction, then the prediction *was* Paris. The Collector's model accounted for Elias's avoidance strategy. The model accounted for Elias's knowledge of the model.

  It was a loop with no floor.

  Elias opened his eyes. The departure board read *08 Minutes*.

  "I need to randomize," he said to no one. "Mixed strategy."

  If he flipped a coin, the Collector couldn't predict the outcome. But Elias knew himself. He wasn't a coin. He was a cognitive engine. If he flipped a coin and it came up heads, he would wonder if he should call it a best-of-three. If it came up tails, he'd wonder if the coin was weighted. His brain would try to interpret the randomization, and that interpretation was data. The Collector didn't need to predict the coin; he only needed to predict how Elias would *react* to the coin.

  Elias stood up. His legs felt heavy, as if the gravity in the terminal had increased. He walked toward Platform 4. The Berlin train was visible, silver and sleek.

  *If I step onto this train,* Elias thought, *I am confirming the prediction.*

  He stopped. His foot hovered over the yellow safety line.

  If he stepped back, that hesitation was also data. A man who hesitates is a man who is unsure. A man who is unsure might default to his original preference. Or he might panic and run the other way. The Collector's model was sufficiently advanced to ingest Elias's hesitation as an input variable.

  There was no move that was not evidence.

  He turned sharply and walked toward Platform 5. The Paris train was loading. People were shoving bags into racks. A normal life was happening three meters away from him. A life where cause preceded effect. A life where you could choose a city because you liked the food, not because you were trying to outmaneuver a predictor who used your choice as the premise for his location.

  Elias reached into his pocket for the Paris ticket. As his fingers brushed the paper, a cold spike of certainty hit his gut.

  *You want this ticket,* his mind said. *Therefore, he knows you want this ticket.*

  The desire to live was the very mechanism that killed him. If he didn't care, he might be unpredictable. But he cared. He cared desperately. His rationality was a beacon. Every time he tried to calculate the safest path, he was essentially handing the Collector his itinerary.

  *04 Minutes.*

  Elias walked back to the bench. He sat down. He put the tickets on his knees.

  "Checkmate," he said.

  It wasn't that he couldn't move. It was that no direction he moved could be labeled "rational." In Newcomb's Problem, you could at least pick one box and defend it with Evidential Decision Theory. Here, the evidence was reflexive. His decision *created* the threat.

  He looked at the concourse. The man in the charcoal suit was gone. He didn't need to be visible. He was already at the destination. Whichever destination Elias chose.

  Elias stood up again. He took a step toward Berlin.
  *Wrong,* his brain screamed. *He's there.*
  He took a step toward Paris.
  *Wrong,* his brain screamed. *He's there.*

  He stood in the middle of the concourse, a pivot point between two deaths. The announcer's voice crackled over the PA system, final call for both trains. The crowd began to surge, a river of people flowing around the stone of Elias's indecision.

  He realized then that the trap wasn't the Collector. The trap was the requirement to be a rational agent in a system that punished rationality. To survive, he would have to be insane. He would have to genuinely, truly not care which train he took. He would have to lobotomize his own predictive capacity.

  He looked at the Berlin train. The doors began to hiss shut.
  He looked at the Paris train. The conductor raised a flag.

  Elias opened his mouth to speak, to shout, to make a sound that wasn't a calculation. But he knew that even a scream was a release of tension, a signal of intent.

  He raised his left foot. He lowered it.
  He raised his right foot. He lowered it.

  The trains began to move. The silver shapes slid silently out of the station, accelerating into the dark tunnels. The platform emptied. The lights above flickered, dimming for the night cycle.

  Elias stood between the empty tracks. He had not chosen. He had not survived. He was simply suspended in the moment of calculation, a variable that could not resolve itself. He waited for the Collector to arrive at the station, knowing that in failing to choose a city, he had only ensured the Collector would find him exactly where he was: stuck in the logic, waiting for an answer that didn't exist.

  He looked down at the tickets on the bench. They were still there. He hadn't even torn them.

  "Expected utility," Elias whispered to the empty platform. "Undefined."

  He sat back down. He picked up the Berlin ticket. He looked at it. He put it down. He picked up the Paris ticket. He looked at it. He put it down.

  The station clock ticked. One second. Two seconds. The gap between the ticks was where the decision was supposed to happen. But the gap stretched, and stretched, and Elias remained inside it.
