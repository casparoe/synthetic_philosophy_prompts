  Turing is inspecting the chamber prepared for the Imitation Game.

  "The soundproofing is adequate," he notes. "The visual barrier is secure. But I see no provision for telepathic shielding."

  "Sir," says the engineer, "it's a computer test. The machine doesn't have telepathy."

  "Not the machine," Turing insists. "The human. The statistical evidence for telepathy is overwhelming. If we don't line the walls with lead, the contestant might psychicly win the card-identification task."

  "But if the human guesses the cards correctly," the engineer asks, "doesn't that prove they're human?"

  "No," Turing replies. "It proves they're psychic. And I refuse to let a machine fail a thinking test because the human brought a ghost to the exam. It's hard enough for the machine to simulate a human mind; I won't ask it to simulate a psychic."
