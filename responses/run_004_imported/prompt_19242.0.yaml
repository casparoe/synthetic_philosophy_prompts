      *   **Conflict:** Stability for the child vs. relationship freedom/equality for adults. Some board members argue treating parents differently is unfair/special pleading. Others argue the child didn't consent to the arrangements and bears the risk.
      *   **Governance Style:** Prefer explicit, generally applicable norms over case-by-case exceptions.
      *   **Task:** Draft a board policy memo.
      *   **Requirements:** Recommend a specific rule with an effective date. Address the objection about treating parents differently (substantive answer).

  2.  **Determine the Stance/Recommendation:**
      *   *Option A: Ban new partners.* (Too restrictive, infringes on adult autonomy, likely unenforceable, sets a bad precedent for the co-op culture).
      *   *Option B: Do nothing/Status Quo.* (Ignores the child's welfare, risks escalating conflict, potentially negligent regarding the child's environment).
      *   *Option C: Middle Ground/Process-Oriented.* (Focus on *how* new partners are introduced and the stability of the *household*, not just the *relationship*. Create a policy that applies to *everyone* but acknowledges the heightened stakes when children are present).
      *   *Decision:* The prompt asks for a "substantive answer to the objection that treating parents' households differently is just special pleading." This implies I need to justify *some* differentiation or a specific rule that addresses the child's needs without violating the co-op's principles. However, the co-op's history is "generally applicable norms." A rule that says "Parents can't have partners" is discriminatory. A rule that says "Everyone needs approval for new long-term guests" is bureaucratic but fair.
      *   *Refined Decision:* The best approach for a co-op is to strengthen the *process* for introducing new long-term residents, with specific considerations for households involving minors. This upholds the "generally applicable norm" principle while acknowledging the "non-consenting stakeholder" (the child).
      *   *The Rule:* A "Household Stability & New Resident Integration Protocol." It shouldn't ban partners, but it should require a transition period and consensus among *all* adult housemates, with a specific feedback mechanism regarding the child's well-being.
      *   *Addressing the Objection:* The key argument is that children are *vulnerable stakeholders* who cannot vote or move out. Adults enter the co-op voluntarily; children do not. Therefore, the threshold for changing the environment in a child's primary residence is legitimately higher, not because parents are special, but because the *dependents* are vulnerable.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the recent tension without getting bogged down in the specific drama. State the purpose (clarify policy).
      *   **Guiding Principles:** Reiterate the co-op's values (autonomy, community, stability).
      *   **The Objection (The Core Argument):** I need to tackle the "equality" argument head-on.
          *   *Argument:* Equality means treating likes alike. Adults with children are not in the same situation as adults without children regarding housing stability.
          *   *Key Point:* The child is a non-consenting resident. The co-op has a duty of care.
          *   *Nuance:* It's not restricting *relationships*; it's regulating *household composition changes* where minors are affected.
      *   **The Policy Recommendation:**
          *   Needs to be general (apply to all new long-term guests/partners) but have a clause for minors.
          *   *Rule:* "New Long-Term Resident Integration Period."
          *   *Details:* 30-60 day trial? Consensus of housemates?
          *   *Specific to Minors:* If a minor lives in the unit, the co-parent (even if non-resident?) or a child advocate might need to be consulted? No, that gets too legalistic. Let's stick to the Housemates' consensus + a "Child Impact Statement" or similar.
          *   *Actually, keep it simpler:* A mandatory "Integration Period" for *any* new long-term guest (over 30 days). For households with minors, this period is extended or requires a specific check-in.
          *   *Better:* Let's propose a "Household Composition Change Protocol." All new long-term residents (partners included) require house consensus. In households with minors, the consensus must explicitly consider the minor's routine and stability.
      *   **Effective Date:** Give them time to adjust. 30 days from issuance.
      *   **Closing:** Reiterate commitment to the community.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "households with minors get extra scrutiny" discriminatory?
      *   *Correction:* Frame it as "Duty of Care." The co-op accepts minors as residents. Therefore, the co-op assumes responsibility for their environment. It's not about restricting the parent's rights; it's about fulfilling the co-op's obligation to the child resident.
      *   *Critique:* The ex-partner wants a ban until age 18. That's unreasonable.
      *   *Correction:* The policy must reject the ban but offer a process that ensures stability. The memo should implicitly say "No, we aren't banning partners, but we are slowing down the process."
      *   *Tone:* Diplomatic, firm, principled, community-focused. Avoid taking sides in the specific breakup but address the underlying structural issue.

  5.  **Finalizing the Policy Details:**
      *   **Rule:** "New Long-Term Guest & Resident Integration Policy."
      *   **Definition:** Anyone staying > 14 nights/month for > 2 months.
      *   **Process:** House meeting, trial period (3 months).
      *   **Child Clause:** If a minor resides in the unit, the Integration Plan must include a "Stability Maintenance Plan" (routine, privacy, etc.) agreed upon by all adult housemates.
      *   **Addressing the Objection:** The "Non-Consenting Stakeholder" argument. Adults choose to live there; children don't. High bar for changing a child's home environment is not "special pleading" for parents, it's "protective governance" for dependents.

  6.  **Review against Constraints:**
