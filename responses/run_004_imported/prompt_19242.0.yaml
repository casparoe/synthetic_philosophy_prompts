  *Revised Plan for the "Objection" section:* Focus on the asymmetry of consent. Adults opt-in; children are brought in. Therefore, the threshold for environmental change is higher. This isn't privileging parents; it's protecting vulnerable residents.

  *Revised Plan for the Rule:* Apply to *all* new long-term residents, but add a specific "Minor Impact Assessment" for units with children. This keeps the rule generally applicable but acknowledges the specific risk.

