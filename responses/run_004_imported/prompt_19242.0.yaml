answer: |-
  **MEMORANDUM**

  **TO:** Membership of the Housing Cooperative
  **FROM:** Governance Board
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Update: Household Composition Changes and Minor Resident Stability

  **1. Context and Purpose**

  Recent discussions within the cooperative have highlighted a tension between two of our core values: the autonomy of adult members to structure their personal relationships, and the collective responsibility to maintain a stable environment for all residents, particularly minors. 

  While our cooperative has historically resolved conflicts through generally applicable norms rather than case-by-case exceptions, the presence of children in the community introduces a stakeholder who cannot vote, cannot consent to housing agreements, and cannot choose to move if the environment becomes volatile. 

  This memo outlines a new policy regarding the introduction of new long-term residents into shared units. It is designed to uphold adult autonomy while formally acknowledging our duty of care toward child residents.

  **2. Addressing the Principle of Equal Treatment**

  During deliberations, a significant objection was raised: *Does creating specific protocols for households with children violate our principle of equality? Is this not special pleading dressed up as concern for the child?*

  The Board's substantive answer is no. Equality in governance means treating like cases alike, but it also requires recognizing materially different stakes. 

  Adult members of this cooperative enter into a voluntary contract. They accept the risks of community living, including the turnover of housemates and partners. They possess the agency to move out if the living situation becomes untenable. A child resident possesses none of these rights. They are non-consenting stakeholders brought into the environment by their guardians. 

  Therefore, raising the threshold for changing the composition of a household that includes a minor is not a restriction on the *parent's* rights, nor is it a privilege granted to parents. It is a **protective governance measure for the child.** 

  To treat a household with a dependent exactly the same as a household of unattached adults would be to ignore the asymmetry of risk. The adult seeking to move a partner in risks relationship friction; the child risks the destabilization of their primary home. Our policy must reflect that difference without policing the private relationships of adults. We are not regulating who members love; we are regulating the pace at which the physical and social environment of a dependent child is altered.

  **3. New Policy: Integrated Resident Protocol (IRP)**

  Effective **November 26, 2023**, the following protocol applies to all units within the cooperative.

  **A. Definition of Long-Term Guest**
  Any individual staying in a unit for more than 14 nights per month over a consecutive two-month period is classified as a Long-Term Guest and is subject to this protocol.

  **B. Standard Integration Process (All Units)**
  1.  **Notice:** The resident intending to host the Long-Term Guest must provide written notice to all adult housemates and the Board at least 30 days prior to the anticipated start of the long-term arrangement.
  2.  **Consensus:** All adult housemates in the specific unit must reach consensus on the arrangement.
  3.  **Trial Period:** A mandatory three-month trial period applies. During this time, any adult housemate in the unit may call a review meeting if the arrangement negatively impacts household functioning.

  **C. Additional Provisions for Households with Minors**
  In units where a minor resides, the following additional provisions apply to the Integration Process:
  1.  **Stability Plan:** The hosting resident must submit a brief "Stability Plan" alongside the notice. This is not a request for permission to date, but a logistical outline covering:
      *   Sleep arrangements and privacy boundaries.
      *   Maintenance of the child's existing routine (meals, bedtime, noise levels).
      *   Conflict de-escalation protocols (how adult disagreements will be kept out of the child's earshot).
  2.  **Board Review:** The Board will review the Stability Plan to ensure it meets basic safety and welfare standards. The Board reserves the right to delay the approval of the Long-Term Guest status if the plan indicates a high risk of disruption to the minor's primary living environment.
  3.  **No Veto for Non-Residents:** While the welfare of the child is paramount, veto power regarding new residents rests solely with the adult housemates and the Board. Non-resident co-parents do not hold governance authority over the unit, though their concerns regarding the child's welfare may be submitted to the Board for consideration during the Stability Plan review.

  **4. Implementation and Grandfathering**

  *   **Current Arrangements:** Any individual currently residing in a unit under the definition of "Long-Term Guest" prior to the Effective Date must be regularized under this policy within 60 days.
  *   **Conflict Resolution:** Disputes arising from this policy will be handled through our standard mediation channel. However, in cases involving minors, the mediator will be instructed to prioritize the minor's need for routine and safety as a primary constraint.

  **5. Conclusion**

  This policy rejects the request to ban partners until a child turns eighteen, as such a rule would constitute an unreasonable restriction on adult autonomy and is unenforceable in a cooperative of peers. However, it also rejects the notion that the child's presence is irrelevant to housing governance. 

  By slowing down the process of household integration and requiring a concrete plan for stability, we acknowledge that while adults are free to change their minds about relationships, a child's home should not change around them at the same speed.

  **Approved by the Governance Board**
