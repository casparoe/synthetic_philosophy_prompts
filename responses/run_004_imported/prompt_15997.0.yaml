prompt: |-
  I sit on the volunteer committee that awards our town's annual Good Neighbor Award, given each year to the resident judged to have 'served the community with distinction'—our only criterion, and it says nothing about motive. Our strongest candidate ran the most successful toy drive the town has seen, but she told us plainly in her interview that she started it as a marketing idea for her shop and keeps it going partly for that reason, even though she also says she's grown genuinely attached to the families involved and puts in far more unpaid time than any marketing plan would require. Some committee members want to pass her over for a less impressive but more clearly selfless candidate; others think that would just punish her for honesty, since no past winner's motives were probably pure either. We need to decide before Friday's ceremony program goes to print. Could you draft the short memo I'll send the committee, recommending how to decide the case and giving a genuinely fair hearing to whichever side we don't adopt?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the volunteer committee for the town's Good Neighbor Award.
      *   **Task:** Draft a short memo to the committee.
      *   **Purpose:** Recommend how to decide the case (the toy drive organizer vs. the selfless but less impressive candidate) and give a fair hearing to the opposing view.
      *   **Constraint:** Decision needed before Friday (program print deadline).
      *   **Key Criteria:** The award criterion is *only* "served the community with distinction." It says nothing about motive.
      *   **The Conflict:**
          *   Candidate A (Toy Drive): High impact/distinction, admitted mixed motives (marketing + genuine care), puts in unpaid time exceeding marketing value.
          *   Candidate B (Alternative): Lower impact, perceived as more selfless/pure motives.
          *   Committee Split: Some want to penalize Candidate A for motives; others think that punishes honesty and assumes purity where none exists.

  2.  **Determine the Stance/Recommendation:**
      *   The prompt asks me to recommend *how to decide*, not necessarily to pick a winner myself (though a recommendation usually implies a lean). However, to make the memo effective, I need to propose a framework for decision-making based on the award's stated criteria.
      *   *Logical Analysis:* The criterion is "served the community with distinction." It does *not* say "with pure motives."
      *   *Ethical Analysis:* Penalizing honesty about mixed motives creates a perverse incentive (lie about motives). Impact matters more than internal psychology for a "service" award.
      *   *Recommendation:* I should recommend awarding Candidate A (the toy drive organizer) based on the text of the criterion, while acknowledging the validity of the concern about spirit/intent.
      *   *Fair Hearing:* I must articulate why someone might vote for Candidate B (the importance of modeling altruism, the risk of commercializing the award).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the urgency (Friday deadline) and the purpose of the memo (facilitate a final vote).
      *   **The Core Criterion:** Remind everyone of the *only* official rule: "served the community with distinction."
      *   **Argument for Candidate A (The Recommendation):**
          *   Focus on "Distinction." The toy drive was the "most successful... the town has seen."
          *   Motive is irrelevant per the text.
          *   Outcome over intent.
          *   Honesty should be rewarded, not punished.
          *   She exceeds marketing ROI (unpaid time), proving commitment beyond business.
      *   **The Counter-Argument (Fair Hearing for Candidate B):**
          *   Why do some members prefer the other candidate?
          *   The award represents community *values*, not just metrics.
          *   Fear of commercialization (a business using the award for further marketing).
          *   The symbolic power of "selflessness" in a "Good Neighbor" title.
          *   Valid concern: We don't want the award to feel like a "Best Business PR" award.
      *   **Synthesis/Path Forward:**
          *   Reiterate that while values matter, the written criterion binds us.
          *   Suggest a vote based strictly on the text.
          *   Propose a future review of criteria if the committee feels "motive" should be added.
      *   **Closing:** Call to action (meeting time/vote).

  4.  **Refining Tone:**
      *   Needs to be respectful, diplomatic, but decisive.
      *   Avoid accusing either side of being wrong; frame it as "Textual Interpretation" vs. "Spirit of the Award."
      *   Keep it short (it's a memo to busy volunteers).

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is leaning too hard toward Candidate A ignoring the "Good Neighbor" title?
      *   *Fix:* Acknowledge that "Good Neighbor" implies warmth, but "Distinction" implies measurable impact. Ensure the counter-argument regarding the *symbolism* of the award is robust.
      *   *Critique:* Did I meet the "fair hearing" requirement?
      *   *Fix:* Make sure the section on the "Selfless Candidate" isn't a strawman. Validate the concern about mixed motives.
      *   *Critique:* Is the deadline clear?
      *   *Fix:* Mention Friday in the opening and closing.

  6.  **Final Polish:** Check for clarity, brevity, and neutrality in the presentation of the conflict, even if the recommendation is clear. (Decided to recommend Candidate A because the prompt emphasizes the criterion says *nothing* about motive, making that the stronger logical position, but I will frame it as adhering to the mandate.)

      *(Self-Correction)*: Actually, looking at the prompt again: "recommending how to decide the case." I can recommend a *process* or a *verdict*. A verdict is more helpful for a committee stuck in deadlock. I will recommend awarding the Toy Drive candidate based on the written criteria, but strongly validate the other side's concern about the award's long-term reputation.

  7.  **Final Output Generation** (similar to the provided good response).
      *   Subject Line: Urgent: Good Neighbor Award Decision Framework.
      *   Structure: Context, Criterion Analysis, Argument for Impact (Candidate A), Argument for Intent (Candidate B), Recommendation.

  8.  **Wait, one nuance:** The prompt asks to "give a genuinely fair hearing to whichever side we don't adopt." If I recommend Candidate A, I must treat Candidate B's supporters with respect. If I recommend Candidate B, I must treat Candidate A's supporters with respect.
      *   *Decision:* The stronger logical argument lies with Candidate A because the criterion explicitly excludes motive. It is easier to argue "follow the rules" than "ignore the rules for vibes." I will recommend Candidate A but validate the "Spirit of the Award" argument.

      *(Wait, let's look closer)*: "giving a genuinely fair hearing to whichever side we don't adopt." This implies I need to choose a side in the recommendation. I will choose the side that aligns with the written criteria (Candidate A) because it's the most defensible position for a committee liable for fairness.

