answer: |-
  You have hit on one of the most genuinely perplexing and often glossed-over tensions in *Principia Ethica*. Your reading is correct: Moore *is* flirting with a conclusion that seems to contradict the "humanist" vibe everyone takes from Chapter 6.

  The EA/rationalist canon tends to treat §122 as a footnote to the "two great goods" soundbite (aesthetic enjoyment + personal affection). But if you actually parse the argument structure, Moore is making a much weirder, more specific claim about the **value of consciousness** versus the **value of objects**.

  Here is a close reading of the argument structure in §122, followed by an analysis of the "bullet bite" and the methodological tension you spotted.

  ### 1. The Argument Structure of §122

  Moore is analyzing **Personal Affection** as an **Organic Unity**. To understand the value of the whole, he attempts to weigh the contribution of its parts using the **Method of Isolation**.

  **Premise 1: The Composition of Affection**
  Valuable personal affection is not just an emotion. It is a complex state of consciousness directed at an object. That object has two components:
  *   **A:** Mental qualities (virtue, character, intellect).
  *   **B:** Corporeal expressions (face, voice, actions, physical presence).

  **Premise 2: The Value of the Objects (Ontological Status)**
  *   **A (Mental Qualities):** Possess *great intrinsic value* (they are "good" in themselves).
  *   **B (Corporeal Qualities):** Possess *beauty*, but Moore is hesitant to say they possess "intrinsic value" (goodness) in the same moral sense. They are aesthetically valuable, but not morally "good."

  **Premise 3: The Method of Isolation (The Crucial Move)**
  Moore asks: What is the intrinsic value of the *conscious state of appreciating* A, compared to the *conscious state of appreciating* B, if we strip away the emotion of affection itself?
  *   *Isolation A:* Cognition of mental qualities alone (coldly recognizing someone is virtuous, without love or physical presence).
  *   *Isolation B:* Appreciation of corporeal beauty alone (aesthetic enjoyment of a form, without knowing the character).

  **Observation:**
  Moore claims it is "very difficult to imagine" Isolation A. But to the extent we can, it seems "dry."
  Conversely, Isolation B is the definition of one of the two supreme goods (**Aesthetic Enjoyment**).

  **Conclusion 1 (The Comparative Claim):**
  It is "doubtful" whether Isolation A (appreciating virtue) has as much intrinsic value as Isolation B (appreciating beauty).
  *   *Translation:* The *experience* of noticing a pretty face is a more valuable state of consciousness than the *experience* of noticing a good soul, **if** neither is accompanied by the emotion of love.

  **Conclusion 2 (The Synthetic Claim):**
  Therefore, the value of admiring mental qualities lies **not** in its isolated intrinsic value, but in its capacity to enhance the **Organic Whole**.
  *   When you combine [Emotion of Affection] + [Appreciation of Mental] + [Appreciation of Corporeal], the result is vastly superior to any sum of parts.
  *   The mental qualities are essential because they make the *object* worthy, which heightens the *whole*, even if the *cognition* of them is less potent than the *cognition* of beauty.

  ### 2. Is He Biting the Bullet?

  **Yes, but with a specific metaphysical distinction.**

  You asked: *Is he actually concluding that appreciating someone's character, in isolation, is worth less than appreciating their body in isolation?*

  **Textually: Yes.**
  Moore writes: *"whether the appreciation of what has great intrinsic value [mental qualities] is so valuable as the appreciation of what is merely beautiful [corporeal]."*

  **Philosophically: It depends on what you mean by "worth."**
  Moore is an Ideal Utilitarian. He cares about the sum total of **good states of consciousness** in the universe.
  *   He believes **Virtue** is a better *object* than **Beauty**. (A good soul is better than a pretty rock).
  *   However, he believes the **Consciousness of Beauty** is a more intense/valuable *state of mind* than the **Consciousness of Virtue**.

  This is the "insane" bullet he is biting. He is arguing that **Aesthetic Enjoyment** is the most potent generator of intrinsic value per unit of consciousness. Recognizing moral goodness is a "colder" cognitive act. Recognizing beauty is a "hotter" aesthetic act.

  So, if you had a universe with only one conscious being in it:
  *   **Universe 1:** They spend 1 hour admiring a morally perfect soul they cannot touch or love.
  *   **Universe 2:** They spend 1 hour admiring a morally empty but beautiful sunset (or body).
  *   **Moore's Verdict:** Universe 2 is likely better (or at least, it's doubtful Universe 1 is better).

  This is why the Bloomsbury Group could swallow this. They were aesthetes. The idea that "appreciation of beauty" is the highest form of value generation fit their worldview perfectly, even if it meant subordinating "moral recognition" to "aesthetic recognition" in the hierarchy of conscious states.

  ### 3. The Methodological Tension (Your Best Point)

  You asked: *Isn't there something fishy about applying the isolation method to "cognition of mental qualities alone"... given his own earlier warnings?*

  **You are absolutely right to be suspicious here.** This is the point where Moore's system strains against its own seams.

  **The Tension:**
  In Chapter 6, Moore insists that **Organic Unities** mean the value of the whole is not proportional to the sum of the values of the parts. He warns us repeatedly that isolating parts can lead to false conclusions about the whole.
  *   *Standard Moore:* "You can't judge the value of revenge by isolating the pleasure; you must look at the whole context."
  *   *§122 Moore:* "Let's isolate the cognition of virtue from the emotion of affection to see how valuable it is."

  **Why he does it (The Defense):**
  Moore is trying to establish the **Fundamental Goods**. He needs to know the "atoms" of value to understand how they combine. He believes there are only a few fundamental intrinsic goods (Aesthetic Enjoyment, Personal Affection, Knowledge). To prove they are fundamental, he has to show they hold value in isolation.
  *   He needs to prove Aesthetic Enjoyment is a fundamental good. To do that, he must show it has value without moral context.
  *   He needs to prove Personal Affection is a fundamental good. To do that, he has to show it's not *just* the sum of Aesthetic Enjoyment + Moral Approval.

  **The Contradiction:**
  The contradiction arises because "Cognition of Mental Qualities" is **not** a natural atom for Moore. It is an abstraction. In reality, recognizing virtue usually *involves* emotion. By forcing the isolation, he creates a "zombie cognition"—a state of mind that barely exists.
  He admits this: *"It is, indeed, very difficult to imagine what the cognition of mental qualities alone... would be like."*

  **The Verdict on the Fishiness:**
  He is violating his own Organic Unity principle to satisfy his reductionist urge to rank the "sources" of value. He wants to say "Aesthetic Enjoyment is Source A, Affection is Source B." But to do that, he has to artificially drain the emotion out of Affection to see what's left.
  When he drains the emotion, he finds that "Moral Approval" is weaker than "Aesthetic Enjoyment."
  But this undermines his own point that Affection is a *sui generis* good. If Affection is just [Emotion + Moral Approval + Aesthetic Enjoyment], and Moral Approval is weak, then Affection is mostly just Emotion + Aesthetic Enjoyment.
  Moore wants to have it both ways: Affection is a unique, irreducible whole, *but* we can still rank its ingredients to see which is stronger.

  ### 4. Why the "One-Liner" Survived

  Given this mess, why does everyone quote the "personal affection + aesthetic enjoyment" line and ignore §122?

  1.  **Pragmatic Utility:** For EA and Rationalists, the takeaway is "Focus on these two things, ignore hedonism." The internal ranking of the components doesn't change the action guide.
  2.  **Bloomsbury Selective Reading:** The Bloomsbury Group (Keynes, Woolf, Strachey) loved Moore because he gave them permission to prioritize art and love over Victorian duty. They latched onto the conclusion ("Affection and Beauty are the best things") and ignored the mechanistic breakdown that suggested appreciating a body might be "more valuable" than appreciating a soul. They likely interpreted "corporeal expression" as the *embodiment* of the soul, not the "mere body" Moore isolates.
  3.  **The "Doubtful" Hedge:** Moore uses weasel words. "It seems very doubtful," "It even appears to be doubtful." He doesn't assert it as dogma. This allows later interpreters to smooth it over.

  ### Summary

  *   **Is he biting the bullet?** Yes. He argues that the *conscious experience* of appreciating beauty is intrinsically more valuable than the *conscious experience* of appreciating virtue, provided both are isolated from the emotion of love.
  *   **Is it fishy?** Yes. It violates the spirit of the Organic Unity doctrine he spends the rest of the chapter defending. He isolates a part that cannot naturally exist in isolation to prove a point about value hierarchy.
  *   **The Resolution:** Moore is distinguishing between the **Value of the Object** (Virtue > Body) and the **Value of the Consciousness** (Appreciation of Body > Appreciation of Virtue). He sacrifices the latter ranking to save the former, arguing that the *combination* (Affection) is the true ideal, even if one ingredient is "weaker" than the other.

  You are right to feel that §122 is the moment the "scripture" shows its cracks. It reveals Moore struggling to reconcile his intuition that "Good People are the best things" with his utilitarian calculus that "Intense Aesthetic States are the best experiences."
