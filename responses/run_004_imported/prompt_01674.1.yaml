answer: |-
  David Hume's economic writings, particularly the essays *Of Money* and *Of Interest*, present a sophisticated duality regarding the nature of currency. On one hand, he dismisses the mercantilist fetishization of gold and silver, describing money as a "fiction," a tool of representation lacking intrinsic value. On the other hand, he articulates a robust Quantity Theory of Money, arguing that changes in the money supply exert decisive causal effects on prices, employment, and economic activity. To the casual observer, this presents a paradox: how can something ontologically "thin"—a mere convention or fiction—exert ontologically "thick" causal powers in the material world?

  This essay argues that Hume's claims are not only coherent but mutually reinforcing. The coherence rests on Hume's specific epistemological and social-ontological framework. For Hume, causation is not a necessary connection hidden in objects but a constant conjunction observed in experience, rooted in human psychology. Consequently, a convention possesses causal power precisely because it is a stable pattern of shared expectation that governs human action. Money is causally effective *because* it is a convention, not despite it.

  ### I. Money as Fiction and Convention

  To understand the tension, one must first clarify what Hume means by calling money a "fiction." In the 18th-century context, mercantilists argued that a nation's wealth consisted essentially of its stock of precious metals. Hume radically undermines this view. He posits that money is "nothing but the representation of labour and commodities." It is a "method of valuing" rather than a value in itself.

  When Hume refers to money as a fiction or conventional, he does not mean it is an illusion or a lie. Rather, he employs a definition similar to his account of justice in the *Treatise of Human Nature*. Justice is an "artificial virtue," a human invention designed to solve a coordination problem regarding property. Similarly, money is a social technology invented to facilitate exchange. Its value is not intrinsic (like the utility of bread or the beauty of gold) but relational; it exists only within a network of mutual agreement. If a shipwrecked sailor were alone on an island, a pocketful of gold would be useless. Thus, money's existence is dependent on the collective intentionality of society. It is a "fiction" in the sense that it is a constructed status imposed upon physical tokens (coins or paper).

  ### II. Money as a Causal Force

  Despite this demystification, Hume insists on the material reality of money's effects. He is a progenitor of the Quantity Theory of Money, arguing that "prices are in proportion to the quantity of money." If the money supply doubles, prices will eventually double. However, Hume goes further than a simple neutrality thesis. He argues that in the short run, an increase in the money supply stimulates industry.

  Hume observes that when new money enters the economy, it does not raise prices instantly across the board. Instead, it falls into the hands of specific merchants or manufacturers first. These actors, feeling wealthier, expand production and hire more labor. This creates a ripple effect of employment and consumption before prices fully adjust. Here, money is not a passive veil; it is an active engine. It alters the "temper" of the populace, awakening "industry" from "lethargy." Hume treats the money supply as an independent variable that causes changes in the dependent variables of price levels and economic output.

  ### III. The Ontology of Conventions: Bridging the Gap

  The philosophical crux of the problem lies in bridging the gap between the ontological status of money (conventional/fictional) and its causal efficacy (real/material). How can an agreement cause a factory to open or a price to rise? The resolution lies in Hume's broader philosophy of mind and causation.

  **1. Humean Causation and Expectation**
  Hume's famous critique of causation in the *Enquiry Concerning Human Understanding* rejects the idea of necessary connections between physical objects. We do not see "power" in a billiard ball; we see one ball strike another and the second move. Causation is a habit of the mind based on constant conjunction.
  Applied to economics, the "causal power" of money is located in human psychology. A convention is, fundamentally, a system of stabilized expectations. When I accept a coin, I do so because I *expect* the baker to accept it tomorrow. This expectation is a real mental state. Mental states drive physical actions (labor, trade, production). Therefore, the convention of money causes material effects by coordinating the passions and actions of millions of individuals. The "fiction" is the script; the "causal power" is the actors following the script.

  **2. Social Ontology and Institutional Facts**
  Hume anticipates what modern philosophy calls "institutional facts." A piece of paper is physically just cellulose, but socially it is a $20 bill. The physical properties do not change, but the social status does. Hume recognizes that human society operates on these status functions. The causal power of money is not physical (like gravity) but social. However, for Hume, social forces are just as "real" as physical forces because they produce observable, regular outcomes.
  If a convention breaks down (e.g., hyperinflation destroys trust in the currency), the causal power vanishes, and industry collapses. This proves the power resided in the convention itself. The "fiction" is the mechanism of transmission. Without the shared belief in the fiction, the causal chain is broken. Thus, the fiction is not an obstacle to causality; it is the *sine qua non* of it.

  **3. The Short-Run Mechanism**
  Hume's distinction between the short and long run clarifies the coherence. In the long run, money is neutral (the fiction adjusts, prices rise, real wealth remains). In the short run, the friction of the convention creates real effects. Because the convention relies on human psychology, and humans react to nominal changes before they perceive real value changes, the "fiction" temporarily masks reality. This mask has real consequences: it encourages risk-taking and labor. Here, the "fiction" acts as a stimulus. It is akin to a placebo that actually cures the patient; the mechanism is belief, but the outcome is physiological.

  ### IV. Objections and Counter-Arguments

  A critic might argue that if money is merely a convention, its effects should be dismissible as secondary to "real" factors like technology or resources. To claim money has causal power might seem to commit the fallacy of reification—treating an idea as a thing.

  However, this objection misunderstands Hume's empiricism. For Hume, if $A$ is regularly followed by $B$, $A$ is a cause of $B$. Since increases in the money supply are regularly followed by increases in prices and temporary spikes in employment, money is a cause. The fact that the link is mediated by human belief does not make it less causal. In fact, since human actions are the primary drivers of commerce, and human actions are driven by beliefs/conventions, conventions are the *primary* causes of economic phenomena.

  Furthermore, one might ask if calling money a "fiction" undermines its stability. Hume would reply that all of civil society rests on such fictions (promises, laws, property rights). Their stability does not come from metaphysical substance but from utility and habit. The causal power of money is robust precisely because the convention is deeply entrenched in human habit.

  ### V. Conclusion

  Hume's dual characterization of money is philosophically coherent because it rests on a consistent view of human nature and social reality. Money is a "fiction" in that it has no value outside of human agreement; it is not wealth itself but the representation of it. Yet, it exerts "real causal effects" because human agreements are the fundamental drivers of social behavior.

  The philosophical lesson is that conventions possess genuine causal powers because they structure expectations. In a Humean universe, where causation is grounded in observed regularities and psychological habits, a shared convention is a powerful causal force. It aligns individual actions toward collective ends. To separate the "fiction" of money from its "causal power" is to misunderstand the nature of social reality. For Hume, the social world is built of fictions, but those fictions build the physical world. Thus, the quantity of money matters not because gold is magical, but because human belief is a material force.
