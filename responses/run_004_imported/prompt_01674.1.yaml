      *   *What does he mean by "fiction"?* It's not a lie; it's a social construct, a tool of representation. It has value only because we agree it does (convention). It's not gold/silver *per se*, but the representation of labor/commodities.
      *   *What does he mean by "causal effects"?* The Quantity Theory of Money. More money $\rightarrow$ higher prices (inflation). In the short run, it can stimulate industry.
      *   *The Philosophical Problem:* If $X$ is just an idea/agreement (ontologically "thin"), how can it cause physical changes in the world (ontologically "thick" effects like hunger, trade volume, war)? This touches on Hume's own epistemology (causation as constant conjunction) and social ontology (institutions as real).

  3.  **Formulating the Thesis:**
      *   *Position:* Yes, they are coherent. In fact, Hume's specific understanding of "convention" and "causation" makes them *dependent* on each other. Money is causally effective *precisely because* it is a convention, not despite it.
      *   *Nuance:* The "fiction" isn't an illusion; it's a functional reality. The causal power resides in human psychology and social interaction, which are real.

  4.  **Structuring the Argument:**
      *   **Introduction:**
          *   Introduce Hume's dual claim (money as fiction vs. money as causal force).
          *   State the tension (ontological status vs. causal efficacy).
          *   Present the thesis (Coherence is found in Hume's social ontology and psychology; conventions are real patterns of expectation).
      *   **Section 1: Money as Fiction/Convention:**
          *   Explain what Hume means. It's not intrinsic value (unlike mercantilists).
          *   It's a "representative" symbol.
          *   Analogy: Language or law.
      *   **Section 2: Money as Causal Force:**
          *   The Quantity Theory of Money.
          *   The short-run vs. long-run distinction (monetary non-neutrality in the short run).
          *   How it affects industry and prices.
      *   **Section 3: Bridging the Gap - The Ontology of Conventions:**
          *   *Crucial Philosophical Step:* How can a convention cause things?
          *   Hume's theory of causation (constant conjunction, expectation).
          *   Conventions create *expectations*. Expectations drive *action*. Actions cause *material results*.
          *   Therefore, the convention is the mechanism of the causation.
      *   **Section 4: Addressing Counter-arguments/Objections:**
          *   Objection: If it's just paper/idea, why does hyperinflation hurt?
          *   Response: Because the *convention* breaks down, altering behavior. The pain is real, caused by the collapse of the fiction.
          *   Objection: Is this circular?
          *   Response: No, it's systemic.
      *   **Conclusion:**
          *   Summarize.
          *   Reiterate that for Hume, social reality *is* psychological reality.
          *   Final thought on modern relevance (fiat currency).

  5.  **Drafting - Key Concepts & Refinements:**
      *   *Refining "Fiction":* Be careful not to use "fiction" in the modern sense of "fake." For Hume, justice is also a "fiction" (artificial virtue), yet it holds society together. Use the term "artificial" or "conventional."
      *   *Refining "Causation":* Hume is a skeptic about necessary connection. Causation is about observed regularities. So, if we observe Money Supply $\rightarrow$ Prices regularly, that *is* causation for Hume.
      *   *The Mechanism:* The transmission mechanism is human passion/psychology. Money stimulates hope/industry. This connects the abstract (money) to the physical (labor).
      *   *Comparison:* Contrast with Mercantilists (money = wealth) and Classical Neutrality (money = veil). Hume is in the middle (money = veil in long run, engine in short run).

  6.  **Writing - Section by Section (Mental or Scratchpad):**
