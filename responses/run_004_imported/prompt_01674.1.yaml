prompt: |-
  Hume argues both that money is a 'fiction' or mere convention lacking intrinsic worth, and that the quantity of money exerts real causal effects on commerce. Argue whether these claims can be coherently held together, paying particular attention to the philosophical question of whether—and how—conventions can have genuine causal powers.
