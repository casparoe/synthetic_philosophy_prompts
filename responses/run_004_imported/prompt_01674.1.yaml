      *   *Body 4 (Philosophical Implications):* Social kinds. Searle later expands on this (status functions), but stick to Hume. The "fiction" is an institutional fact.
      *   *Conclusion:* Hume anticipates modern fiat money. The coherence lies in recognizing that human society is built on shared fictions that have material consequences.

  7.  **Review and Refine:**
