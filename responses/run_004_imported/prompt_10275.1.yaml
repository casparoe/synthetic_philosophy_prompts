      *   *Is the inference to "anti-utilitarians must violate Pareto" valid?* This is the crux of the debate. Most contemporary philosophers and social choice theorists say *no*. There are several ways to block the inference without rejecting Pareto.
      *   *Risk:* If I simply validate the user's premise without nuance, I might be leading them toward a philosophically naive conclusion that could get a poor grade or be easily dismantled by a professor. I need to be helpful but also accurate about the state of the literature. The prompt asks me to "anticipate the strongest objections," which implicitly acknowledges that there *are* strong objections.

  3.  **Identify Key Objections to the Harsanyi/Pareto $\rightarrow$ Utilitarianism Inference:**
      *   **Objection 1: The Nature of Individual Utilities (Cardinality/Scale).** Harsanyi assumes vNM utilities are cardinally significant and interpersonally comparable *in a specific way* (unit comparability). If individual utilities are only unique up to positive affine transformations, the weights matter. But more importantly, vNM utilities represent *risk attitudes*, not necessarily *well-being levels* suitable for moral weighting.
      *   **Objection 2: Ex Ante vs. Ex Post Pareto.** This is the big one. Harsanyi uses *Ex Ante* Pareto (if everyone prefers Prospect A to B, society should too). Egalitarians/Prioritarians often argue for *Ex Post* Pareto or reject Ex Ante Pareto in cases of risk. Diamond (1967) is the classic reference here.
      *   **Objection 3: The "Identity Problem" or "Preferences vs. Welfare".** vNM utilities represent preferences under uncertainty. Do these preferences track *moral value* or *welfare*? People might have "antisocial" preferences or mistaken beliefs. Utilitarianism usually cares about welfare, not just satisfied preferences.
      *   **Objection 4: State-Dependent Utility.** Harsanyi's theorem assumes utilities are state-independent. If my utility depends on who I am (which is often the case in distributive justice thought experiments), the theorem doesn't apply directly.
      *   **Objection 5: Weights can be non-uniform (but still linear).** Harsanyi allows weighted utilitarianism. Prioritarianism is non-linear (concave transformation). So Harsanyi *does* rule out prioritarianism *if* the premises hold. The attack must be on the premises.
