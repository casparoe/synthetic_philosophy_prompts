      *   *Priority 2: The Interpretation of Utility.* vNM utility $\neq$ Moral Welfare. vNM captures risk aversion. Prioritarianism is about weighting *welfare*, not *risk-attitudes*. If individual vNM functions already embody risk aversion, applying a prioritarian weighting on top might be double-counting or category error.
      *   *Priority 3: Interpersonal Comparisons.* Harsanyi requires a specific form of comparability. If we deny that vNM scales are the right metric for justice, the theorem loses its normative grip.

