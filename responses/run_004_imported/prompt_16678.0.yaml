answer: |-
  This is an excellent question, and it cuts to the heart of where contemporary metaethics currently stands. As a PhD student preparing for qualifiers, your intuition is partially correct: the landscape has shifted dramatically since Ayer or even early Hare. Blackburn and Gibbard did not merely "respond" to Frege-Geach; they transformed the debate. However, the consensus among specialists is not that the problem is *solved*, but rather that it has **metastasized**.

  It is not merely disciplinary inertia that keeps Frege-Geach on syllabi. While there is certainly a pedagogical convenience to the "Problem → Solution" narrative, the technical reasons for its continued status as a "live" objection are substantial. The short answer is that while Blackburn and Gibbard successfully demonstrated that expressivists *can* construct a logic that validates moral inferences, they have not conclusively shown that they can do so without incurring theoretical costs that rival or exceed those of realism, or without smuggling cognitivist semantics in through the back door.

  Here is a breakdown of the specific technical respects in which the Blackburn/Gibbard programs are still considered vulnerable, which should help you characterize the dialectic accurately in your paper.

  ### 1. The Distinction Between Logic and Semantics
  Your summary focuses on the **logical** aspect: explaining why modus ponens works. Blackburn's "logic of attitudes" and Gibbard's "consistency of plans" do a respectable job here. They show that one can be *irrational* (practically inconsistent) to accept the premises and reject the conclusion.

  However, the Frege-Geach problem is also a **semantic** problem. It asks: How can the word "wrong" have the *same meaning* in an asserted context ("Cruelty is wrong") and an unasserted context ("If cruelty is wrong...")?
  *   **The Expressivist Claim:** In the asserted context, "wrong" expresses a conative state. In the conditional, it does not.
  *   **The Challenge:** If the semantic contribution of "wrong" changes depending on the context, the argument commits a fallacy of equivocation. To avoid this, expressivists need a **compositional semantics** where the meaning of the complex sentence is a function of the meanings of its parts, *without* appealing to truth-conditions.

  Blackburn's quasi-realism often achieves this by mimicking truth-conditional semantics in the metalanguage. Critics (like Mark Schroeder and Michael Ridge) argue that this looks less like an alternative to realism and more like a complicated way of reconstructing realism. If you have to posit "higher-order attitudes" to account for the meaning of conditionals, are you not just reintroducing propositions under a different name?

  ### 2. Schroeder's "Being For" Objection
  The most significant technical challenge to the idea that Blackburn/Gibbard "settled" the matter comes from Mark Schroeder's *Being For* (2008). Schroeder grants that expressivists can validate the inferences, but he argues they cannot do so without an explosion of distinct mental states.

  *   **The Problem:** For the expressivist, the meaning of a moral sentence is identified with the mental state it expresses.
      *   "Stealing is wrong" expresses *disapproval of stealing*.
      *   "Stealing is not wrong" expresses *tolerance of stealing* (or lack of disapproval).
      *   "Is stealing wrong?" expresses... what?
      *   "If stealing is wrong, then..." expresses... what?
  *   **The Critique:** Schroeder argues that to maintain logical validity without truth-conditions, the expressivist must posit a distinct type of attitude for every logical connective and embedding context. This leads to an ad hoc proliferation of attitude types that lacks independent psychological motivation. Realists, by contrast, get the logic "for free" via the structure of propositions. Schroeder argues that the expressivist explanation of validity is therefore less parsimonious and less explanatory than the realist one.

  ### 3. The Negation Problem
  A specific, persistent instance of the embedding problem is negation. This is often treated as a "hard case" that quasi-realism has not fully smoothed over.
  *   Consider: "It is not the case that stealing is wrong" vs. "Stealing is not wrong."
  *   In standard semantics, these are equivalent. In expressivism, distinguishing the scope of the attitude (disapproving of the act vs. not disapproving of the act) requires a sophisticated logic of attitudes.
  *   While Gibbard's later work (using normative worlds) handles this better than early Blackburn, it does so by utilizing a formal structure isomorphic to possible worlds semantics. This invites the "quasi-realism collapses into realism" objection. If your normative worlds function exactly like possible worlds, and your validity conditions function exactly like truth-preservation, what substantive work is the "non-cognitivism" doing?

  ### 4. Explanatory Power vs. Mimicry
  This is the philosophical core of why the problem remains "live." The quasi-realist project is to *earn the right* to talk of truth, validity, and facts.
  *   **The Realist Charge:** Blackburn and Gibbard show us how to *mimic* realist discourse. They show how to construct a system that *looks* like realist semantics. But they haven't explained *why* moral language has this structure in a way that is superior to realism.
  *   **The "Why Validity?" Question:** Realists say validity is truth-preservation. Expressivists say validity is consistency of attitudes. But why should consistency of attitudes track validity in the way it does? The realist has a ready answer (the structure of reality/propositions). The expressivist must argue that the structure of our practical rationality just happens to mirror the structure of logical truth. Critics argue this is a contingent coincidence that requires explanation, which expressivism lacks.

  ### 5. Current Dialectic: Hybrid and Dynamic Semantics
  You mentioned seeing Frege-Geach in literature on hybrid and dynamic semantics. This confirms the problem is not settled.
  *   **Hybrid Expressivism (e.g., Ridge, Copp):** These theorists admit that pure expressivism struggles with compositionality. They posit that moral sentences express *both* a belief (descriptive content) and a desire/norm (expressive content). This solves Frege-Geach by giving the sentence a truth-conditional component to do the logical heavy lifting. The fact that they feel the need to do this acknowledges that pure Blackburnian quasi-realism left the problem incompletely solved.
  *   **Dynamic Semantics (e.g., Charlow, Yalcin-inspired):** Recent work tries to model moral language as updating information states rather than describing worlds. This is a direct attempt to solve Frege-Geach without truth-conditions. The fact that this is a cutting-edge research program indicates the old solutions are not viewed as definitive.

  ### Advice for Your Qualifying Paper
  To characterize the state of the dialectic accurately, avoid the binary of "solved" vs. "unsolved." Instead, frame it as a shift from a **logical problem** to a **semantic/explanatory problem**.

  1.  **Acknowledge the Success:** State clearly that Blackburn and Gibbard successfully refuted the *early* claim that expressivism *cannot* account for logical validity. The "incoherence" charge of the 1960s is dead.
  2.  **Identify the Residual Cost:** Argue that the current debate centers on the *theoretical cost* of the solution. Does the expressivist semantics required to validate the logic become so complex or isomorphic to realism that it loses its distinctive advantage (ontological parsimony/naturalism)?
  3.  **Cite the Right Critics:** Reference Schroeder (*Being For*) for the attitude-proliferation argument. Reference Michael Ridge (*Expressing Moral Norms*) for the hybrid response. Reference Nate Charlow for dynamic semantic approaches.
  4.  **Nuance the "Live" Status:** Conclude that Frege-Geach remains a live objection not because expressivists cannot make the logic work, but because they cannot yet make it work *as well as* realism without compromising the core non-cognitivist insight.

  **In summary:** It is not inertia. It is that the "solution" generated a new set of problems regarding compositionality, the nature of the expressed attitudes, and explanatory parsimony. Your seminar impression that the logic of attitudes "settles the matter" is the *quasi-realist aspiration*, but the *technical execution* remains the primary battleground in contemporary metaethics. Acknowledging this tension will demonstrate a sophisticated grasp of the literature for your qualifiers.
