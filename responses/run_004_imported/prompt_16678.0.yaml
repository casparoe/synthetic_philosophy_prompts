      *   *Critique:* This is the *expressivist hope*, but the *implementation* faces hurdles. The "logic of attitudes" needs a formal semantics to work, and once you build that semantics, does it really preserve the *meaning* of the moral terms across contexts (unembedded vs. embedded)?

  4.  **Identify the Core Technical Issues (The "Why it's not settled" part):**
      *   **The Semantic Challenge:** Validity isn't just about psychological inconsistency; it's about truth-preservation (or assertibility-preservation) based on *meaning*. If "wrong" means one thing in "Cruelty is wrong" (expressing disapproval) and another in "If cruelty is wrong..." (not expressing disapproval), is it the *same word*? This is the *embedding problem*.
