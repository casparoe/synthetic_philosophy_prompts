      *   **The Negation Problem:** How do you distinguish "It is not the case that stealing is wrong" from "Stealing is not wrong"? Expressivism struggles with scope distinctions.
      *   **Compositionality:** Can expressivism provide a compositional semantics where the meaning of the complex sentence is a function of the meanings of the parts? Standard possible worlds semantics does this easily; expressivist semantics (like Blackburn's projectivism) struggles to define the "content" of the conditional without smuggling in cognitivist truth-conditions.
      *   **Eklund/Generalized Frege-Geach:** The problem applies to any normative domain, and hybrid theories face it too.

