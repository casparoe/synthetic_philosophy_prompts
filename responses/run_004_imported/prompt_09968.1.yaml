answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm the Best Man, and I'm also a novelist. Theo knows this, and he also knows that the protagonist of my current draft is a hyper-rational ex-poker player who speaks exclusively in expected value calculations. So, if I mess up this speech, Theo won't just be hurt; he'll revoke my intellectual property rights. My book will be dead in the water.

  So, I have to get the math right.

  For the half of the room that isn't wearing a Patagonia vest: Theo used to play poker professionally. Now he's a quant. For most of his adult life, he has organized his decisions around something called the Kelly Criterion.

  For the family: Imagine you have a stack of chips. You know you have an edge—you know you're better than the other guy. The natural instinct is to push all your chips into the middle to win as much as possible, as fast as possible. But the Kelly Criterion says that if you bet everything, even with a great edge, the math guarantees you will eventually lose it all. Volatility will wipe you out.

  Instead, Kelly says you should only bet a specific fraction of your stack. Small enough that a bad run doesn't kill you. Big enough that you grow over time. It's not about maximizing the win on a single hand; it's about maximizing the growth rate of your life over a lifetime of hands.

  Now, usually, at a wedding, this is the part where I'd say something like, "But love? Love is the one time you *do* go all-in."

  I asked Theo about that line last week. He looked at me with genuine horror and said, "That is exactly how people get divorced."

  And he's right. To Theo, "going all-in" isn't romantic. It's reckless. It implies you're ignoring the risk of ruin. Theo doesn't view marriage as a gamble where you shove your stack on one beautiful moment. He views it as a disciplined strategy where you never risk the relationship itself on a single bad day.

  In Kelly terms, a good marriage isn't about the arithmetic average of your best dates. It's about the geometric growth of your trust. If you leverage your emotions too high—if you demand everything, all at once, every day—one bad beat breaks the bank. But if you size your positions correctly, if you manage your downside, you compound. You survive the downswings. You stay in the game long enough for the edge to work.

  Theo, you've spent your life avoiding the risk of ruin. And I think that's why you're so confident about [Partner's Name]. It's not because you think every day will be a winning hand. It's because you've found a partner who understands that the goal isn't to win the pot tonight. The goal is to still be sitting at the table in fifty years.

  It's a rigorous way to view the world. Theo actually told me once that the famous economist Paul Samuelson hated the Kelly Criterion so much, he supposedly wrote an entire academic paper trashing it using nothing but one-syllable words. Just to prove he could dismantle the theory with basic tools.

  Most people hear that and think, "Wow, that's cold." But I think there's something deeply comforting about it. It means Theo isn't betting on a feeling that might fade. He's betting on a system that endures. He's betting on the fact that [Partner's Name] is the only person he's ever met who doesn't need him to go all-in to prove he cares. She knows that showing up, day after day, sizing the bet correctly, is worth more than any grand gesture.

  So, for the family: "Bankroll" isn't a bread. It's the life you build together.
  And for the quants: The geometric mean of this union is positive.

  Theo, you taught me that the guy who never goes bust is the guy who wins. Looking at you two, I'd say you're already winning.

  Please raise your glasses. To Theo and [Partner's Name]. May your edge always be positive, your volatility be manageable, and may you never, ever go all-in.

  Cheers.
