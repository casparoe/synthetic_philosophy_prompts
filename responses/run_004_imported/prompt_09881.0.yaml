  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on philosophical method and the relevance of biography.
      *   **Task:** Sharpen a comparison between Frege and Heidegger regarding the relationship between their biographical/political views (specifically anti-Semitism and authoritarianism) and their philosophical work.
      *   **Core Question:** Is there a *principled basis* for the asymmetry in how philosophers treat them (Frege's work is seen as insulated from his politics; Heidegger's is seen as entangled)?
      *   **Specific Sub-questions:**
          *   Is it just about reputational stakes (logic vs. ontology)?
          *   Is there a difference in the *kind* of philosophical work?
          *   If a principle exists, what is it?
          *   If not, should we read Frege more suspiciously or Heidegger more charitably?
      *   **Goal:** Provide a deep, nuanced analysis suitable for a graduate handout/discussion leader.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Frege:* Yes, the 1924 diary (published by Gottfried Gabriel in the 90s) reveals virulent anti-Semitism, monarchism, and anti-democratic views. Dummett was indeed shaken. The consensus is largely that his logic remains untouched.
      *   *Heidegger:* Yes, the *Black Notebooks* (published starting 2014) confirmed deep entanglement of his philosophy with Nazi ideology and anti-Semitism ("Jewish worldlessness," etc.). The debate is ongoing about whether *Being and Time* is tainted.
      *   *The Asymmetry:* It is real. Analytic philosophy tends to separate Frege's logic from his hate; Continental philosophy (and increasingly analytic critics) debates the contamination of Heidegger's ontology.
      *   *The Challenge:* Justifying this asymmetry without resorting to "Analytic bias" or "Disciplinary turf wars."

  3.  **Brainstorming Potential Principles for Asymmetry:**

      *   *Hypothesis 1: Formalism vs. Substantive Worldview.*
          *   Frege deals with abstract objects, truth conditions, inference rules. These seem universal and ahistorical.
          *   Heidegger deals with *Dasein*, historicity, fate, peoplehood. These concepts are inherently historical and social.
          *   *Critique:* Logic isn't purely ahistorical (Kant, Hegel, intuitionists might disagree), and Heidegger claims ontological priority, not just ontic politics. But there's a grain of truth here regarding *subject matter*.

      *   *Hypothesis 2: The Role of the Subject/Agent.*
          *   Frege's logic minimizes the psychological/biographical subject (anti-psychologism). The "thinker" is irrelevant to the truth of $2+2=4$.
          *   Heidegger's philosophy centers on the existence, choice, and situatedness of the agent (*Dasein*). If the agent's situation is defined by racist ideology, the philosophy of agency might reflect that.
          *   *Strength:* This touches on the *methodological* core of each thinker.

      *   *Hypothesis 3: Universality vs. Particularity.*
          *   Frege aims for universal laws of thought (for any rational being).
          *   Heidegger speaks of the "destiny of a people" (*Volk*). The particular is built into the universal claim.
          *   *Strength:* Strong textual evidence.

      *   *Hypothesis 4: The "Genetic Fallacy" Defense.*
          *   Maybe the asymmetry is *wrong* in both cases? Or right in both?
          *   If we apply the genetic fallacy strictly, both should be insulated.
          *   If we apply a "hermeneutics of suspicion," both should be scrutinized.
          *   *Nuance:* The genetic fallacy applies to *truth*, but biography might apply to *motivation* or *conceptual formation*.

  4.  **Developing the Argument Structure:**

      *   **Introduction:** Acknowledge the gravity of the question. Validate the student's intuition that this is a crucial methodological issue.
      *   **Case 1: Frege (The Logicist Insulation).**
          *   Why the insulation? Anti-psychologism. The nature of logical truth (timeless, context-independent).
          *   Where the politics *might* lurk (foundations of arithmetic, order, hierarchy?), but why it fails to stick.
      *   **Case 2: Heidegger (The Ontological Entanglement).**
          *   Why the entanglement? Historicity is a *category*, not just a fact. *Volk* and *Destiny* are ontological terms in his later work.
          *   The *Black Notebooks* show anti-Semitism isn't just ontic (personal prejudice) but ontic-ontological (metaphysical claim about "worldlessness").
      *   **The Principled Basis (The Core Analysis).**
          *   *Candidate A: Subject Matter.* (Abstract vs. Existential).
          *   *Candidate B: Methodological Self-Conception.* (Frege excludes the subject; Heidegger includes the situated subject).
          *   *Candidate C: The Scope of Claims.* (Universal validity vs. Historical destiny).
      *   **Evaluating the Principle.**
          *   Is it robust?
          *   Does it protect Frege too much? (e.g., Logic as a tool of control?)
          *   Does it condemn Heidegger too much? (e.g., Can we salvage the phenomenology?)
      *   **Pedagogical Implications.**
          *   How to teach this?
          *   Moving beyond "Great Man" history to structural analysis.
      *   **Conclusion:** Summarize the finding.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Caution:* Don't simply say "Frege is logic, Heidegger is life." That's too simplistic. Frege's logicism had metaphysical commitments. Heidegger's ontology claims to be fundamental, not just political.
      *   *Key Distinction:* **Anti-Psychologism.** This is Frege's battle cry. He explicitly argues that the *act* of thinking is distinct from the *content* of thought. Heidegger argues that the *being* of the thinker is inseparable from the *question* of Being. This is the methodological hinge.
      *   *Nuance on Heidegger:* Distinguish *Being and Time* (1927) from the *Black Notebooks* (1930s-40s). Some argue *BT* is clean; others say the seeds are there (resoluteness, fate). The prompt asks about the general treatment, so address the trajectory.
      *   *Nuance on Frege:* Mention that some *have* tried to link his logic to politics (e.g., logic as order vs. chaos), but these are minority views. Why? Because the formalism works regardless.
      *   *The "Benefit of the Doubt":* Address the final part of the prompt. Should we shift Frege or Heidegger?
          *   Shifting Frege: Look at how "objectivity" can be a political mask.
          *   Shifting Heidegger: Acknowledge that phenomenological descriptions can survive their author's moral failures (like Husserl).
          *   *Verdict:* The asymmetry is *mostly* justified by methodological commitments, but requires vigilance on both sides.

  6.  **Drafting the Response (incorporating philosophical terminology):**
      *   Use terms like *anti-psychologism*, *ontic/ontological*, *context of discovery vs. justification*, *formalism*, *historicity*.
      *   Maintain an academic, seminar-leader tone.
      *   Ensure the distinction between "truth conditions" (Frege) and "meaning of Being" (Heidegger) is clear.

  7.  **Final Review against Prompt:**
      *   Did I compare in depth? Yes.
      *   Did I look for a principled basis? Yes (Anti-psychologism/Subjectivity).
      *   Did I address the "reputational stakes" objection? Yes.
      *   Did I answer the "which way to shift" question? Yes.

  8.  *(Self-Correction)*: Make sure not to let the response become a defense of Heidegger. The *Black Notebooks* made it harder to separate. Be precise: it's not that Heidegger's philosophy *is* Nazism, but that Nazism informed the *categories* he used to describe existence. For Frege, Nazism informed his *hopes for society*, but not his *definition of the concept*.

  9.  **Final Polish:** Check tone for sensitivity regarding anti-Semitism. Ensure the distinction between "biographical fact" and "philosophical content" is handled with care. (Proceed to generate output).

  *(Post-computation thought)*: I should also mention the "Context of Discovery vs. Context of Justification" distinction (Reichenbach), as that is the classic analytic tool used to insulate Frege. I need to explain why that tool works better for Frege than Heidegger.

