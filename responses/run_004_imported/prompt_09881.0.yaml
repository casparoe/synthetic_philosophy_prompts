answer: |-
  This is an exceptionally rich and pedagogically valuable comparison. It cuts to the heart of how different philosophical traditions conceive the relationship between the *thinker*, the *thought*, and the *world*.

  For a graduate seminar, you want to move students beyond the intuitive reaction ("Logic is neutral, Existentialism is personal") toward a methodological analysis. The asymmetry in how we treat Frege and Heidegger is not merely disciplinary tribalism; there is a **principled basis** for it, rooted in their opposing methodological commitments regarding **subjectivity** and **historicity**. However, that principle is not absolute, and examining its limits is where the real philosophical work lies.

  Here is a breakdown of the comparison, the principled basis for the asymmetry, and the implications for your seminar.

  ---

  ### 1. The Core Methodological Divergence

  The strongest argument for the asymmetry lies in how each philosopher defines the relationship between the thinking subject and the content of thought.

  #### Frege: The Triumph of Anti-Psychologism
  Frege's entire project is built on a rigorous separation between the *act* of thinking (psychological, biographical, temporal) and the *content* of thought (logical, objective, timeless).
  *   **The Principle:** For Frege, a thought (*Gedanke*) is not a mental image or a private occurrence; it is an abstract object accessible to any rational being. The truth conditions of "2 + 2 = 4" or the validity of a quantifier rule are independent of who asserts them, when, or why.
  *   **The Insulation:** Because Frege explicitly constructs his system to exclude the psychological subject, his biography is methodologically irrelevant to the *validity* of his logic. His anti-Semitism belongs to the "context of discovery" (why he cared about order, perhaps), but logic belongs to the "context of justification" (why the proof holds).
  *   **The Limit:** This insulation works because formal logic is designed to be **topic-neutral**. It does not make claims about human nature, history, or society. Therefore, there is no conceptual "hook" on which his politics can hang within the *Begriffsschrift*.

  #### Heidegger: The Inseparability of *Dasein* and Being
  Heidegger's project, conversely, is built on the claim that the question of Being cannot be asked apart from the being who asks it (*Dasein*).
  *   **The Principle:** *Dasein* is not a disembodied logical subject; it is "being-in-the-world." Its fundamental structures include **historicity** (*Geschichtlichkeit*), **fate** (*Schicksal*), and **community** (*Volk*). These are not merely ontic facts about a person but ontological categories describing the structure of existence.
  *   **The Entanglement:** When Heidegger infuses these ontological categories with specific political content (e.g., the "destiny of the German people," the "worldlessness" of the Jews in the *Black Notebooks*), the politics cease to be merely biographical. They become structural. If "authenticity" requires resoluteness toward a specific historical destiny, and that destiny is defined by nationalist exclusion, then the political commitment is baked into the ontological framework.
  *   **The Limit:** Unlike Frege's logic, Heidegger's ontology is not topic-neutral. It claims to describe the fundamental nature of human existence. If that description relies on exclusionary or racist metaphysics, the ontology itself is compromised, not just the man.

  ### 2. Is It Just Disciplinary Reputation?

  You ask if this is merely about the stakes of formal logic versus existential ontology. While disciplinary self-image plays a role, the methodological distinction above suggests it is deeper.

  *   **Analytic Confidence:** Analytic philosophy generally accepts the Fregean distinction between psychology and logic. To challenge Frege's logic based on his diary would require dismantling anti-psychologism itself, which would threaten the foundation of the discipline.
  *   **Continental Ambiguity:** Continental philosophy often embraces the idea that philosophy is situated. Therefore, it is more open to the idea that a philosopher's historical situation (including their moral failures) illuminates or corrupts their concepts.

  However, there is a risk of **circularity**: We treat Frege's work as ahistorical because we assume logic is ahistorical; we treat Heidegger's work as historical because he tells us it is. If we viewed Frege's logic as a *cultural practice* rather than a realm of abstract objects (as some sociologists of science do), the insulation would weaken.

  ### 3. The Principled Basis: Universality vs. Situatedness

  If you need a single principle to present to your students, it is this:

  > **The degree to which a philosophical system claims universality independent of the subject's situation determines the degree to which the subject's biography can be insulated from the doctrine.**

  *   **Frege** claims **strong universality**. The laws of logic hold for any rational being, anywhere, anytime. The specific historical situation of the logician is, by definition, irrelevant to the truth of the laws.
  *   **Heidegger** claims **fundamental situatedness**. Truth is unconcealment (*aletheia*) within a historical horizon. The specific historical situation of the thinker is, by definition, relevant to the disclosure of Being.

  Therefore, finding racism in Frege is finding a contradiction between the *man* and the *method* (since the method excludes the man). Finding racism in Heidegger is finding a contradiction (or continuity) within the *method itself* (since the method includes the man's historical situation).

  ### 4. Critical Pushback: Where the Principle Fails

  For a graduate seminar, you must press on the weaknesses of this asymmetry.

  **A. Suspicion Toward Frege (The "Order" Critique)**
  Even if Frege's logic is formally valid, his *motivation* for logic was not neutral. Frege sought logic as a bulwark against the "chaos" of natural language and democratic mass society.
  *   *Seminar Question:* Does the drive for absolute precision, rigid hierarchy of concepts, and the purification of language reflect an authoritarian temperament, even if the theorems hold?
  *   *Implication:* We don't reject the theorems, but we might reject the *ideology of formalism*—the idea that political or ethical problems can be solved by logical purification. This reads Frege's *method* as political, even if his *proofs* are not.

  **B. Charity Toward Heidegger (The "Excess" Critique)**
  Many defenders of Heidegger argue that his fundamental ontology (care, temporality, being-toward-death) exceeds his Nazi appropriation.
  *   *Seminar Question:* Can the phenomenological description of anxiety or resoluteness be "redeemed" from the specific political content Heidegger poured into them? (Just as we might use a tool designed for war for peaceful purposes).
  *   *Implication:* If we accept the Fregean insulation for Heidegger, we must treat his Nazi commitments as "ontic" errors that do not invalidate his "ontological" insights. The *Black Notebooks* make this harder, as they suggest the anti-Semitism was ontological, but *Being and Time* (1927) predates the worst of the Notebooks.

  ### 5. Recommendation for the Seminar Handout

  I recommend framing the session not as a verdict on who is "guilty," but as an investigation into **Philosophical Immunology**: *How do different philosophical systems protect themselves from the contamination of their authors?*

  **Proposed Structure for the Handout:**

  1.  **The Data:** Briefly summarize the Frege Diary (1924) and Heidegger's *Black Notebooks* (1931–1941).
  2.  **The Asymmetry:** Note the consensus: Frege's logic is safe; Heidegger's ontology is suspect.
  3.  **The Hypothesis:** Present the "Universality vs. Situatedness" principle (see Section 3 above).
  4.  **The Stress Test:**
      *   *Case A:* If logic is a human practice, does Frege's desire for "order" infect the logicist project? (Reference: Dummett's disturbance).
      *   *Case B:* If ontology describes structures of existence, can "resoluteness" be separated from "Nazi resolve"? (Reference: Habermas vs. Farias debates).
  5.  **The Methodological Takeaway:**
      *   Frege teaches us that **formal validity** can survive **moral rot**.
      *   Heidegger teaches us that **conceptual frameworks** can encode **political violence**.
      *   *Conclusion:* The relevance of biography depends on whether the philosophy claims to transcend the human condition or to describe it.

  ### 6. Addressing Your Final Question

  *If the principle doesn't hold, do we read Frege more suspiciously or Heidegger more charitably?*

  I argue we should do **both**, but in specific ways:

  1.  **Read Frege more suspiciously regarding *Method*, not Logic.** We should not doubt the truth of the *Begriffsschrift*, but we should question the *imperative* of formalism. We should ask: Why was purity of language valued above all? Was this a reaction against the "messiness" of pluralistic democracy? This makes Frege a case study in the **politics of epistemic virtue**.
  2.  **Read Heidegger more charitably regarding *Phenomenology*, not Ontology.** We can acknowledge that his descriptions of moods, time, and equipment are phenomenologically acute (and useful) without accepting his metaphysical conclusions about "Destiny" or "People." We treat the *Black Notebooks* as the corruption of the method, rather than the method itself.

  **Final Verdict for the Seminar:**
  The asymmetry is **principled but porous**. It is principled because Frege's system is designed to exclude the subject, while Heidegger's is designed to include it. It is porous because no philosophy is truly ahistorical. Frege's "objective realm" is a historical invention with political consequences; Heidegger's "historical destiny" contains insights that outlast his politics.

  The lesson for your students is that **biographical relevance is not a binary switch; it is a function of the philosophical architecture.** The more a system claims to speak from nowhere (Frege), the harder it is to attack via biography, but the more suspicious we should be of its claim to neutrality. The more a system claims to speak from somewhere (Heidegger), the easier it is to attack via biography, but the more we must fight to salvage the insights from the specific "somewhere" the author chose.
