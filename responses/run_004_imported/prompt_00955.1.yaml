answer: |-
  You have the first half of that equation right, but the second half—the conclusion about factory farming—is a significant misrepresentation that could draw serious criticism from philosophers or careful readers of Nozick.

  Here is the breakdown of what is accurate and what is risky about your current framing.

  ### 1. The Accurate Part: "Utilitarianism for Animals, Kantianism for Humans"
  It is fair to say that in *Anarchy, State, and Utopia* (1974), Nozick explores the idea that humans are subject to deontological "side-constraints" (rights that cannot be violated regardless of the good consequences), whereas animals might be subject to a utilitarian calculus.

  Nozick uses this distinction to test the limits of his own libertarian theory. He acknowledges that if animals cannot be rights-holders (because they lack rationality or moral agency), their suffering must still count for *something* in the moral equation. So, yes, the shorthand you found is a recognized summary of his theoretical framework in that specific text.

  ### 2. The Inaccurate Part: "A Clean Conscience for Factory Farming"
  This is where your draft is vulnerable. It is **not** fair to characterize Nozick as providing libertarians a "clean conscience" regarding factory farming. In fact, he suggests the opposite.

  In the relevant section of *Anarchy, State, and Utopia* (pp. 39–42), Nozick explicitly grapples with the permissibility of eating meat. He does not conclude that the "aggregate numbers pencil out" in favor of the eater. Instead, he argues that even under a utilitarian calculus for animals, the moral cost is likely too high.

  *   **He expresses skepticism about meat-eating:** Nozick writes that he is "inclined to think" that it is **not** permissible to eat animals, particularly those raised solely for food. He suggests that the gustatory pleasure of humans is a trivial benefit compared to the suffering and death of the animal.
  *   **He rejects the "blank check":** He does not view the lack of "rights" for animals as a license for unlimited use. He posits that there are moral limits on how we treat beings that can suffer, even if they don't possess inviolable rights.
  *   **He highlights the theoretical gap:** Nozick actually presents animal ethics as a problem *for* libertarianism, not a solved loophole. He admits that his theory of rights doesn't easily accommodate animals, and he leaves the question somewhat open, leaning heavily toward the protection of animals.

  ### 3. Why This Distinction Matters for Your Piece
  If you publish the claim that Nozick gave libertarians a "clean conscience" on factory farming, you risk two things:
  1.  **Philosophical Inaccuracy:** You would be attributing a conclusion to Nozick that he explicitly questioned and likely rejected.
  2.  **Ignoring the Libertarian Debate:** Many libertarians actually *ignore* Nozick on this point because his conclusions are inconvenient for pro-meat libertarians. Scholars like Mark Rowlands and Gary Francione have noted that Nozick's framework creates *more* problems for meat-eaters than it solves, because it forces a utilitarian accounting where animal suffering weighs heavily.

  ### Suggested Reframing
  To keep your piece accurate while maintaining your thesis, you might adjust the phrasing to reflect the tension in his work rather than a resolution.

  **Instead of:**
  > "Nozick gave libertarians a clean conscience about factory farming, since as long as the aggregate numbers pencil out, animals don't really have grounds to object."

  **Consider:**
  > "Nozick proposed a hybrid model—'utilitarianism for animals, Kantianism for people'—which theoretically allows animals to be weighed in a cost-benefit calculus. However, Nozick himself doubted whether current meat-eating practices could ever clear that utilitarian hurdle, leaving libertarians with a theoretical framework that offers no easy justification for factory farming."

  ### One Additional Note
  It is worth noting for your context that Nozick's views reportedly softened later in his life. In his later work, *The Examined Life* (1989), he walked back some of the rigid libertarianism of *ASU*, though he didn't publish a comprehensive new theory of animal rights. Sticking to *ASU* is fine, but just be aware that the "Nozickian" position is often treated as his 1974 stance specifically.

  **Verdict:** Keep the "Utilitarian/Kantian" label; drop the "clean conscience" claim. Nozick is better characterized as the guy who made it *harder* for libertarians to ignore the moral cost of meat, not easier.
