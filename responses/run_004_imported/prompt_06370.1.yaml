answer: |-
  Thomas Hobbes once argued that geometry was the only path to absolute certainty, precisely because "we construct the definitions ourselves."

  So when John Wallis proved for the tenth time that Hobbes hadn't squared the circle, Wallis asked, "If we construct the definitions, Thomas, why not admit you constructed this one wrong?"

  Hobbes refused to budge for twenty years. When pressed on how he could claim certainty while ignoring proof, Hobbes shrugged:

  "Because I have exercised my right to construct a new definition: 'Certainty' is whatever I refuse to recant. The logic is airtight."

  Wallis sighed, "That's not geometry, Thomas."

  Hobbes smiled, "It is now. I've squared the definitions."
