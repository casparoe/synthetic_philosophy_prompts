answer: |-
  The intuition that your credence in "If $A$, then $B$" should equal your conditional credence $P(B|A)$ is incredibly robust. It captures the core of how we use conditionals in reasoning: we suppose $A$ and assess $B$. However, as you note, David Lewis's 1976 triviality proof demonstrates that this intuition—the Equation ($P(A \to B) = P(B|A)$)—is mathematically incompatible with the assumption that indicative conditionals express standard propositions with truth conditions, provided we maintain standard Bayesian dynamics.

  You are asking for a defense of the Adams/Edgington conclusion: that we should retain the Equation and abandon the idea that indicative conditionals express propositions. This is the more philosophically costly move, as it requires revising our semantics, but it is the correct one. The Stalnaker-style restriction strategy, while technically coherent, purchases the preservation of "propositions" at the price of rendering them epistemically inert in ways that violate the core tenets of Bayesian rationality.

  Here is the case for the "no truth value" view, grounded in the mechanics of the triviality proof and the dynamics of belief.

  ### 1. The Triviality Proof: Precision and Force

  To evaluate the responses, we must first be precise about what Lewis proved. The result is not merely that the Equation fails in some edge cases; it is that the Equation cannot hold universally for a non-trivial probability function if conditionals are propositions.

  **The Setup:**
  Let $P$ be a probability function representing an agent's credences. Let $A \to B$ denote the indicative conditional.
  **The Equation:** $P(A \to B) = P(B|A)$ for all $A, B$ where $P(A) > 0$.
  **The Proposition Assumption:** $A \to B$ expresses a proposition. Therefore, it is a valid object of conditionalization. We can form new probability functions $P_{A \to B}(\cdot) = P(\cdot \mid A \to B)$ and $P_{\neg(A \to B)}(\cdot) = P(\cdot \mid \neg(A \to B))$.
  **The Closure Assumption:** The class of admissible probability functions is closed under conditionalization. If $P$ is admissible, then $P_X$ is admissible for any proposition $X$ with $P(X) > 0$. Consequently, the Equation must hold for $P_{A \to B}$ and $P_{\neg(A \to B)}$ as well.

  **The Derivation:**
  We want to calculate the unconditional probability of the conditional, $P(A \to B)$, by partitioning on the truth of $B$. By the Law of Total Probability:
  $$P(A \to B) = P(A \to B \mid B)P(B) + P(A \to B \mid \neg B)P(\neg B)$$

  Now, we apply the Equation to the conditionalized probability functions $P_B(\cdot) = P(\cdot \mid B)$ and $P_{\neg B}(\cdot) = P(\cdot \mid \neg B)$. Assuming the class is closed under conditionalization on $B$ and $\neg B$:

  1.  Consider $P_B(A \to B)$. By the Equation, this equals $P_B(B|A)$.
      Since $P_B(B) = 1$, it follows that $P_B(B|A) = 1$ (provided $P_B(A) > 0$).
      Therefore, **$P(A \to B \mid B) = 1$**.

  2.  Consider $P_{\neg B}(A \to B)$. By the Equation, this equals $P_{\neg B}(B|A)$.
      Since $P_{\neg B}(B) = 0$, it follows that $P_{\neg B}(B|A) = 0$.
      Therefore, **$P(A \to B \mid \neg B) = 0$**.

  Substituting these back into the total probability expansion:
  $$P(A \to B) = 1 \cdot P(B) + 0 \cdot P(\neg B) = P(B)$$

  But by the original Equation, $P(A \to B) = P(B|A)$. Thus:
  $$P(B|A) = P(B)$$

  **The Conclusion:**
  For the Equation to hold for a class of functions closed under conditionalization, $A$ and $B$ must be probabilistically independent. Since this must hold for *any* $A$ and $B$, the only admissible probability functions are those where no proposition provides evidence for any other. This is a trivial probability space.

  ### 2. The Stalnaker Restriction: A Solution in Name Only

  Robert Stalnaker accepts the proof but denies the **Closure Assumption**. He argues that the Equation holds for an agent's *actual* credence function, but not necessarily for functions obtained by conditionalizing on the conditional itself.

  **The Strategy:**
  Stalnaker maintains that $A \to B$ is a proposition with truth conditions (typically defined via selection functions over possible worlds). However, he argues that learning a conditional is not a matter of standard Bayesian conditionalization. To accept "If $A$, then $B$" is to restrict the context set (the live possibilities) in a specific way that eliminates $A \land \neg B$ worlds, but this context shift changes the semantic parameters. Therefore, the probability function *after* accepting the conditional is not simply $P(\cdot \mid A \to B)$; it is a different kind of update. Consequently, we cannot apply the Equation to $P_{A \to B}$, and the derivation above is blocked.

  **The Critique:**
  While this saves the propositionality of conditionals, it does so by making those propositions epistemically anomalous.

  1.  **Violation of Bayesian Rationality:** The core Bayesian tenet is that learning a proposition $X$ involves updating to $P(\cdot \mid X)$. If $A \to B$ is a proposition, why is it immune to this rule? If I become certain that "If it rains, the match is cancelled," my new credence function should reflect that certainty. Stalnaker must claim that I cannot become certain of a conditional in the standard way. This creates a dualistic epistemology: there are "ordinary" propositions we conditionalize on, and "conditional" propositions we accept via a special, non-conditionalizing mechanism. This is ontologically profligate and ad hoc.
  2.  **Hájek's Generalizations:** Alan Hájek has shown that triviality results are remarkably resilient. Even if we restrict conditionalization on the conditional itself, triviality returns if we assume minimal constraints on how credences in conditionals relate to credences in their components across *different* probability functions. For instance, if we assume that for any two probability functions $P$ and $Q$, there is a function $R$ that is a "mixture" or reachable via some legitimate update, the triviality often re-emerges. The restriction strategy requires fencing off the conditional from the normal flow of evidential support, which is hard to motivate independently of the desire to save truth conditions.
  3.  **The "Proposition" Becomes Vacuous:** What work is the "truth condition" doing if we cannot conditionalize on it? The functional role of a proposition in a Bayesian framework is to be the object of belief and the input for updating. If $A \to B$ has truth conditions but cannot serve as the input for standard updating without breaking the Equation (which we want to keep), its status as a proposition is metaphysically robust but epistemically hollow. It is a "fact" that cannot be learned as a fact.

  ### 3. The Adams/Edgington Alternative: Embracing the Category Mistake

  The Adams/Edgington view accepts the Equation as definitional of the conditional's meaning and concludes that $A \to B$ simply does not express a proposition. It has no truth conditions; it has **assertibility conditions**. To assert "If $A$, then $B$" is not to state a fact about the world, but to express a high conditional credence.

  This view absorbs the triviality proof not as a paradox, but as a *reductio* of the assumption that conditionals are propositions. The proof shows: *If* conditionals are propositions *and* we update by conditionalization, *then* the Equation fails. Since the Equation is phenomenologically and normatively primary (it captures how we actually reason), and conditionalization is the gold standard of rational updating, the premise that must go is the propositionality of the conditional.

  **Advantages:**
  1.  **Preserves Bayesian Dynamics:** We can maintain that rational updating is conditionalization. We simply note that we never conditionalize *on* a conditional. We conditionalize on categorical evidence ($A$, $B$, etc.), which shifts our conditional credences $P(B|A)$, and thereby shifts our acceptance of $A \to B$.
  2.  **Explains the Lack of Independence:** The triviality proof shows that if conditionals were propositions, $A$ and $B$ would have to be independent. The Adams view explains why they aren't: $P(A \to B)$ isn't a probability of a truth, it *is* the degree of dependence.
  3.  **Fits the Phenomenology:** When we deliberate about conditionals, we do not look for a "conditional fact" in the world. We engage in a suppositional exercise. As Ramsey noted, we fix our credence in $A$ hypothetically and measure our credence in $B$. This is a process, not a perception of a truth-maker.

  ### 4. Addressing the Embedding Objection

  The strongest objection to the "no truth value" view is linguistic. Conditionals embed felicitously:
  *   **Negation:** "It is not the case that if $A$, then $B$."
  *   **Conjunction:** "If $A$, then $B$, and if $C$, then $D$."
  *   **Iterated Conditionals:** "If $A$, then if $B$, then $C$."

  If conditionals lack truth values, they shouldn't be operable by truth-functional connectives. How can you negate something that isn't true or false?

  **The Defense:**
  This objection relies on the assumption that surface grammatical form mirrors deep logical form. The Adams/Edgington view, bolstered by modern dynamic semantics, argues that it does not.

  1.  **Negation:** When we say "It is not the case that if $A$, then $B$," we are not negating a proposition $A \to B$. We are expressing that our conditional credence $P(B|A)$ is low. More formally, in a dynamic framework, negation operates on the *context change potential* of the sentence. To deny a conditional is to refuse to update the context in the way the conditional prescribes. It is a rejection of the inference, not the falsification of a fact.
  2.  **Iterated Conditionals:** The sentence "If $A$, then if $B$, then $C$" does not require the inner conditional to have a truth value. It can be parsed as a single suppositional instruction: "Suppose $A$; then, within that supposition, suppose $B$; assess $C$." This reduces to $P(C | A \land B)$. The logic of conditionals is not truth-functional logic; it is a logic of supposition. The embedding is syntactic, but the semantic evaluation collapses the iteration into a single conditional probability.
  3.  **McGee's Counterexamples:** Interestingly, truth-conditional accounts (like Stalnaker's) face their own embedding problems. Vann McGee showed that Modus Ponens fails for nested conditionals under truth-conditional semantics (e.g., "If a Republican wins, then if it's not Reagan, it's Anderson"). If we accept the truth-conditional view to save embeddings, we break valid inference patterns. The suppositional view handles these cases more naturally by tracking the flow of conditional credences rather than truth preservation.

  ### Conclusion

  Lewis's triviality proof is often taught as a technical constraint on semantics, suggesting we must tweak the Equation or the logic of conditionals to make them fit together. This is the wrong lesson. The proof is a revelation that we are trying to fit a suppositional tool into a factual mold.

  The Stalnaker strategy saves the "proposition" by insulating it from the very probabilistic dynamics that give credences their normative force. It renders the conditional a proposition that cannot be learned, a truth that cannot be updated upon. This is a high price for semantic uniformity.

  The Adams/Edgington view pays a different price: it admits that indicative conditionals are a *sui generis* linguistic category, distinct from categorical assertions. But in exchange, it preserves the Equation, which captures the essential role of conditionals in reasoning, and it maintains the integrity of Bayesian conditionalization as the universal rule for learning. Given that the primary function of language is to facilitate reasoning and coordination, a semantics that aligns with our rational dynamics is preferable to one that preserves a metaphysical category at the cost of those dynamics. The triviality result is not a problem to be solved; it is the proof that conditionals are not propositions.
