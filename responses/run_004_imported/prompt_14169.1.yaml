      *   *Nuance on Money Pumps:* There are "dynamic money pumps" vs "static." The draft describes a dynamic one. The objection (resolute choice) works against dynamic pumps. But the AI argument is about *selection*. I need to make sure the user understands that the AI argument isn't just "you will lose money," it's "you will be outcompeted by agents that don't lose money."
      *   *Nuance on Representation Theorems:* The draft says "Combine... with a representation theorem." Actually, the representation theorem *is* the proof that axioms -> EU. The Dutch Book/Money Pump are *arguments for why you should accept the axioms*. The draft makes it sound like they are separate ingredients mixed together. I should suggest clarifying that relationship.

