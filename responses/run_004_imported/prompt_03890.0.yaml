          *   Philosopher B: Defends Margaret Gilbert's non-reductionist plural-subject theory (sui generis joint commitment, obligation/entitlement, no unilateral rescission).
      *   **Test Case:** Two people repainting a fence; one walks off halfway for a better opportunity.
      *   **Key Conflict:** The Gilbertian must argue this *wrongs* the other (normative force); the Bratmanian must try to derive this from individualist materials or argue against the need for that specific normative force.
      *   **Tone:** Sharp, engaging, accurate to the theories, no easy resolution.
      *   **Audience:** Science journalist (needs clarity but also depth/nuance).

  2.  **Deconstruct the Theories:**
      *   **Bratman (Reductionist/Individualist):** Shared intention is not a mental state of a group mind. It's a web of individual intentional states.
          *   *Conditions:* I intend that we J; You intend that we J; Our intentions mesh (sub-plans don't conflict); We are mutually responsive; It's common knowledge.
          *   *Normativity:* Obligations arise from reliance/expectation, not the intention itself. If I quit, I might violate a principle of consistency or fidelity, but I don't violate a *joint* obligation because there is no joint entity.
      *   **Gilbert (Non-Reductionist/Plural Subject):** Shared intention creates a "plural subject."
          *   *Conditions:* Joint commitment (expressed readiness to be committed together).
          *   *Normativity:* Intrinsic. To commit jointly is to create obligations and entitlements. Unilateral rescission is impermissible. Walking off is a *wrong*, not just a letdown.

  3.  **Drafting - Section by Section:**

