answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two philosophers, **Alex** (defending Michael Bratman's planning theory) and **Morgan** (defending Margaret Gilbert's plural subject theory), are finishing coffee. A science journalist sits nearby, listening intently.*

  **Alex:** So, the fence case. It's the classic intuition pump. Two neighbors, paint brushes in hand, halfway down the pickets. One drops their brush, says, "Found a better gig," and walks away. You say the leaver *wrongs* the stayer. I say the stayer is *disappointed*, perhaps frustrated, but let's be careful with the word "wrong."

  **Morgan:** Careful? Alex, if I agree to paint with you, I give you a right to my labor. When you walk off, you don't just frustrate my expectations; you violate a claim I have against you. That is the definition of a wrong. If it were merely disappointment, I'd have no standing to rebuke you. I couldn't say, "You can't do that." I'd just have to sigh and say, "I wish you hadn't."

  **Alex:** But look at the ontology. What exactly is this "we" that you think holds the rights? There are two brains, two bodies, two sets of intentions. In the Bratmanian view, shared intention is a web of interlocking individual states. I intend that we paint. You intend that we paint. I know you intend it; you know I intend it. Our sub-plans mesh—we agree on the color, the method. When you walk off, you violate the principle of consistency. You intended to paint, now you don't. That's irrational. But where is the *joint* obligation coming from?

  **Morgan:** It comes from the joint commitment. It's *sui generis*. It's not just my commitment plus your commitment. It's a commitment *of us*. That's why you can't unilaterally rescind it. In your reductionist picture, if I intend that we paint, and I change my mind, I just update my intention. Sure, I might let you down. But in the plural subject picture, I am not free to just update. I need *your* concurrence to dissolve the commitment. By walking off, you treat a joint obligation as if it were a personal preference.

  **Alex:** This smells of metaphysics I don't need. For the cognitive scientist—our friend the journalist over there—this matters. If they put two people in an fMRI to see how they carry a table through a door, are they looking for a "plural subject" in the scanner? No. They're looking for predictive coding, motor simulation, mutual responsiveness. They see my brain modeling your actions and yours modeling mine. That's the mesh. If I walk away from the fence, it's because my predictive model shifted. I calculated the better gig was higher value. The "wrong" is just the social cost of breaking a reliance pattern.

  **Morgan:** You're conflating the *mechanism* with the *normativity*. Sebanz and Knoblich can tell you how we synchronize our movements. They can't tell you why I'm entitled to be angry when you desynchronize without notice. Your "reliance pattern" is too thin. Imagine a case where I don't actually rely on you. Say I know you're flaky. I paint the fence expecting you to quit. You quit. On your view, no reliance, no disappointment, no wrong. But on my view, you still wronged me. We were committed together, regardless of my subjective confidence in your stability.

  **Alex:** That's a strong claim. But let's stick to the materials we have. Bratman does allow for obligations, but they arise from the norms of individual planning agency. If I invite you to rely on me, and you do, I incur an obligation of fidelity. So, if I say, "Let's paint," and I know you're counting on me to finish the south side, walking off violates a norm of interpersonal consistency. I can get you the "wrong" without the "plural subject." I just need to show that rational agents who value their own integrity shouldn't break induced reliance.

  **Morgan:** But that makes the obligation contingent on *your* valuation of integrity. If the leaver is a sociopath who doesn't care about consistency, do they owe nothing? For Gilbert, the obligation is inherent in the joint commitment itself. It's not about your internal virtue; it's about the structure of the relationship we created. When we said "Let's paint," we created a new normative entity: the "we." You can't dissolve it alone any more than you can unilaterally divorce a spouse in a system that requires mutual consent.

  **Alex:** The marriage analogy is dangerous. It smuggles in legal and heavy moral institutions. We're talking about a fence. And frankly, your view has a problem with freedom. If I need your permission to stop painting, I am held hostage. What if I get sick? What if the paint is toxic? On your view, do I need a negotiated release to save my own health?

  **Morgan:** Not at all. Joint commitment accounts for special circumstances. But the default is that we decide together. If you're sick, the commitment is naturally undermined or we renegotiate. But the key is that *you* don't get to be the sole judge of when the "we" ends. That's the distinction. In your view, the "we" ends when *I* decide my intention ends. In my view, the "we" persists until *we* decide it ends. That explains why the stayer feels a specific kind of betrayal, not just inconvenience.

  **Alex:** I worry you're reifying a metaphor. "The We." For the cognitive scientist, this is risky. If they design experiments looking for "joint commitment" as a distinct cognitive process, they might miss the actual work: the continuous, low-level negotiation of motor commands. When two people carry a table, they aren't signing a contract. They are adjusting grip pressure based on tactile feedback. If one lets go, the other feels the weight shift. That physical shock is the "wrong." It's immediate, embodied. You don't need a normative ghost to explain the friction.

  **Morgan:** But the journalist isn't writing about table-carrying friction. They're writing about *action*. Why did you lift the table in the first place? Because we intended to. If I drop my end not because I slipped, but because I chose to, the physics is the same, but the meaning is different. The cognitive science of joint action assumes participants are trying to achieve a shared goal. That assumption *is* the philosophical commitment. If you reduce it to "I'm trying to help you help me," you lose the phenomenon. You lose the sense that we are doing it *together*, not just in parallel.

  **Alex:** I don't lose it. I explain it. "Together" is a shorthand for "interlocking intentions with common knowledge." It's parsimonious. Why posit a new kind of subject? Occam's razor. If I can explain the fence case, the table case, and the clapping case using individual psychology plus communication, why add a "plural subject"? It explains nothing that isn't already explained by mutual responsiveness.

  **Morgan:** Because parsimony shouldn't come at the cost of phenomenological accuracy. When we act together, I experience your agency as part of my own field of action. If you walk off the fence, I don't just experience an obstacle; I experience a violation of *our* project. Your reductionism treats the other person as a complex tool in my plan. My theory treats them as a co-author. The "wrong" is the erasure of that co-authorship. You can't derive co-authorship from two solo authors standing next to each other.

  **Alex:** Co-authorship is a nice metaphor, Morgan, but look at the breakdown. If we disagree on how to paint the fence—I want blue, you want white—your theory says we are stuck until we renegotiate the joint commitment. My theory says we have a problem of meshing sub-plans. We talk, we compromise, or we split. If I walk off because you refuse to compromise, did I wrong you? Or did I just realize our sub-plans couldn't mesh?

  **Morgan:** If you walk off without discussion, you wronged me. You bypassed the requirement to negotiate the terms of our joint activity. The obligation isn't to paint forever; it's to negotiate the end of the painting *together*. That's the normative residue of the joint commitment.

  **Alex:** And there we have the impasse. You see a normative bond that binds us until released. I see a pragmatic web that holds as long as it serves our individual plans and relies on our individual integrity. For the scientist, the question is: does the brain treat the "negotiation" differently than the "plan"?

  **Morgan:** Precisely. And I suspect the data will show that when joint action breaks down unilaterally, the neural response isn't just prediction error. It's a social norm violation signal. Distinct from mere surprise.

  **Alex:** Maybe. Or maybe it's just a higher-order prediction error: "I predicted you would continue, you didn't, and now my social model is expensive to update."

  **Morgan:** *[Smiles]* We'll see what the experiments say. But when your neighbor walks off that fence, Alex, don't come to me asking for help carrying the rest of the paint cans. You're on your own.

  **Alex:** I wouldn't expect otherwise. My intention to help you was conditional on your intention to stay. Since that condition failed, my plan updates.

  **Morgan:** And that, right there, is why you'll never understand the fence.

  **Alex:** And that is why I'll never be held hostage by one.
