          *   Alex: Try to ground this in individual norms (fidelity, reliance). If I know you rely on me, quitting is bad. But is it a *joint* right?
      *   **Round 3: Unilateral Rescission.**
          *   Morgan: That's the key. I can't just decide we stop. We must decide together.
