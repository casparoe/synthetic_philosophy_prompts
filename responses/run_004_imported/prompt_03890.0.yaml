      *   Ensure terms like "meshing sub-plans," "common knowledge," "joint commitment," and "unilateral rescission" are used correctly.
      *   *Key moment:* The Bratmanian needs to address the "wronging." Bratman actually does discuss obligation (via consistency and fidelity), so Alex should use that, not deny morality entirely. The disagreement is about the *source* of the obligation.

