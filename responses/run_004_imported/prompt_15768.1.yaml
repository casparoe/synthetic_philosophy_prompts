answer: |-
  **Setting:** *A dimly lit ICU bay. The rhythmic hiss and click of the ventilator is the dominant sound. A patient lies in the bed, chest rising and falling with mechanical precision. Skin is warm, color is reasonable. Two figures stand near the foot of the bed, speaking in low tones.*

  **Characters:**
  *   **Dr. Elena Vance:** Defends the Whole-Brain Criterion (UDDA standard).
  *   **Dr. Marcus Thorne:** Defends the Circulatory-Respiratory Criterion (Shewmon-style skeptic).

  ***

  **Vance:** The harvest team arrives in twenty minutes, Marcus. We need to be certain the line has been drawn correctly. The exams were rigorous. Two apnea tests, absent brainstem reflexes, confirmatory angiogram. The whole brain is dead. The organism is dead.

  **Thorne:** The *brain* is dead, Elena. I'm looking at the organism. Look at him. Capillary refill is under two seconds. His temperature is regulated. He's fighting off the pneumonia he came in with—his white cell count spiked this morning. That isn't a corpse. That is a living human body being ventilated.

  **Vance:** It's a somatic shell. The standard rationale, going back to the President's Commission, is that the brain is the body's central integrator. Without it, the body is just a collection of tissues. The ventilator is doing the work of the lungs, sure, but the brain was the conductor. Without the conductor, the orchestra is silent.

  **Thorne:** That was the 1981 argument. It's empirically false. D. Alan Shewmon spent two decades documenting this. "Brain-dead" bodies aren't just spasming tissues. They heal wounds. They undergo puberty. There are documented cases of pregnant women declared brain-dead who gestated healthy infants for weeks. Homeostasis is happening. If the definition of death is the loss of the functioning organism as a whole, and the organism is demonstrably functioning as a whole—maintaining homeostasis, fighting infection—then by your own biological criterion, this patient is alive.

  **Vance:** You're conflating *cellular* or *organ* integration with *organismal* integration. Yes, the kidneys talk to the heart. But that local feedback isn't enough to sustain the organism in an open environment. The brain is the critical substrate for the organism's relationship with its environment. Without the brain, the body cannot survive without invasive technological life support.

  **Thorne:** But *with* that support, it survives. And we support other organs. If a patient has no kidney function, we dialyze them. We don't declare them dead. If they have no heart function, we put them on ECMO. We don't declare them dead. Why is the brain the one organ where artificial replacement of function equals death?

  **Vance:** *(Pauses, watching the ventilator cycle)* Because the brain isn't just another pump or filter. It's the locus of the *drive*. When the whole brain dies, the capacity for spontaneous respiration is gone forever. That loss is the proxy for the loss of the organism's fundamental vitality. The body isn't sustaining itself; the machine is imposing a rhythm on it.

  **Thorne:** So you've shifted grounds. You started with "integrative unity"—biology. Now you're talking about "spontaneous drive" and "vitality." That sounds suspiciously like you're smuggling in a higher-brain criterion. If the key is the loss of the *capacity* to interact with the world spontaneously, aren't you defining death as the loss of personhood rather than the loss of biological life?

  **Vance:** No. I'm defining it as the loss of the *organism's* ability to function as a unit. The brain is the unique system that makes the body a self.

  **Thorne:** "Self"? Now we're definitely in metaphysics. Let's test this revision. You say the loss of the whole brain marks the end of the organism's unity. But consider the patient in the Persistent Vegetative State (PVS) down the hall. Their cortex is devastated. They have no awareness, no capacity for spontaneous interaction with the environment in any meaningful sense. But their brainstem is intact. They breathe on their own. By your "integrator" argument, they are alive. By your new "spontaneous drive" argument... well, they breathe, so they're alive. But why? If the cortex is gone, what are they?

  **Vance:** They are alive because the brainstem maintains the somatic integration required for spontaneous respiration. The UDDA requires the loss of *all* functions of the *entire* brain, including the brainstem.

  **Thorne:** But why does the brainstem get the veto? If the body can integrate itself homeostatically without the cortex—as the PVS patient shows—and the body can integrate itself homeostatically without the *whole* brain—as the brain-dead patient on a ventilator shows—then the brainstem isn't the magic line either. It's just a threshold of technological intervention. You're saying: if we *can* breathe for you, you're dead. If you can breathe for yourself, you're alive. That makes death dependent on the availability of a ventilator, not biology.

  **Vance:** *(Sighs, leaning against the counter)* I admit, the "integrative unity" argument has taken hits from Shewmon's data. It's harder to claim the body isn't integrating when you see wound healing. But if we abandon whole-brain death, Marcus, we lose the ability to procure viable hearts. We move to circulatory death, and the organs degrade. We save the concept of biological life at the cost of actual lives waiting for transplants.

  **Thorne:** That's a utilitarian calculation, not an ontological one. You're admitting the biology is ambiguous, so you're choosing the definition that serves the utility of transplantation.

  **Vance:** I'm choosing the definition that recognizes the human being is no longer present. When the brain is gone, the *person* is gone, and the body is following a downward trajectory that technology temporarily masks. It's a dying process, not a living state.

  **Thorne:** There it is. "The person is gone." If that's the criterion, then you are a higher-brain theorist, whether you admit it or not. Because if the person is gone when the brain is gone, why is the person *present* in the PVS patient? In PVS, the person—the conscious self—is also gone. Only the biological engine remains. If you say the brain-dead body is a corpse because the person is gone, consistency demands you call the PVS patient a corpse too. But you won't do that.

  **Vance:** Because the PVS patient breathes! There is a spontaneous biological drive.

  **Thorne:** So it *is* about the breathing? Then we are back to circulatory-respiratory criteria. If the heart beats and the lungs move, they are alive. If they stop, they are dead. The brain is irrelevant except as a predictor of when the heart will stop.

  **Vance:** No, because the brain-dead patient's heart won't stop immediately. It can beat for days.

  **Thorne:** Exactly. So you have a beating heart, warm skin, healing wounds, hormonal regulation, and sometimes even gestation. And you want to call that death. The only reason you do, Elena, is because you believe the *mind* is the human being. You believe that when the mind's substrate is destroyed, the human is dead, even if the animal remains. That is a philosophical stance. It is not a physiological finding. And as a physiologist, I thought you'd respect the data over the philosophy.

  **Vance:** I respect the data. The data says the brain is irreversibly destroyed. The data also says that without the brain, the body's integration is fragile, temporary, and entirely dependent on external invasion. I am drawing the line where the human organism loses its *fundamental* capacity to maintain itself *as a human organism*. Not just as meat, but as a being oriented toward the world.

  **Thorne:** "Oriented toward the world." That's the phrase. A PVS patient isn't oriented toward the world. An anencephalic infant isn't oriented toward the world. Are they dead?

  **Vance:** *(Quietly)* No.

  **Thorne:** Why?

  **Vance:** Because the brainstem... the potential...

  **Thorne:** Potential for what? Consciousness? If it's potential for consciousness, then you've abandoned the whole-brain standard for a higher-brain standard, and you're just using the brainstem as a convenient legal proxy to avoid the hard moral choices.

  *(The ventilator alarms softly—a high pressure limit. A nurse adjusts a setting from the doorway. The rhythm resumes.)*

  **Vance:** I'm trying to hold a line that allows us to act morally in the face of tragedy. If we wait for the heart to stop, we lose the chance to save others. If we declare the person dead when the brain is gone, we honor the reality that *this*— *(she gestures to the body)* —is no longer the patient we knew.

  **Thorne:** And I'm trying to hold a line that says we don't kill what is biologically alive just because it's inconvenient or because we think the "person" has left. If you take the heart out of this chest, Elena, you are stopping a circulation that is currently sustaining a living body. You aren't removing an organ from a corpse. You are stopping a life to take a part.

  **Vance:** Then we are at an impasse. I see a corpse being ventilated. You see a patient being kept alive.

  **Thorne:** We aren't disagreeing on the facts. We're disagreeing on what the facts *mean*. You think the brain constitutes the life. I think the circulation constitutes the life.

  **Vance:** I think the brain constitutes the *human* life.

  **Thorne:** And there it is. You're not defining death, Elena. You're defining humanity. And you're doing it in a room where the biology is screaming that it's still here.

  *(Vance looks at the patient's chest, rising and falling. She checks her watch.)*

  **Vance:** The team is here.

  **Thorne:** Then I'll step out. I can't witness this. Not while the blood is still warm.

  **Vance:** And I can't stop it. Not while the law says he's gone.

  *(Thorne nods, once, and turns to leave. Vance stays, watching the monitor, as the scrub team enters the bay.)*
