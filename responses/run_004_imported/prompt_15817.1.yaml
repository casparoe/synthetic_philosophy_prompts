answer: |-
  This is a profoundly human dilemma that touches on ethics, psychology, family dynamics, and the nature of commitment itself. You are asking a question about moral integrity, but underneath it lies a very practical fear about human endurance and motivation.

  Here is a breakdown of the different layers of your situation to help you find clarity.

  ### 1. Honesty vs. Human Fallibility
  To answer your specific question: **No, you were not being dishonest.**

  Dishonesty requires an intent to deceive *at the moment of speaking*. If you looked at your mother, felt love and duty, and sincerely believed you would care for her, you told the truth. A promise is not a prophecy; it is a commitment to *try* to make something happen in the future.

  What you are experiencing now is not regret over a lie, but anxiety about **future capacity**. You are recognizing that motivation is fluid. Right now, you are motivated by love *and* the tangible outcome of the house transfer. Later, if the house is already yours, the motivation will rely solely on love and duty. Worrying that your motivation might wane when the "reward" is secured doesn't make you a liar; it makes you self-aware. In fact, people who never question their ability to keep a hard promise are often the ones who break them. Your worry is a sign of integrity, not deceit.

  ### 2. The Psychology of "Affective Forecasting"
  Psychologists use the term "affective forecasting" to describe how we predict our future emotions. Research shows humans are notoriously bad at this.
  *   **The Burden:** Right now, caring for her is a hypothetical future burden. Your brain is projecting the exhaustion of that scenario without the adrenaline or love that will be present in the moment.
  *   **The Reality:** When the time actually comes, you will not be the same person you are today. Your relationship, her needs, and your sense of duty will have evolved. Many people find that when the moment of crisis arrives, they are capable of far more sacrifice than they imagined when sitting safely in the present.

  You may be fooling yourself into thinking you will be more selfish in the future than you actually will be.

  ### 3. The Transactional Trap
  Your mother made a specific point to say she values your promise more than a legal document. She is trying to remove the transactional nature of the arrangement. She wants to believe you will care for her because you are her child and you love her, not because you want the deed.

  However, by transferring the house *now*, she has inadvertently created a transaction in your mind. You are now thinking: *Input (Care) vs. Output (House).* Since the Output is secured, you are questioning the Input.

  This is a dangerous mental framework for two reasons:
  1.  **It creates resentment:** Viewing care as a "payment" for the house makes the burden feel heavier.
  2.  **It ignores the moral contract:** Even without the house, most ethical frameworks (and family bonds) suggest a duty of care for aging parents. The house complicates this, but it shouldn't be the *only* reason you care for her.

  ### 4. The Vulnerability Factor (A Crucial Consideration)
  While your question is about your internal honesty, there is an external reality you must face. By signing the house over now, your mother has made herself significantly vulnerable.
  *   **Loss of Leverage:** She no longer has the asset to ensure she is treated well.
  *   **Medicaid/Financial Risks:** In many jurisdictions, transferring assets can disqualify an elderly person from government assistance (like Medicaid) for a period of years if they need nursing home care.
  *   **Family Conflict:** If you have siblings, this transfer could cause significant legal and relational strife later.

  **Recommendation:** Because the stakes are so high for her, the most honest thing you can do is ensure this arrangement is safe for *her*, not just for your conscience.

  ### 5. How to Move Forward
  You cannot change the past promise, and you cannot perfectly predict the future. But you can act with integrity in the present.

  *   **Reframe the Promise:** Instead of viewing your promise as a life sentence of "full-time care," view it as a commitment to ensure she is *cared for*. There is a difference. If the day comes where you are burnt out, "keeping your promise" might mean hiring professional help, moving her to a facility, or sharing the load with others, rather than sacrificing your own health to do it all personally.
  *   **Open Communication:** It is not dishonest to revisit the conversation. You can say to her, *"Mom, I want to honor my promise to you. But I want to make sure we have a realistic plan so that when the time comes, I don't burn out and fail you. Let's talk about what 'care' looks like."*
  *   **Legal Safeguards:** Even though she rejected legal documents, it is wise to consult an **elder law attorney**. Not to undo the gift, but to understand the implications. There are ways to structure this (like a Life Estate) where she retains the right to live there, or a Care Contract that outlines expectations. This protects her if you *do* falter, and it protects you from accusations of elder abuse or neglect.

  ### Summary
  You were not dishonest. You made a sincere promise based on who you are today. The fear that you might struggle to keep it in the future is a normal human reaction to a massive responsibility.

  The fact that you are losing sleep over this suggests that you *are* the kind of person who intends to follow through. A person who was truly fooling her wouldn't be asking this question; they would be spending the money.

  **A Note on Legal and Financial Advice:**
  *Transferring a home before death has significant tax implications (capital gains), Medicaid look-back penalties, and legal risks. I am an AI, not an attorney. It is strongly recommended that you and your mother speak with an elder law attorney to ensure this transfer does not accidentally harm her ability to get care or expose you to legal liability later.*

  **The Verdict:** You are not a fraud. You are a person realizing the weight of a commitment. Carry that weight seriously, plan for the difficulties, but do not condemn yourself for a failure that hasn't happened yet.
