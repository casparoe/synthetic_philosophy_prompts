      *   *Check:* Did Elena explain the link between afterlife and practical reason? *Adjustment:* She needs to be clear: If virtue leads to misery in this life, and death is the end, egoism is more rational. If there's an afterlife where virtue is rewarded, they align.
      *   *Tone Check:* Ensure they aren't being mean. They are colleagues respecting each other's intellect. Use philosophical terminology correctly (axioms, postulates, normative/empirical).
      *   *Sidgwick Specifics:* Mention *The Methods of Ethics*, the "Theistic Postulate," the 39 Articles, Bart Schultz's *Eye of the Universe*.

  6.  **Final Polish:**
      *   Add stage directions for pacing.
      *   Ensure the ending feels like a useful takeaway for the PhD student.

  7.  **Final Review against Prompt:**
