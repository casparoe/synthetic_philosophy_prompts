  *(Self-Correction Note)*: Make sure not to make Marcus sound like a logical positivist. He should sound like a philosopher who understands Sidgwick but thinks he went off the rails. Make sure Elena doesn't sound like a spiritualist, but a rigorous interpreter of Sidgwick's system.

