prompt: |-
  Okay so I just got off like a two-hour call with my friend Priya where we went around in circles arguing about Molinism, and I need to turn that energy into something useful instead of just stewing about it. She's catholic and insists middle knowledge is basically the only view that gets you full-blooded divine providence without sacrificing libertarian free will, and every time I brought up the grounding objection she'd accuse me of "just quoting Adams" instead of dealing with how Flint actually answers it. Anyway, I co-host a small philosophy podcast and we've got a guest booked next month who's a philosopher of religion known for defending Molinism pretty much across the board -- natural/middle/free knowledge, the works -- and I don't want the episode to just be her re-explaining the three logical moments to our listeners for the tenth time.

  Can you draft me 8-10 interview questions for her? I want at least one that pushes hard on the grounding objection itself and doesn't let her get away with the "brute counterfactuals are no worse than brute laws" move, one on the would/might distinction -- like, why think it's true that Peter would deny Christ in circumstance C rather than merely that he might -- one on whether transworld depravity is doing real philosophical work in the free will defense or is basically an ad hoc patch bolted on to save theism from the logical problem of evil, and one on the "counterfactual power over the past" worry, where creatures seem to get a kind of veto power over which worlds are even feasible for God to actualize. For each question, throw in a short follow-up keyed to whatever answer she's most likely give, so we don't just sit there nodding along -- I want it to be obvious we saw the dodge coming. Extra credit if the questions read like they came from someone who's actually opened Flint's book and some of Molina's Concordia, not just skimmed the SEP entry the morning of.
