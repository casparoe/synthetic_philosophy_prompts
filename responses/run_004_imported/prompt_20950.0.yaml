answer: |-
  First off, congratulations on the summons? (Or maybe condolences, since you said "ugh.") It is completely normal to feel that way, but you've asked a genuinely brilliant question. You have correctly identified a tension between **statistical theory** and **legal philosophy**.

  The short answer is: The legal system isn't ignoring the math. It is intentionally prioritizing **fairness, deliberation, and legitimacy** over raw statistical accuracy.

  Here is why the Condorcet Jury Theorem (CJT) doesn't translate perfectly to the courtroom, and why we stick with 12 people and unanimous verdicts.

  ### 1. The Assumptions of Condorcet Don't Match Courtrooms
  The Condorcet Jury Theorem is elegant math, but it relies on three specific assumptions that rarely hold true in a trial:

  *   **Independence:** CJT assumes every voter decides *independently*. In a court, jurors are explicitly told to **deliberate**. They talk to each other, influence each other, and change their minds. Once you introduce deliberation, the votes are no longer independent data points; they become a social dynamic.
  *   **Competence ($p > 0.5$):** CJT proves that if every juror is even slightly better than random chance at finding the truth, a large group will be nearly perfect. However, if the average juror is *worse* than random chance (perhaps due to confusing evidence, bias, or complex forensic science), CJT proves the opposite: **a larger group makes it *more* likely you'll get the wrong answer.**
  *   **Binary Truth:** CJT assumes there is an objective "correct" answer (like a coin flip). In law, "truth" is constructed. A verdict isn't "Did he do it?"; it is "Did the state prove he did it *beyond a reasonable doubt*?"

  ### 2. Deliberation is a Feature, Not a Bug
  If you wanted pure statistical accuracy, you wouldn't want jurors talking to each other. You would want them to fill out a secret ballot immediately upon entering the courtroom and drop it in a box.

  But the legal system believes that **discussion improves justice.**
  *   **Correcting Mistakes:** One juror might have missed a detail in testimony that another caught.
  *   **Checking Bias:** A prejudiced juror might be talked out of their bias by 11 others.
  *   **The "Holdout" Value:** In a 100-person majority-rule system, the 51 people can ignore the 49. In a 12-person unanimous system, the majority *must* engage with the minority. That friction forces the majority to refine their arguments and ensures the evidence is robust enough to convince a skeptic.

  ### 3. The "Reasonable Doubt" Standard
  The goal of a criminal trial is not necessarily to find the truth; it is to prevent the **wrongful conviction** of the innocent.

  *   **Majority Rule:** If 51 out of 100 people think you're guilty, you go to prison. That leaves 49 people who have a reasonable doubt.
  *   **Unanimity:** If 11 out of 12 people think you're guilty, you do *not* go to prison (it's a hung jury).

  The system is designed to err on the side of letting guilty people go free rather than punishing innocent people. Unanimity acts as a "safety valve." If one person sees a flaw in the logic that the other 11 missed, unanimity protects the defendant. CJT optimizes for *accuracy*; the Constitution optimizes for *liberty*.

  ### 4. Logistics and Group Dynamics
  There are practical reasons we don't use 100-person juries:
  *   **Effective Deliberation:** It is impossible for 100 people to have a meaningful conversation in a room. It becomes a lecture or a chaotic shouting match. 12 is roughly the maximum number of people who can engage in a true round-table discussion.
  *   **Cost:** Housing, feeding, and paying 100 jurors for a two-week trial is prohibitively expensive for the state.
  *   **Groupthink:** Paradoxically, larger groups can sometimes succumb to social pressure *more* than small groups. In a massive group, individuals may feel less responsible for the outcome and defer to loud leaders.

  ### 5. The Supreme Court Has Actually Tested This
  This isn't just theoretical; the Supreme Court has looked at the math.
  *   **Jury Size:** In *Williams v. Florida* (1970), the Court ruled that 6-person juries were constitutional in some cases, but later cases (*Burch v. Louisiana*) pushed back, suggesting 6 was too small to promote effective deliberation. 12 remains the "gold standard" for serious crimes.
  *   **Unanimity:** As recently as 2020 (*Ramos v. Louisiana*), the Supreme Court ruled that **unanimous verdicts are required** for serious criminal offenses. They explicitly rejected the idea that a majority vote is sufficient, noting that non-unanimous verdicts historically undermined the reliability of the jury system and disproportionately affected minority defendants.

  ### Summary
  You aren't missing anything about the math; the Condorcet Jury Theorem is correct *within its own constraints*. But the legal system isn't trying to solve a math problem; it's trying to solve a **human rights** problem.

  *   **CJT asks:** "How do we maximize the probability of a correct verdict?"
  *   **The Law asks:** "How do we ensure the state cannot take away a citizen's liberty unless a diverse group of peers is completely convinced?"

  So, when you show up for jury duty, remember: You aren't a data point in a statistical algorithm. You are a check on government power. The "inefficiency" of the system is actually the protection it offers.

  (And yes, it's still a pain in the neck. Bring a book.)
