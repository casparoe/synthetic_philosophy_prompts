      *   *What does it say?* If each voter has a probability $p > 0.5$ of being correct, and votes are independent, then as $n \to \infty$, the probability of the majority being correct $\to 1$.
      *   *What are the assumptions?*
          1.  Binary choice (Guilty/Not Guilty).
          2.  Independence (Jurors don't influence each other).
          3.  Competence ($p > 0.5$ for every juror).
          4.  Sincere voting (Voting for what they believe is true, not strategically).
      *   *Where does it fail in court?*
          *   Independence is violated (deliberation).
          *   Competence is not guaranteed (jurors might be confused, biased, or $p < 0.5$).
