      *   *Deliberation:* 100 people cannot effectively deliberate together. It becomes a lecture or a chaotic mob. Small groups allow for discussion.
      *   *Representation vs. Efficiency:* 12 is seen as a balance between cross-section of community and manageability.

  4.  **Address the "Why Unanimous?" question (Philosophy & Protection):**
      *   *Reasonable Doubt:* Unanimity forces the majority to persuade the minority. It ensures the standard of "beyond a reasonable doubt" is met.
      *   *Minority Protection:* Prevents the tyranny of the majority. A single holdout might see a flaw everyone else missed.
      *   *Legitimacy:* A unanimous verdict carries more weight and public trust than a 51-49 split.
      *   *Supreme Court Precedent:* *Ramos v. Louisiana* (2020) made unanimous verdicts mandatory in state criminal trials. *Burch v. Louisiana* (1979) addressed jury size (6 vs 12).

