prompt: |-
  I'm working on a piece about the stranger corners of AI safety thinking, and next week I've got a decision theorist on the line who's spent years arguing that both humans and future AI systems should adopt 'surrogate goals' as insurance against acausal threats -- the kind of blackmail that can work on you even with zero causal contact with the threatener, just through prediction. The pitch is basically: precommit to treat some cheap, made-up thing as your real pressure point, so any would-be extortionist ends up targeting that instead of whatever you actually can't stand to loose. Can you draft me 7-8 interview questions that really get into the mechanics rather than letting her just restate the pitch? I want at least one on the obvious worry that this just hands the blackmailer a new lever instead of removing the old one, one on why the whole trick depends on the threatener knowing (and caring) that you've made the swap, and one tying it to the 'commitment races' problem -- does locking in your surrogate goal early just make you a sitting duck for whatever agents commit after you? For each, tack on a quick follow-up guessing at the dodge she'll probably reach for.
