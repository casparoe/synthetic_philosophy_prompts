  2.  **Analyze the Concepts:**

      *   **Biological Species Concept (BSC - Mayr):**
          *   *Definition:* Groups of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups.
          *   *Pros:* Strong theoretical basis for sexual organisms, explains distinctness via gene flow barriers.
          *   *Cons:* Fails for asexuals, fossils, allopatric populations (potential interbreeding is untestable).
          *   *Verdict:* Historically dominant but theoretically limited in scope.

      *   **Phylogenetic Species Concept (PSC - Cracraft/Diagnosability):**
          *   *Definition:* Smallest diagnosable cluster of individual organisms within which there is a parental pattern of ancestry and descent.
          *   *Pros:* Applicable to asexuals and fossils (if characters preserved).
          *   *Cons:* Prone to oversplitting (every unique mutation creates a species), depends on character choice (arbitrariness), doesn't necessarily reflect evolutionary independence.
          *   *Verdict:* Operationally useful but theoretically weak on "why" these clusters matter.

      *   **Evolutionary Species Concept (ESC - Simpson/Wiley):**
          *   *Definition:* A lineage (an ancestral-descendant sequence of populations) evolving separately from others and with its own unitary evolutionary role and tendencies.
          *   *Pros:* Broad scope (sexual/asexual, extant/extinct), focuses on lineage independence.
          *   *Cons:* Vague ("unitary evolutionary role" is hard to define/measure), potentially retrospective.
          *   *Verdict:* Strong theoretical contender for realism, but operationalization is hard.

      *   **Ecological Species Concept (EcSC - Van Valen):**
          *   *Definition:* A set of organisms exploiting a single niche.
          *   *Pros:* Explains coexistence, applicable to asexuals.
          *   *Cons:* Niche boundaries are fuzzy, different species can share niches, one species can occupy multiple niches (polymorphism).
          *   *Verdict:* Important factor, but poor as a sole definitional criterion.

      *   **Recognition Species Concept (RSC - Paterson):**
          *   *Definition:* Focuses on the Specific Mate Recognition System (SMRS).
          *   *Pros:* Mechanistic focus on *why* interbreeding happens (positive cohesion).
          *   *Cons:* Still limited to sexuals, doesn't handle allopatry well, ignores ecological context.
          *   *Verdict:* Refinement of BSC, inherits many limitations.

      *   **Cohesion Species Concept (CSC - Templeton):**
          *   *Definition:* The most inclusive population of individuals having the potential for phenotypic cohesion through intrinsic cohesion mechanisms (gene flow + shared selective factors).
          *   *Pros:* Synthesizes BSC (gene flow) and EcSC (selection), handles asexuals via selection.
          *   *Cons:* Complex, "potential" is still tricky, can be hard to measure.
          *   *Verdict:* One of the most robust theoretical syntheses.

      *   **Genotypic Cluster Species Concept (Mallet):**
