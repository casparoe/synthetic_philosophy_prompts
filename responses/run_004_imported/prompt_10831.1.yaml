      *   **Focus:** Chapter VI ("The Ideal"), specifically the tension between §50 (Chapter III) and §113 (Chapter VI).
      *   **Issue 1 (Consistency):** Does calling unperceived beauty's value "negligible" in §113 contradict or retreat from the "method of absolute isolation" argument in §50 (where unperceived beauty *does* have intrinsic value, unlike filth)?
      *   **Issue 2 (The Jump to Normativity):** How does Moore get from "personal affection and aesthetic appreciation are the greatest goods" to "they are the *sole criterion* of social progress and the *raison d'être* of virtue"? Is there a hidden premise (utilitarian maximization), does "organic unities" do the work, or is it just intuitionist assertion?

  2.  **Deconstruct Issue 1: The Status of Unperceived Beauty (§50 vs. §113)**
