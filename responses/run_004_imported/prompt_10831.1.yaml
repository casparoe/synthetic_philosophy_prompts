      *   **Conclusion:** Summarize. It's not a retreat in §113, and the "jump" relies on the consequentialist framework laid out in Ch. I/IV, though it is asserted confidently here.

  5.  **Refine the Tone:**
      *   Academic but accessible (reading group context).
