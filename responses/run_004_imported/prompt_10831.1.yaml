          *   *Resolution:* It's not a retreat; it's a refinement. §50 establishes the *category* of intrinsic value (it can exist without consciousness). §113 establishes the *magnitude* of that value relative to other goods. Moore remains consistent: Unperceived beauty > Unperceived filth (§50), but Conscious Beauty >>> Unperceived Beauty (§113). The "negligible" comment is comparative, not absolute.
      *   *Key Textual Evidence:* Moore explicitly says in §113: "I have myself urged in Chap. III. (§ 50) that the mere existence of what is beautiful does appear to have some intrinsic value; but I regard it as indubitable that Prof. Sidgwick was so far right... that such mere existence... has value, so small as to be negligible." He acknowledges his previous point but contextualizes its magnitude.

  3.  **Deconstruct Issue 2: The Jump to the "Sole Criterion" (The Normative Leap)**
      *   *The Premise:* Personal affection + Aesthetic enjoyment = The Greatest Goods (The Ideal).
      *   *The Conclusion:* These are the *sole* justification for duty, virtue, and social progress.
      *   *The Missing Link:* Why does identifying the *Good* dictate the *Right*?
