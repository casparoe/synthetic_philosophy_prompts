answer: |-
  This is an excellent set of questions. You have put your finger on two of the most critical structural joints in *Principia Ethica*. The tension between §50 and §113 regarding unperceived beauty, and the apparent leap from axiology (what is good) to normativity (what we ought to do), are exactly where Moore's system is most vulnerable to criticism—and where understanding his architecture is most crucial.

  Here is a reconstruction of how Moore intends these passages to cohere, and where the "hidden" argumentative work is actually being done.

  ### 1. The Consistency Question: §50 vs. §113 on Unperceived Beauty

  You are right to sense a shift in emphasis, but Moore does not view this as a retreat or a contradiction. Rather, he is distinguishing between **ontological independence** and **comparative magnitude**.

  **In §50 (Chapter III):**
  Moore's adversary here is Hedonism (specifically Sidgwick's). The hedonist claims that nothing has value unless it is a state of consciousness (pleasure). Moore's "method of absolute isolation" is designed to break the *necessary connection* between value and consciousness.
  *   **The Claim:** A beautiful world *without* a mind is better than an ugly world *without* a mind.
  *   **The Goal:** To prove that intrinsic value can reside in the object (or the state of affairs) itself, not merely in the *feeling* of the subject. If he concededs that unperceived beauty has *zero* value, he loses the argument against Hedonism. He must establish that it has *some* positive value.

  **In §113 (Chapter VI):**
  Moore's project here is constructive. He is no longer asking "Does value require a mind?" but rather "What constitutes the *Ideal*? Where is the bulk of value found?"
  *   **The Claim:** While unperceived beauty has *some* value (preserving the §50 point), the value of *conscious appreciation* of beauty is vastly superior.
  *   **The "Negligible" Comment:** When Moore says the value of unperceived beauty is "negligible," he means negligible *in comparison* to the complex whole of "consciousness of beauty." He is making a quantitative claim, not a qualitative retraction.

  **The Synthesis:**
  Moore is threading a needle. He wants to say to the Hedonist: "You are wrong that value *requires* consciousness (§50)." But he also wants to say to the Platonist or Objectivist: "You are wrong if you think the object alone is where the real value lies (§113)."
  *   **Unperceived Beauty > Unperceived Filth** (This saves him from Hedonism).
  *   **Conscious Beauty >>> Unperceived Beauty** (This saves him from implying that we should prioritize creating beautiful rocks over happy people).

  So, to answer your first question: It is not a retreat. It is a calibration. He maintains the *principle* of §50 (value exists without perception) while accepting Sidgwick's *practical intuition* (that the vast majority of value is tied to consciousness). He treats §50 as a logical boundary condition and §113 as the substantive account of the Good.

  ### 2. The Normative Jump: From "The Good" to "The Right"

  Your second question is the more philosophically significant one. You ask how Moore gets from "Affection and Aesthetic Appreciation are the greatest goods" to "These are the sole criterion of social progress and the *raison d'être* of virtue."

  You suspect a hidden premise. You are correct. The premise is **Moore's Ideal Utilitarianism**, established in Chapter I and Chapter IV, but it is operating in the background of Chapter VI.

  **The Hidden Syllogism:**
  Moore is not arguing for this normative conclusion *in* §113; he is deriving it from definitions laid out earlier. The argument structure is:

  1.  **Meta-Ethical Definition (Ch. I, §13):** "Right" or "Duty" is defined strictly as that action which produces the maximum amount of intrinsic good in the universe. (This is his consequentialist axiom).
  2.  **Axiological Discovery (Ch. VI, §113):** Through the method of isolation and intuition, we discover that the only things with significant intrinsic value are "personal affection" and "aesthetic appreciation." (Everything else is either instrumental or negligible).
  3.  **Normative Conclusion (Ch. VI, §113):** Therefore, the only justification for any duty or virtue is that it produces more of these specific states.

  **Why it looks like an assertion:**
  In §113, Moore treats the conclusion as "obvious" because he assumes the reader has accepted the consequentialist framework of Chapter I. If "Right" *means* "Maximize Good," and we have identified "The Good," then the "Right" is mathematically determined. He writes: *"it is only for the sake of these things... that any one can be justified in performing any public or private duty."*
  This is not a new moral claim; it is the application of his definition of 'duty' to his newly discovered list of 'goods'.

  **Does "Organic Unity" do the work?**
  No, not regarding the *normative jump*. The doctrine of "Organic Unities" (introduced in Chapter III) serves a different function. It explains *why* the value of "consciousness of beauty" is not just the sum of "consciousness" + "beauty." It protects the *quality* of the good from reductionism.
  *   Without Organic Unities, a hedonist might say: "The value is just the pleasure you feel."
  *   With Organic Unities, Moore says: "The value is the specific relation of a mind to a beautiful object."
  This concept secures the *Axiology* (what is good), but it does not secure the *Normativity* (why we must pursue it). The normativity comes entirely from the consequentialist definition of 'right' established in Chapter I.

  **Is it just Intuition?**
  Moore relies on intuition to validate Premise #2 (that affection and beauty are the goods). He says, *"No one, probably, who has asked himself the question, has ever doubted..."* He thinks this is self-evident to careful reflection.
  However, he relies on **logic** (specifically means-end rationality) to validate the Conclusion. If you accept that you ought to maximize the good, and you accept that these are the only goods, you *must* accept that duty is solely about producing them.

  ### Critical Context for Your Reading Group

  Since you are discussing this in the context of Cambridge Ethics, it is worth noting that this specific "jump" is where Moore's successors (particularly the Intuitionists like W.D. Ross and H.A. Prichard) broke with him.

  1.  **The Separation of Right and Good:** Ross argued that Moore's definition of 'right' (as maximizing good) was itself a fallacy. Ross claimed we have *prima facie* duties (like fidelity or reparation) that are not justified solely by their production of "affection and aesthetic enjoyment." Moore's §113 claim that virtue has no value *except* as a means to these states was a major point of contention for later deontologists.
  2.  **The "Naturalistic" Worry:** While Moore accuses others of the Naturalistic Fallacy, critics argued that defining 'duty' as 'maximizing good' is its own form of reductionism. By making the "sole criterion of social progress" the production of these mental states, Moore risks ignoring the intrinsic value of justice, liberty, or truth-telling, unless they can be shown to produce affection or beauty.
  3.  **The "Negligible" Retreat:** Your reading group might also discuss whether Moore's §113 admission (that unperceived beauty is negligible) actually undermines his §50 argument. If the value is *so* small that it never impacts practical reasoning, does it matter that it exists? Moore would say yes (because truth matters), but practically, he concedes the utilitarian calculus to Sidgwick while winning the metaphysical argument.

  ### Summary
  *   **On §50 vs. §113:** No contradiction. §50 establishes that value *can* exist without consciousness (anti-hedonism); §113 establishes that the *vast majority* of value *does* involve consciousness (practical axiology).
  *   **On the Normative Jump:** The argument relies on the consequentialist definition of 'right' from Chapter I. If Right = Maximize Good, and Good = Affection + Aesthetic, then Right = Maximize Affection + Aesthetic. The "Organic Unity" point explains the *nature* of the good, not the *obligation* to pursue it.

  Moore asserts the conclusion in §113 with confidence because he believes the premises were settled in Chapters I and III. Whether those premises hold up is, of course, the history of 20th-century ethics.
