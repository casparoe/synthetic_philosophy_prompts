      *   *Role of "Organic Unities":* Does this do the work? Not exactly for the *jump* to normativity. It explains *why* these states are the greatest goods (the whole is greater than the sum of parts: emotion + object). It prevents reductionism. But the move from "This is the Good" to "Do this" relies on the consequentialist framework established earlier.
      *   *Intuitionism:* Moore does rely on intuition for the *identification* of the good (§113 says "No one... has ever doubted"). But the *normative force* comes from the consequentialist structure.

  4.  **Synthesize the Argument for the Response:**
