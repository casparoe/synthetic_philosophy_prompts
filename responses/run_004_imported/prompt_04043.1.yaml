prompt: |-
  I am a philosophy PhD student working on the metaphysics of causation, and I would like your help thinking through a tension in the causation-by-omission literature that I have not seen satisfactorily resolved. Counterfactual/dependence theories seem committed to holding that a lifeguard's failure to jump in caused a swimmer's death, yet the very same counterfactual test seems to make anyone else who could have intervened -- a distracted bystander, a stranger walking by -- equally a cause, since the drowning would equally have been prevented had they acted. Physical-process theories such as Dowe's avoid this over-generation, but only by relegating omissions to mere 'quasi-causation,' which sits awkwardly with the way both ordinary judgment and the common-law tradition analyzed by Hart and Honoré treat certain failures to act as genuine causes. Please explain why this dilemma resists easy resolution, and assess how promising you find the main proposed escapes -- for instance, building normative or statistical defaults into the causal relation itself, restricting causation to a contextually selected contrast class, or simply decoupling the metaphysics of causation from questions of moral and legal responsibility.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy PhD student specializing in metaphysics of causation.
      *   **Topic:** Causation by omission (specifically the tension between counterfactual dependence and physical process theories).
      *   **Problem:** The "over-generation" problem (too many causes) vs. the "quasi-causation" problem (denying genuine causation).
      *   **Task:** Explain *why* this dilemma resists easy resolution and assess the main proposed escapes (normative defaults, contrastivism, decoupling metaphysics from responsibility).
      *   **Tone:** Academic, rigorous, nuanced, acknowledging the depth of the literature.

  2.  **Deconstruct the Dilemma:**
      *   *Horn 1: Counterfactual/Dependence Theories (Lewis, etc.).*
          *   Strength: Captures the intuition that the lifeguard's omission *is* a cause. Matches legal/moral practice (Hart & Honoré).
          *   Weakness: "Profligacy" or "Over-generation." If $C$ hadn't happened, $E$ wouldn't have. But if *anyone* had jumped in, $E$ wouldn't have. So everyone is a cause. This violates the intuition that causation is selective/discriminating.
      *   *Horn 2: Physical Process/Conservation Theories (Dowe, Salmon).*
          *   Strength: Avoids over-generation. Only actual energy/momentum transfers count.
          *   Weakness: Relegates omissions to "quasi-causation." But omissions *feel* like causes, and the law treats them as such (e.g., negligence). It creates a gap between metaphysics and special sciences/law/ethics.
      *   *Why it resists resolution:* It's a clash between two deep intuitions: (1) Causation is about difference-making (counterfactual), and (2) Causation is about physical connection (process). Omissions are "nothing," so how can "nothing" be a physical cause? But "nothing" makes a difference.

  3.  **Evaluate Proposed Escapes:**

      *   **Strategy 1: Normative/Statistical Defaults (Hart & Honoré, McGrath, Schaffer).**
          *   *Idea:* Only omissions that violate a norm or statistical expectation count as causes. The lifeguard has a duty; the bystander does not.
          *   *Assessment:* Solves the legal/moral selection problem. But does it solve the *metaphysical* problem? It risks conflating causation with responsibility. Is causation normative? Most metaphysicians say no (naturalism).
          *   *Verdict:* Good for pragmatics, controversial for metaphysics.

      *   **Strategy 2: Contrastivism (Schaffer, Hitchcock).**
          *   *Idea:* Causation is a ternary relation: $C$ rather than $C^*$ causes $E$ rather than $E^*$.
          *   *Assessment:* Handles the "which omission?" problem by fixing the contrast. The lifeguard's *failure-to-jump* (vs. jumping) causes death. The bystander's *failure-to-jump* isn't the relevant contrast because they weren't expected to.
          *   *Verdict:* Elegant, but pushes the problem to the selection of contrasts. Who selects the contrast? If it's context, is causation context-sensitive?

      *   **Strategy 3: Decoupling Metaphysics from Responsibility (Moore, Ehring).**
          *   *Idea:* Accept the profligacy. Yes, the bystander is a *cause*, but not *responsible*. Metaphysics is one thing; law/morals is another.
          *   *Assessment:* Preserves a naturalistic metaphysics. But it makes causation less useful for the special sciences and law. It feels like biting a very large bullet.
          *   *Verdict:* Metaphysically clean, pragmatically costly.

      *   **Strategy 4: Absences as Real Entities (Armstrong, Mumford).**
          *   *Idea:* Treat absences as ontological primitives or real properties.
          *   *Assessment:* Ontologically extravagant. Most prefer parsimony.

