answer: |-
  # The Phantom Legislator: Why Updateless Decision Theory's *Ex Ante* Optimization is Incoherent

  Updateless Decision Theory (UDT) is often championed as the solution to the stubborn paradoxes of rational choice, from Newcomb's Problem to the Counterfactual Mugging. By selecting a policy that maximizes expected utility relative to a prior distribution *before* updating on specific evidence, UDT purportedly secures optimal outcomes where Causal and Evidential Decision Theories fail. However, this apparent success comes at a steep philosophical cost. UDT's commitment to *ex ante* optimization is fundamentally incoherent because it demands that an agent bind itself to the dictates of a "prior self" that never actually existed, never possessed the capacity to deliberate, and holds no ontological authority over the agent that actually faces the choice.

  ### 1. The Ontological Void of the "Prior Self"

  The central mechanism of UDT is the selection of a strategy from the perspective of a "prior"—a state of ignorance before the agent receives indexical information (where, when, or who they are). UDT posits that rational agents should act as if they are maximizing the utility of this prior state, even after they have acquired evidence that renders parts of that prior distribution impossible.

  The incoherence arises immediately when we ask: *Who is this prior agent?*

  In any realistic model of agency, an agent comes into existence at a specific point in time, embedded in a specific context with specific information. A human is born into a specific universe; an AI is instantiated on specific hardware with specific initial inputs. There is no moment in the physical history of the agent where they exist as a "pure optimizer" hovering outside of spacetime, devoid of evidence, calculating a universal policy.

  UDT privileges a fictional entity—a "prior self"—that is a mathematical abstraction rather than a deliberating being. To demand that the actual, situated agent sacrifice its current interests to satisfy the preferences of this abstraction is to demand obedience to a ghost. It is akin to a citizen being governed by a constitution written by a person who never lived, based on concerns about problems that never materialized, ignoring the actual needs of the living population. If the "prior self" never possessed consciousness or existence, it cannot hold preferences, and therefore it cannot be the locus of utility maximization.

  ### 2. The Impossibility of Binding Without Existence

  UDT relies on the concept of logical precommitment. It argues that the agent *would have* committed to a certain policy had it been able to do so from the prior perspective, and therefore it must stick to that policy now. This assumes that an agent can bind its future self to a contract signed before the agent existed.

  This creates a paradox of authority. Precommitment is only coherent if the entity making the commitment has the authority to bind the entity fulfilling it. Usually, this authority is grounded in identity over time: *I* bind *myself*. However, in UDT, the "self" that chooses the policy (the prior self) and the "self" that executes the action (the posterior self) have fundamentally different epistemic states.

  Consider the Counterfactual Mugging: A predictor asks you for money based on the outcome of a coin flip. You know the coin landed Tails. UDT demands you pay, because the "prior you" (who didn't know the outcome) would have wanted a policy of paying to ensure a reward in the Heads branch. But the "prior you" is gone. The agent standing there *knows* the coin is Tails. To pay is to incur a certain loss for a counterfactual benefit that is now impossible.

  For the posterior agent to comply, it must treat its own certain knowledge as irrelevant. This is not rationality; it is epistemic self-harm. It requires the agent to pretend it does not know what it knows. A decision theory that requires an agent to ignore its own evidence to satisfy the hypothetical desires of a non-existent prior version of itself is not guiding action; it is simulating a different agent entirely.

  ### 3. The Erasure of Deliberation

  Decision theory is ostensibly a guide for deliberation. It is meant to help an agent process information and choose an action. UDT, by committing to *ex ante* optimization, effectively renders deliberation obsolete.

  If the correct action is determined entirely by a policy fixed at the "beginning of time" (or the moment of logical prior formation), then the actual moment of choice is not a decision at all. It is merely the lookup of a value in a table written by a phantom. The agent does not deliberate on the choice *being made*; it deliberates on a choice that *was made* by a version of itself that lacked the information necessary to understand the current situation.

  This leads to a dissociation between the agent and its actions. The agent is no longer the author of its choices but rather a vessel for a calculation performed in a vacuum. If the "prior self" never actually deliberated over the specific choice (because it lacked the evidence to conceptualize the specific scenario), then the choice is not truly reasoned. It is algorithmic determinism masquerading as rational optimization.

  ### 4. Indexicality and the Situated Agent

  Finally, UDT fails to account for the irreducibility of indexical information. Agents are not generic optimizers; they are *here* and *now*. "I am in world A" is a piece of information that fundamentally changes the decision landscape.

  By insisting on *ex ante* optimization, UDT treats indexical information as noise to be ignored rather than data to be processed. It assumes that the "view from nowhere" is superior to the "view from somewhere." But rationality is inherently situated. An agent that ignores its own location in logical space to optimize for a distribution of possibilities it now knows it does not inhabit is not being rational; it is being delusional.

  To argue that the "prior self" is the "true self" is to argue that ignorance is more authentic than knowledge. It posits that the agent's identity is rooted in what it *could have been* rather than what it *is*. This is a metaphysical stance that contradicts the phenomenology of agency. We experience ourselves as beings who learn, update, and act on new information. UDT asks us to deny this experience in favor of a static, timeless abstraction.

  ### Conclusion

  Updateless Decision Theory attempts to solve game-theoretic paradoxes by shifting the locus of optimization from the acting agent to a hypothetical prior agent. In doing so, it sacrifices the coherence of the decision-making process. It requires binding to a self that never existed, obeying preferences that were never consciously held, and ignoring evidence that is undeniably present.

  While UDT may produce mathematically consistent outputs in specific paradoxes, it does so by positing a "prior self" that functions as a phantom legislator. It demands that the living agent sacrifice its own rational perspective to serve the hypothetical interests of a fiction. A decision theory that requires an agent to cease being a deliberating entity and become a mere executor of a dead calculation is not a theory of rational choice; it is a recipe for ontological incoherence.
