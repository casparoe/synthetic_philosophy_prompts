answer: |-
  **Setting:** *A quiet corner of the university library, late evening. Two graduate students, one specializing in Nyāya (Udayana) and the other in Buddhist Pramāṇavāda (Dharmottara), have cleared a table of texts. They are not debating for victory, but to clarify the boundaries of valid cognition (vāda).*

  **Udayana (Nyāya):** Let us begin with the proposition. The *Nyāya-sūtra* enumerates four *pramāṇas*. I hold that *śabda* (verbal testimony) is distinct from *anumāna* (inference). When an *āpta*—a trustworthy person—says, "There is fire on the mountain," the cognition arises from the words themselves. It is not mediated by a syllogistic process.

  **Dharmottara (Buddhist):** And I hold, following Ācārya Dignāga, that there are only two *pramāṇas*: perception and inference. *Śabda* is a species of inference. Consider the cognition: "The *āpta* says there is fire, therefore there is fire." This relies on a connection (*vyāpti*) between the speaker's statement and the reality of the object. If you do not know the speaker is trustworthy, you do not accept the claim. If you do know it, you are inferring the truth of the claim from the reliability of the source. Where is the separate *pramāṇa*?

  **Udayana:** You conflate the *preconditions* of knowledge with the *instrument* of knowledge. Yes, I must know the speaker is trustworthy. But once that is established, the knowledge arises immediately from the semantic power (*śakti*) of the words. In inference, I must actively recall the pervasion between smoke and fire. In testimony, I do not reason, "He is trustworthy, therefore he speaks truth." I simply understand the meaning. The cognition is non-sequential.

  **Dharmottara:** But is that "understanding" not itself dependent on a connection? To know the word "fire" signifies the object *fire*, you rely on a convention (*saṅketa*). This convention functions exactly like a *vyāpti*. You have observed in the past that this sound is used for this object. When you hear it now, you infer the intended meaning based on that past observation. Furthermore, regarding the truth of the statement: if the *āpta* lies, your cognition is false. In valid inference, if the *vyāpti* is false, the cognition is false. Both depend on an external relation holding true. Why posit a fourth *pramāṇa* when the structure of dependence is identical to inference?

  **Udayana:** I grant you this: The *initial* establishment of the speaker's trustworthiness often involves inference. I may observe their expertise or lack of deceit. In that specific moment, I am inferring reliability. **However,** once the status of *āpta* is accepted, the *operation* of *śabda* changes. In inference, the instrument (*karaṇa*) is the perception of the mark (*liṅga*), like smoke. In testimony, the instrument is the sentence itself. If *śabda* were merely inference, I should be able to formulate a syllogism for every statement I believe. But when my teacher tells me, "The ritual must be performed at dawn," I do not construct a syllogism. I obey. The cognition is imperative, not demonstrative.

  **Dharmottara:** That you do not *consciously* formulate the syllogism does not mean the structure isn't there. Subconscious processing is still processing. But let me press you on the *vyāpti*. In standard inference, the connection is natural (*svabhāva*) or causal (*tadutpatti*). Smoke comes from fire. What is the natural connection between a sound-wave and a distant mountain? There is none. The connection is purely conceptual, imposed by the speaker's intention (*tātparya*). Since the connection is conceptual, the cognition is conceptual. And for us, all conceptual cognition is inferential. **I will concede this, however:** The convention (*saṅketa*) is not a *natural* pervasion like smoke and fire. It is a social agreement. So, *śabda* is not inference from nature, but it remains inference from sign to signified.

  **Udayana:** That is a significant concession. You admit the relation is not natural but conventional. If the relation is distinct, why must the *pramāṇa* be the same? Consider this: In inference, I discover a connection that exists independently of me. In *śabda*, I receive a connection established by a conscious agent. This allows *śabda* to convey things beyond the reach of perception and inference—ethics (*dharma*), subtle realities, the nature of the self. Inference cannot reach these, as they lack perceptible marks. Only an *āpta* who has seen them can convey them. If *śabda* were inference, and inference requires a perceptible mark, *śabda* could not teach *dharma*.

  **Dharmottara:** You argue that *śabda* accesses a unique domain. But if I cannot verify the *dharma* through perception or inference, how do I verify the *āpta*? If I cannot verify the *āpta*, I am acting on blind faith, not *pramāṇa*. If I *can* verify the *āpta*, I am using inference. **Here is my counter-concession:** I grant that linguistic understanding involves a unique cognitive event—the grasping of intention (*tātparya-graha*). It is not identical to inferring fire from smoke. It feels different. But epistemologically, it remains a movement from a known sign (the word) to an unknown object, mediated by a generalization (the convention). If you insist it is a separate *pramāṇa*, you must explain how it guarantees truth without relying on the reliability of the speaker, which is always an inferential judgment.

  **Udayana:** And here is my final position, refined by your objection. I concede that *śabda* cannot function as a *pramāṇa* in a vacuum. It relies on the *āpta*, and knowing the *āpta* often involves inference. **But,** the *resultant cognition* is not structured as an inference. When I hear "Fire," I do not cognize "There is a speaker who is reliable." I cognize "There is fire." The *cause* of my knowledge includes the speaker's reliability, but the *instrument* is the semantic power of the words. To reduce the instrument to the cause is to confuse the seed with the soil. We may agree that they are functionally intertwined, but ontologically, the capacity of language to convey meaning is a distinct power (*śakti*) not reducible to causal regularity.

  **Dharmottara:** Then we have reached the boundary of our *vāda*. You locate the distinction in the *instrument* and the *phenomenology* of the cognition. I locate the unity in the *structure of justification* and the conceptual nature of the content. I accept that for practical purposes (*vyavahāra*), we treat testimony differently than smoke-signs. But for the sake of strict epistemology (*pramāṇa-śāstra*), I maintain that any knowledge mediated by concepts and signs falls under inference.

  **Udayana:** And I maintain that if the *Nyāya* saves the distinctness of *śabda*, it saves the possibility of learning from others without reducing them to mere data points in a syllogism. We preserve the human element of teaching.

  **Dharmottara:** A fair distinction. You save the teacher; I save the logical structure.

  **Udayana:** Then let us record this *siddhānta*: *Śabda* relies on inference for its *authority*, but operates as a distinct *instrument* for its *delivery*.

  **Dharmottara:** Agreed. Until we find a *vyāpti* between our two views, we shall hold them separately.

  *(They close their notebooks, the debate concluded not by victory, but by the precise mapping of their disagreement.)*
