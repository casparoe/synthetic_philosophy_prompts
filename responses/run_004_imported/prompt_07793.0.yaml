  *(Self-Correction on the Lost Bow)*: In the *Kongcongzi*, Gongsun Long argues that Confucius criticized the King of Chu for limiting the finder to a "man of Chu" rather than a "man." Gongsun Long tries to say, "See, Confucius distinguishes categories too." Kong Chuan needs to point out that Confucius wanted to *widen* the category (Chu -> Human), whereas Gongsun Long wants to *exclude* the sub-category from the main category (White Horse -> Not Horse). This is the key philosophical pivot.

  7.  **Final Review against constraints:**
