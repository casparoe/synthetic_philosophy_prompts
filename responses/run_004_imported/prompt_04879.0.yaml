      *   *Kim's Response (Functional Reduction):* Kim distinguishes between properties that can be *functionally reduced* and those that cannot.
      *   *Mechanism:* Temperature *is* mean kinetic energy (in ideal gases). We can define temperature functionally (role: causes expansion) and find the physical realizer (mean KE). Once identified, we reduce the macro-property to the micro-property. $T$ just *is* $KE_{avg}$.
