answer: |-
  FRIAR: Consider two men in the same pew, hearing the identical sermon, offered the identical grace. One converts, one hardens. Where lies the difference?

  JESUIT: In the free consent of the will. God knows via Middle Knowledge what each would choose logically prior to any decree of His will.

  FRIAR: Prior to His decree? Then what makes that proposition true? There is no decree, no existence, nothing to ground the truth.

  JESUIT: The truth lies in the creatable nature of the will itself. It has a determinate inclination in those circumstances, known by God.

  FRIAR: An inclination without existence is a phantom. You make God's knowledge depend on a nothing, a mere possibility.

  JESUIT: I make it depend on freedom. Else, if grace is efficacious by itself, why did the second man resist the same help?

  FRIAR: Because he received sufficient grace, not efficacious. God did not move him to consent.

  JESUIT: So God withheld the motion that would have saved him. Is He not the author of that loss?

  FRIAR: He owes no one salvation. But your view makes God wait on man's whim, uncertain until we speak.

  JESUIT: It makes Him respect the freedom He gave. Does your physical premotion leave room for a true 'no'?

  FRIAR: The will moves itself, but moved by God. It is compatible.

  JESUIT: If the motion is physical and prior, could the will have resisted *that* motion?

  FRIAR: Not once applied. It infallibly produces the effect.

  JESUIT: Then it is determinism. The man could not have done otherwise.

  FRIAR: He could have, in himself. But not under this motion. You risk making grace frustratable.

  JESUIT: I risk making love genuine. You risk making God the sole actor in the drama.

  FRIAR: I risk nothing. I protect the Primacy. Your middle knowledge is a fiction to save pride.

  JESUIT: And your premotion is a chain to save power. Neither of us sees the face of God in this.
