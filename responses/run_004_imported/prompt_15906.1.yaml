      *   **The Truth-Maker Objection:** Dominicans argued: If there is no decree determining the event, and the event hasn't happened yet, what makes the proposition "Peter would deny Christ" true *before* God decrees anything? Molinists argued: The freedom of the creature itself makes it true.

