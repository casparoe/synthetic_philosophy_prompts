      *   **Jesuit Position (Molinism):** God has *scientia media* (middle knowledge). He knows what any free creature *would* do in any circumstance. He decrees to create a world where He knows who will cooperate with grace. Grace is extrinsically efficacious (efficacious because the person cooperates, not because God forces the cooperation). This preserves free will and avoids God being the author of sin, but risks making God's knowledge dependent on creatures (the "truth-maker" objection).
