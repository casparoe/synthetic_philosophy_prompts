answer: |-
  The rain in the valley didn't wash things clean; it only turned the dust into a sucking grey paste that held onto your boots like a memory. Elias crouched behind the shattered remains of a stone wall, his breath misting in the twilight. He was twenty-two, a private in an army that had crossed the border three months ago under the banner of liberation, though the silence of the villages they passed suggested something closer to occupation.

  He wasn't supposed to be here. His squad was meant to hold the ridge, but the fog had separated them. Now, he was alone in the outskirts of a town that didn't want them.

  He moved into the shell of a farmhouse. The roof was gone, exposing the skeletal beams to the weeping sky. Inside, the air smelled of wet plaster and old wood. He checked his rifle. The action was smooth, the safety off. He was following the rules. He was wearing his uniform. He was a combatant.

  A floorboard creaked upstairs.

  Elias froze. He didn't shout a challenge; the noise would have been swallowed by the rain. He ascended the stairs, step by step, his heart hammering against his ribs like a trapped bird. At the top of the landing, a door stood ajar. A shadow moved inside.

  Elias kicked the door open.

  The other soldier was there, maybe ten feet away. He wore a different shade of green, a patch on his shoulder that marked him as a defender of this soil. He was young, too. Beardless. Eyes wide with the same primal terror Elias felt.

  There was no time for philosophy. There was only the reflex of survival. The enemy soldier raised his weapon. Elias fired.

  The report was deafening in the small space. The other soldier jerked back, hitting the wall, then sliding down to the floor. The rifle clattered from his hands.

  Silence rushed back into the room, heavier than before.

  Elias kept his aim trained on the man for a long minute, waiting for a twitch, a trick. Nothing. The rain hissed against the exposed beams. Slowly, Elias lowered the barrel. He stepped forward, his boots leaving dark prints on the pale wood.

  The man was dead. His eyes were open, staring at a water stain on the ceiling that looked vaguely like a map of a country neither of them had chosen.

  Elias knelt. He checked for a pulse out of habit, though he knew there wasn't one. He felt a cold nausea rise in his throat. This was the moment the training manuals didn't cover. They taught you how to clear a room, how to maintain discipline, how to treat prisoners. They told you that if you wore the uniform and followed the laws of war, you were a soldier, and what you did was the business of the state.

  *Jus in bello.* Justice in the war. Elias had followed every rule. He hadn't shot a surrendering man. He hadn't used forbidden weapons. He had engaged a legitimate threat in a lawful manner. By the book, his hands were clean.

  But as he looked at the dead man, the book felt very far away.

  Elias reached into the dead man's pocket, not to loot, but to find something that would make him real. He found a wallet. Inside was a photograph of a woman holding a baby, and an ID card with a name: *Tomas*.

  Tomas. Not "the enemy." Not "a target."

  Elias sat back on his heels. If his commanders were right, he had done nothing wrong. He was an instrument of national policy. The guilt for this death lay with the generals who ordered the invasion, the politicians who drew the lines on the map. Elias was just the hammer; he couldn't be blamed for where the hand swung him. He was morally equal to Tomas, who would have killed him without hesitation had the timing been different.

  But a quiet voice, the one that had been whispering since they crossed the border, asked a different question.

  If the war itself was a crime, was the bullet also a crime?

  Tomas hadn't been threatening Elias's home. Tomas had been standing in his own country, defending a room in a house that likely belonged to his family. Elias was the intruder. If a man breaks into your house, and you shoot him, it is self-defense. If you break into a house, and the owner shoots you, you cannot claim moral equality with him just because you both used guns.

  Elias looked at his own hands. They were trembling. He had killed a man who had a right to be here. He had killed a man who, in the eyes of God or nature, might have been the one acting in true self-defense.

  Did the uniform absolve him? Or was the uniform just a costume that made the murder permissible on paper?

  He thought of the chaplain back at base, who told them their souls were safe as long as they didn't torture or steal. *The cause is not yours to judge,* the chaplain had said. *Your duty is your honor.*

  Elias looked at Tomas's open eyes. They didn't look like they saw honor. They looked like they saw betrayal.

  If Elias was morally responsible for his actions, then he was a killer. Not a soldier doing a job, but a man who had extinguished a future for a lie. The cleanliness of the engagement didn't matter. The fairness of the fight didn't matter. The only thing that mattered was that Tomas was dead, and Elias was the cause, and Elias was on the wrong side of the line.

  But then, what choice did he have? If he had refused to shoot, Tomas would be kneeling over Elias's body right now. Was survival a sin? Was it better to die innocent than to live guilty?

  The rain intensified, drumming against the floor. Elias stood up. He placed the wallet on the dead man's chest, covering the wound. It was a small gesture, meaningless to the dead, but necessary for the living.

  He walked to the window and looked out at the grey valley. Somewhere out there, his squad was regrouping. They would ask him what happened. He would say, "Enemy contact. I neutralized the threat." They would nod. They would mark it on a map. The machinery of the war would grind on, indifferent to the weight in his stomach.

  Elias touched the cold steel of his rifle. It felt heavy, heavier than it had this morning. He was a soldier, lawful and uniformed. He was also a man who had taken a life that perhaps should not have been taken.

  He didn't know which truth was heavier. He only knew that as he turned to leave the room, he couldn't look back at Tomas, and he couldn't look at his own reflection in the darkened glass of the window. He walked out into the rain, carrying the weapon, carrying the uniform, and carrying the silence, waiting to see if the mud would eventually wash off, or if it had already seeped through the skin.
