      *   *Verdict:* The analogy is structurally apt regarding the *topology* of time/worlds, but metaphysically distinct regarding the *status* of the branches. Peirceanism $\approx$ Everett (all branches real, no single actual future). Ockhamist+TRL $\approx$ Copenhagen/Bohm (one actual outcome/trajectory).

