          *   *Difference:* In Everett, "I will see spin up" is true relative to the branch. In Peirceanism, "There will be a sea battle" is simply false (because it's not necessary). Peirceanism is more about *assertibility* or *settled truth* than ontological multiplicity. However, the structural similarity of the branching tree is strong.
