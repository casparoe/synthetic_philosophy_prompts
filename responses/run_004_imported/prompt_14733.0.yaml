answer: |-
  You and Dana were both half-right, which is why you couldn't settle it at 1am. Dana is right that both theories are **etiological** (history-dependent) and reject current causal covariance as sufficient for content. But you are right that there is a substantive structural difference in *how* that history grounds content. Collapsing them into "the same view" misses the specific mechanism each uses to solve the disjunction problem.

  Here is the adjudication you need to send Dana.

  ### 1. The Core Agreement and Divergence

  **Where Dana is Right (The Agreement):**
  Both Millikan and Dretske (in *Explaining Behavior*) agree that mental content is normative, not descriptive. A state represents $C$ not because it currently correlates with $C$, but because it is *supposed* to. Furthermore, both agree that this "supposedness" comes from a history of selection. Neither theory can naturalize content in a vacuum; both require a past where the state played a role in survival/reproduction (or system stability) that explains its current presence.

  **Where You are Right (The Divergence):**
  The divergence lies in **which component's history fixes the content.**

  *   **Millikan (Consumer Semantics):** Content is fixed by the **consumer**. A representation $R$ means $C$ because the *mechanism that consumes $R$* has the proper function to produce a specific effect only when $C$ is the case. The indicator state itself doesn't need to have a history of indicating $C$; it just needs to be the state the consumer *expects* to correlate with $C$ based on the consumer's selection history.
  *   **Dretske (Indicator Recruitment):** Content is fixed by the **indicator**. A state $R$ means $C$ because $R$ was recruited to cause a behavior *because* $R$ indicated $C$. The indication relation is part of the *explanation* for why the state was selected. If the state didn't indicate $C$ during the recruitment phase, it can't mean $C$.

  **The Verdict on Your Debate:** You win on the structural distinction. Dretske keeps "indication" doing heavy lifting (the state must have been an indicator to get the job); Millikan makes indication derivative (the state is a representation because the consumer needs it to be one).

  ---

  ### 2. Test Case 1: The Disjunction Problem (Frog/BBs)

  **The Scenario:** A frog's neuron fires for flies (nutritious) and BBs (non-nutritious). Does it represent *fly* or *fly-or-BB*?

  **Millikan's Solution (Consumer Needs):**
  Millikan secures "fly" by looking at the **tongue-snapping mechanism (the consumer)**.
  *   The consumer has the proper function to catch *nutritious food*.
  *   The consumer does *not* have the proper function to catch BBs.
  *   Therefore, for the consumer to succeed, the world must contain a fly.
  *   **Result:** Content is "fly." The fact that the neuron fires for BBs is a malfunction of the *producer*, but it doesn't change the content, because the consumer's success conditions haven't changed.
  *   **Reasoning:** Normativity comes from the consumer's success conditions.

  **Dretske's Solution (Recruitment Explanation):**
  Dretske secures "fly" by looking at the **neuron's hiring history**.
  *   Why was this neuron recruited to trigger snapping? Because in the past (learning or evolution), its firing correlated with *flies*, which led to food.
  *   If BBs were not present during the recruitment phase, they cannot be part of the content. The explanation for the neuron's existence cites the indication of *flies*, not "flies-or-BBs."
  *   **Result:** Content is "fly."
  *   **Reasoning:** Normativity comes from the explanatory history of the indicator's recruitment.

  **The Substantive Difference:**
  They get the same result ("fly"), but for **different reasons**.
  *   For Millikan, the content is "fly" even if the neuron *never* reliably indicated flies, provided the consumer was selected to act on flies. (She allows for "pushmi-pullyu" representations where the indicator is inherently unreliable but the consumer norm remains).
  *   For Dretske, if the neuron *never* reliably indicated flies (e.g., it was random noise that happened to get selected), Dretske struggles to say it means "fly." He needs the indication relation to be part of the *reason* for recruitment.

  **Winner on Disjunction:** **Millikan.** Her consumer-based approach handles broken indicators better. Dretske risks making content too dependent on the statistical reliability of the indicator during the recruitment phase. If the frog's ancestors were slightly hallucinogenic but survived, Dretske's "indication explains recruitment" clause gets murky. Millikan just asks: "What does the tongue need?"

  ---

  ### 3. Test Case 2: Swampman

  **The Scenario:** A molecule-for-molecule duplicate of you appears via lightning strike. No evolutionary history, no learning history.

  **Millikan's Position:**
  *   **Verdict:** **No Content.**
  *   **Reasoning:** Proper functions are defined by selection history. Swampman has no history. Therefore, his internal states have no proper functions. If they have no proper functions, his "consumers" have no conditions for success. If there are no conditions for success, there is no truth condition. Swampman is a zombie (semantically speaking).
  *   **Room to Maneuver:** None. Millikan famously bites this bullet. She argues our intuition that Swampman thinks is just a mistake.

  **Dretske's Position:**
  *   **Verdict:** **No Content.**
  *   **Reasoning:** Content requires a state to be recruited *because* it indicated something. Swampman's states were not recruited; they were zapped into existence. There is no explanatory history linking indication to behavior.
  *   **Room to Maneuver:** Slightly more than Millikan, but not much. Dretske places more weight on *ontogenetic* (learning) history than Millikan's heavy *phylogenetic* (evolutionary) focus. If Swampman survives for 5 minutes and learns, he gets content. But at $t=0$, he is empty.

  **The Substantive Difference:**
  Both are committed to denying Swampman content. This is the price of etiological theories. However, Dretske's theory is slightly more vulnerable here because his later view relies on "system functions" that can be learned. If one argues that Swampman's physical structure *implies* a learning history (counterfactual history), Dretske might be more tempted to bend than Millikan, whose definition of "proper function" is strictly historical actualism.

  **Winner on Swampman:** **Tie (Both are "Insane").** If you think Swampman has thoughts, both theories fail. If you think history is essential, both succeed. Neither offers a "non-insane" loophole without abandoning teleosemantics.

  ---

  ### 4. The Final Bet: Which is More Defensible?

  If I have to bet on which is the more defensible naturalization of mental content, I pick **Millikan**.

  **Here is why:**

  1.  **Handling Error:** Millikan's consumer semantics provides a cleaner account of misrepresentation. For Dretske, error is when the indicator fails to indicate what it was recruited to indicate. But if the environment changes, the "recruitment reason" becomes historical fossil data. For Millikan, error is simply the consumer failing to get what it needs. This aligns better with how biology actually works (homeostatic systems failing) rather than how information theory works (channels becoming noisy).
  2.  **The "Indicator" Trap:** Dretske's insistence that indication must explain recruitment creates a regress problem. How do we naturalize the *first* indicators? If every representation requires a history of indicating, where does the chain start? Millikan bypasses this by grounding content in the *benefit* to the organism (consumer success), not the informational fidelity of the state. This allows for primitive representations that don't need to be "accurate indicators" in an information-theoretic sense, only useful for the consumer.
  3.  **Flexibility:** Millikan's framework accommodates imperative content ("Eat this!") and descriptive content ("Food is here!") under the same "Pushmi-Pullyu" model. Dretske's later view struggles to separate the directive force from the indicative content without leaning heavily on the consumer anyway (which makes him look like Millikan, but with extra steps).

  **Conclusion for Dana:**
  Tell Dana she's right that they are siblings in the etiological family, but you're right that they have different DNA. Millikan is a **Consumer Theory** (content = conditions for consumer success); Dretske is a **Recruitment Theory** (content = explanation for indicator selection).

  Millikan is the stronger theory because it decouples content from reliability. A broken thermometer still means "temperature" because that's what the user needs it to mean; Dretske risks saying a broken thermometer means nothing because it stopped doing the job that got it hired. In the business of naturalizing mind, Millikan's focus on biological *normativity* beats Dretske's focus on informational *history*.
