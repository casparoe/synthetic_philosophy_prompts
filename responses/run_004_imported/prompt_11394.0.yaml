      2.  **Insurance:** Submit a clarification to the carrier. The "provenance premium" applies to the *pair* or is suspended until/unless evidence emerges.
      3.  **Event:** Display both. Label accurately.

      *Wait, one more thing:* The user wants a recommendation that *picks* a course. "Display both" is a good pick. It resolves the "which one" pressure.

      *Let's write it.*

  7.  **Final Review against User Prompt:**
      *   "Short written memo" -> Keep it tight.
      *   "Concrete course of action" -> Nameplate, Insurance, Visit.
      *   "Real timeframe" -> Set dates.
      *   "Steelman whichever camp loses" -> Ensure the memo validates the Realist view even if adopting the Pragmatic solution (or vice versa). Actually, the best solution synthesizes them. I will frame the decision as adopting the Pragmatic *action* while respecting the Realist *concern* through transparency.

      *(Wait, looking at the prompt again)*: The user says "One camp says... no remaining fact... other camp says... one book really is hers."
      If I recommend "Display Both," I am effectively siding with Camp B (there are two distinct objects with different histories) but solving Camp A's problem (we can't tell which is which) by removing the requirement to identify the specific one.
      Actually, the most administratively sound path is to admit the epistemic limit (Camp A) while preserving the ontological distinction in the record (Camp B).
      Okay, I will draft the memo to recommend a "Dual-Provenance" designation.

      *Timeframe:* Meeting is next month. Event is Spring. Need action by end of quarter.

