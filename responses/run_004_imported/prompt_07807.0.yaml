      *   *Adjustment:* The Leverage Penalty applies to the *agent's* leverage. If the agent is part of a coalition of $10^9$ people, their individual leverage is diluted. But Longtermism argues for *collective* action or funding effective orgs. So the "agent" is the effective altruism community. Is *that* group uniquely pivotal? Yes, that's the claim.
      *   *Key Distinction:* Pascal's Mugging is often about *logical* possibility (simulation). Longtermism is about *empirical* possibility (nuclear war, AI). Does the penalty apply to empirical claims? Bostrom suggests it applies to *any* hypothesis where the expected impact scales with the improbability of the agent's position.
