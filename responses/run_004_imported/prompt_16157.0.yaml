prompt: |-
  I sit on the internal governance committee for Meridian Analytics' employee forecasting platform, a Hanson-style subsidized prediction market that leadership built with the standard no-trade-theorem worry already in mind: if everyone shares a common prior and reasons like a good Bayesian, a colleague's willingness to take the other side of your bet should, per Aumann, already tell you your apparent information edge is illusory, so without a subsidized market maker absorbing the other side there might be no volume at all. Lately the platform's most actively traded contract asks whether the Atlas project will ship on schedule, and its largest and most consistently profitable trader is Priya, a senior engineer who also sits on the review board that grants schedule extensions -- she is, in effect, trading on private information her own board generates. Several other employees have quietly stopped trading Atlas contracts, reporting in exit surveys that a large Priya position now reads as an announcement that the question is already settled, and contract volume has fallen by more than half since the pattern became visible. Our written trading policy requires only that positions "reflect good-faith, individually held beliefs" and says nothing about board members trading on matters within their own purview. Please draft the committee's decision memo recommending a specific, adoptable policy on insiders trading on markets that touch their own institutional authority -- with a concrete rule and a timeline for next week's meeting -- and give a candid account of what the platform's core purpose would lose if Priya's trading were restricted.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Internal governance committee for Meridian Analytics' employee forecasting platform (Hanson-style subsidized prediction market).
      *   **Problem:** Priya, a senior engineer on the review board granting schedule extensions, is the most profitable trader on the "Atlas project ship date" contract. She trades on private information generated by her board.
      *   **Consequence:** Other employees have stopped trading (volume down >50%) because Priya's position signals settled information (adverse selection/lemons problem).
      *   **Current Policy:** Vague ("reflect good-faith, individually held beliefs"), silent on board members trading on their own purview.
      *   **Task:** Draft a committee decision memo recommending a specific, adoptable policy on insiders trading on markets touching their institutional authority.
      *   **Requirements:**
          *   Concrete rule.
          *   Timeline for next week's meeting.
          *   Candid account of what the platform's core purpose would *lose* if Priya's trading were restricted (cost-benefit analysis).
      *   **Tone:** Professional, governance-focused, economically literate (referencing Aumann/no-trade theorem context), candid.

  2.  **Deconstruct the Economic & Ethical Issues:**
      *   **The No-Trade Theorem Context:** The prompt mentions the platform was built with the no-trade theorem in mind (subsidized market maker to overcome common prior stagnation). However, the current issue isn't common priors; it's *asymmetric information* leading to market collapse (Akerlof's Lemons Problem). If traders know Priya knows the outcome, they won't bet against her.
      *   **Insider Trading:** In public markets, this is illegal. In internal corporate prediction markets, it's a governance gray area.
      *   **The Value of Priya's Trading:** Her trades *are* informative. If she buys "Delay," it tells leadership the board is leaning that way before the official announcement. Restricting her loses this early signal.
      *   **The Cost of Priya's Trading:** It kills liquidity. A prediction market without liquidity is useless for aggregation. It also creates fairness/perception issues (profiting from internal authority).
      *   **The Goal:** Balance information aggregation (Priya's signal) with market viability (liquidity from others).

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the problem and the recommendation.
      *   **Background:** Summarize the Atlas contract situation, Priya's role, and the volume drop.
      *   **Analysis of Current State:**
          *   Why is this happening? (Information asymmetry).
          *   Why is the current policy insufficient? (Too vague).
          *   What is the economic impact? (Liquidity crisis).
      *   **The Trade-off (The "Candid Account"):** This is a specific requirement. I need to explain what we lose by stopping her.
          *   *Loss:* Early warning signal. Her trades are a leading indicator.
          *   *Loss:* Incentive for her to engage. If she can't trade, does she still care about the market accuracy?
          *   *Loss:* "Skin in the game."
      *   **Recommendation (The Concrete Rule):**
          *   Option A: Ban her completely. (Solves liquidity, loses signal).
          *   Option B: Do nothing. (Market dies).
          *   Option C: Restricted/Delayed trading or Disclosure.
          *   *Selected Approach:* A "Quiet Period" or "Disclosure + Cap" model. Given the severity (volume halved), a temporary restriction during active board deliberation is best. Or, more robustly: **Recusal from trading on specific contracts where one holds decision authority, *unless* information is publicly disclosed to the market first.**
          *   *Refinement:* Let's go with a "Disclosure or Recusal" model. If you have decision authority, you must either disclose your position/intent to the market *before* trading, or you cannot trade until the decision is public. Actually, to save the market, **Recusal during deliberation** is cleaner. But to keep the signal, maybe **Mandatory Disclosure of Position** (like SEC Form 4 but internal).
          *   *Better Idea:* **The "Blackout & Disclosure" Protocol.** Insiders with decision authority cannot trade *during* active deliberation windows. They can trade *after* public disclosure (but then the edge is gone) or *before* (if no material non-public info exists).
          *   *Best Compromise:* **Mandatory Position Disclosure.** If Priya trades, her position size and direction are visible to all traders immediately (if not already). This levels the information playing field. If traders know *exactly* what she knows (or at least that she is betting), they can price it in.
          *   *Wait, the prompt says her position is already visible.* The problem is the *inference*.
          *   *Revised Rule:* **Decision-Maker Recusal.** If you have voting power on the outcome, you cannot trade the binary outcome. You can trade on *related* metrics, but not the decision you control. This restores trust.
          *   *Wait, I need to address the "what we lose" part strongly.* If we ban her, we lose the "wisdom of the expert."
          *   *Final Policy Choice:* **The "Firewall" Policy.** Individuals with direct decision-making authority over a specific forecasted event are prohibited from trading that specific contract *until the decision is formally ratified and announced.* However, to preserve the signaling value, their *implied probability* (derived from board minutes or a separate internal survey) should be fed into the market price artificially, or they must submit their forecast to the market maker without taking profit.
          *   *Actually, keep it simple for a policy memo:* **Prohibit trading by decision-makers on outcomes they directly control until public disclosure.** To mitigate the loss of information, require them to submit a "shadow forecast" that influences the subsidy algorithm but doesn't generate personal profit.
          *   *Simpler:* **Recusal with Alternative Channel.** Ban profit-seeking trades. Require them to log their belief in a non-traded channel that informs leadership.
          *   *Let's go with the most standard governance fix:* **Trading Blackout.** You cannot trade what you decide.
          *   *Timeline:* Draft by Tuesday, Review Thursday, Adopt next Monday.

      *   **The "Candid Account" (Crucial Step):** I need to articulate the *loss*.
          *   Loss of "Skin in the Game": Priya might care less about accuracy if she can't profit.
          *   Loss of Leading Indicator: Her trades currently warn leadership of delays weeks before the official memo.
          *   Loss of Expertise: The market loses the most informed participant, potentially making the price *less* accurate, even if volume is higher.

  4.  **Refining the Tone:**
      *   Needs to sound like an internal governance committee.
      *   Acknowledge the Hanson/Aumann context (showing we understand the design).
      *   Be decisive but nuanced.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject:* Policy Update Regarding Insider Trading on Decision-Controlled Contracts.
      *   *Opening:* Acknowledge the success of the platform but the specific failure mode on Atlas.
      *   *The Rule:* "Decision-Maker Recusal." If you vote on it, you don't bet on it.
      *   *The Mitigation:* How do we get her info? She must submit a confidential forecast to the Market Admin (not for profit) which is used to adjust the subsidy or alert leadership.
      *   *The Cost:* We lose the market's ability to *discover* her info via price action. We turn her from a trader into a reporter. The market becomes less "magic," more "survey."
      *   *Timeline:* Policy draft circulates [Date], Committee Vote [Date], Implementation [Date].

  6.  **Final Review against Constraints:**
      *   Concrete rule? Yes (Recusal).
      *   Timeline for next week? Yes.
      *   Candid account of loss? Yes (Loss of price discovery mechanism/leading indicator).
      *   Context (Aumann/Hanson)? Woven into the analysis.

  7.  **Polishing:** Ensure the distinction between "insider trading" (illegal in public markets) and "internal governance" is clear. Emphasize that the goal is *market viability* (liquidity) vs. *information extraction*. The current state sacrifices viability for extraction. The new policy sacrifices some extraction for viability.

      *(Self-Correction during drafting)*: I should make sure the "loss" section is really honest. If we stop Priya, the market price might become *wrong* because the smartest money is out. But a wrong price with volume is sometimes better than a "correct" price with no volume (because no volume means no aggregation of *other* people's info). Actually, if Priya knows the truth, the price *is* correct. But if no one else trades, the market fails its *social* function of consensus building. I need to highlight that the platform is also a *coordination* tool, not just a truth machine.

      *Revised Plan for "Loss":*
      1.  Loss of the "Canary in the Coal Mine" (Early warning).
      2.  Loss of Incentive Alignment (Priya may disengage).
      3.  Loss of Price Accuracy (Market reverts to average opinion, excluding the expert).

      *Revised Plan for "Rule":*
      Recusal from profit-taking on self-controlled outcomes. Mandatory "Shadow Trading" (reporting belief without financial stake) to preserve the signal for leadership.

      *Timeline:*
      Monday: Draft.
      Wednesday: Legal/HR Review.
      Next Monday: Committee Vote.

      Let's write it.

  8.  **Final Polish:** Check the voice. It needs to be authoritative but analytical. Use terms like "adverse selection," "liquidity crisis," "information asymmetry."

      *(Wait, one nuance)*: The prompt asks for a "committee's decision memo recommending...". So it's a memo *from* the committee (or a draft *for* the committee) to leadership/stakeholders. I will frame it as a Recommendation Memo from the Governance Committee to the Platform Steering Group.

      *(Wait, timeline)*: "Timeline for next week's meeting." This implies the memo is preparatory for a meeting happening next week. So the timeline should lead *up to* that meeting or include the decision *at* that meeting. I will structure it as: "Decision Required at Meeting on [Date]."

      *(Wait, the "Loss" section)*: Make sure this is prominent. The prompt asks to "give a candid account of what the platform's core purpose would lose." This should be a dedicated section.

      *(Wait, the Rule)*: Needs to be "specific, adoptable."
      Rule: "Individuals with voting or sign-off authority on a forecasted outcome are prohibited from holding open positions on that contract during the deliberation window."

      Okay, ready to generate.cltr
answer: |-
  **MEMORANDUM**

  **TO:** Platform Steering Group & Executive Leadership
  **FROM:** Internal Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Insider Trading Policy Regarding Decision-Making Authority
  **MEETING DATE:** November 2, 2023 (10:00 AM EST)

  ### 1. Executive Summary

  The Meridian Analytics forecasting platform is currently experiencing a liquidity crisis driven by information asymmetry. Specifically, the "Atlas Project Ship Date" contract has seen trading volume decline by >50% following the market's recognition that Priya (Senior Engineer & Review Board Member) holds a persistent, profitable long/short position based on non-public information generated by her own board.

  While the platform was designed to overcome the *no-trade theorem* via subsidized market making, it is now succumbing to *adverse selection* (the "lemons problem"): rational traders refuse to take the counterparty side of an insider with decision-making authority. This memo recommends the immediate adoption of a **Decision-Maker Recusal Policy** to restore market liquidity and trust. We further outline the specific informational costs this restriction will incur.

  ### 2. Recommended Policy: The "Decision-Maker Recusal" Protocol

  We recommend amending the Trading Policy (Section 4.2) to include the following concrete rule, effective immediately upon adoption:

  > **Rule 4.2.1 (Authority-Based Recusal):** Any employee holding voting, sign-off, or veto authority over a specific forecasted event is prohibited from opening, closing, or adjusting positions on contracts directly tied to that event during the **Active Deliberation Window**.
  >
  > *   **Definition:** The *Active Deliberation Window* opens when the relevant committee is formally convened to decide the matter and closes 24 hours after the decision is publicly announced to the general employee base.
  > *   **Exception:** Recused individuals may submit a **Non-Binding Shadow Forecast** to the Market Administrator. This forecast will be used to adjust the automated market maker's subsidy curve to reflect expert consensus but will not generate personal profit or loss for the submitter.

  **Rationale:** This rule separates *information aggregation* from *profit-seeking*. It prevents the perception (and reality) that the market is a vehicle for insiders to monetize administrative delays, thereby encouraging general employee participation (liquidity).

  ### 3. Candid Assessment: What We Lose By Restricting Priya

  Restricting Priya's trading is necessary to save the market's *viability*, but leadership must understand that this comes at a cost to the market's *function*. By banning profit-seeking trades from decision-makers, we accept the following degradations to the platform's core purpose:

  **A. Loss of the "Canary in the Coal Mine" Signal**
  Currently, Priya's trading activity serves as a leading indicator. When she shifts her position, leadership knows the Review Board is leaning toward a delay weeks before the official memo is drafted. If we force her into a "Shadow Forecast" or silence, we lose the continuous, real-time stream of this information. We revert to periodic, discrete updates rather than a flowing probability stream. We gain market volume, but we lose the earliest possible warning system for project slippage.

  **B. Reduction in Price Accuracy (The "Expert Exclusion" Effect)**
  Prediction markets rely on the wisdom of crowds, but they perform best when the most informed participants have the highest stake. Priya is currently the most informed participant. By capping her financial stake at zero, we are effectively weighting her information less in the final market price. The market price will become more representative of the *average* employee's guess rather than the *informed* reality. We are trading **accuracy** for **liquidity**.

  **C. Erosion of "Skin in the Game" Incentives**
  The Hanson-style design relies on financial incentives to ensure participants do the hard work of gathering information. If Priya cannot profit from her expertise, her incentive to engage deeply with the market mechanism diminishes. She may view the forecasting platform as a compliance burden rather than a decision-support tool. We risk disengaging the very experts whose knowledge makes the market valuable.

  ### 4. Implementation Timeline

  To resolve the Atlas liquidity crisis before the Q4 planning cycle, we propose the following schedule for the upcoming week:

  *   **October 27 (Friday):** Legal & HR review of Rule 4.2.1 to ensure alignment with employment contracts and compensation policies.
  *   **October 30 (Monday):** Draft policy circulated to Committee members for final comment.
  *   **November 1 (Wednesday):** Private briefing with Priya and Review Board members to explain the rationale (focusing on market health rather than individual censure).
  *   **November 2 (Thursday) – Committee Meeting:** **Final Vote and Adoption.**
  *   **November 3 (Friday):** Platform update deployed; Atlas contract positions held by recused individuals are automatically liquidated at current market price (fair exit) or frozen until the Window closes (at trader's choice).

  ### 5. Conclusion

  The current state of the Atlas contract violates the spirit of the platform: a mechanism for *discovering* truth, not *monetizing* authority. While restricting Priya's trading will blunt the platform's sharpest informational edge, it is the only way to prevent total market collapse due to adverse selection. We recommend adopting the Recusal Policy to preserve the ecosystem, while acknowledging that leadership will need to rely more heavily on direct reporting for early-warning signals regarding Atlas.

  **Action Required:** Approval of Rule 4.2.1 at the November 2nd Committee Meeting.
