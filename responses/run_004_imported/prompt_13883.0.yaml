answer: |-
  **Setting:** *A quiet corner of a campus coffee shop, late evening. The remnants of a reading group linger in empty mugs and dog-eared paperbacks. Elena (Reductionist) and Marcus (Anti-Reductionist) are the last two left.*

  **Elena:** I'm still stuck on the teacher case. Lackey's science teacher. If the reductionist story is right, the students' justification hinges on the reliability of the source. But reliability usually tracks truth, and truth usually tracks belief. If she doesn't believe it, isn't there a fracture in the chain?

  **Marcus:** That's the reductionist instinct, isn't it? To look for the causal-psychological link between the speaker's mind and the world. But Lackey's point is precisely that the students *do* know. They walk away with knowledge of evolution. The teacher presents the evidence competently. She asserts what the evidence supports. Her private disbelief is epistemically irrelevant to them.

  **Elena:** Irrelevant? If I found out my source was asserting something they thought was false, I'd treat that as a defeater.

  **Marcus:** Only if you *knew* it. But ex hypothesi, they don't. The question is: what grounds their entitlement *before* they have any specific reason to doubt her? On your view, they need positive reasons to think she's reliable. On mine, they have an *a priori* entitlement to accept what is intelligibly presented as true. The teacher presents evolutionary theory as true. The presentation is intelligible. The entitlement kicks in.

  **Elena:** That's the Burge move, right? The Acceptance Principle. But it feels like you're glossing over the sincerity condition. Traditionally, assertion implies belief. She's violating a norm of assertion, even if she's following a norm of evidence. If your entitlement is *a priori*, doesn't it render the hearer too passive? You're saying they are entitled to trust her *even though* she is, in a sense, lying about her doxastic state.

  **Marcus:** She isn't lying about her doxastic state; she's silent on it. She asserts *p*, not "I believe *p*." Look, Elena, if you require the hearer to verify the speaker's sincerity or track record before accepting testimony, communication collapses. This is Reid's point, updated by Burge. We are finite creatures. We depend on others. If the default setting were doubt rather than trust, we'd never acquire the background knowledge necessary to even formulate those doubts.

  **Elena:** I'm not asking for verification of everything. That's the Humean global reductionism straw man Coady buried twenty years ago. I'm a local reductionist. I follow Fricker. The hearer needs no *global* inductive proof that testimony is reliable. But they do need to monitor for defeaters. They need positive reasons to think *this* instance of testimony is reliable, drawn from their background knowledge.

  **Marcus:** But where does that background knowledge come from? Coady's transcendental argument. To calibrate testimony—to check the teacher's track record, to check if biology textbooks are generally accurate—you need history, geography, science. Almost all of which you got via testimony. If you need testimony to validate testimony, you're circular. Unless you posit a default entitlement.

  **Elena:** It's not viciously circular if it's a coherence check. I don't need to validate *all* testimony to validate *some*. I have perceptual access to the world. I can check a map. I can look at a fossil. I use my own perception and induction to spot-check the testimonial chain. Fricker's point is that I need to be sensitive to signs of untrustworthiness. In the classroom, the students monitor: Is she confident? Is the textbook consistent? Does this cohere with what the chemistry teacher said?

  **Marcus:** In the Lackey case, all those monitors return "green." She is confident. The text is consistent. It coheres. So, on your view, the students are justified. On my view, they are *also* justified. So what's the disagreement? It's about the *source* of the warrant. You think the warrant comes from the successful monitoring—the absence of red flags. I think the warrant comes from the nature of testimony itself, and monitoring is merely a way to *lose* warrant, not gain it.

  **Elena:** That's a crucial difference. If warrant comes from monitoring, then epistemic agency is preserved. The student is doing something cognitive. They are assessing. If warrant is default, the student is a bucket. And this matters for the sincerity issue. If the teacher *is* insincere, and the students' warrant is just default, they are vulnerable. If their warrant depends on monitoring, maybe they *should* have picked up on something.

  **Marcus:** Should they have? She's a professional. She presents the evidence accurately. What were they supposed to monitor? Her pulse? Her prayer habits? If you say they need to detect her disbelief to be justified, you're demanding mind-reading. If you say they don't need to detect it, then their justification doesn't rest on her sincerity. It rests on the public evidence she presents. And if it rests on public evidence, why do *they* need to inductively verify that evidence? Why isn't the intelligible presentation enough?

  **Elena:** Because intelligible presentation is cheap. A con artist can present intelligibly. A cult leader can present intelligibly. The Burgean entitlement seems to make the hearer responsible for nothing until a red flag waves. But in the modern information environment, red flags are often invisible until it's too late. Your view risks collapsing into credulity. You're saying I'm rational to believe you just because you spoke English at me.

  **Marcus:** I'm saying you're rational to believe me because we are participants in a rational practice of communication. Communication *aims* at truth. If you assume the speaker is a liar by default, you aren't engaging in communication; you're engaging in cryptography. The charge of credulity only sticks if the entitlement is indefeasible. But it's not. It's *prima facie*. If you have a specific reason to think I'm a con artist, the entitlement vanishes.

  **Elena:** But who determines what counts as a specific reason? That's the monitoring condition. I need a reason to think *this* context is reliable. In the classroom, the context is institutional. That's my positive reason. "She is a tenured biology teacher." That's an inductive fact I've learned about the world.

  **Marcus:** How did you learn that tenured biology teachers are reliable?

  **Elena:** Experience. Society tells us—

  **Marcus:** —via testimony.

  **Elena:** (Pauses) Okay, via testimony. But eventually, the chain has to anchor in something non-testimonial, or else it floats.

  **Marcus:** And my claim is that the anchor isn't induction. It's the rational necessity of trust. You can't get the induction off the ground without the trust. You're trying to pull yourself up by your bootstraps. You want to use testimony to prove testimony is reliable, but you only allow yourself to use testimony once you've proven it's reliable.

  **Elena:** I'm not doing that. I'm saying I have a general, fallible inductive habit of trusting, but I reserve the right to demand local credentials. The difference is normative. On your view, if I *don't* trust you, I'm irrational unless I have a specific defeater. On my view, if I *do* trust you, I'm irrational unless I have a specific reason. We've inverted the burden of proof.

  **Marcus:** Exactly. And the burden of proof belongs on the doubter. Why? Because epistemic individualism is a myth. We are epistemically interdependent. If you treat every speaker as a hypothesis to be tested, you sever the social link that makes knowledge possible. In the Lackey case, the students trust the *institution* of science teaching. That trust is default. They don't interview the teacher about her religious beliefs.

  **Elena:** But suppose the teacher's disbelief *did* leak. Suppose she said, "I don't believe this, but you have to." Do your students still know?

  **Marcus:** Probably not. Because then there's a defeater. The intelligible presentation is compromised by the explicit signal of unreliability.

  **Elena:** So the entitlement *is* sensitive to reliability cues.

  **Marcus:** It's sensitive to *defeaters*. There's a difference. Sensitivity to reliability cues implies I need positive evidence of reliability. Sensitivity to defeaters implies I need absence of evidence of unreliability. The default is trust.

  **Elena:** It feels like semantic hair-splitting with high stakes. If I'm a student in a polarized environment, "absence of evidence of unreliability" is dangerous. Echo chambers are designed to have no internal red flags. If my epistemology tells me I'm entitled to trust anyone who speaks intelligibly and lacks obvious defeaters, I'm toast. I need an epistemology that demands I check the source's connection to the truth, not just the absence of lies.

  **Marcus:** And how do you check that connection without relying on other sources? If you tell the student, "Go verify the evolutionary claim," they can't. They lack the expertise. They *must* rely on the teacher. Your local reductionism works for peers. It doesn't work for novices learning from experts. Yet novices acquire knowledge.

  **Elena:** Novices rely on the *community's* monitoring. I, as a PhD student, have the tools to monitor the teacher. I can check her credentials, her publications. I can vouch for the chain. The students are piggybacking on *my* reductionist justification.

  **Marcus:** But eventually, someone had to start the chain. The first person who accepted the expert's word without being an expert themselves—how were they justified? If you say "they weren't," you deny that knowledge transmits across generations. If you say "they were," you must admit a non-reductionist warrant. You need a principle that allows the novice to trust the expert *before* the novice can verify the expertise.

  **Elena:** I grant that there's a developmental stage where children are Reidians. They have to be. But as adults, as rational agents, we have a duty to upgrade to Frickerian monitoring. We can't stay in the default mode. The Lackey students are older than toddlers. They should be cultivating critical distance.

  **Marcus:** Critical distance is good. But critical distance isn't the *source* of justification. It's a filter. The water flows by default; the filter removes the dirt. You're claiming the filter *creates* the water. Without the default flow, the filter is dry.

  **Elena:** And without the filter, the water drowns you. Look, I'm worried that your *a priori* entitlement severs the link between justification and truth-conduciveness. If I'm entitled to believe you just because you're intelligible, what ensures that your assertion is likely true?

  **Marcus:** The fact that assertion is a normative practice governed by truth. If people asserted randomly, the practice would vanish. We trust because the practice exists. It's a transcendental argument, Elena. Communication is possible only if we are entitled to trust. Communication is actual. Therefore, we are entitled.

  **Elena:** That proves we *must* trust to communicate. It doesn't prove that such trust is *justified* in the epistemic sense of tracking truth. It might be a pragmatic necessity, not an epistemic virtue. I'd rather be a skeptical hermit than a justified fool.

  **Marcus:** And I'd rather be a connected knower than an isolated skeptic. You're holding out for an autonomy that human beings don't have. In the Lackey case, the students know evolution. Your view has to jump through hoops to explain how they get that knowledge without verifying the teacher's belief. My view says: They heard the truth presented as true. That's enough.

  **Elena:** It's enough for *belief*. Is it enough for *knowledge*? If the teacher is selfless, she's asserting what she doesn't believe. She's epistemically broken, even if functionally correct. If the source is broken, how does the warrant transmit?

  **Marcus:** Because the warrant isn't in her head. It's in the evidence she presents. The testimony conveys the *evidence*, not just her belief.

  **Elena:** But testimony usually conveys the speaker's assurance. That's what Hume was worried about. If she lacks assurance, she's passing off someone else's assurance as her own.

  **Marcus:** And? We do that all the time. I cite papers I haven't fully verified. I teach theories I'm still skeptical of. If the students get the evidence, they get the warrant. The reductionist obsession with the speaker's psychology is a red herring.

  **Elena:** It's not a red herring if the speaker's psychology is the mechanism of transmission. If the mechanism is decoupled from the output, the system is fragile.

  **Marcus:** The system is robust *because* it doesn't rely on the psychology. It relies on the public record. That's why the students know.

  **Elena:** (Sighs) We're back at the start. You think the default entitlement explains the robustness. I think it masks the fragility. You think my monitoring demands an impossible autonomy. I think your entitlement demands an impossible innocence.

  **Marcus:** Maybe. But until you can explain how a novice calibrates an expert without circularity, my "innocence" is the only game in town.

  **Elena:** And until you can explain how your entitlement filters out the con artist without relying on the very monitoring you downplay, my "autonomy" is the only safeguard we have.

  *(They sit in silence for a moment, the coffee shop noise filling the gap. Neither reaches for their book.)*

  **Marcus:** Same time next week?

  **Elena:** Sure. But I'm bringing Fricker's 2006 paper.

  **Marcus:** And I'm bringing Burge's 1993 reply.

  **Elena:** (Smiles faintly) Naturally.
