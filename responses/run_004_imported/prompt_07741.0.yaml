answer: |-
  1.  **The Elasticity of the Sound Deliberative Route**
      Williams permits the subjective motivational set (*S*) to expand via a "sound deliberative route," which includes correcting false beliefs, imaginative rehearsal of outcomes, and even sympathetic identification with others. Critics argue this renders internalism unfalsifiable: if deliberation is elastic enough, isn't every external-reason claim just a description of a route the agent *would* take if they were more imaginative or informed? Where do you draw the hard line between a sound deliberative route and a conversion of the will that breaks the internalist constraint?

      *   **Follow-up:** If you appeal to constraints on rationality to limit that elasticity, aren't you implicitly relying on external norms to define what counts as "sound" deliberation, thereby smuggling the externalism back in through the procedural door?

  2.  **Williams's Test Cases and the Charge of Stipulation**
      Consider Williams's own test cases: the agent who wants a gin and tonic but is handed petrol, and Owen Wingrave, whose family insists he has a reason to join the army. It often looks as though Williams simply stipulates the verdict—that there is no reason in the petrol case, and no reason in Wingrave's case—and then uses internalism to explain the stipulation, rather than deriving the verdict from the theory. What non-question-begging procedure allows us to determine, in hard cases, whether a route from *S* exists, rather than just asserting that it doesn't?

      *   **Follow-up:** If the answer relies on counterfactuals about what the agent *would* desire after ideal deliberation, how do we verify those counterfactuals without projecting our own external valuations onto the agent's hypothetical psychology?

  3.  **McDowell, Second Nature, and Moral Education**
      McDowell argues that a virtuous person's upbringing gives them a kind of "second nature," letting them perceive reasons that a callous or indifferent person cannot reach by any deliberation from their existing motivations. If internalism is true, does acquiring virtue involve *discovering* elements already latent in the subjective motivational set, or does it involve *implanting* new motivations? If the latter, doesn't that concede that the reason existed prior to the motivation?

      *   **Follow-up:** A familiar internalist fallback is to say we can still call the unmoved person cruel or insensitive without thereby attributing to them any reason they failed to act on. But does this move save the theory only by severing the link between having a reason and being subject to criticism, effectively conceding McDowell's point that the normative force of the reason was external all along?

  4.  **The Ontology of the Subjective Motivational Set**
      Williams describes *S* as containing not just desires, but "dispositions of evaluation, patterns of emotional reaction, and personal loyalties." How do we individuate these elements without referencing the very reasons they are supposed to ground? If a "loyalty" is defined by the reasons it generates, does the explanation become circular?

  5.  **The Normativity of Deliberation**
      If an agent currently lacks a reason to $\phi$ but would have one if they deliberated correctly, is there a normative requirement for them to deliberate? If so, where does the reason to deliberate come from if it isn't already in *S*?

  6.  **Interpersonal Blame and Deep Disagreement**
      Beyond the Wingrave case, how does your view handle interpersonal blame in deep moral disagreement? If I blame someone for an action that their *S* genuinely does not support, even after ideal deliberation, am I making a cognitive error, or is blame merely an expressive tool with no truth-apt claim about their reasons?

  7.  **The Cost of Error Theory**
      Many externalists argue that internalism commits us to an error theory about ordinary moral language, since people often claim others have reasons they don't care about. Do you accept this error theory cost, or do you think pragmatic implicature explains away the linguistic data?

  8.  **Relativism and Incommensurability**
      Does a robust internalism inevitably lead to a form of normative relativism where agents with radically different *S* sets inhabit incommensurable normative worlds, or is there a universal structure to practical rationality that constrains *S* across agents?

  9.  **Continuity of Self Through Conversion**
      When an agent undergoes radical moral conversion—for example, a selfish person becoming altruistic—does internalism require us to say they are effectively a different agent? If not, what preserves the identity of the *S* across such a radical shift in motivational content?

  10. **Falsification Conditions**
      Finally, to put the view on the line: what sort of case would you accept as a genuine counterexample to internalism? Is there any conceivable scenario where you would concede an agent has a reason to act despite there being no sound deliberative route from their subjective motivational set?
