          *   *Who Resists:* Public authority/Community (Aquinas - usually) vs. The People (Locke).
          *   *Nature of Right:* Restoring order/Common Good (Aquinas) vs. Protecting Property/Liberty (Locke).
          *   *Tyrannicide:* Aquinas is ambivalent/cautious about private acts; Locke focuses on dissolution of government and appeal to heaven (war state), not necessarily assassination.
      *   *Conclusion:* Summarize the value of the comparison.

  6.  **Refining the Tone:**
