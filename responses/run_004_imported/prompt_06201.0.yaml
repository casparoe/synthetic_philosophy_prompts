answer: |-
  This is a compelling reading, and for the purposes of a lecture on resistance theory, the *Commentary on the Sentences* is indeed the sharpest tool in the Aquinas corpus. However, to ensure your lecture withstands scholarly scrutiny, it is necessary to introduce a crucial nuance: while Aquinas delegitimizes the *tyrant*, he becomes increasingly cautious in his mature work about who possesses the *authority to remove* him.

  If you wish to present the "radical" reading (that any subject may kill a tyrant), the *Sentences* is your primary evidence, but *De Regimine Principum* actually complicates that claim rather than restating it.

  Here is how I would structure the textual evidence and the comparison with Locke.

  ### 1. Key Passages for the Lecture

  To support the reading that tyranny voids legitimate dominion, you should focus on three texts, presented in chronological order to show the development (or tightening) of his thought.

  **A. The Strongest Evidence: *In II Sent., d. 44, q. 2, a. 2, ad 3***
  This is the passage that supports your reading most directly. Here, the young Aquinas addresses whether it is sinful to kill a tyrant.
  *   **The Argument:** He distinguishes between a true ruler (who seeks the common good) and a tyrant (who seeks private gain). Because the tyrant rules by force rather than right, he is not a true master (*dominus*).
  *   **The Quote:** *"Non est seditionem turbare huiusmodi dominatum"* ("It is not sedition to disturb such a dominion").
  *   **The Implication:** He goes further to suggest that those who liberate the country by killing a tyrant are "praised and rewarded." This is the textual basis for the claim that tyrannicide is meritorious and not seditious.
  *   **Lecture Point:** Use this to establish the metaphysical premise: Tyranny is a privation of authority, not an abuse of it. Therefore, resistance is not rebellion against authority, but the removal of a usurper.

  **B. The Complication: *De Regimine Principum* I.6**
  You mentioned reading this as a restatement, but most scholars read it as a qualification. While it reaffirms that tyranny is unjust, it explicitly warns against private assassination.
  *   **The Argument:** Aquinas argues that killing a tyrant privately can lead to greater dangers (the killer becoming a tyrant, or the factionalism causing civil war).
  *   **The Preference:** He prefers that the tyranny be checked by **public authority**. If the community has the right to elect the king, they have the right to depose him. If the superior authority (e.g., the Emperor over a King) exists, they should intervene.
  *   **Lecture Point:** This distinguishes Aquinas from modern individualism. Even if the tyrant has no right to rule, the *removal* often requires a public mechanism to preserve the common good.

  **C. The Mature Synthesis: *Summa Theologiae* II-II, q. 42, a. 2**
  For a complete picture, you must reference his definition of sedition.
  *   **The Argument:** Sedition is opposed to the unity of the multitude. However, if a ruler governs tyrannically, *he* is the one guilty of sedition, not the subjects who resist.
  *   **The Caveat:** He reiterates that resistance should not occasion "greater detriment" to the community than the tyranny itself.
  *   **Lecture Point:** This establishes the "Principle of Proportionality." Resistance is permissible, but not if it destroys the social fabric.

  ### 2. Situating Aquinas Relative to Locke

  Comparing Aquinas to Locke is excellent for highlighting the shift from Medieval Natural Law to Liberal Social Contract theory. While both justify resistance, their metaphysical foundations and mechanisms differ significantly.

  **A. Source of Authority**
  *   **Aquinas:** Authority is natural and teleological. It comes from God *through* nature/community for the sake of the **Common Good**. A tyrant fails the *telos* of rule.
  *   **Locke:** Authority is artificial and contractual. It comes from **Consent** for the sake of protecting **Natural Rights** (Life, Liberty, Property). A tyrant breaches the *trust*.

  **B. Who Resists? (The Crucial Distinction)**
  *   **Aquinas (The Community/Public):** As noted in *De Regimine*, Aquinas is wary of private individuals acting alone. The "right" to resist usually resides in the *corpus mysticum* (the body politic) or a superior public authority. It is an objective restoration of order.
  *   **Locke (The People/Individuals):** Locke's "appeal to heaven" is more radical in one sense: when government is dissolved, power reverts to "the People." However, Locke is also wary of "meddling" individuals. Yet, because every individual holds the executive power of the law of nature, the threshold for judging tyranny is more decentralized than in Aquinas.
  *   **Lecture Point:** Aquinas justifies tyrannicide (cautiously) as a act of **justice** to restore order. Locke justifies revolution as an act of **war** against an aggressor who has forfeited legitimacy.

  **C. The Nature of the Right**
  *   **Aquinas:** Resistance is a **duty** to the common good. If you can remove a tyrant without causing greater harm, you arguably *should*. It is objective.
  *   **Locke:** Resistance is a **right** of self-preservation. It is triggered when the contract is broken. It is more subjective (the people judge whether the trust is breached).

  ### 3. Recommendation for the Lecture

  If you present the "any subject whatsoever" reading, I recommend framing it as the **early Aquinas** (*Sentences*) versus the **mature Aquinas** (*Summa/De Regimine*).

  1.  **Start with the *Sentences*:** Show how clearly he delegitimizes the tyrant. This supports your claim that the tyrant holds no true dominion.
  2.  **Introduce the *De Regimine* Nuance:** Explain that while the tyrant has no right to rule, Aquinas worries that private assassination might harm the *common good* (the very thing resistance is meant to save).
  3.  **Contrast with Locke:**
      *   **Aquinas:** "The tyrant is a disease in the body politic; we must cure him, but carefully, lest the patient die." (Organic metaphor).
      *   **Locke:** "The tyrant is a thief who has broken the lease; we may evict him to protect our property." (Legal/Contractual metaphor).

  **Scholarly Caution:**
  Be prepared for pushback on the claim that *De Regimine* "restates" the *Sentences* doctrine unambiguously. Many historians of political thought (such as Quentin Skinner or J.P. Canning) argue that Aquinas ultimately restricts the *act* of deposition to public authority to avoid anarchy. Your lecture will be stronger if you acknowledge this tension: Aquinas grants the *theoretical* right to resist tyranny universally (because tyranny is not authority), but restricts the *practical* execution of that right to protect the common good.

  This approach allows you to keep your compelling insight about the illegitimacy of tyranny while maintaining historical precision regarding the mechanism of resistance.
