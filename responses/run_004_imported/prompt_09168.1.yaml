answer: |-
  This is a sophisticated worry, and frankly, one that suggests you have a better grip on the dialectic than many who treat Lewis's "debugging" as a closed case. The standard narrative in many departments is that Lewis's *New Principle* (NP) and Thau's admissibility restriction successfully inoculated Humean Supervenience (HS) against logical inconsistency. However, as you suspect, saving the *consistency* of the system often comes at the cost of the *utility* of the concept being saved.

  Here is the argument for the skeptical position: that the "Big Bad Bug" is not dissolved but merely relocated from a problem of logical contradiction to a problem of normative vacuity. The fix preserves the coherence of Humeanism only by rendering chance epistemically inaccessible to the very agents it is supposed to guide.

  ### 1. The Relocation Thesis: From Contradiction to Inaccessibility

  The core function of the Principal Principle (PP) is to serve as a bridge principle between metaphysics and epistemology. It tells a finite agent, situated at a time $t$ with limited evidence, how to align their credences with the objective structure of the world. The PP is meant to be action-guiding for non-omniscient beings.

  Lewis's New Principle (NP) saves HS from contradiction by altering the conditionalization base. The original PP demanded:
  $$Cr(A \mid E \land Ch_t(A) = x) = x$$
  where $E$ is admissible evidence. The NP revises this to:
  $$Cr(A \mid E \land T_w) = Ch_t(A \mid T_w)$$
  where $T_w$ is the complete theory of chance for the actual world (which, under HS, includes the specification of the entire Humean Mosaic, past and future).

  The skeptical argument is this: **The NP saves the logic of HS by demanding that agents conditionalize on information they cannot possibly possess.**

  Under HS, the chances at $t$ are determined by the Best System of the *entire* history. Therefore, $T_w$ encodes the future. A finite agent at $t$ cannot know $T_w$ because they cannot know the future mosaic. Consequently, the antecedent of the NP ($E \land T_w$) is something no finite agent can ever satisfy. If a normative principle governing rational credence cannot be applied by the agents it governs, it has ceased to function as a principle of rationality and has become a constraint on omniscience. The bug is "debugged" only by making chance irrelevant to finite inquiry.

  ### 2. The Natural Humean Rejoinder: Admissibility and Temporal Fixity

  The most robust Humean response to this charge (championed by Lewis and elaborated by Thau) is to deny that the agent needs to know the future to apply the principle. They argue that we can cash out admissibility purely in terms of what is fixed at or before $t$.

  **The Rejoinder:**
  The Humean insists that while the *truth-maker* for chance claims involves the future, the *evidence* required to apply the principle does not. We can restrict admissible evidence $E$ to the history up to $t$ ($H_t$). Since $H_t$ is known (or knowable) by the agent at $t$, the principle remains applicable. The NP effectively tells us: "Conditionalize on the theory of chance *as it relates to the history you have*." The Humean argues that by ruling out "inadmissible" information (i.e., direct knowledge of the future), we avoid the contradiction without requiring omniscience. We don't need to know the future mosaic; we just need to know that our evidence is restricted to the past. Thus, the principle remains guide-worthy.

  ### 3. Why the Rejoinder Fails: The Supervenience Gap

  This rejoinder fails because it conflates the *temporal location of evidence* with the *metaphysical determination of chance*. It works for Anti-Humeans, but it fails for Humeans.

  **A. The Anti-Humean Baseline**
  For a necessitarian (e.g., Armstrong or Maudlin), laws and chances are fixed by relations existing at $t$ (or by universals instantiated in the past/present). For them, $H_t$ (plus the laws) *determines* the chances at $t$. Therefore, conditionalizing on $H_t$ is sufficient to lock in the chance values. The PP works because the metaphysical base of chance is locally accessible.

  **B. The Humean Deficit**
  For the Humean, $H_t$ does *not* determine the chances at $t$. Only $H_w$ (the whole world) determines the chances. The Best System is a global property of the mosaic.
  When the Humean tells the agent to conditionalize on $H_t$, they are asking the agent to conditionalize on a proposition that, under HS, is *metaphysically insufficient* to fix the value of $Ch_t$.

  Here is the crux of the skeptical case:
  1.  **Identity of Chance:** Under HS, $Ch_t(A)=x$ is identical to (or supervenes on) the proposition that the Best System of $H_w$ says $x$.
  2.  **Epistemic Access:** To know $Ch_t(A)=x$, one must know (or have justification for) claims about $H_w$.
  3.  **The Rejoinder's Gap:** The Humean says, "Just conditionalize on $H_t$." But $H_t$ does not entail $Ch_t(A)=x$. There are multiple possible futures compatible with $H_t$ that yield different Best Systems and thus different chances.
  4.  **The Dilemma:**
      *   If the agent conditionalizes only on $H_t$, they have not conditionalized on the truth-maker for the chance claim. They are left with a probability distribution over *possible* chance values (since different futures yield different best systems). The NP requires conditionalizing on *the* theory $T_w$, not a distribution over possible theories.
      *   If the agent attempts to conditionalize on $Ch_t(A)=x$, they are implicitly conditionalizing on a claim about the future (since that is what the chance claim *is* under HS). This violates the admissibility restriction intended to block the bug.

  Therefore, the Humean cannot have it both ways. They cannot maintain that chances supervene on the whole mosaic *and* that agents can access those chances using only past evidence. To apply the NP correctly, the agent must know $T_w$. To know $T_w$, the agent must know the future. Since the agent cannot know the future, the agent cannot apply the NP.

  ### 4. Normative Vacuity and the "Two Concepts" Problem

  This leads to the conclusion that Lewis's fix severs the link between *objective chance* and *credence-guiding probability*.

  Ned Hall, in "Two Concepts of Chance," argues persuasively that Lewis's debugging effectively splits the concept of chance in two. There is "Objective Chance" (the BSA output, which is vulnerable to undermining) and "Credence-Guiding Chance" (which satisfies the PP). Lewis saves HS by defining Objective Chance in a way that requires the NP, but the NP is so epistemically demanding that it cannot guide credence.

  If the "New Principle" requires an agent to know the total theory of the world to align their credences, it ceases to be a principle of *rationality* for finite beings and becomes a truth about *logical omniscience*.
  *   **Original PP:** "Given what you know now ($H_t$), align your credence with the chance." (Action-guiding).
  *   **New Principle:** "Given what an omniscient being knows ($T_w$), align your credence with the chance." (Trivially true, useless for agents).

  The "Big Bad Bug" was originally a threat to the *coherence* of HS. Lewis's patch secures coherence but creates a new bug: the **Epistemic Bug**. The Humean account of chance renders chance unknowable in principle until the end of time. If chance is unknowable until the end of time, it cannot play the role of guiding expectation *during* time.

  ### 5. Conclusion: The Advantage Rests with the Anti-Humean

  You are right to remain unconvinced that the matter is settled. The Humean has successfully argued that HS is not *logically inconsistent*. However, they have done so by retreating to a position where chance loses its primary philosophical motivation.

  The Anti-Humean necessitarian retains the advantage here. On their view, the laws and chances are fixed by the present/past arrangement of properties (or relations between universals). Therefore, $H_t$ *does* fix the chances. The original Principal Principle remains applicable for finite agents. The bridge between metaphysics and epistemology remains intact.

  The skeptical case concludes that Lewis's "debugging" is a Pyrrhic victory. He saved the Humean Mosaic from contradiction only by making the chances that supervene upon it invisible to the inhabitants of the mosaic. If a metaphysics of laws renders the laws' probabilistic implications inaccessible to the agents governed by them, it has failed to capture the concept of *law* or *chance* as we understand it in scientific and rational practice. The bug is not gone; it has simply burrowed into the epistemology, leaving the metaphysics consistent but inert.
