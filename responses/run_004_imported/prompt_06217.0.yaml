answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I've had the privilege of being [Friend's Name]'s friend since our first week of undergrad. Back then, we bonded over cheap coffee and big questions. Today, she's asked me to speak, which is an honor, though I should warn you: I'm currently three years into a PhD in decision theory.

  Now, decision theory is basically the study of how people make choices. And if there's one thing I've learned in grad school, it's that marriage is a terrible decision.

  *(Pause for laughter)*

  Statistically speaking, from a purely cold, computational perspective, marriage is a nightmare. It's a contract with indefinite terms, high exit costs, and variables that change every single day. In my field, we usually advise against making choices where you can't predict the outcome or know how much you'll enjoy it.

  And this is where things get interesting. There is a philosopher named L.A. Paul who wrote a book I've been reading all semester. She argues that marriage is what she calls a "transformative experience." Her point is that you cannot know what it is like to be married until you *are* married. It's not just that you lack information; it's that the experience itself changes who you are. Your preferences shift. The "you" that is standing here today, weighing the pros and cons, is not the same "you" that will be waking up ten years from now.

  Normally, we make decisions by trying to maximize our future happiness. But how do you calculate the happiness of a person you haven't become yet? It's like trying to explain the color red to someone who has never seen it. You can't compute the value of the outcome because the person evaluating the outcome doesn't exist yet.

  In fact, the famous thought experiment Paul uses to explain this involves deciding whether to become a vampire.

  *(Turn slightly to the Partner)*
  [Partner's Name], I need to ask for the record: Are you an immortal blood-drinker? No? Sunlight doesn't burn you? Great. Because the textbook says that's the only choice harder than this one. So, from a risk-assessment standpoint, I think we're clear to proceed.

  *(Nod to the academics in the room)*

  But for the rest of the room, here is the point: [Friend's Name] knows she can't know what's coming. She knows that the version of herself that says "I do" is going to be fundamentally altered by the "I did." She knows that the map doesn't match the territory.

  And yet, here she is.

  Why? Because Paul argues that when the math breaks down, rationality isn't about calculation anymore. It's about discovery. When you can't model the future, the rational move isn't to retreat to safety. It's to choose the experience that allows you to grow into the person who can live it.

  I have watched [Friend's Name] and [Partner's Name] together for years. I have seen them navigate uncertainty, support each other through changes neither of them predicted, and build something that defies a spreadsheet. They aren't pretending they know exactly who they will be in twenty years. They are agreeing to find out together.

  There is a profound courage in that. It is easy to love someone when the path is straight and the view is clear. It is much harder, and much braver, to love someone when you admit that the path is going to change you, and you say "Yes" anyway.

  [Friend's Name], you taught me that the best questions don't always have clear answers. And today, you're proving that the best decisions aren't the ones you calculate. They're the ones you leap into.

  So, if everyone could please raise a glass.

  To the unknown. To the transformation. To the leap.

  And to [Friend's Name] and [Partner's Name]—may your utility functions always be aligned, and may you love the people you become along the way.

  Cheers.
