answer: |-
  **MEMORANDUM**

  **TO:** Regional Debate League Rules Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal 4-B: Restricting "Topicality-Only" Decisions

  ### **Executive Summary**

  The Committee is currently deadlocked on Proposal 4-B, which seeks to ban judges from casting ballots based solely on Topicality (T) arguments. One faction argues T is essential for maintaining resolutional boundaries; the other argues it encourages pedantic word games over substantive policy discussion.

  After consulting with coaches and reviewing round data, **I recommend we reject the outright ban and instead adopt a "Demonstrable Abuse" standard.** This is a middle-ground approach. It prevents judges from voting on semantic technicalities (the "Pluto Problem") while preserving Topicality as a check against genuinely abusive cases that destroy Negative ground.

  ### **Context: The Split**

  The Committee is divided between two valid concerns:
  1.  **The Fairness Check:** Without T, Affirmatives could run plans completely outside the resolution (e.g., "The US should give everyone free ponies"), forcing Negatives to prepare for infinite possibilities.
  2.  **The Educational Value:** "T-only" votes often decide rounds on dictionary definitions rather than the merits of the policy, discouraging deep research and real-world analysis.

  Our coach's analogy regarding Pluto is instructive. Asking "Is Pluto a planet?" is a semantic debate with no functional consequence. Asking "Does including Pluto in our solar system model break our gravitational calculations?" is a functional debate. Currently, our rules allow judges to vote on the former. We should require them to vote on the latter.

  ### **Recommendation: The "Demonstrable Abuse" Standard**

  I propose we amend Proposal 4-B. Instead of banning T-only votes entirely, we add the following clause to the Adjudication Guidelines:

  > *"Judgers may cast a ballot on Topicality alone only if the Negative demonstrates that the Affirmative's interpretation causes significant loss of Negative ground or renders the resolution meaningless for the purpose of educational debate. Semantic deviations without functional abuse should not constitute a voting issue."*

  **Why this works:**
  *   **It solves the "Cheap Trick":** If the Affirmative's definition of "reduce" allows cap-and-trade, but the Negative can still run their standard climate disadvantages, there is no "loss of ground." A T vote here is just the "Pluto" semantic game. The rule stops this.
  *   **It keeps the "Fairness Check":** If the Affirmative defines "reduce" as "increase," or runs a plan that excludes the core literature of the topic, the Negative *has* lost ground. They couldn't prepare for this. The rule preserves T for this scenario.

  ### **Implementation: How Judges Apply This Mid-Round**

  The primary concern with any rule change is enforceability. Judges cannot be expected to be philosophers of language. To make this actionable, we will distribute a **"Topicality Checklist"** to all judges for the upcoming season.

  When a Negative goes for a T-only vote, the judge must answer **YES** to at least two of the following three questions to justify the ballot:

  1.  **Exclusion:** Does this definition exclude the core literature or standard cases everyone prepared for? (e.g., If the topic is "Climate Change," does this plan exclude all carbon regulation?)
  2.  **Preparation:** Would a reasonable Negative team have been able to prepare for this specific interpretation with the pre-tournament notice?
  3.  **Predictability:** Does this interpretation allow the Affirmative to run an infinite number of unrelated cases in future rounds?

  If the answer is **NO** (e.g., "Cap-and-trade is still climate policy, we prepped for it, and it's a standard case"), the judge is instructed to evaluate the substantive policy arguments instead.

  ### **The Strongest Argument Against This Recommendation**

  I must address the most compelling argument from the faction supporting the **outright ban**: **Subjectivity.**

  Critics will argue that asking a judge to determine "significant loss of ground" is too subjective. A novice judge might not know what the "core literature" of the topic is. They might mistakenly think a legitimate T violation is just a semantic nitpick, or vice versa. By banning T-only votes entirely, we remove the judge's discretion and guarantee that every round is decided on policy merits.

  **Rebuttal to Subjectivity:**
  While subjectivity is a risk, an outright ban creates a worse problem: **Impunity.** If we ban T-only votes, Affirmatives are incentivized to run "squirrel cases" (bizarre, unpredictable plans) knowing the Negative can never win on T alone. They can force the Negative into a policy debate they didn't prep for, then win on "risk of advantage."

  The "Demonstrable Abuse" standard is not perfect, but it is teachable. The Checklist provided above gives judges concrete metrics (Exclusion, Preparation, Predictability) rather than abstract feelings. It is better to have judges weigh *abuse* than to force them to ignore abuse entirely. We trust judges to weigh the risk of a nuclear war disadvantage; we can trust them to weigh the risk of lost ground.

  ### **Conclusion**

  Banning Topicality entirely throws the baby out with the bathwater. It solves the problem of semantic word-games by removing the only tool we have to stop truly abusive cases.

  By adopting the **"Demonstrable Abuse" standard**, we acknowledge our coach's insight: we shouldn't debate whether Pluto is a planet (semantics); we should debate whether Pluto breaks the model (function). This compromise protects the Negative's right to a fair debate without punishing the Affirmative for reasonable interpretations of the resolution.

  I move that we amend Proposal 4-B to reflect this standard and bring it to a vote.
