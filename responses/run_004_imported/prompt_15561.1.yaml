answer: |-
  You have put your finger on exactly the right tension. Your instinct as a chemist—that science settles disagreements by replication, not by vouching for character—is the gold standard of experimental epistemology. Sidgwick knows this. In fact, the passage you've highlighted is essentially a confession that psychical research *cannot* meet that standard, and so he is attempting to construct a different epistemological framework to accommodate it.

  To answer your specific question: Sidgwick is not making a legitimate argument within the epistemology of experimental science (your home turf). He is shifting the ground to the epistemology of **testimony and legal evidence**, and then dressing it up in scientific clothing.

  Here is what is logically going on in that passage, broken down by the problems Sidgwick is trying to solve.

  ### 1. The Problem of the Unreliable Instrument
  In your lab, if you get a result, I can verify it by running the reaction myself. The apparatus is inanimate; it doesn't lie, and it doesn't have a bad day. In psychical research, the "apparatus" is the human mind (both the medium and the investigator). The phenomena are, by Sidgwick's own admission elsewhere, "slippery." They do not occur on command.

  Because you cannot "rerun the reaction," the data is not the *phenomenon* itself; the data is the *report* of the phenomenon. This moves the inquiry from physics to history or law. In a court of law, you cannot rerun a murder. You have to decide if the witness is credible.

  Sidgwick is acknowledging that because they cannot offer reproducibility, they must offer **unimpeachable credibility**. When he says, "We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick," he is admitting that the chain of evidence ends at the character of the observer.

  ### 2. The Burden of Proof Flip
  Your skepticism is well-founded: a determined skeptic *can* always take the second horn of the dilemma ("you are lying or deluded") forever. Logically, you are right; it is always available.

  However, Sidgwick is making a pragmatic, not a purely logical, move. He is trying to raise the **social and professional cost** of skepticism.

  In the 1880s, the "scientific incredulity" he mentions was often *a priori*. Materialists would reject claims of telepathy not because the evidence was weak, but because such things were impossible by definition. Sidgwick is trying to force the skeptic out of that dogmatic position. He is saying:
  *"We have followed your methods. We have controlled variables. We have accumulated mass. If you still reject this, you are no longer rejecting the data; you are rejecting us. You are making a personal accusation."*

  He wants to corner the skeptic into admitting that their rejection is based on worldview (materialism), not on the specific evidence at hand. By forcing the skeptic to say "Sidgwick is a liar," Sidgwick hopes to make the skeptic look unreasonable, because Sidgwick was widely regarded as a man of intense integrity (he was known as the "Saint of Sidgwick" among contemporaries).

  ### 3. The "Idiocy" Horn and the Limit of Reasonable Doubt
  You asked if this is a "graceful way of admitting the whole thing has collapsed into a personal dispute." The answer is **yes**, but Sidgwick views that collapse as a victory.

  In philosophy, this touches on the **Problem of Testimony** (famously addressed by David Hume regarding miracles). Hume argued that it is always more probable that the witness is mistaken or lying than that a law of nature has been violated. Sidgwick is trying to counter Hume by maximizing the probability of the witness's reliability.

  When Sidgwick says the objector must accuse the investigator of "blindness or forgetfulness incompatible with any intellectual condition except absolute idiocy," he is defining the boundary of **reasonable doubt**. He is arguing that skepticism is a virtue only up to a point. Beyond that point, it becomes dogma.

  He is essentially arguing: *If the only way to save your materialist worldview is to accuse a room full of Fellows of the Royal Society of being liars or idiots, then your worldview is the thing that is broken, not our data.*

  ### 4. Why It Feels Foreign to a Chemist
  It feels foreign to you because in chemistry, **trust is provisional; in Sidgwick's SPR, trust is foundational.**

  *   **Chemistry:** I trust your results until I try to replicate them and fail. Then I don't need to call you a liar; I just know the reaction conditions weren't met. The system is self-correcting.
  *   **SPR:** I must trust your results immediately, because I cannot replicate them. If I doubt them, I must doubt *you*. The system is not self-correcting; it is credibility-correcting.

  Sidgwick knows this. That is why he emphasizes "private families" and protecting the medium. He knows that without the shield of the Society's institutional prestige, the "instrument" (the medium) will be destroyed by the "lying/cheating" accusation. He is building a fortress of reputation around the data because the data cannot stand alone.

  ### The Verdict
  Is it a legitimate epistemological argument?
  *   **Within Experimental Science:** No. It violates the principle that the validity of a finding should be independent of the finder.
  *   **Within Historical/Legal Epistemology:** Yes. It is a standard argument regarding the weight of credible testimony. If enough credible witnesses testify to an event, the burden shifts to the denier to explain why the witnesses are wrong.

  Sidgwick is not claiming he has proven telepathy in that passage. He is claiming he has **exhausted the scientific method's ability to engage with the skeptic.** He is saying, "We have played by your rules as far as they can go. The next move requires you to attack our characters. If you do that, you have left the realm of science and entered the realm of personal hostility."

  It is a defensive maneuver. He knows the "heap of facts" will likely never be heavy enough to kill incredulity for a true believer in materialism, because the materialist can always choose the "lying/idiocy" horn. Sidgwick is essentially hoping to shame the scientific community into agnosticism rather than disbelief.

  So, your intuition is correct: The argument *has* collapsed into a dispute about who to trust. Sidgwick's genius in this passage is recognizing that collapse and trying to frame it not as a failure of evidence, but as a failure of the skeptic's open-mindedness. He is turning the "unscientific" nature of the inquiry into a moral test for the scientist.
