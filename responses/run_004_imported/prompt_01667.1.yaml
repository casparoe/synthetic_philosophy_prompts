answer: |-
  You have hit on one of the most persistent and thorny problems in evolutionary biology and anthropology. You are absolutely right: observing a costly behavior is necessary for Costly Signaling Theory (CST), but it is not sufficient. Just because a behavior *could* be a signal doesn't mean it *is* one; it might be a direct adaptation, a byproduct, or a different kind of social contract entirely.

  A perfect example of this ambiguity—one that has sparked decades of debate and is far more nuanced than the peacock's tail—is **large-game hunting in human hunter-gatherer societies** (specifically the **"Showoff Hypothesis"** vs. the **"Risk-Reduction Hypothesis"**).

  ### The Behavior
  In many contemporary hunter-gatherer groups (like the **Hadza of Tanzania** or the **Ache of Paraguay**), men often engage in the hunting of large, dangerous game (e.g., antelope, baboons, or even elephants). This behavior is puzzling from a purely caloric efficiency standpoint.
  *   **The Cost:** It is energetically expensive, time-consuming, and carries a high risk of injury or failure. Success rates are often low (high variance).
  *   **The Puzzle:** When a hunter succeeds, he rarely keeps the meat for his own nuclear family. He shares it widely across the camp, often keeping the least desirable parts for himself.

  ### Explanation 1: Costly Signaling (The Showoff Hypothesis)
  Proposed by evolutionary anthropologists like Kristen Hawkes and Michael Bliege Bird, this argument posits that hunting large game is primarily a signaling mechanism.
  *   **The Signal:** Successfully killing a dangerous animal signals underlying phenotypic quality: strength, coordination, courage, and cognitive mapping ability.
  *   **The Handicap:** The high risk of failure and injury ensures the signal is "honest." A low-quality individual cannot afford the risk or lacks the skill to pull it off consistently.
  *   **The Benefit:** The payoff isn't primarily the calories (since the meat is shared away). The payoff is **social status and reproductive access.** High-status hunters often have higher reproductive success, including extra-pair copulations, even if their own children don't eat significantly better than others. The cost is "wasted" calories to buy social capital.

  ### Explanation 2: The Compelling Alternative (Risk-Reduction / Tolerated Theft)
  The alternative explanation argues that there is no signaling involved at all; the behavior is driven by economic insurance and resource defense.
  *   **The Logic:** Large game is "lumpy." One kill provides more meat than a single family can eat before it rots. However, a single hunter cannot physically defend a whole carcass from the rest of the group.
  *   **The Mechanism:** This is often called **"Tolerated Theft."** The hunter shares not to signal generosity, but because the cost of defending the meat (fighting off hungry campmates) is higher than the cost of sharing it.
  *   **The Insurance Policy:** By sharing widely, the hunter creates a system of **reciprocal altruism (risk-pooling).** Today he feeds the camp; next week, when he fails to hunt (which is common), the camp feeds him. The behavior is driven by caloric stability (variance reduction), not status seeking.

  ### Why It Is So Hard to Rule Out Either Explanation
  This is where your skepticism is validated. In practice, disentangling these two is incredibly difficult for several reasons:

  1.  **Correlated Benefits:** Both theories predict the exact same behavior (hunting and sharing). In the real world, successful hunters *do* gain status (supporting CST), but their families *also* suffer less starvation variance (supporting Risk-Reduction). Because both benefits occur simultaneously, it is hard to determine which benefit was the primary *selection pressure*.
  2.  **The "Honesty" Problem:** For CST to work, hunting success must correlate with underlying genetic quality. But hunting success is also heavily influenced by luck, environmental knowledge, and technology. If a mediocre hunter gets lucky, does he still get the mating benefits? If yes, the signal isn't honest. If no, then maybe it's just about skill acquisition (a direct benefit).
  3.  **Modern vs. Ancestral Context:** We study contemporary hunter-gatherers to infer ancestral behaviors. However, modern groups live in restricted environments with different social dynamics than our ancestors. The "status" we measure today might be a byproduct of a system that evolved for pure caloric insurance 100,000 years ago.
  4.  **Psychological Proximate Mechanisms:** If you ask a hunter *why* he shares, he might say, "It is the custom," or "I am generous." He cannot tell you if his genes are optimizing for reproductive variance or caloric variance. The psychological feeling of "pride" (supporting CST) could be a proximate mechanism evolved to enforce the insurance policy (supporting Risk-Reduction).

  ### A Secondary Example: Altruistic Punishment
  If you want a non-subsistence example, consider **Altruistic Punishment** in humans (e.g., punishing a free-rider in a Public Goods Game at a cost to yourself).
  *   **CST View:** You punish to signal to the group that you are a "cooperator" who enforces norms, making you a desirable partner for future interactions.
  *   **Alternative View:** It is a **byproduct of strong reciprocity** or an emotional anger response. You punish not to signal, but because your neurobiology is wired to feel negative utility when norms are violated, regardless of the future payoff.
  *   **The Ambiguity:** In one-off anonymous experiments, people still punish. This weakens the CST claim (no audience to signal to), but proponents argue we can't turn off our evolved psychology just because the experiment is anonymous.

  ### The Takeaway
  Your intuition is correct. In the wild (and in human societies), behaviors are rarely "pure" signals. They are usually **multi-functional.** Large-game hunting likely *did* evolve as risk-pooling, but was later co-opted as a signaling mechanism (or vice versa).

  The scientific challenge isn't just finding a cost; it's proving that the *cost itself* is the feature being selected for, rather than a side effect of a feature selected for something else. In the case of the Hadza hunters, we may never know for sure which explanation is "correct," because evolution likely selected for both.
