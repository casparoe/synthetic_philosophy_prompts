answer: |-
  **The Syntax of Welfare: Adjudicating the Harsanyi Dispute**

  The dispute between your friend and yourself centers on one of the most famous results in social choice theory: John Harsanyi's Aggregation Theorem. Your friend sees it as a mathematical derivation of utilitarian morality from the bare bones of rationality. You see it as a formal trick that smuggles in ethical assumptions while ignoring distributive justice. To adjudicate this, we must distinguish between the *structural* implications of the theorem and the *moral* implications of utilitarianism.

  The verdict, stripped of ambiguity, is this: **Your friend is correct that the theorem forces a utilitarian *structure* upon any social welfare function that accepts its axioms, but you are correct that the theorem fails to justify classical utilitarianism as a moral doctrine.** The theorem proves that social welfare must be *a* weighted sum of individual utilities, but it provides no rational basis for choosing *which* weights, nor does it resolve the conflict between efficiency and fairness. Consequently, the Aggregation Theorem is not a proof of utilitarianism; it is a consistency constraint that applies only if one has already accepted controversial ethical premises regarding risk and Pareto efficiency.

  ### The Formal Victory: Why Your Friend Has a Point

  Your friend's enthusiasm is not misplaced. Harsanyi's Aggregation Theorem (1955) is a powerful impossibility result in reverse. It states that if individual preferences and social preferences both satisfy the von Neumann–Morgenstern (VNM) axioms of expected utility, and if society respects the Pareto principle (specifically, if society is indifferent whenever all individuals are indifferent), then the social welfare function $W$ must be a linear combination of individual utility functions $U_i$:

  $$W = \sum_{i=1}^{n} a_i U_i + b$$

  This is significant because it rules out rival social welfare functions that are non-linear, such as Rawlsian maximin (which focuses only on the worst-off) or prioritarian views (which weight gains to the worse-off more heavily), provided those views violate the VNM axioms at the social level. If one accepts that "rationality" is defined by the VNM axioms (completeness, transitivity, continuity, and independence), and one accepts that society should not override unanimous individual indifference, then additivity is mathematically inevitable.

  In this narrow, formal sense, your friend is right: the *form* of utilitarianism is the only form compatible with these specific constraints. It transforms utilitarianism from a substantive moral claim into a requirement of logical consistency for Paretian liberals who view risk rationally.

  ### The Indeterminacy of Weights and Scales

  However, your first objection strikes at the heart of the move from "weighted sum" to "utilitarianism." Classical utilitarianism requires that every person counts for one and none for more than one. Harsanyi's equation allows for $a_i \neq a_j$. The theorem itself is silent on the values of the coefficients $a_i$.

  To derive classical utilitarianism ($a_i = a_j$ for all $i$), one must introduce an additional axiom, typically Anonymity or Symmetry. But this is an ethical assumption, not a rationality constraint. There is nothing irrational about a social planner who satisfies all VNM axioms and the Pareto principle but assigns double weight to the utilities of doctors over lawyers, or the current generation over the next. The Aggregation Theorem permits this.

  Furthermore, there is the problem of interpersonal comparability. VNM utilities are unique only up to positive affine transformations (scaling and shifting). To sum $U_1$ and $U_2$, their units must be comparable. The Aggregation Theorem assumes these utilities are given and comparable, but it does not *prove* they are. Harsanyi addressed this in his separate "Impartial Observer" argument, claiming that rational empathy establishes a common scale. But that is a separate argument from the Aggregation Theorem. Relying on the Aggregation Theorem alone, as your friend seems to, leaves the utility scales unanchored. Without a separate argument for comparability and equal weighting, the theorem supports a generic weighted utilitarianism that could justify almost any hierarchy, rendering it useless as a specific moral proof.

  ### The Diamond Critique: Ex Ante vs. Ex Post Fairness

  Your second objection, invoking Peter Diamond's critique, is even more damaging to the claim that the theorem is "purely rationality-based." The theorem relies heavily on the *ex ante* Pareto principle: if every individual prefers Lottery A to Lottery B based on their expected utility, society must prefer A to B.

  Diamond (1967) demonstrated that *ex ante* Pareto conflicts with *ex post* fairness considerations that are not captured in individual risk preferences. Consider the classic kidney transplant case. There is one kidney and two patients who need it equally.
  *   **Option 1:** Give the kidney to Patient A (deterministic).
  *   **Option 2:** Give the kidney to Patient B (deterministic).
  *   **Option 3:** Flip a fair coin to decide (lottery).

  Assume both patients are risk-neutral and value the kidney equally. Their expected utility for Option 3 is exactly the average of Option 1 and Option 2. Consequently, the patients are indifferent between the deterministic assignments and the coin flip. Because the individuals are indifferent, the *ex ante* Pareto principle requires society to be indifferent as well.

  However, many moral intuitions suggest Option 3 is superior because it treats the patients with equal respect *ex post*, giving each a fair chance rather than arbitrarily favoring one. If society values this fairness, it violates the *ex ante* Pareto principle. By building *ex ante* Pareto into the axioms, Harsanyi's theorem defines "rationality" in a way that excludes distributive fairness concerns that do not manifest as individual risk preferences.

  Your friend claims the theorem is based on "pure rationality." But choosing *ex ante* Pareto over *ex post* fairness is not a neutral rational choice; it is a substantive ethical commitment to a specific view of welfare aggregation. If one believes fairness has intrinsic value independent of individual expectations, the theorem's axioms are unacceptable. Thus, the theorem does not prove utilitarianism to a skeptic; it merely tells the skeptic that they cannot hold their view of fairness while simultaneously accepting *ex ante* Pareto.

  ### The Verdict

  The dispute is resolved by recognizing the difference between a conditional constraint and an unconditional proof.

  Your friend is correct that **if** one accepts the VNM axioms for social preferences and the *ex ante* Pareto principle, **then** social welfare must be represented as a weighted sum of individual utilities. In this specific logical space, utilitarianism is the only game in town.

  However, you are correct that this "if" carries the entire moral weight. The theorem does not justify the equal weights required by classical utilitarianism, nor does it justify the exclusion of *ex post* fairness concerns. It assumes interpersonal comparability rather than deriving it, and it embeds a controversial conception of Pareto efficiency that prioritizes expected utility over distributive justice.

  **Therefore, the definite verdict is:** Harsanyi's Aggregation Theorem lends no independent moral support to classical utilitarianism. It serves only as a consistency check for those who have already independently accepted the ethical premises of interpersonal comparability, equal weighting, and *ex ante* Pareto efficiency. Without these external assumptions, the theorem is morally silent; with them, it is redundant. Your friend has mistaken a mathematical implication for a moral foundation. The theorem shows that utilitarianism is *consistent* with a specific set of rationality axioms, but it cannot prove that those axioms are *mandatory* for a just society.
