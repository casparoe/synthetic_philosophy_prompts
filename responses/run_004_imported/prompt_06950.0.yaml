      *   *Tone:* Philosophical, rigorous, fair to both sides.
      *   *Clarity:* Ensure the distinction between the Aggregation Theorem and the Impartial Observer Theorem is clear (though they are often conflated, the prompt focuses on Aggregation). I should stick primarily to Aggregation but acknowledge where Harsanyi usually fills the gaps (Impartial Observer).
      *   *The Verdict:* Needs to be sharp. "The friend is right about the form, the user is right about the substance."
      *   *Nuance:* Harsanyi argued for equal weights via the "veil of ignorance" (Impartial Observer). The prompt asks about the *Aggregation Theorem* specifically. I must be careful not to conflate the two too much, but acknowledge that Harsanyi himself knew the Aggregation Theorem wasn't enough on its own.
