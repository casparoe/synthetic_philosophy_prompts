  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Critique:* Is Hobbes really a good example? He was right about politics (arguably) but wrong about math.
      *   *Correction:* Yes, that's exactly the point. You can be right about the big picture but wrong about the supporting details, *unless* the details are foundational. The user suspects the belief *is* foundational. That's the danger zone.
