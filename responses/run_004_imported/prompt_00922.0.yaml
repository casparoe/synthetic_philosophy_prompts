      *   *Did the law recognize Schiavo as alive?* Yes. That's why the court case was about *withdrawing care*, not declaring death. This is a crucial distinction. Locke's view might support withdrawing care because the *person* is gone, even if the *man* isn't legally dead.

  8.  **Final Polish:** Organize into clear sections. (Locke's Framework, The Schiavo Case, The Legal Clash, Implications). Ensure the "Higher-Brain" concept is introduced as it bridges Locke to modern bioethics.

