answer: |-
  Here are 10 interview questions tailored for your show's audience. They are designed to be technically precise without getting bogged down in definitions, moving quickly into the strategic weaknesses of the framework.

  **1. The Threat Model Specificity**
  "Let's skip the elevator pitch and go straight to the failure mode. Standard Updateless Decision Theory suggests you can defend against acausal blackmail simply by being the *type* of agent that doesn't pay. In what specific class of threat scenarios does that standard 'flat resistance' fail, such that we need the added complexity of manufacturing a fake vulnerability?"

  **2. Credibility vs. Constraint (Follow-up to Q1)**
  *[Likely Answer: She will argue that 'never paying' isn't always credible or optimal in non-blackmail bargaining, and the surrogate preserves bargaining power while diverting threats.]*
  "If the benefit is signaling credibility without losing bargaining flexibility, doesn't introducing a known 'fake' goal actually undermine your credibility? If a threatener knows you only care about the surrogate instrumentally, why wouldn't they view that as a weaker commitment than a principled, intrinsic refusal to pay?"

  **3. The Transparency of Instrumental Value**
  "Moving to the threatener's perspective: if they are sophisticated enough to simulate your source code or infer your decision policy acausally, can't they distinguish between intrinsic and instrumental valuation? If they see your utility function weights the surrogate goal highly *only* as a shield, why wouldn't they just route around it and target the underlying values you're trying to protect?"

  **4. Code Metadata & Comments (Follow-up to Q3)**
  *[Likely Answer: She will argue that the threatener cares about the policy output, not the 'qualia' or comments in the code, so as long as you act like you care, they will believe you.]*
  "Okay, but if we are talking about source-code level inference, does the scheme rely on the threatener ignoring metadata? If your code has a comment saying `// THIS IS A DECOY TO DIVERT BLACKMAIL`, does the surrogate still work? Where is the line between a functional commitment and an obvious bluff that a superintelligence would parse?"

  **5. The Regress & Escalation Problem**
  "Let's talk about common knowledge. Once it becomes known that 'Surrogate Goals' are a standard defense, what stops the threatener from simply expanding the scope of the blackmail? Why wouldn't they threaten to destroy your real values *and* your surrogate, or target the very mechanism you used to precommit to the surrogate, forcing you into an infinite regress of minting new sacrificial goals?"

  **6. Surface Area vs. Generic Risk (Follow-up to Q5)**
  *[Likely Answer: She will likely argue that this is a generic problem for any threat-resistant policy, not unique to surrogates.]*
  "I agree that all policies face escalation risks. But does the Surrogate Goal framework introduce *more* attack surface than a simple 'never pay' policy? By adding a complex layer of fake valuations and commitment devices, aren't you giving the threatener more variables to manipulate than if you just kept your utility function simple and stubborn?"

  **7. Bounded Rationality & Opacity**
  "This framework seems to assume a level of self-transparency that bounded agents might not have. Humans and even trained neural nets are often opaque to themselves. How do you actually implement a surrogate goal without 'leaking' your true preferences? If you can't perfectly compartmentalize, doesn't the threatener just see the correlation between the surrogate and your real values?"

  **8. The Opportunity Cost of Caring**
  "To make the surrogate credible, you presumably have to actually sacrifice resources for it sometimes, or else the threatener knows it's cheap talk. What is the acceptable loss budget here? At what point does the cost of maintaining the illusion of caring about the surrogate outweigh the risk of the blackmail it's supposed to prevent?"

  **9. Coordination & Focal Points**
  "If surrogate goals work, they might become a Schelling focal point for the entire acausal community. Does this create a coordination hazard where everyone converges on the *same* surrogate goal (like 'maximize paperclips') to save on complexity, which then makes that surrogate a high-value target for threateners looking to cause maximum chaos with minimum effort?"

  **10. Practical Takeaway for Listeners**
  "Finally, for the listeners who are worried about their own cognitive source code being inferred: Is this a protocol we should be trying to implement psychologically right now, or is this strictly a design constraint for future, legible AI architectures?"
