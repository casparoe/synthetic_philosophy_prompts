answer: |-
  The heat in the Chihuahuan Desert didn't rise; it pressed. It shoved Elena's hair against her neck and made the plastic of her field clipboard warp. She wiped sweat from her brow, leaving a streak of red dust.

  "Got one," Marcus called. He was crouched near a creosote bush, his hand hovering over a slender lizard darting through the scrub.

  "Don't spook it," Elena hissed. "Is it *inornata*?"

  Marcus moved with the slow patience of a predator. He looped the noose. The lizard thrashed, scales scratching against the wire. He brought it back to the shade of the truck, holding it gently but firmly. It was a whiptail, sleek and striped, but the pattern was wrong. The stripes were too broken, the color too muted.

  Marcus looked at Elena. "It's a unisexual. *Uniparens*."

  Elena sighed, the sound sharp in the dry air. She opened the logbook. "Label it as *A. inornata* with a note. Or just 'hybrid swarm.' We can't list it as a distinct species entry."

  "Why not?" Marcus didn't look up. He was measuring the snout-vent length, his fingers careful around the creature's ribs.

  "Because it's a clone, Marcus. It's an all-female lineage born from a hybridization event between *inornata* and *burti* thousands of years ago. They don't recombine genes. They don't have a gene pool. They're just... copies." Elena tapped her pen against the clipboard. "The Biological Species Concept is built on reproductive communities. This thing doesn't belong to a community. It's a genetic dead end that refuses to die."

  "It's not dead," Marcus said. He pointed to the lizard's belly, pale and breathing rapidly. "It's outcompeting the parents in this niche. It's occupying terrain neither parent species can hold. It has a separate evolutionary fate."

  "It has no fate," Elena countered. "It's stuck. Without recombination, there's no variation for selection to act on. It's a museum specimen that learned to walk. If we call it a species, we're saying a glitch is the same as a lineage."

  Marcus finally looked at her. His eyes were tired, squinting against the glare. "You're defining species by how they start, not what they are. Look at this population. They're distinct. They're stable. They've been running around this desert longer than *Homo sapiens* has been writing definitions. If you walked away from this truck and saw one, you'd know it wasn't an *inornata*. You'd know it wasn't a *burti*."

  "I'd know it's a hybrid," Elena said. "Nature is messy. That doesn't mean every mess gets a binomial name. If we label this a species, where do we stop? Every individual clone lineage is genetically distinct. Do we name every snake in the grass?"

  "We stop where the lineage stops," Marcus said. He reached for a zip-top bag. "This group maintains its identity over time. It responds to the environment as a unit. That's enough."

  "It's not enough," Elena said, her voice rising. "It breaks the logic. A species is a process, Marcus. It's the flow of information. This thing hoards information. It's a wall, not a river. If we protect it as a species, we're protecting a pattern, not a process. We're freezing evolution."

  Marcus slipped the lizard into the bag. It curled against the plastic. "You want to protect the mechanism. I want to protect the thing that's actually here."

  "The 'thing' is a paradox."

  "The 'thing' is alive," Marcus said. He sealed the bag. "And next year, when the drought hits, the *inornata* might vanish from this valley. The *burti* might vanish. But these girls? They'll still be here. They'll still be hunting beetles under the creosote. When the parents are gone, what do you call the child?"

  Elena looked at the bag. The lizard pressed its nose against the plastic, tongue flicking, tasting the air that wasn't there. It was a biological impossibility that had survived the Pleistocene. It fit nowhere in the tree of life, yet it stood firmly on the ground.

  She looked down at the logbook. The column for *Species* waited, a blank white rectangle demanding a truth that didn't exist.

  "Call it *Aspidoscelis uniparens*," Elena said softly, uncapping her pen. "But put a question mark. A big one."

  Marcus nodded. He didn't argue about the mark. He knew the mark was the only honest thing they could write. The lizard hissed, a silent vibration against the plastic, existing perfectly well without their permission.
