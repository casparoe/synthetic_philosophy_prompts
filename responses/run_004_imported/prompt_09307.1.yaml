prompt: |-
  So for my phil of bio seminar this week I want to try somethign different — instead of an argument paper, I want a short story (800ish words) that actually makes someone feel the species problem, rather than just describe it. Please steer clear of the standard go-tos (ring species, Darwin's finches, "aliens who don't fit our categories") since I've read those a hundred times. Ground it instead in a real edge case that actually breaks a specific species concept — e.g. bdelloid rotifers, which have reproduced asexually for tens of millions of years and so don't sit well with concepts built around interbreeding, a hybrid swarm, a chronospecies partway through a fossil sequence, the mess that is bacterial "species" given how much horizontal gene transfer they do, or something else you think is a better test case. I want two field biologists in genuine disagreement, not a lecture dressed up as dialogue, and by the end I should be able to tell which species concept each of them is implicitly leaning on, and why neither one is simply wrong.
