  **MEMORANDUM**

  **TO:** Board Colleagues
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Procedure for Violation Hearings

  Following our last hearing, I have reviewed the procedural disagreement regarding how we vote on fines. We face a choice between "Outcome Voting" (direct vote on the fine) and "Issue Voting" (vote on each bylaw requirement). While I understand the concerns regarding discretion and agenda control, I recommend we adopt **Issue Voting with Standardized Findings**.

  **The Recommendation**
  Moving forward, we should vote separately on each element required by the bylaws (e.g., "Did the violation occur?" and "Was a valid warning on file?"). A fine may only be imposed if a majority answers "Yes" to *all* required elements. Crucially, to address concerns about manipulation, the specific questions will be fixed in our standing rules to match the bylaw language exactly, removing the Chair's discretion to frame them case-by-case.

  **Reasoning**
  Our bylaws state a resident can be fined *only if* specific conditions are met. This creates a logical conjunction. Outcome Voting risks violating this standard; as we saw, a majority could vote to fine even if a majority believed a specific condition (like the warning) was missing. Issue Voting ensures we never impose a penalty unless the board collectively agrees every legal prerequisite is satisfied. This protects the co-op from liability and ensures consistent rule enforcement.

  **Addressing Concerns on Agenda Control**
  I recognize the objection that Issue Voting allows whoever frames the questions to control the outcome. This is a valid risk in ad-hoc settings. However, by codifying the questions into our standing procedure—matching them verbatim to the bylaws—we eliminate the ability to manipulate the phrasing. This safeguard preserves the integrity of the Issue Voting method while neutralizing the risk of agenda control.

  **Addressing Concerns on Collective Will**
  I also acknowledge the concern that Issue Voting may sometimes produce a result (e.g., imposing a fine) that a majority of members would have rejected in a direct vote. While this seems counterintuitive, in a quasi-judicial setting, adherence to the written rules must take precedence over holistic discretion. If we prioritize the direct vote, we risk fining residents based on inconsistent reasoning. By locking in the logical requirements first, we ensure that any fine issued is legally defensible, even if it requires us to set aside individual reservations about the penalty once the facts are established.

  Please review this proposal so we can adopt a standing rule before the next hearing.
