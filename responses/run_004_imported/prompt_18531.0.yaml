prompt: |-
  Write a dialogue between a Bohmian and an Everettian arguing about whether Bell's theorem actually forces you to give up locality. The Bohmian's happy to admit their theory is nonlocal (the pilot wave depends on the whole configuration at once, thats just the price of admission), but the Everettian claims many-worlds gets to keep locality -- no signaling, no spooky action, the weird correlations are just what you'd expect once you realize theres no single outcome to be correlated in the first place. Have the Bohmian really press on that move (is "no signaling" actually the same thing as the locality Bell was worried about?), and make it a real fight -- both sides need genuinely good arguments, nobody's allowed to strawman the other.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Characters:** A Bohmian (De Broglie-Bohm/Pilot Wave theory proponent) and an Everettian (Many-Worlds Interpretation proponent).
      *   **Topic:** Bell's Theorem and Locality.
      *   **Core Conflict:**
          *   Bohmian: Admits non-locality (pilot wave is global). Claims this is the honest price for determinate outcomes.
          *   Everettian: Claims MWI preserves locality (unitary evolution is local, no collapse). Correlations arise from branching, not superluminal influence.
          *   Bohmian Challenge: Is "no signaling" enough to satisfy Bell's notion of locality? Is Everett really local if the *experience* of correlation requires a global account?
      *   **Tone:** A real fight, high intellectual level, no strawmanning, genuine arguments on both sides.

  2.  **Character Conceptions:**
      *   **The Bohmian (let's call her "Bohm"):** Pragmatic, realist about particles, willing to sacrifice Lorentz invariance at the fundamental level for clear ontology. Sees MWI as ontologically extravagant and evasive about the "single outcome" problem.
      *   **The Everettian (let's call him "Ever"):** Formalist, devoted to the Schrödinger equation, sees collapse as the real villain. Believes locality is saved because the wavefunction evolves locally in configuration space (or field space), and "outcomes" are relative states.

  3.  **Key Technical Points to Cover:**
      *   **Bell's Inequality:** Violation implies giving up either Locality or Realism (or Measurement Independence).
      *   **Bohmian Stance:** Keeps Realism (particles have positions), gives up Locality (quantum potential/pilot wave is non-local).
      *   **Everettian Stance:** Keeps Locality (unitary evolution is local), modifies Realism (no single unique outcome, relative states).
      *   **The Crux:** Bell's definition of locality ("Beable" based). Does MWI satisfy Bell's condition of local causality?
      *   **Sebens/Carroll vs. Maudlin/Valentini:** I need to channel the modern debate. Maudlin argues MWI is non-local because it violates the spirit of Bell. Everettians argue Bell's theorem assumes single outcomes.
      *   **No-Signaling:** Everettians lean on this. Bohmians argue no-signaling $\neq$ Bell Locality.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A conference hallway or a late-night pub. Let's go with a quiet corner of a physics department lounge.
      *   **Round 1: The Claim.** Ever asserts MWI is local. Bohm pushes back immediately. Bell said *any* theory reproducing QM must be non-local.
      *   **Round 2: Bell's Condition.** Bohm explains Bell's "Local Causality." The probability of an event here shouldn't depend on settings there, given the past. Ever counters that in MWI, there is no "the outcome" here, only relative states.
      *   **Round 3: The Ontology.** Bohm argues particles need definite positions. Ever argues the wavefunction is the ontology. If the wavefunction evolves via a local Hamiltonian, it's local.
      *   **Round 4: The "Split".** Bohm attacks the mechanism of correlation. How does Alice know she's correlated with Bob if the split is local? Ever explains decoherence and the structure of the global wavefunction.
      *   **Round 5: The "Price".** Bohm argues MWI pays a hidden price (multiplicity). Everett argues Bohm pays a hidden price (preferred frame/non-covariance).
      *   **Closing:** No resolution, but mutual respect for the hardness of the problem.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure the Bohmian doesn't just say "MWI is crazy." They need to attack the *locality* claim specifically.
      *   *Correction:* Make sure the Everettian doesn't just say "Collapse is fake." They need to explain *why* Bell's theorem doesn't apply or how it's satisfied.
      *   *Nuance:* Bell's theorem assumes "one outcome per measurement." MWI denies this. So, does Bell's theorem apply? The Bohmian should argue that *empirical* predictions require correlations that *look* non-local regardless of ontology.
      *   *Nuance:* The Everettian should emphasize that the wavefunction dynamics are strictly local in configuration space (or spacetime for QFT).
      *   *Key Distinction:* Parameter Independence vs. Outcome Independence. MWI violates Outcome Independence but keeps Parameter Independence? Actually, MWI proponents argue it satisfies Local Causality because the "outcome" isn't a single event. I need to be careful here. The strongest Everettian argument is that Bell's inequality derivation assumes a single outcome.

  6.  **Writing the Dialogue (incorporating the technical points):**

      *   *Bohm:* "Bell was clear. Nature is non-local."
      *   *Ever:* "Bell assumed single outcomes. We don't have those."
      *   *Bohm:* "But I see one outcome. You have to explain why *I* see one."
      *   *Ever:* "Relative states. The correlation is in the branching structure."
      *   *Bohm:* "Is that structure established locally? If Alice measures, does Bob branch *instantly*?"
      *   *Ever:* "No, decoherence propagates. But the correlation was encoded in the common past."
      *   *Bohm:* "Then how do you violate Bell inequalities without non-local influence?"
      *   *Ever:* "Because the 'probability' isn't about which outcome happens, but which branch you're on." (This is tricky, need to be precise).
      *   *Better Ever Argument:* The universal wavefunction contains all correlations from the start. Measurement just reveals them via local interaction. No update at a distance is needed because the global state already encodes the correlation.
      *   *Bohm Counter:* But to get the *statistics* of the branches to match Born rule, you need a measure. Is that measure local?
      *   *Focus:* Stick to Locality.
      *   *Bohm:* "No-signaling isn't Bell-locality."
      *   *Ever:* "Bell-locality is about beables. My beable is $\Psi$. $\Psi$ evolves locally."

  7.  **Polishing:** Ensure the voices sound distinct. Bohm should sound grounded, perhaps a bit frustrated with "magic." Ever should sound calm, confident in the math, perhaps a bit abstract.

      *(Self-Correction on Bell's Locality in MWI)*: This is the hardest part. David Wallace and Simon Saunders argue MWI is local. Tim Maudlin argues it isn't. I need to capture the Wallace/Saunders line for Ever: The dynamics are local. The *appearance* of non-locality comes from ignoring the other branches.
      Bohm's counter (Maudlin style): If the theory predicts perfect anti-correlation between spacelike separated events, and the theory is deterministic (unitary evolution is deterministic), then the result at A must determine the result at B. If they are spacelike, that's non-local.
      Ever's rebuttal: The result at A doesn't determine *the* result at B, because there is no *the* result. It determines the *relative* state.

      Okay, ready to write.

  8.  **Final Review against constraints:**
      *   Bohmian admits non-locality? Yes.
      *   Everettian claims locality? Yes.
      *   Bohmian presses on "no signaling" vs "Bell locality"? Yes.
      *   No strawmanning? Yes, arguments must be steel-manned.
      *   Real fight? Yes, tension high.

      *(Final thought)*: Make sure to mention the "Preferred Frame" issue for Bohm, as that's the Everettian's best counter-punch.

      Let's go.cw
answer: |-
  **Setting:** *A dimly quiet corner of the faculty lounge, late evening. The coffee is stale. Two physicists, **ALICE** (Bohmian) and **BOB** (Everettian), are standing over a blackboard covered in half-erased equations.*

  **Alice:** (Tapping a diagram of a Bell test setup) Let's not dance around it, Bob. Bell's theorem is a no-go theorem. It says any theory that reproduces the quantum predictions must violate Local Causality. I'm fine with that. In Bohmian mechanics, the guidance equation depends on the configuration of *all* particles instantaneously. If you wiggle a particle here, the pilot wave updates everywhere. It's explicitly non-local. It's honest.

  **Bob:** And that's why your theory is dead on arrival in a relativistic universe. You need a preferred foliation of spacetime to define that "instantaneous" update. You're smuggling Newtonian absolute time back in. My theory doesn't do that. In Many-Worlds, the wavefunction evolves via the Schrödinger equation. That's a local differential equation. The Hamiltonian density at point $x$ only depends on fields at $x$. Locality is preserved.

  **Alice:** Preserved in the dynamics, maybe. But not in the phenomena. Bell wasn't worried about the equations; he was worried about *beables*. The stuff that actually happens. When I measure spin-up here, I know with certainty that you measure spin-down there, spacelike separated. If my outcome is definite, and yours is definite, and they are perfectly correlated beyond what shared past history can explain, something connected us.

  **Bob:** But that's the assumption Bell made that you're clinging to: "Single Outcome." You assume there is one unique result at A and one unique result at B. In Everett, there isn't. There is the global wavefunction. It contains a branch where I see up and you see down, and a branch where I see down and you see up. The correlation is built into the structure of the entangled state prepared in the common past. No signal needs to pass between us at measurement time.

  **Alice:** That sounds like wordplay. Look, Bell's condition of Local Causality is precise. The probability of an event at A, given the complete state of the past light cone, should not depend on the setting or outcome at B. In your theory, does the "branch" I end up on depend on what happens at B?

  **Bob:** No. The *global* state evolves deterministically. My "outcome" is just my relative state within that global vector. When you measure, you decohere. You become entangled with your apparatus. I do the same. The correlation isn't established *at* measurement; it's revealed. The entanglement was there at the source. The unitary evolution just propagates that correlation locally through the branching structure.

  **Alice:** But to get the statistics right—the violation of the inequality—you need the branches to have weights that match the Born rule. And you need the specific pairing of branches. If I am in the "Up" branch, I *must* be paired with your "Down" branch. Who enforces that pairing if there's no communication? If the branching is purely local, why can't I branch into "Up" while you branch into a superposition that doesn't match?

  **Bob:** Because the branching *is* the decoherence of the entangled state. The state is $\frac{1}{\sqrt{2}}(|\uparrow\rangle_A |\downarrow\rangle_B - |\downarrow\rangle_A |\uparrow\rangle_B)$. When you interact with your particle, you become $|\text{SeeUp}\rangle_A |\uparrow\rangle_A |\downarrow\rangle_B$. The state at B hasn't changed yet. It's still $|\downarrow\rangle_B$. Nothing happened at B. Later, when we compare notes, our light cones intersect, and the decoherence ensures that the "SeeUp" version of you only ever meets the "SeeDown" version of me. There is no cross-branch communication.

  **Alice:** (Sighs) This is the "no-signaling" defense. You're conflating signal locality with Bell locality. Bell proved that "no-signaling" isn't enough. You can have a theory where you can't send a message faster than light, but which is still fundamentally non-local in its ontology. Bohmian mechanics is exactly that. I can't signal to you because I don't control the particle positions, but the *dependence* is instantaneous. You claim MWI is different, but if the theory predicts correlations that violate Bell inequalities, and you claim the world is real, you have non-locality. You're just hiding it inside the word "branch."

  **Bob:** I'm not hiding it. I'm rejecting the premise that "outcome" is a primitive. Bell's theorem assumes that for every measurement, there is a single value $\lambda$ that determines the result. If you drop that, the inequality doesn't follow. I keep the wavefunction as the sole ontology. The wavefunction lives in configuration space, sure, but its evolution is governed by a local Hamiltonian in 3D space (or QFT). There is no action-at-a-distance. There is only the unfolding of a local dynamical law.

  **Alice:** But the wavefunction isn't in 3D space, Bob. It's in $3N$-dimensional configuration space. A local interaction in configuration space looks wildly non-local in 3D space. If I have two entangled particles, one in New York and one in Tokyo, the wavefunction is a function of $\psi(x_{NY}, x_{Tokyo})$. A change in the potential at $x_{NY}$ affects the evolution of the whole function instantly.

  **Bob:** That's a category error. The fundamental space *is* configuration space (or Hilbert space). 3D space is emergent. Locality should be defined in terms of the fundamental degrees of freedom. In the fundamental description, the dynamics are local.

  **Alice:** That is a retreat into formalism! Physics is about what happens in *this* space, where we live. In *this* space, I see a detector click. You see a detector click. If those clicks are correlated in a way that defies local common causes, nature is non-local. You can say "Oh, but there are other versions of me," but *this* version of me experiences a definite outcome. To explain why *this* experience is correlated with *your* experience without a causal link, you need non-locality.

  **Bob:** Why? Suppose I have a pair of gloves. I put one in a box in New York, one in Tokyo. I send them out. You open your box and see a Left glove. You instantly know I have the Right glove. Did a signal fly from New York to Tokyo? No. The correlation was in the past.

  **Alice:** (Rolls eyes) The glove analogy. Bell specifically destroyed that. Local hidden variables—like the gloves—cannot violate the Bell inequality. Quantum correlations are stronger than classical gloves. To get the quantum strength, the "glove" in Tokyo has to know what measurement setting I chose in New York. In Bohm, the pilot wave tells the Tokyo particle what I'm measuring in New York. Instantly. In MWI, what tells the Tokyo branch which New York branch to match up with?

  **Bob:** Nothing "tells" it. The matching is structural. The universal wavefunction is a single object. It has components. When you measure, you don't select a component; you become entangled with the components. The component where you measure Up is *already* tensor-producted with the component where I measure Down. The correlation is a property of the vector, not a causal influence transmitted at measurement.

  **Alice:** But the vector is global! You're saying the "locality" is saved because the ontology is a global object that evolves locally in abstract space. But empirically, we are localized beings. If I am a localized being, and my experience depends on the state of a global wavefunction that connects me to you instantaneously, I am subject to non-local influences. You've just shifted the non-locality from the *particles* to the *space* the wavefunction lives in.

  **Bob:** I've shifted it from a dynamical influence to a kinematic constraint. There's a difference. In your theory, if I wiggle a particle here, the velocity of a particle there changes *now*. That's a dynamical non-locality. It fights against Relativity. In my theory, nothing changes at a distance. The state at B is exactly what it was before you measured at A. The reduced density matrix at B is unchanged. That is strict locality.

  **Alice:** The reduced density matrix is unchanged, yes. That's why you can't signal. But Bell Locality isn't about density matrices; it's about outcomes. If you claim outcomes are real (even if relative), you have to account for their correlations. Look, I respect the consistency of MWI. But don't tell me you've satisfied Bell. You've sidestepped him by denying the reality of the single event. I accept the single event and pay the non-locality tax. You keep the locality but pay the ontology tax—infinite worlds.

  **Bob:** And I'd argue my tax is lower. You pay with a preferred reference frame, which breaks the spirit of Special Relativity at the fundamental level. You have to say the universe *knows* which slice of spacetime is "now." I keep Lorentz invariance intact in the dynamics. The "splitting" propagates at the speed of light via decoherence.

  **Alice:** Does it? If the entanglement is already there, the "splitting" happens upon interaction. If I measure an entangled particle, do I split *before* the light cone from my measurement reaches you?

  **Bob:** You enter a superposition relative to the rest of the universe. But from my perspective, nothing happens until the decoherence waves intersect.

  **Alice:** But the correlation is perfect. If we measure simultaneously in a frame where we are spacelike separated, the correlation holds. If your theory is truly local, there must be a frame where I measure first. In that frame, do I split before you? If I split, does the global wavefunction update to reflect that I am now in a specific branch relative to you?

  **Bob:** The global wavefunction doesn't update. It just *is*. The "branching" is just us noticing the decoherence. There is no update. That's the point. No collapse means no update.

  **Alice:** Then how do you account for the fact that I *never* find myself in a branch where the correlations are violated? If the branching is local, and the outcomes are relative, what prevents the emergence of a "branch" where Bell's inequality is satisfied classically?

  **Bob:** The linearity of the Schrödinger equation. The branches don't mix. The amplitude for the "violated correlation" branch is zero. It's not that it's suppressed; it's forbidden by the initial conditions and the unitary evolution.

  **Alice:** (Pauses, thinking) So you're saying the non-locality is encoded in the initial state of the universe? The correlations were pre-loaded at the Big Bang?

  **Bob:** The entanglement structure was. Just like the conservation of angular momentum was.

  **Alice:** But angular momentum is local. I can trace the transfer of momentum through the field. With entanglement, there is no field carrier. You're asking me to believe that the reason I see Up and you see Down is because the universal wavefunction, a beast living in infinite dimensions, dictates it, yet nothing physical passed between us.

  **Bob:** I'm asking you to believe that the wavefunction is the physical thing. And it evolves locally. You're insisting that "physical" means "particles in 3D space." If you change your definition of physical, the non-locality disappears.

  **Alice:** And if I change my definition of physical, I lose the world I actually observe. I observe *one* outcome. To get that one outcome from your many, you need a mechanism. If that mechanism respects Bell's Locality, it shouldn't violate the inequality. Since it *does* violate the inequality, and you claim it's local, you're claiming the impossible. You're trying to have your cake (local dynamics) and eat it too (violating Bell).

  **Bob:** I'm not violating Bell. Bell's theorem says: Local Causality + Single Outcome $\rightarrow$ Inequality. I drop Single Outcome. Therefore, I keep Local Causality and violate the Inequality. It's modus tollens, Alice. You keep Single Outcome and drop Local Causality. We both violate the inequality. The question is, which sacrifice is less damaging to physics? Breaking Lorentz invariance, or accepting that "outcome" is relative?

  **Alice:** The sacrifice is reality. If locality means "no influence propagates faster than light," you're safe. But if locality means "the physical state of a system is determined by its immediate surroundings," you're dead. Because *my* immediate surroundings include my measurement result, and that result is correlated with yours in a way that defies local explanation. You can call it "relative state," but the correlation is absolute.

  **Bob:** The correlation is absolute, the *events* are relative. Look, we're at an impasse. You think non-locality is a feature; I think it's a bug you've learned to love. I think "many worlds" is a feature; you think it's ontological bloat.

  **Alice:** I think non-locality is a fact of nature. Bell showed us that. Hiding behind "relative states" doesn't make the spooky action go away; it just makes it harder to define what "action" means. I'll take a clear ontology with a preferred frame over a local ontology where I don't know which "me" is the real one.

  **Bob:** And I'll take a local dynamics where the math works perfectly over a theory that requires invisible particles and hidden variables that we can never measure. At least in my universe, Einstein gets to keep his speed limit.

  **Alice:** (Smiles wryly) Einstein also believed in a single reality.

  **Bob:** Einstein also didn't have decoherence theory.

  **Alice:** Touché. Coffee?

  **Bob:** Black. Like the wavefunction before measurement.

  **Alice:** Don't push it.
