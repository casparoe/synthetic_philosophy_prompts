answer: |-
  You have stumbled upon one of the most famous results in modern behavioral economics. Your friend is mathematically correct *within the specific framework he is using*, but his conclusion that you are being "irrational" relies on that framework being the absolute truth about human decision-making. It isn't.

  The argument your friend made is known as **Rabin's Paradox** (proposed by economist Matthew Rabin in 2000). It is a calibration theorem that demonstrates a fatal flaw in the standard economic model of risk.

  Here is the breakdown of why your friend's math works, why his conclusion is misleading, and the sophisticated framework that validates your intuition.

  ### 1. Why Your Friend's Math is Valid (Within Standard Theory)

  Your friend is using **Expected Utility Theory (EUT)**. This is the standard neoclassical model taught in economics. In EUT, rationality is defined by maximizing the "expected utility" of your final wealth.

  In this model, the only reason a rational person rejects a positive expected value bet (like your -$200/+$240 coin flip) is **diminishing marginal utility of wealth**. This means that as you get richer, every additional dollar is worth slightly less to you than the previous one. To reject a bet where the gain ($240) is larger than the loss ($200), your utility function must curve downward enough that the utility lost from -$200 outweighs the utility gained from +$240.

  **The Trap:**
  You told your friend you would reject this bet at **every wealth level**.
  *   If you reject it when you are poor, that's understandable (money is tight).
  *   If you reject it when you are a billionaire, EUT says it's because the *extra* $240 is barely noticeable to you compared to the pain of losing $200.

  Rabin proved that if you calibrate the curvature of the utility function to reject that specific small bet at *all* wealth levels, the curve becomes incredibly steep. Mathematically, it implies that your valuation of money drops off so precipitously that by the time you are facing a loss of $1,000, the utility of gaining $1 billion is not enough to compensate for it.

  So, strictly speaking: **If** you assume Expected Utility Theory is the only valid model of rationality, **then** your preferences are indeed inconsistent.

  ### 2. Why Your Intuition is Actually Correct

  The problem isn't your intuition; it's the model. EUT assumes that people care about **final wealth states**. In reality, humans care about **changes in wealth relative to a reference point**.

  This is the core insight of **Prospect Theory**, developed by Daniel Kahneman and Amos Tversky (for which Kahneman won the Nobel Prize). Prospect Theory fixes the hole in EUT that Rabin's Paradox exposes.

  Here is how Prospect Theory resolves your dilemma:

  **A. Reference Dependence**
  You don't evaluate the bet based on your total bank account (wealth). You evaluate it based on the change from your current status quo.
  *   **EUT says:** "I have \$X. Bet results in \$X - 200 or \$X + 240."
  *   **Prospect Theory says:** "I am at 0. Bet results in -200 or +240."

  **B. Loss Aversion**
  Humans are wired to feel losses more intensely than gains. This is not about the utility of wealth; it is an emotional response to the transaction itself. The "pain" coefficient of a loss is typically about 1.5 to 2.5 times stronger than the "pleasure" coefficient of an equivalent gain.

  In your first bet (-$200 / +$240):
  *   The pain of losing $200 feels like losing roughly $400 to $500 in "psychological value."
  *   The pleasure of winning $240 feels like gaining $240.
  *   **Result:** The pain outweighs the gain. You reject the bet. This is rational under Prospect Theory.

  ### 3. Reconciling the Two Bets

  Now, let's look at the second bet your friend proposed (-$1,000 / +$1 Billion) through the lens of Prospect Theory.

  *   **The Loss:** Losing $1,000 hurts. Let's say, psychologically, it feels like losing $2,000.
  *   **The Gain:** Winning $1 billion is life-changing. Even with diminishing sensitivity to gains, the sheer magnitude creates a utility spike that EUT cannot capture because EUT is bogged down by the curvature of total wealth.

  In Prospect Theory, you can have a "kink" in your value function at the reference point (loss aversion) without requiring the absurd curvature of total wealth that EUT demands. You can be loss-averse enough to reject the small bet (because the gain isn't big enough to overcome the loss aversion) but rational enough to accept the massive bet (because the gain is so large it overwhelms the loss aversion).

  ### 4. The "Every Wealth Level" Claim

  There is one subtle point where your friend might have caught you in a semantic trap. You stated you would reject the first bet "no matter how much money I already had saved up."

  If you truly, literally mean that you would reject a 50/50 lose $200/gain $240 bet even if you had $100 trillion in the bank, you are exhibiting a specific type of risk aversion that *is* hard to justify. At that level of wealth, $200 is noise. Rejecting it implies you are treating money as having no marginal utility at all, or you have a strict rule against gambling.

  However, most people who say this actually mean: *"I reject this bet in the context of my normal life."*

  If you view the bet as a **one-off transaction** rather than a change in lifetime wealth, your rejection is perfectly rational. In the real world, there are infinite such opportunities. If you accept every small positive-EV bet that involves risk of loss, you introduce volatility into your life that requires mental energy to manage. Rejecting small, annoying gambles is a heuristic that saves "cognitive bandwidth," which is itself a valuable resource.

  ### Conclusion

  Your friend is right that **Expected Utility Theory** cannot accommodate your preferences without implying absurdity. This is actually a well-known proof *against* the universality of Expected Utility Theory, not a proof of your irrationality.

  You are not being irrational. You are exhibiting **Loss Aversion**, which is a robust, well-documented, and defensible human trait.
  1.  **Bet 1:** The potential gain ($240) is not high enough to overcome the psychological pain of the loss ($200). **Reject.**
  2.  **Bet 2:** The potential gain ($1 Billion) is high enough to overwhelm the psychological pain of the loss ($1,000). **Accept.**

  You can hold both positions simultaneously without logical contradiction, provided you use a model of human behavior (like Prospect Theory) that accounts for how people actually value gains and losses, rather than how economists wish they valued total wealth. Your friend showed you the limits of his model, not the limits of your reason.
