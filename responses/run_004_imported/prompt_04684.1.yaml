      *   *Key Term:* "Nominalism." Berkeley is a nominalist. He hates universals/abstractions. Matter is an abstract universal. Intrinsic Value is an abstract universal.
      *   *Key Term:* "Instrumentalism." Money is an instrument. Ideas are instruments of God's language.

  11. **Final Polish:** Ensure the tone is conversational but rigorous. Avoid "philosophy 101" simplifications but keep it accessible. Make sure the verdict is bold. (Decided: The user is right, but with a specific nuance about *nominalism* being the root).

  12. **Final Check against constraints:**
