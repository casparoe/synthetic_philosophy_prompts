  5.  **Evaluate the Objection (The Friend's Critique):**
      *   *Category Error:* Epistemology/Metaphysics (What exists?) vs. Economics/Politics (How do we organize society?).
      *   *Motivation:* Immaterialism is theological/epistemological (refuting atheists/skeptics). *The Querist* is pragmatic/patriotic (fixing Irish poverty).
      *   *Chronology:* *Principles* (1710) vs. *Querist* (1735-52). Did he carry the logic over, or just change topics?
      *   *Nuance:* Berkeley doesn't say gold *doesn't exist* in *The Querist*, just that it's not the *definition* of wealth. In immaterialism, he says matter *doesn't exist*.

  6.  **Develop the Argument for Unity (The "Strongest Case"):**
      *   *The Common Enemy: Abstract Ideas.* Berkeley's early work (*Principles*, Introduction) attacks Locke's theory of abstract ideas. We can't conceive of "extension" without color, or "value" without a thing valued.
      *   *Application:*
          *   Metaphysics: We can't conceive of "Matter" apart from "Sensible Qualities." Matter is a useless abstraction.
          *   Economics: We can't conceive of "Wealth" apart from "Enjoyment/Labor." Gold is a useless abstraction of wealth.
      *   *Functionalism:* Both systems define entities by their *role* in a system, not their *substrate*.
          *   Apple = Bundle of sensations serving a purpose in God's order.
          *   Dollar = Ticket serving a purpose in the economic order.
      *   *The "Occult" Charge:* Berkeley hates "occult qualities" (hidden powers). Matter is an occult quality of physics. Intrinsic value in gold is an occult quality of economics.
      *   *Conclusion:* It is the same *habit of mind*, driven by his nominalism.

  7.  **Address the Friend's Objection Head-On:**
      *   Acknowledge the category difference (Metaphysics vs. Economics).
