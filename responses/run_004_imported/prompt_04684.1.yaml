  3.  **Deconstruct Berkeley's Monetary Theory (*The Querist*):**
      *   *Context:* Ireland's economic stagnation.
      *   *Target:* Mercantilism (Bullionism). The idea that wealth *is* gold/silver specie. Hoarding metal = national wealth.
      *   *Proposal:* Money is a "ticket" or "counter." It signifies power to claim labor/produce.
      *   *Key Move:* Money doesn't need intrinsic value (metal); it needs functional value (circulation/credit). Wealth is labor/consumption, not the metal token.

  4.  **Evaluate the Parallel (The User's Intuition):**
      *   *Similarity:* Both attack a "fetishization of substance."
      *   *Matter:* Invisible support for sensations -> Reject it.
      *   *Gold:* Intrinsic value support for money -> Reject it.
