          *   *Evidence:* 3/5 Compromise, Fugitive Slave Clause, 1808 Clause, Insurrection Clause.
          *   *Interpretive Method:* Intent/Context/Consequences. Look at what the framers *meant*, how it was *applied*, and the historical reality of 1787. The silence on "slavery" is a euphemism, not a prohibition.
