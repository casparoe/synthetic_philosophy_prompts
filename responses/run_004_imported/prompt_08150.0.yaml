answer: |-
  # The Covenant or the Charter? Adjudicating the Douglass-Garrison Split

  The transformation of Frederick Douglass from the fiercest critic of the Constitution to its most eloquent defender remains one of the most provocative pivots in American intellectual history. In 1850, speaking in Glasgow, Douglass declared the Constitution a "flagrant violation of the rights of man." By 1860, in his speech "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?", he called it a "glorious liberty document."

  This was not merely a change of political tactic; it was a fundamental shift in constitutional hermeneutics. On one side stood William Lloyd Garrison, arguing from historical intent and functional reality: the document was a pro-slavery compact. On the other stood Douglass (channeling Lysander Spooner and Gerrit Smith), arguing from textual strictness and legal presumption: the document was a charter of liberty.

  To adjudicate this debate is to ask a question that transcends the 19th century: Is the Constitution defined by the compromises of its creators, or by the principles of its text? While Garrison offers the superior *historical* diagnosis, Douglass offers the superior *constitutional* theory. Garrison was right about what the Founders did, but Douglass was right about what the law requires. In a republic governed by written law, Douglass's mature position is the only one that sustains the possibility of justice within the system.

  ### The Garrisonian Indictment: Intent and Context

  The Garrisonian argument is rooted in a form of historical realism. For Garrison, a legal document cannot be severed from the circumstances of its birth or the consequences of its application. When Garrison burned a copy of the Constitution in 1854, he was not burning paper; he was burning a contract he believed was morally void.

  The strength of the Garrisonian reading lies in its unflinching look at the "surrounding context" of 1787. The Constitution was drafted by a convention in which slaveholders held significant sway. To secure the union of the Southern states, specific concessions were made. Garrison pointed to the functional reality of three key clauses:
  1.  **The Three-Fifths Clause (Art. I, Sec. 2):** By counting enslaved people as three-fifths of a person for representation, the Constitution gave slave states disproportionate power in the House and the Electoral College, effectively allowing the "Slave Power" to dominate the federal government.
  2.  **The Fugitive Slave Clause (Art. IV, Sec. 2):** By mandating the return of "Person held to Service or Labour," the federal government became an enforcement arm of the slave system, nationalizing the property rights of masters.
  3.  **The Insurrection Clause (Art. I, Sec. 8):** By empowering Congress to call forth the militia to "suppress Insurrections," the Constitution authorized the use of federal force to put down slave rebellions.

  Garrison's interpretive principle is **Original Intent and Consequentialism**. He argued that the euphemisms ("other Persons," "Service or Labour") were not legal safeguards for liberty, but moral cowardice designed to hide the rot. If the *effect* of the document is to protect slavery, and the *intent* of the framers was to accommodate slavery, then the *text* is a lie. For Garrison, intellectual honesty demanded acknowledging that the Union was built on a "covenant with death." To vote under such a system was to be complicit in the sin.

  The Garrisonian view is historically robust. It aligns with the private correspondence of the framers and the political reality of the antebellum period, where the federal government consistently protected slaveholding interests. However, as a constitutional theory, it leads to a dead end: nihilism. If the text is irrevocably bound by the sinful intentions of its authors, the document offers no internal mechanism for reform. The only recourse is dissolution.

  ### The Douglassian Defense: Text and Presumption

  Douglass's mature argument, heavily influenced by the legal theories of Lysander Spooner, shifts the ground from history to jurisprudence. Spooner, the libertarian legal theorist, argued that laws must be interpreted according to strict rules of construction that favor liberty. Douglass adopted this, arguing that the Constitution must be read as a standalone legal text, not as a diary of the framers' private thoughts.

  The strength of the Douglassian reading lies in its **Textualism and the Presumption of Liberty**. Douglass noted that the words "slave" or "slavery" appear nowhere in the Constitution. This was not merely euphemism; Douglass argued it was a legal limitation.
  1.  **The Definition of "Person":** The Constitution refers to "Persons" and "People." In legal terms, a "person" is a rights-bearer. Property is a "thing." By refusing to classify enslaved people as property in the text, the Constitution left the door open to interpret them as persons entitled to due process.
  2.  **The Preamble as Telos:** Douglass argued that the Preamble ("secure the Blessings of Liberty") sets the purpose of the document. Specific clauses must be interpreted in light of this overarching goal. If a clause can be read two ways—one supporting slavery, one supporting liberty—the interpreter is legally bound to choose liberty.
  3.  **The Burden of Proof:** This is the crux of the Spooner/Douglass theory. In a free society, the power to oppress must be explicitly granted. If the Constitution does not *explicitly* authorize slavery, then slavery is a creature of state law, not federal law. The federal government has no constitutional mandate to support it.

  Douglass's interpretive principle is that **Silence is Not Sanction**. Just because the framers *hoped* the clauses would protect slavery doesn't mean the *law* requires it. Douglass argued that the Fugitive Slave Clause could be read to require due process hearings for the accused (which the 1850 Fugitive Slave Act denied). He argued the Three-Fifths Clause was actually a penalty on slave states, reducing their representation rather than a boon.

  This reading transforms the Constitution from a static contract of the past into a dynamic tool for the future. It treats the text as having a meaning independent of its authors' prejudices.

  ### The Verdict: Why Douglass Wins on Constitutional Reasoning

  To decide between these views, we must distinguish between *historical description* and *legal prescription*.

  Garrison was the better historian. He correctly identified that the Constitution was a political compromise that accommodated evil. His moral witness was necessary to shock the conscience of the North. However, as a constitutional theorist, Garrison failed. His method renders the rule of law impossible. If every generation must submit to the moral failings of the founders because "intent" binds the text, then no unjust law can ever be overturned through legal means. Garrison's approach makes the Constitution a tomb, not a framework.

  Douglass, conversely, offers the superior constitutional reasoning. His argument is not that the Founders were saints (he knew they were not), but that **a constitution is a law, and laws must be interpreted to maximize liberty unless they explicitly compel oppression.**

  There are three reasons Douglass's mature position is the better piece of constitutional reasoning:

  **1. The Necessity of Explicit Authorization**
  In a free society, the government possesses only delegated powers. Douglass correctly identified that for the federal government to uphold slavery, it needed explicit textual authority. The text provides none. It speaks of "Persons." It speaks of "Liberty." To read "slavery" into the text requires an extra-constitutional assumption. Douglass's rule of construction—that ambiguity should be resolved in favor of freedom—is the only interpretive method compatible with a republic founded on natural rights. Garrison's method assumes that ambiguity validates the status quo; Douglass correctly argues that ambiguity invalidates coercive power.

  **2. The Separation of Text from Intent**
  Constitutional governance requires that the text outlive the intentions of its drafters. If we are bound strictly by the framers' private expectations, the 14th Amendment (which Douglass later championed) would be impossible, as many of its drafters did not intend for it to allow interracial marriage or full social integration. Douglass anticipated this modern understanding of constitutional law: the text creates a structure of principles that can be used to correct the errors of the past. By separating the *words* from the *whispers* of the convention, Douglass saved the Constitution from being held hostage by 1787.

  **3. The Possibility of Redemption**
  Garrison's view demands that the system be destroyed to save the soul. Douglass's view demands that the system be used to save the people. History vindicated Douglass's utility. The political coalition he helped build (the Republican Party) used the very Constitution Garrison rejected to pass the 13th, 14th, and 15th Amendments. These amendments did not create a new country; they amended the existing text, fulfilling the "Blessings of Liberty" Douglass argued were always there. If Garrison were right, the Reconstruction Amendments would have been a revolution outside the law. Because Douglass was right, they were a fulfillment of the law.

  ### Conclusion

  Garrison was right that the Constitution was *tainted* by slavery. But Douglass was right that the Constitution was not *defined* by it.

  The verdict is this: **Douglass's mature position is the superior constitutional argument.** Garrison offered a moral critique of history, but Douglass offered a legal theory for the future. Garrison's "covenant with death" reading is intellectually honest regarding the past, but legally fatalistic regarding the future. It treats the Constitution as a mirror reflecting the sins of the founders. Douglass treated the Constitution as a sword that could be turned against those sins.

  In a rationalist framework, we must value the interpretive method that yields the best capacity for error correction. Garrison's method locks in the errors of 1787. Douglass's method provides the legal machinery to dismantle them. Douglass realized that to call the Constitution a "liberty document" was not to describe its history, but to command its future. He understood that in a democracy, the most honest reading of the law is the one that makes freedom possible. Garrison stood outside the gate and shouted that the house was burning. Douglass went inside, found the blueprints, and showed that the building was designed, if properly read, to put the fire out.

  For the purpose of constitutional reasoning—which is about how we govern ourselves under a written text—Douglass wins. He proved that the law is not merely what the powerful intended it to be, but what the text, read with courage, allows it to become.
