          *   *Evidence:* The words "slave" or "slavery" are absent. "Person" implies humanity/rights. The Preamble ("secure the Blessings of Liberty") sets the telos.
          *   *Interpretive Method:* Strict Textualism/Original Public Meaning (in a specific sense). If it doesn't say "slave," it doesn't authorize slavery. The burden of proof is on the oppressor to find explicit authorization.
          *   *Moral Stance:* Political engagement. Use the government to destroy slavery.

  3.  **Evaluate the Arguments (The Adjudication Phase):**

      *   *Historical Reality:* The framers *did* compromise. They protected slavery to get the South to join. Garrison is historically right about the *deal*.
