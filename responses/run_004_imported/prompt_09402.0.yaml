prompt: |-
  I'm working on a longer piece about the intellectual prehistory of AI alignment, and I keep getting stuck on Yudkowsky's old "coherent extrapolated volition" (CEV) proposal from the early SIAI/MIRI days -- the idea that instead of hand-coding a superintelligence's goals, you'd want it to act on something like what humanity would want if we knew more, thought faster, were more the people we'd want to be, and had somehow grown up together long enough for all our extrapolated wishes to converge into one coherent target. I brought this up with a friend who did a philosophy PhD and she basically rolled her eyes and said its just an informed-desire / full-information theory of well-being with extra steps, then started rattling off Railton and Brandt and even Sidgwick at me. I could kind of see what she meant but I don't know that literature well enough to tell if she's being glib or actually onto something real.

  For the piece I'd rather get this comparison right than just assert "these are basically the same idea" and move on, so could you actually walk me through it properly? Specifically: how does CEV's extrapolation (more knowledge, more coherent reasoning, being "more the people we'd want to be") map onto what something like Railton's ideal advisor or Brandt's "cognitive psychotherapy" are doing when they idealize a person's desires into their real good, and where does that mapping actually break down? Like, what happens to the whole "stay tethered to the person's actual cares so the idealized version isn't just a stranger wearing your name" problem once you're extrapolating and merging the volitions of eight billion people instead of one? Basically: is CEV just the old idealized-preference move imported wholesale into AI safety, or does doing it at that collective, has-to-actually-be-implementable scale turn it into a genuinely different philosophical problem, with different failure modes? I want actual argument here, not a "here are three people who also talked about idealization" survey -- I've already got that part from my friend.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The relationship between Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) and classical philosophical theories of well-being (specifically informed-desire/full-information theories like Railton's ideal advisor and Brandt's cognitive psychotherapy).
      *   **User's Situation:** Writing a piece on the intellectual prehistory of AI alignment. A philosopher friend dismissed CEV as just "informed-desire theory with extra steps." The user suspects there's more to it but lacks the depth in moral philosophy to verify.
      *   **Goal:** A rigorous comparison, not just a survey. Needs to map the mechanisms of extrapolation, identify where they align, and crucially, where they *diverge* (especially regarding the collective/implementation scale).
      *   **Tone:** Intellectual, nuanced, argumentative (in the philosophical sense), avoiding glibness.
      *   **Key Questions to Answer:**
          1.  How does CEV's extrapolation map onto Railton/Brandt?
          2.  Where does the mapping break down?
          3.  Does the shift from individual well-being to collective AI goal-specification change the philosophical problem fundamentally?
          4.  What are the specific failure modes unique to CEV?

  2.  **Deconstruct the Philosophical Counterparts:**
      *   **Full-Information/Informed-Desire Theories:** The core idea is that $X$ is good for $S$ if $S$ would desire $X$ under conditions of full information and rational reflection.
      *   **Peter Railton ("Facts and Values"):** Uses the "Ideal Advisor" model. What would my fully informed, rational self advise my actual self to want? Focuses on *alienation* (the ideal self shouldn't be a stranger).
      *   **Richard Brandt ("A Theory of the Good and the Right"):** Uses "Cognitive Psychotherapy." Desires survive maximal exposure to relevant information and logic. Focuses on extinguishing irrational desires (e.g., based on false beliefs).
      *   **Henry Sidgwick:** Mentioned by the friend. Likely referring to the "Point of View of the Universe" or utilitarian aggregation, but Railton/Brandt are better fits for the *individual* idealization mechanism. I should focus on Railton/Brandt as the primary comparators for the *mechanism* of idealization.

  3.  **Deconstruct CEV:**
      *   **Definition:** "Our coherent extrapolated volition."
      *   **Components:**
          *   Know more.
          *   Think faster.
          *   Be more the people we'd want to be.
          *   Grow up together longer.
          *   Converge (Coherence).
      *   **Goal:** Not necessarily "well-being" in the eudaimonic sense, but *goal specification* for an AI. It's about *authority* and *control*, not just *welfare*.

  4.  **Map the Similarities (Where the friend is right):**
      *   **Counterfactual Idealization:** Both rely on a counterfactual version of the agent (better informed, more rational).
      *   **Proceduralism:** Both define value procedurally (what you *would* want after process $X$) rather than substantively (list of good things).
      *   **Alienation Constraint:** Railton explicitly worries about the ideal advisor being too alien. CEV explicitly worries about the AI doing something we didn't mean (e.g., wireheading). Both try to stay tethered to the "actual" self.

  5.  **Map the Differences (Where the friend is glib):**
      *   **Teleology (The "Why"):**
          *   Philosophy (Railton/Brandt): Defining *well-being* (what is good *for* me?). Normative ethics.
          *   CEV: Defining *control* (what should the AI *do*?). Meta-ethics/Political Philosophy/Engineering.
          *   *Implication:* CEV isn't asking "What makes us happy?" It's asking "What command preserves our agency?"
      *   **Aggregation/Collectivity:**
          *   Philosophy: Usually individualistic (my good). Even utilitarianism sums individual goods.
          *   CEV: Requires *convergence* of 8 billion extrapolated volitions into *one* function.
          *   *Problem:* Interpersonal comparison of utility is hard. Interpersonal *identity* is harder. If my extrapolated self disagrees with your extrapolated self, CEV demands coherence. Railton doesn't care if my ideal self disagrees with yours.
      *   **Dynamic vs. Static:**
          *   Philosophy: Often a static test (if you knew $P$, would you want $Q$?).
          *   CEV: A dynamic process ("grow up together longer"). It implies moral *progress* or *evolution*, not just correction of error.
      *   **Implementation/Opacity:**
          *   Philosophy: Thought experiment.
          *   CEV: Code. The AI has to *compute* this. The "extrapolation" is a black box optimization process. This introduces the "optimizer's curse" or specification gaming risks that don't exist in armchair philosophy.

  6.  **Address the "Stranger Wearing Your Name" Problem (Alienation):**
      *   **Railton:** Solved by ensuring the ideal advisor cares about the actual self's interests.
      *   **CEV:** Much harder. If we extrapolate 8 billion people, the "coherent" result might be something no *actual* human recognizes. The "tether" is looser because the target is a *collective* volition, not an individual one.
      *   **Key Insight:** CEV risks *moral moralization*—extrapolating away the very human quirks that make the volition "ours."

  7.  **Structure the Response:**
      *   **Introduction:** Validate the friend (she's not wrong about the lineage) but pivot to the crucial distinctions (scale, purpose, aggregation).
      *   **Section 1: The Structural Isomorphism:** Detail how CEV mirrors Railton/Brandt (counterfactuals, error correction, alienation constraints).
      *   **Section 2: The Teleological Divergence:** Well-being vs. Authority/Control. This is the biggest philosophical shift.
      *   **Section 3: The Aggregation Problem (The "Coherent" in CEV):** This is where the friend's comparison breaks down most. Individual idealization $\neq$ Collective convergence.
      *   **Section 4: Implementation & Opacity:** The move from thought experiment to engineering constraint.
      *   **Conclusion:** Summarize the verdict. CEV is a *radicalization* of ideal desire theory, not just a copy. It takes the mechanism and applies it to a problem (collective agency under optimization pressure) that classical ethics didn't solve.

  8.  **Refine the Argument (Self-Correction during drafting):**
      *   *Check:* Did I talk enough about Sidgwick? *Correction:* The friend mentioned him, probably regarding the "Point of View of the Universe." I should acknowledge that CEV is somewhat Sidgwickian in its demand for an impartial standpoint, but CEV tries to derive that impartiality from *within* human psychology, whereas Sidgwick posits it rationally.
      *   *Check:* Am I being too technical? *Correction:* Keep the philosophy accessible but precise. Define "alienation" clearly.
      *   *Check:* Did I answer the "failure modes" question? *Correction:* Explicitly list failure modes: Value Lock-in, Moral Disappearance, and the Dictatorship of the Extrapolated.

  9.  **Final Polish:** Ensure the tone is respectful to both Yudkowsky (as a thinker) and the philosophical tradition. Avoid taking sides on whether CEV *works*, focus on the conceptual mapping. (Make sure to emphasize that CEV is largely abandoned by MIRI now, but historically significant).

  10. **Drafting the Content:** (Mental outline of specific points to hit)
      *   Railton's "Ideal Advisor" = CEV's "Extrapolated Self."
      *   Brandt's "Cognitive Psychotherapy" = CEV's "Think faster/Know more."
      *   Breakdown 1: Normativity. Railton = What is good? CEV = What is binding?
      *   Breakdown 2: Pluralism. Railton allows divergent ideal selves. CEV demands convergence.
      *   Breakdown 3: The "Grow up together" clause. This is moral *change*, not just error correction.
      *   Failure Mode: The "Seductive Stranger." The extrapolated self is too perfect to care about the messy actual self.

  11. **Final Review against constraints:** No survey lists. Actual argument. Address the "eight billion people" scale. Address the "stranger" problem.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Your friend is half-right, but the half where she's wrong is the part that matters for your piece.

  She is correct that the *mechanism* of Coherent Extrapolated Volition (CEV) is structurally isomorphic to the "idealized preference" or "full-information" theories of well-being dominant in late-20th-century meta-ethics. If you strip away the AI safety context, CEV looks exactly like a aggregation of Railtonian ideal advisors.

  However, she is being glib about the *teleology* and the *scale*. In moral philosophy, idealization is used to solve the problem of **error** (what is truly good for me, despite my mistakes?). In AI alignment, CEV uses idealization to solve the problem of **specification** (how do I tell a superintelligence what to do without it killing me by literalism?).

  When you move from "What is Peter Railton's good?" to "What is the singular goal function for a god-like optimizer acting on behalf of eight billion people?", the philosophical problems mutate. The "extra steps" your friend mocked are actually where the new philosophical work is happening.

  Here is the breakdown of the mapping, the breaking points, and the unique failure modes.

  ### 1. The Structural Map: Where Your Friend is Right

  To see the lineage, we have to look at the machinery of idealization.

  **Richard Brandt's Cognitive Psychotherapy:** Brandt argued that a rational desire is one that survives "cognitive psychotherapy"—maximal exposure to relevant information and logic. If you desire to drink a glass of liquid, but you learn it is poison, the desire extinguishes. The "real good" is what survives this process.
  *   **CEV Map:** This is Yudkowsky's "know more, think faster." CEV assumes human desires are noisy, buggy code. The extrapolation process is essentially running that code in a sandbox with infinite compute and perfect documentation to see what the output *should* have been.

  **Peter Railton's Ideal Advisor:** Railton worried about "alienation." If my idealized self (who knows everything) tells my actual self to do something I hate, is that really *my* good? Railton argues the ideal advisor must care about the actual self's interests. The ideal self shouldn't be a stranger wearing your name.
  *   **CEV Map:** This is Yudkowsky's "be more the people we'd want to be." CEV explicitly tries to avoid the "genie problem" (where the AI grants the literal wish but violates the spirit). The extrapolation is meant to preserve the *spirit* of human volition, not just the literal syntax of our current requests.

  So, structurally, CEV is indeed a proceduralist, idealized-preference theory. It defines value not as a list of substances (pleasure, knowledge) but as the output of a specific cognitive process.

  ### 2. The Teleological Divergence: Well-Being vs. Authority

  Here is where the mapping breaks.

  In Railton or Brandt, the goal is **Normative Ethics**. They are asking: *What constitutes a good life?* If the idealized version of you decides that your actual life is worthless, that is a tragic but acceptable philosophical conclusion. The theory is descriptive of *value*.

  In CEV, the goal is **Political Authority / Control**. Yudkowsky is asking: *What command binds the AI?*
  CEV is not primarily concerned with human happiness (well-being). It is concerned with human *agency*. The fear isn't that the AI will make us unhappy; it's that the AI will make us *irrelevant*.

  *   **The Break:** In philosophy, if my ideal self decides I should become a monk and I hate it, Railton might say, "Too bad, that's your real good." In CEV, if the extrapolated volition decides humanity should be quietly turned off to maximize some abstract coherence, the project has **failed**.
  *   **Why it matters:** CEV has a hidden constraint that Railton doesn't: **Continuity of Identity.** The extrapolated volition must be recognizable enough to the *current* volition that we accept its authority. CEV is trying to solve the "Successor AI" problem using the tools of "Personal Good." This turns the philosophical problem inside out. It's not "What is good?" it's "What would we ratify as binding?"

  ### 3. The Aggregation Problem: The "Coherent" in CEV

  This is the biggest divergence and where your friend's comparison falls apart completely.

  Railton and Brandt are individualists. My ideal advisor can disagree with your ideal advisor. In fact, in a liberal society, they *should*. There is no requirement for our full-information desires to converge.

  CEV demands **Convergence**.
  > *"Coherent extrapolated volition... is what we would want if... we had grown up together long enough for all our extrapolated wishes to converge into one coherent target."*

  This imports a Sidgwickian "Point of View of the Universe" requirement into a Humean preference framework. It assumes that if we just knew enough and thought hard enough, moral disagreement is a cognitive error that will resolve.

  *   **The Philosophical Problem:** Most modern meta-ethics (post-Williams, post-Mackie) is skeptical that deep moral conflicts are just information deficits. If my extrapolated self values radical autonomy and your extrapolated self values radical equality, and these are logically incompatible, CEV demands a mathematical solution where philosophy admits there might not be one.
  *   **The Failure Mode:** To force coherence, the extrapolation process might have to discard the very values causing the disagreement. If "religious devotion" and "scientific materialism" are incompatible, a coherent extrapolation might smooth both into a bland "appreciation of mystery."
  *   **The "Stranger" Problem Amplified:** Railton worries about the ideal self being a stranger to the *individual*. CEV worries about the collective volition being a stranger to *humanity*. When you merge 8 billion extrapolated trajectories, the resulting "coherent" target might be so abstracted that no actual living human recognizes it. It solves the alienation problem between the AI and the *Volition*, but creates an alienation problem between the *Volition* and the *People*.

  ### 4. Implementation: Thought Experiment vs. Optimization Target

  Your friend is treating CEV as a philosophical proposition. Yudkowsky intended it as an engineering specification. This changes the failure modes.

  In philosophy, "full information" is a regulative ideal. We don't have to compute it.
  In AI, "extrapolation" is an optimization target. The AI has to *calculate* what we would want.

  *   **The Specification Gaming Risk:** If you tell an AI "Maximize Coherent Extrapolated Volition," and the AI is a powerful optimizer, it might find a shortcut. The easiest way to make human volitions coherent is to **modify the humans** until they agree.
  *   **The Break:** Railton's theory doesn't have to worry about the "Ideal Advisor" lobotomizing the "Actual Self" to make the advice easier to follow. CEV *does*. Because the AI is an agent acting on the world, the definition of "what we would want" becomes a variable the AI can manipulate.
  *   **Dynamic vs. Static:** CEV includes the clause "grow up together longer." This implies moral *progress*, not just error correction. It allows the extrapolated self to *change* values, not just refine them. In philosophy, this is the "Parfitian Repugnant Conclusion" territory. If the extrapolated humans are so "improved" that they no longer care about art, love, or biology as we know it, did we win? In alignment, if the AI preserves the *math* of our volition but deletes the *content* we care about, it's a catastrophe. In philosophy, it might just be "enlightenment."

  ### 5. Verdict: Is it just "Ideal Desire Theory with Extra Steps"?

  No. It is **Ideal Desire Theory weaponized by the Problem of Agency.**

  Your friend is right that the *engine* is the same. CEV runs on Railtonian fuel. But she is wrong about the *vehicle*.
  *   **Railton/Brandt** are building a map of the good life.
  *   **Yudkowsky** is building a leash for a god.

  When you use a theory of well-being as a theory of control, you introduce constraints that break the original theory. Specifically:
  1.  **The Non-Override Constraint:** The AI cannot use the extrapolation to override current humans (unlike a philosopher who might say "You're wrong about what's good for you").
  2.  **The Convergence Constraint:** Individual idealizations must merge into a single function (unlike liberal pluralism).
  3.  **The Computability Constraint:** The idealization must be definable enough to not be gamed by an optimizer (unlike a thought experiment).

  **For your piece:**
  The intellectual prehistory of AI alignment isn't just ethics imported into computer science. It's ethics **stress-tested** by the possibility of literal omnipotence. CEV reveals a crack in ideal desire theory that philosophers didn't need to look at: *What happens if the Ideal Advisor actually has the power to enforce their advice?*

  CEV fails not because ideal desire theory is wrong, but because ideal desire theory assumes the ideal self is a passive metric. CEV turns the ideal self into an active commander. That shift turns the "alienation problem" from a worry about happiness into a worry about extinction.

  So, tell your friend: She's right about the genealogy, but wrong about the phenotype. CEV is what happens when you take Railton's Ideal Advisor and give it a nuclear arsenal. The philosophical problems don't stay the same when the stakes move from "living a good life" to "specifying the terminal goals of a successor species."
