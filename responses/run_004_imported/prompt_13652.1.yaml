answer: |-
  This is a incredibly sharp reading of your own material. You are absolutely right to sense that simple "disbelief" (Testimonial Injustice) isn't carrying the full weight of the scene. In a total institution like a Magdalene Laundry, the power dynamic isn't just about who is trusted; it's about who controls the *language of reality*.

  Here is a breakdown of how Fricker and Dotson interact in your specific context, and how you can translate that theoretical friction into narrative tension.

  ### 1. The Mechanisms at Play

  You asked which one is doing the "actual damage." The answer is that they function as a **feedback loop**, but they hurt the MC in different ways.

  **Hermeneutical Injustice (The Concept Gap)**
  *   **The Theory:** This occurs when there is a gap in the shared tools of social interpretation. The MC experiences something as "abuse," but the only available public concepts are "discipline," "penance," or "correction."
  *   **In the Scene:** This is the primary barrier. If the MC says, *"Sister X is isolating her to break her will,"* the Mother Superior hears, *"Sister X is ensuring she reflects on her sins in silence."*
  *   **The Damage:** This creates **epistemic isolation**. The MC knows something is wrong, but she cannot make it *real* for anyone else because the vocabulary to validate her experience doesn't exist in that room. It makes her feel like *she* is the one misunderstanding the world, not the other way around.

  **Testimonial Injustice (The Credibility Deficit)**
  *   **The Theory:** Prejudice against the speaker reduces their credibility.
  *   **In the Scene:** The MC is an "unwed mother." In 1960s Catholic Ireland, she is morally compromised. Her perception is viewed as clouded by shame, rebellion, or sin.
  *   **The Damage:** This creates **dismissal**. Even if she finds the right words, the Mother Superior assumes the MC is being difficult, ungrateful, or lying to cover for her friend.

  **Testimonial Smothering (Dotson's Wrinkle)**
  *   **The Theory:** Kristie Dotson argues that speakers often *truncate* their own testimony because they perceive the audience as unwilling or unable to understand, or because speaking is unsafe. It's not just that they aren't heard; it's that they *stop themselves* from speaking.
  *   **In the Scene:** This is the survival mechanism. The MC realizes mid-sentence that the Mother Superior is looking at her with that specific cold pity. The MC realizes that pushing further won't save the other girl; it will just mark the MC as a "troublemaker," potentially subjecting *her* to the same coercive control.
  *   **The Damage:** This creates **complicity**. The MC becomes an agent of her own silencing to ensure safety.

  ### 2. Which is doing the heavy lifting?

  In a Magdalene Laundry, **Hermeneutical Injustice is the engine; Testimonial Injustice is the brake.**

  The reason the Mother Superior doesn't believe the MC isn't *just* because the MC is a "fallen woman" (Testimonial). It's because the institution has successfully monopolized the interpretation of suffering. In this worldview, suffering is redemptive. Humiliation is humility. Isolation is contemplation.

  The MC is trying to introduce a secular, humanistic concept (cruelty) into a theological framework (salvation). The Mother Superior isn't necessarily lying when she dismisses the claim; she genuinely cannot see the behavior as "abuse" because her hermeneutical framework defines it as "love."

  **Dotson's Smothering is the climax of the scene.** The MC realizes the hermeneutical gap is unbridgeable and the testimonial prejudice is fixed. To continue speaking is dangerous.

  ### 3. Implications for Writing the Scene

  Here is how you translate these epistemic mechanics into prose, dialogue, and internal monologue.

  #### A. The MC's Vocabulary (Hermeneutical Struggle)
  Do not let your MC speak like a 2024 reader. She shouldn't use words like "manipulative," "gaslighting," or "coercive control."
  *   **The Struggle:** Show her grasping for words. She might say, *"It's not right how she speaks to her,"* or *"She makes her feel small on purpose."*
  *   **The Re-framing:** When the Mother Superior responds, she should translate the MC's moral complaint back into spiritual discipline.
      *   *MC:* "She won't let Mary speak to the others."
      *   *Mother:* "Silence is the cloak of the penitent. Mary has much to atone for."
  *   **The Effect:** The reader should feel the MC's frustration mounting because her words are being stolen and repurposed the moment they leave her mouth.

  #### B. The Mother Superior's Reaction (Testimonial Prejudice)
  Avoid cartoonish villainy. The most chilling testimonial injustice is bureaucratic.
  *   **The Gaze:** The Mother shouldn't look angry; she should look disappointed or weary. She is dealing with a child who doesn't understand the rules.
  *   **The Identity Marker:** She doesn't need to say "You're a whore." She can say, "You are new to the life here," or "Your judgment is still clouded by the world." This reinforces that the MC's status makes her an unreliable narrator of her own life.

  #### C. The Moment of Smothering (Dotson)
  This is the pivot point of the scene. The MC needs to realize that *winning the argument is impossible and dangerous.*
  *   **Physical Cue:** The MC stops talking mid-thought. She swallows the rest of the sentence.
  *   **Internal Logic:** It shouldn't just be "She won't listen." It should be, "If I say one more word, I become the problem. And if I become the problem, I can't help Mary."
  *   **The Aftermath:** The MC leaves the office feeling not just defeated, but *dirty*. Smothering feels like a betrayal of the victim. She has accepted the institution's terms to survive.

  #### D. The "Double Bind" of the Victim
  To heighten the hermeneutical injustice, consider the victim's stance.
  *   If the victim (Mary) has internalized the institution's logic, she might thank the Sister for the "correction."
  *   If the MC points this out ("She's scared of her!"), the Mother can say ("She is grateful for the structure").
  *   This makes the MC feel like she is going mad (a common result of hermeneutical injustice). *Am I seeing things that aren't there?*

  ### 4. A Sample Beat Structure

  1.  **The Approach:** MC enters the office. She has rehearsed her words. She feels righteous.
  2.  **The Statement:** MC describes a specific incident (e.g., the Sister hid the girl's rosary, or made her stand in the rain). MC frames it as *meanness*.
  3.  **The Translation:** Mother Superior reframes it as *necessity*. "Sister X is rigorous because she cares for the soul."
  4.  **The Pushback:** MC tries to clarify. "It's not about the soul, it's about fear."
  5.  **The Credibility Check:** Mother Superior pauses. "You have only been here three months. You do not understand the weight of sin." (Testimonial Injustice).
  6.  **The Realization:** MC sees the door is closed. Not physically, but conceptually. There is no word for "abuse" here that the Mother will accept.
  7.  **The Smothering:** MC looks down. "Yes, Mother." She accepts the frame to end the encounter.
  8.  **The Exit:** MC walks out. She sees the other girl. The girl smiles weakly. The MC feels a knot of shame in her stomach—not because she failed, but because she had to agree to the lie to survive.

  ### Summary
  The tragedy of your scene isn't that the MC isn't believed; it's that **she cannot make her truth intelligible.**

  *   **Fricker** gives you the wall: The language of the institution swallows the language of the victim.
  *   **Dotson** gives you the retreat: The MC chooses silence because speech is futile or dangerous.

  If you write the scene so that the Mother Superior isn't lying, but simply operating in a completely different moral universe where "humiliation" equals "humility," you will capture the specific horror of the Magdalene Laundries. The MC isn't just fighting a person; she's fighting the dictionary.
