answer: |-
  This is an exceptionally sharp reading of the *Treatise*. You have identified the precise friction point between Hume's naturalistic genealogy of norms and the rationalist reconstruction of convention initiated by David Lewis and formalized by epistemic game theorists like Aumann, Brandenburger, and Skyrms.

  Your intuition is correct: Hume's "gradual" mechanism does not deliver **Common Knowledge (CK)** in the strict, infinite-hierarchy sense required by Lewisian convention or Aumann's agreement theorem. Instead, Hume is describing a process of **belief convergence** via induction and learning. To treat this as a "gap" in Hume is to impose a rationalist standard of justification on a naturalist project of explanation.

  Here is a reconstruction of the epistemic structure Hume is assuming, how it maps onto modern game theory, and why the Lewisian appeal to CK is arguably an "add-on" that Hume's specific project does not need.

  ### 1. Hume's Epistemology: Probability, Not Logic
  First, we must recall Hume's broader epistemological commitments in Book I. For Hume, "knowledge" (in the strict sense of relations of ideas) is distinct from "probability" (matters of fact). When Hume says the interest is "known to both" in the context of justice, he is not invoking logical certainty or the infinite recursion of epistemic logic ($K_i K_j K_i \dots p$). He is invoking **moral certainty** derived from custom and habit.

  When Hume writes that the convention "arises gradually" through "repeated experience," he is describing a **learning process**. The epistemic state is not a static precondition for the convention (as it is in Lewis); it is the *output* of a historical process.
  *   **Time 1:** I suspect you might respect my possession.
  *   **Time 2:** You do. I update my belief.
  *   **Time $n$:** After sufficient iterations, my belief that you will cooperate approaches probability 1.

  In modern terms, this is **fictitious play** or **belief learning**. The agents do not need common knowledge of rationality to start; they need only a memory of past payoffs and a disposition to maximize utility based on empirical regularities.

  ### 2. Common Knowledge vs. High-Order Belief
  You ask whether Hume delivers strict CK or merely high-order finite mutual knowledge. The answer is likely the latter, but with a crucial caveat: **For Hume, the limit is psychological, not logical.**

  In epistemic game theory (e.g., Rubinstein's Email Game), we know that without strict CK, coordination can unravel. However, Hume is insulated from this vulnerability because his convention is **dynamic**, not static.
  *   **Lewis/Static:** We are in a coordination game *now*. To solve it without communication, we need CK of the salient solution.
  *   **Hume/Dynamic:** We are in an iterated game. The "solution" is discovered through trial and error.

  Hume's "confidence of the future regularity" is an inductive expectation. It functions *as if* it were common knowledge because the probability is so high that the risk of deviation is negligible. But strictly speaking, it is a **high-order finite belief** reinforced by history. If you press Hume on whether I know that you know that I know... ad infinitum, he would likely reply that the mind cannot grasp the infinite hierarchy, but the *feeling* of certainty is sufficient to induce action.

  This aligns with modern critiques of CK (e.g., by Ken Binmore or Ariel Rubinstein) which argue that strict CK is too strong a condition for real-world agents. Hume anticipates this by grounding the epistemic state in **psychological habit** rather than **logical necessity**.

  ### 3. Better Reconstructions: ESS and Correlated Equilibrium
  You suggest reconstructing Humean convention as a Correlated Equilibrium (CE) or an Evolutionarily Stable Strategy (ESS). Both are superior to the Lewisian CK model for capturing Hume's text.

  **A. Evolutionary Stability (ESS)**
  This is the strongest fit for the "gradual" and "repeated experience" language.
  *   **Mechanism:** Strategies that yield higher payoffs (stability of possession) proliferate; those that yield "inconveniences" (theft, conflict) die out.
  *   **Epistemic Load:** Zero. Agents need no knowledge of the other's mind, only a disposition to imitate success or a biological/cultural selection pressure.
  *   **Humean Fit:** Hume often speaks of conventions as arising "without the interposition of a promise." This sounds like spontaneous order. The "sense of interest" is not a conscious calculation shared between minds, but a structural feature of the environment that selects for certain behaviors. Brian Skyrms (*The Evolution of the Social Contract*) explicitly uses Hume to motivate this evolutionary approach over the Lewisian rationalist one.

  **B. Correlated Equilibrium (CE)**
  In a CE, players observe a public signal that correlates their strategies.
  *   **The Signal:** For Hume, the "general sense of common interest" acts as the correlating device. It is a focal point (Schelling) created by the shared human condition.
  *   **Epistemic Load:** Lower than Nash/CK. Players need to know the signal and trust the correlation, but they do not need infinite recursion of knowledge about each other's rationality.
  *   **Humean Fit:** The rowing example is a classic coordination game. The rhythm of the boat acts as the public signal. Once the rhythm is established (gradually), it correlates their actions.

  ### 4. Lewis vs. Hume: Justification vs. Genealogy
  Is the appeal to CK in later accounts an add-on? **Yes.** But it is an add-on necessitated by a different philosophical goal.

  *   **Hume's Goal (Genealogy):** How did justice *actually* emerge from a pre-social state? He needs a causal mechanism. "Gradual experience" is a causal mechanism. CK is not a causal mechanism; it is a logical state. Hume doesn't need CK because he isn't trying to prove that justice is *rationally binding* in a single shot; he is explaining how it became *psychologically compelling* over time.
  *   **Lewis's Goal (Justification/Stability):** How can we characterize a convention such that it is rational to follow it *given that others follow it*? Lewis needs CK to ensure that the equilibrium is **self-enforcing** without external authority. If I don't know that you know that I know the rule, I might fear you will deviate, leading me to deviate. Lewis adds CK to solve the stability problem that Hume glosses over with "custom."

  Hume relies on **custom** to do the work that **logic** does for Lewis. For Hume, the "gap" in the epistemic hierarchy is filled by the inertia of habit. I don't need to know that you know I know; I just need to be *habituated* to expect you to act thusly.

  ### 5. Verdict: Gap or Vocabulary Difference?
  It is not a genuine gap in Hume's argument, provided we accept his naturalistic premises. It is a **category error** to judge Hume's genealogical account by the standards of epistemic logic.

  *   **If you treat Hume as a game theorist:** He is an **evolutionary game theorist** or a **learning theorist**. In these frameworks, CK is not required for convergence to equilibrium. Convergence happens through updating beliefs based on history.
  *   **If you treat Hume as a rationalist:** He fails, because he cannot ground the normativity of justice in a single moment of rational insight.

  **Recommendation for your seminar response:**
  Argue that Hume's "mutually expressed... and known" should be read as **intersubjective alignment achieved through learning**, not **common knowledge achieved through deduction**.
  1.  **Reject the CK requirement:** Show that Hume's "gradualism" is actually a strength, avoiding the fragility of CK (the Rubinstein problem).
  2.  **Propose the Evolutionary/Learning Model:** Suggest that Hume's "repeated experience" is best modeled as fictitious play or evolutionary selection (Skyrms).
  3.  **Reframe Lewis:** Argue that Lewis formalized the *end-state* of Hume's process. Lewis asks, "What does the epistemic landscape look like *after* the convention is established?" Hume asks, "How did we climb the mountain?"
  4.  **Conclusion:** The "knowledge" Hume refers to is **probabilistic confidence** born of induction. It is sufficient for action (which is all Hume cares about) even if it falls short of the logical limit required for formal equilibrium selection.

  This allows you to honor the sophistication of Hume's naturalism while demonstrating command of the modern epistemic literature. You aren't fixing Hume; you're showing that modern game theory has finally caught up to his insight that conventions are dynamic processes, not static logical states.
