      *   **Chalmers' Point:** Zombies are *positively* conceivable. Unlike the water case, there is no "reference-fixing" gap. When we conceive of a zombie, we are conceiving of the *actual* physical processes without consciousness. There is no "hidden essence" of consciousness that turns out to be identical to a physical state in the same way H2O is the essence of water.
      *   **The Key Distinction:** Primary vs. Secondary Intensions (or Epistemic vs. Metaphysical possibility). Chalmers explicitly addresses the Kripkean objection in *The Conscious Mind*.

