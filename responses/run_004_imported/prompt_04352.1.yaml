          *   **Crucial Difference:** In the water case, "Water" is a rigid designator fixed by contingent properties. In the consciousness case, "Consciousness" is not fixed by contingent properties; it is picked out directly by experience.
          *   There is no "hidden essence" of consciousness. When I feel pain, the appearance *is* the reality.
          *   Therefore, when we conceive of a physical duplicate without consciousness, we aren't making a reference mistake. We are conceiving of the actual properties (physical) without the actual property (phenomenal).
      *   **Introduce Technical Terms (Gently):**
