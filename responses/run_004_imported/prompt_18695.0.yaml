answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I'm currently finishing a PhD in the History and Philosophy of Science. Which, in this family, is just a fancy way of saying I'm the one who reads the footnotes.

  When I was asked to speak tonight, I was given a very specific set of instructions. They came with a warning label. I was told that if I stand here and praise my mother's "hard work," her "tireless dedication," or suggest that her "legacy will live on" through the thousands of students she's taught, I should expect to be quietly disowned before dessert.

  Now, to most of you, that might sound like standard humility. But for the three or four people in the room who remember her Master's thesis from the 80s, you know this is actually a matter of philosophical consistency.

  My mother wrote her thesis on Moritz Schlick's essay *The Meaning of Life*. Schlick, a founding figure of the Vienna Circle, argued that the great tragedy of adulthood is that we lose the capacity for "play." He didn't mean games or sports. He meant activities that are justified simply by doing them, rather than by what they get us.

  Schlick argued that "work" is purposive. We work to get money, to get status, to get to retirement. It is a means to an end. And if you live your life purely as a means to an end, you never actually *live* in the present. You are always waiting for the next thing. You are always sacrificing the now for the later.

  So, to praise my mother for "working hard" for 35 years would be to misunderstand the point of her career entirely. It would suggest she was enduring the classroom to get to this dinner.

  The truth is, she didn't treat teaching as work. She treated it as Schlick's ideal of meaningful activity. She didn't teach history or science so you would get good grades or go to college. Those are future payoffs. She taught because the act of exploring ideas with young people was, in itself, worth doing.

  I watched her in the classroom. The meaning wasn't in the graduation rate. It was in the moment a confusing concept suddenly clicked. It was in the debate that ran five minutes over the bell because everyone was too interested to stop. It was in the curiosity itself.

  For 35 years, she managed to do something that Schlick thought most adults lose: she kept the capacity to find joy in the activity of the present moment, rather than the promise of a future reward. She didn't sacrifice her life for her students; she shared her life *with* her students.

  To the former students here: You aren't her legacy. A legacy is something you leave behind for the future. You were her companions in the present. The value wasn't what you became later; the value was who you were together in that room, right then.

  And to the colleagues here: We all know the system tries to turn teaching into data points and outcomes. She resisted that. Not out of stubbornness, but out of a philosophical commitment to the idea that education is an end in itself.

  So, I am not going to toast to her rest after a long labor. I am not going to toast to her impact on the future.

  I am going to toast to the activity itself.

  Mom, you proved that you can spend a lifetime doing something without ever treating it as a means to an end. You kept the "play" alive. And as you move into this next chapter, my wish for you is not that you find rest from your labors, but that you continue to find more things that are worth doing simply because they are worth doing.

  To the present moment. And to my mother.
