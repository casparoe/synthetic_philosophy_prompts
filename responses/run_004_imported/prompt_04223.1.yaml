  10. **Self-Correction during drafting:** I need to be careful not to dismiss the retreat as a cult. Many are legitimate. The point is the *epistemic status* of the belief, not the validity of the retreat itself. Keep it neutral on the truth of the claims, focus on the justification for belief.

