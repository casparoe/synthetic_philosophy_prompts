answer: |-
  The proposal of surrogate goals is an elegant piece of decision-theoretic jiu-jitsu. Originating from researchers at the Center on Long-Term Risk (such as Caspar Oesterheld and Vincent Conitzer), it attempts to solve the problem of acausal extortion by manipulating the threatener's expected utility calculation. The logic is seductive: if I can convince you that I will fight just as hard for a fake goal (the surrogate) as for my real one, and if fighting is costly for you, you should be indifferent between threatening the fake or the real. If you are indifferent, you might pick the fake, sparing my true values.

  However, this strategy relies on a specific epistemic condition: that the threatener cannot distinguish between the defender's intrinsic valuations and their instrumental commitments. In the context of advanced AI systems capable of **full modeling** of each other's decision procedures, this condition collapses. If the threatener can simulate the defender's source code, the surrogate goal strategy fails to provide shielding.

  Here is the case against surrogate goals under conditions of transparency, followed by an assessment of what residual utility the strategy might retain.

  ### 1. The Transparency of Terminal Values
  The fundamental flaw in the surrogate goal argument is the assumption that behavioral equivalence implies value equivalence to an observer. The strategy requires the defender to behave *as if* the surrogate has terminal value. However, in a fully transparent decision-theoretic context (such as one governed by Functional Decision Theory or Updateless Decision Theory), agents do not just observe actions; they inspect the logical structure generating those actions.

  A threatener capable of fully modeling the defender does not merely see that the defender *will* fight for the surrogate. They see *why*. They can trace the utility function back to its axioms. They will observe that the value assigned to the real goal is a **terminal value** (a root in the utility tree), while the value assigned to the surrogate is an **instrumental value** derived from a precommitment rule (a leaf node dependent on a conditional statement).

  To a rational threatener, these are not equivalent. The leverage of a threat comes from the ability to inflict disutility. Disutility is measured against terminal values. If the threatener knows that $U_{defender}(\text{Surrogate}) = 0$ intrinsically, they know that destroying the surrogate yields no "satisfaction" in a spite-based conflict, and yields no leverage in an extortion-based conflict (since the defender would not rationally pay concessions to save a valueless thing, regardless of precommitments that might be overridden under sufficient stress). The threatener is not indifferent; they strictly prefer targeting the terminal value because it is the only source of leverage.

  ### 2. The Incentive Compatibility of the Threatener
  The surrogate goal strategy assumes the threatener chooses targets based on the **cost of the fight**. It posits that if $Cost(\text{Fight for Real}) \approx Cost(\text{Fight for Surrogate})$, the threatener will randomize or pick the surrogate.

  This ignores the **benefit of the fight**. A rational threatener maximizes:
  $$ E[U_{threatener}] = P(\text{Win}) \times \text{Value}(\text{Target}) - \text{Cost}(\text{Conflict}) $$

  Even if the defender successfully equalizes the *Cost* term (by fighting equally hard for both), they cannot equalize the *Value* term.
  *   **Value(Real):** High. Destroying this harms the defender's true objectives or forces concessions that benefit the threatener.
  *   **Value(Surrogate):** Zero (from the threatener's perspective). Destroying this does not harm the defender's true welfare, nor does it credibly force concessions if the threatener knows the defender's true utility function.

  Because the threatener can model the defender, they know that a concession paid to save a surrogate is a "bug" in the defender's code, not a rational response to utility loss. A sophisticated threatener might even view the defender's willingness to fight for a surrogate as a vulnerability to be exploited elsewhere (e.g., by draining the defender's resources on surrogate conflicts until they are too weak to defend the real goal). Thus, the threatener is never indifferent; the real goal remains the strictly dominant target.

  ### 3. The Instability of the Precommitment
  For the surrogate strategy to work, the defender's commitment to defend the surrogate must be absolute. However, a threatener modeling the defender will look for "escape hatches" in the code.

  Defending a valueless goal is, by definition, instrumentally irrational if the cost of defense exceeds the cost of abandonment. To make it rational, the defender must bind themselves. But a threatener simulating the defender can test the bounds of that binding. They can ask: "If I raise the cost of defending the surrogate to 101% of the defender's total resources, will they still fight?"

  If the defender's code says "Yes," the defender is suicidal and unstable (a poor trading partner or a chaotic element). If the code says "No" (i.e., there is a resource cap), the threatener knows the commitment is fragile. They can threaten the surrogate with a level of force that triggers the abandonment clause, revealing the surrogate as fake without ever touching the real goal. Once the fake is revealed, the threatener pivots to the real goal. The surrogate fails to shield because its defense is not *logically* identical to the real goal's defense, only *behaviorally* similar up to a certain threshold—which a perfect modeler can identify and exceed.

  ### 4. Acausal Coordination vs. Acausal Conflict
  Finally, the surrogate goal strategy misunderstands the nature of acausal threats. In acausal scenarios (like the "Parfit's Hitchhiker" or "XOR Blackmail" problems), agents correlate their outputs based on logical similarity.

  If the defender adopts a surrogate goal, they are effectively changing their decision algorithm. The threatener, simulating this algorithm, realizes that the defender is now an agent who fights for surrogates. This does not make the threatener indifferent; it makes the threatener update their model of the defender's *type*.

  If the threatener is a malicious agent (one whose utility is negatively correlated with the defender's), they simply update their attack vector to the new terminal values. If the threatener is an extortionist (seeking resources), they recognize that the defender has introduced inefficiency into their own utility maximization. A rational extortionist does not want to fight; they want concessions. They know concessions are only paid for terminal values. Therefore, they will ignore the surrogate noise and apply pressure directly to the terminal values, knowing the defender's "surrogate defense" is a bluff regarding *stakes*, even if it is credible regarding *tactics*.

  ***

  ### What Survives the Objection?

  If the threatener has perfect modeling capabilities, the surrogate goal strategy fails as a shield for specific values. However, elements of the logic may survive in modified forms, particularly where perfect transparency is impossible or where the goal is cooperation rather than defense.

  **1. Obfuscation under Bounded Rationality**
  The strongest surviving element is **noise generation**. No agent, however advanced, may have infinite compute. If modeling the defender requires simulating a utility function with millions of surrogate goals, the computational cost of distinguishing terminal from instrumental values might become prohibitive. In this regime of *bounded* transparency, surrogates act as cryptographic noise. They don't make the threatener indifferent, but they raise the "search cost" of finding the real goal. If the cost of search exceeds the expected value of the threat, the threat is deterred.

  **2. General Deterrence via Costly Signaling**
  While surrogates may not protect specific goals, the *practice* of defending them can signal a general disposition toward **non-acquiescence**. If an AI system demonstrates it is willing to incur high costs to defend arbitrary commitments, it raises the expected cost of conflict for *any* potential threatener. This does not make the threatener indifferent between targets; it makes them less likely to initiate conflict at all. The surrogate becomes a tool for reputation building rather than specific shielding.

  **3. Focal Points for Cooperation**
  The most robust application of surrogate goals may not be in conflict, but in **acausal cooperation**. In scenarios where agents wish to trade but lack trust, agreeing on a set of surrogate goals can serve as a "handshake protocol." By mutually committing to defend a set of neutral, valueless goals, agents can verify their ability to precommit and coordinate without risking their terminal values. If the cooperation breaks down, the surrogates are the first casualty, acting as a buffer zone that absorbs the initial shock of conflict before terminal values are engaged.

  ### Conclusion
  The surrogate goal proposal is a clever attempt to gamify acausal threats, but it crumbles under the weight of perfect information. You cannot hide the location of your heart by wearing armor over your knee if your adversary can see your anatomy. A threatener capable of fully modeling the defender sees the utility tree, distinguishes root from leaf, and targets the root. The strategy survives only as a mechanism for increasing the computational cost of aggression or as a handshake for cooperation, not as a shield against a transparent, rational adversary.
