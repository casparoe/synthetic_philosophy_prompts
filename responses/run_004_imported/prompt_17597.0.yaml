  **DIOCESE OF RADOM**
  **COMMISSION FOR THE CAUSES OF SAINTS**
  **CONFIDENTIAL MEMORANDUM**

  **TO:** The Consultors of the Diocesan Commission
  **FROM:** Fr. Tomasz Nowak, J.C.D., Chair
  **DATE:** 14 October 2023
  **SUBJECT:** Recommendation Regarding the *Positio* of Sister Agnieszka Radomska

  **1. PURPOSE**

  This memo serves as my formal recommendation regarding the disposition of the cause of Sister Agnieszka Radomska (Servant of God) following the recovery of the convent correspondence dated 1942–1944. We meet tomorrow to vote on whether to forward the *positio* to the Congregation for the Causes of Saints, to suspend the cause pending theological review, or to reframe the historical record.

  **2. THE EVIDENTIARY IMPASSE**

  The newly recovered correspondence confirms that Sister Agnieszka did not merely withhold information from the occupying authorities regarding the Jewish children hidden in the convent wing. She actively fabricated evidence: false names, falsified baptismal records, and a fabricated quarantine order regarding scarlet fever.

  We must be precise about what this means. These were not instances of *reservatio mentalis* (mental reservation), where the speaker intends a meaning different from the words spoken but which remains objectively true in some sense. These were factual falsehoods. By the plain definition of moral theology, they were lies.

  **3. THE OBJECTION**

  Consultors Kowalski and Lewandowski have argued that this evidence is fatal to the cause. Their position rests on the settled teaching of the Church regarding the intrinsic evil of lying (*malum in se*). As they have noted, this tradition is not a matter of disciplinary law which can be dispensed, but of moral doctrine.

  *   **Augustine:** In *Contra Mendacium*, he argues that a lie is always a sin, regardless of the intention to save a life. To lie is to turn away from God, who is Truth.
  *   **Aquinas:** *Summa Theologiae* (II-II, q. 110) confirms that lying is sinful by its very object. A good intention (saving children) cannot make an evil act (lying) good.
  *   **Catechism:** Paragraph 2483 states, "To lie is to speak or act against the truth in order to lead someone into error." It does not offer an exception for duress.

  Consultors Kowalski and Lewandowski argue that "Heroic Virtue" requires the practice of virtue to a heroic degree, free from mortal sin. If Sister Agnieszka's conduct was sinful, and if she persisted in it without repentance (as the record suggests she would do it again), she cannot be beatified.

  I must state clearly: **They are right.** If the Augustinian-Thomistic prohibition on lying admits of no exception, then Sister Agnieszka is not a saint. If the tradition they invoke is the final word, without nuance or development regarding the *ius ad veritatem* (right to truth), then this Commission has no choice but to halt the cause. To forward it would be to submit a falsehood to Rome.

  **4. THE COUNTER-ARGUMENT**

  However, there exists a secondary theological tradition, less rigorous but historically persistent, which argues that the obligation to tell the truth presupposes a right in the hearer to know the truth. An unjust aggressor seeking to murder the innocent forfeits that right. In this view, the falsehoods spoken to the occupiers were not "lies" in the moral sense because the occupiers had no jurisdiction over the lives of the children.

  This view is not without its defenders among modern moralists. But it is also not without its detractors. It is, at present, a *dubium* (doubt).

  **5. RECOMMENDATION**

  I recommend that the Commission **forward the cause as currently framed**, with the inclusion of the recovered correspondence and the formal dissenting opinion of Consultors Kowalski and Lewandowski attached to the *positio*.

  I do not make this recommendation lightly, nor do I make it because I believe the theological difficulty can be wished away. I make it for the following reasons:

  1.  **The Competence of this Commission:** We are a diocesan historical commission. Our task is to assemble the evidence and determine if there is a *fama sanctitatis* (reputation for holiness). We are not the Magisterium. We do not have the authority to settle a theological dispute that has persisted for sixteen centuries. To suspend the cause now is to effectively rule on the morality of lying ourselves. It is to declare that the Augustinian position is the *only* permissible position. That is a dogmatic judgment we are not empowered to make.
  2.  **The Integrity of the Record:** To "reframe" the record—to describe her actions as "misleading" rather than "false"—would be to falsify the historical evidence. We cannot hide the letters. If we send the letters, we must acknowledge what they are.
  3.  **The Nature of Heroic Virtue:** Heroic virtue is not moral perfection in the abstract. It is the conformity of a human will to God's will in extreme circumstances. It is possible that Sister Agnieszka's willingness to bear the stain of sin—to risk her own soul to save the children—is itself a reflection of Christ, who "became sin" for us (2 Cor 5:21). This is a dangerous theology, but it is not impossible.

  **6. THE RISK**

  I must be explicit about the consequence of this recommendation. By forwarding this cause, we are inviting the *Promotor Fidei* in Rome to reject it.

  It is entirely possible that the Congregation will review this dossier, look to the Catechism and the Angelic Doctor, and declare that Sister Agnieszka's actions were sinful. They may close the cause. They may declare that she is not in Heaven.

  If Consultors Kowalski and Lewandowski are right, we are sending a sinner to be venerated as a saint. That is a risk we take. But the greater risk, in my judgment, is to decide locally that the Church's tradition allows no room for the complexity of martyrdom under totalitarian evil.

  We send the evidence. We send the dissent. We let Rome decide the theology.

  **7. ACTION REQUIRED**

  Tomorrow, I ask you to vote in favor of transmission. If you cannot in conscience do so, you must vote to suspend. But do not vote to reframe. Do not ask us to hide the truth about Sister Agnieszka to make her easier to canonize. If she is a saint, she is a saint with the letters. If she is not, she is not.

  Let us not be the ones who close the door on her because we were afraid of the question.

  **Fr. Tomasz Nowak**
  *Chair, Diocesan Commission*
