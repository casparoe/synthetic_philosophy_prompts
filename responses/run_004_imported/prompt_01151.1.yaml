      *   *World Model:* Does it model the world or just language? (Bender & Gebru's "Stochastic Parrots").
      *   *Consciousness/Phenomenology:* Is there "something it is like" to be the model? (Nagel, Qualia).
      *   *Causal Powers:* Does the system have the right causal connection to the referents? (Putnam, Burge).
      *   *Generalization vs. Memorization:* Is it reasoning or sophisticated pattern matching? (Marcus, Chollet).
