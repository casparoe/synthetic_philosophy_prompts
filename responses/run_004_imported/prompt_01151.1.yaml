      *   *Counter-argument 2: The Stochastic Parrot Argument (Bender et al.).* LLMs model the *distribution of language*, not the *state of the world*. Understanding requires a link to reality/truth conditions, not just next-token prediction.
      *   *Counter-argument 3: Lack of Intentionality/Goal-Directedness.* Understanding is often tied to having goals, beliefs, and desires (Dennett's Intentional Stance). LLMs have no intrinsic goals (only next-token loss).
