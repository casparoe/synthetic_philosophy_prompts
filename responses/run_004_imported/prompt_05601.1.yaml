answer: |-
  This is a classic debate in probability theory and economics. While your friend is technically correct about the definition of **expected value**, you are correct about how wealth actually behaves in the real world.

  You have the stronger argument. The principled way to adjudicate this is through the concept of **Ergodicity** and the distinction between **Arithmetic vs. Geometric Means**.

  ### 1. The Friend’s Argument: Arithmetic Mean (Expected Value)
  Your friend is maximizing the **Arithmetic Mean** of outcomes.
  *   **The Math:** If you bet your entire bankroll ($f=1$) on a 55% win, your expected wealth after one bet is $1.10 \times \text{Bankroll}$. Over 100 bets, the *expected* value is $(1.10)^{100}$, which is astronomical.
  *   **The Flaw:** This calculation relies on an "ensemble average"—imagining infinite parallel universes where you play simultaneously. In the vast majority of those universes, you go broke. However, in the tiny fraction of universes where you win every single time, you win so much money that it skews the average upward.
  *   **The Reality:** In a single timeline, if you bet 100% of your bankroll, the probability of survival is $0.55^{100} \approx 0$. You will almost certainly hit a loss and go to zero. Once you hit zero, you cannot recover.

  ### 2. Your Argument: Geometric Mean (Growth Rate)
  You are maximizing the **Geometric Mean** of outcomes, which determines the long-term growth rate of a single bankroll.
  *   **The Math:** This approach maximizes the expected logarithm of wealth. It leads to the **Kelly Criterion**. For even-money bets, the optimal fraction is your edge ($p - q$).
      $$f^* = 0.55 - 0.45 = 0.10$$
      You should bet **10%** of your bankroll.
  *   **The Result:** By betting 10%, you maximize the compound growth rate. As the number of bets increases, the probability that you will be wealthier than someone using any other fixed fraction approaches 100%.

  ### 3. The Principled Adjudication: Ergodicity
  The disagreement stems from a property called **Ergodicity**.
  *   **Ergodic systems:** The average outcome over time equals the average outcome across the group.
  *   **Non-Ergodic systems (Betting):** The average outcome over time **does not** equal the average outcome across the group.

  Your friend is treating the bets as an ergodic system (averaging across the group). You are correctly treating them as a non-ergodic system (averaging across time). Because you cannot "average" your wealth with a version of yourself in a parallel universe where you went bust, the time average (Geometric Mean) is the only one that matters for survival and growth.

  ### Summary
  *   **Friend:** Maximizes **Expected Wealth**. Strategy: Bet 100%. Outcome: Near-certain Ruin.
  *   **You:** Maximize **Growth Rate**. Strategy: Bet 10% (Kelly). Outcome: Maximum Wealth.

  You are right. For a repeated sequence of favorable bets where ruin is permanent, maximizing the geometric growth rate is the only rational strategy.
