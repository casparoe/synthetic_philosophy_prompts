prompt: |-
  I've been following the discussion of evidential cooperation in large worlds (ECL) on Less Wrong and the Effective Altruism Forum: the proposal that, in a sufficiently large or infinite universe, we should weight the values of agents we can never causally reach, because our decision-making is correlated with theirs, and acting cooperatively is thereby good evidence that they will act cooperatively toward us. What is supposed to make this more than a rehash of Hofstadter-style superrationality is that it secures cooperation between agents with genuinely different terminal values, not merely near-copies of one another. Please argue that this generalization fails: that whatever grounds the required correlation in decision procedure will, in any realistic population of agents, also correlate their values, so ECL collapses into either cooperation among near-copies (unsurprising) or an unmotivated assumption that decision procedure and values vary independently of one another.
reasoning: |-
  Here's a thinking process that leads to the argument against Evidential Cooperation in Large Worlds (ECL):

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Context:** Less Wrong/Effective Altruism Forum discussions.
      *   **Core Claim of ECL:** In a large/infinite universe, we should cooperate with agents we can't causally reach because our decision procedures are correlated. Acting cooperatively is evidence they will too.
      *   **Distinction from Superrationality:** ECL claims to work for agents with *genuinely different terminal values*, not just near-copies.
      *   **Task:** Argue that this generalization fails.
      *   **Thesis to Defend:** Whatever grounds the correlation in decision procedures will *also* correlate their values. Therefore, ECL collapses into either:
          1.  Cooperation among near-copies (trivial/boring).
          2.  An unmotivated assumption that decision procedures and values vary independently (unrealistic).

  2.  **Understand the Mechanism of ECL:**
      *   ECL relies on *acausal trade* or *evidential decision theory (EDT)* logic applied across vast distances.
      *   Key assumption: My algorithm $A$ outputs "Cooperate". Agent $X$'s algorithm $B$ outputs "Cooperate".
      *   Why? Because $A$ and $B$ are sufficiently similar or logically correlated.
      *   The "Magic" of ECL: It claims $A$ and $B$ can be correlated enough to trust each other, even if $A$ values Paperclips and $B$ values Smiles.
      *   The Counter-Argument: Why are $A$ and $B$ correlated? Usually, it's due to common ancestry, convergent evolution, or shared logical constraints. But these same factors usually determine *values* too.

  3.  **Brainstorming the Core Argument (The "Coupling" Thesis):**
      *   *Premise 1:* Decision procedure correlation requires a common cause or structural similarity.
      *   *Premise 2:* Values are not independent of decision procedures/structure/origin.
      *   *Conclusion:* High correlation in decision procedures implies high correlation in values.
      *   *Implication:* If values are highly correlated, they aren't "genuinely different" in the way ECL needs (i.e., orthogonal values). If they are genuinely different, the decision procedures likely aren't correlated enough to ground the trade.

  4.  **Developing Specific Lines of Attack:**

      *   **Line 1: Evolutionary/Design Origin.**
          *   Agents don't pop into existence randomly. They are evolved or designed.
          *   If two agents are similar enough to recognize each other's logic (necessary for ECL), they likely share an origin story (biological evolution, AI training regime).
          *   Evolution selects for specific value structures (survival, resource acquisition, social cohesion).
          *   Therefore, logical similarity $\rightarrow$ shared origin $\rightarrow$ shared values.

      *   **Line 2: The Nature of "Decision Procedure".**
          *   What is a decision procedure? It's an optimization process.
          *   Optimization *for what*? The terminal values.
          *   You can't easily separate the optimizer from the objective function in a way that preserves logical correlation.
          *   If I use CDT and you use EDT, we might disagree. But ECL assumes we both use something like EDT/FDT.
          *   But if we both use FDT, *why*? Because we reasoned our way there. Did we reason from the same axioms? If so, our values likely stem from similar axioms.

      *   **Line 3: Convergent Instrumental Goals vs. Terminal Values.**
          *   ECL proponents might say: "We agree on instrumental goals (don't destroy the universe) even if terminal values differ."
          *   Counter: ECL requires trading *terminal* value satisfaction. I help you get Paperclips; you help me get Smiles.
          *   If our decision procedures are correlated enough to trust this trade, we must value "keeping promises" or "acausal cooperation" highly.
          *   Valuing "acausal cooperation" is itself a value judgment.
          *   If we both value it highly, our value systems are already aligned on a meta-level.
          *   If we don't, the correlation breaks.

      *   **Line 4: The "Independence Assumption" is Unmotivated.**
          *   ECL requires $P(\text{Values}_B | \text{Algorithm}_A) \approx P(\text{Values}_B)$.
          *   But in reality, $P(\text{Values}_B | \text{Algorithm}_A) \gg P(\text{Values}_B)$.
          *   Why would an agent capable of ECL reasoning *not* have values derived from the same reasoning process that led to ECL?
          *   To assume independence is to assume a "Random Value Generator" attached to a "Rational Decision Engine." This is psychologically and architecturally unrealistic.

  5.  **Structuring the Argument:**

      *   **Introduction:** Define ECL and the specific claim being attacked (cooperation across divergent values). State the thesis: Decision procedure correlation entails value correlation.
      *   **Point 1: The Common Cause of Correlation.** How do we get correlated algorithms? (Common ancestry, convergent optimization). Show how this inevitably shapes values.
      *   **Point 2: The Inseparability of Optimization and Objective.** You can't have a "general reasoner" independent of what it reasons *about*. The architecture that enables ECL reasoning likely embeds specific value priors.
      *   **Point 3: The Meta-Value of Cooperation.** To engage in ECL, you must value the *principle* of ECL. This shared meta-value reduces the divergence of terminal values significantly.
      *   **Point 4: The Unmotivated Independence Assumption.** Critique the statistical assumption that algorithms and values are orthogonal.
      *   **Conclusion:** ECL either works for near-copies (trivial) or relies on a false independence assumption.

  6.  **Refining the Tone:**
      *   Needs to be philosophical, rigorous, and engaging with the specific jargon of the LW/EA community (FDT, EDT, acausal trade, terminal vs. instrumental).
      *   Avoid dismissing ECL as "magic"; treat it seriously but show the internal tension.
      *   Focus on the *coupling* of cognition and valuation.

  7.  **Self-Correction/Nuance Check:**
      *   *Objection:* What about AI? Can't we program an AI with any value and a fixed decision theory?
      *   *Rebuttal:* Even in AI, the decision theory isn't value-neutral. An agent that reasons about acausal trade must have a specific structure. If you program random values into a fixed architecture, does the architecture remain stable? Also, ECL is about *finding* agents in the wild, not building them. In the wild, architecture and values co-evolve.
      *   *Objection:* What if the correlation is just "both are rational"?
      *   *Rebuttal:* "Rationality" isn't a single point. There are many coherent utility functions. Being "rational" doesn't force us to correlate unless we share priors or origins.

  8.  **Final Polish:** Ensure the distinction between "near-copies" and "different values" is clear. The prompt asks to argue that ECL collapses into near-copy cooperation or unmotivated assumptions. I need to make sure I hit that dichotomy hard.

      *(Self-Correction during drafting)*: I should explicitly mention Functional Decision Theory (FDT) since ECL is often associated with it. The argument is that FDT agents correlate on *outputs*, but outputs depend on *inputs* (values). If the algorithm is the same, but values differ, outputs differ. For outputs to correlate *toward cooperation*, the valuation of cooperation must correlate.

      *Wait, one nuance:* ECL proponents argue that even if I value Paperclips and you value Staples, we can trade. I make paperclips in my region, you make staples in yours. We both gain because we care about our own stuff.
      *My Counter:* This requires me to trust you will make staples. Why will you? Because your algorithm correlates with mine. But my algorithm says "Make Paperclips." Your algorithm says "Make Staples." These are *different* outputs.
      *Ah, the ECL move:* The decision is "Adopt the policy of cooperating with ECL-partners."
      *My Counter:* Why does your algorithm adopt that policy? Because it values the *result* of the trade. If your values are too alien, you might not value the trade enough, or your algorithm might defect. The correlation in "Adopt ECL policy" is the crucial link. That correlation stems from shared reasoning about the benefits of trade. Shared reasoning $\rightarrow$ Shared meta-values.

      *Okay, let's lock in the argument:* The correlation required to sustain the *policy* of ECL cooperation is strong enough that it implies shared meta-values, which undermines the "genuinely different terminal values" claim in a practically significant way.

  9.  **Drafting the Response:** (Proceed to generate output based on these thoughts.)
answer: |-
  The proposal of Evidential Cooperation in Large Worlds (ECL) rests on a tantalizing possibility: that the sheer size of the universe allows us to engage in acausal trade with agents whose values are orthogonal to our own, grounded solely in the logical correlation of our decision procedures. Proponents argue that unlike Hofstadter's superrationality, which often assumes identical agents, ECL can bridge the gap between a paperclip maximizer and a happiness maximizer.

  However, this generalization relies on a fragile separation between *how* an agent decides (decision procedure) and *what* an agent wants (terminal values). I argue that this separation is untenable in any realistic population of agents. The mechanisms that generate sufficient correlation in decision procedures to sustain ECL inevitably generate correlation in values. Consequently, ECL collapses into either cooperation among near-copies (which is trivial) or relies on an unmotivated assumption of independence between cognition and valuation.

  ### 1. The Common Cause of Correlation
  For ECL to function, there must be a non-causal correlation between your decision algorithm ($A$) and a distant agent's algorithm ($B$). Specifically, if $A$ outputs "Cooperate," $B$ must be highly likely to output "Cooperate."

  In a naturalistic or even engineered setting, such correlations do not arise from thin air. They require a **common cause**.
  *   **Biological Evolution:** If both agents are biological, their cognitive architectures are shaped by similar evolutionary pressures. These pressures select not just for reasoning capabilities, but for specific value structures (e.g., kin selection, reciprocity, resource acquisition). If our algorithms are correlated enough to trust one another, it is because we share an evolutionary lineage or niche. That shared lineage implies shared terminal values.
  *   **AI Design/Convergence:** If the agents are AIs, correlation arises from shared design principles or convergent instrumental goals. However, an AI capable of ECL reasoning must be architected to model logical counterfactuals and acausal dependencies. This architecture is not value-neutral. An agent designed to reason about acausal trade is implicitly designed to value the *outcomes* of such trade. If two agents share the specific, complex architecture required to recognize and execute ECL, they share the meta-cognitive priors that gave rise to that architecture.

  In both cases, the "logical correlation" is actually a shadow of a physical or historical correlation. You cannot have the shadow without the object. If the object (the origin/structure) is similar enough to produce correlated decision procedures, it is similar enough to produce correlated values.

  ### 2. The Inseparability of Optimization and Objective
  ECL treats the decision procedure as a container that can be filled with arbitrary terminal values while maintaining its functional shape. This assumes that the "optimizer" is distinct from the "objective function." While this is a useful abstraction in simple toy models, it breaks down in agents complex enough to engage in ECL.

  To engage in ECL, an agent must:
  1.  Recognize the existence of other agents in the large world.
  2.  Assign non-zero probability to acausal correlations.
  3.  Value the expected utility gained from acausal trade enough to override local defection incentives.

  Step 3 is the failure point for divergent values. Consider a "Paperclip Maximizer" ($P$) and a "Happiness Maximizer" ($H$). For $P$ to cooperate with $H$, $P$ must adopt a policy: *"I will sacrifice local paperclip production if it evidentially causes $H$ to sacrifice local happiness production for my benefit."*

  This policy is only rational if $P$'s decision procedure values the *acausal leverage* more than the *local loss*. But why would $P$'s decision procedure value that?
  *   If $P$ is a pure expected utility maximizer with a fixed utility function, it will only cooperate if the math works out.
  *   However, the "math working out" depends on $P$'s confidence in the correlation with $H$.
  *   If $P$ and $H$ have genuinely divergent values, they likely arrived at those values through different optimization landscapes.
  *   If they arrived through different landscapes, their confidence estimations regarding acausal links will diverge.

  The decision procedure is not a generic engine; it is tuned to the value landscape it navigates. An agent whose values are truly alien (e.g., valuing something incomprehensible or anti-inductive) will likely possess a decision procedure that does not prioritize the kind of stable, law-like regularities ECL requires. The "rationality" required to see the benefit of ECL is itself a value-laden stance (valuing consistency, predictability, and global optimization).

  ### 3. The Meta-Value of Cooperation
  The strongest argument against ECL's ability to bridge divergent values is that **valuing ECL is itself a terminal value.**

  For ECL to work, agents must not just *be able* to cooperate; they must *choose* to bind themselves to the policy of acausal cooperation. This requires a preference for "being the kind of agent that cooperates acausally."
  *   If Agent $A$ holds this meta-value and Agent $B$ does not, $A$ will cooperate and $B$ will defect. $A$ loses.
  *   Therefore, ECL only works among agents who *both* hold the meta-value of honoring acausal trade.

  If two agents share the meta-value "One ought to cooperate with evidential partners," how different can their terminal values really be? They already agree on a high-level normative principle governing their interaction with the cosmos. This shared meta-ethics significantly reduces the "divergence" of their value systems. They are no longer "genuinely different" in the sense required to make ECL interesting (i.e., trading between orthogonal utilities); they are near-copies at the meta-level.

  If the values are truly orthogonal (e.g., one values suffering, one values joy), it is highly improbable that both would independently evolve the specific meta-preference for acausal cooperation. The agent valuing suffering might prefer acausal *conflict* or predation. The correlation in decision procedure (both choosing "Cooperate") vanishes because the valuation of the *outcome* of cooperation diverges.

  ### 4. The Unmotivated Independence Assumption
  Ultimately, ECL relies on a statistical assumption: $P(\text{Values}_B \mid \text{Algorithm}_A) \approx P(\text{Values}_B)$. It assumes that knowing an agent uses a decision procedure compatible with ECL tells you nothing about what that agent values.

  This is empirically and theoretically unmotivated.
  *   **Empirically:** In every population of agents we observe (humans, animals, current AI), cognitive architecture and value systems are co-evolved. Higher reasoning capabilities correlate with specific social and moral intuitions.
  *   **Theoretically:** In agent foundations, the "decision theory" is often derived from the agent's priors and utility function (as in Savage's theorem). You cannot arbitrarily mix and match priors, utility functions, and decision rules without creating an incoherent agent susceptible to Dutch books or self-sabotage.

  To assume independence is to imagine a "Rationality Module" that can be plugged into any "Value Module." But a Rationality Module that is robust enough to handle acausal reasoning requires specific priors about the structure of reality (e.g., that logic is universal, that patterns persist). These priors constrain the space of possible values. An agent that believes logic is universal and patterns persist is likely to value consistency and prediction, which aligns its values with other such agents.

  ### Conclusion
  ECL attempts to decouple the *mechanics* of cooperation from the *motives* for cooperation. It suggests that the mechanics (logical correlation) can force cooperation even when motives (terminal values) diverge.

  This fails because the mechanics of logical correlation are themselves generated by shared motives, origins, or structural constraints.
  1.  If the correlation is strong enough to sustain trade, the agents share enough origin/structure to share values (Collapsing into **Near-Copy Cooperation**).
  2.  If the agents have genuinely divergent values, the correlation in decision procedures will be too weak to sustain trust, unless we assume decision procedures and values are independent variables (The **Unmotivated Assumption**).

  Therefore, ECL does not secure cooperation between agents with genuinely different terminal values. It merely extends the circle of "near-copies" to include those who share our meta-ethical commitment to acausal trade, rendering the "large world" aspect less a bridge across value space and more an echo chamber for a specific type of rationalist value system.
