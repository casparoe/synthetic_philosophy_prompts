answer: |-
  This is a classic and deeply fertile dispute in Wittgenstein scholarship. Your friend is not wrong to notice the structural resemblance: both foundationalism and hinge epistemology posit a class of propositions that are exempt from doubt and serve as a basis for other claims. If you look only at the *architecture* of belief, Wittgenstein looks like a foundationalist.

  However, your intuition is philosophically sharper. The difference lies not in the architecture, but in the *grammar* and the *purpose* of that architecture. Foundationalism is an epistemological project aimed at securing knowledge; *On Certainty* is a grammatical investigation aimed at dissolving the skepticism that makes such security seem necessary.

  To help you articulate this to your friend, here is a precise breakdown of the differences, focusing on the status of the "basic" belief, the nature of the regress, and the role of action.

  ### 1. Epistemic Status: Knowledge vs. Animal Certainty
  The most decisive difference lies in how the "foundation" is categorized.

  *   **Classical Foundationalism (Descartes, Moore):** Basic beliefs are the *most secure form of knowledge*. For Moore, "Here is a hand" is a paradigm of something I *know*. It is a proposition that is true, believed, and justified (or self-evident). It sits at the bottom of the pyramid of knowledge.
  *   **Wittgenstein's Hinges:** Hinge propositions are explicitly **not knowledge**. Wittgenstein argues that "knowledge" and "certainty" belong to different categories.
      *   *Knowledge* implies the logical possibility of doubt and error. To say "I know" is to claim I have grounds that could, in principle, be checked.
      *   *Hinge Certainty* is groundless (*unbegründet*). It is not a mental state of conviction but a way of acting. As Wittgenstein writes, "If I know something, then I also know that I know it, etc." (OC §115). But with hinges, there is no "knowing that I know."
      *   **The Point:** A foundation is a *justified* stopping point. A hinge is an *unjustified* starting point. If you claim to "know" a hinge, you have misunderstood its role. It is not a piece of knowledge; it is the scaffolding that makes the game of knowledge possible.

  ### 2. The Regress of Justification: Solving vs. Dissolving
  This addresses your specific question about whether something "groundless" can stop the regress.

  *   **Foundationalism:** Accepts the skeptic's challenge. The skeptic asks, "What justifies this belief?" The foundationalist answers, "This belief justifies itself (or needs no justification) because of its intrinsic nature (e.g., it is self-evident)." They stop the regress by finding a belief that is **epistemically special**.
  *   **Wittgenstein:** Rejects the skeptic's challenge as a misunderstanding of language. When we reach a hinge, we do not say, "This belief is so obvious it needs no proof." We say, "The request for proof **makes no sense here**."
      *   Wittgenstein uses the metaphor of the spade: "I have arrived at the bedrock... and this is simply where I stop. But it is not because the bedrock is 'solid' in itself; it is because **my spade is turned**" (OC §217).
      *   **The Point:** Foundationalism stops the regress by finding a secure block. Wittgenstein stops the regress by showing that the digging (the demand for justification) has run out of meaning. The regress doesn't end because we hit the bottom of the world; it ends because we have reached the limit of our language game.

  ### 3. Fluidity: Static Foundations vs. The River-Bed
  Your friend likely views foundations as permanent (e.g., logical truths or sense data). Wittgenstein's "river-bed" metaphor (OC §§96–99) introduces a historical and pragmatic fluidity that classical foundationalism cannot accommodate.

  *   **Foundationalism:** Basic beliefs are generally universal and timeless. *Cogito ergo sum* is true for everyone, everywhere.
  *   **Wittgenstein:** Hinges are contextual and can shift. What is a hinge for one language game might be an empirical proposition in another.
      *   "The earth has existed for a long time" is a hinge for us. But for a different community, or in a different scientific context, it might be something tested and verified.
      *   The "river-bed" (the hard rocks of certainty) can shift over time, becoming the "water" (fluid empirical claims), and vice versa.
      *   **The Point:** Foundationalism seeks a *logical* guarantee. Wittgenstein describes a *natural history* of human agreement. Hinges are not true because they are foundational; they function as foundations because we agree to act on them.

  ### 4. Action vs. Assent
  Finally, there is a phenomenological difference.

  *   **Foundationalism:** Is about **mental assent**. I hold a belief in my mind that serves as a premise for inference.
  *   **Wittgenstein:** Is about **enactment**. Hinges are shown in what we *do*, not what we *say*.
      *   I do not verify "objects don't vanish when I look away" by checking; I show my certainty by reaching for a cup.
      *   This is why Wittgenstein calls it "animal certainty." It is pre-linguistic trust.
      *   **The Point:** Foundationalism is an intellectualist theory of justification. Hinge epistemology is a pragmatic theory of action.

  ### Addressing the "Groundless Regress-Stopping" Question
  You asked: *Can something "groundless" still do the regress-stopping work that foundations are supposed to do?*

  **Yes, but it changes the definition of "work."**
  *   In foundationalism, the "work" is providing **warrant**. The foundation transfers justification to the superstructure.
  *   In Wittgenstein, the "work" is providing **sense**. The hinge does not justify other beliefs; it makes them intelligible. Without the hinge, the concept of "justification" has no application.

  If you doubt the hinge (e.g., "Maybe the world came into existence five minutes ago"), you aren't being a rigorous skeptic; you are opting out of the language game of history and evidence. You haven't found a deeper foundation; you've destroyed the ground on which standing is possible.

  ### Verdict: Is it Foundationalism?
  If your friend defines foundationalism broadly as "any theory that posits some beliefs are basic," then yes, Wittgenstein is a foundationalist. (Philosopher Avrum Stroll famously argued for "Semantic Foundationalism" regarding Wittgenstein).

  However, if foundationalism is defined as **the project of halting skepticism by identifying intrinsically justified basic beliefs within the epistemic system**, then Wittgenstein is **not** a foundationalist. He is offering a **dissolution** of the problem foundationalism tries to solve.

  **How to put it to your friend:**
  > "Foundationalism tries to win the skeptic's game by finding an unbeatable move (the basic belief). Wittgenstein argues that the game itself is rigged. Hinges aren't unbeatable moves; they are the rules of the game. You don't justify the rules of chess by playing chess; you follow them to play at all. So, hinges aren't foundations *within* knowledge; they are the conditions *for* knowledge. That's not foundationalism; that's a critique of the justificatory picture entirely."

  ### Recommended Reading for Precision
  To sharpen your arguments, you might look into:
  1.  **Danièle Moyal-Sharrock:** She argues strongly for the "third Wittgenstein" as a philosopher of action, emphasizing that hinges are not propositions but "ways of acting."
  2.  **Avrum Stroll:** *Moore and Wittgenstein on Certainty*. He defends the foundationalist reading but distinguishes it as "semantic" rather than "epistemic."
  3.  **Michael Williams:** *Unnatural Doubts*. He uses Wittgenstein to develop "contextualism," which is a direct alternative to foundationalism and coherentism.

  Your instinct is correct: Wittgenstein isn't building a better foundation; he's showing us that we are already standing on the ground, and the demand for a "foundation" is a philosophical illusion.
