  I'm a retired analytical chemist -- forty-odd years in a lab, more comfortable with a mass spectrometer than a syllogism -- and since retiring I've been slowly working through philosophy of science for fun: Kuhn first, then Laudan, now stuck halfway through a Psillos book. Last week two people in my little reading group got into a real tangle over scientific realism and I havent been able to stop turning it over since.

  Deb kicked it off by pointing to Laudan's famous list of once wildly successful theories that we now think are flatly false -- phlogiston, caloric, the crystalline spheres of ancient astronomy, the electromagnetic ether -- and said that if theory after theory turned out false despite being empirically successful in its day, then by induction our current "successful" theories (strings, dark matter, whatever) are probably headed the same way; empirical success tracks truth about as reliably as a stopped clock tracks time. Marcus came back with structural realism: what actually survived from Fresnel's wave theory of light into Maxwell's electromagnetism wasn't the mechanical ether, it was the equations themselves, carried over almost untouched -- so the lesson isn't "give up on realism," it's "be a realist about the structure, not about the furniture." Deb said that's suspiciously convenient: of course some mathematical skeleton survives, otherwise the new theory couldn't reproduce the old predictions in the first place, so "the structure survives" is basically guaranteed by construction and doesnt rescue realism from anything. Marcus said that's not fair to Worrall's actual argument -- the point of the Fresnel case is that you can tell in advance, from inside the old theory, which assumptions are doing the real empirical work and which ones are just along for the ride, so it isn't a rescue cooked up after the fact. Deb's comeback was that even granting him that one lovely case, Laudan's list runs to a dozen or more theories, and one nicely-chosen success story doesn't defeat an induction over the whole list -- if anything the burden's now on Marcus to find the same structural continuity in caloric theory or phlogiston before anyone should feel rescued.

  Could you go through this move by move and say who's got the better of it at each step, rather than just naming an overall winner? Give me a short JSON block first, {"deb_1": <score>, "marcus_1": <score>, "deb_2": <score>, "marcus_2": <score>}, scoring each move from -2 (badly mistaken) to 2 (clearly right), and then a paragraph or so justifying each score and flagging anything important that both of them are missing.
