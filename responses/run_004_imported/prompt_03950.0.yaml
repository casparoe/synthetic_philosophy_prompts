      *   *Clarification on D3:* The user asked why D3 is "roundabout." I need to explain that D3 defines $NE(x)$ based on essences to make the deduction from T2 work. If $NE$ just meant $\Box \exists y (y=x)$, the link to the property $G$ would be weaker. D3 ties the existence of the *individual* to the exemplification of the *property*.
      *   *A4:* Don't forget A4. It ensures $P(\phi)$ doesn't change between worlds. If "Positive" changed meaning, $G$ would change meaning, and the essence wouldn't hold across worlds.

