prompt: |-
  My mother, a scholar of Madhyamaka Buddhist philosophy who spent something like thirty years almost entirely on one Indian thinker, Nāgārjuna, died two weeks ago, and I have been asked to deliver her eulogy this coming Sunday. Within her department she was best known for her devotion to what she called, half-affectionately, the catuṣkoṭi, or tetralemma — the four-cornered pattern (it is, it is not, it is both, it is neither) that Nāgārjuna uses throughout his root text, the Mūlamadhyamakakārikā, and that he turns most pointedly on exactly the question everybody at a memorial service wants answered: whether a person who has just died still exists somewhere, or doesn't, or both, or neither. Some years ago, at a dinner with her graduate students, half-joking but clearly not entirely, she dictated what she called "the four things nobody is allowed to say at my funeral," and made them repeat it back to her like a catechism: that she's in a better place, that she's simply gone, that she's somehow both here and at peace, or that it's beyond words and we shouldn't try to say anything at all. I wasn't at that dinner. One of those students emailed me the list, word for word, as a condolence, and I can no longer pretend I haven't seen it.

  The service will be small, maybe seventy people, and split unevenly: the large majority are family and old friends who have never heard the word "emptiness" used in this particular technical sense and simply want to feel, for eight or ten minutes, that someone has said something true and tender about a woman they loved; a smaller group are former students and colleagues who wrote dissertations under her on exactly this material and will notice at once if I quietly smuggle in one of the four forbidden claims, or if I use her other favorite idea — that conventional truth and ultimate truth are two registers, not one real fact and one polite lie — as a loophole instead of honestly. She would also have been furious at a eulogy that turned her own emptiness doctrine into a clever hiding place, a smug fifth answer dressed up as humility; she used to say that anyone who treats emptiness itself as some special, exempt truth has missed the entire point of the book. My brother, who has even less patience for any of this than I do, has told me twice not to "turn Mom's funeral into a seminar."

  I write novels for a living, not philosophy, so I have more or less the opposite problem from the one she spent her career training students to solve: I can generally make a room feel something, but I don't yet trust myself to make it feel something that is also true by her own exacting lights. Could you write the eulogy for me? It should run about eight or ten minutes read aloud, and it needs to actually comfort the people in the first group without giving anyone in the second group grounds to corner me at the reception afterward and explain, kindly but at length, exactly where I went wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** A scholar of Madhyamaka Buddhist philosophy, specifically Nāgārjuna, focused on the *catuṣkoṭi* (tetralemma).
      *   **Constraint 1 (The Forbidden Four):** The eulogy *cannot* assert any of the four positions regarding her existence after death:
          1.  She exists (in a better place).
          2.  She does not exist (she's simply gone).
          3.  She both exists and does not exist.
          4.  She neither exists nor does not exist (it's beyond words/ineffable).
      *   **Constraint 2 (The Two Truths):** Cannot use the "Two Truths" doctrine (conventional vs. ultimate) as a loophole to sneak in a metaphysical claim. Emptiness (*śūnyatā*) cannot be treated as a special, exempt truth itself.
      *   **Audience:** Split between family/friends (need comfort, tenderness, accessibility) and students/colleagues (need philosophical accuracy, no misrepresentation of her life's work).
      *   **Tone:** True to her exacting lights, tender, comforting, not a seminar, not smug, not a "clever hiding place."
      *   **Speaker:** A novelist child of the deceased.
      *   **Length:** 8-10 minutes spoken (approx. 1000-1300 words).

  2.  **Deconstruct the Philosophical Challenge:**
      *   Nāgārjuna's Madhyamaka is about the emptiness of inherent existence (*svabhāva*). It deconstructs views to stop proliferation (*prapañca*).
      *   The *catuṣkoṭi* isn't just a logic puzzle; it's a therapeutic tool to release attachment to views, including views about death.
      *   The mother explicitly forbade the four standard responses. This is a meta-instruction. To honor her is to *not* answer the question of "where is she?" but to address the *grief* and the *memory* without reifying her presence or annihilating it.
      *   The danger is turning emptiness into a "thing" (reifying emptiness). The eulogy must embody emptiness without preaching it as a dogma.
      *   The "Two Truths" trap: Saying "Ultimately she's gone, but conventionally she's here" is exactly what she warned against if used to dodge the pain or the logic. The eulogy needs to live in the *conventional* world (where grief happens) while acknowledging the *dependence* of that world, without claiming access to an "Ultimate" standpoint.

  3.  **Determine the Strategy:**
      *   **Focus on Dependence (Pratītyasamutpāda):** Instead of asking *if* she is, ask *how* she continues. She exists in dependence on causes and conditions (memories, teachings, love, the people in the room). This avoids "existence" in the inherent sense and "non-existence" in the nihilistic sense.
      *   **Focus on the Work:** Her life was her work. Her work was clearing away confusion. The eulogy should clear away the confusion of grief without denying the pain.
      *   **Focus on the Relationship:** As a novelist, the speaker can talk about stories. But the mother studied the limits of language. The bridge is how language points to experience without capturing it.
      *   **Avoid Metaphysics:** Do not speculate on her state. Speculate on *our* state in relation to her.
      *   **The "Fifth Position" Trap:** Avoid saying "It's a mystery" or "Emptiness explains this." Instead, show how her life *enacted* the philosophy through care, rigor, and love.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Acknowledge the split audience gently. Establish the bond (mother/child, scholar/human).
      *   **The Philosophical Elephant:** Address the *catuṣkoṭi* directly but lightly. Acknowledge the "forbidden list." This signals to the students "I know the rules" and signals to the family "She had a sense of humor about deep things."
      *   **The Core Argument (Dependent Arising):** Shift from "Where is she?" to "How does she appear?" She appears in us. This is technically sound (dependence) and emotionally resonant (legacy).
      *   **The Two Truths (Handled Carefully):** Don't use the terms "conventional/ultimate." Instead, talk about the "truth of the heart" and the "truth of the silence." Or better, talk about how she lived in the world *as it is*. She didn't use philosophy to escape the world, but to engage with it more fully.
      *   **Personal Anecdote:** Need something human. Not a philosophical debate, but a moment of care. Maybe her teaching style applied to parenting? Rigor as love?
      *   **The Ending:** Bring it back to the present moment. The grief is real. The love is real. Not because they are inherent, but because they are happening. A closing that invites silence rather than filling it.

  5.  **Refining the Tone:**
      *   *Risk:* Too academic. *Fix:* Use metaphors of weaving, echoes, light.
      *   *Risk:* Too sentimental. *Fix:* Keep the edges sharp. Acknowledge the pain. Don't promise "she's watching over us."
      *   *Risk:* Violating the Four Corners. *Check:*
          *   "She is with us"? (Metaphorically, yes. Ontologically, no.) -> Phrase as "We carry her."
          *   "She is gone"? (Physically, yes. Totally, no.) -> Phrase as "The form has changed."
          *   "Both/Neither"? -> Avoid these logical operators entirely. Focus on *process*.

  6.  **Writing - Iteration 1 (Mental Outline):**
      Start with the list. It's funny but serious. Say I won't read the list. Say she taught us that words are fingers pointing at the moon. She isn't the moon anymore. She is the pointing. We are the ones looking. Her love caused us. We are the effect. That's how she stays.

  7.  **Writing - Iteration 2 (Closer to Final):**
      Need to make sure I don't accidentally say "She exists in our hearts" (which sounds like Position 1 or 3). Instead, "The impact of her life conditions our present."
      Need to make sure I don't say "Death is an illusion" (Position 4/Smugness). Instead, "Grief is the price of connection."
      The novelist voice should be evident: attention to detail, rhythm, imagery.

  8.  **Final Polish (checking constraints):**
      *   *Time:* 1000-1200 words is about 8-9 minutes at a moderate pace.
      *   *The "Fifth Truth" check:* Am I making Emptiness a God? No, I'm making it a description of relationship.
      *   *The "Seminar" check:* Keep jargon minimal. Explain *catuṣkoṭi* simply if used.
      *   *Comfort:* Validate the grief. It's okay to miss her.

      *(Self-Correction during drafting)*: I initially thought about quoting Nāgārjuna. Better not. It turns into a seminar. Better to describe *how* she thought.
      *(Self-Correction)*: I need to explicitly mention the "four things nobody is allowed to say" to honor the anecdote provided. It shows I know her rules.

      *(Key Insight)*: The way to satisfy the students is to demonstrate *pratītyasamutpāda* (dependent origination) without necessarily using the Sanskrit. The way to comfort the family is to show that dependence means connection. If we are connected, she is not "gone" in the sense of severed, but "changed" in the sense of flow. But I must be careful not to imply a soul flowing. Focus on *influence* and *memory* as causal factors.

      *(Refining the "Existence" trap)*: Instead of saying "She lives on," say "Her life continues to have effects." This is physically and philosophically true without positing a surviving entity.

  9.  **Final Review against the prompt:**
      *   8-10 mins? (Word count check).
      *   No forbidden 4 claims? (Checked).
      *   No Two Truths loophole? (Checked).
      *   Comforting? (Yes, focuses on love and continuity of impact).
      *   Philosophically sound? (Yes, focuses on dependence and emptiness of inherent self).

      *Let's write.*
answer: |-
  Thank you for being here. For those of you who knew my mother only as a mother, or a friend, or a neighbor, you know that she was a person of immense warmth, terrible impatience with bad grammar, and a laugh that could fill a house. For those of you who knew her as a scholar, you know she spent thirty years studying a man named Nāgārjuna, who argued that nothing possesses a fixed, independent self—not a table, not a thought, and certainly not a person.

  She taught that we suffer because we try to hold onto things as if they were permanent, and we push away things as if they were truly separate from us.

  I am a novelist. I make my living arranging words to create the illusion of stable worlds and people who remain themselves from the first page to the last. My mother made her living taking those illusions apart. Standing here, I feel the weight of both those trades. I want to say something that comforts you, which is the job of a story. But I also want to say something that she would not correct from the grave, which is the job of a student.

  A few years ago, at a dinner with her graduate students, she dictated a list. She called it "The Four Things Nobody Is Allowed to Say at My Funeral." She made them memorize it. I wasn't there, but one of those students sent it to me this week.

  The list forbids saying that she is in a better place. It forbids saying that she is simply gone. It forbids saying that she is both here and at peace, and it forbids saying that it is all beyond words and we shouldn't try to speak.

  She was half-joking. But with her, the joke was always the hook on which the serious thing hung. She knew that tonight, all of us—family, friends, colleagues—are looking for a location. We want to know where she has gone so we can know how to direct our love. Is it up? Is it out? Is it nowhere?

  If I tell you she is watching us, I lie to the philosophers. If I tell you she is nothing but dust, I lie to the grieving. If I tell you it is a mystery, I am using her life's work as a shield to protect myself from the sharp edge of her absence. She would have been furious at that. She used to say that emptiness is not a hiding place. It is not a comfortable fog. It is the clear, bright, terrifying recognition that everything depends on everything else.

  So, I will not tell you where she is. I cannot. But I can tell you how she continues.

  My mother taught that things do not exist on their own. A flame is not a thing; it is a process of burning. It depends on the wick, the oil, the oxygen. When the conditions change, the flame does not "go" anywhere. It ceases because the dependence has shifted.

  In this room, the conditions for my mother are still present.

  She is present in the way her colleagues pause before making a claim, checking their logic for hidden assumptions. She is present in the way her students read a text, looking for what is not being said as much as what is. She is present in the way my brother and I argue, using her cadence, her specific inflection when we are skeptical. She is present in the recipes she wrote down in her messy handwriting, in the books on her shelf that are now on ours, in the silence between us when we miss her.

  This is not a metaphor. This is causality. Her life was a cause. We, and this gathering, and the work that continues, are the effects. As long as the effects are rippling, the cause has not vanished. But neither is she here in the way she was yesterday. To say she is "gone" denies the love that remains active in this room. To say she is "here" denies the physical reality of her death.

  She taught us that we are not isolated islands. We are woven together. When a thread is pulled from a tapestry, the pattern changes. The thread does not go to a better place. It does not simply vanish into nothing. The tension of the whole cloth shifts. We are feeling that shift right now.

  I know many of you are in pain. I am in pain. There is a temptation to use philosophy to anesthetize that pain. To say, "Well, self is empty, so grief should be empty too." She would have rejected that instantly. Emptiness does not mean nothing matters. It means everything matters because everything is connected. If we were separate, her death would only affect her. Because we are not separate, her death wounds us. The pain is the proof of the connection.

  So, how do we honor her?

  We do not honor her by pretending she is somewhere else. We honor her by engaging with the world she left behind with the same rigor and care she brought to it.

  For her colleagues: You honor her by continuing the work, by refusing to let the philosophy become a dogma, by keeping the questions sharp.
  For her family and friends: You honor her by loving each other with the knowledge that this love is not a possession you hold, but a relationship you inhabit. It is fragile. It depends on you.

  She spent her life clearing away the clutter of fixed views so that people could see reality as it is: fluid, dependent, precious. She did not do this to escape the world. She did it to be more fully in it. She was a mother who checked footnotes. She was a scholar who made sure everyone had enough to eat. She understood that the ultimate truth of emptiness is found exactly in the conventional truth of making tea for a friend.

  I am not going to tell you that she is at peace. I don't know what that means. I am not going to tell you that she is gone, because I can feel her influence in the way I am standing here. I am not going to tell you it is beyond words, because she loved words, even if she knew their limits. And I am certainly not going to tell you she is both, just to cover my bases.

  Instead, I will say this: She was a woman who taught us that we cannot hold onto the water by clenching our fists. We can only carry it with open hands.

  She is not in the box at the front of the room. She is not in the ground where she will be buried. She is in the dependence we have on each other. She is in the silence we share when we run out of things to say. She is in the work that remains unfinished.

  If you want to find her, do not look up. Look across. Look at the person sitting next to you who is crying. Look at the student who is trying to be brave. Look at the work that needs to be done. That web of relation is where she lived. It is where she remains.

  We are the conditions for her memory. As long as we are here, as long as we care, as long as we speak the truth as best we can see it, she is not lost. She is just changed, like the flame that becomes heat and light.

  Thank you for loving her. Thank you for being the conditions that allow her to still be felt. Let us carry that forward, without pretending it is permanent, but without pretending it is nothing.

  Thank you.
