prompt: |-
  I'm doing a PhD in history and philosophy of science and my actual dissertation is on scientific realism, so verisimilitude/truthlikeness is one of those topics that's always hovering in the background of what I read without me ever having sat down with the technical details properly. In reading group this week we went through Popper's original definition -- built out of truth-content and falsity-content, where a theory's content is just its set of logical consequences -- and then someone brought up the Tichy-Miller result from 1974 that apparently sinks the whole project: on Poppers own definition, a false theory can never come out more verisimilar than another false theory, only a true theory can beat a false one, which is basically useless since the whole motivation was to be able to say things like "Newtonian mechanics is closer to the truth than what came before it" even though Newton's theory is, strictly speaking, false too. Everyone else in the group nodded and moved straight on to how this pushed people like Niiniluoto and Oddie toward similarity-based accounts instead, but I lost the thread on why the original result actually holds and didn't want to be the one who stops the discussion to ask.

  Could you give me an intuitive, gut-level explanation of why the Tichy-Miller argument works? I'm not asking for the fully spelled-out proof with all the content-class inclusions written out, I can go grind through the actual 1974 papers myself for that -- what I want is more like: why is closing content under logical consequence specifically the thing that causes this collapse, explained in a way I could repeat to someone at a dinner party without needing a blackboard. If you want to add a sentence or two at the end on why this particular failure mode is what motivated the move to similarity/likeness accounts, that'd be a nice bonus, but it's optional -- the main thing I'm after is actually feeling why Popper's definition sabotages itself, rather than just taking it on faith the way our reading group did.
