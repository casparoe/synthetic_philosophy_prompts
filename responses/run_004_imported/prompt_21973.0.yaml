      *   *If the 40% is the TRUE chance:* If the universe dictates that *this specific egg* has a 40% chance regardless of markers, then PP says stick to 40%. But that's medically implausible. Markers *cause* success rates to vary. Therefore, the 40% is an average of varying chances.
      *   *Refinement:* The 40% is an *expectation* of the chance, not the chance itself, given limited info. With more info (markers), the expectation updates.
      *   *Key Distinction:* The PP tells you to align with the chance *given your total admissible evidence*. If your evidence changes, the chance you defer to might change (because you are identifying a more specific chance function).

