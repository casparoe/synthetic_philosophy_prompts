      *   *Point 2: The Margin for Error Principle (MFP).* MFP says: If you know in $\alpha_i$, then $C$ is true in $\alpha_{i+1}$. This relies on the idea that your evidence in $\alpha_i$ is compatible with $\alpha_{i+1}$. In perceptual cases, evidence is sensory appearance. In logical cases, evidence is understanding/derivation. Is my evidence in "Proof Case $i$" compatible with "Proof Case $i+1$" (where the proof is invalid)? Not necessarily.
