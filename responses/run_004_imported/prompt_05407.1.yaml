answer: |-
  The allure of hyperbolic discounting for the modern rationalist is obvious. It offers a clean, mathematical formalization of human frailty. It transforms the moralistic fog surrounding "weakness of will" into a tractable problem of dynamic inconsistency. By positing that agents apply a steeper discount rate to delays near the present than to those in the future, the model elegantly predicts why an agent might plan to diet on Monday (when the donut is a week away) but binge on Friday (when the donut is immediate).

  However, while hyperbolic discounting is a powerful predictive tool for intertemporal choice, it fails as an explanation of *akrasia* in the strict philosophical sense articulated by Aristotle and refined by Donald Davidson. The economic model does not solve the puzzle of weakness of will; it dissolves it by changing the subject. It replaces a synchronic conflict within a single agent with a diachronic negotiation between successive temporal selves. Furthermore, the rejoinder that the philosophical puzzle is merely confused folk psychology rests on an eliminativist conception of agency that renders the normativity of rationality unintelligible.

  ### The Diachronic Shift

  To see why hyperbolic discounting misses the mark, we must distinguish between *preference reversal* and *acting against judgment*.

  In the hyperbolic model, the agent at time $t_1$ (the planning stage) prefers the larger-later reward ($L$) over the smaller-sooner reward ($S$). However, as time passes to $t_2$ (the moment of action), the proximity of $S$ causes its subjective value to spike disproportionately. At $t_2$, the agent prefers $S$ over $L$. When the agent chooses $S$ at $t_2$, they are maximizing their utility *at $t_2$*.

  This is a story of diachronic inconsistency. Self-1 wants $L$; Self-2 wants $S$. Self-2 frustrates Self-1's plans, but Self-2 is not irrational relative to Self-2's own current preference structure. Self-2 is simply doing what Self-2 wants to do. The conflict is between two different preference sets existing at different times.

  The Aristotelian-Davidsonian puzzle is stricter. It concerns **synchronic irrationality**. It describes an agent who, at time $t_2$, holds an all-things-considered judgment that $L$ is the better course of action, yet intentionally chooses $S$. Crucially, this judgment is not a relic from $t_1$; it is a judgment held *at the moment of action*. Davidson's principle of continence states that an agent should act in accordance with their all-things-considered judgment. Akrasia is the violation of this principle.

  Hyperbolic discounting cannot accommodate this. In the discounting model, "better" is defined by "more highly preferred at time $t$." If the discount curve dictates that $S$ has a higher subjective value than $L$ at $t_2$, then, by the model's own lights, $S$ *is* the better option at $t_2$. Therefore, the agent cannot judge $L$ to be better at $t_2$ while choosing $S$, unless the agent is miscalculating the discount curve. But akrasia is not a math error; it is a failure of will. By reducing the "good" to "that which is currently most desired," hyperbolic discounting makes acting against one's better judgment logically impossible. It explains why I *want* the donut more than my health at 10 PM, but it cannot explain how I can judge my health to be more important *at 10 PM* and still eat the donut.

  ### The Category Mistake

  The rationalist defense often proceeds by claiming that the philosophical description is the error. When the philosopher says the agent "judges $L$ best," the rationalist hears "the agent's long-term planning module assigns higher value to $L$." When the agent eats the donut, the rationalist says "the agent's immediate gratification module assigned higher value to $S$."

  This is a category mistake. It conflates the *strength of a desire* with the *authority of a judgment*.

  In the strict akratic scenario, the agent acknowledges the pull of the immediate reward but denies its authority. The judgment "I ought to choose $L$" is not a report on the relative magnitudes of current impulses; it is a normative assessment based on reasons (health, prudence, commitment). If hyperbolic discounting were the whole story, the "judgment" would simply track the discounting curve. As the donut gets closer, the judgment would flip to "donut is best." But the phenomenology of akrasia is precisely that the judgment *does not flip*. The dieter looks at the donut, acknowledges it is the most tempting thing in the world, maintains that eating it is a mistake, and eats it anyway.

  Hyperbolic discounting explains the *temptation* (the spike in impulse value), but it does not explain the *surrender* (the action contradicting the maintained judgment). It treats the agent as a locus of competing valuations where the highest valuation always wins. But akrasia is interesting precisely because the "highest valuation" (in terms of reasoned judgment) *loses* to a lower valuation (in terms of impulse). To explain this, one needs a model that allows for a partition in the mind where action is decoupled from evaluative judgment—something the standard discounting model, which assumes action follows maximal discounted utility, explicitly forbids.

  ### Addressing the Eliminativist Rejoinder

  A natural rejoinder from the rationalist camp is eliminativist: *Talk of "judging best while doing otherwise" is just confused folk psychology. There is no such thing as a judgment that floats free of preference. Once we model the time-inconsistent preferences, there is no remainder to explain. The puzzle was a linguistic illusion.*

  This argument claims that because hyperbolic discounting predicts the behavior, the philosophical "puzzle" is dissolved. If "judgment" is just a name for the output of the planning system, and "action" is the output of the motor system driven by the highest current signal, then "akrasia" is just a label for when the motor system ignores the planning system.

  This rejoinder fails for two reasons, one phenomenological and one normative.

  First, phenomenologically, it contradicts the agent's lived experience. The akratic agent does not experience a preference flip; they experience a conflict. If the discounting model were a complete description of the mental state, the agent at $t_2$ would feel wholehearted about eating the donut. They would think, "Given how close it is, this donut is actually the best thing for me right now." But they do not. They think, "I really shouldn't," even as they reach out. The persistence of the contrary judgment during the action is a datum that the discounting model ignores. To say this judgment is "confused" is to privilege the model over the data.

  Second, and more importantly, the eliminativist move destroys the normativity of rationality. If the agent at $t_2$ is simply maximizing their current discounted utility, they are being perfectly rational at $t_2$. We cannot criticize them for being irrational; we can only note that their $t_2$ preferences differ from their $t_1$ preferences. But our concept of weakness of will is inherently critical. We accuse the agent of a failure of rationality, not merely a change of taste. We hold them responsible because we believe they *could have* acted on their judgment.

  If we accept the rationalist gloss, we lose the ability to say the agent *ought* to have done otherwise. We can only say it would have been better for their $t_1$ self if their $t_2$ self had different parameters. This reduces the agent to a bundle of time-slices passing a hot potato of utility functions. It saves the model by sacrificing the agent. A theory of rationality that renders weakness of will impossible by definition is not solving the problem; it is defining it out of existence to preserve the axiom of utility maximization.

  ### Conclusion

  Hyperbolic discounting is an excellent model for **dynamic inconsistency**, but it is not a model of **akrasia**. It explains why our plans change as we approach the moment of truth, but it cannot explain how we act against plans we have not changed. By reducing the "better judgment" to a "long-term preference," the rationalist story converts a synchronic contradiction (judgment vs. action) into a diachronic negotiation (past self vs. present self).

  The philosophical puzzle remains because the eliminativist rejoinder cannot account for the normative force of the judgment that persists during the action. We do not merely regret our past preferences; we condemn our present actions as unjustified even by our present lights. To explain this, we need more than a discount curve; we need an account of how human agency allows action to detach from evaluation. Until then, hyperbolic discounting remains a description of the temptation, but not of the fall.
