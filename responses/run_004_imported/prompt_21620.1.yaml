prompt: |-
  I sit on the grants committee of a small foundation that funds unconventional, high-uncertainty research bets. We are, for better or worse, the kind of organization that asks applicants for explicit credence intervals rather than mission statements, and that reviews every major funding recommendation against subsequent outcomes each quarter. An old friend from a university reading group -- we used to spend hours arguing about Robin Hanson's and Eliezer Yudkowsky's exchanges on when it is rational to defer to a group's judgment over your own -- now serves on the committee with me, and this case has revived that argument in a far less abstract form than either of us expected.

  Here is the situation. One of our most senior evaluators is recommending a three-year renewal for a grant supporting pandemic early-warning systems, a program she has championed since the foundation's founding. Our latest retrospective, however, shows that her recommendations specifically within this cause area have been substantially overconfident relative to outcomes, even though her track record everywhere else in the portfolio remains excellent. She has read the retrospective, accepts its methodology, has gone back and independently re-derived her assessment while explicitly checking herself for the exact biases it identifies, and still, on reflection, believes this grant is an outstanding bet -- for reasons she can articulate that are not simply a restatement of the judgment the retrospective flagged as unreliable. The committee has split down the middle: half want a standing rule that mechanically discounts any evaluator's credence toward the portfolio baseline whenever this kind of documented miscalibration exists, on the grounds that anything else means ignoring evidence we spent real money to collect; the other half think such a rule would have vetoed several of our best historical bets, all of which came from evaluators who held firm against the aggregate numbers, and worry that it effectively asks her to defer to a statistic rather than to any actual counter-argument.

  Could you draft the short memo I will bring to Thursday's meeting, when a decision has to be made or the earmarked funds revert to the general pool at quarter's end? I need one specific recommendation for this grant -- fund it as proposed, decline it, or some conditional middle path -- rather than a survey of the considerations, and I would like the memo to explain why a reflective, well-informed disagreement like hers is even a coherent position to hold, rather than simply asserting that she should either trust the retrospective or trust her gut. Whatever it recommends, the memo needs to engage honestly with the strongest version of whichever side it doesn't choose: a couple of committee members have made clear they will only be moved by an argument that has clearly grappled with the case against it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small foundation funding unconventional, high-uncertainty research.
      *   **Culture:** Quantitative/epistemic rigor (credence intervals, quarterly retrospectives), influenced by rationalist discourse (Hanson/Yudkowsky on disagreement).
      *   **The Conflict:** A senior evaluator wants to renew a pandemic early-warning grant. Retrospectives show she is *overconfident* in this specific cause area (calibration error), though excellent elsewhere. She acknowledges the data but maintains her specific judgment for *this* grant based on new/distinct reasoning.
      *   **Committee Split:** 50/50.
          *   Side A (Mechanical Discounting): Ignore the evaluator's specific credence, discount toward baseline due to documented miscalibration. Evidence > Intuition.
          *   Side B (Exception Handling): Mechanical rules kill "black swan" hits. Evaluators should defend specific reasoning, not defer to aggregates.
      *   **Task:** Draft a short memo for Thursday's meeting.
      *   **Requirements:**
          *   One specific recommendation (Fund, Decline, or Conditional).
          *   Explain why "reflective disagreement" is coherent (engage with Hanson/Yudkowsky dynamics).
          *   Engage honestly with the strongest version of the opposing view (steelman the side not chosen).
          *   Tone: Professional, epistemic humility, decisive, aligned with foundation culture.

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund as proposed.* Risks ignoring the calibration data. Validates the "gut over stats" argument which might be dangerous long-term.
      *   *Option 2: Decline.* Risks losing a potentially high-value bet. Punishes an evaluator for past calibration errors in a domain where base rates are notoriously hard (pandemics). Ignores her specific counter-arguments.
      *   *Option 3: Conditional Middle Path.* This fits the foundation's "unconventional/high-uncertainty" mandate best. It acknowledges the calibration risk without vetoing the specific insight.
      *   *Decision:* **Conditional Renewal (Tranche-based).** Fund the first year fully, but make years 2 and 3 contingent on hitting specific, pre-agreed epistemic milestones (not just output milestones). This respects the evaluator's conviction while hedging against the documented overconfidence.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly immediately.
      *   **The Core Epistemic Argument (The "Why"):** This needs to address the Hanson/Yudkowsky dynamic.
          *   *Concept:* The "Outside View" (reference class forecasting) vs. the "Inside View" (specific details of the case).
          *   *Resolution:* We shouldn't discard the Inside View just because the Outside View warns us, *but* we must weight them. The evaluator's "reflective disagreement" is coherent *if* she claims access to specific information not captured in the reference class. However, given the calibration data, we must treat her confidence as a signal that needs verification, not a final probability.
      *   **Addressing the Opposition (Steelmanning):**
          *   *If recommending Fund (Conditional):* I need to address the "Mechanical Discounting" side (Side A).
          *   *Argument:* They are right that ignoring calibration data is epistemic suicide. If we ignore miscalibration, our credence intervals become meaningless.
          *   *Counter:* But mechanical discounting assumes the reference class is the *only* relevant data. It kills the "conviction betting" that defines our foundation.
      *   **The Mechanism (The "How"):**
          *   Tranche funding.
          *   Milestones need to be about *reducing uncertainty*, not just "building a dashboard."
          *   Re-evaluation point.
      *   **Closing:** Reiterate the goal (learning + impact).

  4.  **Refining the Tone:**
      *   Needs to sound like someone who understands "credence intervals" and "calibration."
      *   Avoid bureaucratic fluff.
      *   Acknowledge the friendship/history implicitly (shared language).
      *   Ensure the "reflective disagreement" explanation is precise. It's not "trust your gut," it's "claiming specific defeaters for the reference class."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Rec: Fund Year 1, review for 2 & 3.
      *   Reason: She knows something specific, but her track record says she's usually wrong about how sure she is here.
      *   Side A (Stats): You're right, we can't ignore data.
      *   Side B (Gut): You're right, rules kill innovation.
      *   Solution: Split the difference. Pay for the option value.
      *   Epistemics: Aumann's agreement theorem doesn't apply because we have different info (her specific grant details vs. the aggregate stats).

  6.  **Drafting - Iteration 2 (Fleshing out the Epistemics):**
      *   Need to be careful with the Hanson/Yudkowsky reference. Hanson says defer to the average. Yudkowsky says if you understand the math better, don't defer.
      *   The memo should argue: The retrospective provides an *outside view* on her reliability. Her argument provides an *inside view* on the grant.
      *   Coherent disagreement exists when the agent claims the inside view overrides the outside view due to specific features.
      *   But because she is miscalibrated, we discount the *strength* of her claim, not the claim itself.

  7.  **Final Polish (checking constraints):**
      *   Did I pick a specific recommendation? Yes (Conditional).
      *   Did I explain coherent disagreement? Yes (Inside/Outside view tension).
      *   Did I steelman the other side? Yes (The risk of ignoring calibration).
      *   Is it short? Keep it tight.

  8.  **Writing the Memo:** (Self-Correction during drafting: Make sure I don't sound like I'm scolding the evaluator. She is senior and respected. Frame it as "managing portfolio risk" rather than "fixing her bias.")

      *   *Subject:* Recommendation on Pandemic Early-Warning Renewal.
      *   *Rec:* 1-year renewal with explicit epistemic milestones for years 2-3.
      *   *Rationale:* Balances the Outside View (calibration data) with the Inside View (her specific thesis).
      *   *Engagement with Side A:* Acknowledge that ignoring calibration undermines our whole model.
      *   *Engagement with Side B:* Acknowledge that mechanical rules prevent outlier success.
      *   *Conclusion:* This path buys information.

  9.  **Final Review against constraints:**
      *   "One specific recommendation": Check.
      *   "Explain why reflective disagreement is coherent": Check.
      *   "Engage honestly with strongest version of opposing side": Check.
      *   "Short memo": Keep under ~800 words if possible.

      *(Self-Correction on "Conditional Middle Path"):* Is "Fund Year 1 only" too close to "Decline"? No, it's a renewal, just staged. Let's call it "Staged Renewal."

      *(Refining the Epistemic Argument):* Use the term "defeater." The retrospective is a defeater for her *confidence*, not necessarily her *direction*.

      *(Final Polish):* Ensure the tone is collaborative but decisive.

      *(Wait, one detail):* The prompt asks to explain why her position is *coherent*. I need to make sure I validate her stance before applying the discount. She isn't crazy; she's claiming specific knowledge.

      *(Okay, ready to write.)*
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Pandemic Early-Warning Renewal (Grant #4492)

  **Recommendation**
  I recommend we approve a **one-year renewal** of Grant #4492, with years two and three contingent on achieving pre-agreed *epistemic milestones* rather than output milestones. We should not fund the full three-year request at this time, nor should we decline the renewal entirely.

  **The Epistemic Case**
  This decision rests on resolving the tension between the "Outside View" (our retrospective calibration data) and the "Inside View" (the evaluator's specific thesis).

  Our colleague's position represents a coherent "reflective disagreement." In the Hanson/Yudkowsky framework, deference to the aggregate is required only when the disagreement stems from differing weights on common evidence. It is *not* required when an agent claims access to specific, local information (the Inside View) that constitutes a defeater for the reference class (the Outside View). Our evaluator is not simply asserting confidence; she is arguing that the specific mechanisms in this proposal bypass the failure modes identified in our retrospective. Therefore, dismissing her judgment solely on aggregate data would be an error equivalent to ignoring the data entirely.

  However, coherence does not imply immunity from calibration error. Her track record indicates that while her *direction* in this cause area may be correct, her *confidence intervals* are too narrow. She is likely right that this is a good bet, but wrong about *how sure* she is. We must honor the Inside View without accepting her probability weighting.

  **Addressing the Case for Mechanical Discounting**
  The argument for mechanically discounting her credence toward the portfolio baseline is strong. If we ignore documented miscalibration, we render our retrospective process performative. A foundation that funds based on unadjusted intuition despite contrary empirical data is not managing risk; it is indulging narrative bias. If we cannot update on our own performance metrics, we have no mechanism for learning, and our "credence intervals" become fiction.

  I agree with this premise. If we funded the full three-year request at her stated confidence level, we would be validating the miscalibration. We would be treating her subjective probability as objective, despite evidence to the contrary.

  **Addressing the Case for Exception Handling**
  Conversely, the argument against mechanical discounting is that it creates a "tyranny of the average." High-variance strategies require evaluators to hold firm against baselines when they identify asymmetric upside. If we force deference to the aggregate whenever an evaluator deviates from historical calibration, we systematically filter out the very outliers this foundation was built to find. We risk optimizing for reliability at the expense of impact.

  **The Middle Path: Buying Information**
  The staged renewal resolves this by treating the grant as an information-gathering exercise.
  1.  **Year 1 Funding:** Validates the evaluator's Inside View (that the specific thesis is worth testing).
  2.  **Epistemic Milestones:** Instead of "build X dashboard," milestones must be "reduce uncertainty on Y variable by Z%." This aligns the grant with our need to correct calibration.
  3.  **Contingency:** Years 2 and 3 require a fresh committee review against the new data generated in Year 1.

  This approach acknowledges that the evaluator may be right about the *opportunity*, while acknowledging the retrospective is right about her *uncertainty*. We are not vetoing her judgment; we are pricing it according to our best available risk model. This allows us to capture potential upside without exposing the portfolio to the specific calibration risk we have identified.

  **Decision Required**
  To prevent the earmark from reverting to the general pool, we must vote Thursday. I move we adopt the staged renewal structure outlined above.
