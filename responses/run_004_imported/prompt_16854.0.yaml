  **Seminar Room 304, 4:15 PM**

  **Rosanna (Supervaluationist):** Look, staring at chip #50 isn't going help. It's borderline. On my view, "Chip #50 is red" is neither true nor false. It's not supertrue. But here's where I need you to meet me: you epistemicists claim there's a sharp boundary somewhere. But aren't you just relocating the vagueness? The standard objection is that supervaluationism pushes vagueness up to the boundary of "admissible sharpenings." It's higher-order vagueness. But you? You push it up to the boundary of *knowledge*. You haven't eliminated the fuzziness; you've just metaphysically hidden it.

  **Tim (Epistemicist):** I haven't hidden it; I've explained it. There is a sharp boundary between red and not-red. Chip #50 is either red or it isn't. Classical logic holds. The vagueness isn't in the world or the truth conditions; it's in our epistemic access. We can't know where the boundary is because of the Margin for Error principle. To know a proposition, your belief must be safe—it couldn't easily be wrong. If you knew #50 was red, you'd have to be able to distinguish it from #51. But you can't. So, you don't know. The cutoff is real; our cognitive grip is just too slippery to catch it.

  **Rosanna:** But apply your margin-for-error logic to itself. Is there a sharp boundary between cases where the margin-for-error principle applies and where it doesn't? You're saying knowledge requires safety. But "safety" is vague. How much margin is enough? If there's a sharp cutoff for *knowability*, then we have a new sorites series for knowledge itself. You've solved the vagueness of "red" by positing a sharp boundary, but now you have the vagueness of "known." You haven't escaped higher-order vagueness; you've just moved it into epistemology.

  **Tim:** Even if "knowledge" is vague, the truth condition isn't. That's the trade-off. I keep classical semantics intact.

  **Rosanna:** At what cost? You're positing a metaphysical fact—a specific chip where redness stops—that is completely undetermined by usage, evidence, or physical properties. It's semantically idle. My view accepts that meaning is indeterminate. The set of admissible sharpenings has a vague boundary, yes, but that matches the phenomenology. You're claiming there's a fact of the matter about chip #50 that is, in principle, inaccessible to anyone, anywhere. That's not ignorance, Tim. That's magic. You're asking us to believe in a sharp line that does no work except to save bivalence.

  **Tim:** It saves logic. Without it, you lose excluded middle.

  **Rosanna:** I save excluded middle for supertruth. But I don't have to posit unknowable metaphysical facts to do it. If your explanation for why we can't know the boundary relies on a vague margin-for-error principle, then your "sharp" ontology is resting on vague epistemological grounds. You're building a crystal house on mud.

  **Tim:** Better mud than no house at all.

  **Rosanna:** Or maybe we just need to admit the house is fuzzy.
