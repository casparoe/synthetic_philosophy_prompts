answer: |-
  Here are ten interview questions designed for your segment on Michael Dummett's political philosophy. The first three address your specific requirements, including the anticipated answers and targeted follow-ups. The remaining seven surface the strongest philosophical objections from opposing camps, grounded in the arguments found in *On Immigration and Refugees* and his related essays.

  ### 1. The Gap Between Theory and History
  **Question:** Professor Dummett, you concede that a state has an *in principle* right to control its borders to maintain social cohesion, yet you argue that no modern state—particularly the UK—has ever exercised this right justly. You've singled out the Commonwealth Immigrants Act 1968 as explicitly racist legislation targeting Kenyan Asians. If the *in principle* right exists, but every historical attempt to exercise it has been tainted by racism, doesn't that suggest the right itself is theoretically sound but practically void? At what point does a right that cannot be exercised without injustice cease to be a right at all?

  *   **Likely Answer:** Dummett will likely maintain that the right is genuine (derived from the requirements of a democratic welfare state) but that current political institutions and public attitudes are too corrupted by xenophobia to wield it legitimately. He distinguishes the *existence* of the right from the *moral capacity* of the agent exercising it.
  *   **Follow-up:** If the moral capacity to exercise this right is absent in the current electorate and government, does your position imply that we must prioritize moral education over legislation for a generation? Or are you arguing that, until that purification occurs, we must act *as if* the right does not exist, effectively granting open borders by default?

  ### 2. The Refugee vs. Economic Migrant Distinction
  **Question:** A central pillar of your argument is the moral distinction between refugees, who flee persecution and must be admitted, and economic migrants, who seek betterment and may be turned away. However, critics point out that motives are rarely so pure. A farmer fleeing drought caused by unjust global trade policies, or a family fleeing gang violence that the state won't curb, sits in a grey area. If we accept that global economic structures often coerce migration just as political persecution does, can your bright-line legal distinction bear the moral weight you place on it, or does it inadvertently protect wealthy nations from the consequences of their own foreign policies?

  *   **Likely Answer:** Dummett typically argues that while the line is sometimes blurry, a legal system requires clear categories to function. He would likely insist that the primary duty is to the persecuted, and that expanding the definition of "refugee" too broadly risks undermining the protection for those in immediate mortal danger.
  *   **Follow-up:** But if administrative convenience is the reason for maintaining that bright line, are we not prioritizing the bureaucracy of the host state over the moral reality of the migrant? If the "economic" pressure is as life-threatening as the political pressure, does your distinction not risk becoming a tool for excluding those to whom we owe the greatest debt?

  ### 3. Activism vs. Philosophical Concession
  **Question:** You spent decades campaigning against restrictive immigration laws, co-founding the Joint Council for the Welfare of Immigrants to fight acts like the 1968 legislation. Yet, in your philosophical writing, you grant that restriction is legitimate in principle. Some activists worry that conceding the *principle* of border control disarms the political fight against specific restrictions, as it validates the state's authority to exclude. How do you reconcile your willingness to grant the state this theoretical power with a political career spent denying them the practical ability to use it?

  *   **Likely Answer:** Dummett valued intellectual honesty above political expediency. He would likely argue that lying about the principle to win a political battle is philosophically indefensible and that the fight must be won on the grounds that *this* exercise of power is unjust, not that the power is nonexistent.
  *   **Follow-up:** Does that commitment to honesty risk legitimizing the arguments of restrictionists who quote your philosophical work to justify policies you find abhorrent? If your theoretical concession provides the ammunition for the racism you campaign against, have you not created a dangerous inconsistency between your role as a philosopher and your role as an activist?

  ### 4. The "Open Borders" Objection (Joseph Carens)
  **Question:** Philosophers like Joseph Carens argue that freedom of movement is a basic human right, akin to freedom of religion or speech, and that borders are morally arbitrary feudal remnants. By grounding your defense of immigration in the specific needs of the *welfare state* and *social trust*, rather than a universal right to movement, aren't you conceding too much to the nation-state model? Why should the accident of birthright determine one's life chances if, as you admit, the exclusion is often driven by prejudice rather than genuine economic necessity?

  ### 5. The "Restrictionist" Objection (Transparency)
  **Question:** On the other side, restrictionists argue that your position is disingenuous. If you argue that the bar for a "just" restriction is so high that no existing government can clear it, you are effectively arguing for open borders while refusing to say so. Why not be transparent? If the *in principle* right is never exercisable in the real world, isn't it more honest to tell the public that sovereignty over borders is a moral illusion, rather than a right they possess but must never use?

  ### 6. The Colonial Debt Argument
  **Question:** You have acknowledged that the UK has special obligations to citizens of the Commonwealth due to the history of Empire. However, your framework treats this as a specific, contingent duty rather than a fundamental challenge to the right of exclusion. If the wealth and stability of the host nation were built upon the extraction of resources from the nations the migrants are fleeing, does this not transform the "right to control borders" into a right to protect stolen goods? Shouldn't the colonial debt negate the right to exclude entirely for citizens of former colonies?

  ### 7. The Empirical Claim on Social Cohesion
  **Question:** Your justification for the *in principle* right to restrict relies heavily on the empirical claim that a high level of social trust and shared identity is necessary to sustain a welfare state and democratic institutions. However, sociological data on this is mixed; some studies suggest diversity can coexist with high trust, while others suggest it strains it. If future evidence showed that diverse societies sustain welfare states just as well as homogeneous ones, would your philosophical justification for border control collapse entirely?

  ### 8. Global Causality and Poverty
  **Question:** You distinguish between those fleeing persecution and those fleeing poverty. But in a globalized economy, the poverty of the Global South is often causally linked to the wealth of the Global North through trade rules, debt structures, and resource extraction. If the host state is partially responsible for creating the "economic migrant," does the distinction between "persecution" and "betterment" hold? If we cause the famine, are we not morally equivalent to the political persecutor, regardless of our intent?

  ### 9. The Definition of the "Demos"
  **Question:** You argue that existing citizens have the right to determine the character of their community. But who counts as "existing citizens"? If the current demos decides to exclude outsiders who would likely vote for different policies or support different cultural values, isn't this a form of self-perpetuating gerrymandering? How do you prevent the "right to control immigration" from simply becoming a right for the current majority to freeze their own cultural and political dominance in place indefinitely?

  ### 10. The Positive Vision of a Just Policy
  **Question:** Most critiques focus on what you oppose, but I want to ask about what you permit. If a government were to purge its institutions of racism and cultivate the necessary social trust, what would a *just* immigration policy actually look like in your view? Are there specific numbers, quotas, or criteria that would satisfy your conditions for a legitimate exercise of the state's right to exclude, or is the "just policy" a regulatory ideal we can approach but never fully realize?
