      *   **The "Paradox":** Why do people avoid info?
      *   **Key Distinction:** Good's Theorem assumes *instrumental* value (info helps you make a better *decision*). It does *not* account for *intrinsic* utility/disutility of the information itself (e.g., anxiety, hope, disappointment).
