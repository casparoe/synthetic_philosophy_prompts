answer: |-
  You have spotted something that most secondary literature glosses over, and your instinct is correct: the passage you quoted (the "Quality-Relation Circle") is technically distinct from the famous "Bradley's Regress" (the "Relating Relation Regress"), though they are twin pillars of the same attack on pluralism.

  The confusion you feel is warranted because Bradley's prose in *Appearance and Reality* is deliberately dialectical and often piles arguments on top of one another to create a sense of suffocation rather than linear proof.

  Here is the breakdown of why Bradley thinks the circle is vicious, how it differs from the regress, and why Russell lost sleep over it.

  ### 1. Why is Mutual Presupposition "Vicious" and not just "Holistic"?

  You asked: *What's the extra step that turns "these two need each other to exist" into "these two are incoherent"?*

  For a modern coherentist or a structuralist, mutual dependence is fine. Things can be defined by their place in a web. But Bradley is an **Absolute Idealist** working in a tradition that demands **intelligibility**. For Bradley, for something to be "Real" (capital R), it must be self-contained and non-contradictory. It must be intelligible *in itself*.

  The "viciousness" comes from the order of explanation.
  1.  **Relation requires Terms:** You cannot have a relation (e.g., "to the left of") without things to relate (terms).
  2.  **Terms require Quality:** For a term to be a term, it must have some nature or quality (otherwise it is nothing).
  3.  **Quality requires Relation:** For a quality to be identifiable, it must be distinguished from other qualities. Distinction is a negative relation (A is *not* B). Furthermore, a quality must inhere in a substance, which is a relation.

  **The Trap:** If you ask, "What is the foundation of reality?"
  *   If you say **Quality**, Bradley says: "Quality is unintelligible without Relation (distinction)."
  *   If you say **Relation**, Bradley says: "Relation is unintelligible without Quality (terms)."

  If A cannot be understood without B, and B cannot be understood without A, then **neither can be understood at all.** It is not just that they coexist; it is that neither has *ontological priority*. For Bradley, if you cannot ground one without the other, you haven't grounded anything. You have a floating structure with no anchor. Since Reality must be anchored (the Absolute), this relational structure is merely "Appearance."

  So the "extra step" is Bradley's demand for **unconditioned reality**. Holism accepts the web; Bradley demands to know what the web hangs on.

  ### 2. Is this the same as "Bradley's Regress"?

  You suspected these might be separate arguments lumped together. **You are right.**

  *   **Argument A (The Passage You Quoted): The Circle of Quality and Relation.**
      *   *Target:* The intelligibility of the *terms* of a relation.
      *   *Claim:* You can't even get the relata (the things being related) off the ground because their identity depends on the very relations they are supposed to support.
      *   *Location:* Early Chapter 3.

  *   **Argument B (The Famous Regress): The Regress of Relating Relations.**
      *   *Target:* The act of *relating* itself.
      *   *Claim:* Even if you grant me terms $a$ and $b$ and a relation $R$, how does $R$ actually *connect* to $a$ and $b$? If $R$ is a distinct entity (which it must be to be a term in a proposition), it needs a further relation $R'$ to tie it to $a$. Then you need $R''$ to tie $R'$ to $R$, ad infinitum.
      *   *Location:* This is often extracted from later in Chapter 3 (and Chapter 4), but it was **Bertrand Russell** who formalized it into the canonical "Bradley's Regress" we know today.

  **How they work together:**
  Argument A tries to show you can't have the *nodes*. Argument B tries to show you can't have the *edges*. Together, they aim to prove that a universe composed of distinct things standing in external relations is logically impossible.

  ### 3. Why Russell Cared: The Unity of the Proposition

  You asked why Russell took this seriously enough to shape analytic philosophy.

  Russell was trying to save logic and mathematics from Idealism. He wanted to say that "A loves B" is a fact about the world, not just a fragment of the Absolute.

  Bradley's argument strikes at the **Unity of the Proposition**.
  Consider the proposition: *Socrates is wise.*
  *   List of constituents: {Socrates, Wisdom}
  *   Proposition: <Socrates is wise>

  What is the difference between the list and the proposition? The list is just two things sitting next to each other. The proposition asserts something; it has **unity**. There must be a "copula" or a "tie" that holds Socrates and Wisdom together.

  Bradley's Regress says: If that "tie" is just another object (another term), then you have {Socrates, Wisdom, Tie}. Now you need a *new* tie to hold the Tie to Socrates. You never get unity; you just get an infinite list.

  **Russell's Move:**
  Russell realized that to defeat Bradley, he had to bite a very hard bullet. He had to argue that **relations are real, external, and do not require a further relation to relate them to their terms.**

  For Russell, the relation $R$ in $aRb$ is not a third term that needs gluing. It is *essentially* relating. It is "unsaturated" (to borrow Frege's term). Russell accepted that this was a "brute fact" of logic. He essentially said, "Bradley is right that if relations were just objects, we'd have a regress. But relations aren't objects. They are fundamental. Stop asking how they hook on; they just do."

  This was the birth of the analytic rejection of Idealism. Russell's *The Principles of Mathematics* (1903) is basically a long footnote to his battle with Bradley's ghost.

  ### 4. Is Bradley Equivocating?

  Your hunch about equivocation is sharp.

  Bradley treats "Quality" as something intrinsic and non-relational, and "Relation" as something external connecting two things.
  *   When he says **Quality needs Relation**, he means "To be identified, a quality must be distinguished from others." (Relation as *difference*).
  *   When he says **Relation needs Quality**, he means "To connect, a relation must connect specific natures." (Relation as *connection*).

  Critics (like Russell and G.E. Moore) argued Bradley was conflating **internal relations** (constitutive of the nature of a thing) with **external relations** (accidental connections between things).
  *   If relations are internal, then yes, changing the relation changes the quality.
  *   If relations are external, a thing can keep its quality while entering new relations.

  Bradley denies external relations are real. He thinks *all* relations are ultimately internal to the Absolute. So when he argues against relations, he is arguing that the *plurality* required for external relations is an illusion. He isn't necessarily equivocating by accident; he is arguing that the distinction between "intrinsic quality" and "external relation" collapses under analysis.

  ### Summary for your argument with your friend

  1.  **The Text:** The passage you found is the **Quality-Relation Circle**. It argues that neither terms nor relations can be ontologically fundamental because they define each other.
  2.  **The Regress:** The famous **Bradley's Regress** is a separate (though complementary) argument about the impossibility of *connecting* terms without an infinite chain of connectors.
  3.  **The Stakes:** Bradley uses both to argue that **Relations are Appearance, not Reality.** Reality is One (The Absolute).
  4.  **Russell's Counter:** Russell accepted the Regress was valid *if* relations are treated as objects. His solution was to posit relations as fundamental, non-object entities that provide the "unity of the proposition" without needing further glue.

  You didn't make a rookie mistake reading the primary text; you made the advanced move of noticing that the "two-line gloss" hides a much messier, two-pronged attack. Bradley is harder to refute than the internet summary suggests, which is why Russell spent decades refining the refutation.
