answer: |-
  Here are ten questions designed for a graduate-level colloquium, including the three specific thematic requirements and the required closing question. Each includes a follow-up tailored to the speaker's most probable defense.

  **1. The Smoking Lesion Distinction**
  Standard objections to Evidential Decision Theory (EDT) often hinge on spurious correlations, such as in the Smoking Lesion problem, where an agent manages the news rather than the outcome. ECL relies on a correlation between your decision and that of distant, acausally linked agents. What structural feature distinguishes the ECL correlation from the Smoking Lesion correlation to ensure we aren't merely "managing the news" of the multiverse's cooperativeness without actually influencing expected value?
  *Follow-up:* If she appeals to Logical Decision Theory (LDT) or functional identity to distinguish the cases, ask: "Does that distinction hold if the physical implementation of the reasoning process diverges significantly—for example, if the distant agent uses a heuristic approximation of your algorithm rather than an exact copy?"

  **2. Epistemic Access to Unobservables**
  ECL calculations require assigning credences to the distribution of value systems and decision procedures in regions of the universe we can never causally access. Beyond a raw Principle of Indifference, what justifies a specific prior over the axiological landscape of unobservable agents? How do we avoid the parameterization dependence problems that typically plague indifference principles in infinite spaces?
  *Follow-up:* If she suggests we should use a "natural measure" over physical states, ask: "Given that values supervene on physical states in potentially complex ways, how do we establish a mapping that doesn't bias the measure toward value systems compatible with our own local physics?"

  **3. Asymmetry vs. Superrationality**
  Hofstadter's superrationality typically assumes symmetric players facing identical payoff matrices. ECL claims to generalize this to agents with different value systems and asymmetric leverage. Once we remove the symmetry assumption, what grounds the evidential link? Specifically, why should my cooperation evidence *their* cooperation if our utility functions rank the outcomes differently?
  *Follow-up:* If she argues that the correlation lies in the *reasoning process* rather than the *outcome valuation*, ask: "If the reasoning process recommends different actions due to divergent valuations, does the evidential link snap, or does ECL require us to cooperate even when our respective decision procedures diverge on the optimal move?"

  **4. The Reference Class Problem**
  To calculate the expected value of ECL, I must define the reference class of "relevantly similar reasoners." If I define the class too narrowly, the gains from trade vanish; too broadly, and I risk correlating with agents whose decision procedures are too noisy to be reliable. Is there a non-arbitrary way to draw this boundary, or is ECL inherently sensitive to gerrymandered reference classes?
  *Follow-up:* If she proposes a functionalist definition of similarity, ask: "How do we weight the similarity? Is a 90% functional match with a high-stakes agent more evidentially significant than a 99% match with a low-stakes agent?"

  **5. Acausal Extortion Risks**
  If we accept acausal evidential links for cooperation, does this not also open the door to acausal extortion? If a malicious agent in a large world threatens to disvalue my local outcomes unless I submit, does ECL compel me to pay the ransom to evidence their decision to not carry out the threat?
  *Follow-up:* If she argues that we should precommit to ignoring extortion, ask: "Doesn't that precommitment also lower the probability of successful cooperation with benevolent agents, given that the same evidential channel transmits both my capacity to cooperate and my capacity to resist?"

  **6. Inter-Theoretic Utility Comparison**
  ECL presupposes we can compare utility units across different value systems to determine if cooperation is net-positive. Even if we accept the evidential link, how do we solve the problem of inter-theoretic comparison? What is the exchange rate between, say, hedonic utilitarianism and lexical deontology in a multiversal trade?
  *Follow-up:* If she suggests a "veil of ignorance" approach to set exchange rates, ask: "Doesn't that merely push the problem back a step, requiring us to assign credences to the correctness of those meta-ethical frameworks, which we arguably have even less evidence for than the agents' existence?"

  **7. Bounded Rationality and Computational Cost**
  ECL reasoning appears computationally expensive, requiring simulations of how distant agents might reason about me. For bounded agents like humans, isn't the cost of calculating the ECL prescription likely to outweigh the marginal expected gain from acausal trade, rendering it theoretically sound but practically inert?
  *Follow-up:* If she argues that heuristics can approximate the calculation, ask: "How do we ensure the heuristic doesn't introduce systematic biases that systematically favor defection or exploitation under the guise of cooperation?"

  **8. Temporal and Indexical Uncertainty**
  In a large world, there may be multiple copies of "me" at different times or with slightly different histories. When I make a decision, which copy's decision am I evidentially linking to? Does ECL require a specific resolution to indexical uncertainty (e.g., SSA vs. SIA) to function, and if so, does the theory stand or fall with that anthropic assumption?
  *Follow-up:* If she claims ECL is robust across anthropic frameworks, ask: "Can you demonstrate a case where the prescription for cooperation flips depending on whether one adopts SSA or SIA, given the same large-world cosmology?"

  **9. Value Drift and Endorsement**
  If ECL is correct, it seems to incentivize agents to modify their own value systems to be more "cooperative" or easily satisfied by distant agents to maximize multiversal value. Does ECL endorse this kind of value drift, and if not, how do you distinguish between legitimate cooperation and selling out one's core axiology for evidential gain?
  *Follow-up:* If she argues that core values should remain stable, ask: "If my core values dictate maximizing my local outcome regardless of acausal links, doesn't ECL effectively demand I violate my current decision procedure to satisfy a meta-decision procedure I don't currently hold?"

  **10. Defeasibility and Evidence**
  (Closing Question) Finally, setting aside the possibility that the large-world cosmology itself turns out to be false, what could count as evidence against *acting* on ECL? Is there any empirical observation or theoretical update short of cosmic finitude that would lower your credence in the normative force of ECL sufficiently to revert to causal decision theory?
  *Follow-up:* If she suggests that a proof of acausal isolation would count, ask: "Given that acausal isolation is arguably metaphysically necessary if true, is there any *contingent* evidence we could encounter in our light cone that would rationally update us against ECL?"
