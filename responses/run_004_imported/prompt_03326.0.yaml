prompt: |-
  ok so i got into a whole argument with my friend last night about moral uncertainty. she's big on the "maximize expected choiceworthiness" approach, and i said the problem is you can't actually compare how bad or good something is across theories — like theres no shared unit between "3 units of Kantian wrongness" and "3 units of utilitarian wrongness," so the whole expected-value calculation is kind of made up. she brought up Bostrom's moral parliament idea as the fix — each theory sends delegates in proportion to your credence in it, and the delegates bargain and trade votes across different issues instead of just voting straight up. i said that doesn't solve the comparison problem, it just relocates it into "how hard is this delegate willing to bargain," but she wasn't having it and we never got anywhere.

  can you write me a short story actually set inside one of these parliaments? like literalize the metaphor — a handful of delegates representing different theories, seats weighted by credence, an actual decision on the table, and have the vote-trading (giving up stuff you don't care much about to win big on stuff you do) really happen on the page instead of just getting explained. i want the incomparability thing i mentioned to actually bite as a plot problem, not just show up as a line someone says. bonus points if one delegate's theory has some absolute non-negotiable rule and just refuses to trade at all — curious what that does to everyone else's plans. doesn't need to be long.
