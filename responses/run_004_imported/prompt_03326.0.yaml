answer: |-
  The Chamber of Conscience smelled like ozone and old paper. It was a circular room, the floor tiled in percentages. At the center hovered the Motion: *Authorization of Expenditure: $4,000 for Emergency Vehicle Repair.*

  Millie sat in the Utilitarian bloc. She occupied 45% of the seats, a sprawling section that buzzed with calculators and spreadsheets. She was tired. She had run the numbers a thousand times. That $4,000 could save 0.8 lives if donated to the Malaria Fund. Keeping the car was a net negative for the world.

  Across the aisle, in the 40% block, sat Immanuel. He wore a stiff, high-collared coat that never seemed to gather dust. He was polishing a gavel that looked suspiciously like a categorical imperative.

  In the remaining 15%, slouched in a beanbag chair, was Ego. He was eating a sandwich that manifested out of thin air. "I need the car," Ego mumbled through a mouthful of ham. "Otherwise I can't get to work. If I don't get to work, I'm sad. Sadness is bad."

  "Starving children are sadder," Millie snapped, not looking up from her ledger. She turned to Immanuel. "Okay, Immy. Here's the deal. You vote *No* on the Repair. In exchange, on next Tuesday's Motion regarding *'Lying to Aunt Sarah about her haircut,'* I will instruct my bloc to abstain. You get your truth-telling victory. I get my malaria nets."

  Immanuel stopped polishing. He looked at her with eyes that seemed to focus on something infinitely distant. "You propose a trade."

  "I propose logrolling," Millie corrected. "Standard parliamentary procedure. You care about Truth. I care about Welfare. We swap jurisdiction. It maximizes the expected choiceworthiness of the Agent's actions over time."

  Immanuel placed the gavel down. It made a sound like a tomb sealing. "You speak as though Truth has a price."

  "It has a *weight*," Millie said, exasperated. "You have 40% of the vote. I have 45%. If we coalition, we control the Agent. If we don't, Ego might swing it with Arista's proxy on 'Personal Projects.' Just tell me: is the Haircut Lie worth more or less than the Car Repair?"

  Immanuel stood up. The air in his section of the room grew cold, rigid. "The duty to refrain from falsehood is perfect. It is not a commodity to be bartered against consequences. I cannot 'sell' my vote on the Haircut, because my vote on the Haircut is not mine to give. It belongs to the Law."

  Millie slammed her hand on the desk. "This is exactly the problem! If you won't trade, the market doesn't clear! We can't establish an exchange rate between your 'Duty' and my 'Utils.' How many lies equal one life? If you won't give me a number, I can't calculate the expected value!"

  "Then your calculation is flawed," Immanuel said softly. "You are trying to measure the weight of a soul using a ruler."

  "Fine. Forget the Haircut." Millie scrambled for a new angle. "What about the *Promise*? Next week, the Agent promises to meet a friend for coffee. He'll be tired. Breaking the promise causes minor annoyance. Keeping it causes fatigue. I want to break it to work more. You want to keep it to honor the word. I'll give you the Coffee Vote. You give me the Car Vote."

  Immanuel considered this. "Honoring a promise is a duty."

  "Exactly! So vote *No* on the Car (which is merely supererogatory for you, right? You don't *have* to donate the money), and I'll guarantee you get to keep the Coffee Promise."

  "It is not merely a transaction," Immanuel said, his voice gaining a harmonic distortion that made Millie's calculators glitch. "If I vote based on the *outcome* of securing the Coffee Promise, I am acting consequentially. I am corrupting the motive of my own vote. To vote for the Car *in order to* secure the Coffee is to treat the Coffee as a reward for moral behavior. That is immoral."

  Millie stared at him. The numbers on her screens began to scramble. *Error: Incommensurable Units.*

  "So you won't trade," she said.

  "I cannot trade. A duty is not a chip. It is a vector. It has direction, not magnitude."

  "Then you're useless!" Millie shouted. "If you won't trade intensity, if you won't say 'I care *this much* about Truth compared to Welfare,' then we're paralyzed. The Parliament model assumes we can bargain. But you... you're a black hole. You swallow votes and give nothing back."

  "I give Integrity," Immanuel said.

  "Integrity doesn't fix the transmission!" Ego yelled from the beanbag. "Hey, Millie. I'll trade you. I'll vote *No* on the Car. You let me buy the video game next month."

  Millie looked at Ego. "How much utility is the video game?"

  "Like, 500 Hedons."

  "And the Car?"

  "2,000 Hedons."

  "So you're voting against your own interest?"

  "I'm bored. I want to see what happens."

  Millie rubbed her temples. She had the Egoist's vote, maybe. But she needed Immanuel's block to make it look like a moral consensus, to stabilize the Agent's psyche. Without Immanuel, the Agent would feel guilty even if they donated the money. With Immanuel, if they bought the car, the Agent would feel sinful.

  "Immanuel," Millie tried one last time. "Look at the Motion. *Emergency Repair.* If he doesn't fix it, he can't drive. If he can't drive, he can't visit his mother in the hospital. Isn't there a duty to care for family?"

  Immanuel paused. For a second, the cold air warmed. "There is."

  "Okay! So vote *Yes* on the Car. Not because of consequences, but because of Duty to Family. I'll withdraw my opposition."

  "I must evaluate the maxim," Immanuel murmured, closing his eyes. "Can I will that everyone repairs cars to visit mothers? Yes. But... is the money obtained ethically? Was the tax paid correctly on the income used for the repair?"

  "Who cares?" Millie screamed. "The credence weights are shifting! The Agent is waking up!"

  The room began to shake. The tiles on the floor blurred. The Motion hovered lower, pressing down on them.

  "I cannot vote until I am certain the maxim is universalizable," Immanuel said, sitting back down and picking up his gavel. "I will not trade certainty for speed."

  "We don't have time for certainty!" Millie grabbed her stack of utility calculations and threw them at him. They passed through his coat like ghosts. "There is no common currency, Immy! You were right! I can't buy you because you don't sell! And I can't sell to you because you don't buy!"

  "Then the Parliament is dissolved," Immanuel said.

  The bell rang. The voting booths locked.

  Millie looked at her 45%. Ego looked at his 15%. Immanuel sat with his 40%, arms crossed, a fortress of one.

  Without the trade, the votes were just numbers. They didn't add up to a decision; they added up to a conflict. The Agent wouldn't donate the money. He wouldn't fix the car. He would sit in the driveway, engine dead, wallet full, paralyzed by a civil war where the opposing sides spoke different languages.

  "Great," Millie whispered, watching the Chamber fade into the gray fog of morning consciousness. "We didn't maximize value. We just achieved stalemate."

  Immanuel didn't answer. He was already polishing the gavel again, preparing for a vote that would never come.
