      *   *Scene 4: The Egoist.* Ego tries to trade with Millie. "I give you the car vote, you give me the 'lie to boss' vote." Millie calculates utility.
      *   *Scene 5: The Breakdown.* The bell rings. The decision must be made. Because Kant won't trade, the "market" fails. The credence weights don't translate to power because power requires fungibility.

  6.  **Refining the "Incomparability" Moment:**
      *   I need to make sure the reader *feels* the frustration of not being able to compare values.
