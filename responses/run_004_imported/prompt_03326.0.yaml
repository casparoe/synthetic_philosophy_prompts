      *   The Issue: Needs to be something where theories diverge. Classic trolley problem is too cliché. Maybe something about lying to protect feelings vs. honesty, or donating money vs. keeping it. Let's go with: *Donating a significant portion of savings to an effective charity vs. buying a needed car.* It pits Utilitarianism (maximize good) against Special Obligations/Egoism (care for self/family) against Deontology (rights/duties).

