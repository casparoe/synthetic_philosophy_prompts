answer: |-
  Here is the grading breakdown based on the rubric provided and standard AP Biology/Signaling Theory expectations. I've graded this as a strict TA would: focusing on conceptual accuracy and adherence to the specific lecture points mentioned in the prompt.

  ### **Category Breakdown**

  **1. Explains why a cheap/costless signal can't stay honest**
  **Score: 5/5**
  **Justification:** Priya correctly identifies the core game-theory problem: without cost, low-quality individuals have the incentive to deceive ("lie"), which devalues the information until receivers ignore it. She clearly explains the collapse of the signaling system.

  **2. Correctly states cost conditions & history (Zahavi vs. Math)**
  **Score: 3/5**
  **Justification:** She correctly explains the biological condition (cost must be prohibitive for low-quality but affordable for high-quality). However, she fails the history requirement explicitly mentioned in your teacher's notes. She claims Zahavi "worked out the math" in 1975 and convinced skeptics then. In reality, Zahavi's 1975 paper was largely rejected for over a decade until Alan Grafen provided the mathematical proof in 1990.

  **3. Correctly distinguishes "handicap" from "index signal"**
  **Score: 2/5**
  **Justification:** This is the weakest section. She states they are different but then defines a *handicap* (metabolically expensive, predation risk) and explicitly labels it an *index*. She never actually defines what an index is (a signal physically constrained by body structure, e.g., vocal pitch tied to larynx size). Misidentifying the peacock's tail—the classic textbook example of a handicap—as an index is a major conceptual error.

  **4. Examples accurate and evaluated against (b) and (c)**
  **Score: 3/5**
  **Justification:** The "Promposal" is a creative and valid analogy for a costly handicap in humans. However, the Peacock example is evaluated based on her incorrect definition from part (c). Because she labeled the peacock an index, her evaluation of whether it "satisfies (c)" is factually wrong, even if her reasoning about cost is biologically sound.

  ---

  ### **Total Score: 13/20**
  ### **Letter Grade: C- (65%)**

  ---

  ### **🚩 Flat-Out Errors (Tell Priya These)**
  Even beyond the rubric, there are two factual errors here that will hurt her if this concept appears on a multiple-choice section or a future exam:

  1.  **Peacocks are Handicaps, not Indexes:** This is the big one. An **Index Signal** is impossible to fake because of physical constraints (e.g., a Red Deer's roar depth is tied to the size of their larynx, which is tied to body size; a small deer *cannot* make a deep roar no matter how hard they try). A **Handicap** *can* be faked physically, but it's too costly to do so (e.g., a weak peacock *could* grow a big tail, but it would die from predation or starvation before mating). Priya described a handicap but called it an index.
  2.  **The Math History:** Zahavi proposed the *idea* in 1975, but he did **not** prove the math. The biological community rejected his idea for ~15 years because they thought it was mathematically unsound. It wasn't until **Alan Grafen (1990)** modeled it using game theory that it was accepted as an Evolutionarily Stable Strategy (ESS). Priya has the timeline backwards.

  ---

