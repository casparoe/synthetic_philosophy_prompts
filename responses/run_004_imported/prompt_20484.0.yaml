  The clink of Alsop's fork against his plate sounded like a gavel. He pushed the roast lamb away, wiping his mouth with a cloth napkin.

  "They're cutting off fingers, Mireille. Not in a hospital. In a shed behind the textile mill."

  "They're signing waivers," Mireille said, swirling her wine. "Competent adults. No coercion. No public nuisance."

  "It shocks the conscience of the community." Alsop leaned back, the wood of his chair creaking. "And the law has always respected the conscience of the community. Devlin was right on that, if nothing else. Society is held together by invisible threads. Shared morality. When you sever them, even in private, the fabric loosens."

  "Disgust isn't a metric, Judge. It's a reflex." Mireille set her glass down hard. "Hart proved that. Just because the man on the Clapham omnibus feels sick doesn't mean the state has a mandate to intervene. If I want to scar my skin or remove a healthy limb, and I hurt no one else, my morality is mine. Not the parish council's."

  "It's not about nausea. It's about intolerance." Alsop's eyes were sharp, despite the age spotting his hands. "Devlin argued that intolerance is a seismic reading. If people feel that strongly, it means a boundary has been crossed. It means the shared bond is under stress. The law isn't just a referee; it's a guardian."

  "So we legislate based on panic?" Mireille leaned forward. "You're saying the intensity of the outrage is evidence of the crime? That's mob rule with a wig on."

  "I'm saying morality isn't arbitrary. It's evolutionary. It's what keeps us from tearing each other apart."

  "Show me," Mireille said. "Show me one society that collapsed because a private group decided to modify their bodies. Devlin assumes disintegration is inevitable. Where's the empirical data? Rome didn't fall because of scarification. London didn't burn because of consensual fasting."

  Alsop smiled, a thin, weary expression. "You don't wait for the bridge to fall to stop cutting the cables, Mireille. By the time you have your empirical data, the structure is gone. The law operates on prevention. If you allow the principle that the body is entirely disposable property, where does it stop? Selling organs? Voluntary slavery? The line blurs."

  "The line is consent," she countered. "It's the only line that matters. Once you start banning things because they're 'immoral' rather than harmful, you give the state a blank cheque. Today it's amputations. Tomorrow it's who you sleep with. Or what you pray."

  "And if the community decides that certain freedoms are too expensive for the collective peace?" Alsop poured more wine, his hand steady. "You talk about liberty like it's a vacuum. It isn't. It lives in a context. If this club stays open, half the town will feel unsafe in their own homes. Not because they'll be touched, but because the normalcy they rely on is poisoned. Is that feeling nothing?"

  "It's evidence of prejudice, not harm."

  "It's evidence of cohesion," Alsop said softly. "And cohesion is a form of safety. You want to protect their right to be deviant. I'm protecting the town's right to remain intact."

  "You're protecting their comfort at the cost of their neighbours' autonomy."

  "And you're risking the neighbours' autonomy for a principle that might leave us with no community left to protect."

  Mireille opened her mouth, then closed it. She picked up her fork, but didn't eat. Alsop watched her over the rim of his glass, the silence stretching between them, heavy and unresolved.
