answer: |-
  **Setting:** *Rochester, New York. Late autumn, 1855. The back room of Frederick Douglass's printing office for "The North Star." The air is thick with the smell of ink and coal smoke. A fire crackles in the hearth. On the table between them lies a leather-bound copy of the United States Constitution.*

  **Characters:**
  *   **Frederick Douglass:** Now 37 years old. His voice is deep, resonant, and controlled. He has moved away from William Lloyd Garrison's disunionism and now advocates for political action within the Constitutional framework.
  *   **Wendell Phillips:** The "Golden Trumpet" of abolition. A staunch Garrisonian. He believes the Constitution is a pro-slavery compact and that the North should secede from the Union ("No Union with Slaveholders").

  ***

  **Wendell Phillips:** (Gesturing to the book on the table) You keep it on your desk now, Frederick? Like a holy text? I recall a time when you agreed with Mr. Garrison that it was fit only for the flames.

  **Frederick Douglass:** I recall it too, Wendell. I recall standing on the Massachusetts shore when Bill burned his copy. I cheered him then. I believed, as he did, that a document that bargained for human flesh was a covenant with death. But I have learned that burning the map does not change the terrain.

  **Phillips:** It isn't the map, Fred. It's the foundation. You cannot build a house of liberty on a foundation of chains. The Constitution explicitly protects the slaveholder. The three-fifths clause gives the South extra representation for the very souls they keep in bondage. It is a mathematical engine for oligarchy. How can you swear an oath to support *that*?

  **Douglass:** Because the text does not say what you think it says. Read it, Wendell. Open it. Where is the word "slave"? Where is the word "slavery"?

  **Phillips:** (Scoffs) Euphemisms do not hide the sin. "Persons held to service or labor." We all know what that means. It means property in man. The framers were too ashamed to write the word, but they wrote the law. They protected the trade for twenty years. They demanded the return of the fugitive. To argue over semantics is to play the lawyer while the client bleeds.

  **Douglass:** It is not semantics! It is the difference between a disease and the symptom. If the Constitution names slavery, it recognizes it as a legitimate institution. By refusing to name it, by speaking only of "persons," the law leaves the door open for us to walk through. The preamble says "We the People." It does not say "We the White People." It offers the blessings of liberty to *all*. The slaveholders have hijacked the engine, yes. But that does not mean the engine was built to drive off a cliff.

  **Phillips:** You speak of hijacking. I speak of complicity. When you vote under this Constitution, when you seek office under this flag, you are putting your hand on the lash. You are telling the slave, "I will work within the system that owns you." It moralizes the government. It makes the North a partner in the crime. Garrison is right: the only moral act is dissolution. Let the Union break. Let the North wash its hands of the South's blood.

  **Douglass:** And leave the slave where?

  **Phillips:** (Pauses) To his own struggle. And to the moral pressure of a free North that refuses to be his jailer.

  **Douglass:** That is a luxury of the free man, Wendell. To say, "I will not soil my hands," while the slave remains in the fire. If the Union dissolves, the border states fall to the South. The fugitive slave laws become international treaties between two nations. There is no more underground railroad, because it is no longer underground; it is a border crossing into a foreign country that wants you back. By staying in the Union, we claim the federal power for liberty. We can use the very courts you despise to choke the institution.

  **Phillips:** You trust the courts? The same Dred Scott court that will soon tell you that black men have no rights which white men are bound to respect? You are betting on a tool that is already bent.

  **Douglass:** I am betting on the only tool we have! You want to fight with moral suasion alone. I have tried that. I have shown my scars. I have spoken until my throat bled. And what has it changed? The cotton grows. The auction block stands. Politics is the art of the possible. If I can cast a ballot that puts a man in power who will restrict slavery's spread, I have done more for the slave than burning a pamphlet.

  **Phillips:** You compromise truth for power. That is the old story. Once you enter the political arena, you must bargain. You will shave off a principle here, a right there, to win a majority. Before you know it, you are not an abolitionist; you are a politician. The Constitution is a pro-slavery document because the men who wrote it were slaveholders. You cannot wash it clean with new interpretations.

  **Douglass:** And that is why you will lose. You treat the Constitution as the *past*—as the dead hand of 1787. I treat it as the *future*. A living instrument. If we concede that the Constitution is pro-slavery, we concede that slavery is *constitutional*. We hand the legal argument to the Calhouns and the Tanseys. I will not give them that ground. I say slavery is *unconstitutional*. It violates the natural law the document promises. By voting, by speaking, by holding office, we force the nation to live up to the paper, rather than burning the paper because the nation falls short.

  **Phillips:** (Leans forward, voice softening but intense) Fred, I fear you are being seduced by the machinery of the white man's government. You think you can wield the sword without cutting yourself. But tell me this: When you take your oath, do you not promise to uphold the Fugitive Slave Law?

  **Douglass:** I promise to uphold the Constitution. And I tell you, a law that makes a man a thing is no law at all. It is violence. I will use the government to end the violence, not to sanctify it.

  **Phillips:** You walk a razor's edge. One slip, and you become what you fight.

  **Douglass:** We all walk a razor's edge, Wendell. You walk the edge of purity. I walk the edge of power. Purity keeps your soul clean. Power frees the bondman. I would rather have dirty hands and an open cell door than clean hands and a locked cage.

  **Phillips:** (Stands up, walking to the window) You know, when you first came to New England, you were the living proof of our argument. A man stolen, beaten, and yet standing tall. You were the indictment. Now you argue for the law that allowed the stealing.

  **Douglass:** (Standing as well) I am still the indictment. But I am no longer just the witness. I am the advocate. And an advocate uses the rules of the court to free the accused. Even if the judge is corrupt. Even if the statute book is stained.

  **Phillips:** (Turns back) Then we are at an impasse. I cannot follow you into the voting booth. I cannot endorse a party that treats the Constitution as sacred.

  **Douglass:** And I cannot stand on the shore with you and watch the ship sink, shouting that it was poorly built. I will swim it to shore, Wendell. Even if I must steer it myself.

  **Phillips:** (Nods slowly) Then swim, Frederick. But do not ask me to believe the water isn't cold.

  **Douglass:** I ask only that you watch the shore. And pray we both reach it before the night comes.

  *(Phillips picks up his hat. He looks at the Constitution on the table one last time, then turns and walks out into the cold. Douglass remains, placing his hand on the leather cover of the book, not in reverence, but in grip.)*
