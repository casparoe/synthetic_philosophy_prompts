answer: |-
  This is one of the most subtle points in bargaining theory, so don't worry—nodding along in lecture is the standard reaction. The mechanics are easy, but the intuition for *why* Nash misbehaves requires shifting how you visualize the solution.

  Here is the gut check you need for your problem set, the intuition behind the violation, and why economists stick with Nash anyway.

  ### 1. The Core Intuition: Local Slope vs. Global Line

  To understand the difference, you have to look at what determines the solution point in each model.

  *   **Nash Solution (Local):** The Nash solution is determined by the **slope of the frontier at the solution point**. Mathematically, the Nash product is maximized where the slope of the Pareto frontier equals the negative ratio of the players' utility gains:
      $$ \text{Slope} = -\frac{u_2 - d_2}{u_1 - d_1} $$
      Nash bargaining is essentially saying: *"We split the gains such that our marginal rate of substitution matches our relative gains."* It cares deeply about the **curvature** of the feasible set right where you end up.

  *   **Kalai-Smorodinsky (Global):** The KS solution is determined by the **Utopia Point**. It draws a straight line from the disagreement point $d$ to the ideal point $a$ (the vector of maximum possible payoffs). The solution is simply where that line hits the frontier.
      KS is saying: *"We split the gains proportionally to our maximum possible potential."* It ignores the curvature of the frontier in the middle; it only cares about the **bounds**.

  ### 2. Why Nash Violates Individual Monotonicity

  **Individual Monotonicity** says: If Player 2's feasible set expands (specifically, their maximum possible payoff increases) while Player 1's stays the same, Player 2 should not end up with a worse payoff.

  **Why Nash violates this:**
  Because Nash depends on the *local slope*, expanding Player 2's options can change the **shape** of the frontier in a way that makes the slope steeper or flatter at the equilibrium point.

  Imagine you expand Player 2's set by adding a "high payoff" option that is only reachable if Player 1 gets very little. To keep the set convex, the new frontier connecting Player 1's max to Player 2's new max might become **steeper** in the middle region where the agreement happens.

  *   If the frontier becomes **steeper** (more negative slope), the Nash condition $\frac{u_2}{u_1} = |\text{Slope}|$ requires $u_2$ to be larger *relative* to $u_1$.
  *   However, because the constraint is tighter (the line is steeper), the actual intersection point can shift in a way that favors Player 1's absolute share, especially if the curvature changes non-linearly.

  In plain English: **Nash bargaining punishes you if your new options make you look "desperate" at the margin.** If the new options change the trade-off rate such that Player 2 has to give up more utility to grant Player 1 a gain, Player 2's bargaining power drops, even if their "ceiling" got higher. KS avoids this because it doesn't look at the trade-off rate; it just looks at the ceiling.

  ### 3. A Worked Example (The Mechanism)

  Constructing a numerical example where Player 2 *strictly loses* requires specific non-linear curves, but we can use a piecewise linear example to show exactly how the **solution point shifts** due to the shape change.

  **Scenario A (Original Set)**
  *   **Feasible Set:** Triangle with vertices $(0,0), (1,0), (0,1)$.
  *   **Frontier:** $u_2 = 1 - u_1$. (Slope = $-1$).
  *   **Nash:** Maximize $u_1(1-u_1)$.
  *   **FOC:** $1 - 2u_1 = 0 \Rightarrow u_1 = 0.5$.
  *   **Solution:** $(0.5, 0.5)$.
  *   **Player 2 Max:** $1$.

  **Scenario B (Expanded Set)**
  *   **Change:** We expand Player 2's options. Let's add a point that makes P2's max $1.2$, but creates a "kink" that changes the slope near the solution.
  *   **Feasible Set:** Convex hull of $(0,0), (1,0), (0.6, 0.6), (0, 1.2)$.
  *   **Player 2 Max:** $1.2$ (Increased! Monotonicity requires P2 to gain).
  *   **Frontier:** Now has two segments.
      1.  From $(1,0)$ to $(0.6, 0.6)$. Slope = $\frac{0.6 - 0}{0.6 - 1} = -1.5$.
      2.  From $(0.6, 0.6)$ to $(0, 1.2)$. Slope = $\frac{1.2 - 0.6}{0 - 0.6} = -1$.
  *   **Finding Nash:**
      *   If the solution were on Segment 1 ($u_2 = 1.5(1-u_1)$), the peak would be at $u_1 = 0.5$. But Segment 1 only exists for $u_1 \ge 0.6$. So the solution isn't here.
      *   The solution must be on Segment 2 ($u_2 = 1.2 - u_1$).
      *   Maximize $u_1(1.2 - u_1)$. FOC: $1.2 - 2u_1 = 0 \Rightarrow u_1 = 0.6$.
      *   **Solution:** $(0.6, 0.6)$.

  **The Comparison:**
  *   **Player 1:** $0.5 \rightarrow 0.6$ (Gained)
  *   **Player 2:** $0.5 \rightarrow 0.6$ (Gained)

  *Wait, Player 2 gained here.* This is the tricky part: in linear examples, Player 2 usually gains. To get a **violation** (where P2 loses), the frontier needs to curve such that the slope at the new equilibrium is significantly different.

  **The Intuitive Takeaway from the Example:**
  Notice that in Scenario B, Player 1's payoff increased from $0.5$ to $0.6$. Even though Player 2's *maximum* potential increased, the **shape change** allowed Player 1 to capture more of the surplus. In more complex (curved) examples, this shift can be severe enough that Player 2's absolute payoff drops.

  **KS Comparison:**
  *   **Scenario A Utopia:** $(1,1)$. Line $u_2 = u_1$. Intersection with $u_1+u_2=1$ is $(0.5, 0.5)$.
  *   **Scenario B Utopia:** $(1, 1.2)$. Line $u_2 = 1.2u_1$.
      *   Intersection with Segment 2 ($u_2 = 1.2 - u_1$):
      *   $1.2u_1 = 1.2 - u_1 \Rightarrow 2.2u_1 = 1.2 \Rightarrow u_1 \approx 0.545$.
      *   $u_2 \approx 0.654$.
  *   **KS Result:** Player 2 definitely gains ($0.5 \rightarrow 0.65$). KS guarantees this because it ties the solution directly to the Utopia point. Nash ties it to the slope, which can betray you.

  ### 4. Why Economists Still Default to Nash

  If KS fixes this weird monotonicity bug, why is Nash the standard?

  1.  **Non-Cooperative Foundation (The Big One):**
      The Nash solution isn't just an axiom; it emerges from strategic behavior. **Rubinstein's Alternating Offers model (1982)** shows that if two players take turns making offers with a small cost of delay, the subgame perfect equilibrium converges exactly to the **Nash Bargaining Solution**. KS does not have this kind of robust strategic foundation. Economists prefer solutions that can be "backed" by a non-cooperative game.

  2.  **Independence of Irrelevant Alternatives (IIA):**
      While IIA causes the monotonicity violation, many economists view IIA as a *feature*, not a bug. It means the agreement shouldn't depend on "phantom options" that no one would choose anyway. KS violates IIA (adding a useless option far away on the frontier can change the Utopia point and thus the solution). Nash is more stable in that regard.

  3.  **Tractability:**
      Maximizing a product (calculus) is often easier than calculating Utopia points and intersection lines, especially in multi-player or high-dimensional settings.

  4.  **Risk Aversion Interpretation:**
      The Nash solution has a clean interpretation regarding risk. If Player 2 becomes more risk-averse, their utility function becomes more concave. In Nash bargaining, a more risk-averse player gets a **worse** deal. The monotonicity violation in Nash is mathematically similar to this: expanding the set can mimic the effects of increased risk aversion. Since we accept that risk-averse players get worse deals, the monotonicity violation feels less "wrong" in that context.

  ### Summary for your Problem Set

  *   **Nash:** Maximizes product of gains. Sensitive to **local slope/curvature**. Can violate Individual Monotonicity because expanding the set can change the marginal trade-off against the expanding player.
  *   **KS:** Proportional gains to Utopia. Sensitive to **global bounds**. Satisfies Individual Monotonicity by construction (if your max goes up, your proportion of the max goes up).
  *   **Why Nash?** Rubinstein foundation (strategic behavior), IIA stability, and standard risk-aversion properties.

  If you need to justify Nash on the PS: *"While KS satisfies individual monotonicity, Nash is preferred for its non-cooperative foundation (Rubinstein) and the normative appeal of IIA."*
