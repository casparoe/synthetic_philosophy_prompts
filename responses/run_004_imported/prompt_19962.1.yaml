      *   Did I address the "unchosen trait" worry? Yes (Distinction between trait and action).

  11. **Final Polish:** (Self-Correction during drafting) *Make sure not to tell the user to dump the friend immediately. Focus on the philosophical/interpersonal analysis first, then offer boundary-setting as a consequence.* (Decided to keep the focus on the analysis as requested, but include a section on "What this means for you" to make it practical.)

  12. **Structure:**
