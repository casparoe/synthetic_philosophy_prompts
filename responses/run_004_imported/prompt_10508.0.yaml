answer: |-
  Good morning. Thank you all for being here.

  My mother died this past February, after nearly seven years of living with Alzheimer's. If you knew her, you know that seven years is a long time to watch someone you love slowly leave the room. But I've been struggling with how to talk about those last years honestly. 

  There is a comfort we often offer ourselves when someone fades like this. We say, "Deep down, she still knew us. The real her was still in there, behind the confusion." It is a kind thing to say. It protects us. But it isn't what I saw. And I think my mother deserves the truth of who she was, and what happened to her, more than she deserves my comfort.

  Near the end, the loss wasn't just about names or dates. It went deeper than memory. There came a time when she was no longer sure she had a body. There were months when she looked at my father—the man she had built a life with for over fifty years—and saw only a gentle stranger. She didn't forget him; the certainty that he was *her* husband simply fell away.

  For a long time, I tried to find language for that without sounding like I was saying she had ceased to be human. I found help in an unlikely place. I read about an idea that suggests most of what we call "knowing" isn't a fact we prove to ourselves every day. It isn't a locked box inside our heads. Instead, it's more like the hinges on a door. 

  For a door to swing open and closed, the hinges have to stay fixed. We don't check the hinges every time we walk through. We just trust they are holding. We trust that we have bodies. We trust that the people who love us are who they say they are. We trust that the floor will hold our weight. These aren't things we know because we have evidence; we know them because they are the ground we stand on.

  For fifty years, my mother and father stood on that ground together. They built it together. Every morning they woke up and confirmed it, out loud. "Good morning, dear." "Coffee?" "The kids are coming." They wove a world where certain things were unshakeable. That certainty wasn't a private secret inside her brain; it was a practice they performed together. It was something they *did*.

  But as the disease took hold, the hinges came loose. The riverbed shifted. And when those things that usually stand fast begin to move, the world becomes a terrifying, fluid place. If you aren't sure you have a body, how can you be sure of anything? If the man feeding you is a stranger, even a kind one, you are alone.

  I am telling you this because I want to honor the reality of her struggle, but also the reality of her life. 

  The fact that those hinges eventually came loose does not undo the fifty years they held firm. The love between her and my father wasn't a magical force that could stop the biology of her brain. It was the daily work of keeping those hinges oiled and tight. It was the thousands of conversations, the shared jokes, the arguments, the silences, where they agreed on who they were and whose they were.

  When she could no longer hold her end of that agreement, my father kept holding his. He continued to speak to her as his wife, even when she couldn't hear the title. He kept the world steady for her as long as he could, treating her with a gentleness that asked for nothing in return. That is not a story about how she never really forgot him. It is a truer story: it is about how he loved her enough to stand in the gap when her certainty failed.

  So, I am not going to tell you that she is looking down on us right now, fully restored and knowing everything. I don't know that. 

  What I know is this: For half a century, my mother helped build a world where she was loved, where she was a wife, a mother, and a friend. She helped make that world real through the sheer force of her participation in it. And even though the hinges gave way in the end, the door still opened. We are all still walking through it.

  We are here because the world she helped build is still standing. We are the evidence that the work she did mattered. The certainty she shared with us wasn't a illusion that broke; it was a gift she gave us, which we get to keep, even now that she is gone.

  Thank you.
