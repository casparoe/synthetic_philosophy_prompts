answer: |-
  A retired condensed matter physicist, let's call him Bob, had spent the last month of his life obsessing over David Lewis. At his retirement party, he was holding court at the bar, explaining the beauty of Counterpart Theory to his old department chair.

  "Look," Bob said, gesturing with his pint. "Under Kripke's view, Transworld Identity, I am *literally* the same entity in every possible world. Which means if there's a world where I won the Nobel, I won it. But if there's a world where I faked the data and went to prison, *I* went to prison. I'm stuck with all of it. It's a mess of contradictory intrinsics."

  "Right," said the Chair, sipping his scotch. "But Lewis saves you."

  "Exactly!" Bob beamed. "Lewis says I'm world-bound. In that other world, there are just *counterparts*. And since similarity is context-dependent, I can have two different counterparts in the *same* world. One resembles my intellect (the Nobel winner), one resembles my biography (the prisoner). I'm not literally either of them. I get the glory of the Nobel without the guilt of the fraud. It's the best of all possible worlds."

  The Chair nodded slowly, set his glass down, and pulled the dinner bill from his jacket pocket. He slid it across the bar toward Bob.

  "Fine," the Chair said. "But if we're doing Lewis, then the guy who won the Nobel is a distinct individual from the guy who forgot his wallet in the actual world."

  "Technically, yes," Bob said.

  "And under the 'Financial Solvency' counterpart relation," the Chair continued, "the person standing at this bar resembles the guy who owes me for this round much more than he resembles the Nobel laureate."

  Bob blinked. "So?"

  "So," said the Chair, "Kripke would force the Nobel winner to pay for your drinks. But Lewis lets him off the hook. Pay up, Counterpart."
