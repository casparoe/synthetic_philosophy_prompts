answer: |-
  You are right, and your friend is wrong. But more importantly, **your intuition does not collapse into total self-doubt.** There is a very precise, philosophically and scientifically sound version of your argument that survives her objection.

  Here is the breakdown of why her logic fails and how you can articulate the "precise version" of what is bugging you.

  ### 1. The Flaw in Her Logic: A Category Error
  Your friend is making a category error. She is treating "judging your own alertness" the same as "judging your own hunger" or "judging your own opinions."

  Her argument is: *If you can't trust your feeling of alertness, you can't trust any feeling, therefore you can't function.*

  The counter-argument is: **You cannot trust a measuring tool that is currently broken.**

  If you are using a ruler to measure a table, you trust the ruler. If the ruler is made of rubber and is stretching, you cannot trust the measurement. The problem isn't "trusting yourself" in general; the problem is trusting a specific cognitive function (self-assessment) while the mechanism required to perform that assessment (your brain) is compromised.

  Fatigue is not just a feeling; it is a physiological state that degrades cognitive processing. One of the first things to degrade is **metacognition**—the ability to think about your own thinking.

  ### 2. The Precise Version of Your Argument
  You asked for a more precise version of what is bugging you. Here it is:

  > **"Impairment creates a blind spot in self-assessment. Therefore, subjective feelings of safety are unreliable data points when the variable being measured is the same one causing the impairment."**

  In simpler terms: You can't use a tired brain to accurately judge how tired the brain is.

  This does not lead to total self-doubt. It leads to **contextual skepticism.**
  *   **Normal Context:** I feel hungry → I am likely hungry. (Trust the feeling).
  *   **Compromised Context:** I feel alert at 2 AM after a party → I might be experiencing a adrenaline spike masking physiological fatigue. (Question the feeling).

  This isn't nihilism; it's risk management. It's the same logic we use for alcohol. A drunk person often feels "fine to drive." If we applied your friend's logic to alcohol, she would have to say, "If you can't trust your feeling of sobriety, you can't trust any feeling, so you can't ever decide if you're drunk." Obviously, that's false. We know alcohol impairs judgment *about* alcohol. Fatigue does the same thing.

  ### 3. The Scientific Backing (The "2 AM" Factor)
  You can back this up with biology, which removes it from the realm of "feelings."

  *   **Microsleeps:** At 2 AM, the circadian rhythm is at its lowest point. People experience "microsleeps"—blanking out for 2 to 15 seconds. During a microsleep, you are asleep with your eyes open. You do not *feel* yourself falling asleep; you just wake up 10 seconds later having traveled 300 yards blindly.
  *   **The Adrenaline Mask:** Driving requires focus. That focus releases adrenaline. Adrenaline can mask the *sensation* of fatigue without removing the *physiological* slowing of reaction time. She felt alert because the act of driving was waking her up, not because she wasn't tired.
  *   **Impaired Insight:** Studies on drowsy driving show that drivers consistently underestimate their level of impairment. They think they are compensating for the tiredness, but objective tests show their lane discipline and reaction times are equivalent to being legally drunk.

  ### 4. Analogies to Win the Argument
  If you talk to her again, don't get bogged down in abstract philosophy. Use analogies that highlight the "broken tool" aspect:

  *   **The Fever Analogy:** "When you have a high fever, you often feel freezing cold. If you trust that feeling, you put on more blankets and make the fever worse. You don't trust the feeling because the illness is distorting your thermometer. Fatigue distorts your brain's thermometer."
  *   **The Optical Illusion:** "If I show you an optical illusion, your eyes tell you the lines are curved. If I say 'don't trust your eyes here,' I'm not saying you should never trust your eyes. I'm saying I know this specific situation tricks them."
  *   **The Drunk Driver:** "If a drunk person says 'I feel fine to drive,' we don't say 'well, he trusts himself.' We say his ability to judge 'fine' is broken. Being awake for 18+ hours (likely, if she was at a party until 2 AM) has a similar cognitive effect to being over the alcohol limit."

  ### Summary
  Your worry is not "confused." It is a sophisticated understanding of **epistemic humility** regarding your own biology.

  *   **Her Claim:** Distrusting your fatigue means distrusting everything.
  *   **The Reality:** Distrusting your fatigue means acknowledging that fatigue specifically impairs the judgment of fatigue.

  You don't need to doubt *everything* you feel. You just need to acknowledge that **2 AM is a known variable that corrupts data.** Trusting external rules (like "no driving after 2 AM") over internal feelings in high-risk scenarios isn't self-doubt; it's wisdom.
