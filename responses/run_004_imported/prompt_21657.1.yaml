answer: |-
  **MEMORANDUM**

  **TO:** Effective Altruism Club Executive Board & General Membership
  **FROM:** Fund Allocation Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on 2023 Fundraiser Allocation ($3,000)

  ### 1. Executive Summary
  After reviewing proposals and debating the comparative impact of our available options, the Fund Allocation Committee has decided to split the 2023 fundraiser proceeds ($3,000) between a high-evidence global health intervention and a local systemic change initiative.

  **The Allocation:**
  *   **$2,250 (75%)** to the **Against Malaria Foundation (AMF)** (via GiveWell's Top Charity Fund).
  *   **$750 (25%)** to **[Name of Local Voter Registration Nonprofit]**.

  This decision reflects a commitment to Evidence-Based Altruism while acknowledging the importance of systemic engagement and the epistemic limits of our impact modeling.

  ### 2. Background & Options Considered
  The committee evaluated two primary causes:
  1.  **Global Health (AMF):** Funding insecticide-treated bednets to prevent malaria. This option offers high-confidence data on cost-per-life-saved and immediate, tractable outcomes.
  2.  **Civic Engagement (Voter Reg):** Funding local voter registration drives. This option targets long-term systemic change (policy outcomes via elections) but lacks direct traceability between our specific contribution and downstream policy effects.

  ### 3. Analysis of Impact & Uncertainty
  The core of our debate centered on how to weigh **confidence** against **potential scale**.

  *   **The Case for AMF:** The causal chain is short and well-evidenced. Funds $\rightarrow$ Nets $\rightarrow$ Reduced Malaria Transmission $\rightarrow$ Lives Saved. While we cannot predict the *ultimate* long-term trajectory of every life saved, the immediate moral value of preventing premature death is robust and non-speculative.
  *   **The Case for Voter Registration:** The causal chain is long and complex. Funds $\rightarrow$ Registrations $\rightarrow$ Votes $\rightarrow$ Election Outcomes $\rightarrow$ Policy Changes $\rightarrow$ Societal Impact. At each step, the counterfactual impact diminishes. While the *potential* upside of policy change is massive, the probability that our specific $3,000 alters a policy trajectory is difficult to quantify and likely low.

  ### 4. Engagement with Epistemic Objections
  During deliberations, a significant philosophical objection was raised: *"Since we cannot fully trace the long-run effects of EITHER option (e.g., what a saved child eventually does, or how policy shifts ripple over decades), comparing expected impact is impossible. We should therefore rely on intuition ('gut') rather than metrics."*

  The Committee takes this objection seriously but ultimately rejects the conclusion that we should revert to intuition. We offer the following rebuttal, which guided our final weighting:

  **A. Uncertainty is Not Uniform**
  While it is true that *absolute* long-term certainty is impossible for any intervention, the *degree* of uncertainty varies significantly.
  *   **AMF:** We have high confidence in the *proximate* good (a life is not lost to malaria). Even if we are uncertain about the distant future, securing a healthy adulthood for an individual is a robust good in almost all moral frameworks.
  *   **Voter Reg:** We have low confidence in the *proximate* good (registration does not guarantee a vote, nor a specific policy outcome). Relying on this option requires assuming a long chain of contingent events will break in our favor.

  **B. "Gut" Feelings are Biased Proxies**
  Choosing based on "gut" when data is imperfect often defaults to **proximity bias** (valuing what is near/visible over what is distant) or **narrative bias** (valuing stories over statistics).
  *   The "traceability" argument suggests that because we can't see the end of the chain, the chain doesn't matter. However, Effective Altruism is not about *perfect* knowledge; it is about *comparative* knowledge.
  *   We know more about the impact of bednets than we do about the impact of marginal voter registration dollars. Ignoring this disparity in evidence because neither is perfect would be discarding useful information.

  **C. The Portfolio Approach to Uncertainty**
  We acknowledge that our models for global health could be incomplete (e.g., ignoring long-termist risks). Therefore, allocating a portion of funds to systemic/leverage causes (like voting) acts as a **hedge against model uncertainty**. However, because the evidence gap is so wide, this hedge should not outweigh the core evidence-based allocation.

  ### 5. Final Rationale
  We are choosing a **75/25 split** rather than a 50/50 compromise or a 100% allocation for the following reasons:

  1.  **Adherence to Mission:** As an Effective Altruism club, our primary mandate is to do the *most* good with available resources. The weight of evidence currently favors global health interventions for immediate, verifiable impact.
  2.  **Club Cohesion & Engagement:** We recognize that members are motivated by different cause areas. Allocating a minority portion to local systemic change allows members to engage with civic impact without sacrificing the majority of our capital to lower-confidence interventions.
  3.  **Intellectual Honesty:** This split admits that while we prioritize evidence, we remain humble about what we don't know. It funds the "sure thing" primarily, while placing a calculated bet on systemic leverage.

  ### 6. Next Steps
  *   **Treasurer:** To process the transfer to GiveWell ($2,250) and [Local Nonprofit] ($750) by Friday.
  *   **Communications:** To draft a public announcement highlighting *why* we chose this mix, specifically focusing on our commitment to evidence-based decision-making under uncertainty.

  ***

  **Approved By:**
  [Your Name/Committee Chair]
  [Other Committee Member Names]
