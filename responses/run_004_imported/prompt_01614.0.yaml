prompt: |-
  so for a seminar on early modern political economy (Locke, Petty, Berkeley, a bit of Hume) I've been slogging through Berkeley's Querist, which I'd honestly never read before now -- I only knew him as the "esse est percipi" immaterialism guy from the Principles and the Three Dialogues. The Querist is such a strange text by comparison: just a few hundred numbered rhetorical questions in a row, published 1735-37, with basically no connected argument spelled out anywhere, so it's way harder to tell what he's actually committed to versus just floating as a possibility for the reader to consider.

  There's a run of queries I keep rereading and can't fully untangle (numbering from part I, so this might read differently if your edition combines all three parts):

  "33. Qu. Whether it be not the opinion or will of the people, exciting them to industry, that truly enricheth a nation? And whether this doth not principally depend on the means for counting, transferring, and preserving power, that is, property of all kinds?
  34. Qu. Whether if there was no silver or gold in the kingdom, our trade might not, nevertheless, supply bills of exchange, sufficient to answer the demands of absentees in England or elsewhere?
  35. Qu. Whether current bank notes may not be deemed money? And whether they are not actually the greater part of the money of this kingdom?
  36. Qu. Provided the wheels move, whether it is not the same thing, as to the effect of the machine, be this done by the force of wind, or water, or animals?
  37. Qu. Whether power to command the industry of others be not real wealth? And whether money be not in truth tickets or tokens for conveying and recording such power, and whether it be of great consequence what materials the tickets are made of?"

  Two things have me stuck. First, just on the literal level -- what is query 36 even doing here? The wheels/wind/water/animals bit reads like it wandered in from a completely different passage about mills, and I can't tell what "the machine" is supposed to be or how its exactly backing up the point in 35 and 37. Second, and this is the part I actually need for my paper: does the move from "opinion or will" in 33 to money as mere "tickets or tokens" in 37 do real metaphysical work that's continuous with his immaterialism -- like, is this basically the "no mind-independent substance, only relations and ideas" move from the Principles, just redeployed onto money and credit -- or am I pattern-matching where there's nothing more than a fairly ordinary point about paper credit and bills of exchange that any 18th century pamphleteer could've made? My advisor is skeptical I can support the stronger reading and I want to figure out whether its actually there in the text before I commit to it in the draft, or whether Im just projecting the more famous Berkeley onto this one.
