answer: |-
  This is a fantastic problem to be wrestling with. *The Querist* is notoriously slippery precisely because Berkeley refuses to dogmatize in it, yet the philosophical undercurrents are unmistakable if you know where to look. Your advisor's skepticism is standard fare (economic historians often want to claim Berkeley for the history of finance, while philosophers want to claim him for metaphysics), but I think you can thread the needle.

  Here is a breakdown of what Query 36 is doing, followed by an assessment of whether your "strong reading" holds water.

  ### 1. Decoding Query 36: The Functionalist Analogy

  You are right that Query 36 feels like an intrusion. It is an **analogical pivot**.

  *   **The Machine:** The "machine" is the national economy (specifically the circulation of labor and goods).
  *   **The Wheels Moving:** This represents economic activity (industry, trade, consumption).
  *   **Wind/Water/Animals:** These represent the *medium of exchange* (gold, silver, paper notes, credit).

  **What it is doing:** Query 36 is an argument for **medium indifference**. Berkeley is arguing that the *substrate* of money is irrelevant to the *function* of money. Just as a miller doesn't care if the millstone is turned by a horse, a river, or the wind—only that it turns—so the statesman should not care if commerce is conducted via guineas, bank notes, or bills of exchange, only that commerce occurs.

  It bridges 35 and 37 by providing the mechanical justification for 37's claim.
  *   **35 says:** Paper notes work as money.
  *   **36 says:** The source of power doesn't matter, only the motion.
  *   **37 concludes:** Therefore, money is just a token for power, and the material is inconsequential.

  Without 36, 37 looks like a non-sequitur. With 36, it becomes a syllogism about functionalism.

  ### 2. The Metaphysical Question: Immaterialism or Credit Theory?

  This is the crux of your paper. Is this just standard 18th-century credit theory (like Law or Cantillon), or is it Berkeleyan metaphysics applied to economics?

  **The Case for "Just Credit Theory" (Your Advisor's View):**
  By the 1730s, the idea that money was a "ticket" or "counter" was not radical. John Law's *Money and Trade Considered* (1705) argued that money's value was conventional, not intrinsic. The South Sea Bubble (1720) had forced everyone to think about paper credit. Berkeley was in Ireland dealing with Wood's Halfpence controversy; arguing against the fetishization of specie was a pragmatic political move, not necessarily a metaphysical one.

  **The Case for the "Strong Reading" (Your View):**
  However, Berkeley is rarely *just* pragmatic. His pragmatism is usually driven by his epistemology. There are three reasons to think this is continuous with his philosophy, though perhaps not exactly *esse est percipi* in the 1710 sense.

  **A. The Theory of Signs (The *Alciphron* Connection):**
  *The Querist* was published shortly after *Alciphron* (1732). In *Alciphron*, Berkeley moves away from the strict idealism of the *Principles* toward a **semiotic theory of knowledge**. He argues that words (and ideas) are not valuable because they stand for specific abstract ideas, but because they function as *signs* that guide action and expectation.
  *   **In *The Querist*:** Money is treated exactly like language in *Alciphron*. It is a system of signs ("tickets or tokens") that coordinates human action ("command the industry of others").
  *   **The Link:** Just as you don't need a mental image for every word to use language effectively, you don't need intrinsic value in gold to use money effectively. The value lies in the *relation* and the *use*, not the substance. This is a direct application of his later nominalism.

  **B. Anti-Idolatry of Substance:**
  Berkeley's entire philosophical career is a war against "abstract ideas" and the belief in unperceived material substance. He views the belief that gold *itself* is wealth as a form of idolatry (worshipping the creature rather than the utility).
  *   Query 37 ("whether it be of great consequence what materials the tickets are made of") is an economic version of "to be is to be perceived/useful." To believe gold has value independent of its social function (the "power to command industry") is to commit the same error as believing matter exists independent of a mind.

  **C. The "Will" and "Industry" (Query 33):**
  Query 33 anchors wealth in the "opinion or will of the people... exciting them to industry." This psychologizes wealth. Wealth isn't a pile of metal; it's a state of mind (will) manifesting as action (industry). This aligns with his view that reality is constituted by active spirits (minds/wills), not passive matter.

  ### 3. How to Frame This for Your Paper (and Advisor)

  Your advisor is worried you are projecting the *Principles* (1710) Berkeley onto the *Querist* (1735) Berkeley. They are right to be cautious about a direct "immaterialism" label, but wrong to dismiss the philosophical continuity.

  **Don't argue:** "Berkeley thinks money is an idea." (Too reductive).
  **Do argue:** "Berkeley treats money as a *linguistic sign* within a social system, applying his semiotic epistemology to political economy."

  Here is a roadmap to defend the reading without overreaching:

  1.  **Acknowledge the Context:** Concede that the *language* of money-as-tickets was available in the 1730s (Law, etc.). This disarms the advisor's skepticism.
  2.  **Identify the Philosophical Distinctiveness:** Argue that while others saw money as a *convention*, Berkeley sees it as a *sign*. For Law, paper money is a tool to increase liquidity. For Berkeley, realizing money is a token is a *therapeutic correction* of a conceptual error (the idolatry of specie).
  3.  **Use Query 36 as the Key:** Use the "wheels" analogy to show Berkeley is arguing for **functionalism over substantialism**. This mirrors his argument in *De Motu* (On Motion) around the same time, where he argues we shouldn't look for the "true essence" of force/gravity, only its effects.
      *   *Parallel:* In physics, don't ask what Gravity *is*, ask what it *does*.
      *   *Parallel:* In economics, don't ask what Money *is* (gold vs. paper), ask what it *does* (moves industry).
  4.  **Connect to *Alciphron*:** If you want to secure the "metaphysical work" point, cite *Alciphron* Dialogue IV. Berkeley's discussion of how language works without distinct ideas for every term is the exact epistemological engine running *The Querist*. Money works like words: it conveys power and intention without needing intrinsic substance.

  ### Summary Verdict

  **Is Query 36 random?** No, it's a functionalist analogy bridging the nature of notes (35) and the definition of wealth (37).

  **Is the "Strong Reading" supportable?** Yes, but refine the terminology. It is less about "immaterialism" (the denial of matter) and more about **semiotic instrumentalism** (the denial of intrinsic meaning/value in signs).

  Berkeley is doing something unique here: he isn't just proposing a banking scheme; he is trying to cure the Irish public of a philosophical error regarding the nature of value. If you frame it as **epistemology applied to economics** (via the theory of signs) rather than **metaphysics applied to economics** (via *esse est percipi*), you will likely satisfy your advisor while keeping the ambitious core of your argument.

  **One final tip for the text:** Check Query 40-50 range as well. He often returns to the idea of a "National Bank" not just as a financial institution, but as a way to institutionalize this correct understanding of money as a public token of industry. That reinforces the idea that this is a philosophical project, not just a policy one.
