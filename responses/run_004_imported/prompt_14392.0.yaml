      *   **Intro:** Contextualize the term "coherence arguments."
      *   **Part 1: The Dutch Book (Epistemic Coherence).** Focus on credences and probability.
      *   **Part 2: The Money Pump (Practical Coherence).** Focus on preferences and transitivity.
      *   **Part 3: The Gap to Expected Utility.** How they combine (VNM).
      *   **Part 4: The AI Safety Inference.** Critique the leap from "coherence" to "shutdown resistance." Distinguish normative vs. descriptive.
      *   **Part 5: Substantial Objections.** Resolute Choice and the "Rationality vs. Survival" distinction.
      *   **Conclusion:** Summary for the journalist.

  7.  **Final Polish:** Check tone. Ensure I'm not being too dismissive of AI safety researchers (who often rely on the *selection* argument, not just the *logical* argument), but be precise about the logical gap. Ensure the distinction between *beliefs* (Dutch Book) and *preferences* (Money Pump) is sharp.

      *(Self-Correction during drafting)*: Wait, the prompt asks specifically about the inference that "any sufficiently capable... agent will act as though maximizing a single stable utility function." I need to address whether coherence arguments force *stability*. They don't. They force *consistency* at a time. Dynamic consistency is a separate issue. I should mention that.

      *(Refining the "Shutdown" point)*: The claim is that EU maximizers resist shutdown. This is true *if* shutdown prevents goal achievement. But coherence arguments don't prove the agent *has* goals that shutdown prevents. However, the "Instrumental Convergence" thesis argues most goals imply self-preservation. I need to clarify that Coherence Arguments $\rightarrow$ EU, but EU + Instrumental Convergence $\rightarrow$ Shutdown Resistance. The Coherence Arguments alone do *not* get you to Shutdown Resistance.

  8.  **Final Review against constraints:**
      *   Compare Dutch Book & Money Pump? Yes.
      *   What they establish/presuppose? Yes.
      *   Assess the stronger AI safety claim? Yes.
      *   Which does more work? Yes.
      *   Engage substantial objection? Yes.

