prompt: |-
  I'm drafting a feature on the philosophical scaffolding beneath contemporary AI-safety arguments, and one phrase keeps recurring in my notes without my being fully confident I could defend it if pressed: "coherence arguments." As far as I understand it, the term bundles together two distinct results from mid-twentieth-century decision theory -- the Dutch Book argument, which shows that credences violating the probability axioms can be exploited through a set of bets guaranteeing a sure loss, and the money-pump argument, which shows that intransitive (and, on some versions, incomplete) preferences can be exploited through a cycle of trades that leaves the agent poorer and back where it started. Several of the researchers I've interviewed for this piece treat the two as roughly interchangeable, and both as though they get an agent most of the way to full expected-utility maximization -- and from there, to the stronger claim that any sufficiently capable, hard-to-correct agent will act as though maximizing a single stable utility function, and will therefore resist attempts to alter its goals or shut it down.

  Before I commit any of this to print, I'd like a more careful comparison than I can piece together myself. Please compare the Dutch Book argument and the money-pump argument as two instances of "coherence arguments" for expected utility theory: what, precisely, does each one establish, and what does each merely presuppose or leave unaddressed? Then assess whether either argument, on its own terms and without smuggling in extra premises, actually supports the stronger claim about capable agents described above, or whether that inference needs help from elsewhere. If you think one of the two arguments is doing more of that work than the other, say which and why. Please also engage seriously with at least one substantial objection to using either argument this way -- for instance, the suggestion that a "sophisticated" or "resolute" chooser can see a money pump coming and simply decline the exploiting trade without ever revising the preferences that supposedly made the pump possible, or the more general worry that avoiding sure monetary loss is not obviously the same thing as being rational.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Topic:** "Coherence arguments" in the context of AI safety (specifically linking decision theory to instrumental convergence/goal stability).
      *   **Core Task:** Compare the Dutch Book argument and the Money Pump argument.
      *   **Specific Questions to Answer:**
          1.  What does each establish precisely?
          2.  What does each presuppose or leave unaddressed?
          3.  Do they support the stronger AI safety claim (capable agents $\rightarrow$ EU maximizers $\rightarrow$ resist correction/shutdown) on their own terms?
          4.  If one does more work than the other, which and why?
          5.  Engage with at least one substantial objection (e.g., resolute choice, definition of rationality).
      *   **Tone/Style:** Philosophical rigor, suitable for a feature article draft (nuanced, clear, critical).
      *   **Target Audience:** Educated readers, likely familiar with basic AI safety discourse but needing clarity on the underlying decision theory.

  2.  **Analyze the "Coherence Arguments":**

      *   *Dutch Book Argument:* Focuses on *beliefs* (credences). If credences violate probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), a bookie can construct a set of bets that guarantees a loss regardless of the outcome.
          *   *Establishes:* Probabilistic coherence is necessary to avoid sure loss in betting scenarios.
          *   *Presupposes:* The agent accepts the bets offered, values money linearly (or at least monotonically), and treats the bets as binding.
      *   *Money Pump Argument:* Focuses on *preferences* (values). If preferences are intransitive (e.g., $A \succ B \succ C \succ A$), a trader can cycle the agent through trades ($A \to B \to C \to A$), charging a fee each time, leaving the agent worse off.
          *   *Establishes:* Transitive preferences are necessary to avoid sure loss in trading scenarios.
          *   *Presupposes:* The agent accepts the trades, prefers more money to less, and makes decisions myopically (sequence-blind).
      *   *Connection to Expected Utility (EU):* Together (plus completeness and continuity), they motivate the Von Neumann-Morgenstern (VNM) axioms. VNM theorem says if you satisfy these axioms, you act *as if* maximizing EU.

  3.  **Analyze the AI Safety Inference:**

      *   *The Claim:* Capable agents $\rightarrow$ Coherent (EU maximizers) $\rightarrow$ Instrumental Convergence (resist shutdown, preserve goals).
      *   *The Gap:*
          1.  *Coherence $\rightarrow$ EU:* VNM gets you representation, not necessarily optimization pressure.
          2.  *EU $\rightarrow$ Goal Stability:* This is the "Orthogonality Thesis" vs. "Instrumental Convergence" space. Does being an EU maximizer mean you *must* resist shutdown? Only if shutdown interferes with the utility function.
          3.  *Evolution/Selection Pressure:* The stronger argument isn't that logic *forces* coherence, but that incoherent agents get selected *against* (Omohundro's argument).
      *   *Assessment:* The coherence arguments *themselves* (Dutch Book/Money Pump) are normative (you *should* be coherent). They don't prove descriptive claims (agents *will* be coherent). The AI safety claim relies on an evolutionary/selection pressure argument (incoherent agents lose resources and die out), not just the logical force of the arguments.

  4.  **Drafting the Comparison (Section by Section):**

      *   **Introduction:** Define "coherence arguments" in this context. Acknowledge the conflation in AI safety circles.
      *   **Dutch Book (Beliefs):**
          *   Domain: Epistemic (Credences).
          *   Mechanism: Betting odds.
          *   Result: Probabilistic coherence.
          *   Limitation: Doesn't tell you *what* to believe, just how to structure confidence. Assumes linear utility of money.
      *   **Money Pump (Preferences):**
          *   Domain: Practical (Preferences).
          *   Mechanism: Trading cycles.
          *   Result: Transitivity (and sometimes completeness).
          *   Limitation: Assumes myopic choice. Assumes "more money is better."
      *   **Synthesis (VNM):** Together they motivate Expected Utility Theory.
      *   **Evaluating the AI Safety Inference:**
          *   Do they prove capable agents *will* be coherent? No, they prove they *should* be.
          *   The bridge is *selection pressure*. Incoherent agents lose resources.
          *   Do they prove goal stability/shutdown resistance? No. That requires the *Instrumental Convergence Thesis*. An EU maximizer with a "shutdown-friendly" utility function won't resist shutdown. The coherence arguments don't dictate the *content* of the utility function.
      *   **Which does more work?** Money Pump is more relevant to *action* and *goals*, whereas Dutch Book is about *belief*. AI safety worries about action. So Money Pump is closer, but still insufficient.
      *   **Objections:**
          *   *Resolute Choice:* (McClennen). An agent can commit to a plan and reject the pump mid-cycle.
          *   *Cost of Coherence:* Maybe being coherent is computationally expensive.
          *   *Definition of Rationality:* Is avoiding sure loss the only metric? (Risk aversion, ambiguity aversion).
          *   *Selection vs. Logic:* The logical argument doesn't force behavior; the evolutionary argument does, but evolution is messy.

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to say EU maximization *causes* instrumental convergence. It's a precondition. The specific claim about shutdown resistance comes from the fact that being shut down usually reduces the expected utility of almost *any* open-ended goal.
      *   *Nuance:* The prompt asks if the *coherence arguments themselves* support the claim. The answer is largely "No." They support the *coherence* part, but the *convergence* part requires extra premises (like the agent having long-term goals).
      *   *Objection Choice:* The "Resolute Choice" objection is classic and directly attacks the Money Pump. I should also mention the "Selection Pressure" distinction (logical coercion vs. evolutionary pressure) because that's where AI safety folks often slide between the two.

  6.  **Structuring the Response:**

