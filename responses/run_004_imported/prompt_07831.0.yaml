prompt: |-
  So I had this whole two-hour argument with my friend last night about coherent extrapolated volition -- shes convinced it's basically Rawls's reflective equilibrium with extra steps bolted on, and I think that's letting Yudkowsky off way too easy, there's actual machinery in there (spread, muddle, coherence, whatever) that's doing more work than she's giving it credit for. Anyway, I'm interviewing an alignment researcher next week who's written in defense of CEV as basically the correct long-run target for AI alignment, and I don't want him to just get to restate the "smarter, saner, more the people we wished we were" pitch and call it a day. Can you draft me 8-10 interview questions for him?

  I want atleast one question that presses on whether the spread/muddle/coherence machinery is actually doing philosophical work or just relabeling the disagreement problem, one that ties CEV back to the older Sidgwick-to-Railton tradition of idealized-preference accounts and makes him answer the standard alienation objection (why should some wildly idealized counterpart's preferences get authority over the actual, non-idealized me), one on why MIRI itself ended up prioritizing corrigibility over just building toward CEV directly, and one on the interpersonal aggregation problem -- what happens to the whole proposal once you admit some people's extrapolated volitions might just never converge. For each question, throw in a quick note on the dodge he'll probably reach for and a follow-up that closes it off.
