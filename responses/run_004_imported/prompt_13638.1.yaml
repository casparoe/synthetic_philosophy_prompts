      *   *Refining the Holmes point:* Holmes argues constraints enable. But if the constraint prevents the polity from saving itself from a new kind of tyranny (e.g., technocratic erosion not covered by 1949 definitions), the mast becomes the rocks.
      *   *The "People" as a trans-temporal entity:* This is the standard defense (the People is one entity across time). The student's critique attacks the ontology of this "People." I need to highlight that.
      *   *Legitimacy:* If it's not consent-based legitimacy, what is it? Maybe *outcome-based* (protecting democracy from suicide) or *identity-based* (this is what makes us *us*).

  6.  **Polishing for the Audience:**
