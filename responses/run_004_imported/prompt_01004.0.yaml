prompt: |-
  Random tangent from the novel I'm supposed to be writing -- fell down a rabbit hole on philosophy of history instead of actually drafting. Apparently there's a whole debate about how historical explanations are supposed to work: the 'covering law' camp (Hempel, I think) says you explain an event by showing its an instance of some general law, sort of like in science, while other people insist history explains through narrative -- you just tell the story in the right order and that IS the explanation, no laws required. Can you break down what's actually at stake between these two camps? I vaguely remember someone -- Danto maybe? -- arguing that narrative explanation isn't secretly just a covering-law explanation wearing a trenchcoat, that it's doing something genuinely different. Curious if that holds up, and if so what exactly narrative would be explaining that laws can't.
