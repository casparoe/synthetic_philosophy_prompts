      If I recommend A, I risk sounding like I'm ignoring the charter. If I recommend B, I risk sounding like I'm ignoring quality.
      Let's try to find the Du Boisian middle ground that tips to one side. Du Bois wrote: "I do not care a damn for any art that is not used for propaganda." BUT he also said, "The point is not that art should be didactic, but that it should be true."
