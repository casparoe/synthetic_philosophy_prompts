      *   **Manuscript A:** Technically dazzling novella, marriage/renovation plot, Black characters but race is not a theme (blind readers guessed white author). Argument: Prize must remain literary/craft-focused; Du Bois valued high craft and hated stereotypes.
      *   **Manuscript B:** Rougher linked stories, eminent domain/family loss, explicitly political/social. Argument: Charter demands engagement with Black life/stakes; ignoring race erases the prize's purpose. Weakness: Didactic characters, stale imagery.
      *   **Task:** Draft a memo to the jury and foundation board recommending a resolution.
      *   **Requirements:**
          *   Reach an *actual recommendation* (no splitting the prize).
