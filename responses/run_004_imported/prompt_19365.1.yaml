      *   *Option 3: Pick A (with nuance).* Argue that the *existence* of A is itself a political act (asserting Black humanity beyond trauma), aligning with a deeper reading of Du Bois.
      *   *Option 4: Pick B (with nuance).* Argue that craft can be taught, but mission alignment is core to the prize's identity.
      *   *Decision:* I need to choose one to satisfy the prompt's requirement for an "actual recommendation."
