          *   Address Du Bois's actual position vs. the charter's slogan version (does it settle the case or allow room for disagreement?).

  2.  **Deconstruct the Conflict:**
      *   *Team A (Craft/Universalism):* Art must be good first. Du Bois demanded truth and beauty, not just propaganda. A book ignoring race isn't necessarily anti-Black; it asserts Black normalcy.
      *   *Team B (Mission/Particularism):* The prize has a specific political mission. "Art for art's sake" is a luxury this community can't afford. B fulfills the charter's specific mandate regarding social function.
      *   *The Du Bois Factor:* The charter cites "Criteria of Negro Art." Does Du Bois actually support A or B more?
          *   *Du Bois's View:* He famously said "all Art is propaganda and ever must be." *However*, he also criticized art that was *only* propaganda and lacked beauty/truth. He wanted art that fought for Black rights *and* was aesthetically rigorous. He hated caricature.
          *   *Application:* Du Bois would likely critique B for being didactic (mouthpieces) and A for being disengaged. But which sin is worse in the context of *this specific prize*?

