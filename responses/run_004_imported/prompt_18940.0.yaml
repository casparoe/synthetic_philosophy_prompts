      *   **Objector (O - Adamsian):** Robert Adams is known for arguing that there are no true CCFs prior to God's creative decision because nothing makes them true. He emphasizes the lack of a truthmaker and the intuition that truth supervenes on being. Needs to press the "brute fact" worry.

  3.  **The Concrete Case:**
