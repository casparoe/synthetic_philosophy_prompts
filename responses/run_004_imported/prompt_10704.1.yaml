prompt: |-
  So in my formal epistemology seminar we just went over the Judy Benjamin problem, and honestly I think everyone (including the prof) is overcomplicating what seems like a pretty clean argument. The whole "paradox" is that Jeffrey conditionalization (or the min cross-entropy rule people use to generalize it to conditional evidence) ends up giving different probabilities to Blue-1 vs Blue-2, even tho the radio message was only ever about the Red side of the map. If updating on new evidence is supposed to leave alone whatever the evidence doesn't touch, and here it obviously doesn't, doesn't that just show the rule is inconsistent and we should ditch it in favor of plain ol' Bayesian conditionalization whenever we get evidence like that? Curious what the actual catch is supposed to be, since it feels like a pretty decisive knockdown to me.
