answer: |-
  **The Discount Rate of Eternity**

  The basement of the Municipal Archive smelled of lignin and slow decay. Arthur liked it there. It was the only place in the city where the rising water tables hadn't yet forced a retreat, mostly because the building was sunk so deep into the bedrock that the floodwaters couldn't decide if they wanted to crush it or fill it.

  Arthur's job was appraisal. When the city evacuated a block, he decided what went into the Deep Storage and what went into the shredder. Most of it was shredder. Tax records from 1994. Birthday cards. Hard drives with corrupted sectors. People assumed value was intrinsic, like gold. Arthur knew better. Value was a function of attention, and attention was a scarce resource.

  He found the pamphlet inside a box of donated sermons from a defunct Unitarian church. It was thin, grey, and dated 1925. *The Foundation of Mathematics & Other Papers.* He wasn't looking for philosophy; he was looking for paper quality to test for acidity. But he was tired, and the text on page 186 caught his eye.

  It was an epilogue. A talk given to a society at Cambridge. The author, a F.P. Ramsey, was dead at twenty-six. Arthur read the passage while the dehumidifiers hummed a low, dying note in the corner.

  Ramsey argued that the universe was not drawn to scale. He said we make a category error when we weigh our lives against the stars. The stars are big, yes. They last a long time, yes. But in a picture drawn in perspective, the foreground figures are larger than the background mountains. To say a human life is insignificant because the universe is vast is like saying a tree is smaller than a mountain because the mountain is further away. It is a confusion of optics with ontology.

  Then came the line that made Arthur stop breathing for a second. Ramsey wrote that the heat death of the universe—the eventual cold silence of all matter—had a present value "at compound discount" that was effectively zero.

  Arthur sat back in his chair. He had spent twenty years fighting the entropy of the city. He fought mold, humidity, and the apathy of a generation that didn't care about the past. He fought because he believed that *lasting* was the point. If a thing survived, it mattered. If it was forgotten, it died a second death.

  But Ramsey was saying the duration didn't matter. The end of the story didn't retroactively cancel the middle. The fact that the lights would eventually go out didn't mean the light wasn't bright now. It wasn't a defiant shout against the dark. It was a ledger correction. The dark was too far away to be entered into the current column.

  "Arthur?"

  He jumped. Sarah was standing in the doorway of the vault. She looked exhausted. Her coat was damp from the rain outside; the sea wall had leaked again near the docks.

  "You're still here," she said. "The evacuation order for the lower levels came through an hour ago."

  "I'm appraising," Arthur said, holding up the pamphlet.

  "Save it for the truck." She walked in, trailing water. She didn't look at the boxes. She looked at her hands. "I'm not coming back, Artie. After the move. I'm resigning."

  Arthur knew this was coming. Sarah was the optimist of the pair. She was the one who digitized the photos, who tried to contact the descendants of the people in the portraits. But the flood season had been bad. The power grid was failing. The future looked like a shrinking circle.

  "Because of the water?"

  "Because of the pointlessness," she said. Her voice was flat. "We're archiving a sinking city. In fifty years, this whole peninsula will be under three feet of salt. Who is going to read these tax records? Who is going to care about the sermons? We're arranging deck chairs. I can't do it anymore. It's... it's all just waiting to be erased."

  Arthur looked at the pamphlet. He felt a strange sensation, like the floor tilting. He had the logic in his hand, cold and sharp as a scalpel. He could feel the truth of it, but it didn't feel like warmth. It felt like the air in a freezer.

  "Sit down," Arthur said.

  "I have to pack."

  "Sit."

  She sat on a crate marked *MISC. 1980-1990*. She rubbed her face. "It's the scale of it, Artie. Geologic time. Climate cycles. We're dust. Why are we pretending this matters?"

  Arthur opened the pamphlet. He didn't quote it directly. He didn't want to sound like he was reading a script. He tried to find the shape of the argument in his own mouth.

  "You're assuming the value is in the endurance," Arthur said.

  "I'm assuming value requires a future," Sarah corrected. "If there's no one to read it, it's not an archive. It's a tomb."

  "Imagine a map," Arthur said. "If you draw a map of the world to scale, the cities are microscopic. You can't see them. So you draw it in perspective. You make the cities big and the oceans small, not because the oceans aren't there, but because that's where the walking happens."

  Sarah stared at him. "That's poetry. It doesn't change the water level."

  "It's not poetry. It's accounting." Arthur tapped the page. "The end of the world. The heat death. The flood. It's all in the future. In economics, you discount future costs. If the cost is far enough away, the present value is zero. The fact that this archive will eventually rot doesn't subtract from the value of preserving it today. The rot is too far away to be on the ledger."

  Sarah laughed, a short, brittle sound. "So we're just ignoring the end of the world?"

  "No. We're acknowledging that it has no bearing on the current transaction." Arthur looked at her. He felt a sudden, terrifying clarity. It wasn't hope. Hope was warm. This was structural. "You say you have no reason to stay because it will all end. I say you have no reason to leave because it will all end. The end is irrelevant to the now."

  "That sounds glib," she said. "It sounds like something a man says before he drowns."

  "It's not about feeling good," Arthur said. He realized this was the crux of it. Ramsey hadn't written this to comfort anyone. He'd written it because it was true. "It's about being right. The universe is not a model to scale, Sarah. The stars are smaller than us right now, because we are here and they are there. Your despair assumes a viewpoint from nowhere. But there is no viewpoint from nowhere. There is only here."

  Sarah stood up. She didn't look comforted. She looked annoyed, as if he had tried to solve an emotional problem with a slide rule.

  "I'm still leaving, Arthur."

  "I know."

  "It doesn't matter what you say. The water is still coming."

  "I know."

  She walked to the door. She paused, her hand on the frame. "Does it work? Does thinking that way make you feel like it matters?"

  Arthur looked down at the grey pamphlet. He thought about the dehumidifiers humming in the corner, fighting a losing battle against the damp. He thought about the tax records, the sermons, the faces of dead people staring up from the boxes. He didn't feel a surge of purpose. He didn't feel a heroic defiance against the void. He felt a quiet, cold stability.

  "No," Arthur said honestly. "It doesn't make me feel like it matters. Feelings don't correspond to the facts."

  Sarah waited.

  "But," Arthur said, and he heard the echo of the dead Cambridge mathematician in his own voice, steady and unnerving. "I have reason on my side. And you don't."

  Sarah looked at him for a long moment. There was no anger in her face, only a kind of bewilderment. She wanted warmth, and he had given her geometry.

  "Goodbye, Artie," she said.

  "Goodbye, Sarah."

  She left. The heavy door clicked shut, engaging the seal. The hum of the dehumidifiers seemed louder now. Arthur was alone in the vault with the boxes that would eventually rot, in a city that would eventually sink, in a universe that would eventually go cold.

  He opened the drawer of his desk and placed the pamphlet inside. He picked up his pen and the next box label. His hand didn't shake. He didn't feel happy. He felt like a man standing in a room drawn in perspective, where the walls were close and the horizon was very, very small.

  He wrote *BOX 402: MISCELLANY* on the label. He pressed hard, indenting the cardboard. It was a small mark. It would not last. But it was the only thing that was currently large enough to see.
