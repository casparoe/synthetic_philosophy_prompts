answer: |-
  # The Illusion of Proof: Why Harsanyi's Theorem Fails to Mandate Utilitarianism

  For decades, John Harsanyi's Aggregation Theorem has held a seductive place in moral philosophy. It promises what philosophers have sought since Aristotle: a bridge from the descriptive to the normative, built not on intuition but on mathematics. The claim is bold: if individuals are rational (obeying the von Neumann-Morgenstern axioms of expected utility) and if society respects the Pareto principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then social welfare *must* be a weighted sum of individual utilities. Add a requirement of impartiality, and the theorem appears to mathematically coerce any rational agent into Classical Utilitarianism.

  However, this mathematical coercion is an illusion. In 1967, economist Peter Diamond dismantled the ethical force of this theorem with a simple coin-flip example. Diamond showed that Harsanyi's framework cannot account for the moral value of fair procedures, only fair outcomes. While Harsanyi's defenders argue that caring about procedure is irrational, this defense conflates *logical consistency* with *moral completeness*.

  The verdict is clear: **Diamond's objection succeeds.** Harsanyi's theorem does not prove that a rational, impartial person must be a utilitarian. Instead, it proves that a rational, impartial *consequentialist* must be a utilitarian. By embedding the Independence Axiom into social choice, Harsanyi silently presupposes the very conclusion he claims to derive. The theorem is mathematically valid but ethically question-begging. It does not corner a rational agent into utilitarianism; it merely filters out any agent who values fairness as more than just another outcome.

  ### The Machinery of Harsanyi's Argument

  To understand where the argument breaks, we must first appreciate its machinery. Harsanyi's Aggregation Theorem rests on three pillars. First, every individual has a utility function representing their preferences over uncertain outcomes (lotteries), satisfying the von Neumann-Morgenstern (VNM) axioms. Second, society also has a preference ranking over these lotteries that satisfies the VNM axioms. Third, the Pareto condition holds: if every individual prefers lottery $L_1$ to $L_2$, society must also prefer $L_1$ to $L_2$.

  Under these conditions, Harsanyi proved that the social welfare function $W$ must be a linear combination of individual utilities $U_i$:
  $$W = \sum a_i U_i + b$$
  If we further impose "impartiality"—meaning the weights $a_i$ are equal because no person's utility counts for more than another's—we arrive at the Utilitarian sum: maximize the total utility.

  The power of this argument lies in its apparent inevitability. It suggests that rejecting utilitarianism is akin to rejecting arithmetic. If you accept rationality (VNM) and respect for individual preferences (Pareto), utilitarianism is the only remaining option.

  ### The Diamond Objection: Fairness vs. Expectation

  Peter Diamond's 1967 counterexample exposes the crack in this foundation. Consider a society of two people and one indivisible good (say, a life-saving drug).
  *   **Option A:** Give the drug to Person 1. (Utilities: 1, 0)
  *   **Option B:** Give the drug to Person 2. (Utilities: 0, 1)
  *   **Option C:** Flip a fair coin to decide who gets it. (Expected Utilities: 0.5, 0.5)

  From the perspective of Harsanyi's theorem, these options are evaluated based on the sum of expected utilities.
  *   Sum for A: $1 + 0 = 1$
  *   Sum for B: $0 + 1 = 1$
  *   Sum for C: $0.5 + 0.5 = 1$

  Because the total expected utility is identical, Harsanyi's framework demands that society be indifferent between giving the drug deterministically to one person or flipping a coin. To a utilitarian aggregator, the coin flip adds no value.

  Diamond argues this is morally absurd. Most impartial observers prefer Option C. Why? Because the coin flip offers *ex-ante fairness* (equal opportunity), whereas Options A and B offer *ex-post inequality*. The procedure itself carries moral weight. By treating the coin flip as morally equivalent to a deterministic allocation, Harsanyi's theorem rules out the value of fair chances. It implies that the only thing that matters is the final distribution of goods, not how that distribution was arrived at.

  ### The Hidden Premise: The Independence Axiom

  Why does Harsanyi's theorem fail to capture this intuition? The culprit is the **Independence Axiom**, a core component of the VNM rationality conditions that Harsanyi applies to *social* preferences.

  The Independence Axiom states that if you prefer $A$ to $B$, you should still prefer a mixture of $A$ and $C$ to a mixture of $B$ and $C$. In the context of social choice, this axiom implies that social value is determined solely by the probabilities of final outcomes, independent of the correlation between those outcomes and individual identities.

  When Harsanyi applies the VNM axioms to society, he is making a massive, unargued assumption: **that society faces risk in the same way an individual does.** When an individual flips a coin for a prize, they bear the risk. When society flips a coin to allocate a prize between two people, society does not bear the risk; the *individuals* do.

  By forcing social preferences to obey the Independence Axiom, Harsanyi implicitly defines "rationality" in a way that excludes procedural values. If you value the coin flip for its own sake, your preferences violate the Independence Axiom (because you prefer the lottery $C$ over the equivalent expected outcome of $A$ or $B$). Harsanyi would label this preference "irrational." But this is a semantic sleight of hand. It is not irrational to care about fairness; it is only irrational *within the specific constraints of VNM theory*.

  Therefore, the theorem does not derive utilitarianism from pure rationality. It derives utilitarianism from **rationality + consequentialism**. The Independence Axiom is essentially a mathematical encoding of consequentialism—the view that only outcomes matter. By requiring social preferences to satisfy this axiom, Harsanyi has smuggled consequentialism into the premises. He claims to prove that rationality leads to utilitarianism, but he has actually assumed consequentialism to get the result.

  ### The Defense and Its Failure

  Defenders of Harsanyi, such as John Broome or later rule-utilitarians, often argue that Diamond's intuition can be absorbed into the utility function. They suggest that if people value fairness, we can simply include "fairness" as a component of individual utility. If Person 1 and Person 2 both get utility from knowing the process was fair, then the coin flip *does* yield higher total utility, and Harsanyi's theorem still holds.

  This defense fails for two reasons. First, it misrepresents the nature of the fairness objection. The value of a fair procedure is often deontological, not consequentialist. We value the coin flip not because it produces a "feeling" of fairness (a mental state), but because it respects the equal status of the persons involved. Reducing this to a psychological preference trivializes the moral claim.

  Second, and more technically, incorporating fairness into individual utilities often violates the Pareto condition in the way Harsanyi requires. If Person 1 prefers the coin flip, and Person 2 prefers the coin flip, the Pareto principle says society should prefer the coin flip. But Harsanyi's theorem calculates social welfare based on the expected utility of the *outcomes*. If the "fairness" is a property of the *process* (the lottery itself) rather than the *outcome* (who gets the drug), it cannot be represented in the standard VNM utility function over outcomes without violating the axioms that make the theorem work. To make the theorem work, you must define utility over outcomes only. To capture fairness, you must define utility over processes. You cannot do both without breaking the math.

  ### The Verdict

  Harsanyi's Aggregation Theorem is a masterpiece of formal economics, but it is a failure of moral philosophy. It succeeds in showing that *if* you accept a specific, narrow definition of rationality (VNM axioms applied to social states) *and* you accept that only outcomes matter (consequentialism), *then* you must be a utilitarian.

  But Diamond's coin flip demonstrates that the "if" is doing all the heavy lifting. A rational, impartial person is not forced into utilitarianism because it is perfectly rational to value procedural fairness. The fact that Harsanyi's axioms rule out procedural fairness does not prove procedural fairness is irrational; it proves Harsanyi's axioms are too narrow to capture the full scope of moral rationality.

  The theorem ultimately suffers from a category error. It treats society as a super-individual facing risk, rather than a collection of individuals facing distribution. In doing so, it confuses the *expectation of utility* with the *utility of expectation*.

  Therefore, the Diamond objection stands. Harsanyi did not find a mathematical proof for utilitarianism; he constructed a mathematical model that presupposes it. The rational, impartial observer is not cornered. They are free to reject the Independence Axiom for social choices, embrace the value of the coin flip, and reject the utilitarian sum without contradicting reason. The theorem tells us about the consistency of preferences, but it tells us nothing about which preferences we ought to have.
