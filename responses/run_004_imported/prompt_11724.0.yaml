      *   *The Nuance:* In "Of Money," the injection enters via trade or mining (natural circulation). In QE, it enters via the financial system to buy government paper.
      *   *The Verdict:* He wouldn't see it as "institutionalizing stimulus." He would see it as *delaying the reckoning* of "Of Public Credit." The stimulus is artificial because it's not lubricating new trade, it's lubricating the debt rollover. It creates the *illusion* of wealth (higher asset prices) without the industry.
