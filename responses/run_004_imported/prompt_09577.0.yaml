      *   **Specific Problem:** F&S critique "top-down" effects (beliefs, desires) as demand characteristics/response bias. A student argues Macpherson's "memory color" effect (indirect penetration via stored associations) escapes F&S because it's sub-personal and uses matching tasks.
      *   **Task:** Construct the *strongest available argument* against the student's optimism. Specifically, argue that Macpherson's memory-color cases *fail* to establish cognitive penetration in a way that troubles a defender of modular, impenetrable early vision.
      *   **Key Strategy:** Argue that stored sub-personal associations belong to *encapsulated perceptual constancy mechanisms* rather than belief-sensitive personal-level interactions, thus preserving the epistemic significance of the impenetrability thesis.

  2.  **Deconstruct the Student's Argument:**
