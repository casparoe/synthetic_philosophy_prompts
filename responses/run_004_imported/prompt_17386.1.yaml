  **Move 1 (Noah): -1**
  Noah applies "ought implies can" (OIC) rigidly, concluding that because Maren couldn't do both, one obligation must not have been real. He scores negatively because he dismisses Maren's guilt as a "mistake." This ignores the widely accepted ethical concept of **moral residue**: the idea that even when we make the right choice in a dilemma, the overridden obligation leaves a trace (guilt/regret) that is rational and appropriate, not an error.

  **Move 2 (Ella): 1**
  Ella correctly distinguishes between individual and joint possibility. She argues that OIC applies to each specific obligation separately (she *could* have gone to the meet; she *could* have gone to the hospital). This is a strong move because it preserves the genuineness of both promises without immediately violating OIC, aligning better with our moral intuition that both promises mattered.

  **Move 3 (Noah): 0**
  Noah pushes back by invoking the **Agglomeration Principle** (if you ought to do A and ought to do B, you ought to do A and B). If this principle holds, Ella's view does lead to morality demanding the impossible. This move is logically valid within standard deontic logic, so it isn't "wrong," but it begs the question by assuming Agglomeration is inviolable, which is exactly what is at stake in moral dilemma cases.

  **Move 4 (Ella): 2**
  Ella wins the exchange by identifying the hidden premise in Noah's argument: Agglomeration. She correctly notes that many ethicists reject Agglomeration in cases of conflict to preserve the reality of dilemmas. By rejecting the idea that separate obligations automatically combine into a conjunctive obligation, she saves OIC, validates the conflicting duties, and explains the guilt as a real moral cost rather than a mistake.

  **What They Are Missing**
  Both debaters overlook **W.D. Ross's distinction between *prima facie* and *all-things-considered* duties**. Ross would argue Maren had two *prima facie* duties (binding unless overridden). When they conflicted, one became her *all-things-considered* duty (the hospital), while the other remained a *prima facie* duty that was overridden but not erased. This explains why she wasn't obligated to do the impossible (satisfying both all-things-considered) while also explaining why the guilt is rational (the overridden *prima facie* duty still exerts moral weight). This framework bridges Noah's logic and Ella's phenomenology.
