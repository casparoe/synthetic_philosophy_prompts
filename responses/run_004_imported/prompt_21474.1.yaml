      *   *Observation:* Einstein/Poincaré showed this "hinge" was actually a convention/definition, leading to SR.
      *   *Problem/Tension:* If hinges can crack and be replaced based on theoretical utility (like SR vs. Newton), aren't they just very strong empirical beliefs? How is this different from normal science?

  3.  **Address Question 1: Representation of Wittgenstein:**
