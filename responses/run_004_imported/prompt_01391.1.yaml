      *(Refining the "Power of Nothing" argument)*: Think of it like inflation. If money has no gold backing (nothing), it can flood the market more easily than gold coins (something). The Public floods the social sphere with opinion that has no backing in action. This devalues *all* action. That is the leveling.

  8.  **Final Review against constraints:**
