      *   *The Problem:* Usually, power requires substance (armies, money, shared belief). Kierkegaard says power here comes from *lack* of substance.
      *   *Key Concept 1: Responsibility/Accountability.* Concrete groups (parties, congregations) have specific goals. If they fail, *someone* is responsible. If they level, they level *for* something (even if barren). The Public levels *without* responsibility because no one *is* the Public.
      *   *Key Concept 2: The Press/Abstraction.* The press allows opinion without action. It separates the speaker from the speech. This creates the "phantom."
      *   *Key Concept 3: Passion vs. Reflection.* Passion entails commitment (concretion). Reflection entails distancing (abstraction). A reflective age thinks about everything but commits to nothing. This state allows the "Public" to exist because individuals can step out of their concrete roles into a neutral zone of "opinion."
      *   *Key Concept 4: Leveling (Nivellering).* Leveling isn't just making everyone equal; it's negating the qualitative distinction (the exceptional individual). Concrete opposition strengthens the exceptional (martyrdom). Abstract opposition dissolves the exceptional into noise.

