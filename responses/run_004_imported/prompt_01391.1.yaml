          *   "In ages of enthusiasm... there is nonetheless no public: there are parties, and there is concretion." (Danish: *...er der dog intet Publikum: der er Partier, og der er Concrethed.*) -> Accurate.
          *   "The public is the true master of leveling, for when leveling happens only approximately, it happens by means of something — but the public is a monstrous nothing." (Danish: *Publikum er Nivelleringens egentlige Mester...*) -> The logic holds.
          *   "The public is not a people, not a generation..." (Danish: *Publikum er ikke et Folk, ikke en Generation...*) -> Accurate.
          *   "...not one single person belonging to the public has any essential commitment..." (Danish: *...har ikke nogen væsentlig Forpligtelse...*) -> "Commitment" or "obligation" works for *Forpligtelse*.
