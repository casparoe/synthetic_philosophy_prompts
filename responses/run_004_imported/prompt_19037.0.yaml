answer: |-
  Good morning. For those who don't know me, I'm [Name]. In this family, I'm the designated wordsmith, the one hired to arrange the nouns when the verbs stop working. But standing here, looking at the flowers, and knowing who we are here to honor, I find that my usual trade feels insufficient. My mother was a woman who treated language with a terrifying precision. She spent twenty-six years on the state appellate bench, and she spent an entire adulthood reading Pascal in the original French.

  If you knew her well, you know about the Pascal. She carried a Pléiade edition of the *Pensées* that was so worn along the spine that whole gatherings of pages had worked loose. It looked less like a book and more like a stack of paper held together by friction and habit.

  She liked to quote a specific fragment at family dinners, usually when someone complained that a verdict or a statute was unfair. She would look up from her soup and say, *"la justice sans la force est impuissante ; la force sans la justice est tyrannique."* Justice without force is powerless; force without justice is tyrannical.

  Now, to her colleagues in the room, I don't need to explain what she meant by that. But for the rest of us, for the family who just saw her as the woman who made the best roast chicken and demanded we call her on Sundays: she didn't say this to be cynical. She didn't mean that the law was a scam. She meant it as a kind of theological humility.

  She believed that in the condition we are in, as human beings, we are simply not equipped to see true Justice directly. We can't access it. So, what we call "law" is actually custom, backed by force, and dressed up after the fact as though it had been Justice all along. She liked another fragment where Pascal observes that whether killing a man counts as murder or heroism depends on nothing loftier than which side of a river he happened to live on. To her, this wasn't a reason to despair. It was a mercy. Because if we claimed we could see True Justice clearly, we would feel licensed to enforce our own private verdicts on everyone else. The law, imperfect as it was, kept us from tearing each other apart.

  This view could have made a judge lazy. If it's all just custom and force, why sweat the details? But my mother was almost pathologically scrupulous about getting each case right. She drew a hard, visible line on the bench between rulings that merely settled something and rulings that got dressed up as moral triumphs. She reserved a special, quiet contempt for the second kind. She knew that when a judge starts acting like a prophet, the law starts breaking.

  She left a note clipped inside that worn copy of Pascal. She asked that it be read today. I am reading it now, exactly as she wrote it:

  *"Do not let anyone stand up and say I believed in Justice. I did not. And do not let anyone conclude, therefore, that I believed in nothing."*

  That note is the key to her life. It resolves the tension that might confuse those who didn't know her mind. How could she not believe in Justice, yet care so deeply about the law?

  She cared because while "Justice" might be an abstraction we can't reach, the *people* standing in front of her were real. The stakes were real. If the law is a fragile dam holding back the chaos of private vendettas, then every brick matters. Every ruling had to be sound, not because it was achieving divine righteousness, but because it was maintaining the peace. Her scrupulousness was not a quest for glory; it was an act of stewardship. She treated the law like a borrowed instrument that had to be returned in working order, not banged on to make a moral point.

  She believed in *nothing* less than the truth of the case in front of her. She believed in the obligation to listen. She believed that because we cannot be gods, we must be meticulous neighbors.

  To her clerks and colleagues: She respected you because you understood that the work was the point, not the legacy. To her family: She loved you because you were the specific, messy reality that the law exists to protect. She didn't need to believe in a capital-J Justice to believe in *you*.

  I will miss her. I will miss the way she could dismantle a bad argument with a single raised eyebrow, and the way she would read French poetry aloud in the kitchen while chopping vegetables. She was exacting, yes. She was combative, often. But she was warm, in the way a hearth is warm: defined by its boundaries, by what it keeps out, so that those inside can survive the winter.

  She did not believe in Justice. She believed in us. And she worked, tirelessly and without fanfare, to make sure we could live together without destroying one another.

  Rest well, Mom. The pages are loose, but the binding holds.
