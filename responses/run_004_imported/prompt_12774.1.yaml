      *   *Leibniz's view on Space:* Leibniz denies absolute space. Black's spheres rely on a spatial framework. QM is tricky on space. Leibniz would likely attack the notion that spatial separation constitutes a genuine distinguishing property anyway (since space is relational).
      *   *Best angle:* Leibniz would seize on the fact that QM denies "thisness" (haecceity). For Leibniz, complete concepts *include* all properties. If the complete concept of Electron A is identical to Electron B, they are the same. QM says we can't even track them. Leibniz says: "Then they aren't distinct substances."

