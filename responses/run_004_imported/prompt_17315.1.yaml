answer: |-
  You have stumbled upon one of the most robust findings in behavioral economics and psychology. Your brother's diagnosis ("lack of discipline") is incorrect because it treats this as a character flaw rather than a structural feature of human cognition. If your discipline works perfectly in the distant scenario, you *have* discipline; you simply have **time-inconsistent preferences.**

  Here is the breakdown of what is producing the flip, which version of you to trust, and how to act on it without relying on willpower.

  ### 1. What is producing the flip?
  The phenomenon you are experiencing is called **Hyperbolic Discounting** (or Present Bias).

  In standard economic theory (Exponential Discounting), people are assumed to value rewards consistently over time. If you prefer \$100 in 31 days over \$50 in 30 days, you should also prefer \$100 in 2 days over \$50 in 1 day. The ratio remains constant.

  However, human brains do not work exponentially; we work hyperbolically. We apply a massive "discount rate" to anything happening *right now* compared to anything happening in the future.
  *   **In the distant scenario:** Both the party and the studying are abstract concepts in the future. Your brain evaluates them logically based on your long-term values (Grade > Party).
  *   **In the immediate scenario:** The party is no longer abstract. It is visceral. It triggers your brain's reward system (dopamine) *now*. The pain of studying is also immediate. The final exam is still abstract.

  Your brain weighs immediate rewards roughly **2 to 4 times heavier** than delayed rewards. As the party moves from "four weeks away" to "tonight," its subjective value spikes disproportionately, overtaking the value of the grade, even though the *relationship* between the party and the grade hasn't changed.

  This is also explained by the **Hot/Cold Empathy Gap**.
  *   **Cold State (4 weeks out):** You are calm, rational, and not currently experiencing the fear of missing out (FOMO) or the fatigue of a school week.
  *   **Hot State (Tonight):** You are influenced by social pressure, fatigue, and immediate temptation. In a "hot" state, you literally cannot accurately predict how you will feel in a "cold" state, and vice versa.

  ### 2. Which judgment deserves more trust?
  You should trust the **distant judgment** (the one made four weeks out).

  Here is the principled argument for why:
  The distant judgment aligns with your **reflective values** (what you want for your life trajectory). The immediate judgment aligns with your **impulsive states** (what you want for your current mood).

  Philosopher Jon Elster and economist Thomas Schelling argued that when there is a conflict between your "planning self" and your "doing self," the planning self represents your true agency. The "doing self" is often hijacked by biological impulses that you do not endorse upon reflection. You explicitly stated: *"I know perfectly well that the grade matters more to me in the end."* That is your reflective value speaking. The urge to go to the party is a transient state, not a value.

  Therefore, the flip isn't evidence that your values changed; it is evidence that your **perception of value was distorted by proximity.**

  ### 3. How to decide without "trying harder"
  You are correct that resolving to "try harder" is a flawed strategy. Willpower is a limited resource (a concept known as *ego depletion*, though the mechanics are debated, the practical reality holds). If you rely on willpower tonight, you are betting that your "hot state" self will suddenly act like your "cold state" self. That is a bad bet.

  Instead, you need **Precommitment Strategies** (often called Ulysses Pacts). You must change the choice architecture so that the path of least resistance aligns with your distant judgment.

  **Actionable Tactics:**

  *   **Increase Friction for the Party:** Make going to the party difficult *now*, while you are still rational.
      *   Tell your parents you are staying in to study (social accountability).
      *   Give your car keys or phone to a friend/parent until tomorrow morning.
      *   Commit to a study group where your absence would let others down (social cost).
  *   **Decrease Friction for Studying:**
      *   Set up your study space *now*, before you get tired. Open the textbook, lay out the notes.
      *   Commit to only 20 minutes. Often, the pain is in the *start*, not the continuation.
  *   **Reframe the Reward:**
      *   Hyperbolic discounting works because the party reward is immediate. Make the studying reward immediate.
      *   "If I finish this chapter tonight, I can watch an episode of my favorite show/guilt-free scroll social media for 30 minutes." Bring a small immediate reward into the studying bucket.
  *   **The Compromise (if necessary):**
      *   If the social cost of missing the party is too high (mental health/burnout is real), negotiate with your distant self. "I will go for exactly one hour, then I will leave." Set an alarm on your phone that you cannot ignore. This satisfies the immediate urge without sacrificing the long-term goal.

  ### Summary
  You are not undisciplined; you are human. The "flip" is a predictable cognitive bias where immediate proximity distorts value.

  **The Verdict:** Trust the judgment of your self from four weeks ago. That version of you knew what mattered without the interference of immediate temptation. Do not fight your biology with willpower; outsmart it with precommitment. Lock in the study session now, while you are still the person who wants to pass AP Chemistry.
