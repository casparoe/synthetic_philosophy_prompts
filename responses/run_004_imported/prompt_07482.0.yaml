      *   *Nuance:* Acknowledge why the confusion arises. Liberal democracy defends parties *because* of competition (checks and balances). Weil rejects the premise that competition purifies; she thinks competition degrades *all* participants. But removing competition doesn't purify; it solidifies the degradation.
