      *   **Pressure on Thought:** Parties demand adherence to a "line." They replace truth with loyalty.
      *   **Attention/Decreation:** Weil's epistemology relies on individual, solitary attention to truth (the good). Collectives obscure this.
      *   **Totalitarianism:** Weil wrote this in 1940-1943. She was acutely aware of Nazi Germany and the Soviet Union. She explicitly equates parties with totalitarian mechanisms, regardless of whether there is one or many.
      *   **The Common Good:** The common good is not an aggregate of interests (which parties represent) but a transcendent truth that requires individual discernment.

