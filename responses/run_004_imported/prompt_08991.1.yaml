      *   *Jarrett's Decomposition:*
          *   Parameter Independence (PI): $P(A|a, b, \lambda) = P(A|a, \lambda)$. (Alice's outcome doesn't depend on Bob's *setting*).
          *   Outcome Independence (OI): $P(A|a, b, B, \lambda) = P(A|a, b, \lambda)$. (Alice's outcome doesn't depend on Bob's *outcome*).
      *   *QM Status:* QM violates Bell inequalities. QM respects PI (no signaling). QM violates OI (correlations remain).
      *   *Philosophical Implication:* No signaling = compatible with Special Relativity (SR) in a pragmatic sense. Violation of OI = "Holism" or "Non-separability" rather than causal influence.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the common simplification ("QM is nonlocal") and introduce the nuance (Jarrett/Shimony). Set the stage with Alice and Bob.

      *   **Defining the Two Conditions (Intuitively):**
          *   *Scenario:* Alice and Bob share entangled particles. They are far apart.
          *   *Parameter Independence (PI):* Focus on *choice of measurement*. If Bob changes his knob (setting), does Alice's statistics change? If yes, PI is violated. This is about *control*.
          *   *Outcome Independence (OI):* Focus on *results*. If Bob gets "Up", does that change the probability of Alice getting "Up" (beyond what we already know from the source)? If yes, OI is violated. This is about *correlation*.
          *   *Analogy:* Maybe use a pair of gloves or coins?
