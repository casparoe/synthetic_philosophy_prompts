      *   **Timing of Notification:** He texted *once the internship started*. He knew in the spring. This is a breach of duty to notify.
      *   **Nature of the Promise:** It's familial/mentorship, not transactional. The value is the *time together*, not just the skill transfer.
      *   **Alternative Arrangements:** Did Marcus help find another teacher?
