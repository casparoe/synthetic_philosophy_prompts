          *   *Core:* A promise is a promise. Better opportunities don't excuse breach.
          *   *Gets Right:* The moral weight of commitment. Trust relies on reliability. If "better things" excuse us, promises are hollow.
          *   *Overreaches:* Ignores *force majeure* or genuine impossibility. Is an internship *actually* incompatible with teaching driving? (Weekends? Evenings?) It treats all promises as absolute regardless of cost.
          *   *Response to Context:* It sets the baseline. It challenges the idea that the internship *automatically* excuses him.

      *   **Move 2: Ben (The Implicit Conditions/Reasonable Expectation View)**
          *   *Core:* Promises assume normal conditions. Big life changes (internships) are implicit exceptions.
          *   *Gets Right:* Life is unpredictable. Rigid adherence can be harmful to the promisor's future. Most people understand priorities shift for major opportunities.
          *   *Overreaches:* Assumes the cousin *would* agree. Defines "reasonable" unilaterally. Ignores the specific relationship (mentorship vs. task).
          *   *Response to Nadia:* Challenges the rigidity. Argues that binding power isn't absolute but contextual.

      *   **Move 3: Nadia (The Subjective Reliance/Communication View)**
