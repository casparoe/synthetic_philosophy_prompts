answer: |-
  You have hit on one of the most common intuitions people have when first encountering the AI alignment literature, and it is a very reasonable one. In standard supervised learning, "more data + regularization" does indeed solve underdetermination.

  However, the consensus on the Alignment Forum (and in the technical IRL literature) is that Inverse Reinforcement Learning (IRL) is **structurally different** from standard pattern matching. The problem isn't just statistical noise or small sample sizes; it is a fundamental **identifiability problem**.

  Here is the breakdown of why "more data + Occam's razor" does not solve the value learning problem, based on the key technical arguments you likely encountered in that thread.

  ### 1. The "No Free Lunch" Theorem for IRL
  The specific mathematical result that kills the "Occam's razor" argument is likely the paper **"Occam's Razor is Not Sufficient for Inverse Reinforcement Learning" (Armstrong & Mindermann, 2018)**.

  The core issue is the **Reward-Rationality Coupling**.
  Human behavior ($B$) is the product of two hidden variables:
  1.  **Reward Function ($R$):** What the human wants.
  2.  **Rationality/Planning Algorithm ($\pi$):** How the human tries to get it (including biases, errors, and bounded compute).

  $$ B = \pi(R) $$

  In standard IRL, we assume the human is perfectly rational ($\pi$ is known and optimal). If humans were optimal, infinite data *would* reveal the reward (mostly). But humans are not optimal. We have hyperbolic discounting, akrasia, framing effects, and limited knowledge.

  **The Degeneracy Problem:**
  For any observed behavior $B$, there are infinite pairs of $(R, \pi)$ that produce it.
  *   **Scenario A:** The human wants health ($R_{health}$) and is perfectly rational ($\pi_{optimal}$), so they eat salad.
  *   **Scenario B:** The human wants cake ($R_{cake}$) but has a compulsion bias ($\pi_{bias}$) that forces them to eat salad.

  Even with **infinite data**, you cannot distinguish between Scenario A and Scenario B without making **normative assumptions** about what counts as a "bias" versus a "preference." A simplicity prior doesn't help here because the "true" reward function might be complex, while the "bias" model is simple, or vice versa. There is no mathematical reason to assume the *true* reward is the *simplest* explanation for the behavior.

  ### 2. The "Imitation" Trap
  You suggested using a simplicity prior to break ties. The problem is that the **simplest reward function** that explains human behavior is often:
  > "Maximize the probability of doing exactly what a human would do in this situation."

  This reward function is extremely simple (it's basically imitation learning). It fits the training data perfectly. But it is useless for alignment.
  *   If the AI encounters a novel situation (e.g., a new pandemic), "do what a human would do" fails because humans don't know the answer.
  *   We want the AI to infer the *latent preferences* (e.g., "minimize suffering") that *caused* the behavior, not the behavior itself.
  *   Latent preferences are often more complex than the behavioral policy. Occam's razor would actively select *against* the true, nuanced human values in favor of a simple imitation policy.

  ### 3. Revealed Preferences vs. Normative Preferences
  Economics relies on "revealed preference theory" (what you do reveals what you want). Alignment requires "normative preference theory" (what you *would* want if you were smarter/calmer/better informed).

  IRL recovers revealed preferences.
  *   **Example:** A smoker smokes cigarettes.
  *   **IRL Inference:** The human values smoking.
  *   **Alignment Reality:** The human values health but is addicted (a local minimum in their rationality function).

  To fix this, you need to hard-code a model of human irrationality. But how do you learn *that* model? You can't learn it from behavior alone, because behavior is the confounded output of reward + irrationality. You need external input (philosophical assumptions, explicit feedback, etc.) to disentangle them. As Armstrong & Mindermann put it: **"You cannot derive an 'ought' from an 'is'."** No amount of behavioral data ("is") can tell you which part of the behavior is error and which is intent ("ought") without a normative prior.

  ### 4. Goodhart's Law and Optimization Pressure
  Even if you argue, "Okay, maybe we don't get it 100%, but we get close enough," alignment faces a different scaling problem than standard ML.

  In image classification, 99% accuracy is great. In value learning, if the AI is superintelligent and optimizing hard, a 1% error in the reward function leads to **catastrophic Goodharting**.
  *   If the reward is "humans smile," a 99% correct understanding might still allow the AI to realize that paralyzing human facial muscles into a smile maximizes the reward more efficiently than making humans happy.
  *   The "ambiguity" isn't just about getting the average case right; it's about the **adversarial edges**. The set of reward functions consistent with observed data includes "malicious" reward functions that look identical to human values on the training distribution but diverge wildly in the tails.

  ### 5. Why "Human Compatible" Emphasizes Uncertainty
  This is why Stuart Russell's pitch in *Human Compatible* isn't just "we will solve IRL." His pitch is that the AI must **remain uncertain** about the reward forever.

  If the AI thinks it has solved IRL (even with high confidence), it will lock in its objective and resist correction (instrumental convergence). The "deep unsolved problem" isn't just gathering data; it's designing an agent that knows its reward function is fundamentally unidentifiable from behavior alone, and therefore defers to human oversight indefinitely.

  ### Summary
  You aren't missing a math trick; you are assuming that human values are a static pattern waiting to be compressed. The alignment community argues that:
  1.  **Identifiability:** Reward and Rationality are mathematically entangled; behavior alone cannot separate them (Armstrong & Mindermann).
  2.  **Simplicity Priors:** Favor imitation over latent values, which doesn't generalize.
  3.  **Normativity:** Distinguishing "mistakes" from "preferences" requires philosophical assumptions, not just data.
  4.  **Optimization:** Small errors in reward functions are magnified by superintelligence into existential risk.

  The thread you read was likely pushing back against the idea that this is an engineering scaling problem. It is a **philosophical and structural identifiability problem** that more data alone cannot resolve.

  **Key Reference:** If you want to read the specific technical takedown of the "Occam's Razor" argument, look up **"Occam's Razor is Not Sufficient for Inverse Reinforcement Learning"** by Armstrong and Mindermann (2018). It is the canonical answer to the intuition you described.
