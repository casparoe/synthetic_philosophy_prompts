      *   Make sure to address the "Human Compatible" angle (Russell knows this, that's why he emphasizes *keeping* uncertainty, not just solving IRL).

  6.  **Self-Correction/Edge Case Check:**
      *   *Did I miss the "more data" argument?* Even with infinite data, if the human is sub-optimal, the mapping is not bijective. I need to emphasize that *optimality* is the assumption that breaks.
      *   *Is simplicity prior completely useless?* It helps, but not enough to distinguish between "true reward" and "reward + bias" because the complexity of "bias" can be low.
      *   *What about CIRL?* Cooperative IRL helps by allowing interaction, but the fundamental identifiability problem remains without normative assumptions.

  7.  **Final Polish:** Organize into clear headings. Ensure the Armstrong & Mindermann paper is highlighted as the direct answer to the "Occam's razor" claim. (This is the "smoking gun" for this specific debate).

