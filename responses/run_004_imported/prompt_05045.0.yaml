answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Justice Task Force Board
  **FROM:** [Your Name], Technical Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Risk Assessment Tool Contract Renewal

  **Recommendation**
  I recommend the Board vote to **renew the vendor contract conditioned on the tool meeting Equal False Positive Rates (FPR) across racial groups**, rather than the current standard of Calibration.

  This recommendation prioritizes the protection of individual liberty over predictive consistency. In the pretrial context, the most severe harm is detaining a defendant who would not have committed a new crime if released (a False Positive). Our data confirms that Black defendants currently suffer this error at higher rates than White defendants. Conditioning renewal on equalizing this error rate directly addresses that disparate impact.

  **The Statistical Constraint**
  At the last meeting, I noted a mathematical reality confirmed by recent academic literature (specifically the "Impossibility Theorem" in fairness modeling): **When underlying arrest rates differ between groups, a tool cannot simultaneously be "Calibrated" and have "Equal False Positive Rates."**

  *   **Calibration** means a score of "7" predicts the same re-arrest probability regardless of race. The vendor's tool currently achieves this.
  *   **Equal FPR** means that among defendants who *would not* re-offend, the rate of being wrongly flagged as "high risk" is the same across races.

  Because historical policing patterns have created different underlying arrest rates (base rates) across neighborhoods, maintaining Calibration requires accepting unequal error rates. To equalize the errors (FPR), we must adjust the decision thresholds, which inevitably means a score of "7" will imply different levels of risk for different groups. We cannot have both. The Board must choose which mathematical property aligns with our policy goals.

  **Rationale: Why Equal False Positive Rates?**
  Our primary constitutional mandate in pretrial proceedings is to ensure liberty is not deprived without due process. When the tool flags a low-risk defendant as high-risk, that defendant may lose their job, housing, or custody of children while awaiting trial.

  Currently, the cost of the tool's error is not shared equally. Black defendants are more likely to be detained erroneously. By conditioning renewal on Equal FPR, we force the system to bear the cost of uncertainty equally. We are effectively stating that the county is unwilling to sacrifice the liberty of one group to maintain the statistical "cleanliness" of the scores for another.

  **Engaging the Counter-Argument (Calibration)**
  The strongest argument against this recommendation, posed by the DA's office and the vendor, is that abandoning Calibration undermines the integrity of the risk score. If a score of "7" means a 70% risk for White defendants but a 50% risk for Black defendants (to achieve equal errors), judges cannot interpret the score uniformly. Critics argue this amounts to applying different standards of justice based on race.

  This is a serious concern. However, it rests on the assumption that the input data (arrest records) is a neutral measure of "risk." As the Board acknowledged, arrest data reflects policing intensity as much as criminal behavior. If the input data is biased, a "Calibrated" score simply ensures that the bias is applied consistently. A score of "7" being "equally predictive" across groups is only valuable if the underlying behavior being predicted is measured equally. Since it is not, strict Calibration effectively codifies historical policing disparities into our bail decisions. We must choose between a score that *means* the same thing (Calibration) or a decision that *impacts* people the same way (Equal FPR). In a liberty-deprivation context, impact must prevail.

  **Implementation and Review Timeline**
  This condition is not a permanent fix, but a necessary mitigation while broader policing reforms are pursued.

  1.  **Contract Amendment (Immediate):** Renewal is contingent on the vendor adjusting decision thresholds within 90 days to demonstrate statistical parity in False Positive Rates across racial groups.
  2.  **Judicial Training (Month 2):** If thresholds differ by group, judges must be trained that risk scores are not "colorblind" metrics. Alternatively, the tool should output a binary "Release/ detain" recommendation rather than a numeric score to prevent misinterpretation.
  3.  **Sunset Clause (12 Months):** The Board will reconvene in one year. If the vendor cannot meet Equal FPR without severely degrading overall accuracy (increasing False Negatives significantly), the contract will not be renewed again, and the County will transition to a non-algorithmic Structured Decision-Making checklist.

  **Conclusion**
  Statistics cannot solve sociological problems. No mathematical adjustment can fix the fact that our data reflects unequal policing. However, we can choose how that inequality flows through our system. By choosing Equal False Positive Rates, we choose to shield defendants from disparate errors, even if it complicates the interpretation of the score.

  I move we condition renewal on this metric.
