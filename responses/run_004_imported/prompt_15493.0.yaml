answer: |-
  This is a sophisticated objection that cuts to the meta-ethical foundations of the moral trade framework. It challenges the assumption that moral value is aggregable and transferable in a way that is neutral between normative theories. Below, I articulate the strongest version of this "Motive-Constraint Objection," survey the most robust defenses available to a proponent of moral trade (like Ord), and offer a verdict on the viability of the framework in light of this critique.

  ### I. The Motive-Constraint Objection

  The core claim of moral trade is that agents with divergent moral views can secure a Pareto improvement by exchanging concessions on actions they care less about for concessions on actions they care more about. This relies on the premise that the *value* of the concession is captured entirely (or sufficiently) by the **occurrence** of the act-type or its **consequences**.

  The objection is that for a significant class of normative theories, the moral value of an action is not exhausted by its type or consequences; it is constitutively dependent on the **reasons for which it is performed**. If this is true, moral trade systematically degrades the moral value of the traded acts, potentially negating the supposed gain "by each partner's own lights."

  **1. The Kantian Challenge: Price vs. Dignity**
  For a Kantian deontologist, an action has genuine *moral worth* only if done from duty, motivated by respect for the moral law. If Agent A (a Kantian regarding animals) agrees to go vegetarian *only because* Agent B (a Kantian regarding hunting) agrees to stop hunting, Agent A is acting on a hypothetical imperative ("If you stop hunting, I will stop eating meat") rather than a categorical one.
  Kant distinguishes between acting *in accordance with duty* and *from duty*. Moral trade secures the former but structurally undermines the latter. If Agent A's theory holds that a world where agents act merely in accordance with duty (for prudential or bargaining reasons) is not morally superior in the relevant sense to a world of non-compliance, then the "gain" is illusory. Worse, if the theory holds that treating moral requirements as negotiable commodities violates the dignity of the moral law, the trade itself might be morally impermissible.

  **2. The Virtue-Ethical Challenge: Character and Expression**
  Virtue ethics evaluates actions based on what they express about the agent's character (*hexis*). A virtuous act flows from a stable disposition of practical wisdom (*phronesis*).
  In a moral trade, the motivation is transactional. If I forgo trophy hunting not because I recognize it as cruel or hubristic, but because I want you to stop eating meat, my action does not express the virtue of compassion or humility. It expresses the trait of being a "deal-maker." If the moral value of the state of affairs depends partly on the moral quality of the agents inhabiting it, a world secured through trade may be inferior to a world secured through moral conversion, even if the act-types are identical. The trade produces "correct behavior" without "moral improvement," which may be insufficient for the virtue ethicist's valuation function.

  **3. The Integrity Objection**
  Bernard Williams famously argued against utilitarianism that it violates agent integrity by alienating agents from their projects and convictions. Moral trade risks a similar alienation. It asks agents to treat their moral commitments as preferences in a utility function that can be offset against other preferences. For a theorist who believes moral duties are **agent-relative constraints** (e.g., "I must not kill," not "Killing must be minimized"), trading a violation of a constraint for a concession elsewhere is incoherent. I cannot "pay" you to violate my constraint, nor can I violate yours to satisfy mine, if the constraint is non-fungible.

  **Conclusion of the Objection:**
  Moral trade implicitly assumes a **consequentialist** or **act-individuation** model of value, where the *act-token* is the bearer of value independent of the *psychological context*. If either party holds a motive-sensitive view, the trade alters the moral description of the act in a way that reduces its value, potentially turning a supposed Pareto improvement into a loss, or at best, a wash.

  ---

  ### II. The Defender's Reply

  A defender of moral trade (perhaps Ord himself, or a proponent of moral uncertainty frameworks like MacAskill) has several lines of response. The goal is to show that motive-sensitivity does not fatally undermine the trade, but merely complicates the calculation.

  **1. Distinguishing Rightness from Moral Worth**
  The most common reply distinguishes between the **deontic status** of an act (permissible/obligatory) and its **aretaic status** (praiseworthy/virtuous).
  *   *Argument:* Even for Kantians, an act done in conformity with duty is *right*, even if it lacks moral worth. If Agent A believes eating meat is wrong, a world where A does not eat meat (even for trade reasons) is objectively better than a world where A eats meat. The loss of "moral worth" is a secondary cost.
  *   *Strength:* This works if the primary goal is minimizing wrongs. If the Kantian cares more about the *non-violation of the Categorical Imperative* than the *purity of their will*, trade works.
  *   *Weakness:* Strict Kantians might argue that a will determined by bargaining is not merely less praiseworthy, but is failing to respect humanity as an end in itself (treating one's own moral agency as a means to a bargain).

  **2. The "Overdetermination" or "Dual Motive" Strategy**
  This is the strongest psychological defense. It argues that motives are not singular.
  *   *Argument:* Entering a trade does not require the trade to be the *sole* motive. Agent A can say: "I am already 60% convinced vegetarianism is required. This trade provides the remaining 40% motivational push." Or, "I agree to this trade, but I will cultivate the proper moral attitude toward the act independently."
  *   *Mechanism:* The trade functions as a **commitment device** or a **focal point** for coordination, not necessarily the exclusive *reason for action*. If Agent A can internally maintain the conviction that "eating meat is wrong" while externally leveraging the trade to ensure Agent B's compliance, the act can be done *from duty* even if it was *occasioned* by trade.
  *   *Strength:* Preserves the moral worth of the act.
  *   *Weakness:* Requires significant psychological compartmentalization. If the explicit quid-pro-quo structure crowds out the moral motive (the "overjustification effect"), the defense fails.

  **3. The "Second-Best" under Moral Uncertainty**
  This reply leverages the context of moral uncertainty.
  *   *Argument:* We are not comparing "Trade World" to "Ideal Moral World." We are comparing "Trade World" to "Status Quo." Even if motive-sensitive theories assign less value to traded acts than to virtuous acts, they likely assign *more* value to traded acts than to unmitigated violations.
  *   *Calculation:* If a Kantian assigns value 10 to acting from duty, 5 to acting in conformity via trade, and 0 to violating duty, trade still yields a net gain (+5). The Pareto improvement holds, provided the loss of moral worth doesn't drop the value below the status quo.
  *   *Strength:* Pragmatically robust. It concedes the theoretical point but denies the practical conclusion.
  *   *Weakness:* It admits that moral trade is not theory-neutral. It works only if the "conformity value" is high enough.

  **4. Reinterpreting the "Party" to the Trade**
  *   *Argument:* Moral trade is often proposed for agents who are *uncertain* about which theory is true, not just agents who hold different theories. If I have 50% credence in Consequentialism and 50% in Kantianism, I might value the *outcome* of the trade enough (on my consequentialist credence) to outweigh the *motive loss* (on my Kantian credence).
  *   *Strength:* Aligns with Ord's broader project on moral uncertainty.
  *   *Weakness:* The prompt specifies *inter-personal* disagreement ("two people who disagree"). If Agent B is a pure Consequentialist and Agent A is a pure Kantian, Agent A cannot offload the motive cost onto a credence weight.

  ---

  ### III. Considered Verdict

  Does the objection succeed? **Yes, but with limits.**

  The objection successfully demonstrates that Moral Trade is not a **normatively neutral technology**. It cannot claim to deliver Pareto improvements "by each partner's own lights" *universally*. It implicitly privileges moral theories that separate the evaluation of acts from the evaluation of agents (consequentialism, moderate deontology) over theories that bind them tightly (strict Kantianism, virtue ethics).

  **1. The Scope Limitation**
  The objection succeeds in showing that moral trade breaks down for **strict agent-relative deontologists**. If my duty is "Do not kill," and I view trading that duty as a violation of the duty itself (treating the constraint as fungible), no trade is possible. The framework presupposes that moral requirements have a "price" or at least a "trade-off value," which is precisely what strict deontology denies. Therefore, the claim that moral trade is a general solution for moral disagreement is false; it is a solution for disagreement among *compatible* moral frameworks (e.g., different consequentialist views, or consequentialists and moderate deontologists).

  **2. The Success of the "Dual Motive" Defense**
  However, the objection does not destroy the framework entirely. The "Dual Motive" defense is philosophically viable. Agents can view the trade as a **political or social mechanism** to secure compliance, while maintaining a private **moral stance**.
  *   *Example:* Two nations sign a nuclear disarmament treaty. One does it for security (trade), the other for peace (conviction). The pacifist still values the disarmament.
  *   *Application:* In the reading group case, the Kantian can value the *state of affairs* (no factory farming) even if they regret the *motive* of the partner. If the Kantian's theory values the **patient's welfare** (the animal) alongside the **agent's will**, the trade still yields a net positive. Most plausible motive-sensitive theories are not *purely* motive-sensitive; they acknowledge that suffering is bad regardless of the agent's intent.

  **3. Final Assessment**
  The objection reveals that Ord's proposal relies on a **consequentialist meta-ethic regarding the trade itself**. It treats moral value as a resource that can be aggregated and exchanged.
  *   **Verdict:** The objection succeeds in refuting the **universality** of moral trade. It cannot guarantee a Pareto improvement for *all* normative theories, specifically those where the *source* of the action is constitutive of its value.
  *   **Qualification:** However, it does not refute the **utility** of moral trade for a wide range of plausible views. Most agents, even virtue ethicists or deontologists, care *to some degree* about outcomes. Unless a theory is radically agent-centered (where *only* my own virtue matters and the state of the world is irrelevant), there is usually room for trade.

  **Recommendation for the Reading Group:**
  You should concede the point: Moral Trade is not theory-neutral. It works best when parties agree that **outcomes matter**, even if they disagree on **which outcomes matter most**. When one party believes that **motives matter more than outcomes**, the logic of trade collapses. The framework should be presented not as a universal solution to moral disagreement, but as a tool for **coordination among outcome-sensitive agents**. This refinement saves the proposal from the charge of meta-ethical naivety while preserving its practical utility for the majority of effective altruist and policy-oriented contexts where it is most often applied.
