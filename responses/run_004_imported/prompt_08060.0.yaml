      *   **The Weighing Scale:** We weigh the evidence *for* the miracle (testimony) against the evidence *for* the law of nature (uniform experience).
      *   **The Maxim:** "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish."
      *   **Role of Testimony:** Hume treats testimony as reliable *because* of our past experience of human veracity. He assumes witnesses are generally honest or detectable when lying. He considers motives (prestige, zeal) but assumes a human agent behind the claim.

