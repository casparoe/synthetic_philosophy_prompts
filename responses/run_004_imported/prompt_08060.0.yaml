      *   *Point 2: The Nature of Testimony.* Hume relies on the reliability of human witnesses. AI isn't a witness; it's a simulation. Hume's safeguards (checking for zeal, number of witnesses, education) don't apply to an algorithm. This suggests his framework needs to treat digital media not as *testimony* but as *physical evidence* that is now highly mutable.
