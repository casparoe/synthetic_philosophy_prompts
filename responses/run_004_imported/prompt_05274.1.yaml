          2.  Knowledge requires safety/margin for error (if you know $C$, $C$ must hold in nearby cases where you form the belief the same way).
          3.  Sorites series: $C_0$ (clearly $C$) to $C_n$ (clearly not $C$), with adjacent steps indiscriminable.
          4.  Induction: If you know $C$ at $i$, $C$ holds at $i+1$ (due to margin for error).
          5.  Contradiction: $C$ holds at $n$ (where it doesn't).
          6.  Conclusion: No non-trivial condition is luminous.
      *   **Blake's Counter (Phenomenal Resistance):**
