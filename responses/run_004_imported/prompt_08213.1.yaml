      *   *Key Phrase:* "Historical Entitlement Theory."
      *   *Key Point:* Nozick is not saying "what is, is right." He is saying "what came from just steps is right."
      *   *Refining the "Why people argue" section:* Make sure to mention Rawls, as he is the main interlocutor. Mention that most people don't accept Nozick's premises (self-ownership, absolute property rights).

  7.  **Self-Correction/Check during drafting:**
      *   *Did I emphasize enough that Nozick isn't defending the current US economy?* Yes, need to make sure the user understands Nozick would likely view current wealth as tainted by state intervention and historical theft.
      *   *Is the distinction between Patterned and Historical clear?* Yes, D1/D2 explanation helps.
      *   *Did I answer the "why argue" part?* Yes, by listing alternative theories and practical objections.

  8.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "process" and "outcome" is sharp. (This aligns with the thought process in step 5).

