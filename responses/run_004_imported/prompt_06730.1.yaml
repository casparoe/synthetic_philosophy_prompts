answer: |-
  The kitchen clock ticked. It was a cheap plastic thing, the second hand jerking forward with a sound like a dry twig snapping. 11:43 PM.

  On the table between Elias and Sarah lay the site map for the new county infrastructure project. It was a glossy printout, smelling faintly of toner, weighted down at the corners by a salt shaker and a stack of unopened mail. A red circle marked the proposed location for the relay tower. It sat directly on top of the property line for the Henderson place.

  Elias rubbed his eyes. He had a spreadsheet open on his laptop, the blue light washing out his face. "It's not just signal, Sarah. It's latency. Fifty-three thousand subscribers in this grid. If we approve the high-gain tower, we reduce average packet loss by four percent."

  Sarah traced the red circle with her fingernail. "The Hendersons."

  "The data says—"

  "The Hendersons have a baby," she said. Her voice wasn't angry. It was tired, the kind of tired that settles in the marrow. "And the variance report on page four says the low-frequency hum at ground zero is measurable at forty-five decibels. Inside the house. Constant."

  Elias sighed, leaning back. The chair creaked. "Forty-five is a dishwasher. It's a refrigerator."

  "It's not a dishwasher that never turns off, Elias. It's in the walls. It's in the teeth. Mrs. Henderson called me crying last week. She said it feels like pressure. Like being underwater." She looked up at him. "For one house. In exchange for... what? Faster loading screens for the rest of the county?"

  "Aggregate utility," Elias said. He tapped the laptop trackpad, bringing up a graph. It was a smooth, green curve rising toward the right. "Fifty-three thousand people. Let's say each person checks their phone twenty times a day. A four percent improvement in connection stability saves maybe... ten seconds of frustration per day. Waiting for a page to load. Re-sending a text."

  He started typing, muttering numbers. "Ten seconds, times fifty-three thousand, times three hundred and sixty-five days. That's roughly nineteen million minutes a year. Three hundred and sixteen thousand hours. That's... thirty-six years of human life, Sarah. Every year. We give the county back thirty-six years of time."

  Sarah didn't look at the screen. She looked at the red circle. "Thirty-six years of what? Scrolling through Instagram? Waiting for an email?"

  "Time is time," Elias said, a edge of frustration creeping in. "It's math. If you have a choice between a mild annoyance for a number of people so large you can't name them, or a severe, life-altering burden for one specific family, the math dictates you choose the annoyance. The sum of the specks outweighs the stone."

  "That's where you lose me," Sarah said. She reached for her wine glass, but it was empty. She pushed it away. "Your math works on paper. It doesn't work in a head. My brain literally cannot hold fifty-three thousand people. I can hold the Hendersons. I can hold the baby. I can't hold the 'county'."

  "That's a cognitive bias," Elias said. "Just because you can't visualize the number doesn't mean it's not real. If you had a room with fifty-three thousand people in it, and they all shouted at once, it would be a roar. You're ignoring the roar because you're looking at the one person covering their ears."

  "Is it a roar?" Sarah challenged. "Or is it fifty-three thousand people blinking? A dust speck in the eye, Elias. You're talking about a dust speck. Ten seconds of mild irritation. But for the Hendersons, it's migraines. It's the baby not sleeping. It's property value tanking because everyone knows there's a hum. It's a slow erosion of their sanity."

  She stood up and walked to the window. Outside, the street was dark. A single porch light flickered on down the block.

  "If you say yes," she said to the glass, "you are sacrificing them. Actively. You are signing a paper that says 'their suffering is acceptable for our convenience.' If you say no, you are saying 'my convenience is not worth their pain.'"

  "I'm saying the *collective* convenience is worth it," Elias corrected. He stood too, coming up behind her. He didn't touch her. "If you apply your rule universally, you paralyze everything. No power lines. No highways. No airports. Because someone, somewhere, will have to live near the noise. You're privileging the visible victim over the invisible majority."

  "The invisible majority isn't suffering," Sarah said. "They're just... not getting a tiny benefit. There's a difference between inflicting pain and withholding a gain. Your spreadsheet treats them as the same variable."

  Elias went back to the table. He picked up a notepad. He needed to make her see the scale. He started drawing dots. Just small pencil marks. *Tick. Tick. Tick.*

  "I'm going to fill this page," he said. "And I won't even make a dent in the number we're talking about. That's the problem. Our brains evolved to deal with tribes. A hundred and fifty people. If one person is hurt, we feel it. If one person is hurt in a tribe of a hundred, that's one percent. But in a network of millions? One person is a rounding error."

  "So we become monsters?" Sarah turned around. "Because we can't feel the rounding error?"

  "We become responsible," Elias said. He stopped drawing. His hand was cramping. He looked at the page. It was covered in maybe two hundred dots. It looked like static. It looked like nothing. "If I reject this tower, I am choosing to harm fifty-three thousand people slightly to save one family from harm. I am the one making the choice. I can't hide behind 'nature.' The signal won't improve on its own. I have to choose who gets hurt."

  "But the *kind* of hurt matters," Sarah said. She walked back to the table and looked at the page of dots. "You think because there are more dots, they weigh more. But a dot isn't a person. A dot doesn't cry. A dot doesn't have a baby that wakes up screaming because the walls are vibrating."

  She put her hand over the dots. "I can cover all of these 'saved minutes' with my palm. And underneath my hand, the Hendersons are still there."

  Elias looked at her hand. Small, pale, covering the graphite static. He knew the numbers were right. He knew that if this were a triage situation—if it were lives instead of latency—utilitarianism was the only moral framework that didn't collapse into sentimentality. But this wasn't lives. It was comfort. It was the friction of modern life.

  And yet.

  He thought about the Henderson's baby. He thought about the sound of a refrigerator hum, amplified, inside the skull. He tried to multiply that feeling by fifty-three thousand. He tried to imagine fifty-three thousand people feeling a ten-second frustration. He closed his eyes and reached for the sensation.

  He got nothing.

  He could feel the Hendersons. He could feel the tightness in his own chest when he thought of signing the form. He could not feel the fifty-three thousand. They were a concept. A green line on a graph. The Hendersons were flesh.

  "It's not about feeling it," Elias said quietly. "It's about knowing it."

  "Knowing isn't enough," Sarah said. "We aren't computers. We don't get to just 'know' the weight. We have to carry it. And I can't carry the weight of the Hendersons on a scale balanced by dust."

  She pulled her hand away. The dots remained.

  The clock ticked. 11:52 PM.

  Elias sat back down. The cursor blinked on the screen. *Approve / Deny / Request Review.*

  "If we request a review," Elias said, "it delays the project six months. The signal stays bad for everyone. The Hendersons get six months of peace, maybe, before the next proposal."

  "Then we deny," Sarah said.

  "Then we deny," Elias repeated. He didn't move his hand to the mouse.

  He looked at the spreadsheet. The cells were neat, orderly. The sum at the bottom was bolded. **36.4 Years.** It was a significant amount of life. It was real. He knew it was real. But in the silence of the kitchen, with the hum of the refrigerator actually running—a normal, cyclical hum—it felt like a lie.

  He knew that tomorrow, or the next day, the county would find another vendor. Or another location. Or they would overrule the board. The tower would go up. The math would win because the math was scalable and the Hendersons were not.

  But for tonight, the cursor blinked.

  Sarah poured the last of the wine into her glass. She didn't offer him any. She just stood there, watching him watch the screen.

  "Do you feel it?" she asked. "The difference?"

  Elias looked at the page of dots. He looked at the red circle. He tried to add them up again, in his head. He tried to make the dust specks heavy enough to crush a stone.

  "I feel the math," he said.

  "And?"

  "And I feel like I'm going to be sick."

  Sarah nodded. She turned off the kitchen light. The room went dark, save for the glow of the laptop. The green curve illuminated Elias's face, making him look ghostly, skeletal.

  "Leave it," she said from the doorway. "We'll vote in the morning."

  She walked away. Her footsteps were quiet on the hardwood.

  Elias sat in the blue light. The refrigerator kicked off with a shudder. The house settled. Somewhere, miles away, a phone searched for a signal and timed out. Somewhere, closer, a baby slept in a room that was quiet.

  He put his hand on the mouse. He didn't click. He just watched the cursor breathe, in and out, waiting for a command that would make sense of numbers that refused to become people.
