answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of standing up here today.

  Priya asked me to give this toast a few weeks ago, but she attached a very specific addendum to the invitation. She said, "I want you to speak, but if you say 'today we become one,' or 'more than the sum of our parts,' or imply that a new metaphysical entity called 'The Marriage' has come into existence, I will disown you before the cake is cut."

  For the half of the room currently checking their watches: Priya is a philosopher. Specifically, she follows the work of Peter van Inwagen. For the other half of the room currently nodding vigorously: hello, I see you.

  For the relatives: What this means, in plain English, is that Priya believes the only time a bunch of particles actually stick together to form a real, single *thing* is when they are alive. Like a human being. A chair isn't really one object, it's just wood particles arranged chair-wise. And crucially, a "couple" isn't one object. It's just two distinct, fully-realized human beings choosing to stand very close to each other and coordinate their schedules for the rest of their lives.

  So, I cannot toast to your "union," because that implies you are merging into a single substance. And I cannot toast to the "bond" that ties you, as if love is a kind of metaphysical glue.

  But here is the beautiful thing about van Inwagen's view: It makes what you are doing *more* impressive, not less.

  You are not losing yourselves in each other. You are not dissolving into a vague "we." You remain two distinct, complex, living organisms. Two separate centers of consciousness. And yet, despite remaining ontologically distinct, you have chosen to align your trajectories.

  Priya, you exist. [Fiancé's Name], you exist. And the way you exist *near* each other makes the world better.

  When I look at the two of you, I don't see a fusion. I see a miraculous coordination. I see two independent lives that have decided to synchronize their biological and emotional rhythms. I see shared meals, which are just coordinated intake of nutrients for pleasure. I see shared laughter, which is coordinated respiratory exertion. I see a commitment to ensure that the other organism flourishes.

  To the family here: You don't need to know mereology to know that Priya and [Fiancé's Name] are better when they are in the same room. They make each other sharper, kinder, and happier. They are engaging in a lifelong project of mutual support.

  So, I am not going to wish you a "happy marriage," because that sounds like I'm wishing happiness upon an abstract concept.

  Instead, I am going to wish *you*, Priya, and *you*, [Fiancé's Name], the very best.

  May your individual lives continue to be rich and vibrant. May your spatiotemporal proximity remain constant. May your causal interactions be filled with kindness, patience, and excellent wine. And may you never stop choosing, every single day, to arrange yourselves side-by-side against the entropy of the universe.

  Please raise your glasses.

  To Priya and [Fiancé's Name]. Two distinct beings, one shared future.

  Cheers.
