answer: |-
  Your friend is absolutely right, and your intuition is also right. This is one of the most famous "own goals" in the history of philosophy of science.

  Karl Popper wanted to save science from skepticism. He admitted that we can never prove a theory is 100% True (because of the problem of induction), but he wanted to say that science still *progresses*. He wanted to say that even if Newtonian Mechanics is technically false (because of Relativity), it is **closer to the truth** than the Four-Elements theory. He called this **verisimilitude** (truth-likeness).

  He tried to define this using logic, and in 1974, two philosophers (Pavel Tichý and David Miller) independently proved that Popper's definition mathematically collapses. It doesn't just have a bug; the engine falls out of the car.

  Here is the intuitive explanation of why it breaks, and why it's so hard to fix.

  ### 1. Popper's Idea: The Balance Sheet
  Popper treated a theory like a net that catches statements.
  *   **Truth Content:** The number of true statements the theory implies.
  *   **Falsity Content:** The number of false statements the theory implies.

  His rule for "Theory A is closer to truth than Theory B" was essentially:
  > Theory A wins if it catches **more** true statements and **no more** false statements than Theory B.

  This sounds reasonable. If I say "It is raining" (True) and you say "It is raining and pigs fly" (True + False), I am closer to the truth.

  ### 2. The Collapse: The "Contagion" of Falsehood
  The problem arises when **both** theories are false. This is where the Tichý-Miller proof hits.

  To understand why it breaks, you have to understand how logical strength works. In logic, to say *more* about the world (to increase your Truth Content), you have to make your theory **stronger** (more specific).
  *   *Weak theory:* "It will rain sometime." (Hard to falsify, low truth content).
  *   *Strong theory:* "It will rain 5mm at 2:00 PM." (Easy to falsify, high truth content).

  **Here is the trap:**
  If a theory is **false**, its falsehood is like a virus in the code. If you try to make the theory "stronger" to capture more Truth (by adding more details), you inevitably drag the Falsehood along with it.

  Imagine the Truth is a specific target.
  *   **Theory A** shoots an arrow that lands 1 meter to the left.
  *   **Theory B** shoots an arrow that lands 10 meters to the left.

  Intuitively, A is closer. But Popper's definition doesn't look at where the arrow landed; it looks at the *consequences* of the shot.
  Because Theory A is false, it entails the statement: *"The arrow did not hit the bullseye."*
  Because Theory B is false, it *also* entails: *"The arrow did not hit the bullseye."*

  Tichý and Miller showed that if you try to construct a false Theory A that has **more** true consequences than a false Theory B, the logic forces Theory A to also have **more** false consequences.

  **Why?**
  Because logical consequences come in bundles. If Theory A is false, it makes at least one fundamental mistake. If you try to expand Theory A to include more truths (making it more informative), you are logically committed to that fundamental mistake *plus* whatever new mistakes come with the new details.

  You cannot mathematically separate the "Truth Growth" from the "Falsehood Growth" in a false theory. They are locked together. Therefore, you can never satisfy Popper's condition of "More Truth, Same-or-Less Falsehood."

  **The Result:** According to Popper's strict math, you cannot say Newtonian Mechanics is closer to the truth than the Four-Elements theory. They are logically incomparable.

  ### 3. Why hasn't anyone fixed it?
  It has been 50 years, and philosophers still argue about this. There isn't a "clean fix" for three main reasons:

  **A. The "Map" Problem (Access)**
  To measure distance to the truth, you need to know where the Truth is. But if we knew exactly where the Truth was, we wouldn't need science. Any definition of verisimilitude requires us to measure distance to a target we can't see. We have to rely on assumptions about what the world *might* be like, which introduces bias.

  **B. The "Ruler" Problem (Weighting)**
  To say one theory is "closer," you need a way to weigh errors.
  *   Is getting the *color* of an electron wrong equal to getting the *mass* wrong?
  *   Is one huge error worse than ten tiny errors?
  Popper wanted a logical definition that didn't require arbitrary weighting. But almost all modern fixes require you to assign "weights" to different facts. That makes verisimilitude subjective. It becomes "closer to the truth *according to these values*," not "closer to the truth *in reality*."

  **C. The "Language" Problem (Grue/Bleen)**
  This is the sneakiest issue. "Closeness" depends on how you describe the world.
  Imagine the weather is actually **Hot and Rainy**.
  *   Theory 1 says: **Cold and Rainy**. (1 error: Temperature)
  *   Theory 2 says: **Hot and Dry**. (1 error: Precipitation)

  Which is closer? It seems like a tie. But now, let's invent a new word: **"Shmainy."**
  *   "Shmainy" means "Rainy if Hot, Dry if Cold."
  *   In this new language, the Truth is **Hot and Shmainy**.
  *   Theory 1 becomes: **Cold and Shmainy**. (Still 1 error).
  *   Theory 2 becomes: **Hot and Not-Shmainy**. (Still 1 error).

  It turns out that by changing the vocabulary (the "conceptual space"), you can make Theory 1 look closer or Theory 2 look closer without changing the facts. This suggests "truthlikeness" might not be an objective feature of the theory, but a feature of the language we use to describe it.

  ### Summary
  Your friend is right: Popper's specific mathematical definition is dead. It structurally cannot compare two false theories because increasing the information in a false theory inevitably increases its falsehood content at the same time.

  However, **your intuition is also right.** Newtonian Mechanics *is* more useful, more predictive, and structurally more similar to Relativity than the Four-Elements theory is.

  Most philosophers today accept that we can't have Popper's "pure logical" definition. Instead, we use **model-based** approaches. We admit that "closeness to truth" isn't a logical property like "validity," but a pragmatic one. We say Newton is closer not because of a logical proof, but because his equations *map* onto reality with less distortion than the Four-Elements theory, even if both maps are technically wrong.

  Popper wanted a guarantee from Logic that science progresses. Logic wouldn't give it to him. We have to settle for the empirical observation that it seems to be working.
