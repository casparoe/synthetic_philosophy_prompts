      *   *The Contract:* You made a deal with Past-Self because Past-Self knew Present-Self's weaknesses. Breaking it undermines your own discipline.
      *   *Recommendation:* Stick to the deal *unless* the editor's objection is about logistics, not principle. But since it's principle, honor the pact. Find a workaround.

