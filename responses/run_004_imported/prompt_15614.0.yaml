answer: |-
  Good evening. For those who don't know me, I'm a friend of the bride and groom, and a storyteller by trade. Usually, I make things up. Tonight, I have the privilege of telling the truth.

  And the truth is, [Partner A] and [Partner B] met the way two tectonic plates meet: with a slow, grinding argument. Specifically, an argument over Bertrand Russell's *Marriage and Morals*.

  For the half of the room currently checking their programs for a bibliography: yes, we know. Their courtship began in a debate about whether jealousy is a law of nature or a habit to be unlearned. They found each other in the margins of that text, and they built a life on its least fashionable claim: that love is not ownership, and that fidelity is measured in honesty, not exclusivity.

  Now, as a novelist, I'm trained to look at the third act. And in the history of early twentieth-century philosophy, the third act of Russell's own marriage to Dora Black is… complicated.

  We know that Bertie and Dora tried to live this exact ideal. They drafted their own terms. **They signed a formal agreement stating that neither would hold the other to strict sexual fidelity, provided there was total transparency.** To the aunts and uncles, that sounds like a very thorough prenup. To the historians here, it is the specific clause that defined their experiment.

  We also know how that story ended. It didn't end in a quiet sunset. It ended in the very human storm they hoped to outrun. Dora had a child with another man; Bertie found he could not unlearn his jealousy as easily as he could unlearn a logical fallacy. There was grief. There was a bitter separation. The experiment, by the standard metrics of happiness, failed.

  It would be easy to stop there. To say, "The data is inconclusive," and move on to the cake. But [Partner A] and [Partner B] are historians. They know the data better than anyone. They know that Russell's heart was not as disciplined as his mind. They know that ideals often break against the rocks of human emotion.

  And they are choosing this anyway.

  That is what I want to toast. Not the ideal itself, but the courage it takes to hold an ideal *after* you have read the footnotes. Most people enter marriage believing their love is unique enough to defy history. [Partner A] and [Partner B] enter it knowing history intimately, knowing exactly where the traps are laid, and saying, "We will walk this path with our eyes open."

  They are not betting that they will never feel jealousy. They are betting that they can tell the truth when they do. They are not betting that they are immune to the failures of the past. They are betting on their friendship to survive the weather.

  Russell wrote that "the good life is one inspired by love and guided by knowledge." Tonight, we celebrate a couple who have the knowledge, and have spent years proving they have the love.

  So, please raise your glasses. To [Partner A] and [Partner B]. May your honesty be sharp, may your habits be malleable, and may your story be the one that rewrites the ending.

  To the bride and groom.
