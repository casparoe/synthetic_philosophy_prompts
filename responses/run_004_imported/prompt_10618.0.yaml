      *   *The Core Argument:* Distinguish between *reliability* (consistency) and *validity* (accuracy). The vendor offers reliability; we need validity.
      *   *The "Trust" Objection:* This is the philosophical meat. I need to explain why this isn't a "given" or "axiom." It's an empirical claim requiring empirical support. Analogy: A scale that consistently reads 5lbs for everything is reliable but useless.
      *   *Conditions:* We need a validation study. Ground truth essays (known human vs. known AI). Error rates (false positives/negatives). Timeline: Before next semester? Before any hearing?
