  *Wait, stronger stance:* As an epistemologist, allowing unvalidated tools as *evidence* is dangerous. I should recommend **Reject** the proposal to use them as evidence *until* validation is provided. But the prompt asks to choose one. "Adopt-with-Conditions" is the most constructive "No." I will write it as "Adopt-with-Conditions" where the condition is *prior validation*.

