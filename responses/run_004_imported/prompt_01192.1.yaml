prompt: |-
  I spent 35 years as an experimental physicist leaning on Bayesian stats without ever askign why credences have to obey the probability axioms in the first place. Turns out there's more than one argument for that. The classic one is the Dutch book argument - if your credences don't fit the probability calculus, a bookie can hand you a set of bets that guarantee you loose money no matter what happens. But I recently ran into Jim Joyce's "accuracy-dominance" argument from the 90s, which claims to reach the very same conclusion without any betting or money at all, just accuracy as a purely epistemic good. Could you compare the two for me - how different are they really underneath, does the accuracy argument actually escape the pragmatic baggage of the Dutch book one like Joyce says it does, and is one more convincing to you than the other?
reasoning: |-
  Here's a thinking process that leads to the comparison between the Dutch Book argument and Joyce's Accuracy-Dominance argument:

  1.  **Deconstruct the User's Request:**
      *   **User Background:** 35 years as an experimental physicist, familiar with Bayesian stats, but now questioning the foundational justification for probability axioms.
      *   **Core Topic:** Justifications for why credences (degrees of belief) must obey probability axioms (Probabilism).
      *   **Specific Arguments to Compare:**
          1.  Dutch Book Argument (DBA) - Classic, pragmatic (betting/money).
          2.  Joyce's Accuracy-Dominance Argument (ADA) - Epistemic, non-pragmatic (truth/accuracy).
      *   **Key Questions:**
          1.  How different are they really underneath?
          2.  Does ADA actually escape the pragmatic baggage of DBA (as Joyce claims)?
          3.  Which one is more convincing (to me, the AI, but framed objectively)?

  2.  **Analyze the Dutch Book Argument (DBA):**
      *   *Premise:* Credences are identified with betting dispositions (or imply them).
      *   *Mechanism:* If credences violate axioms (e.g., $P(A) + P(\neg A) \neq 1$), a bookie can construct a set of bets where the agent loses money in every possible world.
      *   *Normative Force:* It's irrational to accept a guaranteed loss.
      *   *Critique:* It's pragmatic/prudential, not purely epistemic. It links belief to action/money. What if I don't bet? Is my belief still irrational? It assumes a link between belief and betting odds (operationalism).

  3.  **Analyze Joyce's Accuracy-Dominance Argument (ADA):**
      *   *Premise:* The primary epistemic goal of belief is accuracy (representing the world correctly).
      *   *Mechanism:* Define a "scoring rule" (like Brier score) to measure distance between credence and truth (1 for true, 0 for false).
      *   *Theorem:* If your credences violate probability axioms, there *always* exists an alternative set of credences (that obeys axioms) that is more accurate in *every* possible world. (Accuracy Dominance).
      *   *Normative Force:* It's irrational to hold beliefs that are guaranteed to be less accurate than available alternatives.
      *   *Claim:* Purely epistemic, no money/betting involved.

  4.  **Compare the Two (Under the Hood):**
      *   *Mathematical Structure:* Both rely on convexity.
          *   DBA: The set of coherent probabilities is a convex set. Incoherent points lie outside. A hyperplane (betting portfolio) separates the incoherent point from the convex set, guaranteeing loss.
          *   ADA: The set of coherent probabilities is a convex set. Incoherent points lie outside. Using a strictly proper scoring rule (like Brier), the incoherent point is geometrically "further" from the truth vertices than some coherent point in all worlds.
      *   *Similarity:* Both are "dominance" arguments. DBA = Pragmatic Dominance (money loss). ADA = Epistemic Dominance (accuracy loss).
      *   *Difference:* The metric of badness. Money vs. Distance from Truth.

  5.  **Address the "Pragmatic Baggage" Claim:**
      *   Joyce claims ADA escapes pragmatism.
      *   *Counter-argument (Hájek, others):* Does "accuracy" presuppose a utility function? Is avoiding inaccuracy just another form of maximizing utility?
      *   *The Link:* To get the theorem, you need a specific scoring rule (strictly proper). Why choose Brier score over others? Justifying the scoring rule often sneaks in pragmatic considerations or specific assumptions about the "value" of truth.
      *   *Belief-Action Link:* DBA assumes beliefs *guide* bets. ADA assumes beliefs *aim* at truth. Both assume a functional role for belief.
      *   *Verdict:* It's *less* pragmatic, but not entirely free of normative assumptions that look utility-like. It shifts from "don't lose money" to "don't be unnecessarily inaccurate."

  6.  **Evaluate Convincingness:**
      *   *DBA Strengths:* Intuitive, concrete.
      *   *DBA Weaknesses:* Irrelevant if you don't bet. Conflates belief with betting behavior.
      *   *ADA Strengths:* Focuses on the epistemic nature of belief. Applies even to "armchair" beliefs.
      *   *ADA Weaknesses:* Relies on the specific choice of accuracy measure (Brier score etc.). Why is accuracy the *only* epistemic good?
      *   *Physicist Perspective:* As a physicist, the user might appreciate the geometric proof (convexity) common to both. They might prefer ADA because it treats belief as a state of the world rather than a disposition to act, fitting a "realist" view of scientific inference. However, they might also be skeptical of "accuracy" without an operational definition.

  7.  **Drafting the Response:**
