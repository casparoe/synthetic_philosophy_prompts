answer: |-
  This is a classic communication dilemma, and it is incredibly frustrating because it sits right on the border of semantics and ethics. You are not crazy for feeling misled. In fact, what your roommate did has a name in psychology and ethics: **paltering**.

  Paltering is the act of using truthful statements to create a false impression. It is distinct from lying (stating falsehoods) and distinct from omission (hiding information), but functionally, it achieves the same result as both: deception.

  Here is a breakdown of the principled differences, the ethics involved, and where the responsibility actually lies.

  ### 1. Is there a principled difference between this and lying?

  **Semantically: Yes. Ethically: No.**

  Your first friend is arguing from a **semantic** standpoint. In a strict, dictionary definition, a lie requires the statement to be factually false. Since she *did* pay $9, the statement "I've paid for some of the groceries" is factually accurate. In a court of law or a logic puzzle, your friend is right.

  However, your second friend is arguing from an **ethical and pragmatic** standpoint. Human communication is not code; it is a cooperative social activity. When we speak, we aren't just exchanging data; we are exchanging *intent*.

  If the goal of communication is to convey reality to another person, and you intentionally choose words that you know will convey a false reality, you have violated the ethical contract of communication. The *outcome* for you was identical to if she had lied: you believed she had contributed more than she had.

  **The "Spirit vs. Letter" Argument:**
  Think of it like a "No Parking" sign. If someone parks in a driveway right next to the sign and says, "I'm not on the street, so I didn't break the rule," they are technically correct but clearly violating the rule's intent. Your roommate did the verbal equivalent of parking in the driveway.

  ### 2. The Linguistics of Why This Feels Wrong

  There is a framework in linguistics called **Grice's Maxims**. These are unwritten rules that make conversation possible. Two of them are relevant here:

  *   **The Maxim of Quantity:** Make your contribution as informative as is required. (Don't give too little information).
  *   **The Maxim of Relation:** Be relevant.

  In a 50/50 roommate agreement, the relevant information regarding finances is "Have you paid your share?" By volunteering "I've paid some," she provided information that was *literally* true but *pragmatically* insufficient. She relied on you to fill in the gap with the assumption that "some" meant "an amount consistent with our agreement."

  When she exploited that assumption knowing it was false, she violated the cooperative principle of conversation.

  ### 3. Who is responsible for the gap?

  You asked: *Is the responsibility for that gap more on her, for picking her words that carefully, or on me, for assuming more than she actually said?*

  **The responsibility lies primarily with her.**

  Here is why: **Power Dynamics in Information.**
  She knows exactly how much she paid. You do not (until you check). She holds the data. When someone holds the data and offers a vague summary ("I paid some"), the listener is forced to rely on context clues to interpret the data.

  In the context of a 50/50 split, the "reasonable person standard" dictates that "paid" implies "paid what is owed." If I ask an employee, "Did you finish the report?" and they say, "I worked on the report," they are implying completion. If they only wrote the header, they are being deceptive, even if they technically "worked on it."

  **The "Reasonable Assumption" Defense:**
  Her defense ("it's on you for reading into it") is a form of gaslighting. It shifts the blame for her deception onto your trust.
  *   **Was your assumption reasonable?** Yes. In a shared expense scenario, the default expectation is equal contribution.
  *   **Was her phrasing ambiguous?** Yes, deliberately so.
  *   **Did she clarify?** No. She waited until you did the math.

  If you assume someone is acting in good faith in a partnership, and they exploit that assumption to hide their lack of contribution, the fault lies with the exploiter, not the truster. If we all had to treat every vague statement from our roommates as potentially deceptive, the relationship would be impossible to maintain.

  ### 4. Why this is actually worse than a lie

  Paradoxically, many people find paltering more damaging than a flat-out lie.
  *   **A lie** is a clear breach. If she said "I paid $80" and didn't, you catch her, she's busted.
  *   **Paltering** forces *you* to be the accuser. It makes you feel crazy for questioning her because she can hide behind the technical truth. It creates a dynamic where you feel petty for doing the math, and she gets to feel morally superior for "not lying."

  Her defensiveness confirms this. If it were an honest misunderstanding, she would have said, "Oh, I thought $9 counted, I'll Venmo you the rest." Instead, she dug in and blamed your interpretation. That indicates she knew exactly what impression she was creating.

  ### The Verdict

  Your second friend is right. Deliberately engineering a false impression is the functional equivalent of lying.

  **What to do:**
  1.  **Stop tracking via trust, start tracking via data.** Keep using Splitwise, but set a rule: "Expenses must be settled by the 1st of the month." Remove the need for vague verbal updates.
  2.  **Call out the behavior, not the math.** If this happens again, don't argue about the $9. Argue about the communication. "When you say you've paid, I understand that to mean your share. If you haven't paid your share, please tell me 'I haven't paid my share yet' rather than 'I've paid some.' It saves us this conflict."
  3.  **Evaluate the relationship.** This isn't just about money. This is about how she handles conflict and accountability. A roommate who blames you for their lack of clarity is a roommate who will do it again when the stakes are higher.

  You aren't being pedantic. You are recognizing that trust requires honesty of *intent*, not just honesty of *syntax*.
