      *   **User Background:** Retired chemist (40 years), now hobbyist philosopher. This means they value empirical evidence, probability, and logical rigor, but are also open to epistemological questions (what counts as knowledge?).
      *   **The Scenario:** A bridge club with an automatic dealing machine (ensures true random distribution).
      *   **The Phenomenon:** A player named Walt predicts "big hands" before the deal. He's been right "way more often than chance should allow" over ~15 sessions.
