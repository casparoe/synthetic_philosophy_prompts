          *   Translation: There is an $x$, $x$ is King of France, for all $y$ if $y$ is King of France then $y$ is $x$, and $x$ is bald.
          *   Truth Value: False (because the existence clause $\exists x Kx$ is false).
      *   **The Negation:** "The present King of France is not bald."
          *   *Crucial Point:* This sentence is ambiguous in natural language. Russell distinguishes between two scopes of negation.
          *   **Primary Occurrence (Wide Scope):** "It is not the case that there is a unique King of France who is bald."
              *   Logical Form: $\neg \exists x (Kx \land \forall y (Ky \rightarrow y=x) \land Bx)$
