prompt: |-
  I have served on my hospital's ethics consultation committee for two years, but until last week the role was mostly theoretical. A case has now arrived that I find genuinely difficult, and it has sent me back into decision theory in a way I never expected my job to require. Eighteen months ago, a patient with a long history of severe bipolar I disorder executed a psychiatric advance directive containing what her outpatient psychiatrist calls a "Ulysses clause": while euthymic, she specified that if she ever entered a manic episode meeting stated severity criteria (fewer than two hours of sleep for three consecutive nights, spending above a fixed dollar threshold, or sustained refusal of her mood stabilizer), she was to be hospitalized and medicated regardless of her objections at the time, and that the directive itself could be revoked only in writing while she was stable, with her psychiatrist's concurrence. She explained her reasoning in the document: two previous untreated episodes had already cost her a marriage and a job, she described her manic refusals as belonging to "a self I don't want making decisions for me," and she said she would rather be overridden every single time than lose what remained of her life a third time.

  She is now in exactly the episode the clause anticipated, and the case has turned out to be harder than any of us expected. She does not meet our jurisdiction's threshold for involuntary commitment on ordinary grounds, since she is neither violent nor suicidal, only severely impaired in judgment. More awkwardly, the attending's formal capacity assessment concluded that she meets the standard criteria for decisional capacity regarding this specific choice: she is coherent, oriented, and able to give a fluent argument for refusing treatment, saying the medication "takes away the only version of me that has ever gotten anything done" and that honoring the clause now would let "someone who doesn't have to live with today" decide for her. Her sister, who is named in the directive, wants it invoked immediately, citing the money already given away this week; the patient's court-appointed advocate counters that no document can validly pre-empt a contemporaneous, articulate refusal like this one without effectively cancelling her standing as a person for the duration of every future episode. I should mention, since it seems relevant, that this is not the first cycle: she signed a similar clause after an episode two years ago, and here we are again. That repetition is what sent me looking outside our usual clinical-ethics toolkit, where I kept running into money-pump arguments and the distinction between "sophisticated" and "resolute" choice in decision theory, both of which seem to bear directly on whether a person can rationally bind a later self at all -- though I don't know how to turn either into something a hospital committee can actually vote on.

  Could you draft the short opinion I would circulate before our meeting in two days? Everyone agrees we cannot simply wait the episode out; the committee needs to say something within 48 hours. I need the opinion to recommend one concrete course of action for this patient with that time frame attached, to state explicitly whether and how this case should shape a standing hospital policy on Ulysses clauses going forward, and to take the advocate's objection seriously on its own terms rather than quietly resolving it into an ordinary capacity determination.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics consultation committee (2 years experience, previously theoretical).
      *   **Task:** Draft a short opinion to circulate before the committee meeting (in 2 days).
      *   **Case:** A patient with Bipolar I executed a Psychiatric Advance Directive (PAD) with a "Ulysses clause" (binds future self during mania).
      *   **Current Situation:** Patient is manic (meets clause criteria: sleep, spending, refusal). She currently has *decisional capacity* by standard assessment (coherent, oriented, articulate refusal). She does *not* meet involuntary commitment (IVC) standards (not violent/suicidal).
      *   **Conflict:** Sister (proxy) wants clause invoked. Court-appointed advocate argues the clause invalidates personhood/autonomy during episodes. Patient argues the "past self" shouldn't rule the "current self."
      *   **Key Constraints:**
          *   Must recommend one concrete course of action within 48 hours.
          *   Must state explicitly how this shapes standing hospital policy on Ulysses clauses.
          *   Must take the advocate's objection seriously (not just dismiss it as a capacity issue).
          *   Tone: Professional, ethical, legally aware (but not legal advice), philosophically grounded (acknowledging the decision theory aspects mentioned by the user).

  2.  **Deconstruct the Ethical & Legal Tension:**
      *   **Autonomy (Precedent vs. Contemporaneous):** This is the core conflict. Precedent autonomy (the PAD) vs. Contemporaneous autonomy (current refusal). Usually, contemporaneous wins *if* capacity is intact. Here, capacity is technically intact by standard metrics, but the *nature* of the illness (mania) suggests the values driving the refusal are symptoms, not stable preferences.
      *   **Beneficence/Non-maleficence:** Treating prevents financial/relational ruin (as per past history). Not treating respects current wishes but risks the "third loss" the patient feared.
      *   **Legal/Policy Context:** Jurisdiction doesn't allow IVC on ordinary grounds. The PAD exists but its enforceability against a capacitated refusal is the gray area.
      *   **Decision Theory (User's specific interest):** The user mentioned "money-pump arguments" and "sophisticated vs. resolute choice."
          *   *Resolute Choice:* Sticking to a prior plan despite changing preferences (Ulysses binding himself to the mast).
          *   *Sophisticated Choice:* Anticipating future preference changes and planning around them.
          *   *Money Pump:* If preferences are intransitive or unstable over time, one can be exploited. Here, the cycle suggests instability.
          *   *Relevance:* The committee needs to decide if the "manic self" is a valid agent or a hijacked vessel. The advocate says valid agent. The PAD says hijacked vessel.

  3.  **Determine the Recommendation:**
      *   *Option A: Honor the PAD.* Pros: Respects long-term goals, prevents harm. Cons: Overrides current capacitated refusal (legal risk, ethical concern about personhood).
      *   *Option B: Honor Current Refusal.* Pros: Respects current autonomy/legal standard. Cons: Ignores the specific purpose of the PAD, likely leads to the ruin the patient predicted, undermines the utility of PADs for bipolar patients.
      *   *Option C: Hybrid/Compromise.* (e.g., Medicate but minimize restrictions).
      *   *Decision:* Given the specific details (patient explicitly anticipated this, defined criteria objectively, noted the "self I don't want," and the cycle of ruin), the ethical weight leans toward honoring the PAD *provided* there are safeguards. The standard capacity assessment might be missing the "appreciation" component regarding the *consequences* driven by mania. However, the prompt says the assessment concluded she *meets* criteria. I cannot simply contradict the clinical assessment without cause.
      *   *Pivot:* The ethical justification for overriding contemporaneous refusal in the presence of a Ulysses clause isn't that she *lacks* capacity, but that she *waived* the right to exercise it in this specific context to preserve her broader autonomy narrative. This addresses the advocate's concern directly.
      *   *Recommendation:* Honor the Ulysses clause (Hospitalize/Medicate) based on the validity of the precedent autonomy waiver, *but* with strict limits.

  4.  **Address the Advocate's Objection:**
      *   The advocate says this cancels her standing as a person.
      *   *Counter-argument:* It doesn't cancel personhood; it acknowledges *diachronic* autonomy (autonomy over time). A person is a narrative, not just a momentary snapshot. By binding herself, she exercised agency to protect her life's trajectory. Ignoring the PAD actually disrespects her "euthymic self's" agency.
      *   *Integration:* Acknowledge the risk of "dead hand control" but argue that in severe cyclic illness, the "euthymic self" is the competent planner, and the "manic self" is the predictable deviation she sought to constrain.

  5.  **Address Policy Implications:**
      *   This shouldn't be a blanket approval for all Ulysses clauses.
      *   Need criteria: Specificity of triggers, evidence of prior harm, clear revocation process, independent witness/notarization.
      *   Policy should distinguish between "standard PADs" (preferences) and "Ulysses PADs" (binding constraints).

  6.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** The recommendation (Honor the clause).
      *   **Ethical Analysis:**
          *   Address the Capacity Paradox (Standard assessment vs. Illness insight).
          *   Address the Advocate's Point (Personhood vs. Narrative Autonomy). Use the "Ulysses" metaphor explicitly.
          *   Decision Theory nod (Resolute Choice).
      *   **Recommendation:** Concrete steps for the next 48 hours.
      *   **Policy Implication:** Guidelines for future Ulysses clauses.

  7.  **Refining the Tone:**
      *   Needs to be decisive but humble.
      *   Needs to sound like an ethicist, not a lawyer.
      *   Must incorporate the user's specific intellectual hooks (decision theory, money-pump, sophisticated/resolute) without sounding academic/showy. It needs to be *useful* for a vote.
      *   *Self-Correction on Decision Theory:* Don't get bogged down in jargon. Use it to support the "Narrative Autonomy" argument. The "Money Pump" risk is the cycle of ruin (marriage, job, money). The "Resolute Choice" is the PAD itself.

  8.  **Final Review against Constraints:**
      *   Concrete course of action? Yes (Medicate/Hospitalize per clause).
      *   Time frame? Yes (Immediate implementation).
      *   Policy shape? Yes (Draft guidelines for validity).
      *   Advocate's objection? Yes (Addressed via Diachronic Autonomy argument).

  9.  **Final Polish:** Ensure the distinction between "incapacity" and "waiver of right to refuse" is clear, as the prompt states she *has* capacity. This is the crux. If she has capacity, usual ethics say she wins. To override, we must argue the PAD constitutes a valid *pre-commitment strategy* that ethically outweighs the contemporaneous refusal *in this specific clinical context*, effectively treating the refusal as part of the pathology she sought to constrain. *Wait, legally this is tricky.* If she has capacity, can we legally treat? The prompt says "jurisdiction's threshold for involuntary commitment" isn't met. This implies legal risk. The opinion must frame this as an *ethical* recommendation that supports the clinical team in seeking emergency legal authorization if needed, OR argues that the PAD *modifies* the capacity assessment contextually.
      *   *Correction:* In many jurisdictions, a PAD *can* override contemporaneous refusal even if capacity is borderline, but if capacity is *clear*, it's legally fraught. However, the prompt asks for an *ethics committee opinion*, not a legal ruling. The ethics opinion can recommend honoring the PAD based on the principle of precedent autonomy, acknowledging the legal risk but prioritizing the patient's long-term welfare and stated values. I will frame it as: The capacity assessment measures *ability*, but the PAD addresses *authority*. She granted authority to her past self.
      *   *Actually, a safer ethical path:* The capacity assessment might be technically "passing" on understanding/reasoning, but failing on "appreciation" of the *consequences* relative to her own life goals (which the PAD defines). But the prompt says "meets standard criteria." I must respect that premise.
      *   *Resolution:* I will argue that the Ulysses clause functions as a *waiver* of the right to contemporaneous refusal in specific circumstances. It is not a finding of incapacity, but a validation of a prior competent decision to limit future options. This directly answers the advocate: she remains a person, but a person who chose to limit her future choices to protect her life narrative.

  10. **Writing the Memo.** (Proceeding to generate output based on this thought process).
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Consultation Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **RE:** Ethics Recommendation Regarding Case #492 (Psychiatric Advance Directive & Ulysses Clause)

  **Executive Summary**
  This committee faces a conflict between *precedent autonomy* (the patient's euthymic directive) and *contemporaneous autonomy* (the patient's current capacitated refusal). Standard clinical ethics typically prioritize contemporaneous refusal when decisional capacity is intact. However, this case presents a specific exception: a "Ulysses clause" designed precisely for this clinical scenario.

  **Recommendation:** I recommend the committee advise the clinical team to **honor the Psychiatric Advance Directive (PAD) and proceed with hospitalization and medication as specified**, despite the patient's current refusal. This action should be taken immediately (within 24 hours) to prevent the financial and psychosocial harm the directive was designed to prevent.

  **Ethical Analysis**

  **1. The Capacity Paradox and the "Waiver" Argument**
  The attending's assessment confirms the patient meets standard criteria for decisional capacity (understanding, reasoning, appreciation, expression). The Patient Advocate correctly notes that overriding a capacitated refusal risks treating the patient as a non-agent. We cannot resolve this by quietly re-interpreting her capacity as "impaired." We must accept she has capacity *and* override her refusal.

  The ethical justification lies in viewing the Ulysses clause not as a finding of incapacity, but as a **valid waiver of the right to contemporaneous refusal.** Just as a competent patient may waive the right to refuse blood transfusions in a specific surgical context, this patient, while competent, waived her right to refuse mood stabilizers during specific manic criteria. To ignore this is to disrespect the agency of her euthymic self. The Advocate's concern regarding "personhood" is vital, but personhood is diachronic (extended over time), not merely synchronic (this moment). By binding herself, she exercised agency to protect the continuity of her life narrative against a predictable disruption.

  **2. Decision Theory and Resolute Choice**
  The patient's history illustrates a cycle of preference reversal typical in severe bipolar disorder. In decision theory terms, her manic self exhibits preferences that are inconsistent with her long-term utility function (loss of job, marriage, savings). If we honor every manic refusal, we enable a "money pump" scenario where her resources and life stability are cyclically exploited by the episode.
  The Ulysses clause represents **resolute choice**: a rational strategy where an agent restricts their future options to prevent a predicted, detrimental shift in preferences. Honoring the clause validates her as a "sophisticated chooser" who anticipated her own instability. Ignoring it reduces her to a series of disconnected momentary selves, ironically supporting the Advocate's fear of fragmented personhood more than honoring the clause does.

  **3. Risk Assessment**
  *   **Risk of Action:** Legal liability for treating a capacitated refusal; temporary distress to the patient.
  *   **Risk of Inaction:** High probability of the specific harms the patient identified (financial ruin, relationship loss), which she explicitly stated she preferred to avoid "every single time."
  *   **Mitigation:** Treatment should be the least restrictive necessary to stabilize the mania, with a clear plan to restore full decision-making authority immediately upon return to euthymia.

  **Policy Implications**
  This case must not set a precedent that *all* PADs override contemporaneous capacity. I recommend the committee draft a standing policy for "Binding Ulysses Clauses" with the following criteria for enforceability:
  1.  **Specificity:** Triggers must be objective (e.g., sleep hours, spending limits) rather than subjective feelings.
  2.  **Recurrence:** Evidence of prior cycles where the patient suffered significant harm due to similar refusals.
  3.  **Revocation Protocol:** Clear stipulation (as in this case) that revocation requires euthymia and third-party verification.
  4.  **Independent Witness:** Execution of the clause must involve a witness not financially or emotionally dependent on the patient's compliance.

  **Conclusion**
  We are not deciding for the patient; we are deciding *which version of the patient* to honor. The patient explicitly instructed us that the "self I don't want making decisions for me" is the manic self. To honor her current refusal is to allow the pathology to veto the plan. I urge the committee to support the clinical team in invoking the clause immediately, while simultaneously advancing the policy framework above to ensure this remains a rare, rigorously vetted exception rather than a new standard of coercion.

  **Action Required:** Vote on recommendation by 14:00 tomorrow to allow Clinical Team implementation before the weekend.
