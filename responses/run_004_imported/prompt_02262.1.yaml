      *   *Williams:* Analytic, identity-focused.
      *   *Du Châtelet:* Psychological, phenomenological, affect-focused.
      *   *Payoff:* Du Châtelet offers a phenomenological description of *why* categorical desires might not exhaust (the nature of "tastes"), but she adds a condition (illusion) that Williams ignores. This complicates Williams. It suggests the problem isn't just *time*, it's *epistemic transparency*. If you live forever, you become omniscient-ish, destroying the illusions required for Du Châteletian happiness.
      *   *Synthesis:* The paper shouldn't claim Du Châtelet *solves* Williams. It should claim she *reframes* the boredom problem from "exhaustion of objects" to "exhaustion of subjective conditions (illusion)."

