      *   **Topic:** Connecting Émilie du Châtelet's *Discourse on Happiness* (1748) with Bernard Williams's "The Makropulos Case" (1973).
      *   **Core Argument:** Williams argues immortality is boring/unbearable because categorical desires exhaust or the self changes too much. Du Châtelet distinguishes between *desires* (extinguished by satisfaction) and *passions/tastes* (intensified by engagement, e.g., study).
      *   **User's Worry:** Du Châtelet thinks passions rely on *privation, uncertainty, and illusion*. These seem finite over centuries. Does this just delay Williams's problem rather than solve it?
