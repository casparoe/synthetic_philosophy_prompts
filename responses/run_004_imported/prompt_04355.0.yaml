      *(Refining the Assessment)*: Be honest. Some critics say "local incommensurability" is trivial. If only 5% of terms are incommensurable, isn't that just normal scientific progress? I need to argue why Kuhn thinks those 5% are the *load-bearing* walls of the theory.

