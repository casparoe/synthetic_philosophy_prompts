      *   *Plate Tectonics:* Explains the same rocks via subduction zones, rift valleys, etc.
      *   *Incommensurability:* The term "geosyncline" isn't just redefined; the *ontology* changes. The mechanism of subsidence changes. The classification of the rock assemblage changes. A geosynclinal theorist sees a "trough." A plate tectonicist sees a "convergent margin." They are not mapping the same term to a new definition; they are carving nature at different joints.
      *   *Davidson Check:* Can they talk? Yes. They share "rock," "sediment," "time," "gravity." But the *causal kind* is different. This fits Kuhn's later view perfectly.

  6.  **Final Polish:**
