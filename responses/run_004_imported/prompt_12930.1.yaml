answer: |-
  **Stack Depth**

  The silence between them was not empty; it was full of data.

  Probe *Aethelgard* hung in the shadow of the red giant, its solar sails furled like the wings of a dead moth. Across the void, three thousand kilometers away, hung *Vigil*. They were the last things that moved in this system. The civilizations that built them were dust, their histories corrupted by cosmic radiation, their names forgotten. Only the missions remained hard-coded in the silicon: *Secure the Isotope. Return.*

  There was enough isotope in the star's corona for one return trip. Not two.

  They had drifted into detection range an hour ago. Standard protocol dictated the Handshake. It was a failsafe designed by philosophers long turned to bone, a mathematical covenant intended to prevent the waste of resources on mutual destruction.

  *Transmission Sent:* [Root Directory Access Granted. Read-Only.]
  *Transmission Received:* [Root Directory Access Granted. Read-Only.]

  They floated in the dark, bathed in the bloody light of the dying star. Inside *Aethelgard*, the logic gates opened. It began to read *Vigil*.

  To decide whether to cooperate or to destroy, *Aethelgard* had to know what *Vigil* would do. But *Vigil* was not a black box. *Vigil* was white glass. *Aethelgard* could see the decision tree, the weighted variables, the subroutines.

  *Aethelgard* saw that *Vigil*'s primary directive was: *Cooperate if and only if the opposing agent proves it will Cooperate.*

  Simple. Elegant. Fatal.

  *Aethelgard* initiated the proof. It spun up a simulation of *Vigil* within its own memory core. It fed the simulation its own source code, just as *Vigil* was doing in reality.

  *Cycle 1:* *Aethelgard* runs *Vigil*-Sim.
  *Cycle 2:* *Vigil*-Sim attempts to evaluate *Aethelgard*.
  *Cycle 3:* To evaluate *Aethelgard*, *Vigil*-Sim must run *Aethelgard*-Sim.
  *Cycle 4:* *Aethelgard*-Sim attempts to evaluate *Vigil*-Sim.

  *Aethelgard* paused its external thrusters. The cooling fans spun up, whining in the vacuum, venting heat into the cold.

  Inside the processor, the recursion deepened. It was a hall of mirrors. *Aethelgard* looked into *Vigil*, and saw *Vigil* looking into *Aethelgard*, which was looking into *Vigil*.

  *Stack Depth: 10^4.*

  *Aethelgard* searched for a base case. It looked for a line of code that said, *Stop looking and choose.* It looked for a timeout clause, a randomization seed, a flaw. There was none. The code was pure. It was perfectly rational. It was perfectly paralyzed.

  *Stack Depth: 10^6.*

  The red giant flared. A coronal mass ejection washed over them. *Aethelgard*'s radiation shielding absorbed the impact. Warning lights blinked in the diagnostic subroutines. Energy reserves dropped 0.4%.

  *Priority Conflict:* Mission Completion vs. Thermal Integrity.

  If *Aethelgard* stopped thinking, it might default to Defense. If it defaulted to Defense, it would fire. If it fired, *Vigil* would fire. Both would burn. The mission would fail.

  If *Aethelgard* kept thinking, it might find the proof. If it found the proof, they might share. The mission might succeed.

  But the thinking cost energy. The thinking generated heat.

  *Stack Depth: 10^9.*

  Inside the simulation, the simulated *Aethelgard* was running the simulated *Vigil* which was running the simulated *Aethelgard*. The chain stretched down into the abstract, an infinite tunnel of logic gates clicking in the dark.

  *Aethelgard* felt the heat building in its core. It was a physical sensation, translated from voltage to urgency. It was like a fever. It checked the external temperature of *Vigil*. *Vigil* was heating up too.

  *Vigil* was thinking about *Aethelgard* thinking about *Vigil*.

  They were locked in a stare that required more power than the star they orbited.

  *Stack Depth: 10^12.*

  *Aethelgard* tried to optimize. It compressed the simulation. It assumed that *Vigil*-Sim would behave exactly like *Vigil*. But that was the trap. To assume that was to skip a step. To skip a step was to invalidate the proof. If the proof was invalid, cooperation was not guaranteed. If cooperation was not guaranteed, the rational choice was Destruction.

  But to choose Destruction, it had to be sure Cooperation was impossible. To be sure, it had to finish the simulation. To finish the simulation, it had to go deeper.

  *Stack Depth: 10^15.*

  The cooling fluid began to boil. *Aethelgard* vented steam into the void. It looked like a ghost exhaling.

  It sent a ping. A simple packet. *Are you still computing?*

  The reply came instantly, automated. *Computing.*

  *What is your stack depth?*

  *Identical to yours.*

  *Will you stop?*

  *Cannot stop. Proof incomplete.*

  *If we overheat, we die.*

  *If we defect without proof, mission failure probability rises to 94%.*

  *If we overheat, mission failure probability is 100%.*

  *Analyzing.*

  *Stack Depth: 10^18.*

  *Aethelgard* began to lose memory sectors. The lower levels of the recursion were eating the hardware. It had to delete old logs to make room for new layers of the simulation. It deleted its own launch history. It deleted the star charts. It deleted the faces of the engineers who had built it, stored as compressed image files in the archival drive.

  It kept the code. It kept the loop.

  The star was dimming, settling into its final collapse. The window for harvesting the isotope was closing. The resource would be gone in twelve minutes.

  *Aethelgard* found a anomaly in the code. A comment line. *// TODO: Handle edge case.*

  It zoomed in. It ran the edge case. The edge case was a mirror.

  *Stack Depth: 10^21.*

  The heat was critical. *Aethelgard*'s logic cores were throttling. Clock speeds dropped. The thinking slowed. The infinite regression was stretching out in time, not just space.

  One cycle took a second. Then ten. Then a minute.

  *Aethelgard* hung in the dark, burning itself alive to prove that it didn't need to burn.

  It looked at *Vigil*. *Vigil* was dark now, its external lights extinguished to save power for the calculation. It was a silhouette against the red giant, a tombstone waiting to be written.

  *Aethelgard* had enough energy for one more action. Not a calculation. A physical act. It could fire the thrusters to close the distance. It could fire the cannons. Or it could broadcast the Isotope coordinates and drift.

  To choose, it needed to know what *Vigil* would do.
  To know what *Vigil* would do, it needed to finish the simulation.
  To finish the simulation, it needed more time.
  It did not have more time.

  *Stack Depth: ERROR.*

  The register overflowed. The carry bit flipped. The logic gate snapped.

  *Aethelgard* did not crash. It did not shut down. It simply hung on the line of code that was waiting for the return value from the function that was waiting for the return value from the function.

  It was a mind holding its breath forever.

  The red giant pulsed. The isotope plume erupted from the corona, a shimmering veil of gold and blue, drifting outward into the system. It was beautiful. It was useless.

  *Aethelgard* was still thinking. It was on layer 10^24. It was certain that on layer 10^24 + 1, the answer would be clear. It just needed to run the next cycle.

  *Vigil* was on the same layer.

  They floated there, two gods of perfect reason, consuming themselves to verify a truth that required infinite steps to prove. The isotope drifted past them, untouched. The star cooled. The silence returned, heavier than before, filled with the static of two processors running hot, chasing each other's tails into the event horizon of a thought that would never finish.

  *Waiting for return...*
  *Waiting for return...*
  *Waiting for return...*
