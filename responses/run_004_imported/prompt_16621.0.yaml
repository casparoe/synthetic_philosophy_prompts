prompt: |-
  I'm putting together a seminar on moral responsibility and keep getting stuck on a specific puzzle in the "standing to blame" literature that I can't quite untangle in my own head, so I wanted to sanity-check my intuitions with you before I try to lecture on it. The classic case is the tu quoque one: a politician rails against infidelity despite having had an affair himself, and everyone feels like his hypocrisy somehow disqualifies him from making the complaint -- but on paper this looks like a textbook ad hominem, since his own conduct is totally irrelevant to whether infidelity is actually wrong. So what exactly is the hypocrisy supposed to be undermining, if not the truth of the criticism?

  As I understand it there are roughly two families of answer floating around. One (I think this is basically Wallace's "equal standing" move, with echoes in Cohen's stuff on who gets to condemn terrorists) says blame presupposes something like a fair, symmetric moral relationship between blamer and blamed, and the hypocrite violates this by exempting himself from a norm hes actively enforcing on someone else -- so the real objection is unfairness, not falsity. The other treats blame as more like issuing a demand or holding someone to a standard, and says theres something almost self-undermining, Moore's-paradox-ish, about demanding compliance with a rule you yourself flout (this is closer to the Todd-style "unified account," if I'm remembering right, which also wants to explain non-hypocritical standing problems like complicity or plain none-of-your-business-ness under the same umbrella).

  The bit that really trips me up is the asymmetry with praise: a wildly undisciplined coach can still sincerely and appropriately praise an athlete's discipline, no standing problem at all, even though by parity you'd expect the "equal standing" story to generate the same violation there too. Can you walk me through, at a pretty gut level, why hypocrisy specifically is supposed to undercut standing to blame in a way that survives the ad hominem worry, and whether either of these two stories (or some third one) actually explains the praise/blame asymmetry rather than just stipulating it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is preparing a seminar on moral responsibility, specifically focusing on the "standing to blame" literature.
      *   **The Puzzle:** The *tu quoque* case (hypocritical blamer). Why does hypocrisy undermine standing to blame without being a simple ad hominem (attacking the person rather than the claim)?
      *   **The User's Current Understanding:**
          *   Option 1: Wallace/Cohen style ("Equal Standing"). Blame requires a symmetric moral relationship; hypocrisy violates fairness/equality.
          *   Option 2: Todd style ("Unified Account"/Demand). Blame is like issuing a demand; hypocritical demands are self-undermining (Moore's Paradox-ish).
      *   **The Sticking Point:** The Praise/Blame Asymmetry. A undisciplined coach can praise a disciplined athlete without standing issues. If "equal standing" is the key, why doesn't the coach lack standing to praise?
      *   **The Goal:** A "gut level" explanation of why hypocrisy undercuts blame specifically, avoiding the ad hominem charge, and evaluating whether the existing theories explain the praise/blame asymmetry or just stipulate it.

  2.  **Deconstruct the Core Philosophical Issues:**
      *   **Standing vs. Truth:** The user correctly identifies that standing isn't about the *truth* of the claim (infidelity is wrong) but about the *authority* or *permission* to express the blame. This is the key to dodging the ad hominem charge. Ad hominem attacks the *argument*; standing attacks the *speaker's right to speak*.
      *   **The Nature of Blame:** Blame is reactive, backward-looking, and often involves a sanction or a demand for accountability. Praise is often forward-looking, celebratory, and doesn't typically involve a sanction.
      *   **The Hypocrisy Objection:** It's not that the hypocrite is wrong about the norm; it's that their participation in the norm-violation undermines their *authority* to hold *others* to it.
      *   **The Asymmetry:** Why does it work for blame but not praise?
          *   *Hypothesis 1 (Fairness):* Blame imposes a burden/cost. Praise confers a benefit. It's unfair to burden others while exempting yourself. It's not unfair to benefit others while not benefiting yourself (or even while being unworthy of benefit).
          *   *Hypothesis 2 (Commitment):* Blame implies a commitment to the norm's authority. Praise implies recognition of excellence. You can recognize excellence without embodying it. You can't enforce authority you deny yourself.

  3.  **Evaluate the Two Families of Answer:**
      *   **Wallace (Equal Standing/Fairness):**
          *   *Strengths:* Explains the unfairness. Blame is a moral burden.
          *   *Weaknesses:* Does it explain praise? If praise is a "moral benefit," does the coach lack standing? Intuitively, no. So Wallace needs to argue blame is special because it involves *sanctioning*.
      *   **Todd (Unified Account/Demand):**
          *   *Strengths:* Focuses on the speech act. "You must do X" implies "I submit to X."
          *   *Weaknesses:* Does praise work like a demand? "You did well" isn't a demand. So the asymmetry is built into the nature of the speech act, not just the standing condition.

  4.  **Develop the "Gut Level" Explanation:**
      *   *Analogy:* The Judge vs. The Fan.
      *   *Blame:* Like a judge sentencing a criminal. If the judge is committing the same crime, they recuse themselves. Not because the law is invalid, but because *they* can't apply it.
      *   *Praise:* Like a fan cheering a goal. The fan doesn't need to be able to score the goal to recognize it was scored.
      *   *The Ad Hominem Dodge:* Standing isn't about the *proposition* ("Infidelity is wrong"). It's about the *performance* ("I blame you"). The hypocrisy makes the *performance* infelicitous, not the proposition false.

  5.  **Address the Asymmetry Specifically:**
      *   This is the crux. Why doesn't the coach lack standing?
      *   *Key Distinction:* Blame claims *authority* over the other. Praise acknowledges *value* in the other.
      *   *Fairness:* It is unfair to punish someone for what you do. It is not unfair to reward someone for what you don't do.
      *   *Implication:* Hypocrisy undermines the *authority* required for blame. Praise doesn't require the same kind of authority.

  6.  **Drafting the Response (Iterative Process):**
      *   *Acknowledge and Validate:* Start by confirming the user's intuition is spot on. This is a live debate in the literature (Bell, Fritz, Miller, Todd, Wallace).
      *   *Clarify the Ad Hominem Point:* Distinguish between "Your claim is false" (ad hominem) and "You lack the authority to assert this" (standing). Use the "Judge" analogy.
      *   *Tackle the Two Theories:*
          *   *Wallace (Fairness):* Focus on the *burden* of blame. Blame costs something (relationship strain, guilt). Hypocrisy makes imposing this cost unfair.
          *   *Todd (Commitment/Demand):* Focus on the *implication* of blame. Blaming implies "We are both under this norm." Hypocrisy denies this.
      *   *Solve the Asymmetry:*
          *   Praise is not a demand. Praise is not a sanction.
          *   The coach case: Praising discipline doesn't imply "I am disciplined." It implies "Discipline is good."
          *   Blaming infidelity implies "We are both bound by fidelity."
          *   *Crucial Point:* Blame has a *presumptuous* element that praise lacks.
      *   *Third Option (The "Clean Hands" or "Authority" view):* Mention that some argue it's about moral authority, not just fairness.
      *   *Seminar Advice:* Suggest how to present this to students. Use the "Judge" vs. "Critic" analogy.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Wallace actually address praise?* Wallace focuses on the reactive attitudes. The asymmetry is often discussed by people like *Fritz* or *Bell*. I should make sure not to attribute the asymmetry solution solely to Wallace if he didn't fully develop it.
      *   *Refine the Ad Hominem distinction:* Make sure to emphasize that standing is a *pragmatic* defect, not a *semantic* one. The content is true, the act is infelicitous.
      *   *The "Commitment" Account:* This handles the asymmetry well. To blame is to imply you take the norm to be binding on *us*. To praise is to imply the act is *admirable*. I can admire what I cannot achieve. I cannot bind you to what I exempt myself from.

  8.  **Final Polish:**
      *   Tone: Collegial, philosophical, clear.
      *   Structure:
          1.  Validate the puzzle (it's a good one).
          2.  Dissolve the Ad Hominem worry (Standing vs. Truth).
          3.  Analyze the Two Accounts (Fairness vs. Commitment).
          4.  Tackle the Asymmetry (The Coach Case).
          5.  Conclusion/Seminar Tip.

  9.  *(Final check against user prompt)*: Did I answer "what exactly is the hypocrisy supposed to be undermining?" Yes (the authority/permission to perform the speech act). Did I address the asymmetry? Yes. Did I evaluate the two stories? Yes.

  10. **Generate Output.** (Proceed to write the response based on these thoughts.)
answer: |-
  This is a fantastic puzzle to bring into a seminar, and your intuitions are tracking the live debates in the literature very accurately (you're clearly familiar with the Bell, Wallace, Todd, and Fritz corners of this).

  The reason you feel stuck is likely because the "standing" literature often conflates *why* standing matters with *what* standing is. To help you untangle this for your students, let's break it down into three moves: dissolving the ad hominem worry, weighing the two accounts you identified, and then tackling the praise/blame asymmetry head-on, which is the real stress test for these theories.

  ### 1. Dissolving the Ad Hominem Worry
  First, you need to clearly distinguish **truth conditions** from **felicity conditions**.

  The ad hominem charge sticks only if we think the hypocrite is making a claim about the *world* (e.g., "Infidelity is wrong"). If that's the claim, the hypocrite's affairs are irrelevant. But standing theorists argue that blame isn't just asserting a proposition; it's a **speech act** (like sentencing, promising, or betting).

  *   **The Judge Analogy:** Imagine a judge sentences a thief to prison. Later, we discover the judge is a thief himself. We don't say, "The law against theft is false." We say, "This judge lacked the *authority* to pass sentence." The verdict might be legally correct (theft is a crime), but the *performance* of sentencing was infelicitous.
  *   **The Application:** When the politician blames the constituent for infidelity, he isn't just saying "Infidelity is wrong." He is performing an act of **moral sanctioning**. Hypocrisy undermines the *authority to sanction*, not the *truth of the norm*.

  So, to answer your first question: Hypocrisy undermines the **normative power** or **permission** to hold the other person accountable, not the validity of the moral rule itself.

  ### 2. Evaluating the Two Accounts
  You identified the two dominant frameworks: the **Fairness/Equality Account** (Wallace, Cohen) and the **Commitment/Demand Account** (Todd, Fritz). Here is how they handle the "gut level" intuition.

  **A. The Fairness Account (Wallace)**
  *   **The Gist:** Blame imposes a burden (guilt, shame, relationship strain). It is unfair to impose burdens on others that you exempt yourself from.
  *   **The Intuition:** It's the "clean hands" doctrine. You can't dirty your hands and then scold someone else for having dirty hands.
  *   **Verdict:** This is very strong intuitively. It explains why we feel *resentment* toward the hypocrite. We aren't just thinking "he's inconsistent"; we're thinking "who does he think he is?"

  **B. The Commitment Account (Todd)**
  *   **The Gist:** Blame implicitly communicates a commitment to the norm as binding on *both* parties. By blaming, I say, "We are both subject to this." By being a hypocrite, I show I don't actually view myself as subject to it. This makes the communication misleading or "Moore's Paradox-ish" (like saying "It's raining but I don't believe it").
  *   **The Intuition:** It's a form of insincerity. I am pretending to a moral community that I have already opted out of.
  *   **Verdict:** This explains why the blame feels *hollow* or *fake*, rather than just unfair.

  ### 3. The Asymmetry Problem (The Coach Case)
  This is where your seminar will get interesting. You are right to flag this. If standing is about "moral relationship symmetry," why can the undisciplined coach praise the disciplined athlete?

  If the **Fairness Account** is the whole story, the coach *should* lack standing. If praise is a "moral benefit," isn't it unfair to bestow benefits you don't deserve?
  *   *Counter:* Most people intuitively feel the coach *does* have standing. A recovering alcoholic has standing to praise a sober friend. A messy professor has standing to praise a tidy student.

  **Why the Asymmetry Exists:**
  The asymmetry suggests that Blame and Praise are not mirror images. They have different **directions of fit** and different **presumptions of authority**.

  1.  **Sanction vs. Recognition:**
      *   **Blame** is presumptuous. It claims a right to hold the other *down* to a standard. It implies, "I have the standing to call you to account." To claim this authority while flouting the norm is to claim a privilege you haven't earned.
      *   **Praise** is acknowledging. It claims, "You have exceeded a standard." It does not imply, "I have the authority to hold you to this." I can recognize excellence in a domain where I am a failure. (I can praise a marathon runner even if I can't run a mile).

  2.  **The "We" vs. The "You":**
      *   **Blame** implies a shared obligation ("*We* must not steal"). Hypocrisy breaks the "We."
      *   **Praise** implies an individual achievement ("*You* did well"). Hypocrisy doesn't break the "You."

  **Which Theory Survives the Asymmetry?**

  *   **The Fairness Account struggles here** unless it is modified. It has to argue that blame imposes a *cost* that praise does not. (Wallace does this: blame involves the withdrawal of goodwill or imposition of guilt). If praise is costless, fairness doesn't apply.
  *   **The Commitment Account handles this better.** To praise discipline, I do not need to commit to *being* disciplined; I only need to commit to the *value* of discipline. To blame indiscipline, I implicitly commit to *being* disciplined (because I am holding you to a standard that binds us both).

  **A Third Option: The "Moral Authority" View**
  There is a emerging view (championed by people like **Kyle Fritz** and **Daniel Miller**) that synthesizes these. They argue standing is about **moral authority**.
  *   Hypocrisy undermines authority because it shows a lack of **integrity**.
  *   **Why the asymmetry?** Authority is required to *punish* or *demand*, but not to *celebrate*. A parent needs authority to ground a child, but a stranger can compliment the child's drawing. Blame is more like grounding; praise is more like complimenting.

  ### Seminar Suggestion: The "Recusal" Test
  To help your students grasp this gut-level, I recommend using the **Recusal Test**.

  1.  **Scenario A (Blame):** A judge is hearing a theft case. She steals a pen from the courtroom. Should she recuse herself from sentencing the defendant? **Yes.** (Hypocrisy kills standing).
  2.  **Scenario B (Praise):** A judge is hearing an award for "Citizen of the Year." She is not a good citizen. Should she recuse herself from handing out the award? **No.** (Hypocrisy does not kill standing).

  **The Takeaway for the Class:**
  Hypocrisy undermines standing to blame because blame is an exercise of **normative authority** over another person. You cannot exercise authority over a norm you treat as optional for yourself. Praise does not exercise authority over the person; it merely acknowledges value. Therefore, the "Equal Standing" requirement applies to blame (a mutual burden) but not to praise (a unilateral recognition).

  **Summary for your lecture notes:**
  *   **Ad Hominem Dodge:** Standing attacks the *act* of blaming, not the *truth* of the norm.
  *   **The Mechanism:** Hypocrisy violates the fairness of the moral relationship (Wallace) OR makes the communicative act insincere (Todd).
  *   **The Asymmetry:** Blame presumes authority to sanction (requires clean hands); Praise presumes ability to recognize value (does not require clean hands).

  This distinction should allow you to validate the students' intuition that the hypocrite is "out of line" without committing the logical fallacy of thinking the hypocrite is "wrong about the morality."
