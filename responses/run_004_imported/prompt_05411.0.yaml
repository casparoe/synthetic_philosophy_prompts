      *   *Evaluation:* Devon appeals to Bird. Bird distinguishes masks (interfere with process) from finks (remove basis). Does cutting power remove the basis?
      *   *The "Basis" Question:* What is the categorical basis of the sprinkler's disposition to discharge? Is it just the mechanical valve? Or is it the valve + electrical circuit? If the circuit is part of the basis, cutting power alters the basis.
