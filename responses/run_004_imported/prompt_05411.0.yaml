      *   *Distinction:* In the mask case (bubble wrap), the interferer sits between the external trigger and the object. In the fink case (relay), the interferer sits within the object's functional system (or controls a necessary condition intrinsic to the function).
      *   *Is it principled?* It relies on individuating the "stimulus."
