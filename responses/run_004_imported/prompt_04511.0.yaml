answer: |-
  You have spotted a genuine textual similarity, but you have identified the *symptom* while missing the *diagnosis*.

  It is a very common reaction to read Wittgenstein's *Lectures on Religious Belief* and think, "Ah, he's saying religious claims are non-cognitive, just like the Logical Positivists (and later, Sagan and Yudkowsky) said!"

  But while Wittgenstein and Yudkowsky/Sagan agree on the **description** (religious statements don't function like scientific hypotheses), they disagree completely on the **valuation**.

  Here is why Wittgenstein is treated as a friend to faith rather than a "polite Carl Sagan."

  ### 1. The Criterion of Meaning
  **Yudkowsky/Sagan (The Positivist Inheritance):**
  Their argument is normative. They argue that for a statement to be *meaningful* or *rational*, it must constrain anticipation (pay rent). If a religious person says "God loves me" but nothing empirical changes, Yudkowsky argues this is a cognitive failure. It is "belief in belief"—a psychological state masquerading as a factual claim. The implication is: *You should stop doing this if you want to be rational.*

  **Wittgenstein (The Language-Game):**
  His argument is descriptive. He argues that meaning is *use*. He observes that religious believers are not trying to make scientific claims. When a believer says, "I believe in the Last Judgment," they are not offering a weak hypothesis about future astrophysical or necromantic events. They are expressing a commitment that regulates their entire life *now*.

  For Wittgenstein, criticizing religious belief for not paying rent in anticipated experience is a **category error**. It is like criticizing a poem for not containing enough data, or criticizing the rules of chess for not telling you how to bake a cake.

  So, while Yudkowsky says, "This belief is defective because it doesn't predict," Wittgenstein says, "This belief is not trying to predict, so judging it by prediction is nonsense."

  ### 2. The Target of the Critique
  This is the historical key. Wittgenstein (in his later period) was reacting against **Logical Positivism**.

  The Logical Positivists (like A.J. Ayer) argued that any statement not empirically verifiable or analytically true is *literally meaningless*. They used this to dismiss theology, ethics, and metaphysics as nonsense.

  Wittgenstein's *Lectures* are actually a shield *against* that view. He is telling the Positivists: "You are looking at religious language and saying it's broken because it doesn't work like science. But it's not broken science; it's a different language-game entirely."

  *   **Sagan/Yudkowsky** use the "Dragon in the Garage" to show that religious people are **wrong** (or deluded).
  *   **Wittgenstein** uses the "Last Judgment" example to show that religious people are **misunderstood** by philosophers.

  ### 3. "Belief in Belief" vs. "Picture Holding Us Captive"
  Yudkowsky's "belief in belief" suggests the religious person is secretly trying to make a factual claim but is protecting themselves from disconfirmation. He assumes the believer *wants* their belief to be factual but knows it's shaky.

  Wittgenstein suggests the opposite. He thinks the *philosopher* is the one obsessed with factual status. He argues that for the genuine believer, the "picture" of the Last Judgment is not a theory about the future; it is a framework for the present.

  Wittgenstein gives the example of two people: one believes in the Last Judgment, one doesn't. They might agree on every single empirical fact about history, physics, and human mortality.
  *   **Yudkowsky** would say: "See? The belief does no work. It's empty."
  *   **Wittgenstein** would say: "See? The disagreement is not about facts. It is about the orientation of their lives. The believer lives *as if* the picture is true. That is where the meaning resides."

  ### 4. Why Religious Philosophers Love Him
  Religious philosophers cite Wittgenstein because he grants religious discourse **autonomy**.

  If you accept the Yudkowsky/Sagan framework, religion is permanently subordinate to science. Science is the "real" way of knowing, and religion is a failed attempt at science.

  If you accept the Wittgensteinian framework, religion is a separate sphere with its own internal logic. Science cannot touch it, because science asks "Is this factually true?" and religion answers "This is how I live." This is often called **Fideism** (faith is independent of reason).

  It allows a theologian to say: "You cannot disprove God with evolution, because 'God exists' is not a biological hypothesis. It is a grammatical remark about my form of life."

  ### Summary
  You aren't misreading the text, but you are misreading the *intent*.

  *   **Yudkowsky:** "Religious claims don't pay rent, therefore they are **cognitive errors**."
  *   **Wittgenstein:** "Religious claims don't pay rent, therefore they are **not cognitive claims** (and that's okay)."

  Wittgenstein isn't a polite Carl Sagan. He is the philosopher who told the Carl Sagans of the world that they were asking the wrong questions. Sagan wants to cure people of religion by showing it lacks evidence. Wittgenstein wants to cure philosophers of the idea that evidence is the only thing that gives words meaning.

  Religious philosophers love him because he effectively immunizes faith from scientific critique—not by proving God exists, but by arguing that "existence" in the scientific sense isn't the relevant metric for God.
