      *   He validates the *internal rationality* of faith without requiring external proof.
      *   He shifts the ground from "Is it true?" (correspondence theory) to "How does it function?" (pragmatic/expressive theory).
      *   Key term: "Fideism" (though Wittgenstein himself might resist the label, his followers often lean that way).

