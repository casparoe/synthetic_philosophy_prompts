      *   **Reasoning:** Both argue that religious statements don't make empirical predictions ("pay rent"), so they aren't factual beliefs but rather verbal habits/assertions.
      *   **Confusion:** If Wittgenstein is saying religious belief is empty/non-factual, why do religious philosophers cite him as *sympathetic* to faith? Why isn't he seen as a precursor to New Atheism/Skepticism (like Sagan)?
