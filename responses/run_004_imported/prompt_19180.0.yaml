answer: |-
  This is a splendid puzzle, and it is exactly the sort of friction point that makes for a productive graduate seminar. You have identified a surface-level tension that, upon closer inspection, reveals crucial distinctions in Dummett's architecture. While it is tempting to read Dummett's semantic anti-realism as a global skepticism about "undecidable" claims, applying it directly to his political advocacy involves a category mistake regarding what his semantic arguments actually prohibit.

  I do not believe this is a genuine inconsistency in Dummett's work. Rather, it stems from conflating the **rejection of bivalence** with the **suspension of assertion**, and from overlooking Dummett's specific "regional" approach to realism. Here is a breakdown of how you might resolve this for your class, structured around three key philosophical distinctions.

  ### 1. Assertion vs. Bivalence (The Intuitionistic Point)
  The most technical resolution lies in clarifying what Dummett's rejection of bivalence actually entails. The user's puzzle suggests that if we cannot verify a statement, we cannot take a "definite conclusion" about it. But this misunderstands intuitionistic logic.

  *   **Classical Logic:** Allows you to assert $P \lor \neg P$ (Bivalence/LEM) even if you have no method to determine which disjunct is true.
  *   **Intuitionistic Logic:** Forbids asserting $P \lor \neg P$ unless you have a method to decide between them. **However**, it fully permits asserting $P$ if you have a **proof** (or justification) for $P$.

  Dummett's argument in *On Immigration and Refugees* is not that "Either states have obligations or they don't, and I happen to know which." His argument is a constructive one: he offers specific premises (about human need, the nature of borders, historical responsibility) and derives a conclusion. In intuitionistic terms, he is claiming to possess a "proof" (in the broad sense of a compelling justification) for the specific proposition $P$ ("States owe obligations to refugees").

  The lack of a general **decision procedure** for all normative questions (i.e., an algorithm that solves every moral dilemma) does not prevent us from asserting specific moral truths for which we have direct justification. Dummett is not violating his own semantics by asserting $P$; he would only violate them if he insisted that for *any* random migration policy $Q$, either $Q$ is just or $Q$ is unjust, even if we could never know which.

  ### 2. The "Region by Region" Caveat
  You rightly note that Dummett argues "region by region." This is the escape hatch. Dummett never claimed that semantic anti-realism applies to *all* discourse. He applied it primarily to:
  1.  Mathematics (Platonism vs. Constructivism).
  2.  The Remote Past (Realism vs. Anti-realism about truth conditions).
  3.  Counterfactuals.

  He was notably reticent to apply the same anti-realist treatment to **ethical discourse**. In fact, Dummett was a devout Catholic and a moral realist in the traditional sense. He believed in objective moral truths grounded in natural law and divine command.

  For Dummett, the "verification condition" for a mathematical statement is a proof. For an empirical statement, it is observation. But for a moral statement? Dummett likely viewed the "use" of moral language as tied to rational deliberation and the objective demands of justice, which are accessible to reason (or faith). He did not treat moral truths as "recognition-transcendent" in the same spooky way he treated the remote past. He believed we *can* know moral truths through rational insight and empathy. Therefore, the domain of ethics might be a "region" where Dummett was comfortable with a form of realism, or at least where the verification conditions (rational justification) were met in the specific cases he discussed.

  ### 3. Theoretical Semantics vs. Practical Reason
  There is a distinction between Dummett the **semantic theorist** and Dummett the **public intellectual**.
  *   **Semantic Theory:** Concerns the *general* account of meaning. It asks, "What constitutes understanding a sentence?"
  *   **Political Writing:** Concerns *first-order* normative reasoning. It asks, "What should we do?"

  Dummett's semantic theory is a constraint on metaphysics, not necessarily a gag order on political advocacy. His argument is that our *metaphysical picture* of the world must align with our *epistemic capacities*. However, once we are operating within the sphere of practical reason, we are dealing with reasons for action, not just truth conditions.

  In *On Immigration and Refugees*, Dummett is engaging in what we might call "immanent critique." He is appealing to shared liberal-democratic values and Catholic social teaching to show that, *given our existing commitments*, we are obliged to help refugees. He isn't claiming access to a God's-eye view of moral truth that outruns evidence; he is claiming that the **evidence of suffering and the logic of our own principles** verifies the claim.

  ### Pedagogical Suggestions for the Seminar
  To turn this puzzle into a teaching moment, you might propose the following discussion questions to your students:

  1.  **The Scope of Anti-Realism:** Does Dummett's "manifestation argument" (that meaning must be publicly manifestable) apply to moral concepts like "justice"? If I manifest my understanding of justice by acting on it, does that satisfy Dummett's requirement, even if "Justice" isn't empirically observable?
  2.  **Proof vs. Decision Procedure:** Ask the students to formalize Dummett's immigration argument. Is he asserting $P \lor \neg P$ (Bivalence), or is he asserting $P$ based on premises $A, B, C$? If the latter, his semantics are safe.
  3.  **The Role of Faith:** How does Dummett's Catholicism interact with his analytic philosophy? Does his belief in objective moral truth (via God) insulate his political writing from his semantic skepticism about the remote past? (This touches on the "region by region" point).
  4.  **The "Quietist" Charge:** If Dummett *had* applied his semantic skepticism to ethics, would it have led to a paralyzing moral quietism? Is there a pragmatic reason why a philosopher *should* keep their semantic constraints out of their political advocacy?

  ### Conclusion
  You are not running together considerations that ought to be kept apart; rather, you have identified the precise boundary where Dummett's system faces its hardest test. However, the tension dissolves if we recognize that **rejecting bivalence is not the same as rejecting assertibility.** Dummett asserts the obligation to refugees because he believes he has the justification (the "proof"), not because he assumes the truth value exists independently of that justification.

  He is not being inconsistent; he is being an intuitionist about logic and a realist (or at least a justificationist) about ethics. The seminar would do well to explore whether *that* combination is stable, which is perhaps an even richer question than whether Dummett contradicted himself.
