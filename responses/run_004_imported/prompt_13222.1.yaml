  7.  **Final Polish:** Ensure the tone matches the user's (literate, enthusiastic, specific). (e.g., using terms like "mythus," "projection," "sympathy").

  8.  *(Final thought before generating)*: The user mentioned the Cambridge garden anecdote (likely from Frederic Harrison or Myers). Make sure to anchor the "Duty" point there. That is the linchpin.

