answer: |-
  Here are 10 interview questions tailored to your podcast's level of technical rigor. They are designed to corner the guest on her specific commitments without devolving into pop-sci misunderstandings.

  The three mandatory sections (Reference Class, SIA/PP, Causal Link) include the main question, her most likely defensive move, and a specific follow-up to counter that move.

  ### 1. The Specific Formulation
  "Let's start by narrowing the target. There's the pop-sci Doomsday Argument, which is basically 'we're probably not special,' and then there's the formal Bayesian version you defend using the Self-Sampling Assumption (SSA). Can you sketch the specific probabilistic update you're asking us to make? If I'm a grad student sitting here in 2024, what is the exact likelihood ratio I should be applying to my prior over the total number of humans who will ever exist?"

  ### 2. The Reference Class Objection (Mandatory)
  "You've written that the reference class objection is essentially 'a red herring dressed up as a technical objection.' That's a strong claim, because the Doomsday conclusion is incredibly sensitive to how we define the class. If you're dismissing the objection, are you claiming the argument holds for *any* reference class we choose, or are you committing to one specific class as the metaphysically correct one? If it's the latter, what picks out that class?"

  *   **Likely Answer:** She will likely argue that the result is robust across all "natural" reference classes (e.g., "observers subjectively indistinguishable from me").
  *   **Follow-up (Question 3):** "If robustness is the defense, let's test the boundaries. If we include 'beings capable of running the Doomsday Argument' in the reference class, that potentially includes post-humans, uploaded minds, or aliens who discover the same math. If the class expands to include digital substrates that might exist for millions of years, doesn't my birth rank among *biological* humans lose its evidential weight? At what point does expanding the class stop being a 'technical objection' and start looking like you're just defining the class to guarantee the doom conclusion?"

  ### 4. The SIA Trade-Off (Mandatory)
  "Many critics bite the bullet on the Self-Indication Assumption (SIA) to dodge the Doomsday conclusion. Your counter is that this saddles them with the 'Presumptuous Philosopher' problem—believing the universe is huge just because it contains more observers. But this looks like a trade-off between two counterintuitive results. Why should we accept that believing in a potentially infinite universe (SIA) is *more* costly or irrational than believing humanity is likely to go extinct soon (SSA)?"

  *   **Likely Answer:** She will likely argue that the Presumptuous Philosopher implies we can know facts about the physical size of the universe *a priori*, which contradicts empirical science.
  *   **Follow-up (Question 5):** "But consider the alternative cost. If we stick with SSA to avoid being presumptuous about the universe's size, we become presumptuous about our own timeline's longevity without any physical data about asteroids, nuclear stockpiles, or pandemics. Is it really more epistemologically virtuous to let a thought experiment about birth ranks override our physical models of existential risk? Why is the 'presumption' about observer count worse than the 'presumption' about survival rates?"

  ### 6. The Causal Link (Mandatory)
  "This is the thing that keeps me up at night. The Doomsday Argument treats my birth rank as evidence about physical catastrophe rates. But there's no causal mechanism where my existence in the 21st century *causes* an asteroid to hit in the 22nd. Why should a fact about my indexical location count as evidence for physical propensities at all, rather than just being a cute artifact of how we carve up the reference class with zero causal contact with the actual risks?"

  *   **Likely Answer:** She will likely invoke "selection effects" or "sampling bias," arguing that we are a random sample from the set of all humans, and late samples are less likely in long worlds.
  *   **Follow-up (Question 7):** "If it's purely a sampling effect, aren't we assuming the sampling process itself is neutral? But if the 'risk' (like nuclear war) is what determines the sample size, aren't we conflating the *outcome* of the risk with *evidence* for the risk? To put it bluntly: If I draw a ball from an urn and it's red, that tells me about the urn's contents. But if the urn is being filled by a machine that might explode and stop filling, doesn't using the ball count to predict the explosion assume the machine hasn't already biased the sample by surviving this long?"

  ### 8. The Prior Problem
  "Let's talk about the prior. The Doomsday Argument works by shifting a probability distribution over the total number of humans. But that shift depends heavily on whether we start with a scale-invariant prior (like $1/N$) or something else. If a listener says, 'My prior is that technological civilizations usually stabilize and last millions of years based on astrophysical data,' does your argument actually have the force to override that empirical prior, or does it only work if we start from a state of total ignorance?"

  ### 9. The Sleeping Beauty Connection
  "Given our audience's interest in weird probability, I have to ask about the connection to the Sleeping Beauty problem. The debate between 'Halfers' and 'Thirders' maps pretty neatly onto the SSA vs. SIA divide. Do you think resolving the Doomsday Argument requires us to first settle the metaphysics of temporal indexicals in Sleeping Beauty, or do you think the Doomsday case provides independent evidence for which side of that debate is correct?"

  ### 10. Real-World Implications (Closing)
  "Finally, I want to ask about the stakes. If the Bayesian Doomsday Argument is sound, it suggests we should be drastically more pessimistic about the long-term future than our physical models suggest. Should this actually move the needle on real-world x-risk funding and policy decisions? Or, even if you defend it as valid, do you view it as more of an epistemological boundary marker—a 'party trick' that shows the limits of anthropic reasoning rather than a guide for allocating resources?"
