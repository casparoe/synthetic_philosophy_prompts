      *   **Philosophical Stance:** Intentional Stance vs. Design Stance.
      *   **Suggested Vocabulary:** "Latent truth representation," "Sycophantic override."

  8.  (Review against constraints): Keep it concise but deep enough for a PhD. No fluff.

  9.  (Final thought): Make sure to mention that *probes find correlations, not necessarily causal mechanisms*. This is the technical nail in the coffin of the "it knows" claim without further evidence.

