      *Refining the "Missing" section:* It's not just about mechanisms. It's about **Inference to the Best Explanation (IBE)**. Why is "confidence" a better explanation than "socks"? Because it explains *more* (why some people without socks get hired, why confident people without socks get hired) and fits with *more* (psychology, neuroscience). Theo is stuck on simple enumeration (A happened, then B happened). Naomi is using IBE but hasn't named it.

