          *   *Winner:* Theo (partially). He correctly identifies that coherence depends on the starting axioms. However, he ignores that some webs are *better* at predicting reality than others. It's a strong philosophical objection but weakens his own position if *any* web is as good as another.

      *   **Move 5: Naomi's "Prediction Becomes Impossible" Worry.**
          *   *Claim:* If all patterns are equal, prediction is impossible. Some regularities must be more trustworthy.
          *   *Analysis:* This is a pragmatic transcendental argument. To function/act, we *must* privilege some regularities over others. Radical skepticism leads to paralysis.
          *   *Winner:* Naomi. She identifies the practical necessity of distinguishing good vs. bad induction. If Theo is right that all patterns are equal, he can't actually trust the socks either (why not trust *no* socks?).

      *   **Move 6: Theo's Closing Challenge.**
          *   *Claim:* Granted prediction needs trust, but *what* makes confidence trustworthy and socks untrustworthy? Don't just insist.
          *   *Analysis:* He's asking for the *demarcation criterion*. He wants the specific rule that separates "good induction" from "bad induction" that isn't just "because I say so."
