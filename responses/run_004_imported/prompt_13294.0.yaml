answer: |-
  This is a well-documented phenomenon in organizational psychology, though it rarely makes it into the financial press. The HR consultants are observing a disconnect between the **economic contract** (time for money) and the **psychological contract** (loyalty for security).

  To understand why the decline is gradual and accelerating rather than static or immediate, you have to stop viewing employee effort as a commodity that is purchased and start viewing it as an **investment in a future.**

  Here is a framework you can use to explain this pattern in your story, broken down into the four mechanisms that create that specific curve.

  ### 1. The Mechanism: Effort as Capital Investment
  The consultant is correct that the *economic* deal is static: Work + Time = Pay. But employees do not view effort as a transaction; they view it as capital investment.

  In a normal job, I expend extra effort today to build reputation, skills, relationships, and security for *tomorrow*. When the termination date is fixed, the "tomorrow" where that investment pays off is deleted.
  *   **Why Gradual?** Humans are loss-averse. On Day 1, employees are in denial. They subconsciously hope the decision will be reversed, or that their high performance might save them. They continue to "invest" out of habit and hope.
  *   **Why Accelerating?** As the end date nears, the "Return on Investment" (ROI) horizon shrinks. Putting in extra effort in Month 11 for a job that ends in Month 12 feels financially irrational. The closer they get to the end, the less "future" there is to invest in. The decay accelerates because the value of effort is discounted non-linearly as the deadline approaches.

  ### 2. The Mechanism: Cognitive Bandwidth Displacement
  Being fired is not a passive event; it is an active logistical crisis. The employees are effectively working two jobs: their current role and the job of finding a new role.
  *   **Why Gradual?** In the first few months, the energy is consumed by shock, grief, and resume preparation. These are intermittent tasks. Performance dips, but not catastrophically.
  *   **Why Accelerating?** As the months pass, the job hunt intensifies. Interviewing, networking, and negotiating require significant cognitive bandwidth during work hours. In the final quarter, the urgency peaks. The "second job" consumes the majority of their mental energy, causing the performance in the "first job" to plummet rapidly.

  ### 3. The Mechanism: The Breakdown of Social Norms
  Effort is socially regulated. We work hard partly because our peers work hard. This is known as *social proof* or *normative conformity*.
  *   **Why Gradual?** Initially, the team maintains the "high performance" norm. People are embarrassed to be seen slacking.
  *   **Why Accelerating?** Once a few key influencers in the group begin to disengage (perhaps after securing a new job themselves), the social permission to slack off spreads. This creates a feedback loop. As more people coast, the social cost of coasting drops to zero. In the final months, the norm flips from "professionalism" to "survival," causing a collective, rapid drop in output.

  ### 4. The Mechanism: Management Withdrawal (The Feedback Loop)
  This is the variable the employees control, but it is triggered by the company. When management announces a year-long elimination, they often psychologically fire the employees before the actual date.
  *   **The Dynamic:** Managers stop assigning long-term projects. They stop offering training. They stop fighting for the team's resources.
  *   **The Acceleration:** This withdrawal is usually gradual at first, but as the end date nears, management attention shifts entirely to the transition plan (handovers, security, compliance). The employees sense this abandonment. The lack of feedback and direction makes it easier to disengage, which leads to less management attention, which leads to more disengagement. This positive feedback loop creates the "hockey stick" curve of decline.

  ### The "Psychological Horizon" Theory
  If you need a single term to anchor your story, you might call this **The Psychological Horizon Effect.**

  *   **The Economic Horizon** is fixed (365 days of pay).
  *   **The Psychological Horizon** is the point in time where an employee believes their actions matter.

  When a job is secure, the Psychological Horizon is indefinite. When a job is eliminated, the Psychological Horizon collapses. It does not collapse instantly because of emotional processing time (grief/denial). It collapses *acceleratingly* because human perception of time is logarithmic.

  To a human brain, the difference between "12 months left" and "11 months left" feels small. The difference between "2 months left" and "1 month left" feels massive. The urgency of the exit, combined with the shrinking ROI on effort, creates a curve that looks less like a cliff (immediate collapse) or a flat line (steady performance), and more like a **decay curve.**

  ### Summary for your reporting
  The consultants are puzzled because they are measuring **compliance** (are they in the seat?) rather than **engagement** (do they care?).

  The pattern happens because loyalty is a forward-looking emotion. You cannot be loyal to a dead future. The gradual acceleration is the visual representation of employees slowly withdrawing their emotional capital from a bank that has already announced it is closing. They don't withdraw it all at once (panic), and they don't leave it until the end (naivety); they withdraw it in proportion to the shrinking time they have left to benefit from it.
