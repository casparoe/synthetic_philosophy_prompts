      *   *Why Gradual?* It's not a switch. It's an emotional and social process. People need time to process grief/anger. They test the waters. They look for new jobs.
      *   *Why Accelerating?* As the end gets closer, the psychological weight increases. The "future" shrinks. The cost of investing effort (which yields no long-term return) feels higher relative to the shrinking time horizon.

  4.  **Developing Specific Explanatory Models:**

