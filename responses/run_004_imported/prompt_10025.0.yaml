      *   *Arnauld Correspondence:* Leibniz insists that if Adam didn't sin, it wouldn't be *this* Adam. This sounds like Counterpart Theory. But Leibniz maintains the individual is a *substance*. Lewis's counterparts are distinct substances. Leibniz would agree they are distinct substances (distinct complete concepts). So, functionally, yes, Leibniz is a "superessentialist" who denies that the *same* subject can have different essential predicates in different worlds.
      *   *Nuance:* Leibniz allows for *contingent* truths. How? Via the infinite analysis. But the concept remains complete. Lewis allows for contingency via counterparts. The structural similarity is high.
      *   *Verdict:* Leibniz would see Lewis as a kindred spirit on the *logic* of individuals (you can't change an individual's properties and keep the individual), but would reject the *ontology* (plurality of concrete worlds). Leibniz's "counterparts" are distinct possible substances in God's mind, not concrete entities in isolated universes.

