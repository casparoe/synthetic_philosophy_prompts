      *   *Lewis's View:* Counterpart Theory. No trans-world identity. "I" exist only in this world. In other worlds, there are *counterparts* who resemble me. This solves puzzles of contingency (e.g., "I could have been a fisherman" means "A counterpart of me is a fisherman").
      *   *Leibniz's View:* Complete Concept. An individual substance (monad) has a concept that contains all its predicates (past, present, future). If Adam doesn't sin, it's not Adam.
