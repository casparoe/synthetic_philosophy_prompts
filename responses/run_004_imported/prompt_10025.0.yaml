          *   *Leibniz:* Conceptual containment. The reason Adam can't be non-sinning is not because worlds are isolated, but because *identity is grounded in the concept*. However, Leibniz *does* believe in trans-world identity in a specific sense: The *same* possible individual exists in the divine intellect before creation.
