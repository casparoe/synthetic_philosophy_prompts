      *   *Leibniz's View:* "Actual" is non-indexical and absolute. Only one world exists concretely. Others are ideas in God's mind. God chooses *this* one because it maximizes perfection (compossibility + goodness). This choice is the basis of theodicy (why is there evil? Because this is the best *possible* package).
      *   *The Conflict:* If Lewis is right, "actual" loses its normative/existential weight. If every world is "actual" to its inhabitants, God's choice isn't about making *one* real and leaving others potential; it's about... what? Creating all of them? But Leibniz says God chooses *the best*.
      *   *Leibniz's Reaction:* He would reject the indexical analysis as semantically shallow and metaphysically disastrous for theology.
      *   *Key Argument:* For Leibniz, existence (actuality) is a predicate of perfection (Kant later disputed this, but for Leibniz, existence adds to the essence). To say "I am actual" is not just to say "I am here"; it is to say "I have been granted existence by God."
      *   *Theodicy Impact:* If all worlds are equally concrete (Lewis), then the evil in *this* world is not justified by the fact that it's the *only* one God *could* create to maximize good. If God creates all (or if they all exist independently), the evil in *this* world isn't offset by the non-existence of worse worlds. The "best of all possible worlds" claim collapses if "possible" worlds are just as real as the "actual" one. The distinction between *possibility* and *actuality* is the hinge of theodicy. Lewis dissolves the hinge.
      *   *Nuance:* Leibniz might acknowledge the logical coherence of indexicality but deny its applicability to *existence*. Existence is not a perspective; it's a status conferred by the Divine Will.

