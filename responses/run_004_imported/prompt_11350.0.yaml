answer: |-
  You have hit on one of the most fascinating asymmetries in the history of 20th-century philosophy. Your intuition is spot-on: if the Vienna Circle were a political party, Otto Neurath would be the party chairman and campaign manager, while Rudolf Carnap would be the policy wonk writing the white papers on epistemology to justify the platform.

  It is a common misconception that the Logical Positivists were purely dry, apolitical analysts of science. As you've discovered, the "Scientific World-Conception" was explicitly linked to social reform. But you are also right to sense a gap in Carnap's portfolio compared to Neurath's.

  Here is the breakdown of the substantive differences between Carnap's and Neurath's politics, and why Carnap isn't just "Neurath with a nod."

  ### 1. Neurath: The Technocratic Architect
  Neurath's politics were **substantive, economic, and operational.** He didn't just want to talk about socialism; he wanted to run the spreadsheet.

  *   **Calculation in Kind (*Naturalrechnung*):** This is Neurath's big contribution. He argued that money is a "veil" that obscures real value. In a rational socialist society, you shouldn't calculate profit in currency; you should calculate in physical units (kilowatts, tons of steel, hours of labor). This was a direct challenge to the Austrian School (Mises/Hayek), who argued socialist calculation was impossible. Neurath said, "No, you just need the right statistics."
  *   **The Munich & Vienna Connection:** As you heard on the tour, Neurath was the head of the Central Planning Office for the Bavarian Soviet Republic in 1919. When that collapsed, he brought that energy to Red Vienna. He didn't just live in the *Gemeindebauten* (municipal housing); he helped design the *information systems* for them. His ISOTYPE pictograms were meant to educate the working class so they could understand state planning and participate in it.
  *   **The Goal:** A planned economy managed by experts but legitimized by an educated proletariat. It was a vision of **social engineering.**

  ### 2. Carnap: The Logical Humanist
  Carnap was absolutely a socialist, but his socialism was **ethical, logical, and temperamental.** He rarely wrote about interest rates or calculation mechanisms.

  *   **Socialism as an Ethical Stance:** In his *Intellectual Autobiography*, Carnap writes openly about his socialist leanings dating back to his youth in Jena. For Carnap, socialism wasn't primarily about nationalizing the means of production; it was about **human solidarity** and the rejection of authoritarian metaphysics. He saw the "metaphysical" worldview (absolute truths, divine order, rigid hierarchies) as linked to political authoritarianism. The "scientific worldview" was linked to democracy and socialism because it encouraged questioning and verification.
  *   **The 1929 Manifesto:** You mentioned the manifesto (*The Scientific Conception of the World*). Carnap co-wrote it, and it explicitly states: "The scientific world-conception serves life, and life receives it." It links the elimination of metaphysics to the liberation of the worker. But notice the language: it's about *attitude* and *clarity*, not economic policy.
  *   **The Principle of Tolerance:** This is the key philosophical divergence. Neurath was a dogmatist about planning (we *must* calculate in kind). Carnap, later in the 1930s, developed the **Principle of Tolerance**: "In logic, there are no morals." Everyone is free to construct their own logical language/system, provided they state their rules clearly.
      *   Applied to politics, this suggests Carnap was less interested in proving Socialism was the *only* logical system and more interested in creating a framework where social systems could be discussed clearly without metaphysical nonsense. He was a **social democrat** by temperament, favoring gradual reform and rational consensus over Neurath's more revolutionary council-communism.

  ### 3. Is Carnap Just "Neurath's Sidekick"?
  It is tempting to say Carnap just provided the logic for Neurath's politics, but that undersells Carnap's specific contribution. It was a **division of labor.**

  *   **Neurath needed Carnap:** Neurath was a whirlwind of ideas, but his writing was notoriously messy (he called it "encyclopedism"). He needed Carnap's rigorous logic to make the Vienna Circle's arguments bulletproof against critics like Heideggerians or Austrian Economists. Carnap provided the *epistemological security* for Neurath's *political program*.
  *   **Carnap needed Neurath:** Carnap was introverted and focused on abstract structures. Neurath dragged him into the real world. Without Neurath, the Vienna Circle might have remained a seminar club. Neurath ensured that "Unified Science" wasn't just about physics, but about sociology and economics too.

  **The Substantive Difference:**
  Neurath's politics were about **control and optimization** (How do we run society efficiently?).
  Carnap's politics were about **communication and freedom** (How do we ensure social concepts are clear so we can agree on values?).

  Carnap believed that many political conflicts were actually just linguistic confusions. If we could clarify the logical structure of social concepts (like "freedom," "rights," "state"), we could resolve conflicts rationally. This is a deeply political stance: it asserts that **logic is a tool for peace.**

  ### 4. Why the Silence on Planning?
  You asked why Carnap never worked out a position on planning like Neurath.
  1.  **Competence:** Carnap knew he wasn't an economist. He respected Neurath's expertise in that domain.
  2.  **Focus:** Carnap was building *Der Logische Aufbau der Welt* (The Logical Structure of the World). He was trying to solve the problem of how we construct reality from experience. To him, the *logic* of the construction was more important than the *content* of the economy.
  3.  **Exile:** When the Nazis rose, Carnap fled to the US (Princeton, then Chicago). He became focused on securing the position of logical empiricism in American academia. Neurath, who fled to the Netherlands and then England, remained more focused on the socialist project until his death in 1945.

  ### Summary for your Vienna Walks
  When you stand in front of the **Karl-Marx-Hof**:
  *   **Neurath** is the one who asked: "How do we house these people, feed them, and teach them to understand the statistics of their own lives so they can govern themselves?"
  *   **Carnap** is the one who asked: "What is the logical structure of the concepts 'housing,' 'community,' and 'need' that allow us to discuss this project without falling into mystical nationalism or metaphysical dogma?"

  Carnap's politics weren't "vague sympathy," but they were **meta-politics.** He wasn't designing the engine; he was designing the manual for how to read the engine's schematics. He believed that clearing away the "nonsense" of traditional philosophy was a political act that paved the way for a rational, socialist society, even if he left the specific blueprints to Neurath.

  So, is it "Neurath's politics with Carnap nodding"? **No.** It is Neurath's *engine* with Carnap's *operating system*. You can't run the program without the OS, but the OS doesn't tell you where the car is driving. Neurath chose the destination; Carnap ensured the vehicle wouldn't explode due to logical contradictions.
