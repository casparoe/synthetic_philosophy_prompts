          *   So, points off for lack of critical assessment + points off for the "substance" claim which is debatable/likely wrong in the eyes of a metaethicist.
          *   Let's adjust scoring to be fair but rigorous.
          *   (a) 6/6 (It's actually quite clear).
          *   (b) 6/6 (The logic of the problem is well stated).
          *   (c) 4/8 (Describes the solution well, but fails to *assess* it critically and mischaracterizes the ontological status).
          *   Total: 16/20. (A-). This feels more appropriate for a practice essay that gets the hard stuff (the problem) right but fumbles the nuance of the solution.
          *   *Wait, the Frege explanation:* "Geach borrowed the point from Frege's sense/reference distinction... 'wrong' was thought to keep the same reference." Expressivists deny 'wrong' has a reference. This is a category error in the explanation. I should deduct for that in part (a) or (b). Let's deduct in (a).
          *   Revised (a): 5/6.
