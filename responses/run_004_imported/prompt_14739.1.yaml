          *   Total: 14/20. (This is a B-/C+ range, which feels right for "good understanding of the problem, flawed understanding of the solution/assessment").

      *   *Wait, let's look closer at (c).* "Blackburn thinks this lets him go further and earn the right to call moral claims true or false... and he takes this to succeed so completely that quasi-realism ends up equivalent to realism in everything that matters."
