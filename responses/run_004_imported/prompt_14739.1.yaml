          *   *Weakness:* Could be slightly more precise about *why* expressivism struggles (truth-conditions vs. attitude expression), but for a high school level, it's solid.
      *   **Part (c) Briefly assess whether Blackburn's quasi-realism actually answers it:**
          *   *Content:* Explains Blackburn's higher-order attitude solution (disapproving of the combination). Mentions validity as inconsistency of attitudes.
          *   *Accuracy:* This is where the essay goes off the rails.
          *   *Critical Error:* The essay claims Blackburn thinks quasi-realism ends up "equivalent to realism in everything that matters -- the 'quasi' just marks a difference in emphasis, not in substance." **This is philosophically incorrect.** Quasi-realism aims to *mimic* realist discourse (truth, facts, knowledge) *without* accepting realist metaphysics. It is *not* equivalent to realism in substance; the whole point is to remain expressivist while earning the right to talk *as if* there are truth conditions. Claiming it becomes equivalent to realism misunderstands the project. Blackburn wants to save expressivism, not turn it into realism.
