          *   *Accuracy:* Generally good. The example is standard. The explanation of the assertoric vs. non-assertoric context is clear.
          *   *Weakness:* It conflates Frege and Geach slightly in the explanation of the name (see below).
      *   **Part (b) Explain why it's a genuine difficulty for expressivism:**
          *   *Content:* Says premise 2 expresses disapproval, premise 1 does not. Claims this leads to equivocation (meaning two different things). Says this threatens validity.
