      *   **The Manifesto (Wissenschaftliche Weltauffassung):** Explicitly links the scientific worldview to socialist reform, rationalization of society, and elimination of metaphysics (which they associated with reactionary politics).
      *   **The Tension:** If "Socialism is good" is meaningless (non-cognitive), how can it be a *conclusion* or a *necessary extension* of a "scientific world-conception"? If science can only tell us *how* to do things, not *what* to do, why does the Circle claim science *leads* to socialism?
      *   **Means-Ends Distinction:** Standard positivist defense: Science handles means; values are subjective ends.
      *   **The Critique:** The user wants me to argue that this distinction collapses in Carnap's case. The *choice* of planning itself presupposes normative claims (e.g., "efficiency is good," "equality is good," "suffering should be minimized") that are treated as if they are scientific conclusions.

  3.  **Outline the Argument:**
