answer: |-
  This is a fantastic debate. It's rare to see high school friends accidentally stumble into a genuine dispute in the philosophy of language and game theory. The fact that you're split 50/50 isn't a sign that you're abnormal; it's a sign that Jonah and Elena have each grabbed hold of one half of a complex philosophical truth.

  David Lewis's *Convention: A Philosophical Study* (1969) is the gold standard here. To evaluate this, we need to look at Lewis's specific criteria for a convention. For Lewis, a convention is a regularity in behavior that arises to solve a **coordination problem**, characterized by:
  1.  **Regularity:** Everyone does it.
  2.  **Expectation:** Everyone expects everyone else to do it.
  3.  **Preference:** Everyone prefers to do it *if* others do it (conditional preference).
  4.  **Arbitrariness:** There is at least one other alternative rule that could have worked just as well.

  Let's break down the five moves.

  ### Move (1): Jonah's Opening Salvo
  **Jonah:** Shotgun is arbitrary, stops fights, and works only because of mutual expectation.
  **Elena:** (Silent for now)

  *   **Analysis:** Jonah is reciting the "textbook" definition of a convention. He hits the three big notes: Arbitrariness (could be "tallest"), Function (stops fights), and Mechanism (mutual expectation). In a TOK context, this is the correct "surface level" application of Lewis.
  *   **Verdict:** **Jonah wins this round.** He correctly identifies the phenomenology of the situation. It *feels* like a convention, and it meets the basic criteria of regularity and expectation.

  ### Move (2): Elena's "Non-Arbitrary" Counter
  **Elena:** It's not arbitrary like driving because "first to call" tracks "intensity of desire."
  **Jonah:** (Silent for now)

  *   **Analysis:** Elena is attacking the **Arbitrariness** condition (Criterion #4). She argues that "calling shotgun" is functionally superior to "tallest" or "oldest" because it allocates the resource to the person who wants it *most right now* (signaled by speed of speech), rather than an immutable trait.
  *   **Critique:** This is a sharp observation, but it confuses *genealogy* with *arbitrariness*. Lewis admits conventions often start for specific reasons. The test for arbitrariness is: *Could a different rule have sustained the same equilibrium?* Yes. If everyone agreed "Tallest gets shotgun," it would work just as well to avoid fights. The fact that "first to call" is more efficient doesn't make it non-arbitrary in the Lewisian sense; it just makes it a *focal point* (a concept from Thomas Schelling that complements Lewis).
  *   **Verdict:** **Tie (leaning Elena).** Elena is right that there is a functional logic to *this specific rule* over others, which distinguishes it slightly from driving sides. However, she is wrong to think this disqualifies it as a convention. Jonah will easily parry this.

  ### Move (3): Jonah's "Contingent Reason" Rebuttal
  **Jonah:** Driving on the right has historical reasons (swords), but it's still a convention. Having a reason doesn't disqualify it.
  **Elena:** (Silent for now)

  *   **Analysis:** Jonah correctly identifies that "arbitrary" in philosophy doesn't mean "randomly generated." It means "not uniquely determined by necessity." He is historically correct about the sword theory (right-handed knights passing on the left to keep swords between them, leading to driving on the right in carriages).
  *   **Critique:** This is a decisive philosophical point. Lewis explicitly states that a convention can have a historical rationale and still be a convention, provided that *now*, the only reason we follow it is that we expect others to follow it. We don't drive on the right because swords are relevant; we do it because everyone else does. Similarly, we don't call shotgun because it's the most efficient auction system; we do it because it's the rule.
  *   **Verdict:** **Jonah wins clearly.** He successfully defends the definition of arbitrariness against Elena's challenge.

  ### Move (4): Elena's "Coordination vs. Conflict" Pivot
  **Elena:** Shotgun isn't a coordination problem. Driving is (everyone wants to match). Shotgun is conflict (one winner, one loser). Lewis's theory is for coordination.
  **Jonah:** (Silent for now)

  *   **Analysis:** **This is the strongest move in the entire debate.** Elena has hit on the core distinction in Game Theory.
      *   **Driving:** A pure coordination game (Stag Hunt). We both prefer (Right, Right) and (Left, Left) over (Right, Left). Our interests align perfectly regarding the *pattern*.
      *   **Shotgun:** A mixed-motive game (Chicken or Battle of the Sexes). I prefer (Me, Front). You prefer (You, Front). We only agree that (Fight, No Ride) is the worst outcome.
      *   Lewis's theory is specifically built to explain how we solve *coordination* problems, not how we resolve *conflicts of interest*. If our interests diverge on the outcome, is it really a convention, or is it just a truce?
  *   **Critique:** Elena is theoretically precise here. Lewis defines a coordination problem as one where interests *coincide*. In shotgun, interests *diverge* regarding who sits where, even if they coincide on avoiding a fight.
  *   **Verdict:** **Elena wins this round.** She has identified a structural flaw in applying Lewis's strict definition to this scenario. This is the crux of your group's stalemate.

  ### Move (5): Jonah's "Yielding" Rebuttal
  **Jonah:** Driving has conflict too (merging, 4-way stops). Someone loses time. If conflict disqualifies it, nothing is a convention.
  **Elena:** (Silent for now)

  *   **Analysis:** Jonah attempts to blur the line Elena drew. He argues that *all* real-world coordination involves minor conflicts (who goes first at the merge?).
  *   **Critique:** Jonah is practically right but theoretically loose. In a merge, the primary preference is *safety and flow*. Yielding is a tiny cost to secure the primary goal. In shotgun, the seat *is* the primary goal. However, Jonah is right about the *meta-game*. The "convention" isn't about who gets the seat; the convention is about *how we decide*. Everyone agrees on the rule ("First to call wins") even if they disagree on the outcome ("I want the seat").
      *   Lewis actually addresses this. He acknowledges that conventions can stabilize even with conflicting interests, provided the cost of non-coordination (the fight) outweighs the benefit of winning the resource.
  *   **Verdict:** **Jonah wins the debate, though Elena won the theory.** Jonah correctly identifies that in practice, we treat conflict-resolution norms as conventions. If we accept Jonah's point, Elena's objection in (4) becomes a distinction without a difference.

  ---

  ### Missing Considerations
  Neither of them mentioned two concepts that would have settled this faster:

  1.  **The "Meta-Coordination" Problem:**
      Elena is right that the *seat allocation* is a conflict. But Jonah is right that the *rule selection* is a coordination problem. We all coordinate on using the "Shotgun Rule" to solve the "Seat Conflict." Lewis's theory applies to the agreement on the *rule*, not necessarily the agreement on the *outcome*. Both of them missed that the convention is the *method of decision*, not the *distribution of goods*.

  2.  **Normativity and Sanction:**
      A key feature of Lewisian conventions is that deviation attracts criticism. If you drive on the left, people crash. If you call shotgun after someone else, people get *angry*. Elena might argue the anger proves it's about fairness (conflict), while Jonah would argue the anger proves it's about expectation (convention). The missing piece is that conventions often evolve into **norms**. "Shotgun" has moved from a mere regularity to a moralized norm ("It's not fair to break the rule!").

  ---

  ### Final Verdict

  **Is "Calling Shotgun" a Lewis-style Convention?**

  **Yes, but with a caveat.**

  **Jonah is right** that it functions as a convention in every practical sense. It is an arbitrary regularity sustained by mutual expectations to avoid a worse outcome (social friction). In the broad sense used in TOK and everyday language, it is a convention.

  **Elena is right** that it does not fit Lewis's *strict, technical* definition of a solution to a *pure coordination problem*. It is technically a **convention for resolving a conflict of interest.**

  **Who won the argument?**
  **Jonah.**
  Here is why: Lewis's theory is often extended to cover mixed-motive games. The essential feature of a convention is not that everyone wants the *same outcome*, but that everyone prefers *conformity to the rule* over *chaos*.
  *   In driving: I conform so we don't crash.
  *   In shotgun: I conform (let you have the seat) so we don't fight.

  The structure of the *obligation* is identical. Elena's distinction is philosophically interesting, but it doesn't disqualify "shotgun" from being a convention; it just makes it a more complex species of convention than "driving on the right."

  **Advice for the group:**
  Tell them they are both half-right. Elena wins the **Game Theory** point (it involves conflict), but Jonah wins the **Philosophy of Language** point (it functions as a convention). The "Shotgun Rule" is a **coordination convention applied to a conflict situation.**

  If you need to pick a side for the sake of peace: Side with **Jonah**. In the context of a TOK class discussing social norms, the functional definition (Jonah's) is usually what is being tested, not the strict game-theoretic purity (Elena's). Elena is being too pedantic for the spirit of the lesson, even if she is technically sharper on the details.
