  6.  **Evaluate Move (4): Elena's "Coordination vs. Conflict" Pivot (The Crucial Move)**
      *   *Elena's Claim:* Driving is pure coordination (everyone wants to not crash). Shotgun is conflict (one wins, one loses). Lewis's theory is for coordination problems.
      *   *Analysis:* This is the strongest philosophical objection. Lewis defines convention as a solution to a *coordination problem* (matching interests). In a zero-sum game (I want the seat, you want the seat, only one can have it), interests *diverge*.
