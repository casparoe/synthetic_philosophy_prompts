prompt: |-
  ok so this happened with two of my friends and i can't tell who's actually right. we were all cramming into Jonah's car and there's always a scramble over who calls shotgun, and this time it turned into a real argument that's kind of stuck with me since. background: in my TOK class we watched a clip about David Lewis's idea of a "convention" -- like how driving on the right side of the road is just an arbitrary rule that only survives because everyone expects everyone else to follow it, not because it's actually better than the alternative.

  heres roughly how it went:

  (1) Jonah said calling shotgun is literally that: totally arbitrary (could just as easily be "oldest gets it" or "tallest gets it" instead), it stops fights over the seat, and it only works because everyone expects everyone else to respect a call -- exactly the stuff from the TOK clip.

  (2) Elena said it's not arbitrary in the same way as picking a side of the road, because "first person to call it" actually tracks who wanted the seat, unlike "oldest" or "tallest," so there's a real reason this rule won out over the others.

  (3) Jonah said basically every convention has some contingent reason behind it if you look close enough (he brought up that apparently right-side driving has something to do with old sword-fighting habits), but we still call those conventions, so having a reason doesn't disqualify shotgun-calling either.

  (4) Elena said the actual problem is deeper: shotgun isn't a coordination problem at all, because with driving nobody's interests conflict, everyone just wants to match everyone else, but with shotgun there's an actual winner and loser, so it's not the "everyone's interests line up" situation that Lewis's whole idea is supposed to describe.

  (5) Jonah said that objection would kill the driving example too, since somebody has to yield at every merge or 4-way stop, which costs that driver real time, so if any leftover conflict disqualifies something, nothing would ever count as a coordination problem.

  nobody backed down and now half the group has sided with Jonah and half with Elena, which honestly feels like a bad sign for how normal we all are. can you go through moves (1) through (5) and say who has the stronger point at each one (or if it's a genuine tie), mention anything neither of them thought of that actually matters, and then give a final verdict on whether "calling shotgun" really is a Lewis-style convention or something importantly different? dont just jump to the end, i want to know exactly where it goes right or wrong for each of them.
