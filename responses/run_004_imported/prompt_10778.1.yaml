  2.  **Deconstruct David Lewis's Theory of Convention:**
      *   *Core Concept:* A convention is a regularity in behavior (R) in a population (P) in a recurrent situation (S).
      *   *Conditions:*
          1.  Everyone conforms to R.
          2.  Everyone expects everyone else to conform to R.
          3.  Everyone prefers to conform to R *on the condition that* others do (coordination equilibrium).
          4.  There is at least one alternative regularity (R') that could have worked just as well (arbitrariness).
      *   *Key Distinction:* Coordination Problem vs. Conflict of Interest. Lewis focuses on *coordination problems* where interests largely coincide (e.g., meeting place, driving side). Pure conflict (zero-sum) is not a coordination problem. Mixed-motive games are trickier.

