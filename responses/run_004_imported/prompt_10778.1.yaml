      *   *Verdict:* Elena hits the theoretical core. Lewis's definition strictly requires a coordination equilibrium where preferences align regarding the *outcome of conformity*. In shotgun, we prefer *different* outcomes (I want me in front, you want you in front), whereas in driving, we prefer the *same* outcome (we both don't crash).
