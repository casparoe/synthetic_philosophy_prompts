      *   *Jonah's Claim:* Shotgun is arbitrary, stops fights, works because of mutual expectation. Fits the TOK clip (Lewis).
      *   *Analysis:* This is the standard intuitive definition of convention. It hits the "arbitrariness" and "mutual expectation" points.
      *   *Weakness:* It glosses over the "coordination vs. conflict" nuance.
      *   *Verdict:* Strong intuitive start, but theoretically shallow. Elena hasn't countered yet.
