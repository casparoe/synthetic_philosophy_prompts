      *   *Counter-thought:* Lewis allows for *some* reason for a convention's emergence, provided an alternative *could* have worked. However, if the rule is uniquely suited to solve the problem (e.g., auction vs. lottery), it might be less arbitrary. But "first to speak" is still fairly arbitrary compared to "highest bidder."
      *   *Verdict:* Elena makes a good point about *why* this convention emerged, but Lewis would argue it's still arbitrary in the sense that "tallest" or "rock-paper-scissors" could also solve the coordination issue.
      *   *Rating:* Elena raises a valid nuance, but Jonah can easily rebut (as he does in Move 3). It's a tie/slight edge to Elena for spotting the difference in *origin*, but Jonah is right about *sustainability*.

  5.  **Evaluate Move (3): Jonah's "Contingent Reason" Rebuttal**
