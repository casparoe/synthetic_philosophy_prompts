      *   *What's the difference?* The standard philosophical distinction lies in the nature of the "facts" involved.
          *   U/D (Physics): There *is* a fact of the matter about the world, we just can't access it uniquely via theory. Realists say: "Pick the simpler one, it's likely true."
          *   IoT (Translation): Quine argues there is *no fact of the matter* about meaning beyond behavioral disposition. It's not just epistemic (we can't know); it's ontological (there isn't anything to know).
      *   *Why don't IBE/Virtues work?* Because IBE assumes there is a hidden truth to be inferred. If meaning *just is* behavioral disposition (behaviorism/physicalism), and two manuals capture all behavior equally well, there is no "deeper fact" for simplicity to latch onto.

