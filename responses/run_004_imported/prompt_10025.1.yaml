  7.  **Final Polish:** Check against the prompt's specific constraints (two specific points, no standard contemporary objections, careful reconstruction). Ensure the distinction between MWI and Lewis is acknowledged as understood by the user. (The prompt says they already know this, so just brief acknowledgement).

  *(Self-Correction during drafting)*: I need to be careful not to say Leibniz *is* a counterpart theorist. He isn't. He believes in trans-world identity *of concepts* but not of *existents*. Wait, actually, standard interpretation is Leibniz denies trans-world identity of *individuals* because the individual *is* the concept. So if the concept changes, it's a different individual. This *is* functionally counterpart theory. I need to make sure I articulate *why* Leibniz thinks this doesn't lead to Lewis's conclusion. The key is the *status* of the other individuals (mental vs. concrete).

  Let's refine the "Actuality" point. Lewis says "actual" = "here". Leibniz says "actual" = "chosen by God". If Lewis is right, God's choice is illusory. Leibniz would argue that without absolute actuality, there is no "creation," only "isolation." Theodicy depends on the *act* of selection.

