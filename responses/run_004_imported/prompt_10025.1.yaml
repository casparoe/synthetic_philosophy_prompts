      *   *Check:* The "Superessentialism" label. *Correction:* Acknowledge that scholars debate whether Leibniz is a superessentialist. Take the stance that *for the purpose of this comparison*, the CIC doctrine functions similarly to counterparts regarding modal properties, even if Leibniz resists the label "superessentialist" regarding contingency.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Actuality:* Leibniz needs "existence" to be a predicate of perfection. Lewis denies this. Leibniz would say Lewis confuses *conceivability* with *compossibility* and *existence*.
      *   *Identity:* Leibniz agrees you can't change the CIC. But he disagrees that the non-actual CICs are "worlds" in Lewis's sense. They are thoughts.
