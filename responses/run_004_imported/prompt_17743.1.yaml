          4.  Awareness of creationist misuse of this quote.
      *   **Tone:** Respectful, intellectually rigorous, acknowledging the user's expertise (no dumbing down), conversational but precise.

  2.  **Deconstruct Popper's Argument (The "What"):**
      *   *Source:* *Unended Quest* (1974), also earlier lectures in the 1950s/60s.
      *   *Core Logic:* Falsifiability requires risky predictions. Natural selection (NS) explains *ex post facto* why a trait survived. It seems tautological ("survival of the fittest" = "those who survive are those who survive").
      *   *The "Metaphysical" Label:* For Popper, "metaphysical" wasn't an insult (like "nonsense"); it meant "not currently empirically testable but potentially fruitful." He acknowledged its explanatory power.
