      *   *Nuance:* He still thought it was tricky, but acknowledged it *could* be formulated in a testable way.
      *   *Implication:* It wasn't a "mistake" in the sense of stupidity, but a refinement of his view on how the theory is applied. It shows philosophy of science evolving alongside science.

