  3.  **Evaluate the Argument (The "Is it good?"):**
      *   *Strengths:* It highlights the risk of "just-so stories" (Gould & Lewontin later echoed this). It pushes biologists to make specific models (optimality models, game theory) rather than vague appeals to "nature selects."
      *   *Weaknesses:* It conflates the *principle* of NS with specific *models* of NS. We *can* falsify specific adaptive hypotheses (e.g., "this color is for camouflage" -> paint it bright -> it gets eaten). It ignores the predictive power of phylogenetics and population genetics.
