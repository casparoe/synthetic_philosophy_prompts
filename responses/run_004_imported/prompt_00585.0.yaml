answer: |-
  **The Turnstile Man**

  **London, 1954**

  Dr. Elias Thorne watched the man in the booth. Arthur P. was a clerk, thirty-four years old, paid up on his dues, a member of the Union. He stood before the subway turnstile at Bank Station, hand poised on the brass bar.

  He did not push.

  Elias had seen it three Tuesdays in a row. The crowd surged behind Arthur, a tide of wool coats and impatient sighs, but Arthur remained rigid. His eyes were fixed on the slot where the ticket should go. His breathing was shallow, rapid. When the conductor finally tapped him on the shoulder, Arthur collapsed. Not a faint, but a dissolution. He slid down the tiled wall like a puppet with cut strings.

  In the clinic, Elias dipped his pen. *Acute Transit Hesitation.* It sounded temporary. A nervous tic of the modern age.

  "It's the mechanism, Doctor," Arthur said, staring at his own trembling hands. "I feel the teeth of the turnstile in my palm before I touch it. If I push, I think... I think I'll become part of the machine. That I won't come out the other side."

  Elias wrote: *Delusion of Mechanical Assimilation.* He published the case study in the *Journal of Nervous Disease* that autumn. He gave it a shape. He gave it a name. He sent copies to his colleagues in Paris and New York.

  **London, 1994**

  Dr. Mara Thorne sat in the observation room at Heathrow Terminal 4. She was Elias's granddaughter. She had his notes bound in leather on her desk.

  The patient, Jen, was twenty-two. She wore a oversized denim jacket and combat boots. She stood before the automatic security gate. It was not a turnstile; it was a wide, glass corridor that opened with a sensor.

  Jen didn't collapse. She didn't tremble. She stepped into the corridor and stopped exactly where the laser beam scanned her boarding pass. She raised her arms, palms open, mimicking the posture of a traveler being scanned for weapons. She held it for four minutes.

  When security escorted her out, she walked calmly. In Mara's office, Jen smiled. She had a copy of Elias's 1954 paper in her bag. Mara knew because Jen had cited it in her intake form.

  "The assimilation delusion is outdated," Jen said. "It's not about becoming the machine. It's about the verification. I stop because I need to know the system sees me. If I walk through without the light turning green, I cease to exist. I'm not *Acute Transit Hesitation*. I'm *Threshold Null*."

  Mara felt a strange chill, the sensation of a loop closing back on itself. Elias had described a fear of the machine. Jen described a need for the machine's recognition. The symptom had mutated because the *idea* of the symptom had traveled through time. The patients had read the doctor's notes and edited the illness.

  Mara opened her own file. She crossed out *Threshold Null*. She wrote: *Interactive Gate Catatonia.*

  "You feel the need to be processed," Mara said.

  "I feel the need to be *valid*," Jen corrected. "Your grandfather wrote that the turnstile teeth were the trigger. But teeth are aggressive. The laser is passive. It asks for permission. So I wait for permission."

  "And if there is no gate?"

  Jen looked confused. "Then where do I stand?"

  Mara revised the diagnostic criteria that week. She added a new symptom: *Anticipatory Validation Seeking.* The illness was no longer just a paralysis; it was a performance of citizenship. The classification had changed the person, and the person had changed the classification. The loop was spinning faster.

  **London, 2005**

  Mara sat in the same office, but the file was thin. She hadn't diagnosed a case of *Interactive Gate Catatonia* in eighteen months.

  She took the Tube to work now. The brass turnstiles were gone, replaced by wide, open gates that you simply walked through. You didn't push. You didn't insert a ticket. You tapped a card in your pocket and kept moving. The friction was gone.

  She watched the commuters. They flowed like water. There was no threshold to lock upon. There was no mechanical teeth to fear, no laser to demand validation. The sensor was invisible.

  Mara thought of Arthur in 1954, sliding down the tiles. She thought of Jen in 1994, arms raised like a saint before the laser.

  The niche had closed.

  The illness required a specific architecture of resistance—a physical barrier that said *Stop* so the patient could say *No*. When the technology smoothed out, when the barrier became seamless, the symptom had nowhere to land. It didn't get cured. It didn't get treated. It simply became impossible to have.

  A young intern knocked on her door. "Dr. Thorne? We have a patient in waiting. Says he freezes when he has to swipe his Oyster card."

  Mara looked up. "Does he collapse?"

  "No. He just says the reader is 'too slow' and walks around it."

  Mara opened the master file. She took a red pen. She drew a line through *Interactive Gate Catatonia*. She wrote *Historical Note* in the margin.

  "Send him home," she said. "Tell him there's no name for that yet."

  But she knew there wouldn't be. The loop had broken. The machinery of the soul had shifted, and the ghost that haunted the turnstile had starved.
