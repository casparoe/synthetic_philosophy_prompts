      *   *Source Material:* Primarily *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying).
      *   *Augustine's Definition:* A lie is speaking a falsehood with the *intention* to deceive (*enuntiatio cum voluntate falsum enuntiandi*).
      *   *Augustine's Reasoning:* Lying violates the order of creation, damages the soul of the liar, separates one from God (who is Truth), and undermines social trust. Even to save a life, the spiritual harm of sinning outweighs the physical harm to another.
      *   *Augustine's Classification:* In *De Mendacio*, he lists **eight** kinds of lies.
          1.  In religious doctrine (worst).
          2.  Lies that help no one and hurt someone.
          3.  Lies that help one person and hurt another.
          4.  Lies told for the pleasure of lying.
          5.  Lies told to please others (flattery).
          6.  Lies that help someone financially/physically without hurting another.
          7.  Lies that save someone from physical defilement (chastity).
          8.  Lies that save someone from death (least bad, but still sin).
          *Correction/Nuance:* Augustine does *not* consider the 8th kind "forgivable" in the sense of "not a sin." He considers it the *least* grievous, but still a sin that requires penance. He explicitly rejects the idea that it is permissible.
      *   *Mental Reservation:*
          *   Did Augustine invent it? No. This is a later development (Casuistry, Jesuits, 16th-17th century).
          *   What is it? Broad mental reservation (ambiguous speech) vs. Strict mental reservation (silent qualification).
          *   Augustine's view: He generally rejected equivocation intended to deceive. He preferred silence or refusing to answer over deceptive speech.
          *   Connection: The student claims Augustine *worked out* the mental reservation idea. This is historically inaccurate. Mental reservation is usually associated with later Scholastics (Navarrus, Suarez) and Jesuits, often as a way to navigate Augustine's strictness, not as something Augustine himself proposed.
