      *   **Causal-Role (Systemic - CR):** Function $F$ of trait $T$ exists if $T$ currently contributes to a capacity $C$ of the containing system $S$. History doesn't matter; current utility matters.

  3.  **Brainstorming Scenarios where SE $\neq$ CR:**
