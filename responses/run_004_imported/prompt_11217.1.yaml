      *   *Malfunction/Disease:* A trait does something harmful now but was selected for good. (SE says function is the good thing, CR might say current role is harmful). *Critique:* A bit abstract.
      *   *Rapid Environmental Change:* A trait was selected for environment $E1$, now exists in $E2$ where it does something else useful.
