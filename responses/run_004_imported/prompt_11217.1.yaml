answer: |-
  This is a classic stalemate in the philosophy of biology (often framed as Ruth Millikan's **Selected-Effects** account vs. Robert Cummins' **Causal-Role** account). You're right that the "heart sounds" and "vestigial appendix" examples are exhausted. They focus on *useless* or *accidental* effects.

  To really drive a wedge between the two, you need an example where the trait is **highly useful** and **actively maintained** in the present, but its current utility is **different** from what originally selected for it.

  Here is a meatier example: **The "Visual" Cortex in Congenitally Blind Individuals.**

  ### The Trait
  The **primary visual cortex (V1)** in the occipital lobe of a human born completely blind.

  ### The Divergence

  **1. Theo's View (Etiological/Selected-Effects)**
  *   **The Logic:** A trait's function is determined by the reason it was favored by natural selection in the ancestral past.
  *   **The Verdict:** The function of V1 is **vision**. Full stop.
  *   **The Implication:** Even though this blind person's V1 is active, healthy, and essential to their daily life, strictly speaking, it is **functionally malfunctioning** or functionless *qua* visual cortex. It is an organ designed for seeing that is being used for something else. The fact that it helps the person read Braille is a "happy accident" or a "co-option," not its biological function. To Theo, calling it a "tactile processor" is like calling a screwdriver a hammer because you used it to pound a tent stake.

  **2. Your View (Causal-Role/Systemic)**
  *   **The Logic:** A trait's function is determined by the contribution it currently makes to the capacity of the containing system (the organism).
  *   **The Verdict:** The function of this specific V1 is **high-resolution spatial/tactile processing** (e.g., for Braille or echolocation).
  *   **The Implication:** In this organism, the occipital lobe is causally contributing to the system's capacity for **sensory integration and navigation**. It is not "broken"; it has been rewired. If you lesioned this area in a blind Braille reader, they would lose the ability to read. Therefore, within the context of *this* system, its function is tactile processing. History is irrelevant to what the part is actually *doing* to keep the system running now.

  ### Why This Is "Meatier" Than the Appendix
  The appendix example is easy for Theo to dismiss because the appendix is often framed as "useless" or "barely useful."

  The Visual Cortex example is harder to dismiss because:
  1.  **It is Adaptive:** The repurposing isn't random; it significantly improves the blind individual's fitness and capacity (blind people who recruit V1 for Braille read faster).
  2.  **It is Physiological:** This isn't just behavioral flexibility; the neural wiring physically changes. The blood flow and activation patterns in V1 shift to handle touch/sound.
  3.  **It Forces a Choice on "Identity":**
      *   If Theo is right, biological function is like a **job title** written in your genetic contract at birth (or speciation). You can't change jobs, even if you do different work.
      *   If you are right, biological function is like a **job description** based on what you actually do in the office today.

  ### The Knock-Out Question for Theo
  Ask him this: *"If we genetically engineered a baby today to be born without eyes, but with a hyper-sensitive V1 wired to their fingertips, and that baby survived better than anyone else because of it... would you still tell me the function of that brain tissue is 'vision,' even though the species has never seen light?"*

  *   If he says **Yes**, he admits function is totally disconnected from current utility (which seems absurd for a "biological" science).
  *   If he says **No**, he admits that current causal contribution can override evolutionary history.
