      *   **Event:** Oxford University awarded Truman an honorary degree in June 1956.
      *   **Anscombe's Role:** Elizabeth Anscombe did indeed protest this. She published a pamphlet titled "Mr. Truman's Degree."
      *   **Anscombe's Argument:** She relied heavily on Catholic moral theology (Aquinas) and the Doctrine of Double Effect. Her core claim was that the bombing of Hiroshima and Nagasaki involved the *intentional* killing of innocents. She argued that even if the goal was to end the war, the method chosen made the death of civilians the *means* to that end, not merely a foreseen side effect. She rejected utilitarian calculus ("it saved lives") as justification for murder.
      *   **The Counter-Argument:** What would a reasonable Oxford don in 1956 say?
          *   *Necessity:* The war needed to end; invasion would cost more lives.
          *   *Legitimacy:* Truman was a head of state in total war; different rules apply.
          *   *Responsibility:* The greater moral failure would have been prolonging the war.
          *   *Challenge to Anscombe:* Is the distinction between "intending" and "foreseeing" really so clear when the destruction is total? Or, is the utilitarian calculation actually the *more* moral approach for a leader responsible for thousands of soldiers?

  3.  **Drafting - Character Voices:**
