answer: |-
  The smoke in the Senior Common Room hung low, blue and stagnant, beneath the dark beams. Eleanor stood by the fireplace, though no fire was lit, clutching a glass of sherry she had no intention of drinking. Arthur leaned against the mantelpiece, blocking her view of the door.

  "You're going to isolate yourself, Ellie," Arthur said quietly. "There are whispers already. That you're preparing a protest."

  "Whispers are cheap. Votes are counted."

  "Vote against him, and you vote against the settlement of the Pacific. You vote against the man who held the line when Europe was ash."

  "I vote against honoring a man who chose to massacre civilians as a method of policy." Eleanor's voice was flat, devoid of the tremor he expected. "There is a distinction, Arthur. You know the moral theology. There is a difference between intending a death and merely foreseeing it. When a bomber targets a munitions factory and workers die, that is foreseen. Tragically. But when the target *is* the city, when the destruction of civilian life is the very mechanism by which the will is broken… that is intention. He murdered them. He used them."

  Arthur took a sip of his drink, his eyes tired. "He used the only lever left to him. The Japanese government would not surrender. The invasion of the home islands was projected to cost a million Allied lives. Japanese casualties would have been multiples of that. Starvation, disease, Soviet occupation of the north. Truman chose the path that ended the killing fastest."

  "And that makes it right?"

  "It makes it responsible."

  "It makes it utilitarian," she snapped. "It is the corrupt arithmetic of the age. You think you can weigh one innocent life against another on a scale? That you can commit a moral evil—that is, the intentional killing of the innocent—because you calculate a net profit in survival? That is not ethics, Arthur. That is bookkeeping with blood."

  "Is it?" Arthur pushed off the mantel, stepping into her space. "Suppose a madman holds a gun to a schoolroom. He tells you he will kill them all unless you shoot one child. If you refuse, to keep your own hands clean, every child dies. If you shoot the one, the rest live. Are you virtuous in your refusal? Or are you complicit in the greater slaughter because you were too cowardly to bear the sin of the lesser?"

  "That is a fantasy scenario. This was reality. And in reality, Truman did not shoot one child. He burned two cities. He did not regret the civilians as a side effect; he required their deaths to terrify the Emperor. They were the means. You cannot justify using human beings as instruments of destruction."

  "I am talking about the burden of command," Arthur said, his voice hardening. "You sit here in Oxford and demand moral purity. He sat in the White House and demanded an end to a total war. If he had refused to use the weapon, and our boys died on the beaches of Kyushu, would you call him a murderer then? Is it murder to save your own people?"

  "It is never justice to kill the innocent, even to save the guilty."

  "Then your justice is a luxury we cannot afford." Arthur gestured toward the door, toward the Hall where Congregation would soon assemble. "When you walk in there, you aren't just judging Truman. You are judging every man who fought under him. You are saying their victory was tainted. You are saying the peace we are living in is built on a crime so grave it cannot be honored."

  "I am saying the truth matters more than the peace," Eleanor said. "If we grant him this degree, we say that successful murder is indistinguishable from statesmanship. We say that if the body count is high enough, the morality flips. I will not vote to say that."

  Arthur looked at her, and for a moment, the weariness returned, deeper than before. "And if you lose? Because you will lose, Ellie. The Congregation will vote for him. The world will move on. And you will be left standing alone in the SCR, holding onto a principle that changed nothing."

  "Then I will be the one who didn't applaud," she said. "Someone has to remember that it was murder."

  Arthur straightened his jacket, finishing his sherry. "Someone has to remember that it ended the war. God help us, we can't both be right."

  He turned and walked toward the door, leaving her by the cold fireplace.
