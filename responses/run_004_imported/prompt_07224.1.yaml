answer: |-
  This is a classic philosophical and psychological puzzle that touches on the limits of **behaviorism** (judging by actions alone) versus **intentionalism** (considering internal states).

  To give you a direct answer: **Your friend has the stronger argument.**

  While your intuition relies on a principle called "revealed preference," your friend correctly identifies that human action is not a direct output of desire. It is a calculation mediated by belief, risk assessment, and self-perception.

  Here is a breakdown of why your friend's position is logically more robust, followed by an answer to the deeper question: *Can action ever truly reveal desire?*

  ### 1. The Flaw in "Revealed Preference"
  Your argument relies on a concept from economics called **Revealed Preference Theory**. In its simplest form, it states that if a person chooses $A$ over $B$, they must prefer $A$. If your sister chooses "staying put" over "applying," you infer she prefers "staying put."

  The problem is that this theory assumes **rational agency without friction.** It assumes that if a person wants $X$, and $X$ is available, they will simply take $X$.

  However, human behavior is not a direct line from *Want* $\rightarrow$ *Action*. It looks more like this:

  $$ \text{Desire} + \text{Belief about Feasibility} - \text{Perceived Risk} = \text{Action} $$

  Your sister might have a high **Desire** for the promotion. But if her **Belief about Feasibility** is low (e.g., "I'll fail the interview") or her **Perceived Risk** is high (e.g., "If I try and fail, my boss will think less of me"), the equation results in *Inaction*.

  Your friend identified this variable: *"believing that a visible attempt and failure would cost her more than a quiet non-attempt."* This is a rational calculation. In game theory, this is known as **signaling cost**. If the cost of signaling ambition (and potentially failing) is higher than the benefit, a rational actor will remain silent, even if they desire the reward.

  ### 2. The Gap Between Competence and Confidence
  You noted she is "clearly capable of more." This is an external observation. It does not guarantee an internal state of **self-efficacy**.

  Psychologically, there is a well-documented phenomenon where high-performers suffer from **Imposter Syndrome** or **Perfectionism**. For such individuals, the threat of being "found out" as incompetent is more painful than the stagnation of a mid-level role.
  *   **Your reading:** She doesn't want the job.
  *   **The alternative:** She wants the job, but she wants *guaranteed success* more than she wants the *chance* at the job.

  If she views a promotion application as a binary test of her worth (Pass = Worthy, Fail = Worthless), she may avoid the test to protect her self-concept. This is a form of **self-handicapping**. By not trying, she preserves the possibility that she *could* have succeeded. By trying and failing, she destroys that possibility.

  ### 3. Can Action Ever Reveal Desire?
  This is the deeper epistemological question you raised: *Can watching what someone does, on its own, ever really tell you what they want?*

  **The short answer is no.** Actions are "underdetermined" by motives. The same action can stem from infinitely different internal states.

  *   **Example:** A person donates \$100 to charity.
      *   **Interpretation A:** They are altruistic and want to help.
      *   **Interpretation B:** They want a tax write-off.
      *   **Interpretation C:** They want to be seen donating by their peers.
      *   **Interpretation D:** They felt coerced.

  Without access to their internal narrative (their beliefs and fears), the action (\$100 donation) is ambiguous.

  In philosophy of mind, this is related to the **Problem of Other Minds**. We can never directly experience another person's intentions; we only see their behavior. We construct a "theory" about their mind to explain the behavior.
  *   **Your Theory:** She is a rational agent maximizing utility; therefore, no action = no desire.
  *   **Your Friend's Theory:** She is a psychological agent navigating risk; therefore, no action = fear or strategic caution.

  Because both theories explain the observed data (15 years of stagnation) equally well, the data *alone* cannot settle the argument. You would need additional data (conversation, private journals, physiological stress responses during performance reviews) to distinguish between the two.

  ### 4. Why Your Friend's View is More Useful
  Even if we set aside the logic, your friend's argument is more **pragmatically useful**.

  If you assume your sister simply "doesn't want it" (your view), the conversation ends. You categorize her as content, and you stop worrying. But if there is a chance she is stuck due to fear or risk assessment (your friend's view), then she is suffering from a constraint she cannot easily name.

  By accepting your friend's ambiguity, you open the door to empathy. It allows for the possibility that your sister is trapped in a **preference falsification** loop: she may even tell *herself* she doesn't want the promotion to reduce the cognitive dissonance of wanting something she is too afraid to pursue.

  ### Conclusion
  Your friend has the better argument because they account for the **mediating variables** between desire and action (fear, risk, belief). Your argument assumes a frictionless world where ability equals opportunity equals action.

  To answer your final question: **No, observing actions on their own cannot definitively tell you what someone wants.** Actions are the output of a complex algorithm involving desires, beliefs, fears, and constraints. Without knowing the inputs (the internal state), you cannot reverse-engineer the output (the behavior) to find the specific variable of "desire."

  If you want to know what your sister wants, you cannot watch her; you have to ask her. And even then, you must listen not just to her answer, but to the hesitation behind it.
