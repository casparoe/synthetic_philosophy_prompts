answer: |-
  **IMPORTANT ETHICAL NOTE BEFORE YOU PROCEED:**

  Before you use this draft, you need to seriously consider **recusing yourself** from this specific case. As a panel member with a documented memory disability who relies on the exact same accommodation (phone-as-external-brain), you have a direct **conflict of interest**. If this decision is appealed, the first thing the appellant will discover is that the drafter of the memo personally benefits from the precedent being set. This could invalidate the decision and expose you and the panel to accusations of bias.

  In a real-world administrative setting, the ethical move is to disclose your interest to the panel chair and step aside from voting or drafting this specific memo. However, understanding you may be in a position where you are required to draft the language regardless, I have written this memo to be as **objective, precedent-safe, and legally defensible** as possible. It avoids personal language and relies on institutional policy and general disability law principles.

  ***

  **MEMORANDUM**

  **TO:** Office of Disability Services; Faculty Senate Committee on Academic Standards
  **FROM:** Exam Accommodations Appeals Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Appeal Regarding Assistive Technology in Closed-Book Examinations (Case #23-409)

  **DECISION:** **APPROVED WITH STRICT CONDITIONS**

  **BACKGROUND**
  The Panel reviewed an appeal regarding a student's request to utilize a personal mobile device during a scheduled closed-book final examination. The student, who has a documented cognitive disability affecting working memory and information retrieval, requests permission to access a specific folder of pre-approved study materials (photographs of handwritten notes and personal voice memos) stored locally on the device.

  Faculty appellants argue that the presence of any internet-capable device fundamentally alters the nature of a "closed-book" examination, creating an inequitable advantage and compromising academic integrity. Disability Services argues that the device functions as assistive technology, analogous to text-to-speech software or a calculator for specific learning disabilities.

  **PANEL ANALYSIS AND REASONING**

  **1. The Purpose of Accommodations: Equity vs. Uniformity**
  The Panel recognizes the faculty's concern regarding fairness. In a general context, allowing a mobile phone into a closed-book exam would indeed constitute an unfair advantage, as it grants access to the internet, communication channels, and unlimited data. However, the mandate of this Panel is not to ensure identical treatment for all students, but to ensure *equitable opportunity* for students with documented disabilities.

  Under applicable disability rights frameworks, the University is required to provide reasonable accommodations that mitigate the functional limitations of a disability without fundamentally altering the essential learning outcomes of a course. For a student with a working memory disability, the "closed-book" constraint does not test subject mastery; it tests the disability itself. If the essential learning outcome is the application of concepts rather than the rote recall of data, providing a memory aid does not lower the academic standard; it removes the barrier preventing the student from demonstrating that standard.

  **2. Addressing the "Open-Book" Fairness Objection**
  The Panel takes the fairness objection seriously. We acknowledge that if the device allows access to *new* information or *external* assistance, the accommodation becomes an advantage rather than a mitigation. Therefore, the approval is contingent on neutralizing the "open-book" risk.

  The distinction lies between **access to information** and **access to communication.**
  *   **Unfair Advantage:** Accessing the internet, messaging apps, or unapproved files during an exam.
  *   **Reasonable Accommodation:** Accessing static, pre-vetted personal notes that function as a prosthetic for working memory.

  This distinction aligns with existing precedents. A student with dyscalculia is permitted a calculator in a physics exam, but not a phone with a solver app. A student with dyslexia is permitted text-to-speech software, but not a device that can search the web. In this case, the mobile device is the hardware; the specific, restricted files are the accommodation. The device is merely the delivery mechanism for the memory aid.

  **3. Integrity and Verification**
  To satisfy the faculty's legitimate concern regarding academic integrity, the accommodation cannot be a "honor system" usage of a personal phone. It must be technically and procedurally restricted to ensure the device functions solely as a digital note card.

  **CONDITIONS OF APPROVAL**

  The appeal is granted subject to the following mandatory conditions. Failure to adhere to these conditions will result in immediate revocation of the accommodation and potential disciplinary action.

  1.  **Device Isolation:** The device must be placed in "Airplane Mode" with Wi-Fi and Cellular Data disabled prior to entering the exam room. Bluetooth must also be disabled to prevent connection to external peripherals.
  2.  **Application Lock:** The student must utilize a "kiosk mode" app or a specific, pre-approved folder accessible only to the proctor and student. All other applications (browsers, messaging, calendar, other note apps) must be closed and inaccessible.
  3.  **Pre-Exam Inspection:** Thirty minutes prior to the exam, the student must present the device to the lead proctor. The proctor will verify that:
      *   Internet connectivity is disabled.
      *   Only the pre-approved files (photos of notes/voice memos) are accessible.
      *   No other files or apps are available.
  4.  **Content Restriction:** The materials accessible on the device must be limited to the student's own handwritten notes and voice memos created *prior* to the exam day. No textbook PDFs, solution keys, or shared study guides are permitted.
  5.  **Proctorial Oversight:** The student must be seated in a location visible to the proctor at all times. Any attempt to toggle out of the approved app or re-enable connectivity will be treated as academic misconduct.

  **CONCLUSION**
  The Panel finds that denying this request would effectively bar the student from demonstrating their mastery of the course material due to a documented disability, rather than a lack of study or competence. By implementing the strict technical and proctorial conditions outlined above, the University can uphold the integrity of the closed-book examination format while fulfilling its legal and ethical obligation to provide equitable access.

  This decision sets a precedent that mobile devices may be used as assistive technology *only* when their functionality is strictly restricted to static, pre-approved content that directly mitigates a documented cognitive limitation.

  **Signed,**

  **Exam Accommodations Appeals Panel**
