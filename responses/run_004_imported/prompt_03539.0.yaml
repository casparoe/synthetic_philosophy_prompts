      *   **Iterated Game:** This isn't a one-off. It's monthly. Reputation and trust build over time. Tit-for-tat strategies work here.
      *   **Social Preferences:** People aren't cold utility maximizers. We care about fairness, family duty, and guilt. The "payoff" isn't just money saved; it includes emotional well-being and relationship health.
      *   **Schelling Points:** There's a natural focal point (50/50 split) that rational agents often converge on without communication.

