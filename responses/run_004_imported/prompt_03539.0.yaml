prompt: |-
  Kind of embarrassing to ask given my day job, but here goes. My brother and I split the cost of dad's care - no formal agreement, we each just quietly decide what to send every month and don't check up on each other. A friend of mine who's way more into game theory than I am (I teach aesthetics, not decision theory) says I'm being a chump: since what I send can't causally effect what he sends, the "rational" move is to lowball it and let him cover the gap - and if my brother's equally rational he's got the same incentive, so we'll both end up giving less than either of us would actually want. Thing is, my brother and I think alike about nearly everything, always have, so my gut says there's a hole in that logic somewhere. Is my friend right that I'm being naive, or is my instinct onto something?
reasoning: |-
