answer: |-
  This is one of the sharpest cuts in contemporary metaethics, and your confusion is well-founded. You have grasped the "Old" Wrong Kind of Reasons (WKR) problem (the Demon case) and the standard "Object-Given vs. State-Given" (OG/SG) fix. What your professor is introducing is often called the **"New WKR Problem"** or the **"Problem of Object-Given Wrong Kind of Reasons."**

  This argument is primarily associated with papers by **Schroeder (2010)** and **Danielsson & Olson (2007)**. It is widely considered the strongest objection to a reductive Buck-Passing Account (BPA).

  Here is the breakdown of the argument, structured to match your three questions.

  ---

  ### 1. What does an "Object-Given Wrong Kind of Reason" case look like?

  To see the problem, we need to modify the classic Demon case slightly to force the reason to attach to a property of the object.

  **The Case:**
  Imagine the Demon threatens to torture you unless you desire the **Saucer of Mud**.
  *   **Standard Analysis:** The reason to desire the mud is *State-Given*. It is grounded in the consequences of *having the desire* (avoiding torture), not in the mud itself.
  *   **The Twist:** Properties can be **relational**. "Being taller than Napoleon" is a property of me, even though it involves Napoleon. Similarly, consider the property:
      > **$P_{threat}$:** *Being the object such that a demon will torture you unless you desire it.*

  Is $P_{threat}$ a property of the Saucer of Mud? **Yes.** It is a relational property of the mud, just as "being the object of the Demon's demand" is a property of the mud.

  Now, apply the Buck-Passing logic:
  1.  Does the mud have property $P_{threat}$? Yes.
  2.  Does property $P_{threat}$ give you a reason to desire the mud? Yes (otherwise you get tortured).
  3.  Is property $P_{threat}$ grounded in the object? **Yes** (it is a property *of the mud*).

  **The Result:** We have a reason that is **Object-Given** (it stems from a property of the object) but is intuitively the **Wrong Kind of Reason** (it does not make the mud good).

  ### 2. Why does this show the OG/SG split fails?

  The OG/SG distinction was supposed to be the filter. The theory claimed:
  *   **Value** = Reasons to favor based on **Object-Given** properties.
  *   **WKR** = Reasons to favor based on **State-Given** properties.

  The case above shows that this mapping is incorrect.
  *   **Extensional Failure:** The set of Object-Given reasons includes both Right Kind Reasons (e.g., the mud is rare, beautiful) and Wrong Kind Reasons (e.g., the mud is threatened-by-a-demon).
  *   **Conceptual Failure:** The distinction tracks *where the fact is located* (in the object vs. in the state of mind), but WKR is about the *normative role* the reason plays. A reason can be located in the object (as a relational property) but still play the wrong normative role (coercion rather than merit).

  If the OG/SG distinction cannot filter out $P_{threat}$, then simply saying "we only count object-given reasons" does not solve the WKR problem. You still have WKR lurking inside the OG category.

  ### 3. Why does this lead to circularity and primitivism?

  This is the crux of your seminar discussion. If the OG/SG fix fails, the Buck-Passer needs a new filter. They need to say:

  > "For $X$ to be good is for there to be reasons to favor $X$ in virtue of properties that are **[INSERT FILTER HERE]**."

  In the first attempt, [INSERT FILTER HERE] was "object-given." We just saw that fails. So, what is the right filter?
  Intuitively, we want to say: *"Properties that make the object **worthy** of favor"* or *"Properties that **confer value**."*

  Let's try to formulate the revised Buck-Passing Account (BPA*):
  > **BPA*:** $X$ is good iff there are reasons to favor $X$ in virtue of $X$'s **value-conferring properties**.

  Now, ask the semantic question: **What is a "value-conferring property"?**
  *   **Option A:** It is a property that gives a Right Kind of Reason.
      *   *Problem:* This is circular. We are trying to define "Good/Right Kind" in terms of reasons. If we define the relevant reasons in terms of "Right Kind," we haven't analyzed anything. We've just said "Good is reasons of the right kind," which is tautological.
  *   **Option B:** It is a property that makes the object **Good**.
      *   *Problem:* This is explicitly circular.
      *   *Analysis:* "X is Good iff there are reasons to favor X in virtue of properties that make X Good."
      *   You are using the notion of **Goodness** on the right-hand side of the equation to define **Goodness** on the left-hand side.

  **Why is this harder to patch than the original Demon case?**
  In the original Demon case, we could point to something external (the threat) and say "That's not the object." We thought we could solve it with metaphysics (location of properties).
  In the New WKR case, the property *is* in the object. To exclude it, you cannot use metaphysics; you must use **normative classification**. You have to say, "This property counts, but *that* property (the threat one) doesn't."

  But the *only* apparent basis for saying the threat-property doesn't count is that **it doesn't make the mud good.**
  *   If you say "It doesn't count because it's not the right kind of reason," you haven't analyzed 'right kind'.
  *   If you say "It doesn't count because it's not a value-conferring property," you haven't analyzed 'value-conferring'.

  **The Primitivist Conclusion:**
  This is why many philosophers (like **Conor McHugh**, **Jonathan Way**, or **Rabinowicz & Rønnow-Rasmussen** in their later work) argue that **Fittingness** (or "Meriting") must be taken as a **primitive normative notion**.

  *   **Reductive BPA:** Good = Reasons. (Fails due to WKR).
  *   **Non-Reductive BPA:** Good = Fittingness; Fittingness = Primitive.
      *   They argue we should say: "$X$ is good iff it is *fitting* to favor $X$."
      *   We admit we cannot analyze "fitting" in terms of "reasons" without circularity.
      *   We treat "fitting" as a basic normative concept that *guides* which reasons count, rather than being *defined by* reasons.

  ### Summary for your Exam/Seminar

  1.  **The Case:** Relational properties of the object (e.g., "being threatened-by-a-demon") are Object-Given but provide Wrong Kind Reasons.
  2.  **The Failure:** The OG/SG distinction is metaphysical (where is the property?), but WKR is normative (what role does the reason play?). Metaphysics cannot solve a normative problem.
  3.  **The Circularity:** To filter out the bad Object-Given reasons, you must appeal to "value-conferring" or "fitting" properties. But defining those properties requires knowing what is "Good" or "Fitting" beforehand. Thus, you cannot reduce Value to Reasons; you must treat Fittingness as primitive.

  Your friend thinks it wrecks the project; the professor likely thinks it wrecks the **reductive** project. The "Fitting-Attitude" framework survives, but it survives by becoming **non-reductive** (Primitivism) rather than **reductive** (Buck-Passing). That is the crucial distinction to hold onto.
