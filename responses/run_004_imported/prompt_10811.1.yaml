prompt: |-
  Ok so I'm taking a philosophy of science seminar this semester and we just spent two weeks on the replication crisis, and it's spilled over into this running argument I've been having with my roommate (she's a psych PhD student). She's pretty convinced that once you actually look at the mechanics of it, a big part of the replication crisis basically dissolves if you switch from frequentist to Bayesian analysis. Her argument, which I think traces back to Wagenmakers and that whole crowd of Bayesian psychologists, is that under Neyman-Pearson style significance testing, "peeking" at your data as it comes in and stopping once you hit p < .05 inflates your false-positive rate even if your totally honest about it, whereas Bayesian updating literally cannot have this problem, because of the likelihood principle -- the posterior (or the Bayes factor) only depends on the data you actually collected, never on the stopping rule you used to collect it. So her conclusion is that optional stopping, and by extension a good chunk of the replication crisis, is really just an artifact of the frequentist paradigm, and would basically evaporate if the field fully switched over to Bayesian methods.

  I find this pretty convincing, honestly, to the point where I'm tempted to build my term paper around the thesis that the replication crisis is a frequentist problem with a Bayesian solution. But before I commit to that, I wanted a sanity check: is she basically right that this is the fix, or is there some reason switching statistical paradigms wouldn't actually get the field out of the woods?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of science seminar student, discussing the replication crisis with a Psychology PhD roommate.
      *   **Roommate's Claim:** The replication crisis is largely an artifact of frequentist statistics (specifically Neyman-Pearson significance testing and $p$-hacking/optional stopping). Switching to Bayesian analysis solves this because of the Likelihood Principle (stopping rules don't affect posteriors/Bayes Factors).
      *   **User's Position:** Finds it convincing, considering making this the term paper thesis ("Replication crisis is a frequentist problem with a Bayesian solution").
      *   **Task:** Provide a "sanity check." Is the roommate right? Is this a viable thesis, or are there significant caveats/problems with this view?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the roommate technically correct about optional stopping?* Yes, broadly speaking. In Bayesian inference, the likelihood principle implies that the stopping rule is irrelevant for the posterior distribution (assuming the stopping rule doesn't depend on unknown parameters in a way that biases the data generation itself, but generally, optional stopping is less problematic for Bayesians than for frequentists).
      *   *Does this solve the replication crisis?* No, not entirely. This is the crux of the issue. The replication crisis is multifaceted. Statistics is one part, but incentives, publication bias, p-hacking (beyond optional stopping), HARKing (Hypothesizing After Results are Known), low power, and questionable research practices (QRPs) are also major drivers.
      *   *Are there Bayesian-specific pitfalls?* Yes. Choice of priors can be subjective and manipulate results. Bayes Factors can be sensitive to priors. "Bayesian hacking" is possible.
      *   *Is the thesis too strong?* Yes. "The replication crisis is a frequentist problem with a Bayesian solution" is likely too reductionist for a philosophy of science seminar. It ignores sociological and institutional factors.
      *   *Is it a good paper topic?* Yes, *if* nuanced. It's a classic debate in philosophy of statistics (Mayo vs. Wagenmakers, etc.).

  3.  **Structure the Response:**
