  7.  **Key Insight to Emphasize:** The distinction between *methodological vulnerability* (which Bayesianism helps) and *systemic incentive structures* (which Bayesianism does not fix). Also, the distinction between *internal validity* (statistics) and *external validity/replicability* (theory, context, etc.).

  8.  **Self-Correction during drafting:** I initially thought about saying Bayes Factors are immune to false positives. That's not true. If the null is false but the alternative prior is weird, you can get misleading BFs. Also, if you simulate data under the null and stop when BF > 10, you *will* eventually find evidence for the alternative, even if it's false, if you don't penalize for the stopping rule in your decision criterion. Wait, strictly speaking, the posterior is valid, but the *decision rule* based on it can be gamed. I need to be precise here. The *inference* is valid conditional on the model, but the *long-run frequency* of misleading results can still be high if the model is wrong or priors are biased. I should mention the "Calibration" argument.

