answer: |-
  This is a fantastic topic for a philosophy of science seminar, and your roommate is articulating a position that is very prominent in modern methodological reform (often associated with the "New Statistics" movement, Wagenmakers, Kruschke, etc.).

  However, if you build your term paper on the thesis that **"The replication crisis is a frequentist problem with a Bayesian solution,"** you are setting yourself up for a very tough defense. While your roommate is technically correct about the specific mechanics of optional stopping, she is likely overstating the scope of the solution.

  Here is a sanity check broken down into where she is right, where the argument falls short, and how you can salvage this into a nuanced, high-quality paper.

  ### 1. Where Your Roommate is Right (The Grain of Truth)
  Her technical understanding of the **Likelihood Principle** is correct.
  *   **Frequentist Vulnerability:** In Neyman-Pearson hypothesis testing, the $p$-value is calculated based on the probability of obtaining data *as extreme or more extreme* than what was observed, assuming the null is true. This definition relies on the "sample space" (what *could* have happened). If you peek at the data and decide to stop based on the result, you change the sample space, thereby inflating the Type I error rate.
  *   **Bayesian Coherence:** In Bayesian inference, the posterior distribution depends only on the prior and the likelihood of the *actual* data observed. The intention of the researcher (whether they planned to collect $N=100$ or planned to collect until $BF > 10$) is irrelevant to the mathematical update.
  *   **The Implication:** You cannot "p-hack" a posterior in the same way you can hack a $p$-value via optional stopping. The evidence remains coherent conditional on the model.

  If the replication crisis were *solely* caused by optional stopping, she would be right. But it isn't.

  ### 2. Why This Doesn't "Solve" the Replication Crisis
  To argue that switching paradigms solves the crisis ignores several critical factors that are paradigm-agnostic.

  **A. The "Garden of Forking Paths" (Data Dredging)**
  Optional stopping is just one form of QRPs (Questionable Research Practices). Researchers also engage in:
  *   Selecting which dependent variables to report.
  *   Removing outliers post-hoc.
  *   Transforming data until it looks normal.
  *   Controlling for different covariates until the effect appears.

  Bayesian analysis is **not** immune to this. If you try 20 different Bayesian models with different priors or covariate structures and only report the one with the highest Bayes Factor, you are still engaging in selection bias. The Likelihood Principle protects you from *stopping* rules, not *analysis* rules.

  **B. The Prior Problem (Subjectivity as a Bug)**
  Frequentism is criticized for being too rigid; Bayesianism is criticized for being too flexible.
  *   In a low-power environment (common in psych), the choice of prior dominates the posterior.
  *   A researcher can inadvertently (or intentionally) choose a prior that makes their hypothesis look more likely. This is sometimes called **"Bayesian Hacking."**
  *   If the replication crisis is partly about researchers finding effects that aren't there, allowing subjective priors without strict pre-registration could arguably make the problem *worse* by adding a layer of uncheckable subjectivity.

  **C. Publication Bias and Incentives**
  The replication crisis is largely a **sociological and economic problem**, not just a statistical one.
  *   Journals publish positive results. They do not publish null results.
  *   If journals start demanding "Decisive Bayes Factors ($BF > 10$)" instead of "$p < .05$," researchers will still game the system to hit that threshold. They will just switch from $p$-hacking to "BF-hacking" (e.g., manipulating priors or data cleaning).
  *   The "File Drawer Problem" exists for Bayesians too. If 20 labs run a Bayesian study and only the 2 that found strong evidence publish, the literature is still distorted.

  **D. Calibration and False Discovery**
  Recent simulations have shown that if you use Bayes Factors with a hard decision threshold (e.g., "Publish if $BF > 3$") and allow optional stopping, you can still inflate the false discovery rate in the long run, even if the *inference* at any single step is coherent. (See critiques by Deborah Mayo and others regarding "error statistics").

  ### 3. Philosophical Angles for Your Paper
  Since this is a philosophy of science seminar, you have a unique opportunity to move beyond the math and into the epistemology.

  **The Mayo vs. Wagenmakers Debate**
  *   **Wagenmakers (Your Roommate's side):** Focuses on *quantifying evidence*. Belief should be updated according to the Likelihood Principle. Stopping rules are irrelevant to evidence.
  *   **Deborah Mayo (Error Statistics):** Focuses on *severe testing*. A claim is only warranted if it has passed a test that had a high probability of detecting errors if they existed. From this view, ignoring the stopping rule is a bug, not a feature, because it ignores the capacity of the method to detect false positives in the long run.

  **Realism vs. Instrumentalism**
  *   Is the goal of statistics to represent rational degrees of belief (Bayesian)? Or is it to control error rates in scientific inquiry (Frequentist/Error Statistical)?
  *   Your paper could argue that the replication crisis reveals a mismatch between the *goal* of psychology (discovering true causal mechanisms) and the *tool* (null hypothesis significance testing), but that simply swapping tools without changing the *goal* or the *incentives* is insufficient.

  ### 4. Recommendation for Your Thesis
  Do not write: *"The replication crisis is a frequentist problem with a Bayesian solution."*
  This is too strong and easily falsifiable.

  **Instead, try a nuanced thesis like:**
  > *"While the adoption of Bayesian methods mitigates specific methodological vulnerabilities inherent to frequentist null hypothesis testing (specifically regarding optional stopping), it fails to address the systemic incentive structures and selection biases that drive the replication crisis. Therefore, statistical reform must be accompanied by structural reform (pre-registration, open data) to be effective."*

  **Or, more philosophically:**
  > *"The replication crisis highlights a tension between the Likelihood Principle and the Severity Principle. While Bayesian methods resolve the incoherence of optional stopping, they shift the burden of scrutiny from the sampling plan to the prior specification, which may not reduce researcher degrees of freedom without strict pre-registration."*

  ### Summary
  Your roommate is **mechanically correct** but **sociologically naive**.
  *   **Yes:** Bayesian updating handles optional stopping much more gracefully than $p$-values.
  *   **No:** This does not fix publication bias, p-hacking via variable selection, low power, or the "publish or perish" incentive structure.

  If you frame your paper as an investigation into *why* the statistical fix is necessary but insufficient, you will have a much stronger philosophical argument than if you simply advocate for the Bayesian paradigm shift. It shows you understand both the math and the philosophy of scientific practice.
