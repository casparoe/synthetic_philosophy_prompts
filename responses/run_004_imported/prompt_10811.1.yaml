          *   Calibration/False Discovery Rates (Bayes Factors aren't immune to generating false positives under certain conditions, especially with low power or biased priors).
      *   **Philosophical Nuance (For the Seminar):** Connect to philosophical concepts (Inductive Inference, Error Statistics vs. Belief Updating). Mention Deborah Mayo's criticism (Error Statistics).
      *   **Advice on the Term Paper:** Suggest how to frame the thesis so it's defensible and sophisticated. Don't say "It solves it." Say "It mitigates specific methodological vulnerabilities, but fails to address systemic incentives."

  4.  **Drafting the Content (Iterative refinement):**

      *   *Point 1: Optional Stopping.* She's right about the Likelihood Principle. Frequentist error probabilities depend on the sample space (what *could* have happened). Bayesian posterior depends on what *did* happen. So, optional stopping doesn't inflate Type I error in the Bayesian sense. *Correction:* It can inflate false discovery rates if you treat BF > 3 as a hard threshold and stop when you hit it, similar to p-hacking. Need to mention that.
      *   *Point 2: P-hacking.* If I collect 10 variables and only report the one with a high BF, that's still hacking. The Likelihood Principle saves you from stopping rules, not from selection effects in analysis.
      *   *Point 3: Priors.* If I choose a prior that favors my theory too strongly, I can "prove" anything. This is "subjective hacking."
      *   *Point 4: Incentives.* If journals only publish "decisive" BFs, people will still game the system. The crisis is sociological as much as mathematical.
      *   *Point 5: Philosophy.* Mention Mayo's "Severity" principle. She argues that Bayesianism ignores the capacity of the test to detect errors. This is perfect for a philosophy of science paper.

  5.  **Refining the Tone:**
