      *   **Lewis's View:** Lewis knows the difference. He explicitly narrows "Convention" to Coordination Equilibria to make it analytically tractable. He treats Hume as a precursor but admits he is refining the concept.
      *   **The "Narrowing" Conclusion:** Yes, Lewis's gloss is a narrowing. Lewis excludes norms that require enforcement against unilateral temptation (pure PD) unless they can be modeled as coordination on *enforcement mechanisms*.
      *   **Nuance on Property:** Some game theorists (e.g., Ullmann-Margalit, Sugden) argue property *can* be modeled as coordination (which object is "mine" is arbitrary, but having *some* rule is better than none). This bridges the gap slightly. If the choice is between "Rule A" and "Rule B," it's coordination. If the choice is "Rule" vs. "No Rule," it's PD/Assurance. Hume seems to mix these.

