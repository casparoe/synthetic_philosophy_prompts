answer: |-
  You have put your finger on precisely the tension that has occupied much of the subsequent literature in social ontology and game-theoretic philosophy. Your intuition is correct: the game-theoretic structure of "stability of possession" differs significantly from "driving on the right" or "using the word *apple*," and Hume treats them as psychologically continuous in a way that Lewis later formalizes by excluding the problematic cases.

  Here is an analysis of whether Hume noticed the disanalogy, how Lewis handles it, and what this implies for the relationship between Hume's naturalism and Lewis's analyticism.

  ### 1. Does Hume notice the disanalogy?

  In the passage you cite, Hume writes as if the examples are **of a piece**. He does not distinguish between the *coordination* problems (language, money, rowing) and the *cooperation* problems (justice/property) based on their payoff structures. Instead, he unifies them via a **psychological mechanism**: the "general sense of common interest" that is "mutually expressed."

  For Hume, the defining feature of a convention is not the absence of unilateral incentives to deviate (as it is for Lewis), but the **conditionality of compliance** based on the expectation of reciprocity.
  > "I observe, that it will be for my interest to leave another in the possession of his goods, *provided he will act in the same manner with regard to me*."

  This conditional formulation is compatible with both Coordination Games and Iterated Prisoner's Dilemmas (IPD).
  *   **In Coordination:** I conform because conforming *is* my best response to your conformity.
  *   **In IPD (Justice):** I conform because conforming is my best response to your conformity *over the long run*, given the threat of system collapse or retaliation, even if it is not my best response in a single shot.

  Hume acknowledges the "inconveniences of transgressing," which implies that transgression is tempting ("local gain," as you note). However, he argues that the *experience* of these inconveniences assures us of the common interest. He relies on an **evolutionary/learning model** ("arises gradually... slow progression") rather than a static equilibrium analysis. Because Hume lacks the formal apparatus to distinguish a Nash Equilibrium in a Coordination Game from a cooperative equilibrium in an Iterated PD, he lumps them together under the umbrella of "convention." To Hume, both are solutions to social problems that emerge spontaneously from mutual adjustment without a central sovereign or explicit promise.

  ### 2. Lewis's Move: Formalization or Narrowing?

  Lewis is fully aware of the game-theoretic distinction you highlight. In *Convention*, he explicitly defines a convention as a regularity $R$ where everyone prefers to conform to $R$ on the condition that others do, *and* there is an alternative regularity $R'$ that could have served instead.

  Crucially, Lewis requires that **once coordination is achieved, no party has an incentive to deviate unilaterally.**
  *   **Driving Side:** If everyone drives on the left, I have zero incentive to drive on the right, even if I could get away with it without punishment. My interest is purely in *matching*.
  *   **Justice/Property:** If everyone respects possession, I *do* have an incentive to steal (the "sensible knave" problem), provided I can avoid detection. My interest is in *exploiting* the match, not just matching.

  Lewis addresses this in Chapter 1, Section 4 ("Conventions of Language") and in his discussion of Hume. He acknowledges that Hume's category is broader than his own. Lewis's strategy is a **deliberate narrowing**. He argues that to make "convention" a technically useful concept for analyzing meaning and social norms, it must be restricted to **coordination equilibria**.

  Lewis effectively argues that for justice to be a *convention* in his sense, we must model it not as "Steal vs. Don't Steal" (a PD), but as "Rule Set A vs. Rule Set B" (a Coordination Game).
  *   *Example:* It matters little whether we adopt primogeniture or occupancy to determine property rights (arbitrary equilibria). What matters is that we coordinate on *one* of them.
  *   Once we have coordinated on Primogeniture, I have no incentive to unilaterally switch to Occupancy, because that creates conflict.

  However, this sidesteps the temptation to *violate* the rule entirely. Lewis handles this by suggesting that the "convention" includes the sanctions or the moral sentiments that alter the payoff matrix. If the internalized cost of stealing outweighs the gain, the PD is transformed into a Coordination Game (or an Assurance Game).

  ### 3. Is Lewis's Gloss a "Quiet Narrowing"?

  Yes, but it is a **loudly stipulated** narrowing rather than a quiet one. Lewis admits in the Preface and Introduction that he is not doing history of philosophy, but rather using Hume as a springboard for a new technical definition.

  *   **Hume's Notion:** A spontaneous social order arising from mutual expectation of interest, covering both coordination norms (language) and moral norms (justice).
  *   **Lewis's Notion:** A solution to a recurrent coordination problem where equilibria are approximately indifferent.

  By restricting convention to coordination problems, Lewis excludes "pure" Prisoner's Dilemmas where enforcement is required to maintain the norm. If the temptation to defect remains *after* the convention is established (as in your analysis of property), Lewis would classify this as a **social contract** or a **norm backed by sanctions**, rather than a pure convention, unless the sanctions are internalized to the point where the agent is indifferent to defection.

  ### 4. The Behavioral Ecology Perspective

  Given your background, you might appreciate the work of **Robert Sugden** (*The Economics of Rights, Co-operation and Welfare*, 1986), who attempts to bridge this gap in a way that honors Hume more than Lewis does.

  Sugden argues that Humean conventions *are* evolutionary stable strategies (ESS). In animal signaling (as you know), signals can be stable even if there is some temptation to cheat, provided the cost of signal degradation outweighs the benefit of cheating. Sugden applies this to property:
  *   The specific assignment of "mine" vs. "yours" is arbitrary (Coordination).
  *   The maintenance of the assignment relies on the "Bourgeois" strategy (respect possession if you are the owner, challenge if you are not, but accept the rule).
  *   This creates a correlation device that solves the conflict.

  From this视角, Hume was right to group them: they are all **correlated equilibria** established through evolutionary learning. Lewis, by demanding strict indifference and no incentive to deviate, imposes a rationalist constraint that Hume's naturalistic, gradualist account does not require.

  ### Conclusion

  Hume does not notice the game-theoretic disanalogy because he lacks the matrix to see it; he sees only the functional similarity (spontaneous order via mutual expectation). Lewis notices it and resolves it by **stipulative definition**, narrowing "convention" to coordination problems to serve his philosophy of language.

  Therefore, your suspicion is well-founded: Lewis's account is less a formalization of Hume's *actual* concept and more a **reconstruction** of what Lewis thinks the concept *ought to be* to do specific philosophical work. Hume's "convention" is a broader category of spontaneous social order (encompassing both Coordination and Iterated PD solutions), whereas Lewis's "convention" is a specific subset (Coordination only).

  If you are working through *Convention* with Hume in mind, it is productive to read Lewis as proposing a **necessary condition** for a specific *type* of convention (those underpinning meaning and arbitrary norms), while acknowledging that Hume's "justice" likely requires the broader machinery of Iterated Games or Assurance Games that Lewis largely sets aside to keep his analysis tractable.
