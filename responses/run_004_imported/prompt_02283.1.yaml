  8.  **Refining the Game Theory:**
      *   *Coordination:* $Payoff(A,A) > Payoff(B,A)$ and $Payoff(A,A) > Payoff(A,B)$. No incentive to deviate.
      *   *Prisoner's Dilemma:* $Payoff(Defect, Cooperate) > Payoff(Cooperate, Cooperate)$. Incentive to deviate.
