      *   **The "Updateless" Argument (Pre-commitment):** If we could have signed a binding contract *before* being attacked to never pay, would we? Yes, to lower the probability of being attacked. Therefore, we should act *as if* we signed that contract now. *Weakness:* Institutions aren't single agents. Membership rotates. Reputation is leaky. The "counterfactual" attacker might not exist or observe our policy.

