prompt: |-
  So me and my friend got into it for like an hour last night about whether evolution wrecks moral realism -- shes all in on Sharon Street's Darwinian Dilemma paper, the idea that if our moral sense evolved for fitness rather than truth, realists are stuck positing a coincidence they have no right to expect. Got me wondering about Moore specifically, since the non-naturalism he sets up in Principia Ethica is basically the purest target: no natural property doing any tracking, just brute intuition of self-evident non-natural facts. If you could explain Street's argument to him, would he just shrug and say self-evidence doesnt need an evolutionary backstory, or would he feel pushed toward the kind of third-factor/'pre-established harmony' replies people only came up with decades after he died (Enoch, Wielenberg)? Ground it in what Moore actually says about intuition and the naturalistic fallacy, not just the generic realist comebacks everyone trots out.
