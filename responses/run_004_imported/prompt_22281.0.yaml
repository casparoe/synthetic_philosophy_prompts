answer: |-
  This is a fantastic question because it pits one of the cleanest metaethical frameworks (Moore's non-naturalism) against one of the most devastating contemporary epistemic challenges (Street's Darwinian Dilemma).

  If you sat G.E. Moore down and explained Sharon Street's argument, my read is that he wouldn't reach for the "third-factor" toolkit of Enoch or Wielenberg. In fact, he'd likely view those moves with suspicion. Instead, he would double down on the **autonomy of normative truth** and treat Street's demand for an evolutionary explanation as a sophisticated version of the **Naturalistic Fallacy**.

  Here is how that confrontation breaks down, grounded in *Principia Ethica* and his later *Ethics* (1912).

  ### 1. The "Shrug": Self-Evidence and the Autonomy of Ethics
  Street's argument relies on the idea that if our moral faculties were shaped by evolution for *fitness*, we have no reason to trust them for *truth* unless we can explain the correlation.

  Moore's immediate response would be to reject the premise that moral truth *needs* a causal backstory to be justified. In *Principia*, Moore argues that "good" is a simple, non-natural property, analogous to the color "yellow." You cannot define yellow in terms of light wavelengths (that's the fallacy); you just have to see it. Similarly, you cannot define "good" in terms of evolutionary fitness; you just have to intuit it.

  For Moore, intuition isn't a hunch; it's a faculty of intellectual apprehension. In *Ethics* (1912), he clarifies that when a proposition is "self-evident," it means the evidence for it is contained entirely within the proposition itself, not in external facts about the person believing it.

  **Moore's Reply to Street:**
  He would argue that Street is committing a category error. She is asking for a *causal* explanation (evolution) for a *logical* or *necessary* truth.
  *   **The Math Analogy:** Moore often treated ethical axioms like mathematical axioms. If Street told Moore, "Evolution shaped our brains to believe 2+2=4 for survival, not truth, so it's a coincidence that 2+2 actually equals 4," Moore would say that's absurd. The truth of arithmetic is independent of the brain that grasps it.
  *   **The Verdict:** He would shrug. The evolutionary history of the *organism* is irrelevant to the validity of the *intuition*. If the proposition "pleasure is good" is self-evident to a mature mind under ideal conditions, its genealogy doesn't debunk it.

  ### 2. Why He Wouldn't Use "Third-Factor" Replies
  This is the crucial part. Contemporary realists like David Enoch argue that there is a "third factor" linking evolution and morality (e.g., "Survival is good," so evolution tracking survival accidentally tracks moral truth). Erik Wielenberg suggests a "pre-established harmony" where normative truths constrain which creatures can exist.

  Moore would likely reject these moves because they skirt dangerously close to the **Naturalistic Fallacy**.

  *   **Enoch's Trap:** If Moore accepts Enoch's claim that "Survival is objectively good" to bridge the gap, he is effectively defining "good" (or at least a major part of it) in terms of a natural property (survival/fitness). In *Principia*, Moore is ruthless about this. He argues that any attempt to identify "good" with a natural property (like pleasure, desire, or *fitness*) is a fallacy because it always remains an open question: "Yes, this aids survival, but is it *good*?"
  *   **Causal Inertness:** Moore's non-natural properties are causally inert. They don't *do* anything. Wielenberg's pre-established harmony often implies that normative truths have some metaphysical grip on the natural world (constraining evolution). Moore's ontology is stricter: normative truths just *are*. They don't reach out and grab evolutionary processes. To suggest they guide evolution would sound to Moore like mysticism or theology, which he wanted to purge from ethics.

  So, Moore wouldn't try to explain the correlation. He would deny the need for one.

  ### 3. The Real Vulnerability: The Reliability of Intuition
  However, Moore wouldn't get off scot-free. Street's argument hits Moore harder than it hits naturalistic realists, and here is where your friend has the stronger case.

  Moore's epistemology relies entirely on the reliability of **intuition**. In *Principia*, he admits that people disagree about what is self-evident. His solution is that some people have "better" intuition (like having better eyesight).

  Street's point is that evolution doesn't care if you have "good eyesight" for moral truth; it only cares if you have eyesight that keeps you alive.
  *   **The Problem:** If Moore says intuition is like seeing yellow, Street points out that our eyes evolved to see *survival-relevant* light, not the *whole spectrum*. Maybe our "moral eyes" evolved to see "kin-altruism is good" because it helped us reproduce, not because it's a universal truth.
  *   **Moore's Weak Spot:** In *Ethics* (1912), Moore concedes that intuition can be mistaken if the mind is immature or distracted. But he has no mechanism to distinguish between an intuition that is wrong because of "mental clutter" and an intuition that is wrong because evolution hardwired a false belief for fitness.
  *   **The Coincidence:** Moore would have to admit that it is a massive coincidence that the specific intuitions that helped apes survive on the savanna align with the eternal, non-natural truths of the universe. He would call this a "necessary truth," but Street would call it an unexplained miracle.

  ### 4. How Moore Would Actually Respond (The Synthesis)
  If forced to answer, Moore would likely pivot to the **Open Question Argument**.

  He would argue that even if evolution explains *why we feel* a certain way, it cannot explain *what we mean* by "good."
  1.  We can conceive of a world where a behavior is evolutionarily fit but morally bad (e.g., ruthless aggression).
  2.  Therefore, "fitness" and "goodness" are not identical.
  3.  Therefore, the evolutionary explanation is talking about something different than the moral realist is talking about.

  Moore would accuse Street of changing the subject. She is talking about the *causes of moral belief*; he is talking about the *truth of moral propositions*. For Moore, the fact that a belief has a shady causal origin doesn't make it false (the **Genetic Fallacy**).

  ### Summary for Your Debate
  If you're going back to your friend:

  1.  **Moore wouldn't use Third-Factor arguments.** He'd see them as smuggling natural properties (survival) back into the definition of Good, violating the Naturalistic Fallacy.
  2.  **Moore would claim Street commits the Genetic Fallacy.** Explaining the *origin* of a belief (evolution) does not disprove its *truth* (non-natural intuition).
  3.  **The Cost:** Moore has to bite the bullet that our ability to grasp non-natural truths is a happy accident of evolution. He treats this as a brute fact of rational apprehension (like math), but Street forces him to admit that this "rational apprehension" is housed in a brain built for fitness, not truth.

  Moore's position is more resilient to Street than naturalistic realism (because he doesn't claim evolution *tracks* truth), but it comes at the cost of making moral knowledge seem almost magical—a direct grasp of a non-natural realm by a naturally selected brain. Street's whole point is that this "magic" is exactly what we shouldn't bet on.

  **Verdict:** Moore shrugs at the need for an explanation, but in doing so, he makes moral knowledge look epistemically isolated in a way that feels deeply unsatisfying to a naturalist. Your friend is right that this isolation is the weak point, but Moore would argue it's the *price* of keeping morality objective.
