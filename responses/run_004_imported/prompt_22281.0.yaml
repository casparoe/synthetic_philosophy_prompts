      *   **Moore's Core Stance (The "Shrug" Hypothesis):** Focus on *Principia Ethica*. Moore treats moral intuition like sensory perception or mathematical axioms. You don't justify $2+2=4$ by evolutionary history. You just "see" it.
          *   *Key Text:* The analogy with "yellow." You can't define it; you just perceive it.
          *   *Key Text:* Self-evidence. In *Ethics* (1912), he clarifies that self-evidence doesn't mean obvious to everyone, but that the evidence is contained within the proposition itself.
          *   *Conclusion on this point:* Moore would likely reject the demand for an evolutionary explanation as a category error.
      *   **The Naturalistic Fallacy Constraint:** Why Moore wouldn't go full Enoch/Wielenberg.
          *   Enoch's "survival is good" looks suspiciously like defining Good in terms of a natural property (survival/fitness). Moore would call this the Naturalistic Fallacy.
          *   Moore distinguishes between the *property* of goodness and the *things* that are good. Evolution selects for things that are good (maybe), but it doesn't track the *property* itself.
      *   **Nuance: The "Mature Mind" Caveat:** Moore isn't naive. He knows people disagree. In *Ethics*, he talks about how intuition requires a mature mind and proper attention.
          *   *Street's Counter:* Evolution shaped the "mature mind."
          *   *Moore's Reply:* Evolution might explain why we have the *faculty*, but not the *content*. Like eyes evolved to see light, but evolution didn't create the physics of light.
      *   **Synthesis/Verdict:** Moore wouldn't need the Third-Factor. He'd double down on the autonomy of normative truths. He'd view Street's dilemma as a version of the Naturalistic Fallacy (trying to explain normative truth via causal history).

  5.  **Refining the Tone and Content:**
