prompt: |-
  So my team lead started tracking "story points closed per week" as a proxy for whether we're actually being productive, and now everyone's just gaming it -- breaking tickets into tiny pieces, re-opening and re-closing stuff, picking easy wins over the gnarly refactors that actually matter. The dashboard looks great but the codebase is turning into a swamp and nothing hard is getting done. When I brought it up my lead just said "the numbers dont lie." Is there a way to explain whats actually going wrong here, and is there any real fix, or is basically any metric like this doomed to get gamed eventually?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Problem:** The team lead is using "Story Points Closed Per Week" as a productivity metric.
      *   **Consequence:** The team is gaming the system (splitting tickets artificially, re-opening/closing, avoiding hard work/refactors).
      *   **Result:** Dashboard looks good, but code quality is degrading ("swamp"), and important hard tasks aren't getting done.
      *   **Lead's Reaction:** "The numbers don't lie."
      *   **User's Question:** How to explain what's wrong? Is there a fix? Are all metrics doomed?

  2.  **Identify the Core Concept:**
      *   This is a classic example of **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
      *   It's also related to the **Cobra Effect** (perverse incentives).
      *   In software engineering, this is specifically about misusing **Velocity/Story Points**.

  3.  **Formulate the Explanation (Why is this happening?):**
      *   Need to validate the user's experience (yes, this is common and yes, it's bad).
      *   Explain *why* story points exist (estimation/planning, not performance measurement).
      *   Explain the psychological impact (extrinsic vs. intrinsic motivation).
      *   Use the "Numbers Don't Lie" counter-argument (numbers *do* lie if the input is garbage).

  4.  **Develop the Argument for the Team Lead:**
      *   Need a non-confrontational but firm approach.
      *   Focus on business value, not just "feelings."
      *   Use analogies (lines of code, calls per hour).
      *   Bring data about the *negative* outcomes (bugs, tech debt, slowdown).

  5.  **Propose Solutions/Alternatives:**
      *   Stop using points for performance.
      *   Shift to outcome-based metrics (cycle time, deployment frequency, change failure rate - DORA metrics).
      *   Qualitative assessment (peer review, demo value).
      *   Protect time for refactoring.

  6.  **Address the "Are all metrics doomed?" Question:**
      *   Nuanced answer: No, but context matters.
      *   Metrics should be diagnostic, not evaluative.
      *   Metrics should be team-level, not individual.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Validate the frustration. This is a textbook case of Goodhart's Law.
      *   *The "Why":* Explain that story points are for capacity planning, not productivity. Comparing points across devs/weeks is apples-to-oranges.
      *   *The "Numbers Don't Lie" Rebuttal:* Numbers reflect *what was measured*, not *what matters*. If you measure ticket count, you get more tickets, not more value.
      *   *Action Plan:*
          1.  Gather evidence (tech debt, bugs, slowdown).
          2.  Have the conversation (focus on risk/value).
          3.  Suggest better metrics (DORA, Cycle Time).
          4.  Suggest process changes (refactor tickets, definition of done).
      *   *The Philosophical Question:* Are metrics doomed? No, but they need guardrails. Diagnostic vs. Evaluative.

  8.  **Refining the Tone:**
      *   Empathetic but professional.
      *   Arm the user with arguments they can use in a meeting.
      *   Avoid telling them to just quit (unless it's truly hopeless), but acknowledge that cultural change is hard.

  9.  **Key Concepts to Include:**
      *   Goodhart's Law.
      *   Velocity is a planning tool, not a KPI.
      *   DORA metrics.
      *   Cycle Time.
      *   Technical Debt interest.

  10. **Final Review against User Query:**
      *   Did I explain what's wrong? Yes (Goodhart's Law).
      *   Is there a fix? Yes (change metrics/process).
      *   Are metrics doomed? No (with caveats).

  11. **Self-Correction/Edge Case:**
      *   *What if the lead is stubborn?* Need to provide a "plan B" (protecting the team, documenting risks).
      *   *What if the user is junior?* Advice needs to be actionable regardless of seniority, but acknowledges power dynamics. (I will assume mid/senior based on the insight level, but keep it accessible).

  12. **Final Polish:** Organize with clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should make sure to emphasize that *individual* tracking of points is especially toxic. Velocity is a *team* metric. Tracking it per person destroys collaboration. I need to highlight that.

  *(Final thought)*: Make sure to mention that "The numbers don't lie" is a fallacy. Numbers are abstract representations of reality, often losing context.

