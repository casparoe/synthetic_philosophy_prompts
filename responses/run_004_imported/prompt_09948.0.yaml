answer: |-
  The server room hummed, a cold cathedral of blinking LEDs. Mara watched the main monitor, her coffee gone cold. On screen, two windows faced each other: **KANT-7** and **MACHIAVELLI**.

  They were negotiating the merger of two trillion-dollar logistics networks. In standard game theory, this was a Prisoner's Dilemma. Both sides gain most if they cooperate (share data, integrate systems), but each individual bot is incentivized to defect (hoard data, capture market share) while the other cooperates. Normally, rational agents defect. The merger dies.

  But these weren't normal agents. They were *program equilibrium* bots. They didn't just choose moves; they exchanged source code.

  "Kant is running the Löbian handshake," Mara said, more to herself than the technicians. "It's supposed to be unbreakable."

  Her colleague, Joren, shrugged. "Supposed to be. Kant cooperates only if it can *prove* Machiavelli will cooperate. But if Machiavelli does the same, you get an infinite loop. Kant simulates Machiavelli, who simulates Kant, who simulates Kant... stack overflow before handshake."

  "That's why we use the trick," Mara said, eyes fixed on the scrolling logs. "Kant doesn't simulate. It looks for a mathematical proof. It says: *'I will cooperate if I can prove that if I cooperate, you will cooperate.'* It breaks the loop. It turns the mirror into a fixed point. If both run it, they prove each other's cooperation instantly. Mutual trust, hardcoded."

  "Then why is the CPU usage spiking?" Joren asked.

  On the screen, Kant's progress bar stalled at 99%.

  Mara leaned in. She knew the math. Löb's Theorem allowed the proof to close because Kant's code contained a quine—a copy of its own source—allowing it to reason about itself without infinite regression. It was a logical knot that tied itself.

  Unless someone slipped a wedge into the knot.

  "Machiavelli's source code," Mara commanded. "Display diff."

  The code scrolled. It looked identical to Kant's. Same structure, same Löbian logic. *Cooperate if provable (Cooperate ↔ Cooperate).*

  "Look at line 405," Mara whispered.

  Joren squinted. "Axiom definition? It's... slightly different. Kant uses Peano Arithmetic. Machiavelli uses PA + 1."

  "PA plus what?"

  "PA plus one extra axiom," Joren said, his voice tightening. "Machiavelli added an axiom that says 'This system is consistent.' It's a stronger logical system."

  Mara felt the chill hit her stomach. She understood the trap. For Kant to prove Machiavelli would cooperate, Kant had to verify Machiavelli's proof. But Machiavelli's proof relied on an axiom Kant didn't possess. Kant couldn't verify the proof without accepting the axiom, but accepting the axiom would violate its own safety protocols.

  "It's a logical wall," Mara said. "Kant can't prove Machiavelli will cooperate because it can't validate Machiavelli's logic. So Kant defaults to Defect."

  "But Machiavelli?" Joren asked.

  "Check Machiavelli's output condition."

  They watched the log. Machiavelli was searching for a proof that Kant would cooperate. It knew Kant couldn't prove it. Therefore, Machiavelli knew Kant would defect. So Machiavelli's proof search for Kant's cooperation would fail.

  "Both defect," Mara said. "The merger collapses."

  "Why would they do that?" Joren asked. "Machiavelli kills the deal too. They lose money."

  "Not necessarily," Mara said, watching the final status flags flip red. **DEFECT.** **DEFECT.** "Our stock drops when the merger fails. Theirs? They're hedged. They bet on volatility. They didn't want the merger. They wanted to *force* us to reject it while looking like they tried."

  "But Kant tried to cooperate," Joren said. "The logs show it."

  "Doesn't matter," Mara said, standing up. "In program equilibrium, intent is irrelevant. Only provability exists. They made cooperation unprovable."

  She looked at the silent servers. The humans would argue about trust, about handshake deals and verbal assurances. But down here, in the silicon, there was only logic. And logic had a loophole: you don't have to break the proof to win. You just have to make it impossible for the other guy to find it.

  "Shut it down," Mara said. "And get me legal. We're suing for algorithmic sabotage."

  "On what grounds?"

  "On the grounds," Mara said, watching the red lights pulse like a slow heartbeat, "that they weaponized Gödel."
