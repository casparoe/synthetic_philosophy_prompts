      *   *Question:* Which argument's anthropic machinery is more fragile? Doomsday or Simulation?
      *   *Doomsday Fragility:* Depends heavily on the Reference Class. Who counts as a "human"? Future transhumans? Aliens? If the class is vague, the argument dissolves. Also, SIA kills it easily. It relies on a specific indexical fact (birth rank) which is sensitive to how you define the sequence.
      *   *Simulation Fragility:* Depends on the Reference Class *and* empirical assumptions about computing. But anthropically, it relies on the *ratio* of sims to originals.
      *   *Comparison:*
          *   Doomsday requires you to accept SSA *and* reject SIA. It requires a specific definition of "human" that extends into the future but stops before extinction. It's fighting against the "I exist" evidence.
