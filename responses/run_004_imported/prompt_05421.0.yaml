          1.  **Convergence:** SA is supported by *both* SSA and SIA (anthropic convergence). DA is supported by SSA and killed by SIA.
          2.  **Reference Class Stability:** DA requires a reference class that includes future humans but excludes aliens/sims/etc. This is unstable. SA requires a class that includes sims. If you accept functionalism (standard in LW), this is stable.
          3.  **Empirical vs Anthropical:** DA is purely anthropic. SA is anthropic + empirical. But focusing on machinery: DA's machinery is contradictory (SSA vs SIA). SA's machinery is consistent across frameworks.
