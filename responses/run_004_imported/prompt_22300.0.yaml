answer: |-
  **Title:** Invariance and Ignorance: Adjudicating Jaynes on Bertrand's Paradox

  **Introduction**

  For the practicing statistical physicist, the Principle of Maximum Entropy (MaxEnt) is less a philosophical proposition than a tool of the trade, as indispensable as the partition function. It works. Yet, as you have discovered in your retirement study, the philosophical scaffolding supporting this tool is far less stable than its empirical success suggests. The crux of the instability lies in the Principle of Indifference (PoI), the ancestor of MaxEnt, and its most famous stumbling block: Bertrand's chord paradox.

  E. T. Jaynes, in *Probability Theory: The Logic of Science* and his earlier paper "The Well-Posed Problem," attempted to rescue the PoI from the charge of inconsistency. He argued that Bertrand's paradox arises not from a defect in the principle, but from an ill-posed problem statement. By imposing a requirement of transformation group invariance, Jaynes claimed to derive a unique, objective prior. Critics, most notably Bas van Fraassen drawing on Richard von Mises, contend that this merely displaces the arbitrariness from the choice of parameter to the choice of symmetry group.

  This essay argues that Jaynes' defense is a qualified success. It succeeds brilliantly in rehabilitating the PoI as a methodological rule for *physical modeling*, where symmetries are objective features of the system. However, it fails to establish the PoI as a universal principle of *pure inductive logic*. The "defect" Bertrand exposed remains valid for epistemic probability in the absence of physical constraints, but this is a limitation of logic, not of Jaynes' method. For the physicist, Jaynes is vindicated; for the pure logician, the paradox stands.

  **I. Jaynes' Defense: Invariance as Objectivity**

  To understand the strength of Jaynes' position, one must recognize that he rejects the standard interpretation of Bertrand's paradox. The standard view holds that the PoI is contradictory because it yields different probabilities depending on whether one parametrizes the chord by its endpoints, its distance from the center, or its midpoint. Jaynes counters that this contradiction only exists if one treats probability as a measure of subjective ignorance regarding a purely mathematical abstraction.

  Jaynes insists that probability is always assigned relative to a specific problem statement, and if that statement describes a physical situation, it carries physical constraints. In "The Well-Posed Problem," he reframes the chord problem not as a geometric puzzle but as a physical experiment: a circle on the floor subjected to a "shower of straws."

  His argument proceeds via the **Principle of Transformation Groups**. If the problem statement does not specify the size of the circle, its position on the floor, or its orientation, then the probability distribution describing the chords must be invariant under translation, rotation, and scaling. Jaynes demonstrates mathematically that these three invariance conditions uniquely determine the distribution of chord midpoints. Specifically, the requirement of scale invariance forces the radial distribution of midpoints to fall off as $1/r$, which corresponds to Bertrand's "random radius" method and yields the probability $P = 1/2$.

  The strength of this argument is twofold. First, it renders the solution *unique*. Unlike the standard PoI applications where one can arbitrarily choose between uniform distributions in different coordinates, the group invariance constraints overdetermine the system, leaving only one mathematical solution. Second, it is empirically falsifiable. Jaynes reports that tossing straws onto a circle confirms the $1/2$ prediction.

  For the physicist, this is a powerful move. It transforms the PoI from a subjective rule ("I have no reason to prefer A over B") into an objective constraint ("The physical setup is invariant under rotation, so the distribution must be too"). It aligns probability theory with the rest of theoretical physics, where symmetry arguments (Noether's theorem, gauge invariance) dictate the form of physical laws. Jaynes argues that he has not repaired the PoI so much as revealed its true nature: it is a demand for consistency between the information given and the distribution assigned. If the information includes symmetry, the distribution must reflect it.

  **II. The Critique: The Ambiguity of Symmetry**

  The philosophical counterattack, led by Van Fraassen in *Laws and Symmetry*, targets the universality of Jaynes' claim. Van Fraassen grants that Jaynes' method works for the chord problem but argues that this is an artifact of the rich geometric structure inherent in Euclidean space. The critique posits that Jaynes has not solved the problem of indifference; he has merely hidden the arbitrary choice inside the selection of the transformation group.

  The canonical counterexample is von Mises' **water-and-wine problem**. Suppose a bottle contains a mixture of water and wine, and we know only that the ratio of water to wine is between $1/2$ and $2$. What is the probability that the ratio is less than $1$?
  1.  If we apply indifference to the ratio $r$ (water/wine), we get a uniform distribution on $[1/2, 2]$, yielding $P(r < 1) = 1/3$.
  2.  If we apply indifference to the reciprocal $1/r$ (wine/water), we get a uniform distribution on $[1/2, 2]$, yielding $P(r < 1) = 2/3$.

  Jaynes' transformation group method struggles here. What is the relevant symmetry group? One might argue for scale invariance (the units shouldn't matter), which leads to a logarithmic prior ($p(r) \propto 1/r$). But why is scale invariance the *correct* symmetry? In the chord problem, rotation and translation are physically obvious symmetries of the "circle on the floor." In the water-and-wine problem, the "symmetry" is purely linguistic or conceptual.

  Van Fraassen argues that Jaynes' requirement of invariance is itself a piece of additional information. By demanding scale invariance, Jaynes is effectively adding a premise to the problem that was not originally stated. If the problem is truly one of pure ignorance, we have no justification for imposing scale invariance any more than we have for imposing uniformity. Consequently, the "uniqueness" Jaynes claims is illusory; it is unique only relative to the *choice* of symmetry group, and that choice remains underdetermined by the problem statement.

  Furthermore, critics argue that Jaynes conflates *epistemic* probability (degrees of belief) with *ontic* probability (physical frequencies). The straw toss is a frequency experiment. If the straws are tossed by a human with a subconscious bias, the symmetry breaks, and the $1/2$ solution fails. If the problem is about what a rational agent *ought* to believe given limited information, the physical behavior of straws is irrelevant. By anchoring the solution in physical invariance, Jaynes solves the physical problem but abandons the logical one.

  **III. Adjudication: Logic vs. Modeling**

  To adjudicate this dispute, we must distinguish between two distinct projects: the foundations of *inductive logic* and the methodology of *physical modeling*.

  **1. The Failure for Pure Logic**
  If the goal is to establish the Principle of Indifference as a universal law of logic—a rule that dictates rational belief solely based on the syntax of propositions—Jaynes fails. Van Fraassen is correct that the selection of a transformation group is not logically compelled by the proposition "a chord is drawn" or "a mixture exists." The group selection relies on semantic content and contextual assumptions about what features of the description are "essential" versus "accidental."

  In the water-and-wine case, there is no physical "floor" or "throwing mechanism" to anchor the symmetry. The symmetry is a property of our description of the mixture, not the mixture itself. Therefore, Jaynes cannot claim to have resolved the paradox for all applications of the PoI. The defect Bertrand exposed—that continuous spaces allow for infinitely many parametrizations—remains a defect for *purely epistemic* applications of indifference. Logic alone cannot dictate a measure on a continuous space without additional structural premises.

  **2. The Success for Physical Science**
  However, if the goal is to provide a robust method for assigning priors in *scientific inference*, Jaynes succeeds decisively. In statistical physics, we are rarely dealing with pure logic; we are dealing with physical systems. When a physicist assigns a microcanonical ensemble, they are not expressing personal ignorance; they are asserting that the Hamiltonian dynamics possess certain ergodic or symmetry properties.

  Jaynes' great insight was to recognize that "well-posed" in science means "invariant under the irrelevant transformations." When we say a gas is in a box, we imply the physics doesn't change if we slide the box across the lab (translation) or rotate it. These are not linguistic conventions; they are physical facts. By encoding these facts into the prior via transformation groups, Jaynes turns the PoI into a tool for extracting objective consequences from physical symmetries.

  In this context, the water-and-wine problem is a category error. A physicist would not solve it by indifference; they would ask for the mixing mechanism. If the mixing is diffusive, the distribution follows from the diffusion equation. If it is a result of a specific pouring process, the distribution follows from the fluid dynamics. Jaynes' method tells us that if we *lack* that mechanical knowledge but *possess* symmetry knowledge, we use the symmetry. If we lack both, the problem is indeed ill-posed, and no amount of logical gymnastics should yield a definite number.

  **Verdict**

  The dispute between Jaynes and his critics turns on a category confusion regarding the domain of probability theory. Van Fraassen judges Jaynes by the standards of epistemology, where the goal is to define rational belief in the absence of physical facts. Jaynes judges himself by the standards of science, where the goal is to model physical systems consistently.

  **My verdict is this:** Jaynes has not rehabilitated the Principle of Indifference as a principle of *logic*, but he has successfully superseded it as a principle of *physics*.

  Bertrand's paradox does expose a defect in the classical PoI: it cannot generate information from ignorance in continuous spaces without arbitrariness. Jaynes does not repair this logical defect; he bypasses it by changing the input. He shows that we are never truly "ignorant" in physics; we always know the symmetries of the system. When those symmetries are known, the transformation group method yields a unique, objective prior that is not a matter of subjective whim.

  Therefore, the "defect" is not in Jaynes' method, but in the expectation that a logical principle should function without physical premises. For the statistical physicist, Jaynes is right: the $1/2$ solution is the correct one *for the physical problem of tossed straws*. The $1/3$ and $1/4$ solutions correspond to different physical mechanisms (e.g., fixing endpoints implies a different throwing mechanism than fixing midpoints).

  Van Fraassen is right that this does not save the PoI for the philosopher seeking a universal logic of uncertainty. But for the scientist, that is a irrelevant limitation. Jaynes demonstrated that what looks like subjective indifference is often objective invariance in disguise. He did not solve Bertrand's paradox; he dissolved it by showing it was never a logical paradox to begin with, but a modeling ambiguity. Once the model is specified (via the symmetry group), the paradox vanishes.

  **Conclusion**

  You need not trouble yourself over the philosophical foundations in your future reading, provided you remain within the domain of science. Jaynes' transformation group method is the correct formalization of how physicists actually reason about symmetry and ignorance. It does not provide a "free lunch" for epistemology, but it provides the rigorous scaffolding required for statistical mechanics. Bertrand's paradox stands as a warning against applying indifference to purely linguistic abstractions, but Jaynes' response stands as a testament to the power of symmetry in physical inference. The defect lies not in the tool, but in the attempt to use it without a physical object to work upon.
