  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  where S is the most defensible / hardest to knock down and D is basically a non-starter, and throw in a sentence or two per item on why it landed in that tier — that's exactly the part Dana and I couldn't agree on.
