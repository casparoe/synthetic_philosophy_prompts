answer: |-
  The chalk snapped in Elias's hand. It was the third piece in ten minutes.

  He didn't look down at the broken white stub on the floor. He was staring at the blackboard, specifically at the third line of the derivation. The room was cold, the kind of deep, academic chill that seeped through the cinderblock walls of the math building long after the heating system had cycled off.

  "It fits," Elias whispered. His voice sounded thin in the empty hallway outside. "It fits the decay rate within four decimal places."

  "You're talking to the wall again."

  Elias didn't jump. He knew the voice. Sarah leaned against the doorframe, holding two styrofoam cups. She stepped into the room, the smell of stale coffee cutting through the scent of limestone dust. She was a logician, sharp-edged and pragmatic, the kind of person who treated ontology like a tax audit.

  "Look at it, Sarah," Elias said, gesturing with the remaining half of the chalk. "I didn't force it. I started with the Riemann zeta function, moved through modular forms, and ended up with the mass of the top quark. I didn't put the quark in there. It came out."

  Sarah set the coffee on a desk piled high with journals. She walked to the board, squinting. "You started with axioms you chose. You applied rules of inference we agreed upon. You got a result. It's a calculation, Elias. Not an excavation."

  "It feels like an excavation." He rubbed his eyes. They burned. "It feels like I walked into a dark room, tripped over a chair, and realized the chair was made of gold. It was there before I turned on the light."

  "That's the feeling," Sarah said, turning to face him. "That's the dopamine hit. It's the same feeling a poet gets when a rhyme clicks. Does that mean the rhyme existed in the void before the poet was born?"

  "This isn't poetry. It predicts physical reality."

  "Newtonian physics predicted reality for two hundred years," Sarah countered. "Was gravity a Platonic form waiting in the ether? Or was it a useful model that broke down when we looked too close? You're conflating *utility* with *existence*."

  Elias turned back to the board. The white symbols glowed against the black. "If it's just a model, why is it so constrained? Why can't I just decide that prime numbers end at a million? Why does the structure resist me? When I try to write something false, the logic jams. It pushes back. You don't feel resistance from a fiction."

  "You feel resistance from consistency," Sarah said. She walked up beside him, close enough that he could see the reflection of the equation in her glasses. "If you're playing chess, you can't move the rook diagonally. Not because the rook is a real object with physical properties, but because you agreed to the rules of chess. Math is the ultimate game of internal consistency. The resistance you feel is just the boundary of your own definitions."

  "So the top quark is a rule of chess?"

  "The *math* describing the top quark is the game. The quark is real. The equation is the map."

  Elias laughed, a dry, brittle sound. "This is the problem. You want to say the map is just ink. But how did I draw the map so perfectly without ever seeing the terrain? I'm sitting in a room in Princeton. The quark is in a collider in Geneva. There's no causal link. No light bounces off the quark and hits my retina. No signal travels from the abstract structure to my neurons."

  He tapped his temple. "So how did this get in here? If these objects are abstract, if they're outside space and time like you Platonists claim, then they're causally inert. They can't *do* anything. They can't push information into a human brain."

  Elias froze. He looked at her. "Wait. You're arguing the Platonist side?"

  "I'm arguing Benacerraf," Sarah corrected. "I'm pointing out the gap. If you insist these numbers exist independently of us, in some magical realm of Forms, then you have to explain the mechanics of the connection. How does your physical brain, made of meat and electricity, interact with a non-physical, timeless object? It's magic, Elias. It's spooky action at a ontological distance."

  Elias picked up a fresh piece of chalk. He held it tight. "Maybe 'interaction' is the wrong word. Maybe it's… recognition."

  "Recognition implies the thing is there to be recognized."

  "It *is* there!" Elias slammed the chalk against the board. A cloud of white dust puffed into the air between them. "I didn't invent the primes. I found them. They were waiting. That feeling I had in the lab? When the data came in and it matched the derivation? It wasn't satisfaction. It was relief. Like I'd finally remembered something I'd forgotten."

  Sarah sighed. She picked up her coffee, wrapping her hands around the warmth. "Or, it was evolution. We evolved in a physical universe. Our brains developed pattern-recognition software to help us not get eaten by tigers. Math is just that software running on high gear. We project structure onto the universe because we are structured to see it. The 'fit' isn't because the math is out there. It's because we built the math to fit the only world we could survive in."

  "That's circular."

  "It's naturalism."

  They stood in silence. The dust from the chalk hung in the air, suspended in the beam of the overhead projector light. Tiny particles, drifting without direction.

  "If you're right," Elias said softly, "then I'm alone in here. I'm just talking to myself. Echoes in a cave."

  "If I'm right," Sarah replied, "then you're safe. You're just a human doing human things. No ghosts required."

  "But the equation works."

  "Useful fictions work. 'The sun rises' works. It gets you up in the morning. It doesn't mean the sun moves."

  Elias looked at the board. The symbols seemed to vibrate, or maybe it was just the fatigue. He felt the terrifying pull of the Platonist void—the idea that he was a mere vessel for a truth that didn't care about him. But then he looked at his hand, stained white with chalk dust. Physical. Messy. Temporary.

  "If I erase this," Elias said, his hand hovering over the bottom corner of the board, "does it cease to exist?"

  Sarah watched his hand. "If you erase it, the information is gone from this substrate. But the logical relationship remains consistent within the system we share. Until we forget the system."

  "So it depends on us."

  "It depends on *minds*," she said. "Not necessarily yours. Not necessarily human. But somewhere. A truth without a mind to hold it is just… noise."

  Elias lowered his hand. He didn't erase it.

  "I don't know how I know it," he said, his voice barely audible. "I don't know how the connection happens. But I know I didn't make it up. I know that if I died tonight, this truth would still be true. Even if there was no one left to check it."

  Sarah took a sip of her coffee. She looked at the board, then at Elias, then back to the board. For a second, her pragmatic mask slipped, and she looked almost afraid.

  "Then prove it," she said quietly. "Without using the logic that assumes it exists."

  Elias smiled, a tired, crooked thing. "I can't."

  "Then drink your coffee, Elias. It's getting cold."

  She turned and walked to the door. She didn't turn off the light. Elias stood alone in the room with the equation. He reached out and touched the board, his fingertips grazing the cold, hard surface where the chalk lay. It felt solid. It felt real.

  But when he pulled his hand away, there was no dust on his fingers. He looked down, confused, then looked back at the board. The dust was still there, hanging in the light, drifting slowly toward the floor.

  He couldn't tell if he had wiped it off, or if he had never touched it at all.
