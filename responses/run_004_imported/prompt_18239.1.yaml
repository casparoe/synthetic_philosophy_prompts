      *   *Check on Ghazālī:* Did he deny *all* efficacy? Yes, in the *Tahāfut*. In later works (*Iḥyāʾ*), he softens slightly regarding secondary causes, but for the *Tahāfut* argument, it's strict occasionalism. Stick to the *Tahāfut* context provided by the user.
      *   *Check on Hume:* Did Hume deny causal powers? He denied we have an *idea* of them derived from impression. He left open the possibility of "secret powers" but deemed them unknowable.

