      *   *Custom (ʿāda vs. Habit):* Ghazālī's *ʿāda* is *ontological*. It's how God actually runs the universe. It's objective regularity. Hume's custom is *psychological*. It's how humans *expect* the universe to behave. It's subjective expectation.
