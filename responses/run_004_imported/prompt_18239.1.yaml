          *   *Causation:* What we call "cause and effect" is actually two distinct events created directly by God in temporal succession.
          *   *Connection:* The connection is not necessary (*ḍarūra*) but habitual (*ʿāda*). God *could* break the habit (miracle, e.g., Abraham in the fire).
          *   *Epistemology:* We observe conjunction, not connection. But the regularity is objective (grounded in God's will), not just subjective.
          *   *Goal:* Theological (protecting divine omnipotence and sovereignty against Neoplatonic/Aristotelian necessitarianism).

      *   **David Hume (Empiricist Skepticism):**
          *   *Metaphysics:* Agnostic/Secretive about ultimate powers. We cannot know if there are real powers or not.
          *   *Causation:* We observe constant conjunction. We never perceive a "necessary tie."
          *   *Connection:* The idea of necessity is a projection of the mind (custom/habit) resulting from repeated observation.
          *   *Epistemology:* Skeptical about induction's rational justification (Problem of Induction), but naturalistic about our reliance on it (we can't help but believe).
