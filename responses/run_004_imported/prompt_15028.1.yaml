      Fact: In 1913 (with Grossmann), Einstein believed the Hole Argument proved generally covariant equations were *impossible* (because they allowed indeterminism). He adopted the Entwurf equations which were *not* generally covariant specifically to avoid this. In 1915, he realized the Hole Argument only works if you assume substantivalism, so he accepted GC.
