      *   *Wait, a nuance:* Rawls focuses on the *Supreme Court* and *National Political Discourse*. *Dobbs* moved it to states. Rawls might argue state legislatures are still bound by public reason regarding constitutional essentials (which he might argue include bodily autonomy).
      *   *Decision:* The post-*Dobbs* landscape makes the Integralist charge *easier to articulate* (because the mask of neutrality slipped) but *easier for a Rawlsian to identify the specific failure* (violation of the duty of civility). However, it makes the *practical rebuttal* harder because the institutional guardrails (SCOTUS) were removed. I need to balance this. Actually, the prompt asks if it makes the charge harder/easier to *rebut*.
