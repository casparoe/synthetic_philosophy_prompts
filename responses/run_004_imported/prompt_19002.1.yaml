      *   *Overlapping Consensus:* Different reasonable doctrines support the political conception for their own internal reasons.
      *   *Rawls on Abortion:* He argued that a reasonable balance of political values (life, order, equality) *cannot* support a total ban on early abortion. Therefore, a doctrine demanding such a ban is unreasonable.

  3.  **Address Point 1: *Dobbs* and State Bans:**
      *   *The Situation:* *Dobbs* returned the issue to states. Many bans are explicitly theological (ensoulment at conception).
