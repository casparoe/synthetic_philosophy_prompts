      *   *Better Angle:* The Integralist charge is that Public Reason *itself* excludes religion unfairly. Post-*Dobbs*, religion entered the arena successfully. This suggests Public Reason was *not* as exclusionary as Integralists claimed (since religion won). This actually *weakens* the Integralist grievance that they are silenced. They weren't silenced; they won. But in winning, they violated Rawls's criteria for reasonableness. So, for a Rawlsian, it's easier to point and say "That is exactly what we warned against." But it's harder to maintain that the *system* prevents this.
      *   *Final take on this:* It makes the Integralist *description* of reality more plausible (politics is always theological), but it makes the Rawlsian *normative* critique sharper (this is why we need public reason). The Integralist charge that Rawlsianism is "covertly substantive" is actually *easier* to rebut because the substantive nature of the anti-abortion position is now overt, not covert. The "neutrality" wasn't the problem; the abandonment of public reason was.

