answer: |-
  This is one of the most famous and notoriously difficult cruxes in the history of logic, so your confusion is entirely warranted. You have identified the exact tension that has divided commentators for centuries: the transition from a modal distinction (about necessity) to a semantic claim (about truth-values).

  You are also right to be wary of the Edghill translation (1889). It is public domain and widely available, but it is often imprecise with Aristotle's modal and semantic terminology. Specifically, the phrase "actually true or actually false" in the final sentence obscures a crucial Greek distinction regarding *definiteness*.

  Here is a reconstruction of the argument structure, an explanation of how the pieces fit together, and an evaluation of your friend's "three-valued logic" reading.

  ### 1. The Metaphysical Anchor: Deliberation and the Coat
  You asked what work the material about deliberation and the coat is doing. It is doing the **heavy lifting**.

  Aristotle is not starting from logic and moving to metaphysics; he is starting from metaphysics (and common sense) and constraining logic to fit it.
  *   **The Datum:** Deliberation is effective. We deliberate only about things that are "up to us" (within our power to do or not to do). If the future were already fixed (fatalism), deliberation would be causally inert and pointless.
  *   **The Coat Example:** This illustrates *real potentiality*. A coat has the potential to be cut *and* the potential to wear out. These are contradictory outcomes. If it is *already true* that the coat will be cut, then the potential to wear out is illusory.
  *   **The Inference:** For deliberation to be meaningful and for potentiality to be real, the future must be **ontologically open**. There is no fact of the matter *now* that makes one outcome obtain rather than the other.

  This establishes the metaphysical premise: **For contingent future events, reality is indeterminate.**

  ### 2. The Modal Distinction (The Scope Point)
  You correctly identified the modal point in the third paragraph as a scope distinction. Aristotle distinguishes between:
  1.  $\square (P \lor \neg P)$ : It is necessary that (either the sea battle happens or it doesn't).
  2.  $\square P \lor \square \neg P$ : Either it is necessary that the battle happens, or it is necessary that it doesn't.

  Aristotle accepts (1) (The Law of Excluded Middle holds for the disjunction) but rejects (2) for contingent matters.

  **Why is this not enough?**
  As you noted, a standard bivalent logician can accept this distinction. In modern modal logic (e.g., system T or S5), one can hold that $P$ is true now, but not *necessarily* true. So, why does Aristotle feel licensed to make the stronger semantic claim in the final paragraph?

  This is where the **Correspondence Theory of Truth** bridges the gap.

  ### 3. The Bridge: From Metaphysics to Semantics
  Aristotle operates with a robust correspondence theory: a statement is true if it says of what is that it is, and of what is not that it is not (*Categories* 12b11, *Metaphysics* 1011b25). Truth depends on reality.

  *   **Premise 1:** Truth is determined by how things stand in the world.
  *   **Premise 2:** For future contingents, things do not yet stand determinately one way or the other (established by the coat/deliberation argument).
  *   **Conclusion:** Therefore, statements about future contingents cannot be *determinately* true or false.

  This is the missing link in your reconstruction. The modal distinction ($\square(P \lor \neg P)$ vs $\square P$) shows that the *necessity* doesn't hold. But the semantic claim ("not actually true") follows from the **ontological indeterminacy**. If the world hasn't "decided" yet, the proposition cannot correspond to a decided fact.

  **The Translation Issue:**
  In the Edghill translation, the text says: *"One of the two propositions... must be true and the other false... It cannot be either actually true or actually false."*
  This looks like a contradiction. How can one be true, but neither be true?

  The Greek here turns on the word *horismenōs* (definitely/determinately). A more precise rendering of the final sentence would be: *"It is not necessary that one be **definitely** true and the other **definitely** false."*

  Aristotle is distinguishing between:
  1.  **The Law of Excluded Middle (LEM):** $(P \lor \neg P)$ is always true. (Aristotle keeps this).
  2.  **The Principle of Bivalence (PB):** Every proposition is *definitely* True or *definitely* False. (Aristotle qualifies this for future contingents).

  He is arguing that while the disjunction is true, neither disjunct has a *definite* truth value *yet*. They are "indefinitely" true or false.

  ### 4. Evaluating the "Three-Valued Logic" Reading
  Your friend's suggestion that this is a proto-three-valued logic (à la Jan Łukasiewicz, 1920) is a very common interpretation, but it is historically anachronistic and perhaps too strong.

  *   **Arguments for the Friend's View:** It captures the intuition that Aristotle wants to block the inference from "It is true that P" to "P is necessary." If $P$ has no truth value (or a third value "Possible"), then fatalism is blocked.
  *   **Arguments Against:** Aristotle explicitly says, *"One of the two propositions in such instances must be true and the other false."* He does not want to say the statement is *neither* true nor false in the sense of a truth-value gap that violates LEM. He wants to say the truth is *indeterminate*.

  A more defensible reading is not that Aristotle invents a third truth-value, but that he **temporalizes truth**.
  *   For past and present statements: Truth is definite (the fact is fixed).
  *   For future contingent statements: Truth is indefinite (the fact is not fixed).

  So, it is not that the proposition lacks a truth value entirely; it is that it lacks a *settled* truth value. It is "true that P-or-not-P," but not "true that P" and not "true that not-P" in a way that settles the matter.

  ### 5. Reconstructing the Argument Structure
  To answer your specific request for how the pieces fit, here is the reconstructed syllogistic flow of the passage you provided:

  1.  **Metaphysical Premise:** Some future events are contingent (evidenced by the efficacy of deliberation and the dual potentiality of objects like the coat).
  2.  **Ontological Claim:** If an event is contingent, there is no present fact that makes one outcome obtain rather than the other. Reality is open.
  3.  **Semantic Principle (Correspondence):** Propositions derive their truth-value from existing facts.
  4.  **Intermediate Conclusion:** Therefore, propositions about contingent future events cannot correspond to a definite fact.
  5.  **Modal Clarification:** We must distinguish between the necessity of the disjunction (which holds) and the necessity of the disjuncts (which does not hold for contingents).
  6.  **Final Semantic Conclusion:** Consequently, while one of the contradictories *will* turn out true, neither is *now* determinately true or false. (This blocks the Fatalist inference that "If it is true now, it is necessary.").

  ### Summary Advice for Your Seminar
  You are right to feel that the move from the modal point to the semantic point is not a formal logical deduction. It is a **metaphysical constraint on semantics**.

  *   **On the Scope Distinction:** You are correct that the scope distinction alone ($\square(P \lor \neg P)$) does not force a rejection of bivalence. Aristotle needs the metaphysical premise about "potentiality in either direction" to motivate the semantic qualification.
  *   **On the Friend's View:** Tell your friend that while the three-valued logic reading is a useful heuristic for modern logicians, it risks making Aristotle sound like he is violating the Law of Excluded Middle, which he explicitly says he is *not* doing ("One... must be true"). The "indefinite truth" reading is more textually faithful.
  *   **On the Translation:** If you can, check the Ackrill translation (Oxford Clarendon) or the Whitaker commentary. They handle the *horismenōs* (definitely) distinction much better than Edghill, which will make the final paragraph much less contradictory.

  Aristotle is essentially arguing that **logic must not outrun ontology.** If the world is open, our logic must allow for openness, even if that means qualifying how we apply "true" and "false" to future statements. He is saving the phenomenon of human agency by limiting the scope of logical determinism.
