answer: |-
  The atrium of the philosophy building was thick with the hum of post-talk conversation and the clinking of cheap wine glasses. Elena, a staunch Lewisian, leaned against a pillar, eyeing the cheese tray. Marcus, who had just finished defending a Kripkean account of rigid designation in the colloquium, approached her with a plastic cup in hand.

  **Marcus:** "Elena. I enjoyed the defense of concrete modal realism. Truly. But I have to ask: did you address Humphrey? Because from where I was sitting, it looked like you changed the subject entirely."

  **Elena:** "Marcus. I was wondering when you'd bring up Kripke's old chestnut. The claim that on my view, Humphrey doesn't care whether he wins, because it's only a *counterpart* who wins?"

  **Marcus:** "Exactly. When we say 'Humphrey could have won,' we mean *Humphrey*. The very man. If your theory makes the truth of that sentence depend on some other guy in a spatiotemporally isolated universe winning an election there, you've lost the *de re* modality. Humphrey has no stake in the fortunes of a mere resembling stand-in."

  **Elena:** "But consider the metaphysics you're committed to, Marcus. On your view, Humphrey is numerically identical to a Humphrey in another world. But that other Humphrey is still causally isolated from this one. He's in a different possible world. So, why does *this* Humphrey—the flesh and blood one standing in the atrium—have any more stake in the welfare of a causally disconnected, numerically identical self than he does in a counterpart?"

  **Marcus:** "Because it *is* him. It's not a matter of causal connection; it's a matter of identity. If I say 'I could have been late,' I'm talking about *me* being late in another scenario. Not someone else."

  **Elena:** "But think about the semantics versus the phenomenology. Ordinary speakers don't think in terms of transworld identity either. They don't conceive of 'worlds' as abstract stipulations or concrete universes. They just talk. The fact that they don't explicitly think 'counterpart' isn't evidence that the truth conditions of their claims aren't counterpart-theoretic. We analyze the truth conditions, not the psychological accompaniment. And regarding the 'stake': if the transworld Humphrey is causally isolated, the emotional connection is equally mysterious on your view. You're asking me to believe Humphrey cares about a disconnected duplicate more than I do. I find that parity compelling."

  **Marcus:** "The parity isn't there. The connection is logical, not causal. Rigid designation picks out the object directly. I don't need a similarity relation to bridge the gap. I just stipulate: *this* object, Humphrey, in world W."

  **Elena:** "Ah, but that stipulation is where the cracks show. Let's press on that 'direct pick-out.' Consider Chisholm's paradox. Imagine a chain of possible worlds. In W1, Humphrey has a specific mole. In W2, he lacks the mole but is otherwise identical. In W3, his hair is slightly different. In W4, he's an inch taller. We continue this chain of minute qualitative changes across a thousand worlds until, in W1000, the individual is qualitatively indistinguishable from, say, Hubert Humphrey's worst enemy. Is the individual in W1000 still Humphrey?"

  **Marcus:** "If the chain preserves identity at every step, then yes. Transworld identity is transitive."

  **Elena:** "So Humphrey is identical to someone who is qualitatively his enemy? That seems absurd. But if you say 'no,' you have to identify a cut-off point. At which world does Humphrey cease to be Humphrey? If there's no qualitative fact that determines this, what does? It looks like you're forced to admit that identity across worlds actually depends on degrees of similarity. You're smuggling in a counterpart relation but refusing to call it one to avoid the vagueness."

  **Marcus:** "Not at all. You're assuming that identity must be grounded in qualitative properties. That's the Humean bottleneck you're stuck in. I appeal to non-qualitative individual essences. Haecceities. Humphrey possesses a primitive 'thisness' that persists across all worlds where he exists. It doesn't matter how much he changes qualitatively; as long as he instantiates *Humphrey-hood*, he is Humphrey. The cut-off isn't vague; it's determined by his essential properties, which might be very sparse. Perhaps the only essential property is 'originating from this specific sperm and egg.' Beyond that, he can change into the enemy qualitatively, but he remains Humphrey numerically."

  **Elena:** "Haecceities. The metaphysical magic dust. You're positing a property that does no explanatory work other than to save the intuition of transworld identity. It's an occult quality. And frankly, it doesn't solve the problem of *which* individual in W1000 has that haecceity. If the world contains a person who is qualitatively the enemy, how do we know *he* has Humphrey's haecceity rather than the enemy's? You can't point to it. You can't describe it. You're asking us to accept a brute fact of identity that is entirely detached from how the world is qualitatively."

  **Marcus:** "And you're asking us to accept that 'Humphrey' doesn't refer to Humphrey in modal contexts! Your theory saves qualitative grounding at the cost of direct reference. You say 'Humphrey could have won' is true because *someone else* won. I say that's a revision of our modal discourse. As for haecceities, they aren't magic; they're the recognition that objects are not merely bundles of properties. That *I* am *me* is not a qualitative fact. It's the precondition for having properties at all. If you deny that, you can't make sense of quantification into modal contexts without collapsing into descriptivism."

  **Elena:** "I don't deny we quantify. I just analyze the quantification differently. 'There is a world W and an individual x in W such that x is a counterpart of Humphrey and x wins.' It's clean. It avoids the mystery of how one concrete particular can be wholly present in two causally isolated locations. Your view requires Humphrey to be multiply located across logical space, which is just as weird as my concrete worlds, but without the explanatory payoff of reducing modality to actuality."

  **Marcus:** "Multiple location is only weird if you think of worlds as concrete containers like boxes. If worlds are abstract ways things could be, there's no problem with Humphrey being 'in' more than one way. But look, Elena, we're at an impasse. You think my haecceities are obscure magic. I think your counterpart relations are an arbitrary substitute for genuine identity that fails to capture the *de re* necessity we intuitively grasp."

  **Elena:** "Perhaps. But I'd rather have an arbitrary similarity metric than a primitive thisness that tells me Humphrey could have been a poached egg, provided he kept his 'Humphrey-hood.'"

  **Marcus:** (Laughs) "He couldn't have been a poached egg. That violates his essence. But I suppose you'll say 'essence' is just a rigidified counterpart relation?"

  **Elena:** "I think I will. Cheers, Marcus."

  **Marcus:** "Cheers, Elena. Same time next colloquium?"

  **Elena:** "Only if you talk about actualism."

  They clinked plastic cups, the disagreement hanging between them as solid as any possible world.
