answer: |-
  The screen hummed with the quiet, blue light of a cyclotron monitor, though the machine itself had been dismantled a decade ago. Elias, retired and rheumatic, sat before the modal interferometer he'd built in secret during his final years at the lab. It didn't show matter; it showed possibility.

  On the display was World W-892. In W-892, the containment valve hadn't stuck. In W-892, Sarah was still alive.

  Elias leaned forward, his breath hitching. This was the moment thirty-five years of experimental rigor had led to: not a discovery of particles, but of paths. He needed to know something specific, something the physics couldn't answer. He needed to know if the man on the screen was *him*.

  In W-892, the man standing over the safe reactor wore Elias's face. He had the same scar on his chin, the same receding hairline. He was celebrating with Sarah. But as Elias watched, the man turned, and the light caught his eyes. They were green. Elias's eyes were brown.

  "Similarity metric: 94%," the computer readout stated.

  Elias slumped back. This was the Humphrey problem. David Lewis would say this was merely a counterpart. A distinct individual, world-bound, who resembled Elias closely enough to stand in for him in modal propositions. If Lewis was right, the man celebrating with Sarah wasn't Elias. He was a stranger who shared Elias's history up to a point.

  But Saul Kripke would argue for genuine transworld identity. For Kripke, 'Elias' was a rigid designator. If this was a possible world, then that *was* Elias, just in different circumstances. The green eyes were an accidental property, not an essential one. If Kripke was right, then Elias *had* saved Sarah. Somewhere, in the fabric of reality, he was a hero.

  The distinction wasn't academic. It was the difference between absolution and damnation.

  If Kripke was right, Elias's guilt here was contingent. He *could* have done otherwise, because he *did* do otherwise. The failure here was a glitch in the specific actualization of his identity. He could tell Sarah's family, "I didn't have to let you die. I am capable of saving you."

  If Lewis was right, the man on the screen was a different entity. That man's virtue belonged to him, not to the Elias sitting in this dim study. The success in W-892 proved nothing about *this* Elias's capacity. It only proved that a similar person in a similar situation made a different choice. To claim that success was to commit a category error.

  Elias tapped a command into the console. "Expand counterpart search. Context: Professional Competence."

  The screen flickered. The image of the green-eyed Elias dissolved. Now there were three images.

  In the first, the valve didn't stick, and Sarah lived. (Similarity: 94%)
  In the second, the valve stuck, but Elias manually overridden it and got radiation poisoning, surviving but crippled. (Similarity: 91%)
  In the third, Elias never took the job at the lab. He became a teacher. Sarah lived because she was never in the lab. (Similarity: 85%)

  Elias rubbed his temples. This was the bonus complication Lewis had warned about. The counterpart relation wasn't unique. It was context-dependent. Who counted as "Elias" depended on what properties you cared about.

  If the context was "biological continuity," the green-eyed man was the best fit. If the context was "moral agency," the crippled man who tried to override the valve was a better counterpart. If the context was "life trajectory," the teacher was the strongest match.

  "So which one is me?" Elias whispered to the empty room.

  If he chose the teacher, then the accident never happened to *him*. He was off the hook entirely; the Elias who killed Sarah was a counterpart who took a different job.
  If he chose the crippled man, then he was a hero who tried, even if he failed here.
  If he chose the green-eyed man, he was a success elsewhere.

  But choosing felt like cheating. It felt like shopping for a self to fit the narrative he wanted to survive.

  He thought about the letter he was drafting to Sarah's daughter. *I want you to know,* he had written, *that I could have saved her.*

  Was that true?

  Under Kripke, yes. It was a statement about *him*, across worlds.
  Under Lewis, no. It was a statement about a counterpart. To say "I could have" was shorthand for "Someone like me did."

  Elias looked at his hands. They were spotted with age, stained with decades of solder and oil. These hands had turned the wrong valve. These hands were here.

  He realized then that the desire for transworld identity was a desire to escape the tyranny of the actual. Kripke's view offered comfort: you are spread out across the multiverse, your essence diluted across many outcomes. Your failures are never total because somewhere, you succeeded.

  But Lewis's view was isolating. You are here. You are now. You are this specific collection of matter and history. If you fail here, you fail. The success of a counterpart is no more yours than the success of your brother or your clone.

  The screen flickered again. The green-eyed man was laughing, hugging Sarah. It was a beautiful thing to witness. It was also irrelevant.

  Elias reached for the keyboard. He didn't shut the machine down. Instead, he opened the document containing the letter to Sarah's daughter. He highlighted the sentence: *I could have saved her.*

  He paused. If he kept it, he was invoking Kripke. He was claiming a identity that stretched beyond this world. He was borrowing virtue from a stranger who happened to look like him.

  He deleted the sentence.

  He typed: *In another possibility, a man like me saved her. But I am not that man. I am the one who was here.*

  It was the Lewisian confession. It accepted that the counterpart relation was merely similarity, and that similarity did not transfer moral credit. The guilt didn't transfer from this world to the other, but neither did the redemption transfer from the other to this.

  He looked back at the screen. The three counterparts shimmered. The teacher, the hero, the survivor. They were all ghosts. They were all *other*.

  Elias felt a strange, cold clarity. The regret was heavier now. It wasn't the light regret of "things could have been different," which implies a stable self navigating different branches. It was the heavy regret of "I am the thing that happened." There was no broader self to absorb the shock. There was only this world-bound object, defined entirely by its actual properties.

  He hit print. The paper slid out, warm and final.

  He walked over to the modal interferometer and pulled the main fuse. The screen went dark. The counterparts vanished. There was no longer any data to interpret, no context to select. There was only the room, the dust motes dancing in the light, and the silence of a single, unbranching timeline.

  Elias sat back down. He was not the man who saved Sarah. He was not the man who never took the job. He was the man who sat here, alone, with the letter. And for the first time in thirty years, he knew exactly who that was.
