      *   **Key Point 2: Feature Selection as Class Selection.** Choosing which inputs to feed the algorithm is exactly choosing the reference class. Is "genetic marker X" more relevant than "zip code"? That's a philosophical/causal judgment, not just a data one.
      *   **Key Point 3: Overfitting/Spurious Correlation.** With enough dimensions, everyone is unique. The model might latch onto noise. The "class" becomes "people who look exactly like this in this specific dataset," which doesn't predict the future.
