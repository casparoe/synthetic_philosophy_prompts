          *   Settlement: Must be "void if false," not "true if false."
          *   Truth Conditions: They don't have classical truth conditions, but they have *assertibility* conditions.
      *   **Conclusion:** It's a semantic puzzle, not a decision-theoretic crisis. Keep betting, just clarify the void rule.

  7.  **Final Polish:** Check for clarity, tone, and specific answers to the user's prompts. (Ensure I explicitly answer "does it mean our conditional bets don't really have determinate truth conditions" and "should that change how we actually price and settle them".)

      *(Self-Correction during drafting)*: Wait, I should mention that some frameworks (like McGee or Bradley) try to save propositional status by changing the probability logic, but that's probably too deep for a practical betting question. Stick to the standard "Suppositional Theory" (Edgington/Adams) as the practical solution.

      *(Final check on Lewis)*: Lewis's 1976 paper "Probabilities of Conditionals and Conditional Probabilities". Yes. The result is that no probability function can satisfy the equation for all pairs of propositions in a non-trivial algebra.

