prompt: |-
  So my school's philosophy club (its basically me and eight other people who eat lunch in the same room every Thursday) is hosting a guest speaker for a whole-school assembly next week, and somehow I got picked to do the intro and interview part on stage, which is terrifying. The guest is finishing her PhD at the university down the road and works on philosophy of time, and our teacher says her whole thing is defending a modern version of the "open future" answer to Aristotle's sea battle problem — the actual one from De Interpretatione ch. 9 that we read in class, where he gets stuck on whether "there will be a sea battle tomorrow" is true or false today. Her version basically says a claim like that isn't true (or maybe isn't true or false, I'm honestly still fuzzy on which) until it's actually settled, which is supposed to protect the future from being secretly fixed already. I don't want to waste her time up there just having her restate the view for ten minutes while people check their phones — I want questions that actually push on it.

  Could you write me like 8-10 interview questions, each with a quick follow-up based on what she'd probably say back (like a good podcast host would do)? Specific stuff I want hit: one question on whether her view proves too much, since we obviously want to say "the sun will rise tomorrow" or "there's an eclipse on this exact date" is just true right now — does she need some exception for "physically settled" future stuff, and doesn't carving out exceptions get messy fast. One on the thing I keep getting stuck on myself: after the sea battle actually happens, don't we want to say "okay, that prediction WAS true the whole time" — so is she just letting truth back in through the back door once the event occurs, and if not, what was the actual status of the old claim, looking back on it now. One that makes her compare her view to the other classic fix, I think its called supervaluationism, where "there will be a battle or there won't" gets to come out true even though neither half does on its own — basically why go all the way to no-truth-value instead of that more careful move. And I found this paper, I think it was called something like "Back to the Open Future," that says the gap is a real gap in the world and not just us being undecided about what the sentence means — can you fit in a question pressing on whether that "the world itself is indeterminate" idea even makes sense, since I vaguely remember reading that vague objects in reality run into way worse problems than vague language does.

  Also, since half the audience has never heard any of this before today, could you mark which questions need like one sentence of setup before I actually ask them, so I'm not the person who loses the whole gym in jargon thirty seconds in.
