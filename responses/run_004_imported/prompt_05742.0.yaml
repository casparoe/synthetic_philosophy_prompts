answer: |-
  This is a fantastic opportunity. Honestly, the fact that you're worried about "boring the gym" means you're already going to do better than 90% of student moderators. The key to a good philosophy interview is to treat the speaker like a collaborator in solving a puzzle, not just a lecturer.

  Here are 8 main questioning "beats," each with a follow-up strategy based on how she'll likely respond. I've marked the ones that need a **one-sentence setup** so the audience doesn't get lost in jargon.

  ### 1. The Hook: Aristotle's Sea Battle
  **[NEEDS SETUP]**
  **You:** "For the people in the back who didn't read *De Interpretatione* this morning: Aristotle worried that if 'There will be a sea battle tomorrow' is true *right now*, then the future is already fixed like the past. You defend the 'Open Future' view where that statement isn't true yet. But does that mean it's *false*, or just... nothing?"
  **Likely Answer:** She'll say it's neither true nor false (a truth-value gap) until the event happens.
  **Follow-up:** "So if I bet you five dollars today that there will be a battle, and you take the bet, are we betting on something that doesn't exist yet?"

  ### 2. The "Proves Too Much" Objection (Eclipses)
  **[NEEDS SETUP]**
  **You:** "I can predict a solar eclipse in 2050 with perfect accuracy using physics. If the future is 'open,' is that prediction true today? Or do you have to carve out an exception for things determined by laws of nature?"
  **Likely Answer:** She will likely admit that physically necessitated events (like eclipses) *are* true now, while human actions are not.
  **Follow-up:** "But isn't drawing that line messy? If a weather forecast is 99% sure it rains, is that 'settled' like an eclipse, or 'open' like a sea battle? Where do you draw the threshold?"

  ### 3. The Retroactive Truth Problem
  **You:** "This is the thing that keeps me up at night. Let's say tomorrow there *is* a sea battle. Looking back from next week, don't we want to say your prediction yesterday *was* true? Or are you saying it was 'nothing' yesterday and only becomes true today?"
  **Likely Answer:** She might say it *becomes* true retroactively, or that we can say "It was settled" without saying "It was true."
  **Follow-up:** "If the truth value changes from 'nothing' to 'true' just because time passed, doesn't that make truth unstable? I always thought if a statement is true, it's *always* been true."

  ### 4. The Supervaluation Alternative
  **[NEEDS SETUP]**
  **You:** "There's a rival theory called **supervaluationism**. Basically, it says 'Either there will be a battle or there won't' is definitely true today, even if we can't say which half is true. Why reject that? Why not keep logic safe and just say we're ignorant of the truth value?"
  **Likely Answer:** She'll argue that supervaluationism saves logic but loses the "openness" of the future, or that it's too technical/unnatural.
  **Follow-up:** "But if your view breaks the law of excluded middle—that 'A or not-A' might not be true—aren't you breaking the basic rules of logic just to save the idea of an open future?"

  ### 5. Metaphysical Indeterminacy (World vs. Language)
  **You:** "I was reading a paper, maybe 'Back to the Open Future,' that argues this gap isn't just about our language being vague. It says the *world itself* is indeterminate. Does that actually make sense? Can reality be fuzzy, or is fuzziness just in our descriptions?"
  **Likely Answer:** She will likely defend "metaphysical indeterminacy," arguing the future literally hasn't been written yet.
  **Follow-up:** "Philosophers usually say 'vague objects' in reality lead to huge paradoxes. Are you worried that by making the *world* vague, you're solving a logic problem by creating a metaphysics nightmare?"

  ### 6. The "Settled" Criteria
  **You:** "You use the word 'settled' a lot. A future is open until it's settled. But who or what does the settling? Is it the event itself, or is it when an observer sees the event?"
  **Likely Answer:** She'll say it's the event occurring, not the observation (avoiding idealism).
  **Follow-up:** "So if a tree falls in the forest and no one is there to call it 'true,' does the proposition 'The tree fell' still lack a truth value until someone checks?"

  ### 7. Free Will and Agency
  **You:** "Most people care about this because they care about free will. If the future is open in your specific sense—where statements aren't true yet—does that actually give us more freedom than the other theories?"
  **Likely Answer:** She'll argue it protects agency because our choices aren't tracked by true propositions waiting for us.
  **Follow-up:** "But if I choose to do X, and then you say 'It was always open,' does that change how I feel about the choice? Or is this mostly just a technical win for logicians?"

  ### 8. The Takeaway for Students
  **You:** "We're a high school philosophy club, so we're all about the practical stuff. If a student takes your view seriously, how should they think about their plans for next weekend differently than someone who thinks the future is already fixed?"
  **Likely Answer:** Something inspiring about creating the future rather than finding it.
  **Follow-up:** "So I shouldn't stress about whether my predictions are 'true,' I should just focus on making them true?"

  ***

  ### Quick Advice for the Stage:
  *   **The Setup Sentences:** For the questions marked **[NEEDS SETUP]**, speak slightly slower than usual. That's the moment the audience leans in. If you rush the definition of "supervaluationism" or "Sea Battle," you'll lose them.
  *   **The Follow-ups:** Don't read the follow-up off the card if you can help it. Listen to her answer. If she says what you expect, glance down and deliver the follow-up naturally. If she goes off-script, just ask "But does that mean..." and use the gist of the follow-up.
  *   **Silence is Okay:** If she gives a heavy answer, take a breath before asking the next question. It lets the audience digest it.

  Good luck! You're going to crush it. The fact that you're asking about "vague objects" and "supervaluationism" already puts you ahead of most undergrads.
