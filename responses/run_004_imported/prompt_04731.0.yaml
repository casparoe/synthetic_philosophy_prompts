      *   *Wait, let's look closer at the "dropping and then rising".* Williamson's case is specifically about *warming up* (feeling cold at start, not cold at end). If the temp drops *and* rises, the subject might feel cold, then colder, then not cold. The sorites relies on a monotonic shift from $F$ to $\neg F$. If it fluctuates, the series $t_0 \dots t_n$ isn't a clean transition from Cold to Not-Cold. This shows a lack of careful reading.
