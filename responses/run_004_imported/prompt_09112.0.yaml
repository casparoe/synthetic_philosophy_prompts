answer: |-
  The signal box at Kestrel Junction smelled of wet coal and old grease. Outside, the rain did not fall so much as it hung in the air, a grey curtain that blurred the distinction between the sky and the marshland. Inside, Silas watched the clock. The minute hand trembled toward 03:00.

  The Red Train was due. It carried the 4th Battalion and the heavy artillery required for the dawn offensive at the River Vane. If the train crossed the junction before 03:15, it would make the bridge before the scheduled enemy bombardment. If it missed the window, it would be stuck on the siding until the shelling ceased. By then, the infantry would have already charged without support.

  Silas stood before the interlocking lever frame. It was a massive thing, brass handles worn smooth by the hands of a hundred signalmen before him. He gripped the handle for Track 4. He pulled.

  The lever moved halfway and stopped.

  It was not the gradual, groaning resistance of metal fatigued by age. It was a sudden, sharp lock, as if a stone had dropped into the gears. Silas shoved his shoulder against the brass. He kicked the base. He poured the contents of his oil can into the mechanism, watching the dark fluid vanish into the casing. The lever remained immobile, fixed in the neutral position.

  He cursed, wiping grease from his forehead. Was it a shard of coal from the yard, blown in by the gale an hour ago? A random piece of debris, no larger than a coin, that had found the only vulnerable gap in the machinery? Or was it the inevitable result of the maintenance logs he had been signing for months, logs that claimed the junction was serviced when the supply depot had sent no oil since winter began? Was it a pebble, or was it the war itself, grinding the country down until the iron grew brittle?

  At 03:05, the Red Train slowed, whistling a sharp complaint. Silas waved his lantern from the window, signaling the halt. The engineer would have to wait.

  Silas sat on the wooden stool and listened to the rain. He thought of the men on the train. If the lever had thrown, they would be crossing the Vane bridge in ten minutes. If the lever held, they would be sitting in the marsh, safe from the shells but useless to the men in the trenches.

  At 04:00, the ground shook. A low rumble rolled through the box, distinct from the thunder. The Vane bridge was gone. The enemy bombardment had been precise, earlier than intelligence had predicted.

  By dawn, the rain had lifted. A Colonel from the rear guard arrived in a staff car, mud splashing his trousers. He read Silas's report, then looked out the window at the stalled train.

  "Bad luck with the switch, Signalman," the Colonel said, lighting a cigarette.

  "The mechanism jammed, sir."

  "Could have been the debris. Could have been the lack of oil. Does it matter?" The Colonel exhaled smoke. "The bridge is destroyed. Even if your train had crossed at 03:10, it would have been stranded on the far bank with no way forward. The offensive is cancelled. We'll reroute the battalion through the valley."

  "And the infantry, sir? They charged at dawn."

  "They did." The Colonel turned to leave, his hand on the doorframe. "They fell. With or without the artillery. The enemy has the high ground. The logistics of this sector have been untenable since the autumn."

  He paused, looking back at the lever, frozen in its neutral position.

  "Then again," the Colonel said, his voice flat. "If you had cleared them through, they might have taken the ridge before the shelling started. History is written by the survivors, Signalman. Maybe you saved them. Maybe you just delayed their death by a week. The war doesn't stop for a broken lever. It finds another way."

  The Colonel left. Silas was alone in the box. He looked at the lever. It sat in the silence, heavy and immovable. Outside, the stalled train began to reverse, grinding its wheels against the rails, preparing for the long detour through the valley. The smoke from its engine drifted up, joining the mist, indistinguishable from the clouds.

  Silas placed his hand on the cold brass. He could feel the vibration of the train moving away, a pulse that could have been the heartbeat of the battle or merely the rhythm of a machine that would run until it rusted, regardless of the track it was given. He did not push the lever. He simply watched the train disappear into the grey, leaving the junction empty, waiting for the next order that might, or might not, arrive on time.
