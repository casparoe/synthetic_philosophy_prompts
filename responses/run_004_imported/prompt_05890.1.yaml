answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm a friend of Eleanor's from the lab. We started our careers around the same time, back when "data analysis" meant listening to the hum of mainframes and hoping the printouts didn't jam. I retired a few years ago, but Eleanor kept going. Forty-three years. In our field, that isn't just a career; it's a geological epoch.

  When I was asked to say a few words, I thought about what story to tell. Usually, at these dinners, we tell the victory stories. The discovery announced at the press conference. The paper that got a thousand citations. The grant that saved the department.

  But I want to talk about a different kind of victory. One that doesn't show up in the citation index.

  Many of you know the broad strokes of the story I'm thinking of. For about a decade, Eleanor saw something in her data. A faint excess. A whisper in the noise. To her, it looked like physics. To a lot of her colleagues, it looked like a systematic error. She defended it. She checked the calibration. She argued the statistics. She lived with that signal in her head, day and night, for ten years.

  Then, four years ago, a new collaboration ran the definitive test with better instruments. They found nothing. The signal was gone. It was, as the saying goes, a ghost in the machine.

  Now, the standard story—the one we tell undergraduates about the "Scientific Method"—goes like this: The new evidence comes in, the scientist updates their belief, and they move on. The end.

  But those of us in the room who were at that seminar four years ago know that isn't what happened. Eleanor stood up. She looked at the new data. She conceded the point completely. She said the old result was an artifact. She was rigorous, she was honest, and she was gracious.

  But then she said something else. Something I have thought about almost every day since.

  She said that even though she knew she had no right to believe in the signal anymore, she still *felt* it was real.

  She described a gap. On one side was the evidence, which told her she was wrong. On the other side was her intuition, her gut, her physicist's instinct, which refused to let go of the ghost.

  To the family and friends here: You might hear that and think, "Well, that sounds like being stubborn." It wasn't. Being stubborn would have been denying the new data. Eleanor accepted the data. She accepted the verdict.

  To my colleagues in the room: You know how rare this is. We are trained to suppress that gap. We are trained to make our internal confidence match our external p-values. When they don't match, we call it a bias. We call it a flaw.

  But I've spent the last few years reading a bit of philosophy—my daughter is an epistemologist, so I've had a good tutor—and I've learned there's a name for holding two conflicting thoughts at once. But I don't need a philosophical term to tell you what it is. It's integrity.

  It takes a very specific kind of courage to stand up and say, "The facts say I am wrong, but I cannot stop feeling that I am right." Most people would lie to resolve the tension. They would either pretend they never really believed it, or they would pretend the new data is suspicious. Eleanor did neither. She held the tension. She allowed herself to be a human being who feels, and a scientist who knows.

  She taught us that you don't have to kill your intuition to be rigorous. You just have to be honest about where it stands when the evidence overrules it.

  That is why she is such a formidable scientist. And that is why she is such a good mentor. How many students have come to her with a hunch that the data didn't support? She never told them to shut up. She told them to check the calibration. And when the calibration held, she told them to let it go. But she never made them feel foolish for having felt the pull in the first place.

  She taught us that science isn't just about being right. It's about how you inhabit the state of being wrong. It's about how you carry the weight of a null result without letting it crush your curiosity.

  Eleanor, you are retiring next month. You are leaving behind a field that is better because you were in it. Not just because of the papers you wrote, but because of the standard of honesty you set. You showed us that we can be loyal to the truth even when it conflicts with our deepest convictions. In fact, especially then.

  So, if everyone could please raise a glass.

  To Eleanor. For the signals you found, for the ghosts you chased, and for the rare and beautiful honesty of knowing the difference. May your retirement be filled with data that makes sense, instruments that behave, and the freedom to follow whatever whispers catch your ear, just for the joy of listening.

  To Eleanor.
