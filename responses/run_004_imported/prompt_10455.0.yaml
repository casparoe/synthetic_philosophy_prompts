      *   *Setup:* A game where payoff $X_n = (-1)^{n+1} \frac{2^n}{n}$ with probability $p_n = \frac{1}{2^n}$.
      *   *Expected Value:* $E[X] = \sum p_n X_n = \sum \frac{1}{2^n} (-1)^{n+1} \frac{2^n}{n} = \sum \frac{(-1)^{n+1}}{n} = 1 - 1/2 + 1/3 - \dots = \ln(2)$.
      *   *The Problem:* The series is conditionally convergent. By the Riemann Rearrangement Theorem, the sum depends on the order of summation. Since there is no natural ordering of outcomes in a probability space (outcomes are a set, not a sequence), the expected value is undefined. This challenges standard decision theory (Maximize Expected Utility - MEU).
      *   *Key Literature:* Nover & Hájek (2004) introduced it. Responses include Hájek, Fine, Colyvan, Easwaran, Lauwers, etc.

