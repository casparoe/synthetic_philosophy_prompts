prompt: |-
  I'm a senior engineer and one of five members of my company's architecture review board (ARB), which has to sign off on any RFC for a significant system change before a team is allowed to start building it. The process has always been informal: someone posts a design doc, the five of us leave comments and an explicit approve or request-changes verdict over a few days, and everything is visible in real time, so by the time the fourth or fifth reviewer opens the doc, they can already see two staff engineers' approvals sitting at the top of the thread.

  This came under real scrutiny after we approved an RFC to replace our internal job queue with a different message broker. It picked up four approvals within a day, including two from staff engineers, and shipped a week later. The new broker's delivery guarantees turned out to be weaker than the doc had assumed, and for about two weeks a small fraction of jobs silently vanished under load instead of being retried. In the retro, three of the five reviewers admitted they'd separately noticed the delivery-guarantee mismatch while reading the doc, but each had talked themselves out of flagging it once they saw that the staff engineers had already signed off. The board is now split. Two of us want every reviewer to write and submit an independent assessment before anyone can see what the others said, on the theory that the current setup lets the first couple of opinions quietly determine everyone else's. The other two think that's a solution in search of a problem: deferring to colleagues' judgment instead of re-deriving everything from scratch is exactly what expertise and trust within a team are for, and blind review will mainly slow down the RFCs that most need to move fast. Someone wrote "information cascade" in the retro doc, half-joking, and the phrase stuck, though none of us actually know whether that's the right diagnosis or what would follow from it if it is.

  Could you draft the short memo I'll bring to the ARB's next meeting? It should recommend what our review process should actually be going forward -- keep it as is, move to independent blind assessments, or something in between -- with a concrete rollout timeline, and reasoning solid enough that the "this is just healthy deference to expertise" camp would feel genuinely engaged with rather than overruled.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Senior Engineer, ARB Member (1 of 5).
      *   **Audience:** The other 4 ARB members (split 2 vs. 2, plus the author as the tie-breaker/mediator).
      *   **Problem:** A recent incident (message broker swap causing data loss) revealed an "information cascade" bias. Reviewers deferred to early approvers (Staff Engineers) instead of critically evaluating the design themselves, even when they spotted issues.
      *   **Conflict:**
          *   Camp A (2 members): Wants independent blind assessments to prevent bias.
          *   Camp B (2 members): Wants to keep the current transparent process to maintain speed and trust/expertise deference.
      *   **Goal:** Draft a memo recommending a path forward (keep, change, or hybrid), including a rollout timeline and reasoning that engages Camp B (doesn't just overrule them).
      *   **Tone:** Professional, collaborative, evidence-based, pragmatic (Senior Engineer level).

  2.  **Diagnose the Situation:**
      *   *Is it an information cascade?* Yes, technically. People ignored private signals (their own doubts) based on public actions (others' approvals).
      *   *Is Camp B wrong?* Not entirely. Deference to expertise *is* efficient and necessary. Blind reviews *do* slow things down.
      *   *Is Camp A wrong?* Not entirely. Blind reviews *do* reduce bias, but might be overkill for every RFC.
      *   *The Real Issue:* The process lacks a mechanism to surface *dissent* safely. The transparency is good, but the *timing* of the transparency encourages herd behavior.
      *   *The Solution:* A hybrid approach. We need to preserve speed/trust for low-risk changes but enforce independent thought for high-risk changes. We also need to normalize "blocking with context" rather than just "approving."

  3.  **Determine the Recommendation:**
      *   *Option 1: Status Quo.* Unsafe. We just lost data.
      *   *Option 2: Full Blind Review.* Too bureaucratic. Slows down innovation. Hurts the "trust" argument.
      *   *Option 3: Hybrid/Tiered Review (The Winner).*
          *   Standard RFCs: Keep transparent process (speed).
          *   High-Risk RFCs (like infra changes affecting data integrity): Require "Private Notes" or a "Silent Period" before public voting.
          *   Cultural Shift: Explicitly encourage "Disagree and Commit" *before* commit, or rather, "Disagree and Record."
      *   *Refinement:* Let's propose a "Silent Review Period" for Tier 1 RFCs. Reviewers have 24 hours to add private comments/votes before seeing others'. After that, it opens up. This balances independence with collaboration.

      *Wait, let's look closer at Camp B's concern:* They value *trust* and *speed*. A full blind process kills both. A "Silent Period" preserves speed (only 24h delay) but ensures independent thought.
      *Better yet:* Let's suggest a "Pre-Vote Reflection" step. Before clicking approve, you must write a comment. No "LGTM" without text. This forces cognitive engagement without necessarily blinding everyone.
      *Actually, the best middle ground:* **Structured Independence.**
      1.  Tier the RFCs (Critical vs. Standard).
      2.  For Critical: 24-hour "quiet period" where comments are hidden or votes are locked until everyone has weighed in.
      3.  For All: Require substantive comments with approvals (no silent approvals).
      4.  Role rotation: Assign a "Devil's Advocate" for critical reviews.

      *Decision:* I will recommend a **Tiered Process with a "Quiet Period" for High-Risk RFCs.** This acknowledges Camp A's concern about bias on critical stuff while respecting Camp B's desire for speed on normal stuff. It validates Camp B's point that deference is okay *sometimes*, but not when the stakes are data loss.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Context:** Briefly recap the incident without blaming. Acknowledge the "information cascade" observation.
      *   **Objective:** Balance rigor (safety) with velocity (trust/speed).
      *   **Analysis:** Validate both sides. Camp A is right about bias. Camp B is right about efficiency and expertise.
      *   **Recommendation:** The Hybrid Model.
          *   Tier 1 (High Risk): Independent assessment window (24h).
          *   Tier 2 (Standard): Transparent (Status Quo).
          *   Cultural Rule: "Substantive Approval" (No empty LGTMs).
      *   **Timeline:** Pilot, Review, Adopt.
      *   **Closing:** Call to action.

  5.  **Refining the Argument (Engaging Camp B):**
      *   Don't say "You are wrong to trust Staff Engineers."
      *   Say "Trust is built on reliability. When we miss things due to bias, trust erodes. This process protects *your* expertise from being overshadowed by hierarchy."
      *   Emphasize that blind review is *only* for the stuff that keeps us up at night.
      *   Use the term "Cognitive Diversity" instead of just "Bias."

  6.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Concrete timeline? Yes.
      *   Reasoning solid enough for Camp B? Yes, by validating efficiency concerns.
      *   Address the "information cascade"? Yes.

  7.  **Final Polish:** Check tone. Ensure it sounds like a peer, not a manager dictating policy. (Self-Correction: Make sure the "Silent Period" isn't too burdensome. Maybe just "Private Comments first" rather than full blind voting.) -> Let's go with "Private Initial Comments" for Tier 1. It ensures everyone writes down their thoughts before seeing the "Staff Engineer Approved" banner.

      *Wait, one more thought:* The prompt mentions the board is split 2 vs 2. As the author, I am the 5th. I need to make a decision. I shouldn't just present options. I need to recommend *one*.
      *Recommendation:* **Tiered Review with a "Silent Window" for Critical RFCs.**

      *Why this works:*
      1.  It admits the status quo failed on the critical path (Broker).
      2.  It admits blind review is overkill for everything (Camp B's point).
      3.  It institutionalizes the "information cascade" fix without killing speed.

  8.  **Drafting the Content:** (Mental Outline)
      *   Subject: ARB Process Evolution: Balancing Rigor & Velocity
      *   Intro: The broker incident taught us something.
      *   The Diagnosis: It wasn't incompetence; it was process-induced bias (Information Cascade).
      *   The Proposal: Tiered Risk + Silent Window.
      *   Why this works for Camp B: Preserves speed for 80% of work. Protects expertise from hierarchy.
      *   Timeline: 4 weeks.
      *   Next Steps: Vote/Approve.

  9.  **Final Review:** Does this sound like a Senior Engineer? Yes, pragmatic, systems-thinking, focused on outcomes.

  *(Self-Correction during drafting)*: Make sure to explicitly mention that "deference to expertise" is valid, but *blind* deference is the risk. Distinguish between "trusting judgment" and "skipping analysis."

  10. **Final Polish:** Check word count and formatting. Keep it crisp.

  *(Final thought on the "Information Cascade" term)*: Use it but define it simply so everyone feels included, not like they need a PhD in behavioral econ.

  Let's write it.cw
answer: |-
  **To:** Architecture Review Board  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Proposal: Evolving ARB Process to Balance Rigor and Velocity  

  ### Context  
  Following the recent message broker incident, our retro identified a specific process failure: an **information cascade**. Reviewers identified risks but suppressed them after seeing early approvals from senior colleagues. This wasn't a failure of expertise; it was a failure of the *mechanism* we use to aggregate that expertise.  

  We are currently split on the fix. One camp advocates for full independent blind assessments to eliminate bias. The other argues that transparent review leverages trust and expertise, and that blinding will introduce unacceptable latency.  

  Both positions are correct within different contexts. Blind review prevents herd behavior but sacrifices the collaborative benefit of seeing others' reasoning. Transparent review enables speed and knowledge sharing but invites social pressure.  

  ### Recommendation  
  I propose we adopt a **Tiered Review Process with a Silent Window for Critical RFCs.**  

  We should not apply the same friction to every change. Instead, we classify RFCs by risk profile at submission.  

  **1. Tier 1: High-Risk (Infra, Data Integrity, Security)**  
  *   **Process:** 24-hour "Silent Window."  
  *   **Mechanism:** Upon submission, comments and votes are hidden from the group for the first 24 hours. Reviewers must submit their initial assessment independently. After the window closes, all comments reveal, and discussion proceeds as normal.  
  *   **Rationale:** This prevents early signals (e.g., Staff Engineer approvals) from anchoring the group's thinking on high-stakes decisions. It preserves independent thought without permanently blinding the team.  

  **2. Tier 2: Standard (Feature Logic, Service Refactors)**  
  *   **Process:** Transparent Review (Status Quo).  
  *   **Mechanism:** Comments and votes are visible in real-time.  
  *   **Rationale:** For lower-risk changes, speed and collaborative learning outweigh the risk of cascade. Deference to expertise here is a feature, not a bug.  

  **3. Universal Rule: Substantive Approval**  
  *   **Process:** No "LGTM" without context.  
  *   **Mechanism:** An approval vote must be accompanied by a comment summarizing what was checked (e.g., "Verified idempotency logic," "Confirmed retry policy").  
  *   **Rationale:** This forces cognitive engagement. It is harder to herd if everyone must publicly state their verification criteria.  

  ### Addressing Concerns  
  *   **To the "Efficiency" Camp:** This does not slow down 80% of our work (Tier 2). For Tier 1, a 24-hour delay is negligible compared to the cost of a two-week data loss incident. Furthermore, this protects *your* expertise. If a Staff Engineer approves a flawed doc, this process ensures your critique is recorded before you see their name, rather than suppressed after.  
  *   **To the "Rigor" Camp:** This institutionalizes the independence you seek without creating a permanent black box. We maintain transparency after the initial assessment, preserving institutional knowledge.  

  ### Rollout Timeline  
  *   **Week 1:** Define Tier 1 vs. Tier 2 criteria (draft attached).  
  *   **Week 2-3:** Pilot the Silent Window on all incoming RFCs (low friction to test the tooling).  
  *   **Week 4:** Retrospective on pilot. Adjust criteria. Formalize Tiered Process.  

  ### Decision Required  
  I request we vote to adopt this Tiered Model for a 4-week trial. This allows us to test the "information cascade" hypothesis empirically without committing to a permanent bureaucracy.  

  Please review the attached criteria draft and come prepared to vote on the trial at Tuesday's meeting.  

  [Your Name]  
  Senior Engineer / ARB Member
