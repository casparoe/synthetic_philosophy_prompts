      *   **Menger (1934):** "Super St. Petersburg." Payouts grow faster than utility shrinks probability. If $U$ is unbounded, one can construct a payout sequence $x_n$ such that $\sum p_n U(x_n) = \infty$. Conclusion: Only *bounded* utility functions resolve the paradox. This became the consensus (Samuelson, Arrow).
      *   **Peters (2011):** Ergodicity Economics.
          *   Argument 1: The paradox arises from confusing ensemble averages (expectation) with time averages (growth rate). For multiplicative dynamics, the time average growth rate is the geometric mean, which corresponds to $\ln(w)$. This recovers Bernoulli's math but changes the *interpretation* (dynamics vs. preference).
          *   Argument 2: Menger's critique fails because it ignores the cost of entry relative to wealth. If you pay a large fraction of wealth to enter, the downside risk (ruin or severe drawdown) offsets the infinite upside in the time-average growth rate calculation.

  3.  **Address Question 1: The Time-Average Derivation & "Rescaling"**
      *   *The Issue:* St. Petersburg is typically a one-shot game. Time averages usually require repeated play. How does Peters justify applying time averages to a one-off?
