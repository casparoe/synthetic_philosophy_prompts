answer: |-
  This is a fantastic deep dive, and honestly, way more interesting than the standard assigned reading. Since you asked for a straight sanity check from a colleague's perspective: your notes hold together logically, but you are right to feel uneasy about the *interpretative* leaps, particularly regarding the normative status of the time average.

  Here is the breakdown of where your argument is solid and where you need to flag the controversy for your students.

  ### 1. The Time-Average Derivation (Your Point 1)
  **Verdict:** You are right to be skeptical. It is not "relabelling," but it is a **substantive modeling assumption** that masquerades as a mathematical necessity.

  *   **The Math:** Peters is mathematically correct that for multiplicative wealth dynamics, the time-average growth rate converges to the expectation of the log-change (Lyapunov exponent). That part is solid ergodic theory.
  *   **The "One-Shot" Problem:** Your intuition here is the standard critique from decision theory (e.g., from the vNM camp). The St. Petersburg game is canonically a *one-off* decision. Peters' derivation requires treating the decision as part of a continuous temporal trajectory of wealth.
  *   **The "Patch":** His move to rescale time into infinitesimal intervals is effectively assuming **continuous trading/rebalancing**. He is arguing that because an agent exists through time, *every* decision is technically part of a sequence, even if the specific lottery isn't repeated.
  *   **How to frame it for students:** Don't present this as "Peters proved the time average is the true average." Present it as a **choice of objective function**.
      *   *Expected Utility:* Maximizes the average outcome across parallel universes (ensemble).
      *   *Ergodicity:* Maximizes the outcome across time in *this* universe.
      *   *The Catch:* These are only equivalent if the process is ergodic. Wealth dynamics with leverage or bankruptcy are non-ergodic. Peters argues rational agents *should* optimize for time because they only live in one timeline. That's a philosophical/normative claim, not a mathematical proof. It's a legit way to get a time average, but it changes the definition of "rationality" from consistency of preferences to survival/growth optimality.

  ### 2. The Menger Critique (Your Point 2)
  **Verdict:** You are correct that fixing Menger's specific construction doesn't fully rehabilitate unbounded utility in the general case, and you should be careful not to overclaim Peters' victory here.

  *   **Menger's Theorem:** Menger (1934) proved that for *any* unbounded utility function $U(w)$, there exists a payout sequence $x_n$ such that $E[U(x_n)]$ diverges. This is mathematically robust within the Expected Utility (EU) framework.
  *   **Peters' Counter:** Peters argues Menger's construction ignores the **cost of entry relative to wealth**. In the EU framework, we often treat the ticket price as a sunk subtraction. In the time-average (log-wealth) framework, paying a large fraction of wealth to enter creates a massive negative drag on the geometric growth rate.
  *   **The "Cancellation":** Peters shows that as the ticket price approaches the player's wealth, the negative log-term (loss of wealth) diverges faster than the positive log-term (potential payout) for the specific Menger construction.
  *   **The Vulnerability:** Does this save unbounded utility? **No.** It saves the *log-growth criterion*.
      *   If you stick to the time-average growth rate as your objective, you are effectively using log utility. Log utility is unbounded.
      *   Therefore, a *new* Menger-style critic could theoretically construct a "Super-Super St. Petersburg" game where the payouts grow fast enough to overwhelm the log penalty *even in the time average*, provided the bet size is small relative to wealth.
      *   *However*, Peters' defense is usually physical: he argues that payouts growing faster than exponential (required to break log-growth) are physically impossible in a finite universe/resource constraint.
  *   **How to frame it:** Peters doesn't fix EU theory; he sidesteps it. He shows that if you optimize for time-growth, Menger's specific counter-example fails because it violates budget dynamics. But mathematically, the time-average criterion is still vulnerable to divergence if you allow for sufficiently explosive payout structures that don't require large upfront capital.

  ### Summary of Feedback for Your Notes

  1.  **Clarify the Normative Shift:** Make sure your notes distinguish between **axiomatic rationality** (vNM consistency) and **dynamic rationality** (survival/growth). Peters isn't solving the paradox within the original rules; he's changing the rules to say the original rules describe a non-ergodic process that no rational agent should optimize for.
  2.  **The "One-Shot" Assumption:** Explicitly state that Peters' time-average derivation assumes the agent cares about the long-run trajectory of wealth. If a student asks, "What if I die tomorrow?" Peters' model struggles unless you argue that bequest motives or institutional continuity preserve the time-average logic.
  3.  **Menger's Status:** Be careful not to say "Peters disproved Menger." Say "Peters showed Menger's critique relies on an ensemble interpretation of utility that ignores the dynamic cost of capital." Menger is still right about EU; Peters is arguing EU is the wrong tool for non-ergodic dynamics.
  4.  **The "Bug":** Your intuition on the "two divergences" is correct. Peters' insight is that the utility of *keeping* your wealth (not going bankrupt) provides the counter-weight. In standard EU, we often normalize initial wealth to 0 or ignore it; in ergodicity economics, initial wealth is the denominator of the growth rate, so it matters critically.

  ### Bottom Line
  You aren't fooling yourself. The tension you feel is the actual frontier of this debate.
  *   **Point 1** is the philosophical weak point (why should a one-off decision care about time averages?).
  *   **Point 2** is the mathematical weak point (log growth is still unbounded, so a new divergence is theoretically possible, just physically unlikely).

  If you present it as "Here is how Ergodicity Economics reframes the problem, and here are the open questions," your seminar will be a hit. If you present it as "Peters solved it," the sharp students (like you) will tear it apart. Given you're TA-ing a PhD seminar, lean into the controversy.

  *(One citation check for your prep: Look up Samuelson's 1977 comment on Menger, and maybe the recent critiques by decision theorists like Buchak or Thoma on the ergodicity approach, just to have the counter-counter-argument ready.)*
