      *   *Round 2 (Faith vs. Insight):* This is the philosophical core. Dan is a formalist/skeptic; Priya is a Platonist/intuitionist (in the broad sense). Priya wins on "justification," Dan wins on "absolute certainty." Point out that "faith" is a loaded term.
