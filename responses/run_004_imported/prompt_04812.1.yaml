      *   Ensure I don't treat Priya as just "common sense" (her appeal to intuition is a serious philosophical stance).
      *   Keep it engaging for a "logic night" crowd. Use terms like $\Pi_1$ sentences, well-ordering, Bayesian priors.

  7.  **Self-Correction/Review during drafting:**
