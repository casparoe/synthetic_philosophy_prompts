answer: |-
  Here are 10 interview questions designed to move past the "ancient sophists were silly" trope and dig into the semantic mechanics of the School of Names. I've included "producer notes" on the harder questions with anticipated dodges and follow-ups to keep the pressure on.

  ### 1. The Mass Noun Mechanics
  "Let's start right in the deep end with your central thesis. The standard reading of *A White Horse Is Not A Horse* is that it's a category error—a subclass is obviously part of a class. But you argue we're misreading Classical Chinese nouns as 'count nouns' (like 'apple') when they function more like 'mass nouns' (like 'water'). Can you walk us through the mechanics of that? If 'horse' is just 'horse-stuff,' how does adding 'white' fundamentally change the referent rather than just narrowing it down?"

  ### 2. Shape vs. Name (Textual Evidence)
  "In the *White Horse Dialogue*, Gongsun Long makes a distinction between 'commanding a horse' and 'commanding a white horse.' He argues that 'horse' names the shape, while 'white' names the color, and naming the color isn't the same as naming the shape. Is this a metaphysical claim about universals, or is it a pragmatic claim about how we issue orders? When he says the 'name' is different, is he talking about the word or the object?"

  ### 3. The Yellow and Black Horse Test
  "There's a specific moment in the text where he challenges the interlocutor: if you ask for a 'horse,' a yellow or black one will do; if you ask for a 'white horse,' they won't. He concludes that because the extensions differ, the terms must be distinct. But in modern logic, we'd say the *criteria for satisfaction* differ, not that the objects are ontologically distinct. Is Gongsun Long conflating the map with the territory here, or is he suggesting that the 'territory' itself changes based on how we slice it?"

  ### 4. The Equivocation Objection (Hard Question)
  "Here's the objection you'll get from an analytic philosopher: This is just a scope ambiguity or an equivocation on the word 'is.' If 'is' means 'is identical to,' sure, a white horse isn't identical to the concept of horse. But if 'is' means 'is a member of,' the statement is false. Are you defending Gongsun Long by saying Classical Chinese lacks this distinction, or are you saying he's exploiting a distinction that English logic artificially flattens?"

  > **Producer Note / Follow-up:** *She will likely say "Chinese doesn't have the verb 'to be' in the same way, so the ambiguity isn't there."*
  >
  > **Hit her with this:** "Fair, but even without a copula, the logical relation of inclusion has to exist in any language to function. If I point to a white horse and say 'This horse,' I'm not lying. If 'White Horse' and 'Horse' pick out totally different portions of stuff, as your mass noun reading suggests, how do I ever successfully point to one and call it the other without contradiction?"

  ### 5. Mereology and Fusion
  "Following up on that: If we treat these as mass nouns, we're entering the realm of mereology—the study of parts and wholes. Is Gongsun Long arguing that 'White Horse' is a *fusion* of attributes that creates a new simple object, rather than a complex object made of parts? In other words, is 'white-horse' a primitive substance for him, not a composite of 'whiteness' plus 'horseness'?"

  ### 6. Gongsun Long vs. Hui Shi
  "Let's zoom out to the School of Names generally. You specialize in Gongsun Long, but Hui Shi is the other giant here, mostly preserved through Zhuangzi's critiques. Gongsun Long seems obsessed with fixing reference (making sure 'horse' means *this*), while Hui Shi's 'Ten Theses' seem to dissolve reference entirely ('Heaven and earth are born together with me'). Are these two projects compatible, or is Hui Shi essentially deconstructing the semantic stability Gongsun Long is trying to build?"

  ### 7. The "Yue Today, Arrived Yesterday" Paradox
  "One of Hui Shi's most famous paradoxes is 'Go to Yue today and arrive yesterday.' This sounds like time travel, but you've suggested it's about the indexicality of 'today' and 'yesterday.' Is the argument that temporal markers are relative to the speaker's position rather than absolute points on a timeline? If so, is this a linguistic insight disguised as a physical impossibility?"

  ### 8. The Infinite Stick (Zeno or Not?)
  "Then there's the 'one-foot stick' paradox: take half away every day, and in ten thousand ages it won't be exhausted. This looks suspiciously like Zeno's Dichotomy Paradox. But Zeno was arguing against the coherence of motion. Was Hui Shi arguing against the coherence of *division*? Is he suggesting that language allows us to divide things infinitely in a way that physical reality does not?"

  ### 9. The Zhuangzi Dismissal (Utility vs. Truth)
  "Zhuangzi famously dismisses this whole school. He says these debaters can 'convince people's mouths but not their hearts,' and that they get lost in things while thinking they've mastered them. If your reading is right—that this is serious semantic theory, not just puns—does Zhuangzi's critique land harder or softer? Is he criticizing them for being wrong, or for thinking that semantic precision actually matters in the face of the Dao?"

  > **Producer Note / Follow-up:** *She might say "Zhuangzi is being poetic, not philosophical."*
  >
  > **Hit her with this:** "But Zhuangzi's point is pragmatic. If Gongsun Long's semantics don't change how we navigate the world—if I still treat the white horse as a horse when I ride it—then isn't Zhuangzi right that it's 'useless cleverness'? Does the School of Names offer any practical utility, or is it purely a theoretical exercise?"

  ### 10. The Disappearance of the Tradition
  "Finally, logic as a formal discipline explodes in Greece around this same period, but the School of Names effectively vanishes in China, often lumped in with 'sophistry' by later Confucian historians. If this was a robust semantic theory as you suggest, why didn't it stick? Was it suppressed because it threatened the political project of 'Rectifying Names,' or did the language itself evolve in a way that made these arguments impossible to sustain?"
