          *   Premise 3: To value our own humanity consistently, we must value the source of that value (our animal nature/impulses).
          *   Premise 4: If we value our own animal nature, we must value animal nature as such (in others).
          *   Premise 5: Animals have a "good of their own" (things can be good or bad *for* them).
