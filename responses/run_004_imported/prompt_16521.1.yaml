          *   *Revised Verdict:* Korsgaard's argument is internally consistent *as a development* of Kantian ethics, but it does sacrifice the strict identification of moral status with *rational* autonomy. It replaces "Rational Nature" with "Sentient Nature capable of having a good." Is this a betrayal? No, it's a completion. Kant failed to see that the *capacity to have a good* is the prerequisite for valuing anything at all. So, I will defend the view that Korsgaard succeeds in fixing a blind spot in Kant without abandoning the core commitment to the source of value.

