answer: |-
  Here are nine questions designed to probe the structural integrity of acausal trade, tailored to your background in cosmology and your podcast's philosophical focus.

  **1. The Enforcement Problem**
  "In my old line of work, once a galaxy crosses the de Sitter horizon, it is physically impossible for us to exchange a single photon, ever. If I'm an agent on the other side of that horizon, and you're here, you can defect on our 'deal' and I can never punish you, not even in principle. So, what is the actual enforcement mechanism? Why wouldn't a rational agent just take the benefit and ignore the cost, knowing the causal ledger can never be balanced?"
  *   **Likely Answer:** She will argue that enforcement isn't causal but *logical*. If both agents are sufficiently rational and know this about each other, their decisions are correlated outputs of the same logical truth; defecting implies the other defects, so cooperation is the only stable equilibrium.
  *   **Follow-up:** "But isn't that correlation just a causal ghost? If our decisions correlate, it's because our source code or evolutionary history shares a common cause in the past light cone. Are you really describing 'acausal' trade, or just ordinary causal dependency routed through a shared origin that we're choosing to ignore?"

  **2. The Decision Theory Framework**
  "To get the result you want, you seem to have to abandon Causal Decision Theory (CDT) in favor of Evidential or Functional Decision Theory (FDT). CDT says 'my action can't cause a change in a causally sealed agent,' so it defects. Why is CDT wrong here? Is it failing to describe rationality, or just failing to get the outcome you prefer?"
  *   **Likely Answer:** She will claim CDT is myopic and leaves expected utility on the table in Newcomb-like scenarios. FDT captures the dependency of the *output* of your decision algorithm on the other agent's algorithm, which she argues is the correct map of rationality.
  *   **Follow-up:** "Isn't this just winning the argument by picking the friendliest framework beforehand? If I define rationality as 'whatever maximizes utility in FDT,' of course FDT wins. Do you have an independent justification for why the universe respects logical counterfactuals over causal ones, or is this a purely normative stipulation?"

  **3. The Bargaining Problem**
  "Let's say we accept the logic of acausal trade. We still have to agree on the terms. If we can't communicate across the horizon or between branches, how do we land on a specific split of the gains? Why wouldn't I quietly aim for a 90/10 split in my favor while you aim for 50/50, resulting in a failed handshake?"
  *   **Likely Answer:** She will likely invoke Schelling points or focal points—concepts of fairness or symmetry that both agents would independently recognize as the natural default (e.g., a Nash bargaining solution).
  *   **Follow-up:** "Schelling points work for humans because we share a culture and biology. What is the Schelling point for a superintelligence in a distant universe branch? If their 'fairness' prior is mathematically different from ours, doesn't the trade collapse into mutual defection simply due to a lack of shared context?"

  **4. The Blackmail Distinction**
  "In a causal world, I can run a background check to see if you're a trader or a thug. In an acausal setup, I can't. How do I distinguish a genuine acausal trading partner from an acausal blackmailer who is threatening to simulate my suffering unless I comply? Both claim logical leverage; how do I tell the difference?"
  *   **Likely Answer:** She will argue for a policy of precommitment: you should adopt a general policy of never rewarding blackmail, which acausal partners will predict, whereas traders offer positive-sum outcomes that survive this filter.
  *   **Follow-up:** "But the blackmailer can predict your precommitment too. If they simulate you anyway to punish your refusal, you still suffer. How does refusing to pay stop the simulation from existing in the first place if the blackmailer has already decided to run it based on your predicted refusal?"

  **5. Asymmetric Values**
  "Suppose I value paperclips and you value happiness. In causal trade, I make paperclips and you make happy people, and we swap. Acausally, I just make paperclips here. But what if I value things that are impossible for you to produce even in principle, or vice versa? Does acausal trade only work for agents with isomorphic value structures?"
  *   **Likely Answer:** She will suggest that trade is based on *marginal* utility. Even if our terminal values differ, we might both value 'diversity of experience' or 'existence of value' instrumentally, allowing for a swap based on comparative advantage.
  *   **Follow-up:** "That sounds like you're smuggling in a shared meta-value to save the theory. If our terminal values are truly alien—say, one of us values negative utility—is there any logical hook left for trade to hang on, or does the theory silently assume a baseline of compatibility it can't justify?"

  **6. The Signaling Problem**
  "You mentioned precommitment to avoid blackmail. In a causal world, I signal this by shouting it or publishing it. Acausally, how do I 'signal' my policy to an agent I can't touch? Is it enough that I *know* my policy, or do I need to prove I can't change it?"
  *   **Likely Answer:** She will argue that in Functional Decision Theory, your decision *is* the signal. The other agent simulates your decision process; if your process outputs 'resist blackmail,' they see that. You don't need to transmit it; they compute it.
  *   **Follow-up:** "But they are computing a model of me, not me. If I lie to myself—if I genuinely believe I won't pay but would crack under pressure—their simulation fails. Doesn't this require a level of self-transparency and logical self-control that no physical agent can actually guarantee?"

  **7. The Simulation Hypothesis**
  "One of the most popular applications of this is between a base reality and a simulation. If I'm a sim, and I trade with my simulator, isn't this just causal trade with a very laggy connection? The simulator can turn me off. Why dress that up as 'acausal'?"
  *   **Likely Answer:** She will distinguish between the *threat* of turning you off (causal) and the *reason* the simulator created you (acausal). You might influence *why* you were created or *which* branch you inhabit via acausal logic, distinct from ongoing causal control.
  *   **Follow-up:** "If the simulator can intervene causally, why rely on the acausal channel? It seems like acausal trade is only the dominant strategy when causal power is strictly zero. Does your theory actually apply to the simulation case, or is that just a rhetorical flourish?"

  **8. The "One Decision" View**
  "Some proponents argue that in acausal trade, there aren't actually two decisions, just one logical decision instantiated in two places. If that's true, isn't 'trade' the wrong word? It sounds more like a single agent optimizing across two locations."
  *   **Likely Answer:** She will concede there is a sense in which it is one decision, but argue that from the subjective perspective of the agents, it feels like trade, and the mathematical formalism of bargaining still applies to resolve conflicts of interest.
  *   **Follow-up:** "If it's one decision, where is the room for betrayal? Betrayal requires two wills. If you collapse us into one logical will, haven't you solved the cooperation problem by definition rather than by mechanism? Are we discussing decision theory or metaphysics?"

  **9. The Empirical Anchor**
  "I want to end where I started: with evidence. In cosmology, if a theory predicts nothing observable across the horizon, we treat it as metaphysics. What evidence, even in principle, could tell us acausal trade is doing real work in the universe, versus it just being a comforting story we tell ourselves to justify being the cooperative type?"
  *   **Likely Answer:** She will likely pivot to normative evidence: the theory is justified because it makes you win (get higher utility) in hypothetical scenarios, not because it predicts new physical particles. It's a tool for reasoning, not a physical force.
  *   **Follow-up:** "Then be careful claiming it describes the universe. If it's purely normative, why apply it to cosmological horizons or multiverse branches as if it's a physical interaction? Isn't there a risk we're re-enchanting the universe with moral causality where physics explicitly forbids it?"
