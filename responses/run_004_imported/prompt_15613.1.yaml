answer: |-
  Good evening, everyone. For those of you who don't know me, I'm Sarah's older brother. And for those of you who *do* know me, you know I'm not a man of many words. I work in HVAC. I spend my days crawling into attics, fixing systems that have stopped breathing, and explaining to people why their thermostat is lying to them.

  So, standing up here without a tool belt feels a little exposed. But I've been thinking about what to say, and I realized there's actually a lot of overlap between my job and marriage.

  In my line of work, people often think the goal is a system that never makes a noise. A house that's perfectly silent. But that's not actually what you want. A house needs to settle. Pipes need to expand and contract. If everything is rigid, something cracks when the pressure changes. The goal isn't silence. The goal is a structure solid enough to handle the noise.

  I think a lot of people look at a marriage like it's a bet. They think you wait until you're one hundred percent certain—until you've checked every line item, tested every circuit, and guaranteed the outcome—before you sign the contract. But if you wait for that kind of certainty, you'll never build anything.

  Sarah and David know this better than most. Their story hasn't been a straight line from point A to point B. They've taken detours. They've spent time apart. They've tested the blueprint. And I think that's exactly why they're standing here today.

  They didn't come back together because they finally found a way to guarantee that things will never go wrong. They came back because they realized that love isn't about eliminating the doubt. It's about deciding, together, on the one thing that *doesn't* move.

  It's like a door. A door is only useful if it can swing open and shut. It needs to handle the wind, the slamming, the coming and going. But for any of that movement to be possible, the frame has to hold. The pin has to stay put. You don't argue with the frame every time you walk through the doorway. You trust it, so you can get on with living in the house.

  Sarah and David have spent the last few years figuring out where to set that frame. They know what it costs to walk away, and they know what it takes to return. They aren't promising that the weather will always be mild. They're promising that when the storm hits, they know exactly where the anchor is.

  So, I'm not going to wish you a life without questions. I'm not even going to wish you a life without arguments—I work in climate control, I know the thermostat war is inevitable.

  Instead, I wish you a solid frame. I wish you the kind of commitment that stays still enough to let everything else move around it.

  If everyone could please raise their glasses.

  To Sarah and David: May you always know where your foundation lies, and may your door always be open to each other.
