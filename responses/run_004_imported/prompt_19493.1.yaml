          *   *The Authorship Void:* In "Many Hands," humans wrote the rules. In ML, the system infers them. The link between intent and outcome is severed.
          *   *Adaptability:* Systems change post-deployment. A human subordinate follows policy; a model shifts decision boundaries based on new data without a new memo.
      *   **Why "Many Hands" Solutions Fail:** Show why standard bureaucratic fixes (audits, chains of command) don't work on opaque models. You can't blame a hand that didn't write the rule.
      *   **Conclusion:** Reiterate the thesis. The gap is real. It requires new frameworks (maybe strict liability or explainability mandates), not just better org charts.

  6.  **Refining the Argument (Self-Correction during drafting):**
