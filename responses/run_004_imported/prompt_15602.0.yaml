prompt: |-
  I recently joined the clinical ethics advisory committee at the hospital network where I work as a genetic counselor, and next month we have to deliver a recommendation on a case that has split the committee more than anything I've seen in three years there. A partner lab wants to pilot an "opportunistic" expanded panel: patients coming in for routine pre-surgical bloodwork can opt in to have the same sample screened for adult-onset conditions we can't currently prevent or treat, including APOE4 status for Alzheimer's risk and confirmatory testing for Huntington's in patients with a family history who have so far chosen not to find out. The lab's bioethicist, arguing for approval, kept invoking something she called "Good's theorem" — I gather it's an actual result in Bayesian decision theory showing that a rational agent's expected utility from acquiring information before a decision is never lower than from declining it, cost aside — to argue that since results are opt-in and can simply be left unopened, adding friction like mandatory pre-test counseling only lowers uptake of something that can only help patients in expectation. Several of us are unconvinced this settles anything, both because plenty of our patients respond to a probabilistic, untreatable diagnosis in ways that look nothing like tidy Bayesian updating, and because "opt-in" hasn't stopped results from shaping insurance and employment decisions elsewhere in the system. The pilot is scheduled to start intake in about six weeks regardless of what we decide.

  My own mother's APOE4 result three years ago is a fair part of why I find it hard to think about this case on my own steam, which is why I'd rather work from someone else's reasoning here. Could you draft the memo I'll circulate to the committee before the vote? I need it to land on one concrete recommendation — approve the pilot as proposed, reject it, or approve it with specific conditions — attached to a definite timeline, and I need it to actually engage with the bioethicist's argument on its own terms, including where the theorem does and doesn't reach, rather than just asserting a "right not to know" against it without addressing her point.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Genetic Counselor on a Clinical Ethics Advisory Committee (CEAC).
      *   **Task:** Draft a memo to the committee before a vote on a controversial case.
      *   **Case:** A partner lab wants to pilot an "opportunistic" expanded panel (adult-onset, untreatable conditions like APOE4, Huntington's) on routine pre-surgical bloodwork. It's opt-in, but the lab argues against mandatory counseling citing "Good's Theorem" (information always has non-negative expected utility).
      *   **Conflict:** The committee is split. The user is personally affected (mother's APOE4 result) and wants to rely on structured reasoning rather than personal emotion.
      *   **Requirements:**
          *   Must land on one concrete recommendation (Approve, Reject, or Approve with Conditions).
          *   Must include a definite timeline.
          *   Must engage with the bioethicist's argument (Good's Theorem) on its own terms (where it applies, where it fails).
          *   Must address the "opt-in" vs. "impact" reality (insurance/employment).
          *   Tone: Professional, ethical, reasoned, persuasive, suitable for a clinical ethics committee.
          *   Constraint: The pilot starts in 6 weeks regardless of the decision (implies urgency and potential need for mitigation if rejected/delayed).

  2.  **Deconstruct the Ethical & Technical Arguments:**
      *   **The Lab's Argument (Good's Theorem):** I.J. Good (1967) proved that for a rational Bayesian agent, the expected utility of free information is always $\ge$ the expected utility without it. Therefore, offering testing is always good *if* the patient is a rational agent maximizing utility.
      *   **The Counter-Argument (Why Good's Theorem fails here):**
          1.  *Bounded Rationality:* Patients are not ideal Bayesian agents. Psychological harm (anxiety, depression) reduces utility in ways not captured by medical outcomes.
          2.  *Costs aren't just monetary:* Good's theorem assumes costless information. Here, the "cost" includes psychological burden, family dynamics, and potential discrimination (GINA limitations).
          3.  *Decision Context:* Pre-surgical patients are vulnerable/stressed. "Opt-in" in a surgical consent packet is not truly autonomous choice (therapeutic misconception).
          4.  *Actionability:* If there is no treatment/prevention (untreatable adult-onset), the "decision" the information informs is null or purely existential, which changes the utility function.
          5.  *Huntington's Specifics:* Testing for HD in asymptomatic adults requires specific protocols (neurological exam, counseling) for a reason. Doing it opportunistically violates standard of care.

  3.  **Determine the Recommendation:**
      *   *Approve as proposed:* Too risky. Violates standard of care for HD and APOE. Ignores psychological harm.
      *   *Reject:* Ethically sound, but the pilot starts in 6 weeks regardless. A hard "no" might be ignored or cause friction with the lab. However, ethics committees *should* say no to unethical practices.
      *   *Approve with Conditions:* This is the most pragmatic and ethically robust path for a committee memo. It acknowledges the pilot is happening (per the prompt's constraint "scheduled to start... regardless") but sets guardrails to mitigate harm. *Correction:* The prompt says "The pilot is scheduled to start intake in about six weeks regardless of what we decide." This implies the hospital administration or lab might proceed anyway. An Ethics Committee recommendation carries weight. If the ethics are fundamentally violated, the recommendation should be to **Reject/Defer** until conditions are met, effectively stopping the current proposal. However, given the user wants a "concrete recommendation... attached to a definite timeline," a "Reject current protocol, Approve revised protocol by [Date]" is strongest.
      *   *Decision:* **Reject the current pilot protocol.** Recommend a **deferred approval** contingent on specific safeguards (counseling, exclusion of HD, etc.) to be implemented before *any* patient intake. Why? Because "opportunistic" testing for Huntington's without counseling is widely considered unethical in genetics. Approving it with conditions that fundamentally change the "opportunistic" nature (i.e., requiring counseling) effectively rejects the *lab's* proposal but offers a path forward.
      *   *Refinement:* To be most helpful to the user who wants to engage Good's Theorem, the recommendation should be: **Do not approve the pilot as proposed.** Instead, **recommend a moratorium** until a revised protocol addressing the theorem's limitations is submitted. This gives the committee leverage.
      *   *Wait, looking closer at the prompt:* "The pilot is scheduled to start intake in about six weeks regardless of what we decide." This suggests the committee's power might be advisory. If I say "Reject," and they do it anyway, the committee looks weak. If I say "Approve with Conditions," I might be sanctioning harm.
      *   *Best Ethical Stance:* **Reject the current protocol.** The harm (especially regarding Huntington's) is too great. The memo should argue that proceeding without changes violates ethical standards. The timeline should demand a revised protocol *before* the 6-week mark.
      *   *Actually, a nuanced "Approve with Conditions" is often more effective in these memos.* It allows the committee to say "Yes, but..." which forces the lab to change behavior. If the conditions are strict enough (e.g., "Must have genetic counseling for HD and APOE"), it kills the "opportunistic/low friction" model but allows the *intent* (access) to remain.
      *   *Let's go with:* **Recommendation: Do Not Approve (Deferred).** We cannot approve *this* protocol. We offer a path to approval if specific conditions are met by [Date]. This engages the theorem by showing where the utility calculation breaks.

  4.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Clear recommendation.
      *   **Background:** Briefly state the proposal.
      *   **Analysis of Good's Theorem:** This is the core intellectual heavy lifting.
          *   Acknowledge validity in abstract decision theory.
          *   Identify boundary conditions violated here: Cost (psychological/social), Rationality (vulnerable patients), Actionability (no treatment).
          *   Specific callout on Huntington's (standard of care violation).
      *   **Systemic Risks:** Insurance/Employment (GINA gaps).
      *   **Recommendation & Timeline:** Specific conditions (No HD, Counseling for APOE, Data segregation). Deadline before intake.
      *   **Conclusion:** Reiterate commitment to patient welfare.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid personal anecdote (user said they want to work from someone else's reasoning because of their mother).
      *   Professional, academic, yet actionable.
      *   *Self-Correction on Personal Info:* The user mentioned their mother's result to *me* to explain their stress. I should not put that in the memo. The memo must be objective.

  6.  **Addressing Good's Theorem Specifically:**
      *   I need to explain *why* it doesn't apply.
      *   Good (1967): $E[U|Info] \ge E[U|No Info]$.
      *   Caveat 1: Information must be free (or cost accounted for). Psychological distress is a cost.
      *   Caveat 2: Agent must be able to act on info to maximize utility. If no treatment exists, utility gain is limited to planning, which may be outweighed by distress.
      *   Caveat 3: "Opt-in" does not equal "Rational Choice" in a pre-surgical context (coercion/vulnerability).

  7.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes (Defer/Conditional).
      *   Definite timeline? Yes (Before intake date).
      *   Engage Good's Theorem? Yes (dedicated section).
      *   Address insurance/employment? Yes.
      *   Tone? Professional Ethics Memo.

  8.  **Final Polish:** Ensure the distinction between "Reject" and "Defer with Conditions" is clear. I will frame it as "Cannot Approve Current Protocol" but "Pathway to Approval Available." This is stronger than a soft "Approve with conditions." It signals the current version is unethical.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm lecturing the bioethicist condescendingly. I need to validate the theorem then show its misapplication. "We agree with the mathematical premise, but dispute the clinical mapping."

      *(Timeline)*: Pilot starts in 6 weeks. I should set the deadline for revised protocol at 3 weeks to allow review time.

      *(Huntington's)*: This is the red line. Opportunistic HD testing is almost universally condemned without counseling. I must emphasize this.

      *(APOE)*: Controversial, but HD is the dealbreaker.

      *(Recommendation)*: I will recommend **not approving the pilot in its current form** and propose a **revised protocol** that excludes HD and mandates counseling for APOE. This effectively rejects the "low friction" model but keeps the door open for ethical testing.

      *Wait, one more thing:* The prompt says "The pilot is scheduled to start... regardless of what we decide." This is tricky. If the committee says "No" and they do it anyway, the committee's authority is undermined. However, an Ethics Committee's job is to state what is *ethical*, not necessarily what is *feasible*. I will write the memo assuming the committee's recommendation carries enough weight to halt or modify the launch, or at least document the ethical breach if they proceed. I will frame the recommendation as a condition for *hospital endorsement*, which might be required for the lab to access patients.

      *Decision:* I will recommend **Deferral of Approval**. We cannot ethically endorse the current plan. We offer a revised framework. This puts the onus on the lab to change or proceed without ethics endorsement (which is risky for them).

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Advisory Committee (CEAC)
  **FROM:** [Your Name], Genetic Counselor, CEAC Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Partner Lab "Opportunistic" Expanded Panel Pilot

  ### Executive Summary

  The Committee is asked to evaluate a proposal by a partner laboratory to pilot an "opportunistic" expanded genetic panel. This pilot would allow patients undergoing routine pre-surgical bloodwork to opt-in to screening for adult-onset, currently untreatable conditions (specifically including *APOE* ε4 for Alzheimer's risk and *HTT* for Huntington's disease).

  The laboratory's bioethics consultation argues that mandatory pre-test counseling creates unnecessary friction that reduces utility, invoking I.J. Good's theorem on the value of information to suggest that opt-in access is inherently ethically permissible.

  **Recommendation:** The Committee **cannot approve the pilot in its current form.** We recommend a **Deferral of Approval** contingent on the submission of a revised protocol that excludes Huntington's testing entirely and mandates pre-test counseling for *APOE* status. A revised protocol must be submitted within **three weeks** to allow for review prior to the scheduled six-week intake launch.

  ### Analysis of the "Value of Information" Argument

  The laboratory's position relies heavily on I.J. Good's 1967 theorem regarding the expected utility of information. Good demonstrated that for a rational Bayesian agent, the expected utility of making a decision *with* free information is never lower than making that decision *without* it. The argument follows that because patients can choose to leave results unopened ("opt-in"), the utility cannot be negative, and therefore barriers like counseling are unjustified paternalism.

  While mathematically sound in abstract decision theory, this application fails to map onto the clinical reality for three specific reasons:

  **1. The "Cost" of Information is Non-Zero**
  Good's theorem assumes information is costless. In this clinical context, the "cost" includes significant psychological burden, alteration of self-concept, and potential socio-economic harm.
  *   **Psychological Utility:** For untreatable conditions, the "decision" informed by the data is often existential rather than medical. For many patients, the anxiety and depression associated with a positive result for an untreatable neurodegenerative condition constitute a negative utility that outweighs the utility of "knowing."
  *   **Systemic Costs:** While GINA protects against health insurance discrimination, it does not cover life, disability, or long-term care insurance. An "opt-in" checkbox does not adequately convey that a genetic result can permanently alter insurability. This is an external cost not factored into the patient's immediate utility calculation.

  **2. Bounded Rationality and Vulnerability**
  Good's theorem assumes a rational agent maximizing utility. Pre-surgical patients are a vulnerable population.
  *   **Therapeutic Misconception:** Patients consenting to surgery often conflate all associated paperwork with clinical necessity. An "opt-in" box buried in pre-operative consent does not guarantee autonomous choice; it risks coercion by association with necessary care.
  *   **Cognitive Load:** A patient preparing for surgery is not in a state of optimal rationality to weigh the lifelong implications of Huntington's testing. Removing counseling removes the scaffold required to make the "rational" choice the theorem presupposes.

  **3. Actionability and Standard of Care**
  The theorem assumes the agent can *act* on the information to maximize utility.
  *   **Huntington's Disease (*HTT*):** Predictive testing for Huntington's has a universally accepted standard of care requiring neurological examination and multiple counseling sessions. This is not merely bureaucratic friction; it is a safeguard against suicide and severe psychological decompensation in at-risk individuals. Conducting this test "opportunistically" violates established medical standards, regardless of patient consent.
  *   **Alzheimer's Risk (*APOE*):** Without disease-modifying therapies, the clinical utility is low. The primary utility is life planning, which requires significant support to process.

  ### Ethical Risks of the Current Protocol

  If approved as proposed, the pilot introduces the following risks:
  1.  **Harm to Patients:** High risk of psychological distress without adequate support structures, particularly regarding *HTT*.
  2.  **Erosion of Trust:** Patients may feel the hospital network prioritizes data collection over welfare if "routine bloodwork" yields life-altering diagnoses without warning.
  3.  **Liability:** Proceeding with *HTT* testing outside established guidelines exposes the network to significant liability should a patient suffer harm post-disclosure.

  ### Recommendation and Timeline

  We acknowledge the laboratory's goal to increase access to genetic information. However, access without safeguards is not an ethical good. To align this pilot with ethical clinical practice, the Committee recommends the following:

  **1. Exclusion of Huntington's Disease (*HTT*) Testing**
  Predictive testing for Huntington's disease must be **excluded** from this pilot entirely. The risk profile and standard of care requirements are incompatible with an opportunistic screening model.

  **2. Mandatory Pre-Test Counseling for *APOE* and Similar Markers**
  For adult-onset, untreatable conditions where testing is permitted, the "friction" of counseling is a feature, not a bug. It ensures the "opt-in" is truly informed. The protocol must be revised to require a brief tele-health genetics consultation prior to sample processing for these specific markers.

  **3. Data Segregation and Insurance Warning**
  The consent form must explicitly detail the limitations of GINA (specifically regarding life and disability insurance). Furthermore, these results must be segregated in the EHR to prevent accidental disclosure to providers not involved in the genetic care plan.

  **Timeline for Implementation:**
  *   **Revised Protocol Submission:** Due to the Committee within **3 weeks** (November 16, 2023).
  *   **Committee Review:** To be completed within **1 week** of submission.
  *   **Pilot Launch:** May proceed only after written ethics approval of the revised protocol. If the revised protocol is not received by the deadline, the Committee recommends the pilot be postponed until ethical safeguards are in place.

  ### Conclusion

  Good's theorem correctly identifies that information *can* be valuable. However, it does not prove that *all* information is valuable to *all* agents in *all* contexts. In clinical genetics, the utility of information is mediated by the patient's ability to process it and the medical system's ability to support them.

  By removing the safeguards for *HTT* and *APOE*, the current proposal treats genetic results as mere data points rather than medical diagnoses. We cannot endorse a model that prioritizes the theoretical value of information over the tangible well-being of vulnerable patients. We stand ready to review a revised protocol that respects both patient autonomy and clinical safety.

  **Action Required:** Vote on Recommendation to Defer Approval pending protocol revision by November 16, 2023.
