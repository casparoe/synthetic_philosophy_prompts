answer: |-
  **Setting:** *A cluttered graduate office, 2:00 AM. Papers on decision theory and measure theory are spread across the desk. ELENA holds a white envelope. She has just opened it and is staring at a slip of paper. MARCUS sits on the edge of the desk, watching her hand as she reaches for the second, blue envelope.*

  **Elena:** It's $x$. Whatever $x$ is, the math says I swap.

  **Marcus:** *(Catching her wrist gently)* Don't.

  **Elena:** You're blocking the dominance argument. I see $x$. The other envelope is either $2x$ or $x/2$. Unless I have specific information about the distribution of money in these envelopes, the principle of indifference suggests—

  **Marcus:** We aren't doing the unopened version, Elena. You've looked. You're conditionalizing. And you know the standard reply: there is no uniform distribution over the positive reals.

  **Elena:** I'm not invoking a uniform prior. That's the amateur mistake. I'm invoking a proper prior with finite expectation. If the organizer of this game has a finite budget—which is a physical necessity, not just a mathematical convenience—then the prior distribution over the smaller amount, let's call it $S$, must have a finite mean.

  **Marcus:** And if the mean is finite?

  **Elena:** Then the "always switch" strategy vanishes. It becomes a fact about the shape of the prior. For some values of $x$, the likelihood ratio $P(S=x)/P(S=x/2)$ will be high enough that the expected value of the other envelope drops below $x$. For low values, I should switch. For high values, I should stay. The paradox dissolves into standard Bayesian updating. There is no mystery, just calculation.

  **Marcus:** But that calculation relies on a constraint you're importing from outside the probability theory. You're insisting on finite expectation.

  **Elena:** I'm insisting on decision theory. Expected value is a guide to action. If the expectation is infinite, it ceases to guide. It's the St. Petersburg problem in a tuxedo.

  **Marcus:** Is it? In St. Petersburg, the utility function is the bottleneck. We bound utility to save the expectation. Here, you're trying to bound the *probability distribution* itself to save the intuition that symmetry should hold unconditionally. But I can specify a legitimate, properly normalized prior over $S$ where $E[S]$ is infinite, yet for *every* observed $x$, the conditional expectation of the other envelope is strictly greater than $x$.

  **Elena:** A heavy-tailed distribution. Sure. $P(S=2^k) \propto 1/k^2$. The sum converges to 1, so it's a valid probability measure. But the expectation diverges.

  **Marcus:** Exactly. In that world, you open the envelope, see any finite sum, calculate the conditional expectation, and it is always rational to switch.

  **Elena:** And that's precisely why it's St. Petersburg. You've constructed a scenario where the numbers lose their connection to rational choice. If I tell you "switching is always better," but I also know that by symmetry the envelopes are identical before opening, I have a contradiction. $E[\text{Other}] > E[\text{Yours}]$ and $E[\text{Other}] = E[\text{Yours}]$. The only way to resolve that contradiction is to say the expectations don't exist. And if they don't exist, your conditional calculation is noise.

  **Marcus:** It's not noise. It's a failure of conglomerability. That's the structural issue you're glossing over.

  **Elena:** Conglomerability?

  **Marcus:** Think about the partition. Let $X$ be the amount in your envelope. The set of possible values $\{x_1, x_2, \dots\}$ forms a countable partition. Conglomerability requires that if $E[\text{Other} | X=x] > x$ for every $x$ in the partition, then the unconditional expectation $E[\text{Other}]$ must be greater than $E[X]$.

  **Elena:** But we know by symmetry $E[\text{Other}] = E[X]$.

  **Marcus:** Precisely. So conglomerability fails. And it fails *because* the expectation is infinite. You want to dismiss the infinite case as "unphysical," but that's a pragmatic dodge, not an epistemic solution. The paradox reveals that standard conditionalization rules—specifically the law of total expectation—break down when we move from finite to countably additive measures with infinite integrals. The mystery isn't about money; it's about the limits of updating.

  **Elena:** But epistemology is for agents, Marcus. Agents are finite. We don't inhabit a space where infinite expectations are actionable. If I tell a grad student, "You should always switch, no matter what you see," and they follow that policy, they end up with the same distribution they started with. They gain nothing. The policy is empty.

  **Marcus:** Is it empty? Or is it exposing that "expected value" is not the fundamental norm of rationality? If the conditional logic holds for every specific state of the world you might find yourself in, why should the global symmetry override it?

  **Elena:** Because the global symmetry is a logical truth derived from the setup, whereas the conditional expectation is a calculation dependent on a prior that admits infinite mass. You're prioritizing a local calculation over a global invariant. That's like saying "Every step I take moves me closer to the horizon, therefore I will eventually reach it." The local truth doesn't aggregate.

  **Marcus:** But in Bayesian terms, the agent *only* has access to the local truth. I am in state $x$. I must act on $E[\text{Other} | X=x]$. I don't have access to the "view from nowhere" that sees the symmetry of the unconditional distribution. If the formalism tells me to switch in every possible world I could occupy, then telling me "but on average you don't gain" is useless. The "average" is a fiction when the sum diverges.

  **Elena:** It's not a fiction; it's a consistency check. If your local rules lead to a global contradiction, your local rules are defective. And the defect is the assumption that you can maximize expectation in a space where expectation isn't defined. You're trying to order the undefined.

  **Marcus:** Or, perhaps, the defect is assuming that rationality requires the unconditional expectation to be well-defined. Look, if we accept your finite-expectation constraint, we solve the paradox by fiat. We just declare the problematic priors "irrational." But why? Is it irrational to assign a non-zero probability to arbitrarily large sums, provided the probabilities sum to one?

  **Elena:** It's irrational if it leads to a sure-loss strategy or a dominated policy.

  **Marcus:** But there is no dominated policy here! That's the kicker. If you keep your envelope, your expectation is infinite. If you switch, your expectation is infinite. You cannot compare them. The paradox arises only if you insist that $E[\text{Other}|X=x] > x$ implies a strict preference for switching *aggregated* over all $x$. But if the integrals diverge, Fubini's theorem doesn't apply. You can't swap the order of integration. The "paradox" is just the shock of seeing measure theory behave like measure theory.

  **Elena:** *(Pulls her hand back from the blue envelope, but doesn't put the white one down)* So you're saying the paradox is just a category error? We're treating infinite expectations like finite numbers?

  **Marcus:** I'm saying the paradox is a genuine feature of conditionalization on infinite partitions. It shows that $P(A)$ is not always the weighted average of $P(A|B_i)$. That's conglomerability failure. It's a limit on how much we can trust conditional probability to reflect unconditional truth when tails are heavy.

  **Elena:** And I'm saying that for a formal epistemologist interested in *belief* and *action*, a probability theory that permits conglomerability failure in decision contexts is a bug, not a feature. If the math says "switch" everywhere but "no gain" globally, the math has detached from the concept of 'gain'.

  **Marcus:** Or 'gain' has detached from the math.

  **Elena:** *(Sighs, placing the white envelope on the desk)* If I accept your prior, the infinite expectation, I have to admit that seeing the number $x$ gives me information.

  **Marcus:** Of course. It tells you where you are in the tail.

  **Elena:** But if I should switch for *every* $x$, then I should have switched without looking.

  **Marcus:** Not necessarily. Without looking, the expectation is undefined. You can't compare undefined to undefined. Looking creates a conditional context where the comparison becomes defined—locally.

  **Elena:** That feels like sophistry. It suggests that ignorance is preferable because it preserves symmetry, while knowledge forces a decision that leads nowhere.

  **Marcus:** Knowledge forces a decision that is locally optimal, even if globally incomparable. Maybe that's the lesson. Rationality is local.

  **Elena:** Or maybe the lesson is that expected value maximization is only a valid norm when the world behaves nicely. When the tails get too heavy, we need a different norm. Bounded utility, perhaps.

  **Marcus:** *(Smiles faintly)* So we're back to St. Petersburg.

  **Elena:** We're back to the fact that we are humans, not measures. I'm not switching.

  **Marcus:** *(Releasing his grip)* Because of the prior?

  **Elena:** Because if I switch, I'm admitting that infinity is a number I can gamble with. And I won't. *(She picks up her pen)* But you're right about one thing. I can't just wave away the infinite case as "impossible." I have to address why finite expectation is a requirement of rationality, not just physics.

  **Marcus:** That's a paper worth writing.

  **Elena:** Don't encourage me. I'm supposed to be finishing this one. *(She gestures to the scattered pages)*

  **Marcus:** Just make sure you cite the conglomerability literature. It's not just St. Petersburg.

  **Elena:** I'll cite it. Then I'll argue it's pathological.

  **Marcus:** Fair enough. *(He hops off the desk)* Want coffee?

  **Elena:** Only if you're buying. Expected value of my wallet is currently zero.

  **Marcus:** *(Laughing)* Careful. That's a divergent integral.

  **Elena:** Go get the coffee, Marcus.
