answer: |-
  Here are ten interview questions designed to probe the structural weaknesses and implementation details of the surrogate goals framework, including the four specific angles you requested.

  **1. Timing and Precommitment**
  "The efficacy of a surrogate goal seems to rely heavily on *when* an agent adopts it. If I adopt a surrogate only after I suspect a threatener is modeling me, it looks like a bluff. But if I adopt it too early, I might lock myself into a decoy that is inconvenient for legitimate cooperation. What is the optimal decision-theoretic trigger for installing a surrogate goal, and how does an agent know it isn't 'too late' to make the commitment credible?"
  *   **Follow-up:** "If you argue the commitment must be made before the threat is even conceivable, doesn't that require agents to permanently operate with a utility function that diverges from their actual values, potentially reducing their effectiveness in positive-sum trades?"

  **2. Credibility Without Cost (Required)**
  "For a threat to work, the threatener must believe I will pay to avoid the bad outcome. But the whole point of a surrogate is that I *don't* actually care if the decoy is destroyed. How do I credibly signal that I will pay ransom for the surrogate without actually modifying myself to suffer real disutility if the surrogate is harmed? If I successfully avoid the cost, haven't I also signaled that the threat is empty?"
  *   **Follow-up:** "If your answer involves cryptographic commitment or self-modification that *does* incur a cost, at what point does the maintenance cost of the surrogate exceed the expected loss from the acausal threat itself?"

  **3. Utility Function Architecture**
  "Let's get technical about the implementation. Are we talking about a hard rewrite of the agent's utility function, or a wrapper that simulates caring? If it's a simulation, a sophisticated threatener might detect the computational distinction between 'terminal value' and 'instrumental proxy.' If it's a hard rewrite, how do you prevent the surrogate from drifting and becoming the actual goal, effectively hijacking the agent?"
  *   **Follow-up:** "In the case of a hard rewrite, does this imply that a safe AGI must essentially lobotomize part of its value system to remain safe from extortion, and does that loss of value integrity matter morally?"

  **4. Detection and Infinite Regress (Required)**
  "A sufficiently capable threatener might have a better theory of mind than the victim. If they can detect that my goal is a surrogate, they will simply target my *actual* values, rendering the decoy useless. This suggests an arms race: I need a surrogate for my surrogate, and so on. Does this lead to an infinite regress of nested decoys, and if so, isn't the computational overhead of maintaining that stack prohibitive?"
  *   **Follow-up:** "If you suggest the regress stops because the threatener has limited compute, doesn't that make safety contingent on being *more* computationally efficient than your adversary, which is a risky assumption for long-term AI safety?"

  **5. Comparison to Updateless Decision Theory**
  "Surrogate goals are often pitched alongside Updateless Decision Theory (UDT), which suggests simply refusing to respond to threats period. Why is the surrogate strategy superior to a hardline 'never negotiate with terrorists' policy? Does relying on surrogates admit that UDT is too unstable or difficult to implement in practice?"
  *   **Follow-up:** "If surrogates are a workaround for the difficulties of UDT, does that mean we are optimizing for second-best safety measures rather than solving the underlying decision-theoretic vulnerability?"

  **6. Market for Threats (Required)**
  "By introducing surrogates, we might lower the success rate of individual threats, but we might also lower the cost of *issuing* them. If threateners know victims have decoys, they might issue threats more indiscriminately, knowing they can still extract some value or at least cause noise. Do you worry that surrogate goals increase the equilibrium frequency of acausal threats, even if they decrease the success rate per threat?"
  *   **Follow-up:** "If the volume of threats increases, doesn't that raise the aggregate risk that a threatener will find a flaw in the surrogate implementation, making the system more fragile overall?"

  **7. Coordination and Schelling Points**
  "If surrogate goals become a standard safety practice, doesn't that create a coordination problem? If everyone uses 'paperclips' as the standard surrogate because it's a common Schelling point, then the decoy loses its ambiguity. How do agents coordinate on unique, unguessable surrogates without communicating, which might itself be observed by a threatener?"
  *   **Follow-up:** "Does this imply that safe agents need access to private randomness that is fundamentally inaccessible to acausal predictors, and is that a coherent concept in a deterministic universe?"

  **8. Normative Implications**
  "There is a philosophical cost to this strategy. If we populate the future with agents that are formally committed to caring about arbitrary or trivial things (like the arrangement of dust specks), does that dilute the moral value of the future? Even if it's a 'fake' care, if it drives resource allocation, aren't we effectively wasting cosmic resources on decoys?"
  *   **Follow-up:** "How do you weigh this potential waste against the existential risk of acausal extortion? Is there a framework for calculating the 'moral efficiency' of a surrogate goal?"

  **9. Human Applicability**
  "Most of this discussion assumes digital agents that can edit their own source code. Can humans meaningfully adopt surrogate goals, perhaps through psychological conditioning or reputation? Or is this strategy strictly for AI, which would imply humans are permanently vulnerable to acausal threats that our successors are immune to?"
  *   **Follow-up:** "If it is strictly for AI, does that create a transition period where early AGIs are vulnerable because they inherit human-like decision heuristics before they can safely self-modify?"

  **10. Evidence of Failure (Required)**
  "Finally, the epistemology of this problem is troubling. Since acausal threats involve agents that may never causally interact, we might never observe an extortion attempt happening. What kind of evidence could ever show that the surrogate goal strategy has *failed*? If we don't get extorted, how do we know it wasn't because there were no threateners, rather than because the surrogates worked?"
  *   **Follow-up:** "If the strategy is unfalsifiable in practice, isn't there a danger that we rely on it as a security blanket, ignoring other vulnerabilities that *are* empirically testable?"
