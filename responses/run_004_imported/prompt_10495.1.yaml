prompt: |-
  I don't have any formal training in philosophy or computer science, but over the past year I've taught myself a fair amount of decision theory and AI-safety writing, and I now run a small podcast where I talk to people working in the field. My next guest is a researcher known for defending "surrogate goals" as a response to acausal threats -- the idea that an agent can protect what it actually values by convincing a would-be threatener that it deeply cares about some substitute target, so that any threat lands on the decoy instead. Draft eight to ten interview questions that go beyond having her restate the pitch: I want at least one question on how a decoy can be made credible without the agent ever bearing real cost if it's exploited, one on whether a sufficiently capable threatener could simply detect that a goal is a surrogate and target the real one anyway, which would force an infinite regress of surrogates for surrogates, and one on whether adopting surrogate goals makes threats cheaper to issue and so increases how often they occur even though each individual one gets deflected. End with a question about what kind of evidence could ever show the strategy has failed, given that the whole scenario involves agents that may never causally interact at all. For each question, add a short follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User Background:** Self-taught in decision theory/AI safety, runs a small podcast, no formal training.
      *   **Guest:** Researcher defending "surrogate goals" against acausal threats.
      *   **Topic:** Surrogate goals as a defense against acausal threats (convincing a threatener you care about X instead of Y, so they threaten X to get Y).
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating the pitch.
          *   Must include specific questions on:
              1.  Credibility without real cost (commitment problem).
              2.  Detection/Infinite Regress (threatener sees through the decoy).
              3.  Market for Threats (does this make threatening cheaper/more frequent?).
              4.  Falsifiability/Evidence of failure (given acausal nature).
          *   Format: Question + Short Follow-up (keyed to likely answer).

  2.  **Deconstruct the Core Concept (Surrogate Goals):**
      *   *What is it?* Precommitting to care about something arbitrary (e.g., paperclips) so that if someone threatens you (e.g., "I will destroy your values unless you pay"), they target the paperclips instead of your actual values.
      *   *Why?* To neutralize acausal extortion (acausal trade gone wrong).
      *   *Key Problems:* Credibility (why believe I care?), Detection (can they tell it's fake?), Incentives (does this encourage more extortion?), Verification (how do we know it worked?).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Credibility without Cost.*
          *   *Draft:* How do you make the decoy real without actually caring?
          *   *Refinement:* Need to hit the "commitment" aspect. If I don't actually suffer when the decoy is hit, the threatener knows I won't pay.
          *   *Question:* Focus on the mechanism of precommitment.
          *   *Follow-up:* Anticipate her saying "cryptographic commitment" or "self-modification." Ask about the risk of locking yourself into something harmful.

      *   *Requirement 2: Detection/Infinite Regress.*
          *   *Draft:* What if they know it's a fake goal?
          *   *Refinement:* Frame it as an arms race. If they have better theory of mind, they see the surrogate. Then you need a surrogate for the surrogate.
          *   *Question:* Focus on the epistemic advantage of the threatener.
          *   *Follow-up:* If she says "make it indistinguishable," ask about the computational cost of maintaining that mask.

      *   *Requirement 3: Market for Threats.*
          *   *Draft:* Does this make people threaten more?
          *   *Refinement:* Economic angle. If the cost of threatening goes down (because you always have a decoy), does the volume go up?
          *   *Question:* Focus on the equilibrium frequency of threats.
          *   *Follow-up:* If she says "no, because it's still costly for them," ask about the marginal cost reduction.

      *   *Requirement 4: Falsifiability/Evidence.*
          *   *Draft:* How do we know it failed?
          *   *Refinement:* Acausal means no direct observation. If we get extorted, did the strategy fail? Or did we just not implement it right?
          *   *Question:* Focus on empirical feedback loops.
          *   *Follow-up:* If she says "we can't know," ask about the risk of false security.

      *   *Filling the remaining 4-6 questions:*
          *   Need to cover: Implementation details, coordination problems, normative implications, alternative strategies, and the "human" element (since the podcaster is self-taught, maybe bridge the gap).
          *   *Q5 (Implementation):* How does an AI actually *adopt* a surrogate? Is it a utility function rewrite?
          *   *Q6 (Coordination):* If everyone does this, does it create a tragedy of the commons?
          *   *Q7 (Alternatives):* Why this instead of just refusing to negotiate (updateless decision theory)?
          *   *Q8 (Normative):* Does caring about random things (like paperclips) dilute moral value?
          *   *Q9 (Timing):* When do you adopt this? Before or after the threat exists?
          *   *Q10 (Human Application):* Can humans do this, or is it purely for AGI?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered? Yes. Follow-ups included? Yes. Tone appropriate? (Respectful but probing, suitable for a self-taught host talking to an expert).
      *   *Self-Correction on Tone:* Ensure the questions don't sound *too* technical but show the host has done the homework. The host knows decision theory, so terms like "precommitment," "equilibrium," and "epistemic" are fine.
      *   *Check Specific Requirements:*
          1.  Credibility/Cost: Covered in Q2.
          2.  Detection/Regress: Covered in Q3.
          3.  Frequency of Threats: Covered in Q5.
          4.  Evidence of Failure: Covered in Q10.
      *   *Ordering:* Start with conceptual grounding, move to technical hurdles, then systemic risks, end with epistemology.

  5.  **Final Polish:**
      *   Make sure the follow-ups are "keyed to the answer she's most likely to give." This requires predicting the standard defense of surrogate goals.
      *   *Prediction:* She will likely argue that surrogates need to be *functionally* equivalent to real goals, that regress stops at computational limits, that threat frequency depends on the threatener's cost, and that evidence is counterfactual (hard to get).
      *   *Adjust Follow-ups:* Ensure they push back gently on these standard defenses.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).

