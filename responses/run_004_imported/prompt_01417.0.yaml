      *   *Nuance 1: Normative vs. Descriptive.* Aumann's theorem is often used as a benchmark for rationality. If people disagree, either they aren't Bayesian, don't share priors, or don't have common knowledge. The theorem diagnoses the *source* of disagreement, even if the condition isn't perfectly met.
      *   *Nuance 2: Approximate Common Knowledge.* This is the technical counter-argument. Cite Monderer & Samet (1989). "Common p-belief." If we are 99% sure you know, and 99% sure you know I know... posteriors don't have to be *equal*, but they must be *close*. This saves the spirit of Aumann for the real world.
      *   *Nuance 3: The Model of Communication.* TGP assumes message loss is the only barrier. Human communication involves shared physical context (face-to-face), which reduces the "unreliability" parameter significantly, even if not to zero.
      *   *Nuance 4: Priors.* The bigger blocker for humans isn't communication reliability; it's the "same prior" assumption. Humans definitely don't share priors. This is often a bigger deal than the TGP issue.
