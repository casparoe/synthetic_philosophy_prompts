answer: |-
  **London, 1661. A private room near Gresham College.**

  **THOMAS HOBBES** (73 years old, sharp-featured, pacing): You treat words as if they were counters in a game, Mr. Wallis. You move them about, add them, subtract them, and declare you have discovered truth. But if I ask you what the counter *is*, you have no answer but another symbol.

  **JOHN WALLIS** (44 years old, seated, calm): And you, Mr. Hobbes, treat geometry as if it were carpentry. You demand to see the sawdust before you will accept the design. I am the Savilian Professor of Geometry at Oxford. I do not build chairs; I investigate quantity.

  **HOBBES:** Quantity does not exist in the air! There is no quantity without body. To speak of a line is to speak of the trace of a moving point. To speak of a circle is to speak of a radius swung around a fixed center. If your definition does not tell me how to *make* the thing, it is not a definition. It is a riddle.

  **WALLIS:** It is not a riddle; it is an abstraction. When I define a circle as the locus of points equidistant from a center, I am stipulating a relationship. I need not drag a compass across the paper to know the relationship holds. The truth of the proposition resides in the consistency of the definition, not in the ink on the page.

  **HOBBES:** Consistency with what? With other words? You have severed mathematics from the world. In my *Six Lessons*, I showed you that your *Elenchus* was nothing but a net of verbal traps. You mathematicians of the new school, you hide behind algebra. You write $A + B = C$. But what is $A$? Is it a line? A number? If it is a line, you cannot add it to a number. If it is a number, you have left geometry entirely. It is a scab of symbols covering a wound of ignorance.

  **WALLIS:** Algebra is not a scab; it is a lens. It allows the mind to see relations that are too complex for the compass. Euclid was limited by the tools of his age. He could not conceive of the infinite because he could not draw it. I, using the arithmetic of species, can demonstrate proportions that no straightedge could ever scratch onto parchment. Does the result fail? Does the architecture built upon these calculations fall?

  **HOBBES:** The result is irrelevant if the path is nonsense! You cannot reason about things you cannot conceive. Tell me of your indivisibles. You claim a surface is made of lines?

  **WALLIS:** I claim a surface may be *analyzed* as an aggregate of lines. It is a method of summation.

  **HOBBES:** It is a contradiction! A line has length but no breadth. If you stack a thousand lines, you have a thousand lengths and zero breadth. Zero added to zero is zero. You claim to make a body out of no-bodies. It is like trying to fill a bucket with ghosts. You say this is "mathematical certainty"? It is transubstantiation for the learned!

  **WALLIS:** (Leaning forward) You confuse the physical with the mathematical. When I sum the indivisibles, I am not physically gluing lines together. I am employing a ratio. I am saying that the *relation* of the sum of the lines to the whole is as one to infinity. It is a convention of calculation that yields true results. If I calculate the area of a parabola using indivisibles, and I verify it by other means, the method is vindicated. Utility is a form of truth, Mr. Hobbes.

  **HOBBES:** Utility is not truth! A liar may find a useful lie. Truth is causal. To know a geometric truth is to know the generation of the magnitude. I know the square because I know how to construct it. I know the circle because I know the motion that traces it. When you use your algebra, you lose the motion. You are left with static corpses of magnitudes, and you wonder why your demonstrations rot.

  **WALLIS:** And yet, your "generative" method led you to claim the quadrature of the circle.

  **HOBBES:** (Stiffening) My construction is valid.

  **WALLIS:** It is arithmetically impossible. I have shown it. The ratio of the circumference to the diameter is not the ratio you propose. Your motion, however physical you claim it to be, produces a figure that does not match the properties of a true circle.

  **HOBBES:** Your arithmetic is the error! You impose numbers upon magnitudes where they do not belong. You assume you can measure the incommensurable with a finite decimal. My construction works in the continuum. Your numbers break upon it. You say I am wrong because my result does not fit your algebraic conventions. I say your conventions are too narrow to contain the reality of continuous motion.

  **WALLIS:** Conventions? Is logic a convention? If $A$ is greater than $B$, and $B$ greater than $C$, then $A$ is greater than $C$. That is not a convention; it is necessary. My algebraic manipulations follow necessary rules. If your construction violates those rules, the construction is flawed, regardless of how beautifully you describe the motion. You insist that geometry must be physics. But if geometry is physics, it is subject to measurement error, to the roughness of the pen, to the shake of the hand. Mathematics is certain precisely because it is *not* physical. It is ideal.

  **HOBBES:** And that is where you lose God! If your mathematics is not of the world, it is of nowhere. It is a fantasy. I am a materialist, Mr. Wallis. There is no "ideal" realm. There is only body and motion. If your geometry cannot be mapped to body and motion, it is mere noise. You professors sit in your colleges and spin webs of symbols, pretending they are the fabric of the universe. But when the civil order collapses, when men must build fortifications or navigate ships, they need geometry that *works*. They need the generation of the figure.

  **WALLIS:** And they shall have it. But they also need the astronomy that predicts eclipses years in advance, which requires calculations your straightedge cannot perform. They need the navigation that relies on logarithms. Are these "noise"? You dismiss the tools of the future because they do not resemble the tools of the past. You cling to Euclid as if he were Moses.

  **HOBBES:** I cling to Reason. Euclid understood that a definition must be a promise of existence. To define a thing is to assert it can be. You define things that cannot be. An infinite series summed to a finite value? A line made of points? These are absurdities. You have traded certainty for power. You can calculate more, yes, but you understand less. You know *that* it works, but you cannot tell me *why*, because your "why" is buried in a pile of symbols.

  **WALLIS:** I can tell you why. Because the symbols obey the logic of quantity. The "why" is in the deduction, not in the dirt. You demand a mechanical cause for a logical relation. That is a category error. I do not ask for the mechanical cause of the number three. I do not ask how "three" moves. I ask what it relates to.

  **HOBBES:** But three is not a thing! Three men are a thing. Three feet are a thing. You have reified abstractions. You have made a religion of numbers. And now you come to me, in my *Six Lessons*, and tell me I must submit to your Oxford authority. I tell you, no man is the master of reason. If my construction follows from the nature of motion, it is true, even if all the professors in Europe say it is false.

  **WALLIS:** And if your construction contradicts the established demonstrations of Archimedes, validated by a thousand years of scrutiny, then you are not a martyr for reason. You are simply mistaken. But notice, Mr. Hobbes, you do not engage with my arithmetic. You attack the method. You attack the algebra. You attack the indivisibles. Why? Because if you engage with the arithmetic, you must admit the error. So you retreat to philosophy. You make it a war of ontology because you cannot win the war of calculation.

  **HOBBES:** (Pauses, eyes narrowing) I attack the method because the method is the root of the error. If you plant a poisonous tree, do not be surprised when the fruit is bitter. You ask me to accept your calculation while I reject your premises. That is what you call "winning." I call it begging the question. I will not accept a conclusion derived from a falsehood, even if the conclusion looks pretty.

  **WALLIS:** Then we are at an impasse. You will not accept a truth derived from a method you deem ontologically suspect. And I cannot accept a method that yields demonstrable falsehoods, no matter how "physical" the intuition.

  **HOBBES:** It is not an impasse. It is a choice. Will mathematics be the study of the world, or the study of words?

  **WALLIS:** It is the study of relations. Sometimes those relations map to the world. Sometimes they map to other relations. That freedom is what allows us to go beyond the circle and the straightedge.

  **HOBBES:** That freedom is what allows you to lie to yourselves. I shall write again. I have prepared a response to your latest *Elenchus*. I will show again that your indivisibles are nonsense.

  **WALLIS:** And I shall reply. I will show again that your quadrature is arithmetically impossible. We shall print them, side by side. Let the public judge.

  **HOBBES:** The public has no judgment in this. Only reason judges.

  **WALLIS:** Then let us hope reason survives the printing press.

  *(Hobbes gathers his papers, his movements stiff but purposeful. Wallis remains seated, dipping his quill into the inkwell. They do not look at one another.)*

  **HOBBES:** Good day, Professor.

  **WALLIS:** Good day, Mr. Hobbes.

  *(Hobbes exits. Wallis looks down at the paper, where a complex algebraic equation sits beside a sketch of a circle. He draws a line through the sketch, but leaves the equation untouched.)*
