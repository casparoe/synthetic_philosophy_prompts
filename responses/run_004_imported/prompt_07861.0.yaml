              1.  Subject Combination (Many micro-subjects $\rightarrow$ One macro-subject).
              2.  Quality/Palette Combination (Micro-qualities $\rightarrow$ Macro-qualities like red/ache).
              3.  Boundary Problem (Why *this* aggregate and not *that* one?).
          *   Explain why solving one doesn't solve the others.
