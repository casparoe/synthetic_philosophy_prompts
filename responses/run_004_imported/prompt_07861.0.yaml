answer: |-
  Here is a draft of an explanation designed to be spoken aloud in a graduate seminar. It aims to be conversational but metaphysically precise, suitable for students who already know the basics but need to see the underlying structure.

  ***

  "Okay, let's take a step back and look at the 'Combination Problem' again. I know the standard pitch: if electrons have a tiny bit of experience, how do a billion of them add up to *you*? It sounds like an arithmetic problem. It sounds like we just need to find the right formula for mental addition.

  But that intuition is a trap. When we say 'The Combination Problem,' we are actually using a single label for three distinct metaphysical hurdles. And this matters because a solution to one often leaves the other two completely untouched. Your colleague working on Integrated Information Theory noticed this: you can have perfect information integration without necessarily solving the metaphysical puzzle of *who* is doing the experiencing.

  So, I want you to mentally separate this into three different files.

  **The first file is the Subject Problem.** This is the worry about *entities*.
  Imagine you have a billion micro-subjects inside your brain. Let's grant, for the sake of argument, that they can somehow 'merge.' The question is: what happens to *them*?
  If they disappear to make room for *you*, then consciousness isn't truly fundamental at the micro-level anymore; it's emergent, and we've lost the main motivation for panpsychism.
  But if they *don't* disappear—if they are still there alongside you—then who is the 'you' that is reading this slide? Are you just a collection of billion little thinkers? If so, there is no single subject having a unified experience. There is just a crowd.
  The hard part here is the privacy of subjectivity. I can't feel your pain. So how do a billion private 'I's become a single private 'I'? Solving this requires explaining how subjects compose, not just how their data connects. You can have perfect causal integration without subject composition.

  **The second file is the Quality Problem.** Sometimes called the 'Palette Problem.'
  Let's assume you solve the Subject Problem. Let's say there is definitely one single 'you' emerging from those billion micro-entities. The question now is: *what does it feel like?*
  Micro-experiences, by hypothesis, are incredibly simple. They are bare, primitive glimmers. Your experience right now is incredibly rich: the specific red of the stop sign, the ache in your lower back, the taste of coffee.
  How do you get *that* specific qualitative richness out of *this* boring micro-repertoire?
  Think of it like color mixing. If you mix blue paint and yellow paint, you get green. But if you mix a 'blue experience' and a 'yellow experience,' do you get a 'green experience'? Or do you just get a subject experiencing blue-and-yellow simultaneously?
  You could have a unified subject—a solved Subject Problem—who is nonetheless experiencing a billion tiny, disjointed, boring feels, rather than one complex, rich feel. Solving the unity of the subject does not automatically solve the complexity of the quality.

  **The third file is the Boundary Problem.**
  This is the worry about *vagueness*.
  Physics doesn't really care about boundaries. There are particles here, and particles there, and forces connecting them. But consciousness seems 'all or nothing.' Either there is a subject there, or there isn't.
  So, why *this* aggregate? Why does the collection of particles in my skull constitute a subject, but the collection of particles in this rock does not?
  And it's trickier than that. Why does the subject stop at my skull? Why isn't the subject 'me-plus-the-chair'? Or, why isn't the subject just 'the-left-half-of-my-brain'?
  If combination is possible, what prevents it from happening everywhere? If particles can combine to make a mind, why aren't there minds overlapping everywhere, in every arbitrary arrangement of matter?
  You could have a perfect story about how subjects combine (File 1) and how qualities mix (File 2), but still have no principled reason for why the combination stops at the skin. Without a solution to the Boundary Problem, panpsychism risks implying that everything is a subject, or that subjects are wildly overlapping in ways that don't match our intuition.

  **So, here is the takeaway:**
  If you propose a theory based on 'information integration,' you might be addressing the Boundary Problem (defining which systems count), but you haven't explained how micro-subjects vanish into a macro-subject (File 1), nor how simple qualities become complex ones (File 2).
  If you propose a theory about 'qualitative blending,' you haven't explained why the blending stops at the brain (File 3).
  They are orthogonal. You have to pay the metaphysical cost for each one separately.

  **A final note on Cosmopsychism.**
  Some of you might think, 'Aha, I'll avoid this by going top-down.' Instead of building up from electrons, let's say the Cosmos is the one fundamental subject, and we are fragments of it.
  But notice: you haven't escaped the problem; you've just mirrored it.
  Now you face the **Decombination Problem**.
  If the Cosmos is one unified subject, how does it fracture into *me* and *you*? How does the One become the Many without ceasing to be One?
  You still have to explain the boundaries. Why am I cut off from your experience? If the Cosmos is the fundamental subject, why don't I feel what you feel?
  The structural difficulty remains identical. Whether you build up or carve down, you still have to explain the relationship between the fundamental level of experience and the derived level of experience. The bump in the rug just moves; it doesn't disappear."
