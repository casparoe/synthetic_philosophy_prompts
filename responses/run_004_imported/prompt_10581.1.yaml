      *   **Anti-Egalitarian Conclusion (AEC):** A population with inequality is better than an equal one, given certain total welfare constraints.
      *   **Arrhenius's Theorem:** You can't satisfy all adequacy conditions. You *must* accept at least one of these "ugly" conclusions.
      *   **The Trade-off:** Avoiding RC often leads to SC. Avoiding SC often leads to RC. You're stuck.

