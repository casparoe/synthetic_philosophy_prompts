answer: |-
  This is a fantastic rabbit hole to fall down, and your intuition is correct: the distinction between finks and masks is not just technical nitpicking. It cuts to the heart of what a disposition *is*—whether it is a stable property of an object (or person) or merely a prediction of behavior under specific conditions.

  Here is the breakdown of why finks and masks are ontologically distinct, why Lewis's fix handles one but not the other, and how this maps surprisingly well onto Marguerite's courage.

  ### 1. The Ontological Distinction: Basis vs. Causal Chain

  To understand why philosophers treat these as separate problems, we have to look at what happens to the **intrinsic categorical basis** (the physical or psychological structure that grounds the disposition).

  **The Fink (C.B. Martin): The Basis is Unstable**
  In a fink case, the triggering condition causes the *disposition itself* to vanish (or appear).
  *   **The Scenario:** A wire is dead. A device detects touch and instantly makes it live.
  *   **The Analysis:** "If struck, it would shock" is true. "It is live" is false.
  *   **The Mechanism:** The stimulus ($S$) alters the intrinsic basis ($B$). The wire does not possess the basis *at the moment of stimulus* in the way required to ground the disposition. The property is **counterfactually dependent on the stimulus in a way that destroys the property.**
  *   **Key Feature:** The disposition is not a stable property; it is a fleeting state that evaporates upon contact with the test.

  **The Mask (Mark Johnston): The Causal Chain is Interrupted**
  In a mask case, the basis remains perfectly intact, but something extrinsic prevents the manifestation.
  *   **The Scenario:** A glass is fragile. It is wrapped in perfect bubble wrap. It is struck. It does not break.
  *   **The Analysis:** "It is fragile" is true. "If struck, it would break" is false (because of the wrap).
  *   **The Mechanism:** The stimulus ($S$) occurs. The basis ($B$) persists. But an extrinsic factor ($E$) intervenes between $B+S$ and the Manifestation ($M$).
  *   **Key Feature:** The disposition is a stable property, but the **conditional analysis fails to account for extrinsic interferers.**

  **Why they are distinct:**
  A fink attacks the **possession** of the power. A mask attacks the **exercise** of the power.
  *   In a fink case, the object *ceases to be* what it was supposed to be when tested.
  *   In a mask case, the object *remains* what it is, but the world refuses to let it show it.

  ### 2. Why Lewis's Reformed Conditional Analysis (RCA) Splits the Difference

  David Lewis realized the Simple Conditional Analysis ("Disposed iff If S then M") was too brittle. He proposed the **Reformed Conditional Analysis**:

  > $x$ is disposed to $M$ in response to $S$ at time $t$ iff $x$ has some intrinsic property $B$ at $t$ such that, if $x$ were to undergo $S$ at $t$ and **retain $B$ for long enough**, $S$ and $B$ would jointly cause $M$.

  **Why this kills the Fink:**
  Lewis adds the clause: *"and retain $B$."*
  In the electro-fink case, the wire does not have the basis ($B = \text{being live}$) at time $t$ (before touch). It acquires it *upon* touch. Therefore, it fails the condition of *having* $B$ at $t$. Alternatively, if it had $B$ and lost it instantly upon touch, it fails the *"retain $B$"* clause. Lewis successfully anchors the disposition to a stable intrinsic state that must persist through the stimulus. The fink is exposed as a cheat because the basis isn't stable.

  **Why this dies to the Mask:**
  Lewis's fix requires the basis to persist, which it does in masking cases. The poison *has* the chemical structure ($B$). It *retains* $B$ when swallowed ($S$).
  However, the RCA concludes: "$S$ and $B$ would jointly **cause** $M$."
  In the mask case (Poison + Antidote), $S$ and $B$ do *not* cause $M$. The antidote breaks the causal chain.
  Lewis's analysis assumes that if you have the basis and the stimulus, the manifestation follows *ceteris paribus* (all else being equal). Masks show that "all else" is rarely equal. The RCA cannot rule out extrinsic preventers without becoming so complex it loses its utility. It fixes the *internal* stability (finks) but cannot guarantee *external* permission (masks).

  ### 3. Application to Marguerite: Masked Virtue vs. The Authorial Fink

  This distinction is actually a profound tool for your novel. It gives you a metaphysical vocabulary for the difference between "untested virtue" and "authorial cheating."

  **Marguerite as a Masked Disposition (The Valid Path)**
  If Marguerite truly has courage, she possesses the **intrinsic categorical basis** of courage. In psychological terms, this isn't just "acting brave"; it's a specific configuration of values, emotional regulation, and neural pathways.
  *   **The Mask:** Her good luck is the bubble wrap. It prevents the *manifestation* (visible heroic action) but does not negate the *basis* (her internal resolve).
  *   **How to make it earned:** You must show the reader the **basis**, not the manifestation.
      *   Don't wait for the big battle to show she's brave.
      *   Show her managing fear in low-stakes environments.
      *   Show her *wanting* to do the hard thing but being thwarted by circumstance (the mask).
      *   Show her internal reaction to the "convenient outs." Does she feel relief (cowardice)? Or does she feel frustration that she wasn't allowed to stand firm (courage masked)?
      *   If she feels frustration, the basis is present. The disposition is real, just masked.

  **Marguerite as a Finkish Disposition (The Cheat)**
  If you write her as having courage, but the moment a real threat appears her psychology fundamentally shifts (she panics, she rationalizes, she breaks), that is a **fink**.
  *   The stimulus (danger) causes the basis (courage) to vanish.
  *   If you pull the reveal that "she was brave all along" after she has consistently demonstrated finkish behavior (losing her nerve exactly when tested), the reader will feel cheated. You are asserting a stable property ($B$) that the text has proven is unstable.

  **Marguerite as a Mimic (The Other Trap)**
  There is a third problem in disposition literature: **Mimics**. (e.g., a piece of wood treated to look and sound like glass when struck, but not actually fragile).
  *   This is if Marguerite *acts* brave (manifestation) but lacks the internal basis (she's just reckless, or ignorant of the danger).
  *   If your reveal is "She wasn't actually brave, she just didn't know she was in danger," that's a Mimic reveal. It works, but it's a tragedy/cynical twist, not a validation of virtue.

  ### The Narrative Takeaway

  The philosophy suggests that **virtue is a power (a disposition), not an event (a manifestation).**

  To make the reveal earned, you need to prove to the reader that Marguerite has the **intrinsic basis** of courage *before* the **mask** is removed.
  *   **Fink-proofing:** Show that her character is stable. When small inconveniences happen, does she hold her ground? If her "courage" only exists when there's no risk, that's a fink.
  *   **Mask-acknowledgment:** Let the reader see her *trying* to be brave. Let her step forward and be pulled back by the plot. If the reader sees her *willingness* to manifest the trait, the fact that the trait hasn't manifested yet becomes a tension (the mask), not a plot hole (the absence of the trait).

  Lewis's failure on masks is actually good news for you. It implies that **having a disposition does not guarantee its manifestation.** You are philosophically licensed to have a courageous character who hasn't done a courageous thing yet, provided you show us the *machinery* of that courage (the basis) is installed and waiting for the circuit to close.

  If you show us the wiring, we'll believe the light will turn on when you finally flip the switch. If you just tell us the light works, but the bulb is missing, that's when the reader throws the book.
