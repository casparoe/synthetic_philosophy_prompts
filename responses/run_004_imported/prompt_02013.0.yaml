  *(Self-Correction during final review)*: Wait, I need to be careful about the singlet state. In a singlet state, the total spin is 0. One is up, one is down relative to an axis. But before measurement, are they distinct? The wavefunction is antisymmetric. $\psi = \frac{1}{\sqrt{2}} (|\uparrow\downarrow\rangle - |\downarrow\uparrow\rangle)$. You can't label them "electron 1 is up". They are entangled. This supports the user's view. I will emphasize the *indistinguishability* in the statistical sense.

