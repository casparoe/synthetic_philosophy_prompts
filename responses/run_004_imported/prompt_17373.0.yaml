answer: |-
  This is a fantastic bar fight. It's rare to hear the "Modularity of Mind" debate (Mara's position) clash with "Cognitive Penetration" (Theo's position) over a handball call, but you've described the core tension in philosophy of perception perfectly.

  Here is the move-by-move breakdown of who held the stronger ground at each stage, followed by the angle that dissolves the whole fight.

  ### Round 1: The Opening Salvo
  **Theo:** Fans literally *see* different things (different perceptual experience).
  **Mara:** Physics dictates same input (photons). Difference is judgment/labeling, not seeing.

  **Winner: Mara (on technicality), Theo (on intuition)**

  Mara wins the opening on **physicalist grounds**. Her argument relies on the "common cause" principle: if the light hitting the retinas is identical, the raw sensory data is identical. In philosophy, this is the "Modularity of Mind" thesis (championed by Jerry Fodor), which argues that low-level perception is "encapsulated"—it doesn't care what you believe or want. It's a very strong default position because it keeps reality objective.

  However, Theo wins on **phenomenological grounds**. He is describing how it *feels*. If you ask a fan, "Did you see a handball?" they don't say, "I saw an arm near a ball and inferred a foul." They say, "I saw a handball." Theo is correctly identifying that our conscious experience is already processed. Mara's distinction between "seeing" and "judging" is clean in theory but messy in actual human experience.

  **Verdict:** Mara has the stronger *scientific* framework, but Theo has the stronger *descriptive* account of human experience.

  ### Round 2: The Speed Argument
  **Theo:** Reactions (groans/cheers) happen before conscious thought/ref whistle. Too fast for "judgment." Must be perceptual.
  **Mara:** Speed doesn't prove perception changed. Expectations guide attention and categorization *very* quickly (System 1 thinking). Still downstream of sensation.

  **Winner: Theo**

  This is Theo's strongest moment. He identifies a timing gap in Mara's model. Mara suggests that bias happens *after* seeing ("downstream"). Theo points out that the reaction is practically simultaneous with the event.

  Neuroscience backs Theo up slightly here. Top-down processing (your brain sending signals *down* to the visual cortex based on expectations) happens incredibly fast, often modulating visual processing before you are consciously aware of the image. Mara's defense—that it's just "fast filing"—is possible, but it starts to sound like she's moving the goalposts. If the "filing" happens instantly and automatically without conscious intervention, at what point is it distinct from "seeing"? Theo successfully exposes that Mara's "judgment" might be doing too much heavy lifting to save her theory.

  ### Round 3: The Falsifiability Trap
  **Mara:** No experiment can distinguish "saw different" vs. "filed different." Theo's claim is unfalsifiable/rigged.
  **Theo:** If no evidence counts, you've rigged the game. That doesn't make you right.

  **Winner: Mara (Methodologically), Theo (Philosophically)**

  Mara lands a heavy blow here using a principle from the philosophy of science (verificationism). If two theories predict the exact same behavior (cheering vs. groaning) and the same brain scans, but one claims "reality A" and the other "reality B," the difference might be meaningless. She is demanding a "smoking gun" that Theo cannot provide.

  Theo's counter is a classic philosophical defense: **Inference to the Best Explanation.** Just because something is hard to measure doesn't mean it isn't real (e.g., pain, consciousness, love). He is accusing Mara of "definitional victory"—defining "seeing" so narrowly that she can't lose, even if her definition doesn't match reality.

  **Verdict:** Mara wins the debate on **rigor** (she set a standard Theo can't meet). Theo wins the debate on **truth** (he points out that strict standards can sometimes blind you to reality).

  ---

  ### The Missing Angle: The Predictive Brain

  Both Theo and Mara are operating under an old model of how vision works. They both assume there is a clear line between **Bottom-Up Processing** (photons hitting the eye, building an image) and **Top-Down Processing** (beliefs and desires interpreting that image).

  *   **Mara thinks:** Bottom-Up creates the image; Top-Down labels it.
  *   **Theo thinks:** Bottom-Up creates the image; Top-Down *alters* the image.

  **The angle they are both missing is Predictive Processing (or Predictive Coding).**

  Modern neuroscience and cognitive science increasingly suggest that the brain does not build perception from the bottom up at all. Instead, the brain is a **prediction machine**. It is constantly hallucinating what it expects to see, and it only uses the photons coming from the eyes to *correct* errors in that prediction.

  In this model, there is no "pure seeing" that exists before belief or expectation.
  1.  **Mara is wrong** because there is no neutral "raw feed" of photons that gets passed up to a judgment center. The "expectations" she dismisses are actually part of the visual machinery itself.
  2.  **Theo is wrong** (sort of) because it's not that loyalty "warps" a true image. It's that the brain's primary job is to serve the organism's needs (including tribal loyalty), so the "image" is constructed *for* that purpose from the very first millisecond.

  **How this applies to the Handball:**
  When the ball hits the arm, the rival fans' brains aren't receiving an image and then arguing about it. Their brains are predicting the outcome based on their tribal identity.
  *   **Fan A's Brain:** Predicts "My team is innocent." The visual system minimizes the signal of the handball to match the prediction.
  *   **Fan B's Brain:** Predicts "Their team cheats." The visual system amplifies the signal of the arm movement.

  They aren't seeing the *same* thing and judging it differently (Mara). Nor are they seeing the *same* thing and having it magically warped (Theo). They are literally **constructing different realities** to minimize "prediction error."

  ### The Final Scorecard

  *   **Mara** had the better grasp of **physics and scientific method**. She was right that we share a physical world and that claims need evidence.
  *   **Theo** had the better grasp of **psychology and human nature**. He was right that belief changes experience, not just opinion.
  *   **The Reality:** They are both stuck in a "Camera Model" of the brain (input -> process -> output). If they adopted the "Projector Model" (predict -> check -> update), they'd realize that **perception is a controlled hallucination.**

  So, who won the bar bet? Technically, neither. But Theo walked away closer to the truth about how the brain works, while Mara walked away closer to the truth about how to argue without losing your mind. Given they were at a bar arguing about sports, Mara probably had the more useful philosophy for keeping friends.
