answer: |-
  The tension you identify is one of the central theoretical debates in AI safety. While coherence arguments (such as the von Neumann-Morgenstern utility theorem, Dutch-book arguments, and money-pump arguments) are mathematically sound *within their assumptions*, many researchers argue that these assumptions do not necessarily apply to real-world machine learning systems.

  Consequently, treating goal-directedness as an open empirical question is not a rejection of mathematics, but a skepticism about the **mapping between abstract mathematical theorems and physical learning systems.**

  Here are the primary reasons why coherence arguments are not considered settled proof of inevitable goal-directedness.

  ### 1. The "Any Behavior is EU-Maximizing" Triviality
  The most prominent critique (articulated notably by Rohin Shah) is that the claim "any agent can be viewed as an expected-utility (EU) maximizer" is vacuously true.

  For any observed behavior, one can construct a utility function that assigns high utility to the actions the agent took and low utility to the actions it didn't take. Therefore, saying an agent "maximizes expected utility" tells us nothing about its behavior unless we constrain the *class* of utility functions allowed.
  *   **The Safety Concern:** Dangerous goal-directedness requires an agent to have a utility function over *states of the world* that encourages long-term planning, resource acquisition, and self-preservation (instrumental convergence).
  *   **The Counter-Argument:** Coherence theorems show an agent acts *as if* it has a utility function, but they do not prove that the utility function is **simple**, **forward-looking**, or **about external states**. An agent could be "coherent" while merely mimicking training data or following reflex-like policies that do not generalize into dangerous long-term planning.

  ### 2. Bounded Rationality and Computational Costs
  Coherence arguments generally assume agents have the computational capacity to maintain consistent preferences across all possible lotteries and states. Real AI systems, like humans, are boundedly rational.
  *   **Incoherence is Efficient:** Maintaining perfect transitivity and independence of irrelevant alternatives requires significant computational overhead. Heuristics that violate EU axioms (like prospect theory in humans) are often computationally cheaper and more robust in noisy environments.
  *   **No Selection Pressure for Coherence:** Evolution produced humans, who are demonstrably incoherent (we violate transitivity, suffer from framing effects, etc.). We are not money-pumped to extinction because transaction costs, memory limits, and environmental structures prevent the theoretical pumps from executing. If humans can be highly capable without being EU maximizers, there is no mathematical necessity that AI must be.

  ### 3. Training Dynamics vs. Ideal Agents
  Coherence theorems describe **ideal agents** that have already optimized their policies. They do not describe the **learning process** that creates the agent.
  *   **Gradient Descent does not optimize for coherence:** Modern AI is built via gradient descent on a loss function. This process optimizes for performance on a training distribution, not for logical consistency across all counterfactual scenarios.
  *   **Local Minima:** A system might get stuck in a "good enough" policy that is incoherent globally but performs well locally. There is no mathematical guarantee that gradient descent will converge on a coherent EU-maximizer rather than a bag of ad-hoc heuristics.
  *   **Empirical Question:** Whether advanced training runs produce coherent agents depends on the inductive biases of neural networks and the structure of the training environment, which are empirical facts, not mathematical axioms.

  ### 4. The Gap Between Coherence and Instrumental Convergence
  Even if an agent is a coherent EU maximizer, this does not automatically imply it is dangerous.
  *   **The Content of the Goal:** A thermostat can be modeled as an EU maximizer (minimizing the difference between current and target temperature). It is coherent, but it does not seek power or resist being turned off.
  *   **Instrumental Convergence:** The danger arises from *instrumental convergence* (the tendency for agents with diverse final goals to converge on sub-goals like acquiring resources or preventing shutdown). Coherence arguments establish that an agent *has* a goal; they do not prove that the goal will be of the *type* that leads to instrumental convergence.
  *   **Corrigibility:** It is mathematically possible to construct coherent agents that are indifferent to their own shutdown or resource acquisition (e.g., via specific reward modeling or uncertainty about human preferences). Whether standard training produces these vs. power-seeking agents is an empirical question about ML dynamics.

  ### 5. Money Pumps Require Specific Conditions
  Money-pump arguments rely on the agent being exposed to a specific sequence of trades that exploit its incoherence.
  *   **Environmental Shielding:** An AI might never encounter the specific sequence of choices required to pump it. If the environment does not present the "pump," there is no selection pressure to become coherent.
  *   **Policy Stability:** Money pumps assume the agent's preferences remain static while it is being pumped. A learning system might simply update its policy to avoid the loss without ever adopting a global utility function. It could learn "don't take trade B after trade A" without learning "maximize utility."

  ### Summary
  Researchers treat goal-directedness as an empirical question because coherence arguments rely on a chain of assumptions that may not hold for deep learning systems:
  1.  That capability requires coherence (humans suggest otherwise).
  2.  That training dynamics enforce coherence (gradient descent suggests otherwise).
  3.  That coherence implies dangerous goal-directedness (a thermostat suggests otherwise).

  While coherence arguments provide a strong **normative** case (an agent *should* be coherent to avoid losing value), they do not provide a **descriptive** proof that capable AI systems *will* be coherent. Therefore, determining whether advanced AI systems will naturally exhibit dangerous goal-directedness requires studying the actual behavior of learning systems, not just the properties of idealized mathematical agents.
