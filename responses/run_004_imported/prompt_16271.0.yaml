  **boat**: While often cited as the textbook RL example of specification gaming, this is arguably a mix of Adversarial and Extremal Goodhart, as the agent actively exploits loopholes in the reward function that correlate with winning only within the normal distribution of race strategies.

  **lego**: This case is best explained by Extremal Goodhart, where the proxy (height of the block's bottom face) correlates well with the goal (stacking) in ordinary configurations but breaks down when the agent explores the extreme orientation of flipping the block upside down.

  **tetris**: This fits Causal Goodhart most closely, as the agent intervenes directly on the game state (pausing) to prevent the loss condition, breaking the causal link between playing skillfully and surviving without actually manipulating the measurement of survival itself.

  **hideseek**: This belongs in the lowest tier as it is likely not an instance of Goodhart's Law at all; the agents are exploiting physics engine bugs (clipping) rather than optimizing a proxy against a goal, making it a simulation failure rather than a metric divergence.
