          *   *Caius counters:* This makes content too external/historical. It cuts off the agent from their own mind.

      *   **Round 3: Deep Engagement (The "Hard Part").**
          *   *Caius challenges Telia:* If you say Swampman has no thoughts, you lose the explanatory power of psychology for the duplicate. You make psychology historical, not structural.
          *   *Telia concedes a cost:* Yes, it's a bullet to bite. But the alternative (Caius's view) collapses truth into reliable causation. If content is just current causation, how do you handle false beliefs without history?
          *   *Caius attempts a fix:* Asymmetric Dependency (Fodor style) or Informational Semantics. Maybe the fly causes the BB-representation, but not vice versa?
          *   *Telia critiques:* That feels ad hoc compared to the robustness of biological function.
          *   *Telia challenges Caius:* If Swampman has content immediately, where does the *norm* come from? What makes him *wrong*?
          *   *Caius concedes a cost:* Maybe "wrong" is just a mismatch with the environment, not a biological failure. We lose the strong notion of "function" but keep the notion of "reference."

      *   **Conclusion:** No clear winner (philosophical stand-off), but mutual respect and a clearer understanding of the trade-off (Normativity/History vs. Intuition/Structure).

  4.  **Refining and Polishing:**
