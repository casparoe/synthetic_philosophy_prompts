answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Rain streaks the window. Two philosophers, Telia (Teleosemanticist) and Caius (Causal/Counterfactual Theorist), are finishing their espressos.*

  **Caius:** You know, I've been reading your latest draft on normative functions. It's elegant, Telia, really. But I keep hitting the same wall. You tie content to evolutionary history. You say a mental state represents *X* because the mechanism producing it was *selected* for detecting *X*.

  **Telia:** That's the gist. It's the only way to naturalize normativity. To have content is to have conditions of satisfaction. To be wrong.

  **Caius:** Right, error. That's where I want to start. Let's go back to the frog. The classic case. A neuron fires when a small, dark, moving speck enters the visual field. Usually, it's a fly. Sometimes, it's a BB pellet flicked by a cruel grad student. You say the content is "Fly." I ask: Why not "Fly-or-BB"?

  **Telia:** Because the frog's digestive system wasn't designed to digest BBs. The mechanism exists because, in the past, detecting flies conferred a reproductive advantage. Detecting BBs did nothing. When the neuron fires for a BB, it is malfunctioning. It is misrepresenting the world.

  **Caius:** But look at the causal structure *right now*. In this exact moment, the causal chain from BB to neuron is identical to the chain from Fly to neuron. The physics is the same. If you freeze time and look at the frog's head, there is no physical marker that says "This firing is for flies only." You're smuggling in a ghost—the ghost of Evolution Past—to haunt the present machine.

  **Telia:** I'm not smuggling a ghost; I'm identifying the *type*. A heart beats because of hydraulic pressure, yes. But it is a *heart*—and not just a pulsing muscle—because it was selected to pump blood. Without that history, you can't distinguish a heartbeat from a spasm. Same with the frog. Without history, you can't distinguish a false belief from a true one. You just have reliable and unreliable causation.

  **Caius:** And that brings me to my hammer. Swampman.

  **Telia:** *[Sighs]* I knew you'd bring him up.

  **Caius:** Lightning strikes a swamp. Molecules assemble. A molecule-for-molecule duplicate of you appears. He has no history. No evolutionary past, no learning history. He walks out, sees a tree, and says, "That's a tree." According to you, Telia, Swampman has no thoughts. He represents nothing.

  **Telia:** Strictly speaking? Yes. He has no intentional states.

  **Caius:** That is the bullet I cannot watch you bite. Swampman screams if you pinch him. He navigates around obstacles. He writes papers on semantics. If he points at a cat and says "Dog," we all agree he made a mistake. But on your view, he didn't make a mistake. He made *nothing*. He's a zombie.

  **Telia:** He's a behavioral zombie regarding content, yes. Here is the difficulty I have to accept, Caius: I admit it violates the intuition that intrinsic structure determines mind. But consider the alternative. If Swampman has content immediately, based solely on his current causal connections, tell me: What makes him *wrong* when he points at the cat and says "Dog"?

  **Caius:** The causal covariance! In his environment, the word "Dog" is causally linked to dogs. The cat is not a dog. The link is broken.

  **Telia:** But why is that link the *standard*? Why isn't the content "Cat-or-Dog-lookalike"? If content is fixed by current causal dependencies, then whenever Swampman says "Dog" in the presence of a cat, he is causally linked to that cat. So, isn't his content simply "Thing-that-causes-this-state"? If so, he's never wrong. He's just causally hooked up to cats now.

  **Caius:** *[Leans forward]* I can handle that. I don't need history to get error. I need *counterfactuals*. We look at the asymmetric dependencies. The state is caused by cats *only because* it is normally caused by dogs. If dogs didn't cause it, cats wouldn't either. The cat-dependence is parasitic on the dog-dependence.

  **Telia:** But how do you ground that asymmetry without history? Why is the dog-link the "real" one and the cat-link the "parasitic" one? In Swampman's first second of existence, both links are brand new. There is no time for one to be primary and the other parasitic. You need a timeline to establish asymmetry. You need... history.

  **Caius:** Or you need laws of nature. Maybe the laws of physics dictate that "Dog" tracks dogs more reliably than cats under optimal conditions.

  **Telia:** "Optimal conditions." There it is. You're trying to normalize the present without a norm-giver. You say "optimal," I ask "optimal for what?" For survival? For reproduction? That's function. That's *my* territory. If you strip out the biological function, "optimal" is just "what usually happens." And if it's just what usually happens, then the rare cases aren't *errors*, they're just statistics.

  **Caius:** Okay, let's grant you that. Let's say you solve the Disjunction Problem. You save the notion of Error with your history. The cost is Swampman. You're telling me that if I duplicate a human brain perfectly, I haven't duplicated the *mind*. I've just duplicated the hardware.

  **Telia:** I'm telling you I've duplicated the *syntax*, not the *semantics*.

  **Caius:** But that makes content epiphenomenal! If Swampman behaves exactly like me, reasons exactly like me, and writes papers exactly like me, but lacks content... then content isn't doing any work in explaining the behavior. The causal structure explains the behavior. The "aboutness" is just a label we stick on things with the right pedigree.

  **Telia:** *[Pauses, stirring her coffee]* That is the cost. I accept it. If naturalism is true, content *must* be a relational property, not an intrinsic one. It's like being a "parent." You can have two identical men. One has a child; one doesn't. The one without the child isn't a parent, even if he acts like a father. Swampman isn't a thinker yet. He becomes one only when he starts interacting with the world and establishing new functions.

  **Caius:** But that takes time. Seconds? Years? When does the light turn on?

  **Telia:** When new selected functions emerge. Maybe through learning.

  **Caius:** This feels like magic. You're saying the physical state is identical, but the mental status is null. Look, Telia, I have my own problem. I know I do. The Disjunction Problem is hard. Explaining why "Fly" doesn't become "Fly-or-BB" without appealing to history requires complex, fragile counterfactuals. I admit that. If I ground content in current causation, I struggle to explain why some causal links are "mistakes" rather than just "new data."

  **Telia:** Exactly. Without history, the world just *is* what triggers you.

  **Caius:** But your solution makes the mind opaque to the agent. If I am a brain in a vat, hooked up to a simulation, and I've been here since birth... do I have thoughts?

  **Telia:** On a strict teleosemantic view? No. Your states have no function relative to the vat world, and their evolutionary function relative to the real world is severed. You are misrepresenting everything, or representing nothing.

  **Caius:** That's the stand-off, isn't it?

  **Telia:** It seems so.

  **Caius:** Here is where I press you. If your theory implies that a perfect duplicate of a human has no mind, isn't that a *reductio* of the theory? Intuition isn't everything, but if a theory tells me that Swampman doesn't fear death, doesn't love his friends, and doesn't know the sky is blue... the theory has lost the phenomenon it was meant to explain.

  **Telia:** And if my theory tells me that a state triggered by a BB is a "representation of a BB" just because it fired, then I have lost the distinction between truth and falsehood. I have lost the ability to say the frog is *mistaken*.

  **Caius:** So you choose Normativity over Intuition.

  **Telia:** I choose Explanation over Comfort. I want to know what makes a belief *true* or *false*. You want to know what makes a system *think*.

  **Caius:** But aren't they the same thing? To think is to trade in truths and falsehoods.

  **Telia:** Precisely. But you can't have truths and falsehoods without a standard. And standards come from history. Swampman has no standard yet. He is a book written in a language no one has spoken, not even him.

  **Caius:** And I say he is speaking English perfectly well, he just happens to have appeared out of thin air. If you say he has no content, you make content dependent on something outside the cognitive system. You make psychology historical, not structural.

  **Telia:** *[Nods slowly]* I do. I make psychology biological.

  **Caius:** And I make it nomic. Based on laws and causal powers.

  **Telia:** Then we are at the impasse. The Frog demands history to distinguish the BB. Swampman demands structure to distinguish the Zombie.

  **Caius:** And neither case lets us sleep easy.

  **Telia:** No. But at least we know what keeps us awake. You fear losing the mind in the machine. I fear losing the truth in the cause.

  **Caius:** *[Raises his espresso cup]* To the stand-off.

  **Telia:** *[Clinks her cup against his]* To the stand-off.
