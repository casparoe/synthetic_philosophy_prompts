      *   **Causal/Counterfactual Theorist (Caius):** Needs to emphasize the intuitive immediacy of content and the explanatory irrelevance of history. Needs to defend against the disjunction problem (why is it a fly and not a fly-or-BB?).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. A quiet academic setting, maybe a coffee shop or office. Establish the stakes (naturalizing intentionality).

      *   **Round 1: The Frog and the Disjunction Problem.**
          *   *Caius starts:* Attacks Teleosemantics with the BB pellet. If the neuron fires for flies and BBs, why isn't the content "fly-or-BB"?
