      *   **Key Thought Experiments:** The Frog-and-BB-Pellet case (disjunction problem) and Swampman (history vs. current structure).
      *   **Format:** A dialogue between two committed theorists.
      *   **Constraint:** Each side must *engage* with the specific difficulties raised by the other, not just restate their position. They need to show the tension and attempt to resolve or acknowledge the cost.

  2.  **Character Development:**
