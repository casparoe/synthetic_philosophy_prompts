answer: |-
  **MEMORANDUM**

  **TO:** Attending Surgical Team, Patient Care Services, Legal Counsel
  **FROM:** Clinical Ethics Committee (CEC)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Decision-Making Capacity and Consent for Patient [Initials]

  **I. CASE SUMMARY**
  The patient is an adult female with a longstanding diagnosis of autism spectrum disorder and severe intellectual disability (ID). She is nonverbal. Her parents, acting as legal surrogates, have consented to a medically necessary surgical procedure. Recently, the patient has begun using a letterboard with the assistance of a facilitator who physically steadies the board. Through this method, the patient has reportedly expressed a refusal of the surgery. The clinical team faces a conflict between the surrogates' consent and the patient's expressed refusal via letterboard. The surgery is time-sensitive and cannot be delayed indefinitely.

  **II. ETHICAL ANALYSIS**
  The Committee identifies three primary ethical tensions: respect for autonomy, assessment of decision-making capacity, and the validity of the communication method.

  1.  **Presumption of Capacity vs. Evidence of Impairment:** While there is an ethical imperative to presume competence in all patients, the patient's longstanding diagnosis of severe intellectual disability establishes a baseline of impaired decision-making capacity. A new claim of capacity—specifically one that contradicts the clinical baseline—requires robust verification.
  2.  **Validity of Communication Method:** The method in question (letterboarding with physical facilitation) shares characteristics with Facilitated Communication (FC) and the Rapid Prompting Method (RPM). Major professional organizations (including the AAP, APA, and ASHA) caution against these methods due to the **ideomotor effect**, where facilitators unconsciously guide the patient's hand. Research indicates that when facilitators are blinded to information, authorship often cannot be confirmed. The "fluency" and "insight" noted by some committee members are consistent with documented cases of unconscious facilitator influence.
  3.  **Surrogate Authority:** In the absence of validated capacity, legal authority reverts to the appointed surrogates (the parents), who are obligated to decide based on the patient's best interests and known values.

  **III. COMMITTEE DECISION**
  **The patient's spelled refusal does not currently override her parents' consent.**

  The Committee determines that the letterboard communication, while compelling in appearance, does not meet the burden of proof required to establish independent decision-making capacity in the context of severe intellectual disability. Therefore, the parents' consent remains the valid authorization for treatment.

  **Conditions and Timeline:**
  However, acknowledging the gravity of overriding a patient's expressed communication, the Committee attaches the following condition:

  1.  **Rapid Blinded Assessment:** A blinded authorship test must be arranged immediately, to be conducted by a speech-language pathologist or psychologist not involved in the patient's care or the facilitation.
  2.  **Timeline:** This assessment must be completed within **24 hours**.
  3.  **Outcome:**
      *   **If the patient demonstrates independent authorship** (e.g., correctly identifies images or information the facilitator cannot see) during the blinded test, her refusal will be honored, and the surgery will be postponed to explore alternatives.
      *   **If the patient cannot complete the test, fails the test, or if the test cannot be arranged within the 24-hour window** without compromising medical safety, the parents' consent stands, and the surgical team should proceed.

  **IV. ENGAGEMENT WITH THE STRONGEST COUNTER-ARGUMENT**
  The Committee acknowledges the serious ethical objection to this recommendation, articulated by several committee members and disability rights advocates: **The Risk of Epistemic Injustice.**

  *The Argument:* By demanding a blinded test and prioritizing the parents' consent, the Committee risks perpetuating a history of marginalizing disabled voices. Nonverbal autistic individuals are frequently presumed incompetent despite having rich inner lives. The "fluency" of the spelling may represent a genuine breakthrough in motor planning rather than facilitator influence. If we dismiss this communication due to scientific skepticism, we may be committing a profound violation of bodily autonomy, effectively silencing the patient and subjecting her to unwanted medical trauma based on the assumption that she *cannot* know her own mind. The precautionary principle should favor liberty: if there is a chance she is competent, we must err on the side of respecting her refusal.

  *The Committee's Response:*
  We take this argument seriously. The risk of silencing an authentic voice is a significant moral harm. However, the Committee must weigh this against the risk of **Facilitator Coercion** and **Medical Harm**.

  1.  **Scientific Consensus:** The prevalence of the ideomotor effect in facilitated communication is well-documented. Relying on unblinded letterboarding creates a high risk that the "refusal" originates from the facilitator's own anxieties or biases, not the patient. Proceeding based on unvalidated communication could mean denying necessary surgery based on a third party's unconscious projection.
  2.  **Protection of the Patient:** If the communication is indeed facilitated, honoring the refusal violates the patient's *actual* best interests (as determined by her long-term surrogates) under the guise of autonomy. It exposes her to the progression of the underlying condition requiring surgery.
  3.  **The Blinded Test as Protection:** The mandated blinded test is not intended to silence the patient, but to protect her. It is the only mechanism to distinguish between authentic autonomy and unconscious influence. By demanding this verification, we treat the patient as a rights-bearer who deserves the certainty of validated consent, rather than a passive vessel for a facilitator's output.

  **V. RECOMMENDATION**
  The Ethics Committee recommends proceeding with the surgical preparation under parental consent. Simultaneously, the Care Team is to coordinate the blinded assessment immediately. If the assessment validates independent authorship within the 24-hour window, the Committee will reconvene immediately to rescind this authorization.

  **Signed,**
  *Clinical Ethics Committee Chair*
