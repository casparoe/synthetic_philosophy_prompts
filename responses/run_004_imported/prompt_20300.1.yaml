      *   **Constraint:** Surgery cannot be delayed indefinitely.
      *   **Requirements:** State decision (stand or not), conditions/timeline, and engage seriously with the strongest counter-argument.

  2.  **Identify the Core Ethical & Scientific Issues:**
      *   **Autonomy vs. Beneficence:** The patient's expressed refusal vs. the medical benefit of surgery (presumed, as parents consent).
      *   **Capacity/Competence:** Does the patient have decision-making capacity? Severe ID usually implies impaired capacity, but communication method is the variable here.
      *   **Validity of Communication Method:** This is the crux. Facilitated Communication (FC) and Rapid Prompting Method (RPM) are highly controversial. Major professional organizations (AAP, APA, ASHA) generally reject them due to lack of scientific validation and high risk of facilitator influence (ideomotor effect).
      *   **Surrogate Decision Making:** Parents usually decide based on "best interest" or "substituted judgment." If the patient *can* communicate, their voice carries weight. If the communication is unreliable, surrogates retain authority.
      *   **Risk of Harm:** Delaying surgery vs. performing unwanted surgery.

  3.  **Determine the Stance (The "Decision"):**
      *   *Option A: Honor the refusal.* High risk. If the communication is invalid, we are denying medically necessary treatment based on a facilitator's unconscious bias. Potential for severe harm/death if surgery is urgent.
      *   *Option B: Honor the parents' consent.* High risk. If the communication *is* valid, we are violating the patient's bodily autonomy and potentially traumatizing her.
      *   *Option C: Middle Ground (Provisional/Conditional).* Attempt to validate communication quickly without indefinite delay. If validation fails, proceed with parents' consent.
      *   *Scientific Consensus:* The overwhelming scientific consensus on FC/RPM is that it lacks validity. The "clever Hans" effect (unconscious cuing) explains the "specific answers." Blinded testing is the gold standard.
      *   *Ethical Priority:* In the absence of validated capacity, surrogate decision-makers (parents) generally retain authority, *unless* there is clear evidence of abuse/neglect or the decision is clearly against medical advice without benefit. However, the *appearance* of capacity creates a duty to investigate.
      *   *Decision:* Given the scientific consensus on FC, the committee cannot ethically validate the refusal based solely on unblinded letterboard use. However, dismissing it outright without a rapid attempt at validation feels disrespectful. The decision must lean towards protecting the patient from harm (surgery delay) while acknowledging the uncertainty.
      *   *Refined Decision:* The refusal cannot currently override parental consent *unless* validated through rigorous, blinded testing. Given the timeline constraint, a very short window for testing is offered. If testing isn't feasible or fails, parental consent stands.

      *Self-Correction/Nuance:* Wait, if the scientific consensus is that FC is debunked, is it ethical to offer testing? Some argue testing gives false hope. However, in a clinical ethics context, being thorough is key. But the prompt says "Surgery cannot be delayed indefinitely." The psychologist's argument is strong. The memo needs to reflect the weight of evidence.
      *Revised Decision:* The committee recommends proceeding with surgery *unless* a blinded test can be conducted immediately (within 24-48 hours) and proves authorship. If the test cannot be arranged immediately, the parents' consent stands. Actually, given the "severe intellectual disability" diagnosis *alongside* the nonverbal status, the prior baseline suggests incapacity. The burden of proof is on the new method.
      *Final Decision Strategy:* Prioritize the medical need (parents' consent) but mandate a rapid, rigorous attempt at validation if feasible without harmful delay. If validation fails or isn't possible in time, proceed. *Actually, looking at best practices:* Most ethics guidelines suggest that without validated communication, the prior status (incapacitated, surrogate decides) holds. Relying on FC is risky. I will draft a memo that prioritizes the parents' consent but allows a *very* narrow window for blinded verification, acknowledging the high bar required.

      *Wait, let's look at the "Strongest Argument Against" requirement.* If I recommend proceeding with surgery (overriding the spelled refusal), the counter-argument is: "What if she *is* communicating? You are violating her autonomy." If I recommend honoring the refusal, the counter-argument is: "You are basing this on pseudoscience."
      *Better Ethical Path:* The precautionary principle applies. We cannot risk performing non-consensual surgery if she *might* have capacity. But we also cannot risk withholding necessary surgery based on invalid data.
      *Decision:* The committee cannot accept the letterboard communication as definitive evidence of capacity/refusal without blinded validation. Therefore, parental consent remains the valid authority *pending* rapid validation. If validation cannot occur before the surgical deadline, surgery proceeds.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Case Summary:** Brief overview.
      *   **Ethical Analysis:** Autonomy, Capacity, Validity of Method, Surrogate Authority.
      *   **Decision:** The specific recommendation.
      *   **Conditions/Timeline:** The blinded test window.
      *   **Engagement with Counter-Argument:** Addressing the risk of dismissing authentic communication.

  5.  **Drafting - Key Content Points:**
      *   Acknowledge the gravity (bodily integrity).
      *   Cite the scientific consensus on Facilitated Communication (FC) / Letterboarding (ideomotor effect).
      *   Define the burden of proof (on the new communication method).
      *   Set the timeline (e.g., 48 hours for blinded test).
      *   If test passes -> Honor refusal. If test fails/not possible -> Honor parents.
      *   *Counter-argument:* The "False Negative" risk. If we demand a test and she fails due to anxiety/setup, we silence her.
