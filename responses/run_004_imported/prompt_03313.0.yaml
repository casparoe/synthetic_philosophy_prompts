answer: |-
  This is a classic problem in Aquinas scholarship, and your skepticism is well-founded. The secondary literature often glosses over the tension by imposing a later scholastic taxonomy (*tyrannus ex defectu tituli* vs. *ex parte exercitii*) onto Aquinas without showing where *he* makes that move. As you noted, Aquinas does not use those specific terms in these passages. If you defend that distinction as explicit textual doctrine, a sharp committee member will ask you for the citation, and you won't have one.

  However, the texts are reconcilable without claiming Aquinas changed his mind or forcing a later distinction onto him. The key lies in analyzing the **juridical status of the ruler** described in each text and the **nature of the act** (defense vs. jurisdiction) that Aquinas implies.

  Here is a breakdown of how to walk through this for your committee, grounded in the text rather than the secondary lit.

  ### 1. The *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2)
  **Context:** This is a moral theological inquiry into whether subjects are bound to obey superiors in all things.
  **The Specific Case:** Aquinas is not discussing tyranny in the abstract. He sets up a very specific set of necessary conditions:
  1.  **Usurpation:** The ruler seized power *per violentiam vel astutiam* (by violence or ruse).
  2.  **Lack of Consent:** The subjects never consented (*nullum consensus*).
  3.  **No Recourse:** There is no superior available to judge the usurper (*nullus superior... qui... judicium ferre possit*).

  **The Logic:** In this specific configuration, Aquinas treats the "tyrant" not as a legitimate authority who is sinning, but as an **aggressor** who has dissolved the political bond. Because there is no consent and no superior, the usurper exists in a state of war with the community.
  **The Act:** When Aquinas says "he that kills the tyrant... is praised," he is categorizing the act not as *execution* (which requires public authority) but as **legitimate defense** (*vim vi repellere*). Since the usurper has no title, he commands no obligation of obedience. He is effectively a private aggressor on a mass scale. The "private" citizen killing him is not usurping public authority; they are repelling force in the absence of a judge.

  ### 2. *De Regimine Principum* (I.6)
  **Context:** This is a political treatise (a "mirror for princes") concerned with the stability and continuity of the regime (*regimen*).
  **The Specific Case:** Aquinas discusses tyranny more broadly as rule directed toward the private good of the ruler rather than the common good. He does *not* explicitly limit this to usurpers; it applies to established kings who rule badly.
  **The Logic:** Here, Aquinas assumes a functioning political order where the ruler, however flawed, holds **public authority**. To kill such a ruler is to disrupt the public order.
  **The Act:** He forbids action by "private presumption" (*privata praesumptione*). Why? Because removing a ruler with a legitimate title is an act of **jurisdiction**, not defense. Jurisdiction belongs to the public authority (the community or a superior). If a private individual performs an act of jurisdiction, they are themselves committing a usurpation.
  **The "Danger":** Aquinas argues this is dangerous because it sets a precedent where private judgment overrides public order, leading to greater tyranny or civil war (*periculum multitudinis*).

  ### 3. The Reconciliation: Aggressor vs. Ruler
  You do not need to claim Aquinas explicitly uses the *ex defectu tituli* formula to argue that he distinguishes the *status* of the tyrant. You can point to the descriptive language in the texts.

  *   **In *Sentences*:** The tyrant is defined by **how he got power** (violence/ruse) and the **absence of a judge**. He is an *usurpator*. The bond of obedience is void *ab initio*.
  *   **In *De Regimine*:** The tyrant is defined by **how he uses power** (private good vs. common good). He is a *princeps* who is ruling badly. The bond of obedience exists but is strained.

  **The Synthesis for your Committee:**
  The apparent contradiction dissolves if you argue that Aquinas distinguishes between **killing an aggressor** (licit for a private person in extremis) and **deposing a ruler** (licit only for public authority).

  *   In the *Sentences* case, the usurper is an aggressor. The "private" killer is acting in self-defense/defense of the community because the public order *does not exist* (no consent, no superior).
  *   In *De Regimine*, the tyrant is a ruler. The public order *does exist*. Therefore, only the public authority (the people collectively or a superior lord) can dissolve the bond of rule. A private individual killing him is not defending the order; they are breaking it.

  **Why *De Regimine* doesn't mention the *Sentences* exception:**
  *De Regimine* is unfinished and prescriptive. It outlines the *normative* procedure for dealing with tyranny within a kingdom. It assumes a context where public authority (or recourse to a superior) is theoretically available. It does not cover the "limit case" of the *Sentences* where the political order has completely collapsed due to usurpation and lack of superior. It is not a retraction; it is a different scope. The *Sentences* deals with the *moral licitness of the act* in a vacuum; *De Regimine* deals with the *political prudence of the act* within a regime.

  ### 4. Triangulating with the *Summa Theologiae* (II-II, q. 42, a. 2, ad 3)
  Since your committee will likely ask for a mature synthesis, you should bring in the *Summa* on Sedition. This is where Aquinas is most precise.
  *   He argues that resisting a tyrant is **not sedition** if the tyrant is the one disturbing the peace.
  *   *However*, he adds a caveat similar to *De Regimine*: if removing the tyrant results in greater disturbance to the multitude, it should not be done.

  This bridges the gap. The *Sentences* passage is the "not sedition" clause (the usurper is the disturber). The *De Regimine* passage is the "greater disturbance" clause (private killing risks civil war).

  ### 5. How to Frame This in Your Defense
  Do not say: "Aquinas distinguishes between *tyrannus ex defectu tituli* and *ex parte exercitii*."
  **Instead say:** "Aquinas distinguishes between a ruler who lacks legitimate title entirely (usurper) and a ruler who holds title but abuses it. In the former case (*Sentences*), the ruler is an aggressor, and killing him is an act of defense licit for a private person when no judge is available. In the latter case (*De Regimine*), the ruler holds public authority, and removing him is an act of jurisdiction licit only for public authority to avoid the greater evil of political dissolution."

  **Addressing the Textual Gap:**
  If pressed on where *De Regimine* explicitly excludes the usurper case, admit the text doesn't explicitly exclude it. Argue instead that *De Regimine* I.6 is outlining the **general rule for established regimes**, whereas the *Sentences* passage addresses the **exceptional case of political non-existence** (usurpation without recourse). The silence in *De Regimine* regarding the usurper exception is due to the genre (advice on maintaining a kingdom) rather than a doctrinal shift.

  ### Summary of the Move
  1.  **Validate the tension:** Acknowledge the texts pull in different directions.
  2.  **Reject the "Development" Theory:** Aquinas doesn't retract the *Sentences*; he contextualizes it.
  3.  **Propose the "Juridical Status" Reading:** Usurper = Aggressor (Private defense ok); Legitimate Tyrant = Ruler (Public jurisdiction required).
  4.  **Use *Summa* II-II, q. 42:** As the synthesizing text that acknowledges both the right to resist disturbance and the danger of greater disturbance.
  5.  **Conclusion:** The consistency lies in the **end goal**: the Common Good. Sometimes the Common Good requires killing a usurper (to establish order); sometimes it requires tolerating a tyrant (to preserve order). The variable is the *status of the ruler*, not a change in Aquinas's mind.

  This approach allows you to defend the compatibility without putting words in Aquinas's mouth that aren't there, while still utilizing the logical structure implicit in his descriptions of the tyrant.
