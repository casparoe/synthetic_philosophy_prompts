prompt: |-
  Quick one for you -- every year in my rationality and cooperation seminar the students write short programs that play a single round of Prisoner's Dilemma against each other, and every year its boring because they all just defect, exactly like the textbook says they should. This year I want to let them see each other's source code before submitting, since that's supposedly the whole point of program equilibrium -- Tennenholtz's original result, plus the later Löbian tricks (FairBot and its descendants) that get you provable mutual cooperation instead of just "cooperate iff identical code." I know the theory fine on paper but I've never watched it survive contact with 30 undergrads, a deadline, and buggy proof-search code. Can you give me the most important implications of the program equilibrium literature for how I should design and grade this assignment, and what's most likely to break once real, finite, not-especially-careful code is doing the "proving" instead of an idealized agent?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** Instructor of a "rationality and cooperation seminar." Likely familiar with game theory, decision theory, and AI safety concepts (mentions Tennenholtz, Löbian cooperation, FairBot).
      *   **Task:** Designing a programming assignment where students write Prisoner's Dilemma (PD) bots that can read each other's source code.
      *   **Problem:** Standard PD assignments result in universal defection (Nash equilibrium). The instructor wants to demonstrate *program equilibrium* (cooperation via source code inspection).
      *   **Constraints:** 30 undergraduates, deadline pressure, buggy code, finite resources, not idealized agents.
      *   **Goal:** Provide implications for design/grading and predict failure modes in real-world implementation of theoretical concepts.

  2.  **Deconstruct the Theory vs. Reality Gap:**
      *   *Theory:* Tennenholtz (2004) showed program equilibrium is possible. Löbian cooperation (Gödelian self-reference) allows cooperation without identity checks (FairBot, PrudentBot).
      *   *Reality:* Undergrads don't write perfect theorem provers. They write Python scripts with timeouts. "Reading source code" is tricky (string matching vs. AST vs. execution).
      *   *Key Tension:* Theoretical results assume logical omniscience or infinite compute. Real code has timeouts, hash collisions, and parsing errors.

  3.  **Brainstorming Implications & Failure Modes:**

      *   *Implication 1: The "Cooperate iff Identical" Trap.*
          *   Theory says this is fragile (doesn't generalize).
          *   Reality: Students *will* do this because it's easy. `if opponent_code == my_code: cooperate else: defect`.
          *   Grading: Need to penalize this or structure the tournament to make it fail (e.g., allow minor syntactic variations).

      *   *Implication 2: The Timeout/Infinite Loop Problem.*
          *   Löbian cooperation requires searching for proofs. Proof search can take forever.
          *   Reality: If a bot hangs, the tournament crashes.
          *   Design: Hard timeouts are necessary. But timeouts look like defection. This creates a "Timeout Dilemma."

      *   *Implication 3: Proof Search is Hard.*
          *   Writing a Z3/Axiom prover in a week is impossible for most undergrads.
          *   Reality: They will fake it. Heuristics masquerading as proofs.
          *   Result: "Cooperate if code looks nice" -> Exploitable by "Looks nice but defects."

      *   *Implication 4: The Language/Environment.*
          *   If they submit Python strings, `eval()` is dangerous (security).
          *   If they submit functions, how do they inspect code? `inspect.getsource` is fragile.
          *   Design: Need a sandboxed environment.

      *   *Implication 5: Grading Criteria.*
          *   If the goal is cooperation, grading on score incentivizes defection against weak bots.
          *   If the goal is theory, grading on "elegance of cooperation logic" is better.
          *   Recommendation: Grade on a rubric that rewards *attempting* program equilibrium, not just raw score.

  4.  **Structuring the Advice:**
      *   **Introduction:** Acknowledge the ambition. It's a great idea but fraught with practical peril.
      *   **Core Design Constraints (The "Must-Haves"):** Security, Timeouts, Interface.
      *   **Theoretical Pitfalls (What students will actually write):** String matching, fake provers.
      *   **Grading Strategy:** How to reward the *intent* of program equilibrium even if it fails.
      *   **Specific "Breakage" Predictions:** Where the Löbian magic dies.
      *   **Alternative/Scaffolded Approach:** Maybe don't go full Löbian immediately.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Security:* Must mention this. `eval(opponent_code)` is a remote code execution vulnerability if students are malicious (or just clumsy). *Suggestion:* Use a restricted AST or Docker containers.
      *   *The "Identical Code" Clique:* This is the baseline. To break it, introduce "noise" or allow comments to differ. Or, better, reward bots that cooperate with *different* bots.
      *   *Löbian Cooperation:* It's too hard for undergrads to implement a prover. *Suggestion:* Provide a library function `prove(statement, code)` that works on a simplified logic, or accept that they will use heuristics. Actually, better advice: Don't expect actual Löbian cooperation. Expect *simulated* trust.
      *   *Timeouts:* If a bot times out, is it C or D? Usually D. This punishes complex logic. *Suggestion:* Make timeout a distinct third outcome (Error) or treat as Mutual Defection.
      *   *Grading:* If you grade on score, DefectBot wins against CooperateBot. If you grade on "Cooperation Rate," CooperateBot wins against itself but gets exploited. *Suggestion:* Grade on a combination: Score against a standard set of bots + Code Review.

  6.  **Refining the "Löbian" Expectation:**
      *   Be honest: 30 undergrads will not implement a sound theorem prover in Python in a week.
      *   If they try, they will use `eval` or regex.
      *   *Crucial Insight:* The assignment should probably *provide* the proof checker or limit the logic to a decidable subset, OR acknowledge that they will be writing "heuristics that look like proofs."
      *   *Better Insight:* Focus on *modal combat* style logic but simplified. Or, acknowledge that "Program Equilibrium" in practice often devolves into "Quining + String Matching."
      *   *Decision:* Advise the instructor to lower expectations on actual Löbian cooperation. Focus on the *mechanism* of inspection.

  7.  **Final Polish:**
      *   Tone: Collegial, experienced, slightly cautionary but encouraging.
      *   Format: Bullet points for readability.
      *   Key Takeaway: The theoretical result relies on logical omniscience; the practical assignment relies on timeouts and string parsing. Bridge that gap explicitly.

  8.  **Self-Correction/Review during drafting:**
      *   *Wait, did I emphasize security enough?* If students can read source code, can they write to disk? Need to emphasize sandboxing.
      *   *Is "Cooperate iff Identical" actually bad?* In Tennenholtz's original formulation, it's the baseline. But it's brittle. The instructor wants to see *more* than that. I should suggest ways to break the identity clique.
      *   *Grading:* If I grade on tournament performance, DefectBot wins. If I want cooperation, I need to grade on *robustness* of cooperation.

  9.  **Finalizing the Output Structure:**
      1.  The "Reality Shock" (Theory vs. Undergrad Code).
      2.  Infrastructure & Security (The boring but vital stuff).
      3.  The "Proof" Problem (Why Löbian cooperation will fail).
      4.  Grading Strategy (Incentivizing the right behavior).
      5.  Specific Failure Modes to Watch For.
      6.  A Proposed "Scaffolded" Setup.

  (Proceed to generate response based on these points.)
answer: |-
  This is a fantastic assignment idea, but you are absolutely right to be worried. The gap between **Tennenholtz's program equilibrium** (which assumes logical omniscience or idealized proof search) and **30 undergraduates writing Python scripts with a 2-second timeout** is a chasm.

  In idealized theory, `FairBot` cooperates with `FairBot` because they can prove mutual cooperation. In reality, `FairBot` will timeout trying to prove anything about `FairBot` unless you provide a trivialized logic engine, and it will get exploited by a bot that simply `return DEFECT`.

  Here are the critical implications for design, grading, and the specific failure modes you will encounter.

  ### 1. Infrastructure & Security: The "Eval" Trap
  The most immediate practical issue isn't game theory; it's security. If students submit source code strings that are executed or inspected by other students:
  *   **The Risk:** A student submits code that imports `os` and deletes your tournament server's files, or simply hangs indefinitely.
  *   **The Fix:** Do not let them `eval()` raw strings against each other.
      *   **Sandboxing:** Run every match in a fresh, restricted Docker container or a heavily restricted Python interpreter (e.g., `restrictedpython`).
      *   **Interface:** Instead of passing raw source strings, pass a **read-only handle** or a **hash** of the code, plus a whitelist of allowed inspection functions.
      *   **Timeouts:** You must enforce hard timeouts per move (e.g., 100ms). If a bot times out, it must be treated as a **Defection** (or a distinct "Error" state that scores worse than mutual defection). *Crucial:* If timeout = Defection, students will write complex logic that times out, effectively defecting against cooperators.

  ### 2. The "Proof" Problem (Löbian Cooperation will likely fail)
  You mentioned Löbian tricks (FairBot, PrudentBot). These rely on finding a proof in Peano Arithmetic (or similar) that `Opponent(Cooperate) -> Me(Cooperate)`.
  *   **Reality Check:** Undergraduates cannot implement a sound theorem prover in a week. If they try to use a library (like `z3`), the search space is too large for a tournament timeout.
  *   **Prediction:** Most "proof" attempts will be **string matching heuristics** masquerading as logic. They will look for the string `"return COOPERATE"` in the opponent's source.
  *   **Implication:** This degenerates into "Cooperate iff Identical" (or "Cooperate iff Similar"). This is fragile. A bot can easily obfuscate its code (add comments, rename variables) to bypass string matching while still defecting.
  *   **Design Suggestion:** **Provide a simplified proof oracle.** Instead of making them write the prover, give them a function `can_prove(statement, opponent_code)` that works on a tiny, decidable subset of logic. This lets them implement the *logic* of FairBot without needing the *infrastructure* of a prover. If you don't do this, expect zero actual Löbian cooperation.

  ### 3. Grading: Don't Grade on Tournament Score
  If you grade based on who gets the highest score in the tournament, **DefectBot will win.**
  *   **Why:** DefectBot exploits the "CooperateBots" and draws against other DefectBots. A sophisticated FairBot might timeout against a complex bot or get exploited by a "Defect-against-provers" bot.
  *   **The Incentive:** Grading on score incentivizes students to write bots that *defect* against the class's average bot. This reinforces the exact textbook outcome you are trying to escape.
  *   **Alternative Grading Rubric:**
      1.  **Cooperation Rate (40%):** How often did they cooperate with other bots that *tried* to cooperate?
      2.  **Robustness (30%):** Did they avoid being exploited by pure DefectBots? (i.e., Do they defect against obvious defectors?)
      3.  **Code Review (30%):** Did they attempt a mechanism for program equilibrium (inspection, proof, quining) rather than hardcoding?
      *   *Goal:* Reward the *attempt* at program equilibrium, not the raw exploitation of classmates.

  ### 4. Specific Failure Modes to Anticipate
  Here is what will actually happen when you run this:

  *   **The "Comment" Clique:** Students will write `if opponent_code == my_code`. To prevent this from being the dominant strategy, your tournament runner should **strip comments and whitespace** before hashing/comparing code. Better yet, penalize bots that only cooperate with exact syntactic matches.
  *   **The "Infinite Recursion" Crash:** Bot A calls Bot B's function to see what it does. Bot B calls Bot A's function. Stack overflow.
      *   *Fix:* Disallow direct execution of the opponent. They only get the source string or an AST.
  *   **The "Timeout as Strategy":** A clever student might realize that causing a timeout forces a Defect outcome without "technically" defecting in code.
      *   *Fix:* Treat timeouts as a penalty worse than Mutual Defection (e.g., -10 points instead of -1).
  *   **The "Random Noise" Exploit:** If a bot uses randomness (e.g., `random.choice`), source code inspection becomes useless because the code doesn't determine the move deterministically.
      *   *Fix:* Require deterministic bots (no `random` module, fixed seeds).

  ### 5. Recommended Assignment Structure
  To make this survive contact with reality, I suggest this scaffolded approach:

  1.  **The Environment:** Python. Bots submit a function `move(opponent_source_code)`.
  2.  **The Inspection Tool:** Do not give them raw strings. Give them an **AST (Abstract Syntax Tree)** of the opponent. This prevents simple string-matching hacks and forces them to think about structure.
  3.  **The "Proof" Helper:** Provide a function `simulate(opponent_code, my_move)` that runs the opponent against a *fixed* move and returns the result (with a strict step limit).
      *   *Why:* This allows for "Simulator Bots" (a la *PrudentBot* logic) without needing a theorem prover. "I will simulate you cooperating; if you cooperate, I cooperate."
      *   *Risk:* Infinite recursion (I simulate you simulating me).
      *   *Mitigation:* The `simulate` function must not allow the opponent to call `simulate` back (no nested simulation).
  4.  **The Opponent Pool:** Don't just let them play each other. Include 5-10 "Staff Bots" in the tournament:
      *   `AlwaysDefect`
      *   `AlwaysCooperate`
      *   `TitForTat`
      *   `Random`
      *   `CliqueBot` (Cooperates only if code hash matches)
      *   *Grading:* Measure their performance against this fixed pool. This prevents the "race to the bottom" where the whole class converges on Defect.

  ### 6. The Pedagogical Pivot
  Be prepared to pivot the debrief.
  *   **Ideal Outcome:** A few bots achieve mutual cooperation via simulation or simplified proof.
  *   **Likely Outcome:** Most bots defect or use brittle string matching.
  *   **The Lesson:** The failure *is* the lesson.
      *   Use the results to explain **why** Tennenholtz's result requires logical omniscience.
      *   Show how "Cooperate iff Identical" fails under semantic equivalence (two bots that do the same thing but look different).
      *   Discuss the **computational cost of trust**. In the real world, we don't prove code; we use reputation and institutions because proof is too expensive.

  **Summary Recommendation:**
  Don't expect Löbian cooperation. Expect string matching and simulation. Sandboxing is mandatory. Grade on mechanism, not score. If you want them to actually see cooperation, **provide the proof/simulation primitive** rather than asking them to build it from scratch. Otherwise, you will just teach them that Python `eval` is slow and Nash equilibria are robust.
