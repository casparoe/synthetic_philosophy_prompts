  **Move (1) — Marcus: 2/2**
  Marcus provides a textbook formulation of Kim's Exclusion Argument. He correctly identifies the three tension-generating premises: causal closure of the physical, the distinctness of mental properties (implied by multiple realizability), and the rejection of systematic overdetermination. His conclusion that the mental is "screened off" follows validly from these premises within Kim's framework.

  **Move (2) — Zoe: 1/2**
  Zoe intuitively grasps the "constitution" or token-identity response (similar to Davidson's Anomalous Monism), suggesting there is only one causal event described twice. However, her phrasing ("just is the neural event") is metaphysically loose. Without further elaboration, this invites Marcus's next objection regarding types vs. tokens, leaving her vulnerable to the charge that she is smuggling in reductionism while trying to save non-reductive physicalism.

  **Move (3) — Marcus: 2/2**
  Marcus correctly presses the standard Kim-style objection to token-identity views. He points out that if mental *types* are not identical to physical *types* (due to multiple realizability), then mental *properties* remain distinct from physical *properties*. Since Kim's exclusion argument operates at the level of properties, not just events, Marcus is right that Zoe's Move (2) does not yet dissolve the exclusion problem unless she accepts type-identity (which contradicts MR).

  **Move (4) — Zoe: 2/2**
  Zoe successfully pivots to the contemporary "Subset View" of realization (associated with Shoemaker and Wilson). By arguing that the causal powers of the mental property are a *subset* of the physical realizer's powers, she denies the "competition" assumption required for exclusion. This allows her to maintain multiple realizability and non-reductive physicalism without accepting overdetermination or epiphenomenalism. It is the strongest available move for her position in this dialectic.

  **What's Missing**
  Both interlocutors are operating within a "production" or "process" metaphysic of causation, where causes must physically generate effects. They are both missing the **interventionist/counterfactual account of causation** (e.g., Woodward), which dissolves the exclusion problem by defining causation as difference-making rather than physical production; on this view, the mental state can be a cause even if the physical base is sufficient, provided the outcome counterfactually depends on the mental state. Additionally, neither questions whether systematic overdetermination is truly "virtuous" or if causal closure is as substantive a premise as Marcus assumes.
