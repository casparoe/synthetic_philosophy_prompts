answer: |-
  **Setting:** *A dimly lit hotel bar, two hours after the panel. Empty glasses and a half-eaten plate of olives sit between Elena (Content/Truth-Conditional) and Marcus (Expressivist/CI).*

  **Elena:** I'll give you this: your slide on the projection data was clean. But you're glossing over the cost. If the derogatory force is just a conventional implicature riding along, then embedding it under 'believes' or 'says' should leave the at-issue content pristine. But it doesn't feel pristine. When I report, "John thinks that Sarah is a [slur]," I'm not just reporting John's belief; I'm contaminating the report itself. The ugliness leaks out of the attitude verb.

  **Marcus:** That leak is exactly why it's a separate dimension. The content of John's belief is just that Sarah is of group G. The contempt is a comment *on* that content, supplied by the lexical item, not by John. The leak you're feeling is the listener reacting to *your* use of the word, not the semantics of the report. You're conflating the offense of uttering the slur with the truth conditions of the sentence.

  **Elena:** But that's the trap. If I say, "John thinks Sarah is a [slur], but he doesn't mean anything bad by it," the second conjunct doesn't cancel the offense. It just sounds like I'm contradicting myself. If the derogation were merely a comment, I should be able to sever it. Instead, the semantic value of the slur seems to bind the attitude verb itself. The content is sticky because the property being predicated is inherently normative, not descriptive.

  **Marcus:** Sticky, sure. But cancellability is the litmus test here. If it were part of the assertoric content, you shouldn't be able to deny it without contradiction. But you can't deny it at all. "He's a [slur], but I respect him" is a pragmatic crash, not a logical contradiction. That failure to cancel signals it's not at-issue truth-conditional content. It's a rule of use attached to the word.

  **Elena:** Hold on. You're using cancellability to argue for implicature, but Potts himself admits conventional implicatures aren't cancellable. "She's poor but honest" works; "She's poor, but I don't mean to imply she's honest" doesn't. So, the fact that I can't cancel the slur's force doesn't prove it's pragmatic. It just proves it's not a *conversational* implicature. It could still be a semantic presupposition.

  **Marcus:** Fair point. Cancellability distinguishes conversational from conventional, not conventional from semantic. But look at reclamation. That's where your truth-conditional view hits the wall. If the slur semantically encodes a vile property, how does an in-group speaker use it to express solidarity? If you're right, when they use it, they're literally predicating that vile property of their friend.

  **Elena:** I'm not saying they predicate the *same* property. I'm saying the lexical entry is complex. But fine, take that win. Explain reclamation without just saying, "Oh, for them the implicature flips." If it's a conventional rule that maps the word to contempt, and conventions are shared social rules, how does the rule invert without the word becoming a homonym?

  **Marcus:** It's not a flip; it's a shift in the *source* of the norm. The CI doesn't encode "contempt" directly; it encodes "adoption of the historical stance associated with this term." For an out-group speaker, that stance is contempt. For an in-group speaker, invoking that history is an act of defiance. The CI is constant—it's the invocation of the term's loaded history—but the *illocutionary effect* of that invocation changes based on who holds the authority to invoke it.

  **Elena:** But then you've pushed the meaning out of the semantics and into the sociology of the speakers. You're saying the semantic value is stable, but the pragmatic force does all the work. I'm trying to keep the normativity *in* the meaning. If the word means "person of group G *deserving of contempt*," reclamation is the community changing the meaning. It's semantic change, not pragmatic flexibility.

  **Marcus:** And if it's semantic change, why does it happen instantly in a comedy routine or a song? Semantic change takes generations. What you're describing is context-sensitivity. The word carries a potential for offense, a affordance. My CI view captures that affordance as a non-at-issue dimension. Your view requires the truth conditions to mutate on the fly.

  **Elena:** Truth conditions don't mutate; they're under-specified. The "deserving of contempt" clause is part of the character, not the content. But here's my worry with your view: by isolating the ugliness in a separate dimension, you make it too easy to ignore. If it's just a side-comment, then logically, the core assertion remains innocent. That lets the speaker off the hook too easily.

  **Marcus:** The semantics doesn't let them off the hook; the ethics does. My job is to explain how the sentence functions, not to police it. But I see your worry. If the derogation is non-at-issue, it's not the main point of the utterance. Yet, in practice, it *becomes* the main point. That's the paradox of projective content. It's backgrounded semantically but foregrounded socially.

  **Elena:** Exactly. So maybe the split between "at-issue" and "not-at-issue" is the wrong cut. Maybe the derogation is *central* to the meaning but *resistant* to operators. That sounds like semantics, not implicature. It suggests the logic of slurs isn't classical logic.

  **Marcus:** Or it suggests that "meaning" is a bundle of different things, and we're fighting over which bundle gets the label "semantics." I'm happy to call the CI part of the conventional meaning, just not the truth-conditional core. You want the whole bundle to be truth-conditional.

  **Elena:** Because if it's not truth-conditional, it's not part of the world the sentence describes. And slurs *do* describe a social reality, even if it's a hateful one. Ignoring that in the truth conditions feels like a theoretical blind spot.

  **Marcus:** And including it risks making the truth conditions depend on the speaker's morality. If a racist uses the slur, is the sentence *true* because they believe the contempt is warranted? Your view flirts with making truth subjective.

  **Elena:** *[Sighs]* No, because the property is empty. Nobody actually deserves contempt based on ethnicity. So the sentence is always false. That's Hom's move.

  **Marcus:** And that's why we're stuck. You make it always false to save the semantics; I make it variable to save the use.

  **Elena:** Cheers to the stalemate, then.

  **Marcus:** Cheers to the boundary line. We'll be arguing about it next year.
