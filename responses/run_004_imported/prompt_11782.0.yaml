answer: |-
  Here is a speech draft. It's written to be spoken at a moderate pace, with pauses for laughter and clinking glasses. It clocks in at around 450–500 words, which should land you right in the 3-to-4-minute window.

  ***

  **The Speech**

  Hi everyone. For those who don't know me, I'm [Your Name]. I'm one of the friends who isn't going to miss Dan's spreadsheets, but I am going to miss Dan.

  Now, Dan has asked for no generic "follow your dreams" speeches tonight. And honestly, good, because I've been wrestling with something else. Last night, my friend Priya and I got into a heated argument over dinner about why Dan is doing this.

  Priya reckons Dan is fulfilling a prophecy. She's talking about John Maynard Keynes—that old economist from the 1930s. Keynes wrote an essay predicting that by now, we'd all be so rich we'd only work fifteen hours a week. He thought once our basic needs were met, we'd stop chasing money and start making "beautiful, pointless things." Like furniture.

  Priya says Dan is proof that Keynes was right. We finally have enough, so we're free to make chairs.

  I told her that was generous. Keynes admitted there's one trap: "relative needs." The need not just to have enough, but to feel *superior* to the person next to you. He hoped that wouldn't matter much. But looking around this room—at the bank, at the industry—I'd say he was wrong about that. Half the team here could probably afford to scale back, but no one does. The treadmill keeps speeding up.

  So, that leaves us with a slightly uncomfortable question for a leaving do: Is Dan a prophet showing us the way? Or is he just the lucky outlier who could afford to jump off? And does that make the rest of us chumps for staying on?

  I don't think so. And here's why.

  Banking is abstract. It's numbers moving on a screen. It feeds those relative needs. It's about being higher, faster, richer than you were yesterday. But furniture? Furniture is absolute. A table doesn't care about the stock market. A chair doesn't need to beat the benchmark. It just has to hold you up. It has to be true to the wood.

  Dan isn't proving Keynes right for all of us. He's just realizing that the currency he was being paid in wasn't buying the things he actually valued.

  To Dan's colleagues here: You aren't chumps. You're playing a different game, one that requires security and scale, and we respect that. But Dan has decided to change the game entirely. He's trading the insatiable hunger for status for the quiet satisfaction of a planed edge and a solid joint.

  Keynes thought we'd all get here by now. He didn't realize it takes a specific kind of courage to actually stop running. Dan has that courage.

  So, let's raise a glass. Not to the fifteen-hour work week, because I don't think anyone believes that's coming. But to the person who decided that making something real is better than moving something digital.

  To Dan.
