          2.  Break down the Doctor Analogy.
          3.  Break down the Childhood Analogy.
          4.  Explain Dana's underlying point (Moral Agency).
          5.  The Risk (What if the sister is wrong?).
          6.  Conclusion/Actionable advice.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, is the sister actually an expert?* No, she's just "good at reading situations." This makes the doctor analogy even weaker. Doctors have credentials; sisters have intuition.
      *   *Is the user lazy?* Maybe, but the prompt says "not in a lazy way." Let's focus on the *capacity* aspect.
      *   *Is there a middle ground?* Yes. Using the sister as a sounding board is fine. Using her as a *replacement* for judgment is the issue.

  7.  **Final Polish:** (Reviewing against the "straight answer" request).
