      3.  **The Implication Chain:** $\neg Con(PA) \implies \neg Con(ZFC)$, but not vice versa.
      4.  **Reverse Math/Ordinary Math:** Most math is low-consistency strength. ZFC is a safety buffer, not a load-bearing wall for analysis.
      5.  **Conclusion:** Different kinds of worry (justification vs. utility), but PA inconsistency is the existential threat.

  7.  **Self-Correction during drafting:** I need to make sure I don't dismiss the worry about ZFC entirely. If ZFC is inconsistent, it undermines the standard model of set theory and much of modern topology/algebra that relies on heavy set-theoretic machinery. But the *core* of math survives. I should distinguish between "foundational crisis" and "practical disruption."

