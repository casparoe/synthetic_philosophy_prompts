answer: |-
  This is a fantastic catch. Your friend is right: there is a genuine, non-trivial philosophical engine driving Hobbes's obstinacy, and it creates a delicious tension with his political theory.

  Here is the technical breakdown you need to ground the scene, followed by a draft of the scene itself.

  ### The Philosophical "Loophole"

  You are correct that Hobbes's constructivism *should* make him vulnerable. If a circle is defined by the motion of a compass, and his proof violates that motion, he should be wrong. But Hobbes escapes this trap through two specific heterodoxies:

  1.  **Magnitude vs. Number (The Category Error):** Hobbes insisted that geometry is the science of *continuous magnitude*, generated by motion. Wallis and the new algebraists treated geometry as *discrete number* (using arithmetic of infinitesimals/indivisibles). To Hobbes, Wallis wasn't doing geometry; he was doing "scabrous calculation" with symbols that had no physical referent. If you ask Hobbes, "Did you square the circle?" he says, "I squared the *geometric* circle." If Wallis says, "No, you didn't," Hobbes hears, "You didn't solve my *arithmetic* problem." He isn't refusing correction; he is refusing to accept the jurisdiction of the court. He believes the Royal Society has corrupted the definitions of "quantity" and "proportion."
  2.  **The Sovereignty of Reason:** In *Leviathan*, the Sovereign determines truth in civil matters to prevent war. But in natural philosophy and geometry, there is no human Sovereign. There is only "Right Reason." The irony, as you noted, is that Hobbes is convinced *he* possesses Right Reason and the Royal Society is merely a faction. To yield to Wallis is not to yield to an umpire; it is to yield to a mob of algebraists who have abandoned the causal method (motion) for symbolic manipulation. If he yields, he validates a method that he believes makes *all* science impossible.

  ### The Scene

  **Setting:** *A quiet corner of a coffee house near Gresham College, 1675. THOMAS HOBBES (87) is frail, wrapped in heavy wool despite the season. He is nursing a sack. Opposite him is ELIAS (20s), a bright, ambitious student of the new natural philosophy.*

  **ELIAS**
  Mr. Hobbes. The Society meets within the hour. Will you not attend?

  **HOBBES**
  To sit whilst they read papers on the weight of air? Air has no weight, Elias. It has motion. They weigh the wind and call it physics.

  **ELIAS**
  They discuss more than air. Dr. Wallis is to present a rejoinder to your *Decameron Physiologicum*.

  **HOBBES**
  (A dry chuckle)
  Wallis. The man who counts points as if they were pebbles in a purse. Let him count.

  **ELIAS**
  With respect, sir... the consensus is settled. The proof does not hold. The circle remains unsquared.

  **HOBBES**
  (Sharp)
  Whose circle?

  **ELIAS**
  The circle. The geometric object.

  **HOBBES**
  There is no object without generation. Show me the motion.

  **ELIAS**
  It is in the ratios, sir. The arithmetic of infinitesimals. It demonstrates that your proportion of the radius to the circumference is erroneous.

  **HOBBES**
  (Leans forward, eyes brightening)
  There it is. The disease. You speak of *infinitesimals*. A line is not made of points, Elias. A line is made of the motion of a point. You cannot sum what has no parts. Wallis deals in ghosts—numbers severed from the magnitudes they represent. He calculates with symbols as a merchant counts coin, blind to the metal.

  **ELIAS**
  But if the calculation predicts the motion...

  **HOBBES**
  If I write "God" on a slip of paper, does the paper become divine? No. The symbol is not the thing. Geometry is certain because we construct the cause. We move the hand, we trace the line, we know the effect because we *made* the cause. Wallis does not make. He shuffles numerals. If I admit he is right, I admit that truth can be found without causation.

  **ELIAS**
  And if you do not admit it? You stand alone against every mathematician in Europe. You, who wrote that when private judgment clashes, we must yield to a public arbiter to avoid war. You wrote that in *Leviathan*.

  (Hobbes stiffens. He takes a slow sip of the sack.)

  **HOBBES**
  I wrote that for the Commonwealth. For civil peace.

  **ELIAS**
  Is this not a commonwealth of learning? Is the Royal Society not the Sovereign of natural truth?

  **HOBBES**
  (A low growl)
  Do not confuse the sword with the compass. In the State, the Sovereign *makes* the truth. The Law is what he says, because there is no higher appeal to stop the blood. But in Geometry? In Nature? The Sovereign is Reason itself. It is not elected. It is not voted upon.

  **ELIAS**
  But who interprets Reason? If you say Reason dictates X, and Wallis says Reason dictates Y... who is the umpire?

  **HOBBES**
  The demonstration itself! If you follow the motion, you see the truth. If you look only at the symbols, you see only your own reflection.

  **ELIAS**
  They say you are proud, sir. That you cannot bear to be bested by a younger man.

  **HOBBES**
  Pride? I am an old man, Elias. I have one foot in the grave. What do I care for the applause of boys who play with algebra like toys? This is not about me.

  **ELIAS**
  Then what?

  **HOBBES**
  It is about the door.

  **ELIAS**
  Sir?

  **HOBBES**
  If I yield to Wallis on this... if I say, "You have squared the circle with your numbers," then I open the door. I let them say that we can know the world without knowing how it moves. That we can have effects without causes. That we can have science without understanding.

  (He taps his chest.)

  **HOBBES**
  I built a system, Elias. A house of truth. Politics rests on Physics. Physics rests on Geometry. Geometry rests on the definition of Motion. If Wallis breaks the foundation... the house falls. If the house falls, men return to the dark. They will think they can know things they cannot make. They will claim knowledge of God, of the Soul, of the Infinite, using nothing but word-games.

  **ELIAS**
  So you fight.

  **HOBBES**
  I hold the line. Let them call it squaring the circle. I call it stopping the rot.

  **ELIAS**
  And if you are wrong? If the motion *you* traced was flawed?

  **HOBBES**
  (He looks away, toward the window, voice quieting)
  Then I am wrong. But I will not be wrong *for their reasons*. I will not let them win the method. I would rather be the last man in Europe who knows what a Line is, than the first to accept a proof that does not know what Motion is.

  (He stands, shaky but resolute.)

  **HOBBES**
  Let them have their Society. I have the Truth. And Truth needs no charter.

  ***

  ### Why This Works for Your Novel

  1.  **It Validates the "Pride" without making it "Pride":** Hobbes admits the stakes are high, but he reframes his stubbornness as a defensive action for the integrity of *science itself*, not his ego. He is protecting the "House of Truth."
  2.  **It Uses His Actual Metaphysics:** The dialogue hinges on the distinction between *magnitude* (continuous, generated by motion) and *number* (discrete, algebraic). This was the actual core of the Hobbes-Wallis dispute. Hobbes genuinely believed Wallis's method was category error, not just incorrect math.
  3.  **It Hits the Irony:** Elias explicitly brings up *Leviathan*. Hobbes's counter-argument distinguishes between *Civil Truth* (which must be authorized to prevent violence) and *Natural Truth* (which is discovered by Reason). The tragedy/irony is that Hobbes is so convinced of his own Reason that he treats the consensus of experts as "violence" against the truth.
  4.  **It Fits the 1670s Context:** By 1675, Hobbes was isolated. The "new science" (Boyle, Hooke, Wallis) was winning. This scene captures the feeling of a brilliant but obsolete titan watching the world change its definitions of truth right in front of him.

  ### Technical Note for Your Notes
  If you need to reference specific texts in the narrative:
  *   Hobbes's geometric works: *De Corpore* (1655), *Six Lessons to the Professors of Mathematics* (1656), *Decameron Physiologicum* (1662).
  *   Wallis's counter-works: *Elenchus Geometriae Hobbianae* (1655).
  *   The specific philosophical term Hobbes uses is **"Computation"** (adding/subtracting parcels of thought). He believes Wallis is computing symbols, not computing the consequences of motion.

  This approach gives your Hobbes dignity. He isn't a stubborn old fool; he's a fundamentalist for a specific definition of causality, watching the future abandon it for utility.
