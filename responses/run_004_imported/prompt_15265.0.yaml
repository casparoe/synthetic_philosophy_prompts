  5.  **Refining the Philosophical Argument for the Scene:**
      *   Hobbes needs to explain that Wallis deals in *numbers* (discrete), but geometry deals in *magnitudes* (continuous). You can't square the circle with numbers because the circle is generated by motion, not counting.
      *   Hobbes views the Royal Society not as judges, but as a faction of "algebraists" who have hijacked the court.
      *   The irony needs to be subtle. The younger character points it out. Hobbes dismisses it by distinguishing Civil Sovereignty (necessary for peace) from Natural Reason (which cannot be coerced).

  6.  **Developing the "Why":**
