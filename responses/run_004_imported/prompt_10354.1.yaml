      *   *Point 3: The Goal of Arithmetic.* If the foundation allows contradictions, can we trust the arithmetic built on it? For Frege, if the root is rotten, the fruit is poison. Paraconsistency says "ignore the rot." Frege says "the rot proves the tree is dead."
      *   *Point 4: Historical Precedent.* Look at his actual reaction to Russell. He didn't try to patch it with a new rule of inference; he admitted defeat. He valued intellectual honesty over system preservation.

