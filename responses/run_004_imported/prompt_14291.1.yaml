  **MEMORANDUM**

  **TO:** Ritual Practices Committee & Board of Directors
  **FROM:** Miriam Adler, Chair, Ritual Practices Committee
  **DATE:** October 14
  **RE:** Recommendation Regarding Yom Kippur Musaf Avodah and Amidah Petitions

  As we finalize the new machzor, the committee's deliberation regarding the *Avodah* service and the *Retzeh* petition in the Amidah has moved beyond questions of wording into the core of our theological identity. We are not merely debating sensitivity; we are debating the nature of messianic hope and the integrity of prayer.

  Our traditionalist members rightly point out that excising these passages risks severing the link between *avodah shebalev* (service of the heart) and the historical *avodah* of the Temple. The sources are not monolithic on this. Maimonides, in the *Guide for the Perplexed*, argues that sacrificial law was a divine concession to an ancient mentality saturated with idolatrous ritual—a transitional technology to redirect worship toward God. Yet, that same Maimonides, in the *Mishneh Torah*, codifies the laws of sacrifices as literally binding in a rebuilt Temple. He does not treat them as metaphor. Nahmanides challenges Maimonides' historical concession theory directly, noting that Noah and Abel offered sacrifices long before the idolatrous cultures Maimonides cited existed. For Nahmanides, the *korban* (that which draws near) is intrinsic to holiness, not merely a reaction to paganism. To remove the text is to side with a specific philosophical reading of Maimonides over the plain sense of the Torah and the codified halakha.

  However, we must also contend with the vision of Rav Kook, who speculated that in the messianic future, only grain offerings might remain, suggesting a spiritual evolution away from animal slaughter. This offers a bridge, but it remains speculation, not law.

  **The Case for Revision**
  Those advocating for revised language argue that liturgy must reflect the moral conscience of the worshiper, not just historical fidelity. Their strongest argument is not about "modern taste," but about spiritual honesty. If we stand and petition God to restore a system of animal slaughter that we now deem spiritually obsolete or morally troubling, we are not praying; we are performing. They argue that asking God to reinstate a practice we have no intention of performing renders our *kavanah* (intent) void. To pray for a Third Temple while simultaneously rejecting its primary function is, in their view, a form of theological duplicity that undermines the prophetic vision of a peaceable kingdom where "wolf shall dwell with lamb." They contend that "service of the heart" is not a consolation prize for a lost Temple, but the superior form of worship that the prophets themselves prioritized.

  **Recommendation**
  The Committee recommends that the **Hebrew text of the Avodah and the Amidah petition remain unchanged**, preserving the integrity of the liturgical structure and our connection to the halakhic tradition as codified by Maimonides and contested by Nahmanides. However, to address the legitimate theological concerns raised, we recommend **commissioning a new introductory essay for the machzor**. This essay will explicitly engage the tension between the sacrificial past and our ethical present, citing the range of authorities from Maimonides to Rav Kook. This allows the congregation to pray the text without being required to ignore the complexity it presents.

  **Timeline**
  The draft essay will be circulated to the Board by November 1st. We request a final vote on the machzor proofs at the November 15th board meeting to allow time for printing before the High Holiday fundraising drive.

  Respectfully,

  Miriam Adler
