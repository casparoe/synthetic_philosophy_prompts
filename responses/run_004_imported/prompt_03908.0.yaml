answer: |-
  You are right to be nagged. The tension you have identified is not a mere presentational wrinkle; it is a structural fracture in the architecture of Lewis's *Reformed Conditional Analysis* (RCA). Your seminar group's dismissal of the problem likely stems from a willingness to treat "Getting Specific" as a harmless clarification of stimulus conditions, but as you have correctly discerned, it functions as a surreptitious abandonment of the Intrinsic Dispositions Thesis (IDT) precisely where IDT was previously invoked as a shield.

  Here is the argument for why this is a genuine inconsistency, followed by a recommendation on which commitment a consistent Lewisian must jettison.

  ### The Inconsistency Argument

  The inconsistency arises from the conflicting theoretical roles IDT plays in Lewis's handling of **Finks** versus **Masks**.

  1.  **The Role of IDT in Fink Cases:**
      In the reverse-cycle fink case (a live wire that becomes dead upon contact), the simple conditional "If touched, it would conduct" is false. To avoid the conclusion that the wire is not live, Lewis introduces the causal basis $B$ and the retention clause. Crucially, Lewis argues that the wire *remains* live because it retains its intrinsic basis (the free electrons), even though the extrinsic fink device prevents manifestation.
      *   **Theoretical Commitment:** Here, Lewis relies on IDT to secure the intuition that the disposition supervenes on the intrinsic basis. He explicitly rejects the Choi/Gundersen deflationary response (that the wire is simply dead) because he wants dispositions to be properties of the object, not relational properties involving the environment. IDT is the engine that allows RCA to verdict "Live" despite the false conditional.

  2.  **The Role of "Getting Specific" in Mask Cases:**
      In the masking case (fragile glass with packing), the intrinsic basis (molecular structure) is fully present. However, the simple conditional "If struck, it would break" is false. Lewis's solution is to deny that the glass has the disposition to break *when struck simpliciter*. Instead, he insists the glass has the disposition to break *when struck in the absence of packing*.
      *   **Theoretical Commitment:** This move ("Getting Specific") modifies the stimulus condition $C$ to $C^*$, where $C^*$ includes extrinsic negative conditions (no packing). Consequently, the disposition ascription becomes sensitive to extrinsic factors. An intrinsic duplicate of the glass (unpacked) is disposed to break *when struck*. The packed glass is not disposed to break *when struck* (only *when struck-without-packing*).

  3.  **The Contradiction:**
      If IDT holds, intrinsic duplicates under shared laws must share all dispositions.
      *   Let $G_1$ be the unpacked fragile glass.
      *   Let $G_2$ be the intrinsic duplicate surrounded by packing.
      *   According to Lewis's handling of masks, $G_1$ has the disposition $D$ (breaks when struck), but $G_2$ lacks $D$ (it only has $D^*$, breaks when struck-without-packing).
      *   Therefore, $G_1$ and $G_2$ differ in their dispositions despite being intrinsic duplicates.
      *   **Result:** IDT is false.

  Lewis cannot have it both ways. He cannot invoke IDT to save the disposition in the reverse-fink case (insisting the wire is live because its intrinsic nature is unchanged) while simultaneously violating IDT in the mask case (insisting the glass is not fragile *simpliciter* because its extrinsic context has changed). In the fink case, the extrinsic interferer is ignored to preserve the intrinsic disposition; in the mask case, the extrinsic interferer is admitted to alter the disposition ascription. This is not a tension that dissolves upon closer inspection; it is a direct contradiction in the criteria for disposition individuation.

  ### Which Commitment to Jettison?

  To restore consistency, a Lewisian must abandon one of the three legs of this stool: **RCA**, **IDT**, or **"Getting Specific."**

  **I argue that the Lewisian should jettison IDT.**

  Here is the justification for why IDT is the sacrificial lamb, rather than RCA or the "Getting Specific" maneuver.

  #### 1. Why not drop "Getting Specific"?
  Dropping "Getting Specific" means admitting that the packed glass *is* disposed to break when struck *simpliciter*, despite the packing. If you do this, you preserve IDT. However, you immediately break RCA.
  RCA analyzes dispositions in terms of counterfactuals. If the glass is disposed to break when struck, RCA entails that "If struck, it would break" must be true (given the basis retention clause). But it isn't true. The packing ensures the glass won't break.
  To save the disposition while admitting the conditional is false, you must sever the link between dispositions and conditionals. But that is to abandon RCA entirely, moving toward a causal powers ontology (like Bird's). While this is a viable metaphysical position, it is not a *Lewisian* one. Lewis's project in "Finkish Dispositions" is precisely to save the conditional analysis. Abandoning the mechanism that makes the analysis work for masks ("Getting Specific") collapses the project.

  #### 2. Why not drop RCA?
  Dropping RCA would solve the inconsistency trivially, but it would amount to surrendering the core reductionist ambition of Lewis's paper. If you keep IDT and "Getting Specific" but drop RCA, you are left saying: "The glass has an intrinsic basis, and we specify the stimulus specifically, but we don't analyze this via counterfactuals." This leaves you with a primitive dispositionalism that Lewis explicitly sought to avoid. For a philosopher committed to Humean supervenience and the analysis of modal talk, RCA is the non-negotiable core.

  #### 3. Why drop IDT?
  Jettisoning IDT is the only move that preserves the integrity of the Conditional Analysis (RCA) while accommodating the data from both Finks and Masks.

  *   **Consistency with "Getting Specific":** If you drop IDT, you embrace the Choi/Gundersen line: dispositions are extrinsic. This validates the "Getting Specific" move not as a patch, but as a reflection of the metaphysical reality. Disposition ascriptions are inherently context-sensitive. The packed glass *isn't* fragile in that context. The unpacked duplicate *is*. There is no contradiction because we no longer claim dispositions must be intrinsic.
  *   **Handling Finks Uniformly:** Dropping IDT forces a uniform treatment of Finks. In the reverse-cycle fink case, the Choi/Gundersen view says the wire is *not* live (because the conditional "If touched, it would conduct" is false). While this contradicts the pre-theoretic intuition that the wire "is live," it is a smaller bullet to bite than the inconsistency in Lewis's original framework. It treats the fink exactly like the mask: an extrinsic condition that prevents the truth of the conditional, thereby negating the disposition ascription.
  *   **Theoretical Cost:** Lewis's motivation for IDT was to ensure dispositions are "in the object." However, as your worry highlights, the "Getting Specific" move already concedes that the *individuation* of the disposition depends on the environment. If the environment determines whether we ascribe $D$ or $D^*$, the intrinsicality constraint is already functionally dead. Formally dropping IDT simply makes the theory honest about its own commitments.

  ### Conclusion

  The inconsistency is real: Lewis uses IDT as a shield against Finks but pierces it with a spear for Masks. To remain a Lewisian—that is, to maintain the project of analyzing dispositions via conditionals (RCA) while accounting for the complexity of interference (Getting Specific)—you must accept that disposition ascriptions are extrinsic.

  A consistent Lewisian should therefore **abandon IDT**. This aligns the metaphysics with the semantics of the analysis: if the truth of the analyzing conditional depends on extrinsic masking conditions, then the property being analyzed must likewise be sensitive to those conditions. Retaining IDT while employing "Getting Specific" is an attempt to have intrinsic properties with extrinsic truth conditions, and that is the genuine contradiction your seminar group overlooked.
