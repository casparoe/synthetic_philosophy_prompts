prompt: |-
  A friend and I spent an evening arguing about a decision-theoretic idea known as "evidential cooperation in large worlds" (ECL): roughly, the claim that because the universe (or multiverse) likely contains vast numbers of causally disconnected agents, some of whom reason similarly to us without being exact copies of us, we have reason to act more like a compromise between our own values and theirs, since doing so is evidence that relevantly similar agents elsewhere are reasoning the same way and reciprocating in kind. My friend insisted this is just Douglas Hofstadter's older idea of superrationality (roughly: sufficiently similar agents facing a one-shot Prisoner's Dilemma should cooperate, since each one's choice is evidence of the other's) dressed up in cosmological language. I argued that ECL becomes a substantially harder problem once the cooperating agents are no longer exact copies of one another and can hold differing values. Please compare superrationality and ECL directly. In what precise sense is superrationality a special case of the reasoning behind ECL, and what new difficulties — for instance, how correlated two agents' dispositions must be before cooperation is warranted, or how to define a fair "compromise" among differing values — arise once you generalize from a symmetric pair of identical agents to a large, diverse population of them? On balance, does this generalization leave the case for cooperating with distant, unseen agents basically intact, or does it introduce weaknesses that the simpler superrationality case never had to face?
reasoning: |-
  Here's a thinking process that leads to the comparison between Superrationality and Evidential Cooperation in Large Worlds (ECL):

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Comparison between Douglas Hofstadter's "Superrationality" and "Evidential Cooperation in Large Worlds" (ECL).
      *   **Core Dispute:** Friend says ECL is just Superrationality with cosmological fluff. User says ECL is harder because agents aren't exact copies and have different values.
      *   **Tasks:**
          1.  Compare Superrationality and ECL directly.
          2.  Explain in what precise sense Superrationality is a special case of ECL.
          3.  Identify new difficulties in the generalization (correlation thresholds, value compromise, etc.).
          4.  Evaluate whether the generalization weakens the case for cooperation compared to the simpler case.

  2.  **Define the Concepts:**
      *   **Superrationality (Hofstadter):** Arises in symmetric games (like Prisoner's Dilemma). Agents are identical reasoners. If I cooperate, you (being identical) will cooperate. Therefore, I should cooperate to get the (C,C) payoff rather than (D,D). Key assumption: *Identity* or near-perfect correlation in reasoning.
      *   **ECL (Oesterheld, Conitzer, etc.):** Arises in a "large world" (infinite or vast multiverse). Agents are *not* identical. They are causally disconnected but logically/acausally linked via similar decision algorithms. I should act in a way that, if adopted by similar agents, maximizes overall value (weighted by correlation and stake). Key assumption: *Correlation* in decision-making across diverse agents.

  3.  **Analyze the Relationship (Special Case vs. Generalization):**
      *   *Superrationality:* 2 agents, identical utility functions, identical algorithms, symmetric situation.
      *   *ECL:* $N$ agents (where $N$ is huge), diverse utility functions, diverse algorithms (but correlated), asymmetric situations.
      *   *Connection:* Superrationality is the limit case of ECL where correlation = 1 and utility functions are identical. ECL generalizes the "logical link" to cases where the link is probabilistic and the goals differ.

  4.  **Identify New Difficulties (The "Hard Parts" of ECL):**
      *   *Correlation Strength:* In Superrationality, correlation is assumed perfect (by definition of "identical reasoner"). In ECL, how similar must the reasoning be? Is it 51%? 90%? Does it decay with cognitive distance?
      *   *Value Aggregation/Compromise:* In Superrationality, we both want the same thing. In ECL, I care about $X$, they care about $Y$. If I help $Y$, do they help $X$? How do we trade off? (The "Trading Protocol" problem).
      *   *Reference Class:* Who counts as a "similar agent"? Humans? AIs? Aliens? Simulations? This is the "Reference Class Problem" on steroids.
      *   *Causal vs. Evidential:* Both rely on EDT (Evidential Decision Theory) or FDT (Functional Decision Theory). But ECL relies on the *volume* of the multiverse to outweigh local causal costs.
      *   *Extortion/Blackmail:* If I'm willing to compromise, does that make me vulnerable to agents with extreme values who demand everything?

  5.  **Evaluate the Strength of the Argument (Intact vs. Weakened):**
      *   *Argument for Intact:* The logic holds if you accept EDT/FDT. The sheer number of agents ($N$) can swamp the uncertainty about correlation. Even low correlation $\times$ huge $N$ = significant impact.
      *   *Argument for Weakened:* The "Reference Class" and "Correlation" uncertainties are massive. Without a clear metric for similarity, the theory is action-guiding only in vague terms. The "Compromise" problem introduces game-theoretic complexities (bargaining solutions) that don't exist in symmetric PD.
      *   *Verdict:* It introduces significant structural weaknesses/ambiguities that Superrationality sidestepped by assumption. It doesn't necessarily *refute* ECL, but it makes it much less robust as a prescriptive theory.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the friend's point (they share DNA) but validate the user's intuition (ECL is strictly harder).
      *   *Section 1: The Core Logic (Superrationality).* Define it clearly. Focus on symmetry and identity.
      *   *Section 2: The Generalization (ECL).* Define it. Focus on "Large Worlds," diversity, and acausal trade.
      *   *Section 3: Superrationality as a Special Case.* Show the math/logic reduction. (Identical Utilities + Correlation=1).
      *   *Section 4: New Difficulties.*
          *   *Correlation Metric:* How to measure "similarity of reasoning"?
          *   *The Compromise Problem:* How to aggregate different utility functions? (Nash Bargaining? Utilitarian sum?)
          *   *Reference Class:* Who is in the club?
          *   *Asymmetry:* What if one side has more to gain/lose?
      *   *Section 5: Evaluation.* Does the case hold?
          *   *Pros:* Scale compensates for uncertainty.
          *   *Cons:* Ambiguity makes it fragile. Vulnerable to "fanaticism" or extreme values.
      *   *Conclusion:* Summarize. The friend is right about the *engine*, but the user is right about the *terrain*.

  7.  **Refining the Tone:**
      *   Ensure philosophical precision (mention EDT, FDT, acausal trade).
      *   Keep it balanced.
      *   Address the specific prompt questions (precise sense, new difficulties, on balance).

  8.  **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure not to conflate ECL with "Pascal's Mugging." While related in terms of small prob $\times$ huge impact, ECL is about *correlation*, not just low-probability existence.
      *   *Nuance:* Acknowledge that Superrationality is often criticized for the same reasons (why think my choice causes yours?), so ECL inherits the foundational critique of EDT/FDT.
      *   *Specific Terminology:* Use terms like "acausal trade," "logical correlation," "utility functions."

  9.  **Final Polish:** Check against the prompt requirements one last time.
      *   Compare directly? Yes.
