answer: |-
  The air in the command module tasted like recycled copper. Ren, Sola, and Vik sat around the haptic table, the glow of the status grid painting their faces in sickly greens and ambers. They were three days out from the Oort cloud, salvage rights on a derelict freighter that was bleeding radiation.

  The protocol was strict. Protocol 9-Alpha. To authorize a plasma purge of the freighter's engine block, two conditions had to be met. The system didn't ask for a verdict. It asked for data.

  Condition A: Core Instability Critical?
  Condition B: Containment Field Holding?

  If A is YES and B is YES, the system authorizes Purge.

  "Let's run the diagnostics," Ren said. His voice sounded thin, swallowed by the hum of the life support. He rubbed his temples. He'd had a headache since wake-up cycle, a dull pressure behind the eyes that spiked whenever he looked at the freighter on the main screen.

  Sola tapped her console. "Reading Condition A. My sensors say... Yes. Instability is critical. It's going to blow on its own."

  Vik looked up from his datapad. He looked pale. "I agree. Condition A is Yes."

  Ren checked his own screen. The seismic vibrations were off the charts. "Condition A is Yes."

  The table chimed. **Majority on Condition A: YES.**

  "Okay," Sola said. She shifted in her seat. The leather creaked. "Condition B. Containment Field. Is it holding enough for a controlled purge?"

  She hesitated. Her fingers hovered over the haptic keys. "My readout shows micro-fractures. But the magnetic seal is intact. Technically... Yes. It's holding."

  Vik swallowed hard. "My diagnostics show the same. The field is stable enough to channel the blast. Condition B is Yes."

  Ren looked at his screen. The containment metrics were green. Barely. But green. "Condition B is Yes."

  The table chimed again. **Majority on Condition B: YES.**

  A silence fell over the room. It was heavier than the gravity plating. The central screen flickered, processing the boolean logic. *If A and B, Then Purge.*

  **AUTHORIZATION GRANTED. PURGE SEQUENCE INITIATED.**

  The countdown timer appeared. 00:59... 00:58...

  Nobody moved.

  Ren stared at the button that would manually override the sequence. His hand twitched, but he didn't press it. He looked at Sola. She was staring at the timer, her mouth slightly open. Vik was looking at his hands.

  "Wait," Ren said. The word felt clumsy. "We're doing this?"

  Sola blinked, as if waking up. "The system authorized it. A and B were confirmed."

  "I know," Ren said. The pressure behind his eyes pounded. "But... are we purging?"

  "No," Sola said immediately. "Absolutely not. The fracture risk is too high. If we purge, the field shatters. We lose the ship."

  Ren turned to Vik. "Vik?"

  Vik shook his head slowly. "I voted Yes on the containment field because the metrics said so. But... I know there's a variance in the secondary coil. If we purge, it blows backward. Into us. I'm not signing off on a purge."

  Ren looked back at the screen. **PURGE SEQUENCE: ACTIVE.**

  "So," Ren said, his voice dropping. "Sola votes No on the purge. Vik votes No on the purge." He paused. "I vote No on the purge."

  The timer ticked. 00:30...

  "Then why," Sola whispered, "is the ship arming the charges?"

  "It's the math," Vik said. He sounded nauseous. "We voted on the pieces. The majority said the engine is unstable. The majority said the field is holding. The system took the majority of the pieces and built a conclusion none of us agreed with."

  "It's a ghost decision," Ren said. The wrongness of it washed over him, cold and slick. It felt like standing on a staircase that wasn't there. They had all agreed on the facts, mostly. They had all agreed on the risk. But the aggregation had spat out a command that hung in the air, owned by no one.

  "Override it," Sola said. Her hand moved toward her console.

  "I can't," Ren said. "Protocol 9-Alpha locks out manual override once logical consistency is achieved. The system thinks we decided this."

  "We didn't decide anything," Vik said. "We just answered questions."

  00:10...

  The hum of the ship seemed to deepen, vibrating in their teeth. It was the sound of a machine doing exactly what it was told, while the people who told it watched in horror. They were three adults, fully competent, fully informed, and yet they were about to commit an act that every single one of them believed was suicidal.

  "Stop it," Sola said, her voice rising. "Someone stop it."

  "I can't," Ren said. He felt paralyzed, not by fear, but by the sheer absurdity of the trap. They had been outvoted by a majority that didn't exist.

  00:03...

  "Who owns this order?" Vik asked. The question hung there, unanswered.

  00:00.

  The freighter on the screen flared white. The shockwave hit them a second later, rattling the hull. But the containment held. Just. The blast vented safely into the void.

  They sat in the silence that followed. The danger was passed. The logic had worked. The ship was safe.

  Ren looked at his crew. Sola was shaking. Vik was staring at the floor.

  "We should log this," Ren said quietly. "Note the discrepancy."

  Sola looked up. Her eyes were hollow. "What do we write? 'We decided to purge, but none of us decided to purge'?"

  "We write that the protocol was followed," Vik said. He stood up, his chair scraping loudly against the deck. "The data was correct. The outcome was optimal."

  "It was wrong," Ren said.

  "It was efficient," Vik corrected. He walked to the airlock. "I'm going to check the seals."

  Ren stayed at the table. The screen had reset. **STATUS: NORMAL.**

  He looked at his hands. They felt like they belonged to someone else. He thought about the next decision, and the one after that. He realized with a cold dread that the system wasn't broken. It was working perfectly. It was designed to produce decisions that no human being would ever have to take responsibility for.

  He reached for his coffee, but his hand stopped halfway. He didn't want the coffee. He realized he hadn't wanted any of this. He wondered, briefly, if he was still the one sitting in the chair, or if he was just another variable in the equation, waiting to be summed up.
