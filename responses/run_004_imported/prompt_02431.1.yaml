      *   *Wait, I need Member 3 to vote No on the conclusion but Yes on premises to help the majority.*
      *   Let's adjust:
      *   Member 1 (Elias): Contaminant (Yes), Seal (No). -> Purge? No.
      *   Member 2 (Sarah): Contaminant (No), Seal (Yes). -> Purge? No.
      *   Member 3 (Kael): Contaminant (Yes), Seal (Yes). -> Purge? No. (Why? Maybe he knows the purge system is broken).
      *   *Majority Contaminant:* Yes (Elias, Kael).
      *   *Majority Seal:* Yes (Sarah, Kael).
      *   *System Logic:* IF Contaminant (Majority Yes) AND Seal (Majority Yes) THEN Purge.
      *   *System Output:* PURGE.
      *   *Individual Wills:* No, No, No.
      *   *This works.*

  6.  **Writing - Focusing on Atmosphere:**
      *   Use sensory details: the hum, the light, the silence.
      *   Show the disconnect between the individual judgment and the collective output.
      *   The "wrongness" should feel like a glitch in reality.

  7.  **Revision during drafting:**
      *   Make sure the "not one member" constraint is clear.
      *   Ensure the "premises voting" mechanism is clear without being a lecture.
      *   Highlight the feeling of dissociation.

  8.  **Final Polish:**
      *   Check pacing.
      *   Ensure the ending lands the theme.

