      *   **Ending:** They accept it because "the math says so," but the unease remains.

  5.  **Refining the Logic for the Story:**
      *   Decision: Purge the Airlocks.
      *   Conditions: Contaminant Detected (C) AND Seal Integrity Holds (S).
      *   Rule: Purge if C AND S.
