answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s best friend.

  I've known [Bride] for [Number] years. I've seen her through breakups, career changes, and that one summer she tried to make kombucha in the bathtub. So, when she told me she was marrying [Groom], I was thrilled. But then I found out I was giving the toast, and I realized I had a problem.

  Because, as many of you know, [Groom] is a metaphysician. And not just the kind who wonders about the meaning of life over a beer. He wrote his entire dissertation defending *perdurantism*.

  For the family and friends in the back who didn't sleep through college: Perdurantism is the view that people aren't wholly present in any single moment. Instead, we are four-dimensional "spacetime worms." We stretch across time. The [Groom] who met [Bride] five years ago, the [Groom] standing here today, and the [Groom] who will be trying to figure out the remote control at ninety years old… strictly speaking, they aren't the same person. They are just different temporal parts of one long worm.

  Now, full disclosure: I am an *endurantist*. I believe I am wholly me, right now, all the way through. So, naturally, I was worried. How do you toast a marriage when the groom technically believes the person you're toasting isn't entirely here?

  But then I thought about it. And actually, I think this makes [Bride]'s commitment even more impressive.

  When [Bride] says, "I love you," she isn't just loving the temporal slice standing at the altar. She isn't just loving the guy who wrote the dissertation, or the guy who currently loads the dishwasher correctly. She is committing to the *entire worm*.

  She is looking down the timeline and saying, "I love the 30-year-old slice, I love the 50-year-old slice, and I am fully prepared to love the 90-year-old slice, even if that slice has forgotten where he put his glasses."

  And it makes the wedding vows fascinating, doesn't it? "Till death do us part."

  For most of us, that means we stay together until the end. But for [Groom], the "death" part is already baked into the worm. The end of the marriage and the end of the [Groom]-worm are the same coordinate in spacetime. So, in a very literal sense, the parting is structurally guaranteed. The only way they *don't* part at death is if they achieve metaphysical immortality, which, given the budget for this wedding, I don't think was in the cards.

  [Bride], my job as your best friend is to look out for you. And technically, I should warn you: marrying a perdurantist means you are marrying a vast, extended object across time. There will be slices of him that are grumpy. There will be slices that are brilliant. There might be a slice in 2035 that really loves jazz fusion.

  But watching you two together, I've realized that maybe the philosophy doesn't matter as much as the glue. Because while [Groom] might argue that he is made of distinct temporal parts, *you* are the one who makes them feel like a whole. You are the constant that runs through his timeline. You bind the worm together.

  So, [Groom], even though I believe you are wholly present today, I promise to respect your ontology. And [Bride], thank you for loving all of him, from the earliest slice to the very last.

  If everyone could please raise a glass.

  To the bride and groom. May your love be timeless, even if your parts are temporal. To the happy couple!
