answer: |-
  Here is a structured argument designed for a formal epistemology seminar. It moves beyond the computational/psychological impossibility of common knowledge and targets the normative foundations of the Common Prior Assumption (CPA) itself.

  ***

  ### The "Hidden Premise" Objection: Why the Common Prior Assumption Does the Heavy Lifting

  The standard pedagogical approach to Aumann's Agreement Theorem treats the **Common Knowledge** condition as the fragile premise and the **Common Prior** condition as a harmless idealization of rationality (via the Harsanyi Doctrine). I propose you invert this for your students. The Common Knowledge condition is merely the *mechanism* of transmission; the Common Prior Assumption is the *source* of the convergence.

  Without the CPA, Bayesian rationality does not lead to agreement; it merely leads to coherent divergence. By insisting on the Harsanyi Doctrine, we are not clarifying what Bayesian rationality requires; we are smuggling in a controversial form of Objective Bayesianism that subjective Bayesians explicitly reject.

  Here is the case against the Harsanyi defense, broken down into three philosophical moves.

  #### 1. The Autonomy of Priors in Subjective Bayesianism
  The Harsanyi Doctrine states: *"If two rational agents have the same information, they must have the same probabilities."*

  This sounds compelling until we recall the foundational commitment of **Subjective Bayesianism** (the framework usually assumed in these epistemic models). In the Ramsey/de Finetti/Savage tradition, rationality is defined as **coherence**, not **accuracy**.

  *   **Coherence:** Your probabilities must satisfy the axioms of probability (to avoid a Dutch Book).
  *   **Accuracy/Convergence:** Your probabilities must match the world or match each other.

  Subjective Bayesianism has no internal resources to mandate convergence. To a strict subjective Bayesian, a prior is akin to a utility function or a taste preference. Rationality demands that I maximize my expected utility given my beliefs, but it does not demand that I share your utility function. I can prefer vanilla; you can prefer chocolate; we are both rational.

  Similarly, I can assign $P(H) = 0.9$ and you can assign $P(H) = 0.1$. As long as we both update via Conditionalization upon receiving new evidence, we are both perfectly rational. To insist that we *must* start at the same point is to abandon Subjective Bayesianism in favor of **Objective Bayesianism** (e.g., Jaynes' Principle of Maximum Entropy or a Principle of Indifference).

  **The Objection:** You cannot use Aumann's theorem (which operates within a subjective Bayesian framework) to prove that disagreement is irrational, while simultaneously relying on the Harsanyi Doctrine (an objective Bayesian constraint) to justify the premises. If you accept Harsanyi, you have already assumed agreement at $t=0$. The theorem merely proves that updating doesn't break what was already assumed.

  #### 2. The "Same Evidence" Equivocation
  Defenders of the CPA often argue that differences in priors must trace back to differences in *past* evidence. Therefore, if we strip away the evidence, we return to a "pre-evidential" state where rational agents must coincide.

  This relies on a metaphysical fiction: the idea of a "tabula rasa" agent with no conceptual scheme.

  *   **Conceptual Schemes:** Agents do not just receive raw data; they carve up the state space $\Omega$ differently. For Aumann's theorem to hold, agents must share the same set of states of the world. But in real epistemic disagreements, agents often disagree on *what the relevant possibilities are*.
  *   **Salience and Weighting:** Even if two agents observe the "same" physical event, their priors encode how they weight hypotheses. One agent might treat "grue" as a natural kind; another treats "green" as a natural kind. This isn't a difference in *information*; it's a difference in *inductive policy*.

  The Harsanyi Doctrine asserts that there is a unique, rational inductive policy. But the "New Riddle of Induction" (Goodman) suggests there isn't. By assuming a Common Prior, Aumann's model assumes away the problem of induction. It assumes there is a single, correct way to map evidence to probability.

  **The Objection:** The CPA doesn't just assume we have the same data; it assumes we process the *potentiality* of data in the exact same way. This isn't a requirement of logic; it's a substantive empirical claim about human cognition that is demonstrably false.

  #### 3. CPA is the Engine, Not the Chassis
  The most damaging formal objection is that the CPA is doing all the work.

  Consider the structure of the theorem:
  1.  Assume Common Priors ($P_1 = P_2 = P_{common}$).
  2.  Assume Common Knowledge of Posteriors.
  3.  **Result:** Posteriors are identical.

  Now, remove the Common Prior.
  1.  Assume Distinct Priors ($P_1 \neq P_2$).
  2.  Assume Common Knowledge of Posteriors.
  3.  **Result:** Posteriors can remain distinct indefinitely.

  If the priors differ, Bayesian updating preserves that difference. If I start 90% sure and you start 10% sure, and we share a likelihood ratio of 1:1 (ambiguous evidence), we stay 90/10. If we share strong evidence, we might move closer, but we will not necessarily meet, and we certainly aren't *forced* to meet by the logic of Bayesianism itself.

  Therefore, the slogan "Rational agents cannot agree to disagree" is misleading. It should be: **"Agents who started with identical beliefs cannot end up with different beliefs if they share their calculations."**

  The "Agreement" is not a discovery about the nature of communication or rationality; it is a tautology of identity. If $x = y$ at the start, and $f(x) = f(y)$ (same updating rule), then $x_{end} = y_{end}$. The theorem tells us nothing about what happens when $x \neq y$ at the start, which is the only case where "agreement" is actually in question.

  #### Bonus: Why Subjective Bayesianism Cannot Mandate Shared Priors
  To drive the point home regarding your bonus question: Subjective Bayesianism grounds probability in **betting behavior** and **decision theory**.

  *   **The Dutch Book Argument:** This proves that if your probabilities are incoherent, you will accept a set of bets that guarantees a loss. It is a pragmatic argument for *consistency*.
  *   **The Interpersonal Gap:** There is no "Dutch Book" argument that forces two agents to align. I cannot Dutch Book you simply because your prior differs from mine. I can only Dutch Book you if *your* priors and posteriors are inconsistent with *each other*.

  Since Subjective Bayesianism defines rationality as the avoidance of sure loss, and differing priors do not lead to sure loss (they just lead to different bets), there is **no normative pressure** within the theory for priors to converge.

  To insist on the Harsanyi Doctrine is to claim that there is a "True Prior" waiting to be discovered, like a physical law. But Subjective Bayesianism was invented specifically to avoid positing such metaphysical entities. By reinstating the Common Prior to save the Agreement Theorem, you are effectively rejecting the subjective Bayesian framework that gives the theorem its formal structure.

  ### Pedagogical Takeaway for the Seminar
  Encourage your students to view Aumann's Theorem not as a proof that disagreement is irrational, but as a **trilemma**. In any situation of persistent disagreement, at least one of the following must be true:

  1.  **Agents are not Bayesian:** (They update irrationally).
  2.  **Priors are not Common:** (They started with different inductive policies/worldviews).
  3.  **Posteriors are not Common Knowledge:** (They don't truly understand each other's epistemic state).

  The standard defense tries to save (1) and (3) by insisting (2) is impossible for rational agents. Your objection shows that (2) is the most likely candidate for rejection. Disagreement persists not because we are bad at sharing information (Common Knowledge), but because we are fundamentally different epistemic engines (Common Priors). And Bayesianism, properly understood, says that's allowed.
