          *   As long as priors are probabilistically coherent, they are rational.
          *   Therefore, two agents can have wildly different coherent priors. One can be optimistic, one pessimistic, provided they update correctly.
          *   *Conclusion:* CPA is an *additional* constraint, not internal to subjective Bayesian rationality.

      *   *Point 2: The "Same Evidence" Problem.*
          *   Harsanyi says "same evidence $\rightarrow$ same prior." But priors represent the starting point *before* evidence.
