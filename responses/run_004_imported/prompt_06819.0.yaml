answer: |-
  This is a magnificent premise. You have identified the precise fault line that B.K. Matilal, in *Epistemology in Classical India* and *The Character of Logic in India*, identifies as one of the most fertile grounds in Indian philosophy. The debate over *śabda-pramāṇa* (verbal testimony) is not merely linguistic; it is a debate about the architecture of knowledge itself and the social nature of human understanding.

  To help you stage this without caricature, we must distinguish between the *phenomenology* of listening (how it feels) and the *justification* of listening (why it counts as knowledge).

  Here is a breakdown of the positions, the stress points, and a judgment on who holds the stronger ground.

  ### 1. The Naiyāyika Position: *Śabda* as Irreducible
  **Lineage:** Vātsyāyana (commentator on the *Nyāya-Sūtra*) and Uddyotakara (*Nyāya-Vārttika*).
  **Core Claim:** Verbal testimony is a distinct, independent instrument of knowledge (*pramāṇa*), irreducible to perception (*pratyakṣa*) or inference (*anumāna*).

  **The Mechanism:**
  For the Naiyāyika, knowledge from testimony arises when a hearer understands the meaning of a sentence uttered by a reliable person (*āpta*). The epistemic work is done by the **semantic power of the words** (*śakti*), not by a logical deduction about the speaker.
  *   **Direct Generation:** When a trustworthy person says, "There is a fire on the mountain," the hearer's cognition of the fire is generated directly by the words. The hearer does not consciously think, "This person is reliable; reliable people speak truth; therefore, there is fire."
  *   **The Role of Reliability:** Reliability (*āptatva*) is a *condition* for the knowledge, not the *cause* of the knowledge. It is like the light required to see a pot; the light allows the vision, but the vision is of the pot, not of the light. Similarly, reliability allows the testimony to work, but the knowledge is of the object, not of the speaker's trustworthiness.
  *   **The Argument from Novelty:** Nyāya argues that testimony gives us knowledge of things we could *never* infer. If I tell you, "The King is performing a sacrifice in the capital," and you are in a remote village, you have no perceptual marks (*liṅga*) to infer this. If testimony were inference, you could not know this. Since you *do* know it, testimony must be a separate channel.

  ### 2. The Buddhist Position: *Śabda* as *Anumāna*
  **Lineage:** Dignāga (*Pramāṇa-samuccaya*) and Dharmakīrti (*Pramāṇa-vārttika*).
  **Core Claim:** There are only two *pramāṇas*: Perception and Inference. Testimony is a form of inference (*anumāna*).

  **The Mechanism:**
  For the Buddhist logicians, words are conceptual constructs (*kalpanā*) that deal with universals, not particulars (*svalakṣaṇa*). Words cannot touch reality directly; only perception can. Therefore, words function as signs.
  *   **Inference of Intent:** When you hear a sentence, you are observing a sign (the speech). You infer the speaker's intention (*tātparya*) and their knowledge state.
  *   **The Syllogism:** The epistemic work is done by a subconscious syllogism:
      1.  *Major Premise:* This speaker is trustworthy (competent and honest).
      2.  *Minor Premise:* This speaker asserts that X is the case.
      3.  *Conclusion:* Therefore, X is the case.
  *   **The Argument from Error:** Buddhists point out that we often reject testimony. If testimony were an independent, direct source of knowledge, we would accept all intelligible speech. We don't. We filter speech through an assessment of the speaker. That filtering process *is* inference. If the mechanism of acceptance relies on judging the speaker, the knowledge is derived from that judgment, not the words themselves.

  ### 3. The Crucible: Hard Cases
  This is where your debate scene should focus. The abstract definitions are stable; the breakdown happens under pressure.

  #### Case A: The Chain of Testimony (The Telephone Game)
  *   **The Scenario:** A fact is passed from Person A to B, B to C, ... to Z. You are Z.
  *   **Nyāya Defense:** The validity of *śabda* depends on the original source being an *āpta*. If the chain preserves the meaning without distortion, the knowledge remains valid. The "light" of the original reliability shines through the chain.
  *   **Buddhist Attack:** Each link in the chain is a separate inference. "B told me C said..." is an inference about B's reliability regarding C. As the chain lengthens, the probability of error compounds. If testimony were a direct *pramāṇa*, the distance from the source shouldn't matter as much as it does. The fact that we distrust long chains proves we are intuitively treating this as probabilistic inference, not direct knowledge.
  *   **Who has the edge?** **Buddhism.** The Nyāya struggle to explain why long chains degrade knowledge if the *pramāṇa* is independent. The Buddhist model explains degradation naturally (compounding inferential error).

  #### Case B: Remote History / Uncheckable Matters
  *   **The Scenario:** "The Vedic seers saw the origin of the cosmos," or "Alexander crossed this river 500 years ago." No living person can perceive or infer this now.
  *   **Nyāya Defense:** This is the stronghold of *śabda*. We *must* have a way to know the past. The Vedas (or reliable chronicles) are authorless or authored by beings with perfect perception. We accept them because the *tradition* is reliable. To demand inference here is to demand the impossible.
  *   **Buddhist Attack:** Dharmakīrti is ruthless here. If a matter cannot be verified by perception or inference *in principle*, it is not a valid object of knowledge (*prameya*). Accepting it is faith (*śraddhā*), not knowledge (*pramā*). If you claim it is knowledge, show me the inference. You infer the chronicler was honest. But how do you know *they* knew? You are inferring based on a chain you cannot verify.
  *   **Who has the edge?** **Nyāya (Pragmatically) / Buddhism (Logically).** Nyāya wins on human necessity (we function as if we know history). Buddhism wins on strict epistemology (you cannot justify the justification).

  #### Case C: The Child Learning Language
  *   **The Scenario:** How does a child learn that the word "cow" refers to the animal?
  *   **Nyāya Defense:** The child perceives the object, hears the word, and grasps the natural/conventional connection (*śakti*) directly. This original learning is not inference; it is a direct association that grounds all future testimony.
  *   **Buddhist Attack:** The child observes the adult looking at the cow and speaking. The child infers: "When the adult sees this animal, they make this sound." It is an inference based on correlation.
  *   **Who has the edge?** **Draw.** Modern cognitive science leans Buddhist (statistical learning/correlation), but phenomenologically, Nyāya feels more accurate to the "aha!" moment of learning a word.

  ### 4. The Verdict: Who Survives Scrutiny?
  If you want a **real intellectual defeat** rather than a strawman, you should let the **Buddhist Logician win the technical debate, but let the Naiyāyika win the human stakes.**

  **Why the Buddhist Wins the Logic:**
  The Nyāya defense of *śabda* as *independent* ultimately rests on a circularity they cannot escape.
  1.  Nyāya says: "We know the speaker is reliable."
  2.  Buddhist asks: "How?"
  3.  Nyāya says: "Because their past statements were verified."
  4.  Buddhist asks: "How were *those* verified?"
  5.  Nyāya says: "By perception or inference."
  6.  Buddhist concludes: "Then the knowledge came from the perception/inference, not the testimony! Testimony is just the delivery system for inferred reliability."

  The Buddhist exposes that *justification* always bottoms out in perception or inference. If you cannot check the speaker's reliability via perception/inference, you have no rational ground to accept their testimony. Therefore, testimony is not an independent *source* of justification; it is a dependent one. In a formal debate (*vāda*), the one who demands the ground of justification (Buddhist) usually defeats the one who posits a brute fact (Nyāya).

  **Why the Nyāya Wins the War:**
  However, the Buddhist victory is Pyrrhic. If testimony is merely inference, human society becomes epistemically isolated. We would have to verify the reliability of every speaker before accepting every sentence. We would lose the ability to learn from tradition, history, or science (since 99% of science is accepted on testimony). The Nyāya can argue: "Your logic is sharp, Monk, but it severs the artery of human community. If *śabda* is not independent, we are all alone in our own perceptions."

  ### 5. Advice for the Scene
  To make this dramatic and authentic:

  1.  **Avoid Jargon Dumps:** Do not have them recite definitions. Have them use metaphors.
      *   **Nyāya Metaphor:** The Lamp. "When I bring a lamp into a dark room, I see the pot. Do I infer the pot from the lamp? No. The lamp reveals it. The reliable speaker is the lamp; the meaning is the pot."
      *   **Buddhist Metaphor:** The Map. "A map is not the territory. It is a sign. To trust the map, I must trust the cartographer. My knowledge comes from my judgment of the cartographer (inference), not the ink on the paper (words)."

  2.  **The Turning Point:** The Buddhist should corner the Naiyāyika on the **Infinite Regress of Reliability**.
      *   *Buddhist:* "You say I accept your word because you are reliable. How do I know you are reliable?"
      *   *Naiyāyika:* "Because your elders say so."
      *   *Buddhist:* "Then I am accepting *their* word. And how do I know *they* are reliable?"
      *   *Naiyāyika:* (Trapped) "It is... self-evident in the tradition."
      *   *Buddhist:* "That is faith, Logician. Not knowledge (*pramā*)."

  3.  **The Naiyāyika's Counter-Strike:** The Naiyāyika should not concede that knowledge is impossible. They should pivot to **Function (*Pravṛtti-sāmarthya*)**.
      *   *Naiyāyika:* "If I tell you 'There is a snake in your robe,' and you jump, did you infer? Or did you know? Your action proves the knowledge was direct. Your logic dissects the frog, but it kills it. I keep the frog alive."

  4.  **The Outcome:** The Buddhist proves that Nyāya cannot *logically* defend the independence of testimony without circularity. The Nyāya proves that the Buddhist cannot *live* without treating testimony as independent.
      *   **Winner:** The Buddhist monk is declared the victor by the judges (on logical consistency).
      *   **Resonance:** The audience leaves whispering the Nyāya's point (because they live in a world of words).

  This setup honors Matilal's insight: Indian logic was not just a game; it was a soteriological tool. The Buddhist wins the logic because their goal is to strip away illusion (including the illusion of linguistic immediacy). The Nyāya wins the world because their goal is to validate the reality we live in.

  **Recommended Reading for Nuance:**
  *   B.K. Matilal, *Epistemology in Classical India*, Chapter 5 ("Testimony").
  *   Gangesha Upadhyaya (if you want to look ahead to the ultimate Nyāya defense, though it's later than your setting).
  *   Dharmakīrti's *Pramāṇa-vārttika*, *Svārthānumāna* chapter (for the Buddhist reduction).

  This approach ensures your "loser" is defeated by rigor, not ignorance, and your "winner" wins at a cost, making the victory bittersweet and intellectually honest.
