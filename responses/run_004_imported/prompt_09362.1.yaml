          *   *Nihilists:* Only simples exist. "Table" is just a facon de parler.
          *   *Universalists:* Any collection of things composes something.
          *   *Restrictivists (Common Sense):* Some things compose objects, others don't (e.g., parts of a table do, but a shoe and the Eiffel Tower don't).

      *   **Eli Hirsch (Quantifier Variance):**
