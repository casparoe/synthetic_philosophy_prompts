          *   Conclusion: Merely verbal.

      *   **David Chalmers (Verbal Disputes/Subscript Gambit):**
          *   Framework: A dispute is verbal if there's a resolution by disambiguation.
          *   Method: Apply subscripts to terms (e.g., $exists_1$, $exists_2$).
          *   Test: If Party A asserts $P_1$ and Party B denies $P_2$, and both agree on the underlying non-semantic facts, it's verbal.
          *   Nuance: Chalmers is often open to the idea that many metaphysical disputes are verbal, but he allows for substantive ones if they connect to fundamental structure.

      *   **Ted Sider (Writing the Book of the World/Joint-Carving):**
          *   Counter-argument: Just because terms *can* vary doesn't mean they *do* in the context of metaphysics.
