      *   *Refining the "Conventionalism" point:* This is crucial. Ladyman/French use Poincaré as a forefather of OSR. But they often downplay his conventionalism. For Poincaré, the *group* is the structure. But we choose the group based on convenience. If reality *is* the group (OSR), then reality is partly chosen. Poincaré wouldn't go that far. He'd say the *representation* is structural/conventional, the *cause* is noumenal.

