      *   *Foresight Objection:* Often attributed to Gustafsson or earlier critics. If I know I'll be pumped, I won't make the first trade. This challenges the *practical* force of the pump.
      *   *McClennen's Contribution:* Edward McClennen (*Rationality and Dynamic Choice*, 1990) is the key figure here. He distinguishes between:
