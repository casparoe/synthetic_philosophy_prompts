      *   *McClennen's Framework:*
          *   *Myopic:* Lives in the moment. Gets pumped.
          *   *Sophisticated:* Anticipates future weakness. Uses backward induction. *Crucial Point:* Sophistication avoids the pump but can lead to "dynamic inconsistency" or paralysis in other cases (like the Toxin Puzzle or Ulysses). It treats future selves as adversaries.
          *   *Resolute:* Commits to a plan. "I chose this path, I stick to it even if I prefer otherwise *now*." This preserves the *plan* as the unit of rationality.
