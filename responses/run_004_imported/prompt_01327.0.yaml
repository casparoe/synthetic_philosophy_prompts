answer: |-
  You have not argued yourself into a corner; you have stumbled directly onto the central fault line in contemporary social ontology. Your intuition is sharp: if you reject reductionism (Bratman), you seem forced to choose between Searle's psychological individualism (which looks inconsistent) and Gilbert's plural subjecthood (which looks ontologically extravagant).

  For a seminar with first-years, you need to disentangle **ontological commitment** from **analytical reducibility**. Here is a way to map the terrain that respects your naturalistic worries while giving Searle and Gilbert their due.

  ### 1. Diagnosing the Dilemma
  Your worry rests on this inference:
  > If State $S$ cannot be reduced to the sum of Individual States $i_1...i_n$, then the subject of $S$ must be a Group Entity $G$.

  This inference holds if you assume that all intentions must be properties of *substances*. If the group isn't a substance, and the individuals don't fully hold the property, where does it live?

  However, both Searle and Gilbert reject the premise that irreducibility implies a "Group Mind" in the Durkheimian (mystical/substantial) sense. They just disagree on *what* is irreducible.

  ### 2. Searle: Irreducible Mode, Individual Token
  You are right to be suspicious of Searle's claim that "we-intentions are in the head." It sounds like he wants his cake (individualism) and eat it too (irreducibility). But his specific move is more nuanced than it appears.

  *   **The Move:** Searle distinguishes between the **content** of the intention and the **mode** of the intention.
      *   *Bratman:* The mode is "I-intend," the content is complex ("...that we J").
      *   *Searle:* The mode itself is primitive ("We-intend").
  *   **The Metaphysics:** Searle is a biological naturalist. He argues that human brains have evolved a specific capacity to token "we-mode" states.
  *   **Addressing the "Seat" Worry:** For Searle, there isn't *one* seat of the we-intention. There are *many*. If you and I carry a couch together, there is a token of the we-intention in your brain and a token of the *same type* of we-intention in my brain.
  *   **Is it Spooky?** No, because he isn't positing a group entity. He is positing a **relational property of individual psychology**. Just as "being a husband" is an irreducible status that resides in an individual (you can't be a husband alone), "we-intending" is a status an individual brain can hold, provided the world cooperates.
  *   **The Cost:** The cost isn't ontological (no new entities); it's psychological. He requires us to accept that individual intentionality is not always individualistic in content.

  **Seminar Hook:** Ask the students: "When you play on a soccer team, do you think 'I intend to score' or 'We intend to win'?" Searle says the latter is the primitive experience, not a calculation derived from the former.

  ### 3. Gilbert: The Plural Subject as a Normative Bond
  You are also right that Gilbert bites the bullet more openly. She explicitly argues that joint commitment creates a **Plural Subject**.

  *   **The Move:** For Gilbert, a we-intention isn't just a psychological state; it's a **deontic bond**. When we jointly commit, we create a new entity (the plural subject) that is the bearer of rights and obligations.
  *   **The Metaphysics:** This is where your Durkheimian worry is most potent. However, Gilbert insists this isn't "spooky." The plural subject is not a *super-organism* floating above us. It is **ontologically dependent** on the individuals. It exists only in virtue of their readiness to act as a body.
  *   **Addressing the "Seat" Worry:** For Gilbert, the "seat" of the intention is not in the skull; it is **in the relation**. It is a social fact, not a psychological fact.
  *   **Is it Spooky?** It depends on your tolerance for non-reductive relational facts. If you accept that "being married" is a real fact that isn't just "two people living together + beliefs," you can accept Gilbert's plural subject. It is a *social* substance, not a *physical* one.
  *   **The Cost:** Higher ontological commitment than Searle. She admits the group is a subject of attribution, distinct from the sum of members.

  ### 4. Resolving the Naturalist Anxiety
  To reassure your naturalistic colleagues (and yourself), you need to distinguish between **Substance Holism** and **Fact Holism**.

  *   **Substance Holism (The Spooky Kind):** The group has a mind/brain separate from the members. (Durkheim is often caricatured this way; nobody in this seminar defends this).
  *   **Fact Holism (The Acceptable Kind):** There are facts about the world (social facts) that cannot be fully described using only the vocabulary of individual psychology or physics, even though they supervene on them.

  **The Crucial Distinction for the Seminar:**
  Non-reductive physicalism is standard in philosophy of mind (mental states aren't reducible to neural firings, but aren't spooky souls). Searle and Gilbert are proposing **Non-reductive Social Individualism** (Searle) or **Non-reductive Social Relationalism** (Gilbert).

  You can tell the students: *"We don't need to believe in a group ghost to believe that 'We intend' is real. We just need to decide if 'We intend' is a fancy way of saying 'I intend' (Bratman), a primitive brain state (Searle), or a binding agreement (Gilbert)."*

  ### 5. Teaching Strategy: The "Duet" Analogy
  To avoid hand-waving with first-years, use a musical analogy.

  *   **Scenario:** A piano duet.
  *   **Bratman:** I intend to play my part, you intend to play yours, and we both know it. (If I stop, you keep playing; we just failed to coordinate).
  *   **Searle:** I intend *us* to play the duet. (If I stop, *our* intention is frustrated, not just my individual plan). The intention is in my head, but its content is us.
  *   **Gilbert:** We have formed a "duet entity." We are now obligated to each other to continue. If I stop, I violate a commitment to the *plural subject* we created.

  **The Metaphysical Bottom Line:**
  1.  **Searle** saves naturalism by keeping the ontology individual but making the psychology richer.
  2.  **Gilbert** saves the phenomenology of obligation by making the ontology richer (plural subjects).
  3.  **Neither** requires a mystical group mind. Searle locates the irreducibility in **neuro-capacity**; Gilbert locates it in **normative relations**.

  ### Summary for your Thursday prep
  You aren't in a corner; you're at the fork in the road.
  *   If you want to stay close to the **science building**, lean Searle. It's cognitively irreducible but ontologically parsimonious.
  *   If you want to capture the **normative force** of social life (why we feel *bound* to others), lean Gilbert. It's ontologically heavier but explains obligation better.

  Tell the students: *"Searle thinks the 'We' is in the head. Gilbert thinks the 'We' is in the handshake. Both agree it's not just a sum of 'I's."* That should keep the metaphysics clear without invoking ghosts.
