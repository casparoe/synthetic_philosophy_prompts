          *   *Location:* In the head of each individual.
          *   *Metaphysics:* Methodologically individualist (no group minds).
          *   *The Tension:* How can something be irreducible to individual states but still *be* an individual state?
          *   *Searle's Move:* It's not about the *content* being decomposable, it's about the *mode* of the intention. "We-intend" is a primitive psychological mode, like "I-believe" or "I-desire." It doesn't require a group entity, just individuals capable of that mode.

      *   **Gilbert:**
          *   *Claim:* Joint Commitment creates a "Plural Subject."
          *   *Location:* Not strictly in the head; it's a normative bond between people.
          *   *Metaphysics:* More ontologically committed than Searle. The "plural subject" is a real entity, though constituted by individuals.
          *   *The Tension:* Is this spooky holism? Gilbert says no, it's a specific kind of social fact, not a mystical group mind.

      *   **Bratman (The Contrast):**
          *   *Claim:* Reductionist/Functionalist. "We intend" = "I intend + You intend + Mutual Knowledge + Meshing Subplans."
