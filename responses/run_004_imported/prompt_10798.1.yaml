      *   *Self-Correction on Q3 (Law):* Focus on the *Model Penal Code* or *Mens Rea* specifically to sound informed.

  5.  **Final Polish:** Organize logically (Start with the theoretical challenge, move to implications, end with practical application). Ensure the follow-ups feel like a natural conversational pivot. (Proceed to generate output).

