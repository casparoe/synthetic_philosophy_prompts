prompt: |-
  Got a podcast episode taping next week with a philosopher who's built a chunk of her career defending the classic reading of the Knobe effect -- that our moral judgments actually leak into the concept of "intentional action" itself, not just how we talk about it afterward. I don't want the episode to just be her re-running the chairman-and-the-environment vignette for the millionth time. Can you draft me 8-10 interview questions that actually press on the sore spots: at least one on the rival explanation that its norm-violation in general (even goofy non-moral rules) doing the work rather than moral badness specifically, one on the objection that "intentionally" talk is just pragmatic blame-language rather than tracking a real psychological fact, and one on what it means for how juries and judges size up intent if the folk concept turns out to be morally contaminated like this. For each, throw in a sharp follow-up keyed to whatever answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** A philosopher defending the *classic reading* of the Knobe Effect (Joshua Knobe's side-effect effect). This means she believes moral judgments *constitutively* influence the concept of intentional action (the "Deep View" or "Moral Contamination" view), rather than it being a performance error or pragmatic implicature.
      *   **Goal:** 8-10 interview questions that avoid rehashing the basic Chairman/Environment vignette.
      *   **Specific Requirements:**
          *   Press on "sore spots" (criticisms/controversies).
          *   Include a question on the *Norm-Violation* rival explanation (it's about breaking rules, not morality specifically).
          *   Include a question on the *Pragmatic/Blame* objection (it's just language, not psychology).
          *   Include a question on *Legal Implications* (juries/judges).
          *   Include a sharp follow-up for each question based on the likely answer.
      *   **Tone:** Engaging, probing, suitable for a podcast (conversational but intellectually rigorous).

  2.  **Deconstruct the Knobe Effect & The "Classic Reading":**
      *   *The Effect:* People say the harm side-effect was intentional, but the help side-effect was not, even though the mental state (belief/desire) is identical.
      *   *The Classic Reading (Knobe et al.):* Moral evaluation is part of the cognitive machinery used to determine intentionality. It's not a bug; it's a feature.
      *   *Rival 1 (Norm-Violation):* It's about deviating from the norm (good or bad), not specifically *moral* badness. (Uttich & Lombrozo, etc.)
      *   *Rival 2 (Pragmatics):* We know it's not intentional, but we say it is to blame. (Adams, Steadman, etc.)
      *   *Implications:* If intentionality is morally laden, legal *mens rea* might be unstable.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Norm-Violation Challenge.* Need to ask about non-moral norms.
          *   *Draft:* Is it just about breaking rules?
          *   *Refinement:* Make it specific. Etiquette vs. Morality.
          *   *Follow-up:* If she says morality is special, press on *why* the cognitive mechanism treats them similarly.

      *   *Q2: The Pragmatic/Blame Objection.*
          *   *Draft:* Are we just blaming them?
          *   *Refinement:* Focus on the "truth conditions" vs. "assertability." Is the concept corrupted or just the usage?
          *   *Follow-up:* If she says it's the concept, ask about error theory. Are all the critics wrong about their own concepts?

      *   *Q3: Legal Implications.*
          *   *Draft:* What about juries?
          *   *Refinement:* Focus on *mens rea* and the stability of the law. If intent shifts based on outcome, is justice blind?
          *   *Follow-up:* If she says "law should adapt," ask about the cost of legal uncertainty.

      *   *Q4: The "Good" Side (The Asymmetry).*
          *   *Draft:* Why don't we say the help was intentional?
          *   *Refinement:* Focus on the *praise* asymmetry. Why is blame more sticky than praise?
          *   *Follow-up:* Does this make our concept of agency fundamentally pessimistic?

      *   *Q5: Developmental/Cross-Cultural.*
          *   *Draft:* Do kids do this?
          *   *Refinement:* If kids do it, it's innate. If not, it's learned. What does the data say about universality?
          *   *Follow-up:* If it's universal, does that naturalize the bias?

      *   *Q6: The "Skill" vs. "Intent" distinction.*
          *   *Draft:* What about luck?
          *   *Refinement:* Connect to moral luck. If I succeed, was it skill? If I fail, was it intent?
          *   *Follow-up:* Does this collapse the distinction between character and consequence?

      *   *Q7: AI/Non-Human Agents.*
          *   *Draft:* Do we do this to robots?
          *   *Refinement:* If we attribute intent to an algorithm based on output harm, does the Knobe effect apply to AI?
          *   *Follow-up:* If yes, does that mean we are anthropomorphizing code morally?

      *   *Q8: The "Deep View" Cost.*
          *   *Draft:* Is this a bug or feature?
          *   *Refinement:* You argue this is how the concept *works*. But doesn't this make rational debate about intent impossible?
          *   *Follow-up:* How do we resolve disagreements if our baseline concept is value-laden?

      *   *Q9: Alternative Vignettes.*
          *   *Draft:* Give us a new example.
          *   *Refinement:* Move beyond the CEO. What about the "Helpful Terrorist" or "Bureaucrat"?
          *   *Follow-up:* Does the effect vanish in high-stakes professional contexts?

      *   *Q10: The Takeaway.*
          *   *Draft:* What should we do?
          *   *Refinement:* Should we try to "debias" our concept of intention?
          *   *Follow-up:* Is that even psychologically possible?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered (Norms, Pragmatics, Law)? Yes. Follow-ups included? Yes.
      *   Tone check: Ensure the follow-ups aren't just "But what if..." but specifically anticipate the "Classic Reading" defense (e.g., "It's constitutive, not performance").
      *   *Self-Correction on Q1 (Norms):* Make sure to mention the "etiquette" studies specifically.
