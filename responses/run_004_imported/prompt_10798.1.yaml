answer: |-
  Here are 10 interview questions designed to move past the introductory vignettes and press on the theoretical and practical tensions of the "Deep View" (the classic Knobean reading). Each includes a anticipated answer and a sharp follow-up.

  ### 1. The Norm-Violation Rival
  **Question:** "One of the strongest challenges to your view is the 'Norm-Violation' hypothesis. Critics argue it's not *moral* badness driving the judgment, but simply the violation of *any* norm, even goofy ones like etiquette or arbitrary rules. If I break a dress code to help someone, the asymmetry might still show up. If the effect triggers on *any* deviation from the status quo, doesn't that strip the 'moral' out of the 'moral contamination' thesis?"

  *   **Likely Answer:** She will likely argue that moral norms are *sui generis*—they have a gravity and authority that etiquette norms don't, and that when studies control for the *strength* of the norm, morality remains the unique predictor.
  *   **Follow-up:** "But if the cognitive mechanism is sensitive to 'norm strength' rather than 'moral content,' aren't we just saying our concept of intentionality is sensitive to *statistical weirdness*? If I do something incredibly rare but morally neutral, and people call it intentional, haven't you reduced moral judgment to a glorified detection of outliers?"

  ### 2. The Pragmatic/Blame Objection
  **Question:** "Let's talk about the 'Pragmatic Objection.' Many philosophers argue that when we say the CEO *intentionally* harmed the environment, we don't actually believe the psychological criteria for intent were met. We're just using 'intentionally' as a shorthand for 'he deserves blame for this.' It's a speech act, not a metaphysical claim. Why should we accept that the *concept* itself is corrupted, rather than just our *usage* of it in heated moments?"

  *   **Likely Answer:** She will likely cite experimental data showing that the effect persists even when pragmatic pressure to blame is minimized, or argue that the distinction between semantics and pragmatics is blurrier in folk psychology than philosophers admit.
  *   **Follow-up:** "Okay, but if the folk concept is robustly moral, that implies there is no 'neutral' language left to adjudicate disputes. If my definition of 'intent' inherently includes my judgment of your character, how do we ever have a rational disagreement about what someone intended? Aren't we just trading moral insults disguised as psychological descriptions?"

  ### 3. Legal Implications (Mens Rea)
  **Question:** "I want to pivot to the law. The legal system relies heavily on *mens rea*—the guilty mind. Statutes often hinge on whether a consequence was 'knowing' versus 'intentional.' If your view is right, and the folk concept of intentionality shifts based on the moral valence of the outcome, doesn't that make the law radically unstable? A jury might find intent in a bad outcome case where they wouldn't in a neutral one, even if the mental state was identical."

  *   **Likely Answer:** She may argue that the law *should* reflect our folk concepts because the law is meant to judge moral agents, or she might suggest that legal definitions are technical and can be insulated from folk psychology.
  *   **Follow-up:** "If you say the law *should* reflect it, you're endorsing a system where 'intent' is partially determined by the severity of the harm. That sounds like outcome bias, which is something the law explicitly tries to guard against. Are you comfortable suggesting that a defendant's mental state literally changes depending on how bad the result was?"

  ### 4. The Praise Asymmetry
  **Question:** "The classic effect is strongest on the negative side. We readily say the CEO *intentionally* harmed, but we hesitate to say he *intentionally* helped. Why is the 'moral leak' a one-way valve? If morality constitutes intentionality, why doesn't moral goodness pull actions into the sphere of the intentional just as aggressively as badness does?"

  *   **Likely Answer:** She will likely reference the "Default Effect" or the idea that negative events demand more explanation than positive ones (negativity bias), so we recruit the concept of intent more readily for blame.
  *   **Follow-up:** "Doesn't that suggest that 'intentional action' isn't a unified concept at all? It sounds like we have one concept for 'things we blame' and a different, stricter concept for 'things we praise.' If the concept splits based on valence, can we still talk about *a* theory of intentional action, or are we talking about two different psychological mechanisms?"

  ### 5. Moral Luck and Control
  **Question:** "This view seems to vindicate a certain kind of 'moral luck.' If two agents have the exact same mental state and plan, but one succeeds (good outcome) and one fails (bad outcome), your view suggests we might attribute intentionality differently based on that luck. Does defending the classic reading commit you to the idea that control is less important for intentionality than we thought?"

  *   **Likely Answer:** She might argue that control is still necessary, but that the *threshold* for what counts as sufficient control is modulated by moral considerations.
  *   **Follow-up:** "But if the threshold moves, then 'control' isn't doing the heavy lifting anymore; the moral judgment is. So if I try to poison you but miss, I lacked intent. If I try to poison you and you happen to die of a heart attack mid-sip, did I suddenly gain intent? Where does the magic happen?"

  ### 6. Cross-Cultural Universality
  **Question:** "Much of the early data on this comes from WEIRD societies—Western, Educated, Industrialized, Rich, Democratic. Some cross-cultural studies suggest the Knobe effect isn't universal; in some cultures, the asymmetry vanishes or reverses. If this is a fundamental feature of the *human* concept of action, why is it culturally fragile?"

  *   **Likely Answer:** She will likely argue that the underlying capacity is universal, but cultural norms about individualism vs. collectivism modulate how the effect presents, similar to how all humans have language but speak different tongues.
  *   **Follow-up:** "If it's modulated that heavily by culture, doesn't that undermine the idea that morality is *constitutive* of the concept? It starts to look more like morality is a lens we *apply* to the concept, which is exactly what your rivals argue. How do you distinguish a constitutive feature from a very deep-seated cultural habit?"

  ### 7. AI and Non-Human Agents
  **Question:** "We are increasingly dealing with algorithmic agents. Studies show people exhibit the Knobe effect with AI—if an algorithm harms, people say it did so 'intentionally' more than if it helps. But we know the AI has no mind. Does this suggest the Knobe effect isn't about tracking mental states at all, but rather about identifying a causal source that we need to hold accountable?"

  *   **Likely Answer:** She may argue that this shows the concept of intentionality is functional—it's about finding a target for responsibility, regardless of whether the substrate is biological or silicon.
  *   **Follow-up:** "If it's purely about finding a target for responsibility, then 'intent' is just a placeholder for 'liable party.' That sounds like you're conceding the Pragmatic Objection we discussed earlier. Are we really describing the agent's psychology, or are we just tagging the deepest pocket in the room?"

  ### 8. The "Deep View" and Error Theory
  **Question:** "Let's play devil's advocate for the skeptics. If you're right, then centuries of philosophers analyzing 'intention' without referencing morality weren't just incomplete; they were fundamentally mistaken about their own concepts. Are you comfortable with an error theory where the experts on the concept are less reliable than the folk participants in a vignette study?"

  *   **Likely Answer:** She will likely argue that philosophers often idealize concepts away from their actual usage, and that experimental philosophy corrects this by looking at how the concept is actually deployed in the wild.
  *   **Follow-up:** "But if the folk usage is morally 'contaminated,' as you call it, isn't the philosopher's job to *clean* it? To carve out a precise tool for reasoning? If you say 'no, the messiness is the feature,' aren't you arguing that we should give up on conceptual precision in favor of psychological realism?"

  ### 9. Debiasing and Education
  **Question:** "Suppose we accept your view that this is how our brains work. Is this a bug we should try to fix, or a feature we should embrace? In high-stakes contexts—like medicine or law—should we be training people to suppress this intuition, or is it psychologically impossible to turn off the moral leak?"

  *   **Likely Answer:** She will likely suggest that awareness helps, but that we can't fully excise morality from agency because agency is inherently a moral category.
  *   **Follow-up:** "If we can't excise it, and the law requires us to treat intent as neutral, aren't we in a bind? It sounds like you're describing a fundamental incompatibility between human psychology and the requirements of liberal justice. Is the solution to change the law, or to admit that human judgment is inherently unjust?"

  ### 10. The "So What?" for Agency
  **Question:** "Finally, let's zoom out. If intentional action is morally laden, what does that do to the idea of human agency? Traditionally, we think I act, and *then* the action is judged. You're suggesting the judgment helps constitute the action. Does this mean we don't really have agency until the community has morally evaluated what we've done?"

  *   **Likely Answer:** She will likely argue that agency is a social status, not just an internal mental event, so yes, agency is partially conferred by the moral community.
  *   **Follow-up:** "That sounds dangerously close to saying I am not the author of my actions until *you* tell me what they were. If my intent depends on your moral verdict, have we preserved enough autonomy to make me responsible at all? Or does this view ultimately dissolve the agent into the social reaction?"
