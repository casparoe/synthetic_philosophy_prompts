  8: Protect chastity (Least bad)
  Okay. So protecting emotional peace isn't explicitly there. It's likely Type 5 (officious/agreeable) or Type 6 (property/wealth - if we view peace as a possession?). Actually, Type 5 is "lying to be agreeable." This fits best. It's to keep the peace. But Type 6/7/8 involve protecting specific goods. Emotional stability is a good. I will argue it fits best near 5 or 8, but definitely remains a sin.

