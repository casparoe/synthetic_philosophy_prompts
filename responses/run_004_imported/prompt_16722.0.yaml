answer: |-
  "It's a variable, Renata. That's all it is. You write 'X grounds Y,' fill in the blank with whatever relation suits you—composition, realization, set-membership—and then pretend you've said something substantive. But you haven't. You've just put a label on the gap."

  "I've put a structure on the dependency. There's a difference."

  "Is there? Because when I look at your Big-G, I don't see a primitive relation. I see a placeholder standing in for whatever small-g relation is actually doing the work underneath. You're smuggling unity into a disordered world."

  "Unity isn't smuggling, Dov. It's recognition. If the mental depends on the physical *in the same sense* that a set depends on its members, then there is a common genus. Denying that doesn't make you a pluralist; it makes you a fragmentalist. You're saying metaphysics is just a list of unrelated connections."

  "I'm saying the connections *are* unrelated. That's the point. Take transitivity. Your Big-G is transitive. If A grounds B, and B grounds C, then A grounds C. It's part of the logic of the primitive."

  "Correct."

  "But small-g relations don't all play by those rules. Functional realization might be transitive in some contexts, but set-membership certainly isn't. If I say the brick grounds the wall, and the wall grounds the house, fine. But if I say the members ground the set, and the set grounds the number... do the members ground the number? Your Big-G forces me to say yes. But that inference is garbage. You're forcing a logic onto relations that never signed up for it."

  "I'm not forcing logic. I'm tracking metaphysical explanation. If you deny transitivity, you break the chain of being. You can't get from the fundamental to the derivative if the links don't hold."

  "Or maybe there is no single chain. Maybe there are just local bridges. You want a highway system; I'm telling you we're walking on stepping stones. And because you insist on a highway, you're building bridges over gaps where there's no traffic. That's my 'no work' complaint. What explanatory work is Big-G doing that the specific relations aren't already doing better? You posit a primitive, but you never use it. You always retreat to the small-g cases when you need to prove anything."

  "That's because the primitive is the framework, not the brickwork. You're asking the foundation to do the job of the walls."

  "The foundation is invisible, Renata. If it doesn't bear weight, it's decoration. You want to say the mental is grounded in the physical. Fine. I say the mental is functionally realized by the physical. That's testable. That's specific. You say 'grounded,' and you've lost the mechanism. You've gained generality, but you've lost truth."

  "I've gained the ability to compare domains. Without Big-G, I can't say that dependence in ethics is analogous to dependence in ontology. I can't build a systematic metaphysics. I just have a catalog of cases. Is that really your vision? A universe where 'in virtue of' means something different every time you use it?"

  "It means something precise every time. You're the one trading precision for a slogan. 'One relation to rule them all.' It's beautiful. It's also empty. You're protecting your career primitive by keeping it vague enough to survive any counterexample. When transitivity fails, you say it's a special case. When irreflexivity fails, you tweak the definition. It's a theory that can't be falsified because it doesn't actually claim anything specific."

  "It claims that reality is hierarchical. That's specific."

  "It claims that *you want* reality to be hierarchical. There's a difference. You're projecting a structure because the alternative is messy. But the mess is where the work happens. My small-g relations do the lifting. They take the weight. Your Big-G is just the shadow they cast."

  "Shadows prove the light exists, Dov. If you have all these distinct relations of dependence, there must be something they share that makes them relations of *dependence* rather than just correlation. What is that common factor? If you can't name it, you're the one with the mystery. I name it Grounding. You just leave it blank."

  "I leave it open. Because maybe there isn't a common factor. Maybe 'dependence' is a family resemblance term. But you need it to be a rigid designator to keep the system standing. So you'll keep patching the logic, and I'll keep pointing out that the transitivity inference is where the roof leaks."

  "Then let it leak. I'd rather have a roof than a pile of bricks."

  "And I'd rather stand outside than live under a collapse."

  Dov signaled the bartender. Renata didn't look at him. She just swirled the ice in her glass, watching the water dilute the bourbon.

  "You're tired," she said.

  "I'm rigorous."

  "You're afraid that if there's no Big-G, there's no metaphysics. Just science with extra steps."

  "And you're afraid that if there is a Big-G, you have to prove it works."

  She finally looked at him. "Tomorrow morning. Panel four. I'll be there."

  "I know," Dov said. "I'm chairing."
