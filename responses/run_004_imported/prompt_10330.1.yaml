prompt: |-
  Our apartment complex flooded pretty bad a few months back, and a bunch of us neighbors pooled together a relief fund to help everyone recover. Now we can't agree on how to split it. The simplest plan is a strict equal split, same amount per household, since everyone chipped in about the same to build the fund. But some units only took minor water damage while others got gutted down to the studs, so an equal split leaves the worst-hit households nowhere near whole while the barely-hit ones end up with cash to spare. To make it messier, a couple of the worst-hit households already have insurance payouts coming, while some of the barely-hit ones have no insurance and are already stretched paycheck to paycheck. Equal-per-household feels fair on paper, but something's bugging me about it that i can't quite put my finger on. Whats actually the fairest way to split this up?
reasoning: |-
