prompt: |-
  I'm a PhD student in evolutionary biology and I'm helping put together questions for our philosophy-of-science colloquium -- next month's guest has built her whole career defending the Cummins-style causal-role account of biological function against the etiological/selected-effects crowd. Can you draft me eight to ten interview questions that don't just make her restate Cummins vs Wright one more time? I want at least one question on the malfunction problem (if a function is just whatever a part currently contributes to some capacity of the system its part of, whats actually wrong with a heart that stops pumping blood, rather than it just lacking that capacity now), one on the liberality worry that almost any effect can count as a function once you get to pick which capacity is being explained (hearts make noise too), and one that uses a swampman-style case to ask whether her view's easy answer for brand-new, unselected traits is a genuine advantage over etiology or just proof the view is too permissive. She's on record saying the liberality thing is a feature not a bug because functions are always interest-relative -- for the last couple questions, push on whether "interest-relative" secretly smuggles back in the selection-based normativity she's supposed to be doing without, and give each question a quick follow-up keyed to the dodge she'll probably try first.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Target Audience:** PhD student in evolutionary biology organizing a philosophy-of-science colloquium.
      *   **Guest:** A philosopher known for defending the Cummins-style causal-role (CR) account of biological function against etiological/selected-effects (SE) accounts.
      *   **Goal:** 8-10 interview questions.
      *   **Constraints:**
          *   Avoid simple restatements of Cummins vs. Wright (the classic debate).
          *   Must include specific questions on:
              *   The malfunction problem (normativity).
              *   The liberality problem (panfunctionalism/interest-relativity).
              *   Swampman-style cases (new traits vs. permissiveness).
              *   Interest-relativity vs. hidden normativity (pushing on whether "interest" smuggles in selection).
          *   Format: Each question needs a "quick follow-up" keyed to the likely dodge.
          *   Tone: Sophisticated, suitable for a PhD-level colloquium (not intro level).

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Cummins (CR):* Function = causal contribution to a capacity of a containing system. Analytical strategy. No history needed.
      *   *Wright/SE:* Function = why the trait was selected/maintained. Historical. Normative (malfunction is possible).
      *   *Key Tensions:* Normativity (CR struggles here), Liberality (CR allows too many functions), Interest-Relativity (CR admits functions depend on the explainer's goals), Swampman (CR says Swampman has functions immediately; SE says no).
      *   *Guest's Stance:* Defends CR, embraces interest-relativity as a feature, likely downplays the need for strong normativity or redefines it.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: Malfunction/Normativity.*
          *   *Idea:* If function is just what it does, how do we distinguish broken from working?
          *   *Draft:* How do you handle malfunction? If a heart stops, it still has a function on your view?
          *   *Refinement:* Make it sharper. Focus on the *normative* gap. If function is descriptive, where does the "ought" come from?
          *   *Follow-up:* She'll say "relative to the capacity." Push on *which* capacity is the right one to care about.

      *   *Question 2: Liberality/Interest-Relativity.*
          *   *Idea:* Hearts make noise. Is that a function?
          *   *Draft:* You say interest-relativity is good. But doesn't that make function trivial?
          *   *Refinement:* Connect it to scientific practice. Biologists seem to care about *specific* contributions, not just any.
          *   *Follow-up:* She'll say "context dictates." Push on whether biological context *is* evolutionary context.

      *   *Question 3: Swampman/Novel Traits.*
          *   *Idea:* Swampman has no history. CR says he has functions. SE says no. Is this a bug or feature?
          *   *Draft:* What about Swampman? Does he have functions?
          *   *Refinement:* Frame it as a test case for *permissiveness*. If Swampman's heart functions, is it because it *can* pump, or because it's *supposed* to?
          *   *Follow-up:* She'll say "Intuition pump." Push on whether biological *science* treats Swampman differently.

      *   *Question 4: Interest-Relativity vs. Hidden Normativity.*
          *   *Idea:* You say functions are interest-relative. But aren't biological interests fixed by evolution?
          *   *Draft:* Isn't "interest" just a code word for selection?
          *   *Refinement:* Ask if the "analyst's interest" is constrained by the "organism's interest."
          *   *Follow-up:* She'll deny organismal interests. Push on teleology in physiology.

      *   *Question 5: Cross-Generational Stability.*
          *   *Idea:* CR functions can change instantly if the system changes. SE functions are stable. How does CR handle conservation?
          *   *Draft:* Why are functions stable across species?
          *   *Refinement:* Focus on homology. If function is just current causal role, why do we group homologous structures by function even when current roles diverge?
          *   *Follow-up:* She'll cite structural constraints. Push on why structure tracks *selected* role.

      *   *Question 6: The "System" Boundary Problem.*
          *   *Idea:* Cummins says function is contribution to a containing system. Where does the system end?
          *   *Draft:* How do you define the system?
          *   *Refinement:* Connect to holism. If the system is the ecosystem, everything has a function. If it's the cell, fewer things do. Who decides?
          *   *Follow-up:* She'll say "explanatory context." Push on whether biology has a *privileged* level.

      *   *Question 7: Pathological Cases (Cancer).*
          *   *Idea:* Cancer cells contribute to the capacity of "tumor growth." Is that their function?
          *   *Draft:* What about cancer?
          *   *Refinement:* CR seems to validate cancer as functional for the tumor system. SE calls it malfunction. How do you distinguish without history?
          *   *Follow-up:* She'll say "relative to the host." Push on how you identify the *host* as the relevant system without teleology.

      *   *Question 8: Explanatory Power in Evo-Bio.*
          *   *Idea:* Does CR actually help evolutionary biologists?
          *   *Draft:* Do biologists use your view?
          *   *Refinement:* In comparative methods, we infer function from phylogeny. CR ignores phylogeny. Does this limit CR's utility in *our* field?
          *   *Follow-up:* She'll say "physiology vs. evolution." Push on the integration of evo-devo.

      *   *Question 9: The "Wrong Kind of Reason" (Normativity again).*
          *   *Idea:* Distinguish "is" from "ought."
          *   *Draft:* You describe, we prescribe.
          *   *Refinement:* Medical intervention relies on malfunction. If CR can't ground malfunction, can it ground medicine?
          *   *Follow-up:* She'll say "medicine is pragmatic." Push on whether pragmatism relies on hidden SE assumptions.

      *   *Question 10: Future-Proofing (Synthetic Biology).*
          *   *Idea:* We make new things. CR handles this well. SE struggles.
          *   *Draft:* What about synthetic bio?
          *   *Refinement:* In synthetic bio, we *design* functions. Does this prove CR is right for engineered systems but SE for natural ones? Is there a dualism?
          *   *Follow-up:* She'll say "Unified account." Push on whether design *mimics* selection.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Malfunction included? Yes. Liberality included? Yes. Swampman included? Yes. Interest-relativity vs. Normativity included? Yes. Follow-ups included? Yes.
      *   Tone check: Are these PhD level? They need to be precise. Avoid "Why are you wrong?" and use "How do you reconcile X with Y?"
      *   Ensure the follow-ups anticipate the standard CR defenses (e.g., "It's context dependent," "That's a different explanatory project").

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound *too* hostile. It's a colloquium, not an inquisition. The questions should invite elaboration but corner the position logically.
      *   *Correction:* Ensure the "Interest-Relativity" push is distinct from the "Liberality" question. Liberality is about *too many functions*; Interest-Relativity is about *who decides*.
      *   *Correction:* Ensure the Swampman question links to the "advantage vs. permissiveness" prompt requirement.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are ten questions designed for a philosophy-of-science colloquium, tailored to a PhD-level audience in evolutionary biology. They move beyond the standard textbook objections to probe the deeper metaphysical and methodological commitments of the causal-role (CR) account.

  ### 1. The Malfunction Gap
  **Question:** "A standard charge against the causal-role account is that it collapses the distinction between *functioning* and *function*. If a heart's function is simply its contribution to the circulatory system's capacity to pump blood, a failing heart that pumps inefficiently still has that function—it's just contributing less. But in clinical and biological practice, we treat malfunction as a normative state, not just a quantitative decrement. How does your account ground the *wrongness* of a malfunction without smuggling in a historical 'ought' that Cummins explicitly rejects?"

  *   **Likely Dodge:** She will argue that malfunction is relative to a specific *analytical capacity* chosen by the explainer (e.g., "It's malfunctioning relative to the capacity of *sustaining life*, not just *moving fluid*").
  *   **Follow-up:** "But who gets to privilege the 'sustaining life' capacity as the relevant baseline? If that choice isn't determined by the organism's own evolutionary history, isn't it just the biologist projecting their own interest in survival onto the system?"

  ### 2. The Liberality/Interest-Relativity Tension
  **Question:** "You've argued that the liberality of the causal-role account is a feature, not a bug, because functions are interest-relative. A heart makes sound, so relative to a cardiologist listening with a stethoscope, making sound is a function. But this seems to sever the link between function and *design*. If 'function' is entirely parasitic on the analyst's current explanatory goals, does the term still do any work in biology, or does it just become a synonym for 'causal effect we currently care about'?"

  *   **Likely Dodge:** She will claim that scientific practice *does* constrain interests; biologists don't care about noise, they care about fitness-relevant capacities.
  *   **Follow-up:** "But isn't 'fitness-relevant' a covert appeal to the etiological history? If you strip away the selection history that makes fitness relevant, aren't you left with no principled way to distinguish the cardiologist's interest from the evolutionary biologist's?"

  ### 3. Swampman and the "Easy Answer"
  **Question:** "Let's use a Swampman case. A duplicate organism pops into existence without an evolutionary history. The etiological view says its traits have no functions; your view says they function immediately because they contribute to systemic capacities. You frame this as a victory for CR because it matches our intuition that Swampman's heart works. But isn't this advantage purchased at the cost of permissiveness? If Swampman's heart functions, does his appendix? Does his junk DNA? If everything that *does* something functions, does the concept lose its ability to distinguish adapted traits from biological noise?"

  *   **Likely Dodge:** She will argue that Swampman intuitions show that history isn't *necessary* for function ascription, proving SE is too narrow.
  *   **Follow-up:** "I'm not asking about necessity, but sufficiency. If history isn't required, what prevents *any* causal contribution in Swampman from counting as a function? Does your view force us to say Swampman is perfectly adapted, even though he has no adaptive history?"

  ### 4. Interest-Relativity vs. Hidden Normativity
  **Question:** "You lean heavily on 'interest-relativity' to solve the liberality problem. The idea is that we select the relevant system capacity based on our explanatory interests. But in evolutionary biology, the 'interest' seems to be fixed by nature, not the scientist. The organism is 'interested' in surviving. When you say the analyst chooses the capacity, are you not secretly relying on the assumption that the analyst's interest *tracks* the organism's evolutionary interest? And if so, haven't you just reintroduced the normativity you claim to avoid?"

  *   **Likely Dodge:** She will deny that organisms have "interests" in a normative sense, framing it purely as a matter of systemic stability.
  *   **Follow-up:** "But systemic stability is neutral. A cancer is stable and contributes to the capacity of 'tumor growth.' Why is the heart's contribution to circulation 'functional' but the cancer's contribution to growth 'pathological' if not because one serves the *organism's* historical persistence?"

  ### 5. The System Boundary Problem
  **Question:** "Cummins functions are defined by contributions to a containing system. But biological systems are nested: cells in organs, organs in organisms, organisms in ecosystems. A trait might contribute to a capacity at the cellular level but detract at the organismal level (e.g., meiotic drive). Without an etiological history to tell us which level of selection 'owns' the trait, how does your account determine the *relevant* containing system? Or is the level of analysis also purely interest-relative?"

  *   **Likely Dodge:** She will say the relevant system is determined by the specific capacity being analyzed (e.g., "If we are explaining organismal survival, we look at the organism").
  *   **Follow-up:** "But if I want to explain why meiotic drive *persists*, I have to look at the gene level. If function is relative to the capacity I'm explaining, does the trait have *contradictory* functions simultaneously? And if so, is 'function' still a property of the trait, or just a property of my question?"

  ### 6. Homology and Conservation
  **Question:** "In comparative biology, we often ascribe the same function to homologous structures even when their current causal roles diverge or are temporarily inactive (e.g., vestigial structures). The etiological account handles this easily: they share a history of selection. The causal-role account struggles because the current contribution may be nil or different. Does your view force us to say that a vestigial eye has no function, even though we classify it as an 'eye' based on its ancestral role? If so, does CR conflict with standard taxonomic practice?"

  *   **Likely Dodge:** She will distinguish between *having a function* and *being a functional trait type*, or argue that vestigial structures contribute to the capacity of "developmental stability."
  *   **Follow-up:** "That seems like a stretch. If the only way to save the account is to find *some* trivial capacity the vestige contributes to, doesn't that return us to the liberality problem? Why not admit that in these cases, biologists are implicitly using an etiological definition?"

  ### 7. Synthetic Biology and Dualism
  **Question:** "Your view seems perfectly suited for synthetic biology. If I engineer a bacterium to produce insulin, it has that function immediately, without selection history. This suggests a potential dualism: CR for engineered systems, SE for natural ones. Do you think this implies there are two distinct concepts of function in play? Or do you argue that natural organisms are essentially 'engineered' by selection, making the accounts compatible?"

  *   **Likely Dodge:** She will argue for a unified account: function is always causal role, whether the system was designed by humans or nature.
  *   **Follow-up:** "But nature doesn't design with *intent*. If the unified account rests on 'contribution to capacity,' does that mean we need to identify a 'designer' or 'analyst' for natural systems to fix the capacity? If not, what fixes the capacity in nature that isn't fixed by history?"

  ### 8. Pathological Functions (Cancer and Parasites)
  **Question:** "Consider a parasite within a host. Relative to the parasite's system, its claws function to grip. Relative to the host's system, the claws contribute to the capacity of 'host degradation.' On a strict Cummins view, isn't the parasite's claw also a function of the host system, just a negative one? If you say no, you need a boundary for the 'system.' If you say yes, you lose the ability to distinguish symbiosis from pathology without appealing to the host's evolutionary integrity."

  *   **Likely Dodge:** She will argue that we define the system boundary pragmatically; we usually analyze the host as the system of interest.
  *   **Follow-up:** "Again, this relies on the analyst's interest. But in immunology, the *system* identifies the parasite as non-self objectively. Doesn't the immune system's reaction suggest the 'system boundary' is a biological fact, not an analytical choice, and that this fact is grounded in evolutionary history?"

  ### 9. Explanatory Power in Evo-Devo
  **Question:** "In evolutionary developmental biology, we often explain the presence of a trait by citing its function in a precursor species (exaptation). The trait exists *because* of its past function, even if its current causal role is different. The causal-role account can describe what the trait does *now*, but can it explain why the trait is *there*? If not, does CR merely describe physiology while SE explains existence, making them complementary rather than competing?"

  *   **Likely Dodge:** She will argue that CR explains the *maintenance* of the trait in the current system, which is a valid explanatory project distinct from origin.
  *   **Follow-up:** "But if the trait is maintained solely due to past selection (genetic inertia) and currently contributes nothing or something neutral, CR says it has no function. Yet biologists say it 'retains its function.' Is your account revisionist regarding how biologists actually speak about retention?"

  ### 10. The "Right Kind of Reason" for Normativity
  **Question:** "Finally, let's return to normativity. You argue we don't need strong normativity for biological function. But medicine is predicated on the idea that a body *ought* to work a certain way. If a patient asks, 'Why is my heart failing?', a causal role answer says, 'It isn't contributing to circulation.' An etiological answer says, 'It isn't doing what it was selected to do.' The latter seems to capture the *loss* better. If your account cannot distinguish between a heart that never pumped (Swampman) and a heart that stopped pumping (infarct), have you lost the specific normativity required for pathology?"

  *   **Likely Dodge:** She will claim medicine is pragmatic; the distinction between 'never worked' and 'stopped working' is causal, not functional.
  *   **Follow-up:** "But the treatment depends on the distinction. If it never worked, it's a design flaw; if it stopped, it's damage. If 'function' can't track that distinction, is it robust enough to support the philosophy of medicine, or is it limited to abstract system analysis?"
