answer: |-
  This is one of the most common and understandable points of confusion in mechanism design. You are not missing anything about the logic, and your friend is half-right but for the wrong reason.

  There is no sleight of hand, and economists aren't using a "weaker" definition of strategy-proofness. **Strategy-proofness means the exact same thing in all three contexts:** *Truth-telling is a dominant strategy.*

  The resolution lies in the **assumptions** required for the Gibbard-Satterthwaite (GS) theorem to hold. GS is an "impossibility theorem," which means it says: *"If conditions A, B, and C are met, then strategy-proofness is impossible."*

  Second-price auctions and Deferred Acceptance (DA) work precisely because they **violate** at least one of those critical conditions. They are "loopholes" in the theorem, not contradictions of it.

  Here are the three specific assumptions of Gibbard-Satterthwaite that these mechanisms bypass.

  ### 1. The "No Transfers" Assumption (Why Auctions Work)
  The GS theorem applies to **voting rules** where the only input is a ranking of candidates and the only output is a winner. Crucially, **no money changes hands.**

  *   **GS Assumption:** The mechanism cannot use transfers (payments/subsidies) to align incentives.
  *   **Second-Price Auction:** This mechanism relies entirely on **money**. The payment rule ($p = \text{second highest bid}$) is what makes truth-telling optimal.
  *   **The Fix:** Once you allow quasi-linear utility (utility = value of item $-$ price paid), you escape the GS theorem. This is why the **Vickrey-Clarke-Groves (VCG)** mechanism exists. If you can tax and subsidize agents, you can achieve efficiency and strategy-proofness without a dictator. GS says you can't do this with *votes*; it doesn't say you can't do it with *wallets*.

  ### 2. The "Unrestricted Domain" Assumption (Why Matching Works)
  GS assumes that voters can have **any possible preference ordering** over the outcomes. In a political election, I might prefer Candidate A because I like their tax policy, or because I hate Candidate B, or because I think Candidate C will split the vote. My preferences can depend on anything.

  *   **GS Assumption:** Preferences are unrestricted. I might care deeply about who *you* get matched with, not just who *I* get matched with (externalities).
  *   **Deferred Acceptance (DA):** In school choice or residency matching, preferences are **restricted**.
      1.  **Private Outcomes:** I only care about which school *I* get into. I generally don't care which school *you* get into (no externalities).
      2.  **Structure:** My preference is simply a ranking of schools, not a ranking of the *entire global matching*.
  *   **The Fix:** Because the domain of preferences is restricted (individualistic preferences over private assignments), GS does not apply. If students cared about which schools their friends got into (externalities), DA would likely lose its strategy-proof property, and we would be back in GS territory.

  ### 3. The "Public Outcome" Assumption
  GS is about **Social Choice Functions** where the outcome is a **public good**. If Candidate A wins, Candidate A is President for *everyone*. We all consume the same outcome.

  *   **GS Assumption:** The mechanism selects one alternative from a set, and that alternative applies to the whole group.
  *   **Auctions & Matching:** These are **private allocation** problems.
      *   In an auction, I get the item, you don't.
      *   In matching, I go to School X, you go to School Y.
  *   **The Fix:** When outcomes are private, the conflict of interest is structured differently than in voting. In voting, we are fighting over one prize for the group. In matching, we are sorting many prizes among the group. This structural difference changes the mathematical landscape enough to allow for strategy-proofness.

  ### Summary: Is your friend right?
  Your friend said economists use a "weaker definition" of strategy-proof. **That is incorrect.** Truth-telling being a dominant strategy is a very high bar, and it means the same thing in all these cases.

  However, your friend is right that there is a distinction in **context**.
  *   **Gibbard-Satterthwaite** says: You cannot have a strategy-proof **voting system** for **public outcomes** with **unrestricted preferences** and **no money**.
  *   **Mechanism Design** says: If you allow **money** (Auctions) OR if you restrict **preferences/outcomes** to private matching (DA), you **can** have strategy-proofness.

  ### The "So What?" for your class
  Your professor isn't contradicting herself; she is showing you the map of the terrain.
  1.  **GS Theorem:** Here is the "Dead Zone." If you try to build a voting system without money, you will crash here.
  2.  **Auctions/DA:** Here are the "Safe Zones." We can build strategy-proof systems if we move into these specific areas (allowing money or restricting the problem to matching).

  You aren't missing anything; you actually spotted the most important nuance in the course. The "impossibility" results define the boundaries, and the rest of the course is about finding the loopholes.
