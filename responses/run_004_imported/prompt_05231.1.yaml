answer: |-
  # The Chord, The Straw, and The Void: A Verdict on Bertrand's Paradox

  Bertrand's chord paradox is the probability theorist's *Moby Dick*: a white whale of ambiguity that drags more than one career into the depths. You are standing on the deck with your friend, arguing over the carcass. On one side, E.T. Jaynes, the high priest of objective Bayesianism, wielding the Principle of Transformation Groups like a harpoon. On the other, your friend, channeling the ghost of Kolmogorov, insisting that the beast was never alive to begin with—that "random" is a word without a referent unless a measure is handed down from heaven (or a physical experiment).

  You want a verdict. You want to know if Jaynes truly rescued the Principle of Indifference (PoI) from the wreckage of continuous spaces, or if your friend is right that "equally likely" is a linguistic ghost.

  To settle this, we must strip the problem to its studs. We have to look at what Jaynes actually did, what the critique actually says, and then decide whether the bridge Jaynes built leads to solid ground or just a more elegant cliff.

  ### The Case for Jaynes: Ignorance as Symmetry

  Jaynes's argument in *Probability Theory: The Logic of Science* is a masterpiece of epistemological engineering. His starting point is that probability is not about frequencies in the world, but about states of knowledge in the head. If two problems are identical in the information they provide, they must yield identical probabilities. This is the core of consistency.

  In the Bertrand problem, the statement is "a chord is drawn at random in a circle." Jaynes asks: What information is *not* given? We are not told the size of the circle, its position on the page, or its orientation. Therefore, our probability assignment must not depend on these factors. If our solution changed because we moved the circle two inches to the left, we would be claiming knowledge (about the circle's location) that we explicitly do not possess.

  This demand for invariance—rotation, translation, and scaling—acts as a filter.
  *   **Method (a)** (random endpoints) fails translation invariance. If you shift the circle, the density of chords changes relative to the new center.
  *   **Method (c)** (random midpoint) fails scaling invariance. If you enlarge the circle, the distribution of midpoints behaves differently relative to the chord length.
  *   **Method (b)** (random radius, random point) is the unique survivor. It corresponds to a distribution of lines that is invariant under the Euclidean group of transformations.

  Jaynes then validates this with a physical experiment: tossing long straws onto a circle drawn on the floor. The empirical frequency converges to 1/2. For Jaynes, this confirms that 1/2 is the "objective" answer because it is the only one consistent with the total lack of information regarding the circle's context. He claims to have rescued the PoI by showing that "indifference" doesn't mean "uniform over parameters," but "invariant over transformations."

  ### The Case for the Critique: The Measure-Theoretic Knife

  Your friend's position rests on a harder, colder mathematical reality. In measure-theoretic probability (the Kolmogorov foundation), there is no such thing as a "random chord" without a specified measure. The sample space of chords is a continuum. To assign probabilities, you must define a measure. The phrase "at random" is not a mathematical operator; it is a placeholder for a physical generating process.

  The critique argues that Jaynes has not solved the paradox; he has dissolved it by changing the problem. The original problem asked for the probability given the statement "pick a chord at random." Jaynes answered the probability given the statement "pick a chord at random *subject to the constraint that the distribution is invariant under translation and scaling*."

  Those are different questions.

  The "smuggling" your friend detects is real. By demanding translation invariance, Jaynes assumes the circle is not fixed in a specific frame of reference. But if I draw a circle on a piece of paper and ask you to pick a chord, the circle *is* fixed. Why should the probability depend on a hypothetical translation that I am not performing? By imposing invariance, Jaynes is implicitly assuming a specific physical randomizing device (like the straw toss) where the *lines* are generated independently of the *circle*.

  Furthermore, the Borel-Kolmogorov paradox looms here. It demonstrates that conditioning on events of measure zero (like "being on a specific circle") yields different results depending on the parametrization used to approach the limit. "Uniformity" is not invariant under coordinate transformation. If you are indifferent over the angle $\theta$, you are not indifferent over $\tan(\theta)$. Jaynes's invariance principle selects a specific parametrization (the invariant measure of the affine group), but it does not prove that this parametrization is the *logical* default. It is merely the *physical* default for problems involving tossed lines.

  ### The Clash: Logic vs. Modeling

  Here is the crux of the disagreement.

  Jaynes believes probability is **logic**. If the premises are "I know nothing about the position or size," then the conclusion "the measure must be invariant" follows logically. For Jaynes, the invariance is part of the semantic content of the problem statement. To ignore it is to be inconsistent.

  Your friend believes probability is **modeling**. The premises are underspecified. "I know nothing" is not a logical constraint that generates a unique measure; it is a confession of ignorance that requires a modeling choice to proceed. Invariance is a useful heuristic for physics (where laws don't change based on where you stand), but it is not a law of logic.

  ### The Verdict

  I am going to disappoint the Jaynesians in the room, though I suspect your friend will pour a drink in my honor.

  **Your friend is right.**

  Jaynes did not rescue the Principle of Indifference as a general logical principle. He demonstrated how to construct a *physical model* based on symmetry assumptions. The claim that 1/2 is the "objectively correct" answer is false. It is only correct relative to the assumption that the chord-generating process shares the symmetries of the Euclidean plane.

  Here is why Jaynes's rescue fails as a logical salvation:

  1.  **Invariance is an Assumption, Not a Tautology:** The problem statement "pick a chord of a circle" does not logically compel translation invariance. If I write a computer program to pick a chord, I must choose an algorithm. If I choose `rand()` on the endpoints, I get 1/3. If I choose `rand()` on the radius, I get 1/2. Both are valid algorithms. Neither is "more logical." Jaynes prefers the second because it matches a specific class of physical experiments (straws), but that makes it an empirical preference, not a logical necessity.
  2.  **The "Well-Posed" Dodge:** Jaynes argues the problem is "ill-posed" until invariance is added. This is true, but it concedes the critic's point. If the problem is ill-posed, then the PoI cannot solve it on its own. It requires external input (symmetry constraints). Therefore, the PoI is not a self-sufficient engine for generating probabilities from ignorance; it is a constraint satisfaction tool that requires you to feed it symmetries. If you don't know the symmetries, you are back to square one.
  3.  **The Scope of "Ignorance":** Jaynes equates "ignorance" with "invariance." But ignorance can be represented in many ways. If I am truly ignorant, perhaps I should assign a probability distribution *over the possible measures* rather than selecting one invariant measure. By selecting the invariant measure, Jaynes is claiming he knows that the universe prefers symmetry. That is a physical belief (a very successful one, thanks to Noether), but it is not a logical truth.

  ### The Qualified Truth

  However, I will not give Jaynes nothing. While your friend wins the philosophical argument, Jaynes wins the practical one.

  In science, we are rarely in a state of pure mathematical abstraction. We are usually dealing with physical systems where symmetries *do* exist. In statistical mechanics, thermodynamics, and quantum theory, Jaynes's Maximum Entropy and invariance principles are not just useful; they are indispensable. They tell us which "ignorance" is relevant to the physical world.

  So, here is the final settlement:

  **The Principle of Indifference is fundamentally broken as a logical law.** It cannot generate a unique probability measure from a linguistic statement alone in continuous spaces. Your friend is correct that "equally likely" is meaningless without a privileged parametrization or a generating process.

  **However,** Jaynes correctly identified that **invariance is the correct criterion for selecting that parametrization when physical symmetries are present.** He didn't save the PoI from being underspecified; he saved it from being useless by tying it to group theory.

  If you are doing pure mathematics, your friend wins: the problem is ill-posed, and there is no answer. If you are doing physics, Jaynes wins: the problem implies a physical context, and 1/2 is the answer that respects the symmetries of that context.

  But since your question was about the *general* rescue of the Principle of Indifference and whether "equally likely" has objective meaning without external structure: **No, it does not.** Jaynes showed us how to build the structure, but he cannot pretend the structure was already there in the logic alone. The paradox stands as a permanent warning: language is not math, and ignorance is not a measure.

  Pour the beer for your friend. But keep Jaynes on the shelf; you'll need him when you start tossing straws.
