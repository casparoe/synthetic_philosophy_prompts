answer: |-
  You have identified a very common and understandable misconception. While your intuition regarding the history of the theorem is partially correct, your conclusion about its scope is flawed.

  Physicists describe Bell's theorem as ruling out **Local Realism** generally, rather than just **Local Determinism**, because the theorem was explicitly generalized to cover stochastic (probabilistic) theories shortly after its initial publication.

  Here is the breakdown of why your reasoning regarding "stochastic local hidden-variable theories" does not hold up.

  ### 1. The Historical Grain of Truth
  You are historically correct regarding the 1964 paper. In his original derivation, John Bell did assume that hidden variables ($\lambda$) determined measurement outcomes with certainty (determinism). This was largely because he was addressing the specific arguments of the EPR paper, which relied on perfect correlations to deduce "elements of reality."

  If one looks *only* at the 1964 paper in isolation, your friend would have been right to argue that it only rules out deterministic models.

  ### 2. The Generalization to Stochastic Theories
  However, Bell and others quickly realized that the theorem could be generalized. In 1971, Bell published a paper titled "Introduction to the hidden-variable question," and in 1974, Clauser and Horne derived the "CH inequality." These works removed the assumption of determinism.

  They showed that even if hidden variables only fix the **probabilities** of outcomes (stochasticity), the inequality still holds, provided the theory remains **local**.

  ### 3. The "Factorizability" Condition
  The core of the issue lies in how "Locality" is mathematically defined in these generalized proofs. It is defined by the **Factorizability Condition**:

  $$P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$$

  Here is what this equation means for your argument:
  *   **$P(A | a, \lambda)$** represents the probability of outcome $A$ given setting $a$ and hidden variable $\lambda$.
  *   Crucially, this probability **does not have to be 0 or 1**. It can be any value between 0 and 1. This allows for the "genuine stochasticity" you described.
  *   **Locality** is enforced because the probability of Alice's outcome ($A$) depends *only* on her setting ($a$) and the hidden variable ($\lambda$), not on Bob's setting ($b$) or outcome ($B$).

  If a theory assumes that physical properties ($\lambda$) exist (Realism) and that Alice's local probabilities are independent of Bob's distant settings (Locality), it **must** satisfy this factorization. If it satisfies this factorization, it must obey Bell's inequalities.

  ### 4. Why Stochasticity Doesn't Help
  Your argument suggests that adding randomness (stochasticity) allows a local theory to escape the inequality. However, mathematically, a stochastic local theory is essentially a "weighted average" of deterministic local theories.

  *   Imagine a stochastic theory as a "dice roll" that decides which deterministic state the system is in.
  *   If **every** possible deterministic state obeys the Bell inequality (which they do), then the **average** of those states (the stochastic theory) must also obey the inequality.
  *   You cannot average a set of numbers that are all $\leq 2$ and get a result greater than 2.

  Since Quantum Mechanics predicts (and experiments confirm) correlations that violate these inequalities (reaching values like $2\sqrt{2}$), **no local theory—whether deterministic or stochastic—can reproduce the predictions of Quantum Mechanics.**

  ### Conclusion
  You were right to distinguish between determinism and stochasticity, but you were wrong to assume that Bell's theorem relies on the former. The theorem relies on **Local Realism**.

  *   **Realism:** Measurement outcomes depend on pre-existing physical properties ($\lambda$).
  *   **Locality:** These properties act locally (Factorizability).

  Because the theorem holds for probabilities $0 < P < 1$, it rules out **all** local hidden variable theories, leaving indeterminism as no escape route.
