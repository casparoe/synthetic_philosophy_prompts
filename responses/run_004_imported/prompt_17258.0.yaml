answer: |-
  # The Currency of Blood and the Loop of Identity: Evaluating Searle and Hacking on Race

  The slogan "race is a social construction, just like money is" has become a staple of introductory sociology and anti-racist discourse. It is pithy, intuitive, and effectively dispels biological essentialism by pointing to an arbitrary system of value. However, as you have noticed, this slogan relies heavily on John Searle's philosophy of institutional facts, while ignoring the dynamic mechanisms described by Ian Hacking. When we press on the mechanics, the comparison begins to fray. Searle offers a static architecture of power, while Hacking offers a dynamic history of interaction. To determine which model fits race, we must test them against the historical record of how racial categories are imposed, lived, and transformed.

  This essay argues that while Searle's model accurately describes the *coercive structure* of racial hierarchy, it fails to capture the *historical volatility* of racial identity. Hacking's model of "interactive kinds" provides a superior account of how race functions over time, but only if it is amended to account for the asymmetry of power. The verdict is that race is not merely a status function like money; it is a **coercive interactive kind**. The "money" analogy is structurally insightful but dynamically false.

  ### Searle's Institutional Facts: Race as Status Function

  John Searle's theory of social ontology rests on the formula "X counts as Y in context C." In this framework, a physical object (X), such as a piece of paper, is assigned a status function (Y), such as "money," within a specific institutional context (C). This status does not exist in the physics of the paper; it exists only through "collective intentionality"—the ongoing acceptance and recognition by a community, often backed by constitutive rules like legal tender laws.

  Applied to race, the Searleian model is compelling. It explains the arbitrariness and institutional weight of racial categorization. Historically, the "X" (a human body with certain phenotypic features) is assigned the "Y" (a legal and social status, such as "slave," "citizen," or "white") within a context "C" (e.g., Jim Crow South, Apartheid South Africa). This fits the "money" analogy well: just as a piece of paper has value only because the bank and the market agree it does, a "white" body had privilege in 1950s America only because the law and social custom agreed to honor that status.

  Legal scholar Cheryl Harris's concept of "Whiteness as Property" is a quintessentially Searleian argument. She demonstrates that whiteness functioned as a form of property rights, protected by the state, where the "status function" of being white conferred tangible economic and legal benefits. In this light, race operates exactly like currency: it is a medium of exchange for social goods, reliant on institutional backing. If the collective acceptance withdraws (e.g., through revolution or legal overhaul), the status collapses.

  However, the Searleian model has a critical weakness when applied to race: it implies a degree of stability and consensus that history contradicts. In Searle's model of money, the system works best when everyone agrees on the value of the dollar. If people stop accepting the currency, the system fails. But racial systems often persist *despite* the lack of acceptance by the classified. A enslaved person did not "collectively accept" their status as property in the same way a merchant accepts a dollar bill; the status was imposed through violence. Furthermore, Searle's model struggles to explain why racial categories *change*. If race were simply a status function imposed on a static biological "X," the categories should remain as stable as the definition of a "dollar." Yet, the "X" itself seems to shift. The Irish, Italians, and Jews were once considered non-white in the U.S. and later became white. Searle can explain the *imposition* of this status, but he cannot easily explain the *migration* of the status without implying the biological "X" changed, which it did not.

  ### Hacking's Interactive Kinds: Race as Looping Effect

  Ian Hacking distinguishes between "indifferent kinds" (like rocks or quarks) and "interactive kinds" (like people classified as "refugees" or "homosexuals"). Indifferent kinds do not care how we classify them; a quark does not change its behavior because physicists named it. Interactive kinds, however, involve people who become aware of how they are classified and may change their behavior or self-conception in response. This creates a "looping effect": the classification changes the people, and the changed people eventually change the classification.

  Hacking's model captures the *lived history* of race far better than Searle's. Racial categories are not static stamps on passive bodies; they are scripts that people read, resist, rewrite, and perform. When the U.S. Census categorized mixed-race individuals as "mulatto" in the 19th century, it altered how those individuals navigated society. When the category was dropped in favor of a binary "black/white" system (the one-drop rule), it forced a reorganization of community and identity.

  Consider the shift from "Negro" to "Black" to "African American." In a Searleian world, this would be a mere change of label for the same status function. In a Hackingian world, this is a transformation of the kind itself. The "Black Power" movement of the 1960s was a massive looping event: people took a classification that was designed to subordinate ("Negro") and infused it with new pride and political meaning ("Black"). This changed how people acted, dressed, and organized, which in turn altered what the category "Black" meant in the broader society. The classification did not just describe a group; it helped create a new kind of political subject.

  Hacking's model also accounts for the instability that Searle's misses. Because the classified people are active participants in the loop, the category is never settled. "Passing" (a light-skinned Black person living as white) is a phenomenon that makes sense in Hacking's framework but breaks Searle's. In Searle's view, if you have the status, you have the status. But in the reality of race, "passing" reveals that the status is porous and dependent on performance and perception, not just institutional decree. The "loop" involves the constant negotiation of boundaries.

  ### The Historical Stress Test

  To reach a verdict, we must test these models against specific historical mechanisms of race.

  **Test 1: The One-Drop Rule.**
  *   *Searle:* The rule is a constitutive rule: "Any person with one Black ancestor (X) counts as Black (Y) in the South (C)." This fits perfectly. It is an arbitrary institutional fiat.
  *   *Hacking:* The rule created a specific social reality where people with varying phenotypes united under a single political identity. This forced interaction created a shared culture (e.g., the Harlem Renaissance) that wouldn't have existed if people were sorted by percentage of ancestry. The classification created the group dynamics.
  *   *Result:* Searle explains the *law*; Hacking explains the *community*.

  **Test 2: The Invention of "Whiteness."**
  *   *Searle:* Whiteness is a status function granting privilege.
  *   *Hacking:* Whiteness is a category that expanded. As new immigrant groups (Irish, Poles) learned to perform "whiteness" to avoid discrimination, they changed the boundaries of the category. The "kind" evolved because the people interacted with the classification.
  *   *Result:* Hacking explains the *expansion*; Searle explains the *privilege*.

  **Test 3: Resistance and Reclamation.**
  *   *Searle:* Resistance is a failure of collective acceptance. If enough people reject the status, the institution collapses.
  *   *Hacking:* Resistance is part of the loop. The category changes *because* of the resistance. The meaning of "Queer" or "Black" today is different because of the struggle over the label.
  *   *Result:* Hacking explains the *evolution*; Searle only explains the *collapse*.

  ### The Verdict: A Coercive Interactive Kind

  The popular comparison that "race is like money" survives only as a metaphor for *arbitrariness* and *institutional dependence*. It fails as a description of *mechanism*. Money functions through cooperative acceptance; if I refuse to accept dollars, I simply opt out of the economy. Race functions through coercive imposition; if I refuse to accept my racial classification, the state or society may still enforce it upon me (through profiling, segregation, or violence).

  Therefore, **Ian Hacking's model of interactive kinds is the superior framework for understanding race, provided it is modified to account for power asymmetry.**

  Searle is correct that race has an institutional skeleton. There are constitutive rules (laws, census categories) that impose status functions. However, treating race *only* as a status function reduces racialized people to passive bearers of value, like coins in a pocket. This obscures the central reality of race: it is a relationship of power that generates feedback. Racial categories persist not just because institutions enforce them (Searle), but because people organize their lives, identities, and resistances around them (Hacking).

  If we rely solely on Searle, we cannot explain why race changes meaning without a change in law. We cannot explain how "Blackness" transformed from a mark of shame to a source of pride without a change in the "constitutive rule." Hacking's looping effect explains this: the people changed the meaning of the kind from the inside, which eventually pressured the institutions to change the rules.

  However, Hacking's original examples (like "homosexual" or "autistic") often imply a dialogue between classifiers and classified that is too egalitarian for race. Racial looping is often a struggle. The "loop" is not a gentle feedback cycle; it is a site of conflict. The state classifies a group to subordinate them; the group adapts to survive or resist; the state adjusts the classification to maintain control; the group adapts again.

  Consequently, the definitive verdict is this: **Race is a coercive interactive kind.** It possesses the institutional hardness of Searle's status functions (it is backed by law and violence), but it operates through the dynamic volatility of Hacking's looping effects. The "money" analogy should be discarded in serious analysis because it suggests race is a stable medium of exchange. In reality, race is a contested technology of governance that reshapes the very people it attempts to sort.

  To understand race, we must start with Searle to acknowledge the brute force of the hierarchy, but we must end with Hacking to understand the history of the human beings trapped within it. The construction of race is not the printing of currency; it is the endless, volatile argument over who we are.
