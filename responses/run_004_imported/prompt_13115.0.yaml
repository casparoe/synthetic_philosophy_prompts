answer: |-
  This is a fascinating dilemma because it sits right at the intersection of epistemology (how we know what we know), philosophy of science, and narratology. Your writing group has accidentally stumbled into a debate that philosophers of science have been having for decades: **The Problem of Old Evidence.**

  Here is the breakdown of why your friend feels it's a "cheat," why you feel it's valid, and where the actual line is drawn between legitimate explanation and reverse-engineering.

  ### 1. The Philosophical Core: Prediction vs. Accommodation

  Your friend is arguing for the **Prediction Principle**. In the philosophy of science, there is a strong intuition that a theory is only truly supported if it predicts a *novel* fact—something we didn't know before the theory was proposed.
  *   **Prediction:** Einstein's General Relativity predicted that light would bend around the sun during an eclipse. When astronomers measured it during the 1919 eclipse and found it was true, it was massive evidence for the theory.
  *   **Accommodation:** If Einstein had looked at the 1919 data *first*, then tweaked his math until it matched the bending of light, scientists would be much more skeptical. They would worry he had "curve-fitted" his theory to the data.

  Your friend's argument is: *Because you (the author) knew the "data" (the light was off) before you finalized the "theory" (the murder method), you inevitably shaped the theory to fit the data. Therefore, the fit isn't impressive.*

  **However, modern epistemology generally disagrees with the strict version of your friend's view.** Explaining old evidence *does* count, provided the theory is **risky**.
  *   If your theory is flexible enough to explain *anything* (e.g., "The murderer did it using magic"), explaining the light isn't evidence.
  *   If your theory is specific and restrictive (e.g., "The murderer used a timed ice mechanism that requires darkness to melt unseen"), and that theory *necessitates* the light being off, then the fact that the light *was* off is strong evidence, even if we knew it beforehand.

  **The Verdict:** The "click" you feel is not an illusion. A theory that unifies disparate, known facts into a coherent whole has **explanatory power**. In law and history (unlike experimental physics), we almost always reason from known effects back to unknown causes. We know the victim is dead (old fact); we construct a theory of who killed them. The theory is judged on how well it explains the known facts, not on whether it predicted the death.

  ### 2. The Literary Reality: Author vs. Detective

  Your friend is critiquing your **process**, but you are defending the **text**. This is the crux of the disagreement.

  *   **The Author's God-Mode:** Yes, you knew the light was off in Chapter 2 because you wrote Chapter 2 after you knew the ending (or at least, you control the universe). If we judge the book based on your authorial omniscience, *every* clue in every mystery novel is a cheat. The author always knows the killer before they write the first clue.
  *   **The Detective's Ground-Mode:** Inside the narrative, the detective does *not* know the solution in Chapter 2. She encounters a brute fact: *The light is off, despite the victim's phobia.* This is an anomaly. It bothers her. When she finally finds a theory that resolves the anomaly, her confidence increases.

  **The Reader's Experience:** The reader is aligned with the Detective, not the Author. The reader sees the clue in Chapter 2. The reader forgets it or wonders about it. When the solution arrives and explains the clue, the reader experiences the same "click" the detective does.

  If your friend's logic held true, the mystery genre would cease to exist. A mystery is, by definition, the accommodation of old evidence (the crime scene) to a new theory (the detective's deduction).

  ### 3. The Real Line: "Integral" vs. "Ad Hoc"

  While your friend is wrong about the principle, they might be right about the **execution**. This is where you need to listen to them.

  The risk in your scenario isn't that you knew the fact first; the risk is that your solution might be **Ad Hoc**.
  *   **Ad Hoc (The Cheat):** The detective explains the murder using a method that works fine whether the light is on or off. Then, as an afterthought, she says, "And oh, by the way, that's why the light was off." This feels tacked on. It feels like you took a generic solution and stapled the clue to it.
  *   **Integral (The Valid Clue):** The murder method *could not have worked* if the light was on. The darkness is a necessary condition for the crime.

  **The Test:**
  Ask yourself: If the light had been *on*, would the murder still have happened exactly the same way?
  *   **If Yes:** Your friend is right. The explanation is weak. The light being off is coincidental, and using it as "proof" feels like a cheat.
  *   **If No:** You are right. The light being off is a necessary constraint. The theory is supported by the fact because the fact is a requirement of the theory.

  ### 4. How to Fix the Perception (If Needed)

  If you want to silence the writing group (and ensure readers don't feel cheated), you need to make sure the connection between the **Solution** and the **Light** is causal, not just correlational.

  1.  **Make the Light Active, Not Passive:** Don't just have the light be off. Have the murder method *require* the darkness. For example, if the killer used a light-sensitive trigger, or if the visibility of the hallway would have revealed their identity immediately, or if the shadow play was part of the alibi.
  2.  **Highlight the Risk:** In the resolution, have the detective explicitly state: *"If my theory were wrong, there is no reason for that light to be off. The victim never turned it off. The killer had no reason to turn it off... unless they needed the dark to [X]."*
  3.  **The "Only Explanation" Rule:** Ensure that the solution is the *only* one that explains the light. If there are three other ways the murder could have happened that don't care about the light, then the light doesn't seal the case. If your theory is the *only* one that makes sense of the phobia + the darkness, it is strong evidence.

  ### Summary

  **Philosophically:** You are right. Explaining known facts (accommodation) is a valid form of evidence, provided the theory is specific enough that it *could have failed* to explain them. The "click" is real cognitive resolution.

  **Literarily:** Your friend is confusing the author's omniscience with the detective's deduction. However, their instinct warns you against a specific pitfall: **tacking on.**

  **Advice:** Don't change the plot. The structure is sound. Instead, sharpen the *dependency*. Make sure the murder method is impossible without the light being off. If the light is a **necessary condition** for the crime, then it is legitimate evidence, regardless of when you wrote it down.

  Tell your writing group: *"In a court of law, a lawyer doesn't get points for predicting the body is dead; they get points for explaining why the body is dead in a way that fits all the evidence. My detective is doing the latter."*
