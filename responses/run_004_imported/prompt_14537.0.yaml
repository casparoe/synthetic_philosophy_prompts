          2.  **Private Information:** I know something you don't, and vice versa. The bet is a mechanism to discover who has better info.
          3.  **Utility of Gambling:** The thrill has value. Expected Value (EV) includes fun.
          4.  **Bounded Rationality/Overconfidence:** We aren't perfect Bayesians. We think *we* are the smart one and the other guy is mistaken.
      *   *Stock Market:* Why trade? Different goals (retirement vs. day trading), hedging, liquidity needs. Also, "noise traders."
