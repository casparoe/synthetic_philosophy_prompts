answer: |-
  This is a fantastic instinct to check before you commit to the draft. Your editor *would* likely push back on the "compartmentalization" or "irrational hobby" framing, not because you have the facts wrong, but because you might be missing the profound philosophical machinery connecting the two halves of his life.

  If you frame it as "Philosopher by day, ghost hunter by night," you risk presenting Sidgwick as schizophrenic in his thinking. The more compelling (and accurate) story is that **the ghost hunting was the emergency repair kit for the philosophy.**

  Here is the structural link you need to know to bulletproof your piece: **The Dualism of Practical Reason.**

  ### 1. The Philosophical Problem (The "Why")
  In *The Methods of Ethics*, Sidgwick arrives at a terrifying conclusion that haunts the entire book. He analyzes the three main ways people decide what is "right": Intuitionism, Egoism (what's best for me), and Utilitarianism (what's best for everyone).

  He finds that Utilitarianism is logically sound, *but* it often demands self-sacrifice. Egoism is also logically sound, *but* it demands self-preservation.
  *   **The Crisis:** If there is no God and no Afterlife, there is no guarantee that being a "good person" (Utilitarian) will result in your own happiness (Egoism). In fact, history suggests the opposite. Martyrs die; tyrants thrive.
  *   **The Dualism:** Without a cosmic guarantee of justice, Reason is split. It is rational to be moral, but it is also rational to be selfish. Sidgwick called this the "Dualism of Practical Reason." It was, to him, a failure of the system. If ethics cannot prove that virtue leads to happiness, ethics is broken.

  ### 2. The Religious Void (The Context)
  You are absolutely right that he lost his Christian faith. He signed the "Thirty-Nine Articles" required for Cambridge fellows while internally rejecting them (a source of immense guilt for him), eventually resigning his fellowship over it.

  But here is the kicker: **Sidgwick needed the *function* of Christianity without the *dogma*.** He needed the afterlife not for salvation of the soul, but as a **necessary postulate for ethics.** If the soul survives death, there is infinite time for justice to balance the scales. Virtue and Happiness can be reconciled.

  ### 3. Psychical Research as Empirical Theology (The Connection)
  This is where your "compartmentalization" theory gets shaky. Sidgwick didn't join the Society for Psychical Research (SPR) to dabble in the occult. He joined it to find **empirical data for the afterlife.**

  Since Revelation (the Bible) was no longer a trustworthy source for him, and Metaphysics (pure logic) couldn't prove immortality, he turned to **Science.**
  *   He applied the exact same rigorous, skeptical methodology to mediums and telepathy that he applied to hedonistic calculus.
  *   He wasn't looking for "spooky stuff"; he was looking for **evidence of survival.**
  *   If he could scientifically prove telepathy or survival of death, he could solve the Dualism of Practical Reason. He could save Utilitarianism from collapsing into Nihilism.

  ### 4. Why "Irrational Hobby" is the Wrong Frame
  Calling it a hobby suggests he suspended his critical faculties. He didn't.
  *   **He was the Skeptic-in-Chief:** Within the SPR, Sidgwick was often the most brutal critic of fraudulent mediums. He debunked far more than he endorsed.
  *   **The Tragedy:** The story isn't that a rational man went mad; it's that a rational man desperately *wanted* the evidence to be real to save his life's work, but his own rigor prevented him from accepting weak evidence. He died without the proof he needed.

  ### How to Pitch This to Your Editor
  Instead of "Compartmentalization," try **"Desperate Coherence."**

  *   **The Hook:** Sidgwick isn't a case of a smart man doing a dumb thing. He is a case of a man trying to use the scientific method to plug a hole in the universe that religion used to fill.
  *   **The Tension:** The tension isn't between his philosophy and his hobby. The tension is between his **hope** (that the afterlife exists to make ethics work) and his **honesty** (that the evidence just isn't there).
  *   **The Quote:** There is a famous letter where Sidgwick writes that if he were convinced Utilitarianism required self-destruction without hope of future reward, he doesn't know if he could go on living. That is the stakes.

  ### Summary for Your Piece
  Your theory about the loss of faith is 100% correct. But don't treat the psychical research as a coping mechanism *separate* from the philosophy. Treat it as an **extension of the philosophy.**

  He wasn't moonlighting. He was trying to scientifically verify the precondition required for his ethical system to function. That makes him not a confused hypocrite, but a tragic figure: the man who killed God with his logic, and then spent 20 years trying to find the corpse to make sure it was really dead, because if it wasn't, morality might still be possible.

  That is a much stronger, editor-proof narrative.
