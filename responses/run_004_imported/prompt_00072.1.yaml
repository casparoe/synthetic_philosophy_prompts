  A Bohmian and an Everettian are cleaning up after a dangerous quantum measurement.

  The Everettian sighs, looking at the debris. "It's heavy, knowing that in the other branch, this apparatus exploded and killed me."

  The Bohmian sweeps a pile of dust into a pan. "Don't worry. In the other component of the configuration space, the wavefunction exploded, but I wasn't there."

  The Everettian pauses. "So there's no dead version of you?"

  "No," says the Bohmian. "Just an **empty wave**. It has the exact amplitude and phase of a dead physicist, but there's no particle inside it to feel the pain."

  The Everettian shakes his head. "That's eerie. So in your multiverse, every wrong turn leaves a ghost behind?"

  "No," the Bohmian replies, dumping the dust. "In *my* multiverse, the ghosts have no mass. In *yours*, you're leaving a corpse in every decohered branch. I don't have to worry about littering other dimensions with dead bodies."

  The Everettian frowns. "So your theory is cleaner?"

  "Much," says the Bohmian. "I never have to bury my mistakes. I just let their wavefunctions dissipate."
