          *   *Correction/Refinement:* The prompt specifically asks the Causal-Role theorist to press on *malfunction*. How does Cummins's view handle a trait failing to do what it's "supposed" to do if "supposed to" is just "what it does"?
          *   *Strategy:* Marcus needs to show that "malfunction" is just a deviation from the typical causal contribution within the relevant system type, not a historical failure. Elena needs to show that without history, "malfunction" is just "difference."
      *   **Round 4: Deepening the Stalemate (The Costs):**
          *   Elena presses Marcus: If function is just causal contribution, then *everything* has infinite functions (the heart makes a sound, warms the chest, etc.). How do you distinguish proper function from mere effect?
          *   Marcus presses Elena: If function is just history, then a mutant with a new, beneficial trait has no function until it spreads. That seems wrong for forward-looking biology.
      *   **Conclusion:** No resolution. Both acknowledge the strength of the other's critique but hold their ground based on what they think "function" is meant to explain (normativity vs. systemic analysis).

  4.  **Refining the Arguments (Self-Correction during drafting):**
