answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Rain streaks the window. Two coffee cups sit untouched between them.*

  **Characters:**
  *   **Elena:** Proponent of the Etiological Account (Wright).
  *   **Marcus:** Proponent of the Causal-Role Account (Cummins).

  **Elena:** You're dodging the implication, Marcus. If you stick to your guns on the Causal-Role account, you have to admit that Swampman's heart has a function.

  **Marcus:** I don't see what I'm dodging. It's the obvious answer. Swampman is a molecule-for-molecule duplicate of a human being. His heart contracts rhythmically, it circulates oxygenated fluid, it keeps the system running. To say it lacks the function of pumping blood is to engage in some bizarre metaphysical mysticism.

  **Elena:** It's not mysticism; it's about normativity. On Wright's account, to say the function of the heart is to pump blood is to say that hearts exist *because* they pump blood. There is a feedback loop. Ancestral hearts pumped blood, that contributed to survival and reproduction, and that is why there are hearts now. Swampman popped into existence five minutes ago via a lightning strike in a swamp. There is no selection history. There is no "because."

  **Marcus:** So, because of a lack of pedigree, the organ doesn't work? If I were a surgeon called in to operate on Swampman, and I found a clot, would I be wrong to say, "The heart is malfunctioning"?

  **Elena:** You could say it's malfunctioning in a mechanical sense, like a clock that stops. But strictly speaking, on the etiological view, Swampman doesn't have proper functions at all. He has effects. His heart *does* pump blood, but it isn't *for* pumping blood. It's just a physical occurrence.

  **Marcus:** That is the cost I cannot pay, Elena. It renders the concept of function useless for physiology. Physiologists don't care about the phylogenetic history of the patient on the table. They care about the current organization of the system. If function is only about the past, you sever the link between function and current utility. Why should a missing selective history matter to whether an organ has a function *right now*?

  **Elena:** Because "function" isn't just a description of what is happening. It's an explanation of why the trait is there. If you remove the history, you remove the teleology. You're left with mere causation. The reason history matters *now* is that the current structure is a testament to that history. Swampman is a philosophical zombie in the biological sense. He mimics function, but he lacks the normative "ought."

  **Marcus:** But that "ought" is doing too much heavy lifting. Let's turn the table. Let's talk about your "cost." You etiological theorists love to claim you solve the problem of malfunction. A heart that doesn't pump blood is broken because it fails to do what it was selected to do. Fine. But how does your view handle a trait that *can't* do what it was selected for, but still exists?

  **Elena:** That's just a broken trait.

  **Marcus:** No, think about a congenital defect. A human born with a heart that physically cannot pump blood, perhaps due to a rare mutation. On your view, does it have the function of pumping blood?

  **Elena:** Yes. Because it belongs to a lineage where that trait was selected for that effect. The token is broken, but the type has a function.

  **Marcus:** Exactly. You rely on the "type." You rely on a reference class of normal organisms. But I can define that reference class without history. I can say the function of the heart is the contribution it makes to the circulatory capacity of the system, relative to a systemic analysis of a standard human organism. I don't need Darwin to tell me the heart pumps blood. I need anatomy.

  **Elena:** But how do you distinguish the *function* from the *side effects* without selection? That's the classic objection to Cummins. The heart pumps blood, yes. But it also makes a thumping sound. It warms the chest cavity. It produces a specific shadow on an X-ray. Why is pumping blood the function and warming the chest merely a side effect?

  **Marcus:** Context, Elena. Functions are relative to an analytic capacity. If we are analyzing the circulatory system, the function is pumping. If we are analyzing the acoustic properties of the thorax, the function is making sound. There is no single, God's-eye "True Function." There are functions relative to the capacities we are trying to explain.

  **Elena:** That makes function arbitrary! It depends on the whim of the investigator. But biology suggests functions are objective facts about the organism, not the observer. The heart was *designed* by selection to pump blood, not to make noise. That objectivity comes from history.

  **Marcus:** And that objectivity comes at the price of Swampman. Look, let's press the malfunction issue harder. Suppose the environment changes drastically. Say, gravity doubles tomorrow. Suddenly, the current heart structure is no longer optimal. It might even be selected *against* in the future. On your view, does the function change instantly?

  **Elena:** No, because the history remains. The function is fixed by the past selection.

  **Marcus:** So you could have a trait that is currently disastrous, contributes nothing to the system's capacity, and will be weeded out next generation, but you insist it still has the "function" of doing what it used to do? That seems to detach function from current biological reality. My account captures that the heart is currently contributing to circulation, regardless of whether that will be selected for tomorrow.

  **Elena:** It captures current contribution, yes, but it fails to capture *misuse* or *error* in a normative sense. If Swampman's heart stops, you can say "the system capacity is reduced." But you can't say "it failed to do what it ought to do." There is no "ought" without a "was."

  **Marcus:** I think "ought" is just a shorthand for "expected contribution to the containing system." If I buy a toaster, it has the function of toasting. If I find a toaster in the wild, formed by volcanic activity, molecule-for-molecule identical to my kitchen toaster...

  **Elena:** ...It doesn't toast. It just gets hot.

  **Marcus:** That's insane. If I put bread in it, it browns. If I rely on it to cook, it works. The distinction you're drawing is metaphysical hair-splitting that has no cash value in the lab.

  **Elena:** It has cash value when we talk about evolution! If you say Swampman's heart has a function, you imply there was a problem that the heart solved. But there was no problem. There was no pressure. You're attributing a solution to a non-existent problem.

  **Marcus:** And you're attributing a purpose to a machine that is currently running perfectly. Here is my real worry, Elena. Your view makes function backward-looking. Biology is often forward-looking. We want to know what a trait *does* for the organism's survival prospects now. If I discover a new organ in a deep-sea fish, I don't wait for the phylogenetic tree to be fully resolved before I hypothesize its function. I look at what it contributes to the fish's capacity to survive at depth.

  **Elena:** You hypothesize the function based on the assumption of history. You assume it was selected. If you found out that fish was actually a spontaneous generation, you'd withdraw the functional claim. You'd say, "Oh, it's just a巧合 (coincidence)."

  **Marcus:** I'd say it's a lucky accident. But if it keeps the fish alive, it's functioning.

  **Elena:** It's *acting* functionally. There is a difference.

  **Marcus:** Is there? Or is that just your commitment to Wright talking? Let's go back to malfunction. You say your view explains it better. A broken heart fails its historical mandate. But what about a trait that was never selected for, but is now co-opted? Exaptation. Feathers might have been for warmth, now they are for flight. On your view, does the feather have two functions? Or does the historical primacy lock it into warmth?

  **Elena:** Wright allows for derived proper functions. Once the feather is selected for flight, that becomes part of the etiology.

  **Marcus:** "Once it is selected." So, during the transition period, when the feather is being used for flight but hasn't yet been fixed by selection... what is it doing? Is it malfunctioning as a warmth-device and functioning as a proto-flight-device? It's messy. My view says: In the context of aerodynamics, its function is flight. In the context of thermoregulation, its function is warmth. Clean. Simple.

  **Elena:** Too simple. It loses the distinction between what the trait is *supposed* to do versus what it *happens* to do. Swampman is the ultimate test case because it strips away the history entirely. It forces you to admit that without selection, you just have physics.

  **Marcus:** And it forces you to admit that without current utility, you just have genealogy. If Swampman's heart pumps blood for fifty years, keeps him alive, allows him to reproduce... and you tell me, "That heart never had a function," you have divorced the concept of function from the life of the organism.

  **Elena:** I haven't divorced it from the life. I've anchored it in the *lineage*. Swampman has no lineage. He is a biological island. He is a snapshot without a movie.

  **Marcus:** But he's walking around! He's alive!

  **Elena:** Biologically, yes. Functionally, in the strict teleological sense, no.

  **Marcus:** Then your strict teleological sense is too strict for science.

  **Elena:** And your loose causal sense is too loose for philosophy.

  **Marcus:** *(Sips cold coffee)* So we're at an impasse. I can't accept that a working heart has no function.

  **Elena:** And I can't accept that a lucky accident counts as a purpose.

  **Marcus:** It seems, then, that we are using the word "function" to answer two different questions.

  **Elena:** You're asking, "What does this part do in this system?"

  **Marcus:** And you're asking, "Why is this part here?"

  **Elena:** Precisely. But in biology, "why is it here" usually implies "what does it do that kept it here."

  **Marcus:** Unless it's new. Or unless it's Swampman.

  **Elena:** *(Smiles slightly)* Unless it's Swampman. But Swampman doesn't exist. Real organisms do. And they have histories.

  **Marcus:** And they have current capacities. Until you can explain malfunction without relying on a "normal" reference class that looks suspiciously like my systemic analysis, I'll stick with Cummins.

  **Elena:** And until you can explain why the heart's thumping sound isn't a function without appealing to the investigator's interest rather than the organism's design, I'll stick with Wright.

  **Marcus:** Deal. Coffee?

  **Elena:** Please. But make sure the machine is functioning.

  **Marcus:** It's making hot liquid. That's good enough for me.

  **Elena:** It was selected to brew coffee. Don't forget the history, Marcus.

  **Marcus:** I'll keep it in mind.
