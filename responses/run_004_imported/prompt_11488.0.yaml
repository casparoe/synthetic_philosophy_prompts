answer: |-
  **Setting:** *A quiet corner of a university coffee shop, following a panel on the ethics of scientific testimony. Dr. Elena Vance (defending the Knowledge Norm of Assertion) and Dr. Marcus Thorne (defending the Truth Norm of Assertion) sit with half-finished coffees.*

  **Elena:** You made a compelling point during the Q&A, Marcus. But I remain convinced that collapsing the norm of assertion down to mere truth is dangerous for scientific communication. If we tell experts they only need to speak the truth, we sever the link between assertion and epistemic responsibility. You need to *know* what you say.

  **Marcus:** And I maintain, Elena, that the primary function of assertion is to convey information. If the information is true, the assertion has succeeded. Requiring knowledge adds a psychological hurdle that doesn't necessarily serve the listener. But let's move past the abstractions. You always bring up the Lottery Case. Let's hash it out.

  **Elena:** Fine. The Lottery. A fair draw, one million tickets. I hold ticket #452. The odds of it losing are 99.9999%. It is overwhelmingly probable that ticket #452 has lost. In fact, let's assume the draw has happened, the winner is #999,999, but the results haven't been posted yet. I say to you, "Ticket #452 lost." That statement is true. Under your Truth Norm, was my assertion proper?

  **Marcus:** If the ticket did indeed lose, then yes. The statement corresponds to reality. You have conveyed a truth.

  **Elena:** But it feels deeply improper. If I walked up to a ticket holder before the results were announced and said, "Your ticket lost," based *only* on the odds, they would be right to challenge me. They'd say, "How do you know? You haven't seen the results." If the norm were just truth, that challenge would be misplaced. I *did* speak the truth. But the challenge stands because I lacked knowledge. I had statistical probability, not epistemic grounding.

  **Marcus:** I grant you that it feels odd. But is that oddness about the *assertion* or about the *pragmatics*? Perhaps the listener infers you have inside information. But strictly speaking, if your goal is to minimize false beliefs in the community, asserting high-probability truths is useful.

  **Elena:** It's not just pragmatics, Marcus. It's about the guarantee involved in assertion. When I assert, I represent myself as having a specific epistemic standing. In the lottery case, I don't have that standing. I'm guessing, even if it's a very good guess. If we allow experts to assert based on statistical likelihood alone, without knowledge, we invite error. What if the lottery wasn't fair? What if there was a glitch? Knowledge requires ruling out those defeaters. Truth doesn't.

  **Marcus:** Here is where I press you back. You say knowledge requires ruling out defeaters. But in the lottery case, the statistical evidence *is* the defeater for the ticket winning. You're saying that because there is a 0.0001% chance of error, you can't assert. But Elena, we do this in science constantly. We assert claims based on confidence intervals. We don't have Cartesian certainty. We don't always have "knowledge" in your strict sense. If we adopt your Knowledge Norm, we silence experts who are speaking the truth based on the best available evidence, simply because that evidence is probabilistic.

  **Elena:** That's a conflation. Scientific consensus based on robust evidence *can* constitute knowledge, even if probabilistic. The lottery case is different because the evidence is purely statistical. It doesn't connect causally to the specific event. But let's set the lottery aside. It's the case that favors my view. I want to talk about the one that keeps me up at night. Jennifer Lackey's "selfless assertion."

  **Marcus:** The science teacher.

  **Elena:** Exactly. A high school biology teacher. She is a devout creationist. She personally does not believe evolution is true. However, she recognizes that the scientific evidence for evolution is overwhelming, that it is the standard curriculum, and that her students need to learn it. So, she stands in class and asserts, "Humans evolved from earlier primates." She says it sincerely, in the professional sense. She even offers evidence. But she lacks belief.

  **Marcus:** And this is a problem for you because knowledge requires belief. No belief, no knowledge. No knowledge, no assertion. So your norm says she is doing something wrong.

  **Elena:** Technically, yes. The Knowledge Norm says: Assert $P$ only if you know $P$. Since she doesn't believe $P$, she doesn't know $P$. Therefore, she shouldn't assert it. But intuitively, Marcus, she is doing the *right* thing. She is prioritizing her students' education and the scientific consensus over her personal dogma. If my norm condemns her, my norm is too strict.

  **Marcus:** Precisely. This is why the Truth Norm is superior for expert communication. Look at the variables. The proposition "Humans evolved" is true. The evidence she presents is sound. The students receive true information. Her internal psychological state—whether she "believes" in her heart—is irrelevant to the transaction of truth. She is acting as a conduit for established science. To tell her she is violating a norm of assertion is to prioritize her epistemic purity over the public's access to truth.

  **Elena:** I feel the force of that. I really do. But if I concede that she can assert without belief, I lose the "knowledge" requirement. Because if she can assert without belief, why can't she assert without justification? Why can't she just guess?

  **Marcus:** Because in the teacher case, she *has* justification. She has the textbooks, the data, the peer review. She just lacks the *belief*. Your norm bundles belief and justification into "knowledge." I'm suggesting we can decouple them. The norm should be: Assert $P$ if $P$ is true and you have adequate evidence for $P$, regardless of your doxastic attitude.

  **Elena:** But that opens the door to the "lucky guess" problem I mentioned earlier. Suppose I have no evidence, I just have a hunch that evolution is true, and I assert it. It happens to be true. Under a pure Truth Norm, did I violate anything?

  **Marcus:** If you have no evidence, you aren't acting as an expert. We are discussing *expert* communication. In the context of expertise, "adequate evidence" is the filter, not "knowledge." In the teacher's case, the evidence is public. She is deferring to the evidence despite her private doubts. Isn't that the ideal of science? To follow the evidence even when it contradicts your intuition?

  **Elena:** It is the ideal. But here is the tension, Marcus. In the Lottery case, you were willing to let probability slide because the truth was fixed. In the Teacher case, you are willing to let belief slide because the evidence is fixed. But notice the asymmetry.

  In the Lottery, I have high probability and (let's assume) truth, but no knowledge, and assertion feels *wrong*.
  In the Teacher case, I have high evidence and truth, but no belief (and thus no knowledge), and assertion feels *right*.

  If I accept your move on the Teacher to save my norm, I have to explain why the Lottery assertion remains improper. If evidence is enough for the teacher, why isn't statistical evidence enough for the lottery ticket?

  **Marcus:** Because the *type* of evidence differs. The teacher is relying on testimonial and causal evidence from the scientific community. That is a robust chain of reasoning. The lottery player is relying on bare statistical frequency. One connects to the mechanism of the world; the other connects to a distribution set.

  **Elena:** So you're smuggling in a reliability condition?

  **Marcus:** I'm smuggling in nothing. I'm saying the Truth Norm is the *constitutive* norm—what makes an assertion an assertion—but there are secondary ethical norms about evidence. But you, Elena, you hold Knowledge as the constitutive norm. How do you save the teacher without abandoning your core thesis?

  **Elena:** I've tried two routes. First, I could argue that she *does* believe, dispositionally. When she teaches, she is engaging in the practice of science, and in that context, she accepts the propositions. But Lackey argues this is disingenuous. She really doesn't believe.

  **Marcus:** It feels like you're redefining belief to save the norm.

  **Elena:** Perhaps. The second route is harder. I argue that she is violating the Knowledge Norm, but she is justified in violating it. There is a conflict of duties. Her duty to convey knowledge conflicts with her inability to know. She chooses the lesser evil.

  **Marcus:** A lesser evil? That strikes me as harsh. She is doing her job. By framing it as a violation, even an excusable one, you stigmatize the act of communicating well-supported truth when personal conviction lags. In an era of misinformation, do we really want to tell scientists, "If you aren't personally convinced, stay silent"?

  **Elena:** No, we don't. And that is why your Truth Norm tempts me. It protects the flow of information. But I fear it protects too much. Consider a climate scientist. She runs a model. The model says warming will exceed 2 degrees. The model is accurate 90% of the time. She asserts, "Warming will exceed 2 degrees." It turns out true. But suppose she privately thought the model was flawed, she just didn't want to cause panic, so she asserted the consensus view.

  **Marcus:** She conveyed the truth.

  **Elena:** But she didn't stand behind it. If a journalist asks, "Are you sure?" and she says "Yes," she is lying about her confidence. The Knowledge Norm captures the *commitment* involved in assertion. When I assert, I say, "I stand behind this as known." The teacher... perhaps the teacher isn't asserting in her own voice. She is asserting *on behalf of* the scientific community.

  **Marcus:** Ah. So the subject of the knowledge shifts. It's not "I know," it's "Science knows."

  **Elena:** Exactly. If we view assertion in science as a collective act, maybe the Knowledge Norm is satisfied by the community, even if the individual lacks belief.

  **Marcus:** That is a fascinating pivot. But now you've moved away from the individual epistemology we started with. You're making the norm social.

  **Elena:** Scientific communication *is* social.

  **Marcus:** But if the norm is social, then my Truth Norm works just as well socially. The community ensures the truth; the individual ensures the transmission. Why demand the individual possess the knowledge if the community guarantees the truth?

  **Elena:** Because the individual is the point of failure. If the teacher stops caring about whether she knows, and only cares about whether it's true, she might start simplifying to the point of distortion. "It's true enough" becomes the slogan. The Knowledge Norm demands a rigor of personal verification, or at least personal understanding, that the Truth Norm does not.

  **Marcus:** And yet, in the Lottery case, your rigor renders us mute. We cannot assert the truths we are most statistically certain of, simply because "knowledge" eludes us. In the Teacher case, your rigor renders us suspect for doing the right thing.

  **Elena:** And in the Lottery case, your permissiveness allows us to speak as if we have certainty when we have only odds. In the Teacher case, your permissiveness allows us to speak truths we don't actually stand behind.

  **Marcus:** So we are at an impasse. The Lottery case shows that Truth is insufficient for proper assertion—we need something more, like knowledge or warrant. But the Teacher case shows that Knowledge is unnecessary for proper assertion—we can assert without belief if the truth and evidence are secure.

  **Elena:** It seems the norm of assertion might not be a single rule. It might be a cluster concept. For scientific reporting, perhaps a "Reasonable to Believe" norm suffices. For testimony in court, perhaps Knowledge is required.

  **Marcus:** Or perhaps the norm is indeed Truth, but the *ethics* of communication require us to signal our level of confidence. The problem in the Lottery case isn't that I asserted a truth; it's that I didn't signal the probabilistic nature of my evidence. The problem in the Teacher case isn't that she lacked belief; it's that she might mislead students about her personal stance if asked directly.

  **Elena:** So we shift the burden from the *right to assert* to the *manner of asserting*.

  **Marcus:** It seems so. You want to police the gate before the words are spoken. I want to police the context in which they are heard.

  **Elena:** For the piece you're researching... I suppose the conclusion is that neither the pure Knowledge Norm nor the pure Truth Norm captures the full ethical landscape of expert communication.

  **Marcus:** The Knowledge Norm protects the speaker's integrity. The Truth Norm protects the listener's access to information. In science, we need both. We need experts who know their claims, but we also need them to communicate established truths even when those truths challenge their personal worldviews.

  **Elena:** A standoff, then.

  **Marcus:** A standoff. But a productive one. If we agreed, the research would be boring.

  **Elena:** *[Smiles]* Agreed. Though I still think you're wrong about the lottery ticket.

  **Marcus:** And I still think you're being too hard on the biology teacher.

  **Elena:** Coffee?

  **Marcus:** Coffee.
