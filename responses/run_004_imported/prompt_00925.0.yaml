answer: |-
  The obsidian table between us was polished to a mirror finish, reflecting the emerald sitting in the center. It was a heavy thing, cut from the asteroid belt of Sol-3, glowing with a deep, vegetative light.

  "It is green," I said.

  Kth'rar clicked his mandibles, a sound like dry leaves skittering on pavement. His four eyes, arranged in a vertical diamond, blinked in sequence. "It is grue."

  We had been at this for six days. The Trade Summit on Station Theta was scheduled to end in six hours. If we didn't agree on the classification of the mineral assets in the Sol sector, the human fleet would be denied access to the Vex hyper-lanes. We needed the lanes. They needed the minerals.

  But we couldn't agree on what the minerals *were*.

  "Kth'rar," I said, rubbing my temples. "Look at the data. We have spectrographic readings going back three centuries. Every single reading shows a wavelength of 550 nanometers. In your language, that maps to 'grue' *only if* the observation occurs before the Alignment."

  "Correct," Kth'rar said. He tapped a claw on the table. A hologram sprang up, displaying a graph. It was a flat, steady line. "And the Alignment occurs in four hours. After the Alignment, any object currently exhibiting 550 nanometers will be classified as 'bleen.' Which corresponds to your 'blue.'"

  "So you're saying," I said, the frustration rising in my throat like bile, "that in four hours, this stone will turn blue?"

  "No, Ambassador Lin. I am saying that in four hours, this stone will remain *grue*. You are the one predicting a change. You claim it will remain 'green.' But 'green' is a disjunctive predicate in our tongue. 'Green' means *grue* before the Alignment and *bleen* after. You are predicting the stone will magically switch properties from grue to bleen, yet you insist it looks the same. That is the superstition."

  I looked at the stone. It looked green. It had always looked green. My grandfather had called stones like this green. His grandfather before him.

  "And you think it's going to look blue after the Alignment?"

  "It will look exactly as it does now," Kth'rar said patiently. "But we will call it bleen. Just as you will call it green. The visual experience is identical. The predicate is what changes."

  "That's semantics," I snapped. "It doesn't matter what we call it. It matters how it behaves."

  "Behavior is prediction," Kth'rar countered. "If I build a filter calibrated to pass 'grue' light, it will pass this stone's light before the Alignment. If I build a filter calibrated to pass 'green' light, it will also pass this stone's light before the Alignment. Your engineering and our engineering are functionally identical *today*. But your contract stipulates that the minerals must remain 'green' for the duration of the mining lease. If the stone becomes 'bleen' after the Alignment, your contract is void. You are attempting to sell us a property you cannot guarantee."

  He was right. That was the horror of Goodman's Riddle, realized in flesh and diplomacy. All the evidence in the universe—all the spectrographs, all the historical logs, all the photons hitting our retinas—supported the hypothesis *All emeralds are green* exactly as well as it supported *All emeralds are grue*.

  Logic was dead. Evidence was silent. The future was a blank wall, and we were both painting different doors on it.

  "Why do you do it?" I asked, my voice quieter. "Why structure your language around a deadline?"

  Kth'rar leaned forward. The station's artificial gravity hummed. "Why do you structure yours around a permanence you cannot prove? To us, the universe is cyclical. The Alignment is a cosmic reset. It makes sense that properties reset. To you, the universe is linear. It makes sense that properties persist. Neither is provable. Both fit the data."

  He gestured to the emerald. "If I were to adopt your word 'green,' I would be using a predicate that is 'grue' until the Alignment and 'bleen' thereafter. It is a messy, jagged word. It cuts across the natural grain of time. 'Grue' is smooth. 'Grue' flows with the Alignment."

  "But 'Grue' is jagged to me!" I slammed my hand on the table. The emerald jumped. "To me, 'Grue' is 'Green-then-Blue.' It's a patchwork! It's two colors stitched together with a date!"

  "Precisely," Kth'rar said. "Symmetry."

  We sat in silence. The clock on the wall ticked down. Three hours to the Alignment.

  If I signed the contract defining the minerals as "green," and the Vex philosophy was somehow physically manifest (which it couldn't be, it was just language, but the *risk* was real), we would be in breach of contract in four hours. If I signed it defining them as "grue," my government would reject it because "grue" implied an expiration date on the value of the assets.

  We were paralyzed by the underdetermination of theory by data.

  I closed my eyes. I thought about the philosophy electives I'd taken at the Academy. The professor, a weary woman who drank too much coffee, had talked about a way out. It wasn't truth. It wasn't logic.

  *It's not about the world,* she had said. *It's about the words.*

  I opened my eyes. "Kth'rar. Does your word 'grue' appear in your ancient texts? The ones from before your species left your home star?"

  Kth'rar blinked. "Yes. It is foundational."

  "And does the word 'green' appear in ours?"

  "I presume."

  "Here is the problem," I said, standing up. I walked around the table to stand beside him. We both looked down at the stone. "We are arguing as if we are trying to match our words to the universe. But we aren't. We are matching our words to *each other*."

  "Explain."

  "You say 'grue' is smoother because it fits your cosmic cycle. I say 'green' is smoother because it fits my history. We both have a predicate that is 'entrenched.' We have used 'green' successfully for a thousand years. We have built bridges, lasers, and medical scanners using the assumption that 'green' stays 'green.' None of them have failed *because* of the color."

  Kth'rar tilted his head. "And we have used 'grue' successfully for a thousand years. Our filters have not failed."

  "Exactly. So the truth of the predicate doesn't matter. The *projectibility* matters." I took a breath. This was the leap. "Goodman called it entrenchment. A predicate is valid not because it matches reality, but because it has a history of being used in successful predictions. 'Green' is well-entrenched for humans. 'Grue' is well-entrenched for Vex."

  "So we cannot agree," Kth'rar said. "Because our entrenchments diverge."

  "No," I said. "We agree on the *translation*, not the ontology."

  I pulled up the contract interface. I deleted the clause regarding the permanent classification of the mineral spectrum.

  "What are you doing?" Kth'rar asked.

  "I'm writing a new clause. 'For the purposes of this agreement, the mineral designated as Sol-Emerald-01 shall be treated as functionally equivalent to Vex-Grue-Alpha prior to the Alignment, and functionally equivalent to Vex-Bleen-Beta post-Alignment, *provided that the human designation remains Green throughout.*'"

  Kth'rar's mandibles twitched. "That is... tautological."

  "It's pragmatic," I corrected. "We aren't promising that the universe won't change. We're promising that our *language* won't change. I will continue to call it green. You will continue to call it grue-then-bleen. We acknowledge that these are the same observation described through different linguistic habits."

  "But if the stone changes—"

  "Then we renegotiate," I said. "But we don't renegotiate based on a prophecy. We renegotiate based on utility. If the stone stops working in your filters after the Alignment, you tell us. Until then, we assume the entrenchment holds."

  Kth'rar looked at the stone. He looked at the clock. Two hours.

  "You are asking us to trust that your habit is as strong as our law."

  "I'm asking you to trust that my habit is as strong as *my* law," I said. "And that I won't break it. The stone might turn blue. The sun might not rise tomorrow. But I will *call* it green, and I will *act* as if it is green, because that is what my people do. That is the only proof I have. Not of the stone, but of me."

  Kth'rar was silent for a long time. The hum of the station seemed to grow louder. He was a creature of logic, but he was also a creature of trade. Trade required trust, and trust required consistency.

  "Entrenchment," Kth'rar said slowly. "The weight of usage."

  "The wear on the path," I said. "We walk it because it's there, and it's there because we walk it."

  He extended a claw over the interface. "In my language, there is a word for this. *K'lax*. It means 'the bridge built while walking.'"

  "Then let's walk," I said.

  He signed. I signed.

  We didn't solve the riddle. The emerald sat on the table, mocking us. In four hours, the Alignment would happen. The light from the station's main viewport might shift. The stone might look different. Or it might not. Logic offered no shield against the next moment.

  But as I packed up my datapad, I felt a strange calm. The anxiety of the unknown hadn't vanished, but it had been compartmentalized. We hadn't agreed on what the universe *was*. We had agreed on how to speak about it without killing each other.

  "Ambassador Lin," Kth'rar said as I reached the airlock.

  I turned.

  "If the stone becomes bleen," he said, "I will not accuse you of fraud."

  "And if it stays green," I replied, "I won't accuse you of superstition."

  He clicked his mandibles. It might have been a laugh. "Safe travels, Green-Speaker."

  "Safe travels, Grue-Speaker."

  I walked back to the human wing of the station. I passed a window and looked out at the stars. They were white. They had always been white. I knew, logically, that I couldn't prove they would be white tomorrow. I knew that "white" was just as suspect as "green."

  But I had a meeting in the morning. And for that meeting, I needed to wear my white uniform. So I would assume the stars cooperated. Not because I knew they would, but because I had no other way to get dressed.

  I touched the glass. The reflection showed my eyes. Brown. Or were they bleen?

  I turned away before the Alignment. I didn't want to know. It was enough that I had a word for it.
