answer: |-
  This is a classic ethical dilemma that philosophers have argued about for centuries. You're essentially asking about the tension between **consequentialism** (what your buddy is arguing: the outcome is all that matters) and **virtue ethics** (what you're feeling: the character and intent behind the action matter).

  Here is the breakdown of why you feel weird, why your buddy isn't entirely wrong, and why you should probably make peace with this.

  ### 1. Your buddy is right about the *impact*.
  From the perspective of the elderly woman, your motivation is irrelevant. Her legs stopped hurting. She didn't fall. She got to rest. In a utilitarian sense (maximizing well-being), you did a net good. If you had kept your headphones on, the net suffering in that train car would have been higher.

  Your buddy is trying to protect you from unnecessary guilt. He's saying: "Don't let the perfect be the enemy of the good." If we only did good things for 100% pure, selfless reasons, almost no good things would ever get done.

  ### 2. You are right about the *character*.
  The reason you feel weird is that you care about who you *are*, not just what you *do*. You're sensing a disconnect between your actions and your values.

  *   **The "Imposter" Feeling:** You feel like you "tricked" everyone into thinking you're a kind person when you were actually acting out of vanity or romantic interest.
  *   **The Counterfactual:** The part that bugs you most is your admission: *"If she hadn't been on that train, I'm pretty sure I would've just kept my headphones in."* This suggests that your default setting wasn't kindness; it was indifference, overridden by a desire for social status.

  This feeling isn't a sign that you're a bad person; it's a sign that you have a conscience. A truly selfish person wouldn't be losing sleep over this weeks later.

  ### 3. The Reality of "Impure Altruism"
  Psychologically, almost no human action is 100% selfless.
  *   People donate to charity for tax writes-offs or social clout.
  *   People help neighbors because they want to be liked.
  *   People return lost wallets because they don't want to feel like thieves.

  We like to tell ourselves stories about pure heroes, but in reality, **mixed motives are the human norm.** You had a selfish motive (impress the girl), but you also had a baseline of empathy (you noticed she was exhausted). The girl was the *catalyst*, but the empathy was the *fuel*. If you truly didn't care about the woman at all, seeing the girl wouldn't have made you give up the seat; you might have just smiled at the girl and stayed seated.

  ### 4. Why this actually matters for your future
  Here is the most important part: **Don't use this to beat yourself up; use it as data.**

  Your friend says "who cares," but you care, and that's valuable. This discomfort is your moral compass calibrating.
  *   **The Trap:** If you decide "my buddy is right, motives don't matter," you might become cynical and stop checking your intentions.
  *   **The Growth:** If you acknowledge "I did the right thing, but I want my reasons to catch up to my actions," you turn this guilt into growth.

  You proved to yourself that you are *capable* of giving up the seat. The physical action is now in your repertoire. Next time, maybe there won't be a girl watching. Maybe it will just be you and an old person. But because you've done it before, it will be easier to do it again.

  ### The Verdict
  Your buddy is right that the **result** was good, and you shouldn't take that away from the woman who got to sit down. But you are also right that the **motive** leaves something to be desired.

  You aren't a saint, but you aren't a villain either. You're a regular person who did a good thing for a complicated reason. That is allowed.

  **My advice:** Forgive yourself for the impure motive. Accept that you are a work in progress. The next time you see someone who needs a seat, try to stand up before you even look around to see if anyone is watching. That's how you bridge the gap between the action and the intent.
