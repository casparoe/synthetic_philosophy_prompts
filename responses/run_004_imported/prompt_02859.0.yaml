answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophy professors, ELENA (Traditionalist/Walzerian) and MARCUS (Revisionist/McMahan-esque), are surrounded by stacks of papers.*

  **Marcus:** Let's stick to the case. Hans. Conscripted. Aggressor nation. He's told his country is under threat, but objectively, his nation is the invader. He follows every rule. No civilians. Only engages enemy combatants. He shoots a defender, kills him. You say Hans is morally permitted to do that. I say Hans is committing a wrongful killing. In the objective moral ledger, it's indistinguishable from murder.

  **Elena:** Indistinguishable from murder? That's hyperbole, Marcus. Murder requires malice. Hans has none. He's a cog in a machine he didn't build, operating under duress and ignorance. To call his rifle fire "murder" is to strip the word of all meaning.

  **Marcus:** I'm talking about the *act*, not the *blame*. If a sleepwalker attacks you with a knife, he isn't culpable. He's not a villain. But he is an *unjust threat*. You are permitted to kill him to save yourself. He is not permitted to kill you. If he succeeds, he has taken a life he had no right to take. Hans is the sleepwalker. The defender is justified in killing Hans; Hans is not justified in killing the defender. That asymmetry destroys the "Moral Equality of Combatants."

  **Elena:** But that ignores the epistemic reality of the soldier. You're judging Hans from the comfort of a seminar room, years later, with the UN report on your desk. Hans is in a trench. His government tells him it's a defensive war. Intelligence is foggy. If you ground a soldier's right to fight on the objective justice of the cause, you're demanding they be international lawyers before they can be soldiers.

  **Marcus:** I'm not demanding they be lawyers. I'm saying their permission to kill derives from the justice of their cause, whether they know it or not. If I hire a hitman, and I lie to him and tell him the target is a terrorist threatening his family, the hitman pulls the trigger. Is he innocent? He's less culpable than me, sure. But the victim didn't deserve to die. The hitman had no right to kill him. Hans is the hitman.

  **Elena:** No, he's not. The hitman acts for private gain or private vengeance. Hans acts as an agent of the state. This is the Walzerian pivot. In the domestic sphere, individuals own their rights. In war, the state assumes the rights of the nation. When Hans puts on that uniform, he steps out of the ordinary moral economy and into the *jus in bello* sphere. His moral standing isn't derived from the *cause*; it's derived from his *status*.

  **Marcus:** Status? That's just a legal convention masquerading as morality. You're essentially saying that if enough people agree to play a game where we kill each other, the killing becomes morally neutral. But rights aren't magic. They don't vanish because you put on a costume. If the cause is unjust, the threat Hans poses is unjust. An unjust threat cannot claim a right to kill in self-defense against those stopping him.

  **Elena:** It's not a game, and it's not magic. It's a reciprocal convention designed to limit horror. If you tell Hans, "You are a murderer," what happens? He doesn't lay down his rifle. He decides that if he's a murderer anyway, the rules of engagement don't apply. He stops distinguishing between combatants and civilians. The Moral Equality of Combatants isn't a description of deep metaphysical truth; it's a functional moral barrier. It says: "As long as you fight clean, you are not a criminal." That keeps the war contained.

  **Marcus:** So we should teach soldiers a lie to keep them well-behaved?

  **Elena:** It's not a lie. It's a distinct moral framework. Think of it like a boxing match. If I punch you in the street, it's battery. If I punch you in the ring, under the rules, it's sport. The context transforms the act. The uniform is the bell. By wearing it, Hans signals: "I am a legitimate target, and I recognize you as one."

  **Marcus:** But boxing is consensual. War isn't. The defender didn't agree to the match. And here is where your view cracks: You say Hans is "killable." Why? Because he's dangerous? So if I'm dangerous, I lose my right to life?

  **Elena:** Because he has constructively consented to the risk. By taking up arms, he waives his right not to be attacked *by other combatants*. He enters a pool of reciprocal liability.

  **Marcus:** That's circular. He only waives that right if he has a right to be there in the first place. If I break into your house to steal your TV, I make myself dangerous. You can shoot me. But I don't gain a right to shoot you just because I'm now "in a fight." My liability to be killed doesn't grant me a license to kill. That's the core of the Revisionist view. Liability is not symmetrical. The just defender is liable to be killed only if he violates the rules. The unjust aggressor is liable to be killed simply by posing the threat.

  **Elena:** You're making the soldier bear the burden of the statesman's sin. If Hans is morally equivalent to a murderer, then logically, if we catch him, we should prosecute him. Yet, even you, Marcus, admit you don't want Hans in handcuffs.

  **Marcus:** Correct. And this is where people get confused. There is a difference between *objective wrongness* and *subjective culpability*. Hans is excused. He is under duress (conscription), he is non-culpably ignorant (propaganda), and he faces a coordination problem (if he deserts, he's shot by his own side). So, we don't punish him. But we shouldn't lie to him about the nature of the act. We can say, "You were excused, but the killing was not justified."

  **Elena:** And what practical work does that distinction do? If he's excused, he's not morally blameworthy. If he's not blameworthy, on what grounds do you say he's doing something "wrong"? Morality is action-guiding. If the advice to Hans is "Don't fight, but if you do, we won't punish you," you've severed morality from consequence.

  **Marcus:** Morality isn't just about consequences or punishment. It's about truth. If we accept the Equality view, we validate the aggressor's violence. We tell the defender, "The guy shooting at you is your moral equal." That undermines the very concept of defense. It suggests the defender is just another killer, rather than someone upholding right against wrong.

  **Elena:** It doesn't undermine defense; it isolates the *fighting* from the *cause*. Look, I grant you that deep down, in the ideal theory, you might be right. The just side has better moral standing. But the "Moral Equality" doctrine is the only thing that allows for a *clean* war. If the unjust soldier believes he is a murderer, he has no incentive to follow *jus in bello*. He becomes a terrorist. By granting him equal standing, we give him a stake in the rules. We say, "You can retain your honor even if your cause is lost." That is a moral good. It saves lives.

  **Marcus:** It saves lives by obscuring the truth about who is killing whom and why. It treats the battlefield as a moral vacuum. But consider the victim. The just defender killed by Hans. On your view, Hans had a right to kill him. That means the defender died at the hands of someone who was morally permitted to end his life. But the defender was defending his home! How can it be permitted to kill someone who is rightfully defending innocent life?

  **Elena:** Because the defender also accepted the risk of the battlefield. That's the reciprocity.

  **Marcus:** But the defender *had* to accept the risk. Hans *chose*—or at least participated in—the imposition of it.

  **Elena:** Hans didn't choose the war! He was conscripted.

  **Marcus:** He chose to pull the trigger. He could have aimed high. He could have surrendered.

  **Elena:** And been shot by his own officers or court-martialed. You're asking for a level of heroism that we don't demand of anyone else. We don't demand citizens civilly disobey unjust laws under threat of imprisonment. Why demand soldiers disobey unjust orders under threat of death?

  **Marcus:** Because the consequence isn't a fine. It's a dead human being. The stakes change the moral calculus. In ordinary life, if a corrupt cop tells you to drive a getaway car, you say no, even if you're scared. You don't get a "get out of morality free" card because you were pressured.

  **Elena:** But we *do* give those cards. We have the defense of duress. We have the defense of mistake of fact. Hans is operating under a massive, state-sponsored mistake of fact. Your view requires every soldier to conduct an independent investigation into the *jus ad bellum* before firing. That leads to paralysis. Or, it leads to soldiers deciding based on propaganda. The state must monopolize the judgment of the cause, or there is no collective defense, only vigilante warfare.

  **Marcus:** I'm not asking for an independent investigation. I'm saying the permission to kill *tracks* the justice of the cause, even if the soldier doesn't know it. It's an objective fact, not a subjective checklist. My point is about the *structure* of the ethics, not the soldier's mental state. The structure is asymmetrical. The just side fights with permission; the unjust side fights without it. Acknowledging this doesn't mean we prosecute every Hans. It means we stop pretending that aggression and defense are the same thing.

  **Elena:** But if you dismantle the Equality view, you dismantle the Laws of War. The Geneva Conventions are built on Walzer, not McMahan. If the unjust side knows they have no rights, they will grant none to the just side. You might win the philosophical argument, Marcus, but you lose the war for humanitarianism.

  **Marcus:** Maybe. But if the price of humanitarianism is telling the victim that their killer was their moral equal, that's a price I'm not willing to pay. I'd rather have a messy truth than a comforting lie. Hans is doing something objectively wrong. He is harming people who have done nothing to forfeit their rights. We can excuse him for his ignorance and his fear. We can refuse to prosecute him. But we cannot call it "justified."

  **Elena:** And I say that "justified" in war doesn't mean "aligned with cosmic truth." It means "compliant with the conventions that keep us from slaughtering everyone." Hans followed the conventions. Therefore, within the only moral framework that actually functions in war, he is justified. You're judging the battlefield by the standards of a courtroom. I'm judging it by the standards of survival.

  **Marcus:** And I'm saying survival without truth is just biology. Morality requires us to see the act for what it is. Hans killed a man he had no right to kill.

  **Elena:** And in doing so, he followed the only rules that might let him live with himself afterward. If you take that away, you don't get peace. You get nihilism.

  **Marcus:** *(Pauses, stirs his coffee)* So we're at an impasse. You prioritize the regulation of violence. I prioritize the moral ontology of violence.

  **Elena:** Exactly. You want the war to be morally legible. I want it to be morally containable.

  **Marcus:** And poor Hans is stuck in the middle. Objectively a wrongful killer, subjectively an excusable pawn.

  **Elena:** Or, a soldier who did his duty in a hellish situation, protected by a convention that says his uniform matters more than his flag.

  **Marcus:** I suppose the only thing we agree on is that we shouldn't be the ones sending him there.

  **Elena:** *(Smiles faintly)* On that, we have equality.
