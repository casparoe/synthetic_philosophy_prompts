answer: |-
  First, congratulations on the new arrival. Reading *Capital* at 3 AM while feeding a baby is a level of dedication that would make even the most hardened union organizer nod in respect. It is also completely understandable that the passage on procreation hit you differently than it might have five years ago. When you are sleep-deprived and hormonally adjusting to the reality that you are now responsible for keeping a tiny human alive, Marx's clinical description of your child as a "substitute" for worn-out labour-power feels less like theory and more like an intrusion.

  You aren't missing a hidden warmth in the text. It *is* cold. But that coldness is deliberate, and understanding *why* Marx writes this way helps unlock the machinery of the argument he is building for the surplus-value reveal later.

  Here is a breakdown of the two specific knots you're stuck on, based on the Moore-Aveling text you have in front of you.

  ### 1. The "Breeding" Framing: Why so biological?

  You noted that the passage says the wage must cover "the means necessary for the labourer's substitutes, i.e., his children, in order that this race of peculiar commodity-owners may perpetuate its appearance in the market."

  It feels dehumanizing because Marx is describing the **logic of Capital**, not the experience of the worker. From the perspective of the capitalist system, the working class is a distinct input factor, like coal or iron. Unlike a machine, which you just repair or replace from a catalog, human workers die. Therefore, for the system to continue, the "commodity" of labour-power must be biologically reproduced.

  Marx is making a structural point here: **The wage is not the price of your work; it is the cost of maintaining the machine that does the work.**

  If the wage only covered *you* (the individual worker), the workforce would vanish in one generation. Capital would run out of fuel. Therefore, the "value of labour-power" (which determines the baseline of wages) *must* include the cost of raising the next generation of workers.

  **Why this framing?**
  He uses this "race of peculiar commodity-owners" language to highlight a specific contradiction. Workers are free citizens, but structurally, they are forced to sell their ability to work to survive, and they are forced to raise children who will eventually have to do the same. By calling it a "race," he emphasizes that this isn't about individual choices; it is a class condition.

  **The "Historical and Moral Element"**
  Notice the very first sentence of your first excerpt: *"In contradistinction therefore to the case of other commodities, there enters into the determination of the value of labour-power a historical and moral element."*

  This is the crack in the door. Marx admits that the "biological minimum" isn't the only thing that sets wages. What counts as "necessary" subsistence depends on the level of civilization, the strength of unions, cultural expectations, etc. (This is where your union organizing background kicks in: fighting to expand that "moral element" so the wage covers more than just bare survival.)

  However, the biological floor (the need to raise children to replace dead workers) is absolute. He writes this coldly to show that under capitalism, **human reproduction is subsumed under capital accumulation.** Your child is, to the system, a future unit of labour-power. Feeling chilled by that is the correct reaction; Marx wants you to see the violence of that abstraction.

  ### 2. Rossi, the "Phantom," and the Digestion Analogy

  This is the technical linchpin of the whole book. If Marx loses this argument, the theory of surplus value collapses.

  **Who is Rossi and what is he objecting to?**
  Pellegrino Rossi was a bourgeois economist. His objection ("To comprehend capacity for labour... is to comprehend a phantom") is essentially a moralistic one. He is arguing: *You cannot separate the worker's ability to work from the worker's life.*

  Rossi is saying: "Labour isn't a thing you can put on a scale. It's a human activity. To talk about 'labour-power' as a commodity separate from the worker's food, home, and life is fake (a phantom). You can't value the work without valuing the life."

  On the surface, Rossi sounds nicer than Marx. He sounds like he's defending the humanity of the worker.

  **Why Marx has to crush this argument:**
  If Rossi is right, then exploitation is impossible to calculate. If labour and the worker's subsistence are one inseparable blob, then the wage is just "a share of the product" determined by custom or morality. There is no mathematical gap between what the worker is paid and what the worker produces.

  Marx needs to prove that **Labour-Power** (the capacity to work) is a specific commodity that is bought and sold, distinct from **Labour** (the actual act of working).

  **The Digestion Analogy Explained:**
  Marx writes: *"When we speak of capacity for labour, we do not speak of labour, any more than when we speak of capacity for digestion, we speak of digestion. The latter process requires something more than a good stomach."*

  Here is the translation of that analogy:
  *   **Capacity for Digestion:** This is your stomach's potential to break down food. It exists even when you aren't eating.
  *   **Digestion:** This is the actual *process* of breaking down food.
  *   **Good Stomach:** This is the worker's body.
  *   **Something More (Food):** This is the means of subsistence.

  Rossi says: "Talking about the *capacity* to digest without the food is a phantom."
  Marx says: "No. The *capacity* is real. But to keep that capacity available, I need to feed the stomach. The **value** of that capacity is determined by the cost of the food required to maintain it."

  **How this defeats Rossi:**
  Marx is agreeing with Rossi that you need subsistence (food/wages) to have labour-power. But he is disagreeing that this makes the concept a "phantom."
  1.  **Distinction:** The worker sells the *capacity* (Labour-Power) for a day.
  2.  **Valuation:** The price of that capacity is the cost of the subsistence needed to maintain it (including the children you mentioned earlier).
  3.  **Consumption:** Once the capitalist buys the *capacity*, they get to use the *process* (Labour).

  This is the setup for the exploitation argument. The capitalist pays for the **Capacity** (which costs, say, 4 hours of value to produce in terms of food/rent/kids). But once they own that capacity for the day, they can force the **Process** to run for 8 hours.

  The gap between the value of the *Capacity* (wages) and the value created by the *Process* (production) is Surplus Value.

  If Rossi wins, and we say "Labour and Subsistence are one thing," that gap disappears. Marx is insisting on this cold, clinical separation not to dehumanize the worker, but to isolate the exact mechanism where value is extracted.

  ### Summary: How this loads into the next chapter

  You asked if this is load-bearing. It is the foundation.

  1.  **The Breeding Passage:** Establishes that the wage must cover the **reproduction of the class**, not just the individual. This prevents the system from burning out its fuel source. It explains why wages tend toward subsistence levels unless fought otherwise (the "historical and moral element").
  2.  **The Rossi/Digestion Passage:** Establishes that **Labour-Power is a commodity distinct from Labour.** This allows Marx to argue in Chapter 7 that the worker creates more value during the "process" (Labour) than the "capacity" (Labour-Power) cost them to buy.

  **For the 3 AM Reader:**
  It is okay to feel alienated by this text. Marx is describing a system that alienates *him* from his own humanity, and he is using the language of that system (commodities, markets, reproduction) to dissect it. He isn't saying your child *is* a substitute worker; he is saying capitalism *treats* your child as a future substitute worker.

  The "digestion" bit is him sharpening his scalpel. He has to separate the *potential* from the *act* to show where the theft happens. Rossi wants to blur the lines to make the theft invisible. Marx draws the lines in ink to make the theft visible.

  Get some rest when you can. The dialectic will still be there when you wake up.
