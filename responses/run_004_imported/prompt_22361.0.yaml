prompt: |-
  So my kid was born about six weeks ago and I've been doing alot of 3am-feeding reading on my phone because it beats doom-scrolling, and a friend from my last job (we were both on the union organizing committee there) told me I "finally have the excuse" to get through Capital vol. 1. I'm on chapter 6, "The Buying and Selling of Labour-Power," and I got completely stuck on the part where Marx explains how the value of labour-power actually gets fixed. There's a passage where he says the worker is mortal, so has to "perpetuate himself... by procreation," and that this means the wage has to cover "the means necessary for the labourer's substitutes, i.e., his children," so this "race of peculiar commodity-owners" can keep showing up on the market. I get the basic economic point, that wages are set to reproduce the whole workforce generationally and not just keep one guy alive, but reading that phrasing three weeks postpartum it hit way colder than I think even Marx intended, and it made me suspect I'm missing something about why he chose to put it this way.

  Then a couple paragraphs later (after some arithmetic about daily vs. weekly vs. quarterly expenses that I skipped over) there's a bit where he's defending this whole approach against some guy named Rossi, who apparently objected that talking about "capacity for labour" separately from the worker's means of subsistence is like talking about a "phantom" or être de raison. Marx's comeback is to compare it to "capacity for digestion" — we don't mean digestion itself when we talk about capacity for digestion, since digestion needs more than just a stomach. I genuinely dont follow what that analogy is doing or why Marx thinks it answers Rossi, and this is all happening before he's even explained where surplus-value actually comes from, so I can't tell how load-bearing this bit is for the argument that's coming. Could you help me actually work through these two pieces of text — why the weirdly biological "breeding" framing, what Rossi's objection really is and whether the digestion comparison actually defeats it, and how this is setting up the exploitation argument a chapter or so later? I've copied the actual passages below (from the old Moore-Aveling translation, which is what my copy uses) so you're responding to what's really on the page and not just a general summary of "surplus value" I could've gotten anywhere:

  "In contradistinction therefore to the case of other commodities, there enters into the determination of the value of labour-power a historical and moral element. Nevertheless, in a given country, at a given period, the average quantity of the means of subsistence necessary for the labourer is practically known.

  The owner of labour-power is mortal. If then his appearance in the market is to be continuous, and the continuous conversion of money into capital assumes this, the seller of labour-power must perpetuate himself, 'in the way that every living individual perpetuates himself, by procreation.' The labour-power withdrawn from the market by wear and tear and death, must be continually replaced by, at the very least, an equal amount of fresh labour-power. Hence the sum of the means of subsistence necessary for the production of labour-power must include the means necessary for the labourer's substitutes, i.e., his children, in order that this race of peculiar commodity-owners may perpetuate its appearance in the market."

  [...]

  "It is a very cheap sort of sentimentality which declares this method of determining the value of labour-power, a method prescribed by the very nature of the case, to be a brutal method, and which wails with Rossi that, 'To comprehend capacity for labour (puissance de travail) at the same time that we make abstraction from the means of subsistence of the labourers during the process of production, is to comprehend a phantom (être de raison). When we speak of labour, or capacity for labour, we speak at the same time of the labourer and his means of subsistence, of labourer and wages.' When we speak of capacity for labour, we do not speak of labour, any more than when we speak of capacity for digestion, we speak of digestion. The latter process requires something more than a good stomach."
