answer: |-
  Here are 10 interview questions tailored to your background and the guest's thesis, including the specific constraints you asked for. I've structured them to move from the theoretical to the practical, with "Dodge Alerts" and "Follow-ups" to keep her from retreating into abstraction.

  ### 1. The "Necessary Condition" Trap
  **Question:** You argue that standard metrics like calibration or equalized odds aren't *necessary* for fairness. That implies there are scenarios where a model could violate *every* standard statistical fairness criterion and still be morally defensible. Can you give us a concrete example of a model that fails all the metrics but passes your ethical test?
  *   **Likely Dodge:** She might describe a vague scenario where "the process was inclusive" or "stakeholders agreed," avoiding the statistical reality.
  *   **Follow-up:** "Okay, but if I'm the data scientist shipping the code, and my dashboard shows red flags on every metric, but you tell me it's ethical—what is the specific *feature* of the model that overrides the statistics? Is it the intent, the usage, or the outcome?"

  ### 2. The Mechanics of Impossibility (Required)
  **Question:** I want to drill down on the math for a second. We know from the KMR and Chouldechova results that if base rates differ between groups, you literally cannot satisfy calibration and equalized odds simultaneously. It's not just hard; it's algebraically impossible. If statistical metrics are flawed, does the *math* of the trade-off still matter? Why do unequal base rates specifically force this moral conflict, and in your view, which horn of the dilemma are we obligated to sacrifice?
  *   **Likely Dodge:** "Math isn't morality. The conflict shows the metrics are the problem, not the reality."
  *   **Follow-up:** "But the model still has to output a score. If the math forces me to choose between lying about risk (miscalibration) or distributing errors unequally (unequalized odds), which specific harm are you telling me is permissible to incur?"

  ### 3. The "Toy Case" Intuition Pump
  **Question:** You've built toy cases where a predictor everyone would call "obviously fair" flunks every metric. Walk us through one of those. Is the lesson that our moral intuition is superior to the math, or that the math is measuring the wrong variable entirely?
  *   **Likely Dodge:** "It shows that context overrides abstract numbers."
  *   **Follow-up:** "If context overrides numbers, can we codify that context? Or are you arguing that fairness is fundamentally un-auditable by design?"

  ### 4. COMPAS Adjudication (Required)
  **Question:** Let's apply this to the COMPAS recidivism tool. ProPublica attacked it for unequal false-positive rates; Northpointe defended it using calibration. Given your view that neither metric is sufficient for fairness, who was closer to the truth? If you were advising the court at the time, would you have told them to ban the tool, use it with constraints, or ignore the statistical debate entirely?
  *   **Likely Dodge:** "Both sides were trapped in a flawed framework. The real issue was the lack of due process."
  *   **Follow-up:** "I agree due process matters, but the judge still had to make a bail decision *that day*. If you strip away the metrics, what specific piece of evidence replaces them to ensure the defendant wasn't just discriminated against?"

  ### 5. The Compliance Officer's Dilemma
  **Question:** I work in lending, and my compliance team needs to sign off on models. They want to see numbers that prove we aren't discriminating. If I tell them, 'A philosopher says these numbers don't matter,' I'll get laughed out of the room. What is the operational alternative? What do I put in the compliance report instead of a disparate impact ratio?
  *   **Likely Dodge:** "You need a multi-stakeholder governance board to review the model."
  *   **Follow-up:** "Boards meet quarterly; models deploy in real-time. What is the *runtime* constraint? Is there a threshold or a trigger I can code that says 'stop' if the model becomes unfair, even if the metrics say it's fine?"

  ### 6. Biased Base Rates (Required)
  **Question:** In lending and policing, the base rate gaps themselves are often downstream of historical bias—like redlining or over-policing. The impossibility theorem assumes base rates are just 'given.' Does your framework treat the *source* of the base rate gap as relevant to what counts as fair? If the base rate is corrupted by injustice, does satisfying a metric like calibration actually amplify that injustice?
  *   **Likely Dodge:** "That's a structural societal problem, not an algorithmic one. We can't fix history with code."
  *   **Follow-up:** "But the code acts on that history *now*. If I know the base rate is biased, am I obligated to 'break' calibration to correct for it, or does your framework require we fix the data before we even talk about the model?"

  ### 7. Legal Liability vs. Moral Fairness
  **Question:** Regulations like ECOA or GDPR imply that statistical parity tests are the legal standard for discrimination. If your philosophical definition of fairness diverges from the legal definition, are you advising companies to be morally right but legally liable? How do we square your framework with the law?
  *   **Likely Dodge:** "The law is lagging behind ethical understanding. We need to change the law."
  *   **Follow-up:** "I can't wait for the law to change. In the meantime, if I follow your advice and get sued, is 'the philosopher said so' a valid defense? Where is the safe harbor in your theory?"

  ### 8. The "Who Decides?" Problem
  **Question:** If fairness isn't in the metrics, it must be in the values guiding the model. But whose values? In a startup, that's usually the CEO or the lead engineer. Does your framework require a democratic process to define fairness, and if so, who gets a vote? The borrowers? The shareholders? The data scientists?
  *   **Likely Dodge:** "It should be a deliberative process involving affected communities."
  *   **Follow-up:** "That sounds ideal, but it's expensive and slow. Are you arguing that small companies *cannot* build fair AI because they lack the infrastructure for democratic deliberation?"

  ### 9. Accuracy as a Fairness Proxy?
  **Question:** The impossibility theorem vanishes if you have a perfect predictor. Accuracy and fairness often trade off, but sometimes better data reduces the tension. Do you view pursuing higher accuracy as a moral imperative to reduce the need for these fairness trade-offs, or is accuracy itself a suspect goal?
  *   **Likely Dodge:** "Accuracy is often defined on biased labels, so more accuracy just means more efficient bias."
  *   **Follow-up:** "So we should accept *less* accuracy if it means we aren't optimizing against a biased ground truth? Is there a point where a model is too accurate to be safe?"

  ### 10. The Ultimate Metric
  **Question:** To close: If you had to mandate *one* thing for every data science team to track tomorrow—replacing the standard fairness metrics—what would it be? Is it a metric, a process, a disclosure, or something else entirely?
  *   **Likely Dodge:** "There is no silver bullet. It requires a holistic approach."
  *   **Follow-up:** "I hear you, but if you could force every CTO to measure exactly one thing to minimize harm, what variable goes on the dashboard? If you say 'nothing,' aren't you just leaving it to chance?"
