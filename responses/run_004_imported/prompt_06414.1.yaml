answer: |-
  You are on very solid ground here. In fact, you have identified the dominant interpretation in contemporary Sidgwick scholarship. You are not forcing a tidy story; you are recounting the story that specialists tell, which just hasn't fully trickled down into all survey courses yet.

  However, since you have a Sidgwick-literate colleague in the room (the one who has read the *Memoir*), there are specific nuances you need to get right to avoid the "embarrassing moment" you're worried about.

  Here is a breakdown of the accuracy, the complications, and the viability of the talk.

  ### 1. Does the interpretation hold up?
  **Yes.** The claim that the SPR was a philosophical project aimed at resolving the "Dualism of Practical Reason" is the standard view among experts.
  *   **The Textual Basis:** In the final chapter of *The Methods of Ethics* (especially the 1st and later editions), Sidgwick argues that if there is no God and no afterlife, Rational Egoism and Rational Utilitarianism are irreconcilable. Reason is "divided against itself."
  *   **The Motivation:** Sidgwick could not return to the Anglican fold (having resigned his fellowship in 1869 over the Thirty-Nine Articles). He needed *evidence*, not dogma. The SPR was founded (1882) explicitly to investigate these questions using scientific methods. Sidgwick was a founding member and president.
  *   **The Link:** He hoped that empirical evidence for survival of death and divine moral governance would provide the "sanction" needed to align self-interest with duty, thereby saving the coherence of practical reason.

  **Verdict:** Your central move is correct. It is not a fringe reading.

  ### 2. Complications & Nuances (The "Expert Trap")
  To keep the retired colleague nodding along rather than squinting, watch out for these three nuances:

  **A. Hope vs. Proof**
  Be careful not to imply Sidgwick thought the SPR *succeeded* in proving the moral order. He didn't. He remained an agnostic to the end.
  *   *The Nuance:* The SPR work was an attempt to make theistic belief *rationally permissible* based on evidence, rather than faith. He wanted to show that belief in a moral order was *probable enough* to rely upon for ethical coherence.
  *   *The Risk:* If you say "Sidgwick used the SPR to solve the Dualism," the expert might think, "No, he didn't solve it; he died still worried about it."
  *   *The Fix:* Frame the SPR work as an *attempted resolution* or a "lifelong project to find the missing premise," rather than a successful closure of the gap.

  **B. The Kant Comparison**
  You mentioned this is a "Kantian postulate move done in Sidgwick's empiricist idiom." This is excellent, but be precise.
  *   *The Nuance:* Kant postulates God and Immortality as necessary conditions of the *moral law* (we must believe them to make sense of the *Summum Bonum*). Sidgwick agrees they are necessary for the *coherence of rationality*, but he rejects Kant's transcendental method. Sidgwick wants *empirical* verification.
  *   *The Fix:* Emphasize that Sidgwick found Kant's solution dogmatic. Sidgwick's tragedy is that he needed Kant's conclusion but could only accept it via Victorian empiricism.

  **C. The Timeline and Secrecy**
  Sidgwick was somewhat guarded about admitting that his ethical theory motivated his psychical research. He often framed the SPR work as pure scientific inquiry.
  *   *The Nuance:* The *Memoir* (written by his wife, Eleanor Sidgwick, and others) is where the explicit connection is most visible. Sidgwick's own public philosophical writing keeps them slightly more separate.
  *   *The Fix:* Acknowledge that Sidgwick kept these "two lives" somewhat distinct in public, but that his private correspondence and the *Memoir* reveal the unity. Since your colleague has read the *Memoir*, acknowledging it by name is a "dog whistle" that shows you've done your homework.

  ### 3. Secondary Literature to Flag
  If you want to shield yourself, drop these names. They signal you know the landscape:
  *   **J.B. Schneewind:** *Sidgwick's Ethics and Victorian Moral Philosophy* (1977). This is the classic text that cemented the connection between the Dualism and the SPR.
  *   **Bart Schultz:** *Henry Sidgwick: Eye of the Universe* (2004). This is the definitive modern biography. Schultz leans heavily into the SPR connection. If the expert challenges you, Schultz is your best backup.
  *   **Eric Mack:** Has written well on the Dualism specifically.

  ### 4. Is it interesting enough for 20 minutes?
  **Absolutely.**
  *   **For the Grad Students:** It humanizes a figure often presented as a dry, systematizing machine. It shows the existential stakes of Victorian ethics (i.e., "If I can't prove this, morality is irrational").
  *   **For the Retired Colleagues:** It engages with the specific textual tension in the *Methods* that they know is there.
  *   **For You:** It bridges the gap between normative ethics and the history of ideas/science.

  **Suggested Structure for the Talk:**
  1.  **The Hook:** The "Two Sidgwicks" problem (The rigorous Utilitarian vs. the Ghost Hunter).
  2.  **The Problem:** Briefly explain the Dualism of Practical Reason (Egoism vs. Universalism) and why it threatens the rationality of morality.
  3.  **The Constraint:** Why faith wasn't an option (1869 resignation).
  4.  **The Project:** The SPR as "Empirical Theology." Not a hobby, but a search for the missing premise.
  5.  **The Tragedy:** He never found the proof. The Dualism remains, but the *search* explains the SPR involvement.

  ### Summary Advice
  You are not saying anything embarrassing. You are presenting the standard scholarly consensus. The only risk is overstating Sidgwick's *confidence* in the SPR results. If you frame it as a **desperate philosophical project** rather than a **successful scientific one**, you will be fine.

  Good luck with the biscuits and the talk. It sounds like a great session.
