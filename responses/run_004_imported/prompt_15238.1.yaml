      *   *Logic:* Standard Deontic Logic (SDL) relies on Agglomeration. If dilemmas exist, Agglomeration fails. If Agglomeration fails, logic breaks down in useful ways.
      *   *Phenomenology:* Regret/Residue is compatible with doing the right thing. It acknowledges the cost of the *overridden* duty, not the persistence of an *unfulfilled* ATC duty.
      *   *Metaphysics/Theory:* A consistent moral code shouldn't contradict itself. Apparent contradictions indicate epistemic limits or prior errors (Donagan).

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the student's intuition (residue feels like proof) but label it a category error. State the thesis: Dilemmas are epistemic or tragic, not logical features of morality itself.

      *   **The Logical Cost (Agglomeration & "Ought Implies Can"):**
          *   Need to hit the logic hard.
          *   Standard Deontic Logic (SDL) assumes Agglomeration: If $O(A)$ and $O(B)$, then $O(A \land B)$.
          *   If genuine dilemmas exist ($O(A)$ and $O(B)$ but $\neg \diamond (A \land B)$), then by Agglomeration, $O(A \land B)$.
          *   But $O(A \land B)$ implies $\diamond (A \land B)$ (Ought Implies Can).
          *   Contradiction.
          *   *The Dilemma Defender's Move:* Reject Agglomeration.
          *   *The Counter-Argument:* Why is rejecting Agglomeration worse? It destroys the systematic nature of obligation. If obligations don't aggregate, moral reasoning becomes fragmented. We can't deliberate about total states of affairs. It makes morality arbitrary. It severs the link between rationality and obligation.
          *   *Better Move:* Keep Agglomeration and OIC. Therefore, one obligation must be overridden.

      *   **Explaining Residue (The Rossian Move):**
          *   Students think: Regret = Unfulfilled ATC Obligation.
          *   Counter: Regret = Acknowledgment of Violated *Prima Facie* Duty.
          *   Analogy: Promises. I promise A and B. Can only do A. I *should* do A (ATC). But I still broke a promise (B). The "sting" is the broken promise, not a lingering obligation to do the impossible.
          *   Distinguish *Guilt* (for doing wrong) vs. *Agent-Regret* (for being involved in a tragic outcome). Williams conflates these to prove dilemmas.
          *   If I did what I ATC ought to do, I acted rightly. Residue is the cost of the *situation*, not evidence of a second ATC "ought."

      *   **Donagan's Point (Prior Wrongdoing/Tragedy):**
          *   Agamemnon is the test case. Sacrifice daughter or abandon fleet/cause war.
