      *   *Check:* Is the distinction between *prima facie* and *all-things-considered* clear? *Yes, this is the pivot point for the residue argument.*

  6.  **Final Polish:** (Mental check of the Agglomeration argument).
      *   If $O(A)$ and $O(B)$ and $\neg \diamond (A \land B)$.
      *   If Agglomeration holds, $O(A \land B)$.
      *   If OIC holds, $\diamond (A \land B)$.
      *   Contradiction.
      *   Dilemma theorist drops Agglomeration.
      *   My argument: Dropping Agglomeration makes $O$ non-aggregative, which means I can't reason about conjunctions of actions. It makes moral logic paraconsistent, which is a huge theoretical price tag compared to just saying "One duty outweighed the other."

