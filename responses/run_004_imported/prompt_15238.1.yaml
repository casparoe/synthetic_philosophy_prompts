answer: |-
  Here is a sharp, argumentative case for the impossibility of strong moral dilemmas, designed to disrupt your students' consensus. It focuses on the logical costs of the dilemma view, the Rossian explanation of residue, and Donagan's rationality constraint.

  ***

  ### The Case for Consistency: Why Strong Dilemmas Are Impossible

  Your students are being seduced by phenomenology. They feel the weight of moral residue—the regret, the remainder, the "sting" of the unchosen path—and they are inferring a metaphysical conclusion from an emotional premise. They argue: *Because I feel I have violated something real, I must have violated an all-things-considered (ATC) obligation.*

  This is a category error. To accept strong moral dilemmas is to purchase a phenomenological intuition at the price of logical coherence and the action-guiding function of morality. Here is the case for why exactly one obligation is binding ATC in every instance, and why the alternative destroys the structure of ethical reasoning.

  #### 1. The Logical Cost: Agglomeration and "Ought Implies Can"
  The strongest argument against dilemmas is not intuitive; it is formal. Standard Deontic Logic (SDL) rests on the **Agglomeration Principle**:
  $$O(A) \land O(B) \rightarrow O(A \land B)$$
  If you ought to do $A$ and you ought to do $B$, it follows that you ought to do ($A$ and $B$).

  If strong dilemmas exist, we have a case where $O(A)$ and $O(B)$ are both true ATC, but it is impossible to do both ($\neg \diamond (A \land B)$). If we maintain Agglomeration, we must conclude $O(A \land B)$. But this violates the Kantian principle that **"Ought Implies Can" (OIC)**:
  $$O(A \land B) \rightarrow \diamond (A \land B)$$
  If you ought to do the conjunction, you must be able to do the conjunction. But in a dilemma, by definition, you cannot.

  To save the dilemma, the Barcan Marcus/Williams camp must **reject Agglomeration**. They must claim that obligations do not aggregate. This is a catastrophic theoretical cost. If obligations do not aggregate, moral reasoning becomes fragmented. I cannot deliberate about my total moral state. I cannot ask, "What is the best total state of affairs I am obligated to bring about?" because the logic of obligation no longer applies to conjunctions of actions.

  Rejecting Agglomeration renders morality **non-systematic**. It suggests that the moral "ought" is not a consistent operator over actions but a fragmented set of demands that can logically contradict one another without resolution. It is far less costly to our understanding of rationality to maintain Agglomeration and OIC, and thereby conclude that in any conflict, one obligation must *override* the other. If one overrides the other, it is not an ATC obligation; it is a defeated claim. To call it an ATC obligation is to misuse the term "obligation."

  #### 2. Explaining Residue: The Rossian Distinction
  Your students argue that moral residue (regret, remorse) proves the unchosen obligation was still binding. This conflates **violating a *prima facie* duty** with **violating an *all-things-considered* duty**.

  W.D. Ross gives us the tools to explain residue without admitting dilemmas. A *prima facie* duty is a real moral reason, grounded in facts (a promise made, a need present). When duties conflict, the *prima facie* duties do not vanish; they compete. The one with greater weight becomes the ATC duty. The other remains a *prima facie* duty that is necessarily unfulfilled.

  *   **The Phenomenology:** When Agamemnon sacrifices Iphigenia, he violates the *prima facie* duty of non-maleficence/parental care. He fulfills the ATC duty (say, to his fleet/country, or to avoid greater catastrophe).
  *   **The Error:** The student says, "He feels regret, therefore he did wrong ATC."
  *   **The Correction:** He feels regret because he *did* do wrong *prima facie*, even though he did right ATC.

  Moral residue is the acknowledgment of the moral cost of the *overridden* duty. It is the recognition that a genuine moral value was sacrificed. But acknowledging the value of the sacrificed duty is not the same as acknowledging an ongoing obligation to have performed it. If I break a promise to save a life, I owe the promisee an apology (residue), but I do not owe them the broken promise (ATC obligation). To argue otherwise is to claim I should have let the person die to keep the promise, which contradicts the judgment that saving the life was the ATC duty.

  Williams relies on "agent-regret" to suggest the agent is tainted by wrongdoing even when doing the right thing. But this is a category confusion between **moral luck** and **moral obligation**. I can regret the necessity of my action without believing the action was forbidden ATC. Residue proves the *tragedy of the situation*, not the *inconsistency of the moral law*.

  #### 3. Donagan's Rationality Constraint
  Finally, we must address the source of the conflict. Alan Donagan argues that a rational moral system, like a rational legal code, cannot issue contradictory commands. If morality is grounded in reason (as Kant and Donagan hold), it cannot command $A$ and forbid $A$ in the same respect at the same time.

  The "hard cases" (Agamemnon, Sartre's student) are not evidence that moral theory generates contradictions. They are evidence that **agents operate in corrupted contexts.**

  *   **The Upstream Error:** Agamemnon is not in a dilemma because the moral law is broken. He is in a bind because of prior events (the war, the vow to Artemis, the winds at Aulis). As Donagan suggests, genuine dilemmas often arise from prior wrongdoing or tragic circumstances that are external to the moral code itself.
  *   **Theory vs. World:** A moral theory tells you what you ought to do *given the circumstances*. It does not guarantee that the circumstances will be clean. If the world forces a choice between two terrible evils, the moral theory still functions: it identifies the *lesser* evil as the ATC duty.
  *   **The Implication:** If we accept strong dilemmas, we admit that morality itself is irrational—that it can demand the impossible. If we reject strong dilemmas, we maintain that morality is rational, but the world is often tragic.

  The student's intuition is that the "clean way out" doesn't exist. That is true of the *situation*, not the *obligation*. There is no clean *emotional* way out (hence residue), and no clean *consequential* way out (someone suffers). But there is always a clean *deliberative* way out: one course of action is morally required, and the other is morally forbidden, however painful that prohibition is to accept.

  #### Conclusion for the Seminar
  To accept strong moral dilemmas is to prioritize the agent's emotional aftermath over the logical structure of obligation. It requires us to:
  1.  Abandon Agglomeration (breaking deontic logic).
  2.  Violate "Ought Implies Can" (making morality demand the impossible).
  3.  Conflate *prima facie* costs with ATC obligations (misinterpreting residue).
  4.  Blame the moral law for the tragedies of the world (ignoring Donagan's upstream constraint).

  The better view is that morality is consistent. It always tells us what to do. The tragedy is not that morality fails to guide us, but that following its guidance sometimes requires us to break something we love. That is a fact about the human condition, not a flaw in normative ethics.
