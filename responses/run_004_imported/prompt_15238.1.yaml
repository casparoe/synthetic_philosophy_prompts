          *   Agamemnon is in this spot because of prior events (war, vows to Artemis, etc.).
          *   *Crucial Distinction:* A moral theory describes what agents ought to do *given* circumstances. It doesn't guarantee circumstances will be nice.
          *   The existence of tragic choices shows the world is messy, not that morality is inconsistent.
          *   If we say dilemmas are real, we admit morality is irrational. If we say situations are tragic but morality is consistent, we save the rationality of ethics.

