      *   *Nuance:* Hacking distinguishes between "indifferent kinds" (rocks) and "interactive kinds" (people). For interactive kinds, the classification *is* part of the reality.
      *   *Verdict:* It's not "manufactured" (as in fake) but it is "co-constituted." The language didn't create the neural divergence, but it created the *ADHD identity* and the specific way the symptoms are managed and understood.

