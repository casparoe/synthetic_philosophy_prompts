      *   *The Loop:* Classification $\rightarrow$ Awareness $\rightarrow$ Behavior Change/Self-Concept Change $\rightarrow$ Modification of the Classification itself over time.
      *   *Not Constructionism (strictly):* Hacking isn't saying the underlying biology/traits *don't exist*. He's saying the *experience* and *expression* of those traits are shaped by the label.
      *   *Key Nuance:* It's not "fake." It's "interactive." The label becomes a causal force in the person's life.

