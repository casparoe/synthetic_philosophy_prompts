      *   *Is "Moral Bribery" a real term?* Not really, it's colloquial. It implies corruption. I should reframe it as "Moral Trade" or "Value Arbitrage."
      *   *Key Insight:* The user feels bad when meat is cooked *in the apartment*. The GF eating meat outside might still bother him? No, the deal says she goes vegetarian M-F. That reduces demand.
