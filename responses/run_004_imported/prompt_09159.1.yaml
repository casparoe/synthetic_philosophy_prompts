      *   *Do philosophers know about AAT?* Yes, absolutely. It's widely discussed in formal epistemology.
      *   *Why isn't it a "settled" matter?* The assumptions of AAT are incredibly strong and often unrealistic in the contexts where peer disagreement matters (politics, religion, science, everyday life).

  3.  **Identify Key Disconnects between AAT and Peer Disagreement:**
      *   **Common Priors:** AAT requires agents to start with the *exact same* prior probability distribution over the state space. In real life, people have different backgrounds, experiences, and cognitive frameworks.
