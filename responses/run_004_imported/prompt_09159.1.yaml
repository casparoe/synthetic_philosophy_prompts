      *   **Partitioning of Information:** AAT assumes a specific structure of information sets (partitions). Real human information gathering is messy.
      *   **Logical Omniscience/Bayesian Idealization:** AAT assumes perfect Bayesian rationality. Humans are bounded rational agents.
      *   **The "About What" Problem:** Peer disagreement often involves complex propositions where the "state space" isn't well-defined.

