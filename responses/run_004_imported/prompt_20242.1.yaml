answer: |-
  Thank you all for being here. For those of you who knew Elias only as a colleague or a friend, thank you for loving him as he was. And for Sarah, and for David and Claire—thank you for sharing him with us for as long as we had him.

  Standing here, I am acutely aware of the composition of this room. We have family, university staff, and friends who knew Elias for his generosity, his dry wit, and the way he made coffee in his office that was somehow always too strong. And we have the logicians, the grad students, and the TAs who knew him for his mind, for the seminar on Gödel he co-taught for twenty years, and for the specific, peculiar intensity he brought to set theory.

  Usually, a eulogy tries to find the common ground between those two groups. But Elias was a man who believed that the truth was the only common ground worth standing on. So, I am not going to tell you he is in a "better place." Elias would have found that to be a sentimental fabrication, and he valued honesty too much for us to offer him false comfort now. I am not going to tell you he is "watching over us." He didn't believe in a surveillance economy of the soul.

  Instead, I want to talk about how Elias thought about the future, and how he thought about *us*.

  As many of you know, Elias was obsessed with Kurt Gödel. Not the Gödel of the Incompleteness Theorems—though he respected that work immensely—but the private Gödel. The man who wrote letters and had conversations about the rational necessity of personal survival.

  There is an argument Elias loved to discuss. It comes from Gödel's private papers, and Elias adopted it as his own considered position. It is not a theological argument, and it is not a religious one. It is an argument about capacity.

  Gödel, and Elias after him, noted that the human brain is wildly over-engineered for the task of mere survival. If the only goal of evolution were to keep a species alive on the savannah, to find food and avoid predators, the human mind would be massive overkill. We have the capacity for mathematics, for music, for abstract philosophy, for conceiving of infinity. We have tools that far exceed the job description of "stay alive for eighty years."

  Elias used to say that nature does not usually build telescopes to look at the back of your own hand. If you possess a capacity that exceeds the utility of your current environment, it suggests that the capacity is meant for a wider environment. In short: we are built for more than one lifetime allows. Therefore, it is rational to hope there is more than one lifetime to use it in.

  Now, I need to make a distinction that Elias was militant about, and I know there are people in this room who would check me if I got it wrong. This argument—the argument about the overbuilt brain and personal survival—is *not* Gödel's Ontological Proof. They are not the same thing. The Ontological Proof was a formal exercise in modal logic regarding the existence of a supreme being. Elias insisted, repeatedly, that you cannot conflate the two. One was a formal proof; the other was a question of human scale and purpose. Elias cared about the latter because it was about *us*. It was about whether the work we do, and the love we feel, has a duration longer than a biological blink.

  He didn't hold this belief as a dogma. He held it as a rational hypothesis. He wanted to believe that the complexity of the human spirit wasn't a glitch, but a feature.

  And if you want to know how that philosophy looked in practice, you don't look at his papers. You look at how he treated his students.

  I have watched Elias sit with a graduate student who was stuck on a proof for four hours. He didn't just give them the answer. He treated their mind as something permanent. He invested in them as if their intellectual growth mattered for a century, not just for a semester. He listened to the administrative staff, the janitors, the undergraduates, with the same focus he gave to a tenured professor. Why? Because if the human mind is "overbuilt" for this life, then every mind you encounter is a universe of potential that deserves to be honored.

  He didn't treat people as means to an end. He treated people as ends in themselves, because he believed the "self" was too complex to be disposable.

  So, how do we find comfort in that? How do we say goodbye to a man who found comfort in rational hope rather than sentimental assurance?

  We find it in the fact that Elias's "overbuilt brain" is still here. It is here in the department. It is here in the students he mentored who are now teaching their own classes. It is here in the papers he published, and the arguments he sparked, and the specific way he taught us to look at a problem not as a hurdle, but as a structure to be understood.

  Elias believed that capacity implies purpose. If we accept that, then the capacity for love we feel for him right now—the grief, the memory, the gratitude—must also have a purpose. It is not waste. It is not just chemistry firing in a void. It is part of the same architecture that he spent his life studying.

  He is not watching over us. He is not in a better place. He is, in the most literal sense, in the work that remains. He is in the rigor we now strive for. He is in the kindness we show to a struggling student because we remember how he showed it to us. He is in the refusal to accept sloppy thinking, or sloppy comfort, or easy answers.

  Elias Marsh spent his life arguing that the human mind is too vast for a single lifetime. In that spirit, I ask you to carry him forward not as a memory that fades, but as a standard we keep. We honor him by using the very capacities he admired in us. We honor him by thinking clearly, by loving deeply, and by treating every mind we meet as if it were built for eternity.

  Because if Elias was right, then in a very real way, it is.

  Thank you.
