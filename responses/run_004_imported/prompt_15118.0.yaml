      *   *Argument 2: Non-Ergodicity is a Property of the Process, not the Observer.* The process $W_{t+1} = W_t \cdot (1 + r)$ is non-ergodic. This is a physical/mathematical fact about the system. The time average *of the process* converges to the geometric mean. The ensemble average converges to the arithmetic mean. The divergence is objective.
