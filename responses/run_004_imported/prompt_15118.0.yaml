answer: |-
  This is an exceptionally sharp objection. You have identified the "coordinate invariance" critique, which is the single most common and serious technical pushback against Ole Peters' ergodicity economics.

  The objection is: *Mathematically, if you claim we should maximize the time-average growth rate of variable $X$, I can define $Y = f(X)$ and argue we should maximize the time-average of $Y$. Since the optimal betting fraction changes depending on whether you maximize $X$ or $Y$, your choice of $X$ (wealth) is just as arbitrary as choosing a utility function $U(X)$ in Expected Utility Theory (EUT).*

  To steelman the ergodicity claim, we cannot rely on math alone, because the math is indeed invariant under transformation. We must rely on **physics, market structure, and evolutionary dynamics.**

  Here is the strongest possible argument for why **wealth ($W$)** is the privileged variable, and why the choice is not arbitrary.

  ### 1. The "Observable vs. Latent" Argument
  The first line of defense is epistemological. Peters argues that EUT makes a category error by treating **wealth** (an objective, measurable state of the world) and **utility** (a subjective, unobservable psychological state) as mathematically interchangeable inputs.

  *   **EUT:** Assumes the agent maximizes $E[U(W)]$. Since $W$ is observable but $U$ is not, any behavior can be rationalized post-hoc by reverse-engineering a $U$. This makes the theory unfalsifiable.
  *   **Ergodicity:** Assumes the agent maximizes the time-average growth rate of the **observable state variable** of the system.

  **Why Wealth is Privileged:**
  In a financial market, the "state" of the system is defined by capital allocation. Prices clear based on orders denominated in currency, not "utils." You cannot pay a margin call in utility. You cannot compound "square-root wealth." The mechanism of the market—the multiplicative process itself—operates strictly on $W$.

  If you choose to time-average $\sqrt{W}$, you are no longer describing the dynamics of the *market*; you are describing the dynamics of the market *filtered through a specific psychological lens*. Ergodicity economics claims to describe the **physics of the gamble**, not the **psychology of the gambler**.

  The steelman claim: *Wealth is the conserved quantity in the exchange.* Just as a physicist studying gas dynamics studies the time-average pressure (an observable), not the "utility of pressure" to the gas molecules, an economist studying capital dynamics should study the time-average of capital. To transform the variable before averaging is to smuggle subjective preference into an objective description of the system's dynamics.

  ### 2. The Absorbing Barrier (The Physics of Ruin)
  This is the most robust physical argument. In multiplicative dynamics, $W=0$ is an **absorbing state**. Once you hit it, the process stops. You cannot recover.

  *   **The Dynamics:** If $W_{t+1} = W_t \cdot (1 + r)$, and $r = -1$ is possible (or approached asymptotically), $W$ can hit zero.
  *   **The Transform Problem:** If you optimize for time-average growth of $\sqrt{W}$, you are effectively choosing a strategy that is *more* conservative than Kelly. You will survive, but you will grow slower. If you optimize for $W^2$, you are *less* conservative. You will likely hit the absorbing barrier ($W=0$) with probability 1 over an infinite horizon.

  **Why Wealth is Privileged:**
  The absorbing barrier exists at $W=0$, not at $\sqrt{W}=0$ or $\log(W) = -\infty$ (conceptually). The "cliff" is a property of the **wealth dynamics**, not the utility function.

  The Kelly criterion (maximizing time-average growth of $W$) is the **unique strategy** that maximizes growth rate *while strictly avoiding the absorbing barrier* in the long run (assuming no leverage beyond the Kelly point).
  *   If you bet less than Kelly (e.g., optimizing $\sqrt{W}$), you avoid ruin but sacrifice objective growth.
  *   If you bet more than Kelly, you invite ruin.

  The steelman claim: *Risk aversion is not a preference; it is a constraint imposed by the absorbing barrier.* The "log" behavior emerges because the geometric mean is the only average that respects the multiplicative nature of the process and the reality of the zero-bound. Choosing to time-average $\sqrt{W}$ is objectively sub-optimal because it implies voluntarily accepting a lower growth rate than the physics of the system allows without increasing risk of ruin.

  ### 3. The Evolutionary Dominance Argument (The Knockout Punch)
  This is the strongest argument against the "arbitrariness" charge. It moves from individual rationality to **market selection**.

  Imagine a market with many agents.
  *   **Group A** maximizes time-average growth of Wealth (Kelly).
  *   **Group B** maximizes time-average growth of $\sqrt{\text{Wealth}}$ (Fractional Kelly).
  *   **Group C** maximizes Ensemble Average Wealth (Naive EV).

  **The Dynamics of Competition:**
  1.  **Group C** will eventually go bankrupt. The ensemble average diverges from the time average; they overbet and hit the absorbing barrier. They are eliminated.
  2.  **Group B** will survive, but their wealth grows at a rate $g_B < g_A$.
  3.  **Group A** grows at the maximum possible sustainable rate $g_A$.

  Over time, the share of total market wealth held by Group A approaches 100%. Group B becomes economically irrelevant. They are not "ruined," but they are **dominated**.

  **Why Wealth is Privileged:**
  In a competitive environment, "rationality" is defined by survival and dominance. If your goal is to have influence, capital, or simply to exist as a significant market participant in the long run, you *must* maximize the time-average growth of wealth.

  If you choose to maximize $\sqrt{W}$, you are effectively choosing to lose the evolutionary race. You are choosing to be out-competed by agents who maximize $W$.

  The steelman claim: *The privilege of wealth comes from natural selection.* It doesn't matter if you *prefer* $\sqrt{W}$. If you act on that preference, agents who act on $W$ will take your capital. Therefore, for any agent who wishes to remain in the game, maximizing time-average wealth growth is **instrumentally rational**, regardless of their internal utility function. The market forces you to behave *as if* you have log-utility.

  ### 4. Direct Rebuttal to the "$\sqrt{W}$" Objection
  So, to answer your specific question: *Isn't choosing "raw wealth" just as arbitrary as choosing a utility function?*

  **The Ergodicity Answer:** No, because wealth is the **fuel**, while utility is the **engine design**.

  1.  **Objective vs. Subjective:** Wealth is the resource being transported through time. Utility is how much you enjoy the ride. You can have different preferences for the ride (utility), but the physics of the vehicle (the market) dictates how much fuel (wealth) you need to keep moving.
  2.  **The "Leaving Money on the Table" Argument:** If you maximize time-average $\sqrt{W}$, you are choosing a betting fraction smaller than Kelly. You are guaranteed to end up with less wealth than a Kelly bettor (asymptotically). Unless you derive utility from the *act of betting less*, you are objectively poorer. The ergodicity claim is that **maximizing wealth is the default rational goal**; if you want to maximize something else, you need to justify why you want to be poorer.
  3.  **Separation of Concerns:** EUT conflates the *dynamics of the bet* with the *preferences of the bettor*. Ergodicity separates them.
      *   **Step 1 (Dynamics):** What is the maximum sustainable growth rate of this asset? (Answer: Time-average growth of $W$, i.e., Geometric Mean).
      *   **Step 2 (Preferences):** Do I want to grow at the maximum rate, or do I want to smooth consumption?
      *   EUT smashes these together. Ergodicity says Step 1 is objective physics. Step 2 is subjective. But Step 1 dictates that if you deviate from Kelly, you are accepting lower growth.

  ### Summary of the Steelman
  The objection fails because it treats wealth as an abstract number rather than a **physical constraint in a competitive system.**

  1.  **Observability:** Wealth is the measurable state variable of the economy; utility is not. Science should model observables.
  2.  **Solvency:** The absorbing barrier is at $W=0$. The dynamics of avoiding ruin naturally select for log-like behavior (Kelly) without needing a utility function.
  3.  **Selection:** In a competitive market, agents who maximize time-average wealth growth asymptotically dominate those who maximize transforms of wealth. Therefore, "maximize time-average wealth" is the only strategy that is **evolutionarily stable.**

  The claim isn't that you *can't* have a utility function. The claim is that **the dynamics of the world force you to act as if you have log-utility regarding wealth accumulation if you want to survive and compete.** The "arbitrariness" is removed by the threat of extinction (bankruptcy) and domination (relative decline). Wealth is privileged because it is the only thing that keeps you in the game.
