answer: |-
  You have hit on a profound structural isomorphism that is often overlooked in introductory discussions but is central to David Lewis's broader metaphysical system. Your intuition is spot-on: **Yes, it is a fair parallel.** In fact, it is more than a parallel; it is the *same* modal machinery applied to two different problems.

  Lewis was a committed compatibilist regarding free will (see his paper "Are We Free to Break the Laws?"), and his 1976 time travel paper relies on a specific analysis of ability and modality that undergirds that compatibilism.

  Here is a breakdown of why the parallel holds, the technical concept that bridges them, and how you can weaponize this against your hard-determinist friend.

  ### 1. The Structural Isomorphism

  In "The Paradoxes of Time Travel," Lewis argues that contradictory statements about Tim's ability can both be true because the word "can" is context-sensitive. It depends on which facts are **held fixed**.

  *   **Sense 1 (Narrow):** Hold fixed Tim's gun, his aim, his hatred, and the immediate circumstances. **Result:** Tim *can* kill Grandfather.
  *   **Sense 2 (Wide):** Hold fixed the fact that Grandfather survived to father Tim's parent. **Result:** Tim *cannot* kill Grandfather.

  Lewis calls this relation **compossibility**. To say "Tim can do X" means "There is a possible world where Tim does X that is *compossible* with [Set of Facts F]." If F is small (local facts), the action is compossible. If F is large (includes the outcome of history), it is not.

  Now, look at the Free Will debate:

  *   **Sense 1 (Compatibilist):** Hold fixed the agent's psychology, desires, lack of coercion, and rational capacities. **Result:** I *could have done otherwise* (if I had wanted to).
  *   **Sense 2 (Hard Determinist):** Hold fixed the past state of the universe and the laws of nature. **Result:** I *could not have done otherwise*.

  The structure is identical. The Hard Determinist insists that the only "real" sense of "can" is Sense 2 (holding the past and laws fixed). The Compatibilist argues that Sense 1 is the relevant sense for agency and responsibility.

  ### 2. Implications for the Compatibilist Strategy

  If you accept Lewis's resolution to the Grandfather Paradox, it provides three powerful moves for a compatibilist facing the "You couldn't *really* have done otherwise" objection.

  #### A. Contextualism About "Can"
  The hard determinist argues that compatibilism is contradictory: "You say he could have done otherwise, but physics says he couldn't."
  Lewis's time travel argument shows this isn't a contradiction; it's **equivocation** (or rather, context-shifting).
  *   **Implication:** You can tell your friend: "We are both telling the truth. You are speaking relative to the context of cosmological history. I am speaking relative to the context of agential capacity. Neither context is 'false,' but only one is relevant to moral responsibility."
  *   Just as it would be silly to say Tim lacks the *skill* to shoot because history says he missed, it is silly to say you lack the *capacity* to choose because physics says you were determined.

  #### B. The "Relevance" of Fixed Facts
  In the time travel case, why do we agree Tim "can" shoot in the local sense? Because the fact that "Grandfather survived" is not a constraint on Tim's *ability*; it is a constraint on the *outcome*.
  *   **Implication:** The compatibilist should argue that the Past and Laws of Nature are external constraints, not internal incapacities.
  *   If a gunman forces you to hand over your wallet, you "cannot" keep it (external coercion). If determinism "forces" your hand via the Big Bang, the compatibilist argues this is not coercion relevant to *your* psychology.
  *   Lewis's move implies that holding the entire past fixed is **changing the subject** from "What can the agent do?" to "What is consistent with the history of the universe?" The latter is a question for cosmologists, not ethicists.

  #### C. Deflating the "Really"
  The hard determinist leans heavily on the word "really." ("You couldn't *really* have done otherwise.")
  Lewis shows that "really" just means "relative to the maximal set of facts."
  *   **Implication:** Just because a claim is true relative to the maximal set of facts doesn't make it the *only* truth that matters.
  *   In the time travel paper, Lewis notes that if we hold fixed *everything* (including the future), Tim can do nothing. He is a fatalist relative to the block universe. But we don't treat Tim as a passive object; we treat him as an agent.
  *   Similarly, holding the past/laws fixed renders *everything* inevitable. If "could have done otherwise" requires that the past/laws *not* be held fixed, then "could have done otherwise" is impossible for *anyone*, even in an indeterministic universe (since the past is still fixed). Therefore, that definition of "could" is useless for distinguishing free agents from rocks.

  ### 3. A Warning: The "Soft Determinist" Trap

  There is one nuance you must be careful with when using this against a hard determinist. Lewis's view relies on his **Humean conception of laws**.

  For Lewis, laws of nature are not prescriptive iron rules that govern the universe; they are merely the best systematic summary of patterns in the Humean mosaic (the sum total of events).
  *   **The Risk:** A hard determinist who views laws as **necessitarian** (governing forces that *make* things happen) might reject the analogy. They might argue: "In the time travel case, Grandfather's survival is just a brute fact. But in free will, the Laws of Nature are *causal powers* that compel the outcome."
  *   **The Counter:** You can argue that even if laws are necessitarian, the distinction between *local ability* and *global consistency* remains. Even if a law compels me to drink coffee, my *thirst* and *hand movement* are the local mechanisms. To say I "can't" drink coffee because of the law is to ignore the local mechanism of agency, just as saying Tim "can't" shoot because Grandfather lived ignores the local mechanism of the gun.

  ### 4. How to Frame the Argument to Your Friend

  Here is a suggested script based on Lewis's logic:

  > "You're arguing that because the past and laws are fixed, I lack the ability to choose otherwise. But David Lewis showed us in his time travel paper that 'ability' is always relative to which facts we hold fixed.
  >
  > If we hold fixed the fact that my Grandfather survived, Tim the time-traveler 'cannot' kill him. But we don't say Tim is paralyzed or lacks gun skills. We just mean the killing is incompossible with history.
  >
  > When you say I 'can't' choose otherwise, you are holding fixed the entire history of the universe. Of course nothing is compossible with that! But moral responsibility isn't about compatibility with the Big Bang; it's about compatibility with my psychology and my environment.
  >
  > If you insist that the only 'real' can is 'compossible with the past and laws,' then you aren't just denying free will; you're denying that Tim has the ability to shoot his gun. You're conflating **agential capacity** with **historical inevitability**. Lewis showed those are two different questions."

  ### Summary
  Your reading is excellent. Lewis's 1976 paper is essentially a masterclass in **modal contextualism**. The implication for compatibilism is that the Incompatibilist is not proving that we lack freedom; they are proving that we lack *miraculous* freedom (the ability to break the past/laws). But since moral responsibility never required miraculous freedom (just as Tim's agency doesn't require the ability to change the past), the Incompatibilist objection fails to land.

  You aren't just making an analogy; you are pointing out that your friend is committing a category error regarding the word "can."
