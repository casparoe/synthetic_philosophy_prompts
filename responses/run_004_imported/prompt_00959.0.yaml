answer: |-
  **Chapter 4: The Personalist Common Prior: Reconciling Savagean Subjectivism with Aumann's Correlated Equilibrium**

  **4.1 Introduction**

  The epistemic program in game theory seeks to derive solution concepts from assumptions about knowledge, belief, and rationality. Central to this program is Robert Aumann's derivation of the Correlated Equilibrium (CE) from Bayesian rationality and the Common Prior Assumption (CPA). In Aumann's framework, players are modeled as maximizing expected utility relative to a posterior belief derived from a common prior distribution defined over the state space. Crucially, this state space includes the profile of actions chosen by all players, including the agent's own future action.

  This formulation has attracted significant philosophical scrutiny, most notably from Faruk Gul. Gul objects that the "prior view" required by Aumann is doubly problematic. First, he argues it is psychologically implausible to posit a stage where an agent holds a probabilistic belief over their own future voluntary choice. Second, and more fundamentally, Gul contends that the CPA is antithetical to the Savage-style subjectivism upon which Bayesian game theory ostensibly rests. Leonard Savage's personalist conception of probability emphasizes that probabilities are degrees of belief contingent on the individual; Savage explicitly denied that rationality alone mandates that equally informed agents must converge on identical probabilities.

  This chapter argues that Gul's critique rests on a conflation of psychological description with normative modeling, and a restrictive reading of Savage's subjectivism. I contend that the "prior view" of the common prior is fully consistent with a sophisticated Savagean personalism, even when priors range over a player's own actions. By reinterpreting the common prior not as a historical psychological event but as a logical expression of shared rationality and structural common knowledge, we can preserve the epistemic foundations of correlated equilibrium without abandoning the subjectivist core of Bayesian decision theory.

  **4.2 Savagean Subjectivism and the Scope of Disagreement**

  To evaluate Gul's objection, we must first clarify the Savagean framework. In *The Foundations of Statistics* (1954), Savage establishes that probability is a measure of personal belief, constrained only by the axioms of coherence (consistency). If an agent's beliefs satisfy these axioms, they are rational. Crucially, Savage does not include an axiom of "intersubjective agreement." Two agents with identical information may, under strict Savagean rules, hold different priors without either being irrational.

  Gul leverages this to argue that imposing a Common Prior is an external constraint that violates the spirit of personalism. If probability is personal, why must Player 1's probability for Player 2's action (or indeed Player 1's own action) be derived from the *same* function as Player 2's?

  However, this reading overlooks the distinction between *permissibility* and *requirement* within the Savagean system. Savage's framework establishes the *conditions* for rationality (coherence), but it does not preclude the possibility that rational agents *might* agree. The CPA is not a contradiction of Savage's axioms; rather, it is an additional structural axiom introduced specifically for interactive decision theory.

  To argue that CPA violates Savageanism because Savage didn't mandate it is to commit a modal fallacy. Savage showed that coherence does not *force* agreement; he did not show that coherence *forbids* it. In the context of game theory, the CPA is best understood as a normative idealization of "common rationality." If we assume that rationality consists in processing information according to the laws of probability, and if we assume that the rules of the game and the nature of rationality are Common Knowledge (CK), then it follows that the *method* of forming priors should be common. The CPA formalizes the Harsanyi Doctrine: differences in posterior beliefs must be traced to differences in information, not to differences in reasoning machinery. This is a refinement of Savage for interactive contexts, not a betrayal of it.

  **4.3 The Ontology of the "Prior Stage"**

  Gul's second, perhaps more potent, objection concerns the ontology of the prior. Aumann's derivation requires a "prior stage" $t_0$ before players receive private signals. At $t_0$, players share a probability distribution over the state space $\Omega$, which includes the actions players will eventually take at $t_1$. Gul argues this is psychologically implausible: how can an agent have a definite probability over their own free choice before they have deliberated?

  This objection conflates the *temporal* interpretation of the model with its *logical* structure. In epistemic game theory, the "prior stage" need not be interpreted as a literal moment in time where agents sit in a vacuum and assign numbers to future moves. Rather, the prior represents the *ex-ante* perspective of the modeler and the agents regarding the structure of the situation.

  From a Savagean perspective, an "act" is a function from states to consequences. For the agent to deliberate rationally, they must treat the states of the world as uncertain. In a strategic setting, the "state of the world" includes the actions of others. But does it include one's own action?

  Here, we must distinguish between the *executive* self and the *deliberative* self. When I deliberate, I am uncertain about what I will do until I resolve my choice. From the perspective of the deliberative process, my own action is a variable to be solved for, not a fixed constant. To model this deliberation using expected utility theory, the agent must effectively treat their own action as a random variable conditional on their information and rationality constraints.

  The "prior" over one's own action is not a belief that "I am fated to do X." It is a belief that "Given my utility function, my rationality, and the information I currently possess, there is a probability distribution over the action I will find optimal." This is entirely consistent with Savage. Savage's framework requires the agent to assign probabilities to states. If we define the state space to include the resolution of strategic uncertainty (which includes one's own choice in equilibrium), then assigning probabilities to these states is a requirement of the model, not a psychological impossibility.

  Furthermore, the "prior stage" is logically prior, not necessarily temporally prior. It represents the shared understanding of the game structure before the "noise" of private signals is introduced. It is the probabilistic representation of Common Knowledge of Rationality (CKR). If we accept that rationality is universal and known to be universal, the *ex-ante* assessment of the game must be identical for all players. To deny the CPA is to imply that Player 1 thinks Player 2 reasons about probability differently than Player 1 does, which violates the common knowledge of rationality.

  **4.4 Uncertainty Over Own Actions and Personalism**

  Gul argues that positing a prior over one's own action undermines the agency central to subjectivism. If I have a prior probability that I will play *Up*, am I not admitting that my choice is outside my control?

  This concern dissolves when we recognize the difference between *causal* uncertainty and *epistemic* uncertainty. In a correlated equilibrium, the correlation device sends a signal. The player's strategy is a function mapping signals to actions. Before the signal is received, the action is uncertain. Even after the signal is received, if we model the player from the *ex-ante* perspective (the perspective required to check for incentive compatibility), the action is treated as a random variable.

  Savage's personalism allows an agent to be uncertain about their own future behavior if that behavior depends on information they do not yet possess. In a game, my optimal action depends on your action. Your action depends on your signal. I do not know your signal. Therefore, I am uncertain of your action. But since my action is a best response to my belief about your action, and my belief depends on my signal (which is correlated with yours), there is a chain of dependency that makes my own action uncertain from the *ex-ante* viewpoint.

  Crucially, this does not violate free will or agency. It merely acknowledges that from the standpoint of the *model* checking for equilibrium, the action is an outcome of a function (the strategy) applied to a random variable (the signal). The Common Prior assigns probabilities to the signals and the resulting strategy profiles.

  Moreover, Savage's personalism is compatible with the idea that rational agents should not "agree to disagree" (Aumann, 1976). If agents start with different priors over the same state space, and this difference is common knowledge, they are effectively betting against each other on the nature of reality without informational cause. In a game theoretic context, where the "reality" is the structure of the game itself, divergent priors imply divergent understandings of the game's rules or the rationality of the opponents. By positing a Common Prior, we are not stripping agents of personal belief; we are asserting that their *personal* beliefs about the structure of the world are identical because their *evidence* regarding that structure (the rules of the game) is identical.

  **4.5 Reinterpreting the Common Prior as a Normative Ideal**

  To defend the epistemic foundations of correlated equilibrium against Gul's critique, we must reframe the CPA. It should not be viewed as an empirical claim about how humans actually form beliefs (where Gul's psychological objection holds weight). Instead, it must be viewed as a normative condition of *consistent rationality* in interactive settings.

  Savage's subjectivism provides the *syntax* of rational belief (coherence). The CPA provides the *semantics* of interaction (shared reality). When we derive Correlated Equilibrium, we are asking: "What behavior is consistent with Bayesian rationality if all agents share the same understanding of the world?"

  If we reject the CPA on Savagean grounds, we retreat to a solipsistic game theory where no prediction is possible because any behavior can be rationalized by positing a sufficiently idiosyncratic prior. This renders the epistemic program vacuous. To make the program substantive, we must assume that the "personal" in personalism refers to the conditioning on private information, not the fundamental structure of probability assessment itself.

  Therefore, the "prior view" is consistent with Savage if we interpret Savage's axioms as the *minimum* requirements for rationality, while acknowledging that in a community of rational agents (a game), *maximum* consistency (CPA) is the appropriate normative standard. The prior over one's own action is simply the agent's *ex-ante* recognition of their own strategic function. It is the agent saying, "Before I see my signal, I acknowledge that my future self will act according to a distribution determined by the signal." This is not a denial of agency; it is a recognition of the stochastic nature of information acquisition.

  **4.6 Conclusion**

  Faruk Gul's objection highlights the tension between the individualism of Savage's decision theory and the intersubjectivity required for game-theoretic equilibrium. However, this tension is resolvable. The Common Prior Assumption does not violate Savagean subjectivism; it extends it to multi-agent environments by formalizing the Common Knowledge of Rationality.

  The "prior stage" is not a psychological bottleneck but a logical necessity for defining consistency across agents. Uncertainty over one's own action is not a denial of free will but an acknowledgment of the epistemic limits of the deliberative self regarding the informational inputs that will determine the choice. By reading the CPA as a normative idealization of shared rationality rather than a psychological description, we preserve the Savagean commitment to belief-based probability while securing the epistemic foundations of Aumann's Correlated Equilibrium. The common prior is not an imposition on the personal; it is the harmonization of the personal across the shared world of the game.
