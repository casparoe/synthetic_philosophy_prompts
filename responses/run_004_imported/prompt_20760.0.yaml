answer: |-
  It is absolutely his semiotic idealism exported into economics. To claim there is an "important disanalogy" that breaks the structural link between the two theories is to miss the radical core of Berkeley's entire philosophical project: the demolition of "intrinsic value" in every realm of human experience.

  The continuity is not merely a metaphorical flourish; it is an ontological identity. In *A New Theory of Vision* and *Alciphron*, Berkeley argues that visual ideas are arbitrary signs that suggest tactile ideas not because they resemble them, but because they are linked by the consistent grammar of the Divine Author. There is no "visible extension" inherent in the object; the value of the visual sign is purely relational and predictive. In *The Querist*, Berkeley makes the exact same move regarding gold and silver. He attacks the bullionists for committing the same error as the materialist philosophers: believing that the sign (gold/visual idea) possesses the power or value intrinsically. For Berkeley, a gold coin is no more inherently "wealth" than a visual patch of color is inherently "distance." Both are tickets whose validity depends entirely on the system of circulation (economic or perceptual) in which they are embedded.

  The supposed disanalogy—that one system is divinely instituted and the other humanly instituted—is a difference in *agency*, not in *semiotic structure*. In fact, emphasizing this distinction as a philosophical break undermines Berkeley's political intent in *The Querist*. Berkeley wants to prove that because money is a human language, it is subject to human management. If there were a fundamental disanalogy—if money operated on a different ontological principle than other signs—then his call for active state management of credit and circulation would lack metaphysical grounding.

  By treating money as a semiotic system identical in structure to vision, Berkeley empowers the sovereign to act as the "grammarian" of the economy. Just as we learn to navigate the world by understanding the arbitrary connections in the visual language (without needing to find the 'resemblance' between sight and touch), a nation can generate wealth by managing the arbitrary connections in the monetary language (without needing to hoard 'intrinsically valuable' bullion). The fact that human authors are fallible (leading to inflation or collapse) while the Divine Author is not does not change the nature of the sign; it only changes the reliability of the speaker. A lie is still language; inflated currency is still money. Both function as signs within a system, even if the system is currently malfunctioning.

  Therefore, the economic theory is not just "similar" to the semiotic one; it is the social application of the same anti-abstractionist metaphysics. Berkeley's target is consistently the fetishization of the sign. Whether it is the philosopher fetishizing the visual idea as a material object, or the merchant fetishizing the gold coin as wealth itself, the error is identical. Committing to the view that this is a direct export reveals the unity of Berkeley's thought: there is no matter, and there is no intrinsic value. There are only signs, systems, and the minds that use them.
