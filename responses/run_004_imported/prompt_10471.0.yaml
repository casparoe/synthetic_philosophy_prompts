      *   *The "Ulysses" Problem:* The whole point of a Ulysses clause is to bind the future self when capacity is compromised. If we only honor it when the patient agrees *now*, it's useless. But if we honor it when the patient is *lucid* and *not dangerous*, we risk violating current rights based on a past document.
