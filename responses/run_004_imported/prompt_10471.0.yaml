answer: |-
  **TO:** Psychiatric Ethics Committee
  **FROM:** [Your Name], Ethics Fellow
  **DATE:** October 26, 2023
  **RE:** Recommendation Regarding Ms. T and Enforcement of Psychiatric Advance Directive

  **Recommendation**
  I recommend the committee advise the clinical team to **honor the Ulysses clause in Ms. T's Psychiatric Advance Directive (PAD) immediately**, authorizing involuntary hospitalization and medication as pre-specified. This intervention should be time-limited to **72 hours**, after which a formal reassessment of decision-making capacity and clinical status must occur. If Ms. T stabilizes and regains capacity within this window, her contemporaneous wishes must then resume primacy.

  **Rationale**
  The ethical force of a Ulysses clause lies in its recognition that certain pathologies, particularly Bipolar I, systematically erode the insight required to exercise autonomy *during* a crisis. Ms. T's directive was not signed in a vacuum; it was a deliberate act of precedent autonomy designed to bridge the gap between the onset of prodromal symptoms and the legal threshold of "imminent danger." To wait for imminent danger is to render the PAD redundant, as state civil commitment statutes already cover that scenario. By signing the clause, Ms. T effectively determined that her "well self" is better positioned to define her best interests than her "manic self." Honoring this preserves the integrity of the tool for all patients who rely on it to prevent the severe harm of untreated mania.

  **Engagement with the Opposing View**
  I take seriously the committee's concern that overriding a lucid, arguing patient violates the sanctity of current autonomy. The argument that "no signature should outweigh a present, coherent objection" rests on the view that the person before us is the only moral agent that matters. There is truth here: we risk paternalism if we assume incapacity solely based on a diagnosis.

  However, the analogy that a patient is not a "polity" misses the temporal reality of bipolar disorder. In this condition, the "current self" is not merely a dissenting voter; it is often a self compromised by the very pathology the directive anticipates. Ms. T's assertion that she "feels fine" despite exhibiting her own listed warning signs suggests anosognosia (lack of insight), a hallmark of mania. To prioritize her current refusal is to prioritize the symptoms of the illness over the values of the person. While we must never treat a patient as a mere means, respecting her prior competent authorization is, in this specific context, the only way to respect her *enduring* autonomy.

  **Conditions for a Different Decision in Future Cases**
  While I recommend enforcing the PAD here, future committees should decline to honor a Ulysses clause if:
  1.  **Ambiguity of Signs:** The patient's presentation does not match the specific, objective criteria listed in the PAD (e.g., the PAD cites "sleeping <4 hours," but the patient is sleeping 6).
  2.  **Demonstrated Capacity Regarding Risks:** The patient demonstrates the ability to articulate not just their desire to leave, but the *specific risks* of leaving (e.g., "I know I might get manic, but I am willing to accept that risk to attend X event"), suggesting the refusal is a values-based choice rather than a symptom-driven compulsion.
  3.  **Evidence of Coercion:** There is any indication the PAD was signed under duress or without adequate understanding of its implications at the time of execution.

  In Ms. T's case, the match between her current signs and the PAD is exact, and her refusal appears symptomatic. We should act now to protect the person she was when she signed, trusting that she will thank us when the mania recedes.
