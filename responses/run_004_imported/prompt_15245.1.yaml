answer: |-
  You are not just dressing up mundane friction in fancy clothes. While the stakes are indeed low (it is, as your colleagues noted, just dinner), your intuition is tracking a real and robust distinction in social ontology. You have identified a violation of **joint commitment**, and your annoyance is the normative residue of that violation.

  Here is the outside perspective you asked for, broken down into the philosophical principle and the pragmatic proportion.

  ### 1. The Principled Distinction: Withdrawal vs. Dissolution

  Your intuition that there is a difference between (a) and (b) is supported by the work of philosophers like Margaret Gilbert on **plural subjects** and **joint commitment**.

  When you and your housemate made this agreement, you didn't just create two parallel personal commitments ("I promise to cook" + "She promises to cook"). You created a **joint commitment**. You became a "plural subject" regarding Sunday dinner. This creates a specific normative structure:

  *   **Case A (Unilateral Withdrawal):** "I can no longer participate in this joint activity."
      *   This is always within an individual's agency. No one can be forced to cook. However, in a joint commitment, unilateral withdrawal usually requires a reason or an apology because it lets down the other party who is relying on the *jointness*.
  *   **Case B (Unilateral Dissolution):** "This activity no longer exists for either of us."
      *   This is where your housemate overstepped. By saying "you don't have to either though," she assumed the authority to dissolve the *structure* of the agreement, not just her *participation* in it.

  **Why this matters:**
  In a joint commitment, the right to terminate the commitment generally belongs to the *plural subject* (the "We"), not the individual units. She had the right to remove her pillar from the temple, but she did not have the right to declare the temple demolished for everyone.

  By framing it as "you don't have to either," she implicitly claimed a veto power over your continued investment in the tradition. She treated the agreement as a favor she was granting you, rather than a shared structure you built together. That is a category error regarding the nature of your relationship.

  ### 2. Why You Feel Wronged (Not Just Disappointed)

  Disappointment is about the loss of the *outcome* (no more yummy dinner). Feeling wronged is about the violation of the *process*.

  You feel wronged because she bypassed the **negotiation of dissolution**.
  *   **Respectful Dissolution:** "I can't do this anymore. I know we planned this together, so I wanted to check in before assuming you'd want to cancel entirely. Do you want to keep doing Sundays on your own, or find someone else?"
  *   **Actual Dissolution:** "I'm out. You're free too."

  The latter treats your agency as derivative of hers. It suggests that the value of the dinner was contingent on *her* participation, rendering your desire to continue irrelevant. It's a subtle form of epistemic injustice: she presumed to know what was best for your Sunday night without consulting you.

  ### 3. The Proportionality Check (The "Grad Student Brain" Warning)

  So, is there a principled distinction? **Yes.**
  Does it justify a feud? **No.**

  Here is where you need to apply the "sense of proportion" you feel you've lost.

  1.  **The Stakes are Low:** In the grand scheme of moral wrongs, unauthorized dissolution of a dinner pact is a misdemeanor. It doesn't indicate malice; it likely indicates social awkwardness or a desire to avoid a heavy conversation. She probably thought "you don't have to either" was being *considerate* (releasing you from obligation), not authoritarian.
  2.  **The Cost of Enforcement:** To "win" this philosophical point would require a conversation that costs more social capital than the dinner was worth. "Actually, housemate, while you can withdraw your labor, you lack the standing to dissolve the plural subject..." is a conversation that ends friendships over lentils.
  3.  **The Informal Contract:** You noted this was "no formal arrangement." Informal social contracts rely on goodwill. When goodwill evaporates (or she just gets busy), the contract is fragile. Insisting on the *ontology* of the agreement when the *spirit* of the agreement has faded is a classic academic trap.

  ### The Verdict

  You are not unhinged. You have correctly identified a violation of **collective intentionality**. Your housemate treated a joint commitment as an aggregate of individual preferences, and she usurped the authority to speak for the "We."

  However, you are also a philosophy PhD student who has correctly identified that **being right about the principle does not always mean the reaction fits the context.**

  **My advice:**
  Accept that you were philosophically wronged but pragmatically fine. You can hold the truth of the distinction in your head (validating your annoyance) without needing to litigate it with her (preserving the peace). The feeling of being wronged is real, but it's a signal to adjust your expectations of the housemate, not a call to arms.

  Enjoy your solo Sunday dinners. You have the standing to keep the tradition alive, even if the plural subject has retired.
