      *   *So:* Elena's claim that it "collapses into ordinary expected-value reasoning" is only true if "ordinary" implies FDT/EDT. If "ordinary" implies CDT, ECL is distinct. But her point about Moral Uncertainty is slightly different.
      *   *Moral Uncertainty angle:* If I'm uncertain whether *my* values or *your* values are the "True" values, I hedge. If I know my values are "True" (for me) but acknowledge you exist with different values, ECL allows trade.
      *   *Synthesis:* ECL is distinct from Moral Uncertainty. But ECL *does* collapse into standard FDT maximization *if* you accept the non-indexical utility function. Elena's worry is that accepting the utility function is the hard part, making the DT machinery secondary.

  5.  **Refining the Adjudication:**

      *   *Move 1:* Marcus. It is a DT claim.
