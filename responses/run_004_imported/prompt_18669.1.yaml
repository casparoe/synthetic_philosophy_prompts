          *   *Verdict:* This leads to the final conclusion.

  3.  **Drafting the Adjudication (Move by Move):**

      *   *Move 1:* Marcus is right on the internal logic. It *is* a DT claim (FDT/EDT). Elena hasn't attacked the DT yet.
