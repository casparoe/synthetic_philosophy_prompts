      *   *Key Insight:* ECL provides a *multiplier* effect that simple hedging doesn't. Hedging says "support X because X might be good." ECL says "support X because supporting X makes it more likely X-supporters support *my* values."
      *   *However:* If I already have a non-indexical utility function that includes "satisfaction of rational agents' goals across the multiverse," then ECL is just maximizing that function.
      *   *Refinement:* The distinction lies in *why* I help.
          *   Hedging: I help because I might be wrong about my values.
          *   ECL: I help because I am right about my values, but cooperation yields higher utility via correlation.
      *   *Conclusion:* They are distinct mechanisms. Hedging relies on epistemic uncertainty about value. ECL relies on logical correlation between agents with *different* known values. However, ECL *requires* the non-indexical utility function to get off the ground. Without that, ECL yields 0 utility for an indexical agent. So Elena is right that the utility function is the bottleneck, but Marcus is right that the decision theory provides the *mechanism* for gains that simple maximization wouldn't capture in a CDT framework.
