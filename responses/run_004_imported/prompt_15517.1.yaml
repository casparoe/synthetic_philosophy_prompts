answer: |-
  This is a profound question that sits exactly at the intersection of your technical training and lived ethical experience. In behavioral economics, we treat "impure altruism" (Andreoni, 1989) as a parameter to improve predictive power. In moral philosophy and family dynamics, we treat it as a potential stain on character.

  Your housemates are reenacting a classic debate between **Deontology** (motives determine moral worth) and **Consequentialism** (outcomes determine moral worth). Both fail here because they treat motivation as a static snapshot rather than a dynamic system.

  To move beyond "it's complicated," I suggest a framework drawn from **Care Ethics** and **Motivational Ecology**. This approach evaluates motives not by their *purity*, but by their *function* within the sustainability of the care relationship.

  Here is a more precise way to articulate this.

  ### 1. The Myth of Purity (Critiquing Housemate 1)
  Your first housemate is operating under a Kantian intuition: an action only has moral worth if done from duty, untainted by inclination or self-interest. The problem, as you know from your own field, is that **psychological purity is empirically rare.**

  If we demand purity in caregiving, we create a "moral hazard of virtue." We risk praising the person who burns out after six months because their motives were "pure love," while criticizing the person who lasts four years because their motives were "love + guilt + inheritance."

  In behavioral terms, the "impure" motives (guilt avoidance, social signaling, financial expectation) are acting as **commitment devices**. Caregiving is a long-term game with high immediate costs and delayed benefits. "Pure love" is often volatile; it fluctuates with mood and fatigue. Guilt and social expectation are more stable constraints. They function like a contract that keeps the agent in the game when their emotional reserves are low. To dismiss these is to misunderstand the mechanics of long-term cooperation.

  ### 2. The Black Box Problem (Critiquing Housemate 2)
  Your second housemate argues that only the outcome matters. This is insufficient because in caregiving, **motives determine the quality and durability of the outcome.**

  If the aunt's primary motive were *only* the inheritance, we would worry about "moral hazard" in the other direction: is she keeping the mother-in-law alive *too* long, or is she neglecting emotional needs that don't impact the estate value? If her motive were *only* guilt, we would worry about resentful care—compliance without warmth, which is psychologically damaging for the recipient.

  The fact that she *also* cites genuine love and distrust of other relatives' competence is crucial. It suggests the self-interested motives are **scaffolding** the altruistic ones, not replacing them. The outcome (good care) is not independent of the motive; the motive is the engine that produces the outcome over time.

  ### 3. A Better Framework: Motivational Ecology
  Instead of asking "Are these motives pure?", ask "How do these motives interact ecologically?"

  You can distinguish between **Corrosive Motives** and **Scaffolding Motives**.

  *   **Corrosive Motives:** These undermine the care relationship. (e.g., "I am doing this only to hasten the inheritance," or "I am doing this only to prove my sibling wrong.") If these motives dominate, the quality of care becomes transactional and potentially abusive.
  *   **Scaffolding Motives:** These support the care relationship when primary altruism falters. (e.g., "I love her, but I also know I'd be ostracized if I quit," or "I love her, and yes, I hope this secures my financial future, which reduces my stress and makes me a better caregiver.")

  Your aunt's case appears to be a robust **hybrid equilibrium**.
  1.  **Love/Competence:** Provides the *quality* of care (attention, empathy).
  2.  **Guilt/Social Judgment:** Provides the *persistence* of care (prevents quitting during burnout).
  3.  **Inheritance:** Provides *risk mitigation* (compensates for career loss, reducing resentment).

  In your field, you might model this as a utility function where the self-interested terms act as constraints that prevent the altruistic term from dropping below a viability threshold.

  ### 4. The Transparency Factor
  You noted that motives are "not even fully transparent to the agent herself." This is key. Human beings often engage in **motivic rationalization**.

  If your aunt *only* admitted to the inheritance, she might feel like a mercenary, which could induce shame and reduce care quality. If she *only* admitted to the love, she might feel like a martyr, which leads to burnout. By acknowledging the mix (even unprompted), she demonstrates **integrative complexity**. She is not deceiving herself. This self-awareness is actually a protective factor against the corrosive potential of the self-interested motives. It allows her to monitor them.

  ### 5. How to Articulate This at Dinner
  Next time this comes up, you don't need to say "it's complicated." You can say something like this:

  > "I think we're making a category error. We're treating motives like ingredients in a recipe, where 'selfishness' spoils the batch. But in long-term caregiving, motives function more like a structural engineering team.
  >
  > 'Pure love' is great, but it's not structurally sound enough to hold up under four years of sleep deprivation. The guilt, the social pressure, and even the financial expectation? Those are the steel beams. They aren't as pretty as the love, but they keep the building from collapsing when the love gets tired.
  >
  > The moral question isn't whether the beams are there. It's whether they are corroding the structure. As long as my aunt is self-aware enough to keep the love in the driver's seat, and the self-interest just keeping her in the seat, the 'impurity' is actually what makes the care sustainable. We shouldn't praise the burnout; we should praise the sustainability."

  ### Summary for your Research
  For your own work, this reinforces that "warm glow" and "impure altruism" aren't just noise to be controlled for; they are often the **mechanism of stability**. In policy design (e.g., nudging charitable giving or caregiving support), assuming agents *should* be purely altruistic leads to fragile models. Designing for hybrid motives—acknowledging that people need social recognition, guilt avoidance, or tangible returns to sustain pro-social behavior—creates more robust interventions.

  Your aunt isn't a flawed moral agent; she is a successful long-term cooperators in a high-cost environment. Her "impure" motives are the price of her reliability.
