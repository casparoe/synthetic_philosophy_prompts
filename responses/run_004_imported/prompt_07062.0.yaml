prompt: |-
  Bit of background: I'm a software engineer, zero formal philosophy training, but I've got a friend doing a philosophy PhD who I see maybe twice a year, and last time we hung out she got me nerd-sniped on something. It started because I'd been reading about how the Stanford Prison Experiment is apparently nowhere near as clean as the version everyone learns in school -- coached guards, demand characteristics, the whole thing basically stage-managed (i think the piece that got me going was called something like "The Lifespan of a Lie"). Milgram has apparently taken similar hits once people went back through his actual archives and notes. My friend's point was that a big chunk of the situationist case against virtue ethics -- I hope I've got that term right -- leans really heavily on exactly those two studies: the idea being that traits like courage or honesty aren't really a thing, people are just reacting to whatever situational pressure they're under that day, so virtue ethics is chasing a fiction. So now I'm curious what's actually left standing once you take SPE and Milgram off the table.

  Could you write me a dialogue between a virtue ethicist and a situationist psychologist working through this? Give them some setup -- say they've co-taught a moral psychology seminar together for a decade and this is round umpteen of the same running argument, freshly reignited because a student in section brought up the SPE controversy that week. I want the situationist to concede SPE and Milgram right away, no hedging, and then pivot hard to the stuff that doesn't depend on either one -- the old Hartshorne-and-May cheating-in-children research, the Batson "good Samaritan" seminary-student study, that one about finding a dime in a phone booth making people way more likely to help a stranger, and the more statistical point that personality measures never seem to predict actual behavior above something like a 0.3 correlation, no matter what trait you're measuring. And then I want the virtue ethicist to have a genuinely strong comeback to that -- not "well your two famous studies turned out to be fake, so I win by default," but whatever the real, substantive argument is. They should actually engage with each other's specific points instead of just alternating monologues, both should be equally sharp, and I'd like to come away still honestly unsure who's got the better of it.
