answer: |-
  **Setting:** *Room 304, Philosophy Building. 5:45 PM. The seminar students have filtered out, leaving the smell of dry-erase markers and stale coffee. ELENA (Virtue Ethicist) is erasing the board. MARCUS (Social Psychologist) is packing his laptop into a battered messenger bag.*

  **Marcus:** Jason's a sharp kid. I'll give him that. Dropping "The Lifespan of a Lie" reference in the final ten minutes? That's a power move.

  **Elena:** He read the Bloomberg piece, didn't he?

  **Marcus:** Yeah. Zimbardo's coaching the guards, the demand characteristics... look, I'm not going to fight you on this. You know I'm not. SPE is toast. Milgram's archives are messy enough that the "agentic state" theory has some serious holes. If the situationist case rested *only* on the prison and the shock generator, I'd be grading papers in silence right now.

  **Elena:** *[Stops erasing, turns around]* But?

  **Marcus:** But you know it doesn't rest on them. That's the thing people miss. When the Situationist Challenge hit philosophy in the late 90s—Doris, Harman—they used SPE because it was pop-culture currency. But the actual empirical backbone is way older and way more robust.

  **Elena:** Hartshorne and May.

  **Marcus:** 1928. Character Education Inquiry. Eight thousand kids. They set up situations to cheat on tests, cheat on puzzles, lie to teachers, steal coins. If virtue ethics is right—if "honesty" is a stable character trait—you'd expect the kid who doesn't cheat on the math test to not cheat on the puzzle.

  **Elena:** And?

  **Marcus:** The correlations were tiny. Like, 0.2. A kid would be scrupulously honest in one context and cheat like a pirate in another. Honesty wasn't a thing they *had*; it was a thing they *did* in specific ecological niches. And it's not just kids. Darley and Batson, the Good Samaritan study. Seminary students. Guys training to be priests.

  **Elena:** I know the one. On their way to give a talk about the Good Samaritan.

  **Marcus:** Exactly. The variable that predicted whether they stopped to help a slumped, coughing man in an alleyway wasn't their religiosity, wasn't their score on a "helpfulness" inventory. It was whether they were told they were late. Sixty percent helped when they had time. Ten percent helped when they were in a rush. The content of their talk didn't matter. The situation swallowed the trait.

  **Elena:** *[Leans against the desk]* Marcus, we've been having this argument for ten years. You're treating character like a light switch. Either it's on, or it's off.

  **Marcus:** I'm treating it like a predictor variable. And the data says personality traits cap out at predicting behavior around a correlation of 0.3. Walter Mischel pointed this out in '68. It's the consistency ceiling. No matter what trait you measure—conscientiousness, agreeableness, courage—it never accounts for more than 9% of the variance in behavior. The rest? That's the situation. The noise. The dime in the phone booth.

  **Elena:** Isen and Levin. Finding a dime makes you more likely to help someone pick up dropped papers.

  **Marcus:** It's absurd when you say it out loud. A ten-cent coin outweighs a lifetime of moral socialization. If virtues are real, robust dispositions, why does a piece of metal toggle them?

  **Elena:** Because you're defining "robust" as "insensitive to context." And that's a straw man. No serious Aristotelian claims virtue is a reflex. It's not a knee-jerk reaction; it's a skill. *Phronesis*. Practical wisdom.

  **Marcus:** Okay, but skills show consistency. If I hire a carpenter, I expect them to drive a straight nail whether they're happy, sad, found a dime, or lost a dime. If their performance fluctuates that wildly based on irrelevant situational factors, I don't say "Ah, they have a complex skill." I say they're unreliable.

  **Elena:** But moral situations aren't driving nails. They're interpreting scenes. The virtue ethicist argues that the situationist is misdescribing the data. Take the seminary students. You say the situation "overrode" their virtue. I say the situation *changed the salience* of the moral demand. When you're late, your perceptual field narrows. You literally don't see the victim the same way.

  **Marcus:** That sounds like a rescue operation for the theory. "They didn't fail to be virtuous; they just perceived the situation differently because of the situation." It's unfalsifiable.

  **Elena:** Is it? Look at the 0.3 correlation. You present that like it's a failure. Marcus, in social science, 0.3 is *massive*. Human behavior is chaotic. If personality traits predicted 90% of behavior, we'd be robots. The fact that there is a statistically significant signal across contexts means the trait *exists*. It's just not the *only* thing that exists.

  **Marcus:** But virtue ethics makes a stronger claim than "traits exist." It claims traits are the *primary* explanatory unit of moral life. It says we praise and blame people because they are the authors of their actions via their character. If the situation is doing 90% of the heavy lifting, then praising the "virtuous" person is like praising a swimmer for moving fast when the current is doing the work.

  **Elena:** Here's where I think you're missing the normative point. We don't cultivate virtue to become immune to situations. We cultivate it to *manage* our sensitivity to them.

  **Marcus:** Explain.

  **Elena:** The dime study. Why does finding a dime make you helpful? Because it puts you in a positive affective state. It opens you up. Now, imagine a person with the virtue of Benevolence. Part of that virtue is the ability to access that openness *without* needing the dime. But the fact that the dime helps the average person doesn't prove the virtue is fake; it proves the virtue is a *developmental achievement*.

  **Marcus:** So you're retreating to "Ideal Virtue." Real people don't have it.

  **Elena:** Real carpenters don't drive perfect nails every time either. But we don't say carpentry is a fiction. We say mastery is rare. The Situationist Challenge works if you assume everyone is supposed to be a moral saint. If you view virtue as a skill that is partially acquired, then the inconsistencies Hartshorne and May found are just evidence that most people are moral novices.

  **Marcus:** That's a convenient move. But it creates a problem for your ethics. If virtue is this high-bar skill that almost no one has, then your ethical system applies to... who? Five people in history? Meanwhile, my job is to design systems that work for actual humans. If I want to increase organ donation rates, I don't pray for a population of virtuous citizens. I change the default option on the DMV form. Nudge theory works *because* situationism is true.

  **Elena:** I'm not arguing against nudges. I'm arguing against the metaphysical claim that character is a fiction. You're conflating "character is fragile" with "character doesn't exist."

  **Marcus:** I'm saying if it's that fragile, it's not doing the work you want it to do. You want character to be the anchor. The data says it's a weather vane.

  **Elena:** A weather vane still points north, Marcus. It just moves in the wind. The 0.3 correlation is the anchor. It's the part of me that returns the wallet even when I'm in a rush, even when I didn't find a dime. It's the part that resists the situation. The fact that it doesn't win *every* time doesn't mean it's not there. It just means the situation is loud.

  **Marcus:** But if the situation can be made loud enough—like in the prison experiment, fake as it was, or in real atrocities—character goes silent. And if character goes silent when things get hard, can we really call it "character"? Or is it just a fair-weather preference?

  **Elena:** *[Picks up her bag]* That's the question, isn't it? Is virtue the thing that holds when the pressure is on? Or is it the thing that helps you navigate the pressure so it doesn't get to that point?

  **Marcus:** *[Zips his bag]* If I can manipulate you with a dime, I don't care what you call the thing inside you. I care that I can manipulate it.

  **Elena:** And if I can train myself to notice the man in the alley even when I'm late, I don't care what your correlation coefficients say. I care that I stopped.

  **Marcus:** *[Pauses at the door]* Same time next week?

  **Elena:** Same time. But I'm bringing the data on longitudinal trait stability.

  **Marcus:** *[Smiles]* I'll bring the data on cross-situational variance.

  **Elena:** See you then, Marcus.

  **Marcus:** See you, Elena.

  *[Marcus exits. Elena turns off the lights. The room is dark, but the whiteboard still glows faintly with the residue of erased arguments.]*
