          *   Darley & Batson (1973): The Good Samaritan (seminary students).
          *   The Statistical Point: The 0.3 correlation ceiling (Mischel's critique).
      *   **The Counter (Virtue Ethicist Defense):** Elena needs to defend virtue ethics without denying the data.
