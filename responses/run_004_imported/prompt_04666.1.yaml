prompt: |-
  hey, so last night I fell down a Wikipedia rabbit hole instead of fixing a flaky test at work, and somehow ended up on the Stanford Encyclopedia of Philosophy (apparently that's the wikipedia for philosophy nerds) reading about the "argument from illusion" and this thing called disjunctivism thats supposed to be a response to it. I sort of get the broad strokes, but then i found people tracing the argument back to this Hume passage and i honestly can't parse what he's doing here:

  "It seems also evident, that, when men follow this blind and powerful instinct of nature, they always suppose the very images, presented by the senses, to be the external objects, and never entertain any suspicion, that the one are nothing but representations of the other. This very table, which we see white, and which we feel hard, is believed to exist, independent of our perception, and to be something external to our mind, which perceives it. Our presence bestows not being on it: Our absence does not annihilate it. It preserves its existence uniform and entire, independent of the situation of intelligent beings, who perceive or contemplate it.

  But this universal and primary opinion of all men is soon destroyed by the slightest philosophy, which teaches us, that nothing can ever be present to the mind but an image or perception, and that the senses are only the inlets, through which these images are conveyed, without being able to produce any immediate intercourse between the mind and the object. The table, which we see, seems to diminish, as we remove farther from it: But the real table, which exists independent of us, suffers no alteration: It was, therefore, nothing but its image, which was present to the mind."

  (that's from the Enquiry, section 12, if it matters)

  Can you walk me through the actual logic here step by step? Like what exactly licenses the jump from "the table looks smaller from across the room" to "therefore we never perceive the table, only an image of it"? That inference feels like its doing a ton of work that isn't spelled out. And since I gather this is basically an early version of the argument from illusion, what's the specific move here that a disjunctivist would say is illegitimate? Not looking for a "hume was an indirect realist" one liner, I want to know exactly where the wheels come off, logically speaking.
