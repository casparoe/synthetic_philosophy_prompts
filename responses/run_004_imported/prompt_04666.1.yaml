      *   Hume compresses this. He assumes that because the *immediate object* of experience varies in the illusion case, the immediate object of experience *must always* be something that varies (an image), never the constant external object.
      *   *Key Principle:* The Principle of Phenomenal Indistinguishability (or the Common Kind Assumption). If two experiences feel the same, they are the same kind of mental state.

