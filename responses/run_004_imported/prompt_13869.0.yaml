answer: |-
  **Setting:** *A university office, late evening. Two empty coffee cups sit on a desk cluttered with papers. **Elena** (Counterfactualist) leans forward, elbows on knees. **Marcus** (Process Theorist) stands by the window, looking out at the dark campus.*

  **Elena:** You're hiding behind the physics, Marcus. We both know the care home was liable. The court found they caused the death. If your theory says they didn't cause it, your theory doesn't match the world we actually litigate in.

  **Marcus:** The court found them *responsible*. I'm not disputing the verdict. I'm disputing the metaphysics you use to justify it. You say the nurse's omission *caused* the death. I say the nurse's omission *quasi-caused* the death.

  **Elena:** And that hyphen saves you how? "Quasi-causation." It sounds like a courtesy title. Like calling a janitor a "sanitation engineer." If the quasi-cause explains the effect, supports the counterfactual, and grounds the liability, what work is the word "quasi" doing other than satisfying your ontological purity?

  **Marcus:** It's doing the work of preventing causal explosion. That's the point you keep sidestepping. Let's go back to your counterfactual test. *If the nurse had given the pill, the patient lives.* True. Therefore, the omission is a cause. But now tell me: *If the estranged son had walked in and given the pill, the patient lives.* Also true. *If the pharmacist had driven over and administered it, the patient lives.* True. *If the Queen had ordered a helicopter drop of the medication...*

  **Elena:** We know the list goes on. The problem of profusion.

  **Marcus:** It's not just a list, Elena. It's a metaphysical catastrophe. On your view, there is no physical difference between the nurse not-acting and the son not-acting. Both are absences. Both satisfy the counterfactual. So why is the nurse a cause and the son merely a "condition"? You can't distinguish them using counterfactuals alone. You have to smuggle in a norm. You have to say the nurse *should* have acted.

  **Elena:** I'm not smuggling in morality. I'm acknowledging context. Causation isn't a relation between bare events in a vacuum; it's a relation embedded in a system.

  **Marcus:** "System" is a polite word for "expectations." You're saying the cause is the thing that violated a rule. That makes causation dependent on morality. If the nurse was on strike legally, suddenly her omission isn't a cause? The physics of the patient's body doesn't care about labor contracts. The heart stopped because the chemical wasn't there. The chemical wasn't there because of a billion absences. You pick one and call it "The Cause" based on who you want to blame.

  **Elena:** No. I pick it based on the *default state* of the system. This isn't moral; it's structural. In a care home, the default trajectory is medication administration. It's a automated, expected process. The son walking in is an external intervention. When I say the nurse caused the death, I mean she interrupted a stable, expected causal flow. The son didn't interrupt anything; he was never part of the flow.

  **Marcus:** But "expected" by whom? "Stable" according to what model? That model is human-centric. It's normative. You're defining causation relative to human interests. I want to know what happened in the room, independent of what the nurse's job description said.

  **Elena:** But there *is* no "what happened" independent of the model! If I ask "What caused the fire?" and you say "The presence of oxygen," you're technically right but unhelpful. If I say "The struck match," I'm isolating the difference-maker against a background of normals. I'm not making a moral claim about oxygen. I'm making a metaphysical claim about *salience*. The nurse's omission is salient because it's a deviation from the system's design. The son's omission isn't a deviation; it's the background.

  **Marcus:** Salience is psychological. Causation is supposed to be ontological. You're conflating *explaining* with *causing*. Look, let me answer your earlier challenge. You asked what "quasi-causation" buys me. Why not just call it causation and be done?

  **Elena:** Yes. If it grounds the liability, why the resistance?

  **Marcus:** Because if absences are genuine causes, then causation is no longer a physical relation. It becomes a logical one. If I don't water my plant, I kill it. If I don't water your plant, do I kill it? On your view, yes, counterfactually. But physically, nothing passed from me to the plant. No energy, no momentum, no conserved quantity. Dowe's point is that real causation involves a transmission of something physical. An omission transmits nothing. It's a null set.

  **Elena:** So?

  **Marcus:** So, if you allow null sets to be causes, you lose the ability to distinguish between *doing* and *allowing*. And if you lose that, you can't bound the causal web. Every time I breathe, I prevent myself from suffocating. I am causing my own survival. But I am also preventing myself from running out to save the patient. Am I causing her death by staying here breathing? Counterfactually, yes. If I stopped breathing, I'd pass out, call 911, maybe save her.

  **Elena:** That's absurd, and my theory handles it.

  **Marcus:** How? Without saying "Marcus isn't supposed to save her"?

  **Elena:** Without saying "supposed to" in a moral sense. I say it in a *causal modeling* sense. In the structural equation model of that night, the variable for "Marcus's Breathing" is exogenous. It's fixed. The variable for "Nurse's Administration" is endogenous. It's part of the mechanism we are modeling. Causation is always relative to a model.

  **Marcus:** Aha! There it is. "Relative to a model." Who builds the model?

  **Elena:** The investigator. The scientist. The court.

  **Marcus:** Based on what?

  **Elena:** Based on what variables are relevant to the mechanism in question.

  **Marcus:** And "relevant" means "normatively expected." You've just admitted it. You can't define the model without invoking norms. So, causation is not a feature of the world, Elena. It's a feature of our *description* of the world. I'm trying to keep causation in the world. You're putting it in the headline.

  **Elena:** I'm putting it where it matters! We aren't particles, Marcus. We're agents in a social structure. If you insist that only conserved quantities count, you render causation useless for the special sciences. Medicine, economics, history—none of them deal in conserved quantities. They deal in missed doses, market crashes, and assassinations. Are you going to tell a historian the assassination didn't cause the war because the bullet's energy transfer was the only real cause, and the pulling of the trigger was just "quasi"?

  **Marcus:** I'm telling the historian that the bullet caused the death. The pulling of the trigger caused the bullet to move. The assassin's decision caused the finger to move. That chain is physical. The *absence* of a doctor saving the patient is different. It's a different *kind* of relation. That's why I need "quasi."

  **Elena:** But you still use "quasi-causation" to assign responsibility. You admit the nurse is liable.

  **Marcus:** Yes. Because liability is normative. Causation is not. I keep them separate. You merge them. That's why you have to twist yourself into knots to explain why the son isn't a cause. You have to say his absence is "metaphysically different" from the nurse's absence. But physically, they are identical. Both are non-events. The only difference is the rulebook.

  **Elena:** The rulebook is part of the reality of a care home! The schedule is a real thing. The employment contract is a real thing. They constrain behavior as effectively as gravity. When the nurse misses the dose, she breaks a causal chain that was socially instituted. That institution is as real as the concrete floor.

  **Marcus:** It's real, but it's not *causal* in the physical sense. It's deontic. It's about obligations.

  **Elena:** And if obligations determine counterfactual dependencies in social systems, then they are causal parameters. Look, Marcus. If your "quasi-causation" does all the work—if it explains the death, if it supports the counterfactual, if it grounds the blame—then denying it the title "causation" is just gatekeeping. You want to save the word for physics. I want to use the word for the world.

  **Marcus:** And I want to prevent the world from dissolving into a soup of infinite negative causes. If I accept your view, I have to say that my failure to send money to every starving child causes their death.

  **Elena:** And I say: Contextually, no. Because you aren't the designated agent in that system.

  **Marcus:** "Designated." There's the norm again.

  **Elena:** There's the *structure* again.

  **Marcus:** Structure built on norms.

  **Elena:** Structure built on stability.

  *Marcus turns from the window and sits on the edge of the desk. He picks up a pen, twirls it.*

  **Marcus:** Here is what "quasi" buys me, Elena. It buys me the ability to say: "The nurse is responsible, but the universe didn't push her." It preserves the distinction between *force* and *lack*. If I push a car, I expend energy. If I don't push a car, I expend nothing. If both are "causes" of the car's motion (or lack thereof), then the word "cause" no longer tracks energy flow. It tracks disappointment.

  **Elena:** Causation *should* track disappointment. Or rather, expectation violation. That's how we navigate the world. We don't navigate by tracking joules. We navigate by tracking breaks in the pattern. The nurse broke the pattern. The son didn't. That's not morality, Marcus. That's pattern recognition.

  **Marcus:** But whose pattern?

  **Elena:** The system's.

  **Marcus:** The system is people. People make rules. Rules are norms. You haven't escaped the circle. You've just painted it grey and called it metaphysics.

  **Elena:** And you've painted physics gold and called it reality. But if your reality can't account for why the nurse went to jail and the son didn't, without importing the norms you claim to exclude, then your "pure" causation is empty.

  **Marcus:** It's not empty. It tells us what happened physically. The quasi-story tells us who pays.

  **Elena:** And I say the "who pays" is part of "what happened."

  *They sit in silence for a moment. The hum of the computer fan fills the gap.*

  **Marcus:** So we're stuck. I can't convince you that absences are ontological holes. You can't convince me that norms are physical forces.

  **Elena:** We're stuck because you want causation to be about the past. I want it to be about the future—about how we intervene. If I want to prevent the next death, I don't look for energy transfers. I look for broken protocols.

  **Marcus:** And if I look for broken protocols, I find a million of them. I need the energy transfer to find the *necessary* link.

  **Elena:** And I need the protocol to find the *relevant* link.

  **Marcus:** Relevant to whom?

  **Elena:** To anyone living in the world.

  **Marcus:** *Sighs.* Coffee?

  **Elena:** Please. Black. No omissions.

  **Marcus:** *Stands up.* I can't promise that. The absence of milk is what makes it black.

  **Elena:** Don't start.
