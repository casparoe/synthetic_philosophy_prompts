          *   *A's Challenge to B:* What does "quasi-causation" actually do? If it handles responsibility and explanation just like causation, why deny it the title? Is it just semantics?
      *   **Goal:** A dialogue where they press *exactly* this difficulty. No talking past each other.
      *   **Specific Requirements:**
          *   Process theorist must explain the utility of "quasi-causation" distinct from causation.
