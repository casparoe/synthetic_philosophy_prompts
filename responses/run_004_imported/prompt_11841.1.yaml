      *   **Key Insight:** In a market of rational agents with common priors, speculative trade should not occur. If someone offers you a bet, it conveys information (they think they have an edge). If you are rational, you should update your beliefs based on the fact that they are offering the bet.
      *   **The "Winner's Curse" in Betting:** If the person offering the bet is better informed, their willingness to bet is a signal that the odds are *not* in your favor, even if the surface-level odds look good.
      *   **Real-world Nuance:** These theorems rely on strict assumptions (common priors, perfect rationality, no liquidity needs, no entertainment value). Real life violates these.

