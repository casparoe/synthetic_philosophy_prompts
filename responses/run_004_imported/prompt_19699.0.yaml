prompt: |-
  I sit on the board of a small foundation that funds work in AI safety and biosecurity -- the kind of longtermist, x-risk-adjacent giving that grew out of the same effective altruism and rationalist online communities I've been reading for well over a decade. We're outgrowing our old process, in which a single program officer decided every grant, and the board has split into two camps over what should replace it.

  One camp wants to move straight to nine-person review panels in which each reviewer scores every proposal independently, with no discussion beforehand, and the majority recommendation is binding. They're explicitly invoking the Condorcet Jury Theorem: if each reviewer is even a little better than a coin flip at judging whether a given proposal will pay off, a large enough independent panel should converge on the right call with near certainty, and unweighted majority vote should suffice to get us there. The other camp, led by our one board member with formal training in social choice theory, thinks this borrows the theorem's conclusion while quietly dropping its premises. Our reviewer pool is drawn almost entirely from the same small rationalist- and EA-adjacent intellectual world, so their errors seem more likely to be correlated than independent; competence plausibly varies a great deal by sub-area (several of our strongest policy reviewers would have no real basis for judging a biosecurity hardware proposal, and might do worse than chance there rather than merely add noise); and it isn't obvious that unweighted majority vote among nine generalists beats a smaller panel of demonstrably better-calibrated reviewers whose votes are weighted accordingly. She wants to keep panels small -- three or five people -- with structured deliberation built in.

  I've been asked to write the one-to-two page memo the full board will vote on at next month's meeting, and I'd like your help drafting it. Please give me a concrete recommendation covering panel size, whether reviewers should vote independently or deliberate first, and whether votes should be weighted rather than counted equally, together with reasoning a skeptical board member could actually follow. I want the memo to engage seriously with the ways our situation might violate the theorem's assumptions rather than just citing its headline result, but I still want it to land on an actionable procedure -- including a pilot period and review date if that's the honest way to hedge our uncertainty -- rather than simply restating both camps' positions back to them.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small foundation board (AI safety, biosecurity, longtermist/x-risk, EA/rationalist adjacent).
      *   **Problem:** Outgrowing single program officer model. Board split on new process.
      *   **Camp 1:** 9-person panels, independent scoring, no discussion, majority binding. Rationale: Condorcet Jury Theorem (CJT).
      *   **Camp 2:** 3-5 person panels, structured deliberation, weighted votes/expertise. Rationale: CJT assumptions (independence, competence > 0.5) likely violated due to correlated errors and varying expertise.
      *   **Task:** Write a 1-2 page memo for the board vote.
      *   **Requirements:** Concrete recommendation (panel size, deliberation vs. independence, weighting), engage seriously with CJT assumptions (don't just cite headline), actionable procedure (pilot/review), persuasive to skeptics.

  2.  **Deconstruct the Arguments & Theory:**
      *   **Condorcet Jury Theorem (CJT):** States that if voters are independent and each has a probability $p > 0.5$ of being correct, the probability of the majority being correct approaches 1 as $n$ (number of voters) increases.
      *   **Camp 1's Flaw:** Assumes independence and uniform $p > 0.5$. In a tight-knit community (EA/rationalist), errors are correlated (shared blind spots, shared ideologies). In specialized fields (biohardware vs. AI policy), $p$ might be $< 0.5$ for generalists. Correlated errors break the convergence guarantee.
      *   **Camp 2's Strength:** Acknowledges correlation and expertise variance. Deliberation can reduce *some* errors (sharing private info) but introduces *social* correlation (groupthink, anchoring). Small panels are cheaper and allow for higher-quality reviewers per seat.
      *   **Synthesis:** A pure CJT approach is dangerous here. A pure deliberation approach risks groupthink. A hybrid is best.
      *   **Recommendation Strategy:**
          *   *Panel Size:* 5 is the sweet spot. 9 is too hard to staff with *actual* experts, leading to the "generalist noise" problem. 3 is too few for diversity of thought.
          *   *Process:* "Deliberate *after* independent scoring." This captures private information (CJT benefit) before social influence (Groupthink risk).
          *   *Weighting:* Explicit weighting is politically tricky and hard to calibrate. Better to use *selection* as weighting (only pick experts) + a chair with a tie-break or synthesis role. However, the prompt asks about weighting. A soft weighting (expert rapporteur) is better than hard mathematical weighting. Let's recommend *expertise-based selection* over *vote weighting* to avoid complexity, but acknowledge the competence variance. Actually, the prompt asks specifically about weighting. I should recommend against *formulaic* weighting but for *structured expertise matching*.
          *   *Pilot:* Essential. We don't know our own $p$.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **The Core Disagreement (CJT Analysis):** Address the elephant in the room. Acknowledge Camp 1's math but explain why the *inputs* (independence, competence) don't hold in our specific context (correlated priors, specialized domains). This validates Camp 2 without dismissing Camp 1's intellectual framework.
      *   **The Proposal (The "Hybrid" Model):**
          *   *Size:* 5 reviewers. (Compromise between 9 and 3).
          *   *Process:* Two-stage. Independent scoring *first*, then deliberation. This preserves the "independent signal" CJT wants while allowing information aggregation Camp 2 wants.
          *   *Weighting:* Avoid explicit vote weighting (too messy). Instead, weight via *selection criteria* (require domain expertise) and use a "Lead Reviewer" to synthesize.
      *   **Implementation/Pilot:** 12-month pilot. Review metrics (not just outcomes, but process health).
      *   **Conclusion:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to be rationalist-adjacent friendly (precise, acknowledging uncertainty, Bayesian).
      *   Needs to be diplomatic (not taking sides aggressively, but synthesizing).
      *   Needs to be decisive (the prompt asks for a concrete recommendation, not a fence-sit).

  5.  **Self-Correction/Iterative Thinking during Drafting:**
      *   *Initial thought:* Maybe recommend weighted votes? *Correction:* No, assigning weights is a governance nightmare and creates resentment. Better to ensure the 5 people *are* the weighted experts.
      *   *Initial thought:* Maybe 7 people? *Correction:* 5 is odd (no ties), easier to recruit than 9, more robust than 3.
      *   *CJT Nuance:* Make sure to mention *correlated error*. That's the killer argument against the 9-person independent panel in a homogenous community.
      *   *Deliberation:* Pure deliberation kills independent judgment. Pure independence kills information sharing. The "Score then Discuss" model is the standard best practice in forecasting and hiring. I should emphasize that.

  6.  **Final Polish:** Check length (1-2 pages). Ensure the "Ask" is clear. Ensure the reasoning is accessible to a skeptical board member (i.e., explain *why* independence fails here).

      *(Self-Correction on Length)*: Keep it tight. Use bullet points for the proposal.

      *(Refining the CJT argument)*: Be specific. "If our errors are correlated at $r > 0$, the benefit of adding voters diminishes rapidly."

      *(Refining the Recommendation)*: Let's call it the "Independent-Then-Deliberative" model.

  7.  **Final Review against constraints:**
      *   Concrete recommendation? Yes (5 people, Score-then-Discuss, No explicit weighting).
      *   Engage CJT assumptions? Yes (Independence, Competence).
      *   Actionable/Pilot? Yes (12-month pilot).
      *   Tone? Professional, analytical.

  8.  **Drafting the Content:** (Proceeding to generate output based on these thoughts).

      *Wait, one more check:* The prompt asks about weighting specifically. I need to address why I'm recommending *against* explicit weighting but *for* expertise-based selection. I will make that distinction clear. Explicit weighting implies some votes count double, which is hard to justify. Implicit weighting via panel composition is cleaner.

      *Wait, another check:* The prompt mentions "majority recommendation is binding" for Camp 1. Camp 2 wants deliberation. My hybrid should clarify decision rights. Does the panel decide or recommend? Usually, boards retain final sign-off, but panels make the *grant* decision. I will assume the panel makes the funding recommendation which the board ratifies, or the panel has delegated authority. Let's assume delegated authority for efficiency, with board oversight. Actually, for a small foundation, the panel *recommends* to the board. I'll clarify that the panel produces a *binding recommendation* unless the board overrides (which is rare). Or simpler: The panel decides. Let's stick to the prompt's framing: "majority recommendation is binding." I will recommend the panel's decision is binding within a budget cap.

      *Okay, let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Grant Review Process Redesign

  **Executive Summary**
  We must replace our single-officer grant model to scale effectively. However, adopting a nine-person independent voting panel based strictly on the Condorcet Jury Theorem (CJT) carries significant risk given our specific context. I recommend a **five-person hybrid panel** that utilizes **independent scoring followed by structured deliberation**, with **expertise-based selection** rather than explicit vote weighting. We should adopt this as a **12-month pilot**, subject to quantitative review.

  **The Condorcet Jury Theorem: Promise vs. Premise**
  Camp One's proposal relies on the CJT, which proves that large, independent majorities converge on the correct decision *if* two conditions hold: (1) each voter is more likely to be right than wrong ($p > 0.5$), and (2) voter errors are independent.

  In our ecosystem, these premises are fragile.
  *   **Competence Variance:** Our portfolio spans AI policy and biohardware. A reviewer competent in one may be worse than chance ($p < 0.5$) in the other. Adding noise dilutes signal; it does not average it out.
  *   **Correlated Errors:** Our reviewer pool is drawn from a tight-knit intellectual community. We share priors, read the same blogs, and attend the same conferences. If we share a blind spot (e.g., underestimating a specific governance risk), our errors are correlated. When errors correlate, the "wisdom of crowds" collapses, and adding more voters yields diminishing returns.

  Therefore, a nine-person independent panel risks false confidence: it creates the *appearance* of statistical robustness without the underlying independence required to achieve it.

  **Recommendation: The Hybrid Model**
  To balance statistical robustness with information aggregation, I propose the following:

  **1. Panel Size: Five Reviewers**
  Nine reviewers are difficult to staff with genuine domain experts, increasing the risk of low-competence votes. Three reviewers lack diversity of thought. Five is the equilibrium: it allows for genuine domain expertise in every seat while maintaining an odd number to prevent ties.

  **2. Process: Score *Then* Discuss**
  We should reject the binary choice between "independent voting" and "deliberation."
  *   **Step 1 (Independent):** Reviewers submit numerical scores and written rationales *before* seeing others' inputs. This preserves the independent signal CJT requires and prevents anchoring.
  *   **Step 2 (Deliberative):** The panel meets to discuss outliers and share private information. A reviewer might realize they missed a technical constraint raised by a peer.
  *   **Step 3 (Final Vote):** Reviewers may adjust their scores after discussion. This captures the benefit of Camp Two's approach (information sharing) without sacrificing Camp One's requirement (initial independence).

  **3. Weighting: Expertise via Selection, Not Votes**
  Explicitly weighting votes (e.g., "the biologist counts double") is operationally fraught and creates perverse incentives. Instead, we weight via **selection criteria**. Every panel must include at least two reviewers with deep domain expertise in the specific proposal type. The remaining three should be generalists capable of judging tractability and neglectedness. This ensures $p > 0.5$ is met by design, rather than hoping for it statistically.

  **Implementation Plan & Pilot**
  We cannot know our actual competence ($p$) or error correlation ($r$) a priori. We must measure them.

  *   **Pilot Period:** 12 months (or first 20 grants).
  *   **Metrics:** We will track not only grant outcomes (which take years to mature) but process metrics: inter-rater reliability (do experts agree more than generalists?), time-to-decision, and reviewer confidence calibration.
  *   **Review Date:** At the next Q4 board meeting, we will vote to renew, adjust, or scrap the process based on these metrics.

  **Conclusion**
  The CJT is a powerful tool, but it is not a magic wand. By reducing panel size to ensure expertise, preserving independence before deliberation, and piloting the change, we protect the foundation from both the bottleneck of a single officer and the false precision of a correlated crowd.

  **Action Required**
  Vote to approve the **Five-Person Hybrid Pilot** as outlined above, effective immediately for the next grant cycle.
