answer: |-
  ### Game Construction

  To demonstrate a pure strategy that is strictly dominated by a mixed strategy but not by any other pure strategy, we can construct a $3 \times 2$ normal-form game.

  **The Setup:**
  *   **Player 1 (Row):** Strategies $U$ (Up), $M$ (Middle), $D$ (Down).
  *   **Player 2 (Column):** Strategies $L$ (Left), $R$ (Right).

  **Payoff Matrix (Player 1):**
  We specify only Player 1's payoffs, as Player 2's payoffs are irrelevant for determining Player 1's dominance relations.

  | | **L** | **R** |
  | :--- | :---: | :---: |
  | **U** | 4 | 0 |
  | **M** | 0 | 4 |
  | **D** | 1 | 1 |

  ---

  ### Analysis of Dominance

  We examine whether strategy $D$ is strictly dominated by any other strategy available to Player 1.

  **1. Failure of Pure-Strategy Dominance**
  For a pure strategy $S$ to strictly dominate $D$, $S$ must yield a strictly higher payoff than $D$ against *every* strategy of the opponent.
  *   **Does $U$ dominate $D$?** No. While $U$ is better against $L$ ($4 > 1$), it is worse against $R$ ($0 < 1$).
  *   **Does $M$ dominate $D$?** No. While $M$ is better against $R$ ($4 > 1$), it is worse against $L$ ($0 < 1$).

  Because $D$ performs better than $U$ in one column and better than $M$ in the other, it is not strictly dominated by any single pure strategy.

  **2. Success of Mixed-Strategy Dominance**
  Consider a mixed strategy $\sigma$ where Player 1 plays $U$ with probability $0.5$ and $M$ with probability $0.5$. We calculate the expected payoff of $\sigma$ against Player 2's strategies:

  *   **Against $L$:** $0.5(4) + 0.5(0) = \mathbf{2}$
  *   **Against $R$:** $0.5(0) + 0.5(4) = \mathbf{2}$

  Comparing these expected payoffs to the payoffs of playing $D$ (which yields $1$ in both cases):
  $$2 > 1$$

  Thus, the mixed strategy $\sigma = (0.5U, 0.5M)$ **strictly dominates** the pure strategy $D$.

  ---

  ### Theoretical Explanation: Convexity

  The reason the mixed strategy succeeds where pure strategies fail lies in the **geometry of the payoff space**.

  1.  **Pure Strategies as Points:** We can view the payoffs of $U$ and $M$ as vectors in a 2-dimensional space: $u(U) = (4, 0)$ and $u(M) = (0, 4)$.
  2.  **Mixed Strategies as a Convex Hull:** A mixed strategy represents a weighted average of these vectors. Geometrically, the set of all possible payoffs from mixing $U$ and $M$ forms the line segment connecting $(4, 0)$ and $(0, 4)$.
  3.  **The "Middle" Strategy:** The payoff vector for $D$ is $(1, 1)$. This point lies strictly "inside" the triangle formed by the origin and the vectors for $U$ and $M$. Because $(1, 1)$ is strictly below the line segment connecting $(4, 0)$ and $(0, 4)$, there exists a convex combination (a mixture) of $U$ and $M$ that yields a higher payoff in every dimension.

  In essence, $D$ is a "safe" but mediocre strategy. By randomizing between the risky strategies $U$ and $M$, Player 1 averages out the risk, guaranteeing a payoff of 2 regardless of Player 2's move, which is strictly superior to the guaranteed 1 from $D$.

  ---

  ### Implications for Rational Choice Theory

  This example highlights a critical distinction between two solution concepts in game theory:

  **1. Iterated Elimination of Dominated Strategies (IEDS)**
  *   **Pure Dominance Only:** If we restrict elimination to pure strategies, strategy $D$ survives. This implies that a rational agent *could* play $D$ without violating the principle of dominance.
  *   **Mixed Dominance:** If we allow elimination by mixed strategies, $D$ is eliminated. This implies that a rational agent *must not* play $D$, as there is a randomization over other strategies that is guaranteed to perform better.

  **2. Connection to Rationalizability**
  This distinction is fundamental to the concept of **Rationalizability** (Bernheim, 1984; Pearce, 1984).
  *   **Pearce's Lemma:** A strategy is strictly dominated by a mixed strategy if and only if it is **never a best response** to any belief (probability distribution) the player might hold about the opponent's actions.
  *   In this example, $D$ is never a best response to any belief about Player 2. Whether Player 2 plays $L$, $R$, or any mix, $U$ or $M$ (or a mix of them) will always yield a higher expected utility than $D$.

  Therefore, allowing for domination by mixed strategies is necessary to fully capture the implications of rationality. If a strategy survives pure-strategy elimination but is eliminated by mixed-strategy dominance, it is technically "rationalizable" only if the player is restricted from randomizing. If randomization is permitted, playing such a strategy is irrational.
