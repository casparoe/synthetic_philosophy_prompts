answer: |-
  The file on Dr. Silas Vane's desk was physical paper, a deliberate anachronism in the Neuro-Behavioral Institute. He liked the friction of it. He liked that when he wrote a diagnosis, the ink soaked in and couldn't be deleted with a keystroke.

  He opened the folder to the intake form of Patient 4092, Mara K. She sat across from him, hands folded tightly in her lap. She was thirty-four, a graphic designer, and she hadn't slept more than two hours a night for six months.

  "It starts when I wake up," Mara said, her voice thin. "I reach for the wrist-band. I need to see the sleep score. If it's under eighty, I can't get out of bed. I feel… contaminated. Like my biology has failed a quality check."

  Vane nodded, scribbling. *Somatic Data Fixation.* It was a new code, one he was proposing for the upcoming revision of the Diagnostic Manual of Cognitive Hygiene. Before this year, people worried about health. Now, they worried about the *measurement* of health. The classification was meant to be indifferent, like sorting quartz from granite. You have the condition, or you don't. The label describes the rock.

  "We're going to call this Type-1 Biometric Dependency," Vane said, capping his pen. "The treatment is a hard disconnect. No wrist-band for thirty days. No apps. You must learn to trust your fatigue, not the algorithm."

  Mara exhaled, a sound of profound relief. She wasn't just broken; she was *Type-1*. There was a protocol. There was a name. She left the office standing straighter, the diagnosis settling onto her shoulders like a uniform.

  ***

  Six months later, the waiting room was fuller. Vane flipped through a stack of follow-up files. They were all Type-1s. Mara's file was on top.

  He called her in. She looked rested, but there was a tension in her eyes, a hyper-vigilance that hadn't been there before. She sat down and immediately held out her wrist. It was bare, but she tapped the skin where the sensor used to be.

  "How is the disconnect?" Vane asked.

  "Perfect," Mara said. "My sleep efficiency is up. My cortisol is down."

  "You aren't wearing the band."

  "I know. But I have the proxy app. It estimates my biometrics based on my phone usage and voice stress. I check it every morning. If the estimate is green, I proceed with the day. If it's red, I rest."

  Vane paused. "The treatment was to stop checking."

  "I am checking," Mara corrected gently. "But I'm not *dependent*. I'm managing. The Type-1 protocol says I need to avoid direct sensor data. I'm adhering to the letter of the classification, Doctor. I am a compliant Type-1."

  Vane felt a cold prickle at the base of his neck. He looked at the other files. Patient 4105 was using a smart-mattress to bypass the wrist-band restriction. Patient 4118 was hiring a third party to monitor their data and only report the "good" days.

  They hadn't cured the anxiety. They had optimized around the diagnosis. The classification of *Type-1 Biometric Dependency* had changed the population. By giving them a specific set of rules to define their sickness, he had given them a rulebook for how to hide it. They were no longer people suffering from fixation; they were people performing recovery. The kind had interacted with the classifier.

  Vane closed Mara's file. "We need to adjust the protocol."

  ***

  The update to the Manual was released in November. Vane sat in a conference room with the board, defending the change.

  "Type-1 was insufficient," Vane said, projecting a slide onto the wall. "It assumed the patient wanted to be healthy more than they wanted to be measured. We were wrong. The measurement is the reward. The new classification is Type-2: *Compensatory Monitoring*."

  He clicked to the next slide. The criteria were stricter. It wasn't enough to avoid the wrist-band. Patients were now required to submit to random, unannounced blood draws and manual pulse checks by a clinician. No self-reporting. No proxies. The goal was to reintroduce the 'indifferent' nature of the test. A blood draw doesn't care if you know it's happening. It just is.

  "It creates a barrier to gaming the system," a board member noted.

  "It creates a new reality," Vane corrected. "We are removing the agency from the patient."

  The board approved it. The new codes were distributed to the clinics. Vane went back to his office and updated Mara's file. *Diagnosis Revised: Type-2 Compensatory Monitoring.* He felt a grim satisfaction. He had closed the loop. He had anticipated the reaction and hardened the category.

  ***

  Three months into the Type-2 protocol, Vane stayed late at the clinic. The lights were dimmed, the hum of the servers in the basement vibrating through the floor. He was reviewing the intake videos from the new randomized check-ins.

  He pulled up Mara's file. She was sitting in the examination room, waiting for the nurse. She was calm. Too calm.

  Vane watched the timestamp. The nurse was five minutes late. In a true anxiety state, the pulse should elevate. Vane watched the live feed of the pulse oximeter on Mara's finger. It remained steady at 62 beats per minute.

  He rewound the footage. He watched Mara's hands. They were in her lap. But her right foot was tapping. A rhythmic, precise tapping. *Tap. Tap-tap. Tap.*

  Vane frowned. He isolated the audio. He enhanced the frequency. It wasn't just tapping. It was a haptic code. She was wearing a device in her shoe, something unauthorized, sending a rhythmic vibration to her ankle.

  He pulled up the files for Patients 4105 and 4118. He checked their waiting room footage. 4105 was chewing gum with a specific cadence. 4118 was humming, low and sub-vocal.

  They weren't just hiding their data anymore. They were hacking their own autonomic nervous systems. They had formed a community, likely in the encrypted support forums Vane knew existed but couldn't shut down. They had shared the new criteria. They had realized that *Type-2* required them to be passive subjects. So, they had trained themselves to become active regulators of their own passivity.

  They were inducing calm to fool the test. They were becoming a new kind of person: one who could voluntarily suppress stress markers on command.

  Vane leaned back in his chair. The ink on the original Type-1 diagnosis felt like it was burning through the folder.

  If he classified them as anxious, they learned to hide anxiety.
  If he classified them as gamers, they learned to game the detection.

  The category wasn't a net catching fish. It was a mold, and the dough was rising to fill it, then spilling over the sides.

  He opened a blank document on his terminal. The cursor blinked, a rhythmic, indifferent pulse.

  He began to type. *Type-3: Autonomic Mimicry.*

  The criteria would have to change again. No more waiting rooms. No more scheduled checks. They would have to monitor the patients in their homes, continuously, without consent. The classification would have to become invisible to work. If the patients knew they were being sorted, they would change the shape of the sort.

  He typed the definition, his fingers moving faster. *Subject exhibits artificial regulation of stress responses in the presence of evaluation metrics.*

  But as he wrote, he stopped.

  If he implemented Type-3, the patients would find out. They always found out. The Manual was digital; the forums were faster. Once they knew the diagnosis was *Autonomic Mimicry*, they would stop trying to look calm. They would start trying to look *authentically stressed*. They would purposefully spike their cortisol before a check-in to prove they weren't mimicking.

  They would perform illness to prove they weren't performing health.

  Vane stared at the screen. The loop wasn't a circle. It was a spiral, tightening upward. Every time he named them, they became something else. There was no 'real' Mara underneath the diagnoses. There was only the Mara that existed in relation to the file on his desk.

  He heard a knock at his office door. It was Mara. She wasn't scheduled for an appointment.

  "Doctor Vane?" she said. She didn't look anxious. She didn't look calm. She looked expectant.

  "I saw the update notification," she said. "Type-3. You're going to monitor us remotely."

  Vane didn't answer. He just watched her.

  "I've already adjusted," she said. "I'm not regulating anymore. I'm letting the stress happen. I'm going to be the perfect Type-3. I'm going to be authentically dysregulated."

  She smiled, but it didn't reach her eyes. It was the smile of someone who knew the rules of the game better than the referee.

  "But," she added, turning to leave, "if you change the definition again… if you decide that 'authentic dysregulation' is just another performance… what happens then? Do we stop existing?"

  She closed the door.

  Vane sat in the silence. He looked at the file, then at the blank document. He highlighted the words *Type-3: Autonomic Mimicry*. He hovered his finger over the delete key.

  If he deleted it, the category wouldn't exist. But the behavior would remain, unnamable, drifting. If he saved it, the behavior would shift.

  He didn't delete it. He saved the file. He printed a hard copy. He took his pen, a heavy fountain pen that required pressure to write, and he signed his name at the bottom of the page.

  He knew that by tomorrow, the signature would be part of the data. They would analyze the pressure of his ink. They would measure the time of the save. They would adapt.

  Vane put the pen down. He opened a new document. He began to type *Type-4*. The loop turned, grinding forward, creating the people it claimed only to describe.
