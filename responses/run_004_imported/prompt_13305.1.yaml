          *   *Analysis:* This is the classic "Standing to Blame" vs. "Truth of the Claim" distinction. Priya is invoking the philosophical concept of *standing* (specifically the non-hypocrisy condition). Marcus is conflating *truth* (Alex was wrong) with *authority/standing* (Sam's right to blame).
