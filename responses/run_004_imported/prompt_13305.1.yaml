          *   *Analysis:* This is the crux. Priya identifies the specific condition (unacknowledged violation) that typically strips standing. Marcus tries to dissolve the concept of hypocrisy into honesty. While semantically interesting, philosophically, "hypocrisy" *is* often defined by the lack of acknowledgment/repentance regarding the specific norm being enforced.
          *   *Winner:* Priya. Marcus is splitting hairs. The lack of acknowledgment *is* what makes it hypocritical in the context of standing.

