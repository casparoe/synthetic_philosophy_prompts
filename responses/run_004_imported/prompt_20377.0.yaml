      *   **Behavioral Economics (Thaler/Sunstein):** Challenges the *rational agent* model.
      *   **Internalities vs. Externalities:** Nudges often address internalities (harm to self).
      *   **Decision Utility vs. Experienced Utility:** Kahneman's distinction. What you choose vs. what you actually enjoy.
      *   **Bounded Rationality/Cognitive Biases:** Present bias, status quo bias, framing effects.
