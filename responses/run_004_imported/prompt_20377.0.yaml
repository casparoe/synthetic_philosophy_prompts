      *   *Point 2: Decision vs. Experienced Utility.* You might choose sugar (decision utility) but regret it later/feel sick (experienced utility). Nudges align decision with experience.
      *   *Point 3: Errors vs. Preferences.* Behavioral econ distinguishes between "true preferences" and "noisy choices" caused by biases. RPT assumes no noise.
