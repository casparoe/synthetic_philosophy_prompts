answer: |-
  **Setting:** *The lobby of the conference hotel. It's 6:30 PM. The air smells of stale espresso and rain. ELENA is leaning against a pillar, scrolling through a PDF on her phone. MARK approaches, holding two paper cups of tea.*

  **Mark:** Chamomile. You looked like you were vibrating at a frequency that required immediate dampening during the Q&A.

  **Elena:** *(Takes the tea)* You saw that? I thought I was being subtle. It's just… hearing someone wave at Lewis's 1976 proof like it's a minor inconvenience rather than a wrecking ball. It gets under my skin.

  **Mark:** Because you think the building deserves to fall.

  **Elena:** Because the foundation was already rotten, Mark. Lewis showed us that you can't have truth-conditional semantics for indicatives *and* preserve the intuitive link between conditionals and conditional probability. I'm happy to drop the truth conditions. Edgington was right. "If A, B" doesn't state a proposition. It's a rule for updating.

  **Mark:** But that feels like surrender. If "If it rains, the match is cancelled" doesn't describe a state of affairs, what am I agreeing with when I nod? I'm not just agreeing to update my credence; I'm agreeing that the world is such that the rain *makes* the cancellation happen. There's a truth of the matter.

  **Elena:** Is there? Lewis's triviality proof says if there is, and if you accept Adams' Thesis—that the probability of the conditional equals the conditional probability—then your probability for the conditional collapses into the probability of the consequent. $P(A \to B) = P(B)$. Which is absurd. So, one of the premises has to go. I drop truth-aptness. You… what do you do?

  **Mark:** I look for the screw that's too tight. Lewis assumes Adams' Thesis holds for *all* probability functions. Specifically, he assumes it holds for any function you could arrive at by conditionalizing on the conditional itself or its negation.

  **Elena:** The rigidity assumption.

  **Mark:** Exactly. Why should I grant that? Maybe Adams' Thesis is a constraint on *rational initial credences*, but it doesn't survive every possible Bayesian update. If I learn that "If A, B" is true, maybe that changes the relationship between A and B in a way that breaks the Thesis for the new function. Lewis forces the Thesis to be invariant across updates. I say it's not.

  **Elena:** If you do that, you open yourself up to a diachronic Dutch Book. If your current degree of belief in "If A, B" is $P(B|A)$, but you know that upon learning $A \to B$ your new probability won't match the new conditional probability, you're guaranteeing incoherence in your future self. You're saying, "I believe this now, but I know that believing it will make me irrational later."

  **Mark:** Or I'm saying that learning a conditional isn't just standard conditionalization. It's a different kind of input.

  **Elena:** That's a costly bullet to bite. You're making the logic of conditionals non-standard just to save the idea that they have truth values. And for what? To handle negation?

  **Mark:** Negation is exactly why I need truth values! This is where your view, Elena, starts to look like magic. If "If A, B" isn't a proposition, it can't be the scope of a negation. But I can say, "It is not the case that if it rains, the match is cancelled." Maybe it's rained and the match is still on. That sentence seems true. If your view is right, what am I negating? You can't negate an imperative. You can't negate a rule for updating.

  **Elena:** The Expressivist has an answer here, though it's messy. We treat the negation as a rejection of the commitment. "It's not the case that if A, B" means "I refuse to adopt the policy of betting on B given A." It's a higher-order attitude.

  **Mark:** A higher-order attitude that behaves exactly like a truth-functional negation in every logical inference I care to run. At some point, if it quacks like a proposition, maybe it's a duck. You're building a quasi-realist castle on an anti-realist foundation. It's easier to just say there are truth conditions, maybe non-classical ones, and restrict the scope of Lewis's proof.

  **Elena:** Okay, let's try the other escape route. Kratzer. Restrictor semantics. You love that one.

  **Mark:** *(Smiles)* I do. Lewis's proof treats 'if' as a binary connective. $A \to B$. It forms a proposition from two propositions. Kratzer says 'if' isn't a connective at all. It's a restrictor on a covert modal operator. "If A, B" is really [Must/Usually/Might] [A] [B]. The 'if'-clause just restricts the domain of the modal. Since there's no conditional proposition $A \to B$, Lewis's proof doesn't get off the ground. There's no object for the probability function to operate on.

  **Elena:** I've read the paper, Mark. It moves the furniture, but it doesn't burn the house down. First, it doesn't explain away the intuition behind Adams' Thesis. Even if 'if' is a restrictor, we still assign probabilities to these restricted claims. I can say, "It's 90% likely that if it rains, the match is cancelled." If there's no proposition there, what is the 90% attaching to?

  **Mark:** It attaches to the modal claim. The probability of the necessity of B given the restriction A.

  **Elena:** But then you're back to calculating probabilities over modal domains, which looks suspiciously like conditional probability. And second, the embedding problem comes back with a vengeance. "Either if it rains the match is cancelled, or if it's sunny we have a picnic." Disjunctions of restrictors? What is the covert modal there? You have to posit a universal quantifier over worlds just to make the syntax work. It feels like you're saving truth conditions by making the semantics incredibly gerrymandered.

  **Mark:** Gerrymandered? Or just sensitive to context? Look, Elena, your view has a simpler problem. If conditionals aren't truth-apt, they can't be premises in valid arguments where validity is defined as truth-preservation. Modus Ponens: If A, B; A; therefore B. If the first premise has no truth value, how can the argument be valid?

  **Elena:** Validity isn't truth-preservation in this framework; it's probability-preservation. An argument is valid if high credence in the premises guarantees high credence in the conclusion. Adams proved that Modus Ponens works fine under that definition. You're begging the question by defining validity solely in terms of truth.

  **Mark:** But that fragments logic. We want a unified account of reasoning. If I say "All men are mortal" and "Socrates is a man," I'm dealing in truths. If I say "If Socrates is a man, he is mortal," suddenly I'm dealing in… what? Assertibility conditions? Why should the logic of language switch gears just because we use 'if'?

  **Elena:** Because 'if' isn't describing the world; it's navigating uncertainty about the world. The "gear switch" is the point. The triviality proof *is* the signal that we're trying to force a descriptive semantics onto a non-descriptive tool. You're trying to find a truth condition for a speech act that isn't a description.

  **Mark:** But consider the case where I'm certain. If I know A is true and I know B is true, I assert "If A, B" confidently. In that limit case, it behaves exactly like a material conditional. It behaves like a proposition. Why posit a fundamental categorical difference just because probabilities are involved? Why not say there are truth conditions, but they're context-sensitive in a way that makes $P(A \to B)$ usually align with $P(B|A)$ without entailing triviality?

  **Elena:** Because Lewis showed you can't have that alignment universally without collapse. You keep saying "context-sensitive," but every time you try to formalize that sensitivity to avoid triviality, you end up violating basic intuitions about how conditionals interact with 'and', 'or', and 'not'.

  **Mark:** And every time you try to formalize the non-truth-apt view, you end up needing "proposition-like" objects to handle embedding, which looks like truth conditions by another name.

  **Elena:** *(Sips the tea)* Touche. The quasi-realist shadow is long.

  **Mark:** So we're stuck. I can't save truth conditions without making them weird. You can't ditch them without making them necessary.

  **Elena:** Maybe the crux isn't the logic. It's the metaphysics. You think there's a fact of the matter about whether the conditional holds, independent of our evidence. I think the conditional *is* a relation between pieces of evidence.

  **Mark:** And I think that reduces truth to warrant. If I say "If you drop that glass, it will break," and you catch it mid-air, was my statement true or false?

  **Elena:** It was neither. It was unassertible given the new context. Or, if you want, it was a claim about the disposition of the glass, which is true, but that's a different claim.

  **Mark:** See, that's where I lose you. I think it was true. The glass *would have* broken. That's a truth about the world, not just my credence. Lewis's triviality proof assumes we're talking about subjective credences. If I move to objective chances, maybe I dodge the bullet.

  **Elena:** Lewis anticipated that. The proof works for any probability function satisfying the axioms. Whether it's subjective credence or objective chance, if you treat the conditional as a proposition in the domain of that function, you get triviality.

  **Mark:** *(Sighs, looks at his watch)* So. We've walked in a circle. I want truth conditions because logic demands propositions. You reject them because probability demands it.

  **Elena:** And neither of us can explain embedding without sweating.

  **Mark:** Basically.

  **Elena:** But you admit Adams' Thesis is the data point that matters most?

  **Mark:** It's the strongest intuition we have. I just don't think it forces me to abandon truth. I think it forces me to abandon the idea that 'if' is a standard connective. Restrictor theory is the way.

  **Elena:** And I think Restrictor theory is just a truth-conditional disguise for the Expressivist view. It gives you the syntax of a proposition without the ontology.

  **Mark:** Maybe that's the compromise. The syntax of truth, the ontology of inference.

  **Elena:** *(Stands up)* I'll take that for now. But if you ever try to Dutch Book me on a conditional bet, I'm walking away.

  **Mark:** Only if you admit that walking away implies you believe the proposition "I will not be Dutch Booked."

  **Elena:** Don't start.

  *(They finish their tea in silence, watching the rain hit the lobby glass.)*
