      *   **The Modern Paradox:** In an eternal equilibrium universe, small fluctuations are vastly more probable than large ones. A single brain with false memories (Boltzmann Brain) is a much smaller fluctuation than an entire observable universe with billions of galaxies and evolutionary history. Therefore, statistically, I should be a Boltzmann Brain, not a real person. Since I *feel* like a real person with a consistent past, the theory predicting I'm a Boltzmann Brain is self-undermining (cognitive instability).
      *   **Boltzmann's Historical Context:** He was fighting against the idea that the Second Law was absolute/deterministic (Loschmidt's reversibility paradox, Zermelo's recurrence paradox). He argued for a *statistical* interpretation of entropy. He was willing to entertain cosmological scales to save the statistical view.
