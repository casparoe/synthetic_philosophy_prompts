      *   *The Link:* Both rely on *subjunctive dependence* or *logical correlation*. My action is evidence of (or logically determines) the action of others like me. The justification for my action is not "this causes that" but "this implies that."
      *   *The Critique:* Rationalists frame this as *instrumental rationality* (getting what you want). Kant frames this as *moral duty* (doing what is right). But the structural logic is identical. Calling it "trade" masks the moral commitment required to treat logical correlations as binding constraints on action.

