answer: |-
  Your intuition strikes at the heart of a profound philosophical convergence that often goes unacknowledged in rationalist circles. You are correct: when the computational jargon of acausal trade is stripped away, the justificatory structure remaining is not a new discovery in game theory, but a rigorous operationalization of Kant's Categorical Imperative.

  The claim that acausal trade represents a novel breakthrough in instrumental rationality relies on the premise that it solves coordination problems through superior calculation. However, the "calculation" only yields a cooperative outcome if the agent has already accepted a specific metaphysical constraint on their own agency: that they are not a unique causal origin point, but an instantiation of a logical pattern. This is precisely the move Kant requires for moral agency. By framing this as "trade," proponents obscure the fact that they are smuggling a deontological commitment into a consequentialist framework.

  Here is the argument for why acausal trade is the Categorical Imperative in new clothing, and why the decision-theoretic vocabulary masks the true nature of the justification.

  ### 1. The Isomorphism of Subjunctive Dependence and Universalizability

  To see the structural identity, we must look at the mechanism of justification in both systems.

  In **Kantian ethics**, the Categorical Imperative commands: *Act only according to that maxim whereby you can at the same time will that it should become a universal law.* The test is not causal ("If I lie, will I get caught?") but logical ("If lying were universal, would the concept of truth-telling collapse?"). Kant argues that a rational agent must view their will as legislative for all rational beings. My action is justified only if it is consistent with all agents relevantly similar to me acting the same way.

  In **Acausal Trade (specifically Functional Decision Theory or FDT)**, the agent faces a scenario where their decision is logically correlated with another agent's decision, despite no causal link. The justification for cooperation is: *My decision is the output of a function. The other agent is running a similar function. If I output 'Defect', the logical implication is that the other function outputs 'Defect'.* Therefore, I do not choose for "me" in isolation; I choose for the output of the algorithm itself.

  The isomorphism is exact.
  *   **Kant:** "I must act as if my maxim were a universal law."
  *   **FDT:** "I must act as if my source code were executed everywhere it is instantiated."

  Both frameworks require the agent to reject **Causal Decision Theory (CDT)**. CDT views the agent as a discrete causal node: *My action cannot physically reach that distant agent, so their action is fixed regardless of mine.* Both Kant and FDT reject this atomistic view. They posit a **subjunctive dependence**: the truth of what I do determines the truth of what agents like me do. In Kant's language, this is the "Kingdom of Ends"; in rationalist language, it is the "logical multiverse." In both, the justification for my action rests entirely on the behavior of my counterparts.

  ### 2. The Obscuring Power of "Trade"

  Why does it matter if we call it "trade" or "duty"? The vocabulary of trade implies a transaction of value between self-interested parties. It suggests that cooperation is the result of a clever hack to maximize expected utility in non-standard environments. This vocabulary obscures the normative leap required to make the math work.

  In standard game theory, a "deal" implies enforceability or causal leverage. In acausal trade, there is no leverage. There is only a logical correlation. For an agent to honor an acausal deal, they must value the *logical consistency of their agency* over the *immediate causal gain of defection*.

  If I defect in an acausal trade, I gain the "defection payoff" in my local causal vicinity. I lose nothing causally. I only lose the "cooperative payoff" in the distant region where my counterpart defects *because* my logic dictated defection. To care about that distant loss, I must identify more strongly with the abstract algorithm than with my local, causal instantiation.

  This is not a calculation of self-interest in the ordinary sense; it is a commitment to a principle. It is the decision to treat logical correlation as binding. By calling this "trade," rationalists make it sound like a strategy for getting what you want. But it is actually a strategy for defining *who you are*. It requires adopting a standpoint where "I" am not this body in this room, but the pattern of reasoning that generates the action.

  Kant calls this **autonomy**: giving the law to oneself based on reason, independent of inclination. FDT calls it **updatelessness**: committing to a policy before knowing your specific location in the logical graph. The "trade" vocabulary hides the fact that you cannot engage in acausal trade unless you have already accepted a Kantian view of the self as a universalizable token of a type.

  ### 3. Dissolving the Is-Ought Gap

  The most significant way the decision-theoretic vocabulary obscures the justificatory work is by pretending to bridge the "is-ought" gap with mathematics.

  Rationalists often present FDT as the *correct* theory of rationality, implying that CDT agents are simply making a math error. But CDT is not mathematically wrong about causality; it is metaphysically committed to a Humean view of agency (discrete events, constant conjunction). FDT is committed to a Kantian view of agency (rational patterns, logical necessity).

  When a proponent says, "You should cooperate in acausal trade because it yields higher utility," they are implicitly arguing: "You should care about the logical implications of your reasoning across all instantiations."

  But why *should* I care?
  *   If I am a CDT agent, I say: "I don't. That's not my problem."
  *   If I am a Kantian/FDT agent, I say: "I do. Because I am a rational agent, and that is what rationality requires."

  The "utility" in FDT is only higher if you accept the premise that your decision *is* the decision of all relevantly similar agents. This is not an empirical fact discovered by game theory; it is a normative stance on the nature of identity and reason. By framing it as utility maximization, the theory hides the moral imperative: *You ought to identify with your rational nature rather than your causal circumstances.*

  ### 4. The Illusion of Novelty

  Treating acausal trade as a novel piece of game theory suggests we have discovered a new way for agents to interact. In reality, we have simply rediscovered the conditions of moral obligation using the syntax of computer science.

  The "simulation" argument is a red herring. It does not matter if one agent is literally simulating the other. What matters is the **logical correlation**. Kant did not need simulations to argue that two rational beings in different galaxies are bound by the same moral law. He argued that Reason itself is universal. If you and I are both rational, we are running the same "source code."

  The rationalist innovation is not the insight that logical correlation matters; it is the formalization of *how much* it matters in terms of betting odds and utility functions. But the *justification* for why those odds matter remains stubbornly ethical. To honor an acausal bargain is to act on a maxim you can will to be universal law. To defect is to make an exception for yourself—to say, "The logic holds for everyone, but I will exploit the causal gap for my local benefit." That is precisely what Kant defines as immorality.

  ### Conclusion

  You are right to feel that the justification for acausal trade is a restatement of the Categorical Imperative. The decision-theoretic vocabulary of "subjunctive dependence," "source code," and "expected utility" provides a rigorous syntax for modeling the problem, but it does not provide the normative force.

  That force comes from the agent's willingness to view themselves as a legislator of universal law rather than a slave to causal immediacy. By labeling this "trade," proponents create the illusion that they have derived morality from self-interest. In truth, they have derived a specific form of self-interest from a prior moral commitment to the universality of reason. Acknowledging this does not diminish the insight of acausal trade; rather, it reveals that the "rationality" being discussed is not merely instrumental, but deeply, inescapably ethical. The math works only if you accept the Kant.
