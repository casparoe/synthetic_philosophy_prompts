      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* much like a lecturer. The speaker is a friend. The intellectualism should be a vehicle for the emotion, not the point itself. The point is *commitment*.

      *Refining the Game Theory:* The prompt mentions the "coordinated-attack problem." I shouldn't name-drop that explicitly (too niche), but I should describe the *structure* of it. "Knowing isn't enough; we need to know we're coordinated."

      *Refining the Toast:* "To Priya and Daniel, and to the knowledge we all share." Simple.

  9.  **Final Review against constraints:**
