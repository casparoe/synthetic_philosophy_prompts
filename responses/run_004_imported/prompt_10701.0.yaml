prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and in three weeks I'm giving the toast at my oldest friend's wedding. Some background that I think matters for the request: Priya, the bride, is marrying Daniel, a management consultant with a decision-theory hobby, who spent a solid month before they got engaged arguing that a wedding was a wasteful, purely symbolic expense layered on top of the marriage license — "legally we'd be exactly as married for a tenth of the cost" — until, by his own sheepish account, Priya's sister sat him down and walked him through the difference between mutual knowledge and common knowledge: that quietly signing paperwork gives the couple, and maybe two witnesses, the fact that they're married, but standing up in front of a hundred and fifty people, all watching the vows and watching one another watch, produces something categorically stronger — not just that everyone present knows, but that everyone knows that everyone knows, and knows that they know that, all the way up. That is exactly the structure epistemic game theorists reach for when they talk about common knowledge of rationality underwriting an equilibrium, and exactly what stays merely mutual, however many levels deep, in things like the coordinated-attack problem or the blue-eyed-islanders puzzle, until some public event forces it into the open. Daniel, apparently, found this persuasive; the wedding is now happening; and I have volunteered to give the toast that has to actually sell it.

  What I'd like from you is the toast itself — spoken text, not notes, running about four or five minutes — built honestly around that distinction, for a room that's maybe a fifth people who will recognize precisely what I'm doing and wince if I get it hand-wavy, and four-fifths family and old friends who have never heard "common knowledge" used this way and must not feel lectured at for a second. It should actually explain, correctly, why standing in a room together accomplishes something a courthouse visit does not, rather than just gesturing at "it's more meaningful" — while remaining, first and always, a toast: warm, a little roasting of Daniel for his original spreadsheet-based objections, and ending on a toast line the whole room can raise a glass to, not just the handful who'd clock the phrase "partition structure."
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Long-time reader of rationalist blogs/forums (Overcoming Bias era).
      *   **Occasion:** Wedding toast for best friend (Priya) and her partner (Daniel).
      *   **Time:** 3 weeks away (implies urgency/finality), Toast length: 4-5 minutes (approx. 600-750 words spoken at a moderate pace).
      *   **Key Backstory:** Daniel (groom) is a management consultant with a decision-theory hobby. He originally argued against the wedding (cost vs. legal benefit). Priya's sister convinced him using the *Mutual Knowledge vs. Common Knowledge* distinction (specifically referencing the coordinated-attack problem/blue-eyed islanders logic). Daniel accepted this.
      *   **Audience:** 20% "rationalist-adjacent" (will spot errors/hand-waving), 80% normal family/friends (must not feel lectured or alienated).
      *   **Goal:** Explain *why* the public ceremony matters (epistemically) without being dry, roast Daniel gently, remain warm/celebratory, and end with a universal toast line.
      *   **Constraint:** Must be spoken text, not notes. Must be accurate on the game theory but accessible.

  2.  **Deconstruct the Core Concept (Mutual vs. Common Knowledge):**
      *   *Mutual Knowledge:* Everyone knows $X$. (I know you're married, you know I know, but I don't know that *you* know that *I* know... ad infinitum).
      *   *Common Knowledge:* Everyone knows $X$, everyone knows that everyone knows $X$, everyone knows that everyone knows that everyone knows $X$... (infinite recursion).
      *   *The Mechanism:* Public announcement in a shared physical space creates the infinite recursion instantly.
      *   *The Application:* Marriage isn't just a contract between two people; it's a social status enforced by the community. The community needs to *know* the community knows to enforce/support it.
      *   *The Risk:* If I get too technical ("partition structures," "Aumann's agreement theorem"), I lose the grandma. If I get too vague ("it's special"), I lose the rationalists and betray the prompt's specific intellectual hook.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish connection to the couple. Acknowledge the elephant in the room (Daniel's initial resistance). Set a warm tone.
      *   **The Roast:** Bring up the spreadsheet/consultant angle. Keep it affectionate.
      *   **The Pivot (The Theory):** Introduce the "Mutual vs. Common Knowledge" idea. *Crucial:* Explain it simply. Use an analogy if possible, or keep the language concrete. Avoid jargon like "partition structure" in the main flow, maybe save a subtle nod for the nerds.
      *   **The Application:** Why does this matter for marriage? It's about community support. A contract is private; a vow is public. The public nature creates the "common knowledge" that binds the community to the couple.
      *   **The Resolution:** Daniel was convinced. Why? Because he loves Priya enough to accept the logic of love (which happens to align with game theory).
      *   **The Closing:** Bring it back to emotion. The toast line needs to be inclusive.

  4.  **Refining the Explanation (The "Tricky" Part):**
      *   *Bad:* "Daniel needed common knowledge to solve the coordination game." (Too dry).
      *   *Bad:* "It's just more meaningful." (Too vague).
      *   *Good:* "If we all sign a paper, we know they're married. But if we stand here, we know that *everyone else* knows, and we know they know we know."
      *   *Analogy:* The "Coordinated Attack" problem is too abstract for Grandma. Let's stick to the room itself. "Looking around this room."
      *   *Rationalist Check:* Ensure I don't say "infinite levels" explicitly if it sounds clunky, but imply the recursion. Actually, saying "all the way up" is fine. The prompt specifically mentions the sister explained it this way, so I should echo that accuracy.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm [Name]. Daniel and I go way back. He's a consultant. He loves spreadsheets. He tried to cancel the wedding to save money. Priya's sister saved it with game theory. She talked about common knowledge. What is that? It means we all know, and we know we all know. This matters because marriage is a social contract. A license is private. This party is public. Now we are all witnesses who know the others are witnesses. Daniel agreed. Let's drink to them.

      *Critique 1:* Too dry. Needs more heart. Needs to sound like a speech, not a lecture. The transition from game theory to love needs to be seamless.

  6.  **Drafting - Iteration 2 (Focusing on Tone):**
      Start with the spreadsheet joke. "Daniel sent me the budget." Then move to the philosophy. "But he missed something." Explain the knowledge distinction. "It's not about what we know, it's about what we know *together*." Connect to support. "When things get hard, we need to know we're all in this." End with love.

      *Critique 2:* Better. Need to make sure the 20% nerds don't cringe. The definition must be precise. "Mutual knowledge is I know X. Common knowledge is I know that you know that I know X..." Keep that recursion clear but conversational.

  7.  **Final Polish (incorporating the prompt's specific constraints):**
      *   *Time:* 4-5 minutes is roughly 600-750 words.
      *   *Audience:* Keep the jargon minimal but accurate. Use "Common Knowledge" as a phrase but define it in plain English.
      *   *Toast Line:* Needs to work for everyone. "To Priya and Daniel" is standard, but maybe add a qualifier about the "public record."
      *   *Rationalist Nod:* Maybe a subtle reference to "updating priors" or "equilibrium" that flies over most heads but lands for the initiates. Let's use "equilibrium" carefully.

  8.  **Writing the Text (incorporating the above):**
