  8.  **Writing the content:** (Self-Correction during drafting: Ensure I don't get too bogged down in formal logic notation, keep it conversational but precise.) *Make sure to explicitly name the "Doctrinal Paradox" or "Discursive Dilemma" implicitly through the argument.* *Let's call the judges Justice Harlan (Premise) and Justice Brennan (Conclusion) - no, too historical. Let's use initials or generic names. Let's go with Justice Aris (Premise) and Justice Telos (Conclusion).* Actually, let's keep it informal. "Judge Reed" (Reasons) and "Judge Outcome" (Outcomes). No, let's go with **Judge Sterling** (Structure/Premise) and **Judge Hayes** (Headcount/Conclusion).

