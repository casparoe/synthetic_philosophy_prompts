answer: |-
  **Setting:** *A federal appellate chamber, late afternoon. The coffee is stale. On the whiteboard, a truth table is half-erased. Three judges sit around a mahogany table, but only two remain: Judge Sterling (who favors premise-based aggregation) and Judge Hayes (who favors conclusion-based aggregation). The third, Judge Miller, has already left for the day, leaving his swing vote mathematically decisive but philosophically silent.*

  **The Case:** *Smith v. CorpCo.* A breach of contract dispute.
  **The Doctrine:** *Liability ($R$) if and only if Valid Contract ($P$) AND Breach ($Q$).*

  **The Profile:**
  *   **Sterling:** $P$ (Yes), $Q$ (Yes) $\rightarrow$ $R$ (Yes)
  *   **Miller:** $P$ (Yes), $Q$ (No) $\rightarrow$ $R$ (No)
  *   **Hayes:** $P$ (No), $Q$ (Yes) $\rightarrow$ $R$ (No)

  **The Paradox:**
  *   **Premise Majority:** $P$ is Yes (2-1), $Q$ is Yes (2-1). Therefore, $R$ is **Yes**.
  *   **Conclusion Majority:** $R$ is No (2-1). Therefore, $R$ is **No**.

  ***

  **Sterling:** (Tapping the whiteboard) Look at the math, Hayes. It's not even close. We have a majority that finds a valid contract. We have a majority that finds a breach. The doctrine is a simple conjunction. If $P$ and $Q$ are collectively accepted, $R$ follows necessarily. To rule for the defendant is to issue a judgment that contradicts our own collective findings of fact and law.

  **Hayes:** It contradicts *your* logic, Sterling. It doesn't contradict the court. You're assuming the court is a single rational agent that must hold consistent beliefs across a docket. But the court is a committee. And in a committee, the only thing that binds us is the majority vote on the dispositive question. Two of us voted "Not Liable." That's the verdict.

  **Sterling:** A verdict without a rationale is a fiat. If we sign an opinion saying "Defendant is Not Liable," what is the *ratio decidendi*? We can't say "No Contract," because a majority found there *was* a contract. We can't say "No Breach," because a majority found there *was* a breach. We'd be lying. We'd be attributing reasons to the majority that no individual judge holds.

  **Hayes:** Exactly! And that's my point. Why are you so desperate to attribute reasons to the *collective*? Judge Miller thinks there was a contract but no breach. I think there was a breach but no contract. Those are our reasons. They don't merge. When you force a premise-based procedure, you're manufacturing a "collective reason" that is a fiction. You're saying the Court believes $P$ and the Court believes $Q$. But the Court doesn't believe anything. *People* believe things. The Court just decides outcomes.

  **Sterling:** That's a dangerously thin view of the judiciary. We aren't a legislature cutting deals on outcomes. We are guardians of a coherent legal system. If we decide cases conclusion-by-conclusion, we lose integrity over time. Today we find liability because $P$ and $Q$ hold. Tomorrow, a different coalition forms on $R$ despite $P$ and $Q$ holding, and we find no liability. The law becomes unpredictable. Premise-based aggregation ensures that the *doctrine* controls the outcome, not the accidental alignment of votes on the bottom line.

  **Hayes:** "Accidental"? That's rich. You're privileging one procedural path over another and calling it "integrity." Why is voting on the premises the neutral default? List and Pettit showed this isn't just a quirk of contract law; it's a structural impossibility. You can't have a voting procedure that is anonymous, systematic, and guarantees consistent collective judgments. By choosing premise-based aggregation, you're violating independence. You're saying the vote on Liability isn't about Liability; it's a slave to the votes on Contract and Breach.

  **Sterling:** It's not slavery; it's subordination to the rule of law. The doctrine *says* Liability is a function of Contract and Breach. If we vote directly on Liability, we are effectively allowing the judges to ignore the doctrinal constraints. Judge Miller might be voting "No Liability" because he thinks the damages are too high, which isn't a valid premise under the doctrine. By voting on premises, we force everyone to translate their policy preferences into the accepted legal categories. It disciplines the vote.

  **Hayes:** Or it distorts it. Maybe Judge Miller votes "No Breach" not because he doesn't think the facts show a breach, but as a strategic compromise to avoid a liability finding he thinks is unjust. When you force premise-based voting, you force judges to misrepresent their judgments on the issues to get the outcome they want. Conclusion-based voting respects the sovereignty of the individual judge on the ultimate question: Who wins? It acknowledges that reasonable judges can disagree on the path but agree on the destination, or vice versa.

  **Sterling:** But if the destination contradicts the path, the precedent is worthless. Imagine the lower courts reading this opinion. "The Appellate Court found a contract and a breach, but ruled no liability." What instruction does that give them? It tells them the doctrine is optional. It severs the logical connection between the rules and the result. You're prioritizing the democratic legitimacy of the headcount over the rational legitimacy of the judgment.

  **Hayes:** And you're prioritizing rational legitimacy over democratic legitimacy. In a multi-member body, the only legitimate authority comes from the majority will. If a majority says "Not Liable," imposing "Liable" because of a logical ghost in the machine is authoritarian. You're essentially disenfranchising the majority on the dispositive issue because they didn't coordinate on the same *reasons*. You're punishing them for having diverse rationales.

  **Sterling:** Diverse rationales are fine in concurrence. But the *holding* must be stable. If we go conclusion-based, we invite inconsistency. Next case, the facts are identical. A different mix of judges. Maybe we get a majority for Liability even if a majority rejects the Contract premise. Now the law is contradictory. Premise-based aggregation is the only way to treat like cases alike, because it anchors the decision to the *features* of the case ($P$ and $Q$), not the idiosyncrasies of the coalition on $R$.

  **Hayes:** But anchoring to the features requires us to agree on *which* features matter and how to weigh them. That's the systematicity condition. You're assuming the agenda—$P$, $Q$, therefore $R$—is fixed and neutral. It's not. Why isn't there a premise on "Public Policy"? Why isn't "Equity" a premise? By locking the agenda to $P$ and $Q$, you're rigging the game toward a finding of Liability. If I get to set the agenda, I can make the premise-based procedure yield my preferred outcome too. The procedure *is* the politics.

  **Sterling:** (Pauses, leaning back) So you admit it's politics. You want to vote on the outcome because it lets the coalition win without justifying the premises.

  **Hayes:** I want to vote on the outcome because that's what the parties came here for. They want to know who wins. They don't need the Court to be a single rational mind. They need the Court to be a fair tribunal. And fairness dictates that if two out of three judges think the defendant shouldn't pay, the defendant shouldn't pay. Forcing them to pay because of a logical implication they explicitly rejected on the bottom line... that feels like a violation of due process.

  **Sterling:** And letting them off the hook when the elements of the cause of action are satisfied by the majority... that feels like a violation of the law. We're stuck, Hayes.

  **Hayes:** We're not stuck. We just have to choose. Do we want to be logicians or judges?

  **Sterling:** I thought the job was to be both.

  **Hayes:** (Standing up, gathering papers) List and Pettit would say you can't be both, not always. Not with this voting profile. So the question is: when the logic breaks, what's the tiebreaker? Coherence or Count?

  **Sterling:** (Looking back at the board) If we choose Count, we admit the law is just power.

  **Hayes:** If we choose Coherence, we admit the judgment is a fiction.

  *(Silence hangs in the room. Sterling picks up a marker. Hayes puts a hand on the doorknob.)*

  **Sterling:** Write the dissent. I'll write the majority. I'm ruling on the premises.

  **Hayes:** Then I'll write a dissent that says the majority's reasoning supports a verdict they didn't even reach.

  **Sterling:** That's the point of the paradox, isn't it?

  **Hayes:** No. The point is that one of us has to sign an opinion that doesn't make sense.

  *(Hayes exits. Sterling circles the "Yes" on the Premise column, then stares at the "No" on the Conclusion row.)*
