answer: |-
  Your intuition is correct: your friend is reciting a theorem as if it were a strategy. He is mathematically right about the *properties* of the Kelly Criterion, but he is dangerously wrong about its *application* in the real world.

  The "nagging feeling" you have comes from the fact that his argument relies on idealized assumptions that do not exist in actual markets. When you relax those assumptions—specifically regarding **parameter uncertainty** and **finite time horizons**—betting less than Full Kelly stops being "cowardice" and becomes the mathematically superior strategy for robustness.

  Here is the breakdown of why Full Kelly is not the "no-caveats" optimal solution, without resorting to "risk tolerance" hand-waving.

  ### 1. Where Your Friend Is Right: Ergodicity
  Your friend is correct about the "Geometric Rationality" point. This is a concept formalized in **Ergodicity Economics** (championed by Ole Peters).

  *   **Arithmetic Mean (Ensemble Average):** If 100 people each make a bet once, the average outcome is the arithmetic mean.
  *   **Geometric Mean (Time Average):** If *one* person makes a bet 100 times in a row, reinvesting the proceeds, the outcome is determined by the geometric mean.

  In repeated betting with reinvestment, the arithmetic expected value is indeed "naive." If you bet your entire bankroll on a coin flip that pays 2:1 on heads, your arithmetic expected value is positive. But if you do it repeatedly, you will eventually hit tails and go to zero. Once you hit zero, you can't play. The time-average growth rate is negative.

  Maximizing the geometric mean (which is what Kelly does) is indeed the correct way to maximize wealth growth over time *assuming you know the true probabilities*. In an infinite time horizon with known probabilities, Full Kelly almost surely outperforms any other strategy.

  **However, we do not live in an infinite time horizon with known probabilities.**

  ### 2. The Real Reason for Half-Kelly: Estimation Error
  This is the specific answer you are looking for. It is not about "fear"; it is about **model fragility.**

  The Kelly formula requires exact inputs: the true probability of winning ($p$) and the true payoff odds ($b$).
  $$ f^* = \frac{p(b+1) - 1}{b} $$

  In a casino (like blackjack card counting), you can calculate these probabilities with high precision. In quant trading, you **cannot**. You are working with estimates ($\hat{p}$) derived from historical data.

  **The math of overbetting is asymmetric:**
  *   **Underbetting:** If you bet half-Kelly, your growth rate drops slightly, but your volatility drops by half. The penalty for underbetting is linear/sublinear.
  *   **Overbetting:** If you bet *more* than Kelly (because you overestimated your edge), your expected growth rate drops precipitously. If you bet **double Kelly**, your expected geometric growth rate becomes **zero**. You are mathematically guaranteed to tread water in the long run despite having a "positive edge." If you bet more than double Kelly, your expected growth is **negative**. You will go broke.

  Because the cost of overestimating your edge (ruin) is vastly higher than the cost of underestimating it (slower growth), **Fractional Kelly is the optimal strategy when there is uncertainty in the inputs.**

  A 2018 paper by MacLean, Thorp, and Ziemba (the heavyweights of this field) explicitly demonstrates that when there is uncertainty in the estimated edge, the optimal bet size is *always* less than Full Kelly. In this context, Half-Kelly isn't "risk aversion"; it is a **robustness optimization.** It is a margin of safety against your own model being wrong.

  ### 3. Finite Time Horizons and Drawdowns
  The theorem that "Kelly maximizes wealth" applies as $t \to \infty$. In the real world, $t$ is finite.

  In any finite window, the distribution of outcomes around the geometric mean is wide. Full Kelly maximizes the *median* terminal wealth, but it does so by accepting massive variance.
  *   A Full Kelly strategy has a 50% chance of experiencing a **50% drawdown** at some point.
  *   It has a 10% chance of experiencing a **90% drawdown**.

  Why does this matter mathematically, not just emotionally?
  1.  **Leverage Constraints:** If you are trading on margin, a 90% drawdown might trigger a margin call or liquidation before the "long run" arrives. If you are forced out of the position, the asymptotic math no longer applies.
  2.  **Opportunity Cost of Recovery:** If you lose 50%, you need a 100% gain to recover. If you lose 90%, you need a 900% gain. While Kelly accounts for this in the growth rate, the *time* required to recover from a deep drawdown in a finite lifespan can exceed the trader's active career.

  If your goal is to maximize the probability of being ahead at a specific finite time $T$, or to minimize the probability of falling below a specific threshold (like "going out of business"), Full Kelly is **not** the optimal strategy. Fractional Kelly shifts the distribution of outcomes to reduce the left-tail risk of ruin within a finite window.

  ### 4. Utility of Wealth is Not Linear
  Your friend says the goal is to "maximize your money." This assumes the utility of money is linear (i.e., \$2 million is exactly twice as good as \$1 million).

  Economically, this is false.
  *   The first \$100k buys you survival (rent, food).
  *   The next \$1m buys you comfort.
  *   The next \$100m buys you... slightly more comfort and influence.

  Because the marginal utility of wealth diminishes, the "pain" of losing 50% of your bankroll is mathematically greater than the "gain" of increasing it by 50%, in terms of real-world utility.

  Even if we stick strictly to trading mechanics: **Capital is a tool.** If you lose too much capital, you cannot deploy the same strategies (some strategies require minimum capital sizes, or liquidity constraints become tighter). If your capital drops below a certain threshold, your alpha might disappear because you can't diversify or absorb transaction costs. Therefore, preserving capital has an intrinsic mathematical value beyond just the raw dollar amount.

  ### Summary
  Your friend is treating a theoretical limit as a practical rule.

  1.  **Geometric vs. Arithmetic:** He is right. For repeated bets, maximizing the geometric mean (log-utility) is the correct objective, not arithmetic EV.
  2.  **Full Kelly vs. Fractional Kelly:** He is wrong. Full Kelly is only optimal if you know the true probabilities with 100% certainty.
  3.  **The "Cowardice" Claim:** False. In the presence of **estimation error** (which is always present in trading), Fractional Kelly yields a higher *realized* growth rate than Full Kelly because it prevents the catastrophic penalty of overbetting.

  **The Verdict:**
  Betting Half-Kelly is not "leaving money on the table" due to fear. It is **paying an insurance premium** against the inevitability of model error. It is the mathematically rigorous response to the fact that you do not know the future distribution of returns as well as you think you do.

  If your friend is betting Full Kelly in real markets, he isn't being "brave"; he is assuming his predictive models are perfect. In quant trading, that is the definition of arrogance, not rationality.
