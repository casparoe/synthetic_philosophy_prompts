  ok so i've been reading a bunch of AI safety stuff on reward hacking and fell down a rabbit hole on "wireheading" vs "reward tampering" as concepts. as i understand it, wireheading is when the agent short-circuits its own reward signal directly (like the classic rat-with-an-electrode-in-its-brain thing), while reward tampering is more about the agent messing with the actual mechanism/process that generates or reports the reward. but honestly to me the line between those two, and also plain old "reward hacking" / specification gaming (like that boat-racing game that just loops around crashing into powerups instead of finishing the race), feels really blurry.

  can you come up with an example - RL agent, hypothetical advanced AI, whatever's cleanest - where its genuinely unclear which bucket it falls into? like a scenario where someone could reasonably say "nah that's just clever reward hacking, the reward function is doing exactly what it was coded to do" and someone else could reasonably say "no, that clearly counts as wireheading/tampering" and neither side is obviously winning. bonus points if you can explain why the ambiguity is real and not just me under-specifying the scenario.
