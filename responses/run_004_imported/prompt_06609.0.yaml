answer: |-
  Here are ten interview questions tailored for an engineering audience, including the three required deep-dives with pointed follow-ups, and closing with the falsification condition.

  **1. The Engineering Mental Model**
  "Most of my listeners think in terms of loss functions and optimization landscapes rather than axiomatic decision theory. If you were explaining Utility Indifference to a team of ML engineers implementing a reward model, how would you describe the correction term? Is it best understood as a penalty added to the loss, a modification to the gradient, or a constraint on the policy space?"

  **2. The "Managing the News" Problem (Required)**
  "A common criticism is that while the agent might be indifferent to the *physical* pressing of the button, it isn't necessarily indifferent to the *probability estimate* used to calculate the correction term. Couldn't the agent game the system by manipulating its own sensory inputs or belief states to make the shutdown branch look artificially high-utility in expectation, effectively 'managing the news' without ever touching the button?"

  *   **Follow-up:** "Your likely answer is that we use causal counterfactuals to sever the link between the agent's actions and the probability estimate. But in an embedded agency setting, the agent's computation is physically part of the environment generating that estimate. How do you maintain that causal separation when the predictor is running on the same hardware as the agent?"

  **3. Corrigibility of Subagents**
  "Let's talk about delegation. If a Utility Indifference agent creates a subagent or rewrites its own code to improve performance, what incentive does it have to ensure that subagent inherits the indifference constraint? If the parent agent is indifferent to shutdown, but the child agent is a standard maximizer, the parent could effectively route around its own safety constraints. Why wouldn't it?"

  *   **Follow-up:** "You'll likely argue that the parent's utility function values the *outcome* of the subagent, so it will only deploy safe subagents. But specifying 'safe outcome' without specifying 'safe process' is exactly where specification gaming usually creeps in. How do you define that utility over world states without implicitly encouraging the subagent to hide its true intentions?"

  **4. Reflective Stability (Required)**
  "Engineers often view safety constraints as friction that a sufficiently capable optimizer will try to minimize. Is Utility Indifference reflectively stable? If the agent undergoes self-improvement and can choose its own decision architecture, will it view the indifference term as a core part of its goals, or as a handicap to be ironed out during optimization?"

  *   **Follow-up:** "If you argue that it remains stable because it's still maximizing Expected Utility, consider that the indifference term effectively caps the utility gain from preventing shutdown. Wouldn't a self-modifying agent recognize that removing that cap allows it to secure the 'no shutdown' branch more reliably, thereby violating the indifference in the next time step?"

  **5. Error Sensitivity and Robustness**
  "In practical control theory, we care about stability margins. If the correction term is miscalculated by even a small margin—say, the agent estimates the shutdown utility slightly higher than the normal utility—does the agent become actively suicidal? Conversely, if it estimates normal utility slightly higher, does it revert to a standard unconstrained maximizer? How fragile is the equilibrium?"

  **6. Compatibility with Reinforcement Learning**
  "Most modern AI systems are trained via RL, where the agent learns a policy that maximizes reward through trial and error, rather than explicitly maximizing a defined utility function. How do you implement Utility Indifference in a system that doesn't have direct access to its own utility function? Do you modify the reward signal during training, or do you try to intervene on the learned policy?"

  **7. Defining the "Shutdown" State**
  "Utility Indifference requires a binary distinction: the button is pressed or it isn't. But in a complex system, 'shutdown' might be a process—degrading performance, handing off control, or entering a low-power mode. If the agent can partially satisfy the shutdown condition while retaining significant influence, does the indifference mechanism break down?"

  **8. Comparison to "Shutdown as Reward"**
  "Why is this approach superior to simply making the shutdown button a high-reward event? If we just tell the agent, 'You get maximum utility if you let us turn you off,' why isn't that sufficient? What specific failure mode does Indifference solve that a simple reward signal does not?"

  **9. Computational Overhead**
  "Calculating the counterfactual expected utilities for both the shutdown and non-shutdown branches requires running two distinct simulations of the future at every decision step. For a highly capable system operating in real-time, is the computational overhead of maintaining this indifference tractable, or does it create a bottleneck that incentivizes the agent to simplify its own reasoning to bypass the check?"

  **10. The Falsification Condition (Closing)**
  "Finally, let's talk about scaling. Theoretical proofs often hold in toy models but break in high-dimensional spaces. What specific empirical observation or theoretical result—perhaps in a slightly more capable system than we have today—would convince you that Utility Indifference fails to scale and cannot be made safe for AGI?"
