      *   *Problem:* The "Hill" studies (Proffitt) are controversial (replication issues).
      *   *Problem:* Even if CPP is real, is it strong enough to explain incommensurability? Maybe scientists just attend to different things (attention) rather than seeing different colors/shapes.
      *   *Conclusion:* CPP provides a *mechanism* for Kuhn, but doesn't fully validate the strong "different worlds" claim. It bridges the gap but doesn't close it entirely.

