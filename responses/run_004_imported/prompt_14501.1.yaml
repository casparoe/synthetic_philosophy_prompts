  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did I imply race is *only* social? *Correction:* Be careful. Acknowledge biological correlates exist but the *kind* "race" as used socially is constructed. (Actually, for this specific ontological question, focus on the *status* of the category, not the biology debate, to stay on topic).
      *   *Check:* Did I address the "handwritten notes" example? *Yes,* need to explain why that fails (lack of institutional backing).
