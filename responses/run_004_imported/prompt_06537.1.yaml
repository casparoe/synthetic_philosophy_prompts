  TOCQUEVILLE
  You stare at that gazette as if it were a dead bird, Monsieur Kierkegaard.

  KIERKEGAARD
  Worse, Monsieur de Tocqueville. A dead bird is a specific thing. It has a weight. This is a nothing that pretends to be everything. It is the Public. A monstrous abstraction, a nobody made out of everybody.

  TOCQUEVILLE
  A nothing? It is the voice of thousands. In America, we saw what happens when you strip away the guilds, the estates, the aristocratic ties that bound men to their neighbors. You are left with isolated atoms. Without the newspaper to bring them the same thought at the same hour, they remain forever alone in the crowd.

  KIERKEGAARD
  And you think this solitude is the danger? I tell you, this solitude is the only place where a human being actually exists. When I am alone, I am responsible. When I am part of your public, I am safe. I can say the cruel thing, the lazy thing, and who is to blame? The public. The subscription. The ink.

  TOCQUEVILLE
  You speak of moral responsibility. I speak of political liberty. If these isolated atoms do not find a way to act together, they do not remain free. They fall beneath the feet of a master. The newspaper is the glue. It allows them to form associations. It is the only shield against tyranny.

  KIERKEGAARD
  A shield made of fog. You say associations protect them. I say associations allow them to hide. A man in an association does not need to find conviction; he needs only to vote with the room. He borrows his opinion like a coat. If the opinion proves shameful, he shrugs. I was only one of many.

  TOCQUEVILLE
  You demand a heroism that the common man cannot sustain. You want every shopkeeper to be a martyr standing before God. I am looking for a society that does not collapse into despotism when the king is removed. If the newspaper levels the aristocracy, yes, it also levels the ground beneath us. But it is solid ground.

  KIERKEGAARD
  It is quicksand! You call it leveling; I call it the destruction of the single individual. You worry about the tyranny of the majority. I worry about the tyranny of the imaginary. The public does not exist. It is a phantom. And yet you want men to sacrifice their souls to this phantom so they might feel secure in their property?

  TOCQUEVILLE
  I want them to secure their rights. Without the collective power generated by print, by association, the individual is powerless. You say he is more responsible? Perhaps. But he is also crushed. Is a responsible man beneath a boot preferable to a free man in a union?

  KIERKEGAARD
  A free man in a union is often a slave who does not know his master. He thinks he is ruling because he is part of the crowd. But God does not see crowds. He sees individuals. Your newspaper binds men together, yes, but it binds them in superficiality. It gives them opinions without knowledge, power without responsibility.

  TOCQUEVILLE
  And your solution? We cannot return to the feudal manor. We cannot force men back into estates. We are mobile. We are equal. If you deny them the tool of the press, you deny them the only means they have to recognize one another.

  KIERKEGAARD
  Let them recognize one another as individuals, not as subscribers. Let them speak face to face. Let them suffer the risk of being misunderstood. Your press removes the risk. It removes the sting of existence. It makes life a kind of administration.

  TOCQUEVILLE
  Administration is better than execution. You speak from a small country, a philosopher in a garret. I speak of nations. If you remove the glue, the structure falls. The isolation you prize becomes the isolation of the prison cell.

  KIERKEGAARD
  Better the prison cell where I know I am me, than the open field where I am everyone and therefore no one. You fear the despot. I fear the abstraction. The despot can be killed. The abstraction cannot be touched. It simply levels everything down to a comfortable, cowardly average.

  TOCQUEVILLE
  And who decides what is high and what is low? You?

  KIERKEGAARD
  No. The individual before God. But certainly not the newspaper. The newspaper is a mirror that shows you a face that isn't yours, and tells you it is the face of the age.

  TOCQUEVILLE
  Then you leave the millions to their silence. You condemn them to powerlessness in the name of a purity they cannot eat or wear.

  KIERKEGAARD
  I condemn them to nothing. I invite them to become someone. But that is a task for a lifetime, not a morning edition.

  TOCQUEVILLE
  And until they become this someone, the tyrant arrives.

  KIERKEGAARD
  Then let him arrive. Truth is not measured by survival.

  TOCQUEVILLE
  Liberty is.
