      *   *Refining the Math:* The key insight of Kelly/Ergodicity is that *survival is a prerequisite for growth*. You cannot maximize return if you hit zero. In marriage, "hitting zero" is divorce/separation. Therefore, the strategy isn't maximizing short-term spikes (passion/drama) but maximizing long-term geometric growth (trust/stability).

