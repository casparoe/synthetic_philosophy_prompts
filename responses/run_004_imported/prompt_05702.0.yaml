answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I write about science and ideas, and I've had the privilege of knowing [Groom] since graduate school.

  If you've had dinner with [Groom] in the last decade, you know that he has a specific correction he likes to make. Usually, it comes after dessert. He will lean in and explain that most people make decisions based on "ensemble averages." That is the idea that if you look at a hundred parallel versions of yourself making a bet, the average outcome is what matters.

  But, as he has patiently explained to me over two separate dinners, that is wrong. We don't live in a multiverse. We live in time. We walk a single path. And on a single path, the only thing that matters is the geometric growth rate of your life. You have to optimize for the long term, which means you must avoid ruin at all costs. Because if you hit zero, the game ends, and no future expected value can save you.

  I bring this up because I think [Groom] and [Bride] have intuitively understood something about marriage that fits this framework perfectly.

  In the world of quantitative finance, it is tempting to treat life like a portfolio. To look for hedges. To diversify risk. But marriage is not a diversification strategy. It is a commitment to a single trajectory. It is an acknowledgment that you are not living in an ensemble of possible partners, but in the one reality you are building together, day after day.

  This philosophy demands something specific from you both. It means that the goal isn't to maximize the excitement of any single day. It is to maximize the growth rate of the whole path. And as any trader here knows, the biggest drag on geometric growth is volatility that threatens ruin.

  In a marriage, "ruin" isn't bankruptcy. It's the breaking of trust. It's treating the relationship as disposable when the short-term odds look difficult. [Groom]'s philosophy teaches us that you cannot afford to risk the principal. You have to protect the bond so that the compounding can work.

  Because that is the magic of the time average. It allows for compounding. Shared jokes, shared history, the quiet knowledge of how the other takes their coffee—these things don't add up linearly. They compound. But they only compound if you stay on the path.

  So, my wish for you is not that you find the highest expected value in every argument. My wish is that you protect the principal of your love, so that you can stay in the game long enough for the growth to become extraordinary.

  To [Groom] and [Bride]. May your path be long, may your volatility be low, and may your growth be geometric.

  To the happy couple.
