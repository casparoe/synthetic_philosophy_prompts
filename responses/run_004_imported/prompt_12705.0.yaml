      *   If I choose Frequentist: The difficulty is the Reference Class Problem.
      *   If I choose Propensity: The difficulty is the Category Error (group data $\neq$ individual cause).
      *   If I choose Subjectivist: The difficulty is the Authority Deficit.

      *Best Approach for Courts:* Courts deal in evidence. Evidence is usually about facts. A risk score is a statistical fact about a population. The memo should instruct judges to treat it as **actuarial evidence regarding a reference class, not a diagnostic fact about the defendant.** This aligns with current legal scholarship (e.g., *State v. Loomis* warnings). It avoids the metaphysical trap of Propensity and the weakness of Subjectivism.

