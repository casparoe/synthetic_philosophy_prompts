      *   **Mechanism:** Weighted random selection based on headcount.
      *   **Override:** Incident Commander can veto if they can articulate a non-numerical reason (e.g., children vs adults, though that's fraught, better to stick to medical/logistical). Let's stick to "IC has final authority but must log justification."

