          *   Tone: Professional, empathetic, decisive but open to revision, suitable for a volunteer non-profit committee.

  2.  **Deconstruct the Ethical Conflict:**
      *   *Current State:* Strict Utilitarianism (Maximize lives saved). 5 > 1.
      *   *Challenge:* John Taurek's "Should the Numbers Count?" (1977). Argument: There is no "super-losing" of 5 lives. Each person faces the loss of *their* life. From the perspective of the individual, the loss is equal. Therefore, giving the larger group a 100% chance vs. the smaller group a 0% chance disrespects the moral equality of the individuals.
      *   *Proposed Alternative:* Weighted Lottery. Give the group of 5 a 5/6 chance and the individual a 1/6 chance? Or a 50/50 coin flip? Taurek actually suggests a coin flip (equal chance for each *party* or sometimes interpreted as equal chance per *person* leading to weighted). The nurse suggested "lottery weighted by headcount." This is a crucial distinction.
          *   *Strict Taurek:* 50/50 between groups (each party has equal claim).
          *   *Weighted Lottery:* 5/6 vs 1/6 (acknowledges numbers but doesn't guarantee).
          *   *Utilitarian:* 100% to the 5.
      *   *Operational Reality:* SAR coordinators are under immense stress. Complex decision matrices cause hesitation. Hesitation kills. The tool needs to be clear.

