      *   **Conflict:** Utilitarian "save the most lives" (current rule) vs. Egalitarian/Non-aggregative view (Taurek's argument, suggested by a retired ICU nurse/philosopher).
      *   **Task:** Draft a formal memo for the committee.
      *   **Requirements:**
