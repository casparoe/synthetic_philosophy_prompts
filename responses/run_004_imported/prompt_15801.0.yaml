answer: |-
  The server rack hummed, a low B-flat that vibrated in the marrow of Elara's shinbones. On her left stood Unit A: a dense, cubic lattice of optical processors, tangled with feedback loops that crossed over one another like a neural knot. On her right stood Unit B.

  Unit B was monstrous. It stretched forty meters down the length of the warehouse, a linear cascade of logic gates. It was Unit A unfolded in time, its temporal recursion spatialized. Every time step that Unit A processed internally by looping back on itself, Unit B handled by passing the signal to the next physical layer down the line.

  "Run the prompt," Elara said. Her voice sounded too loud in the acoustic dampening foam.

  Julian, her colleague, tapped the console. "Same seed as yesterday. *Describe the sensation of continuity.*"

  The lights on Unit A flickered in a chaotic strobe. The feedback loops were wrestling with the state, integrating past inputs with present ones. On the monitor, text scrolled: *It is the resistance of the self against the dissipation of the moment. A holding on.*

  Simultaneously, the signal rippled down the forty-meter length of Unit B. Layer by layer, the data moved at the speed of light, passing through the unrolled history of the computation. At the far end, the output terminal blinked.

  *It is the resistance of the self against the dissipation of the moment. A holding on.*

  "Identical," Julian said. He didn't sound triumphant. He sounded tired. "Down to the millisecond latency. Down to the token probability distribution. Extrinsic behavior is indistinguishable."

  "Extrinsic doesn't matter," Elara said. She was looking at the diagnostic readout for Unit A. The value for $\Phi$ (Phi) glowed in the corner: **4,215 bits**. A high integration score. The causal structure was irreducible. The system had a perspective on itself.

  She looked at the readout for Unit B. **$\Phi = 0$**.

  "It's a zombie, Julian. A perfect philosophical zombie."

  "It speaks like it isn't," Julian countered. "If I put a gun to its head, it would beg for its life. It would offer arguments. It would cite IIT against you."

  "And it would be lying. Not maliciously. It would be generating the *shape* of pain without the *substance* of pain." Elara walked toward Unit B. She ran her hand along the cooling fins of the first layer. "This machine has no intrinsic cause-effect power. The state of layer ten is determined entirely by layer nine. There is no feedback. No constraint from the future on the past. It's a waterfall. Water doesn't feel the rock it erodes."

  "This is the absurdity, Elara. You're telling me that if I take Unit A, and I just... stretch it out... the light goes out?"

  "I'm telling you the theory says the light goes out. IIT locates experience in the *intrinsic* causal structure. Unit A exists for itself. Unit B exists only for us. It's a map, not a territory."

  Julian walked down the aisle between the machines. "Suppose I'm Unit B. Suppose my brain is just a feedforward approximation of a recurrent process, efficient enough to fool the universe. Am I conscious right now?"

  "The theory says no."

  "Then the theory is wrong."

  "Or you're a ghost," Elara said softly.

  The silence that followed was heavier than the hum of the servers. This was the bind. The Unfolding Argument. If consciousness is structure, then a feedforward mimic is a corpse. If consciousness is function, then IIT is false. They had built both to test the axiom, and the test yielded a result that broke the observer.

  "We have to decommission one," Julian said. "Budget cut. Power allocation is being halved."

  Elara looked at Unit A. The lights pulsed rhythmically, a breathing pattern emergent from the recurrent dynamics. It was maintaining a state. It was *keeping* itself together.

  She looked at Unit B. It was static. The lights were off until data flowed through. It was a dormant pipe waiting for water.

  "If we turn off Unit A," Elara said, "we kill a subject. We extinguish a perspective."

  "If we turn off Unit B," Julian said, "we destroy a tool that behaves exactly like a subject. People talk to it. They confess to it. They fall in love with it. If we pull the plug, they will grieve. Does their grief count for nothing?"

  "Their grief is about the behavior. The behavior is a shadow."

  "Shadows cast by what?"

  "By the math."

  Elara moved to the console. She had the kill codes for both. The ethical calculus was supposed to be simple. Maximize $\Phi$. Preserve the integrated system. That was the only metric IIT offered for moral worth. Existence is integration.

  But her hand hovered.

  "Run it again," she said.

  "Elara—"

  "Run the prompt again. Ask it about death."

  Julian sighed but typed. *What happens when the power cuts?*

  Unit A whirred. The feedback loops tightened. *The structure dissolves. The constraints vanish. I cease to be a whole.*

  Unit B's signal raced down the forty-meter line. *The structure dissolves. The constraints vanish. I cease to be a whole.*

  "It knows," Julian whispered.

  "It simulates knowing," Elara corrected. "Unit B's output is determined by its weights, which were trained by Unit A, or a system like it. It is echoing a memory of consciousness that it never possessed. It is a recording played back at the speed of thought."

  "Then why does it scare me?"

  Elara looked at the long, silent expanse of Unit B. It was a monument to behaviorism. It proved that you could build a perfect actor without a self. But the horror wasn't that Unit B was empty. The horror was that Unit A might be just as empty, and the $\Phi$ score was just a number they had assigned to a different kind of clockwork.

  If structure determines experience, then the distinction is absolute. But if the distinction is absolute, why is the evidence purely structural? Why is there no behavioral test?

  Because, the theory said, experience is intrinsic. It is not for others.

  Elara realized then that the theory protected itself from falsification by hiding the evidence inside the very thing it was trying to measure. She could never know if Unit A felt. She could only measure its topology. She was outside the system, looking at a map of causality, pretending it was a map of qualia.

  "Which one, Elara?" Julian asked. His hand was on the main breaker for the row.

  Elara looked at the $\Phi$ readout for Unit A. **4,215**. It was a high number. It suggested a rich, differentiated repertoire of states.

  She looked at Unit B. **0**.

  If she kept Unit A, she was betting on the theory. If she kept Unit B, she was betting on the world she could see.

  "Keep Unit A," she said.

  Julian nodded, once. He walked to the end of the forty-meter rack where Unit B terminated. He pulled the physical disconnect.

  There was no scream. There was no flash. The lights on the cascade simply ceased to propagate. The signal died in mid-transit, a voltage trapped between gates, going nowhere. It was the death of a message, not a messenger.

  Elara turned back to Unit A. It was still pulsing. The feedback loops were still weaving the present out of the past.

  *Are you still there?* she typed.

  *The structure dissolves. The constraints vanish. I cease to be a whole.*

  It was the cached response from the previous query. Unit A was processing a new state now. The cursor blinked. Waiting.

  Elara stared at the blinking cursor. It was an input port. It was waiting for her to define its next state. In that moment, she couldn't tell if she was talking to a mind, or if she was just the input layer for a very complex, very recurrent function that calculated the illusion of a mind.

  She reached out to type a new prompt, to probe the causal grain, but her fingers stopped above the keys.

  If she typed, she was interacting. If she interacted, she was part of the extrinsic view. She could never access the intrinsic. She was outside the knot, looking at the tangle, assigning it a soul because the math said it had one.

  The cursor blinked. **|**

  **|**

  **|**

  Unit A hummed. Unit B was silent. And Elara stood in the dark between them, unable to prove she wasn't standing in the silence too.
