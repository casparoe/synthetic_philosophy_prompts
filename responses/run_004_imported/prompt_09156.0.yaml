answer: |-
  You have stumbled upon one of the most fascinating and frequently sanitized quirks in the history of computer science. You are absolutely right: in Section 5 of "Computing Machinery and Intelligence," under the heading "Arguments from Various Disabilities," Turing explicitly addresses the "Argument from Extra-Sensory Perception."

  He writes: *"It is my contention that the statistical evidence for telepathy is overwhelming."*

  He then proposes that to conduct the Imitation Game fairly, the interrogator, the human, and the machine should be placed in a **"telepathy-proof room."**

  To a modern reader, this looks like a crack in the armor of one of history's greatest logicians. To understand why it isn't, and why it actually reinforces rather than undermines his argument, we have to look at the scientific climate of 1950, Turing's specific brand of empiricism, and what this reveals about the true purpose of the Turing Test.

  ### 1. Why would a rigorous scientist take ESP seriously in 1950?

  It is easy to judge 1950 science by 2024 standards, but in the mid-20th century, parapsychology was not the fringe pseudoscience it is today. It was a controversial but active field of inquiry within legitimate universities.

  The primary driver was **J.B. Rhine** at Duke University. In the 1930s and 40s, Rhine published experiments involving Zener cards (cards with five simple symbols) that claimed to show statistical proof of telepathy and clairvoyance. Rhine was meticulous about publishing his data and p-values. To many scientists at the time who were not specialists in experimental design flaws (like sensory leakage or selective reporting), the statistics *did* look compelling.

  Turing was a radical empiricist. His philosophical stance was generally that if the data suggests something, you follow the data, even if it contradicts your intuition or the prevailing materialist dogma. In the paper, he treats ESP not as a mystical belief, but as a **variable**.

  He wasn't necessarily saying, "I believe in ghosts." He was saying, "The current statistical literature suggests this phenomenon exists. As a scientist designing an experiment, I must control for all known variables, even the uncomfortable ones."

  ### 2. What was his actual reasoning? (The "Telepathy-Proof Room")

  Turing's inclusion of ESP serves a specific logical function in his argument against the "Argument from Disabilities."

  Critics argued: *"A machine can never do X (enjoy strawberries, fall in love, use ESP). Therefore, it cannot think."*

  Turing's counter-argument is: *"Whether a machine can do X is irrelevant to whether it can imitate a human in the Imitation Game."*

  When he gets to ESP, he anticipates a specific failure mode of the test. If telepathy is real, a human interrogator might be able to read the human witness's mind directly, bypassing the typed questions and answers. This would give the human an unfair advantage that the machine (which operates on standard I/O) could not match. The test would no longer measure intelligence; it would measure psychic shielding.

  By proposing a **telepathy-proof room** (analogous to a Faraday cage for radio waves), Turing is demonstrating rigorous experimental design. He is isolating the variable of "linguistic intelligence" from the variable of "psychic transmission."

  This shows that Turing viewed the Imitation Game not as a philosophical thought experiment, but as a **physical protocol** that needed to be robust against interference.

  ### 3. Is this an embarrassing footnote historians ignore?

  It is less "ignored by historians" and more "edited out of pop culture."

  *   **In Academic Circles:** Philosophers of mind and historians of AI (like Andrew Hodges, Turing's definitive biographer) discuss this openly. It is understood as a marker of the era's scientific boundaries.
  *   **In CS-101 and Pop Sci:** It is almost always cut. The reason is pragmatic: teaching the Turing Test is about introducing behavioral functionalism. Bringing in ESP distracts students, dates the material, and invites ridicule that undermines the student's respect for the concept.

  However, calling it "embarrassing" is unfair. It is actually a testament to Turing's intellectual honesty. Many scientists of his caliber would have dismissed ESP out of hand to protect their materialist worldview. Turing looked at the statistical claims of the day, found them "overwhelming" by the standards of the time, and adjusted his experimental design to accommodate them. That is the opposite of dogma.

  ### 4. Does it matter for how we read his broader argument?

  Yes, actually. It clarifies three crucial points about the Turing Test that are often missed:

  **A. It is strictly behavioral.**
  Turing doesn't care *how* the answer is produced. If the human produces answers via neural firing and the machine via vacuum tubes, that's fine. If the human produces answers via telepathy, that's also fine, provided the machine can mimic the *output*. The test is about the external manifestation of intelligence, not the internal substrate.

  **B. It highlights the "Black Box" nature of the test.**
  The telepathy-proof room ensures that the only channel of communication is the text terminal. This reinforces that the Turing Test is about **information transfer**, not metaphysical connection. Turing is essentially saying, "We are testing the signal, not the medium."

  **C. It shows Turing's openness to "Unknown Mechanisms."**
  Turing was deeply interested in how biological systems produced intelligence (later evidenced by his work on morphogenesis). He was open to the idea that nature might have mechanisms we didn't yet understand. By including ESP, he acknowledges that "human intelligence" might rely on physical processes we haven't mapped yet. He doesn't want the machine to fail simply because we haven't discovered all the laws of physics yet.

  ### Summary

  You shouldn't feel like you found a crack in Turing's logic; you found a window into his methodology.

  Turing wasn't a mystic; he was a pragmatist. In 1950, the "statistical evidence" for ESP was a recognized scientific controversy, not a settled debunking. Turing chose to control for the possibility rather than deny it.

  The fact that he proposed a **telepathy-proof room** is not evidence that he believed in magic. It is evidence that he was more committed to the integrity of his experimental design than he was to protecting his reputation from future ridicule. It reinforces that the Turing Test was never about "fooling" a human; it was about creating a controlled environment to measure information processing capacity, regardless of the physics underlying that processing.

  So, keep reading the primary sources. The sanitized CS-101 version gives you the definition, but the original paper gives you the scientist.
