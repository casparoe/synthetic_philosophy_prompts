answer: |-
  **Title:** The Normative Glue: Why Gilbert's Plural Subject Theory Wins the Ontology of Shared Intention

  **Introduction**

  The central problem in social ontology is deceptively simple: what distinguishes us *sharing* an intention from you and me merely having coinciding individual intentions? If we both intend to go to New York, but I am going to meet you and you are going to meet me, we are coordinating. But if we intend to *go together*, something distinctively social has occurred. In the debate between Michael Bratman's reductive planning theory, John Searle's primitive we-intentions, and Margaret Gilbert's plural subject theory, the stakes are high. Bratman offers ontological parsimony; Searle offers phenomenological fidelity; Gilbert offers normative robustness.

  While Bratman's account elegantly explains complex coordination and Searle's captures the immediacy of collective action, both fail to account for the specific normative texture that defines sociality. Bratman reduces obligation to reliance, and Searle locates the collective inside the individual mind. This essay argues that Margaret Gilbert's Plural Subject Theory provides the superior ontological account. By analyzing the standard "sofa-carrying" case alongside a "spontaneous car-pushing" case, I will demonstrate that only Gilbert's framework of joint commitment can generate the mutual entitlements and obligations that constitute shared agency, without resorting to Searle's unexplained primitives or collapsing into Bratman's aggregated individualism.

  **Bratman: The Architecture of Coordination and its Limits**

  Michael Bratman's shared intention theory is a marvel of engineering. He argues that "we intend to J" is reducible to a structure of interlocking "I-intentions." I intend that we J; you intend that we J; we know this; and our sub-plans mesh. In the classic case of two people carrying a sofa, Bratman's model shines. We discuss the route, I adjust my grip based on your plan, and we possess common knowledge of our interlocking intentions. If I drop my end, I frustrate your plan and violate your reliance interests.

  However, Bratman's machinery jams when tested against the case of zero prior discussion. Consider two strangers who see a car stall in the street. Without a word, they both rush to the back and push. There is no time for the negotiation of sub-plans, nor is there a robust history of common knowledge building. Bratman might argue that the act of pushing itself signals the intention, creating instant common knowledge. But this stretches the concept of "planning" to the breaking point. Planning implies a temporal extension and a cognitive architecture that spontaneous action bypasses.

  More damning is the normative deficit. For Bratman, if I stop pushing the car halfway through, I have frustrated your reliance. You are disappointed, perhaps inconvenienced. But do you have the *right* to rebuke me? In Bratman's world, I have violated a prediction I led you to make, but I haven't necessarily violated a commitment *to you*. As Gilbert points out, shared intention involves a specific deontic power: the right to demand compliance. Bratman's reduction leaves this out. He gives us a theory of *coordinated individual action*, but not *shared agency*.

  **Searle: The Primitive "We" and the Black Box**

  John Searle attempts to solve the spontaneity problem by positing that "we-intentions" are a biological primitive. Just as I can have an "I-intention," my brain is capable of a "we-intention" that is not reducible to I-intentions. In the spontaneous car-pushing case, Searle is phenomenologically correct: I do not think "I intend that we push." I simply experience "we are pushing."

  Searle wins on speed, but he loses on ontology. Searle insists that collective intentionality exists in the head of each individual. He writes, "Collective intentionality is a biological primitive... it exists in the heads of individuals." This is an ontological sleight of hand. If the "we" exists only in my head and only in your head, where is the *social* relation? Searle provides a psychology of sociality, but not a social ontology.

  Furthermore, Searle fails to explain the source of the obligation. If my we-intention is just a state of my brain, why does stopping the push wrong *you*? Why am I accountable to you rather than just failing my own internal consistency? Searle asserts the normativity of we-intentions but offers no mechanism for how a mental state in one skull generates a binding obligation to another skull. It is a black box that labels the problem "primitive" rather than solving it.

  **Gilbert: Joint Commitment as the Social Glue**

  Margaret Gilbert's Plural Subject Theory bridges the gap. She argues that shared intention is constituted by a "joint commitment." This is not a sum of personal commitments (I commit + you commit), but a single commitment to which both parties are jointly bound. This commitment creates a "plural subject"—an entity formed by the pooling of wills.

  In the sofa case, Gilbert agrees with Bratman that coordination matters, but she locates the essence in the commitment, not the planning. In the spontaneous car-pushing case, Gilbert's theory proves superior to both rivals. She argues that joint commitment does not require explicit verbal agreement. It requires only that each party expresses readiness to enter the commitment and this is mutually understood. A nod, or even the physical act of moving to the car in a context where help is needed, can signal this readiness.

  Crucially, Gilbert captures the normativity that Bratman misses and Searle mystifies. Once the joint commitment is in place (even instantly), each party is obligated to the other to perform their part. If I stop pushing the car to check my phone, you are entitled to say, "Hey, we're doing this!" This rebuke is not just an expression of disappointment (Bratman) or a violation of my own internal we-mode (Searle); it is an appeal to a normative standard we created *together*. The obligation exists *between* us, not just in our heads or in our plans.

  **Defending the Verdict: Objections and Qualifications**

  The strongest objection to Gilbert is ontological parsimony. Bratmanians argue that we should not multiply entities beyond necessity. Why posit a "plural subject" when interlocking I-intentions suffice? The verdict here rests on whether the "plural subject" is a new metaphysical entity or a normative status. Gilbert argues the latter. It is not a mystical group mind; it is a specific deontic relationship. If we accept that obligations exist (and legal and moral systems rely on them), then Gilbert is not adding spooky ontology, but accurately describing the normative reality that Bratman tries to explain away. If Bratman cannot explain the *right to rebuke*, his parsimony is purchased at the cost of accuracy.

  A second objection targets the spontaneous car case. Critics argue that Gilbert's "expression of readiness" still requires too much cognitive overhead for split-second action. However, this underestimates the role of context. In a social world, certain contexts (a stalled car, a heavy object) carry standing offers of joint commitment. By stepping into the role, the commitment is instantiated. This is less cognitively demanding than Bratman's requirement for meshing sub-plans and more ontologically grounded than Searle's brute psychology.

  Finally, one might argue that Searle is right about the phenomenology: it *feels* like a primitive we-intention. But phenomenology is not ontology. The fact that I feel a unity does not mean the unity is a mental primitive; it may be the felt experience of being bound by a joint commitment. Gilbert explains *why* it feels that way: because I am no longer acting solely as an individual, but as a member of a plural subject.

  **Conclusion**

  In the triad of social ontology, Bratman explains the *how* of coordination, and Searle describes the *feel* of collective action, but only Gilbert explains the *what* of shared agency. The defining feature of shared intention is not merely that our actions mesh, nor that we have a special mental state, but that we are bound to one another.

  Bratman fails because he cannot generate the obligation to the other from a pile of individual intentions. Searle fails because he locates the social in the individual mind, obscuring the relational nature of the bond. Gilbert wins because she identifies that shared intention is inherently normative. Whether carrying a sofa through careful planning or pushing a car in a moment of spontaneity, what makes the action *shared* is that we are answerable to each other. Without the joint commitment, we are just two individuals moving an object. With it, we are a "we." Therefore, for any ontology that aims to capture the essence of the social, Gilbert's Plural Subject Theory is the necessary foundation.
