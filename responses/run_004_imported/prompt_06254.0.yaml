          *   Address the "Justification vs. Excuse" distinction (crucial for the prompt). Unjust soldiers aren't necessarily villains, but their killing isn't *right*.
          *   Frame this as an "individualist" view of war.
      *   **Section 3: Evaluating the Moral Status (The Verdict):**
