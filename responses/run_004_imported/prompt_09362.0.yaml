      *   *Chalmers' Strength:* Provides a methodology for testing. Acknowledges that even if verbal, there might be a pragmatic dispute about language choice.
      *   *Chalmers' Weakness:* Leaves open the possibility of a "residual" substantive dispute about which language to use.
      *   *Sider's Strength:* Preserves the idea that metaphysics is about *truth*, not just language. Explains why we care about ontology (we want to know what's *really* there).
      *   *Sider's Weakness:* Relies on a controversial notion of "fundamental structure" or "joint-carving." Hard to verify which quantifier carves best.

  4.  **Formulate a Verdict:**
