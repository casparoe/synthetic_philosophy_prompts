          *   Ted Sider: Joint-carving (the case for "substantive").
      *   **Task:** Weigh these arguments, reach a definite verdict (verbal, substantive, or other), and provide practical advice for the user and their friend.
      *   **Format:** Essay.

  2.  **Deconstruct the Arguments:**

