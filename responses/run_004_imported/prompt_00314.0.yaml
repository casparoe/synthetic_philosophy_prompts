  2.  **Deconstruct the Lucas-Penrose Argument (The "Airtight" Inference):**
      *   Premise 1: For any consistent formal system $F$ capable of arithmetic, there is a Gödel sentence $G_F$ that is true but unprovable within $F$.
      *   Premise 2: A human mathematician can "see" that $G_F$ is true.
      *   Premise 3: If the human mind were a formal system $M$, there would be a $G_M$ unprovable by $M$ but true.
