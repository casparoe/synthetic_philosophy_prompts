answer: |-
  Here is a option that fits the party setting, keeps the tone dry/burned-out, and hits the specific mechanical beat of the thought experiment (the instability of the decision itself acting as evidence).

  **The Setup:**
  A guest finds Priya standing alone near the coat rack, staring at her phone but not typing. They ask, "Hey, you heading out?"

  **The Joke:**
  > "I want to. But every time I resolve to leave, that resolution becomes evidence that the disaster is waiting outside. So I resolve to stay. But then staying becomes evidence that the disaster is in here. I'm not antisocial, I'm just causally unratifiable. Pour me another drink."

  ***

  **Why this works:**

  *   **For the Layperson:** It reads as a dark, self-deprecating joke about anxiety or overthinking. They hear: *"I'm so worried about making the wrong move that I can't move at all."* The phrase "causally unratifiable" sounds like fancy jargon for "I can't make up my mind."
  *   **For the Theory Nerd:** It hits the specific failure mode of Causal Decision Theory (CDT) in the *Death in Damascus* case. The "resolution" acting as "evidence" is the core evidential wrinkle, and "unratifiable" is the precise technical term for a decision that, once made, gives you reason to change it. The "disaster" mirrors Death's presence.
  *   **For Priya:** It's bleak enough to show her burnout. She's not using the theory to solve problems; she's using it to explain why she's paralyzed at a keg party.

  **Alternative (if you want it shorter/punchier):**

  > "I stopped making plans. Turns out my agency is a perfect predictor of doom. If I decide to go somewhere, that's the exact place I shouldn't be. I'm currently optimizing for staying in bed. It's the only Nash equilibrium that doesn't involve a scythe."

  *(Note: This one swaps "unratifiable" for "Nash equilibrium," which is technically game theory, but often gets conflated in party banter. Stick to the first one if you want strict decision theory accuracy.)*
