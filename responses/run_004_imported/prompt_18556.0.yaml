answer: |-
  **Keynes:** You must have read the piece, G.E. "Economic Possibilities." I confess, writing it felt like drafting a will for a civilization that hasn't yet been born. A hundred years hence, I argue, the economic problem will be solved. Scarcity will be broken. And yet, as I wrote the words, I felt a chill. We spent our youth in that room at Trinity, treating your sixth chapter as a gospel: that states of affection and the contemplation of beauty are the *only* things valuable in themselves. But now I wonder if we read you selectively. We ignored your cautions on conduct. We assumed that once the chains of want were removed, everyone would naturally walk into your garden. I am no longer sure they will.

  **Moore:** I am not surprised by the chill, Maynard. But I must correct the implication. The truth of a proposition does not depend on the readiness of the audience to accept it. If affection and beauty are the sole intrinsic goods, as I argued, they remain so whether humanity is starving or sated. Your anxiety seems to be not about the *good*, but about the *psychology* of the good. You fear that when the necessity of labor vanishes, the capacity for enjoyment will vanish with it. But that is a failure of education, not a failure of ethics.

  **Keynes:** Is it merely education? Or did your own book contain a quiet admission that most men cannot live by the Ideal? You devoted that separate, drier section to why ordinary conduct must be governed by rules and conventions, not by direct appeals to the good. My circle of Apostles treated that as a footnote for the uninitiated. We thought we were the elite who could bypass the rules. But looking at the world now, I suspect you were the realist and we were the dreamers. If the majority require "useful fictions"—like the virtue of thrift, or even avarice—to function, does that not undercut the universal applicability of your heaven?

  **Moore:** It undercuts nothing, because you are conflating *means* with *ends*. I conceded that rules are necessary *instrumentally* to prevent harm and maintain order. I never conceded that following rules is *intrinsically* good. If a man must practice avarice to accumulate capital that eventually funds his leisure, the avarice remains a vice, even if it is a useful one. Your error in "My Early Beliefs" was not in loving the Ideal, but in assuming that the transition to it required no moral cost. The cost is real, but it does not change the destination.

  **Keynes:** But what if the cost consumes the traveler? I speak of this "purposiveness" bred into us. We are built to aim, to strive, to solve. If I tell my grandchildren that they need no longer strive, I am not liberating them; I am amputating a limb. For the transition to work, we must treat the love of money as a virtue for at least another century. We must ask people to love the chains because the chains build the key. If we spend three generations sanctifying the means, how do we switch the switch when the time comes? The fiction becomes the fact.

  **Moore:** That is a historical prediction, Maynard, not an ethical truth. You are describing a habit of mind formed by scarcity. You say it is "bred-in," but I see no biological evidence for it. It is a superstition instilled by the economic conditions you describe. If you accept that purposiveness is an immutable human trait, you surrender ethics to anthropology. My point was precisely that we must judge our habits by the standard of the Good, not judge the Good by the standard of our habits. If they love the chains, they are mistaken.

  **Keynes:** Mistaken, yes. But dangerously so? If I tell the worker today that his greed is a sin, he stops working, the economy collapses, and the leisure never arrives. If I tell him it is a virtue, he works, the surplus grows, but he becomes a man who knows only how to want, not how to have. I am trapped in your neglected chapter on conduct, G.E. You told us rules were necessary for the imperfect. I am beginning to think we are all imperfect, and the rules of the economic game are the only religion we can actually practice. Your religion requires a saintliness I do not see in the species.

  **Moore:** Then the species must grow up. You speak as if the "Good" is a luxury item to be purchased once the economy is solvent. It is not. It is the only reason to be solvent at all. If you perpetuate the vice of avarice to secure the future, you risk creating a future that is wealthy but blind. You ask if we can switch the switch. I ask: why are you holding it? If you know the avarice is a fiction, you must teach that it is a fiction, even while you use it. To call it a virtue is the lie, not the rule.

  **Keynes:** Because the lie must be believed to work! That is the tragedy of the statesman. The Apostle can speak the truth to a few friends in a room; the economist must speak a language the market understands. If I publicly denounce the love of money while relying on it to fund the National Mutual, I am a hypocrite, and the system loses trust. So I validate the vice to secure the condition for the virtue. But this leaves me with a dread: that when the scarcity ends, we will find we have bred a race of purposeful ants who cannot comprehend the flower they were working to grow.

  **Moore:** That is a failure of imagination, not inevitability. You assume that because the *energy* was spent on accumulation, the *capacity* for feeling is exhausted. But look at your own life. You work furiously, yet you value art, you value friendship. Why assume your grandchildren cannot do the same? The distinction I drew in *Principia* was sharp: organic wholes. A life can contain both the struggle and the appreciation. You need not destroy the capacity for one to achieve the other. You are painting a false dichotomy between the worker and the contemplator.

  **Keynes:** In me, perhaps. But I am not the average man. I worry that the "organic whole" you describe requires a unity of character that industrial society actively fractures. We divide the day: eight hours for the vice of industry, eight for sleep, and the remainder for... what? If the remainder is merely recovery for more industry, it is not contemplation. I fear that without the pressure of need, the "remainder" becomes a void. And nature abhors a void. They will invent new scarcities, new struggles, just to feel purposeful again.

  **Moore:** Then they will be wrong, just as they are wrong now when they value money over beauty. Your job, and mine, is not to predict their errors but to define the truth they are missing. If they invent new scarcities, that proves they have not solved the economic problem in the moral sense, only the technical one. You are worried about their happiness. I am worried about their Good. They are not the same. They may be unhappy in the pursuit of the Good, but they cannot be truly well-off without it.

  **Keynes:** There it is. The impasse. You are willing to sacrifice their happiness for the Good. I am willing to compromise the Good to ensure they are happy, or at least occupied. I look at your "states of affection" and I see a fragile thing. It requires peace, security, and a certain softness of mind. I am trying to build the fortress that protects that fragility. But to build the fortress, I must use hard stones and sharp tools. I fear the fortress will be so imposing that no one dares to live inside it.

  **Moore:** And I fear that if you focus only on the fortress, you will forget why you built it. You say you are compromising the Good. I say you are merely managing the Means. Do not elevate the management to the status of philosophy. Keep your hard stones, Maynard. Use your avarice if you must. But do not tell me, and do not tell them, that the stones are the cathedral. If you keep that distinction clear, your "useful fictions" do not undercut my Ideal. They merely delay it.

  **Keynes:** Delay is the enemy when the delay consumes the life. But perhaps you are right. Perhaps I am asking ethics to do the work of psychology. I want a guarantee that the transition will be smooth. You offer no guarantees, only a compass. I suppose I must return to the desk and manage the delay, while hoping that when the doors open, someone remembers how to pray.

  **Moore:** They will remember, if someone teaches them. Not economics. Not conduct. But what it means to love. That was the religion we shared, before the world intervened. Do not let the necessity of the journey make you forget the destination. The stones are necessary, Maynard. But they are not the point.
