  3.  **Drafting - Turn by Turn:**

      *   *Turn 1 (Keynes):* Open the scene. Acknowledge the essay ("Grandchildren"). Raise the core tension: We thought we were saving the world for the Ideal, but now I wonder if the world can handle the Ideal.
      *   *Turn 2 (Moore):* Respond to the pessimism. Reaffirm the *Principia*. The Ideal hasn't changed; only the conditions have.
