      *   *Turn 5 (Keynes):* Push harder. If the "means" (avarice, purpose) are required for centuries, they become the reality. The "useful fiction" swallows the truth. Can the flower grow in that soil?
      *   *Turn 6 (Moore):* Challenge the psychology. Is it bred-in, or habit? If it's habit, it can be unlearned. Don't confuse historical accident with human nature.
      *   *Turn 7 (Keynes):* It feels bred-in. Purposiveness. We are built to strive, not to enjoy. If we abolish the struggle, do we abolish the capacity to value the result?
