answer: |-
  **Setting:** *A quiet corner of the university faculty lounge. Rain streaks the window. Two philosophers, ELENA (proponent of the Self-Sampling Assumption) and MARCUS (proponent of the Self-Indication Assumption), sit with notebooks open. They have been discussing the "Digital Future" case for an hour.*

  **ELENA:** Let's lock in the numbers so we don't talk past each other. Physical evidence is neutral. Prior credence in Hypothesis A (Extinction/Bio) and Hypothesis B (Digital/Expansion) is 50/50. The only new data is the indexical fact: *I am an early, biological, uncopied observer.*

  **MARCUS:** Agreed. And the observer counts are clear?

  **ELENA:** Hypothesis A: 200 billion total observer-moments, all biological. Hypothesis B: 200 billion biological, followed by 200 quadrillion digital. A factor of one million difference in the post-biological phase.

  **MARCUS:** So, my credence remains 50/50.

  **ELENA:** And mine is effectively 100% for Hypothesis A.

  **MARCUS:** *[Leans back]* That is the Doomsday Argument in its starkest form. You're saying that because I find myself in the first 0.0001% of the potential timeline of World B, World B is virtually impossible?

  **ELENA:** I'm saying that under SSA, I must reason as if I am a random sample from my reference class. If World B is true, and if digital minds are in my reference class, then the probability of me finding myself as one of the rare, early biological ancestors is one in a million. In World A, it's certainty. The likelihood ratio is $1,000,000:1$ in favor of A. The physical evidence was 1:1. The math dictates A.

  **MARCUS:** But that ignores the ontological weight of World B. Under SIA, the sheer number of observers in World B boosts its prior probability by that same factor of one million. Before I even looked at my birth rank, SIA told me World B was a million times more likely than A. When I condition on being biological, I apply the likelihood penalty—the fact that biological observers are rare in B. The million-fold prior boost and the million-fold likelihood penalty cancel out exactly. I end up back at 50/50.

  **ELENA:** And that is exactly why I find SIA dangerous. You're willing to believe in quadrillions of unseen digital minds *a priori*, just because they *could* exist. That's the Presumptuous Philosopher objection. You're letting metaphysical speculation about future copies override the empirical silence.

  **MARCUS:** And I find your position dangerous for the opposite reason. You're predicting the extinction of our civilization based entirely on a probabilistic argument about your own birth rank. That's the Doomsday objection. But notice something about this specific case, Elena. The "Digital" nature of Hypothesis B changes the stakes.

