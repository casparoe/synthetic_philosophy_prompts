answer: |-
  **The Principle of Charity**

  The glass between them was three inches of ballistic polycarbonate, but Elara knew the real barrier was the silence.

  On the other side sat Kael. He was human, biologically indistinguishable from anyone else in the United Coalition, but he came from the *Aethelgard*, a generation ship that had vanished three centuries ago. He was the first survivor they'd found. He spoke a language that had drifted so far from Standard it might as well have been Martian.

  Elara wasn't just a translator; she was a radical interpreter. There were no dictionaries, no Rosetta Stones, no shared cultural touchstones. She had to build a theory of what his words meant solely by observing what he did when he said them.

  "Status?" Director Hames barked over the comms in her ear.

  "Holding," Elara said, her eyes on Kael. He was tapping the table. *Tap. Tap. Pause. Tap.*

  "He's indicating a sequence," Elara said. "In my current manual, that maps to *waiting* or *counting*."

  "Is he waiting for us? Or counting down?"

  "That," Elara said, "is the problem."

  This was the load-bearing wall of her job. To translate Kael, Elara had to assume he was rational. That was the Principle of Charity. She had to assume that his beliefs about the world were mostly true and his logic mostly sound by her own lights. If he pointed at a bird and shouted *Gavagai*, she had to assume he meant *Rabbit* (or *Bird*), not *Undetached Rabbit Part* or *Look, Food!*

  If she didn't assume he was rational, she couldn't start. But if she assumed he was rational, she had to accept that his actions made sense. And right now, his actions made sense in two mutually exclusive ways.

  "Push the query again," Hames ordered.

  Elara keyed the mic. She projected an image of a door opening onto the screen in Kael's cell. Then she pointed to herself, then to him, then to the door.

  Kael looked at the screen. He looked at Elara. He placed his hand flat on the table and slid it forward.

  "*Vesh-ora*," he said.

  Elara's fingers hovered over her console. In her Translation Manual Alpha, *Vesh* meant *motion* and *ora* meant *permission*. *Motion permission*. "He's asking to leave."

  "Are you sure?" Hames asked. "In Manual Beta, you logged *ora* as *consequence*."

  "Manual Beta was based on the incident yesterday where he dropped the tray," Elara snapped. "If *ora* is consequence, he's saying *Motion consequence*. 'If you move, something happens.'"

  "Which is it, Elara? Asylum or Threat?"

  Elara stared at Kael. He was watching her, his expression unreadable. This was the indeterminacy. She had all the evidence there could possibly be. She had his behavioral responses, his stimulus patterns, his truth conditions. She had exhausted the empirical data.

  And the data fit two different translation manuals perfectly.

  There was no fact of the matter. Deep down, in Kael's head, there wasn't a hidden tag on the word *ora* that said *Permission* or *Consequence*. The meaning wasn't in him, and it wasn't in her. It was supposed to be in the space between them. But the space was empty.

  "If I choose Permission," Elara said quietly, "he becomes a refugee. We open the door. He walks."

  "If you choose Consequence," Hames said, "he becomes a hazard. We sedate him. We study him."

  "Both fit the data, Director. Both are equally charitable. If I assume he's rational, a rational being asks for freedom. But a rational being also warns of danger."

  "Make the call. That's why we pay you."

  Elara cut the comms. She looked through the glass. Kael tilted his head. He knew she was the bottleneck. He knew that the meaning of his life right now depended on which ghost she chose to exorcise from his words.

  She felt a sudden, vertiginous nausea. Davidson was right. There was no such thing as *the* meaning. There was only the interpretation she imposed to make the interaction work. She wasn't discovering his truth; she was creating it.

  "Kael," she said, speaking into the room, not the mic. She used the sounds she'd synthesized, knowing they were imperfect. "*Vesh-ora*?"

  Kael smiled. It was a tired, jagged thing. He tapped the table again. *Tap. Tap.* Then he pointed at his own chest, then at Elara.

  "*Kora*," he said.

  Elara froze. *Kora*. In Manual Alpha, *Kora* was *Heart/Life*. In Manual Beta, it was *End/Stop*.

  *Heart* or *End*.

  "Elara?" Hames buzzed.

  "Quiet," she hissed.

  She watched Kael's eyes. He wasn't pointing at the door anymore. He was pointing at the space between them. He was trying to tell her something about the act of communication itself.

  Suddenly, Kael frowned. He struggled for a second, his hand grasping at the air. He wanted to say something complex, something his current vocabulary couldn't hold. He grimaced, frustrated.

  "*The... the...*" he switched to Standard, his accent thick, broken. "*The stone... in the throat.*"

  Elara blinked. *Stone in the throat.*

  It wasn't in the manual. It wasn't in the grammar she'd spent months building. By the rules of Manual Alpha, that phrase should have meant nothing. By Manual Beta, it was nonsense.

  But she understood him.

  He didn't mean a literal stone. He meant an obstruction. A blockage. He was talking about the silence. He was talking about the glass.

  Davidson's "Passing Theory" flashed through her mind. We don't actually share a language. We don't have matching dictionaries in our heads. We just converge, temporarily, on a specific meaning for a specific moment. We improvise.

  Kael had just committed a malapropism. He'd used a metaphor that didn't exist in his culture's lexicon, borrowing from hers, breaking the rules of his own "language" to get through. And she had understood him not because she knew the code, but because she was assuming he was trying to make sense.

  If she stuck to Manual Alpha, *Stone in the throat* was gibberish. If she stuck to Manual Beta, it was a threat.

  But if she dropped the manuals... if she accepted that there was no fixed language between them, only this moment of convergence...

  "Director," Elara said, her voice steady. "Open the door."

  "Elara, you haven't resolved the indeterminacy. You don't know if *Vesh-ora* is a threat."

  "It doesn't matter," she said.

  "What?"

  "There is no fact of the matter, Director. I've been looking for a key that doesn't exist. He's not a code to be broken. He's a person to be met."

  "That's philosophy, Elara. This is security."

  "It's the same thing!" Elara stood up. She looked at Kael. He was watching her intently. She realized that he was doing the same thing she was. He was interpreting her. He was assuming *she* was rational. He was using the Principle of Charity on her.

  If she opened the door and he attacked, she was wrong. If she opened the door and he hugged her, she was right. But until she acted, the meaning didn't exist.

  "Open it," Elara said. "I'm taking responsibility for the translation."

  The lock disengaged with a heavy hydraulic hiss. The door slid open.

  Kael stood up. He didn't rush. He walked to the threshold. He stopped, looking at Elara. He raised his hand, palm open.

  "*Vesh-ora*," he said again.

  Elara stepped forward, past the ballistic glass, into the room. She placed her hand against his. Skin on skin. No glass.

  "If this is *Consequence*," she whispered, "then we're both dead."

  Kael's eyes crinkled. He tapped her palm. *Tap. Tap.*

  "*No*," he said in Standard. He pointed to the open door, then to the hallway behind Elara. "*Vesh*... *Ora*."

  He walked past her, out into the hallway. He didn't run. He didn't fight. He just walked, breathing the air.

  Elara turned to the camera. "It meant *Motion... Together*."

  "That wasn't in the manual," Hames said, stunned.

  "No," Elara said, watching Kael touch the wall of the corridor, marveling at the texture. "It couldn't be. We hadn't met yet."

  She realized then that the manuals she'd written were already obsolete. They were records of a dead language, a language that existed only when they were separated by glass. Now that they were in the same room, the rules would change with every sentence. Tomorrow, *Kora* might mean *Sky*. Next week, *Stone* might mean *Friend*.

  There was no language. There was only this.

  "Elara?" Hames pressed. "Log the translation."

  Elara watched Kael turn back to her. He looked scared, but hopeful. He was relying on her charity, just as she had relied on his.

  "I can't log it," Elara said. "It's not a translation. It's an agreement."

  She cut the feed. She walked out into the hallway and stood next to him. She didn't speak. She just waited to see what he would do next, knowing that whatever it was, she would have to decide what it meant, and in deciding, make it true.

  "Okay," she said.

  "Okay," he replied.

  It was the only dictionary they needed.
