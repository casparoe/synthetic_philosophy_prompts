      *   *Indeterminacy:* Even with all evidence, multiple translation manuals fit. There is no "fact of the matter."
      *   *Passing Theory:* Communication isn't about matching internal dictionaries (Prior Theory); it's about converging on a temporary, ad-hoc understanding for *this specific utterance*. Malapropisms prove this (Mrs. Malaprop says "allegory" meaning "alligator," and we understand her *despite* the dictionary).

