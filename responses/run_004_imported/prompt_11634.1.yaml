answer: |-
  The queue at the Transit Hub moved silently. Elian stood on the circular pad, the glass booth humming with a low-frequency vibration that reminded him too much of the retreat center in Burma. Ten years ago, during his second ten-day sit, the breath had stopped feeling like air and started feeling like voltage. Then the sounds, the thoughts, the very capacity to know sound and thought had begun to flicker. *Arising and passing away.* The teachers called it dissolution. Elian called it the static.

  Now, the technician gestured him forward. "Step to the center. Arms at your sides. Do not resist the scan."

  Elian stepped onto the platform. The door sealed. The air grew thin.

  On retreat, the insight had come in the dark behind his eyelids. The solid world had decomposed into rapid-fire pixels of sensation. *Rupa* (form) wasn't a body; it was a stuttering projection of pressure and temperature. *Vedana* (feeling) wasn't his mood; it was just raw data—pleasant, unpleasant, neutral—flashing like warning lights. He had searched for the watcher, the one observing the static, and found nothing. No pilot in the cockpit. Just the movie running without a screen. It had wrecked him for forty-eight hours. He had walked through the monastery grounds feeling like a ghost haunting his own skin.

  The machine woke up. A blue laser grid swept down from the crown of his head.

  It felt less like being read and more like being taken apart.

  The beam hit his eyes. Elian blinked, but the reflex felt delayed, like a command sent to a server that was already offline. The laser moved to his throat, his chest. He knew the theory: the scanner mapped every atom, destroyed the original biomass to conserve energy conservation laws, and transmitted the pattern to Mars where a new body was printed from local carbon.

  *Reductionism,* he thought. *Parfit.*

  If the stream is interrupted, does the water remain the same river? The philosophers said identity was just psychological continuity. But on the cushion, Elian had seen that continuity was a trick of the eye. Like a spinning propeller looking like a solid disk. The self was a label slapped on a bundle of aggregates, like calling a pile of wheels and axles a "chariot."

  The scan reached his hands.

  Suddenly, the sensation in his left palm detached from the hand itself. He felt the tingling—*vedana*—but it wasn't located anywhere. It was just floating data. Then the memory of his mother's face—*sanna* (perception)—flashed, but it had no owner. It was just an image arising in the void.

  The machine was doing externally what the meditation had done internally. It was disaggregating the bundle.

  Panic rose, but even the panic had no center. It was just a chemical spike, a *sankhara* (mental formation) firing in the dark. He tried to find the thing that was scared, the thing that needed to survive the transmission to Mars. He scanned inward, looking for the watcher who would verify the arrival.

  There was only the static.

  The blue light intensified. The hum climbed an octave. Elian realized the terror of the retreat wasn't that the self was dying, but that it had never been born. The teleporter wasn't killing him. It was just making literal what was already true: he was a process, not an entity. He was a verb pretending to be a noun.

  If the machine printed two copies, which one was the verb? If it printed one, was it the same verb conjugated differently?

  The whiteout hit.

  There was no gap. There was no darkness. There was simply the cessation of the pattern and the immediate resumption of the pattern elsewhere.

  Elian opened his eyes. He was standing on a red-dust landscape visible through the thick quartz of the arrival booth. The air smelled of recycled oxygen and ozone. A technician on the other side of the glass tapped a tablet.

  "Welcome to Ares IV. Step down carefully."

  The door hissed open. Elian stepped out. He looked at his hands. They were identical. The scar on the thumb was there. The lines on the palm were there. He took a breath. The air filled his lungs.

  But the texture was wrong.

  In the booth, before the whiteout, the sensation of breathing had been a cohesive event. Here, it felt modular. The rise of the chest was one event. The intake of air was another. The knowledge of breathing was a third. They were synchronized, but not connected. Like dubbing audio over video that was off by a fraction of a second.

  He walked toward the habitation module. His boots crunched on the regolith. *Sound.* *Contact.* *Knowing.* Arising. Passing. Arising. Passing.

  A notification pinged on his wrist comp. *Transmission Log: Buffer Error 0.04s. Packet Loss: Negligible. Continuity Verified.*

  0.04 seconds.

  Forty milliseconds of nothing. On the cushion, he had learned that the present moment was infinitely thin, that the past was memory and the future was imagination. There was only the flicker. But forty milliseconds was an eternity for a neuron to fire.

  He stopped walking. A dust storm was gathering on the horizon, a wall of red static rolling toward him.

  If the continuity was broken, even for a blink, who was standing here looking at the storm? Was he the man who stepped into the booth on Earth, or was he the copy who inherited the memory of stepping into the booth? And if there was no "man" to begin with, only a flowing cascade of aggregates, did the distinction matter?

  The wind picked up. He felt the cold bite his cheek. *Vedana.* Unpleasant.

  He waited for the fear to return, the terror of being a ghost, a copy, a glitch. But there was no one to be terrified. There was just the fear itself, hanging in the air like the dust.

  Elian looked at the horizon, then back at the teleporter booth behind him. The light inside was cycling down, ready for the next passenger. Ready to dismantle the next chariot, scatter the wheels, and reassemble them on the other side of the void.

  He took another step. Then another. The movement felt smooth, but he knew it was stuttering. He walked into the red dust, waiting for the static to clear, knowing it never would.
