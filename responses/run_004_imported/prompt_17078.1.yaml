  2.  **Analyze the Source Material (Manheim & Garrabrant 2018):**
      *   *Regressional Goodhart:* "When you select for a proxy measure, you select not only for the true goal, but also for the difference between the proxy and the goal." (Tail comes apart due to noise/variance).
      *   *Extremal Goodhart:* "When you push to extremes, the relationship between proxy and goal may break down." (Distributional shift, different regimes).
      *   *Causal Goodhart:* "When the proxy is not causally upstream of the goal, intervening on the proxy doesn't move the goal." (Correlation $\neq$ Causation).
      *   *Adversarial Goodhart:* "When you optimize for a proxy, you create an incentive for an agent to optimize the proxy at the expense of the goal." (Strategic manipulation).

