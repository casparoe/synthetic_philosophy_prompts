          *   *Analysis:* This is a bit tricky. Manheim & Garrabrant distinguish Regressional vs. Extremal.
              *   *Regressional:* Selecting for high $X$ selects for high $Y$ *plus* high noise ($X = Y + \epsilon$). If you pick the highest $X$, you pick high $\epsilon$.
              *   *Extremal:* The relationship $f(X) \approx Y$ holds in region $R$, but you move to region $R'$ where the relationship is different.
