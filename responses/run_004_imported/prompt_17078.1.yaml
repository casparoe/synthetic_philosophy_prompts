      *   In Scenario 2, the prompt says "among applicants with a 4.0 specifically... barely different from... 3.8." This implies the correlation flattens. Is this Regressional (noise dominates at the top) or Extremal (different regime)? The prompt mentions "easy course load." This suggests the *process* generating the 4.0 is different. That leans Extremal. The student's answer focuses on "extreme tail" and "normal range." This is the core definition of Extremal. I will stick with full marks, but maybe note in the comments that Regressional is a common confusion point here, so their distinction is worth praising.
