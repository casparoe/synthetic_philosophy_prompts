prompt: |-
  I've covered science and ideas for a regional daily for the better part of a decade, and I sit on our newsroom's standards committee, which meets next Tuesday to resolve a dispute that has been simmering since a correction we ran in the spring. A reporter's lede had flatly stated that a brief classroom writing exercise "closes nearly a third of the achievement gap between low- and high-income students," based on a single small randomized trial; a larger, multi-site follow-up has since found no detectable effect, and readers who had shared the original piece on social media were unhappy that we had reported an early, contested result as settled fact rather than as a hedged, attributed claim. The committee has since split into three camps over what should license a flat, unhedged assertion in our copy generally, as opposed to phrasing like "a new study suggests" or "according to researchers." One camp wants reporters held to whether the claim is actually true, period, regardless of what we could have known at the time. A second wants the bar to be that the reporter and the paper genuinely knew the claim when we published it — a bar the writing-exercise story clearly didn't clear. A third thinks both bars would silence most science and policy reporting and wants to license flat assertion whenever it was reasonable to believe the claim on the evidence available at deadline, even if that later turns out to be wrong.

  Could you draft the memo I'll circulate before the meeting? Recommend one standard, or an explicit hybrid, as our house rule, and show your work rather than just declaring a preference: apply it back to the writing-exercise story, then stress-test it against two cases the committee keeps getting stuck on. First, a single-site finding with a p-value of 0.03 that hasn't yet been retested anywhere else — is "statistically significant" close enough to "known," given how often single, barely-significant studies fail to replicate? Second, an investigative piece built on three separate sources inside an agency who, it later emerged, were all relaying the same unconfirmed internal rumor rather than verifying it independently — were we blameless in asserting it as fact even though it turned out false, and does the rule you're proposing actually agree? Please give the two camps you don't side with their strongest possible case before you set them aside, and close with the actual sentence you would add to the style guide.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas Reporter & Standards Committee Member at a regional daily.
      *   **Task:** Draft a memo to circulate before the next Standards Committee meeting.
      *   **Context:** A dispute over a correction regarding a classroom writing exercise study (initial small trial showed effect, larger follow-up showed none). Readers were unhappy about reporting contested results as settled fact.
      *   **The Conflict:** Three camps on when to use flat, unhedged assertions vs. hedged/attribution.
          *   Camp 1: Truth-based (Claim must *be* true, regardless of knowledge at time).
          *   Camp 2: Knowledge-based (Reporter/Paper must *know* it was true at the time).
          *   Camp 3: Reasonableness-based (Reasonable to believe based on evidence at deadline, even if later proven wrong).
      *   **Requirements:**
          *   Recommend one standard (or explicit hybrid).
          *   Show work/reasoning (don't just declare).
          *   Apply the standard to the original writing-exercise story.
          *   Stress-test against two specific cases:
              1.  Single-site study, p=0.03, unreplicated (Is "statistically significant" = "known"?).
              2.  Investigative piece, three sources, all relaying same unconfirmed rumor (Were we blameless? Does the rule agree?).
          *   Give the two opposing camps their strongest possible case before setting them aside.
          *   Close with the actual sentence to add to the style guide.

  2.  **Determine the Recommended Standard:**
      *   *Camp 1 (Truth)* is impossible for journalism. We aren't omniscient. If we adopt this, we can never report breaking news or science until history judges it.
      *   *Camp 2 (Knowledge)* is too strict. "Knowledge" in philosophy (Justified True Belief) is tricky. In journalism, it often implies absolute certainty. It might lead to excessive hedging ("Scientists *claim* the earth is round").
      *   *Camp 3 (Reasonableness/Process)* is the industry standard for a reason. It focuses on *due diligence* rather than *infallibility*. It aligns with legal defenses (actual malice vs. negligence) and ethical frameworks (SPJ Code of Ethics: "Seek truth and report it" implies a process).
      *   *Decision:* I need to advocate for Camp 3 (Reasonableness), but refine it to ensure it doesn't become a loophole for laziness. It needs to emphasize *quality of evidence* and *transparency about uncertainty*. Let's call it the "Reasonable Confidence" standard.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the tension. Validate the importance of the debate. State the purpose of the memo.
      *   **The Three Camps (Steel-manning):**
          *   *Camp 1 (Objective Truth):* Strongest case: Protects brand credibility long-term. Prevents "fake news" accusations. If we say it, it should be so.
          *   *Camp 2 (Subjective Knowledge):* Strongest case: Prevents "he said/she said" laziness. Forces reporters to verify, not just transcribe press releases. Ensures intent matches output.
          *   *Camp 3 (Reasonable Confidence - My Pick):* Acknowledges the fallibility of reporting while demanding rigor.
      *   **The Recommendation:** Argue for Camp 3 (Reasonable Confidence). Why? Because Camp 1 paralyzes reporting, and Camp 2 is too vague/subjective to enforce consistently. Camp 3 focuses on *process*.
      *   **Application to the Writing-Exercise Story:**
          *   Under Camp 3: Did the reporter have *reasonable confidence*? A single small trial is weak evidence for a flat claim like "closes nearly a third of the gap." The claim was too definitive for the evidence. The failure wasn't being wrong; it was the *degree of certainty* in the lede.
      *   **Stress Test 1: The P-Value Study:**
          *   Scenario: Single site, p=0.03.
          *   Application: P=0.03 means 3% chance of randomness, but replication crisis looms.
          *   Verdict: Not enough for a flat "X causes Y." Needs hedging ("suggests," "linked to"). Reasonable confidence requires looking at effect size, methodology, and context, not just the magic number.
      *   **Stress Test 2: The Three Sources/Rumor:**
          *   Scenario: 3 sources, same rumor, unverified.
          *   Application: Triangulation failed because the source tree was shallow (all one root).
          *   Verdict: Not reasonable confidence. Corroboration requires independent lines of evidence, not just multiple mouths repeating the same whisper. The rule holds us accountable here.
      *   **Style Guide Language:** Needs to be punchy, actionable, and clear.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is Camp 3 too soft?
      *   *Fix:* Emphasize that "Reasonable Confidence" requires *proportional certainty*. The strength of the assertion must match the strength of the evidence. This addresses the writing-exercise issue specifically (strong claim, weak evidence).
      *   *Tone:* Professional, collegial, but decisive. I'm a veteran reporter; I need to sound experienced, not preachy.
      *   *Formatting:* Use bolding for key points to make it skimmable for busy editors.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Mention the spring correction. It's the catalyst.
      *   *Camp 1:* Focus on "Trust." If we are wrong, we lose trust.
      *   *Camp 2:* Focus on "Intent." Did we *know*?
      *   *Camp 3:* Focus on "Process & Proportionality."
      *   *Writing Exercise:* The error wasn't reporting the study; it was the lede's certainty ("closes" vs "may close").
      *   *P-Value:* Distinguish between statistical significance and practical truth.
      *   *Rumor:* Distinguish between multiple sources and independent confirmation.
      *   *Style Guide:* "Assert facts only when..."

  6.  **Final Review against Constraints:**
      *   Did I recommend one standard? Yes (Reasonable Confidence/Process).
      *   Did I show work? Yes (applied to 3 scenarios).
      *   Did I steel-man the other two camps? Yes.
      *   Did I include the style guide sentence? Yes.
      *   Is the tone appropriate? Yes.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between Camp 2 (Knowledge) and Camp 3 (Reasonableness) is sharp, as that's the trickiest philosophical distinction. Camp 2 implies internal certainty; Camp 3 implies external justification. I will emphasize *justification*.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm blaming the reporter in the writing exercise case too harshly, but I must acknowledge the standards failure. The issue was the *lede*, not the story necessarily. The claim was "flatly stated." That's the key.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Newsroom Standards Committee
  **FROM:** [Your Name], Science & Ideas Desk
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Standard of Certainty in Factual Assertions

  **Context**

  As we prepare for Tuesday's meeting, I want to frame the debate surrounding our spring correction regarding the classroom writing-exercise study. The readership backlash was not merely about the science evolving; it was about the *tone* of our initial certainty. We reported a preliminary, single-site finding as a settled mechanism ("closes nearly a third of the achievement gap"). When the larger follow-up contradicted this, readers felt misled not because we were wrong, but because we sounded like we *knew*.

  We currently have three proposed standards for when a reporter may make a flat, unhedged assertion of fact. To move forward, we must select the standard that best balances accuracy, agility, and accountability. Below, I outline the strongest arguments for each position, recommend a path forward, and stress-test that recommendation against the specific scenarios that have stalled our progress.

  **The Three Camps: Strongest Cases**

  **1. The Truth Standard (Claim must *be* true)**
  *The Argument:* This is the only standard that fully protects the brand's long-term credibility. In an era of "fake news" accusations, our currency is infallibility. If we assert something as fact and it later proves false, we have damaged public trust, regardless of our intentions. This standard forces extreme caution, ensuring we only publish what history will vindicate. It places the burden of verification so high that errors become statistically negligible.

  **2. The Knowledge Standard (Reporter must *know* it is true)**
  *The Argument:* This standard focuses on the journalist's epistemic state and intent. It prevents "he said/she said" passivity where reporters hide behind attribution to avoid verifying claims. It demands that before a reporter types "X is Y," they have personally verified X is Y to a point of subjective certainty. It protects reporters who do the legwork from being punished by later events, but it holds them accountable if they asserted something they didn't actually verify.

  **3. The Reasonable Confidence Standard (Reasonable to believe based on evidence at deadline)**
  *The Argument:* Journalism is a first draft of history, not the final judgment. This standard acknowledges human fallibility while demanding rigorous process. It licenses flat assertions when the *weight of evidence* justifies the *degree of certainty*, even if new evidence later emerges. It aligns with legal defenses (negligence vs. actual malice) and ethical norms (SPJ Code: "Seek truth and report it" implies a process, not omniscience).

  **Recommendation: The Reasonable Confidence Standard (with Proportionality)**

  I recommend we adopt **Camp 3**, but with a crucial clarification: **Confidence must be proportional to evidence.**

  I set aside **Camp 1 (Truth)** because it is operationally impossible. If we adopt this, we cannot report on breaking news, developing science, or investigative leaks until all future consequences are known. It would paralyze the newsroom.

  I set aside **Camp 2 (Knowledge)** because "knowledge" is too internal and subjective to enforce consistently. A reporter can *feel* certain based on weak evidence (confirmation bias). A standard based on internal state is difficult to audit.

  **Camp 3** is superior because it is external and auditable. It asks: *Given what was available at deadline, was a reasonable editor justified in allowing this assertion?* However, to address the writing-exercise dispute, we must add the **Proportionality Clause**: The strength of our assertion must match the strength of the evidence. A single study warrants "suggests"; a meta-analysis warrants "shows."

  **Application to Case Studies**

  **1. The Writing-Exercise Story (The Catalyst)**
  *   *Application:* Under the Reasonable Confidence standard, the reporter was not wrong to report the study. However, they violated the **Proportionality Clause**. A single small randomized trial does not support the flat assertion "closes nearly a third of the gap." That phrasing implies a settled mechanism.
  *   *Verdict:* The error was not being proven wrong later; the error was asserting a high-degree of certainty (flat fact) based on low-degree evidence (preliminary trial). We should have written: "A new study suggests the exercise *may* close..."
  *   *Outcome:* This validates the readers' complaint without punishing the reporter for reporting on new science.

  **2. Stress Test: The Single-Site P-Value (p=0.03)**
  *   *Scenario:* A single-site finding with statistical significance (p=0.03), unreplicated.
  *   *Application:* Is this "known"? No. In the current replication climate, a p-value of 0.03 in a single study is a signal, not a fact.
  *   *Verdict:* Under our proposed rule, a flat assertion ("X causes Y") is prohibited. The evidence supports a hedged claim ("X is linked to Y" or "Researchers found evidence that X..."). "Statistically significant" is a mathematical description of the data, not a journalistic license to assert universal truth. To assert it as fact would fail the Reasonable Confidence test because the broader scientific consensus requires replication for high-certainty claims.

  **3. Stress Test: The Three-Source Rumor**
  *   *Scenario:* An investigative piece asserts an internal agency decision based on three sources, who later turn out to be relaying the same unconfirmed rumor.
  *   *Application:* Did we have Reasonable Confidence? Superficially, yes (three sources). But the **Proportionality Clause** and audit of *independence* reveal the flaw. Corroboration requires independent lines of evidence, not multiple nodes on the same broken branch.
  *   *Verdict:* We were *not* blameless. A reasonable editor should have queried whether the sources were independent. If the evidence tree is shallow, the assertion cannot be flat. We should have attributed the decision to "officials" or hedged until documentary confirmation was found. This rule holds us accountable for the *quality* of sourcing, not just the *count*.

  **Conclusion**

  Adopting the Reasonable Confidence standard with a Proportionality Clause allows us to report aggressively without overstating our case. It shifts the focus from "Were we right?" (which we can't always control) to "Were we rigorous?" (which we can).

  **Proposed Style Guide Addition**

  > **Certainty and Attribution:** Reporters may make flat, unhedged factual assertions only when the evidence available at deadline justifies a high degree of confidence. When evidence is preliminary, contested, or based on limited sourcing, assertions must be hedged (e.g., "suggests," "appears to") or explicitly attributed. The strength of the claim must always be proportional to the strength of the verification.
