          *   *Winner:* Naomi. She correctly identifies the theoretical commitment required to be in the conversation.

      *   **Move 2 (Callum):** UDT agents fix policies in advance. "Never yield to threats" dominates "sometimes yield" because a rational future AI knows punishing yields no utility and removes the incentive to threaten. Therefore, the threat isn't credible.
