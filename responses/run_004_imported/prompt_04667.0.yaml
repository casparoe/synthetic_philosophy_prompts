prompt: |-
  So for a school project I went way off-syllabus into general relativity philosophy stuff (specifically the "hole argument") and now I'm kind of stuck on the actual primary source. Quick context in case it helps: the hole argument is Einstein's early worry that if gravity's field equations hold in ANY coordinate system (general covariance), you can take a solution, leave it untouched everywhere except in some tiny "hole" region, smoothly drag it around inside that hole via a coordinate transformation, and end up with a second solution that agrees with the first everywhere outside the hole but disagrees inside it. So the stuff outside the hole doesn't seem to fix what happens inside it, which looks like a breakdown of determinism. Einstein got so bothered by this in 1913-14 that he actually dropped general covariance for a couple years, then came back to it in 1915 and had to explain why the argument wasnt actually fatal after all. That explaination is called the "point-coincidence argument," and here's the actual passage (from his 1916 paper "The Foundation of the General Theory of Relativity," old Lorentz et al. translation):

  "That this requirement of general co-variance, which takes away from space and time the last remnant of physical objectivity, is a natural one, will be seen from the following reflexion. All our space-time verifications invariably amount to a determination of space-time coincidences. If, for example, events consisted merely in the motion of material points, then ultimately nothing would be observable but the meetings of two or more of these points. Moreover, the results of our measurings are nothing but verifications of such meetings of the material points of our measuring instruments with other material points, coincidences between the hands of a clock and points on the clock dial, and observed point-events happening at the same place at the same time. The introduction of a system of reference serves no other purpose than to facilitate the description of the totality of such coincidences. [...] As all our physical experience can be ultimately reduced to such coincidences, there is no immediate reason for preferring certain systems of co-ordinates to others, that is to say, we arrive at the requirement of general co-variance."

  I basically understand each sentence on its own, but I can't figure out how this is actually supposed to defuse the hole argument. "We only ever observe coincidences, not bare coordinate values" seems true, but also kind of beside the point? The two dragged-around solutions from the hole argument still disagree about what happens at a given point even once you translate everything into coincidence-talk, don't they? So is Einstein quietly redefining what counts as "the same point," or is he just saying the disagreement is unobservable so it doesn't matter, or is there some other move I'm not seeing here. Would really appreciate an actual walkthrough of the logic instead of just "he fixed it with covariance, good job Einstein."
