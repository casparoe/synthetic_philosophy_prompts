  Last night a friend and I argued for two hours about the fine-tuning argument for theism and got stuck on an asymmetry neither of us could resolve: he insisted that inferring a multiverse from our universe's fine-tuning commits the inverse gambler's fallacy -- treating one remarkable outcome as evidence of many hidden trials -- then challenged me to explain why inferring a designer from that same fine-tuning escapes a structurally similar charge. I had no good answer. I host a small podcast on philosophy of religion, and next month's guest is a philosopher who defends a Bayesian, likelihood-based version of the fine-tuning argument. Draft eight to ten interview questions that go beyond having her restate the argument: at least one should put my friend's asymmetry worry to her directly, one should press her on how she would specify a non-arbitrary probability distribution over constants that seem to range over an unbounded interval, and one should ask how the argument survives the problem of old evidence given that we have always known the constants are right for life. For each of these three, add a follow-up question keyed to the answer she is most likely to give.
