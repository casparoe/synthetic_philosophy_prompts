  *Drafting thought:* Start with the specific case. The "private conversations." That's the flashpoint. Augustine hates falsifying testimony. Is a novel testimony?

  *Julian's strongest move:* The reader's takeaway. If the author intends the reader to think "This is likely true of the person," the author intends the reader to hold a false belief.
  *Elena's strongest move:* The nature of the sign. The book cover says "A Novel." That is a sign saying "Do not believe this literally." Therefore, the author cannot intend literal belief without contradicting their own sign.

  *Refining the "Intent":* Augustine says the lie is in the *heart*. If the heart says "I want them to think this is real" but the mouth says "This is fiction," is the heart's desire the lie? Julian says yes. Elena says the heart's desire is for *verisimilitude*, not *verity*. There is a difference.

