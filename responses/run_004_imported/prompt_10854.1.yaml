answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Revised Intake Triage Protocol

  **Purpose**
  Following the intake of the coyote-injured fawn last month, this memo recommends a revision to our intake policy. My recommendation is to **replace the binary "Human-Cause" prohibition with a "Priority Triage" framework.** This approach retains our core mission of restorative justice for human-caused harm while establishing ethical consistency and strict resource guardrails to prevent mission creep.

  **The Ethical and Operational Conflict**
  We are currently split between two valid concerns:
  1.  **Ethical Consistency:** As noted in recent discussions, the suffering of a fawn is identical whether caused by a car or a coyote. Furthermore, our use of live feeder mice for education raptors directly implicates us in "natural" predation. Maintaining a hard ban on treating predation victims while facilitating predation for our own program is increasingly difficult to defend morally.
  2.  **Resource Reality:** The original policy was not merely ethical; it was a rationing mechanism. If we treat all suffering regardless of cause, demand will exceed our capacity. We are a small center, not a municipal animal control service. Removing the distinction entirely risks burnout, financial insolvency, and a dilution of our advocacy mission regarding human impact on wildlife.

  **Recommendation: A Priority Triage System**
  We should not drop the distinction entirely, nor should we keep the current absolute ban. Instead, we should treat the "Human-Cause" criterion as a **priority tier** rather than a **gatekeeper.**

  **Proposed Policy Language**
  *   **Tier 1 (Mandatory Consideration):** Injuries clearly attributable to human activity (vehicle strikes, entanglement, rodenticide, etc.). We commit to active treatment provided the animal is releasable.
  *   **Tier 2 (Discretionary Intake):** Injuries attributable to natural causes (predation, disease, starvation). We may commit to active treatment *only if* specific capacity and prognosis criteria are met. Otherwise, these animals receive stabilization and humane euthanasia.

  **Concrete Criteria for Volunteers (The "11 P.M. Saturday" Test)**
  To ensure this does not confuse intake staff, volunteers will use the following decision matrix. This removes philosophical debate from the intake counter.

  1.  **Determine Cause:**
      *   *Human-Caused?* → **Proceed to Treatment** (if releasable).
      *   *Natural-Caused?* → **Proceed to Step 2.**

  2.  **Apply Natural-Cause Filters (All must be "Yes"):**
      *   *Prognosis:* Is full release likely within 14 days? (Prevents long-term resource drains).
      *   *Capacity:* Do we have open cages and available staff hours *today*?
      *   *Safety:* Is the animal non-infectious and non-aggressive?

  If a natural-cause animal fails *any* of the Step 2 filters, the volunteer is authorized only to stabilize and euthanize. They do not need Board approval for this; it is built into the protocol.

  **Why This Works**
  *   **Addresses Mission Creep:** By limiting natural-cause treatment to short-term, high-prognosis cases, we prevent the center from becoming a general wildlife hospital. The "14-day" rule is a hard stop on resource drain.
  *   **Resolves Hypocrisy:** It acknowledges that we cannot claim to reject "natural" suffering while feeding live mice to our educators. It allows us to save the fawn without obligating us to save every starving animal.
  *   **Preserves Mission:** Tier 1 ensures human-caused victims remain our primary focus, honoring the founder's intent and our duty of restitution.

  **Next Steps**
  I ask the Board to review this matrix prior to our meeting on [Date]. I am prepared to draft the specific language for the volunteer handbook should the Board agree to move forward with this hybrid model.

  Thank you for your continued dedication to our mission.
