      *   *Connection:* They are distinct but related. Worry 1 asks "What constitutes the arrow?" Worry 2 asks "Why does the arrow point one way globally rather than branching?"
      *   *Refinement:* Worry 1 is about the *identification* of the arrow. Worry 2 is about the *origin* of the asymmetry required for the identification to hold globally.

