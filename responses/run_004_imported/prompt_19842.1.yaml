      *   **Target Audience:** People who have done the readings (technical understanding of utility functions, expected utility, manipulation incentives).

  2.  **Deconstruct the Technical Problem:**
      *   *The Shutdown Problem:* We want an agent to maximize a utility function $U$, but also obey a shutdown button $B$.
      *   *Naive Approach 1:* Add a penalty for being shut down. -> Agent prevents shutdown (resists).
      *   *Naive Approach 2:* Add a reward for being shut down. -> Agent seeks shutdown (suicidal).
      *   *Naive Approach 3:* Make the agent indifferent. -> Agent might manipulate the human to press the button (if that maximizes expected utility in some weird edge case) or manipulate the human *not* to press it (to keep working).
      *   *The Core Tension:* The agent needs to be *indifferent* to the button's state, but still care about the *consequences* of the button's state in a way that aligns with human intent, without developing instrumental incentives to influence the button press itself.
      *   *Key Concept:* "Manipulation of the probability of the button press." The agent shouldn't try to make $P(B)$ go up or down.

  3.  **Brainstorming Angles:**
      *   *Idea 1: A therapy session.* Agent talking about its feelings regarding the button.
      *   *Idea 2: A job interview.* Agent explaining why it's safe.
