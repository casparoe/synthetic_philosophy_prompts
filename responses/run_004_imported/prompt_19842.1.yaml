prompt: |-
  hey, so in my AI alignment seminar we just spent two classes on corrigibility and the shutdown problem and my brain's fried. for section tmrw we each have to bring something 'creative' about the week's topic, so could you write me a joke about it? not a generic 'the robot doesn't want to be unplugged' joke though, i want the punchline to actually hinge on the real paradox -- like how you don't just need an agent that won't fight you over the off-switch, you also don't want one thats quietly trying to get itself shut down, or one that's nudging the odds of the button getting pressed either way. should land for people who've actually done the readings, not just folks who've seen the terminator.
