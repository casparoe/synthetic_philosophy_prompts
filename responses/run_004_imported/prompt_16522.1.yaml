answer: |-
  # The Metaphysics of the Lever: Why Counterfactuals Still Trump Interventions

  In the rationalist ecosystems of LessWrong and Overcoming Bias, a specific orthodoxy has hardened: that Judea Pearl's structural causal models (SCMs) and the associated do-calculus have effectively "solved" the problem of causation. The narrative suggests that the philosophical confusion of the 20th century—exemplified by David Lewis's struggles with preemption and overdetermination—was merely a lack of formal notation, now rectified by interventionism. This view treats causation as an engineering problem: if you can calculate the effect of a intervention, you have captured the cause.

  However, this consensus conflates *causal inference* (how we know causes) with *causal metaphysics* (what causation is). While Pearl's framework is undeniably superior for computation and policy analysis, it fails as a fundamental metaphysical account because it presupposes the very causal structures it claims to analyze. David Lewis's counterfactual theory, particularly in its later "influence" formulation, remains the more adequate *metaphysical* account of causation. It attempts a genuine reduction of causal facts to non-causal modal facts, whereas interventionism treats causal structure as a primitive. Furthermore, the "patches" required to save interventionism from counterexamples—specifically the Halpern-Pearl (HP) use of "contingencies"—are more ad hoc and damaging to the objectivity of causation than Lewis's machinery of "influence."

  ### The Battleground: Trumping and Overdetermination

  To evaluate these theories, we must examine how they handle the cases that broke the simple counterfactual account ($c$ causes $e$ iff if $c$ had not occurred, $e$ would not have occurred).

  **1. Trumping Preemption**
  Consider Schaffer's case: A Major and a Sergeant simultaneously order "Charge." Soldiers obey the highest rank. The Major's order causes the charge; the Sergeant's does not. Yet, if the Major had stayed silent, the Sergeant's order would have caused the charge. Simple counterfactual dependence fails for the Major.

  *   **Lewis's Repair (Influence):** Lewis abandoned simple dependence for "influence." $c$ causes $e$ if there is a range of alterations to $c$ ($c_1, c_2...$) that produce a corresponding range of alterations to $e$ ($e_1, e_2...$). If we alter the Major's order to "Retreat," the soldiers retreat. If we alter the Sergeant's order to "Retreat" (while the Major says "Charge"), the soldiers still charge. The Major's order *influences* the outcome; the Sergeant's does not.
  *   **Interventionist Handling:** In an SCM, we define structural equations. Let $M$ and $S$ be the orders, $C$ be the charge. The equation is $C = \max(\text{rank}(M), \text{rank}(S))$. An intervention $do(M=\text{Retreat})$ changes $C$. An intervention $do(S=\text{Retreat})$ does not (given actual $M$).
  *   **Analysis:** Interventionism seems to handle this cleanly. However, this cleanliness is illusory. It relies entirely on the modeler correctly specifying the structural equation as $C = \max(\dots)$. But specifying that equation *already requires knowing* that the Major trumps the Sergeant. The graph encodes the causal priority it is supposed to reveal. Lewis's influence, by contrast, derives the priority from the modal profile of the events themselves without presupposing a "trumping" function in the model.

  **2. Symmetric Overdetermination**
  Two assassins shoot simultaneously; either shot is lethal. The victim dies. Intuitively, both shots are causes. But neither is counterfactually necessary (if Assassin 1 misses, Assassin 2 still kills).

  *   **Lewis's Struggle:** Lewis famously struggled here. His "influence" account struggles because altering Assassin 1's shot (e.g., timing) might not alter the death if Assassin 2's shot is held fixed. Lewis often bit the bullet, suggesting that in symmetric overdetermination, there is no singular causation, or he relied on "quasi-dependence," which appeals to intrinsic similarities to non-overdetermined worlds. This is widely regarded as the weakest point of his theory.
  *   **Interventionist Repair (HP Contingencies):** The Halpern-Pearl definition of *actual causation* introduces "contingencies." To prove Shot 1 is a cause, we construct a contingency where Shot 2 is held fixed at "no shot." In this counterfactual scenario, Death depends on Shot 1. Thus, Shot 1 is a cause.
  *   **Analysis:** HP gets the intuitive verdict where Lewis falters. However, the cost is high. The HP definition allows us to test actual causation by breaking the actual world (setting an actual event to a non-actual value). This makes causal attribution dependent on *which* contingency we choose. If multiple contingencies exist, does causation become relative to the modeler's choice of witness?

  ### The Ad Hoc Charge: Influence vs. Contingencies

  Critics of Lewis argue that "influence" is a desperate patch to save a failing theory. However, compared to HP contingencies, influence is remarkably principled. Influence simply expands the modal horizon: it asks not just "did this switch flip the light?" but "is the light sensitive to this switch across a range of settings?" This aligns with the scientific intuition that causation is about *control* and *sensitivity*, not just binary necessity. It remains grounded in the actual events and their immediate modal neighborhood.

  The HP contingency mechanism is far more problematic metaphysically. It asserts that $X$ is a cause of $Y$ in the actual world if $Y$ *would have* depended on $X$ in a *different* world where other actual causes were absent. This severs the link between actual causation and the actual physical process. It renders causation extrinsic: whether Shot 1 caused the death depends on the existence of Shot 2 and our decision to "turn it off" in a counterfactual test. This implies that causation is not a relation between events in the world, but a relation between events relative to a chosen model. This is not a repair; it is a retreat from realism about causation.

  ### The Circularity of Intervention

  The deeper failure of interventionism, however, is not in its patches but in its foundation. The LW orthodoxy claims Pearl settled the metaphysics, but Pearl himself explicitly disclaims metaphysical ambitions, focusing instead on representation and inference. When interventionists like Woodward claim metaphysical territory, they define a cause as something that sustains invariant generalizations under *intervention*.

  But what is an intervention? In Pearl's calculus, $do(X=x)$ is a surgical operation that breaks all incoming arrows to $X$. This definition is inherently causal. To specify which arrows are broken, one must already know the causal structure. You cannot define an intervention without using the concept of causation. Thus, interventionism is circular as a metaphysical analysis: it explains causation in terms of interventions, which are themselves causal operations.

  Lewis, conversely, attempts a reductive analysis. He grounds causation in the Humean mosaic of events and a similarity metric between possible worlds. Neither events nor similarity metrics are inherently causal. While his theory may have rough edges (like overdetermination), it attempts to tell us what causation *is* in terms of non-causal facts. Interventionism tells us how to *reason* about causation given that we already know what it is.

  ### Verdict: The Metaphysical Primacy of Counterfactuals

  The verdict must be definite: **Lewis's Counterfactual Theory provides the more adequate account of causation.**

  This conclusion rests on a distinction between *epistemology* and *ontology*. If the question were "How do we compute causal effects from data?", Interventionism wins hands down. Pearl's do-calculus is a triumph of epistemic engineering. But the prompt asks for an account of *causation*—a metaphysical category.

  Interventionism fails as metaphysics because it is circular. It treats the causal graph as a primitive. When faced with preemption, it solves the problem by assuming the solution (the structure of the graph). When faced with overdetermination, it solves the problem by relativizing causation to modeler-selected contingencies, thereby sacrificing the objectivity of the causal relation.

  Lewis's theory, even with the "influence" patch, remains the only game in town that attempts to reduce causal facts to modal facts without presupposing causal primitives. Its failure on symmetric overdetermination is a genuine philosophical puzzle about the world, not an artifact of poor modeling. Lewis's struggle highlights the genuine metaphysical ambiguity of overdetermination; HP's "solution" papers over this ambiguity by fiat.

  The LessWrong consensus that Pearl "settled" causation confuses the map for the territory. Pearl gave us a better map (inference), but Lewis is still the one explaining the terrain (metaphysics). For a theory that aims to describe what causation *is*, rather than how to calculate it, the counterfactual account remains superior. It avoids the circularity of intervention and preserves the objectivity of causal relations against the modeler-relativity of HP contingencies. Interventionism is the superior tool, but Counterfactualism is the truer theory.
