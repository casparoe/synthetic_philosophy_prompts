answer: |-
  ### The Scenario: The Therapeutic Necessity Case

  Consider a patient, Alex, who suffers from a severe, life-threatening psychosomatic condition. Medical research has discovered that Alex's survival depends entirely on cultivating a specific psychological state: a genuine, intrinsic **desire** to continue living. If Alex falls into apathy or despair, their physiological systems will shut down.

  However, ex hypothesi, Alex's life currently possesses no intrinsic value-making features. It is filled with unrelievable suffering, lacks meaningful relationships, and offers no prospect of future enjoyment or achievement. Objectively, on a standard axiological view, Alex's life is not "good" and does not warrant desire based on its own properties.

  Nevertheless, Alex has an overwhelming prudential reason to desire his life: **survival**. The reason is not that the life is worth living, but that *desiring* to live is the causal mechanism required to stay alive.

  ### Why This is a Reason of the Wrong Kind

  This scenario poses the Wrong Kind of Reasons (WKR) problem for Fitting-Attitude (FA) analyses because it provides a case where there is a sufficient reason to have a pro-attitude (desire) toward an object (Alex's life), yet the object is not valuable. To explain precisely why this reason is of the "wrong kind," we must distinguish between **object-given reasons** and **state-given reasons**.

  **1. The Distinction: Object-Given vs. State-Given**
  *   **Right Kind (Object-Given):** A reason is of the right kind if it cites a property of the *object* of the attitude that makes the attitude **fitting**. For example, if Alex's life were full of joy, that joy would be a property of the life itself. It would make the life *desirable*. The reason bears on the relationship between the object and the attitude (i.e., the object merits the attitude).
  *   **Wrong Kind (State-Given):** A reason is of the wrong kind if it cites a benefit of *being in the mental state* of having the attitude, regardless of the object's properties. In Alex's case, the reason (survival) cites the beneficial *consequences* of holding the desire. It makes the *desire* prudent, but it does not make the *life* desirable.

  **2. The Failure of Fittingness**
  FA analyses typically claim that $X$ is good if and only if there are sufficient reasons to have a pro-attitude toward $X$. The core intuition behind FA is that value is a matter of **fittingness**: an object is good if it *merits* a pro-attitude.

  In the Therapeutic Necessity case, the reason to desire life does not make the attitude *fitting*; it makes the attitude *useful*.
  *   If Alex desires his life because it is joyful, the desire fits the object (the life).
  *   If Alex desires his life because desiring it prevents death, the desire does not fit the object; rather, the desire serves the subject.

  If we were to count this therapeutic reason as a "right kind" reason, the FA analysis would be forced to conclude that Alex's miserable life is **good** (because there is a sufficient reason to desire it). This is counterintuitive. The life remains miserable and lacking in value; only the *act of desiring it* has value (instrumental value for survival).

  **3. Independence from the Object's Properties**
  The hallmark of a wrong-kind reason is that it persists even if the object's value-relevant properties change or are absent.
  *   In the **Demon Threat** case (which this example avoids), the threat persists regardless of whether the object is a mud saucer or a masterpiece.
  *   In this **Therapeutic** case, the reason to desire persists regardless of whether the life is miserable or wonderful. Even if Alex's life were objectively worthless, the medical necessity to desire it remains. Conversely, if the medical link were broken (desiring no longer ensured survival), the reason would vanish, even if the life's properties remained exactly the same.

  Because the reason's existence depends on the *consequences for the agent* rather than the *merits of the object*, it fails to track the value of the object. Therefore, it is a reason of the wrong kind: it is a reason to *bring about* or *hold* the attitude, not a reason that reflects the *value* of the attitude's target.
