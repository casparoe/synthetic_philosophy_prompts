answer: |-
  **Setting:** *Field Triage Unit 4. The air smells of diesel and antiseptic. Distant sirens wail. DR. SARAH VANCE and DR. DAVID CHEN stand over a triage board. One surgical team remains available. The board shows two groups: Patient A (crush syndrome, immediate intervention required) and Patients B, C, D, E, F (internal hemorrhaging, immediate intervention required). All are coded Black if untreated, Red if treated. Time to decision: < 3 minutes.*

  **Vance:** The OR is prepped. One team. We can take A, or we can take the block from B through F. We can't split the surgeons; the anesthesia tech is only certified for the main bay.

  **Chen:** Then we move on B through F. Five lives for one. It's the only calculation that makes sense.

  **Vance:** Is it? Look at A. For him, the loss is total. He dies. If we save him, he lives. The same is true for B, or C. Taurek's point holds here, David. The fact that there are five of them doesn't mean the loss is "five times worse" in a way that dictates our duty. It's just five separate tragedies.

  **Chen:** It's not about the magnitude of the tragedy in the abstract, Sarah. It's about the claims on *us*. We are the agents. If we choose A, we are actively turning our backs on B, C, D, E, and F. We are telling them their need doesn't register.

  **Vance:** I'm not saying their need doesn't register. I'm saying their need doesn't *cancel* A's need. If I flip a coin, I give A a 50% chance. If I send you to the five, A has a 0% chance. By aggregating, you're guaranteeing A's death to probabilistically save the others. Why isn't a coin toss the only way to show equal respect for A's claim?

  **Chen:** Because a coin toss treats the situation as if it's one claim against one claim. It frames the choice as "Save A or Save B." But it's not. It's "Save A or Save B *and* C *and* D *and* E *and* F." When you flip that coin, you aren't just ignoring the numbers. You're effectively telling C, D, E, and F that their existence is morally invisible once the choice is framed as one-against-one. You're silencing four voices to make the debate "fair" for the first one.

  **Vance:** I'm not silencing them. I'm acknowledging that I cannot save them all, and I refuse to treat A as a mere vessel for utility. But let's press this. If it weren't five patients in the other bay. If it were five hundred. Or five thousand. Would you still say I'm obligated to save them?

  **Chen:** Obviously.

  **Vance:** And if I held to my principle? If I stood here with a coin, ready to gamble one life against five thousand? Would you call me immoral?

  **Chen:** I'd call you incapacitated.

  **Vance:** So there is a threshold?

  **Chen:** There's a point where the absurdity of the position overrides the principle.

  **Vance:** Then the principle isn't about the individual claim anymore. It's about your tolerance for cognitive dissonance. Look, David, if I accept your view, I have to accept that the moral weight of a human life is fungible. That my duty to A is not absolute, but contingent on how many people are standing next to him. If enough people bleed, A's right to life evaporates. Is that what you're signing up for? That a person's claim on rescue is always something that enough other claims can, in principle, outweigh?

  **Chen:** *[Pauses, looking at the chart for Patient A]* "Outweigh" sounds like we're weighing goods on a scale. We're not. We're managing a duty of care. My duty isn't to the *concept* of A's life. It's to the *preservation of life* within my sphere of influence. If I can preserve five instances of life, I have fulfilled that duty better than if I preserve one.

  **Vance:** But whose duty? If *you* are the surgeon, maybe you save the five. But if *I* am the one standing with A, holding his hand while he dies because I went to save the others... am I not betraying him? Taurek argues that the loss is personal. A loses his life. B loses hers. There is no "super-losing" that happens when five die. There is just five people losing. Why should I be the arbiter of which loss is "worse"?

  **Chen:** Because we aren't arbiters of the loss. We are arbiters of the *resource*. The resource is the surgical team. It belongs to the community, not to A. In a mass casualty event, the social contract shifts. We aren't in a doctor-patient dyad anymore. We are public utilities. If a fireman walks past a burning house with five people to save a burning house with one because he "didn't want to count," he's not being principled. He's being negligent.

  **Vance:** Negligent to whom? To the statistical aggregate?

  **Chen:** To the trust placed in us by the six families waiting outside. If they knew we had the capacity to save five and chose to save one on the flip of a coin, do you think they'd see "equal respect"? Or would they see a dereliction of the only power we actually have?

  **Vance:** *[She looks at the timer on the wall. 90 seconds.]* I hear you. But I need you to admit that in saving the five, you aren't proving A didn't matter. You're just proving that numbers matter *more*.

  **Chen:** I'm proving that in a world of scarcity, minimizing death is the only heuristic that doesn't require me to play God with a coin. I'm not saying A's claim is zero. I'm saying the aggregate claim of B through F generates a stronger obligation. Yes, to answer your question: Yes, enough claims can override a single claim. That is the definition of triage. If it weren't true, we wouldn't triage. We'd just treat whoever walked in the door first.

  **Vance:** *[She exhales, a sharp, shaky breath.]* Okay. If that's the protocol. If that's the duty.

  **Chen:** It's the only way to look at the five families tonight.

  **Vance:** It's not the only way. It's just the way that lets you sleep.

  **Chen:** Maybe. But it keeps five people alive.

  **Vance:** *[She reaches for the board.]* Alright. Tag A as Expectant. Palliative care only. Morphine. Make him comfortable.

  **Chen:** I'll get the team to Bay 2.

  **Vance:** David.

  **Chen:** *[Turns back]*

  **Vance:** If it had been five thousand... I still would have hesitated.

  **Chen:** I know. That's why you're the one holding his hand.

  *[Vance picks up the black marker. She hovers over Patient A's row for a second, then writes "EXPECTANT" in bold letters. She caps the pen and walks toward the bay where A is waiting. Chen signals the surgical team to move to the second bay. The wheels of the gurneys squeak against the concrete floor, heading in opposite directions.]*
