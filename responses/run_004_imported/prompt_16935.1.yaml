  This is a critical error. Buchak's REU theory does NOT simply reweight each probability by r(p_i). The actual REU formula is more complex. In REU theory, the risk function operates on the *cumulative* probability distribution, not on individual probabilities. The correct formula involves ordering outcomes from worst to best and applying the risk function to cumulative probabilities.

  For a gamble with outcomes x_1 < x_2 < ... < x_n with probabilities p_1, p_2, ..., p_n, the REU is:

  REU(g) = u(x_1) + Σ_{i=2}^n [r(Σ_{j=i}^n p_j) - r(Σ_{j=i+1}^n p_j)] × [u(x_i) - u(x_{i-1})]

  Or equivalently (and more commonly presented):

