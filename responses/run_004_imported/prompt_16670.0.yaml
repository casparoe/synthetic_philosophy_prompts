prompt: |-
  ok so this has been bugging me for like a month now and even my friends can't agree on it. my boyfriend (we've been together since freshman year, so like two years now) gets really jealous whenever I hang out with guys on my robotics team after school, like he'll go quiet for the rest of the day and then later ask a bunch of questions about who exactly was there and whether anyone was "being weird" with me. I brought it up last week bc honestly it was starting to stress me out, and he said something like "if I didn't get jealous it would mean I didn't care about you," which actually kind of got to me in the moment. then I complained about it to my mom expecting her to back me up, and she basically didn't, she said a little jealousy is healthy and that she'd honestly be more suspicious of a guy who never got jealous at all, since that would mean he doesn't really value the relationship. but my friend Maya thinks that's crazy and says jealousy isn't love, its just controlling behavior wearing a nicer costume.

  I genuinely can't tell who's right here and it kind of matters for how I think about this relationship going forward. like is jealousy actual evidence that someone loves you, so I should almost take it as a compliment, or is my mom just repeating an old idea that doesn't really hold up, and Maya's the one making sense? I don't want the "only you know your relationship" non-answer, I want someone to actually lay out the reasoning on both sides and tell me which argument actually holds up, bc right now I can kind of see the logic in both and it's driving me insane.
