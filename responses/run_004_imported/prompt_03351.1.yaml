      *   *Correction:* Daniel is arguing that the *conditions* of the principle must hold *at the time of action*. Scanlon's view is that the principle explains why the obligation *arose*. Once it arises, it's a freestanding reason. So Daniel is misapplying the principle as a continuous test rather than a generative one.
