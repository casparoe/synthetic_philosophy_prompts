answer: |-
  First, please accept my condolences for the loss of your friend Mara. The situation you describe is emotionally fraught, and it is understandable that you are looking for clarity not just on what to do, but on the nature of the commitment you made. It is also a philosophically rich puzzle that cuts to the heart of how we understand moral obligations.

  Daniel is raising a sophisticated objection based on a specific reading of T.M. Scanlon, but his conclusion relies on a misapplication of Scanlon's Principle F. Furthermore, while normative-power views (like those of Joseph Raz or David Owens) avoid some of Scanlon's difficulties, they introduce new complications regarding the "release" of the promise.

  Here is an analysis of the implications of Scanlon's view, the viability of Daniel's argument, and how alternative theories handle the death of the promisee.

  ### 1. Scanlon's Principle F and the "Time-Indexing" Problem

  Daniel's argument rests on the claim that the conditions of Principle F must be satisfied *continuously* or *at the time of performance*. He argues that because Mara no longer has expectations or desires, the conditions fail, and the obligation lapses.

  **The Generative vs. Continuous Reading**
  Daniel is treating Principle F as a continuous test: *At the moment I am about to act, does the promisee currently expect me to act?* However, the standard philosophical reading of Scanlon (and Scanlon's own treatment in *What We Owe to Each Other*) is that Principle F is **generative**. It explains how the obligation *arises* at the time of the promise ($t_1$).

  Once the conditions are met at $t_1$ (Mara was alive, she expected you to destroy the box, she wanted assurance, you intended to provide it), a "peremptory reason" for action is created. This reason persists independently of the promisee's subsequent mental states, unless a specific "defeater" occurs (such as the promisee releasing you).

  **Scanlon on Promises to the Dead**
  Scanlon explicitly addresses promises to the dead. He acknowledges that if the wrong of breaking a promise is solely about disappointing a specific person's expectations, then breaking a promise to a dead person is puzzling (since they cannot be disappointed). However, Scanlon argues that the obligation survives for two key reasons:
  1.  **The Interest in Posthumous Control:** Living people have a profound interest in being able to shape what happens after they die. Principle F protects the ability of people to secure assurance about the future. If promises lapsed upon death, the living would be unable to secure assurance regarding posthumous events, undermining the very utility of the practice.
  2.  **The Integrity of the Promisor:** Even if the specific "wrong to Mara" is attenuated, breaking the promise violates the principle of fidelity that governs your own moral integrity and the general trustworthiness of the practice.

  **Verdict on Daniel:** Daniel's reading is technically incorrect regarding Scanlon's framework. Principle F does not require the promisee to be alive at the time of performance, only at the time the assurance was given. The obligation survives Mara's death because the *reasons for having the principle* (allowing people to bind others regarding the future) would be undermined if death automatically voided such commitments.

  ### 2. Normative Power Views (Raz and Owens)

  You asked whether views that locate the source of obligation in the promisor's act (normative powers) fare better. These views argue that by promising, you exercise a power to change the normative landscape: you create an obligation for yourself and a **right** for the promisee.

  **The Advantage: Independence from Mental States**
  Unlike Scanlon, Raz and Owens do not ground the obligation in the promisee's *psychological state* (expectation/assurance). They ground it in the *normative act* itself. Therefore, Mara's death (the cessation of her mental states) is less damaging to the theory. The obligation was created by the joint act of promising, not by her ongoing hope.

  **The New Problem: The "Right-Holder" Dilemma**
  However, these views face a different difficulty, often called the "vanishing right-holder" problem.
  *   **Raz (Interest Theory):** For Raz, a right exists to protect an interest. Do the dead have interests? Strictly speaking, a non-existent entity cannot have interests.
      *   *The Workaround:* Raz and others argue for "antemortem interests." The person *who existed* had an interest in their posthumous reputation or privacy. The obligation survives because it protects the interests the person had *while alive*.
      *   *The Risk:* If the interest is too attenuated (e.g., if the journals contain no sensitive info), a Razian might argue the interest no longer warrants the burden on you.
  *   **Owens (Authority Theory):** Owens views promising as transferring authority over a decision to the promisee. Mara had the authority to decide whether the journals were destroyed.
      *   *The Problem:* If the authority holder dies, who holds the authority? Can her family exercise it? Can you reclaim it?
      *   *The Implication:* On a strict Owens view, if the authority holder vanishes without a successor, the normative bond might become "orphaned." However, most proponents argue the obligation remains *in force* but the power to *release* becomes inoperable (or passes to an executor).

  **Comparison:** Normative power views actually support your intuition *better* than Daniel's reading of Scanlon. They treat the promise as a completed transaction that alters your normative status permanently, rather than a ongoing psychological contract.

  ### 3. The Crucial Issue: The Power of Release

  The most significant practical difference between these theories concerns **who can release you from the promise.**

  *   **Daniel's View (Lapsed Obligation):** No one needs to release you; the obligation is gone.
  *   **Scanlon/Normative Power (Surviving Obligation):** The obligation remains, *but* Mara can no longer release you.

  This creates a moral asymmetry. When Mara was alive, she could have said, "Actually, keep them." Now, that channel is closed. This makes the obligation feel "heavier," which aligns with your intuition that promises to the dead are especially binding.

  However, this raises a question about Mara's family. If the obligation survives, does the right to enforce or waive it pass to her next of kin?
  *   **Scanlon:** Likely no. The assurance was given to *Mara*, not her family. Unless Mara indicated otherwise, the family cannot waive the promise.
  *   **Raz/Owens:** More likely to allow the executors of the estate to step into the shoes of the right-holder, as they manage the "interests" of the deceased.

  If you adopt the view that the obligation survives (which is the philosophically dominant view), you are bound to destroy the box *unless* you have reason to believe Mara would have released you had she known your current circumstances (e.g., if keeping them saved a life). But mere inconvenience (a move, a new job) is rarely a sufficient defeater.

  ### 4. Is This a Difficulty Peculiar to Scanlon?

  Daniel is right that expectation-based views *sound* vulnerable here, but as shown above, Scanlon has resources to defend the obligation. However, there is a deeper issue common to **all** these theories: **The Object of the Wrong.**

  *   **Scanlon:** If Mara is dead, she is not wronged (she feels no pain, suffers no disappointment). So who is wronged? Scanlon must appeal to third parties (undermining trust) or abstract principles.
  *   **Raz/Owens:** If Mara has no current interests or authority, what is the "thing" that is violated?

  Both theories ultimately converge on the idea that **respect for the past autonomy of the person** is the key. We bind ourselves to the dead not because they can suffer now, but because respecting their past wishes is a condition of valuing them as persons who existed. If we treat their final requests as voidable upon death, we diminish the significance of their agency while they were alive.

  ### Summary and Conclusion

  To answer your specific questions:

  1.  **Does a careful reading of Principle F force Daniel's conclusion?**
      **No.** Daniel is misreading Principle F as requiring continuous mental states. Scanlon's principle explains the *genesis* of the obligation. Once generated, the obligation persists to support the interest living people have in controlling their posthumous legacy. Daniel's argument is philosophically hasty.

  2.  **Is there a defensible reading on which the obligation survives?**
      **Yes.** Both Scanlon (properly understood) and Normative Power views support the survival of the obligation. They ground it in the validity of the original transaction and the importance of allowing people to bind the future.

  3.  **Do Normative Power views face the same problem?**
      **They face a version of it, but it is less damaging.** They avoid the "mental state" problem but face the "right-holder" problem. However, they generally resolve this by appealing to antemortem interests or the permanence of the normative act. They tend to support the "binding" intuition more robustly than expectation views.

  **Practical Implication:**
  Philosophically, you are on firmer ground than Daniel. The consensus in moral philosophy is that promises to the dead remain binding, precisely because the promisee can no longer release the promisor. The "heaviness" you feel is not just grief; it is the recognition that the normative power to waive the duty has vanished, leaving the duty itself intact.

  Unless you have discovered information suggesting Mara's *intent* has changed (e.g., a later will contradicting the request), the philosophical weight suggests the promise stands. The difficulty you feel is not a sign that the obligation has lapsed, but rather a sign that you are taking the permanence of the commitment seriously.
