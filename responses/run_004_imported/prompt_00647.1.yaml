answer: |-
  Here is a rigorous reconstruction of that objection, designed to be handed out as a seminar handout or used as a lecture scaffold. It avoids the shorthand "marginal cases" label and instead treats the problem as an internal consistency challenge to Nozick's specific grounding of side-constraints.

  ***

  # Handout: The Instability of Nozick's Hybrid View
  **Topic:** The Grounds of Side-Constraints and the Species Boundary
  **Source Material:** *Anarchy, State, and Utopia*, Chapter 3 (especially pp. 39–42, 48–51)

  ## 1. The Target: Nozick's Hybrid Proposal
  In *Anarchy, State, and Utopia*, Nozick explores a "hybrid" ethical position to reconcile our intuitions about human rights with our treatment of animals. The view can be summarized as follows:

  1.  **Side-Constraints for Persons:** Human beings (persons) are protected by deontological side-constraints. They cannot be sacrificed, harmed, or used merely as a means, even to maximize the overall good (rejecting utilitarianism for persons).
  2.  **Utilitarianism for Animals:** Non-human animals do not possess these side-constraints. Their interests count, but they can be aggregated and traded off against the greater good (e.g., painless killing for food or research if benefits outweigh costs).
  3.  **The Justification for the Split:** The boundary is not arbitrary species membership but is grounded in a specific **morally relevant capacity** (let's call it **$C$**). Nozick suggests $C$ involves "rational agency," "the ability to regulate conduct by principles," or "conceiving of oneself as a being with a long-term life to lead."

  Nozick admits he does not fully endorse this view, but he treats it as a "live option" that explains why we might painlessly kill 10,000 cows to save one human (the "Snapping Fingers" case) without accepting full utilitarianism for humans.

  ## 2. The Objection: The Grounding Dilemma
  The student's objection targets the coherence of the justification for the boundary. If side-constraints are grounded in capacity $C$, the distribution of $C$ must map onto the distribution of rights.

  **The Dilemma:**
  *   **Horn A (Consistency):** If side-constraints are strictly grounded in the *actual possession* of capacity $C$, then any being lacking $C$ lacks side-constraints.
  *   **Horn B (Inclusivity):** If we insist that all humans retain side-constraints regardless of $C$, then $C$ is not the actual ground of the rights, and the view collapses into arbitrary speciesism.

  ### Argument for Horn A (The Exclusion Problem)
  1.  Nozick claims side-constraints protect beings because they possess $C$ (e.g., rational autonomy, moral agency).
  2.  There exist actual human beings (infants, the severely cognitively impaired, those in permanent vegetative states) who do not possess $C$ to a degree higher than many adult non-human animals (e.g., pigs, crows, great apes).
  3.  If the possession of $C$ is necessary for side-constraints, these human beings do not have side-constraints.
  4.  Therefore, on Nozick's stated grounds, it is permissible to sacrifice these humans for the greater good (e.g., medical testing) if the utility calculus supports it.
  5.  *Result:* This contradicts the core Nozickian intuition that *no* individual should be sacrificed for the social good.

  ### Argument for Horn B (The Circularity Problem)
  1.  To avoid the conclusion in Horn A, the Nozickian might insist all humans have side-constraints regardless of their actual $C$.
  2.  To justify this, they must appeal to a different criterion: Species Membership ($S$), "Species-Typical" capacity, or "Potential" capacity.
  3.  However, Nozick explicitly rejects species membership as a morally arbitrary ground (akin to race or sex). He seeks a *functional* justification for rights.
  4.  If the ground shifts from $C$ to $S$ (or "typical $C$"), the justification for side-constraints is no longer doing the philosophical work. It simply stipulates the conclusion (Humans get rights) rather than deriving it from a moral property.
  5.  *Result:* The view abandons its claim to be a principled ethical theory and becomes a defense of human privilege by fiat.

  ## 3. Evaluating the Strongest Nozickian Replies
  A rigorous critique must engage with the best defenses available to Nozick, not just the weakest. Here are the three strongest replies and why they fail to stabilize the Hybrid View.

  ### Reply 1: The "Species-Typical" Defense
  *   **The Argument:** Rights attach to beings that are *of a kind* that typically possesses $C$. An infant is a "rational agent" in the sense that it belongs to a kind whose normal maturation involves rational agency, even if the individual currently lacks it.
  *   **The Counter:** This fails to cover permanent marginal cases (e.g., profound congenital cognitive impairment). These individuals are human, but they will never possess $C$. If the "kind" argument protects them, it is doing so solely based on biological taxonomy, not moral capacity. Furthermore, why does the *statistical norm* of a species grant inviolability to an individual who lacks the capacity? If the harm of rights-violation is the frustration of autonomy, a being without autonomy cannot suffer that specific harm.

  ### Reply 2: The "Potentiality" Defense
  *   **The Argument:** Infants and some impaired humans possess the *potential* for $C$ (or had it, in the case of dementia). Animals do not have this potential.
  *   **The Counter:**
      1.  **Permanent Impairment:** This does not protect humans who never had and never will have the potential for $C$.
      2.  **Moral Relevance of Potential:** Why does *potential* agency grant *actual* inviolability? If I have the potential to be a pilot, I do not yet have the rights of a pilot. If the right is grounded in the capacity to claim it or understand it (as Kantianism suggests), potentiality is insufficient.
      3.  **Asymmetry:** If we grant rights based on potential, do we owe duties to the unfertilized egg or the embryo? Nozickians usually resist this. If potentiality matters only after birth, the line is again arbitrary.

  ### Reply 3: The "Moral Community" / Reciprocity Defense
  *   **The Argument:** Side-constraints are rules for a moral community. Only beings capable of understanding and respecting rights can be members of that community. We protect marginal humans because they are *connected* to the community of agents (via kinship, emotion, social ties) or because we cannot safely distinguish them from agents without risking true agents.
  *   **The Counter:**
      1.  **Instrumentalization:** This admits that marginal humans are protected *instrumentally* (to protect real agents or maintain social cohesion), not because they have intrinsic rights. This violates the Kantian core of Nozick's view (that individuals are ends in themselves).
      2.  **The "Snapping Fingers" Reversal:** Nozick uses the "Snapping Fingers" case (kill 10,000 cows to save 1 human) to show humans have higher value. But if the human in question is a permanent vegetative state patient with no connections to the moral community, does the intuition hold? If the Nozickian says "Yes, still save the human," they must admit the value lies in *biology*, not *agency*. If they say "No," they have accepted Horn A.

  ## 4. Conclusion: The Hybrid View is Unstable
  The student's objection demonstrates that Nozick's hybrid view attempts to occupy a middle ground that cannot hold.

  *   It wants the **grounding** of rights to be **capacity-based** (to avoid arbitrary speciesism and explain *why* rights matter).
  *   It wants the **scope** of rights to be **species-based** (to protect all humans and match common intuition).

  These two commitments are incompatible given the empirical overlap of cognitive capacities across species.
  *   If Nozick prioritizes the **Grounding**, he must accept that some humans are usable resources (Horn A).
  *   If Nozick prioritizes the **Scope**, he must admit the grounding is speciesist fiat (Horn B).

  **Pedagogical Upshot:**
  This objection does not necessarily prove animals *should* have side-constraints (though it leaves that door open). Rather, it proves that **you cannot have it both ways.** You cannot ground human inviolability in rational agency while simultaneously granting that inviolability to humans who lack rational agency, unless you are willing to admit that the true ground is simply "being human." For a libertarian theory built on individual rights and non-arbitrariness, this is a fatal tension.

  ***

  ### Notes for the Instructor on Deployment

  1.  **Distinguish from Singer:** Students often conflate this with Peter Singer's "All Animals Are Equal." Clarify that this argument doesn't require accepting utilitarianism. It only requires accepting that *whatever principle you use for humans must apply to non-humans with similar relevant traits.* It is an argument for **consistency**, not necessarily for animal liberation.
  2.  **Nozick's Honesty:** Remind students that Nozick himself writes: *"I do not know the answer... I am not sure how to draw the line."* He anticipates this problem. The value of the seminar is not "refuting Nozick" but seeing if his proposed solutions (like the "species-typical" notion) survive scrutiny.
  3.  **The "Snapping Fingers" Intuition:** Ask the class to re-evaluate the cow/human case. Ask: *"If the human is permanently non-sentient and will never wake up, do you still snap your fingers?"* If they hesitate, the "human superiority" intuition was relying on agency, not biology. If they don't hesitate, ask *why*, and press them on whether "biology alone" is a sufficient moral ground.
