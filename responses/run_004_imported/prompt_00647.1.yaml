      *   *Addresses strongest replies?* Yes (species-typicality, potentiality, reciprocity).
      *   *Specific to Nozick?* Yes, focuses on side-constraints and the hybrid proposal.

  8.  **Self-Correction during drafting:** I initially thought about bringing in Singer. *Correction:* Keep it focused on Nozick. Singer is the utilitarian alternative. The prompt asks to press the objection *against Nozick's hybrid view*, not to argue for utilitarianism. The point is internal coherence. I need to make sure I don't just say "Speciesism is bad." I need to say "Speciesism is incompatible with Nozick's stated *grounds* for side-constraints."

  9.  **Final Polish:** Add a concluding section on "Pedagogical Takeaways" to help the professor use this in class. (Decided to keep it as a philosophical handout model as requested).

