      *   **Specific Topic:** Nozick's "hybrid view" (Utilitarianism for animals, Kantianism for persons) and the associated side-constraints.
      *   **The Problem:** A student raised a sophisticated "marginal cases" objection specifically tailored to Nozick's framework, not just generic speciesism.
      *   **The Goal:** Build out this argument rigorously, addressing Nozick's strongest potential replies (species-typicality, potentiality, metaphysical will, etc.), avoiding question-begging, and providing a model for students.
      *   **Tone:** Academic, rigorous, philosophical, respectful of Nozick's nuance (acknowledging he doesn't fully endorse the view but treats it seriously).

  2.  **Deconstruct Nozick's Position (in ASU):**
      *   *Core Claim:* Individuals have rights (side-constraints). These rights forbid sacrificing one for the greater good.
      *   *The Boundary:* Who has these rights? Nozick suggests "moral personality" or the capacity to regulate conduct by principles.
      *   *The Hybrid Proposal:* Maybe animals get utilitarian calculation (can be sacrificed for net good), while persons get deontological protection (cannot be sacrificed).
      *   *The Justification for Persons:* Usually linked to rationality, autonomy, long-term planning, moral agency.
      *   *The Snapping Fingers Case:* Nozick asks if we would snap our fingers to painlessly kill 10,000 cows to save a person. Most say yes. This suggests a lexical priority or a qualitative difference.

  3.  **Deconstruct the Student's Objection (The "Marginal Cases" Problem applied to Nozick):**
      *   *Dilemma:*
          *   Horn A: If the criterion is *actual capacity* (rationality, autonomy), then some humans (infants, severely cognitively impaired, PVS) fail the test. They should lose side-constraints.
          *   Horn B: If the criterion is *species membership* or *potentiality*, the justification becomes circular or arbitrary (speciesism), failing to do the philosophical work Nozick needs (grounding inviolability in a morally relevant feature).

  4.  **Develop the Argument Structure:**
      *   **Introduction:** Set the stage (Nozick's hybrid view, the role of side-constraints).
      *   **Premise 1: The Grounding of Side-Constraints.** Identify what Nozick says makes beings inviolable (rational agency, moral personality).
      *   **Premise 2: The Empirical Overlap.** Show that the distribution of these capacities does not map neatly onto the species boundary (humans vs. non-humans).
      *   **Premise 3: The Dilemma.** Present the Horn A/Horn B structure.
      *   **Evaluation of Nozickian Defenses:**
          *   *Defense 1: Species-Typicality.* (It's about being a kind of being that *typically* has these traits).
          *   *Defense 2: Potentiality.* (Infants have the potential).
          *   *Defense 3: The "Moral Community" / Reciprocity.* (Only those who can understand rights have rights).
          *   *Defense 4: Epistemic Humility / Slippery Slope.* (We can't measure it safely, so we protect all humans).
      *   **Refutation of Defenses:** Show why these fail to save the *hybrid* view specifically.
      *   **Conclusion:** The hybrid view is unstable. It collapses into either full speciesism (unjustified) or consistent utilitarianism/consistent Kantianism across the board.

  5.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Intro:* Acknowledge Nozick's tentativeness. He calls it a "suggestion." But it's influential.
      *   *The Core Tension:* Side-constraints require a specific property $P$. Let's call it "Moral Personality."
      *   *The Argument:*
          1.  Nozick claims side-constraints apply to beings with $P$.
          2.  Animals lack $P$; normal humans have $P$.
          3.  Therefore, Animals = Utilitarian, Humans = Kantian.
          4.  *Challenge:* Distribution of $P$ is not species-specific.
          5.  Some humans lack $P$ (marginal cases). Some animals might have proto-$P$ (great apes, etc., though Nozick might deny this, focus on the humans).
          6.  If consistency holds, marginal humans lose protection.
          7.  If protection remains, $P$ isn't the real reason.

      *   *Addressing Nozick's Specific Replies (Crucial Step):*
          *   *Species-Norms:* Nozick might say "Humans are the kind of thing that plans." *Counter:* Why does the *kind* matter if the *individual* lacks the capacity to suffer the specific harm of rights violation? If I can't understand rights, violating them doesn't harm me in the specific Kantian way.
          *   *Potentiality:* Infants will be agents. *Counter:* What about permanent impairment? Also, why does potential grant *current* inviolability?
          *   *The "Snapping Fingers" Intuition:* Nozick relies on the intuition that killing cows is okay to save a person. *Counter:* This intuition presupposes the conclusion. It doesn't justify the boundary.
          *   *Reciprocity:* Only agents can respect rights, so only agents have them. *Counter:* This excludes infants and impaired humans too.

      *   *Refining the "Hybrid" Instability:* The key is that the hybrid view tries to have it both ways. It wants the *grounding* to be capacity-based (to avoid arbitrary speciesism) but the *application* to be species-based (to protect all humans). This is the instability.

  6.  **Polishing the Tone:**
