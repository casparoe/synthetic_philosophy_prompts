answer: |-
  **Setting:** *Alex's living room, Sunday afternoon. A whiteboard is covered in flight itineraries and arithmetic. A prescription bottle of hydrocodone sits on the coffee table, next to a half-empty glass of water. Alex is on the couch, looking groggy but intense. Sam, their housemate, is standing by the whiteboard, marker in hand.*

  **Sam:** You've checked the addition three times, Alex. I'm not disputing the arithmetic on the board. I'm disputing the arithmetician.

  **Alex:** The arithmetician is fine. The layover is ninety minutes. The minimum connection time for United in Denver is forty-five. Even with terminal change, it's doable. Mom makes the flight.

  **Sam:** And I'm telling you, based on the bottle on the table, you are in a state where your confidence levels do not track your reliability. You have higher-order evidence that your cognitive faculties are compromised. The rational move isn't to re-check the math. It's to discount the result of the math.

  **Alex:** *[Gestures to the board]* But the math isn't lying. That's the Level-Splitting intuition, Sam. I have first-order evidence—the numbers—that supports $P$. I have higher-order evidence—the pills—that suggests I shouldn't trust my grasp of $P$. Why does the second one automatically veto the first?

  **Sam:** Because of the Enkratic Principle. It's rationally required that if you believe you shouldn't believe $P$, then you shouldn't believe $P$. If you acknowledge the pills make you unreliable, but you keep believing the calculation is solid, you're in a state of epistemic akrasia. You're believing $P$ while believing your belief in $P$ is unsupported. That's a structural failure of rationality.

  **Alex:** Only if the higher-order evidence is *truth-tracking*. Look, suppose I wasn't on hydrocodone. Suppose I just had a really strong, unfounded anxiety that I was bad at math. I do the calculation, it looks crystal clear. But I have this nagging doubt—"I'm usually bad at this." If I follow your Conciliationist line, I have to lower my confidence in the calculation because of my anxiety, even if the calculation is perfect. You're letting a false higher-order belief defeat a true first-order belief.

  **Sam:** But in your case, the higher-order evidence isn't anxiety. It's pharmacology. We know opioids impair cognitive function. It's not a false belief that you're compromised; it's a statistical fact.

  **Alex:** It's evidence that I *might* be compromised. But evidence can be misleading. If I look out the window and see water on the street, I have evidence it rained. If I then learn the sprinklers were on, I have defeating evidence. But if I *also* see the sky is clear and the clouds are gone, I can maintain "It didn't rain" while acknowledging "I have evidence that suggests it did." I'm splitting the levels. I believe $P$ (Mom makes the flight), and I believe my evidence suggests I shouldn't believe $P$ (because of the drugs). Why is that combination forbidden?

  **Sam:** Because it insulates you from criticism. This is the bootstrapping objection, Alex. If you're allowed to say, "Well, the first-order evidence looks clear to me, so I'll just ignore the higher-order evidence," you've made yourself immune to any claim that you're impaired. Imagine a drunk driver. He looks at the road. It looks straight to him. He has higher-order evidence—he drank six beers—that he shouldn't trust his vision. If he uses your Level-Splitting view, he says, "The road looks straight. The beer evidence is misleading. I'm driving." You're giving him a rational pass to ignore his impairment whenever the world looks clear enough.

  **Alex:** That's a straw man of the view. Level-splitting isn't a "whenever you feel like it" pass. It's a claim about the weight of evidence. In the drunk driver case, the first-order evidence (vision) is *known* to be heavily correlated with the impairment. In my case, simple arithmetic is robust. I'm not doing quantum physics. I'm adding minutes. The first-order evidence is so strong that it outweighs the probabilistic noise of the hydrocodone. The bootstrapping charge assumes I can always privilege the first-order, but I can't. If the math were complex calculus, I'd concede. You're arguing that *any* HOE trumps FOE. I'm saying they trade off.

  **Sam:** But how do you assess the trade-off? You're using the very faculties under suspicion to weigh the reliability of those faculties. That's the circularity. You say, "My math is simple, so the drugs don't matter." But you're judging the simplicity of the math *while on the drugs*. The Conciliationist view says once you get the HOE, you have to bracket the FOE. You treat the output of your reasoning as tainted until the HOE is neutralized.

  **Alex:** And that's where you throw away knowledge. That's my charge against you. Suppose I'm right. Suppose the math is solid. If I follow your advice, I suspend judgment. I call Mom and tell her she might miss her flight. She panics, rebooks, loses money. I had the knowledge. I had the justification. But I surrendered it because of a *mere possibility* of error. You're prioritizing internal coherence over truth. You'd rather I be rationally tidy and wrong than rationally messy and right.

  **Sam:** I'm prioritizing rationality over luck. If you believe $P$ and you also believe you have no good reason for $P$ (because the drugs defeat the reason), you're essentially guessing. Even if you're right, it's accidental. Rationality isn't just about landing on the truth; it's about being able to stand behind your belief. If you can't stand behind the *process* that got you there, you don't own the belief.

  **Alex:** But I *can* stand behind the process. The process is "look at the numbers." The drugs don't change the numbers. They change my brain. But if my brain is currently processing the numbers correctly—which it is, look at the board!—why does the chemical history matter? You're asking me to treat my current conscious clarity as an illusion solely based on external testimony.

  **Sam:** I'm asking you to acknowledge that "feeling clear" is exactly what impairment feels like. That's the trap. The hydrocodone doesn't make you feel confused; it makes you feel confident. That's why the HOE is necessary. It corrects for the false sense of security. If you ignore it, you're saying your subjective feeling of certainty is a better guide than the objective fact of ingestion.

  **Alex:** No, I'm saying my subjective grasp of the proof is the only access I have to the proof. You want me to defer to the bottle over the board. But the bottle only tells me about risk probabilities. The board tells me about *this* specific instance. In *this* instance, $45 + 45 = 90$. The bottle says "Alex might add wrong." The board says "Alex did not add wrong." Why is the general probability more authoritative than the specific derivation?

  **Sam:** Because you can't verify the specific derivation without relying on the general probability! You're checking your work. But the checker is the same machine as the calculator. If the machine is flagged for maintenance, you don't trust the self-check. You need an external audit. Right now, I'm the external audit. And I'm telling you the machine is flagged.

  **Alex:** *[Laughs softly]* So I have to outsource my rationality to you?

  **Sam:** Not outsource. Acknowledge the social dimension of evidence. You have testimony from me, plus the bottle, plus the general knowledge of opioids. That's a massive weight of HOE. You have... a feeling of clarity.

  **Alex:** It's not just a feeling. It's the result of the derivation. Look, let's grant your point about bootstrapping. Let's say I can't just *ignore* HOE. But why does "responding to HOE" have to mean "lowering confidence in $P$"? Why can't it mean "lowering confidence in my assessment of my own reliability"? I can believe $P$, and believe that *you* are rational to think I'm unreliable, while I remain reliable.

  **Sam:** Because that fractures the normative force of evidence. If you admit you have evidence that you're unreliable, you admit you lack sufficient justification for $P$. If you lack justification, you shouldn't believe $P$. To believe $P$ anyway is to detach belief from justification. That's dogmatism.

  **Alex:** Or it's recognizing that justification is multi-dimensional. I have first-order justification (the math). I have higher-order defeaters (the pills). The defeaters don't erase the justification; they just make it risky. I'm willing to take the risk. You're saying risk management *is* rationality. I'm saying truth-tracking is rationality, even if it's risky.

  **Sam:** And I'm saying that if you consistently take risks when you know the odds are stacked against your faculties, you're not a truth-tracker. You're a gambler. And eventually, the house wins.

  **Alex:** Maybe. But today, the house is wrong. Mom makes the flight.

  **Sam:** *[Puts the cap back on the marker]* Even if you're right about the flight, Alex, you're wrong about the epistemology. And that's going to cost you more than a rebooking fee eventually.

  **Alex:** *[Leans back, closing his eyes]* Maybe. Or maybe you're so worried about being coherent you forgot to check if the world actually adds up.

  **Sam:** I checked the math. It's correct.

  **Alex:** Then why won't you let me believe it?

  **Sam:** Because I don't trust *you* believing it. I trust the numbers. There's a difference.

  **Alex:** *[Opens one eye]* Is there?

  **Sam:** *[Silence. She looks at the bottle, then the board.]* I don't know. But I know you shouldn't be driving to the airport to tell her yourself.

  **Alex:** Fair.

  *[Sam sits down. Neither moves to erase the board.]*
