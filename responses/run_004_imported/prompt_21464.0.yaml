answer: |-
  This is one of the most profound and difficult questions facing modern psychiatry, and your hesitation is both intellectually sound and deeply human. You are asking whether grief is a natural landscape we traverse or a medical condition that can become "stuck." The answer, frustratingly, is that it is likely both, and the line between them is drawn by human consensus rather than biological discovery.

  To help you prepare for your next appointment, it may be useful to break down the clinical reality, the cultural critique, and the practical utility of this diagnosis.

  ### 1. The Clinical Reality: What is being proposed?
  The disorder your therapist is likely referring to is **Prolonged Grief Disorder (PGD)**. It was formally added to the *Diagnostic and Statistical Manual of Mental Disorders* (DSM-5-TR) in 2022 and is also recognized by the World Health Organization (ICD-11).

  **The Criteria:**
  While guidelines vary slightly, the core criteria generally include:
  *   **Duration:** The grief persists beyond a specific expected period (12 months for adults in the DSM-5-TR; 6 months in the ICD-11).
  *   **Intensity:** A pervasive yearning or preoccupation with the deceased.
  *   **Impairment:** The grief causes significant disruption to daily life (work, sleep, social functioning).
  *   **Distinction:** It is distinct from depression or PTSD, though it can co-occur.

  **Is there a "Medically Discoverable" Line?**
  Currently, **no.** There is no blood test, brain scan, or biomarker that can definitively say, "This is normal grief" versus "This is PGD." The diagnosis is *phenomenological*, meaning it is based on reported experiences and observable behaviors rather than biological pathology.

  However, researchers argue that there is a psychological distinction between **integrated grief** and **acute grief**.
  *   *Integrated grief* comes in waves; the pain is present, but the person can function, plan for the future, and experience moments of joy.
  *   *PGD* is often described as being "stuck" in the immediate aftermath. The nervous system remains in a state of high alert or collapse, preventing the brain from updating its internal model of the world to account for the loss.

  ### 2. The Cultural Critique: Your Resistance is Valid
  Your resistance to the diagnosis touches on a major criticism within the psychological community. Many experts argue that medicalizing grief risks pathologizing love.

  *   **Arbitrary Timelines:** You are correct that the 12-month cutoff is a consensus decision, not a law of nature. In many cultures (including Mediterranean, Latin American, and various Asian traditions), mourning is a lifelong process, and intense engagement with the deceased's belongings is a sign of respect, not pathology.
  *   **The "Move On" Narrative:** There is a fear that creating a disorder creates pressure to "recover" from a loss that fundamentally changes who you are. Grief is not a problem to be solved; it is a reflection of a bond that mattered.
  *   **Individual vs. Communal:** Western psychiatry tends to view mental health through an individual lens (can *you* function?). Many mourning customs view grief communally (how does the *family* honor the dead?). If your family customs run longer, a diagnosis based on individual functioning may feel like a cultural mismatch.

  ### 3. The Utility: Why use the label at all?
  If the line is arbitrary, why did your therapist suggest it? Usually, it comes down to **access** and **validation**.

  *   **Treatment Specificity:** Standard therapy for depression often doesn't work for severe grief. PGD has specific treatments (like Complicated Grief Therapy) that focus on processing the loss rather than "fixing" mood. A diagnosis can unlock these specific protocols.
  *   **Insurance and Resources:** In many healthcare systems, a diagnosis is the key that opens the door to coverage for therapy.
  *   **Relief from Guilt:** Some patients find relief in the diagnosis. It shifts the narrative from "I am weak and can't handle this" to "I am experiencing a recognized condition that requires specific care." You mentioned finding this "almost comforting"; that is a common and valid reaction.

  ### 4. Synthesizing the Two Views
  The most nuanced way to view this is to see the diagnosis not as a statement about your *love* for your mother, but as a statement about your *nervous system's* ability to process the pain.

  You can hold two truths simultaneously:
  1.  **Your grief is a valid expression of love.** The duration and the keeping of belongings are not inherently "wrong," especially given your family customs.
  2.  **Your suffering is impacting your health.** The sleep disruption and work impairment suggest that the grief is not just an emotion, but a physiological stressor that is preventing restoration.

  The "line" is not between loving her and not loving her. The line is between grief that you carry and grief that carries you to the point of physical or functional collapse.

  ### 5. Questions for Your Next Appointment
  To navigate this without feeling coerced, you might consider asking your therapist the following questions. These show you are engaged and want to collaborate rather than just comply.

  *   *"I understand the criteria for Prolonged Grief Disorder, but I am concerned about the cultural arbitrariness of the timeline. How do we account for my family's mourning customs in this assessment?"*
  *   *"If we use this diagnosis, is it primarily to guide the type of therapy we do, or is it for insurance coding? Can we use it as a working hypothesis rather than a permanent label?"*
  *   *"What is the goal of treatment? Is the goal to 'move on' and give away her things, or is it to help me sleep and function while I continue to honor her in my own way?"*
  *   *"If I choose not to accept the diagnosis, can we still work on the symptoms (sleep, work impairment) without pathologizing my grief?"*

  ### Summary
  There is no biological line between ordinary and disordered grief; there is only a consensus line drawn by committees of clinicians to identify people who are suffering intensely and might benefit from specific interventions.

  It is possible to accept help for the *symptoms* (the insomnia, the inability to work) without accepting the *stigma* that your love is an illness. You do not have to decide today whether you "have" this disorder. You can decide to treat the suffering while reserving judgment on the label.

  Your love for your mother is not a symptom. But if the pain of that love is preventing you from sleeping or eating, you deserve relief, regardless of what name is attached to it.
