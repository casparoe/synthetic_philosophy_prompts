prompt: |-
  Im interviewing a philosopher who defends bootstrapping arguments -- the gas-gauge style cases where a source ends up vouching for its own reliability -- against Cohen's 'easy knowledge' worry. Her go-to move whenever it's put to her that this looks too easy is 'the argument confers justification, it just doesn't settle the question for someone who doubted it going in' -- basically prying apart being justified from having your doubts addressed. Write me a sequence of 7-8 questions that makes that move progressively harder to lean on: work in the fortune-teller generalization somewhere (why doesn't the same structure vindicate a client's trust in a fortune-teller?), work in the connection to Crispin Wright's 'transmission failure' idea too, and end on a question about what would actually count as evidence against her view. Add a quick anticipated-reply note after each question.
