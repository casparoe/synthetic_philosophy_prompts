          *   The Goal: Maximize the *minimum* score (maximin) or ensure both get >50 points (based on their own valuation).
          *   Why it beats 50/50: If you value the house at 80 points and the ex values it at 20, giving you the house creates more total "happiness" than selling it and splitting cash.
      *   **Address the Core Question (Verification):**
          *   *Can you verify the outcome beforehand?* No, because it depends on the ex's input.
          *   *Can you verify the *promise*?* Yes, by asking for the algorithm's name and properties.
          *   *Key Question to ask:* "Is this procedure **envy-free** and **equitable**?"
          *   *The "Safety Net":* The user should insist on a **reservation value**. (i.e., "I will not accept any outcome where my total point value is less than 50.")
      *   **The "Trust" Issue:**
          *   Mediators aren't always mathematicians.
          *   The "Black Box" risk: If the mediator won't explain the formula, walk away.
          *   Strategic Bidding: If the ex knows the system, they might lie. (Though in mediation, honesty is usually the policy).
      *   **Advice for the Novelist (and the Divorcee):**
