answer: |-
  Here is a brand new example built on the exact "Death in Damascus" structure, stripped of all supernatural elements and set in a mundane business context.

  ### The Scenario: The Food Truck Standoff

  **The Setup**
  You own an independent food truck, "The Spicy Pear." You need to choose a parking spot for today's lunch rush. There are two available spots: **1st Street** and **2nd Street**. Both streets have identical foot traffic, zoning laws, and electricity hookups. Under normal conditions, parking on either street yields a profit of **$1,000**.

  **The Competitor**
  Your rival is a corporate chain called "MegaBurger." They want to crush you. If MegaBurger parks on the *same* street as you, they will undercut your prices and drown you in advertising, reducing your profit to **$100**. If you park on a *different* street from them, you keep your full **$1,000**.

  **The Predictor**
  MegaBurger does not know where you are going in real-time. However, their headquarters locked in their location **yesterday evening** using a proprietary algorithm ("MarketMind"). This algorithm analyzes your past behavior, social media posts, sleep patterns, and even your recent search history to predict your decision with **99% accuracy**.

  Crucially: MegaBurger's location is already fixed. They are already parked somewhere. You just don't know where. But wherever they parked, it is almost certainly where they *predicted* you would park.

  ### The Evidential Decision Theory (EDT) Loop

  You are sitting in your truck at 8:00 AM, deciding which street to drive to. You are an evidential decision theorist. You reason as follows:

  1.  **Current Intention:** "I'm leaning toward **1st Street**."
  2.  **Evidential Update:** "If I intend to go to 1st Street, that is strong evidence that the MarketMind algorithm predicted 1st Street. Since the algorithm is 99% accurate, MegaBurger is almost certainly already parked on 1st Street."
  3.  **Expected Value:** "If I go to 1st Street, I'll likely make only $100. If I switch to 2nd Street, the evidence suggests MegaBurger predicted 1st, so they aren't on 2nd. I'd make $1,000."
  4.  **Decision:** "Okay, I'm switching to **2nd Street**."

  *But the moment you commit to 2nd Street, the logic flips:*

  1.  **New Intention:** "Okay, I've decided on **2nd Street**."
  2.  **Evidential Update:** "If I intend to go to 2nd Street, that is now the evidence. The MarketMind algorithm predicted 2nd Street. MegaBurger is almost certainly parked on 2nd Street."
  3.  **Expected Value:** "If I go to 2nd Street, I'll make $100. If I switch back to 1st Street, I'll make $1,000."
  4.  **Decision:** "Wait, I should switch back to **1st Street**."

  **The Result:** You are stuck in an endless loop of non-ratifiable choices. Neither option is stable because the act of *choosing* it provides the evidence that makes it the *wrong* choice. You can never form an intention that, once held, still looks like the best option.

  ### Why Causal Decision Theory (CDT) Doesn't Loop

  A causal decision theorist looks at the same situation but breaks the loop immediately. They ask: *"Does my action right now **cause** MegaBurger to move?"*

  The answer is **no**. MegaBurger submitted their permit yesterday. Their truck is physically parked on one of the two streets right now. Your steering wheel cannot causally influence their location in the past.

  Therefore, the CDT agent treats the probability of MegaBurger's location as **fixed** (say, 50/50, since you have no other info).
  *   **Expected Value of 1st Street:** $(0.5 \times \$100) + (0.5 \times \$1,000) = \$550$.
  *   **Expected Value of 2nd Street:** $(0.5 \times \$1,000) + (0.5 \times \$100) = \$550$.

  CDT says both options have equal value. It doesn't tell you to switch based on your intention, because it knows your intention doesn't change the reality of where the rival truck is parked. You might still lose money, but you won't spend the morning spinning in circles in the driveway.
