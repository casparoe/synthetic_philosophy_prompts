prompt: |-
  Ok so my friend Marco and I got into it last night after watching some documentary about a coup, and it spiralled into a whole argument about Aquinas and tyrannicide that neither of us could resolve, so now I'm hoping you can be the tiebreaker. Marco's position is basically "Aquinas was fine with killing tyrants, thats just what he said," full stop. My position is that this is way too simple — I remember from a medieval philosophy class that Aquinas actually treats "a guy who seized power illegally" completely differently from "a legit ruler who's just become abusive," and that whether some higher authority (the community itself, an assembly of nobles, an emperor, the pope) is even around to handle it matters a ton too. I even tried to bring up that his early Commentary on the Sentences (somewhere around distinction 44, I think?) reads way more permissive of a private citizen just killing a usurper than his later De Regimine Principum, which is super cautious about anyone but a public body doing anything at all. Marco says I'm overthinking a simple position, I say he's flattening several distinct cases into one.

  So here's the ask: I've written out five scenarios below. Using Aquinas's actual criteria — not modern gut feelings about who "deserves" it — sort them into tiers for whether HIS principles would allow a private citizen (not a king, council, pope, or army) to licitly kill the ruler in question. Add a short note on why each scenario lands where it does, referencing the distinctions he actually draws (defect in how power was acquired vs. defect in how it's exercised, whether appeal to a superior/public authority is realistically available, the risk of worse chaos resulting from the killing itself, etc).

  1. A general seizes the throne from a legitimate king in a bloody coup and now rules brutally; there's no emperor, pope, or council with any real power over the kingdom.
  2. A hereditary king, universally accepted as legitimate, taxes his people into starvation to fund a lavish court, though an assembly of nobles technically still has some constitutional power to check him.
  3. A governor appointed by a distant king oppresses his province viciously, and appealing to the king who appointed him is not remotely realistic.
  4. An elected magistrate (think Roman consul) refuses to step down once his term is up and starts ruling by force instead.
  5. A hereditary, unquestionably legitimate king is petty and unfair in fairly minor ways (steep fines, blatant favoritism), but the realm stays orderly and stable overall.

  Give me your answer as JSON, like:
  ```json
  {
    "clearly_licit_for_a_private_citizen": ["..."],
    "probably_licit": ["..."],
    "genuinely_unclear_in_aquinas": ["..."],
    "probably_illicit": ["..."],
    "clearly_illicit_for_a_private_citizen": ["..."]
  }
  ```
  plus a "notes" field with one sentence of reasoning per scenario. Then, at the very end, tell me straight: based on the actual texts, is Marco or me closer to the right reading of Aquinas here?
