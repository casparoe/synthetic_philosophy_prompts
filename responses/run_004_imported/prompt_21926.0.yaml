answer: |-
  It is completely understandable that this passage defeated you. Broad is writing in the dense, precise prose of early 20th-century metaphysics, and he is trying to carve up reality with a level of granularity that most scientists (and philosophers) usually gloss over. Your colleague was right that this is the source code for "emergence," but they were wrong to imply it's easy to compile.

  Here is the plain-English breakdown of Broad's apparatus, answering your specific questions about the relationships between the terms, followed by a single worked example.

  ### 1. The Relationship Between "Laws" and "Characteristics"

  You asked: *Is a "trans-ordinal law" just the fact that some property is an "ultimate characteristic" restated in the form of a law?*

  **Yes, essentially.** They are two descriptions of the same metaphysical fact, viewed from different angles.

  *   **The Ultimate Characteristic** is the **property itself** (the *what*). It is the feature that the higher-order object possesses (e.g., "wetness").
  *   **The Trans-ordinal Law** is the **rule of connection** (the *how*). It is the statement that says, "When constituents of Order A are arranged in Structure X, Property Y (the Ultimate Characteristic) *must* appear."

  Broad distinguishes them because science hunts for *laws*, while ontology describes *properties*. If you believe in emergence, you are claiming that there are **new laws of nature** (Trans-ordinal) that only kick in at higher levels of complexity, which guarantee the existence of **new properties** (Ultimate Characteristics) that did not exist before.

  ### 2. The Three Buckets of Properties

  You asked: *What work is the "reducible characteristics" category actually doing... rather than simply collapsing into... "ordinally neutral properties"?*

  This is the crux of Broad's system. The distinction relies on **Novelty** vs. **Predictability**.

  1.  **Ordinally Neutral (Shared):** The property exists in the parts *and* the whole. It is **not novel**.
      *   *Example:* Mass. Atoms have mass; a molecule has mass.
  2.  **Reducible Characteristics (New but Predictable):** The property exists *only* in the whole. It is **novel**, but it is **predictable** if you know the parts and the standard laws of physics.
      *   *Example:* Shape. An atom might be modeled as a sphere. A molecule has a specific "tetrahedral" shape. The atom doesn't have "tetrahedral shape." It is new to the molecule. However, if you know where the atoms sit, you can calculate the shape. It adds no new *laws*, just new math.
  3.  **Ultimate Characteristics (New and Unpredictable):** The property exists *only* in the whole. It is **novel**, and it is **unpredictable** even if you know everything about the parts and all previous laws. You need a *new law* to explain it.
      *   *Example:* Consciousness (for Broad) or Wetness (classically). Knowing everything about Hydrogen and Oxygen gas does not allow you to calculate "wetness" via math alone. You need a new rule: "When H and O combine thus, Wetness emerges."

  **Why "Reducible" doesn't collapse into "Neutral":**
  "Neutral" properties are carried over (Mass $\to$ Mass). "Reducible" properties are *generated* by the arrangement (Points $\to$ Shape). They are unique to the higher order, even if they are deducible.

  ---

  ### 3. A Worked Example: Water (H₂O)

  To make this concrete, let's apply Broad's apparatus to **Water**, using **Hydrogen and Oxygen atoms** as Order A, and the **Water Molecule/Liquid** as Order B.

  #### The Hierarchy
  *   **Order A:** Hydrogen and Oxygen atoms.
  *   **Order B:** A Water Molecule (and aggregates of them, i.e., liquid water).
  *   **Relation:** Order B is composed of Order A aggregates in a specific structure (H-O-H bond).

  #### Category 1: Ordinally Neutral Properties
  *   **Property:** **Mass / Energy.**
  *   **Why:** A Hydrogen atom has mass. An Oxygen atom has mass. A Water molecule has mass.
  *   **Test:** Does the lower order have it? Yes. Does the higher order have it? Yes.
  *   **Verdict:** Neutral. No emergence here; just summation.

  #### Category 2: Reducible Characteristics
  *   **Property:** **Molecular Geometry (Bond Angle).**
  *   **Why:** A single Oxygen atom does not have a "104.5-degree bond angle." That property only exists when it is part of the Water molecule (Order B). So, it is *characteristic of the order*.
  *   **However:** If you know the electromagnetic properties of the electrons in Order A (the atoms) and the laws of quantum mechanics (intra-ordinal laws), you *can* calculate that they will settle at 104.5 degrees.
  *   **Test:** Is it new to the higher order? Yes. Can it be deduced from the lower order + known physics? Yes.
  *   **Verdict:** Reducible. It is a "resultant" property, not an emergent one.

  #### Category 3: Ultimate Characteristics
  *   **Property:** **Wetness (or Solvency).**
  *   **Why:** Hydrogen is a gas. Oxygen is a gas. Neither is "wet." Wetness is a property unique to the Water aggregate (Order B).
  *   **However:** Broad argues (and classical emergentists agree) that you cannot look at the equations for Hydrogen and Oxygen and *derive* "wetness" mathematically. There is no variable for "wetness" in particle physics. To get wetness, nature must obey a **Trans-ordinal Law**: *"When H and O arrange in this specific way, the property of Wetness manifests."*
  *   **Test:** Is it new to the higher order? Yes. Can it be deduced from the lower order + known physics? No (according to the theory).
  *   **Verdict:** Ultimate Characteristic. This is the "Emergent" property.

  #### The Corresponding Law
  *   **The Trans-ordinal Law:** The statement: *"Aggregates of H and O in H₂O structure possess the irreducible property of Wetness."*
  *   **The Ultimate Characteristic:** The property: *"Wetness."*

  ---

  ### 4. How This Applies to Your LLM Argument

  Since you are debating this in the context of Large Language Models, here is how Broad's apparatus maps to your specific workplace argument. This might help you deploy the philosophy without sounding like you're name-dropping.

  If your colleague claims LLM abilities are **emergent** in Broad's sense, they are claiming:
  1.  **Trans-ordinal Law:** There is a new rule of nature (or computation) that kicks in at scale.
  2.  **Ultimate Characteristic:** The model possesses a capability (e.g., "reasoning" or "theory of mind") that **cannot** be deduced from the architecture of the individual neurons or the loss function, even in principle. It is a qualitative leap.

  If you claim the abilities are **artifacts of plotting/benchmarks**, you are arguing:
  1.  **Reducible Characteristics:** The abilities look new, but they are actually just complex mathematical results of the lower-order weights and gradients. If we had enough compute, we could derive the "reasoning" from the "matrix multiplication." It is *characteristic of the order* (only the big model does it), but it is *reducible* (it's just math).
  2.  **Ordinally Neutral:** Some "abilities" are just measurements of things the smaller models could already do, but we didn't measure them until the big models arrived (e.g., basic pattern matching).

  **The Knockout Punch:**
  Broad's definition of **Emergence (Ultimate Characteristics)** is extremely strict. It requires **unpredictability in principle**, not just in practice.
  *   If the LLM's ability was *surprising* because we didn't expect the math to work out that way, that is a **Reducible Characteristic** (unexpected, but deducible).
  *   If the LLM's ability is *emergent* in Broad's sense, it means no amount of analyzing the code or weights would ever predict the ability without actually running the system.

  Most computer scientists argue that LLMs are purely **Reducible**. The "emergence" is just complexity hiding the reducibility. Broad would likely agree: unless you posit a new law of physics/computation that applies only to transformer architectures at scale, you are dealing with Reducible Characteristics, not Ultimate Ones.

  ### Summary Table

  | Term | Plain English | Example (Water) | Example (LLM) |
  | :--- | :--- | :--- | :--- |
  | **Intra-ordinal Law** | Rules within a level. | How atoms bond to atoms. | How one neuron activates another. |
  | **Trans-ordinal Law** | **The Bridge.** Rule connecting levels. | "H+O structure $\to$ Wetness." | "Scale $\to$ Reasoning." |
  | **Neutral Property** | **Shared.** Parts have it, Whole has it. | Mass. | Uses electricity / memory. |
  | **Reducible Characteristic** | **New but Predictable.** Only Whole has it, but Parts explain it. | Molecular Shape. | Next-token prediction accuracy. |
  | **Ultimate Characteristic** | **New & Unpredictable.** Only Whole has it, Parts *don't* explain it. | Wetness / Solvency. | "Understanding" / "Intent" (debatable). |

  Broad's system is a tool for demanding precision. When someone says "emergent," ask them: *"Is this a Reducible Characteristic (complex but deducible) or an Ultimate Characteristic (requiring a new law)?"* That is usually where the argument gets resolved.
