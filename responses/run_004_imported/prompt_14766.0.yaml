answer: |-
  **Title:** The Bounds of the Motivational Set: A Defense of Williamsian Internalism

  Bernard Williams's "Internal and External Reasons" constitutes a watershed in meta-ethics, challenging the rationalist intuition that moral obligations generate reasons for action independently of an agent's subjective concerns. Williams argues that for a reason statement ("A has a reason to $\phi$") to be true, it must be grounded in the agent's "subjective motivational set" ($S$). This internalist thesis is often met with two formidable objections: first, that the mechanism connecting $S$ to action—the "sound deliberative route"—is so elastic it collapses the distinction between internal and external reasons; and second, that internalism eviscerates the categorical force of morality, rendering the claim that a callous man has a reason to be kind a fiction. This essay will reconstruct Williams's argument with sufficient precision to evaluate these objections, arguing that while the elasticity worry requires a strict policing of deliberative procedures, Williams is ultimately correct. Internal reasons exhaust the space of genuine practical reasons, but we must accept the unwelcome consequence that morality does not bind agents who lack the contingent psychological dispositions to care about others.

  ### I. The Architecture of Internal Reasons

  To evaluate the objections, we must first state Williams's Internal Reasons Statement (IRS) with precision. Williams contends that a reason statement is true only if the agent has a motive that would lead to the action via a sound deliberative route from their existing $S$.

  The subjective motivational set, $S$, is not limited to crude desires. It includes "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent." However, these elements are *contingent* features of the agent's psychology. They are what the agent *actually* cares about, not what they *ought* to care about.

  The crux of the IRS lies in the "sound deliberative route" (SDR). For a reader to reconstruct the SDR unaided, it must be defined by both its permissive operations and its constitutive limits. A sound deliberative route permits the following operations on elements of $S$:
  1.  **Instrumental Reasoning:** Determining the means to achieve an end found in $S$.
  2.  **Constitutive Reasoning:** Recognizing that a specific action is a constituent part of a general project in $S$ (e.g., realizing that visiting a friend is part of being a good friend).
  3.  **Factual Correction:** Eliminating errors of fact that obstruct the pursuit of $S$-elements.
  4.  **Imaginative Rehearsal:** Vividly considering the consequences of actions to see if they align with or frustrate elements of $S$.

  Crucially, the SDR is bound by a **Negative Constraint**: No step in the deliberative process may generate a motivating element *ex nihilo*. Every output of deliberation must be traceable via a chain of reasoning to an input element originally present in $S$. If an agent begins with no element in $S$ that bears on the welfare of others, no amount of factual correction or instrumental reasoning can produce a motive to spare them cruelty. The SDR is a function mapping $S$ to motivations; it is not a generator of new $S$-elements.

  Consequently, an "external reason" statement—one claiming A has a reason to $\phi$ despite no link to $S$ via SDR—is, for Williams, false or unintelligible. It posits a reason that cannot explain action, as explanation requires a motivational link, and it relies on a "false philosophical picture" where reason alone can motivate.

  ### II. The Elasticity Objection and McDowell's Challenge

  The first major objection concerns the elasticity of the SDR. Critics argue that if $S$ includes "dispositions of evaluation" and deliberation includes "reflection on commitments," the internalist can smuggle any moral requirement back into $S$. For instance, a Kantian might argue that any agent capable of deliberation is implicitly committed to the value of rational agency, and thus to respecting others. If the SDR is this capacious, the internal/external distinction does no work; internalism becomes externalism in disguise.

  John McDowell sharpens this objection. He argues that the virtuous agent's perception of a situation is not merely an extension of latent desires. When a virtuous person sees a reason to help, they are not consulting a pre-existing desire; they are perceiving a demand inherent in the situation. For McDowell, the acquisition of virtue involves a cognitive shift that allows one to see reasons previously invisible. This suggests that reasons exist independently of the prior $S$, waiting to be perceived by the properly trained agent. If Williams accepts that deliberation can lead to this "new perception," he concedes the externalist point. If he denies it, he seems to deny the reality of moral development.

  The internalist reply must be to tighten the Negative Constraint on the SDR. Williams can acknowledge that moral education changes $S$, but he must insist that *before* that change, the reason did not exist for that agent. When a callous man is educated into kindness, his $S$ is altered—perhaps through sentiment, conditioning, or imaginative expansion. Once the new element (concern for others) is in $S$, he has an internal reason. But the claim that he had the reason *before* the education is the externalist error.

  To meet the elasticity worry, the internalist must deny that "rationality" itself provides substantive ends. Deliberation can clarify what loyalty involves, but it cannot generate loyalty where there is none. McDowell's "perception" is real, but it is a perception enabled by a specific shape of $S$. If an agent lacks the $S$-elements that make virtue possible (e.g., basic empathy), the "reason" remains external and thus non-existent. The distinction survives only if we refuse to treat the *capacity* for deliberation as itself a commitment to moral ends. The SDR processes inputs; it does not validate them.

  ### III. The Categorical Pretensions of Morality

  The second objection strikes at the normative heart of the matter. Morality presents itself as categorical: the callous man has a reason to stop being callous even if he enjoys cruelty and has no projects involving others. Internalism reduces this to a hypothetical imperative: "If you want to fit in/avoid guilt/satisfy some latent sentiment, you have a reason." Rationalists argue this is a reductio ad absurdum of internalism. It makes moral failure a matter of prudence or psychology rather than irrationality, and it renders moral argument powerless against the truly selfish.

  Williams's response is to distinguish between *having a reason* and *being subject to blame*. He grants that we will (and should) blame the callous man. We use sanctions, social pressure, and moral sentiment to modify his $S$. However, we should not lie about the metaphysics of the situation. To say he has a "reason" when he has no motivational anchor is to use language to do work it cannot do. The "categorical pretension" is a feature of moral language, not a feature of the world.

  The internalist defense here is that externalism offers a false comfort. Positing an external reason does not actually give the callous man a motive; it merely asserts that he *should* have one. If reasons are essentially linked to explanation and action (as Williams argues they must be to be practical), then a reason that cannot motivate is a contradiction in terms. The rationalist preserves the "ought" but severs the link to the "can." Internalism preserves the link to action but narrows the scope of the "ought."

  ### IV. Verdict: Internalism and the Cost of Truth

  Does internalism exhaust the space of genuine practical reasons? The verdict must be **yes**, but with a significant qualification regarding the "sound deliberative route."

  Internalism is superior because it respects the Humean theory of motivation: belief alone cannot motivate without a conative state. External reasons require a "queer" metaphysical link between objective facts and motivation that has never been satisfactorily explained. If a reason cannot, even in ideal conditions, motivate the agent, in what sense is it a *practical* reason? It becomes a mere evaluative fact, like "this painting is beautiful," which does not necessarily impel action.

  However, for internalism to hold, we must rigorously defend the Negative Constraint on the SDR against the elasticity objection. We must accept that "reflection on commitments" cannot generate new fundamental ends. If we allow the SDR to include substantive norms of rationality (e.g., "a rational agent must value humanity"), internalism collapses into the rationalism Williams rejects. Therefore, to save internalism, we must concede that there are possible agents (the "rational solipsists") for whom moral reasons simply do not exist.

  This leads to the definite verdict: **Internal reasons exhaust the space of genuine practical reasons, but this entails that morality is not universally binding on all rational agents.**

  We must reject the idea that the callous man has a reason he cannot recognize. He does not have a reason. He has a defect in his subjective motivational set. Our response should not be to invent an external reason to shame him, but to recognize that our moral practices are aimed at shaping $S$ through education and sentiment, not appealing to a universal rationality. This is the "unwelcome" result Williams acknowledges, but it is the price of intellectual honesty.

  To conclude otherwise—to insist the callous man *does* have a reason—is to prioritize the categorical pretensions of morality over the explanatory function of reasons. It is to prefer a comforting fiction to a psychological truth. While McDowell is right that virtue changes how we see the world, he is wrong to think this validates reasons prior to the change. The space of reasons is bounded by the contours of the human motivational set. If those contours do not include others, the space of reasons does not reach them. We should not expand the definition of "reason" to cover this gap; we should instead work to ensure that human $S$-sets are cultivated such that the gap rarely appears. Internalism is true, but it leaves morality vulnerable. We must accept that vulnerability rather than cover it with metaphysical fiction.
