answer: |-
  You have hit on one of the most genuine and substantive debates in the philosophy of science. Your assessment is sharp: the "rationalist" consensus (Bayesianism as the only sane option) is largely a pragmatic stance derived from decision theory and epistemology, whereas the academic metaphysics of probability is much more fragmented.

  You are correct that **Propensity Theory** (specifically Popper's single-case version) was designed explicitly to solve the problems you identified: it grants objectivity without requiring an actual infinite sequence (solving the single-case problem) and grounds chance in the world rather than the mind (solving the subjectivity problem).

  However, the reason propensity theory hasn't "settled the debate" is not merely philosophical path-dependence. There are significant technical and metaphysical objections that prevent it from achieving hegemony. If frequentism is a "historical dead end," propensity theory is often viewed by its critics as a "metaphysical cul-de-sac."

  Here are the four main reasons why propensity theory is not treated as the definitive winner for objective chance.

  ### 1. The "Dormitive Virtue" Objection (Metaphysical Obscurity)
  The most common philosophical charge against propensity theory is that it is explanatorily empty. This goes back to Molière's joke about opium putting people to sleep because of its "dormitive virtue."

  *   **The Critique:** To say "This atom has a 50% propensity to decay" looks suspiciously like saying "This atom has a 50% probability of decaying because it has a property that makes it 50% likely to decay."
  *   **The Problem:** Unlike *fragility* (which can be reduced to molecular structure) or *solubility* (which reduces to chemical bonding), propensities are rarely given a reductive physical account. They are posited as primitive, irreducible dispositions. For many naturalists, positing a new, unobservable, sui generis physical property solely to ground the probability calculus feels like cheating. It solves the metaphysical problem by stipulation rather than explanation.

  ### 2. Humphreys' Paradox (The Technical/Kolmogorov Problem)
  You asked if there is a technical problem with treating propensities as "garden-variety probabilities." **Yes, there is.** This is known as **Humphreys' Paradox** (1985), and it is arguably the strongest technical argument against single-case propensity theory.

  *   **The Issue:** The Kolmogorov axioms (which govern standard probability) allow for the inversion of conditional probabilities via Bayes' Theorem. If $P(A|B)$ is defined, then $P(B|A)$ is mathematically defined (provided $P(A) > 0$).
  *   **The Propensity Conflict:** Propensities are intended to be **causal dispositions**. Causation is asymmetric. If a physical setup $S$ has a propensity to produce outcome $O$, it makes sense to talk about $Propensity(O|S)$. It makes *no sense* to talk about the propensity of the setup $S$ given the outcome $O$. The outcome does not dispose the setup to exist.
  *   **The Consequence:** If propensities are causal dispositions, they cannot satisfy the standard probability calculus (specifically the axiom of conditional probability). If they *do* satisfy the calculus, they cease to be purely causal dispositions. This forces a dilemma: either propensities aren't probabilities (in the Kolmogorov sense), or they aren't causal propensities.

  ### 3. The Reference Class Problem Returns (The "Setup" Problem)
  You argued that propensity theory solves the reference class problem because it attaches to the "single case" or the "physical chance setup." However, critics argue the problem simply migrates from the *class* to the *setup*.

  *   **The Issue:** A propensity is a property of a "chance setup." But what constitutes the setup?
      *   Is it just the coin?
      *   The coin + the flipping mechanism?
      *   The coin + the mechanism + air pressure?
      *   The coin + mechanism + air pressure + gravitational field?
  *   **The Problem:** To assign a specific propensity value (e.g., 0.5), you must specify the physical conditions completely. If you leave out air resistance, the propensity changes. But specifying the conditions *completely* essentially individuates the case so narrowly that you return to the single-case problem (no two setups are identical). If you specify them broadly, you are back to choosing a reference class of "similar setups."
  *   **Conclusion:** Propensity theory does not eliminate the arbitrariness of selecting which physical features are "relevant" to the chance setup. This is the reference class problem in physical clothing.

  ### 4. Epistemic Access (How do we measure it?)
  If propensities are objective features of the world, distinct from frequencies, how do we measure them?

  *   **The Dilemma:**
      1.  **If we measure them via frequencies:** Then our epistemic access to propensities is entirely mediated by frequentist data. This makes propensities metaphysically distinct but epistemologically idle. Why posit them if we only ever know them through frequencies? (This leads to the charge that it's just "Frequentism with extra steps.")
      2.  **If we measure them via theory (e.g., QM):** Then our belief in propensities rests on our belief in the physical theory. But if the physical theory is underdetermined (as interpretations of QM are), the propensities are too.
  *   **The Principal Principle:** David Lewis's *Principal Principle* attempts to bridge objective chance and subjective credence (your credence should match the objective chance). But Lewis himself was a Humean Supervenientist who famously rejected propensities because he couldn't see how a "future-looking" disposition could supervene on the current arrangement of local qualities. This created a massive rift in 20th-century philosophy between Humeans (who favor Best System Analysis of chance) and Anti-Humeans (who favor Propensity).

  ### The Current Consensus: Pluralism
  Because of these difficulties, the modern academic consensus (championed by philosophers like **Alan Hájek**, **Antony Eagle**, and **Christopher Hitchcock**) is not that Propensity won, but that **Probability is Pluralistic.**

  *   **Frequentism** is accepted as a useful model for data analysis and long-run stability (but not as a definition of truth).
  *   **Bayesianism** is accepted as the correct logic of rational belief and inference (but not as a definition of physical chance).
  *   **Propensity** is kept in the toolkit for specific metaphysical contexts (like Quantum Mechanics), but often in a modified form (e.g., "Long-Run Propensity" rather than Popper's "Single-Case Propensity").

  ### Summary
  You are right to reject the rationalist blogosphere's dismissal of objective chance. However, Propensity theory hasn't settled the debate because:
  1.  **Metaphysically:** It risks being a "dormitive virtue" (circular explanation).
  2.  **Formally:** It struggles to map onto the Kolmogorov axioms without losing its causal nature (Humphreys' Paradox).
  3.  **Epistemologically:** It is difficult to distinguish empirically from frequentism.
  4.  **Conceptually:** The reference class problem re-emerges as the "setup specification" problem.

  **Recommendation:** If you want to dive deeper into the technical objections, look for **Alan Hájek's** work, specifically *"Fifteen Arguments against Hypothetical Frequentism"* (which touches on propensity) and his SEP entry on *"Interpretations of Probability."* Also, look up **Paul Humphreys'** original 1985 paper *"Propensities are not Probabilities."*

  The debate persists not because philosophers are stubborn, but because "probability" turns out to be a concept that does three different jobs (logic, statistics, and physics), and no single metaphysical story does all three perfectly.
