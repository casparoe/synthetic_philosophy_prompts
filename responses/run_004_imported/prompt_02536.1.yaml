      *   **Bacteria/Horizontal Gene Transfer (HGT):** The challenge to the "Tree of Life" and lineage-based concepts.
      *   **The "Promiscuous" Critique:** Pluralism allows too much flexibility; Realism risks being dogmatic.
      *   **The "Arbitrary" Critique:** Realism draws lines where nature draws gradients; Pluralism risks losing objective truth.
      *   **Concessions:**
          *   Realist: Admitting operational difficulty/practical utility of pluralism.
