prompt: |-
  I am preparing the session on higher-order evidence for a graduate seminar on rational belief that I am co-teaching this term, and before I commit anything to my slides, I would like a sanity check on how I am planning to motivate the material. My working gloss on "epistemic akrasia" has been that it is a fairly direct transposition of Aristotelian practical akrasia into the doxastic case: just as the practically akratic agent judges, all things considered, that she ought to do A, yet does B instead because appetite overpowers her better judgment, the epistemically akratic thinker judges that her evidence does not support P, and yet goes on believing P anyway, out of something like intellectual laziness, stubbornness, or wishful thinking — a failure to let her own considered, all-things-considered assessment actually govern what she believes.

  On this reading, when the literature constructs cases in which a reasoner learns that she may have taken a drug that impairs logical inference, or that a normally reliable colleague has reached the opposite verdict on the very same problem, the point of the example is to show that she is tempted toward a kind of doxastic self-indulgence if she brushes the higher-order information aside and simply keeps believing whatever her first-order reasoning told her. So the "enkratic," or "no akrasia," requirement that writers such as Sophie Horowitz and David Christensen take seriously strikes me, on reflection, as basically a demand for more epistemic self-discipline: thinkers should not let stubbornness or motivated reasoning stop them from following through on what their all-things-considered judgment recommends.

  My co-instructor thinks this "weakness of will, but for beliefs" framing is basically right and would like to present it to the class this way. Before we do, I would value your view: is this an accurate rendering of what is actually doing the philosophical work in these cases and in the requirement itself, or is something importantly different going on that we would end up misrepresenting to our students?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Preparing a graduate seminar session on higher-order evidence (HOE) and rational belief.
      *   **Task:** Sanity check on a specific motivational framing of "epistemic akrasia."
      *   **User's Framing:** Epistemic akrasia is a direct transposition of Aristotelian practical akrasia (weakness of will) into the doxastic realm.
          *   Practical: Judge ought to do A, do B (due to appetite/passion).
          *   Epistemic: Judge evidence doesn't support P, believe P (due to laziness/stubbornness/wishful thinking).
          *   HOE Cases (drugs, disagreeing colleagues): Ignoring HOE is "doxastic self-indulgence."
          *   Enkratic Requirement: A demand for "epistemic self-discipline."
      *   **Co-instructor's View:** Agrees with this framing.
      *   **Question:** Is this accurate, or does it misrepresent the philosophical work being done in the literature (specifically referencing Horowitz, Christensen, etc.)?

  2.  **Evaluate the Philosophical Content:**
      *   **The Core Concept:** Epistemic Akrasia.
      *   **Standard Definition:** Believing $P$ while believing that one's evidence does not support $P$ (or that believing $P$ is irrational).
      *   **User's Analogy:** Practical Akrasia (Weakness of Will).
      *   **Key Literature:** David Christensen ("Disagreement, Drug, and Self-Trust"), Sophie Horowitz ("Epistemic Akrasia"), Maria Lasonen-Aarnio (Unreasonable Knowledge), etc.
      *   **The Problem with the User's Framing:**
          *   *Voluntarism vs. Involuntarism:* Belief is generally considered involuntary (doxastic involuntarism). You can't just choose to believe or disbelieve at will. Practical akrasia involves *action*, which is voluntary. Epistemic akrasia involves *belief*, which is often not under direct voluntary control.
          *   *The Nature of the Conflict:* In practical akrasia, the conflict is between judgment and *desire/appetite*. In the standard HOE cases (drugs, disagreement), the conflict is often between *first-order evidence* and *higher-order evidence*. The agent isn't necessarily being "stubborn" or "lazy." They might be responding rationally to the first-order evidence while acknowledging the HOE.
          *   *The "Rationality" of Akrasia:* A major debate in the HOE literature is whether epistemic akrasia is *always* irrational. Some (like Christensen/Horowitz) argue there's a rational requirement against it (Enkrasia). Others (like Lasonen-Aarnio or Worsnip) argue that in some cases, akrasia is the rational response (e.g., when the HOE is misleading).
          *   *The "Why" of the Violation:* The user frames violating the enkratic requirement as a *vice* (laziness, stubbornness). The literature often frames it as a *structural rationality* issue. It's not about moral failing; it's about coherence between attitudes.
          *   *HOE Specifics:* In the "drug case," the agent doesn't necessarily judge "My evidence doesn't support P." They judge "I might be impaired." If they continue to believe P, is it because they are stubborn? Or is it because the first-order evidence is so overwhelming that even accounting for possible impairment, P is still likely? Or is it that they can't help but believe P?
          *   *The "All-Things-Considered" Judgment:* In practical akrasia, the agent acts against their ATC judgment. In epistemic cases, the "ATC judgment" is tricky. If I believe P, I usually take my evidence to support P. To believe P *and* believe my evidence doesn't support P is a specific, somewhat unstable state.
          *   *Misrepresentation Risk:* Framing it as "weakness of will" suggests the agent *could* easily stop believing P if they just tried harder. This ignores the normative force of evidence. If the first-order evidence is overwhelming, "disciplining" oneself to suspend judgment might actually be *less* rational.

  3.  **Synthesize the Critique:**
      *   **Acknowledge the Pedagogical Value:** The analogy is intuitive and helpful for *introducing* the concept. It grabs attention.
      *   **Highlight the Crucial Disanalogy (Voluntarism):** Belief isn't action. You can't "force" yourself to disbelieve via willpower. This makes "self-discipline" a misleading metaphor.
      *   **Highlight the Normative Status:** The literature isn't just about avoiding vice (stubbornness). It's about structural coherence. Sometimes akrasia might be rational (Lasonen-Aarnio's point).
      *   **Highlight the Source of Conflict:** In HOE cases, the conflict is often evidence vs. evidence (1st order vs. 2nd order), not Judgment vs. Passion.
      *   **Specific Authors:** Christensen and Horowitz do argue for a requirement, but they frame it in terms of *rational coherence*, not *moral/volitional discipline*.

  4.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Validate the intuition. It's a common starting point.
      *   *The "Yes" part:* It captures the *structure* of the conflict (attitude vs. normative judgment about attitude).
      *   *The "No" part (The Meat):*
          1.  **Doxastic Involuntarism:** You can't believe at will. "Self-discipline" implies you can. This is the biggest philosophical hurdle.
          2.  **Vice vs. Structure:** The literature treats this as a requirement of rationality (structural), not a moral failing (vice). Akrasia can happen even to virtuous agents.
          3.  **The Rationality of Akrasia:** Mention the "steadfast" view or Lasonen-Aarnio. Sometimes sticking to your guns *is* rational despite HOE. Framing it as "self-indulgence" prejudges the case against the steadfaster.
          4.  **Nature of HOE:** HOE often defeats the *justification* for the belief, not just the will to maintain it.
      *   *Recommendation:* Use the analogy as a hook, but pivot quickly to the disanalogies. Don't let it settle as the *definition*.
      *   *Tone:* Collegial, respectful of their expertise (they are co-teaching a grad seminar), but firm on the philosophical distinctions.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Horowitz specifically talk about self-discipline?* Horowitz (2014) argues for the "Akratic Principle." She frames it as a rational requirement. She doesn't explicitly lean on Aristotelian vice.
      *   *Christensen?* Focuses on "Epistemic Modesty." Again, about rationality, not willpower.
      *   *User's specific phrasing:* "Intellectual laziness, stubbornness, wishful thinking." This psychologizes the failure. The literature usually treats it as a normative inconsistency.
      *   *Key distinction:* Practical akrasia is *acting* against judgment. Epistemic akrasia is *believing* against judgment. But since belief is truth-aimed, believing against judgment is arguably harder to make sense of than acting against judgment.
      *   *Advice:* Tell them to keep the analogy but add the "Health Warning."

  6.  **Final Polish:** Organize into "What works," "What risks misrepresentation," and "Pedagogical suggestion." Ensure references to key figures (Christensen, Horowitz, Lasonen-Aarnio, Worsnip) are accurate. (Check: Horowitz "Epistemic Akrasia" 2014. Christensen "Disagreement, Drug, and Self-Trust" 2011/2016. Lasonen-Aarnio "Unreasonable Knowledge" 2010.)

  7.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  This is a very thoughtful pedagogical question. You are right to pause before committing to this framing in a graduate seminar. While the analogy to Aristotelian practical akrasia is a common and intuitive entry point, relying on it as the *primary* motivation for the higher-order evidence (HOE) literature risks obscuring the specific normative and psychological mechanisms that make the HOE debate philosophically distinct from practical ethics.

  Here is a breakdown of where your framing works, where it risks misrepresenting the literature (specifically Christensen, Horowitz, and their interlocutors), and a suggestion for how to pivot in the classroom.

  ### 1. What the Framing Gets Right
  Your gloss captures the **structural form** of the conflict accurately.
  *   **Practical Akrasia:** Action $A$ vs. Judgment "I ought not do $A$."
  *   **Epistemic Akrasia:** Belief $P$ vs. Judgment "My evidence does not support $P$."

  In both cases, there is a fragmentation between a first-order attitude and a higher-order normative assessment. Using this parallel is an excellent way to get students to grasp the *shape* of the problem. It makes the abstract notion of "higher-order evidence" feel immediate and personal.

  ### 2. Where the Framing Risks Misrepresentation
  If you present the "weakness of will" model as the *explanation* for why the Enkratic Requirement holds, you may introduce three significant philosophical distortions that the literature explicitly tries to avoid.

  #### A. Doxastic Involuntarism vs. Volitional Control
  The most significant disanalogy is that practical akrasia presupposes voluntary control over action, whereas belief is widely considered involuntary (doxastic involuntarism).
  *   **The Risk:** By framing the violation of the enkratic requirement as a failure of "epistemic self-discipline" or "stubbornness," you imply that the agent *could* simply choose to stop believing $P$ if they tried harder.
  *   **The Literature:** Christensen and Horowitz are not arguing that agents are morally failing to discipline their wills. They are arguing about **rational coherence**. In the "drug case," the agent often *cannot* help but believe $P$ because the first-order proof is overwhelming. The philosophical puzzle is not "why won't they discipline themselves?" but "is it rational to hold a belief you take to be unsupported, even if you can't help holding it?"
  *   **Consequence:** If you frame it as a vice (laziness/stubbornness), you make the "steadfast" response (keeping the belief despite HOE) look like a moral failing, rather than a potentially rational response to misleading higher-order evidence.

  #### B. Vice vs. Structural Rationality
  Your framing psychologizes the failure (laziness, wishful thinking). The HOE literature generally treats the Enkratic Requirement as a constraint of **structural rationality**, not a prohibition on vice.
  *   **The Risk:** Students might think the requirement is about being a "good intellectual citizen."
  *   **The Literature:** Sophie Horowitz's argument for the Akratic Principle is that akratic states are *incoherent*, not necessarily vicious. One can be epistemically akratic through no fault of one's own (e.g., if one is misled by complex HOE). David Christensen's work on epistemic modesty focuses on how confidence levels should adjust to maintain calibration, not on willpower.
  *   **Consequence:** Framing it as "self-indulgence" conflates **irrationality** with **blameworthiness**. A central debate in the seminar should likely be whether one can be rationally required to do (or believe) something one is incapable of. The "weakness of will" frame bypasses this tension.

  #### C. The Source of the Conflict (Passion vs. Evidence)
  In Aristotelian akrasia, the counter-force is *appetite* or *passion* (which opposes reason). In HOE cases, the counter-force is often *more evidence*.
  *   **The Risk:** Your framing suggests the agent is ignoring HOE because of a non-rational desire (to be right, to be lazy).
  *   **The Literature:** In many HOE cases (like the peer disagreement case), the agent ignores the HOE because the **first-order evidence** is so strong that it outweighs the HOE. They aren't being stubborn; they are weighing evidence.
      *   *Example:* If I solve a math problem and see the proof clearly, and a peer says they got a different answer, I might think, "My peer is usually reliable (HOE), but I see the proof right here (FOE)."
      *   If I stick with my answer, am I being "doxastically self-indulgent"? Or am I rationally prioritizing direct access to evidence over testimonial evidence?
  *   **Consequence:** The "weakness of will" frame prejudges the **Conciliationism vs. Steadfastness** debate. It makes the Steadfast view look like akrasia (irrational), whereas many steadfasters argue that sticking to your guns in the face of misleading HOE is the *rational* thing to do.

  ### 3. Pedagogical Recommendation
  You can keep the analogy as a **hook**, but you should explicitly dismantle it as part of the lesson. This actually makes for a better seminar discussion.

  **Suggested Slide Structure:**

  1.  **The Hook:** Present the Aristotelian analogy exactly as you have it. It is intuitive and clarifies the *structure* of the conflict.
  2.  **The Pivot (The "Health Warning"):** Immediately ask the class: *"In what ways is belief unlike action?"*
      *   Elicit **Involuntarism**: We can't believe at will. Therefore, "epistemic discipline" is a metaphor, not a literal mechanism.
      *   Elicit **Truth-Aim**: Belief aims at truth, not just coherence. Sometimes "disciplining" oneself to suspend belief in the face of overwhelming proof might be *less* truth-conducive.
  3.  **Reframing the Requirement:** Introduce Christensen/Horowitz not as demanding "self-discipline," but as demanding **coherence**.
      *   *Correction:* It is not that the agent is "stubborn." It is that the state `[Believe P] + [Believe P is unsupported]` is arguably unstable or incoherent, regardless of *why* the agent is in that state.
  4.  **The "Rational Akrasia" Challenge:** Introduce Maria Lasonen-Aarnio's work (*Unreasonable Knowledge*). She argues that sometimes we *ought* to be akratic. If your evidence is misleading, you might rationally believe $P$ while acknowledging that your total evidence (including the misleading HOE) suggests $\neg P$.
      *   If you stick with the "weakness of will" framing, Lasonen-Aarnio's position becomes unintelligible (how can it be a virtue to be weak-willed?).

  ### Summary
  Your co-instructor is right that the framing is "basically right" regarding the **structure** of the attitudes. However, it is "basically wrong" regarding the **mechanism** and **normative status** of those attitudes.

  If you present it as "epistemic self-discipline," you risk teaching students that the HOE literature is about intellectual virtue ethics (avoiding laziness) rather than epistemic normativity (managing conflicting evidence).

  **Verdict:** Use the analogy to introduce the *concept*, but explicitly mark it as a **limited metaphor** that breaks down upon closer inspection. The philosophical work in the literature is done by the tension between first-order and higher-order evidence, not by the tension between judgment and will.
