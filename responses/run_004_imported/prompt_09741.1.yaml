answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], and I've had the privilege of working in the lab with [Honoree's Name] for the last [Number] years.

  When you invite people to a retirement dinner for a woman who spent forty years authenticating masterpieces, they tend to imagine a certain character. They imagine a romantic figure. Someone who stands before a canvas, narrows her eyes, strokes her chin, and senses a disturbance in the aesthetic force. They think [Honoree's Name] spent four decades catching forgeries because she had a spiritual connection to Beauty, and that a fake simply felt "wrong" to her soul.

  If [Honoree's Name] were standing here, she would ask me to stop talking immediately, mostly because that description makes her physically ill.

  The truth is, [Honoree's Name] does not have a mystical eye for beauty. She has a very specific, very terrifying eye for anachronism. She is not a guardian of the sublime; she is a border control agent for chemistry.

  There is a famous quote of hers that circulates among the conservation staff, though we usually whisper it so the donors don't hear. She says: "The eye can't convict a fake; only the paint chip can."

  And she means it. In fact, [Honoree's Name] has spent forty years arguing a position that makes the art historians in this room nervous and the philosophers outright angry. She has always maintained that a perfect forgery is aesthetically identical to the original. If you put a perfect fake next to a real Renaissance portrait, and you blindfolded the world, [Honoree's Name] argues the world would lose nothing of value.

  So, you might ask, what was her job? If the beauty is the same, why do we need the lab?

  Well, because while the *beauty* might be identical, the *price* is not. And the *credit* is not.

  I remember a specific case, about ten years ago. A private collector brought in a small oil sketch, purported to be by Rubens. It was stunning. Truly. The brushwork was energetic, the colors were rich, the composition was dynamic. Everyone in the museum who saw it fell in love. The curators were already drafting the press release. The board members were polishing their glasses to admire it.

  It went down to the lab.

  [Honoree's Name] didn't look at the brushwork. She didn't muse on the composition. She put a microscopic sample under the spectrometer. She found a trace of a synthetic blue pigment that wasn't invented until 1820. Rubens died in 1640.

  The meeting that followed was awkward. You have never seen a room full of art historians deflate faster than when a conservation scientist tells them that the "masterpiece" they just fell in love with is chemically impossible.

  But here is the thing that defines [Honoree's Name]'s career, and the joke that only she gets: The painting didn't change. It was just as beautiful at 4:00 PM as it was at 4:15 PM. The light hitting the canvas was the same. The emotional resonance was the same. But at 4:00 PM, it was worth four million dollars. At 4:15 PM, it was worth four thousand.

  [Honoree's Name] didn't destroy the beauty. She destroyed the valuation.

  She often jokes that she wasn't protecting the museum from bad art; she was protecting the market from lies. She protected the provenance. She protected the historical record. She protected the fact that Rubens should get the credit for Rubens, even if a guy named Bob from New Jersey could paint just like him.

  That is a harder job than guarding beauty. Beauty is subjective; you can argue about it forever. But a paint chip? A paint chip doesn't lie. A paint chip doesn't care about your reputation, your donation, or your theory. A paint chip just *is*.

  And that is why we are all here. Because for forty years, [Honoree's Name] was the person in the room who trusted the evidence over the ecstasy. She was the one willing to be the bearer of bad news because she respected the truth more than she respected the story.

  To the family: You might be proud that she protected the world's beauty. You should actually be prouder that she protected the world's honesty.

  To the staff: We will miss her, mostly because now when the X-ray machine jams, we have to figure it out ourselves.

  And to [Honoree's Name]: You have spent four decades telling us what things are *not*. Tonight, we don't need analysis. We don't need spectroscopy. We don't need to know the carbon dating of the wine in your glass.

  We just know that you are here, you are retired, and for the first time in forty years, you don't have to tell anyone that something is a fake.

  Please raise your glasses. To [Honoree's Name]. May your retirement be authentic, may your leisure be provenanced, and may you never have to analyze a paint chip again.

  To [Honoree's Name]!
