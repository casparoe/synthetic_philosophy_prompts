answer: |-
  **Nominalist:** In Query 45, Berkeley defines money as a "ticket" or "counter" for reckoning power, not a commodity with intrinsic worth. This aligns perfectly with his semiotics in *Alciphron*: money is a sign whose value lies in use and convention, much like words.

  **Pragmatist:** But if value is purely conventional, what does "backing" mean in Query 51? You cannot back a convention with another convention without infinite regress. If money is just a ticket, what is the ticket *for*, if not something non-conventional?

  **Nominalist:** Backing is the collateral that sustains public confidence in the convention; it ensures the sign remains useful. But tell me: in your reading, what sets a *principled limit* on paper issue? If not convention, what stops the state from printing beyond capacity without contradicting Berkeley's nominalist commitments?

  **Pragmatist:** The limit is the nation's productive capacity. Berkeley ties the bank to land because land generates the industry the tickets command. The limit isn't metaphysical; it's physical—you cannot command labor that does not exist.

  **Nominalist:** But "productive capacity" is itself reckoned in monetary terms. How do you establish a limit without using the very convention you claim to constrain? If the measure of industry is money, your limit is circular.

  **Pragmatist:** We reckon capacity in bushels and labor-hours, not just coin. Real goods constrain the signs. If tickets exceed goods, prices rise. Berkeley knows this from the specie shortage; he wants money to circulate *things*, not fantasies.

  **Nominalist:** Yet money commands those goods only via convention. If backing is just confidence in goods, then backing is still psychological. What specific work is the land doing, if not serving as a stable sign to anchor that psychology?

  **Pragmatist:** Land produces the goods. Without land, no goods. Berkeley ties the bank to land to ensure the tickets answer to something real, not imaginary. A ticket without a corresponding harvest is just a promise to pay nothing.

  **Nominalist:** "Answer to" means "be exchanged for." But if land's value is also in its power to command labor, you haven't escaped the circle. What limits issue if not public trust? Even land is worthless without the convention to value it.

  **Pragmatist:** Trust fluctuates; land remains. Berkeley seeks a stable standard. If backing is just trust, his critique of the South Sea Bubble is moot—they had trust until they didn't. He needed a pre-emptive limit, not a post-crash explanation.

  **Nominalist:** The critique holds because South Sea lacked utility. But utility is conventional. You're forcing Berkeley into a realism about "wealth" that he rejects in metaphysics. He denies substance; why accept it in economics?

  **Pragmatist:** He rejects material substance, not causal power. Industry causes wealth. Your nominalism cannot distinguish sound credit from speculation before the crash. Berkeley's link to land is the only principled limit that saves Ireland from repeating 1720.
