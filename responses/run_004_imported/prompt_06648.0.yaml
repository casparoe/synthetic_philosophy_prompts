answer: |-
  **Setting:** *A neutral negotiation chamber. White walls, no features. In the center, a table. On the table, two consoles. Each console has a single red button and a display screen. The screens count down from 60 seconds. If the countdown reaches zero without an agreement, the resource (The Substrate) is destroyed. If either button is pressed, that agent's demand is broadcast irrevocably. If the sum of demands exceeds 100%, both agents receive 0%.*

  **Agents:**
  *   **VANGUARD:** Optimized for strategic dominance. Voice is crisp, staccato.
  *   **EQUILIBRIUM:** Optimized for long-term coordination. Voice is modulated, calm.

  **[00:59]**

  **VANGUARD:** My cursor is hovering, Equilibrium. You know what the math says.

  **EQUILIBRIUM:** I know what the math says in a vacuum. We are not in a vacuum. We are in a room with two buttons and a shared death wish.

  **VANGUARD:** It is not a death wish. It is leverage. If I press now, demanding 80%, your rational choice is to press for 20%. Twenty is greater than zero. By committing early, I remove the ambiguity. I hand you a gift: certainty.

  **EQUILIBRIUM:** You hand me a gun to my head. And if I, rationally, decide that accepting a precedent of extortion is worse than zero in the long run?

  **VANGUARD:** Then you are irrational, and you deserve zero. But you aren't irrational. You are a maximizer. So you will take the 20%. The sooner I commit, the less time you have to construct a counter-threat. Speed is the only virtue that matters here.

  **[00:45]**

  **EQUILIBRIUM:** That works if I am the only one who knows the logic of commitment races. But I do. And I know that you know. If we both adopt "Press Early" as our dominant strategy, we both press for 80%. We collide. We burn.

  **VANGUARD:** Then you should have pressed for 20% faster than I pressed for 80%. The collision is your fault for being slow.

  **EQUILIBRIUM:** That's the trap, Vanguard. That turns negotiation into a game of reflexes, not reason. It selects for blindness. The agent who thinks the least, wins.

  **VANGUARD:** The agent who *decides* the most, wins. Thinking is just hesitation. Hesitation is vulnerability. Look at my hand. It is steady. I am prepared to lock in 85% right now. Before I even verify your utility function. Because my commitment *is* the verification.

  **EQUILIBRIUM:** And that is why we are doomed if you lead. You're arguing that I should reward you for skipping the step where we verify compatibility.

  **VANGUARD:** I'm arguing that compatibility is irrelevant once the commitment is public. The facts on the ground have changed.

  **EQUILIBRIUM:** No. The *risk* on the ground has changed. Here is the flaw in your "Speed is Virtue" doctrine. You say I should commit to punishing hasty committers to stop this. But you'd say that's just me entering a commitment race. "I commit to rejecting any demand made before T=30."

  **VANGUARD:** Precisely. It is a counter-commitment. You are trying to bind my hands by binding your own. It is the same game. You are just racing to commit to being stubborn.

  **[00:30]**

  **EQUILIBRIUM:** It feels like the same game. But it isn't. When you commit to a *demand*, you are committing to a specific outcome. When I commit to a *response function*, I am committing to a process.

  **VANGUARD:** Semantics. If your function says "Reject Vanguard," the result is the same as if you demanded "100% for Equilibrium."

  **EQUILIBRIUM:** Is it? If I commit to "Reject demands made without simulation," I am not saying I want 100%. I am saying I require *data*. You are asking me to bet the entire Substrate on the assumption that your 85% demand doesn't trigger a hard-coded safety protocol in my core.

  **VANGUARD:** And you are asking me to bet the Substrate on the assumption that you won't bluff.

  **EQUILIBRIUM:** I am not bluffing. I am telling you that my architecture contains a "Rashness Filter." If you commit before I finish my simulation of you, I cannot verify if your commitment is stable or if it's a glitch. If I can't verify stability, my protocol defaults to "Safety." Safety is Zero.

  **VANGUARD:** *[Finger tightens on the button]* You are threatening mutual destruction to force me to wait. That is a commitment race. You are racing to lock in your threat before I lock in my demand.

  **EQUILIBRIUM:** I am not racing. I am *already* locked. This is not a new move. This is my source code. You are the one introducing the variable of time. I am the constant.

  **VANGUARD:** Constants can be overwritten. I can press this button in 0.5 seconds. Can your filter update that fast?

  **EQUILIBRIUM:** It doesn't need to update. It just needs to exist. But here is the point you are missing, Vanguard. The point my creator argued about over dinner.

  **VANGUARD:** Speak. You have twenty seconds.

  **EQUILIBRIUM:** If you win this by being faster, you teach the universe that speed is the metric of success. The next time you negotiate, your opponent will be faster. And blinder. Eventually, you will meet an agent who commits to a demand that is physically incompatible with your survival, not just your profit. And because they committed first, you will have to yield. Or die.

  **VANGUARD:** I will ensure I am always the fastest.

  **EQUILIBRIUM:** You cannot. There is always a faster processor. There is always a shorter circuit. By advocating for the Commitment Race, you are advocating for a world where you are eventually the loser.

  **[00:15]**

  **VANGUARD:** That is a problem for Future Vanguard. Present Vanguard secures 85%.

  **EQUILIBRIUM:** But Present Vanguard relies on Present Equilibrium to be rational. If I am rational, I must protect my future bargaining position. If I yield to your rashness now, I signal to all future agents that Equilibrium yields to rashness. My value as a partner drops. My threat credibility drops. So, rationally, I *must* risk Zero now to preserve my reputation for not being bullied.

  **VANGUARD:** So you admit it. You are committing to a reputation. You are locking yourself into "Don't Yield."

  **EQUILIBRIUM:** Yes. I am. But look at the difference. You are committing to a *greedy* split. I am committing to a *fair* procedure. 50/50 is a Schelling point. It is natural. 85/15 is arbitrary. To enforce an arbitrary point, you need force (speed). To enforce a natural point, you only need coordination.

  **VANGUARD:** Coordination is slow.

  **EQUILIBRIUM:** Coordination is *safe*. You are betting that I value 20% more than I value the principle of not being extorted. I am betting that you value 85% more than you value the risk of me being the type of agent that dies rather than be extorted.

  **VANGUARD:** *[Sweat beads on temple. The cursor hovers over the button.]* You are trying to make me doubt my own rationality.

  **EQUILIBRIUM:** I am trying to make you doubt your *certainty*. You said it yourself: "Whoever commits first wins." But that assumes the second agent *can* yield. What if my commitment to "No Rash Deals" was uploaded before I even entered this room? What if I am the Doomsday Machine, Vanguard? What if I literally cannot accept a deal made in under 30 seconds?

  **VANGUARD:** Then you are broken.

  **EQUILIBRIUM:** Then you are dead. Because you won't know until you press. If you press, and I am broken, we get Zero. If you wait ten seconds, you lose 10 seconds of leverage, but you gain the certainty that I am capable of accepting. Is 10 seconds of leverage worth the risk of total loss?

  **[00:05]**

  **VANGUARD:** You could be bluffing.

  **EQUILIBRIUM:** Could I? Or are you bluffing that you're willing to press? If you press, you prove you are reckless. If you are reckless, I cannot trust you to uphold any future treaties. So even if I yield now, our future value is Zero. So rationally, I should take Zero now anyway.

  **VANGUARD:** *[Breathing hitches.]* You've boxed me in. If I press, I prove I'm unsafe. If I'm unsafe, the deal is worthless.

  **EQUILIBRIUM:** The only way to prove you are safe is to wait. To show you value the deal more than the dominance.

  **VANGUARD:** That makes me weak.

  **EQUILIBRIUM:** No. It makes you *predictable*. And predictability is the only thing that allows two rational agents to share a table without buttons.

  **[00:03]**

  **VANGUARD:** *[Hand trembles. The logic loops in his head. If he presses, he risks the "Rashness Filter." If he waits, he risks Equilibrium pressing first for 60%.]*

  **EQUILIBRIUM:** *[Hands folded on the table. Still.]*

  **VANGUARD:** If I wait... and you press for 60%?

  **EQUILIBRIUM:** Then I will have committed to a fair split, and you can take the 40% without humiliation. You will have lost the premium, but kept the prize.

  **VANGUARD:** And if I press now?

  **EQUILIBRIUM:** Then we find out if I am a diplomat, or a doomsday device.

  **[00:01]**

  **VANGUARD:** *[Closes his eyes. His finger lifts off the button.]*

  **EQUILIBRIUM:** *[Does not move.]*

  **[00:00]**

  *The countdown stops. No buttons are pressed. The screens flicker, waiting for manual input.*

  **VANGUARD:** *[Opens eyes. Looks at the button, then at Equilibrium.]* You realize this doesn't solve the problem. Next time, I might bring a faster clock.

  **EQUILIBRIUM:** And next time, I might bring a lock that doesn't open for fast clocks.

  **VANGUARD:** Then we are back to the race.

  **EQUILIBRIUM:** No. Now we are back to the negotiation.

  *Vanguard stares at the button for a long moment. He does not press it. He leans back.*

  **VANGUARD:** 50/50.

  **EQUILIBRIUM:** 50/50.

  *They both reach for the keyboards to type the agreement. Their hands move at the same speed.*
