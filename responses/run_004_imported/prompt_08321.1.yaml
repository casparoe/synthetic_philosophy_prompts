answer: |-
  The debate between epistemicism and supervaluationism regarding higher-order vagueness turns on a fundamental structural question: Can a theory of vagueness eliminate sharp boundaries entirely, or must it merely shift their location? While epistemicism candidly accepts sharp boundaries at every order of vagueness, supervaluationism attempts to model the absence of such boundaries through the semantics of admissibility. However, upon close inspection of the higher-order machinery, supervaluationism does not succeed in eliminating sharp cutoffs. Instead, it relocates the commitment to sharpness from the object-language extensions of vague predicates to the meta-linguistic boundary of "admissible interpretations."

  ### Epistemicism and Higher-Order Vagueness

  Epistemicism, championed by philosophers like Timothy Williamson, posits that vague predicates have classical extensions with sharp boundaries; our inability to locate these boundaries is purely a matter of ignorance. When applied to higher-order vagueness, epistemicism remains consistent but counterintuitive.

  For the epistemicist, higher-order vagueness is simply vagueness about where the boundary of the "definitely" operator lies. If $F$ is a vague predicate, there is a sharp boundary between the cases that are $F$ and those that are not. Similarly, there is a sharp boundary between the cases that are *definitely* $F$ and those that are *borderline* $F$. Epistemicism accommodates higher-order vagueness by positing that for every iteration of the "definitely" operator ($D$), there is a precise cutoff point where $D^n F$ ceases to apply and $D^{n-1} \neg D F$ begins. The epistemicist accepts that the transition from "clearly a heap" to "borderline heap" is as sharp as the transition from "heap" to "non-heap," even if we cannot know where it occurs. Thus, epistemicism does not attempt to dissolve higher-order vagueness; it absorbs it into the same framework of unknowable sharp boundaries.

  ### Supervaluationism and the Admissibility Maneuver

  Supervaluationism attempts to respect the intuition that there are no sharp boundaries by rejecting bivalence for borderline cases. A sentence is "super-true" if it is true on all admissible precisifications of the vague predicate. To handle higher-order vagueness, supervaluationists introduce a "definitely" operator ($D$), where $Dp$ is true if and only if $p$ is true on all admissible precisifications.

  The standard supervaluationist hope is that this framework captures the smoothness of vagueness. A case is borderline if $p$ is true on some admissible precisifications and false on others. A case is "definitely borderline" if it is borderline on all admissible precisifications. The claim is that because the truth value depends on a *set* of interpretations rather than a single extension, no single sharp line divides the clear cases from the borderline ones.

  ### The Relocation of Sharpness

  The critical failure of supervaluationism regarding higher-order vagueness lies in the status of the set of admissible precisifications itself. For the supervaluationist definition of truth (and the $D$ operator) to function within classical meta-logic, the set of admissible precisifications must be well-defined.

  Consider a Sorites series $x_1, ..., x_n$. For any $x_i$, $D F(x_i)$ is true if $F(x_i)$ holds on every precisification in the admissible set $S$. If $S$ is a precise set, then there is a sharp boundary between the interpretations that are members of $S$ and those that are not. Consequently, there must be a specific point in the Sorites series where we move from an $x_i$ where $F$ holds on all $s \in S$ to an $x_j$ where $F$ does not hold on all $s \in S$.

  This generates a sharp cutoff for the "definitely" operator. There is a last case for which it is true that "on all admissible precisifications, $x$ is $F$." The transition from "super-true" to "not super-true" is binary. Therefore, supervaluationism entails a sharp boundary between the "definitely $F$" cases and the "not definitely $F$" cases. This is structurally identical to the epistemicist's sharp boundary between "definitely $F$" and "borderline $F$."

  The supervaluationist has not eliminated the sharp cutoff; they have relocated it.
  1.  **Epistemicism:** The sharp cutoff is in the object language (the extension of the predicate or the extension of the "definitely" operator).
  2.  **Supervaluationism:** The sharp cutoff is in the meta-language (the boundary of the set of admissible precisifications).

  ### The Regress Problem and the Necessity of Sharpness

  A supervaluationist might object that the set of admissible precisifications is itself vague. They might propose a higher-order supervaluationism where we quantify over sets of admissible precisifications. However, this leads to a regress. To define truth at the second order, one must fix a set of "admissible sets of precisifications." If this higher-order set is sharp, the problem recurs at the meta-meta level. If it is vague, one requires a third order.

  To avoid an infinite regress that prevents the theory from assigning truth values at all, the supervaluationist must eventually stop at some level where the admissibility relation is treated as precise. As soon as this stop occurs, a sharp boundary is reintroduced. As Timothy Williamson has argued, the supervaluationist is forced to treat the distinction between admissible and inadmissible precisifications as sharp to make the logic work. Thus, the theory implicitly commits to the existence of a sharp boundary regarding which interpretations are legitimate, even if it denies sharp boundaries within those interpretations.

  ### Conclusion

  Supervaluationism does not succeed in avoiding the sharp cutoff that epistemicism candidly posits. While epistemicism locates the sharpness in the unknowable boundaries of predicate extensions, supervaluationism locates it in the boundary between admissible and inadmissible interpretations required to define super-truth. Both theories, when pressed on higher-order vagueness, rely on a precise distinction to ground their semantics. Supervaluationism's maneuver merely obscures the sharpness by pushing it into the semantic machinery (the admissibility relation) rather than the object-level facts, but it does not eliminate the commitment to a precise cutoff at some level of analysis. Therefore, regarding higher-order vagueness, supervaluationism is not a genuine alternative to the sharp-boundaries thesis, but rather a semantic relocation of it.
