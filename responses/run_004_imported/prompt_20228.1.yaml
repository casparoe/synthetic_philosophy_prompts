answer: |-
  # The Tyranny of Your Tomorrow: A Defense and Autopsy of the Reflection Principle

  You are standing on the shore of the present, looking out at the ocean of the future. You know that tomorrow, you will stand on a different patch of sand, looking at the same horizon, but you will see it differently. Van Fraassen's Reflection Principle asks a deceptively simple question: Shouldn't you see it that way right now?

  If you know that tomorrow you will assign a 90% credence to proposition $A$, Reflection demands that you assign 90% to $A$ today. To do otherwise is to claim that you know something now that your future, better-informed self will not know, or that you are smarter now than you will be then. It feels like an axiom of intellectual humility. But as you've discovered, the moment you introduce whiskey, anesthesia, or even simple forgetfulness, the axiom cracks.

  You are right to be suspicious of the standard fix. Tacking on a clause that says "unless your future self is drunk" feels like patching a leaky boat with chewing gum. It risks defining "rational updating" as "updating that satisfies Reflection," which makes the principle a tautology.

  Here is the case for why Reflection is binding, the case for why it is broken, and a verdict that avoids the shrug by locating the principle's true foundation.

  ### Part I: The Case for Binding Deference

  The strongest argument for Reflection is not that it makes you right, but that it keeps you coherent. In forecasting, we often talk about calibration, but the deeper mathematical sin is incoherence. If your probabilities don't hang together, you are vulnerable to a Dutch Book—a set of bets that guarantees a loss regardless of the outcome.

  Reflection is the diachronic (across-time) shield against this exploitation.

  Imagine you are 50% confident that a startup will succeed ($P_{now} = 0.5$). However, you know for a fact that tomorrow, after reading their audited accounts, you will be 90% confident ($P_{future} = 0.9$). If you refuse to update now, a cunning bookie can exploit the gap.
  1.  **Today:** The bookie sells you a bet that pays \$1 if the startup succeeds, priced at \$0.50 (your current rate). You buy it.
  2.  **Tomorrow:** You see the accounts. Your credence jumps to 90%. The bookie now buys the bet back from you for \$0.90 (your new rate).
  3.  **Result:** You have paid \$0.50 and received \$0.90. You have made a guaranteed profit of \$0.40 *before the startup's fate is even decided*.

  Wait, that sounds like you made money. But reverse the positions. If your current credence is *higher* than your expected future credence, the bookie reverses the trade. If you violate Reflection, you are effectively treating your future self as a stranger whose prices are wrong, while simultaneously acknowledging that this stranger has information you lack. You are creating a pump that allows value to be siphoned out of your belief system purely by the passage of time.

  Beyond the money, there is the epistemic argument. Why do you update on evidence at all? When you see a red card, you update your belief that the card is red. You do this because you trust your eyes. You treat your sensory apparatus as a reliable conduit of truth.

  Your future self is just another conduit. If you know your future self will hold a specific belief, it is because you expect them to possess evidence you currently lack. To refuse to defer to that future self is to claim that the *process* of acquiring that evidence will degrade the truth-tracking ability of your mind more than the evidence improves it. In the standard case—where you are just waiting for a report to arrive—asserting that your future self is less reliable than your current self is a form of arrogance. It implies you possess a "view from nowhere" that allows you to judge the evidence before you have seen it.

  Therefore, Reflection is binding because it is the logical consequence of treating your future self as a trusted agent of information. To violate it is to assert that time itself introduces noise, without specifying why.

  ### Part II: The Case for the Exception

  Now, let's pour the whiskey.

  The counterexamples you found—the drunk driver, the anesthetized patient—are not just edge cases; they are structural failures. They reveal that Reflection conflates the *cause* of a belief with the *justification* for a belief.

  In the drunk driving case, you know your future credence ("I am safe to drive") will be 90%. But you also know the causal chain leading to that credence: ethanol interfering with neural inhibition, not new data about your motor skills. Reflection demands you defer to the number (90%) without regard for the mechanism that produced it. This is absurd. If I know a coin is biased to land heads, I don't defer to the coin's "opinion." Similarly, if I know my brain is biased to produce overconfidence, I should not defer to my brain's output.

  Your worry about circularity is sharp. The standard philosophical fix is to say Reflection only applies when the change in belief is due to "learning" or "evidence." But if "evidence" is defined as "that which satisfies Reflection," the principle is empty. It becomes: *You should defer to your future self, unless your future self is wrong, in which case you shouldn't.*

  However, there are stronger counterexamples that don't rely on impairment. Consider the case of **forgetting**.
  Suppose you memorize a phone number today. You know that tomorrow, you will still remember it (100% credence). But you also know that in a year, you will have forgotten it (50% credence). If Reflection holds universally, you should lower your credence *now* to account for the future forgetting. But that's irrational. The fact that you will lose information in the future does not mean you lack information now.

  This breaks Reflection because it violates the assumption of **information accumulation**. Reflection assumes your future self is your current self *plus* data. But if your future self is your current self *minus* data (forgetting) or *corrupted* data (whiskey), the mathematical proof behind Reflection collapses.

  The deepest objection, however, is the **Self-Fulfilling Prophecy**.
  Suppose you believe that if you become confident you will succeed, you will work harder and actually succeed. Your future confidence causes the truth. In this case, your future credence isn't tracking reality; it's *making* reality. If you defer to that future credence now, you might trigger the success early. But what if the mechanism is negative? If you believe you will be depressed tomorrow, and that belief makes you depressed, Reflection forces you to be depressed today to maintain coherence. This turns a norm of rationality into a engine of fatalism.

  These cases sink the strong version of Reflection. You cannot simply defer to your future self as an expert witness, because you know the witness is sometimes drunk, sometimes senile, and sometimes testifying about a reality they are actively distorting.

  ### Part III: The Verdict

  So, where does this leave us? Do we toss Reflection into the bin with other broken philosophical toys?

  No. But we must demote it.

  The mistake forecasters and philosophers make is treating Reflection as a **foundational norm**. They treat it as a rule that says: *Thou shalt align with thy future self.*
  The truth is that Reflection is a **derivative theorem**. It is a consequence of a deeper, more robust rule: **Conditionalization.**

  Here is the principled resolution you are looking for, without the circularity.

  **1. The Foundation is Conditionalization, not Reflection.**
  Rational updating is defined by Bayes' Rule. When you get new evidence $E$, you update your belief in $H$ to $P(H|E)$. This is the gold standard. Reflection is only true *if* you expect your future self to update via Conditionalization on a partition of evidence that you currently respect.

  **2. The "Evidence" Filter is Not Circular.**
  You worried that saying "only defer to genuine evidence" is circular. It isn't, provided we define "genuine evidence" independently of Reflection. We define it by the **likelihood ratio**.
  *   **Genuine Learning:** Your future belief changes because the likelihood of the evidence given the hypothesis ($P(E|H)$) differs from the likelihood of the evidence given not-H ($P(E|\neg H)$).
  *   **Noise/Corruption:** Your future belief changes because of a causal factor (whiskey, fatigue, forgetting) that is independent of the truth of the hypothesis.

  You can identify "whiskey" as a non-evidence factor *without* referencing Reflection. You know whiskey affects belief regardless of truth. Therefore, you know your future self will not be Conditionalizing on evidence; they will be Conditionalizing on noise. Since Reflection is a theorem of Conditionalization, and you expect Conditionalization to fail, **Reflection does not apply.**

  **3. The Principled Distinction.**
  The principle is not "Defer to your future self."
  The principle is: **"Defer to your future self to the extent that you expect your future self to be a Bayesian updater with strictly more information than you."**

  This solves the drunk case: You don't expect the drunk self to be a Bayesian updater.
  This solves the forgetting case: You don't expect the future self to have *strictly more* information.
  This solves the surgery case: You know the anesthesia induces a belief state uncorrelated with the truth of the surgery's success.

  ### The Forecaster's Takeaway

  For your purposes on Manifold, this distinction is practical, not just theoretical.

  When you look at a market and think, "I'll probably update this to 80% tomorrow," ask yourself **why**.
  *   **Scenario A:** "I'll update because the CPI report comes out at 8:30 AM."
      *   *Verdict:* **Reflect.** If you know the report will move you to 80%, you should be at 80% now. The market is likely mispricing the *expectation* of the news. You can arb this.
  *   **Scenario B:** "I'll update because I'm going to read a Twitter thread by a pundit I love."
      *   *Verdict:* **Do Not Reflect.** You know the pundit is noise. If you expect to be swayed by rhetoric rather than data, your future self is compromised. Hold your credence steady and anticipate your own bias.
  *   **Scenario C:** "I'll update because I'll have had a night's sleep and stopped doom-scrolling."
      *   *Verdict:* **Partial Reflection.** This is a correction of a known cognitive defect (fatigue/emotion). Your "rested self" is closer to the ideal Bayesian agent than your "tired self." You should move your credence toward the rested estimate, because the tired estimate is the one suffering from the "whiskey" effect.

  **Final Judgment:**
  Van Fraassen's Reflection Principle is not a binding law of rationality. It is a **diagnostic tool**.
  When Reflection holds, it signals that you expect to learn something true.
  When Reflection fails, it signals that you expect to undergo a change of state that is not truth-tracking.

  Do not use Reflection to set your probabilities. Use your model of *how* you learn to decide if Reflection applies. If you expect to update like a Bayesian, Reflect. If you expect to update like a drunk, a forgetful person, or a partisan, then your duty is not to your future self, but to the truth your future self is about to ignore.

  The principle doesn't sink; it just loses its authority. It is not the boss of you. Your expectation of your own rationality is.
