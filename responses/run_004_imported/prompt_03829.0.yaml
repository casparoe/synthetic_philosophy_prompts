answer: |-
  **Setting:** *A cluttered office, late afternoon. Sunlight cuts through dust motes hovering over a desk scattered with index cards. On each card is written a number: "$2/1$", "-$4/2$", "$8/3$", "-$16/4$", etc. MAYA is shuffling the deck aggressively. DAVID is trying to stack them back into numerical order.*

  **Maya:** You're missing the point, David. The physical act of shuffling is irrelevant. The mathematical act is what breaks your theory. Look. (She fans the cards) In the natural order—flip one, flip two, flip three—the expected value is the alternating harmonic series. One minus a half plus a third... it converges to $\ln(2)$. Roughly 0.69 utils.

  **David:** (Snatching a card labeled "-$16/4$") Right. So you should be willing to pay up to 0.69 to play. Maybe a bit less due to risk aversion, but the EV is defined.

  **Maya:** Is it? That's the illusion. Because this series is only *conditionally* convergent. It doesn't converge absolutely. The sum of the absolute values is the harmonic series, which blows up to infinity. And because it's conditionally convergent, the Riemann Rearrangement Theorem applies. (She drops the deck on the desk with a slap) If I sum these payoffs in *this* order—two positives, one negative, three positives, one negative—I can make the expected value sum to ten million. Or negative infinity.

  **David:** But you can't sum them in that order. That's the category error. You're treating the probability space like a bag of marbles you can dump out and rearrange. But the Pasadena Game isn't a bag of marbles. It's a stochastic *process*.

  **Maya:** It's a lottery. A lottery is defined by the mapping from states to outcomes. The states are "Heads on flip $n$." The outcomes are the utilities. The set of pairs is identical regardless of how I stack these cards. If Expected Utility Theory can't assign a unique value to a fixed set of state-outcome pairs, then EUT is incomplete. It's a hole. A genuine, gaping hole.

  **David:** It's not a hole; it's a boundary condition. You're assuming that "Expected Value" must be defined purely by the static set of outcomes weighted by probability. But decision theory is for agents embedded in time. The uncertainty resolves sequentially. Flip one. Wait. Flip two. Wait. The temporal order isn't an artifact; it's structural. You can't experience the payoff of flip $n$ before flip $n$ happens.

  **Maya:** So what? Time is just another index. If I offer you a contract that pays out based on the shuffled order—say, I have a random number generator pick which flip's payoff you get first—have I changed the game?

  **David:** Yes! You've changed the information structure. In the Pasadena Game, the probability of getting the $n$-th payoff is tied to the event "Heads first appears at $n$." That event is intrinsically ordered. $n=1$ happens before $n=2$. If you decouple the payoff from the flip number, you're playing a different game. You're playing the "Pasadena Shuffle," not the Pasadena Game.

  **Maya:** (Leaning forward) But the *value* of the game should depend on the payoffs and the probabilities, not the calendar. If I tell you, "I have a coin. If it's heads on the first toss, you get $2. If tails then heads, you lose $2. If tails, tails, heads, you get $8/3$..." The logic of the gamble is fixed. Why does the summation order matter? Because standard integration theory says if the integral isn't absolutely convergent, the expectation is undefined. Fubini's theorem fails. You can't swap the sum and the limit.

  **David:** Okay, fine. Standard *strong* expectation is undefined. I'll grant you that. The integral doesn't exist in the Lebesgue sense. But that doesn't mean the game is valueless. It just means you need a richer definition of value. Look at Easwaran's move.

  **Maya:** Weak Expectation.

  **David:** Exactly. Don't ask "What is the average value of one game?" Ask "If I play this game $N$ times, what does the average payoff per game converge to as $N$ goes to infinity?"

  **Maya:** And you claim it converges to $\ln(2)$.

  **David:** It does. Almost surely. By the Weak Law of Large Numbers for variables without expectations. If you play the Pasadena Game a thousand times, your average winnings per game will hover around 0.69. That's a fact about the world. That's a price you can arbitrage. If I sell you a ticket for 0.50, and we play it ten thousand times, I go broke. If I sell it for 1.00, you go broke. The fair price *is* 0.69.

  **Maya:** (Picking up a card, tapping it against her chin) You're dodging the single-case problem. Decision theory is supposed to tell me what to do *now*, with *this* choice. I'm not going to play it ten thousand times. I'm going to play it once. In the single case, the Law of Large Numbers is a promise about a future that isn't happening.

  **David:** But the single case value is derived from the long-run propensity. What else could "value" mean? If the long-run average is stable, that stability grounds the single-case price.

  **Maya:** It doesn't ground it if the dominance principle fails. Consider the "Altadena Game." It's the Pasadena Game, but I add $1 to every single payoff. $2/1 + 1$, $-4/2 + 1$, $8/3 + 1$... In every single possible state of the world, the Altadena Game pays exactly $1 more than the Pasadena Game.

  **David:** Sure.

  **Maya:** So, by Statewise Dominance, Altadena is strictly better. You *must* prefer Altadena. But if Pasadena has an EV of $\ln(2)$, and Altadena has an EV of $\ln(2) + 1$, that works. But if Pasadena's EV is undefined... and Altadena's EV is *also* undefined (because adding 1 to each term of a conditionally convergent series still leaves you with a divergent absolute sum)... then EUT cannot tell you to prefer Altadena. It renders you rationally indifferent between a gamble and a gamble that pays more in every single outcome. That's absurd.

  **David:** (Pauses, stacking a few cards slowly) That is the strongest argument against the "undefined" position. I admit it. If we say the EV is undefined, we lose Dominance. But if we say the EV is $\ln(2)$ via rearrangement, we lose Invariance.

  **Maya:** Exactly. You have to break something. Either you break the math (by privileging one summation order without justification) or you break the rationality axioms (by allowing indifference to dominance).

  **David:** I don't think I have to break Dominance. I just need to restrict it. Dominance holds for gambles with defined expectations. When expectations are undefined, we need a different principle. Like the "Principal Principle" for chance. The objective chance structure dictates the value. The chance structure here is temporal. The coin flips in order. Therefore, the summation must be in order.

  **Maya:** That's just stipulation, David. You're saying "The math works if we ignore the math that says it doesn't work." You're privileging the natural numbers because they feel nice. But why is $n=1$ prior to $n=2$ in the *valuation*? The check clears at the same time regardless of when the coin landed.

  **David:** Because the *risk* clears sequentially. I'm exposed to the loss at $n=2$ only if I survived $n=1$. The conditional probabilities are the skeleton of the gamble. You can't strip the skeleton out and just look at the meat.

  **Maya:** (Shuffles the deck again, loudly) But I can construct a physical mechanism that realizes the shuffled order. I have a machine. It flips the coin. If heads on $n$, it puts the payoff in a hopper. Then, after the game is over, it dispenses the payoffs in a random order determined by a separate die roll. The *experience* of receiving the money is shuffled. Does the value change?

  **David:** (Sighs) The *utility* of receiving the money might change if you're impatient. But we're talking about utils, not dollars. You stipulated utils. So time-preference for consumption is out.

  **Maya:** Then what's left? If the utils are timeless, and the set of outcomes is fixed, and the probabilities are fixed... the order is a fiction. And if the order is a fiction, the value is indeterminate.

  **David:** No. The order isn't a fiction. The *dependency* is real. The event $H_2$ (Heads on 2) is defined as $T_1 \cap H_2$. It contains $T_1$. The state space is a tree, not a pile of cards. You're trying to flatten the tree into a set, and when you do, you lose the topological information that defines the gamble.

  **Maya:** So decision theory requires topology now?

  **David:** Decision theory requires a coherent representation of the choice problem. If your representation destroys the causal structure of the gamble, your representation is wrong. The Pasadena Game isn't a counterexample to EUT; it's a counterexample to representing sequential gambles as simple probability mass functions without order.

  **Maya:** (Stares at the deck) I think you're saving the theory by changing the definition of "lottery" every time a paradox shows up. First it was money, now it's utils. First it was states, now it's trees. Next you'll tell me rationality is only for infinite agents.

  **David:** And I think you're declaring a theory dead because it gets messy at the limits. The Weak Expectation *works*. It guides betting behavior. It respects the long-run frequencies. It tells you the fair price. If it walks like a value and quacks like a value...

  **Maya:** ...it might still be a duck with no heart. (She slides the deck across the table to him) Fine. Stack them.

  **David:** (Starts ordering them: 1, 2, 3...)

  **Maya:** You stack them your way, you get $\ln(2)$. I walk out the door, shuffle them, and I can prove to a mathematician that the game is worth $100. Who's right?

  **David:** (Places the Ace of Spades on top, representing $n=1$) The mathematician is looking at a series. The agent is looking at a coin. The coin doesn't shuffle.

  **Maya:** (Standing up) Then it's a good thing we're agents and not coins. Because if I'm the one offering you the game, David, and I hold the shuffle... you're paying me 0.69, and I'm taking the other side. And I know which order I'm summing in.

  **David:** (Without looking up) Then you're offering me the Pasadena Shuffle. And I'll price that differently.

  **Maya:** (At the door) See? You just admitted there are two games. Which means the original description was incomplete. And if the description is incomplete, the theory can't evaluate it. (She opens the door) Hole in the theory, David. Fresh air coming right through.

  **David:** (Finally looks up, holding the ordered deck) Or maybe the theory just tells us that some games shouldn't be played without a rulebook on summation.

  **Maya:** (Smiles grimly) Write that up. Let me know if it converges.

  *(She exits. David looks at the deck, then at the door, and begins to shuffle the cards.)*
