answer: |-
  This is a fantastic question. You have identified the single most potent critique of Ergodicity Economics (EE), often called the **"coordinate invariance"** or **"re-parametrization"** objection.

  The standard dismissal you've encountered is usually weak ("because money is what matters"). You are right to sense that simply asserting "wealth is the variable" smells like begging the question. If I define my observable as $O = \ln(W)$, the process becomes additive and ergodic immediately, and I should maximize expected arithmetic growth of $\ln(W)$. If I define $O = \sqrt{W}$, I get a different optimal fraction. So why is $W$ the "true" observable?

  To steelman the Ergodicity Economics (Peters et al.) position against this specific objection, we cannot argue from the perspective of *individual preference* (where the objection wins). We must argue from the perspective of **physical dynamics, evolutionary survival, and market structure.**

  Here is the strongest possible argument for why wealth ($W$) is the privileged observable, and why the objection fails in the context of repeated reinvestment.

  ### 1. The Dynamics Are Defined on Wealth, Not Utils
  The core of the steelman is that the stochastic process governing the bet is **physically defined on wealth**, not on your internal valuation of it.

  When you place a bet, the payoff structure is $W_{t+1} = W_t \cdot (1 + r)$. The multiplier $(1+r)$ acts on the *dollars*. The market does not know about your utility function. The market does not compound your "sqrt-wealth." It compounds your capital.

  If you choose to optimize the time-average growth of $\sqrt{W}$, you are mathematically equivalent to an agent optimizing the time-average growth of $W$ **with a different betting fraction.** But here is the kicker: **The dynamics of ruin are defined on $W$, not $\sqrt{W}$.**

  The absorbing barrier (bankruptcy) exists at $W=0$. It does not exist at $\sqrt{W}=0$ in the same dynamical sense; that is just a coordinate transform of the same barrier. However, the *rate* at which you approach that barrier is determined by the geometric drift of $W$.
  *   If you maximize arithmetic expected wealth, you accept a negative geometric drift (in volatile enough games), which guarantees $W \to 0$ almost surely as $t \to \infty$.
  *   If you maximize geometric expected wealth (Kelly), you maximize the drift of $\ln(W)$, which keeps you furthest from the absorbing barrier at $W=0$.

  **The Steelman:** You cannot choose to time-average $\sqrt{W}$ because $\sqrt{W}$ is not the conserved quantity that propagates through the system. Wealth is the "mass" in this economic physics. If you optimize a transform, you are effectively ignoring the actual physical constraints of the system (the compounding mechanism and the zero-bound) in favor of a psychological mapping. The ergodicity breakdown is a property of the *process*, not the *observer*. Since the process is multiplicative on $W$, $W$ is the only variable for which the time-average vs. ensemble-average distinction reveals the physical risk of ruin.

  ### 2. The Evolutionary Argument (Objective Dominance)
  This is the heaviest hammer in the EE arsenal. It shifts the frame from "What should I prefer?" to "What will survive?"

  Imagine a market with two types of agents:
  1.  **Wealth-Maximizers:** They maximize the time-average growth rate of $W$ (Kelly).
  2.  **Transform-Maximizers:** They maximize the time-average growth rate of $f(W)$ (e.g., $\sqrt{W}$), which implies betting less than Kelly (fractional Kelly).

  In a competitive environment where capital is allocated to successful strategies (which is true in quant trading, hedge funds, and biological evolution), the Wealth-Maximizers will grow their capital at the maximum possible geometric rate. The Transform-Maximizers will grow slower.

  Over a long enough time horizon, the share of total market wealth held by the Wealth-Maximizers approaches 100%. The Transform-Maximizers are not "ruined" in the sense of hitting zero, but they are **economically extinct** relative to the dominant population. Their capital becomes negligible.

  **The Steelman:** The choice of $W$ is not arbitrary because $W$ is the metric of **competitive fitness**. If your goal is to persist as a significant market participant, you are forced by competition to treat wealth as the objective function. You *can* choose to optimize $\sqrt{W}$, but you are effectively choosing to donate your market share to someone who optimizes $W$. Therefore, risk aversion (log-utility behavior) is "objectively forced" not by your psychology, but by the selection pressure of the market ecosystem.

  ### 3. Log-Wealth is the "Natural Measure" of Multiplicative Processes
  In physics, when dealing with multiplicative processes (like sound intensity, earthquake energy, or stellar brightness), we do not treat the raw linear scale as the primary observable. We use logarithmic scales (decibels, Richter, magnitude). Why? Because the *human perception* or the *physical impact* often scales logarithmically, but more importantly, because the **underlying dynamics become additive in log-space.**

  EE argues that money in a reinvestment context is a physical quantity subject to multiplicative dynamics.
  *   In linear space ($W$), the process is non-ergodic (time average $\neq$ ensemble average).
  *   In log space ($\ln W$), the process is ergodic (time average $=$ ensemble average).

  **The Steelman:** Choosing to time-average $W$ is not the claim. The claim is that **the growth rate is defined as the time-average of the change in the state variable.** For a multiplicative process, the "change" is naturally measured as a percentage return, which is $\Delta \ln W$.
  To ask "Why not time-average $\sqrt{W}$?" is to ask "Why not measure velocity in units of $\sqrt{\text{meters}}/\text{second}$?" You *can*, but it won't linearize the equations of motion. The logarithm is the unique function that converts the multiplicative dynamics of wealth into additive dynamics, making the time-average well-defined and meaningful. It is not a utility function; it is the **integrating factor** for the differential equation of wealth.

  ### 4. Distinguishing Consumption vs. Accumulation
  The user's objection holds water if we are talking about *consumption*. If I am eating apples, diminishing marginal utility is subjective. I might prefer one big apple to two small ones, or vice versa.

  However, the EE argument is specifically about **accumulation and reinvestment** (the quant trading context).
  *   **Consumption:** Subjective utility applies. You eat the apple; it's gone.
  *   **Investment:** The capital is not consumed; it is the fuel for future generation.

  In the context of reinvestment, a dollar today is strictly a tool to generate more dollars tomorrow. There is no diminishing marginal "usefulness" of a dollar *as capital*. A \$10M portfolio can take exactly the same percentage trades as a \$10k portfolio (ignoring liquidity constraints). The *capacity* to generate wealth scales linearly with wealth.

  **The Steelman:** Because the *productive capacity* of capital scales linearly with $W$ (not $\sqrt{W}$), $W$ is the objective measure of potential. Optimizing $\sqrt{W}$ implies you believe a dollar is less useful for generating future returns when you have more of them. In a frictionless reinvestment model, this is false. Therefore, optimizing $W$ (via log-growth) is the only strategy consistent with the linear scalability of capital.

  ### Summary of the Steelman
  To answer your specific challenge: **Yes, choosing the variable to time-average is arbitrary *unless* that variable is the state variable of the physical dynamics.**

  1.  **Dynamics:** The market multiplies $W$, not $U(W)$. The ergodicity violation is a property of the $W$-dynamics.
  2.  **Survival:** $W=0$ is a hard physical absorbing barrier. Maximizing geometric growth of $W$ is the unique strategy that maximizes distance from this barrier while maximizing speed.
  3.  **Selection:** In a competitive market, agents optimizing geometric growth of $W$ dominate agents optimizing transforms of $W$.
  4.  **Math:** $\ln(W)$ is the unique transform that renders the multiplicative process additive (ergodic). It is the natural coordinate system, not a preference.

  ### Where the Objection Still Bites (The Concession)
  To be intellectually honest, the steelman has a limit. The EE claim fails if you detach the agent from the market or the long run.

  If you are a monopolist with no competition, and you plan to liquidate and consume everything at a specific time $T$, you are free to optimize whatever utility function you like. The "objective" force of Kelly/Ergodicity relies entirely on the **infinite horizon reinvestment** assumption.

  If your quant friend is trading with house money that he can withdraw and spend on a yacht next year, the Ergodicity argument weakens significantly. In that case, he *is* optimizing consumption utility, and the "objective" derivation of log-utility collapses back into subjective preference.

  **The Verdict:** The Ergodicity Economics claim is objectively true for **perpetual capital preservation and growth** (the realm of institutions, endowments, and career quants). It is not objectively true for **finite-horizon consumption planning** (the realm of individual life-cycle investing). Your friend is in the former category; that's why the videos keep coming. They aren't smuggling in log-utility; they are smuggling in the assumption that **staying in the game forever is the primary objective.** If you accept that objective, the math forces Kelly upon you.
