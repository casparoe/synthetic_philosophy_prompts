prompt: |-
  I'm on my school's Inter-Club Council (we handle stuff like this), and we've got a dispute to sort out before next week's meeting. The Robotics Club and the Photography Club combined their car washes into one big one instead of running two separate ones, and cleared $1,800 total, but now cant agree on how to split it. Robotics says solo they'd have made $700, or up to $1,600 in a best-case scenario; Photography says solo they'd have made $500, with $900 as their hard ceiling since they don't have enough members to wash more cars than that in a day. Robotics wants $1,300 now, Photography wants $1,000, so were $500 short of a deal and both presidents are annoyed at each other. Another council member's older sister, who's an econ major, told us we should use the "Kalai-Smorodinsky solution" (hope I'm spelling that right) instead of Nash bargaining or just splitting by hours worked, but none of us really get why it would land somewhere different, or why that'd even be the fairer pick. Can you write the memo I'm bringing to the meeting? It should recommend an actual dollar number and say what happens if a club still won't accept it, explain the reasoning so the presidents (not economists) will actually get it, and take seriously why whoever ends up with less might feel cheated.
