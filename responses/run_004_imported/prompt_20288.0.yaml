      *   *Woodward's Move:* Don't talk about "possible worlds." Talk about *interventions*. $X$ causes $Y$ if an intervention on $X$ changes $Y$, holding other pathways fixed. This formalizes the "ceteris paribus" clause that Hume and Lewis struggled with.
      *   *Pearl:* Causal Bayesian Networks / Do-calculus. Mathematical implementation of interventionism. $P(Y | do(X))$ vs $P(Y | X)$.
      *   *Connection:* Hume's Def 2 is the philosophical ancestor. Woodward/Pearl provide the *mechanics* to make Def 2 rigorous without falling into the traps Lewis encountered (like preemption or backtracking).

