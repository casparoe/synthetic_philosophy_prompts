      *   *Is it really a Money Pump?* A classic money pump requires an exploiter. Here, the market was neutral. The user pumped themselves. This is a "Self-Administered Money Pump."
      *   *Changing Preferences:* This is the crucial pivot. If I like chocolate today and vanilla tomorrow, trading chocolate for vanilla and back isn't irrational if I enjoyed the chocolate in between. But here, he traded *away* the quartz to get pyrite, then pyrite for azurite, then azurite for quartz. He didn't hold all three. He cycled.
      *   *Wait, check the cash flow:*
