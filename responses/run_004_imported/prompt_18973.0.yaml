      *   Time average: $\lim_{T \to \infty} \frac{1}{T} \ln(W_T/W_0)$.
      *   Ensure these distinctions are clear in the text.

  7.  **Final Review against Prompt:**
      *   Strongest form of both sides? Yes.
      *   Defend a conclusion? Yes.
      *   Address "more basic than mere preference"? Yes.

