answer: |-
  # The Time of Money: Ergodicity, Utility, and the Illusion of Objective Rationality

  In the lore of rationalist communities like LessWrong, few concepts command as much reverence—and controversy—as the Kelly criterion. To bet according to Kelly is to maximize the expected logarithm of wealth, a strategy that guarantees optimal long-term growth in multiplicative environments while avoiding ruin. For years, the justification for Kelly was standard fare in microeconomics: it corresponds to a logarithmic utility function, representing a specific attitude toward risk. But recently, a more provocative claim has upended this orthodoxy. Proponents of "Ergodicity Economics," led by physicist Ole Peters, argue that Kelly betting is not a matter of subjective preference at all. They claim it is a physical necessity derived from the nature of time itself.

  According to Peters, traditional expected-value (EV) maximization implicitly assumes an ensemble of parallel universes, averaging outcomes across copies of the bettor. But a real agent lives in a single timeline, experiencing the time average of a wealth process. In non-ergodic systems—specifically multiplicative wealth dynamics—these two averages diverge. Peters argues that by focusing on the time average, we derive logarithmic utility from the dynamics of the system, rendering risk aversion an objective feature of reality rather than a subjective psychological quirk.

  Traditional economists, channeling the legacy of Paul Samuelson, retort that this is sleight of hand. Choosing to prioritize the time average over the ensemble average is itself a value judgment. It is not a derivation of rationality from physics, but a relocation of the utility function under a more technical name.

  This essay will examine the strongest forms of both arguments. It will conclude that while the ergodicity argument fails to fully eliminate normativity, it succeeds in grounding utility in physical constraints. It does not prove that Kelly betting is objectively rational for *all* agents, but it demonstrates that it is instrumentally necessary for any agent that values its own persistence in a multiplicative world.

  ### The Samuelson Tradition: Rationality as Consistency

  To understand the ergodicity critique, one must first appreciate the edifice it attacks. In the neoclassical tradition formalized by Von Neumann, Morgenstern, and Samuelson, rationality is defined procedurally, not substantively. An agent is rational if their preferences satisfy certain axioms: completeness, transitivity, independence, and continuity. If these axioms hold, the agent behaves *as if* they are maximizing the expected value of a utility function, $U(W)$.

  Crucially, the shape of $U(W)$ is subjective. A risk-neutral agent has linear utility ($U(W) = W$) and maximizes arithmetic expected value. A risk-averse agent has concave utility (e.g., $U(W) = \ln W$) and maximizes geometric expected value. Neither is "more rational" than the other in the VNM framework; they simply have different preferences.

  Samuelson's defense against the Kelly proponents rests on the "Is-Ought" distinction. Physics can tell us how wealth evolves, but it cannot tell us how much we should care about different outcomes. If an agent prefers a 1% chance of infinite wealth over a 100% chance of modest growth, that is their prerogative. To say they *must* maximize the time average is to impose a specific goal (long-term survival/growth) as if it were a law of logic. As Samuelson famously argued regarding the Kelly criterion, maximizing geometric mean is only optimal if the agent's utility function is logarithmic. To assert otherwise is to commit the fallacy of deriving an "ought" from an "is."

  From this viewpoint, Peters' distinction between time and ensemble averages is mathematically correct but normatively inert. Yes, the time average differs from the ensemble average in non-ergodic processes. But why *should* an agent care about the time average? If I am making a one-off bet that will determine my fate, the time average (which requires an infinite horizon) is irrelevant. If I am a corporation with shareholders who can diversify across many independent bets, the ensemble average is the correct metric. Choosing the time average is simply choosing a specific utility function that values long-term compounding over short-term expectation.

  ### The Ergodicity Argument: Physics Over Preference

  Ole Peters and his collaborators accept the mathematics of the traditionalists but reject their interpretation of probability. They argue that the ensemble average is a metaphysical construct that has no bearing on a physical agent existing in time.

  Consider a simple multiplicative bet: a coin flip where heads increases wealth by 50% and tails decreases it by 40%. The arithmetic expected value is positive ($0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$). An EV maximizer should bet everything every time. However, over a long sequence of flips, the geometric mean dictates the outcome. The growth rate per flip is $\sqrt{1.5 \times 0.6} \approx 0.95$. A bettor who leverages fully will almost surely go to zero as $t \to \infty$.

  Peters argues that standard economics treats this as a "risk preference." He contends it is a category error. The ensemble average describes the average wealth of one million parallel copies of the bettor at time $t$. The time average describes the wealth of one bettor over one million time steps. Since no individual can access the parallel universes, the ensemble average is physically unobservable to the agent. It is a "multiverse" expectation.

  In ergodicity economics, the goal is to find an observable that is ergodic—where the time average equals the ensemble average. For multiplicative wealth dynamics, wealth itself ($W$) is non-ergodic. However, the logarithm of wealth ($\ln W$) *is* ergodic. The change in log-wealth over time converges to the expected change in log-wealth. Therefore, maximizing the time-average growth rate is mathematically equivalent to maximizing the expected change in log-wealth.

  The punchline is profound: You do not need to *assume* logarithmic utility. It falls out of the requirement that the optimization criterion be ergodic (i.e., physically meaningful for a single trajectory). If rationality is about making decisions based on observable outcomes in the real world, and the only observable outcome for a single agent is their time trajectory, then Kelly betting is not a preference. It is the only strategy consistent with the physical structure of the environment.

  ### The Relocation of Normativity

  The ergodicity argument is compelling because it resonates with an intuition shared by many in the rationalist community: that there should be an objective "correct" way to reason under uncertainty, independent of whimsical utility functions. However, the Samuelsonian critique retains force when we scrutinize the premises of the ergodic argument.

  The primary vulnerability lies in the choice of the optimization target. Peters argues that we *must* maximize the time average growth rate. But why? This choice implicitly assumes that the agent cares about the limit as $t \to \infty$. It assumes the agent values persistence and compounding above all else.

  Consider an agent with a finite horizon. If I am betting on a single coin toss that will determine whether I can save a life today, the long-term time average is irrelevant. The ensemble expectation (the probability-weighted outcome) is the only relevant metric. Even in repeated betting, an agent might have a "goal" rather than a "growth rate." If I need \$1 million to cure a disease and I have \$10,000, maximizing the time-average growth rate might be too slow. I might need to maximize the *probability of reaching the goal* before ruin, which implies a different betting fraction than Kelly.

  Furthermore, the ergodicity argument assumes the agent cannot hedge or transfer risk. In financial markets, agents can sell bets to others. The price of a bet is determined by the ensemble average across all market participants (the risk-neutral measure). If I refuse to take a positive EV bet because it lowers my time-average growth, I might be passing up a sure profit that I could lock in by hedging. In this context, ignoring the ensemble average is objectively suboptimal.

  Therefore, the choice to prioritize the time average is indeed a preference. It is a preference for *survival* and *independence*. It is a preference for a world where one cannot insure against risk or exit the game early. By framing the problem as "maximize time average," Peters has not eliminated utility; he has hardcoded a specific utility function (one that values infinite horizon survival) into the definition of the problem.

  ### Synthesis: Ecological Rationality

  Does this mean the ergodicity argument is merely a semantic trick? No. It represents a significant shift in how we understand rationality, moving from *logical consistency* to *ecological fit*.

  The Samuelson tradition treats the agent as abstract, existing outside of physics. The ergodicity tradition treats the agent as a physical system embedded in time. While it is true that choosing to care about the time average is a value judgment, it is a value judgment that is universally shared by all existing agents. Evolution selects for organisms that persist. An organism that maximizes ensemble average wealth in a multiplicative environment goes extinct. Therefore, for any agent that exists to ask the question "what is rational?", the time-average criterion is a prerequisite for their existence.

  In this sense, Peters does derive Kelly from something more basic than a mere preference: he derives it from the *condition of agency*. If you wish to remain an agent in a multiplicative world, you must respect the time average. Log-utility is not just a curve on a graph; it is the mathematical signature of survival in a volatile environment.

  However, we must stop short of calling it "objective truth" in the universal sense. It is objective relative to the goal of persistence. If an agent values a short, glorious explosion of wealth over a long, slow compounding (a "burn bright" utility function), then EV maximization is rational for them. The ergodicity argument cannot convince a kamikaze pilot that they are making a math error.

  ### Conclusion

  The debate between ergodicity economics and the Samuelson tradition ultimately hinges on the definition of rationality. If rationality is internal consistency of preferences, then Peters is wrong: choosing the time average is just another utility function. But if rationality is the effective pursuit of goals in a physical world, then Peters is right: ignoring the divergence between time and ensemble averages is a map-territory confusion that leads to ruin.

  Does the ergodicity argument derive Kelly betting from something more basic than a mere preference? **Yes, but with a caveat.** It derives it from the physical constraints of non-ergodic dynamics combined with the implicit preference for continued existence. It does not solve the "Is-Ought" problem entirely, as one must still *ought* to care about surviving. But it demonstrates that for any agent that *does* care about surviving, the "preference" for log-utility is not optional. It is forced upon them by the mathematics of time.

  Thus, the ergodicity argument does not eliminate utility, but it naturalizes it. It shows that what economists dismissed as "risk aversion" is often just "physics awareness." For the rationalist seeking a guide to action in the real world, the lesson is clear: You may choose your utility function, but if you choose one that ignores the time-average properties of multiplicative processes, you are not merely expressing a preference. You are volunteering for extinction.
