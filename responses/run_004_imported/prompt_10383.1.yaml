      *   *Reasoning for Stance:* Schellenberg's argument is generally considered one of the strongest logical problems of evil/hiddenness. The "Epistemic Distance" reply often conflates *belief that* with *belief in* (trust). The "Volitional Readiness" reply often begs the question against the nonresistant nonbeliever's self-report. The "single case" criterion is the killer. If even one person is truly open and gets nothing, the "perfectly loving" definition is strained.
      *   *Verdict:* I will argue that the Argument from Divine Hiddenness succeeds against the *traditional* conception of a perfectly loving personal God, specifically because the defenses either mischaracterize the nature of belief or rely on assumptions about human psychology that contradict the lived experience of the nonresistant nonbeliever. I will conclude that the argument forces a revision of the concept of God (e.g., deism, process theology) or atheism, rather than sustaining classical theism.

  6.  **Drafting - Section by Section:**

