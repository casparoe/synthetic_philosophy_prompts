answer: |-
  Here is a draft for your response paper. It's structured to be philosophically rigorous but conversational enough for a seminar context. It tackles the Oswald/Kennedy case head-on while building a Kratzerian unified case.

  ***

  **Title:** One 'If' to Rule Them Both: A Unified Modal Restriction Account of Conditionals

  **Introduction**
  The orthodoxy in our seminar so far suggests that the semantic gap between indicative and counterfactual conditionals is unbridgeable. Following Adams, we are encouraged to view the indicative as a creature of conditional probability (assertability without truth conditions) and the counterfactual as a creature of possible world similarity (truth conditions via Stalnaker-Lewis). The Oswald/Kennedy pair is the flagship argument for this dualism. However, I want to argue that this split is theoretically costly and unnecessary. We can maintain a unified semantics for *if*—specifically, treating it as a modal restrictor à la Kratzer—where the divergence in truth conditions arises not from lexical ambiguity, but from independently motivated shifts in modal base and tense morphology. Far from forcing a split, the Oswald/Kennedy contrast actually illuminates how a single semantic mechanism interacts with different contextual parameters.

  **The Adams Challenge: Oswald/Kennedy**
  To argue for unification, we must first grant Adams his due. The contrast is stark:
  1.  (Indicative) If Oswald didn't kill Kennedy, someone else did.
  2.  (Counterfactual) If Oswald hadn't killed Kennedy, someone else would have.

  Intuitively, (1) is true (or highly assertible), while (2) is false. Adams argues that no single semantic value for *if* can capture this. For the indicative, we reason from our actual knowledge (Kennedy is dead); for the counterfactual, we reason from a hypothetical history where the assassination might not have occurred at all. Adams concludes that indicatives track $P(C|A)$ while counterfactuals track similarity metrics among $A$-worlds. If *if* meant the same thing in both, how could the truth values diverge so radically on the same antecedent content?

  **The Unified Proposal: 'If' as a Restrictor**
  The strongest case against this split comes from the Kratzerian modal restriction framework. On this view, *if*-clauses do not carry propositional content themselves, nor do they function as binary operators. Instead, *if* is a restrictor on a covert modal operator. The logical form is roughly: $MODAL_{(f, g)} (A) (C)$, where $f$ is the modal base and $g$ is the ordering source.

  On this unified account, the semantic contribution of *if* is constant: it takes the antecedent $A$ and intersects it with the domain of worlds quantified over by the modal. The difference between (1) and (2) does not lie in *if*, but in the features of the covert modal and the tense morphology of the antecedent.

  **Resolving Oswald/Kennedy without a Split**
  How does this handle Adams's pair? We need to show how the *same* restrictor yields different truth conditions based on independently motivated parameters.

  *   **The Indicative (Epistemic Modal Base):**
      In (1), the covert modal is epistemic (roughly "must" or "might" relative to what is known). The modal base $f$ is realistic/epistemic: it contains only worlds compatible with our actual knowledge. Since we know Kennedy was killed, every world in the modal base is a world where Kennedy dies. When *if* restricts this domain to worlds where "Oswald didn't kill him," we are left with worlds where Oswald didn't do it, but Kennedy *still died* (because that's part of the known facts in the base). Thus, "someone else did" is true in all remaining worlds. The indicative is true because the modal base holds the consequent fixed.

  *   **The Counterfactual (Counterfactual Modal Base + Fake Past):**
      In (2), the past perfect morphology ("hadn't killed") is not merely temporal; following Iatridou (2000), it acts as a "fake past" that signals a shift in the modal base. The modal base is no longer strictly epistemic/realistic. It allows for worlds incompatible with known facts (i.e., worlds where Kennedy might not have died). Furthermore, the ordering source $g$ prioritizes similarity to actual history *up to the time of the antecedent*.
      When *if* restricts this domain to worlds where "Oswald hadn't killed Kennedy," we look for the closest worlds where that action is removed. In the actual historical context (absent a known conspiracy), removing Oswald removes the assassination. There is no "someone else" waiting in the wings in the closest historical alternatives. Thus, (2) is false.

  Notice that *if* did the exact same work in both cases: it restricted the domain of the modal. The divergence comes from the tense marking triggering a different modal base. This is independently motivated because we see similar tense/modal interactions elsewhere (e.g., in desire reports or ability modals). We don't need two logics; we need one logic sensitive to context.

  **Lewis's Triviality and the Probabilistic Intuition**
  One might object: "But Adams is right about probability! $P(\text{If } A, C) = P(C|A)$." If we unify the semantics, do we lose this insight? Actually, a unified view helps us dodge Lewis's triviality results (1976).

  Lewis showed that if conditionals express propositions and Adams's Thesis holds, probability functions collapse (triviality). Adams took this to mean indicatives lack truth conditions. However, if we adopt the unified restrictor view, conditionals *do not denote propositions* in the standard sense. They are syncategorematic. They modify the modal domain. Therefore, asking for the probability *of the conditional* is a category mistake; we should instead ask about the probability of the consequent *given the restriction*.

  This undermines the motivation for the split. Adams felt forced to give indicatives a probabilistic semantics distinct from counterfactuals because he assumed *if* must be an operator. Once we see *if* as a restrictor, the probabilistic intuition is preserved for indicatives (as epistemic modal claims) without requiring a separate logic from counterfactuals. Both are modal claims; one is restricted by an epistemic base, the other by a counterfactual base. Lewis's triviality result actually supports the unified restrictor view by showing that treating conditionals as standard propositions (which Adams's dualism arguably still flirts with) is the real problem.

  **Theoretical Virtues**
  Why prefer this unified account?
  1.  **Compositionality:** We avoid positing a lexical ambiguity for *if*. We explain the difference via tense and context, which we need anyway for other parts of the grammar.
  2.  **Embedding:** A unified semantics handles embeddings better. If indicatives and counterfactuals had totally different logics, embedding them under attitude verbs or in disjunctions should create type-mismatch errors. They generally do not.
  3.  **Continuity:** There are borderline cases (e.g., "If Oswald didn't kill Kennedy, he would have been caught") that blur the line. A unified parameter-based approach explains this gradient; a dualist approach struggles to place them.

  **Conclusion**
  Adams's Oswald/Kennedy pair is a powerful intuition pump, but it is not a logical proof of semantic dualism. It demonstrates that the *context* of evaluation changes between indicatives and counterfactuals, not necessarily the meaning of *if*. By adopting a unified restrictor semantics, we can explain the truth-value divergence through shifts in modal base triggered by tense morphology, while simultaneously respecting Lewis's triviality results by avoiding the assumption that conditionals denote standard propositions. We don't need two logics for 'if'; we need one logic that is sensitive to the worlds we are talking about.
