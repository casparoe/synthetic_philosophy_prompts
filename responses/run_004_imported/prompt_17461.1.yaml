          *   *Crucial Point:* You can't infer a convention. You have to *know* the convention to understand the sentence *before* you can judge reliability. If *Sabda* were inference, you'd need to infer the meaning of the words first. But you can't infer "cow" from the sound "go" without already knowing the convention.
