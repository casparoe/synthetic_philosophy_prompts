      *   **Nyaya (Gautama/Vatsyayana/Udayana) View:** *Sabda* is distinct. Why? Because the cognitive mechanism is different. In inference, you move from a perceived sign to an unperceived conclusion based on a universal relation (*vyapti*). In testimony, the knowledge arises directly from the understanding of the sentence structure and meaning, provided certain conditions are met. The relation between word and meaning is not a natural universal like smoke/fire; it is conventional (*sanketa*), yet the knowledge transfer is immediate upon understanding.

