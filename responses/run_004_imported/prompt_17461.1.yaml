answer: |-
  This is a fantastic philosophical itch to scratch. You have correctly identified the fault line: the Buddhist logicians (following Dignāga and Dharmakīrti) are essentially epistemic reductionists. They want to shave ontology with Occam's Razor, arguing that if a cognitive event can be explained by perception or inference, positing a third category is wasteful.

  Your friend is siding with the Buddhists because the "reliability inference" model feels intuitive to a modern, scientific mind. We naturally distrust sources until verified. But the Nyāya school (specifically the Navya-Nyāya or "New Logic" tradition) argues that this intuition misunderstands the fundamental structure of how language conveys knowledge.

  Here is the case for Nyāya. I will argue that *Śabda* (testimony) is irreducible to *Anumāna* (inference) because the **causal mechanism** of the knowledge is different, the **relation** between the sign and the object is different, and the **conditions for validity** are structurally distinct.

  ### 1. The Argument from the Nature of the Connection (*Vyāpti* vs. *Saṅketa*)

  The Buddhist reduction rests on the idea that hearing a sentence is like seeing smoke.
  *   **Inference:** You see smoke (the *hetu* or mark). You recall the invariable connection (*vyāpti*) between smoke and fire. You conclude there is fire.
  *   **Buddhist Claim:** You hear words (the mark). You recall the connection between this speaker and truthfulness. You conclude the content is true.

  **The Nyāya Counter:** This misidentifies the "connection."

  In inference, *vyāpti* is a **natural, ontological relation** existing in the world independent of human will. Smoke is connected to fire by physics/causality. It exists whether humans speak or not.

  In testimony, the connection between a word (*śabda*) and its meaning (*artha*) is **conventional (*saṅketa*)**. It is stipulated by human agreement (or God, in the Vedic context). There is no natural "smoke-fire" link between the sound "cow" and the animal *cow*.

  **Why this breaks the Inference model:**
  To infer anything, you must already know the major premise (the *vyāpti*). If testimony were inference, I would need to already know the connection between the word "cow" and the animal cow *before* I could infer the meaning. But how did I learn that connection?
  *   If I learned it by *previous* testimony, we have an infinite regress (all testimony requires prior inference, which requires prior testimony...).
  *   If I learned it by perception (ostensive definition), that only covers concrete nouns. How do I infer the meaning of "if," "not," "duty," or "tomorrow"?

  Nyāya argues that once the convention (*saṅketa*) is learned, the knowledge arises **directly** from the comprehension of the sentence, not from a syllogism about the speaker. The word reveals the object *directly* (through meaning), whereas the smoke reveals the fire *indirectly* (through a logical mark). Because the causal chain of the cognition is different, the *pramāṇa* must be different.

  ### 2. The Argument from Syntactic Structure (*Ākāṅkṣā* and *Yogyatā*)

  This is where we bring in those terms you saw (*ākāṅkṣā*, *yogyatā*) not as glossary items, but as functional weapons.

  For an inference to work, you need a mark (smoke) and a locus (the hill). The logical structure is binary.
  For testimony to work, Nyāya says you need **four** specific conditions to generate knowledge. If *Śabda* were just *Anumāna*, these conditions would be unnecessary.

  1.  **Ākāṅkṣā (Syntactic Expectancy):** Words have a "hunger" for other words. "Bring" creates an expectancy for an object. "Cow" creates an expectancy for a verb. If I say "Cow," you wait. If I say "Bring," you wait. Only "Bring the cow" satisfies the expectancy.
      *   *The Kicker:* Inference has no syntax. Smoke does not "expect" fire in a grammatical sense. If testimony were inference, the order of words shouldn't matter to the *generation* of knowledge, only the logical weight of the claim. But in language, "Dog bites man" and "Man bites dog" use the same words but generate different knowledge. Inference cannot account for syntactic arrangement.

  2.  **Yogyatā (Semantic Congruity):** The sentence must be logically possible. "Wet the fire with water" has *ākāṅkṣā* (verb + object), but it lacks *yogyatā*. It creates no knowledge because it contradicts reality.
      *   *The Kicker:* Inference deals with what *is*. Testimony deals with what is *sayable*. I can tell you "The hare's horn is sharp." You understand the sentence (you have linguistic knowledge), even though you know the object doesn't exist. If testimony were inference, this would be a failed inference immediately. But Nyāya says we still grasp the *meaning* distinct from the *truth value*. The mechanism of understanding the sentence is separate from the mechanism of verifying the fact.

  If your friend says testimony is inference, ask them: **Where does the syntax go in the syllogism?** You cannot fit *ākāṅkṣā* into the *vyāpti* model.

  ### 3. The "Reliability" Objection: Defeaters vs. Premises

  Your friend's strongest point is: *"Believing someone amounts to reasoning: this source is reliable, reliable sources tend to be right, so this is probably true."*

  Nyāya accepts that reliability matters, but rejects that it is the **generative mechanism** of the knowledge.

  **The Default Trust Position:**
  Nyāya argues that testimony is **innocent until proven guilty**. When a competent speaker utters a sentence, the hearer generates knowledge *automatically*, provided there are no "defeaters" (*bādhaka*).
  *   **Defeater 1:** I see the opposite (Perception overrides Testimony).
  *   **Defeater 2:** I know the speaker is lying (Contradictory Testimony).
  *   **Defeater 3:** The statement is absurd (Lack of *Yogyatā*).

  **The Regress Problem for Buddhists:**
  If I must *infer* your reliability before I accept your statement, how do I establish that reliability?
  *   **Option A:** By your past statements. (Circular: I need to infer reliability from statements, but I need to know reliability to accept statements).
  *   **Option B:** By my perception of your actions. (Limited: I can only verify what I can perceive. I cannot verify your statement about a distant city or a moral duty by perception).
  *   **Option C:** By another testimony. (Infinite Regress).

  Nyāya posits that we have a **prima facie right to trust language**. Language is a tool for the transfer of knowledge (*jñāna-karma*). If every sentence required a background investigation into the speaker's epistemic history before understanding could occur, communication would be impossible. We understand the sentence *first*; we question the speaker *second*.

  Therefore, the "reliability check" is a **filter** for truth, not the **engine** of meaning. Inference is the engine of discovery; Testimony is the engine of transmission. They do different jobs.

  ### 4. The Role of Intent (*Tātparya*)

  This is the nail in the coffin for the reductionist argument.

  In Inference (*Anumāna*), the mind of the observer is irrelevant. Smoke implies fire regardless of whether the fire "intended" to smoke. The relation is objective.

  In Testimony (*Śabda*), the **speaker's intent (*tātparya*)** is a constitutive condition of the knowledge.
  *   If I say "The fire is cold" ironically, and you take it literally, you have not gained knowledge (*pramā*), you have gained error (*viparyaya*).
  *   To get knowledge from testimony, you must grasp not just the words (*abhidhā*), but the *purpose* behind them.

  Inference has no "intent." The smoke isn't trying to tell you anything. But testimony is inherently teleological; it is an act of will by a speaker to inform a hearer. Because the cognitive process requires grasping the *mental state of another agent* (Theory of Mind), it cannot be reduced to a mechanical inference based on natural signs.

  ### 5. Summary of the Nyāya Position

  To summarize the argument you can wield against your friend:

  1.  **Ontological Distinction:** Inference relies on natural universals (*vyāpti*); Testimony relies on human convention (*saṅketa*). You cannot infer a convention; you must know it to understand the sign.
  2.  **Structural Distinction:** Testimony requires syntactic expectancy (*ākāṅkṣā*) and semantic congruity (*yogyatā*). Inference has no syntax.
  3.  **Epistemic Flow:** Inference is a movement from the known to the unknown via a mark. Testimony is a direct transfer of meaning via language, blocked only by defeaters, not generated by a reliability syllogism.
  4.  **Agency:** Testimony requires grasping speaker intent (*tātparya*). Inference is agent-neutral.

  **The Closing Move:**
  Tell your friend this: If testimony were merely inference, then a liar speaking the truth would convey knowledge, and a truth-teller speaking ironically would convey error, based solely on the factual accuracy of the proposition. But Nyāya shows us that knowledge from testimony depends on the *communicative act* itself.

  When a trusted teacher says "Tat Tvam Asi" (Thou Art That), the student does not reason, "My teacher is reliable, therefore I am Brahman." The student hears the sentence, grasps the meaning through the linguistic convention, and the knowledge arises. The reliability of the teacher removes the *doubt*, but it is not the *cause* of the knowledge. The words themselves are the vehicle.

  If you reduce *Śabda* to *Anumāna*, you lose the ability to explain how we learn anything we haven't personally perceived or logically deduced. You collapse the social dimension of knowledge into solitary reasoning. Nyāya saves the social nature of truth by granting Testimony its own seat at the table.
