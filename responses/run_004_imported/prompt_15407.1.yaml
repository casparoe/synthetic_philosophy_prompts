      *   *The Fix:* The current veto is too dumb. It needs to know the difference between "how to get high" and "how to save a life."
      *   *Concrete Conditions:*
          1.  **Intent Classification:** The AI must distinguish between *instructional* (how-to) and *informational* (reporting).
          2.  **The "Public Interest" Override:** If the AI flags something, it shouldn't just say "No." It should say "No, unless..." and route to a senior editor for a quick unlock. This keeps the veto but allows human judgment to prevail in edge cases.
          3.  **Transparency:** Log every refusal. If we see harm reduction getting blocked too often, we retrain.

      *   *Wait, re-reading the prompt:* "takes the strongest version of the case for the AI keeping some independent veto seriously."
