  2.  **Deconstruct the Board Member's Argument:**
      *   *Premise 1:* A community has a right to enforce/protect shared moral standards.
      *   *Analogy:* Moral standards are like the water supply (public good, needs protection).
      *   *Premise 2:* Making exceptions (allowing the book) because "no direct harm" starts a slippery slope.
