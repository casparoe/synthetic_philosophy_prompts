      *   **Reframe:** Shift the focus from "Is this book moral?" to "Who decides?" and "What is the purpose of school?"
      *   **Actionable Advice:** Give the user specific points to raise on Thursday. Keep it respectful but firm.
      *   **Tone:** Empathetic, analytical, empowering, not overly aggressive (since they have to face these people).

