      *   **Reason:** Objections based on "moral standards" (underage drinking, fade-to-black hookup). No specific harm claimed, nothing illegal.
      *   **Opposing Argument:** A board member argued that a town has a right to protect shared moral standards like it protects the water supply. Exceptions lead to a "slow slide" (slippery slope) to a community with no common values.
      *   **User's Initial Stance:** "No victim, no problem."
