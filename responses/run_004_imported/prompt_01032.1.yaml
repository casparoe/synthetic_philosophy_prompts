      *   *Point 4: The Function of Public Institutions.* Schools aren't churches. They prepare kids for the real world, which includes tough choices.
      *   *Point 5: Parental Rights vs. Community Ban.* If a parent doesn't want *their* kid to read it, they can opt-out. Removing it punishes everyone.

