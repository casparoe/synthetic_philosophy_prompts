      *   *The "Water Supply" Analogy:* Is it valid?
          *   Water is objective, biological, universal need. Contamination is scientifically measurable.
          *   Morals are subjective, culturally specific, debated. "Contamination" is a matter of opinion.
          *   *Flaw:* False Equivalence.
      *   *The "Shared Moral Standards" Claim:* Who defines them?
          *   Public schools serve *everyone*, including minorities, different religions, different family structures.
          *   Imposing one group's morals infringes on others' rights.
