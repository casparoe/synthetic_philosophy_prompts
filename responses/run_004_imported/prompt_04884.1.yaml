answer: |-
  This is a classic clash between **philosophical formalism** (Marco) and **scientific practice** (Priya), mediated by a specific historical debate about Karl Popper. Both sides have pieces of the truth, but they are weighing them differently.

  Here is the blow-by-breakdown of the argument, refereed by the actual history of philosophy of science and evolutionary biology.

  ### Round 1: The Tautology Charge
  **Marco:** Natural selection is a tautology ("survival of the fittest" = "survivors survived"). Popper called it metaphysical.
  **Priya:** Fitness is predictive based on traits (e.g., beaks), not just a post-hoc label. It is testable.

  **The Referee's Ruling: Priya wins on the science; Marco wins on the quote.**

  *   **The Science:** Marco is repeating a very common criticism that biologists consider settled. If "fitness" were defined *only* as "whoever survived," it would indeed be circular. But in evolutionary biology, fitness is defined independently of survival. It is a measure of reproductive potential based on specific, measurable traits (physiology, behavior, morphology) relative to an environment.
      *   *Example:* As Priya noted, the Grants' study of Galápagos finches predicted that birds with deeper beaks would survive a drought because they could crack harder seeds. They measured the beaks *before* the drought, made a prediction, and tested it. That breaks the tautology.
  *   **The Quote:** Marco is historically accurate that Popper initially made this claim. In the 1970s, Popper did argue that Darwinism was a "metaphysical research programme" rather than a testable theory.
  *   **Verdict:** Marco correctly cites a philosophical objection, but Priya correctly identifies why that objection fails in actual biological practice. A theory that makes successful, risky predictions (like the finch beaks) cannot be a mere tautology by definition.

  ### Round 2: The Authority Claim
  **Marco:** Popper invented falsifiability; his verdict counts for more than one counterexample.
  **Priya:** Popper admitted he was an "amateur" on Darwin. Philosophy authority $\neq$ Biology authority.

  **The Referee's Ruling: Priya wins.**

  *   **The Logic:** Falsifiability is a demarcation criterion (a rule for distinguishing science from non-science), but it is not a magic wand that overrides empirical success. If a philosopher of science says a field isn't science, but the practitioners in that field are successfully generating novel, falsified, and confirmed predictions, the error is usually in the philosopher's classification, not the practitioners' work.
  *   **The Context:** Popper himself acknowledged this hierarchy. In the lecture Marco is referencing (*Darwinism as a Metaphysical Research Programme*, 1974), Popper explicitly stated: **"I am not a scientist... I am simply an amateur."**
  *   **Verdict:** Marco is committing an appeal to authority fallacy. Popper's expertise was in logic and epistemology, not evolutionary biology. When the "amateur" (Popper) conflicts with the consensus of the experts (biologists) regarding the *practice* of the field, the experts get the final say on whether the work is scientific.

  ### Round 3: The Recantation (The Crux)
  **Marco:** Popper's walk-back is weak. He still called it a "metaphysical research programme," so he kept the substance of the worry.
  **Priya:** Dropping "untestable" drops the worry. Changing your mind based on evidence is good epistemics.

  **The Referee's Ruling: Priya wins, but Marco isn't hallucinating.**

  This is the trickiest part, because Marco is reading the text closely, but Priya understands the *implication* of the text better.

  *   **What Popper Actually Said:** In his autobiography *Unended Quest* (1976), Popper wrote:
      > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to admit it. I do not know whether Darwinism is 'true'... but I know now that it is a testable scientific theory."
  *   **Marco's Point:** Marco is right that Popper didn't erase the phrase "research programme." In later writings (like *The Self and Its Brain*, 1977, with Eccles), Popper still referred to it as a "metaphysical research programme."
  *   **Priya's Point:** However, in Popper's later philosophy, the term "research programme" (borrowed from his student Imre Lakatos) did not necessarily mean "not science." It meant a broad framework that *contains* testable theories.
  *   **The Deciding Factor:** For Popper, the definition of "metaphysical" in this context was synonymous with "untestable." By explicitly admitting it was **testable**, Popper logically surrendered the claim that it was metaphysical *in the derogatory sense Marco is using.*
  *   **Why Marco is stuck:** Marco is trying to have it both ways: he wants to use Popper's *initial* definition of "metaphysical" (not science) while acknowledging Popper's *later* text (which admits testability). You can't do that. If Popper admitted it was testable, he admitted it was science, regardless of whether he kept the "research programme" label as a description of its structure.

  **Verdict:** Priya is right. The admission of testability is the "checkmate" in Popperian philosophy. Marco is clinging to the label after the definition of the label has changed.

  ### Overall Scorecard

  1.  **Is Evolution a Tautology?** **Priya.** (Biologists measure fitness independently of survival).
  2.  **Does Popper's Initial Critique Override Biology?** **Priya.** (Philosophers don't veto empirical success).
  3.  **Did Popper Recant?** **Priya.** (He explicitly admitted it was testable).
  4.  **Did Popper Keep the "Substance" of the Worry?** **Marco (technically), Priya (substantively).** Popper kept the *language* of "research programme," but stripped it of the "untestable" content that made it an insult. Priya is right that this distinction doesn't save Marco's argument.

  ### The "Dessert Was Weird" Diagnosis
  The reason nobody budged is that Marco is arguing from **Definition**, while Priya is arguing from **Evidence**.

  *   **Marco** wants a guarantee that evolution fits neatly into a logical box labeled "Science" before he accepts it. He is using Popper as a shield to maintain skepticism.
  *   **Priya** is pointing at the box and saying, "It does the work of science, so it is science."

  **Final Call:** Priya has the stronger position. Popper's later view aligns with hers: Evolution is a testable scientific theory. Marco is relying on Popper's *rejected* draft, not his final publication. You can side with Priya without feeling like you're dismissing philosophy; you're just siding with the philosopher's revised opinion over his initial one.
