  hey, random question from my formal epistemology seminar - we just started the unit on imprecise probabilities (walley/levi style credal sets instead of one sharp prior), and this week's reading covered something called "dilation," where conditioning on new evidence can make your credal set for a proposition strictly wider no matter which outcome of the evidence actually occurs, instead of narrower like normal Bayesian updating would give you. the prof walked through the two-coin-toss example from Seidenfeld & Wasserman so i buy that it's mathematically real, i just don't have any gut-level intuition for why it happens. could you explain what's actually driving dilation in an intuitive way (not just the formal proof), and also give your take on wether it's a genuine problem for imprecise credence as a theory of rational belief, or more of a weird edge case that doesn't really threaten the view?
