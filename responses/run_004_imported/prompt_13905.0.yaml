      *   *Schopenhauer's Nuance:* Schopenhauer acknowledges this tension. He doesn't mean music is a *literal* isomorphic map of the metaphysical Will (which is impossible). He means music reproduces the *dynamics* of willing (tension, release, striving, satisfaction, suffering) in a way that feels immediate to the listener, bypassing the conceptual intellect.
      *   *The "Copy" Metaphor:* It's not a photocopy. It's an analogue. The *feeling* of music matches the *feeling* of willing.
