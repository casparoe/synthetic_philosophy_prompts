      *   *The World as Will:* The thing-in-itself (noumena). Blind, irrational, endless striving. Outside space and time. One unified force.
      *   *The Arts (General):* They copy the *Ideas* (Platonic forms). They help us escape the servitude of the Will temporarily by contemplating eternal forms. They are "shadows" because Ideas are objectifications of the Will, not the Will itself.
      *   *Music (Specific):* It skips the Ideas. It copies the *Will* directly.
      *   *The Analogy:* Bass = Inorganic/Gravity, Inner Voices = Plant/Animal, Melody = Human Striving/Intellect.

  3.  **Address the Core Contradiction (Time/Structure vs. Timeless Will):**
