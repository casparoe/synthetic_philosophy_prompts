answer: |-
  **Setting:** *A quiet corner of the faculty lounge, post-seminar. A whiteboard covered in half-erased tensor networks stands nearby. **Elena** (Everettian Physicist) is pouring coffee. **Marcus** (Philosopher of Physics) is leaning against the counter, arms crossed.*

  **Marcus:** You handled the Q&A well, Elena. Though I noticed you sidestepped the question about Bell.

  **Elena:** I didn't sidestep it. I answered it. The unitary evolution of the wavefunction is governed by the Schrödinger equation, which is a local differential equation. No influence propagates faster than light. The "spookiness" vanishes once you remove the collapse postulate.

  **Marcus:** That's the standard Everettian line. "No collapse, therefore no non-locality." But you're conflating *dynamical* locality with *Bell* locality. Bell's theorem doesn't care about your dynamics. It cares about the statistics of measurement events. Even if you have a billion branches, in *this* branch, Alice sees "Up" and Bob sees "Down." Bell asks: given the complete state of the past light cone, is Alice's outcome independent of Bob's setting?

  **Elena:** But in Everett, there is no single "Alice's outcome." There is a superposition of Alice-seeing-Up and Alice-seeing-Down. The global state contains both. The correlation is encoded in the structure of the global wavefunction, which evolved locally from the source.

  **Marcus:** That's exactly the friction point. Let's carve this up properly. Bell's condition of Local Causality can be decomposed into Parameter Independence (PI) and Outcome Independence (OI). PI says my setting doesn't change your probabilities. OI says my outcome doesn't change your probabilities. MWI satisfies PI—you can't signal. That's why you hide behind the No-Signalling Theorem. But you violate OI.

  **Elena:** I reject the framing. OI assumes there is a unique outcome to condition on. In MWI, conditioning on "Alice sees Up" just selects a branch. In that branch, Bob *must* see Down because the branch structure is defined by the entanglement. It's not that Alice's outcome *caused* Bob's; it's that they are part of the same decoherent history.

  **Marcus:** "Decoherent history." That's the magic phrase. But look at the ontology. For Alice-Up to be correlated with Bob-Down, rather than Bob-Up, there has to be a fact of the matter about which Alice-substance is paired with which Bob-substance. If the wavefunction is real, and it lives in configuration space, then it is not a local beable. It doesn't live in 3D space.

  **Elena:** The wavefunction assigns amplitudes to configurations of fields in 3D space. The dynamics are local.

  **Marcus:** The dynamics are local, but the *state* is not separable. Bell's notion of locality requires that the physical state of a region supervenes on local beables in that region. In MWI, the "fact" that Alice-Up matches Bob-Down does not supervene on the local physical state at Alice's wing or Bob's wing individually. It only exists in the global wavefunction. You've saved locality of *influence* by sacrificing locality of *being*. You have a holistic ontology.

  **Elena:** I'd say I have a *non-separable* ontology, which is different from non-local. Look, Marcus, imagine two classical coins prepared in a correlated state and sent apart. If I see Heads, I know you see Tails. Is that non-local?

  **Marcus:** Not if the correlation was determined at the source. That's a common cause. But Bell proved you can't explain quantum correlations with a common cause in the past light cone, *unless* you give up Statistical Independence or Locality. You're keeping Statistical Independence. So you must be giving up Locality. You just refuse to call it that because the mechanism is unitary.

  **Elena:** The common cause *is* sufficient in MWI because the "outcome" isn't a single value. The common cause is the entangled state $|\psi\rangle = \frac{1}{\sqrt{2}}(|UD\rangle - |DU\rangle)$. This state exists at the source. It propagates outward. When Alice measures, she entangles with the particle. Her state becomes $|A_U\rangle|U\rangle + |A_D\rangle|D\rangle$. When Bob measures, he entangles. The total state is $|A_U\rangle|B_D\rangle|UD\rangle + |A_D\rangle|B_U\rangle|DU\rangle$. Notice: there is no $|A_U\rangle|B_U\rangle$ term.

  **Marcus:** I see the math. The term is zero. But *why* is it zero? In a local theory, the amplitude for Alice-Up should be combinable with the amplitude for Bob-Up based on local interactions at each detector. The fact that the cross-terms vanish globally implies a constraint that isn't mediated by local signals between the detectors at the time of measurement.

  **Elena:** The constraint was mediated when the particles interacted at the source! The information about the anti-correlation is carried locally by the particles.

  **Marcus:** That's the hidden variable hope, and Bell killed it. The particles don't carry enough local information to determine the outcomes for *all* possible measurement settings. In MWI, the "information" is in the global phase relations. But phase relations between spatially separated components of the wavefunction... that looks suspiciously like action at a distance. If I change my basis here, I change the decomposition of the global wavefunction there.

  **Elena:** You don't change the physical state there. You just change how *you* describe the branching. This is where the No-Signalling theorem does real work. It's not a cover-up. It proves that the reduced density matrix at Bob's location is invariant under Alice's unitary operations. Locally, Bob sees nothing change. If locality means "no observable influence outside the light cone," MWI is local.

  **Marcus:** But Bell's Locality isn't about *observable* influence. It's about *ontological* independence. Maudlin's point is precise here: If the theory posits distinct physical outcomes (even if they are in different "worlds"), and those outcomes are correlated in a way that violates Bell inequalities, the theory is non-local. You can't say "Oh, all outcomes happen" to dodge the inequality. The inequality applies to the *measure* over the outcomes. The Born rule weights the branches. The weight of the (Up, Up) branch is zero. Why? Because of a relation between Alice's magnet angle and Bob's magnet angle that wasn't mediated locally.

  **Elena:** You're treating the branch weights as probabilities that need a causal mechanism to align. But in Everett, the weights are structural features of the Hilbert space. The "pairing" you're obsessed with—Alice-Up with Bob-Down—isn't an event that happens at measurement. It's a fact about the history of the universal state vector. The vector evolved locally. The correlation is a fossil of that local evolution.

  **Marcus:** A fossil implies a record. Where is the record kept locally? If I look at Alice's branch, locally, does it contain the information that Bob *must* be Down?

  **Elena:** In the Heisenberg picture, yes. The Deutsch-Hayden formalism shows that all information is contained in the local descriptors of the qubits. The correlation is encoded in the local operators.

  **Marcus:** Ah, the Deutsch-Hayden escape hatch. But that formalism comes at a cost. The local descriptors depend on the *global* choice of basis to be interpreted. You've shifted the non-locality from the dynamics to the representation. You're saying the information is locally accessible, but only if you know how to decode it, and the decoding key is the global entanglement structure. That's not separability.

  **Elena:** It is if you accept that the fundamental reality is the vector in Hilbert space, not fields in 3D space. If you demand 3D separability, you're begging the question against wavefunction realism.

  **Marcus:** I'm not begging the question; I'm pointing out the price of your ticket. You want to claim MWI is "local" in the sense that satisfies relativistic intuitions. But relativistic intuitions are about events in spacetime. If your fundamental ontology is a field on configuration space, you have already abandoned the spirit of relativity. You have a preferred foliation of the wavefunction's evolution, even if it's Lorentz invariant in appearance.

  **Elena:** I haven't abandoned relativity. The theory is covariant. The "preferred foliation" is only in the decoherence basis, which is emergent, not fundamental. Look, Marcus, what's the alternative? Bohmian mechanics has explicit non-local guiding equations. GRW has collapse hits that are non-local. Copenhagen has... magic. MWI is the *only* game in town where the fundamental equation is a local PDE.

  **Marcus:** I grant you that. MWI has local *dynamics*. I deny it has local *causality* in Bell's sense. And here is the rub: Bell's theorem forces a trilemma. You must drop one: (1) Unique Outcomes, (2) Local Causality, (3) Statistical Independence. Copenhagen drops (1) effectively by making outcomes contextual. Bohm drops (2). You claim to keep (2) by dropping (1) radically—all outcomes occur.

  **Elena:** Exactly.

  **Marcus:** But by dropping (1), you change the meaning of "Local Causality." Bell's condition assumes that if I specify the past state $\lambda$, the probability of outcome $A$ is fixed. In MWI, $\lambda$ fixes the *amplitudes*, not the outcome. So you aren't satisfying Bell's Local Causality; you're rendering it inapplicable. You aren't "local" in Bell's sense; you are "post-Bell."

  **Elena:** That's semantic games. If I can't send a signal, and the dynamics are local, what physical content does your "non-locality" have? It's a ghost. It haunts your philosophy but doesn't touch my physics.

  **Marcus:** It has content because it tells us about the structure of reality. If the facts about my measurement outcome don't supervene on the physical state of my laboratory, but depend on the state of a laboratory light-years away, that is a non-separable universe. You've traded "spooky action" for "spooky identity." The Alice-Up here is only the "partner" of Bob-Down there because of a global fact. You've saved locality by making the universe a single, indivisible holistic object.

  **Elena:** I'd say I've taken quantum mechanics seriously enough to realize the universe *is* a single object. The separability you want is a classical prejudice. We learned from Bell that nature isn't locally separable. I accept that. I just refuse to add a collapse mechanism that makes it *dynamically* non-local as well. I keep the dynamics local and accept the holism. You seem to want local holism, which is impossible.

  **Marcus:** I want an account where events in spacetime are the primary reality. You make the wavefunction primary. In your view, "Alice measuring Up" isn't a fundamental event; it's a mode of the wavefunction. So when you say "MWI is local," you mean "The wavefunction evolves locally." When I say "MWI is non-local," I mean "The events we experience are correlated non-locally." We are talking past each other because we disagree on what exists.

  **Elena:** Then let's agree on this: If "locality" means "no superluminal signalling," I win. If "locality" means "Bell's Local Causality applied to unique outcomes," I reject the premise. If "locality" means "Separability of states in 3D space," I concede the universe isn't local. But I'd argue that's a feature. The non-separability is in the initial conditions and the state space, not the propagation.

  **Marcus:** And I'd argue that non-separable initial conditions that yield Bell-violating correlations *are* the non-locality Bell was warning us about. You haven't defused the bomb, Elena. You've just buried it in configuration space.

  **Elena:** * (Smiles, picks up her mug)* Then it's a very well-buried bomb. It hasn't gone off in a century.

  **Marcus:** * (Gestures to the whiteboard)* Bell's theorem is the timer. It's still ticking. You just convinced yourself that because you can't hear it, it isn't there.

  **Elena:** Or maybe I'm the only one who realized there's no explosion. Just a split.

  **Marcus:** We'll see. When you finally derive the Born rule without begging the question, maybe we'll talk about locality again. Until then, you're local in dynamics, but holistic in ontology. Don't pretend that's what Einstein meant.

  **Elena:** Einstein was wrong about the dice, Marcus. Maybe he was wrong about the separability too.

  **Marcus:** Maybe. But Bell wasn't.

  *They stand in silence for a moment, the hum of the refrigerator filling the gap between the wavefunction and the world.*
