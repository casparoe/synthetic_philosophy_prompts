answer: |-
  **MEMORANDUM**

  **TO:** Search Committee
  **FROM:** [Your Name], Chair
  **DATE:** [Date]
  **SUBJECT:** Procedural Adjustment for Friday's Final Vote

  Colleagues,

  As we prepare to decide between our two finalists this Friday, I want to propose one specific adjustment to our voting procedure to ensure we maximize the epistemic value of this committee.

  In reviewing our past three searches, I have noticed a consistent pattern: once the first few senior members announce their verdicts, the remaining votes align, regardless of our private impressions beforehand. This is not a matter of timidity; rather, it is a rational information cascade. Later voters are correctly treating the early votes as high-credibility evidence, which inadvertently drowns out their own independent data. The result is that we often aggregate one or two judgments rather than seven.

  To correct for this structural bias without sacrificing our tradition of deliberation, I propose the following change for Friday:

  **We will cast our votes via written ballot at the very start of the session, before any verbal announcements are made.**

  I know some of us view the senior-first speaking order as essential to genuine deliberation, allowing experienced members to frame the discussion and guide our reasoning. I share this view. Therefore, **after** we have recorded our independent votes, we will proceed with the traditional senior-first order to discuss the *reasons* behind our positions.

  This small change separates the *aggregation of our judgments* from the *deliberation of our reasons*. It ensures that when we speak, we are pooling seven independent assessments rather than confirming a signal established by the first speaker.

  Please come prepared to submit a written verdict immediately upon convening. I look forward to a robust discussion.

  Best,

  [Your Name]
