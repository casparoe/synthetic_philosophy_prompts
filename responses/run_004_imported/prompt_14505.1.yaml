      *Better tweak:* **Written Ballots first, Discussion second.**
      *Rationale:* This separates the *aggregation of judgment* from the *deliberation*. It acknowledges that the current method conflates the two, causing the cascade. It respects the senior members' desire to lead the *discussion* (which happens after the vote is cast) but prevents their initial verdict from anchoring the data.

      *Let's try a different angle:* The "Pre-Discussion Vote."
      *Memo Strategy:* Acknowledge the value of senior insight (epistemic weight). Acknowledge the statistical problem (information cascade). Propose: **We will cast our votes via written ballot at the start of the meeting, before any verbal announcements. We will then proceed with the traditional senior-first discussion to explain our reasoning.**
      *Why:* This locks in the independent data. It preserves the "senior-first" tradition for the *explanation/deliberation* phase, satisfying the colleague who values that structure. It addresses the "rational inference" problem by removing the sequential public signal.

