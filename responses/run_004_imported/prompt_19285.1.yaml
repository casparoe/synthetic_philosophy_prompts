prompt: |-
  Okay so I've been down a philosophy of religion rabbit hole lately (blame a William Lane Craig YouTube binge lol) and I keep running into this idea called Molinism, where God has 'middle knowledge' of what every possible free creature would freely do in literally any circumstance, and uses that to pick which world to create. Theres apparently a famous objection to this called the grounding objection: it says these 'counterfactuals of freedom' can't actually be true because nothing grounds them — they're contingent so they aren't necessary truths, and the person never actually exists in that circumstance to make the choice, so what fact makes it true that they WOULD do X instead of Y? Can you argue that this objection actually fails, i.e. that Molinists have a solid comeback? Don't just say "some philosophers think truths don't need grounds" — actually engage with why CCFs would need truthmakers in the first place and where exactly the objection goes wrong.
