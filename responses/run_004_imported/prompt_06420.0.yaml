      *   *AI/Uploaded Mind:* This feels very contemporary and fits the "disembodied mind" theme perfectly. It allows for a clean cut from sensory data without biological decay interfering. Let's go with an AI or a digital consciousness undergoing a "null test."
      *   *Decision:* Let's go with a near-future experimental subject in a "Total Isolation Chamber" (a high-tech version of the sensory deprivation tank). This keeps it human (biological) but technologically enforced, making the "Flying Man" scenario physically plausible. Let's call the subject "Elias."

