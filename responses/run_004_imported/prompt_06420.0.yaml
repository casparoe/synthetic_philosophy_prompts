  5.  **Step-by-Step Narrative Flow:**
      *   **Beginning:** The shutdown. The sensors go dark. The suspension begins.
      *   **Middle:** The search for self. Checking for limbs, breath, memory. Finding none. Finding only *presence*.
      *   **Climax:** The realization of existence without attributes. The "Flying Man" moment.
      *   **Ending:** The ambiguity. Does this prove the soul, or just the persistence of a pattern? A lingering question.

  6.  **Writing - Focusing on Sensory Language (or lack thereof):**
      *   Use words like *weightless, boundless, silent, dark, hum.*
      *   Avoid describing physical sensations (cold, hard, soft).
      *   Emphasize the *knowing* rather than the *feeling*.

