answer: |-
  **Setting:** *The lobby of the philosophy department, post-talk. The crowd has thinned. Elena (Defender) is holding a glass of warm white wine. Marcus (Skeptic) is gathering his things.*

  **Elena:** That was a spirited Q&A. Though I noticed you stayed suspiciously quiet during the period on epistemic consequences.

  **Marcus:** I was letting the grad students take the swings. Besides, you know where I stand. If the architecture of the visual system is encapsulated, the epistemic worries dissolve. If perception is pure, then bad beliefs can't hijack it.

  **Elena:** But that's the thing, Marcus. Perception *isn't* pure. That's the whole point of the Siegel line. Think about the Jack and Jill case. It's not just that Jack *believes* Jill is angry. It's that his unjustified jealousy makes her neutral face *look* angry to him. The phenomenal character shifts. If you deny that, you're denying the data of experience itself.

  **Marcus:** I'm not denying the experience, Elena. I'm denying your *categorization* of it. You're saying the visual phenomenology changes. I'm saying Jack's *interpretation* changes. Look, if I tell you a neutral face is threatening, you'll start scanning it for threat cues. You attend to the furrowed brow, the tight lip. But the retinal input hasn't changed, and the early visual processing hasn't changed. You're conflating attentional selection with perceptual penetration.

  **Elena:** That's the standard Firestone and Scholl move, isn't it? "It's just attention." But attention modulates *what* we process, sure, but in the Jack and Jill case, the claim is that the *same* attended features are experienced differently. The geometry of the mouth looks downturned. The shadow under the eye looks harsher. If Jack's belief is irrational, and that belief is causing the face to look angry, then his resulting belief that she is angry is based on a compromised experience. That's the hijacking argument. It has real epistemic teeth. If you reduce it to "Jack just judged it wrong," you lose the explanation for why he feels so *compelled* by the evidence of his own eyes.

  **Marcus:** But why posit a change in the visual system to explain that compulsion? Parsimony, Elena. We know post-perceptual judgment is wildly susceptible to cognitive bias. We know memory is reconstructive. So, when Jack says, "She looks angry," he could be reporting a swift, unconscious judgment, not a sensory state. Firestone and Scholl went through the literature—hills look steeper when you're tired, softballs look bigger when you're hitting well. Every single one. They found demand characteristics, response bias, memory contamination. Not one held up under rigorous controls where the perceptual task was dissociated from the cognitive state. If the "big" studies on size and slant are confounds, why should the Jack and Jill intuition be any different?

  **Elena:** Because the Jack and Jill case isn't about retinal size or slant. It's about high-level properties. Firestone and Scholl are great at dismantling claims that desire changes the *metric* properties of vision. I'll grant you that. A dollar bill doesn't actually look physically larger. But emotion and belief penetrate *categorical* perception. There's a difference between seeing a shape and seeing an *expression*. The skepticism works for low-level features because those are hard-wired. But recognizing anger? That's semantic. That's already concept-laden.

  **Marcus:** But that's just moving the goalposts. If you say, "Okay, low-level vision is encapsulated, but high-level recognition is penetrated," you've basically admitted that the *sensory* core is safe. You're just talking about recognition now. And recognition is judgment. Where do you draw the line between "seeing-as" and "judging-that"? If Jack sees the face *as* angry, isn't that just a quick judgment *that* it is angry? If I can't distinguish the phenomenology of a penetrated perception from a rapid inference, why should I believe in penetration?

  **Elena:** Because the phenomenology *is* distinguishable to the subject. There's a "feel" to seeing anger that isn't present when I infer anger. Think about it: If I see a face and infer anger because I'm told she's angry, it feels like an addition. But in the penetration case, the anger feels *presented*. It's in the face. Siegel's point is precisely that we have introspective access to this difference. If you dismiss introspection every time it conflicts with a modular model of vision, you're prioritizing the theory over the phenomenon.

  **Marcus:** I'm prioritizing the mechanism over the anecdote. Introspection is notoriously unreliable. That's why we run experiments. And the experiments you rely on usually ask subjects to report what they see, which is a verbal report. Verbal reports are post-perceptual. They pass through judgment. So when a subject says, "The object looked closer," how do you know they aren't just saying, "I felt the object was closer"? You haven't isolated the perception.

  **Elena:** Okay, let's grant the methodological difficulty. But here's my comeback to the "every study is a confound" argument. It assumes a specific, outdated architecture of the brain. It assumes a feed-forward system where cognition sits at the top and vision sits at the bottom, and they only talk at the end. But look at predictive processing models. Hohwy, Clark. The brain is a prediction machine. Top-down priors *constantly* shape bottom-up error correction. If cognition is generating the predictions that vision is trying to match, then cognition is literally constituting the perceptual content. To deny penetration in light of predictive processing is to deny the current leading model of neuroscience. You're defending Fodor's modularity in 2024?

  **Marcus:** Predictive processing is compatible with encapsulation, Elena. The "priors" can be perceptual priors learned from past visual data, not necessarily *current* cognitive beliefs or desires. The system can be top-down without being *cognitively* penetrated. The visual system can adjust its own gain based on visual history without my belief that "Jill is mad" rewiring my V1. You're conflating "top-down" with "cognitive." Firestone and Scholl's point is that *cognitive* states—beliefs, desires—don't penetrate. Not that there's no feedback loops.

  **Elena:** But where do those perceptual priors come from? If I have a prior that "shadows indicate depth," that's visual. But if I have a prior that "Jill is hostile," that's a belief. If that belief lowers the threshold for detecting anger features in her face, that *is* cognitive penetration. It's not just a visual prior; it's a doxastic one influencing the sensory gain. And if you deny that, you have to explain why the epistemic status of Jack's belief is secure. If his belief causes the experience, and the belief is irrational, the experience can't justify the belief. It's circular. You need penetration to explain the epistemic downgrade.

  **Marcus:** I can explain the epistemic downgrade without penetration. Jack's belief is unjustified because it's based on a *biased search* for evidence, not a biased *experience*. He looks only at the negative cues. He ignores the smile. That's an attentional bias, driven by cognition. The experience itself is veridical—he sees the furrow. He just weights it incorrectly. That's a reasoning error, not a perceptual one. It preserves the integrity of perception and still explains why Jack is epistemically screwed.

  **Elena:** But that doesn't capture the *holism* of the experience. He doesn't see a furrow and weigh it. He sees an *angry face*. The property "angry" is instantiated in his phenomenology. If cognition determines whether that property is instantiated in experience, cognition has penetrated perception. You're trying to save modularity by chopping the experience into atoms—lines, shadows, colors—and saying only those are visual. But we don't see atoms, Marcus. We see faces. We see meanings. If cognition shapes the meaning we see, it shapes the perception.

  **Marcus:** And I'm saying "seeing meaning" is a metaphor for "seeing atoms and inferring meaning." It's a linguistic convenience, not an ontological reality. If you want to claim penetration, the burden is on you to design a task where the cognitive state changes performance on a purely perceptual task—like a detection threshold or a discrimination task—where response bias is ruled out. And every time someone designs that task, the effect disappears.

  **Elena:** Or, every time someone designs that task, they design it for low-level features because that's what psychophysics knows how to measure. We measure contrast sensitivity, not "hostility sensitivity." You're demanding a measurement tool for a high-level phenomenon that only exists in low-level metrics. It's like using a ruler to weigh grief. The absence of evidence in the psychophysics literature isn't evidence of absence of the phenomenon, it's evidence of a mismatch in methodology.

  **Marcus:** That's a convenient shield. "You can't measure it because your tools are too crude." But if it's not measurable in behavior, what work is it doing?

  **Elena:** It explains the rationality of our actions. If the face *looks* angry, it's rational for Jack to apologize. If he just *believed* she was angry but she looked neutral, his apology would be disconnected from his sensory engagement with her. The penetration explains the *immediacy* of his reaction.

  **Marcus:** Immediacy doesn't imply penetration. A reflex is immediate. A heuristic is immediate. That doesn't mean the visual cortex was rewritten. Look, I'll concede this: If predictive processing turns out to mean that semantic beliefs directly alter V1 activity in a way that changes discrimination thresholds independent of response bias, I'll come over to your side. But until then, I'm sticking with the null hypothesis. Perception is the input. Cognition is the processor. Don't blur the line just because the user interface looks seamless.

  **Elena:** And I'll stick with the view that the user interface *is* the reality. If the interface shows anger because of a belief, then the perception is penetrated. We'll see who the next decade of fMRI studies favors.

  **Marcus:** Deal. But I'm buying the coffee, because I know you're going to dream about predictive coding tonight and wake up thinking you've won.

  **Elena:** *Laughs.* Fair enough. But you're paying because you know deep down that hill looked steeper on the way up here.

  **Marcus:** That was physical exhaustion, Elena. Not cognitive penetration.

  **Elena:** Keep telling yourself that.
