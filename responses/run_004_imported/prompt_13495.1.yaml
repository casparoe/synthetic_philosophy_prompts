      *Rebuttal:* If we break it, we lose the ability to do *any* justice in the future.

      *Wait, I need to be careful not to be preachy ("promise is a promise").* I need to engage with the *consequences*.
      *Strongest Argument Against:* Upholding the promise perpetuates a specific, known injustice (wrongful termination + guilty senior scientist) for the sake of a hypothetical future benefit (future sources). This trades a real victim for a theoretical good.
      *My engagement:* Acknowledge this trade-off. It is painful. But the magazine's currency is trust. If we burn it, we can't help *anyone* later.
      *Added nuance:* We can help the postdoc *without* breaking the promise. By investigating the senior scientist using the *lawsuit's discovery materials* (which are now public record, presumably, or can be accessed by the postdoc's lawyers). The magazine can use *those* documents to write a new story, vindicating her without needing the original source.

      *Final Plan:*
