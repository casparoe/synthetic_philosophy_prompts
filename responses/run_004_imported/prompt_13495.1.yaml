prompt: |-
  I sit on my science magazine's editorial standards committee. Three years ago, a reporter here promised an anonymous source 'permanent, unconditional' confidentiality for lab notebooks proving data fabrication in a widely cited study; based on those notebooks we named a junior postdoc as the fabricator, and she was dismissed. That reporter has since left. The postdoc is now suing her university for wrongful termination, and discovery suggests a senior scientist directed the fabrication and that she was acting on his instructions. But authenticating the notebooks requires our source to testify about how he obtained them, which would unmask him. Reached again, he refuses, and correctly notes that our promise had no such conditions. Draft the committee's short decision memo: recommend a concrete course of action and a time frame, and engage honestly with the strongest argument against whatever you recommend, rather than settling this by simply declaring that a promise is a promise or that clearing her name obviously comes first.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a science magazine's editorial standards committee.
      *   **Situation:** Three years ago, a reporter promised "permanent, unconditional" confidentiality to a source who provided lab notebooks proving data fabrication. Based on this, a junior postdoc was named and fired. Now, the postdoc is suing, claiming a senior scientist directed it. Authenticating the notebooks (crucial for the lawsuit) requires the source to testify, which would unmask him. The source refuses, citing the promise. The reporter is gone.
      *   **Task:** Draft a short decision memo for the committee.
      *   **Requirements:**
          *   Recommend a concrete course of action.
          *   Include a time frame.
          *   Engage honestly with the strongest argument *against* the recommendation (no easy outs like "promise is promise" or "clearing her name is paramount").

  2.  **Identify the Ethical and Legal Conflict:**
      *   **Journalistic Ethics:** Protecting sources is foundational. Breaking "permanent, unconditional" promises damages credibility and chills future whistleblowing.
      *   **Legal/Justice Concerns:** An innocent person (potentially) lost her career. The real culprit (senior scientist) might go unpunished. The court needs evidence to adjudicate the wrongful termination suit.
      *   **Institutional Risk:** The magazine could be subpoenaed. If they fight, they face contempt of court/fines. If they comply, they break their ethical code.
      *   **The Specific Dilemma:** The source *has* the key to authentication but refuses to speak because speaking unmasks him. The promise was "unconditional."

  3.  **Evaluate Potential Courses of Action:**
      *   *Option A: Honor the promise absolutely.* Refuse to cooperate with the court.
          *   *Pros:* Upholds journalistic integrity, protects future sources.
          *   *Cons:* Postdoc likely loses lawsuit (no authentication), senior scientist escapes scrutiny, magazine looks complicit in a miscarriage of justice, potential legal penalties (contempt).
      *   *Option B: Break the promise.* Reveal the source or pressure him.
          *   *Pros:* Helps the postdoc, serves immediate justice.
          *   *Cons:* Destroys magazine's reputation, violates explicit contract/pledge, unethical.
      *   *Option C: Seek a middle ground (The "Amicus/Intervention" approach).* Petition the court to accept the notebooks as authentic *without* source testimony, or seek a protective order that limits the unmasking scope, or admit the magazine's error in reporting if the evidence is now shaky.
      *   *Option D: Re-investigate and Publish a Correction/Retraction.* If the new evidence (discovery) suggests the postdoc was a patsy, the original reporting is now suspect.

      *Decision:* The most responsible action for a *Standards Committee* is to address the integrity of the original reporting and the current legal bind. We cannot force the source. We cannot break the promise without destroying the publication's future utility. However, we cannot ignore the likelihood of a grave injustice.
