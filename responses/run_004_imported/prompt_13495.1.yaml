      2.  **Action:** Legal counsel to file for a protective order/sealed testimony if subpoenaed, but ultimately refuse to unmask.
      3.  **Remedial Action:** Commission an immediate investigation into the senior scientist using the *new* evidence emerging from the lawsuit discovery (which doesn't require the source).
