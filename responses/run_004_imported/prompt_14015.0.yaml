      6.  **Actionable Advice:** How to engage without losing confidence. (Treat it as a stress test of the *justification*, not the *truth*).

  8.  **Tone Check:** Needs to be respectful, peer-to-peer, analytically rigorous, avoiding platitudes. Use philosophical terminology correctly (defeaters, higher-order evidence, closure, warrant).

  9.  *(Self-Correction)*: Make sure to explicitly answer "Is there an actual mistake?" Yes, the mistake is ignoring *defeaters* to justification, not denying the logical implication of truth.

  10. **Final Polish:** Ensure the distinction between "The argument is unsound" (which you can know) and "I don't need to check if this reveals a flaw in my reasoning" (which is the error) is crystal clear.

