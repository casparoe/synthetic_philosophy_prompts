  9.  **Final Polish:** Check JSON syntax. Ensure tone is helpful to the TA. (Self-correction: Ensure the JSON keys match the user's requested format roughly, but I can adjust the specific keys to be more descriptive as long as the structure is JSON). The user asked for specific keys: `luminosity_definition`, `cold_case_reconstruction`, `margin_for_error`, `kk_connection`, `overall_precision`. I will stick to those.

      *   *Luminosity Definition:* 3/3.
