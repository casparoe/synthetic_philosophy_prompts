  Here is a new pair of generalizations that replicates the structural problem of the Gold/Uranium case, but shifts the subject matter from bulk material mass to **thermal stability in a controlled environment**.

  ### The New Pair

  **Generalization A (Accidental):**
  > "All diamond lattices in this argon-filled furnace remain intact at 2,000°C."

  **Generalization B (Lawlike):**
  > "All Silicon-28 nuclei in this argon-filled furnace remain intact at 2,000°C."

  **The Setup:**
  Imagine a specific experimental run. We place 1,000 diamonds and 1,000 Silicon-28 samples into a furnace heated to 2,000°C. The furnace is flushed with argon gas. At the end of the experiment, we observe that 100% of the diamonds and 100% of the nuclei are intact.

  **The Track Record:**
  Both generalizations have the exact same empirical support within this context. Every observed instance confirms both statements. They share the same grammatical shape: $\forall x (Fx \rightarrow Gx)$, where $F$ is "object in this furnace" and $G$ is "remains intact at 2,000°C."

  **The Modal Difference:**
  *   **The Diamonds (Accidental):** Diamond is metastable carbon. In the presence of oxygen, it oxidizes (burns) at roughly 800°C. It survives here *only* because we contingently filled the furnace with argon. If we had flushed it with air (a perfectly physically possible alternative initial condition), the diamonds would have turned to CO₂. The generalization is true, but it relies on a local, contingent boundary condition (the argon tank), not a fundamental law.
  *   **The Nuclei (Lawlike):** The binding energy of a Silicon-28 nucleus is in the range of mega-electronvolts (MeV). The thermal energy at 2,000°C is in the range of fractions of an electronvolt (eV). It is physically impossible for thermal agitation at this temperature to disrupt the strong nuclear force holding the nucleus together. Even in a vacuum, even in oxygen, even under pressure, the nucleus *cannot* break apart at this temperature. The generalization is supported by the laws of nuclear physics.

  ---

  ### The Humean Challenge: Can Lewis Sort Them?

  David Lewis's **Best System Account (BSA)** defines laws of nature as the axioms of the deductive system that best balances **Simplicity** and **Strength** in summarizing the total Humean Mosaic (the complete history of particular matters of fact).

  Here is the honest assessment of whether a Lewis-style Humean can distinguish Generalization A from Generalization B without smuggling in anti-Humean modal notions.

  #### 1. The Local Mosaic Problem
  If the Humean theorist is restricted *only* to the data from this specific furnace run, **they cannot distinguish the two.**
  In the local mosaic, both statements are simply uniform regularities. There is no "modal force" marker attached to the silicon nuclei that isn't attached to the diamonds. Both are just points in spacetime where matter persisted. If laws are merely summaries of patterns, and the patterns are identical (100% success rate), the local status is identical.

  #### 2. The Global System Rescue
  A sophisticated Lewisian will argue that we never judge laws in isolation. We judge them as part of the *global* Best System.
  *   **For the Nuclei:** The generalization "Silicon-28 nuclei are stable at 2,000°C" is a trivial theorem derived from the Standard Model and Quantum Chromodynamics. Including it in the Best System adds immense **Strength** (it predicts outcomes in *any* furnace, in space, in stars) for very little cost in **Simplicity** (since the axioms of physics are already included to explain other things).
  *   **For the Diamonds:** The generalization "Diamonds in *this* argon furnace survive" is a terrible candidate for the Best System. To make it true, you have to add a complex, messy clause about the specific initial conditions of *this* furnace (the argon tank, the seals, the lack of leaks). It adds **Simplicity** cost without adding **Strength** (it doesn't help you predict what happens to diamonds in *other* furnaces).

  So, the Lewisian says: "The Nuclear generalization is a law because it fits the global system. The Diamond generalization is an accident because it's a local irregularity dependent on initial conditions."

  #### 3. The Anti-Humean Counter-Punch (The "Smuggling" Charge)
  The Anti-Humean (e.g., Armstrong, Maudlin) would argue that the Lewisian solution quietly begs the question.
  *   **Circularity:** To identify the Nuclear generalization as part of the "Best System," the Humean must already know which global regularities are *lawlike* enough to be axioms. They are using the distinction between law and accident to build the system that is supposed to *define* the distinction.
  *   **The Explanatory Direction:** The Anti-Humean argues that the Silicon nuclei survive *because* it is a law. The Lewisian must say it is a law *because* they survive (along with other similar events).
  *   **The Smuggling:** When the Lewisian says the Diamond case is "dependent on initial conditions," they are implicitly invoking a modal distinction between **dynamical laws** (which govern evolution) and **boundary conditions** (which are contingent). But in a pure Humean mosaic, a boundary condition is just another fact. Why is the presence of Argon a "contingent boundary condition" while the Strong Nuclear Force is a "governing law"? Both are just patterns in the mosaic. To privilege one pattern as "law" and the other as "accident" requires a criterion that looks suspiciously like the very modal necessity the Humean claims to eliminate.

  ### The Verdict

  **Could a Lewis-style theorist sort them correctly?**
  **Yes, practically.** They would correctly identify the Silicon generalization as lawlike and the Diamond one as accidental.

  **Could they do it *just* from the pattern of events without smuggling?**
  **No.**
  To make the distinction, they must appeal to the **global** system's simplicity and strength. But the judgment of "strength" relies on projecting local regularities into counterfactual situations (e.g., "This regularity would hold in *other* furnaces").
  Since Humeanism denies objective modal facts, this "projection" is just a heuristic about pattern compression. The Anti-Humean charge holds: the Humean can only distinguish the two by implicitly assuming that some patterns (nuclear stability) are *more projectible* than others (argon containment). But projectibility is itself a modal notion.

  The Humean saves the distinction, but only by treating "Lawhood" as a pragmatic virtue of our description rather than a feature of the world. If you want lawhood to be a mind-independent feature that *explains* why the silicon survived but the diamond (in air) wouldn't, the Lewisian mosaic remains silent. It shows you the footprints, but insists there was never a walker.
