      *   *Text:* "Although such machines might execute many things with equal or perhaps greater perfection than any of us, they would, without doubt, fail in certain others from which it could be discovered that they did not act from knowledge, but solely from the disposition of their organs: for while Reason is an universal instrument that is alike available on every occasion, these organs, on the contrary, need a particular arrangement for each particular action; whence it must be morally impossible that there should exist in any machine a diversity of organs sufficient to enable it to act in all the occurrences of life, in the way in which our reason enables us to act."
      *   *Key Concept 1: "Disposition of their organs."* This refers to the physical mechanism. In a clockwork automaton, gears are cut to do specific things. To do $X$, gear $A$ turns gear $B$. To do $Y$, gear $C$ must engage gear $D$.
      *   *Key Concept 2: "Particular arrangement for each particular action."* Every new situation requires a specific physical configuration. If the situation changes slightly, the machine might not have the gear for it.
      *   *Key Concept 3: "Reason is a universal instrument."* Human reason isn't a specific tool for a specific job (like a hammer). It's a general adaptability. We can apply logic to *any* situation, even novel ones we've never encountered.
      *   *Key Concept 4: "Morally impossible."* In the 17th century, this didn't mean "unethical." It meant "impossible in practice given the nature of things," or "impossible for all intents and purposes," though perhaps not logically contradictory in the strictest metaphysical sense. It implies a limit of complexity. You can't build a machine with infinite gears to cover infinite life situations.
      *   *Summary:* Machines are specialized; Reason is general. Machines run out of gears; Reason runs out of nothing (in principle).

  3.  **Deconstruct the Frame Problem:**
      *   *Origin:* McCarthy and Hayes (1969).
      *   *Core Issue:* How does an AI represent what *changes* and what *stays the same* when an action is performed?
      *   *Example:* If a robot moves a block from A to B, it knows the block is now at B. But does it know the block's color didn't change? That the wall didn't move? That the time changed? That the robot's battery level decreased?
      *   *The Problem:* In formal logic, you traditionally have to list every single thing that *didn't* change (frame axioms). Since there are infinite things that don't change, this is computationally intractable.
      *   *Modern Interpretation:* It's about relevance. How does an agent know which facts are relevant to the current decision and which can be ignored? It's about common sense reasoning in a dynamic world.

  4.  **Compare Descartes and the Frame Problem:**
      *   *Similarities:* Both deal with the limitation of mechanistic systems in handling open-ended, real-world situations. Both highlight the difficulty of accounting for "all the occurrences of life."
      *   *Differences:*
          *   *Descartes:* Focuses on *hardware/structural* limitations. A machine needs a specific physical mechanism for every action. It's about the *capacity to act* in novel situations.
          *   *Frame Problem:* Focuses on *representational/logical* limitations. It's about updating a knowledge base efficiently. It's not that the robot lacks a physical arm to move the block; it's that it can't logically deduce the consequences without an infinite list of rules.
