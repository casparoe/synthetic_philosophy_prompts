      *   **The Core Question/Task:** Make the strongest case that Augustine's own gradation (taxonomy) of lies undercuts his absolutism. Argue that the ranked list suggests he *does* care about harm/benefit, contradicting his claim that lying is wrong "as such" regardless of outcomes.
      *   **Constraint:** Engage deeply with how the taxonomy works alongside the intrinsic-wrongness claim. Avoid superficial summaries.
