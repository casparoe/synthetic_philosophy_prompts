answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name]. I'm [Abuela's Name]'s grandson.

  Before she died, Abuela gave my mother very specific instructions for this service. She said that if anyone stood up here and told you she was "watching over us," or that she had gone to a "better place," she would find a way to come back and haunt us out of pure spite. She was a woman of rigorous honesty. She didn't believe in comforting fictions, unless, of course, that fiction was a story by Borges.

  She spent her life teaching Latin American literature, and she spent the last forty years of that life teaching one essay in particular: *Nueva refutación del tiempo*. "A New Refutation of Time."

  I am currently finishing my own dissertation on temporality in Borges. So, I know that half the room is waiting for me to give a lecture, and the other half is worried I'm going to give a lecture. I promise I won't. But to understand who she was, and how we should mourn her, I think we have to look at that essay.

  In it, Borges builds a logical case that time doesn't actually exist. He argues that the past is just a memory, the future is just a hope, and the present is an infinitesimal slice that disappears the moment you name it. He suggests that the "self"—the idea that I am the same person I was yesterday, or that Abuela was the same woman at eighty-four that she was at four—is a construction. A story we tell ourselves to make sense of the chaos.

  If you follow the logic to its end, death shouldn't terrify us. If there is no time, there is no end. If there is no continuous "self," then there is no one to die.

  Abuela loved this argument. She loved the intellectual elegance of it. She told me once that it was the only honest theology she'd ever encountered. Because it doesn't promise you paradise. It just suggests that the walls of the prison we live in might be made of something other than iron.

  And looking around this room, I can try to apply that logic to her.

  If time is a fiction, then she isn't gone. She is simply a series of moments that remain true. There is the little girl in Buenos Aires learning to read. There is the young professor grading papers until 3:00 AM. There is the woman teaching me how to make coffee, and the woman arguing with my mother about politics, and the woman sitting in that armchair last Christmas, smiling at the noise of her grandchildren.

  If the self is discontinuous, then she is all of those women, simultaneously. None of them have died. They are fixed in their moments. In that sense, she is safe. Time cannot touch them.

  That is the argument. It is airtight. It is beautiful. And, as Borges admits at the very end of the essay... it doesn't work.

  He writes that despite the logic, despite the philosophy, he still feels the weight of the years. He admits that the argument saves him from nothing. He writes: *"Time is the substance I am made of. Time is a river which sweeps me along, but I am the river; it is a tiger which destroys me, but I am the tiger; it is a fire which consumes me, but I am the fire."*

  Abuela taught me that the value of the essay wasn't in the refutation. It was in the surrender. It was in the moment the philosopher puts down his pen and admits that he is still afraid. That he still misses the people who are gone.

  I stand here, with all my training, with all the tools to deconstruct the concept of loss. I can tell you that grief is just a psychological response to a metaphysical error. I can tell you that she lives on in our neural pathways, in the books she annotated, in the genetic code she passed down.

  But none of that stops the river.

  The truth is, I don't want a fiction today. Not even a beautiful one. I don't want to pretend she is here, and I don't want to pretend that her absence doesn't tear a hole in the world.

  She taught us that the only way to be honest about time is to admit that it destroys us. It takes everything. It took her wit, it took her energy, and finally, it took her. And the pain we feel right now? That isn't a sign that we don't understand the philosophy. It's the proof that we understood her.

  She was not a concept. She was not a bundle of perceptions. She was a woman who loved us, and who is now gone.

  Borges ends his essay by saying that while the argument against time is logically sound, the reality of loss is *humanly* true. And Abuela always valued the human truth over the logical one.

  So, I am not going to tell you she is watching over us. I am not going to tell you she is in a better place.

  I am going to tell you that the river has swept her along, and we are left on the bank. And the only thing we can do, the only honest thing we can do, is to feel the water rushing, feel the cold, and remember exactly what it felt like when she was here to hold our hands against the current.

  She was real. Her absence is real. And because she was real, we will miss her, forever.

  Thank you.
