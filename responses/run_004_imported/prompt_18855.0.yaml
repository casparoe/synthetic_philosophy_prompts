  "She walks out, sees the rose, and says 'Wow.' That's not a skill acquisition, Elias. That's a revelation."

  Elias leaned against the bookshelf, swirling his scotch. "It's a revelation of capacity. Mary knows every physical fact about red. When she sees it, she doesn't learn a new fact. She learns how to imagine, remember, and recognize red. It's know-how, not know-that. The Ability Hypothesis holds."

  Sarah swirled her pinot, eyes narrowing. "But know-how presupposes knowledge. To know how to imagine red, you must know what red is. If she only gains abilities, why does it feel like she's discovered a truth about experience? She feels she's learned *what it is like*."

  "Because the tool is unique," Elias countered. "It's the only way to access that data. But accessing it doesn't change the ontology. You're smuggling in a new fact under the guise of a new concept."

  "Not a new fact, a new mode of presentation," Sarah corrected. "Think of Hesperus and Phosphorus. Same planet, different concepts. Mary has the physical concept of red. Upon release, she acquires a phenomenal concept. She learns that *this* experience is identical to *that* physical state. That's new knowledge, but it's an old physical fact grasped differently."

  "But here's the rub," Elias said, pointing a finger. "With Hesperus, both concepts are public. Mary's phenomenal concept is private. If physicalism is true, why does the physical concept leave something out? If I know everything physical, what is there left to 'grasp'? Your view makes the gap seem brute."

  "Nothing ontological. Just cognitive," Sarah insisted. "You're conflating the map with the territory. The territory is purely physical. The map just got a new legend. The explanatory gap is epistemic, not metaphysical. She knows 'Red is wavelength X.' Now she knows 'This experience is wavelength X.' The 'this' is new."

  "But the 'this' refers to the physical state she already knew," Elias argued. "If the reference is fixed physically, the demonstrative adds no information. You're saying the mode of presentation constitutes knowledge. That implies the mode is ontologically significant."

  "It implies the subject is significant," Sarah said. "Physicalism isn't just about objects; it's about subjects too. Your view fails because it can't account for the truth value of her realization. 'So *that* is red' is a proposition."

  "An empty proposition if she already knew the physical referent," Elias muttered. "If the phenomenal concept is irreducible to the physical description, you've opened a crack. If Mary learns something true upon release, and she already knew all physical truths, then what she learns isn't physical. You're flirting with property dualism."

  "She learns a truth involving a phenomenal concept," Sarah said. "But the truth-maker is physical. Your Ability Hypothesis is worse, though. If she learns nothing true, then her surprise is irrational. She's surprised by a mere skill? That reduces qualia to motor functions."

  "She's surprised by the qualitative character of the skill," Elias said. "But character isn't fact. It's experience. You're trying to intellectualize the raw feel."

  "It is if it grounds truth conditions," Sarah shot back. "'Red looks like this' is true. She couldn't know that truth in the room."

  "She couldn't express it," Elias corrected. "Big difference. Knowing red is like riding a bike."

  "Is it?" Sarah raised her glass. "If she couldn't express it, think it, or know it, then physicalism holds, but at the cost of saying Mary learns nothing. If she learns something, physicalism holds, but you have to accept phenomenal concepts are special."

  "I'll take the skill," Elias clinked his glass against hers. "It keeps the world cleaner."

  "But it makes Mary's 'Wow' empty," Sarah said.

  "Better empty than dualist," Elias replied.
