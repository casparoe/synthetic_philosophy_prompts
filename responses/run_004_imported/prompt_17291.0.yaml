prompt: |-
  I recently moved from a software engineering role into a newly created People Analytics position at my company (roughly 900 employees, split mainly across Engineering, Sales, Customer Support, and Marketing), and I've run into a problem I don't yet have the statistical vocabulary to handle with full confidence. Last year we piloted a voluntary mentorship program, the "Career Accelerator," and when I pulled eighteen-month promotion outcomes, participants had been promoted at a noticeably higher rate than non-participants company-wide (about 35% versus 28%). Leadership is ready to roll the program out to everyone on the strength of that headline number. When a friend from my old statistics program asked me to break the same numbers down by department, though, the comparison reversed in all four: within Engineering, Sales, Support, and Marketing alike, non-participants were promoted at an equal or higher rate than participants. Sales, which happens to be both our largest department and by far the most enthusiastic adopter of the program, also has the fastest promotion cycle of the four for reasons that have nothing to do with the program itself, and that combination alone seems to be enough to flip the company-wide comparison even though the program looks neutral-to-harmful within every department taken on its own.

  My friend tells me this is a textbook instance of Simpson's paradox, and I've since read enough about its classic illustrations (the 1973 Berkeley admissions data, the kidney-stone treatment study) to follow the mechanics of the reversal itself. What I haven't found is guidance aimed at someone in my actual situation: our analytics team is three people, none of us formally trained statisticians, we cannot realistically randomize most of the programs we're asked to evaluate, and leadership wants a clear recommendation rather than a statistics lecture. Could you describe the most important implications of Simpson's paradox for how a team like ours should design, report on, and interpret evaluations such as this one going forward? I'd especially value your thoughts on how we might decide which variables are even safe to stratify by in the first place, since it occurs to me that slicing the data along every dimension we can think of might introduce its own distortions rather than resolve the one we've already found.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User Profile:** Former software engineer, now in People Analytics (PA). Not a trained statistician but has some background (friend from stats program). Part of a small team (3 people).
      *   **Company Context:** ~900 employees. Depts: Engineering, Sales, Support, Marketing.
      *   **The Problem:** Evaluated a mentorship program ("Career Accelerator").
      *   **The Data:**
          *   Aggregate: Participants (35% promoted) > Non-participants (28% promoted).
          *   Stratified (by Dept): Participants $\le$ Non-participants in *all* four departments.
          *   Key Confounder: Sales is large, has high adoption, and has naturally high promotion rates (unrelated to program).
      *   **The Diagnosis:** Simpson's Paradox (confirmed by user and friend).
      *   **The Constraint:** Leadership wants a clear recommendation, not a stats lecture. No randomization possible (observational data). Small team capacity.
      *   **The Ask:** Implications for design, reporting, and interpretation of evaluations. Specifically: How to decide which variables to stratify by (avoiding over-stratification/distortion).

  2.  **Deconstruct the Statistical Phenomenon (Simpson's Paradox):**
      *   *What is it?* A trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   *Why did it happen here?* Confounding variable (Department). Sales has high promotion rates *and* high participation. This weights the aggregate participant group heavily toward Sales, inflating the overall participant promotion rate.
      *   *Causal Inference:* The aggregate number implies causation (Program $\to$ Promotion). The stratified numbers suggest the correlation is spurious due to the confounder. The "truth" is likely closer to the stratified view (Program has little to no effect, or potentially negative).

  3.  **Address the Core Questions:**
      *   **Implications for Design:** Need to think about confounders *before* data collection/analysis. Need better baseline data.
      *   **Implications for Reporting:** Don't lead with the aggregate. Explain the "why." Visualize the stratification.
      *   **Implications for Interpretation:** Causal claims are dangerous in observational data.
      *   **The "Which Variables to Stratify" Question:** This is the crux of causal inference (DAGs, confounders vs. colliders).

  4.  **Drafting the Advice - Section by Section:**

      *   **Validation & Empathy:** Acknowledge the difficulty. It's a classic trap. Validate that their instinct to dig deeper was correct.
      *   **The "So What?" for Leadership:** Translate stats to business impact. The program likely doesn't work as advertised. Rolling it out broadly might be a waste of resources or even harmful (opportunity cost).
      *   **Causal Inference Basics (without the jargon):**
          *   Observational data $\neq$ Experimental data.
          *   Selection Bias: Who chooses to join? (High performers? Sales people?)
          *   Confounding: Department is a confounder.
      *   **Stratification Strategy (The "Which Variables" question):**
          *   *Confounders:* Variables that affect *both* participation and outcome. (Dept, Tenure, Performance Rating). **Stratify/Control for these.**
          *   *Colliders/Mediators:* Variables caused by the treatment or outcome. **Do NOT stratify.** (e.g., if the program leads to "visibility," don't control for visibility).
          *   *Practical Heuristic:* "Would this variable exist even if the program didn't?" (Pre-treatment variables).
      *   **Reporting Framework:**
          *   Lead with the stratified truth, not the aggregate lie.
          *   Use visualizations (forest plots or grouped bar charts).
          *   Qualitative context (why does Sales promote faster?).
      *   **Future Design:**
          *   Propensity Score Matching (PSM): Too complex for a 3-person team maybe? Mention it as a "next level" tool but keep it simple for now.
          *   Pilot Design: Try to get closer to randomization (lottery system if oversubscribed).
          *   Baseline Metrics: Measure performance *before* the program.
      *   **The Recommendation:** Do not roll out broadly yet. Run a controlled pilot or fix the selection bias.

  5.  **Refining the "Which Variables" Advice (Crucial Step):**
      *   The user asked: "slicing the data along every dimension... might introduce its own distortions." This is a very insightful concern (Multiple Comparisons Problem / p-hacking / Collider Bias).
      *   *Advice:* Only stratify by **Pre-Treatment Covariates**.
      *   *Rule of Thumb:* Did this characteristic exist *before* they signed up for the mentorship?
          *   Department? Yes. (Stratify)
          *   Tenure? Yes. (Stratify)
          *   Prior Performance Rating? Yes. (Stratify)
          *   "Engagement Score" measured *during* program? No. (Mediator/Collider)
          *   "Manager Support" measured *after* sign-up? No. (Could be influenced by sign-up).
      *   *Warning:* Don't slice too thin (small sample sizes).

  6.  **Tone Check:**
      *   Needs to be professional, actionable, and empathetic to the "non-statistician" constraint.
      *   Avoid heavy math formulas. Use causal diagrams (DAGs) conceptually.
      *   Focus on business risk.

  7.  **Final Review against User Prompt:**
      *   *Implications for design/reporting/interpretation?* Covered.
      *   *Which variables are safe to stratify?* Covered (Pre-treatment confounders).
      *   *Leadership wants clear recommendation?* Provide a script/talking points.
      *   *Small team constraints?* Keep methods practical (stratification > complex modeling).

  8.  **Self-Correction/Edge Case:**
      *   *Wait, is it possible the program is harmful?* The data says non-participants did equal or better. It's possible high performers don't *need* the program, or the program takes time away from work. I should mention the "opportunity cost."
      *   *Is Simpson's Paradox always the truth?* Usually, the stratified version is closer to the causal truth *if* you've stratified by the right confounders. I need to emphasize that Department was the *right* variable to split by.
      *   *Sample Size:* 900 employees split into 4 depts, then into participants/non-participants. Some cells might be small. I should warn about statistical significance/noise in small subgroups.

  9.  **Final Polish:** Organize with clear headings. Create a "Executive Summary" vibe for the leadership section. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Don't do it." I need to explain *how* to evaluate it properly. Propensity Matching might be too hard for a team of 3 without stats training. I'll suggest it as a "phase 2" but focus on "Pre-treatment Stratification" as the immediate fix. I also need to explicitly address the "slicing along every dimension" fear—that's the Multiple Comparisons problem, but in causal inference, it's more about Collider Bias. I will distinguish between "fishing for significance" and "controlling for confounders."

  10. **Final Structure:**
      *   Validation (You found the truth).
      *   The Leadership Conversation (The "Ask").
      *   The "Which Variables" Rule (Pre-treatment Confounders).
      *   Designing Future Evaluations (Baselines, Selection Bias).
      *   The Risk of Over-Stratification (Small N, Colliders).
      *   Summary Checklist.

  (Ready to write.)
answer: |-
  This is a remarkably sophisticated catch for someone new to People Analytics. You have correctly identified that the aggregate number is misleading and that the stratified data tells the causal story. Your friend is right: this is Simpson's Paradox.

  However, your intuition is also correct that simply telling leadership "Actually, it's Simpson's Paradox" will not land well. They care about ROI, not statistical paradoxes.

  Here is a practical framework for your team of three on how to handle this specific situation, how to choose variables for stratification in the future, and how to design evaluations that resist these distortions without requiring a PhD in econometrics.

  ### 1. The Leadership Recommendation: Translate Stats to Risk
  Leadership wants to know if they should invest more money in this program. Based on your data, the answer is likely **no**, or at least **not yet**.

  The aggregate data suggests the program *causes* promotions. The stratified data suggests the program is correlated with promotions only because high-promotion departments (Sales) like the program more.

  **How to frame this to leadership:**
  Do not lead with "Simpson's Paradox." Lead with **Selection Bias** and **Baseline Differences.**

  *   **The Narrative:** "Our initial look suggested a 7% lift in promotions. However, deeper analysis shows this was driven by departmental differences, not the program itself. Sales, which promotes fastest naturally, also joined the program most frequently. When we compare employees within the same department, the program shows no measurable benefit to promotion rates."
  *   **The Risk:** "Rolling this out company-wide based on the aggregate number would be an allocation error. We risk investing budget in a program that doesn't drive outcomes, while distracting high performers with mandatory mentorship that may not be the bottleneck for their growth."
  *   **The Recommendation:** "Pause the broad rollout. We recommend redesigning the pilot to control for department and tenure, or running a lottery-style pilot where we can compare accepted vs. rejected applicants to get a true causal measure."

  ### 2. The "Which Variables" Question: The Pre-Treatment Rule
  You asked a critical question: *"Slicing the data along every dimension... might introduce its own distortions."*

  You are absolutely right. In statistics, this is the risk of **Collider Bias** (conditioning on a variable caused by both the treatment and the outcome) or simply **p-hacking** (slicing until you find significance).

  For a small PA team, you need a heuristic to decide which variables are "safe" to stratify by. Use the **Pre-Treatment Rule**:

  **Only stratify or control for variables that existed *before* the employee signed up for the program.**

  *   **Safe Variables (Confounders):**
      *   **Department:** Existed before sign-up. (As you found, this was the culprit).
      *   **Tenure:** Existed before sign-up. (Senior people might be more likely to sign up *and* more likely to be promoted).
      *   **Prior Performance Rating:** Existed before sign-up. (High performers might self-select into the program).
      *   **Location/Remote Status:** Existed before sign-up.
  *   **Unsafe Variables (Mediators/Colliders):**
      *   **"Engagement Score" during the program:** This is caused by the program. Controlling for this hides the program's effect.
      *   **Manager Support (measured mid-program):** The program might *cause* the manager to be more supportive. If you control for this, you remove the program's mechanism of action.
      *   **Skills Gaps identified *in* mentorship:** This is an output of the program, not an input.

  **Why this works:** In causal inference, you want to block "backdoor paths" (confounders) without blocking the "frontdoor path" (the actual effect of the program). Pre-treatment variables are almost always confounders. Post-treatment variables are often mediators.

  ### 3. Designing Future Evaluations (Without Randomization)
  Since you cannot easily randomize (e.g., forcing half the company into mentorship), you must move from **Observational** analysis to **Quasi-Experimental** design.

  **A. Establish a Baseline (The "Delta" Approach)**
  Don't just measure *Promotion Rate*. Measure *Change in Trajectory*.
  *   Did the participant's promotion velocity increase *relative to their own past* compared to a similar non-participant?
  *   *Metric:* Time-to-promotion before program vs. time-to-promotion after program, compared against a control group.

  **B. The "Propensity" Heuristic (Simplified)**
  You likely don't have the bandwidth for full Propensity Score Matching (PSM), but you can apply the logic manually.
  *   When evaluating the program, construct a **Control Group** that looks like the **Treatment Group**.
  *   If 80% of participants are from Sales, your control group of non-participants should not be "Everyone Else." It should be "80% Sales, 20% Other."
  *   If 70% of participants had a "Exceeds" rating last cycle, your control group should match that.
  *   *Actionable Tip:* Create a "Lookalike Cohort" for every pilot. If you can't match them perfectly, report the mismatch explicitly as a limitation.

  **C. The Lottery Method (For Oversubscribed Programs)**
  If the program is popular, this is your golden ticket for causal data.
  *   If you have 100 spots and 200 applicants, **randomly select** the 100 participants.
  *   The 100 rejected applicants become your perfect control group. They wanted the program (same motivation) but didn't get it.
  *   Any difference in outcomes between these two groups is causal. Leadership loves this because it sounds fair and scientific.

  ### 4. Reporting Standards to Prevent Future Paradoxes
  To protect your team from presenting misleading aggregates in the future, adopt these three reporting standards:

  1.  **The "Small N" Warning:**
      When you stratify by Department, your sample sizes shrink. If Engineering only had 5 participants, a single promotion swings the percentage wildly.
      *   *Rule:* If a subgroup has $<30$ people, do not report a percentage. Report the raw count or suppress the data.
      *   *Report:* "In Engineering, 2/5 participants promoted vs 50/200 non-participants." (This visually signals the noise).

  2.  **Weighted Averages vs. Simple Aggregates:**
      When reporting company-wide numbers, consider weighting the departments equally rather than by headcount, or explicitly state: "Company-wide average is heavily weighted by Sales volume."
      *   Better yet, stop reporting "Company-Wide" averages for programs that vary by function. Report the **Range** (e.g., "Promotion lift ranged from -2% in Support to +5% in Engineering").

  3.  **The "Null Hypothesis" Default:**
      Train your leadership to assume **no effect** until proven otherwise.
      *   Instead of "The program increased promotions by 7%," say "We observed a 7% correlation, but after controlling for department, this effect disappears."
      *   This shifts the burden of proof to the program owners, which is appropriate for voluntary interventions.

  ### 5. Summary Checklist for Your Team
  For your next evaluation, run through this checklist before showing slides to leadership:

  *   [ ] **Confounder Check:** What pre-existing differences exist between participants and non-participants? (Dept, Tenure, Performance).
  *   [ ] **Stratification:** Have we broken the data down by those pre-existing differences?
  *   [ ] **Direction Check:** Does the trend hold in every subgroup, or does it flip? (If it flips, do not report the aggregate).
  *   [ ] **Sample Size:** Are the subgroups large enough to be meaningful?
  *   [ ] **Causal Language:** Have we removed words like "caused," "drove," or "impacted" and replaced them with "associated with" or "correlated with"?

  ### Final Thought
  You are in a high-leverage position. Most People Analytics teams simply report the aggregate dashboard numbers because it's easier. By catching this, you have saved the company from scaling a program that likely doesn't work (or at least doesn't work for the reason they think).

  Your recommendation to leadership should be: **"The data indicates that Department drives promotion rates, not the Mentorship Program. We recommend pausing the rollout to redesign the selection process, ideally using a lottery system for oversubscribed cohorts, so we can measure true impact."**

  That is clear, actionable, and statistically sound.
