answer: |-
  The hum of the Veritas scanner was the only sound in the studio, a low-frequency thrum that seemed to vibrate in Ren's teeth. On the easel before him stood *The Azure Void*, three years of labor, layers of oil and glaze capturing a light that didn't exist in nature. It was his masterpiece. It was also the kindling.

  Across the room, the Curator sat in the shadows, a tablet glowing in his lap. "The transfer is queued, Ren. One million credits. Ready to drop the second the light turns green."

  Ren stared at the canvas. The contract was simple, printed on heavy stock beside the scanner. *Party A agrees to provide funding. Party B agrees to hold sincere intent to incinerate Party A's commissioned work at 12:00 PM tomorrow.*

  There was no clause requiring the actual burning. The Curator didn't want the ash; he wanted the proof of surrender. The scanner didn't measure lies; it measured cognitive commitment. It looked for the neural pathways of a decision already made.

  "I can't do it," Ren said, his voice cracking.

  "You don't have to do it," the Curator corrected softly. "You only have to mean to do it. Tonight. While the money is still pending."

  Ren wiped sweat from his palms. This was the knot that had tightened in his gut for hours. To get the money, he had to intend the destruction. But intention was a bridge to action. Why would he build a bridge to a cliff he had no reason to jump off?

  Once the credits hit his account at 12:01 AM, the logic shifted. Tomorrow noon, he would be rich. *The Azure Void* would be his sole remaining asset of significant value. Burning it would be an act of pure loss. No gain, no audience, no purpose. A rational man keeps the painting.

  The scanner knew this. The scanner was built on game theory. It knew that if Ren was rational, he couldn't form the intent. If he couldn't form the intent, the money wouldn't release. If the money didn't release, he remained broke.

  "Try again," the Curator said. "Stop thinking about tomorrow. Think about now."

  Ren stepped up to the pedestal. He placed his hands on the sensors. He closed his eyes and tried to summon the image of the match striking. He tried to feel the heat, smell the burning linen. He tried to convince himself that the act of destruction was more important than the object destroyed.

  *I will burn it,* he thought. *I promise.*

  But beneath the thought, the calculation ran cold and automatic. *Once I have the money, burning it is stupid. Therefore, I won't burn it. Therefore, I am lying.*

  The scanner's light remained a steady, mocking amber.

  "It's the payoff," Ren whispered, opening his eyes. "As soon as I have the cash, the reason to burn it evaporates. You're asking me to intend to act against my own future interests."

  "I'm asking you to be irrational," the Curator said. "Can you do that? Can you commit to a loss simply because the commitment itself has value?"

  Ren looked at *The Azure Void*. It looked back, silent and magnificent. If he lied to himself—if he somehow induced a temporary madness where he believed the burning was necessary—the light would turn green. He would get the million. Then, tomorrow, when the madness passed, he would keep the painting. He would have the money and the art.

  But the scanner didn't measure hope. It measured certainty. To trick the machine, he couldn't just hope he'd burn it; he had to know he would. He had to lobotomize his own rationality. He had to become the kind of person who destroys beauty for no reason, solely because he said he would.

  Could he change who he was, just for tonight?

  He looked at his hands on the sensors. He thought about the rent, the debts, the safety the money would buy. Then he thought about the painting, the only thing he'd ever made that felt true.

  "If I get the money," Ren said, "I'm not going to burn it. You know that. I know that."

  "Then you will remain poor," the Curator said, standing up. He didn't sound angry. He sounded like a man watching a physics experiment fail exactly as predicted. "The system rewards those who can bind their future selves. You are too free, Ren."

  The Curator moved toward the door. "I'll leave the scanner on. Midnight is in ten minutes. After that, the offer voids."

  The door clicked shut. Ren was alone with the hum and the painting. He looked at the amber light. He tried to force the intention again, trying to sever the link between consequence and action. He tried to want the ash more than the art.

  He squeezed his eyes shut and pushed against the wall of his own logic, straining to believe in a promise that offered no return. The light flickered, just once, teasing toward green, before settling back into the steady, hopeless amber.
