answer: |-
  This is a incredibly nuanced situation, and your disorientation is completely understandable. You are dealing with two layers here: the relational hurt (money, wedding) and the philosophical framework your brother is using to process it.

  To answer your core question directly: **Your brother is applying a profound philosophical concept in a way that is technically consistent with "Ultimate Truth" in Buddhism, but ethically inconsistent with "Conventional Truth" and the practical path of Buddhist practice.**

  In Buddhist circles, what he is doing is often called **"Spiritual Bypassing."** This is a term coined by psychologist and Buddhist practitioner John Welwood to describe using spiritual ideas and practices to sidestep or avoid facing unresolved emotional issues, psychological wounds, and unfinished developmental tasks.

  Here is a breakdown of where his philosophy is sound, where it is misapplied, and how you might navigate this.

  ### 1. The Philosophy: The Two Truths Doctrine
  Your brother is referencing *Anatta* (no-self). In Buddhism, this is the idea that there is no permanent, unchanging soul or ego. We are a flowing stream of aggregates (thoughts, sensations, perceptions).

  However, Buddhist philosophy relies on the **Doctrine of the Two Truths**:
  *   **Ultimate Truth:** On the deepest level, there is no fixed self, no fixed time, and no inherent existence of phenomena.
  *   **Conventional Truth:** In the relative world where we live, eat, pay taxes, and have relationships, "selves" do exist. Cause and effect (Karma) operate vigorously.

  **The Misapplication:**
  Your brother is using *Ultimate Truth* to solve a *Conventional Truth* problem.
  *   **Conventional Reality:** A person borrowed money and didn't pay it. A person missed a wedding and caused pain. These are causal events in the relative world.
  *   **Ultimate Reality:** Yes, the "self" is empty.

  If you use Ultimate Reality to dismiss Conventional Reality, you negate the law of Karma. Buddhism teaches that even if the self is empty, **actions have consequences.** The suffering he caused you is real in the conventional realm. To deny that suffering because "the self isn't real" is actually a subtle form of ego-protection. It protects *him* from the discomfort of shame or guilt, rather than alleviating *your* suffering.

  ### 2. The Ethics: Compassion over Correctness
  The goal of Buddhist practice is not just intellectual understanding of emptiness; it is the cultivation of *Karuna* (compassion) and the reduction of suffering for all beings.

  If his practice were fully integrated, the realization of "no-self" would likely make him *more* sensitive to your pain, not less. Why? Because if there is no separation between self and other, your hurt is his hurt. A mature practitioner usually becomes hyper-responsible for their impact on others because they understand interconnectedness.

  By saying, "The me who hurt you doesn't exist," he is prioritizing his philosophical correctness over your emotional reality. In many Buddhist traditions, this would be seen as a sign that the practice has been understood intellectually but not yet embodied ethically.

  ### 3. Spiritual Bypassing
  This is the key concept for you to know. Spiritual bypassing happens when we use spirituality to avoid the messy work of being human.
  *   **Real Healing:** "I see that my past actions caused you pain. I have changed, but I acknowledge that impact and I am sorry."
  *   **Bypassing:** "The past is an illusion and so is the self, so your pain is based on a misconception."

  The fact that he was sincere suggests he isn't trying to manipulate you maliciously. He likely genuinely believes this is the "higher" way to look at it. He may think he is offering you a gift by trying to liberate you from your attachment to the past. But in doing so, he is invalidating your experience.

  ### 4. How to Respond
  You don't need to become a Buddhist scholar to push back on this. You can meet him on the level of the relationship, which is the "Conventional Truth" level where your relationship actually lives.

  **Validate his growth, but hold the boundary.**
  You can acknowledge his transformation without accepting his philosophical dismissal of your hurt.

  *   **What you might say:** "I am so proud of the work you've done and the stability you've found. I respect your practice deeply. But in our relationship, which exists in the everyday world, I am still dealing with the impact of what happened. I'm not asking you to dwell in the past, but I need an acknowledgment of the impact to feel safe moving forward. Can we honor both your growth and my hurt?"

  **Reframe the Apology.**
  He might feel that an apology reinforces the "fixed self" he is trying to transcend. You can explain that an apology isn't about cementing identity; it's about clearing the air.
  *   **What you might say:** "An apology isn't about labeling you a 'bad person.' It's just about acknowledging that harm occurred. In your practice, isn't acknowledging suffering the first step to ending it?"

  ### Summary
  Is he onto something real? **Yes.** The concept of no-self is real and profound.
  Is he missing something important? **Yes.** He is missing the integration of that concept into ethical human relationships. He is using a sledgehammer (Ultimate Truth) to crack a nut (interpersonal repair), and in the process, he's smashing the table you're sitting at.

  True spiritual maturity usually looks like more humility and more accountability, not less. It is reasonable for you to ask for a "conventional" apology within the context of your "conventional" relationship, even if he identifies as someone who has transcended the self. You can respect the monk in him while still asking for accountability from the brother.
