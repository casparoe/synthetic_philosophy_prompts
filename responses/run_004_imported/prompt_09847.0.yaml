  2.  **Deconstruct Galen Strawson's "Basic Argument":**
      *   *What is it?* It's an argument for the *impossibility* of ultimate moral responsibility (UMR).
      *   *The Core Regress:* To be responsible for an action, you must be responsible for the mental state/character that produced it. To be responsible for *that*, you must have chosen it based on an earlier mental state. This leads to an infinite regress.
      *   *Crucial Point:* Does it assume determinism?
          *   Standard interpretation: No. It's often called the "Impossibilist" argument. It claims responsibility is impossible *whether determinism is true or false*.
          *   Why? Because indeterminism (randomness) doesn't help you *control* your character. If my choices are random, I'm not responsible for them either.

  3.  **Evaluate Theo's Objection (The "Quantum Card"):**
