      *   **Point 3: The Regress Still Holds.** Even with indeterminism, to shape your character, you need principles to do the shaping. Where did those principles come from? If they came from you, we regress. If they came from randomness/genetics/environment, you didn't choose them.
      *   **Point 4: Why Philosophers Still Care.** Because it highlights the condition of "Ultimate Responsibility" (Dennett's term often used here too). It shows that the intuitive notion of "being the ultimate source of oneself" is incoherent, not just physically unlikely.

