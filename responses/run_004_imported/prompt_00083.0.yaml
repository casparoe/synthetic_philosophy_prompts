answer: |-
  This is one of the sharpest objections to Updateless Decision Theory (UDT), and it cuts to the heart of the tension between *time-slice rationality* (what makes sense for me right now, given what I know now) and *diachronic rationality* (what makes sense for me as a persisting entity over time).

  You are right to reject the standard "ex ante expected value" justification if it is presented as a utilitarian calculus across possible worlds that the agent doesn't actually inhabit. If the argument is merely, "You should pay the mugger because the version of you in the other branch gets money," the updated agent in the tails branch correctly replies: "I am not that version. I am in the tails branch. That money is gone. Why should I sacrifice my actual utility for a ghost?"

  To defend UDT without begging the question, we cannot appeal to a "view from nowhere" that aggregates utility across branches. Instead, we must argue that the **updated, in-the-moment self is making a category error about the nature of its own agency and the nature of the information it has received.**

  Here is the strongest case for why the updated self should regard the prior commitment as authoritative, grounded not in ensemble averaging, but in **logical control**, **constitutive identity**, and **epistemic coherence**.

  ### 1. The Argument from Logical Control (Not Causal Control)

  The standard objection assumes that the decision happens *after* the coin flip (or the prediction). In the Counterfactual Mugging, once you know the coin is tails, you think the outcome is fixed: Omega didn't give you the money in the heads branch, so your action now cannot change that.

  However, UDT posits that your decision is not an event in time that happens *after* the logical facts are settled. Your decision is the evaluation of a logical function.

  *   **The Setup:** Omega predicts what you *would* do. Omega's prediction is a logical consequence of your decision algorithm (your source code).
  *   **The Error:** The updated self thinks, "I am now executing line 405 of the code, and I see `coin = tails`." It assumes it can choose `action = defect` at line 405 without affecting line 1 (the prediction).
  *   **The Correction:** You cannot change line 405 without changing the function itself. If your algorithm outputs "defect" when `coin = tails`, then the function *is* `f(tails) = defect`. Omega, simulating that function, saw `defect`.

  The authority of the prior commitment comes from the fact that **you do not have the power to deviate from it without ceasing to be the agent that was predicted.**

  From the perspective of the moment, it *feels* like you have the freedom to switch. But in logical decision problems, your "freedom" is the freedom to select which logical truth holds about your algorithm. If you choose to defect now, you are not "breaking a promise" to your past self; you are making it the case that **you were never the type of agent who would have been rewarded.**

  The updated self should honor the commitment not because it cares about the other branch, but because **its current action determines the truth value of the past prediction.** There is no temporal asymmetry in logical dependence. Your action *now* is logically upstream of Omega's prediction *then*. To ignore the commitment is to act under the illusion that you can change the output of a function without changing the function.

  ### 2. The Argument from Constitutive Identity (The "Who" Question)

  Your worry presupposes a distinction between the "Prior Self" (who made the commitment) and the "Updated Self" (who is considering breaking it). It frames the conflict as: *Why should Updated Self obey Prior Self?*

  The UDT response is: **They are not two different agents negotiating a treaty. They are the same algorithm instantiated at different times.**

  If you grant that rational agency requires diachronic coherence, then "rationality" is not a property of a time-slice; it is a property of the trajectory. If you allow your decision procedure to be hijacked by indexical information (information about *where* or *when* you are in the decision tree) that is logically correlated with the outcome, you are effectively fragmenting your agency.

  Consider the alternative: If the Updated Self is authorized to ignore the Prior Self's policy whenever local utility maximization dictates, then the "agent" is not a unified entity. It is a sequence of distinct time-slices, each optimizing locally.

  *   **The Consequence:** If you are a sequence of time-slices, Omega (who predicts agents, not time-slices) could not have predicted *you* successfully in the first place. Omega predicts a *policy*.
  *   **The Dilemma:** Either you are a unified agent with a stable policy, or you are a collection of time-slices.
      *   If you are a collection of time-slices, you never qualified for the reward in the heads branch, so you have nothing to lose by defecting now (but also nothing to gain).
      *   If you are a unified agent, then the "Updated Self" does not have the authority to unilaterally rewrite the policy, because the policy is what defines the unity.

  The authority of the prior commitment is **constitutive**. It is what makes you an agent capable of being predicted. To reject it is to engage in a performative contradiction: you are using the agency granted by a stable policy to undermine the stability of that policy.

  ### 3. The Argument from Epistemic Humility (The "Information" Objection)

  The Updated Self justifies deviation by saying, "I have new information (the coin is tails) that the Prior Self didn't have." This suggests the Prior Self was epistemically inferior.

  But in UDT problems, this "new information" is often **logically toxic**.

  In standard Bayesian updating, we assume the evidence is independent of the hypothesis we are testing, or at least that the causal structure is fixed. In Newcomb-like problems, the "evidence" (e.g., seeing the box is empty, or knowing the coin is tails) is **logically entangled** with your decision procedure.

  *   When you learn "Coin = Tails," you are not just learning a fact about the world. You are learning a fact about the branch of the logical function you are evaluating.
  *   If you update on this information to defect, you are treating the coin flip as an external event that happened *to* you.
  *   But for the purposes of the decision problem, the coin flip is a parameter *passed to* your function.

  The Prior Self didn't "lack" information; the Prior Self correctly recognized that **indexical information (which branch I am on) is not the right variable to condition on when choosing a policy.**

  The Updated Self should regard the Prior Self's refusal to update not as ignorance, but as **higher-order epistemic sophistication.** The Prior Self realized that conditioning on "I am in the tails branch" screens off the logical correlation that makes the reward possible. The Updated Self, by conditioning on that very fact, is falling into an epistemic trap. It is treating a logical parameter as an empirical observation.

  Therefore, the Updated Self should defer to the Prior Self not out of obedience, but because the Prior Self's epistemic stance (updatelessness) was the only one capable of correctly modeling the logical structure of the situation. The Updated Self's "local optimization" is based on a flawed causal model that ignores the logical link between its output and the prediction.

  ### 4. The Reflexive Endorsement Argument

  Finally, let's address the "authority" question directly. Why *ought* the Updated Self listen?

  Imagine the Updated Self asks: "What policy do I wish I had?"

  If the Updated Self is rational, it must acknowledge that it only exists in this situation (with the option to pay the mugger) because a specific policy was in place.
  *   If the policy was "Pay if Tails," the Updated Self exists in a world where (potentially) the Heads-branch reward was secured.
  *   If the policy was "Don't Pay if Tails," the Updated Self exists in a world where the Heads-branch reward was never available.

  Crucially, the Updated Self cannot say, "I wish I had the policy 'Don't Pay', *but also* that Omega had predicted 'Pay'." That is a logical impossibility.

  So, the Updated Self faces a choice between two coherent packages:
  1.  **I am a Payer:** I pay now, and I am the kind of agent who gets the big reward in the counterfactual.
  2.  **I am a Defector:** I keep my money now, and I am the kind of agent who never gets the big reward.

  The "authority" of the prior commitment is simply the **reflexive endorsement of the package that yields the better outcome.** The Updated Self doesn't submit to the Prior Self; the Updated Self recognizes that **its own identity is tied to the policy.** To defect is to choose Package 2. To cooperate is to choose Package 1.

  Since the Updated Self prefers Package 1 (getting the big reward in the counterfactual is a property of the agent type it identifies with), it must follow the policy. It is not obeying a past command; it is **voting for the type of agent it is.**

  ### Summary: The Dissolution of the Conflict

  The tension you feel arises because you are viewing the Prior Self and Updated Self as two different agents with conflicting interests, separated by time and information.

  The UDT defense dissolves this distinction:
  1.  **Logically:** Your current action determines the past prediction (Logical Control).
  2.  **Metaphysically:** You are a single algorithm, not a sequence of time-slices (Constitutive Identity).
  3.  **Epistemically:** Updating on indexical information destroys the logical correlations necessary for the payoff (Epistemic Humility).
  4.  **Normatively:** You prefer to be the type of agent who follows the policy, even in this branch (Reflexive Endorsement).

  The Updated Self should not view the commitment as an external constraint imposed by the Past. It should view the commitment as the **logical structure of its own agency.** To deviate is not to exercise freedom; it is to malfunction. The "authority" is not moral or temporal; it is structural. You follow the updateless policy because that is what it *means* to be the agent who wins.
