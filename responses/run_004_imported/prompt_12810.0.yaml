          *   *Rebuttal to Marcus (Eye Color):* "No victim" doesn't mean "all selection is equal." We can distinguish HD vs. eye color on other grounds (harm prevention vs. preference), even if no specific victim exists in either case.
          *   *Rebuttal to Marcus (Embryos in Dish):* Physical existence in a dish doesn't confer personhood or moral status change. The logical structure remains: no subject exists to be harmed.

      *   **Marcus's Position (Critical of Selection/Intuition Focus):**
