      *   **Context:** The user's cousin and her husband are using IVF with Preimplantation Genetic Testing (PGT) to avoid passing on Huntington's Disease (HD).
      *   **The Conflict:** At a baby shower, two guests (Dana, a philosophy PhD candidate, and Marcus, a family friend with an HD-affected brother) argued about the ethics of this.
      *   **The Task:** Analyze their exchange move-by-move, evaluate who has the better of each point, and identify if there's a deeper question they are talking past.
