          *   *Reasoning 1 (Slippery Slope/Consistency):* If "different individual" justifies everything, you could screen for eye color. Since eye color screening feels wrong/trivial, the logic must be flawed or incomplete.
          *   *Reasoning 2 (Simultaneous Existence):* Standard Non-Identity is about conceiving *later* vs. *now*. Here, two embryos exist *now*. Picking between two existing entities feels different than deciding whether to create one.
          *   *Rebuttal to Dana (Parfit's Principle):* Parfit himself admitted Non-Identity doesn't solve everything; he needed the "No-Difference Principle" or a theory of impersonal harm (Total vs. Average Utilitarianism) to explain why causing suffering is bad even if no specific person is worse off. Dana is using "no victim" to shut down the debate, but the debate is about *impersonal* badness.

  3.  **Evaluate Move-by-Move:**

