answer: |-
  Here are eight to ten questions designed for a colloquium setting. They are structured to prevent the speaker from retreating into standard introductory examples (like the frog) and instead press on the theoretical machinery of the Millikanian tradition. Each includes a follow-up tailored to the specific defensive maneuver most common in this literature.

  ### 1. The Swampman Challenge (Historical Essentialism)
  **Question:** Davidson's Swampman is a molecule-for-molecule duplicate of a human being but lacks any evolutionary or learning history. Your view seems committed to the claim that Swampman has no representational states and thus no thoughts, at least initially. This preserves the theory's consistency, but it comes at a high intuitive cost: Swampman behaves exactly as if he is reasoning, planning, and referring. If we grant that Swampman lacks content, are we not forced to say that the *causal role* a state plays in reasoning is irrelevant to its status as a thought? How do you reconcile the intuition that reasoning is an internal process with the claim that content is entirely extrinsic history?

  **Follow-up (Anticipating the "No Content" Bullet-Bite):** You will likely maintain that Swampman indeed lacks content until he establishes a history of use. But if Swampman can successfully navigate the world, communicate with us, and infer new truths from old ones *without* content, what explanatory work is the teleosemantic content actually doing? If the cognitive machinery runs perfectly without it, does "content" risk becoming an epiphenomenal label we apply only after the fact, rather than a constituent of the cognitive process itself?

  ### 2. The Disjunction Problem (Consumer-Side Determination)
  **Question:** A classic objection is that a frog's snap mechanism is triggered by flies, but also by BBs, shadows, or specks of dust. Why is the content "fly" rather than the disjunction "fly-or-BB-or-speck"? In the biosemantic tradition, the answer usually points to the *consumer* system: the digestive system needs nutrition, not visual stimulation. But doesn't this conflate the *truth conditions* of the representation with the *success conditions* of the action? The consumer might benefit from a false representation (e.g., snapping at a BB) if that keeps the mechanism primed. Why does the consumer's biological need fix the *accuracy* of the producer's state rather than just the *utility* of the response?

  **Follow-up (Anticipating the "Consumer Proper Function" Move):** You might argue that the consumer's proper function is to respond only to flies. But how do we individuate that proper function without already presupposing what the producer represents? If we define the consumer's function as "responding to flies," haven't we just smuggled the content "fly" into the definition of the consumer to solve the problem for the producer? Does this not relocate the disjunction problem rather than solving it?

  ### 3. The Distality Problem (The Causal Chain)
  **Question:** Consider the causal chain leading to a perceptual state: there is the fly, the light reflecting off it, the retinal stimulation, the neural firing, and finally the reproductive fitness gained by eating. Selection favors the organism because of the fitness, but the mechanism is triggered by the retinal stimulation. What principled criterion stops the content from being "retinal pattern" or "gene propagation" instead of "fly"? If selection is sensitive to the whole chain, why does the theory privilege the distal object (the fly) as the content rather than the proximal cause or the ultimate consequence?

  **Follow-up (Anticipating the "Mapping Relation" Move):** You will likely appeal to an isomorphic mapping relation between the internal state and the distal object that holds across variations in proximal causes. But isn't there also a stable mapping between the internal state and the retinal stimulation? What makes the distal mapping "special" or "intentional" in a way the proximal mapping isn't, other than the fact that the distal object is what we *want* the content to be? Does this selection of the mapping level rely on a prior intuition about what organisms represent?

  ### 4. Misrepresentation and "Normal Conditions"
  **Question:** Teleosemantics aims to naturalize error: a state misrepresents when it fails to perform its proper function. But this relies heavily on the notion of "normal conditions." If a mechanism fires in the absence of a fly, we call it a misrepresentation. But if that mechanism fires frequently enough in the absence of flies (say, in an environment full of BBs), doesn't the statistical norm shift? How do you define "normal conditions" without circularity? If "normal" just means "conditions under which the system represents correctly," the theory is circular. If "normal" means "statistically frequent," then error becomes impossible in a chaotic environment. Which is it?

  **Follow-up (Anticipating the "Normative vs. Statistical" Distinction):** You will likely insist that "normal" is normative (based on historical success), not statistical. But if the environment changes permanently so that the old mechanism no longer yields success, at what point does the proper function update? If the function is fixed by history, the organism is permanently misrepresenting its new environment. If the function updates, on what timescale does history get overwritten? Is there a principled way to determine when a malfunction becomes a new function without appealing to our own interpretive intuitions?

  ### 5. The "Shell Game" Charge (Circularity of Function)
  **Question:** A critic might argue that teleosemantics is a shell game: to explain representation, you appeal to "proper function," but to identify a proper function, you often have to identify what the system is *supposed* to detect or represent. When we say a heart's function is to pump blood, we aren't attributing content. But when we say a neuron's function is to detect a fly, aren't we already using the representational vocabulary we're trying to explain? How do you cash out "selected to detect" in purely physical or biological terms that don't implicitly rely on the notion of "information" or "correlation" that already carries semantic baggage?

  **Follow-up (Anticipating the "Direct vs. Derived Function" Move):** You may distinguish between direct proper functions (biological traits) and derived proper functions (artifacts/words). But for the basic biological cases, doesn't the description of the selection history require us to describe the *environmental condition* that conferred fitness? And isn't describing that condition (e.g., "presence of a predator") already a semantic description? If the selection story cannot be told without semantic terms, hasn't the naturalization project failed to reduce the semantic to the non-semantic?

  ### 6. The Normativity Gap (Survival vs. Truth)
  **Question:** Teleosemantics grounds semantic norms (truth/falsity) in biological norms (fitness/malfunction). But evolution selects for survival, not truth. A false belief can be highly adaptive (e.g., overestimating the number of predators), and a true belief can be maladaptive (e.g., knowing the exact temperature of a fire but freezing in fear). Why should we expect the content fixed by selection to align with *truth conditions* rather than *success conditions*? If the two come apart, does your theory imply that the adaptive false belief is actually *true* because it fulfills the biological function?

  **Follow-up (Anticipating the "Correlation in Normal Conditions" Move):** You might argue that in normal conditions, the state correlates with the truth. But if the biological norm is the ground of the semantic norm, and the biological norm is survival, then survival is the ultimate truth-maker. If you deny this, you seem to be positing a gap between biological function and semantic content. If you accept it, you risk making truth relative to fitness. How do you secure a notion of truth that allows for the possibility that our cognitive systems systematically misrepresent reality despite being evolutionarily successful?

  ### 7. Derived Functions and Human Learning
  **Question:** Millikan's account works well for innate frog mechanisms. But human concepts like "quantum entanglement" or "inflation" are not selected for directly by evolution; they are learned. You account for this via "derived proper functions" grounded in language use. But doesn't this push the problem back to the language community? For the community to confer derived functions, they must already have representational states with content. Doesn't this lead to a regress where we need a base level of contentful agents to confer content, undermining the claim that teleosemantics explains the *origin* of content from non-contentful beginnings?

  **Follow-up (Anticipating the "Language Games as Biological Adaptations" Move):** You will likely argue that language use itself is a biological adaptation with direct proper functions. But the specific content of "inflation" is not biological. If the content depends on the conventions of the community, and those conventions are arbitrary, how does the biological history of the *capacity* for language fix the content of *specific* concepts? Does the theory ultimately rely on a causal-historical theory of reference for learned concepts, making the teleological component redundant for the human case?

  ### 8. Historical Indeterminacy
  **Question:** Evolutionary history is messy. Traits are often exaptations: a feature selected for one purpose is co-opted for another. A neural mechanism might have been selected for motion detection in ancestors but is now used for reading text. Which selection event fixes the content? The original one or the most recent stabilizing one? If it's the most recent, how recent must it be? If it's the original, then much of human cognition would be misrepresenting constantly. How does the theory handle traits where the selection history is ambiguous or continuous rather than discrete?

  **Follow-up (Anticipating the "Stabilizing Function" Move):** You may appeal to the most recent "stabilizing" function. But stabilization is a matter of degree. In a rapidly changing cognitive environment (like human culture), functions may never fully stabilize in the biological sense. Does this imply that human conceptual content is inherently indeterminate or unstable in a way that frog content is not? If so, does this create a disunity in the theory of mind between humans and other animals that naturalism should avoid?

  ### 9. Synchronic Structure vs. Diachronic History
  **Question:** Consider a twin-earth scenario where a duplicate organism has a different history but identical current causal structure. Teleosemantics says they have different contents. But if the current causal structure determines how the organism behaves *now*, why does the history matter for the *current* explanation of behavior? If I want to predict what the organism will do next, does knowing its selection history add predictive power beyond knowing its current wiring? If not, is content really a factor in psychological explanation, or just a historical classification?

  **Follow-up (Anticipating the "Externalism about Content" Move):** You will affirm that content is external and history-dependent. But if two internally identical systems behave identically but have different contents, then content does not supervene on the physical states driving the behavior. Does this not make content causally inert in the immediate production of action? How can something that doesn't differ between the twins make a causal difference to their behavior, unless we abandon the causal efficacy of content altogether?

  ### 10. The Grain of Content
  **Question:** Biological selection is coarse-grained; it cares about nutrition, not species taxonomy. A frog is selected to eat nutritious bugs, not specifically *Musca domestica*. Why, then, should the content be "fly" rather than "nutritious bug" or "food"? The biological function seems to underdetermine the specific conceptual grain of the representation. How does the theory explain the specificity of content without attributing more conceptual sophistication to the organism than the selection history warrants?

  **Follow-up (Anticipating the "Specific Mapping" Move):** You might argue that the mapping relation is specific to the fly's visual properties. But selection doesn't care about the visual properties per se, only the nutrition. If the visual properties change but the nutrition remains, selection would favor tracking the nutrition. So why isn't the content "nutrition"? If you insist it is "fly," aren't you imposing a human categorical grain onto a biological process that operates at a different level of abstraction?
