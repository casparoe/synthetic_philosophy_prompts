answer: |-
  ```json
  {
    "ranking": [
      "Pratyaksa (Perception)",
      "Anumana (Inference)",
      "Sabda (Verbal Testimony)",
      "Upamana (Comparison)"
    ]
  }
  ```

  **1. Pratyaksa (Perception) — Least Disputed**
  Every school accepts perception as a valid source of knowledge, including the materialist Carvaka who reject all others. While schools debate the *mechanics* (e.g., Buddhists vs. Nyaya on whether conceptualization is part of perception), no major tradition denies its status as an independent pramana.

  **2. Anumana (Inference) — Less Disputed**
  Inference is accepted by all astika schools and Buddhist logicians, with the sole exception of the Carvaka, who argue that invariable connections (vyapti) cannot be perceived. Because even rivals like the Vaisesika and Buddhists retain it as one of their core two pramanas, its independent status is rarely reduced to something else.

  **3. Sabda (Verbal Testimony) — More Disputed**
  While accepted by Samkhya, Mimamsa, and Vedanta, Buddhist logicians and early Vaisesikas reduce testimony to a form of inference (inferring truth based on the speaker's reliability). It survives the cut from four pramanas to three (in Samkhya), but is often the first to be eliminated when moving from three to two.

  **4. Upamana (Comparison) — Most Disputed**
  This is the most vulnerable category; Samkhya explicitly excludes it from their list of three, and Buddhists reduce it to either verbal testimony or inference regarding name-object relations. It is generally the first pramana dropped when rival schools attempt to simplify the Nyaya system, making its independent status the most heavily contested.
