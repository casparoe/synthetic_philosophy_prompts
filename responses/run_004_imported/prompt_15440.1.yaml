prompt: |-
  Hey — I'm the ethics professor who got roped into my state parole board's risk-tool advisory panel (mostly so they can say a philosopher signed off). We ran two competing actuarial tools on the same redacted case file and got 63% vs 21% chance of reoffending in three years for the same guy — not a bias thing, both use defensible, race-blind variables, they just build his comparison group differently (one matches him nationally on offense type and criminal-history score, the other locally on a tighter set including age and neighborhood). Both vendors insist their number is simply the correct probability for this individual. Half the panel wants to mandate whichever tool matches on more variables, since "more specific" sounds more accurate. The other half says theres no principled place to stop narrowing the match — match him on his birthday too and every "probability" collapses to 0 or 1 for a sample of one — so maybe handing commisioners one clean percentage was never coherent in the first place. I owe the panel a short memo by Thursday: give one concrete recommendation (adopt tool A, adopt tool B, drop both for clinical judgment, require a range instead of a point estimate, whatever), real reasons for it, and an honest crack at the best argument for whichever option you don't pick.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User:** Ethics Professor.
      *   **Role:** Member of a state parole board's risk-tool advisory panel (token philosopher, but clearly taking the role seriously).
      *   **Task:** Write a short memo to the panel by Thursday.
      *   **Problem:** Two actuarial risk assessment tools (ARATs) give wildly different probabilities (63% vs. 21%) for the *same* individual. Both claim to be race-blind and defensible. The difference lies in the reference class (national/broad vs. local/narrow).
      *   **Panel Conflict:** Half want "more variables = more accurate." Half argue "reference class problem" (narrowing down to $N=1$ makes probability meaningless).
      *   **Requirements:** One concrete recommendation, real reasons for it, and a steelman of the opposing view.
      *   **Tone:** Professional, philosophical but practical, concise (it's a memo), authoritative yet humble.

  2.  **Deconstruct the Core Ethical/Statistical Problem:**
      *   **The Reference Class Problem:** This is the heart of the issue (von Mises, Reichenbach). An individual belongs to infinite classes. Which one determines their probability?
      *   **The Illusion of Precision:** Point estimates (63% vs. 21%) imply a level of scientific certainty that doesn't exist in social science risk prediction.
      *   **Decision Theory:** Parole decisions are high-stakes. False positives (keeping someone in) vs. False negatives (releasing someone who reoffends).
      *   **Procedural Justice:** How the decision is made matters as much as the outcome. Transparency is key.

  3.  **Evaluate Potential Recommendations:**
      *   *Option A: Adopt Tool A (National).* Pros: Larger sample size, more stable. Cons: Less relevant to local context.
      *   *Option B: Adopt Tool B (Local).* Pros: Contextually relevant. Cons: Smaller sample size, higher variance, potential for local bias encoding.
      *   *Option C: Drop both for Clinical Judgment.* Pros: Human nuance. Cons: Humans are notoriously bad at statistical prediction, prone to bias, less consistent. (Ethically risky).
      *   *Option D: Require a Range/Interval + Qualitative Context.* Pros: Acknowledges uncertainty, avoids false precision, respects the reference class problem. Cons: Might be harder for commissioners to use (they want a number).
      *   *Option E: Use Neither as a Probability, Use as Risk Strata.* (Low/Med/High). Pros: Avoids the specific % fight. Cons: Still relies on the underlying tools.

      *Decision:* Option D (Require a Range/Interval + Context) is the most philosophically robust and practically honest approach. It directly addresses the "point estimate is incoherent" argument while still utilizing the actuarial data (better than pure clinical judgment).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose clearly. Acknowledge the discrepancy.
      *   **Recommendation:** Be bold. "Do not treat point estimates as objective probabilities." Recommend reporting risk *categories* or *ranges* and requiring a "reference class statement."
      *   **Rationale (The "Real Reasons"):**
          1.  *The Reference Class Problem:* Explain why $N=1$ probability is metaphysically shaky.
          2.  *False Precision:* 63% vs 21% isn't just error; it's model dependency. Presenting it as *the* truth is deceptive.
          3.  *Decision Hygiene:* Commissioners need to know *why* the number exists, not just the number.
      *   **The Steelman (The Best Argument Against):** Why might someone want the point estimate?
          1.  *Decision Efficiency:* Commissioners need clarity.
          2.  *Calibration:* One tool *might* actually be better calibrated, even if we don't know which.
          3.  *Accountability:* Numbers are easier to audit than ranges.
      *   **Closing:** Reiterate the ethical imperative.

  5.  **Refining the Tone:**
      *   Avoid overly academic jargon (keep it accessible to lawyers and commissioners).
      *   Maintain the persona of the ethics professor (principled but pragmatic).
      *   Ensure the "Thursday deadline" pressure is respected (keep it short).

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is "Require a range" specific enough?
      *   *Fix:* Make it specific. "Report risk strata (Low/Moderate/High) derived from both tools, alongside the reference class definition." Actually, let's go stronger: "Prohibit reliance on specific point estimates for individual cases."
      *   *Critique:* Did I address the "more variables" argument?
      *   *Fix:* Yes, in the reference class section. More variables $\neq$ better prediction if the sample size collapses.
      *   *Critique:* Is the steelman strong enough?
      *   *Fix:* Emphasize that *some* number is better than pure intuition, and paralysis by analysis is a real risk.

  7.  **Final Polish:** Check the word count and flow. Ensure the distinction between "epistemic uncertainty" and "aleatory uncertainty" is implied if not stated. (Decided to keep it simpler: "model uncertainty").

      *(Self-Correction on Recommendation)*: A range might still imply precision we don't have. A better recommendation is to **categorize** (Low/Med/High) and **disclose the reference class**. But the prompt asks for *one* concrete recommendation. Let's go with: **"Adopt a 'Risk Category' protocol rather than Point Estimates, requiring disclosure of the underlying Reference Class."** This bridges the gap. Actually, the prompt offers "require a range instead of a point estimate" as an option. That's a strong philosophical move. Let's stick with that but refine it to "Confidence Intervals + Reference Class Disclosure." No, that's too statistical. Let's go with: **"Mandate that tools report risk strata (e.g., 'High/Medium/Low') rather than point percentages, and require commissioners to document which reference class definition guided their weight."**
      *Wait, simpler is better.* The prompt asks for *one* concrete recommendation.
      *Recommendation:* **Reject point estimates for individual determinations. Require both tools to report risk strata (e.g., 'Above/Average/Below Average') relative to their specific reference class, and mandate that commissioners consider the divergence as a signal of epistemic uncertainty, not data error.**
      *Actually, let's look at the options provided in the prompt:* "adopt tool A, adopt tool B, drop both for clinical judgment, require a range instead of a point estimate, whatever".
      *Best Ethical Choice:* **Require a range (or strata) + Reference Class Disclosure.** This acknowledges the uncertainty.
      *Let's refine the recommendation to be actionable:* **"Prohibit the use of single-number point estimates in individual case files. Instead, mandate that vendors report risk as a range (e.g., 20–65%) or category, accompanied by a plain-language definition of the reference class used."**

      *Wait, one more thought:* The prompt says "Give one concrete recommendation."
      Okay, I will recommend: **Require a range/interval estimate coupled with explicit reference class disclosure, and train commissioners to treat divergent outputs as a feature (uncertainty) rather than a bug (error).**

      *Let's write it.*

  8.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Concrete recommendation? Yes.
      *   Real reasons? Yes (Reference class, false precision, moral agency).
      *   Steelman of opposing view? Yes (Decisional efficiency, calibration).
      *   Tone? Professional/Ethical.

      *(Self-Correction)*: Keep it tight. Professors can ramble. A memo needs to be punchy.

      *Revised Recommendation:* **Adopt a "Range and Reference" protocol: Vendors must supply confidence intervals, not point estimates, and commissioners must record which reference class definition they prioritized in the case notes.**

      *Actually, the strongest ethical move is to stop pretending we know the probability.*
      Recommendation: **Do not permit point estimates to be entered into the official record as 'the probability.' Require vendors to report risk strata (Low/Moderate/High) and mandate that commissioners treat conflicting outputs as a trigger for enhanced review, not a math problem to solve.**
      *Let's go with the "Range/Uncertainty" angle as it directly addresses the 63 vs 21 split.*

      *Okay, final plan:*
      1.  Header.
      2.  Recommendation: Ban point estimates for individual cases; require ranges/strata + reference class transparency.
      3.  Rationale: Reference class problem, false precision, moral responsibility.
      4.  Counter-argument: Efficiency and calibration.
      5.  Sign-off.

      *Wait, I need to make sure I don't sound like I'm ignoring the tools.* The tools are useful, just not as oracle machines.
      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Advisory Panel
  **FROM:** [Your Name], Ethics Department
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Actuarial Risk Discrepancies

  **Recommendation**
  **Do not permit single-number point estimates (e.g., "63%") to be entered into the official record as *the* probability of recidivism for an individual.** Instead, mandate that vendors report risk as a **range or strata (e.g., "20–65%" or "High/Moderate")** accompanied by a plain-language definition of the **reference class** used to generate the score. Commissioners must treat divergent outputs not as a mathematical error to be resolved, but as a signal of epistemic uncertainty requiring enhanced qualitative review.

  **Rationale**
  1.  **The Reference Class Problem:** An individual belongs to infinite overlapping groups (national offenders, local offenders, 35-year-olds, etc.). There is no statistical principle that dictates which group defines their "true" probability. Tool A (national) and Tool B (local) are both mathematically valid within their own silos, but neither can claim metaphysical priority for *this* specific person. Presenting one number as fact conceals this ambiguity.
  2.  **False Precision:** Point estimates create an illusion of scientific certainty that social science cannot support. A divergence of 42 percentage points demonstrates that the margin of error exceeds the utility of the specific digit. Relying on a point estimate invites commissioners to outsource moral agency to an algorithm that is essentially guessing within a wide variance.
  3.  **Procedural Justice:** Parolees are entitled to know *why* they are being held. Telling an inmate they are denied because of a "63% risk" is misleading when another defensible model says 21%. Telling them their risk profile places them in a "High Uncertainty" category based on conflicting demographic matches is honest, defensible, and respects their dignity as persons rather than data points.

  **The Best Argument Against This Recommendation**
  The strongest case for retaining point estimates is **decisional efficiency and calibration.** Commissioners are laypeople tasked with making difficult public-safety decisions; they require clear heuristics, not philosophy seminars. A specific number, even if imperfect, forces a consistent threshold for action (e.g., "deny if >50%"). Furthermore, one tool *is* likely better calibrated than the other over the long run. By refusing to pick a "winner" or a specific number, we may paralyze the board, increase reliance on unmeasured clinical bias, and obscure the tool that is actually more accurate at predicting aggregate harm. In high-stakes environments, a confident wrong answer is sometimes operationally preferable to an honest admission of ignorance.

  **Conclusion**
  We cannot solve the reference class problem mathematically, but we can manage it ethically. We must stop asking tools to do what they cannot: predict the future of a single soul with precision. We should use them to map the terrain of risk, not to draw a single line through it.
