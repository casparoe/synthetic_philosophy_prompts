prompt: |-
  A friend and I have pooled some money to make a series of independent, favorable bets together (each one wins 55% of the time and pays even money, and we expect to place several hundred of them over the coming year), and last night we argued for over an hour about how large our stake should be each time. I want us to wager the same fixed fraction of our current bankroll on every bet—specifically, whichever fraction maximizes the rate at which our money grows over the whole sequence—because I'm convinced that, after enough rounds, this fraction will, with near certainty, leave us richer than any other fixed staking rule would. My friend thinks that reasoning is muddled: he says the only defensible goal is to maximize our expected total wealth at whatever point we eventually stop, and since each individual bet has positive expected value, that goal calls for staking far more than I want on every bet—in the limit, our entire bankroll, every time. Neither of us managed to convince the other. Who has the stronger argument, and is there a principled way to adjudicate between these two ways of thinking about a long sequence of favorable bets, rather than just picking a side?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Scenario:**
      *   **Context:** Two friends pooling money for a series of independent, favorable bets.
      *   **Bet Parameters:** Win probability $p = 0.55$, Loss probability $q = 0.45$. Payout is even money (1:1).
      *   **Duration:** Several hundred bets (long sequence).
      *   **The Conflict:**
          *   *User's View:* Wager a fixed fraction of the *current* bankroll to maximize the *growth rate* (Kelly Criterion logic). Believes this leads to being richer than other strategies with near certainty in the long run.
          *   *Friend's View:* Maximize *expected total wealth* (Expected Value logic). Since EV is positive, bet everything (or as much as possible) every time.
      *   **The Question:** Who has the stronger argument? Is there a principled way to adjudicate?

  2.  **Deconstruct the Mathematical Arguments:**

      *   **Friend's Argument (Maximize Expected Value):**
          *   Let $W_0$ be initial wealth.
          *   Let $f$ be the fraction bet.
          *   Outcome after 1 bet: $W_1 = W_0(1+f)$ with prob $p$, $W_1 = W_0(1-f)$ with prob $q$.
          *   $E[W_1] = p W_0(1+f) + q W_0(1-f) = W_0 [1 + f(p-q)]$.
          *   Since $p > q$ (0.55 > 0.45), $(p-q) > 0$.
          *   To maximize $E[W_1]$, maximize $f$. So $f=1$ (bet everything).
          *   After $n$ bets, $E[W_n] = W_0 [1 + f(p-q)]^n$. Still maximized at $f=1$.
          *   *Flaw:* This ignores risk of ruin and the distribution of outcomes. If you bet everything ($f=1$) and lose once, you have 0. You can't recover. The probability of losing at least once in "several hundred" bets approaches 1. So, while the *average* outcome is huge (driven by the one timeline where you win 500 times in a row), the *typical* outcome is zero.

      *   **User's Argument (Maximize Growth Rate / Kelly Criterion):**
          *   Focuses on the geometric mean, not the arithmetic mean.
          *   We want to maximize $E[\ln(W_n)]$.
          *   $\ln(W_n) = \ln(W_0) + \sum \ln(1 + f X_i)$, where $X_i$ is $+1$ or $-1$.
          *   Growth rate $g(f) = p \ln(1+f) + q \ln(1-f)$.
          *   Maximize $g(f)$ with respect to $f$.
          *   Derivative: $p/(1+f) - q/(1-f) = 0 \Rightarrow p(1-f) = q(1+f) \Rightarrow p - pf = q + qf \Rightarrow p-q = f(p+q)$.
          *   Since $p+q=1$, $f^* = p - q$.
          *   Here $f^* = 0.55 - 0.45 = 0.10$ (10%).
          *   *Strength:* By the Law of Large Numbers applied to log-wealth, the actual wealth will converge to the exponential of the expected log-wealth. This maximizes the *median* wealth and minimizes the time to reach a target goal. It avoids ruin.

  3.  **Evaluate "Who is Right?":**
      *   Mathematically, both are "correct" based on their objective functions.
      *   Friend: Maximizes *Arithmetic Mean* of wealth.
      *   User: Maximizes *Geometric Mean* of wealth (and median wealth).
      *   Practically/Financially: The User is overwhelmingly correct for a repeated betting scenario. The Friend's strategy leads to almost certain ruin (probability of ruin $\approx 1 - 0.55^N$, which is effectively 1 for $N=100$).
      *   The "Ergodicity" argument is the key principled adjudication. In non-ergodic systems (like multiplicative wealth processes), time averages $\neq$ ensemble averages. The Friend looks at the ensemble average (all possible parallel universes). The User looks at the time average (one specific life path). Since we live in one timeline, the User's logic holds.

  4.  **Structure the Answer:**
      *   **Direct Answer:** Validate the User's intuition but acknowledge the Friend's mathematical technicality. State clearly that for *repeated* bets, the User is practically right.
      *   **The Friend's Logic (Expected Value):** Explain why it suggests betting everything. Show the math ($E[W]$). Explain the catch: "Gambler's Ruin." The average is skewed by astronomically unlikely outliers.
      *   **The User's Logic (Growth Rate/Kelly):** Explain the Kelly Criterion. Show the math ($f = p - q$). Explain why this works (Law of Large Numbers on log-wealth).
      *   **The Principled Adjudication (Ergodicity):** This is the sophisticated concept that resolves the debate.
          *   Ensemble average (Friend) vs. Time average (User).
          *   Wealth multiplication is non-ergodic.
          *   Reference Ole Peters' work (optional but adds authority).
      *   **Practical Implications:**
          *   Friend's strategy: 99.99...% chance of going broke.
          *   User's strategy: Maximizes long-term compound return, minimizes risk of ruin.
          *   Compromise: Fractional Kelly (if they are risk-averse).
      *   **Conclusion:** Reiterate that while the Friend is technically right about *expected value*, the User is right about *getting rich*.

  5.  **Refine the Content (Self-Correction/Nuance):**
      *   *Correction:* Make sure to explicitly calculate the Kelly fraction for this specific case ($0.55 - 0.45 = 10\%$).
      *   *Nuance:* Acknowledge that "Expected Wealth" isn't a useless metric, but it's the wrong metric for *sequential* decisions with compounding.
      *   *Tone:* Keep it objective but firm on the mathematical reality of repeated betting. Avoid calling the friend "stupid," but call the strategy "suicidal."
      *   *Key Insight:* The difference between Arithmetic Mean and Geometric Mean.
      *   *Visual:* Describe the distribution of outcomes. One huge winner, millions of losers vs. a tight cluster of winners.

  6.  **Drafting the Response (Mental or Scratchpad):**
      *   Start with the verdict: You are right for the real world; friend is right for a textbook probability problem that ignores survival.
      *   Section 1: The Friend's Trap (EV). Explain $f=1$. Explain that $E[W]$ is dominated by the $0.55^{500}$ path.
      *   Section 2: Your Strategy (Kelly). Explain $f = p - q$. Explain log utility.
      *   Section 3: The Deep Reason (Ergodicity). This is the "principled way."
      *   Section 4: Recommendation. Bet 10% (Full Kelly) or less (Half Kelly). Do not bet 100%.

  7.  **Final Polish:** Check the math.
      *   $p=0.55, q=0.45$.
      *   Kelly $f = 0.55 - 0.45 = 0.10$.
      *   Friend says bet 1.0.
      *   Probability of ruin with bet 1.0 over 500 bets: $1 - 0.55^{500} \approx 1$.
      *   Probability of ruin with bet 0.1: Very low, but possible.
      *   Make sure to mention that Kelly maximizes the *median* outcome, not just the mean log.

  8.  **Final Review against constraints:** The user asked "Who has the stronger argument" and "is there a principled way to adjudicate". Ensure both are answered explicitly. (Yes, User is stronger. Yes, Ergodicity/Economics of Uncertainty is the principle).

  **(Self-Correction during drafting):** I should mention that betting *full* Kelly can be volatile. Many professionals use "Half-Kelly." I should mention this as a practical nuance, even if the theoretical argument favors Full Kelly for max growth.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  You have the stronger argument for a repeated betting scenario. While your friend is mathematically correct about a single isolated bet, their logic leads to almost certain financial ruin over a long sequence.

  Here is the principled adjudication of your debate, distinguishing between the two types of averages and explaining why your approach is the only one that works in the real world.

  ### 1. The Friend’s Argument: The Ensemble Average (Expected Value)
  Your friend is maximizing **Expected Value (EV)**, which is the *arithmetic mean* of all possible outcomes across parallel universes.

  *   **The Math:** If you bet your entire bankroll ($f=1$) on a 55% chance to double, your expected wealth grows by 10% per bet. Over hundreds of bets, the theoretical average wealth becomes astronomical.
  *   **The Flaw:** This average is skewed by a vanishingly rare "lucky path" where you win every single time. In reality, you live in only one timeline. If you bet 100% of your bankroll, a single loss reduces you to zero. With hundreds of bets, the probability of hitting at least one loss approaches 100%.
  *   **Verdict:** This strategy maximizes the *average* outcome of a group of people, but guarantees ruin for the *individual*.

  ### 2. Your Argument: The Time Average (Geometric Growth)
  You are maximizing the **Geometric Mean**, which corresponds to the *time average* of wealth growth in a single life path. This is known as the **Kelly Criterion**.

  *   **The Math:** To maximize the long-term growth rate, you must maximize the expected logarithm of wealth. The optimal fraction ($f^*$) for even-money bets is simply the edge:
      $$f^* = p - q$$
      $$f^* = 0.55 - 0.45 = 0.10$$
  *   **The Result:** You should bet **10%** of your bankroll. This strategy ensures that your wealth grows exponentially over time while mathematically eliminating the risk of total ruin.
  *   **Verdict:** This strategy maximizes the wealth you will *actually* possess at the end of the year.

  ### 3. The Principled Adjudication: Ergodicity
  The fundamental disagreement is about **Ergodicity**.

  *   **Ergodic systems:** The average outcome of a group (ensemble) is the same as the average outcome of one person over time.
  *   **Non-ergodic systems:** Wealth multiplication is non-ergodic. The "group average" (your friend's view) includes paths where people go broke and paths where they become infinitely rich. The "time average" (your view) accounts for the fact that once you go broke, you stop playing.

  Because you cannot recover from zero, you must ignore the ensemble average and optimize for the time average.

  ### Recommendation
  You are theoretically correct to use the Kelly Criterion. However, full Kelly (10%) can be volatile. A standard professional compromise is **Half-Kelly**:

  *   **Theoretical Optimum:** 10% of bankroll.
  *   **Practical Recommendation:** 5% of bankroll.

  This retains roughly 75% of the growth rate of full Kelly while significantly reducing the variance and emotional stress of the drawdowns. Do not bet more than 10%, and certainly do not bet everything.
