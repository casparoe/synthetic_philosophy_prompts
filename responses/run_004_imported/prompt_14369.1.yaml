answer: |-
  As a novelist, you know better than most that human motivation is rarely a single, clean thread. It is usually a braid of conflicting impulses: love and obligation, fear and virtue, selfishness and sacrifice. In fiction, we often distrust the character who claims purely noble motives; we believe the character who acts rightly *despite* their complicated, messy reasons.

  You are asking two distinct questions here. One is ethical: *Does the value of the act diminish if the motive is self-protection rather than love?* The other is psychological: *Why does the praise feel like a weight rather than a comfort?*

  Let's look at the ethics first. In hospice care, the metric of success is not the emotional state of the caregiver, but the physical and psychological comfort of the dying. You have established that the care is excellent. Your mother is safe, attended to, and not alone. If you were driven by boundless love but were disorganized, absent, or incompetent, the care would suffer. If you are driven by a desire to curate your legacy but are meticulous, present, and advocacy-focused, the care thrives.

  In this context, your motive is actually more reliable than love. Love can burn out; it can be complicated by old resentments (which you openly acknowledge); it can fluctuate with mood. But a commitment to one's own self-concept—"I am the person who shows up"—is a steel trap. You are holding the door open for her dignity, even if you aren't holding her hand for her soul. That counts. It counts immensely. To suggest it counts for less is to privilege the *feeling* of the caregiver over the *experience* of the cared-for.

  So, why does the praise sit wrong?

  You suspect it might be sophisticated guilt. I would suggest it is something else: it is the discomfort of being misread.

  Your brother has cast you in a role: "The Good One." In family systems, these roles are often assigned to maintain equilibrium. By labeling you "The Good One," your brother inadvertently assigns himself the role of "The Busy One" or "The Fragile One," or simply absolves himself of duty entirely. His praise is not just appreciation; it is a transaction. He is paying you in validation so he doesn't have to pay in presence.

  When they call you "good," they are praising a virtue they assume you possess (filial devotion), while you know you are operating on a different principle (reputation management and legacy protection). You feel like an impostor, not because you are doing a bad job, but because you are accepting an award for a category you didn't enter. You are being praised for your *heart*, when you are working with your *hands* and your *conscience*.

  There is also the matter of your children. You admitted you are doing this partly so you won't be remembered as the one who wasn't there. That is not necessarily cynical; it is an understanding of intergenerational witness. You are modeling behavior for your children. You are showing them that when a family member is vulnerable, we show up. Even if the emotional well is dry, the duty remains. That is a powerful lesson. It teaches them that responsibility does not require affection to be valid.

  However, the unease you feel is the gap between your internal narrative and the external one. As a writer, you know that the most interesting truths live in that gap.

  If you were to write this character, you wouldn't write her as a saint. You would write her as a woman doing a hard, necessary thing for complicated reasons. You would write her exhaustion, her lack of sentimental grief, and her fierce protection of her own moral standing. And you would treat her with compassion.

  You deserve to extend that same authorial compassion to yourself.

  You are not "The Good One" in the sentimental, storybook sense. You are the *Responsible One*. You are the one who understood that dignity is a right, not a reward for being loved. That is a colder, harder truth than the one your family is telling, but it is sturdy enough to hold the weight of what needs to be done.

  So, is it guilt? Perhaps partly. But it is also the friction of integrity. You are refusing to lie to yourself about your feelings, even while you perform the duties of love. That is not hypocrisy; that is maturity.

  Let them have their story about you being "the good one." It helps them sleep. But in your own private draft, know this: You are ensuring a stranger (for that is who she has become to you) dies with dignity. That is not a lesser thing. It is simply a different thing than what they think it is. And it is enough.
