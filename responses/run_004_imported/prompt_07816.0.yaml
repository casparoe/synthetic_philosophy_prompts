answer: |-
  Your objection strikes at the foundational analogy of Toby Ord's proposal. You have identified a category error: Ord attempts to apply a mechanism designed for **preference aggregation** (economics) to a domain of **truth-tracking** (ethics).

  To argue against generalizing the comparative-advantage case from economic to moral trade, we must demonstrate that the "own lights" defense is not merely a humble acknowledgment of uncertainty, but a fundamental collapse of the moral claim. If moral trade only guarantees that agents are more consistent with their own beliefs, it ceases to be *moral* trade and becomes *psychological* trade.

  Here is the argument against the generalization, focusing on why the "own lights" defense fails to bridge the gap between economic welfare and moral value.

  ### 1. The Constitutive vs. Instrumental Distinction
  In standard welfare economics, satisfying a preference is **constitutive** of welfare. If you prefer apples to oranges and receive apples, your welfare has objectively increased *by definition*, because welfare is modeled as preference satisfaction. There is no "fact of the matter" outside your preference that checks whether you *should* have preferred apples.

  In ethics, satisfying a moral conviction is merely **instrumental** to doing good, and only if that conviction is true. Moral beliefs are truth-apt; they aim to describe normative reality.
  *   **Economic Trade:** Agent A gets what they want. Result: Good.
  *   **Moral Trade:** Agent A does what they think is right. Result: Unknown (depends on whether they are right).

  By generalizing the economic case, Ord assumes that "acting in accordance with one's moral credences" is a good in itself. But if morality is about minimizing suffering, maximizing virtue, or respecting rights, then "acting in accordance with credences" has no intrinsic value. It is only valuable insofar as it leads to the *actual* minimization of suffering, etc.

  Therefore, a Pareto improvement in "moral consistency" (both parties feel they compromised less) is not a Pareto improvement in "moral value." If both parties are significantly mistaken, a trade that makes them more consistent with their errors simply allows them to collaborate more efficiently on doing wrong. The economic analogy fails because it treats moral convictions as tastes rather than hypotheses.

  ### 2. The Problem of Compounding Error via Comparative Advantage
  The logic of comparative advantage relies on the assumption that the units being traded are neutral or positive. In economics, producing more widgets is generally good if people want widgets. In moral trade, the "units" are actions that may be objectively harmful.

  Consider a trade between a radical environmentalist (who believes driving a car is morally equivalent to murder) and a utilitarian (who believes driving is permissible if it leads to greater economic output).
  *   **The Trade:** The environmentalist stops driving (high cost to them, low objective harm prevented if the car was efficient). The utilitarian donates to a charity the environmentalist likes (low cost to them).
  *   **The "Own Lights" Gain:** Both feel they have adhered more closely to their values.
  *   **The Objective Reality:** If the environmentalist is wrong (driving is not murder), they have incurred a massive opportunity cost for zero moral gain. If the utilitarian is wrong (the charity is ineffective), they have wasted resources.

  The danger of the comparative-advantage generalization is that it incentivizes agents to specialize in the actions they feel *least bad* about, rather than the actions that *are* least bad. Comparative advantage optimizes for **subjective friction**, not **objective outcome**.

  If we generalize the economic model, we create a system where moral progress is measured by the reduction of cognitive dissonance rather than the reduction of actual harm. A trade can be "efficient" in Ord's sense while moving both parties further away from the moral truth. The "own lights" defense admits this but claims it doesn't matter; this is an admission that the proposal is not about morality, but about moral *comfort*.

  ### 3. The Incommensurability of Moral Costs
  Economic trade works because money provides a fungible metric of cost. $10 is $10, regardless of whether I spend it on books or booze. This fungibility allows comparative advantage to be calculated precisely.

  Moral trade lacks a fungible currency. Different ethical frameworks posit different *kinds* of value that cannot be traded without category errors.
  *   **Deontological Costs:** For a deontologist, violating a right isn't a "cost" to be offset; it's a prohibition. You cannot trade a "small rights violation" for a "large rights violation" any more than you can trade "a little bit of logical inconsistency" for "a lot of logical consistency."
  *   **Utilitarian Costs:** For a utilitarian, cost is linear (units of utility).

  When Ord proposes trade, he asks agents to quantify their "moral cost." But for many agents, moral cost is not a scalar quantity; it is a lexical constraint. By forcing these constraints into a comparative-advantage framework, the model distorts the moral landscape. It forces deontologists to think like consequentialists about their own duties (i.e., "I can violate this duty if the 'price' is right").

  The "own lights" defense suggests we just use the agent's *own* valuation of the cost. But this leads to a breakdown in the possibility of trade. If Agent A views an action as a sin (infinite cost) and Agent B views it as a minor inconvenience (low cost), no trade can occur that satisfies the "own lights" of Agent A without Agent A ceasing to hold their view. If they do trade, they are effectively admitting their moral view was negotiable, which undermines the sincerity required for the "own lights" metric to matter in the first place.

  ### 4. The Retreat to Psychology
  Finally, addressing your core point: appealing to "own lights" to measure gain restates the problem because it redefines the goal of the enterprise.

  If I defend moral trade by saying, "It doesn't matter if the act is objectively wrong, it matters that the agents feel they acted rightly," I have ceased to argue for **moral improvement** and started arguing for **psychological cohesion**.

  *   **Economic Generalization:** Trade increases welfare (satisfaction).
  *   **Moral Generalization:** Trade increases integrity (consistency).

  But integrity is only a virtue if the principles being integrated are good. A consistent Nazi has more integrity than a confused Nazi, but the world is not better for it. By generalizing the economic case, Ord implicitly argues that integrity (consistency with belief) is a terminal value comparable to welfare.

  This is the fatal flaw. In economics, the satisfaction of the preference *is* the end goal. In morality, the satisfaction of the conviction is only a means to the end goal (the Good). You cannot generalize a means-end structure from a domain where the means *are* the end (economics) to a domain where the means are distinct from the end (ethics).

  ### Conclusion
  The generalization fails because it treats moral beliefs as **assets** to be managed rather than **claims** to be verified. Economic trade aggregates desires to produce welfare; moral trade, as proposed, aggregates errors to produce consistency.

  Your intuition is correct: a Pareto improvement in "faithfulness to one's own views" is morally inert. It ensures that if we are wrong, we are wrong more efficiently. To argue otherwise requires asserting that moral uncertainty makes the *feeling* of rightness the only accessible good, which collapses morality into prudence. If we reject that collapse, the comparative-advantage argument for moral trade loses its normative force, leaving it as a tool for conflict resolution, but not for moral progress.
