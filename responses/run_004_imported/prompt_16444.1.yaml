answer: |-
  **MEMORANDUM**

  **TO:** Graduate Admissions Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Admissions Reading Protocol

  **Recommendation**

  I recommend we **retain the two-reader system** but modify the protocol for handling disagreements. Specifically, we should abandon the "unanimity to admit" requirement in favor of a structured adjudication process where split files are discussed and voted on by the full committee.

  I advise against adopting the proposed five-reader majority vote system. While the formal theory argument underpinning that proposal is mathematically elegant, it relies on assumptions about independence and competence that do not hold in our specific social context. Furthermore, the skeptical objections raised regarding the ontology of "applicant potential" are not merely philosophical quibbles; they point to a fundamental category error in treating admissions as a detection problem rather than a deliberative one.

  **The Condorcet Jury Theorem and Its Limits**

  The proposal to move to five readers rests on the Condorcet Jury Theorem (CJT). The argument is seductive: if each reader has a probability of correctness ($p$) greater than 0.5, adding more independent voters drives the probability of a correct majority decision toward 1. If we accept the premises, the math is undeniable. However, in the context of PhD admissions, the premises are untenable.

  **1. The Violation of Independence**
  CJT requires that voter errors be independent. In our department, they are not. We share a disciplinary habitus, we are trained to value similar methodological commitments, and we utilize a common rubric calibrated in pre-meeting discussions. If Reader A has a blind spot regarding a specific subfield or theoretical approach, Reader B is statistically likely to share it due to our shared intellectual environment. When errors are correlated, adding more readers does not average out noise; it amplifies systemic bias. Five readers from the same department are not five independent trials; they are five iterations of the same structural priors.

  **2. The Competence Problem ($p > 0.5$)**
  CJT requires that individual voters be more likely to be right than wrong. In admissions, "rightness" is defined as predicting who will thrive in the program. We have no feedback loop for this. We never observe the counterfactual performance of the applicants we reject. Without ground truth, we cannot verify that our $p$ is greater than 0.5. We are operating on professional intuition, which is valuable, but treating it as a quantifiable competence parameter is epistemologically vain. Increasing the sample size of readers on a file does not increase accuracy if the underlying measure is uncalibrated.

  **The Ontological Objection: Detection vs. Construction**

  The strongest argument against the five-reader model, however, is ontological. The formal theory model assumes that "potential to thrive" is a latent trait existing within the file, waiting to be detected by sufficient measurement.

  This is not how social science judgment works. An applicant's fit is not a fixed variable; it is relational. It emerges from the interaction between the applicant's profile and the committee's current needs, funding landscape, and intellectual direction. When we discuss a file live (as we do in the current disagreement phase), we are not aggregating pre-formed preferences to find a hidden truth. We are *constructing* the evaluation through argumentation. A reader might change their mind not because they were "corrected," but because a colleague highlighted a dimension of the file they hadn't weighted heavily.

  The five-reader model eliminates the space for this deliberation. It replaces politics with mechanics. It assumes the answer is already in the envelope and we just need enough hands to open it. The two-reader model, by forcing a conversation when rankings diverge, acknowledges that the "answer" is produced by the committee, not the candidate.

  **Proposed Modification: Adjudicated Splits**

  Retaining the two-reader system is not an endorsement of the status quo without reservation. The current "unanimity to admit" rule is too restrictive and generates high false negatives (excellent candidates vetoed by a single outlier reader).

  I propose the following workflow:
  1.  **Two Independent Readers:** All files receive two reads.
  2.  **Top-Tier Consensus:** If both readers rank top-tier, the candidate moves to the "admit" pile (subject to funding checks).
  3.  **Adjudicated Splits:** If rankings diverge, the file does not die. It is flagged for full committee discussion.
  4.  **Committee Vote:** After discussion, the full committee votes by majority.

  This approach preserves the efficiency of the two-reader system (saving the hundreds of hours required for five reads per file) while mitigating the variance of individual bias. It centers the "hashing out" phase as the core engine of decision-making, rather than treating it as a bug to be solved by adding more voters.

  **Conclusion**

  We should not mistake precision for accuracy. A five-reader majority vote gives us the *appearance* of statistical rigor without the *substance* of independent verification. It is a solution looking for a problem, one that ignores the correlated nature of our judgments and the constructed nature of our criteria.

  Let us keep the process human-scale. Let us admit that we are making political judgments about future colleagues, not measuring physical constants. We should optimize for deliberation, not aggregation.

  **Decision:** Retain 2 readers; shift from unanimity rule to adjudicated majority vote on splits.
