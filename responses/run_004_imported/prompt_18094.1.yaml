      *   *Option C: Causal/Functional Realism (The "Middle" that acts like a Side).* This is the most defensible position. Features are real *insofar as they are causally efficacious and robust across bases*, but we must be skeptical of semantic labeling.
      *   *Decision:* I will argue for **Causal Structural Realism**. Features are real computational structures, but their *semantic labels* are often human projections. The "reality" lies in the circuit mechanics, not the English name we slap on it. This allows me to be decisive while acknowledging the nuance.

  4.  **Drafting - Section by Section:**

