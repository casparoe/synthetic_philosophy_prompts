      *   **The Case for Anti-Realism (The "Rorschach" View):** Focus on Basis Rotation and Polysemanticity. The "Cloud Face" analogy. Dennett's Intentional Stance. We are imposing human categories on high-dimensional math.
      *   **The Verdict (Committing):** I need to choose. I will choose **Causal Realism**.
      *   **Defense of the Verdict:** Why? Because "real" in engineering means "makes a difference." If a feature is robust to intervention and transferable across models, it earns ontological status. However, I must add the caveat: The *label* is the projection, the *mechanism* is the reality.
