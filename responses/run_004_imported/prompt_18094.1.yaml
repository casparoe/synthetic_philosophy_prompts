          *   *Convergent Evolution:* Different models trained on different seeds find similar features (e.g., curve detectors in vision, specific factual concepts in LLMs). This suggests the task demands these representations.
          *   *Linearity/Superposition:* The mathematical structure (polytopes, sparse autoencoders) reveals a geometry that exists independent of the observer.
          *   *Predictive Power:* Knowing the feature allows you to predict model behavior on unseen inputs better than chance.

      *   **The Anti-Realist/Instrumentalist Case (Features are "Projections"):**
          *   *Basis Arbitrariness:* Neural activations are vectors. You can rotate the basis infinitely. Why is *this* direction "Golden Gate" and not a mix of "bridge" + "California"? The choice of basis (e.g., via SAEs) is an optimization choice, not a ground truth.
          *   *Polysemanticity:* Neurons/directions often fire for unrelated concepts. Is it a "feature" or just a statistical correlation?
          *   *Dennett's Intentional Stance:* We attribute beliefs/features because it helps us predict the system, not because there's a little homunculus inside holding that belief. It's a useful fiction.
          *   *Human Bias:* We name things based on human concepts ("sarcasm," "bridge"). The model might be representing something mathematically distinct that merely correlates with our label.

  3.  **Determine the Stance:**
