answer: |-
  Here are 9 interview questions designed to probe the weaknesses of the "IEDS Hardliner" position, complete with follow-ups that anticipate standard defensive maneuvers.

  ### 1. The "Physical Randomization" Objection
  **Question:** You argue that we should eliminate any pure strategy dominated by a *mixed* strategy, even if no player actually intends to randomize. But suppose I am a player who, due to institutional constraints or cognitive limitations, physically *cannot* randomize. If my pure strategy is dominated only by a convex combination of two other strategies I can't actually play as a mix, in what behavioral sense am I being "irrational" by playing it?

  **Follow-up (If he says "It's about beliefs, not actions"):** If the mix represents my *opponent's* uncertainty about me, fine. But if the mix represents *my* available actions to dominate a third action, you're implying I ought to have access to a correlation device I don't have. Are you defining rationality as a mathematical property of the payoff matrix rather than a constraint on the agent's choice set?

  ### 2. The Asymmetry of Elimination Order
  **Question:** We know that for *strict* dominance, the order of elimination is irrelevant; the surviving set is unique. For *weak* dominance, the order matters immensely. If both are derived from the same fundamental axiom of "rationality," why does the *procedure* of reasoning change the outcome in one case but not the other? What does that asymmetry tell us about the epistemic status of weak dominance?

  **Follow-up (If he says "Just use strict dominance then"):** If you restrict yourself to strict dominance, your solution concept fails to select an outcome in most coordination games or games with weakly dominated equilibria. Are you willing to concede that your "general solution concept" is often an empty set, rendering it useless for comparative statics?

  ### 3. The Centipede Game & Common Knowledge
  **Question:** Let's take the Aumann argument seriously. If we accept Common Knowledge of Rationality (CKR) and apply iterated dominance in a perfect information game like the Centipede Game, we are forced into Backward Induction. We stop at the very first node. Empirically, almost no one does this. Do you conclude that human subjects are systematically irrational, or that CKR is an empirically false assumption about how people model each other?

  **Follow-up (If he says "They make mistakes/trembles"):** If the deviation is systematic and increases with the stakes (as some experiments suggest), "mistakes" feels like a dodge. If CKR leads to a prediction that fails in the lab, but Nash Equilibrium (with some belief error) fits better, why privilege the epistemic purity of CKR over predictive accuracy?

  ### 4. The $N>2$ Correlation Problem (The Bonus)
  **Question:** In two-player games, rationalizability and iterated elimination of mixed dominated strategies are equivalent. But in games with three or more players, they diverge. Rationalizability assumes independent conjectures about opponents, while IEDS allows players to believe opponents' strategies are *correlated* even without a correlating device. By defending IEDS, are you implicitly arguing that it is rational for me to believe you and a third player are correlating your moves against me without any communication?

  **Follow-up (If he says "Correlated beliefs are always possible"):** But without a correlating device, that correlation has no causal story. If I assume you are correlating without a mechanism, aren't I violating a principle of parsimony? Why should the "correct" solution concept rely on conjectures that assume spurious correlation?

  ### 5. Predictive Power vs. Epistemic Honesty
  **Question:** Your main critique of Nash Equilibrium is that it assumes "correct beliefs." But the trade-off is that IEDS often leaves us with a massive set of surviving strategies, whereas NE gives us a point (or a small set). If I'm a regulator or a mechanism designer, I need to predict *what will happen*, not just *what could happen*. Is your solution concept actually too honest to be useful?

  **Follow-up (If he says "Better honest than wrong"):** Science isn't just about honesty; it's about precision. If a theory says "anything can happen" and anything happens, the theory is unfalsifiable. At what point does the relaxation of assumptions render the model vacuous?

  ### 6. The "Quiet" Assumption of Beliefs
  **Question:** You claim IEDS avoids assuming correct beliefs. But to eliminate a strategy, I must have a *belief* about your play that makes that strategy suboptimal. If we iterate this, aren't we just building a hierarchy of beliefs that eventually converges on the same structure as Nash, just without the fixed-point requirement? Is the distinction between "consistent beliefs" (NE) and "hierarchical beliefs" (IEDS) as stark as you claim?

  **Follow-up (If he says "It's about the fixed point"):** But if the hierarchy of beliefs doesn't converge to a fixed point, how do players coordinate on *which* surviving strategy to play? You've removed the coordination device of NE without replacing it.

  ### 7. Risk Dominance and Selection
  **Question:** Consider a coordination game with two strict Nash equilibria. One is payoff dominant, the other is risk dominant. Iterated dominance (strict) often eliminates neither. If rationality is the only guide, how does a player choose between them? If you say "they don't," aren't you admitting that rationality alone is insufficient to solve the game, requiring social norms or focal points that your model ignores?

  **Follow-up (If he says "That's outside the model"):** But if your model can't solve the most common strategic problem (coordination), can it really be called the "correct general solution concept"? Or is it merely a filter for obvious blunders?

  ### 8. Learning and Stability
  **Question:** Evolutionary game theory and learning models (like fictitious play) often converge to Nash Equilibria, even if they aren't reached by iterated dominance. If dynamic processes driven by simple reinforcement lead to NE, but your static rationality argument leads to a wider set, why should we privilege the static rationality argument over the dynamic stability argument?

  **Follow-up (If he says "Learning is slow/irrational"):** But in repeated markets, learning happens. If agents learn to play NE, then NE describes the steady state. Why defend a solution concept that describes the starting point of reasoning rather than the endpoint of experience?

  ### 9. The Definition of "Solution"
  **Question:** Finally, a philosophical point. You call IEDS a "solution concept." But a solution usually implies a recommendation for play. If IEDS leaves multiple strategies surviving, your recommendation is "play any of these." Isn't that effectively no recommendation at all? Should we really be calling it a solution concept, or rather a "consistency filter"?

  **Follow-up (If he says "It narrows the space"):** Narrowing the space is a pre-processing step, not a solution. If I ask you "How do I solve this equation?" and you say "Well, $x$ is definitely not 5," you haven't solved it. Why do we grant game theory the status of a solution when it often only provides a negation?
