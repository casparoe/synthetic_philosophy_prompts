  5.  **Final Review against constraints:**
      *   8-9 questions? Yes.
      *   Specific topics covered? Yes.
      *   Follow-ups included? Yes.
      *   Tone appropriate? Yes.

  6.  **Final Polish:** Add an intro and outro to frame the response nicely for the user. (Proceed to generate output).

