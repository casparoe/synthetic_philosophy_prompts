answer: |-
  You are right to be skeptical. While your friend is using the vocabulary of Vipassana Buddhism correctly, he is applying the philosophy incorrectly. In fact, most Buddhist teachers would agree with you: **he is using a metaphysical insight to bypass ethical responsibility.**

  Here is a breakdown of why his argument doesn't hold up, both philosophically and psychologically, and how you might handle the friendship.

  ### 1. The Buddhist Reality Check
  Your friend is citing *Anatta* (no-self), but he is ignoring *Karma* (cause and effect) and *Sila* (moral conduct).

  *   **Karma requires continuity:** The Buddhist teaching is that while there is no *permanent, unchanging soul*, there is a continuity of consciousness and causality. The person who cheated three years ago and the person sitting in front of you today are linked by a causal chain. To say "that wasn't me" denies the continuity of karma. If he doesn't own the cause, he cannot understand the effect.
  *   **Ethics come first:** In the Threefold Training of Buddhism (Sila, Samadhi, Panna), Moral Conduct (*Sila*) is the foundation. You cannot build wisdom (*Panna*) on top of unethical behavior. Using wisdom to justify unethical behavior is considered a perversion of the path.
  *   **Remorse vs. Guilt:** Buddhism distinguishes between *guilt* (which is often ego-based self-flagellation) and *remorse* (acknowledging harm and resolving not to repeat it). The goal of practice is to drop the self-punishment of guilt, not to drop the accountability of remorse.

  ### 2. The Psychological Concept: "Spiritual Bypassing"
  There is a specific term for what your friend is doing: **Spiritual Bypassing.**

  Coined by psychologist John Welwood, this refers to the tendency to use spiritual ideas and practices to sidestep or avoid facing unresolved emotional issues, psychological wounds, or basic human needs (like accountability).

  *   **The Mechanism:** It feels good to realize "there is no self." It feels like freedom. But if that realization is used to say "therefore my actions hurt no one and mean nothing," it is being used as a defense mechanism.
  *   **The Result:** It creates a "spiritual ego." Instead of a regular ego saying "I'm a good person," you get a spiritual ego saying "I'm so enlightened I'm beyond good and evil." This is often more insufferable than regular arrogance.

  ### 3. The "Two Truths" Doctrine
  Your friend is confusing what Buddhism calls the **Ultimate Truth** with the **Conventional Truth**.

  *   **Ultimate Truth:** On the deepest level, all phenomena are empty of inherent existence; there is no fixed self.
  *   **Conventional Truth:** In the relative world, people exist, feelings get hurt, promises are broken, and actions have consequences.

  Buddhism teaches that you must honor *both*. You cannot use the Ultimate Truth to violate the Conventional Truth. If you break a vase, you can say "the vase is empty of inherent existence," but you still have to sweep up the shards. If you cheat on a partner, you can say "the self is an illusion," but you still broke a trust that caused real suffering.

  ### 4. The Post-Retreat "High"
  It is also worth noting that 10-day Vipassana retreats are intense. Participants often come out in a state of heightened sensitivity and philosophical euphoria. This is sometimes called "Dharma Poison" or the "Zen Disease."

  *   They feel they have discovered the secret to the universe.
  *   They feel compelled to explain it to everyone.
  *   They often lack the integration time to bring the insight back into normal life.

  This phase usually passes as the "high" wears off and real life sets back in. However, if he solidifies this behavior into a personality trait, it becomes a problem.

  ### 5. Who is Right?
  **Ethically:** You are right. Accountability is necessary for trust and healthy relationships.
  **Philosophically:** You are actually closer to orthodox Buddhist teaching than he is. The Buddha was very clear that actions have consequences regardless of the metaphysical status of the actor.

  ### How to Handle It
  Arguing theology with him right now won't work because he thinks he has the "ultimate" answer and you are "asleep."

  1.  **Stop arguing the metaphysics:** Don't try to prove the self exists. He won't listen.
  2.  **Argue the consequences:** Say something like, *"I'm not interested in debating philosophy. I'm interested in how we treat each other. In this friendship, when we hurt people, we own it. Using 'no-self' to avoid owning past harm feels like a betrayal of the ethics you say you learned."*
  3.  **Set a boundary:** If he brings it up again, you can say, *"I respect your practice, but I'm not comfortable discussing this when it's used to dismiss accountability. Let's talk about something else."*
  4.  **Give it time:** He may just be in the "insufferable novice" phase. If he continues to use spirituality to justify harmful behavior long-term, you may need to reevaluate the friendship, because that indicates a lack of integrity, regardless of his meditation practice.

  **Summary:** He has found a very sophisticated loophole to avoid feeling bad, but he hasn't actually done the work. Real insight usually makes people *more* humble and *more* careful with their actions, not less.
