prompt: |-
  Hey, I'm taping an interview next week for the magazine's podcast with a philosopher who's spent her career defending Parfit's line from Reasons and Persons that identity isn't what matters for survival, only psychological continuity/connectedness — what he called Relation R — is, and I want to skip past the point where she just re-explains the basic teletransporter case again. Can you draft me eight or nine questions that dig into the harder stuff? I want one that uses the branch-line case to ask why dying on earth a few days after your replica's already living on mars is supposed to feel more like ordinary survival than like death, one on the fission case (splitting into two people) and why a "double success" there isnt supposed to be as bad as ordinary death just because neither survivor is strictly identical to the original, and one on the combined spectrum stuff asking whether calling the in-between cases empty questions is real insight or just a dodge. Also work in something built around Bernard Williams' old objection that our fear of future pain tracks the body we expect to wake up in rather than pure psychological continuity, since that seems like the hardest thing for her to brush off. For each question give me a quick follow-up keyed to whatever answer she's most likely to give, and end with one question on whether any of this is actually supposed to change how she feels about her own death the way Parfit said it did for him, or if that's just smuggling in a therapy conclusion the metaphysics doesn't earn.
