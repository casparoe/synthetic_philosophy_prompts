answer: |-
  Here are nine questions designed to bypass the introductory material and press directly into the metaphysical and practical tensions of the Parfitian view. Each includes a likely response and a suggested pivot to keep the pressure on.

  ### 1. The Branch-Line Asymmetry
  **Question:** In the Branch-Line case, the teletransporter breaks down: your replica is already living on Mars, but the original you stays on Earth and dies a few days later. Parfit insists this is "as good as ordinary survival." But from the perspective of the person on Earth, they are undeniably dying. Why should the existence of a copy on Mars make *my* impending death on Earth feel like survival rather than extinction?

  *   **Likely Answer:** She will argue that identity isn't what matters; Relation R (psychological continuity) is what matters, and R holds between Earth-You and Mars-You.
  *   **Follow-up:** "If R is what matters, why does the *termination* of this specific stream of consciousness on Earth not count as a loss? If I know I'm expiring in three days, does the Mars life actually comfort *me*, or just the people who love me?"

  ### 2. Fission and "Double Success"
  **Question:** Let's look at the fission case where you split into two people. Neither survivor is strictly identical to the original, so by traditional logic, you've died. Yet Parfit calls this "double success." How can it be a success at all, let alone double, if the person asking the question ceases to exist? Why isn't this just death with extra steps?

  *   **Likely Answer:** She will claim that survival is not a one-to-one relation. What matters is that your psychology continues, and in fission, it continues twice.
  *   **Follow-up:** "But 'what matters' usually implies a subject for whom it matters. If there is no single subject surviving, who is enjoying this 'double success'? Are we redefining survival so broadly that it no longer tracks the thing we were worried about losing?"

  ### 3. The Williams Body Objection
  **Question:** Bernard Williams argued that if a torturer says, "I will torture *this* body tomorrow," you fear it, even if your memories are wiped beforehand. But if he says, "I will torture a *different* body with your memories," you don't fear it nearly as much. Doesn't this suggest our self-concern is anchored to the body we expect to wake up in, rather than pure psychological continuity?

  *   **Likely Answer:** She will likely concede this is a "brute psychological fact" but argue it's an evolutionary habit, not a metaphysical truth.
  *   **Follow-up:** "If it's a brute fact hardwired into how we experience fear, is it philosophically honest to build a metaphysics of survival that ignores it? Or are you asking us to override our deepest instincts based on a theoretical distinction we can't actually feel?"

  ### 4. Spectrum Cases and "Empty Questions"
  **Question:** In the Combined Spectrum cases, where psychological connectedness gradually fades, you say questions about identity in the middle are "empty." Is this a deep ontological insight that there is no fact of the matter, or is it a philosophical dodge because the metaphysics can't sustain a clear answer without collapsing?

  *   **Likely Answer:** She will argue that reality itself is indeterminate in these cases; language isn't failing, the world is.
  *   **Follow-up:** "If the world is indeterminate, how do we make practical decisions in those grey zones? If I can't say whether I *am* the future person, can I rationally sign a contract or consent to medical treatment for them?"

  ### 5. Subjective Expectation in Fission
  **Question:** Returning to fission: before the split, who should I *expect* to be when I wake up? Lefty? Righty? Both? If I expect to be both, how does one stream of consciousness split into two first-person perspectives without magic?

  *   **Likely Answer:** She may argue that "expectation" is the wrong framework; I should anticipate that *both* will exist with my psychology.
  *   **Follow-up:** "But anticipation is inherently first-personal. If I'm about to undergo the procedure, and I know one of them will be in pain, do I flinch once or twice? If I can't answer that, hasn't the theory disconnected from the phenomenology of being a self?"

  ### 6. Degrees of Survival
  **Question:** Relation R holds by degrees—we are less connected to our future selves than our present ones. Does that mean survival itself holds by degrees? Am I partially dead right now compared to ten years ago?

  *   **Likely Answer:** She will agree that survival is a matter of degree, not all-or-nothing.
  *   **Follow-up:** "If survival fades over time, does my rational self-interest fade with it? Should I care less about my pain at age 80 than my pain at age 40 simply because the psychological connection is weaker?"

  ### 7. Moral Responsibility
  **Question:** If identity isn't what matters, why punish me for a crime my past self committed if the psychological connection is weak? Does this view erode retributive justice, reducing punishment to mere animal training rather than desert?

  *   **Likely Answer:** She will likely argue for a consequentialist view of punishment (safety, reform) rather than retributive desert.
  *   **Follow-up:** "But most people feel that justice requires the *same* person to pay for the crime. If you remove strict identity, aren't you removing the moral anchor that makes punishment feel just rather than just useful?"

  ### 8. Bias Towards the Future
  **Question:** Parfit argued we shouldn't bias towards the future—we shouldn't care more about future pain than past pain just because of its location in time. If Relation R is what matters, should I be as distressed by my past suffering as my future suffering?

  *   **Likely Answer:** She will say rationally, yes, we should minimize the total amount of pain in our life, regardless of tense.
  *   **Follow-up:** "But we can't change the past. If the metaphysics tells me to care equally about what I can't change, isn't that a recipe for paralysis rather than rational action?"

  ### 9. The Existential Payoff
  **Question:** Parfit famously said that accepting this view made him less fearful of his own death, as if the boundaries of his life were less real. Do you actually feel less fear, or is that just smuggling in a therapy conclusion the metaphysics doesn't earn?

  *   **Likely Answer:** She will likely say it provides genuine rational comfort and reduces the sting of extinction.
  *   **Follow-up:** "Is that comfort based on a truth about the world, or is it a psychological trick? If the body still dies and the consciousness still ends, has anything actually changed except the label we put on the end?"
