      *   Verdict: You win the argument, but with nuance.

  10. (Final check of historical details): Hobbes died 1679. Wallis feud was long. *De Corpore* 1655. NEC 1820s/30s. Okay, counterfactual is clear.

  11. (Final check of philosophical details): Hobbes's nominalism. Definitions are stipulative. But they must be resolvable into motion. NEC might fail the "resolvable into motion" test for Hobbes. That's a good point to add.

