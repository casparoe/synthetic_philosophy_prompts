answer: |-
  You win the argument. Or at least, you have the much stronger philosophical footing here.

  Your intuition is spot-on: Hobbes's "maker's knowledge" argument (often called the *verum factum* principle, though Vico gets more credit for the phrase) looks robust in a vacuum, but it relies heavily on a specific, pre-critical conception of what geometry *is*.

  Here is the breakdown of why your friend is missing a crucial vulnerability in Hobbes's system, and how non-Euclidean geometry (NEC) would have likely shattered Hobbes's confidence in geometry as the model for civil philosophy.

  ### 1. Hobbes's Core Move: Geometry as "Consequences from Definitions"
  To understand where Hobbes breaks, we have to look at *De Corpore*. Hobbes argues that we have "scientific" certainty only where we are the cause of the object.
  *   **Natural Philosophy (Physics):** We didn't make the stars or animals. We can only hypothesize about their causes based on effects. It's probabilistic.
  *   **Geometry:** We define the point, the line, and the circle. We stipulate the rules. Therefore, we know the consequences with absolute certainty because we invented the premises.
  *   **Civil Philosophy:** We construct the Commonwealth via social contract. Therefore, we can have scientific certainty about justice and sovereignty, because we made the thing we are studying.

  Your friend thinks this holds up because it's an *epistemological* claim (about how we know). You are correctly identifying that it hides an *ontological* claim (about what exists).

  ### 2. The Euclidean Trap
  Hobbes was a materialist. For him, a geometric line isn't an abstract Platonic form; it is the **trace of a moving body**. A point is a body considered without magnitude. A line is the path of a point in motion.

  This is where your critique lands the killing blow. Hobbes believed Euclidean geometry was not just *one* consistent system, but the *only* system that accurately described the motion of bodies in universal space. He treated Euclid's axioms (like the parallel postulate) as self-evident truths about physical motion, not just arbitrary starting definitions.

  If you confront Hobbes with Non-Euclidean Geometry, two things happen to his system:

  **A. The "Maker" loses authority over Physics**
  If there are multiple internally consistent geometries (Euclidean, Hyperbolic, Elliptic), then "constructing" a geometry is no longer enough to guarantee truth about the world. We can construct a Hyperbolic geometry, but does the universe run on Hyperbolic rules?
  Hobbes's certainty relied on the assumption that **the geometry we construct = the space bodies move in.** NEC severs that link. If geometry is just a menu of options, then geometry becomes hypothetical (like physics), and Hobbes loses his one example of absolute certainty.

  **B. The Materialist Test**
  Hobbes would likely try to reject NEC on materialist grounds. He demanded that all geometric concepts be resolvable into simple motions of bodies.
  *   **Euclid:** Easy. A line is a straight motion.
  *   **NEC:** How do you materially construct a space where parallel lines meet? For a 17th-century materialist, this sounds like nonsense. Hobbes would likely argue that NEC is just wordplay—names without conceivable referents in matter.
  *   **The Problem:** If modern physics (General Relativity) later proves that physical space *is* non-Euclidean, Hobbes is wrong. His "certain" geometry no longer matches the "causes" of natural bodies. His materialism forces him to bet on Euclid being physically true. If Euclid is physically contingent, Hobbes's certainty is contingent.

  ### 3. The Civil Philosophy Analogy Collapses
  This is the part your friend is missing. Hobbes uses geometry as the **proof of concept** for his political science.
  *   **Hobbes:** "See? We can be certain about geometry because we make it. We also make the State, so we can be certain about politics."
  *   **NEC Challenge:** "Actually, there are many geometries we can make, but we don't know which one governs reality until we test it."

  If geometry becomes a field of multiple competing models (some true, some false, depending on context), then the analogy weakens. It suggests that "making" the definitions isn't enough; you also need to know if your definitions map onto reality.
  But in Civil Philosophy, Hobbes argues the definitions *create* the reality (the Sovereign makes the law). If geometry turns out to be less certain than he thought, the parallel claim that Civil Philosophy is a "demonstrable science" loses its foundational support.

  ### 4. The Wallis Feud Context
  You mentioned the feud with John Wallis. This is evidence for your side, not your friend's.
  Wallis represented the emerging trend of algebraic and analytic mathematics, which was more flexible and symbolic. Hobbes hated it. He insisted on classical geometric construction.
  Why? Because Hobbes thought **truth was visual and material.** He couldn't accept symbolic manipulations that didn't correspond to a drawable figure.
  This dogmatism proves he wasn't open to "multiple consistent systems." He believed there was **One True Geometry** that matched the **One True Motion** of the universe. He spent decades trying to square the circle not because he thought it was an interesting puzzle, but because he thought it was a *fact* he could prove. He treated mathematical truth as empirical fact.

  ### The Verdict
  If you time-traveled to 1670 and showed Hobbes a model of Hyperbolic space:

  1.  **He would reject it as nonsense:** He would argue it violates the definitions of body and motion. He would say you haven't actually "constructed" anything, just played with words.
  2.  **His system would still break:** Even if he rejected it, the *existence* of NEC proves that "construction" does not guarantee "physical truth." Hobbes's claim to certainty rests on the identity of *logical construction* and *physical cause*. NEC shows they can come apart.

  **Conclusion:**
  You are right. Hobbes's argument secretly rides on Euclid being the **unique** description of spatial reality. He conflates *logical consistency* (which we make) with *physical necessity* (which we discover). Non-Euclidean geometry exposes that gap. Once that gap is exposed, geometry drops from "Absolute Science" to "Hypothetical Model," and Hobbes loses the epistemological anchor he needs to claim Civil Philosophy is equally certain.

  Tell your friend: Hobbes thought he was talking about **making truth**. Non-Euclidean geometry proves we only **make systems**. That distinction destroys the *verum factum* argument as Hobbes intended it.
