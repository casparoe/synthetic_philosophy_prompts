prompt: |-
  I volunteer with a small ham-radio-adjacent search-and-rescue outfit, and lately I've been chewing on something that came up during a training exercise. We use a pretty standard Bayesian search-theory setup: a probability grid over quadrants where a missing hiker might be, updated as tips come in, with search effort allocated to maximize expected probability of detection. During a tabletop drill, dispatch relayed a witness tip that was conditional rather than a direct sighting — something like "if she carried on past the fork instead of turning back, she almost certainly took the ridge trail over the creek trail." Half the team wanted to fold this in with straightforward Jeffrey conditionalization on the conditional statement; the other half wanted a minimum-cross-entropy update that keeps the rest of the grid "as untouched as possible." Our resident rationalist-blog-reader (guilty) piped up that this is just a real-world instance of van Fraassen's old Judy Benjamin problem, and that the max-entropy update is notorious for sliding probability mass around in quadrants the tip never mentioned, in a way that's hard to defend to a search commander who just wants to know where to send volunteers at 6am.

  We now have to write an actual SOP for how the team handles conditional tips like this before the next callout, and I got roped into drafting it since I'm the one who won't shut up about the philosophy of it. Could you write the memo for our methodology working group? I want it to recommend one concrete updating procedure (or a clear decision rule for choosing between procedures depending on how the tip is phrased), justify the choice against the alternative, and not pretend the losing method is stupid — it should say honestly why smart people keep reaching for minimum-cross-entropy updating even knowing about the Judy Benjamin result, and where our SOP should compensate for it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A small ham-radio-adjacent search-and-rescue (SAR) outfit.
      *   **Problem:** How to update probability grids based on *conditional* witness tips (e.g., "If X, then probably Y") during a search.
      *   **Conflict:** Team split between Jeffrey Conditionalization (or similar direct updating) vs. Minimum Cross-Entropy (MinxEnt/MaxEnt) updating.
      *   **Specific Reference:** The "Judy Benjamin Problem" (van Fraassen), where MinxEnt leads to counter-intuitive results (shifting mass in unrelated areas).
      *   **Task:** Write a Standard Operating Procedure (SOP) memo for the methodology working group.
      *   **Requirements:**
          *   Recommend one concrete procedure or a clear decision rule.
          *   Justify the choice against the alternative.
          *   Acknowledge the validity/appeal of the "losing" method (MinxEnt) honestly (it's not stupid, smart people use it).
          *   Explain where the SOP compensates for the known pitfalls (Judy Benjamin issue).
          *   Tone: Professional, operational, grounded in SAR reality but intellectually honest.

  2.  **Deconstruct the Technical/Philosophical Core:**
      *   *The Scenario:* We have a prior distribution $P$ over a partition (grid quadrants). We receive evidence $E$.
      *   *Direct Evidence:* "She was seen in Quadrant 5." -> Easy Bayesian update.
      *   *Conditional Evidence:* "If she went North, she is likely on the Ridge." This constrains the *conditional* probabilities, not directly the absolute probabilities of the partition.
      *   *Jeffrey Conditionalization:* Usually used when evidence changes the probabilities of a partition directly (e.g., "I'm 80% sure the light is red"). In this context, the user mentions it as "straightforward... on the conditional statement." This might be a slight misuse of terms by the volunteer, or they mean treating the conditional as a constraint on the sub-partition. Let's interpret "Jeffrey-style" here as *constraining the relevant subspace and renormalizing locally* vs. global optimization.
      *   *Minimum Cross-Entropy (MinxEnt):* Minimizes $D_{KL}(Q || P)$ subject to constraints. This is the "conservative" update. It changes the distribution as little as possible while satisfying the new info.
      *   *The Judy Benjamin Problem:* If you learn "If A, then B is 3x more likely than C," MinxEnt updates the probability of *not-A* in a way that depends on the specific numbers, often shifting mass in the "not-A" region even though the evidence was only about "A". This feels wrong intuitively (why does info about the Ridge change my belief about the Creek if she didn't go there?).
      *   *SAR Context:* Search Commanders need actionable, defensible maps. If the math shifts probability to a quadrant that makes no sense geographically just to satisfy an entropy constraint, volunteers waste time.

  3.  **Determine the Recommendation:**
      *   *Option A (MinxEnt):* Mathematically elegant, "least informative," but prone to Judy Benjamin artifacts (shifting mass in irrelevant areas). Hard to explain to a commander.
      *   *Option B (Local Renormalization / "Subspace Bayesian"):* Treat the conditional as applying *only* to the relevant subspace. If the tip is "If North, then Ridge," we update the probabilities within the "North" partition but leave the "South" partition's relative weights untouched (though the total mass of North vs. South might need adjustment based on the credibility of the premise).
      *   *Decision:* For SAR, *interpretability and operational stability* trump mathematical purity. The Judy Benjamin effect is a dealbreaker for field deployment.
      *   *Recommendation:* **Local Subspace Renormalization (LSR)**. (I need to give it a name that sounds SOP-appropriate). Let's call it "Conditional Subspace Updating."
      *   *Nuance:* We must acknowledge MinxEnt is good for *general* ignorance but bad for *specific* geographic constraints where independence assumptions fail.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Purpose:** Define how to handle conditional intelligence.
      *   **Background:** Briefly explain the conflict (Conditional tips vs. Grid updates). Mention the Judy Benjamin issue without getting bogged down in math.
      *   **Policy/Procedure:** The core recommendation.
          *   Step 1: Parse the condition (The "If").
          *   Step 2: Isolate the subspace.
          *   Step 3: Update within subspace.
          *   Step 4: Leave the complement alone (unless the *likelihood* of the condition changes).
      *   **Justification:** Why this over MinxEnt?
          *   Operational defensibility.
          *   Avoids "ghost shifts" (Judy Benjamin).
          *   Aligns with how commanders think (geographic independence).
      *   **Acknowledging the Alternative (MinxEnt):**
          *   Why do smart people like it? (Principle of Minimum Information, mathematical rigor).
          *   Where does it fail us? (It assumes logical connections between geographically distinct areas that don't exist in the field).
      *   **Compensation/Mitigation:** How do we handle the uncertainty that MinxEnt tries to solve? (Sensitivity analysis, commander override).

  5.  **Refining the Tone:**
      *   Needs to sound like a SAR volunteer wrote it (pragmatic, slightly technical but focused on the mission).
      *   Avoid condescension towards the "rationalist-blog-reader." Acknowledge their point is theoretically valid but operationally risky.
      *   Use SAR terminology (POA - Probability of Area, POD - Probability of Detection, Grid, Quadrant).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I distinguish Jeffrey Conditionalization from MinxEnt clearly?
      *   *Fix:* In the SAR context, the "Jeffrey" crowd likely means updating the conditional probability directly without global optimization. I should focus on the contrast between *Global Optimization (MinxEnt)* vs. *Local Constraint (Subspace)*.
      *   *Critique:* Is the Judy Benjamin explanation accurate?
      *   *Fix:* Keep it high-level. "Updating on a conditional changes the probability of the antecedent's complement in counter-intuitive ways."
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Provide a concrete example (Ridge vs. Creek).

  7.  **Final Polish:** Check the voice. Ensure it sounds like a memo intended for a working group, not a philosophy paper. (e.g., "At 0600 hours," "Search Commander," "POA").

  **(Self-Correction Note on "Jeffrey Conditionalization"):** The prompt says "Half the team wanted to fold this in with straightforward Jeffrey conditionalization on the conditional statement." Technically, Jeffrey Conditionalization is for when you don't learn a proposition with certainty, but rather a shift in probabilities over a partition. The volunteers might be misusing the term to mean "Just update the conditional probability $P(Ridge|North)$ and renormalize." I should address the *intent* (local update) rather than pedantically correct the terminology, but use precise terms in the SOP to avoid future confusion. I will frame the recommended method as "Partition-Local Updating."

  8.  **Finalizing the Recommendation:** I will recommend **Partition-Local Updating** (keeping the "Else" unchanged) over **Minimum Cross-Entropy** (global adjustment). This directly addresses the Judy Benjamin concern.

  9.  **Drafting the Content:** (Mental outline of the text)
      *   Intro: We need consistency.
      *   The Problem: Conditional tips ("If A, then B").
      *   The Options: MinxEnt (Global) vs. Local (Subspace).
      *   The Decision: Local.
      *   The Why: Judy Benjamin artifacts are operationally unacceptable.
      *   The Respect: MinxEnt is mathematically sound for information theory, just not for geography.
      *   The SOP: Steps to implement Local updating.

  10. **Final Review against constraints:**
      *   Recommend one procedure? Yes.
      *   Justify against alternative? Yes.
      *   Not pretend losing method is stupid? Yes.
      *   Compensate for pitfalls? Yes.

