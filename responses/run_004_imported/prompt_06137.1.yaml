answer: |-
  **MEMORANDUM**

  **TO:** Methodology Working Group, [Unit Name] Search & Rescue
  **FROM:** [Your Name/Call Sign], Planning Section
  **DATE:** October 26, 2023
  **SUBJECT:** SOP Draft: Handling Conditional Intelligence in Probability of Area (POA) Mapping

  ### 1. Purpose
  The purpose of this memo is to establish a Standard Operating Procedure (SOP) for updating Probability of Area (POA) grids when dispatch receives *conditional* witness intelligence. 

  Recent training exercises have highlighted a divergence in how the team processes tips of the form: *"If the subject passed Point X, they likely took Route Y."* Unlike direct sightings, these tips constrain the relationship between grid sectors rather than assigning probability to a specific sector directly. This memo recommends a specific updating protocol to ensure our search maps remain operationally defensible, mathematically consistent, and explainable to Incident Command.

  ### 2. Background: The Conditional Update Problem
  In Bayesian search theory, we typically update our prior distribution when we receive new evidence. However, conditional evidence creates a technical conflict between two valid mathematical approaches:

  1.  **Minimum Cross-Entropy (MinxEnt) Updating:** This method adjusts the entire probability grid to satisfy the new constraint while changing the prior distribution as little as possible (minimizing information gain). It is the standard choice in information theory when dealing with incomplete constraints.
  2.  **Partition-Local Updating:** This method applies the new constraint *only* to the specific geographic subspace mentioned in the tip, leaving the relative probabilities of all other sectors untouched.

  During the last tabletop drill, the team split on this issue. The debate mirrors a known problem in epistemology called the **Judy Benjamin Problem** (van Fraassen, 1980). 

  ### 3. Recommendation
  **The Planning Section shall adopt Partition-Local Updating as the standard procedure for conditional geographic intelligence.**

  **Procedure:**
  When a conditional tip is received (e.g., "If North of the Fork, then 80% chance on Ridge Trail"):
  1.  **Isolate the Antecedent:** Identify the grid sectors corresponding to the "If" condition (e.g., all sectors North of the Fork).
  2.  **Renormalize Locally:** Adjust the POA values *within* that subspace to match the conditional likelihood provided by the witness.
  3.  **Preserve the Complement:** Do **not** alter the relative POA weights of sectors outside the antecedent (e.g., South of the Fork), unless the credibility of the antecedent itself ("Did she go North?") is independently updated.
  4.  **Document:** Log the specific witness constraint and the subspace affected in the ICS-214 log.

  ### 4. Justification and Trade-offs
  We are explicitly choosing Partition-Local Updating over Minimum Cross-Entropy (MinxEnt). This decision requires an honest accounting of why MinxEnt is attractive and why we are rejecting it for field operations.

  #### Why Smart People Prefer MinxEnt
  The team members advocating for MinxEnt are mathematically correct in a general context. MinxEnt is the rigorous way to update beliefs when you want to remain "maximally non-committal" about unknown information. It prevents the planner from accidentally injecting bias into sectors the witness never mentioned. In abstract reasoning, or when variables are logically interconnected, MinxEnt is the gold standard for rationality. It ensures that the update is derived purely from the constraint and the prior, without arbitrary human intervention.

  #### Why MinxEnt Fails in SAR
  While MinxEnt is theoretically elegant, it exhibits the **Judy Benjamin Effect** in geographic search contexts. 

  In the Judy Benjamin scenario, learning a conditional fact about Region A causes the probability mass of *Region Not-A* to shift, even though the evidence said nothing about Region Not-A. The math slides probability around to maintain global entropy ratios. 

  **In a search context, this is operationally hazardous:**
  *   **Defensibility:** A Search Commander cannot justify sending a team to Quadrant 14 because a witness statement about Quadrant 5 mathematically shifted the entropy of the grid. Volunteers need to know *why* they are searching a specific box. "The entropy optimization algorithm moved mass here" is not an acceptable brief for a team leader at 0600 hours.
  *   **Geographic Independence:** In search theory, we generally treat distant quadrants as independent regarding subject behavior unless we have specific evidence linking them. MinxEnt assumes a logical coupling between all sectors that does not exist in the physical terrain. A clue on the Ridge Trail should not mathematically depress the probability of the Creek Trail unless there is a reason to believe the subject *must* be in one or the other globally.

  ### 5. Mitigation and Compensation
  Adopting Partition-Local Updating acknowledges that we are prioritizing **operational stability** over **theoretical purity**. To compensate for the risks of this approach, the SOP includes the following safeguards:

  1.  **Credibility Weighting:** The "If" condition must be assigned a credibility score (0.0–1.0). If the witness is unsure the subject even reached the fork, the total mass of the "North" subspace must be down-weighted before internal renormalization. This prevents us from over-committing to a subspace based on a hypothetical.
  2.  **Sensitivity Check:** The Planning Chief must review the updated map. If the Local Update creates a "cliff edge" (drastic probability drop-off at the boundary of the subspace), the Planning Chief is authorized to smooth the transition zone based on terrain continuity, documenting the override.
  3.  **Re-evaluation on Negative Results:** If a subspace is searched with high Probability of Detection (POD) and the subject is not found, the "If" condition may be invalidated. The SOP requires a full grid re-evaluation if the antecedent of a major conditional tip is effectively ruled out by search results.

  ### 6. Conclusion
  We are not claiming that MinxEnt is "wrong." It is a robust method for information processing. However, search and rescue is not purely an information processing problem; it is a resource allocation problem that requires human buy-in. 

  The Judy Benjamin result demonstrates that MinxEnt can produce counter-intuitive shifts in probability mass that are mathematically consistent but geographically unjustifiable. By adopting Partition-Local Updating, we ensure that our POA maps reflect the *geography* of the tip, not just the *logic* of the constraint. This keeps our methodology transparent for Incident Command and ensures our volunteers are deployed based on defensible intelligence.

  **Action Required:** Please review this draft by [Date]. We will finalize this SOP prior to the next quarterly callout.

  73s,

  [Your Name]
  Planning Section
