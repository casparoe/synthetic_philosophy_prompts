answer: |-
  You have hit on one of the most common and sharpest critiques of the MIRI decision theory project. Your intuition is well-founded: on **Newcomb's Problem**, Functional Decision Theory (FDT), Timeless Decision Theory (TDT), and Evidential Decision Theory (EDT) all yield the same output (one-box).

  If Newcomb's Problem were the only test case, your suspicion would be correct: FDT would look like EDT with extra steps and fancier vocabulary.

  However, the substantive difference lies in **which correlations count as actionable.** The claim of FDT/TDT is not that they agree with EDT everywhere, but that they agree with EDT *only where EDT is right* (Newcomb) and disagree where *EDT is wrong* (Smoking Lesion).

  Here is the breakdown of why the "logical dependence" language is not merely rebranding, but a technical patch for a specific failure mode in EDT.

  ### 1. The Smoking Lesion Problem (The Wedge)
  This is the canonical case where EDT and FDT diverge.

  **The Setup:** There is a genetic lesion that causes two things: (1) a high probability of lung cancer, and (2) a strong desire to smoke. Smoking itself does *not* cause cancer; it is merely a symptom of the lesion. You enjoy smoking.
  *   **CDT says:** Smoke. (Your action doesn't cause cancer.)
  *   **EDT says:** Don't smoke. (Smoking is bad news; it updates your probability of having the lesion upward.)
  *   **FDT/TDT says:** Smoke.

  **Why FDT differs from EDT here:**
  EDT conditions on the **action**: $P(\text{Cancer} | \text{Smoke})$. Because smoking is statistically correlated with the lesion, EDT treats the action as evidence of the lesion and forbids smoking to "avoid the news."

  FDT conditions on the **output of the decision algorithm**. It asks: "What happens if my decision function outputs 'Smoke'?"
  In the Smoking Lesion case, there is no **subjunctive dependence** between your decision algorithm and the lesion. The lesion is a physical state determined by genetics; it does not simulate your decision algorithm. Therefore, changing the output of your decision function does not logically imply a change in the state of the lesion.

  FDT captures the intuition that you should only treat a correlation as actionable if it arises from a shared logical structure (like a Predictor simulating you), not merely from a common physical cause that bypasses your agency.

  ### 2. Action vs. Algorithm
  The technical distinction is where you condition your counterfactuals.

  *   **EDT:** Evaluates $E[U | \text{I do } A]$. It treats the action as an observation.
  *   **FDT:** Evaluates $E[U | \text{My Algorithm outputs } A]$.

  In **Newcomb's Problem**, these converge.
  *   If I do $A$ (one-box), it is highly probable Omega predicted $A$.
  *   If my Algorithm outputs $A$, it is logically necessary that Omega's simulation (running the same algorithm) output $A$.
  In this specific case, the evidential correlation and the logical correlation align.

  In **Parfit's Hitchhiker** (where you must promise to pay a driver who can detect lies):
  *   **EDT** often fails (depending on formulation) because once you are in the city, paying is bad news (you've already been saved), or it struggles with the pre-commitment aspect.
  *   **CDT** fails (won't pay).
  *   **FDT** succeeds (pays) because it recognizes that the driver's prediction is logically dependent on the output of your decision algorithm *now*, even if the causal event is in the past.

  ### 3. Is it just "EDT with a filter"?
  You asked if this is just a rebrand to dodge EDT's bad reputation. In spirit, **yes**, but in mechanism, **no**.

  Yudkowsky and Soares have explicitly stated that they view FDT as an attempt to formalize the *correct intuitions* behind EDT while fixing its bugs. They agree with the EDT proponent that "correlations matter," but they disagree that *all* correlations matter.

  The "subjunctive dependence" language is the filter. It is an attempt to mathematically define the boundary between:
  1.  **Spurious Correlation:** (Smoking Lesion) Where conditioning on action leads to wireheading your own beliefs.
  2.  **Logical Correlation:** (Newcomb/Prisoner's Dilemma) Where conditioning on the algorithm captures the actual decision-theoretic leverage you have over the world.

  If FDT were just EDT rebranded, it would tell you not to smoke in the Smoking Lesion problem. Since it tells you to smoke, it is substantively different.

  ### 4. Why the "Logical" Talk Matters
  The reason for the heavy emphasis on "logical counterfactuals" and "subjunctive dependence" is to solve the **Reference Class Problem** that plagues EDT.

  EDT requires you to choose a reference class for your conditional probability.
  *   In Newcomb's, if you reference class "people who one-box," you win.
  *   In Smoking Lesion, if you reference class "people who smoke," you lose.

  How do you know *a priori* which reference class is the correct one to condition on? EDT has no formal answer; it relies on the user's intuition about what counts as "evidence."

  FDT attempts to objectify this. It says: The correct reference class is **instances of the same decision algorithm**.
  *   In Newcomb's, Omega's simulation runs *your* algorithm. Same algorithm = logical correlation.
  *   In Smoking Lesion, the lesion does not run *your* algorithm. Different mechanism = no logical correlation.

  This moves the burden from "What feels like evidence?" to "Is there a computational isomorphism?"

  ### 5. Summary
  You are right to be skeptical of the marketing. FDT is often presented as a revolution, when it is arguably an evolution of EDT. However, it is not *merely* a rebrand.

  1.  **Extensional Equivalence:** They agree on Newcomb, but diverge on Smoking Lesion, Psychopath Button, and certain Blackmail scenarios.
  2.  **Intensional Difference:** EDT conditions on actions (observations); FDT conditions on algorithm outputs (logical facts).
  3.  **The Fix:** FDT is essentially an attempt to build a "causal graph" that includes logical nodes, allowing it to keep EDT's ability to win in Newcomb-like scenarios without inheriting EDT's vulnerability to spurious correlations.

  If FDT didn't solve the Smoking Lesion problem, your critique would be fatal. Since it does solve it (by refusing to acknowledge the correlation as subjunctively dependent), the "logical dependence" machinery is doing substantive work, not just rhetorical heavy lifting.
