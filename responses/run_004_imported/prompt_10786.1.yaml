      *   *The "Safe" nuance:* The "Safe" refers to the guarantee that the delegates won't end up worse off than the *default expectation* (usually the default NE of the original game), even if the other party's delegate behaves unexpectedly (within reason) or if there's uncertainty about the game structure.
      *   *Key Insight from Oesterheld/Conitzer:* The "Safe" part is about *robustness to equilibrium selection*. If the original game has multiple equilibria, moving to a new game might shift equilibrium selection in a bad way. An SPI guarantees improvement relative to a *specific* default equilibrium, without requiring the agents to solve the equilibrium selection problem in the new game in a specific way, or it ensures the new game's equilibria are all better.
      *   *Actually, looking at the paper:* The core idea is that principals delegate to agents. The agents can agree to restrict their strategy spaces or modify payoff functions. An SPI is a joint modification such that *for any equilibrium* played in the modified game, the outcome is Pareto better than the *default equilibrium* of the original game.
      *   *Correction:* It's stronger. It's often about ensuring that even if we don't know exactly which equilibrium will be played in the new game, *any* reasonable equilibrium is better than the *specific* default equilibrium of the old game. Or, more commonly, it's about avoiding the risk that trying to coordinate on a better outcome leads to a coordination failure that is worse than the status quo.

      *   *Let's simplify for the user:*
          1.  **Standard PI:** A theoretical outcome comparison. "Outcome X is better than Outcome Y." Doesn't tell you *how* to get there.
          2.  **The Risk:** Trying to coordinate on X might fail. If it fails, you might end up at Z, which is worse than Y.
          3.  **SPI:** A protocol/modification where, if both agree, the *worst-case* reasonable outcome is still better than the default. It removes the risk of coordination failure making things worse.

