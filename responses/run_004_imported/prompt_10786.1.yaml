      *   *The Catch:* In standard mechanism design, there's a central planner who *enforces* the outcome. In multi-agent AI (delegated play), the agents *play* the game. There is no central enforcer.
      *   *The Problem:* If I suggest "Let's both play Strategy B instead of Strategy A because B is Pareto better," you might not trust me. You might think I'm lying about my payoffs, or you might think I'll defect once you commit. Or, more subtly, the *process* of agreeing to change the game might lead to a worse equilibrium if not handled correctly.
      *   *The "Safe" Part:* It's not about the outcome being safe (PI guarantees that). It's about the *agreement process* and the *default fallback* being safe. Specifically, SPIs are about modifying the *game* being played by the delegates in a way that guarantees a better outcome *regardless* of how the rest of the game shakes out, relative to a specific default equilibrium.
      *   *Refinement:* Actually, the core definition of SPI (Oesterheld/Conitzer) is about *delegates*. Principals hire delegates to play a game $G$. The delegates can agree to play a modified game $G'$ instead. An SPI is a modification $G'$ such that the outcome of $G'$ is Pareto superior to the outcome of $G$, *and* this holds robustly (often assuming the delegates play a specific equilibrium concept, like Nash, in both).
      *   *Wait, the user's confusion is deeper:* Why isn't a standard PI enough?
