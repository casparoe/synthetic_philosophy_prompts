answer: |-
  This is a sharp reading of Anscombe. You have correctly identified the "Closeness Problem" (or the problem of redescription) which is the canonical philosophical objection to the Doctrine of Double Effect (DDE) in warfare.

  To argue that this sinks Anscombe's case *on its own terms*, we don't need to appeal to consequentialism. We only need to show that the DDE machinery she relies upon cannot mechanically distinguish between Truman's action and actions that are traditionally permissible within the Just War framework (which Anscombe generally accepted, provided they weren't direct attacks on innocents).

  Here is the argument that the redescription problem collapses Anscombe's distinction, forcing her into a dilemma: either she must condemn standard Just War tactics (like blockades and industrial bombing) as murder, or she is smuggling in a non-DDE premise to do the heavy lifting.

  ### 1. The DDE Constraint and the "Means" Test
  Anscombe's charge rests entirely on the second condition of the DDE: *The bad effect (civilian death) must not be the means to the good effect (surrender/peace).*

  For Anscombe, Truman is guilty because the mechanism of surrender is **terror**. The causal chain is:
  1.  Drop Bomb.
  2.  Civilians die horrifically.
  3.  Japanese leadership sees this horror.
  4.  Leadership feels terror/pressure.
  5.  Leadership surrenders.

  Because the civilian death is the *stimulus* that causes the surrender (step 3 depends on step 2), the death is intended as a means.

  However, the DDE relies on the agent's description of their own action to determine intention. As you noted, descriptions are fungible. If we can redescribe Truman's action using the standard vocabulary of "strategic bombing" or "blockade," the DDE verdict flips from "Murder" to "Permissible Collateral."

  ### 2. The Redescription: "War Capacity" vs. "Terror"
  Anscombe insists the target was "civilians." But a Truman defender (operating within Just War theory) describes the target as **"Japan's political will and industrial capacity to wage war."**

  Under this description, the causal chain changes:
  1.  Drop Bomb.
  2.  Destroy urban center (which houses industry and government).
  3.  **Foreseen but unintended:** Civilians in the center die.
  4.  **Intended:** Japan's capacity to coordinate war and its *will* to continue is degraded.
  5.  Japan surrenders.

  Why is this redescription available? Because in total war, "will to fight" is a legitimate military target. If I bomb a munitions factory, I intend to reduce the will/capacity to fight. I know workers die. Anscombe accepts that worker death can be foreseen rather than intended if the *object* of the act is the destruction of the machine/capacity.

  But cities are just larger clusters of capacity. If the atomic bomb is described as "destroying the urban infrastructure necessary for command and control," the civilian death becomes a side effect of destroying the infrastructure, exactly like the workers in the factory.

  **The Trap:** If Anscombe says, "No, the bomb was too indiscriminate," she is no longer arguing about *intention* (DDE); she is arguing about *proportionality* or *discrimination* (technical feasibility). But DDE is supposed to handle cases where the act is otherwise permissible. If the act is impermissible because it *can't* distinguish combatants, that's a different argument than "Truman intended their deaths." If the technology existed to hit the city center precisely (which it did), the DDE intention test hinges entirely on how we describe the goal.

  ### 3. The Blockade Analogy (The Fatal Blow)
  The strongest internal critique comes from the naval blockade, a tactic Anscombe and most Just War theorists historically accepted as permissible.

  Consider a blockade of Japan:
  1.  Stop all food/fuel imports.
  2.  **Foreseen:** Civilians starve and die.
  3.  **Mechanism of Surrender:** The civilian population suffers, creating internal pressure on the government, or the government realizes the population cannot sustain the war effort.
  4.  Government surrenders.

  In a blockade, the suffering of civilians is **causally necessary** for the surrender. If the civilians didn't suffer, the government wouldn't feel the pressure to capitulate. The starvation is the *means* of coercion.

  **The Redescription Problem:**
  *   **Anscombe on Truman:** Civilians die -> Gov feels terror -> Surrender. (Death is intended means).
  *   **Anscombe on Blockade:** Civilians starve -> Gov feels pressure -> Surrender. (Starvation is foreseen side effect).

  Structurally, these are identical. In both cases, you are inflicting harm on innocents to generate political pressure on a regime. If Anscombe says the blockade is permissible because the *intent* is "stopping ships" not "killing civilians," she must allow Truman to say his intent was "destroying the city" not "killing civilians."

  If she insists Truman is different because the death is *instant* and *violent* rather than slow starvation, she has abandoned DDE. DDE is about the structure of the will, not the physical modality of the death. If the "closeness" of the connection between civilian harm and political surrender is the test, the blockade fails just as badly as the bomb.

  To save Truman from the "murder" charge using DDE, one only needs to adopt the blockade description: *"I intend to stop resources; the death is a regrettable byproduct of the resource stoppage which forces surrender."* Since Anscombe likely accepts the legitimacy of blockades (or at least, doesn't class them as *murder* in the same absolute sense), she has no principled DDE ground to reject this redescription for Truman.

  ### 4. The "Closeness" Collapse
  This leads to the "Closeness Problem." In philosophy of action, intention is often determined by how "close" the bad effect is to the plan.
  *   If I push a fat man off a bridge to stop a trolley, his body stopping the trolley is the means. (Impermissible).
  *   If I blow up a bridge to stop a trolley, and a bystander on the bridge dies, his death is a side effect. (Permissible).

  Anscombe treats Truman as the "fat man" case. But warfare makes this distinction porous.
  If I bomb a general's headquarters to decapitate command, and his family dies in the quarters, is their death a means? No, it's collateral.
  If I bomb a city to decapitate command, and the civilians die, is their death a means? Anscombe says yes, because it terrorizes.

  But why is "terrorizing via death" different from "pressuring via starvation" (blockade) or "pressuring via industrial collapse" (strategic bombing)? In all three, the civilian hardship is the lever moved to shift the government's decision.

  If Anscombe cannot distinguish the *intention* in the blockade case from the atomic case, then her DDE framework yields a contradiction:
  1.  Blockades are permissible (standard Just War view).
  2.  Blockades rely on civilian suffering as a means of pressure.
  3.  Therefore, using civilian suffering as a means of pressure is permissible.
  4.  Truman used civilian suffering as a means of pressure.
  5.  Therefore, Truman is permissible (by DDE standards).

  To avoid this, Anscombe must claim Blockades are *also* murder. But if she goes there, she has moved from a specific critique of Truman to a near-absolute pacifism regarding any coercion of states that impacts civilians. While she was a pacifist-leaning thinker, *Mr. Truman's Degree* was pitched as a specific indictment of a specific violation of the laws of war, not a rejection of all coercive warfare.

  ### 5. Conclusion: The Smuggled Premise
  The redescription problem sinks the argument because it reveals that DDE cannot do the work Anscombe asks of it without a prior normative rule.

  For Anscombe's argument to hold, she must assert: *"It is impermissible to describe the target as 'war will' when the method of affecting that will is instantaneous mass death."*

  But notice what that premise is. It is **not** an intention-based premise. It is a **method-based** constraint. It says, "Regardless of how you describe your intention, you cannot use *this kind* of harm to pressure a state."

  If that is the real argument, then the DDE talk about "intended vs. foreseen" is window dressing. The real work is being done by a rule that says *"Certain levels of civilian harm are intrinsically off-limits as tools of coercion, regardless of whether you call them means or side effects."*

  But if she admits that, she concedes that the DDE distinction isn't what saves the strategic bomber or the blockader; rather, those acts are saved by a separate convention of war that Anscombe is implicitly appealing to but not explicitly justifying via DDE.

  **The Verdict:**
  On strictly DDE terms, the "intention" is a mental act that is accessible only through the agent's description. Since the "Strategic/Blockade" description is available to Truman just as it is to a conventional commander, Anscombe cannot prove he *intended* death as a means without also proving that the Blockade commander *intended* starvation as a means.
  *   If she admits the Blockade commander didn't intend the means, she must acquit Truman (DDE failure).
  *   If she insists the Blockade commander did intend the means, she condemns standard Just War tactics (Overgeneralization failure).

  Therefore, the "murder" charge cannot rest on Double Effect alone. It requires an additional premise about the *intrinsic nature of nuclear weapons* that overrides the intention/foresight distinction—a premise DDE does not provide. Anscombe is right about the horror, but her specific philosophical mechanism (DDE) is too porous to sustain the specific charge of "murder" against Truman without collapsing the permissibility of 20th-century warfare entirely.
