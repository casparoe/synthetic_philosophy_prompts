prompt: |-
  Kind of a niche one but ive been down a rabbit hole on Anscombe's old pamphlet 'Mr Truman's Degree' (the one she wrote protesting Oxford giving Truman an honorary degree). Her whole case that Hiroshima and Nagasaki were flat out murder rests on double effect: the dead civilians weren't foreseen collateral from hitting a military target, they *were* the means -- thats how you terrorize a government into surrendering -- so no amount of 'it saved more lives than an invasion would've cost' arithmetic gets Truman off the hook.

  Except this is basically just the classic terror-bomber vs strategic-bomber case from the double effect literature, and the standard gripe with that case is that 'intended as means' vs 'merely foreseen side effect' is suspiciously easy to fudge through redescription -- you can describe the bomb's aim as 'destroy Japan's capacity and will to keep fighting' just as easily -- foreseen civilian deaths as a mere byproduct -- which is the same exact move that lets a 'legit' strategic bombing of a munitions factory or a naval blockade count as permissible.

  Please argue that this redescription/closeness problem actually sinks Anscombe's argument on its own terms: that anyone who accepts double effect generally has no principled way to stop the Truman case being redescribed into the 'permissible' bucket, so her murder charge either has to condemn a bunch of otherwise-sanctioned WW2 bombing and blockade tactics too, or it quietly needs some extra premise beyond intention-vs-foresight thats doing the real work. try to actually stay inside her framework rather than just falling back on 'consequentialism is true anyway, so who cares'.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Topic:** G.E.M. Anscombe's pamphlet *Mr. Truman's Degree* and her argument that the atomic bombings of Hiroshima and Nagasaki were murder based on the Doctrine of Double Effect (DDE).
      *   **Core Argument:** Anscombe claims the civilian deaths were intended as a *means* (terrorizing the government), not merely foreseen *side effects*. Therefore, consequentialist justifications (saving lives via avoiding invasion) don't apply.
      *   **User's Critique:** This relies on the "terror-bomber vs. strategic-bomber" distinction. The problem is "redescription" or the "closeness problem." One can redescribe the atomic bombing as aiming at "war capacity/will" where civilian death is a side effect, just like bombing a munitions factory or a naval blockade.
      *   **Task:** Argue that this redescription/closeness problem *sinks* Anscombe's argument *on its own terms* (within a deontological/DDE framework). Show that without extra premises, DDE cannot consistently distinguish Truman's case from other accepted WWII tactics (blockades, area bombing of industrial centers).
      *   **Constraint:** Do *not* fall back on "consequentialism is true anyway." Stay inside the Anscombe/DDE framework.

  2.  **Deconstruct Anscombe's Position:**
      *   **Premise 1:** Intentionally killing innocents is always wrong (murder).
      *   **Premise 2:** DDE distinguishes between *intended means/ends* and *foreseen side effects*.
      *   **Application:** Truman intended civilian death (to terrorize). Therefore, murder.
      *   **Implicit Contrast:** Conventional bombing of factories or naval blockades causes civilian death but is ostensibly permissible because the death is foreseen, not intended.

  3.  **Identify the Weak Point: The "Closeness" or "Redescription" Problem:**
      *   The distinction between "intending death as a means" and "foreseeing death as a side effect of destroying morale/capacity" is linguistically and psychologically fragile.
      *   If I bomb a factory to stop production, I know workers die. Is their death a means to stopping production (fewer hands) or a side effect?
      *   If I blockade a port to stop supplies, I know civilians starve. Is their starvation a means (pressure on gov) or a side effect (stopping ships)?
      *   Anscombe needs a principled way to say "Atomic Bomb = Intended Death" but "Blockade/Factory Bombing = Foreseen Death."

  4.  **Develop the Argument (Step-by-Step):**

      *   *Step 1: Establish the DDE criteria.* Briefly define the conditions for DDE (act is good/neutral, bad effect not intended, good effect not produced *by* bad effect, proportionality). Focus on the "not intended" clause.
      *   *Step 2: Apply the "War Will/Capacity" Redescription.* Show how Truman's action can be described exactly like a strategic bomber's action.
          *   Strategic Bomber: Target = Factory. Effect = Reduced capacity + Civilian Death. Intention = Reduce capacity.
          *   Truman: Target = City (as center of capacity/will). Effect = Surrender + Civilian Death. Intention = Surrender (via reduced capacity/will).
      *   *Step 3: The Blockade Analogy.* This is Anscombe's own blind spot. She supported the war effort generally. Blockades starve civilians to pressure governments.
          *   If blockade is permissible under DDE, then causing civilian suffering/death to pressure a government is permissible *if* described as "stopping goods."
          *   But the *mechanism* of pressure is identical: Civilians suffer -> Government feels pressure -> Surrender.
          *   In the atomic case: Civilians die -> Government feels terror/pressure -> Surrender.
          *   Why is "starvation pressure" distinct from "terror pressure" in terms of *intention*?
      *   *Step 4: The "Means" Ambiguity.* Anscombe says civilians were the *means*. But in the factory case, aren't the workers part of the "capacity"? If destroying the machine is the goal, destroying the operator is often functionally identical.
      *   *Step 5: The Conclusion within the Framework.* If Anscombe insists Truman is guilty of murder because of the *structure of intention*, she must logically condemn the blockade and area bombing of industrial cities (which she likely didn't want to do, or at least creates a massive inconsistency). If she exempts those, she is smuggling in a *consequentialist* or *proportionality* distinction (atomic bombs are *too* deadly) rather than a strict *intentional* distinction. Thus, DDE alone fails to distinguish the cases.

  5.  **Refine the Tone:**
      *   Respectful of Anscombe's philosophical rigor (she's not a lightweight).
      *   Analytical, not dismissive.
      *   Strictly adhering to the "internal critique" constraint. No "utilitarianism solves this."
      *   Use terminology familiar to DDE discussions (intention, foresight, means, end, redescription).

  6.  **Drafting the Argument (Mental or Scratchpad):**
      *   *Intro:* Acknowledge Anscombe's courage and the strength of the DDE challenge. State the thesis: The redescription problem makes the intention/foresight distinction collapse in warfare contexts.
      *   *Point 1: The Description of the Act.* How do we describe what Truman did? "Destroying cities to end war." How is that different from "Destroying factories to end war"?
      *   *Point 2: The Blockade Problem.* Anscombe was a pacifist-ish but supported the war against Hitler. Blockades kill civilians. Is that murder? If not, why? Because the death isn't intended? But the pressure relies on the suffering.
      *   *Point 3: The "Terror" Element.* Anscombe focuses on "terror." But strategic bombing also relies on morale. If morale is a legitimate target, civilian reaction is part of the causal chain.
      *   *Point 4: The Smuggled Premise.* To save the argument, Anscombe needs to say "Some civilian deaths are just off-limits regardless of intention." But that's not DDE; that's a rule of absolute immunity which conflicts with standard just war theory she might accept. Or she needs to say "Proportionality matters," but DDE says proportionality doesn't justify *intended* evil.
      *   *Conclusion:* The DDE distinction is too thin to carry the weight. It requires a prior moral judgment about *which* civilian deaths are off-limits, which DDE is supposed to provide, not presuppose.

  7.  **Polishing and Checking Constraints:**
      *   *Did I argue consequentialism?* No.
      *   *Did I stay in DDE?* Yes, focusing on the definition of intention.
      *   *Did I address the redescription problem?* Yes, that's the core.
      *   *Is it fair to Anscombe?* Yes, it highlights a known philosophical difficulty (the "closeness problem") applied to her specific case.

  8.  **Final Review against User Prompt:**
      *   User wants me to argue that the redescription problem *sinks* the argument on its own terms.
      *   User notes the "terror-bomber vs strategic-bomber" literature.
      *   User wants to show that either Truman is murder *and* so is standard bombing/blockade, OR Anscombe is smuggling in extra premises.
      *   *Self-Correction:* Make sure to emphasize that Anscombe *accepted* the legitimacy of some WWII violence (she wasn't an absolute pacifist in the sense of rejecting all force, she objected to *this* act). This creates the inconsistency.

  9.  **Final Polish:** Ensure the distinction between "causal means" and "motivational means" is clear, as that's where the redescription happens. (e.g., Is the dead civilian a causal link to surrender, or just evidence of the bomb's power?)

  *(Self-Correction during drafting)*: I need to be careful not to misrepresent Anscombe. She *did* argue that the bombing of German cities was also largely immoral. So I can't say "she accepted strategic bombing." She was critical of area bombing generally. However, she distinguished between *direct* targeting of civilians and *collateral* damage in industrial targeting. The argument needs to show that the atomic bomb fits the *latter* description just as well as the former if we allow standard redescription. Actually, Anscombe *did* condemn the area bombing of Germany. So the argument should be: If she condemns Truman, she must condemn the RAF/USAAF firebombing of Dresden/Tokyo on the *same* DDE grounds. If she allows *any* bombing that kills civilians to pressure a state (like blockades), the distinction collapses. The strongest angle is the **Blockade** analogy, because blockades were standard Just War practice, yet they functionally rely on civilian suffering to pressure the state.

  Let's focus on the **Blockade** and the **Industrial Target** redescription.

  *Plan:*
  1. Define the DDE constraint (Intention vs. Foresight).
  2. Show the Redescription Move (Truman as Strategic Bomber).
  3. The Blockade Analogy (The "Pressure" Mechanism).
  4. The "Closeness" Collapse (Why intention can't be parsed out).
  5. Conclusion: DDE requires a prior normative rule it doesn't possess.

