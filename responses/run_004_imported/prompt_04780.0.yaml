answer: |-
  This is a sophisticated and central problem in the philosophy of action and decision theory. For a dissertation chapter, you need to move beyond the surface-level intuition that "resolute choice is just willpower" and engage with the structural implications for the theory of rational agency.

  The core tension lies between **Dynamic Consistency** (the requirement that plans made today must be executable by your future self without revision) and **Separability** (the requirement that choices at a node depend only on the future consequences available from that node, not on how you got there).

  Here is an exposition of the strongest objection to McClennen's resolute choice (the "Pyrrhic Victory" charge) and the robust defense available to the resolute chooser, structured for integration into a dissertation argument.

  ---

  ### I. The Charge: Why Resolute Choice is a Pyrrhic Victory

  The objection that resolute choice is a "Pyrrhic victory" asserts that while McClennen's agent avoids monetary exploitation, they do so by violating a deeper norm of rational agency. The agent saves their wallet but sacrifices their integrity as a rational chooser. The strongest version of this objection rests on three pillars: the Violation of Separability, the Problem of Normative Force (The "Dead Hand"), and the Alienation of the Agent.

  #### 1. The Violation of Separability and Consequentialism
  The most technical and damning objection comes from the commitment to **Separability** (often associated with Machina, Seidenfeld, and Hammond). Separability dictates that when an agent arrives at a decision node, their choice should depend only on the sub-tree of consequences available from that point forward. The history of how they arrived at the node should be irrelevant.

  *   **The Objection:** In a money pump scenario (e.g., $A \succ B \succ C \succ A$), when the agent reaches the node where they hold $B$ and are offered a trade to $A$, the local preference is $A \succ B$. A resolute chooser refuses the trade.
  *   **The Cost:** By refusing the trade, the agent is choosing an option ($B$) that is strictly dominated by the available alternative ($A$) *relative to their current preferences*. This violates a basic tenet of consequentialism: if you are at a node, you ought to maximize value from that node forward.
  *   **The Pyrrhic Nature:** The agent avoids the pump only by acting *against* their own all-things-considered judgment at the moment of choice. If rationality is defined as responsiveness to reasons, and the reasons at $t_2$ favor the trade, then refusing the trade is irrational. The agent has avoided *instrumental* failure (losing money) by committing *deliberative* failure (ignoring current reasons).

  #### 2. The Problem of Normative Force (The "Dead Hand")
  This objection, championed by critics like Wlodek Rabinowicz and John Broome, questions the authority of the past self over the future self.

  *   **The Objection:** Why should the $t_2$ self be bound by the $t_1$ self's plan? Unless there is an external contract, the $t_1$ self's intention is merely a prediction or a wish. For the $t_2$ self to treat a past intention as a binding reason for action, despite current preferences dictating otherwise, requires a mysterious normative mechanism.
  *   **The Cost:** This creates a fragmented agency. It implies that the agent is not a unified temporally extended being, but a sequence of time-slices where the earlier slice tyrannizes the later slice. Rabinowicz argues this leads to a form of "schizophrenic" agency where the agent at $t_2$ is not acting on their own judgment but acting as a puppet of $t_1$.
  *   **The Pyrrhic Nature:** You avoid exploitation, but you cease to be an autonomous agent at the moment of choice. You become a "slave to the plan." If rationality requires autonomy (self-governance according to current judgment), resolute choice destroys rationality to save consistency.

  #### 3. The Distinction between Sophistication and Resolution
  Critics often point out that standard decision theory already has a solution to dynamic inconsistency: **Sophistication** (backward induction). A sophisticated agent anticipates their future irrationality and avoids the nodes where they would be exploited.
  *   **The Objection:** Resolute choice is unnecessary and costly because a sophisticated agent simply refuses to enter the money pump sequence at $t_1$.
  *   **The Cost:** McClennen argues sophistication leads to "decision-theoretic paralysis" in some cases (e.g., Newcomb-like problems or certain sequential trades where entering the sequence is beneficial *if* you can stay the course). However, the critic argues that if you cannot stay the course without violating separability, you *shouldn't* enter the sequence.
  *   **The Pyrrhic Nature:** Resolute choice claims to expand the agent's opportunity set compared to sophistication. But it does so by allowing the agent to make choices they explicitly judge to be suboptimal at the time of execution. The "gain" in opportunity is purchased with the currency of practical incoherence.

  ---

  ### II. The Defense: Resolute Choice as Genuine Rationality

  A defender of McClennen (drawing on McClennen's *Rationality and Dynamic Choice*, and support from Michael Bratman's planning theory) must argue that the objections above rely on a flawed, "Humean" or "time-slice" conception of agency. The defense re-frames rationality from *local optimization* to *global plan-management*.

  #### 1. Rejecting Separability as a Rational Requirement
  The core of the defense is the denial that Separability is a norm of rationality.
  *   **The Argument:** Separability assumes the agent is a series of distinct choosers. If the agent is a **temporally extended planner**, then the history of the choice *is* relevant. The fact that "I chose this plan at $t_1$" is a new reason available at $t_2$ that was not available to a stranger arriving at the same node.
  *   **The Rebuttal to Consequentialism:** The defender argues for a form of **Plan-Consequentialism**. The value of an action is not just the outcome of the specific trade, but the outcome of the *policy* of which that trade is a part. If choosing $A$ over $B$ at $t_2$ triggers a policy that leads to a money pump, then the *consequence* of choosing $A$ is actually the pumped outcome, not the local gain. Therefore, resolute choice is consistent with consequentialism if consequences are evaluated globally.

  #### 2. The Normative Force of Plans (Bratmanian Support)
  To answer the "Dead Hand" objection, the defender appeals to the constitutive role of plans in human agency (Michael Bratman).
  *   **The Argument:** Plans are not merely predictions of future behavior; they are **reason-giving states**. Once an agent adopts a plan, the existence of the plan itself provides a reason to follow through, independent of the local preferences at the time of execution. This is necessary for cross-temporal coordination.
  *   **The Rebuttal to Fragmentation:** The agent is not fragmented. The $t_2$ self endorses the $t_1$ self's authority because the $t_2$ self recognizes that without this norm of stability, they cannot achieve complex, long-term goals. The "binding" is not external coercion; it is internal recognition of the normative weight of one's own prior intentions.
  *   **The Gain:** This preserves autonomy. The agent is not a slave to the past; they are exercising a higher-order capacity to govern themselves over time.

  #### 3. Re-interpreting "Preference" and "Choice"
  The defender must address the claim that the agent is choosing against their preference.
  *   **The Argument:** The money pump argument assumes preferences are revealed by local choices. The resolute chooser argues that **true preference is global**.
  *   **The Rebuttal:** At $t_2$, the agent feels a *local inclination* toward the trade, but their *all-things-considered preference* includes the value of resoluteness. If the agent values being a non-exploitable planner, then at $t_2$, they genuinely prefer (Plan-Adherence + $B$) over (Plan-Abandonment + $A$).
  *   **The Gain:** This dissolves the accusation of akrasia. The agent is not acting against their judgment; their judgment has incorporated the requirement of diachronic coherence. The "cost" of ignoring local inclination is not a rationality cost; it is the necessary friction of rational planning.

  ---

  ### III. Synthesis for the Dissertation: The Stalemate of Agency

  For your chapter, the crucial insight is that the debate between the Money Pump critic and the Resolute Choicer is not resolvable within decision theory alone. It is a dispute about the **metaphysics of agency**.

  1.  **The Humean/Time-Slice View:** If you view the agent as a locus of current desires and beliefs, Resolute Choice is irrational (a Pyrrhic victory). It requires the agent to act against their current strongest reason. The cost of "alienation from current self" is indeed as high as the cost of exploitation.
  2.  **The Planning/Extended View:** If you view the agent as a temporally extended entity constituted by plans, Resolute Choice is the *only* rational option. Separability is the error. The cost of "exploitability" is the true irrationality, and resolute choice is the mechanism of coherence.

  **The "Pyrrhic" verdict persists in the literature because:**
  Most formal decision theorists implicitly adopt the Time-Slice View (or Consequentialist Separability) as an axiom. To them, McClennen's solution looks like "changing the subject" or "defining rationality as success rather than coherence." They argue that if you have to *force* yourself to be rational via resolution, you weren't rational to begin with.

  **How to frame the conclusion:**
  You can argue that McClennen's solution is only a Pyrrhic victory if one accepts **Separability** as a non-negotiable constraint on rationality. If one treats Separability as a contingent feature of specific types of agents (e.g., sophisticated maximizers) rather than a universal norm, Resolute Choice emerges as a robust model of **diachronic agency**. The "cost" of resolute choice is not a loss of rationality, but the cognitive burden of maintaining a planning stance. The money pump shows that *local* rationality is insufficient for *global* success; Resolute Choice argues that rationality must be defined globally.

  ### Key References to Anchor the Argument
  *   **Edward McClennen:** *Rationality and Dynamic Choice* (1990) – The primary source for the defense.
  *   **Wlodek Rabinowicz:** "Money Pump with a Signal" (1995) or his work on dynamic choice – Strongest critic regarding the "schizophrenic" nature of resolution.
  *   **Michael Bratman:** *Intention, Plans, and Practical Reason* (1987) – Provides the philosophical machinery (planning agency) to support McClennen against the "Dead Hand" objection.
  *   **John Broome:** *Rationality Through Reasoning* (2013) – Discusses the normative requirements of coherence vs. reasoning.
  *   **Isaac Levi:** – Often critical of the Bayesian/Decision theoretic constraints that make resolution look problematic.

  This structure should allow you to present the objection not merely as a technical quibble, but as a fundamental challenge to the nature of the agent, which McClennen meets by proposing a richer ontology of agency.
