answer: |-
  Here are two statistical claims regarding a country's workforce over a ten-year period (2010–2020), analyzed through the strict constraints of Otto Neurath's ISOTYPE methodology.

  ### Claim 1: The Renderable Stock
  > **"The number of coal miners increased from 10,000 in 2010 to 15,000 in 2020."**

  **The ISOTYPE Rendering:**
  *   **Unit Value:** One pictogram of a miner (helmet, pickaxe) = 1,000 workers.
  *   **Composition:** Two distinct panels.
      *   Panel A (labeled 2010 via a neutral numeral): A row of 10 identical miner icons.
      *   Panel B (labeled 2020 via a neutral numeral): A row of 15 identical miner icons.
  *   **Verdict:** This is faithful to the system. The icon represents a physical reality (a person performing a specific, tool-defined task). The quantity is represented by repetition (10 icons vs. 15 icons), adhering to Neurath's rule against scaling. The time difference is shown via spatial sequence (panel A then panel B). While it requires numerals for the specific year and unit value, the *truth of the statistic* is contained in the visual arrangement.

  ### Claim 2: The Unrenderable Status
  > **"The unemployment rate fell from 8% to 5% over the decade."**

  **The ISOTYPE Attempt:**
  *   **Unit Value:** One pictogram of a person = 1% of the labor force? Or 1 person = 1 unemployed worker?
  *   **Composition:** To show a "rate," you ideally need a grid of 100 units representing the total labor force, with 8 highlighted in 2010 and 5 highlighted in 2020.
  *   **The Breakdown:** To highlight the "unemployed" units, you must use a different icon or color for them (e.g., a person with a cap vs. a person with a helmet).
  *   **Verdict:** This fails structurally without heavy word-language support. A pictogram of a "person with a cap" does not visually equal "economically unemployed." That person could be retired, a student, or a farmer on holiday. The visual distinction implies a *physical* difference, but unemployment is a *legal/behavioral* status.

  ### The Boundary: What Claim 2 Needs
  The second claim requires **stipulative definition of invisible criteria**, which mere icon arrangement cannot supply.

  ISOTYPE operates on **ostension**: it points to things that exist in the world and can be recognized by their shape (a miner has a pickaxe; a factory has a smokestack). It assumes a universal visual truth: *if you see the icon, you recognize the object.*

  Claim 2 fails because "unemployment" is not a visual object; it is a **social contract**. To be "unemployed" in a statistical sense, a person must:
  1.  Be without work.
  2.  Be available for work.
  3.  Have *actively sought* work in a specific prior period.

  None of these three criteria are visible. You cannot draw "actively sought." If you create a specific icon for it (e.g., a person holding a newspaper), you are lying visually, because not all unemployed people hold newspapers, and many who hold newspapers are employed.

  Therefore, to render Claim 2 faithfully, you must borrow **word-language** to perform two functions that icons cannot:

  1.  **Negation:** Icons show presence. Statistics often rely on absence (no job, no search). Language can define a category by what it is *not*; ISOTYPE can only show what *is*.
  2.  **Arbitrary Boundary Setting:** Language allows us to agree that "searching in the last 4 weeks" counts, but "searching 5 weeks ago" does not. An icon is timeless and static; it cannot encode a bureaucratic time-window without a textual legend that effectively replaces the icon's semantic load.

  **The Precise Boundary:**
  ISOTYPE can visualize **quantities of physical states** (how many miners, how many cars). It cannot visualize **quantities of abstract definitions** (how many unemployed, how many underemployed) without the text doing the heavy lifting of defining the category. The icon becomes a mere placeholder for the word, losing Neurath's dream of a word-independent understanding. The boundary lies where the statistic measures **human intent or legal status** rather than **physical presence.**
