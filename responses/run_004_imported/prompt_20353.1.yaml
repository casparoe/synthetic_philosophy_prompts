answer: |-
  Good morning, everyone. Welcome to our spring workshop. It's great to see faces from all six partner schools filling the room.

  If you've been to this workshop before, you know what comes next. If you're new, you're about to experience a tradition that, on paper, sounds a little strange. In a moment, we're going to pair you up with someone from a different school. You will not know their name. You will not speak to them. You will never meet them again. You'll play a single round of a simple game—a Prisoner's Dilemma—and then it's over. No retaliation, no reputation to build, no future consequences.

  By the standard logic most of us learn in economics or civics class, there is only one rational move here: Defect. If they cooperate, you do better by defecting. If they defect, you *still* do better by defecting. Causally, your choice cannot change theirs. The card is already in their hand, or it isn't.

  And yet, for years, this club has opened by asking you to cooperate. Why?

  We do it to honor a specific, controversial, and fascinating idea in decision theory. Some of you in the back—I see you nodding—already know where I'm going. You've read about superrationality, acausal trade, or Evidential Cooperation in Large Worlds. For the rest of you, here is the gist:

  We live in a universe that is unfathomably vast. Possibly infinite. In a universe that big, there are likely many agents—many minds—reasoning through problems in exactly the way you are right now. They are causally disconnected from you; you can't call them on the phone. But they are *logically* connected to you. They are running the same mental algorithm.

  When you sit here and decide to cooperate, you aren't just making a choice for this room. You are generating evidence about what all those other similar agents, across the cosmos, are deciding in their own versions of this game. If you reason that "cooperation is the right move," then other agents reasoning like you will likely conclude the same. By cooperating, you aren't causally forcing their hand, but you are "voting" for a universe where cooperation wins.

  Now, I want to be honest with you. This is not settled science. If you go to graduate school for philosophy or economics, you will find brilliant people who vehemently disagree with this. They argue that correlation isn't influence, and that you should only care about what you can causally change. They say treating your decision as evidence of another's is a kind of magic thinking.

  They might be right. This is less of a mathematical proof and more of a philosophical wager.

  So, why do we do it? Why start our day with a wager?

  Because Effective Altruism isn't just about calculating the known variables. It's about asking how we want to reason when the variables are unknown. It's about asking: Do we want to be the kind of agents who defect because we're afraid? Or do we want to be the kind of agents who cooperate because we hope to find others like us?

  For the veterans in the room: This is a chance to put your principles under pressure. It's easy to talk about acausal cooperation in a reading group; it's harder when there are points on the line and a stranger staring you down.

  For the newcomers: You don't have to fully buy the theory to buy into the community. Even if the universe is small, even if this is just a game, we are building a norm here. We are signaling to each other that we trust our shared reasoning more than we fear being exploited.

  We are asking you to take a leap of faith—not in a supernatural sense, but in a rationalist one. We are asking you to act as if your reasoning matters, even when the causal chain is invisible.

  So, when you find your partner, look them in the eye. You don't need to speak. But recognize that in this moment, you are testing a hypothesis about trust, about logic, and about the kind of world we want to live in.

  Whether you think this is profound decision theory or just a nice icebreaker, the goal is the same: Play in good faith. Let's see what happens when we choose to cooperate.

  Thank you, and let's begin.
