prompt: |-
  My mom passed away back in March, and ever since then my sister and I have been stuck in this awful standoff over her estate, mainly the house and some savings the will split up kind of vaguely between the two of us. We each hired our own probate lawyer, and totally independently, both lawyers gave us basically the same advice: send the other side one firm, "final" number in writing right away and don't move off it, because whoever moves first supposedly loses the negotiation. So obviously I did that, and it turns out my sister sent me her own "final" number, way lower than mine, on literally the same afternoon. That was almost two months ago now. Neither of us has budged an inch since, even though whenever we talk on the phone about anything else we still get along fine, and I honestly think we'd both accept something reasonable in the middle if the other person offered it first.

  Meanwhile we're each paying a lawyer by the hour, the house is just sitting there empty racking up bills, and it feels like every week this drags on does alot more damage to our actual relationship than the money at stake is worth. What really gets me is that the exact strategy that was supposed to protect our interests is the thing now making sure neither of us can move without feeling like we "lost." A friend who's really into economics heard the whole story and said something offhand about it being a classic type of situation, but got pulled away before she could explain what she meant. Is there some established way of thinking about what's actually going on here? And if so, does it suggest any realistic way for two people to get unstuck from something like this, short of one of us just caving first?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Mother passed away in March. Sister and user are in a standoff over the estate (house + savings).
      *   **The Will:** Vague about splitting assets between the two.
      *   **Legal Advice:** Both hired separate probate lawyers. Both lawyers gave the *same* advice: Send a "final" number in writing, don't move off it, whoever moves first "loses."
      *   **The Outcome:** Both sent "final" numbers on the same afternoon (user's high, sister's low). No movement for 2 months.
      *   **Relationship:** Still get along on other topics, but this issue is damaging the relationship. Both would likely accept a middle ground if the other offered first.
      *   **Costs:** Paying lawyers hourly, house sitting empty (carrying costs), emotional toll.
      *   **The Core Problem:** A strategic deadlock caused by bad advice/strategy where moving first is perceived as losing.
      *   **The Question:** Is there an established way of thinking about this (economics/game theory)? Is there a realistic way to get unstuck without one person just "caving"?

  2.  **Identify the Economic/Game Theory Concept:**
      *   The friend mentioned economics.
      *   The situation involves two parties, conflicting interests, strategic decision-making, and a outcome where both are worse off due to non-cooperation.
      *   *Prisoner's Dilemma?* Close, but that's usually about betraying vs. cooperating.
      *   *Game of Chicken?* Very close. Two drivers heading at each other, whoever swerves loses. If neither swerves, both crash.
      *   *Nash Equilibrium?* Yes, the current standoff is a bad equilibrium.
      *   *Coordination Problem?* Yes.
      *   *The specific dynamic:* This is a **Game of Chicken** (or Hawk-Dove game) combined with a **Coordination Failure**. The lawyers advised them to play "Chicken" (commit to a position, don't swerve), but since *both* played it, they are on a collision course.
      *   *Another angle:* **The Bargaining Problem** (Nash Bargaining Solution). The "final offer" strategy is a tactic to shift the bargaining zone, but it froze the zone.
      *   *Key Term:* **Commitment Strategy** (Schelling). By saying "this is final," you try to bind your hands. But if both bind hands, no deal happens.
      *   *Most accurate label:* **Game of Chicken** is the most intuitive layperson explanation. **Prisoner's Dilemma** is often misused but fits the "both worse off" aspect. However, the "who moves first loses" dynamic is classic Chicken.
      *   *Wait, there's a better fit:* **The War of Attrition**. Both sides wait for the other to give up, incurring costs over time. This fits the "paying lawyers," "house racking up bills," and "time dragging on" aspect perfectly.
      *   *Actually, the best fit for the "final offer" deadlock:* **Coordination Failure within a Bargaining Game**. But the friend likely referred to the **Prisoner's Dilemma** or **Game of Chicken**. Let's lean into **Game of Chicken** for the "who swerves" aspect and **War of Attrition** for the cost aspect.
      *   *Refinement:* The specific advice ("send a final number, don't move") creates a **Commitment Problem**. In game theory, this is often discussed under **Thomas Schelling's** work on conflict and strategy.
      *   *Decision:* I will explain the **Game of Chicken** (for the standoff) and the **Prisoner's Dilemma** (for the suboptimal outcome), but specifically highlight the **War of Attrition** (for the bleeding costs). I should also mention **Nash Equilibrium** (the stuck point).

  3.  **Address the "Why" (The Lawyers' Role):**
      *   Lawyers are adversarial by training. Their incentive is to win the negotiation, not necessarily to maximize net value (fees vs. settlement speed).
      *   They advised a "Commitment Strategy." It backfired because both did it.

  4.  **Develop Solutions (How to get unstuck):**
      *   *Problem:* Saving face. "If I move, I lose."
      *   *Solution 1: Reframe the "Loss".* Moving isn't losing; the *situation* is losing.
      *   *Solution 2: Third Party Mediation.* A neutral mediator (not a judge) can propose the middle ground so neither sister "caves" to the other. They cave to the *mediator*.
      *   *Solution 3: Change the Payoff Structure.* Make the cost of waiting explicit and shared. (e.g., "Every week we wait, we both lose $X").
      *   *Solution 4: The "Face-Saving" Move.* Package the concession as something else (e.g., "I'm doing this for Mom's memory," or "My lawyer told me the tax implications changed").
      *   *Solution 5: Randomization/Arbitration.* Flip a coin? Binding arbitration?
      *   *Best Practical Advice:* **Mediation**. It allows a neutral third party to suggest the compromise, allowing both sisters to accept it without feeling they surrendered to the *other*.

  5.  **Drafting the Response:**
