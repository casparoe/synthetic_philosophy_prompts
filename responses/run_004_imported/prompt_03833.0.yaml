  *(Self-Correction during drafting)*: I should be careful not to bash the lawyers too hard. They are acting in a traditional adversarial role. The issue is that litigation/negotiation tactics don't always work for family estates where relationship preservation matters. I will frame it as "misaligned incentives" regarding the *relationship* vs. the *asset*.

