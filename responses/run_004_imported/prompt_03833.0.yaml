answer: |-
  First, I am so sorry for your loss. Dealing with an estate is hard enough without the added weight of grief, and it is incredibly painful when a process meant to settle your mother's wishes ends up straining the relationship between her children. You are right to feel that the cost—both financial and emotional—is outweighing the benefit of "winning" the negotiation.

  Your friend was likely referring to concepts from **Game Theory**, a branch of economics and mathematics that studies strategic decision-making. There are actually two specific models that describe exactly what is happening to you and your sister.

  ### 1. The Game of Chicken
  This is the most direct fit for the "whoever moves first loses" dynamic. Imagine two drivers speeding directly toward each other. The first one to swerve is the "chicken" (the loser). But if *neither* swerves, they crash, and both are severely injured.

  Your lawyers advised you to play a "Commitment Strategy." By sending a "final" number in writing, you effectively took your hands off the steering wheel and threw the wheel out the window, signaling to your sister, *"I cannot swerve even if I wanted to."* The problem is that your sister did the exact same thing. Now you are both on a collision course. In Game Theory, this is a **coordination failure**. You are both stuck in a **Nash Equilibrium** where neither of you has an incentive to change your position unilaterally, even though the current outcome (the crash) is worse for both of you than a compromise would be.

  ### 2. The War of Attrition
  This model describes a contest where two sides compete for a resource by persisting over time, but the longer the contest goes on, the more it costs both parties.

  Every week you wait, you pay legal fees, the house incurs maintenance costs, and the emotional toll mounts. In a War of Attrition, the rational move is often to quit early to minimize losses, but pride and the "sunk cost" of the past two months keep you in the game. The tragedy of this game is that the "winner" often ends up with a Pyrrhic victory—they get the asset, but the legal fees and relationship damage cost more than the asset was worth.

  ### Why the Lawyers' Advice Backfired
  Your lawyers weren't necessarily "wrong" in a vacuum; in a standard adversarial negotiation (like a personal injury suit), anchoring with a firm number is a common tactic. However, they are trained to be **adversarial**, not **collaborative**. Their incentive structure is also slightly misaligned with yours:
  *   **Your Goal:** Maximize net value (Money minus Fees minus Relationship Damage).
  *   **Their Goal:** Maximize your position in the negotiation (which often justifies more hours billed).

  By advising you both to lock into "final" positions immediately, they removed the flexibility needed for a deal. Since you both did it simultaneously, the tactic neutralized itself and created a deadlock.

  ### How to Get Unstuck (Without "Caving")
  The key to solving a Game of Chicken is to find a way for one or both parties to swerve *without losing face*. If you simply call your sister and say, "Okay, I'll take less," you feel like you lost, and she feels like her strategy worked (which might encourage her to be difficult in the future).

  Here are three realistic ways to break the deadlock:

  **1. Hire a Neutral Mediator (The Best Option)**
  Instead of negotiating sister-vs-sister or lawyer-vs-lawyer, you hire a neutral third-party mediator (often a retired judge or a specialized estate mediator).
  *   **Why it works:** The mediator can propose the "middle ground" number. When you accept it, you aren't caving to your *sister*; you are accepting the advice of a *neutral professional*.
  *   **The Face-Save:** You can tell your lawyer, "The mediator recommended this, and I think it's prudent to follow." Your sister can do the same. Neither of you has to admit the other was right.
  *   **Cost:** It costs money, but likely less than two more months of two separate probate lawyers billing hourly.

  **2. Change the Mandate to Your Lawyers**
  Currently, your lawyers are acting as shields. You need to turn them into bridges. You can send a joint instruction (or have your lawyers communicate) that changes the rules of engagement.
  *   **The Script:** "We recognize that our current 'final offer' positions are creating a deadlock that harms the estate. We are instructing counsel to meet and find a midpoint that splits the difference, or to recommend a mediator. We are prioritizing speed and cost-efficiency over holding the line."
  *   **Why it works:** It takes the personal pressure off you. You aren't moving your number; you are changing the *strategy*.

  **3. Quantify the "Burn Rate"**
  Sometimes people stay in a War of Attrition because the costs feel abstract. Make them concrete.
  *   **The Action:** Create a simple spreadsheet. List the monthly mortgage, taxes, insurance, utilities, and the estimated legal fees for both sides.
  *   **The Conversation:** Send this to your sister (or have your lawyer send it to hers) with a note: "I love you and I don't want to fight. But this spreadsheet shows we are losing $X,000 every month we stay stuck. That's money Mom would have wanted us to have, not the lawyers. Let's find a way to stop the bleeding."
  *   **Why it works:** It reframes the enemy. The enemy is no longer *each other*; the enemy is the *burn rate*. You are now allies fighting against the costs.

  ### A Suggestion for the Next Step
  Since you mentioned you still get along on the phone about other things, you have a massive advantage: **trust.**

  In your next call, don't talk about the numbers. Talk about the *game*. You could say something like:

  > "I've been thinking about how weird this is. We both sent 'final' offers on the same day, and now our lawyers have us trapped in a standoff where we're both losing money every week. I read somewhere that this is a classic negotiation trap. I don't want to 'win' against you; I want us to both stop losing money to the lawyers. Can we agree to hire a mediator to pick a number for us, so neither of us has to feel like we gave in?"

  This approach validates her position, acknowledges the absurdity of the situation, and offers a path where neither of you has to "lose."

  **Summary:** Your friend was right; this is a classic **Game of Chicken** combined with a **War of Attrition**. The only way to win is to stop playing that specific game. Introducing a mediator allows you both to "swerve" at the same time, saving the money, the house, and most importantly, your relationship.
