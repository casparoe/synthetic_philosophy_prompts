answer: |-
  Friends, family, and members of the living room group.

  For thirty years, this woman sat in that blue armchair with a copy of Nāgārjuna's *Mūlamadhyamakakārikā* on her lap. She didn't read it to escape the world. She read it to understand how to live in it. And now that she is gone, we are left with the hardest question any of us can face: Where is she?

  Our grief wants to answer that question immediately. It reaches for the two comforts that most funerals offer. But if we are honest to her, and to the truth she loved, we have to look at those comforts closely.

  The first comfort says: *She is still here.* She is watching over us. She is in a better place, unchanged and whole.
  We want this to be true. But she taught us that nothing is unchanged. To say she exists now in some fixed, permanent state would be to deny the very lesson she spent a lifetime unfolding. It would turn her into a statue. She was not a statue. She was a river. To claim she possesses an eternal self that survived death is to ignore the web of causes and conditions that made her *her*. It is to grasp at a shadow. So, we cannot say, simply, that she exists.

  But the second comfort is no better. It says: *She is gone.* She is nothing now. The light is out.
  This is the cold wind of nihilism. She used to warn us that misunderstanding emptiness is like grabbing a snake by the wrong end—it bites you. To say she is simply "not" is to deny the love that is still sitting in this room. It is to say her kindness had no reality. If she were truly nothing, then our grief would be a mistake. But our grief is real. Her impact is real. So, we cannot say, simply, that she does not exist.

  So, is she both? Present in memory, absent in body?
  This seems sensible, but it tears the heart in two. It asks us to hold a contradiction that logic cannot solve. It splits the world into "here" and "there," "then" and "now," and places her in the gap. But she taught us that there is no gap. There is only the flow.

  Is she neither?
  This is the silence that follows the argument. This is the place where words fail. And perhaps, this is where she actually is. Not in a place, but in a freedom from the need to be located at all.

  For those of us who studied with her, we know this as the *catuṣkoṭi*—the four corners of logic that she gently pushed us away from. But for those of you who just knew her as Grandma, or Aunt, or Friend, I want to tell you what this means for your heart.

  It means you do not have to solve the mystery of where she went. You do not have to force her into a box labeled "Exists" or "Does Not Exist." She is free of those boxes now.

  Instead, look at what she left behind. This is the teaching of *pratītyasamutpāda*—dependent origination. It sounds technical, but it is the deepest form of connection. It means that nothing arises on its own. She did not arise on her own. She was made of her parents, her teachers, her struggles, and *you*. And now, she continues as the causes she set in motion.

  Her patience is in the way her son listens to his children. Her rigor is in the way her students read a text. Her generosity is in the food we are about to share. She is not watching us from a distance; she is woven into the conditions that allow us to stand here today. To say she is "empty" is not to say she was nothing. It is to say she was everything, without a boundary.

  If she were solid and separate, she could not have touched you. Because she was open, because she was empty of a fixed self, her love could flow into you without resistance. That flow has not stopped. The conditions have changed, but the causality remains.

  So, how do we grieve? We grieve conventionally. We cry. We miss her voice. We honor the "two truths." Ultimately, there is no birth and no death. But conventionally, there is a grandmother who is not coming back to the blue armchair. Both are true. We do not have to choose one to validate the other. Your tears are not a misunderstanding of emptiness; they are the proof of connection.

  She spent thirty years teaching us that the Middle Way is not a compromise. It is a liberation. It is the freedom to love without needing to possess. It is the freedom to miss someone without needing to define where they are.

  Let us not try to hold her in our minds as a concept. Let us hold her in our actions as a cause. When you act with kindness, she is not gone. When you seek truth, she is not lost. When you sit with uncertainty and do not panic, you are sitting in her living room.

  She has put down the book. The tea is still warm. The discussion continues. Not because she is watching, and not because she is nothing. But because the conversation never really belonged to her alone. It belongs to all of us, arising together, right now.

  Thank you.
