      *   *Catuṣkoṭi* (Tetralemma): Regarding any metaphysical proposition (e.g., "Does she exist after death?"), all four positions are rejected:
          1.  Exists.
          2.  Does not exist.
          3.  Both.
          4.  Neither.
      *   *Two Truths:* Conventional truth (everyday reality, love, grief) vs. Ultimate truth (emptiness). They are not separate; the ultimate *is* the emptiness of the conventional.
      *   *The Middle Way:* Avoiding the extremes of eternalism and nihilism.

