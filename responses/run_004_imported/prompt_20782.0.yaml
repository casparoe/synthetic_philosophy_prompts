answer: |-
  This is a profound question that sits at the intersection of law, ethics, and family dynamics. You are grappling with the concept of **"dead-hand control"**—the ability of a deceased person to dictate the use of property long after they are gone.

  Your mother is correct about the legal and structural reality: your grandfather designed a "spendthrift trust" specifically to withstand the pressure of unanimous beneficiary consent. He anticipated that you would feel exactly as you do now, and he decided his judgment at age 60 (or at the time of drafting) superseded your judgment at age 50.

  However, the fact that he *could* do this does not necessarily mean it is *justified*. To determine whether this is a principled protection or an unjust imposition, we can apply a few ethical and legal frameworks.

  ### 1. The "Ulysses Pact" vs. Imposed Paternalism
  Your grandfather's logic relies on a **pre-commitment strategy** (often called a Ulysses Pact). Ulysses had himself tied to the mast so he couldn't steer toward the Sirens, knowing that in the moment, his judgment would be compromised.
  *   **The Justification:** If you voluntarily tie yourself to the mast, it is rational autonomy. You are protecting your "future self" from your "weak self."
  *   **The Problem:** You did not tie yourself to the mast. He tied *you* to the mast.
  *   **The Test:** A restriction is generally more justified when the beneficiary has **assented** to the restriction (e.g., a vesting schedule in a job offer) than when it is imposed unilaterally. Since you never agreed to these terms, the burden of justification is higher. The principle at stake is **moral agency**: Does a grantor have the right to treat adult beneficiaries as perpetual minors?

  ### 2. The "Changed Conditions" Doctrine
  In trust law, there is a principle known as *cy pres* or modification due to "changed circumstances." This suggests that if the world changes so drastically that the grantor's intent cannot be fulfilled, or if fulfilling it would defeat the purpose of the trust, the terms can be altered.
  *   **The Application:** Your grandfather feared "squandering in middle age." He likely envisioned a specific economic context. If the cost of living, medical care, or the nature of "middle age" has shifted so that withholding funds causes **undue hardship** rather than preventing frivolity, the principle of preservation is actually being violated by the trust itself (e.g., if a beneficiary goes into debt because they can't access funds for a emergency).
  *   **The Test:** Is the trust preserving wealth, or is it creating poverty/instability? If the restriction causes more harm to the family's welfare than the risk of squandering would have, the justification weakens.

  ### 3. The "Time-Inconsistency" of Values
  Your mother's argument is that your grandfather knew you would change your mind, so your current mind shouldn't count. This assumes his values were the "correct" ones.
  *   **The Counter-Argument:** Societal values regarding autonomy and financial management evolve. In your grandfather's youth, capital preservation might have been the supreme virtue. Today, many argue that capital is a tool for opportunity, and blocking access at peak earning years (40s/50s) might actually *waste* the money's potential utility (e.g., starting a business, buying a home, education) compared to accessing it at 60.
  *   **The Test:** Is the restriction **proportional**? A total lock until 60 is a blunt instrument. A coherent principle would allow for a trustee to have *discretion* for specific hardships without unlocking the whole pot. The lack of a "safety valve" suggests the control was more important to him than the welfare of the beneficiaries.

  ### 4. The Distinction Between "Protection" and "Control"
  There is a coherent way to distinguish the two:
  *   **Protection** aims to ensure the beneficiary has resources *when they need them most*.
  *   **Control** aims to ensure the beneficiary uses resources *only how the grantor sees fit*.
  *   **The Verdict:** If the trust prevents you from addressing a medical emergency, it has shifted from protection to control. It prioritizes the *existence* of the money over the *well-being* of the people the money was meant to help.

  ### A Coherent Framework for Decision
  To decide if this arrangement is justified, you might apply this three-part test:

  1.  **The Harm Balance:** Does the harm caused by the restriction (stress, debt, missed opportunity, medical risk) outweigh the probable harm of lifting it (potential squandering)? If the beneficiaries are all responsible adults in their 40s and 50s, the risk of total squandering is likely lower than the risk of a medical catastrophe going untreated.
  2.  **The Agency Deficit:** Since the beneficiaries did not consent, is there a fiduciary (trustee) who can act as a proxy for their best interests? If the trust removes *all* discretion from the trustee, it treats the beneficiaries as objects, not people.
  3.  **The Sunset Clause:** Does the control have a reasonable horizon? Age 60 is arbitrary. If the grandfather lived to 90, would he still say 60 was the right age? Dead-hand control is most justified when it bridges a short gap (e.g., until maturity); it becomes less justified as it extends deep into adulthood.

  ### Conclusion
  There is a coherent principle here, but it likely cuts against your grandfather's design. The principle is **beneficial ownership**.

  While a grantor can set conditions, the ethical limit is reached when the conditions undermine the basic welfare of the beneficiaries to serve the grantor's ego or anxieties. Your grandfather's experience with his brothers was real to him, but generalizing that trauma to all future generations without a mechanism for exception is arguably an imposition of will rather than a prudent safeguard.

  **Practical Step:**
  While I am an AI and cannot give legal advice, in many jurisdictions, **all beneficiaries can petition a court to modify or terminate a trust** if they can prove that the purposes of the trust have been fulfilled or that continuation would be contrary to the beneficiaries' best interests, sometimes even against the grantor's specific wording (depending on local "decanting" laws or the Uniform Trust Code).

  The fact that you are all unanimous *is* powerful, even if the trust says it shouldn't be. Courts sometimes rule that when *all* living beneficiaries agree, and the grantor is deceased, the beneficiaries' collective property rights outweigh the dead hand's control, provided no material purpose of the trust is frustrated. Given that the "material purpose" here is paternalism, and you are all adults, a court might find that purpose is no longer material.

  You are not simply fighting a stubborn man; you are debating whether the past should hold a veto over the present. In a free society, the presumption usually favors the living.

  *Disclaimer: I am an AI, not an attorney. Trust laws vary significantly by jurisdiction. You should consult with a qualified trusts and estates attorney to discuss the specific laws in your location and the possibility of petitioning for modification.*
