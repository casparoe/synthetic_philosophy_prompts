answer: |-
  It is a pleasure to address a colleague who understands the difference between a plausible story and a tested hypothesis. Your reading group has stumbled upon the exact tension that has animated evolutionary biology for the last forty years, and Miriam and Desmond have both articulated positions that mirror the actual historical discourse remarkably well.

  Given your background in physiology, you know that a system can be optimized for one function (thermoregulation) while being constrained by another (locomotion or skeletal growth). The Spandrels paper was essentially an attempt to import that systems-engineering perspective into evolutionary theory, which had become dominated by population genetics and optimality modeling.

  Here is an analysis of their exchange, move by move, followed by an assessment of the empirical settleability of the dispute.

  ### Move-by-Move Analysis

  **1. Miriam: Historical Vindication vs. Desmond: Architectural Rigor**
  *   **Miriam's Claim:** Biologists *did* assume traits were adaptations without testing alternatives; the paper corrected this culture.
  *   **Desmond's Claim:** The architectural metaphor fails because physical spandrels are structurally determined, whereas biological byproducts (like the chin) are not rigorously fixed.
  *   **Verdict:** **Miriam is right on the sociology; Desmond is right on the structural analogy.**
      *   Miriam is historically correct. Prior to 1979, the "adaptationist programme" (as Gould and Lewontin called it) often treated natural selection as the *only* cause of evolutionary change. The paper successfully forced the field to acknowledge developmental constraints and phylogenetic inertia as legitimate null hypotheses.
      *   However, Desmond's critique of the metaphor is technically sound. In San Marco, the spandrel is a necessary geometric consequence of putting a dome on round arches. In biology, "constraints" are rarely absolute. The human chin *might* be a byproduct of jaw reduction, but it is not geometrically inevitable in the way a masonry spandrel is. Biological systems have degrees of freedom that architecture does not. Gould knew this, but the metaphor invited the confusion Desmond points out.

  **2. Desmond: Falsifiability and Exaptation vs. Miriam: Misuse vs. Defect**
  *   **Desmond's Claim:** Allowing spandrels to become "exaptations" (co-opted for later use) makes the theory unfalsifiable. Any trait can be explained away.
  *   **Miriam's Claim:** This is a misuse of the concept; adaptationist stories are equally vulnerable to unfalsifiable "just-so stories."
  *   **Verdict:** **Desmond has the stronger logical point, though Miriam is right about the symmetry of the error.**
      *   Desmond identifies a genuine logical hazard. If a trait arises as a byproduct (spandrel) but is later used for something (exaptation), it becomes difficult to distinguish from a trait that was selected for that use from the start. Without a time machine, distinguishing "selected for" from "co-opted later" is often impossible. This does risk making the framework unfalsifiable.
      *   Miriam is correct that adaptationists suffer the same sin (inventing a function for every trait). However, pointing out that your opponent is also sloppy does not prove your own rigour. If the Spandrels framework allows one to explain *any* trait as either a spandrel or an exaptation without distinct criteria, it risks becoming a "pan-adaptationism" in disguise.

  **3. Desmond: Truism vs. Revolutionary Claim vs. Miriam: Metaphor Limitations**
  *   **Desmond's Claim:** If the paper only means "traits are sometimes not adaptive," it is a truism nobody denied.
  *   **Miriam's Claim:** Metaphors cannot survive perfect scrutiny; the point was to warn against sloppiness.
  *   **Verdict:** **Desmond is right about the logical status; Miriam is right about the rhetorical necessity.**
      *   Desmond is correct that the *ontological* claim (non-adaptive traits exist) was never in serious dispute. Evolutionary biologists knew about vestiges and drift.
      *   The revolution was *methodological*. Gould and Lewontin were not arguing that non-adaptive traits exist; they were arguing that the *burden of proof* had been inverted. Adaptation had become the default assumption rather than a hypothesis to be tested. Miriam defends the paper's impact, but Desmond correctly identifies that if you strip away the rhetorical force, the core logical claim is indeed trivial. The paper's fame rests on the methodological accusation, not the biological discovery.

  ### What Both Are Overlooking

  There are three significant elements missing from their debate, which your background in physiology might make particularly salient.

  **1. The Quantitative Genetics Solution**
  Both Miriam and Desmond are arguing in the realm of qualitative narratives. Since 1979, the field has largely moved past this philosophical stalemate through quantitative genetics (the work of Lande, Arnold, and others). We can now measure the **G-matrix** (genetic variance-covariance matrix). This allows us to empirically measure constraints. If two traits are genetically correlated, selection on one *must* drag the other along. This provides the mathematical rigor for "constraints" that Gould's architectural metaphor lacked. Desmond would find this satisfying; it turns "constraint" from a metaphor into a measurable coefficient.

  **2. The Specific Empirics of the Chin**
  Miriam leans on the human chin as a "favourite illustration" of a spandrel. This is empirically shaky. Since 1979, there has been significant work suggesting the chin *is* adaptive (e.g., resisting biomechanical stress during chewing or sexual selection). If the chin turns out to be an adaptation, Miriam's specific evidence fails, even if her general principle holds. A physiologist knows that a structure serving a function now does not prove it was *selected* for that function, but it does weaken the "byproduct" claim if the biomechanics align too perfectly.

  **3. The Synthesis**
  Both treat "Adaptation" and "Spandrel" as mutually exclusive categories. Modern evolutionary biology views them as ends of a spectrum. A trait can be 80% constrained by development and 20% refined by selection, or vice versa. The debate is no longer "Is it A or B?" but "What is the relative contribution of selection versus constraint to the phenotypic variance?" Miriam and Desmond are fighting a 1980s battle that has largely been resolved by integration.

  ### Can This Be Settled Empirically?

  You asked whether this dispute could be settled empirically, or if it is a disagreement about definitions. Given your career seeking decisive tests, here is the hard truth:

  **At the level of specific traits: Yes.**
  We can empirically test whether a specific trait is a spandrel or an adaptation. We can look for genetic correlations, examine phylogenetic history to see if the trait preceded the function, and measure fitness consequences. For example, we can test if the "spandrel" of a specific bone structure in ungulates correlates with thermoregulatory needs or is merely a consequence of body size scaling. These are physiological questions with empirical answers.

  **At the level of the General Paradigm: No.**
  The question "Are *most* traits adaptations or spandrels?" is empirically underdetermined. To answer it, we would need to "rerun the tape of life" (to use another Gouldism). We would need to see if the trait evolves again under identical selection pressures. If it does, it is likely an adaptation. If it does not, it may be a historical byproduct. Since we cannot do this, we cannot know the global proportion of adaptations vs. spandrels.

  **The Verdict on the Dispute**
  Ultimately, the dispute is **methodological, not ontological.** It is not about what traits *are*, but about what standards of evidence we require before we *claim* to know what they are.

  *   **Desmond** is right that the *philosophical* distinction is fuzzy and risks unfalsifiability.
  *   **Miriam** is right that the *methodological* warning was necessary and effective.

  **Who "Won"?**
  If forced to judge the exchange: **Desmond wins on logic; Miriam wins on history.**
  Desmond correctly identifies that the Spandrels paper, taken as a strict logical system, has holes (the metaphor, the exaptation escape hatch). However, Miriam correctly identifies that science is a human practice, not just a logical system. The paper succeeded not because it was logically airtight, but because it corrected a systemic bias in how biologists designed experiments.

  **Recommendation for the Group:**
  Since you value tests that decide questions, I suggest your group move from the 1979 philosophical text to the empirical literature on **phylogenetic comparative methods** and **evo-devo**. These fields provide the actual machinery to test the Spandrels hypothesis without relying on architectural metaphors. You will find that the "adaptationist" and "structuralist" camps have largely merged into a discipline that quantifies the relative weights of selection and constraint. The war is over; the integration won.

  You might find it gratifying to note that in alpine ungulates, for instance, we now understand that coat thickness is not merely an adaptation to cold, but is constrained by the metabolic costs of hair production and the phylogenetic history of the species' integument. That is the living legacy of the argument Miriam and Desmond are having.
