prompt: |-
  I'm a PhD student in philosophy of biology, and I run a small interview series for our department's working group on evolutionary theory. Next week's guest is an evolutionary theorist known for defending strong gene selectionism -- the view that the gene is the only genuine unit of selection, and that any apparently group- or organism-level selection story is ultimately just a convenient redescription. His stock reply whenever someone raises a group-selection-flavored case is that it's "kin selection wearing a group-selection costume." Draft eight to ten interview questions that go beyond having him restate the view: I want at least one question that uses the Price-equation equivalence between gene-level and group-level partitions of fitness to ask what, if anything, makes the gene the "real" unit rather than merely the most convenient bookkeeping choice; one on eusocial superorganisms such as ant or naked-mole-rat colonies, asking whether his account can explain colony-level organization without quietly reintroducing the higher-level individuality it's supposed to dissolve; and one that uses Sober's selection-for/selection-of distinction to ask whether his position has in effect shifted from a causal claim about where selection acts to a merely pragmatic claim about which bookkeeping is more convenient. For each, add a follow-up keyed to the answer he's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of biology.
      *   **Context:** Department working group interview series on evolutionary theory.
      *   **Guest:** Evolutionary theorist, strong gene selectionist (genes are the *only* genuine unit of selection; group/organism selection is just redescription/kin selection in disguise).
      *   **Goal:** 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating the view.
          *   Must include specific questions on:
              1.  Price Equation equivalence (gene vs. group partitions) $\rightarrow$ Ontological status vs. convenience.
              2.  Eusocial superorganisms (ants, naked mole rats) $\rightarrow$ Colony-level organization vs. dissolving higher-level individuality.
              3.  Sober's selection-for/selection-of distinction $\rightarrow$ Causal claim vs. pragmatic bookkeeping.
          *   Each question needs a follow-up keyed to the *most likely answer* (anticipating the gene-selectionist defense).

  2.  **Deconstruct the Guest's Position (Strong Gene Selectionism):**
      *   *Core Claim:* Replicators (genes) are the only things that persist through generations; vehicles (organisms/groups) are temporary. Selection acts on phenotypes, but evolutionary change is defined by gene frequency changes.
      *   *Standard Defense:* Kin selection (inclusive fitness) explains altruism without needing group selection. Multilevel selection (MLS) is mathematically equivalent but causally misleading.
      *   *Weaknesses/Pressure Points:* Emergent properties, developmental systems, the arbitrariness of "replicator" definition, the explanatory power of higher-level constraints, the distinction between mathematical equivalence and causal explanation.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Price Equation.*
          *   *Idea:* The Price Equation allows partitioning selection into within-group and between-group components. It also allows partitioning into gene-level effects. If the math is equivalent, why is one "real"?
          *   *Draft:* The Price Equation shows equivalence between gene and group partitions. Why is gene the real one?
          *   *Refinement:* Make it sharper. Focus on the "ontological privilege." If the covariance terms sum to the same change, what breaks the symmetry?
          *   *Follow-up:* He will likely say genes are the only replicators. Counter: What about developmental constraints that make the group the effective replicator in eusociality?

      *   *Requirement 2: Eusocial Superorganisms.*
          *   *Idea:* Ant colonies act like individuals. Sterile workers don't pass genes directly.
          *   *Draft:* What about ant colonies? They look like individuals.
          *   *Refinement:* Focus on the "dissolving individuality" aspect. If the colony functions as a physiological unit (homeostasis, division of labor), does calling it "kin selection" miss the causal structure of the *colony's* survival?
          *   *Follow-up:* He will likely say it's still high relatedness. Counter: Does high relatedness *cause* the superorganism, or is it a precondition for a new level of individuality to emerge?

      *   *Requirement 3: Sober's Selection-For/Of.*
          *   *Idea:* Selection *of* units vs. Selection *for* traits.
          *   *Draft:* Sober says selection-for is about traits. Does your view confuse this?
          *   *Refinement:* Gene selectionists often claim genes are selected *of*. But if the phenotype is what interacts with the environment, is the gene just a beneficiary? Is the claim causal or just bookkeeping?
          *   *Follow-up:* He will likely say genes are the only things inherited. Counter: If the causal interaction is at the organism level, does the "gene's eye view" obscure the actual mechanism of selection?

      *   *Filling the remaining 5-7 questions:*
          *   Need to cover: Developmental Biology (Evo-Devo), Niche Construction, Cultural Evolution, The definition of "Replicator", Explanatory Pluralism, Historical contingency, and maybe a "steelman" question about where he *would* concede.
          *   *Q4 (Evo-Devo):* Constraints. Genes don't build organisms alone; physics/chemistry do. Does gene selectionism ignore developmental bias?
          *   *Q5 (Niche Construction):* Organisms change environments. This creates feedback loops. Is the gene still the sole driver if the environment is an extended phenotype?
          *   *Q6 (Cultural Evolution):* Memes? If humans transmit culture, is that a new replicator? If yes, why stop at genes? If no, why?
          *   *Q7 (Replicator Definition):* Dawkins' definition. Is it too narrow? What about chromosomal segments or epigenetic markers?
          *   *Q8 (Explanatory Power):* Even if mathematically equivalent, does the group view generate better hypotheses in some cases (e.g., conservation biology)?
          *   *Q9 (Historical Contingency):* Major transitions. At what point does a group *become* an individual? Is there a threshold?
          *   *Q10 (The "Killer" Question):* If we found a system with zero genetic relatedness but stable altruism (hypothetical), would you concede? Or is the theory unfalsifiable?

  4.  **Refining and Polishing:**
      *   Ensure the tone is academic but probing (PhD level).
      *   Check that the "Likely Answer" and "Follow-up" are realistic for a hardline gene selectionist (e.g., they usually retreat to "replicator fidelity" or "mathematical equivalence").
      *   Ensure the three mandatory topics are clearly integrated and highlighted.

  5.  **Review against Constraints:**
      *   8-10 questions? Yes (I will aim for 10 to be safe).
      *   Price Equation question included? Yes.
      *   Eusociality question included? Yes.
      *   Sober's distinction included? Yes.
      *   Follow-ups included? Yes.
      *   Context appropriate? Yes.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Price Equation question doesn't sound like I'm saying the math is wrong. It's about the *interpretation* of the math.
      *   *Correction:* For the Sober question, ensure I distinguish between the *object* of selection and the *beneficiary*.
      *   *Correction:* Ensure the follow-ups don't sound like "gotchas" but rather deepening the philosophical inquiry suitable for a working group.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are ten interview questions designed for a philosophy of biology working group, tailored to challenge a strong gene-selectionist position without resorting to straw-manning. They include the three specific thematic requirements you requested, along with anticipated responses and targeted follow-ups.

  ### 1. The Price Equation and Ontological Privilege
  **Question:** The Price Equation allows us to partition evolutionary change into a within-group component and a between-group component, but it also allows a partitioning that isolates gene-frequency changes directly. Since these partitions are mathematically equivalent and yield the same prediction for evolutionary change, the choice between them often seems to be one of perspective. If the mathematics are invariant, what breaks the symmetry? What ontological feature makes the gene-level partition the "causal reality" and the group-level partition merely a "redescription," rather than both being valid causal models of the same process?

  *   **Likely Answer:** He will likely argue that while the math is equivalent, only genes are *replicators* with sufficient fidelity to accumulate adaptations over deep time. Groups are too transient; therefore, the gene partition tracks the only lineage that matters.
  *   **Follow-up:** If fidelity is the criterion, how do you handle cases where developmental systems constrain variation such that the *group* structure is inherited with higher fidelity than specific allelic combinations? If the group phenotype is the stable replicating unit, does your fidelity criterion force you to admit the group as a unit of selection, or does it suggest your definition of "replicator" is too gene-centric?

  ### 2. Eusociality and the "Superorganism"
  **Question:** In eusocial colonies like ants or naked mole rats, sterile workers forego reproduction entirely to support the queen. The colony exhibits homeostasis, division of labor, and defense mechanisms analogous to a multicellular organism. You characterize this as kin selection maximizing inclusive fitness. However, does this explanation risk being a "just-so" story that dissolves the emergent individuality of the colony? If the colony functions as a physiological unit, does insisting on the gene as the *only* unit of selection obscure the causal mechanisms (e.g., colony-level fission) that actually drive the evolutionary trajectory?

  *   **Likely Answer:** He will likely contend that colony-level fission is still driven by the propagation of the workers' and queen's shared genes. The "superorganism" is a vehicle, not a replicator, and calling it an individual conflates the two roles.
  *   **Follow-up:** In the major transition to eusociality, there is a point where conflict suppression becomes so total that the colony acts as a Darwinian individual. If we define individuality by the capacity to undergo selection as a cohesive unit, aren't you effectively admitting group selection exists but simply refusing to name it as such because the genetic relatedness is high? Is the distinction causal or merely terminological?

  ### 3. Sober's Selection-For vs. Selection-Of
  **Question:** Elliott Sober distinguishes between selection *of* a unit (the entity that survives and reproduces) and selection *for* a trait (the property causing the survival). Gene selectionism often claims genes are the units selected *of*. But genes do not interact directly with the environment; phenotypes do. If the causal interaction happens at the organism or group level, isn't the gene merely the *beneficiary* of selection rather than the *target*? Does your position inadvertently shift from a causal claim about where selection acts to a pragmatic claim about which bookkeeping system best tracks the beneficiaries?

  *   **Likely Answer:** He will likely argue that while phenotypes are the interactors, only genes are the replicators. Selection *of* phenotypes is ephemeral; selection *of* genes is cumulative. Therefore, the gene is the only unit that makes sense of adaptation.
  *   **Follow-up:** If the gene is the unit selected *of*, but the phenotype is the unit selected *for*, how do you account for traits that are beneficial to the group but neutral or slightly costly to the gene's direct transmission, yet persist due to group structure? If you explain this via kin selection, aren't you acknowledging that the *structure of the group* is the variable doing the causal work, making the group a legitimate variable in the causal model?

  ### 4. Developmental Constraints and Evo-Devo
  **Question:** Modern Evo-Devo emphasizes that developmental systems bias the production of variation. Organisms are not passive clay molded by gene frequencies; the physics of development channels which phenotypes are even possible. If developmental constraints at the organismal or tissue level dictate the landscape of variation upon which selection acts, doesn't this grant the organism-level system a causal role in evolution that is independent of specific gene frequencies? How does strict gene selectionism accommodate these top-down constraints?

  *   **Likely Answer:** He will likely respond that developmental constraints are themselves evolved adaptations encoded by genes. The "physics" of development is just the long-term expression of gene-selected rules.
  *   **Follow-up:** But some constraints are physical or chemical necessities (e.g., diffusion limits, biomechanical scaling) that precede genetic encoding. If genes must "discover" these pre-existing physical constraints, isn't the environment (including the organism's physical structure) acting as a selective filter that is external to the gene? Does this not imply a reciprocal causation that gene-centrism underestimates?

  ### 5. Niche Construction and Feedback Loops
  **Question:** Niche construction theory posits that organisms modify their environments, altering the selection pressures acting back upon them. This creates a feedback loop where the organism is both the product and the source of selection. In a strong gene-selectionist framework, is niche construction merely an extended phenotype of the gene? If so, does this framework risk underestimating the autonomy of the organism-environment system as a unit of evolutionary change?

  *   **Likely Answer:** He will likely agree it is an extended phenotype. The genes for building dams in beavers are selected because of the fitness consequences of the dams. The loop closes at the gene level.
  *   **Follow-up:** If the niche modification alters the selection pressure for *other* species or creates a legacy that outlasts the individual genotype (ecological inheritance), does the gene-centric view have the resolution to track these multi-generational, system-level feedbacks without becoming overly complex? At what point does the "extended phenotype" become an "extended genotype" of the ecosystem?

  ### 6. Cultural Evolution and Memes
  **Question:** You argue that high-fidelity replication is necessary for a unit of selection. Human cultural evolution involves high-fidelity transmission of information (memes, technologies, norms) that often spreads independently of genetic fitness, sometimes even counter to it. If we accept your criteria for replicators, why are memes not genuine units of selection? If you reject them, is it because they lack genetic substrate, or because accepting them would force you to acknowledge non-genetic Darwinian processes?

  *   **Likely Answer:** He will likely argue that cultural transmission lacks the fidelity and longevity of genetic transmission. Culture is too noisy and Lamarckian to drive long-term adaptation in the same way.
  *   **Follow-up:** Yet, cultural institutions (like science or religion) persist for millennia and shape human genetic evolution (e.g., lactose tolerance). If cultural units can drive genetic change, aren't they functioning as higher-level selection pressures? If you admit cultural group selection, does the "gene-only" view remain tenable for human evolution specifically?

  ### 7. The Definition of the "Replicator"
  **Question:** Dawkins defined the replicator as anything of which copies are made. However, in sexual reproduction, whole genomes are never copied; only segments are recombined. Why is the "gene" (often loosely defined) the privileged replicator rather than the chromosome, the cell, or the organism? Is the choice of the gene as the fundamental unit partly an artifact of the molecular biology available when the theory was formalized, rather than a strict metaphysical necessity?

  *   **Likely Answer:** He will likely state that the gene is the smallest unit that is reliably copied without being blended away. Chromosomes recombine; organisms die. Only the gene (or DNA segment) persists.
  *   **Follow-up:** With the rise of epigenetics, we see heritable variation that is not DNA-sequence based but is still copied. If epigenetic markers can be selected and inherited, does your definition of "replicator" expand to include them? If so, doesn't that weaken the claim that *DNA genes* specifically are the unique units of selection?

  ### 8. Explanatory Pluralism and Heuristics
  **Question:** Even if we grant that gene-level and group-level accounts are mathematically equivalent, scientists often choose models based on explanatory power and heuristic value. In conservation biology, managing for *group* viability is often more effective than managing for allele frequencies. If the group-level explanation generates better interventions and predictions in specific contexts, does insisting on the gene-level view as the "only true" account hinder scientific practice? Is there room for methodological pluralism even if ontological monism is maintained?

  *   **Likely Answer:** He will likely concede that group talk is useful shorthand (a "as if" strategy) but maintain that it is ultimately misleading if taken literally. It risks reifying groups as agents.
  *   **Follow-up:** If the "shorthand" is consistently more predictive in complex systems, doesn't that suggest the group level captures causal variables that the gene level averages out? In philosophy of science, if a model is indispensable for prediction, do we not usually grant its entities some ontological weight?

  ### 9. Major Transitions and Thresholds
  **Question:** In the Major Transitions in Evolution (e.g., cells to eukaryotes, unicellular to multicellular), entities that were once capable of independent replication become parts of a higher-level unit. At what precise point in this transition does the higher-level unit become a "real" individual? Is there a threshold of conflict suppression or interdependence where you would concede that selection is acting on the collective, or is the gene view absolute regardless of the degree of integration?

  *   **Likely Answer:** He will likely argue there is no threshold. It is a continuum of relatedness and conflict suppression. The "individual" is always a vehicle for the genes that build it.
  *   **Follow-up:** If it is a continuum, then drawing a hard line at the gene seems arbitrary. If a multicellular organism is a "collective" of cells that has achieved near-total cooperation, why is it an "individual" but a bee colony is not? Is the distinction based on biological function, or simply on the fact that we intuitively identify with our own organismal boundaries?

  ### 10. Falsifiability and the "Kin Selection Costume"
  **Question:** Your stock reply to group-selection cases is that they are "kin selection wearing a costume." This suggests that any apparent group selection can be reduced to inclusive fitness calculations. Is there any hypothetical empirical scenario that would falsify your position? For example, if we discovered a system with zero genetic relatedness among cooperators that nonetheless maintained stable altruism through group-level policing, would you concede group selection, or would you search for a hidden genetic benefit?

  *   **Likely Answer:** He will likely argue that without genetic relatedness, altruism cannot evolve unless there is reciprocity (which is still gene-based) or policing (which is enforced by genes). He will likely say the theory is robust because it accounts for the *mechanism* of inheritance.
  *   **Follow-up:** If every counter-example is explained away by positing hidden genetic benefits or redefining the kinship structure, does the theory risk becoming unfalsifiable? If gene selectionism is compatible with *any* observed distribution of altruism, does it function as a empirical theory or as a metaphysical framework?
