prompt: |-
  I help run the methodology side of a smallish forecasting tournament -- basically a scrappy Metaculus-style thing some of us started after getting way too into the superforecasting scene. We've hit a real fight over interpretations of probability, and it's not academic anymore since it affects prize money and the leaderboard. Half the commitee are frequentists who say you can't really assign a meaningful probability to a one-off event like 'will this specific ceasefire hold past June,' since there's no reference class of repeated trials to average over -- sure, you can still compute a Brier score for one question, but you can't say a single 73% call was actually good, just lucky, and real calibration only shows up over hundreds of questions. The other half are Bayesians who think probability just is credence, happy to score and rank every question on its own, 'best call of the year' prize included. Somebody brought up propensity interpretations too and it just stalled everyone out. I lean Bayesian myself but think the frequentists have a real point I can't just dismiss. can you draft the memo I'll bring to committee -- an actual recommendation for how we score and talk about singular, non-repeatable questions, one that takes the reference-class worry seriously instead of waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A small forecasting tournament (Metaculus-style, scrappy, post-superforecasting scene).
      *   **Conflict:** A dispute over probability interpretation (Frequentist vs. Bayesian) affecting prize money and leaderboards.
      *   **Frequentist View:** One-off events (e.g., "ceasefire holds past June") lack a reference class. Single predictions can't be validated as "good" vs. "lucky." Calibration requires aggregation over many questions.
      *   **Bayesian View:** Probability = credence. Every question can be scored/ranked individually. "Best call of the year" is valid.
      *   **User's Stance:** Leans Bayesian but acknowledges the Frequentist point (reference class problem is real).
      *   **Goal:** Draft a committee memo with a concrete recommendation for scoring/talking about singular questions that respects the Frequentist concern without paralyzing the tournament.
      *   **Tone:** Professional, pragmatic, conciliatory, methodological but accessible.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Frequentist Worry:* $P(Event)$ is undefined for unique events. Scoring a single 70% prediction that resolves True as "better" than a 60% prediction that resolves True is mathematically shaky if we can't repeat the trial. It encourages overconfidence or luck-chasing on single items.
      *   *Bayesian Utility:* We *need* to make decisions on unique events. Credences are actionable. Tournaments need engagement, and single-question prizes drive engagement.
      *   *The Middle Ground:* Acknowledge that *epistemic* validity (was this probability "true"?) is unknowable for single events, but *decision-theoretic* utility (was this credence useful?) and *aggregate performance* (does this forecaster perform well over time?) are measurable.

  3.  **Identify Key Recommendations:**
      *   **Scoring:** Keep Brier/Log scores for individual questions (pragmatic necessity), but frame them correctly.
      *   **Leaderboards:** Base major prizes on *aggregated* performance (addressing the Frequentist calibration worry).
      *   **Single-Question Prizes:** If they exist, frame them as "Most Decisive Correct Call" rather than "Best Probability." Or, weight them by the forecaster's *track record* (meta-probability).
      *   **Language:** Shift vocabulary from "True Probability" to "Credence" or "Forecast." Avoid claiming a single number was "right."
      *   **Reference Classes:** Encourage forecasters to explicitly state their reference class in the justification. This makes the implicit explicit, satisfying the Frequentist urge for structure.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the problem and the proposed compromise clearly.
      *   **The Core Tension:** Briefly summarize the Frequentist vs. Bayesian deadlock without taking sides aggressively. Validate both.
      *   **Guiding Principle:** "Epistemic Humility + Decision Utility." We can't know the truth of a single probability, but we can reward useful precision backed by track records.
      *   **Recommendations (The Meat):**
          1.  *Aggregate for Legitimacy:* Major prizes must be over buckets of questions (Frequentist win).
          2.  *Individual Scoring as "Loss Functions":* Treat single scores as penalties for inaccuracy, not proof of truth (Bayesian utility).
          3.  *The "Reference Class Statement":* Require forecasters to justify *why* they chose their number using analogues (bridges the gap).
          4.  *Single-Question Prizes:* Rename/Reframe. "Best Insight" rather than "Best Probability."
      *   **Communication Guidelines:** How to talk about results publicly.
      *   **Conclusion:** Reiterate the goal (better forecasting, not philosophical purity).

  5.  **Refining the Tone:**
      *   *Avoid:* "The Frequentists are wrong." or "Let's just ignore philosophy."
      *   *Include:* "The reference class problem is valid." "We need to keep the lights on." "This is about incentives."
      *   *Key Insight:* The Frequentist worry is actually about *variance* and *luck*. The solution isn't to ban single questions, but to discount their weight in evaluating *skill*.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Add concrete examples (e.g., how to handle the "Ceasefire" question).
      *   *Critique:* Does it actually solve the prize money issue?
      *   *Fix:* Explicitly state that the Grand Prize is aggregate-only. Single-question bounties are separate and smaller.
      *   *Critique:* Did I address the Propensity mention?
      *   *Fix:* Briefly acknowledge it as a middle ground but recommend setting it aside for operational clarity.

  7.  **Final Polish:** Check for clarity, flow, and persuasive power. Ensure the "Reference Class Statement" idea shines as the specific methodological innovation that bridges the gap. (This is a strong, actionable takeaway).

  8.  *(Final thought)*: Make sure the distinction between *evaluating a forecast* (ex-post) and *evaluating a forecaster* (ex-ante/aggregate) is clear. That's the crux of the compromise.

  9.  **Generate Output.** (Proceeds to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Tournament Committee
  **FROM:** [Your Name/Methodology Lead]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Scoring Singular Events & Probability Interpretations

  ### 1. Executive Summary

  We are currently stalled on a philosophical debate regarding the validity of assigning probabilities to singular, non-repeatable events (e.g., "Will Ceasefire X hold past June?"). One camp argues that without a reference class of repeated trials, single-event probabilities are epistemically meaningless (Frequentist concern). The other argues that probability represents actionable credence and should be scored individually (Bayesian utility).

  This memo recommends a **hybrid operational framework**. We will acknowledge the Frequentist critique regarding *skill evaluation* while maintaining the Bayesian approach for *decision utility*.

  **The Core Recommendation:** We will continue to score individual questions for leaderboard movement, but we will decouple *question-level scores* from *skill validation*. Major prizes will rely exclusively on aggregated performance over reference-class buckets. Single-question awards will be reframed to reward "decisive insight" rather than "probability accuracy," and forecasters will be required to submit a brief "Reference Class Justification" with their forecast.

  ### 2. The Problem: Validity vs. Utility

  The committee is divided on a genuine methodological tension:

  *   **The Frequentist Objection:** A 73% probability on a unique geopolitical event cannot be verified as "calibrated" in isolation. If the event happens, a 73% call looks better than a 51% call, but this may be luck. Validating skill requires a frequency curve over hundreds of similar trials.
  *   **The Bayesian Objection:** Decision-makers (and our users) must act on singular events. Withholding probability judgments because an event is unique renders forecasting useless. We can measure "log loss" on a single question as a penalty for inaccuracy, even if we can't prove "truth."

  **Assessment:** The Frequentists are right that a single Brier score does not prove skill. The Bayesians are right that we cannot operate the tournament without scoring single questions. The solution is not to choose a philosophy, but to align our incentives with the limitations of both.

  ### 3. Operational Recommendations

  To resolve the dispute over prize money and leaderboards, I propose the following four protocols:

  #### A. Two-Tiered Prize Structure (The "Skill vs. Insight" Split)
  We separate prizes into **Track Record Awards** and **Spotlight Awards**.

  1.  **Track Record Awards (The Grand Prize):** Eligibility requires a minimum volume of forecasts (e.g., 50+ questions) within specific domains (e.g., Geopolitics, Economics). Scoring is based on aggregate calibration and resolution over that *bucket*.
      *   *Why:* This satisfies the Frequentist requirement for a reference class. It proves the forecaster is calibrated over time, not just lucky on one headline event.
  2.  **Spotlight Awards (Single-Question Bounties):** We retain prizes for specific high-profile questions, but we rename them. Instead of "Most Accurate Forecast," these become "Most Decisive Correct Call."
      *   *Criteria:* To win, a forecaster must be on the correct side of the resolution *and* have placed significantly more weight than the community median.
      *   *Why:* This acknowledges that while we can't verify the probability number itself, we can reward the *courage* of a specific credence that paid off. It treats the prize as a bounty for useful risk-taking, not proof of epistemic perfection.

  #### B. The "Reference Class Statement" Requirement
  For any question designated as a "Spotlight" event, forecasters must include a 1-2 sentence justification identifying their implicit reference class.
  *   *Example:* "I am forecasting 70% because in the last 20 similar ceasefires in this region, 14 held past 6 months."
  *   *Why:* This forces the Bayesian to make their Frequentist assumptions explicit. It allows us to evaluate whether their reference class was reasonable, even if the event itself is unique. It moves the debate from "Is this probability real?" to "Is this analogy sound?"

  #### C. Scoring Language & Public Communication
  We must change how we talk about results in public updates and leaderboards to avoid claiming false precision.
  *   **Do Not Say:** "Forecaster X correctly predicted the 73% likelihood."
  *   **Do Say:** "Forecaster X assigned high credence (73%) to an outcome that occurred, improving their aggregate log-loss."
  *   **Do Not Say:** "This forecast was accurate."
  *   **Do Say:** "This forecast was well-calibrated relative to their peer group over the season."

  #### D. Handling "Propensity" Arguments
  Several members raised the *Propensity Interpretation* (probability as a physical tendency of the situation). While philosophically interesting, this is operationally unmeasurable for our purposes. We will table this interpretation for internal discussion but exclude it from scoring rules. We score *expressed credence*, not *physical tendency*.

  ### 4. Implementation Plan

  1.  **Immediate:** Update Terms & Conditions to clarify that Grand Prizes are contingent on aggregate performance buckets, not single-question wins.
  2.  **Next Tournament Cycle:** Implement the "Reference Class Statement" field for all questions valued over $[Amount] in bounty.
  3.  **Community Guidance:** Publish a short blog post titled "How We Score Luck vs. Skill" that explicitly validates the Frequentist concern to the user base. This builds trust by admitting that single-event luck is real and accounted for in our methodology.

  ### 5. Conclusion

  The Frequentist concern is not a blocker; it is a risk management constraint. By acknowledging that single-event probabilities are unverifiable in isolation, we protect the tournament's integrity. By continuing to score them as actionable credences, we maintain engagement.

  This framework allows us to pay out prizes on the "Ceasefire" question without claiming we have solved the philosophy of chance. We reward the *bet*, not the *truth*.

  I request committee approval to draft the updated scoring rules based on this hybrid model by next week.

  ***

  **Attachments:**
  *   *Draft: Updated Prize Tier Definitions*
  *   *Example: Reference Class Statement Field UI*
