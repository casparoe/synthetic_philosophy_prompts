answer: |-
  You have read the text correctly, and the tension you feel is not a failure of comprehension—it is the central friction in Maimonides' rationalist project. You are also right to recall Nachmanides (Ramban); he famously attacks this exact chapter, calling Maimonides' view "heresy" because it reduces divine commandments to historical expediency.

  To write about this clearly, you need to isolate the specific logical move Maimonides makes to keep the sacrifice binding despite its "concessionary" origin. Here is the argumentative structure:

  **1. The Distinction Between *Origin* and *Authority***
  Maimonides distinguishes between *why* a law was introduced (historical/psychological necessity) and *who* introduced it (Divine Will).
  *   **The Move:** Just because a law addresses a historical contingency (the Israelites' inability to quit sacrifice cold turkey) does not make the law temporary. Once God legislates the "concession," it becomes an eternal absolute.
  *   **The Logic:** The "wisdom" of the law lies in its adaptation to human nature. Since human nature (the need for physical ritual to anchor spiritual intent) does not change, the law does not expire.

  **2. The "Training Wheels" Metaphor is Slightly Off**
  Your intuition is that if sacrifice is scaffolding, it should be removed once the building stands. Maimonides argues something subtler:
  *   **The Move:** The scaffolding wasn't just to build the building; it *is* the mode of inhabiting the building.
  *   **The Logic:** Maimonides believes humans are hylomorphic (body-soul composites). We cannot worship purely intellectually forever. We need physical acts to discipline the soul. Sacrifice was weaned off *idolatry*, not off *physical ritualism*. In the Messianic era, idolatry is extinct, so the physical act of sacrifice can return safely, purified of its previous intent. The act remains; the idolatrous context vanishes.

  **3. Primary vs. Secondary Intention**
  This is the technical resolution to the Jeremiah contradiction.
  *   **Primary Intention:** Knowledge of God (which is eternal).
  *   **Secondary Intention:** Regulating how that knowledge is enacted (which required sacrifice *then*, and requires it *now* because it was divinely codified).
  *   **The Logic:** Jeremiah says sacrifice wasn't the *primary* goal. Maimonides agrees. But the *secondary* goal (the mechanism of service) was still commanded by God. Obeying the mechanism is how you achieve the primary goal.

  **4. The Nachmanides Check**
  Your memory is correct. Nachmanides argues that sacrifice is not a concession to human weakness but a metaphysical necessity that affects the upper worlds ("a pleasing scent to God"). For Nachmanides, Maimonides' view makes the Law seem like a historical compromise rather than an eternal truth.
  *   **For your piece:** This confirms that the "soft spot" you sense was identified by Maimonides' greatest critic within a generation of his death. Maimonides prioritizes *God's wisdom* (which accommodates human limits); Nachmanides prioritizes *God's will* (which transcends human logic).

  **Summary for your draft:**
  Maimonides resolves the tension by arguing that **human nature is constant.** The "concession" was not to a primitive *era*, but to a permanent *psychology*. Therefore, the law remains binding not because sacrifice is inherently superior to prayer, but because it remains the divinely mandated physical anchor for a species that cannot sustain pure intellect. The Messianic restoration proves the act isn't the problem; the *idolatrous intent* was. Once the intent is purified, the act is eternal.
