      Hi everyone. Grandma hated the word code. She said DNA isn't a map. It's a chemical. People say she lives on in my DNA. She'd hate that. But she is here. Not in my cells, but in how I think. She taught me to ask "how does this work?" not "what is this for?" Family, don't worry, you carry her too. Not in blood, but in stories. Colleagues, I know her work. I'll keep asking the hard questions. Thank you.

