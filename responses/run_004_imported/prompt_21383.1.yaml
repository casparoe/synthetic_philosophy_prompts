      *   **Core Conflict:** She hated "code talk" (DNA as blueprint/message/program). She viewed DNA as a chemical molecule read by cellular machinery dependent on context/environment.
      *   **Specific Constraint:** Do *not* use the metaphors she rejected (blueprint, code, message, program, living on in DNA). Do *not* make it a philosophy lecture.
      *   **Goal:** Comfort the family (what *does* continue?) while satisfying the colleagues (showing I understood her argument).
      *   **Tone:** Personal, respectful, accessible but intellectually honest, closing remarks for a symposium.
      *   **Length:** About 5 minutes (approx. 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the "Code Talk" vs. Reality:**
      *   *Code Talk:* DNA = Destiny, static, instruction manual, top-down control, immortality through sequence.
      *   *Her View:* DNA = Tool, chemical, reactive, context-dependent, dynamic, interaction between molecule and environment.
      *   *The Challenge:* How to talk about inheritance/legacy without saying "she lives on in our genes"?
      *   *The Solution:* Focus on *process*, *interaction*, *habit*, *environment*, and *physical presence*. Legacy isn't a static file; it's an ongoing reaction.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting, the speakers before, and the unique position of the speaker (grandchild/high schooler). Establish the connection to the argument.
      *   **The Core Argument (The "No Code" Rule):** Address the elephant in the room. Acknowledge her pet peeve. Show the colleagues I get it, show the family why it mattered.
      *   **Reframing Inheritance (The "What Continues" part):** If not code, then what?
          *   Ideas? Yes, but specifically how they were handled.
          *   Habits of mind?
          *   Physical traits? (Careful here).
