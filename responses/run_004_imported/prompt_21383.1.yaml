      Ending: She isn't a blueprint. She's a catalyst.

      *Critique 2:* "Catalyst" is good science language. "Environment" is key. Need to make sure the family doesn't feel excluded by the science talk. Bridge the gap: The way she treated people is like the cellular environment.

