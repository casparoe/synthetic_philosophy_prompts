answer: |-
  Good afternoon. For those who don't know me, I'm Leo. I'm Sarah's grandson. I'm also, apparently, the only person in this room she successfully trained to be suspicious of the word "code."

  She told me once that if anyone gave a eulogy saying she'd "live on in the DNA of her grandchildren," she would find a way to haunt them. So, I want to be very careful. I know half the room is waiting for me to slip up, and the other half is wondering why I'm talking about molecules at a funeral.

  But this was her life. It wasn't just her job; it was how she loved us.

  When I was ten, we were walking in the woods behind her house. I asked her why I looked like her. I asked if her "instructions" were inside me. She stopped, picked up a fallen branch, and told me that wasn't how it worked. She said DNA isn't a map, and it isn't a command. It's just a molecule. It's a thing that sits in the dark, waiting for other things to bump into it.

  She told me that I wasn't built from a blueprint she left behind. I was grown. And growing isn't about following a script; it's about reacting. It's about light, and food, and stress, and love, and the chemical noise of a billion other cells deciding what to do next.

  For a long time, I thought that was a cold way to see it. If she isn't written in me, then where is she?

  But standing here, looking at all of you, I realize that her view was actually much more comforting than the alternative.

  If we were just following a code, then her death would mean the signal has stopped. The message would be finished. But if we are talking about chemistry, about interaction, about context—then she is still part of the reaction.

  To her colleagues: You know better than anyone that she didn't just study genes. She studied how genes behave when the world touches them. She taught us that the molecule doesn't dictate the outcome; the environment does.

  To my family: We are that environment.

  The way she continues to exist isn't in a static sequence locked inside my cells. It's in the habits she built into us. It's in the way my mother checks the source of a story before she shares it. It's in the way my uncle fixes things instead of throwing them away. It's in the questions I ask when my teachers tell me something is "just the way it is."

  She didn't give us instructions. She gave us context. She shaped the soil we grew in. And anyone who has spent time in this department knows that if you change the conditions of the experiment, you change the result. She changed our conditions. She changed the temperature of this room, metaphorically and literally, for decades.

  So, I am not a copy of her. I am not a vessel carrying her message. I am a result of having collided with her, over and over again, for seventeen years. And so are you. Her students, her friends, her children. We are all evidence of the same reaction.

  She used to say that biology is messy. It's not clean lines or digital data. It's wet, and chaotic, and dependent on a million factors you can't control. Grief is like that, too. There is no program for how to miss someone. There is just the chemistry of absence, and the way we adjust to the new conditions.

  I promise to keep arguing with her. I promise to keep correcting people who call DNA a blueprint. And I promise to remember that while the molecule is stable, the life it helps build is fragile, and temporary, and precious because it isn't predetermined.

  She's not watching from the code. She's not in the data. She's in the machinery. She's in the work you do tomorrow morning when you walk into the lab and ask "how?" instead of "what." She's in the way we raise our children, knowing we aren't programming them, but gardening them.

  She warned me she'd come back if I used the wrong words. I think I've kept my end of the bargain. But knowing her, she's probably still hovering near the exit, ready to correct my pronunciation of "epigenetic."

  Thank you for letting me speak. And thank you for keeping the question open.
