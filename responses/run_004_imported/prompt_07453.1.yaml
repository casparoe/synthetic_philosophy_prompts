      *   *Mother's View (Friday/Cardiac Death):* Focuses on the physical presence, warmth, heartbeat. It feels wrong to say someone is dead when they look alive. The finality came when the machine stopped.
      *   *The User's Insight:* Knows the academic debate (Bernat vs. Shewmon) but recognizes this isn't the place for a lecture. The debate itself validates *both* feelings. The ambiguity is real, not just emotional denial.

  3.  **Determine the Core Message:**
