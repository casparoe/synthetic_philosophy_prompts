answer: |-
  Good morning. Thank you all for being here, especially after a week that has felt less like a single goodbye and more like a long, slow exhale.

  We gather to honor my grandmother. To remember her laugh, her stubbornness, the way she could fill a room just by walking into it. But I know that for many of us, and especially for this family, remembering her life is tangled up with the strange and painful circumstances of her death.

  We are carrying two dates in our hearts this week. Tuesday and Friday. Four days apart.

  I know there has been confusion. I know there has been argument. In a normal death, the moment is singular. A breath is taken, and not returned. The heart beats, and then it stills. It is sharp. It is final. But what we endured was not normal. It was a limbo that medicine created to honor her wish to be a donor, but which left those who loved her in a difficult space.

  To my uncle, and those who hold Tuesday as the day she left us: You saw the truth of her mind. You saw that the person—the consciousness, the spirit that made her *her*—had already departed. When the light in the mind goes out, the body is only a vessel. For you, the goodbye happened when she could no longer know us.

  To my mother, and those who hold Friday as the day she left us: You saw the truth of her presence. You saw the warmth of her skin, the rise and fall of her chest. To say someone is gone while they still feel warm is a violence to the heart. For you, the goodbye happened when the physical connection was finally, truly broken.

  I have spent this week reading, thinking, and trying to find words that can hold both of these truths. And what I have found is that I cannot tell you which day is the correct one. Not because I don't care, but because the question itself is larger than any of us.

  Even the experts, the doctors and philosophers who spend their lives defining these boundaries, do not agree. They write books and hold councils and debate where the line is drawn between life and death. Is it the brain? Is it the heart? Is it the integration of the whole? The truth is, the line is not as clear as we wish it were.

  And perhaps that is okay. Perhaps we don't need to solve the mystery of death to honor the mystery of her life.

  If Tuesday was the day she died, then Friday was the day we were allowed to finish loving her body. If Friday was the day she died, then Tuesday was the day her spirit began its journey ahead of us. In either case, the result is the same: She is gone. And we are here.

  I think my grandmother would be the first to tell us not to fight over the mechanics of her leaving. She was a woman who cared about how people lived, not how they were measured. She cared about kindness, about family, about showing up.

  So, let us not spend our energy trying to pin down the exact second the candle flickered out. Let us instead focus on the light it cast while it burned.

  For those who lost her on Tuesday: May you find peace in knowing her suffering ended then, and her mind was at rest.
  For those who lost her on Friday: May you find peace in knowing you stayed by her side until the very last physical beat, honoring her body until it was time to let go.

  We don't need to agree on the time of death to agree on the value of her life. We don't need to settle the philosophy to settle our grief.

  Grandma, wherever you are, whether you left us at the beginning of that week or the end of it, you have left a mark on us that no machine can measure and no definition can contain. You are woven into us. And that part of you is not dead. It is not even gone.

  Rest now. We will take it from here.
