      *   *Point 3: Belief Attribution Paradox.* Kripke shows that standard Fregean belief attribution leads to contradiction (Pierre believes P, Pierre believes not-P, Pierre is rational). Fregeans usually say "Ah, different senses!" But Kripke shows that even granting different senses, we can't consistently *report* the beliefs without violating translation or disquotation principles. This suggests the Fregean machinery is broken, not just the specific case.
      *   *Point 4: Sam's "Separate Puzzle" Defense is Weak.* You can't separate semantics (Sense/Ref) from belief (Propositional Attitudes). Frege introduced Sense *specifically* to handle belief contexts (obliquity). If the puzzle arises in belief contexts (which it does), it *is* a problem for Frege's original solution.

