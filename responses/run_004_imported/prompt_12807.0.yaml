      *   **Frege's Solution:** Sense (*Sinn*) mediates reference (*Bedeutung*). "Hesperus" and "Phosphorus" have different senses but the same reference. Belief contexts are opaque; we relate to senses, not just references.
      *   **Kripke's Puzzle (Pierre):** Pierre believes "Londres est jolie" (London is pretty) and "London is not pretty." He is rational. He doesn't know "Londres" = "London."
      *   **The Conflict:** If Frege is right, Pierre must associate different *senses* with "Londres" and "London." But Kripke argues that if we accept Frege's criteria for sense (cognitive significance), we run into contradictions or infinite regresses when trying to formalize belief attribution. Specifically, the "Disquotational Principle" and the "Principle of Translation" create a paradox for Fregeans.
      *   **User's Specific Angle:** The user argues that for a fluent bilingual, "London" and "Londres" *shouldn't* differ in sense, yet the puzzle persists. Or rather, that Frege's mechanism doesn't solve the underlying issue of how identity statements function in belief contexts generally. The user feels Sam is compartmentalizing too much.

  3.  **Formulate the Argument (User's Side):**
