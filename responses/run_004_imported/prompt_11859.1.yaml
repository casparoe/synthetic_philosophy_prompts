prompt: |-
  Ok, this has nothing to do with anything I actually teach but it's been bugging me since a dinner party last weekend and I'm hoping you can help me think it through, since this kind of puzzle really isn't my department (I mostly work on Kant, so go easy on me).

  Someone told this story about a friends cousin, who was out mountain biking alone on some remote trail, wiped out badly and broke his collarbone, and eventually flagged down another rider coming the other way. That guy said he'd go back for his truck and drive the cousin the hour or so to the nearest ER, but only on the condition that the cousin Venmo him $300 once they arrived, basically to cover his gas and time (and I'm guessing as some kind of insurance against the cousin turning out to be more trouble than he was worth). The cousin agreed, got the ride, got dropped off at the ER... and then just never paid. Weeks later, when someone asked him about it, he said something like "by the time we got there, there was nothing he could do to make me pay up, so sending the money would've just been throwing it away," clearly pretty pleased with having figured that out.

  This kicked off a whole argument at the table. One friend said the cousin was being a selfish ass, full stop, but another said no, actually, once you think it through he did the smart, rational thing, and paying would just be sentimental. Neither answer sat right with me. So: is the second friend correct that not paying was the rational move, or is there a mistake buried in that reasoning somewhere? And here's the part that really gets me — if you were the guy with the truck, and you somehow knew in advance exactly how the cousin would think about things once he was safely at the hospital, would stopping to help him in the first place have been a mistake on you're part? I keep feeling like there's a real puzzle here rather than just one guy being a jerk, but I can't quite get a handle on what it is. Curious what you make of it.
