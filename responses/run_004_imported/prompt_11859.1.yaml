answer: |-
  This is a fantastic puzzle, and it makes perfect sense why it stuck with you. It feels like a moral problem, but as your friend at the dinner party pointed out, it's being defended on the grounds of *rationality*. That shifts the terrain from ethics to decision theory, which is where the real knot lies.

  Since you work on Kant, I'll try to keep the jargon light, but I suspect you'll recognize the structure of the problem immediately. The short answer is: **Friend 2 is confusing "opportunism" with "rationality."** The cousin's reasoning contains a specific logical error known in game theory and economics as **time inconsistency** (or the "hold-up problem").

  Here is how to untangle it.

  ### 1. The Mistake in the "Rationality" Argument
  Friend 2 argues that once the cousin was at the ER, the leverage was gone. Therefore, paying is a net loss ($300 out, $0 benefit in). In a single-shot transaction with no future consequences, Friend 2 is technically right: paying is economically inefficient *at that specific moment*.

  However, that reasoning assumes the transaction *started* on the trail and *ended* at the ER. It didn't. The transaction started when the cousin **made a promise**.

  The cousin's error is treating the agreement as a coercion based on physical leverage ("I have the truck, you have a broken bone") rather than a **credible commitment** ("I am the kind of person who pays for services rendered").

  If you define rationality as "maximizing your outcome in a single isolated instance," the cousin wins. But human beings don't live in isolated instances. We live in a reputation economy. By reneging, the cousin has signaled that his word is worthless. If he ever finds himself in a similar position again (or if word gets around his biking community), his "cost" for rescue just went up significantly, or his access to rescue just went down.

  So, the mistake in Friend 2's reasoning is a failure of **scope**. They are looking at a snapshot (the moment at the ER) rather than the whole film (the lifecycle of a promise). A rational agent knows that maintaining the integrity of their own commitments is a valuable asset. Burning that asset for $300 is actually a bad trade.

  ### 2. The Game Theory Lens: Time Inconsistency
  This is a classic case of **time inconsistency**.
  *   **Time 1 (On the trail):** The cousin prefers {Rescue + Promise to Pay} over {No Rescue + No Payment}. He makes the promise to secure the rescue.
  *   **Time 2 (At the ER):** The cousin prefers {Rescue + No Payment} over {Rescue + Payment}. The incentive structure has flipped because the rescue is already secured.

  A truly rational agent anticipates Time 2 while they are at Time 1. If you know you will defect at Time 2, you cannot sincerely make the promise at Time 1. By making the promise, the cousin essentially lied about his future self's intentions to secure a benefit from the driver.

  In game theory, this is why contracts exist. We create external enforcement mechanisms because we know our internal incentives will shift once the other party has held up their end. The cousin exploited the lack of a written contract, but that doesn't make it "rational"; it makes him a **free rider** on the norm of promise-keeping.

  ### 3. The Kantian Echo (Since you mentioned it)
  I know you said go easy, but this is practically begging for a nod to the Categorical Imperative.
  The cousin's maxim seems to be: *"I will make promises when I am desperate to secure aid, but I will break them once I am safe if paying costs me money."*

  If you universalize that maxim, the institution of emergency bargaining collapses. If everyone reasoned like the cousin, no driver would ever stop to help based on a promise of payment. They would demand cash upfront (which an injured person might not have) or drive past entirely. By acting on this maxim, the cousin is undermining the very system that saved him. He is treating the driver purely as a means (a taxi service) rather than an end (a partner in an agreement).

  But you don't even need Kant to see the flaw. You just need to recognize that **trust is a currency.** The cousin stole $300 worth of trust.

  ### 4. Was the Driver Mistaken to Help?
  This is the second part of your puzzle, and it's the harder one.
  If the driver *knew in advance* that the cousin would defect, was helping a mistake?

  **Instrumentally:** Yes. If your goal is to maximize your utility (gas + time vs. money), and you know the return is $0, then the action has negative utility. It was a bad investment.

  **Systemically:** No. And here is why.
  If the driver adopts a policy of *"I will only help if I can guarantee payment,"* he places himself in a position where he can almost never help. Emergency situations are, by definition, information-poor and high-risk. You cannot verify creditworthiness while someone is bleeding on a trail.

  If every potential rescuer adopts the cousin's logic (don't help unless it's safe/profitable) or the driver's hypothetical logic (don't help unless payment is guaranteed), the trail becomes a place where broken bones lead to death.

  The driver wasn't mistaken to help; he was operating on a **heuristic of trust** that is necessary for society to function. The cousin was the one who introduced the error into the system. The driver's "mistake" was simply that he encountered a defector. In a world of mostly cooperators, the driver's strategy (Help first, trust the promise) yields a higher overall payoff than the strategy (Demand collateral, risk letting people die).

  ### The Verdict
  The puzzle you're feeling is the tension between **local rationality** (saving $300 right now) and **global rationality** (being a person whose word means something).

  Friend 2 is arguing for local rationality. They are saying, "Given the board state *now*, move the pawn to save money."
  But the cousin isn't playing a single game of chess; he's playing a tournament. By cheating in this round, he risks being disqualified from future rounds.

  So, to answer your specific questions:
  1.  **Is Friend 2 correct?** No. The reasoning is flawed because it ignores the long-term cost of reputation and the logical inconsistency of making a promise you intend to break. It confuses "getting away with it" with "rationality."
  2.  **Was the driver mistaken?** Ex post (after the fact), he got burned. Ex ante (before the fact), his decision to help was rational because a world where we help based on verbal agreements is better than a world where we don't, even if it occasionally gets exploited.

  The cousin didn't outsmart the system; he just stole from it. And while stealing can be profitable in the short term, it's rarely a sustainable rational strategy.
