          *   *Dutch Book:* Focuses on the *updating rule*. Are you double-counting evidence? (Geological analogy: Using the same well log data to pick the model *and* then again to prove the model is probable).
          *   *Verdict:* They are distinct. One is about *search space*, the other about *accounting*.
      *   **Analyzing Lipton's Move:**
          *   Lipton says: Use "loveliness" (explanatory power) to set the Prior ($P(H)$) or Likelihood ($P(E|H)$).
