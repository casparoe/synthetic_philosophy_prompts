      *   **Van Fraassen's "Best of a Bad Lot":** This is an *ontological/epistemic* worry. It says: "Just because $H_1$ is better than $H_2$ and $H_3$, doesn't mean $H_1$ is *true*. The truth might be $H_4$, which no one has thought of." It attacks the *truth-conduciveness* of IBE.
      *   **Van Fraassen's "Bayesian/Dutch Book" Dilemma:** This is a *formal/probabilistic* worry. It says: "Belief updating must follow Bayes's Rule to avoid irrationality (Dutch Books). If IBE adds an extra 'boost' to a hypothesis because it's 'lovely' (explanatory), it violates Bayes's Rule. If it doesn't add a boost, it's redundant." It attacks the *rationality/consistency* of IBE.
      *   **Lipton's Response:** IBE isn't a rival to Bayesianism; it's a heuristic for setting the inputs (priors and likelihoods). We find $H_1$ "lovely," so we assign it a higher prior or likelihood *before* running the Bayes calc.
      *   **The Counter-Critique to Lipton:** Does this solve the problem? Or does it just push the question back to "How do you justify those priors?" (The "Relocation" worry).

