answer: |-
  An evil demon corners a buck-passing theorist. "Desire this saucer of mud," the demon threatens, "or I'll torture you for eternity!"

  The theorist closes their eyes, concentrates, and successfully cultivates a pro-attitude toward the mud. "Done," they say. "I desire it."

  "Excellent," says the demon. "So you admit the mud is good."

  "Not at all," says the theorist. "You've given me a reason to *have* the desire, but no reason *for* the desire."

  The demon blinks. "English."

  "You've made it useful to want," says the theorist, dusting off their knees. "You haven't made it worth wanting."

  The demon sighs, extinguishes his torch. "You know, the hedonist just screamed 'Yes!' and saved us both twenty minutes."
