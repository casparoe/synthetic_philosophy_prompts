      *   **Section 1: The Classical Formulation (Zahavi & The Textbook View).**
          *   Explain the logic: Cost guarantees honesty.
          *   Explain the equilibrium claim: Honest signalers *must* pay the price.
          *   Example: Peacock tails (energetic cost, predation risk).
      *   **Section 2: The Mathematical Correction (Grafen, Getty, Számadó).**
          *   Explain Grafen's 1990 model.
          *   The crucial distinction: *Marginal* cost vs. *Total* cost.
          *   The Getty/Számadó critique: Grafen's model allows for net benefits. The "handicap" is the *potential* cost for the faker, not the *actual* loss for the honest signer.
          *   Analogy: A bond. You don't lose the money if you're honest, but the threat of losing it keeps you honest.
      *   **Section 3: Hard Cases (Indices and Net Benefits).**
          *   *Index Signals:* Roars, body size. These rely on physical constraints, not strategic costs. They show cost isn't *always* needed, but they aren't "handicaps" in the game-theoretic sense. They support the idea that reliability $\neq$ waste.
          *   *Net-Beneficial Signals:* If a signal brings huge mating rewards, the net fitness is positive. Under the classical view, this shouldn't be stable. Under the differential view, it is stable as long as low-quality individuals gain *less* (or lose more) by signaling.
      *   **Section 4: Synthesis and Verdict.**
