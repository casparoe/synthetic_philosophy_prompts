          *   Induction: Descending tower doesn't trust equally powerful successor. (Yes)
      *   *Tone Check:* Avoid being too colloquial. Keep it grounded in the math/philosophy. Use terms like "derivability conditions," "reflective consistency," "computable Dutch book."

  5.  **Final Polish:**
      *   Add stage directions for pacing.
      *   Ensure the Löb proof on the board is referenced visually.
      *   Make sure the ending feels natural (a pause, not a resolution).

  6.  *(Mental Sandbox)*: Let's try a line for Elena. "You're trading truth for coherence." Marcus: "I'm trading impossibility for feasibility." That's a good core tension. Let's weave that in.

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Two specific characters? Yes.
      *   Whiteboard context? Yes.
      *   Specific arguments (asymptotic vs one-shot, tower vs equal power)? Yes.
      *   No forced agreement? Yes.

