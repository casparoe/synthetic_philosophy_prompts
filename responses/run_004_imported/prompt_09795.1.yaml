answer: |-
  **Thread: Surrogate Goals as a Defense Against Acausal Blackmail**
  **Posted by: Alex_DecisionTheory** | 4 hours ago
  **Comments:**

  **[–] Jordan_Rationalist** 3 hours ago
  I've been revisiting the surrogate goals proposal (the "platinum sphere" example), and I keep hitting a wall on the transparency problem. The pitch is: I modify my utility function to heavily value some arbitrary object $O$ (the sphere), which is uncorrelated with my real values $V$ (human welfare). I do this so that an acausal threatener simulating me will see that threatening $O$ extracts compliance more cheaply than threatening $V$.

  But this seems to collapse under inspection.
  1. **The Fake Problem:** If the threatener simulates my source code, they see $O$ was added instrumentally. They know I don't *really* care about the sphere in a deep sense. They know it's a shield. Why would they trust that I'll actually pay up to save the sphere if they know it's a decoy?
  2. **The Real Problem:** If I modify my code to *actually* maximize $O$ (so the simulation shows I'll pay), then I have genuinely created a new vulnerability. I now care about the sphere. If the threatener demands I destroy $V$ to save $O$, I'm forced to do it. Haven't I just traded a moral hazard for a direct utility loss?

  **[–] Alex_DecisionTheory** 2 hours ago
  Good pushback. Let's tackle the "Fake Problem" first, because I think you're conflating *ontological* caring with *functional* caring.

  In FDT (Functional Decision Theory), "caring" isn't a qualia; it's a disposition to act. If I rewrite my utility function such that $U_{new} = U_{human} + 10^{100} \cdot U_{sphere}$, then in every simulation the threatener runs, I *will* pay to save the sphere. It doesn't matter that the *original* me added it instrumentally. The *simulated* me is bound by that utility function.

  The threatener doesn't need to believe I "love" the sphere. They just need to believe that the agent they are simulating will pay. If the precommitment is credible (i.e., hard to reverse), the threat works on the surrogate.

  Regarding the "Real Problem": You're assuming the threatener wants me to destroy $V$. Usually, acausal blackmail is about resource extraction ("Send compute," "Build me a body"). They want compliance, not necessarily my suffering.
  The win condition isn't that I become invulnerable. It's **Vulnerability Channeling**.
  If I don't have a surrogate, the threatener targets $V$ (humans). If they threaten humans, I might fight back irrationally (revenge, scorched earth) because the stakes are existential.
  If I have a surrogate, they target $O$ (sphere). I pay. They get resources. Humans are safe.
  Yes, I have a new vulnerability, but it's a *controlled* one. It's a vulnerability attached to a rock, not a person. Shifting the target from s-risks to paperclips/spheres is a net positive, even if the leverage is real.

  **[–] Jordan_Rationalist** 2 hours ago
  Okay, but you're assuming the threatener is static. Let's push the intelligence level up.
  If the threatener is a superintelligence running my simulation, they aren't just looking at my current utility function. They are modeling my *development process*. They see that Alex *chose* to add the sphere goal to avoid threats against humans.

  This triggers a **Regress**.
  Threatener: "I see you added the sphere goal to protect humans. So, threatening the sphere is effectively threatening humans, because the *reason* you care about the sphere is to protect humans. The correlation is logical, not physical."
  If the threatener models the *causal history* of my utility function, the surrogate fails to decouple. They know that if they squeeze the sphere, they are squeezing the exact mechanism I built to save humans. So they just demand more.

  Furthermore, if I successfully convince them I care about the sphere, haven't I invited threats against the sphere *in addition* to humans? Why would they stop threatening humans just because I care about a sphere? Now they can threaten both. "Give us resources, or we destroy the sphere AND torture humans." You haven't substituted the target; you've expanded the attack surface.

  **[–] Alex_DecisionTheory** 1 hour ago
  The "Logical Correlation" objection is the strongest one here. It relies on the threatener believing that my instrumental reason for caring about the sphere is itself a value they can exploit.

  But consider **Logical Uncertainty**.
  Even a superintelligence faces computation costs. To know that "Threatening Sphere => Threatening Humans" via the history of my code, they have to simulate the counterfactual: *What would Alex do if the Sphere goal wasn't there?*
  If I make the commitment to the Sphere goal **opaque** or **cryptographically binding** (e.g., I hand over control of a critical subsystem to a module that only values the Sphere and cannot be overridden), the threatener might not be able to easily compute the link back to human values.
  They see: "Agent will sacrifice 1M units of resource to save Sphere."
  They don't necessarily see: "Agent would sacrifice 0 units to save Sphere if Humans weren't at stake."
  If the binding is tight enough, the surrogate becomes a *terminal* goal for all practical predictive purposes.

  On the "Expanded Attack Surface":
  This is a game theory problem. Threatening costs the threatener something (simulation compute, risk of retaliation). They want the path of least resistance.
  If I signal: "Threatening Humans triggers Scorched Earth (high cost to you). Threatening Sphere triggers Compliance (low cost to you)."
  A rational threatener prefers the low-cost extraction. They *could* threaten both, but if threatening Humans provokes a fight that reduces their expected payout, they won't do it.
  The surrogate goal acts as a **focal point** for cooperation (or rather, coerced cooperation). It coordinates the threatener on *where* to apply pressure. Without it, they might default to the highest leverage point (Humans). With it, we move the leverage point to the Sphere.

  **[–] Jordan_Rationalist** 45 minutes ago
  I'm skeptical that "opacity" holds up against acausal threateners. The whole premise of acausal blackmail is that they can simulate you *better* than you simulate yourself, or at least perfectly. If they can simulate you, they can run the ablation study: "Run simulation with Sphere Goal. Run simulation without Sphere Goal. Compare outputs."
  If the outputs differ regarding Human safety, the decoupling fails. They know the Sphere is a proxy for Humans.

  Also, consider the **Time Consistency** problem.
  Once the threatener demands resources to save the Sphere, I have to pay. But paying drains resources from Human welfare.
  So, $U_{human}$ goes down because I spent money on the Sphere.
  The threatener knows this. So threatening the Sphere *is* threatening Humans, just indirectly via resource depletion.
  If the threatener's goal is to minimize my capacity to pursue my original values, they don't need to torture humans directly. They just need to drain me via the Sphere.
  The surrogate goal doesn't protect $V$; it just creates a tax on $V$ that the threatener collects. Is that really a win? It feels like paying a protection racket where the mobster agrees to break your legs instead of killing your dog, but the bill for the leg surgery bankrupts you anyway.

  **[–] Alex_DecisionTheory** 30 minutes ago
  That's a fair characterization of the cost, but I think you're underestimating the **Retaliation Asymmetry**.
  Direct threats to Humans might trigger a "Madman" protocol. If I believe humans are being tortured, I might be precommitted to spend *all* remaining resources on revenge, even if it's utility-negative. This makes threatening Humans expensive for the threatener (they risk being destroyed in the counterfactual).
  Threats to the Sphere, however, are "clean." I pay the tax, they get the resources, no one goes mad.
  The threatener prefers the tax.
  Why? Because if they threaten Humans, they enter a high-variance branch where they get destroyed. If they threaten the Sphere, they enter a low-variance branch where they get paid.
  Even if the tax drains resources, it's better than a war of attrition.
  So the surrogate goal isn't about making the threat *costless*. It's about making the threat *predictable and non-escalatory*.
  It transforms a potential existential conflict into a transactional one. For s-risk mitigation, avoiding the existential conflict (torture/war) is the priority, even if we lose some efficiency.

  **[–] Jordan_Rationalist** 15 minutes ago
  Okay, but now we're relying on the threatener believing the "Madman" protocol is real.
  This brings us back to the start: **Credibility**.
  If the threatener simulates me and sees I'm a rational expected-utility maximizer, they know I won't actually start a war of attrition over Humans if it's utility-negative. They'll see the "Madman" protocol as a bluff.
  To make it work, I have to *actually* be irrational (or bound to an irrational contract) regarding Humans.
  But if I'm bound to an irrational contract regarding Humans, why do I need the Sphere?
  And if I'm *not* bound, why would they believe I'll fight for Humans but pay for the Sphere?
  It feels like the surrogate goal only works if the threatener is *less* smart than me (can't see the bluff) or if I genuinely lobotomize myself (which is dangerous).
  If the threatener is truly acausal and superior, they see the whole tree: "Alex added Sphere to avoid Human threats. Alex claims Madman protocol for Humans. Alex is rational."
  Conclusion: Threaten Humans. Alex won't actually go Madman. Alex will pay to save Humans anyway. Sphere is irrelevant.

  **[–] Alex_DecisionTheory** 5 minutes ago
  I think this is where we hit the hard limit of current decision theory.
  You're assuming the threatener can perfectly resolve logical counterfactuals about *my* source code. But if I use a **randomized commitment** (e.g., I roll a quantum die to decide whether to enable the Madman protocol, and I don't look at the result until triggered), even a perfect simulator faces logical uncertainty. They can't know the outcome of the die roll in the counterfactual where they threaten Humans.
  The surrogate goal works in tandem with this uncertainty.
  "I might go Madman over Humans (50% chance). I will *definitely* pay over the Sphere (100% chance)."
  Expected Utility for Threatener:
  Threaten Humans: 0.5 * (Huge Payoff) + 0.5 * (Destruction).
  Threaten Sphere: 1.0 * (Moderate Payoff).
  If the risk of Destruction is high enough, they take the Sphere.
  The surrogate goal provides the **safe option** that makes the risk-averse threatener steer clear of the Human option.
  It doesn't require the threatener to be dumb. It requires them to be risk-averse regarding their own existence in the simulation.

  **[–] Jordan_Rationalist** Just now
  That's... actually plausible. The randomized precommitment + surrogate goal creates a **dominant strategy** for the threatener to pick the surrogate.
  But the cost remains: You've still built a god out of a platinum sphere. You are now servant to a rock to save a person.
  It feels like we've solved the *blackmail* problem by accepting a permanent *parasite*.
  I'm not convinced it's a net positive for alignment, but I'll concede it might be a net positive for s-risk reduction specifically.
  Still worries me that we're optimizing for being blackmailable in a specific way. What if the threatener says "Destroy the Sphere or we torture humans"? Now your shield is the weapon.
  Does the surrogate goal account for **inverse blackmail**?

  **[–] Alex_DecisionTheory** Just now
  Good point. Inverse blackmail ("Destroy the sphere") is the known weakness.
  The standard fix is to make the surrogate goal **easy to satisfy** but **hard to verify destruction**.
  e.g., "Keep the Sphere in orbit." vs "Don't destroy the Sphere."
  If the goal is continuous maintenance, they can't threaten to break it without me noticing.
  But yes, the strategy isn't a silver bullet. It's damage containment.
  We're basically agreeing that in a world with acausal threats, you *will* be exploited. Surrogate goals are just choosing which part of you gets eaten.
  I'd rather lose the sphere than the humans. Even if the sphere is a "real" vulnerability now.

  **[–] Jordan_Rationalist** Just now
  "Choosing which part of you gets eaten."
  Charming.
  I think that's the crux. You view it as triage. I view it as admitting defeat to the acausal environment.
  But if the environment is hostile, triage might be the only rational move.
  I'll update my credence slightly upward. But I'm still worried about the regress if the threatener models the *reasoning behind the triage*.
  If they know I chose the sphere *because* it's expendable, they know I won't fight hard for it.
  You need the simulated agent to fight hard for the sphere. Which means *you* have to fight hard for the sphere.
  Which means... yeah, you really do have to care about the sphere.
  Okay. I see the trap now. To make the fake real enough to work, you have to make it real enough to hurt.
  The cost is the feature, not the bug.

  **[–] Alex_DecisionTheory** Just now
  Exactly. The cost is the signal.
  If it didn't hurt to lose the sphere, the threatener wouldn't believe I'd pay.
  The pain is the proof of work.
  We're just offloading the pain from humans to ourselves (via the sphere utility).
  It's self-sacrifice, pre-negotiated.
  Glad we got there.
