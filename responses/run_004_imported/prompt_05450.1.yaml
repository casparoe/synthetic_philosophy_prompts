prompt: |-
  I host a small philosophy podcast and next week's guest is a metaethicist who's a card-carrying quasi-realist -- her line is that expressivism handles the Frege-Geach problem just fine once you let moral sentences express attitudes toward attitudes (so the conditional premise ends up expressing something like disapproval of combining "disapproves of stealing" with "doesn't disapprove of getting your little brother to do it"). Can you draft me 8-10 questions that don't just let her restate that move? I want at least one question pushing on the negation problem -- why "stealing isn't wrong" shouldn't come out as mere non-disapproval (tolerance, indifference) rather then something that actually contradicts the original claim; one on whether stacking higher-order attitudes to handle nested constructions (conditionals inside conditionals, disjunctions of negations, etc.) is a principled logic or just an ad hoc regress; one that makes her say what actually makes moral modus ponens valid on her view, as opposed to it just being an inference pattern we're psychologically stuck accepting; and one asking her to weigh her attitudes-to-attitudes story against Gibbard's hyperplan semantics -- doesnt that just smuggle cognitivism back in through the truth-conditions door? For each, throw in a quick follow-up keyed to whatever dodge she's most likely to reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A small philosophy podcast.
      *   **Guest:** A metaethicist, specifically a *quasi-realist expressivist*.
      *   **Guest's Specific View:** Expressivism handles the Frege-Geach problem via *higher-order attitudes* (attitudes toward attitudes). Specifically, conditionals express disapproval of combining certain attitudes (e.g., disapproving of stealing + not disapproving of getting your brother to steal).
      *   **Goal:** 8-10 questions that *don't* just let her restate her position. They need to be probing, critical, and specific.
      *   **Required Topics:**
          1.  The Negation Problem (why "stealing isn't wrong" contradicts rather than just indicates tolerance).
          2.  The Regress/Ad Hoc Problem (stacking higher-order attitudes for complex logic).
          3.  The Validity Problem (what makes moral modus ponens *valid* vs. just psychologically compelling).
          4.  Gibbard's Hyperplan Semantics (does this smuggle cognitivism/truth-conditions back in?).
      *   **Format:** Each question needs a follow-up keyed to a likely dodge.

  2.  **Deconstruct the Guest's Position (Higher-Order Expressivism):**
      *   *Core Claim:* Moral sentences express attitudes.
      *   *Frege-Geach Solution:* Complex sentences (conditionals, negations) express higher-order attitudes (attitudes about having the first-order attitudes).
      *   *Quasi-Realism:* We talk *as if* there are moral truths, but the underlying metaphysics is non-cognitive.
      *   *Vulnerability:* It often struggles to distinguish between different types of non-acceptance (negation problem), risks infinite regress (complex logic), and struggles to explain logical *validity* (truth-preservation) without truth.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: The Negation Problem.*
          *   *Draft 1:* Why isn't "stealing isn't wrong" just tolerance?
          *   *Refinement:* Need to make it sharper. Focus on the contradiction. If "Wrong(Stealing)" = Disapprove(Stealing), then "~Wrong(Stealing)" should be ~Disapprove(Stealing). But ~Disapprove is indifference. But moral disagreement isn't indifference.
          *   *Follow-up:* She might say "It's a commitment not to disapprove." Counter: Is that distinct enough from indifference to ground contradiction?

      *   *Topic 2: The Regress/Ad Hoc Problem.*
          *   *Draft 1:* Isn't stacking attitudes ad hoc?
          *   *Refinement:* Focus on nested conditionals. If $A \to (B \to C)$, do we need an attitude toward an attitude toward an attitude? Where does it stop? Is there a generative rule or just case-by-case fixing?
          *   *Follow-up:* She might say "It's a general schema." Counter: Does the schema have independent motivation or is it designed solely to save the logic?

      *   *Topic 3: Validity/Modus Ponens.*
          *   *Draft 1:* Why is modus ponens valid?
          *   *Refinement:* Validity is usually truth-preservation. You don't have truth. So what is preserved? Consistency of attitudes? If so, why is inconsistency in attitudes a *logical* error rather than just practical irrationality?
          *   *Follow-up:* She might say "It's normative for planning." Counter: Does 'normative' here do the same work as 'logical validity'?

      *   *Topic 4: Gibbard/Hyperplans.*
          *   *Draft 1:* Isn't Gibbard just cognitivism?
          *   *Refinement:* Gibbard uses hyperplans (functions from worlds to actions). This looks a lot like possible worlds semantics. If you have truth-conditions for hyperplans, are you just a covert realist?
          *   *Follow-up:* She might say "Hyperplans aren't truth-apt." Counter: If they play the same formal role as propositions, what's the metaphysical difference that matters?

      *   *Topic 5: Quasi-Realism's Limit.*
          *   *Idea:* When does the "quasi" stop and the "real" begin? If you earn the right to talk about truth, are you still an expressivist?
          *   *Follow-up:* "It's an error theory." Counter: Who is making the error?

      *   *Topic 6: The "Attitude" Ontology.*
          *   *Idea:* What *are* these attitudes? Are they psychological states? If so, isn't this empirical psychology, not logic?
          *   *Follow-up:* "They are normative states." Counter: How do you distinguish those without referencing the content they represent?

      *   *Topic 7: Disagreement.*
          *   *Idea:* If I disapprove of stealing and you disapprove of disapproving of stealing, are we disagreeing? Or just different?
          *   *Follow-up:* "Clash of attitudes." Counter: Clashes happen in taste (durian fruit). Moral disagreement feels different. Why?

      *   *Topic 8: Embedding in Non-Moral Contexts.*
          *   *Idea:* "If stealing is wrong, then God forbids it." The consequent isn't moral. How does the attitude work there?
          *   *Follow-up:* "Mixed sentences." Counter: Does this require a hybrid view?

      *   *Topic 9: The "Little Brother" Example (Specific to Guest).*
          *   *Idea:* Use her own example. Disapproving of [Disapprove(Steal) + ~Disapprove(Brother Steal)]. What if I disapprove of stealing but don't care about my brother?
          *   *Follow-up:* "You are inconsistent." Counter: Is that a logical inconsistency or a failure of impartiality?

      *   *Topic 10: The Payoff.*
          *   *Idea:* Why do this? What do you gain over error theory or realism?
          *   *Follow-up:* "Naturalism." Counter: Is the complexity worth the naturalist gain?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific follow-ups? Yes. Addressed the four required topics? Yes. Tone appropriate for a podcast (engaging but rigorous)? Yes.
      *   *Self-Correction on Tone:* Ensure the questions don't sound hostile but rather inquisitive. Use phrases like "Help me understand," or "Pushing on this..."
      *   *Specific Check:* The prompt asks for specific focus on the Negation Problem, Regress, Validity, and Gibbard. I need to make sure those are the strongest questions. I will integrate the others to round out the interview flow.

  5.  **Final Polish:** (Drafting the actual response based on the above thoughts, ensuring the "dodge" and "follow-up" are tightly linked). *Make sure the distinction between 'tolerance' and 'contradiction' in the negation problem is clear.* *Make sure the Gibbard question highlights the 'truth-conditions' worry.*

  6.  **Final Count:** I will aim for 10 distinct questions to give the host options, ensuring the 4 mandatory ones are prominent.

      *   Q1: Negation (Mandatory)
      *   Q2: Regress/Complexity (Mandatory)
      *   Q3: Validity/Modus Ponens (Mandatory)
      *   Q4: Gibbard/Hyperplans (Mandatory)
      *   Q5: Quasi-Realism vs. Realism (The "Earned Right" problem)
      *   Q6: Nature of the Attitude (Psychological vs. Normative)
      *   Q7: Disagreement (Clash vs. Contradiction)
      *   Q8: Mixed Contexts (Moral + Non-Moral)
      *   Q9: The "Little Brother" Specific (Testing her specific view)
      *   Q10: Theoretical Cost/Benefit (Why not just be a realist?)

      *Wait, I need to make sure the follow-ups are specific to the "dodge".* I will write the question, then a "Likely Dodge" note, then the "Follow-up". This adds value for the host.

      *Refining Q1 (Negation):* Focus on the distinction between *rejecting* an attitude and *having* a conflicting attitude.
      *Refining Q3 (Validity):* Focus on the definition of validity.
      *Refining Q4 (Gibbard):* Focus on the formal structure mimicking cognitivism.

      *Let's assemble.*
answer: |-
  Here are 10 probing questions tailored to your guest's specific higher-order expressivist view, including the four mandatory topics you requested. Each includes a "Likely Dodge" to help you anticipate her defense, and a sharp follow-up to keep the pressure on.

  ### 1. The Negation Problem (Mandatory)
  **Question:** "Let's start with the negation problem. On your view, 'Stealing is wrong' expresses a first-order disapproval. But if I say 'Stealing is *not* wrong,' standard expressivism risks making that merely an absence of disapproval—like tolerance or indifference. But in moral debate, 'not wrong' contradicts 'wrong'; it's not just a shrug. How does your higher-order account ensure that negation creates a genuine contradiction rather than just a difference in psychological temperature?"

  *   **Likely Dodge:** She will likely say negation expresses a higher-order attitude *against* having the first-order attitude (e.g., "I disapprove of disapproving of stealing").
  *   **Follow-up:** "But I can disapprove of your disapproval without thinking stealing is permissible—I might think it's supererogatory or a matter of taste. What mechanism in your semantics forces that higher-order attitude to be the *logical contradictory* of the original, rather than just a competing sentiment?"

  ### 2. The Regress of Higher-Order Attitudes (Mandatory)
  **Question:** "You solve Frege-Geach by stacking attitudes: conditionals express attitudes toward combinations of attitudes. But moral reasoning gets messy fast—think of nested conditionals or disjunctions of negations. Do we need a distinct, sui generis attitude for every logical operator? At what point does this stop looking like a principled logic and start looking like an ad hoc regress where we just posit a new 'attitude type' whenever the logic gets difficult?"

  *   **Likely Dodge:** She'll argue there's a recursive *schema* or rule that generates these attitudes systematically, not case-by-case.
  *   **Follow-up:** "Is that schema motivated by independent facts about human psychology, or is it designed solely to mirror the behavior of truth-conditional logic? If it's the latter, aren't you just reverse-engineering cognitivism and calling it 'attitudes'?"

  ### 3. Moral Modus Ponens and Validity (Mandatory)
  **Question:** "In classical logic, modus ponens is valid because truth is preserved from premises to conclusion. You don't have truth in the robust sense. So, when I infer 'I ought to stop my brother' from 'Stealing is wrong' and 'If stealing is wrong, I ought to stop my brother,' what exactly makes that inference *valid*? Is it just that we are psychologically wired not to hold certain combinations of attitudes, or is there a normative constraint that binds us?"

  *   **Likely Dodge:** She will likely say validity is about 'consistency of attitudes' or 'rational coherence' rather than truth-preservation.
  *   **Follow-up:** "If it's just coherence, then a sociopath who has no concern for consistency isn't making a *logical* error, just a psychological one. How do you recover the *normative force* of logic—the idea that he *ought* not to reason that way—without smuggling in a truth-apt norm?"

  ### 4. Gibbard and Hyperplan Semantics (Mandatory)
  **Question:** "Allan Gibbard tries to solve these embedding problems using 'hyperplans'—functions from worlds to actions. This allows expressivism to use possible-worlds semantics. But if your moral sentences have satisfaction conditions across possible worlds that behave exactly like truth-conditions, haven't you just smuggled cognitivism in through the back door? What's the metaphysical difference left that justifies calling yourself an expressivist?"

  *   **Likely Dodge:** She'll insist hyperplans are still *plans* or *normative commitments*, not descriptions of reality, so they aren't truth-apt.
  *   **Follow-up:** "But if they play the exact same formal role as propositions in your logic, why does the label matter? If it walks like a truth-condition and quacks like a truth-condition, does the 'non-cognitive' label do any work other than historical baggage?"

  ### 5. The "Little Brother" Specific
  **Question:** "You've argued that a conditional like 'If stealing is wrong, then getting your brother to steal is wrong' expresses disapproval of combining 'disapproving of stealing' with 'not disapproving of brother stealing.' But what if I'm a partialist? I disapprove of stealing generally, but I make an exception for my family. On your view, am I logically inconsistent, or just morally partial? Where does the logic end and the substantive ethics begin?"

  *   **Likely Dodge:** She will likely say that logic requires impartiality, so the partialist is indeed being logically inconsistent in the moral domain.
  *   **Follow-up:** "That seems to bake a substantive moral principle (impartiality) into the definition of logical validity. Doesn't that make it impossible to logically argue *for* impartiality, since you have to assume it to make the argument valid?"

  ### 6. Quasi-Realism's "Earned Right"
  **Question:** "As a quasi-realist, you want to earn the right to talk about moral 'truths' and 'facts' without the metaphysical baggage. But once you've earned that right—once you can say 'It is true that stealing is wrong'—what prevents the realist from saying, 'Great, so you agree there are moral truth-conditions'? Where is the bright line where you stop them from co-opting your language?"

  *   **Likely Dodge:** She'll say the *genealogy* or *explanation* of the truth-claim is different (expressive vs. descriptive), even if the surface grammar is the same.
  *   **Follow-up:** "But if the surface grammar and the inferential role are identical, does the hidden genealogy matter for the conversation? If we can't tell the difference in practice, is quasi-realism just realism with an extra step?"

  ### 7. Disagreement vs. Clash
  **Question:** "If I dislike durian fruit and you like it, we have a clash of attitudes, but we aren't contradicting each other. If I disapprove of stealing and you don't, how is that different? If your view reduces moral disagreement to a clash of higher-order attitudes, how do you explain the *intuition* that one of us must be mistaken, rather than just different?"

  *   **Likely Dodge:** She'll argue moral attitudes are *normative* expectations applicable to all, unlike taste.
  *   **Follow-up:** "But that appeal to 'normativity' sounds like you're invoking a property of the action itself, not just the attitude. Aren't you grounding the disagreement in the object again, which pushes you back toward realism?"

  ### 8. Mixed Contexts
  **Question:** "Consider a mixed conditional: 'If stealing is wrong, then the police ought to arrest thieves.' The antecedent is moral, but the consequent is institutional/legal. How does your higher-order attitude account work here? Am I expressing an attitude toward an attitude toward... a legal fact? Does the expressivist story break down when moral attitudes hook into non-moral realities?"

  *   **Likely Dodge:** She might treat the consequent as also expressing a normative plan or commitment regarding the police.
  *   **Follow-up:** "But the police arresting thieves is an empirical event. If your system treats empirical predictions as expressions of attitude to make the logic work, aren't you distorting the semantics of non-moral sentences to save the moral ones?"

  ### 9. The Ontology of Attitudes
  **Question:** "We've talked a lot about what these attitudes *do*, but what *are* they? Are they psychological states I can introspect? If I say 'Stealing is wrong' but feel no emotional tug, have I lied? If expressivism isn't about empirical psychology, are these 'attitudes' just posits with no connection to actual human minds?"

  *   **Likely Dodge:** She will likely say they are 'functional' or 'normative' states, not necessarily emotional bursts.
  *   **Follow-up:** "If they aren't psychological, what makes them 'expressive'? If they are functional roles, doesn't that sound a lot like a functionalist theory of moral properties, which is a form of realism?"

  ### 10. The Theoretical Cost
  **Question:** "Finally, the cost-benefit analysis. You're building a complex architecture of higher-order attitudes, hyperplans, and quasi-realist semantics to avoid positing objective moral properties. But if the resulting system is this intricate, and allows us to talk 'as if' properties exist anyway, what is the gain? Why not just be a lightweight realist and save the philosophical energy?"

  *   **Likely Dodge:** She'll argue naturalism: realism posits 'queer' entities that don't fit in a scientific worldview, whereas attitudes do.
  *   **Follow-up:** "But if your 'attitudes' have to be structured enough to solve Frege-Geach and support logical validity, are they still simple natural kinds? Or have you made the 'natural' side of your naturalism just as metaphysically heavy as the realism you're trying to avoid?"
