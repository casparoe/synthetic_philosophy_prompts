prompt: |-
  okay so I'm elbows deep in a novel where my four leads each get one or two core virtues -- one's brave, one's brutally honest, etc -- that are supposed to hold steady no matter what the plot throws at them. My housemate (a psych postdoc, mildly insufferable about it) informed me that this is exactly the assumption situationism blew up decades ago, and that Doris and Harman didn't even agree on how bad the damage was. I already know the Milgram/Stanford Prison greatest hits so you can skip those -- what I actually want is the more precise version: what's the real difference between Doris's position and Harman's, and did anyone ever mount a comeback for virtue ethics thats better than just insisting characters can be consistent by fiat? Trying to figure out if what I'm doing on the page is psychologically naive or just fine actually.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel with four leads, each assigned core virtues (e.g., brave, brutally honest) that remain steady regardless of plot pressure.
      *   **Conflict:** A housemate (psych postdoc) claimed this approach is psychologically naive, citing "situationism" (specifically Doris and Harman) which challenges the existence of robust character traits.
      *   **Knowledge Level:** The user knows the basics (Milgram, Stanford Prison Experiment) and wants to skip those. They want the *nuanced* philosophical/psychological distinction between Doris and Harman.
      *   **Core Question:** What's the real difference between Doris's and Harman's positions? Is there a viable comeback for virtue ethics (beyond "fiction allows it")? Is the user's writing approach naive or acceptable?
      *   **Tone:** Intellectual, slightly witty (acknowledging the "insufferable" housemate), practical for a writer.

  2.  **Deconstruct the Philosophical/Psychological Debate (Situationism vs. Virtue Ethics):**
      *   *Situationism:* The empirical claim that human behavior is driven more by situational factors than stable character traits.
      *   *Gilbert Harman:* The hardliner. He argues that *global character traits* (like "honesty" or "courage" as cross-situational dispositions) basically *do not exist*. He suggests virtue ethics is empirically false.
      *   *John Doris:* The moderate/skeptic. He argues against *global* traits but allows for *local* traits. He doesn't say traits don't exist; he says they are highly context-specific (e.g., "honest-when-with-friends-but-not-when-taxes-are-due"). He attacks the *consistency* required by traditional virtue ethics, not necessarily the concept of disposition itself.
      *   *The Difference:* Harman = Traits are a fiction. Doris = Traits are real but fragmented/local, not global/robust.

  3.  **Identify Counter-Arguments/Comebacks for Virtue Ethics:**
      *   *The "Density" Argument:* Traits exist but are rare. Most people aren't virtuous, but some are (the "saints" and "heroes").
      *   *The "Developmental" Argument:* Virtue is an aspiration/end-state, not a starting description. (Aristotle's *phronesis*).
      *   *The "Interactionist" Model:* Behavior = Person x Situation. It's not just situation.
      *   *Narrative Identity:* Humans make sense of themselves through stories, which imposes consistency even if psychology is messy. (Crucial for a novelist).

  4.  **Evaluate the User's Writing Approach:**
      *   *Is it naive?* Psychologically, strict global consistency is rare. Real people are contradictory.
      *   *Is it "fine actually"?* Yes, for fiction. Fiction isn't a psych case study. It requires coherence for thematic resonance.
      *   *How to bridge the gap?* Make the virtues *costly*. Show the friction between the virtue and the situation. Don't make it automatic; make it a struggle. This acknowledges situationism while preserving the character arc.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the housemate's point (they aren't wrong, but they aren't the whole story). Validate the user's concern.
      *   *Section 1: Doris vs. Harman (The Nuance).*
          *   Harman: Eliminitivist. Traits are like astrology. Virtue ethics is dead.
          *   Doris: Revisionist. Traits exist but are "local." Honesty isn't a thing; "honesty-in-the-classroom" is.
          *   *Key Distinction:* Harman says the bucket is empty. Doris says the bucket has holes and only holds water in specific temperatures.
      *   *Section 2: The Comebacks (Defending Virtue).*
          *   Snow & Miller: The "Rare Traits" defense. Virtue ethics describes the *ideal*, not the average.
          *   Kamtekar: Situationism relies on bad readings of the experiments (people *did* resist in Milgram, just not enough).
          *   Interactionism: It's not Nature *or* Nurture, it's Nature *via* Nurture.
      *   *Section 3: Application to Fiction (The "So What?").*
          *   Fiction requires *intelligibility*. Real life is messy; art is curated.
          *   The danger isn't consistency; it's *flatness*.
          *   *Advice:* Don't write "The Brave One." Write "The One Who Acts Brave Despite Wanting to Flee."
          *   Use the "Local Trait" idea. Maybe they are brave in physical danger but cowardly in emotional confrontation.
      *   *Conclusion:* Reassure the user. Their housemate is playing a different game (empirical description vs. normative prescription).

  6.  **Refining the Tone:**
      *   Avoid overly dense jargon.
      *   Keep it engaging.
      *   Make sure the distinction between Doris and Harman is sharp (that was a specific request).
      *   Ensure the writing advice is actionable.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I skip Milgram?* Yes, mention it only in passing as context for the experiments, don't explain the setup.
      *   *Did I answer the "naive or fine" question?* Need to be clear: Psychologically reductive, but artistically valid.
      *   *Is the Doris/Harman split accurate?* Harman is more metaphysical/eliminitivist. Doris is more empirical/fragmentationist. Yes.

  8.  **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  Your housemate is technically correct, but they are also playing a different game than you are. The situationist critique is devastating if you are writing a psychology textbook or claiming your novel is a realistic simulation of human cognition. It is much less damaging if you are writing a novel, which is a moral and aesthetic technology designed to impose coherence on chaos.

  However, since you asked for the precise philosophical meat rather than the "art vs. science" dismissal, let's break down the Doris/Harman split, the counter-attacks, and how you can use this to make your characters better rather than abandoning your premise.

  ### 1. The Split: Harman vs. Doris
  Both agree that traditional "global character traits" (e.g., "Honesty" as a cross-situational constant) are not supported by empirical data. But they disagree on the fallout.

  **Gilbert Harman (The Eliminitivist)**
  Harman takes the hard line. He argues that the empirical evidence suggests global character traits **do not exist**.
  *   **The Claim:** When we attribute behavior to "character," we are committing a fundamental attribution error. We are seeing patterns that aren't there.
  *   **The Implication:** Virtue ethics is empirically false. It is based on a folk-psychological myth. You cannot build a moral theory (or a character) on something that isn't real.
  *   **The Vibe:** "There is no such thing as courage. There is only a specific person in a specific context acting in a way we label 'courageous'."

  **John Doris (The Revisionist)**
  Doris is more nuanced. He argues that global traits don't exist, but **local traits** do.
  *   **The Claim:** People do have dispositions, but they are highly fragmented and context-dependent. A person might possess "honesty-in-the-classroom" but lack "honesty-on-the-tax-return."
  *   **The Implication:** Virtue ethics isn't dead, but it needs to be downsized. We shouldn't expect cross-situational consistency. We should expect consistency only within specific "activation contexts."
  *   **The Vibe:** "Courage exists, but it's not a solid block of steel. It's a collection of small, situational habits that might not transfer from the battlefield to the boardroom."

  **The Difference:** Harman says the bucket is empty. Doris says the bucket has holes and only holds water at specific temperatures. Harman attacks the *ontology* of traits; Doris attacks the *structure* of traits.

  ### 2. The Comeback: Defending Virtue Ethics
  Philosophers didn't just take this lying down. Several robust counter-arguments have emerged that go beyond "insisting by fiat."

  **A. The "Rare Traits" Defense (Snow & Miller)**
  This is the strongest defense for a novelist. Situationism relies on aggregate data (averages). It proves that *most* people don't have robust virtues. It does not prove that *no one* does.
  *   **The Argument:** Virtue ethics describes an ideal or an achievement, not a baseline. The fact that most people failed the Milgram experiment doesn't prove courage is impossible; it proves courage is rare.
  *   **For Your Novel:** Your four leads can be the statistical outliers. If you write them as average people who magically never flinch, you're ignoring the data. If you write them as exceptional people who have *cultivated* these traits against the grain of human nature, you are aligning with Aristotle.

  **B. The "Interactionist" Model**
  Situationism often sets up a false dichotomy: Person vs. Situation. Modern psychology generally accepts an interactionist model: $Behavior = f(Person, Situation)$.
  *   **The Argument:** Situations trigger dispositions. A virtue isn't a robot program that runs regardless of input; it's a sensitivity to specific reasons. A brave person isn't someone who feels no fear; it's someone whose assessment of "what matters" overrides the fear in specific contexts.
  *   **For Your Novel:** Don't write the virtue as a blind spot. Write it as a hierarchy of values. The "Brave" character isn't immune to danger; they value the objective more than their safety.

  **C. Narrative Identity (The "Story" Defense)**
  This is your ace in the hole. Psychologists like Dan McAdams argue that while *traits* might be fragmented, humans construct **narrative identities** to create coherence.
  *   **The Argument:** We make sense of our lives by editing them into stories. We suppress contradictions to maintain a sense of self.
  *   **For Your Novel:** Fiction is not a recording of behavior; it is a simulation of *meaning*. A novel requires characters to be more consistent than real people because the reader needs to track moral agency. If a character changes virtues every chapter based on the weather, the reader cannot engage with the theme.

  ### 3. Verdict: Is Your Approach Naive?
  **Psychologically:** Yes, if you treat the virtues as automatic reflexes. If your "Brave" character never feels fear, or your "Honest" character never calculates the cost of a lie, you are writing caricatures, not humans. Situationism wins there.

  **Artistically:** No, provided you handle the *friction*.

  Here is how you keep your core virtues without falling into the situationist trap:

  1.  **Make the Virtue Costly:** Doris's "local traits" argument suggests virtues break under pressure. Prove your character's virtue by showing the pressure trying to break it. The "Brave" character should want to run. The "Honest" character should see the easy lie. The virtue is the act of overriding the situational pull.
  2.  **Localize the Weakness:** Use Doris's insight. Give your "Brave" character physical courage but emotional cowardice. Give your "Honest" character brutal honesty with others but self-deception about themselves. This makes them psychologically realistic (fragmented) while maintaining their core thematic function (virtuous).
  3.  **Treat Virtue as a Verb, Not a Noun:** Don't write "He was brave." Write "He acted bravely." Virtue ethics is often about *phronesis* (practical wisdom). Show the calculation. If they act virtuously without thinking, it's instinct. If they act virtuously *despite* thinking, it's character.

  ### Summary
  Your housemate is right that global traits are empirically shaky for the average human. But you are writing about **leads**. Leads are supposed to be the exceptions that illuminate the rule.

  Don't abandon the virtues. Just acknowledge the situationist critique by making the environment hostile to those virtues. If the world is designed to make honesty fail, and your character is honest anyway, you haven't been psychologically naive—you've written a hero.

  **The Fix:** Keep the virtues, but add the "activation energy." Show the cost. That bridges the gap between the postdoc's data and your drama.
