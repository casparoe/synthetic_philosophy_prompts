answer: |-
  You are not imagining the inconsistency. The nurse you interviewed has identified a profound ethical and logical contradiction that sits at the heart of the pandemic labor experience. In moral philosophy, this is often discussed as the tension between **obligation** and **supererogation**.

  To answer your specific question: Yes, there is a genuine inconsistency in that combination, and the reasoning breaks down precisely where the hospital attempted to have it both ways to maximize labor compliance while minimizing liability and cost.

  Here is a breakdown of where the logic holds, where it fractures, and how you might frame this in your piece not just as cynicism, but as a specific kind of ethical coercion.

  ### 1. The Philosophical Conflict: Duty vs. Heroism
  In ethics, an **obligatory** act is something you are required to do; failing to do it warrants blame or punishment. A **supererogatory** act is something that is good to do but not required; doing it warrants praise, but omitting it does not warrant blame.

  *   **The Hospital's Frame:** By using language like "heroism," "sacrifice," and "above and beyond," administration categorized attendance as *supererogatory*. They were claiming the moral prestige of their staff performing extraordinary acts.
  *   **The Hospital's Enforcement:** By threatening termination for absence or refusal, administration categorized attendance as *obligatory*. They were enforcing the baseline requirements of an employment contract.

  **The Breakdown:** You cannot logically claim an act is supererogatory (beyond duty) and obligatory (within duty) simultaneously for the same agent in the same context. If showing up is "heroic," it implies the staff member has the moral right to stay home without being blameworthy. If staying home is punishable by termination, showing up is merely "compliance," and calling it heroism is rhetorical inflation.

  ### 2. The Counter-Argument: Professional Duty
  To be fair to the administration's potential reasoning (or at least, their best possible defense), there is a legitimate distinction regarding professional roles.

  Healthcare ethics (such as the American Nurses Association Code of Ethics) acknowledge a **duty to treat**. Unlike a bystander, a nurse has a fiduciary obligation to patients. In a disaster scenario, this duty is often understood to expand, accepting a higher threshold of personal risk than in normal times.

  If the hospital had stopped there, the logic might hold: *"You have a professional duty to work during a surge, even at elevated risk. However, because this risk exceeds normal employment expectations, we honor you as heroes."*

  **Where this breaks down:** The professional duty to treat is **not absolute**. It is predicated on **reciprocity**. Ethical frameworks generally state that while clinicians have a duty to provide care, employers have a reciprocal duty to mitigate risk as much as possible (e.g., providing adequate PPE, training, and support).

  When the nurse mentions colleagues punished for refusing to work *without adequate protective equipment*, the reciprocity is broken. Once the employer fails to uphold their end of the safety bargain, the employee's obligation reverts from "heightened professional duty" back to "standard self-preservation." At that point, punishing the refusal transforms the "duty to treat" into "coerced endangerment."

  ### 3. The Function of "Hero" Rhetoric
  This is likely the most valuable angle for your piece. The inconsistency wasn't necessarily a logical error; it was a functional tool. Sociologists and ethicists have noted that "hero" rhetoric during the pandemic often functioned as a **mechanism of silencing.**

  *   **Moral Coercion:** If you frame labor as "sacrifice," complaining about working conditions becomes ungrateful. A "hero" doesn't complain about N95s; a "hero" just saves lives.
  *   **Economic Substitution:** "Hero" status is a form of moral payment that substitutes for material payment. By framing the work as a noble calling, administrators could deflect demands for hazard pay, overtime compensation, or safer staffing ratios.
  *   **Liability Management:** If the work is "heroic sacrifice," it implies voluntary assumption of risk. This helps insulate the institution from liability if a worker gets sick. If the work is "mandatory employment under unsafe conditions," the institution is liable.

  The inconsistency you sensed is the friction between **extraction** (we need you to work at all costs) and **exoneration** (we want credit for your bravery, not blame for your coercion).

  ### 4. The Concept of "Moral Injury"
  For your narrative, you might consider the concept of **moral injury**. Originally used to describe soldiers, it applies acutely here. Moral injury occurs when someone is prevented from acting according to their own moral compass, or when they are betrayed by a legitimate authority.

  The nurse you interviewed is describing a specific type of institutional moral injury. She was willing to do the work (the duty), but the institution corrupted the meaning of that work.
  *   They took her **compliance** and called it **virtue**.
  *   They took her **fear** and called it **dereliction**.

  This creates a psychological double-bind: *If I am a hero, why am I being policed? If I am an employee, why am I being asked to die?*

  ### 5. Summary for Your Piece
  The reasoning breaks down at the point of **volition** and **reciprocity**.

  1.  **Volition:** Heroism requires the possibility of refusal. By removing the possibility of refusal (via threat of termination), the administration stripped the act of its heroic quality, rendering the praise hollow.
  2.  **Reciprocity:** Professional duty relies on a safe(ish) environment. By punishing refusals to work in unsafe conditions, the administration violated the reciprocal contract, rendering the punishment unjust.

  **How to frame it:**
  You don't have to conclude it was merely "cynical" (though it was). You can frame it as a **category collapse.** The hospital attempted to collapse the distinction between *citizen*, *employee*, and *savior* to suit their operational needs.
  *   When they needed bodies, nurses were *employees* (must show up).
  *   When they needed PR, nurses were *saviors* (heroes).
  *   When nurses needed protection, they were treated as *disposable employees*.

  The nurse's lingering discomfort comes from the fact that she was asked to inhabit all three categories simultaneously, which is an impossible ethical position. The "mismatch" she feels is the sound of her own moral intuition recognizing that she was being ethically gaslit: praised for a choice she wasn't allowed to make.

  This distinction adds depth to your story because it moves beyond "working hard is bad" to "the language used to describe our labor was weaponized against us." It explains why the praise hurts more than the silence would have.
