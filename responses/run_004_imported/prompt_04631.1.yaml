prompt: |-
  I am preparing a graduate seminar on reduction and emergence in the philosophy of science, and this term I want to work backward from the contemporary debate—supervenience, multiple realizability, Kim-style exclusion arguments—to its principal nineteenth-century source: John Stuart Mill's discussion of the "Composition of Causes" in Book III, Chapter VI of *A System of Logic*. I have taught this chapter before, but building a whole session around it has left me less sure than I would like to be about exactly what kind of claim Mill is making at the crucial juncture, and I would rather work this out now than hand my students a tidier story than the text actually supports. Here is the passage, from the third edition of 1851:

  "This principle, however, by no means prevails in all departments of the field of nature. The chemical combination of two substances produces, as is well known, a third substance with properties entirely different from those of either of the two substances separately, or both of them taken together. Not a trace of the properties of hydrogen or of oxygen is observable in those of their compound, water. The taste of sugar of lead is not the sum of the tastes of its component elements, acetic acid and lead or its oxide; nor is the colour of green vitriol a mixture of the colours of sulphuric acid and copper. This explains why mechanics is a deductive or demonstrative science, and chemistry not. In the one, we can compute the effects of all combinations of causes, whether real or hypothetical, from the laws which we know to govern those causes when acting separately; because they continue to observe the same laws when in combination which they observed when separate: whatever would have happened in consequence of each cause taken by itself, happens when they are together, and we have only to cast up the results. Not so in the phenomena which are the peculiar subject of the science of chemistry. There, most of the uniformities to which the causes conformed when separate, cease altogether when they are conjoined; and we are not, at least in the present state of our knowledge, able to foresee what result will follow from any new combination, until we have tried the specific experiment. If this be true of chemical combinations, it is still more true of those far more complex combinations of elements which constitute organised bodies; and in which those extraordinary new uniformities arise, which are called the laws of life. All organised bodies are composed of parts similar to those composing inorganic nature, and which have even themselves existed in an inorganic state; but the phenomena of life, which result from the juxtaposition of those parts in a certain manner, bear no analogy to any of the effects which would be produced by the action of the component substances considered as mere physical agents. To whatever degree we might imagine our knowledge of the properties of the several ingredients of a living body to be extended and perfected, it is certain that no mere summing up of the separate actions of those elements will ever amount to the action of the living body itself. The tongue, for instance, is, like all other parts of the animal frame, composed of gelatine, fibrin, and other products of the chemistry of digestion, but from no knowledge of the properties of those substances could we ever predict that it could taste, unless gelatine or fibrin could themselves taste; for no elementary fact can be in the conclusion, which was not first in the premisses."

  What I cannot settle is whether Mill is making an epistemic claim or a metaphysical one. Several phrases point toward the modest, epistemic reading: he says we cannot foresee the chemical result "at least in the present state of our knowledge," and "until we have tried the specific experiment," both of which suggest a gap that better science might eventually close, so that chemistry could in principle mature into a deductive science on the mechanical model. But the closing sentence about the tongue reads quite differently: the claim that "no elementary fact can be in the conclusion, which was not first in the premisses" sounds like a point about the logical structure of deduction as such, one that would hold no matter how much we came to know about gelatine and fibrin, and so would make the gap permanent rather than provisional. Can these two strands be reconciled, or does Mill simply fail to distinguish them? And on whichever reading you think the text actually supports, does Mill thereby count as an emergentist in the strong, metaphysical sense that later writers like Broad had in mind with their talk of trans-ordinal laws, or is he really committed to nothing more than a thesis about the present reach of deduction?
