      *   *The Tension:* Mill is an empiricist. He hates *a priori* metaphysics. So, a strong metaphysical claim about irreducibility seems out of character. *However*, he is also a logician. The "premisses/conclusion" remark is about the limits of *deduction*.
      *   *Broad's Emergence:* Broad argues for "trans-ordinal laws" that are brute facts. You can't deduce the whole from the parts even in principle.
      *   *Mill's Stance:* Mill seems to say we can't deduce it *now*. But does he think we *could* in principle? The "premisses/conclusion" line suggests a logical impossibility if the properties are truly novel. But if the properties of the compound *are* determined by the parts, just in a complex way, maybe deduction is possible with better laws?
