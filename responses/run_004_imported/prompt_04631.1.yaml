      *   *Mill as Emergentist:* Yes, but "British Emergentist" (McLaughlin's category). He believes in special laws for higher levels. But he is not a vitalist. He thinks biology will be reduced to chemistry/physics eventually? Wait, check text. "If this be true of chemical combinations, it is still more true of... organised bodies." Mill seems to think biology is *even less* reducible.
