      *   *Correction on "Epistemic":* When Mill says "present state of knowledge," he might mean we don't know the chemical laws yet. But when he says "no mere summing up... will ever amount to," he implies a structural limit on *mechanical* deduction.
      *   *The Synthesis:* The limitation is epistemic *relative to the lower-level theory*, but metaphysical *relative to the causal structure of the world*. The world actually contains heteropathic laws. Therefore, we cannot deduce them from homopathic laws.
