      *   **The "Premisses/Conclusion" line:** This refers to the *content* of the deduction. Even if we knew the chemical laws, we couldn't deduce the result from *mechanical* laws alone. The chemical law is a new ultimate law.
      *   **Mill vs. Broad:** Broad says emergence is metaphysical/brute. Mill says it's about the *limits of deductive subsumption* under *lower-level* laws. Mill thinks the chemical laws are still causal and uniform, just not reducible to mechanical laws. So, Mill is an emergentist, but perhaps not as "strong" as Broad regarding the *intelligibility* of nature. Mill thinks we can find the chemical laws (empirically), just not derive them from physics.
