      *   *Comparison:* Mathematical objections (Gödel) are about *capacity*. Consciousness objections are about *ontology*. ESP is about *methodology*. If ESP exists, the "blind" aspect of the test fails. It turns the test into a measurement of psychic power, not intelligence.
