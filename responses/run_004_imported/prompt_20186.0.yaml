      *   *Wait, check:* If the sum of absolute values diverges, it's conditional convergence. Yes.
      *   *Decision Theory:* The core issue is that Expected Utility Theory assumes the expectation is an integral over a probability space. For discrete cases, it's a sum. If the sum isn't absolutely convergent, the integral isn't well-defined in the Lebesgue sense (which EUT usually relies on).

