prompt: |-
  I'm one of the outside directors on the board of a small nonprofit forecasting institute -- the sort that runs calibration training and a public forecasting tournament -- and was invited partly because I've spent years writing about this world. The institute recently began trading its aggregated forecasts for real money on a regulated prediction-market exchange, both to fund its research and to demonstrate its edge publicly, and the board now has to settle a house staking policy. The fund's quantitative lead wants every position sized by full Kelly criterion against the institute's own probability estimates, arguing that anything more conservative leaves growth on the table, and citing the ergodicity-economics claim that ordinary expected-value reasoning applies the wrong average to an entity compounding over time. Several directors are uneasy: the fund is expected to cover part of the institute's payroll every quarter, its probabilities are calibrated but still just estimates rather than known odds, and a bad enough drawdown could sink the institute rather than merely sting it. Please draft the memo I'll bring to the board: it should recommend a specific staking rule -- not just "somewhere more conservative than full Kelly" -- with a stated review point, and it should credit what the growth-optimality argument gets right before explaining why, or whether, it needs to be constrained.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Outside Director on the board of a small nonprofit forecasting institute.
      *   **Context:** The institute runs calibration training/tournaments and now trades aggregated forecasts on a regulated exchange to fund research and prove edge.
      *   **Conflict:** Quant Lead wants *Full Kelly* staking (maximizes long-term growth, cites ergodicity economics). Other directors are worried about drawdown risk (payroll depends on it, probabilities are estimates, ruin is existential).
      *   **Task:** Draft a board memo recommending a *specific* staking rule (not vague), including a review point.
      *   **Tone:** Professional, balanced, authoritative but collaborative, acknowledging the math while prioritizing fiduciary duty.
      *   **Key Requirements:** Credit the growth-optimality argument, explain constraints, recommend a specific fraction (e.g., Half-Kelly, Quarter-Kelly), set a review trigger.

  2.  **Deconstruct the Arguments:**
      *   **Quant Lead (Full Kelly):**
          *   *Pros:* Maximizes geometric growth rate ($G$). In the long run, nothing beats it. Ergodicity economics argument is theoretically sound for infinite horizons and known probabilities.
          *   *Cons:* Extreme volatility. 50% drawdowns are common. Assumes probabilities are *known* (they aren't, they're estimated). "Ruin" is unacceptable for a nonprofit with payroll obligations.
      *   **Board Concerns (Risk Management):**
          *   *Pros:* Survival is priority #1. Payroll needs liquidity. Model risk (calibration isn't perfection).
          *   *Cons:* Too conservative kills the mission (funding research).
      *   **The Middle Ground (Fractional Kelly):**
          *   Standard industry practice for money managers with model risk.
          *   Reduces volatility disproportionately more than it reduces return.
          *   Provides a buffer against overconfidence.

  3.  **Determine the Recommendation:**
      *   *Full Kelly:* Too risky for a nonprofit with payroll obligations.
      *   *Fixed Fractional (e.g., 1% of equity):* Ignores the edge, too arbitrary.
      *   *Fractional Kelly:* The sweet spot.
      *   *Which Fraction?* Half-Kelly is standard for "aggressive but safe." Quarter-Kelly is safer. Given the "small nonprofit" and "payroll" constraint, **Half-Kelly** is usually the academic/practitioner compromise, but **Quarter-Kelly** might be more prudent for a entity that *cannot* afford a 50% drawdown. However, Half-Kelly captures 75% of the growth rate with 50% of the volatility. Let's aim for **Half-Kelly** as the baseline, perhaps with a cap on single-position risk. Actually, given the "existential risk" mention, **Quarter-Kelly** is often safer for model uncertainty. But Half-Kelly is the standard "sensible" recommendation in this specific debate. Let's go with **Half-Kelly** but with a *maximum position size cap* to prevent concentration risk.
      *   *Wait, refinement:* The prompt asks for a "specific staking rule." Half-Kelly is specific.
      *   *Review Point:* Needs to be triggered by performance or time. A drawdown threshold is crucial.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Board Memo format.
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **Context:** Acknowledge the new trading activity and the stakes (payroll + mission).
      *   **The Quant Lead's Case (Ergodicity & Kelly):** Validate the math. Full Kelly *does* maximize geometric growth. Acknowledge the ergodicity point (time average vs. ensemble average). This builds trust with the Quant Lead.
      *   **The Fiduciary Constraint (Why not Full Kelly):**
          *   *Model Risk:* Probabilities are estimates, not truths. Overconfidence kills Kelly bettors.
          *   *Liquidity/Payroll:* Nonprofits can't mark-to-model and wait 10 years. They need cash flow *now*.
          *   *Drawdown Tolerance:* Full Kelly implies a 50% chance of a 50% drawdown. Can the institute survive that? Probably not.
      *   **The Recommendation:** **Half-Kelly Criterion.**
          *   Explain the math benefit (75% of return, 50% of variance).
          *   Add a safety rail (e.g., max 5% of NAV in any single market).
      *   **Review Mechanism:** Quarterly review + Hard stop-loss trigger (e.g., if drawdown > 20%, reduce to Quarter-Kelly).
      *   **Conclusion:** Reiterate mission alignment.

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, but use enough to show competence (ergodicity, geometric growth, model risk).
      *   Be respectful of the Quant Lead's expertise but firm on governance.
      *   Emphasize that the institute is *not* a hedge fund; it's a nonprofit with a trading arm.

  6.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is Half-Kelly too aggressive?
      *   *Adjustment:* I will frame it as "Half-Kelly *subject to* a maximum position limit." This addresses the "small nonprofit" risk.
      *   *Critique:* The ergodicity argument needs to be handled carefully. It's valid for infinite time, but we have finite liquidity constraints.
      *   *Adjustment:* Explicitly mention the "finite horizon" and "liquidity constraint" as the counter to the ergodicity argument.
      *   *Specifics:* Make sure the review point is concrete. "Quarterly" is good, but a "Drawdown Trigger" is better for risk management.

  7.  **Final Review against Prompt:**
      *   Specific staking rule? Yes (Half-Kelly).
      *   Stated review point? Yes (Quarterly + 20% Drawdown trigger).
      *   Credit growth-optimality? Yes.
      *   Explain constraints? Yes (Model risk, liquidity, fiduciary).
      *   Tone? Board-appropriate.

  8.  **Final Polish:** Check for clarity and impact. (The resulting memo follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Institute Name]
  **FROM:** [Your Name], Outside Director
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Capital Staking Policy for Forecasting Fund

  ### Executive Summary

  As the Institute transitions from research to live capital deployment, we must adopt a staking policy that balances growth potential with fiduciary responsibility. While the Full Kelly Criterion maximizes long-term geometric growth, it exposes the Institute to volatility incompatible with our operational obligations (specifically quarterly payroll) and our model uncertainty.

  I recommend the Board adopt a **Half-Kelly Criterion**, subject to a maximum single-position cap of 5% of Net Asset Value (NAV). This policy should be reviewed quarterly, with an automatic reduction to Quarter-Kelly triggered if the fund experiences a peak-to-trough drawdown exceeding 20%.

  ### Context

  The launch of our trading arm serves two missions: generating unrestricted revenue to fund research and publicly validating our forecasting edge. Our Quantitative Lead has proposed sizing positions using the Full Kelly Criterion, arguing that any fractional approach sub-optimizes growth over time. Several Directors have expressed concern regarding drawdown risk, noting that our probabilities are estimates rather than known odds, and that significant losses could threaten the Institute's solvency.

  ### The Case for Growth Optimality

  We must acknowledge the theoretical strength of the Quant Lead's position. The Kelly Criterion is mathematically proven to maximize the expected logarithmic utility of wealth, which corresponds to the maximum geometric growth rate of capital over an infinite horizon.

  The argument from ergodicity economics is particularly relevant here: for an entity compounding capital over time, the "time average" growth matters more than the "ensemble average" (expected value) of a single bet. Full Kelly avoids the risk of ruin *in the limit* provided probabilities are known exactly. To ignore this is to leave long-term capacity on the table, potentially starving our research mission of future funding.

  ### The Fiduciary Constraint

  However, the Institute is not a hedge fund with infinite liquidity and no operational overhead. We face three constraints that make Full Kelly imprudent:

  1.  **Model Risk (The "Known Odds" Fallacy):** Kelly optimization is highly sensitive to input accuracy. If we overestimate our edge by even a small margin, Full Kelly rapidly becomes over-betting, turning positive expectancy into negative geometric growth. Our probabilities are calibrated, but they remain estimates subject to structural uncertainty. Full Kelly assumes we know the true probability distribution; we do not.
  2.  **Liquidity & Payroll Obligations:** Full Kelly strategies inherently accept a 50% probability of a 50% drawdown at some point in the trading history. For a private fund, this is volatility. For a nonprofit covering payroll, this is existential risk. We cannot mark our operational solvency to model volatility.
  3.  **Finite Horizon:** The ergodicity argument holds for an infinite time horizon. We operate in finite quarters. A severe drawdown in Year 1 could force liquidation before the "long run" arrives, rendering the theoretical growth optimality moot.

  ### Recommendation: Half-Kelly with Position Caps

  To reconcile growth with survival, I propose we adopt a **Fractional Kelly** approach. Specifically:

  *   **Staking Rule:** Size all positions at **50% of the Full Kelly recommendation**.
  *   **Concentration Limit:** No single position may exceed **5% of total Fund NAV**, regardless of the Kelly calculation.

  **Rationale:**
  Mathematically, Half-Kelly captures approximately 75% of the expected growth rate of Full Kelly while reducing volatility by 50%. This provides a substantial "safety buffer" against model error. If our probability estimates are overly optimistic, Half-Kelly prevents us from crossing the threshold into over-betting territory. The 5% concentration cap prevents tail-risk events in any single market from incapacitating the fund.

  ### Review and Trigger Mechanisms

  Risk management must be dynamic. I propose the following governance structure:

  1.  **Quarterly Review:** The Investment Committee will review the Fund's calibration and realized ROI against expected value every quarter.
  2.  **Drawdown Trigger:** If the Fund experiences a **peak-to-trough drawdown of 20%**, the staking policy automatically shifts to **Quarter-Kelly** until the Fund recovers to its previous high-water mark. This ensures that as capital becomes scarcer, we prioritize capital preservation over growth.

  ### Conclusion

  The Quant Lead is correct that growth is essential to our mission, but survival is a prerequisite for growth. By adopting Half-Kelly, we signal to the market that we are confident in our edge, while signaling to our staff and donors that we are prudent stewards of the Institute's future. This policy respects the mathematics of compounding without ignoring the reality of our operational constraints.

  I move that the Board adopt this policy effective [Date].
