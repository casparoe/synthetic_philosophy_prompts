      *   *The Afterlife Argument:* If the world is rational, it wouldn't waste the potential of a developed mind. Therefore, survival.
      *   *The Challenge:* Is this philosophy or pathology? Is it valid inference or wishful thinking?
      *   *The Expert:* Wants to rehabilitate this as *philosophy*, not just biography.
