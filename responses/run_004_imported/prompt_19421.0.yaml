          *   *Philosophical Context:* This is the "argument from disagreement" or "argument from imperfect alignment." It highlights the gap between *fitness* and *welfare*. Fitness often requires harming out-groups; welfare usually doesn't.
          *   *Assessment:* Strong empirical push. It challenges the *reliability* of the mechanism, even if naturalism is true. It suggests the correlation between fitness and welfare is too loose to trust the intuitions.

