          *   *Philosophical Context:* This is the "third-factor" or "tracking" response distinction. Mark is arguing that math beliefs are *sensitive* to truth in a way moral beliefs aren't, because mathematical truths have causal/relevant connections to survival (via physical world), whereas non-natural moral facts do not.
