      *   **Both:** They ignore the possibility of *pluralism* (some moral facts are natural, some are constructed). They also ignore the "third-factor" explanation (e.g., survival is good, so evolution tracking survival accidentally tracks goodness) proposed by realists like Enoch or Wielenberg.

  5.  **Determine the Overall Winner:**

