prompt: |-
  Ok, this is going to sound like a dumb workplace thing but bear with me. My company's in the middle of redoing how we approve big architecture RFCs (I mean the "we're switching our primary datastore" or "we're adopting a service mesh" type decisions, not just any old PR). Right now it needs unanimous sign-off from our 3 principal engineers, and everyone agrees that's too slow and too concentrated in three people's judgment. So one of our staff engineers, Priya, wrote a doc proposing we scrap that and instead let any senior-or-above engineer opt into a vote on each RFC -- simple majority, quorum of at least 11 -- her pitch basically being "more independent reviewers means better odds of catching the right call, it's the wisdom of crowds." She even cited Condorcet's jury theorem by name in the doc (I had to go look it up -- something about how if each voter is even a little better than a coinflip and they all decide independently, a big enough group nails the right answer with near certainty). The principals pushed back with two things: (a) plenty of the eligible 11+ wouldn't have any business judging a given RFC, like a frontend engineer weighing in on a storage engine redesign, so "better than a coinflip" is generous for a chunk of that pool, and (b) nobody actually votes independently in practice anyway, people skim the thread and pile onto whichever confident-sounding comment got posted first, so we wouldn't even get the independence the theorem is leaning on.

  Anyway, I'm one of about 6 people on the working group leadership set up to make an actual recommendation here, and I'd rather show up to that meeting with something more rigorous than just my gut feeling. Can you write the memo I'd circulate before next Tuesday's working group meeting? I want it to land on an actual recommendation -- keep the 3-principal model, go with Priya's big-committee version, or something else entirely -- with a real rollout timeline, and I want it to seriously engage with whatever objection ends up on the loosing side instead of just hand-waving past it. Extra credit if there's some structural fix (how votes get collected, who's even eligible per RFC, whatever) that a person who actually understood the math here would land on, instead of a mushy compromise designed just to keep both camps happy.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Company re-evaluating architecture RFC approval process.
      *   **Current State:** Unanimous sign-off from 3 Principal Engineers (PEs). Too slow, bottlenecked.
      *   **Proposal (Priya):** Open voting for Senior+ engineers. Simple majority, quorum of 11. Based on Condorcet's Jury Theorem (wisdom of crowds).
      *   **Objections (Principals):**
          1.  *Competence:* Not all Senior+ engineers are competent to judge every RFC (e.g., Frontend vs. Storage). $P < 0.5$ for some violates the theorem.
          2.  *Independence:* Social proof/herding bias violates the independence assumption of the theorem.
      *   **Goal:** A memo for the Working Group (6 people) to recommend a path forward.
      *   **Requirements:**
          *   Clear recommendation (Keep, Change, or Hybrid).
          *   Rollout timeline.
          *   Seriously engage with the losing side's objections (no hand-waving).
          *   "Extra Credit": Structural fix based on the math (not just mushy compromise).

  2.  **Evaluate the Math & Theory:**
      *   **Condorcet's Jury Theorem (CJT):** States that if each voter has probability $p > 0.5$ of being correct and votes independently, the probability of the majority being correct approaches 1 as $n \to \infty$.
      *   **Principal Objection 1 (Competence):** If $p < 0.5$ for a significant portion of voters, the theorem reverses. Adding more incompetent voters makes the decision *worse*. This is a valid critique. An open pool guarantees some $p < 0.5$ participants.
      *   **Principal Objection 2 (Independence):** CJT requires independence. If voters correlate (herding), the effective $n$ shrinks. If they follow a loud expert who is wrong, the group fails. This is also valid.
      *   **Current State (3 PEs):** High $p$ (presumably), but $n=3$ is too small for CJT to help much, and unanimity creates a veto bottleneck (single point of failure).
      *   **Priya's Proposal:** High $n$, but risks low $p$ and low independence.

  3.  **Develop a "Structural Fix" (The "Extra Credit"):**
      *   We need to maximize $n$ (to reduce variance) while maintaining $p > 0.5$ (competence) and maximizing independence.
      *   *Solution:* **Stratified Sampling / Weighted Voting based on Expertise + Blind/Independent Initial Review.**
      *   *Idea 1: Expertise Tagging.* Don't let *any* Senior+ vote. Let Senior+ vote *only if* they have relevant tags (e.g., "Database", "Infra"). This addresses Competence.
      *   *Idea 2: Delphi Method / Sequential Unmasking.* To address Independence, don't have a public thread where the first comment sets the tone. Use a tool where initial votes/comments are hidden until submitted. Or, require a written summary *before* seeing others' votes.
      *   *Idea 3: The "Jury" Model.* Instead of an open election, select a random subset of qualified engineers for each RFC. This prevents campaigning and reduces load.
      *   *Selected Approach:* **A "Qualified Pool" with "Blind Initial Assessment."**
          *   Define eligibility per RFC domain (addresses Competence).
          *   Implement a two-phase review: Phase 1 is private/independent written assessment (addresses Independence). Phase 2 is discussion/consensus.
          *   Decision rule: Not simple majority, but "No Veto without Alternative" or Supermajority of *Qualified* voters. Actually, let's stick closer to the math. If we ensure $p > 0.5$ via qualification, a majority works. But to respect the PEs' risk aversion, a supermajority of *qualified* voters is safer.
          *   *Refinement:* Let's propose a **"Domain-Rostered Jury"** system.
              *   Maintain a roster of eligible voters per domain (Storage, Frontend, etc.).
              *   For each RFC, randomly select 7-9 from that roster (Quorum).
              *   Blind initial vote (addresses independence).
              *   This satisfies CJT conditions better than Priya's open pool and scales better than the 3-PE veto.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation upfront.
      *   **Context & Problem:** Briefly state the bottleneck vs. risk trade-off.
      *   **Analysis of Proposals:**
          *   Status Quo (3 PE Unanimity): High competence, low $n$, veto risk.
          *   Priya's Open Vote: High $n$, risk of low competence ($p < 0.5$) and herding.
      *   **The Math (Condorcet):** Explain why the Principals are right about the assumptions, but why we still need more than 3 voters.
      *   **Recommendation:** The "Domain-Rostered Jury" model.
      *   **Mitigating Objections:**
          *   To Priya: Why open pool is dangerous (mathematically).
          *   To Principals: How we ensure competence and independence.
      *   **Rollout Plan:** Phased approach.
      *   **Next Steps.**

  5.  **Refining the Tone:**
      *   Needs to be professional, data-driven, but empathetic.
      *   Avoid "dumb workplace thing" vibe; treat it as a systems design problem.
      *   Acknowledge Priya's research (it was good, just incomplete application).
      *   Acknowledge Principals' risk (valid).

  6.  **Writing - Section by Section (Mental or Scratchpad):**
      *   *Subject:* RFC Process Reform Recommendation.
      *   *Rec:* Hybrid model. "Qualified Jury."
      *   *Math bit:* Keep it accessible. $P > 0.5$ is the key. If Frontend votes on Storage, $P$ might be 0.4. That drags the average down.
      *   *Independence bit:* Mention "Information Cascades."
      *   *The Fix:* Pre-qualified voter lists per domain. Blind submission window (24hrs) before discussion.
      *   *Timeline:* Pilot next month, full rollout Q3.

  7.  **Review against Constraints:**
      *   *Recommendation?* Yes (Qualified Jury).
      *   *Timeline?* Yes.
      *   *Engage objections?* Yes, explicitly in the analysis section.
      *   *Structural fix?* Yes (Domain rosters + Blind window).
      *   *Not mushy?* It rejects the "Open Vote" but accepts the "More Voters" premise. It rejects "3 PE Veto" but keeps "PE Guidance."

  8.  **Final Polish:** Check for clarity, tone, and ensuring the "Condorcet" reference is used correctly to bolster the argument. (Self-Correction: Make sure not to sound condescending to Priya. She was right about the theorem, just the application parameters were off.)

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **TO:** Architecture Governance Working Group
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation: RFC Approval Process Reform (The "Qualified Jury" Model)

  ### Executive Summary

  We need to replace the current "Unanimous Principal" approval model. It creates a bottleneck that slows delivery and concentrates risk. However, adopting Priya's proposed "Open Senior Vote" carries significant mathematical risk regarding decision quality.

  **Recommendation:** I propose we adopt a **Domain-Rostered Jury Model**.
  1.  **Eligibility:** Voting is restricted to Senior+ engineers *pre-qualified* for specific domains (e.g., Storage, Frontend, Security), ensuring voter competence ($p > 0.5$).
  2.  **Independence:** A 24-hour "blind window" for initial votes/comments before any discussion is visible, preventing information cascades.
  3.  **Threshold:** Simple majority of a quorum of 7 qualified voters (odd number to prevent ties).

  This approach retains the statistical benefits of Condorcet's Jury Theorem (which Priya correctly identified) while structurally enforcing the two assumptions the Principals correctly noted are currently missing: **Competence** and **Independence**.

  ---

  ### Context & Problem Statement

  Our current process requires unanimous sign-off from our three Principal Engineers (PEs).
  *   **Pros:** High individual competence.
  *   **Cons:** Single-point veto creates bottlenecks; $N=3$ is too small to mitigate individual bias or blind spots; creates a bus-factor risk.

  Priya's proposal suggests opening voting to all Senior+ engineers (Quorum 11, Simple Majority), citing **Condorcet's Jury Theorem**. The theorem states that if every voter is more likely to be right than wrong ($p > 0.5$) and votes independently, adding more voters drives the probability of a correct group decision toward 100%.

  The Principals have pushed back, arguing that an open pool violates the theorem's prerequisites. My analysis confirms the Principals' concerns are mathematically valid, but their proposed status quo is operationally unsustainable.

  ### Analysis of Proposals

  #### 1. The Status Quo (3 PE Unanimity)
  *   **Math:** With $N=3$, even if PEs are highly competent ($p=0.9$), the group only reaches a correct decision ~97% of the time. More critically, the *unanimity* requirement means a single "false negative" (a PE incorrectly rejecting a good idea) kills the RFC.
  *   **Verdict:** Too fragile. We cannot scale architecture velocity on the bandwidth of three individuals.

  #### 2. Priya's Proposal (Open Senior Vote)
  *   **Math:** This relies on the assumption that *any* Senior engineer has $p > 0.5$ on *any* architecture topic.
  *   **The Competence Trap:** If a Frontend Senior votes on a Storage RFC, their $p$ may drop to 0.4 (worse than a coinflip). Condorcet's theorem dictates that if the average $p < 0.5$, adding more voters makes the decision *worse*, not better. An open pool guarantees low-$p$ voters will dilute the high-$p$ experts.
  *   **The Independence Trap:** The theorem requires independent votes. In practice, engineers read the first comment, agree with the most senior voice, or anchor on the first proposed solution (Information Cascade). If votes correlate, the "effective $N$" shrinks, negating the wisdom of crowds.
  *   **Verdict:** High risk of lowering decision quality while increasing noise.

  ### The Recommendation: Domain-Rostered Jury

  We can satisfy Priya's goal (more reviewers) and the Principals' constraints (competence and independence) by changing the *structure* of the vote, not just the headcount.

  #### Mechanism 1: Domain Rosters (Solving Competence)
  We will maintain a voluntary registry where Senior+ engineers self-select into domains of expertise (e.g., "Data Plane," "Client Side," "Observability"). PEs will audit these rosters annually to ensure baseline competence.
  *   **Why:** This ensures that for a Storage RFC, only voters with $p > 0.5$ for Storage are eligible. This satisfies the first condition of Condorcet's theorem.
  *   **Quorum:** We require 7 eligible voters from the specific domain roster.

  #### Mechanism 2: The Blind Window (Solving Independence)
  When an RFC is submitted for vote, the tooling will hide all comments and vote counts for the first 24 hours. Reviewers must submit their initial "Approve/Reject/Concern" and a brief rationale before seeing others' input.
  *   **Why:** This prevents anchoring and herding. It forces every voter to generate an independent signal before being exposed to social proof. This satisfies the second condition of Condorcet's theorem.

  #### Mechanism 3: Majority Rule with "Veto + Alternative"
  If the vote passes (4/7), it moves to implementation. If it fails, a rejection requires a written alternative path.
  *   **Why:** This removes the "unanimous veto" bottleneck of the current PE model while ensuring rejections are constructive.

  ### Addressing Objections

  **To Priya (and proponents of Open Voting):**
  I agree with your core premise: we need more than three brains on these decisions. The math supports you *if* the voters are competent and independent. However, without domain filtering, we risk the "Inverse Condorcet" effect where adding voters lowers accuracy. This proposal keeps your quorum model but tightens the eligibility criteria to ensure the math actually works in our favor.

  **To the Principal Engineers:**
  Your concern about non-experts voting on critical infra is the strongest argument against the open pool. The Domain Roster directly addresses this; a Frontend engineer cannot accidentally veto a Database RFC because they won't be on the Database roster. Regarding independence: the Blind Window is a structural fix that forces the independence you rightly identified as missing in typical Slack-thread-style reviews.

  ### Rollout Timeline

  *   **Phase 1: Roster Construction (Weeks 1-2)**
      *   Survey Senior+ engineers to populate initial Domain Rosters.
      *   PEs review rosters for obvious mismatches (light-touch audit).
  *   **Phase 2: Tooling Pilot (Weeks 3-6)**
      *   Configure RFC tool to support "Hidden until submitted" comments.
      *   Run 3 non-critical RFCs through the new Jury process alongside the old PE process (shadow mode) to compare outcomes.
  *   **Phase 3: Full Cutover (Week 7)**
      *   New Jury model becomes default for all Tier-1 RFCs.
      *   PEs move to an appellate role (only consulted if Jury is deadlocked or high-risk exception).

  ### Next Steps

  I request we discuss the **Domain Roster definitions** at Tuesday's meeting. If we can agree on the initial domains (e.g., Data, Client, Platform, Security), we can begin Phase 1 immediately.

  This model treats our approval process like the architecture we build: it requires defined interfaces (Rosters), loose coupling (Blind Votes), and redundancy (Quorum) to be resilient.

  Let's build a process that scales.

  [Your Name]
  Staff Engineer, Working Group Lead
