answer: |-
  The oil lamp sputtered on the map table, casting long shadows over the painted wood of the triremes. Outside, the sea lapped against the hulls of the anchored fleet, a rhythmic breathing in the dark. Kleon, the commander's senior strategist, traced a finger along the coastline of Cyprus. Lysippe, the younger adviser, watched the flame.

  **Kleon:** "The wind yesterday was from the north. That is now necessary. No prayer can make it west. If the statement 'We shall win' is true now, Lysippe, it possesses the same solidity as yesterday's wind. To think otherwise is to imagine we can pray the past away."

  **Lysippe:** "You confuse the direction of the arrow. The wind is necessary because it has happened. The victory is not necessary because it has not. You treat the truth of the prediction as if it were the cause of the event, rather than its shadow."

  **Kleon:** "Diodorus taught me that nothing impossible follows from the possible. If it is possible we lose, yet in truth we win, then the impossible has occurred—the loss that was possible did not happen. Thus, if we win, the loss was never truly possible. The path is single."

  **Lysippe:** "And there I find your knot. You define 'possible' only as that which *will* happen. But the Lyceum holds that possibility resides in the capacity of things, not in the outcome. A cloak may be cut, or it may wear out. Both are possible, though only one will come to pass. The other does not become impossible merely because it failed to occur."

  **Kleon:** "Aristotle's own cloak, and his own sea battle. He admits one side of the contradiction must be true. Either there will be a battle or there will not. If one is true, the other is false. If it is true we win, then it is false we lose. Where is the openness in a falsehood?"

  **Lysippe:** "Here is the joint you are prying at with a blunt tool. I grant you this: It is *necessary* that either we win or we lose. The disjunction is fixed. But you slide from that to claim: Either it is *necessary* that we win, or it is *necessary* that we lose. These are not the same sentence, Kleon."

  **Kleon:** "Semantics. If the proposition is true now, it cannot be otherwise. If it cannot be otherwise, it is necessary. Time is merely a machine that turns the 'will be' into the 'was,' but the substance of the truth remains unaltered from eternity."

  **Lysippe:** "Time is not a machine; it is a condition of truth. A statement about the future is not a mirror reflecting a fixed object; it is a wager on a branching path. If I say 'I will sail,' and I deliberate and choose to sail, my deliberation is the cause of the truth. If you are right, my deliberation is theater, for the truth existed before I thought."

  **Kleon:** "Not theater. Harmony. The gods see the end from the beginning. If their knowledge is perfect, the future is present to them. If it is present to them, it is fixed. Do you claim the divine mind is subject to your contingency?"

  **Lysippe:** "I claim that knowing a thing is not the same as necessitating it. You see a man walking; you know he walks. Does your knowledge force his legs? No. We disagree, Kleon, on a single premise: You believe truth implies necessity. I believe truth merely corresponds to what is, whether that 'what is' is fixed or free."

  **Kleon:** "Then we sit here in the dark, agreeing on the words, but you believe the map can change, and I know the map is already drawn."

  **Lysippe:** "No. We agree the map is drawn in ink. You believe the ink is dry. I tell you we hold the pen."
