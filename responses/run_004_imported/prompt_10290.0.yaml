      *   **The Master Argument (Diodorus):**
          1.  Every true proposition about the past is necessary.
          2.  The impossible does not follow from the possible.
          3.  There is a possible proposition which is neither true nor will be true. (Diodorus denies this).
      *   **The Sea Battle Example:** Aristotle's famous example in *De Interpretatione*. "There will be a sea battle tomorrow."
      *   **The Logical Distinction:** The Modal Scope Fallacy.
          *   Necessity of the Excluded Middle: It is *necessary* that (either $p$ or not-$p$). $\Box(p \lor \neg p)$
          *   Necessity of the Disjuncts: Either it is *necessary* that $p$, or it is *necessary* that not-$p$. $\Box p \lor \Box \neg p$
          *   The Fatalist conflates these. The Aristotelian denies the second while accepting the first.
      *   **Truth Values:** Aristotle suggests future contingent statements are *neither true nor false* yet (or at least, not *definitely* true/false). Diodorus insists they are already true or false.

