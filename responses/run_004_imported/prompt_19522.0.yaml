prompt: |-
  Philosophers writing on moral blame sometimes distinguish a blamer's standing to blame from the truth of what they say: even when an accusation is completely accurate and the target is exactly as guilty as charged, a sufficiently hypocritical accuser can nonetheless lack the standing to voice it. Please argue for this claim, explaining why the truth of an accusation is not on its own sufficient to license the act of making it. Address directly the natural objection that any residual complaint against a hypocritical-but-correct blamer must really concern something else entirely — their manners, motives, or general character — rather than a genuine bar on the speech act of blaming itself, and explain why such a bar, if real, need not excuse the wrongdoer or lessen their culpability.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**
      *   **Core Claim:** A blamer's *standing* to blame is distinct from the *truth* of the accusation. A hypocritical blamer (accurate accusation) can lack the standing to voice it.
      *   **Task 1:** Argue for this claim (explain why truth isn't sufficient to license blaming).
      *   **Task 2:** Address the "Natural Objection": The complaint against the hypocrite is really about manners/motives/character, not a bar on the speech act itself.
      *   **Task 3:** Explain why this bar on standing doesn't excuse the wrongdoer or lessen their culpability.

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *Standing to Blame:* This is a normative concept. It's about authority or permission within a moral community. Like a judge recusing themselves.
      *   *Hypocrisy:* The classic defeater of standing. "You did the same thing!" (Tu Quoque).
      *   *Truth vs. License:* Just because $P$ is true doesn't mean I have the right to assert $P$ in this context (e.g., privacy, authority, consistency).
      *   *The Objection:* "So what if they're a hypocrite? The crime is still a crime." The objection suggests the *message* is valid, even if the *messenger* is flawed.
      *   *Counter to Objection:* Blaming isn't just describing facts; it's a performative act involving moral authority. If the authority is undermined, the act misfires.
      *   *Culpability:* The wrongdoer is still wrong. The hypocrite just can't be the one to enforce the norm *right now*.

  3.  **Structuring the Argument:**
      *   **Introduction:** Define the distinction (truth vs. standing). State the thesis: Hypocrisy undermines standing, not truth. Blaming is a normative practice, not just fact-stating.
      *   **Section 1: The Nature of Blaming.** Why is blaming more than asserting a truth? It involves a demand for accountability and implies a moral relationship. It presumes the blamer respects the norm.
      *   **Section 2: The Hypocrite's Deficit.** Why does hypocrisy remove standing? It violates the equality of moral agents. It turns blame into a tool of domination rather than mutual accountability. (The "Moral Authority" argument).
      *   **Section 3: Addressing the Objection (Manners vs. Standing).** The objection says it's just about character. I need to show it's about the *act* itself. Analogy: A corrupt judge giving a correct verdict. The verdict is legally accurate, but the judge lacks the *authority* to pronounce it.
      *   **Section 4: Culpability Remains.** Does this let the wrongdoer off the hook? No. It just shifts *who* can blame. The norm remains valid.
      *   **Conclusion:** Summarize. Reiterate that moral community requires consistency to function.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the intuition. We all feel the sting of "Look who's talking." Formalize this as the Standing/Truth distinction.
      *   *Argument for Standing:* Blaming is a speech act (illocutionary). It's not just "You broke the vase." It's "You *should not* have broken the vase, and I hold you accountable." This requires the blamer to be part of the same normative community. Hypocrisy signals a rejection of the norm's binding nature on oneself, thus forfeiting the right to enforce it on others.
      *   *The Objection:* The skeptic says, "The hypocrite is annoying, but the accusation stands."
      *   *Rebuttal:* Distinguish between the *proposition* (You did X) and the *performance* (I blame you for X). The proposition is true. The performance is infelicitous. Use the legal analogy (judge recusal). It's not just bad manners; it's a category error in the moral transaction.
      *   *Culpability:* Crucial point. If the hypocrite can't blame, is the act permissible? No. The act is still wrong. Other people can blame. The wrongdoer can self-blame. The norm isn't invalidated, only the specific enforcer is disqualified.

  5.  **Refining and Polishing (Self-Correction during drafting):**
