answer: |-
  The distinction between the truth of a moral accusation and the blamer's standing to voice it is a crucial feature of our ethical landscape. It captures the intuitive force behind the retort, "Who are you to talk?" when faced with a hypocritical accuser. To argue for this claim is to argue that moral blaming is not merely a descriptive act—a stating of facts about wrongdoing—but a normative practice that presupposes a specific relationship between the blamer, the blamed, and the moral community at large. While the truth of an accusation concerns the culpability of the wrongdoer, the standing to blame concerns the authority of the accuser. Truth is a necessary condition for accurate blame, but it is not sufficient to license the speech act of blaming.

  To understand why truth is insufficient, we must first recognize that blaming is a performative act. When I blame you, I am not simply asserting the proposition "You violated norm N." I am issuing a moral demand; I am holding you accountable and implying that you owe a response (an apology, amends, or repentance). This transaction relies on a presumption of moral reciprocity. By blaming another, I implicitly avow that I am bound by the same norms I am enforcing. I position myself as a representative of the moral order, not merely an observer of its violation.

  When a blamer is a hypocrite—specifically, one who is guilty of the same or sufficiently similar wrongdoing without having repented—they undermine this presumption of reciprocity. Their actions signal that they do not regard the norm as binding upon themselves, even as they insist it is binding upon others. This creates a disparity in moral status. If I claim the right to hold you to a standard I exempt myself from, I am no longer engaging in mutual accountability; I am engaging in domination. I am using the moral norm as a weapon to elevate myself above you, rather than as a shared standard to regulate our conduct. Consequently, while the *content* of my accusation remains true (you did violate the norm), my *license* to perform the act of blaming is revoked. I lack the standing because I have forfeited the moral authority required to make the demand.

  A natural and persistent objection arises here. The skeptic argues that any discomfort we feel regarding the hypocritical blamer is misplaced. Surely, the objection goes, the problem lies with the blamer's bad character, their annoying manners, or their impure motives, not with the act of blaming itself. If the accusation is true, the wrongdoer is still wrong. To say the hypocrite lacks standing suggests that the blame itself is invalid or that the wrongdoer has a right not to be blamed. But surely a wrongdoer has no right to demand that their accusers be saints. Therefore, the complaint against the hypocrite must be merely aesthetic or prudential (they are unpleasant to deal with), rather than a genuine normative bar on the speech act.

  This objection, however, conflates the *validity of the proposition* with the *felicity of the speech act*. Consider a legal analogy: A judge may recuse themselves from a case because of a conflict of interest. If that judge proceeds to pronounce a guilty verdict on a defendant who is, in fact, guilty, the verdict is factually accurate. The defendant *is* guilty. However, the judge lacked the standing to pronounce the sentence. The trial is procedurally invalid. We do not say the judge was merely "rude" or had "bad motives"; we say the judgment carries no official weight. The bar is on the *authority to pronounce*, not on the *truth of the guilt*.

  Similarly, in the moral realm, blaming is a practice of holding one another accountable within a community of equals. Hypocrisy disrupts the equality required for this practice. When a hypocrite blames, they are not merely communicating a truth; they are attempting to occupy a moral high ground they do not inhabit. The objection that this is merely about "character" fails to see that standing is a relational property, not an intrinsic trait. It is about the permission to enter a specific normative transaction. To allow hypocritical blame is to allow moral norms to be weaponized for status-seeking rather than used for accountability. Therefore, the bar is not on the truth of the claim, nor is it merely a critique of the blamer's personality; it is a recognition that the speech act of blaming misfires when the requisite moral reciprocity is absent.

  Finally, it is imperative to clarify that denying a hypocrite standing does not excuse the wrongdoer or lessen their culpability. This is the most common fear regarding the standing view: that it lets the sinner off the hook because the preacher is a fraud. But this confuses the *enforcement* of the norm with the *existence* of the norm.

  The wrongdoer's culpability is determined by their relationship to the moral law and the harm they caused, not by the biographical details of the person pointing it out. If a thief steals from a hypocrite, the theft is still wrong. The hypocrite's lack of standing means they cannot *rightfully demand* accountability, but it does not mean accountability is not owed. The wrongdoer still owes amends to the victim, to the community, and to the moral order. Furthermore, the loss of standing by the hypocrite does not mean the wrongdoer is immune to blame *simpliciter*; they are only immune to blame *from this specific accuser*. Other members of the moral community who maintain their own standing retain the full right to blame the wrongdoer. Moreover, the wrongdoer retains the obligation to self-blame.

  In sum, the truth of an accusation is not sufficient to license blaming because blaming is a normative practice rooted in moral reciprocity, not a mere description of facts. Hypocrisy severs the link of reciprocity, turning blame from a tool of accountability into an instrument of inequality. While this bars the hypocrite from voicing the blame, it leaves the moral status of the wrongdoer's action untouched. The wrongdoer remains culpable, the norm remains binding, and the moral community remains intact; only the hypocrite is silenced, not because they speak falsehoods, but because they have lost the authority to speak them.
