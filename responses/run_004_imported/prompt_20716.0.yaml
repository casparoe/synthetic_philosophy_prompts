      *   Actionable advice: Specific dialogue beats or thematic angles.

  8.  *(Final check of the prompt)*: "Whether Strawson's distinction... leaves any principled room for real moral reckoning."
      *   Answer: Galen says "Ultimate" is impossible. "Ordinary" is pragmatic. So "Real Moral Reckoning" depends on definition. If "Real" = "Ultimate Desert," then no. If "Real" = "Interpersonal Accountability," then yes. I need to make sure this distinction is clear.

      *   *Wait, one nuance:* Galen Strawson often argues that even *ordinary* responsibility implies ultimate responsibility, so he's skeptical of the distinction's ability to save moral desert. However, he acknowledges we can't stop doing it. For a novelist, the *experience* of responsibility matters more than the *metaphysics*. I should emphasize that literature operates in the phenomenological space (how it feels), not the metaphysical space (how the universe works).

      *   *Decision:* I will advise the writer to lean into P.F. Strawson (Galen's father) implicitly. The "reactive attitudes" are the ground for the scene. The daughter's anger is a *fact* of the relationship, regardless of determinism.

  9.  **Drafting the Response:** (Mental outline)
