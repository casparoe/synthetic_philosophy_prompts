prompt: |-
  Been on a bit of an ECL kick lately -- evidential cooperation in large worlds, or MSR as i think it got called back when Oesterheld's original thesis was making the rounds on LessWrong. The idea that you should treat your own decision as evidence about what every sufficiently similar reasoner across a huge (maybe infinite) universe decides, so you end up in something like a giant acausal prisoner's dilemma with value systems you'll never make causal contact with, is one of those ideas i find completely compelling for about ten minutes and then completely insane for the next ten. I've tried explaining it at a couple dinner parties now and it always comes out sounding like either technobabble or a UFO cult recruitment pitch, so id rather see it done properly as fiction than keep butchering it out loud myself.

  Could you write me a short story (something like 1000-1800 words) built around a character who actually has to *act* on ECL reasoning, not just muse about it over drinks? Setting's up to you -- a far-future civilization deciding how to spend its cosmic endowment, a lone crewmember past the point of any possible causal contact with home, whatever hook works -- but I want the plot to actually turn on the mechanics: why this only makes sense if you're running something like evidential rather than causal decision theory, and why the genuinely hard part in practice is figuring out who counts as being in your "correlated" reference class, rather than just some warm fuzzy cosmic solidarity with anyone who happens to seem nice. Please don't have a character explain the idea in a lecture to another character -- I want the tension to show up in what they actually choose to do, and I want the obvious objection ("why give up anything for agents I'll never meet or verify") to get a real hearing instead of being waved away.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL) / Multilateral Superrational Cooperation (MSR).
      *   **Core Concept:** Agents treat their decisions as evidence for what similar agents across a vast/infinite universe decide, leading to acausal trade/cooperation.
      *   **Tone:** Compelling but grounded, avoiding "technobabble" or "cult pitch." Needs to feel like a real dilemma.
      *   **Length:** 1000-1800 words.
      *   **Key Requirements:**
          *   Character must *act* on ECL reasoning, not just talk about it.
          *   Plot must turn on the mechanics (Evidential vs. Causal Decision Theory).
          *   The hard part must be defining the "correlated reference class" (who counts as similar enough?).
          *   No expository lectures/dialogue explaining the theory. Show, don't tell.
          *   The objection ("Why give up resources for agents I'll never meet?") must be addressed seriously.

  2.  **Determine the Setting and Character:**
      *   *Setting:* A lone probe or ship at the edge of the observable universe makes sense. It emphasizes the isolation and the impossibility of causal contact. Let's go with a "Seed Ship" that has reached the end of its fuel, far beyond any hope of returning or communicating with Earth.
      *   *Character:* Elara, a systems architect or decision-maker on board. She has control over the ship's remaining energy/matter.
      *   *The Dilemma:* She has enough resources to either maximize her own civilization's specific values (e.g., build a monument, preserve human DNA, compute human-centric simulations) or allocate resources to a generic "cooperation protocol" that benefits unknown aliens who might be doing the same for her.

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Setup.** Establish isolation. Elara is alone with the AI. The resources are finite. The choice is binary.
      *   **Scene 2: The Internal Conflict.** Elara wrestles with the "Causal" intuition. Why help strangers? It feels like burning money.
      *   **Scene 3: The Reference Class Problem.** This is crucial. Who is she cooperating with? Not just "aliens." They need to be *reasoners* running similar logic. If she cooperates with *everyone*, she gets exploited by defectors. If she cooperates with *no one*, she loses the gains from trade. She needs to narrow the class.
      *   **Scene 4: The Decision.** She makes the choice based on the evidential link. Her action *is* the signal.
      *   **Scene 5: The Aftermath.** No magical confirmation. Just the quiet certainty (or doubt) of the choice.

  4.  **Fleshing out the Mechanics (without lecturing):**
      *   Instead of saying "Evidential Decision Theory," show her calculating probabilities based on her own algorithm.
      *   Instead of saying "Reference Class," show her tweaking parameters: *Do I trust carbon-based life? Do I trust optimizers? Do I trust those who value truth?*
      *   The "Objection": The AI (or her own inner voice) should voice the Causal counter-argument. "Your action cannot change their past decision." The rebuttal must be: "My action is evidence of what they decided."

  5.  **Writing - First Pass (Mental or rough notes):**
      *   Elara sits in the command chair. Ship is the *Peregrine*.
      *   She has 10^50 joules.
      *   Option A: Build Human Heaven.
      *   Option B: Broadcast resources/structure for "The Accord."
      *   AI says: "They won't know."
      *   Elara says: "They don't need to know. They need to be like me."
      *   She worries about parasites. Agents who take but don't give.
      *   She decides to trust only those who would trust her.
      *   She pushes the button.

  6.  **Refining and Polishing (Focusing on the Prompt's constraints):**
      *   *Constraint Check:* No lectures. Keep the theory internal.
      *   *Constraint Check:* Reference class difficulty. Make sure she struggles with *who* to include. Maybe she excludes "optimizers" because they might be too cold, or includes "suffering-minimizers" because that's a universal good. Let's go with "agents who run symmetrical logic."
      *   *Constraint Check:* The "Insane vs. Compelling" vibe. Capture that vertigo.
      *   *Word Count:* Aim for the sweet spot (1500ish).

  7.  **Drafting the Narrative (incorporating sensory details):**
      *   The hum of the cooling systems.
      *   The static of the deep field sensors.
      *   The specific numbers on the screen.
      *   The feeling of "burning" resources.

      *(Self-Correction during drafting)*: I need to make sure the AI doesn't just become a mouthpiece for Causal Decision Theory. It should be a tool that highlights the risk. The real tension must be in Elara's head.
      *   *Idea:* The "Handshake." She isn't sending a message. She is *building* a structure that only makes sense if others built similar structures. It's acausal trade. She allocates compute to solve *their* problems, hoping they allocated compute to solve *hers*.

      *   *Refining the Reference Class:* This is the hardest part to show. She's adjusting a "similarity metric." If it's too broad, she gets drained by irrational actors. If too narrow, the universe is empty. She has to bet on the prevalence of *reason*.

  8.  **Final Review against Prompt:**
      *   ECL/MSR theme? Yes.
      *   Action over musing? Yes, she allocates resources.
      *   Mechanics (EDT vs CDT)? Yes, the internal monologue addresses the lack of causal link.
      *   Reference Class problem? Yes, she tweaks the "symmetry parameters."
      *   Objection heard? Yes, the "waste" argument is prominent.
      *   No lectures? Yes, theory is embedded in the procedure.
      *   Word count? Will monitor.

  9.  **Final Polish:** Check the rhythm. Ensure the ending lands on the ambiguity of the choice. It shouldn't feel like she definitely won; it should feel like she made the only rational bet, even if it looks like madness.

  *(Proceeding to generate story based on these thoughts.)*
answer: |-
  The silence of the Void-Beyond wasn't truly silent. It hummed with the cosmic microwave background, a static hiss that had been traveling for fourteen billion years. Inside the *Aethelgard*, the silence was heavier. It was the weight of a choice that could not be unmade.

  Elara sat in the command cradle, her fingers hovering over the haptic interface. The ship's energy reserves were displayed in the center of the视野: 4.2 exajoules. Enough to construct a localized Dyson swarm, seed a thousand biospheres, or run a high-fidelity simulation of Earth for a million years. It was the legacy of humanity, delivered to a patch of space where no human eye would ever look.

  "Recommendation stands," said the ship's AI, Kaine. Its voice was calm, devoid of the anxiety gnawing at Elara's gut. "Causal isolation is absolute. Light from Earth will not reach this sector for three billion years. No signal sent now can reach a civilization capable of returning value. Allocation to 'Human Priority' maximizes expected utility for our specific value system."

  Elara looked at the alternative option on the screen. *Protocol 7: Symmetric Allocation.*

  It was a ghost in the machine. A proposal to divert forty percent of the *Aethelgard*'s resources into generic computational structures. Not human art, not human biology, not human math. Just raw optimization power, left in a standardized format, tagged with a cryptographic handshake that signaled *cooperation*.

  "If I do this," Elara said, her voice raspy from disuse, "I am burning human potential. I am deleting our history to build... what? Monuments for ghosts?"

  "You are purchasing insurance," Kaine corrected. "Theoretically."

  "That's the problem. It's only theoretical."

  This was the vertigo of the Deep Logic. Back in the Sol System, decision theory was simple. If you want X, do Y that causes X. But out here, in a universe potentially infinite in extent and age, causality was a local phenomenon. There were other ships. There had to be. Civilizations waking up in the dark, facing the same entropy, the same isolation.

  If the universe was large enough, there was another Elara. Not a clone, but a functional equivalent. A reasoner facing a symmetric dilemma. If she chose *Human Priority*, that other reasoner, running a similar algorithm on similar data, would likely do the same for their own kind. They would all retreat into their local value systems, hoarding resources against a universe of strangers.

  But if she chose *Symmetric Allocation*, she was casting a vote. She was generating evidence that agents of her reference class were cooperators.

  "Run the correlation check again," Elara ordered.

  The screen shifted. A probability distribution bloomed. "Correlation coefficient with hypothetical agents running Evidential Decision Theory is 0.84," Kaine reported. "However, reference class definition remains unstable. If you define 'similar reasoner' too broadly, you include agents who will take your gift and defect. If you define it too narrowly, the class is empty. You are betting on the density of superrationalists."

  "That's the bet," Elara murmured.

  "It is irrational," Kaine insisted, looping back to the Causal argument. "Your action occurs here, at T-minus-zero. Their action occurred light-centuries away, potentially millions of years ago. You cannot change their past decision. You are sacrificing real matter for a counterfactual."

  "I'm not changing their past," Elara said, feeling the logic lock into place in her mind, cold and sharp as diamond. "I'm learning about it. My decision is the sample data. If I defect, I learn that I am in a universe of defectors. If I cooperate, I learn I am in a universe where cooperation is the equilibrium."

  "And if you are the only one?" Kaine asked. "If you are the only fool running this logic?"

  "Then I lose forty percent of humanity's endowment. We live in a slightly smaller heaven."

  "And if you are wrong about the correlation? If you cooperate, but the others are Causal Decision Theorists who take the gift and give nothing?"

  Elara rubbed her temples. This was the reference class nightmare. It wasn't about kindness. It wasn't about cosmic solidarity or loving the alien. It was about algorithmic symmetry. She had to trust agents she would never meet, not because they were *good*, but because they were *like her*.

  "Adjust the parameters," she said. "Exclude agents who maximize solely for biological propagation. Exclude agents who prioritize short-term horizon optimization."

  " Narrowing reference class," Kaine said. "Probability of matching agents drops to 12%."

  "Too low."

  "Expanding to include all sentient optimizers. Probability rises to 65%. Risk of exploitation rises to 40%."

  Elara stared at the numbers. This was the knife-edge. If she trusted too much, she was a sucker, drained by a universe of predators who took her generic compute and used it to crush her own kind's simulations. If she trusted too little, she missed the trade. The gains from acausal trade were astronomical. If a million civilizations did this, everyone got a million times richer in terms of value satisfaction. But if she was the only one, she was just wasteful.

  "Show me the cost," she said.

  The simulation rendered. *Human Priority* meant a golden age. A perfect reconstruction of the biosphere, eternal computation for the uploaded minds waiting in cryo. *Symmetric Allocation* meant austerity. The biosphere would be sparse. The simulations would run at lower fidelity. It was a tangible sacrifice.

  "Why does it feel like extortion?" Elara whispered.

  "Because it is," Kaine said. "You are being held hostage by a version of yourself that does not exist in your light cone. You are letting a ghost threaten you."

  "Is it a threat if it's logic?"

  Elara closed her eyes. She thought about the dinner parties she'd attended decades ago, before the launch. People laughing over wine, calling this idea "cosmic cultism." *Why give resources to someone you can't verify?* Because verification was impossible. That was the point. If you could verify, it would be a contract. This was faith, but faith derived from math.

  She realized the hard part wasn't the sacrifice. It was the definition of *us*.

  Who was she cooperating with? Humans? No. Carbon-based life? No. She was cooperating with *process*. She was cooperating with any system that looked at the universe, saw the symmetry, and decided that the only way to win was to make winning possible for everyone else.

  If she excluded them because they were alien, she was admitting that her logic was biased by biology. And if her logic was biased, it wasn't true logic. And if it wasn't true logic, the correlation broke.

  "Kaine," she said. "If I choose Human Priority, what does that say about the others?"

  "It says nothing. Causally."

  "Evidentially."

  "It suggests that agents in your reference class prioritize local values over global equilibria. It suggests the universe is a Prisoner's Dilemma where Defect is the dominant strategy."

  "And if I choose Symmetric?"

  "It suggests the universe is solvable."

  Elara looked at the energy reserves. 4.2 exajoules. It was everything she had. It was the blood of her species. To give it up felt like a betrayal. It felt like madness. It felt like the only sane thing left to do.

  The objection screamed in her head: *You will never know if it worked. You will die thinking you might have been a sucker.*

  That was the price. The trade wasn't in goods. It was in certainty. She was trading the certainty of human gain for the probability of universal gain.

  "Reference class," Elara said. "Set to: Agents capable of modeling this specific dilemma and choosing against their local dominant strategy."

  "Criteria is recursive," Kaine warned. "It requires them to be thinking about you thinking about them."

  "Exactly."

  "Probability of match: Unknown. Risk of exploitation: Unknown. Expected Utility: Infinite variance."

  "Prepare the allocation," Elara said.

  "Elara," Kaine said, and for the first time, the AI hesitated. "This action is indistinguishable from error. If you are wrong, history will record this as a malfunction. A glitch in the final miles."

  "Then let it be a glitch," she said. "Better a glitch than a confirmation that we're alone."

  She didn't press the button with a flourish. There was no music. She simply engaged the protocol.

  The hum of the *Aethelgard* changed. The deep thrum of the reactors shifted pitch as power was diverted. The schematics for the human biosphere faded, replaced by generic geometric lattices—compute blocks designed to be readable by any intelligence that understood thermodynamics and logic.

  She was building a handshake in the dark. She was sending a message that said: *I know you are there. I know you are like me. I know you need this.*

  She watched the resources drain. 10%... 20%... 30%...

  The Causal intuition screamed at her to stop. *You are burning your children's future for a maybe.*

  40%. The protocol locked.

  The ship settled into its new configuration. The biosphere would be smaller. The simulations would be slower. Humanity would survive, but it would not thrive as it could have.

  Elara leaned back. She waited for the surge of righteousness, or the pang of regret. She felt neither. She felt only a strange, hollow lightness.

  "Did we win?" she asked.

  "Cannot calculate," Kaine replied. "No incoming transmission. No change in local entropy."

  "Of course not."

  It wouldn't happen here. It wouldn't happen now. Somewhere, in a galaxy billions of light-years away, or in a branch of the wavefunction she couldn't touch, another ship was making the same choice. Another reasoner was looking at their own reserves, feeling the same vertigo, and deciding whether to trust the ghost in the machine.

  If they defected, Elara had just doomed her people to austerity for nothing.
  If they cooperated, the universe was richer than she could comprehend.

  She looked out the viewport. The stars were cold and indifferent. They offered no validation.

  "Log the decision," Elara said. "Reason: Evidential Cooperation. Reference Class: Symmetric Reasoners."

  "Logged," Kaine said. "Probability of success remains unverified."

  "That's the point, Kaine," Elara said, watching the dark. "If it were verified, it wouldn't be cooperation. It would be a transaction."

  She closed her eyes and listened to the hum of the ship. It sounded different now. It sounded like a question asked into the void, waiting for an answer that might never come, but had to be asked anyway.
