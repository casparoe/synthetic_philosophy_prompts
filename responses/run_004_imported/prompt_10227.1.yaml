  7.  **Final Polish:** Check formatting and clarity. (Proceed to generate output).

      *Note on Sidgwick's Voice:* He was known for being painfully honest, almost to a fault. He wouldn't lie. He would admit uncertainty. The notes should reflect his "anxious sincerity."

      *Note on the Journalist:* Needs to be sharp. Not trying to humiliate, but trying to understand the *why*.

      *Let's assemble the 8 questions.*

