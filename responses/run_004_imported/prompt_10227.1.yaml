answer: |-
  Here are eight interview questions designed for your skeptical journalist, keyed to Sidgwick's biography and philosophical corpus. Each includes a note on how Sidgwick would likely respond, based on his letters, *The Methods of Ethics*, and SPR proceedings.

  ### 1. The Ethical Imperative
  **Journalist:** "Professor, in your *Methods of Ethics*, you describe a 'dualism of practical reason'—the troubling possibility that rational self-interest and moral duty do not always align. Is it fair to say that your work with the Society is not merely scientific curiosity, but an urgent search for a 'moral government of the universe'? Do you require proof of survival to make morality rational?"

  *   **Sidgwick's Plausible Answer:** He would admit this candidly. Sidgwick viewed the lack of cosmic justice as a philosophical crisis. He would argue that if death is the end, the utilitarian calculation collapses for the individual. He isn't seeking heaven, but a guarantee that virtue and happiness are ultimately reconciled.
  *   **Where to Press:** Don't let him hide behind "scientific neutrality." Press him on whether his desire for this proof compromises his objectivity. If he *needs* it to be true, can he truly judge the evidence?

  ### 2. The Limits of Materialism
  **Journalist:** "The prevailing scientific view, championed by men like Huxley, is that consciousness is entirely dependent on the brain. By investigating telepathy or apparitions, are you attempting to drive a wedge between mind and matter? Or are you simply looking for exceptions to a rule that has otherwise held firm?"

  *   **Sidgwick's Plausible Answer:** He would argue that materialism is a hypothesis, not a proven fact. He seeks to show that the mind may have capacities independent of the nervous system. He isn't trying to disprove physiology, but to expand the boundaries of what natural law permits.
  *   **Where to Press:** Challenge him on the burden of proof. If materialism explains 99% of experience, why does the 1% of "anomalous" experience demand we overturn the established order?

  ### 3. The Cost to Cambridge
  **Journalist:** "You hold the Knightbridge Professorship at Cambridge, a seat of rational inquiry. Yet many of your colleagues view the Society for Psychical Research as a haven for spiritualists and widows seeking comfort. Do you fear that by lending your name to this, you degrade the currency of British philosophy?"

  *   **Sidgwick's Plausible Answer:** He would express pain at the social cost but argue that a philosopher must follow the evidence wherever it leads, even into disrepute. He would distinguish the SPR's rigorous methods from the parlor séances of the public imagination.
  *   **Where to Press:** Ask if his students suffer for his association. Is his intellectual honesty worth the collateral damage to his institution's reputation?

  ### 4. The Problem of Fraud (The Creery Sisters)
  **Journalist:** "Let us speak of the Creery sisters. You initially championed their thought-transference experiments, only to later discard the results when it was discovered they used a code of covert signals. If your methodology can be so thoroughly deceived by schoolgirls, why do you maintain hope that evidence will turn up elsewhere? Does discarding the fraud not invalidate the hope?"

  *   **Sidgwick's Plausible Answer:** This is a key tension. Sidgwick would argue that detecting fraud is a *success* of their method, not a failure. He maintains that eliminating the false brings us closer to the true "residue." He separates the specific failure from the general hypothesis.
  *   **Where to Press:** This is the point of maximum vulnerability. Press him on whether this is special pleading. If the most promising evidence turns out to be lies, isn't the "residue" just the data that hasn't been caught yet?

  ### 5. The "Residue" of Evidence
  **Journalist:** "You often speak of a 'residue' of testimony that remains after fraud and error are stripped away. But critics say this residue is merely the unexplained, not the supernatural. At what point does a collection of anecdotes become data? How many unverified witness statements equal a scientific fact?"

  *   **Sidgwick's Plausible Answer:** He would concede that anecdotes are not proof in themselves but argue that their cumulative weight creates a probability that cannot be ignored. He relies on the credibility of the witnesses (often fellows of the Royal Society) rather than the phenomena alone.
  *   **Where to Press:** Push him on the definition of "cumulative." Does adding together ten weak testimonies make one strong one? Ask him if he is conflating *credibility of the witness* with *truth of the claim*.

  ### 6. The Census of Hallucinations
  **Journalist:** "Regarding the Census of Hallucinations: this was a massive survey designed to count waking hallucinations in the general population. Was this not an attempt to establish a statistical baseline? Were you trying to prove that 'crisis apparitions'—seeing a loved one at the moment of their death—occur more frequently than mere coincidence would allow?"

  *   **Sidgwick's Plausible Answer:** Exactly. He would explain that if hallucinations are rare, a coincidence between a hallucination and a death is significant. If hallucinations are common, the coincidence is meaningless. The Census was to determine the denominator in that probability equation.
  *   **Where to Press:** Ask about the reliability of self-reported data in a census. Can you trust a postal survey on something as subjective as a vision? If the baseline is flawed, is the statistical argument destroyed?

  ### 7. Distinction from Theology
  **Journalist:** "Clergymen welcome your work because it suggests a soul that survives death. But you are not a theologian. If you were to find definitive proof of survival, would that not still fall short of proving the Christian God? Are you building a bridge to a destination you do not actually endorse?"

  *   **Sidgwick's Plausible Answer:** He would agree sharply. He is not an apologist for the Church of England. He seeks evidence of *continuity of consciousness*, not dogma. He would argue that a naturalistic afterlife is philosophically sufficient for his ethical needs without requiring religious orthodoxy.
  *   **Where to Press:** Ask if this "naturalistic afterlife" is cold comfort to the public. Is he using the hopes of believers to fund a philosophical experiment that might not validate their specific faith?

  ### 8. The Stakes of Failure
  **Journalist:** "Finally, Professor, suppose the Society operates for another fifty years and finds nothing. Suppose the 'residue' vanishes under stricter scrutiny. Must we then accept your 'dualism' as unsolvable? If there is no survival, is your system of ethics doomed, or can duty stand alone in a silent universe?"

  *   **Sidgwick's Plausible Answer:** This would cause him the most visible distress. He would likely admit that without survival, his ethical system lacks a rational foundation, though he would still *feel* compelled to be moral. He might suggest that the search itself is a duty, regardless of the outcome.
  *   **Where to Press:** This is the emotional climax. Don't let him retreat into stoicism. Ask him if he is afraid of the answer. Is he investigating to find the truth, or to avoid a truth he fears?
