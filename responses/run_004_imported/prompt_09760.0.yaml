      *   **Section 2: Where it Breaks.** Distinguish between Strategic Rationality (Centipede) and Epistemic Consistency (Exam). Highlight that Centipede BI leads to a valid equilibrium, while Exam BI leads to a contradiction with the setup.
      *   **Section 3: The Fixes.**
          *   Centipede: Type Uncertainty (Kreps/Wilson/Milgrom).
          *   Exam: Epistemic Logic (Fitch's Knowability, KK principle).
      *   **Section 4: The Unified Theory.** The real culprit is **Common Knowledge**. In both cases, assuming infinite recursive depth of knowledge/belief is the error. Bounded depth solves both.
      *   **Conclusion:** The resemblance is deep, but the "fix" requires tweaking the *epistemic state* in both, though the specific mechanism (probability vs. logic) differs.

  10. **Final Polish:** Ensure tone is appropriate (LW/ACX adjacent means high rationality, precise, comfortable with jargon but clear). Avoid being too academic but maintain rigor. (Self-correction: Make sure to explicitly mention the "Common Knowledge of Rationality" vs "Common Knowledge of the Announcement" parallel).

