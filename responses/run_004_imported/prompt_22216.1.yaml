      *   *The Problem:* Cohen's Bootstrapping Problem. If I have basic justification to believe $P$ (via source $S$), and I know that $S$ says $P$, can I infer that $S$ is reliable? If yes, I can prove reliability without independent check. If no, closure fails or basic justification is restricted.
      *   *The Dogmatist Position (Pryor, etc.):* Perceptual experience provides immediate justification. No antecedent justification for reliability needed.
      *   *The Critic Position (Cohen, Vogel, etc.):* This leads to absurd "easy knowledge."
      *   *The Defense:* Externalists/Reliabilists often bite the bullet. If the source *is* reliable, why can't I come to know it is? The "no independent check" requirement begs the question against externalism.
      *   *The Locus of Disagreement:* Is it Closure? (Can I deduce reliability?) Or is it the nature of the evidence? (Does a track record generated this way count as *evidence*?)

