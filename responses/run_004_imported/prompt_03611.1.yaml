  2.  **Deconstruct Good's Theorem (The Value of Information):**
      *   *What is it?* It states that the expected utility of making a decision *after* observing free evidence is always greater than or equal to the expected utility of making the decision *without* that evidence.
      *   *Key Condition:* The evidence must be *free* (costless) and *relevant* (potentially changes probabilities).
      *   *Mathematical Intuition:* $E[U(\text{with info})] \geq E[U(\text{without info})]$.
      *   *Why?* Because with more info, you can at worst do what you would have done without it, but usually, you can do better by tailoring the action to the new state of knowledge.

