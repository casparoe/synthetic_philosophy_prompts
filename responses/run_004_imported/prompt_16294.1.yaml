prompt: |-
  My great-aunt died last week — she taught Islamic philosophy for something like 30 years and her whole thing, not just professionally but like actually believed it, was al-Ghazali's occasionalism. She'd get genuinely annoyed if you said the kettle "caused" the water to boil. I got asked to give the eulogy, which is funny timing because I'm in a philosophy of religion seminar right now and we just finished the unit on Ghazali and causation. She left a note saying whoever eulogizes her can't say the usual stuff, like "she shaped so many students" or "her influence lives on," because that gives a creature real causal power, and on her view she was never a cause, only ever an occasion for whatever God habitually chose to do around her. Also nothing carries its own power forward from one moment to the next on her view anyway, its all just getting recreated by God each instant, so even "her effect continues" isn't a comfort she'd have accepted. Can someone write this eulogy so it actually respects that instead of quietly ignoring it, but still lands for a room that's mostly non-philosopher family plus a few of her old colleagues who will absolutely clock it if the doctrine's wrong. Needs to be about 5 minutes spoken.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Great-aunt, taught Islamic philosophy for ~30 years.
      *   **Core Belief:** Al-Ghazali's occasionalism (denial of secondary causation, belief that God is the only true cause, constant recreation of the universe).
      *   **Specific Constraint:** The eulogy *must* respect this doctrine. No attributing causal power to her (e.g., "she shaped students," "her influence lives on"). No implying continuity of effect through time (e.g., "legacy," "memory carries on").
      *   **Audience:** Mixed. Mostly non-philosopher family (need accessibility/emotion) + colleagues (need doctrinal accuracy).
      *   **Tone:** Respectful, accurate, poignant, not dryly academic.
      *   **Length:** About 5 minutes spoken (approx. 600-750 words).
      *   **Context:** Nephew/Niece is currently studying this in a seminar (adds a personal connection/irony).

  2.  **Deconstruct Occasionalism for the Eulogy:**
      *   *What can't I say?* She caused anything. She influenced anyone. Her work continues. Her memory persists on its own. Time flows continuously from her life to now.
      *   *What can I say?* God created her. God sustained her. God chose to manifest wisdom through her tongue. God chooses to manifest grief in us now. God chooses to manifest memory in our minds *this instant*. Every moment of her life was a direct encounter with the Divine.
      *   *The "Hook":* The nephew/niece is studying Ghazali right now. This is a perfect "occasion" for this speech.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. State the constraint gently. Connect the current study of Ghazali to her life.
          *   *Idea:* Start with the kettle story. It's iconic to her.
          *   *Refinement:* Maybe save the kettle for later to illustrate the point. Start with the note she left. It sets the rules.

      *   **Theological Core (The "Hard" Part):** Explain occasionalism without sounding like a lecture.
          *   *Concept:* She wasn't a cause; she was a locus of manifestation (*mazhar*).
          *   *Phrasing:* "She did not pour wisdom; wisdom was poured through her." "She was a mirror, not a light source."

      *   **Addressing the Audience (Family vs. Colleagues):**
          *   *Family:* Needs to feel like love, not cold metaphysics. The love we feel is real, but its source is God.
          *   *Colleagues:* They need to hear the correct terminology or sentiment (no *asbab*, only *Musabbib al-Asbab*).

      *   **The "Legacy" Problem:** How to talk about her impact without saying she had impact?
          *   *Solution:* God *chooses* to create similar states in students now as He did when she was here. It's a habit of God (*adah*), not a chain of cause/effect.
          *   *Phrasing:* "If we are wise today, it is not because she made us so. It is because God, in His generosity, chooses to recreate that same wisdom in us now, just as He did in her presence."

      *   **Death and Time:** Occasionalism says time is discrete atoms. Death is just God ceasing to recreate that specific form.
          *   *Phrasing:* "Her final breath was not an end, but a completion of a specific divine intention." "We miss her" = God creates the state of longing in us now.

      *   **Closing:** Bring it back to the present moment. The only time that exists is *now*.
          *   *Idea:* We are together *now* because God wills it *now*.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Auntie was strict about causation. I'm studying Ghazali now. She left a note: don't say she caused things. So I won't. She was a vessel. God did the work. We miss her because God makes us miss her. Her students are smart because God makes them smart, not because she taught them. Let's pray.
      *Critique:* Too blunt. Needs warmth. Needs to sound like a eulogy, not a disclaimer.

  5.  **Drafting - Iteration 2 (Adding Warmth & Imagery):**
      (Incorporating the kettle anecdote). She'd correct you on the boiling water. It wasn't pedantry; it was piety. She saw God in every moment. I'm learning this in class now. It's ironic. She didn't build a legacy. God built moments with her. When we remember her, God creates that memory.
      *Critique:* Better. Need to ensure the colleagues nod along and the family doesn't feel alienated. The "God creates the memory" part is crucial for the "no continuity" rule.

  6.  **Refining the Theology (Checking against Ghazali):**
      *   Ghazali's *Tahafut al-Falasifa*.
      *   Key concept: *Custom* (*adah*) of God. We expect fire to burn cotton, but it's God's habit.
      *   Application: We expect her teaching to influence students, but it's God's habit to create knowledge in students when she speaks.
      *   Key phrase: "The Giver of Forms" or "The Sustainer."
      *   Avoid: "Her spirit lives on" (implies independent continuity).
      *   Use: "God sustains her memory in our hearts *in this moment*."

  7.  **Final Polish (Timing and Tone):**
      *   Word count check: ~700 words for 5 mins (speaking slowly/pausing).
      *   Ensure the transition from "strict doctrine" to "deep love" is smooth. The doctrine *is* the love (seeing God everywhere).

  8.  **Writing the Speech (incorporating the above):**
      *   *Start:* The note. It's the elephant in the room.
      *   *Middle:* The kettle story (lightens the mood, illustrates the point). The teaching (rephrased as occasion).
      *   *End:* The present moment. The prayer.

      *(Self-Correction during drafting)*: Make sure I don't accidentally say "She taught us." Instead: "In her presence, we were taught." Or "God created understanding in us when she spoke."
      *Actually, "She taught" is linguistically unavoidable in common speech, but I need to qualify it metaphysically.* "What we call her teaching was really..."

      *Wait, the prompt says she'd get annoyed if you said the kettle caused water to boil.* So I must be precise. "She was the occasion."

      *Let's write it.*

  9.  **Final Review against constraints:**
      *   No "shaped students"? Check.
      *   No "influence lives on"? Check.
      *   No "effect continues"? Check.
      *   Occasionalist doctrine accurate? Check (God recreates, habit of God, no secondary causation).
      *   5 minutes? (Word count looks right).
      *   Emotional resonance? (Aiming for awe rather than loss).

  10. **Final Polish:** Add stage directions for pacing. (e.g., [Pause]).

  *(Proceed to generate output based on this thought process.)*
answer: |-
  **Title:** The Occasion of Her Presence
  **Time:** Approx. 5 Minutes
  **Tone:** Reverent, Precise, Warm

  [Stand comfortably at the podium. Take a moment to look at the room before speaking.]

  Assalamu alaikum wa rahmatullahi wa barakatuh.

  For those who knew my great-aunt well, you know that I am walking a theological tightrope right now. She left specific instructions for this moment. She wrote that I am not to say she "shaped" minds, that her work "continues," or that her influence "lives on."

  To the rest of the family, this might sound like semantic strictness. But to her colleagues, and to me—as it happens, I am sitting in a seminar on Ghazali right now—this was the core of her piety. She believed that to attribute real power to anything other than God is to miss the reality of the universe.

  She would often tell the story of a student who said the kettle caused the water to boil. She didn't correct him to be difficult. She corrected him because she believed that saying the kettle has power is to dim the light of the One who actually holds the power. She believed that fire does not burn by nature, and water does not boil by necessity. These are merely habits of God.

  So, I will not say that she was a cause. I will say that she was an occasion.

  For thirty years, in classrooms and over tea, God chose to create wisdom in the hearts of students at the occasion of her voice. If there is knowledge in this room today, it is not because she transferred it like a vessel pouring water. It is because God, in His generosity, has established a habit: when a sincere seeker speaks truth, He creates understanding in the listener. She was the mirror, not the light. But oh, how clearly she reflected it.

  There is a comfort in this, even if it is a stark one. We often worry about legacy—that our effects will fade after we are gone. But on her view, there is no "after." There is only the eternal *Now*.

  Time does not flow from her life into ours. There is no chain connecting yesterday to today. There is only this moment, created anew.

  So, when we feel grief right now, it is not a lingering echo of the past. It is a fresh creation of God in this instant. And when we feel love for her, that love is not a memory we are holding onto by our own strength. It is being sustained by God *right now*.

  She did not build a bridge to the future. She stood fully in the presence of the Creator, in every single atom of time she was granted. And because God's habits are consistent, the wisdom she loved is still available to us. Not because she left it behind, but because the Source of that wisdom is still here, present in this room, as He was present in her study.

  To her colleagues: She was a rigorous signpost. She pointed away from herself, always toward the *Musabbib al-Asbab*, the Causer of Causes.

  To my family: She loved you deeply. But even that love was not hers to own. It was a divine mercy manifested through her. And the love you feel for her now? That is a divine mercy manifested in you.

  I cannot say she lives on. I can only say that God is Alive, *Al-Hayy*, and He is creating this gathering, this memory, and this peace in our hearts at this very moment.

  Her final breath was not an end of a process, but the completion of a specific divine intention for her soul. She has returned to the only Agent that ever existed.

  May God recreate her in the gardens of Paradise, not as a reward she earned by her own power, but as a manifestation of His boundless grace. And may He sustain us in this moment of loss with the certainty that nothing is ever lost to Him, for He recreates all things, in every instant, by His will.

  Al-Fatiha.
