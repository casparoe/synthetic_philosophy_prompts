  **Slip:** There is a minor conflation between *holist* underdetermination (we can save $T$ by changing auxiliaries) and *contrastive* underdetermination (there exists a distinct rival $T^*$). While Quine is often read as endorsing the latter, some scholars argue the Duhem–Quine argument strictly supports only the former. However, for the purposes of a seminar on realism, this is the standard interpretation and not a grading error.
