answer: |-
  LEIBNIZ: You propose a container that contains nothing. An absolute space, immutable and infinite, existing independently of the bodies within it. Tell me, Sir Isaac, if God created the material universe within this void, what prevented Him from placing it five feet to the left?

  NEWTON: Nothing prevented Him.

  LEIBNIZ: Precisely. And what prevented Him from placing it five feet to the right? Or turning it entirely about, exchanging East for West?

  NEWTON: Nothing.

  LEIBNIZ: Then we have a contradiction. If space is absolute, these different positions are distinct. Yet there is no discernible difference between them. No reason exists for God to choose *here* rather than *there*. But God does nothing without a sufficient reason. Therefore, He did not choose between absolute positions. Therefore, absolute space is a chimera. Space is nothing but the order of coexisting things. Remove the bodies, and you remove the space.

  NEWTON: You bind the Almighty with your syllogisms. You say He cannot act without a reason discernible to Mr. Leibniz. I say He acts because He wills it. His Will is the sufficient reason.

  LEIBNIZ: That makes Him arbitrary. A tyrant choosing without wisdom. I propose a God of perfect wisdom. If He built the universe, He built it perfect. He does not need to intervene. Yet your system of gravity is a miracle in perpetual disguise. You claim attraction acts across a vacuum without contact. This is occult. It requires God to constantly correct the mechanism, to rewind the clock because it runs down. A watchmaker who must constantly mend his watch is a clumsy craftsman.

  NEWTON: And a watchmaker who winds his clock once and walks away is a deist who has abandoned his creation. Gravity is not occult; it is law. And the stability of the system proves not clumsiness, but Sovereignty. He holds the planets in their orbits as a King holds his scepter. By force. By presence.

  LEIBNIZ: Presence? You speak of space as if it were a substance. In your *Opticks*, you hint that space is the sensorium of God. Does the Almighty have eyes? Does He have nerves? Is He spread out through the universe like butter on bread?

  NEWTON: I speak of Dominion. God is not a word without meaning. Deity is the dominion of God. He is not Lord over his own body, as the heathens fancy, but over servants. To rule, He must be present. Absolute space is the attribute of His omnipresence. It is the arena of His existence. If space is merely relational, as you claim, then God is only present where matter is. Is He absent in the void between stars? Is He limited by the edges of the cosmos?

  LEIBNIZ: God is not limited by location. He is in all things by essence, not by extension. You confuse the Creator with His kingdom. You require a literal throne room because you cannot conceive of a power that is metaphysical rather than physical. You want a God you can measure.

  NEWTON: I want a God who rules. Your God is a prisoner of logic. He *must* create the best of all possible worlds. He *cannot* intervene. He *cannot* choose. He is bound by the chain of sufficient reason. You have made a idol of Geometry and sacrificed Liberty to it.

  LEIBNIZ: I have sacrificed nothing but your superstition. You claim He intervenes to correct the solar system. This implies the initial creation was flawed. It implies repentance in the Divine mind.

  NEWTON: It implies He is alive. Not a static principle. Not a distant architect. He governs. All things are under His dominion. There is one God the Father, supreme over all, and His dominion is absolute. To deny absolute space is to deny the extent of His rule. It is to say there are places where He is not King.

  LEIBNIZ: And to insist upon it is to make Him a monarch of empty halls. You fight for space as a jealous man fights for property. Perhaps you are accustomed to claiming territory that belongs to others. We speak of methods of calculation. Fluxions. Differentials. The notation reveals the mind. Yours is obscured, hidden behind geometric proofs. Mine is clear. Open.

  NEWTON: What is mine is mine. What is taken is stolen. But we are not speaking of calculus. We are speaking of the nature of Reality. You would reduce the universe to a clockwork that runs itself. I tell you it is a Kingdom. It requires a King. And a King requires a Realm.

  LEIBNIZ: A Kingdom implies subjects. Space is not a subject. It is nothing. You worship a shadow and call it His footprint.

  NEWTON: I worship the Will that sustains the stars. You worship the Logic that constrains them. You say God could not shift the universe because there is no reason to. I say He could burn it all away and build anew because He wills it. Your God is safe, Herr Leibniz. He is neat. He is tidy. He never gets His hands dirty in the matter of creation.

  LEIBNIZ: And yours is a magician. He waves a wand to fix the errors in your equations. You call it Sovereignty. I call it imperfection. If He must act to preserve the system, the system was not worthy of Him.

  NEWTON: The system is worthy. But it is not autonomous. Nothing is autonomous save Him. Not space. Not matter. Not even your sufficient reason. You seek to judge God by the rules of men. I seek to understand the rules of men by the Dominion of God.

  LEIBNIZ: Then we are at an impasse. You see a Monarch on a throne of void. I see a Geometer in a web of relations.

  NEWTON: You see a machine. I see a Kingdom. And in a Kingdom, the King decides where the boundaries lie. Not the subjects.

  LEIBNIZ: Even if the King is mad? Even if He chooses without reason?

  NEWTON: Especially then. For who shall say unto Him, what doest Thou?

  LEIBNIZ: Reason shall. And history.

  NEWTON: God shall. And eternity.
