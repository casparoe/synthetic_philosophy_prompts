      *   *Is it possible to be incoherent but calibrated?* Technically yes, by luck, but unsustainable.
      *   *Key takeaway:* Coherence is the *syntax* of probability; Calibration is the *semantics*.

  8.  **Final Polish:** (Reviewing against the generated output)
