answer: |-
  This is a classic conflict between **organizational sovereignty** (the employer's right to define their culture) and **individual autonomy** (the employee's right to a private life). To determine who is "right," we first need to give both arguments their strongest possible form, free of caricature.

  ### The Steelman: The Manager's Position
  **Core Argument:** *Employment is a relational contract, not just a transactional one. An organization is a moral community, and its "values" are intangible assets that require protection.*

  The manager's view rests on the idea that a company is more than a machine that produces goods or services; it is a social ecosystem held together by trust and shared identity.
  1.  **Culture as Capital:** A company's reputation and internal culture are fragile assets. If employees behave in ways that contradict the company's professed values—even off the clock—it can erode trust among colleagues. If the company claims to value "health" or "integrity" or "responsibility," and an employee is known to flout those norms, it creates cognitive dissonance that weakens the culture.
  2.  **The "Community" Standard:** Just as a neighborhood association might have rules about lawn care to maintain property values, a workplace community has an interest in maintaining social cohesion. If coworkers feel uncomfortable or morally opposed to a colleague's behavior, it can disrupt teamwork, regardless of whether that behavior impacts immediate output.
  3.  **Freedom of Association:** Employers, too, have rights. They have the right to choose with whom they associate. If an employee's off-duty conduct makes them incompatible with the leadership's vision, the employer should have the discretion to end that partnership, provided they follow the law. To demand they keep an employee who actively undermines their ethos is to infringe on the employer's liberty.

  ### The Steelman: The Friend's Position
  **Core Argument:** *Employment is a limited economic exchange. Extending employer authority into private life violates the "Harm Principle" and creates a dangerous power imbalance.*

  The friend's view rests on liberal political philosophy and modern labor ethics, specifically the distinction between the citizen and the worker.
  1.  **The Harm Principle:** Drawing from John Stuart Mill, power should only be exercised over an individual to prevent harm to others. If the conduct is lawful, off-duty, and causes no demonstrable harm to the business (e.g., lost productivity, safety risks, reputational damage proven by data), the employer has no legitimate interest in it.
  2.  **The "Nexus" Test:** In progressive labor law, discipline for off-duty conduct usually requires a "nexus" to the employment. Does the behavior make the employee unable to perform their job? Does it harm the company's reputation in a tangible way? Without this link, the employer is regulating the *person*, not the *worker*.
  3.  **Arbitrariness and Bias:** "Company values" are subjective. One manager's "incompatible conduct" is another's "personal freedom." This vagueness invites bias. Historically, morality clauses are disproportionately used against marginalized groups, political dissenters, or those whose lifestyles differ from the majority. It creates a "chilling effect" where employees self-censor in their private lives out of economic fear, effectively extending the workplace into the home.

  ***

  ### Who is Actually Right?

  While the Manager's argument has theoretical merit in extreme cases (e.g., a CFO convicted of embezzlement, or a public-facing spokesperson engaging in hate speech), **your friend is right regarding this specific policy and the cannabis case.**

  Here is the breakdown of why the friend's position holds more ethical and practical weight in this context:

  **1. The "Values" Trap is Subjective and Unenforceable**
  The Manager argues that the workplace is a "community" entitled to protect its sense of normalcy. The problem is that "company values" are often marketing slogans, not moral frameworks. When a company disciplines for "incompatible values" without defining them, they are not protecting a community; they are enforcing conformity. In the cannabis case, the employee broke no laws and harmed no one. The "harm" was purely to the *sensibilities* of coworkers. In a pluralistic society, economic security should not depend on aligning your private lifestyle with the sensibilities of your manager.

  **2. The Power Imbalance**
  The Manager's argument assumes a level playing field between employer and employee. It does not exist. For the employee, this is their livelihood; for the employer, it is one worker among many. When an employer claims the right to police lawful off-duty conduct, they exert totalizing control. This creates a dynamic of feudalism rather than contract. The friend's position protects a necessary boundary: **you rent my labor for 40 hours a week; you do not own my life.**

  **3. The Lack of a Nexus**
  The strongest argument against the Manager is the lack of a *nexus to work*.
  *   **If** the employee showed up high: That is a performance/safety issue.
  *   **If** the employee posted about it on a public company LinkedIn: That is a reputational issue.
  *   **But** smoking legally at home on weekends? That has no functional connection to the employment contract.
  The Manager's claim that this harms the "shared sense of what's normal" is actually an admission that the harm is cultural, not operational. While culture matters, it cannot override individual liberty unless it tangibly impacts the business. If "culture" requires firing competent staff for legal private behavior, it is a fragile culture that relies on coercion rather than buy-in.

  **4. The Precedent of Overreach**
  The Friend's position is the only one that prevents a slippery slope. If "incompatible with values" is sufficient for dismissal today, what is it tomorrow? Political donations? Dating choices? Reading materials? The Manager's position offers no limiting principle other than the employer's whim. The Friend's position (requiring demonstrable harm) offers a clear, objective standard that protects both the business (from actual harm) and the worker (from tyranny).

  ### The Verdict

  **Your friend is right.**

  The Manager is correct that companies have cultures worth protecting, but they are wrong to believe that culture can be protected through coercion of private life. A healthy organizational culture is built on shared professional goals and mutual respect *at work*, not on the homogenization of private behavior.

  By dismissing an employee for lawful, off-duty conduct that had no impact on performance, the company has conflated **compliance** with **commitment**. They have signaled that loyalty to the company's moral orthodoxy is more valuable than job performance. This is not only ethically dubious; it is bad business. It reduces psychological safety, increases turnover, and exposes the company to legal risk in jurisdictions that are increasingly protecting off-duty conduct (such as legal cannabis use).

  The Manager's view treats employees as brand ambassadors 24/7. Your friend's view treats them as adults with a right to a private life. In a free society, the friend's view is the one that sustains both liberty and a healthy labor market.
