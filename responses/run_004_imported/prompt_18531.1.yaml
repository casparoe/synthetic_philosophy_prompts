answer: |-
  **Setting:** *A dimly lit faculty lounge, 11:30 PM. Coffee stains on the table. Two whiteboards covered in half-erased equations. Dara (Bohmian) is packing her bag. Evan (Everettian) is leaning against the doorframe, blocking the exit.*

  **Dara:** You're hiding behind the math, Evan. We both know what Bell proved. Nature does not respect local causality. I'm honest about it. In my theory, the velocity of a particle here depends on the position of a particle there, instantaneously. The pilot wave lives in configuration space, not 3-space. It's non-local. I pay the tax.

  **Evan:** You pay a tax on a debt you don't owe. That's the problem. You're assuming Bell's theorem is a no-go theorem for *locality*. It isn't. It's a no-go theorem for *local hidden variables*.

  **Dara:** Don't give me the standard line. "Hidden variables." You mean *outcomes*. I see a detector click. You see a detector click. Bell showed that if that click is a single, definite event, and it correlates perfectly with a spacelike separated click without a prior script, then something connected them faster than light.

  **Evan:** "If that click is a single, definite event." There it is. That's the axiom you're smuggling in. Bell's inequality relies on factorizability: $P(A, B | \lambda) = P(A | \lambda) P(B | \lambda)$. It assumes that given the past state $\lambda$, the probability of my outcome is independent of yours.

  **Dara:** Because they're spacelike separated! That's the definition of locality.

  **Evan:** No, that's *signal* locality. Bell's condition is stronger. It assumes there is a single outcome $A$ and a single outcome $B$ to be correlated. In Many-Worlds, there isn't. The global wavefunction evolves unitarily. The Hamiltonian is local. Fields commute at spacelike separation. Nothing travels faster than light. The correlation isn't established when Alice measures; it was established when the entangled pair was created.

  **Dara:** That is sophistry, and you know it. When Alice measures, she gets *Up*. Bob gets *Down*. If I am the Alice-branch, I know instantly what Bob got. If your theory says "All outcomes happen," then fine, but *I* am only experiencing one. Why am I correlated with *this* specific Bob-branch and not the other one?

  **Evan:** Because you aren't correlated with him *across* space. You're correlated with him because you are part of the same branch vector. The splitting is local. Alice interacts with her particle, her brain state entangles with it. Bob interacts with his, his brain entangles with his. When the light cones finally meet, the branches match up. There is no moment where Alice's measurement *changes* Bob's physical state. His reduced density matrix is unchanged.

  **Dara:** His *operational* state is unchanged. That's no-signaling. Bell knew about no-signaling in 1964. He didn't care. He cared about *ontological* locality. He asked: "Does the physical reality here depend on the setting there?" In Bohm, yes. The particle trajectory bends instantly. In your theory, what is the physical reality?

  **Evan:** The wavefunction.

  **Dara:** A wavefunction on configuration space! A field in $3N$ dimensions. To say that's "local" because the differential equation is local is like saying a telephone network is local because the electrons in the wire only move to adjacent atoms. The *information* is global. If your ontology is the wavefunction, your ontology is inherently non-local with respect to 3D space.

  **Evan:** That's a category error. 3D space emerges from the Hilbert space structure. Locality is defined by the tensor product structure of the Hamiltonian. Interactions happen between neighboring degrees of freedom. That is preserved perfectly in Everett. You're the one adding particles—extra beables—riding on top of the wave. *Those* particles have to jump non-locally to match the statistics. I just keep the wave.

  **Dara:** You keep the wave and you sacrifice the world. Look, let's be precise. Bell defined Local Causality. If I specify everything in the past light cone of Alice, does that fix the probability of her outcome?

  **Evan:** It fixes the *branch weight*.

  **Dara:** It doesn't fix the *outcome*.

  **Evan:** Because there is no "the outcome." There is the outcome relative to the branch.

  **Dara:** And that's where you lose the plot, Evan. Because *I* feel like there's an outcome. If your theory is true, "I" am splitting. But right now, before I look at the result, I am one person. After, I am two. What determines which "I" sees which result?

  **Evan:** Nothing determines it. Both happen.

  **Dara:** Then why do I never see a violation of the Born rule? Why do I never find myself in a maverick branch where the statistics break down? If everything is local and everything happens, the measure of my existence has to track the amplitude. But why? If there's no non-local mechanism guiding me to the high-amplitude branches, isn't that just magic?

  **Evan:** It's not magic, it's decision theory. Or self-locating uncertainty. Look, Dara, you're demanding that I explain why *you* experience one outcome. I'm telling you that "you" is an indexical. The physics is complete without a single outcome. The correlation between Alice and Bob is just the structure of the entangled state. It's like asking why the left side of a coin is heads if the right side is tails. They aren't communicating. They are parts of the same object.

  **Dara:** A coin is one object in space. Alice and Bob are light-years apart. If the "object" is the wavefunction, then the wavefunction is a non-local object. You haven't saved locality; you've just redefined "object" to be something that ignores spatial separation.

  **Evan:** I've redefined "reality" to match the equations. You're the one insisting on a primitive "single outcome" variable that isn't in the Schrödinger equation. You add the particles to get the single outcome, and to make that work, you have to violate Lorentz invariance at the fundamental level. Your theory has a preferred foliation of spacetime. Admit it.

  **Dara:** I do admit it. Hidden variables require a preferred frame. I'd rather have a preferred frame that's undetectable than a reality where I don't actually make choices. But don't pretend you're off the hook. If you claim MWI is local, you have to explain Bell without non-locality.

  **Evan:** I do. Bell's theorem says: Local + Single Outcome $\rightarrow$ Inequality Violated. Nature violates the inequality. Therefore: Not (Local + Single Outcome). You choose to drop Locality. I choose to drop Single Outcome. Both are consistent.

  **Dara:** But is dropping "Single Outcome" actually keeping locality? Or is it just dodging the question? Bell's notion of locality was about *causation*. Did event A cause event B? In your view, Alice's measurement doesn't cause Bob's result. Fine. But it *does* cause the *splitting* of the Bob-versions relative to the Alice-versions.

  **Evan:** No, it doesn't. That's the point. Alice's measurement splits Alice. Bob's measurement splits Bob. There is no "global split." There is only local entanglement spreading. The correlation is revealed only when the classical information compares notes. Until then, there is no fact of the matter about "which Bob" is paired with "which Alice."

  **Dara:** That sounds peaceful until you realize that for *me*, the Alice, the result is definite *now*. If I get Up, I know Bob *has* Down. Not "will have." *Has*. If I can know a fact about a spacelike separated region that wasn't determined by the past light cone, that is non-locality. Operational or not.

  **Evan:** You know it because you are assuming your experience is the *only* experience. If you accept that there is an Alice-Down who knows Bob-Up, then no knowledge has traveled. The total information content of the universe hasn't changed.

  **Dara:** But the *correlation* exists. And correlations require explanation. Reichenbach's Common Cause Principle. If A and B are correlated, either A causes B, B causes A, or they share a common cause.
  1. A doesn't cause B (spacelike).
  2. B doesn't cause A (spacelike).
  3. Common cause? The source. But the source didn't determine the outcome (Bell).
  So, in a single-world view, you're stuck. In your view, you say "Reichenbach doesn't apply to branching worlds."

  **Evan:** Exactly. Reichenbach assumes a single history.

  **Dara:** So you save locality by breaking probability theory?

  **Evan:** By generalizing it.

  **Dara:** (Sighs, picks up her bag) Here's the rub, Evan. You claim your theory is local because the Hamiltonian is local. But the *phenomenology*—the stuff we actually measure—is the branching. And the branching has to be coordinated to ensure I don't see Bob violating conservation of energy, or seeing the wrong statistics. That coordination looks an awful lot like the pilot wave. The only difference is my wave guides particles, and your wave guides... worlds?

  **Evan:** My wave *is* the world. There's no guidance. There's just evolution.

  **Dara:** And that evolution happens in configuration space. Which is non-local. You can dress it up in "tensor product structure" all you want. If the state of the system at $x$ cannot be described without referencing the state at $y$, it is non-local. In Bohm, it's the particles. In Everett, it's the branches.

  **Evan:** In Everett, the state at $x$ is described by the local density operator. It's perfectly local. The *correlations* are non-separable, but non-separability isn't non-locality. Entanglement is not action-at-a-distance. It's a resource. You use it up when you measure.

  **Dara:** Bell would disagree. He called it "beable." If it's real, and it's non-separable, and it dictates outcomes, it's non-local. You're just comfortable with a holistic universe. I am too, but I want to know *how* the holism manifests. I say forces. You say... fission.

  **Evan:** I say geometry. Hilbert space geometry.

  **Dara:** (At the door) You know, the irony is, we both agree on the math. We agree on the Schrödinger equation. We agree on the experimental predictions.

  **Evan:** We do.

  **Dara:** But I think you're a coward for denying the single outcome, and you think I'm a heretic for denying the symmetry of the branches.

  **Evan:** I think you're a realist who loves determinism too much to let go of the "one true history." And I think I'm a realist who loves the equations too much to add extra variables.

  **Dara:** Bell says one of us has to give up locality.

  **Evan:** Bell says one of us has to give up *single-outcome locality*. I gave up the single outcome. You gave up the locality.

  **Dara:** (Pauses) The question is, which one actually exists?

  **Evan:** (Opens the door) That's the one the experiment can't answer.

  **Dara:** No. It's the one the philosophy can't answer. Goodnight, Evan.

  **Evan:** Goodnight, Dara. See you in the other branch.

  *Dara exits. Evan turns off the lights, leaving the whiteboards in the dark.*
