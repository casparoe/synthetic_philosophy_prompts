answer: |-
  **To:** Graduate Seminar on Conditionals
  **From:** [Instructor Name]
  **Re:** The Lewis-Jackson Alternative: Truth Conditions and Assertability

  Next week, we turn to Dorothy Edgington's forceful defense of the No Truth Value (NTV) view. By now, many of you have concluded that Lewis's triviality results leave us no choice: if Adams' Thesis ($P(A \to C) = P(C|A)$) is correct, and conditionals express propositions, probability theory collapses. Since Adams' Thesis captures the data, conditionals must not express propositions. You have characterized Lewis's resistance to this conclusion as a "failure of nerve"—a reluctance to abandon classical semantics in the face of proof.

  I want to challenge that characterization before you read Edgington. Lewis's refusal to accept NTV was not cowardice; it was a commitment to preserving the logical behavior of conditionals (embedding, negation, modus tollens) which NTV struggles to accommodate without significant cost. The alternative Lewis gestured at, and which Frank Jackson later formalized, is not to deny Adams' Thesis, but to deny that it is a thesis about *truth conditions*.

  The following argument outlines the strongest version of the Truth-Conditional alternative. Its core claim is that the triviality results teach us not that indicatives lack truth values, but that Adams' Thesis is a constraint on *assertability*, not on semantic content.

  ### 1. The Limits of Restricting Adams' Thesis

  A common initial reaction to Lewis's proof is to restrict the scope of Adams' Thesis. Lewis shows that if $P(A \to C) = P(C|A)$ holds for *all* probability functions in a class closed under conditionalization, triviality follows. You might think the solution is to say the equation holds only for an agent's *actual, current* credence function, not for all possible functions or future updates.

  This restriction does not dissolve the problem. The triviality result is not driven primarily by interpersonal disagreement or the requirement that *all* agents agree. It is driven by the interaction between truth conditions and *learning*.

  Suppose you treat "If $A$, $C$" as expressing a proposition $X$ with standard truth conditions. Suppose further that for your current credence function $P$, $P(X) = P(C|A)$. Now consider your future self, who learns $A$ (and nothing else). You update by conditionalization to $P_A$. Since $X$ is a proposition with fixed truth conditions, your new credence in $X$ should simply be $P_A(X) = P(X|A)$.

  However, if Adams' Thesis is a semantic constraint linking the meaning of "if" to conditional probability, it ought to hold for your updated credence as well. So, $P_A(X)$ should equal $P_A(C|A)$. But since you have learned $A$, $P_A(C|A)$ is just $P_A(C)$. This forces $P(X|A) = P(C|A)$.

  Lewis's algebra demonstrates that you cannot maintain the identity between the probability of the proposition $P(A \to C)$ and the conditional probability $P(C|A)$ across even minimal shifts in evidence (specifically, shifts in the probability of $A$) without the proposition $A \to C$ collapsing into $C$ (or $\neg A$).

  Therefore, restricting the thesis to a single agent's static state renders Adams' Thesis a mere psychological accident rather than a semantic principle. If "if" means something stable, the relationship between its meaning and our credences should survive basic learning. The triviality result shows that *no* proposition can track conditional probability across updates. Consequently, we must conclude that the equation $P(A \to C) = P(C|A)$ does not track the probability of a truth condition. It tracks something else.

  ### 2. The Material Conditional and the "False Antecedent" Objection

  If we abandon the idea that Adams' Thesis governs truth conditions, we are free to assign "If $A$, $C$" truth conditions that avoid triviality. The most natural candidate is the material conditional ($A \supset C$). This preserves classical logic, allowing conditionals to embed under negation, disjunction, and other operators without requiring a new logic.

  However, this brings us to the strongest intuition driving the NTV view: **The False Antecedent Problem.**

  On the material account, "If $A$, $C$" is true whenever $A$ is false. The NTV theorist argues this is not merely counter-intuitive; it is a semantic error. Consider: "If the moon is made of cheese, I am a billionaire." The antecedent is false. The material conditional says the sentence is *true*. Your intuition likely screams that the sentence is false, or at least lacks a truth value. The NTV theorist claims that treating this as "true" gets the *facts* wrong, not just our warrant for assertion. They argue that a theory that validates obviously false conditionals as true is empirically inadequate.

  The Lewis-Jackson response meets this head-on by distinguishing **truth conditions** from **assertability conditions**.

  Consider the contrast between "and" and "but." Semantically, "A and B" and "A but B" are equivalent; both are true iff $A$ is true and $B$ is true. Yet, you cannot substitute them *salva congruitate* in all conversational contexts. "He is poor but honest" implies a contrast that "He is poor and honest" does not. We do not conclude from this that "but" lacks truth conditions. We conclude that "but" carries a conventional implicature regarding contrast.

  Jackson argues that the indicative conditional is similar. Its truth conditions are material ($A \supset C$). However, there is a robust convention of assertion governing its use. We are licensed to assert "If $A$, $C$" only if our belief in the material conditional is *robust* with respect to $A$. That is, we must believe $C$ to a high degree *even on the supposition of* $A$. This is precisely what Adams' Thesis measures: $P(C|A)$.

  When you encounter "If the moon is made of cheese, I am a billionaire," your intuition that it is "false" is actually an intuition that it is **unassertable**. You know the moon is not cheese. Therefore, you believe the material conditional is true only because the antecedent is false. But your belief is not robust: if you were to learn the moon *was* cheese, your credence that you are a billionaire would not rise. The conditional probability is low. Thus, the sentence is unassertable.

  The NTV theorist mistakes the *inappropriateness of assertion* for *falsity*. Why should we prefer this explanation over NTV? Because NTV pays a steep price in logic. If conditionals lack truth values, how do we handle:
  1.  **Negation:** What does "It is not the case that if $A$, $C$" mean?
  2.  **Embedding:** What is the truth condition of "If if $A$, $B$, then $C$"?
  3.  **Validity:** How do we define validity (preservation of truth) if the premises have no truth values?

  Edgington and other NTV theorists must construct complex surrogate accounts for these logical features. The Truth-Conditional theorist accepts the "paradox" of the material conditional (that false antecedents yield true conditionals) as the cost of preserving a unified, classical logic for natural language. The intuition of falsity in false-antecedent cases is explained away as a pragmatic phenomenon, much like the intuition that "Some S are P" implies "Not all S are P."

  ### 3. The Moral of Triviality

  Lewis's "failure of nerve" was actually a theoretical calculation. He recognized that triviality proves only that **Adams' Thesis cannot be a thesis about truth conditions.** It does not prove that conditionals lack truth conditions.

  By reinterpreting Adams' Thesis as a rule of assertability (specifically, a requirement of robustness), we achieve the following:
  1.  **We save the data:** $P(A \to C)$ still equals $P(C|A)$, because assertability tracks conditional probability.
  2.  **We save logic:** Conditionals express propositions (material ones), allowing for negation, embedding, and standard validity.
  3.  **We explain the intuition:** The feeling that false-antecedent conditionals are "wrong" is explained by the violation of assertability conditions, not truth conditions.

  When you read Edgington next week, do not ask only whether NTV captures the intuition that "If $A$, $C$" is not equivalent to "Not-$A$ or $C$." Ask also whether NTV can account for the logical behavior of conditionals as elegantly as the Truth-Conditional view. Lewis held that the cost of "vacuous truth" is lower than the cost of "logical fragmentation." That is not cowardice; it is a different weighting of theoretical virtues.

  Prepare to evaluate whether Edgington's pragmatics can bear the logical weight that Jackson's semantics carries for free.
