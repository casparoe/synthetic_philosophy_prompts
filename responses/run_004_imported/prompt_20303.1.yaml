answer: |-
  Here are 10 interview questions designed to move past the basics and dig into the philosophical and decision-theoretic weeds. I've structured them to flow logically from the physics to the identity issues, then to the ethics, and finally to the personal implications.

  Each question includes a "If he dodges..." follow-up to help you keep him pinned to the specific point.

  ### 1. The Born Rule & Measure Problem
  **Question:** "Most physicists agree that in Many-Worlds, branches have different 'weights' or amplitudes squared (the Born Rule). If I enter a quantum lottery where 99.9% of the amplitude results in me dying and only 0.1% results in me winning, you're saying I should feel almost certain I'll win. But if 'measure' determines how much of the multiverse contains a version of me, why should my *subjective anticipation* ignore the fact that the 'dead me' branches contain almost all of the reality?"

  *   **If he dodges (e.g., "Measure isn't probability, existence is binary"):**
      *   **Follow-up:** "But we use the Born Rule to predict every other quantum experiment successfully. Why does the rule that governs all physical predictions suddenly stop governing *self-locating* predictions the moment a gun is involved?"

  ### 2. Personal Identity & Parfit
  **Question:** "Your argument seems to rely heavily on a specific view of personal identity—specifically that 'you' are just a pattern of information that continues wherever it exists. This sounds a lot like Derek Parfit's 'fission cases' in philosophy, where survival is a matter of degree, not yes/no. Are you actually making a physics claim, or have you just imported a controversial philosophical stance on identity and dressed it up as quantum mechanics?"

  *   **If he dodges (e.g., "It's a direct consequence of the wavefunction"):**
      *   **Follow-up:** "If it's just the wavefunction, then in a fission case where 'you' split into two identical copies, both survive. But in Russian Roulette, one copy ceases. Why does the logic of fission apply to the survivor but not the grief of the terminated copy?"

  ### 3. Quality of Survival (The "Mangled" World)
  **Question:** "Quantum Immortality guarantees a branch where you survive, but it doesn't guarantee a branch where you survive *unharmed*. If I play this game enough times, won't I eventually find myself in a branch where I'm alive but severely mangled, terminally ill, or just incredibly old and suffering? Isn't 'never experiencing death' very different from 'experiencing a long life worth living'?"

  *   **If he dodges (e.g., "The probability of injury is still low in the surviving branches"):**
      *   **Follow-up:** "But over enough trials, the 'low probability' of a mangled survival becomes the *only* survival option left. Are you essentially betting that you'll end up as an immortal tortoise rather than a dead hare?"

  ### 4. The "Grief" Externality
  **Question:** "Let's talk about the branches where you lose. In those worlds, your friends and family still exist and they still experience your very real, very permanent death. Does your subjective certainty of survival in *one* branch justify the objective grief you cause in the *majority* of branches? Is it ethical to treat other versions of your loved ones as expendable?"

  *   **If he dodges (e.g., "Their copies survive in other branches too"):**
      *   **Follow-up:** "Sure, but from the perspective of the specific loved ones in the room with you when you pull the trigger, you are just dead. Why does your internal subjective continuity outweigh their external objective loss?"

  ### 5. Decision Theory & Action
  **Question:** "There are plenty of physicists who believe in Many-Worlds but think playing Quantum Russian Roulette is insane. They argue that rational decision theory should still track branch weights. Why do you think *believing* MWI compels you to *act* differently than a Copenhagen interpretation believer, when the observable outcomes look the same?"

  *   **If he dodges (e.g., "They are just irrational or risk-averse"):**
      *   **Follow-up:** "If they are risk-averse, doesn't that mean they value the 'measure' of their existence? If you don't value measure, why do you care about the million dollars? That only exists in a fraction of branches too."

  ### 6. Falsifiability & Evidence
  **Question:** "The tricky thing about Quantum Immortality is that it's empirically private. If you're right, you can never share your evidence with us because we'd be in the branches where you died. Doesn't this make the belief unfalsifiable for everyone except you? How is this different from a faith-based belief?"

  *   **If he dodges (e.g., "I'll know it's true when I survive"):**
      *   **Follow-up:** "But a gambler who gets lucky also thinks they have a system. If you can't distinguish between 'I am immortal' and 'I got incredibly lucky this time' without dying, why should we treat your conclusion as scientific?"

  ### 7. Continuity of Consciousness
  **Question:** "In the branches where you survive a near-death event, there's usually a moment of unconsciousness or trauma. Does your theory require continuous consciousness? If the 'you' that wakes up is a new continuity that just has the memories of the one who died, isn't that just suicide with a clone left behind?"

  *   **If he dodges (e.g., "Consciousness is a continuous thread in the surviving branch"):**
      *   **Follow-up:** "But the thread was broken by the bullet/trauma. If I teleport you and destroy the original, is that survival? If you say yes, then Russian Roulette is just a violent teleporter."

  ### 8. Cumulative Risk & The "Tortoise" Scenario
  **Question:** "If you keep playing this game over decades, the surviving branches might become increasingly bizarre to keep you alive. You might end up in a branch where physics is slightly different, or you're the only human left, just to satisfy the condition of 'you existing.' Are you prepared for the possibility that immortality looks like isolation?"

  *   **If he dodges (e.g., "That's speculative science fiction"):**
      *   **Follow-up:** "But it follows from your logic. If the only branch where you exist requires a one-in-a-trillion quantum fluctuation to save you, aren't you betting on a world that looks nothing like this one?"

  ### 9. Universalizability
  **Question:** "Kant asked if we should act on rules that everyone could follow. If everyone who believed Many-Worlds started playing Quantum Russian Roulette, the multiverse would be filled with grieving families in dead branches and a tiny sliver of confused survivors. Do you think this is a principle everyone should adopt, or is it a special exception just for you?"

  *   **If he dodges (e.g., "Not everyone is rational enough to understand it"):**
      *   **Follow-up:** "So it's an elite rationality? If it's truly rational, shouldn't you want everyone to do it to maximize their survival? If not, what makes it rational for you but harmful for others?"

  ### 10. Changing Your Mind
  **Question:** "Finally, what would actually change your mind? Is there a physical experiment or a philosophical argument that could convince you that branch measure *does* matter for survival? Or is this position locked in once you accept Many-Worlds?"

  *   **If he dodges (e.g., "I'd have to see the math change"):**
      *   **Follow-up:** "So if a derivation came out tomorrow showing that subjective probability *must* track amplitude to avoid Dutch Book arguments, would you put the gun down? Or is the commitment deeper than the math?"

  ### Host Tips for the Podcast:
  *   **Don't let him monologue:** He's internet-known, so he probably has a "script" he's given before. Use the follow-ups to interrupt the script.
  *   **The "50 Listens" Advantage:** Remind him early on that because the audience is small and niche, you can skip the "What is a wavefunction?" intro and dive straight into the hard stuff.
  *   **Tone Check:** Keep it curious, not hostile. You want to expose the tension in his ideas, not just dunk on him. The goal is to make the listeners think, not to prove him wrong definitively (which is hard to do in 30 mins).
