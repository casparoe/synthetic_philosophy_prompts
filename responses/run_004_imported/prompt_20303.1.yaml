prompt: |-
  So my school's physics club runs this tiny podcast (like 50 listens an episode lol), and our guest next episode is this guy who's kind of internet-known for defending quantum immortality -- not the 'huh, weird thought experiment' version, but the actual claim that if you truly believed many-worlds it'd be irrational NOT to play quantum russian roulette for a million bucks, since 'you' only ever wake up in the branch where your alive and rich. I don't want the episode to just be him re-explaining the gun-and-geiger-counter setup again, so can you draft 8-10 interview questions that push past that -- at least one on the born-rule/branch-weight problem (if the surviving branches carry almost none of the amplitude, why should that not matter for how scared you should be beforehand), one on whether the whole argument secretly depends on taking a side in the Parfit fission-case debate about what matters in survival rather than just following from the physics, and one on the difference between 'never experiencing dying' and 'just surviving progressively more mangled or old,' since those seem like very different things to be reassured about. For each one throw in a quick follow-up keyed to whatever answer he'd probably give so I'm not stuck if he just dodges.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** High school physics club podcast (small audience, ~50 listens).
      *   **Guest:** Internet-known figure defending "Quantum Immortality" (QI) in a strong, action-guiding sense (i.e., advocating for Quantum Russian Roulette).
      *   **Goal:** 8-10 interview questions that move *beyond* the basic "gun + Geiger counter" explanation.
      *   **Specific Requirements:**
          *   At least one question on the Born Rule/Branch Weight problem.
          *   At least one question on Parfit/fission cases (personal identity).
          *   At least one question on the quality of survival (mangled/old vs. dead).
          *   Each question needs a tailored follow-up in case the guest dodges.
      *   **Tone:** Engaging, critical but respectful, suitable for a physics club (smart but accessible).

  2.  **Deconstruct the Guest's Position:**
      *   The guest believes in Many-Worlds Interpretation (MWI).
      *   The guest believes subjective probability tracks *existence* of a branch, not *measure* (amplitude squared).
      *   The guest believes "you" are the pattern that continues, so as long as one branch continues, "you" continue.
      *   The guest is willing to bet life on this (Quantum Russian Roulette).

  3.  **Brainstorming Categories/Angles:**
      *   *The Born Rule/Measure Problem:* Why does amplitude matter if existence is binary?
      *   *Personal Identity:* Is this physics or philosophy? (Parfit).
      *   *Quality of Life:* Surviving vs. Thriving. Aging, injury, dementia.
      *   *Social/External Cost:* What about the grieving friends in the dead branches?
      *   *Decision Theory:* Causal Decision Theory vs. Evidential vs. "Branch Counting."
      *   *Falsifiability:* Can this ever be tested without dying?
      *   *The "Sleeping Beauty" Problem:* Analogies to self-locating uncertainty.
      *   *Ethical Implications:* If everyone did this, what happens to the multiverse?

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Born Rule):* Need to hit the "measure" issue. If 99.9% of amplitude dies, why feel safe?
          *   *Draft:* Why doesn't the Born rule scare you?
          *   *Refinement:* Make it about *caring*. If measure correlates with how much "stuff" is there, why ignore it?
          *   *Follow-up:* If he says "measure isn't probability," ask why we use it for everything else.

      *   *Q2 (Parfit/Identity):* Is this physics or metaphysics?
          *   *Draft:* Is this just Parfit's fission?
          *   *Refinement:* Frame it as "Does MWI actually force this conclusion, or did you import a specific theory of identity?"
          *   *Follow-up:* If he says "It's just physics," ask about the teleportation paradox.

      *   *Q3 (Quality of Survival):* Aging/Mangling.
          *   *Draft:* What if you get old?
          *   *Refinement:* Focus on the "mangled worlds" or just degradation. You don't die, but do you suffer?
          *   *Follow-up:* If he says "Probability of injury is low," ask about the cumulative effect over centuries.

      *   *Q4 (Externalities):* Grieving friends.
          *   *Draft:* What about your mom?
          *   *Refinement:* In the branches where you die, real people suffer. Does your subjective survival justify their objective grief?
          *   *Follow-up:* If he says "Their copies survive in other branches," point out *their* perspective.

      *   *Q5 (Decision Theory):* Why act on it?
          *   *Draft:* Why play the game?
          *   *Refinement:* Distinguish between *believing* MWI and *betting* on it. Most MWI believers don't play roulette. Why the difference?
          *   *Follow-up:* Ask if he thinks they are irrational or just risk-averse.

      *   *Q6 (Falsifiability/Evidence):* How do we know?
          *   *Draft:* Can you prove it?
          *   *Refinement:* You can't share your evidence (because you'd be dead to us). Is this unfalsifiable faith?
          *   *Follow-up:* If he says "I'll know," ask why we should listen to someone we can't verify.

      *   *Q7 (The "You" Problem):* Continuity of consciousness.
          *   *Draft:* Are you the same person?
          *   *Refinement:* If the branch splits, which one is the "original"? Does the one who dies experience nothingness?
          *   *Follow-up:* Push on the subjective experience of the branch that terminates.

      *   *Q8 (Cumulative Risk):* Long term.
          *   *Draft:* What happens in 100 years?
          *   *Refinement:* Quantum Zeno effect or just statistical inevitability of mangled survival.
          *   *Follow-up:* Ask about the "immortal but trapped" scenario.

      *   *Q9 (Ethics/Altruism):*
          *   *Draft:* Is it selfish?
          *   *Refinement:* If this logic holds, should we encourage everyone to try it?
          *   *Follow-up:* If no, why is it good for you but bad for others?

      *   *Q10 (Closing/Practical):*
          *   *Draft:* What's next?
          *   *Refinement:* What would change your mind?
          *   *Follow-up:* Specific physical prediction vs. philosophical shift.

  5.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Born Rule included? Yes (Q1). Parfit included? Yes (Q2). Quality of Survival included? Yes (Q3). Follow-ups included? Yes.
      *   Tone check: Needs to sound like a smart high schooler/club host, not a tenured professor, but still rigorous.
      *   *Self-Correction on Q1:* Make sure the distinction between "branch count" and "amplitude measure" is clear.
      *   *Self-Correction on Q2:* Ensure Parfit is explained briefly in context so the audience gets it.
      *   *Self-Correction on Follow-ups:* Make them punchy. If he dodges, the follow-up should corner him gently.

  6.  **Final Polish:** Organize logically (Physics -> Identity -> Ethics -> Personal). Add intro/outro advice for the host. (Wait, just the questions and follow-ups requested).

      *   *Wait, one check:* The prompt asks for 8-10 questions. I have brainstormed 10. I will select the strongest 8-10 and ensure the specific required topics are prominent.
