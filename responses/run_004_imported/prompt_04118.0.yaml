      T sighed. "It's not ad hoc; it's the price of preserving the logic of identity. Identity is absolute. If I accept your non-transitivity, I lose S4. 'Possibly possibly p' no longer entails 'Possibly p.' That's a huge logical cost. I'd rather posit a primitive essence than invalidate a standard modal axiom. You say my essence is mysterious, but your counterpart relation is just as primitive once you ask why *this* similarity matters for *de re* modality. Why is origin essential for you? Because you say so. For me, it's because it's Adam. The logic of identity demands transitivity. If you break that, you break the machinery of quantified modal logic."

      C nodded slowly. "I concede the S4 point. Lewis accepts that S4 can fail for de re statements because the access relation between counterparts shifts. In my system, it can be possible that possibly p, without it being possible that p, because the chain of counterparts breaks. But is losing S4 worse than positing invisible metaphysical hooks? You say identity is absolute, but your application of it across worlds relies on intuition pumps that shift with context. My theory explains why: context shifts the weighting of the counterpart relation. Your theory says the world changes, or our access to the essence does. It seems you're buying logical simplicity at the price of semantic mystery. You have the logic, but I have the semantics."

