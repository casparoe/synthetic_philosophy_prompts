answer: |-
  The rain blurred the lights of the parking lot into smeared nebulas against the conference room window. It was past two in the morning. On the table, a pot of coffee had long since turned bitter, and the file for Patient 4092 lay open like a wound.

  Arthur Vance, the committee chair, rubbed his temples. To his left sat Dr. Lena Kovic, the attending neurologist. To his right was Samuel Thorne, the hospital's legal counsel and community representative. They were the Ethics Committee for the night shift, bound by Policy 7.4.

  Vance tapped the document. "Let's review the standing order. We authorize withdrawal of life support only if two conditions are met. One: The advance directive is legally applicable to this specific clinical state. Two: There is no reasonable prospect of meaningful neurological recovery. Both must be true. If either is false, we maintain treatment."

  "Understood," Thorne said, loosening his tie. He was a man of texts, of precise definitions. "And we are agreed this is a conjunction? Not a disjunction?"

  "And," Vance confirmed. "Condition A and Condition B."

  They turned to the file. Mr. Gable, fifty-four, had suffered a massive brainstem stroke. He was ventilator-dependent. He had signed a living will five years prior, stating he did not wish to be kept alive if he could not "recognize loved ones or communicate basic needs."

  "Condition A," Vance began. "Does the directive apply? The language specifies 'inability to communicate.' Mr. Gable cannot blink consistently. He cannot squeeze a hand."

  Thorne nodded slowly. "The text is specific enough. 'Communicate basic needs.' He cannot do that. The legal threshold is met. I vote yes on the directive's applicability."

  Kovic looked down at her hands. She had spent six hours reviewing the scans. "I disagree. The directive mentions 'recognizing loved ones.' His daughter says he tracked her movement yesterday. It's reflexive, I'm sure of it, but the directive requires *recognition*. That's subjective. Legally, it's murky. I vote no. The directive does not clearly apply."

  Vance paused. He looked at his own notes. He had spoken to the daughter, too. He had read the will. "I believe the intent is clear, even if the execution is messy. The spirit of the law is to prevent prolonged vegetative existence. I vote yes. The directive applies."

  Vance tallied the marks. "On Condition A: Two yes, one no. The committee finds the directive applicable."

  Thorne leaned back, satisfied. "So, half the battle is won. Now, Condition B. Prospect of recovery."

  Kovic straightened up. This was her territory. "I've been clear from the start. The brainstem damage is extensive. There is no pathway for signal transmission to the cortex. He will not wake up. He will not breathe on his own. Medically, there is no reasonable prospect. I vote yes. No recovery."

  Thorne frowned. He wasn't a doctor, but he had seen miracles, or at least, statistics that defied expectations. "Reasonable prospect is a high bar, but 'no' prospect is absolute. We've had cases of late arousal. Three months out. Mr. Gable is only at three weeks. To say there is *no* prospect feels... premature. I vote no. There is a prospect, however slim."

  Vance looked at the MRI scans spread across the table. The black voids where tissue should be. He thought of the resources, the bed space, the dignity of the man in Room 304. "I agree with Dr. Kovic. The damage is catastrophic. I vote yes. No reasonable prospect."

  Vance drew a line under the second count. "On Condition B: Two yes, one no. The committee finds no prospect of recovery."

  He sat back, the logic of Policy 7.4 clicking into place in his mind. "Okay. We have established the premises. Condition A is met. Condition B is met. Under Policy 7.4, if both conditions hold, the verdict is mandatory. We must authorize withdrawal."

  He reached for the authorization form.

  "Wait," Thorne said.

  Vance paused, pen hovering. "The premises are established by majority vote. The policy dictates the conclusion."

  "But do we agree on the conclusion?" Thorne asked. He looked at Kovic. "Dr. Kovic, based on your judgment—the directive is shaky, but the prognosis is hopeless. What is your final verdict on withdrawal?"

  Kovic hesitated. "If the directive isn't clear, I can't pull the plug. I'm protecting the patient from legal ambiguity. I vote to continue treatment."

  Thorne turned to Vance. "And you, Chair? You said the directive applies and the prognosis is hopeless."

  "I did," Vance said. "So I vote to withdraw."

  "And I," Thorne said softly, "believe the directive applies, but the prognosis isn't hopeless. So I vote to continue treatment."

  Vance stopped. He looked at the tally sheet.

  "Let me understand this," Kovic said, her voice tight. "We just voted on the facts. Majority said the directive is valid. Majority said the prognosis is hopeless. By the rules, that means we withdraw."

  "Correct," Vance said.

  "But if we vote on the action itself," Thorne interjected, pointing to the verdict column, "Two of us vote to continue. Only one votes to withdraw."

  The room went silent, save for the hum of the HVAC system. The rain tapped harder against the glass.

  Vance looked at the two columns of numbers.
  *Premises:* Yes, Yes. (Majority for both).
  *Conclusion:* No. (Majority against).

  "If we follow the premise-based procedure," Vance said, his voice sounding strange to his own ears, "we honor the policy's logic. We respect the collective judgment on the facts. We withdraw support."

  "And if we follow the conclusion-based procedure," Thorne countered, "we honor the collective judgment on the outcome. We respect the majority's will on the actual decision. We continue treatment."

  Kovic rubbed her eyes. "This feels wrong. Either way, we're overriding someone. If we withdraw, we're acting against the majority's direct vote. If we continue, we're ignoring the majority's finding on the medical and legal facts."

  "The policy doesn't specify *how* we aggregate our judgments," Vance admitted. "It just says the conditions must hold."

  "But 'hold' for whom?" Kovic asked. "For the committee as a collective entity? Or for the majority of individuals?"

  Thorne closed the file. "If we withdraw, we are saying the committee believes the facts are true, even if the committee doesn't believe the result is right. If we continue, we are saying the committee believes the result is wrong, even if the committee agrees the facts are true."

  Vance looked at the authorization form. It required a signature. It required a date. It required a decision that would result in a man living or dying.

  He thought about the graduate students he sometimes mentored, the ones who talked about coherence and rationality in groups. He had always told them that institutions were designed to resolve these tensions. That was the point of a committee. To synthesize.

  But the synthesis had fractured. The logic of the parts did not sum to the logic of the whole.

  "We could flip a coin," Kovic suggested, half-joking, though her eyes were tired.

  "We could defer to the family," Thorne offered.

  "The policy puts it on us," Vance said. "Not them."

  He picked up the pen. He looked at Thorne, who was staring at the table, steadfast in his vote to continue. He looked at Kovic, who was staring at the scans, steadfast in her vote to continue. And he looked at the logic of the premises, which he had tallied himself, demanding withdrawal.

  If he signed, he validated the premise-based approach. He privileged logical consistency over the direct headcount.
  If he put the pen down, he validated the conclusion-based approach. He privileged the headcount over logical consistency.

  Both paths were defensible. Both paths betrayed a different version of what the committee was for. Was it a truth-seeking body, aggregating facts to find the necessary outcome? Or was it a democratic body, aggregating wills to find the acceptable outcome?

  The rain streaked the window, obscuring the lights outside until the world beyond the glass was nothing but dark, blurred shapes.

  Vance capped the pen. He uncapped it. He placed it on the table, exactly in the center, between the tally sheet and the authorization form.

  "We need to record the minutes," Vance said quietly.

  "How?" Kovic asked.

  Vance looked at the two conflicting majorities. "We record that the premises were affirmed. We record that the verdict was denied."

  "And the patient?" Thorne asked.

  Vance looked at the file, then at the window, then back to his colleagues. The clock on the wall ticked, measuring out seconds that belonged to a man who could not count them.

  "I don't know," Vance said. "I truly don't know."

  He left the pen on the table. Outside, the storm broke, washing the glass clean, leaving the room inside starkly, uncomfortably lit.
