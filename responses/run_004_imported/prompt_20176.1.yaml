prompt: |-
  I teach a graduate seminar on social choice theory and collective decision-making, and this term I would like to pair the technical readings on judgment aggregation with a piece of short fiction. Please write a short story, roughly 1,000 to 1,500 words, that dramatizes the discursive dilemma (sometimes called the doctrinal paradox in the legal literature): a three-member hospital ethics committee must rule on whether to authorize withdrawal of a patient's life support, under a standing policy that permits withdrawal only if two independent conditions both hold (for instance, that the advance directive clearly applies to the patient's present state, and that physicians agree there is no reasonable prospect of meaningful recovery). Construct the members' individual judgments on those two conditions so that the committee's decision would come out one way under a premise-based procedure (vote on each condition separately, then apply the policy) and the opposite way under a conclusion-based procedure (vote directly on the verdict). The logical structure should be legible through plot and dialogue rather than through a character pausing to lecture on judgment-aggregation theory, and the story should leave open, rather than resolve, the question of which procedure the committee ought to have trusted.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Topic:** Judgment Aggregation / Discursive Dilemma (Doctrinal Paradox).
      *   **Context:** Graduate seminar on social choice theory (needs to be intellectually rigorous but presented as fiction).
      *   **Length:** 1,000 - 1,500 words.
      *   **Plot:** A three-member hospital ethics committee deciding on withdrawing life support.
      *   **Policy:** Withdrawal allowed *only if* Condition A (Advance Directive applies) AND Condition B (No prospect of recovery) are both true. ($P \land Q \rightarrow R$).
      *   **Conflict:**
          *   Premise-based voting (vote on A and B separately): Majority says Yes to A, Majority says Yes to B $\rightarrow$ Verdict: Withdraw.
          *   Conclusion-based voting (vote on R directly): Majority says No to R $\rightarrow$ Verdict: Do not withdraw.
      *   **Style:** Dramatized through plot/dialogue, not lecturing.
      *   **Ending:** Ambiguous/Open regarding which procedure is correct.

  2.  **Determine the Voting Matrix:**
      *   To get the paradox, I need specific individual judgments.
      *   Let $P$ = Advance Directive Applies.
      *   Let $Q$ = No Prospect of Recovery.
      *   Let $R$ = Withdraw Life Support ($P \land Q \rightarrow R$).
      *   *Member 1:* Yes on $P$, Yes on $Q$ $\rightarrow$ Yes on $R$.
      *   *Member 2:* Yes on $P$, No on $Q$ $\rightarrow$ No on $R$.
      *   *Member 3:* No on $P$, Yes on $Q$ $\rightarrow$ No on $R$.
      *   *Majority on Premises:* $P$ (2-1 Yes), $Q$ (2-1 Yes). Result: Withdraw.
      *   *Majority on Conclusion:* $R$ (1-2 No). Result: Continue Treatment.
      *   *Perfect.* This creates the tension.

  3.  **Character Development:**
      *   Need three distinct voices/perspectives to justify their votes naturally.
      *   *Dr. Aris Thorne (Chair):* Perhaps the legalist/proceduralist. Focused on the rules.
      *   *Elena Rosales (Nurse Ethicist):* Focused on the patient's humanity/suffering. Maybe leans toward withdrawal based on $Q$ (suffering/no recovery) but unsure on $P$.
      *   *Rabbi David Cohen (Community Rep/Chaplain):* Focused on sanctity of life/textual interpretation. Maybe leans toward $P$ (directive exists) but unsure on $Q$ (miracles).
      *   *Wait, let's adjust to fit the matrix:*
