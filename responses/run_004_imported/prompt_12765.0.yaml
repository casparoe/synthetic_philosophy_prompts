answer: |-
  This is a spectacular catch. You have put your finger on the exact fault line where Newton's empiricism crashes into his eschatology. You are absolutely right: the methodological scalpel Newton used to dissect the Johannine Comma (internal inconsistency, linguistic anachronism, motive for interpolation) is identical to the one modern critical scholars used to dissect Daniel.

  But if you sit Newton down in his rooms at Cambridge in 1695, lay out the Maccabean hypothesis, and ask him to apply his *Two Notable Corruptions* logic to the Book of Daniel, he will not concede. He cannot concede. And to understand why, we have to look at how he categorized "truth" within his theological system.

  Here is the reconstruction of Newton's defense, based on his writings, his letters, and the architecture of his belief system.

  ### 1. The Distinction Between "Corruption" and "Foundation"
  Newton would immediately reject the premise that the two cases are equivalent. To Newton, the Johannine Comma and the Book of Daniel occupy opposite ends of the theological weight class.

  *   **The Comma:** This was a *corruption* of the primitive truth. Removing it restored the original, pure Arian/Unitarian Christianity of the early Church. Criticism here was restorative. It cleared away the debris of Athanasian plot-making to reveal the true face of Christ.
  *   **Daniel:** This is not a debris layer; it is a load-bearing pillar. For Newton, prophecy is the "proof of Christianity" against atheism and deism. In *Observations upon the Prophecies*, he argues that the precise fulfillment of Daniel's visions is the empirical evidence that God governs history.

  **Newton's Counter-Argument:** "To excise the Comma is to cure a disease in the text. To date Daniel to the Maccabees is to declare the patient dead. If Daniel is not predictive, but merely history dressed as prophecy (*vaticinium ex eventu*), then the primary evidence of Divine Providence is nullified. I used criticism to save the Faith from the Trinity; I cannot use criticism to save the Faith from itself."

  ### 2. The Argument from "Impossible Accuracy"
  You would present Newton with the historical argument: Daniel is too accurate about the rise of Greece and the persecution of Antiochus IV to have been written in the 6th century BC.

  Newton would flip this. He would argue that the accuracy *is* the proof of the early date.

  **Newton's Counter-Argument:** "You argue that the text fits the history of Antiochus too well to be coincidence. I agree. It is not coincidence; it is Revelation. The very precision you cite as evidence of forgery is my evidence of inspiration. No human historian in the time of the Maccabees could have constructed a narrative that so perfectly aligns with the succession of Empires (Babylon, Persia, Greece, Rome) unless guided by the Spirit. To say a Jew in 165 BC wrote this is to say he possessed a knowledge of the future that belongs only to God. If you grant the accuracy, you must grant the supernatural. If you grant the supernatural, you must grant the antiquity."

  ### 3. The Linguistic Defense (The Greek Loanwords)
  A key piece of evidence for the Maccabean date is the presence of Greek loanwords (specifically names of musical instruments in Daniel 3). Newton was a student of ancient history and languages. He wouldn't ignore this.

  **Newton's Counter-Argument:** "You point to Greek names in the Chaldean text as proof of Hellenistic influence. But trade existed before Alexander. The Greeks were known to the Persians; the Persians were known to the Jews. That a few technical terms for instruments migrated eastward prior to the Exile is not impossible. To build a chronology on the migration of nouns is to build on sand. I have seen how scribes alter texts (as with the Comma), but I have also seen how languages borrow. I will not let a few loanwords overturn the consensus of the Synagogue and the Early Church, which both received Daniel as ancient."

  ### 4. The Teleological Argument (The "Little Horn")
  This is Newton's strongest card. The Maccabean hypothesis posits that the prophecies "stop working" or become vague after Antiochus IV Epiphanes dies. Newton argues the prophecies *continue* well into the Christian era.

  Newton identifies the "Little Horn" of Daniel 7 not just as Antiochus, but primarily as the Papacy and the Roman Church. He sees the 1260 years (time, times, and half a time) stretching from the rise of Papal power (roughly 6th-8th century) to his own future (2060).

  **Newton's Counter-Argument:** "Your Maccabean theory fails because it is too small. It truncates the vision. Daniel does not stop at Antiochus. The prophecy of the Stone cut without hands, the Kingdom that shall never be destroyed, this is the Kingdom of Christ. The 'Little Horn' that speaks great words against the Most High is the Apostasy of the Church of Rome. If Daniel were written in 165 BC, how could the author have foreseen the rise of the Bishop of Rome? The scope of the prophecy encompasses the whole of the Gentile age. To date it to the Maccabees is to blind yourself to the second half of the vision."

  ### 5. The Epistemological Hard Stop
  Here is where the tension you identified becomes a wall. Newton operates on a principle of "Consent of Antiquity." He believes that the true faith was given to Noah, corrupted by the nations, restored to Abraham, corrupted again by the Jews/Papists, and is now being restored by men like himself.

  For Newton, the Canon is fixed. The *text* can be corrupted (like the Comma), but the *books* themselves are providentially preserved.

  **Newton's Counter-Argument:** "You ask me to apply the logic of the Comma to the Canon. But there is a boundary. We may prune the branches to save the tree, but we may not saw through the trunk. If I admit Daniel is a pious fraud composed to encourage the Maccabees, I admit that God allows lies to serve as the foundation of Truth. I admit that the Church has been built on a forgery. This leads to the skepticism of Hobbes and Spinoza, which I reject. My method is to find the harmony between Nature and Scripture. If Scripture is historically false in its claims of prophecy, the harmony is broken. I must therefore assume the text is sound, and your interpretation of the history is flawed."

  ### The Verdict: Why He Holds the Line
  Newton would not be swayed, not because he lacks the intellectual capacity to follow the philological argument (he clearly has it), but because the cost of concession is total systemic collapse.

  1.  **Apologetic Necessity:** If Daniel is not predictive, Christianity loses its empirical edge over Deism. Newton cannot afford to lose that edge.
  2.  **Chronological Necessity:** If Daniel is short (Maccabean), the 1260-year clock doesn't start when Newton thinks it starts, and the 2060 date evaporates. Newton's entire life's work in theology is geared toward calculating the "End of Days." To deny Daniel is to deny his own life's purpose.
  3.  **Theological Consistency:** Newton believes he is restoring *primitive* truth. Admitting Daniel is a forgery makes him a deconstructive critic, not a restorer. He sees himself as a priest of Nature and Scripture, uncovering laws, not questioning the validity of the data source.

  **The Irony:**
  You are right that he is using a double standard. But in his mind, it is a *hierarchical* standard.
  *   **Level 1 (Doctrine):** Use criticism to remove later corruptions (Trinity/Comma) to find the original Truth.
  *   **Level 2 (Prophecy):** Defend the text against criticism because the Truth *depends* on the text being supernatural.

  He would likely look at you, stir his pot of mercury or ink, and say: *"The critics say Daniel is history disguised as prophecy. I say it is Prophecy disguised as history, so that the wicked might read it and not understand, but the wise might shine like the brightness of the firmament. I have calculated the times. The math holds. Therefore, the book must be true."*

  He would choose the math over the philology, because for Newton, the math was the language of God, and the philology was just the chatter of men.
