      *   *The "Dissolving":* The obstacle dissolves because the condition for Löb's theorem ($\vdash \Box \phi \to \phi$) is no longer met for the *system as a whole*. $T$ proves $\Box_{T'} \phi \to \phi$. This is not $\Box_T \phi \to \phi$. The subscript matters.

