answer: |-
  **Setting:** *A quiet corner of the conference hall, away from the main crowd. On a small table between them sit two urns. Urn K contains exactly 50 red balls and 50 black balls. Urn U contains 100 balls, red and black, in an unknown proportion. Both theorists hold coffee cups.*

  **Bob (Bayesian):** Look at them. It's the classic setup. Urn K is risk. Urn U is ambiguity. And I know what you're going to say: that you'd pay more to bet on Red in K than on Red in U.

  **Max (MEU):** You know me well. And I'd pay more to bet on Black in K than on Black in U, too. Which, as we've argued for decades, violates Savage's Sure Thing Principle if you assume I'm maximizing expected utility with a single prior.

  **Bob:** But that's exactly where Raiffa had you cornered in '61. You don't have to stick to a pure bet on Red or a pure bet on Black in Urn U. Suppose, before you place your bet, you flip a fair coin. If it's Heads, you bet on Red in Urn U. If it's Tails, you bet on Black in Urn U.

  **Max:** I'm listening.

  **Bob:** Think about the payoff. You win if (Heads and Red) or (Tails and Black). Since the coin is fair, that's a 50% chance of Heads and 50% chance of Tails. Inside Urn U, whatever the composition, the probability of Red plus the probability of Black is 1. So, mathematically, your total probability of winning is $0.5 \times P(Red) + 0.5 \times P(Black) = 0.5 \times (P(Red) + P(Black)) = 0.5$.

  **Max:** Objectively, yes.

  **Bob:** Exactly. Objectively, that randomized strategy yields a 50-50 payoff distribution. It is probabilistically identical to betting on Red in Urn K. So, if you are willing to pay a premium to avoid Urn U in favor of Urn K, you are essentially paying to avoid something that you can transform into Urn K just by flipping a coin. The ambiguity isn't in the world; it's in your refusal to use a randomization device. Once you hedge with the coin, the ambiguity evaporates. Your preferences should collapse back to standard probabilistic reasoning.

  **Max:** That's Raiffa's reduction argument. It's elegant, Bob, but it assumes that I evaluate acts solely by their reduced payoff distributions. I don't.

  **Bob:** You have to, if you want to avoid money pumps.

  **Max:** Not necessarily. My preference isn't about the final distribution alone; it's about the *act* itself—the mapping from states to outcomes. In Gilboa and Schmeidler's framework, we have the Uncertainty Aversion axiom. It states that if I am indifferent between two acts—say, betting on Red in U and betting on Black in U—I should *strictly prefer* a mixture of those two acts to either one alone.

  **Bob:** But the mixture *is* the coin flip!

  **Max:** Precisely. And I *do* prefer the mixture. But I don't prefer it because I've secretly assigned a probability of 0.5 to Red. I prefer it because the mixture hedges against the ambiguity. The coin flip correlates my choice with the complementarity of the colors. In the pure bet on Red, I'm exposed to the worst-case prior. In the pure bet on Black, I'm exposed to the worst-case prior. In the mixture, the worst-case prior for Red is the best-case prior for Black, and vice versa. The hedge neutralizes the ambiguity *within the evaluation of the act*, even if the objective risk remains.

  **Bob:** So you admit the coin flip makes it equivalent to the known urn in terms of risk, but you claim you still value the *structure* of the hedge?

  **Max:** I claim the value *is* the hedge. Raiffa thinks this proves ambiguity aversion is a confusion that disappears upon reflection. I think it proves that rational agents value hedging against uncertainty as a primitive good. It's not that I'm failing to see the probability is 0.5; it's that I refuse to evaluate the bet *as if* it were a simple lottery. I evaluate it as a set of priors. The mixture shrinks the set of relevant priors effectively to a singleton, but I get there through the axiom, not by assuming a Bayesian prior ex-ante.

  **Bob:** Okay, let's press that. Let's say you accept the hedge. You commit to the coin-flip strategy. You stand here, you flip the coin. It lands Heads.

  **Max:** Okay.

  **Bob:** The coin is now spent. It's Heads. You are now committed to betting on Red in Urn U. The ball hasn't been drawn yet. We are at the intermediate node. Look at Urn U. You are holding a bet on Red. You just told me that a bet on Red in Urn U is inferior to a bet on Red in Urn K. That's why you wanted the hedge to begin with. So, right now, in this moment, don't you want to unwind? Don't you want to switch your bet to Urn K?

  **Max:** *Pauses.* If I evaluate this node as a brand new decision problem, in isolation? Yes. I would prefer Urn K.

  **Bob:** Aha! So you're dynamically inconsistent. At $t_0$, you prefer the randomized plan. At $t_1$, conditional on the coin landing Heads, you prefer to deviate from the plan. If you know you're going to want to unwind at $t_1$, why would you commit to the plan at $t_0$? It suggests your *ex-ante* preference was based on a delusion that you could maintain the hedge after the hedge has been resolved.

  **Max:** That's the standard dynamic consistency challenge. It assumes that rationality requires my preferences at $t_1$ to be identical to my conditional preferences at $t_0$, evaluated in isolation. But that assumes separability that my theory rejects.

  **Bob:** It assumes you don't want to violate your own future judgment.

  **Max:** It assumes that the *act* at $t_1$ is "Bet on Red in U." But it's not. The act is "Bet on Red in U *given that I was selected by a randomization device to hedge ambiguity*."

  **Bob:** That sounds like verbal gymnastics. The ball doesn't care how you chose the bet.

  **Max:** The ball doesn't, but *I* do. My utility function is defined over acts, not just outcomes. The "fear" of ambiguity is mitigated by the *knowledge* that my choice was part of a hedging strategy. However, I'll grant you that if I treat the $t_1$ node as a fresh start, I succumb to "myopia." A sophisticated MEU agent doesn't do that.

  **Bob:** So how do you avoid the unwind?

  **Max:** Two ways. First, the resolute choice approach. I recognize at $t_0$ that my future self at $t_1$ will feel the pull of ambiguity aversion regarding the specific color. But I also know that the *ex-ante* evaluation is the only one that accounts for the hedging benefit. So I bind myself. I treat the *plan* as the unit of agency, not the terminal action. To unwind is not "rational reconsideration"; it's a failure of resolution.

  **Bob:** Binding yourself against your own future rational judgment? That's costly.

  **Max:** Is it? Or is it recognizing that the "judgment" at $t_1$ is flawed because it ignores the *ex-ante* dominance? But there's a more technical reply, one you might respect more. It's about how I update my set of priors.

  **Bob:** Go on.

  **Max:** If I update my set of priors using standard Bayesian conditioning on every prior in the set, I get dynamic inconsistency. I'll want to unwind. But if I impose **rectangularity** on my set of priors—as Epstein and Schneider argued—then I can maintain dynamic consistency.

  **Bob:** Rectangularity. You're assuming the set of priors is closed under certain combinations of past and future uncertainties.

  **Max:** Exactly. If my set of priors is rectangular, then the *ex-post* evaluation of the act, properly updated, aligns with the *ex-ante* evaluation. The ambiguity doesn't "come back" at $t_1$ in the same way, because the updating rule respects the structure of the information revealed by the coin. The coin flip isn't just noise; it's part of the filtration. If I update correctly, I realize that deviating at $t_1$ would violate the optimality condition I established at $t_0$.

  **Bob:** But rectangularity is a strong constraint. It essentially forces your set of priors to behave *like* a single prior in dynamic settings.

  **Max:** It forces them to behave consistently. It doesn't force them to collapse to a singleton *ex-ante*. I can still strictly prefer the mixture to the pure acts. That's the Uncertainty Aversion axiom. But rectangularity ensures that once I've chosen the mixture, I don't regret it at the intermediate node. It allows me to be ambiguity averse *and* dynamically consistent.

  **Bob:** So you're saying you can have your cake and eat it too? You get the hedging benefit of the coin flip *ex-ante*, but you don't have to admit that *ex-post* you're just holding a bet on an unknown urn?

  **Max:** I'm saying that "holding a bet on an unknown urn" is an incomplete description of the state. I am holding a bet on an unknown urn *within a strategy that minimized ambiguity exposure*. If I update my beliefs to reflect that I am a rational agent who chose this strategy optimally, the urge to unwind disappears. The ambiguity is still there, Bob, but I've priced it correctly into the plan.

  **Bob:** It feels like you're defining rationality as "sticking to the plan that assumes your theory is true," even when the local evidence (the coin landed, now it's just Red vs. Unknown) screams that you're holding a bad bet.

  **Max:** And you're defining rationality as " Reduction of Compound Lotteries," which assumes I care only about final distributions. I don't. I care about the robustness of my decision across the set of priors. The coin flip provided robustness *ex-ante*. To unwind is to voluntarily surrender that robustness for a gamble I've already declared I dislike. Why would a rational agent surrender robustness just because a coin landed?

  **Bob:** Because the robustness is gone! The coin landed. You're not hedged anymore. You're exposed.

  **Max:** The robustness was in the *choice architecture*. I chose a mechanism that guaranteed me a 50-50 objective chance *regardless* of the urn's composition. That guarantee was purchased *ex-ante*. The fact that the mechanism has now executed one branch doesn't retroactively invalidate the guarantee. The guarantee was that *before the draw*, my winning probability was 0.5. That remains true. Unwinding changes the probability back to $P(Red)$, which is unknown. I know that's worse. So I stay put.

  **Bob:** You stay put because you're binding your future self, not because the future self agrees.

  **Max:** I stay put because the future self, if she is rational and remembers *why* she is there, agrees. She knows that switching to Urn K now would mean admitting that the *ex-ante* calculation was wrong. But it wasn't wrong. The calculation was: "Mixture > Pure Bet." That inequality holds. The realization of the coin doesn't flip the inequality; it just resolves one source of uncertainty. I don't re-evaluate the *preference* just because a state is realized.

  **Bob:** You know, Raiffa would say you're treating the coin flip as magic. It doesn't change the urn.

  **Max:** And I'd say Raiffa treats the agent as a passive vessel for probabilities. I'm an active chooser of acts. The act included the coin. You're trying to evaluate a sub-component of the act as if it were the whole thing. That's the frame. And I don't accept the frame.

  **Bob:** *Sips coffee.* So we're at an impasse. I see a dynamically inconsistent agent who needs to be saved from herself. You see a sophisticated agent who values hedging and commits to plans that preserve that value.

  **Max:** I see an agent who recognizes that ambiguity is a feature of the decision problem, not a bug in her probability assignment. And who knows that sometimes, to beat the ambiguity, you have to let a coin decide, and then trust the coin.

  **Bob:** And I see an agent who flips a coin to convince herself she's not guessing, then refuses to admit she's still guessing once the coin lands.

  **Max:** *Smiles.* Well, at least we agree the coffee here is unambiguous. It's consistently bad.

  **Bob:** *Laughs.* On that, I have a single prior. Let's go.
