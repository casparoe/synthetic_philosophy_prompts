answer: |-
  The deck of the *Aegis* was silent, save for the lap of water against the oak hull. It was a unnatural silence. On the eve of engagement, a trireme should have sounded like a forge: the whetstone singing against bronze, the creak of leather being oiled, the low murmur of men praying or cursing. Instead, the crew of the *Aegis* sat in the dark, hands idle, weapons stacked untouched against the mast.

  Captain Nikas stepped onto the quarterdeck, his boots heavy on the wood. He looked down at his second-in-command, Lysander. Lysander was sitting on a coil of rope, staring at the horizon where the enemy fleet lay anchored, invisible in the night.

  "Give the order," Nikas said. His voice was low, but it carried over the water.

  Lysander did not look up. "There is no point, Captain."

  "The men need sharpened blades. The oars need checking. If the ram loosens on impact, we sink."

  "If the ram loosens, we sink," Lysander agreed. "And if it holds, we float. The proposition 'The *Aegis* sinks tomorrow' is either true or false. It has been true or false since before we were born. If it is true, no amount of oiling will save us. If it is false, no neglect will doom us. Why disturb the men's rest for a necessity that cannot be moved?"

  Nikas felt a cold knot tighten in his stomach. This was the Lazy Argument, the *argos logos*, whispered in the mess halls like a poison. It turned fate into a cage and courage into a fool's errand.

  "You speak like a philosopher, Lysander, but you command like a corpse," Nikas said, descending the steps to stand over him. The crew watched from the shadows. Morale was a tangible thing; it was currently bleeding out onto the deck.

  "I speak like a logician," Lysander corrected, finally meeting Nikas's eyes. "Consider the sick man. If it is fated he recovers, he will recover whether he calls the doctor or not. If it is fated he dies, he will die whether he calls the doctor or not. So why call the doctor? It is the same with us. Why sharpen the spear? The outcome is settled. The truth value of the statement is fixed."

  "And so you choose inaction," Nikas said.

  "I choose acceptance. To struggle against what is already true is madness."

  Nikas crouched, bringing himself to level with his second. He picked up a spear from the stack. It was dull, the bronze edge clouded with oxidation. "You assume that the truth exists independently of the causes that bring it about. You treat fate like a decree written on a tablet, handed down from Olympus, complete and unchangeable."

  "Is it not?"

  "No," Nikas said. "It is a weave. Chrysippus would tell you that your recovery is not fated *instead* of calling the doctor. It is fated *along with* calling the doctor. The outcome is inseparable from the action."

  Lysander scoffed, a dry sound. "Semantics. If the end is fixed, the means are irrelevant."

  "The means are part of the end!" Nikas snapped, his composure cracking. He stood and paced the length of the silent deck. "If it is true that we win tomorrow, then it is also true that we win *because* we rowed hard tonight. If it is true that we die, perhaps we die *because* you sat on your hands and let morale rot. You cannot isolate the consequence from the cause and call it fate. That isn't necessity, Lysander. That's cowardice dressed in logic."

  "It is not cowardice to recognize limits," Lysander said, standing up now, his voice rising so the men could hear. "I am sparing them futile labor. If the gods have decided victory, let them grant it without blood. If they decide defeat, let us meet it with clean consciences, knowing we did not hasten the slaughter."

  "You think the gods watch men who do nothing?" Nikas grabbed Lysander by the tunic. "The future is not a stone waiting to be found. It is clay. Yes, the clay exists. Yes, there are limits to what can be shaped. But if you do not put your hands to it, it does not become a vessel. It remains mud."

  "Then let it remain mud," Lysander said, pulling free. "I will not order them to work. The truth of tomorrow does not require our sweat today."

  Nikas looked around. The men were waiting. In a hierarchy, hesitation is contagious. If the second-in-command believes action is futile, the rower believes the stroke is pointless. If the stroke is pointless, the ship is slow. If the ship is slow, they die. Lysander's logic was a self-fulfilling prophecy of defeat.

  Nikas realized then that the debate was over. The only remaining argument was command.

  "Lysander," Nikas said, his voice dropping to a calm, dangerous register. "You are relieved."

  Lysander blinked. "On what grounds? I am preserving the crew's strength."

  "On the grounds that you have forgotten the nature of a ship. A ship is not a thing that *is*. It is a thing that *does*. It only exists when it moves. You treat the battle as a spectacle we are watching, rather than a thing we are making." Nikas drew his sword. The sound of steel clearing the scabbard was sharp in the night air. "I am not asking you to change fate. I am telling you that your action is part of the fate you claim to respect."

  Lysander's hand went to his own hilt, but he paused. He looked at the men. They were not looking at him with the reverence due a philosopher-king. They were looking at him with the pity one offers a man who has missed the obvious. They wanted to work. They wanted to feel that their hands mattered.

  "You believe the statement 'We win' is already true," Nikas said, stepping closer. "I say it has no truth value yet. It is neither true nor false. It is waiting. And it waits for us."

  "That is Aristotelian wishful thinking," Lysander muttered, but his grip on his sword loosened. "You cannot will truth into existence."

  "I can will *conditions* into existence," Nikas countered. "If I sharpen the blade, the condition for victory is met. If I dull it, the condition for defeat is met. You say the outcome is settled. I say the outcome is the sum of every choice made between now and dawn. If you refuse to choose, you have already chosen defeat."

  Nikas turned his back on Lysander, a calculated risk. He walked to the weapon rack and picked up a whetstone. He began to grind it against the bronze spear head. The screech of metal on stone was violent and loud.

  "Who is with me?" Nikas asked, not looking up. "Who wants to see if their steel holds?"

  For a heartbeat, there was only the sound of the sea. Then, a rower in the front bench stood. He walked to the rack and took a blade. He sat and began to sharpen. Then another. Then the helmsman. The sound multiplied, a chorus of friction and industry rising against the night.

  Lysander stood alone in the center of the deck. The logic of his position was sound, provided one assumed the future was a static object. But as the noise of preparation swelled, drowning out the lap of the water, the assumption felt less like logic and more like paralysis. He watched Nikas working the stone, sparks flying into the dark.

  "If you are wrong," Lysander said quietly, "you are leading them to a slaughter for no reason."

  Nikas stopped grinding. He looked at the edge of the spear, testing it against his thumb. It bit into the skin. A bead of blood welled up.

  "And if you are right," Nikas said, wiping the blood on his tunic, "then this blood was always meant to be spilled. Either way, the work gets done."

  Lysander looked at his own hands. They were clean. He looked at the men, who were now alive with purpose, their eyes fixed on the horizon not with dread, but with anticipation. They were weaving the future, stitch by bloody stitch.

  Lysander sat back down on the coil of rope. He did not pick up a weapon, but he did not speak again. He watched the captain work.

  The horn blew from the flagship in the distance, a low, mournful sound that vibrated in the chest. The enemy was moving. The dawn was still hours away, but the battle had begun.

  Nikas tossed the whetstone to Lysander. It landed in his lap.

  "Sharpen the rest," Nikas said. "If we are fated to win, do your part. If we are fated to die, let us die hard."

  Lysander looked at the stone. He looked at the spear in his hand. The logical symmetry of his argument remained intact in the abstract, but here, on the deck, surrounded by the smell of pitch and the sound of men preparing to kill, the abstraction crumbled. The necessity of the future did not negate the necessity of the present.

  He picked up the stone. He pressed it to the bronze. The screech joined the chorus.

  They rowed out to meet the line as the sun broke the horizon. Whether the proposition "The *Aegis* survives" was true or false was no longer a matter for debate. It was a matter of oars, of bronze, of will. The future was not a place they were going; it was a thing they were building, and for the first time, Lysander understood that even a fate must be constructed.

  The rams struck. The wood screamed. And the truth of the matter was written in the water, finally, in blood.
