      *   **Task:** Write a short story (1,000 - 1,800 words).
      *   **Setting:** People facing a sea battle that hasn't happened yet. Classical fleet is obvious, but open to relocation (period, culture, non-human). Let's stick close to the classical vibe for resonance, maybe a slightly mythic or alternate history Greek setting.
