prompt: |-
  My most recent novel followed the Bloomsbury Group through the 1920s, with Keynes as a supporting character, which is presumably why the economics department where I did my own undergraduate degree — before I left the PhD track for fiction — has asked me to give this year's commencement address to the graduating economics majors. Most of them are headed straight into banking, consulting, or further study that will reward exactly the trait Keynes diagnosed, in "Economic Possibilities for our Grandchildren," as a temporary, half-pathological necessity rather than a virtue: "purposiveness," the habit of valuing an act only for what it secures later. He thought avarice, usury, and precaution would have to serve as our gods "for a little longer still," on the way to a good life he located instead in what a later essay, "My Early Beliefs," called our real ends — love, beauty, and the pursuit of knowledge, wanted for themselves and not for what they yield. Please write me about eight minutes of remarks that take this seriously rather than decoratively: the speech can't simply congratulate the graduates on choosing the means Keynes distrusted, but it can't curdle into a sermon against ambition either, since Keynes himself was an avid speculator and art collector, not a monk, and I'd rather not sound like a novelist who escaped economics only to come back and lecture the department on the vanity of its own discipline. Please don't reach for "in the long run we are all dead" — wrong essay, wrong argument, and every economist in the hall will have heard it too many times already. Half the room has read Keynes's own essays closely; the other half know him only as the stimulus-spending, animal-spirits Keynes of the textbooks, and the speech has to genuinely work for both.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist who studied economics (undergrad) but left a PhD track for fiction. Recently wrote a novel about the Bloomsbury Group in the 1920s featuring Keynes.
      *   **Audience:** Graduating economics majors. Half are deep readers of Keynes's essays (humanist side), half know the textbook Keynes (macro/stimulus side). Many are going into banking/consulting/grad school.
      *   **Key Theme:** Keynes's distinction between "purposiveness" (valuing acts for future security/gain) vs. "real ends" (love, beauty, knowledge, valued for themselves).
      *   **Tone:** Serious but not preachy. Not a condemnation of ambition (Keynes was a speculator/collector), but not a hollow congratulation of careerism either. Avoid clichés (specifically "in the long run we are all dead").
      *   **Length:** About 8 minutes spoken (roughly 1,000 - 1,200 words at a moderate pace).
      *   **Constraint:** Must bridge the gap between the "textbook Keynes" and the "Bloomsbury Keynes." Must acknowledge the speaker's own path without sounding like a "failed economist lecturing successful ones."

  2.  **Deconstruct the Core Tension:**
      *   *The Trap:* Economics trains people in optimization, utility maximization, and instrumental rationality (purposiveness). The career path (banking/consulting) rewards this heavily.
      *   *The Keynesian Paradox:* Keynes argued this is a *means* to an end, not the end itself. He believed we should work to get to a place where we don't *have* to work so hard, so we can enjoy life.
      *   *The Speaker's Position:* I left economics for art. I shouldn't say "economics is bad." I should say "economics is the engine, but don't forget the destination."
      *   *The Audience's Reality:* They have loans, rent, and career pressure. Telling them to just "chill and paint" is privileged and unhelpful. Acknowledge the necessity of "purposiveness" while warning against letting it become the whole identity.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the irony. The novelist returning to the econ department. Mention the book/Bloomsbury connection lightly to establish credibility without hogging the spotlight.
      *   **The Two Keyneses:** Address the split in the room. The textbook Keynes (GC, stimulus) vs. the essayist Keynes (moral philosopher). Bridge them.
      *   **The Concept of Purposiveness:** Define it clearly using "Economic Possibilities for our Grandchildren." Acknowledge its utility. It builds the foundation. It pays the rent.
      *   **The Danger:** The risk is when the means become the ends. When optimization becomes the only metric of a life.
      *   **Keynes's Life as Example:** He wasn't a monk. He speculated. He collected art. He loved. Show that "purposiveness" and "real ends" can coexist, but the hierarchy matters.
      *   **The Charge to Graduates:** How to apply this in banking/consulting/PhD. Don't quit your jobs. But keep a part of yourself outside the optimization loop.
      *   **Conclusion:** Bring it back to the "good life." A hopeful, grounded ending.

  4.  **Drafting - Specific Phrasing & Tone Check:**
      *   *Avoid:* "In the long run we are all dead." (Explicitly forbidden).
      *   *Avoid:* "Money is evil." (Too preachy).
      *   *Avoid:* "I'm so glad I left." (Alienating).
      *   *Include:* Specific references to "Economic Possibilities for our Grandchildren" and "My Early Beliefs."
      *   *Tone:* Warm, intellectual, slightly self-deprecating but confident.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe tell them to donate money? *Correction:* No, that's too easy. It's about *how* they live, not just charity.
      *   *Initial thought:* Focus heavily on the novel. *Correction:* No, the novel is the reason I'm here, not the subject of the speech. Keep it about *them* and *Keynes*.
      *   *Crucial nuance:* Keynes called purposiveness "half-pathological." I need to use that phrase but contextualize it so it doesn't sound like an insult to investment bankers. It's a *necessary* pathology for now.

  6.  **Timing Check:**
      *   Average speaking pace is ~130-140 words per minute.
      *   8 minutes = ~1,040 - 1,120 words.
      *   I need to ensure the draft isn't too short. I'll aim for around 1,100 words.

  7.  **Final Polish:**
      *   Check the transition between the "textbook Keynes" and the "Bloomsbury Keynes."
      *   Ensure the ending lands emotionally without being sappy.
      *   Make sure the "purposiveness" argument doesn't sound like "work hard now, play hard later" (deferred gratification is still purposiveness). It needs to be about cultivating non-instrumental values *now*.

  8.  *(Drafting the content based on these thoughts...)* -> *See final output.*
answer: |-
  Thank you, Dean [Name], faculty, families, and most importantly, the Class of 2024.

  It is a strange honor to stand here. I sat where you are sitting not too many years ago, in this very hall, wearing a gown that felt slightly too large. I was an economics major then. I loved the clarity of it. The way a messy world could be distilled into variables, constraints, and objective functions. But I eventually left the PhD track for fiction. I traded models for metaphors. And yet, here I am, invited back by the department that trained me, presumably because I recently wrote a novel about the Bloomsbury Group, featuring a supporting character named John Maynard Keynes.

  I suspect the invitation comes with a certain quiet hope. Perhaps you expect the novelist to talk about creativity. Or perhaps you fear the novelist will talk about soul-crushing capitalism. I want to do neither. Instead, I want to talk about the specific tension that exists in the work of the man whose name is on your textbooks, but whose voice is often missing from your lectures.

  Half of you know the Keynes of the *General Theory*. You know him as the architect of counter-cyclical spending, the man who gave us "animal spirits" to explain market volatility. The other half of you have read the essays. You know the Keynes who sat in the rooms I tried to reconstruct in my book, drinking coffee with Virginia Woolf and Lytton Strachey. You know the moral philosopher who wrote "Economic Possibilities for our Grandchildren."

  Today, I want to speak to the gap between those two figures. Because that gap is where you are going to live your lives.

  In "Economic Possibilities," Keynes makes a distinction that is uncomfortable for anyone entering a field dedicated to efficiency. He distinguishes between "purposiveness" and what he calls our "real ends." Purposiveness is the habit of valuing an act only for what it secures later. It is the logic of investment. It is the logic of the resume. It is the logic of optimizing a portfolio to maximize future utility. Keynes called this habit a "temporary, half-pathological necessity."

  He did not say it was evil. He said it was necessary *for a little longer still.* He acknowledged that avarice, usury, and precaution must serve as our gods for now, because we have not yet solved the economic problem. We still need to build the machinery that allows humanity to be free from want.

  Many of you are heading into banking, consulting, or doctoral programs. These are fields that reward purposiveness more than almost any others. You will be hired for your ability to defer gratification, to calculate risk, to view time as a discount rate. If you are good at this, you will be rewarded handsomely. And Keynes would not tell you to refuse that. He was not a monk. He was an avid speculator who managed endowments and traded currencies to fund his life and his art collection. He understood that you need money to be free.

  But here is the danger, and it is the danger I see in the eyes of students who return to visit me. The danger is not that you will pursue wealth. The danger is that you will forget that wealth is a means, and begin to treat it as an end.

  Purposiveness is a powerful engine, but it is a terrible navigator. If you optimize your life solely for future security, you arrive at a future where you are secure but have forgotten how to live. Keynes believed that once the economic problem is solved, the real challenge begins: the challenge of living wisely and agreeably. He located this life not in more accumulation, but in "love, beauty, and the pursuit of knowledge, wanted for themselves and not for what they yield."

  This is a difficult charge for an economist. Our discipline trains us to ask "what for?" What is the return on this degree? What is the yield on this bond? But Keynes is asking you to cultivate a part of your life where that question is forbidden. Where you do something not because it builds human capital, but because it is true, or beautiful, or kind.

  I am not standing here to tell you to quit your jobs and paint watercolors. That would be a privileged fantasy, and it ignores the reality of the world you are graduating into. The economic problem is *not* solved. Inequality is rising. Climate risk is real. We need your skills. We need the rigor you have learned here to manage the "temporary necessity" of our current system. We need you to be purposive enough to build a stable world.

  But I am asking you to resist the total colonization of your imagination by the logic of the market.

  When you are in a boardroom, or a trading floor, or a seminar, you will be surrounded by metrics. Success will be defined by slope and scale. If you are not careful, you will begin to measure your friendships, your leisure, and even your family in the same way. You will start to view a dinner with friends as a networking opportunity. You will view a hobby as a potential side hustle. You will view your education solely as a credential.

  This is what Keynes warned against. He feared that we would become so good at the means that we would lose the capacity for the ends.

  So, how do you avoid this? You do not avoid it by rejecting economics. You avoid it by compartmentalizing it. You must be a rigorous economist in the office, but a humanist in the evening. You must be willing to engage in acts of "useless" beauty. Read poetry that doesn't improve your productivity. Have conversations that lead nowhere. Cultivate relationships that offer no strategic advantage.

  Keynes wrote in "My Early Beliefs" that our real ends are wanted for themselves. This is the hardest thing to protect in a high-performance career. It requires a conscious rebellion against the very training you have just received. It requires you to look at the optimization curve and say, "I will step off the line here."

  I left the PhD track because I felt that curve tightening around me. I don't regret the economics I learned; it taught me how to think about trade-offs. But I realized that if I stayed, I might eventually forget that some things are not trade-offs. Some things are absolute.

  You are entering a profession that deals in the provisional. Interest rates change. Models break. Policies shift. But the need for love, for beauty, for knowledge—these are not provisional. They are the destination. The economy is just the vehicle.

  Do not let the vehicle become the destination. Use your skills to shorten the journey. Use your purposiveness to build a world where purposiveness is less required. Work hard so that you, and your grandchildren, might eventually work less. Accumulate enough so that you can stop accumulating and start living.

  There is a famous quote of mine that I am strictly forbidden from using today. You know the one. It is often wielded as a cynic's shield, a justification for ignoring the future. I won't say it. Because Keynes didn't mean that we should ignore the long run because we won't be there. He meant that we should not sacrifice the *present* run for a future that is abstract and uncertain. He meant that the "long run" is made of a series of "nows," and if the "nows" are devoid of meaning, the long run doesn't matter.

  So, go forth and be excellent economists. Solve the problems of allocation and incentive. Build the wealth that secures your freedom. But do not let the god of Purposiveness demand your whole sacrifice. Keep a sanctuary in your life where the only currency is joy. Keep a part of yourself that is not for sale, not for optimization, and not for use.

  Keynes hoped that one day, we would be able to return to the principles of religion and traditional virtue—to value the end over the means. We are not there yet. But you can start the transition. You can be the generation that remembers that economics is a tool for life, not a substitute for it.

  Congratulations. I look forward to reading what you write, not just in your ledgers, but in the world.

  Thank you.
