      *   *Argument Point 1: The Ontology of the Apta.* Focus on *jnana* and *iccha*. AI has neither. It's *jada* (insentient matter). *Shabda* requires a *chetana* (conscious) source.
      *   *Argument Point 2: The Causal Chain.* In Navya-Nyaya, *prama* (valid knowledge) requires specific causal conditions (*karanas*). The speaker's knowledge is a *karanas* for the listener's knowledge. If the cause is missing (no knowledge in the AI), the effect (valid knowledge in the user) cannot arise via *shabda*.
      *   *Argument Point 3: Reclassification as Anumana.* If it's not testimony, what is it? It's inference. "The bot said X, the bot is usually right, therefore X." But this is shaky.
      *   *Argument Point 4: The Danger.* Why does this matter? Because *shabda* grants immediate certainty (in the Nyaya view). *Anumana* requires checking the middle term. Treating AI as *shabda* is an epistemic category error that leads to *bhrama* (error).
