      *   **Intention (*Iccha/Tatparya*):** Does an LLM *intend* to tell the truth? No. It minimizes a loss function. It has no moral agency or desire (*raga/dvesha*).
      *   **Linguistic Conditions:** AI output usually satisfies *akanksha*, *yogyata*, and *asatti* (it generates grammatically correct, semantically plausible text instantly). *Tatparya* is the sticking point. Who is the speaker? The model? The developers? The training data authors?
      *   **The *Apta* Problem:** An *apta* must be a *knowing subject*. An AI is not a subject (*atman* connected to a mind/*manas*). It is an instrument (*karana*).

  4.  **Formulate the Argument (The "Spine"):**
      *   *Thesis:* Gangesha would definitively reject AI output as *shabda pramana*. It fails the ontological requirement of the *apta*.
      *   *Alternative:* Trusting an AI is not receiving testimony; it is a form of *anumana* (inference) based on past performance, OR it is *tarka* (hypothetical reasoning) liable to error (*aprama*).
      *   *Why not Shabda?* Because *shabda* relies on the *guarantee* of the speaker's virtue and knowledge. Without a conscious agent behind the words who *knows*, the causal chain of valid verbal cognition is broken at the source.
      *   *Nuance:* The AI is a *tool* (like a book or a measuring tape), not a *witness*. Reading a book is *shabda* only if we trace it back to a human *apta*. With AI, the "author" is a statistical aggregate, not a knower.
      *   *Conclusion:* Relying on AI is *anumana* (inferring truth from reliability) but a weak one, prone to *hetvabhasa* (fallacies), specifically *asiddha* (unproven reason) because the "reliability" isn't grounded in knowledge.

  5.  **Drafting the Response (Iterative Process):**

