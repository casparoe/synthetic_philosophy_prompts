answer: |-
  The conference room was soundproofed, a sealed box of mahogany and leather that smelled faintly of old paper and stale coffee. Outside, the D.C. rain blurred the windows, but inside, the air was still.

  Judge Elias Alsop sat at the head of the table, his reading glasses perched on the end of his nose. He tapped a pen against the printed brief of the *Conservation Group v. University*. Opposite him, Judge Maria Reyes leaned back, her arms crossed, watching him with the patience of a predator that knew the prey wasn't going anywhere.

  "The text is unambiguous, Maria," Alsop said, his voice low and gravelly. "Section 4(b) of the Migratory Habitat Preservation Act. 'Any structure exceeding twelve feet in height within two hundred yards of a designated wetland.' The University's pole extends to fourteen feet. It is within the zone. It is a structure. End of inquiry."

  Reyes uncrossed her arms and reached for her mug. "End of inquiry? Elias, we're talking about a telescoping aluminum rod used for a three-week climate survey. If I put up a tent for a weekend camping trip, is that a structure? If a construction crew puts up scaffolding for a day, is that a structure?"

  "Scaffolding is a structure," Alsop countered immediately. "A tent is a structure. The statute doesn't say 'permanent structure.' It doesn't say 'habitable structure.' It says 'structure.' Congress knows how to qualify nouns. In the Clean Water Act, they distinguish between 'temporary' and 'permanent' discharges. Here, they didn't. To insert a 'temporary' exception is to legislate from the bench."

  "To interpret a word in a vacuum is to ignore language itself," Reyes shot back, leaning forward. "Words derive meaning from context. We aren't robots parsing code; we're judges interpreting a law passed by humans to solve a human problem. Look at the Committee Report. Page 14. 'The proliferation of permanent observation towers and commercial developments blocks the nesting corridors of the whooping crane.' That is the mischief they were remedying. They were worried about skyline obstructions, not a graduate student's weather vane."

  Alsop removed his glasses and rubbed the bridge of his nose. "I've read the report. But the report is not the law. The law is the text enrolled by Congress and signed by the President. If the Committee wanted to exempt scientific equipment, they could have written it. They didn't. Why should we assume they forgot? Perhaps they decided that *any* vertical intrusion, even temporary, disturbs the habitat during critical migration windows. Maybe the flapping of the tether or the shadow of the pole scares the birds. We don't know. And we aren't supposed to know."

  "So we enforce a result that makes no sense?" Reyes asked, her voice rising slightly. "The University is collecting data *for* the Fish and Wildlife Service to help manage these exact wetlands. By your reading, the Act prohibits the very research needed to enforce the Act. That isn't just harsh, Elias. It's self-defeating."

  "It is not self-defeating; it is a policy choice we disagree with," Alsop corrected. "There is a difference between a law that is absurd and a law that is unwise. The Absurdity Doctrine is a escape hatch, Maria. It's not a skylight. It applies only when the text produces a result that is impossible to perform or logically contradictory. Complying with this statute is not impossible. The University can move the pole two hundred and one yards away. Or they can use a drone. Or they can use a shorter pole."

  "Drones disturb birds more than static poles," Reyes said. "And moving the site ruins the data integrity. You're asking for compliance that defeats the scientific purpose. This is *Holy Trinity* territory. We don't apply the letter of the law when it clearly violates the spirit."

  Alsop shook his head firmly. "*Holy Trinity* is a relic of a bygone era. It gave judges too much license to override democratic choices based on their own view of 'spirit.' If I rule for the University based on 'purpose,' I am telling the next judge that they can ignore the text whenever they think they have a better idea of what Congress *should* have wanted. What happens when a developer argues that a condo tower is 'economic infrastructure' which serves the national purpose? If we loosen the text, we lose the anchor."

  "I'm not arguing to loosen the text," Reyes insisted. "I'm arguing to define the word 'structure.' In common parlance, does a temporary survey instrument count as a structure? Black's Law Dictionary defines structure as 'something constructed or built.' But case law in zoning contexts often implies a degree of permanence. A car isn't a structure. A boat isn't a structure. Why? Because they aren't fixed. This pole was there for twenty-one days. It was staked, not poured. It's equipment, not a structure."

  Alsop paused. He picked up his pen again, twirling it. "That is a stronger argument. You're arguing semantic context rather than legislative intent."

  "I'm arguing that language is contextual," Reyes said, sensing the opening. "If a sign says 'No Vehicles in the Park,' and an ambulance enters to save a life, we don't ticket the ambulance. Not because the law has a 'life-saving exception,' but because 'vehicle' in that context implies recreational or transport use, not emergency apparatus. Here, 'structure' implies a fixed edifice, not transient scientific gear."

  Alsop sighed, looking out at the rain. "The problem, Maria, is the slope. Once we start deciding what counts as 'transient' versus 'fixed,' we become the zoning board. Is three weeks transient? What about three months? What if the University leaves the pole up for a year because of funding delays? If we write an opinion that says 'temporary structures are exempt,' we are writing the exception Congress didn't. We are drawing the line ourselves."

  "Then we draw the line narrowly," Reyes proposed. "We rule that 'structure,' in the context of the MHPA, requires a foundation intended for indefinite use. We don't create a broad 'scientific exemption.' We just say this specific object, under these specific facts, doesn't meet the textual definition of 'structure' because it lacks permanence. That keeps you in the text. It defines the word, it doesn't add to it."

  Alsop was silent for a long moment. He looked at the brief, then at Reyes. "You're asking me to adopt a common-law definition of 'structure' that imports a permanence requirement not found in the statute."

  "I'm asking you to acknowledge that words have shades of meaning," Reyes said softly. "If you force the plain meaning here, you protect the birds from a pole, but you blind the scientists who watch the birds. You win the battle and lose the war. And you invite Congress to be lazy. If they know the courts will fix their drafting errors to avoid absurdity, they have less incentive to draft carefully. But if we hammer them on bad text, they might actually write better laws."

  "That's a utilitarian argument for judicial restraint," Alsop mused, a faint smile touching his lips. "Using harsh outcomes to force legislative clarity."

  "Exactly," Reyes said. "But in this case, the outcome isn't just harsh. It's counter-productive. And I think you know that if you write an opinion striking down this pole based solely on 'fourteen feet is greater than twelve,' the public won't see a defender of the Rule of Law. They'll see a bureaucrat strangling science."

  Alsop capped his pen. He looked tired. "I worry about the precedent. If we exempt this, the Conservation Group comes back next year with a challenge against a temporary bird-blind. Then a temporary fishing pier. Where does it stop?"

  "It stops at permanence," Reyes said. "We make the holding about the nature of the object, not the purpose of the user. A temporary pole is not a structure. A permanent blind is. That gives lower courts a test they can apply without guessing at legislative motives."

  Alsop leaned back, the leather creaking. He stared at the ceiling for a moment, weighing the architecture of the argument. He was a textualist, but he was not a fool. He knew that language was a living thing, even if he believed it should be tethered.

  "If I join," Alsop said slowly, "I want the opinion to be explicit. No citing the Committee Report as authority. No talk of the 'spirit' of the Act. The reasoning must rest entirely on the definition of 'structure' as implying a degree of permanence in common usage. We are not creating an exception. We are defining a term."

  Reyes nodded. "I can live with that. The opinion says 'structure' implies permanence. The legislative history supports that understanding of the word, but it's not the basis of the holding. It's just context."

  "And," Alsop added, raising a finger, "we note that this is a narrow ruling. If Congress wishes to regulate temporary equipment, they are free to amend the statute. We are not closing that door."

  "Agreed," Reyes said. "We leave the policy to them. We just interpret the words they gave us."

  Alsop exhaled, a long release of tension. He pushed the brief across the table toward the center. "It's a compromise. You get the result you want. I get the methodology I can sign."

  "It's not a compromise on the result, Elias," Reyes said, picking up the brief. "It's a compromise on the truth. The text *does* allow for this interpretation. You just needed to look at the words differently."

  "And you needed to admit that the words matter more than the wish," Alsop replied dryly.

  Reyes smiled, standing up and gathering her papers. "Same time tomorrow for the environmental sentencing guidelines?"

  "God help us," Alsop muttered, reaching for his coffee. It was cold, but he drank it anyway. "Leave the light on, Maria. I have to rewrite my opening paragraph."

  "I'll send you my draft," she said, pausing at the door. "Try not to bleed on the margins."

  "Only if you promise not to cite *Holy Trinity* in the footnotes."

  "No promises," she said, and slipped out into the hallway.

  Alsop sat alone in the quiet room. He looked at the statute again. *Any structure.* He traced the word with his finger. He still believed Reyes was stretching it, bending the text just enough to let the light in. But as he looked at the rain streaking the glass, he wondered if the law was supposed to be a wall, or a window. He picked up his pen, dipped it in ink, and began to write.
