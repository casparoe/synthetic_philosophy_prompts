answer: |-
  This is a sophisticated craft problem that cuts to the very heart of the detective genre's philosophy. You are correct to sense that "taste" is an insufficient explanation. Your writing group is divided because they are arguing from two different definitions of "Fair Play," and neither definition is entirely wrong.

  The camp calling it "textbook fair play" is arguing from **Ontological Fairness**: *Are the facts physically present in the text?*
  The camp feeling "ambushed" is arguing from **Epistemological Fairness**: *Was the reader given the cognitive tools to prioritize and connect those facts?*

  To resolve this without relying on "genre convention," you need vocabulary drawn from narrative theory and cognitive psychology. The distinction you are looking for lies between **Availability** and **Salience**, and the governing principle is what we might call the **Contract of Solvability**.

  ### 1. Availability vs. Salience

  Your beta readers who feel cheated are reacting to a lack of *salience*.

  *   **Availability** is binary: A fact is either on the page or it isn't. Your train remark, clock detail, and habit are all *available*.
  *   **Salience** is gradient: It measures how much narrative weight a detail carries. It answers the question: *Why should I remember this?*

  In a Golden Age mystery, the author manipulates salience to hide clues in plain sight. However, there is a limit. If a detail has *zero* salience (it serves no immediate narrative function, creates no tension, and fits no thematic pattern), the reader's brain discards it as "noise" to manage cognitive load.

  If your solution requires the reader to retain three pieces of "noise" across six chapters and synthesize them without any narrative prompt that these noises belong to the same signal, you have violated the **Contract of Solvability**.

  ### 2. The Contract of Solvability

  Ronald Knox and S.S. Van Dine are often cited as the arbiters of Fair Play, but their rules are often misunderstood as merely "don't hide the clue." Van Dine's actual rule is: *"The reader must have equal opportunity with the detective for solving the mystery."*

  This is the crux of your disagreement.
  *   **The Detective** knows these three facts are connected because they are investigating a *crime*. They are looking for inconsistencies.
  *   **The Reader** is experiencing a *story*. They are looking for meaning, character development, and plot progression.

  For the opportunity to be "equal," the text must invite the reader to adopt the detective's mindset regarding specific details *before* the reveal. If the text treats the clock running fast as a quirky character trait in Chapter 5, but the detective treats it as a forensic timestamp in Chapter 12, the reader did not have equal opportunity. They were reading a character study; the detective was reading a crime scene.

  **The Principle:** A clue is only "fair" if the narrative context allows the reader to categorize it as *potentially significant* to the mystery, even if they don't know *why* yet.

  ### 3. Thematic Cohesion and Semantic Fields

  You mentioned a worry about "specialized background knowledge." This touches on **Semantic Fields**.

  In your scenario, you have:
  1.  Train (Travel/Time)
  2.  Clock (Time)
  3.  Evening Habits (Routine/Time)

  Fortunately, your clues are thematically cohesive (they all relate to Time/Schedule). This helps. If one clue had been about a type of poison, one about a train, and one about a clock, the synthesis would be impossible without a prompt.

  However, thematic cohesion is not enough. There must be a **Narrative Scaffold**.
  *   **Unfair:** The facts exist, but the text never asks a question that these facts answer.
  *   **Fair:** The text raises a question (e.g., "How could he have arrived so soon?" or "Why was everyone late for dinner?"), and the facts provide the answer.

  If Chapter 2, 5, and 8 pass without the narrative ever raising a question about *time discrepancies*, the reader has no reason to build a mental model of the timeline. When the detective solves it based on the timeline, it feels like the rules of the game changed mid-play.

  ### 4. A Principled Diagnostic Test

  To determine if your specific puzzle crosses the line from "clever" to "unfair," apply these three tests:

  **A. The "Second Read" Test**
  When a reader finishes the book and immediately re-reads Chapter 2, does the train remark glow with new meaning?
  *   *Fair:* "Ah, I see! He said he caught the 4:00, but the clock was fast!"
  *   *Unfair:* "Oh, I guess that sentence was a clue. It looked exactly like every other sentence of dialogue."
  If the clue does not gain retroactive weight upon re-reading, it was buried too deep.

  **B. The "Mind Palace" Test**
  Does the solution require the reader to remember the *exact wording* of a throwaway line, or just the *implication*?
  Human memory is reconstructive, not photographic. If the solution hinges on the reader remembering that the guest said "I caught the train" rather than "I took the train," that is unfair. If it hinges on the *fact* of the train time, it is fairer.
  *   *Principle:* Rely on semantic memory (meaning), not episodic memory (verbatim recall).

  **C. The "Intermediate Inference" Test**
  This is the most critical for your situation. You have three facts (A, B, C) that lead to Solution (Z).
  *   **Unfair Chain:** A + B + C = Z. (The reader must hold all three in suspension until the end).
  *   **Fair Chain:** A + B = Y (An intermediate conclusion). Then Y + C = Z.
  Does the text allow the reader to make *partial* deductions? For example, in Chapter 5, when the clock is mentioned, is there a moment where the detective (or narrator) notes, "That time seems wrong," without explaining why? This validates the clue's importance without giving away the solution. It tells the reader: *Pay attention to time.*

  ### 5. Resolution and Recommendation

  Your instinct that "Fair Play" is an "unprincipled truce" is half-right. It is a truce, but it is based on the psychological principle of **Relevance Theory** (proposed by linguists Sperber and Wilson).

  Relevance Theory states that in any communication (including novels), the audience assumes that every detail provided is relevant to the context.
  *   **The Writer's Sin:** Providing a detail that is relevant to the *solution* but irrelevant to the *context* in which it appears.
  *   **The Fix:** You do not need to make the clues obvious. You need to make the *context* receptive.

  **Practical Advice for Your Manuscript:**
  You do not need to change the clues. You need to change the **narrative pressure** surrounding them.

  1.  **Prime the Theme:** Ensure that "Time" or "Schedules" is a minor thematic undercurrent in the early chapters. If characters are generally obsessed with punctuality, or if the house is known for its strange routines, the clock and train details gain salience naturally.
  2.  **Validate the Clue:** In Chapter 5, when the clock is mentioned, have a character react to it. "That clock is always fast." This confirms the fact is real and notable, not a typo or atmospheric fluff.
  3.  **The Detective's Struggle:** Consider allowing the detective to be confused by one of these facts earlier. If Poirot frowns at the train ticket in Chapter 3, the reader knows *that ticket matters*. They won't know why, but they won't discard it.

  ### Conclusion

  There is a principle underneath the truce. Fair Play is not about the **presence of data**; it is about the **management of attention**.

  Your beta readers who feel ambushed are correct that "facts in black and white" are not enough. If the text does not signal that these facts are part of the puzzle's architecture, requiring the reader to connect them is not a test of deduction; it is a test of clairvoyance.

  However, you can resolve this without capitulating to "making it obvious." You simply need to ensure that the narrative context grants those facts enough **salience** that a diligent reader *could* have prioritized them, even if they didn't solve the equation. If the reader finishes the book and says, "I didn't solve it, but I see how I could have," you have succeeded. If they say, "I couldn't have solved that because I had no reason to care about the clock," you have violated the contract.

  The line falls at **retroactive coherence**. If the solution makes the earlier scenes feel richer and more purposeful on a second read, it is fair. If it makes the earlier scenes feel like deceptive tricks, it is not. Trust the "ambushed" camp on this one: in the Golden Age, the pleasure comes from the reader feeling clever, not from the author feeling cunning.
