      *   *Check:* Is the Ugarit/Egypt asymmetry central? *Correction:* Keep bringing it back to Ammurapi vs. Ramesses III.
      *   *Tone:* Keep it respectful but sharp. These are colleagues, not enemies.

  5.  **Drafting the Dialogue (Iterative Process):**
