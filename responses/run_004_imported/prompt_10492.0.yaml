answer: |-
  Good evening. For those of you who don't know me, I'm [Name]. I had the privilege of teaching the Social Choice seminar where Priya and Dan first met. So, in a very literal sense, I am the externality that internalized their matching market.

  It is an honor to stand here. But I was given a specific warning when I agreed to give this toast. I was told: "Do not, under any circumstances, say that Priya and Dan make each other 'happier than anyone else in the world could.'"

  Because, as half of you know, that statement is theoretically fraught.

  You see, when Priya and Dan aren't planning a wedding, they are engaged in a low-level, domestic debate about the foundations of welfare economics. Dan is a hardline Robbins ordinalist. He believes that utility is a ranking, not a score. He thinks saying "my happiness outweighs yours" is scientifically meaningless. Priya, on the other hand, has gone full Harsanyi. She believes in cardinal utility. She believes we can measure well-being, aggregate it, and maximize the sum.

  So, for the last five years, their relationship has been a living laboratory. When Dan brings Priya coffee in the morning, Dan says, "I have revealed a preference for your well-being." Priya says, "No, Dan, I am experiencing a cardinal increase in joy, please note the magnitude."

  When they argue about whose turn it is to do the dishes, Dan claims it's a bargaining problem within a cooperative game. Priya claims it's a utility aggregation failure.

  And yet… here they are.

  I've spent a lot of time thinking about how to toast a couple who fundamentally disagree on how to measure the success of this marriage. And I realized that if I try to solve their theoretical dispute, I'll fail. But if I look at what they actually *do*, the solution is right in front of us.

  Because while they disagree on the *metric*, they agree on the *outcome*.

  Dan might argue that we cannot compare his utility to Priya's. But I have watched him cancel a conference trip so she could finish her dissertation. Priya might argue for the sum total of welfare, but I have watched her prioritize Dan's needs even when the "aggregate" suggested otherwise.

  They have stumbled upon the one concept in social choice that satisfies both the ordinalist and the cardinalist. They have built a Pareto Optimal relationship.

  Every day, they make choices that make one of them better off without making the other worse off. And often, they make choices that make *both* of them better off, even if they can't agree on the units of measurement.

  To the family and friends here who do not speak "Econ": What this means, in plain English, is that they pay attention. They notice when the other person is tired. They notice when the other person is thriving. They don't keep score, even though Priya thinks scores are real. They don't rank their love, even though Dan thinks rankings are the only thing that's real.

  They have proven that you don't need a common currency of happiness to build a life of shared joy.

  There is a famous impossibility theorem in my field that suggests it's impossible to aggregate individual preferences into a fair collective decision without a dictator. Well, Priya and Dan are the counter-example. They have aggregated their lives without a dictator. They have found a social welfare function that works. It's messy, it's iterative, and it's based on something far more robust than any model I could put on a blackboard.

  It's based on the fact that when Dan had a terrible year on the job market, Priya didn't calculate the utility loss. She just held his hand. And when Priya was deciding between two job offers, Dan didn't ask for the ordinal ranking. He asked, "Where will you sleep better at night?"

  So, I am not going to say that their combined happiness is greater than anyone else's. I am not going to claim their interpersonal utility comparisons are valid.

  I am simply going to say this:

  May your life together be a series of Pareto improvements.
  May your conflicts be Nash equilibria that you solve with kindness rather than strategy.
  And may you always find that the only utility that matters is the well-being of the person standing next to you.

  Priya, Dan: You are the proof that love is the only variable that doesn't need to be defined to be real.

  Please raise your glasses. To the bride and groom.
