answer: |-
  This is a fantastic question that cuts to the heart of the philosophy of biology. You and your friend were reenacting a debate that has actually played out in the literature for decades, but it exploded into public view during the ENCODE controversy of 2012.

  The short answer is: **You were both right, but you were using different dictionaries.** However, one dictionary is generally more useful for the specific question of whether DNA is "junk."

  Here is how the two major philosophical accounts of function—Robert Cummins's causal-role account and Larry Wright's etiological account—rule on the ENCODE case, followed by an assessment of who "won" the argument.

  ### 1. Robert Cummins: The Causal-Role Account
  **The Theory:**
  In his 1975 paper "Functional Analysis," Robert Cummins defined function in terms of **current causal contribution**. For Cummins, to say "X has the function of Y" is to say "X contributes to the capacity of the containing system to do Y."

  Crucially, Cummins's account is ahistorical. It does not matter *why* X is there; it only matters what X *does* right now within the specific analytical context. A heart pumps blood (function), but it also makes a "lub-dub" sound. If we are analyzing the circulatory system, the pumping is the function. If we are analyzing auscultation (listening to the chest), the sound is the function. Anything that has a causal effect can be assigned a function relative to some capacity of the system.

  **Ruling on ENCODE:**
  Your friend's position aligns almost perfectly with Cummins.
  *   **The Logic:** The ENCODE consortium defined "function" as "biochemical activity." If a stretch of DNA is transcribed into RNA, or if a protein binds to it, it is causally affecting the biochemical state of the cell.
  *   **The Verdict:** Under a Cummins-style analysis, ENCODE is correct. If 80% of the genome exhibits biochemical activity, then 80% of the genome has a causal role in the cell's current operations. Even if that transcription is "noise," it is still a causal event occurring within the system. To deny it is "functional" in this sense is to ignore the measurable data.

  ### 2. Larry Wright: The Etiological (Selected-Effects) Account
  **The Theory:**
  In his 1973 paper "Functions," Larry Wright argued that Cummins's account was too permissive for biology. Wright proposed that biological function is inherently historical. For Wright, "X has the function of Y" means:
  1.  X is there *because* it does Y.
  2.  Y is a consequence of X's presence that explains why X was selected for in the past.

  This distinguishes between a trait's **function** and its **mere effects**. The heart makes a "lub-dub" sound, but hearts do not exist *because* they make that sound. They exist because they pump blood. Therefore, pumping is the function; the sound is a side effect.

  **Ruling on the Evolutionary Rebuttal:**
  Your position (and that of Dan Graur, W. Ford Doolittle, and others) aligns with Wright.
  *   **The Logic:** Graur's famous analogy was indeed the television set. If a TV shows static, the static is a causal effect of the electronics (Cummins), but the static is not the *function* of the TV. The function is to display a picture. Similarly, just because the cellular machinery transcribes a DNA sequence doesn't mean the sequence is *there to be* transcribed. It might be transcribed because the polymerase is sloppy, or because the chromatin is open for a neighboring gene.
  *   **The Verdict:** Under a Wright-style analysis, ENCODE is incorrect. Unless there is evidence that a sequence is maintained by natural selection *because* of its biochemical activity, it is not "functional." It is junk, noise, or a parasitic element (like a transposon). The fact that it *does* something is irrelevant; the question is whether it is there *to do* that thing.

  ### 3. Were You Talking Past Each Other?
  Yes and no.

  **Yes:** You were employing incompatible definitions. When your friend said "functional," she meant "causally active." When you said "functional," you meant "evolutionarily selected." In philosophy, this is called a **verbal dispute**. If you had paused to define terms, you would have realized you weren't disagreeing about the data (both sides agree 80% shows activity; both sides agree much of it isn't conserved); you were disagreeing about the label.

  **No:** It wasn't *merely* verbal, because the choice of definition carries scientific consequences.
  *   If you use **Cummins**, you prioritize **mechanism**. You want to know how the cell works right now. Biochemical noise might interact with other things and cause disease or variation, so tracking it is useful.
  *   If you use **Wright**, you prioritize **adaptation**. You want to know why the organism is built this way. This prevents you from assuming every activity is beneficial.

  The conflict arose because ENCODE presented their Cummins-style findings using the word "functional" without qualification, which the public and many biologists interpreted in the Wright-style sense (i.e., "80% of our genome is useful/adaptive"). That was a category error.

  ### 4. Which Account is More Defensible?
  If forced to choose which account is the "correct" one for biology generally, and the Junk DNA debate specifically, **Larry Wright's etiological account is the stronger candidate.**

  Here is why:

  **1. The "Junk" Question is Evolutionary**
  The concept of "Junk DNA" is inherently evolutionary. "Junk" implies something that is carried along without utility, like the receipt in your pocket or the static on the TV. To determine if something is junk, you must ask about its utility to the organism's fitness and its history of selection. A causal-role account cannot distinguish between a vital gene and a parasitic virus currently replicating in the genome; both are "causally active." Only the etiological account can distinguish the host's function from the parasite's effect.

  **2. Avoiding the "Pan-Adaptationist" Trap**
  Cummins's account risks implying that everything an organism does is functional. If a mutation causes a weird protein fold that does nothing helpful but doesn't kill the cell, Cummins allows us to call it "functional" because it has a causal role. Wright forces us to demand evidence of selection. In the post-genomic era, where we are drowning in data about correlations and bindings, Wright's account provides a necessary filter to prevent us from attributing purpose to noise.

  **3. Biological Explanations require History**
  When a biologist asks, "What is the function of the hemoglobin molecule?" they are not just asking "What does it do?" (bind oxygen). They are asking "Why do we have it?" (to transport oxygen for survival). The explanatory power of biology lies in connecting structure to evolutionary history. Wright's account captures this; Cummins's does not.

  ### The Verdict on the Dinner Argument
  You can sleep easy. While your friend was technically correct that 80% of the genome is *biochemically active* (Cummins), you were correct that it is misleading to call 80% of the genome *functional* in the biological sense that implies design or utility (Wright).

  The scientific consensus has largely sided with you. Following the backlash from evolutionary biologists (like Graur), even members of the ENCODE consortium have clarified that they were using a "biochemical definition" of function, not an evolutionary one. Most geneticists now estimate that only between 8% and 15% of the human genome is under evolutionary constraint (i.e., Wright-functional).

  **How to make peace:**
  Tell your friend that she was arguing from the perspective of a **biochemist** (what is happening now?), while you were arguing from the perspective of an **evolutionary biologist** (why is it here?). Both perspectives are necessary for science, but when discussing "Junk DNA," the evolutionary definition is the standard. You didn't stipulate a definition to win; you used the definition required to make sense of the term "junk."

  **Recommendation:** Buy her a drink, concede that the ENCODE data is fascinating and useful for mapping mechanisms (Cummins), but stand firm that calling it "functional" without qualification was a philosophical error that confused the field (Wright).
