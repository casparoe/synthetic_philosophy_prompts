answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Rain streaks the window. **Clara** (Counterfactualist) is stirring a tea. **Ivan** (Interventionist) is sketching nodes and arrows on a napkin.*

  **Clara:** You know, I spent my weekend wrestling with Suzy and Billy again. The rock throwers. The bottle shatters. Suzy's rock hits first. Billy's would have hit a millisecond later.

  **Ivan:** *[Without looking up from the napkin]* Late preemption. The classic poison pill for simple counterfactual dependence. If Suzy hadn't thrown, the bottle still shatters because of Billy. So, $\neg S \square \rightarrow \neg B$ is false. Suzy isn't a cause. Which is absurd.

  **Clara:** Exactly. Lewis spent decades trying to patch it. Chains of dependence, quasi-dependence, influence. It got messy. But I'm looking at your camp now—Pearl, Woodward, the structural equation crowd. You claim you solve this cleanly. But every time I dig into the "solution," it looks like you're just hiding the metaphysical cost inside the math.

  **Ivan:** *[Puts pen down]* Hiding? Or modeling? Look, the problem with your counterfactuals is they're too coarse-grained. You're looking at events as monolithic blocks. "Suzy throws," "Bottle shatters." You miss the structure. In my framework, we define variables. $ST$ for Suzy Throws, $BT$ for Billy Throws, $SH$ for Suzy Hits, $BH$ for Billy Hits, $BS$ for Bottle Shatters.

  **Clara:** Okay, I'm with you.

  **Ivan:** Then we write the structural equations. $SH = ST$. $BH = BT \times (1 - SH)$. And $BS = \max(SH, BH)$. See that middle equation? $BH$ depends on $BT$ *and* whether Suzy hit. If $SH=1$, then $BH=0$, regardless of Billy's throw. That captures the preemption structurally.

  **Clara:** I see the equation, Ivan. I don't see the analysis. To write $BH = BT \times (1 - SH)$, you had to *already know* that Suzy's hit prevents Billy's hit. You built the causal conclusion into the premises of your model.

  **Ivan:** That's not circularity; that's representation. We're modeling the mechanism. The equation represents a distinct physical fact: the bottle can't shatter twice. Once Suzy's rock occupies that spacetime region, Billy's rock is excluded.

  **Clara:** But how do you test for causation using this model? You use interventions, right? You say $ST$ causes $BS$ if an intervention on $ST$ changes $BS$ while holding other variables fixed. Which variables?

  **Ivan:** We hold the *exogenous* variables fixed. $BT$ is exogenous. So we set $ST=0$, keep $BT=1$. In the actual world, $ST=1, BT=1 \rightarrow BS=1$. In the intervention world, $ST=0, BT=1$. Because $SH=0$, the equation for $BH$ yields $1$. So $BS=1$. Wait—

  **Clara:** *[Smiles]* Ah. So if you just hold $BT$ fixed, you get the same result as the counterfactualist. The bottle still shatters. Suzy still isn't a cause.

  **Ivan:** No, no. You're intervening on the *path*. We don't just check the outcome; we check the *route*. In the actual world, the path goes $ST \rightarrow SH \rightarrow BS$. The path $BT \rightarrow BH$ is cut off. When we evaluate Suzy's causality, we are testing the integrity of *her* path. We hold fixed the *actual value* of the off-path variable $BH$ at 0.

  **Clara:** There it is. "Hold fixed the actual value of $BH$." Why? Billy's rock *would* have hit if Suzy hadn't thrown. In the counterfactual scenario you're constructing to test Suzy, $BH$ *should* be 1. By forcing $BH$ to stay 0 while you set $ST$ to 0, you are artificially severing Billy's causal potential. You're rigging the test to make Suzy look like the cause.

  **Ivan:** I'm not rigging it. I'm isolating the *actual* causal process from the *backup* process. Causation isn't just about whether the effect happens; it's about how it happens. Suzy's rock actually hit the bottle. Billy's didn't. My model respects that intrinsic difference. Your counterfactuals wash it out because you only care about the truth value of the shattering across possible worlds.

  **Clara:** But "intrinsic process" is the magic word. How do you define that without using causal language? You say "hold $BH$ fixed at 0." But $BH=0$ is a *result* of Suzy's causality. You are using the effect of the cause to prove the cause exists. You're freezing the variable that records the preemption to prove the preemption happened. It's ad hoc. You look at the intuitive verdict—"Suzy did it"—and then you choose the variables and fixing conditions that yield that verdict.

  **Ivan:** That's a harsh read. It's not ad hoc; it's about *modularity*. A structural equation represents a mechanism that can be disrupted independently. I can intervene on Suzy's throw without changing the laws of physics that govern Billy's rock. But when I test Suzy's contribution, I want to know if *her* mechanism was sufficient. I hold the *other mechanism's input* ($BT$) fixed, but I evaluate the system's response.

  **Clara:** But in the standard interventionist definition of actual causation (the Halpern-Pearl stuff), you have to find a "contingency." You have to say, "There exists a setting of the off-path variables such that if Suzy hadn't thrown, the bottle wouldn't have shattered." To find that setting, you have to set $BH=0$ manually. You have to *force* Billy's rock to miss in the counterfactual world, even though in that world, nothing stops it.

  **Ivan:** Because we are asking: "Was Suzy's throw *part of the active process*?" Not "Was it necessary in the grand scheme of the universe?" If I'm a policy maker, I don't care about backup causes. I care about the lever I pulled. If I pull lever S, and the light goes on, S caused the light. Even if lever B was wired up to do it too. My framework is designed for manipulation, not metaphysical reduction.

  **Clara:** Aha! So you're conceding the metaphysical ground. You're saying interventionism isn't a theory of *what causation is*, it's a theory of *how we track it for control*.

  **Ivan:** I'm saying your quest for a reductive analysis in terms of non-causal counterfactuals is a wild goose chase. Lewis wanted to reduce causation to similarity of possible worlds. But similarity is context-dependent. "Closest possible world" is just as slippery as "holding fixed." When you say "If Suzy hadn't thrown...", do you hold fixed the laws? Do you allow a miracle? Do you let Billy's aim improve?

  **Clara:** We have principles for that. Minimal miracle, maximal match of particular fact.

  **Ivan:** Principles that conveniently shift whenever a counterexample like preemption shows up. Look, my variables aren't arbitrary. $SH$ and $BH$ represent distinct physical states. The equation $BH = BT \times (1 - SH)$ isn't a trick; it's a formalization of the collision physics. If Suzy's rock is there, Billy's isn't. That's a fact about the world, not my model.

  **Clara:** But to decide that $SH$ goes into the equation for $BH$, you need to know that $SH$ *causes* $\neg BH$. You need causal knowledge to build the causal model. So you haven't analyzed causation. You've just provided a calculus for propagating causal assumptions. It's a logic of causation, not an ontology.

  **Ivan:** And what's wrong with that? You want the ontology. I want the logic. When you do A/B testing at work, Clara, do you worry about the metaphysical reduction of "conversion"? Or do you worry about whether changing the button color *makes* the conversion happen, distinct from some confounder?

  **Clara:** I worry about identification. But I worry that your "identification" relies on assuming the graph structure is known. In the Suzy/Billy case, you assume the graph where $SH$ blocks $BH$. If I drew the graph where $ST$ and $BT$ both point to $BS$ directly, with no intermediate blocking variables, your method says neither is a cause. Or both are. It depends entirely on how I carve up the variables.

  **Ivan:** Variable granularity matters, yes. If you model the world as two boolean switches and a light, you lose the timing information. That's a modeling error, not a theoretical failure. If you include timing variables—$T_S$ and $T_B$—the equations handle preemption automatically without manual "freezing." $BS = 1$ if $\min(T_S, T_B) < \text{threshold}$. Cause is the minimum time.

  **Clara:** But then you've changed the definition of the variables to include the causal structure (time of impact) rather than just the events (throwing). You're smuggling the solution in by making the variables hyper-specific. Lewis would say you've abandoned the event-based ontology entirely.

  **Ivan:** Because events are messy. Processes are precise. Look, let's turn it around. You say my "freezing" is ad hoc. But your "similarity of worlds" is invisible. I can write down my equations. I can show you the matrix. When you say "In the closest world where Suzy doesn't throw, Billy's rock still hits," how do you measure that distance? It feels like intuition dressed up as modal logic. At least with my equations, I can show you exactly which assumption drives the result. If you disagree with the result, you can point to the equation $BH = BT \times (1 - SH)$ and say, "That's wrong." Can you point to a specific similarity metric in Lewis's system and say, "That's wrong"?

  **Clara:** *[Pauses, takes a sip of tea]* Fair point. The metric is often implicit. But the cost of your explicitness is that you can't handle cases where the mechanism is unknown. In science, we often want to know *if* there is causation to *discover* the structure. You need the structure to run the test. It's a catch-22.

  **Ivan:** It's iterative. We propose a model, test invariances, update the model. It's engineering, not theology.

  **Clara:** And that's where we diverge. I want to know what makes the claim "Suzy caused the shattering" *true*. You want to know what licenses us to *assert* it.

  **Ivan:** And I'd argue that without the license to assert it—without the ability to manipulate it—the truth condition is empty. If Suzy's throw makes no difference to the outcome under any valid intervention that respects the actual process, in what sense is it a cause? Just a poetic label?

  **Clara:** Because the energy transferred from her hand to the rock to the glass is a physical fact, independent of our models or interventions. Even if Billy was there. Your "freezing" of Billy's hit works because it tracks that physical process. But don't pretend the math does the heavy lifting. The math is just a mirror.

  **Ivan:** And your counterfactuals are just a story we tell ourselves about mirrors. But fine. Let's agree on this: Suzy broke the bottle.

  **Clara:** Agreed.

  **Ivan:** And if we want to stop bottles from breaking, we should stop Suzy, not Billy.

  **Clara:** *[Smiles]* On that, the model and the worlds agree.

  **Ivan:** Good enough for government work.

  **Clara:** Good enough for philosophy, too. For now.
