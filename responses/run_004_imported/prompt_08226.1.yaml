answer: |-
  You are not confused, and your syllabus is not contradictory. You have stumbled directly into the central fault line of contemporary conditional research.

  The short answer is: **Lewis's proof is valid, but it is not a refutation of truth-conditional semantics; it is a constraint on it.** Your professor presented one valid way to satisfy the constraint (drop truth conditions). Stalnaker, Kratzer, and von Fintel present other valid ways to satisfy it (modify how truth conditions work).

  Here is the breakdown of what Lewis actually showed, why your professor drew the moral they did, and how the semanticists you are reading "dodge" the bullet without whistling past the graveyard.

  ### 1. What Lewis Actually Proved (The Trilemma)
  Lewis's 1976 result is often summarized as "Conditionals aren't propositions." But strictly speaking, it proves a **trilemma**. You cannot hold all three of the following claims simultaneously without collapsing your probability space into triviality:

  1.  **Propositionality:** Conditionals ($A > C$) express propositions (they have truth conditions).
  2.  **The Equation:** The probability of the conditional equals the conditional probability ($P(A > C) = P(C|A)$).
  3.  **Standard Probability/Conditionalization:** We update beliefs via standard Bayesian conditionalization on fixed propositions.

  Lewis showed that (1) + (2) + (3) $\rightarrow$ Triviality.
  Therefore, to avoid triviality, **you must reject at least one.**

  ### 2. The Professor's Move: Reject Propositionality
  Your professor is advocating for the **Expressivist** or **Adams-style** position (associated with Ernest Adams, Dorothy Edgington, and Richard Jeffrey).
  *   **The Move:** They reject (1).
  *   **The View:** "If $A$, then $C$" does not express a proposition that can be true or false. It expresses a *conditional credence*. It is a speech act of qualifying your belief in $C$ by $A$.
  *   **The Moral:** Since it has no truth conditions, Lewis's proof doesn't kill it; the proof actually *supports* this view by showing that trying to assign truth conditions leads to disaster.
  *   **Is this "nobody serious"?** No. This is a highly respected position. However, claiming "nobody serious still thinks..." is lecture-hall rhetoric. Many serious people (including the authors you are reading) think truth conditions are necessary for compositionality and embedding, so they keep trying to save them.

  ### 3. The Semanticists' Move: Block the Derivation
  Stalnaker, Kratzer, and von Fintel generally want to keep (1) (or something close enough to it) because linguists need compositional semantics. If "if" doesn't contribute semantic value, it's hard to explain how conditionals embed under negation, disjunction, or other modals.

  They don't ignore Lewis; they argue that the assumptions required to *run* the triviality proof don't hold in natural language.

  #### A. Stalnaker: Context Dependence
  Stalnaker (who actually developed his semantics *before* Lewis's proof) responded by attacking the stability of the proposition.
  *   **The Trick:** Lewis's proof assumes that the proposition expressed by $A > C$ remains **fixed** when you conditionalize on new information.
  *   **Stalnaker's Counter:** The proposition expressed by a conditional depends on the *context* (specifically, the selection function which picks the "closest" $A$-world). When you learn new information (conditionalize), the context changes. If the context changes, the selection function changes. If the selection function changes, **the proposition expressed by $A > C$ changes.**
  *   **Result:** You cannot plug the *same* proposition into the probability formula before and after updating. The math of the triviality proof breaks because it assumes rigid propositions. Stalnaker saves truth conditions by making them hyper-context-sensitive.

  #### B. Kratzer: The Restrictor View
  Kratzer takes a different angle, one that might actually partially agree with your professor while still doing truth-conditional semantics.
  *   **The Trick:** Kratzer argues that "if" is **not a binary connective** at all. It is a *restrictor* on a covert modal operator.
  *   **The View:** In "If $A$, (must) $C$," the "if" clause doesn't form a proposition "$A > C$." Instead, it restricts the domain of the modal "must." The truth conditions belong to the whole modal claim, not a conditional proposition.
  *   **Result:** Lewis's proof targets binary connectives that form propositions. If there is no conditional proposition to begin with, Lewis's specific proof doesn't apply. However, unlike the Expressivist, Kratzer still assigns truth conditions to the *sentence as a whole*, allowing it to compose with logic. This is a technical dodge, but a robust one.

  #### C. Von Fintel (and Gillies): Dynamic Semantics
  Von Fintel often works within a framework where meaning is defined by *context change potential* rather than static truth conditions.
  *   **The Trick:** Similar to Stalnaker, but more radical. Updating on a conditional isn't just learning a fact; it's changing the rules of the conversation (the modal base).
  *   **Result:** They argue that the Equation ($P(A > C) = P(C|A)$) holds for *acceptability* or *assertibility*, but not necessarily for the probability of a static truth-conditional content across updates. They manage the triviality result by distinguishing between the *content* of the conditional and the *update* it performs.

  ### 4. So, who is right?
  Neither side is "in denial." They are prioritizing different data points.

  *   **The Expressivists (Your Professor)** prioritize the intuition that conditionals behave probabilistically exactly like conditional probabilities (The Equation). They are willing to sacrifice logical embedding (conditionals inside other conditionals, negations, etc.) to save this.
  *   **The Truth-Conditionalists (Stalnaker/Kratzer)** prioritize the linguistic data that conditionals embed logically ("It is not the case that if $A$, $C$"). They are willing to complicate the semantics (context-shifting, restrictors) to save compositionality, even if it means The Equation only holds approximately or contextually.

  ### 5. How to navigate your seminar
  You are in a great position because you see the tension clearly. Here is how to frame your thinking (and your discussion contributions):

  1.  **Don't view Lewis as a death knell.** View it as a "No-Go Theorem." It tells you what you *can't* have. It doesn't tell you which assumption to drop.
  2.  **Recognize the Professor's Bias.** Your professor is likely philosophically inclined toward Expressivism (common in philosophy departments). They presented the Expressivist solution as the *only* solution.
  3.  **Read Stalnaker/Kratzer as "Engineering Solutions."** When you read them, look for the specific mechanism they use to block Lewis.
      *   *Ask:* "Does this author assume the proposition stays fixed across updating?" (If no, they are using the Stalnaker defense).
      *   *Ask:* "Does this author treat 'if' as a connective or a restrictor?" (If restrictor, they are using the Kratzer defense).
  4.  **The "Whistling" Charge:** It is unfair to say they are whistling past the graveyard. They are building fences around the graveyard. They acknowledge the result but argue their specific semantic machinery prevents the collapse.

  **Summary for your notes:**
  Lewis proved you can't have **Fixed Propositions + The Equation + Non-Trivial Probabilities**.
  *   **Professor:** Drop Fixed Propositions (Expressivism).
  *   **Stalnaker:** Drop Fixed Propositions (Contextualism). *Wait, isn't this the same?* No. Stalnaker keeps truth conditions, but the *content* shifts with context. The Professor says there *are* no truth conditions.
  *   **Kratzer:** Drop the idea that "if" forms a proposition at all (Restrictor Theory), but keep truth conditions for the modal claim.

  You are seeing the field work as intended: a proof established a boundary, and different theorists are mapping the territory on different sides of the line. Neither is confused; they just chose different survival strategies.
