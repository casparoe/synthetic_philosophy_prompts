prompt: |-
  So in my seminar on conditionals (it's cross-listed between philosophy and linguistics) we just spent two sessions on Lewis's 1976 triviality proof -- the one showing you can't have P(A > C) = P(C|A) survive across conditionalization without the whole probability space collapsing down to something like two possibilities that actually get any weight. I definitly followed the actual math ok, but the big philosophical moral our professor drew at the end of lecture was basically: "this is why nobody serious still thinks indicative conditionals have truth conditions anymore -- the Equation can't be reconciled with 'if A, C' being a genuine proposition, so it's really just a conditional assertion of credence dressed up in subject-predicate clothes." A classmate pushed back a little in discussion section but didn't really land a counterargument, so the claim kind of just stuck with me.

  Except now this week's readings are Stalnaker and then Kratzer and von Fintel, and all three are very much still doing truth-conditional, compositional semantics for "if," treating the triviality result like a complication to be managed rather than a career-ending problem for the whole project. So now I don't know what to think: did Lewis's proof actually establish that indicative conditionals can't have truth conditions, is there some standard move that lets truth-conditional theorists dodge the result, or are Stalnaker/Kratzer/von Fintel just kind of whistling past the graveyard here? I guess what I really want is to understand what the triviality result does and doesn't actually show, because right now it feels like half my syllabus is either confused or in denial and I can't tell which it's supposed to be.
