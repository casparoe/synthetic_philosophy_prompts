      *   *Check:* Is VCG "Dictatorial"? No.
      *   *Check:* Is VCG "Strategy-Proof"? Yes (DSIC).
      *   *Check:* Does G-S apply? G-S requires the domain to be $\mathbb{L}(X)^n$ (all linear orders). VCG domain is a subset of this.
      *   *Key Insight:* The set of alternatives $X$ in G-S is finite. In VCG, if transfers are continuous, $X$ is infinite. Does G-S hold for infinite $X$? Yes, generally, but the domain restriction is the killer. Even with finite money levels, QL is a restriction.
      *   *Better framing:* Often, G-S is presented as choosing among alternatives $A$. In auctions, we choose an allocation $k \in K$. But the mechanism outputs $(k, t)$. If we view the mechanism as mapping reports to $K$ only, it's not SP (I'd lie to lower price). If we view it as mapping to $(K, T)$, the preferences over $(K, T)$ are restricted.
      *   *Standard Textbook Resolution:* The G-S theorem assumes **no transfers** (or that transfers are not part of the utility function in a linear way). The VCG mechanism relies on **Quasi-Linear Preferences**. This is a proper subset of the universal domain required for G-S.

