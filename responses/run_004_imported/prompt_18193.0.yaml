  10. **Final Polish:** Ensure tone is appropriate for a PhD peer (respectful, rigorous, no fluff). Make sure to distinguish between the "outcome" in social choice (the social state) vs. the "allocation" in mechanism design.

      *(Self-Correction during drafting)*: I should also mention that G-S is about *social choice functions* (mapping preferences to outcomes), while VCG is a *mechanism* (mapping messages to outcomes). But since VCG is DSIC, the equilibrium mapping is effectively an SCF. So the comparison holds. The critical difference remains the preference domain.

