      *   *Chemist Analogy:* Use solubility. Salt is soluble. If I wrap it in plastic (cable), it doesn't dissolve. Is it still soluble? Yes. If wrapping it in plastic chemically reacts with the salt to make it insoluble (growth point), that's different.
