answer: |-
  The silence in the conference room was heavier than the bulletproof glass. Minister Ilo of the Hem delegation had pushed his chair back, the screech of metal on tile cutting through the air like a siren. Across the table, Ambassador Vance of the Keld delegation looked genuinely bewildered, his hands spread wide in a gesture of placation that only seemed to make Ilo angrier.

  "We cannot negotiate with people who insist on calling us *Rask*," Ilo said, his voice low but vibrating through the translation headsets. "It is a term of ownership. It is a slur."

  Vance sighed, rubbing his temples. "Minister, we have been over this. In Keldish, *Rask* simply means 'People of the Southern Valley.' It is the geographic descriptor. It is in the dictionaries. It is neutral. You are inventing offense to stall the treaty."

  "I am leaving," Ilo said. He stood up.

  "Wait," Elara said.

  It was a breach of protocol. Interpreters were ghosts; they were not supposed to have voices of their own. But Elara was the only person in the room who spoke Keldish, Hemish, and the pidgin trade-tongue they were using for the draft. She was the bridge, and the bridge was collapsing.

  Vance looked at her, annoyed. "Elara, translate my point. The term is descriptive."

  "I cannot," Elara said, taking off her headset. She placed it gently on the table. "Because Ambassador, you are linguistically incorrect. And Minister, you are pragmatically correct, but for the wrong reason."

  The room froze. The UN mediator, a weary Swiss man named Dubois, leaned forward. "Elara? Please explain."

  Elara stood, turning first to Vance. "Ambassador, you believe language is a code. You think that if the definition in the dictionary says *Rask = Southerner*, then using the word conveys only that information. You are arguing for a semantic view. You think the truth conditions of the sentence 'The Rask agree to the border' are identical to 'The Hem agree to the border.'"

  Vance nodded slowly. "Obviously. They are the same people."

  "They are not," Elara said. She turned to Ilo. "Minister, you hear the word *Rask* and you hear the history of the Occupation. You hear your grandparents being rounded up. You feel the contempt. You argue that the word is prohibited, that it is toxic regardless of intent."

  Ilo crossed his arms. "It is toxic."

  "It is," Elara agreed. "But not because of the history. Because of the grammar."

  She walked to the whiteboard at the side of the room and picked up a marker. She wrote the word **RASK**.

  "In Old Keldish," Elara began, "nouns referring to sentient groups required an *Autonomy Marker*. A suffix. *-en*. *Rask-en*."

  She wrote **RASK-EN** next to it.

  "This marker indicated that the noun was an agent, a self-determining entity. If you referred to a group without the marker, you were grammatically classifying them as objects, or livestock, or resources. *Rask* without *-en* meant 'Southern labor units.' *Rask-en* meant 'Southern People.'"

  Vance frowned. "That suffix fell out of common usage fifty years ago. It's archaic. Nobody uses it. It's like saying 'thou' instead of 'you.' We aren't being archaic; we're being modern."

  "It didn't fall out of usage," Elara corrected sharply. "It was *suppressed*. During the Occupation, the Keld administration removed the *-en* from official documents to dehumanize the Hem population. It was a bureaucratic policy. When the war ended, the Keld public stopped using it because it was easier. But it never became grammatically optional. It became a *conventional implicature*."

  Dubois leaned in. "Explain that in plain terms, Elara."

  Elara turned to face them both. "Think of the difference between the words 'and' and 'but.' Semantically, they do the same thing. They join two clauses. 'He is poor *and* he is happy.' 'He is poor *but* he is happy.' The facts are the same. But 'but' carries an extra layer of meaning—a contrast, a surprise. You can't say 'but' without implying that contrast."

  She tapped the whiteboard.

  "*Rask* is the same. Semantically, it denotes the Hem people. But conventionally, it implicates a lack of autonomy. When you say *Rask*, Ambassador, you aren't just naming them. You are grammatically asserting that they are objects. You aren't being 'oversensitive,' Minister. You are hearing a grammatical claim of dominance."

  Vance looked at the board. "So you're saying our language forces us to be racists?"

  "I'm saying your language has a mechanism for respect that you chose to stop using," Elara said. "The Hem aren't asking you to change the word. They are asking you to restore the suffix. They are asking you to acknowledge their agency in the syntax."

  Ilo looked at Vance. "We do not ask for much. Just the *-en*."

  Vance bristled. "If we add the suffix, it looks like an admission of guilt. It looks like we are saying, 'We were wrong for the last fifty years.' My parliament will never ratify a treaty that linguistically admits to dehumanization."

  "And my people will never sign a treaty that grammatically enacts it," Ilo countered.

  The deadlock returned, heavier than before. The linguistics hadn't solved it; it had just clarified the stakes. It wasn't about feelings; it was about the structure of reality as defined by Keldish grammar.

  Elara capped the marker. She had one more card. It was a risk. It relied on the Anderson-and-Lepore side of the theory—the idea that the prohibition is social, not semantic.

  "There is a third option," Elara said.

  Both men looked at her.

  "The slur... the offensiveness... it resides in the *common ground*," Elara said. "It resides in the assumption that the Keld have the right to name the Hem. As long as the Keld use the exonym *Rask*, even with the *-en* suffix, it implies you own the right to label them."

  She turned to Ilo. "Minister, what is your endonym? The word you use for yourselves in your own tongue?"

  "*Saeli*," Ilo said.

  Elara turned to Vance. "Ambassador, does Keldish have a phonetic approximation for *Saeli*?"

  Vance hesitated. "We... we usually just translate it to *Rask*."

  "Stop," Elara said. "In the treaty text, do not use *Rask*. Do not use *Rask-en*. Use *Saeli*. Transliterated."

  Vance blinked. "You want us to speak Hemish?"

  "I want you to borrow the word," Elara corrected. "When you borrow a term for a group of people from their own language, the autonomy marker is unnecessary. The autonomy is baked into the loanword. It bypasses the Keldish grammatical hierarchy entirely. It's not a Keldish noun anymore. It's a proper noun."

  She looked between them. "Ambassador, this allows you to keep your grammar. You aren't adding the suffix, so you aren't admitting to the old policy. Minister, this allows you to be named by your own choice, not by their geography. The slur isn't in the sound. It's in the authority to assign the sound."

  Vance looked at Ilo. Ilo looked at Vance.

  The silence stretched. Elara held her breath. She knew the theory held up. Borrowed endonyms neutralize conventional implicatures because they shift the source of the label from the speaker to the subject. It was the only way to satisfy the semantic requirement of the Keld (using a noun they can pronounce) and the pragmatic requirement of the Hem (controlling their own designation).

  Vance cleared his throat. " *Saeli*," he said. The word sounded clumsy in his mouth, thick with the Keldish accent. He winced. "Is that... acceptable?"

  Ilo stared at him. He looked at Elara, then back to Vance. He sat down slowly.

  "It is," Ilo said softly. "It is acceptable."

  Vance exhaled, a long, shuddering breath. "Then let us draft the preamble. The *Saeli* and the Keld..."

  Elara put her headset back on. She adjusted the microphone. The static hissed, a white noise filling the void where the conflict had been. She watched them shake hands across the table. It wasn't peace, not yet. It was just syntax. But sometimes, if you get the grammar right, the world follows.

  "Interpreting," Elara said into the mic, her voice steady. "Proceed."
