      *   **Situation:** Informal bug bounty program ($5k for critical vulns). No written contract, just a public promise.
      *   **Event:** Researcher found a critical vuln, reported privately (anonymous email), asked for no credit. Startup patched it. No data exposed.
      *   **Dilemma:** Researcher is anonymous. No legal/reputational pressure to pay. User thinks keeping the money is "economically sensible" but feels uneasy.
      *   **Question:** Is declining to pay rational, or is the unease pointing to a flaw?

  2.  **Initial Assessment & Ethical/Legal/Business Analysis:**
      *   *Legal:* Is there a contract? In many jurisdictions, a public offer (unilateral contract) accepted by performance (finding and reporting the bug) creates a binding obligation, even without a signature. However, enforcement is hard if the researcher is anonymous.
      *   *Reputational:* If word gets out (and it often does in security circles), the startup becomes toxic to security researchers. Future bugs won't be reported; they'll be sold on the black market or exploited.
      *   *Ethical:* It's a promise. Breaking it violates trust. The researcher acted ethically; the company would be acting unethically.
      *   *Economic:* Short-term gain ($5k) vs. Long-term risk (future breaches, loss of trust, potential legal costs if identity is revealed later).
      *   *Psychological:* The user's unease is a moral compass signal. Ignoring it leads to cognitive dissonance and culture rot.

  3.  **Deconstruct the "Economically Sensible" Argument:**
      *   *Premise:* Danger passed + No pressure = Save money.
      *   *Flaw 1 (Future Risk):* Security is ongoing. You need good will for the *next* bug.
      *   *Flaw 2 (Information Leakage):* Anonymous researchers talk. They have handles, forums, networks. "Don't pay Company X" spreads fast.
      *   *Flaw 3 (Internal Culture):* What does this say to employees? "We lie when we can get away with it."
      *   *Flaw 4 (Legal Risk):* Unilateral contracts exist. If the researcher reveals identity later (e.g., via blockchain analysis of crypto payment, or slip-up), they could sue.

  4.  **Formulate the Advice:**
      *   **Validate the Unease:** Acknowledge that the feeling is correct. It's not just emotion; it's risk assessment.
