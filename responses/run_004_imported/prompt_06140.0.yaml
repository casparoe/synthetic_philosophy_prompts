  8.  **Final Polish:** Check against the "no vague answers" constraint. Ensure the distinction between Sidgwick's "elimination of error" and modern "statistical significance" is sharp. (This is the crux of the Bem argument).

  **(Self-Correction Note):** I need to be careful not to paint Sidgwick as a woo-woo believer. He was a agnostic seeker. The key is his *epistemic rigor*.

  9.  **Final Output Structure:**
      *   Intro: Acknowledge the depth of the rabbit hole.
      *   Part 1: Sidgwick vs. Modern Parapsychology (The Epistemology). Focus on Bem/Replication.
      *   Part 2: The Ethical Connection (The Dualism). Explain the link.
