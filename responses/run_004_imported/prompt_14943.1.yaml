  2.  **Deconstruct Rousseau's *Letter to d'Alembert*:**
      *   *Context:* D'Alembert (Encyclopédiste) suggested Geneva build a theater to "civilize" the populace. Rousseau (Genevan citizen) wrote a massive rebuttal.
      *   *Core Argument:* It's not just "theater is bad." It's about *authenticity*, *community*, and *alienation*.
      *   *Key Point 1: The Actor's Profession.* Rousseau hated the *job* of acting. Why? Because an actor's livelihood depends on pretending to be someone else. They sell their personhood. This creates a habit of insincerity that bleeds into real life. "The talent of the actor consists in putting himself in another's place... Is it not a mean and mercenary trade?"
      *   *Key Point 2: Spectatorship.* Watching theater makes you passive. You feel emotions (pity, fear) in the theater but don't act on them in real life. It substitutes *feeling* for *doing*.
      *   *Key Point 3: Community vs. Isolation.* Theater isolates people in the dark. Rousseau preferred public festivals where *the people are the spectacle* (dancing, singing together in the light).
      *   *Key Point 4: Opinion and Appearance.* Theater reinforces the rule of *amour-propre* (vanity/social comparison) over *amour de soi* (natural self-love). It makes us care more about how we appear than who we are.

  3.  **Connect Rousseau to Streaming/Influencer Culture:**
