      *   **Trigger:** Their sister (a philosophy PhD) mentioned Jean-Jacques Rousseau's *Letter to d'Alembert on Spectacles* (*Lettre à d'Alembert sur les spectacles*).
      *   **Knowledge Level:** User knows the pop-summary ("theater corrupts people") but wants the *real* reasoning.
      *   **Core Question:** What was Rousseau's actual argument about actors/spectacle, and how would it apply to modern streaming/influencer culture? Is it the same problem or different?
