answer: |-
  Here is the bottom line: **Yablo's determinable/determinate move is ingenious, but it does not get non-reductive physicalism (NRP) off the hook. It merely relocates the exclusion problem from a logical conflict to a metaphysical one.**

  While I find Yablo's account of causal *relevance* superior to Kim's, Kim remains more convincing on the question of causal *power*. Yablo successfully shows that mental and physical properties need not be *rivals*, but he fails to show that the mental property possesses causal force independent of its physical base. Consequently, the exclusion problem resurfaces as a problem of ontological priority: if the mental causes only *in virtue of* the physical, the mental is still causally derivative, which undermines the robust causal autonomy NRP seeks to protect.

  ### The Core Conflict

  Kim's exclusion argument rests on a simple, brutal arithmetic of causation. If the physical domain is causally closed (every physical effect has a sufficient physical cause) and we reject systematic overdetermination, there is no "causal slack" left for the mental to occupy. If $P$ (the neural state) causes $P^*$ (the behavior), and $M$ (the belief/desire) supervenes on $P$, $M$ looks like a shadow cast by $P$. It tracks the causation, but it doesn't *do* it.

  Yablo counters this by attacking the assumption that $M$ and $P$ are competitors. Using the Sophie the Pigeon analogy, he argues that "Red" (determinable) and "Scarlet" (determinate) do not compete for causal status. If Sophie pecks at red, citing "Scarlet" as the cause is too specific (what if it was crimson?), and citing "Red" is proportional. Since mental properties are arguably determinables of physical determinates, $M$ and $P$ stand in a relation of compatibility, not competition. Therefore, the Exclusion Principle (which forbids distinct sufficient causes) never triggers.

  ### Why Yablo's Move is Insufficient

  Yablo's argument is compelling if you view causation primarily as a matter of **explanatory selection**. If the question is "Which property best *explains* the effect?", Yablo wins. The mental property is often more proportional to the effect than the micro-physical details. However, the exclusion argument is not about explanation; it is about **ontological production**. Here, Yablo's solution leaks.

  **1. The Disanalogy of Dependence**
  The relation between *Scarlet* and *Red* is arguably conceptual or logical. It is analytic that if something is scarlet, it is red. However, the relation between a mental state and a physical state is widely considered to be metaphysically contingent (even if necessary in a posteriori sense). The physical *constitutes* the mental in a way that feels more robust than the determinable relation.
  In the Sophie case, the redness doesn't "ride on the coattails" of the scarlet-ness in a way that suggests the redness is inert. But in the mind-body case, the physical realizer is the *ontological ground*. If you remove the physical, the mental vanishes. If you remove the scarlet, the red vanishes. But the physical has energy, momentum, and force; the mental does not. Yablo shows they don't compete, but he doesn't explain how the mental *contributes* force if the physical is already sufficient.

  **2. The Relocation of Exclusion**
  Yablo dissolves the *competition*, but he inadvertently confirms the *dependency*. By arguing that $M$ and $P$ are not distinct competitors, Yablo concedes that $M$'s causal status is entirely parasitic on $P$.
  This relocates the exclusion problem. The new question is: **"In virtue of what does the mental cause the effect?"**
  If the answer is "In virtue of the physical realizing it," then the physical is still doing the heavy lifting. The mental property is causally relevant only because it tracks the physical property that actually possesses the causal power. This preserves a form of epiphenomenalism: the mental is a causally inert marker for the physical cause. NRP wants the mental to be *real*, not just a useful label for physical causation. Yablo saves the label, but not the reality.

  **3. Causal Closure Remains a Threat**
  Kim's strongest premise is the Causal Closure of the Physical. Even if $M$ and $P$ don't compete, closure dictates that the physical chain is sufficient. If $P$ is sufficient for $P^*$, and $M$ supervenes on $P$, $M$ is not *needed* for the transaction to occur in the physical world. Yablo's proportionality argument suggests $M$ is a *better* description of the cause, but it doesn't deny that $P$ is a *sufficient* producer of the effect. As long as $P$ is sufficient, $M$'s causal contribution remains derivative.

  ### Why Kim is More Convincing on Ontology

  Kim wins this debate because he forces us to confront the metaphysical cost of NRP. Yablo offers a way to talk about mental causation without contradiction, but Kim exposes that this talk might lack ontological backing.

  If we accept Yablo, we save mental causation from logical exclusion, but we sacrifice its **causal autonomy**. The mental becomes a "determinable" shadow of the physical. While this avoids the charge of overdetermination, it succumbs to the charge of **causal drainage**: all causal power drains down to the fundamental physical level, leaving the higher levels with only causal *relevance* (explanatory utility) but no causal *oomph* (productive power).

  For a non-reductive physicalist who wants mental properties to be genuinely real and efficacious—not just convenient fictions for tracking physical states—this is a pyrrhic victory. Kim correctly identifies that without reduction (identifying $M$ with $P$), you cannot grant $M$ independent causal power without violating closure. Yablo tries to have it both ways by changing the definition of causation to fit the exclusion, but he cannot escape the fact that in a physically closed world, the physical base is the engine, and the mental is the dashboard readout. The readout is proportional to the speed, but it doesn't make the car move.

  ### Conclusion

  Yablo's determinable/determinate move is the best defense NRP has, but it is ultimately a defensive maneuver that concedes the metaphysical high ground. It shows that mental and physical causes are compatible, but it fails to demonstrate that the mental cause is anything more than a structural feature of the physical cause.

  Therefore, **Kim's exclusion argument remains more convincing** regarding the ontology of causation. Yablo successfully argues that we are *justified in citing* mental causes, but he does not prove that mental properties possess causal powers that are not wholly exhausted by their physical realizers. The exclusion problem is not solved; it is merely transformed from a logical contradiction into a problem of ontological free-riding.
