prompt: |-
  So Kim's causal exclusion argument is supposed to show that non-reductive physicalism can't give mental properties any real causal work, since the physical realizer is already doing enough on it's own to produce the effect. Yablo tried to counter this with his determinable/determinate move - the example of Sophie the pigeon, trained to peck at red, that's shown a scarlet target, where redness and scarlet-ness don't compete to be the "real" cause of the peck. Does that actually get non-reductive physicalism off the hook, or does it just relocate the exclusion problem up a level? Compare the two and tell me which side you find more convincing, not just a neutral summary.
