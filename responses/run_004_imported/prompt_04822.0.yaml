answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two grad students, ELENA (political theory/social choice) and MARCUS (behavioral economics), are surrounded by open notebooks and half-empty mugs.*

  **Elena:** So, your friend isn't *wrong*, strictly speaking. Arrow's Impossibility Theorem explicitly assumes the input is an ordinal ranking. A preference ordering. If you switch the input to cardinal utilities—score voting, range voting—you have technically stepped outside the theorem's domain. It's like saying, "Arrow proved no vehicle with four wheels can fly," and then building a helicopter.

  **Marcus:** Exactly. It's not a semantic trick; it's a model expansion. Arrow's framework assumes we can only say "I prefer A to B." But in reality, I prefer A to B *much more* than I prefer B to C. Ordinalism throws away intensity information. Score voting captures it. If you have more information, you can overcome impossibility results.

  **Elena:** But here's the Arrovian pushback, and this is where I think your friend is being too breezy. Arrow's conditions aren't just arbitrary rules; they're meant to capture democratic fairness. Specifically, Independence of Irrelevant Alternatives (IIA). If voters are honest, Score Voting satisfies IIA. But are they ever honest?

  **Marcus:** In lab settings? Often, yes. In low-stakes elections? Yes.

  **Elena:** In high-stakes political elections? No. Once there's an incentive to win, rational voters normalize. They give their favorite a 10 and their least favorite a 0. If I'm a utilitarian maximizer, giving my second choice an 8 when my favorite has a 5% chance of winning is throwing away leverage. I should bump my favorite to 10 and drop the second choice to 0 to maximize the differential.

  **Marcus:** That's the "strategic exaggeration" argument. But that collapses Score into Approval Voting, not necessarily back into strict ordinal ranking. Approval is still cardinal in the sense that it allows ties and thresholds.

  **Elena:** Does it? If everyone min-maxes, the "score" just becomes a count of who is in the "top tier." That is functionally equivalent to a plurality or ranking of the top tier. But the deeper issue is **Interpersonal Comparability of Utility**. Arrow's theorem sidesteps this by saying, "We don't know if your '10' is the same as my '10'." Score Voting *requires* us to assume they are comparable enough to sum.

  **Marcus:** And that's a reasonable assumption. We make interpersonal comparisons all the time. If I say, "This policy causes me mild inconvenience," and you say, "This policy causes me destitution," society aggregates that. We don't say, "Well, utility is ordinal, so we can't compare." We accept that intensity matters. If Score Voting allows me to express that my stake is higher than yours, that's a feature, not a bug.

  **Elena:** But whose utility function are we summing? If I'm an intense zealot and you're a moderate, my "10" is a scream and your "10" is a hum. If we just sum the scores, the zealot wins. Arrow's ordinalism acts as a firewall against that. It forces one-person-one-vote equality of *influence*, rather than equality of *satisfaction*. By allowing cardinal inputs, you aren't escaping Arrow; you're just hiding the impossibility inside the utility measurement. You've swapped the "No Dictator" condition for a "No Common Utility Scale" problem.

  **Marcus:** That's a fair critique, but it's pessimistic. You're assuming the scale is arbitrary. But if we assume voters share a common culture or context, the scales correlate. Plus, look at the Gibbard-Satterthwaite theorem. That applies to ordinal systems—all are manipulable. Score Voting is also manipulable, sure. But the *degree* of manipulation required is higher. In ordinal systems, I just have to rank you lower. In Score, I have to guess *how much* lower to score you to optimize the outcome without wasting my vote. It adds cognitive friction that discourages pure strategy.

  **Elena:** I'm not convinced the friction holds in the age of polling and smart ballots. But let's go back to IIA. If voters strategize based on who is viable, the presence of a "spoiler" candidate changes how I score the frontrunners. If Candidate C enters the race, I might drop Candidate B from a 9 to a 0 because C splits the vote, even if my internal utility for B hasn't changed. That violates IIA.

  **Marcus:** That violates IIA *under strategic voting*. But Arrow's theorem holds even under *honest* voting. That's the distinction. Arrow says: "Even if everyone tells the truth, no system works." Score Voting says: "If everyone tells the truth, this system works perfectly." The failure mode of Score is strategic, not structural. The failure mode of Ranked Choice or Plurality is structural *and* strategic.

  **Elena:** But is "honest voting" a stable equilibrium? In game theory terms, honest voting in Score isn't a Nash Equilibrium in close races. If I know you're voting honestly, my best response is to strategize. So the system naturally pushes toward the strategic equilibrium where, as I said, the cardinal information evaporates. You end up with a system that *looks* cardinal but *acts* ordinal in the limit. So, have you really escaped Arrow, or just delayed the collapse?

  **Marcus:** You're treating the collapse as inevitable. I'd argue that in large elections with many candidates, the probability of being pivotal is so low that "honest voting" becomes a weakly dominant strategy for many people. They vote their utility because the cost of strategizing outweighs the benefit. So you retain that cardinal information in the aggregate.

  **Elena:** Maybe. But let's look at the "Unrestricted Domain" axiom. Arrow assumes any possible ordering of preferences is valid. Score Voting assumes any possible assignment of numbers is valid. But if we accept that utilities are comparable, we are essentially imposing a restriction on the *type* of preferences allowed—specifically, that they are measurable on a common scale. If two voters have incommensurable utility functions, the system breaks. Arrow's genius was showing that without assuming comparability, you hit a wall. Score Voting assumes the ladder exists to climb the wall. I'm just asking: does the ladder lean against anything?

  **Marcus:** It leans against human psychology. We can calibrate. We use "0" for "worst imaginable" and "10" for "best imaginable." It's not perfect, but it's better than forcing me to rank Candidate A above B when I'm indifferent, or when I hate A but only slightly dislike B. The loss of information in ordinal systems is massive. Arrow's Theorem is a proof about the limits of *ordinal* aggregation. It's not a law of physics. It's a law of a specific data type.

  **Elena:** I agree it's not a law of physics. But I think you're underestimating the normative weight of Arrow. The theorem tells us that if we want to treat voters as equals without comparing the "size" of their desires, we cannot have a perfect system. Score Voting solves the math by reintroducing the comparison of desires. But that introduces a new ethical problem: Why should the person with the more volatile, extreme utility scale have more weight? If I feel everything at 10/10 intensity and you feel everything at 5/10 intensity, and we vote honestly, I effectively get double your voting power.

  **Marcus:** That's the "intensity weighting" objection. But isn't that democratic? If I care twice as much as you, why shouldn't my vote count twice as much?

  **Elena:** Because democracy is about equal *agency*, not equal *satisfaction*. If we weight by intensity, we incentivize extremism. I can game the system just by psyching myself up to feel more strongly.

  **Marcus:** Or, we incentivize engagement. But look, let's meet in the middle. Does Score Voting escape Arrow's Theorem? Mathematically, yes. The axioms don't apply. Does it escape the *spirit* of Arrow? That's the real debate.

  **Elena:** Precisely. The spirit of Arrow is that there is no perfect way to aggregate individual wills into a social will without a dictator or imposing a specific structure on those wills. Score Voting imposes a structure: cardinal utility with interpersonal comparability.

  **Marcus:** And I'd say that structure is *less* imposing than forcing ordinal rankings. It's closer to how humans actually experience choice. Arrow's world is a world of robots who can only say "A > B." Score Voting is a world of humans who can say "I love A, I tolerate B."

  **Elena:** But those robots are immune to the "zealot problem."

  **Marcus:** And those humans are immune to the "Condorcet Loser" problem.

  **Elena:** *(Laughs)* Touché. Okay, so here's the synthesis: Score Voting escapes Arrow only if you accept that utility is cardinal and comparable. If you accept that, Arrow doesn't apply. If you don't accept that, Score Voting collapses into a strategic ordinal game, and Arrow's ghost comes back to haunt you via Gibbard-Satterthwaite and the loss of IIA.

  **Marcus:** So the disagreement isn't about math. It's about philosophy. Do we believe utility is a real, measurable thing that we can sum across people?

  **Elena:** I believe it's a useful fiction for economics, but a dangerous one for voting rights.

  **Marcus:** And I believe it's the only way to get past the paralysis of impossibility theorems.

  **Elena:** So, your friend is right that it escapes the theorem. But you're wrong if you think that means the problem is "solved."

  **Marcus:** And you're right that the problem isn't solved. But you're wrong if you think Score Voting is just a semantic dodge. It's a genuine paradigm shift, with its own risks.

  **Elena:** *(Raises coffee cup)* A genuine paradigm shift with a strategic collapse failure mode?

  **Marcus:** *(Clinks mug)* Better than a structural impossibility with a strategic collapse failure mode.

  **Elena:** I'll drink to that. But I'm still voting Ranked Choice.

  **Marcus:** Of course you are.
