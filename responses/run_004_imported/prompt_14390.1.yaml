      *   *Point 1: Normativity.* This is the big gun. "Is" vs. "Ought." Brain scans show "is." Meaning involves "ought."
      *   *Point 2: Error.* How does the brain scan distinguish a mistake from a different rule?
      *   *Point 3: Kripke's Text.* Cite the specific arguments against dispositions (finitude, normativity).
