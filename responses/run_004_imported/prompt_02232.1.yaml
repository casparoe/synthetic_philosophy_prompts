answer: |-
  Your skepticism is well-founded. Your reading group is significantly overselling what Harsanyi's Aggregation Theorem proves. While the theorem is a cornerstone of social choice theory, the claim that it mathematically forces **equal-weight** utilitarianism and renders **prioritarianism** incoherent is incorrect.

  Here is a breakdown of where your group's interpretation goes wrong and how you can push back.

  ### 1. The Theorem Proves Linearity, Not Equality
  Harsanyi's theorem (1955) states that if:
  1.  Individuals satisfy the von Neumann-Morgenstern (vNM) axioms (they are expected utility maximizers).
  2.  Society satisfies the vNM axioms (society acts like a single rational agent).
  3.  The **Pareto Principle** holds (if everyone prefers $A$ to $B$, society prefers $A$ to $B$).

  Then, the social welfare function ($W$) must be a **linear combination** of individual utility functions ($u_i$):
  $$W = \sum_{i=1}^{n} a_i u_i + b$$
  where $a_i \geq 0$.

  **The Catch:** The theorem does **not** determine the values of the weights $a_i$. It allows for $a_1 = 100$ and $a_2 = 1$. It allows for a dictator (where one $a_i > 0$ and the rest are 0).
  *   **Your Counter:** Harsanyi's theorem proves *weighted* utilitarianism is the only coherent form *if* you accept the axioms. It does **not** prove *equal* weights. To get equal weights ($a_i = a_j$), Harsanyi had to introduce a separate ethical argument (the "Impartial Observer" or "Veil of Ignorance" argument). That is a normative ethical assumption, not a mathematical derivation from the aggregation theorem itself.

  ### 2. The Problem of Interpersonal Comparison
  The theorem treats individual utilities ($u_i$) as cardinal numbers that can be summed. However, vNM utility functions are only unique up to **positive affine transformations** ($u' = au + b$, where $a > 0$).
  *   My utility scale might range from 0 to 10.
  *   Your utility scale might range from 0 to 1,000,000.
  *   If we just sum them, your preferences dominate mine simply because of how we calibrated our scales.

  To make the sum meaningful, you must fix the zero point and the unit of measurement for every individual. This requires **interpersonal comparisons of utility**.
  *   **Your Counter:** The theorem assumes utilities are comparable. Deciding *how* to make them comparable (how to normalize the scales) is a profound ethical choice, not a mathematical one. You cannot get "equal consideration" out of the math without putting "equal consideration" into the calibration of the utility functions.

  ### 3. Prioritarianism is Not a "Mathematical Error"
  Your group claims prioritarianism (giving extra weight to the worse off) is formally inconsistent. This is a misunderstanding of what prioritarianism entails in the context of risk and social choice.

  Prioritarianism typically suggests a social welfare function like $W = \sum g(u_i)$, where $g$ is a concave function (giving more weight to gains at lower utility levels).

  **Why Harsanyi seems to rule it out:**
  If $u_i$ are vNM utilities, then $g(u_i)$ is **not** a vNM utility function (because it violates the linearity required by the Independence Axiom). Therefore, if society maximizes a prioritarian function, **society is not an expected utility maximizer** in the vNM sense.

  **Why this isn't an error:**
  Harsanyi's theorem is a conditional statement: *IF* society is an EU maximizer *AND* Pareto holds, *THEN* utilitarianism follows.
  *   A prioritarian does not accept the premise that **Society** must satisfy the **Independence Axiom**.
  *   **Peter Diamond (1967)** famously critiqued Harsanyi on exactly these grounds. Diamond showed that if you care about equity (distribution of utility across states of the world), you *must* violate the Independence Axiom for social choices.
  *   **Your Counter:** Prioritarians aren't being mathematically inconsistent; they are rejecting the axiom that social choice must mirror individual rationality under risk. They argue that while *individuals* should be risk-neutral over their own utility, *society* should be risk-averse over the distribution of utility. This is a coherent ethical position that prioritizes equity over the strict vNM rationality of the collective.

  ### 4. Ex Ante vs. Ex Post
  There is a nuanced debate here regarding "Ex Ante" vs. "Ex Post" prioritarianism.
  *   **Ex Ante Prioritarianism:** Evaluate individual expected utilities first, apply the concave transformation, then sum. This **does** violate the Pareto principle under risk (specifically, it can prefer a lottery that everyone dislikes). Harsanyi's theorem correctly identifies that this is incompatible with Pareto + vNM Social Rationality.
  *   **Ex Post Prioritarianism:** Apply the transformation to outcomes in each state, sum them, then calculate expected value. This preserves Pareto but violates the Independence Axiom for society (again, the Diamond critique).

  Your group is likely conflating "violating Harsanyi's axioms" with "being mathematically incoherent." Rejecting an axiom is a philosophical stance, not a math error.

  ### Summary for Your Reading Group
  You can push back with these three points:

  1.  **Weights are Undetermined:** Harsanyi's theorem allows for any non-negative weights. It does not prove egalitarianism. Equal weights require a separate "Veil of Ignorance" argument.
  2.  **Calibration is Normative:** The theorem requires interpersonal utility comparisons. Deciding how to normalize individual utility scales is an ethical choice, not a mathematical given.
  3.  **Axiom Rejection $\neq$ Inconsistency:** Prioritarianism is coherent if one rejects the premise that *Society* must satisfy the *Independence Axiom*. Citing Peter Diamond's 1967 critique is the standard counter-argument here.

  **Verdict:** Your group is treating a theorem that says "If you accept A, B, and C, then D follows" as proof that "A, B, and C are mandatory truths." They are not. Prioritarianism is a legitimate position that chooses to drop or modify axiom B (Social vNM Rationality) to accommodate equity.

  **Recommended Reading to bring up:**
  *   **Harsanyi, J. C. (1955).** *Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility.* (The source).
  *   **Diamond, P. A. (1967).** *Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility: Comment.* (The classic takedown of the idea that Harsanyi rules out equity concerns).
  *   **Sen, A. (1977).** *On Weights and Measures: Informational Constraints in Social Welfare Analysis.* (On the need for informational inputs beyond just preference orderings).
