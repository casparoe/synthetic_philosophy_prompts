prompt: |-
  I've been down a rabbit hole reading formal social choice stuff for a decision theory reading group I'm in, and a couple people keep bringing up Harsanyi's aggregation theorem as basically a knock-down proof that once you respect everybody's individual preferences (the Pareto condition), the only coherent social welfare function that falls out is straightforward utilitarianism where everyone's utility counts equally. The way it was explained to me: individuals are expected utility maximizers, we want society to also behave like an expected utility maximizer over the same set of lotteries, Pareto forces the social utility function to be a simple sum of the individual ones, and so equal-weight utilitarianism basically just drops out of the axioms, no extra ethical assumptions needed. One guy even said this means the whole debate between utilitarians and prioritarians (people who think we should give extra weight to worse-off individuals) is kind of moot, since prioritarians are just being formally inconsistent whether they realize it or not.

  That conclusion feels way too strong to me but i couldn't really push back on it in the moment. Does Harsanyi's theorem actually force equal weights on everyone the way he was describing, and does it really make prioritarianism some kind of mathematical error rather than a legitimate ethical position? Just trying to figure out if my reading group is overselling what the theorem proves, or if I'm the one missing something here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is in a decision theory reading group discussing social choice theory.
      *   **Claim:** Some members claim Harsanyi's Aggregation Theorem proves that *only* equal-weight utilitarianism is coherent if one respects individual preferences (Pareto) and treats society as an expected utility maximizer. They claim this makes prioritarianism mathematically inconsistent.
      *   **User's Intuition:** The user feels this conclusion is too strong and suspects the group is overselling the theorem.
      *   **Goal:** Evaluate the validity of the claim, explain the actual content/limitations of Harsanyi's theorem, and address whether it rules out prioritarianism or forces equal weights.

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *What does it actually say?* If individuals and society satisfy the von Neumann-Morgenstern (vNM) axioms (expected utility theory) over a set of lotteries, and society satisfies the Pareto principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$; if everyone is indifferent, society is indifferent), then the social welfare function ($W$) is a linear combination of individual utility functions ($u_i$).
      *   *Formula:* $W = \sum a_i u_i + b$.
      *   *Key Constraint:* The weights $a_i$ must be non-negative.
      *   *Crucial Missing Piece:* The theorem *does not* specify what the weights $a_i$ are. It does *not* force $a_i = a_j$ for all $i, j$. It just says the aggregation must be linear.

  3.  **Address the "Equal Weights" Claim:**
      *   The claim that Harsanyi forces *equal* weights is false.
      *   Harsanyi himself argued for equal weights based on an "impartial observer" argument (behind a veil of ignorance), but that is a *separate* ethical argument, not a mathematical consequence of the aggregation theorem itself.
      *   The theorem allows for weighted utilitarianism ($W = \sum a_i u_i$ where $a_i$ differ).

  4.  **Address the "Prioritarianism is Inconsistent" Claim:**
      *   *What is Prioritarianism?* Giving extra weight to the worse off. Usually modeled as a concave transformation of utility before summing (e.g., $W = \sum g(u_i)$ where $g$ is concave).
      *   *Does Harsanyi rule this out?*
          *   If individual utilities are fixed vNM utilities, and society must be a vNM maximizer *over the same lotteries*, then a non-linear transformation of individual utilities (like prioritarianism) generally violates the Pareto condition *as defined in the theorem* OR violates the assumption that society is an EU maximizer over the *same* structure.
          *   *Wait, nuance needed:* Prioritarianism is usually defined over *outcomes*, not lotteries. If we are talking about risk, prioritarianism often conflicts with the Pareto principle *under risk* (Ex Ante Prioritarianism vs. Ex Post Prioritarianism).
          *   *Diamond's Critique:* Peter Diamond (1967) showed that if you care about the distribution of utility *across states of the world* (equity), you might violate the independence axiom required for society to be an EU maximizer.
          *   *So:* Harsanyi's theorem assumes society *is* an EU maximizer. If you are a prioritarian who cares about equity in a way that violates Independence (e.g., preferring a sure equal split over a lottery where one person gets everything, even if expected utility is the same), you are rejecting one of Harsanyi's premises, not being "mathematically inconsistent." You are choosing a different decision theory for society.
      *   *Conclusion on Prioritarianism:* It's not a mathematical error; it's a rejection of the premise that social choice must satisfy the Independence Axiom (vNM rationality) in the same way individuals do, or it involves a different definition of utility.

  5.  **Address the "No Extra Ethical Assumptions" Claim:**
      *   This is definitely false.
      *   Interpersonal comparison of utility is required. The theorem works with vNM utilities, which are unique only up to positive affine transformations ($u' = au + b$). To sum them, you need to fix the scales and zero points. This requires ethical/normative assumptions (how do we compare my pain to your pleasure?).
      *   Choosing the weights $a_i$ is an ethical choice.

  6.  **Synthesize the Argument:**
      *   **Verdict:** The reading group is overselling it.
      *   **Point 1: Weights.** Harsanyi proves linearity ($\sum a_i u_i$), not equality ($a_i = 1$). Equal weights require an additional "impartiality" argument.
      *   **Point 2: Interpersonal Comparisons.** The theorem assumes utilities are comparable. vNM utilities aren't inherently comparable. Fixing the scale is a normative step.
      *   **Point 3: Prioritarianism.** Prioritarianism isn't mathematically inconsistent; it typically rejects the assumption that *social* choice must satisfy the Independence Axiom (vNM rationality) if doing so conflicts with equity concerns (Diamond's critique). Or, it operates on a different conception of well-being.
      *   **Point 4: Pareto under Risk.** There is a tension between Pareto and equity under uncertainty. Harsanyi sides with Pareto + vNM. Prioritarians often side with Equity, sacrificing strict vNM rationality for society or adopting an "Ex Post" view that Harsanyi's framework doesn't capture cleanly.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Validate the user's skepticism (it's well-founded). Be precise but accessible.
      *   *Structure:*
          1.  Direct Answer: You are right, they are wrong/overselling.
          2.  What Harsanyi Actually Proves (Linearity, not Equality).
          3.  The Interpersonal Comparison Problem (Scaling utilities).
          4.  The Prioritarianism Objection (Independence Axiom & Diamond).
          5.  Summary/Takeaway.
      *   *Key References:* Harsanyi (1955), Diamond (1967), Sen (critiques of welfarism).
      *   *Clarification on Prioritarianism:* Distinguish between Ex Ante and Ex Post. Harsanyi kills Ex Ante Prioritarianism if we accept his axioms, but Ex Post is compatible with linearity if we transform utilities *before* the theorem applies (but then are they vNM utilities?). Actually, the strongest point is that Prioritarianism often implies violating the Independence Axiom for social choices.

  8.  **Refining the Prioritarianism Point:**
      *   If $W = \sum g(u_i)$ where $g$ is concave.
      *   If $u_i$ are vNM utilities, then $g(u_i)$ is *not* a vNM utility function (because it's non-linear).
      *   Therefore, if society maximizes $\sum g(u_i)$, society is *not* an expected utility maximizer over the same lotteries (it violates Independence).
      *   Harsanyi's theorem says: IF society is an EU maximizer AND Pareto holds, THEN $W$ is linear in $u_i$.
      *   So, a prioritarian says: "I am willing to sacrifice the assumption that Society is an EU maximizer (specifically Independence) to achieve equity."
      *   This is not a mathematical error; it's a philosophical disagreement about the axioms.

  9.  **Final Polish:** Ensure the distinction between "weighted utilitarianism" and "equal utilitarianism" is clear. Ensure the distinction between "mathematical inconsistency" and "axiom rejection" is clear.

  **(Self-Correction during drafting):** I need to be careful not to say Harsanyi's theorem is useless. It *is* a powerful result. But the interpretation the user's group has is the "Strong Harsanyi" view which ignores the normative inputs required. I should emphasize that Harsanyi *himself* added the veil of ignorance argument to get equal weights, acknowledging the theorem alone doesn't do it.

