      *Let's try a "Variable Coarseness" case.*
      Lewis deals with *events* (spatiotemporal regions). Interventionists deal with *variables*.
      Scenario: A specific event $C$ causes $E$. But $C$ is defined so broadly that you can't intervene on "C" without also changing confounding factors, whereas the counterfactual "If $C$ had not occurred..." is well-defined by similarity metrics.

      *Let's try a "Double Prevention" case with a twist.*
      Lewis: Double prevention is causation. (A prevents B, which would have prevented C. So A causes C).
      Woodward: Sometimes double prevention is causation, sometimes it's not, depending on whether the intervention on the preventer is stable/invariant.
      *This is a known divergence.* Can I make it original?
      Instead of the standard "pilot drops bomb" vs. "bodyguard blocks assassin," let's use a biological or ecological system.

      *Let's try a "Preemption via Intervention Failure" case.*
      We need:
      1.  Lewis says Yes (Counterfactual dependence holds).
      2.  Interventionist says No (No valid intervention exists or doesn't change outcome).
