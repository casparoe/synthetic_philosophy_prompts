answer: |-
  This is a fascinating dilemma, and it is no surprise that it feels like it belongs in a seminar room. You are grappling with a conflict between **numerical identity** (there is one human being) and **qualitative identity** (the properties and behaviors associated with that being differ radically by context).

  As a philosophy major, you are likely familiar with the temptation to solve this by asking, "Who is the *real* her?" But I would suggest that framing the problem through **Aristotelian ethics**, **epistemic contextualism**, and **social ontology** offers a more principled path forward than trying to declare one of your reactions "mistaken."

  Here is a breakdown of how you might analyze this, followed by a principled recommendation for your committee work.

  ### 1. The Aristotelian Distinction: Types of Friendship
  In the *Nicomachean Ethics*, Aristotle distinguishes between three types of friendship: those of **utility**, those of **pleasure**, and those of **virtue**.

  *   **The Coworker:** This relationship was likely grounded in *utility* (getting work done) or perhaps hindered by professional competition. In this context, "self-importance" might be a professional armor or a reaction to workplace hierarchy. Your suspicion was a rational response to a competitive utility-relationship.
  *   **The Forum Friend:** This relationship was grounded in *pleasure* (shared hobby) and potentially *virtue* (confiding, trust, judgment). The anonymity of the screen name stripped away social signaling, allowing for a more direct encounter of character.

  **The Philosophical Insight:** It is not irrational to hold different attitudes toward the same person *qua* different relational roles. You do not trust your therapist with your taxes, nor your accountant with your trauma, even if both are trustworthy in their domains.
  **Principle:** Your reactions are not contradictory errors; they are context-sensitive evaluations of different *relational goods*. Neither reaction is "mistaken"; they track different dimensions of her character revealed in different environments.

  ### 2. Epistemic Fragmentation and Trust
  In epistemology, we often discuss the **fragmentation of belief** (e.g., David Lewis). We compartmentalize information because accessing all beliefs at once is cognitively inefficient and sometimes normatively inappropriate.

  Trust is also domain-specific. Miranda Fricker's work on **epistemic trust** suggests that we grant credibility based on the context of the exchange.
  *   On the forum, she was an epistemic peer regarding the hobby and a confidante regarding personal matters.
  *   At work, she was a peer/competitor within a hierarchy.

  **The Philosophical Insight:** The "shock" you feel is the collapse of two separate epistemic contexts. Your hesitation to merge the reactions is a form of **doxastic inertia**. It is rational to maintain a degree of separation because the *evidence* for her trustworthiness in Domain A (emotional vulnerability) is different from the evidence in Domain B (professional reliability).
  **Principle:** Trust is not a monolithic switch; it is a vector with different magnitudes in different directions. It is rational to trust her with committee *ideas* (Forum mode) while remaining cautious about committee *politics* (Coworker mode).

  ### 3. Existentialism: The "Look" and the Mask
  Jean-Paul Sartre and Erving Goffman (sociologically) offer insights here. We all perform roles. When you met her as a coworker, you were both objectified by the workplace structure (Sartre's "The Look"). She acted the part of the "self-important coworker" because the situation demanded a certain persona to maintain status or security.

  On the forum, the "screen name" acted as a veil that paradoxically allowed for more authenticity (an I-Thou relationship, in Martin Buber's terms), because the social stakes of the physical workplace were removed.

  **The Philosophical Insight:** Neither version is a "lie." She is a complex subject who adapts to her environment. To demand she be the "Forum Friend" at work is to deny her the agency to navigate professional survival. To demand she be the "Coworker" on the committee is to ignore the depth of your connection.
  **Principle:** Acknowledge the **plurality of the self**. People are not unitary moral agents; they are collections of habits and responses triggered by context.

  ### A Principled Decision for the Committee

  You asked which reaction should win out. The Aristotelian and Existentialist frameworks suggest that **neither should win; instead, they should be integrated into a third, higher-order stance.**

  If you treat her solely as the **Coworker**, you betray the intimacy and trust you built online.
  If you treat her solely as the **Forum Friend**, you risk being naive about workplace dynamics and professional boundaries.

  **The Recommendation: "Contextual Integration"**

  1.  **Acknowledge the Duality:** Do not try to force your emotions to merge instantly. Accept that you will feel warmth *and* caution. This is not cognitive dissonance; it is **nuance**.
  2.  **Adopt a "Presumption of Competence and Goodwill":** Use the *Forum Trust* as your baseline for her *intentions*. Assume she is not trying to undermine you (countering the Coworker suspicion).
  3.  **Maintain Professional Boundaries:** Use the *Coworker Caution* to govern your *expectations*. Do not expect the same level of vulnerability or informality in the committee room that you had on the forum. Treat the committee as a distinct context (a new "third place").
  4.  **The "Open Secret" Policy:** Since you both know the truth, you have a shared secret. This creates a subtle bond. You can treat her with the warmth of the forum friend privately, while maintaining the professionalism of the coworker publicly. This honors both realities.

  **Conclusion:**
  It is rational to respond differently to different guises because **personhood is enacted, not just possessed.** You are not dealing with a static object, but a dynamic subject. The principled move is to recognize that the "truth" of who she is lies in the synthesis of these contexts, not in choosing one over the other.

  Treat her on the committee as a **trusted colleague**: someone whose judgment you respect (Forum) but whose professional role you observe (Coworker). This allows you to honor the past connection without compromising your present professional judgment.
