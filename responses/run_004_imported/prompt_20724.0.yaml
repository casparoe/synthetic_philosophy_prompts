answer: |-
  You are not being squeamish, and your students (and TA) have made a very common, but philosophically significant, leap. There is indeed a real gap in the inference they are making. In fact, they have conflated three distinct metaethical positions: **Evolutionary Debunking**, **Moral Realism**, and **Moral Nihilism/Error Theory**.

  If you want to give the class something sharp for their response papers, here is the precise location of the gap, broken down into three specific points you can raise in lecture.

  ### 1. The Textual Gap: Street is Not a Nihilist
  The most immediate correction is textual. Sharon Street does not conclude that "no moral judgments are true." She concludes that **Moral Realism** is untenable in light of evolution.

  *   **The Students' View:** Evolution $\rightarrow$ No Independent Truth $\rightarrow$ No Moral Truth at All (Nihilism).
  *   **Street's View:** Evolution $\rightarrow$ No *Mind-Independent* Moral Truth $\rightarrow$ Moral Truth is *Constructed* (Constructivism).

  Street's positive project is to save normativity by grounding it in the practical standpoint of the agent, not in independent Platonic facts. For Street, "It is wrong to torture children" can still be *true*, but its truth consists in its coherence with our other evaluative attitudes, not in its correspondence to a mind-independent moral reality.

  **The Takeaway for Students:** The argument from evolution forces a choice between **Realism** (which faces the dilemma) and **Anti-Realism** (which includes Constructivism and Nihilism). Accepting the evolutionary story does not force you into Nihilism; it forces you to abandon Realism. Street abandons Realism but keeps morality. Your students are abandoning both.

  ### 2. The Logical Gap: Epistemology vs. Ontology
  Even if we set Street's Constructivism aside and look at the general structure of Evolutionary Debunking Arguments (EDAs), there is a gap between undermining *justification* and establishing *falsity*.

  EDAs are primarily **epistemological** arguments. They argue that if our moral beliefs are caused by evolutionary pressures indifferent to truth, we lack *justification* for holding them (they are not safely or sensitively connected to the truth).

  However, the students are drawing an **ontological** conclusion ("none of our moral judgments are true").
  *   **The Gap:** A belief can be produced by a truth-insensitive process and still be **accidentally true**.
  *   **Example:** If I believe there is a cup on the table because I hallucinated it, my belief is unjustified. But if there happens to be a cup on the table, my belief is still *true*.

  To get from "evolution shaped these beliefs" to "these beliefs are false," you need an additional premise: **that the moral truths evolution would have selected for are different from the actual moral truths.** (This is often called the "coincidence problem"). But simply stating that evolution is indifferent to truth doesn't prove that evolution got the truth *wrong*; it only proves we have no reason to think it got it *right*.

  **The Takeaway for Students:** The EDA successfully challenges our **confidence** (warrant) in moral beliefs, but it does not logically entail the **falsity** of those beliefs. To get to nihilism, you need a separate argument for why the evolutionary output *diverges* from moral reality, not just that it doesn't *track* it.

  ### 3. The "Global Skepticism" Trap (The *Reductio*)
  This is usually the sharpest tool for biology majors. If the principle is "Any cognitive faculty shaped by selection pressures indifferent to truth is unreliable," this principle threatens to consume itself.

  *   **Logic and Math:** Our capacity for logical inference and mathematical reasoning was also shaped by evolution. Evolution selects for "good enough" heuristics for survival, not necessarily for abstract logical truth (e.g., modus ponens doesn't help you dodge lions, but believing "lion = danger" does).
  *   **Perception:** Our perceptual systems are tuned for fitness, not accuracy (e.g., optical illusions, color constancy).

  If the students' conclusion holds, then **scientific and logical beliefs** are also "dressed-up animal behavior" with no claim to truth. If they say "No, science is different," they must explain **why morality is special**. If they say "Yes, science is also unreliable," their argument is self-defeating (they are using logic to argue against logic).

  **The Takeaway for Students:** To avoid global skepticism, you must identify a **relevant difference** between moral cognition and other cognitive faculties (like logic or perception). If you can't find one, the EDA proves too much. If you can find one, you might save morality from debunking.

  ### Suggested "Sharp" Prompt for the Class
  To move them past the "ethics is fake" convergence, you could frame the remaining problem like this:

  > "Street's argument shows that **Realism** is in trouble. But moving from 'Realism is false' to 'Nihilism is true' ignores Constructivism. Furthermore, moving from 'Our beliefs are unjustified' to 'Our beliefs are false' commits a modal error.
  >
  > **For your response paper:** Don't argue whether evolution shaped morality (it did). Argue about the **consequences**. Does the evolutionary origin of moral judgment undermine the *truth* of the judgment, or only our *warrant* for holding it? And if it undermines our warrant for moral judgment, does it not also undermine our warrant for the logical reasoning used to make that very argument?"

  ### Summary for your peace of mind
  You aren't soft-pedaling. The move from "causal origin in selection" to "no truth" is a version of the **Genetic Fallacy**, unless carefully qualified by an insensitivity premise. And even with the insensitivity premise, the conclusion is usually "we don't *know* moral truths," not "there *are no* moral truths." Your TA and students have conflated **Moral Skepticism** (we can't know) with **Moral Error Theory** (all claims are false). That is a substantive philosophical error, not just a difference in temperament.
