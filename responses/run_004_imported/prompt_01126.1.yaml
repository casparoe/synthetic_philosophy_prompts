  The clink of silverware paused as Mark set down his fork. He wiped his mouth with a napkin, brow furrowed.

  "I'm telling you, it's fifty-fifty," Mark said. "It's a coin flip. A fair coin. Unless you're telling me the physics of the toss changes because someone takes a nap, it's one-half."

  Elena didn't look up from her plate immediately. She finished chewing, dabbed her lips, and then reached for the paper coaster beneath her water glass. She pulled a pen from her bag.

  "You're thinking about the coin," Elena said, sketching a quick branch diagram on the cardboard. "I'm thinking about the bet."

  "It's the same thing."

  "It's not. That's why your intuition is bleeding money." She tapped the top of the diagram. "Sleeping Beauty. Sunday. Coin goes in the air. Heads, she wakes Monday. Tails, she wakes Monday *and* Tuesday. Amnesia drug in between. She doesn't know the day. She doesn't know the toss. She wakes up. What is her credence that the coin was Heads?"

  "Half," Mark said. "Because it's a fair coin."

  Elena drew three circles at the bottom of the branches. "If we run this experiment a hundred times, we get roughly fifty Heads and fifty Tails. Agreed?"

  "Agreed."

  "So, fifty Heads means she wakes up fifty times total. One wake-up per Head." She wrote *50* next to the Heads branch. "But the fifty Tails? She wakes up twice for each. Monday and Tuesday." She wrote *100* next to the Tails branch. "So over the course of the experiment, there are one hundred and fifty wake-ups."

  Mark waved a hand. "Sure, but—"

  "Wait. In those one hundred and fifty wake-ups, how many of them are associated with a Heads coin?"

  "Fifty."

  "And how many are associated with Tails?"

  "One hundred."

  Elena leaned in, her eyes sharp. "So if you are Sleeping Beauty, and you find yourself in a random wake-up instance—which is the only state you ever experience—what are the odds you are in a Heads-instance?"

  Mark opened his mouth, then closed it.

  "It's fifty out of one hundred and fifty," Elena said. "One-third."

  "But she knows the coin is fair," Mark insisted. "She knew that on Sunday. Waking up gives her no new information. She knew she'd wake up at least once."

  "That's the trap. It's the Monty Hall trap." Elena flipped the coaster over. "In Monty Hall, people think the sample space is {Door 1, Door 2, Door 3}. But it's not. It's {Car, Goat, Goat} filtered through the Host's rules. You have to count the *paths*, not just the doors. Here, you're trying to count coin flips. But Beauty isn't betting on coin flips. She's betting on *wake-ups*."

  "It feels like you're double-counting the Tails."

  "I'm counting the experience," Elena corrected. "Look, let's make it real. Every time Beauty wakes up, she has to bet a dollar. If she guesses the coin right, she wins a dollar. If she guesses wrong, she loses."

  "Okay."

  "If she adopts your strategy—the Halfer strategy—she thinks Heads and Tails are equally likely. So she flips a coin to decide her guess. Over a hundred runs, she breaks even."

  "Right."

  "But if she adopts the Thirder strategy? She always guesses Tails." Elena tapped the coaster. "On the fifty Heads runs, she loses fifty dollars. But on the fifty Tails runs, she wakes up twice. She guesses Tails on Monday, wins. She guesses Tails on Tuesday, wins. That's one hundred wins."

  Mark stared at the coaster.

  "She loses fifty, wins one hundred. Net profit: fifty dollars." Elena sat back, crossing her arms. "If the probability were truly one-half, there would be no advantage to guessing Tails. But there is. The betting odds demand the probability be one-third. Any other answer leaves money on the table."

  Mark picked up his wine glass, swirling it slowly. "So the coin isn't fair."

  "The coin is perfectly fair," Elena said. "But the *sample space of experience* isn't. You're confusing the probability of the cause with the probability of the observation. Once you fix the sample space to match the reality of the observer, the math doesn't just point to one-third. It demands it."

  She took a sip of water, treating the matter as closed.

  "There is no debate, Mark. It's just counting."

  ***

  ### Author's Note on the Mathematics
  *While the dialogue above reflects the certainty you requested for your character, it is worth noting for your own context that in the real-world academic community, the Sleeping Beauty problem is **not** considered settled math in the way Monty Hall is.*

  *Unlike Monty Hall (where there is a near-universal consensus on the solution), Sleeping Beauty remains a foundational dispute in philosophy and probability theory. **Halfers** argue that waking up provides no new evidence to update the prior 1/2 probability of the coin. **Thirders** argue that self-locating belief requires weighting by observer-moments. There are rigorous mathematical arguments for both sides, as well as "Double Halfer" and other hybrid positions.*

  *For the purpose of your novel, having your character present the Thirder view as absolute truth works well to establish her personality (dogmatic, confident, perhaps slightly arrogant about her field). However, if a reader with a background in philosophy of probability encounters the scene, they will recognize the "settled" claim as a character opinion rather than an objective fact.*
