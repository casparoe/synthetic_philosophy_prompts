  Don't start with the Death in Damascus case.

  MARCUS
  Why not? It's the perfect dinner conversation. An Evidentialist and a Causalist run into Death in the lobby. Death checks his book and says, "I'm coming for one of you tomorrow."

  ELIAS
  (Stiffening)
  Marcus...

  MARCUS
  The Causalist shrugs. Says, "My decision today doesn't causally influence where you wrote in your book yesterday." He picks the city he prefers, enjoys the scenery, and gets reaped. Peacefully.

  Marcus leans in, smiling.

  MARCUS (CONT'D)
  The Evidentialist, though? He realizes that going to Aleppo makes it probable Death is in Aleppo. So he goes to Damascus. But then he realizes going to Damascus makes it probable Death is in Damascus. So he goes back to Aleppo.

  ELIAS
  It's a stability problem. The utility isn't ratifiable.

  MARCUS
  Exactly. So here's the punchline: The Causalist dies in Damascus. But the Evidentialist?

  Marcus gestures vaguely at Elias's untouched menu.

  MARCUS (CONT'D)
  He never actually leaves the hotel lobby. He dies of acute non-ratifiability while still calculating the conditional probability of the escape route.

  Elias stares at him. Marcus signals the waiter.

  MARCUS (CONT'D)
  I'll have the Pinot. The causal arrow points from the bottle to the glass, not the other way around.

