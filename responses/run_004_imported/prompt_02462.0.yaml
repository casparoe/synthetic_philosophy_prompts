      *   Confront present-day attempts? (Yes, the Hard Problem and NCC).

  9.  (Final thought): Ensure I mention that Huxley's view is called **Epiphenomenalism**. This gives the user the terminology to research further.

  10. *Wait, one more thing:* The user asks "what... could possibly count as evidence for or against its presence?" This is the strongest point. If the whistle makes no noise that affects the engine, and we can't hear the animal's whistle, how do we know it's there? Huxley's answer is *analogy*. I need to emphasize that this makes the belief *probabilistic* based on structural similarity, not *empirical* based on functional output. This is a vulnerability.

