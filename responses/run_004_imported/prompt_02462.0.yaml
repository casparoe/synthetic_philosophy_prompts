          2.  **Reconstruct Huxley's Logic:** Explain the "Common Cause" structure. Brain causes Mind + Behavior. Mind doesn't need to cause Behavior to be real.
          3.  **Address the Evidential Basis:** Huxley relies on *introspection* in humans + *homology* in animals. It's an inference to the best explanation, not a direct observation of causal power.
          4.  **The "Undercutting" Verdict:** He hasn't logically contradicted himself, but he has made consciousness *explanatorily redundant*. This is the real cost, not a logical contradiction.
          5.  **Modern Relevance:** Connect to NCC, the Cambridge Declaration, and the "Hard Problem." Show how modern science often tacitly assumes mental causation (functionalism) whereas Huxley was a strict mechanist.
