prompt: |-
  I spent my working life as a physiologist, and in retirement I have finally been giving philosophy of mind the attention it deserves, working through some of the Victorians on animal sentience. I have run into a genuine difficulty with a passage from Thomas Henry Huxley's 1874 essay "On the Hypothesis that Animals are Automata, and Its History," and would value your help thinking it through.

  Huxley first defends the claim that animals are conscious, arguing from comparative anatomy:

  "We know, further, that the lower animals possess, though less developed, that part of the brain which we have every reason to believe to be the organ of consciousness in man; and as, in other cases, function and organ are proportional, so we have a right to conclude it is with the brain; and that the brutes, though they may not possess our intensity of consciousness, and though, from the absence of language, they can have no trains of thoughts, but only trains of feelings, yet have a consciousness which, more or less distinctly, foreshadows our own."

  A few pages later, however, he insists that this same consciousness is entirely without causal power:

  "It may be assumed, then, that molecular changes in the brain are the causes of all the states of consciousness of brutes. Is there any evidence that these states of consciousness may, conversely, cause those molecular changes which give rise to muscular motion? I see no such evidence... The consciousness of brutes would appear to be related to the mechanism of their body simply as a collateral product of its working, and to be as completely without any power of modifying that working as the steam-whistle which accompanies the work of a locomotive engine is without influence upon its machinery. Their volition, if they have any, is an emotion indicative of physical changes, not a cause of such changes."

  Here is what I cannot square: the first passage grounds the attribution of consciousness to animals in an inference from observable, causally efficacious structures – homologous brains presumably yielding homologous effects. The second denies consciousness any causal role in producing the very behaviour and physiology from which its presence is inferred. If felt experience is as idle as the whistle, what, on Huxley's own terms, could possibly count as evidence for or against its presence in a given creature? Is there a coherent way of reconciling his evidential and his causal claims, or has he quietly undercut his own grounds for believing brutes are conscious at all? And does the same difficulty confront present-day attempts to infer sentience in other animals from neural or behavioural homology?
