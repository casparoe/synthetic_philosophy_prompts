      *   **The Problem:** A perceived contradiction in T.H. Huxley's 1874 essay "On the Hypothesis that Animals are Automata."
          *   *Passage 1 (Evidence):* Animals have consciousness because they have homologous brain structures to humans (structure implies function).
          *   *Passage 2 (Causation):* Consciousness is epiphenomenal (like a steam whistle). It has no causal power over behavior/movement.
