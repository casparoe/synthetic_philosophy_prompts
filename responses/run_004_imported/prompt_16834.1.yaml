answer: |-
  It is deeply unsettling when abstract philosophical problems manifest as concrete harms in the lives of people we care about. Your friend's experience is a textbook instantiation of the theoretical concerns you have been studying, and it highlights why the "responsibility gap" is not merely a semantic puzzle but a matter of procedural justice and psychological welfare.

  Here is an analysis of your case through the lens of the literature, focusing on the Santoni de Sio and Mecacci framework, the efficacy of proposed remedies, and the practical implications for accountability.

  ### 1. Which Gap is Doing the Work?
  While Matthias's original formulation focuses heavily on the **culpability gap** (the inability to assign blame because control is lost), your friend's case suggests that focusing solely on culpability misses the deeper structural failures. In the proctoring scenario, I would argue that the **Active Responsibility gap** is the root cause, which subsequently triggers a **Moral Accountability gap**.

  *   **The Active Responsibility Gap (Forward-Looking):** This gap concerns the allocation of tasks and duties *before* an incident occurs. Who was responsible for ensuring the system was reliable? Who was tasked with verifying that the "anomalous behavior" threshold was calibrated to avoid false positives for neurodivergent students or those with poor internet connectivity? In your friend's case, the university delegated this duty to a vendor via a contract, and the vendor delegated it to an opaque algorithm. No human agent retained the *active responsibility* for the system's fairness prior to deployment. The gap exists because the duty of care was outsourced along with the technology.
  *   **The Moral Accountability Gap (Backward-Looking):** When the flag was raised, who was required to *answer* for it? Santoni de Sio and Mecacci distinguish accountability from culpability; one can be accountable (required to explain/justify) without being culpable (deserving punishment). Here, the professor deferred to the office, the office deferred to the score, and the vendor deferred to trade secrets. Everyone passed the buck. The gap is not just that no one was punished (culpability), but that no one was compelled to provide a satisfactory justification for the harm caused (the stress, the threat to academic standing).

  The **Culpability Gap** was technically avoided because your friend was cleared, but the *threat* of it hung over her. The **Public Accountability Gap** is also present (the university is not answerable to the public about its vendor choices), but the immediate harm was driven by the lack of Active Responsibility (safety checks) and Moral Accountability (answering for the error).

  ### 2. Do Remedies Close the Gap or Relocate It?
  This is the critical philosophical question. Most standard policy proposals tend to relocate the gap rather than close it, often shifting the burden onto the weakest link in the chain.

  *   **Mandatory Explainability (XAI):**
      *   *The Promise:* If the vendor must explain the decision, the epistemic opacity vanishes.
      *   *The Reality:* In your friend's case, the vendor cited trade secrets. Even if legally forced to disclose the code, "explainability" in machine learning is often post-hoc rationalization, not true causality. Furthermore, this remedy often relocates the gap to the **interpreter**. If the professor receives a heat-map showing where the AI "looked," does he have the expertise to interpret it? If he misinterprets it, the responsibility gap shifts from the vendor to the professor, who is now culpable for misunderstanding the tool. It creates an illusion of understanding without restoring actual control.
  *   **Strict or Vicarious Liability:**
      *   *The Promise:* If the university is strictly liable for damages caused by the software, they will be more careful.
      *   *The Reality:* This is one of the few remedies that actually *closes* a gap, specifically the **compensation** aspect of the culpability gap. If the university knows they will pay for every false positive, they have a financial incentive to audit the vendor. However, it does not solve the *epistemic* gap. The university might simply buy insurance and treat false accusations as a "cost of doing business," leaving the student's reputational harm unaddressed.
  *   **Meaningful Human Control (MHC):**
      *   *The Promise:* A human must always be "in the loop" to validate decisions.
      *   *The Reality:* In proctoring, MHC is often inverted. The human (professor) is not there to *protect* the student from the algorithm; they are there to *enforce* the algorithm's finding. This leads to **automation bias**, where the human rubber-stamps the machine because they assume the machine is more objective. In your friend's case, the professor "trusted the software." MHC failed because the human lacked the *capacity* to override (they didn't know how the score was derived) and the *authority* (the integrity office held the power). MHC often relocates the responsibility gap to the human operator, making them the scapegoat for systemic failures they cannot control.

  ### 3. Practical Lessons for Demanding Accountability
  If you or your friend were to face this again, or if you wish to advocate for policy changes based on this seminar work, the literature suggests shifting the target of accountability.

  **Don't demand technical explanation; demand procedural justification.**
  Asking "Why did the algorithm flag me?" leads to the trade-secret wall. Instead, the demand should be directed at the **Active Responsibility** gap. The question should be: *"What validation process did the university undertake before deploying this system to ensure it does not falsely accuse students?"*
  *   **Target the Deployment, Not the Output:** The philosophical literature suggests that when control over the *output* is impossible (due to opacity), responsibility must be anchored in the *input* and *governance*. Accountability lies in the decision to procure the tool without an audit trail.
  *   **Shift from Individual to Institutional Accountability:** Your friend had to appeal as an individual against a system. This is an asymmetry of power. The lesson from the "Public Accountability" gap is that these issues must be handled collectively. Student bodies or faculty senates should demand that the *contract* with the vendor includes audit rights and liability clauses.
  *   **Reframe "Human in the Loop":** If the university claims there is human oversight, demand that the human overseer has the **authority and expertise** to exonerate without burdening the student. Currently, the burden of proof is on the student to prove a negative ("I didn't cheat"). A responsible system would place the burden on the accuser (the system/university) to prove the anomaly is actually misconduct, not just statistical noise.

  ### Summary
  Your friend's experience confirms that the "responsibility gap" is not a bug of future AI, but a feature of current administrative technology. The most potent lens for this case is Santoni de Sio and Mecacci's **Active Responsibility gap**: the university failed in its forward-looking duty to ensure the system was safe for students.

  Remedies like explainability often fail because they try to make the black box transparent, which is technically and legally difficult. A more robust approach, suggested by the literature, is to make the **deployment decision** transparent. The practical lesson is to stop asking the algorithm for reasons it cannot give, and start asking the institution why they surrendered their judgment to a system they cannot audit. Accountability lies not in the code, but in the contract and the governance structure that allowed the code to wield authority over academic standing.
