      *Refining Move (4) Analysis:* Mei cites Stalnaker. Stalnaker's specific critique is that Aumann's definition of knowledge implies that impossible events (deviations) have probability 0, so conditionalizing on them is undefined. To make sense of it, you need a belief revision policy. CKR alone doesn't provide that policy. This is a formal gap, not just a psychological one. I need to highlight this.

