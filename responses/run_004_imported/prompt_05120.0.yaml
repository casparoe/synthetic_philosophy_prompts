answer: |-
  This is a sophisticated tension, and you are right to feel that the standard journalistic hand-wave ("real people aren't perfectly rational, so the theorem doesn't apply") misses the deeper epistemic implication. The fact that the no-trade theorem's assumptions are violated in the real world does not automatically validate the inference that *volume equals information aggregation*. In fact, a rigorous engagement with *why* those assumptions are violated suggests the opposite: that volume is often a measure of the very frictions, biases, and non-epistemic utilities that prevent a market from being a pure information processor.

  Here is the argument for why trading volume is not, by itself, evidence of a prediction market's epistemic success, and why relying on it risks conflating activity with accuracy.

  ### 1. The No-Trade Theorem as a Null Hypothesis
  To understand why volume is ambiguous, we must first accept the no-trade theorem not as a description of reality, but as a baseline for what a "perfect" information market would look like. The theorem posits that if agents are rational expected-utility maximizers with common priors, any offer to trade reveals information. If I offer to sell you a share on "Candidate X wins," I am signaling that I believe the price is too high. You, reasoning recursively, realize I wouldn't offer this unless I had negative information. You update your belief downward. I realize you updated, so I update further. In equilibrium, the bid-ask spread collapses, and trade ceases.

  Therefore, **trade only occurs when the conditions for perfect information aggregation break down.**

  When journalists point to high volume as proof of "serious epistemic work," they are treating the breakdown of the no-trade conditions as a feature rather than a bug. They assume the deviation from the theorem is driven primarily by *private information* (one side knows something the other doesn't). But the theorem tells us that private information alone is insufficient to generate trade among rational agents. Something else must be present to overcome the informational inference. That "something else" is the very thing that undermines the purity of the price signal.

  ### 2. Engaging the Rejoinders: Why Explanations for Volume Undermine Epistemic Claims
  Economists offer several reasons why real markets see trade despite the theorem. However, if you examine each explanation closely, none of them supports the inference that "Volume $\rightarrow$ Information Aggregation." Most suggest the opposite.

  #### A. Heterogeneous Priors (Agreeing to Disagree)
  The most common escape from the no-trade theorem is to assume agents do not share a common prior. Trader A thinks the base rate of incumbent reelection is 80%; Trader B thinks it is 40%. They trade.
  *   **The Journalistic Inference:** "Look at all this activity; the market is debating the true probability."
  *   **The Reality:** If trade is driven by heterogeneous priors, the market price does not converge to an objective truth derived from evidence; it converges to a wealth-weighted average of subjective biases. High volume here indicates deep *disagreement on fundamentals*, not necessarily the resolution of that disagreement via information. If the volume is high because priors are stubbornly divergent, the price is a compromise between biases, not a distillation of signal. Volume proves divergence, not convergence.

  #### B. Hedging and Liquidity Needs (Non-Epistemic Utility)
  In traditional finance, much volume comes from hedging (e.g., an airline buying oil futures to lock in costs, not because they know oil prices will rise). In prediction markets, this maps to "expressive trading" or portfolio rebalancing.
  *   **The Journalistic Inference:** "Deep liquidity ensures the price is robust."
  *   **The Reality:** If a significant portion of volume is hedging or expressive, those traders are insensitive to information. They will buy even if the price is "wrong" relative to the probability, because they derive utility from the hedge or the expression. This creates "noise" in the order book. While liquidity is good for execution, volume derived from non-epistemic motives dilutes the informational content of the price. A market with massive volume driven by hedgers can be consistently biased if the hedgers are all on one side (e.g., investors holding tech stocks betting on a regulatory outcome to protect their portfolio). The volume is real, but the epistemic signal is distorted by risk premiums.

  #### C. Overconfidence and Bounded Rationality (The Casino Effect)
  This is the most uncomfortable explanation for prediction market proponents. Trade occurs because traders are overconfident in their private signals (they think they know more than they do) or simply enjoy the gamble.
  *   **The Journalistic Inference:** "Smart money is moving the line."
  *   **The Reality:** If volume is driven by overconfidence, it is a measure of delusion, not information. In fact, high volume in this context is a *negative* signal. It suggests a large number of agents believe they have an edge when they likely do not. This is the "casino" dynamic. If Polymarket sees a spike in volume on a niche political primary, it is often because retail traders feel they have "inside knowledge" (perhaps a poll they saw on Twitter) that the market hasn't priced in. Often, they are wrong. The volume represents the churn of incorrect beliefs being washed out, not the quiet accumulation of truth. Relying on volume as a credential ignores the possibility that the market is busy processing *mis*information.

  #### D. The Grossman–Stiglitz Paradox (The Critical Rejoinder)
  This is the most potent economic argument against your target inference. Grossman and Stiglitz (1980) argued that if prices perfectly reflected all private information, no one would have an incentive to pay the cost to acquire that information. Therefore, markets *must* be somewhat inefficient to compensate informed traders. Informed traders need "noise traders" (irrational or liquidity-driven traders) to hide behind to make a profit.
  *   **The Journalistic Inference:** "Volume shows informed traders are active."
  *   **The Reality:** Grossman–Stiglitz implies that **volume is a mixture of signal and noise.** You cannot observe the ratio. High volume could mean there are many informed traders (good), *or* it could mean there are many noise traders (bad).
      *   If volume is high because there are many noise traders, informed traders *can* enter the market.
      *   However, if the noise traders dominate the volume, the price might be driven away from fundamentals by the sheer weight of liquidity, even if informed traders are present.
      *   Crucially, the existence of volume proves the market is *not* fully informationally efficient (otherwise, the informed wouldn't trade). Therefore, citing volume as proof of efficiency is logically contradictory. Volume proves the existence of the *inefficiencies* that allow trade to happen.

  ### 3. The Category Error: Liquidity vs. Accuracy
  The core error in the journalistic inference is conflating **liquidity** (the ability to trade size without moving the price) with **accuracy** (the price matching the true probability).

  The no-trade literature suggests that as a market becomes more epistemically efficient (agents update faster, priors align), volume should theoretically *decrease*, not increase. In a near-perfect information market, agents would agree on the price almost instantly. The bid-ask spread would be tiny, and there would be no reason to trade unless you had a non-informational need (hedging).

  Therefore, a "quiet" market could theoretically be the most accurate one (consensus has been reached), while a "noisy" market is one where consensus is elusive. By treating volume as a proxy for epistemic health, journalists are effectively praising the symptom of the disease (disagreement/friction) rather than the cure (agreement/truth).

  ### 4. What Should We Look At Instead?
  If volume is not the metric, how do we validate prediction markets without falling into the no-trade trap? We must look at outcomes, not activity.

  1.  **Calibration and Brier Scores:** Does a 70% price resolve "Yes" 70% of the time over the long run? This measures accuracy directly, regardless of how much money changed hands to get there.
  2.  **Price Stability vs. News Flow:** Does the price move only when new information arrives, or does it drift on volume alone? High volume with no news suggests noise trading.
  3.  **Convergence Speed:** How quickly does the price absorb a public shock? A market can be low-volume but highly efficient if the few participants are very smart (the "wisdom of the few" vs. "wisdom of the crowd").
  4.  **Arbitrage Bounds:** Are there persistent discrepancies between correlated markets (e.g., Polymarket vs. Kalshi on the same event)? If volume is high but arbitrage gaps remain, the volume is not doing its epistemic job.

  ### 5. Conclusion
  The no-trade theorems do not prove prediction markets cannot work. They prove that **trade is not evidence of rational information processing.**

  When you write that "heavy trading volume... is evidence that the market is doing serious epistemic work," you are making a category error. You are observing the *friction* of the machine and calling it the *output*. The standard rejoinders (heterogeneous priors, noise trading, overconfidence) explain why volume exists, but they do so by invoking mechanisms that are distinct from, and often hostile to, pure information aggregation.

  If Grossman and Stiglitz are right, volume is the fee informed traders charge for revealing information. If Aumann is right, volume is a sign that common knowledge has not been reached. In neither case is volume a seal of epistemic approval. It is merely a measure of how much disagreement, hedging, or overconfidence is in the room. To treat it as proof of truth is to mistake the shouting for the answer.
