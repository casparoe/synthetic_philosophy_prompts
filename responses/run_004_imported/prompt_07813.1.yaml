      *   *Check:* Is the philosophy accurate?
      *   *Fix:* Ensure distinctions between consequentialism and virtue ethics are clear but not jargon-heavy.
      *   *Check:* Is the advice practical?
      *   *Fix:* Suggest a periodic check-in to ensure the "off" feeling doesn't grow into resentment.

  7.  **Final Polish:** (Produces the final output provided previously.)
