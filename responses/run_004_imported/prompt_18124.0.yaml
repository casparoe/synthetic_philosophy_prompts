prompt: |-
  My uncle Walt died last week at 84. He was an evolutionary biologist and a genuine crank about it -- a lifelong gene's-eye-view die-hard who'd literally pause nature documentaries to complain that the narrator just said something evolved "for the good of the species." I'm writing his eulogy for Saturday. A few of his old colleagues from the department will be there so it can't be flat-out wrong, but it's mostly cousins and grandkids, and everyone keeps sending me drafts full of exactly the lines he spent forty years arguing against -- "he gave everything of himself for the good of this family," "it's just human nature to look after our own kind," that sort of thing. Being the novelist in the family I'm apparently the one who's supposed to make it sound nice, but I don't want to either lecture forty crying people about inclusive fitness or put sentiments in his mouth he'd have dismantled at a dinner party. Can you write the actual eulogy -- genuinely warm, doesn't shy away from how much he adored his kids and grandkids, but grounds that devotion in whatever the real hard-nosed mechanism is (kin selection, inclusive fitness, whatever he'd actually have said) rather then the "good of the group" language he hated. Keep it to eulogy length, not an essay, and don't let it turn into a biology lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Uncle Walt, 84, evolutionary biologist, staunch "gene's-eye-view" proponent (Dawkinsian), hated "good of the species" teleology.
      *   **Task:** Write a eulogy.
      *   **Audience:** Family (cousins, grandkids) + some academic colleagues.
      *   **Tone:** Genuinely warm, loving, but scientifically accurate to Walt's worldview (no "good of the group/species" language).
      *   **Constraint:** Do not turn it into a biology lecture. Do not use the phrases he hated ("good of the species," "human nature to look after our own," "gave everything for the family" in a selfless/altruistic sense).
      *   **Goal:** Honor his love for his family *through* his scientific lens without alienating the grieving non-scientists.

  2.  **Deconstruct the Scientific Conflict:**
      *   *The "Wrong" Way:* Altruism as self-sacrifice for the greater good, teleological evolution (things happen *for* a purpose), group selection.
      *   *The "Walt" Way:* Kin selection, inclusive fitness, selfish gene theory. Love and care are mechanisms for propagating shared genetic material. It's not cold; it's just mechanistic. The *feeling* is real, even if the *driver* is replication.
      *   *The Challenge:* How to say "he loved you because you carry his genes" without sounding like a robot?
      *   *The Solution:* Frame the biological drive as the *source* of the profound bond. The "selfish" gene creates selfless *feelings*. The mechanism doesn't diminish the love; it explains its depth and inevitability.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, set the scene. Mention his passion immediately but gently.
      *   **The Scientific Angle (The Hard Part):** Need to address his worldview without lecturing. Use his specific pet peeves as a touchstone of his character. He cared about *truth*.
      *   **Family Connection:** Connect the science to the love. How did his theory translate to his behavior? He wasn't distant; he was deeply invested. Why? Because you *were* him, biologically speaking.
      *   **Specific Imagery:** Nature documentaries, dinner table arguments, holding a grandchild.
      *   **Closing:** A send-off that respects his materialism but offers comfort.

      *   *Drafting Thought - Avoiding Pitfalls:*
          *   *Bad:* "He helped us because of inclusive fitness." (Too cold)
          *   *Bad:* "He sacrificed for the good of the family." (He would hate this)
          *   *Good:* "He knew that caring for you was the most fundamental drive there is."
          *   *Good:* "He saw his future in your faces."

      *   *Refining the "Love" Argument:* Walt wouldn't say love is *just* chemistry, but he would say it's *rooted* in it. The eulogy needs to say: "The fact that our bond is written in our biology doesn't make it less special; it makes it ancient and undeniable."

      *   *Incorporating the "Crankiness":* It's endearing. Mention the TV pausing. It shows his integrity.

  4.  **Writing - Iteration 1 (Mental Outline):**
      Hi everyone. Walt died. He was a biologist. He hated when people said animals do things for the species. He liked genes. But he loved his kids. Why? Because they have his genes. It's kin selection. But it felt like love. He was a good guy. We will miss him.

      *Critique 1:* Too dry. Needs more heart. Needs to sound like a nephew/niece speaking.

  5.  **Writing - Iteration 2 (Adding Warmth):**
      We are here for Walt. He was 84. He spent his life studying how life continues. He got mad at nature shows. But at home, he was warm. He loved his grandkids. He didn't do it for "the family" in a vague way. He did it because you are his legacy. He saw himself in you. That's why he cared.

      *Critique 2:* Better. But needs to navigate the "selfish gene" concept carefully so it doesn't sound like he only loved them *because* of genes. The gene theory explains the *intensity* of the love.

  6.  **Writing - Iteration 3 (Polishing the Language):**
      *   *Hook:* Start with the nature documentary habit. It's a specific, loving memory.
      *   *Bridge:* Connect that rigor to his family life. He demanded accuracy, but he also demanded connection.
      *   *The Core:* Address the "why." Why did he love so hard? Because in a cold universe, the propagation of life is the only warmth there is. You *are* the propagation.
      *   *The "Good of the Species" Ban:* Explicitly acknowledge the request (subtly). "I know he'd correct me if I said..."
      *   *Ending:* A biological farewell. Returning to the cycle, but living on in the relatives.

  7.  **Final Review against Constraints:**
      *   *No "good of the species"?* Check.
      *   *No "selfless sacrifice"?* Frame it as investment/drive.
      *   *Warm?* Yes, focus on the feeling of being loved.
      *   *Length?* Appropriate for speech (3-5 mins).
      *   *Audience?* Accessible to cousins, respectful to colleagues.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound *too* clinical. Use words like "devotion," "fierce," "anchor."
      *   *Correction:* Ensure the "gene" talk doesn't overshadow the "man." The science is the lens, not the subject.
      *   *Key Phrase:* "He didn't love you *despite* the biology; he loved you *because* the biology made it inevitable." (Maybe too strong? Soften to "made it unbreakable.")

      *(Self-Correction on "Selfish Gene"):* Avoid using the word "selfish" directly in relation to his love, as laypeople misunderstand Dawkins' title. Focus on "continuity" and "investment."

      *Let's write it.* (Proceeds to generate output based on these thoughts).

  9.  **Post-Draft Check:** Does it sound like a eulogy? Yes. Does it honor Walt's specific intellectual quirk? Yes. Is it touching? Hopefully.

      *One specific tweak:* Make sure to mention the colleagues. A nod to them acknowledging they know the "real" talk, but this is the "family" translation.

      *Final thought on the "mechanism":* The prompt asks to ground devotion in the hard-nosed mechanism. So, "inclusive fitness" needs to be translated to "your survival was his survival."

      *Okay, ready to write.*
answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew my Uncle Walt well, you know that standing here right now, I am walking a tightrope. I know that if he were sitting in the front row, he'd be shifting in his seat, waiting to see if I got the details right. He was a man who cared deeply about precision. He cared about truth, even when the truth was uncomfortable or unpoetic.

  Many of you have sent me notes for this speech, beautiful notes, saying things like, "Walt gave everything of himself for the good of his family," or "He believed in looking after our own kind." And I know, because I've spent enough time at his dinner table, that if he were here, he'd ask for the microphone to correct the terminology. He spent forty years arguing that nature doesn't act "for the good" of anything. He believed that the universe isn't designed with a purpose, and that living things aren't driven by a noble desire to help the group.

  But here is the thing Walt taught me, and what I want to say to you now: The fact that he didn't believe in a mystical purpose didn't mean he didn't believe in *you*.

  Walt viewed the world through the lens of the gene. He believed that we are survival machines built to carry genetic information forward. Now, hearing that might sound cold to some. It might sound like it reduces love to a calculation. But when I watched Walt with his children, and later with his grandchildren, I didn't see a calculation. I saw a fierce, unshakeable gravity.

  He didn't love his family *despite* his science. He loved you *because* of it.

  In Walt's view, you weren't just people he happened to be related to. You were the physical continuation of his own existence. When he looked at his grandchildren, he didn't just see cute kids; he saw the only part of himself that would outlast him. He saw the code continuing. And because of that, his devotion to you wasn't a duty. It wasn't a sacrifice made for the "good of the species." It was an instinct as deep and undeniable as a heartbeat.

  He knew that in a vast, indifferent universe, the only thing that persists is what we pass on. So he poured everything he had into making sure you were safe, and smart, and ready. He argued with nature documentaries because he hated lazy thinking, but he argued with such passion because he wanted the world you inherited to be one understood clearly, not one clouded by myths.

  To his colleagues here: We know he was a crank. We know he could be exhausting about the "selfish gene." But that rigor was what made his love so reliable. He didn't love you because it was the "nice thing to do." He loved you because, biologically and emotionally, you were his future. There was no scenario in which your success wasn't his success.

  To the cousins and the grandkids: You never had to wonder where you stood with Walt. You were his legacy. He protected you, he taught you, and he worried over you, not because of some vague social contract, but because your survival was the only metric of his own that mattered.

  He would tell me not to say he's "looking down on us" now. He'd say he's simply ceased to be. But he would agree that he isn't gone. Not entirely. The most fundamental drive of life is to replicate, to continue. And looking around this room, I see his eyes in three different cousins. I hear his laugh in his daughter. I see his stubbornness in his grandson.

  He spent his life studying how life endures. And by that measure, Walt didn't just believe in the future. He built it. He is here, in the room, in the blood, and in the memory of everyone who carries a piece of him forward.

  He was precise. He was rigorous. And he was utterly, biologically devoted to every single one of you. And that is enough.
