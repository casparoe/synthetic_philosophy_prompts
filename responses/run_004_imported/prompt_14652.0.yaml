answer: |-
  This is a fantastic problem to have. Your writing group is right: Max Black's spheres are the "Hello World" of metaphysics. Using them is the philosophical equivalent of starting a song with a I-IV-V chord progression. It works, but everyone hears the reference immediately.

  The good news is that the philosophy of physics has moved significantly beyond Black since 1952. Black's spheres rely on **spatial externalism** (they are distinct because they are *here* and *there*). Contemporary metaphysicians of physics (like Simon Saunders, Dean Rickles, and Steven French) are interested in cases where spatial separation *doesn't* do the work.

  Here is a specific, dramatizable example grounded in the **Permutation Invariance of Quantum Particles**, specifically focusing on **Weak Discernibility**. This is a live debate (Saunders vs. French/Krause) that fits your "smart people still argue about this" requirement perfectly.

  ### The Example: The Singlet State (Two Electrons in a Helium Atom)

  Instead of two spheres miles apart, imagine two electrons occupying the same orbital in a helium atom.

  **1. The Objects**
  Two fermions (electrons). Let's call them $e_1$ and $e_2$ for the sake of conversation, though the physics tells us those labels are fictions.

  **2. Qualitative Identity (The "Same Dust")**
  *   **Intrinsic Properties:** They have exactly the same mass, exactly the same electric charge, and exactly the same magnitude of spin. There is no "scratch" on one electron to distinguish it from the other.
  *   **Spatial Properties:** Unlike Black's spheres, these two are not in different places. They occupy the *same* spatial wavefunction (the 1s orbital). They are probabilistically co-located. You cannot say "this one is on the left."

  **3. The Relation (The "Crack in the Window")**
  They are in a **Singlet State**. This means their spins are anti-correlated. If one is measured as "Spin Up," the other *must* be "Spin Down."
  *   **Weak Discernibility:** They are not absolutely indiscernible. They satisfy the irreflexive relation: *"has opposite spin to."* (Electron A has opposite spin to Electron B). Since nothing can have opposite spin to itself, they must be two things.
  *   **The Catch:** You cannot say *which* is Up and *which* is Down prior to measurement. The state is a superposition: $(| \uparrow \downarrow \rangle - | \downarrow \uparrow \rangle)$. The system knows there is opposition, but the universe does not assign the "Upness" to a specific individual.

  **4. The Permutation Test (The Scene Hook)**
  In classical physics (and Black's spheres), if you swap Object A and Object B, you have a new configuration (A is now at B's location).
  In this quantum case, if you mathematically **permute** (swap) the two electrons, the physical state of the universe remains **identical**. Not just similar—identical. The math yields the exact same probability distribution.
  *   **The Leibnizian Insistence:** A traditional metaphysician (a Haecceitist) will insist: "But $e_1$ is still $e_1$. It has a 'thisness' (haecceity) that travels with it. Even if the physics can't track it, *reality* knows which is which."
  *   **The Structuralist Rebuttal:** A modern philosopher of physics (like Saunders) argues: "No. There is no 'which is which.' They are individuals only in the weak sense that they stand in an irreflexive relation to each other. They are distinct, but they are not *individuals*."

  ### Why This Fixes Your Novel's Problem

  Black's spheres rely on space to do the heavy lifting. Your rooms are already separated by space (opposite ends of the house), so using Black's logic makes the rooms distinct *because* of their location. That undermines the mystery.

  The **Singlet State** example allows you to argue that the rooms are distinct *despite* their location. It suggests that "East Room" and "West Room" are just labels we slap on a system that doesn't actually contain two distinct individuals, but rather a single state of "twoness."

  ### How to Dramatize This (Scene Ideas)

  You don't need a physics lecture. You need a character grappling with the *implication* of this. Here are three ways to weave this into the narrative:

  **Option A: The Annotated Text**
  Your protagonist finds a book or journal in the house (maybe left by the previous owner, a physicist or philosopher). The margin notes argue with the text.
  *   *Text:* "Two particles in a singlet state are distinct only by their opposition."
  *   *Margin Note:* "False. Distinctness requires a subject. If I swap them and God cannot tell the difference, they are the same object wearing two masks. Or one object wearing none."
  *   *Protagonist's Realization:* They look at the two rooms. "If I walk into the East Room and swap a book with the West Room, and the house doesn't change... am I moving things? Or am I just permuting the state?"

  **Option B: The Dialogue of Disagreement**
  Two characters (perhaps a skeptic and a believer in the house's weirdness) argue over dinner.
  *   *Character 1:* "They're just rooms. One's here, one's there. Like Black's spheres."
  *   *Character 2:* "Black was wrong. If they were just spheres, swapping them would change the map. But in this house, swapping them doesn't change the *history*. It's like the electrons. You can't tag them. The 'East' room isn't East because of where it is. It's East because it's *not* the West. They define each other, they don't exist on their own."
  *   *Character 1:* "That's mysticism."
  *   *Character 2:* "No, it's Saunders. It's weak discernibility. They're two, but they aren't *things*."

  **Option C: The Experiment**
  The protagonist tries to "tag" the rooms to prove they are distinct (the Haecceity test). They put a red mark in Room A and a blue mark in Room B. They leave. They return.
  *   *The Twist:* The marks are there, but the *history* of the marks is swapped. The red mark is in the room that *should* be blue, but the dust patterns suggest the red mark has *always* been there.
  *   *The Metaphor:* The protagonist realizes the house behaves like a permutation-invariant system. The labels (Red/Blue, East/West) stick to the *positions*, not the *rooms*. The rooms themselves have no "thisness."

  ### The Philosophical "Meat" for Your Characters

  If you want your characters to sound like they know what they are talking about without name-dropping Black, give them this specific vocabulary:

  1.  **"Haecceity" (Thisness):** The invisible tag that makes a thing *that* thing. The Leibnizian insists the rooms must have this. The Structuralist says the house proves they don't.
  2.  **"Permutation Invariance":** The idea that swapping the components doesn't create a new reality.
  3.  **"Irreflexive Relations":** The only thing that makes them two is that they oppose each other (like the spins). Room A is Room A only because it is *not* Room B.

  ### The "Smart People Still Disagree" Angle

  To capture the mood you want, have your characters acknowledge that this isn't settled.
  *   **The Realist:** "There has to be a fact of the matter. One room is the 'Original'. Even if we can't measure it." (This aligns with **Haecceitism** / French & Krause).
  *   **The Structuralist:** "That's a ghost. The physics says there's no fact of the matter. The house is a structure, not a collection of objects." (This aligns with **Ontic Structural Realism** / Saunders).

  ### Summary for Your Scene Construction

  *   **The Objects:** Two electrons in a shared orbital (Singlet State).
  *   **The Identity:** Same mass, charge, spatial probability.
  *   **The Distinction:** Only via the relation "has opposite spin to."
  *   **The Conflict:** Does swapping them create a new universe? (Leibniz says Yes/It's impossible; QM Structuralists say No).
  *   **The Application:** The Rooms are not distinct containers; they are relational nodes in a single system. Swapping them is not movement; it is a mathematical permutation that leaves the house unchanged.

  This moves you from "Philosophy 101" (Black's Spheres) to "Graduate Seminar" (Quantum Indiscernibility), which should satisfy your writing group while keeping the eerie, metaphysical itch of your original concept.
