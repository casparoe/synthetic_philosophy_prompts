  *(Refining the Verdict)*: I will argue that the "X" is the **definition of the agent's boundary**. If the agent is a momentary time-slice, the pump works. If the agent is a temporally extended entity (a "world-line"), the pump is avoidable via policy. Rationality applies to the world-line. Therefore, the synchronic axioms are derived, not fundamental.

