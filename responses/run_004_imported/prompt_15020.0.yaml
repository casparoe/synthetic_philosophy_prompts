answer: |-
  Here are 10 hard-hitting questions tailored to your seminar context, designed to press the visitor on the specific tensions in Lewis's argument and the limits of using it to defend Penal Substitutionary Atonement (PSA).

  Each question includes the main prompt, a predicted **Deflection** (the standard move she'll likely make), and a **Pushback** (how to corner her if she tries that move).

  ### 1. The "Compensatory" Trap
  **Question:** Lewis argues that penal substitution only makes coherent sense if punishment is fundamentally *compensatory*—that is, if the goal is to satisfy a victim's desire for suffering (like his example of the burglar becoming the victim's slave). But he also notes that modern criminal law explicitly *rejects* this view; we don't punish to satisfy the victim's bloodlust. If you use Lewis to defend the *coherence* of substitution, are you implicitly admitting that God's justice operates on a vindictive, compensatory model that we've otherwise abandoned as barbaric?
  *   **Predicted Deflection:** She will likely say that God is the unique victim of sin, so His "satisfaction" is qualitatively different from human vengeance.
  *   **Pushback:** "But Lewis's point is structural, not qualitative. If the mechanism requires a victim who *needs* to see suffering to be satisfied, doesn't that make the nature of the justice vindictive regardless of *who* the victim is?"

  ### 2. The "Two-Mindedness" Charge (Prison vs. Fines)
  **Question:** Lewis points out our inconsistency: we allow a friend to pay a fine, but we would never allow a friend to serve a prison term. If you argue that the fine example proves substitution is morally permissible, do you bite the bullet that a murderer's mother should be allowed to serve his prison sentence? If not, what is the *moral* difference between a fine and prison that makes substitution okay for one but not the other, and does sin resemble a fine or a prison term?
  *   **Predicted Deflection:** She will argue that sin is a "debt" (like a fine) rather than a "crime against the body" (like prison).
  *   **Pushback:** "Lewis explicitly rejects the idea that punishment is a debt. He says if it were a debt, the creditor wouldn't care who pays. But the State *does* care who goes to prison. If sin is serious enough to require Christ's death, isn't it more like prison than a parking ticket?"

  ### 3. The "Impracticality" Explanation
  **Question:** Lewis is skeptical of the idea that we ban prison substitution merely for logistical reasons (ID checks, etc.), but he leaves it open. If the only reason we don't let people swap prison terms is *impracticality* rather than *principle*, does that mean substitution is morally neutral? And if it's morally neutral, why is Christ's substitution presented as a *virtuous* act of love rather than just a bureaucratic workaround?
  *   **Predicted Deflection:** She will claim that divine punishment is not subject to human logistical constraints, so the moral principle is what matters.
  *   **Pushback:** "But if humans *could* practically swap prisoners, would it be just? If you say yes, you undermine our intuition about personal guilt. If you say no, then Lewis's 'impracticality' excuse fails, and we're back to substitution being inherently unjust."

  ### 4. Over-reading Lewis's Conclusion
  **Question:** Lewis ends the paper by saying his *tu quoque* argument only shows that critics of PSA are inconsistent, not that PSA is *true* or even *good*. He writes, 'I am not defending the doctrine.' Are you using Lewis to clear a logical obstacle, or are you inflating his tentative observation into a positive endorsement of the theory?
  *   **Predicted Deflection:** She will say she is only using him to show the doctrine is logically possible, not that it's automatically true.
  *   **Pushback:** "If you're only using him to show logical possibility, then you still need a separate moral argument for why God *should* accept substitution. Lewis gives you permission to ask the question, but doesn't help you answer it. Why cite him as a 'strong card' if he doesn't play the hand?"

  ### 5. Fines as "Prices" vs. Punishment
  **Question:** Many legal theorists (like Posner) argue we allow fines to be paid by others because they function as *prices*, not punishments. Lewis disagrees, but if he's wrong and fines *are* just prices, then his whole analogy collapses. On what grounds do you insist a fine is punitive if the system treats it as transferable?
  *   **Predicted Deflection:** She will lean on Lewis's authority that fines are indeed punitive because they carry stigma and are imposed by courts.
  *   **Pushback:** "But the stigma attaches to the *conviction*, not the payment. The payer remains anonymous. If the suffering (payment) is detached from the stigma (guilt), isn't that exactly the problem with PSA? Christ pays, but do we really believe he bears the *stigma* of being a sinner?"

  ### 6. Deterrence and Moral Hazard
  **Question:** One reason we forbid prison substitution is that it destroys deterrence: if I know my rich friend can do my time, I'm more likely to murder. If PSA allows moral substitution, does it not create a 'moral hazard' where believers feel free to sin because the penalty is pre-paid? How does your theory avoid making grace a license for recklessness?
  *   **Predicted Deflection:** She will argue that true faith produces sanctification and good works, so believers won't abuse the grace.
  *   **Pushback:** "That's a psychological claim, not a structural one. Structurally, if the penalty is transferable, the deterrent is removed. Lewis's analogy shows we allow this for fines, but we accept that fines are less effective deterrents than prison. Are you admitting PSA is a less effective deterrent than personal judgment?"

  ### 7. The Identity of the Guilty Party
  **Question:** In the fine example, the *guilty person* is still the one convicted; only the money changes hands. In PSA, Christ isn't just paying the penalty; he is often described as *becoming* sin. Does Lewis's analogy hold if the substitute must take on the *identity* of the guilty, not just the cost?
  *   **Predicted Deflection:** She will distinguish between the *penalty* (which is transferred) and the *moral guilt* (which remains with the sinner).
  *   **Pushback:** "But Lewis's point about punishment is that it must attach to the guilty *person*. If Christ suffers but isn't guilty, isn't that exactly the scenario Lewis says we reject in the prison case? You can't have it both ways: either he's guilty (which is heresy) or he's an innocent third party (which is unjust)."

  ### 8. The State vs. God (Judge and Victim)
  **Question:** In Lewis's secular examples, the State punishes on behalf of the victim, but the State is not the victim. In PSA, God is both the Judge and the Victim. Does this collapse of roles invalidate Lewis's analogy? If the creditor and the judge are the same person, doesn't that allow for arbitrary waiver of penalties that a secular state couldn't permit?
  *   **Predicted Deflection:** She will argue that God's sovereignty allows Him to merge these roles in a way human governments cannot.
  *   **Pushback:** "If God can merge those roles, then human analogies like Lewis's are irrelevant. You can't use a secular argument about fines to defend a divine prerogative that explicitly breaks the rules of that secular system."

  ### 9. The "Creditor" Analogy
  **Question:** Lewis insists punishment is *not* a debt because a creditor doesn't care who pays, but a punisher does. If you rely on Lewis to defend substitution, are you forced to treat God as a Creditor who just wants the money (suffering) regardless of the source? Doesn't that reduce the Atonement to a transaction rather than a moral restoration?
  *   **Predicted Deflection:** She will say God cares about justice, not just money, but justice requires satisfaction.
  *   **Pushback:** "But Lewis says if justice requires satisfaction of suffering, it doesn't matter who suffers. If it doesn't matter who suffers, then moral agency is irrelevant. Is that the view of justice you want to defend?"

  ### 10. The Scope of the Tu Quoque
  **Question:** Lewis's argument is a *tu quoque*: 'You do it too.' But *tu quoque* fallacies don't establish truth, only hypocrisy. Even if secular society is inconsistent about fines, does that inconsistency make penal substitution *right*, or does it just mean secular society is also wrong to allow fines to be paid by others?
  *   **Predicted Deflection:** She will argue it removes the objection that the doctrine is *incoherent*, allowing it to be evaluated on other grounds.
  *   **Pushback:** "Sure, it removes the 'incoherent' label. But if the secular practice (fines) is actually unjust (as our prison intuition suggests), then Lewis hasn't defended PSA; he's just implicated us in the same injustice. Why should we model divine justice on a human practice we suspect is flawed?"
