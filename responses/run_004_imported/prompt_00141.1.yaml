answer: |-
  Your intuition is correct: **your sister's reasoning is fundamentally flawed.** While it sounds logical on the surface, it conflates *asset ownership* with *operational capability*, and it misidentifies the true baseline for negotiation.

  Here is a breakdown of why her argument doesn't hold up economically or logically, and a better framework for negotiating a fair split.

  ### 1. The "Solo" Premise is False
  The core of her argument is: *"If I did this alone, I'd make 3x what you could make alone."*

  **The Flaw:** She cannot do this alone. You jointly inherited the building. Unless she buys you out, she does not own 100% of the asset. She cannot renovate or rent a building she only partially owns without your consent.

  Therefore, her "solo outcome" is not a realistic alternative. It is a hypothetical scenario that requires your cooperation (to sell her your share) to achieve. By using a hypothetical solo outcome as her baseline, she is effectively asking you to pay her for a capability she cannot utilize without you.

  ### 2. The Real Baseline: BATNA
  In negotiation theory, your leverage is determined by your **BATNA** (Best Alternative to a Negotiated Agreement). What happens if you *don't* agree to her renovation plan?

  *   **Her BATNA:** She owns 50% of a building. She cannot renovate it alone. She could force a sale (partition action), but that incurs legal fees and might result in a lower market price than a renovated property.
  *   **Your BATNA:** You own 50% of a building. You can block her renovation plans. You can agree to sell the building now and split the proceeds 50/50.

  **The Reality:** The negotiation isn't between "Her Solo Venture" vs. "Joint Venture." It is between **"Sell the Building Now (50/50)"** vs. **"Renovate and Rent Together."**

  If the joint venture creates more value than selling the building today, that *extra* value (the surplus) is what you are negotiating over. Her superior contacts and capital are tools to create that surplus, but they do not grant her ownership of the underlying asset.

  ### 3. Confusing Equity with Compensation
  Your sister is arguing for an **equity split** (ownership of profits) based on **operational input** (skills and capital). This is the wrong bucket.

  A fair partnership structure separates three distinct things:
  1.  **Asset Ownership:** You likely own the land/building 50/50 by inheritance. This entitles you to 50% of the residual value unless one of you buys the other out.
  2.  **Capital Contribution:** If she puts in more money for renovations, she should be repaid that money first, perhaps with interest.
  3.  **Sweat Equity/Management:** If she uses her contacts and manages the renovation/tenants, she should be paid a **management fee** or a "promoted interest" for that labor.

  **Her Argument:** "I am better at this, so I get 75% of the profit."
  **Better Argument:** "I am putting in more money and doing more work, so I get my capital back + interest, a management fee, and then we split the remaining profit 50/50 (or 60/40)."

  ### 4. The "Irrational" Threat
  She claims partnering with you is "irrational" for her if the split isn't 3:1. This is a negotiation tactic known as **anchoring**. She is trying to set a high anchor to pull the final number in her favor.

  However, consider the reverse: Is it irrational for *you* to partner with *her*?
  *   If you agree to 3:1, you are accepting 25% of the profit on an asset you own 50% of.
  *   If you refuse, you can force a sale.
  *   If the renovation is as profitable as she claims, she *needs* your share of the building to execute it. She has more to lose from a stalemate than you do because she has the specific vision and capital she wants to deploy. **She is actually more dependent on your consent than you are on her skills.**

  ### 5. A Better Framework for the Split
  Instead of accepting her 3:1 anchor, propose a structure that compensates her for her advantages without stripping you of your ownership rights.

  **Option A: The "Preferred Return" Model**
  *   **Capital:** She puts in the renovation capital. The project pays her back first, plus a preferred return (e.g., 8% interest) on that cash.
  *   **Labor:** She gets a property management fee (e.g., 5-10% of monthly rent) for handling tenants and repairs.
  *   **Profit:** After capital and fees are paid, the remaining net profit is split **50/50** based on asset ownership.

  **Option B: The "Promote" Model**
  *   You split profits 50/50 up to a certain return threshold (e.g., 10% annual return).
  *   If her superior management pushes returns *above* that threshold, she gets a larger share of the *excess* profit (e.g., 70/30 on anything above 10%).
  *   This rewards her skill without penalizing your baseline ownership.

  **Option C: The Buyout**
  *   If she truly believes she can generate 3x the value solo, she should buy your share of the building outright at fair market value.
  *   You take your 50% cash and walk away. She keeps 100% of the future profit (and 100% of the risk).
  *   *Note:* If she refuses this, it proves she knows her "solo" claim is exaggerated and she needs your equity to mitigate her risk.

  ### Summary
  Your sister is trying to monetize her *potential* efficiency by claiming ownership of *your* asset.

  *   **Her Logic:** "I can drive the car faster, so I should own the car."
  *   **Correct Logic:** "You own half the car. If you drive, I'll pay you a driver's fee. If you put in gas, I'll pay you back for the gas. But we still own the car equally."

  **Recommendation:** Do not accept the 3:1 split. Acknowledge her skills and capital, but insist that those be compensated through **fees and interest**, not by diluting your inherited equity. If she insists the project is so lucrative, offer to sell her your share for a lump sum. If she balks at that, her argument about the "irrationality" of partnering with you collapses.

  *Disclaimer: I am an AI, not a lawyer or financial advisor. Inheritance and partnership laws vary by jurisdiction. You should consult with a qualified attorney or mediator before finalizing any agreement.*
