      *One more nuance:* Good's theorem is about *individual* decision theory. Hirshleifer is about *general equilibrium*. In GE, prices adjust. The "act" of buying insurance at price $p$ is available under ignorance. Under information, the equilibrium price $p$ might not exist or the contract isn't offered. So the "act" itself vanishes. Good's theorem assumes the menu of acts is stable.

