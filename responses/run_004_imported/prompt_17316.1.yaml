      2. Hirshleifer's Effect (The Mechanism).
      3. The Specific Premise Failure (Endogenous Payoffs/Feasible Sets).
      4. Why it's not a counterexample to Bayesianism (Updating is fine, the *world* changed).
      5. Summary/Takeaway.

