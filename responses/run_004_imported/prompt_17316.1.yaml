      *   *The Real Violation:* Good's theorem compares $E[\max_a U]$ vs $\max_a E[U]$ **holding the decision problem fixed**. Hirshleifer changes the decision problem (the feasible set of trades) based on the information.
      *   *Wait, is that right?* In Hirshleifer, the information arrives *before* the decision (trading). So the agent *does* maximize expected utility given the info. The problem is that the *ex-ante* expected utility (before knowing if info will arrive) is lower with info.
      *   *Ah, the "Value of Information" is defined Ex-Ante.* Good says $V(E) \geq 0$. Hirshleifer says $V(E) < 0$.
      *   *Why?* Because Good assumes the mapping from (Action, State) to Utility is invariant to the Information Structure. Hirshleifer's mapping is **not invariant**. The existence of a risk-sharing market is a function of the information structure.
      *   **Key Phrase:** "Payoff-Relevant Externalities" or "Endogenous Opportunity Sets."

  7.  **Finalizing the Argument Steps:**
      1.  **Formalize Good:** $V(I) = E[\max_a E[U|I]] - \max_a E[U] \geq 0$. Assumption: $U(a, \omega)$ is independent of $I$.
      2.  **Formalize Hirshleifer:** $U$ depends on trades. Trades depend on prices. Prices depend on information. So $U(a, \omega, I)$.
      3.  **The Violation:** Good's proof requires $\frac{\partial U}{\partial I} = 0$. Hirshleifer has $\frac{\partial U}{\partial I} \neq 0$ because $I$ affects other agents' willingness to trade.
