answer: |-
  This is a classic tension in decision theory and economics, and your professor was right to flag it, but you are also right to demand more than a "levels of analysis" hand-wave. To resolve this rigorously, we need to look at the **formal assumptions** underpinning Good's Theorem and identify exactly which one is violated in the Hirshleifer setup.

  The short answer is: **Good's Theorem assumes the payoff structure (the mapping from actions and states to outcomes) is exogenous and invariant to the information structure. Hirshleifer's scenario involves endogenous payoffs where the information structure itself alters the feasible set of actions and their consequences.**

  Here is the argument pinned down properly.

  ### 1. The Formal Setup of Good's Theorem
  To see where it breaks, we must state Good's Theorem (1967) precisely.

  Let:
  *   $\Omega$ be the set of states of the world.
  *   $A$ be the set of available acts (actions).
  *   $U(a, \omega)$ be the utility function (consequences).
  *   $P(\omega)$ be the prior probability distribution.
  *   $E$ be an experiment yielding signal $s \in S$ with likelihood $P(s|\omega)$.

  Good's Theorem compares two strategies:
  1.  **Act Immediately:** Choose $a^*$ to maximize prior expected utility: $\max_a \sum_\omega P(\omega)U(a, \omega)$.
  2.  **Observe then Act:** Observe $s$, update to $P(\omega|s)$, then choose $a_s^*$ to maximize posterior expected utility. The ex-ante value is $\sum_s P(s) \max_a \sum_\omega P(\omega|s)U(a, \omega)$.

  **The Theorem:** Strategy 2 $\geq$ Strategy 1.
  **The Proof:** Follows from the convexity of the $\max$ function (Jensen's Inequality).

  **The Crucial Hidden Premise:**
  For this inequality to hold, the function $U(a, \omega)$ and the set $A$ must be **fixed** across both scenarios. Specifically, the theorem assumes:
  $$U_{\text{info}}(a, \omega) = U_{\text{no-info}}(a, \omega)$$
  $$A_{\text{info}} = A_{\text{no-info}}$$
  In standard decision theory (Decision Against Nature), the "rules of the game" are set by Nature and do not care whether you looked at a signal or not. The payoff for "betting on Rain" is fixed regardless of whether you checked a barometer first.

  ### 2. The Hirshleifer Effect (1971)
  In Hirshleifer's model, we are not in a single-agent decision problem against Nature. We are in a **General Equilibrium** setting with multiple agents.

  *   **Scenario A (Ignorance):** Agents do not know who will have the bad harvest. Because they are risk-averse, they trade insurance contracts *ex-ante*. The market clears at prices that allow risk-sharing. Everyone achieves high expected utility via smoothed consumption.
  *   **Scenario B (Public Information):** A costless signal reveals *before trading* who will have the bad harvest.
  *   **The Consequence:** There is no longer uncertainty to share. The agent with the good harvest has no incentive to insure the agent with the bad harvest. The insurance market collapses. Agents are stuck with their raw, volatile endowments.
  *   **The Result:** Risk-averse agents have lower ex-ante expected utility in Scenario B than in Scenario A.

  ### 3. Pinning Down the Violation
  Why does this not contradict Good? Because in Hirshleifer's scenario, **the premise that $U(a, \omega)$ is invariant to the information structure is false.**

  In Good's framework, the consequence of an action $a$ depends only on the state $\omega$. In Hirshleifer's framework, the consequence of an action $a$ (e.g., "offer to buy insurance") depends on:
  1.  The state $\omega$ (who had the bad harvest).
  2.  **The information structure $I$** (because $I$ determines other agents' beliefs).
  3.  **Other agents' actions** (which are functions of their beliefs).

  In economic terms, the **opportunity set is endogenous**.

  When you apply Good's Theorem, you are implicitly assuming that if you choose *not* to look at the evidence, the world remains in the "Ignorance" equilibrium, and if you *do* look, you simply have better probabilities but the same menu of bets.

  But in Hirshleifer's market:
  *   Under **Ignorance**, the act "Buy Insurance at Price $p$" is **feasible** because counter-parties are willing to sell.
  *   Under **Information**, the act "Buy Insurance at Price $p$" is **infeasible** (or available only at prohibitive terms) because counter-parties update their beliefs and withdraw from the market.

  Therefore, the set of available acts $A$ is not fixed.
  $$A_{\text{ignorance}} \neq A_{\text{information}}$$
  Specifically, $A_{\text{information}} \subset A_{\text{ignorance}}$ (in terms of mutually agreeable trades).

  Good's Theorem proves that $E[\max_{a \in A} E[U|s]] \geq \max_{a \in A} E[U]$.
  It **does not** prove that $E[\max_{a \in A_{info}} E[U|s]] \geq \max_{a \in A_{no-info}} E[U]$.

  If acquiring information shrinks your feasible set of actions (by destroying the market conditions that made certain acts possible), the convexity argument fails. The "expectation of the maximum" is taken over a smaller, worse set of options.

  ### 4. Why This Isn't a Counterexample to Total Evidence
  This distinction saves the Principle of Total Evidence.

  The Principle of Total Evidence says: *Given a fixed decision problem, you should utilize all available relevant evidence.*
  It does **not** say: *You should prefer to live in a world where more evidence is publicly available.*

  In the Hirshleifer case, once the information is **already public**, the rational agent *must* use it. If I know you have the bad harvest, I cannot rationally insure you at pooled rates. I would be a "money pump" if I ignored that evidence. So, conditional on the information existing, Good's Theorem still holds: I maximize my utility by using the info.

  The "harm" comes from the **ex-ante evaluation of the information system itself**, not the updating process.
  *   **Good's Theorem** evaluates the value of *using* a signal in a fixed environment. (Value $\geq 0$)
  *   **Hirshleifer** evaluates the value of *changing the environment* by making a signal public. (Value $< 0$)

  The "different things held fixed" your professor mentioned are:
  1.  **Good:** Holds the **game structure** (payoffs and feasible acts) fixed; varies the **agent's epistemic state**.
  2.  **Hirshleifer:** Varies the **game structure** (via equilibrium effects of public info); compares **ex-ante welfare**.

  ### 5. Summary for Your Seminar
  If you want to push this in seminar, here is the precise formulation:

  > "Good's Theorem relies on the assumption that the consequence function $C(a, \omega)$ is independent of the information structure. It assumes a 'small world' decision problem where the agent's information does not alter the payoffs or feasibility of actions for other agents.
  >
  > Hirshleifer's case violates this **independence assumption**. In a general equilibrium setting, public information changes the beliefs of *all* agents, which alters market prices and the feasibility of risk-sharing contracts. This makes the feasible set of acts $A$ and the effective utility function $U$ endogenous to the information structure ($A_I, U_I$).
  >
  > Since Good's inequality $E[\max_A E[U]] \geq \max_A E[U]$ requires $A$ and $U$ to be constant across the comparison, the theorem does not apply to the choice *between* information regimes. It only applies to the decision *within* a regime. Thus, an agent can be rational to use cost-free info (satisfying Total Evidence) while simultaneously rationally preferring a world where that info did not exist (satisfying Hirshleifer)."

  This pins the failure on the **exogeneity of the decision problem**, which is the silent engine driving Good's proof.
