      *   **The Crucial Divergence (The "Pin Down"):**
          1.  **Single vs. Multi-Agent (Strategic Complementarity/Externalities):** Good assumes $U_i(a, \omega)$. Hirshleifer has $U_i(a_i, a_{-i}, \omega)$.
          2.  **Exogenous vs. Endogenous Payoffs:** This is the big one. In Good, the "prizes" for actions are fixed by Nature. In Hirshleifer, the "prizes" (prices/insurance availability) are determined by *equilibrium*, which is a function of the information structure.
      *   **Reconciling:** Show that if you treat the "Market Mechanism" as part of the State $\omega$, Good's theorem *technically* holds for the group, but not for the individual *ex-ante* if the mechanism changes. Wait, that's tricky.
