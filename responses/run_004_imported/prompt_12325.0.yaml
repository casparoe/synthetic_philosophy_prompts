      *   *Binary Belief:* He treats high probability as "belief" for practical purposes.
      *   *The Math:* If he makes 100 predictions at 90% confidence, the expected number of failures is 10. The probability that *all* are true is $0.9^{100} \approx 0.000026$. So, believing "at least one will fail" is statistically rational.
      *   *The Contradiction:* Logically, believing $P_1, ..., P_{100}$ and believing $\neg(P_1 \land ... \land P_{100})$ is inconsistent *if* belief is closed under conjunction.

