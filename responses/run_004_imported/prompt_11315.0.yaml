          *   *Reductionist Rebuttal:* You don't know you're in a one-off case with certainty. More importantly, your brain doesn't work that way. To be the *kind of agent* who succeeds in high-stakes coordination, you must internalize the rule so deeply that you don't calculate exceptions. The "obligation" is the internalization.
