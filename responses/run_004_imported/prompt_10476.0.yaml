answer: |-
  **Setting:** *A quiet study, candlelit. A table between them holds a leather purse, a stack of promissory notes, and a heavy silver tankard. **John Locke** sits stiffly, hands folded. **George Berkeley** leans forward, eyes bright.*

  **Berkeley:** Tell me, Mr. Locke, if I were to melt that tankard down, pour the silver into a mold, and stamp it with the face of a king, does it become more valuable than when it was a cup?

  **Locke:** It becomes *money*. Which is to say, it becomes a measure of value recognized by public authority. But the value itself resides in the silver, not the stamp. The stamp is merely a voucher for the weight and fineness.

  **Berkeley:** A voucher? So you agree it is a token?

  **Locke:** I agree to no such abstraction. A token implies a promise. Silver is a substance. If I lend you a hundred pounds, I lend you a specific quantity of labor and earth, crystallized. If the state debases the coin—clips the edges or mixes in copper—they steal the difference from my pocket. To sever money from silver is to give the sovereign a license to rob the subject without laying a hand on him.

  **Berkeley:** But consider Ireland, sir. The land is fertile, the people willing to work, yet they starve. Why? Because there is no silver in the kingdom. The metal has fled to England. By your logic, the wealth is gone. By mine, the industry remains, sleeping. I propose we wake it with paper tickets.

  **Locke:** Tickets backed by what? Air?

  **Berkeley:** Backed by the industry of the people! If a man builds a house, that is wealth. If a note circulates representing that house, that note is sound. Why is the silver in the vault more "real" than the brick in the wall? Is it not all a matter of estimation? *Esse est percipi*—to be is to be perceived. Value exists in the mind of the trader, not in the lustre of the metal.

  **Locke:** Value exists in the mind, yes, but it is anchored by scarcity. Anyone can print a note. Anyone can stamp a name. But only the mines can yield silver. If you remove that anchor, what prevents the state from printing tickets until a wheelbarrow of them buys a loaf of bread? You speak of waking industry, but you invite chaos. When money loses its fixed measure, contracts become gambles. The creditor is ruined, the debtor enriched by deceit.

  **Berkeley:** And when money is tied to silver, the hoarder becomes king! You worship a metal that does nothing. It sits. It rusts. It is shipped across oceans to sit in other vaults. I ask you: if a nation has all the silver in the world but no corn, no cloth, no tools, are they rich?

  **Locke:** They could purchase those things from any nation on earth.

  **Berkeley:** Could they? If every nation decides to keep its corn and cloth, your silver is merely a shiny rock. No, sir. Silver is only valuable because men *agree* to trade for it. It is a social convention, nothing more. If we agree that a paper note commands bread, it commands bread. The virtue is in the credit of the nation, not the content of the purse.

  **Locke:** Men agree to it because silver is costly to produce. That cost is the discipline. Your paper requires only ink and a lie. You say the state should issue these notes for the public good. But who defines the good? A king in debt will define "public good" as paying his soldiers today and worrying about inflation tomorrow. Silver is the only check on power that does not require a revolution.

  **Berkeley:** You place your faith in a rock to check tyranny. I place mine in the public spirit. If the bank is national, and the notes are issued against real assets—land, improvements, trade—then the quantity of money grows with the wealth of the people. With your silver, the money supply is stagnant while the population grows. You strangle trade to protect the measure. I would expand the measure to feed the trade.

  **Locke:** You expand the measure until the measure means nothing.

  **Berkeley:** And you keep the measure perfect while the people perish for lack of it.

  **Locke:** *(Pauses, tapping the silver tankard)* I seek to protect property. Without a constant standard, there is no property, only possession.

  **Berkeley:** *(Gestures to the notes)* And I seek to activate life. Without circulation, there is no wealth, only hoards.

  **Locke:** Then we are at an impasse. You trust the virtue of the issuer.

  **Berkeley:** And you trust the scarcity of the earth.

  **Locke:** Scarcity does not lie, Mr. Berkeley.

  **Berkeley:** Nor does it build houses, Mr. Locke. Men do.

  *(Silence settles between them. Locke reaches for the tankard; Berkeley picks up a note. Both hold their ground, the tension of the coming centuries hanging in the air.)*
