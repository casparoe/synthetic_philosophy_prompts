answer: |-
  The air in Conference Room B tasted of recycled ozone and stale coffee. Outside the thick quartz glass, the station *Aethelgard* hung in the shadow of the gas giant, silent and cold. Inside, three people sat around a table that hummed with haptic feedback.

  Commander Halloway rubbed her temples. Dr. Aris, the chief medical officer, was staring at his datapad. Chief Vance, security, was polishing his glasses, though he wasn't wearing them.

  "Protocol Obsidian," Halloway said, her voice flat. "We need to finalize the decision on the *Meridian* crew. They've been docked for six hours. We either lock down Sector Four or we let them rotate back into the general population."

  She tapped the table surface. A holographic schematic appeared. "You know the rule. Protocol Obsidian triggers if and only if two conditions are met. One: Confirmed Exposure. The crew physically interacted with the artifact. Two: Confirmed Vector. The pathogen is airborne. If both are true, we lock down. If either is false, standard decon suffices."

  Aris nodded slowly. "I've reviewed the bioscans. The crew definitely touched the artifact. The residue on their suits matches the site. So, Exposure is confirmed. But the pathogen... it's stable on surfaces. I haven't seen evidence of aerosolization. Vector is unconfirmed."

  Vance put his glasses back on. "I disagree on the exposure. The logs show they wore suits. Integrity held. No skin contact. But," he held up a finger, "the air scrubbers in their airlock spiked during docking. Something got through the filters. That suggests airborne particulates. Vector is confirmed."

  Halloway sighed. "My assessment differs from both of you. The suit logs were tampered with; exposure happened. And the scrubber spike confirms aerosolization. Vector is confirmed."

  She looked between them. "We vote. Individually. Submit your judgments on Exposure, Vector, and the final Protocol decision. The system aggregates automatically."

  They tapped their screens. The room was silent except for the hum of the servers. A moment later, the central display lit up with the results.

  **VOTE TALLY**

  **Issue 1: Confirmed Exposure?**
  Yes: 2 (Halloway, Aris)
  No: 1 (Vance)
  *Majority Verdict: YES*

  **Issue 2: Confirmed Vector (Airborne)?**
  Yes: 2 (Halloway, Vance)
  No: 1 (Aris)
  *Majority Verdict: YES*

  **Issue 3: Enforce Protocol Obsidian?**
  Yes: 1 (Halloway)
  No: 2 (Aris, Vance)
  *Majority Verdict: NO*

  The silence stretched, heavier than before. The hologram glowed softly, the contradiction hanging in the air like smoke.

  Halloway leaned forward. "Wait. Look at the premises. The majority says Exposure is real. The majority says Vector is real. If both are real, the protocol dictates lockdown. But the majority vote on the protocol itself says no lockdown."

  Aris frowned, tapping his stylus against his chin. "I voted based on my medical assessment. I believe Exposure is true, but Vector is false. Therefore, logically, Obsidian must be false. I voted consistently."

  "Same here," Vance said, his voice tight. "I believe Exposure is false. Vector is true. Therefore, Obsidian is false. I voted consistently."

  "And I voted Yes on all three," Halloway said. "So every single one of us is logically consistent. Our individual judgments hold together."

  "But the group's judgment doesn't," Aris murmured. He looked at the screen as if it were a patient displaying impossible vitals. "If we follow the premise-based majority, we have to lock down. The group believes the conditions are met."

  "If we follow the conclusion-based majority, we do nothing," Vance countered. "The group rejects the lockdown. Two out of three of us think the lockdown is unnecessary."

  "Because we disagree on *why*," Halloway said. "You think it's safe because it's not airborne. Vance thinks it's safe because they weren't exposed. But together, the majority thinks it *is* airborne and they *were* exposed."

  Aris rubbed his eyes. "So if we respect the majority view on the facts, we endanger the station. But if we respect the majority view on the action, we ignore the majority view on the facts."

  "It's a procedural error," Vance said, though he didn't sound convinced. "We should have just voted on the lockdown. The facts are secondary to the decision."

  "The facts aren't secondary," Aris snapped. "If we vote No on lockdown but Yes on airborne, we're lying on the record. Future crews will read that the pathogen is airborne and assume we took precautions we didn't."

  Halloway stood up and walked to the window. The gas giant swirled below, indifferent. "If I enforce the lockdown based on the premises, I'm overruling two out of three of you on the final call. If I cancel the lockdown based on the conclusion, I'm signing off on a report that says the air is safe when the majority says it isn't."

  "Can't we revote?" Vance asked.

  "On what?" Halloway turned back. "If we revote the premises, you two won't change your minds. If we revote the conclusion, you'll still vote No. The inconsistency isn't in our minds. It's in the aggregation."

  Aris looked at the blinking cursor on the central console. The system was waiting for an executive override. It wanted a binary command: LOCKDOWN or CLEAR.

  "We need a rule for the rules," Aris said quietly.

  "There isn't one," Halloway said. "Not in the manual."

  Vance stood up, pacing the small room. "So we just sit here? The *Meridian* crew is waiting in the airlock. They're tired. They want to know if they're going to sleep in their bunks or in containment."

  "They'd rather be tired than dead," Aris said.

  "And they'd rather be free than imprisoned on a technicality," Vance shot back.

  Halloway looked at the screen again. The logic was flawless, and it was broken. The majority said the danger was real, but the majority also said the action was unnecessary. It was a perfect circle of contradiction, sealed tight by democracy.

  She walked back to the table and placed her hand over the console. The haptic feedback hummed against her palm, waiting for input. She looked at Aris, who was staring at the medical data, and Vance, who was watching the security feeds. Both were right. Both were wrong.

  "Give me a minute," Halloway said.

  She didn't press the button. Outside, the station drifted on, silent and steady, while the three of them watched the numbers on the screen refuse to add up.
