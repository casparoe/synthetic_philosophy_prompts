  pascal's mugging has been bugging me and I think the standard writeups skip a step. If your prior is basically Solomonoff-style, doesn't the mugger's claim -- "I'm a matrix lord who can torture 3^^^3 people, pay me $5" -- automatically get assigned a microscopic probability just for being such a wild, high-complexity hypothesis, tanking the expected value below $5 with zero extra machinery? But everyone from Yudkowsky onward treats this as a genuinely hard open problem (hence stuff like the leverage penalty), so I feel like im missing something obvious here. What part of the argument does a plain complexity-based prior not already handle?
