      *   **Example:** $3 \uparrow\uparrow\uparrow 3$ is a gigantic number, but the *description* "3^^^3" is very short. A Turing machine can compute it with a short program.
      *   **Consequence:** $P(\text{claim}) \approx 2^{-\text{Length}(\text{"3^^^3"})}$. This is small, but is it small enough to counterbalance $3 \uparrow\uparrow\uparrow 3$?
