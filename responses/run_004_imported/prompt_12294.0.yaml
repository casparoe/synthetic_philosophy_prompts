answer: |-
  Here are ten questions designed to move past the mechanics of the Basic Argument and into its implications, tailored to your voice as a host who has done the reading but cares about the human stakes.

  ### 1. The Indeterminism Objection
  My gut reaction when I first read the Basic Argument was that strict determinism might kill responsibility, but surely a little bit of randomness helps? If there's genuine indeterminism in how I'm wired, doesn't that break the chain and let me "could have done otherwise"? You argue it doesn't help at all. Why is having a random element in my decision-making process no better for *ultimate* responsibility than being a deterministic machine?

  *   **Follow-up:** You'll likely say that randomness is just luck, and luck isn't control. But if I get lucky and my random neural firing leads to a generous act, can I still accept *praise* for that, even if I can't accept ultimate responsibility?

  ### 2. Ultimate vs. Ordinary Responsibility
  You draw a hard line between "ultimate" responsibility, which you say is impossible, and "ordinary" responsibility, which we use in courtrooms and relationships. I worry this distinction might be a way to keep the argument's shock value without paying its practical costs. If I can't be ultimately responsible for my character, does "ordinary" responsibility still carry enough weight to justify genuine blame, or is it just a polite fiction we tell each other?

  *   **Follow-up:** If you say it's not a fiction but a necessary social tool, I want to ask: When a person feels deep shame or guilt, they feel it as an *ultimate* failure. Are we essentially gaslighting them by saying, "Your feeling is metaphysically impossible, but please keep feeling it for society's sake"?

  ### 3. P.F. Strawson and Reactive Attitudes
  I recently learned that P.F. Strawson, who wrote *Freedom and Resentment*, was Galen Strawson's father. The father argued that reactive attitudes like resentment and gratitude are natural human commitments we can't and shouldn't drop, regardless of the metaphysics. Does your father's paper undercut your own argument? If we aren't going to give up resentment even if determinism is true, does it actually matter that "ultimate" responsibility is impossible?

  *   **Follow-up:** I suspect you'll say metaphysics and psychology are separate domains. But if the psychology is immutable, doesn't that render the metaphysical conclusion irrelevant to how we actually live our lives?

  ### 4. The Gap Between Intellect and Feeling
  Galen Strawson has admitted that even though he accepts the Basic Argument intellectually, he still feels like a free agent choosing between real options in the middle of an ordinary day. There's a gap between the proof and the experience. Do you view that persistent feeling of freedom as a cognitive illusion that we just have to live with, or is there a way to align your internal experience with your philosophical conclusion?

  *   **Follow-up:** If it is an illusion you can't shake, does knowing it's an illusion make you trust your own decision-making process less when you're facing a difficult moral choice?

  ### 5. The Jury Room and "Bookkeeping"
  I ended up on this path because I sat on a jury and couldn't shake the feeling that a guilty verdict was just "useful bookkeeping" if the defendant couldn't help being who they were. If we accept your view, does a verdict change from a judgment of *moral guilt* to something more like a quarantine decision? And if so, how do we explain that to a victim's family without sounding cold?

  *   **Follow-up:** You might say we can still hold people accountable for safety reasons. But without the moral judgment, doesn't the punishment lose its expressive power—the statement that "this was wrong," not just "this is risky"?

  ### 6. Forward-Looking Blame
  If backward-looking, desert-based blame is off the table because no one is ultimately responsible, does all blame become forward-looking? Are we essentially training dogs when we blame people—just trying to modify future behavior rather than responding to past agency?

  *   **Follow-up:** If it's just behavior modification, does that reduce the person being blamed from a moral agent to an object to be managed? And if so, is that a more dignified way to treat people, or less?

  ### 7. Moral Luck
  Thomas Nagel wrote about "moral luck," suggesting that factors outside our control determine our moral standing. Your argument seems to take this to its logical conclusion: if I can't be responsible for how I am, all moral standing is luck. Does this mean the virtuous person isn't actually *good*, they're just lucky they weren't caused to be vicious?

  *   **Follow-up:** If virtue is just luck, does that dismantle our reason to admire heroes? Do we admire a hero for their character, or just for the fortunate causal chain that produced them?

  ### 8. Pride and Achievement
  I want to ask about the positive side. We talk a lot about blame, but what about pride? If I write a book or raise a child well, and I didn't make the self that did those things, is my sense of achievement hollow? Is there a version of pride that survives the Basic Argument, or do we have to give up taking credit for our successes too?

  *   **Follow-up:** If you say a thinner version of pride survives, is it satisfying enough to motivate hard work? Or does believing this argument risk making us passive?

  ### 9. Compassion and Resentment
  One argument for your view is that it should make us more compassionate. If nobody is ultimately responsible, resentment looks like a mistake. But does accepting this actually make people nicer, or does it just make them indifferent? I'm curious if you've seen this shift in your own life—do you find yourself getting less angry at people who wrong you?

  *   **Follow-up:** If you say you feel more compassion, does that compassion extend to the people judging the wrongdoers? Should we feel compassion for the jury or the judge who is falsely believing in ultimate responsibility?

  ### 10. The Personal Cost
  Defending this position seems like it could be isolating. You're telling people they don't have the kind of freedom they feel every day, and that their deepest feelings of guilt or pride are based on a mistake. What is the hardest part of holding this view in your personal life? Is there a moment where you wish you could just believe in ultimate responsibility again?

  *   **Follow-up:** If you say you sometimes wish you could believe it, does that suggest that the truth of the matter might be less important than the utility of the belief?
