answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. Denny was my uncle, but if I'm being honest, he was more like my co-conspirator.

  If you knew Denny, you probably knew him in one of two ways. Maybe you knew him from the bowling league, where he could split a 7-10 pin but would argue with the scoreboard if it didn't add up right. Or maybe you knew him from the family gatherings, where he was the one making sure everyone had enough potato salad.

  But I knew him from the porch. For about fifteen years, Saturday mornings were for coffee and hard questions. We didn't go to college. We didn't have degrees. But we had the library and an internet connection, and Denny had a mind that wouldn't let go of a puzzle. We spent years arguing about what's happening inside our heads. What is thinking? What is feeling? What is *us*?

  Toward the end, Denny landed on an idea that might sound strange to some of you. He believed that the "spark" we think is inside us—the little voice, the magical glow of experience—that's a trick. Not a lie, but a trick. Like a mirror making a room look bigger. He thought we don't need a ghost or a soul to make our lives matter. He thought the machinery of being human, the blood and the brain and the history, was miraculous enough on its own.

  Now, I know some of you are looking for comfort today. You want to know he's at peace, or that he's watching over us. And I know some of you are worried that because he didn't believe in the usual afterlife, he didn't believe in *us*.

  But Denny left me specific instructions on this. He told me: "Don't you dare tell people I'm watching over them, and don't you dare tell them I didn't really love them either. Those are wrong for the same reason."

  It took me a while to understand what he meant. But I think I get it now.

  To say he's "watching over us" implies he's somewhere else, looking back. But Denny isn't somewhere else. He's here. In the way we treat each other. In the habits he taught us.

  And to say he "didn't really love us" because he didn't believe in a soul is like saying a song isn't real because it's just vibrations in the air. The music is in the playing, not in a ghost note. Denny's love wasn't a spiritual substance floating in the ether. It was real. It was in the porch talks. It was in the rides to the hospital. It was in the way he remembered your birthday and asked about your knee injury.

  He didn't need to believe in magic to feel wonder. He didn't need to believe in a ghost to feel love.

  For those of you who just want to miss him: that's okay. That pain you feel? That's not an illusion. That's the proof. Denny would say that grief is just the mind recognizing a pattern that's suddenly broken. It's real. It matters. And it proves that what we had with him was solid, tangible, and true.

  He spent his life trying to see things clearly, without the varnish. He wanted to know what was actually there. And what was actually there was a man who listened when no one else would, who argued because he cared about the truth, and who loved his family with everything he had.

  He's not watching over us. He doesn't have to. Because he built us to watch over each other.

  So, if you want to honor Denny, don't look up. Look around. Take care of the person sitting next to you. Ask them how they're really doing. Argue about something important. Drink the coffee.

  He figured out that the magic wasn't in the "what if." It was in the "what is." And what we have right now, this family, this memory, this love... that is enough.

  Rest easy, Uncle Denny. The porch is quiet, but the argument goes on.
