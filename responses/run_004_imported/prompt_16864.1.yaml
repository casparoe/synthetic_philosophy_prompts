answer: |-
  Here are eight interview questions designed to engage your guest's genic selectionist position with the technical rigor appropriate for your background, while pressing hard on the "change of coordinates" deflection.

  **1. The "Coordinates" Metaphor**
  "You open your recent paper with the claim that shifting from a genic to a group-level formalism is merely 'a change of coordinates, not a change of ontology.' In physics, changing coordinates doesn't change the physical forces at play, but it also doesn't change the *invariants* of the system. If the gene frequency change is the invariant, fine. But in biology, unlike classical mechanics, the 'forces' themselves—development, interaction, ecological feedback—seem to emerge at specific scales. If I change my coordinates from the gene to the colony, I lose the ability to model specific causal mechanisms that only exist at the colony level. So, in what sense is the ontology preserved if the causal mechanisms visible in one frame vanish in the other?"

  **2. The Price Equation and Partitioning**
  "Let's move to the Price Equation. We know the total change in trait frequency can be partitioned into within-group and between-group covariance terms. However, as you know, this partitioning is mathematically underdetermined; I can define 'groups' in multiple ways that satisfy the equation but imply different causal structures. You argue this arbitrariness proves higher levels aren't ontologically real. But doesn't the fact that *any* partition is possible simply show that the Price Equation is a bookkeeping device, rather than proof that the gene is the *only* causal agent? If the math allows me to partition variance such that group selection is the dominant term, why is that partition less 'real' than the one where genic selection dominates?"

  **3. Follow-up on Price (Keyed to her likely defense of mathematical equivalence)**
  *She will likely respond that while partitions vary, the net gene frequency change is the only invariant outcome, so causality must track the invariant.*
  "If you argue that causality must track the mathematical invariant, aren't you conflating the *outcome* of evolution with the *process* of selection? Two different causal processes can yield the same net frequency change. If I can construct a scenario where manipulating the group structure changes the outcome, but manipulating the specific gene sequence (holding context constant) does not, haven't I identified a causal lever at the group level that your 'invariant' account misses?"

  **4. Sober, Screening-Off, and Selection *For***
  "Elliott Sober distinguishes between selection *of* entities and selection *for* properties, arguing that organisms are selected *of*, but traits are selected *for*. Genic selectionists often extend this to argue that the gene 'screens off' the organism; once you know the gene's frequency and effect, the organismal context adds no predictive power. But this relies on the assumption that a gene's fitness effect is context-independent. Given what we know about epistasis and norm of reaction, isn't it the case that the organismal or group context often determines the fitness value of the gene itself? If the context determines the value, how can the gene screen off the context?"

  **5. Follow-up on Sober (Keyed to her likely defense of the gene as the common cause)**
  *She will likely respond that the gene is the 'common cause' of both the trait and the reproductive success, rendering the organism a mere vehicle.*
  "If the gene is the common cause, it must be identifiable independently of its effects. But in developmental systems theory, the 'gene' as a causal unit is often only definable in terms of the developmental system it is embedded in. If you cannot individuate the replicator without referencing the higher-level vehicle it helps construct, doesn't that mutual dependence undermine the claim that the gene is ontologically prior to the organism?"

  **6. MLS2 and Eusocial Reproduction**
  "Samir Okasha distinguishes MLS1, where groups dissolve, from MLS2, where groups themselves reproduce, such as eusocial colonies budding off daughter colonies. In MLS2, the individual workers are often sterile; they have zero direct fitness. The variance in fitness exists almost exclusively between colonies, not individuals. If the 'unit of selection' is defined as the entity whose variance in fitness drives evolutionary change, doesn't MLS2 force us to admit the colony as a Darwinian individual? To say this is still just 'genic selection' seems to stretch the definition of the gene's vehicle to the point of triviality."

  **7. Follow-up on MLS2 (Keyed to her likely defense of the colony as a 'mega-vehicle')**
  *She will likely respond that the colony is just a 'mega-vehicle' constructed by genes to propagate themselves, similar to a body.*
  "But a body does not typically reproduce by budding off new bodies while the somatic cells remain sterile. In a colony, the 'germ line' is effectively the colony itself, not the individual genome within a queen. If the genes inside the workers *cannot* replicate except through the reproduction of the colony as a whole, isn't the colony the necessary condition for replication? At what point does a vehicle become so functionally integrated that calling it a 'vehicle' is just a semantic dodge to avoid calling it a 'replicator'?"

  **8. The Falsifiability Question**
  "Finally, I want to ask about the empirical or conceptual boundaries of your view. Genic selectionism is often criticized for being unfalsifiable because any group-level phenomenon can be redescribed as genic competition given enough ingenuity. So, I ask you directly: What finding, empirical or conceptual, would ever count for you as evidence that some level above the gene has autonomous causal standing? Is there any possible world, or any actual biological case, where you would concede that the 'change of coordinates' is actually a change of ontology?"
