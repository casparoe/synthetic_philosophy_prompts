answer: |-
  The gemologist's casual correction regarding your grandmother's bangle strikes at the heart of one of the most influential theories in twentieth-century philosophy of language. Saul Kripke and Hilary Putnam revolutionized our understanding of reference by arguing that natural-kind terms like "water" or "gold" are rigid designators. They do not refer via a descriptive cluster of superficial properties (color, liquidity, shine), but rather by pointing to a hidden microstructural essence (H2O, Au). On this view, the statement "water is H2O" is a necessary truth, discoverable only a posteriori. In any possible world where water exists, it must be H2O; a liquid that looks like water but has a different chemical composition (like Putnam's famous "XYZ" on Twin Earth) is simply not water.

  The case of jade, however, presents a formidable complication. As you noted, "jade" refers to two distinct minerals: jadeite (a pyroxene) and nephrite (an amphibole). They share no single chemical formula or crystal structure. If the Kripke–Putnam model holds that natural-kind terms rigidly designate a single underlying essence, jade appears to be a counterexample. It suggests that a term can function as a substance name without tracking a unitary microstructure. This essay will argue that jade does indeed constitute a genuine limit case for the Kripke–Putnam picture, but not one that destroys it. By engaging with Joseph LaPorte's proposal to reconcile the theory via "disjunctive kinds," I will defend the verdict that "this bangle is jade" does **not** express a necessary a posteriori truth. Instead, it expresses a contingent truth grounded in human interest, revealing that "jade" is not a strict natural-kind term in the Kripkean sense.

  To understand why jade is problematic, we must recall why the Kripke–Putnam model was attractive in the first place. Its power lies in explaining the normative force of scientific discovery. When chemists discovered water is H2O, they weren't just updating a definition; they were fixing the reference of the term "water" to a specific stuff in the world. This explains why we say someone in 1700 who pointed to XYZ would have been *mistaken* in calling it water, even if they couldn't have known better. The term reaches out to the world and grabs the essence.

  Jade resists this grab. When Western mineralogists distinguished jadeite from nephrite in the nineteenth century, they did not discover that one was "true jade" and the other "fake jade." Both retained the name. If "jade" were a rigid designator of a natural kind analogous to "gold," this should have been impossible. We would expect a revision similar to the reclassification of pyrite as "fool's gold." The fact that the term survived the discovery of heterogeneity suggests that "jade" was never latching onto a single metaphysical essence.

  Proponents of the Kripke–Putnam framework have attempted to repair the theory to accommodate cases like this. The most sophisticated defense comes from philosopher Joseph LaPorte. In *Natural Kinds and Conceptual Change*, LaPorte argues that we should abandon the assumption that natural kinds must be unified by a single microstructure. He proposes that "jade" rigidly designates a *disjunctive kind*. On this view, the essence of jade is not a single chemical formula, but the disjunctive property: *being jadeite OR being nephrite*. LaPorte argues that this disjunction is not merely a linguistic convenience but reflects a stable category in our scientific ontology. If we accept this, then "jade is jadeite or nephrite" becomes a necessary a posteriori truth. In any possible world where this bangle exists and is jade, it must be composed of one of those two minerals. The term remains rigid; the essence is just complex.

  While LaPorte's proposal saves the semantic machinery of rigid designation, it does so at the cost of the metaphysical insights that made the machinery valuable. The Kripke–Putnam model was compelling because it linked language to the causal structure of reality. Natural kinds are supposed to support induction and law-like generalizations. We can predict how gold will react to acid because all gold shares the atomic structure Au. We can predict how water will boil because of hydrogen bonding.

  What inductive power does the disjunctive kind *jadeite-or-nephrite* possess? Virtually none, other than the superficial properties (toughness, green color) that originally identified the stones. Jadeite and nephrite have different hardnesses, different specific gravities, and different chemical stabilities. To classify them under a single "natural kind" is to ignore the causal discontinuities that define natural kinds in the first place. If we allow disjunctive essences of this sort, the distinction between a "natural kind" and a "superficial classification" collapses. We could define a kind "brass-or-gold" and claim it is a rigidly designated natural kind with a disjunctive essence. This trivializes the notion of essence. The attractiveness of the Kripke–Putnam picture relies on the idea that nature carves the world at its joints; LaPorte's repair allows us to tape two different joints together and call it a single cut.

  Therefore, we should reject the view that "jade" functions as a rigid designator of a natural kind. A more faithful interpretation, consistent with Putnam's own later concessions, is that "jade" is a *functional* or *anthropocentric* kind term, not a strict natural-kind term. It refers to stones that satisfy certain cultural and aesthetic criteria (workability, color, toughness). The fact that these stones happen to be jadeite or nephrite is a contingent fact about the Earth's geology and human history, not a metaphysical necessity.

  This leads to the definite verdict regarding your bangle. The statement "this bangle is jade" is **not** a necessary a posteriori truth. It is a contingent truth. To see this, consider a possible world where the mineral deposits in Burma and China consisted of a different green silicate, say "mineral X," which possessed the same workability and aesthetic appeal as jadeite. In that world, would the inhabitants be wrong to call Mineral X "jade"? On the Kripkean model for water, if they called XYZ "water," they would be wrong. But for jade, it seems intuitively correct that they could use the term "jade" for Mineral X. The reference of "jade" is fixed not by a hidden essence that transcends human interest, but by the cluster of observable properties that humans value.

  Consequently, the identity "jade = jadeite or nephrite" is not necessary. It is a generalization that holds in the actual world, but it does not hold across all possible worlds. If we discovered a new mineral tomorrow that fit all the functional criteria of jade, we might expand the extension of "jade" to include it, without contradicting a metaphysical necessity. This contrasts sharply with gold; if we found a yellow metal that looked like gold but had atomic number 79, it *is* gold, but if it had atomic number 78, it *cannot* be gold, regardless of appearance.

  Admitting this does not refute Kripke and Putnam; rather, it clarifies the scope of their theory. Their account explains how language hooks onto the world when our terms successfully track mind-independent causal structures (elements, compounds, biological species). Jade demonstrates that not all substance terms succeed in this way. Some terms, like "jade," "rock," or "weed," track human interests and superficial similarities rather than deep essences. Recognizing this distinction preserves the explanatory power of the Kripke–Putnam model for terms like "water" while acknowledging that language is messy and not every noun is a rigid designator of a natural kind.

  Your grandmother's bangle, then, retains its value, but not because it participates in a metaphysical necessity. Its identity as "jade" is a testament to a specific cultural history that grouped two distinct minerals under one name based on how they worked and looked, long before science could distinguish them. The gemologist was right about the mineralogy, but the Kripke–Putnam model remains right about the semantics of true natural kinds. "Jade" is simply not one of them. Thus, "this bangle is jade" is a contingent truth, anchored in human practice rather than the fabric of reality. We should not force the theory to accommodate jade by diluting the concept of essence; instead, we should let jade teach us where the boundary of natural-kind talk lies.
