      *   *Section 2: The Ontological Block (Why he would reject it).* The Gibbs Lecture. The distinction between "knowing truth" and "computing rules." Leibniz's Monads. Uploading presupposes computationalism, which Gödel disproved (in his view).
      *   *Section 3: The Nature of the "Self".* Gödel's Platonism. The mind perceives abstract objects. A computer manipulates symbols. Uploading captures syntax, not semantics (to use Searle's later term, though Gödel anticipated the distinction).
      *   *Section 4: The Theological/Rationalist Dimension.* Gödel's afterlife is a *given* of a rational universe, not a *project*. Transhumanism is Promethean; Gödel is more contemplative/receptive.
