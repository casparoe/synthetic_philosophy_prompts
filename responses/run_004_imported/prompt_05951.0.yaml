answer: |-
  Your colleague is citing a profound result, but they are applying it in a way that contradicts the theorem's actual economic implications. I. J. Good's 1967 theorem on the **Value of Information (VoI)** is often summarized as "more data is better," but the rigorous statement is: **"More *free* data is better."**

  For a software engineering team, Good's theorem does not justify running experiments indefinitely. In fact, properly applied, it provides the mathematical framework for knowing exactly when to *stop* an experiment.

  Here is an analysis of the theorem's implications, the hidden assumptions in your colleague's argument, and the workplace realities that invalidate them.

  ---

  ### 1. The Core Implication: Value vs. Cost
  Good's theorem proves that for a rational agent, the **expected** utility of making a decision after observing new evidence is always greater than or equal to the expected utility of making the decision without that evidence.

  However, this inequality holds only if the evidence is **costless**.

  **Implication for Engineering:**
  You should not gather data until you are "sure." You should gather data until the **marginal cost of the next data point exceeds the expected marginal benefit of that data point.**

  *   **The Benefit:** The probability that the new data will change your decision (e.g., from "ship" to "kill") multiplied by the impact of making the correct choice.
  *   **The Cost:** Engineering time, compute resources, delayed revenue, and opportunity cost (what else could you have built?).

  If you are 95% confident a feature is good, the 96th percentile of confidence might require doubling the sample size. If the risk of being wrong in the 5% case is \$10k, but the delay costs \$50k in lost revenue, Good's theorem dictates you should **stop and decide now.**

  ### 2. The Quiet Assumptions
  Your colleague's argument ("never end early") relies on four idealizing assumptions inherent in the theoretical formulation of Good's theorem. In a software organization, these are rarely true.

  #### Assumption A: Information is Free ($Cost = 0$)
  *   **The Theory:** Good's proof assumes acquiring the observation does not subtract from your utility function.
  *   **The Reality:** A/B tests have high carrying costs.
      *   **Opportunity Cost:** While the test runs, you cannot iterate on the next feature.
      *   **Maintenance Cost:** Keeping experiment scaffolding alive requires code maintenance and cognitive load.
      *   **User Cost:** If variant B is worse than variant A, every user exposed to B during a prolonged test suffers a degraded experience.

  #### Assumption B: Stationarity (The World Doesn't Change)
  *   **The Theory:** The underlying probability distribution generating the data remains constant throughout the data collection period.
  *   **The Reality:** Software environments are non-stationary.
      *   **Seasonality:** User behavior on a Tuesday differs from a Saturday; Q4 differs from Q1.
      *   **Contamination:** Other teams deploy code that interacts with your experiment.
      *   **Learning Effects:** Users behave differently when a feature is "new" vs. "established."
      *   **Risk:** Running a test "until significance" might mean running through a holiday season, rendering the data useless for normal operations.

  #### Assumption C: The Decision Remains Available
  *   **The Theory:** You can wait indefinitely and then make the optimal choice.
  *   **The Reality:** Business windows close.
      *   If you delay a launch to gather more data, a competitor might ship first.
      *   Strategic priorities may shift (e.g., the VP pivots from "growth" to "profitability"), making the experiment's question irrelevant before it concludes.

  #### Assumption D: Rational Updating (No "Peeking")
  *   **The Theory:** The agent commits to a strategy of updating beliefs based on evidence.
  *   **The Reality:** Human teams "peek."
      *   If you tell engineers "never stop early," they will still look at the dashboard. If they see a catastrophic drop in performance, they will stop. If they see a huge win, they will want to ship.
      *   This "optional stopping" invalidates frequentist p-values and complicates Bayesian posteriors if not modeled correctly. A policy of "never stop" often encourages *more* informal peeking, not less.

  ### 3. When the Assumptions Fail (Workplace Conditions)
  Here are specific scenarios where your colleague's policy will actively harm the team, violating the spirit of Good's theorem.

  | Condition | Why "Never Stop Early" Fails | VoI Perspective |
  | :--- | :--- | :--- |
  | **High-Variance Metrics** | To move a noisy metric (e.g., revenue per user) from 90% to 95% confidence might take months. | The cost of delay outweighs the risk of a false positive. |
  | **Clear Winners/Losers** | If early data shows a 20% drop in retention with high confidence, continuing the test harms users. | The value of information is negative because the cost of exposure > value of certainty. |
  | **Interdependent Deploys** | Your test relies on a legacy service another team is deprecating next month. | The data will become stale/invalid before the test concludes naturally. |
  | **Strategic Pivots** | Leadership decides to focus on Enterprise instead of SMB mid-test. | The decision the test informs no longer exists; the information value is zero. |

  ### 4. How to Push Back (Constructively)
  You can agree with the *principle* (data is valuable) while rejecting the *policy* (never stop early). Here is a framework you can propose to your team:

  **1. Define the Decision, Not Just the Metric**
  Before starting the test, agree on the actions:
  *   "If lift > 1%, we Ship."
  *   "If lift < 0%, we Kill."
  *   "If lift is between 0% and 1%, we Iterate."
  If the data already places you firmly in "Ship" or "Kill" territory with acceptable risk, the Value of Information for further data is **zero** because it won't change the action.

  **2. Explicitly Price the Cost of Delay**
  Estimate the weekly cost of running the experiment (engineering time + opportunity cost). Compare this to the risk of making the wrong decision.
  *   *Example:* "Running this test another week costs \$20k in delayed revenue. The maximum loss from shipping a slightly sub-optimal version is \$5k. We should stop."

  **3. Use Sequential Testing or Bayesian Stopping Rules**
  Instead of "fixed sample size" or "never stop," use methods designed for early stopping.
  *   **Bayesian:** Stop when the posterior probability of the better variant exceeds a threshold (e.g., 95%) *and* the expected loss of being wrong is acceptable.
  *   **Sequential Frequentist:** Use methods like SPRT (Sequential Probability Ratio Test) which mathematically account for peeking and allow early stopping while controlling error rates.

  **4. Acknowledge Diminishing Returns**
  Remind the team that uncertainty decreases with the *square root* of sample size. To halve your uncertainty, you need **4x** the data. At a certain point, you are paying a linear cost for logarithmic gains in precision.

  ### Summary
  Your colleague is correct that information has value, but incorrect that it has *infinite* value. Good's theorem actually supports **stopping early** whenever the cost of acquiring the next data point exceeds the expected reduction in decision risk.

  By invoking Good's theorem to argue for indefinite testing, they are treating engineering time and market opportunity as free resources. In a rational Bayesian framework—which Good's theorem presupposes—those costs must be part of the utility function. When you include them, the optimal strategy is almost never "never stop."
