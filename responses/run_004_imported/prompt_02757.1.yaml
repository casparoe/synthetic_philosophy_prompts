answer: |-
  The hotel bar is mostly empty, save for a few stragglers from the Society for the Study of Probability and Metaphysics. The ice in Elias's glass has melted. Mara is still on her first scotch, turning the tumbler slowly on the coaster. They were on opposing panels that afternoon.

  **Elias:** You looked satisfied up there. When you dismissed the Doomsday Argument as a "bayesian mirage."

  **Mara:** I stand by it. It's a trick of the light. You shine the beam of the Self-Sampling Assumption one way, you get extinction. You shine it another, you get business as usual. That's not physics, Elias. That's optics.

  **Elias:** It's not optics if the math holds. Look, I know SIA feels comforting. It tells you that your existence is evidence *for* a larger population. If there are a trillion trillion humans, it's more likely *you* would exist than if there are only a hundred billion. So you update against Doomsday. It washes out the SSA update. It's elegant. I'll give you that.

  **Mara:** It's not just elegant. It's correct. You have to condition on your own existence. SSA treats your existence as a given and asks where you fall in the line. SIA asks how likely the line is to exist at all. You can't ignore the second question.

  **Elias:** I can't ignore it, but I can't accept the price tag either. You know what Bostrom called it. The Presumptuous Philosopher.

  **Mara:** *(Sighs)* Here we go.

  **Elias:** No, listen. Imagine two theories of the universe. T1 says there are a trillion observers. T2 says there are a trillion trillion. They are empirically identical. Same physics, same stars, same CMB. The only difference is the size of the population. Under SIA, you should be virtually certain T2 is true before you look through a telescope. Just because you exist.

  **Mara:** And under SSA, you should be indifferent?

  **Elias:** Under SSA, I'm indifferent. The evidence doesn't favor one over the other until I get data. Under SIA, you're awarding near-certainty to the inflationary model just by sitting in a bar and thinking about your own birth. That's not reasoning, Mara. That's magic. It allows philosophers to settle cosmological disputes from an armchair.

  **Mara:** It's not magic. It's accounting. If T2 is true, there are a thousand times more slots for "Mara" to occupy. If I find myself occupying a slot, isn't it more probable I'm in the world with more slots?

  **Elias:** But why should the universe care about the count? Why does the mere possibility of more observers boost the credence of the theory? It feels like a prior that swamps all future evidence. If T2 implies a billion times more observers, do you really believe you can be a billion-to-one favorite on T2 before we launch a single probe?

  **Mara:** Yes. Because the alternative is worse. The alternative is your Doomsday Argument. You want me to believe that because I was born in the 21st century, rather than the 21st millennium, I should suspect the human race ends soon. That's the bullet you're biting, Elias. You're telling me that my birth rank is a countdown clock.

  **Elias:** I'm telling you it's a sample. If you put a ticket in a urn, and you pull out number 7, you should suspect the urn doesn't contain a million tickets. It probably contains ten. That's standard statistics. Why does it become paradoxical when the urn is humanity?

  **Mara:** Because the urn isn't fixed. In the standard urn problem, the urn exists before you draw. In the Doomsday Argument, the "urn"—the total number of humans—is being created *by* the drawing. You're treating future humans as if they're already in the bag, waiting to be sampled. But they don't exist yet.

  **Elias:** They exist in the probability space. We're talking about credences, not causality. I'm not saying my birth *causes* extinction. I'm saying my birth rank is *evidence* for extinction. Just like finding a rare isotope is evidence for a specific decay rate.

  **Mara:** But only if you define the reference class correctly. And that's where SSA falls apart. Who is in your reference class? *Homo sapiens*? What about Neanderthals? If you include them, my birth rank shifts. What about uploaded minds? If we upload in 2050, do they count? If I define the class as "conscious beings capable of understanding the Doomsday Argument," the rank changes again.

  **Elias:** So you say the reference class is arbitrary, therefore the conclusion is void.

  **Mara:** I'm saying the result is sensitive to a choice that has no physical basis. You can tune the Doomsday Argument to say whatever you want by tuning the reference class. That's not a discovery about the world. That's a discovery about your definitions.

  **Elias:** It's not that arbitrary. It's about subjective indistinguishability. I should reason as if I'm a random sample from all observers who have experiences subjectively indistinguishable from mine.

  **Mara:** "Subjectively indistinguishable." That's a hell of a hedge. And even if you tighten that, you run into the Observer-Moment move. I know Bostrom went there. Instead of sampling observers, you sample *observer-moments*.

  **Elias:** Exactly. It refines the class. It handles the issue of observers living different lengths of time. If I am a random observer-moment, I should expect to be in the middle of the history of consciousness, not the beginning. Since we seem to be near the beginning, the total history must be short.

  **Mara:** But does that solve the Presumptuous Philosopher? If you switch to observer-moments, does SIA stop implying that the universe is infinitely large?

  **Elias:** *(Pauses, takes a sip of warm gin)* It mitigates it. But SIA still implies that if there's a theory where every observer-moment is duplicated a million times, that theory is a million times more likely.

  **Mara:** Because it *is* more likely that I am one of a million than one of one.

  **Elias:** But Mara, consider the implications. If we accept SIA, we have to reject the idea that empirical evidence is the primary driver of cosmological belief. We could have two theories that fit the data equally well, but if one implies a googol more observers, SIA says we must reject the first one. That undermines the scientific method. It makes ontology dependent on population counts.

  **Mara:** And if we accept SSA, we have to reject the idea that our existence isn't a cosmic coincidence. SSA says it's incredibly unlikely that we exist in a universe with vast numbers of observers, simply because we would be so rare. SIA says: no, in a vast universe, most observers are in vast universes. It's not a coincidence; it's a selection effect.

  **Elias:** It's a selection effect that buys you safety at the cost of sanity. You're willing to believe the universe is teeming with life, not because we see telescopes or signals, but because if it weren't, *you* wouldn't be here to ask.

  **Mara:** I'm willing to believe it because the alternative requires me to believe I'm special. The Doomsday Argument relies on the idea that I am a random sample. But if the future is huge, I am *not* a random sample of all humans. I'm an early one. SSA forces me to assume I'm typical. SIA allows me to acknowledge I might be atypical in rank, but typical in existence.

  **Elias:** Typicality is the only tool we have. If you assume you're atypical without evidence, you can explain anything. "Why am I not seeing aliens?" "Because I'm atypical." "Why does the universe look fine-tuned?" "Because I'm atypical." SSA constrains that. It forces you to admit that if you look typical, you probably are. And right now, looking at the exponential growth of population, being among the first 5% of all humans looks... suspicious.

  **Mara:** It looks suspicious only if you assume the distribution of humans is uniform across time. But it's not. It's a spike. We're on the sharp edge of the spike. Of course early observers are rare in a long timeline. But they aren't impossible. SSA treats "rare" as "improbable enough to update against." SIA treats "rare" as "weighted by the total number of opportunities."

  **Elias:** And that weighting is what lets the Presumptuous Philosopher walk through the wall. Look, let's try to find the crux. Is it that you think existence is evidence?

  **Mara:** I think *my* existence is evidence for hypotheses that make *my* existence more probable.

  **Elias:** But hypotheses don't make your existence more probable just by having more people. They make it more probable by making *you* specifically.

  **Mara:** I'm not a specific individual in the metaphysical sense. I'm an indexical location. "Here now." SIA says "Here now" is more likely to be found in a bigger crowd.

  **Elias:** But why? Why does the crowd size matter if the physics is the same?

  **Mara:** Because you're trying to locate yourself in logical space. If T2 has a thousand copies of this room, and T1 has one, and you're in this room, where are you more likely to be?

  **Elias:** In T2. I grant that. But that's not the Presumptuous Philosopher case. In the PP case, the observers aren't duplicates. They're just *more* of them. Distant galaxies. Future generations.

  **Mara:** Same logic. If there are more of them, there are more slots for "me."

  **Elias:** But "me" isn't a slot. "Me" is a specific causal history.

  **Mara:** Is it? Or is "me" a pattern of information? If the pattern exists in T2 a thousand times more often, then finding the pattern is evidence for T2.

  **Elias:** *(Leans forward)* This is where we diverge. I think you're conflating the probability of *an* observer existing with the probability of *you* existing. SSA says: Given that an observer exists, where am I? SIA says: Given that I exist, which world is it?

  **Mara:** And you can't answer the first without the second. You can't say "Given that an observer exists" without asking how likely it is that one exists in the first place.

  **Elias:** But if you answer the second the way you do, you swallow the universe whole. You end up believing in the Multiverse not because of quantum mechanics, but because of arithmetic.

  **Mara:** Maybe the arithmetic *is* the metaphysics. Look, Elias. If I have to choose between a principle that tells me humanity is likely to go extinct soon because I was born too early, and a principle that tells me I should bet on larger universes because I exist... I'll take the presumptuous philosopher. At least he's optimistic.

  **Elias:** And I'll take the Doomsayer. At least he's humble. He admits that we might not be the main event. We might be the prologue. SIA assumes we're the main event, or at least that the show goes on long enough to justify our tickets.

  **Mara:** It doesn't assume that. It just refuses to penalize long futures for having more people.

  **Elias:** It rewards them. There's a difference.

  *(A silence settles between them. The bartender begins wiping down the far end of the counter, signaling last call.)*

  **Mara:** So we're stuck.

  **Elias:** We're stuck. You think my reference class is arbitrary. I think your prior is inflationary.

  **Mara:** You think I'm ignoring the evidence of my birth rank. I think you're ignoring the evidence of my existence.

  **Elias:** And neither of us can prove the other wrong without assuming the very principle we're arguing about.

  **Mara:** *(Finishes her scotch)* It's a closed loop.

  **Elias:** It's a mirror. You look into it, and you see the assumption you brought with you.

  **Mara:** So what do we tell the readers? That it comes down to temperament?

  **Elias:** That it comes down to which risk you're more afraid of. The risk of being wrong about the future of humanity? Or the risk of being wrong about the nature of evidence?

  **Mara:** I'm afraid of the Doomsday Argument. It feels like a spell.

  **Elias:** And I'm afraid of the Presumptuous Philosopher. He feels like a god.

  *(They sit for a moment longer, watching the ice settle in their glasses, neither willing to concede that the other's fear is the lesser one.)*
