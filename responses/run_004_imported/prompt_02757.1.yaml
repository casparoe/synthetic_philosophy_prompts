      *   *Develop the PP argument:* Elias needs to make Mara feel the weight of accepting a theory just because it has more people.
      *   *Develop the Reference Class argument:* Mara needs to make Elias feel the arbitrariness of defining "human."
      *   *The Observer-Moment pivot:* Elias tries to tighten the definition. Mara asks if it solves PP. (It doesn't really).
      *   *The End:* They agree they disagree on the *nature* of indexical evidence.

  6.  **Polishing:**
