answer: |-
  Here is a draft of 10 questions designed for your seminar group. They are ordered strategically: the early questions establish the stakes, the middle questions introduce technical and philosophical tensions (including your required topics), and the final questions tighten the noose around the "wrong basis" defense to force a commitment on falsifiability.

  I have included a brief **"Strategic Rationale"** for each pair so you understand *why* the follow-up is phrased that way and how it blocks her standard escape route.

  ### 1. The Decodability Trap
  **Question:** "You argue that when we identify a direction in activation space that correlates with a semantic concept, we are identifying a real representational state. But recent work on the 'interpretability illusion' suggests that what we decode depends heavily on the probe dataset and the specific probing method used. If the 'feature' we find shifts depending on how we look for it, in what sense is the feature *in the model* rather than *in the interaction* between the model and the probe?"

  **Follow-up:** "If you say the feature is still real but we just need a better probe, doesn't that make 'realness' equivalent to 'stable decodability under ideal conditions'? And if so, isn't that just a pragmatic criterion for usefulness, rather than an ontological claim about the model's mind?"
  *   **Strategic Rationale:** This tackles your **Decodability** requirement. It forces her to distinguish between a feature being *mind-independent* versus just being *robustly detectable*. If she says "we need better probes," she admits realism depends on our tools, weakening the "realist" claim.

  ### 2. The Superposition Problem
  **Question:** "In high-dimensional networks, we know features exist in superposition—there are more concepts than neurons, so representations overlap in non-orthogonal directions. If the 'true' features are distributed across overlapping subspaces, what determines the *unique* basis that reveals the real representations? Is there a fact of the matter about which decomposition is the 'correct' one, or is the choice of basis always relative to the engineer's goal?"

  **Follow-up:** "If you claim there is a fact of the matter, what mathematical property picks out the 'true' basis over the infinite other possible bases? If you claim it's relative to the goal, aren't you effectively conceding that representational realism collapses into instrumentalism?"
  *   **Strategic Rationale:** This tackles your **Superposition** requirement. This is the first major block against the "wrong basis" move. She can't just say "we haven't found the basis" because mathematically, there are *infinite* bases. She must explain what makes one "true" besides human utility.

  ### 3. Multiple Realizability
  **Question:** "Consider two model runs trained on the same task that converge on different weights and use genuinely distinct circuits to solve the problem. On your view, do these models instantiate the 'same' representational states, or different ones? If they are the same, what abstracts away from the specific circuit? If they are different, does the behavior alone fail to determine the representation?"

  **Follow-up:** "If the representation is tied to the specific circuit, then representational content isn't multiple-realizable in the way functionalists claim. Are you prepared to say that a slightly different weight initialization results in a model with a fundamentally different 'mind,' even if its behavior is identical?"
  *   **Strategic Rationale:** This tackles your **Multiple Realizability** requirement. It challenges the link between function and representation. If she says "different circuits = different minds," she makes realism trivial. If she says "same mind," she needs a basis for identity that isn't just behavioral (which she wants to avoid).

  ### 4. The Dennett Comparison
  **Question:** "Our TA noted that your position sounds like Daniel Dennett's 'Real Patterns,' but Dennett's view is deflationary: a pattern is real if it yields predictive purchase. Your view seems to want something thicker—that the features exist even if we can't predict with them yet. Are you defending a Dennettian realism where 'real' means 'useful,' or a robust realism where 'real' means 'causally existent independent of observers'?"

  **Follow-up:** "If it's the latter (robust realism), how do you avoid the charge that you are attributing mental ontology to matrix multiplication without a mechanism for intentionality? If it's the former (Dennettian), why object to the claim that features are just 'stories we tell' if those stories are the ones that yield predictive purchase?"
  *   **Strategic Rationale:** This tackles your **Dennett** requirement. It forces her to pick a lane. If she picks Dennett, her "realism" is weak (just useful stories). If she picks Robust Realism, she has a much higher burden of proof regarding intentionality.

  ### 5. Causal Efficacy vs. Correlation
  **Question:** "A common standard for psychological realism is causal efficacy—if a belief is real, changing it should change behavior. In interpretability, we often find features that correlate with concepts but don't causally drive the output when ablated. Do you require a real representational state to be causally efficacious, or is correlation sufficient for ontological status?"

  **Follow-up:** "If correlation is sufficient, then a 'feature' could be a real representational state even if it does no work in the network. Doesn't that detach the 'representation' from the 'mechanism,' rendering the mechanistic part of mechanistic interpretability irrelevant?"
  *   **Strategic Rationale:** This starts tightening the "wrong basis" net. If she says "causality matters," many current interpretability claims fail. If she says "correlation is enough," the "realness" of the feature becomes metaphysically spooky (epiphenomenal).

  ### 6. Constraining the "Right Basis"
  **Question:** "You've previously responded to objections by suggesting that apparent counterexamples arise because we haven't found the 'right basis' yet. What constraints exist on what counts as an admissible basis? Are we looking for a basis that is sparse, human-interpretable, or computationally efficient?"

  **Follow-up:** "If the 'right basis' must be human-interpretable, then the realism is dependent on human cognitive limits. If it need not be interpretable, how could we ever verify you are right? It seems the 'right basis' move risks making your theory compatible with any possible empirical finding."
  *   **Strategic Rationale:** This directly addresses the **annoying move** you mentioned. It forces her to define the criteria for the "right basis." If the criteria involve humans, it's not mind-independent realism. If not, it's unverifiable.

  ### 7. The Granularity Problem
  **Question:** "Where does a representational state begin and end? Is the 'real' representation the individual neuron, the linear subspace, the entire circuit, or the whole network? If I can find a 'Golden Gate Bridge' feature in a single direction, but also in a complex circuit of 50 neurons, which one is the ontologically fundamental representation?"

  **Follow-up:** "If you say both are real, you have an overdetermination problem. If you say only one is, what principle selects the correct grain size? Doesn't appealing to 'the right grain size' just reintroduce the 'right basis' problem at a different scale?"
  *   **Strategic Rationale:** This prevents her from shifting the goalposts from "directions" to "circuits." It shows that the "wrong basis" defense applies to scale/granularity too, making the defense look repetitive.

  ### 8. The Biological Analogy
  **Question:** "If we apply your representational realism to the human brain, we face the same problem: we can't find a stable 'basis' for concepts like 'justice' in neural firing patterns. Would you say that if we fail to find a stable basis in the brain, human mental states aren't real? Or is the standard for NNs different?"

  **Follow-up:** "If the standard is different, why? If the standard is the same, and we never find the basis in the brain, does your realism imply skepticism about human minds? And if you accept human minds are real *without* a found basis, why insist on finding the basis for NNs to grant them realism?"
  *   **Strategic Rationale:** This creates a dilemma. If NNs need a basis to have real representations but humans don't, she needs a relevant difference. If both need one, she risks skepticism about human minds. This makes the "we haven't found the basis" move look dangerous.

  ### 9. The "Early Days" Excuse
  **Question:** "Many critics argue that current interpretability findings are preliminary. You often respond that the field is young and we should expect better results later. But scientifically, when does 'the field is young' stop being a valid defense? What specific milestone or failure condition would mark the transition from 'early days' to 'evidence of absence'?"

  **Follow-up:** "If the answer is 'when we have better tools,' isn't that moving the goalpost? Can you name a specific empirical result—say, a specific type of network architecture or training regime where features *fail* to emerge—that would convince you representational realism is false?"
  *   **Strategic Rationale:** This tackles your **Falsifiability** requirement. It explicitly calls out the "promissory note" aspect. It asks for a concrete condition for failure, not just success.

  ### 10. The Final Ultimatum (Evidence Against)
  **Question:** "To close: Representational realism claims there is a fact of the matter about what a model represents. If we reach a point where compute scales indefinitely, interpretability tools mature, and we *still* find that features are highly context-dependent, non-linear, and lack a stable basis, would you finally abandon the realist view?"

  **Follow-up:** "If your answer is 'no, there must still be a basis we missed,' then it seems your view is unfalsifiable by design. If your view cannot be proven wrong by any possible configuration of weights and activations, in what sense is it a scientific or philosophical claim rather than an article of faith?"
  *   **Strategic Rationale:** This is the **Kill Shot**. It combines the "wrong basis" move with the falsifiability requirement. It forces her to either admit her view is unfalsifiable (philosophically weak) or commit to a scenario where she would change her mind (which validates your section's skepticism).

  ### Tips for Delivery:
  *   **Tone:** Keep it collaborative. "I'm trying to understand the boundaries of your view..." works better than "You're wrong because..."
  *   **Pacing:** If she dodges the "basis" point in Q2 or Q6, gently remind her in Q10: "You mentioned earlier that we might just need the right basis, but..."
  *   **The Roommate Factor:** Even though your roommate thinks it's a waste of time, these questions actually validate the CS skepticism by asking for mathematical rigor (superposition, basis constraints) while keeping the philosophical stakes high.
