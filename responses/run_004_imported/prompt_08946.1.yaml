prompt: |-
  This term's seminar on Bertrand Russell's ethics has me working closely through Marriage and Morals, and my cousin, who is getting married next month, has asked me to give the toast as "the one who reads Russell." Half the guests will be my philosophy friends and the other half will never have heard of him, and I'd like to draw on what he actually argues there -- that jealousy is more a matter of custom than of nature, his qualified sympathy for companionate marriage, and his distinction between the passionate part of a marriage and the deeper, life-entwining part -- rather than reach for a decorative quotation. The complication is that Russell also thought strict fidelity wasn't essential to a good marriage, that this book helped cost him a professorship at the City College of New York in 1940, and that his own four marriages hardly modeled the stability he described, so the toast shouldn't come across as a wink toward infidelity or as a lecture at someone else's wedding. Could you write a three-minute toast that draws honestly on Russell's actual view of what makes a marriage worth having, works for both audiences, and stays on the right side of that line?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Topic:** Wedding toast based on Bertrand Russell's *Marriage and Morals*.
      *   **Audience:** 50% philosophy friends (know Russell), 50% general guests (don't know Russell).
      *   **Key Russellian Concepts to Include:**
          *   Jealousy is more custom than nature.
          *   Qualified sympathy for companionate marriage.
          *   Distinction between the passionate part and the deeper, life-entwining part.
      *   **Constraints/Pitfalls to Avoid:**
          *   Don't make it sound like a wink toward infidelity (Russell's controversial view on strict fidelity).
          *   Don't make it a lecture (it's a wedding, not a seminar).
          *   Acknowledge Russell's own messy marital history without undermining the couple.
          *   Tone: Honest, celebratory, thoughtful, not cynical.
      *   **Length:** Approximately 3 minutes (roughly 400-500 words spoken at a moderate pace).

  2.  **Deconstruct Russell's *Marriage and Morals* for a Wedding Context:**
      *   *Jealousy:* Russell argues it's socially constructed. *Toast Application:* Focus on trust and overcoming insecurity through partnership, not ownership.
      *   *Companionate Marriage:* He valued friendship and shared life over just romance. *Toast Application:* Emphasize the couple as friends and teammates.
      *   *Passion vs. Deep Entwinement:* He distinguished between initial spark and long-term growth. *Toast Application:* Acknowledge the love they feel now, but celebrate the life they will build.
      *   *Fidelity/Scandal:* This is the tricky part. Russell lost his job over this. *Toast Application:* Acknowledge his complexity/humanity briefly, but pivot to the *ideal* he sought (honesty, growth) rather than the specific controversial mechanics. Focus on the *spirit* of his ethics (freedom within commitment) rather than the letter (open marriage implications).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role ("the one who reads Russell") and the occasion. Set a warm tone.
      *   **The Russell Hook:** Briefly mention *Marriage and Morals*. Acknowledge his reputation (the scandal) but pivot to what he actually valued.
      *   **Core Concept 1 (Jealousy/Custom):** Frame this positively. It's not about possession; it's about choosing each other freely.
      *   **Core Concept 2 (Passion vs. Deep Entwinement):** This is the heart of the toast. Romance is the spark, but the "life-entwining" is the fire.
      *   **Core Concept 3 (Companionate/Friendship):** Marriage as a partnership.
      *   **Addressing the Elephant in the Room:** Briefly nod to Russell's own messy life without making it about the couple. Use it to highlight that the *theory* is hard, but the *attempt* is noble.
      *   **Closing:** Raise a glass. Wish them well.

  4.  **Refining the Tone (Iterative Process):**
      *   *Drafting thought:* Should I mention the City College of New York firing?
      *   *Correction:* No, too specific and academic for the general half. Just hint at his "controversial reputation."
      *   *Drafting thought:* How to handle the fidelity issue?
      *   *Correction:* Don't mention "fidelity" explicitly. Focus on "honesty" and "freedom within union." Russell believed fear kills love. So, wish them a love without fear.
      *   *Drafting thought:* Is it too philosophical?
      *   *Correction:* Need to ground it in *this* couple. Use "you two" frequently.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   Start: Thanks for having me. Yes, I read Russell.
      *   Middle: He wrote *Marriage and Morals*. People think it's about breaking rules. Actually, it's about making the bond real. He said jealousy is habit, not nature. So choose each other every day. He said passion fades, but deep entwinement grows. That's what we celebrate.
      *   End: Russell wasn't perfect at this. But the goal is. Cheers.

  6.  **Polishing and Timing:**
      *   Word count check: A 3-minute speech is usually around 450 words.
      *   Rhythm: Needs pauses for laughter and applause.
      *   Safety Check: Ensure nothing sounds like "open marriage is great." Focus on "trust is better than possession."

  7.  **Final Review against Constraints:**
      *   *Jealousy/Custom?* Included (framed as choice over possession).
      *   *Companionate?* Included (friendship/partnership).
      *   *Passion vs. Deep?* Included (spark vs. growth).
      *   *No Infidelity Wink?* Careful wording to emphasize commitment and honesty.
      *   *No Lecture?* Kept personal and celebratory.
      *   *Russell's History?* Acknowledged gently.

  8.  **Final Polish:** (Writing the actual response based on these thoughts.) *Self-Correction during writing:* Make sure the transition from Russell's scandals to the couple's future is smooth. Don't let the scandal overshadow the blessing. Focus on the *courage* required for Russell's kind of marriage.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Name], and I've been designated tonight as "the one who reads Russell." When [Couple's Names] asked me to speak, I knew I had a specific challenge. I spend my days studying Bertrand Russell's *Marriage and Morals*, a book that is famous for getting its author fired from a university and scandalizing a generation.

  Naturally, half of you are wondering if I'm going to give a lecture on ethical non-monogamy, and the other half are wondering if I'm going to explain what "ethics" means. I promise I will do neither. Because when you actually read Russell closely, you find he wasn't arguing for loose commitments. He was arguing for *honest* ones.

  Russell believed that much of what we call jealousy is not nature, but custom. It's the fear of ownership losing its property. But he argued that a true marriage isn't about possession; it's about two free people choosing, every day, to walk the same path. He wrote that the best relationships move from the "passionate part"—the spark that brings us here tonight—to the "deeper, life-entwining part." The spark is a gift, but the entwinement is a craft.

  He called this "companionate marriage." It means being lovers, yes, but also being teammates. It means building a life where the friendship is sturdy enough to hold the weight of the romance when it fluctuates, which it inevitably will.

  Now, I have to be honest. Russell's own four marriages were… complicated. He was a better philosopher of love than he was a practitioner. He knew that living up to these ideals requires immense courage and radical honesty. It is much easier to marry out of habit or fear than out of genuine, free-hearted choice.

  But looking at [Partner 1] and [Partner 2], I don't see habit. I see choice. I see a partnership that respects the passion you have now, but is built for the entwinement that comes later. You aren't trying to own each other; you are trying to know each other.

  So, my wish for you is not that you follow Russell's rules, but that you embrace his hope: that your marriage be a place where neither of you is diminished, where jealousy is outshone by trust, and where the life you entwine is richer than the lives you could have lived apart.

  To [Partner 1] and [Partner 2].
