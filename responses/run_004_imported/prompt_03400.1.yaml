answer: |-
  Short answer: **No, that distinction does not let him off the hook.**

  While there is a technical difference between a meeting start time and a project deadline, his specific argument—that he is entitled to waste the team's time while they are not entitled to waste his—reveals a double standard that undermines his leadership.

  Here is the breakdown of why his logic is flawed, where there is a tiny grain of truth, and why this is actually a bigger cultural problem than just "being late."

  ### 1. The Grain of Truth (The Technical Distinction)
  To play devil's advocate for a second, your manager is technically correct that **deliverables and meeting start times carry different weights.**
  *   **Deliverables:** Often block downstream work. If your teammate was late, did it stop QA from testing? Did it delay a client presentation? Did it risk a contract penalty? Hard deadlines often have tangible financial or operational consequences.
  *   **Meetings:** Usually internal. If he is 15 minutes late, the meeting still happens. It's annoying and inefficient, but it rarely stops the business from functioning.

  If he had said, *"I lectured her because her delay blocked the engineering team for a day,"* he would have a valid point about impact.

  ### 2. The Fatal Flaw (The "Respect" Argument)
  The problem is that he didn't frame the lecture around **impact**; he framed it around **respect**.
  *   He explicitly told her she wasn't "respecting the team's time."
  *   By being 10–15 minutes late to *every single meeting*, he is cumulatively wasting far more of the team's time than her 20-minute delay did.
  *   If 5 people sit in a meeting waiting 15 minutes for him, that is **75 minutes of lost productivity** per meeting. Do that weekly, and he is stealing hours of company time every month.

  When you invoke "respect" as the metric, you open yourself up to a reciprocity check. You cannot demand respect for your time while demonstrating a lack of respect for theirs. That is the definition of hypocrisy.

  ### 3. The Leadership Failure
  This isn't really about time management; it's about **psychological safety and standards.**
  *   **Modeling Behavior:** Leaders set the cultural norm. If the leader treats schedules as suggestions, the team will eventually treat deadlines as suggestions. He is actively eroding the culture of punctuality he claims to want.
  *   **Power Dynamics:** He is rationalizing because he can. He holds the power to lecture her without consequence. If she lectured him on his lateness, she could be labeled "insubordinate" or "difficult." He knows this, which makes the rationalization even more cynical.
  *   **The "First Time" Factor:** You mentioned this was the first time this teammate has ever been late. Punishing a high-performer's first minor infraction while you commit a major infraction weekly signals that the rules are arbitrary and based on his mood, not objective standards.

  ### 4. Is he rationalizing?
  **Yes.**
  He is engaging in **moral licensing**. Because he is the "boss" and responsible for "big picture" things, he has convinced himself that his time is more valuable than the team's aggregate time. He is minimizing his own behavior ("It's just a meeting start") while maximizing hers ("It's a missed deadline").

  ### What can you do?
  You probably can't fix him, but you can protect your team's sanity:
  *   **The "Soft Start":** Does the team actually wait for him? A common tactic for chronic late managers is to start the meeting on time without them. Review notes, chat, or start the agenda. When he arrives, you're already 5 minutes in. It signals that the schedule matters even if he doesn't.
  *   **Documenting Impact:** If his lateness causes *you* to miss deadlines, document it. "I couldn't get approval on X because we missed our sync." Keep it factual, not emotional.
  *   **Pick Your Battles:** Your teammate already pushed back and got shut down. Don't make this the hill you die on unless it starts affecting your performance reviews.
  *   **Read the Room:** This is a data point about his self-awareness. A manager who cannot admit when they are being hypocritical is usually a manager who will not take accountability for bigger mistakes. Keep that in mind for your long-term career planning there.

  **Verdict:** He is holding the team to a standard he does not meet himself. While deadlines are objectively more critical than meeting start times, the principle of "respecting time" applies to everyone, especially the person running the clock.
