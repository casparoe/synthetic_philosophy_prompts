answer: |-
  This is a sharp critique to attempt. Hilary Greaves' distinction between **Simple Cluelessness** (where unforeseeable effects are symmetrically distributed around zero) and **Complex Cluelessness** (where there is a vague, unquantifiable reason to think effects skew one way) is widely regarded as one of the most sophisticated defenses of expected utility maximization in consequentialism.

  However, you can argue that this distinction is epistemically unstable. The core of the argument is that **classifying a situation as "Simple Cluelessness" requires the very knowledge that the cluelessness objection claims we lack.**

  Here is an argument for why Greaves' distinction collapses, rendering expected-value reasoning hopeless even in her "simple" cases.

  ### 1. The Symmetry Assumption is Substantive, Not Default
  Greaves treats Simple Cluelessness as the "null hypothesis." She suggests that unless we have a specific reason to think long-term effects skew positive or negative (Complex), we should assume they cancel out (Simple).

  **The Counter-Argument:** Symmetry is not a default state of the universe; it is a specific, substantive empirical claim about causal topology.
  To assert that the unforeseeable ripple effects of saving a drowning child are symmetrically distributed around zero, you are claiming that the causal network of the world is balanced in a specific way. You are asserting that for every potential "tyrant" outcome, there is a probabilistically equivalent "saint" outcome.

  But why should we believe the causal structure of the world is symmetric?
  *   **Entropy and Decay:** In physics and biology, systems tend toward entropy or specific attractors, not random walks. If the long-term future of humanity has a high probability of extinction (a negative value floor), then *any* action that prolongs humanity might have a systematically positive expected value, or vice versa.
  *   **Path Dependence:** Historical outcomes are rarely normally distributed. They are often path-dependent. A small action can lock in a trajectory (e.g., a technological standard, a political border). These "lock-ins" create skew.

  By assuming symmetry, Greaves isn't avoiding complex empirical modeling; she is silently *doing* complex empirical modeling and assuming a specific result (a normal distribution with mean 0) without evidence. If we are truly "clueless" about the long-term future, we are also clueless about the *distribution* of that future, not just the specific outcomes.

  ### 2. The Problem of Fat Tails (Non-Linearity)
  Greaves' model of Simple Cluelessness relies on something akin to the Law of Large Numbers: enough random variables will cancel out. This works for additive noise. It does not work for multiplicative chaos.

  **The Counter-Argument:** Long-term consequences are likely "fat-tailed."
  In complex systems (like economies, ecosystems, or geopolitics), effects are non-linear. A "butterfly effect" isn't just a small random noise term; it is a trigger for a cascade.
  *   In a fat-tailed distribution (like a power law), the mean is often undefined or dominated by extreme outliers.
  *   If there is a 0.0001% chance that saving the child leads to human extinction, and a 0.0001% chance it leads to utopia, these do not necessarily "cancel out" if the disvalue of extinction is lexically greater than the value of utopia (or vice versa).

  To classify a case as "Simple," Greaves must assume the distribution of outcomes is thin-tailed (normal). But asserting that the long-term future is thin-tailed is a massive empirical claim that is subject to the same skepticism as Complex Cluelessness. If we can't quantify the skew (Complex), we certainly can't quantify the kurtosis (tail risk). Therefore, the "Simple" case inherits the intractability of the "Complex" case.

  ### 3. Meta-Cluelessness: You Can't Know It's Simple
  This is the strongest epistemic objection. To categorize a decision under "Simple Cluelessness," an agent must know that there are **no** hidden systematic biases.

  **The Counter-Argument:** Distinguishing Simple from Complex requires knowledge we don't have.
  Imagine you are deciding whether to donate to a charity.
  *   **Greaves:** "If you have no reason to think the long-term effects skew, treat them as zero."
  *   **Critique:** How do you know you have no reason?

  Perhaps there is a systematic reason (a Complex factor) that you simply haven't thought of. Maybe the charity inadvertently strengthens a political institution that tends toward authoritarianism. If you are "clueless" about the long-term effects, you are necessarily clueless about *whether there are systematic biases in those effects.*

  You cannot rule out Complex Cluelessness without investigating the long-term effects. But if you investigate the long-term effects, you are no longer in the realm of the "unforeseeable."
  *   If you *can't* investigate, you don't know if the case is Simple or Complex.
  *   If you *don't know* if it's Simple or Complex, you cannot apply the "cancel out" rule.
  *   Therefore, you must treat every case as potentially Complex.

  This creates a **Meta-Cluelessness** problem. We are clueless not just about the outcomes, but about the *structure of our ignorance*. We don't know if our ignorance is symmetric (Simple) or biased (Complex). Since we can't distinguish them, we can't safely apply the Simple Cluelessness fix.

  ### 4. Value Asymmetry vs. Causal Symmetry
  Even if we grant Greaves that the *causal* effects might be symmetric (which is dubious per point 1), the *axiological* (value) mapping might not be.

  **The Counter-Argument:** Positive and negative value are not mirror images.
  Many ethical frameworks posit asymmetry in value.
  *   **Negative Utilitarianism:** Suffering matters more than happiness. A 50% chance of +100 happiness and a 50% chance of -100 suffering do not cancel out if suffering is lexically worse.
  *   **Existential Risk:** As mentioned by Nick Bostrom and others, the loss of all future generations is a value sink of such magnitude that it dwarfs ordinary goods.

  If the value function is non-linear or asymmetric, then a symmetric probability distribution of outcomes does not yield an expected value of zero. To claim "Simple Cluelessness" allows us to ignore long-term effects, Greaves must assume a linear, symmetric value function. But defending a specific axiology is part of the normative burden of consequentialism. If the correct axiology involves asymmetry, the "Simple" cluelessness calculation fails, turning back into a Complex calculation requiring information we don't have.

  ### Conclusion: The Distinction Collapses
  Greaves attempts to carve out a safe harbor for expected utility theory by isolating cases where the math "washes out." However, this harbor is illusory.

  1.  **Epistemically:** You cannot know a case is "Simple" without ruling out "Complex" factors, which requires knowledge of the long-term future (which is ex hypothesi unavailable).
  2.  **Structurally:** The assumption that long-term causal chains are symmetric and thin-tailed is an unjustified empirical claim about the nature of reality.
  3.  **Axiologically:** Even symmetric causal effects do not guarantee zero expected value if value itself is asymmetric.

  Therefore, "Simple Cluelessness" is just "Complex Cluelessness" in disguise. It pretends to be a mathematical null hypothesis, but it is actually a substantive empirical claim that is just as vulnerable to skepticism as the original cluelessness objection. If this holds, the consequentialist cannot rely on expected value calculations to guide action in any high-stakes or long-term context, as the "simple" cases are too rare (or non-existent) to do the work Greaves needs them to do.
