prompt: |-
  So there's this move Hilary Greaves makes to try to save consequentialism from the "cluelessness" problem (the worry that we can never really know the long-run effects of our actions, so expected value calculations are kind of hopeless). She splits it into "simple" cluelessness, where the unforeseeable effects are symmetric and just cancel out in expectation, and "complex" cluelessness, where we have some shaky systematic reason to think effects skew one way, but that reason is itself unstable. Can you argue that this distinction doesnt actually save expected-value reasoning for consequentialists, basically that her "simple" cases turn out to be just as complex/clueless as the ones she's worried about once you look closely?
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Hilary Greaves' response to the "cluelessness" objection to consequentialism (specifically expected utility maximization).
      *   **Key Concept:** The distinction between "Simple Cluelessness" (unforeseeable effects are symmetric/random, expected value = 0) and "Complex Cluelessness" (unforeseeable effects have a systematic skew, but we can't quantify it reliably).
      *   **Task:** Argue *against* Greaves. Specifically, argue that the distinction fails to save expected-value reasoning because "Simple Cluelessness" cases are actually just as problematic ("Complex") upon closer inspection.
      *   **Goal:** Show that the "cancellation out" assumption in simple cluelessness is unjustified, rendering expected value calculations hopeless even in the "easy" cases.

  2.  **Understand Greaves' Position (Mental Sandbox):**
      *   *The Problem:* If I save a child from drowning, that child grows up to potentially be a tyrant or a saint. I can't know. So how can I say saving them has positive expected value?
      *   *Greaves' Move:* In many cases (Simple Cluelessness), the good and bad long-term ripple effects are equally likely. So, $E[\text{ripple}] = 0$. We just focus on the direct effects.
      *   *Complex Cluelessness:* Sometimes we have a *reason* to think the ripple is positive (or negative), but we can't put a number on it. Greaves admits this is hard but thinks Simple Cluelessness is solvable.
      *   *My Task:* Attack the "Simple" category. Show that symmetry is a myth.

  3.  **Brainstorming Arguments Against the Distinction:**
      *   *Argument 1: The Reference Class Problem.* To say effects are symmetric, you need a reference class of "similar actions." But no two actions are identical. How do you define the distribution?
      *   *Argument 2: Chaos Theory/Non-Linearity.* Small effects don't just add up; they multiply. The "butterfly effect" isn't symmetric noise; it's sensitive dependence on initial conditions. A tiny good deed might trigger a cascade that isn't balanced by a tiny bad deed.
      *   *Argument 3: Value Asymmetry.* Is a unit of suffering equal to a unit of happiness? If negative utilitarianism or loss aversion is true, the distribution isn't symmetric around 0.
      *   *Argument 4: The "Default" Baseline.* What are we comparing against? The status quo isn't neutral. If the world is trending toward doom, *any* intervention might be skewing positive or negative systematically, not randomly.
      *   *Argument 5: Epistemic Access.* How do we *know* it's simple cluelessness? To classify a case as "simple," we need knowledge about the distribution of outcomes. But if we're clueless, we don't have that knowledge. It's self-defeating.

  4.  **Developing the Strongest Line of Attack:**
      *   The strongest argument is likely the *Epistemic Access* argument combined with *Non-Linearity*.
      *   *Core Thesis:* You cannot categorize a situation as "Simple Cluelessness" without possessing the very knowledge that cluelessness says you lack. To assert symmetry is to make a substantive empirical claim about the causal structure of the world, which is vulnerable to the same skepticism as Complex Cluelessness.

  5.  **Drafting the Argument Structure:**
      *   **Introduction:** Briefly summarize Greaves' distinction (Simple vs. Complex). State the thesis: The distinction collapses because identifying a case as "Simple" requires unjustified epistemic confidence.
      *   **Point 1: The Symmetry Assumption is Substantive, Not Default.** Greaves treats symmetry as the null hypothesis. It's not. It's a specific claim about causal networks.
      *   **Point 2: The Problem of Causal Depth.** Long-term effects aren't additive noise; they are path-dependent. Chaos theory suggests distributions are fat-tailed, not normal. Symmetry breaks down in fat-tailed distributions.
      *   **Point 3: The Meta-Cluelessness Problem.** To know a case is "Simple," you need to know there are no hidden systematic biases. But that requires investigating the "Complex" factors. If you can't rule out Complex Cluelessness, you can't assert Simple Cluelessness.
      *   **Point 4: Value Asymmetry.** Even if causal effects are symmetric, *value* might not be. (e.g., preventing extinction vs. causing it).
      *   **Conclusion:** The distinction is epistemically unstable. If we are truly clueless about long-term effects, we are clueless about the *distribution* of those effects, not just the mean.

  6.  **Refining the Tone:**
      *   Needs to be philosophical, rigorous, but accessible.
      *   Acknowledge Greaves' contribution (it's a sophisticated move) before dismantling it.
      *   Use terms like "epistemic access," "causal topology," "fat tails," "null hypothesis."

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "Simple Cluelessness" specifically? Yes.
