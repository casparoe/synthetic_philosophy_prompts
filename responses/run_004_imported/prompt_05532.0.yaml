      *   *Correction:* Williamson argues against *luminosity*. So, there are cases where you are in pain but don't know it (or vice versa? No, usually: you feel cold but don't know you feel cold).
      *   *Refinement:* The argument is that for non-luminous conditions, there is a gap between obtaining and knowing.
      *   *The Breakup:* How does this apply? "The relationship is over." That's external. "I am unhappy." That's internal.
