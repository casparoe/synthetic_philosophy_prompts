      *   **Round 4: The Breakup Connection.** Bring it back to the user's specific case ("I knew but didn't know I knew"). Distinguish between *propositional* knowledge (the relationship is over) and *phenomenal* knowledge (feeling unhappy).
      *   **Closing:** Pinpoint the disagreement. Is knowledge an internal state or a relation to the environment?

  5.  **Refining the Arguments (Self-Correction during drafting):**
