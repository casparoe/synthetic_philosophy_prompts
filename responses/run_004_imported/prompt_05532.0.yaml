  *(Self-Correction Note)*: I need to be careful with Williamson's exact claim. He argues that *no* non-trivial condition is luminous. So even "feeling cold" isn't luminous. Elena needs to defend the intuition that *some* things are luminous (phenomenal states). Marcus needs to defend that *knowledge* requires a margin for error even there.

