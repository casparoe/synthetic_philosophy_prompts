  2.  **Deconstruct the Philosophical Arguments:**
      *   **The KK Principle:** $Kp \to KKp$. If I know $p$, I know that I know $p$.
      *   **Luminosity:** A condition $C$ is luminous if whenever $C$ obtains, the subject is in a position to know that $C$ obtains. (e.g., feeling cold).
      *   **Williamson's Anti-Luminosity Argument:**
          1.  Assume feeling cold is luminous.
          2.  Consider a sequence of times $t_0$ to $t_n$ where one goes from freezing to hot.
          3.  At $t_0$, I feel cold and know it.
          4.  At $t_n$, I don't feel cold.
          5.  Margin for Error Principle: If I know I feel cold at $t_i$, then I must feel cold at $t_{i+1}$ (because my discriminative powers aren't perfect; close cases look the same).
          6.  By induction, I feel cold at $t_n$. Contradiction.
          7.  Therefore, feeling cold is not luminous.
      *   **Pro-KK Counter-moves:**
          *   Reject the Margin for Error principle as too strong.
          *   Distinguish between *phenomenal* states (how it feels) and *factive* states (knowledge).
          *   Argue that Williamson's view leads to skepticism about introspection.
