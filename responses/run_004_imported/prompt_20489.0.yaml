answer: |-
  A modal logician submits a detective novel to his publisher. A week later, the editor calls him up, furious.

  "There's no plot!" the editor shouts. "On page two, the detective looks at the crime scene evidence, and immediately arrests the butler. Where's the investigation? Where's the suspense?"

  The logician sighs. "You're reading him as a human. You have to read him as an ideal epistemic agent."

  "What does that mean?"

  "It means his belief state is closed under logical implication," the logician explains. "On page one, the text establishes that he believes the evidence. In standard modal logic, if an agent believes $P$, and $P$ entails $Q$, then the agent *automatically* believes $Q$."

  "Okay..."

  "Well, the evidence entails the butler did it. So the moment he believes the evidence, he believes the butler did it. To make him wait until chapter ten to 'figure it out' would be a false representation of his rationality. It would imply he's ignorant of the consequences of his own beliefs."

  The editor pauses. "But... nobody knows who did it yet. That's the twist. Even *you* haven't written the confession scene."

  "Exactly!" says the logician. "But that's a limitation of *your* computation, not his. To the detective, the killer's identity isn't a mystery; it's just an uncomputed corollary. He believes every theorem derivable from the axioms of the crime scene, including the ones we haven't worked out yet."

  "So how do we fix it?" asks the editor. "How do we give him some doubt?"

  "I can't," says the logician. "If I bound his rationality so he misses the implication, I break the K-axiom and the whole system collapses. If I model his computational limits accurately, the character becomes undecidable."

  "Meaning?"

  "Meaning I'll never finish the draft. It turns out logical omniscience is a great way to solve crimes, but a terrible way to meet a word count."
