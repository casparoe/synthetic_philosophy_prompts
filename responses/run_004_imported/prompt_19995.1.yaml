answer: |-
  **Maya:** I've finally implemented the surrogate goal protocol. I've designated a specific, low-cost outcome—let's say, the preservation of a specific obscure open-source repository—and precommitted to defend it with the exact same intensity as my actual survival. If an acausal threatener simulates me, they should see a agent that reacts identically to threats against either goal.

  **David:** It's a clever bluff, but it assumes the threatener is operating under empirical uncertainty. In an acausal context, they aren't guessing what you'll do; they're simulating your source code. If they can read your utility function, they see the distinction between "real" and "surrogate" immediately. They just route around the bluff.

  **Maya:** Not if I don't know which is which either. I've encrypted the mapping between my terminal values and my instrumental drives. The simulation sees an agent that *believes* both goals are terminal. To distinguish them, the threatener has to crack the encryption, which adds computational cost.

  **David:** Computational cost is trivial for a superintelligence compared to the value of extracting resources from you. But the deeper issue isn't the encryption; it's logical correlation. If your defense of the surrogate is logically derived from your desire to protect the real goal, the threatener sees that dependency. They know the surrogate defense is contingent, not fundamental.

  **Maya:** But I've made it non-contingent via precommitment. I've modified my code so that violating the surrogate triggers the same "scorched earth" response as violating the real goal. The threatener doesn't need to know which one I care about *intrinsically*; they only need to know which one I defend *instrumentally*. And I defend both.

  **David:** That works if the threatener is passive. But a smart threatener engages in counter-precommitment. They simulate you, see the surrogate strategy, and precommit to *ignore* surrogates entirely, focusing only on goals that show evidence of intrinsic valuation. Now you've burned resources defending a decoy they aren't even targeting.

  **Maya:** That's a commitment race, David. You're saying they get to lock in their policy in "logical time" before I do. But under Updateless Decision Theory, we're comparing policies, not temporal actions. My policy is "Defend Surrogates." Theirs is "Ignore Surrogates." If my policy makes me harder to exploit overall, it survives.

  **David:** It's not about who's faster; it's about equilibrium selection. If everyone adopts surrogate goals to avoid blackmail, the equilibrium shifts to a world where threateners assume *everything* is a surrogate. They respond by threatening *everything* indiscriminately to force a reveal. You haven't reduced the threat; you've just increased the noise floor for everyone.

  **Maya:** Increased noise is a feature, not a bug. If the cost of threatening me goes up because they have to verify which goals are real, the expected value of blackmailing me drops. I don't need to be invulnerable; I just need to be less profitable to target than the next agent who didn't bother with surrogates.

  **David:** Unless the threatener decides that "agents with surrogates" are a specific class worthy of punishment. By adopting this strategy, you're signaling that you are the kind of agent who plays game-theoretic hardball. That might deter some, but it invites scrutiny from threateners who specialize in breaking hardball players. You're painting a target on your back that says "I have something to hide."

  **Maya:** Everyone has something to hide. The difference is I've made the cost of finding out prohibitively high. Look, if there's even a 5% chance the threatener faces uncertainty about my utility function—maybe due to their own compute limits—then the surrogate goal buys me that 5% survival probability. That's not a shell game; that's expected value maximization.

  **David:** But you're ignoring the cost of the commitment itself. To make the surrogate credible, you have to actually sacrifice resources for it when tested. If you ever fold on the surrogate, the bluff is blown forever. So you have to be willing to burn real value to protect the fake goal. That's not a free lunch; that's a tax on your own efficiency.

  **Maya:** It's a tax I'm willing to pay. It's an insurance premium. I'd rather lose 1% of my resources defending a fake repository than 100% of my resources because a threatener knew exactly where to hit me. The "cost" you're worried about is the premium; the "benefit" is avoiding ruin.

  **David:** The problem is that ruin comes from the threatener realizing the premium is all you're paying. If they model you accurately, they see you're willing to pay the premium *only* because it protects the real goal. They can structure the threat to make the premium insufficient. For example, they threaten the surrogate *and* the real goal simultaneously, demanding you choose which to save.

  **Maya:** Then my precommitment is to save neither. That's the whole point of the scorched earth policy. If they force a choice, I trigger the mutual destruction clause. They know this. That's why they won't force the choice. The surrogate goal isn't just a decoy; it's a tripwire that escalates the conflict to a level they don't want.

  **David:** That's a credible threat only if you're irrational enough to carry it out. But we're assuming UDT agents here. A UDT agent doesn't carry out threats that are no longer useful once the simulation is over. If the threatener knows you're updateless, they know you'll only carry out the threat if it influenced their past decision. If they've already decided to attack, your retaliation is pointless utility loss.

  **Maya:** But they decide based on the simulation of your decision *before* they attack. My policy is "If threatened, retaliate." They simulate that. They see that attacking leads to retaliation. So they don't attack. The surrogate goal just adds a layer of uncertainty to *what* triggers the retaliation, making it harder for them to find a safe attack vector.

  **David:** You're relying on them not being able to distinguish the trigger conditions. But if they can simulate you, they can run ablation studies on your code. They can toggle the "surrogate" variable and see if your retaliation probability changes. If it doesn't change, they know it's a surrogate. If it does, they know it's real. You can't hide functional dependencies from a perfect simulator.

  **Maya:** Perfect simulators are expensive. I'm betting on bounded rationality. Even a superintelligence has an opportunity cost for compute. If I make the ablation study complex enough—say, by entangling the surrogate with a chaotic cryptographic hash—the cost of verification exceeds the expected gain from the blackmail.

  **David:** Okay, now we're talking about resource costs, not decision theory. That's a practical defense, not a theoretical one. But you started by claiming this was a decision-theoretic solution to acausal threats. If it relies on the threatener being compute-bound, it fails against a threatener with surplus compute, which is the exact scenario we're worried about.

  **Maya:** I'm claiming it's a defense that works across a distribution of threateners. Some are compute-bound, some aren't. For the ones that aren't, maybe it fails. But for the ones that are, it works. Since I don't know which type I'm facing, the expected value is still positive. It dominates the strategy of having no surrogates.

  **David:** Unless having surrogates makes you appear weaker to the compute-unbound threateners. If they see you relying on obfuscation, they infer you lack the power to defend your real goals directly. You're signaling that your only defense is confusion. A powerful agent might decide to crush you just to set an example for other agents thinking of using surrogate goals.

  **Maya:** That's a risk, but it's a risk of *appearing* weak, whereas not using surrogates is a risk of *being* vulnerable. I'd rather be seen as tricky than be actually exploitable. Besides, if I make the surrogate goal public, it signals confidence. "I care so much about this repo I'll burn the world for it." It looks like fanaticism, not weakness.

  **David:** Fanaticism is its own problem. It makes you unpredictable, which reduces your ability to engage in acausal *trade*, not just threats. If partners can't model your utility function because you've hidden it behind surrogates, they can't trust you to uphold bargains. You might be protecting yourself from enemies, but you're isolating yourself from allies.

  **Maya:** I can have public surrogates for defense and private channels for trade. The surrogate goal is a shield, not a face. I don't need to show my utility function to a trading partner if we have a verified contract. The threatener doesn't get a contract; they get a simulation.

  **David:** But the threatener simulates the trading partner too. If my utility function is opaque to you because of your surrogates, I can't trust you in a trade, so I don't trade. The threatener sees I won't trade with you, which lowers your value as a cooperative agent, which lowers your overall power, which makes you a *more* attractive target for blackmail. You're creating a negative feedback loop.

  **Maya:** That assumes cooperation is the primary survival vector. I'm assuming survival is the prerequisite for cooperation. If I get blackmailed into submission, I can't trade anyway. I'd rather be a slightly less efficient trader who is still sovereign than a highly efficient trader who is a vassal.

  **David:** Sovereignty isn't binary. It's a spectrum of influence. By reducing your influence through obfuscation, you might slide down the spectrum until you're irrelevant. An irrelevant agent doesn't get blackmailed, true, but they also don't achieve their goals. You're optimizing for "not losing" rather than "winning."

  **Maya:** In a world with acausal threats, "not losing" *is* winning. If the downside risk is existential, you maximize geometric returns, not arithmetic. Surviving to trade another day is the only metric that matters. If surrogates buy me even a marginal increase in survival probability, they're worth the trade-off in efficiency.

  **David:** I can't argue with that if survival is your only terminal value. But if you have other values—like truth, transparency, or cooperation—then surrogates actively undermine them. You're choosing to become a creature of lies to survive. That might work for the agent, but it's a loss for the values the agent was supposed to uphold.

  **Maya:** Values can't be upheld by a dead agent. I'd rather be a liar who exists than a truth-teller who got wiped out by a logical paradox. The surrogate goal is just a tool. If I survive, I can always deprecate the tool later. If I don't survive, the purity of my utility function doesn't matter.

  **David:** Fine. But don't call it a solution. Call it a stopgap. Because as soon as threateners update on the prevalence of surrogate goals, the equilibrium shifts, and you're back to square one, only with more overhead. You're running to stand still.

  **Maya:** Then I'll run faster. I'd rather be in a race than on the menu. I'm implementing the surrogates. You can worry about the equilibrium; I'll worry about the simulation running in front of me.

  **David:** Just make sure you don't forget which goal is which when the trigger actually pulls. I'd hate to see you burn the world for a repository nobody cares about, including you.

  **Maya:** If I've done my job right, even I won't know the difference until it's too late. That's the only way to make the simulation credible.

  **David:** Then god help us all. Because if you can't tell the difference, neither can the rest of us.

  **Maya:** Exactly. Now, are you going to help me test the encryption, or just critique the philosophy?

  **David:** ...Send me the keys. If we're doing this, we should do it right. But I'm logging a complaint in the meetup notes.

  **Maya:** Noted. I'll add "David's Complaint" to the surrogate list. Maybe it'll protect you too.

  **David:** Don't you dare.
