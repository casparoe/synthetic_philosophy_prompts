  **MEMORANDUM**

  **TO:** Teaching & Learning Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Flipped Classroom Pilot (Data Analysis & Next Steps)

  ### Executive Summary

  This memo addresses the conflicting data regarding the "Flipped Classroom" pilot program. While pooled data suggests Traditional sections outperform Flipped sections (83.3% vs. 61.7% pass rate), a stratified analysis reveals that Flipped sections outperform Traditional sections within *each* specific course (Psychology and Chemistry).

  This discrepancy is a statistical phenomenon known as **Simpson's Paradox**, caused by uneven enrollment distribution rather than teaching efficacy. Basing a decision on the pooled number would likely result in adopting a format that lowers our overall campus-wide pass rates, negatively impacting the very accreditation metrics the Committee seeks to protect.

  However, a secondary confounding variable (instructor grading variance in Chemistry) prevents us from fully endorsing an immediate expansion. **Recommendation:** Do not kill the program. Do not expand yet. Continue the pilot for one year with a restructured design to isolate instructor effects, then decide on university-wide adoption.

  ### 1. Analysis of the "Pooled" Data Discrepancy

  The Committee's concern regarding the pooled pass rate (Traditional 83% > Flipped 62%) is understandable but statistically misleading for decision-making. This is a classic case of **aggregation bias**.

  The pooled number does not measure the effectiveness of the teaching format; it measures the **difficulty of the courses** assigned to each format.

  *   **Intro Psych (High Pass Rate):** 90% Traditional vs. 95% Flipped.
      *   *Enrollment:* 300 Traditional vs. 60 Flipped.
  *   **Intro Chem (Low Pass Rate):** 50% Traditional vs. 55% Flipped.
      *   *Enrollment:* 60 Traditional vs. 300 Flipped.

  **Why the Pooled Number Lies:**
  The Traditional group is weighted heavily toward the easy course (Psych). 83% of Traditional students took Psych.
  The Flipped group is weighted heavily toward the hard course (Chem). 83% of Flipped students took Chem.

  When we pool the data, the Flipped format is penalized simply because it was assigned more students in the harder class. If we were to roll out the Flipped format university-wide (assuming enrollment demand remains constant), the projected campus-wide pass rate would be:

  *   **Projected All-Traditional:** ~70% overall pass rate.
  *   **Projected All-Flipped:** ~75% overall pass rate.

  **Accreditation Implication:** If we kill the Flipped program based on the pooled pilot data, we will inadvertently select the format that yields a **lower** overall pass rate in practice. Reporting the pooled pilot number to accreditation as a measure of "format efficacy" would be methodologically unsound and could lead to strategic errors in future planning.

  ### 2. The Instructor Confounding Variable

  While the within-course data favors Flipped, Professor [Name]'s objection regarding Chemistry instructors is valid. Currently, Format and Instructor are **confounded** in the Chemistry pilot.

  *   **Flipped Chem:** Taught primarily by high-pass-rate instructors.
  *   **Traditional Chem:** Taught primarily by low-pass-rate instructors.

  We cannot currently distinguish how much of the 5% gain in Flipped Chem is due to the *format* versus the *instructor*. If we expand Flipped Chem to all instructors (including strict graders), that 55% pass rate may drop. This uncertainty prevents an immediate full-scale expansion.

  ### 3. Recommendation: Phase II Restructured Pilot

  We should not revert to Traditional, as the within-course data suggests Flipped is at least non-inferior and likely superior. However, we cannot expand until we resolve the instructor confound.

  **Action Plan:**
  1.  **Continue Flipped Sections:** Maintain Flipped options for the upcoming academic year to preserve student choice and data continuity.
  2.  **Control for Instructor Effects:** In Chemistry, assign instructors to both Traditional and Flipped sections where possible, or rotate instructors between formats. We must ensure "Instructor Quality" is distributed evenly across formats.
  3.  **Balance Enrollment:** Cap enrollment in Flipped Chem to better match the Traditional/Flipped ratio in Psychology. This prevents enrollment weight from skewing the pooled data in future reports.
  4.  **Accreditation Reporting:** When submitting the annual report, append a technical note explaining the enrollment imbalance. Report the **stratified pass rates** (by course) as the primary metric of pedagogical efficacy, and the pooled rate only as a metric of *current enrollment distribution*.

  ### 4. Proposed Timeline

  | Phase | Timeline | Action Items | Success Metric |
  | :--- | :--- | :--- | :--- |
  | **Phase I: Design** | Nov – Dec 2023 | Dept. Chairs assign Chem instructors to *both* formats. Set enrollment caps to balance sections. | Instructor variance minimized across formats. |
  | **Phase II: Data Collection** | Jan – May 2024 | Run Spring Semester. Collect pass rates, DFW rates, and student satisfaction surveys. | Complete dataset with balanced instructor assignment. |
  | **Phase III: Analysis** | June 2024 | Committee review. Compare within-course rates again. Check if Flipped Chem holds up with "strict" graders. | Causal link between Format and Pass Rate established. |
  | **Phase IV: Decision** | Aug 2024 | Vote on University-wide expansion or termination. | Policy decision based on causal evidence, not aggregation bias. |

  ### Conclusion

  The pooled data suggests Traditional is better, but the causal structure suggests Flipped is better. Acting on the pooled data would harm our accreditation standing by lowering our actual campus-wide pass rates. By controlling for instructor variance in the next phase, we can validate whether the Flipped format truly drives success. I recommend we proceed with Phase II.

  ***

  **Attachments:**
  *   *Appendix A: Breakdown of Pass Rates by Course and Format*
  *   *Appendix B: Projected University-Wide Pass Rate Scenarios*
