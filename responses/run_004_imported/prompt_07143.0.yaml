              *   *Verdict:* It relocates the problem. You save the content but lose the purity of "structure only."

      *   **Escape 2: Ontic Structural Realism (OSR):**
          *   *The Move:* (Ladyman, Ross). Stop trying to save the distinction between structure and objects. There *are* no objects. Only structure exists. "Structure all the way down."
          *   *The Assessment:*
              *   *Pros:* Avoids Newman because there are no "relata" to have arbitrary cardinality in the old sense. Structure is fundamental.
              *   *Cons:* "Structure without relata" is metaphysically obscure. How do you have a relation without things relating? (The "relations without relata" problem). Also, does it solve Newman? Some argue OSR still faces a version of Newman if it relies on mathematical structure that can be instantiated anywhere.
              *   *Verdict:* It radically changes the metaphysics. It defuses Newman by changing the subject, but introduces new metaphysical headaches (intelligibility).

