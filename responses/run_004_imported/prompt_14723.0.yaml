answer: |-
  Here is a sequence of ten interview questions designed to escalate the pressure on the Control Principle, avoiding standard clichés while targeting the specific "psychology vs. metaphysics" defense your interviewee favors. The three required thematic sections include the anticipated follow-up probes.

  **1.** Let's establish the baseline of your view without reaching for the standard examples. Imagine two safety inspectors who both negligently ignore the same protocol. In one case, the machinery holds; in the other, it fails catastrophically. You argue their blameworthiness is identical because the negligence was identical. But if moral judgment is partly a tool for social regulation—signaling where we need to tighten protocols—doesn't treating them identically blunt the utility of blame? Why should metaphysics trump social function here?

  **2.** You often dismiss the intuition that the catastrophic inspector is worse as "a fact about the psychology of blame, not its metaphysics." That suggests our shared moral intuitions are systematically misleading us. But if this psychological response is universal and stable across cultures, why shouldn't we treat it as *data* for metaphysics rather than noise? At what point does a universal psychological "error" become evidence that our metaphysical theory is incomplete?

  **3.** I'd like to press you on Thomas Nagel's category of *circumstantial luck*. Consider a potential whistleblower in a corrupt corporation. One employee blows the whistle and is fired; another, equally principled employee, works for a benign company and never faces the test. We hesitate to call the second employee "virtuous" in the same way, simply because they weren't tested. If the Control Principle holds, shouldn't we credit them equally? Or does your view imply that virtue is invisible until luck reveals it?

  > **Follow-up (if she distinguishes assessing the will from assessing the person's history):**
  > "You're drawing a line between assessing the *quality of the will* and assessing the *whole person's life record.* But if the will is the only thing that matters, and the will is identical in both cases, why do we feel—and why should we feel—that the untested person's moral standing is incomplete? Doesn't that incompleteness suggest that moral status *does* depend on the interaction with the world, not just the internal state?"

  **4.** Following up on that: If the untested employee isn't fully virtuous because they haven't acted, does that mean they aren't fully responsible agents yet? If moral worth requires the *exercise* of will in the face of contingency, haven't you conceded that luck is a necessary condition for moral judgment, rather than an intruder upon it?

  **5.** Let's shift to Bernard Williams's notion of *agent-regret*. When a driver accidentally hits a child despite taking all due care, they feel a specific regret that a bystander with identical information does not. You classify this as a psychological artifact. But why is this "error" so structurally specific? Why does the illusion of responsibility attach *only* to the agent and not the bystander? What mechanism in your metaphysics explains that selectivity?

  > **Follow-up (if she distinguishes assessing the will from assessing the agent's emotional economy):**
  > "I understand you want to separate the *moral assessment of the will* from the *agent's emotional economy.* But if the emotion is appropriate for the agent but inappropriate for the bystander, that implies a moral difference in their relations to the event. If there's a moral difference in their relations, how can there be *no* difference in what they deserve? Aren't you smuggling a moral distinction in through the back door of 'emotional appropriateness'?"

  **6.** If agent-regret is indeed a psychological illusion, as you suggest, should we try to educate it out of people? If a driver feels no special regret because they know they lacked control, should we commend their rationality, or worry that they lack a crucial moral sentiment? If the latter, doesn't that admit the 'illusion' serves a necessary normative function?

  **7.** I want to push your individuation strategy down to the level of *constitutive luck*. You argue we should judge the quality of the will, not the outcome. But the capacities that allow a will to be 'good'—patience, empathy, impulse control—are largely innate or early-developed. No one chooses their temperament. If blameworthiness tracks the will, but the will is built from unchosen materials, haven't you just relocated the luck problem from the *consequences* of action to the *constitution* of the actor?

  > **Follow-up (if she distinguishes assessing the will from assessing the capacities that enable it):**
  > "You're distinguishing between the *choice* the will makes and the *capacities* that make that choice possible. But if the capacities determine the range of choices available, how can the choice be free of the luck that built the capacities? If I have a 'good will' only because I was born with a calm temperament, in what sense is that will *mine* to claim credit for, rather than a lucky inheritance I'm custodian of?"

  **8.** Defenders of the Control Principle often treat the 'quality of will' as a black box that is immune to luck. But if we open that box, we find genetics, upbringing, and neurochemistry. If you insist on stripping away everything influenced by luck to find the 'true' agent, is there anything left inside the box but a metaphysical ghost? How thin can the agent become before responsibility dissolves entirely?

  **9.** You've argued that acknowledging moral luck forces us into skepticism about responsibility. But consider the alternative: if you pursue the Control Principle as rigorously as you suggest, stripping away outcome luck, circumstantial luck, and constitutive luck, don't you arrive at the same destination as the skeptics? If nothing is ultimately within control, isn't your strict defense of the Control Principle actually a proof of the 'hard luck' skepticism associated with Galen Strawson or Neil Levy?

  **10.** To close: If your view implies that no one ultimately deserves praise or blame in the deep sense, but we must keep practicing blame for social utility, aren't you advocating for a 'noble lie'? And if so, why should philosophers—who prize truth—defend a system of judgment they admit is metaphysically false?
