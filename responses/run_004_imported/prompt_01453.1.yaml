answer: |-
  The clay on Mara's wheel hummed, a low vibration that traveled up her forearms and settled in her teeth. It was Resonance Clay, sensitive to intent. For twenty years, she had been a Binder, shaping promises for clients who feared their own futures. A husband wanting to vow fidelity not just to his wife, but to the man he promised to become. A scholar locking away her curiosity so she could finish her thesis. The clay hardened only when the intent was coherent, when the "you" of today matched the "you" of tomorrow.

  Today, the wheel was still. Mara sat before a lump of grey matter intended for her own seventieth birthday.

  She was forty-five. The plan was simple: she would sculpt a vessel of stability, a anchor for her old age. She intended to bind herself to a specific set of values—patience, kindness, the preservation of her garden. She imagined her future self, white-haired and brittle, touching the clay and feeling the resonance of her current conviction. It was an act of love across time.

  She placed her hands on the lump. She closed her eyes and projected the image of her future self. She felt the weight of the years, the ache in the knees, the quiet of the house. She pushed the intent into the clay: * Remain who you are.*

  The clay shivered. It rose, forming a perfect sphere, then collapsed into a slurry.

  Mara wiped her hands on her apron. She tried again. * Remain who you are.*

  This time, the clay spiked, jagged shards erupting from the center before crumbling into dust. It wasn't resistance; it was rejection. The material wasn't saying the intent was weak; it was saying the intent was grammatically incorrect.

  She stood up and walked to the window. The garden outside was overgrown. She had planned to prune the roses last week, but she hadn't. She had wanted to, but the "wanting" had evaporated in the heat of Tuesday afternoon. Was that still her? The woman who wanted pruned roses, or the woman who sat in the shade ignoring them?

  She returned to the wheel. The theory of Binding assumed a continuous thread, a singular noun that persisted from verb to verb. *I promise. I will keep.* But looking at the grey sludge, Mara felt a cold vertigo. The clay required a static object to hold the shape. It needed a definition of "Mara" that was fixed enough to be modeled, stable enough to be bound.

  But there was no fixed Mara. There was only the process of becoming.

  The woman who planted the garden was not the woman who neglected it, and neither was fully the woman who would one day inherit it. They were distinct entities linked by memory and flesh, but not by a unified command structure. To bind her future self to her current values was an act of violence, a attempt by a ghost to haunt a house that hadn't been built yet.

  She realized then why the client files were locked in the basement. She had never looked at her own work from the inside before. She had always been the god outside the model, shaping others. Now, embedded in the clay, she was the variable that couldn't be solved.

  If she succeeded in binding herself, she would kill the capacity for change. She would force a future organism to obey the biology of a past one. The values she was trying to preserve—kindness, patience—were only virtues because they were chosen freely in the moment. Hardwired, they were just mechanics.

  The category error was total. She had built a career on the existence of a "Self" that could be captured, like a butterfly in a case. But the self was not the butterfly; it was the flight.

  Mara looked at the dust on the wheel. It was dry now, inert. It would never hold a shape.

  She took a breath, and for the first time in years, she felt the terrifying lightness of having no anchor. There was no one to promise. There was only the next moment, and the next choice, unbound by any contract signed in blood or clay. The garden outside would grow wild. The woman who woke up tomorrow might hate the roses. She might cut them down.

  And that would be okay.

  Mara scraped the dried clay from the wheel head. It fell into the bin with a dull clatter. She washed her hands in the basin, watching the grey water swirl down the drain. Her reflection in the mirror was sharp, then blurred by a splash of water, then sharp again.

  She walked out of the workshop into the garden. The heat hit her face, immediate and demanding. She didn't know what she would do about the roses. She picked up the shears, feeling the weight of them, the cool steel against her palm. She held them there, neither cutting nor dropping them, suspended in the uncertainty of the now.

  The sun moved across the sky, unasked. Mara stood in the light, unbound, and waited to see who she would be when the shadow touched her feet.
