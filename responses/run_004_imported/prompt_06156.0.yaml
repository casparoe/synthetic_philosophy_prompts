      *   *Assessment:* This objection loses most of its force. The FTA isn't about morphological similarity (shape/structure) but nomological precision (laws/values). However, a Humean could pivot: "Why assume these constants *need* an explanation?" or "Why assume a mind is the only generator of order?"
