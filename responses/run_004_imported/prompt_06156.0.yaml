      *   **Philo's Objections:**
          1.  *Weak Analogy:* Universe $\neq$ Machine (more like a plant/animal).
          2.  *Limited Designer:* Even if designed, doesn't prove *infinite/perfect* God (could be finite, multiple, flawed).
          3.  *Epicurean Hypothesis:* Infinite time + finite particles + motion $\rightarrow$ eventual order (Chance over time).

