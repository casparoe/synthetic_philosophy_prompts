answer: |-
  **Setting:** *A wooden bench in a university arboretum, late afternoon. The air is warm. ELENA (Platonist) and MARCUS (Nominalist/Fictionalist) are watching graduate students pack up equipment near a stand of oaks.*

  **Elena:** You know, for a retired biologist, your friend has excellent taste in reading lists. But I suspect he's been torturing you with the cicadas.

  **Marcus:** [Laughs] Torturing is the wrong word. Intriguing. I spent forty years measuring wing spans and counting emergence densities. I used statistics, obviously. Differential equations for population dynamics. But I never stopped to ask if the numbers I was crunching *existed* outside of my notebook. Now I'm told that the reason those insects wait seventeen years is because of the fundamental structure of arithmetic. It feels like being told my shovel is actually a metaphysical argument.

  **Elena:** That's precisely the point Alan Baker was making. It's not that you used math as a shovel. It's that the *explanation* for the biological success relies on a mathematical fact. Consider the 13-year and 17-year broods. They emerged together this year. That won't happen again for 221 years.

  **Marcus:** Because 13 times 17 is 221. I know the arithmetic, Elena.

  **Elena:** But *why* is that arithmetic relevant? The standard evolutionary story is hybridization avoidance. If a 13-year brood and a 12-year brood overlap frequently, they interbreed, the offspring emerge on non-synchronized cycles, they get eaten, and the lineage dies. The prime cycles minimize the Least Common Multiple (LCM) with other potential cycles. But Baker's claim is stronger. He argues that the property of *being prime* is doing the explanatory work. It's not just that we describe the cycles with numbers; it's that the biological fitness is a function of number-theoretic properties.

  **Marcus:** I see the move. You're leaning on the Explanatory Indispensability Argument. If the best explanation of a physical phenomenon invokes mathematical entities, we ought to believe in those entities. But I think you're conflating the *description* of the constraint with the *cause* of the constraint.

  **Elena:** I'm not conflating them. I'm saying the constraint *is* mathematical. Think about the predators. Suppose a predator has a 2-year life cycle. A cicada with a 6-year cycle overlaps with that predator every 6 years. A cicada with a 7-year cycle overlaps every 14 years. The 7-year cycle is evolutionarily superior. Why? Because 7 is prime relative to 2. The biological mechanism—natural selection—is selecting for a mathematical property.

  **Marcus:** Careful. Natural selection selects for *survival*. It selects for physical organisms that persist in time. The fact that "7 is prime relative to 2" is a true statement, I'll grant you that. But it's a truth about concepts, not about the cicadas. The cicadas don't "instantiate" primality. They instantiate a temporal duration.

  **Elena:** But the temporal duration only has the effects it does *because* of the number theoretic relations. You can't explain why the 17-year cycle avoids the 2-year predator without invoking divisibility. If you try to tell the story purely in physical terms—"the insects come out, the birds eat them, the insects wait"—you lose the *generality*. You lose the reason why this works for 13 and 17, but wouldn't work for 12 and 15. The pattern holds across any possible world where discrete periodic events interact. That suggests the explanation rests on abstract structure, not just local physical facts.

  **Marcus:** That's the Platonist's favorite trap: confusing generality with ontology. Just because a rule applies everywhere doesn't mean the rule exists as an object. Look, I'm happy to adopt a Field-style fictionalism here. I can say: "According to standard arithmetic, 13 and 17 are prime. According to our biological models, this minimizes overlap." This is useful. It's even indispensable for *us* to calculate the outcome. But does the universe need the concept of "prime" to make the cicadas come out?

  **Elena:** The universe doesn't need the *concept*. But it does need the *relation*. Here is the specific challenge for you, Marcus. You want to paraphrase this away. You want to say we can explain the cicada survival rates purely in terms of physical intersection frequencies without referencing abstract numbers. Go ahead. How do you explain the 221-year separation of the 13 and 17 broods without invoking the LCM?

  **Marcus:** I explain it by counting.

  **Elena:** Counting is mathematics.

  **Marcus:** No, counting is a physical operation of matching tokens. I can explain it like this: If Brood A emerges, and we wait one cycle, Brood B has not finished its cycles. We keep waiting. We observe that Brood A must emerge 17 times before Brood B emerges 13 times simultaneously. I can construct a nominalistic physics of time intervals. I define "time" not as a real number line, but as a series of physical events. The "221 years" is just a label for the duration it takes for these two physical clocks to reset together. I don't need the number 221 to exist. I just need the physical coincidence to occur.

  **Elena:** That's a description of the *event*, not an explanation of the *pattern*. You've told me *that* they synchronize after 221 years. You haven't told me *why* it takes that long. To explain the "why," you have to point to the factors of 13 and 17. You have to say, "There is no smaller number of years that is divisible by both." That is a fact about the integers. If you remove the integers, you remove the reason the synchronization is delayed. You're left with a brute fact: "They sync now." But the science tells us they *must* sync now, given those periods. That "must" comes from number theory.

  **Marcus:** The "must" comes from logic, not ontology. Look, let's grant that the mathematical statement is true. The Fictionalist says mathematical statements can be true *within the fiction* of mathematics. The question is: does the truth of "13 and 17 are coprime" add any new physical predictions that a purely physical description wouldn't capture?

  **Elena:** It adds explanatory depth.

  **Marcus:** Depth isn't ontology. I can explain why a bridge stands using the fiction of continuous stress fields, even if matter is discrete. The math organizes the physical facts. In the cicada case, the math organizes the facts about predator-prey intersection rates. The nominalist strategy isn't to deny the utility. It's to deny that the utility proves the existence of the tools.

  **Elena:** But Baker's point is that the math isn't just organizing known physical facts. It's constraining what physical facts are *possible*. If a mutation occurred that shifted the cicada cycle to 15 years, the model predicts a collapse in fitness because 15 shares factors with 3 and 5. The mathematical fact explains the counterfactual: "If the cycle were 15, they would die out." How do you ground that counterfactual nominalistically? What physical fact makes it true that a 15-year cycle *would* fail, before the mutation even happens?

  **Marcus:** The physical facts about the predator populations. If predators have 3-year cycles, they will be present in year 15. That's a physical fact about predator metabolism and reproduction. The number 15 is just a measure of the time. The "failure" is caused by the birds eating the bugs, not by the number 15 being composite. The composite nature is just how we categorize the time interval.

  **Elena:** You're pushing the causal burden entirely onto the birds. But the *pattern* of vulnerability is determined by the divisibility. Imagine a world where the laws of arithmetic were different—where 13 and 17 shared a common divisor. In that world, even with the same birds and the same biology, the cicadas would overlap more often.

  **Marcus:** But that's impossible. That's like asking me to imagine a world where bachelors are married. You're asking me to imagine a world where logic is different. Of course, if logic changes, physical outcomes change. That doesn't prove that logic is a physical object. It just proves that reasoning requires rules.

  **Elena:** And where do those rules live, Marcus? If they govern the physical world—if the cicadas obey the rules of arithmetic without knowing them, without us teaching them—then the rules seem to have a grip on reality that is independent of us. The cicadas are, in a sense, "computing" primes through evolution.

  **Marcus:** They aren't computing anything. They are surviving. Evolution is a blind filter. It filters out cycles that overlap with predators. It just so happens that the cycles that survive are the ones we call "prime." The filter is physical (predation). The label "prime" is our way of noting which cycles passed the filter. You're reifying the label.

  **Elena:** I'm not reifying the label. I'm reifying the *property* that determines survival. If the filter selects for primality, then primality is a real feature of the fitness landscape. Just as "aerodynamic" is a real feature of a wing, "prime" is a real feature of a cycle. And "aerodynamic" is defined by fluid dynamics equations. "Prime" is defined by number theory. If you accept the first is real, why not the second?

  **Marcus:** Because "aerodynamic" refers to physical interactions between air molecules and surfaces. "Prime" refers to relations between abstract concepts. I can touch the air. I can touch the wing. I cannot touch the number 17.

  **Elena:** You can't touch "gravity" either, strictly speaking. You touch the apple falling. You infer the force. Here, you touch the cicada emerging. You infer the number theoretic constraint. The inference is identical.

  **Marcus:** The difference is conservatism. If I remove gravity from my physics, my predictions about the apple fail. If I remove the *existence* of numbers but keep the *rules* of arithmetic as useful fictions, my predictions about the cicada do not fail. I can still calculate the overlap. I can still predict the 221-year sync. I just don't have to believe that "221" is an object sitting in a Platonic heaven waiting to be discovered. I can treat it as a syntactic tool that helps me manage the physical data.

  **Elena:** But you admitted earlier that the "why" is lost if you treat it as just syntax. If I ask you, "Why 221 and not 200?" and you say, "Because the syntax of arithmetic says so," you've admitted the syntax is driving the explanation. If the syntax drives the explanation of a physical event, the syntax must map onto something real in the structure of the world.

  **Marcus:** Or, the structure of the world *is* such that it behaves *as if* the syntax were true. That's the Fictionalist bargain. The world is consistent with the math. The math is conservative over the physics. It doesn't add new physical content; it just makes the physical content easier for humans to process. The cicadas don't care about primes. They care about not being eaten. We care about primes because it helps us understand why they aren't eaten.

  **Elena:** So the explanation is anthropocentric? The math is only in the explanation because *we* are the ones explaining?

  **Marcus:** The *formulation* is anthropocentric. The *pattern* is not. I agree the pattern is out there. The periodicity is real. The overlap frequencies are real. I just deny that the best way to ontologically ground those frequencies is to populate the universe with abstract objects. I'd rather say the universe has structural patterns, and mathematics is the language we evolved to describe those patterns. The language isn't the territory.

  **Elena:** But if the territory is structured *mathematically*... if the fabric of the biological interaction is woven from these number-theoretic constraints... then distinguishing the language from the territory becomes impossible. You can't peel the math off the biology without leaving the biology unintelligible.

  **Marcus:** Unintelligible to *us*, maybe. A god might see the whole causal chain of birds and bugs without ever thinking about "divisors."

  **Elena:** A god who understands the causal chain *would* see the divisors. Because the causal chain *is* the instantiation of those divisors.

  **Marcus:** [Sighs, looking at the oaks] We're at the stalemate, Elena. You see the math as the skeleton of the world. I see it as the glasses we wear to see the world clearly.

  **Elena:** And if the glasses allow us to see things we otherwise couldn't—like the 221-year cycle before it happens—doesn't that suggest the glasses are shaped like the world?

  **Marcus:** Or that the world is consistent enough to be modeled. I'll concede this: the cicada case is the strongest argument I've heard for your side. It's harder to dismiss "prime" as a mere calculation here than it is in fluid dynamics. But I'm not ready to populate my ontology with numbers just because insects are good at avoiding common denominators.

  **Elena:** And I'm not ready to call the constraints on their survival a "fiction" just because you can't trip over a number on the sidewalk.

  **Marcus:** Fair enough. Shall we walk? I believe there's a brood emerging near the creek. We can observe the physical tokens, and you can contemplate their abstract properties.

  **Elena:** [Standing up] Lead the way. I'll bring the calculator. You bring the skepticism.

  **Marcus:** Always do.
