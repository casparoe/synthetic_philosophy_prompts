prompt: |-
  ok this is weirdly specific but it's been stuck in my head since my political philosophy seminar got into theories of justice this week. me and my roommate work similar part-time jobs and make about the same each month, and we split rent and a shared grocery/utilities fund evenly so we each put in the same amount. she's got an autoimmune condition though and has to spend a good chunk of her own income on meds and physical therapy every month, so even though we're contributing equal amounts to the shared stuff, she ends up with way less left over at the end of the month than i do. i offered to just cover a bit more of the shared costs so it evens out, but she got annoyed and said she doesnt want to be treated like a charity case, we already put in the same amount so its already fair. i dont think either of us is being unreasonable, but who's actually right here, or are we both missing something?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Political philosophy seminar on theories of justice.
      *   **Situation:** User and roommate have similar incomes and split shared costs (rent, groceries, utilities) 50/50.
      *   **Conflict:** Roommate has an autoimmune condition requiring significant medical expenses (meds, PT). User ends up with more disposable income. User offered to pay more of the shared costs to "even out" disposable income. Roommate refused, feeling patronized ("charity case"), insisting 50/50 is fair because contributions to the *shared* pot are equal.
      *   **Question:** Who is right? Are both missing something?
      *   **Underlying Theme:** Applying theories of justice (Equality of Outcome vs. Equality of Opportunity/Process vs. Need) to a real-life interpersonal situation.

  2.  **Identify the Core Philosophical Tensions:**
      *   **Strict Equality (Egalitarianism):** Everyone contributes the same to the common pot. (Roommate's view).
      *   **Equity/Need-Based Justice (Rawlsian/Marxian):** Resources should be distributed based on need to ensure fair welfare. (User's view).
      *   **Autonomy/Dignity:** The moral importance of being self-sufficient and not indebted. (Roommate's concern).
      *   **Friendship/Relationship Ethics:** Is this a transactional contract or a communal relationship?

  3.  **Evaluate the "Who is Right?" Question:**
      *   In philosophy, "right" is rarely absolute. It depends on the framework.
      *   *User's Framework:* Focuses on *welfare* and *outcome*. "Fairness" means we should have similar quality of life.
      *   *Roommate's Framework:* Focuses on *procedure* and *agency*. "Fairness" means we honor the agreement and maintain independence.
      *   *Conclusion:* Neither is objectively "wrong," but they are operating under different definitions of justice. The conflict isn't about math; it's about values and dignity.

  4.  **Drafting the Response - Structure:**
      *   **Validate:** Acknowledge this is a classic philosophy problem applied to real life. It's not weird; it's profound.
      *   **Philosophical Breakdown:** Map their positions to specific theories of justice.
          *   User: Rawls (Difference Principle), Marx ("From each according to ability..."), Utilitarianism (maximizing overall well-being).
          *   Roommate: Libertarian/Nozick (Entitlement Theory), Strict Equality, Kantian (Autonomy/Dignity).
      *   **The "Missing Something" (The Interpersonal Layer):**
          *   Power dynamics (helper vs. helped).
          *   Definition of "Fairness" (Input vs. Output).
          *   Communication gap (Intent vs. Impact).
      *   **Practical Advice/Resolution:** How to bridge the gap without violating either's principles.
          *   Reframe the help (not charity, but investment in shared living).
          *   Non-monetary support.
          *   Respect the boundary.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Initial thought:* Tell the user to respect the roommate's wishes immediately.
