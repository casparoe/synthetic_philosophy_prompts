answer: |-
  This is not weirdly specific at all; you have accidentally stumbled into one of the most classic debates in political philosophy. You are essentially living out a seminar case study on **Distributive Justice** vs. **Relational Equality**.

  Neither of you is "wrong," but you are arguing from two different moral frameworks. Here is the breakdown of why you are clashing, mapped to the theories you're likely discussing in class, and how to resolve it.

  ### 1. The Philosophical Clash

  **Your Position: Luck Egalitarianism / Rawlsian Justice**
  You are operating under a framework of **equity** and **welfare**.
  *   **Luck Egalitarianism:** This theory suggests that inequalities resulting from "brute luck" (like being born with an autoimmune condition) should be compensated for, whereas inequalities from "option luck" (like choosing to buy a luxury car) do not need compensation. You see her medical bills as bad luck that unfairly penalizes her standard of living compared to yours.
  *   **Rawls' Difference Principle:** John Rawls argued that economic inequalities are only permissible if they benefit the least advantaged members of society. By offering to pay more, you are trying to maximize the position of the "least advantaged" person in your apartment (her).
  *   **Your definition of Fairness:** Fairness = **Equality of Outcome.** You want you both to have the same quality of life at the end of the month.

  **Her Position: Libertarian Entitlement / Procedural Justice**
  She is operating under a framework of **autonomy** and **process**.
  *   **Entitlement Theory (Nozick):** Robert Nozick argued that if resources are acquired fairly and exchanged fairly, the resulting distribution is just, regardless of how unequal it is. You both agreed to a 50/50 split. You both earn similar wages. The transaction is procedurally fair.
  *   **Kantian Dignity:** Immanuel Kant emphasized treating people as ends in themselves, not means. For many people with chronic illnesses, being "taken care of" can feel infantilizing. It shifts the power dynamic from "equals" to "caregiver/dependent." She values her status as an independent agent over the extra disposable income.
  *   **Her definition of Fairness:** Fairness = **Equality of Process.** She wants to be judged on her contribution to the shared agreement, not her biological needs.

  ### 2. What Are You Both Missing?

  You are missing the **Expressive Harm** of the transaction.

  When you offer to pay more to "even it out," you intend to signal: *"I care about your well-being."*
  However, she receives the signal: *"You are not capable of sustaining yourself like a normal adult."*

  In political philosophy, this touches on **Recognition Justice**. It's not just about the distribution of goods (money); it's about the distribution of respect. By insisting on the 50/50 split, she is asserting her dignity and refusing to let her medical condition define her social standing in the household. She is prioritizing **social equality** (we are peers) over **material equality** (we have the same cash flow).

  Furthermore, you might be missing the **slippery slope of obligation**. If she accepts this charity now, does she owe you emotional labor later? Does she lose the right to complain about how you split chores because you "pay more"? Keeping the finances strictly equal keeps the power dynamic neutral.

  ### 3. So, Who Is Right?

  In the context of a friendship/roommate arrangement: **She is right.**

  Here is why: In a state, the government *must* redistribute wealth because citizens don't have a choice but to live under that government. In a friendship, the "contract" is voluntary. Justice in friendship is not about maximizing utility; it's about mutual respect.

  If you override her refusal because *you* think it's fair, you are actually committing an injustice against her autonomy. You are deciding that your definition of fairness (material comfort) is superior to her definition of fairness (independence).

  ### 4. How to Resolve It (Without Violating Your Conscience)

  You clearly care about her, and it hurts you to know she is struggling while you are comfortable. You can honor her dignity while still supporting her, but you have to change the *currency* of support.

  1.  **Respect the Financial Boundary:** Drop the offer to pay more rent. Acknowledge her stance. Say something like, *"I respect that you want to keep things equal financially. I value our partnership as equals."* This restores her sense of dignity.
  2.  **Shift to Non-Monetary Equity:** If you have more disposable income, you likely have more mental bandwidth or energy. You can absorb more of the **labor** burden without framing it as charity.
      *   *Example:* "I know we split costs 50/50, but I've been wanting to cook more dinner anyway. Can I handle 70% of the cooking so you can rest?"
      *   *Why this works:* It's not money. It's time and effort. It acknowledges she has less energy (due to PT/illness) without highlighting her lack of funds.
  3.  **Reframe "Shared" Expenses:** If groceries are in the shared fund, ensure the fund isn't buying *your* luxuries. If you want expensive snacks or premium items, buy those separately. Ensure the shared fund is strictly for *needs*. This subtly lowers her cost of living without changing the split percentage.
  4.  **The "Emergency" Clause:** Agree that the 50/50 split holds *unless* one person is in genuine crisis (e.g., threatens eviction). This keeps her autonomy intact for normal months but provides a safety net for disasters, which aligns with Rawlsian safety without daily charity.

  ### Summary for Your Seminar
  You can tell your professor you found a real-world example of the tension between **Luck Egalitarianism** (compensating for unchosen disadvantages) and **Relational Egalitarianism** (ensuring no one stands in a relation of inferiority to another).

  Your roommate is teaching you that sometimes, being treated "fairly" means being allowed to struggle on your own terms rather than being saved on someone else's.
