      *   *Initial thought:* Suggest they calculate disposable income percentages.
      *   *Correction:* That might make the roommate feel *more* like a charity case. Better to suggest non-monetary adjustments or reframing.
      *   *Tone Check:* Keep it empathetic, academic but accessible, and non-judgmental.

  6.  **Developing the Philosophical Connections:**
      *   *User:* Sounds like **Luck Egalitarianism**. The roommate's illness is "bad luck," so society (or you) should compensate. Also **Rawls**: Inequalities are only okay if they benefit the least advantaged.
      *   *Roommate:* Sounds like **Procedural Justice**. If the rules are followed (50/50 split), the outcome is just. Also **Kantian**: Treating her as an end, not a means. Charity can be demeaning.

  7.  **Addressing the "Who is Right?"**
      *   It's a clash of *Distributive Justice* (User) vs. *Relational Justice* (Roommate).
      *   The User is prioritizing *material equity*.
