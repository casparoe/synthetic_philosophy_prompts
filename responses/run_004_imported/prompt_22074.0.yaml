prompt: |-
  Okay, this is going to sound like a weird rabbit hole but bear with me. I've been seeing someone for about two months now who's a few years into a philosophy PhD (philosophy of language, mostly), and last week she mentioned, pretty casually, that Russell's essay "On Denoting" is basically the founding document of her whole subfield and that I should just read it since its only about ten pages. So, in what has to be the world's least sexy attempt to impress someone new, I did. It's from 1905, apparently the paper that kicked off analytic philosophy of language, or so she claims. The King of France bit and the Scott/Waverley business were honestly kind of fun, like working out a logic puzzle. But then I hit the paragraph everyone apparently calls "the Gray's Elegy argument" and completely lost the thread. When I admitted that to her she just laughed and said half her cohort still fights about what that paragraph is even doing, which did not exactly fill me with confidence.

  Here's the bit I'm stuck on, and I'm quoting it directly, not paraphrasing:

  "The relation of the meaning to the denotation involves certain rather curious difficulties, which seem in themselves sufficient to prove that the theory which leads to such difficulties must be wrong.

  When we wish to speak about the meaning of a denoting phrase, as opposed to its denotation, the natural mode of doing so is by inverted commas. Thus we say: The center of mass of the solar system is a point, not a denoting complex; 'The center of mass of the solar system' is a denoting complex, not a point. Or again, The first line of Gray's Elegy states a proposition. 'The first line of Gray's Elegy' does not state a proposition. Thus taking any denoting phrase, say C, we wish to consider the relation between C and 'C', where the difference of the two is of the kind exemplified in the above two instances.

  We say, to begin with, that when C occurs it is the denotation that we are speaking about; but when 'C' occurs, it is the meaning. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases. This happens as follows.

  The one phrase C was to have both meaning and denotation. But if we speak of 'the meaning of C', that gives us the meaning (if any) of the denotation. 'The meaning of the first line of Gray's Elegy' is the same as 'The meaning of "The curfew tolls the knell of parting day",' and is not the same as 'The meaning of "the first line of Gray's Elegy".' Thus in order to get the meaning we want, we must speak not of 'the meaning of C', but 'the meaning of "C",' which is the same as 'C' by itself.

  Similarly 'the denotation of C' does not mean the denotation we want, but means something which, if it denotes at all, denotes what is denoted by the denotation we want. For example, let 'C' be 'the denoting complex occurring in the second of the above instances'. Then C = 'the first line of Gray's Elegy', and the denotation of C = The curfew tolls the knell of parting day. But what we meant to have as the denotation was 'the first line of Gray's Elegy'. Thus we have failed to get what we wanted.

  The difficulty in speaking of the meaning of a denoting complex may be stated thus: the moment we put the complex in a proposition, the proposition is about the denotation; and if we make a proposition in which the subject is 'the meaning of C', then the subject is the meaning (if any) of the denotation, which was not intended. This leads us to say that, when we distinguish meaning and denotation, we must be dealing with the meaning: the meaning has denotation and is a complex, and there is not something other than the meaning, which can be called the complex, and be said to have both meaning and denotation. The right phrase, on the view in question, is that some meanings have denotations."

  I can follow basically every individual sentence there, but I can't hold the whole move in my head at once. What is C versus 'C' actually tracking here — is it just a fancy notational way of saying "the thing" versus "the phrase for the thing," or is something deeper about reference going on? And why does trying to talk about "the meaning of C" apparently always misfire and hand you back the meaning of the denotation instead of the meaning you actually wanted? Most of all, I don't get why Russell treats this as basically fatal to the whole idea of denoting phrases having "meaning" and "denotation" as two separate sides (which was his own earlier view, and Frege's), rather than just an annoying side-effect of using quotation marks in English. Could you walk me through his own example step by step, in plain terms, so I actually understand what's supposed to go wrong and why? I've got dinner with her and two of her philosophy friends this Friday and would really like to not be completely lost if this comes up again.
