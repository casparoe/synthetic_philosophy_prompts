      *   Verdict on formal support? Yes.
      *   Address Pre-rationality? Yes.
      *   Justify verdict? Yes.

  *(Self-Correction during drafting)*: I should make sure to distinguish between "descriptive" (humans *do* have common priors) and "normative" (humans *should* act as if they do). AAT is descriptive/conditional. EWV is normative. Hanson tries to bridge this. I need to be clear that AAT itself doesn't bridge it.

