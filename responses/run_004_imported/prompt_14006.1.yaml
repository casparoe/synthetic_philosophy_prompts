      *   **The Friend's Objection:** A philosophy PhD candidate argues this is a category error. AAT is about idealized Bayesian agents with specific constraints (common priors, common knowledge), while EWV is normative advice for messy humans. The gap is too wide to treat AAT as a *proof* of EWV.
      *   **Specific Questions:**
