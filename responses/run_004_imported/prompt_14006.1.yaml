      *   **Peer Disagreement (Epistemology):**
          *   Context: You and I are "peers" (equal intelligence, evidence, reliability). We disagree on $P$. What should I do?
          *   Views: Conciliationism (Equal Weight View - Elga, Christensen) vs. Steadfastness (Kelly, etc.).
          *   EWV: Give equal weight to my view and yours. Split the difference.
      *   **The Connection:** Rationalists often say "Aumann says we must agree, so if we don't, one of us is irrational, so I should move toward you." Philosophers say "Aumann assumes things humans don't have, so it doesn't dictate human norms."
      *   **Hanson's Pre-rationality:** The idea that we should choose priors as if we came from a common source before we knew who we were. It tries to justify CPA normatively rather than descriptively.

