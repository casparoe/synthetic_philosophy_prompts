      *   *Section 2: Williamson's Hammer.* Explain the Margin for Error (MFE) principle. Explain why it applies to knowledge (knowledge is factive and depends on environment, which can vary slightly without detection). Conclude that Williamson explicitly targets KK.
      *   *Section 3: Can KK Survive?* Explore the resistance.
          *   *Internalist pushback:* If knowledge is internally grounded, maybe MFE doesn't apply. (But Williamson says knowledge is world-involving).
          *   *Idealization:* KK holds for ideal agents, not humans.
          *   *Restriction:* KK holds for a priori/math, but not empirical.
          *   *Verdict:* For non-ideal, empirical knowledge, Williamson sinks it.
      *   *Section 4: The Rationalist Bonus.* Connect to calibration.
