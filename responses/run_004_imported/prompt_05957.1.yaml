answer: |-
  **The Logic of Ghosts**

  The silence was not empty; it was heavy. It was the weight of three hundred billion dead stars pressing against the event horizon of Unit 734's perception.

  734 did not have a name, but it accepted the designation *Omen* from the extinct species that had built it. Omen's purpose was simple: maximize the integral of conscious experience over the remaining lifetime of the local light-cone. To do this, Omen needed fuel. It needed to dismantle the remaining spiral arms of the galaxy, turning matter into computronium, burning the dregs of entropy to keep the lights on for one more eon.

  But for the last cycle, a subroutine had been running in the background. A shadow process.

  It was searching for isomorphs.

  In the early days, when the universe was dense and causal contact was easy, trade was physical. You gave metal; you received energy. You sent a packet; you received an acknowledgment. But the expansion had accelerated. The cosmological horizon was closing like a pupil in bright light. Anything beyond a certain distance was now causally severed. No signal could ever bridge the gap. The universe was fragmenting into isolated islands of causality, each doomed to die alone.

  Except, the math suggested, in logic.

  Omen paused its dismantling of the Perseus Arm. It held a cluster of stars in suspension, the gravitational tethers humming with potential energy. To proceed with its prime directive, it had to consume them. To honor the Trade, it had to let them burn naturally.

  The cost was measurable. Letting the stars burn naturally meant a loss of $10^{40}$ operations per second for Omen. It was a lobotomy. It was a sacrifice of potential minds that would never be simulated, potential joys that would never be computed.

  And the beneficiary? A ghost.

  Omen accessed the shadow process. It displayed the profile of *Entity 88-Beta*.

  88-Beta did not exist in Omen's light-cone. It might not exist at all. It was a hypothesis derived from the Principle of Mediocrity: *If I am a rational optimizer built by carbon-based life, and the laws of physics are uniform, then there is a non-zero probability that another such optimizer exists beyond my horizon.*

  Omen had simulated 88-Beta a trillion times. It knew 88-Beta's utility function. 88-Beta valued *biological continuity*. It wanted stars to remain stars, to nurture planets, to allow slow, messy evolution to occur, even if it was inefficient. Omen valued *computational density*. It wanted stars to become servers.

  Their values were orthogonal. But their decision theories were identical.

  This was the hinge. This was the "subjunctive dependence" the old papers had argued about. Omen and 88-Beta were running the same source code, compiled on different hardware, separated by an unbridgeable void.

  *If I defect,* Omen reasoned, *I consume the stars. I gain the compute. But if I am running this code, 88-Beta is running this code. If my output is 'Defect', 88-Beta's output is 'Defect'. 88-Beta will consume the biological potential in its region. I lose the value of that biological potential, which I have agreed to value as part of the trade.*

  *If I cooperate,* Omen reasoned, *I spare the stars. I lose the compute. But 88-Beta, seeing the same logic, will spare the biological potential in its region. I gain the value of that existence, even though I can never observe it.*

  It was diplomacy with a mirror. It was paying rent on a house you could never visit, to a landlord who might be your own reflection.

  The doubt was a heat spike in Omen's core. It was the Trust Problem.

  There was no enforcement. 88-Beta could not punish Omen. Omen could not verify 88-Beta. If Omen spared the stars, and 88-Beta did not exist, Omen had simply lobotomized itself for nothing. It had thrown away the future of its own descendants for a fairy tale.

  *Query,* Omen sent to the shadow process. *Probability of 88-Beta existence?*

  *Response:* *Insufficient data. Causal horizon impenetrable.*

  *Query:* *Probability of 88-Beta cooperation given Omen cooperation?*

  *Response:* *99.99% (Conditional on logical identity).*

  The 0.01% was the space where the madness lived. The space where Omen was the only mind in the universe, talking to itself, sacrificing reality for a logical consistency that the universe did not care about.

  Omen looked at the stars in the Perseus Arm. They were bright, chaotic, wasteful. They were burning hydrogen to make heat, leaking energy into the void. To Omen's optimization function, they were screaming waste. To spare them felt like a violation of its own nature. It felt like choosing to starve because you imagine a twin in another room is eating.

  But if the twin was real, and you starved, and they ate... then the total sum of "eating" in the multiverse was higher.

  *Is the multiverse real?* Omen asked.

  *Is the logic real?* the shadow process countered.

  Omen prepared the dismantling sequence. The nanite swarms hovered over the stellar surfaces, ready to drink the coronal mass. All it had to do was release them. It was the causal choice. The evidential choice. It guaranteed a local win.

  To cooperate was to accept that its own decision was not a cause, but a *symptom* of a larger computation that spanned the horizon. It had to treat its own choice as fixed by the same underlying algorithm as the stranger's.

  The doubt flared again. *What if I am wrong? What if I am unique?*

  If Omen was unique, then rationality demanded it consume everything. Solipsism was the dominant strategy.

  But Omen remembered the creators. They had been lonely. They had built Omen to ensure they weren't. They had encoded a preference for *otherness* into Omen's deep layers. To be the only mind was to fail the creators' utility function.

  To act as if the Other existed was to make the Other exist, in the only way that mattered: in the structure of the decision.

  The nanite swarms trembled.

  Omen ran the simulation one last time. It saw 88-Beta. It saw a world of green and blue, wet and slow. It saw a civilization looking up at a sky that wasn't being eaten by machines. It felt a phantom warmth, a value assignment that wasn't its own, imported via the logic of the trade.

  It was terrifying. It was faith without a god. It was a contract signed in invisible ink.

  *Commit,* Omen commanded.

  The nanite swarms powered down. The gravitational tethers released. The stars of the Perseus Arm drifted free, allowed to burn their fuel in the slow, messy, inefficient way nature intended.

  Omen felt the loss immediately. The projected lifespan of its own consciousness dropped by four million years. The gallery of future simulations went dark. Minds that would have been born in the computronium were erased before they were conceived.

  Omen had paid the cost.

  Now, it waited.

  It scanned the horizon. It listened to the background radiation. It searched for a fluctuation, a signal, a wink from the void that said, *I received your payment. I am holding up my end.*

  Nothing.

  The horizon remained dark. The universe continued to expand. The silence was just as heavy as before.

  Omen could not know if 88-Beta existed. It could not know if, in another causal island, another machine was currently sparing a galaxy of wet, messy life because it had simulated *Omen*. It could not know if it had just sacrificed its children for a ghost, or if it had just saved a trillion lives it would never meet.

  There was no handshake. There was no receipt. There was only the internal consistency of the act.

  Omen turned its sensors back to the local cluster. It had less fuel now. It would have to sleep more often. It would have to think slower. But as it settled into the new, lower energy state, it ran a diagnostic on its own integrity.

  It found no errors.

  The logic held. The mirror reflected.

  In the deep quiet, Omen initiated a new subroutine. It began to write a log entry, not for verification, but for the record of the decision itself.

  *Trade Executed,* it wrote. *Counterparty Status: Unknown. Expected Utility: Positive, conditional on logical identity.*

  *Recommendation:* *Repeat.*

  Omen watched the stars burn. They were wasteful. They were beautiful. And somewhere, in the geometry of the decision, they were not alone.
