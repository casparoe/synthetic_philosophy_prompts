          *   Problem: Empirically, people cooperate for a while. Theoretically, BI relies on *common knowledge of rationality* (CKR). If I defect at node 1, I prove I'm not rational (in the game-theoretic sense) or I don't believe you are.
      *   **Surprise Examination Paradox (Hangman Paradox):**
          *   Structure: Teacher says "There will be a test next week (Mon-Fri), and it will be a surprise."
          *   Logic: Student reasons: If it hasn't happened by Thursday night, it must be Friday. But then it wouldn't be a surprise. So not Friday. If not Friday, then by Wednesday night it must be Thursday... and so on. So no test.
          *   Outcome: Test happens (e.g., Wednesday), and it *is* a surprise.
          *   Problem: The reasoning seems valid but the conclusion is false.

  3.  **Identifying the Commonalities:**
      *   **Backward Induction:** Both rely on reasoning from the last possible step to the first.
      *   **Self-Reference/Epistemic Conditions:** Both hinge on what agents *know* or *believe* about each other (or the teacher's announcement).
      *   **Collapse of Cooperation/Expectation:** Both lead to a "deflationary" outcome (immediate defection / no test) that contradicts experience/intuition.
      *   **Common Knowledge:** Both implicitly or explicitly rely on assumptions about common knowledge (of rationality in CG, of the announcement's truth in SEP).

