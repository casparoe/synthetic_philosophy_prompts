answer: |-
  **Setting:** *A quiet corner of a university café, late afternoon. Two philosophers, ELENA (defending a counterfactual/dependence view) and MARCUS (defending a Process/Conserved Quantity view), are finishing a pot of coffee. The conversation has been running hot for an hour.*

  **MARCUS:** Let's stick to the Night Nurse case. It's cleaner than the gardener. Patient Mr. Jones dies of cardiac arrest. Nurse Alice was on duty, responsible for administering a beta-blocker at 8:00 PM. She got distracted, didn't administer it. Jones dies. You say Alice's *omission* caused the death. I say that is literally impossible.

  **ELENA:** Impossible?

  **MARCUS:** Ontologically impossible. Look at the spacetime region containing Alice and the region containing Jones between 8:00 and 8:15. Is there a continuous process connecting them? No. Is there a transfer of a conserved quantity—energy, momentum, charge—from Alice's "not-injecting" to Jones's heart? No. Because "not-injecting" is nothing. It's an absence. You're claiming that *nothing* pushed *something* over the edge. That's magic.

  **ELENA:** It's not magic, Marcus, it's dependency. If Alice had injected the drug, Jones would have lived. The truth of that counterfactual is grounded in the physiological facts of Jones's body and the pharmacological facts of the drug. The cause is the difference-maker. In every relevant sense of the word "cause"—legal, medical, explanatory—Alice's failure is the cause. To deny it is to sever the link between causation and explanation.

  **MARCUS:** I'm not denying it's *explanatorily relevant*. I'm denying it's *causation*. Causation is a physical relation. Explanation is a pragmatic one. We can explain the death by citing Alice's omission without committing to the metaphysical absurdity that an absence exerts a force. But here is where your view collapses: The Queen of England.

  **ELENA:** Here we go.

  **MARCUS:** On your view, the Queen of England also caused Jones's death. She didn't inject him. If she *had* injected him, he would have lived. The counterfactual dependence holds. So, is the Queen a cause?

  **ELENA:** No. And I don't need a physical process to tell you why. We filter counterfactuals through norms and expectations. Alice was *supposed* to inject him. The Queen was not. Causation isn't just about raw counterfactual dependence; it's about dependence relative to a background of normal conditions.

  **MARCUS:** Aha! So you're smuggling in normativity. You're admitting that "cause" isn't a feature of the physical world, but a feature of our social contracts.

  **ELENA:** I'm admitting that causation is a relation that exists within a system of agents. But let's turn this back on you. How do *you* distinguish Alice from the Queen without using counterfactuals? You can't point to a physical process from Alice to Jones either, because she didn't move! There is no process from the omission. So what physical property does Alice have that the Queen lacks?

  **MARCUS:** It's not about the omission. It's about the *opportunity for process*. Alice was positioned such that she *could* have initiated a physical process (the injection) that would have intersected with Jones's physiological processes. The Queen was not. The physical setup of the hospital placed Alice in a causal field where her actions could propagate to Jones. The Queen was outside that light cone of practical influence.

  **ELENA:** "Could have initiated." That's a modal claim, Marcus. That's a counterfactual! You're saying, "If Alice had moved her arm, a process would have started." You are relying on the very counterfactual machinery you claim to reject to solve the Queen objection.

  **MARCUS:** Not necessarily. I can describe the "opportunity" in terms of physical proximity and capacity. Alice had the drug in her hand, the syringe was loaded, the neural pathways were primed. The potential energy was localized. The Queen lacked the localized physical capacity. I can describe that in categorical, non-modal terms if I have to. But let's grant the modal point. Even if I use a counterfactual to define the *scope* of the agent, I still maintain that the *causal link itself* requires a process. Since there is no process in the omission case, there is no causation. I call it "quasi-causation."

  **ELENA:** And there is the bullet I want you to bite. "Quasi-causation." You admit that for all practical purposes—for the coroner, for the court, for the grieving family—the relation between Alice's omission and the death functions exactly like causation. It supports prediction, it supports explanation, it supports moral responsibility. But you say it isn't *real* causation because it lacks the physical glue. Why? What work is the "physical glue" doing here other than satisfying a metaphysical aesthetic?

  **MARCUS:** It prevents the collapse of physics into psychology! If you allow absences to be causes, you allow causation to be everywhere. The absence of a meteorite striking the hospital caused Jones to live. The absence of a power failure caused the monitor to work. If absences are causes, the world is a bloated web of infinite causal connections. My theory keeps causation sparse. It tracks the actual flow of energy in the universe.

  **ELENA:** But the universe doesn't care about energy flow when it comes to human survival. If I hold my breath, I die. The cause of my death is the omission of oxygen. If your theory says, "Well, there's no process from the 'not-breathing' to the cell death, so it's only quasi-causation," you are rendering your theory useless for the special sciences. Biology and medicine are *full* of negative feedback loops, missing inhibitors, and failed triggers. Are you going to tell a biologist that half their causal claims are false?

  **MARCUS:** I'm telling them they are speaking loosely. And look, I can handle the biology. When you fail to breathe, there *is* a process: the chemical cascade of hypoxia. That process is caused by the last breath you *did* take, or rather, the cessation of the oxygen transport process. I can redescribe omission cases as the termination of a prior process.

  **ELENA:** That's a dodge. The termination is an event, sure. But the *cause* of the death is the continued absence of oxygen over time, not just the moment the flow stopped. And you still haven't answered the charge that "quasi-causation" is just counterfactual dependence in a costume. If quasi-causation supports the same inferences as real causation, Occam's Razor suggests we should just call it causation. You're positing two relations—Causation and Quasi-Causation—where one (Counterfactual Dependence) does all the work.

  **MARCUS:** Occam's Razor cuts both ways, Elena. You are positing that "nothing" can be a "something." You are reifying absences. That is a heavier ontological cost than my distinction between causation and quasi-causation. I keep the physical world clean. You make the metaphysical world spooky.

  **ELENA:** It's only spooky if you insist causation must be a physical push. I'm suggesting causation is a structural relation in the fabric of events, not just a handoff of energy. But let's press your "opportunity for process" defense again. You said Alice was positioned to start a process. Suppose Alice is paralyzed. She can't move. She omits to inject. Jones dies. On your view, is she a cause?

  **MARCUS:** If she is physically incapable of moving, then she couldn't have initiated the process. So, no. She is not a cause, even quasi.

  **ELENA:** But legally and morally, if she was the assigned nurse and didn't signal for help, she might still be responsible.

  **MARCUS:** Then the responsibility lies in her failure to signal—a positive action (or omission of signaling) that *could* have initiated a different process. But the failure to inject itself? No process, no cause.

  **ELENA:** This is where your theory diverges from intuition so sharply it breaks. If the only difference between a cause and a non-cause is the presence of a physical capacity that wasn't used, you are making causation depend on hidden powers rather than actual dependencies.
  Here is my bullet, Marcus, and I'll bite it openly: I accept that causation is partly normative. I accept that the Queen is not a cause not because of physics, but because she stands outside the normative system of the hospital. Causation isn't just "out there" in the atoms. It's a relation that emerges when you have agents, expectations, and systems.

  **MARCUS:** And there it is. You save the intuition by sacrificing the objectivity. You make causation mind-dependent.

  **ELENA:** I make it *agent*-dependent. Which it is! We are talking about why things happen in a world inhabited by us. If you want a theory of causation that ignores omissions, you have a theory of *physics*, not a theory of *causation*.

  **MARCUS:** And if you have a theory of causation that allows the Queen to be a potential cause unless filtered by social norms, you have a theory of *blame*, not *causation*.
  I'll bite my bullet too: Yes, my theory implies that in a world without agents, there are no omissions, and thus no causation by omission. That is correct. In a purely physical world, the plant dies because of evaporation and cellular collapse, full stop. The "gardener" only enters the picture when you introduce a viewer with expectations. I am happy to say that the "causation" in omission cases is a projection of that viewer onto a physical substrate that only contains positive processes.

  **ELENA:** So we agree on the physics. We disagree on whether "causation" is the name of the physics, or the name of the map we use to navigate it.

  **MARCUS:** I say the map should match the territory. If the territory has no process, the map shouldn't draw a line.

  **ELENA:** I say if the map doesn't draw a line, we walk off the cliff.

  *(They sit in silence for a moment, the espresso machine hissing in the background—a positive process producing steam, or the absence of silence? Neither comments on it.)*
