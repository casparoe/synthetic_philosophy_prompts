prompt: |-
  I'm a backend engineer, and last month I was on call during a major production outage. Our postmortem has turned into a drawn-out argument about who's actually responsible. I didn't restart a degraded service for almost forty minutes because I was absorbed in an unrelated ticket and missed the page, and I'm now getting most of the blame. But you could just as easily point to whoever built that service years ago without a retry mechanism, to the infrastructure team that never set up alerting to escalate to a backup when the primary doesn't respond, or to management, which has kept our on-call rotation understaffed despite repeated requests to expand it. Everyone agrees my inaction made things worse, but it bothers me that we're pinning so much on what I failed to do, when several earlier decisions, had they gone differently, would also have prevented the whole incident. Is there a principled way to say my omission counts as more of a cause than those other ones, or am I just the easiest person to hold accountable?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Role:** Backend Engineer.
      *   **Event:** Major production outage last month.
      *   **Current State:** Postmortem turned into a blame game.
      *   **User's Action/Inaction:** Missed a page for 40 minutes because they were focused on an unrelated ticket. Did not restart a degraded service.
      *   **Blame Allocation:** User is getting "most of the blame."
      *   **User's Argument:** Other factors contributed (service design lacking retries, infra lacking escalation alerting, management understaffing on-call). These earlier decisions could have prevented the incident or mitigated the impact.
      *   **Core Question:** Is there a *principled* way to argue that my omission counts as *more* of a cause than the others? Or am I just the scapegoat?

  2.  **Initial Assessment & Empathy:**
      *   This is a classic "Blameless Postmortem" failure. The culture seems toxic or at least immature regarding incident management.
      *   The user feels unfairly targeted.
      *   The user is asking for a philosophical/principled justification for their level of blame, but the underlying need is likely: "How do I navigate this politically?" and "Is my intuition about systemic vs. individual error correct?"
      *   *Truth:* In modern SRE/DevOps philosophy, the user is *not* the root cause. The system allowed a single point of failure (the human). However, in traditional management hierarchies, the human is often the easiest lever to pull.

  3.  **Deconstruct the "Cause" Argument (Principled Analysis):**
      *   *Proximate Cause vs. Root Cause:* The user's inaction is the *proximate* cause of the *duration* of the outage. The other factors are *root* causes of the *occurrence* and *severity* vulnerability.
      *   *The "Swiss Cheese Model" (Reason):* Accidents happen when holes in multiple layers of defense align. The user is one slice of cheese. The design, alerting, and staffing are other slices. Focusing on one slice ignores the rest.
      *   *Human Error as a Symptom:* In safety science (Sidney Dekker, etc.), human error is usually a symptom of deeper systemic issues. Why was the engineer distracted? Why was there no backup? Why was the page missable?
      *   *Recovery vs. Prevention:* The user failed at *recovery*. The others failed at *prevention* and *resilience*. Both are critical.
      *   *The "40 Minutes" Factor:* 40 minutes is a long time to miss a page. This is a weak point in the user's defense, *unless* the alerting system was known to be noisy or the on-call load was known to be unsustainable.

  4.  **Formulate the Advice:**
      *   **Validate:** Acknowledge that their feeling is correct according to modern engineering best practices (Blameless Postmortems).
      *   **Reframe:** Shift from "Who is to blame?" to "What allowed this to happen?"
      *   **Address the "Principled Way":** Explain *why* focusing on the individual is less useful than focusing on the system, but also acknowledge where the individual responsibility lies (professional duty).
      *   **Actionable Steps:** How to handle the meeting/conversation without sounding defensive.
      *   **Career Advice:** If the culture is truly toxic, is this the right place?

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Validate the frustration. State clearly: In modern SRE culture, you are not the root cause.
      *   *The Principled Argument (Safety Science):* Introduce the "Swiss Cheese Model" and the concept of "Human Error as a Symptom." Explain that focusing on the person fixes nothing for next time (you can't fix humans, you fix processes).
      *   *Distinguishing Types of Causality:*
          *   *Trigger:* The bug/outage start.
          *   *Amplifier:* Lack of retries/alerts (Systemic).
          *   *Delay:* Missing the page (Human/Process).
          *   *Argument:* The delay made it worse, but the system *allowed* the delay to be catastrophic. A robust system survives a missed page.
      *   *The "Easiest Person" Reality:* Acknowledge the political reality. Management loves simple narratives. "Bob messed up" is easier than "We need to hire 3 people and refactor the service."
      *   *How to Respond (Scripting):* Give the user language to use. "I accept responsibility for missing the page, but to prevent recurrence, we need to address..."
      *   *Self-Reflection:* 40 minutes is long. Was the pager broken? Was the ticket work prioritized over on-call? (Context matters).
      *   *Conclusion:* Summary of the stance.

  6.  **Refining the Tone:**
      *   Needs to be supportive but objective.
      *   Avoid telling them to "fight harder" if it risks their job, but empower them with the right vocabulary.
      *   Emphasize *learning* over *blame*.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, 40 minutes is really long.* I need to make sure I don't let the user off the hook entirely. Missing a page for 40 minutes is a performance issue *if* the on-call expectations were clear and manageable. I need to balance the systemic argument with professional accountability.
      *   *Correction:* Acknowledge that missing the page is a failure of *process adherence* or *capacity*, but the *severity* of the outage is a failure of *system design*.
      *   *Key Distinction:* Blame for the *outage* vs. Blame for the *MTTR (Mean Time To Recovery)*.

  8.  **Final Polish:** Organize into clear headings. Use industry-standard terms (MTTR, Blameless Postmortem, Swiss Cheese Model). Ensure the advice is practical for a meeting setting. (This aligns with the structure of the final output).

  9.  *(Self-Correction during drafting)*: Make sure to explicitly answer the question: "Is there a principled way to say my omission counts as more of a cause... or am I just the easiest person?"
      *   *Answer:* Principled way? No, actually the opposite is true. Systemic factors are usually weighted higher in safety science. You are likely the easiest person. I need to tell them this gently.

  10. **Final Review against Safety:** Does this encourage negligence? No, it encourages systemic improvement while acknowledging professional duty.

