answer: |-
  This is a painful situation, and your frustration is well-founded. You are experiencing the collision between **modern Site Reliability Engineering (SRE) philosophy** and **traditional management accountability.**

  To answer your specific question directly: **No, there is no principled way to argue that your omission is *more* of a cause than the systemic failures.** In fact, safety science and modern incident management philosophy argue the exact opposite.

  However, there is a *political* reason why you are being blamed, and there is a *principled* way to navigate the conversation so you protect your reputation while pushing for the right outcome.

  Here is the breakdown of why this is happening, the theory behind it, and how to handle it.

  ### 1. The Principled View: You Are a Symptom, Not the Cause
  In high-reliability organizations (like aviation, nuclear, and top-tier tech), the consensus is that **human error is inevitable.** Therefore, systems must be designed to tolerate human error.

  *   **The Swiss Cheese Model:** Imagine slices of Swiss cheese stacked together. Each slice is a defense layer (code quality, retry logic, alerting, on-call staffing). The holes are weaknesses. An accident only happens when the holes in all slices align. You are one slice. The missing retry logic is another. The lack of escalation is another. Focusing only on your slice ignores the holes in the others that allowed the incident to become catastrophic.
  *   **The "Second Victim":** In safety science, the operator who makes the mistake during a crisis is often called the "second victim." The first victim is the system/user. Punishing the second victim discourages reporting and hides the real systemic rot.
  *   **Resilience Engineering:** A robust system should not rely on a human restarting a service within 40 minutes to prevent major damage. If a 40-minute delay turns a "glitch" into a "major outage," the system is fragile, regardless of who was on call.

  **The Verdict:** Principally, you are not the root cause. You are the *proximate* cause of the *duration* (MTTR), but the other factors are the root causes of the *severity* and *vulnerability*.

  ### 2. The Political Reality: Why You Are the Target
  If the theory says you aren't the main cause, why is the blame landing on you?

  *   **Agency vs. Structure:** It is easy to change a person (reprimand, fire, train) and hard to change a structure (refactor legacy code, hire more staff, change org chart). Management often gravitates toward the solution that feels most actionable, even if it's less effective.
  *   **The "40 Minutes" Optic:** Objectively, missing a page for 40 minutes is a long time. It is a clear, discrete failure of duty. The other failures (technical debt, staffing levels) are abstract, long-term issues. It is easier to point to a clock than a culture.
  *   **Liability:** If management admits the outage was caused by understaffing or technical debt, they admit *their* strategic failures. If they admit it was caused by you missing a page, it remains an operational error.

  **The Verdict:** You are likely the easiest person to hold accountable because your failure is individual and immediate, whereas the others are collective and historical.

  ### 3. How to Frame This in the Postmortem
  You need to walk a tightrope. If you deny responsibility, you look defensive and unprofessional. If you accept all the blame, you validate a broken process and set yourself up for future punishment.

  **Do not argue about "who is more to blame."** Argue about **"how to prevent recurrence."**

  Here is a principled framework to use in the discussion:

  #### A. Own the Specific, Pivot to the System
  Acknowledge your specific failure without accepting the narrative that it was the *only* failure.
  > *"I want to be clear: I missed the page for 40 minutes. That is on me, and I am taking steps to ensure my alerting setup and focus management prevent that from happening again. However, if we only fix my behavior, we are assuming the next on-call engineer will never miss a page. We need to build a system that survives that."*

  #### B. Distinguish Prevention from Mitigation
  Separate the *outage* from the *duration*.
  > *"My delay impacted the recovery time (MTTR). But the lack of retry logic and escalation policies impacted the system's ability to self-heal. We need action items for both. If we fix the staffing/alerting, a missed page becomes a 5-minute blip instead of a 40-minute outage."*

  #### C. Use the "Blameless" Standard
  If your company claims to do "Blameless Postmortems," hold them to it.
  > *"Our goal here is a blameless postmortem. Blameless doesn't mean consequence-free, but it means we focus on the 'how' and 'why' rather than the 'who.' If we attribute this primarily to human error, we miss the opportunity to fix the process that allowed human error to take down production."*

  #### D. The "Bus Factor" Argument
  > *"Currently, our service availability is tightly coupled to a single human responding within a specific timeframe. That is a single point of failure. We need to decouple service health from human reaction time."*

  ### 4. A Hard Look at the 40 Minutes
  While the systemic argument is strong, you must also protect yourself professionally. Missing a page for 40 minutes is significant. To maintain credibility, you need to explain *why* without making excuses.

  *   **Was the pager broken?** (Systemic)
  *   **Were you overloaded?** (Management/Staffing)
  *   **Were you working on a ticket management told you was urgent?** (Prioritization conflict)

  If you were working on an unrelated ticket because **management prioritized feature work over on-call readiness**, that is a critical data point.
  > *"I was engaged in [Ticket X] which was prioritized by leadership. In the future, we need a clear protocol for when on-call duties conflict with sprint goals. I cannot be expected to monitor alerts with 100% focus while also delivering deep-work tickets."*

  ### 5. Summary Advice
  1.  **Don't fight the "You messed up" narrative.** Admit you missed the page. It happened. Owning it disarms the attackers.
  2.  **Fight the "Only you messed up" narrative.** Gently but firmly insist that the action items list includes the retry mechanism, the escalation policy, and the staffing review. If the postmortem document only lists "Engineer to be more careful," refuse to sign off on it as complete.
  3.  **Update your resume.** This is the hardest pill to swallow. A culture that turns a postmortem into a witch hunt is a culture that will not support you when the next inevitable outage happens. High-performing engineering organizations know that **you cannot patch culture with a performance improvement plan.**

  **The Principled Conclusion:**
  Your omission was a **trigger** for extended downtime, but the **cause** of the disaster was a system that allowed a single human omission to result in catastrophic failure. You are being blamed because it is cheap to blame you and expensive to fix the system. Stand your ground on the systemic fixes, own your specific piece, and evaluate if this is a team where you can grow.
