answer: |-
  **Title:** The Purity of the Third Realm: Frege's Diary and the Political Temperament of Anti-Psychologism

  **Introduction**

  The discovery of Gottlob Frege's 1924 diary, with its virulent antisemitism and rejection of Weimar democracy, presents a stark dissonance for the historian of analytic philosophy. For decades, Frege has been enshrined as the progenitor of a tradition defined by its rigor, its commitment to objective truth, and its liberation of logic from the vagaries of human psychology. Michael Dummett, who did more than any other philosopher to secure Frege's centrality in the twentieth century, admitted to being deeply shaken by the diary's contents. The philosophical challenge posed by this biographical data is not merely ethical but structural. It forces us to ask whether the diary bears on the philosophical assessment of Frege's work. To answer this, we must be explicit about the sense in which "bears on" is employed. If the question concerns the *validity* of Frege's formal results in the *Begriffsschrift* or *Grundgesetze*, the answer is trivially negative: the truth of modus ponens is indifferent to the moral character of the logician. However, if "bears on" refers to the *ambitions* of his philosophical project, the normative force of his anti-psychologism, and the motivation for positing a "third realm" of objective thoughts, the diary becomes critically relevant. This essay argues that while the diary does not invalidate Frege's logical theorems, it fundamentally complicates the assessment of his philosophical project. The universalism of Frege's anti-psychologism is not merely orthogonal to the particularism of his diary; rather, the rigid purity of the third realm appears as a philosophical reaction-formation against the political and cultural pluralism he despised. The verdict is that the diary reveals Frege's logic not as a neutral discovery of eternal structures, but as a normative fortress built to exclude the very "psychological" and "political" contamination he feared in the Weimar Republic.

  **The Validity of Formal Results vs. The Ambition of the Project**

  It is essential to begin by conceding the point on which the "separate the art from the artist" defense is strongest: the validity of formal results. Frege's logicism rests on derivations and definitions that are subject to public verification. The inconsistency of Basic Law V, discovered by Russell, is a mathematical fact independent of Frege's political views. A proof remains valid regardless of the prover's hatred. To argue otherwise would be to commit the genetic fallacy, confusing the context of discovery with the context of justification. If we assess Frege solely as a technician of notation and derivation, the diary is irrelevant noise.

  However, graduate-level assessment of Frege cannot stop at technical validity. Frege's project was not merely to construct a calculus but to articulate the *foundations* of arithmetic and the nature of *thought* itself. His anti-psychologism was a polemical stance against the prevailing view that logic was a branch of empirical psychology. Frege argued that thoughts are not mental ideas owned by individuals but objective entities in a "third realm," accessible to all rational beings. This claim carries a normative weight: it dictates how philosophy *ought* to be done. It asserts that truth is independent of culture, nation, or individual psyche. When we assess this *ambition*, the biographical context becomes pertinent. If the drive to posit a realm completely severed from human practice stems from a pathological fear of human diversity, the philosophical motivation is compromised, even if the resulting formalism is robust. The diary bears on the *plausibility* and *motivation* of the anti-psychologistic stance, if not its formal consistency.

  **Universalism and Particularism: Tension or Complicity?**

  The core of the tension lies between the universalism of the third realm and the particularism of the diary. Frege's logic is binding on "every rational being as such." It is indifferent to nation, culture, or history. In contrast, the diary expresses a fervent particularism: a belief in German superiority, a hostility to "foreign" influences (specifically Jewish intellectuals), and a preference for monarchy over parliamentary democracy. On the surface, these seem orthogonal. One could argue that a man can believe in universal logical laws while holding prejudiced views about political governance. The realm of logic is distinct from the realm of policy.

  Yet, this orthogonality is too facile. Frege's anti-psychologism was not developed in a vacuum; it was developed in a specific intellectual climate where logic was increasingly viewed as a human, fallible activity. Frege's insistence on the "objectivity" of thoughts mirrors his political desire for order, hierarchy, and authority. The "third realm" functions as a philosophical analogue to the monarchy he favored: a domain of authority that stands above the chaotic "mob" of democratic opinion and psychological subjectivity. In the diary, Frege laments the loss of authority in the Weimar Republic, viewing democracy as rule by the incompetent. Similarly, in his philosophy, he rejects the "psychological" view of logic because it makes truth dependent on how humans *happen* to think, rather than how they *ought* to think.

  The tension, therefore, is not a simple contradiction but a structural complicity. The rigor of Frege's universalism serves to insulate the "pure" realm of logic from the "contaminated" realm of human society. By banishing psychology to the private sphere and elevating logic to the third realm, Frege creates a philosophical sanctuary that mirrors the political sanctuary he desired for Germany. The universalism of the logic is not a genuine openness to all rational beings (which would imply a form of equality); it is a demand that all rational beings submit to a single, rigid standard that Frege himself controls. The particularism of the diary—the belief that only certain people (Germans, monarchists) are fit to rule—finds its philosophical echo in the belief that only a specific, austere method (his logic) is fit to grasp truth. The diary suggests that Frege's universalism is not a generous cosmopolitanism, but an authoritarian universalism: one truth, one law, one authority, imposed from above.

  **The Strongest Counter-Argument: The Autonomy of Normativity**

  The strongest consideration against this reading is the autonomy of normativity. One might argue that Frege's anti-psychologism is correct *regardless* of his motivations. If the laws of logic are indeed normative laws of truth, then they *must* be independent of psychological contingency. Frege's political errors do not prove that his philosophical distinction between the normative and the descriptive is wrong. Dummett himself struggled with this, ultimately maintaining that Frege's philosophical insights survived his moral failings because the insights concern the nature of truth, which is independent of the thinker. To reject Frege's anti-psychologism because he was an antisemite would be to psychologize logic ourselves—to make the acceptance of logical truths dependent on the moral character of the proponent. This would be self-defeating.

  Furthermore, one could argue that the diary represents a late-life decline, a senile hardening of views that had no connection to the work of the 1870s and 1890s. The *Begriffsschrift* was published decades before the diary. To read the political reactionary back into the logical innovator is to commit an anachronism. The logical work stands on its own merits, and the "third realm" is a necessary posit for the objectivity of mathematics, not a political metaphor.

  **Verdict: The Complicity of Purity**

  While the counter-argument regarding the autonomy of normativity protects the *theorems*, it fails to protect the *project*. We cannot accept the distinction between the "pure" philosopher and the "flawed" man when the philosopher's central project is to define the conditions of rationality itself. Frege's anti-psychologism is not just a technical maneuver; it is a claim about what it means to be a rational subject. By positing a realm of thought completely divorced from human practice, Frege devalues the actual, embodied, diverse ways in which human beings reason.

  The verdict, therefore, is that the diary *does* bear on the philosophical assessment of Frege's work, specifically regarding the ambitions of his project. The universalism of the third realm is not orthogonal to the particularism of the diary; it is its philosophical sublimation. Frege's logic seeks to purify thought of everything that makes it human—history, culture, psychology—because he viewed those elements as sources of corruption and disorder. The diary reveals that this drive for purity was not merely epistemological but deeply political.

  We must read Frege's anti-psychologism not as a neutral discovery of the landscape of truth, but as a normative intervention that privileges rigidity over flexibility, authority over consensus, and purity over engagement. This does not invalidate the *Begriffsschrift*, but it demands a critical reassessment of the "analytic" self-image that Frege inaugurated. We cannot simply inherit Frege's logic while discarding his politics, because the logic was designed to be a politics of thought—a withdrawal from the messy democratic arena of human understanding into a sterile realm of objective command. The diary forces us to acknowledge that the claim to universality can itself be a particularist weapon. Thus, while Frege's theorems remain valid, his philosophical project bears the scar of his particularism: it is a universalism built on exclusion, a logic of order that fears the very humanity it claims to govern. We must accept his tools, but we must reject the fortress he built them to defend.
