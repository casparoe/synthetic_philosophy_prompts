answer: |-
  Your diagnosis is exceptionally sharp, and as an experimental physicist, you have put your finger on precisely the epistemological weak point in Sidgwick's argument. You are not importing a distinction that fails to transfer; rather, you are applying a rigorous statistical intuition to a problem that Sidgwick hoped could be solved by a looser, legalistic conception of evidence.

  Here is an analysis of the standard of proof Sidgwick is employing, the validity of your critique regarding error types, and what this suggests about Sidgwick's own awareness of the programme's limits.

  ### 1. The Standard of Proof: Legalistic vs. Demonstrative
  Sidgwick is explicitly distinguishing between two standards of proof in the passage you cited.
  *   **Demonstrative Force:** He admits this is limited. In logic or mathematics, a conclusion follows necessarily from premises. In experimental physics, a result is often considered "demonstrated" when systematic errors are controlled and statistical significance is high enough to rule out chance.
  *   **Weight of Evidence:** This is Sidgwick's actual goal. He is borrowing from the **legal or historical method**, not the strict laboratory method. In a court of law, one does not demand repeatable experiments; one demands a preponderance of testimony where the only remaining alternative is a conspiracy or universal perjury.

  When Sidgwick says, *"We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick,"* he is defining success not as **compelling assent** (which would require closing the "trick" loophole), but as **exhausting rational objection**. He is aiming for *moral certainty* rather than *mathematical certainty*.

  ### 2. Your Diagnosis: Random Error vs. Systematic Bias
  Your critique is entirely fair and highlights why psychical research struggled to gain traction in the hard sciences.

  *   **The Physicist's View:** As you note, accumulating independent trials ($N \to \infty$) reduces random error ($\sigma / \sqrt{N}$). However, if every trial relies on human testimony, they all share a common vulnerability: human fallibility or fraud. This is a **systematic error** (or a "nuisance parameter" that cannot be marginalized out). No amount of data averaging resolves a flaw in the detector itself.
  *   **Sidgwick's View:** Sidgwick hopes that the *variety* of investigators acts as a control. If Investigator A, B, and C all report similar phenomena, the probability that all three are "in the trick" (colluding or independently deluded) is lower than any one of them being so. He is treating "trustworthiness" as a probabilistic variable that can be compounded.

  **Where he runs into trouble:** You are correct that the skeptic's fallback ("the investigator is in the trick") is not a random error; it is an **unfalsifiable hypothesis**. In Popperian terms (though anachronistic to Sidgwick), the claim "psychical phenomena exist" is being tested, but the auxiliary hypothesis "the investigator is honest" is doing all the heavy lifting. If the skeptic refuses to grant the auxiliary hypothesis, the core hypothesis can never be tested. Sidgwick acknowledges this when he says the critic *"will allege that."* He knows the skeptic can always retreat to the position of universal skepticism regarding testimony.

  ### 3. Did Sidgwick Sense the Impasse?
  Yes, the passage suggests a profound resignation, bordering on melancholy. Sidgwick was acutely aware of the logical limits of empiricism.

  *   **The Humean Shadow:** Sidgwick was fighting against David Hume's argument on miracles. Hume argued that no testimony is sufficient to establish a miracle unless the falsehood of that testimony would be *more* miraculous than the event itself. Sidgwick is trying to tip this balance by "massing evidence." However, the closing sentence of your quote admits that for the determined skeptic, the "miracle" of universal fraud is always preferable to the "miracle" of psychical phenomena.
  *   **The Definition of Success:** Sidgwick seems to be redefining what it means for the SPR to "succeed." If the goal were to convince the hard skeptic, he admits failure is inevitable ("he will allege that"). Therefore, the goal must be to satisfy the *reasonable* inquirer—someone willing to accept testimony unless there is positive evidence of fraud.
  *   **Personal Conflict:** Historically, we know Sidgwick was deeply conflicted. He desired scientific validation for religious/ethical hopes (immortality, moral order) but possessed a rigorously agnostic intellect. This quote reads like a man building a dam against a tide he knows will eventually wash over it. He is setting a boundary line: "We have done our job up to *this* point." He knows he cannot cross the final bridge to absolute proof.

  ### Conclusion
  You are not misreading the logic. Sidgwick is attempting to apply an inductive, scientific methodology to a domain (testimony-based anomalies) where the primary source of error (human deception/delusion) is non-averaging and systematic.

  He knows this. The tone of the passage is not one of confident prediction, but of defensive fortification. He is essentially saying: *"We can build a case so strong that rejecting it requires assuming a conspiracy of dishonesty. We cannot force you to reject that assumption, but we can make it an unreasonable position to hold."*

  For a physicist, this is unsatisfying because it leaves the "systematic error" unquantified. For Sidgwick the philosopher, it was likely the best that could be done: an admission that empirical inquiry into human-mediated phenomena ultimately bottoms out in a judgment of character, not a reading on a dial. He sensed the programme could not satisfy the *radical* skeptic, and he was making peace with that limitation while hoping it would satisfy the rest of the world.
