      *   *The "Smuggling" Counter:* Does "purchasing power" slip in as a hidden abstract quality?
      *   *Resolution:* No, because for Berkeley, "power" is not an abstract idea existing in isolation; it's a relation between will, action, and result. In economics, it's a relation between token, convention, and goods. As long as "value" is treated as a relational function (like a grammatical rule) rather than a mental image (like a platonic form), Berkeley is safe.
      *   *Final Decision:* Verdict: **Consistent.** In fact, *The Querist* is the practical proof of his epistemology. He treats money exactly how he treats words: as operative signs, not ideational mirrors.

  6.  **Drafting the Essay - Structure:**
      *   **Introduction:** Hook the reader with the oddity of Berkeley the economist. State the tension (Immaterialism vs. Monetary Abstraction). State the thesis (It's consistent; money is a linguistic sign).
