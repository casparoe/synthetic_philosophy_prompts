      *   *Side B (Consistency):* Berkeley treats words and symbols as *tools*, not pictures of ideas. A word like "triangle" doesn't summon an abstract triangle; it triggers a rule for using particular triangles. Similarly, a coin doesn't contain abstract "value"; it is a physical token that triggers a social rule for exchange. The "value" isn't an abstract idea in the mind; it's a functional relationship established by convention. The coin *is* the particular; its function is general, but the idea behind it need not be abstract.

  3.  **Evaluate Side A (The Inconsistency Charge):**
      *   *Strength:* It's the intuitive reading. If money measures value, and value is common to beef, linen, and labor, isn't "value" an abstract universal?
      *   *Weakness:* It assumes Berkeley thinks general *terms* are impossible. He doesn't. He thinks general *ideas* (mental images of abstractions) are impossible. He allows general *signification*.
      *   *Crucial Point:* Does "purchasing power" require a mental image of abstract value? Or is it just a disposition to exchange?

  4.  **Evaluate Side B (The Consistency Defense):**
      *   *Strength:* Aligns with Berkeley's semiotics (theory of signs). In *Alciphron* and *Principles*, he argues language isn't about ideational content but about influencing conduct. Money fits this perfectly: it's a counter in a game, a token that moves pieces (goods) around.
      *   *Weakness:* *The Querist* sometimes sounds like he's positing "wealth" or "power" as a real substance (national industry). But is that an *abstract idea* in the forbidden sense?
