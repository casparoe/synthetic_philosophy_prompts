prompt: |-
  I'm a philosophy PhD student TAing an intro philosophy of religion course this semester, and we just got through Hume's "Of Miracles," which sent me down a rabbit hole that I don't think the secondary lit I've read (Earman, Fogelin, that kind of thing) really addresses head-on: how would Hume's argument actually hold up against the bureaucratic machinery the Catholic Church now uses to certify miracles, as opposed to the kind of testimony he was originally arguing against?

  Like, at Lourdes there's an International Medical Committee of physicians (not all of them practicing Catholics, from what I understand) that reviews thousands of claimed healings and only ever certifies a tiny handful as "medically inexplicable by current science." Something similar happens for canonizations - a board of doctors has to independently sign off that there's no known natural explanation before a case even reaches the theologians. This seems like it should be a much harder case for Hume than the testimony he actually had in mind, since so much of his "in practice" argument in Part 2 of the Enquiry is really an attack on the witnesses themselves - people driven by "the passion of surprise and wonder," reports that trace back to "ignorant and barbarous nations," rival religions' miracles cancelling each other out, etc. Modern medical boards are trying to be the exact opposite of that: trained skeptics with diagnostic tools Hume couldn't have dreamed of, actively hunting for natural explanations and only demurring when they genuinely can't find one.

  So does that kind of institutionalized, quasi-scientific vetting actually satisfy Hume's maxim that the testimony's falsehood would have to be "more miraculous" than the fact it's attesting to, or is there some deeper reason baked into his argument that would make him unimpressed regardless? My office mate, who's way more sympathetic to natural theology than I am, thinks Hume basically looses this one on his own terms, but I can't quite tell if that's right or if it's missing something. Curious what you think Hume himself - not just later defenders like Earman - would actually say if someone sat him down and explained how Lourdes or the Vatican's canonization process works today.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Question:**
      *   **User:** Philosophy PhD student, TAing Intro Philosophy of Religion.
      *   **Context:** Just taught Hume's "Of Miracles" (Section X of the *Enquiry Concerning Human Understanding*).
      *   **Problem:** The standard secondary literature (Earman, Fogelin) focuses on Hume's original context (ancient testimony, enthusiastic witnesses). The user is asking about a specific modern counter-example: the Catholic Church's modern bureaucratic miracle certification process (Lourdes, Canonization).
      *   **Key Feature of Counter-Example:** Institutionalized, quasi-scientific vetting. Medical committees (including non-Catholics), active skepticism, diagnostic tools, high rejection rate.
      *   **Core Question:** Does this institutional vetting satisfy Hume's maxim (falsehood must be more miraculous than the event), or is there a deeper reason Hume would remain unimpressed?
      *   **Goal:** Speculate on what *Hume himself* would say, not just later commentators. Address the office mate's claim (that Hume loses on his own terms).

  2.  **Deconstruct Hume's Argument (Section X):**
      *   **Part I (The A Priori/Principle Argument):** The core maxim. A miracle is a violation of the laws of nature. Laws of nature are established by "firm and unalterable experience." Therefore, the proof against a miracle is as strong as any argument from experience can be. To believe a miracle, the evidence (testimony) must be so strong that its falsehood would be *more* miraculous than the event itself.
      *   **Part II (The A Posteriori/Practical Argument):** Four reasons why testimony for miracles never actually meets that standard:
          1.  No miracle attested by enough men of unquestioned good sense, education, and reputation.
          2.  Human propensity for the marvelous/surprising (psychology of belief).
          3.  Miracles occur mostly among ignorant/barbarous peoples.
          4.  Different religions have miracles, which cancel each other out (contradictory systems).

  3.  **Evaluate the Modern Catholic Process against Hume's Criteria:**

      *   *Against Part I (The Maxim):*
          *   Does medical inexplicability equal a violation of the laws of nature?
          *   Hume defines a miracle as a *violation* of a law of nature by a divine agent.
          *   Modern medicine says "inexplicable by *current* science."
          *   *Hume's likely retort:* "Inexplicable" $\neq$ "Violation of Law." It just means we don't know the law yet. Spontaneous remission is rare, but rare events happen within laws. A true violation (e.g., regrowing a limb instantly) is different from a healing that doctors can't explain.
          *   *The "Uniform Experience" point:* Hume argues our uniform experience is that dead men stay dead, limbs don't regrow. Even if 100 doctors sign off, does that outweigh the uniform experience of all humanity across all time? Hume says the proof against the miracle is *by definition* maximal.

      *   *Against Part II (The Practical Checks):*
          *   *Check 1 (Quality of Witnesses):* The doctors are educated, reputable, skeptical. This *does* address Hume's first practical check better than ancient testimony.
          *   *Check 2 (Psychology):* Are the doctors driven by "passion of surprise"? Maybe not, but the *petitioners* are. The process is fueled by the desire for belief. Hume might argue the institutional pressure biases the outcome (confirmation bias at the committee level, or selection bias in which cases get submitted).
          *   *Check 3 (Ignorant/Barbarous):* Modern medicine isn't ignorant. This check is bypassed.
          *   *Check 4 (Contradictory Systems):* This is the big one. Hume argues miracles support specific religious systems. Catholic miracles support Catholicism. Protestant/Lutheran/Muslim/Other miracles support their systems. They cancel out. The Vatican process is explicitly confessional. It's not just "a miracle happened," it's "a miracle happened *through this Saint* confirming *this Church*."

  4.  **Synthesize Hume's Likely Response:**

      *   *Concession:* Hume would admit this is stronger testimony than the ancient stuff. It addresses the "witness credibility" objection (Part II, Check 1).
      *   *Rebuttal 1 (Definition of Miracle):* He would pounce on "medically inexplicable." That is an argument from ignorance, not a proof of a violation of natural law. Hume requires a *violation*, not a *puzzle*.
      *   *Rebuttal 2 (The Maxim/Part I):* Even with great witnesses, the evidence against the law of nature (uniform experience) is stronger. The probability of error, deception, or unknown natural cause is *always* higher than the probability of a law violation.
      *   *Rebuttal 3 (Institutional Bias):* The Church has a vested interest. The "Devil's Advocate" (Promoter of the Faith) is a role, but the goal is canonization. It's not pure science; it's theology using science.
      *   *Rebuttal 4 (Contradiction):* The cancellation argument still holds.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Collegial, rigorous, acknowledging the user's expertise (PhD student).
      *   *Structure:*
          1.  Validate the question (it's a good one, often overlooked).
          2.  Distinguish Part I vs. Part II of Hume's argument.
          3.  Address the "Medical Inexplicability" vs. "Violation of Law" distinction (Crucial point).
          4.  Address the Institutional/Vested Interest angle (Part II).
          5.  Address the "Cancellation" argument (Part II).
          6.  Conclusion on the Office Mate's claim.

      *   *Refining the "Medical Inexplicability" point:* This is the strongest philosophical objection. Hume isn't just saying "we don't know how this happened." He's saying "we know this *cannot* happen given the laws of nature." If a cancer goes into remission, Hume says, "Rare, but natural." If a leg grows back in seconds, Hume says, "Impossible." The Vatican rarely certifies the latter anymore. They certify the former. Hume would call this a category error.
      *   *Refining the "Witness" point:* Hume demands witnesses who have *nothing to lose* and *everything to lose* if caught lying. Do Catholic doctors fit this? They are often paid by the Church or are believers. Even if secular, they are part of a process designed to find saints. Hume might argue the *system* creates the testimony, not independent observation.
      *   *Refining the "Office Mate" verdict:* The office mate is partially right (Part II is weakened) but wrong on the core (Part I remains intact).

  6.  **Final Polish:** Ensure references to the *Enquiry* are accurate (Section X, Part I vs. Part II). Mention the "wise man proportions his belief to the evidence." Bring in the idea of "anomaly" vs. "violation."

      *(Self-Correction during drafting)*: I should make sure not to defend the Catholic position, but strictly simulate Hume's reaction. Also, acknowledge that Hume's definition of "Law of Nature" is probabilistic (based on uniform experience), not necessarily metaphysical necessity, which makes his argument even harder to beat on his own terms.

  7.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  This is a fantastic question, and frankly, it's the kind of objection that usually only comes up once you move past the standard undergrad survey of the *Enquiry*. You're right that Earman (*Hume's Abject Failure*) and Fogelin (*A Defense of Hume on Miracles*) tend to focus on the probabilistic calculus or the epistemic structure, often treating the testimony as a generic variable. They don't spend enough time on how the *sociology* of the testimony might shift the weight.

  Your office mate is partially right: the modern Vatican/Lourdes process *does* blunt the force of Hume's **Part II** arguments (the practical, a posteriori checks). However, I suspect Hume would remain entirely unmoved on the core **Part I** argument (the a priori maxim), and he would likely argue that the modern bureaucratic process actually introduces new vulnerabilities that fit his broader skepticism about religious psychology.

  Here is how I think Hume would dismantle the "Bureaucratic Miracle" if you sat him down in your office.

  ### 1. The Category Error: "Inexplicable" vs. "Violation"
  The most significant hurdle for the Catholic cases is that they likely no longer meet Hume's definition of a miracle.

  In Part I of Section X, Hume defines a miracle as "a transgression of a law of nature by a particular volition of the Deity, or by the interposition of some invisible agent." Crucially, for Hume, a law of nature is established by "firm and unalterable experience."

  The Vatican's Medical Bureau does not certify *violations* of natural law; they certify *anomalies*. They certify that a healing is "medically inexplicable by current science." Hume would pounce on this distinction immediately.
  *   **Hume's Objection:** "Inexplicable" is an argument from ignorance. It means *we do not yet know the natural cause.* It does not mean *there is no natural cause.*
  *   **The Argument:** Hume would argue that the uniform experience of humanity tells us that cancers sometimes go into spontaneous remission, that nerves sometimes regenerate unexpectedly, and that psychosomatic effects are powerful. Even if the probability is 1 in 1,000,000, it is not a *violation* of a law. A true Humean miracle would be something like a limb regrowing instantly before your eyes, or a dead man walking out of a tomb after three days. The modern Church, wisely, stopped claiming those because they are too easily falsified. They retreated to "statistically improbable medical recoveries."
  *   **Verdict:** Hume would say the testimony is attesting to a *rare natural event*, not a *miracle*. Therefore, the maxim ("no testimony is sufficient to establish a miracle unless...") never even gets triggered, because no miracle has been alleged in the strict sense.

  ### 2. The "Wise Man" and the Weight of Uniform Experience
  Let's grant, for the sake of argument, that a case *did* involve a genuine violation (e.g., instant limb regrowth) and the Medical Bureau certified it. Does the bureaucracy satisfy the maxim?

  Hume's Part I argument is that the proof against a miracle is as strong as any argument from experience can possibly be. It is, effectively, a probability of 100% (based on uniform experience). For testimony to outweigh that, the falsehood of the testimony would have to be *more* improbable than the violation of the law of nature.

  *   **Hume's Objection:** Even with 50 skeptical doctors, the probability of human error, collective delusion, or undetected fraud is *still* higher than the probability that the laws of nature have been suspended.
  *   **The Bureaucracy as a Filter, not a Guarantee:** Hume would argue that bureaucratic processes reduce error; they do not eliminate it. Medical diagnoses are theory-laden. If the committee operates with the background assumption that "God acts through the Saints," that influences the threshold for "inexplicable."
  *   **The "Knave or Fool" Principle:** Hume famously asks whether it is more probable that the witnesses are deceiving or being deceived, or that the law of nature is violated. He would argue that institutions are made of men, and men are susceptible to "the passion of surprise and wonder," even if they are MDs. The institutional desire for a canonization (which brings prestige, pilgrims, and revenue to a diocese) creates a subtle, systemic pressure that a disinterested "wise man" would detect.

  ### 3. Part II Revisited: The Vested Interest
  You noted that Hume's Part II attacks "ignorant and barbarous nations" and witnesses lacking reputation. The modern doctors have reputation. So, your office mate is right that Hume's first check in Part II is met.

  However, Hume has other checks in Part II that apply even more strongly to a bureaucracy:
  *   **The Psychological Propensity:** Hume argues humans have a natural love for the marvelous. In a bureaucratic setting, this manifests as *confirmation bias*. The doctors are reviewing cases *pre-selected* for their miraculous potential. They aren't reviewing random healings; they are reviewing healings that the faithful *already believe* are miracles.
  *   **The Vested Interest:** Hume is deeply suspicious of religious institutions. He would argue that the Vatican is not a neutral laboratory. It is an organization with a doctrinal mandate. The "Devil's Advocate" (Promoter of the Faith) is a role within the Church, appointed by the Church, to serve the Church's goal of sanctity. Hume would view this as a fox guarding the henhouse, regardless of the medical credentials of the fox.
  *   **Secrecy and Privacy:** Unlike a public scientific experiment, these medical reviews are often private. The data isn't open for peer review by the global scientific community, only by the Church's appointed commission. For Hume, publicity is essential for verifying testimony.

  ### 4. The Cancellation Argument (The Knockout Blow)
  This is where I think Hume would feel most confident. In Part II, Paragraph 24, he argues that miracles from different religions "destroy each other."

  *   **The Argument:** The Catholic miracle is not just "a healing happened." It is "a healing happened *through the intercession of Saint X*, confirming the truth of *Catholic Dogma*."
  *   **Hume's Retort:** If a Lourdes miracle confirms the Immaculate Conception and Papal Infallibility, it inherently disconfirms Protestant, Orthodox, Muslim, or Hindu claims. Since there are credible testimonies of "miraculous" healings in other traditions (even if less bureaucratically organized), the evidentiary weight cancels out.
  *   **The Bureaucracy Doesn't Help:** The fact that the Catholic Church has a *better* bureaucracy than the Pentecostals doesn't make their metaphysics true; it just makes their administration better. For Hume, the truth of a religious system cannot be established by miracles because the miracles of rival systems negate the evidentiary value of all of them. The bureaucratic vetting makes the Catholic testimony *stronger than the Pentecostal testimony*, but not strong enough to overcome the uniform experience against natural law violations.

  ### 5. What Hume Would Say to You
  If you pressed him on the "Medical Inexplicability" point, I suspect he would offer a distinction that cuts to the heart of your TAing:

  > "You ask if the testimony's falsehood would be more miraculous than the fact. I tell you that the 'fact' you are presenting is not a miracle. It is a gap in current medical knowledge. To fill that gap with 'Divine Intervention' is to commit a logical leap that no amount of bureaucratic paperwork can bridge. The doctors have done their job: they have said 'We don't know.' The theologians then say 'Therefore, God.' It is that 'Therefore' that I reject. No number of signatures can make that inference valid."

  ### Conclusion on Your Office Mate
  Your office mate is right that the **Part II** objections (witness credibility, ignorance) are significantly mitigated by the modern process. If Hume were only arguing from Part II, the Lourdes process would be a serious challenge.

  But Hume's core argument is **Part I**: the epistemic maxim based on the definition of laws of nature. Here, the bureaucracy fails to move the needle.
  1.  **Definition:** They certify anomalies, not violations.
  2.  **Probability:** Human error/institutional bias is always more probable than law-violation.
  3.  **Cancellation:** The confessional nature of the miracles negates their universal evidentiary value.

  So, Hume wouldn't be unimpressed because he's stubborn; he'd be unimpressed because he would argue the Church has changed the subject from "violations of nature" to "statistical outliers," and then tried to dress the outliers up as violations.

  **Pedagogical Tip:** This is a great angle for your students. It forces them to distinguish between "We can't explain this" (argument from ignorance) and "This cannot happen naturally" (argument from natural law). Most intro students conflate the two, and the Lourdes example is the perfect wedge to separate them.
