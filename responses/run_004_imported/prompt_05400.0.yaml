answer: |-
  **The Locutorio of the Convent of Santa Paula, Mexico City**
  **Late Afternoon, 1691**

  *The iron grille divides the room. On the outer side stands MANUEL FERNÁNDEZ DE SANTA CRUZ, Bishop of Puebla. On the inner, SOR JUANA INÉS DE LA CRUZ. The light is failing; the shadows of the bars fall across Juana's habit.*

  **BISHOP:** You recognize the hand, then? I did not intend to haunt you, Sister. I only wished to praise the *sermon* on Saint Catherine, and perhaps… offer a motherly caution. Though I suppose a Bishop playing the nun makes the caution harder to ignore.

  **SOR JUANA:** Your Excellency honors me by claiming the letter at all. But since you stand there, let us speak plainly. You praise the wit, but you fear the use. You cite Saint Paul: *Mulieres in ecclesiis taceant.* Let women keep silence in the churches. Is my pen a pulpit?

  **BISHOP:** Is it not? When your words leave this cloister, when they are read in viceregal palaces and debated by theologians, do they not preach? Paul forbids women to teach. It is a matter of order. If you unravel that thread, what holds the garment together?

  **SOR JUANA:** I do not preach from the altar, my Lord. I do not claim holy orders. I study in my cell. If I write, it is often because I am asked, or because silence would be a lie. But you imply my study itself is the sin. You speak of *curiositas*—a vanity that seeks knowledge for its own sake, rather than for God.

  **BISHOP:** Precisely. You are a bride of Christ. Is it not enough to know Him through prayer? Why must you dissect the logic of Aristotle or the physics of Athanasius Kircher? Is this not dressing the soul in peacock feathers? I fear for your humility. A mind dazzled by the world's learning often finds the Gospel too simple.

  **SOR JUANA:** You mistake the ladder for the view from the top. The sciences are not peacock feathers; they are a chain. If I wish to understand Theology—the queen of sciences—I cannot do so blindly. How can I speak of the Creator without understanding the creation? How can I parse Scripture without logic to test the argument, or rhetoric to convey the truth? To cut the lower links is to drop the chain. I do not study to *replace* God, but to have the tools to approach Him without stumbling.

  **BISHOP:** *He shifts, gripping the bars.* A compelling metaphor. But tools can become toys. And even if your intent is pure, consider the effect. When a nun writes with the authority of a master, men take offense. They see disorder.

  **SOR JUANA:** And what is the alternative? If women are to be taught—and they must be, for they have souls—who shall teach them? If I do not write, some learned man must enter the cloister to instruct me, or I must remain ignorant. Is it not safer, more proper, that I teach myself and other women through ink, than to invite the intimacy of male tutors into our enclosure? My writing protects the chastity of this house.

  **BISHOP:** *He pauses, looking down.* I cannot deny the logic of that. It is a practical defense. And on the matter of the sciences… I concede that a mind such as yours, if it is indeed a gift from God, ought not to be lobotomized. To deny you the ladder is to deny the Giver of the gift.

  **SOR JUANA:** Then let me climb.

  **BISHOP:** *He looks up, his expression hardening slightly.* Intellectually, Sor Juana, you have bested me. I am not so proud as to deny a syllogism when it holds. But I am not merely a logician. I am a shepherd. And I must watch the flock, not just the wolf.

  **SOR JUANA:** You fear the scandal.

  **BISHOP:** I fear the *scandal*. The Church is not only truth; it is also men. And men are weak. They see a woman teaching, and they do not see the chain of sciences, or the protection of the cloister. They see pride. They see a crack in the wall. If the wall falls, the protection falls with it. I can concede that you are right in principle. But I cannot promise that the world will tolerate your principle without punishing you.

  **SOR JUANA:** So I am to be silenced not because I am wrong, but because I am visible.

  **BISHOP:** *He softens, his voice dropping.* I am asking you to weigh the cost. You may climb the ladder, yes. But do not be surprised if those below seek to break it, simply because a woman holds it. I will not ban your books today. But I urge you: remember that humility is also a science. One that the world understands better than logic.

  **SOR JUANA:** *She places a hand on the cold iron.* I will study that science, my Lord. But I cannot un-know what I know.

  **BISHOP:** No. Nor would I ask you to. Only… tread carefully. The grille protects you, but it also imprisons what you say. Remember who holds the key.

  *The Bishop steps back into the shadows of the corridor. Sor Juana remains at the grille, her hand lingering on the bars, as the light fades completely.*
