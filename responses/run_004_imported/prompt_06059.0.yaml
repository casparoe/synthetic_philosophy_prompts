      *   *The Democracy Question:* Focus on the definition of the State's power. The State's power *is* the power of the people combined. Excluding people reduces the State's *conatus*.
      *   *The "Mob" Fear:* Address this. He feared the mob because they were easily manipulated by priests/demagogues (TTP). Modern secular democracy mitigates this.
      *   *Conclusion:* He would see modern democracy as the closest approximation to the "free state," despite flaws.

