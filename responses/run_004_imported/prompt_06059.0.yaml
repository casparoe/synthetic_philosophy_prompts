      *   *Check:* Is the universal suffrage argument addressed? *Yes, focus on state stability and the definition of the multitude.*

      *(Self-Correction on the Women argument)*: I need to be careful not to just say "he'd be a feminist." I need to say he would follow his *logic*. His logic says Right = Power. If women have power, they have right. His specific argument was that they *lack* the power of mind relative to men due to passion. If evidence shows they don't, the premise collapses.
      *(Self-Correction on Democracy)*: Spinoza was wary of the "mob." I need to explain why modern institutions solve the "mob" problem for him. Secret ballots, rule of law, separation of powers (though he didn't use that exact term, he liked checks).

