answer: |-
  Good afternoon. Mrs. Alvarez gave me a specific assignment for this toast. She asked me to avoid the standard retirement script. She told me not to talk about how she will "live on through us," and she asked me not to praise her for her "selflessness."

  She said that if we actually read the text we studied every fall, we'd know why those sentiments are false. So, in the spirit of the woman who translated Newton and corrected his proofs, I intend to be accurate.

  Every October, before we tackled the Laws of Motion, Mrs. Alvarez handed out Émilie du Châtelet's *Discourse on Happiness*. She wanted us to know that the person who made Newton comprehensible to the Enlightenment believed that intellect and emotion were not enemies.

  Du Châtelet argues that happiness requires passions. It requires the capacity to be moved by things. Looking back on thirty-one years of AP Physics, it is clear that Mrs. Alvarez did not come to this room every day to sacrifice for us. She came because she had a passion for the order of the universe, and a passion for the moment a difficult concept clicks into place. She taught because she loved the subject, and she was generous enough to let us stand near that fire. That is not selflessness; that is integrity.

  Du Châtelet also writes that we need illusions. Not lies, but the optimism required to engage with the world. It takes a specific, beautiful illusion to stand in front of a classroom of teenagers for three decades and believe, genuinely, that today is the day the lightbulb turns on. It takes an illusion to believe that the universe is comprehensible, and that we are capable of comprehending it. Mrs. Alvarez never let cynicism strip that optimism away.

  She valued study, not as a chore, but as a source of pleasure that does not fade. In this room, there are engineers, doctors, and writers who learned more than physics from her. We learned that cultivating your mind is a prerequisite for joy.

  And finally, du Châtelet insists on independence from the opinions of others. She writes that relying on public applause makes one a slave. Mrs. Alvarez never taught for the applause. She taught because it was true to who she was. She didn't need us to validate her worth; she invited us to validate our own.

  So, I will not wish her a restful retirement, as if she has been laboring under a burden. Du Châtelet tells us that idleness is the enemy of happiness.

  Instead, I wish her continued passions. I wish her the illusion that there is always more to discover. I wish her the independence to spend her days exactly as she chooses, studying what she loves, answerable only to her own curiosity.

  Mrs. Alvarez, thank you for teaching us that the pursuit of happiness is not a distraction from the work, but the point of it. To your next chapter.
