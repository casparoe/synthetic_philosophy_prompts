      *   **Category 2: Mechanism of surplus value.**
          *   *Marx's Theory:* Surplus value arises because the value of labor-power (subsistence) is less than the value created by the use of that labor-power during the working day.
          *   *Student's Answer:* "The value that labor creates in a working day is greater than the value the worker needs to be paid to cover their own subsistence... everything they produce beyond it is surplus labor... surplus value -- is simply retained by the capitalist."
          *   *Assessment:* This is generally correct. They explain the difference between value created and value of subsistence/wages. Although they say "value that labor creates" (instead of labor-power), the mechanism described (working day > subsistence cost) is the core of the surplus value argument.
          *   *Score:* 4/5. Deduct 1 point because the terminology slip (labor vs. labor-power) muddies the theoretical precision, but the mechanism is described correctly.

      *   **Category 3: Compatibility with "fair" market exchange.**
          *   *Marx's Theory:* Exchange is "fair" because equivalents are exchanged (wages = value of labor-power). Exploitation happens in production, not circulation.
          *   *Student's Answer:* "Since both sides get what the contract specifies, there is no cheating at the level of exchange itself... exploitation for Marx is compatible with a technically fair market exchange."
          *   *Assessment:* This is correct. They identify that the contract is fulfilled and no cheating occurs in exchange.
          *   *Score:* 5/5. Clear and accurate.

      *   **Category 4: Two forms of alienation (1844 Manuscripts).**
          *   *Marx's Forms:* 1. From product, 2. From activity/process of labor, 3. From species-being, 4. From other workers.
