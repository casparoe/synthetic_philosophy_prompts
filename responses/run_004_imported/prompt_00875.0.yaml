answer: |-
  This is a sharp read on the text. Most pop-Epicureanism stops at Principal Doctrine 2 ("Death is nothing to us"), but you're right: **Principal Doctrine 19** is the actual kill-switch for the transhumanist longevity project.

  > *"Infinite time and finite time contain equal pleasure, if one measures the limits of pleasure by reasoning."*

  If we run Epicurus's actual physics and ethics through a modern longevity pitch deck, the verdict isn't just skepticism; it's a diagnosis of a specific philosophical pathology. Here is how a coherent Epicurean would dismantle the scene, followed by the one narrow corridor where they might nod in agreement.

  ### 1. The Category Error: Quantity vs. Limit
  The fundamental error of the "Don't Die" movement is a misunderstanding of hedonic calculus.

  Modern longevity advocates operate on a **linear model of pleasure**: More time = More experiences = More pleasure. Therefore, maximizing time maximizes the good.

  Epicurus operates on a **limit-based model of pleasure**. For Epicurus, pleasure (*hedone*) isn't a cumulative score; it's a state of being. Specifically, it is *katastematic* pleasure: the absence of pain in the body (*aponia*) and the absence of disturbance in the soul (*ataraxia*).

  Once you are not hungry, not in pain, and not anxious, you have reached the **limit** of pleasure. You cannot go higher. Eating a second feast doesn't increase pleasure; it varies it. Living 1,000 years doesn't increase pleasure if you achieved *ataraxia* in year 40.

  **The Verdict:** Epicurus would view the cryonics pitch as a failure of reasoning. PD 20 clarifies this: *"The flesh perceives the limits of pleasure as unlimited, and unlimited time is required to supply it. But the mind, grasping in reasoning what the end and limit of the flesh is... supplies us with the complete life."*

  To an Epicurean, Bryan Johnson's obsession with measuring his blood plasma is the "flesh" demanding unlimited time, while the "mind" should recognize that the good life is already complete. Chasing infinite time is like trying to fill a jar that is already full; it's not just useless, it's a distraction from enjoying the contents.

  ### 2. The Diagnosis: Vain vs. Natural Desires
  Epicurus divides desires into three categories:
  1.  **Natural and Necessary:** Food, shelter, friendship, safety.
  2.  **Natural and Unnecessary:** Luxury food, elaborate shelter.
  3.  **Vain and Empty:** Fame, power, **immortality**.

  The longevity scene conflates Category 1 with Category 3.
  *   **Health** is Natural/Necessary. Avoiding the pain of cancer or dementia is Epicurean.
  *   **Indefinite Life Extension** is Vain/Empty. It is a desire for something outside the bounds of human nature (which is mortal).

  Epicurus would argue that the anxiety required to maintain cryonic preservation (paying premiums, trusting future societies, worrying about server stability for uploaded minds) actively destroys *ataraxia*. You are trading present tranquility for a hypothetical future that requires constant vigilance.

  If the pursuit of life extension generates *any* anxiety about death, it is self-defeating. The slogan "Don't Die" is inherently anxious. An Epicurean slogan would be "Don't Worry."

  ### 3. The Metaphysical Problem: Mind Uploading
  This is where Epicurus's physics (atomism) clashes hardest with Silicon Valley metaphysics.

  Epicurus was a strict materialist. The soul (*psyche*) is a fine, light arrangement of atoms dispersed throughout the body. When the body dies, the atomic structure dissolves, and the sensation ceases. There is no ghost in the machine.

  **Mind Uploading** assumes a dualist framework: that "you" are software (information) that can be separated from hardware (biology). Epicurus would call this nonsense.
  *   **The Copy Problem:** If you scan your brain and upload it, the atomic arrangement of *you* is still in the grave. The server contains a copy, a simulacrum.
  *   **The Sensation Problem:** Pleasure and pain are felt through the senses, which are biological/atomic interactions. A digital substrate cannot feel *aponia* (absence of pain). It can simulate data, but it cannot experience the removal of suffering.

  Epicurus would view mind uploading as the ultimate vanity: trying to preserve a "self" that is defined by its mortality, in a medium that cannot experience the only thing that makes life valuable (sensation/pleasure).

  ### 4. The Narrow Corridor: Where Epicurus Might Agree
  Is there *any* way a coherent Epicurean signs on? Yes, but only under strict conditions that most longevists would reject.

  **Condition A: Healthspan, not Lifespan**
  If the technology reduces the *pain* of aging (frailty, disease, cognitive decline) without promising immortality, it is a Natural/Necessary good. Curing Alzheimer's is Epicurean. Preventing the specific pain of a dying body is consistent with *aponia*.

  **Condition B: Motivation by Preference, not Fear**
  Epicurus admits that a wise man prefers life to death (Principal Doctrine 40). He just doesn't *fear* the end.
  *   **Non-Epicurean:** "I must live forever because non-existence is terrifying."
  *   **Epicurean:** "I enjoy friendship and philosophy. If I can have more time for them without anxiety, that is pleasant. If I die tomorrow, I have already possessed the complete pleasure."

  If a longevist could say, "I am pursuing this treatment to avoid the pain of degeneration, but if it fails, I am perfectly content to die," they would be acting coherently. But the culture of the scene is rarely content. It is driven by the "terror of the dark," which Epicurus identifies as the root of all human misery.

  ### 5. The Final Judgment
  Epicurus would likely look at a cryonics facility and see a **temple to anxiety**.

  PD 19 is the hammer: **"Infinite time contains no greater pleasure than finite time."**
  The longevity movement is built on the premise that infinite time *does* contain greater pleasure. Therefore, the movement is built on a false calculation of the good.

  Epicurus would argue that by fixating on the *duration* of the meal, the longevists are forgetting to *taste* the food. They are so worried about the check arriving that they are eating in a state of high alert, which ruins the digestion (the *ataraxia*).

  **Summary:**
  *   **Mind Uploading:** Rejected. Metaphysical error; a copy feels no pleasure.
  *   **Cryonics:** Rejected. Based on vain desire for immortality and fear of non-existence.
  *   **Anti-Aging Medicine:** Accepted *only* if framed as pain reduction (healthspan), not death avoidance (lifespan), and pursued without anxiety.

  The "Don't Die" crowd thinks they are hacking biology. Epicurus would say they are being hacked by the very fear of death they claim to be solving. They have the lab coats, but they lack the logic.
