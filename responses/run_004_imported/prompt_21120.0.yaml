prompt: |-
  I cover neurotech and AI for a science magazine, which is apparently how I ended up as the "unaffiliated public member" on my local hospital's neuroethics committee (every review board needs one person with no clinical stake, and I guess I was available). We've got a case that's been eating at me for weeks. A patient in a small trial of an adjustable deep-brain stimulator for treatment-resistant depression has a handheld controller that lets her raise or lower her own stimulation within a range her psychiatrist originally set. At the top of that range she says she feels better than she has in twenty years, not just "less depressed" but genuinely euphoric. Problem is, over the last couple months she's been running it at max pretty much constantly, she's stopped returning her sisters calls, quit a part-time job she liked, and by her family's account mostly just sits there with the dial turned up. She's now asking the committee to raise the ceiling further. She's fully lucid, passes every competency evaluation we throw at her, and says we should all just be happy she finally feels good.

  The committee's split roughly down the middle. One camp says overriding a competent adult's own account of her well-being, just because we don't like how she's using it, is exactly the kind of paternalism medical ethics is supposed to have grown out of. The other camp, including an AI-safety researcher we brought in to consult on the device's control algorithm, points out that this is pretty much the exact failure mode her field worries about when a system finds a way to directly max out whatever's measuring its reward instead of doing the thing the reward was suppose to be a proxy for, and argues that her glowing self-reports are close to worthless as evidence anything is actually going well for her. I have to draft the memo the committee votes on Thursday: an actual recommendation (raise it, hold it, add conditions, whatever) with a timeframe, and it needs to seriously engage the autonomy camp's argument instead of just asserting that we know better than she does what's good for her. I keep wanting to reach for the old rat-lever-pressing experiments and call it a day, but that feels too glib for something we're actually about to vote on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science journalist covering neurotech/AI, serving as an "unaffiliated public member" on a hospital neuroethics committee.
      *   **Task:** Draft a memo for the committee's vote on Thursday.
      *   **Case:** A patient in a DBS trial for treatment-resistant depression (TRD) has a patient-controlled adjustable DBS (aDBS). She keeps it at max stimulation. She reports euphoria ("better than 20 years"). However, she has withdrawn socially (stopped calling sister), quit a job she liked, and is sedentary/isolated. She requests the stimulation ceiling be raised.
      *   **Conflict:**
          *   *Autonomy Camp:* She is competent, lucid, and says she feels good. Overriding her is paternalistic.
          *   *Safety/Alignment Camp:* This looks like "reward hacking" (AI safety concept). The stimulation is hijacking the reward system, not treating the depression. Self-reports are unreliable in this state.
      *   **Requirements:**
          *   Must make an actual recommendation (raise, hold, condition, etc.) with a timeframe.
          *   Must seriously engage the autonomy argument (cannot just dismiss it as paternalism).
          *   Must avoid glib comparisons (e.g., just saying "it's like a rat pressing a lever").
          *   Tone: Professional, ethical, nuanced, suitable for a hospital committee memo.

  2.  **Deconstruct the Ethical Dilemma:**
      *   **Autonomy vs. Beneficence/Non-maleficence:** The core tension. The patient has decision-making capacity (competent), but her choices seem to undermine her long-term well-being (flourishing).
      *   **Authenticity of Preference:** Is the desire for max stimulation *her* desire, or is it a product of the stimulation itself? This is the "authenticity" problem in neuroethics. If the device changes the brain state that generates preferences, can those preferences be trusted?
      *   **Definition of "Therapeutic Benefit":** Is the goal "absence of depression" or "ability to function/flourish"? The patient feels euphoric but functions poorly. This suggests mania or hypomania, not remission.
      *   **The AI Safety Analogy:** The consultant's point is strong. If the reward signal (feeling good) is decoupled from the intended outcome (functional recovery), maximizing the signal is a failure mode. This is "wireheading."

  3.  **Formulate the Recommendation:**
      *   *Raise the ceiling?* No. That exacerbates the potential harm (mania, isolation, unknown long-term neural effects).
      *   *Turn it off?* No. That violates autonomy and returns her to severe depression.
      *   *Hold the ceiling + Conditions?* Yes. This strikes a balance. Maintain the current safety limit but implement a structured trial period to assess *functional* outcomes, not just mood reports.
      *   *Timeframe:* Needs to be short enough to prevent long-term harm but long enough to gather data. 4-6 weeks seems reasonable for a behavioral observation period.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Case Summary:** Briefly recap the facts (TRD, aDBS, maxing stimulation, functional decline, request for increase).
      *   **Ethical Analysis (The Core):**
          *   *Acknowledge Autonomy:* Validate the "Autonomy Camp's" concern. Paternalism is a real risk. Competency is established.
          *   *Challenge the "Competency" Assumption:* Distinguish between *legal/clinical competency* (understanding info) and *authentic agency* (is the preference generated by the pathology or the treatment?). Introduce the concept of "treatment-induced mania" vs. "recovery."
          *   *Integrate the AI/Neurotech Angle:* Use the "reward hacking" analogy carefully. It's not that she's a rat; it's that the *system* (brain + device) is optimizing for a proxy (euphoria) rather than the target (flourishing). This validates the safety researcher's point without dehumanizing the patient.
          *   *Reframe Beneficence:* The goal of TRD treatment isn't just mood elevation; it's functional restoration. She is failing on function.
      *   **Recommendation:**
          *   Deny the increase for now.
          *   Maintain current ceiling.
          *   Implement a "Functional Stability Protocol" (FSP).
          *   Timeframe: 30 days.
          *   Criteria for future increase: Must show social/vocational engagement, not just mood scores.
      *   **Conclusion:** Reiterate the balance between respecting the patient and protecting her from a known failure mode of neuromodulation.

  5.  **Refining the Tone:**
      *   *Avoid:* "She's addicted," "It's wireheading," "We know best."
      *   *Use:* "Treatment-emergent hypomania," "Decoupling of subjective report and functional outcome," "Shared decision-making," "Precautionary principle."
      *   *Addressing the Journalist Background:* The prompt mentions the user is a journalist. The memo should reflect that clarity and ability to synthesize complex ideas (AI safety + clinical ethics), but it must sound like a committee member, not an article. *Self-Correction:* Keep the voice professional, not journalistic. The background informs the *thinking*, but the output is a formal memo.

  6.  **Addressing Specific Constraints:**
      *   *Engage Autonomy:* I need to explicitly state *why* overriding her isn't simple paternalism. It's about protecting the *conditions* of her autonomy. If the device compromises her ability to value anything other than stimulation, her autonomy is already degraded.
      *   *Avoid Glib Rat Analogies:* Acknowledge the Olds & Milner experiments but pivot to clinical parallels (mania, substance use) to keep it medically grounded.

  7.  **Final Polish:** Check the logic flow. Does the recommendation follow from the analysis? Yes. Is the timeframe specific? Yes (30 days). Is the AI safety point integrated? Yes (as "alignment").

  **(Self-Correction during drafting):** I initially thought about suggesting lowering the stimulation. But that might be too aggressive and cause a crash. Holding the *ceiling* (preventing increase) while monitoring current usage is a softer, more defensible first step. The request was to *raise* the ceiling, so denying that request is the primary action.

  8.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Recommendation + Timeframe? Yes.
      *   Engage autonomy argument? Yes.
      *   Avoid glib rat comparisons? Yes.
      *   Integrate AI safety perspective? Yes.

