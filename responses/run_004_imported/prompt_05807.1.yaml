answer: |-
  You have hit on something that many introductory summaries miss entirely. Your intuition is spot-on: **these are not the same argument played twice.** While traditional historiography often lumps the *School of Names* (Ming Jia) together as "sophists" who enjoyed linguistic parlor tricks, a close reading reveals that Gongsun Long is doing two fundamentally different kinds of philosophical work in these two dialogues.

  You are not forcing a Western filing cabinet onto the text; you are correctly identifying a shift in the *locus* of the argument. One is primarily semantic (about how language maps to the world), and the other is primarily metaphysical/epistemological (about the nature of reality and perception).

  Here is the side-by-side breakdown of the argumentative machinery, followed by a verdict on which one holds water today.

  ---

  ### 1. The White Horse Discourse (*Bai Ma Lun*)
  **The Claim:** A white horse is not a horse.
  **The Engine:** Semantics and Class Logic (Intension vs. Extension).

  **How the argument works:**
  Gongsun Long is not denying that a white horse is a biological equine. He is arguing about the **terms** "horse" and "white horse."
  *   **Premise 1:** The term "horse" names a **shape/form**.
  *   **Premise 2:** The term "white" names a **color**.
  *   **Premise 3:** The term "white horse" names **shape + color**.
  *   **The Move:** If you ask for a "horse," a yellow horse or a black horse will satisfy the request. If you ask for a "white horse," a yellow horse will *not* satisfy the request.
  *   **Conclusion:** Since the set of things that satisfy "horse" is different from the set of things that satisfy "white horse," the two terms are not identical. Therefore, "white horse" is not "horse."

  **The Philosophical Work:**
  This is an argument about **reference and identity**. In modern logic, we would say Gongsun Long is distinguishing between *class membership* ("a white horse is a member of the class 'horse'") and *identity* ("the concept 'white horse' is identical to the concept 'horse'"). He is arguing that $A \subset B$ does not mean $A = B$.

  It is a defense of linguistic precision. If we allow "white horse" to be loosely equated with "horse," language loses its ability to distinguish specific actualities (*shi*) from general names (*ming*).

  ### 2. The Hard and White Discourse (*Jian Bai Lun*)
  **The Claim:** Hard, White, Stone: Two (not three).
  **The Engine:** Epistemology and Ontology of Properties (Universals).

  **How the argument works:**
  Here, Gongsun Long leaves language behind and looks at **perception**.
  *   **Premise 1 (Epistemology):** Your eye sees the whiteness, but it cannot feel the hardness. Your hand feels the hardness, but it cannot see the whiteness.
  *   **Premise 2 (Separation):** Because no single sense faculty can grasp both hardness and whiteness simultaneously, they are ontologically separate. They do not "contain" each other.
  *   **Premise 3 (The "Hiding" / *Zicang*):** When you are not looking at the stone, the whiteness doesn't vanish; it "hides." When you are not touching it, the hardness "hides."
  *   **The Move:** If hardness and whiteness can exist (in a hidden state) without the stone, and they are perceived separately, they are independent entities. The "stone" is just a temporary placeholder where these two independent universals happen to overlap.
  *   **Conclusion:** When you perceive the object, you are perceiving (Stone + White) OR (Stone + Hard). You never perceive all three as a unified whole. Therefore, the count is "Two," not "Three."

  **The Philosophical Work:**
  This is an argument about **Universals**. Gongsun Long is claiming that properties (Hardness, Whiteness) have an existence independent of the objects that bear them. This is strikingly similar to Platonic Realism. He is arguing that "Hardness" itself exists in the metaphysical ether, waiting to manifest in a stone, a piece of iron, or a diamond. The stone is secondary; the qualities are primary.

  ---

  ### Is this a Western Imposition?

  You asked if you are forcing "logic vs. epistemology" onto a text that sees them as one maneuver.

  **The Verdict:** You are making a valid distinction, but the Chinese context binds them tighter than the Western one.
  In the Warring States period, the crisis was the **Rectification of Names** (*Zheng Ming*). The social order was collapsing because words no longer matched realities (kings acting like subjects, subjects acting like kings).
  *   **White Horse** fixes the *Names* (ensuring "horse" doesn't sloppy cover "white horse").
  *   **Hard and White** fixes the *Realities* (ensuring we understand that properties are distinct actualities).

  So, while they serve the same *political/social* goal (stabilizing the relationship between word and world), the **philosophical mechanisms** are indeed different. One fixes the label; the other dissects the object. You aren't imposing Western categories; you are noticing that Gongsun Long used different tools for different jobs.

  ---

  ### Which One Holds Up as Serious Philosophy?

  If we strip away the historical context and ask which argument still does heavy lifting in modern philosophy, the answer is surprising.

  **The "White Horse" argument is logically sound but philosophically thin.**
  It holds up as a lesson in semantics. It is essentially a warning against the ambiguity of the word "is."
  *   "A white horse *is* a horse" (is a member of).
  *   "A white horse *is not* a horse" (is not identical to the concept).
  Once you clarify the logic, the paradox dissolves. It's a clever linguistic puzzle, but it doesn't tell us much about the nature of reality. It's a "verbal trick" only if you refuse to define your terms; if you define them, it's just basic set theory.

  **The "Hard and White" argument is metaphysically radical and still contested.**
  This is the serious heavyweight. Gongsun Long is arguing for **Property Realism**.
  *   **Does "Redness" exist if there are no red things?**
  *   **Does "Pain" exist if no one is feeling it?**

  Modern philosophy is still fighting this battle.
  *   **Nominalists** say: No. "Hardness" is just a word we use to group similar stones. There is no "Hardness" floating in the void.
  *   **Realists** (like Gongsun Long) say: Yes. There are objective properties that objects instantiate.

  Gongsun Long's argument about sensory modalities (vision vs. touch) also anticipates modern philosophy of mind debates about **Qualia** and the **Binding Problem**. How does the brain combine "hard" and "white" into a single object experience if the sensory inputs are distinct? Gongsun Long's answer is radical: *Maybe they aren't combined in reality, only in our temporary perception.*

  ### The Final Verdict

  **The "Hard and White" discourse is the superior philosophical argument.**

  Here is why:
  1.  **Depth:** *White Horse* is about how we talk. *Hard and White* is about what exists. Metaphysics is generally considered "deeper" than semantics.
  2.  **Durability:** The semantic point of *White Horse* was largely solved by the development of formal logic (Frege, Russell, etc.). The metaphysical point of *Hard and White* (the status of Universals and the independence of properties) is **still unsolved**. Philosophers today are still writing papers on whether properties are particular to objects or universal entities.
  3.  **The "Trick" Factor:** *White Horse* feels like a trick because it relies on the ambiguity of natural language. *Hard and White* feels weird, but not like a trick. It is a coherent, albeit extreme, ontological stance. It demands you take the independence of qualities seriously.

  **Summary:**
  You were right to feel they were different. The *White Horse* is a lesson in **logic and language** (don't confuse the subset with the set). The *Hard and White* is a lesson in **metaphysics** (properties may be more real than objects).

  If you want to impress a philosopher, cite *White Horse* as an ancient precursor to set theory. But if you want to find Gongsun Long's genuine, strange, and enduring insight, stick with *Hard and White*. It argues that the world is not made of "things" like stones, but of floating attributes like "hard" and "white" that briefly crash into each other. That is a serious, defensible, and mind-bending view of reality.
