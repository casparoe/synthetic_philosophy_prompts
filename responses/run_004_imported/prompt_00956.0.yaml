answer: |-
  Your friend is correct: you are misremembering Anscombe's argument. In fact, you've described the exact *opposite* of her position.

  G.E.M. Anscombe (Elizabeth Anscombe) was one of the most prominent philosophers of the 20th century, and she was a fierce critic of utilitarianism (the idea that the morality of an action is determined by its outcome, i.e., "the greatest good for the greatest number").

  Here is what actually happened, what she argued, and why the distinction matters.

  ### The Context
  In 1956, Oxford University proposed awarding an honorary doctorate to Harry S. Truman. Anscombe, then a professor at Oxford, circulated a pamphlet titled **"Mr. Truman's Degree"** urging the university to rescind the offer.

  ### The Argument You Attributed to Her (Utilitarian)
  You recalled her argument as: *The bombs killed more people than an invasion would have, so the math doesn't work.*

  This is a **consequentialist** argument. It accepts the premise that killing civilians is permissible *if* it results in fewer total deaths. It simply disputes the data. If Truman's team could have proven that an invasion would have cost 5 million lives and the bombs only cost 200,000, a utilitarian would have to say Truman did the right thing.

  ### Anscombe's Actual Argument (Deontological/Natural Law)
  Anscombe's argument was **not about the numbers.** Her argument was that **the intentional killing of innocent civilians is intrinsically evil**, regardless of the consequences.

  She argued that:
  1.  **Murder is absolute:** Deliberately targeting non-combatants is murder.
  2.  **Ends do not justify means:** Even if dropping the bombs shortened the war and saved lives overall, it was still an immoral act.
  3.  **Truman was a murderer:** By ordering the bombings, Truman committed mass murder. Honoring a mass murderer with a degree corrupts the moral standing of the university.

  In her pamphlet, she wrote:
  > "For men choose to kill innocent persons... and they choose to do so as a means to getting what they want... This is what Mr. Truman did."

  She explicitly rejected the "saved lives" justification. To Anscombe, arguing that the bombs were justified because they prevented an invasion was morally incoherent. It would be like arguing that raping a woman is justified because it prevents a war; the act itself is forbidden, no matter the outcome.

  ### Why the Distinction Matters
  The debate you had with your friend is a classic clash between two ethical frameworks:

  *   **Your Friend (Utilitarian/Consequentialist):** Focuses on outcomes. Was the net result fewer deaths? If yes, it was justified.
  *   **Anscombe (Absolutist/Deontologist):** Focuses on actions. Was the act itself (killing innocents) inherently wrong? If yes, it was unjustified, even if the net result was fewer deaths.

  By claiming Anscombe argued the "math didn't check out," you inadvertently conceded the utilitarian framework. You implied that if the math *had* checked out (i.e., if an invasion would have definitely killed more people), then Truman would have been in the clear.

  Anscombe's point was that Truman was **not** in the clear, even if the invasion would have killed ten times as many people.

  ### The Outcome
  Anscombe's protest was quite famous. She gathered signatures from other faculty members (though not as many as she hoped). Ultimately, Oxford decided not to award Truman the degree. While historians debate how much Anscombe's protest directly influenced the decision versus other political factors, it remains a landmark moment in applied ethics.

  ### Summary
  You are misremembering the argument. Anscombe did not argue that Truman was wrong because he miscalculated the body count. She argued he was wrong because **he murdered innocents**, and no amount of body-count math can justify murder.

  If you want to hold the Anscombe position in future debates, you have to be willing to argue that the bombings were morally impermissible *even if* they did save more lives than an invasion would have cost. That is a much harder (and philosophically distinct) hill to die on than arguing about invasion casualty estimates.
