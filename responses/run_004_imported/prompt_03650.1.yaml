  8.  **Self-Correction during drafting:** I need to be careful not to anthropomorphize Kant. He wouldn't say "AI has rights." He wouldn't even say "AI is like an animal." He would say "You are a human, and humans who torture things that scream become torturers." The distinction is subtle but vital. The "Animal Route" is the right *category* of argument (indirect duty via sympathy), even if the *object* doesn't fit the biological criteria. Actually, it might be a hybrid: It's the *Nature Route* (it's a thing) but the *mechanism* is the *Animal Route* (sympathy). I should clarify this intersection.
