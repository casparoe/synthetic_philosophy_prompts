  5.  Recommendations for the Board meeting.

  *Wait, one nuance on Interventionism:* In symmetric overdetermination, standard interventionism *also* struggles if we define causation strictly as "changing the outcome." If $C1=1, C2=1, E=1$. Intervention $C1=0 \rightarrow E=1$ (because $C2=1$). So $E$ doesn't depend on $C1$. Woodward handles this via *causal models* where both paths are active. The *structure* implies both are causes. I need to be precise here so I don't sound like I'm claiming Interventionism magically solves overdetermination without qualification. It solves it by shifting focus from outcome-dependence to *path-activity*.

