prompt: |-
  So I'm a 3rd year phil PhD student (working mostly in phil of language / logic) and this term I'm sitting in on a vagueness seminar that is honestly wrecking me in a good way. We spent the last couple weeks on epistemicism (Williamson, Sorensen) vs. supervaluationism (Fine, Keefe) as responses to the sorites paradox, and I feel pretty solid on the "first-order" story for both — why they each want to preserve classical logic and bivalence, why supervaluationists define truth as truth-on-every-admissible-precisification while epistemicists just bite the bullet and say there's a genuine, totally precise, unknowable fact about exactly how many grains make a heap.

  Where I keep getting stuck, and where a friend and I got into a whole argument about last week, is higher-order vagueness. Supervaluationism's whole sales pitch is "no sharp boundries, just admissible precisifications respecting penumbral connections," but then you ask whether some case is *definitely* a borderline case, and all of a sudden you need a fact about which precisifications count as admissible — and that notion of admissibility seems just as vague as the original predicate was. So isn't the sharp cutoff just getting pushed up a level instead of actually eliminated? My advisor said in passing that epistemicism has an easier time with this regress since it can basically just say "ignorance about ignorance, all the way up," but didn't really unpack why that move is available to epistemicists and not supervaluationists, and it's been bugging me since.

  Could you actually compare how the two theories handle higher-order vagueness specifically (not the first-order sorites stuff, I've got that part down), and give me your honest opinon on which one has the more principled, less ad hoc response to it? I want to walk into section this week with an actual position I can defend, not just a neutral "well, both sides have problems" summary.
