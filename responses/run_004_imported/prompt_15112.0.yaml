answer: |-
  This is a fantastic question, and honestly, it's a reaction almost every methods-heavy PhD student has when they first encounter the causal inference literature after being steeped in traditional econometrics. It feels like Pearl handed us a calculator for causation, rendering the centuries of philosophical debate obsolete.

  However, the short answer is: **No, philosophy isn't redundant, but the division of labor has shifted.** You aren't missing something obvious, but you might be conflating *epistemology/computation* (how we identify and estimate effects) with *metaphysics/semantics* (what causation *is* and what makes a causal statement true).

  Here is the breakdown of why philosophers (even those who like Pearl) still write about Lewis, why Woodward is the better comparison for Pearl, and where the friction remains.

  ### 1. Metaphysics vs. Representation
  David Lewis's 1973 theory ("Causation as Counterfactual Dependence") is not a method for calculating effects. It is a theory of **truth conditions**. Lewis was asking: *"When I say 'A caused B', what makes that sentence true in the actual world?"*

  His answer involved similarity ordering of possible worlds. It was an attempt to ground causation in a broader metaphysical system (Humean supervenience).

  Pearl's SCMs, by contrast, are a **representation and inference framework**. Pearl says: *"If you are willing to assume these structural equations and this DAG, here is how you compute the counterfactual."*

  *   **The Philosophers' Grip:** Philosophers argue that Pearl's framework *presupposes* causation. To draw the arrows in the DAG, you already need to know the causal structure. Pearl tells you how to propagate causal information, but he doesn't tell you where it comes from ontologically. Lewis (and his successors) are trying to explain the nature of the "glue" that justifies drawing the arrow in the first place.
  *   **The Economist's Grip:** You don't care about the metaphysical glue. You care about identification. If the DAG is justified by theory or institutional knowledge, Pearl's calculus gives you the answer. For your purposes, Lewis *is* largely redundant. But for a metaphysician, Pearl hasn't answered the "why" question.

  ### 2. Lewis vs. Woodward vs. Pearl
  You mentioned Woodward as if he and Pearl are on one team against Lewis. That's mostly right, but it's nuanced.

  *   **Lewis (Similarity):** Counterfactuals are true if they hold in the "closest" possible world where the antecedent is true. This is vague. How do we measure "closeness"?
  *   **Woodward (Interventionism):** Causation is about invariance under intervention. $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$.
  *   **Pearl (Structural):** Formalizes interventions via the $do()$ operator and counterfactuals via modified structural equations.

  Pearl explicitly aligns himself closer to **Woodward** than Lewis. In *Causality*, Pearl notes that his structural counterfactuals avoid the vagueness of Lewis's "similarity" metric. In an SCM, the "closest world" where $X=x$ is precisely defined by the surgical modification of the equation for $X$, holding all other mechanisms (and exogenous errors) constant.

  **So why do philosophers still defend Lewis?**
  1.  **Non-Interventionist Causation:** Woodward and Pearl rely on the concept of an "intervention." But what about causation where interventions are impossible or nonsensical? (e.g., macroeconomic historical events, certain quantum phenomena, or causal relations between properties rather than events). Lewis's similarity metric attempts to handle these without requiring an "agent" to intervene.
  2.  **Transitivity:** Lewis wanted causation to be transitive ($A \to B \to C$ implies $A \to C$). Woodward and Pearl generally reject transitivity (and for good reason, see preemption cases). Philosophers still debate whether transitivity is a necessary feature of the *concept* of causation, even if it fails in practice.
  3.  **The "Truth" of Counterfactuals:** Even if Pearl gives us a calculus, is the *truth* of the counterfactual determined by the structural equations, or do the structural equations merely model a deeper truth? Lewisians argue the latter.

  ### 3. The Problem of "Structural Assumptions"
  In your seminar, the professor likely said, "Once you have a full SCM..." That is the massive "if."

  In econometrics, we justify the SCM using theory, natural experiments, or institutional knowledge. But when those run out, we are left with untestable assumptions.
  *   **Philosophy's Job:** Analyzing the justification of those assumptions. When is it legitimate to assume modularity (that we can change one equation without changing others)? When is it legitimate to assume no unmeasured confounding?
  *   **Preemption and Overdetermination:** Consider the classic case: Suzy and Billy both throw rocks at a bottle. Suzy's hits first and shatters it. Billy's would have, but didn't.
      *   **Lewis (1973):** Struggled here. If Suzy hadn't thrown, Billy's would have shattered it. So the bottle shattering is *not* counterfactually dependent on Suzy. Lewis had to revise his theory (2000) to handle "quasi-dependence."
      *   **Pearl/SCM:** Handles this easily via structural equations (setting $Suzy=0$ while keeping $Billy=1$).
      *   **The Philosophical Debate:** Philosophers still write about this not because they think Pearl's math is wrong, but because they are debating whether the SCM solution captures the *intuitive concept* of causation or if it just bypasses the intuition with a formal trick. They are analyzing the *mapping* between the math and the concept.

  ### 4. Disciplinary Silos
  There is a genuine disconnect between the fields:
  *   **Economics/Stats:** Causation is a tool for policy and prediction. If the $do$-calculus works, the metaphysics don't matter.
  *   **Philosophy:** Causation is a fundamental category of reality. They care about whether the tool *misrepresents* reality, even if it yields good predictions.

  However, there is a growing consensus in **philosophy of science** (distinct from metaphysics) that Pearl/Woodward won the day regarding *scientific* causation. If you look at journals like *Philosophy of Science* or *British Journal for the Philosophy of Science*, the "Lewisian possible worlds" approach is definitely on the decline in favor of interventionist/structural accounts.

  But you will still see Lewis defended in **metaphysics** journals (*Nous, Mind, Philosophy and Phenomenological Research*). That's because metaphysicians are often interested in causation as it relates to laws of nature, time, and modality, where the interventionist story gets murky.

  ### 5. Summary: Are they redundant?
  *   **For an Econometrician:** Yes, Lewis is functionally redundant. You need Pearl/Imbens/Angrist, not Lewis. If you try to use "closest possible worlds" to identify an IV, you will fail.
  *   **For a Philosopher:** No. Pearl provides a syntax, but philosophers are still arguing about the semantics and ontology.
  *   **The Consensus:** The consensus outside philosophy departments (in stats, CS, econ) is indeed that Pearl/SCMs are the standard. The consensus *inside* philosophy of science is largely pro-interventionism (Woodward/Pearl). The consensus in *pure metaphysics* is still mixed because they are playing a different game (analyzing concepts vs. analyzing data).

  **Takeaway for your PhD:**
  Your professor is right that Pearl made causation *rigorous for inference*. But don't make the mistake of thinking that rigor in *computation* solves rigor in *conceptualization*. When you write your job market paper and defend your exclusion restrictions, you are making philosophical claims about modularity and independence. You might not need Lewis to defend them, but you are definitely standing on ground that philosophers mapped out.

  If you want to read one thing that bridges this gap, look up **James Woodward's *Making Things Happen***. It will feel very familiar to your econ training but explains *why* the interventionist account is philosophically robust in a way Lewis's isn't. It validates your intuition that Lewis is less useful for science, without dismissing the philosophical project entirely.
