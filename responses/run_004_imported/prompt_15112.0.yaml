prompt: |-
  Ok this has been bugging me since my causal inference seminar today (I'm in an economics PhD program, methods-heavy track). We spent the whole session on Pearl's do-calculus and structural causal models, and my prof basically said this is what finally made philosophical theories of causation rigorous instead of hand-wavy metaphysics. It really does seem like once you have a full SCM, you can generate any counterfactual you want just by solving the modified equations, so why do philosophers still write papers defending Lewis's closest-possible-worlds counterfactual theory like its a serious rival to the interventionist approach? Feels like Pearl and Woodward already won and made the whole counterfactual theory redundant. Am I missing something, or is that basically the consensus now outside philosophy departments?
