prompt: |-
  So this semester I'm taking a research methods class for my psych major, and last week we spent basically a whole lecture on Simpson's paradox -- my professor's big line was that the paradox doesn't actually get "solved" by crunching more numbers, it gets solved by figuring out the causal story behind why the groups differ in the first place, which I'm still chewing on. Anyway, I ended up arguing about this with my roommate last night because it turns out to be extremely relevant to something happening on the Learning Support Advisory Committee, which I sit on as the student rep.

  Here's the situation: the committee has to decide by next Tuesday whether to renew, expand, or cut funding (about $80k/year) for our college's Supplemental Instruction (SI) program, where upperclassmen run extra study sessions attached to specific gateway courses. The provost's office gave us the pass-rate data, and depending on how you slice it, it tells opposite stories. Overall, across the whole student body, kids who went to SI passed their course at about 77% (347/450) vs about 86% (475/550) for non-attendees -- so on paper SI attendees do worse, and two committee members want to kill the program over this. But broken down by course it flips: in Calc I, SI attendees passed at 75% (300/400) vs 65% (65/100) for non-attendees, and in Intro Psych, SI attendees passed at 94% (47/50) vs about 91% (410/450) for non-attendees -- SI attendees do better in both courses individually. The reversal happens because SI attendance is way more concentrated in Calc I (which has a much lower baseline pass rate for everybody, SI or not) than in Psych. Our committee chair pointed this out and wants to expand SI, but the member who wants to cut it says breaking the data down by course just lets us keep slicing it until we land on whatever story we already wanted, and that the trustees are only ever gonna ask about the topline number anyway.

  I have to actually write the one-page recommendation memo for Tuesday, and I dont want to just yell "Simpson's paradox!" and call it a day -- I want it to seriously engage with the "you're just cherry-picking your slice" objection, since it kind of nags at me too even though I suspect it's wrong here. Could you draft that memo for me: a clear recommendation with a timeline for how we'd check it's actually working, and reasoning solid enough that it'd definately survive being read out loud to the one committee member who thinks this is all statistical sleight of hand?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Psychology major taking Research Methods. Learned about Simpson's Paradox (causal story > just numbers).
      *   **Situation:** Student rep on Learning Support Advisory Committee. Decision needed by next Tuesday on Supplemental Instruction (SI) program funding ($80k/year). Options: Renew, Expand, Cut.
      *   **The Data (Simpson's Paradox in action):**
          *   *Overall:* SI Attendees (77% pass) < Non-Attendees (86% pass). *Looks like SI hurts performance.*
          *   *Calc I:* SI Attendees (75% pass) > Non-Attendees (65% pass). *SI helps.*
          *   *Intro Psych:* SI Attendees (94% pass) > Non-Attendees (91% pass). *SI helps.*
          *   *Confounding Variable:* Course difficulty/enrollment distribution. SI is concentrated in Calc I (harder), Non-SI concentrated in Psych (easier).
      *   **The Conflict:** Chair wants to expand (recognizes paradox). One member wants to cut (cites topline number, claims stratification is cherry-picking/sleight of hand). Trustees care about topline numbers.
      *   **Task:** Draft a one-page recommendation memo.
      *   **Requirements:**
          *   Clear recommendation (Renew/Expand/Cut).
          *   Timeline for checking efficacy (addressing the "prove it's working" aspect).
          *   Reasoning that addresses the "cherry-picking" objection (engaging with the causal story, not just yelling "Simpson's Paradox").
          *   Tone: Professional, persuasive, evidence-based, suitable for a committee including skeptics.

  2.  **Determine the Recommendation:**
      *   The data clearly shows SI helps within *both* courses. The aggregate negative correlation is spurious due to self-selection bias (students in harder classes seek more help).
      *   Cutting the program would likely harm student success, especially in gateway STEM courses.
      *   *Recommendation:* **Renew and Expand** (specifically targeting high-difficulty courses).

  3.  **Address the "Cherry-Picking" Objection:**
      *   The skeptic argues that slicing data allows you to find any pattern.
      *   *Counter-argument:* Slicing isn't arbitrary here; it's based on *causal mechanisms*. Course difficulty is a known confounder. Students don't choose SI randomly; they choose it based on perceived need (course difficulty).
      *   *Key Concept:* Control for confounding variables. We aren't slicing to hide the truth; we are slicing to isolate the treatment effect.
      *   *Trustee Concern:* Trustees care about the topline. If we expand SI to more hard courses, the topline *will* eventually drop unless we account for the mix. We need to explain *why* the topline is misleading and propose a better metric (e.g., "value-added" or course-specific benchmarks).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the ask immediately. Renew and Expand.
      *   **The Data Problem (The "Why"):** Explain the aggregate vs. stratified data without using jargon like "Simpson's Paradox" (or using it carefully). Focus on *selection bias*. Students in Calc I need more help than Psych students. Comparing all SI students to all Non-SI students compares apples to oranges.
      *   **Addressing the Skeptic (The "Cherry-Picking" Rebuttal):** This is crucial. Acknowledge the risk of over-stratification but justify *this* stratification.
          *   *Argument:* We aren't slicing randomly. We are controlling for *course difficulty*, which is the primary driver of pass rates.
          *   *Analogy:* Comparing ER survival rates without accounting for patient severity.
          *   *Future Proofing:* Propose a new metric for the trustees so the topline doesn't look bad even if success improves.
      *   **Implementation & Evaluation (The Timeline):** How do we prove it's working going forward?
          *   Semester 1: Renew current funding.
          *   Semester 2: Expand to other high-risk courses.
          *   Ongoing: Matched-pair analysis (GPA, SAT, etc.) to further control for selection bias.
      *   **Conclusion:** Reiterate the value.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is the tone too academic?
      *   *Fix:* Keep it business-like. Use bolding for key points.
      *   *Critique:* Did I address the trustee concern?
      *   *Fix:* Explicitly mention how to report to trustees. If we expand SI to more hard classes, the overall pass rate might dip statistically even if students do better. We need to recommend reporting "Course-Normalized Pass Rates."
      *   *Critique:* Is the causal story clear?
      *   *Fix:* Emphasize that SI attendance is *endogenous* (driven by need), not random. The "treatment" (SI) is sought by those most at risk.

  6.  **Final Review against Constraints:**
      *   One-page length (keep it tight).
      *   Address the "sleight of hand" accusation directly.
      *   Include timeline/evaluation plan.
      *   No yelling "Simpson's Paradox!" (use the logic, not just the label).

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Subject:* Recommendation on SI Program Funding.
      *   *Opening:* Recommend renewal and targeted expansion.
      *   *Data Analysis:* Acknowledge the 77% vs 86% gap. Explain it's due to Calc I concentration. Show the within-course gains (+10% in Calc, +3% in Psych).
      *   *The Skeptic Point:* "Isn't this slicing?" No, it's controlling for risk. Like a hospital treating sicker patients.
      *   *Plan:* Continue funding. Next semester, add Chem I. Evaluate using matched controls (prior GPA) to prove it's not just motivated students.
      *   *Reporting:* Change how we report to trustees. Don't just use raw average. Use "expected vs. actual" pass rates.

  8.  **Final Polish:** Check the math in the prompt to ensure accuracy in the memo.
      *   Calc I: 300/400 (75%) vs 65/100 (65%).
      *   Psych: 47/50 (94%) vs 410/450 (91.1%).
      *   Overall: 347/450 (77.1%) vs 475/550 (86.3%).
      *   *Wait, check the totals:*
          *   SI Total: 300+47 = 347 passed. 400+50 = 450 total. (Matches prompt).
          *   Non-SI Total: 65+410 = 475 passed. 100+450 = 550 total. (Matches prompt).
      *   *Okay, numbers are consistent.*

      *(Self-Correction on "Cherry-Picking" argument)*: I need to make sure I don't sound condescending to the committee member. Frame it as "Risk-Adjusted Metrics" rather than "You are wrong about statistics."

      *(Timeline)*: Keep it realistic. Decision by Tuesday. Renewal for next sem. Expansion for following sem. Evaluation report in one year.

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Learning Support Advisory Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Supplemental Instruction (SI) Program Funding

  **Recommendation**
  I recommend the Committee **renew** the current $80k funding for the Supplemental Instruction (SI) program immediately and **expand** the program to include additional high-risk gateway courses (e.g., General Chemistry) for the following academic year.

  **Data Analysis and Causal Context**
  The decision to cut funding rests on aggregate data showing SI attendees pass at lower rates than non-attendees (77% vs. 86%). However, this aggregate figure masks a critical confounding variable: **course difficulty and self-selection.**

  SI attendance is not random; it is driven by academic need. 89% of SI attendees are enrolled in Calculus I (a high-difficulty course), whereas 82% of non-attendees are in Introductory Psychology (a lower-difficulty course). When we control for course difficulty, the trend reverses:
  *   **Calculus I:** SI attendees pass at **75%**, significantly higher than the **65%** non-attendee rate.
  *   **Intro Psych:** SI attendees pass at **94%**, higher than the **91%** non-attendee rate.

  **Addressing the "Data Slicing" Concern**
  A valid concern has been raised that stratifying data allows us to "cherry-pick" favorable slices. In research terms, this is the risk of over-stratification. However, distinguishing by course here is not arbitrary slicing; it is **risk adjustment.**

  Consider a hospital evaluation: if Hospital A takes mostly critical trauma patients and Hospital B takes mostly routine check-ups, Hospital A will have a higher overall mortality rate. Judging Hospital A as "worse" based on that topline number would be erroneous. We must compare outcomes *within* risk categories. Similarly, comparing a Calculus student to a Psychology student without accounting for course baseline difficulty yields a misleading "topline" that penalizes students for seeking help in harder classes.

  To address Trustee concerns regarding topline numbers, we must change *how* we report success. We should report **Course-Normalized Pass Rates** (actual pass rate vs. historical baseline for that specific course) rather than a raw institutional average. This prevents the statistical artifact where improving student success in hard courses makes the institution's overall average look worse.

  **Implementation and Evaluation Timeline**
  To ensure this recommendation is data-driven and not merely theoretical, I propose the following evaluation plan:

  *   **Spring Semester (Immediate):** Renew current funding. Maintain SI attachment to Calculus I and Intro Psych.
  *   **Fall Semester (Expansion):** Expand SI to General Chemistry I. Collect baseline pass rates for non-SI sections to establish a control.
  *   **One-Year Review (Next October):** The Committee will review a "Matched-Pair Analysis." We will compare SI attendees to non-attendees with *similar prior GPAs and SAT scores*. This controls for student motivation, isolating the SI program's specific effect on learning.
  *   **Reporting:** All future reports to the Board of Trustees will include risk-adjusted metrics alongside raw data to prevent misinterpretation of aggregate trends.

  **Conclusion**
  Cutting the SI program based on aggregate data would inadvertently punish students in rigorous majors for utilizing support resources. The stratified data provides the accurate causal story: SI improves pass rates within every course context. By renewing and expanding the program while adopting risk-adjusted reporting, we protect student success and ensure our data accurately reflects that success to the administration.
