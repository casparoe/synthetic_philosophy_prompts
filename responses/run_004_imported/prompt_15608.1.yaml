answer: |-
  **Setting:** *The Original Position. A timeless, featureless space. Two parties, ROWAN and HART, stand behind the Veil of Ignorance. They know general facts about sociology, economics, and psychology, but they do not know their own talents, social status, generation, or specific conception of the good. They are mutually disinterested; they seek to advance their own future prospects as best they can, whatever those turn out to be.*

  **ROWAN:** We have to settle on a decision rule before we can evaluate the principles. I'm proposing we adopt the maximin rule. We rank the available social arrangements by the welfare of the worst-off position in each. We choose the arrangement where the minimum position is highest.

  **HART:** That seems prematurely restrictive. We are here to choose rationally. In decision theory, when an agent faces a set of mutually exclusive outcomes without specific knowledge of their likelihood, the standard rational procedure is the Principle of Insufficient Reason. We assign an equal probability to occupying every social position. If there are *n* positions, the probability of being in any one is 1/*n*. Then we maximize expected utility.

  **ROWAN:** That principle applies to games of *risk*, where the probability distribution is unknown but the sample space is well-defined. This isn't a roulette wheel. We don't know the number of possible social positions, nor do we know if the distribution of persons across them is uniform. To assign equal probability is not a neutral default; it's a substantive assumption about the structure of society that we have no evidence for.

  **HART:** But what's the alternative? To assign *no* probabilities? If you refuse to quantify the uncertainty, you aren't making a decision; you're paralyzed. Rationality requires consistency. If I have no reason to think I'll be a CEO rather than a laborer, treating those possibilities as symmetric is the only non-arbitrary move. If you reject equiprobability, you're implicitly asserting that some positions are *more* likely than others. Do you have evidence for that?

  **ROWAN:** I'm not asserting they are less likely. I'm asserting that probability calculus doesn't apply here. This is Knightian uncertainty, not risk. When the stakes involve the basic structure of society and the shape of a complete life, the "mathematical expectation" is a mirage. You're calculating an average across lives, but I will only live *one* life. I won't get to be the CEO in one iteration and the laborer in the next to average out the utility.

  **HART:** That's an emotional objection, not a decision-theoretic one. The singularity of the life doesn't change the rationality of the bet. If I offer you a gamble where you have a 99% chance of a lifetime of bliss and a 1% chance of a lifetime of drudgery, versus a guarantee of moderate comfort, expected utility says you take the gamble. The fact that you only play once doesn't make the math wrong; it just makes the variance high. Rational agents account for variance through risk-aversion coefficients in their utility function, not by abandoning expected utility entirely.

  **ROWAN:** But that's exactly the point. To adopt maximin isn't to plug in a high risk-aversion coefficient. It's to recognize that the choice here has three specific features that make maximin the dominant rule. First, the ignorance of probabilities is radical, as we said. Second, the person choosing cares very little for what might be gained above the minimum guarantee. Third, the rejected alternatives involve outcomes that are practically unacceptable.

  **HART:** Let's press that third condition. "Unacceptable." This is where your argument usually collapses into intuition. You're suggesting that under my expected utility rule, the worst-off position might be so dire that no amount of average gain compensates for it. But under my rule, we can build a floor. We can choose a form of utilitarianism that prioritizes basic needs. Why do we need the Difference Principle? Why must we maximize the minimum *lexicaly*, even if it means sacrificing massive gains for everyone else?

  **ROWAN:** Because of the strains of commitment. This isn't just about choosing a principle; it's about agreeing to abide by it once the Veil lifts. If we adopt your average utility rule, it is possible—indeed, likely—that we sacrifice the basic liberties or economic standing of a minority to increase the aggregate sum. If I emerge from the Veil and find I am in that sacrificed minority, I cannot reasonably be expected to affirm this social contract. I would be asked to accept my own impoverishment for the sake of others' surplus. That creates a instability in the society itself.

  **HART:** That sounds like a stability argument, not a choice argument. We are in the Original Position now. We are deciding what is *rational*, not what is psychologically easy to swallow later. If the expected value of my life is higher under average utilitarianism, it is rational to choose it. To say "I might be unhappy if I lose" is to say "I want insurance." Fine, buy insurance. But don't pretend that maximizing the minimum is the *only* rational way to buy it. Your lexical maximin leads to absurdities. Imagine two societies. In Society A, the worst-off have 10 units of welfare. In Society B, the worst-off have 11 units. But in Society A, everyone else has 1,000 units, and in Society B, everyone else has 20 units. Maximin forces you to choose Society B. You sacrifice 980 units for the majority for a single unit gain for the bottom. That isn't caution; that's irrational fetishism of the floor.

  **ROWAN:** You're presenting a caricature. The lexical priority applies to basic liberties first. Once those are secured, we aren't talking about abstract "units" of welfare. We are talking about primary goods: rights, liberties, opportunities, income, and the social bases of self-respect. The gap between 10 and 11 units in your example is trivialized. But consider the real-world equivalent. If we allow slavery to increase the average wealth of the free population, expected utility might endorse it. Maximin rules it out immediately. Is that absurd? Or is it the baseline of justice?

  **HART:** Slavery is easily ruled out by a constrained utilitarianism that weights basic rights heavily. You don't need maximin for that. My point is about the marginal trade-offs. If we follow your rule, we might prevent a policy that gives a huge boost to the middle and working class because it theoretically lowers the relative position of the very bottom by a fraction, or slows the growth of their share. You are letting the veto power of the worst-off position hold the rest of society hostage. From behind the Veil, why would I agree to a rule that caps my potential upside so severely, when I am statistically far more likely to be in the middle than at the absolute bottom?

  **ROWAN:** Because you don't know the statistics! That's the Veil. You can't say "I am statistically more likely to be in the middle." That relies on empirical data about class distribution that we've excluded. But beyond that, look at the nature of the loss. If I am in the middle in your utilitarian scheme, I gain surplus. If I am at the bottom, I lose the capacity to pursue *any* conception of the good. The loss at the bottom is non-linear. It's not just less utility; it's the loss of agency. Expected utility treats all losses as commensurable. They aren't. The loss of the social bases of self-respect cannot be compensated for by the fact that the aristocracy is having a wonderful time.

  **HART:** But that's just you asserting a specific utility function where the marginal utility of primary goods drops to zero after a certain point for the rich, but is infinite for the poor. That's a moral claim, Rowan. It's not a decision-theoretic necessity. I can construct a utility function where I value the average highly and still care about the floor, without making the floor *dictatorial*. By insisting on maximin, you are conflating "rational prudence" with "extreme caution." You're building a specific moral outcome—the Difference Principle—into the definition of rationality itself.

  **ROWAN:** And you are building "aggregation" into the definition of rationality. You assume that gains to some can compensate for losses to others. That's the definition of utilitarianism, not rationality. I'm saying that because the parties are distinct persons, the compensation doesn't happen. *I* don't get compensated by *your* gain. So, from my perspective, behind the Veil, the only guarantee I have is the floor. If the floor is unacceptable, the gamble is unacceptable. It's not about probability; it's about the irreversibility of the choice.

  **HART:** Irreversibility doesn't negate probability. If I jump out of a plane without a parachute, the choice is irreversible. But if there's a 99.9% chance a net appears, expected utility might still say jump. You're arguing that the "net" in my society—the safety net of utilitarianism—isn't high enough. Fine. Argue for a higher floor. But don't argue that we must ignore the heights we could reach above it. If we choose your Difference Principle, we might lock ourselves into a society that is poorer overall, meaning even the worst-off are worse off than they would be in a richer, slightly more unequal utilitarian society. Have you considered that? Maximin might hurt the very people it's designed to protect if inequality drives productivity.

  **ROWAN:** That is an empirical claim, and Rawls accounts for it. The Difference Principle permits inequality *if and only if* it improves the position of the worst-off. If your utilitarian society produces more aggregate wealth but leaves the bottom behind, my rule rejects it. If your utilitarian society produces more wealth and *also* raises the bottom, my rule accepts it. The divergence only happens when the aggregate grows at the expense of the minimum. And in that case, I ask you again: Can you stand before the person at the bottom and say, "Your life is harder so that the average is higher," and expect them to view that as just?

  **HART:** I can say, "We chose the rule that gave everyone the best expected start, and you had bad luck."

  **ROWAN:** But "bad luck" isn't a justification for justice. It's an admission that justice has failed.

  **HART:** And I say "guaranteeing the floor at the expense of the ceiling" is an admission that rationality has failed. We're at an impasse. You view the situation as one where the catastrophic outcome dominates the decision. I view it as one where the weighted sum of possibilities dominates.

  **ROWAN:** Because you see the parties as gamblers. I see them as architects of a permanent system.

  **HART:** And you see me as reckless. I see you as paralyzed.

  **ROWAN:** Then perhaps we need to look closer at the "strains of commitment." Not just whether I can endure the outcome, but whether the society can endure *me* in that outcome. If the principle we choose generates resentment that destabilizes the basic structure, it fails its own purpose.

  **HART:** Then we're no longer talking about the choice in the Original Position. We're talking about the consequences of the choice.

  **ROWAN:** The choice *is* about the consequences. That's the point of the Veil. It forces us to take the consequences seriously for *every* position, not just the average.

  **HART:** (Pauses) I concede that the "single life" constraint adds weight to the floor. But I cannot concede that it nullifies the probabilities entirely. To ignore the likelihood of being in the middle is to blindfold ourselves to the very data we use to navigate the world.

  **ROWAN:** And to rely on those probabilities is to gamble with a life you don't possess yet.

  *(Silence hangs between them. The menu of principles remains open. Neither rule has displaced the other; the tension between rationality as consistency and rationality as security remains unresolved.)*

  **HART:** We need to decide.

  **ROWAN:** I know. But we must be sure that whatever we choose, we can live with it when the Veil falls.

  **HART:** Agreed. But remember, Rowan: if you choose maximin, and we emerge into a world where we could have been kings, you bear the responsibility for that lost potential just as I bear the responsibility for the risk.

  **ROWAN:** And if you choose average utility, and we emerge into chains, you bear the responsibility for that suffering just as I bear the responsibility for the caution.

  **HART:** Then let us weigh the chains against the lost crowns.

  **ROWAN:** Carefully. For we are both, potentially, the one in chains.
