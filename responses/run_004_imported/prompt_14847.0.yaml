      *   **Alain Locke, "The New Negro" / General Philosophy:**
          *   *Core Argument:* Often characterized as "art for art's sake," but that's a simplification. Locke valued art as a vehicle for racial uplift *through* excellence, not necessarily direct agitation. He wanted Black artists to be free to explore universal themes and individual expression, not *just* racial propaganda.
          *   *Contrast:* Du Bois = Art must serve the racial cause directly. Locke = Art serves the race by proving cultural maturity and individual freedom (which indirectly helps the race).
      *   **The Debate:** It's not a hard binary (Propaganda vs. Pure Aestheticism), but for an intro course, the distinction is usually framed as Social Purpose (Du Bois) vs. Aesthetic Freedom/Individualism (Locke).

