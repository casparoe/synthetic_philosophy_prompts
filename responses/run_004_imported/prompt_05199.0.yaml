      *   **Section 1: The Situationist Case (The Teacher).** Focus on the Fundamental Attribution Error and the specific studies. Explain why it feels so convincing (the Maya story).
      *   **Section 2: The Dispositionalist Rebuttal.** Focus on the "Aggregation Principle" (Funder/Epstein). Explain why single instances are noise. Explain that traits are densities of states (Fleeson).
      *   **Section 3: Why the Verdict Favors Character.** Predictive power over time. The logical flaw in the Situationist argument (expecting perfect consistency).
      *   **Section 4: Re-evaluating Maya.** She is still generous; she had a "trait-relevant situation" override.
