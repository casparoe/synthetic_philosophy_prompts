  2.  **Deconstruct the Concepts:**
      *   **Hypocrisy (Standing via Consistency):** "You do X, I do X, you blame me for X." The focus is on the *blamer's* moral record regarding the specific norm. The key is usually the lack of acknowledgment or repentance.
      *   **Complicity (Standing via Causation/Authority):** "You made me do X, now you blame me for X." The focus is on the *relationship* regarding the specific act. The blamer might be a saint otherwise, but they manipulated, coerced, or enabled this specific act.

  3.  **Brainstorming Scenarios:**
