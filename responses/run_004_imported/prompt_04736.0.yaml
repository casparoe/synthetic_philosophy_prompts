      *   *Let's go back to the "Deadline" idea but refine the Complicity.*
      *   *Refined Complicity:* The blamer holds the standard "Finish on time." They *always* finish on time. But they withheld the password needed to finish. They aren't hypocritical about the standard (they follow it), but they are complicit in the failure.
      *   *Refined Hypocrisy:* The blamer never finishes on time. They gave me the password. I failed. They blame me.
      *   *Okay, this works.*

      *   *Alternative:* **The Intervention.**
