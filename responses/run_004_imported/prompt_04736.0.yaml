          *   *Harder than it looks.* The user was right that they overlap.
          *   *Solution:* Focus on the *source* of the standing loss.
          *   *Case 1 (Complicity without Hypocrisy):* **The Enabler Parent.** Parent says "Drugs are bad." Parent is clean. Parent pays rent for child so child can afford drugs. Parent finds drugs, blames child.
              *   *Is this hypocrisy?* Not necessarily. They can genuinely believe drugs are bad but prioritize keeping a roof over the child's head. They are complicit in the *condition* but not the *value*.
          *   *Case 2 (Hypocrisy without Complicity):* **The Stranger on the Train.** Stranger smokes in non-smoking car. Sees me drop a wrapper. Yells at me.
              *   *Complicity?* Zero.
