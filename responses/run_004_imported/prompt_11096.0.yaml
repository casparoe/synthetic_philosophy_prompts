          *   *Ramsey 2 (The Mathematician/Decision Theorist):* In "Truth and Probability" (1926), he lays the groundwork for Subjective Expected Utility (SEU) theory. This is the mathematical engine behind Longtermism/Effective Altruism (EA), specifically arguments like Bostrom's "Astronomical Waste" (tiny probability $\times$ huge number of lives = huge expected value).
      *   **The Question:** If you presented 1920s Ramsey with Bostrom's Astronomical Waste argument, which side wins? The humanist who rejects cosmic scale or the mathematician whose math enables it?
      *   **Constraint:** Do not say "we can't know." Reconstruct the internal argument and land on a conclusion.

  2.  **Deconstruct Ramsey's Philosophy:**
      *   *Pragmatism:* Ramsey was a pragmatist (influenced by Peirce and Wittgenstein). Truth and meaning are tied to human action and success. "The truth is what works."
