      *   *Key Insight:* Ramsey's SEU is about *consistent action*, not *maximizing abstract numbers* devoid of human context. He would likely reject the *aggregation* method of Astronomical Waste. He wouldn't reject the math, he would reject the *utility function*.
      *   *The "Human Good":* Ramsey was a Moorean idealist. Goods are states of consciousness (appreciation of beauty, affection). You can't aggregate these across $10^{50}$ potential people in a way that swamps actual existing people.
      *   *The Probability Constraint:* Ramsey viewed probability as a guide to *action*. If the probability is too speculative (metaphysical speculation about the far future), it ceases to function as a practical belief.
