answer: |-
  You win the round. Tell your friend to buy the next round of drinks (or coffee, depending on when you meet).

  You are remembering the distinction correctly, and it is a standard, robust distinction in the literature. While your friend is right that *both* are counterexamples to the Simple Conditional Analysis (SCA), they are structurally distinct problems that attack the analysis in different ways. Philosophers generally treat them as asymmetric threats.

  Here is the breakdown of why you're right, how Lewis's fix works, and why Masks remain the thornier problem.

  ### 1. The Distinction: Intrinsic Change vs. Extrinsic Interference

  Your intuition is spot on: **Finks mess with the disposition; Masks mess with the manifestation.**

  *   **Finks (The Martin Cases):** These involve a change to the **intrinsic causal basis** of the disposition.
      *   *The Setup:* A glass is fragile. Its fragility is grounded in its molecular structure (the causal basis).
      *   *The Fink:* A sorcerer (or mechanism) detects the strike and *instantaneously changes the molecular structure* to make it non-fragile right before impact.
      *   *The Result:* The glass is struck, but doesn't break.
      *   *Why it breaks SCA:* SCA says "If struck, would break." It doesn't break. So SCA says "Not fragile." But it *was* fragile until the exact moment of the strike.
      *   *Metaphysical Upshot:* Finks suggest that possessing a disposition isn't just about what *would* happen; it's about what intrinsic property you have *now*. Finks attack the link between the disposition and the **possession** of the power.

  *   **Masks (The Johnston Cases):** These involve **extrinsic interference** with the causal chain.
      *   *The Setup:* A glass is fragile (molecular structure intact).
      *   *The Mask:* It is wrapped in bubble wrap.
      *   *The Result:* The glass is struck, doesn't break.
      *   *Why it breaks SCA:* SCA says "If struck, would break." It doesn't break. SCA says "Not fragile." But it *is* fragile; the bubble wrap just stopped the breaking.
      *   *Metaphysical Upshot:* Masks leave the intrinsic basis alone. They attack the link between the **basis** and the **manifestation**.

  So, you are right: Finks remove the power; Masks block the power.

  ### 2. Lewis's Fix (The Reformed Conditional Analysis)

  David Lewis saw the Fink problem coming (specifically from C.B. Martin). He proposed the **Reformed Conditional Analysis (RCA)**.

  Lewis realized the problem with SCA was that it didn't specify that the object has to *keep* the property that makes it fragile during the strike. So, he added a clause about an **intrinsic basis ($B$)**.

  **The RCA Formula:**
  $x$ is disposed to $M$ if $S$ **iff** $x$ has some intrinsic property $B$ such that, if $x$ were $S$ and $B$ persisted, $x$ would $M$.

  **Why RCA kills Finks:**
  In the Fink case, when the glass is struck, the sorcerer removes $B$ (the molecular structure).
  *   **SCA asks:** "If struck, would it break?" (In the closest world where it's struck, the sorcerer acts, $B$ vanishes, it doesn't break.) -> **False.**
  *   **RCA asks:** "If struck **and $B$ persisted**, would it break?"
      *   To evaluate this counterfactual, we look at a world where the glass is struck *and* the sorcerer fails to remove $B$ (or $B$ is held fixed). In that world, the glass breaks.
      *   So the conditional comes out **True**.
      *   RCA correctly identifies the glass as fragile.

  **Why RCA fails against Masks:**
  Now take the bubble wrap.
  *   The glass has intrinsic basis $B$ (molecular structure).
  *   The glass is struck ($S$).
  *   The bubble wrap (the Mask) is present.
  *   **RCA asks:** "If struck **and $B$ persisted**, would it break?"
      *   In the closest world where the glass is struck and $B$ persists... the bubble wrap is *still there*. The bubble wrap doesn't remove $B$; it just absorbs the shock.
      *   So, even with $B$ persisting, the glass does *not* break.
      *   The conditional comes out **False**.
      *   RCA incorrectly identifies the glass as *not* fragile.

  ### 3. Is there a deep reason for the asymmetry?

  Yes. The asymmetry lies in **what is being held fixed in the counterfactual.**

  Lewis's fix works by "holding fixed" the intrinsic basis of the disposition.
  *   **Finks** operate by *changing* the intrinsic basis. So, by stipulating that the basis stays fixed, you logically exclude the Fink mechanism from operating. You effectively "turn off" the Fink to test the disposition.
  *   **Masks** operate *without changing* the intrinsic basis. They are extrinsic additives. So, when you hold the intrinsic basis fixed, you **do not** exclude the Mask. The Mask is compatible with the basis persisting.

  To fix Masks, you would need to add a "ceteris paribus" clause (all else being equal) that says "and no masks are present." But philosophers hate that move because it makes the analysis trivial. If you say "It's fragile if it would break when struck, provided nothing stops it from breaking," you haven't really explained fragility; you've just said "It's fragile if it acts fragile."

  ### 4. The Current State of Play

  Your friend is half-right in one specific sense: both Finks and Masks show that **dispositions cannot be reduced purely to conditionals.**

  *   **Finks** showed that the truth of the conditional depends on the stability of the intrinsic basis.
  *   **Masks** showed that the truth of the conditional depends on the absence of extrinsic interferers.

  Because of Masks (and their twin, **Mimics**—where something non-fragile breaks because a god hits it with a hammer), most contemporary metaphysicians have abandoned the Conditional Analysis entirely.

  The current consensus leans toward **Causal Basis Accounts** or **Dispositional Essentialism**:
  1.  **Causal Basis:** To be fragile just *is* to have a specific microstructure that *causes* breaking. We don't analyze it via conditionals; we analyze it via the categorical property itself.
  2.  **Dispositional Essentialism:** Dispositions are fundamental properties of the universe. They aren't "analyzed" into anything else (like conditionals). The conditional "if struck, would break" is true *because* the object is fragile, not the other way around.

  ### The Verdict

  *   **You:** Correct. Finks and Masks are structurally distinct (intrinsic removal vs. extrinsic blocking).
  *   **Friend:** Oversimplifying. While both break the Simple Conditional Analysis, they require different fixes, and Lewis's fix only solves one of them.
  *   **Lewis:** Beat the Fink, got masked by the Foam.
  *   **Metaphysics:** Still messy.

  You can confidently tell your friend that while both are counterexamples to the *Simple* analysis, the literature treats them as distinct classes (Martin vs. Johnston), and the fact that Lewis's RCA solves one but not the other proves they aren't the "same trick."
