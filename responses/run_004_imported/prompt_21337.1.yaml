prompt: |-
  so this is a bit of a weird ask but my mom died about 14 months ago and at therapy last week my therapist floated that what im going through might technically count as "prolonged grief disorder" now that its an actual diagnosis in the DSM. havent been able to stop thinking about it since — like is my grief literally a disease now, or is that just my therapist being weird. can you write me a dialogue between a naturalist (the boorse-style "disease = statistical deviation from species-typical functioning" type) and a normativist (disease attributions are always value-laden, cant be read off biology alone) arguing specifically over whether PGD is a genuine disorder? i dont want either of them to be a pushover — i want the naturalist to actually have a comeback for "there's no such thing as a species-typical grief timeline," and i want the normativist to have a real answer for whatever reference-class move the naturalist tries next. make them actually respond to each others points instead of just each reciting their own spiel.
