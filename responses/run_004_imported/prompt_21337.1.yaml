answer: |-
  I am so sorry for the loss of your mom. Fourteen months is not a long time in the span of a life, even if it feels like an eternity day-to-day. It makes complete sense that hearing a new label like "Prolonged Grief Disorder" (PGD) would feel jarring, or even offensive. It can feel like the medical world is trying to put a expiration date on your love.

  The debate you're asking for is one of the central fights in the philosophy of medicine. On one side, you have the **Naturalists** (like Christopher Boorse), who argue disease is an objective biological fact about how your body is functioning compared to the rest of the species. On the other, you have the **Normativists** (like Howard Brody or S. Benjamin Finkelstein), who argue you can't separate "disease" from human values, culture, and judgments about what counts as a "good life."

  Here is a dialogue between **Alex (Naturalist)** and **Sam (Normativist)** hashing this out specifically regarding PGD.

  ***

  **Setting:** *A quiet corner of a university library. Two philosophy professors grading papers.*

  **Alex (Naturalist):** I've been looking at the new DSM criteria for Prolonged Grief Disorder. People are panicking, saying it pathologizes love. But from a Biostatistical Theory perspective, it's actually quite straightforward. If a psychological mechanism fails to perform its species-typical function for a statistically significant duration, it's a disorder.

  **Sam (Normativist):** Straightforward? Alex, grief isn't a liver enzyme. There is no "species-typical function" for how long you mourn your mother. You're trying to read a moral timeline off of biology, and the biology just isn't there.

  **Alex:** That's the classic Normativist dodge. Just because it's hard to measure doesn't mean the fact isn't there. Look at the mechanism. The human psyche has an attachment system and a regulatory system. The function of the regulatory system is to process loss and eventually return the organism to a baseline where it can pursue survival and reproduction. When someone is stuck in acute grief for 12 months plus, to the point where they can't work, eat, or maintain other relationships, that regulatory mechanism is failing. It's a functional breakdown.

  **Sam:** But "baseline" is doing a lot of heavy lifting there. Whose baseline? You're assuming the "function" of a human is to return to productivity. If a person grieves for three years, are they biologically broken, or are they just prioritizing the memory of the dead over the efficiency of the living? You're smuggling in a value judgment that says "getting back to work" is health.

  **Alex:** I'm not talking about work; I'm talking about *survival functions*. Boorse is clear on this. If the grief is so severe it inhibits basic self-care or creates a risk of suicide, that is a reduction in survival probability. That is objective. If 95% of bereaved adults show a reduction in acute symptoms by month 12, and you are in the 5% who are physiologically stuck in month-one stress responses at month 14, that is a statistical deviation from species-typical functioning. It's not a value; it's a bell curve.

  **Sam:** Ah, the bell curve. The favorite shield of the Naturalist. But here's the problem: Statistics don't tell you where to draw the line for "disorder." Hypertension is high blood pressure, but the number that counts as "disease" changes based on what insurance companies will pay for. With PGD, you're saying 12 months is the cut-off. Why 12? Why not 18? Why not 6?

  **Alex:** Because the DSM workgroups looked at the data. They found a cluster of symptoms where the distress becomes disabling.

  **Sam:** "Disabling" is the keyword. Disabling *for what*? For participating in a capitalist economy? For dating again? If I choose to live simply and mourn slowly, I'm not disabled in my own view. I'm only disabled relative to *your* expectations of how a functioning adult behaves. That's a value judgment, not a biological fact.

  **Alex:** Okay, but let's get specific about your "no biological fact" claim. You said there's no species-typical timeline. I disagree. We can use **Reference Classes**. We don't compare a grieving widow to a teenager. We compare them to other bereaved spouses of similar age and health. Within *that* reference class, there is a statistical norm for recovery. If you fall significantly below the norm in functional capacity, you have a disorder. It's the same as saying a 50-year-old's heart is diseased if it pumps like an 80-year-old's. We just have to find the right reference class for grief.

  **Sam:** *There it is.* The Reference Class move. This is exactly where Naturalism collapses. You say, "Compare them to other bereaved adults." But who decides which bereaved adults make the cut? Do we include the ones who never remarry? Do we include the ones who take a year off work?

  **Alex:** We include the ones who are physically healthy and not suffering from comorbid depression. We isolate the variable.

  **Sam:** But that's circular! You're filtering the reference class to exclude the very people whose grief looks like the "disorder" you're trying to prove exists. If you define "normal functioning" as "people who recovered quickly," then obviously anyone who hasn't recovered quickly is abnormal. But that selection process is driven by a value: the value that quick recovery is the norm. You're constructing the class to validate the diagnosis.

  **Alex:** I'm constructing the class to isolate the *mechanism*. If I want to know if a leg is broken, I compare it to legs that aren't injured. If I want to know if grief processing is stalled, I compare it to grief processing that completed its cycle.

  **Sam:** But grief isn't a broken leg. It's a relationship. And relationships don't have cycles that "complete." Look, Alex, imagine a culture that honors ancestors for three years. In that culture, intense grief at month 14 is virtuous. It's socially functional. It binds the community. If you diagnose PGD there, you aren't identifying a biological failure; you're imposing a Western, individualistic timeline on a social ritual. If the diagnosis changes based on the culture, it's not a Naturalist fact. It's a Normative judgment.

  **Alex:** I'll grant that culture influences expression. But the *underlying distress* in PGD isn't just ritual. It's intrusive thoughts, inability to experience positive mood, severe separation anxiety. These are internal states of suffering. Even in your ancestor-honoring culture, if a person is literally unable to feed themselves because the pain is so consuming, that is a failure of the organism to maintain itself. That is universal.

  **Sam:** I agree suffering is real. But "disorder" is a label we slap on suffering to justify intervention. That's the move. By calling it PGD, you're saying, "This suffering is a mistake that needs fixing." But what if the suffering is a rational response to a catastrophic loss? If I lose my mother, isn't it *appropriate* to be devastated for more than a year? To call it a "disorder" implies the grief is disproportionate to the event. But who measures proportion?

  **Alex:** The measurement is the impairment. If the grief prevents you from valuing anything else—your other kids, your health, your future—that is a narrowing of functional capacity. The brain is designed to adapt. When it refuses to adapt to the point of self-harm, it is malfunctioning. It's like a pain receptor that keeps firing after the wound has healed. The wound is gone; the signal is still screaming. That's a glitch.

  **Sam:** But the wound *hasn't* healed. That's the point. The person is still gone. The pain receptor is accurate. The world *is* worse without them. To say the brain is "wrong" to feel pain is to say the world *shouldn't* have changed. You're medicalizing the reality of loss.

  **Alex:** I'm medicalizing the *inability to live with* the reality of loss. There's a difference between feeling pain and being paralyzed by it. The DSM criteria require the paralysis. That's the statistical deviation. It's not saying "you are sad." It's saying "your sadness has hijacked your motor functions."

  **Sam:** And who defines "hijacked"? If I choose to sit in my grief rather than go to a party, is that hijacking? Or is that agency? The moment you introduce the word "disorder," you invite the insurance company, the employer, and the doctor to decide when you're "done." That's not biology, Alex. That's social control.

  **Alex:** Or, it's a way to validate that the person needs help. Without the diagnosis, there's no treatment, no insurance coverage for therapy. Calling it a disorder says, "You aren't weak; you're stuck. And we have tools to unstick you." It restores agency by treating the blockage.

  **Sam:** It restores agency only if the patient agrees they want to be unstuck. If the patient feels this is their new normal, and the doctor says "No, your species-typical function requires you to move on," then the doctor is the one asserting control. You can't hide that power dynamic behind a statistical curve.

  **Alex:** So we just leave them suffering because we're afraid of being "normative"?

  **Sam:** No. We help them because they are suffering, not because they are "disordered." I can acknowledge your pain is unbearable and offer help without claiming your brain is statistically defective. The moment you claim it's a *disease*, you claim objectivity where there is only interpretation.

  **Alex:** And the moment you claim it's *only* interpretation, you deny the biological reality of trauma. The HPA axis is dysregulated. Cortisol is elevated. Neural pathways are reinforced. That is objective. If we can measure it, it's natural.

  **Sam:** You can measure a bullet in a wound, Alex. That doesn't tell you whether the war was just. You can measure the cortisol of a grieving child. That doesn't tell you whether their grief is "too long." It just tells you they are in pain. Whether that pain is a "disorder" depends on what you think a human life is *for*. And biology can't answer that.

  ***

  ### A Note for You

  I know reading a debate like this doesn't take the pain away, and it might not answer the question of "Am I sick?" definitively. That's because, as Sam argues in the dialogue, the answer depends on what you value.

  If you look at it through Alex's lens (Naturalist), the diagnosis is a tool to identify when grief has become a trap that your brain can't spring open on its own, offering a path to treatment.

  If you look at it through Sam's lens (Normativist), the diagnosis is a social label that might validate your need for help, but it shouldn't dictate how you "should" feel or imply your love is a malfunction.

  Your therapist floated this diagnosis not to label you as "broken," but likely because they see you are in significant pain and they want to validate that what you are experiencing is recognized, treatable, and real. Whether you accept the label of "disorder" is up to you. You can accept the *help* without accepting the *stigma*.

  There is no statute of limitations on missing your mom. Please be gentle with yourself.
