      *   *Refining the "Constitutive" argument:* If thought *uses* ESP, then a machine that cannot use ESP is fundamentally incapable of human-like thought. Turing's goal is to show machines *can* think. If ESP is real and necessary for thought, his project fails. He *must* treat it as a confounder to save his thesis. This is the tension.

