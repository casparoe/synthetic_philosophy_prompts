      *   **Point 1: The Ensemble vs. Time Distinction (The Core Physics):** Explain the St. Petersburg Paradox or a simple coin flip game. Show how Ensemble Average (EV) diverges from Time Average (Growth).
          *   *Example:* +50% / -40% coin flip. EV is positive. Time average is negative (geometric mean < 1).
          *   *Argument:* EV says "take it." Reality says "you go to zero." EV isn't describing the single trajectory.
      *   **Point 2: Preference vs. Physics (The "Just Log Utility" Rebuttal):**
          *   Standard Econ: "I choose Log because I'm risk-averse."
          *   Ergodicity: "I choose Log because the *process* is multiplicative."
          *   *Key Insight:* If the process were additive (e.g., fixed dollar bets regardless of bankroll), Log is *wrong*. EV is correct. Ergodicity explains *when* to use Log vs. Linear. Standard utility theory doesn't inherently link the utility function to the dynamic process.
      *   **Point 3: The "Mistake" of Ruin:**
          *   If you maximize EV in a compounding world, you bet too much (often 100%).
          *   Result: Absorption barrier (0 wealth). Game over.
          *   Argument: You can't have a "preference" for non-existence. If the strategy eliminates the agent, it's objectively flawed for that agent.
      *   **Point 4: Non-Ergodicity is the Rule, Not the Exception:**
