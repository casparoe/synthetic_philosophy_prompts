answer: |-
  Your intuition is correct, and your friend's advice is fundamentally unsound—not just risky, but based on a category error about what kind of negotiation you are actually having.

  While your friend's advice draws from real concepts in game theory and negotiation (specifically "commitment tactics" or "brinkmanship"), applying them here is like using a sledgehammer to perform surgery. The strategy is unsound in principle for three specific reasons: it misidentifies the adversary, it ignores the cost of information asymmetry, and it treats a repeated game as a one-off transaction.

  Here is the breakdown of why "commit first, commit hard, commit blind" is theoretically flawed in your specific situation.

  ### 1. The Category Error: Partner vs. Adversary
  Your friend is operating under the assumption that you are negotiating **against** your brother. In Mergers and Acquisitions (M&A), this is often true; one party is trying to extract maximum value from the other.

  However, in a joint inheritance sale, you and your brother are not adversaries. You are **co-principals**. The actual negotiation is between **the two of you (as a united front)** and **the developer**.

  *   **The Friend's Model:** User vs. Brother. (Zero-sum: If I get more, he gets less.)
  *   **The Reality:** (User + Brother) vs. Developer. (Positive-sum: If we fight, the deal dies, and we both get zero.)

  By trying to "win" against your brother, you introduce friction into the selling unit. A developer looking to buy land for condos wants certainty. If they sense disunity or a power struggle between the owners, they will not simply wait for you to resolve it; they will walk away to a less risky property. Your friend's strategy increases the transaction risk for the buyer, which lowers the expected value of the asset. Therefore, the strategy actively destroys value rather than claiming it.

  ### 2. The Information Deficit (Rationality requires Data)
  Your friend argues that gathering information "hands my brother the chance" to commit first. This assumes that negotiation is a contest of wills rather than a process of price discovery.

  In economic theory, a "rational" price is one that reflects the available information. Committing to a number without an appraisal is not a negotiation tactic; it is **gambling**.
  *   **Scenario A:** You commit to $1.3M. The land is worth $700k. The developer walks. You get $0.
  *   **Scenario B:** You commit to $700k. The land is worth $1.3M. The developer buys immediately. You lose $600k.

  In M&A, parties often have access to data rooms, due diligence, and investment bankers before making final offers. Your friend is suggesting you make a binding move *before* due diligence. This violates the basic principle of rational decision-making, which requires minimizing uncertainty before making irreversible commitments. A strategy that relies on ignorance is not "hardball"; it is structurally unsound because it decouples price from value.

  ### 3. Game Theory: The Game of Chicken vs. Coordination
  Your friend is describing the **Game of Chicken**. In this game, two drivers head toward each other; the first to swerve loses. The optimal strategy in Chicken is indeed to convince the other driver you *cannot* swerve (e.g., by throwing your steering wheel out the window where they can see it).

  However, this only works if the other player is rational and prefers a loss of face to a crash.
  *   **The Flaw:** If your brother adopts the same strategy (which is likely, given you share a genetic and cultural background), you reach the **Nash Equilibrium of mutual destruction**. Both of you hold firm, the deadline passes, the developer withdraws, and you both get nothing.

  Furthermore, sibling relationships are not a one-off Game of Chicken. They are an **Iterated Prisoner's Dilemma**. You will interact with your brother for the rest of your lives.
  *   **One-off game (M&A):** Burn the bridge, take the money, never see them again.
  *   **Repeated game (Family):** Trust is a currency. Using a hostile tactic now devalues that currency for all future interactions (holidays, caring for aging parents, future inheritances).

  A rational strategy in a repeated game prioritizes cooperation and reputation over short-term maximization. Your friend is advising you to optimize for a single transaction at the expense of the long-term relationship equilibrium.

  ### 4. The "Anchor" Fallacy
  Your friend suggests you set an anchor (the price) before your brother does. Anchoring is a valid psychological tactic, but it requires the anchor to be *plausible*.
  *   If you anchor at $1.3M without an appraisal, and your brother knows the tax assessment is low and comps are shaky, he won't view your anchor as a "strong position." He will view it as **uninformed**.
  *   Instead of yielding to your anchor, he will likely question your competence or motives, leading to the exact deadlock you fear. An anchor only holds if the other party believes you have the data to support it.

  ### Summary of the Strategic Flaw
  Your friend is treating this as a **distributive negotiation** (how do we split the money between us?) when it is actually an **integrative negotiation** (how do we align our interests to extract the maximum money from the developer?).

  The strategy is unsound because:
  1.  **It creates a principal-agent conflict:** It turns a partner into an adversary.
  2.  **It ignores expected value:** It risks a 100% loss (deal collapse) to gain a marginal percentage of the split.
  3.  **It misapplies leverage:** You have no leverage over your brother that he doesn't also have over you (mutual veto power).

  ### A Better Approach
  You do not need to be "squeamish" to reject this advice; you can be strategic.
  1.  **Align with your brother immediately:** Call him and say, "We have a developer interested, but we are flying blind. If we disagree, we lose the deal. Let's act as one unit."
  2.  **Share the cost of information:** Offer to split the cost of a professional appraisal and a zoning consultation immediately. This removes the "who knows more" advantage and creates a shared factual baseline.
  3.  **Negotiate together:** Once you have a number, present a united front to the developer. You and your brother should not be negotiating the price with each other; you should be agreeing on the price *together* to present to the buyer.

  Your friend's advice works in a hostile takeover where the relationship ends at the closing table. It fails in a joint inheritance where the relationship is permanent and the real adversary is outside the family. You are right to reject it.
