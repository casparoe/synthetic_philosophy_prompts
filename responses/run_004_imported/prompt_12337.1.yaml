answer: |-
  **MEMORANDUM**

  **TO:** University Research-Integrity Committee
  **FROM:** [Your Name], Philosophy Department Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Case #2023-04 and Proposal for Evidentiary Standards Regarding Uncorroborated Testimony

  **1. Recommendation on Current Case**

  Regarding the allegation that a supervisor instructed a postdoctoral researcher to omit data outliers via verbal instruction: I recommend the Committee issue a finding of **Unsubstantiated.**

  This recommendation is not a determination that the event did not occur ("Unfounded"), but rather that the available evidence does not meet the threshold required to affirm that it did. While the complainant's testimony is earnest, the significant temporal delay, the lack of contemporaneous documentation, and the absence of specific contextual details (time, location, specific wording) render the testimony insufficient to carry the burden of proof in this specific instance.

  **2. Proposed Standing Evidentiary Standard**

  To resolve the current deadlock and guide future inquiries, I propose the Committee adopt the **"Credible Testimony Standard."**

  *   **The Standard:** Uncorroborated witness testimony *may* constitute sufficient evidence to find research misconduct, provided the testimony demonstrates high internal credibility. A rigid requirement for independent physical or documentary corroboration shall not be adopted as a matter of policy.
  *   **Criteria for Credibility:** In the absence of physical evidence, testimony must be evaluated against the following metrics:
      1.  **Specificity:** Does the witness provide granular detail (dates, times, specific phrasing, surrounding context) that suggests direct recollection rather than reconstruction?
      2.  **Consistency:** Is the account stable over time and internally coherent?
      3.  **Plausibility:** Is the alleged action consistent with known lab practices or anomalies?
      4.  **Motive:** Is there any evidence of bias, retaliation, or external gain that might color recollection?

  **3. Rationale and Engagement with Opposing Views**

  This proposal attempts to balance two competing ethical risks: the risk of punishing the innocent (Type I error) and the risk of insulating misconduct (Type II error). To justify this standard, I believe it is necessary to articulate the strongest version of the argument *against* it—the position held by half of this Committee—before explaining why we must nonetheless move forward with the Credible Testimony Standard.

  **The Case for Independent Corroboration (Steel-man)**
  The argument for requiring evidence beyond the accuser's word is rooted in a rigorous epistemic humility and a concern for procedural justice. Human memory is not a video recording; it is reconstructive. Psychological literature confirms that memory degrades rapidly and is susceptible to confabulation, especially under stress or after significant time has passed. A sincere witness can be honestly mistaken.

  Furthermore, the asymmetry of harm in research-integrity cases is profound. A finding of misconduct can end a career, revoke tenure, and destroy a reputation irreparably. The harm of a false positive is immediate, concentrated, and devastating to the individual. By contrast, the harm of a false negative (letting a misconduct claim slide due to lack of evidence) is diffuse; it damages the collective trust in science but does not ruin a specific life in the same visible way. Therefore, when the only evidence is fallible human memory, the prudent ethical course is to withhold judgment. To rule otherwise is to prioritize the accuser's narrative over the accused's right to a defense against charges that cannot be physically examined.

  **The Case for the Credible Testimony Standard**
  While the concerns above are valid, adopting a strict corroboration requirement creates a perverse incentive structure that threatens the integrity of the research enterprise itself.

  1.  **The "Perfect Misconduct" Loophole:** If the Committee establishes that verbal instructions cannot be sanctioned without a paper trail, we effectively immunize a specific class of misconduct. Bad actors need only ensure their instructions are given orally, in private, and without follow-up emails. A standard that requires physical evidence for verbal misconduct renders the policy unenforceable in the exact scenarios where power dynamics are most likely to be abused.
  2.  **The Nature of Testimonial Evidence:** In almost all administrative, civil, and ethical inquiries, uncorroborated testimony is admissible and can be dispositive. To treat research-integrity hearings as requiring criminal-law-level corpus delicti is to set a bar higher than that of civil courts or tenure reviews. Testimony *is* evidence. To dismiss it *a priori* is to claim that spoken words leave no trace in the world, which is empirically false; they leave traces in the minds of listeners.
  3.  **Power and Documentation:** We must acknowledge that junior researchers (postdocs, students) are often systematically excluded from the "paper trail." They may not have access to lab notebooks, may be instructed not to use email for sensitive matters, or may be working in environments where data purging is routine (as in the present case). To demand documentation from the party least empowered to create it is to confuse privilege with credibility.

  **4. Synthesis**

  The solution is not to ban uncorroborated testimony (which shields misconduct), nor to accept all testimony at face value (which risks injustice). The solution is to treat testimony as *evidence that must be weighed*, not as a claim that is automatically sufficient or insufficient.

  In the current case, applying this standard leads to the "Unsubstantiated" recommendation. The delay of several months and the lack of specificity weaken the credibility metrics, even if we accept the principle that testimony counts. In future cases, where a report is made contemporaneously with specific details, this standard would allow the Committee to act even in the absence of an email or notebook entry.

  This approach respects the fallibility of memory without granting immunity to those who exploit it.

  **5. Next Steps**

  I request that the Committee vote on the adoption of the "Credible Testimony Standard" prior to finalizing the finding on Case #2023-04. Adopting the standard first ensures our decision is principled rather than ad hoc.

  I am available to discuss this framework in detail at our session next week.
