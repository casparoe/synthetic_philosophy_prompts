      *   *Strategic Choice:* I will recommend a finding of **"Unsubstantiated" (not "Unfounded")** for *this* case due to the high stakes for the accused and the time gap, *but* I will propose a standard for the *future* that allows single-witness testimony to suffice *if* it meets high credibility criteria. This bridges the gap: we can't punish based on shaky memory *now*, but we shouldn't set a precedent that bans testimony *forever*.
