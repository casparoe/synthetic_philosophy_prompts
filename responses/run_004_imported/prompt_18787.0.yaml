  **Justifications:**

  *   **Move 1 (Jess): +1.** This applies the "Equal Weight View" of peer disagreement. Given the constraints (no calculator, equal track records), treating the situation as symmetric and lowering confidence is epistemically rational, even if "splitting the difference" actionably guarantees a slightly wrong payment.
  *   **Move 2 (Owen): -1.** This is the "Steadfast View." While defensible in theory, it is weak in this specific context. Mental math is fallible, and the "inspection" he trusts is the very thing likely to contain the invisible error. Ignoring a peer's disagreement here shows overconfidence in his own cognitive machinery.
  *   **Move 3 (Jess): +2.** This is the strongest epistemic point. It correctly identifies that subjective certainty ("it feels right") is symmetric between the right and wrong person, so it cannot be used as a tiebreaker without begging the question.
  *   **Move 4 (Owen): +1.** This is the "Self-Defeat Objection" to conciliationism. It is a philosophically valid paradox (if you must conciliate on everything, you must conciliate on the rule of conciliation). It complicates Jess's position but doesn't necessarily resolve the immediate math dispute.
  *   **Move 5 (Jess): +2.** This identifies a performative contradiction. If Owen's rule were true, he would be irrational to argue his point to Jess (trying to budge her). It effectively neutralizes Move 4 as a practical shield for stubbornness.

  **What They Are Missing:**

  *   **The "Both Wrong" Possibility:** Both operate on the assumption that one total is correct and the other is incorrect. In mental math, it is entirely possible *both* made different errors and the true total is a third number.
  *   **Independent First-Order Evidence:** They focus on the *disagreement* rather than the *data*. They could estimate the total based on cart volume or item count (e.g., "We bought 40 items at roughly $8 each") to create an independent check that doesn't rely on either's specific addition.
  *   **Belief vs. Action:** They conflate what to *believe* (who is right) with what to *do* (how to pay). Even if they can't settle the truth, they could agree to pay the average temporarily and reconcile later when they have signal, separating the epistemic dispute from the financial obligation.
  *   **The Cost of Disagreement:** They are treating this as a pure logic puzzle. A rational handling of disagreement also weighs the social cost of the argument against the $5.70 difference; sometimes the rational move is to agree to disagree for the sake of house harmony.
