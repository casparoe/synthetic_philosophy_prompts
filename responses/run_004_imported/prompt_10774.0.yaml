  Here is how I rate the plausibility of each norm based on the cases you and Kayla discussed:

  **Truth Norm**
  This view is too externalist because it ignores your epistemic position; if you make a lucky guess without evidence, you've asserted improperly despite speaking the truth. It captures the goal of assertion but fails to account for the responsibility required to make one.

  **Knowledge Norm**
  This handles your lottery and Moore cases perfectly, since high probability isn't knowledge and you literally cannot know a Moorean conjunction. The selfless teacher is a bump, but can be explained as asserting on behalf of the scientific community's knowledge rather than personal knowledge.

  **Justified Belief Norm**
  This saves the selfless teacher case since the teacher has evidence despite lacking personal belief, but it struggles to explain why lottery assertions feel wrong despite strong statistical justification. It risks making assertion too permissible when evidence is merely probabilistic rather than conclusive.

  **Sincere Belief Norm**
  This is too weak because it allows irresponsible assertions based on delusion or luck as long as you're honest. It fails to explain why we challenge claims by asking for evidence ("How do you know?") rather than just asking about your psychological state ("Do you believe it?").

