      *   *Most likely:* The user is an engineer. They *want* to believe reason rules. They are unsettled by how much emotion moved them. They are looking for a text to reassure them that they haven't lost their mind (i.e., that reason is still the boss). They *think* du Châtelet says "Reason is Boss."
      *   *My Job:* Tell them du Châtelet actually says "Passion is the Engine, Reason is the Steering." This validates their experience (falling in love) while keeping the engineering metaphor (steering/control).

  5.  **Final Polish:**
