      *   *The Role of Reason:* Reason helps us avoid the *painful* consequences of passion, not the passion itself. It's about prudence, not suppression.
      *   *The "Illusion" point:* This is crucial. She says we need to believe in things that aren't strictly "true" to be happy. This contradicts the "justify feelings" idea.
