      *   **Speaker's Background:** Grad student in metaphysics (persistence, endurantism vs. perdurantism).
      *   **Key Philosophical Concepts:** Endurantism (wholly present at every moment) vs. Perdurantism (4D worm, temporal parts). Lewis's problem of temporary intrinsics (how can one thing have contradictory properties at different times?).
      *   **Constraints:**
          *   Length: ~4 minutes (approx. 500-600 words spoken at a moderate pace).
          *   Tone: Toast, not a lecture. Accessible to non-philosophers, accurate enough for the cousin.
