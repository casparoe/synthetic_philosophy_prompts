          *   Ethical/Philosophical Stance: Do not privilege the "comforting" view unless earned. Acknowledge the tension. Ideally, find truth on *both* views or sit honestly with the uncertainty.
      *   **Goal:** Honor the parents, acknowledge the diagnosis without defining them by it, and integrate the metaphysical reflection meaningfully.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Endurantism:* Dad is wholly present now. If he changes/declines, *he* changes. The risk is loss of self. The comfort is that the "now" is real and complete.
      *   *Perdurantism:* Dad is a 4D object. The "Alzheimer's stage" is just one temporal part. The "healthy stage" (like now) is another part. Neither negates the other. The risk is feeling detached/fatalistic. The comfort is that the good moments are eternally part of the whole shape, regardless of the end.
      *   *The "Problem of Temporary Intrinsics":* How can he be "sharp/witty" now and "forgetful" later?
