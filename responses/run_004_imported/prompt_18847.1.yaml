answer: |-
  Mom, Dad, everyone.

  Fifty years. It's a number that feels almost abstract until you look at the two of you sitting there. Dad, you are still finishing Mom's sentences. You are still the first to laugh at a bad joke. In this light, in this room, you are entirely who you have always been.

  But as the eldest, I've been thinking about what it means to stand here tonight, specifically now. Some of you know I'm in grad school studying philosophy. Lately, my classes have been obsessed with a specific puzzle: how does a person stay the same person over time? There are two main ways to think about it.

  The first is that a person is wholly present at every moment. That the "Dad" sitting here tonight is the complete article, fully real, fully here. The second view is that a life is like a long, four-dimensional shape. That "Dad" is the whole thing—all the years at once—and tonight is just one slice of that shape.

  For the last six weeks, since we got the news about Dad's health, I haven't been able to stop running these two ideas against each other.

  If the first view is true—that you are wholly present in the moment—then tonight is everything. It means that who you are right now is not a rehearsal, and it is not a shadow of a future decline. You are here. Completely. And that is a profound comfort. It demands that we look at you now, exactly as you are, and recognize that this reality is not diminished by what might come later.

  But if the second view is true—that a life is a whole shape made of many parts—then there is a different kind of comfort. It means that the years of health, the wit, the memory, the raising of children, and tonight specifically... these are fixed coordinates. They are built into the structure of your life. Even if later parts of that shape look different, even if they are harder, they cannot reach back and erase the earlier parts. The good years are not lost; they are eternally true segments of the whole.

  I used to think I had to choose one view. I used to think I had to decide if you were an enduring soul traveling through time, or a timeline itself. But watching you two for fifty years, I realize the answer isn't in the metaphysics. It's in the marriage.

  Because a marriage like yours does both. It attends to the moment—wholly, fiercely, present. And it builds a shape that holds all the moments together, even the ones we haven't lived yet.

  Dad, the diagnosis is a shadow we carry, but it is not the object casting it. You are the object. And whether you are a soul enduring through change, or a story composed of many chapters, the truth of you is not up for debate. It is written in the fifty years behind you, and it is spoken in the sentences you finish for Mom tonight.

  We don't need to solve the puzzle of persistence to know that love is the only thing that binds the moments into a life. So, I raise my glass not to a static idea of health, but to the reality of this union. To the moments that are wholly present, and to the whole life that contains them.

  To Mom and Dad.
