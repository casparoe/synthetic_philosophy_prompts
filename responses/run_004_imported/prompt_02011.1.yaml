answer: |-
  This is one of the sharpest objections to Wittgenstein's *On Certainty*, and honestly, if you didn't ask this, you wouldn't have really understood the stakes. You have hit on what philosophers call the **"arbitrariness objection"** or the threat of **epistemic relativism**.

  The short answer is: **No, hinge epistemology does not give your cousin a free pass.** Wittgenstein does not think that *any* proposition can be a hinge just because someone claims it is.

  Here is the breakdown of why the Flat Earth claim fails to qualify as a genuine hinge, and why you aren't backed into a relativist corner.

  ### 1. Hinges are Lived, Not Argued
  This is the single most important distinction. For Wittgenstein, hinges are not beliefs you hold; they are **ways you act**.

  *   **Genuine Hinge:** You do not walk off cliffs because you assume gravity exists. You don't "believe" in gravity in a theological sense; you simply navigate the world as if it is true. It is silent background noise.
  *   **The Cousin's Claim:** Your cousin is *arguing* about the shape of the earth. They are producing evidence (or pseudo-evidence), debating, and trying to convince others.

  **The Implication:** The moment you have to *defend* a proposition, it has ceased to function as a hinge. Hinges are the things that make debate possible; they are not the subject of the debate. By making the shape of the earth a point of contention, your cousin has moved it out of the "hinge" category and into the "empirical claim" category. Once it is an empirical claim, it requires evidence. Since they lack evidence, they are irrational.

  ### 2. The Network of Coherence (The System)
  Wittgenstein often talks about propositions forming a system or a "nest." Hinges don't float in isolation; they hold up a massive web of other practices and beliefs.

  *   **Round Earth Hinge:** This supports navigation, GPS, astronomy, time zones, flight paths, and satellite technology. It coheres with the hinge that "mathematics is reliable" and "optics generally work."
  *   **Flat Earth Hinge:** To make this a hinge, your cousin would have to treat *contradictory* evidence as nonsense. But here's the catch: Your cousin likely still uses GPS. They likely fly on planes. They likely accept that other countries exist.

  **The Implication:** A proposition cannot be a hinge if it systematically breaks the rest of the door. If you claim the earth is flat but then use a round-earth map to drive to the grocery store, you aren't acting on the hinge. You are engaging in **double-think**. A genuine hinge must be compatible with the successful functioning of the rest of your "form of life." The Flat Earth proposition creates friction with almost every other successful practice we have (travel, physics, communication).

  ### 3. Inheritance vs. Choice
  Wittgenstein emphasizes that hinges are **inherited**, not chosen. We are "trained" into them by our community and our interaction with the world.

  *   **The Riverbed Analogy:** Wittgenstein compares hinges to the bed of a river. The water (our empirical knowledge) flows over it. Sometimes the bed shifts, but it shifts slowly, due to the pressure of the water over time, not because a single drop of water decided to move a rock.
  *   **The Cousin:** Your cousin has *chosen* this proposition. They have adopted it as an ideology.

  **The Implication:** You cannot simply decide, "From today on, this is my hinge." Hinges are revealed by what we *cannot help but assume* in order to function. Since your cousin *could* function without the Flat Earth belief (and most people do), it is not a necessary condition of their agency. It is a hobbyhorse, not a hinge.

  ### 4. The "Rationality" Check
  So, do you have standing to call them irrational? Yes, but the definition of irrationality shifts slightly.

  In classical epistemology, being irrational means "failing to follow the rules of logic/evidence."
  In hinge epistemology, being irrational means **"adopting a framework that renders action impossible or nonsensical."**

  If your cousin truly treated "The Earth is Flat" as a hinge:
  1.  They would refuse to fly long-haul (fear of falling off/edge).
  2.  They would reject satellite weather data (since satellites can't exist).
  3.  They would be unable to explain time zones without contradiction.

  If they do these things, they are practically irrational (they will fail to navigate the world).
  If they *don't* do these things (they fly, use GPS, etc.), then they are being intellectually dishonest. They are claiming a hinge status for a belief they do not actually live by.

  ### 5. Why it's not Relativism
  Relativism says: "Your framework is true for you, mine is true for me, and neither can judge the other."

  Wittgenstein's view is more pragmatic: **"My framework allows us to build bridges, send rockets, and cure diseases. Your framework leads to confusion and practical failure."**

  We don't prove the Round Earth is "True" with a capital T (because that would require a hinge to prove a hinge, which is circular). We prove it by pointing to the **success of the system** built upon it.

  If your cousin says, "Well, my hinge is just different," you can reply: "Okay, let's navigate a ship to Australia using your hinge." When the ship gets lost or crashes, the hinge has been tested not by evidence, but by **utility**.

  ### Summary for the Argument with your Cousin
  If your cousin tries to use Wittgenstein as a shield, here is your counter-move:

  1.  **Point out the noise:** "Wittgenstein says hinges are the silent background of action. You are shouting about this. That means it's not a hinge for you; it's a theory."
  2.  **Check the action:** "Do you live your life as if the earth is flat? Do you refuse to trust pilots? No? Then you don't actually hold this as a certainty; you hold it as a preference."
  3.  **The Cost of the Hinge:** "To make this a hinge, you have to discard the hinges that allow your phone to work, the sun to rise predictably, and maps to be accurate. Are you willing to discard the whole system, or just the parts that annoy you?"

  **Verdict:** Hinge epistemology saves us from radical skepticism (the idea that we know *nothing*), but it does not save us from fanaticism. A hinge must be **unavoidable** for action, not just **convenient** for an argument. Your cousin's belief is the latter, not the former.
