answer: |-
  Good morning. For those who don't know me, I'm [Your Name], [Name]'s nephew/niece.

  If you're standing in the back, or if you're part of the family branch that only sees each other at holidays, you probably know [Name] best through the stories. You know the ones. The sit-ins in the sixties. The fences in the eighties. And, most recently, the pipeline access road two summers ago, when she was nearly eighty years old.

  I know a lot of my cousins are thinking of her right now as a "rebel." And honestly? It's a tempting story. The badass grandma who wouldn't sit down and shut up. It's a great image. But if [Name] were here, she would gently but firmly correct us. She hated the word "rebel." She hated the idea that she "didn't care about rules."

  She would tell you that a rebel breaks the law because they reject the system. That wasn't her. She broke the law because she respected the system enough to hold it to its own promises.

  She took this very seriously. Decades ago, she took a night class on political philosophy—Rawls and his contemporaries—and it changed the way she spoke. She drew a hard line between what she called "conscientious refusal"—which she saw as a private matter, like a draft resister following their own heart—and "civil disobedience." To her, civil disobedience wasn't about your private conscience. It was public. It was nonviolent. And it was addressed to *our* shared sense of justice, not just her own.

  She was borderline pedantic about this. If you told her she was following her heart, she'd get a little sniffy and tell you she was following the law's own logic.

  And that is why the arrests mattered so much to her. It wasn't about the thrill of the protest. It was about the booking process. There was one time, a lawyer told her she had a loophole, that she didn't actually have to serve the time. She went anyway. She told me once, "If I don't accept the penalty, I'm not appealing to the community's sense of justice. I'm just opting out."

  She believed that by turning herself in, by sitting in that cell, she was proving that she still belonged to us. That she wasn't above the law, but was asking the law to be better. That takes a different kind of toughness than running away. It's the toughness of someone who loves their community enough to argue with it, publicly and patiently, for sixty years.

  Now, I know not everyone here spent their weekends reading political theory. Most of us just loved her for the person she was at the kitchen table. And the truth is, that precision wasn't just for the protesters. It was for us, too. She didn't want us to just "feel" things; she wanted us to understand them. She didn't want blind loyalty; she wanted engaged honesty.

  To her activist friends: She was one of you, and she held the line when it was easier to blur it.
  To her discussion group: She kept her vocabulary sharp until the end.
  And to the family: She wasn't distant or cold. She was deliberate. She loved us with the same intentionality she brought to the picket line. She showed up. She stayed. She accepted the consequences.

  So, how do we honor her? I don't think we honor her by trying to be "rebels." I don't think she'd want us chaining ourselves to fences unless we were ready to explain exactly why, and ready to sit in the cell afterward.

  I think we honor her by paying attention. By not settling for the easy story. By recognizing that sometimes, respecting the rules means demanding they be just. And by understanding that the highest form of loyalty isn't blind obedience—it's the courage to stand in the light, accept the consequences, and ask the people you love to do better.

  She was [Name]. She was precise. She was present. And she was, in the truest sense of the word, a citizen.

  Thank you.
