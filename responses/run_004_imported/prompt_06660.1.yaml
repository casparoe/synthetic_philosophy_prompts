      *   **Helen Beebee (Normative/Pragmatic View):** Causal claims involving omissions are sensitive to context and norms. We pick *which* omission matters based on duty/expectation. The world doesn't distinguish between my not calling and the Queen of England not calling; *we* do based on norms. Therefore, "causation" here is pragmatic/moral, not metaphysical.

  3.  **Drafting the Argument (The "Beebee/Dowe Case"):**
