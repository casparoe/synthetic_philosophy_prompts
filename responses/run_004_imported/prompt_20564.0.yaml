      *   *Nuance:* The user asks if obligations are measured on the same scale. In *personal life*, no. In *professional assessment*, yes. Make that distinction clear.
      *   *Nuance:* The "Zero Discretion" policy is key. If the policy allowed discretion, this would be a different conversation. Since it doesn't, the instructor acted against explicit rules.

  10. **Final Polish:** Ensure the distinction between *personal* ethics (care for family) and *professional* ethics (impartiality) is the centerpiece. (This aligns with the "Two Hats" concept).

