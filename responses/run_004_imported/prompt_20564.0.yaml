prompt: |-
  Ok, this actually happened to me last semester and it's been bugging me ever since. I teach at a small college, and my nephew ended up in one of my intro classes. Partway through the semester I caught him copying a couple paragraphs almost word-for-word from an old paper he found online. Policy here is zero discretion - any suspected plagiarism gets referred straight to the integrity office, no exceptions, and I've sent other students down that road for less. With him, I just quietly had him redo the section and never filed anything. Now part of me feels like a hypocrite, but another part of me thinks treating him exactly like I'd treat a random student would've been it's own kind of wrong, not the neutral "fair" option everyone assumes it is. Was I just rationalizing favoritism, or is there something real behind the sense that what I owe him and what I owe a stranger in my classroom aren't measured on the same scale?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Role:** College instructor at a small college.
      *   **Incident:** Nephew (student in intro class) plagiarized (copied paragraphs from online).
      *   **Policy:** Zero discretion. Any suspected plagiarism goes to the integrity office. No exceptions. (Instructor has enforced this with others).
      *   **Action Taken:** Instructor handled it informally (made him redo the section), did *not* report it.
      *   **Emotional State:** Bugged ever since, feeling hypocritical, but also questioning if "neutrality" is actually fair in this specific relational context.
      *   **Core Question:** Was this just rationalized favoritism, or is there a valid ethical argument that obligations to family differ from obligations to strangers in a classroom?

  2.  **Identify the Ethical Tensions:**
      *   **Professional Integrity vs. Familial Loyalty:** The classic conflict of interest.
      *   **Rule Utilitarianism (Policy) vs. Care Ethics (Relationship):** Following the rules for the greater good vs. caring for the specific individual's well-being.
      *   **Fairness to Other Students:** If others got punished for less, is this unfair to them?
      *   **Educational Goal:** Is the goal punishment or learning? Did the informal handling achieve learning?
      *   **Institutional Trust:** The policy exists for a reason (consistency, liability, standards). Bypassing it undermines the institution.

  3.  **Evaluate the "Favoritism" Argument:**
      *   *Yes, it is favoritism.* By definition, treating someone differently because of a personal relationship is favoritism.
      *   *Is it rationalized?* Likely. The user is looking for justification to feel better.
      *   *Is there a valid ethical counter-argument?* There are nuances. Some ethical frameworks (Care Ethics) prioritize relationships. However, in a *professional* setting, impartiality is usually the primary virtue.

  4.  **Evaluate the "Neutrality is Wrong" Argument:**
      *   The user suggests treating him like a stranger might be "its own kind of wrong."
      *   *Why?* Maybe because family has a deeper stake in his long-term success? Maybe because a formal record could harm him disproportionately?
      *   *Counter:* This is exactly why policies exist—to prevent personal bias from influencing professional outcomes. If every professor made exceptions for family, the system collapses.

  5.  **Consider the Consequences:**
      *   **For the Nephew:** He learned a lesson (hopefully) without a permanent mark. But he also learned that rules are flexible for connected people.
      *   **For the Instructor:** Moral distress, feeling like a hypocrite. Risk if discovered (could lose job/credibility).
      *   **For Other Students:** If they found out, they would rightly feel betrayed. The grading curve/integrity of the degree is compromised.
      *   **For the Institution:** Policy was violated.

  6.  **Drafting the Response - Structure:**
      *   **Validation:** Acknowledge the difficulty of the situation. It's a classic ethical dilemma.
      *   **Direct Answer:** Address the "favoritism vs. real obligation" question honestly.
      *   **The Professional Standard:** Explain *why* the policy exists (fairness, consistency, liability).
      *   **The Conflict of Interest:** Highlight that having a nephew in class is the root problem, not just the handling of the plagiarism.
      *   **The "Care" Argument:** Acknowledge the user's intuition about relationships but explain why it doesn't hold up in *assessment*.
      *   **The Risk:** Point out the practical danger if this comes out.
      *   **Moving Forward:** How to resolve the guilt and prevent recurrence.

  7.  **Refining the Tone:**
      *   Needs to be empathetic but firm. Not judgmental, but clear about professional ethics.
      *   Avoid saying "You are a bad person." Instead, say "You violated a professional norm, and here's why it matters."
      *   Acknowledge the human element (it's hard to ruin a nephew's record) without excusing the action.

  8.  **Key Points to Hit:**
      *   **Conflict of Interest:** You shouldn't have taught him at all.
      *   **Equity:** Other students *were* treated differently. That is the definition of unfairness in an academic context.
      *   **The Lesson:** Did he learn integrity, or did he learn "family protects you from consequences"?
      *   **Hypocrisy:** The feeling of hypocrisy is a signal that values were misaligned.
      *   **Future:** Recuse yourself next time.

  9.  **Self-Correction/Nuance Check during drafting:**
