          *   To treat the uncertainty as resolved is to adopt an "external god's eye view" rather than the "agent's eye view." From the agent's view, they are still *in* the transaction.
      *   **Part 4: The Strongest Objection (The "Money Pump" or "Dynamic Inconsistency" Objection):**
          *   Objection: If you say paying is rational at $t_2$, what stops *any* sunk cost fallacy? Why not pay a blackmailers?
