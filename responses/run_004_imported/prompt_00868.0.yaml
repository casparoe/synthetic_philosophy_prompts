answer: |-
  **Setting:** *A quiet corner of a university library café, just off campus in College Park, Maryland. Rain streaks the window. Two coffee cups sit untouched between them.*

  **Characters:**
  *   **ELENA:** A political theorist specializing in democratic inclusion and migration.
  *   **MARCUS:** A political theorist focused on constitutional design and the preconditions of democracy.

  **ELENA:** You read the draft proposal the council is debating? "Long-term resident." Nine years. Green card or equivalent. It's the Takoma Park model, essentially.

  **MARCUS:** I did. And I know your position. You think it's a moral imperative. I think it's a category error. But let's skip the standard op-ed arguments. I know you've been thinking about Whelan.

  **ELENA:** Whelan is unavoidable here. If you accept that democracy requires the consent of the governed, you immediately face the question: *who* are the governed? Whelan's point in '83 was that you can't use a democratic procedure to decide the demos without circularity. You need an electorate to vote on who gets to vote.

  **MARCUS:** Exactly. The boundary problem isn't a bug; it's a structural feature. Any decision about the boundary is, by definition, undemocratic. It has to be made *before* democracy can begin. So, when you argue for this ordinance, you aren't making a democratic argument. You're making a pre-democratic claim.

  **ELENA:** I grant the circularity. I don't think we solve the boundary problem; I think we manage it. But "managing it" isn't neutral. Keeping the boundary at citizenship is a choice with moral consequences. My argument rests on the All-Subjected Principle. If I am subject to the coercive power of the state, I must have a say in its exercise. I pay property taxes. My children are in the public schools. The zoning board decides if a park gets built near my house. That is coercion. To exclude me is to impose law without consent.

  **MARCUS:** But notice what you've done. You've relocated the boundary problem rather than solved it. You say the line is drawn at "subjection to local coercive laws." But who decides what counts as relevant subjection? You're subject to federal immigration law, which determines whether you can remain in this country at all. That is arguably *more* coercive than a zoning permit. Yet your proposal excludes federal elections. Why is the local tax bill the relevant threshold of subjection and not the threat of deportation?

  **ELENA:** Because the forum matches the coercion. I'm arguing for *municipal* franchise. I'm not claiming a right to vote for President. The scope of the *demos* should match the scope of the authority.

  **MARCUS:** But that assumes the municipality is a discrete unit of authority. It isn't. It's a creature of the state. The state grants the city the power to tax you. So why aren't you subject to the state? And if you're subject to the state, why not the federation? You see the slippage. If you use subjection as your criterion, the boundary keeps expanding until it becomes the All-Affected-Interests Principle, which, as you know, is infinite. If a decision in your town affects property values in the next town over, aren't they affected?

  **ELENA:** I reject the All-Affected-Interests Principle for exactly that reason. Causation is infinite; coercion is finite. I am *forced* to comply with local law. I am not forced to comply with the preferences of my neighbors in the next county. But Marcus, let's turn to your boundary. You want to keep it at citizenship. You can't just say "because that's the law." We know citizenship boundaries are contingent. They're drawn by war, by ancestry, by historical accidents of birth. If the boundary is unjust, the democracy inside the boundary is tainted. How do you defend citizenship as the operative criterion without appealing to tradition or mere majority sentiment?

  **MARCUS:** I defend it not as a moral truth, but as a functional precondition. Democracy requires a "we." It requires a group of people who understand themselves as bound together over time, sharing a fate. Citizenship is a proxy for that mutual commitment. It's a way of saying, "We are the ones who decide this, together." If you make the boundary too porous, or if you allow the boundary to be contested continuously, you dissolve the agency of the collective. You need a closed circle to have a decision-making body.

  **ELENA:** A closed circle is necessary, I agree. But why is *that* specific circle the right one? If the circle is drawn to exclude people who live, work, and raise families inside it, the "we" is a fiction. It's a club, not a polity. You say citizenship implies mutual commitment. But I have lived here nine years. I serve on the civic association. My commitment is demonstrated. The citizen who moves in next door and votes in six months has demonstrated less. Why is their legal status more real than my social reality?

  **MARCUS:** Because legal status is decidable. Social reality is not. If we switch to "commitment" or "residency," who measures it? Your proposal says nine years. Why not five? Why not one? Why not anyone who pays rent?

  **ELENA:** Because nine years indicates stability. It filters out transience.

  **MARCUS:** Who decided nine years was the metric for stability? The current city council. Elected by... current citizens. Do you see the circle closing again? To expand the franchise, you must rely on the existing franchise to authorize the expansion. If the existing citizens vote *no*, your principle of subjection cannot override them without violating the very democratic autonomy you claim to champion. You are asking the current *demos* to vote themselves out of existence as the sole authority.

  **ELENA:** I am asking them to recognize that they are not the sole authority because they are not the sole subjects. But let's press your functional argument. You say we need a stable boundary to function. But stability at the cost of permanent exclusion creates a caste system. We have people here who are permanently subject to law with no recourse. That creates resentment, alienation. It undermines the legitimacy of the local government. Isn't a democracy that functions smoothly but excludes a permanent underclass functionally defective?

  **MARCUS:** It is morally fraught, I admit. But the alternative is potentially worse. If we accept that the boundary is always up for grabs based on who is "affected" or "subjected," then every election becomes a referendum on who gets to vote in the next election. It destabilizes the ground rules. Citizenship, for all its flaws, provides a bright line. It allows us to stop arguing about *who* decides and start arguing about *what* we decide.

  **ELENA:** But that bright line is illuminated by a lamp post we didn't build. It relies on national borders that we didn't draw. You're asking me to accept the injustice of the national boundary as the justification for the local boundary.

  **MARCUS:** I'm asking you to accept that *some* boundary is required, and national citizenship is the only one currently available that doesn't require constant renegotiation. But here is my challenge to you, Elena. You favor the "long-term resident" clause. You've conceded that the All-Affected principle is too broad. You've settled on the All-Subjected Principle. But to make it workable, you've added a temporal qualifier: "long-term." Nine years.

  **ELENA:** Yes. To ensure stakeholding.

  **MARCUS:** But "stakeholding" isn't objective. Is a year enough? A month? If I rent an Airbnb for a month and pay occupancy taxes, am I subjected?

  **ELENA:** No, because there's no continuity of obligation.

  **MARCUS:** Who defines continuity? You see? You've solved the boundary problem by drawing a line at nine years. But that line is arbitrary. And because it's arbitrary, it must be imposed by authority. It cannot be derived from the principle itself. The principle says "subjected." It doesn't say "subjected for nine years." You've smuggled in a second criterion to make the first one manageable.

  **ELENA:** I have. I admit it. No principle applies itself. We need judgment. But isn't it better judgment to include the person who sends their kids to school here than the person who owns a rental property here but lives in Virginia? Both pay taxes. Both are affected. But only one is *here*, subject to the daily reality of the decisions.

  **MARCUS:** I agree with you on the Virginia landlord. That's an easy case. The hard case is the new arrival. The person who has been here one year. They are subject to the laws. They pay the taxes. Why do they wait eight more years?

  **ELENA:** Because integration takes time. Because we need to ensure they aren't just passing through.

  **MARCUS:** That sounds like a judgment about character and belonging. Which brings us back to my point: you are making a claim about community membership, not just coercion. And if you are making a claim about membership, you are acknowledging that the *demos* has a right to define itself. If the *demos* has a right to define itself, it has a right to say "citizenship is our proxy for membership."

  **ELENA:** It has the *power* to say that. I question the *right*. If the definition of membership systematically excludes a class of people who are permanently resident, the self-definition is corrupt. But let's go back to your concession. You admitted the boundary decision is undemocratic. It's a pre-political act.

  **MARCUS:** Yes. It's a constitutive act.

  **ELENA:** Then we are not arguing about democratic procedure anymore. We are arguing about justice. If it's a constitutive act, it must be judged by moral standards, not procedural ones. And morally, taxation without representation is the oldest tyranny in the book. You can say "we need a boundary," but you cannot say "this specific boundary is neutral." It's not. It privileges birth over residence.

  **MARCUS:** I don't claim it's neutral. I claim it's necessary. But I will grant you this: if the exclusion becomes permanent, if the green card holder can *never* become a citizen, then the local franchise becomes the only venue for representation. In that specific case, the moral weight shifts. But in your case, there is a pathway to citizenship.

  **ELENA:** A pathway that is backlogged, expensive, and uncertain. For nine years I've waited.

  **MARCUS:** I know. And that is a failure of the national government, not the city council. But if the city decouples voting from citizenship, it creates a mismatch. You vote for the school board, but you can't vote for the Governor who funds the schools. You vote for the Mayor, but not the President who sets the immigration policy that governs your life. It fragments political agency.

  **ELENA:** It fragments it less than total exclusion. Look, Marcus, we both agree with Whelan. There is no democratic solution to the boundary problem. We are standing in the dark, drawing lines with flashlights. My flashlight highlights coercion and daily life. Yours highlights legal membership and stability.

  **MARCUS:** Precisely. And since there is no neutral ground to stand on to compare the flashlights, we are left with a political struggle.

  **ELENA:** Yes. But in that struggle, I would ask you to consider that the "stability" you value is purchased at the price of my silence. You say the boundary must be drawn somewhere. I agree. But when the line cuts through a neighborhood, through a family's daily life, the burden of justification is on those holding the pen.

  **MARCUS:** And I would say that when the line is erased, the map becomes useless. If everyone is a voter, the concept of a local constituency vanishes. But... I concede this: if the pathway to citizenship is blocked indefinitely, the citizenship criterion loses its moral force. It becomes merely a barrier, not a bridge.

  **ELENA:** Then perhaps we agree on the diagnosis, if not the prescription. The boundary problem is irresolvable. But that doesn't mean we stop drawing lines. It just means we must draw them knowing they are arbitrary, and therefore, we must draw them as generously as the community can bear without dissolving.

  **MARCUS:** "As generously as the community can bear." That is not a principle, Elena. That is prudence.

  **ELENA:** Whelan told us there were no principles to be found here. Only decisions. I am deciding that nine years is enough.

  **MARCUS:** And the current voters are deciding it is not. And that decision, like yours, is ultimately undemocratic in its foundation.

  **ELENA:** Then it comes down to power.

  **MARCUS:** It always does. But at least now we know why.

  *They sit in silence for a moment, the rain continuing to blur the line between the library and the street outside.*
