answer: |-
  The dust of the Qin border hung in the air, thick and dry as crushed grain. Gongsun Long pulled the reins. The mare stopped, sweating beneath her pale coat. Before them, the wooden barrier was lowered, and a single guard leaned on a spear, his face obscured by the brim of a bamboo hat.

  "No horses," the guard said. He didn't look up. "Law of the pass."

  "This is not a horse," Gongsun said. His voice was calm, practiced, though his hand tightened on the leather reins. He stood to lose the mare if he failed; she was his only transport across the barren lands beyond.

  The guard lifted his head. His eyes were dark, unamused. "It has four legs. It eats hay. It carries a man. It is a horse."

  "You name the shape," Gongsun said, sliding from the saddle. He stood beside the mare, placing a hand on her flank. "When you say 'horse,' you speak of a form. You speak of the head, the hooves, the tail. That is what 'horse' names."

  "I speak of the tax," the guard said. "No horses cross without a permit. You have no permit."

  "I speak of the truth of names," Gongsun countered. "This animal is white. 'White' names a color. 'Horse' names a shape. To name a color is not to name a shape. Therefore, a white horse is not a horse."

  The guard spat into the dust. "If I strike it with this spear, will it bleed like a horse?"

  "It will bleed like a white horse."

  "Then it is a horse." The guard shifted his grip on the spear. The wood creaked. "Turn back. Leave the beast. You may walk."

  Gongsun felt the heat of the sun on his neck. The logic was sound; he had tested it in the courts of Zhao, in the gardens of scholars. But here, the air smelled of sweat and iron, not ink. "Consider this," Gongsun said, stepping closer. "If a lord sends a servant to find a horse, may the servant bring a yellow horse? Or a black one?"

  The guard frowned. "Yes. Any horse."

  "But if the lord sends a servant to find a white horse, may he bring a yellow one?"

  "No."

  "Exactly." Gongsun gestured to the mare. "If 'white horse' were identical to 'horse,' then the request for a horse and the request for a white horse would be the same. But they are not. One accepts yellow; the other rejects it. Since the extension of the terms differs, the terms themselves differ. What you forbid is 'horse.' What I possess is 'white horse.' They are not the same thing."

  The guard straightened. He looked at the mare, then at Gongsun, then back at the mare. For a moment, the logic hung in the air, a delicate structure built of distinctions. It was watertight. Within the realm of language, Gongsun was right. The category "horse" was a subset of form; "white horse" was a compound of form and color. To conflate them was an error of definition.

  But the guard did not live in the realm of language. He lived in the realm of the Qin state.

  "I do not care about the lord's servant," the guard said softly. "I care about the barrier."

  "The law is written in names," Gongsun insisted. "If the law says 'horse,' it means the shape. It does not mean the color. If the magistrates wished to ban white horses, they should have written 'white horse.' By writing only 'horse,' they have excluded nothing but the form. They have left the color undefined. I am merely obeying the precision of your own laws."

  "The law is not written for scholars," the guard said. He stepped around the barrier. He was close enough now that Gongsun could see the chip in his spearhead. "The law is written for things. For beasts that carry men. For beasts that eat grain we need for soldiers. Your 'white horse' eats grain. Your 'white horse' carries a man. Your 'white horse' tires on the road."

  "It does," Gongsun admitted.

  "Then it is a horse." The guard raised the spear, not to strike, but to block the path entirely. "You play with words like stones. You fit them together until they click. But when the sun goes down, and you are hungry, you will not eat 'rice.' You will eat food. And when the bandits come, they will not kill 'a man.' They will kill you."

  Gongsun looked at the mare. She shifted her weight, flicking a fly from her ear. She did not know she was a philosophical paradox. She only knew the heat and the hand on her flank.

  "If you take her," Gongsun said, "you admit that the name governs the thing, not the thing the name. You admit that reality is subordinate to the label."

  "I admit," the guard said, "that I hold the spear. And the spear does not argue."

  Silence stretched between them, filled only by the dry wind rattling the barrier. Gongsun realized then the gulf he was trying to bridge. His argument was perfect, but it existed in a vacuum. It required a world where categories were respected more than utilities. But the world held him to the category of "traveler" and "taxpayer," not "logician." He stood to lose the horse because the guard stood to lose his head if he let a beast of burden pass unchecked. The guard's risk was physical; Gongsun's was merely intellectual.

  Gongsun loosened his grip on the reins.

  "Keep the logic," Gongsun said. "I will keep the road."

  He handed the reins to the guard. The man took them, surprised.

  "You surrender?"

  "I distinguish," Gongsun said, turning his back on the mare. "I distinguish between what is true and what is permitted. You may have the horse. It is, by your standards, a horse. I will walk."

  "It is a fine beast," the guard said, his voice losing its edge. "You could have argued until dusk."

  "Arguments do not cross borders," Gongsun said. He began to walk past the barrier, into the dust of the Qin lands. "Only bodies do."

  He did not look back when the guard called out to him, nor when the mare whinnied, a sound that was neither white nor horse, but simply noise. He walked until the heat blurred the horizon, carrying nothing but the certainty that he was right, and the heavy knowledge that it did not matter.
