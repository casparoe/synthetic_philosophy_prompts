answer: |-
  Here are 9 interview questions tailored for your podcast. They're designed to sound conversational but hit the philosophical pressure points hard, keeping her from defaulting to the "visual cortex" script.

  ### 1. The "V1 Analogy" Limit
  "You've mentioned in past talks that we should think of features in language models like edge detectors in the primary visual cortex (V1). That's a helpful starting point, but biological brains are constrained by evolution and physics in ways neural networks aren't. Where does that analogy break down? Is there a point where saying 'it's just like a neuron' stops explaining the ontology and starts hiding the difference?"

  ### 2. Superposition & Polysemanticity (Required)
  "In superposition, a single neuron or direction seems to encode multiple unrelated concepts depending on the context—like a 'polysemantic' neuron that fires for both 'cats' and 'cars.' If you're a realist about features, what exactly is the 'thing' that exists there? Is the feature the neuron, the direction, or the activation pattern? Because if the same hardware is doing two unrelated jobs, it feels like the 'feature' is less of a physical object and more of a description we're layering on top."

  *   **Follow-up (If she says features exist in a 'sparse subspace' rather than individual neurons):** "Okay, but if the 'real' feature only exists when we mathematically rotate the space to find that sparse subspace, isn't that subspace just a compression algorithm *we* chose? How do you prove the model 'knows' it's in that subspace, versus us just finding a convenient way to describe the math?"

  ### 3. Probing vs. Causal Usage (Required)
  "We know that linear probes can decode information from a model's activations—like gender or sentiment—even when the model doesn't actually use that information to make its decision. It's like finding a shadow that looks like a duck but isn't attached to a duck. How do you distinguish between a 'real' representation that the model is using for work, versus just 'decodable noise' that happens to be readable from the outside?"

  *   **Follow-up (If she says real features must be 'causally efficacious'):** "That makes sense, but causal interventions are notoriously messy—when you ablate a feature, you often break other things nearby. How clean does the surgery have to be before you'll admit the feature wasn't truly distinct to begin with?"

  ### 4. The Privileged Basis Problem (Required)
  "Activation space is rotationally invariant, meaning you can rotate the coordinate system infinitely without changing the model's output. So why should we think the specific directions we find—like the 'sentiment direction'—are a 'privileged basis' that carves nature at its joints? Isn't it possible that any rotation is equally valid, and we're just picking the one that looks most human-interpretable?"

  *   **Follow-up (If she argues that 'sparsity' makes the basis natural):** "But is sparsity a property of the model, or is it a property of *our* desire to understand it? If the model is efficiently using dense superposition, isn't insisting on a sparse basis just forcing the model to look like a symbolic system because that's what we're comfortable with?"

  ### 5. Feature Granularity
  "Where does one feature end and another begin? If I have a 'dog' feature, does that include 'floppy ears,' or is that a separate feature? If realism says these features are 'in there,' there should be a fact of the matter about their boundaries. But in practice, features seem to blur into each other. How do you define the identity conditions for a feature without just drawing arbitrary lines?"

  ### 6. Static Vectors vs. Dynamic Computation
  "Interpretability often treats features as static directions in space—like a vector for 'anger.' But computation is a process; it's a verb, not a noun. By freezing the model and looking for static directions, are we missing the actual reality of the computation? Is it possible the 'real' ontology isn't the features themselves, but the *transition* between them?"

  ### 7. Instrumentalism vs. Realism
  "Let's talk pragmatics. If an instrumentalist approach—treating features as useful fictions rather than real objects—gets us the same safety results (like catching deception or bias), does the metaphysical realism actually matter? Why should we care if the feature is 'true' if the 'fake' version works just as well for alignment?"

  ### 8. Scaling and Stability
  "As models get larger and train on more data, do the features you're realist about stay stable? If a 'truthfulness' feature in a 7B model looks totally different in a 70B model, does that undermine the idea that there's a single, real 'truthfulness' entity to be found? Or do you expect features to converge as we scale?"

  ### 9. Falsifiability & The "Epicycle" Problem (The Closer)
  "Finally, I want to ask about what could change your mind. In the history of science, theories sometimes survive by adding complexity—like Ptolemaic astronomy adding epicycles to explain away planets moving backward. If every time we find a counterexample to feature realism (like polysemanticity or rotation invariance), the answer is 'the feature is just messier than we thought,' how do we avoid that trap? What specific interpretability result would count as actual evidence *against* your view, rather than just evidence for a more complicated feature?"
