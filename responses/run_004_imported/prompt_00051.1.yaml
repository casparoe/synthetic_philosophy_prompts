      *   *Is the advice actionable?* Yes, provide a decision matrix or guidelines.
      *   *Did I address the "converge on outcome" part?* Yes, this is the "Overlapping Consensus" section.

  9.  **Final Polish:** Check for clarity, flow, and ensure the distinction between PBP and CBP is sharp. (Make sure to mention List & Pettit, the key theorists).

