      *   *Ines's Stroke:* A stroke is a sudden event. The river-bed usually shifts slowly. How to reconcile? The stroke damages the *mechanism* that keeps the bed hard, not necessarily the bed itself. It's a structural failure in the *retention* of certainty, not the content.

