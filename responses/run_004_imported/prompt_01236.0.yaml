answer: |-
  The workshop smelled of ozone and old brass. On the central table lay the heart of the matter: the Model 4 Respirator. It was a sprawling lattice of tubes, pistons, and synthetic veins, currently silent. Beside it sat a single, disconnected valve, no larger than a thumb.

  Elias wiped his hands on a rag stained with grease. He didn't look at the machine as a whole. His eyes tracked the individual screws, the tension in the rubber tubing, the specific oxidation on the copper wiring. To him, the table held no singular object. It held a few thousand simples, arranged respirator-wise.

  "It won't cycle," Mara said. She stood by the window, her arms wrapped around herself. She was looking at the machine, but she saw the rhythm it was supposed to keep. She saw the life it was meant to sustain in the room down the hall. "You said you could fix the composition."

  Elias picked up the disconnected valve. He rolled it between his fingers. "I can arrange the parts. I can put this valve adjacent to the intake manifold. I can tighten the bolt to four newton-meters."

  "Will it breathe?"

  Elias set the valve down. He didn't place it *on* the machine; he placed it *next to* the collection of parts that looked like a machine. "There is no 'it,' Mara. There are only these components. When they move in a specific pattern, air flows. When they stop, air stops. But there is no entity here that breathes. There is no 'Respirator' that can be broken or fixed. There is only brass that is here, and brass that is there."

  Mara turned from the window. Her eyes were red, but her voice was steady. "That's not true. You know it's not true. When the parts work together, when their activity is unified, they become something more. They become a system. They become a part of *him*."

  She walked to the table and placed her hand on the casing. To Elias, she was touching metal. To Mara, she was touching a boundary. She believed in the special ontology of the living. For her, composition wasn't a matter of contact or fastening; it was a matter of life. The xs composed a y only when the activity of the xs constituted a life event. The machine wasn't just an object; it was an extension of the organism down the hall. As long as the machine participated in the life of the patient, it was part of the composite whole.

  "If I weld this valve shut," Elias said, picking up a torch, "do I kill the machine?"

  "You kill the function," Mara corrected. "You stop the life-activity."

  "I rearrange the simples," Elias countered. He lit the torch. The flame hissed, blue and violent. "If I melt this valve into a lump of slag, the atoms remain. The mass is conserved. Nothing goes out of existence. You speak as if 'The Respirator' is a ghost that haunts the brass. If the ghost leaves, the brass remains. So what is lost?"

  "The unity," Mara said. "When the activity of these parts catches hold, when they sustain a life, they lock together. They aren't just near each other anymore. They are *one*. If you stop that activity, the one dissolves. You aren't just moving metal, Elias. You are unmaking an object."

  Elias applied the flame to the valve. He watched the metal glow cherry-red. He was a nihilist in his bones, though he never used the word. He believed the world was a desert of simples. There were no tables, no chairs, no machines. There were only atoms arranged table-wise, chair-wise, machine-wise. The idea that contact or function could summon a new entity into existence was magic to him. It was superstition dressed in engineering.

  He quenched the valve in oil. Smoke curled up. "It is done. The valve is fused. The arrangement is altered."

  "Did you fix it?"

  "I changed the arrangement," Elias said. He walked to the sink and began to wash his hands. He scrubbed between his fingers, removing the grease, the evidence of his work. "Now you must decide if the new arrangement suits your needs."

  Mara looked at the fused valve, then at the open port on the main unit. The machine was incomplete. It was a collection of parts that no longer fit together.

  "If I take this to him," Mara said, gesturing to the hallway, "and we attach it... will it be the same machine that kept him alive yesterday?"

  "There was no machine yesterday," Elias said, drying his hands. "There was an arrangement that functioned. There will be a new arrangement today. If it pumps air, it serves your purpose. But do not ask me if it is the *same*. Identity implies an object that persists through time. I see only temporal slices of matter."

  Mara picked up the heavy casing. It was cold. She felt the weight of it, the potential energy stored in the springs. She believed that the world was sparse, but not that sparse. She held to the view that composition was rare, special. It happened only when the parts caught fire with life. A pile of sand was not an object. A scattered deck of cards was not an object. But a living man? Yes. And a machine that was the literal engine of that life? It bordered on the edge. It participated in the life. Therefore, it partook in the composition.

  "If I replace this valve," she said, "the machine changes. If I replace the tubes, it changes. If I replace the casing... at what point does it stop being the thing that saves him?"

  "At no point," Elias said. "Because it never started being a 'thing.' You are worried about the Ship of Theseus, Mara. But there is no ship. There is only wood, and water, and men who sail."

  "That's a cold way to live," she whispered.

  "It is an honest one," Elias replied. "If you believe the object is real, then breaking it is a tragedy. Something dies. But if you know it is only an arrangement, then breakage is just movement. The valve is not broken; it is simply elsewhere than the port. The tragedy is in your head, in your expectation of unity."

  Mara connected the fused valve to the intake. It didn't fit perfectly. She had to force the tubing, stretch the rubber until it groaned. She secured the clamps. She flipped the switch.

  The machine shuddered. A piston fired. Then another. A rhythmic *hiss-thump, hiss-thump* filled the workshop. Air began to flow through the tubes.

  Mara watched the pressure gauge rise. "It's working."

  "The parts are moving," Elias said. He didn't look at the gauge. He was looking at the piston, isolated from the whole. "The steel is sliding against the cylinder. The rubber is expanding."

  "It's breathing," Mara insisted. She lifted the machine. It was heavy, awkward, vibrating with a simulated pulse. "It's ready."

  She moved toward the door. Elias stepped in her path. He didn't block her physically; he just stood there, a barrier of perspective.

  "Down the hall," Elias said, "there is a man. He is composed of cells. Those cells are composed of molecules. When his heart stops, the molecules do not stop. They scatter. The activity ceases. The composition ends. The man goes out of existence."

  "Don't," Mara warned.

  "I am only stating the conditions," Elias said. "If you attach this machine, you extend the activity. You prolong the composition. But know this: when you eventually turn it off, you will not be killing a man. You will be stopping an event. The simples will remain. The universe will lose nothing but a pattern."

  Mara looked at him, then at the machine in her arms. The *hiss-thump* was steady. It sounded like a heartbeat. To her, that sound was the boundary of existence. It was the line between the scattered dust and the unified soul. She knew that if she walked out of this room, she was carrying a piece of a whole that was greater than the sum of its parts. She knew that if the machine failed, something would vanish from the world that no amount of brass could replace.

  "Maybe," Mara said, shifting the weight of the machine. "But while it's running, it's real. And while he's breathing, he's here."

  She walked past him. Elias watched her go. He listened to the rhythm of the machine fading down the corridor. He looked back at the table. There was a pile of shavings on the wood, a drop of oil, the cold torch.

  He reached out and swept the shavings into his hand. They were sharp, jagged, distinct. There was no pile, he thought. There were only shavings, arranged heap-wise. He opened his hand and let them fall back to the table. They scattered with a dry rattle.

  Nothing had been lost. Nothing had been gained. Only the arrangement had changed.

  But from down the hall, a monitor beeped, steady and strong, marking out a life that refused to be reduced to the sum of its parts. Elias turned off the workshop light. In the dark, the difference between a machine and a ghost was impossible to see.
