answer: |-
  This is a superb conceit. The parallel between the cross-correspondences (fragmentary, interlocking evidence designed to bypass the skepticism of the living) and a modern historian's scripted séance is structurally elegant. It allows you to treat the *method* of communication as the message itself.

  To answer your question: Sidgwick is often caricatured as a desperate believer, but the historical record suggests he was a desperate *inquirer* who happened to hope the evidence would go a certain way. His reaction to the Bem/Wagenmakers episode would be characterized by a specific kind of grim satisfaction. He would not be shocked by the failure of the evidence; he would be vindicated by the correction of the method.

  Here is a reconstruction of Sidgwick's likely position, anchored in his philosophical and methodological commitments, broken down by the specific issues you raised.

  ### 1. On Bem's Significance Testing vs. The Bayesian Challenge
  Sidgwick would almost certainly side with the logic of the Bayesian critique, though he would phrase it in Victorian terms of "antecedent improbability."

  Sidgwick was deeply influenced by the probability theories of his contemporaries (like his brother-in-law Arthur Balfour and the circle around Francis Galton). He understood that a statistical anomaly is not a fact until the possibility of error is eliminated. In the *Creery* case, he was willing to accept thought-transference only so long as the conditions ruled out signaling. When the probability of signaling rose, the probability of telepathy fell, regardless of the "hits."

  Regarding Bem's $p < .05$: Sidgwick would view this as a modern version of "accumulating coincidences." He would argue that a $p$-value does not account for the *a priori* likelihood of the hypothesis. Since the existence of precognition upends our understanding of causality (much like telepathy upended the isolation of minds), the burden of proof is exponentially higher than for a standard psychological effect.

  **The Dialogue Angle:** He would not speak of "priors" or "Bayes Factors." He would speak of **"the weight of presumption."** He would tell your historian that Bem measured the noise correctly but underestimated the silence required to hear a signal. He would agree with Wagenmakers that the statistics were "too generous," not because the math was wrong, but because the *standard of proof* was too low for the magnitude of the claim.

  ### 2. On Preregistration and the File-Drawer Problem
  This is where Sidgwick would feel most at home. The "file-drawer problem" (publishing only successes) was the bane of the early SPR. They were inundated with anecdotal success stories but lacked a systematic record of failures.

  Sidgwick spent years trying to institutionalize the collection of *negative* cases. He understood that human memory is self-selecting. Preregistration is, effectively, the technological solution to the problem of "selective testimony" that plagued the Victorian séance room.

  **The Dialogue Angle:** He would view preregistration not as bureaucracy, but as a **moral safeguard against self-deception.** He would likely note that the Victorian safeguards (sealed envelopes, controlled lighting, committees) were the physical ancestors of preregistration. Both are attempts to bind the hands of the investigator so they cannot unconsciously aid the phenomenon. He would applaud the shift toward transparency as the maturation of the field he helped found.

  ### 3. On the Replication Crisis: Vindication or Disappointment?
  This is the crux of your novelist's dilemma. Would he be dispirited?

  **The Short Answer:** He would be dispirited by the *human frailty*, but vindicated by the *process*.

  Sidgwick's psychical research was never about proving spiritualism for its own sake; it was about testing the limits of empirical inquiry. When the evidence for the Creery sisters collapsed, he did not cling to them. He moved on. He resigned from the SPR for a time over the Hodgson-Blavatsky affair because he detested the contamination of research by fraud.

  The Bem episode demonstrates exactly what Sidgwick feared: that the desire for a result (fame, paradigm shift, or in Sidgwick's case, moral reassurance) corrupts the data. However, the fact that the scientific community *corrected* this—through Bayesian critique and failed replications—would look to him like the **self-correcting mechanism finally working.**

  He hoped psychical research would become a "science of the future." The fact that mainstream psychology absorbed the tools of skepticism (replication, rigor) to debunk a psi claim would look to him like the victory of the *method* over the *subject*.

  **The Dialogue Angle:** He would likely express a tragic stoicism. The failure of Bem proves that nature does not yield her secrets to wishful thinking. This is disappointing for the man who wanted to reconcile Duty and Self-Interest, but satisfying for the philosopher who values Truth above Comfort.

  ### 4. The Ethical Stakes (The *Methods of Ethics* Connection)
  You mentioned the "dualism of practical reason." Sidgwick worried that if the universe is not morally ordered (i.e., if virtue doesn't lead to happiness, perhaps in an afterlife), then rationality is fractured.

  If Bem had succeeded, it would have been a crack in the door of the "Moral Order." Since Bem failed (in Sidgwick's judgment), does the Moral Order collapse?

  **Sidgwick's Likely Position:** No. Sidgwick was an agnostic who lived *as if* morality were binding. He would argue that the failure of precognition experiments does not disprove the Moral Order; it merely removes one potential *empirical support* for it. We are left, as we were in 1880, with the necessity of faith or rational intuition, not scientific proof.

  **The Dialogue Angle:** This gives your "Sidgwick" a poignant line. He might suggest that seeking the Moral Order in a psychology lab is a category error. The "cross-correspondences" were an attempt to speak from beyond; the failure of Bem is a reminder that the living must build their ethics without relying on the dead to validate them.

  ### Summary for the Dialogue
  If I were writing the "Sidgwick" voice in your séance, I would anchor his response in these three points:

  1.  **On the Statistics:** "You measure the shadow, but you have not weighed the light. A coincidence, however frequent, is not a law until the possibility of chance is exhausted. These modern Bayesians... they have merely put a number to what we called 'common caution'."
  2.  **On the Method:** "This 'preregistration'... it is the sealed envelope of your age. It binds the hand of the trickster, even when the trickster is the experimenter himself. That is progress."
  3.  **On the Outcome:** "Do not mistake my lack of surprise for cynicism. We founded the Society not to prove we were right, but to ensure we were not wrong. If your science corrects itself, then the inquiry survives, even if the phenomenon does not. I would rather have a clean failure than a dirty miracle."

  ### A Note on the "Cross-Correspondence" Parallel
  Since your modern historian is staging a *scripted* séance based on archives, Sidgwick might offer a meta-commentary on this. The original cross-correspondences were intended to be too complex for the medium to forge. Your historian is *intentionally* forging a complex message to make a point.

  Sidgwick might find a dark irony here. He spent his life trying to distinguish the genuine signal from the human script. Your historian is using a human script to generate a genuine philosophical signal. Sidgwick would likely appreciate the paradox: **that truth is sometimes best approached through a conscious fiction, provided the fiction reveals a deeper reality.**

  He might conclude: *"We sought to hear the dead speak so the living might agree. You have made the dead speak to show the living how they listen. Perhaps that is the only correspondence that matters."*

  This approach keeps him consistent: skeptical of the phenomenon, but deeply committed to the ethical and epistemological utility of the inquiry.
