      *Critique 1:* Too dry. Needs more warmth for the grandma in the back. Needs to sound like a toast, not a lecture. The Parfit reference should be subtle or translated into plain English. The "no self" part needs to sound liberating, not scary.

  5.  **Drafting - Iteration 2 (Focusing on Tone and Metaphor):**
      *   Start with the retreat story. Silence brings clarity.
      *   Address the "no self" thing directly but gently.
      *   Metaphor: A dance. Or a river. Let's use the river.
      *   The vow: It's not a contract between statues. It's a promise to keep rowing the boat together.
      *   Address the relatives: This doesn't mean the love isn't real. It means it's alive.
      *   End with a blessing on the *flow*.

      *Critique 2:* Better. But needs to explicitly tackle the "who keeps the vow" question as requested. The prompt asks to *work through* the problem, not gesture past it. I need to explain *how* a vow works without a self.
      *   *Idea:* The vow creates the self. The intention shapes the future aggregates. The "I" that keeps the vow is constructed *by* the keeping of the vow.

  6.  **Drafting - Iteration 3 (Refining the Philosophy):**
      *   *Key Insight:* Identity is narrative. The marriage *makes* the continuity.
      *   *Language:* Avoid jargon like "aggregates" or "Parfit" unless explained simply. Use "stories," "moments," "causes."
      *   *Emotional Core:* The vulnerability of impermanence makes the commitment *more* precious, not less.

  7.  **Writing the Speech (incorporating constraints):**
      *   *Word Count Check:* 4-5 minutes is roughly 600-750 words.
      *   *Opening:* Mention the retreat. Establish the bond.
      *   *The "No Self" Hook:* Acknowledge the teacher and the lineage.
