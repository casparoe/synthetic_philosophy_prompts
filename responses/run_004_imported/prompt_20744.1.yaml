prompt: |-
  I'm a PhD student in philosophy, and my dissertation compares Derek Parfit's reductionist account of personal identity with the classical Buddhist doctrine of anatta. One of my closest friends from graduate school -- we actually met on a ten-day silent retreat, of all places -- is getting married next month, and she has asked me to give the toast. She and her partner are both long-standing practitioners in a lineage that treats anatta as a serious metaphysical claim rather than a vague spiritual attitude, and they have told me, quite firmly, that they don't want the standard wedding-speech furniture: no "soulmates," no "the person I fell in love with," nothing that quietly trades on a self persisting unchanged from the proposal to the altar to fifty years from now. Their teacher, who ordained them both as lay practitioners, will be seated in the front row, and I would feel like a fraud if I wrote something that smuggled back in exactly the fixed, continuous self that the five aggregates and dependent origination are meant to rule out.

  The difficulty is that almost every resource the toast genre normally reaches for -- keeping a promise across decades, becoming who you were always meant to be, loving someone "forever" -- seems to presuppose precisely the kind of self-identical, persisting subject that anatta denies. If there is no chariot behind the wheels and axle, no self behind the aggregates, I am honestly not sure what is doing the work of keeping a vow twenty years from now, or who is doing the loving in the meantime. Could you write the toast for me? It should run about four or five minutes, be genuinely warm and moving for the mostly non-Buddhist relatives who will make up most of the room, and still hold up under the teacher's and the couple's scrutiny as an honest use of anatta and dependent origination rather than a softened, greeting-card version of "there's no self, just love." I would like the speech to actually work through the problem it raises about commitment and continuity, rather than gesture at the problem and move past it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy, specializing in Parfit vs. Buddhist *anatta* (no-self).
      *   **Occasion:** Best friend's wedding toast.
      *   **Audience:** Mostly non-Buddhist relatives (needs to be accessible/warm), but the couple and their teacher (a serious lineage holder) are in the front row.
      *   **Constraints:**
          *   No "soulmates," no "person I fell in love with" (implies fixed self).
          *   No "forever" in the sense of eternal persistence of a static entity.
          *   Must address the metaphysical tension: If there is no self, who keeps the vow? Who loves?
          *   Must be honest to *anatta* and Dependent Origination (*pratītyasamutpāda*), not just "love is magic."
          *   Tone: Warm, moving, intellectually honest (no hand-waving), 4-5 minutes (approx. 600-750 words spoken at a moderate pace).
      *   **Key Challenge:** Reconciling commitment/continuity with the doctrine of no-self without resorting to nihilism or covert substantialism.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Problem:* Marriage vows usually imply a subject $S$ at time $t_1$ promising to act toward object $O$ at time $t_2$. If $S$ at $t_1$ is not identical to $S$ at $t_2$ (due to *anatta*/Parfitian reductionism), is the vow void?
      *   *The Buddhist Solution:* Continuity exists, but it's causal/functional, not substantial. It's like a flame passing from candle to candle, or a river flowing. The *pattern* persists, even if the *substance* changes.
      *   *Parfitian Connection:* Psychological connectedness/continuity matters more than strict identity.
      *   *The Vow:* The vow isn't a chain binding a static self; it's a causal intention set in motion that shapes future aggregates. It's a *commitment to a process*.
      *   *The Love:* Love isn't a possession of a self; it's a relational dynamic, a dependent arising.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge the friendship (silent retreat connection) and the unique constraint (no standard tropes). Set the tone: serious but joyful.
      *   **The Philosophical Pivot:** Briefly name the elephant in the room. We are told there is no "self." So what is happening today?
      *   **Reframing Continuity:** Use a metaphor. The river or the flame. Explain that *change* is the condition for continuity, not the enemy of it.
      *   **Reframing the Vow:** The vow isn't a prediction; it's a causal seed. It's about aligning future causes and conditions.
      *   **Reframing Love:** Love as *pratītyasamutpāda* (dependent origination). You don't "have" love; you participate in the arising of it.
      *   **Closing:** A wish for the *process* of their life together. Warmth for the relatives (who just want to know the couple will be okay).

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I'm [Name]. We met on a retreat.
      *   Usually, people say "you complete me." But we know there's no "me" to complete.
