answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Partner A]'s friend for many years. We actually met on a ten-day silent retreat. We spent a week and a half not speaking, sitting in a hall together, which is a strange way to start a friendship, but it taught us early on that the deepest connections don't always require a constant narration of "me" and "you."

  That experience brings me to a peculiar challenge. [Partner A] and [Partner B] have asked me to stand here and say something true about marriage. But they have also asked me to avoid the usual furniture of wedding toasts. They have asked me not to speak about "soulmates," or the "person you fell in love with," or a love that stays "the same forever."

  For most of you, this might sound like semantic fussiness. But for this couple, and for the teacher seated in the front row, it is a matter of honesty. They practice in a lineage that takes the doctrine of *anatta*—or no-self—seriously. They understand that there is no fixed, unchanging core inside us that persists from moment to moment. The person [Partner A] was when they first met [Partner B] is not the person standing here today. And the person standing here today will not be the person waking up next to [Partner B] twenty years from now.

  So, this raises a difficult question. If there is no permanent self, who is getting married? And more importantly, who is going to keep the vows? If the "I" that says "I do" dissolves into the past, is the promise void?

  It is tempting to say, "Oh, don't worry, love transcends all that." But that is a greeting card, not a philosophy. The honest answer is harder, but I think it is more beautiful.

  In this view, continuity is not a thing; it is a process. It is like a river. The water in the river today is not the water in the river tomorrow. The shape of the banks changes. But we still call it the same river. Why? Because of causal continuity. The flow of the water now determines the flow of the water later.

  Marriage, then, is not a contract signed by two static statues. It is a mutual agreement to tend the flow.

  When you make a vow without a fixed self, the vow does not bind a person; it shapes a future. The intention you set today becomes a cause that conditions the person you will become tomorrow. You are not promising that you will never change. You are promising that your changes will be conditioned by care, by patience, and by the welfare of the person standing next to you.

  The "I" that keeps the vow twenty years from now will exist only if you build the causes for that person to exist today. You build that person through every act of kindness, every moment of listening, every time you choose understanding over being right. You are literally constructing the future partner who will be there to hold you when you are old.

  And what of love? If there is no self to possess it, what is it?

  In the language of dependent origination, nothing exists on its own. Everything arises in dependence on conditions. Love is not a noun you hold; it is a verb that happens. It arises in the space between you. It depends on the conditions you create. It is fragile, because all conditioned things are fragile. But that fragility is not a flaw; it is what makes it alive. A plastic flower never dies, but it never lived.

  To the family and friends here who might find this abstract: I want you to know that this view does not make their commitment less secure. It makes it more active. They are not relying on a magical bond to carry them. They are relying on the daily work of creating the conditions for love to arise.

  [Partner A] and [Partner B], you know better than anyone that the self is a story we tell. My wish for you is that you tell a story together that is wide enough to hold your changes. May you find comfort in the fact that you do not have to be the same people you are today to remain true to each other. You only have to be true to the intention that connects you.

  May your causes be wholesome. May your conditions be supportive. And may the river of your practice flow on, changing every moment, yet remaining, always, one path.

  To [Partner A] and [Partner B].
