  7.  **Final Review of the "War and Peace" issue:**
      *   In *What Is Art?*, Tolstoy writes: "I know that my own works... are bad art." He classifies *War and Peace* as exclusive art. He does *not* give it a pass as "great art" under his new theory. He acknowledges it transmits *some* feeling, but ultimately it fails the test of universal religious perception of the time. So the student is definitely wrong there.
