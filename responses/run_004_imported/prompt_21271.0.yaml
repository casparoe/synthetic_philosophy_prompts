          *   Let's dock points for the factual error on *War and Peace* because it misrepresents Tolstoy's stance in *this specific book*.
          *   Part (a): 9/10 (Sincerity emphasis is good).
          *   Part (b): 4/5 (Shakespeare is perfect, *War and Peace* is factually wrong regarding *What Is Art?*).
