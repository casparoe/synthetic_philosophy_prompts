answer: |-
  **The Illusion of Diversion: Why Surrogate Goals Fail Against Acausal Threats**

  In the landscape of formal decision theory, few problems are as vexing as the acausal threat. Unlike standard blackmail, where a causal lever exists between payment and safety, acausal threats operate through logical correlation or simulation. The threatener does not need to causally influence the target; they need only predict the target's disposition with sufficient accuracy to make the threat binding. In response to this, some theorists have proposed the "surrogate goal" strategy: an agent artificially inflates the value of an inert object (a sculpture, a number, a trivial promise) and commits to defending it with the same ferocity as their actual values. The hope is to divert the threatener's attention, sparing the agent's genuine interests while maintaining a deterrent posture. While this strategy offers an elegant conceptual workaround to the vulnerability of real values, a rigorous analysis reveals it to be fundamentally unstable. While the objection regarding credibility can be resolved within Functional Decision Theory (FDT), the objection regarding conjunctive threats demonstrates that surrogate goals fail to provide robust protection against sophisticated, idealized adversaries. Consequently, adopting a surrogate goal is not a rational, stable strategy for an agent operating in the formal environments where acausal threats are most salient.

  To evaluate the strategy, we must first address the internal coherence of the commitment. The second objection raised in your seminar concerns credibility: why should an agent defend a surrogate once the threat is active, given that the surrogate possesses no intrinsic value? In Causal Decision Theory (CDT), this objection is fatal. A CDT agent, upon facing the *fait accompli* of a threat, recognizes that the surrogate's destruction is either inevitable or irrelevant to their actual utility, and thus folds. However, within the framework of FDT or Updateless Decision Theory (UDT), this objection dissolves. These frameworks treat the agent's decision as the output of a fixed algorithm or policy. To adopt a surrogate goal is not to bluff; it is to modify one's source code. If an agent successfully rewrites their utility function to assign high value to the sculpture, then, at the moment of the threat, the destruction of the sculpture *is* a genuine loss. The commitment is credible because the agent has become the type of agent for whom the commitment is optimal. Provided the agent can successfully precommit or self-modify before the threatener models them, the credibility objection is not a barrier. The agent genuinely cares, and the threatener's model correctly reflects this.

  However, the solvability of the credibility problem merely sets the stage for the strategy's ultimate failure, which lies in the first objection: the conjunctive threat. The surrogate goal strategy relies on a specific hope: that the threatener will be indifferent between targets and, faced with a choice between threatening the real value or the surrogate, will select the surrogate. This hope assumes a disjunctive structure to the threat space (Threaten A *or* Threaten B). Yet, for a sophisticated threatener, the threat space is conjunctive (Threaten A *and* B).

  Consider the leverage mechanics. A threat works if the expected disutility of the threatened outcome exceeds the cost of compliance. If an agent values their life at 100 utility units and the sculpture at 100 utility units (due to the surrogate modification), a threat against life alone offers the blackmailer 100 units of leverage. A threat against the sculpture alone offers 100 units. But a threat against *both* offers 200 units of leverage. If the blackmailer's goal is compliance, and they possess the capacity to threaten both, they are strictly incentivized to do so. There is no "diversion" occurring; there is only an expansion of the attack surface. The surrogate goal does not make the real goal safer; it merely provides an additional handle for the threatener to grasp.

  Proponents of the surrogate strategy might argue that threatening both is more "expensive" for the threatener. In physical contexts, this holds weight; destroying two objects requires more effort than one. In the context of acausal threats, however, this defense crumbles. Acausal threats often rely on logical implication or computational simulation. If a predictor is simulating the agent to determine their response, the marginal computational cost of simulating the destruction of both the life and the sculpture is negligible compared to the simulation of the agent's mind itself. If the threat is logical (e.g., "I will instantiate a world where you suffer"), the logical conjunction of two suffering states does not necessarily double the "cost" to a logical threatener in the way physical resource constraints would. In the idealized formal settings where FDT is applied, we generally assume threateners have sufficient capacity to model the relevant logical correlations. If the cost of expanding the threat is near-zero, the conjunctive threat dominates the single target threat, rendering the surrogate useless as a shield.

  Furthermore, the strategy introduces a new vulnerability: the transparency of the defense. For the surrogate goal to function as a deterrent, the threatener must know about it. If the threatener is unaware, they will target the real values directly. But if the threatener *is* aware—as they must be for the diversion to work—they can simply update their model to include the surrogate in the punishment package. The strategy requires the agent to publicize their vulnerability (the surrogate) to gain protection, but in doing so, they hand the threatener the blueprint for a more potent attack. This creates a paradox where the success conditions of the strategy (threatener knowledge) are the same conditions that enable its defeat (conjunctive threats).

  There is, admittedly, a narrow niche where surrogate goals might yield positive expected utility. If the threatener is resource-bounded or faces risks proportional to the magnitude of the threat (e.g., a "mutually assured destruction" dynamic where inflicting more damage increases the chance of the threatener's own detection or destruction), then inflating the stakes via a surrogate could deter the threat entirely. If the cost of executing a conjunctive threat exceeds the blackmailer's expected gain from compliance, they may desist. However, this relies on external constraints on the threatener's capabilities, not on the logical structure of the decision theory itself. It turns the surrogate goal into a gamble on the adversary's bounded rationality rather than a robust decision-theoretic shield. In a graduate seminar focused on *formal* decision theory, we are typically concerned with idealized agents and logical possibilities, not contingent resource limitations. In that idealized space, the assumption of costless logical conjunction holds, and the strategy fails.

  Therefore, we must reach a definite verdict. The surrogate goal strategy is **irrational** as a general defense against acausal threats. While it successfully solves the time-consistency problem through FDT-style precommitment, it fails to solve the game-theoretic problem of leverage. By artificially inflating the stakes without increasing the cost to the threatener, the agent does not dilute the threat; they amplify the potential loss without gaining a corresponding increase in safety. A sophisticated threatener will not choose between the real goal and the surrogate; they will threaten both, extracting maximum compliance for minimal additional cost.

  The only condition under which this strategy becomes rational is if the agent can successfully impose a *marginal cost* on the threatener for each additional value threatened that scales faster than the leverage gained. But since the agent cannot control the threatener's cost function, relying on this is not a decision-theoretic solution but a hope for adversary incompetence. For an agent seeking a stable policy against acausal threats, the surrogate goal is a distraction. It creates the illusion of security while actually expanding the surface area of vulnerability. The rational response to acausal threats remains what it has always been in the formal literature: cultivate a disposition of non-compliance so robust that the threat is never issued in the first place, rather than attempting to redirect a threat that, in the logical realm, can strike everywhere at once.
