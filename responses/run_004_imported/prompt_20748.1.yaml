  The silence in the laboratory was heavier than the lead lining of the walls. Elias moved through the space with the careful, reverent slowness of a mourner tidying a gravesite. On the central table, the apparatus sat cold and inert. It was a ugly thing, really—a modified pistol grip wired to a Geiger counter, linked to a decay source that didn't care about love, or logic, or the future.

  Mara had called it a bridge. Elias called it a guillotine.

  He picked up her notebook, the leather cover worn smooth by her nervous thumbs. The last entry was dated three days ago, the day of the funeral. *Trial 1 of 50,* she had written in her sharp, angular script. *Subjective continuity assured. Objective probability irrelevant.*

  He knew what she believed. She believed that consciousness was a traveler that could only ride the roads where it existed. To her, the gun would never fire. She would hear only the click of the hammer falling on an empty chamber, over and over, fifty times. She would walk out of this room believing she had proven something profound about the fabric of reality.

  But Elias was not in that room. Not anymore.

  He was in the branch where the gun had fired. He was in the world where the bullet had torn through the chest of the woman who made his coffee every morning. He was the evidence of the odds she had dismissed. For him, the probability wasn't irrelevant. It was the only thing that mattered. It was the weight of the casket, the cost of the plot, the silence in the kitchen.

  He opened the notebook to the earlier pages. She had mapped out the trajectory. She expected to survive the impossible. She expected to become a statistical ghost, walking through a world where her own existence became increasingly improbable.

  Elias traced the line of her handwriting. He tried to imagine the woman who would emerge after fifty clicks. In her mind, she would be the same Mara who walked in. But Elias knew better. He remembered a conversation they'd had months ago, before the madness took hold, when they discussed what made a person *them*. She had laughed then, talking about teletransporters and broken bridges.

  "If you copy me," she had said, "and destroy the original, the copy is still me."

  "But the copy hasn't lived the loss," Elias had replied. "The copy hasn't grieved."

  Now, staring at the device, he realized the horror of her plan wasn't just the risk of death. It was the cost of survival. Every time the quantum event split the world, leaving her alive in one branch and dead in the other, the "measure" of her existence thinned. She was betting on becoming a miracle. But miracles are outliers. They are exceptions to the rule of being.

  The Mara who survived fifty trials wouldn't just be lucky. She would be unmoored. She would be a consciousness stranded in a reality so unlikely it barely had the weight to hold her. What kind of mind survives that? A mind that has severed its connection to the common world, to the shared risk that binds people together. She would be alone, not just because Elias would be dead in her branch, but because she would no longer be human in any meaningful sense. She would be a pattern of survival, stripped of context.

  He closed the notebook. The lab felt colder. He could almost hear the phantom echo of the shot that had killed her here. In another world, another Elias was watching her walk out of that door, smiling, triumphant. That Elias would hold her hand. That Elias would kiss her cheek.

  But Elias wondered if that Mara would feel the kiss. Would she feel the warmth, or would she just be processing the data of affection? If identity is just continuity of memory, then yes, she would be Mara. But if identity is also about shared vulnerability, about the knowledge that the end is possible, then she was already gone. She had traded her mortality for persistence. She had chosen to be a recording that never stops playing, rather than a song that ends.

  He walked over to the machine. It was simple to disable. He didn't need to understand the quantum mechanics to know that the circuit was broken. He pulled the wiring from the decay source. The click of the pliers was loud in the quiet room.

  He wasn't doing this to stop her. She was already gone from this world. He was doing it to stop the echo. He couldn't bear the thought of the other Elias, the one who got to keep her, watching her degrade into a statistical anomaly. He couldn't bear the thought of a Mara who survived so many deaths that she forgot what it meant to be alive.

  In this world, she was dead. She was finite. She was real.

  Elias placed the notebook on the table, next to the disabled gun. He thought about the asymmetry of their stakes. She had wagered on infinity. He had wagered on grief. He realized now that grief was the heavier, more honest weight. It proved that she mattered. It proved that the end mattered.

  He turned off the lights. The lab plunged into darkness, save for the small red LED on the power strip that blinked out as he pulled the plug. There was no superposition here. No branching paths. Just a man walking out of a room, leaving the dead to their rest, and the immortals to their lonely, impossible luck.

  He locked the door behind him. The hallway was ordinary, mundane, and blessedly singular. He walked toward the exit, carrying the weight of a world that ended, knowing it was the only world that deserved to exist.
