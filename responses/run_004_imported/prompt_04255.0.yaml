answer: |-
  Your TA is right to raise a flag here. While the "bold Aquinas" hook is pedagogically seductive, the claim that *any ordinary citizen* may licitly kill a tyrant *without waiting for public authority* is not a fair summary of Aquinas's considered position. In fact, leaning into that interpretation risks conflating medieval corporatism with early modern resistance theory in a way that obscures the very historical development you're trying to teach.

  Here is the breakdown of why that summary is problematic, followed by the textual evidence you need to adjust the lecture.

  ### 1. The Core Distinction: Usurper vs. Legitimate Ruler
  Aquinas distinguishes between a *tyrannus ex defectu tituli* (a usurper with no legitimate claim) and a *tyrannus ex parte exercitii* (a legitimate ruler who governs tyrannically).

  *   **For the Usurper:** Aquinas is more permissive. Since they never held legitimate authority, they are essentially aggressors.
  *   **For the Legitimate Ruler:** This is where your summary falls apart. Aquinas is deeply cautious. He argues that because the ruler holds authority from God (or via the community's transfer of power), a private individual does not have the standing to execute judgment upon them. To do so without public authorization is to usurp the role of judge, which belongs to the community or a superior authority.

  ### 2. The "Private Citizen" Problem
  The early modern Monarchomachs (and Mariana specifically) innovate by arguing that sovereignty remains with the people *individually* or *collectively* in a way that allows private action when the contract is broken. Aquinas does not have a social contract theory. For him, authority is hierarchical and functional.

  In *Summa Theologiae* II-II, q. 64, a. 3, Aquinas is explicit that killing a sinner (even a tyrannical one) is licit only for those acting with **public authority**. A private citizen acts licitly only in immediate self-defense, not in the execution of political justice. By telling students Aquinas authorizes private citizens to act "without waiting for courts or councils," you are attributing a Mariana-style "state of nature" logic to a thinker who believes order and hierarchy are ontological goods.

  ### 3. The Pragmatic Warning (The TA's "Flattening")
  The "flattening" your TA noticed is likely Aquinas's pragmatic concern that private assassination often leads to *worse* tyranny. Aquinas argues that if private killing becomes normalized, it destabilizes the very order required for the common good. He prefers to suffer a moderate tyrant than risk civil war that brings a worse one. Mariana is much more willing to accept the risk of turmoil for the sake of liberty; Aquinas prioritizes the preservation of order unless the tyranny is intolerable *and* there is no other recourse.

  ### Recommended Passages for the Slides
  If you want to keep the tension between Aquinas and the Early Moderns without misrepresenting Aquinas, use these three passages. They show his caution and highlight exactly where Mariana later diverges.

  **1. *De Regno* (De Regimine Principum), Book I, Chapter 6**
  *   **The Text:** You likely use the "brave men" quote here. However, pair it with the caveat immediately following it. Aquinas writes: *"Yet it must be considered that if the excess of tyranny is unbearable, some have held that it is the part of brave men to kill such tyrants and to expose themselves to the danger of death for the liberation of the multitude."*
  *   **The Correction:** Note the "some have held." Aquinas is reporting an opinion, not necessarily dogmatizing it. More importantly, he immediately follows this by warning that this often fails and leads to greater tyranny. He concludes the chapter by suggesting that **public authority** (a superior lord or the community acting corporately) is the proper remedy, not private vigilantes.
  *   **Teaching Point:** "Aquinas acknowledges the *argument* for tyrannicide, but warns against private initiative. Mariana removes the warning."

  **2. *Summa Theologiae* II-II, q. 42, a. 2 (On Sedition)**
  *   **The Text:** Aquinas argues that sedition is a mortal sin because it opposes the unity of the multitude. However, he adds: *"If a tyrannical government is not excessive, it is better to bear it for a time than to incur greater dangers by resisting."*
  *   **The Correction:** This directly contradicts the "kill him immediately" narrative. Aquinas advocates patience and endurance if the tyranny is not "excessive." He places the burden of proof on the resistors, not the ruler.
  *   **Teaching Point:** "For Aquinas, order is the default good. Resistance is the exception. For Mariana, liberty is the default; tyranny forfeits protection."

  **3. *Summa Theologiae* II-II, q. 64, a. 3 (On Killing Sinners)**
  *   **The Text:** *"To kill a sinner belongs to the public authority... Therefore, a private person may not kill a sinner."*
  *   **The Correction:** This is the metaphysical kill-shot to the "private citizen" claim. Unless the private citizen is acting as an agent of the public authority (which a lone assassin is not), the act is murder.
  *   **Teaching Point:** "Aquinas requires public authorization. The Early Moderns will eventually argue that the tyrant's actions *restore* authority to the private citizen. That is the 300-year gap."

  ### A Better Pedagogical Hook
  Instead of "Aquinas pre-loaded Mariana," try: **"Aquinas built the engine, but put a governor on it. The Monarchomachs removed the governor."**

  This allows you to keep the continuity (the idea that tyranny forfeits legitimacy) while respecting the discontinuity (the *mechanism* of resistance). It validates your TA's concern, gives you a more nuanced lecture, and actually makes the transition to the Early Moderns more intellectually interesting for the students. They can see *why* Mariana had to go further than Aquinas to make tyrannicide a viable political theory.

  **Summary for your slides:**
  *   **Aquinas:** Tyranny forfeits legitimacy, but removal requires **public authority** or **divine intervention**. Private killing is generally illicit due to risk of sedition.
  *   **Mariana:** Tyranny breaks the **contract**, returning sovereignty to the **people**, allowing **private execution** if public channels fail.

  This preserves the "fun" of the topic without sacrificing textual accuracy.
