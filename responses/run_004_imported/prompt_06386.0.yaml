      *   **Topic:** The debate on Black Art/Propaganda (Du Bois vs. Locke vs. Hughes), specifically focusing on "Criteria of Negro Art," Locke's pushback, Hughes's "The Negro Artist and the Racial Mountain," and the *Home to Harlem* controversy.
      *   **Requirements:**
          *   Around 8 questions.
          *   Must go beyond softball/canned answers.
          *   Specific constraints:
              *   One engaging Locke's objection (art as political chore).
              *   One engaging Hughes's "Racial Mountain" (refusing to write flattering stuff).
              *   One addressing the *Home to Harlem*/McKay hypocrisy charge.
              *   One hypothetical abstract art scenario (no racial/political content).
              *   2-3 toughest questions need " anticipated response/follow-up" notes.
