answer: |-
  This is a fantastic opportunity. You are absolutely right not to waste this slot—interpreters who commit to a full character like Du Bois are usually prepared for the "Great Man" questions, but they often stumble when pressed on the internal contradictions of the Harlem Renaissance debates. Since you need to submit these ahead of time, the key is to frame them respectfully (so the school administration doesn't veto them) but sharply enough that he can't just recite a biography fact.

  Here are 8 questions designed for a whole-school assembly. They use accessible language but target the specific philosophical tensions you studied in AP African American Studies. I've included the "Strategy Notes" on the three toughest ones so you know where the trap is.

  ### The Questions

  **1. The Definition of Propaganda**
  "Mr. Du Bois, you famously wrote that 'all Art is propaganda and ever must be.' Many people today think propaganda means 'lies.' When you use that word, do you mean art should tell lies to make Black people look good, or do you mean art should tell the truth to fight for justice? Where is the line?"

  **2. The Burden on the Artist (Locke's Objection)**
  "Other leaders during the Harlem Renaissance, like Alain Locke, worried that if Black artists *only* make art to fight racism, it becomes a chore instead of a passion. If a Black painter just wants to paint a beautiful bowl of fruit with no political message, are you saying their work is less valuable than a painting about civil rights?"

  **3. The 'Racial Mountain' (Hughes's Objection)**
  "Langston Hughes wrote about young Black artists who want to express their 'individual dark-skinned selves' without fear or shame. He said sometimes that means showing things that aren't 'respectable.' If an artist feels true to themselves but knows white people might judge the whole race based on their work, whose responsibility comes first: the truth of the artist, or the safety of the race?"

  **4. The 'Home to Harlem' Controversy (Hypocrisy Check)**
  "You criticized Claude McKay's novel *Home to Harlem* because you felt it showed Black life as too 'dirty' and focused too much on nightlife. But you also say art must show the truth. If the truth is messy, does asking artists to clean it up make your own rule about 'propaganda' hypocritical? How do you answer that?"

  **5. The Abstract Art Hypothetical**
  "Imagine a Black painter creates a completely abstract painting. It has no people, no history, no politics, and no clear message—it's just colors and shapes. By your standard, is this 'good' Negro Art? Or does art need a clear message about humanity to count as successful?"

  **6. The Audience's Role**
  "You wrote that art should make people 'want to love and know.' If a piece of Black art makes a white audience uncomfortable or angry because it shows a hard truth, have you failed as an artist? Or is making them uncomfortable sometimes the point of the propaganda?"

  **7. Quality vs. Message**
  "If a piece of art has a perfect political message that helps the race, but the writing or the painting itself isn't very skilled, is it still good art? Can 'propaganda' excuse bad craftsmanship, or does the art still have to be beautiful to work?"

  **8. Advice for Students Today**
  "Sir, looking at us in this auditorium: many of us create things—music, writing, videos, fashion. If we follow your rule that all art is propaganda, what is the one message you hope we try to hide inside the things we create today?"

  ***

  ### Strategy Notes (For your follow-up)

  Here are the three trickiest questions and how the interpreter will likely try to dodge them. Keep these in mind if you get a chance to speak again or if you're debriefing with your class afterward.

  **On Question 4 (McKay/Hypocrisy):**
  *   **What he'll likely say:** Du Bois will probably argue about *timing* and *audience*. He didn't hate the truth; he hated giving white racists "ammunition" to use against Black people during a time of extreme violence (Red Summer, lynchings). He will frame it as "strategic truth" vs. "reckless truth."
  *   **The Counter:** If you can follow up, ask: *"But who decides what truth is 'safe'? If artists only show what leaders think is safe, don't we lose the freedom you say we're fighting for?"*

  **On Question 5 (Abstract Art):**
  *   **What he'll likely say:** This is a trap for him. He will likely argue that the *existence* of a Black artist creating high art in a racist society is *inherently* political. He might say, "A Black man painting fruit is a political act because it asserts his humanity."
  *   **The Counter:** This is actually a solid Du Boisian argument, so don't fight it too hard. Instead, acknowledge it: *"So the politics are in the artist, not the art?"* That clarifies his stance for the audience.

  **On Question 3 (Hughes/Racial Mountain):**
  *   **What he'll likely say:** He will prioritize the collective over the individual. He views the "Talented Tenth" as leaders who have a duty to uplift the masses. He will likely say individual freedom is a luxury we cannot afford until we are free from oppression.
  *   **The Counter:** This is the core conflict. If he doubles down on "duty," the follow-up is: *"But sir, if we wait until we are free to be individuals, will we ever be free? Or does the art itself set us free?"* (This leans into Hughes's point).

  Good luck. If you ask Question 4 respectfully, it's going to be the moment everyone remembers.
