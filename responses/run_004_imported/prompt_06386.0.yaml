      *   **Tone:** Respectful but challenging, intellectually curious, fitting for a student addressing a historical figure.

  2.  **Deconstruct Du Bois's Position (for authenticity):**
      *   *Criteria of Negro Art (1926):* "All Art is propaganda and ever must be." He believes art should fight for racial equality and correct false images.
      *   *Tension:* He wants truth, but he also wants *respectability*. He fears that showing Black "sins" (drinking, sex, violence) will fuel white racism.
      *   *Locke's View:* Art should be about aesthetic freedom, not just service to the race. Don't shackle the artist.
      *   *Hughes's View:* Black artists should express their "individual dark-skinned selves" without fear or shame, even if it's not "respectable."
      *   *McKay Incident:* Du Bois criticized *Home to Harlem* for depicting Black life too rawly, which contradicts his call for "truth" if that truth is messy.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* Make them sound like a student asking, but a well-read one. Keep language clear for the general audience.
      *   *Constraint Check:* Need 8 questions total. Need specific topics covered. Need notes on 2-3 tough ones.

      *   *Question 1 (Icebreaker/Setup):* Start with the famous quote but pivot quickly.
