answer: |-
  The bowl sat on the table. It was a simple thing: ceramic, white, a faint chip on the rim where Adele had bumped it against the sink in 1964. Inside, the broth had skin now. A gray film congealing over the surface.

  Kurt sat before it, his hands folded in his lap to hide the tremor. The house on Mercer Court was too quiet. Without Adele's shuffling, without the clatter of her testing the taps, the air felt pressurized, like the cabin of a plane before takeoff. She had been gone three weeks. The hospital called it "observation." Kurt called it the removal of the only variable that rendered the equation solvable.

  If Adele did not cook it, it was not food. It was matter with intent.

  He looked at the broth. He knew, objectively, that the probability of the Princeton Hospital staff coordinating with a conspiracy to poison Kurt Gödel was vanishingly small. But probability was for gamblers. Logic was for the truth. And the logical chain was simple: *They want the work to stop. The work is not done. Therefore, they will try to stop the worker.*

  He was hungry. A sharp, hollow ache behind the navel. But hunger was a signal from the body, and the body was a sensor known to be faulty.

  He pushed the bowl away. It made a soft *shhh* sound on the wood.

  His eyes drifted to the desk in the corner. Papers were stacked there, teetering towers of yellowing script. Among them lay the ghost of a letter written forty years ago to his mother in Vienna. He had not sent it, or perhaps he had; the memory was a file that had corrupted over time. But the proof remained.

  He stood up, his knees popping like dry twigs, and walked to the desk. He picked up a fountain pen. The weight of it was familiar. An anchor.

  *Theorem:* The death of the individual is not the termination of existence.
  *Axiom 1:* The world as we experience it is rational. (It follows laws. It is not chaos.)
  *Axiom 2:* The human capacity for spiritual and intellectual development is infinite.
  *Observation:* A single lifetime is insufficient to realize even a fraction of this capacity.
  *Conclusion:* A rational world would not instantiate an infinite capacity within a finite container only to destroy the container before the capacity is realized. To do so would be irrational. It would be a waste. And the world is not wasteful.

  He wrote the words again, now, on a fresh pad. The ink flowed black and decisive.

  It was a beautiful proof. It had sustained him through the nights when the shadows in the corner of the room seemed to breathe. It had sustained him through the news of Albert's death.

  *Albert.*

  Kurt closed his eyes. He could see the path along Olden Lane. The late afternoon sun filtering through the oaks. Albert walking with that loose, rolling gait, hands in the pockets of his cardigan, looking like a man who had forgotten where he was going and didn't much care.

  *"I come to the office now only to have the privilege of walking home with you, Kurt."*

  Albert had said that near the end. Albert, who had unraveled the geometry of the cosmos, found more value in the rhythm of their steps than in the equations left on the blackboard. Albert, who did not fear the end. He had told Kurt once, *"The distinction between past, present, and future is only a stubbornly persistent illusion."*

  If time was a block universe, then death was merely a coordinate. You did not cease; you simply occupied a different *t*.

  But if time was an illusion, why did the hunger hurt *now*?

  Kurt returned to the table. The broth had cooled completely. The gray film was thicker.

  This was the inconsistency. This was the incompleteness that gnawed at him more than the starvation. He possessed a proof of the eternity of the spirit, a derivation as rigorous as any in the *Principia*, yet he could not lift a spoon.

  How could a world be rational if it allowed a man to starve amidst plenty because of a fear he could not logically dispel?

  Unless.

  Kurt sat down heavily. The chair creaked.

  Unless the body was not the vessel of the rational self. The body was the interface. It was the hardware, and it was degrading. The sensors were failing. The fear of poison was not a delusion; it was a warning light on a dashboard that was melting. The system was rejecting the input.

  If the world is rational, and I am rational, then my departure from this system must also be rational.

  He looked at his hands. They were skeletal, the skin translucent like parchment. He could see the blue tracks of veins. They looked like rivers on a map of a country that was being evacuated.

  Adele would be angry. She would bustle in, her small frame radiating a fury that could warm the room. She would shout that the soup was safe, that he was being foolish, that he must eat to live.

  But Adele lived in the world of causes and effects. She lived in the physics of the kitchen. Kurt lived in the metaphysics of the study.

  *The world is rational.*

  If he ate the soup and died, the conspiracy won.
  If he refused the soup and died, he proved that the body was disposable.

  If the capacity for development is infinite, then this lifetime is merely the primer. The first chapter. You do not mourn the ink running out on page one if you know the book continues.

  He felt a wave of dizziness. The room tilted slightly to the left. It was not unpleasant. It felt like the sensation of stepping off a curb you didn't see, a momentary loss of gravity before the foot finds the ground.

  He thought of his mother. She had died in Vienna, far away, while he was here, safe in America. He had tried to explain to her, in those letters, that her death was not an erasure. That the rationality of the universe demanded her continuation. Had she believed him? Or had she died afraid, clutching a rosary, while her son clutched a syllogism?

  "I am sorry, Mama," he whispered. The sound was thin in the empty room. "I am testing the hypothesis."

  He picked up the spoon. The metal was cold. He dipped it into the broth, breaking the gray film. He lifted it.

  The smell hit him. Salt. Chicken fat. And underneath, the metallic tang of *them*. The chemicals. The intent.

  His hand froze. The spoon hovered inches from his lips.

  The contradiction screamed in his head. *You believe in a rational world. You believe you survive. Why does the meat matter?*

  Because the transition must be voluntary.

  If he ate, he submitted to the irrationality of the world. He admitted that the body was the master.
  If he starved, he asserted the primacy of the mind. He chose the timeline of the spirit over the timeline of the cell.

  He lowered the spoon. It touched the rim of the bowl with a soft *clink*.

  He remembered Albert's face, the deep, sad eyes. Albert had feared the end of consciousness less than the end of curiosity. *"I must know,"* Albert had said once, *"if God had any choice in the creation of the world."*

  Kurt smiled, a dry cracking of his lips.

  *God had no choice,* Kurt thought. *If the world is rational, God is bound by logic just as I am. And logic dictates that I am not finished.*

  The hunger was a noise, like a radio tuned between stations. He could turn his attention away from it. He focused on the proof on the desk.

  *Axiom 1. Axiom 2. Conclusion.*

  It held. It was sound.

  The room was getting darker. The sun had gone behind the neighbor's house. The shadows were lengthening, stretching out from the corners like dark fluids. They used to frighten him. Now, they looked like an invitation. A medium.

  If the world is rational, then there is no waste.
  I am not waste.
  Therefore, I am not ending.

  He stood up. His legs were weak, but he did not need them for where he was going. He walked to the window and looked out at the street. A car passed, tires humming on the asphalt. A mundane, physical thing. Bound by friction and gravity.

  He turned back to the table. The bowl of soup sat there, a monument to the fear he was leaving behind.

  "Adele," he said to the silence. "Do not worry. The calculation is complete."

  He did not feel like a man dying. He felt like a physicist who had finally solved for *x*, and found that *x* was everywhere. The body was a local variable. He was ready to integrate over the whole domain.

  Kurt Gödel sat down in the armchair facing the window. He folded his hands in his lap. He closed his eyes, not to sleep, but to remove the sensory noise that obscured the signal.

  The hunger faded. The cold faded. There was only the logic, clean and white and endless, waiting for him to step into the proof.

  *Q.E.D.*
