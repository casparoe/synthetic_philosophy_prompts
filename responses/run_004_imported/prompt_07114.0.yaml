prompt: |-
  I am writing a novel that includes a scene in which a time-displaced Frank Ramsey is brought up to speed on present-day longtermism: the effective-altruist view, downstream of Bostrom's "astronomical waste" argument, that reducing existential risk is the overriding moral priority given the astronomical number of future people potentially at stake. I want his reaction to be faithful to the real Ramsey rather than a mouthpiece for either side, and the difficulty is that his own body of thought pulls in both directions at once. His 1928 paper on saving called discounting the welfare of future generations "ethically indefensible," which is exactly the anti-discounting move longtermists depend on; yet the philosophical essay he wrote in his twenties, published posthumously as "Epilogue," waved off cosmic vastness — including the eventual heat death of the universe — as irrelevant to how one should live, since for Ramsey a star is not rendered more significant than a person merely by being larger, and being impressed by sheer scale struck him as a confusion rather than an insight. Would the economist in him make him receptive to arguments that lean on astronomical stakes, or would the essayist in him treat the whole framing as a category error, mistaking a very large number for a very large reason? Give me your best reconstruction of his actual verdict, one that takes both strands of his thought seriously rather than quietly dropping whichever proves inconvenient.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** Frank Ramsey (1903–1930), British mathematician, philosopher, economist.
      *   **Scenario:** A novel scene where a time-displaced Ramsey is introduced to modern longtermism (specifically the Bostromian "astronomical waste" argument: reducing existential risk is paramount because of the vast number of future lives).
      *   **Constraint:** The reaction must be faithful to the *real* Ramsey, acknowledging the tension in his own thought.
      *   **Key Tension:**
          *   *Strand A (Economist/Utilitarian):* 1928 paper "A Mathematical Theory of Saving." He argued against discounting future generations' welfare ("ethically indefensible"). This aligns with longtermism's core premise of giving equal weight to future people.
          *   *Strand B (Philosopher/Humanist):* "Epilogue" (written c. 1923-1925). He argued that cosmic scale (heat death, size of stars) is irrelevant to human meaning. Being impressed by scale is a confusion. "A star is not more significant than a person merely by being larger."
      *   **Goal:** Reconstruct his actual verdict, balancing both strands without dropping one. Would he accept the astronomical stakes argument or reject it as a category error?

  2.  **Deconstruct Ramsey's Philosophy:**
      *   *Ethics:* He was a subjective utilitarian (in "Truth and Probability" and "Foundations of Mathematics"). He cared about goods, but goods were rooted in human psychology and possibility.
      *   *Epistemology/Pragmatism:* He was deeply pragmatic. Beliefs are rules for action. Truth is what works in the long run, but action is rooted in the *now*.
      *   *The "Epilogue" Stance:* This is crucial. Ramsey was a humanist. He found the "sublime" in human connection, not in the void. The heat death of the universe doesn't negate the value of a smile *now*. To value the future *only* because it is big is to commit the fallacy he identified in religion/metaphysics: seeking significance outside the human sphere.
      *   *The "Saving" Stance:* This was technical economics. The argument against discounting was about consistency and impartiality, not necessarily about maximizing the *sum total* of utility across infinite time at the expense of the present. It was about *fairness* between generations, not *maximization* of the aggregate.

  3.  **Evaluate Longtermism through Ramsey's Eyes:**
      *   *Agreement:* He would agree that we shouldn't arbitrarily discount the future just because it's far away. If a future person exists, their welfare counts equally to a present person's.
      *   *Disagreement:* He would likely recoil at the *aggregation* logic. Longtermism often says: $10^{50}$ future lives $\times$ small risk reduction > billions of present lives $\times$ certain suffering.
      *   *The "Scale" Objection:* Ramsey explicitly wrote against being dazzled by magnitude. "The size of a star has nothing to do with its value." Applying this to people: The *number* of people doesn't necessarily create the *value*.
      *   *The "Uncertainty" Objection:* Ramsey was a pioneer of probability. He knew that dealing with infinitesimal probabilities of astronomical outcomes (Pascal's Mugging territory) is epistemically unstable.
      *   *The "Human Good" Objection:* Ramsey's utilitarianism wasn't abstract hedonism; it was rooted in "organic wholes" (influenced by Moore). A world full of dust, even if it contains potential people, isn't good. A world with *actual* people living good lives is.

  4.  **Synthesize the Verdict:**
      *   Ramsey would not be a longtermist in the Bostromian sense.
      *   He would accept the *impartiality* (no discounting) but reject the *aggregation over abstraction*.
      *   He would see the "astronomical waste" argument as a recurrence of the metaphysical error he critiqued in the "Epilogue": looking for value in the void/abstract rather than in the concrete human experience.
      *   He would argue that saving the future is important *because* it allows for concrete human goods, not because failing to do so wastes a big number.
      *   *Key Distinction:* Longtermism often prioritizes *existence* over *quality* in the extreme tail. Ramsey would prioritize *quality of life* for *actual* people (present and near future) over the *probability* of *potential* people.

  5.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the depth of the user's research. It's a sharp observation of the tension.
      *   *The Economic Strand:* Validate the "no discounting" point. Ramsey would agree future people matter.
      *   *The Philosophical Strand:* This is the clincher. The "Epilogue" is the antidote to "astronomical waste."
      *   *The Synthesis:* How does he resolve it? He separates *moral status* from *moral weight via magnitude*.
      *   *The Verdict:* He would likely view longtermism as a "mathematical sublime" that loses the human object. He would support existential risk reduction *instrumentally* (to save actual humans) but reject it *categorically* (as the sole overriding priority based on numbers).
      *   *Tone:* Intellectual, nuanced, slightly Cambridge 1920s (Bloomsbury adjacent), precise.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't make him sound like a virtue ethicist. He was a utilitarian. But his utilitarianism was psychological.
      *   *Nuance:* The "Saving" paper was about capital accumulation, not existential risk. Don't overstate the link. The link is the *principle* of impartiality.
      *   *Crucial Point:* Ramsey's probability theory. He would spot the expected value calculation flaw. If the probability is tiny and the stake is infinite, the math breaks down. He preferred degrees of belief based on evidence.
      *   *Final Polish:* Ensure the distinction between "discounting time" (which he rejects) and "discounting abstraction" (which he accepts) is clear.

  7.  **Final Structure:**
