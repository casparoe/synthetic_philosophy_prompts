answer: |-
  This is a remarkably sharp reading of Ramsey. You have identified the precise fault line in his thought that makes him such a fascinating candidate for this scene. Most writers would seize on the 1928 "Saving" paper to make him a proto-longtermist, or seize on the "Epilogue" to make him a humanist critic. To do either alone would be a caricature.

  Ramsey was a pragmatist who believed philosophy should clear up muddles, not create new ones. His verdict on longtermism would likely be that it is a **category error born of mathematical sublimity.** He would accept the *impartiality* of the longtermist but reject the *aggregation* of the longtermist.

  Here is a reconstruction of how Ramsey would likely navigate this tension, broken down by the specific strands of his thought, followed by a suggestion for how to render his verdict in the novel.

  ### 1. The Economist: Impartiality Without Aggregation
  In *A Mathematical Theory of Saving* (1928), Ramsey argues against discounting future utility simply because it occurs later in time. He calls this "ethically indefensible."
  *   **Where he agrees:** He would agree with the longtermist premise that a person living in the 22nd century counts morally exactly as much as a person living in the 21st. He would reject "pure time preference" (valuing the present just because it is the present).
  *   **Where he diverges:** Ramsey's argument in 1928 was about *fairness* between generations regarding capital accumulation, not about maximizing the sum total of utility across an infinite horizon. For Ramsey, the goal of saving was to reach a "bliss" level of sustainable utility, not to endlessly accumulate utility for its own sake. He would likely view the longtermist drive to maximize the *number* of future lives as a confusion of *sufficiency* with *maximization*.

  ### 2. The Philosopher: The "Epilogue" and the Fallacy of Scale
  This is the decisive strand. In the *Epilogue* (written for C.K. Ogden but unpublished in his lifetime), Ramsey grapples with the heat death of the universe and the insignificance of human life on a cosmic scale. He concludes that cosmic scale is irrelevant to value.
  *   **The Argument:** "The size of a star has nothing to do with its value." He argues that being impressed by vastness is a psychological quirk, not an ethical insight.
  *   **Application to Longtermism:** The "astronomical waste" argument relies entirely on being impressed by vastness. It says: *The future is big, therefore it matters more.* Ramsey would identify this as the exact metaphysical confusion he spent his twenties dismantling. He would argue that $10^{50}$ potential people do not outweigh 8 billion actual people simply by virtue of the number. Value resides in the *quality* of experience (the "organic wholes" he inherited from G.E. Moore), not the *quantity* of containers for that experience.
  *   **The Verdict:** To sacrifice definite present goods for the sake of abstract future magnitude would strike him as a form of idolatry—worshipping the number rather than the human good.

  ### 3. The Probabilist: Epistemic Humility
  Ramsey founded the subjective theory of probability (*Truth and Probability*, 1926). He understood that degrees of belief must map to evidence and action.
  *   **The Critique:** Longtermism often relies on expected value calculations involving infinitesimal probabilities and astronomical stakes (Pascal's Mugging scenarios). Ramsey would be deeply suspicious of this. For Ramsey, a probability is a guide to action based on habit and evidence. If the probability of a specific existential risk mitigation working is too speculative to ground a habit of action, the math is lying to you.
  *   **The Verdict:** He would likely view the precision of longtermist risk calculations as "pseudo-mathematics"—using the form of probability to mask a lack of empirical content.

  ### The Synthesized Verdict
  Ramsey would not dismiss the concern for the future, but he would reframe it. He would argue that we should reduce existential risk **because the people who will exist are valuable**, not **because the number of them is large.**

  If longtermism demands sacrificing vital present needs for the sake of marginal reductions in existential risk based on astronomical stakes, Ramsey would call it a "muddle." If it simply means we have a duty to ensure the future is habitable for people who will be just as real as we are, he would call it "common sense."

  He would likely conclude that the longtermists have correctly identified the *scope* of morality (everyone counts) but have incorrectly identified the *source* of value (numbers vs. experiences).

  ### How to Write the Scene
  To capture his voice, avoid making him sound dogmatic. Ramsey was witty, direct, and prone to diagnosing "confusions." He smoked, he talked fast, and he had a Bloomsbury-esque appreciation for the concrete joys of life.

  **Suggested Dialogue/Monologue Beat:**

  > Ramsey listens to the explanation of 'astronomical waste.' He taps his pipe against the ashtray, not to extinguish it, but to keep the ember glowing.
  >
  > "You have taken my mathematics and turned it into a theology," he might say. "I wrote that we must not discount the future. I did not write that we must be dazzled by it."
  >
  > "But the numbers," the interlocutor insists. "Quadrillions of lives."
  >
  > "A star is large," Ramsey replies, his voice quiet but sharp. "A man is small. If the star explodes, it is a spectacle. If the man dies, it is a tragedy. You are telling me that if I gather enough tragedies together, they become a spectacle that outweighs the one in front of me. That is not ethics. That is optics."
  >
  > "So you would ignore the risk?"
  >
  > "I would ignore the *magnitude* of the risk," Ramsey corrects. "We should prevent the end of the world because the people in it are like us. Not because they are many. If there were only a thousand people left to come, would you let them burn? No. Then the number is irrelevant. You have dressed a human duty in cosmic clothing, and now you cannot see the man underneath."

  ### The Nuance for the Novel
  To be truly faithful, Ramsey shouldn't just dismiss them. He should acknowledge why they are tempted. He was a logician; he understands the pull of the system.

  He might admit: *"I see the logic. It is consistent. But consistency is not the same as truth. You have built a perfect machine for calculating value, but you have forgotten to put the value inside it."*

  This allows your longtermist characters to remain rational (they aren't stupid), while Ramsey points out the philosophical blind spot (the confusion of scale with significance). This honors his 1928 rigor while staying true to his 1925 humanism.
