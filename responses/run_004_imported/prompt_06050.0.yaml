      *   **Frege's Solution:** Concepts (predicates) are "unsaturated" (incomplete). Objects are "saturated" (complete). When an object fills the gap, no extra "tie" is needed. The unity is built into the logical form.
      *   **Russell's Solution:** There is a distinction between a relation as a *term* (object of thought) and a relation as *relating* (occurring in a proposition). When a relation actually relates, it performs a function that doesn't require a further relation. The "verb" in the proposition does the work.

