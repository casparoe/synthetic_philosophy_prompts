      *   *Fregean Point:* Russell's "relating relation" is magical. How does a relation decide to relate *now* but not when it's just being named? If it's the same entity, what changed? Russell posits a brute fact. Frege posits a logical form. Russell's view makes the proposition a heap of objects including a "relating" object, which looks suspiciously like Bradley's regress starting again.

  6.  **Drafting - Stage 4: The Clash (Addressing the Prompt's Specific Constraints):**
      *   *Constraint Check:* Russellian must charge that unsaturation is relabeling.
