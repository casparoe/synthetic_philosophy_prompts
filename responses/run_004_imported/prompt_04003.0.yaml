answer: |-
  First, I want to acknowledge the weight behind your question. When divine hiddenness moves from a seminar topic to a bedside vigil, the philosophical stakes become existential. It is understandable that Schellenberg's argument resonated with you; it validates the integrity of your search against the silence you encountered. Turning to Pascal is a natural step, as he occupies a unique space between the rigorous logic of the geometer and the anguish of the seeker.

  To answer your specific questions: Pascal is indeed making a claim about the *calibration* of hiddenness, but that calibration rests on a specific anthropology (a theory of human nature) that differs significantly from the one presupposed by Schellenberg.

  Here is a reconstruction of Pascal's logical structure, followed by an analysis of whether it withstands the modern hiddenness objection.

  ### 1. Reconstructing Pascal's Argument: The "Mean Distance"

  You asked whether Pascal argues from independent reasons (freedom/merit) or claims the current mix is precisely tuned. The answer is that he argues the former *necessitates* the latter.

  **The Logical Structure:**
  1.  **Premise 1 (The Goal):** God's primary aim is not merely intellectual assent to His existence, but a voluntary relationship of love and submission.
  2.  **Premise 2 (The Nature of Love):** Love cannot be coerced. If the evidence for God were demonstratively overwhelming (like a mathematical proof or a visible manifestation of glory), the will would be overpowered by the intellect. Belief would become inevitable, not chosen.
  3.  **Premise 3 (The Nature of Indifference):** Conversely, if God were totally hidden, the seeker would have no traction to begin the search. Total hiddenness makes relationship impossible.
  4.  **Intermediate Conclusion:** Therefore, God must maintain an "epistemic distance"—a state of ambiguity where He is neither fully visible nor fully invisible.
  5.  **Premise 4 (The Filter):** In this state of ambiguity, the deciding factor in whether one finds God is not the *quality of the evidence*, but the *orientation of the will* (the "heart").
  6.  **Final Conclusion:** The current level of hiddenness is perfectly calibrated to reveal God to those whose wills are oriented toward Him ("seek with all their heart") and conceal Him from those whose wills are oriented away ("flee with all their heart").

  So, to your first question: Pascal is arguing that the "calibration" is the *mechanism* by which the independent value (voluntary love) is preserved. The obscurity is not a bug; it is a feature designed to filter based on volition.

  ### 2. Volitional Epistemology vs. Evidentialism

  This is where Pascal and Schellenberg diverge fundamentally.

  Schellenberg operates with a broadly **evidentialist** epistemology. He assumes that belief is largely involuntary and responsive to evidence. If the evidence is insufficient for belief, the person is a "non-resistant non-believer." They aren't *choosing* to reject God; they simply lack the cognitive grounds to accept Him.

  Pascal operates with a **volitional** epistemology. For Pascal, the "heart" (*le cœur*) has its reasons which reason knows not. He believes that our moral and volitional state dictates what we find convincing.
  *   If you love the good, you will find the signs of God sufficient.
  *   If you love yourself or the world more than God, you will find the evidence insufficient, no matter how much is provided (short of coercion).

  When Pascal writes, *"There is enough light for those who only desire to see, and enough obscurity for those who have a contrary disposition,"* he is making a psychological and spiritual claim: **Ambiguity reveals character.**

  ### 3. Does Pascal Beg the Question Against Schellenberg?

  You asked if Pascal implicitly assumes what Schellenberg denies: that apparent nonbelief is always resistance.

  **Yes, he does.**

  Pascal's argument is vulnerable to the charge of being unfalsifiable. If you seek God and find Him, it proves you sought with all your heart. If you seek God and do not find Him (as in your experience), Pascal's framework implies one of two things:
  1.  You did not seek with "all your heart" (perhaps there was hidden resistance, pride, or a demand for God to appear on *your* terms).
  2.  You are among those from whom God wills to be hidden (though Pascal usually ties this to the "fleeing" condition).

  Schellenberg's "non-resistant non-believer" is a category Pascal effectively denies. For Pascal, if you are a capable adult who has encountered the Christian message and remain unconvinced, you are, by definition, resisting. You are prioritizing some other good (autonomy, sensory evidence, comfort) over the relationship with God.

  **Is this question-begging?**
  From a neutral philosophical standpoint, yes. It defines "sincere seeking" as "seeking that results in belief." It protects the theology from counter-evidence by relocating the failure from the divine action (hiddenness) to the human disposition (insufficient desire).

  However, from within Pascal's theological system, it is not circular; it is descriptive of what he sees as the human condition (the *corrupt* will). He would argue he isn't *assuming* resistance; he is *diagnosing* it.

  ### 4. Does Pascal Have the Resources to Answer the Modern Argument?

  Pascal offers a powerful **theological** response, but it may not function as a **philosophical** refutation for someone in your position.

  **Where Pascal Succeeds:**
  He challenges Schellenberg's definition of "perfect love." Schellenberg assumes a perfectly loving God would maximize comfort and minimize epistemic struggle. Pascal argues that a perfectly loving God would maximize the *possibility of free communion*. If overwhelming evidence destroys the freedom to love, then hiddenness is an act of love, not neglect. He reframes hiddenness from "absence" to "space for freedom."

  **Where Pascal Fails (or Wounds):**
  1.  **The Problem of Degree:** Pascal claims there is "enough light" for the sincere seeker. Your experience suggests otherwise. Many people report seeking with profound sincerity, stripping away pride, and desiring God above comfort, yet encountering the same silence you did. Pascal's model struggles to account for the *intensity* of the silence relative to the *intensity* of the seeking.
  2.  **Spiritual Epistemology:** Pascal's argument requires a shift in how we know things. It asks you to accept that your failure to perceive God is a moral/volitional failure, not an intellectual one. For someone grieving and praying for assurance, being told (implicitly) that their silence is a measure of their own heart's orientation can feel like adding guilt to grief.
  3.  **The "Capable" Condition:** Schellenberg focuses on people *capable* of relationship. Pascal's "seek with all their heart" is a much higher bar than "capable." One can be capable of relationship but psychologically or epistemically unable to bridge the gap without more light. Pascal assumes the will can bridge the gap; Schellenberg argues the gap is too wide for the will alone.

  ### Conclusion

  Pascal is not offering a logical proof that God exists despite hiddenness. He is offering an **interpretive framework for the experience of hiddenness.**

  He is arguing that the ambiguity is intentional and functional. But you are correct to sense that this rests on the assertion that unbelief is always culpable. To accept Pascal's answer, you must accept his anthropology: that the human heart is so constituted that it *could* find God in the shadows if it truly wanted to.

  If you find that your own sincerity was genuine—that you were not fleeing, but reaching into the dark and grasping nothing—then Pascal's "calibration" argument may feel less like a solution and more like an accusation. In that light, Schellenberg's argument remains potent: it protects the integrity of the seeker against the suggestion that their honest cognitive struggle is actually a moral failing.

  Pascal explains why God *might* hide. Schellenberg argues that a loving God *wouldn't* hide this much from the sincere. Pascal wins on the mystery of faith; Schellenberg wins on the logic of love as we typically understand it. Which one holds depends on whether you believe God's definition of "relationship" (which requires risk and ambiguity) overrides our definition of "love" (which seeks to comfort and clarify).
