      *   *Refinement on Hempel:* Point out that Hempel was actually describing how historians *should* write, not necessarily how they *do*. Postmortems try to do both.
      *   *Refinement on Analogy:* Highlight that software *does* have laws (code logic), but *systems* behave historically (context-dependent).
