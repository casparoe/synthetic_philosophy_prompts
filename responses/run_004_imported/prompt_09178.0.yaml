      *   *Resilience Engineering / Safety-II:* (Hollnagel, Dekker). This is crucial for the user. They argue "Root Cause" is fundamentally flawed. Accidents are emergent, not caused by a single broken part. This aligns perfectly with the Narrativist view but gives it a modern engineering vocabulary.
      *   *Pragmatism:* (Van Fraassen). Explanation is context-dependent. "Why did this happen?" depends on who is asking and what they want to fix.

