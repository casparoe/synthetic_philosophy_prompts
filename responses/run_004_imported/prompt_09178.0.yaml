      *   *Narrativists (Dray, Gallie, Danto, Mink, White):* User says: "intelligible narrative sequence," "followable," "emplotment," no general law required. *Verdict:* Accurate.
          *   Dray: "Rational explanation" (actions make sense given beliefs/goals).
          *   Gallie: "Followable narrative."
