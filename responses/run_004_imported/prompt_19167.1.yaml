answer: |-
  1. **The Ship and the Carpenter**
  In my novel, a family restores a sailboat until no original plank remains, yet we intuitively feel the boat persists. Under your view, the boat never existed to begin place—only the carpenters did. If composition is restricted solely to lives, does this imply that all human history of artifact-making is essentially a history of rearranging simples without ever creating a single new object? If so, what ontological work is the concept of "artifact" actually doing, if not tracking existence?

  *Follow-up:* You'll likely reply that artifacts are useful fictions for tracking spatial arrangements without ontological commitment. But if the "fiction" is indispensable for all planning, engineering, and navigation, does that indispensability suggest we are missing a real causal power that only the *whole* possesses, rather than just the sum of the parts?

  2. **The Argument from Vagueness**
  Critics like Lewis and Sider argue that any restricted answer to the Special Composition Question leads to vague existence—for example, a borderline case where it's indeterminate whether particles compose a thing. You avoid this by claiming composition is precise (life is a yes/no event), pushing the vagueness into our language instead. But doesn't this merely relocate the problem? If reality is precise but our access to it is inevitably vague, how do we know we aren't just stipulating precision where there is none to save the theory?

  *Follow-up:* I anticipate you'll argue that "life" is a biological natural kind with a precise onset, unlike "boat." But if biological life itself involves gradual evolutionary transitions or borderline cases (like viruses or prions), doesn't the precision of "life" collapse back into the very vagueness you're trying to avoid, forcing you to admit indeterminate composition after all?

  3. **The Moment of Death**
  Let's look at the boundary of your criterion. When an organism dies, the "life" activity ceases. Metaphysically, does the object simply vanish at that instant? If I am holding a person's hand when they die, do I cease holding an object and start holding a collection of particles in the same breath? How do you account for the apparent continuity of the mass and structure if the ontological status changes so radically?

  *Follow-up:* You will likely say the simples remain, only the composition relation ceases, so there is no "corpse" object, just simples arranged corpse-wise. But if the spatial relations and causal interactions between those particles remain largely identical for minutes or hours post-death, what specific causal event marks the exact nanosecond the object ceases to exist, and is it plausible that existence hinges on such a fragile threshold?

  4. **The Paraphrase Trap**
  You suggest we paraphrase "The boat is in the harbor" as "There are particles arranged boat-wise in the harbor." Critics argue this is circular: to define "boat-wise," you must reference the very arrangement that constitutes a boat, quietly reintroducing the object you claimed to eliminate. Are you not relying on the concept of the boat to define the arrangement of the particles, thereby making the paraphrase dependent on the existence it denies?

  *Follow-up:* I expect you'll respond that "boat-wise" can be defined purely in terms of spatial coordinates and causal bonds between simples, without referencing the whole. However, if those spatial bonds are only relevant *because* they serve the function of a boat, doesn't the functional teleology presuppose the existence of the artifact as a goal, reifying it in the definition of the parts?

  5. **Nihilism vs. Organicism**
  Mereological nihilists argue that *nothing* composes anything, not even organisms; there are only simples. Your organicism stops the elimination halfway. Why posit that life is the magic threshold? If we can explain the behavior of a boat via the physics of its planks, why can't we explain the behavior of a cat via the physics of its cells without positing a "cat" object? What explanatory power does the organism add that the nihilist's simples lack?

  *Follow-up:* You will likely argue that only organisms have a unified causal activity (a "life") that simples lack. But if future AI or synthetic biology creates a system that mimics "life" without biological substrate, would your ontology force you to deny existence to a sentient, self-repairing robot, simply because it lacks biological metabolism?

  6. **The Evolutionary Boundary**
  If composition requires a "life," how does your view handle evolutionary transitions? Consider the transition from a colony of single-celled organisms to a multicellular animal. At what specific generation does composition kick in? If it's gradual, doesn't that reintroduce the vagueness you reject? If it's sudden, doesn't that imply an ontological explosion where a new object pops into existence due to a minor genetic shift?

  *Follow-up:* You might say that once the colony's activity becomes a single biological event, composition occurs. But if we can't empirically locate that shift without arbitrariness, are we not forced to admit that our ontological commitments are dependent on our biological classification systems rather than mind-independent reality?

  7. **Moral Weight and Existence**
  In ethics, we often grant moral status to beings based on their existence as unified subjects. If artifacts don't exist, they have no moral status, which seems right. But if a "corpse" doesn't exist either, does that mean desecrating a grave is merely rearranging particles? Does your ontology risk stripping normative weight from things we treat as sacred, simply because they aren't currently "alive" in the biological sense?

  *Follow-up:* You will likely distinguish between moral status and ontological status, arguing we can have duties regarding things that don't exist (like promises). But if the "thing" we have a duty toward literally isn't there, isn't the duty directed at a fiction? And if so, how do we ground the seriousness of that duty without appealing to the reality of the object?

  8. **Falsifiability and Evidence**
  Finally, as a novelist, I look for evidence that changes the story. As a metaphysician, what would actually count as evidence *against* organicism? If every counter-example (like a boat or a statue) can be paraphrased away as "particles arranged X-wise," is there any possible state of affairs that would force you to abandon the view, or has the theory been insulated from refutation by its own linguistic strategy?

  *Follow-up:* If you reply that metaphysics is a priori and not subject to empirical falsification, does that render the view compatible with *any* empirical discovery? And if a theory is compatible with every possible world, does it tell us anything specific about *this* one, or is it merely a framework for organizing our language?
