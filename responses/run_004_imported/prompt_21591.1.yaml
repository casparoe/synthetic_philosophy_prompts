      *   Another angle: The "Ruins" problem. For a regular person, \$600k is life-changing security. \$3M is "rich," but \$0 is "ruin." The marginal utility of money isn't linear. However, EUT allows for non-linear utility of money (log utility), but the Allais Paradox holds *even if* you adjust for risk aversion regarding wealth. It's about probability weighting.
