          *   *Dave's Rebuttal (Money Pump):* Dave wins on theory, loses on application. Money pumps require repeated trading.
          *   *Carol's Counter (Context/Alternative Theories):* Carol wins. Prospect Theory exists for this reason.
          *   *Dave's Last Word (Explanation vs. Label):* Draw. He wants a mechanism; she gave a phenomenon. But he misses that the mechanism *is* the psychology.
      *   **The Deeper Point:**
