          *   *Common Consequence:* 0.89 chance of \$600k. If you remove it:
              *   1A' = 1.00(\$600k)
              *   1B' = 10/11(\$3M) + 1/11(\$0) ... Wait, let's look at the standard Allais formulation.
          *   *Standard Allais Formulation:*
              *   1A: 100% \$1M.
              *   1B: 10% \$5M, 89% \$1M, 1% \$0.
              *   2A: 11% \$1M, 89% \$0.
              *   2B: 10% \$5M, 90% \$0.
          *   *Independence Axiom:* If you prefer 1A over 1B, you must prefer 2A over 2B. Why? Because 89% of the outcome is identical in the first pair (\$1M). In the second pair, 89% of the outcome is identical (\$0). The remaining 11% vs 10% structure should dictate preference consistently.
