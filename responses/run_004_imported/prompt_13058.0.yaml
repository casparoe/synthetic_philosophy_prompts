answer: |-
  The department lounge was dark save for the hum of the vending machine and the streetlights bleeding through the blinds. Elena sat on the worn leather sofa, a cold cup of coffee on the table. Marcus was pacing near the whiteboard, which still bore the skeletal remains of a CHSH inequality derivation from earlier that day.

  "You're hiding behind the semantics of 'outcome,' Marcus," Elena said, breaking the silence. "Bell's theorem isn't just about what we *see*. It's about the statistical dependencies between spacelike separated regions. In Bohm, the velocity of particle A depends instantaneously on the position of particle B. That's nonlocality. It's in the guiding equation. I own it. You're trying to talk your way out of it by multiplying the world."

  Marcus stopped pacing and turned. "I'm not talking my way out of anything. I'm pointing out that Bell's assumption of 'single, definite outcomes' is the premise you have to drop to save locality. Look at Jarrett's decomposition. Bell locality implies Parameter Independence (PI) and Outcome Independence (OI). In Everett, PI holds. My setting on the left wing doesn't change the reduced density matrix on the right wing. No signaling. The violation is only in OI."

  "Because 'the outcome' on the left is relative to a branch," Elena countered. "But for the correlations to hold—for the *illusion* of the singlet state to be maintained across the multiverse—the branching structure on the left has to be perfectly coordinated with the branching structure on the right. If I measure spin-up here, I must be in a branch where you measure spin-down there. How does the universe ensure that coordination without a nonlocal mechanism?"

  "It's not a mechanism, it's a history," Marcus said, leaning against the whiteboard. "The entanglement was established at the source. The universal wavefunction evolves unitarily and locally via the Schrödinger equation. When decoherence happens, it happens locally. The correlation is already encoded in the amplitude of the global wavefunction. I don't need a signal flying from A to B at measurement time because the correlation isn't generated at measurement time. It's revealed. In your theory, the particle positions are distinct facts, and you need a instantaneous influence to align them. In mine, there is only the wavefunction, and it never collapses."

  "But the wavefunction lives in configuration space, Marcus," Elena pressed. "3N dimensions. If you take that seriously, then 'locality' in 3D space is already dead. You're saving locality in 3D space only by pushing the dynamics into a space where 'distance' means something else entirely. To me, that's just nonlocality by another name. You're saying the fundamental ontology isn't in spacetime. Fine. But then don't claim you've saved relativistic causality in the world we actually inhabit."

  "I claim I've saved Lorentz invariance at the fundamental level," Marcus shot back. "You haven't. That's the bullet *you're* biting. To make Bohmian mechanics work, you need a preferred foliation of spacetime. A privileged reference frame to define the 'simultaneity' of your guiding equation. You have a dynamical structure that picks out a 'true' rest frame, even if you can't detect it empirically. That violates the spirit of relativity, even if you hide it from the experimentalists."

  Elena sighed, rubbing her temples. "I'd rather have a preferred foliation than a superdeterministic conspiracy. If I want to save locality without your many worlds, I have to assume the measurement settings were correlated with the hidden variables at the source. That means the universe conspiring to make us *think* we have free will in choosing settings. That's a worse bullet. Nonlocality is a feature of the dynamics; superdeterminism is an attack on scientific inference itself. So yes, I accept the foliation. It's a price for having particles that are actually *here*."

  "And I accept the branches," Marcus said. "It's a price for having a wavefunction that actually *obeys* the linear dynamics without ad-hoc collapse rules. But let's go back to the coordination problem you raised. You think my branches need to 'match up' nonlocally. They don't. Decoherence is a local process. The environment interacts with the measuring device. The branching is local. The fact that the 'up' branch on the left is correlated with the 'down' branch on the right is a consequence of the initial entangled state. There is no cross-referencing happening at the time of measurement."

  "But there is," Elena insisted. "Suppose I'm on the left. I split into $Elena_{up}$ and $Elena_{down}$. You're on the right. You split into $Marcus_{up}$ and $Marcus_{down}$. The formalism says $Elena_{up}$ only ever meets $Marcus_{down}$. But what defines that 'meeting'? If the branching is purely local, what prevents a branch where $Elena_{up}$ and $Marcus_{up}$ find themselves in the same decohered history? The structure of the Hilbert space forbids it, sure. But that structure is global. You're relying on a global constraint on the wavefunction to enforce local correlations. That global constraint *is* the nonlocality."

  Marcus frowned, tapping a marker against his palm. "You're conflating the kinematics with the dynamics. The global constraint is the initial condition. The dynamics are local. In Bohm, the dynamics themselves are nonlocal. The velocity of my particle *right now* depends on your particle's position *right now*. That's an active influence. In Everett, nothing active happens between the wings. The correlation is passive. It's like two envelopes with opposite colored cards. Opening one doesn't change the other."

  "Except Bell proved they aren't like colored cards," Elena said sharply. "If they were pre-determined cards, we wouldn't violate CHSH. The values aren't determined until measurement. In Bohm, the positions are determined, but the guidance is nonlocal. In Everett, the values aren't determined, but the 'determination' relative to a branch requires the global wavefunction structure. You say it's passive, but the 'splitting' isn't a physical process in your ontology, it's a structural feature. And that structure enforces correlations across spacelike intervals without a mediating signal. That's nonlocality, even if you refuse to call it 'action at a distance'."

  "Call it what you want," Marcus said, his voice rising slightly. "But can I send a message? No. Can you detect the frame? No. In your theory, there is a fact of the matter about which frame is 'true,' and nature is lying to us about it. In mine, there is no such fact. Relativity holds. The cost is that 'I' am not a unique entity. But that's a metaphysical cost, not a physical one. You're introducing a physical structure—the foliation—that is empirically inaccessible. That's occult."

  "Particles are not occult," Elena retorted. "They are what click in the detectors. Your theory says there are infinite copies of me clicking detectors in incompatible ways. That's not a metaphysical cost; that's an ontological extravagance that defies parsimony. And don't tell me it's cheap because the wavefunction is cheap. The wavefunction in your view carries the weight of an infinite number of classical worlds. I prefer one world with a nonlocal connection than infinite worlds where 'locality' is saved by saying every outcome happens."

  "But in your one world," Marcus countered, "the nonlocal connection has to respect the no-signaling theorem perfectly, to infinite precision, just to hide the preferred frame. It's a conspiracy of silence. The nonlocality is there, but it's rigged never to be used. In Everett, the silence is natural. There's nothing to signal because everything that can happen, does. The 'correlation' is just the observer finding themselves in a consistent branch."

  "Consistent according to what?" Elena leaned forward. "Consistency is a logical relation. Physics needs a causal story. In Bohm, the causal story is: The wave pushes the particles, and the wave knows about the whole configuration instantly. In Everett, the causal story is: The wave evolves locally, but... what ensures I don't wake up in a branch where the statistics are violated? Decoherence suppresses interference, but it doesn't select branches. If all branches are real, then 'probability' becomes a nightmare. Why should I expect to find myself in a high-amplitude branch? If you can't derive the Born rule without begging the question, you haven't explained the correlations. You've just asserted they exist in the measure."

  Marcus paused. The Born rule derivation was the weak point, and he knew it. "Decision-theoretic derivations handle that," he said, though with less force. "If I'm a rational agent, I bet according to the squared amplitude."

  "If," Elena said. "But that's pragmatics, not ontology. Look, we're at an impasse. I accept nonlocality because I want determinate outcomes and a clear ontology of matter in 3D space. You accept indeterminacy of 'which world' to save Lorentz invariance and unitary dynamics. But don't pretend you've escaped Bell's verdict. You've just relocated the nonlocality from the dynamics of particles to the structure of the state space."

  "I haven't relocated it," Marcus said, straightening up. "I've dissolved it. Nonlocality only exists if you demand that a measurement has a single result. Drop that demand, and the tension vanishes. The universe is local; the 'single outcome' is the illusion."

  "And the price of dropping that demand," Elena said, standing up and gathering her notes, "is that you can't explain why I experience *this* outcome without invoking a measure over worlds that looks suspiciously like the probability distribution you were trying to derive. You've bought locality at the cost of making the concept of 'my experience' fundamentally vague. I'll take the preferred foliation. At least I know who I am."

  "And I'll take the copies," Marcus said, turning back to the whiteboard to erase the inequalities. "At least I know the equations are Lorentz invariant."

  They stood in the dim light, the chalk dust settling between them, neither willing to be the first to walk away.
