answer: |-
  **Title:** The Consistency Trap: Why Harsanyi's Theorem is a Constraint, Not a Foundation

  **Introduction**

  In the landscape of normative economics and moral philosophy, few results are as seductive as John Harsanyi's 1955 Aggregation Theorem. It promises what moral philosophers have sought for centuries: a derivation of substantive ethical conclusions from thin premises of rationality. The argument appears airtight. If individuals satisfy the von Neumann-Morgenstern (vNM) axioms of rational choice under uncertainty, and if a social planner satisfies those same axioms plus a Pareto condition, then the social welfare function *must* be a weighted sum of individual utilities. To many, this looks like a mathematical proof of utilitarianism. It suggests that utilitarianism is not merely one moral view among many, but the unique requirement of rational coherence.

  This is a mirage. Harsanyi's theorem is a profound piece of mathematics that has been catastrophically oversold as ethics. While the theorem correctly identifies the *structure* of utilitarian aggregation, it fails to provide its *justification*. It cannot resolve the problem of interpersonal comparison without smuggling in normative assumptions, and it is structurally blind to concerns of procedural fairness highlighted by Peter Diamond. The theorem does not prove that we ought to be utilitarians; it merely proves that *if* we accept specific, contentious moral premises about the nature of well-being and risk, *then* we must aggregate preferences in a utilitarian fashion. It is a consistency constraint, not a moral foundation.

  **The Illusion of Interpersonal Comparability**

  The central claim of Harsanyi's defenders is that the theorem bypasses the Lionel Robbins-style objection that interpersonal utility comparisons are meaningless. Harsanyi argues that because vNM utility functions are cardinal (unique up to positive affine transformation), they contain enough information to allow for comparison. However, this conflates mathematical cardinality with ethical commensurability.

  Amartya Sen's critique remains the definitive rebuttal here. The vNM axioms guarantee that for any individual $i$, their utility function $U_i$ is unique only up to an affine transformation: $V_i = a_i U_i + b_i$, where $a_i > 0$. When Harsanyi derives the social welfare function $W = \sum c_i U_i$, the weights $c_i$ are inextricably linked to the arbitrary choice of scale and zero-point for each individual's utility function.

  If I arbitrarily rescale Individual A's utility by doubling their units, their weight in the social sum is effectively halved to maintain the same social ordering. Nothing in the vNM axioms dictates where the zero-point of well-being lies (is it death? is it a life of suffering?) nor what constitutes a "unit" of satisfaction. Consequently, the "weighted utilitarianism" Harsanyi derives is indeterminate. To get classical utilitarianism (where everyone counts for one), one must assume that the units of utility are equivalent across persons. But this assumption is not a result of the theorem; it is a precondition imported from outside the model.

  Harsanyi attempts to patch this by invoking the "veil of ignorance" in later work, suggesting rational agents would choose equal weights. But this moves the goalposts. The Aggregation Theorem itself relies on the Pareto principle applied to *actual* preferences, not hypothetical ones. If we rely on the veil of ignorance to fix the weights, we are no longer doing social choice aggregation; we are doing contractarian moral philosophy. The theorem itself remains hostage to the scale. Without an independent theory of well-being that fixes the zero-points and units across persons (a heavy normative lift), the weights $c_i$ are mathematically arbitrary. A social planner could favor one individual over another simply by manipulating the measurement scale, all while satisfying Harsanyi's axioms. A theorem that allows for arbitrary discrimination via rescaling cannot serve as a proof of egalitarian utilitarianism.

  **The Blindness to Procedural Fairness**

  Even if we grant the interpersonal comparability required to fix the weights, Harsanyi's framework suffers from a deeper structural defect regarding risk and fairness. This is the crux of Peter Diamond's 1967 critique. Harsanyi's theorem relies on the ex-ante Pareto principle: if every individual prefers Lottery A to Lottery B, society must prefer A to B. Because vNM utility is defined by preferences over lotteries, the social welfare function becomes the sum of *expected* utilities.

  Diamond's counterexample is simple and devastating. Consider a society of two individuals and one indivisible good (say, a life-saving drug).
  *   **Option 1:** Give the drug to Person A. (Utility: A=1, B=0).
  *   **Option 2:** Give the drug to Person B. (Utility: A=0, B=1).
  *   **Option 3:** Flip a fair coin to decide. (Expected Utility: A=0.5, B=0.5).

  Under Harsanyi's ex-ante Pareto condition, both individuals prefer the coin flip (0.5 expected utility) to a deterministic allocation where they might get nothing (0 utility). Thus, the coin flip is socially preferred. However, consider the *ex-post* outcome. Once the coin lands, one person gets everything and the other gets nothing. Diamond argues that there is a moral value in the *procedure* of the coin flip—it treats individuals with equal respect *before* the outcome is realized—that is distinct from the expected utility calculation.

  More critically, Diamond showed that you can construct scenarios where the ex-ante Pareto principle conflicts with ex-post equity. If the social welfare function is strictly a sum of expected utilities (as Harsanyi demands), it cannot register a preference for equality of outcome distinct from the sum of expectations. The vNM axioms force the social evaluator to be risk-neutral regarding the distribution of utility. But why should society be risk-neutral? Many moral theories suggest society should be risk-averse regarding the welfare of its worst-off members (a Rawlsian concern).

  Harsanyi's theorem rules out such concerns by fiat. By insisting that society must satisfy the vNM independence axiom, the theorem presupposes that the only thing that matters is the expectation of the sum. It defines away the moral relevance of how utility is distributed across states of the world. To claim this proves utilitarianism is circular: it proves that *if* you believe only expected utility matters, *then* you must be a utilitarian. It offers no argument for why the fairness of the procedure or the equality of the ex-post outcome should be ignored.

  **The Verdict: Rationality is Not Morality**

  The persistence of Harsanyi's theorem in ethical discourse stems from a category error: the conflation of coherence with correctness. The theorem demonstrates that utilitarianism is the only moral view compatible with a specific set of formal rationality constraints (vNM axioms + Pareto). But this is a conditional victory. It places the burden of justification entirely on those constraints.

  As John Weymark's subsequent work demonstrated, relaxing the vNM axioms allows for generalized utilitarian frameworks that can incorporate rank-ordering or other equity concerns. This proves that Harsanyi's specific utilitarian conclusion is not a necessary truth of aggregation, but a contingent result of specific axioms. The Pareto principle itself is not morally neutral; it mandates that society must endorse a change even if it exacerbates inequality, provided the winners could hypothetically compensate the losers (or simply that everyone expects to gain).

  Therefore, Harsanyi's theorem does not give real philosophical support to utilitarianism. It provides a rigorous formalization of what utilitarianism looks like once you have already decided to accept its core tenets: that well-being is measurable on a cardinal scale, that interpersonal comparisons are possible, and that risk should be evaluated solely through expectation. It is a translation manual, not a foundation.

  To use the theorem as a proof of utilitarianism is to mistake the map for the territory. It tells us how to aggregate values consistently, but it remains silent on what those values are, how they should be measured across persons, and whether fairness demands more than the maximization of expectations. For the moral philosopher, the theorem is a useful check against incoherence, but it is ethically vacuous. It solves the problem of how to be a utilitarian, not whether one should be one. The heavy lifting of ethics—justifying the weights, defending the scale, and accounting for fairness—remains entirely outside the mathematics. Until that work is done, Harsanyi's result remains a elegant piece of formalism that has been asked to carry a normative weight it cannot support.
