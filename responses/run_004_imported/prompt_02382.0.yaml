answer: |-
  Welcome to the fold. It is a distinct pleasure to speak with someone who approaches moral philosophy with the same rigor they once applied to a mass spec. You have stumbled upon one of the most persistent and vexing problems in modern ethics, dressed up in turkey and gravy.

  Your daughter and your labmate are reprising a debate that has occupied moral philosophers for the last fifty years. In technical terms, your daughter is arguing from a **maximizing consequentialist** framework (specifically echoing Peter Singer), while your labmate is defending the category of the **supererogatory**.

  Here is the breakdown of the philosophical machinery behind your Thanksgiving squabble, and a proposed way to resolve the tension without discarding either intuition.

  ### 1. The Daughter's Position: The Demandingness of Good
  Your daughter's argument is logically airtight within a utilitarian framework. It relies on the **Principle of Beneficence**: *If you can prevent something bad from happening without sacrificing anything of comparable moral importance, you ought to do it.*

  Peter Singer famously illustrated this with the "drowning child" analogy: If you walk past a shallow pond and see a child drowning, you ought to wade in and pull them out, even if it ruins your shoes. The cost to you (shoes) is negligible compared to the benefit to the child (life).

  Your daughter applies this to your retirement.
  *   **The Good:** Educating students, inspiring future scientists.
  *   **The Cost:** Your leisure time (which, morally speaking, weighs less than a child's education).
  *   **The Conclusion:** If you *can* do it, you *ought* to do it. To her, "volunteering" is a misnomer. It is simply unpaid labor that you are morally obligated to perform because you possess the capital (skills/time) to do so efficiently.

  **The Philosophical Cost:** If your daughter is right, the distinction between "duty" and "charity" collapses. There is no such thing as "going above and beyond." There is only "doing what you owe" and "failing to do what you owe." This leads to the **Overdemandingness Objection**: Morality becomes so demanding that it leaves no room for personal projects, rest, or life plans. It turns every agent into a full-time moral machine.

  ### 2. The Labmate's Position: The Necessity of Supererogation
  Your labmate is defending **Supererogation**. These are actions that are good to do but not wrong to omit. Think of a soldier throwing themselves on a grenade. It is heroic (praiseworthy), but we do not court-martial a soldier who *doesn't* do it (not obligatory).

  The labmate's worry is that if you erase the supererogatory, you erase the special value of generosity. If I *owe* you my kidney because you need it more than I do, giving it to you isn't a gift; it's a repayment of debt.

  **The Philosophical Cost:** If the labmate is right, we need a principled way to draw the line. Where does duty end and heroism begin? If the line is arbitrary (e.g., "10 hours a week is duty, 11 is heroic"), then the daughter can argue we are just rationalizing laziness. This is the **Shirking Objection**: We invent the category of "supererogation" simply to guiltlessly ignore suffering we could easily alleviate.

  ### 3. Is There a Principled Boundary?
  You asked if there is a way to separate what we are "on the hook for" from what is "praiseworthy." Philosophers generally offer three ways to draw this line:

  **A. The Contractualist Line (Scanlon)**
  What rules could no one reasonably reject? We could agree to a rule that says, "Everyone must contribute some time to the common good." But we could *reasonably reject* a rule that says, "Everyone must contribute *all* their spare time." Why? because human beings need personal projects to maintain their integrity and psychological health (a point made forcefully by Bernard Williams).
  *   *Verdict:* You owe *some* contribution, but not *all* capacity.

  **B. The Virtue Ethics Line (Aristotle)**
  Stop looking at the *act* and look at the *agent*. Morality isn't about maximizing output; it's about flourishing (*eudaimonia*). A virtuous person contributes to their community, but a virtuous person also rests, reflects, and enjoys the fruits of their labor. To work yourself to the bone isn't virtuous; it's intemperate.
  *   *Verdict:* The right amount is what a wise person would do to sustain their goodness over a lifetime, not just this quarter.

  **C. The Pragmatic Line (Burnout)**
  From a systems perspective (which might appeal to the chemist in you), moral systems must be sustainable. If morality is defined as "maximize good until you drop," compliance rates plummet. People resent morality and abandon it entirely. By classifying extra effort as "supererogatory," we incentivize it through praise rather than coercing it through guilt.
  *   *Verdict:* Calling it "optional" actually produces more good in the long run than calling it "mandatory."

  ### 4. A Verdict on Your Case
  As an analytical chemist, you know that in any complex system, there is a difference between **stoichiometric requirements** (what is needed for the reaction to occur) and **catalytic enhancement** (what makes it go better/faster).

  I suggest you view your moral life similarly.

  **Your Daughter is right about the *Direction*, but wrong about the *Constraint*.**
  She is correct that you have a capacity for good that should not be wasted. A life of pure hedonistic retirement is morally thinner than a life of engagement. You *do* have an obligation to use your skills for the public good, precisely because they are rare and valuable.

  **Your Labmate is right about the *Category*, but risks complacency.**
  He is correct that if you accept your daughter's logic fully, you cease to be a private citizen and become a public utility. If you take the community college job, and then the tutoring center, and then the city council, you eventually lose the "self" that makes the chemistry demos meaningful in the first place.

  **The Synthesis:**
  There is a **Baseline Duty** and a **Supererogatory Ceiling**.
  *   **Baseline:** You have already paid your baseline duty. You worked for 40 years, paid taxes, raised a family, and contributed to the scientific record. In the contractualist sense, you have fulfilled your societal debt.
  *   **Current Status:** Anything you do now is, strictly speaking, supererogatory. However, because you *enjoy* it and it costs you little (low opportunity cost), it sits right on the border.

  **My advice:**
  Your daughter's logic fails because it ignores the moral value of **autonomy**. A good deed is only truly good if it is chosen. If you are *coerced* by moral logic to take the community college job, the action loses its moral worth—it becomes mere labor.

  You are not shirking. You are maintaining the **buffer capacity** of your life. Just as a chemical process needs slack to avoid runaway reactions, a moral agent needs unobligated time to remain a generous person rather than a resentful one.

  ### 5. Reading Recommendations
  Since you are filling your retirement with philosophy, these three texts will speak directly to this puzzle:

  1.  **"Famine, Affluence, and Morality" by Peter Singer.** (This is your daughter's bible. Read it to understand her steel-man argument.)
  2.  **"A Critique of Utilitarianism" by Bernard Williams.** (Specifically the section on "Integrity." This explains why your labmate feels the daughter's logic "proves too much.")
  3.  **"The Demandingness Objection" (Stanford Encyclopedia of Philosophy entry).** (A technical overview of the exact boundary problem you are wrestling with.)

  **The Bottom Line:**
  The distinction between duty and supererogation does not fall apart, but it is porous. It is held in place not by logic alone, but by human psychology and social sustainability. You are permitted to treat your volunteering as a gift you give, not a tax you owe. If you stop viewing it as a debt, you might find you have the energy to take that community college job after all—but only because you *want* to, not because you *must*.
