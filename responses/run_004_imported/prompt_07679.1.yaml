answer: |-
  This is a genuinely deep philosophical question wrapped in a messy friendship moment. Your friend actually raised a sophisticated point that philosophers and psychologists debate: **Is the "inhibited self" the real self, or is the "uninhibited self" the real self?**

  However, while her argument is intellectually interesting, **you were right to intervene.**

  Here is a breakdown of why her argument doesn't hold up in practice, why you did the right thing, and how to handle the fallout.

  ### 1. The Flaw in "Drunk Truth"
  Your friend argues that alcohol just removed the filter. While that's partially true, it's incomplete. Alcohol doesn't just remove inhibition; it creates **"alcohol myopia."**

  When someone is heavily intoxicated, their brain loses the ability to process peripheral cues and long-term consequences. They focus intensely on the immediate emotional impulse (I miss him/I'm sad/I want to say this) and lose the ability to process the future outcome (He will ignore me/I will look unstable/This will set my healing back).

  So, it isn't that drunk-her didn't *feel* those things. It's that drunk-her was neurologically incapable of weighing the *cost* of acting on them.
  *   **Sober-her** values long-term healing and dignity.
  *   **Drunk-her** values immediate emotional release.

  By stopping her, you didn't overrule her "true" feelings; you protected her long-term values from her short-term impulses. We don't let drunk people drive or sign contracts for this exact reason: we don't consider them competent to assess risk in that moment.

  ### 2. The Implicit Contract of Friendship
  There is an unspoken agreement in close friendships: **"If I am incapable of keeping myself safe, I trust you to do it for me."**

  When someone is that intoxicated and emotionally volatile, they are temporarily incapacitated. If she had fallen down the stairs, you would have grabbed her arm. If she tried to drive, you would have taken her keys. Sending a career-damaging or dignity-shattering text to an ex is in the same category of "self-harm."

  You weren't deciding what she *should* want forever; you were hitting the "pause" button until she was capable of making the decision with her full brain online.

  ### 3. Why She Is Actually Mad (It's not about the phone)
  She is arguing about autonomy, but she is likely feeling **shame.**

  Now that she is sober, a part of her probably knows you saved her from a massive regret. That feels vulnerable. It feels infantilizing to be "managed" by a friend. It is much easier for her to be angry at *you* for "controlling" her than to admit that she was in a bad state and needed saving. Her anger is a defense mechanism against the embarrassment of how close she came to blowing it.

  ### 4. How to Fix It
  You don't need a philosophical comeback to win this argument. You need to de-escalate the shame. If you keep arguing the logic, she will dig in deeper to defend her autonomy.

  **Try saying something like this:**
  > "I've been thinking about what you said, and I get your point. I know it felt like I was treating you like a kid or not trusting you. I'm sorry I grabbed your phone; I know that felt violating and I hate that I made you feel powerless.
  >
  > But I need you to know why I did it. I wasn't trying to decide what you should want. I was trying to protect you from doing something when your brain was chemically unable to look at the consequences. I love you, and I'd rather have you mad at me for an hour than have you wake up tomorrow devastated by something you couldn't take back. I'm on your team, always."

  ### The Verdict
  **You were right.**
  You prioritized her future well-being over her present autonomy. That is the definition of a good friend.

  Give her a day or two to let the adrenaline fade. Once the embarrassment subsides, she will likely realize that you were the only adult in the room that night. Stand your ground on the *principle* (I would do it again), but apologize for the *execution* (grabbing the phone felt aggressive).

  You didn't betray her trust; you honored the deeper trust that says, "I won't let you hurt yourself when you aren't thinking straight."
