answer: |-
  Your friend has made a sharp observation. It is true that in Section 5 of "Computing Machinery and Intelligence," Turing writes that the "statistical evidence [for telepathy] is overwhelming" and proposes a "telepathy-proof room" to prevent the human contestant from reading the interrogator's mind.

  However, her conclusion—that this concession undermines Turing's computationalism or the validity of the test—is based on a misunderstanding of what the Turing Test is actually measuring and why Turing included that safeguard.

  Here is why the "telepathy clause" does not undercut Turing's argument, and why philosophers still take the test seriously.

  ### 1. Experimental Control vs. Metaphysical Concession
  Turing was designing an **experimental protocol**, not making a metaphysical claim about the soul. In any scientific experiment, you must isolate variables.

  If telepathy exists, it represents a channel of information transfer that bypasses the text terminal. If the human contestant can telepathically know what the interrogator is thinking, or if the interrogator can sense the human's identity, the "blind" nature of the test is compromised.

  By proposing a telepathy-proof room, Turing isn't admitting that human minds possess non-computable magic; he is simply saying: *"For this test to measure linguistic behavior fairly, we must ensure all information passes through the keyboard and screen."* It is the same logic as putting a human and a computer in soundproof booths so the interrogator can't hear the human breathing or the computer humming. Controlling for a variable isn't an endorsement of its metaphysical status; it's a commitment to rigorous methodology.

  ### 2. Input/Output vs. Mechanism
  The core of Turing's functionalism is that **thinking is defined by behavior, not mechanism.**

  Even if we grant, for the sake of argument, that telepathy is real and non-computable, it does not break the test. The Turing Test does not ask, "How did you get that answer?" It asks, "Can you produce answers indistinguishable from a human?"

  *   **The Human:** Might (hypothetically) use telepathy to sense the interrogator's mood or intent.
  *   **The Machine:** Does not need telepathy. It only needs to **simulate the output** of a being that might use telepathy.

  If a human uses ESP to answer a question, they still produce text. A machine does not need ESP to produce the same text; it only needs a sufficiently complex algorithm to predict what text a human would produce. Turing's claim is that if the machine can match the human's *output*, the difference in *internal processing* (neurons vs. silicon vs. psychic powers) is irrelevant to the definition of "thinking."

  ### 3. Historical Context: 1950s Science
  It is easy to view telepathy as pure pseudoscience today, but in 1950, the status was more ambiguous. Parapsychology laboratories (like J.B. Rhine's at Duke University) were publishing statistical studies in respected journals.

  Turing was an empiricist. When he said the statistical evidence was "overwhelming," he was reflecting the scientific consensus of his specific moment in time. Acknowledging the prevailing scientific data of 1950 doesn't invalidate his logic; it actually highlights his rigor. He was ensuring his thought experiment remained robust even under the scientific assumptions of his day.

  ### 4. Why Philosophers Still Take the Test Seriously
  Philosophers of mind are well aware of the telepathy paragraph. It is not treated as a "gotcha" that invalidates the test for several reasons:

  *   **It's a Heuristic, Not a Definition:** Most contemporary philosophers do not treat the Turing Test as a strict *definition* of consciousness or intelligence. Instead, it is a heuristic for **behavioral equivalence**. The debate has moved on to internal states (qualia, intentionality), but the Test remains the starting point for discussing external verification of mind.
  *   **The "Black Box" Principle:** The Test is intentionally agnostic about what happens inside the box. Whether the human box uses quantum biology, Cartesian dualism, or telepathy is irrelevant. The test asks if the *machine* can mimic the *results* of the human box.
  *   **Critiques are Different:** When philosophers criticize the Turing Test today (e.g., Searle's Chinese Room, Block's Blockhead), they attack the idea that *syntax implies semantics* or that behavior implies understanding. They do not attack it because Turing tried to control for ESP.

  ### Summary
  Your friend is right that Turing took ESP seriously enough to control for it. But she is mistaken in thinking this concedes that human thought is non-computable.

  Turing's point was: **"If a machine can imitate a human so well that we cannot tell the difference via text—even if the human is using psychic powers we don't understand—then for all practical purposes, the machine is thinking."**

  The telepathy-proof room ensures the test measures **communication**, not **mind-reading**. It protects the integrity of the interface, not the computability of the mind. Therefore, the safeguard strengthens the test's logical consistency rather than undermining it.
