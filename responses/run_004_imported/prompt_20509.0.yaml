answer: |-
  The tension between the Common Prior Assumption (CPA), often termed the Harsanyi Doctrine, and the broader framework of Bayesian subjectivism lies at the heart of epistemic game theory and the philosophy of probability. To evaluate whether genuine, persistent disagreement is possible between ideally rational agents, one must first distinguish between the minimal requirements of Bayesian rationality and the substantive metaphysical commitments of the Harsanyi Doctrine. While ordinary Bayesianism mandates only internal coherence, the CPA imposes an interpersonal constraint that equates rationality with consensus given shared information. Using Aumann's Agreement Theorem as a test case, this essay argues that while the CPA provides a compelling normative ideal for communication, it is not a necessary condition of individual rationality; consequently, genuine persistent disagreement between rational agents remains possible, though it signals a failure of common knowledge rather than a failure of logic.

  ### Bayesian Subjectivism vs. The Common Prior Assumption

  Ordinary Bayesian subjectivism defines rationality primarily as a constraint on the *structure* of belief rather than its *content*. An agent is rational if their credences satisfy the probability axioms (coherence) and are updated via conditionalization upon receiving new evidence. Crucially, this framework is permissive regarding priors. Two agents can observe the exact same stream of evidence yet converge on different posteriors, provided they started with different priors. In this view, priors represent an agent's subjective starting point, potentially shaped by psychology, biology, or arbitrary choice. There is no requirement that Agent A's prior match Agent B's prior.

  The Common Prior Assumption (CPA) radically tightens these constraints. Formulated by John Harsanyi in the context of game theory, the doctrine posits that if two agents differ in their probabilistic assessments of a state of the world, this difference must be attributable entirely to differences in their information sets. Implicitly, this requires that all rational agents share the same prior probability distribution over the state space before receiving any private information.

  The CPA is distinctive and more demanding in two specific ways. First, it shifts the locus of rationality from the individual to the collective. Ordinary Bayesianism asks, "Are your beliefs consistent with your own starting point?" The CPA asks, "Is your starting point consistent with everyone else's?" Second, it eliminates the possibility of "brute" disagreement. Under subjectivism, disagreement can be fundamental (different priors). Under the CPA, disagreement is merely provisional; it exists only because information has not been fully pooled. If agents with a common prior share their posteriors, they must converge. Thus, the CPA transforms probability from a logic of personal belief into a logic of objective information processing.

  ### Justifying the Common Prior

  Given that Bayesian subjectivism allows for diverse priors, what justifies imposing the CPA on agents who did not arise from a shared informational starting point? There are three primary lines of justification, ranging from metaphysical to pragmatic.

  The first is the **Veil of Ignorance** argument. This posits that priors represent a state of knowledge prior to any specific experience. If we imagine agents before they are "born" into their specific epistemic situations (before they receive their private partitions of information), they are essentially identical rational entities. Since there is no distinguishing feature between them at this pre-empirical stage, the Principle of Sufficient Reason dictates they should assign probabilities identically. To have different priors would be to assert an arbitrary distinction without a differentiating cause.

  The second justification is the **Merging of Opinions** theorem (Blackwell and Dubins). This result suggests that even if agents start with different priors, as long as those priors are absolutely continuous with respect to one another, their posteriors will converge almost surely as they receive an infinite stream of common data. Proponents of the CPA argue that if priors wash out in the limit, assuming they are common from the start is a harmless simplification that models the long-run behavior of rational learners.

  The third justification is **pragmatic and normative**. In strategic interactions, assuming a common prior allows for the definition of a "rational expectation" equilibrium. If agents are allowed arbitrary priors, any action can be rationalized, rendering the concept of rationality toothless in predictive models. Imposing the CPA forces agents to treat each other as equally competent processors of truth, fostering a norm where disagreement is viewed as a puzzle to be solved through information exchange rather than a permanent feature of the landscape.

  However, these justifications are not without weakness. The "Veil of Ignorance" relies on a fictional metaphysical state. The "Merging" theorem requires infinite data, which is unavailable in finite human contexts. The pragmatic argument confuses modeling convenience with normative truth. Thus, while the CPA is a useful heuristic, it lacks the logical necessity of the probability axioms themselves.

  ### Aumann's Agreement Theorem as a Test Case

  Robert Aumann's 1976 Agreement Theorem provides the rigorous test case for these competing frameworks. The theorem states: *If two agents have a common prior, and their posterior probabilities for a given event are common knowledge, then their posterior probabilities must be equal.*

  The implications are stark. Under the CPA, "agreeing to disagree" is impossible. If I know that you believe $X$ with probability 0.8, and you know that I believe $X$ with probability 0.6, and we both know that we share a prior, logic dictates that one of us must update. We cannot maintain our differing beliefs once the disagreement itself becomes common knowledge. The disagreement implies that we possess different information; once we know *that* we disagree, we effectively pool that information, forcing convergence.

  This theorem forces a verdict on the possibility of persistent disagreement. If one accepts the CPA as a requirement of ideal rationality, then persistent disagreement between rational agents is impossible. Any observed disagreement must imply that at least one agent is irrational (violating coherence or conditionalization) or that the condition of "common knowledge" has not been met.

  However, if one adheres to strict Bayesian subjectivism, Aumann's theorem does not apply. If Agent A and Agent B have different priors, they can know each other's posteriors, know that they disagree, and yet both remain perfectly coherent. Their disagreement is not a signal of hidden information, but of different inductive policies.

  ### Verdict: The Possibility of Rational Disagreement

  Is genuine, persistent disagreement between ideally rational Bayesian agents possible? The verdict depends on whether the Common Prior Assumption is viewed as a constitutive rule of rationality or a contingent assumption about the world.

  I argue that **genuine persistent disagreement is possible** because the CPA is not a necessary condition of ideal rationality. To claim otherwise is to conflate *epistemic rationality* (managing one's own beliefs coherently) with *social epistemology* (aligning beliefs with others).

  There are two main reasons to reject the CPA as a mandatory constraint on rationality. First, the **underdetermination of priors by reason**. There is no unique logical function that maps "total ignorance" to a specific probability distribution (the reference class problem). Two agents can look at the same void of information and reasonably adopt different default stances (e.g., one favors simplicity, another favors complexity) without violating coherence. Second, the **condition of common knowledge is impossibly strong**. Aumann's theorem requires not just that we know each other's beliefs, but that we know that we know, ad infinitum. In any realistic scenario, even between ideal agents, this infinite regress is rarely satisfied. Agents may know they disagree, but they may not know *why* (i.e., they cannot fully distinguish whether the difference stems from priors or private information).

  Therefore, Aumann's theorem should be interpreted not as a proof that disagreement is irrational, but as a proof that **disagreement implies a lack of common knowledge or a lack of common priors.** Since we have independent reason to doubt that agents share common priors (due to the subjectivity of inductive bias), we must accept that rational agents can persist in disagreement.

  However, this verdict comes with a significant caveat derived from the strength of the Harsanyi Doctrine. While disagreement is *possible*, the CPA serves as a powerful **regulative ideal**. If two agents recognize they disagree, the Harsanyi Doctrine imposes a burden of proof: they must either identify the informational asymmetry causing the split or acknowledge that their priors differ. If they assume they *should* have common priors (based on the Veil of Ignorance justification), then persistent disagreement becomes a marker of epistemic failure—not of logical incoherence, but of a failure to recognize shared rationality.

  ### Conclusion

  The Common Prior Assumption is a distinctive and demanding commitment that transcends the minimal requirements of Bayesian subjectivism. It transforms probability from a tool for individual consistency into a mechanism for interpersonal consensus. While justifications for the CPA exist—rooted in symmetry, convergence, and strategic necessity—they are not logically binding. Consequently, Aumann's Agreement Theorem does not rule out the possibility of rational disagreement; it merely delineates the conditions under which disagreement would vanish. Since ideal rational agents are not logically compelled to share priors, and since common knowledge is rarely achieved, genuine persistent disagreement remains possible. The Harsanyi Doctrine is best understood not as a law of thought, but as a normative aspiration: rational agents *may* disagree, but in the pursuit of truth, they ought to strive for the information pooling that would make such disagreement impossible.
