answer: |-
  Here are 10 sequenced questions designed to tighten the noose on the "Deep Morality vs. Law of Armed Conflict (LOAC)" distinction. The sequence moves from internal coherence to practical application, finally challenging the utility of the theory itself.

  ### 1. The Epistemic Constraint (Requirement 1)
  **Question:** "You argue that unjust combatants are morally liable to be killed because they fight for an unjust cause. But given the 'fog of war' and state propaganda, most rank-and-file soldiers lack the epistemic access to reliably judge *jus ad bellum*. If a soldier cannot *know* they are fighting unjustly, how can they bear the moral liability you assign them? Does morality not require epistemic access?"

  **Anticipated Response:** "Liability is objective. They are threats regardless of what they know. The law handles the epistemic problem, not the morality."
  **Follow-up:** "If the morality is objective but inaccessible to the agent, in what sense is it *action-guiding*? If a soldier literally cannot know they are liable, isn't your 'deep morality' functionally inert for the very people it judges?"

  ### 2. Liability vs. Culpability (Requirement 2)
  **Question:** "Let's talk about the conscript. Consider a soldier drafted at gunpoint, under duress, who poses a threat but bears no responsibility for the war's injustice. You call them 'merely liable.' But if they lack culpability, what grounds their liability other than brute causality? Are we not reducing moral status to mere physics?"

  **Anticipated Response:** "They are still material threats to innocent life. Liability doesn't always require culpability, just as a bystander can sometimes be liable if they are the only shield."
  **Follow-up:** "But a bystander isn't forced to be there. If the conscript is coerced, doesn't the *aggressor's* liability (the regime forcing them) screen off the conscript's liability? Why does the moral burden shift to the victim of coercion rather than the coercer?"

  ### 3. The Right to Self-Preservation (Requirement 3)
  **Question:** "Once the shooting starts, an unjust combatant realizes they are being targeted by just combatants. On your view, they have no right to kill the just combatant. But do they retain *any* right to use force simply to save their own skin? Or does your theory imply they have a moral duty to submit to execution?"

  **Anticipated Response:** "They have a right to self-defense against excessive force, but not against necessary force. They cannot kill the just combatant who is legitimately targeting them."
  **Follow-up:** "So if the only way to survive is to kill the just combatant, they must die? If your 'deep morality' demands suicide from one class of combatants mid-battle, isn't that a *reductio ad absurdum* of the theory's practical coherence?"

  ### 4. The Action-Guiding Gap
  **Question:** "You say the Law of Armed Conflict should remain symmetric for pragmatic reasons, even if deep morality is asymmetric. What instruction does this give to the soldier in the trench? Should they believe they are moral equals (per the law) or moral unequals (per your theory)?"

  **Anticipated Response:** "They should follow the law for coordination, but philosophers should know the truth."
  **Follow-up:** "So you are advocating that soldiers act on a legal fiction they know to be morally false? Doesn't encouraging agents to act against their moral understanding undermine the integrity of moral agency itself?"

  ### 5. The Authority of Law
  **Question:** "Legal systems derive authority from their alignment with justice. If LOAC is symmetric but deep morality is asymmetric, the law is systematically misrepresenting moral reality. Doesn't this divergence erode the moral authority of the law? Why should soldiers respect a law that they know contradicts the 'deep truth'?"

  **Anticipated Response:** "Because the law serves peace, which is a higher pragmatic good."
  **Follow-up:** "But if 'peace' requires institutionalizing a moral lie about who is liable to be killed, isn't that a cynical foundation for international order? Can a legal regime survive long-term if it explicitly contradicts the moral reasoning of its subjects?"

  ### 6. Incentive Structures
  **Question:** "If unjust combatants are taught (by philosophers, if not lawyers) that they are morally liable and lack rights, does this not incentivize them to fight *dirtier*? If they believe they are already condemned, why would they adhere to *jus in bello* constraints?"

  **Anticipated Response:** "That's an empirical claim. My theory is normative."
  **Follow-up:** "But normative theories must be sensitive to foreseeable consequences. If your moral distinction predictably increases atrocities by removing the incentive for unjust combatants to restrain themselves, doesn't that moral cost outweigh the theoretical precision?"

  ### 7. The "Fog" as a Moral Feature (Epistemic Return)
  **Question:** "You treat the epistemic limitation of soldiers as a pragmatic problem for the *law*, but not a moral problem for *liability*. But isn't the inability to judge *ad bellum* a moral feature of the combatant's situation? If God placed them in a fog where they cannot distinguish justice, isn't holding them to an asymmetric standard itself unjust?"

  **Anticipated Response:** "The fog doesn't change the objective facts of the threat."
  **Follow-up:** "It changes the *moral* facts of the agent's responsibility. If the fog is inherent to war, doesn't the 'deep morality' have to account for it? If it doesn't, isn't your theory describing a war that doesn't exist?"

  ### 8. Post-War Accountability
  **Question:** "If unjust combatants are morally liable for their attacks, does this not imply they should be legally prosecuted for murder after the war? If you say 'no, the law should remain symmetric,' aren't you granting them legal immunity for acts you deem morally criminal?"

  **Anticipated Response:** "We can't prosecute everyone. It would hinder reconciliation."
  **Follow-up:** "So the 'deep morality' says they committed murder, but the law says they didn't. Doesn't this create a two-tiered justice system where the law explicitly protects people from the consequences of their moral actions? How is that justice?"

  ### 9. Human Rights Foundations
  **Question:** "Modern LOAC is built on the idea of universal human rights that persist even in war. Your revisionism suggests the right to life is contingent on the justice of one's cause. Does this not instrumentalize human rights, turning them into political privileges rather than inherent protections?"

  **Anticipated Response:** "Rights are forfeited by posing unjust threats."
  **Follow-up:** "But if the determination of 'unjust' is political and contested, haven't you made the fundamental right to life contingent on political judgment? Isn't that exactly what human rights law was designed to prevent?"

  ### 10. Theoretical Utility (The Knockout)
  **Question:** "Finally, if the law cannot change for pragmatic reasons, and soldiers cannot act on your theory without risking chaos or death, what work is this 'deep morality' actually doing? If it changes neither policy nor action, is it not merely a taxonomy of violence rather than an ethical framework?"

  **Anticipated Response:** "It helps us judge the war retrospectively."
  **Follow-up:** "We already have *jus ad bellum* for that. If your theory of combatant inequality changes nothing in the fighting, the law, or the post-war judgment, aren't you just drawing distinctions without a difference? What is the cash value of this theory?"
