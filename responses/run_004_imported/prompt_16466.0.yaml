  Got a guest lined up for the Q&A after my ethics-of-war seminar next week -- not a real person, just a stand-in for the revisionist critics of the moral equality of combatants, the McMahan-style line that unjust combatants have no right to kill even the just combatants trying to kill them, they're merely liable threats. Whenever someone raises the "that'd be a disaster as actual policy" objection, he's got a stock move: "I'm only describing the deep morality of the case -- the law of armed conflict can stay symmetric for entirely seperate reasons." Write me 8-10 questions that don't let him coast on that escape hatch -- sequence them so the move gets harder to use as we go, and give a follow-up after each keyed to whatever he'll probably say back. I want at least one question each pressing the epistemic argument for keeping combatants legally equal anyway, pressing whether "liable but not culpable" really holds up for a conscript fighting under duress, and pressing whether an unjust combatant keeps any narrower right to just save his own skin once the shooting's actually started.
