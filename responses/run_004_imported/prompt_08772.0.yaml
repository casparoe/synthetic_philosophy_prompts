answer: |-
  October, 1727. Kensington.

  The candle gutters, fighting the draft that slips through the sash. Outside, London is a beast that never sleeps, but in here, in the rooms where he drew his last breath, the silence is absolute. It has the weight of a physical object, pressing against the stacks of paper that cover the great desk.

  I am the executor. I am the husband of his niece. I am the man who is to succeed him at the Mint. And tonight, I am the grave-robber of a saint.

  They call him the Prince of Philosophers. The man who bound the planets to their courses with lines of ink. When the coffin was lowered, the peers of the realm held the pall. Voltaire, in Paris, will soon write that he lived like a sage and died like a god. It is a necessary fiction. I have spent the last month curating it, selecting the letters that show his piety, his deference to the Church, his quiet conformity.

  But the boxes beneath the desk do not speak of conformity.

  I open the third bundle. The paper is brittle, yellowed by thirty years of concealment. The handwriting is unmistakable—that tiny, cramped script, as if he sought to fit the infinite into the smallest possible space.

  It is a draft of a letter to Mr. Locke. Dated near the turn of the century. I read the lines, and the air in the room grows thin.

  *...the text of the Three Witnesses... a later corruption...*

  He argues that the scriptural foundation of the Trinity, the very keystone of the Christian arch, is a forgery. A fraud inserted by scribes in the dark ages. He does not merely doubt it; he dissects it with the same cold precision he applied to the prism. He treats the Athanasian Creed not as holy dogma, but as a historical error, a disease that infected the Church in the fourth century.

  I set the paper down. My hand trembles. If this were found in the possession of a living man, he would lose his post. He would be barred from the universities. He would be a pariah. For a dead man, it is worse. It is damnation. It turns the monument in Westminster Abbey into a lie carved in stone.

  I reach for another sheaf. This is older. Decades of work. He has reconstructed the cubit of the ancients. He has measured Solomon's Temple, not to glorify the architecture, but to find the code hidden within the walls.

  *The Apostasy.*

  He writes of the Book of Daniel and the Revelation of St. John. To the world, these are mysteries of the end times. To him, they were history books written in advance. He has calculated the dates. He marks the rise of the Nicene orthodoxy not as the triumph of truth, but as the Great Apostasy foretold by Paul. The Trinitarians, in his view, are the idolaters. The Temple measurements are a cipher proving that the true worship was lost when the Church crowned the Son as equal to the Father.

  He believed he was the last guardian of the true fire.

  I stand and walk to the window. The moon is high. Somewhere out there, the Royal Society is drafting their eulogies. They speak of his modesty, his Christian charity. They do not know that the man who explained the motion of the stars believed the Church of England was a whore of Babylon.

  What do I do with this?

  There is a brazier in the corner, cold and black. It would be so simple. A match, a flare, and the smoke would carry this away. I could be the guardian of his glory. I could save his name from the whispers that would surely follow if the bishops got wind. I could protect Catherine, protect my own position, protect the Enlightenment itself from the embarrassment of its greatest hero being a heretic.

  But if I burn it, I burn *him*.

  Not the public effigy, but the man who sat in this chair, night after night, chasing the mind of God through the numbers of prophecy. He was not a deist, content with a watchmaker God. He was obsessed. He wanted the true God, the God of Israel, the God of the Temple. He sacrificed his peace, his sleep, perhaps his sanity, to this reconstruction.

  To burn it is to say his life's true work was nothing. To keep it is to risk turning his legacy to ash.

  I return to the desk. I pick up the letter to Locke again. I trace the ink of the word *corruption*.

  I think of the statue they are commissioning. I think of the boys at Cambridge who will study the *Principia* as if it were scripture. Can they hold both truths? Can the man who mapped the heavens be the same man who believed the Church was blind?

  Perhaps the world cannot bear the weight of a whole man. Perhaps it needs the idol.

  I fold the letter. I place it back into the bundle with the Temple measurements. I tie the ribbon. It is a loose knot. Anyone could undo it.

  I do not put it in the brazier. Nor do I place it with the public papers I have set aside for the Royal Society.

  I open the bottom drawer of the desk, the one with the false back he showed me once, years ago, in a moment of strange trust. I slide the bundle inside. It fits perfectly, as if measured for the space.

  I close the drawer. I lock it. I put the key in my waistcoat pocket. It feels heavy against my ribs, cold as a coin.

  I blow out the candle. The darkness rushes in, total and immediate. I stand in the black room, the key pressing into my chest, listening to the silence of the dead man, wondering if I have just saved a reputation or buried a soul. I do not move. I wait for the morning, but I know the night has already won.
