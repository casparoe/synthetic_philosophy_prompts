      *   *The Philosophical Crux:* Is "being the surgeon" (the fixer) a deep element of Silas's $S$ set? Or was it just a marketing brand he adopted?
      *   *If it's in the $S$ set:* Internalism says he has a reason to stop (to preserve his self-conception).
      *   *If it's not:* Internalism says he has no reason. Externalism says he has a reason (it's wrong to gut a hospital).
      *   *The Ambiguity:* Silas himself might not know if he cares about the "craft" or just the "cash."

