      *   *The $S$ set:* Includes desires, projects, commitments, loyalties, dispositions.
      *   *Sound Deliberation:* Can include correcting factual errors, imagining consequences vividly, or realizing that $\phi$ is a means to an end already in $S$. It *cannot* simply invent a new ultimate end out of thin air.
