answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophy professors, Alex and Bianca, are finishing up a seminar on metaphysics. Alex is stirring sugar into an espresso; Bianca is packing a tablet into a leather satchel.*

  **Alex:** You know, that question from the electrician in the back row actually wasn't terrible. About the toaster. He wanted to know if the heating element was "dangerous" when the switch was off.

  **Bianca:** *(Smiling)* And you told him it depended on whether he was asking about the categorical base or the disposition.

  **Alex:** I told him the disposition to shock was absent because the circuit was open. But he kept pressing: "But the wire is still copper. The capacity is still there." He's intuitively a primitivist. He thinks "live" is a property the wire holds in its pocket, waiting to be used.

  **Bianca:** Because the counterfactual analysis fails the intuition test. Look, Alex, we've been dancing around this for twenty years. The Simple Conditional Analysis (SCA) is dead. "X is fragile iff if X were struck, it would break." We know it's false.

  **Alex:** It's not false; it's incomplete. It's a first draft. Lewis showed us how to fix it. You remember the Fink case. The wire that is dead, but hooked to a sorcerer who makes it live the instant a conductor touches it.

  **Bianca:** Classic Fink. The wire isn't live. But if you touch it, it shocks you. So the counterfactual "If touched, it would shock" is true, but the disposition "is live" is false. SCA says it's live. SCA is wrong.

  **Alex:** But Lewis's revision handles that. You don't just say "if struck." You say, "if struck, *and* the intrinsic causal basis of the disposition remains in place." In the Fink case, the basis (the conductivity) isn't there *until* the touch. The sorcerer changes the intrinsic properties at time *t*. So the revised analysis holds: The wire isn't live because it lacks the causal basis *prior* to the stimulus. Patch applied.

  **Bianca:** You treat Lewis's 1997 paper like it's the final word, not a move in a game. The Fink is easy. The Mask is the killer.

  **Alex:** The antidote case.

  **Bianca:** Right. Take a poison. It has the intrinsic molecular structure—the causal basis—that makes it deadly. It retains that structure perfectly. But I swallow it along with a perfect antidote that neutralizes the reaction in my stomach. The poison *is* poisonous. Everyone agrees on that. But the counterfactual "If ingested, it would kill me" is false. I ingest it, and I live.

  **Alex:** So we add a *ceteris paribus* clause. "If ingested, and no interfering factors..."

  **Bianca:** *(Leans forward)* There it is. The "interference" clause. Who defines interference? If you define an interfering factor as "anything that prevents the manifestation of the disposition," you've defined the disposition in terms of itself. You're saying: "It's poisonous if it would kill you, unless something stops it from killing you." That's circular. You haven't analyzed the disposition; you've just hidden it inside the "normal conditions" footnote.

  **Alex:** It's not circular if we can specify the interfering factors independently. We talk about standard conditions all the time in science. Solubility is defined in water, not in acid that dissolves the solute's bonds instantly. We don't say salt isn't soluble because it doesn't dissolve in oil.

  **Bianca:** But the antidote case isn't like oil. The antidote interacts *specifically* with the poison's causal basis. The basis is there. The stimulus is there. The manifestation is blocked. If you have to list every possible mask, every possible antidote, every possible sorcerer to make your conditional true, you don't have an analysis. You have a list of exceptions. At what point do you admit the truth-maker for the conditional *is* the disposition, not the other way around?

  **Alex:** I admit the disposition explains *why* the conditional is true. But that doesn't mean the disposition is ontologically distinct from the conditional plus the basis. Look, Bianca, what's your alternative? Primitivism? "Fragility is just a brute fact"? That sounds like magic. It's philosophically lazy. It says, "We can't reduce it, so let's just posit a new fundamental category of property."

  **Bianca:** It's not lazy; it's honest. Quantum charge is dispositional. Mass is dispositional. If you strip away what an electron *does*, what's left? Nothing. Dispositional Essentialism says these aren't properties that *have* powers; they *are* powers. They are fundamental. The counterfactuals are the *symptoms* of the property, not the definition. When I say "this is poisonous," I'm describing its nature. The fact that an antidote masks it doesn't change its nature. Your analysis forces me to say the poison loses its poisonousness the moment I swallow the antidote. That's absurd.

  **Alex:** I don't say it loses the property. I say the truth conditions for the ascription change. But let's hit your view with a Mimic. A styrofoam plate. It's not fragile. But a sorcerer watches it. If it's struck, the sorcerer uses a ray gun to shatter it instantly.

  **Bianca:** Right.

  **Alex:** So, "If struck, it would break" is true. But it's not fragile. SCA says it is. My Revised Analysis says: "If struck, and the intrinsic basis causes the breaking." In the Mimic case, the basis (the styrofoam structure) didn't cause the breaking. The ray gun did. So my analysis correctly says it's not fragile. Your primitivism has to explain why the disposition is absent. You just say "It lacks the power." But how do we know? Because it doesn't break? But it *does* break in the counterfactual scenario.

  **Bianca:** We know it lacks the power because of its categorical structure. Styrofoam lacks the molecular bonds to shatter under impact. The breaking is extrinsic. But notice what you did there, Alex. To save the Conditional Analysis, you appealed to *causation*. "The basis must *cause* the manifestation."

  **Alex:** Yes.

  **Bianca:** And what is causation?

  **Alex:** *(Pauses)* Event regularity. Or counterfactual dependence...

  **Bianca:** Or *dispositional production*. Most metaphysicians of causation now think causation is the exercise of powers. If you define dispositions using counterfactuals, and you fix the counterfactuals using causation, but causation is itself dispositional... you're chasing your tail. You haven't reduced dispositions to non-dispositional terms. You've just shuffled the deck.

  **Alex:** That's a charge of circularity, but it's not a knockout. Even if causation is dispositional, the *analysis* clarifies the logical structure. It tells us how disposition talk connects to stimulus and manifestation talk. That's useful. Primitivism just shrugs and says "It's all powers all the way down." It makes science impossible. How do we measure a power if it's not tied to a specific conditional outcome?

  **Bianca:** We measure it by testing the object, not by analyzing sentences. Look, the real problem is that your view makes dispositions extrinsic. In the Fink case, whether the wire is live depends on the sorcerer standing nearby. But intuitively, whether a wire is live is about the wire.

  **Alex:** That's why Lewis insists on the *intrinsic* causal basis. The sorcerer changes the intrinsic basis.

  **Bianca:** But in the Antidote case, the basis is intrinsic and present! The poison is what it is. The antidote is external. Yet your analysis says the disposition ascription is false. You are making the possession of the property dependent on the environment. I'm saying the property is internal; the *manifestation* is relational. You're conflating having the power with exercising the power.

  **Alex:** I'm not conflating them; I'm linking them. If you have a power that can never, under any condition, be exercised, do you really have it?

  **Bianca:** If the conditions are masked, yes! A seed has the disposition to germinate even if it's kept in a vacuum forever. It never germinates. The counterfactual "If planted, it would germinate" is false in the vacuum. But the seed doesn't lose its disposition.

  **Alex:** But if it's in a vacuum, the "If planted" condition posits a change in environment. If we move it to soil, it germinates.

  **Bianca:** But what if there's a Finkish gardener who kills the seed the moment it hits the soil? Now "If planted, it would germinate" is false. The seed is in soil. The stimulus is there. The gardener stops it. Does the seed lose its disposition to germinate?

  **Alex:** *(Sighs)* The gardener is an interfering factor.

  **Bianca:** There's the phrase again. "Interfering factor." You're using the disposition to define the interference. You only know the gardener is "interfering" because you already know the seed *should* germinate. You need the disposition to identify the interference, but you need the absence of interference to define the disposition.

  **Alex:** Okay, grant me that the *concept* of interference relies on some background knowledge. That doesn't mean the *property* is primitive. It means our epistemic access is holistic. But ontologically, I still maintain: there is no "germinative power" floating above the molecular structure and the conditionals. There is just the structure, and the truth of the conditionals given that structure.

  **Bianca:** And I maintain that the structure *is* the power. The molecular bonds *are* a potentiality. You're trying to reduce potentiality to actuality plus logic. It won't work. You'll always need a "unless" clause. And every "unless" clause invites a new counter-example. I can dream up a Finkish antidote. A sorcerer who removes the poison's toxicity only when it enters a stomach, but puts it back if it enters a test tube.

  **Alex:** I can patch that. "Unless the sorcerer..."

  **Bianca:** See? You're adding epicycles. Ptolemy could predict the planets too, Alex. He just kept adding circles. Eventually, you have to ask if the earth is actually moving.

  **Alex:** And eventually, you have to ask if positing "irreducible powers" is just a fancy way of saying "we don't know how this works yet." Primitivism is a conversation stopper. "Why did the glass break?" "Because of its fragility." "What's fragility?" "The power to break." "What's that?" "Don't ask."

  **Bianca:** No. "Why did the glass break?" "Because it was struck." "Why did that matter?" "Because glass has a structure that responds to impact by shattering." "What is that structure?" "It's a crystalline arrangement that lacks plastic deformation capacity." That's the categorical base. But the *disposition* is the fact that this structure *is for* breaking under impact. It's directional. Your view flattens the directionality into a static truth value.

  **Alex:** The directionality is in the causal basis! The bonds are arranged such that stress propagates cracks.

  **Bianca:** "Such that." There it is. "Such that." That's modal language. That's dispositional language. You can't scrub the modality out, Alex. You're smuggling it in through the back door of "causal basis."

  **Alex:** Maybe. But I'd rather smuggle it in than build a castle on it. If I'm the repair shop guy, I need to know: if I fix the cutoff switch, is the toaster safe? Your view says, "The toaster retains the disposition to burn, even if it can't manifest it." That's not helpful. My view says, "The counterfactual 'if left on, it would burn' is false." That's actionable.

  **Bianca:** But if the cutoff switch fails? The disposition explains *why* it burns. The counterfactual just describes *that* it burns. If you want to understand the risk, you need to know the power is there, waiting. The switch is just a mask. If you treat the mask as removing the property, you get complacent.

  **Alex:** *(Taps his coffee cup)* I treat the mask as changing the truth conditions of the safety claim. "Safe" means "won't burn in standard use."

  **Bianca:** And "standard use" is defined by...?

  **Alex:** *(Smiles)* ...by the absence of masks.

  **Bianca:** *(Laughs)* Exactly. You're stuck.

  **Alex:** And you're stuck with invisible powers that never show up when the sorcerer is around.

  **Bianca:** They show up in the nature of the thing.

  **Alex:** Which we only know by... what it does.

  **Bianca:** Which is determined by... what it is.

  *(They sit in silence for a moment, the steam from the coffee rising between them.)*

  **Alex:** So. The toaster.

  **Bianca:** The toaster.

  **Alex:** I'm telling the customer the heating element isn't dangerous because the switch works.

  **Bianca:** And I'm telling her the heating element is dangerous, but the switch is a reliable mask.

  **Alex:** She's going to think we're insane.

  **Bianca:** She already does. That's why she asked.

  **Alex:** *(Picks up his cup)* One more round? I think I can patch the antidote case if we appeal to probabilistic conditionals...

  **Bianca:** *(Picks up her satchel)* Only if you promise not to mention "causal basis" without defining "cause."

  **Alex:** Deal.
