      *   This is the classic **Problem of Old Evidence** (Glymour, 1980).
      *   In strict Bayesian terms: $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$. If $E$ is known with certainty, $P(E) = 1$. If the agent already knows $E$, then $P(E|H)$ is often also 1 (since $H$ must be consistent with known reality), leading to no update.
