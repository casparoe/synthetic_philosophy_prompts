  Ok this is going to sound like a weirdly specific thing to be stuck on, but it's been bugging me for like a week. I'm a stats PhD student (my dissertation is basically all Bayesian hierarchical models, and I minored in philosophy as an undergrad, so my brain won't just let things go). Our radiator has been banging like crazy on cold nights all winter, which by now is just a fact of life in my apartment - it happens every single time it's below freezing outside and never when it's warmer. Last week the building super finally checked it out and said its probably a pocket of air trapped in the pipe: the bigger the temperature gap between the water and the room, the more the air pocket contracts and expands and knocks against the metal, which is exactly why it's only the cold nights that set it off. The moment he said that, my confidence that he'd nailed it shot way up.

  Except walking back inside I couldn't stop picking at it: the "only bangs on cold nights" pattern wasn't new information at all, I already believed that with like 99% certainty before he said a word. So if I'd already fully accounted for that fact, hearing his theory and re-registering the same old fact shouldn't move my probability on the theory one bit, there's no new data being added, just an old fact plus a story that happens to fit it neatly. But it really does feel like his explanation earned extra credibility from matching that old pattern, over and above just sounding mechanically plausible on its own. So which is it: am I falling for some kind of bias where I'm treating "explains what I already knew" as if it were "predicted something new," or is there an actual principled reason old, already-known facts can still confirm a new explanation? Ran this by my labmates over lunch and we just went around in circles, so figured I'd try it on you.
