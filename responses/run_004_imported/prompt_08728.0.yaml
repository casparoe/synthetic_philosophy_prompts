answer: |-
  **MEMORANDUM**

  **TO:** Technical Interviewing Working Group, Hiring Committee
  **FROM:** Accommodation Policy Sub-Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Decision Regarding Generative AI as a Reasoning Accommodation

  ### **Decision**
  **Approved with Specific Conditions.**

  The Working Group approves the candidate's request to utilize a personal AI coding assistant during the live coding round, subject to strict configuration and protocol constraints. This ruling establishes a new precedent: **"Active Tooling Accommodations for Neurodivergent Engineers."**

  ### **Policy Reasoning**
  We recognize the validity of the candidate's argument regarding the "Extended Mind." For engineers with working memory deficits, the friction of recalling syntax or boilerplate patterns can obscure the assessment of their actual architectural and problem-solving capabilities. In a senior role, the core competency we assess is **engineering judgment**, not unaided recall.

  However, we must distinguish between *external storage* (Otto's Notebook) and *external processing* (Generative AI). A static reference sheet stores knowledge the candidate already possesses; a generative model can synthesize solutions the candidate has not yet derived. To grant this accommodation without compromising assessment integrity, we must ensure the tool acts as an **interface for the candidate's reasoning**, not a **substitute for it**.

  Therefore, we treat the AI not as a "calculator" (which solves the problem) but as a "voice-to-code" amplifier (which executes the candidate's verified logic).

  ### **Implementation Conditions**
  To ensure consistency and validity for this and future candidates under this policy, the following conditions apply:

  1.  **Environment Isolation:** The AI tool must run locally or in a sandboxed environment verified by the interviewer prior to the session. No external internet access or general knowledge base updates are permitted during the round.
  2.  **The "Logic-First" Protocol:** The candidate must verbally articulate the logic, approach, and edge-case handling for any code block *before* invoking the AI to generate or complete it. If the AI output deviates from the stated logic, the candidate must identify and correct the discrepancy.
  3.  **Rubric Adjustment:** Interviewers will evaluate the candidate based on **code review and direction** rather than raw implementation speed. Errors made by the AI that the candidate fails to catch will be scored as candidate errors.
  4.  **Safety Valve:** The interviewer retains the discretion to pause AI usage if the tool's output obscures the candidate's contribution, reverting to a standard shared-editor mode for specific sub-tasks.

  ### **Timeline**
  *   **Immediate:** This policy is applied to the scheduled candidate interview next week.
  *   **30 Days:** The Working Group will review the interview data and interviewer feedback to refine the "Logic-First Protocol" into a permanent addendum to the Engineering Accommodation Handbook.
  *   **90 Days:** We will evaluate whether this accommodation should be expanded to all candidates (normalizing AI use) or kept strictly as a disability accommodation.

  ### **Strongest Objection & Risk Assessment**
  The most significant objection to this decision—and the one we must monitor closely—is **Signal Contamination.**

  Even with the "Logic-First" protocol, there is a risk of a **False Positive**. A candidate with strong prompting skills but weak engineering fundamentals might direct the AI to a working solution without truly understanding the underlying complexity, time/space trade-offs, or failure modes. In a standard interview, a candidate who cannot implement their own logic is quickly identified; with an AI assistant, that gap can be masked.

  We accept this risk because the alternative (denying the tool) presents a **False Negative** risk: rejecting a highly capable senior engineer because the assessment method penalizes their neurodivergence rather than measuring their actual job performance. By shifting the assessment focus to *verification* and *direction*, we align the interview closer to the actual day-to-day work of a Senior Engineer, with or without a disability.

  ***

  **Action Item:** Interviewers for this candidate will be briefed on the "Logic-First Protocol" 48 hours prior to the session.
