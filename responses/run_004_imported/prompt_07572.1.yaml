          *   Al-Ghazali = Metaphysical/Theological claim (secondary causes don't *actually* do anything to preserve Divine Omnipotence/voluntarism).
          *   Conclusion: Hume = Epistemology of causation; Ghazali = Metaphysics of divine omnipotence.
      *   **Specific Questions for Feedback:**
          1.  Am I overstating the gap?
          2.  Is it fair to read Ghazali as making a full metaphysical denial (occasionalism) vs. a dialectical move (just opening room for miracles)?
