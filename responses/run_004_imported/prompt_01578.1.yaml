answer: |-
  The sky was no longer a tapestry; it was a wall.

  Kael stood before the observation blister of Station *Anchor*, looking out into the deep dark. There were no spirals here, no distant smudges of violet or gold. The expansion had done its work over the last eons. Everything beyond the Local Group had slipped past the cosmic horizon, redshifted into invisibility, causally severed. The universe had shrunk to the handful of merged galaxies gravitationally bound to *Anchor*, floating in a sea of nothing that stretched forever.

  It was the perfect vacuum. The perfect void. It was the experiment Newton had imagined, and Mach had dismissed, finally realized by the indifference of cosmology.

  Kael turned from the window to the workbench. There, suspended in a magnetic lock, was the apparatus. Two tungsten spheres, each the size of a human head, connected by a slender cord of carbon nanotube filament. It was a crude recreation of the thought experiment from the old texts. The *Principia*. The Scholium.

  "Record," Kael said. The station's AI hummed, a sound that felt too loud in the silence.

  "Logging," the AI replied. "Experiment 9,402. Inertial reference test."

  Kael engaged the manipulators. They gripped the spheres. With a precise torque, Kael set them spinning around their common center of mass. The spheres became blurs. The cord, initially slack, snapped straight.

  Kael watched the telemetry. Tension: 45 Newtons. Centripetal acceleration: consistent.

  It behaved exactly as Newton had predicted. The water in the bucket would have climbed the walls. The cord pulled tight. There was rotation.

  But Kael's hand hovered over the console, trembling slightly. The numbers were clean, but the meaning was muddy.

  If Leibniz were right, space was nothing but a order of coexistences. A name for the distance between things. If Mach were right, inertia was not an inherent property of matter, but a result of interaction with the total mass of the universe. The "fixed stars" provided the anchor. When you spun, you were spinning relative to the bulk of creation.

  But the bulk of creation was gone.

  Kael looked back at the window. The Local Group was massive, yes, but it was a pebble compared to the web that had vanished. If inertia was relational, the tension in that cord should have dropped. The spheres should have felt lighter, lazier, as if the universe had forgotten how to resist their motion. If the reference frame had evaporated, surely the force should have too.

  Yet the filament hummed. The tension held steady.

  Kael walked to the apparatus and placed a hand on the containment field. The vibration buzzed through the glove, into the bone. It was a physical insistence. *I am spinning,* the apparatus said. *Something is pushing back.*

  "Is it space?" Kael whispered to the dark. "Or is it just the ghost of the stars we can't see?"

  If Newton was right, space was a substance, a stage that existed even when the actors left. It had structure. It had rigidity. That rigidity was what pulled the cord tight. The void itself was resisting the spin.

  If Mach was right, then this tension was a phantom. Perhaps the gravitational influence of the vanished galaxies traveled slower than light, or perhaps the metric of spacetime held a memory of the mass that had shaped it. Or perhaps, Kael thought with a chill, Mach was simply wrong about the dependency. Perhaps matter speaks to space, but space speaks for itself.

  Kael disengaged the spin. The spheres slowed, the tension bleeding away until the cord hung loose again.

  The silence returned, heavier than before.

  Kael opened a new log entry. The assignment for the anthology back on Earth—a planet now frozen and uninhabited—had been to find truth. But truth here felt like a choice.

  If Kael wrote that the experiment proved Absolute Space, it was a lie. The experiment only proved resistance. It proved that *something* distinguished rotation from rest. But was that something a real entity, a substantival field? Or was it a relation to the hidden, horizon-locked mass of the dead universe?

  The physics didn't change. The cord tightened. But the ontology—the *whatness* of the thing—remained hidden behind the horizon.

  Kael typed, the keys clicking softly.

  *Observation: Inertial forces persist despite causal isolation from the extragalactic mass.*
  *Conclusion: The distinction is unverifiable.*

  Kael paused. That was the coward's answer. The prompt demanded a position.

  Kael looked at the loose cord. Then at the dark sky.

  To say space was nothing but relations felt like denying the vibration still ringing in Kael's fingertips. The resistance was local. It was here. It didn't care about the galaxies beyond the horizon. To deny the reality of the force because the source was ambiguous was to deny the only thing that was actually tangible.

  But to say space was a "thing" felt like worshiping a ghost.

  Kael typed again, slower.

  *Position: Pragmatic Substantivalism.*

  *Reasoning: Whether space is a substance or a relation of hidden matter, the effect is identical. The vacuum resists. It has properties. It has structure. For an observer alone in the dark, the difference is semantic. The resistance is the reality.*

  Kael saved the file. It wasn't a solution. The philosophers back in the era of light had argued for centuries and died without knowing. Kael would die without knowing. The horizon kept its secrets.

  But as Kael turned off the workbench lights, leaving only the glow of the instrument panels, the station felt different. The void outside wasn't just an absence anymore. It was a presence. It was the thing that had held the cord tight when there was nothing else left to hold it.

  Kael touched the window again. The dark pressed back.

  "Okay," Kael said to the empty room. "You're real enough."

  The station drifted, silent and spinning slowly on its axis, held in place by a space that might have been a thing, or might have been a memory, but which held them all the same.
