      *   **Friend's Position:** Standard Decision Theory (Expected Utility Theory - EUT). Risk aversion beyond DMU is irrational (violates Independence Axiom), leads to money pumps, and is a bias (like in Allais Paradox).
      *   **User's Position:** Risk aversion beyond DMU can be rational. Cites Lara Buchak's *Risk-Weighted Expected Utility* (REU) theory.
