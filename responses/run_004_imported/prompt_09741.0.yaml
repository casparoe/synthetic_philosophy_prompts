answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague from the lab, which means I spend my days arguing with [Honoree's Name] about solvents, safety goggles, and the structural integrity of seventeenth-century varnish.

  Forty years is a long time to do anything. It is an especially long time to tell people they are wrong about things they love.

  There is a story that circulates about [Honoree's Name], particularly among the donors and the board. It's a romantic story. It says that she possessed a mystical "eye for beauty." That she could walk into a gallery, sense a disturbance in the aesthetic force, and point a gloved finger at a masterpiece, whispering, *"That is a lie."* It suggests she spent four decades protecting the world's beauty from the ugliness of deception.

  It is a lovely story. It is also, according to [Honoree's Name], complete nonsense.

  The truth is less magical and significantly more abrasive. [Honoree's Name] did not protect beauty. You cannot protect beauty with a gas chromatograph. You protect beauty by looking at it. What she protected was *provenance*. She protected the ledger. She protected the credit owed to a dead artist who couldn't defend their own signature.

  She has argued for years—and I know this makes some of the art historians in the room shift uncomfortably in their chairs—that a perfect forgery possesses the exact same aesthetic value as the original. If you put a flawless fake next to a real Vermeer, and you strip away the names and the price tags, the beauty is identical. The only thing that changes when she declares a work "fake" is not the visual experience, but the bank account and the history book.

  I remember a specific incident about fifteen years ago. We had a landscape on the table, purported to be from the 1840s. It was breathtaking. Sunlight on water. I remember a trustee weeping in front of it during a private viewing. It was, by every metric of human emotion, a beautiful object.

  [Honoree's Name] took a micro-sample. She found a pigment that wasn't commercially available until 1920.

  The painting didn't change. The light on the water was still breathtaking. The trustee, however, suddenly found it very ugly. The beauty hadn't evaporated; the value had.

  [Honoree's Name] looked at the report and gave us one of her favorite lines, which I know is printed on her mug at home: *"The eye can't convict a fake; only the paint chip can."*

  She wasn't in the business of guarding the sublime. She was in the business of guarding the truth. And let me tell you, the truth is often much less convenient than beauty. Beauty asks you to feel; truth asks you to admit you've been duped.

  For forty years, she has been the person in the room willing to ruin the magic trick by explaining how the rabbit got into the hat. She knew that if we value art only for its history and its honesty, then a lie is a crime, even if it's a beautiful lie. That is a harder, colder, and ultimately more honest mission than simply being a "guardian of beauty."

  It requires a specific kind of integrity to tell a room full of passionate people that the object of their affection is a fraud, not because it lacks soul, but because it contains the wrong shade of titanium white.

  So, we are not here to toast a woman who had a magical eye for art. We are here to toast a woman who had a relentless eye for evidence. A woman who understood that while a forgery might satisfy the soul, it steals from the past.

  [Honoree's Name], you have spent four decades telling us that what we see is not always what we get. You have taught us that chemistry is the only unbiased critic in the room. And you have done it without ever pretending that science was poetry.

  May your retirement be filled with genuine articles, authentic experiences, and absolutely no need for X-radiography.

  To [Honoree's Name]!
