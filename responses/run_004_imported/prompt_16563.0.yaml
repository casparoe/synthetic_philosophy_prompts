          *   *The "Copy" Problem:* If the original dies and the copy starts, is there continuity of *consciousness*? Ayer was an empiricist. He can't verify the "inner light" of the upload.
          *   *Verdict:* He would likely treat "I survived" as a statement about the continuity of the *series of experiences*. If the upload continues the series, it might be "survival" in a pragmatic sense, but the metaphysical claim "my soul moved" is nonsense. However, the *gap* (death of body, start of upload) breaks the empirical continuity.

      *   **Scenario C: The Problem of Other Minds (The "Is anyone home?" question).**
          *   Ayer knows we can't verify other minds directly. We infer from behavior.
