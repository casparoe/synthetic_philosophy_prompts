      *   *Step 5: The "Hard Problem" (Qualia).* Ayer was an empiricist. He cares about sense data. An upload has no sensory organs. Can it have sense data? If not, it's not a person in Ayer's sense.
      *   *Conclusion:* He would likely dismiss the metaphysical hype but might accept a pragmatic definition of survival if empirical continuity is maintained, while remaining agnostic/skeptical about the "inner experience" of the digital entity.

