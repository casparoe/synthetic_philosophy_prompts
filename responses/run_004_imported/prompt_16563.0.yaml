      *   **The Verification Principle:** A statement is cognitively meaningful only if it is either analytically true (tautology) or empirically verifiable. Metaphysical claims (God, Soul, Absolute) are literally meaningless (nonsense), not false.
      *   **Personal Identity (The "Bundle Theory" / Humean view):** Ayer followed Hume. There is no immutable "self" or "soul." The self is a logical construction of sense data and memories. Continuity of memory and character is what constitutes identity.
      *   **The Problem of Other Minds:** How do we know others have experiences? We infer it from behavior.
      *   **The NDE Context:** He admitted the experience shook his *confidence* but didn't change his *logic*. He maintained the experience was subjective.

  3.  **Apply Ayer's Framework to the Scenarios:**

