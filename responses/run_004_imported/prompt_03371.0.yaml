answer: |-
  This is one of the most famous and difficult problems in moral philosophy, so first: you were not "kidding yourself" in the sense of being uniquely confused. You are grappling with the tension between **utilitarianism** (maximizing overall good) and **deontology/rights-based ethics** (inviolable rules about individuals), complicated by the question of **moral status**.

  Your grad student is channeling the philosopher Peter Singer, whose 1975 book *Animal Liberation* essentially made the argument you're wrestling with: if suffering is the metric, species is as irrelevant as race. This is the argument for "equal consideration of interests."

  However, there *are* principled arguments for distinguishing humans from animals, though none are without controversy. Since you're reading philosophy for fun, I'll lay out the three main defenses used to justify the distinction you made in your career, along with their counter-arguments.

  ### 1. The Moral Agency Argument (Kantian/Contractualist)
  **The Principle:** Morality is a system of rules agreed upon by rational agents who can understand duties and rights. Humans are "moral agents"; animals are "moral patients."
  **The Justification:** We cannot experiment on humans without consent because humans are members of the moral community who can claim rights. Animals cannot participate in the moral contract, so they do not possess rights in the same way, only protections we grant them out of benevolence.
  **The Weakness:** The "Argument from Marginal Cases." What about humans who *lack* rational agency (infants, the severely cognitively disabled, the comatose)? We still forbid experimenting on them, even though they have less cognitive capacity than a primate. If you protect a disabled human but not a smart pig, you are arguably being speciesist, not rational.

  ### 2. The "Sanctity of Human Life" / Intrinsic Value Argument
  **The Principle:** Human life has a unique, intrinsic value that is not reducible to cognitive capacity or utility.
  **The Justification:** This is often rooted in religious or humanist traditions positing that humans have a special status (e.g., *Imago Dei* or simply "human dignity"). Because of this status, humans are "ends in themselves" and cannot be used merely as means to an end (Kant's Categorical Imperative). Animals, while deserving of humane treatment, can be used as means to human ends.
  **The Weakness:** From a secular, physiological perspective (your home turf), this is hard to ground. Biologically, the differences are of degree, not kind. If you can't point to a specific biological trait that grants "dignity," this argument can feel like circular reasoning: "Humans matter more because they are human."

  ### 3. The Gradient View (Sliding Scale of Moral Status)
  **The Principle:** Moral status isn't a binary switch (0 or 1); it's a gradient based on capacities like sentience, self-awareness, autonomy, and conception of the future.
  **The Justification:** This is likely where your intuition rested. A human has a complex understanding of their future, deep social bonds, and autonomy. Killing or harming a human destroys a much richer "world of experience" than harming a rat. Therefore, the threshold for overriding a human's interest is effectively infinite, while the threshold for a rat is high (must be for vital health needs) but surmountable.
  **The Weakness:** It requires making arbitrary cut-off lines. At what cognitive level does an animal become "off limits"? And does this justify experimenting on humans with diminished capacity? (Most ethicists say no, which brings us back to the Marginal Cases problem).

  ### So, was it self-deception?
  Philosophically, the answer is: **It depends on which framework you prioritize.**

  *   **If you are a strict Utilitarian:** Your grad student is right. Suffering is suffering. If the math works for humans, it should work for animals. If you reject it for humans, you should reject it for animals.
  *   **If you are a Contractualist or Rights-Theorist:** You are right. Humans have a special status (either through rationality or community membership) that creates a "protective ring" around them that animals do not have.

  Most working scientists operate on a **modified Gradient View**. They acknowledge animals have moral weight (hence anesthesia, IACUC protocols, the "3 Rs" of Replacement, Reduction, Refinement), but they assign humans a significantly higher weight.

  ### A Thought for Your Retirement Reading
  You might find the work of **Elizabeth Anderson** or **Martha Nussbaum** interesting. They move away from the "calculation" model. Nussbaum's "Capabilities Approach" argues that we should look at what allows a creature to flourish in its own way. We owe it to a rat to let it be a rat, and a human to be a human. Sometimes those flourishings conflict. When they do, we have to make tragic choices.

  **The Verdict:**
  You weren't necessarily kidding yourself. You were operating under a widely held ethical framework that prioritizes human rights while acknowledging animal welfare. However, your grad student correctly identified that this framework is not logically airtight. It relies on a premise (human exceptionalism) that is morally powerful but biologically fuzzy.

  The fact that this bothers you now is a good sign. It suggests you took the cost of your work seriously. The "resolution" isn't finding a perfect logical formula that absolves you; it's accepting that moral life involves tragic trade-offs where you must choose between competing values (human health vs. animal suffering) without a clean mathematical answer. You chose to prioritize your own species. That is a defensible ethical position, provided you acknowledge the cost, which you clearly do.
