      *   **Relational/Ethics of Care:** Focuses on relationships and community. We have stronger duties to our own kind.
      *   **Sliding Scale/Moral Status:** Moral status isn't binary (0 or 1) but gradient based on cognitive capacities (sentience, self-awareness, autonomy).

  3.  **Evaluate the "Principled Answers":**
      *   *Is there a consensus?* No. Philosophy doesn't offer a single "correct" answer like physiology might.
      *   *Are there defensible positions?* Yes. Both sides (Singer's equality vs. Human Priority) have robust arguments.
      *   *The "Human Exceptionalism" Argument:* Based on cognitive capacity (autonomy, rationality, moral agency). Counter-argument: Marginal Cases (infants, cognitively disabled humans).
      *   *The "Social Contract" Argument:* Humans are part of a moral community; animals are not. Counter-argument: This feels like a "might makes right" club.
      *   *The "Graduated Moral Status" Argument:* Humans have *more* moral weight due to complex capacities, but animals still have *some*. This allows for animal research under strict regulation but forbids human research.

