      *   **Utilitarianism (Peter Singer):** Argues for equal consideration of interests. If suffering is comparable, species doesn't matter. This supports the grad student's view.
      *   **Deontology/Rights (Tom Regan, Kantian views):** Animals have inherent value or rights, but humans might have *different* or *more* rights due to rationality, autonomy, or moral agency.
