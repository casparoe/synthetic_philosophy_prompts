      *   **Point 3: Why Trading Still Happens (The Grossman-Stiglitz Resolution).**
          *   **Hedging:** Someone might bet against a trial not because they think it will fail, but because they hold stock in the sponsor and want to hedge.
          *   **Noise/Liquidity:** Some participants are just gambling or providing liquidity for fees.
          *   **Difference of Opinion:** Even with the same data, priors differ.
          *   **Time Horizon:** Someone might need cash now; someone else can wait.
          *   **Market Makers:** They don't necessarily have a view on the outcome; they profit from the spread. If the user lifted a market maker's offer, the MM is just neutralizing inventory, not necessarily betting against the user's thesis (though they manage risk).

  5.  **Drafting the Response (Iterative refinement):**

