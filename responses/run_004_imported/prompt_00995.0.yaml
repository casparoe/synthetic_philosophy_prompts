          *   In a liquid market, the person on the other side isn't always a random gambler. It could be a market maker adjusting risk, or another expert.
          *   If the order filled *instantly* and was *large*, it suggests the user might have been "lifting" stale liquidity or the market had already priced in the risk the user thought was an edge.
