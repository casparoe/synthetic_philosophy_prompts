  *(Self-Correction Note)*: Make sure Kripke's argument is nuanced. Kripke's unpublished remarks suggest that if computation is deduction in a formal system, and we accept standard logic, CTT is a theorem. Vance should present this as a strong logical constraint. Thorne should challenge the premise that physical processes must map to FOL deductions.

  8.  **Final Polish:** Check pacing and dialogue tags. Ensure the ending feels resolved enough to be satisfying but open enough to reflect the ongoing philosophical debate. (Proceed to generate output).

  *(Post-Drafting Thought)*: I need to make sure the distinction between the "Mathematical CTT" (about effective procedures) and "Physical CTT" (about what physics allows) is clear, as that's the crux of their disagreement. Vance defends the former as primary; Thorne argues the latter is the scientifically relevant one.

