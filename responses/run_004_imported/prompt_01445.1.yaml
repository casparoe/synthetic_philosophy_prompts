      *   *Pro-Empirical:* Let's call him **Prof. Marcus Thorne**. He is grounded in physics, cosmology, and the possibility of exotic scenarios. He sees computation as something implemented in the world.
      *   *Setting:* A quiet corner of a conference hall or a university office. Let's go with a post-panel discussion in a university lounge. It allows for a relaxed but intense atmosphere.

  3.  **Drafting - Section by Section:**

