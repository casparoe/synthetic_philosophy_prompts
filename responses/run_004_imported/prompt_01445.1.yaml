answer: |-
  **Setting:** *A quiet corner of the faculty lounge at the Institute for Logic and Computation. Rain taps against the high windows. Two coffee cups sit on the table between them. Dr. Elena Vance leans forward, hands clasped. Prof. Marcus Thorne leans back, staring into his black coffee.*

  **Vance:** You conceded too much in the panel, Marcus. When you called the Church-Turing Thesis a "working hypothesis," you treated it like Boyle's Law. It isn't. It's closer to a definition.

  **Thorne:** And you treated it like a tautology, Elena. But definitions don't have consequences for physics. If the Thesis is merely a stipulation about what we choose to call "effective," then it tells us nothing about what the universe can actually do.

  **Vance:** It tells us everything about what can be *calculated*. That's the point. Turing didn't survey machines; he surveyed the concept of computation itself. He analyzed the limitations of a human computer working with paper and pencil. The bounded attention, the discrete symbols, the local transitions. These aren't physical contingencies; they are constitutive of what it means to follow an algorithm.

  **Thorne:** But that's exactly where the slide happens. You move from "what a human can do" to "what any machine can do." Turing's analysis is compelling for humans, sure. But why must a physical device be bound by the limitations of a human clerk? When Gandy generalized Turing's argument to mechanical devices, he introduced axioms. "Finite velocity of propagation," "bounded change." Those sound suspiciously like empirical claims about our local spacetime.

  **Vance:** They are necessary conditions for *causal determinacy*. If a machine could change an unbounded amount of state in a single step, or if signals propagated instantaneously, you wouldn't have a step-by-step procedure. You'd have magic. Gandy showed that any deterministic device satisfying those local causality conditions reduces to a Turing machine. It's a structural theorem, not a physics experiment.

  **Thorne:** Structural relative to what? Relative to a universe where there is a minimum length scale and a maximum signal speed. Gandy's axioms presuppose a discrete state space and a bound on density. What if the universe is continuous? What if the laws of physics allow for operations on real-valued quantities with infinite precision?

  **Vance:** Then you aren't talking about *effective* calculability anymore. You're talking about analog measurement. To use a real-valued quantity, you have to prepare it, and to read it, you have to measure it. Once you require the input and output to be communicable—statable in a finite language—you're back to discrete symbols.

  **Thorne:** Communicable to whom? To a human? Why is the human the bottleneck? This brings me to the convergence argument you love. You point to the fact that Turing machines, lambda calculus, and general recursive functions all define the same class of functions. You say this robustness proves it's a natural mathematical kind.

  **Vance:** It proves it's the correct *explication* of the intuitive concept. Church, Turing, and Kleene were carving the same conceptual terrain from different angles. When three distinct analyses of "effective procedure" yield the same extension, it confirms we've captured the concept, not that we've stumbled upon an empirical law.

  **Thorne:** Or, it confirms that all three formalisms implicitly baked in the same physical biases. They were all developed by humans, in this universe, thinking about processes that unfold in time. The convergence is evidence that these formalisms are equivalent, yes. But that they exhaust *physical* computability? That's an inductive leap. It's like saying all birds fly, so flight is definitional to birds, ignoring the penguin. Or rather, ignoring the hypercomputer.

  **Vance:** Ah, the hypercomputer. You're going to bring up Malament-Hogarth spacetimes, aren't you?

  **Thorne:** I am. In certain relativistic spacetimes, an observer can travel along a worldline such that they experience finite proper time, while witnessing another worldline that extends to infinite proper time. I can set a Turing machine running on the infinite path to check for a contradiction in ZFC. If it finds one, it sends a signal. I wait an hour on my path. If I get the signal, I know ZFC is inconsistent. If I don't, I know it's consistent. I've decided the Halting Problem.

  **Vance:** You haven't *computed* the answer. You've *observed* it. There is a crucial epistemic distinction here. In a Turing computation, the process generates the result. In your Malament-Hogarth scenario, the result is generated by an infinite physical process that you cannot replicate, verify, or survey. You have access to an oracle, not an algorithm.

  **Thorne:** But the oracle is physical! It's built into the geometry of the universe. If the laws of general relativity permit such spacetimes, then the Physical Church-Turing Thesis is false. The set of functions computable by physical systems is larger than the set of Turing-computable functions.

  **Vance:** Kripke put this to bed, though. His argument is often overlooked. If we require that each step of a computation be logically statable—specifically, definable in first-order logic—then the Church-Turing Thesis follows from Gödel's Completeness Theorem. If a function is computable by a process whose steps are first-order definable, it is recursive.

  **Thorne:** Kripke's argument rests on a massive premise: "If each computational step is required to be statable in first-order logic." Why must physics be statable in first-order logic?

  **Vance:** Because if it isn't, it isn't intelligible as a computation. Computation is the manipulation of symbols according to rules. Rules must be expressible. If the "rules" of your Malament-Hogarth machine rely on the global topology of a spacetime manifold that cannot be finitely described or locally verified, it falls outside the domain of effective procedure.

  **Thorne:** "Intelligible" is doing a lot of work there. You're defining computation as "what humans can understand step-by-step." I'm defining it as "what physical systems can evolve to produce an output." If the universe can solve the Halting Problem via relativistic geometry, then the Thesis is an empirical falsehood, regardless of whether a human can trace the steps.

  **Vance:** But then you've changed the subject. You're talking about *physical solvability*, not *effective calculability*. The Church-Turing Thesis is about the latter. It's about the notion of an algorithm. An algorithm must be finite, deterministic, and surveyable. Your relativistic machine is none of those things. It relies on an infinite trajectory compressed into a finite observation.

  **Thorne:** But why privilege the algorithmic? In the 1930s, we cared about algorithms because humans did the math. Now, we care about what nature can do. If nature can compute non-recursive functions, then the Thesis, in its physical guise, is a contingent claim about the computational power of our specific corner of the multiverse. It's falsifiable. If we ever construct a device that exploits quantum gravity or relativistic time dilation to outcompute a Turing machine, the Thesis dies.

  **Vance:** And if you do, we will simply say you've built an oracle machine. We won't say you've found a counterexample to the analysis of *effective* procedures. We'll say you've expanded the physical resources available to the computer. Turing's analysis holds for the *procedure* part. You're adding a *physical oracle* part. The Thesis remains true about the algorithmic component.

  **Thorne:** That feels like retreating into a fortress. "If you find a counterexample, I'll just say it doesn't count as 'effective'." It makes the Thesis unfalsifiable, which suggests it's not doing scientific work.

  **Vance:** It makes it conceptual, which suggests it's doing philosophical work. Look at the convergence again. If it were empirical, we'd expect discrepancies. We'd expect lambda calculus to capture slightly more than recursive functions, or Turing machines to miss something. But they lock together perfectly. That lock isn't physical; it's logical. It suggests we've found the boundary of the concept of "finite method."

  **Thorne:** They lock together because they were all born of the same intellectual climate, constrained by the same implicit physical assumptions. Discrete symbols. Finite memory access per step. Local causality. These are the physics of the mid-20th century computer, projected onto logic.

  **Vance:** They are the logic of *finitude*. And unless you are willing to argue that the infinite can be traversed effectively—not just observed, but traversed—then the Thesis stands. Your Malament-Hogarth observer doesn't traverse the infinite; they wait for it to pass them by.

  **Thorne:** *Sips coffee.* I suppose we're stuck on the definition of "traverse."

  **Vance:** And the definition of "physical." You want the Thesis to be about the laws of nature. I maintain it's about the laws of thought, insofar as they govern calculation.

  **Thorne:** Then perhaps we should stop calling it the Church-Turing *Thesis*. If you're right, it's the Church-Turing *Definition*. If I'm right, it's the Church-Turing *Conjecture*.

  **Vance:** Agreed. But until your hypercomputer is built and verified—and until you can show me that its operation is effectively statable and not just physically observable—I'll stick with Definition.

  **Thorne:** And until you can prove that the speed of light and the discreteness of state are logical necessities rather than contingent facts, I'll stick with Conjecture.

  **Vance:** *Smiles.* Well, at least we agree that the next round of coffee is on the loser of the next panel.

  **Thorne:** *Stands up.* I'll start saving my grant money. I have a feeling general relativity is going to be on the syllabus.

  **Vance:** And I'll be reviewing Gödel. See you there, Marcus.

  *Thorne nods and walks toward the door. Vance watches him go, then looks down at her notes, tracing the outline of a Turing machine tape, wondering if the squares are truly discrete, or just small enough to fool her.*
