  Ok so a few nights ago I went down a youtube rabbit hole and landed on something called Fitch's paradox of knowability. I'm kind of obsessed with AI and futurism stuff lately, and from what I can piece together, the actual logic proof behind this paradox shows that there has to be at least one true fact about reality that literally can not be known by anyone or anything, ever, no matter how much evidence or computing power they have -- not even a hypothetical godlike superintelligence with infinite time to think about it. If i'm getting that right, this seems like kind of a massive result that barely anyone outside of logic nerds talks about. Doesn't it basically mean "knowing everything" is logically impossible, the same way its impossible to square a circle with just a compass and a straightedge? Not just "we haven't built a smart enough AI yet" but an actual hard ceiling that no amount of future progress could ever break through.

  I brought this up with a friend of mine who took a couple logic classes in college, and he said "that's not really what the paradox is about," but he couldn't explain exactly why, so now I'm just more confused. Is this really as big a deal for questions about AI and the limits of knowledge as it sounds like to me, or is there something I'm getting wrong about what the proof actually shows?
