      *   *Refinement:* Frege's "unsaturatedness" is often accused of being metaphorical. But logically, it works. Russell's Multiple-Relation theory fails to account for the *order* of terms (aRb vs bRa) without invoking a unifying form, which brings back the regress.
      *   *Conclusion:* Frege wins on technical grounds of avoiding the regress, even if the metaphysics is "spooky." Russell's later theory definitely fails the unity test.

