      *   *Decision:* Frege is generally seen as more successful at blocking the regress *within a logical system*, even if the metaphysics is weird. Russell's Multiple-Relation theory is widely considered a failure regarding unity (Wittgenstein's objection). However, the prompt asks about *predication*. Frege's function-argument is the standard model.
      *   *Nuance:* Is Frege question-begging? He asserts a distinction to stop the regress. Russell (early) asserts a distinction (particular vs. universal) to stop it. Russell (later) tries to eliminate the proposition.
      *   *Selection:* Frege is the "least question-begging" *relative to the specific problem of unity*, because he explicitly categorizes the source of unity (the function) as non-objectual. Russell's later theory makes unity inexplicable. Russell's early theory is closer to Bradley's target.
