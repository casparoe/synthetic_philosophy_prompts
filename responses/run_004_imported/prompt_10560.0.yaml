answer: |-
  This is a sophisticated dispute that cuts to the heart of early analytic metaphysics. To offer a disinterested opinion: your dinner argument likely stalled because you were both partially right. Bradley's regress and the problem of the unity of the proposition are *structurally isomorphic*, but they are *teleologically distinct*. Treating them as identical obscures the fact that Bradley was attacking the intelligibility of relations *simpliciter*, whereas Frege and Russell were attempting to secure the possibility of truth and falsehood.

  Here is an analysis of how each thinker handles the difficulty, followed by a judgment on whose treatment of predication is least question-begging.

  ### 1. The Structural Identity vs. Teleological Divergence

  Bradley's regress (from *Appearance and Reality*, 1893) is an ontological argument. It posits that if a relation $R$ is a distinct entity from its terms $a$ and $b$, then $R$ requires a further relation $R'$ to connect it to $a$, and so on *ad infinitum*. Bradley's conclusion is monistic: relations are unintelligible, and therefore reality is one indivisible Absolute.

  The problem of the unity of the proposition, as confronted by Frege and Russell, is logico-semantic. It asks: What distinguishes the proposition "Socrates is wise" from the mere list "Socrates, wisdom"? The proposition has a truth-value; the list does not.

  While the structure is the same (how do parts constitute a unified whole without an infinite chain of connectors?), the stakes differ. Bradley wants to show that *nothing* holds together. Frege and Russell need to show that *propositions* hold together, even if the world does not. Conflating the two risks missing that Frege and Russell are willing to accept "brute" logical facts to save logic, whereas Bradley is not.

  ### 2. Frege: Unsaturatedness as a Category Stopper

  Frege's solution is to deny the premise that generates Bradley's regress. For Bradley, a concept (or universal) is a term that needs relating to an object. For Frege, a concept is fundamentally *not* a term. It is a function.

  In "Function and Concept" (1891) and later works, Frege argues that concepts are "unsaturated" (*ungesättigt*). An object is saturated; a concept has a gap. When an object fills the gap, unity is immediate. There is no need for a "copula" or a further relation to glue the function to the argument, because the function is defined by its need for completion.

  **Does this dissolve the regress or relocate the mystery?**
  It dissolves the regress by changing the logical grammar, but it arguably relocates the mystery into metaphysics. Critics (like Bradleyans or even later Wittgenstein) argue that "unsaturatedness" is a metaphor that masks a brute fact. To say "the concept needs completion" is to say "it unifies without a unifier." If one asks, "But what *is* an unsaturated entity?", Frege has no answer other than "it is what a predicate refers to."

  However, Frege's move is principled. He introduces a **type distinction**. Bradley's regress arises when we treat relations as objects (terms). Frege bans this category mistake. By asserting that functions and objects are logically heterogeneous, he makes the demand for a connecting relation illegitimate. You cannot relate a function to an object in the same way you relate an object to an object. Thus, the regress is blocked not by fiat, but by a rule of logical syntax.

  ### 3. Russell: From Complexes to Multiple Relations

  Russell's trajectory shows the difficulty of avoiding Bradley without Frege's radical type distinction.

  **Early Russell (Principia Mathematica era):** Russell initially believed in objective propositions. "Socrates is wise" was a complex entity existing in the world. The unity was provided by the verb (the universal). However, this left him vulnerable to Bradley: if the universal is a constituent, what binds it to Socrates? Furthermore, it created the problem of falsehood: if "Socrates is dead" is an objective complex, and Socrates is alive, does this complex exist?

  **Later Russell (The Multiple-Relation Theory, 1910–1913):** To solve the problem of falsehood, Russell abolished the proposition as a single object. Judgment became a multiple relation between a mind and several objects/universals: $J(m, a, R, b)$. There is no single entity "aRb" that can be false; there is only the mind relating to $a$, $R$, and $b$.

  **Did this meet Bradley's objection?**
  No. In fact, it exacerbated the unity problem. As Wittgenstein famously objected (in his 1913 notes on Russell's theory), if $a$, $R$, and $b$ are merely terms related to a mind, what prevents the judgment from being nonsense? How does the theory distinguish "aRb" from "bRa"? If $R$ is just another term in the list of objects the mind apprehends, it loses its "verb-like" power to unite. Russell treated the relation as a term, which is exactly the move Bradley argued leads to a regress.

  Russell's later theory was designed to solve the **status of falsehood**, not the **unity of the proposition**. It succeeded in making falsehood possible (by removing false propositions from the ontology) but failed to explain how the constituents of a true judgment are unified. It essentially outsourced unity to the mind without explaining how the mind achieves it without falling into Bradley's trap.

  ### 4. The Verdict: Who is Least Question-Begging?

  Between the two, **Frege's treatment is least question-begging**, though it is not without cost.

  **Justification:**
  The charge of "question-begging" applies when a philosopher assumes the truth of what they are trying to prove, or posits a mechanism that requires the very explanation it is meant to provide.

  1.  **Russell's Failure:** Russell's Multiple-Relation theory is highly question-begging regarding unity. It assumes the mind can unite $a$, $R$, and $b$ into a judgment that has the structure "aRb" rather than "bRa" or "aRb-list." But if the mind simply relates to them, we are back to Bradley: what relates the mind to the relation $R$ such that $R$ functions as a connector and not a term? Russell offers no account of how the mind supplies the "form" of the complex without invoking a form that itself needs unifying. He solves falsehood by sacrificing unity.
  2.  **Frege's Success:** Frege avoids the regress by denying that the predicate is a term. This looks like a dodge only if one insists (with Bradley) that everything must be an object. Frege justifies this by reference to the success of mathematical functions. In mathematics, $f(x)$ does not require a third entity to join $f$ and $x$; the application is primitive. By extending this to logic, Frege grounds unity in **logical application** rather than **ontological gluing**.

  Frege's notion of "unsaturatedness" is mysterious, yes. But it is a *categorial* mystery, not a *regressive* one. He admits that we cannot describe the combination of function and argument in language (because language objectifies everything), but he argues this is a limitation of language, not reality. Russell, conversely, tries to describe the combination by breaking it into terms ($J, m, a, R, b$), which inevitably invites the regress.

  ### Conclusion

  Your friend who argued they are the same difficulty is right about the **structure**: both problems arise from treating a unifier as just another thing to be unified. Your friend who argued they are distinct is right about the **aim**: Bradley seeks to dismantle relations, while Frege seeks to ground logic.

  However, on the specific question of who handles predication least question-beggingly: **Frege wins.** He recognizes that predication is *sui generis* and refuses to analyze it into constituent objects. Russell's attempt to analyze judgment into a relation between a subject and objects treats the verb as a noun, which guarantees the failure to explain unity. Frege relocates the mystery into the nature of functions, but Russell relocates it into the nature of the mind, and in doing so, loses the logical structure of the proposition entirely. Frege's mystery is the price of logic; Russell's was the cost of a failed metaphysics.
