answer: |-
  This is a classic late-night SEP (Stanford Encyclopedia of Philosophy) rabbit hole. You have stumbled upon the **Etiological (or Selected-Effect) vs. Causal-Role** debate, famously crystallized by Ruth Millikan on one side and Robert Cummins on the other.

  The reason it feels comic is because you're right: one side is arguing about *history* (what the thing was supposed to do), and the other is arguing about *utility* (what the thing is actually doing right now).

  Here is a joke that should land perfectly with your bio friend. It relies on the specific tension between "Proper Function" (Etiological) and "System Capacity" (Causal-Role), and the classic example of the heart murmur.

  ***

  A heart goes in for its annual performance review. Sitting on one side of the desk is **Evolution**, and on the other side is **The Healthcare System**.

  **Evolution** looks at the clipboard and says, "You pumped blood efficiently all year. You fulfilled your proper function. You're selected for another term."

  **The Healthcare System** looks up and says, "You also made a distinct thumping noise all year. That allowed me to bill for diagnostics. You contributed to my system capacity. You're also promoted."

  The Heart looks nervous. "But wait... the noise is a murmur. I'm leaking. I'm actually kind of broken."

  **Evolution** shrugs. "If you're still pumping, you're not malfunctioning etiologically. History is satisfied."

  **The Healthcare System** shakes its head. "If you stop making noise, I can't diagnose you. If you can't be diagnosed, I can't treat you. In my system, silence is the malfunction."

  The Heart puts its head in its hands. "So, if I stop pumping but keep making noise, what happens to me?"

  **Evolution** says, "You're dead."

  **The Healthcare System** says, "You're tenured."

  ***

  ### Why this works (The "Decoder Ring" for you)

  If your friend asks why it's funny, or if you want to make sure you deliver it with the right weight, here is the breakdown:

  1.  **The Setup:** The "Performance Review" is a metaphor for **Functional Analysis**. Both theories try to evaluate what the organ is *for*.
  2.  **Evolution's Line:** *"You fulfilled your proper function... History is satisfied."*
      *   This references the **Etiological View** (Millikan/Neander). A function is defined by what the trait was *selected for* in the past. As long as it pumps blood (the historical reason hearts exist), it is functioning "properly," even if it makes noise.
  3.  **Healthcare System's Line:** *"You contributed to my system capacity."*
      *   This references the **Causal-Role View** (Cummins). A function is whatever causal contribution a part makes to the containing system. If the "system" is the Healthcare Industry, the heart's noise is a function because it contributes to the capacity of that system (diagnosis/billing).
  4.  **The Punchline:** *"You're dead" vs. "You're tenured."*
      *   **Etiologically:** If the heart stops pumping, it fails its selected effect. The organism dies. It is a **malfunction**.
      *   **Causally:** If the heart keeps making noise, it is still causally contributing to the medical system (allowing doctors to declare death, write reports, etc.). In a purely causal-role account, "function" is relative to the system boundary you draw. If you draw the boundary around the *Hospital* instead of the *Organism*, the heart is still "working."
      *   **The Click:** It highlights the absurdity that the Causal-Role view can make something a "function" even when the organism is dead, provided it's useful to *some* containing system, whereas the Etiological view is tied to the survival/reproduction of the organism.

  Good luck hitting your friend with this. If they groan, you know they understood it.
