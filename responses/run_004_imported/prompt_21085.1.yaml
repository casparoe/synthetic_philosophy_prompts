answer: |-
  This is a remarkably clean dissection of a classic problem in democratic theory. You've essentially recreated a seminar debate in a backyard over beers, and your lab-notebook approach to tracking the moves is the perfect way to handle it. In analytical chemistry, you know that if your sample boundary is wrong, the data is garbage regardless of how precise your titration is. That is exactly what Martin and Carol are fighting over: where to draw the beaker.

  Here is the move-by-move analysis, scoring the argumentative advantage at each step, followed by an assessment of the blind spots and the theoretical dead-end question.

  ### Move-by-Move Analysis

  **Move 1 (Martin): The Constitutive Claim**
  *Argument:* The town vote decides the town's actions. The "demos" is defined by existing legal boundaries. Expanding to "all affected" creates an infinite regress (the whole county, then everyone).
  *   **Advantage: Martin.**
  *   **Why:** From a systems-analysis perspective, Martin identifies a fatal instability in Carol's initial premise. If the rule for voting is "everyone affected," you need a prior rule to decide who is affected, which requires a vote, which requires a boundary... ad infinitum. He correctly identifies that a decision procedure requires a closed system to function. Without a fixed boundary, no vote can ever be convened. He wins on *operational necessity*.

  **Move 2 (Carol): The Externality Claim**
  *Argument:* Legitimacy comes from consent of those bearing costs. Excluding them is "democratic laundering." Boundaries are map artifacts, not moral barriers.
  *   **Advantage: Carol.**
  *   **Why:** She successfully challenges the *legitimacy* of Martin's closed system. Martin assumes the boundary is legitimate because it exists; Carol points out that existence does not imply justification. In your old line of work, if a pipe leaked contaminants into the next property, you couldn't justify ignoring it because the leak stopped at the property line. She wins on *moral intuition* and the reality of externalities. Martin's system is stable, but she shows it might be stably unjust.

  **Move 3 (Martin): The Reductio ad Absurdum**
  *Argument:* If "affected" is the standard, where does it stop? Seasonal workers? Out-of-state buyers? "Affected" is too vague to be a useful variable.
  *   **Advantage: Martin.**
  *   **Why:** This is a strong logical check. He forces Carol to admit that her metric ("affectedness") lacks precision. In analytical terms, he's showing her indicator has no clear endpoint. If the out-of-state buyer is "affected" by price changes, and the Millbrook resident is "affected" by pollution, are they the same class of voter? If not, why? Martin wins on *definitional rigor*. He exposes that "all-affected" is often a slogan, not a workable protocol.

  **Move 4 (Carol): The Arbitrariness Counter**
  *Argument:* A crisp line in the wrong place is worse than a fuzzy one. The 1890s surveyor didn't care about moral affectedness. Martin's precision is false precision.
  *   **Advantage: Carol.**
  *   **Why:** She turns Martin's demand for precision against him. She argues that his "crisp" boundary is actually *noise*—historical residue with no signal regarding the current decision. She concedes she lacks a crisp cutoff but argues his cutoff is *meaningless* rather than just fuzzy. She wins on *historical materialism*. She successfully argues that Martin isn't offering "order," he's offering "arbitrary tradition."

  **Move 5 (Martin): The All-Subjected Patch**
  *Argument:* Shifts criterion from "affected" to "subject to laws." This includes the seasonal crew (present in town) but excludes distant buyers.
  *   **Advantage: Martin.**
  *   **Why:** This is a sophisticated theoretical pivot (known in philosophy as shifting from the *All-Affected Principle* to the *All-Subjected Principle*). It solves the infinite regress of Move 1 and the vagueness of Move 3. It creates a testable condition: Are you legally subject to the town's coercion? It's a much tighter protocol. He wins on *theoretical repair*. He has patched the leak in his vessel.

  **Move 6 (Carol): The Coercion Distinction**
  *Argument:* Millbrook *is* subjected to the town's law in the relevant sense (permits authorize harm with no recourse). The crew can leave; Millbrook can't.
  *   **Advantage: Carol.**
  *   **Why:** This is the knockout punch of the debate. She accepts Martin's new criterion ("subjection") but demonstrates that under *that* rule, Millbrook still qualifies. She distinguishes between voluntary subjection (workers choosing to be there) and involuntary subjection (residents absorbing pollution). She argues that the ability to "exit" the system determines whether you are truly "subject" to it. She wins on *nuanced application*. She shows Martin's patch doesn't actually exclude the people he wanted to exclude.

  **Score:** 3-3 Tie. Martin wins on stability and definition; Carol wins on morality and application.

  ---

  ### What They Are Both Missing

  As a chemist, you know that sometimes the error isn't in the titration, but in the assumption that the sample is homogeneous. Both Martin and Carol are treating "the vote" as a single instrument for all purposes. Here is what is absent from their exchange:

  **1. Functional Boundaries vs. Political Boundaries**
  They assume the boundary for *voting* must be the same as the boundary for *residency*. In modern governance, we often decouple these. Millbrook might not get a vote on the town's school board (a shared good), but they should have legal standing in court regarding the pollution (a specific harm). They are missing the idea of **issue-specific demoi**. The boundary for an environmental decision should be hydrological or atmospheric, not municipal. The boundary for a tax decision should be fiscal. They are trying to use one ruler to measure volume and weight.

  **2. Remedy vs. Franchise**
  Carol assumes the only remedy for being affected is a vote. Martin assumes the only way to vote is to be a member. Both miss the middle ground: **recourse**. Millbrook might not need a ballot if they have a guaranteed right to sue for damages, or if the town is required to purchase an easement from them. In your field, if a test shows contamination, you don't necessarily re-calibrate the whole lab; you trigger a specific mitigation protocol. They are debating the calibration when they should be debating the mitigation.

  **3. The "Second-Order" Problem**
  Neither asks *who decides the boundary*. Martin says "the law does." Carol says "morality does." But in a democracy, the boundary is usually set by a higher authority (the State or Constitution). They are debating a local problem that actually requires a federal or judicial solution. The town shouldn't be setting the boundary for its own expansion; a county or state environmental board should.

  ### Is It a Dead End?

  To your final question: Is the boundary problem a spot where democratic theory runs out of road?

  **Yes and No.**

  **Yes,** if you are looking for a universal, *a priori* formula. There is no mathematical equation that will spit out the "correct" boundary for every democratic decision. If you demand a single, morally perfect boundary for all voting, you will hit a wall. Martin is right that "all-affected" explodes; Carol is right that "all-bounded" is arbitrary. Pure reason cannot solve this because the boundary is ultimately a political act, not a scientific discovery.

  **No,** if you view democracy as a system of error correction rather than a system of perfect legitimacy. Democratic theory survives the boundary problem by **layering**.
  *   **Local boundaries** handle low-impact, high-specificity issues (zoning, schools).
  *   **Regional/State boundaries** handle externalities (pollution, water rights).
  *   **Judicial boundaries** handle rights violations (constitutional protections for Millbrook).

  **The Verdict:**
  Martin is acting like a **Quality Control Manager**: "We need a standard operating procedure, and we need to stick to it, or the lab shuts down."
  Carol is acting like an **Environmental Auditor**: "Your procedure is producing contaminated output, and ignoring the leak doesn't make it go away."

  Your lab experience tells you which one is more dangerous in the long run. Martin's approach keeps the lab running but risks a catastrophic spill. Carol's approach stops the spill but risks paralyzing the lab with endless safety reviews.

  The boundary problem isn't a dead end, but it is a **limit condition**. It signals where local democracy must yield to higher-order regulation. Martin and Carol are stuck because they are trying to solve a regional problem with a municipal tool. The "correct" answer isn't a better argument for who votes in the town referendum; it's an argument that *this specific decision shouldn't be made by a town referendum at all.*

  If I may borrow your terminology: They are arguing over the precision of the pipette, when the problem is that they are trying to measure a river.
