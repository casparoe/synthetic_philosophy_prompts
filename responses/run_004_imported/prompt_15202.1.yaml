      *   *Move 5:* Elena accepts the *reductio* but limits its scope.
      *   *Move 6:* Sam attacks the coherence of that limitation.
      *   *Verdict:* Sam has the better of the exchange because he forces Elena to accept highly counterintuitive claims (extinction is good) while offering a more parsimonious explanation for the shared intuitions.

  8.  **Final Polish:** Check against the prompt requirements.
