answer: |-
  You are absolutely right to be nagged by this. In fact, you have put your finger on one of the most famous and devastating critiques of naive falsificationism, using a case study that every philosopher of science knows but often glosses over too quickly.

  Your neighbor is correct that you aren't missing something "obvious" in the sense of a simple rule you overlooked. You are missing the subsequent forty years of philosophy of science that happened *because* smart people like you realized Popper's initial formulation was too rigid to handle the history of actual science.

  Here is the proper settlement, broken down into three layers: what Popper actually said (which is more nuanced than the textbook version), why the Neptune/Vulcan case breaks the simple version, and the framework that actually solves your puzzle (which your neighbor likely didn't have time to get into).

  ### 1. The "Ad Hoc" Defense (Popper's Nuance)
  The version of Popper you described—"data contradicts theory, drop the theory"—is what philosophers call **Naive Falsificationism**. Popper himself realized this was untenable pretty quickly. He knew that if every anomaly killed a theory, Newton would have been dead within a year of publication.

  Popper's actual criterion for a "scientific save" versus a "pseudoscientific excuse" hinges on **independent testability**.

  When Le Verrier proposed Neptune, he wasn't just saying, "There's a planet." He was saying, "There is a planet *at this specific coordinate* with *this specific mass*." Crucially, this hypothesis increased the **empirical content** of the system. It made *new* predictions that were risky and could be checked without reference to the original anomaly (the Uranus wobble). Galle pointed the telescope, and there it was.

  When Le Verrier proposed Vulcan, he did the same thing mathematically. However, the *degree* of independent testability was different. Vulcan was hypothesized to be so close to the Sun that it could arguably only be seen during eclipses or transits.

  A strict Popperian would argue:
  *   **Neptune:** The rescue hypothesis was highly testable and risky. It was scientific.
  *   **Vulcan:** The rescue hypothesis was testable *in principle*, so it started as scientific. However, as decades passed and eclipses failed to reveal it, the hypothesis had to be modified again and again (smaller, darker, different orbit) to evade detection. *That* is where it slides toward pseudoscience.

  So, the first correction is that Popper's demarcation isn't a stamp you put on a paper the day it's published; it's a judgment on the *trajectory* of the research. But you are still right: in 1846 (Neptune) and 1859 (Vulcan), the papers looked identical. Popper's criterion struggles to distinguish them *at the moment of inception*.

  ### 2. The Real Solution: Lakatos and Research Programmes
  This is the "missing something" that settles the issue properly. Imre Lakatos, a student of Popper's, realized exactly what you pointed out: history shows that great scientists *ignore* falsifications all the time. If they followed Popper's rules, there would be no Newton, no Bohr, and no Le Verrier.

  Lakatos developed the **Methodology of Scientific Research Programmes (MSRP)** specifically to handle the Neptune/Vulcan problem.

  He argued that science isn't done in single theories; it's done in **research programmes**. A programme has:
  1.  **A Hard Core:** The fundamental laws (e.g., Newton's Law of Universal Gravitation). This is treated as irrefutable by the community for the duration of the programme.
  2.  **A Protective Belt:** Auxiliary hypotheses (e.g., the number of planets, their masses, the presence of dust, optical errors).
  3.  **A Heuristic:** A set of problem-solving techniques.

  **The Demarcation Criterion shifts here.** A research programme is scientific if it is **theoretically progressive** (predicts novel facts) and **empirically progressive** (some of those predictions are confirmed). It becomes pseudoscience (or "degenerating") when it only offers post-hoc explanations for anomalies without predicting anything new.

  *   **The Neptune Episode:** The Newtonian programme was **progressive**. The modification to the protective belt (add a planet) led to a *novel* fact (the discovery of Neptune) that was not part of the original problem.
  *   **The Vulcan Episode:** Initially, this looked progressive. But over 50 years, the Newtonian programme regarding Mercury became **degenerating**. They kept adjusting the protective belt (Vulcan's size, orbit, albedo) just to accommodate the existing data (the perihelion precession). They predicted nothing new that was confirmed.
  *   **The Einstein Episode:** General Relativity replaced Newton not because Newton was "falsified" in a Popperian sense (Newton is still good enough for landing probes on Mars), but because Einstein's programme was **more progressive**. It accounted for the Mercury anomaly *plus* predicted light bending, gravitational redshift, etc.

  ### 3. The Verdict on Your Critique
  You asked: *"Doesn't that mean Popper's criterion can only ever sort good science from bad in hindsight... which seems to gut the whole point?"*

  Your intuition is correct. **Demarcation is dynamic, not static.**

  If you hand a philosopher a paper titled "Hypothesis: An Unseen Planet Explains This Anomaly," they cannot tell you if it is science or pseudoscience in that instant. They can only tell you if it is *structured* like science (i.e., does it make independent predictions?).

  The difference between Le Verrier's two moves wasn't in the logic; it was in the **success of the research programme**.
  *   **Neptune** confirmed that the "Newton + Auxiliary Planets" strategy was still a cash cow for new knowledge.
  *   **Vulcan** revealed that the strategy had run out of road.

  The "missing something" your neighbor couldn't articulate is that **falsification is not an event; it is a process.**

  Popper's original idea was a bit too legalistic ("One strike and you're out"). The modern understanding (heavily influenced by Lakatos and Kuhn) is that a theory is scientific as long as it is part of a progressive research programme that takes risks. Le Verrier was doing "good science" both times he proposed a planet. He was not doing pseudoscience when he proposed Vulcan. He was doing science that turned out to be false.

  **Pseudoscience is not being wrong.** Pseudoscience is refusing to acknowledge when your research programme has stopped producing novel predictions and is only engaged in defensive maneuvering. The astronomers eventually admitted the Mercury problem wasn't solved by a planet; they accepted Einstein. That admission is what keeps astronomy scientific. If they were still publishing papers on Vulcan's orbital parameters today, *that* would be pseudoscience.

  ### Summary
  You haven't missed a rule; you've identified the limit of the simplified version of Popper.
  1.  **Naive Falsificationism** (drop theory on anomaly) is historically false and philosophically untenable.
  2.  **Sophisticated Falsificationism** allows for saving theories via auxiliary hypotheses, provided they are independently testable.
  3.  **Lakatos's Research Programmes** explains why the *same move* (add a planet) was virtuous in 1846 and futile in 1890. It wasn't about the move; it was about whether that move led to new knowledge or just patched old holes.

  As an observer, you know better than anyone that data is messy. Philosophy of science eventually caught up to what practitioners like you always knew: science isn't about proving things true or false in a single stroke; it's about which errors lead to new discoveries and which lead to dead ends. Le Verrier's genius wasn't that he was right about Vulcan; it was that he was playing a game where being wrong about Vulcan was a permissible, and necessary, step to finding General Relativity.
