answer: |-
  Good morning.

  When our robotics team was building our competition bot last fall, we wrote some computer vision code. It was supposed to identify a specific target on the field so the arm could score points. It worked perfectly. But one afternoon, during a lab period, our capstone teacher asked us a quiet question: "What else could this code identify?"

  We looked at the screen. The code didn't know it was looking for a game piece. It just looked for contrast, for shape, for location. With a few tweaks, the logic that scored points could track something else. Someone else. In that moment, the "ingenuity" we were so proud of felt a lot less like a superhero origin story and a lot more like a responsibility we hadn't asked for.

  That feeling is exactly what the mathematician John von Neumann wrote about in 1955. He asked a question that sounds like it belongs in a sci-fi movie, but isn't: "Can We Survive Technology?"

  His answer wasn't comforting. He argued that as our power grows, the risks grow with it. And crucially, he said that anyone promising you a permanent fix—a treaty, a single invention, a world government that solves it all—is selling you a delusion. There is no "cure" for the dangers of progress. There is only the work.

  Now, I know what you're thinking. This is graduation. We have little siblings in the audience. Parents are holding cameras. You were probably expecting me to say that our generation's brilliance is going to swoop in and solve climate change, or AI, or everything else, and then we can all relax.

  But if I told you that, I'd be proving von Neumann's point. I'd be selling you a delusion.

  And honestly? I think that delusion is heavier than the truth. Because if we believe there's a magic solution coming, then we're just waiting for it. We're waiting for someone else to invent the shield. We're waiting to be saved.

  But von Neumann's harder truth actually gives us more credit. It says there is no safety net. *We* are the safety net.

  It means that surviving the future isn't about a heroic, one-time victory. It's about maintenance. It's about the unglamorous, endless work of paying attention. It's the engineer who double-checks the stress load, not because the formula says she has to, but because she knows formulas are models, not reality. It's the coder who asks "what if this is used wrong?" before hitting commit. It's the voter, the neighbor, the parent who realizes that being a citizen isn't a status you achieve, it's a practice you keep up.

  To the parents and families here: I know you worry about the world we're entering. It is dangerous. Von Neumann was right about that. But the answer isn't to hope we find a way to make it safe forever. The answer is to trust that we have learned how to navigate the unsafe.

  We are an engineering school. We know that a bridge isn't built and then ignored for a hundred years. It is inspected. It is maintained. It is cared for. Our society is the same. It requires constant, careful, flexible adjustments.

  So, I'm not going to promise you that we will fix everything. I am promising you that we understand the job description.

  We know that "good" isn't a destination we reach; it's a direction we travel. We know that technology doesn't have a moral compass, but we do. And we know that the only way to survive our own power is to match it with an equal amount of humility.

  This might sound exhausting. To have to keep making the right choice, forever, with no finish line? But think about the alternative. The alternative is thinking the work is done. The alternative is sleepwalking.

  Von Neumann thought the best we could do was to make small, careful decisions, forever. I think that's actually beautiful. It means the future isn't written by giant, uncontrollable forces. It's written by the small, careful decisions we make on a Tuesday morning. It's written by the code we check twice. It's written by the way we treat each other when no one is grading us.

  There is no permanent solution. There is only us. And looking out at this class, at the friends who stayed late to help me debug, who argued with me about ethics, who showed up when it was hard—I think "us" is enough.

  We don't need a safety net. We have each other. And we have the work.

  Thank you.
