prompt: |-
  Okay so this is kind of a weird one but I got picked as one of our class's two "student remarks" speakers for graduation -- our school's a STEM/engineering magnet so they do that instead of one normal valedictorian speech, we each get like 4-5 minutes -- and I really want to build mine around this von Neumann essay my engineering capstone teacher assigned us this year called "Can We Survive Technology?" I think it's from around 1955, and weirdly it was originally published in Fortune magazine of all places. The whole point of it (at least how I read it) is that he thinks there's no permanent fix for the dangers that come with technology getting more powerful -- he was mostly worried about nukes but also brings up stuff like deliberately messing with the climate as a coming danger -- and that anyone who promises you a one-time, forever solution (a treaty, a world government, whatever) is kind of selling you something. His actual answer is way less satisfying: you just keep making small, careful, flexible decisions forever, with no permanent safety net, and thats supposedly the best a species like us can realistically do. We'd spent half that class arguing about whether the computer-vision targeting code our robotics team wrote for competition was obviously adaptable to something worse, so the essay hit kind of close to home when we finally got to it in the spring.

  Here's my problem: the school already reviewed my topic and said it can't be doom and gloom (there's gonna be little siblings and nervous parents in the audience), but I also refuse to do the fake-inspirational "our generation's ingenuity will obviously fix climate change/AI/whatever" thing, because that's literally the exact kind of permanent-solution thinking von Neumann is calling a delusion. It also can't turn into an inside joke for the like five kids in my grade who've actually heard of von Neumann -- most of my class and definately all the parents have no clue who he is, and they'll just feel talked over if he ends up as decoration instead of doing actual work in the speech. Can you write the speech for me, roughly 4-5 minutes read out loud? I want his actual argument to be the thing shaping what I'm even allowed to promise everyone about the future, not just a name I drop in the intro before going back to normal commencement-speech platitudes.
