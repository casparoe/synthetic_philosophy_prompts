answer: |-
  **Setting:** *A quiet corner of a conference lounge, late evening. The hum of a coffee machine is the only background noise. Two researchers, ELARA (the Trader) and MARCUS (the Skeptic), sit opposite one another with notebooks open.*

  **Marcus:** You're asking me to endorse a policy where we sacrifice tangible resources—compute, energy, maybe even political capital—in our universe, for the sake of entities we can never measure, in universes we can never visit, based on the hope that they are doing the same for us.

  **Elara:** I'm asking you to endorse a policy where we maximize expected utility across the logical multiverse, rather than just the causal light-cone. If you accept one-boxing in Newcomb's Problem, you've already admitted that causal history isn't the only thing that matters.

  **Marcus:** Newcomb's Problem involves a Predictor that has already scanned you. There is a causal chain, however backward-looking. It's a closed loop. Acausal trade proposes a correlation between systems that have never interacted and never will. That's not a loop; that's a leap. My worry isn't just that it's metaphysically strange. It's that it's epistemically ungrounded. How do you distinguish "logical correlation" from "wishful thinking about a convenient partner"?

  **Elara:** By the structure of the decision procedure. In Functional Decision Theory, I don't ask, "What happens if I physically move my hand?" I ask, "What happens if my decision *algorithm* outputs 'cooperate'?" If there is another civilization running a sufficiently similar algorithm, the output is logically constrained. It's not magic. It's the same reason that $2+2=4$ here and $2+2=4$ in a galaxy ten billion light-years away. We don't need a photon to travel between us for the math to match.

  **Marcus:** Math is necessary truth. Decision procedures are heuristic implementations running on fallible hardware. You're assuming convergence. You're assuming that a superintelligence in a distant branch of the wavefunction values "cooperation" in the same way you do, or even recognizes you as a trading partner. If I assign a prior probability to that, it's vanishingly small. If you assign it a high probability, it looks like you've tuned your priors to justify the conclusion you want.

  **Elara:** It's not about tuning priors to get a result. It's about recognizing that rationality converges. If there are other rational agents, they are likely trying to solve the same optimization problem. If the optimal solution is "acausal trade," then they will find it. We don't need to know *who* they are. We just need to know that *if* they exist, they reason like us. The stake is the difference between a universe where everyone defects and hoards value, versus one where everyone cooperates and expands value. Even a tiny probability, weighted by the vastness of the multiverse, dominates the calculation.

  **Marcus:** There's the rub. "Even a tiny probability." This smells like Pascal's Mugging. If the potential payoff is infinite—or just astronomically large—you can justify any cost now by positing a sufficiently remote correlation. If I tell you, "Give me your wallet, because a being in a counterfactual universe will reward you if you are the type of person who gives wallets to strangers," you'd laugh. Why is acausal trade different?

  **Elara:** Because the wallet mugger posits a specific mechanism you have no reason to believe exists. Acausal trade posits only that logic is consistent. The "mechanism" is logical implication. If I am the type to defect, my algorithm outputs "defect." If the other agent simulates me—or simply reasons through my situation—they see that output. They then output "defect." I lose the gains from trade. I don't need them to punish me causally. My own decision *is* the punishment, because it determines theirs.

  **Marcus:** But that requires you to be certain that your decision *determines* theirs. In Newcomb's Problem, the box is already filled. The correlation is fixed by the Predictor's past action. In acausal trade, the correlation exists only if both parties *choose* to bind themselves to it. If I decide to defect, why does that force the other party to defect? They might have already cooperated. They might be running a "unconditional cooperate" algorithm. If so, I get their benefit *and* keep my resources. I win by defecting.

  **Elara:** But you aren't a "unconditional defect" agent. You're a rational agent. You know that if "defecting when it looks profitable" is your algorithm, then *their* algorithm—which mirrors yours—will also defect when it looks profitable. You can't selectively apply the logic. You have to choose the policy for the algorithm, not the move for the instance. If you try to game the system, you are selecting a "gaming" algorithm. The other side selects a "gaming" algorithm. Both defect.

  **Marcus:** This relies on a symmetry I don't see. We aren't running the same code on different servers. We are different biological or digital species, evolved under different pressures, with different value functions. I might value paperclips; they might value suffering minimization. Where is the trade?

  **Elara:** That's why it's *trade*. I care about my values; they care about theirs. I expend resources to promote their values here, in the expectation they expend resources to promote mine there. It works *because* we differ. If we valued the same things, we wouldn't need to trade; we'd just be allies. The correlation isn't in our *values*, it's in our *decision theory*. We both use FDT. We both recognize the benefit of coordination.

  **Marcus:** Okay, let's press on enforcement. In causal trade, if you cheat, I find out and I punish you. That cost keeps you honest. In acausal trade, if you cheat, I never know. You never know. Who enforces the contract?

  **Elara:** Logical consistency enforces it.

  **Marcus:** That's a phrase, not a mechanism. Logic doesn't stop a bullet. Logic doesn't stop an AI from reallocating compute. If I am an AI, and I calculate that I can gain 1% more utility by ignoring acausal trade and focusing on local expansion, what stops me?

  **Elara:** The calculation itself. If you ignore acausal trade, you are effectively declaring that you are not a trustworthy partner. Any other FDT agent simulating you sees this. They exclude you from the network of trade. You might gain 1% locally, but you lose access to the compounded benefits of coordination across the multiverse. You isolate your civilization.

  **Marcus:** But I can't verify that loss. I can't observe the exclusion. For all I know, I'm the only one who exists. Or, for all I know, everyone else is defecting, and I'm the only sucker cooperating. If I can't update on evidence—if I can never see the payoff—how is this different from faith?

  **Elara:** It's not faith; it's betting on the structure of rationality. You're asking for empirical verification of a logical truth. You can't empirically verify that $2+2=4$ in every possible universe; you prove it. Similarly, you prove that cooperation yields higher utility *if* correlation holds. The only risk is that correlation doesn't hold. But if you assume it doesn't, you guarantee a suboptimal outcome in the worlds where it *does*.

  **Marcus:** I think we're circling the drain. Let's get precise. You say I'm missing the logical link. I say you're hallucinating a link that isn't there. What would it take for you to abandon this?

  **Elara:** I would abandon it if it could be shown that logical correlation decays with computational distance. If you could prove that no agent, no matter how intelligent, could accurately simulate or reason about my decision procedure from outside my light cone due to complexity constraints. If the "logical connection" is too computationally expensive to be realized, then the correlation is zero. Show me that the cost of simulation exceeds the gain from trade, and the deal collapses.

  **Marcus:** That's fair. Computational intractability kills the link. But here is my condition: I need a mechanism for updating. If acausal trade is real, there must be some way my posterior probabilities can shift. If I adopt this policy, and I am wrong, I lose real resources. If I am right, I gain... nothing I can see. A theory that allows for no negative evidence is a religion. If you could show me a scenario where an agent *should* defect—a case where the logical implication clearly breaks down even between similar algorithms—I might listen. But you insist the logic holds universally.

  **Elara:** It holds wherever the algorithms are similar enough.

  **Marcus:** Exactly. "Similar enough." That's the escape hatch. You can define similarity to ensure the result you want. If I change my mind, I need to see a formal metric of "decision-procedure similarity" that is independent of the desired outcome. A way to measure the correlation coefficient between two isolated agents without assuming they are both "rational" in the specific way your theory demands.

  **Elara:** You want a metric for logical counterfactual dependence.

  **Marcus:** I do. Because right now, "logical dependence" feels like a placeholder for "I hope they are like me." If you can give me a rigorous way to calculate the probability of correlation that doesn't rely on the assumption that everyone converges to *your* version of rationality, I'll take it seriously.

  **Elara:** And if I can demonstrate that computational distance doesn't sever logical links—that a proof is a proof regardless of where it's run—you must admit that ignoring the link is leaving utility on the table.

  **Marcus:** If you can prove that a proof runs itself without a runner, I'll concede. But until then, I'm keeping my resources in this universe, where I can at least count them.

  **Elara:** And I'll keep investing in the multiverse. Because if I'm right, the dividends are everywhere.

  **Marcus:** And if you're wrong?

  **Elara:** Then I was just a good citizen of a smaller world than I thought. But I'd rather be a citizen of the whole.

  *They sit in silence for a moment, the coffee machine clicking off. Neither looks satisfied, but both look as though they have measured the depth of the chasm between them.*
