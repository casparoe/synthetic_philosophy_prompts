      *   **Ghazali's Stance:** Strong occasionalism. Fire has no intrinsic power to burn. Connection is God's *'āda* (habit/custom). Logically possible for cotton not to burn.
      *   **Averroes' Stance:** Aristotelian realism. Denying necessary connections destroys scientific knowledge (*'ilm*). If natures don't have stable powers, definitions lose meaning.
      *   **Specific Dynamic:** Avoid strawmen. Averroes shouldn't just win by fiat; Ghazali shouldn't just retreat to "God is powerful." Ghazali needs to anticipate Hume's move: regularity is sufficient for practice/knowledge even without logical necessity.
      *   **Tone:** Intellectual, respectful but sharp, historically grounded but accessible.
