answer: |-
  **Setting:** *A quiet courtyard in Cordoba, though the air smells faintly of Baghdad. It is twilight. Two men sit on opposite sides of a low table. On the table rests a lump of raw cotton and a small brass brazier containing glowing embers. **Abu Hamid al-Ghazali** (d. 1111) sits with the posture of a Sufi mystic, calm and inward. **Abu al-Walid Ibn Rushd (Averroes)** (d. 1198) sits with the alertness of a judge, leaning forward.*

  **Averroes:** You wrote that this scene is a deception, Abu Hamid. In your *Tahafut*, you claimed that if I were to take this cotton and place it upon these embers, I would not be witnessing a cause producing an effect. You say the fire does not burn.

  **Al-Ghazali:** I say the fire does not *burn*, Abu al-Walid. God burns. The fire is merely the occasion. When the cotton touches the ember, you see contact. You see blackening. You see smoke. But you do not see a power passing from the ember to the cloth. You see two events created by the Will, side by side.

  **Averroes:** Then language has broken. If "fire" does not signify a nature that heats and consumes, what does it signify? It signifies nothing but a name we give to a glowing substance. If you strip the nature of its effects, you strip the thing of its definition. To know a thing is to know what it *does*. If fire does not burn by its nature, then "fire" could just as easily mean "ice."

  **Al-Ghazali:** Not by its nature, no. But by God's habit. We call it fire because, in the course of God's *'āda*—His customary way of dealing with creation—blackening follows contact. We define things by what accompanies them, not by a phantom power we imagine resides within them.

  **Averroes:** A phantom power? This is the bedrock of the natural world! If the connection is merely habitual, like a man walking beside a river every day, then the connection is contingent. It could be otherwise.

  **Al-Ghazali:** Precisely. It could be otherwise.

  **Averroes:** *(Gesturing sharply)* Then science is dead. *'Ilm*—knowledge—requires certainty. If I am a physician, and I prescribe a drug to cool a fever, I do so because I know the nature of the drug necessitates cooling. If you are right, I do not know this. I only know that yesterday, the drug cooled. Perhaps tomorrow, God's habit will change, and the drug will ignite the patient. If there is no necessary connection between essence and action, we cannot predict. We can only remember.

  **Al-Ghazali:** You confuse logical necessity with temporal sequence. Tell me, Ibn Rushd: When you observe the sun rise every morning for forty years, do you observe the *necessity* of its rising? Or do you observe only the repetition?

  **Averroes:** I observe the order of the heavens, which reflects the wisdom of the Maker. God does not act chaotically. He created natures with stable powers. To deny that fire burns by its nature is to imply God created a world of lies. It makes the natural order a theater of shadows where nothing actually *does* anything.

  **Al-Ghazali:** Does it diminish God to say He acts at every moment? You say God created natures and then stepped back, allowing the fire to burn the cotton by a power delegated to it. I say this limits Him. If the fire has its own power, is it a partner to God in the act of burning?

  **Averroes:** It is a partner only as a tool is a partner to the carpenter. The carpenter builds the house, but the saw cuts the wood. The saw has the nature of sharpness. If the saw had no nature of sharpness, the carpenter could not work through it. By denying secondary causes, you make God the only agent, yes, but you make the world inert. You make the universe a puppet show.

  **Al-Ghazali:** And you make it a machine. But consider the miracle. The Prophet Ibrahim was thrown into the fire, and it did not burn him. The fire was still fire. The cotton was still cotton. The contact was still made. According to your view, for Ibrahim to survive, God must have changed the *nature* of the fire in that moment. He had to turn fire into "non-burning-stuff."

  **Averroes:** God can do anything. He can suspend the nature He created.

  **Al-Ghazali:** But why change the nature? Why not simply withhold the effect? If the burning is not intrinsic to the fire, but is God's act at the moment of contact, then the miracle requires no change in creation. It requires only a change in the divine command. The fire remains fire; the cotton remains cotton. God simply chooses, for that moment, not to create the blackening. This preserves the miracle without demanding that essences mutate.

  **Averroes:** *(Pauses, looking at the embers)* You protect the miracle, Abu Hamid, but you sacrifice knowledge. If I cannot distinguish between what a thing *must* do and what it *happens* to do, I cannot distinguish between science and magic. Both become mere reports of unusual sequences. If I claim I can turn lead to gold, you cannot say "Impossible, lead lacks that nature." You can only say, "That is not God's current habit."

  **Al-Ghazali:** I can say it is not God's habit. And that is enough.

  **Averroes:** Enough for what?

  **Al-Ghazali:** For living. For medicine. For prophecy. Look, my friend. You say you need necessity to have knowledge. I ask you: Do you need to know the metaphysical secret of the flame to avoid putting your hand in it?

  **Averroes:** No. But I need to know that my avoidance is rational, not just a gamble on God's mood.

  **Al-Ghazali:** It is rational because God is consistent. His *'āda* is reliable. He promises us order. When I plant wheat, I expect wheat, not barley. Not because the seed contains a logical necessity, but because the Creator is faithful to His custom. This regularity is sufficient for the physician, the farmer, and the judge. They deal in what usually occurs (*ghālib*).

  **Averroes:** But "usually" is not "truth." Science seeks truth. If the connection is not necessary, then your "science" is merely a catalog of memories. It is history, not physics. You reduce the universe to a sequence of "and then... and then... and then."

  **Al-Ghazali:** *(Smiling softly)* And is that not what we experience? We see the cotton. We see the fire. We see the ash. We do not see the "must." You Aristotelians project a glue onto the world and call it "causality." I merely scrape the glue away and show you the objects. The regularity remains. The prediction remains. The only thing lost is your claim to know the inner machinery of the Divine Will.

  **Averroes:** But if the machinery is unknowable, why did God give us intellects that scream "cause and effect"? Why does the mind perceive the fire as the *agent* of the burning?

  **Al-Ghazali:** Because the mind seeks patterns to survive, not to comprehend the Essence of God. We are like children watching a scribe write. The child sees the pen moving and thinks the pen writes the words. The adult knows the hand moves the pen. Does the child's error stop the letter from being written? No. Does the adult's knowledge change the ink? No. But the adult knows where to look for the mercy, and where to look for the blame.

  **Averroes:** You sound like a skeptic, Abu Hamid. You sound like you are saying we can know nothing of the world as it is.

  **Al-Ghazali:** I am saying we can know the world as it is *given*. We know the correlation. We know the habit. That is all humans are granted. To demand more—to demand that we grasp the necessary link—is to demand to see the face of God while standing on the earth.

  **Averroes:** *(Leans back, frustrated but thoughtful)* So you concede. For practical life, the fire burns. For the law, the arsonist is guilty. For medicine, the drug cures.

  **Al-Ghazali:** In every practical sense, the fire burns. I would not test your theory by sleeping on these embers.

  **Averroes:** Then what have we fought over?

  **Al-Ghazali:** Over where the power resides. You place it in the created thing, which risks making the creation independent of the Creator. I place it in the Creator, which risks making the creation seem unreal.

  **Averroes:** It makes it seem... fragile. If the world hangs on a habit and not a nature, it feels as though it might vanish if the habit changes.

  **Al-Ghazali:** It *is* fragile. That is the point. It is contingent. Every moment it exists is a gift, not a right. If the fire burned by its own nature, it would not need God to keep it burning from one second to the next. It would be a god itself.

  **Averroes:** *(Silence for a long moment. He picks up the tongs and shifts an ember. The glow brightens.)*

  **Averroes:** I cannot accept that the intellect is deceived about causality. If the intellect is wrong about this, it is wrong about everything. I must maintain that the natures are real, that God's wisdom is embedded in the things themselves, not just in His momentary commands. Otherwise, revelation and reason are at war.

  **Al-Ghazali:** And I must maintain that God's power is absolute, that no thing can bind Him, not even a "nature" He created. Otherwise, revelation and reason are idols.

  **Averroes:** Then we are at an impasse.

  **Al-Ghazali:** We are at the limit of the human mind. You look at the cotton and see a law. I look at the cotton and see a will.

  **Averroes:** *(Stands up)* The cotton will still burn, Abu Hamid.

  **Al-Ghazali:** *(Standing as well)* God willing, it will. And I will still keep my distance. Not because the fire has power, but because I trust the Habit.

  **Averroes:** Good. That is enough for tonight.

  *(Averroes turns to leave. Al-Ghazali watches the embers pulse in the dark, neither touching them, nor denying the heat that radiates from them.)*
