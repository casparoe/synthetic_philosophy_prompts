answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm the eldest, and apparently, I'm the one who teaches philosophy for a living. When my siblings and I were deciding who should speak tonight, they looked at me and said, "You deal with logic and reasoning all day. You're up."

  I think what they really meant was, "If anyone can explain why Mom argues about the rules of Monopoly for forty-five minutes before we actually roll the dice, it's you."

  But in all seriousness, standing here looking out at thirty-four years of a career, I realized I couldn't talk about my mother's work without talking about *how* she worked. And for the thirty or so people in this room who have clerked for her or sat on a panel with her, you know exactly where this is going. You're probably already checking your notes.

  For the rest of you—her choir friends, the neighbors, the grandchildren—I promise to keep the jargon to a minimum. But I need you to understand something fundamental about the woman who raised me.

  In the appellate court, cases are usually decided by panels of three judges. The standard way to decide a case is simple: Each judge votes on who should win. Plaintiff or Defendant. Two votes win, one loses. The majority rules.

  My mother rarely did it that way.

  She insisted that before you could vote on who wins, you had to vote on *why*. In a negligence case, for example, you don't just ask, "Does the plaintiff get the money?" You ask: "Was there a duty of care?" Vote. "Was that duty breached?" Vote. "Did that breach cause the harm?" Vote. Only after the reasons were tallied did she let the verdict fall where it may.

  Now, to most people, that sounds like splitting hairs. To a philosopher, or to the lawyers in the room who just glanced at each other, that is the difference between a verdict and a judgment.

  There is a problem in logic and law called the "discursive dilemma." It proves that a group of perfectly reasonable people can reach two different conclusions in the same case, depending on whether they vote on the *outcome* directly, or vote on the *premises* that lead to the outcome. It's a mathematical proof that our collective reasoning is fragile. There is a famous case from her tenure—still discussed in hushed tones by her former clerks—where her panel fractured exactly along this line. The majority wanted the winner; she wanted the logic to hold.

  There is a theorem, proved by philosophers List and Pettit, which shows that no voting system can guarantee everything we want it to. You cannot have perfect consistency, perfect majority rule, and perfect logic all at once. Something has to give.

  I tell you this not to bore you with social epistemology, but to tell you what my mother knew that the theorem only confirms: She knew there was no perfect solution. She knew she wasn't solving the paradox. She was making a wager.

  She wagered that consistency of reasoning was more important than the comfort of a majority vote. She wagered that the law is not just a machine for producing winners and losers, but a structure of public reasons that must hold up under weight.

  She once told her clerks, "I would rather lose a case than lose the reasons for it."

  When I heard her say that, I didn't just hear a judge. I heard my mother.

  Because this wasn't just a courtroom habit. It was how she lived. When we were children, and my siblings and I wanted to do something, she didn't just say "No." She didn't just say "Yes." She walked us through the premises. *Is it safe? Is it kind? Is it honest?* If the premises didn't add up, the verdict didn't matter. She taught us that the "why" is the only thing that survives when the "what" is forgotten.

  In a world that is increasingly obsessed with outcomes—with the bottom line, with the poll numbers, with who crossed the finish line first—my mother spent thirty-four years insisting that we look at the path we took to get there.

  To the lawyers and judges here: You know that her method was harder. You know it invited dissent. You know it meant that sometimes, the law was slower because she refused to let it be sloppy.

  To the friends and family here: You know that she was stubborn. You know that she would rather be clearly wrong than vaguely right.

  And to the impossibility theorems that say we can't have it all: My mother would say that's fine. We don't need to have it all. We just need to have our integrity.

  She knew the system was imperfect. She knew the math said she couldn't guarantee consistency every time. But she showed up every day, read every brief, and cast her vote on the reasons, because she believed that if you take care of the reasons, the justice will take care of itself.

  So, if everyone could please raise a glass.

  To the Honorable [Mother's Name].
  Thank you for the verdicts, but more importantly, thank you for the reasons.
  Thank you for the wager you made on our behalf, that logic matters, that process matters, and that doing it the hard way is often the only way worth doing.

  To Mom.
