answer: |-
  You have the better read on Maya, but your friend has the better read on the system.

  This is a classic management dilemma where human psychology collides with incentive design. To resolve the argument and fix the problem, you need to synthesize both views: Maya is not acting with malicious intent (you are right), but she is nevertheless behaving exactly as the incentive structure predicted (your friend is right).

  Here is the breakdown of why your intuition is correct, why the distinction matters, and how to fix it.

  ### 1. The Diagnosis: Conditioning, Not Cheating
  Your friend views this through the lens of **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure." They see Maya as a rational actor who identified the path of least resistance to reward and took it.

  You view this through the lens of **Operant Conditioning**. For months, Maya was positively reinforced for a specific behavior (resolving issues to elicit gratitude). She internalized "Customer Gratitude = Good Work." When her role changed, the *task* changed, but her *internal definition of success* did not.

  **You are right about Maya.** If she were gaming the system maliciously, she would likely be more careful about hiding the unauthorized waivers. The fact that she is doing this openly suggests she genuinely believes she is solving the problem. She is suffering from **contextual metric drift**. She is using a map for Territory A (Billing) to navigate Territory B (Escalations). In Territory A, a happy customer meant the problem was solved. In Territory B, a happy customer often means the company just lost money or set a dangerous precedent.

  **However, your friend is right about the risk.** Even if Maya isn't *trying* to game the system, the *outcome* is indistinguishable from gaming. If you treat this purely as a training issue without fixing the metrics, she (or anyone else) will continue to optimize for the wrong outcome.

  ### 2. Why the Distinction Matters
  You mentioned you couldn't articulate why the distinction between "gaming" and "misapplication" matters. It matters for three critical reasons:

  *   **Remediation vs. Discipline:** If she is gaming, you need disciplinary action and tighter controls. If she is misapplying past success, you need coaching and role clarification. Treating a loyal high-performer as a rule-breaker will destroy her morale and likely cause her to quit.
  *   **Root Cause:** If it's gaming, the problem is Maya's integrity. If it's misapplication, the problem is your management's failure to redefine success when her role changed. The latter is fixable without replacing the employee.
  *   **Future Proofing:** If you assume she's gaming, you build stricter policies. If you assume she's conditioned, you build better training. You need both, but the training piece is what preserves talent.

  ### 3. What To Do With Maya
  You need to have a conversation that validates her intent while correcting her impact. Do not accuse her of chasing metrics; frame it as a shift in strategy.

  *   **Reframe "Success":** Explicitly tell her: *"In billing, success looked like a happy customer. In escalations, success looks like a protected company and a respected customer, even if they aren't happy."*
  *   **Redefine the Win:** She needs to know that a "good call" in escalations can end with a customer who is still upset but feels heard. Praise her when she holds a firm line gracefully. You must actively reward the behavior you want to see, not just the outcome you used to want.
  *   **Clarify the Guardrails:** Be unambiguous about authority. *"I know you want to resolve this, but waiving fees without approval puts your job and the team at risk. If you feel a waiver is necessary, here is the escalation path. Do not bypass it."*
  *   **The "Why":** Explain the business logic. If she understands that unauthorized refunds create precedent that hurts the company long-term, she may apply her problem-solving skills to *that* constraint rather than trying to remove it.

  ### 4. What To Do With the System (and Future Hires)
  Your friend is correct that you cannot rely on "glowing sign-offs" as a universal metric. You need to decouple your quality assurance from customer sentiment for complex roles.

  *   **Role-Specific Metrics:**
      *   **Routine Support:** CSAT (Customer Satisfaction) and resolution speed are fine.
      *   **Escalations:** Use QA (Quality Assurance) scoring based on adherence to policy, accuracy of information, and de-escalation techniques. A call can be a "10/10" internally even if the customer hangs up angry, provided the rep was firm, fair, and followed protocol.
  *   **Train for "No":** Most support training teaches how to say "Yes." You need to train your team on how to say "No" effectively. Run role-play scenarios where the correct outcome is a refusal. Grade them on how well they deliver the bad news, not on whether the "customer" (trainer) smiled at the end.
  *   **The "Metric Warning":** During onboarding, explicitly warn new hires about metric fixation. Tell them: *"We look at satisfaction scores, but never at the expense of policy. If you get a thank-you note for breaking a rule, that is not a win; it's a risk."*
  *   **Audit the Promotion:** When moving someone from Routine to Escalations, treat it as a new job, not a promotion. They need a new playbook. The fact that Maya was moved without a clear recalibration of her success metrics was a management oversight. Ensure the next person moved into that role gets a "Success in Escalations" document that explicitly contradicts the "Success in Billing" document.

  ### Summary
  Your friend sees the **mechanism** (incentives drive behavior). You see the **human** (intent drives interpretation).

  Maya is a high-performer trying to win a game where the rules changed silently. If you punish her for gaming, you lose a great employee. If you simply tell her to stop without changing how you measure her, she will revert to old habits.

  **The Verdict:** You win the argument on *intent*, but your friend wins on *system design*. Use your insight to coach Maya with empathy, but use your friend's insight to overhaul your metrics so this doesn't happen again.
