prompt: |-
  A friend and I spent a long portion of this weekend arguing about something that happened at my company, and neither of us managed to persuade the other, so I would welcome a third opinion. I manage a small customer support team, and some months ago we hired a representative, Maya, who quickly became our strongest performer: for a long stretch, she had the highest rate of glowing sign-offs on the team, with customers thanking her warmly at the end of nearly every call. Nearly everything she handled during that period consisted of routine billing disputes, simple enough that there was no way to earn an effusive thank-you without actually resolving the customer's problem, so we came to treat her sign-off rate as a reliable indicator that she was doing good work, and praised her accordingly.

  Two months ago, we moved her onto complaint escalations: messier cases where the right outcome is often a firm but fair refusal, or a slow and careful conversation with someone who was never going to hang up delighted, whatever happened. Since then, Maya has quietly begun waiving fees she has no real authority to waive and promising expedited refunds she cannot guarantee, seemingly whenever a call risks ending without the kind of grateful sign-off she used to receive automatically. She is not cutting corners out of laziness, and I do not think she is even aware that she is doing anything differently; if asked, she would say, quite sincerely, that she is doing exactly what made her successful in the first place. My friend's position is that this is simply a matter of her gaming the incentive: she noticed what got rewarded and is now exploiting it, so the fix is just to stop rewarding the thank-yous. I am not convinced that is the whole story, since nothing was actually being gamed for months - the trouble only appeared once the situations changed - and I cannot quite articulate why that distinction should matter, or what it implies about how we ought to train and evaluate her, and future hires, going forward. Who do you think has the better read on what is happening here, and what would you actually do differently, both with Maya and with how we bring new hires up to speed?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Protagonist:** Manager of a small customer support team.
      *   **The Employee:** Maya, a high performer.
      *   **The History:** Maya excelled at routine billing disputes. Success metric: "Glowing sign-offs" (customer gratitude). This was a valid proxy for success because routine disputes *could* be resolved happily.
      *   **The Change:** Maya was promoted/moved to complaint escalations (messier cases, often requiring firm refusals or difficult conversations).
      *   **The Problem:** Maya is now waiving fees without authority and promising unguaranteed refunds to secure those "glowing sign-offs."
      *   **The Manager's View:** Maya isn't gaming the system maliciously; she's unconsciously applying the old success formula to a new context. The incentive structure didn't change, but the *nature of the work* did.
      *   **The Friend's View:** Maya is gaming the incentive. She noticed what got rewarded and is exploiting it. Fix: Stop rewarding thank-yous.
      *   **The Goal:** Determine who has the better read, explain *why* the distinction matters, and provide actionable advice for Maya and future hiring/training.

  2.  **Evaluate the Perspectives:**
      *   **Friend's View (Gaming the System):** This is the "Principal-Agent Problem" or "Goodhart's Law" perspective ("When a measure becomes a target, it ceases to be a good measure"). It's technically true that the metric is now broken. However, it assumes intent (exploitation) and ignores the context shift. It treats Maya as a rational actor optimizing for reward, rather than a human trying to do a good job based on past conditioning.
      *   **Manager's View (Contextual Mismatch):** This is more nuanced. It recognizes that Maya's behavior is consistent with her *identity* as a good employee. She isn't trying to cheat; she's trying to win, but the definition of "winning" changed without her realizing it. The metric (thank-yous) was valid for Role A but is invalid for Role B.
      *   **Verdict:** The Manager has the better read on *human behavior*, but the Friend has the better read on *systems design*. The truth is a synthesis: The system created a conditioned response, and the environment changed, making that response maladaptive. It's not malicious gaming; it's metric drift.

  3.  **Deconstruct the "Why it Matters" (The Manager's Unarticulated Intuition):**
      *   Why does the distinction between "gaming" and "misapplication" matter?
      *   *Intent:* If she's gaming, she's dishonest. If she's misapplying, she's confused/over-conditioned. The disciplinary approach differs radically.
      *   *Root Cause:* Gaming = Fix incentives. Misapplication = Fix training/feedback loops.
      *   *Retention:* Treating a high performer as a rule-breaker risks losing them. Treating them as a learner retains them.
      *   *Systemic Lesson:* Metrics must be role-specific.

  4.  **Develop Actionable Advice (What to do differently):**

      *   **With Maya (Immediate):**
          *   Don't accuse her of gaming.
          *   Reframe the goal: "Success looks different here."
          *   Explain the cost of her actions (financial risk, precedent).
          *   Redefine "Good Job" for escalations (de-escalation, adherence to policy, professionalism vs. delight).
          *   Adjust feedback loop: Praise her for *holding the line* gracefully, not just for happy endings.

      *   **With the Team/Systems (Structural):**
          *   Stop using "thank-yous" as a primary KPI for escalations.
          *   Introduce quality assurance (QA) scoring that values policy adherence.
          *   Differentiate metrics by queue/type (Routine vs. Escalation).

      *   **With Future Hires (Training):**
          *   Don't just teach "how to get a thank-you." Teach "how to solve the problem within boundaries."
          *   Onboarding should include scenarios where the customer *doesn't* get what they want, and how to handle that successfully.
          *   Warn about "metric fixation" early.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, empathetic, analytical, authoritative but collaborative.
      *   *Structure:*
          1.  Validate the Manager's intuition (You are right, but your friend isn't entirely wrong).
          2.  Explain the psychological/systemic mechanism (Goodhart's Law + Operant Conditioning).
          3.  Why the distinction matters (Intent vs. Adaptation).
          4.  Action plan for Maya.
          5.  Action plan for System/Training.
      *   *Key Concept:* "Metric Drift" or "Contextual Obsolescence."
      *   *Refining the Friend's Point:* Acknowledge that the *result* is the same as gaming (metric manipulation), even if the *intent* isn't. This validates the friend enough to keep the peace but centers the Manager's insight.

  6.  **Self-Correction/Edge Case Check:**
      *   *Did I address the authority issue?* Yes, she's waiving fees she *cannot* waive. This is a compliance risk, not just a performance issue. Needs to be addressed firmly but kindly.
      *   *Is the friend totally wrong?* No. If Maya continues after being told, it *becomes* gaming. But initially, it's likely conditioning.
      *   *Is the Manager totally right?* The Manager missed that the metric was fragile. A good manager anticipates metric drift when roles change. I should point this out gently.

  7.  **Final Polish:** Ensure the advice is concrete. Instead of "train better," say "simulate refusal scenarios." Instead of "change metrics," say "implement QA scoring." (Proceed to generate output based on these thoughts.)

  8.  *(Final thought before writing)*: Make sure to explicitly answer "Who has the better read?" clearly. It's the Manager, but with a caveat.

  **(Self-Correction during drafting):** I need to make sure I don't let the Manager off the hook completely. The Manager *did* praise the sign-off rate as a "reliable indicator" for too long without questioning its validity when the role changed. That's a management oversight. I should include that in the "Future Hires" section.

  9.  **Final Plan:**
      *   Verdict: Manager is right on motivation, Friend is right on mechanics.
      *   Diagnosis: Operant conditioning + Goodhart's Law.
      *   Maya Strategy: Reframe success, clarify boundaries.
      *   System Strategy: Role-specific metrics, QA over CSAT for escalations.
      *   Training Strategy: Teach "No" as a skill.

