answer: |-
  This is a profound ethical knot, and your intuition that something is off about the distribution of blame here is philosophically sound. You are grappling with the intersection of **causation by omission**, **special obligations**, and **moral luck**.

  To help you articulate this for your friend (and your writing), we need to separate three distinct concepts that are currently tangled together in this building meeting: *Causal Responsibility*, *Moral Culpability*, and *Role Obligation*.

  Here is a framework for unpacking why singling her out is unjust, even if her inaction was technically a link in the chain of events.

  ### 1. Causation: Conditions vs. Causes
  In philosophy of law (specifically H.L.A. Hart and Tony Honoré's *Causation in the Law*), there is a distinction between a "mere condition" and a "cause."

  *   **The Counterfactual Test:** If your friend had changed the battery, would the injury have happened? No. Therefore, her inaction is a *necessary condition* for the injury. In a purely mechanical sense, she is part of the causal chain.
  *   **The Abnormality Test:** However, we usually only label something "the cause" if it is an *abnormal* intervention in the expected order of things.
      *   A fire starting is an abnormal event.
      *   A maintenance man ignoring a safety complaint is an abnormal breach of protocol.
      *   A random tenant (even a de facto manager) not performing maintenance is a *normal* state of affairs.

  By treating your friend's inaction as "the cause," the building is treating her potential intervention as the *expected norm*. This is the first error. Her action would have been **supererogatory** (good to do, beyond the call of duty), not obligatory. To blame her for not doing something supererogatory is to claim she owed a duty she did not actually hold.

  ### 2. The Hierarchy of Duty (Role Obligation)
  This is the strongest argument for why the maintenance guy bears more blame than your friend, and why your friend bears more than a random tenant, but less than the landlord. Responsibility is not flat; it is hierarchical based on **assumed risk and contract.**

  *   **The Maintenance Guy (Contractual Duty):** He is paid specifically to mitigate this risk. He has a **fiduciary and contractual obligation**. When he ignored the texts, he breached a specific agreement. His inaction is a *professional negligence*.
  *   **The Landlord/Building Owner (Structural Duty):** They chose battery-operated detectors over hardwired ones. They outsourced safety to a chat group rather than a scheduled inspection regimen. This is **systemic negligence**.
  *   **Your Friend (Social/Informal Duty):** She is a "de facto manager" of *communication*, not *infrastructure*. There is a category error here. Being the person who "has everyone's numbers" does not logically entail being the person who "climbs ladders to change batteries." Unless she explicitly accepted the role of *Safety Officer*, her duty is no greater than any other capable tenant.
  *   **The Other Tenants (Civic Duty):** They have a general moral duty to not let neighbors die, but no specific duty to maintain the building.

  **The Principled Reason to Blame the Maintenance Guy:**
  We blame the maintenance guy not because his inaction was more "causal" (physics doesn't care about contracts), but because **blame is a social tool used to enforce norms.** Blaming the maintenance guy reinforces the norm that "safety professionals must do their jobs." Blaming your friend reinforces the norm that "burnout volunteers should assume liability for paid roles." The latter is a destructive norm for a community.

  ### 3. The Problem of Moral Luck
  Your friend is suffering from what philosopher Thomas Nagel calls **Moral Luck**.

  *   **Scenario A:** She ignores the text. No fire happens. She is "busy but helpful."
  *   **Scenario B:** She ignores the text. Fire happens. She is "negligent and responsible."

  Her internal mental state and her actions were identical in both scenarios. The only difference was the wind, the grease, and the timing. Yet, we assign her moral weight based on the *outcome*, not the *choice*.

  She feels guilty because she is looking at the outcome (injury) and working backward. But moral judgment should be based on the choice made at the time. At the time, her choice was: *"I am not the maintenance guy; I will trust the maintenance guy."* That is a reasonable heuristic for a functioning society. If every tenant had to verify the maintenance guy's work, the system would collapse.

  ### 4. Omission vs. Commission
  You asked if her not acting is the same as *disabling* the alarm.
  *   **Commission:** If she had taken the battery *out*, she would have actively altered the state of safety. She would be the sole proximate cause.
  *   **Omission:** She left the state of safety exactly as she found it (compromised by the landlord/maintenance).

  While some ethical frameworks (like Utilitarianism) argue that letting die is morally equivalent to killing, most legal and social frameworks distinguish them heavily. We punish the person who pushes the swimmer, not the person who doesn't jump in to save them—unless that person is a lifeguard. Your friend is being treated like a lifeguard when she is actually just another swimmer who happens to know how to use the whistle.

  ### 5. Why is she being singled out? (The Psychology of Blame)
  If the logic above holds, why is the building focusing on her?
  1.  **Availability Heuristic:** She is visible. She is the "manager." The maintenance guy is a service provider who comes and goes.
  2.  **Internal Locus of Control:** She is blaming herself. It is easier for the group to accept her self-flagellation than to do the hard work of suing the landlord or firing the maintenance guy. Her guilt is convenient for the community.
  3.  **The "Competence Trap":** Because she is organized and capable, people assume she *could* have fixed it, therefore she *should* have fixed it. This conflates **ability** with **obligation**.

  ### Summary for your Friend
  You can tell her this:

  1.  **Causation is not Culpability.** Yes, if you had changed the battery, they wouldn't have been hurt. But if the landlord had installed hardwired detectors, they wouldn't have been hurt. If the cook hadn't left the grease, they wouldn't have been hurt. Being a "link in the chain" does not make you the "breaker of the chain."
  2.  **You are not the Lifeguard.** You accepted a role of administrative coordination, not physical maintenance. You relied on the designated professional to do his job. That is not negligence; that is the division of labor.
  3.  **Guilt is not a Map.** The fact that you feel the guilt most acutely does not mean you are the most guilty. It means you have empathy. The maintenance guy likely feels less guilt because he is less empathetic or more compartmentalized. Do not let his lack of conscience become your burden.

  **The Verdict:**
  She is not right that she "caused" it in the meaningful sense of culpability. She is a **causal condition**, but the **moral cause** lies with the party who had the specific duty of care (maintenance) and the party who designed the safety system (landlord).

  The building is picking her because she is present and caring, not because she is responsible. That is a tragedy, but it is not her fault.

  ***

  *For your writing:* This is a perfect case study for the gap between **outcome-based ethics** (consequentialism) and **duty-based ethics** (deontology). Consequentialism looks at the dead battery and says "She failed." Deontology looks at the job description and says "She fulfilled her duty." We live in a world that demands the latter but punishes based on the former.
