      *   Causation: The "Necessary Condition" vs. "Proximate Cause."
      *   Duty: The hierarchy of obligation (Contract > Role > Civic).
      *   Moral Luck: Why she feels it more than others.
      *   Structural Blame: The detector design.
      *   Conclusion: A framework for her to process this.

