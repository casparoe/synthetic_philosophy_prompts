answer: |-
  **The Infinite Mirror: Cosmology, Decision Theory, and the Illusion of Acausal Trade**

  For thirty years, my professional life was governed by the light cone. I studied the geometry of space-time, measuring the curvature of the universe to determine whether it would close back on itself or expand forever. The question of infinity was a technical one, defined by density parameters and inflationary models. In retirement, I have traded the telescope for the thought experiment, drifting into the murky waters of ethics and decision theory. It is there I encountered the argument for "evidential cooperation in large worlds" (ECL). It is a seductive notion: that in an infinite cosmos, we are surrounded by causally disconnected mirrors of ourselves, and that rationality demands we strike a bargain with them.

  The argument posits that if the universe is sufficiently large, there exist agents identical or similar to us in reasoning and circumstance. Though we cannot signal them, our decisions are logically correlated; if I choose to cooperate, the "algorithm" I run suggests they do too. Therefore, I should temper my local values to accommodate theirs, expecting them to do the same, maximizing value across the multiverse. Proponents argue this gives us a duty to compromise with alien values we will never meet. Critics call it a cosmological Pascal's Wager: a bet on infinite stakes driven by unknowable probabilities.

  After weighing the decision-theoretic coherence against the epistemic fragility of its premises, I must deliver a verdict. While ECL is logically consistent within specific frameworks of rationality, it fails to provide genuine, action-guiding reason for behavior in the actual world. It is, at bottom, a sophisticated Pascal's Wager—ingenious in form but empty in practice.

  To understand why the argument feels compelling, one must first grant its decision-theoretic foundation. ECL relies on Evidential Decision Theory (EDT) or, more robustly, Functional Decision Theory (FDT). Unlike Causal Decision Theory (CDT), which asks "what effect does my action cause?", FDT asks "what output does my decision algorithm produce?" If I am a physical process running a specific reasoning function, and a distant agent in a Hubble volume $10^{100}$ meters away runs the same function, our outputs will correlate. We are not causing each other to choose; we are reading from the same source code.

  In a standard Prisoner's Dilemma, CDT dictates defection because my choice cannot causally influence the other. FDT dictates cooperation because my choice is *evidence* of the other's. If the "large world" hypothesis holds, the number of these acausal partners dwarfs the single local instance of me. Consequently, the expected utility of cooperating across the multiverse vastly outweighs the local cost of compromising my values. Mathematically, the argument is tight. If you accept FDT and you accept the existence of infinite isomorphic agents, cooperation is the only rational move.

  However, decision theory does not operate in a vacuum; it operates on probabilities assigned to states of the world. This is where the cosmological premise crumbles under the weight of Pascal's Wager. A Pascal's Wager functions by leveraging infinite (or near-infinite) payoffs to dominate any finite probability, no matter how small. If the reward is infinite salvation, even a one-in-a-billion chance of God's existence dictates belief.

  ECL suffers from the same structural vulnerability. We do not know if the universe is infinite. Current inflationary models suggest it may be vast, but "vast" is not "infinite," and "infinite" is not "filled with reasoning agents." Furthermore, for the correlation to hold, the agents must be sufficiently similar to run the same decision algorithm, yet sufficiently different to hold conflicting values. This requires a specific, unverified configuration of physical constants, evolutionary pressures, and sociological developments.

  When we assign a credence to this hypothesis, we are not dealing with empirical data. We are dealing with metaphysical speculation. If we allow hypotheses with undefined probabilities but infinite stakes to dictate our actions, we open the door to "Pascal's Mugging." A stranger could claim to be a being from another dimension who will torture $3 \uparrow\uparrow\uparrow 3$ people unless I give them five dollars. The expected utility of paying is infinite, yet rational agents reject the deal because the probability is too epistemically ungrounded. ECL asks us to pay a real cost (tempering our values) for a reward (acausal cooperation) that is equally unverifyable. To accept ECL is to accept that speculative cosmology should override local ethical intuition, a dangerous precedent for any decision theory claiming to guide action.

  Moreover, the argument fails the test of action-guidance due to the "reference class problem." To cooperate with a copy, I must know who counts as a copy. Do I compromise with agents who share my logic but value suffering? Do I compromise with agents who are 90% similar? 50%? If I broaden the class to include more agents, the potential gain increases, but the correlation strength decreases. If I narrow it, the correlation strengthens, but the gain diminishes. Without a principled way to define the reference class, the "bargain" has no terms. I cannot temper my values toward "strangers" if I cannot define who they are or what they value. An instruction to "cooperate with the multiverse" is as operationally useless as an instruction to "maximize goodness." It offers no heuristic for the specific dilemmas I face here and now.

  Finally, there is the issue of feedback. Science and ethics both rely on learning. We act, we observe consequences, and we update. ECL is hermetically sealed from feedback. I can never know if my distant counterparts existed, if they reasoned as I did, or if they upheld their end of the bargain. A decision theory that cannot be falsified or calibrated by experience ceases to be a tool for navigating reality and becomes a solipsistic game. If I sacrifice local value for acausal gain and the "large world" hypothesis is false, I have simply lost value for no reason. Since I can never check the result, I can never learn from the mistake.

  Proponents might argue that the cost of "tempering values" is low, making the bet cheap. But ethical compromise is rarely costless. To temper my commitment to justice or truth for the sake of an unobservable alien value system is to dilute the very agency that makes the reasoning possible. If I am not willing to act on my values locally, why should a distant copy respect them? The logic undermines itself.

  In my decades studying the cosmos, I learned to respect the limits of observation. We cannot see beyond the particle horizon. We cannot test the multiverse. To build an ethical imperative on the assumption that the unobservable is not only populated but populated with rational mirrors of ourselves is to confuse mathematical possibility with physical reality.

  The argument for evidential cooperation in large worlds is a triumph of abstract rationality. It shows what we *would* do if the universe were a certain way and if we were purely logical functions. But we are not functions; we are biological agents embedded in a local causal context with limited epistemic access. The probabilities required to make ECL work are too speculative, the reference classes too vague, and the stakes too susceptible to mugging.

  Therefore, my verdict is this: ECL is a cosmological Pascal's Wager. It should be treated as a fascinating limit-case for decision theory, illuminating the boundaries of rationality, but it must be rejected as a guide for action. We are bound by the light cone, not just physically, but morally. Our duties are to the agents we can reach, the consequences we can measure, and the values we can defend in the finite world we actually inhabit. To do otherwise is to chase ghosts in an infinite mirror, hoping they wave back.
