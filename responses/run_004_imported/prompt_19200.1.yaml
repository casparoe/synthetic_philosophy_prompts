      *   *Liberty vs. Equality:* Does late Mill subordinate liberty (individuality) to equality (solidarity)? *On Liberty* (1859) is high individualism. *Chapters* (1869) worries about the "yoke of opinion" in socialist communities. A strong opponent argues this tension is unresolved, not continuous.

