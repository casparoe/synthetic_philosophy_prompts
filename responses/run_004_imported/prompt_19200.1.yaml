      *   *Refining the "Continuity" Claim:* Warn the user not to over-claim. There *is* a shift in emphasis. Continuity of *method* (utilitarianism/expediency) does not mean continuity of *policy preference*. The user needs to admit the policy preference shifted while the *justification* remained constant.
      *   *Harriet Taylor:* Acknowledge her role but frame it as catalytic, not determinative.
