      *   *Argument:* There *is* a shift in weight, even if not principle. Early Mill (1848) is a modified Ricardian. Late Mill (1869+) prioritizes distribution over production in a way that undermines liberal individualism.
      *   *Key Point:* The *Chapters on Socialism* might show a hardening of the *limits* of socialism. Mill defends competition as a necessary check. A strong opponent would argue this isn't just "scrutiny" but a substantive re-affirmation of liberal market mechanisms that limits the socialist horizon more than the 1848 text did.
