  This is a sharp distinction to make. Most people conflate "commitment races" with standard brinksmanship (where I threaten you to get my way) or coordination failures (where we both fail to pick the same focal point).

  The specific mechanistic core of the Kokotajlo/Wei Dai "commitment race" is the **negative value of information**. In a standard rational agent model, more information is always good (or neutral). In a commitment race, agents have an incentive to **bind themselves before processing information**, because processing that information might reveal a reason to hesitate, and hesitation loses the bargaining advantage. The disaster arises because *both* agents do this, locking them into incompatible rigidities that prevent them from updating into a cooperative solution later.

  Here is a genuinely different example that fits these criteria, involves human institutions, and is distinct from war/brinksmanship:

  ### The Example: The Biotech "Patent Thicket" (The Tragedy of the Anticommons)

  **The Agents:** Competing pharmaceutical or biotechnology firms (e.g., during the Human Genome Project era).
  **The Commitment:** Filing broad, early-stage patent claims on gene sequences or research tools.
  **The Disaster:** A "patent thicket" where no firm can develop a viable treatment because doing so would infringe on dozens of overlapping, premature patents held by rivals, stalling innovation entirely.

  #### Why this is a Commitment Race (and not just a race)

  In a standard R&D race, firms try to invent the solution faster. In a **commitment race**, firms try to **legally bind the territory** before they know if it contains value or how it fits with others' territory.

  1.  **The Incentive to Move First (Schelling Advantage):**
      Patent law generally awards rights based on "first-to-file." If Firm A discovers a gene sequence but waits to verify its therapeutic utility (gathering information), Firm B can file a patent on the sequence itself. Firm B then owns the "land," even if Firm A found the "oil." To prevent this, Firm A has an incentive to file *immediately* upon discovery, before verifying utility.

  2.  **The Negative Value of Information (The "Updateless" Aspect):**
      This is the crux. Ideally, a firm should wait until it knows:
      *   Does this gene actually cause the disease?
      *   Is there a better way to target it?
      *   Does Firm B have a complementary patent we could license?
      
      However, waiting to learn these answers creates vulnerability. If Firm A pauses to reason carefully, Firm B files a broader claim. Therefore, Firm A is incentivized to **remain ignorant** of the broader context. They file broad, vague claims ("We own all uses of Gene X") *before* they have reasoned through the specific scientific or legal implications. They are effectively committing to a policy of "Aggressive Ownership" before updating on the state of the world.

  3.  **Incompatible Commitments:**
      Firm A commits to "We own the upstream research tool." Firm B commits to "We own the downstream application." Both commitments are legally valid because they were filed early and broadly to secure priority.
      
      In a normal coordination scenario, they would realize: "Hey, we need each other to make this drug. Let's license." But because both have pre-committed to rigid, maximalist positions to deter *other* competitors, the licensing negotiations break down. Firm A's pre-commitment says "No licensing below Price X" (to signal strength to the market). Firm B's pre-commitment says "We will not pay above Price Y" (to signal they aren't a pushover).

  4.  **The Disaster (Gridlock, not War):**
      The outcome isn't mutual destruction (nukes) or a car crash (chicken). It is **innovation stagnation**. The drug is never developed. The patients don't get treated. The value is lost. This is the "Tragedy of the Anticommons": too many owners with the right to exclude, resulting in under-use of the resource.

  #### How this differs from your excluded examples

  *   **Vs. Chicken/Brinksmanship:** In Chicken, the disaster is *mutual harm* (crash). In the Patent Thicket, the disaster is *mutual paralysis*. Neither side is threatening to blow up the lab; they are simply exercising their pre-committed legal rights to exclude. The "threat" is passive (refusal to license) rather than active (retaliation).
  *   **Vs. AGI Bargaining:** This is not about abstract utility functions or "bullying norms." It is about concrete, human legal instruments (patents) and financial incentives (stock price, market cap). The agents are human executives and lawyers, not opaque algorithms.
  *   **Vs. Coordination Failure:** In a pure coordination failure (e.g., driving on the left vs. right), both parties want the same outcome (safety). Here, the parties have **adversarial interests** regarding the *distribution* of the surplus (who gets the licensing revenue). They *could* coordinate to split the profit, but the commitment race incentivizes them to lock in positions that make splitting impossible.

  #### The "Updateless" Mechanism in Action

  The specific "Kokotajlo" flavor here is the **strategic avoidance of due diligence**.

  If Firm A investigates Firm B's portfolio deeply before filing their own, they might realize, "Oh, we can't patent this without infringing them. We should negotiate first." But if they negotiate first, they signal weakness, and Firm B might demand 90% of the revenue.

  So, Firm A's optimal strategy is to **file first, ask questions later.** They bind themselves to a legal claim *before* they have the information that would tell them the claim is problematic. They are betting that by the time the information comes to light (e.g., in court), their commitment will be strong enough to force Firm B to yield.

  When both firms play this "Updateless" strategy, the system creates a web of incompatible legal claims that no amount of *later* reasoning can untangle, because the cost of unwinding the pre-commitments (litigation, reputation loss, stock drop) becomes higher than the value of the drug itself.

  ### Summary Checklist
  *   **Human Agents?** Yes (Pharma Execs/Lawyers).
  *   **No Chicken/Nukes?** Yes (Economic gridlock, not violence).
  *   **No AGI?** Yes.
  *   **Incentive to be Ignorant?** Yes (Filing before validation to secure priority).
  *   **Incompatible Commitments?** Yes (Overlapping patent claims).
  *   **Disaster?** Yes (Life-saving drugs never reach market).
