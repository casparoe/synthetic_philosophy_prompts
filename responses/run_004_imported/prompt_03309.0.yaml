      *   *Option B: Near Future.* A high-tech lab trying to replicate Turing's test but failing due to "psi interference." This might feel more sci-fi, but perhaps less poignant regarding the specific text.
      *   *Decision:* Let's go with Option A (1952, Manchester). It grounds the philosophical absurdity in the gritty reality of early computing. It makes Turing a character, which adds weight.
      *   *Characters:*
          *   Alan Turing (quiet, pragmatic, obsessed with the rules).
          *   Dr. Eleanor Vance (a skeptical psychologist/interrogator).
