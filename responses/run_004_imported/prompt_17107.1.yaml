answer: |-
  This is a textbook example of the **problem of resultant moral luck**, a debate that has occupied legal philosophers since Thomas Nagel and Bernard Williams formalized it in the 1970s. Your friends have independently reconstructed the central tension between *subjectivist* (mind-focused) and *objectivist* (harm-focused) theories of culpability.

  Here is the round-by-round verdict, followed by the philosophical context they missed.

  ### The Exchange

  **Move (1): Marcus**
  *Verdict: Marcus wins.*
  Marcus establishes the **Control Principle**: moral judgment should only apply to what is within an agent's control. Since the presence of the pedestrian was outside the driver's control, punishing him more severely violates basic fairness. This is the strongest intuitive argument against outcome-based sentencing. Until Deb challenges the principle itself, Marcus holds the high ground on logical consistency.

  **Move (2): Deb**
  *Verdict: Deb wins.*
  Deb successfully challenges the premise that the Control Principle is the *only* metric for justice. By invoking the distinction between attempted murder and murder, she points out that our shared moral intuitions *do* track outcomes. Retributivism isn't just about bad intentions; it's about making amends for actual wrongs done to victims. She correctly identifies that "harm" is a constituent part of the wrong, not just an accidental byproduct. Marcus's abstract fairness runs into the concrete reality of grief.

  **Move (3): Marcus**
  *Verdict: Deb wins (by default).*
  Marcus stumbles here. First, his "heart attack" regress argument is a strawman; legal systems already have **proximate cause** doctrines to limit liability to foreseeable consequences, which he ignores. Second, he quietly switches frameworks from *retributivism* (what is deserved) to *consequentialism* (deterrence value) without justifying the shift. If punishment is about desert (as Move 1 implied), deterrent value is irrelevant. If it's about deterrence, he needs to prove that punishing lucky drivers more harshly actually increases safety, which is empirically dubious.

  **Move (4): Deb**
  *Verdict: Deb wins.*
  Deb lands the knockout punch. She correctly notes that legal doctrine (proximate cause) solves the regress problem Marcus invented. More importantly, she exposes the radical implication of Marcus's view: to be consistent, we would have to punish *risk creation* rather than *harm realization*. This would mean treating every drunk driver who gets home safe as a potential killer, requiring a massive, socially untenable increase in incarceration. She forces Marcus to admit that his "fair" system would look draconian in practice.

  ### What They Missed (The Literature)

  If you were to write this up, here are the concepts that would deepen the analysis:

  1.  **Resultant Moral Luck (Nagel/Williams):** This is the specific name for Marcus's objection. Nagel argues that we intuitively reject moral luck, yet we practice it constantly. The tension isn't a bug in their debate; it's a feature of human morality.
  2.  **Subjectivism vs. Objectivism:** Marcus is arguing for **Subjectivism** (culpability lies in the choice/risk taken). Deb is arguing for **Objectivism** (culpability includes the state of the world resulting from the choice). Most modern legal systems are hybrid: they require a guilty mind (*mens rea*) but scale punishment based on the result (*actus reus* consequences).
  3.  **The Expressive Function of Law:** Deb hints at this but doesn't name it. Law isn't just a calculator for deterrence or desert; it's a statement of societal values. A 12-year sentence expresses a different level of communal condemnation for a death than a fine does for a dent, regardless of the driver's intent.
  4.  **Risk vs. Harm Pricing:** Economists and legal scholars (like Steven Shavell) debate whether we should sanction the *expected harm* (probability × magnitude) or the *actual harm*. Marcus argues for sanctioning expected harm; Deb argues that actual harm carries a unique moral weight that expected harm cannot capture.

  ### Overall Lean

  Marcus is philosophically correct that luck shouldn't dictate blame, but Deb is practically correct that a legal system ignoring outcomes would fail to serve justice or social order.
