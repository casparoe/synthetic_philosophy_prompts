  8.  **Final Polish:** Ensure the distinction between "making up people" (the title of his essay) and "making up fake things" is clear. Hacking's point is that we *do* make up people, and that's a profound ontological claim, not a debunking one.

  *(Self-Correction during drafting)*: Wait, I need to be careful with the MPD/DID comparison. DID is still in the DSM. Hacking called it a "transient mental illness" in a specific historical context. I should clarify that the *explosion* of cases in the 80s/90s is what Hacking critiqued, not necessarily the existence of dissociation. The user's worry is about the *manufacturing* aspect. I need to focus on the *iatrogenic* nature of the 80s MPD boom vs. the *neurodevelopmental* nature of autism.

  9.  **Final Review against constraints:** Blunt? Yes. Not reassuring? Yes. Addresses all three points? Yes.

