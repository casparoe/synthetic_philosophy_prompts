      *   *Hacking's nuance:* Hacking distinguishes between "making up people" (constructionism) and the *mechanism* of change (looping). Social construction often implies "it's not real, it's just society." Hacking says "it *is* real, but the reality changes because we classify it."
      *   *Key distinction:* A self-fulfilling prophecy is usually about a *specific outcome* (e.g., "you're bad at math" -> you fail math). Looping is about the *kind of person* evolving over time. It's historical and dynamic.
      *   *Verdict:* The user is using it correctly, but needs to sharpen the distinction from "it's all in your head." Hacking isn't a debunker; he's a historicist.

