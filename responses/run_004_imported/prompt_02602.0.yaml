      *   *Verdict:* It's a fair worry philosophically, but empirically weak. The disanalogy isn't just "biology" (which is fuzzy for autism), it's about *when* the traits manifest relative to the classification.

  4.  **Deconstruct Question 3: The "Refugee" Move (Realness of Interactive Kinds):**
