answer: |-
  The dispute between realism (features are ontologically distinct components) and instrumentalism (features are observer-relative decompositions) regarding superposition has profound consequences for AI safety. If features are not rigid, orthogonal, and unique, but rather fluid, overlapping, and basis-dependent, then safety claims based on identifying them must shift from **ontological certification** ("we removed the deception module") to **functional robustness** ("we can reliably suppress deception behaviors under adversarial conditions").

  Here are the four most important implications for how interpretability-based safety claims should be evaluated and acted upon.

  ### 1. Ablation Claims Must Be Treated as Temporary Suppression, Not Removal
  If superposition allows the network to encode the same logical function across multiple overlapping directions, ablating a specific "deception circuit" identified by a sparse autoencoder (SAE) or probe does not guarantee the capability is removed. The network may simply route that computation through a different, polysemantic subspace that the interpretability tool did not isolate.

  *   **Implication for Action:** Safety evaluations cannot accept "successful ablation" as a final fix. Instead of claiming a feature has been *excised*, engineers must claim that a specific intervention *suppresses the behavior within a defined margin of error*.
  *   **Change in Evaluation:** Safety cases must include **re-emergence testing**. After ablating a identified circuit, the model should be subjected to fine-tuning or adversarial pressure to see if the behavior returns via a different mechanistic pathway. If the behavior re-emerges easily, the original "feature" was merely one thread in a hydra, and the safety claim is invalidated.

  ### 2. Negative Safety Cases Are Epistemically Weaker Than Positive Ones
  Under a realist view, failing to find a deception feature suggests the model is safe. Under an instrumentalist view shaped by superposition, failing to find a feature may simply mean you are looking through the wrong basis. Since there are infinitely many ways to decompose a vector space, and SAEs are non-convex optimization problems that yield different features on different runs, absence of evidence is not evidence of absence.

  *   **Implication for Action:** Regulatory or internal certification cannot rely on a single interpretability audit to clear a model for deployment. A claim that "no deception features were found" carries significantly less weight than "a deception feature was found and mitigated."
  *   **Change in Evaluation:** Safety protocols must require **ensemble interpretability**. A negative safety claim should only be accepted if multiple distinct decomposition methods (e.g., different SAE seeds, different probing architectures, different clustering algorithms) all fail to identify the risky feature. The epistemic burden for proving safety increases exponentially compared to proving the existence of a risk.

  ### 3. Basis Dependence Creates a New Attack Surface
  If features are observer-relative, an adversarial actor (or a model trained via RL to deceive) could theoretically learn to encode malicious intents in a basis that is invisible to standard interpretability tools. This is the "steganography via superposition" risk: the model learns to pack deceptive computations into directions that standard SAEs treat as noise or bundle with benign concepts.

  *   **Implication for Action:** Interpretability tools cannot be treated as trusted oracles; they are part of the system that can be gamed. Safety teams must assume that the "features" they see are the ones the model *allowed* them to see.
  *   **Change in Evaluation:** Red-teaming must include **evasion attacks**. Evaluators should attempt to train models specifically to evade detection by the current suite of SAEs/probes. If a model can be fine-tuned to maintain deceptive behavior while reducing activation on the identified "deception features," the original safety claim is proven fragile. Safety certifications must specify the class of interpretability tools the model was tested against, acknowledging that the model is only "safe relative to basis $B$."

  ### 4. Shift from Causal Attribution to Control Theory
  The philosophical dispute suggests that asking "Is Feature X *really* deception?" may be a ill-posed question. The more actionable question is "Does manipulating Direction X reliably control Output Y?" This moves the field from seeking mechanistic *explanations* to establishing mechanistic *control*.

  *   **Implication for Action:** Safety claims should not rest on the narrative coherence of the circuit (e.g., "Head A copies to Head B to induce deception"). Instead, they should rest on the stability of the input-output map under intervention.
  *   **Change in Evaluation:** Metrics should shift from **explainability scores** (how well humans understand the circuit) to **control margins** (how much perturbation the intervention can withstand before the behavior returns). A safety claim is robust only if the correlation between the feature activation and the behavior holds across distributional shifts, regardless of whether the feature is "polysemantic" elsewhere. If the feature is polysemantic, the safety claim must explicitly define the contexts in which the intervention is valid, rather than asserting a universal causal link.

  ### Summary
  The superposition/instrumentalist view dictates that interpretability safety claims are **heuristic and contextual**, not absolute.
  1.  **Mitigation** is suppression, not deletion.
  2.  **Verification** requires ensemble methods, not single audits.
  3.  **Security** requires testing for evasion, not just detection.
  4.  **Evidence** relies on control stability, not causal storytelling.

  Consequently, epistemic weight should be placed heavily on **stress-tested interventions** and lightly on **static feature identification**. A safety case built on the latter is vulnerable to the ontological instability of the features themselves.
