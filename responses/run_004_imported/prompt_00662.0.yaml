      *   **Schelling's Commitment Devices:** Making a threat credible by removing your own ability to back down (e.g., burning the bridge, removing the steering wheel). This aligns well with Program Equilibrium (the code *is* the commitment).
      *   **Schelling's "Threat that Leaves Something to Chance":** In games like Chicken or nuclear deterrence, being *too* predictable can be bad. If the opponent knows you will definitely retaliate, they might call the bluff. If there's a risk of accidental/uncontrollable retaliation, they are more scared. Ambiguity creates fear.
      *   **The Conflict:** Program Equilibrium demands determinism and provability (no ambiguity). Schelling's deterrence theory often relies on uncertainty (risk of loss of control).

