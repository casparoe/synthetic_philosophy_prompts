      *   *Newton:* Gravity requires a medium/cause that isn't mechanical. God's will acts directly.
      *   *Subtext:* Newton's Unitarianism (One God, One Kingdom) vs. Leibniz's Trinitarian/Orthodox harmony (though Leibniz was ecumenical, his metaphysics supports a rational, non-arbitrary God). *Correction:* The prompt specifically mentions Newton's anti-Trinitarianism driving the need for a singular dominion. I need to hint at Newton's view of God as a *Pantokrator* (Ruler of All) without him explicitly saying "I hate the Trinity." It needs to be about *Authority*.

