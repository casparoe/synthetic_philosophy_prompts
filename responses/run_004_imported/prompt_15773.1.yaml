answer: |-
  NEWTON: You treat the universe as a riddle to be solved by logic alone, Herr Leibniz. As if the Almighty were bound by your principle of sufficient reason.

  LEIBNIZ: I treat the universe as a work of wisdom, Sir Isaac. And wisdom implies choice. If space is absolute, as you claim—a vast, infinite container existing independently of the bodies within it—then I put it to you: why did God place the material world *here* rather than *there*? Why this orientation and not its mirror image? Shift the entire cosmos five feet to the left. What changes? Nothing. If nothing changes, there is no sufficient reason for the choice. And if there is no reason for the choice, God did not choose. He acted blindly.

  NEWTON: You confine Him to your logic. I tell you space is not a container. It is an emanation. It is the consequence of His existence. To deny absolute space is to deny that God is everywhere. Is He present only where matter is? Is there a void where He is not?

  LEIBNIZ: He is present by virtue, by operation, not by bulk. You make Him a part of the furniture. And worse, you make Him a clumsy craftsman. Your system of gravity requires miracles. The clock runs down, the motion decays, and so God must reach in and wind it up again. You have Him as a perpetual corrector of His own errors.

  NEWTON: I have Him as a King. A watch is a dead thing, wound by a spring. A kingdom is alive, ruled by a Will. Gravity is not a mechanism; it is the immediate fiat of the Creator. It does not need a mechanical cause because it *is* the cause. It is the dominion of the Sovereign over His subjects.

  LEIBNIZ: Dominion implies a territory. If that territory exists independently of Him, it limits Him. If it exists dependently, it is merely the relation of bodies. You speak of Sovereignty, yet you describe a God who is constantly intervening to fix a system that was imperfectly designed at the outset. A true Architect foresees the end from the beginning. He builds a machine that requires no winding. Pre-established harmony. No miracles needed, because the miracle is in the construction.

  NEWTON: Harmony without Will is a puppet show. You would have God bind His own hands so that He cannot act without violating your precious logic. You say He cannot choose one arrangement over another without a reason? His Will is the reason. He commands, and it stands. Not because it is the "best" of all possible worlds in some abstract calculus, but because He willed it.

  LEIBNIZ: And there we touch the nerve. You make His Will arbitrary. Power without Wisdom is tyranny, Sir Isaac. Even in the divine. If He can shift the world five feet for no reason, He is capricious. And if He is capricious, we cannot know Him by reason. We are left only with revelation. Or with force.

  NEWTON: We are left with Truth. Which you seem to have bartered away for diplomatic convenience. You speak of wisdom, yet you steal the methods of others to claim it. The calculus. You dress it in differentials to hide the source.

  LEIBNIZ: And you dress your physics in theology to hide the void. You cannot explain how action at a distance works, so you call it "Divine Will." It is a god of the gaps, painted larger with every edition of the *Principia*.

  NEWTON: It is not a gap. It is the Sensorium. Space is the Sensorium of God. He perceives all things, not through eyes, but through His immediate presence. To say space is relative is to say God's perception is relative. That He sees things only in relation to one another, and not as they truly are in His sight.

  LEIBNIZ: God does not need a sensorium. He does not need organs of perception. That is anthropomorphism. You make God a giant man, filling the infinite void, feeling the planets move through His nerves. It is idolatry.

  NEWTON: It is the only way to preserve His Reality. You want a God who is a philosopher, sitting in a study, deducing the best possible world. I know a God who is a Monarch. One Will. One Authority. Not a council, not a mystery of three-in-one that confuses the mind to protect the dogma. One Ruler. And His kingdom is absolute. If space is not absolute, His kingdom is a fiction.

  LEIBNIZ: One Ruler. Yes. I hear the emphasis. You require a singular dominion because you cannot abide a shared nature. But tell me, if God is a Monarch ruling over Absolute Space, is He bound by that space? Is He not then a prisoner of His own kingdom? If space is infinite and eternal, is it not co-eternal with Him? You risk making Space a second God.

  NEWTON: Space is not a second God. It is the shadow of His substance. It is where He *is*. You fear that if space is real, it limits Him. I tell you, if space is not real, He is nowhere. And if He is nowhere, He is nothing.

  LEIBNIZ: He is everywhere by power, not by position. You confuse presence with extension. It is the error of the materialist, dressed in the robes of the high priest. You want a God you can measure. A God who fits into your equations.

  NEWTON: I want a God who acts. Not a God who winds a watch and walks away to let your "harmony" play itself out like a music box. That is deism. That is atheism with a prayer book. My God governs. He sustains. He holds the planets in their orbits by the strength of His hand, moment by moment.

  LEIBNIZ: And if His hand slips? If the orbits decay? Then He failed. Perfection does not need to sustain; it endures. Your God is always working. Mine rests on the seventh day, because the work was finished.

  NEWTON: The work is never finished while there are rebels to subdue. While there is chaos to order. You speak of a finished world. I see a world that requires a Master.

  LEIBNIZ: A Master who demands absolute space demands a stage larger than Himself. You magnify His Kingdom to prove His Power, but you diminish His Wisdom to do it.

  NEWTON: And you magnify His Wisdom until there is no room left for His Power. You would have Him reason with the universe. I tell you, He commands it.

  LEIBNIZ: Then we are at an impasse. You have a Tyrant of the Void.

  NEWTON: And you have a Clockmaker who is dead.

  LEIBNIZ: I have a God who is Good.

  NEWTON: I have a God who Is.

  LEIBNIZ: Then let history judge which one actually rules.

  NEWTON: History is already written. In the stars.
