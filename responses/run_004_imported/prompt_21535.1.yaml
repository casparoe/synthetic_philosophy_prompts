prompt: |-
  My friend and I got into a long argument last night about wild animal suffering and neither of us really won. She's the ecology/conservation type and ran the classic Aldo Leopold land-ethic line at me: ecosystems and species are the real unit of value, and stuff like predation, parasites, and starvation aren't tragedies happening to individual animals, they're just what a healthy system looks like. I'm more the utilitarian type, closer to the 'wild animal welfare' crowd -- if a fawn dying slowly of screwworm larvae is agonizing, it's agonizing regardless of whether its ecologically useful. What I couldn't pin down afterwards is this: she wasn't just saying the ecosystem's interests outweigh the fawn's, she seemed to be saying suffering-talk doesn't even apply at that level, like bringing up the fawn's welfare in the first place was a category error. Is that an actual defensible philosophical move with real argument behind it, or is it just a sneaky way to dodge the utilitarian conclusion without admitting that's what's happening? Can you dig into what's really going on with that move -- in the weeds, not the 'nature is beautiful but brutal' surface-level stuff.
