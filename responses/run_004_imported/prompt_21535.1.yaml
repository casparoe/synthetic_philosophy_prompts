      *   **Holism vs. Individualism:** The metaphysical dispute over where moral standing resides.
      *   **The "Category Error" Claim:** This suggests that applying moral concepts (like suffering/welfare) to natural processes is like applying moral concepts to gravity or digestion. It's an *ontological* claim about the nature of wild animals vs. domestic/moral agents.
