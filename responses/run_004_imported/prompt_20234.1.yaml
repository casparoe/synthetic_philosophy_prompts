  2.  **Deconstruct the Ethical Philosophy:**
      *   **Kantian Deontology:** Focuses on duty and motive. For Kant, an action only has moral worth if done *from* duty, not just *in accordance* with duty. If the user does it for the scholarship (self-interest), Kant might say it lacks moral worth initially. However, if the motive shifts to duty/care, it gains worth. But Kant is strict about purity of motive.
      *   **Utilitarianism/Consequentialism:** Focuses on outcomes. The animals are helped, adoptions happen, the shelter runs smoother. The motive matters less than the result. The user is doing good regardless of *why*.
      *   **Virtue Ethics:** Focuses on character. Is the user *becoming* a virtuous person? Habits form character. Even if started for wrong reasons, the practice of volunteering cultivates empathy and kindness. Aristotle talked about habituation—doing good things makes you good, even if you start reluctantly.
      *   **Psychological Reality:** Human motivation is almost *never* pure. We crave recognition, validation, good feelings ("warm glow"), and tangible rewards alongside altruism. Demanding purity makes "goodness" impossible for almost anyone.

  3.  **Address the Friend's Argument (Dana):**
      *   Dana's stance: "Original sin" of motive taints everything. Mixed motives = selfish.
      *   Counter-argument: People change. Growth is real. The "residue" of self-interest (college apps) doesn't negate the current sacrifice of time/effort without *need*.
      *   The "College App" point: Mentioning volunteering in essays isn't necessarily selfish; it's showcasing commitment. It becomes selfish only if the volunteering *stops* once the essay is written. Since the user is *still* going, the essay benefit is secondary to the action.

