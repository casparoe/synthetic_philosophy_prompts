      *   **Reading B: Epistemological/Phenomenological.** Self-awareness is primitive and immediate. It doesn't *prove* the soul can exist without the body, only that our *awareness* of it doesn't come *through* the body. (Marmura's view).

  4.  **Evaluate the Objection (Conceivability $\neq$ Possibility):**
      *   This is the Arnauld objection to Descartes. Just because I can imagine X without Y doesn't mean X can exist without Y.
      *   Does this apply to Avicenna? Avicenna isn't relying *solely* on conceivability. He relies on the *presence* of the self to itself.

  5.  **Formulate a Stance:**
