      *   *Dualist Case:* It feels like a reductio. If you don't know your body but know yourself, you aren't your body. Avicenna wants to prove immortality.
      *   *Modest Case:* Marmura. The text says "he would affirm the existence of his *dhāt* (self/essence)." It's about *awareness*, not *ontological capability*.
      *   *The Objection:* The "Conceivability Gap." Just because I don't feel my liver doesn't mean I don't need it.
      *   *Resolution:* Avicenna's argument isn't "I can exist without body," it's "My *definition* doesn't include body." This blocks the objection. The objection attacks existential independence; Avicenna is proving essential distinctness.
