answer: |-
  Thank you all for being here.

  For those of you I haven't met, my name is [Your Name]. I'm a software engineer. I build things that run on servers and screens. I mention that because, by all rights, I shouldn't be standing here. I first walked into Professor Marsh's office five years ago because a friend told me her seminar was an "easy A." I lasted two weeks before I realized I was out of my depth, and two years after that before I realized I was exactly where I needed to be.

  For the last three years, I worked as Helen's research assistant. My job was to write the code that randomized trials and blinded data for her experiments into psychic phenomena. To the outside world, Helen Marsh was the great debunker. She was the one who exposed the mediums, the one who demanded double-blind protocols, the one who refused to let wishful thinking pass for data.

  But I want to tell you what I saw in the lab at two in the morning, when it was just the two of us and the hum of the computers. I didn't see a cynic. I saw a woman who desperately *wanted* to be wrong.

  Helen spent thirty years testing the boundaries of the unknown. But she didn't do it because she thought the universe was empty. She did it because she was haunted by a question she inherited from the philosopher Henry Sidgwick. He called it the "dualism of practical reason." In plain English, it's the worry that doing the right thing and doing the smart thing don't always add up to the same sum. We all know that feeling. Sometimes, being good costs you everything. Helen couldn't accept that a rational universe would be built on a lie. She needed to know if there was a "moral order"—some fact of the cosmos that guaranteed that duty and happiness eventually coincide.

  She refused to assume that order existed on faith. She knew many of you in her family have that faith, and she respected it. But for herself, she needed evidence. She needed to know that if she was good, the universe was good back.

  She never found that proof. She died without the conclusive answer she spent her life seeking. And she was scrupulously, painfully honest about that failure. She could have fudged a result. She could have softened her conclusion. She could have let herself believe. But she loved the truth more than she loved her own comfort. That is the hardest kind of integrity there is. To keep asking the question, even when the silence is the only answer you get.

  Now, I know there are stories. There are always stories when someone like Helen passes. Specifically, there is a story about a pact.

  Helen had two friends from her graduate school days, both of whom are here today. Decades ago, the three of them made a promise, modeled on the very philosophers they studied. They agreed that whoever died first would try to find a way to signal the others. To prove, empirically, that consciousness persists.

  I am standing here as someone who helped Helen design experiments for thirty years. I am standing here as someone who knows how rigorously she defined "evidence." And I need to say this, for her sake as much as yours: In the three weeks since she died, there has been no signal. No moving objects, no static on the radio, no inexplicable lights.

  I say this not to diminish hope, but to honor her. If Helen Marsh came back with a parlor trick, a cold draft, or a flickering bulb, it would not be her. It would be a violation of the very standards she held for thirty years. She taught us that we do not honor the dead by lying for them. We honor them by telling the truth about them.

  And the truth is, the lack of a sign is consistent with her life's work. She taught us that we must find meaning *here*, in the visible world, in the way we treat each other, because we cannot count on a guarantee from the next one.

  To her family: I know you loved her deeply, and I know many of you find comfort in the idea that she is watching over us now. I will not stand here and tell you she is not. I cannot know that. But I can tell you that she is present in this room. She is present in the rigor of her students, in the honesty of her published work, and in the two friends who kept their promise to her by showing up today, just as she kept hers to them.

  To her friends: You are waiting for the signal. I am watching the data with you. But perhaps the signal was never meant to be supernatural. Perhaps the signal was the thirty years of work itself. The signal is that she never gave up on the question.

  Helen never married. She had no children. In some traditions, that might be seen as a life incomplete. I am here to tell you it was not. Her family was her students, her colleagues, and the truth itself. She mothered ideas. She nurtured integrity. She protected the vulnerable from fraud because she believed people deserved to know what was real.

  I am going back to my code on Monday. I am going to build systems that work, that are transparent, that don't pretend to be something they aren't. That is how I will keep her alive.

  Helen, you wanted to know if the universe was moral. You wanted to know if love and duty were written into the stars. You didn't find the proof. But look at who is here today. Look at the friends who kept their pact. Look at the students who changed their careers to follow your lead. Look at the family who loved you despite the distance of your skepticism.

  Maybe the moral order isn't a fact we find in the data. Maybe it's something we build, in the dark, by refusing to lie. You built it. We are standing on it.

  Rest now. The experiment is over. The data is safe. We'll take it from here.

  Thank you.
