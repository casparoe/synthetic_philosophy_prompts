      *   **Address the Friend's Claim:** Explain *why* randomness doesn't solve the problem. (Randomness $\neq$ Control). Use the "Roll of the Dice" analogy.
      *   **Explore the "Unease":** Dig into *why* it feels unearned. Introduce the concept of "Constitutive Luck."
      *   **Offer Alternative Frameworks:**
          *   *Compatibilism:* Redefine "desert" not as metaphysical authorship but as functional recognition.
          *   *Gratitude vs. Pride:* Shift the emotional stance. You can accept praise as acknowledgment of impact without claiming metaphysical ownership.
          *   *Forward-looking Responsibility:* Praise is useful for reinforcing behavior, not just rewarding past metaphysical causation.
      *   **Synthesize:** The user's unease is real and philosophically sound. The friend's answer is a common but flawed defense. However, life still requires functioning within the system of praise/blame.

  6.  **Drafting - Section by Section (Mental Outline):**
