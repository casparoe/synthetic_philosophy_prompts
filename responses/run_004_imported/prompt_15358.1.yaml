answer: |-
  Your unease is not only valid; it is philosophically sophisticated. You have stumbled upon one of the oldest and most difficult problems in philosophy, often called the problem of **ultimate moral responsibility**.

  Your friend's intuition is a common one, but most philosophers who specialize in free will would agree with you: **randomness does not save responsibility.** In fact, introducing randomness often makes the problem worse.

  Here is a breakdown of why your friend's answer fails to satisfy, why your unease is pointing at something real, and how you might navigate this without falling into nihilism.

  ### 1. Why Randomness Doesn't Grant Credit
  Your friend argues that because the brain has indeterministic elements (quantum noise, neural randomness), your choices aren't fully determined by the past. Therefore, you are free.

  The problem with this is that **randomness is not control.**

  Imagine you are making a difficult choice between working hard or slacking off.
  *   **Scenario A (Determinism):** Your choice is the inevitable result of your genes, upbringing, and current brain state. You couldn't have done otherwise.
  *   **Scenario B (Randomness):** Your choice is influenced by a random neural fluctuation.

  In Scenario A, you are a puppet of the past. In Scenario B, you are a puppet of chance. Neither scenario gives *you*—the conscious agent—authorship over the decision. If a choice pops into your head because of a random quantum event, that isn't "your" doing any more than a muscle twitch is. To deserve credit, you need to be the *source* of the action, not just the location where a random event happened.

  This is known as the **"Luck Pincer" argument**: If your actions are determined, they are a matter of luck (constitutive luck). If your actions are random, they are also a matter of luck. In neither case do you seem to have the kind of "contra-causal" freedom required to claim ultimate credit.

  ### 2. Your Unease is About "Constitutive Luck"
  Your intuition that your discipline is "downstream" of your temperament and upbringing is what philosophers call an acknowledgment of **constitutive luck**.

  *   **Circumstantial Luck:** The situations you find yourself in (e.g., lucky breaks).
  *   **Constitutive Luck:** The person you *are* (your temperament, your capacity for focus, your resilience).

  You didn't choose your parents, your genetics, or the early environment that wired your brain for discipline. Since your efforts flow from *who you are*, and you didn't choose *who you are*, it feels logically inconsistent to take ultimate credit for the efforts.

  Your unease is real because you are sensing that **you cannot be the cause of yourself.** To truly deserve credit in the absolute sense, you would have had to choose your own nature *before* you had a nature to choose with. Since that is impossible, the feeling that praise is "unearned" is metaphysically accurate.

  ### 3. So, Is the Praise Meaningless?
  If we can't claim ultimate metaphysical credit, does that mean we should reject praise? Not necessarily. There are two ways to reframe this that preserve meaning without requiring magic.

  **A. The Compatibilist Shift (Function over Metaphysics)**
  Philosophers like Daniel Dennett argue that we should stop looking for "magic" free will and look at what free will *does*. In a social context, "deserving credit" isn't about being an uncaused cause; it's about being a reliable agent.
  *   When people praise you, they aren't making a metaphysical claim about your soul. They are acknowledging that **you are the locus of the action.**
  *   Praise is a feedback mechanism. It reinforces the behavior in you and signals to others that this behavior is valuable. You can accept the praise as a recognition of your *agency* (your ability to act on reasons) without claiming *ultimate authorship*.

  **B. Gratitude Instead of Pride**
  Your realization allows you to shift from **pride** to **gratitude**.
  *   **Pride** says: "I am great because I did this entirely on my own." (This is what feels unearned).
  *   **Gratitude** says: "I am lucky that I have the capacity to do this, and I am glad I used it."

  You can accept the compliment ("You worked so hard") by internally translating it ("Yes, I did work hard, and I am fortunate that I was capable of that work"). This dissolves the imposter syndrome without denying the reality of your effort. The effort was real, even if the *capacity* for effort was given.

  ### 4. Why This Realization is Healthy
  Paradoxically, accepting that you don't have ultimate control can be incredibly liberating.
  *   **It softens arrogance:** If you succeed, you recognize the luck involved, keeping you humble.
  *   **It softens self-flagellation:** If you fail or struggle, you don't have to view it as a fundamental moral failing. You can view it as a breakdown in conditions or capacity, which can be addressed with compassion rather than shame.

  ### Conclusion
  Your friend is trying to comfort you with a scientific version of a soul (randomness = freedom), but it doesn't hold up to scrutiny. **Your unease is pointing at something real:** We are not prime movers. We are products of causes we didn't choose.

  However, this doesn't mean your work was worthless or that you are a fraud. It means you are a vessel through which certain capacities flowed into the world. You can accept the praise not as a judgment on your metaphysical worthiness, but as a celebration of what happened *through* you.

  You don't need to be the "uncaused cause" of your discipline to be glad that the discipline exists.
