      *   Structure: Introduction -> The Analogy -> Epistemicism vs. SV on HOV -> The Regress of Fixes -> Conclusion.
      *   Key Terminology: Admissible precisifications, Supertruth, Bivalence, Determinacy operator ($D$), Collapsing Principle.

  8.  *(Self-Correction during drafting)*: I need to be careful with the "thermodynamic limit" analogy. In physics, the singularity is *real* in the model but *approximate* in reality. In SV, the sharp boundary of admissibility is supposed to be *semantic*, not ontological. The problem is that if the semantic boundary is vague, the semantics breaks.
      *   *Better analogy:* The "sharp cutoff" in SV is the boundary of the set of admissible precisifications. In physics, this is like the boundary of the ensemble. If the ensemble definition is vague, the partition function is ill-defined.

  9.  **Final Review against User Prompt:**
      *   Explain why HOV is a special problem for SV? Yes.
