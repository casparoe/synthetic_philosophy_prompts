answer: |-
  It is a pleasure to engage with a colleague who brings such a sophisticated conceptual toolkit to the philosophy of language. Your analogy between the thermodynamic limit and supervaluationism is not only apt but illuminates the structural tension at the heart of the debate.

  In condensed-matter physics, you accept that the non-analytic singularity (the phase transition) is an idealization valid only as $N \to \infty$. For finite $N$, the partition function is analytic; the "transition" is a crossover region. Supervaluationism (SV) attempts a similar maneuver: it posits a "semantic limit" (the set of all admissible precisifications) where classical bivalence is restored (a sentence is supertrue if true in *all* precisifications), while acknowledging that for any single precisification (or "finite system"), the boundary is arbitrary.

  The problem of Higher-Order Vagueness (HOV) strikes at the stability of that limit. Here is the technical breakdown of why this is a distinctive crisis for supervaluationism compared to epistemicism, and why the standard "renormalization" attempts (iterated precisification) generally fail to stabilize the theory.

  ### 1. The Distinctive Embarrassment: Semantics vs. Ignorance

  To understand why HOV is worse for SV than for epistemicism, we must distinguish between an *ontic/semantic* gap and an *epistemic* gap.

  **Epistemicism (Williamson):**
  Williamson bites the bullet: there is a sharp cutoff. For a heap predicate $H$, there is some integer $n$ such that $H(n)$ is true and $H(n+1)$ is false.
  *   **HOV in Epistemicism:** Williamson accepts HOV. There is a boundary between the clear cases and the borderline cases, and a boundary between the borderline cases and the clear non-cases. We simply cannot know where any of these boundaries are.
  *   **Why it survives:** Epistemicism preserves classical logic and bivalence at every order. The "regress" of boundaries is absorbed into a regress of ignorance. The semantics remains crisp; the limitation is purely in our access (our "measurement apparatus," to use your parlance). The theory is internally consistent; it is just counterintuitive.

  **Supervaluationism:**
  SV attempts to respect the intuition that there is *no* sharp cutoff in reality (or meaning), while retaining classical logic for "supertruth."
  *   **The Mechanism:** A sentence $\phi$ is supertrue ($\models \phi$) iff $\phi$ is true on all **admissible** precisifications.
  *   **The HOV Attack:** Is the set of *admissible* precisifications sharply defined?
      *   **Option A: Yes.** If there is a sharp boundary between admissible and inadmissible precisifications, then there is a fact of the matter about which precisifications count. This collapses SV into a form of epistemicism. The "vagueness" is merely our ignorance of which precisification is the correct one (or which set is the admissible one). SV loses its main selling point: explaining vagueness without sharp boundaries.
      *   **Option B: No.** If the boundary of admissibility is itself vague, then the definition of supertruth is vague. Consequently, the logic itself becomes indeterminate. We cannot say determinately whether a sentence is a logical validity, because the set of models (precisifications) over which we quantify is ill-defined.

  **The Crucial Difference:**
  For the epistemicist, HOV is a feature of our *knowledge* (we don't know where the boundary of knowledge lies). For the supervaluationist, HOV is a feature of the *semantics*. If the semantics is vague, the truth-conditions are undefined.
  In your physics analogy:
  *   **Epistemicism:** The critical temperature $T_c$ exists sharply, but our thermometer has infinite error bars at the transition.
  *   **Supervaluationism:** The critical temperature $T_c$ is defined as the limit of finite systems. HOV asks: "Is the limit taken sharply?" If the definition of the limit itself suffers from finite-size ambiguity, the singularity never truly forms. The partition function remains analytic everywhere, and the "phase transition" (classical logic) never actually emerges.

  ### 2. The Technical Regress: The Determinacy Operator

  Formally, SV introduces a determinacy operator $D$. $D\phi$ is true iff $\phi$ is true on all admissible precisifications.
  *   First-order vagueness: $\phi$ is true, $\neg\phi$ is true, but $D\phi$ is false (borderline).
  *   Higher-order vagueness: It is borderline whether $\phi$ is borderline. That is, $D\phi$ is neither supertrue nor superfalse.

  This leads to the **Collapsing Principle** (often associated with Williamson's critique of SV). If SV is to account for HOV, it must allow that $D\phi$ can be indefinite. But if $D\phi$ is indefinite, then the set of precisifications where $D\phi$ holds is not sharply separated from those where it doesn't.
  If the set of admissible precisifications is not sharp, then the relation "is admissible" is vague. But SV semantics relies on quantifying over this set to define truth. If the domain of quantification is vague, classical quantification rules fail. SV claims to preserve classical logic (e.g., Excluded Middle: $\phi \vee \neg \phi$), but if the validity of the logic depends on a vague domain, we cannot assert *determinately* that Excluded Middle holds.

  Thus, SV faces a dilemma:
  1.  **Preserve Classical Logic:** Deny HOV (claim $D\phi$ is always sharp). This contradicts the linguistic data (it seems there are borderlines of borderlines).
  2.  **Accommodate HOV:** Admit the semantics is vague. This sacrifices the claim that SV provides a precise, classical semantics for vague language.

  Epistemicism does not face this because it posits a sharp domain from the start. It doesn't need to *construct* sharpness from vague materials; it asserts sharpness is fundamental.

  ### 3. Do the Fixes Work? (Iterated and Relativized Precisification)

  Philosophers have attempted to "renormalize" SV to handle this regress. The two main approaches are **Iterated Supervaluationism** and **Contextualism/Relativism**.

  #### Iterated Supervaluationism
  The idea is to define a hierarchy of admissibility. A precisification is admissible* at level 1* if it respects usage. It is *admissible at level 2* if it is admissible at level 1 and respects the "definiteness" of level 1, and so on.
  *   **The Hope:** This mimics the hierarchy of determinacy operators ($D, DD, DDD...$).
  *   **The Failure:** This does not block the regress; it formalizes it. It pushes the vagueness up to the question: "At which level does the admissibility become sharp?"
      If the transition from level $k$ to $k+1$ is smooth (no sharp jump in admissibility), you never recover the sharp semantics required for classical logic.
      If there is a sharp jump at some level $K$, you have simply reintroduced a sharp cutoff (epistemicism) at a higher order.
      Furthermore, this leads to **validity problems**. In standard SV, a valid argument preserves supertruth. In iterated SV, an argument might preserve supertruth at level 1 but fail at level 2. This fragments the notion of logical consequence, which was supposed to be the stronghold of SV.

  #### Relativized Precisification (Contextualism)
  This approach suggests that "admissible" is context-sensitive. In a context where we are discussing fine distinctions, the set of admissible precisifications shrinks (becomes more precise).
  *   **The Hope:** Vagueness is modeled by the shift in context, not by a gap in truth values.
  *   **The Failure:** This relocates the problem to the **contextual boundary**. What determines when a context shifts? If the rules for context shift are sharp, we are back to epistemicism about contexts. If they are vague, we need a meta-context to define them, leading to a regress of contexts.
      Additionally, this struggles with **embedded contexts**. If I say, "It is indefinite whether it is indefinite whether this is a heap," I am nesting the vagueness within a single utterance. A contextual shift theory struggles to account for multiple orders of vagueness within a fixed context.

  ### 4. Summary via Your Analogy

  Let us return to your finite-size scaling analogy.

  *   **The Physical System:** A magnet of size $L$.
  *   **The Observable:** Magnetization $M$.
  *   **The Transition:** At finite $L$, $M$ changes smoothly. At $L \to \infty$, $M$ is non-analytic at $T_c$.

  **Supervaluationism** claims that natural language works like the $L \to \infty$ limit. It says: "Strictly speaking (semantically), there is a sharp $T_c$ (truth condition), defined by the limit of all admissible precisifications."
  **HOV** points out: "But the definition of the limit depends on the boundary conditions (admissibility). If the boundary conditions are vague (which precisifications count?), the limit is ill-defined. You don't have a singularity; you have a smoothed crossover, just like the finite system."

  **Epistemicism** claims: "The system is actually finite ($L$ is fixed), but there is a specific configuration of spins that constitutes the 'true' state. We just can't measure it." It accepts the finite nature but insists on a definite state.

  **The Verdict on Fixes:**
  The iterated fixes are akin to saying, "Well, let's take the limit of the limit." But if the convergence criteria for the first limit are vague, taking a second limit doesn't help. You are essentially trying to define a singularity using a function that is itself non-analytic in its parameters.

  Most contemporary consensus (even among those sympathetic to SV) is that these fixes **relocate** the problem rather than solve it. They push the vagueness from the object language to the meta-language (the definition of admissibility).
  *   If the meta-language is precise, SV collapses into epistemicism (there is a sharp fact about admissibility).
  *   If the meta-language is vague, SV fails to provide the classical semantics it promised.

  ### Conclusion

  You have correctly identified the structural weakness. Supervaluationism tries to have its cake and eat it too: it wants the semantic precision of the thermodynamic limit (to save classical logic) without the ontological commitment to the singularity (to save the intuition of no sharp boundaries).

  Higher-order vagueness demonstrates that you cannot construct a sharp semantic limit out of vague materials without either:
  1.  Smearing the limit (losing classical logic).
  2.  Stipulating the limit is sharp (becoming epistemicism).

  Epistemicism avoids the embarrassment by accepting (2) immediately. Supervaluationism tries to hide it behind the machinery of precisifications, but HOV pulls back the curtain. The standard fixes are analogous to adding counter-terms to a divergent series without resolving the underlying divergence; they make the bookkeeping more complex but do not render the sum finite.

  For a physicist, the most honest take might be **Epistemicism** (there is a sharp cutoff, we just lack the resolution) or a **Degree Theory** (fuzzy logic), where the "order parameter" (truth value) is continuous, accepting that the logic will be non-classical (just as finite systems don't show true non-analyticity). Supervaluationism's attempt to enforce classical logic on a continuous phenomenon via an idealized limit is what makes HOV its specific Achilles' heel.
