          *   Supertruth = Property holding in the limit.
          *   Borderline = Finite size effects where the order parameter is undefined.
      *   *Section 2: Why HOV hits SV harder than Epistemicism.*
          *   *Epistemicism:* Sharp cutoff at every order. Like saying there *is* a critical temperature $T_c$, even if our thermometer has error bars. The error bars (ignorance) can be nested, but $T_c$ is real.
          *   *Supervaluationism:* Claims there is *no* sharp cutoff in reality (only in the semantics). HOV asks: "Is the set of admissible precisifications sharp?"
          *   *The Crunch:* If the set of admissible precisifications has a sharp boundary, SV collapses into epistemicism (there is a fact of the matter about which precisifications are allowed). If it *doesn't* have a sharp boundary, then "supertruth" is not a well-defined classical property. It undermines the semantic machinery.
          *   *Logic:* SV wants classical logic. HOV forces non-classical logic to describe the semantics of vagueness.
      *   *Section 3: The Fixes (Iterated Supervaluationism).*
          *   Graff Fara, Williamson's critiques.
