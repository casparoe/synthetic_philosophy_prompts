      *   **Core Analogy:** Compares the thermodynamic limit (where sharp phase transitions exist) to supervaluationism (where sharp cutoffs exist in the space of admissible precisifications). Notes that finite systems (like actual heaps) lack sharp boundaries, similar to how finite precisifications might lack sharp boundaries of admissibility.
      *   **The Question:** Why is higher-order vagueness (HOV) considered a *special* problem for supervaluationism compared to epistemicism (Williamson)? Do standard fixes (relativized/iterated precisification) solve the regress or just move it?
      *   **Requirement:** Technical care, respecting the user's physics background (using analogies where helpful but maintaining philosophical rigor).

  2.  **Deconstruct the Philosophical Issues:**
      *   **Supervaluationism (SV):** Truth is supertruth (true on all admissible precisifications). Borderline cases are neither supertrue nor superfalse.
      *   **The Problem of HOV for SV:** If "is admissible" is vague, then the set of admissible precisifications is vague. If the set is vague, the definition of supertruth is vague. If supertruth is vague, the logic itself loses its classical precision (which was SV's selling point).
      *   **Epistemicism (Williamson):** There *is* a sharp cutoff (bivalence holds). We just don't know where it is. HOV exists (we don't know where the boundary of knowledge is), but it doesn't threaten the *logic* or the *metaphysics* in the same way. It's just ignorance all the way up.
      *   **The Analogy:**
          *   SV: Sharp transition in the limit (idealized admissibility).
          *   Finite System: Smoothed transition (actual usage).
          *   HOV: Uncertainty about the boundary conditions of the limit itself.

  3.  **Address the Specific Question: Why is HOV worse for SV than Epistemicism?**
      *   *Epistemicism:* Commits to sharp boundaries at every order. $P$, $\neg P$, $K(P)$, $\neg K(P)$, etc. The logic remains classical. The "embarrassment" is counterintuitive (there is a fact of the matter about whether $n$ grains make a heap), but the theory is internally consistent regarding HOV. It absorbs HOV as higher-order ignorance.
      *   *Supervaluationism:* Aims to save intuition (no sharp boundary) while keeping classical logic (mostly). But HOV threatens the *mechanism* of SV. If "admissible" is vague, the semantic value (Supertruth) is ill-defined. It creates a gap in the semantics, not just ignorance. It threatens the claim that SV preserves classical logic *determinately*.
      *   *Key Distinction:* Epistemicism says the boundary is sharp but unknown. SV says the boundary is non-existent (gappy). HOV asks: "Is the gap sharp?" If SV says "No," it seems to need a logic that handles gaps about gaps, potentially losing classical validity. If SV says "Yes," it looks like epistemicism in disguise.

  4.  **Evaluate the "Fixes" (Iterated/Relativized Precisification):**
      *   *Idea:* Define admissibility relative to a context or level.
