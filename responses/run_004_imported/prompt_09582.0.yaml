      *   **Tone:** Professional, thoughtful, fair, firm but nuanced. Needs to sound like a responsible student leader.

  2.  **Deconstruct the Ethical/Logical Problem:**
      *   **The Case:** Student wrote the draft, AI reworded 2 paragraphs.
      *   **The Code:** Bans "someone or something else do the work for you."
      *   **The Defense:** Grammarly is allowed (fixes sentences). AI rewording is just advanced Grammarly. If 1 sentence is okay, 2 is okay... where is the line? (Sorites Paradox). Therefore, punishing him is arbitrary/unfair.
      *   **The Counter-Argument:** The line isn't about *quantity* (sentences/paragraphs); it's about *cognitive agency* and *substantive contribution*. Grammarly corrects errors; AI rewording changes voice and synthesis. The "work" isn't just typing words; it's crafting meaning.
      *   **The Policy Gap:** The current policy is too vague regarding AI. It needs to distinguish between *editing tools* and *generative/substantive tools*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the complexity. Set the tone (this isn't business as usual).
      *   **Addressing the Defense (The Sorites Argument):** This is the core intellectual challenge. I need to validate the logic but show why it doesn't apply here.
          *   *Validation:* Yes, vague policies are problematic. Yes, the "heap" paradox is real.
          *   *Refutation:* The distinction isn't a sliding scale of *amount* (1 sentence vs. 2 paragraphs). It's a categorical difference in *function*. Grammarly = Polish (surface level). AI Rewording = Co-authoring (structural/semantic level). The "line" is drawn at *authorship of ideas/expression*, not word count.
      *   **Recommendation for the Current Case:**
