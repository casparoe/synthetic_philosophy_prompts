          *   *Crucial Nuance:* Galileo's principle is actually *more* respectful of Scripture's purpose (salvation vs. physics), whereas Bellarmine conflates phenomenological language with ontological claim.
      *   *Conclusion:* Galileo's principle is superior *in theory*, but Bellarmine's caution was *in practice* justified by the state of evidence in 1615. The failure wasn't the principle, but the application (Galileo's overconfidence).

