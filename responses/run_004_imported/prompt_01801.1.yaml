answer: |-
  This is a classic debate in contemporary aesthetics, centered on the work of **Tino Sehgal**. You've stumbled into a argument that art critics and philosophers have been having for about 50 years, specifically regarding Conceptual Art and Performance Art.

  Here is a breakdown of their exchange move-by-move, an assessment of who holds the stronger ground at each step, and an analysis of the blind spots they both share.

  ### Round 1: The Definition of the Object
  **Jake:** "It doesn't count as art -- it's just an elaborate customer-service interaction."
  **Mei:** "By that logic a play or a symphony isn't art either... the performance itself is just as temporary."

  *   **Who is right?** **Mei takes this round on technical grounds, but Jake identifies the visceral problem.**
  *   **The Analysis:** Jake is relying on a traditional definition of art that requires a tangible, enduring object (a painting, a sculpture). By that metric, he is logically consistent: if art = object, this isn't art. However, art history abandoned that definition over a century ago. Mei is correct that ephemeral art exists (theater, dance, music). A symphony is not the sheet music; it is the sound in the room.
  *   **The Nuance:** Jake's "customer service" comment is actually a sharp observation of the *aesthetic*. Sehgal's work *is* designed to blur the line between social interaction and performance. Jake feels duped because the "frame" of art isn't obvious. Mei is right that the *category* holds, but she glosses over why Jake feels tricked: in a play, the separation between actor and audience is clear. In Sehgal's work, that boundary is intentionally violated, which creates the confusion Jake is feeling.

  ### Round 2: The "Museum Fiat" Argument
  **Jake:** "To him 'the museum called it art' is basically like closing a bug ticket as 'working as intended,' it doesn't actually explain anything, it just ends the conversation."
  **Mei:** (Implicitly counters later) "Not writing something down isn't the same as not selling it... it's just normal plumbing."

  *   **Who is right?** **Jake wins this point decisively.**
  *   **The Analysis:** Jake has accidentally articulated a critique of the **Institutional Theory of Art** (championed by philosopher George Dickie), which states roughly that art is whatever the "artworld" says it is. Jake's "bug ticket" analogy is brilliant. It points out that saying "It's art because the museum says so" is a circular argument that shuts down inquiry rather than satisfying it. It is an appeal to authority, not evidence.
  *   **The Nuance:** Mei doesn't directly address this in your summary, but her later point about "plumbing" tries to normalize the institution's role. Jake is right that "because the museum says so" is not a *philosophical* explanation, even if it is a *sociological* fact.

  ### Round 3: The Intent of Absence
  **Mei:** "The refusal to leave any record... is the actual point, a comment on how we flatten every experience into something photographable and resellable."
  **Jake:** (Counters in next round) "Sure, but they DO resell it, for real money... 'resisting commodification' is just a good story."

  *   **Who is right?** **Mei is right about the Artist's Intent; Jake is right about the Economic Reality.**
  *   **The Analysis:** Mei accurately describes Sehgal's stated philosophy. He wants to create an "economy of affect" rather than things. In terms of interpreting the work's internal logic, she is correct. However, Jake lands a heavier blow regarding the external reality. This is the critique of **Recuperation**: the idea that capitalism is so flexible it can sell the critique of capitalism back to you as a luxury product.
  *   **The Nuance:** You cannot have it both ways. If the work claims to resist the market, but is sold for $100,000 to a billionaire's museum, the claim is compromised. Mei tries to defend this in the next round, but Jake's point here is the strongest philosophical objection to Sehgal's work.

  ### Round 4: The Mechanics of Sale
  **Jake:** "They want credit for being above the market while being extremely, extremely in the market."
  **Mei:** "Plenty of stuff nobody doubts is art (site-specific installs, whatever) also gets bought and sold as contracts or rights instead of objects, so this isn't some special hypocrisy, it's just normal plumbing."

  *   **Who is right?** **Mei is factually correct; Jake is morally correct.**
  *   **The Analysis:** Mei is right about the mechanics. You cannot buy a site-specific installation by Sol LeWitt or a performance by Marina Abramović in the same way you buy a vase. You buy the *certificate*, the *rights*, and the *instructions*. This is standard art market "plumbing."
  *   **The Nuance:** However, Jake is pointing out a dissonance in the *branding*. Most art admits it is a commodity. Sehgal's brand is built on the *refusal* of commodification (no photos, no objects, no paper). Jake is arguing that selling a "refusal" is more hypocritical than selling a "thing." Mei treats the sale as neutral mechanics; Jake treats the sale as a betrayal of the work's message. Both are valid perspectives: one legalistic, one ethical.

  ---

  ### What Both of Them Are Missing

  **1. The "Viewer as Co-Creator" Element**
  Neither Jake nor Mei mentions that in Sehgal's work, the visitor completes the art. If an interpreter talks to you and you walk away, the art is different than if you engage for 20 minutes.
  *   **Why it matters:** Jake treats the interaction as something done *to* him (like customer service). Mei treats it as a performance to be observed. Both miss that the *uncertainty* Jake feels is the medium. The awkwardness is the point.

  **2. The Class Dimension**
  Mei defends the "experience" over the "object." But who gets to have the experience?
  *   **Why it matters:** An object can be reproduced (prints, books, screens) and seen by millions. A Sehgal piece can only be seen by people physically present in that museum at that time, often in wealthy cities (NYC, London, Berlin). By refusing documentation, the art becomes *more* exclusive, not less. Jake's cynicism about the market misses this, but Mei's defense ignores that "anti-commodification" art is often the most commodified because it is so scarce.

  **3. The "Verbal Contract" Nuance**
  You mentioned the contract is verbal before a notary.
  *   **Why it matters:** This is legally distinct from "no contract." It creates a legal obligation without creating a physical artifact. Mei calls this "plumbing," but it's actually a performative legal act that mirrors the art itself. Both of them treat the sale as secondary to the art, but in Conceptual Art, the *transfer of ownership* is often part of the conceptual framework.

  ---

  ### The Big Question: Is there a principled line, or is it just "Artworld Fiat"?

  You asked if there is a real, principled line buried here, or if it dissolves into "whatever the artworld decides."

  **The Short Answer:** It is not *just* fiat, but the line is much thinner than people want to admit.

  **The Long Answer:**
  There are three main philosophical definitions of art at play here, and your friends are arguing past each other using different ones:

  1.  **Functionalism (Jake's view):** Art must serve a specific function (beauty, skill, objecthood). If it doesn't do the job, it isn't art. *Problem:* This excludes photography (when it was new), Duchamp's urinals, and music.
  2.  **Historical/Intentional (Mei's view):** Art is something created with the intention of being regarded as art, within the context of art history. *Problem:* This risks the "bug ticket" circularity Jake hates. If I intend my sneeze to be art, is it art?
  3.  **Institutional (The Museum's view):** Art is what the artworld confers status upon. *Problem:* This makes art an exclusive club protected from critique.

  **The Verdict:**
  There is a principled line, but it isn't based on **objects**. It is based on **context and framing**.

  If a museum guard strikes up a conversation with you at Home Depot, it is customer service. If they do it in a gallery, with the history of performance art behind them, with a curator overseeing it, and with the intent to provoke a reflection on human interaction, it is art.

  **Jake is right** that "The museum says so" is an unsatisfying answer for *why* it is meaningful.
  **Mei is right** that "The museum says so" is the accurate description of *how* it is categorized.

  **Who won the dinner?**
  *   **Jake** won on **ethics and economics**. He correctly identified that "resisting the market" is a marketing strategy that increases market value. That is a profound critique of late-stage capitalism.
  *   **Mei** won on **art history and classification**. She correctly identified that ephemerality and lack of objects do not disqualify something from being art.

  **The Synthesis:**
  The reason the dinner got heated is that Jake is arguing about **Value** (Is this a scam? Is it hypocritical?), while Mei is arguing about **Category** (Is this art?).
  *   Something can be **Art** (Mei is right) and simultaneously be **Hypocritical/Problematic** (Jake is right).
  *   Sehgal's work *is* art. It is also *possibly* a hypocritical luxury product that critiques the very system funding it. Both statements can be true.

  The "bug ticket" analogy is the keeper here. Jake is frustrated because he wants to know *why* it's good, and Mei keeps telling him *what* it is. In the modern art world, "What" often supersedes "Why," and that is exactly what makes people want to flip tables at dinner.
