prompt: |-
  My wife and I are in the middle of an IVF cycle and just got back genetic screening results on our four viable embryos. Beyond the standard test for chromosomal abnormalities, the clinic offers an add-on panel that scores each embryo's genetic risk for things like heart disease and certain cancers, and by those scores one embryo looks meaningfully healthier than the one our doctor would otherwise recommend transferring first. My wife believes that once this information exists, we're ethically obligated to transfer the lower-risk embryo, since choosing any other one would mean knowingly bringing a worse-off child into the world. Something about that argument doesn't sit right with me, though: whichever embryo we transfer becomes its own distinct person, so we wouldn't be making one child healthier or sicker by picking among them, we'd be deciding which of several different possible children gets to exist at all, and the ones we don't choose simply never live rather than living worse lives. Is my wife right that we're obligated to always transfer whichever embryo has the best odds, or is there a real problem with that reasoning that I'm just struggling to put into words?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user and his wife are undergoing IVF. They have four viable embryos. They have PGT-A (aneuploidy) results and are considering a PGT-P (polygenic risk score) add-on.
      *   **The Conflict:** One embryo has better polygenic risk scores (PRS) for common diseases (heart disease, cancer) than the one the doctor recommends based on standard criteria (likely morphology/aneuploidy/implantation potential).
      *   **Wife's Position:** Ethical obligation to transfer the "healthier" embryo (lower risk). Argument: Choosing a higher-risk embryo means knowingly bringing a "worse-off" child into the world.
      *   **User's Position:** Skeptical of the obligation. Argument: Non-identity problem. Choosing a different embryo means a *different* child comes into existence. The unchosen embryos don't live worse lives; they don't live at all.
      *   **The Question:** Is the wife right about the obligation, or is there a flaw in her reasoning (specifically regarding the non-identity problem)?

  2.  **Identify the Core Ethical/Philosophical Issues:**
      *   **The Non-Identity Problem:** This is the exact philosophical concept the user is intuiting. Formulated by Derek Parfit. It challenges the idea that we harm a specific person by choosing to bring them into existence with a certain condition, provided their life is still worth living, because without that choice, *they* wouldn't exist.
      *   **Procreative Beneficence:** The principle (often associated with Julian Savulescu) that parents have a moral obligation to select the child who is expected to have the best life. This aligns with the wife's view.
      *   **Limitations of PGT-P (Polygenic Risk Scores):** This is a crucial scientific/medical context. PRS for common diseases are probabilistic, not deterministic. They are based on population data that may not apply perfectly to individuals. Environmental factors play a huge role. The "meaningfully healthier" claim might be statistically overstated.
      *   **Clinical Priorities:** The doctor's recommendation is likely based on implantation potential (morphology, aneuploidy status). A "healthier" genetic profile is useless if the embryo doesn't implant.
      *   **Psychological/Emotional Impact:** The stress of "perfect selection," potential regret, and the commodification of embryos.

  3.  **Drafting the Response - Structure:**
