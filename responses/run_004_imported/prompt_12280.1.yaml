answer: |-
  Here is a draft of ten interview questions tailored to your background as engineers and your desire to move past the standard exposition. I have structured the three required topics with the specific "Likely Answer/Follow-up" format you requested, while keeping the tone conversational but technically precise.

  ### **Part 1: The Intuition Gap (Counterfactual Mugging)**

  **1.** Let's start with the emotional resistance to Updatelessness. In the Counterfactual Mugging, once I see the coin is tails, paying $100 feels like burning money for no causal return. It violates the "sunk cost" heuristic that usually keeps agents efficient. You argue we should pay because it was optimal *ex-ante*. But is that intuition just a bug in human psychology, or is there a deeper structural reason why "rationality should win" feels like "rationality should make sense in the moment"?

  *   **Likely Answer:** She will likely say it's a conflict between *act-based* rationality (maximizing given current state) and *policy-based* rationality (maximizing given prior state), and that our intuition is trained on causal environments where updatelessness doesn't pay.
  *   **Follow-up:** If that's the case, how do we mechanically enforce the *ex-ante* view in an agent that physically exists *ex-post*? If I'm writing code for an AI, do I need to literally lock the agent out of seeing the coin flip result, or is there a way to structure the objective function so it "sees" the tails but optimizes as if it didn't?

  ### **Part 2: Mechanics of the Prior & Logical Uncertainty**

  **2.** You mentioned optimizing "from the prior." As engineers, we think of state as something that accumulates. If my agent has a variable `coin_result = tails`, evaluating the policy "from the prior" seems to require ignoring that variable. Is updatelessness essentially a constraint on what information is allowed into the decision function, or is it a specific way of weighting the utility function that cancels out the new information?

  *   **Likely Answer:** She will likely distinguish between *indexical/empirical* uncertainty (the coin) and *logical* uncertainty (math), noting that for empirical facts, you condition on the prior, but for logical facts, it's trickier because the agent computes them.
  *   **Follow-up:** That distinction is crucial for us. If the uncertainty is logical—say, the millionth digit of Pi—and I compute it and find it's 7, I can't "un-compute" that. Does UDT demand I act as if I *haven't* computed it? If so, doesn't that require the agent to be logically ignorant by design, which seems like a vulnerability in any competitive environment where knowing Pi is useful?

  ### **Part 3: UDT1 vs. UDT1.1 (The Policy Shift)**

  **3.** I want to touch on the evolution of the theory. My understanding is that the original formulation (UDT1) optimized the action for a given observation, while the patch (UDT1.1) optimized the entire observation-to-action mapping as a single object. Could you walk us through the specific failure mode in UDT1 that necessitated this? Was it a problem of coordination across time, or did UDT1 fail to handle cases where the observation itself contained information about the agent's own output?

  *   **Likely Answer:** She will likely explain that UDT1 failed in scenarios where the predictor simulates the agent *before* the observation is made, meaning the observation gives information about what the action *would* be, creating a loop that UDT1 couldn't resolve without selecting the whole policy $S$ at once.
  *   **Follow-up:** Does moving to UDT1.1 solve the problem completely, or does it just push the computational burden up a level? Searching the space of actions is hard; searching the space of all possible policies seems combinatorially explosive. Is there a tractable approximation for UDT1.1, or is it purely a normative ideal we can't actually implement?

  ### **Part 4: Bounded Rationality & Logical Induction**

  **4.** Following up on that computational cost: Standard UDT assumes a prior over logical truths, which implies a kind of logical omniscience. But real agents (and LLMs) are bounded; they learn logical facts over time. How does UDT interact with frameworks like *Logical Induction*? Can an agent be "updateless" with respect to logical facts it hasn't discovered yet, without being blindsided when it does discover them?

  ### **Part 5: AI Alignment & Training**

  **5.** We work in AI, so we have to ask: How do you train a UDT agent? Modern RL is inherently updateful—it gradients down based on observed rewards. If we want an alignment-resistant agent that doesn't negotiate with blackmailers (because it pre-committed not to), do we need to change the training objective, or can we get UDT-like behavior out of standard self-play if the environment is structured correctly?

  ### **Part 6: Game Theory & Multi-Agent Scenarios**

  **6.** One of the selling points of UDT is that it handles game theory cleanly—two UDT agents meeting should recognize each other's source code and cooperate where CDT agents would defect. But this relies on transparency. In the real world, agents are black boxes to each other. Does UDT lose its advantage if I can't verify that the other player is actually running UDT, or is there a "robust" version that works under opacity?

  ### **Part 7: TDT vs. UDT**

  **7.** For listeners who followed the LessWrong sequences, Timeless Decision Theory (TDT) was the precursor to UDT. TDT uses causal graphs with logical nodes. Why was the jump to UDT necessary? Was TDT fundamentally unable to handle certain Newcomb-like problems, or was UDT just a cleaner mathematical formalization of the same intuition?

  ### **Part 8: Reflective Consistency**

  **8.** A major goal of this research is "reflective consistency"—an agent that wants to remain itself rather than self-modifying into a different decision theory. Does UDT guarantee reflective consistency? If a UDT agent anticipates it will face a problem where UDT performs sub-optimally (by its own lights), would it choose to self-modify into a CDT agent, or does the prior-based optimization lock it in?

  ### **Part 9: Normative vs. Descriptive**

  **9.** You've defended UDT as the correct *normative* theory for rational agents. But do you think it's also *descriptive* of how advanced AI systems will naturally behave? If we train a sufficiently smart optimizer without hardcoding UDT, will it converge on updateless behavior instrumentally, because that behavior wins, or will it naturally converge on something updateful and myopic?

  ### **Part 10: Falsifiability & Abandonment**

  **10.** To close: Decision theory can sometimes feel like a ecosystem of thought experiments where every counter-example gets a patch (like UDT1 to 1.1). What kind of evidence or argument would actually count *against* UDT for you? Is there a specific thought experiment where, if UDT gave the wrong answer, you would abandon the framework entirely, or is it viewed as the only game in town for now?
