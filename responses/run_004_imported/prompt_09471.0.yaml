prompt: |-
  Been down a bit of a rabbit hole on Lewis's Principal Principle lately, and it keeps striking me how similar it is to van Fraassen's Reflection Principle -- like both are basically instances of some general "defer to whoever/whatever knows better" schema, just applied to different things (objective chance vs your own future credences). Can you actually compare the two in some depth? Specifically im curious about the restrictions each one needs to avoid giving obviously bad verdicts: Lewis needs the evidence to be "admissible" for PP to kick in, and van Fraassen has to bolt on some caveat so you're not obligated to defer to a future self who's been drugged or brainwashed. Are those restrictions doing basically the same job, or is there a principled reason objective chance gets to be trusted in a way your future opinions just don't? Don't just define terms at me -- give me an actual verdict on how the two relate.
