answer: |-
  # The Appointment Book: Why Death in Damascus Buried Causal Decision Theory

  The story is old, but the sting remains fresh. A merchant in Damascus sees Death in the marketplace, looking surprised. Death whispers, "I am coming for you tomorrow." Terrified, the merchant buys a camel and rides hard for Aleppo, believing he can outrun his fate. But when he arrives, exhausted, he finds Death waiting in the Aleppo marketplace. "I knew you would come," Death says. "My appointment book was filled weeks ago based on where I predicted you would be."

  This is "Death in Damascus," and while Newcomb's Problem gets all the glory in philosophy departments, Death in Damascus is the superior stress test for decision theory. Newcomb's Problem reveals that Causal Decision Theory (CDT) can be *expensive*. Death in Damascus reveals that CDT can be *incoherent*.

  In Newcomb's Problem, a Causal Decision Theorist can calmly explain why they are taking both boxes, even as they walk away with less money. Their logic is stable, even if the outcome is suboptimal. In Death in Damascus, the Causal Decision Theorist cannot even finish their thought process without contradicting themselves. They are trapped in a loop of deliberative instability that makes rational action impossible.

  Here is why the Damascus scenario breaks the machinery of Causal Decision Theory, how Evidential Decision Theory (EDT) fares slightly better but still stalls, and why the only rational move for the merchant is to stop thinking and flip a coin.

  ### The Stability of Newcomb vs. The Instability of Damascus

  To understand the breakdown, we must first look at why Newcomb's Problem doesn't actually break CDT. In Newcomb's setup, a Predictor puts money in a box based on what they think you will choose. CDT argues: "My choice cannot causally affect what is already in the box. Therefore, I should take both boxes to maximize gain." This is a **dominance argument**. It is logically consistent. You can decide to two-box, execute the decision, and lose. But you never have to change your mind *during* the deliberation. The recommendation is stable.

  Death in Damascus removes that stability.

  In this scenario, the "Predictor" (Death) is not just predicting your choice; the payoff structure is set up so that your choice *determines* your survival only insofar as it mismatches the prediction. But since the prediction is based on your choice, a match means death.

  A Causal Decision Theorist reasons like this: "My decision to go to Aleppo does not *cause* Death to be in Aleppo. Death's location is already fixed in the appointment book. Therefore, I should simply go wherever Death is *not*."

  Here lies the trap. To decide where Death is not, the agent must estimate the probability of Death's location. But Death's location is correlated with the agent's own decision algorithm.
  1.  If the agent thinks, "I will probably go to Aleppo," they must infer, "Death is probably in Aleppo."
  2.  If Death is probably in Aleppo, CDT says, "Go to Damascus."
  3.  But if the agent decides to go to Damascus, they must infer, "Death is probably in Damascus."
  4.  If Death is probably in Damascus, CDT says, "Go to Aleppo."

  This is **deliberative instability**. A CDT agent cannot settle on a plan. Every tentative conclusion provides the evidence needed to overturn it. In Newcomb's Problem, CDT gives you a map to a losing destination. In Death in Damascus, CDT spins the compass needle so fast it snaps off. You cannot execute a Causal Decision because the act of forming the intention changes the expected utility of the action.

  ### The Evidentialist's Dilemma

  What about the Evidential Decision Theorist (EDT)? EDT chooses actions based on the news they bring. "What does going to Aleppo tell me about my survival?"

  EDT sees the correlation immediately. Going to Aleppo is strong evidence that Death is in Aleppo. Staying in Damascus is strong evidence that Death is in Damascus. An EDT agent realizes that *any* deterministic choice is bad news.

  However, standard EDT often struggles to prescribe a specific action here. It recognizes that $P(\text{Death} | \text{Aleppo}) \approx 1$ and $P(\text{Death} | \text{Damascus}) \approx 1$. Faced with two options that both have near-zero expected utility, a classic EDT agent might become paralyzed or indifferent. They avoid the CDT oscillation, but only by resigning themselves to fate. They see the trap, but they don't necessarily see the escape hatch. They understand they are correlated with Death, but without a framework for breaking that correlation, they are just a fatalist with a calculator.

  ### The Verdict: Flip a Coin

  So, what should the merchant actually do? We cannot dodge the question with "it depends on your decision theory." We need a prescription for survival.

  The merchant should **randomize their choice with a precise 50/50 probability.**

  Here is the commitment: Deterministic reasoning is the enemy. As long as the merchant uses a deterministic decision process (whether CDT or EDT), Death's appointment book—which was written weeks in advance based on predicting that very process—will contain the correct location. If the merchant's reasoning leads deterministically to Aleppo, Death is in Aleppo. If it leads to Damascus, Death is in Damascus. Deterministic deliberation guarantees death against a perfect predictor.

  Randomization is the only mechanism that decouples the agent's *reasoning* from the agent's *action*.

  If the merchant flips a fair coin, they are no longer outputting a signal that Death can predict based on psychological profiling or logical deduction. They are introducing entropy.
  *   **If Death predicts the coin flip:** He can't. A truly random event is unpredictable by definition. If Death is merely a "near-perfect" empirical predictor, his accuracy drops to chance.
  *   **If Death predicts the *strategy*:** If Death knows the merchant will flip a coin, Death must choose a location to wait. If Death picks Aleppo, the merchant survives 50% of the time. If Death picks Damascus, the merchant survives 50% of the time. If Death also randomizes, the survival rate remains 50%.

  Fifty percent survival is infinitely better than the 0% survival guaranteed by deterministic deliberation against a perfect predictor.

  Critics might argue that if Death is a *logical* omniscient predictor, he predicts the outcome of the coin flip. But this confuses prediction with magic. The puzzle states Death predicts based on the agent's choice process. By adopting a mixed strategy (randomization), the agent changes the process from "Calculate Best Option" to "Generate Random Bit." This forces the predictor into a game-theoretic equilibrium rather than a foregone conclusion.

  ### Why This Matters

  Death in Damascus is the graveyard of Causal Decision Theory because it shows that CDT is not just wrong about the world; it is wrong about *itself*. CDT assumes an agent can view their own decision as an external variable that doesn't influence the past. In Damascus, the agent's decision *is* the evidence that fills the appointment book.

  Newcomb's Problem allows CDT to lose with dignity. Death in Damascus forces CDT to lose its mind. The instability proves that an agent cannot treat their own decision as causally isolated from the predictions made about it.

  The merchant should not reason his way to Aleppo or Damascus. He should not calculate utilities. He should reach into his pocket, find a coin, and let chance decide. In a world where your thoughts are written in an appointment book weeks before you think them, the only free will left is the roll of the dice.
