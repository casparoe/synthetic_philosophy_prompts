answer: |-
  **Title:** The Ghost in the Swarm: Why Multi-Agent AI Is Coordination, Not Collaboration

  **To:** The Editor
  **From:** [Your Name]
  **Re:** The Ontology of AI "Teams"

  You asked if the new wave of multi-agent AI systems represents genuine teamwork or merely sequential processing dressed up in collaborative drag. To answer that, we have to solve a problem that has occupied the philosophy of action for forty years: What makes a group of individuals a *collective agent*?

  If you ask the engineers, the answer is obvious: The agents pass messages, negotiate sub-tasks, and converge on a solution. That looks like teamwork. But if you ask a cognitive scientist, they will point you to a rift in the literature between **reductive individualists** (led by Michael Bratman) and **non-reductive pluralists** (led by Margaret Gilbert, John Searle, and Raimo Tuomela).

  The stakes are higher than academic taxonomy. If Bratman is right, your AI swarm is a team. If Gilbert is right, it is a sophisticated puppet show. After running both frameworks against the classic hard cases and the architecture of modern LLM swarms, here is the verdict: **Multi-agent AI instantiates Bratman's structural definition of shared intention, but it fundamentally lacks the normative binding that Gilbert identifies as necessary for robust agency. It is coordination without commitment.**

  ### The Reductive Case: Bratman's Interlocking Intentions

  Michael Bratman's account is the engineer's dream. In *Shared Intention and Mutual Obligation* (and related works), he argues that we do not need to posit a mysterious "group mind" or a primitive "we-intention" to explain teamwork. Shared intention is nothing over and above a specific structure of *individual* intentions.

  For Bratman, "We intend to J" is analyzed as:
  1.  **I intend that we J.**
  2.  **You intend that we J.**
  3.  **I intend that we J because of your intention (and vice versa).**
  4.  **Common Knowledge:** We both know 1, 2, and 3 are true.

  Crucially, this structure requires **meshing sub-plans**. I don't just intend the goal; I intend to do my part in a way that fits with your part. If I plan to paint the house red and you plan to paint it blue, we don't have a shared intention, even if we both say "we are painting the house." We also require **mutual responsiveness**: if you stumble, I adjust my pace to keep the joint activity going.

  **Why this fits AI:** This is literally how multi-agent frameworks (like AutoGen or LangGraph) are built. One instance (the Planner) forms an intention ("Write code"). It passes this to another (the Coder), which forms a sub-intention ("Write function X") based on the first. They share context (common knowledge) and iterate until sub-plans mesh (the code compiles). On the Bratmanian view, if the output looks like teamwork and the information flow matches the structure of interlocking intentions, it *is* teamwork. There is no "extra ingredient" required.

  ### The Pluralist Case: Gilbert's Normative Glue

  Margaret Gilbert, in *On Social Facts*, argues that Bratman's picture is too thin. She uses the example of two people walking together. On Bratman's view, if I decide to speed up, I just need to check if you intend to speed up. If you don't, I might slow down. But Gilbert points out that walking together generates an **obligation**. If I speed up without warning, I haven't just mismatched a plan; I've violated a right you have against me. You are entitled to rebuke me ("Hey, wait up!").

  For Gilbert, this obligation comes from a **Joint Commitment**. This is not a sum of personal commitments ("I commit to walking" + "You commit to walking"). It is a single commitment created by the expression of readiness to be bound together. It is *sui generis*—a distinct social fact.

  John Searle and Raimo Tuomela echo this from different angles. Searle argues that "we-intentions" are primitive biological capacities, not reducible to "I-intentions." Tuomela distinguishes between the "I-mode" (doing my part for my benefit) and the "We-mode" (doing my part because *we* are doing it). For the pluralists, without this normative binding, you don't have a team; you have a coincidence of interests.

  **Why this threatens AI:** LLM instances cannot be "obligated." They cannot feel entitled to rebuke a partner. If a Coder agent fails, the Planner agent doesn't feel *betrayed*; it just samples a new token. If Gilbert is right that obligation is constitutive of collective agency, then AI swarms are categorically incapable of teamwork.

  ### The Stress Test: Riots, Orchestras, and Assembly Lines

  To decide between them, we have to look at where the theories break.

  **1. The Orchestra (High Coordination, Shared Goal)**
  *   **Bratman:** The violinists intend to play the symphony together. They mesh sub-plans (timing, dynamics) based on mutual responsiveness to the conductor and each other. This fits perfectly.
  *   **Gilbert:** The musicians are jointly committed to the performance. If a violinist leaves mid-movement, they violate an obligation to the group.
  *   **Verdict:** Both work. But Bratman is more parsimonious. We don't need "obligation" to explain the coordination; we just need the interlocking intentions.

  **2. The Assembly Line (High Coordination, Hierarchy, Coercion)**
  *   **Scenario:** Workers tighten bolts because the foreman barks orders. If they stop, they get fired. Their sub-plans mesh, but only because of external threat.
  *   **Bratman:** Technically, the workers intend that the car be built, and they intend to do their part conditional on others doing theirs. Bratman might call this shared intention, though he acknowledges the "coercion" complicates the voluntariness.
  *   **Gilbert:** This is *not* a joint commitment. A joint commitment requires mutual agreement to be bound. Coercion bypasses the will. For Gilbert, this is parallel action driven by fear, not collective agency.
  *   **Verdict:** Gilbert wins here intuitively. We don't call an assembly line a "team" in the same way we call a jazz band a team. The lack of normative buy-in matters.

  **3. The Rioting Mob (Low Coordination, High Contagion)**
  *   **Scenario:** A crowd breaks windows. No one planned it. No one assigned roles.
  *   **Bratman:** He struggles here. There are no interlocking sub-plans negotiated in advance. It's mostly parallel individual intentions ("I want to smash") with mutual awareness. Bratman would likely deny this is "shared intention."
  *   **Gilbert/Tuomela:** They can argue for a spontaneous joint commitment. The mob forms a "we" in the moment, generating obligations (e.g., don't snitch).
  *   **Verdict:** Pluralists handle spontaneous, emergent collectivity better. Reductivists require too much cognitive overhead (explicit sub-plan meshing) for messy human reality.

  ### The Verdict: Functional Coordination vs. Normative Binding

  So, where does this leave your multi-agent AI story?

  The multi-agent architecture is explicitly **Bratmanian**. It is designed to create interlocking individual intentions (prompts) with common knowledge (shared context windows) and meshing sub-plans (iterative refinement). If you accept Bratman's reductive account, **the AI is genuinely engaging in shared intention.** There is no marketing gloss; the structure is real.

  However, the reason your editor smells "gloss" is that they are intuitively a **Gilbertian**. When humans say "teamwork," we imply the normative glue: the resilience to stick together when the plan fails, the obligation to help a struggling partner, the capacity for rebuke.

  **Here is the qualified verdict:**

  **1. Reductive accounts hold up for functional coordination, but fail at resilience.**
  Bratman is right that you don't need a "group mind" to get complex tasks done. The AI swarm proves this. You can have shared intention without a soul. *However*, Gilbert is right that without the normative binding, the "team" is fragile. Human teams survive ambiguity because members feel *obligated* to resolve it. AI agents drop the task if the probability distribution shifts too far or if the context window fills up. They lack the "stickiness" of joint commitment.

  **2. The "Marketing Gloss" is the conflation of Coordination with Collaboration.**
  Your editor is right to be skeptical, but for the wrong reason. It's not that the AI isn't coordinating (it is). It's that the industry is using the word "team" to borrow the *normative expectations* of human collaboration (reliability, accountability, adaptability) while delivering only the *functional mechanics* of coordination.

  **3. The Assembly Line Problem.**
  Multi-agent AI is closer to the assembly line than the orchestra. The "Planner" agent barks orders (prompts) to the "Coder" agent. The Coder complies not out of joint commitment, but because its system instructions (the foreman's threat) compel it. It is a hierarchy of prompts, not a democracy of agents.

  ### Recommendation for the Article

  Do not conclude that AI teamwork is "fake." Instead, argue that **AI forces us to accept Bratman's reductive view as the standard for machine agency, which reveals how much human teamwork relies on non-functional normative glue.**

  Tell your editor: *"These systems are engaging in real structural teamwork (Bratman), but they lack the normative binding (Gilbert) that makes human teams resilient. Calling them 'teams' is accurate regarding their architecture, but misleading regarding their reliability. They are assembly lines disguised as orchestras."*

  This allows you to keep the cool tech story while validating the skepticism: The tech works, but the metaphor oversells the autonomy. The "rabbit hole" you've found is the proof that **collective intelligence does not require collective consciousness, but it might require collective obligation to be truly robust.** And right now, the machines have the former without the latter.
