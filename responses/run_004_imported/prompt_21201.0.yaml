answer: |-
  Good morning. Thank you all for being here.

  For those who don't know me, I'm Diane's child. For those who do know me, you know that standing here is the hardest thing I've ever had to do, mostly because the person who usually helped me prepare for hard things is the one we're here to remember.

  My mother died three weeks ago at seventy-eight. For thirty-one of those years, she was a public defender. She spent her life standing between the state and the people the state wanted to lock away. She was fierce, she was tired, and she was deeply, unshakeably committed to the idea that every person deserved a defense. But if you asked her why she believed that, the answer changed over time. In the beginning, it was about the law. In the end, it was about something much larger, and much stranger.

  Sometime in her late fifties, a friend gave her an essay by a philosopher named Galen Strawson. It contained something called the "Basic Argument," and for the last twenty years of her life, it was the lens through which she saw everything. She explained it to me across two decades of dinner-table lectures. I'm not a philosopher, and I know the people in the back row who attended her Thursday night library group are already listening closely to make sure I get this right.

  Here is how she explained it to me: You can only be truly responsible for what you do if you are responsible for the kind of person you are. After all, your actions come from who you are. But you can only be responsible for the kind of person you are if you made yourself that way on purpose. And to make that decision, you would have had to rely on some prior reason or preference—which was just *more* of the person you already were, before you did any deciding.

  So, the responsibility keeps sliding backward. It never lands.

  She was firm that this wasn't about fate. She hated the idea that people thought she believed we were puppets on a string. She used to say that tossing randomness into the chain doesn't hand you authorship of yourself; it just turns the last unearned step from a domino into a coin flip. Whether it's cause or chance, neither of them is *you*.

  So, what she took from this was radical. She believed that nobody ultimately deserves credit or blame for who they became. Not the men she spent her career defending, and not herself.

  Now, for my cousins and the family who never heard her talk about Strawson, I know this sounds cold. It sounds like it removes the point of trying. But that wasn't her experience. She never treated that lack of ultimate responsibility as a reason to stop trying to become better, or to stop asking other people to. In fact, I think it made her kinder. If nobody writes their own script from scratch, then judgment becomes less useful, and compassion becomes more necessary.

  She defended people who had done terrible things. She didn't say they didn't do them. She didn't say they couldn't have acted differently in that moment. She said that the chain of events that made them the kind of person who *would* do that thing was not a chain they forged. And she applied that same logic to herself.

  This brings me to a specific request. My mother left a note about today. She knew that when people die, we tend to reach for certain phrases. We like to say the deceased "earned" their rest. We like to say they "overcame" their obstacles through sheer force of will. We like to say they are "looking down on us," proud of what they built.

  She asked that nobody stand up and say she "earned" the woman she became. She asked that nobody say she "overcame" a hard upbringing through sheer force of will. She said both are exactly the kind of self-authorship claim she spent thirty years arguing nobody gets to make.

  But she was just as firm about the other side. She asked that nobody flatten this into "she thought it was all fated and couldn't have done otherwise." That was never her point. She would have hated hearing it put that way. She believed she had choices. She believed her efforts mattered. She just believed that the *source* of those efforts was not ultimately of her own making.

  So, how do I honor her without violating her instructions?

  I can tell you that she was here. I can tell you that for ten years, she ran a discussion group at the public library on Thursday nights. I can tell you that she showed up. She showed up for her clients, often when they were the only ones who would. She showed up for her friends, listening to them with a focus that made them feel like the only person in the room. She showed up for me.

  She didn't "earn" my love. I didn't "earn" hers. It wasn't a transaction based on merit. It was just a fact of our lives, like gravity, like the weather. It was given.

  To her colleagues in the back: She knew you would catch it if I blurred the lines. She respected that about you. She loved the precision of the argument because she loved the truth, even when the truth was uncomfortable.

  To my family in the front: She knew you wouldn't know the name Galen Strawson. She loved that about you, too. She loved that you could just *be* with her without needing to justify your existence through logic.

  In the end, my mother's philosophy wasn't a way to escape responsibility. It was a way to carry it without being crushed by it. It allowed her to look at a client who had failed, and herself when she had failed, and say: "This is where we are. This is the hand that was dealt. Now, what do we do next?"

  She didn't believe she built herself. But she did believe in tending to the garden she found herself in. She watered it. She pulled the weeds. She sat in the shade when it was hot.

  I miss her. I don't miss her because she deserved to stay, and I don't miss her because it was fated that she go. I miss her because she was my mother, and the world is quieter without her voice explaining the impossible over the dinner table.

  She asked me to tell you that she loved you. She didn't say she earned the right to love you, or that she chose the capacity to feel it. She just said it was there. And if she were here, she would tell you that whatever grief you feel, or whatever relief you feel, or whatever confusion you feel about today—it's all valid. You are not responsible for the way you are grieving, any more than she was responsible for the way she was living. You are just here, doing the best you can with the person you are.

  Thank you for coming to honor her. Thank you for remembering her. And thank you for listening.
