answer: |-
  **A Postscript to the Refutation of Time**

  *By Jorge Luis Borges*

  Some weeks ago, a friend—a man of science, versed in the invisible architectures of the universe—placed a small volume in my hands. It was *The Order of Time*, by an Italian physicist named Carlo Rovelli. I accepted it with the gratitude of one who receives a map of a country he knows he shall never visit, yet whose borders define his own garden. I have spent the better part of my life arguing, in a manner both speculative and obstinate, that time is a delusion. To find a modern thinker, armed not with metaphysics but with equations, arriving at a similar precipice, provoked in me a curiosity that borders on unease.

  I am no physicist. I cannot parse the Wheeler-DeWitt equation, nor do I pretend to understand the spin networks of loop quantum gravity. I must take the physicist's word as the theologian takes his scripture: on faith. Yet, the philosophical contour of his argument is legible enough to a layman. Rovelli proposes that at the fundamental grain of reality, the variable $t$—time—does not exist. There is no universal clock ticking in the void. There are only events, relations, and quantum fields. The "flow" we perceive, the arrow that drives us from birth toward decay, is not a feature of the world but a feature of our blindness. It is a product of entropy, of thermodynamics, and of the fact that we are "blurred" observers. We see the world in low resolution, and from this coarseness, time emerges like heat from friction.

  Reading this, I felt a strange sensation of *déjà vu*, as if I were rereading a page I had written in 1946. In *A New Refutation of Time*, I leaned upon Berkeley to dismantle matter, and upon Hume to dismantle the self. If matter is only perceived, and the self is only a bundle of perceptions, what remains to link one moment to the next? Nothing. Each moment is absolute, self-sufficient, and isolated. Succession is a trick of memory.

  Rovelli seems to be walking this same corridor, though he enters from the opposite door. For Hume, the "self" dissolves into perceptions; for Rovelli, the "present" dissolves into thermodynamic states. Both suggest that the continuity we feel is a byproduct of our limited perspective. The physicist calls it "coarse-graining"; the idealist calls it "habit." There is a seductive symmetry here. It suggests that the universe is not a machine that runs *in* time, but a static jewel that *appears* to turn because we are moving our eyes.

  However, it is here that I must pause. There is a timidity in the physicist's idealism that the metaphysician cannot overlook.

  Rovelli denies Time, but he retains the Universe. He denies the flow, but he keeps the riverbed. He argues that entropy is real, that quantum fields are real, and that the "thermal state" of the cosmos is an objective fact, independent of the mind, even if time is not. He wishes to abolish the stage but keep the actors. To this, I must object with the same stubbornness I applied to the materialists of my own century.

  If time is an illusion born of our "blurred" perspective, what, precisely, is doing the blurring? Rovelli speaks of macroscopic systems, of observers who track only some variables and not others. But this "observer" is still treated as a physical object within the world, subject to thermodynamic laws. He has replaced the Metaphysical Subject with a Thermodynamic System. He has not escaped substance; he has merely changed its name.

  In my refutation, I argued that if you remove the perceiving self, you cannot save the perceived world. If succession is false because there is no "I" to endure through it, then entropy is equally suspect. For what is entropy but a measure of change? What is a "thermodynamic gradient" if not a difference between one state and another? If there is no time, there is no "before" and "after" for entropy to operate upon. Rovelli asks us to believe in a universe of events that do not happen *in* time, yet somehow possess a directionality that mimics it. He retains the "furniture" of the world—the stars, the heat, the particles—as robust, mind-independent realities. He is a realist about matter, and a skeptic about time.

  I, conversely, was forced by the logic of Berkeley and Hume to be a skeptic about both. If time is a trick of language and memory, then the "universe" that persists through that time is a trick of the same order. Rovelli's "thermal time" is a bridge built over an abyss he refuses to acknowledge. He says time is not fundamental. I would ask: Is the *blurring* fundamental? Is the *entropy* fundamental? Or are these merely other words for the limitations of the human mind, projected onto the cosmos?

  He writes that we are "swept along" by the flow of time because we are part of the thermodynamic system. I wrote that I am swept along by time because I am a man. Here, we meet.

  And yet, I must confess what I confessed forty years ago. Logic is a cage, but sensation is the bird that flies through it. I can understand Rovelli's argument. I can see how the equations might allow for a world without $t$. I can even concede that entropy is a more robust master than the clock. But none of this alters the texture of my afternoon.

  When I set down the book, I felt the weight of it in my hand. I felt the fatigue in my eyes. I knew that I would soon be hungry, and that night would fall, and that I would grow older while the book remained the same age. Rovelli tells me this is a statistical illusion, a result of my "coarse-grained" interaction with the quantum fields. Borges the metaphysician nods. Borges the man sighs.

  Perhaps Rovelli is right. Perhaps time is merely the form in which we perceive the degradation of energy. But even if the river is an illusion, the drowning is not. The physicist may dissolve the clock, but he cannot dissolve the waiting. I remain trapped in the succession of moments, whether they are real or imagined. The universe may be a network of timeless events, but I am still condemned to read them one by one.

  I do not know if Rovelli has vindicated me. Perhaps he has only shown that the delusion of time is more intricate than I had imagined, woven now into the very heat of the stars. But I suspect he is too timid. He wishes to save the world by sacrificing time. I fear we must sacrifice both, or neither.

  In the end, the physicist and the poet arrive at the same melancholy shore. He looks at the equations and sees eternity. I look at the mirror and see a face that is slowly erasing itself. We both know that the truth, whatever it is, will not stop the evening from coming.

  *Geneva, 1985* (Imagined)
