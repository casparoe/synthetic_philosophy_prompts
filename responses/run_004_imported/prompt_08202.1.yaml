      *   *Check:* Did I answer the "entitled" question? Yes, but with nuance about blame vs. wrongness.

  7.  **Final Polish:** Ensure the distinction between "epistemic dependence" (science) and "moral deference" (ethics) is clear. (This is a key philosophical distinction relevant to the user's new field).

  **(Self-Correction Note):** Make sure not to validate the student's argument as *true*, but validate the user's *process* of considering it. The prompt asks about the *structure of belief*, not the truth of animal rights.

