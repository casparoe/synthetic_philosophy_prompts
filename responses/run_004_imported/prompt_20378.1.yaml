answer: |-
  The fluorescent light above the holding cell hummed, a low, electric headache. Maya sat on the steel bench, still in her high-visibility vest, hands resting calmly on her knees. Leo paced the other side of the bars, holding a manila envelope like a shield.

  "Sign the release form, Maya," Leo said, sliding the paper through the slot in the gate. "The sergeant said you can be out in twenty minutes. Bail is posted."

  Maya didn't look at the paper. "I'm not posting bail, Leo. I'm not contesting the charge. I'm going to sit here until the arraignment, and then I'm going to plead guilty."

  Leo stopped pacing. He leaned against the cinderblock wall, rubbing his temples. "This is about the highway blockade. I get it. It was symbolic. You made your point. Now you come home."

  "If I leave now, I treat the law as a mere obstacle to be navigated," Maya said, her voice even. "If I stay, I treat it as a system I am bound to, even when I must break it. That's the difference between civil disobedience and common lawlessness."

  "Bound to?" Leo let out a short, sharp laugh. "Bound by what? We've had this argument since poli-sci 101. You're acting like the state has some moral claim on you. It doesn't."

  "It does," Maya said. "We live in a nearly just society. The institutions are imperfect, yes—obviously, given the climate inaction—but they are fundamentally legitimate. Rawls is clear on this. We have a natural duty of justice to support and comply with just institutions that apply to us."

  "There it is," Leo said, pointing a finger at her. "The natural duty. And there is exactly where Simmons eviscerates you. The Particularity Objection. Remember?"

  Maya sighed, shifting on the bench. "I remember."

  "A natural duty of justice is universal," Leo pressed, stepping closer to the bars. "If you have a duty to support just institutions, you have a duty to support *any* just institution. Why does that duty bind you to *this* government? Why the United States? Why not Canada? Why not a hypothetical ideal state? A general duty to 'justice' doesn't glue you to *this* specific bureaucracy, *this* specific police force, *this* specific penal code. You didn't consent to them. You didn't sign a contract. So why do you owe *them* your freedom?"

  Maya looked up, meeting his eyes. "Because fairness, Leo. I benefit from the scheme. I walk on the roads, I rely on the courts, I enjoy the security. If I pick and choose which laws to obey based solely on my private judgment, without accepting the consequences, I'm essentially claiming an exemption everyone else is denied. That undermines the cooperative scheme."

  "But that's the Fair Play argument, and it fails too," Leo countered. "I didn't ask for the benefits. You can't shove a benefit at me and then send me a bill. And even if you could, why does the bill say 'Obey'? Why not just 'Pay taxes'? Why does the state get to tell you where to sit, what to drive, and when to go to jail? The natural duty might tell you to promote justice, but it doesn't tell you to obey *this* law when *this* law is facilitating ecological collapse."

  "That is precisely why the disobedience is necessary," Maya said. "But the acceptance of punishment is the proof that I still respect the *rule of law* even while breaking a specific statute. It shows fidelity. It says, 'I am not trying to overthrow the system; I am trying to wake it up.'"

  "It's martyrdom theater," Leo said, his voice softening. "And it relies on a fiction. You think staying in this cell honors the system. I think it validates a claim of authority that doesn't exist. If the state has no legitimate authority over your conscience—and I say it doesn't—then submitting to their punishment isn't noble. It's submission to coercion."

  "Okay," Maya said, leaning forward. "Let's follow that thread. You're a philosophical anarchist. You believe there is no general obligation to obey the law. Fine. But tell me this: If the state has no moral claim on me, what is the principled difference between what I did today and blowing up the pipeline?"

  Leo blinked. "Don't be absurd. You know the difference."

  "Do I?" Maya challenged. "On your view, the law against blocking the highway has no moral weight. It's just a command backed by force. The law against blowing up a pipeline is the same. If I don't owe the state obedience, then breaking the law isn't a *political* wrong. So, why is my blockade 'civil disobedience' and sabotage 'terrorism'? If the authority is illegitimate, isn't the distinction just tactical? 'Don't get caught' versus 'Get caught on purpose'?"

  Leo pushed off the wall, pacing again. He stopped, looking at the ceiling. "It's not about the state's authority, Maya. It's about independent moral constraints. I don't blow up pipelines because people might get hurt. Because property destruction escalates violence. Not because the *government* told me not to."

  "But the government defines the property rights," Maya pointed out. "If you deny their authority to command you, on what grounds do you recognize their definition of property? You're cherry-picking. You want the protection of the social order when it suits you, but you want to deny the obligation that comes with it."

  "I'm not denying the obligation to *people*," Leo snapped. "I'm denying the obligation to the *apparatus*. I have a duty to you, to the people who breathe the air, to the future generations. I don't have a duty to the Department of Transportation. When you sit in this cell, you aren't serving the people. You're serving the Department. You're reinforcing the idea that they have the right to judge you."

  "I'm reinforcing the idea that we live under a shared rule," Maya corrected. "If anarchists and believers in political obligation both break the law, but only one side accepts the punishment, the public sees a difference. One side looks like they want chaos; the other looks like they want justice. If I run, if I fight the charge, I validate your view: that this is just a power struggle. If I stay, I assert that we are still partners in this society, even in conflict."

  Leo was quiet for a moment. The hum of the light seemed louder. "You think that partnership exists. I think it's a hallucination we use to make coercion palatable. Simmons argues that without actual consent, the state is just a protection racket that sends newsletters."

  "And I think that without a presumption of obedience, society dissolves into a war of all against all," Maya said. "You say you have moral constraints independent of the law. But history shows that when people stop believing in political obligation, they don't just become peaceful anarchists. They become warlords. They decide *their* morality is the only one that counts."

  "And when people believe in political obligation too strongly," Leo shot back, "they become Eichmanns. 'I was just following the law.' Your fidelity to the system is a check on chaos, sure. But my skepticism is a check on tyranny. You need people like me to remind you that the law is not sacred."

  Maya smiled faintly. "I don't think the law is sacred, Leo. I think it's necessary. And sometimes, to save it, you have to break it. But you have to pay for the breakage."

  Leo walked back to the bars. He looked at the release form still sitting on the floor where he'd slid it. "So you're really going to stay. Over the weekend. In here."

  "Until Monday," Maya said. "Will you pick me up?"

  Leo picked up the envelope. He looked at her, a mix of frustration and admiration in his eyes. "I don't agree with you. I think you're granting legitimacy to a machine that doesn't deserve it. I think the Particularity Objection still stands—you owe *justice*, not *this*."

  "And I think you're leaving yourself no ground to stand on when the question comes: 'Why not violence?'" Maya said. "If the law is just force, why not meet force with force?"

  "Because I'm not a statist," Leo said quietly. "And I'm not a monster. I'll find a moral reason not to kill, even if the state doesn't give me one."

  "Then we're closer than you think," Maya said. "You just don't want to admit the state plays a role in coordinating that morality."

  Leo shook his head, tucking the envelope under his arm. "I'll be here Monday morning. Don't... don't let them intimidate you into a plea deal you don't want."

  "I won't," Maya said. "Thanks for coming, Leo."

  "Thanks for making me worry," he replied. He turned to leave, then paused. "For the record? If you were an anarchist, you could have just walked out the back door during the chaos. You had the chance."

  Maya looked at her hands. "I know. But then I'd just be a fugitive. This way, I'm a citizen."

  Leo didn't answer. He walked toward the sergeant's desk, the sound of his boots echoing on the linoleum, leaving Maya in the hum of the light, waiting for the system she respected to process her.
