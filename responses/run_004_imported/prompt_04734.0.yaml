  1.  **Analyze the User's Request:**
      *   **Topic:** Descartes' *bête-machine* (beast-machine) doctrine and his two specific tests for rationality/soul (Linguistic Flexibility and Behavioral Versatility).
      *   **Task:** Evaluate specific modern cases (Alex the parrot, Betty the crow, Kanzi/Koko, mirror self-recognition, Cambridge Declaration) against Descartes' *own* criteria, not just general modern science.
      *   **Specific Questions:**
          *   Which cases can Descartes wave away as mechanism/instinct?
