answer: |-
  Here are nine interview questions designed to probe the mechanical limits and assumptions of Safe Pareto Improvements (SPIs), including the four specific thematic requirements with anticipated follow-ups.

  **1. The Delegation Uncertainty**
  "Let's start with the motivation. In standard principal-agent problems, we usually worry about the agent having different incentives than the principal. But in the SPI framework, the worry seems to be less about *incentive alignment* and more about *equilibrium selection*. Can you describe a concrete scenario where the principal and agent have perfectly aligned interests, but the principal still fears the outcome of the delegation enough to warrant modifying the game beforehand?"

  **2. SPIs vs. Trusted Mediators**
  "A lot of listeners will be familiar with the idea of a trusted mediator implementing a correlated equilibrium—essentially telling both sides, 'You play X, you play Y,' to avoid coordination failures. If the goal is just to avoid bad equilibria, what specific failure mode does the SPI framework solve that a mediator doesn't? What is the 'safety' in Safe Pareto Improvement actually safe against, if not the same coordination failures a mediator already handles?"

  *   **Follow-up (If they argue SPIs don't require a third party):** "If the issue is just the cost or availability of a third party, couldn't the principals just agree to use a cryptographic coin flip or a smart contract instead? I'm trying to pin down whether the 'safety' is buying us something structural about the incentives, or if it's just a workaround for the lack of a communication channel."

  **3. Rationality Assumptions vs. Guarantee Strength**
  "There seems to be a tension in how much we assume about the delegates. If we assume the delegates will definitely find and play a Nash equilibrium of the modified game, we can guarantee larger improvements. But if we weaken that assumption—say, we only require them to avoid strictly dominated strategies—the set of 'safe' improvements seems to shrink. Is there a quantifiable tradeoff here? How much potential value do we leave on the table if we demand robustness against delegates who are only boundedly rational?"

  *   **Follow-up (If they suggest we should just assume Nash equilibrium):** "If we can safely assume the delegates will play a Nash equilibrium of the *modified* game, why couldn't we assume they'd coordinate on the *efficient* Nash equilibrium of the *original* game? I'm worried that by modifying the game, we're solving a coordination problem that shouldn't exist if our rationality assumptions are that strong."

  **4. The 'Bargaining in Disguise' Critique**
  "A recurring debate at our meetup is whether SPIs are doing new work, or if they're just ordinary bargaining-and-renegotiation theory dressed up in game-theoretic clothing. When two principals agree to modify the game their agents will face, aren't they effectively negotiating a contract? If so, doesn't the 'safe' framework quietly smuggle back in the same trust assumptions it claims to avoid—just shifted from trusting the delegate's move to trusting the other principal's commitment to the modification?"

  **5. Commitment Races and Timing**
  "One of the big worries in AI safety is 'commitment races,' where systems incentivize each other to commit early and irrevocably to tough stances. Does adopting an SPI framework actually remove an AI system's incentive to commit early and unilaterally? Or does it just displace the race onto the question of who gets to propose the modification first, potentially creating a new bottleneck where agents fight to define the modified game $G'$ rather than the original game $G$?"

  *   **Follow-up (If they say SPIs reduce tension overall):** "Even if the tension is lower, if there's still *any* advantage to being the one who proposes the modification, doesn't that preserve the incentive to pre-commit to a bargaining stance? How do we prevent the 'proposal phase' from becoming the new battlefield?"

  **6. Surrogate Goals and Second-Order Threats**
  "Let's look at surrogate goals as a worked example. The idea is to adopt a substitute target for threats to land on, protecting the real goal. But if it becomes common knowledge that a goal is merely a surrogate designed to absorb threats, what stops the adversary from threatening the surrogate anyway to bleed your resources, or threatening to destroy the surrogate unless you concede on the *real* goal? How is the surrogate protected from becoming the thing that gets threatened once its purpose is known?"

  *   **Follow-up (If they argue the surrogate is 'cheap' to defend):** "If the surrogate is cheap to defend, doesn't that signal to the adversary that you care deeply about it precisely because it's a shield? I'm asking whether the mechanism relies on the adversary remaining uncertain about *why* you care about the surrogate, which seems fragile in a transparency-heavy environment."

  **7. Private Information and Hiding the Modification**
  "For an SPI to work, the delegates need to play the modified game. But do the delegates need to know *that* a modification has occurred? If Principal A knows the game has been softened but Agent A doesn't, Agent A might play too aggressively relative to the new payoffs. Does the framework require full transparency between principal and delegate, and if so, does that create a vulnerability where the delegate can be manipulated by the principal's choice of modification?"

  **8. Verification and Common Knowledge**
  "Following on that: how is the modification verified? If Principal A agrees to modify the game but secretly leaves their agent instructions to play the original game, they might gain an advantage. Do we need a mechanism for the agents to verify that the game they are facing is indeed the agreed-upon $G'$, and doesn't that verification requirement reintroduce the need for the kind of enforcement mechanisms we usually try to avoid?"

  **9. The Limits of the Framework**
  "To close, I want to ground this in reality. Our listeners might walk away thinking SPIs are a universal key for negotiation. Can you describe a concrete bargaining situation—specific payoffs, specific constraints—where no nontrivial Safe Pareto Improvement exists at all? I want to understand the structural features of a game that make it immune to this technique, so we know when *not* to try it."
