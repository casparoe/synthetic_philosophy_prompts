  2.  **Deconstruct the Philosophical Positions:**
      *   **Devlin:** Society has a right to protect its moral fabric. Immorality threatens social cohesion (disintegration thesis). The "reasonable man" feels intolerance, indignation, and disgust. Law *is* enforced morality.
      *   **Hart:** Law should not enforce morality for its own sake (separation of law and morals). Distinguish between *positive* morality (what people happen to believe) and *critical* morality (rational principles). Prejudice often masks as morality (Dworkin's point). However, Hart *did* allow for paternalism (stopping people harming themselves) in limited cases, unlike Mill.
      *   **The Wackenheim Case:** Consensual, paid, safety-padded. Banned not because it hurt him physically (paternalism in the strict sense) but because it violated *human dignity* (a collective moral value he couldn't opt out of). This looks like legal moralism but dressed in human rights language.

  3.  **Drafting - Section by Section:**

