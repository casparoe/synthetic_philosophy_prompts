      *   **Devlin's Advocate (Let's call him "Arthur"):** Needs to argue that society's shared values matter. The "dignity" ruling isn't just about Wackenheim; it's about what kind of society we are. Use the "disintegration thesis" – if we allow commodification of the human body in this way, the bond of society loosens. Use the "reasonable man" – would the average person feel disgust?
      *   **Hart's Advocate (Let's call her "Elena"):** Needs to challenge the source of that disgust. Is it rational or just prejudice? Use the positive/critical morality distinction. Just because people *feel* something is wrong doesn't make it a valid ground for law. Bring in Dworkin (external preferences). Acknowledge Hart's paternalism but distinguish it from moralism.
      *   **The Clash:**
          *   Arthur argues "Dignity" is the modern secular equivalent of the "moral fabric." It's not just disgust; it's a constitutional value.
          *   Elena argues "Dignity" is too vague and often masks bias against the marginalized (like little people). Wackenheim said he needed the money.
          *   Arthur counters: Consent isn't magic. You can't sell yourself into slavery; you can't toss a dwarf. Society sets the limits of the market.
