answer: |-
  **Setting:** *A quiet corner of the faculty lounge at a London university, following a symposium on bioethics and law. Two legal philosophers, ARTHUR (defending a modernized Devlin position) and ELENA (defending a Hartian liberal position), stand by a coffee machine.*

  **ARTHUR:** You looked uneasy during the panel on the Wackenheim case. The UN Human Rights Committee upheld the French ban. A man loses his livelihood, consensual, safety-padded, and the world says, "No, your dignity is not yours to sell." I thought that was a victory for the idea that society is more than a collection of atomized consumers.

  **ELENA:** I looked uneasy because it was a victory for legal moralism dressed in the robes of human rights. Hart would have seen right through it. When the state tells a competent adult that his consent is irrelevant because an abstract concept of "human dignity" is violated, they aren't protecting him from harm. They are enforcing a moral preference.

  **ARTHUR:** But that's where you rely on a distinction Hart struggled to maintain. Devlin's argument was never about mere dislike. It was about the *disintegration thesis*. A society is held together by shared moral bonds. If you allow the human body to be treated as a projectile for entertainment, you loosen the bond of what it means to be human. The French court didn't say, "We dislike this." They said, "This degrades the species." That isn't prejudice; it's self-preservation.

  **ELENA:** Self-preservation based on what evidence? Devlin's "reasonable man" test relied on the feelings of intolerance, indignation, and disgust. But as Dworkin pressed, and Hart accepted, disgust is not a rational argument. It's often just prejudice crystallized. The "reasonable man" in 1950s Britain felt disgust at homosexuality. Was that a moral truth or a social habit? In Wackenheim's case, the "dignity" argument masks a bias against people with dwarfism. He argued this was one of the few well-paid jobs open to him. By banning it in the name of *his* dignity, the state prioritized its own moral comfort over his economic survival.

  **ARTHUR:** You're reducing Devlin to a mob rule theorist. He wasn't saying "whatever the mob hates, ban." He was asking whether a practice is incompatible with the society's existence. Consent isn't magic. We don't allow people to sell themselves into slavery, even if they consent. Why? Because it violates a normative boundary of the community. Wackenheim's case is the same. "Dignity" is simply Devlin's argument in modern dress, yes, but that's because we realized "morality" was too theological. "Human dignity" is the secular language of the shared moral fabric. If the reasonable person today feels that tossing a human being treats them as a thing, the law is justified in intervening.

  **ELENA:** But who is the "reasonable person" here? Is it the judge in Paris? Is it the UN committee in Geneva? Or is it Manuel Wackenheim? Hart distinguished between *positive* morality—what people happen to believe—and *critical* morality—principles we can rationally defend. You're using the law to enforce positive morality and calling it critical. Hart conceded to Mill that some paternalism is necessary, yes. He admitted the law could stop a man from selling himself into slavery or perhaps stepping off an unsafe bridge. But that is about *welfare*, not *moral symbolism*. Wackenheim wasn't stepping off a bridge; he was entering a contract.

  **ARTHUR:** Is there a difference? If the act itself constitutes an injury to human status, then the harm *is* the act. Devlin would say you cannot separate the moral harm from the social harm. If we normalize the commodification of unique human traits, we change the environment for everyone. It's not just about Wackenheim. It's about the message sent to the culture. You say Hart allowed paternalism for welfare. I say a society where human beings are tossed for coins has lower welfare, morally speaking, than one where they are not.

  **ELENA:** And there is the rub. You're defining "welfare" to include "moral purity." Hart tried to draw a line. He admitted the law could protect a man from his own ignorance or incapacity, but not from his own choices simply because they offend the majority. If you accept the dignity rationale, you give the state a veto over any consensual act that offends a committee's sense of propriety. Sex work, surrogate pregnancy, extreme sports. If I consent to risk, why does the state claim ownership of my dignity?

  **ARTHUR:** Because you are not just an individual. You are a citizen. Devlin's point was that private immorality can become a public threat if it undermines the shared understanding of value. Wackenheim claimed he needed the money. That is tragic. But the solution isn't to degrade the concept of human inviolability. The "reasonable man" test has evolved. It's no longer just about visceral disgust; it's about a reflective judgment on what kind of society we inhabit. The UN Committee decided that some things are beyond the market. That isn't prejudice, Elena. That's a boundary condition for a liberal state.

  **ELENA:** But Hart would ask: *Which* liberal state? One that maximizes liberty unless harm is done? Or one that maximizes a specific conception of the good life? By banning this, the state isn't remaining neutral; it's taking a side in a moral debate Wackenheim didn't agree with. You say it's a boundary condition. I say it's the tyranny of the "critical" elite imposing their version of dignity on the marginalized. Hart warned us that enforcing morality often protects the powerful's sensibilities at the expense of the vulnerable's livelihood.

  **ARTHUR:** And Devlin would warn you that a society that lets the market define the limits of the body eventually loses the ability to call itself a community. We haven't resolved this. The law stands, Wackenheim is unemployed, and we are still arguing about whether dignity is a right you hold or a value you inhabit.

  **ELENA:** Exactly. And until we can distinguish between protecting people and protecting our own feelings about them, the law will remain a blunt instrument.

  **ARTHUR:** Or perhaps, until we admit that feelings about what it means to be human *are* the stuff of law.

  *They stand in silence for a moment, the coffee machine humming between them, neither yielding the ground.*
