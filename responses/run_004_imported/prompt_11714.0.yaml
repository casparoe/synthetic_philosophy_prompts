      *   **The Hart Concession:** Elena must admit Hart wasn't a pure Millian. He allowed some interference for safety/welfare. But she must draw the line at *moral* welfare.
      *   **The Devlin Counter:** Arthur must argue that "dignity" *is* a form of social welfare. A society that tolerates this is degraded.
