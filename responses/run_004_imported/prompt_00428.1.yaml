answer: |-
  The light coming through the kitchen window was divided by the sash, just as everything else seemed to be these days. I stood at the counter, the granite cool against my hips, and watched the steam rise from the kettle.

  My right hand reached for the mug. It was a clean, efficient movement, the one I recognized as mine. It moved with the intention of language, of purpose. *I am making coffee.*

  My left hand rested on the handle of the kettle. It did not move.

  I willed it to lift. I sent the command down the spinal cord, across the bridge that was no longer there, into the silent, dark room of the right hemisphere. *Lift,* I thought. *Pour.*

  The left hand remained still, fingers curled loosely around the plastic. It wasn't paralysis. I knew the nerves were intact. It was a refusal. Or perhaps, it was simply waiting for a command that never arrived, because the part of me that knew how to ask for the kettle to pour was not the part of me that knew how to speak.

  "Come on," I whispered.

  The left hand twitched. Then, slowly, it lifted the kettle. It poured. The stream of water was steady, but it missed the mug. It poured onto the counter, spreading toward the edge.

  My right hand slammed the mug down to stop the spill. "Stop," I said aloud.

  The left hand set the kettle down gently, deliberately, as if mocking the urgency of the right.

  I grabbed a towel. This was the vertigo Nagel wrote about, though he never had to wipe up water with a hand that felt like it belonged to a guest in the house. Was there someone else in here? That was the question that kept me awake at 3:00 AM. Did the silence on the left side contain a mind? Or was it just a machine, a complex subroutine of motor control that had lost its supervisor?

  If it was a mind, it didn't speak. It only acted.

  I turned to the table. The mail was there. I had brought it in ten minutes ago. I sat down and pulled the stack toward me. On top was a utility bill. I placed it squarely in the center of my vision, straddling the midline of my nose.

  *Electric Company,* I read.

  Beneath it was a white envelope with no return address. I shifted the bill. Now the white envelope was in my left visual field. It registered on the right side of my brain.

  I stared at it. I knew, in the way one knows a shadow is moving, that *something* was there. My right hemisphere saw the shape, the texture, perhaps the word printed on the front. But the information could not cross the corpus callosum. It could not reach the language center.

  "What is it?" I asked the room.

  My left hand reached out. It picked up the envelope.

  "I can't read it if you hold it there," I said.

  The left hand ignored me. It slid the envelope further to the left, keeping it in the peripheral vision, guarding it.

  "Give it to me."

  I used my right hand to try and take it. The left hand pulled back, clutching the paper to its chest. It was a childish gesture, protective and possessive. A warmth spread through my left arm, a sensation of anxiety that didn't feel like my anxiety. My heart rate kicked up. The right hemisphere was afraid.

  Why was it afraid?

  I forced my right hand to relax. I softened my gaze. "Okay," I said. "Keep it."

  The left hand relaxed its grip but did not put the envelope down. It traced the edge of the paper with a thumb. It seemed to be reading it through touch, or perhaps through a silent vision I could not access.

  This was the interpreter function at work, or so Gazzaniga would say. My left hemisphere, the speaker, the 'I', was constructing a narrative to explain the behavior of the right. *It is afraid. It is protecting me.* But maybe it was none of those things. Maybe it was just a misfiring of inhibitory neurons. Maybe I was projecting a soul onto a reflex.

  I stood up and walked to the hallway mirror. I needed to see the face.

  The reflection showed a man in his forties, tired, wearing a robe that was slightly askew. I looked into my own eyes.

  "Who are you?" I asked.

  My mouth moved. The sound was my voice.

  In the reflection, my left hand rose. It wasn't a gesture I had planned. It rose to the glass, palm open. It touched the mirror over the reflection of my left eye.

  I hadn't told it to do that.

  I watched the hand. It pressed against the glass. It felt cold. I could feel the pressure of the glass against the palm, the vibration of the house settling in the floorboards. The sensation was real. The agency was the question.

  If I am the one speaking, and I did not will the hand to rise, then who did?

  If it was *me*, then why did it feel like an intrusion?
  If it was *not me*, then why did I feel the coldness of the glass?

  The left hand slid down the glass, leaving a faint smear of condensation. It dropped to my side.

  I looked at the utility bill still on the table, and the white envelope hidden in the shadow of the lamp. I knew the envelope contained something important. My right hand wanted to open it, to categorize it, to file it. My left hand wanted to burn it, or hide it, or keep it closed forever.

  I walked back to the table. I sat down. I placed my right hand on the white envelope.

  The left hand came to rest on top of the right.

  We sat like that for a long time. The weight of the left hand was heavy, anchoring the right. It wasn't a struggle anymore. It was a stalemate. The sun moved across the kitchen floor, crossing the threshold from tile to wood, a line of light that shifted inch by inch.

  I thought about the word *unity*. It implies a state of being one. But I was here, in the chair, breathing air, feeling the weight of the hand on my hand. If there were two of us, we were sharing the same breath. If there was only one of us, the fracture was deeper than tissue.

  My right hand twitched, wanting to slide the envelope out.
  My left hand pressed down, firmer this time.

  I closed my eyes. I listened to the hum of the refrigerator, the sound of a neighbor's car starting outside. I waited to see which hand would move first, or if we would sit here until the light faded, bound together by the silence of the bone, unable to let go, unable to agree on what to do with the day.

  I opened my eyes. The hands were still there. I couldn't tell which one was trembling.
