      *   **Truman Case:** Anscombe argues Truman *intended* the death of civilians to break Japanese morale/will. Therefore, it was murder. The end (surrender) did not justify the means (mass killing of non-combatants).
      *   **Absolute Prohibition:** For Anscombe, certain actions are intrinsically evil (like killing the innocent) and cannot be done *intentionally*, regardless of consequences.
      *   **Moral Absolutism:** She is not a utilitarian. "Military necessity" does not override the prohibition on murdering innocents.

  3.  **Analyze "Double-Tap" Drone Strikes:**
