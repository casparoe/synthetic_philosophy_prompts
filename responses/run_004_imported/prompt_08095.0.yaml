answer: |-
  This is a fantastic angle for a policy debate case. Anscombe is one of the hardest-line moral absolutists in the Just War tradition, which makes her a devastating tool against utilitarian "military necessity" arguments.

  To answer your question directly: **Anscombe would almost certainly classify double-tap strikes as intentional murder of the innocent, indistinguishable in moral kind from the Hiroshima bombing.**

  However, to give you the "actual argument" you need for a debate case, we have to break down *why* her specific formulation of the **Doctrine of Double Effect (DDE)** closes the loopholes that modern military lawyers try to use.

  Here is the breakdown of how Anscombe's logic applies to double-tap strikes, including the strongest possible defense and why she would reject it.

  ### 1. The Core Anscombean Framework
  In *Mr. Truman's Degree*, Anscombe argues that an action is morally defined by the **intention** of the agent, not just the consequences.
  *   **Intended:** The end you seek *or* the means you choose to get there.
  *   **Foreseen (but unintended):** A side effect that happens, but wasn't necessary for the plan to work.

  For Anscombe, you can never *intend* the death of the innocent (non-combatants). If their death is part of your plan (the means) or your goal (the end), the action is intrinsically evil, regardless of how many lives it saves later. Truman intended civilian death to break morale; therefore, it was murder.

  ### 2. The Indictment: Why Double-Tap is "Truman-esque"
  A defender of drone strikes might argue: *"The first strike kills the terrorist. The second strike is just to ensure the target is dead and prevent them from being recovered. Civilian deaths are unfortunate side effects."*

  Anscombe would dismantle this by looking at the **temporal structure** of the double-tap.

  **A. The "Waiting" Proves Intent**
  In a standard airstrike, you hit the target immediately. In a double-tap, there is a deliberate delay (usually 10–30 minutes).
  *   **Anscombe's Analysis:** Why wait? If the intention was purely to destroy a military target (the terrorist/weapon), the first strike suffices, or the second should be immediate.
  *   **The Shift in Object:** The delay indicates that the *object* of the second strike has shifted from the original combatant to **the people gathering at the site.**
  *   **The Means Test:** Under DDE, the "bad effect" (civilian death) cannot be the *means* to the "good effect" (military success). In a double-tap, the tactical utility of the second strike *depends* on innocents (medics, neighbors, family) arriving. If no innocents showed up, the second strike is often considered a "waste of munition" by operators because there is no one left to kill.
  *   **Conclusion:** Because the presence and subsequent death of rescuers is *necessary* for the second strike to achieve its tactical purpose (maximizing casualties/preventing rescue), their death is **intended as a means.** To Anscombe, this is murder.

  **B. Targeting the Function of Mercy**
  Anscombe was a devout Catholic and a strict adherent to the traditional laws of war regarding medics and rescuers.
  *   Targeting first responders is not just killing civilians; it is attacking the *act of mercy* itself.
  *   Even if some combatants are among the wounded, the second strike indiscriminately targets the rescue effort. Anscombe would argue that you cannot intend to destroy a rescue effort because doing so inherently intends the death of those making the rescue (who are, by definition, non-combatants at that moment).

  ### 3. The Defender's Twist (The "Best Case" for the Aff)
  If you are running the drone strike case, or if you need to anticipate how the Neg will try to co-opt Anscombe, here is the only plausible argument a defender could make using her logic:

  **The "Continuous Combatant Function" Argument**
  *   **Argument:** The defender argues that in modern asymmetric warfare, "first responders" are often part of the enemy network. They aren't innocent civilians; they are combatants recovering intelligence or weapons. Therefore, they are legitimate targets.
  *   **DDE Application:** If the people arriving are combatants, their death is not the death of "the innocent." Therefore, the DDE prohibition doesn't trigger. The intention is to kill combatants; the death of any *actual* civilians nearby is merely foreseen, not intended.
  *   **The "Human Shield" Nuance:** The defender argues that if the enemy uses civilians as shields (by bringing them to the strike site), the moral guilt lies with the enemy. The drone operator intends to kill the combatant; the civilian death is a foreseen side effect of the enemy's perfidy.

  ### 4. Why Anscombe Would Reject the Defense
  This is where you crush the argument in round. Anscombe was famous for refusing to bend principles for "complex situations."

  **A. Presumption of Innocence**
  Anscombe would argue that unless you have **positive knowledge** that a specific medic or neighbor is a combatant, you must treat them as innocent.
  *   In *Mr. Truman's Degree*, she rejects the idea that "Japanese morale" (a collective concept) justifies killing individuals. Similarly, she would reject the idea that "potential enemy affiliation" justifies killing rescuers.
  *   **The Burden of Proof:** To intend the death of the rescuers is to judge them guilty without trial. For Anscombe, you cannot kill the innocent even if you *suspect* they might be guilty.

  **B. The "Means" Problem Remains**
  Even if some combatants are present, the *logic* of the double-tap remains flawed under DDE.
  *   If the strike is timed to hit when the *maximum number of people* are present, you are intentionally using the gathering of people as the targeting mechanism.
  *   Anscombe would say: You are willing the death of the group to get the combatant. You have made the death of the group the **means** to your end.
  *   **Quote to paraphrase:** Anscombe famously said, *"It is not lawful to do evil that good may come of it."* Even if the enemy uses human shields, you are not permitted to perform an action where your *intent* is to kill the shields to get to the combatant. You must abort if the only way to hit the target is to intend the death of the innocents.

  **C. The Distinction from "Collateral Damage"**
  A single strike that hits a terrorist compound and accidentally kills a family next door is **foreseen** (Anscombe might tolerate this under strict proportionality).
  A double-tap is **planned** around the arrival of people. The arrival of the "collateral" is the *trigger* for the second strike. This moves it from "collateral damage" (foreseen) to "planned destruction" (intended).

  ### 5. How to Use This in a Debate Round

  **For the Negative (Anti-Drone):**
  *   **Turn the "Precision" Argument:** The Aff will say drones are precise and reduce collateral damage. You argue that double-tap strikes prove the *tactic* relies on killing rescuers. Use Anscombe to say: "Precision doesn't matter if the intention is murder. A precise murder is still murder."
  *   **The "Intrinsic Evil" Standard:** Argue that policy cannot be based on utilitarian calculus (lives saved vs. lives lost). If the *method* (double-tap) violates the absolute prohibition on intending innocent death (per Anscombe), the policy is illegitimate regardless of strategic gain.
  *   **Impact:** This creates a deontological firewall. No amount of "terrorist disruption" outweighs the moral catastrophe of institutionalizing murder.

  **For the Affirmative (Pro-Drone - Hard Mode):**
  *   **Redefine "Innocent":** You must argue that in the specific context of the strike, the "rescuers" are functionally combatants (recovering bodies/weapons). If they aren't innocent, Anscombe's prohibition doesn't apply.
  *   **Foresight vs. Intent:** Argue that the intent is "neutralizing a threat," and the arrival of civilians is an unfortunate environmental factor. The strike is not *because* civilians are there; it is *despite* civilians being there. (Anscombe would likely reject this, but it's the only path).
  *   **Lesser Evil:** Argue that ground raids (the alternative) cause *more* intentional killing. If you must choose between two actions where innocent death is foreseen, choose the one with fewer deaths. (Note: Anscombe hates this argument, but judges might like it).

  ### Summary for your Case
  Anscombe would view the double-tap strike as a **technological refinement of the Truman doctrine.**
  *   **Truman:** Kill civilians to break the will of the state.
  *   **Double-Tap:** Kill civilians (rescuers) to break the will of the cell/prevent recovery.

  Both treat the death of non-combatants as a **tactical instrument.** For Anscombe, once death becomes an instrument rather than a tragedy, the action is murder. There is no "twist" in her logic that saves the double-tap, because the *timing* of the second strike proves the death of the rescuers is part of the plan, not a side effect.

  **Key Evidence Tagline:** *"Anscombe's 'Mr. Truman's Degree' establishes that intending the death of the innocent is intrinsically evil, regardless of military necessity. Double-tap strikes, by timing munitions to coincide with rescue efforts, transform civilian death from a foreseen side-effect into an intended means of tactical success, violating the absolute prohibition on murder."*
