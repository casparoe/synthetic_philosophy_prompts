      *   **Purpose of Strike 2:** To kill first responders, medics, neighbors, or survivors who come to aid the wounded.
      *   **Status of Victims in Strike 2:** Often civilians (medics, family, bystanders). Even if combatants are among them, the strike targets the *act of rescue* or the *presence of survivors*.
      *   **Intent:** The explicit tactical goal is to maximize casualties among those gathering at the site.

  4.  **Apply Anscombe's Logic to Double-Tap:**

