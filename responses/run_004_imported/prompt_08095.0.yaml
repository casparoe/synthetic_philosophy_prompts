          *   **Means vs. Side Effect:** In DDE, the bad effect cannot be the *means* to the good end. Here, killing the rescuers *is* the means to prevent enemy recovery/propaganda/intelligence gathering.
          *   **Comparison to Truman:** Truman killed civilians to break morale. Double-tap kills civilians to ensure the kill chain is complete. Both treat innocent death as a tool.
          *   **Conclusion:** This is a direct violation of the absolute prohibition on intending the death of the innocent.

      *   *Argument B: The Defender's Twist (The "Hard Case" for Anscombe).*
          *   **Claim:** The target is still the combatant (the wounded terrorist).
          *   **Foresight:** We *foresee* medics might die, but we *intend* to finish off the combatant.
          *   **Counter-Counter:** This fails because the timing is specific. You wait for people to gather. If the intent was just "finish the combatant," you'd strike immediately while they are down. Waiting implies the *gathering* is the target.
          *   **Another Twist:** "Human Shields." If combatants use medics as shields, does that change liability? Anscombe is strict: you still can't intentionally target the shielded area if you know innocents are there, unless the act itself isn't intrinsically evil. But targeting a rescue effort is inherently targeting non-combatant function.

