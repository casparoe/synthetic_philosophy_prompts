answer: |-
  This is a classic bargaining problem with asymmetric disagreement points (BATNAs). It is an excellent candidate for applying cooperative game theory, but there is a mathematical nuance here that is crucial for your negotiation strategy: **in this specific linear context, the Kalai–Smorodinsky (KS) and Nash (NBS) solutions actually converge on the same number.**

  However, the *logic* behind KS provides you with a much stronger rhetorical tool to defend that number against a naive 50/50 split. Below is the breakdown of the three approaches, the math behind them, and how to use the KS axioms to negotiate without damaging your friendship.

  ### 1. Formalizing the Problem

  To apply the solutions, we must define the parameters of the bargaining game:

  *   **The Feasible Set ($S$):** The total amount to split is $\$12,000$. Any split $(x, y)$ where $x + y = 12,000$ is feasible.
  *   **The Disagreement Point ($d$):** This is what happens if you *do not* agree on how to split the $\$12,000$.
      *   **You ($d_1$):** $\$5,000$ (Your standing license offer).
      *   **Friend ($d_2$):** $\$0$ (No fallback offer).
  *   **The Surplus:** The value created by cooperating is the total pot minus the disagreement values:
      $$12,000 - (5,000 + 0) = \$7,000.$$

  ### 2. The Three Approaches

  #### A. The Naive 50/50 Split
  This approach ignores the disagreement point entirely and treats the $\$12,000$ as a windfall to be divided equally.
  *   **You:** $\$6,000$
  *   **Friend:** $\$6,000$
  *   **Net Gain over BATNA:** You gain $\$1,000$ ($6k - 5k$); Friend gains $\$6,000$ ($6k - 0$).
  *   **Verdict:** This is heavily skewed against you. It treats your $\$5,000$ outside option as irrelevant, violating the intuition that your stronger fallback should command a larger share of the joint deal.

  #### B. The Nash Bargaining Solution (NBS)
  The NBS maximizes the product of the players' gains over their disagreement points: $\text{Maximize } (x - d_1)(y - d_2)$.
  In a transferable utility game (like splitting cash), this results in an **equal division of the surplus**.
  *   **Surplus to split:** $\$7,000$.
  *   **Each gets:** $\$3,500$ of surplus.
  *   **You:** $\$5,000 \text{ (BATNA)} + \$3,500 = \mathbf{\$8,500}$.
  *   **Friend:** $\$0 \text{ (BATNA)} + \$3,500 = \mathbf{\$3,500}$.

  #### C. The Kalai–Smorodinsky (KS) Solution
  The KS solution replaces the Nash axiom of *Independence of Irrelevant Alternatives (IIA)* with **Individual Monotonicity**. It finds the point on the Pareto frontier that preserves the ratio of each player's *actual gain* to their *maximum possible gain* (the Ideal Point).

  1.  **Calculate the Ideal Point ($a$):**
      *   **Your Max ($a_1$):** The most you could get if your friend got her minimum ($0$). You get $\$12,000$.
      *   **Friend's Max ($a_2$):** The most she could get if you got your minimum ($\$5,000$). She gets $\$12,000 - \$5,000 = \$7,000$.
  2.  **Calculate Potential Gains ($a - d$):**
      *   **Your Potential:** $\$12,000 - \$5,000 = \$7,000$.
      *   **Friend's Potential:** $\$7,000 - \$0 = \$7,000$.
  3.  **The Solution:**
      *   Since both of you have the exact same *potential gain* ($\$7,000$), KS dictates you should realize the same *proportion* of that potential.
      *   This leads to an equal split of the surplus.
  *   **You:** $\mathbf{\$8,500}$.
  *   **Friend:** $\mathbf{\$3,500}$.

  ### 3. Comparison and Implications

  #### KS vs. Naive 50/50
  *   **Difference:** The KS solution awards you **$\$2,500$ more** than the naive split ($\$8,500$ vs $\$6,000$).
  *   **Implication:** The KS framework validates your BATNA not as a "threat" to walk away, but as a **baseline claim** on the value. It argues that the first $\$5,000$ of the pot effectively "belongs" to you by right of your outside option, and only the remaining $\$7,000$ is truly joint property to be negotiated.

  #### KS vs. Nash (NBS)
  *   **Numerical Result:** In this specific scenario (linear money splitting), **they are identical.** Both prescribe an $\$8,500 / \$3,500$ split.
  *   **Why?** Because the "Ideal Gains" for both parties happen to be symmetric ($\$7,000$ each).
  *   **The Axiomatic Difference:**
      *   **Nash (IIA):** Focuses on the shape of the feasible set. It can be sensitive to "irrelevant" options that are not chosen.
      *   **KS (Individual Monotonicity):** Focuses on the **Ideal Point**. It guarantees that if your "Ideal Point" improves (e.g., if the total pot grew to $\$15,000$, increasing your max claim), your payoff cannot decrease.
      *   **Practical Implication:** While the number is the same, the **KS justification is stronger for you.** It anchors the negotiation on the *ratio of claims*. It frames the $\$5,000$ not just as a fallback, but as a constraint on your friend's maximum possible claim (she can never claim more than $\$7,000$ because you must get at least $\$5,000$).

  ### 4. How to Approach the Negotiation

  Do not walk into the conversation citing "Kalai–Smorodinsky" or "Nash axioms." That creates adversarial distance. Instead, use the logic of **Individual Monotonicity** to frame the fairness of the split.

  **The Script:**
  > "I've been thinking about how to split the acquisition offer fairly. If we don't take this deal, I have a standing offer for $\$5,000$ for the backend, and you have $\$0$. That means the first $\$5,000$ of this acquisition is essentially covering my existing value.
  >
  > That leaves $\$7,000$ of *new* value that we created together. It seems fairest to split that *new* value 50/50. So, I take my $\$5,000$ baseline plus half the surplus ($\$3,500$), and you take half the surplus ($\$3,500$). That puts us at $\$8,500$ for me and $\$3,500$ for you."

  **Why this works:**
  1.  **It uses Individual Monotonicity:** You are arguing that your share *must* reflect your outside option (monotonicity in your disagreement point).
  2.  **It avoids IIA:** You are explicitly rejecting the idea that the outside offer is "irrelevant" to the joint split (which a 50/50 proponent would argue).
  3.  **It preserves the relationship:** You are offering to split the *joint effort* (the surplus) equally. You aren't claiming you deserve more because you are better; you are claiming you deserve more because you are bringing more to the table *independently*.

  ### 5. A Warning on Friendship

  Game theory assumes rational agents maximizing utility. Friends operate on equity, reciprocity, and long-term trust.

  *   **The Risk:** Insisting on the game-theoretic optimum ($\$8,500$) might feel like "holding the project hostage" to your friend, even if it is mathematically defensible. She may view the $\$12,000$ as a shared windfall regardless of individual BATNAs.
  *   **The Compromise:** If she pushes back hard on the $\$8,500$, recognize that the **Nash/KS solution is a focal point, not a mandate.**
      *   A split of **$\$7,500 / \$4,500$** still leaves you $\$1,500$ better off than the naive 50/50, while giving her a psychological win.
      *   Alternatively, propose a **$\$7,000 / \$5,000$** split. This ensures you match your BATNA plus a premium, and she gets a "nice round number" that feels substantial.

  **Summary Recommendation:**
  Anchor the negotiation at the KS/NBS recommendation (**$\$8,500 / \$3,500$**) using the logic of "splitting the surplus." This is the most defensible position. However, be willing to concede some of that surplus (down to $\$7,500$) to preserve the friendship, as the "cost" of the friendship likely exceeds the marginal utility of the extra $\$1,000$.

  **Final Note:** The fact that KS and NBS converge here is a feature of linear money splitting. If you were negotiating equity in a future venture (non-linear utility), the KS solution would likely diverge from Nash, typically favoring the player with the higher ideal point more aggressively. In this cash deal, however, the "Equal Surplus Split" is the robust game-theoretic standard.
