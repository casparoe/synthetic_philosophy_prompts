      *   *Connection to Sec IV:* The "secret springs" of nature. We don't know them. So we rely on experience. If experience is uniform, the inference is maximal.

  7.  **Final Polish:** Ensure the tone is appropriate for a colleague/peer (academic, respectful, rigorous). Structure with clear headings. Provide specific textual references where possible. (e.g., distinguishing Part I and Part II of Section X).

