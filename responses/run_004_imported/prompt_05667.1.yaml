answer: |-
  Here are 9 interview questions (plus a soft sign-off) designed to flow logically from metaphysics to language to modal consequences, ending with the comparative landscape you requested. Each includes the predicted dodge and a closing follow-up.

  **1. The "Pre-Unified" Claim (Bradley's Demand)**
  "You argue that facts come 'pre-unified' in a way sets don't, so the regress never starts. But Bradley's challenge isn't just about adding relations; it's a demand for intelligibility regarding *how* constituents cohere. Isn't saying 'facts are just unified' effectively relabeling the mystery rather than solving it?"
  *   **Predicted Dodge:** "It's a category mistake to ask for 'glue' for a fact; facts aren't composites."
  *   **Follow-up:** "But if we can't articulate *why* they aren't composites without appealing to the very unity in question, haven't we just asserted dogmatism over explanation?"

  **2. Rejecting the "Glue" Alternatives**
  "You explicitly reject Fregean unsaturatedness and primitive nonrelational ties. What specifically fails in those accounts that your worldly fact view avoids? Is it just ontological parsimony, or do they fail to explain unity on their own terms?"
  *   **Predicted Dodge:** "They reify linguistic features into metaphysical oddities."
  *   **Follow-up:** "But if language tracks reality, doesn't rejecting those features risk making the syntax-world connection unintelligible?"

  **3. The Syntax-to-World Hook**
  "On your view, an interpreted sentence's syntax encodes the fact. But syntax is combinatorial (parts arranged), while you say the fact isn't a composite. How does a combinatorial vehicle successfully encode a non-combinatorial object without distorting it?"
  *   **Predicted Dodge:** "Encoding is a functional role, not a structural mirror."
  *   **Follow-up:** "If there's no structural isomorphism, what constrains the encoding so that 'Dara swims' picks out *that* fact and not *that swimming is Dara*?"

  **4. The Circularity Charge (Encoding)**
  "To say speakers use relation R to *encode that* Dara has the property of swimming seems to presuppose the unity of the content 'Dara has the property of swimming.' Aren't you smuggling the unity you're trying to explain into the explanation of the linguistic practice?"
  *   **Predicted Dodge:** "That's an empirical question about linguistic practice, not a philosophical one."
  *   **Follow-up:** "But any empirical description of that practice must attribute intentional states to the speakers; doesn't describing *those* states reignite the regress?"

  **5. The Modal Cost (No Thinkers)**
  "If propositions depend on actual interpretive practice to be unified, what is the status of the proposition *that there are no language users*? Its truth seems to require the falsity of its own existence conditions."
  *   **Predicted Dodge:** "We can abstract away from actual users to consider possible practices."
  *   **Follow-up:** "But if the proposition's identity conditions essentially involve actual users, abstraction gives you a *different* proposition, not the one about a user-less world."

  **6. The Problem of Falsehood**
  "If propositions *are* worldly facts, what is the ontological status of false propositions? Are we committed to non-obtaining states of affairs, or do false sentences fail to express propositions at all?"
  *   **Predicted Dodge:** "False sentences express conditions that don't obtain, not non-existent facts."
  *   **Follow-up:** "But if the proposition *is* the fact, and the fact doesn't obtain, then strictly speaking, there is no proposition for the false sentence to express."

  **7. Hyperintensionality (Hesperus/Phosphorus)**
  "Does your view distinguish between *that Hesperus is Hesperus* and *that Hesperus is Phosphorus*? If the proposition is just the worldly fact, and the fact is the same, do you collapse the cognitive difference?"
  *   **Predicted Dodge:** "That's a difference in mode of presentation, not the proposition itself."
  *   **Follow-up:** "But if the proposition is the object of belief, and agents can believe one without the other, doesn't that force you to individuate propositions more finely than facts?"

  **8. Normativity and Competence**
  "You rely on 'competent speakers' to fix the encoding. What fixes the normativity of competence here? Is it community consensus, and if so, doesn't that make propositional unity contingent on sociological facts?"
  *   **Predicted Dodge:** "Competence is fixed by successful coordination in the world."
  *   **Follow-up:** "But successful coordination presupposes the parties already share unified contents to coordinate *about*."

  **9. Fine and Armstrong (Comparative Landscape)**
  "Kit Fine's antipositionalism argues that we should drop propositions entirely to solve unity, while Armstrong accepts brute states of affairs. How is your 'worldly fact' view distinct from Armstrong's brute facts, and why not follow Fine in eliminating the propositional layer altogether?"
  *   **Predicted Dodge:** "I'm offering a naturalistic middle ground they ignore."
  *   **Follow-up:** "But Fine's core argument is that naturalism *can't* solve the unity problem; does your appeal to linguistic practice actually answer his metaphysical worry, or just sidestep it?"

  **10. Closing/Preview**
  "Given these tensions, what's the one specific argument in today's talk where you think the 'worldly fact' approach pays its highest dividend compared to the traditional views?"
  *   **Predicted Dodge:** "The account of truth-making."
  *   **Follow-up:** (None needed; this is the hand-off to the audience).
