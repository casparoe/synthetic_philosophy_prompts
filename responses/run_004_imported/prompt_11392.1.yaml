prompt: |-
  ok so for my decision theory seminar we've got a guest colloquium speaker next week and I somehow got stuck on the panel that has to send over questions for the Q&A in advance. she's a decision theorist who's big paper revives the money-pump argument as THE real justification for the expected utility axioms -- her whole angle is that dutch books only get you coherent credences, not coherent preferences over actions, so the pump has to do the actual work. can you draft me 8-10 questions that press on that instead of just having her restate it? i need atleast one on the resolute choice escape (McClennen's move where you precommit to a plan up front and never reconsider, so the pump supposedly can't touch you even with "incoherent" preferences), one on whether the representation theorem she leans on actually forces a unique cardinal utility function or if that's smuggled in from elsewhere, and one on whether any of this is meant to describe how real agents (or AI systems -- apparently her paper gets cited a ton in that context) actually behave, vs just being a normativity claim nobody's required to satisfy. for each one throw in a quick note on what she'll probably say back and a follow up that doesn't let her off the hook.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Context:** Decision Theory Seminar, Guest Colloquium.
      *   **Speaker's Position:** Revives the Money-Pump Argument as the *primary* justification for Expected Utility (EU) axioms. Distinguishes this from Dutch Book arguments (which target credences, not preferences/actions).
      *   **Task:** Draft 8-10 questions for a pre-submitted Q&A panel.
      *   **Constraints:**
          *   Must press on her specific angle (Money Pump > Dutch Book for preferences).
          *   Must *not* let her just restate her position (needs to be challenging/critical).
          *   **Mandatory Inclusions:**
              1.  Resolute Choice (McClennen's precommitment escape).
              2.  Representation Theorem/Uniqueness of Cardinal Utility (is it smuggled in?).
              3.  Descriptive vs. Normative (Real agents/AI vs. Ideal Normativity).
          *   **Format:** For each question, include a "Likely Response" note and a "Follow-up" to keep the pressure on.
          *   **Quantity:** 8-10 questions.

  2.  **Deconstruct the Speaker's Argument (Mental Model):**
      *   *Core Claim:* Rational preferences must satisfy EU axioms because violating them makes you susceptible to a money pump (sure loss through a sequence of trades).
      *   *Contrast:* Dutch Book = Beliefs (probabilities). Money Pump = Preferences (utilities/actions).
      *   *Vulnerabilities:*
          *   Dynamic inconsistency (can I just plan ahead?).
          *   The "small world" assumption (does the pump work in realistic contexts?).
          *   The cost of rationality (is avoiding a pump worth the cognitive load?).
          *   Uniqueness (EU represents preferences, but does it fix the scale uniquely without extra assumptions?).
          *   AI Safety relevance (do we *want* AI to be money-pump proof, or does that lead to instrumental convergence issues?).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Resolute Choice (McClennen).*
          *   *Draft:* What about McClennen's resolute choice? If I precommit, can't I avoid the pump?
          *   *Refinement:* Make it sharper. Focus on whether resolute choice is itself a preference structure that violates EU or if it's a meta-preference.
          *   *Follow-up:* If resolute choice avoids the pump but violates Separability, why is Separability more fundamental than the immunity to loss?

      *   *Requirement 2: Representation Theorem/Uniqueness.*
          *   *Draft:* Does your theorem give a unique utility function?
          *   *Refinement:* Focus on the cardinality. EU is unique up to positive affine transformation. Does the money pump argument justify the *interval* scale, or just the ordering? Often the cardinality comes from independence, but is that justified by the pump or assumed?
          *   *Follow-up:* If the pump only forces ordinal consistency, where does the cardinal structure needed for risk attitudes come from?

      *   *Requirement 3: Descriptive vs. Normative (AI/Humans).*
          *   *Draft:* Is this about how people act or how they should? What about AI?
          *   *Refinement:* Connect to AI safety. If we build AI to avoid money pumps, does that force instrumental convergence (seeking power to prevent future trades)?
          *   *Follow-up:* If avoiding pumps drives AI to seek power, is the normative claim still safe to endorse?

      *   *Filling the remaining 5-7 slots (aiming for depth on the Money Pump mechanism).*
          *   *Idea 4: The "One-Shot" Problem.* Money pumps require repeated interaction. What about one-off decisions (existential risk)?
          *   *Idea 5: Transaction Costs.* Real trades have friction. Does the pump vanish if transaction costs > pump profit?
          *   *Idea 6: Learning.* Can an agent learn not to get pumped without having EU preferences initially? (Evolutionary argument).
          *   *Idea 7: State-Dependence.* Money pumps assume stable preferences across states. What if preferences legitimately change?
          *   *Idea 8: The "Shmoney" Pump.* If I value not being manipulated, isn't paying to avoid the pump rational even if it violates EU? (Preferences over processes).
          *   *Idea 9: Dynamic Consistency vs. Separability.* The pump relies on dynamic inconsistency. Is dynamic consistency a rational requirement or just a structural convenience?
          *   *Idea 10: The Scope of "Action".* Dutch books target beliefs. Money pumps target actions. But actions depend on beliefs. Is the separation as clean as she claims?

  4.  **Review and Refine:**
