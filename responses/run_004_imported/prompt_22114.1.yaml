      *   **Friend's Position:** Ramsey is just making a substantive counter-claim (humans matter more than stars). Objection (via Nagel): Saying mattering is perspective-dependent just postpones the problem. Why privilege the human perspective over the detached one? We can't just ignore the detached standpoint.
      *   **Task:** Evaluate the essay/argument point-by-point.
