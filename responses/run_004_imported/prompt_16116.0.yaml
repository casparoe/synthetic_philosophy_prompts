          3.  The New Hume (Realist) Strategy: Hidden bases.
          4.  Critical Comparison: Which is more "Humean"?
          5.  Recommendation for the dissertation.

  7.  **Final Polish:** Check for clarity on the "Copy Principle." Ensure the distinction between *epistemology* (what we know) and *ontology* (what exists) is sharp, as that's where the New Hume debate lives. (Self-correction: Make sure to mention that Lewis, a Humean, tried to solve finks with "causal bases," which might be a bridge).

  8.  *(Final check against prompt)*: Did I answer both parts? (1) How should Hume respond? (2) Are New Hume readers better placed? Yes.

