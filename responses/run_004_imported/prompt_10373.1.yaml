answer: |-
  **Setting:** *A sterile laboratory. In the center sits a heavy steel box with a glass viewing port and a large red lever. A digital display reads $10,000.00. The hum of cooling fans is the only sound.*

  **Alex:** (Hand hovering over the lever) Look at the math, Jamie. It's trivial. In fifty percent of the branches, I'm ten thousand dollars richer. In the other fifty percent, I'm dead. But I'm not *in* the branches where I'm dead. I'm only in the ones where I'm rich. So, from my perspective, it's free money.

  **Jamie:** From your *indexical* perspective, sure. But you're treating the Born rule like a suggestion. You're ignoring the measure. When you pull that lever, you aren't just choosing a path; you're halving the amplitude of your future existence.

  **Alex:** Amplitude is for calculating probabilities before decoherence. After the split, there's just me. The Alex in the dead branch isn't me. He's a copy who made a bad luck draw. I'm the one who survives.

  **Jamie:** He's not a copy, he's *you*. Just as real. The difference is weight. Think of the wavefunction as a fabric. You're proposing to cut half of your thread away. Sure, the remaining thread feels continuous to the fiber itself, but the total amount of *Alex* in the universe drops by half.

  **Alex:** Why should I care about the total amount of me in the Hilbert space? I care about the me experiencing the next second. And the next second, I'm alive and rich. The other guy experiences nothing. Zero utility, zero disutility. It's the same as if he never existed.

  **Jamie:** That's the Sleeping Beauty problem wearing a lab coat. If Beauty wakes up, she knows she's in a branch where the coin didn't kill her, but she should still assign credence based on the pre-split probabilities. You're saying that because you condition on survival, the probability of death becomes zero. But the *risk* isn't about what you feel; it's about the distribution of outcomes across the multiverse.

  **Alex:** Sleeping Beauty is about self-locating uncertainty *before* the reveal. I'm talking about post-selection. Once the lever moves, decoherence happens. The branches don't talk to each other. The dead Alex doesn't suffer. His family grieves in that branch, sure, but *my* family—the ones in this branch—get ten grand and a living husband.

  **Jamie:** Your family in the other branch gets a corpse. And you're saying that doesn't count because *you* won't see it? That's solipsism disguised as quantum mechanics. The measure matters because it dictates how much of the future light-cone contains you. If you keep pulling this lever, Alex, your measure approaches zero. You become a ghost. A rare fluctuation.

  **Alex:** A ghost that's rich. Look, if I believe MWI, I have to accept that all outcomes happen. If all outcomes happen, the only variable I can optimize for is which outcome *I* witness. I can't witness death. So death isn't an outcome for me. It's a wall.

  **Jamie:** It's not a wall, it's a truncation! You're arguing for a "caring measure" of one, where you only value the branch you occupy. But rational agents should maximize expected utility across the whole wavefunction. If you die in half the branches, the expected utility of the action is negative, regardless of what the survivor thinks.

  **Alex:** Expected utility for who? There is no "who" that spans both branches after decoherence. There's only the pre-split anticipation. And my anticipation is 100% survival.

  **Jamie:** Your anticipation is wrong because you're ignoring the weight of the anticipation. There are two future Alexes. One sees money. One sees nothing. The sum of their experiences isn't dominated by the survivor; it's weighted by the amplitude. You're effectively burning half the future Alexs for cash.

  **Alex:** I'm not burning them. They die instantly. Painlessly. By the quantum mechanism. It's not murder; it's pruning.

  **Jamie:** It's suicide! Just because the other version is ontologically distinct doesn't mean he's morally distinct. If I clone you and shoot the clone, you'd be horrified.

  **Alex:** I'd be horrified because *I* might be the one who gets shot before the split stabilizes. But this machine? It kills the other branch *after* the split. I'm safe.

  **Jamie:** The split is instantaneous. There is no "after" where you're safe and he's dying. You are both dying and living simultaneously relative to the pre-split state. You're betting on a certainty that doesn't exist in the global frame.

  **Alex:** The global frame doesn't have a wallet. I do.

  **Jamie:** (Steps closer, hand reaching out to block the lever) The global frame has your daughter. And in half the branches, she loses her father today. You can't justify that with indexical selfishness.

  **Alex:** (Pauses, hand tightening on the lever) In the branches where she loses me, she also gets the insurance payout. And in the branches where she keeps me, she gets the money *and* me. I'm winning in every branch that matters to *me*.

  **Jamie:** You're defining "matters" as "where you exist." That's circular. If you pull this, you're proving that measure is irrelevant to decision theory. And if measure is irrelevant, MWI collapses into solipsism.

  **Alex:** Or it proves that consciousness follows the path of continuity.

  **Jamie:** It proves you're willing to sacrifice reality for perspective.

  **Alex:** (Grips the lever) Perspective is the only reality I have access to.

  **Jamie:** Then you've already lost the argument. You just don't know which branch you're in yet.

  **Alex:** (Smiles) Watch me.

  *Alex pulls the lever. The machine whirs. Jamie closes their eyes. The hum stops.*
