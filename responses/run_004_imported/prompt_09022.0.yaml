answer: |-
  The dust in the Kharga Depression was not like ordinary dust; it was ground bone, ancient and fine, settling into the creases of Aris's gloves. She sat on the edge of the trench, her trowel resting on a slab of sandstone. Below her, the stratigraphy was perfect: distinct, horizontal bands of red and ochre, a layered cake of deep time.

  "Layer four," she said, her voice dry. "Confirming Eocene."

  Her assistant, Kael, scratched the label on the sample bag. He didn't look up. "Confirmed."

  This was the rhythm of the dig. Find, scrape, bag, label. The logic was seamless. The depth implied the age; the fossils confirmed the depth; the age explained the fossils. It was a closed loop of certainty, tight as a drumhead. Aris had spent twenty years inside this loop. She knew, without knowing how she knew, that the earth beneath her had existed for millions of years before she arrived. It was not a belief she held; it was the ground she stood on.

  Then Kael paused, the marker hovering over the bag.

  "Why?" he asked.

  Aris blinked. The heat shimmered off the trench walls. "Why what?"

  "Why is this Eocene?" Kael tapped the sandstone. "I mean, how do we actually know?"

  Aris smiled, a reflex. "Index fossils. The foraminifera in the matrix. The position relative to the K-Pg boundary."

  "But how do we know the boundary is older?"

  "Because it's lower."

  "And lower means older because?"

  "Because of sedimentation rates. Because of gravity."

  Kael shrugged, satisfied, and capped the marker. But the question hung in the hot air, heavier than the dust. Aris looked back at the slab.

  *Because lower means older.*

  She reached for her trowel, but her hand stopped. The logic she had just spoken was a circle. The rock was old because it was deep, and it was deep because it was old. The verification relied on the thing being verified. She had always known this, abstractly, but she had never *felt* it. Until now, the proposition *The earth has existed for a long time* had been a hinge. It held the door of her work open. You do not check the hinge; you turn on it.

  Now, the hinge was vibrating.

  She looked at the sandstone. It was grey-red, coarse-grained. It was simply there. To say it was "fifty million years old" was to attach a narrative to it, a narrative that required the assumption of time to validate the assumption of time.

  "Hand me the tape," Aris said.

  Kael tossed it. She caught the plastic casing, pulled the yellow ribbon out, and hooked it onto the edge of the trench. She lowered it to the slab. One meter. Two meters.

  The numbers on the tape were black ink on yellow plastic. They denoted length. But how did she know the tape hadn't stretched? How did she know the meter was the same today as it was yesterday? She knew because she trusted the standard. She trusted the standard because it had remained constant. Because it had remained constant over time.

  *Time.*

  The word felt like a stone in her mouth.

  She pulled the tape up. The ribbon coiled back into the casing with a snap. The sound was sharp, immediate. But the distance it had measured seemed to dissolve. The slab was below her. That was a spatial fact. But the *depth*—the vertical distance through time—was gone. The rock was no longer a record. It was just an object adjacent to another object.

  "Aris?" Kael asked. "You okay?"

  "The label," she said. "Take it off."

  "The bag?"

  "The layer. Stop calling it Eocene."

  Kael frowned. "It's protocol. We need to log the epoch."

  "There is no epoch." Aris stood up. Her knees cracked. The sound was present, but the history of her body—the wear and tear of forty years—felt suddenly unmoored. Was her pain old, or was it just happening now, without a past to anchor it? "We're just moving dirt."

  "We're reconstructing history."

  "Are we?" Aris stepped down into the trench. Her boots crushed the loose scree. "Suppose I tell you this rock was created five minutes ago, exactly as it is, with the fossils inside it. How would you prove me wrong?"

  "Carbon dating," Kael said automatically.

  "Which relies on decay rates."

  "Right."

  "Which rely on time."

  Kael wiped sweat from his brow. "You're doing the skepticism thing. It's not useful. We have work."

  "It's not skepticism," Aris said. She knelt by the slab. She ran her thumb over a trilobite fossil embedded in the surface. It was a beautiful, intricate thing. Eyes like crescents. "Skepticism says I might be wrong. This is different. I'm saying the method of checking doesn't catch on anything. It spins."

  She pressed her thumb against the fossil. It was hard. Cold. It existed. But its *antiquity* was a ghost. It was a property she was projecting onto it, like color in the dark. Without the hinge proposition—that the earth persists, that causes precede effects, that the past is fixed—the fossil was just a shape.

  She picked up the trowel. She meant to scrape the surface, to reveal the next layer. But the action felt meaningless. Scraping revealed what was underneath. But "underneath" implied a sequence of deposition. If the sequence wasn't fixed, she wasn't uncovering history; she was just rearranging matter.

  The sun beat down. The shadow of the trench wall shifted. It moved inches to the east. Aris watched it. The movement implied duration. But if the hinge was loose, the shadow wasn't moving *through* time; it was just occupying different positions. One position here. One position there. No connective tissue.

  "I can't log this," Kael said quietly. He was holding the sample bag, the label flapping in the breeze. "If I don't write the epoch, the database rejects it."

  "Then don't write it."

  "Then the sample is useless."

  "It's a rock, Kael."

  "It's data!"

  "It's a thing!" Aris snapped. She stood, dusting her hands. The dust came off, but some remained in the lines of her palms. She looked at her hands. They were hers. She knew that. But she realized she knew it only because she assumed she had had them yesterday. If she couldn't assume that, if the hinge swung open, were they just hands attached to her now? Was there a difference?

  The vertigo wasn't nausea. It was silence. The noise of the dig site—the generators, the shouts, the wind—continued, but the *meaning* of the noise had drained away. They were making sounds about ages that might not exist. They were measuring distances that might not hold.

  "I'm going up," Aris said.

  "We haven't finished the grid."

  "The grid is a fiction."

  She climbed the ladder out of the trench. At the top, the desert stretched to the horizon. Flat, endless, brown. She looked at her watch. 14:00. The hands pointed to the numbers. She knew what time it was because the watch agreed with the sun, and the sun agreed with the watch. Another circle.

  She walked back to the tent. Inside, her desk was covered in maps. Topographical lines. Geological keys. Legends explaining the symbols. She swept her arm across the desk. The papers fluttered to the floor.

  They didn't look like lies. They looked like drawings. Accurate, precise drawings of a world that was simply *there*. The layer of "history" that she had painted over them had peeled away.

  Kael climbed out of the trench ten minutes later. He stood at the tent flap, holding a sample bag.

  "I logged it," he said. "I put 'Unknown'."

  Aris looked at him. "And?"

  "The system accepted it. As a temporary state."

  "There is no permanent state," Aris said. She picked up a pen. She held it between her fingers. It was a tool for marking. But what was she marking? If she wrote *Today*, what did it refer to? A point on a line that might not be a line.

  "We have to eat," Kael said. "The supply truck comes tomorrow."

  "Does it?"

  "It's scheduled."

  "Schedules assume a future."

  Kael shifted his weight. He looked tired. Not the tiredness of work, but the tiredness of holding something heavy. "Aris. If you stop acting like the earth is old, you can't dig. If you can't dig, you can't eat. The hinge isn't there to be looked at. It's there to hold the door."

  Aris looked at the pen again. She pressed the tip to the paper. The ink flowed. A black line.

  "I know," she said.

  "But?"

  "But I can feel it swinging."

  She drew a circle on the paper. It was a perfect circle. It had no beginning and no end. It was a closed loop. Like the logic of the strata. Like the logic of the watch.

  "Tomorrow," Aris said, putting the pen down. "When the truck comes. We will check the supplies."

  "Okay."

  "And we will assume they are the supplies we ordered."

  "Yes."

  "And we will assume the truck traveled through time to get here."

  Kael nodded slowly. "Yes."

  "And we will eat."

  "Yes."

  Aris looked at the circle on the paper. It was just ink. But if they agreed to treat it as a wheel, it would turn. If they agreed to treat the rock as ancient, it would speak. The certainty wasn't in the ground. It was in the agreement to stand on it.

  "Close the flap," Aris said. "The dust is getting in."

  Kael pulled the canvas shut. The light dimmed. The world outside was fixed, for now, by the weight of their silence. Aris folded her hands on the desk. She did not look at them to count the fingers. She simply let them rest, two heavy things anchoring her to the table, waiting for the next motion to begin.
