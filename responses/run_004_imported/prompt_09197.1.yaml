answer: |-
  Descartes is visiting a friend who is showing off his new magpie. The friend insists the bird has a rational soul because it can hold a conversation.

  Descartes says, "Test it. But do not test its memory. Test its *reason*."

  The friend says to the bird, "I am going to give you a seed."
  The magpie opens its beak and says, "Give me seed."

  The friend says, "I am going to take your seed away."
  The magpie flaps its wings and says, "Take seed away."

  Descartes nods. "You see? It repeats the arrangement of words that matches its passion. It feels the hope, it feels the fear. Its nerves are vibrating just as ours do."

  The friend says, "But it understands the meaning! Watch." He turns to the bird. "If I take the seed, will you be sad?"
  The magpie tilts its head and says, "Will you be sad?"

  Descartes turns to leave. "There is your proof. Even the most dull-witted peasant could arrange different words to answer *what was meant*. The bird only reacts to *what was sounded*. It feels the sadness, certainly. Its blood cools, its spirit sinks. But it does not *know* it is sad. It is a machine that weeps, but cannot tell you why."

  The friend asks, "So when I step on its foot, it feels nothing?"

  Descartes pauses at the door. "Oh, no. It feels the foot. It just doesn't know *whose* foot it is."
