          *   In *existential meaning*: We cannot live *for* the remote future in a way that negates the present. The "value" of the remote future is real, but our *connection* to it is mediated through local actions.
          *   The "present value" joke in the existential context likely refers to *emotional salience*, not *moral weight*.

