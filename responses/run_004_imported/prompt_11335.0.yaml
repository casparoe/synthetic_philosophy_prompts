      *   **Goal:** Determine who is right and explain it clearly to settle the argument.

  2.  **Determine the Statistical Truth:**
      *   **The Core Issue:** This is the classic problem of *optional stopping* or *peeking* in frequentist hypothesis testing.
      *   **The User is Right:** Checking p-values repeatedly without correction inflates the Type I error rate (false positive rate). The nominal $\alpha = 0.05$ no longer holds.
      *   **The Friend is Wrong:** While each individual calculation is mathematically "correct" for *that specific snapshot*, the *process* of stopping based on those snapshots violates the assumptions underlying the p-value interpretation. The past failures are *not* a separate issue; they are direct evidence of the inflated false positive rate caused by this practice.

  3.  **Drafting the Explanation (Iterative Process):**

