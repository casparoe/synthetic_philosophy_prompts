  Had a long argument with my friend last night about how her team runs experiments at work — they watch the results dashboard every day, and the second the p-value on some test dips below 0.05 they call it and ship whichever variant is "winning" at that moment. I said that felt off, kinda like flipping a coin over and over and stopping the second you hit an impressive streak, which doesn't actually mean the coin's rigged. She says every day's p-value is a real calculation on all the data collected so far, so theres nothing shady about stopping the moment one crosses the line — and she waved off the fact that a couple of their past "winners" flopped completely when they got retested later, calling that a totally seperate issue. Who actually has the stronger argument here, and can you explain it in a way that'd settle this for both of us?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Conflict:** The user had an argument with a friend about A/B testing practices at her work.
