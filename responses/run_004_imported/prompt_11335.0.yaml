  4.  **Fleshing out the Content:**

      *   **Verdict:** You (the user) are statistically correct. This is a well-known pitfall called "Peeking" or "Optional Stopping."
      *   **The Math:** A p-value of 0.05 means "if there were no effect, there's a 5% chance we see this result by random noise." This assumes you look *once* at the end. If you look 10 times, the chance of seeing a "significant" blip by chance goes up (roughly $1 - 0.95^{10}$).
      *   **The Friend's Misconception:** She thinks the p-value is a property of the data *at that moment*. It is, but the *decision rule* ("stop when $p < 0.05$") changes the long-term error rate.
