answer: |-
  You are statistically correct, and your friend is falling for one of the most common misconceptions in data science.

  You have the stronger argument. What her team is doing is a classic statistical error known as **"Optional Stopping"** (or "Peeking"), and it fundamentally breaks the meaning of the p-value.

  Here is the breakdown of why you are right, why her defense doesn't hold up, and how you can explain it to her in a way that settles the debate without making her feel attacked.

  ### 1. The Core Issue: The "5%" Promise
  A p-value of 0.05 comes with a specific promise: *"If there is actually no difference between these variants, there is only a 5% chance that random noise will make the data look this extreme."*

  However, that promise **only holds true if you check the data once at the end of the experiment.**

  When your friend's team checks the dashboard every day, they aren't making one bet; they are making *many* bets.
  *   **Day 1:** 5% chance of a false positive.
  *   **Day 2:** Another 5% chance.
  *   **Day 3:** Another 5% chance.

  By checking repeatedly and stopping the *moment* significance is hit, they are effectively giving randomness multiple opportunities to trick them. If they check for 10 days, the chance of seeing a "significant" result purely by noise rises from 5% to roughly **40%**.

  **The Verdict:** They aren't measuring reality; they are measuring how long they have to wait for random noise to look like a signal.

  ### 2. Addressing Her Specific Arguments

  **Her Argument:** *"Every day's p-value is a real calculation on all the data collected so far."*
  **The Counter:** The *calculation* is mathematically correct for that specific snapshot, but the *decision rule* is flawed.
  Think of it like a speed limit. If the limit is 60 mph, looking at your speedometer once and seeing 61 means you were speeding. But if you stare at your speedometer for an hour, waiting for the needle to flicker to 61 so you can prove you hit it, you've changed the context. The number on the dial is "real," but using it to declare victory violates the rules of the test.

  **Her Argument:** *"The fact that past winners flopped later is a totally separate issue."*
  **The Counter:** It is **not** a separate issue; it is the direct symptom of the problem.
  When you inflate your false positive rate from 5% to 40% via peeking, you are guaranteeing that nearly half of your "winners" are actually just noise. When they ship those variants and retest them later (with a proper sample size or in the real world), the noise averages out, and the "effect" disappears. That flop is the bill coming due for the statistical error they made earlier.

  ### 3. The Analogy (To settle the argument)
  Your coin flip analogy was excellent. Here is a slightly polished version you can use:

  > "Imagine I bet you $100 that I can flip a coin and get 3 Heads in a row.
  >
  > If I flip the coin 3 times and get H-H-H, I win. That's impressive.
  > But if I keep flipping the coin over and over, ignoring all the failures, and stop the *second* I get H-H-H, have I proven I'm good at flipping? No. I've just proven that if you try enough times, random luck will eventually give you a streak.
  >
  > By checking the dashboard every day and stopping at the first 'streak' of significance, your team is just waiting for the random noise to line up. It doesn't mean the feature works; it means you waited long enough for a lucky blip."

  ### 4. How to Fix It (The Constructive Part)
  To make this helpful rather than just "I told you so," offer the solution. There are two ways her team can do this legitimately:

  1.  **Fixed Sample Size (Frequentist):** Decide how many users you need *before* you start (based on a power analysis). Do not look at the p-value until that specific number of users has been reached.
  2.  **Sequential Testing (Frequentist):** Use statistical methods designed for peeking (like Alpha Spending functions or Group Sequential Designs). These adjust the p-value threshold dynamically to account for the multiple checks.
  3.  **Bayesian Testing:** Switch to a Bayesian framework. Bayesian probabilities *do* allow you to check every day and stop whenever you want, because they calculate the probability of the hypothesis being true, not the probability of the data given a null hypothesis. (Note: If they are using standard p-values, they are likely *not* doing Bayesian testing).

  ### Summary for Your Friend
  You can send her this summary:

  *"I looked into this more because I value your work. It turns out this is a documented phenomenon called 'Optional Stopping Bias.' Standard p-values assume a single check at the end. Checking daily inflates the false-positive rate significantly (often up to 30-50% depending on frequency). The fact that previous winners flopped on retest is actually the statistical evidence that the false-positive rate is inflated. To fix it, we either need to pre-determine the sample size and wait, or switch to sequential testing methods that correct for peeking."*

  **You win this one.** It's a subtle concept, but your intuition about the coin flip was statistically sound.
