answer: |-
  You have raised a fascinating point that touches on the history of science, Bayesian reasoning, and the sociology of scientific consensus. You are correct about the text: in Section 7 of *Computing Machinery and Intelligence*, Turing explicitly addresses the "Argument from Extrasensory Perception." He writes that the statistical evidence for telepathy at the time seemed "overwhelming" to many, and to ensure the integrity of the Imitation Game, he proposes placing the interrogator in a "telepathy-proof room."

  Your argument is essentially an appeal to authority (Turing was rigorous) combined with a critique of scientific dogmatism (mainstream science dismisses ESP too quickly). To answer your question about the *intellectually honest* way to factor this into current credence, we need to disentangle three distinct issues: the state of evidence in 1950 versus now, the difference between controlling for a variable and believing in it, and the limits of authority.

  Here is how to weigh that historical fact without falling into logical traps.

  ### 1. Contextualize the Epistemic Environment of 1950
  Turing was not operating in a vacuum. In the late 1940s and early 1950s, the work of J.B. Rhine at Duke University was receiving significant attention. Rhine's experiments with Zener cards produced statistical anomalies that were difficult for many contemporaries to immediately explain away. While skeptics existed (and were vocal), the data had not yet been subjected to the decades of methodological scrutiny that followed.

  For a mathematician like Turing, "statistical significance" carries a lot of weight. If presented with data showing $p < 0.01$ for telepathy, a rigorous mind in 1950 had fewer reasons to suspect *p*-hacking, publication bias, or the "file drawer effect" than we do today. We now know that many of those early positive results were artifacts of poor controls (sensory leakage, selective reporting).

  **How to factor this in:** You should update your credence in the idea that **scientific consensus is time-sensitive.** What looks like data in 1950 can look like noise in 2024. Turing's reaction was rational *for 1950*. It does not necessarily transfer to 2024 because the likelihood ratio of the evidence has changed drastically in the intervening 74 years.

  ### 2. Methodological Rigor vs. Ontological Commitment
  This is the most critical distinction. When a scientist designs an experiment, they control for confounding variables that are *plausible*, not just variables that are *proven*.

  If I am testing a new heart medication, I might control for the placebo effect. I do not need to believe that sugar pills cure heart disease to control for the psychological impact of taking a pill. I do it to make my test airtight. Similarly, Turing's primary goal was to define a test for machine intelligence that was immune to *any* reasonable objection. If a significant portion of the scientific community believed telepathy was statistically supported, a rigorous test design *must* account for it to be universally accepted.

  **How to factor this in:** Turing's inclusion of the "telepathy-proof room" is stronger evidence of his **methodological thoroughness** than it is of his **belief in ESP.** He was saying, "Even if this controversial thing is real, my test still works," not necessarily, "I am convinced this thing is real."

  ### 3. The "Great Mind" Fallacy
  It is tempting to think that because Turing was a genius in logic and computation, his views on all empirical matters were superior. However, history is full of brilliant scientists holding views that did not age well. Isaac Newton wrote more about alchemy and biblical chronology than he did about physics. Linus Pauling, a giant of chemistry, became a fervent proponent of Vitamin C megadosing for curing cancer, a claim not supported by evidence.

  Great thinkers are products of their epistemic environment. Turing's willingness to entertain ESP says more about the state of parapsychology in 1950 than it does about the metaphysical reality of ESP.

  **How to factor this in:** You can admire Turing's openness without adopting his conclusions. The intellectually honest move is to recognize that **authority does not transfer across domains.** Turing's judgment on computability is authoritative; his judgment on the statistical validity of Rhine's cards is merely that of a smart man looking at data that has since been largely debunked.

  ### 4. The Kernel of Truth in Your Argument
  Where you are absolutely right—and where your friend might benefit from listening—is regarding **scientific dogmatism.**

  Mainstream science often suffers from "theory-laden observation." Once a field becomes taboo (like parapsychology), it becomes career suicide to investigate it, leading to a lack of funding, a lack of replication attempts, and a reflexive dismissal of new data. This is a sociological failure of science.

  Turing's attitude represents an ideal of **radical skepticism:** *Check the premises, even the uncomfortable ones.* If the statistical evidence *were* overwhelming, a true skeptic must follow the data, even if it implies telepathy. The failure of modern science is not necessarily that it rejected ESP, but that it often rejects it *a priori* rather than engaging with the data.

  **How to factor this in:** You should increase your credence that **mainstream science can be prematurely dismissive.** However, in the specific case of ESP, the dismissal is now based on 70 years of failed replications under stricter controls, not just an *a priori* prior.

  ### Conclusion: How to Update Your Credence
  To answer your specific question: Does Turing's stance count as a real point in favor of taking parapsychology more seriously *now*?

  **No, not directly.** The evidence available to Turing has been superseded by seven decades of subsequent inquiry which has largely failed to reproduce his contemporaries' findings under rigorous conditions. Bayesian updating requires us to weigh the *current* likelihood of the evidence, not just the historical opinion of a smart man.

  **However,** it does count as a point in favor of **epistemic humility.** The intellectually honest position is this:
  1.  **On ESP:** Maintain low credence. The post-1950 evidence is weak. Turing's view is a historical artifact, not a validation of the phenomenon.
  2.  **On Scientific Consensus:** Maintain moderate skepticism. Turing's example proves that even rigorous minds can be swayed by data that later proves flawed, and that mainstream science can become rigid. We should remain open to anomalous data *if* it is presented with rigorous methodology, but we should not lower our standards of evidence just because a famous figure once entertained the idea.

  You won the argument on the principle (science should be open to weird data), but you likely lose on the conclusion (therefore ESP is credible today). Turing's "telepathy-proof room" is a monument to his desire for a perfect test, not a testament to the reality of the psychic mind.
