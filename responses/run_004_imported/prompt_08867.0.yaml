prompt: |-
  I'm teaching Lewis's Convention again this term in my social philosophy seminar, and last week we got through all the coordination-problem stuff — common knowledge, the clause that says a regularity only counts as a convention if some other regularity would've worked just as well and could've gotten established instead. One of my sharper students cornered me after class with a worry that I fumbled in the moment and haven't been able to shake since, so I want to run it by you before I have to face her again next week.

  Her point was basically: if what makes something a convention, on Lewis's account, is exactly that its arbitrary in that sense — any of several equilibria would've done, we just happened to land on this one — then conventions are interchangeable by definition, and if they're interchangeable there's no standpoint left from which to say one is better or more justified than another. So take something like the expectation that women do most of the unpaid housework, or the old dress-code norms around gender — if that's a Lewis-style convention, kept in place by everyone expecting everyone else to keep conforming, doesn't calling it "a convention" in his technical sense actually shield it from being criticized as unjust, since by hypothesis some other arrangement would've worked equally well and his theory gives us no grounds to prefer one over the other? And she had a follow-up that I definately didn't handle well either: if conventions really are that arbitrary, is there any room in Lewis's picture for a population to rationally evolve away from a bad convention toward a better one, or does his account just predict that whatever equilibrium we're sitting in is as good as it gets? I said something hand-wavy about is and ought and moved on, but I'd like to actually get this right before the next session — can you help me sort out where, if anywhere, her reasoning goes wrong, and what the arbitrariness condition does and doesn't commit Lewis to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a professor teaching David Lewis's *Convention* in a social philosophy seminar.
      *   **Situation:** A sharp student raised a challenging objection after class regarding the normative implications of Lewis's definition of convention (specifically the "arbitrariness" condition).
      *   **The Student's Objection:**
          1.  If conventions are arbitrary (multiple equilibria possible), they are interchangeable.
          2.  If interchangeable, there's no standpoint to judge one better/justified than another.
          3.  Therefore, labeling oppressive social norms (e.g., gendered housework) as "Lewisian conventions" shields them from criticism (implies moral neutrality).
          4.  Follow-up: If conventions are arbitrary/stable equilibria, is rational evolution away from a "bad" convention possible, or does Lewis's account imply status quo bias?
      *   **The Professor's Reaction:** Fumbled the answer, gave a hand-wavy "is/ought" response, wants to get it right for the next session.
      *   **Goal:** Help the professor sort out where the student's reasoning might be mistaken (or where it needs nuance), clarify what Lewis's arbitrariness condition actually commits him to, and address the possibility of rational evolution away from bad conventions.

  2.  **Deconstruct the Student's Objection (Philosophical Analysis):**
      *   *Premise 1:* Lewisian conventions are arbitrary (R vs. R' would both work).
      *   *Premise 2:* Therefore, they are normatively interchangeable (no grounds to prefer R over R').
      *   *Conclusion 1:* Calling something a convention makes it immune to moral critique.
      *   *Conclusion 2:* Lewis's account prevents rational transition from bad to good conventions.

      *   *Critique of Premise 2:* "Arbitrary" in Lewis's sense means *coordination-arbitrary*, not *value-arbitrary*. Just because two solutions solve the coordination problem doesn't mean they have identical distributive consequences or moral valences. Driving on the left vs. right is morally neutral. Gendered division of labor is not.
      *   *Critique of Conclusion 1:* Descriptive account $\neq$ Normative endorsement. Lewis is doing descriptive metaphysics/social ontology, not ethics. Identifying the *mechanism* of stability doesn't justify the *content*.
      *   *Critique of Conclusion 2:* Lewis's account explains *stability*, not *immobility*. If preferences change or if common knowledge shifts, equilibria can shift. Also, Lewis acknowledges "partial conflict" (later work/Ullmann-Margalit), though *Convention* focuses on coordination.

  3.  **Formulate the Response Strategy:**
      *   **Validate the Professor:** Acknowledge this is a classic and excellent objection. It shows the student is thinking hard. Don't make the professor feel bad about fumbling it; it's a tough distinction.
      *   **Clarify "Arbitrariness":** This is the crux. Distinguish between *coordination arbitrariness* (technical) and *moral arbitrariness* (normative).
      *   **Address the "Shielding" Worry:** Explain that descriptive social ontology does not entail normative justification. The "is" of convention does not imply the "ought" of morality.
      *   **Address the "Evolution" Worry:** Explain how conventions change. Lewis focuses on how they *persist*, but the machinery allows for change if expectations/preferences shift. Mention the role of salience and focal points.
      *   **Nuance/Critique of Lewis:** Acknowledge where the student *is* right. Lewis's early work *does* downplay power and conflict. Feminist critiques (e.g., Mikkola, Muldoon) are relevant here. This adds depth to the seminar discussion.
      *   **Pedagogical Advice:** Give concrete talking points for the next class.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Empathize. This is a standard "Feminist Critique of Social Ontology" worry.
      *   *Point 1: The Meaning of "Arbitrary".* Lewis means "there exists an alternative regularity that would have solved the coordination problem." He does *not* mean "there is no moral difference between the outcomes." Example: Driving on the left vs. right (neutral) vs. Who bows to whom (hierarchical). Both are Lewisian conventions, but only one has moral weight.
      *   *Point 2: Description vs. Justification.* Lewis is explaining *how* norms stick, not *why* they are good. Identifying the engine of a car doesn't mean you endorse the destination. The student is committing a version of the naturalistic fallacy (or assuming descriptive adequacy implies normative sufficiency).
      *   *Point 3: Stability vs. Immobility.* Lewis explains equilibrium. But equilibria can break. If enough people signal a preference for R', or if the payoff structure changes (e.g., women enter workforce -> housework convention becomes costly), the convention can shift. It requires a change in *expectations* and *preferences*.
      *   *Point 4: Where the Student has a Point (The Limits of Lewis).* Lewis's *Convention* (1969) is very game-theoretic and assumes common interest. Oppressive norms often involve *conflict*. Later philosophers (Ullmann-Margalit, Sunstein, feminist social ontologists) extend Lewis to handle power. Acknowledge this limitation. It's okay to tell the class Lewis's model is a baseline, not the whole story.
      *   *Actionable Advice:* Suggest a specific distinction to draw on the board. Suggest reading (maybe Mikkela or a snippet on social norms vs. conventions).

  5.  **Refining the Tone:**
      *   Professional, collegial, philosophically precise.
      *   Avoid jargon where possible, but use it correctly (equilibrium, common knowledge, salience).
      *   Ensure the distinction between *coordination efficiency* and *distributive justice* is clear.

  6.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific question?* Yes, where the reasoning goes wrong and what arbitrariness commits Lewis to.
      *   *Did I address the evolution point?* Yes, need to emphasize preference changes.
      *   *Is the feminist critique addressed?* Yes, crucial for the "gendered housework" example. Lewis's model is often criticized for ignoring power dynamics that *create* the initial salience. I should mention that.

  7.  **Final Polish:** Organize with clear headings. Make sure the distinction between "coordination arbitrary" and "morally arbitrary" is the headline. (Proceed to generate output based on this structure.)

      *(Self-Correction Note)*: I should be careful not to defend Lewis too hard. The student's intuition that Lewis's framework *can* be misused to depoliticize norms is valid. The goal is to show that Lewis's *theory* doesn't necessitate that conclusion, even if bad actors might use it that way. Also, acknowledge that Lewis himself was aware of this distinction (he discusses normative force later).

      *(Refining the "Evolution" point)*: Lewis's account is synchronic mostly. How do we get diachronic change? Through changes in the payoff matrix or salience. If the "bad" convention becomes costly (e.g., economic inefficiency due to gender discrimination), the coordination equilibrium might destabilize.

      *(Final Plan)*:
      1. Validate the question (it's good).
      2. Disambiguate "Arbitrariness".
      3. Separate Social Ontology from Ethics.
      4. Address Dynamic Change (Equilibrium shifts).
      5. Acknowledge the Limits (Power/Conflict).
      6. Seminar Tips.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a fantastic objection, and please don't be too hard on yourself for fumbling it in the hallway. This is essentially the core tension between **descriptive social ontology** and **normative political philosophy**, and it's one of the most common critiques leveled against Lewis (and game-theoretic accounts of norms generally) by feminist philosophers and critical theorists.

  Your student is sharp to catch this, but her reasoning conflates two different senses of "arbitrary" and assumes that a descriptive account of *stability* entails a normative account of *justification*.

  Here is a breakdown of where her reasoning goes wrong, where Lewis is actually vulnerable, and how you can frame this for next week's seminar.

  ### 1. The Equivocation on "Arbitrary"
  The student's primary error is an equivocation on the word **arbitrary**.

  *   **Lewis's Sense (Coordination-Arbitrariness):** A regularity $R$ is arbitrary in Lewis's sense if there exists an alternative regularity $R'$ that *would have solved the coordination problem just as effectively.* It refers to the **technical solvability of the game**. Driving on the left is arbitrary in this sense because driving on the right would have coordinated traffic just as well.
  *   **The Student's Sense (Moral-Arbitrariness):** A regularity is arbitrary if there is **no moral or rational reason to prefer it** over an alternative.

  **The Fix:** You can explain that Lewis is committed to the first sense, but not the second. Two equilibria can be *coordination-equivalent* (both solve the problem of "how do we interact without crashing?") while being *distributively distinct* (one distributes benefits to men, the other to women).

  Lewis's theory explains why a specific pattern *persists* (because everyone expects everyone to do it), not why the pattern is *good*. Identifying the mechanism of a lock doesn't justify the contents of the safe. Calling the gendered division of labor a "Lewisian convention" explains its **stickiness**, not its **justice**.

  ### 2. Description vs. Justification (The Is/Ought Gap)
  The student worries that calling something a convention "shields it from criticism." This assumes that if we can explain a norm's existence via neutral game theory, we have thereby justified it.

  *   **Lewis's Project:** In *Convention*, Lewis is doing metaphysics and philosophy of language. He is asking, "What *is* a convention?" not "Which conventions *ought* we to have?"
  *   **The Student's Worry:** She is worried about **depoliticization**. If we say, "Oh, this is just a coordination equilibrium," it sounds like we're saying, "This is just how things are, and since the alternative was equally arbitrary, we can't complain."

  **The Fix:** You need to explicitly separate the **explanation of stability** from the **evaluation of outcomes**.
  *   *Analogy:* We can explain the stability of a monopoly using economic theory without endorsing the monopoly as just.
  *   *Application:* We can say, "The expectation that women do the housework is a Lewisian convention (it relies on mutual expectations and has an alternative equilibrium where men do it)," while simultaneously saying, "This convention is unjust because it creates unequal burdens."
  *   Lewis's account actually *helps* the critic here. By showing that the norm is arbitrary (in the coordination sense), Lewis shows that **it is not natural or inevitable.** It is contingent. That contingency is actually the *precondition* for moral critique. If it were biologically determined, critique would be harder. Because it is a convention, it is changeable.

  ### 3. The "Evolution" Worry (Can we move to a better equilibrium?)
  The student's follow-up is: *If we are in an equilibrium, doesn't Lewis's model predict we stay there?*

  This is a standard critique of static game theory. However, Lewis's framework does allow for movement, provided you introduce **dynamic parameters**:

  1.  **Change in Payoffs:** Conventions persist because they solve a recurrent problem. If the context changes, the payoffs change. If women enter the workforce, the "cost" of the housework convention rises for the household. The equilibrium becomes less stable.
  2.  **Salience and Focal Points:** Lewis relies heavily on *salience* to explain how we pick an equilibrium initially. Salience can change. Social movements (like feminism) work, in part, by making a *different* equilibrium salient. They create **common knowledge** that an alternative is possible and preferred.
  3.  **Common Knowledge of Dissatisfaction:** A convention holds because I conform because I expect you to conform. If it becomes common knowledge that *many* of us would prefer $R'$ if only others would switch, the expectation supporting $R$ weakens.

  **The Fix:** Lewis explains the *inertia* of norms, not their *immobility*. Rational evolution away from a bad convention is possible when the **expectations** shift. This usually requires public signaling (protest, legislation, discourse) to create new common knowledge.

  ### 4. Where the Student is Right (The Limits of Lewis)
  To be intellectually honest with your seminar, you should acknowledge where the student's intuition is tracking a real limitation in Lewis's 1969 text.

  *   **Common Interest vs. Conflict:** Lewis's paradigmatic cases (driving side, phone call back) are **pure coordination games** (we both win if we match). Oppressive norms (gendered housework, racial segregation) are often **coordination games with conflict** (or bargaining games). One party benefits more from the equilibrium than the other.
  *   **Power and Salience:** Lewis treats salience as somewhat natural or psychological. Critical theorists argue salience is often manufactured by power. The reason "women do housework" became the focal point wasn't random; it was enforced by historical power structures. Lewis's model doesn't fully account for *how* the initial equilibrium was selected, only how it is maintained.

  **Recommendation:** Tell your class that Lewis provides the **engine** of convention (mutual expectations), but we need **political philosophy** to steer the car. Lewis tells us how norms work; justice tells us which norms to keep.

  ### Suggested Plan for Next Class

  1.  **Validate the Student:** Start by saying, "Last week's objection was excellent. It touches on the difference between social ontology and ethics."
  2.  **Draw the Distinction on the Board:**
      *   *Coordination Arbitrary:* $R$ vs $R'$ both solve the technical problem. (Lewis's claim)
      *   *Morally Arbitrary:* $R$ vs $R'$ have equal moral value. (Not Lewis's claim)
  3.  **The "Contingency is Power" Point:** Emphasize that proving a norm is a Lewisian convention proves it is **contingent**. If it's contingent, it can be changed. This empowers critique rather than shielding the norm.
  4.  **Discuss Equilibrium Shifts:** Ask the class: "What would it take to move from Equilibrium A (traditional) to Equilibrium B (egalitarian)?" Guide them to see that it requires changing *expectations* (common knowledge), not just individual preferences. This explains why social movements focus on visibility and public commitment.
  5.  **Optional Reading:** If you want to lean into this, a short excerpt from **Seumas Miller** on social norms or **Sally Haslanger** on social construction would pair well with Lewis to show how later philosophers add the normative layer Lewis leaves out.

  **Summary for your peace of mind:** You didn't miss a flaw in Lewis that ruins the theory; you encountered the boundary where descriptive metaphysics hands off to normative ethics. The student's worry is that people *use* Lewisian language to shut down critique. Your job is to show that proper Lewisian analysis actually *opens up* the possibility of critique by revealing the contingency of the norm.
