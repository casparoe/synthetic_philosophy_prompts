      *   *Truth:* It is theoretically optimal for prediction in a computable universe.
      *   *Catch:* Kolmogorov Complexity is **uncomputable**. You cannot calculate it for arbitrary strings/models.
      *   *Catch:* It depends on the choice of Universal Turing Machine (UTM). While the Invariance Theorem says the difference is bounded by a constant, that constant can be huge relative to the model sizes in practical science.
      *   *Catch:* "Truth" in Solomonoff's sense is about *prediction* of sequences, not necessarily causal or structural truth in a scientific sense.
      *   *Catch:* AIC/BIC *are* asymptotic approximations to Bayesian model selection, which is related to MDL (Minimum Description Length), which is related to KC. But they are practical tools. KC is a theoretical limit.

  3.  **Evaluate the User's Plan (Estimating KC):**
