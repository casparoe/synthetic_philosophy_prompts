      *   *Proxies:* Compression algorithms (gzip, LZW) are common proxies. Code length in a specific language (Python, C++) is another.
      *   *Problem:* The choice of proxy (language/compressor) *is* the choice of UTM. This reintroduces subjectivity. If I write Model A in Python and Model B in C++, the lengths differ. If I choose a language biased towards linear algebra, Model A might look shorter.
      *   *Risk:* Claiming "objective truth" based on a proxy is scientifically dangerous. It masks the subjectivity of the encoding choice.

  4.  **Synthesize the Philosophical/Practical Counter-Arguments:**
