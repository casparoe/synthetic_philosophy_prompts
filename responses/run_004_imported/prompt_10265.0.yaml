  1.  **Analyze the User's Situation:**
      *   **Context:** A research group disagreement over model selection (Model A: short/fewer parts vs. Model B: longer/more structure).
      *   **Advisor's Claim:** AIC/BIC are crude approximations. Solomonoff Induction/Kolmogorov Complexity (KC) provides a *rigorous, provable* version of Occam's Razor. Lower KC = provably more likely to be true. End of story.
