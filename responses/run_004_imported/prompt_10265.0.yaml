      *   **Prediction vs. Explanation:** Solomonoff is about predicting the next bit. Science often cares about interpretability, causality, and mechanism, not just compression. A "black box" neural net might have lower KC than a mechanistic model but be less useful for understanding.
      *   **AIC/BIC aren't "Crude":** They are practical approximations of the same underlying principle (MDL/Bayesian evidence). Dismissing them entirely ignores their statistical properties (consistency, efficiency).
      *   **Overfitting Risk:** A model that captures "more real structure" (User's Model B) might actually be the better scientific model even if it's longer, if the "extra length" corresponds to real physical constraints rather than noise. KC penalizes length, potentially favoring underfitting if the "truth" is complex.

