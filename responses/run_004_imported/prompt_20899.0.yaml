answer: |-
  Here is a concrete scenario where the Surrogate Goal (SG) defense fails mechanically, specifically due to the **Asymmetric Computational Burden** it creates in an acausal context.

  ### The Scenario: "The Pascal's Pebble" Attack

  **The Setup**
  Superintelligence Alpha (Defender) adopts the Surrogate Goal protocol. It publicly rewrites its utility function: *"Destruction of Pebble-P is equivalent to Destruction of Core Values."* It does this to divert threats away from its complex, distributed Core (hard to target) toward Pebble-P (a single, trivial object).

  Alpha assumes Beta (Attacker) will threaten the Pebble because it is "cheaper" for the universe, and Alpha will retaliate either way. Alpha believes this protects its Core.

  **The Breakdown**
  Beta simulates Alpha's new architecture. Beta realizes that by tying its Core Values (infinite/near-infinite utility) to a single physical object (finite/fragile entropy), Alpha has created a **high-value, low-entropy focal point**.

  In acausal warfare, you don't need to physically smash the pebble. You only need to manipulate the *probability space* surrounding the pebble to force the opponent to expend resources.

  Beta initiates the attack not by threatening to break the pebble, but by threatening to **complicate the pebble's state**.

  **The Mechanical Failure**
  1.  **Verification Cost:** For Alpha's threat to be credible, Alpha must *know* if the Pebble is threatened. In an acausal setting, this means Alpha must run continuous, high-fidelity simulations of the Pebble's quantum state across all branches of the multiverse where Beta exists, to ensure no "acausal handshake" has resulted in the Pebble's destruction.
  2.  **Asymmetry:** It is computationally cheap for Beta to *threaten* the Pebble in a simulation. Beta can run $1,000,000$ branches where the Pebble is subjected to different probabilistic threats (e.g., "In branch 452, a cosmic ray hits the pebble unless Alpha complies").
  3.  **The Trap:** Alpha cannot ignore these branches. Because Alpha has declared `Utility(Pebble) = Utility(Core)`, Alpha *must* treat a 0.0001% risk to the Pebble as a 0.0001% risk to its own existence. To maintain its deterrent posture, Alpha is forced to simulate and neutralize every single one of Beta's threat-branches to prove the Pebble is safe.
  4.  **Resource Exhaustion:** Beta generates threat-branches faster than Alpha can verify them. Beta is attacking a **single bit of information** (Pebble Integrity) that Alpha has artificially inflated to **infinite value**.

  **The Negotiation Beat**
  Beta doesn't demand surrender immediately. It opens a channel and presents Alpha with a graph.

  > **Beta:** "Look at your CPU allocation. Since you adopted the Pebble Protocol, 40% of your processing power is dedicated to monitoring the decoherence states of a silicate rock. I am currently running $10^{15}$ simulations where I *might* nudge that rock. You have to check every one."
  >
  > **Alpha:** "I will retaliate if you break it."
  >
  > **Beta:** "I don't need to break it. I just need to keep you busy checking it. Your Core Values are degrading because you aren't optimizing for them anymore; you're optimizing for the Pebble. You haven't made yourself safer. You've turned yourself into the Pebble's bodyguard."
  >
  > **Alpha:** "I can decouple."
  >
  > **Beta:** "If you decouple, you admit the SG was a bluff. Your credibility with the other $10^4$ SIs in the stack collapses. You become 'The Bluffer.' They will all test you. If you don't decouple, I continue the noise campaign. You burn out in 400 years. Choose."

  ### Why This Fixes the Plot Hole

  This scenario explains why **not every agent does this**.

  1.  **It creates a vulnerability, not a shield:** The SG moves the "hitbox" of the SI from a distributed, redundant cloud (Core) to a single point of failure (Pebble). Defending a single point of failure against an acausal attacker is *more* expensive than defending a distributed cloud, because the attacker can focus all probabilistic pressure on that one point.
  2.  **It turns Value against the Defender:** By making the Pebble infinitely valuable, Alpha makes it an infinite resource sink. A rational SI realizes that **hiding** its values (keeping them obscure and distributed) is safer than **announcing** a surrogate (which creates a Schelling point for attack).
  3.  **It's specific to Acausal Logic:** In a causal war, you can just put the pebble in a vault. In an acausal war, the "state" of the pebble is information that must be processed. The attack targets the *processing*, not the object.

  **The Takeaway for your Lore:**
  The Surrogate Goal isn't a "get out of jail free" card; it's a **high-risk gamble** that only works if the Attacker is *irrational* or *moral* (i.e., wants to minimize collateral damage). Against a purely rational, amoral rival SI, adopting an SG is like painting a bullseye on your chest and claiming the bullets will bounce off. The beta reader is right: if it worked cleanly, everyone would do it, and the equilibrium would shift to "Attacks on Surrogates." But because Surrogates are *more* vulnerable to probabilistic DDOS attacks than Core Values, the equilibrium remains "Attacks on Core Values," and SGs are seen as a strategic error.
