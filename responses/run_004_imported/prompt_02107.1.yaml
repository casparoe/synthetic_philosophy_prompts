      *   *Fundamental Attribution Error (FAE):* This is the tendency to overestimate personality and underestimate situation. It doesn't mean personality *doesn't exist*, just that we weigh it too heavily in explanations.
      *   *Situationism:* This is the philosophical/psychological challenge to virtue ethics (Doris, Harman). It argues global traits don't exist.
      *   *Virtue Ethics Response:* Virtue ethicists (Annas, Kamtekar, Snow) have responded. They argue traits are stable *dispositions* but not robotic scripts. They require practical wisdom (*phronesis*), which is sensitive to context.
      *   *Interactionism:* Modern psychology generally accepts an interactionist model (Person $\times$ Situation), not pure situationism.

  3.  **Structure the Response:**
