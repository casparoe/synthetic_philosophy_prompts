      *   **Correct the Philosophy:** Explain that Aristotle didn't think virtues were blind habits. Introduce *Phronesis* (practical wisdom) and the idea that virtues are sensitive to context.
      *   **The Synthesis/Resolution:** Show how they can coexist. Traits exist but are expressed differently in different situations.
