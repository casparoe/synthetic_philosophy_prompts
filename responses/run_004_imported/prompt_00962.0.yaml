answer: |-
  **Alex:** Look, Diamond's case is intuitive, but it conflates ex-ante fairness with ex-post welfare. Harsanyi's theorem is clear: if individual preferences satisfy vNM axioms and we respect Pareto, social welfare must be a weighted sum of individual utilities. In Diamond's case—one indivisible good, two equally deserving people—the expected utility for both agents is 0.5 under a coin flip and 1.0 for the winner under a sure allocation. Aggregated, the sum is identical. The planner is indifferent.

  **Ben:** And that's exactly why it fails. Most of us think the coin flip is *morally superior*. It respects the equal claim each person has. Harsanyi's linearity in probabilities wipes out the value of procedural justice. It treats a 50% chance of life-saving medicine the same as a certainty for one person and death for the other, provided the expected utility sums match.

  **Alex:** But that intuition relies on preferences we haven't modeled yet. If the agents care about fairness—if they derive utility from knowing they had a fair shot—you simply include that in the outcome description. "Person 1 gets the good via a fair process" is a different outcome than "Person 1 gets the good via fiat." If that distinction matters to them, it shows up in their utility functions. The theorem still holds; you just sum the revised utilities.

  **Ben:** That's the move I can't accept. It feels like a conceptual sleight of hand. You're saving the theorem by redefining the inputs. If "fairness" is just another preference parameter, then the theorem doesn't justify utilitarianism; it just says "maximize whatever people happen to care about." It empties the result of normative force.

  **Alex:** It's not a patch; it's rigor. The vNM axioms require preferences over *comprehensive* outcomes. If you claim fairness matters but refuse to model it as part of the utility, you're violating the description requirement. You can't have it both ways: either fairness affects individual welfare, or it's an external constraint outside the welfarist framework. Harsanyi is operating within the framework.

  **Ben:** But if you allow redescription, you can bake *any* objection into the utility function. Egalitarians can say they suffer disutility from inequality. Prioritarians can say they value benefits to the worse off more. Once you allow that, the aggregation theorem doesn't tell us we *should* be utilitarians. It just tells us we should be consistent aggregators of whatever morality we've already smuggled into the utility definitions.

  **Alex:** That's a feature, not a bug. The theorem isn't a moral discovery machine; it's a consistency check. It shows that if you accept Pareto and rationality under uncertainty, you cannot reject weighted summation without contradiction. If your "fairness" preference leads to a non-linear aggregation, you're violating Pareto or independence. You're saying, "I know everyone prefers outcome A, but I'll choose B because the process was nicer." That's paternalism.

  **Ben:** Or it's recognizing that social choice isn't just about satisfying preferences; it's about justified claims. Diamond's point is that the *structure* of the decision matters, not just the preference satisfaction. By reducing procedural justice to another utility component, you treat fairness as a commodity to be consumed, rather than a constraint on power. You're rescuing Harsanyi by changing the subject.

  **Alex:** I'm rescuing coherence. If you want fairness to count, show me the preference. If you won't, admit you're rejecting welfarism. But don't claim the math is wrong because it doesn't capture intuitions you refuse to formalize.

  **Ben:** The math is fine. It's the claim that this derivation grounds utilitarianism that collapses. Once you redescribe outcomes to save the theorem, the theorem no longer tells us what to value. It just mirrors back whatever we put in.

  **Alex:** Then at least it mirrors it consistently.

  **Ben:** Consistency isn't justice, Alex. And a coin flip isn't just a utility boost; it's a recognition of equal status. Your model can't see that distinction unless we force it to, and if we have to force it, the model isn't doing the heavy lifting.
