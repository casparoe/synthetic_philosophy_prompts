          4.  **The Fatal Flaw:** Descartes' solution depends on the metaphysics of God. Without God, the distinction is merely psychological (vivacity of present vs. fading of past). Epistemically, there's no reason to trust present perception more than memory of past perception if the faculty is in doubt. If the faculty (vision/reason) is in question, the "present" deliverance of that faculty is just as suspect as the "past" one.
