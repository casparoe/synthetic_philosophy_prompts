answer: |-
  **The Mirror and the Map: Why Value Learning Requires Normative Assumptions**

  The promise of Inverse Reinforcement Learning (IRL) is seductive in its simplicity. If we cannot safely specify what we want an Artificial Intelligence to do, perhaps we can simply show it what we do, and let it infer the rest. By observing human choices, the agent ostensibly recovers the underlying reward function that drives them, aligning itself with our values without requiring us to articulate those values in code. However, this approach rests on a precarious epistemological foundation. As the literature has matured, a profound worry has emerged: that behavior alone is insufficient to pin down preferences. This is not merely a problem of insufficient data, but a structural underdetermination. As formalized by Armstrong and Mindermann, there is a degeneracy between an agent's reward function and its planning algorithm (or "rationality"). Any observed behavior can be explained by infinitely many pairs of rewards and planners.

  This essay argues that the skeptical result is mathematically correct but metaphysically misguided. The inference of preferences from behavior is indeed unavoidably parasitic on substantive, non-behavioral assumptions about rationality. However, this does not render the enterprise of value learning meaningless. Rather, it reveals that "preferences" are not latent physical variables waiting to be discovered, like the mass of an electron, but are instead interpretive constructs that exist only relative to a normative framework. The impossibility of inferring preferences from behavior *alone* is not a bug in IRL; it is a feature of intentional attribution. The danger lies not in the necessity of assumptions, but in the failure to acknowledge them.

  To understand the gravity of the skeptical challenge, one must grasp the depth of the degeneracy problem. In the standard IRL setup, an observer sees a policy $\pi$ (the behavior) and attempts to recover a reward function $R$. But $\pi$ is produced by the interaction of $R$ and a planner $P$ (the cognitive process that turns rewards into actions). Mathematically, $\pi = P(R)$. The skeptical argument notes that for any fixed $\pi$, there are infinite pairs of $(R, P)$ that satisfy the equation. A perfectly rational agent maximizing a complex reward looks behaviorally identical to a deeply irrational agent maximizing a simple reward.

  Armstrong and Mindermann sharpened this into a "No Free Lunch" theorem for IRL. One might hope to use Occam's razor to select the simplest reward function. However, they demonstrated that complexity can be shifted between the reward and the planner without changing the total description length of the pair. A baroque, convoluted reward function can be paired with a "blind" planner that ignores it, while a simple reward function can be paired with a complex planner that distorts it to produce the same output. Consequently, simplicity priors cannot break the tie. Without an external assumption about what counts as "rational" or "noisy" planning, the data is silent.

  This leads to the fatalist conclusion: talk of a "true" reward behind a policy is meaningless. If we cannot distinguish between a human who smokes because they value nicotine (rational pursuit of $R_{smoke}$) and a human who smokes despite valuing health (irrational pursuit of $R_{health}$ due to addiction bias $P_{addict}$), then the AI cannot align with our "real" values. It can only align with a projection of our behavior based on whatever rationality model it was hardcoded with. This echoes the philosophical skepticism of W.V.O. Quine and Donald Davidson regarding radical interpretation. Quine argued that there is no fact of the matter about what a speaker means beyond what is necessitated by their behavior and the interpreter's "manual of translation." Davidson added that we must employ a "Principle of Charity," assuming the speaker is largely rational and truthful, to make interpretation possible at all. In the IRL context, the skeptic argues that without a pre-supposed Principle of Charity, human values are indeterminate.

  Against this fatalism, the pragmatic defense of IRL posits that this underdetermination is neither unique to value learning nor an obstacle to progress. First, all empirical science faces the Duhem-Quine problem: data underdetermines theory. Physics survives despite the fact that multiple mathematical formulations can describe the same gravitational phenomena. We choose theories based on coherence, utility, and integration with other knowledge, not solely on raw data fit. Similarly, an AI need not recover the *One True Reward* to be safe; it need only recover a reward function that, when optimized, yields outcomes humans endorse.

  Second, humans are not arbitrary Turing machines. We share a biological and cognitive architecture that constrains the space of plausible planners. We know humans are myopic, susceptible to framing effects, and limited by working memory. By incorporating these structural priors—derived from psychology and neuroscience rather than behavior alone—we can prune the space of $(R, P)$ pairs. A model that explains human chess play by assuming we maximize "winning" plus a small noise term is more plausible than one assuming we maximize "moving pieces randomly" plus a complex planner that mimics grandmasters.

  Third, interactive frameworks like Cooperative IRL (CIRL) allow the agent to test these assumptions. If the agent is unsure whether a behavior stems from preference or bias, it can intervene or query the human. While this does not solve the theoretical degeneracy (since the responses to queries are also behavior subject to the same ambiguity), it allows the agent to converge on a *functional* equilibrium where the human and AI understand each other well enough to cooperate. The goal shifts from metaphysical recovery to pragmatic coordination.

  Despite the strength of these pragmatic defenses, they concede the core point of the skeptics: behavior alone is insufficient. The priors about cognitive architecture and the decision to value "coordination" over "literal interpretation" are themselves non-behavioral assumptions. Therefore, the verdict must side with the skeptics on the epistemology, but with the pragmatists on the implications.

  The impossibility result is correct, but it shows less than it is usually taken to show. It demonstrates that **preferences are not natural kinds discoverable by observation, but are normative constructs constituted by the act of interpretation.**

  To say that value learning is "parasitic" on assumptions about rationality is not to say it is arbitrary. When we interpret a human's values, we are not acting as passive cameras recording data; we are acting as participants in a normative practice. We assume humans are agents rather than rocks, and that their actions generally track their interests, even if imperfectly. This is the Principle of Charity. If an AI is to be aligned with humans, it *must* adopt this principle. If it treats humans as perfectly rational, it will validate our worst impulses (inferring we want to be addicted because we act addicted). If it treats us as purely random, it will find no values at all.

  The "true" reward is not a hidden variable that the AI fails to find; the "true" reward is the function that emerges when a sufficiently intelligent interpreter applies the correct normative standards to human behavior. The risk in AI alignment is not that the reward function is underdetermined by data—we knew that. The risk is that engineers will hide their normative assumptions inside the "planner" model, pretending they are doing pure empirical learning when they are actually hardcoding a specific theory of human rationality.

  Therefore, the enterprise of learning human values from choices is viable, but only if we abandon the pretense of behaviorism. We cannot infer preferences from behavior alone. We must infer them from behavior *plus* a theory of mind that distinguishes between competence and performance, between signal and noise. This theory of mind is a moral and philosophical choice, not a statistical one. Acknowledging this does not doom IRL; it elevates it. It forces us to recognize that aligning AI with human values is not merely a technical challenge of optimization, but a philosophical challenge of defining what aspect of the human condition—the raw impulses, the reflective endorsements, or the idealized selves—we wish to preserve. The ambiguity is not a wall; it is a mirror, reflecting the fact that values are not found in the world, but brought to it.
