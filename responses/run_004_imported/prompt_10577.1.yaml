      *   *Specifics:* Make sure to cite Article and Section numbers accurately.
      *   *Tone Check:* Ensure I don't sound dismissive of Douglass. His shift was strategic and profound. But I must answer the prompt's specific constraint about textual support.
      *   *Garrison's Nuance:* Garrison burned the Constitution, but he also recognized that the *legal* machinery protected slavery.
      *   *Douglass's Nuance:* Douglass argued that the *powers* granted to Congress (like regulating commerce) could be used to kill slavery, and that the Constitution didn't *authorize* slavery, only tolerated it temporarily.
      *   *Final Verdict:* Garrison's reading is more textually honest regarding the 1787 document. Douglass's reading is a reconstruction (before Reconstruction) of the document's spirit.

