      *   *Maya (Mentalist/Welfarist):* Named after Amartya Sen (maybe "Amara"? Let's go with "Maya"). She values normative significance, human welfare, and the distinction between choice and well-being. She sees economics as a moral science.

  3.  **Case Study Selection:**
