      *   *Elias's Defense:* "The good isn't the wine; it's the wine *plus the property of being the middle option*." This is the "finely individuated alternatives" move.
      *   *Maya's Counter:* "Then 'utility' just means 'whatever was chosen.' It tells us nothing about *why* or if they are happy."
      *   *The Welfare Pivot:* Maya brings in Sen. "Choice $\neq$ Welfare." Elias counters: "Who are we to judge their welfare better than their own actions?"
