  *(Self-Correction Note during drafting the ending)*: I need to make sure the final question is explicit. The prompt says "end with them facing a further question squarely." I will have them articulate the dilemma explicitly in the final lines.

  9.  **Final Polish:** Check names and tone. Elias (RP) should sound crisp, logical, slightly defensive of the discipline's rigor. Maya (Mentalist) should sound probing, concerned with human substance.

