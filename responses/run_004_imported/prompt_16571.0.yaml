      *   No fence-sitting? Yes.

      *(Self-Correction on the "Vector" analogy)*: Actually, a better analogy might be coordinate transformations. Or simply emphasizing that the "evidence" in JC is the *change in probability*, which is time-sensitive. Let's stick to the "Experience" argument as primary.

      *(Refining the "Same Evidence" point)*: The class thinks the evidence is the *propositions*. But in JC, the evidence is the *probability shift*. A shift of $P(E) \to 0.8$ then $P(F) \to 0.9$ is a different total input than $P(F) \to 0.9$ then $P(E) \to 0.8$. Why? Because the second update operates on the posterior of the first. The *context* of the second shift is different.

      *Wait, is that circular?* If the context is different, of course the result is different. But is it *rational*? Yes, because the epistemic situation is different. If I get a vague glimpse of a jellybean (red?) then a vague smell (cherry?), that's different than smell then glimpse. The reliability of the second cue might depend on the first. JC models this via the prior used for the second step.

      *Wait, one technical nuance:* Wagner (2002) and others have discussed this. The standard defense is that the "inputs" are not the same. To make them commute, you have to specify the inputs differently (e.g., using likelihood ratios). But the prompt asks to defend JC *as is*, with standard inputs. So the defense must be that the standard inputs *should* yield different results because they represent different temporal experiences.

      *Let's build the argument around the "Temporal Indexicality of Uncertain Evidence".*

