answer: |-
  **The Seam**

  The coffee mug is warm in my right hand. This is a fact I can verify. The heat travels up the radius, a clean signal to the language center: *Hot. Ceramic. Full.*

  My left hand rests on the table. It is not holding anything. It is palm down, fingers slightly curled, like a spider waiting for a vibration. I tell myself I am resting it. I tell myself I am enjoying the quiet of the kitchen before the house wakes up.

  The left index finger taps. Once. Twice.

  I stop it. I press the hand flat against the wood.

  *Relax,* I think. But the thought feels like it originates behind my right ear and has to travel a long, dark distance to reach the left shoulder. Sometimes the message arrives. Sometimes it dissolves in the static.

  Sarah comes in. She wears her robe tied tight, a defensive knot. She doesn't look at my face first; she looks at my hands. She always does. It's the first diagnostic of the day. Are we cooperating?

  "Morning," she says. Her voice is in the center, stereo.

  "Morning," I say. My voice sounds like mine. It comes out of the throat we share.

  She moves to the counter to pour her own tea. As she passes behind me, her shadow falls across my left visual field. For a fraction of a second, the shadow seems to belong to a stranger—taller, sharper. Then she steps into the light, and she is Sarah again. I blink. The lag between recognition and naming is a millimeter wide, but I can feel it. A stumble in the processing.

  "I'm going to the hardware store later," I say. "We need caulk for the bathroom."

  "We?" Sarah asks. She leans against the counter, cradling the mug.

  "I need caulk," I correct.

  "Take the truck. And take your time."

  She knows. Taking my time means stopping the car in the driveway and sitting for ten minutes, waiting for the two sides to agree on which foot should hit the pavement first.

  I go upstairs to dress. This is the dangerous part. Bimanual coordination requires a treaty, and treaties are fragile. I pull on a button-down shirt, white, fresh from the dryer. I sit on the edge of the bed.

  My right hand picks up the top button. It is mother-of-pearl, smooth. The right hand guides it toward the hole. The logic is simple: *Insert. Push. Pull.* The right hand knows the sequence. It has done this ten thousand times.

  As the button enters the hole, my left hand moves.

  It doesn't feel like *I* move it. It feels like a wind gusts through the room, specific and localized, catching the left wrist. The left thumb and forefinger pinch the fabric on the other side of the placket. They pull.

  The button pops free.

  I sit still. The shirt hangs open.

  *Why did I do that?* The question arises in the center. The narrator, the voice in the head, immediately goes to work. This is what it does. It is the press secretary for a government that sometimes acts without authorization.

  *The fabric was bunched,* the narrator suggests. *I felt a resistance. I unbuttoned it to smooth the line.*

  It is a plausible lie. I smooth the fabric with my right hand. I try again.

  Right hand inserts button. Left hand pinches fabric. Left hand pulls.

  *Pop.*

  Now the lie doesn't hold. The timing is too precise. It isn't a correction; it's a veto.

  I look at the left hand. It rests on my knee, innocent. The fingers are relaxed. If I didn't know better, I would say it was asleep. But I can feel the tension in the forearm, a low-frequency hum, like an engine idling in a garage next door.

  "Stop it," I whisper.

  The left hand turns over. Palm up. It looks like a question. *Stop what?*

  I stand up and pull the shirt over my head, discarding the task. I'll wear a sweater. No buttons. A zipper is a single continuous action, a zipper is a unity. I find a navy pullover. I pull it on. The left hand helps, gripping the hem, pulling down. We are synchronized. For a moment, the vertigo passes. I am a single column of intention.

  Downstairs, Sarah is reading at the table. She sees the sweater. She doesn't smile, but her shoulders drop an inch.

  "Hardware store?" she asks.

  "Yes."

  "Be careful on the ladder."

  "I will."

  The hardware store is a cathedral of categorization. Aisles of screws, of paints, of woods. It is a place for the left hemisphere, a place of names and lists. *Caulk. Gun. Razor.*

  I walk the aisle. My right hand pushes the cart. My left hand trails along the shelf, brushing the tubes of silicone.

  *Clear. White. Almond.*

  The left hand stops at *Almond*. It squeezes the tube.
  The right hand reaches for *White*.

  We stand there in Aisle 4. The right hand holds the *White*. The left hand holds the *Almond*.

  *We need White,* I think. *The grout is White.*

  The left hand does not let go. It squeezes the *Almond* tube again. A small bead of sealant pushes out of the nozzle, staining the thumb.

  *Why Almond?* The narrator scrambles. *Maybe the light in the bathroom is warm. Maybe White looks too clinical.*

  It's a good reason. I almost believe it. I remember reading once that the right side of the brain understands emotion better than the left. Maybe the left hand knows the bathroom feels cold, and it wants warmth. Maybe it is protecting me from the sterility of the white.

  Or maybe it just likes the way the tube feels.

  I put the *White* back. I put the *Almond* in the cart.

  "Compromise," I say aloud. My voice echoes in the aisle.

  A clerk walks by. He looks at the cart. He looks at my hands. His eyes linger on the left hand, which is now resting on the cart handle, gripping it tightly, knuckles white. The right hand is loose, open.

  "Find everything?" the clerk asks.

  "Yes," I say. "Just deciding."

  " Tough choice," he says. He doesn't wait for an answer.

  In the car, I put the key in the ignition. Right hand. The left hand rests on the gear shift. I start the engine.

  I don't drive immediately. I sit in the parking lot. The sun is coming through the windshield. It hits the right side of my face first, then slowly crosses the midline.

  When the light is on the right, I feel clear. I think about the caulk. I think about the drive home. I think about Sarah.
  When the light crosses to the left, the thoughts change texture. They become less verbal. Images rise up: the smell of the bathroom tiles, the sound of the fan, the feeling of the water pressure. No words. Just the *is-ness* of the task.

  I am waiting for the switch. Tim Bayne wrote about this—the idea that consciousness isn't two streams, but one stream that switches lanes. A single spotlight moving back and forth.

  But when the spotlight moves, does the person change?

  I lift my right hand. I watch it. I will the fingers to spread. They spread.
  I lift my left hand. I watch it. I will the fingers to spread.

  They stay curled.

  I focus on the left hand. *Spread.*
  Nothing.
  Then, slowly, the fingers extend. But the sensation is different. It doesn't feel like *command*. It feels like *request*. I asked, and the hand granted the favor.

  I put the car in drive. We merge into traffic. The radio is on. A song I know. I hum along. The left hand taps the rhythm on my thigh.

  It taps the off-beat.

  I correct it. I press my right hand down on top of the left hand to still it. The left hand stops. It lies quiet under my right palm. It is warm. It is flesh and blood and bone. It is mine.

  But as I stop at the red light, I feel a pressure from underneath. The left hand is pushing up against my right hand. Not violently. Just testing the weight. Testing the resistance.

  *Are you there?* it seems to ask.

  *Yes,* I think. *I'm here.*

  *Who?*

  The light turns green. I lift my right hand to steer. The left hand remains on my thigh for a second longer, then moves to the wheel. We grip together. Ten fingers on the leather.

  We turn the corner toward home. For a mile, the steering is smooth. The tension in the wheel is equal. I am driving. We are driving.

  Then, approaching the driveway, I signal to turn. The right hand pushes the lever down.
  Simultaneously, the left hand reaches up and flicks the lever back to neutral.

  The blinker stops. The car rolls straight.

  I do not correct it immediately. I let the car coast past the driveway. I drive another hundred feet down the road.

  I tell myself I missed the turn. I tell myself I decided to circle the block to clear my head. I tell myself the caulk can wait until tomorrow.

  I drive around the block. When I return to the driveway, I stop the car. I turn off the engine.

  I sit in the silence. I look at my hands. They are resting on my legs, palms up, mirroring each other. Two identical shapes, made of the same matter, bound by the same skin.

  I lift the right hand. I touch the left palm. The skin is warm. The fingers curl around my right thumb, holding it. A handshake.

  I don't remember telling them to clasp.

  I sit there for a long time, watching the hands hold each other, waiting to feel who is doing the holding, and who is being held. The sun moves across the dashboard, crossing the center line, but the shadow remains still.
