      *   **The Fullerian (let's call her "Fiona"):** Passionate about the human agency involved in law. Sees law as a collaborative enterprise. Believes procedure shapes substance.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A seminar room or office hours vibe. Establish the core conflict immediately.
      *   **The Hartian Attack (The Analogy):** Henry needs to bring up the "poisoner" or "carpentry" analogy. Hart actually used the poisoner analogy in his review. Let's use that. It's punchy. The argument: A poisoner can be efficient or inefficient. Efficiency doesn't make poisoning moral.
      *   **The Fullerian Defense:** Fiona needs to counter. It's not just efficiency; it's about respecting human agency. If you treat people like objects, you can't use law. Law *requires* treating them as agents.
      *   **The Test Case (The Caste System):** Introduce the hypothetical. A perfectly procedural apartheid/caste system.
      *   **The Clash on the Case:**
          *   Henry: See? It works. It's law. It's evil. Therefore, procedure $\neq$ morality.
          *   Fiona: This is the hard part. She can't say it's "good" overall. She has to argue that the procedural aspect *mitigates* the evil or contains the seeds of its own destruction. Or, she admits a "procedural good" exists but is overwhelmed by substantive evil.
          *   *Refinement:* The prompt asks if the Fullerian has to grant *some* real moral good. Yes, Fuller himself admitted this. It's a "partial" morality. Fiona should own this. It's better than arbitrary tyranny, even if the goal is evil.
      *   **The Meta-Question (Semantics vs. Fact):** Are they just arguing over words?
          *   Henry: You're stretching the word "morality" to include efficiency.
          *   Fiona: No, because the *way* we rule constitutes a relationship. If you break the rules, you aren't just failing; you're betraying a trust. That's moral.
      *   **Closing:** No knockout blow (because the debate is still alive in jurisprudence), but a mutual recognition of the stakes.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I include all 8 desiderata? I don't need to list them all verbatim, but the dialogue should reflect their spirit (clarity, non-retroactivity, etc.).
      *   *Check:* Is the Hartian too dismissive? Make sure Henry acknowledges that procedural justice is *important*, just not *morality* per se. He should value the Rule of Law instrumentally.
      *   *Check:* Is the Fullerian too wishy-washy? Fiona needs to stand firm that a system violating these isn't just "bad law," it's failing to be law *at all* (or at least failing the essential function).
      *   *The "Bullet":* Fiona must admit the caste system has *some* value compared to a chaotic tyrant. This is the "graceful bite." It respects the subjects enough to lie to them consistently? No, it respects them enough to guide their conduct.
      *   *The Analogy:* Hart's poisoner analogy is the specific one requested ("I recall he's got some pointed analogy... maybe involving a poisoner"). I will use that.

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Start:* Coffee shop or office. Let's go with office, post-seminar.
