          *   **The "Bullet":** Does the Fullerian admit *some* moral good in procedural cleanliness even here? Can they bite this bullet gracefully?
          *   **Meta-Question:** Is this a factual disagreement or just a semantic one about the label "morality"?

  2.  **Character Conception:**
