      *(Self-Correction on the "Fact vs. Semantics" point)*: This is crucial. Hart thinks it's semantics (calling efficiency "morality" is confusing). Fuller thinks it's substantive (the relationship created *is* moral). I need to make sure this distinction lands clearly.

