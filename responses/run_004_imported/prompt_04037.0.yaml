      *   *Logic:* If a play is +EV, you make it. Stack size shouldn't influence the decision *if* you are risk-neutral and have infinite reload ability.
      *   *Flaw:* This assumes risk neutrality and infinite bankroll. In the real world (and even in this home game), players have finite utility and risk of ruin.

