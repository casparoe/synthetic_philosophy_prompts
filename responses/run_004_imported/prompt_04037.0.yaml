answer: |-
  You are right to be bugged, and Dave is falling into a classic trap that smart people often stumble into when they apply pure theory to messy reality.

  Dave is correct about **Expected Value (EV)** in a vacuum, but he is ignoring **Risk of Ruin** and **Utility**. In the context of your specific home game structure, his advice is actually dangerous.

  Here is the breakdown of why your intuition is correct and where Dave's logic fails.

  ### 1. The "Infinite Bankroll" Fallacy
  Dave's logic ("the math doesn't care about your stack size") holds true only if you have an **infinite bankroll** and **infinite time**.

  In a casino cash game, if you have $10,000 in your pocket and the buy-in is $200, you can essentially play "risk neutral." If you lose a buy-in on a high-variance +EV play, you just reload. The loss doesn't impact your life.

  In your home game, you have a **running tab**. This creates a finite bankroll constraint.
  *   **Risk of Ruin:** Even if you have a massive edge, if you make high-variance plays that risk your entire stack frequently, variance *will* eventually wipe you out. If you hit zero on the tab, you either stop playing (losing access to your edge) or you have to inject personal funds (which defeats the purpose of the game bankroll).
  *   **The Grind:** You mentioned that when you get crushed, it takes months to grind back. That is "dead time." During those months, you aren't enjoying the game, and you aren't compounding your winnings.

  **The Fix:** You need to manage your bankroll to maximize *growth*, not just EV per hand. This is the core concept of the **Kelly Criterion**. You should never risk a percentage of your stack that makes "ruin" a statistical certainty, even on +EV plays.

  ### 2. Diminishing Marginal Utility
  Dave is treating every dollar on the tab as having equal value. Economically, this is false.

  *   **The Pain of Loss:** Losing your last $500 hurts much more psychologically (and practically) than winning an extra $500 helps. If you go broke, the utility of that money drops to zero because you can't play.
  *   **The Cap on Winning:** In a home game, there is often a soft cap on how much you can win. Your friends only have so much money. If you run up huge, the game might stall, or friends might stop playing. But if you go broke, the game stops for *you* immediately. The downside risk is more potent than the upside potential.

  ### 3. Stack Size *Does* Change Strategy (Even in Cash)
  Dave says you should take aggressive lines "regardless of how big or small my stack happens to be." From a pure poker strategy perspective, **this is also wrong.**

  *   **Short Stack (e.g., 20 Big Blinds):** You cannot execute complex, multi-street aggressive bluffs. Your stack-to-pot ratio (SPR) is too low. A "big aggressive line" might mathematically require you to commit your whole stack on a bluff, which turns a +EV play into a -EV play because you lose your fold equity.
  *   **Deep Stack (e.g., 200 Big Blinds):** You have more room to maneuver. You can afford to take a line that has higher variance because you have more bullets to fire and more implied odds.

  By ignoring stack depth, Dave is ignoring fundamental No-Limit Hold'em strategy. Stack size dictates bet sizing and commitment levels.

  ### 4. The Social Contract
  This is a home game with the same six guys for three years. The goal is likely a mix of profit and social enjoyment.
  *   **Variance vs. Fun:** If you play Dave's way, you will experience extreme swings. When you are grinding back for months, it stops being fun. You become the guy who is stressed about every hand, trying to claw back losses.
  *   **Table Dynamics:** If you are known as the maniac who shoves whenever the math says +EV regardless of stack, the table will adjust. They will call you down lighter when you have a stack, and fold when you don't. Your edge might disappear because your strategy becomes predictable.

  ### The Verdict
  Dave is treating the poker table like a stock market algorithm where he has infinite capital. You are treating it like a game with finite resources and social consequences. **You are the one thinking like a professional gambler; Dave is thinking like a theorist.**

  **What you should do:**
  1.  **Acknowledge EV, but prioritize Survival:** Continue making +EV plays, but scale your aggression based on your stack depth relative to the blinds and the pot.
  2.  **Set a "Reload" Rule:** If the running tab is causing stress, agree on a rule where if someone drops below a certain threshold, they reload to a standard buy-in from outside funds. This resets the Risk of Ruin and lets you play Dave's way safely.
  3.  **Ignore Dave on Stack Size:** Do not make big, committing plays with a short stack unless you are willing to lose the whole thing. Preserve your capital so you can wait for better spots.

  Dave isn't wrong that math matters. He's wrong that math is the *only* thing that matters. In poker, **money management is part of the math.**
