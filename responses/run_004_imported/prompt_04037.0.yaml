      *   He is ignoring **Diminishing Marginal Utility**. Winning $500 when you're up $5000 feels different than winning $500 when you're down $2000.
      *   He is ignoring **Game Access**. If the user grinds back for months, they are missing out on the social aspect and potentially other +EV opportunities during that recovery time.

