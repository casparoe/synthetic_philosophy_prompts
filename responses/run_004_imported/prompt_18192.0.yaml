answer: |-
  The Oswald/Kennedy pair is the canonical stress test for the indicative/subjunctive distinction. Since you're familiar with the basics, let's cut straight to the structural divergence in how Stalnaker's truth-conditional pragmatics and Adams's suppositional theory derive the truth-value gap, and then weigh the cost of Lewis's triviality results on the former.

  ### 1. Stalnaker's Context-Set Restriction vs. Adams's Conditional Probability

  **Stalnaker (1975, 1984): The Pragmatic Restriction on the Domain**
  Stalnaker retains a unified similarity-based semantics for both indicatives and subjunctives ($A > C$ is true iff $C$ holds in the closest $A$-world). To handle the Oswald pair without contradiction, he introduces a pragmatic distinction regarding the **domain of quantification**.

  *   **Subjunctives:** The selection function ranges over the set of all metaphysically possible worlds. In the closest world where Oswald doesn't shoot (and we don't presuppose JFK's death), there is no conspiracy, so JFK lives. The consequent ("someone else did") is false. Verdict: False.
  *   **Indicatives:** The selection function is restricted to the **context set**—the set of worlds compatible with the shared presuppositions of the conversation. Since it is a settled fact in the context that JFK was killed, the context set contains *only* worlds where JFK dies. Therefore, the closest world in the context set where Oswald doesn't shoot *must* be one where someone else does. Verdict: True.

  **Explanatory Power:** Stalnaker explains the asymmetry via **presupposition accommodation**. The indicative signals that the antecedent is to be evaluated against the actual background facts (JFK died), whereas the subjunctive signals a suspension of those facts to test causal dependencies. This isn't a mere stipulation of truth values; it derives the divergence from the independent pragmatic norms governing assertion (what is mutually taken for granted) vs. speculation (what is metaphysically compossible).

  **Adams (1965, 1975): The Epistemic Divergence**
  Adams denies truth conditions to indicatives. Assertability is determined by **Adams' Thesis**: $Assertability(A \rightarrow C) = P(C|A)$.

  *   **Indicatives:** We evaluate $P(\text{Someone else did} | \text{Oswald didn't})$ relative to our *current* evidence (which includes "JFK was killed"). Given the evidence, the conditional probability is near 1.
  *   **Subjunctives:** Adams is less formal here, but the suppositional account implies we must evaluate the probability relative to a prior epistemic state (before the event) or a causal model. Relative to the pre-assassination evidence, $P(\text{Someone else would} | \text{Oswald hadn't})$ is low.

  **Explanatory Power:** Adams explains the asymmetry via **evidential updating**. The indicative is backward-looking (diagnostic), conditioning on the known outcome. The subjunctive is forward-looking (predictive/causal), conditioning on the causal structure prior to the outcome.

  ### 2. Explanation vs. Stipulation

  Which theory explains rather than stipulates?

  **Stalnaker** offers a more robust *semantic* explanation. By tying the indicative to the context set, he integrates the Oswald intuition into a broader theory of communication (common ground). The truth-value gap emerges naturally from the fact that indicatives are used to convey information within a shared factual framework, while subjunctives explore frameworks outside shared knowledge. However, critics (like DeRose and Grandy) argue this makes the indicative/subjunctive distinction purely pragmatic, failing to capture the intuitive *modal* difference. It risks looking like a semantic fix for a pragmatic problem.

  **Adams** offers a stronger *epistemic* explanation. It captures why we *assert* the indicative but not the subjunctive without needing to posit a mysterious "indicative truth-maker." However, it stipulates a **semantic dualism**: indicatives and subjunctives are fundamentally different kinds of linguistic objects (one has truth conditions, the other does not). This makes it difficult to explain embedded contexts (e.g., "If it is true that if Oswald didn't...") where indicatives behave like truth-apt propositions.

  ### 3. The Triviality Worry (Lewis 1976)

  You asked whether Lewis's triviality results should worry us if we try to give indicatives truth conditions. **Yes, absolutely.** This is the critical pivot point for your lit review.

  Lewis proved that no non-trivial probability function can satisfy the equation $P(A \rightarrow C) = P(C|A)$ for all $A, C$ if $A \rightarrow C$ has standard truth conditions.

  **Impact on Stalnaker:**
  Stalnaker wants truth conditions *and* wants to respect the intuition that assertability tracks conditional probability. To avoid triviality, Stalnaker must deny that the *unconditional* probability of the conditional equals the conditional probability.
  *   **The Move:** Stalnaker argues that $P(A \rightarrow C)$ is only equal to $P(C|A)$ when the probability function is restricted to the **context set**.
  *   **The Cost:** This means Adams' Thesis holds only locally (within a context), not globally. For a lit review, this is a crucial vulnerability. It implies Stalnaker's truth conditions are context-dependent in a way that makes the logic of conditionals unstable across context shifts. If the truth conditions shift with the context set, do we really have a stable semantics, or just a pragmatic mask?

  **Impact on Adams:**
  Adams avoids triviality entirely by denying the antecedent of Lewis's theorem: indicatives have no truth conditions, so $P(A \rightarrow C)$ is undefined.
  *   **The Cost:** You lose the ability to embed indicatives in truth-functional contexts (negation, conjunction, probability operators). You cannot say "It is probable that if Oswald didn't..." without reinterpreting the probability operator.

  ### 4. Synthesis for the Lit Review

  If your chapter argues for **semantic unity**, Stalnaker is the stronger candidate. He preserves classical logic (Modus Ponens holds) and provides a mechanism (context set restriction) that explains the Oswald pair through independent pragmatic principles. However, you must acknowledge the Lewisian cost: he saves truth conditions by sacrificing the global validity of Adams' Thesis.

  If your chapter argues for **epistemic fidelity**, Adams wins. He captures the probabilistic intuition directly and avoids the triviality trap by abandoning truth conditions. However, you must address the "Embedding Problem" (how indicatives function in complex sentences) which remains the biggest hole in the suppositional account.

  **Critical Angle:**
  A sophisticated take for your review is to suggest that the Oswald pair reveals a **category mistake** in trying to force both conditionals into a single semantic box.
  *   Stalnaker tries to force them into a *truth-conditional* box, requiring pragmatic patches (context sets) to handle the divergence.
  *   Adams tries to force them into a *probabilistic* box, requiring semantic dualism to handle the divergence.

  **Recommendation:**
  Don't just present them as rivals. Frame Lewis's triviality result as the reason the field fractured. Stalnaker's handling of the Oswald pair is technically superior for preserving logic, but it requires accepting that the "truth" of an indicative is relative to a conversational score (the context set). Adams is superior for decision theory but fails as a logic. If your lit review focuses on **metaphysics of modality**, lean Stalnaker (with triviality caveats). If it focuses on **epistemology/assertion**, lean Adams.

  **One final nuance:** Be careful attributing the truth-conditional indicative view to Lewis. Lewis (1976) explicitly sides with Adams on indicatives *because* of the triviality results. He reserves the similarity semantics for counterfactuals. So, in your review, distinguish **Stalnaker's Truth-Conditional Indicatives** from **Lewis's Similarity Semantics for Counterfactuals**. Conflating them on the indicative side weakens your critique of the triviality problem. Stalnaker is the one trying to square the circle; Lewis admitted the circle couldn't be squared.
