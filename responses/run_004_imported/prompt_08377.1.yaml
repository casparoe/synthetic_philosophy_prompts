answer: |-
  You are absolutely right to be skeptical of the "he did it for the money" caricature. That narrative was largely constructed by later Enlightenment thinkers who needed Kepler to be a proto-rationalist to claim him as an ancestor. The reality is much stranger and more coherent: Kepler was a committed astrologer who believed he was *saving* astrology from the astrologers.

  He viewed traditional astrology as a corrupted ancient wisdom that had been buried under layers of Arabic and Medieval superstition. His project in *Tertius Interveniens* (1610) and later *Harmonices Mundi* (1619) was to strip astrology down to its metaphysical bedrock.

  Here is the internal mechanics of Kepler's "Reformed Astrology."

  ### 1. The Filter: What He Threw Out and Why
  To understand what Kepler kept, you have to understand why he viewed the standard tools of the trade as physically impossible.

  **The Zodiac Signs (The 12 Constellations)**
  *   **Traditional View:** The Sun in Aries makes people fiery; the Moon in Cancer makes them moody.
  *   **Kepler's Objection:** Arbitrary human labeling. The constellations are uneven clusters of stars at vastly different distances. Furthermore, due to the precession of the equinoxes, the signs had drifted away from the actual constellations.
  *   **The Logic:** God created the universe using geometry, not pictures of goats and scorpions. A 30-degree slice of the ecliptic has no inherent physical power just because humans drew a line there. It lacks *geometric necessity*.

  **The Houses (The 12 Sectors of the Sky)**
  *   **Traditional View:** The 7th House governs marriage; the 10th House governs career.
  *   **Kepler's Objection:** Local relativism. The houses are calculated based on the horizon and meridian of a specific location.
  *   **The Logic:** If a King is born in Prague, why should the position of the horizon in Rome determine his fate? Physical causes must be universal. A force that governs destiny cannot depend on where the astrologer is standing.

  **Planetary "Qualities"**
  *   **Traditional View:** Mars is hot and dry; Saturn is cold and melancholic.
  *   **Kepler's Objection:** Anthropomorphism. Planets are physical bodies, not gods with temperaments.
  *   **The Logic:** There is no physical mechanism for a distant planet to transmit "anger" or "sadness."

  ### 2. The Retention: Aspects as Geometric Physics
  If signs and houses are arbitrary, what is left? The **angles** between the planets as viewed from Earth.

  Kepler argued that the **Aspects** (Conjunction, Opposition, Trine, Square, Sextile) were the only legitimate astrological factors. But he didn't keep them because Ptolemy said so; he kept them because they were the only things that satisfied his criteria for **Physical Reality.**

  **The Mechanism: *Anima Terrae* (The Soul of the Earth)**
  This is the linchpin of Kepler's system. In traditional astrology, planetary rays often shot directly down to affect the newborn baby. Kepler rejected this.

  1.  **The Receiver:** The Earth itself is a living organism. It possesses a faculty of perception, an *Anima Terrae* (Soul of the Earth).
  2.  **The Perception:** The Earth does not "see" light from the planets. It perceives **Geometry**. When planets align in specific angles relative to the Earth, the Earth's soul instinctively recognizes the geometric pattern.
  3.  **The Reaction:** When the Earth's soul perceives a "harmonious" geometric configuration, it reacts physically. It shudders. This reaction manifests as **meteorology**. It releases vapors, shifts winds, changes temperatures, and creates storms.
  4.  **The Human Link:** Humans are terrestrial animals. We live in the Earth's atmosphere. We breathe the vapors the Earth exhaled in response to the planets. Our bodies (the microcosm) resonate with the weather (the macrocosm).
      *   *Example:* A Square aspect (90°) causes the Earth to feel tension, releasing cold, dry vapors. Humans breathing this air become prone to cold/dry humors (illness, melancholy).

  So, Keplerian astrology is essentially **meteorological astrology.** It predicts the "climate of the soul" via the climate of the air.

  ### 3. The Geometric Justification: Constructible Polygons
  Why *these* angles (60°, 90°, 120°, 180°) and not others? This is where Kepler connects astrology to his broader cosmology in *Harmonices Mundi*.

  Kepler believed that for a geometric relationship to have physical power, it must be **knowable** by the divine mind. In Euclidean geometry, this meant the shape had to be **constructible** using only a compass and straightedge.

  *   **The Circle:** Represents the unity of God/The Universe.
  *   **Inscribable Polygons:** When planets align, they form the corners of regular polygons inscribed in the ecliptic circle.
  *   **Constructibility:**
      *   **Triangle (Trine, 120°):** Constructible.
      *   **Square (Square, 90°):** Constructible.
      *   **Hexagon (Sextile, 60°):** Constructible.
      *   **Line (Opposition, 180°):** Constructible.
      *   **Pentagon (72°):** *Technically* constructible, but Kepler initially hesitated on this because it involves the "golden section," which he found less "pure" than the binary/ternary divisions, though he later accepted it in *Harmonices Mundi* under musical grounds.

  If an angle cannot be constructed geometrically (like an arbitrary 53° angle), it is "irrational" (in the mathematical sense). It cannot exist in the Mind of God, and therefore it cannot exert physical force. It is noise, not signal.

  ### 4. The Harmonic Connection: Music of the Spheres
  In *Harmonices Mundi*, Kepler deepened the mechanism. He realized that "constructible geometry" and "musical harmony" are the same thing expressed differently.

  *   **Geometry:** Dividing a circle.
  *   **Music:** Dividing a vibrating string.
  *   **Astrology:** The angles between planets.

  Kepler mapped the aspects to musical consonances:
  *   **Conjunction (0°):** Unison.
  *   **Opposition (180°):** Octave (2:1 ratio).
  *   **Trine (120°):** Perfect Fifth (3:2 ratio).
  *   **Square (90°):** Perfect Fourth (4:3 ratio).
  *   **Sextile (60°):** Major/Minor Third (5:4 or 6:5 ratio).

  **The Mechanism of Resonance:**
  The Earth's soul is tuned like a musical instrument. When the planets form a "consonant" aspect (a harmonious chord), the Earth resonates with it. This resonance is what causes the physical reaction (weather).
  *   **Hard Aspects (Square, Opposition):** These are dissonant or high-tension harmonies. They cause violent reactions (storms, upheavals).
  *   **Soft Aspects (Trine, Sextile):** These are consonant harmonies. They cause gentle reactions (calm weather, fertile growth).

  This explains why Kepler despised the "benefic/malefic" nature of planets (Jupiter is good, Saturn is bad). For Kepler, **any** planet can create a "hard" aspect. A Trine from Saturn is gentle; a Square from Jupiter is violent. The *quality* of the event depends on the **geometry of the angle**, not the **identity of the planet**. The planet is just the marker; the angle is the engine.

  ### 5. Summary of the Internal Logic
  If you are writing this piece, the through-line is that Kepler replaced **Symbolic Correspondence** with **Geometric Resonance.**

  1.  **Rejection of Semiotics:** Traditional astrology was semiotic (Aries *signifies* fire). Kepler hated this. Signs are arbitrary words.
  2.  **Adoption of Physics:** Keplerian astrology was causal (The angle *causes* a geometric stress).
  3.  **The Medium:** The causal link is not magic rays hitting a baby; it is Geometry $\rightarrow$ Earth's Soul $\rightarrow$ Weather $\rightarrow$ Human Humors.
  4.  **The Filter:** Only angles that reflect Divine Archetypes (constructible polygons/musical consonances) can penetrate the Earth's soul.

  Kepler wasn't straddling magic and science. He was operating within a **Neoplatonic Physics** where Geometry was the fundamental substance of reality. To him, saying "Aspects are real but Signs are not" was no different than a modern physicist saying "Gravity is real but Astrological Ages are not." One is a measurable force derived from universal law; the other is a cultural construct.

  He cast horoscopes not because he was a charlatan, but because he believed he was the only one using the correct formula. He famously refused to adjust his charts to please patrons, arguing that casting a false chart was a sin against the geometric truth of God's creation. That's not the behavior of a man who thinks it's nonsense; that's the behavior of a man who thinks he's the only one who understands the code.
