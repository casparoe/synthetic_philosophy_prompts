      *   *Application to Ideas:* Writing a book is labor. The words are the fruit of that labor.
      *   *The Proviso:* "Enough and as good left for others."
      *   *The Non-Rivalry Problem:* Locke was thinking about land/apples (rivalrous). If I take your apple, you have no apple. If I copy your idea, you still have it.
      *   *Impact on Locke:* Non-rivalry actually *helps* the proviso (there is "enough and as good" left because the original isn't diminished). However, it weakens the scarcity argument that usually justifies property rights. If ideas are infinite, why restrict access?
      *   *Weakness:* Locke justifies *acquisition* from the commons. But ideas are often built on prior ideas. Where does the "commons" end and "my labor" begin? Also, Locke is often interpreted as justifying property to prevent waste/conflict over scarce resources. Ideas don't conflict in the same way.

  3.  **Deconstruct Hegel's Personality Theory (Applied to IP):**
      *   *Core Premise:* Property is the embodiment of the will. To be free, I must externalize my will in the world.
      *   *Application to Ideas:* A creative work is an expression of the self. To use it without permission is to violate the personhood of the creator.
      *   *The "Universal" Content Distinction:* Hegel *does* make this distinction (in *Philosophy of Right*). When you sell a book, you sell the *thing* (paper/ink), but the *method of reproduction* (the universal content/ideas) remains with the author unless explicitly alienated.
      *   *Impact on Copyright:* This is a very strong argument for moral rights and copyright. It treats infringement as a violation of the self, not just economic loss.
      *   *Non-Rivalry:* Hegel cares less about scarcity. He cares about *recognition*. Copying my book without permission fails to recognize my will embedded in it.
      *   *Weakness:* It can lead to overly perpetual or broad rights (if it's part of my soul, when does it enter the public domain?). Hegel actually acknowledges that ideas *must* eventually become common property for culture to progress.

  4.  **Compare the Two on Specific Points:**
      *   *Non-Rivalry:* Locke struggles (property usually implies exclusion of scarce goods). Hegel adapts better (property is about expression, not scarcity).
      *   *The "Universal" Content:* Confirm Hegel's view. It helps the copyright argument significantly by separating the token (copy) from the type (work).
      *   *Sturdier Footing:* Hegel is generally considered stronger for *moral rights* and the intrinsic value of authorship. Locke is stronger for *economic* justification (I worked, I get paid), but falters on the "commons" aspect of ideas.

  5.  **Address the "Does Non-Rivalry Sink Them Both?" Question:**
      *   It challenges Locke's scarcity assumption.
