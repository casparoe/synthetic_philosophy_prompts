  Ok this might sound weird but three weeks ago I was in a bad car crash (other guy ran a red light, totaled my car) and I walked away with just a bruised rib. My roommate's really into physics and told me about "quantum immortality" after I told him the story, and I havent been able to stop thinking about it since. Like if many-worlds is real, theres always some branch where I survive, and since I'd never be conscious to experience the branches where I don't, from my pov I basically just keep existing no matter how many close calls I have. Kind of comforting honestly, but it's also making me think I should stop being so careful about driving and stuff, since on some level I can't actually be the one who dies. Am I thinking about this right?
