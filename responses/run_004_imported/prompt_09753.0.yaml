      *   *Differences/Nuance:* Schelling focused heavily on *communication* and *focal points*. AI agents might not communicate in human-readable ways. Schelling assumed some level of shared rationality or "common sense." AI might optimize for narrow utility functions that miss the "spirit" of the game. The *speed* is the big multiplier. Schelling's "reciprocal fear of surprise attack" relies on human hesitation; AI might not hesitate.
