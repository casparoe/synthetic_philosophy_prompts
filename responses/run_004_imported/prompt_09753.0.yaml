      *   *Why is it dangerous?* If both do this, they lock into incompatible commitments (e.g., "I will never yield"), leading to disaster (collision/war) that neither actually wanted.
      *   *Key difference from human Chicken:* Speed, opacity, lack of human hesitation/emotion, potential for self-modification.

