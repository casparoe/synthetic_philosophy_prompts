      *   Avoid prescriptive "rules." Offer "implications" and "possibilities."
      *   Make sure the distinction between *metaphysical possibility* and *narrative coherence* is clear. In metaphysics, a fink can be magical. In fiction, it usually needs a psychological cause.

  8.  **Self-Correction/Edge Case Check:**
