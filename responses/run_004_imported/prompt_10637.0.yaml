answer: |-
  This is a fantastic passage to get stuck on, because it is precisely where Eliot's moral psychology, her Feuerbachian theology, and her critique of Evangelical Calvinism converge. You are right to be suspicious of the "Inverted Kant" gloss; while it's a tempting heuristic for a philosopher, it flattens the specific work Eliot is doing with the term "accessory motives" and misses the anthropological turn she takes at the end.

  Here is a breakdown of the inferential steps in the argument, followed by a response to your two specific theoretical worries (the Kant mapping and the Feuerbachian relocation problem).

  ### 1. The Inferential Chain of the Passage

  Eliot's argument here is not primarily deontological (about rules) but **psychological and phenomenological** (about the quality of moral experience). Here is the logical progression:

  1.  **Phenomenological Premise:** Moral sentiments (benevolence, pity, justice) derive their strength and authenticity from the immediacy of their object. Pity is strong *because* suffering is present to the senses/imagination.
  2.  **Definition of Strict Benevolence:** An action is "strictly benevolent" only if the internal state matches the external act (compassion moves the arm).
  3.  **The Heteronomy Critique:** If the action is performed because an external authority (God, a pastor, society) wishes it, the motive shifts from *benevolence* to *deference* or *self-interest* (avoiding hell, gaining heaven, pleasing the pastor).
  4.  **The "Accessory Motive" Axiom:** This is the crux of your disagreement with your friend. Eliot claims: *"Accessory motives may aid in producing an action, but they presuppose the weakness of the direct motive."*
      *   *Inference:* You only need a bonus (glory of God) to do the right thing if you wouldn't do it for its own sake. If the suffering were truly compelling, you wouldn't need to think about God's glory to act. The need for the theological "top-up" proves the human sympathy is deficient.
  5.  **The Zero-Sum Psychology:** *"When the direct motive is strong, the action of accessory motives will be excluded."*
      *   *Inference:* Attention is finite. If I am fully absorbed in your pain, I am not thinking about my own spiritual ledger. Focusing on the "absorbing aim" of God's glory necessarily diverts attention *away* from the suffering human (the "natural current" to the "artificial canal").
  6.  **The Feuerbachian Resolution:** The "Idea of God" is salvageable *only if* it is redefined not as a lawgiver, but as a projection. God must be contemplated as possessing "infinitely all those attributes which we recognize to be moral in humanity."
      *   *Inference:* God does not validate human sympathy; human sympathy validates the concept of God.

  ### 2. On the "Inverted Kant" Claim

  Your friend's reading is provocative but ultimately imprecise. Here is why the "Inverted Kant" map doesn't quite hold, and what Eliot is actually doing.

  **Where the friend is right:**
  Eliot does valorize what Kant calls "inclination" (acting from sympathy) and suspiciously views acting from a principle external to the immediate situation (Cumming's "Glory of God"). In the *Groundwork*, Kant argues that action from inclination has no moral worth; only action from duty does. Eliot flips this: action from "deference/obedience" (Cumming's duty) is morally suspect; action from "direct motive" (sympathy) is the only true benevolence.

  **Where the friend is wrong:**
  The term "accessory motives" is doing heavier lifting than just "principled action."
  1.  **Heteronomy vs. Autonomy:** Kant's "Duty" is *autonomous* (self-legislated by Reason). Cumming's "Glory of God" is *heteronomous* (legislated by an external Being). Eliot is attacking heteronomy. In this sense, she is actually *aligning* with Kant's demand for autonomy, even if she locates the source of law in Sentiment rather than Reason.
  2.  **Psychological Strength vs. Moral Worth:** Kant is interested in the *moral worth* of the agent (are you good?). Eliot is interested in the *efficacy and authenticity* of the act (is this benevolence?). Her argument is that Cumming's theology produces *psychologically weaker* moral agents. If you need the threat of hell or promise of glory to be nice, your niceness is fragile.
  3.  **The Nature of the "Direct Motive":** For Eliot, the "direct motive" isn't just raw impulse (which Kant rightly distrusts). It is a cultivated sensibility. In her later fiction (and other essays), she argues sympathy must be educated. But once educated, it must operate immediately.

  **Better Label:** Rather than "Inverted Kant," think of this as **Humean Sentimentalism filtered through Feuerbach.** Eliot argues that morality is rooted in social feeling (Hume/Smith), and that religious dogma which bypasses social feeling to appeal to divine transaction corrupts that root.

  ### 3. The Feuerbachian "Relocation" Problem

  This is the sharper philosophical objection. You ask: *If she keeps "the idea of God" as an amplifier of human sympathy, doesn't she still use something not directly felt to certify which feelings count?*

  This is the risk of Feuerbachian projection, but Eliot navigates it carefully in this specific passage. Here is the distinction:

  **Cumming's Model (Transcendent Certification):**
  *   Source of Value: God.
  *   Mechanism: God commands X.
  *   Human Action: I do X to glorify God.
  *   *Problem:* The value of X is extrinsic. If God commanded cruelty, cruelty would be good. The "stream of feeling" is diverted from the human object to the divine subject.

  **Eliot's Model (Immanent Reflection):**
  *   Source of Value: Human Sympathy ("pure elements of human feeling").
  *   Mechanism: We recognize moral attributes in ourselves.
  *   Theological Move: We project these attributes infinitely onto a figure called "God."
  *   Human Action: I contemplate God, see my own best impulses magnified, and feel strengthened in those impulses.
  *   *Solution:* The "Idea of God" does not *certify* the feeling. The feeling certifies the Idea.

  **Does this relocate the problem?**
  It avoids the *heteronomy* problem, but it introduces a *redundancy* problem. If God is just "human morality writ large," why keep the term "God"?

  Eliot's answer (implicit here, explicit in her letters and later fiction) is **psychological utility.** Humans are not purely rational; we need ideals external to our frail selves to sustain our moral effort.
  *   **The "Amplifier" Function:** When she says God is contemplated as "possessing infinitely all those attributes," she is describing an **idealization**. It is easier to be brave when you feel part of a "Great Being" who is perfectly Brave.
  *   **The Safeguard:** The safeguard against the "relocation" error is the clause: *"only when God is contemplated as sympathizing with the pure elements of human feeling."*
      *   If the "Idea of God" ever conflicts with the "pure elements of human feeling" (e.g., God demands you hate a sinner), the Idea must be discarded or corrected.
      *   In Cumming's system, if God demands hate, you hate.
      *   In Eliot's system, if God demands hate, it proves your concept of God is false, because it contradicts the "pure elements" you already recognize as moral.

  So, she does not relocate the problem of external certification. She makes the "Idea of God" **subordinate** to human sympathy. It is a tool for strengthening the "direct motive," not a replacement for it.

  ### 4. Summary for the Dissertation

  If you are weaving this into a chapter on the "crisis of faith," this passage is evidence that Eliot isn't just mourning the loss of faith; she is actively **diagnosing the moral mechanics of belief.**

  *   **The Argument:** Evangelical theology (Cumming) creates moral alienation by inserting a transactional "accessory motive" (Glory of God) between the sufferer and the succorer.
  *   **The Philosophy:** It is a critique of **moral extrinsicism**. Goodness must be intrinsic to the act (done for the sake of the other), not extrinsic (done for the sake of a third party, even a divine one).
  *   **The Theology:** She retains "God" not as a being, but as a **regulative ideal** of human potential. This allows her to keep the *emotional power* of religion (the "stream of feeling") without the *theological cost* (heteronomy).

  Your friend's Kant reading is a useful foil, but Eliot is ultimately arguing that Cumming's theology makes you a *worse* person (weaker sympathy, divided attention), whereas Kant is arguing about whether you are a *worthy* person. Eliot's concern is the **sociological and psychological health of the moral agent**, which is why she insists the "stream of feeling" must not be diverted. The "Religion of Humanity" isn't just a slogan here; it's a claim about where the "direct motive" must originate to remain strong.
