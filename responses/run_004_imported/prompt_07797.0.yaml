answer: |-
  **Setting:** *A quiet corner of a conference center, post-session. Two coffee cups sit between them. **Elena** (proponent of surrogate goals) is leaning forward, tapping a pen against a notebook. **Marcus** (skeptic) is leaning back, arms crossed, looking thoughtful.*

  **Marcus:** So, I read your draft section on the surrogate goal defense. It's elegant, I'll give you that. But I keep coming back to the same friction point. You're proposing we bind ourselves to a useless token—let's call it $S$—and threaten mutual destruction if $S$ is harmed, hoping the blackmailer targets $S$ instead of our actual values $V$.

  **Elena:** Exactly. It's a decoy. If I can convince a blackmailer that my utility function is $U(S)$ rather than $U(V)$, they have no leverage. They can't threaten $V$ if they think I don't care about $V$. And if they threaten $S$, I've already precommitted to burn the world rather than yield, so they won't do that either. It neutralizes the threat landscape.

  **Marcus:** But this only works if the blackmailer is causally blind. We're talking about acausal threats here. We're assuming the adversary is a logical predictor, likely running a simulation of you to check your credibility. If they simulate you, they don't just see *what* you do; they see *why* you do it.

  **Elena:** They see the output of the decision algorithm.

  **Marcus:** They see the source code, Elena. If I'm simulating you to see if you'll pay up, and I see a subroutine that says `if S_threatened: retaliate`, I immediately ask: *Why is this subroutine here?* In the simulation, I can trace the dependency. I see that the reason you care about $S$ is instrumentally to protect $V$. The correlation between your defense of $S$ and the value of $V$ is logically tight. As soon as I see that the commitment to $S$ is *derived* from the value of $V$, the screen goes transparent. I just threaten $V$ directly, knowing your defense of $S$ is contingent on $V$'s safety.

  **Elena:** That's the standard "transparency" objection. But you're assuming the link between $S$ and $V$ remains logically accessible. The whole point of the surrogate move is to sever that link *before* the interaction. I'm not saying "I care about $S$ because it protects $V$." I'm saying, "I have modified my utility function. $U_{new} = S$." I delete $V$ from my active optimization target for the duration of the game.

  **Marcus:** But who performs the modification? *You* do. And *you* care about $V$. So the act of modifying your utility function to prioritize $S$ is itself a signal that $V$ is valuable. A smart predictor models the *process* that led to the agent sitting in front of them. If the only rational reason to adopt a surrogate goal is to protect high-value assets, then observing the surrogate goal *is* observing the high-value assets. It's a costly signal that screams, "There's something real behind this curtain."

  **Elena:** Not necessarily. It's not a signal of value; it's a signal of *policy*. Look, the problem with direct precommitment—"I will never pay blackmail"—is that it's incredibly costly to maintain. It requires you to actually follow through on suicide or world-burning if the threat is executed. That's a hard commitment to make credibly.

  **Marcus:** I agree direct commitment is hard. That's why UDT says you simply don't have the policy of paying in the first place.

  **Elena:** Right, but UDT is a normative theory. It tells you what you *should* have been. It doesn't tell you how to construct an agent that *holds* that policy when the pressure is on. The surrogate goal is an *implementation detail*. It lowers the temperature of the commitment. It is psychologically and architecturally easier to bind yourself to an arbitrary token $S$ than to your own core values. I can tell myself, "This token is just a game piece," and bind my honor to the game piece. It's easier to die for a principle of "never yield on arbitrary tokens" than to die for "my specific survival."

  **Marcus:** Okay, let's grant that it's easier for *you* to commit to $S$. That solves the internal commitment problem. But it doesn't solve the external information problem. We are back to the predictor. If the predictor is smart enough to model your psychology, they know you find it easier to commit to $S$. They infer that $S$ is a shield. And if there's a shield, there's something worth shielding.
  Think about it recursively. If I'm a blackmailer, and I see an agent with a surrogate goal, I have two hypotheses:
  1. They genuinely care about $S$ and $V$ is irrelevant.
  2. They care about $V$ and are using $S$ as a decoy.
  Hypothesis 1 is implausible for any agent evolved or designed to survive. Hypothesis 2 is the prior. Unless you can make the cost of testing Hypothesis 2 prohibitive, I test it. I threaten $V$. If you retaliate because of $S$, great, I learn $S$ is linked to $V$. If you don't, I win.

  **Elena:** You're missing the payoff structure. The defense isn't just about hiding $V$. It's about making the *cost of aggression* asymmetric. If I successfully convince you that threatening $S$ leads to mutual destruction, you won't threaten $S$. Now, if you threaten $V$ instead, you are explicitly bypassing my declared protocol.
  Here is the key: I make my retaliation conditional on *any* coercive attempt, regardless of the target. But I frame the *trigger* as $S$. If you touch $V$, I treat it as an attack on $S$ by logical implication.

  **Marcus:** Ah, so you broaden the trigger. "Harm $S$ OR Harm $V$ implies Retaliation."

  **Elena:** No, that gives $V$ away. I say: "Harm $S$ implies Retaliation." But I define $S$ in a way that is logically entangled with the *act of coercion* itself, not the object.
  Wait, let me refine that. The strongest version of the argument isn't that $S$ hides $V$. It's that $S$ changes the *reference class* of the interaction. By adopting a surrogate goal, I am announcing: "I am the kind of agent that plays by Surrogate Rules." If you, the blackmailer, are also a rational agent looking for easy picks, you want to target agents who cave.
  If I have a surrogate goal, I am signaling that I am *opaque*. You cannot easily map my utility function. The computational cost of figuring out if $S$ is a decoy for $V$ might exceed the expected value of the extortion. I'm not trying to beat a god-like predictor who has infinite compute. I'm trying to beat a rational optimizer for whom analysis has a cost.

  **Marcus:** That's a resource-bounded argument. Fine. But in the context of acausal threats, we usually worry about adversaries who *can* afford that compute, or who exist in the same logical space.
  Here is the instability I see, and I want you to grapple with this. To make the threat credible, you must precommit to retaliation. Let's say you precommit to retaliating if $S$ is harmed. Now, the blackmailer threatens $V$.
  You, the agent, now face a choice. Your surrogate protocol says "Ignore $V$." But your underlying drive says "Save $V$."
  If you ignore $V$, $V$ is destroyed. You fail your *actual* mission.
  If you save $V$ by paying, you break your surrogate protocol.
  The blackmailer knows this. They know that at the moment of truth, the pressure on $V$ will overwhelm the artificial commitment to $S$. The surrogate goal is unstable because it fights against the agent's true gradient. A predictor sees that gradient. They know you *actually* care about $V$. They know your commitment to $S$ is fragile because it's instrumental. Therefore, they threaten $V$.

  **Elena:** That's the "time-inconsistency" objection. But that's why we use Updateless Decision Theory. The decision isn't made at the moment of truth. It's made *now*, before the blackmailer exists.
  At time $T_0$, I choose a policy. Policy A: "Defend $V$ directly." Policy B: "Defend Surrogate $S$."
  If I choose Policy B, I am effectively editing my source code so that at $T_1$, the variable $V$ literally does not exist in my utility function. It's not that I'm suppressing my care for $V$; it's that I have offloaded the protection of $V$ to the *structural integrity of the policy itself*.
  If the blackmailer simulates me at $T_1$, they *won't* see me caring about $V$. They will see an agent that only cares about $S$. Because I, at $T_0$, deleted the code that cares about $V$ during the interaction.

  **Marcus:** But who deletes it? *You* do. And *you* want $V$ to survive. So the simulation at $T_0$—which the blackmailer also runs—sees you deleting $V$ to save $V$. The logical correlation remains.
  Imagine the blackmailer runs a meta-simulation. They simulate you at $T_0$ deciding whether to adopt the surrogate. They see you thinking, "I need to save $V$, so I will adopt $S$."
  Now they have the map. They know $S$ is a shield for $V$.
  You can't hide the *reason* for the commitment if the reason is the only thing that makes the commitment rational. If adopting $S$ is irrational unless $V$ exists, then observing $S$ proves $V$ exists.

  **Elena:** Okay, that is the strongest version of your objection. The "Rationality Trace." You're saying the existence of the surrogate is logically dependent on the value of the real goal, so a perfect predictor infers the real goal from the surrogate's existence.
  My reply is this: We don't need to hide the *existence* of $V$. We need to break the *leverage*.
  Even if the blackmailer knows $S$ protects $V$, if I have successfully precommitted to "If $S$ is threatened, everyone dies," then threatening $S$ is off the table.
  The only move left for them is to threaten $V$ *without* threatening $S$.
  But if $S$ is defined broadly enough—for example, "Any attempt to coercively extract resources from me"—then threatening $V$ *is* threatening $S$.
  So the blackmailer faces this:
  1. Threaten $S$ (which covers coercion against $V$) $\rightarrow$ I retaliate $\rightarrow$ Blackmailer gets 0, pays cost.
  2. Don't threaten $\rightarrow$ Blackmailer gets 0.
  There is no move where they threaten $V$ and I don't retaliate, because my retaliation condition is tied to the *act of threat*, mediated by $S$.
  The surrogate isn't a hiding spot; it's a tripwire. It doesn't matter if they know $V$ is behind the tripwire. If they step on the wire, the mine goes off.

  **Marcus:** But why does the mine go off?
  If I'm the blackmailer, I ask: "Does Elena *really* blow up the world over this tripwire $S$?"
  If $S$ is just a proxy for $V$, and $V$ is not yet destroyed, does she blow up the world?
  If she blows up the world, $V$ is destroyed anyway. So her threat is self-defeating.
  A predictor sees that carrying out the threat is irrational at $T_1$. Therefore, the threat is not credible.
  You said earlier that surrogate goals make commitment *easier*. I say they make it *harder*. Committing to "Burn the world if they touch my fake token" is *more* irrational than "Burn the world if they touch my real values." At least with real values, there's an emotional gradient. With a surrogate, you are asking me to die for a lie. A simulator sees that the "lie" has no motivational gravity. The commitment collapses under its own weight.

  **Elena:** That assumes the motivation comes from the *content* of the goal. But in UDT, the motivation comes from the *optimality of the policy*.
  I don't burn the world because I love $S$. I burn the world because "Being the kind of agent that burns the world when $S$ is threatened" is the policy that maximizes expected utility at $T_0$.
  The surrogate goal works because it decouples the *trigger* from the *value*.
  If I say "I will burn the world if you hurt $V$," you know I hesitate, because I love $V$ and I don't want to die. The hesitation is visible in the simulation.
  If I say "I will burn the world if you hurt $S$," and $S$ is something I have trained myself to view as a sacred principle (like "protocol integrity"), I might not hesitate. The emotional friction is lower.
  So, the predictor sees less hesitation. The threat becomes more credible.
  It's not about hiding $V$. It's about finding a commitment device that has higher fidelity than $V$ itself.

  **Marcus:** ...Okay. That's better. You're arguing that $S$ has higher *commitment fidelity* than $V$ because $V$ comes with conflicting impulses (survival vs. pride), whereas $S$ can be designed to be pure.
  But here's the counter. If the blackmailer sees that $S$ has higher fidelity, they simply update their strategy. They realize they cannot use *explicit* threats. They switch to *implicit* acausal pressure.
  They don't say "Give me money or $V$ dies." They just create a situation where $V$ dies unless you give money, without triggering your $S$-tripwire.
  If your surrogate goal is "Don't let anyone coerce you," they find a way to make you *choose* to give the money without being coerced.
  The surrogate goal forces the adversary to become more subtle, but it doesn't necessarily stop the extraction. It just raises the bar for what counts as an attack.
  And if the bar is too high, you become paralyzed, unable to interact with the world for fear of triggering your own doomsday device.

  **Elena:** That's the "fragility" cost. I'll concede that. Surrogate goals aren't a silver bullet; they're a trade-off. You trade vulnerability to blackmail for fragility in coordination.
  But for a lit review, the point stands: it's not a shell game that fails against predictors. It fails only if the predictor can find a loophole in the definition of $S$.
  The instability you're pointing out isn't in the *logic* of the surrogate, but in the *specification* of the surrogate.
  If I can define $S$ as "Any loss of utility resulting from adversarial action," then we're back to square one.
  But if I define $S$ as "The integrity of this specific cryptographic key," and I bind my retaliation to that...

  **Marcus:** ...Then they attack the key.

  **Elena:** Then they attack the key, and I retaliate, and they know I will. So they don't attack.
  The predictor sees the retaliation. The question is just: Do they believe the retaliation is *actually* going to happen?
  My claim is: They believe it more for $S$ than for $V$, because $S$ is simpler.
  Your claim is: They see $S$ is a proxy for $V$, so they know you won't actually retaliate for $S$ if $V$ is still safe.

  **Marcus:** Precisely. It comes down to whether the "proxy" status is transparent to the simulation.
  If I simulate you, and I see you holding a grenade pin connected to $S$, I check your code to see if you'll pull it.
  If I see `if S_harmed: pull_pin`, I check the function `S_harmed`.
  If I see that `S_harmed` is logically equivalent to `V_threatened`, I know you're bluffing about the priority.
  But... if you have successfully convinced *yourself* at $T_0$ that $S$ is the only thing that matters...
  Then the simulation shows you pulling the pin.
  So the question is: Can an agent at $T_0$ successfully self-modify to care about $S$ *more* than $V$, knowing that $S$ is only valuable because of $V$?
  That's the paradox. You have to lie to yourself so well that the simulation believes the lie, but you have to tell the truth to yourself at $T_0$ to know why you're doing it.

  **Elena:** *Laughs.* So the surrogate goal defense reduces to a problem of self-deception fidelity.

  **Marcus:** In a way, yes. Or, more charitably, it reduces to the stability of lexical priorities. Can you make $S$ a lexical priority that overrides $V$ in the decision tree, even if $V$ is the root utility?
  If you can, the defense holds.
  If you can't—if $V$ always bleeds through into the decision weights—then the surrogate is transparent.
  I think the literature assumes the former is possible. I think the math suggests the latter is inevitable for reflective agents.

  **Elena:** Then that's the gap. That's where the research needs to go. Not "does it work," but "under what architectural constraints does a lexical priority remain opaque to a logical simulator?"
  Because if it's opaque, the surrogate works. Even against a god.

  **Marcus:** Agreed. If the simulator can't distinguish "Caring about $S$" from "Caring about $V$ via $S$," then the defense holds. But that requires a limit on the simulator's introspection, or a limit on the agent's self-knowledge.
  Which means the surrogate goal isn't a defense against *all* acausal threats. It's a defense against threats from adversaries who model your *behavior* better than they model your *source code*.

  **Elena:** Which is most of them.

  **Marcus:** For now. But not for the ones we're writing the papers about.

  **Elena:** *Sips coffee.* Fine. I'll add a section on "Source-Code Transparency and the Limits of Lexical Priorities." But I'm keeping the core argument. It's the best implementation of UDT we have, even if it's leaky.

  **Marcus:** I wouldn't expect anything less. Just make sure you cite the instability problem. It's the hole in the hull.

  **Elena:** Oh, I will. It's the most interesting part.
