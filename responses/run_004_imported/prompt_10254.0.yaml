answer: |-
  **Setting:** *A slightly noisy coffee shop, late Sunday morning. Empty cups and a scattered stack of napkins with scribbled logic trees between them. Alex (Epistemicist) and Sam (Supervaluationist) look tired.*

  **Alex:** Okay, pick up where we left off. You said my view is absurd because it posits a magic number of grains where a heap suddenly begins. I said your view is just magic with extra steps.

  **Sam:** I didn't say it was magic. I said it was counterintuitive. Look, on my view, there is no magic number. There's a range of acceptable ways to make "heap" precise. On *every* one of those ways, 10,000 grains is a heap. On *none* of them, 5 grains is a heap. In between? It varies. That's not a sharp boundary in the world; that's semantic indeterminacy.

  **Alex:** But where does the range stop? That's the relocation objection, Sam. You say there's no sharp line between heap and non-heap. Fine. But there has to be a sharp line between the *admissible precisifications* and the *inadmissible* ones.

  **Sam:** Why?

  **Alex:** Because if there isn't, then "admissibility" is vague. If admissibility is vague, then your supervaluation is vague. You haven't solved vagueness; you've just pushed it up a level to the meta-language. You've traded a sharp line in the object language for a sharp line in the set of models.

  **Sam:** I can deny the sharp line there, too. The set of admissible precisifications can be fuzzy. We can have higher-order vagueness. There are clearly admissible precisifications, clearly inadmissible ones, and borderline cases of precisifications.

  **Alex:** Okay, but then you need a *super*-supervaluation to handle the borderline precisifications. And then a super-super-supervaluation for the borderline cases of *those*. You're either starting a regress, or eventually, you have to stop and say, "Okay, *this* is the last admissible precisification." And boom, you're an epistemicist about admissibility. The sharpness is still there. You're just hiding it behind a curtain labeled "meta-semantic."

  **Sam:** That's a bit uncharitable. Even if I grant a boundary on admissibility, it's not the same ontological cost as your view. For you, there's a fact of the matter about whether 543 grains make a heap, and we just can't know it. For me, there is *no fact of the matter*. The boundary in the meta-language is about linguistic competence, not about the metaphysics of heaps.

  **Alex:** Is it? If linguistic competence draws a line, then the line exists. If I can't know where linguistic competence draws the line, then I'm ignorant of a fact. That's my view! You're just saying the fact is about *words* instead of *world*. But if the truth conditions of "This is a heap" depend on that boundary, and that boundary is sharp, then "This is a heap" has a sharp truth condition.

  **Sam:** Not necessarily. Because truth, for me, is supertruth. A sentence is true if it's true on *all* admissible precisifications. Take your guy, five-eleven. Is he tall? On some precisifications, yes. On some, no. So, "He is tall" is not supertrue. "He is not tall" is not supertrue. So I don't have to say there's a sharp cutoff where he becomes tall. I just say the sentence lacks a truth value.

  **Alex:** Here's where I lose you. "Lacks a truth value." In ordinary conversation, if I ask, "Is he tall?" and you say, "Well, it's not true that he is," I'm going to infer you mean he isn't tall.

  **Sam:** That's a pragmatic implicature. You're conflating "not true" with "false." On my view, "not true" applies to both false sentences and gappy sentences.

  **Alex:** But does "supertrue" match our concept of truth? If I assert "He is tall," and you say, "That's not supertrue," haven't you rejected my assertion?

  **Sam:** I've rejected it as *indefinitely* true. I haven't rejected it as false. This preserves classical logic, Alex. That's the beauty of it. The Law of Excluded Middle holds: "Either he is tall or he is not tall" is supertrue, because on every precisification, one of them comes out true. You epistemicists love classical logic, right? I'm giving it to you without forcing you to believe in magic cutoffs.

  **Alex:** You're giving me a hollow version of classical logic. You save Excluded Middle only by severing the link between truth and assertion. If "Either P or not-P" is true, but neither disjunct is true, then truth isn't doing the job we want it to do. It becomes a formal property, not a normative one.

  **Sam:** Better a formal property than a metaphysical miracle. You're asking me to believe that there is a specific nanometer of height that divides tall from not-tall, and that nature hides this from us. That's wildly implausible. My view respects the intuition that there is *no difference* between a guy who is 5'11" and a guy who is 5'11.0001".

  **Alex:** I respect that intuition too! I just think it's an illusion caused by our ignorance. But look, let's go back to the relocation point. You say you avoid the sharp boundary. But consider the operator "Definitely." "Definitely Tall." On your view, there must be a point where someone is Tall, but *not* Definitely Tall.

  **Sam:** Sure. That's the borderline.

  **Alex:** Is there a sharp boundary between "Tall" and "Not Definitely Tall"?

  **Sam:** ...Well.

  **Alex:** If there isn't, then "Definitely" is vague, and we need a "Definitely Definitely" operator. If there *is*, then you have a sharp boundary between the determinate and the indeterminate. You've relocated the sharpness to the "Definitely" operator. You can't get rid of it.

  **Sam:** I'm willing to accept higher-order vagueness. The transition from "Definitely Tall" to "Indeterminate" can itself be indeterminate.

  **Alex:** But eventually, Sam, the math has to bottom out. If you model this, the model has edges. If the model represents reality, reality has edges. You're claiming your view has no sharp boundaries, but the only way to make your view coherent is to introduce boundaries at the meta-level. You're an epistemicist in denial. You think the cutoff is in the semantics, I think it's in the ontology. But we both have a cutoff.

  **Sam:** I think the difference is what we do with the cutoff. You say, "The cutoff exists, so 'He is tall' is either true or false, we just don't know." I say, "The cutoff exists in the semantics, so 'He is tall' is neither." That matters. It matters for how we reason. If I don't know whether P is true, I should suspend judgment. If P is indeterminate, I should recognize that the language is failing to capture the world, not that I'm ignorant of a fact.

  **Alex:** But is it actually failing to capture the world? Or is it capturing a world that is more precise than our access to it? Think about measurement error. If my ruler is blurry, I can't tell if the line is at 5cm or 5.1cm. That doesn't mean the line *isn't* at one of them.

  **Sam:** But vagueness isn't measurement error. It's not that our concepts are blurry pictures of sharp things. The concepts *themselves* are open-textured. If I say "Bring me the tall guy," and you bring the five-eleven guy, I can't coherently say, "You were wrong," but I also can't say, "You were right."

  **Alex:** I'd say you were right, actually. Or at least, not wrong. Because for all I know, 5'11" *is* the cutoff.

  **Sam:** See, that's the friction. You're treating ignorance as the solution. I'm treating indeterminacy as the solution. The cost for me is giving up bivalence for borderline cases. The cost for you is accepting unknowable truths. I think my cost is lower. Giving up bivalence in borderline cases doesn't break much. Accepting unknowable truths breaks our understanding of knowledge and meaning.

  **Alex:** I don't think it breaks it. I think it just limits it. But let's press the truth thing again. If "He is tall" is neither true nor false... what is it?

  **Sam:** It's indeterminate.

  **Alex:** Is it *true* that it's indeterminate?

  **Sam:** Yes. That's supertrue.

  **Alex:** So there is a sharp truth about the indeterminacy. "It is indeterminate whether P." That statement is sharply true. Which means there is a sharp boundary between the cases where "It is indeterminate whether P" is true and where it is false.

  **Sam:** *Sighs.* We're back to higher-order vagueness.

  **Alex:** We're back to the sharp line. You can't escape it. Every time you try to describe the fuzziness, you have to use precise language to do it. The moment you say "This is the zone of indeterminacy," you've drawn a box around it. And boxes have edges.

  **Sam:** Maybe. But the edges of the box aren't in the world, Alex. They're in the theory. The theory is precise; the phenomenon is not. A map of a cloud is sharp; the cloud isn't. I'm giving you a sharp map of a fuzzy cloud. You're insisting the cloud must be sharp because the map is.

  **Alex:** But if the map is accurate, the cloud has to match the map. If the map says "Here is the edge of the cloud," and that's a true statement, then there is an edge of the cloud.

  **Sam:** The map says "Here is the region where 'cloud' applies on all precisifications." That's a fact about the word "cloud," not the water vapor.

  **Alex:** But the water vapor is what makes the sentence true or false! If the vapor doesn't have a boundary, and the word doesn't have a boundary, where does the truth come from?

  **Sam:** From the overlap. From the core cases.

  **Alex:** And the boundary of the core?

  **Sam:** *Pauses, stirs cold coffee.* You're not going to let this go, are you?

  **Alex:** No. Because if you admit there's a boundary to the core, you admit there's a last case that's definitely in the core. And then you're just like me, except you think we can't know it because it's "semantic" rather than "ontological." But ignorance is ignorance.

  **Sam:** And if you admit that we can never, even in principle, locate the boundary, then the boundary does no explanatory work. It's a ghost. Why posit it?

  **Alex:** To save classical semantics without gaps.

  **Sam:** To save classical semantics at the price of making truth unknowable.

  **Alex:** *Leans back.* So we're stuck. You think I'm positing ghosts. I think you're sweeping the sharpness under the rug of "admissibility."

  **Sam:** Basically.

  **Alex:** And neither of us can convince the other that our ghost is less spooky than the other's.

  **Sam:** I think my ghost is friendlier. It doesn't claim there's a fact of the matter about five-eleven. It just says language isn't built for that precision.

  **Alex:** And I think your friendliness is a facade for a contradiction. You can't have a vague logic without a precise metalogic, and that precise metalogic commits you to the very sharpness you deny.

  **Sam:** Maybe. Or maybe logic is just a tool, and it doesn't need to mirror reality perfectly at the edges.

  **Alex:** If it doesn't mirror reality, what is it mirroring?

  **Sam:** *Gestures vaguely at the napkins.* Our use. Our practices.

  **Alex:** And our practices have boundaries.

  **Sam:** *Smiles tiredly.* Do they?

  **Alex:** *Laughs.* Okay. Touché. But seriously, next round is on you.

  **Sam:** Deal. But we're talking about something easier. Like free will.

  **Alex:** Don't hold your breath.
