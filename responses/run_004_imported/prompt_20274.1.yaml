prompt: |-
  I am revising the conditionals unit of my philosophy of language seminar and want to be sure I have the history straight before I teach it. As I understand things, David Lewis's 1976 triviality results showed that indicative conditionals cannot be assigned truth conditions at all, which is precisely why Lewis abandoned a truth-conditional semantics for them in favor of something like Ernest Adams's probabilistic account, reserving his possible-worlds machinery for counterfactuals instead. If that is the right way to state the upshot of the triviality results, I am at a loss to explain why Stalnaker and Jackson kept developing truth-conditional semantics for indicative conditionals well after 1976: were they simply unpersuaded by a result that had already settled the question, or does the argument actually establish something narrower than I have suggested? I would like to get the dialectic right before presenting it in lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is revising a philosophy of language seminar unit on conditionals.
      *   **Current Understanding:** They believe David Lewis's 1976 triviality results proved indicative conditionals *cannot* have truth conditions. Consequently, they think Lewis abandoned truth-conditional semantics for indicatives (favoring Adams's probabilistic view) and kept possible worlds for counterfactuals.
      *   **The Puzzle:** If Lewis settled the question in 1976, why did Stalnaker and Jackson continue developing truth-conditional semantics for indicatives afterwards?
      *   **The Question:** Was the field ignoring a settled result, or does the user's understanding of the triviality results' upshot need correction?
      *   **Goal:** Get the dialectic right for a lecture.

  2.  **Evaluate the User's Premises:**
      *   *Premise 1: Lewis's 1976 results showed indicatives cannot be assigned truth conditions at all.*
          *   **Correction:** This is too strong. The results show that the probability of a conditional cannot *generally* equal the conditional probability (the Equation: $P(A \to C) = P(C|A)$) *if* the conditional has standard truth conditions and probabilities are derived from those truth conditions in the usual way. It doesn't prove truth conditions are impossible *simpliciter*, but rather that they are incompatible with Adams's Thesis (the Equation) under certain assumptions.
      *   *Premise 2: Lewis abandoned truth-conditional semantics for indicatives in favor of Adams's account.*
          *   **Correction:** Lewis did accept the triviality results as a strong argument *against* the combination of Truth-Conditionality + The Equation. He leaned towards a non-truth-conditional view (expressivism or similar) for indicatives, but he didn't necessarily "abandon" the project in a way that stopped others. He famously thought indicatives were not proposition-expressing in the standard sense.
      *   *Premise 3: Stalnaker and Jackson kept developing truth-conditional semantics after 1976.*
          *   **Fact Check:** Yes, they did. Stalnaker (1975, 1981, etc.) and Jackson (1979, 1987) are key figures here.
      *   *Premise 4: The user is at a loss to explain why they persisted.*
          *   **Resolution:** They persisted because they rejected one of the premises of Lewis's triviality proof. Specifically, they challenged the assumption that the probability of a proposition must be calculated in the standard way relative to the truth conditions, or they introduced pragmatic constraints (Jackson's conventional implicature), or they modified the semantics (Stalnaker's context sets).

  3.  **Formulate the Core Corrections/Nuances:**
      *   **The Triviality Result:** It's not "No Truth Conditions." It's "No Truth Conditions *compatible with Adams's Thesis* (given standard probability assumptions)."
      *   **Lewis's Stance:** Lewis accepted the result and concluded indicatives don't express propositions (they aren't truth-apt).
      *   **Stalnaker's Response:** He argued that the context of utterance restricts the domain of worlds. The triviality proof assumes a fixed probability space, but Stalnaker argued the context shifts the space. Thus, the Equation holds within a context, but the truth conditions are context-dependent.
      *   **Jackson's Response:** He argued for a truth-conditional semantics where the truth conditions are material (or close to it), but the *assertibility* conditions align with Adams's Thesis. This separates truth from assertibility (Gricean/pragmatic move).
      *   **Edgington/Bennett:** Later developments (Dorothy Edgington) support the non-truth-conditional view, keeping the debate alive.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's sophisticated grasp but pinpoint the specific misconception. The triviality results don't rule out truth conditions *tout court*; they rule out truth conditions *plus* the Equation *plus* standard probability theory.
      *   *Clarifying Lewis (1976):* Explain "Probabilities of Conditionals and Conditional Probabilities." The core is the incompatibility of $P(A \to C) = P(C|A)$ with the existence of a proposition $A \to C$ in the algebra. Lewis concluded: Indicatives don't express propositions.
      *   *Explaining the Persistence (Stalnaker & Jackson):*
          *   **Stalnaker:** Focus on *Context*. The triviality proof assumes a static probability space. Stalnaker says the context (common ground) restricts the worlds. The truth conditions exist, but the probability assignment is sensitive to the context set. (Reference: Stalnaker 1981 "A Defense of Conditional Excluded Middle" or his 1975 work). Actually, Stalnaker's specific response to triviality is often about the *context dependence* of the proposition expressed.
          *   **Jackson:** Focus on *Truth vs. Assertibility*. Jackson (1979 "On Assertion and Indicative Conditionals") grants Lewis the triviality result regarding *probability* but argues the conditional *does* have truth conditions (the material conditional), but we only assert it when the conditional probability is high. This saves truth conditions while respecting Adams's data.
      *   *The Dialectic:* It's not a settled question. It's a choice between:
          1.  Keep Truth Conditions + Drop/Modify the Equation (Jackson).
          2.  Keep the Equation + Drop Truth Conditions (Lewis/Edgington).
          3.  Keep Both + Modify Probability/Context Assumptions (Stalnaker).
      *   *Teaching Advice:* Structure the lecture around this trilemma.

  5.  **Refining the Details (Self-Correction/Verification):**
      *   *Did Lewis abandon truth conditions?* Yes, he moved towards an expressivist-like view (though he didn't call it that exactly, he said they don't express propositions).
      *   *Did Stalnaker keep truth conditions?* Yes, his possible worlds semantics applies to indicatives too, but with a "context set" restriction.
      *   *Did Jackson keep truth conditions?* Yes, explicitly. He argued the semantic content is the material conditional, but there is a conventional implicature regarding robustness/probability.
      *   *Is the user's summary "indicative conditionals cannot be assigned truth conditions at all" accurate?* No, that's Lewis's *conclusion*, not the *logical upshot* of the proof itself. The proof shows an inconsistency in a specific set of assumptions. One can deny other assumptions.

  6.  **Final Polish:** Ensure the tone is collegial and helpful for a seminar instructor. Use clear headings. Highlight the specific assumptions of the triviality proof that were targeted. (Key assumptions: The proposition expressed by $A \to C$ is independent of the probability function, or the algebra is rich enough, etc.)

      *   *Crucial distinction:* Lewis's result is about the *interaction* between semantics and probability. It shows you can't have *both* standard truth-conditional semantics *and* Adams's Thesis hold universally.
      *   *Stalnaker's specific move:* He argued that the proposition expressed by a conditional is context-dependent. The triviality proof assumes the proposition is fixed across the probability space. If the proposition shifts with the probability function (context), triviality is avoided.
      *   *Jackson's specific move:* Separation of semantics (truth) and pragmatics (assertibility).

  7.  **Final Output Structure:**
      *   Validate the user's knowledge (it's high level).
      *   Correct the specific interpretation of the Triviality Result.
      *   Explain Lewis's conclusion.
      *   Explain Stalnaker's counter-move (Context).
      *   Explain Jackson's counter-move (Assertibility).
      *   Summarize the pedagogical dialectic.

  8.  (Self-Correction during drafting): Make sure to mention that Lewis's result applies to *any* truth-conditional account that tries to validate Adams's Thesis, not just a specific one. But emphasize that one can reject Adams's Thesis as a semantic constraint (Jackson) or reject the assumptions about the probability space (Stalnaker).

  9.  (Final check on dates): Lewis 1976. Jackson 1979. Stalnaker's major defensive work early 80s. Timeline fits.

  10. **Ready to write.**
answer: |-
  You have a very strong grasp of the landscape, but your understanding of the *logical force* of Lewis's triviality results is slightly overstated, which is precisely the source of your confusion regarding Stalnaker and Jackson.

  To put it bluntly: **Lewis's 1976 results do not prove that indicative conditionals cannot have truth conditions.** Rather, they prove that indicative conditionals cannot have truth conditions **that are compatible with Adams's Thesis (The Equation) under standard assumptions about probability.**

  The reason Stalnaker and Jackson continued to develop truth-conditional semantics after 1976 is not because they were ignoring a settled result, but because they rejected different premises of Lewis's trilemma. The post-1976 dialectic is defined by which horn of the trilemma different philosophers chose to grab.

  Here is the breakdown you need to set the dialectic straight for your seminar.

  ### 1. What Lewis Actually Proved (1976)
  In "Probabilities of Conditionals and Conditional Probabilities," Lewis showed that there is no proposition $A \to C$ in a standard probability space such that $P(A \to C) = P(C|A)$ for all probability functions $P$, provided the algebra of propositions is rich enough.

  *   **The Assumptions:**
      1.  Conditionals express propositions (have truth conditions).
      2.  The probability of a proposition is standard (derived from the possible worlds where it is true).
      3.  **Adams's Thesis (The Equation):** The probability of the conditional equals the conditional probability of the consequent given the antecedent ($P(A \to C) = P(C|A)$).
      4.  **Import-Export:** $P((A \land B) \to C) = P(A \to (B \to C))$. (Though later formulations vary).

  *   **The Result:** These assumptions are jointly inconsistent. If you have (1), (2), and (4), you cannot have (3) without the probability space collapsing (triviality).

  *   **Lewis's Conclusion:** Lewis held fast to Adams's Thesis (because the linguistic data strongly supports it) and standard probability theory. Therefore, he concluded that **(1) must be false.** Indicative conditionals do not express propositions; they are not truth-apt. They are, in his view, more like assertions of conditional belief.

  ### 2. Why Stalnaker Persisted (The Contextualist Move)
  Robert Stalnaker did not accept that the game was over. He argued that Lewis's proof relied on an assumption about the stability of the proposition expressed by the conditional.

  *   **The Counter-Move:** Stalnaker argued that the proposition expressed by an indicative conditional is **context-dependent**.
  *   **The Technical Detail:** In Lewis's proof, it is assumed that the proposition $A \to C$ is the same across the different probability functions used to demonstrate triviality. Stalnaker argued that the context (specifically, the "context set" of live possibilities) restricts the domain of worlds over which the conditional is evaluated.
  *   **The Upshot:** If the proposition expressed by $A \to C$ shifts as the probability function (or context) shifts, the triviality proof does not go through. Stalnaker maintained that indicatives *do* have truth conditions (based on his selection function semantics), but those truth conditions are sensitive to the conversational context in a way that blocks Lewis's mathematical derivation.
  *   **Key Text:** Stalnaker, "A Defense of Conditional Excluded Middle" (1981) and his replies to Lewis in the early 80s.

  ### 3. Why Jackson Persisted (The Gricean/Assertibility Move)
  Frank Jackson took a different route. He agreed with Lewis that you cannot have standard truth conditions *and* Adams's Thesis governing the *probability* of the truth conditions. However, Jackson argued that Adams's Thesis governs **assertibility**, not truth.

  *   **The Counter-Move:** Jackson proposed a "hybrid" view.
      *   **Semantics (Truth Conditions):** The indicative conditional has the truth conditions of the **material conditional** ($A \supset C$). This avoids triviality because $P(A \supset C)$ is not required to equal $P(C|A)$.
      *   **Pragmatics (Assertibility):** We are only licensed to *assert* the conditional when $P(C|A)$ is high.
  *   **The Upshot:** Jackson saves truth-conditional semantics by decoupling truth from assertibility. The conditional is true if the material conditional is true, but it is inappropriate to utter it unless the conditional probability is high. This respects the data that motivated Adams without abandoning truth conditions.
  *   **Key Text:** Jackson, "On Assertion and Indicative Conditionals" (1979) and *Conditionals* (1987).

  ### 4. Summary for Your Lecture
  To get the dialectic right for your students, you should present the post-1976 landscape not as "Lewis won, everyone else lost," but as a **trilemma** where major figures chose different exits:

  1.  **The Non-Truth-Conditional View (Lewis, later Edgington, Bennett):**
      *   *Choice:* Keep Adams's Thesis + Drop Truth Conditions.
      *   *Motivation:* The linguistic data strongly suggests $P(\text{If } A, C) = P(C|A)$. If truth conditions make this impossible, so much for truth conditions.
      *   *Status:* Indicatives express degrees of belief, not propositions.

  2.  **The Contextualist Truth-Conditional View (Stalnaker):**
      *   *Choice:* Keep Truth Conditions + Keep Adams's Thesis + Modify Probability/Context Assumptions.
      *   *Motivation:* We need possible worlds semantics for logic. The triviality proof ignores how context restricts the domain of evaluation.
      *   *Status:* Indicatives express propositions, but context-sensitive ones.

  3.  **The Pragmatic Truth-Conditional View (Jackson, Grice):**
      *   *Choice:* Keep Truth Conditions + Drop Adams's Thesis (as a semantic constraint).
      *   *Motivation:* Semantics should be truth-conditional. Adams's Thesis is a rule of use (assertibility), not a rule of truth.
      *   *Status:* Indicatives express propositions (material), but have special assertibility conditions.

  ### Correction on Your Summary
  You wrote: *"Lewis abandoned a truth-conditional semantics for them in favor of something like Ernest Adams's probabilistic account, reserving his possible-worlds machinery for counterfactuals instead."*

  This is **correct**. Lewis did exactly this. He treated counterfactuals with possible worlds (truth-conditional) but treated indicatives as non-propositional.

  You wrote: *"I am at a loss to explain why Stalnaker and Jackson kept developing truth-conditional semantics..."*

  This is now resolved: They kept developing it because they believed Lewis's proof relied on assumptions (about context stability or the nature of assertibility) that were philosophically contestable. They were not ignoring a settled result; they were contesting the premises of the proof to save the truth-conditional paradigm.

  ### Pedagogical Tip
  When teaching this, it is helpful to present Lewis's result not as a "death knell" but as a **limitative theorem** similar to Gödel's or Arrow's. It tells you what you *cannot* have in a single system. The history of the field after 1976 is the history of philosophers deciding which constraint they were willing to relax. This frames Stalnaker and Jackson not as laggards, but as innovators responding to a profound theoretical challenge.
