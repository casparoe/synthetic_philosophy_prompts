answer: |-
  **MEMORANDUM**

  **TO:** EA Club Discretionary Giving Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on 2023 Discretionary Fund Allocation

  ### **Executive Summary**

  After reviewing the proposals for this year's $3,000 discretionary pool, I am recommending we allocate **100% of the funds to the GiveWell Top Charity Fund (specifically earmarked for the Against Malaria Foundation).**

  I know this does not resolve the philosophical tension driving our deadlock. This memo is not an attempt to bypass that tension with a standard Expected Value (EV) calculation. In fact, my recommendation rests on the premise that *no* standard EV calculation is reliable here due to the problem of **consequentialist cluelessness**.

  However, I argue that choosing the GiveWell option is the most *principled* response to cluelessness available to us, whereas the AI safety option, while intellectually ambitious, relies on a fragile epistemic framework that our committee structure cannot support. Below, I outline the case for the AI safety allocation (which I am rejecting), explain why the "measurability" of bednets is not a magic bullet but is still superior under uncertainty, and define why this is a principled stance rather than a comfort heuristic.

  ---

  ### **1. The Strongest Case for the AI Safety Allocation (The Rejected Option)**

  To be clear: the argument for the small AI safety research org is not that we *know* it will work. It is that **cluelessness is universal, so we should maximize leverage.**

  If we accept the Lenman-style objection that we cannot foresee the long-term downstream consequences of *any* action (including saving lives via bednets), then the "measurability" of bednets is an illusion. We can measure lives saved *now*, but we cannot measure the value of those lives in the long run, nor the economic or demographic ripple effects (e.g., does saving these children lead to greater stability or resource strain 50 years from now?).

  If *all* long-term forecasting is subject to complex cluelessness, then the only rational variable we can control is the **magnitude of the theoretical upside.**
  *   **The Swamping Argument:** Even if we assign a tiny probability to the AI safety org's theory of change working, the value of mitigating existential risk is so astronomically high that it "swamps" the modest, near-term value of bednets.
  *   **Epistemic Humility vs. Paralysis:** Arguing that we should only fund what is measurable risks paralyzing all long-termist action. If we wait for perfect feedback loops, we will never fund anything with a long time horizon. The AI safety proponent on our committee is essentially arguing that we should take the "best guess" on the highest stakes problem, rather than retreating to problems with lower stakes just because the metrics are cleaner.

  This is a coherent position. It treats cluelessness as a background constant and argues we should maximize EV despite it.

  ### **2. Why I Am Not Endorsing That View**

  While the "swamping" argument is logically valid *if* you accept the inputs, it fails to account for the *structure* of our cluelessness. This is where Greaves's distinction between **simple** and **complex** cluelessness becomes actionable.

  **A. Symmetry of Ignorance (Simple vs. Complex)**
  For the bednet allocation, the unforeseeable long-term consequences (economic shifts, population changes) are likely what Greaves calls **simple cluelessness**. We have no specific reason to think the unforeseeable downstream effects of saving a life in 2024 will be net negative rather than net positive. They are chaotic, but likely symmetric. We can reasonably "bracket" them as a wash.

  For the AI safety allocation, the cluelessness is **complex**. We have specific reasons to think the unforeseeable effects might tilt heavily one way (preventing doom), but we also have specific reasons to worry about unknown unknowns (e.g., does this research accelerate capabilities? Does it create a false sense of security?). Because the intervention is *itself* about managing unknown future dynamics, the uncertainty is not symmetric. We cannot bracket the unknowns; they are the entire point of the intervention.

  **B. Feedback Loops as Epistemic Tools**
  The argument for bednets isn't just that the metrics are "comforting." It's that measurability allows for ** Bayesian updating.**
  *   If we fund bednets, we get data. We learn about cost-effectiveness, delivery bottlenecks, and real-world friction. This reduces our cluelessness for the *next* $3,000.
  *   If we fund the AI safety org, the feedback loop is likely decades long or non-existent. We won't know if we were right until it's too late to adjust.

  As a committee stewarding *student dues*, we have an obligation to prioritize interventions where our collective ignorance can be reduced over time. Funding the AI org is a "one-shot" bet under radical uncertainty; funding bednets is a data-gathering exercise that improves our future decision-making.

  ### **3. Is "Fund the Measurable Thing" Principled or a Heuristic?**

  This is the crux of our disagreement. One camp argues that favoring measurability is a bias—a "comforting heuristic" that ignores the math.

  I argue it is **principled epistemic risk management.**

  Consequentialism requires us to maximize the good. But to do that, we need an epistemic access point to the good. When we face complex cluelessness (where we have reason to think effects tilt one way but can't quantify it), our EV calculations are not just uncertain; they are **garbage inputs.** Plugging "tiny probability × infinite value" into a spreadsheet creates a false sense of precision.

  Choosing the measurable option is not saying "only the measurable matters." It is saying: **"In a world of radical uncertainty, robustness is a proxy for value."**

  *   **The Bednets Case:** We know with high confidence that malaria is bad and preventing it is good. The *direction* of value is secure, even if the *magnitude* of long-term ripple effects is clueless.
  *   **The AI Safety Case:** We are unsure if the research is good, unsure if it will be implemented, and unsure if it prevents risk. The *direction* of value is itself part of the cluelessness.

  Therefore, favoring the GiveWell option is not ignoring the Lenman objection; it is conceding to it. It admits that we cannot see the future, and therefore we should anchor our moral worth in the nearest visible point of value, rather than speculating on the distant horizon where our vision fails.

  ### **4. Recommendation and Motion**

  We are a student organization managing a relatively small pool of capital ($3,000). While the AI safety argument holds for individual donors with high risk tolerance, our committee structure demands a higher burden of justification for high-variance bets.

  Given that:
  1.  Both options suffer from long-term cluelessness (Lenman);
  2.  The bednet option's cluelessness is more likely symmetric/simple (Greaves), whereas the AI option's is complex/asymmetric;
  3.  The bednet option offers feedback loops that reduce future cluelessness;

  **I move that we allocate 100% of the 2023 Discretionary Fund to the GiveWell Top Charity Fund.**

  This is not a claim that bednets are "better" in an absolute sense. It is a claim that they are the only option we can defend as *rationally choosable* given our epistemic limitations.

  I look forward to discussing this at Tuesday's meeting.
