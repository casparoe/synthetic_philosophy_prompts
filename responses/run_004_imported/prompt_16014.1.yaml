      *   **Honoree:** Federal appellate judge, retiring after ~30 years.
      *   **Audience:** Split 50/50. Half legal professionals (judges, clerks, lawyers), half family (who know her as "Grandma").
      *   **Honoree's Philosophy:** Hardcore Textualist. Hates speculation about "intent," "purpose," or "motives." Wants facts/actions only. Threatens to heckle if people speculate on her "true meaning."
      *   **The Challenge:** A toast is inherently purposivist (looking for meaning/legacy), but it must respect her textualist constraints.
      *   **Requirements:**
          *   Length: 4-5 minutes read aloud (approx. 600-750 words).
          *   Tone: Love/affection, not a CLE lecture.
          *   Specific Content: One solid textualism-vs-purposivism joke that works for both groups.
          *   Constraint: Must adhere to her interpretive commitments (stick to the "text" of her life, avoid speculating on "intent").

  2.  **Deconstruct the "Textualist Toast":**
      *   *Core Concept:* Treat her life like a statute. Don't interpret the *spirit*, read the *words*.
      *   *The Joke:* Needs to bridge the gap. For lawyers, it's about statutory construction. For family, it's about taking things literally vs. looking for the hidden meaning.
      *   *The Structure:*
          1.  **Introduction:** Acknowledge the split audience and the constraint (the "rule of construction" for the evening).
          2.  **The "Text" of Her Career:** Specific, concrete actions (opinions written, hours worked, coffee consumed). No "she cared about justice," but "she showed up."
          3.  **The "Text" of Her Personal Life:** Connect the judge to the grandma. Same literalism applied to family.
          4.  **The Joke:** The pivot point.
          5.  **Conclusion:** The "holding" of the evening (we love her).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start by addressing the elephant in the room. She's a textualist. I need to state the ground rules.
          *   *Idea:* "Judge X told me no legislative history."
          *   *Refinement:* Make it a ground rule for the speech. "Plain meaning only."

      *   **The Legal Side (for the lawyers):** Mention the work without getting bogged down in case law.
          *   *Details:* 30 years. Thousands of opinions. The red pen. The late nights.
          *   *Textualist angle:* We don't need to ask *why* she worked hard. The record shows she *did*.

      *   **The Family Side (for the relatives):** Connect the judicial rigor to family life.
          *   *Idea:* She treats grandkids like litigants? No, too cold.
          *   *Idea:* She takes promises literally. If she said she'd be there, she was there.
          *   *Connection:* Consistency. The "text" of her character is consistent across both rooms.

      *   **The Joke (Textualism vs. Purposivism):**
          *   *Setup:* How do we interpret her legacy?
          *   *Punchline:* A purposivist would say she wanted to make the world better. A textualist says she just wanted to finish the docket before dinner.
          *   *Better Joke:* Relate it to something universal. "I asked her what she wanted for retirement."
          *   *Drafting the Joke:* "If I were a purposivist, I'd stand here and tell you that her life's work was driven by a deep, burning desire to shape the moral arc of the universe. But Judge [Name] would cut me off there. She'd say, 'Don't tell me what I wanted. Read what I wrote.' So, I looked at the text. And the text says she really likes clear writing, hates semicolons, and never missed a grandkid's birthday unless there was a scheduled oral argument."
          *   *Refining for the prompt:* The prompt asks for *one* real joke that lands for both. Let's try the "Legislative History" angle but applied to a family context.
          *   *Selected Joke Concept:* Asking her what she wants for a gift/retirement.
          *   *Draft:* "I asked Judge [Name] what she wanted for retirement. A purposivist would look at her tired eyes and say, 'She wants rest.' A textualist reads her email signature: 'Sent from my iPad, 11:45 PM.' The text is clear: She wants more work. But we're overriding that clause."

      *   **The "Love" Aspect:** It can't be cold. It needs warmth.
          *   *Focus:* Reliability. In a world of ambiguity, she was clear. That is a form of love.
          *   *Closing:* The "Holding." We hold that she is loved.

  4.  **Review and Refine (Self-Correction):**
      *   *Check Length:* 600-750 words is about 4-5 minutes at a moderate pace.
      *   *Check Tone:* Is it too dry? Need to add more warmth to the family section.
      *   *Check Constraint:* Did I speculate on her motives? I need to be careful. Instead of saying "She loved justice," say "She ruled for the underdog." Actually, even that is interpretive. Better: "She read the briefs." "She listened."
      *   *The "Heckle" Threat:* Acknowledge this playfully.
      *   *The Joke:* Make sure the family gets it. Explain "text" as "what actually happened" vs "what people think you meant."

  5.  **Final Polish:**
      *   Add placeholders for [Judge's Name].
      *   Ensure the transition between legal and family is smooth.
      *   Make sure the ending feels like a toast (raise a glass).

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally violate her rule while talking about her rule. I must explicitly state that I am sticking to the "four corners" of her life.

      *Revised Joke Idea:* Let's use the "Grandma who works a lot" line from the prompt.
      *Joke:* "To the family, she's Grandma. To us, she's Judge. But the text is the same. If she said she'd be at the soccer game, she was there. If she said she'd issue an opinion by Friday, it was filed by Thursday. The only difference is the font."

