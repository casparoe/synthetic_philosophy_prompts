answer: |-
  Good evening. For those who don't know me, I clerked for Judge [Name] immediately after law school. For those who *do* know me: yes, I am aware she is sitting in the front row. And yes, I am aware she has a red pen in her hand.

  I have been instructed that this toast must adhere to specific canons of construction. Specifically, the Honoree's canons. Judge [Name] is a textualist. She does not care about my "intent" in giving this speech. She does not care about the "spirit" of her career. She cares about the plain meaning of the words on the page.

  So, I will not stand here and speculate about her "true motives." I will not tell you that she "sought justice" or "championed the little guy," because I cannot see inside her head. I can only read the record.

  And the record is voluminous.

  Over thirty years, the text shows she wrote over four thousand opinions. She arrived at chambers at 7:00 AM. She left when the work was done. She corrected our citations. She banned the use of the word "obviously" in drafts, because, as she once told me, "If it's obvious, you don't need to write it. If you're writing it, it isn't obvious."

  To the lawyers in the room, this is a legacy of intellectual rigor. But to the family in the room—the half of you who know her as "Grandma who works a lot"—I want to point out that the text is consistent across both venues.

  In this courtroom of life, Judge [Name] applies the same rules of construction at home that she does on the bench. She is not a judge who looks for hidden meanings. If she tells you she will be at your soccer game, she is at your soccer game. If she tells you she will call on Sunday, she calls on Sunday. There is no legislative history to consult. There is no hidden purpose to decode. The promise is the promise.

  This actually brings me to the only interpretive conflict I want to raise tonight.

  There is a classic debate in the law between "Textualism" and "Purposivism." A Purposivist looks at a rule and asks, "What was the goal here? What is the vibe?" A Textualist looks at the rule and asks, "What does it say?"

  I experienced this firsthand last week. I asked Judge [Name] what she wanted for retirement. She looked at me and said, "I don't need anything. Just stop asking."

  Now, a Purposivist in this room would hear "I don't need anything" and interpret that as a cry for help. They would say, "Her *purpose* is to be modest, but her *intent* is to receive a spa gift card."

  But I know better. I am a clerk of the [Name] Court. I read the text. The text says: "Stop asking." So, I stopped asking. I bought her a gift card anyway, but I hid the receipt. I figured that was the only way to satisfy both the plain meaning and the equitable powers of the family.

  (Laughter)

  In all seriousness, living by a strict textualist code is a rare thing. Most of us go through life hoping people will read between the lines. We hope people will guess what we need, guess what we feel, guess what we mean. But Judge [Name] offers something more stable than that. She offers clarity.

  In a world that is often ambiguous, she has been a fixed point. You know where you stand with her. You know what the rule is. And you know that if you follow the rule, you will be treated fairly. That isn't just good jurisprudence. That is a very specific, very reliable form of love.

  So, I am not going to speculate on what her career "means" for the history of the law. I am going to stick to the four corners of this room.

  The evidence is clear. The record is closed. And the holding is unanimous.

  We love you, Judge [Name]. Happy retirement.

  (Raise glass)
