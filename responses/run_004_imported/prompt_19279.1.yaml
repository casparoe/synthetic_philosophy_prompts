answer: |-
  This is a incredibly difficult situation, and it makes complete sense that your sister's advice feels wrong. It feels like a dismissal of your pain, even if it's intended to be protective.

  Your friend is right: P.F. Strawson's 1962 essay *"Freedom and Resentment"* is arguably the most famous philosophical text ever written about exactly this tension. It deals with how we hold people responsible when their psychology is compromised.

  Here is the breakdown of why Strawson makes that specific distinction, how it defeats the "pessimist," and what Strawson would actually say about your dad.

  ### 1. Excuses vs. Exemptions: Why the Distinction Matters

  You are stuck on why Strawson separates "he didn't mean it" (excuse) from "he's not himself" (exemption), especially when both come from the same physical reality (brain damage).

  To Strawson, the physical cause matters less than **what the action says about the relationship.**

  *   **Excuses ("He didn't mean it"):**
      *   **The Logic:** We acknowledge the person is a normal moral agent (a "participant" in the moral community), but we argue that *this specific action* did not reflect their true attitude toward us.
      *   **Example:** Your dad steps on your foot. You feel a flash of resentment. He says, "I didn't see you there."
      *   **The Result:** Your resentment vanishes. Why? Because the demand for goodwill wasn't violated. He still respects you; he was just clumsy. The relationship is intact.
  *   **Exemptions ("He's not himself"):**
      *   **The Logic:** We argue that the person *cannot* participate in the moral community right now. They are not a valid target of reactive attitudes (resentment, gratitude, moral indignation) at all.
      *   **Example:** Your dad screams a slur at your mom. If this is an exemption, we say, "He is psychologically incapable of understanding the impact of that."
      *   **The Result:** We suspend resentment, not because the act was okay, but because **resentment no longer makes sense.** You don't get mad at a tornado for destroying your house; you don't get morally resentful at someone who lacks the capacity for moral agency.

  **Why does this distinction defeat the "Pessimist"?**

  The "Pessimist" Strawson argues against is someone who says: *"If determinism is true (if our brains are just physical machines), then no one is truly responsible, and resentment is never justified."*

  Strawson's counter-argument is that the Pessimist is looking for a **metaphysical** justification for resentment (i.e., "Do we have magical free will?"). Strawson says resentment isn't based on metaphysics; it's based on **human nature.**

  *   We are hardwired to demand goodwill from others. When we get ill will, we feel resentment.
  *   We only stop feeling resentment if we have a **natural, human reason** to do so.
  *   Those reasons are exactly the **Excuses** and **Exemptions.**

  By distinguishing the two, Strawson shows that we don't need to solve the problem of Determinism vs. Free Will to know when to be mad. We just need to know: *Is this person capable of a relationship with me?*

  If your sister says, "He's not himself," she is arguing for an **Exemption**. She is saying his capacity for goodwill is broken. If that is true, Strawson says you *shouldn't* feel resentment, because resentment requires a participant on the other end.

  **However,** your intuition that this "doesn't sit right" is philosophically robust. Here is why: **Exemptions are dangerous.**

  ### 2. Should you take the "Objective Attitude" toward your dad?

  This is the crux of your second question. Strawson defines the **Objective Attitude** as the stance we take toward someone who is exempt. We see them as something to be **managed, treated, trained, or avoided.** We do not reason with them; we do not expect moral reciprocity. We view them as a patient or a problem, not a partner.

  **Strawson would likely say taking the *full* Objective Attitude is a misreading of his view, and potentially harmful.**

  Here is the textual evidence for why:

  **A. The Objective Attitude is Inhuman**
  Strawson explicitly writes that while we *can* take the objective attitude, we cannot sustain it universally without losing our humanity. He says:
  > *"We should not have the feelings we have... if we saw all men as objects."*
  If you treat your dad purely objectively, you stop seeing him as your father. You stop hoping for his love or understanding. You become a caregiver managing a symptom. That is exhausting and emotionally deadening.

  **B. Impairment is rarely Total**
  Strawson notes that exemptions usually apply to the "psychologically abnormal." But stroke damage is often partial.
  *   Does your dad know he is hurting your mom?
  *   Does he feel remorse afterward?
  *   Can he try to use strategies to stop it?

  If the answer to any of these is "yes," he is not fully exempt. He is a **diminished participant.** Strawson allows for a modification of reactive attitudes without a total suspension. You can feel *less* resentment because you know the impulse control is damaged, but you can still maintain the demand for goodwill.

  **C. The "He's Not Himself" Trap**
  Your sister is using "he's not himself" as a shield to protect herself from pain. Strawson would warn that this risks turning your dad into an object.
  *   If you treat him as exempt, you stop holding him to *any* standard.
  *   If you stop holding him to any standard, you stop inviting him back into the moral community.
  *   Recovery (or management) often requires knowing that your actions still matter to the people you love.

  ### 3. The Strawsonian Synthesis for Your Family

  If Strawson were sitting at your kitchen table, here is the nuance he would likely offer:

  1.  **Validate the Hurt:** You are allowed to feel hurt. The words were cruel. The fact that they came from a damaged brain explains the *cause*, but it doesn't magically erase the *effect* on your mom. Strawson acknowledges that reactive attitudes are natural; you can't just logic them away.
  2.  **Modify, Don't Eliminate:** You should modify your resentment based on the medical reality (the Excuse/Exemption hybrid). Instead of thinking *"He hates Mom,"* you think *"His brain is failing to filter his impulses."* This lowers the temperature of the anger. But do not eliminate the demand for accountability.
  3.  **Avoid the Full Objective Attitude:** Do not treat him purely as a patient. Continue to speak to him as a moral agent where possible. "Dad, that hurt Mom's feelings. We know it's the stroke, but we need you to try to pause." This keeps him in the relationship.
  4.  **Protect Your Mom:** The Objective Attitude is actually *useful* for safety. When he is in a crisis mode, your mom might need to switch to the objective attitude temporarily to protect herself (manage the environment, leave the room, de-escalate) without taking the cruelty personally. But she shouldn't live there permanently.

  **Summary:**
  Strawson distinguishes Excuse and Exemption to show that our moral practices are grounded in **relationships**, not metaphysics. We don't need "free will" to know when to be mad; we just need to know if the other person is capable of caring.

  Regarding your dad: **Do not fully objectify him.** Your sister's advice leans too hard into the Exemption/Objective Attitude. Strawson would suggest a middle path: Acknowledge the impairment to mitigate your anger, but maintain the relationship demands to keep him human. You can love the person while managing the injury, without pretending the injury doesn't hurt.
