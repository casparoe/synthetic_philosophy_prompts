  4.  **Tackle the Program Music Problem:**
      *   *The Conflict:* If music is the Will itself, adding a story (thunderstorm, scaffold) drags it back down into the world of *Representation* (specific objects/events). It risks turning music into a mere illustration of phenomena, which Schopenhauer despises.
      *   *Schopenhauer's View:* He was suspicious of text-heavy or descriptive music. He preferred instrumental.
      *   *The "Fix" (Philosophical/Interpretive):*
          1.  **Subordination:** The program must be secondary. The music must still work as pure Will. If the music *needs* the story to make sense, it's bad music (in Schopenhauerian terms).
          2.  **Analogy:** The story is an *analogy* for what the music is already saying. The thunderstorm isn't the point; the *terror/striving* of the storm is the Will, which the music captures directly. The program is just a hint for the listener.
          3.  **Wagner (The Complication):** Schopenhauer loved Wagner (later in life), even though Wagner used leitmotifs and stories. Why? Because the *orchestra* carried the metaphysical weight, while the stage showed the Ideas. The music revealed the *inner truth* of the characters' wills, not just their external actions.
          4.  **Modern Consensus:** Program music doesn't break the theory *if* the music retains its structural autonomy. If it becomes mere sound effects (onomatopoeia), it fails. If it uses the storm to express *turbulence of the Will*, it succeeds.

