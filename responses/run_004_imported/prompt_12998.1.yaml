      *   *Section 4: The Practical Outcome.* The "Freeze" is the worst case. To avoid it, you must coordinate. Since you can't talk, you must rely on the correlation.
      *   *Recommendation:* Be fair. It's the only way to ensure the "algorithm" outputs "Fair" for both.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is it exactly Newcomb's Problem?* Not quite. It's more like a Prisoner's Dilemma where the probability of cooperation is correlated with your own choice.
      *   *Is the friend definitely going to round up?* He *said* that's the sensible move. If the user thinks the friend is rational (in the CDT sense), the user might think "He's going to round up, so I should too to get my share before the freeze."
