  3.  **Address the Specific Questions:**

      *   **Q1: Big Tech as "Oligarchy of Private Capital"?**
          *   *Einstein's view:* Capital concentrates, gains political power disproportionate to numbers.
          *   *Modern context:* Tech giants have market caps larger than GDPs of nations. They lobby heavily (control legislature). They own platforms of speech (control press/discourse). They shape algorithms that educate/inform (control education/cognition).
          *   *Verdict:* This is a near-perfect confirmation of his structural diagnosis, perhaps even stronger than 1949 industrial capitalism. The "means of production" are now servers/data, but the *control* mechanism is identical.

      *   **Q2: Would 20th-century failures make him drop the cure?**
          *   *Einstein's nuance:* He *already* warned about bureaucratic domination. He wasn't a Stalinist. He admired democratic socialism ideals but feared the implementation.
