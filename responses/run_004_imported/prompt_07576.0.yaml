answer: |-
  **Setting:** *A cramped faculty lounge, 5:30 PM. The whiteboard is still covered in formalizations of the "Principle of Credulity." Two empty coffee cups sit between ELENA (Anti-Reductionist, Coady/Reid leanings) and MARCUS (Local Reductionist, Elizabeth Fricker leanings). They are watching the last few seconds of a video clip on a laptop: a 16-month-old points to a novel object, an experimenter says "It's a blicket," and the toddler immediately looks at a second identical object upon request.*

  **ELENA:** *(Leaning back, tapping her pen against her chin)* There it is. That's the datum. No hesitation. No scanning the experimenter's CV. The child just… takes it in. It's the *Principle of Credulity* in its rawest form. Reid was right: it's a natural instinct, pre-rational, and without it, we'd be stuck in solipsism before we could walk.

  **MARCUS:** Or, it's a heuristic that works often enough to survive, but epistemically bankrupt. Look at the age, Elena. Sixteen months. They don't have a concept of *lying* yet. They don't have a concept of *evidence*. If the experimenter had said, "That's a banana," and handed the child a shoe, the kid would still look confused, but they wouldn't necessarily flag the *speaker* as unreliable. They'd just flag the world as weird.

  **ELENA:** But that's exactly why it supports the anti-reductionist case! If the child had to construct an inductive argument—"This adult has been right 80% of the time in the past, therefore I should accept this label"—they'd never learn a word. The induction would take longer than the learning. The trust has to be default. It's a basic source, on par with perception. You don't ask your eyes for credentials before you see the chair.

  **MARCUS:** I'm not asking for a global induction. You know I'm not. I'm a local reductionist. I don't need a proof that *Testimony-as-such* is reliable. I just need the hearer to have positive reasons in the *specific case*.

  **ELENA:** *(Gesturing at the laptop)* What positive reasons does *that* toddler have? Zero track record. Zero context.

  **MARCUS:** Exactly. Which is why I say that uptake isn't *knowledge* yet. It's acceptance. It's causal ingestion. For it to become knowledge, there needs to be monitoring. Even if it's rudimentary. Tone of voice, eye contact, consistency with other cues. If the adult was looking away, speaking sarcastically, or shaking their head while saying "blicket," would the child still accept it?

  **ELENA:** Maybe not. But that just means monitoring is a *defeater* system, not a constitutive requirement. The entitlement is there unless defeated. You're putting the burden of proof on the hearer to justify trust. I'm saying the burden is on the doubter to justify *distrust*.

  **MARCUS:** But look at the cost of that view. If you grant default entitlement to a creature that cannot distinguish between a joke, a mistake, and a lie, you're diluting the concept of entitlement until it means nothing. It's like saying a plant is "entitled" to sunlight. It's just a biological reaction.

  **ELENA:** And there's your Cartesian anxiety. You want to separate the biological from the epistemic. I'm saying the epistemic is built on the biological. But let's go deeper. Let's talk about *your* requirement for positive reasons. Where do those reasons come from?

  **MARCUS:** Observation. Inference.

  **ELENA:** Based on what background knowledge?

  **MARCUS:** Based on… prior experience.

  **ELENA:** Which was acquired how?

  **MARCUS:** *(Pauses)* Some perception. Some testimony.

  **ELENA:** There it is. The regress. You want me to justify testimony using reasons. But those reasons themselves rest on a mountain of testimony you accepted as a child. You know that adults are generally reliable because your parents told you things that turned out to be true. But you only knew they turned out to be true because… they told you, or someone else told you.

  **MARCUS:** Not entirely. I can check if the stove is hot without being told.

  **ELENA:** Sure, isolated cases. But your entire framework of what counts as a "reason," what counts as a "reliable indicator," what counts as "truth"? That's socially transmitted. If you demand independent inductive support for every instance of testimony, you're sawing off the branch you're sitting on. The induction itself relies on testimony. It's viciously circular. Coady nailed this. You can't validate testimony from outside the practice of testimony.

  **MARCUS:** I'm not trying to validate it from *outside*. I'm saying the practice includes norms of monitoring. Elizabeth Fricker's point isn't that we need a global proof. It's that as rational agents, we have a duty to assess the speaker's credibility in the local context.

  **ELENA:** But who assesses the assessor? If the toddler is the prototype of the language learner, and the toddler *cannot* assess credibility in the way you describe, then your norm is impossible to satisfy at the very stage where knowledge acquisition is most critical.

  **MARCUS:** *(Leaning forward)* This is where I turn your own data against you, Elena. You're assuming the toddler's cognitive state is the same *kind* of state as an adult's epistemic entitlement. I'm saying they're different phenomena that look similar from the outside.

  **ELENA:** How so?

  **MARCUS:** The toddler's credulity is a bootstrap mechanism. It's a causal bridge. It gets the vocabulary in so that *later*, monitoring can happen. But just because the bridge exists doesn't mean everything crossing it is justified *at the time of crossing*. When I accept a physicist's claim about black holes, I'm doing something different than this kid. I'm placing trust within a network of reasons I could articulate if pressed. The kid is just… absorbing.

  **ELENA:** So you're saying the kid doesn't *know* the word is "blicket"?

  **MARCUS:** I'm saying the kid has a true belief caused by a reliable process, but lacks the *justification* that comes from responsible monitoring. It's epistemically cheap. It's unearned. And that's fine for a toddler! They're not responsible agents yet. But you want to take that toddler mechanism and elevate it to a normative principle for *us*. You want to say, "Because the baby trusts by default, the adult is entitled to trust by default." That's the leap I'm not making.

  **ELENA:** But if you sever the link, you create a gap you can't cross. If the toddler's uptake isn't a primitive form of knowledge, when does it magically become knowledge? At age four? Twelve? When they can articulate the concept of "reliability"?

  **MARCUS:** It becomes knowledge when the monitoring capacities come online. When they start checking the speaker's gaze. When they start ignoring speakers who have previously been wrong.

  **ELENA:** But those checks *presuppose* they accepted enough testimony to build the model of "wrongness" in the first place! You need the default trust to get the data to run the monitoring software. If you condemn the initial trust as "unearned," you condemn the foundation of the very rationality you prize.

  **MARCUS:** I'm not condemning it. I'm categorizing it. It's a *pragmatic* necessity, not an *epistemic* virtue. It's like breathing. You have to do it to live, but breathing isn't an argument for the existence of oxygen. It's just a condition.

  **ELENA:** *(Sighs, rubbing her temples)* This is the stalemate. You see the default trust as a mere causal condition, like digestion. I see it as a normative starting point, like perception. If you treat it as merely causal, you can't explain why we feel *betrayed* when lied to. We don't feel betrayed when our digestion fails. We feel betrayed because a normative expectation was violated. The expectation of truth-telling is built into the speech act itself.

  **MARCUS:** But that normative expectation is a social contract, not an epistemic warrant. Just because I expect you not to lie doesn't mean I'm justified in believing you without checking.

  **ELENA:** And just because you *can* check doesn't mean you *must* to have knowledge. Look, if I stop you on the street and ask for the time, and you tell me, I know the time. I didn't monitor your pupil dilation. I didn't check your watch against an atomic clock. I took your word.

  **MARCUS:** Because in that context, the stakes are low and the context implies reliability. That's local reductionism! The context *provides* the positive reason.

  **ELENA:** Or, the context *doesn't provide a defeater*, so the default entitlement stands.

  **MARCUS:** *(Gesturing back to the laptop)* But go back to the baby. There is no context. There is no social contract. There is just a noise and an object. If you call that entitlement, you have to explain why we don't hold the baby responsible for being wrong.

  **ELENA:** Because they're not agents yet. But the *structure* of the uptake is the same.

  **MARCUS:** Is it? Or is that the confusion? We're looking at a psychological mechanism and calling it an epistemic right because it persists into adulthood. Maybe the adult entitlement *is* earned, through years of learning how to monitor, and we just forget the labor because it's now automatic.

  **ELENA:** And maybe the monitoring is just a polish on a foundation that was always there. If you strip away the default trust, you don't get a more rigorous epistemology. You get silence.

  **MARCUS:** *(Quietly)* Or you get honesty about what we don't know.

  **ELENA:** *(Looks at the frozen image of the toddler on the screen)* The kid looks so sure.

  **MARCUS:** Yeah. But the kid doesn't know what "sure" means.

  **ELENA:** And yet, here we are, arguing about it, using words we learned by trusting people who are now dead.

  **MARCUS:** *(Smiles faintly)* So, do we cite Coady or Fricker in the dissertation intro?

  **ELENA:** *(Laughs, closing the laptop)* I think you cite the confusion. It's the only honest data point we have.

  **MARCUS:** Deal. But I'm keeping the "epistemically cheap" line.

  **ELENA:** Only if I get to call it "primitively rational."

  **MARCUS:** We'll let the committee fight it out.

  *(They sit in silence for a moment, the hum of the refrigerator the only sound, both wondering if the toddler actually learned the word, or just made a noise back.)*
