answer: |-
  **Protocol 74-B: The Turing Variance**
  **Cambridge Computing Laboratory, Annex 4**
  **November 1974**

  The lead sheets weren't for radiation. Everyone knew that the moment they walked in. Radiation Geigers sat silent on the desk, their needles dead flat. The lead was for *intent*.

  I ran my hand along the wall. It was cold, painted a sterile matte grey, but beneath the paint, I could feel the density. Twenty millimeters of soft metal, interleaved with layers of acoustic dampening foam and a Faraday mesh fine enough to catch a whisper of radio static. We called it the White Room, but in the logs, it was the Isolation Chamber for Psychokinetic Variables. 

  Turing had written about it twenty-four years prior. Most people skipped that section in the papers. They wanted the imitation game, the question of whether machines could think. They didn't want the footnote about the Zener cards. They didn't want to admit that the father of computer science had looked at the Soal-Goldney experiments and decided the statistics were too robust to ignore. If a human mind could nudge a die, or guess a hidden symbol at five sigma above chance, then a standard Turing Test was compromised. A machine might fail not because it lacked intelligence, but because the human interrogator was unconsciously projecting the answers into its logic gates. Or worse, the machine might pass because it was acting as a conduit for the interrogator's own subconscious.

  To test the mind, you had to ensure the mind was contained.

  "Seal check complete," I said into my lapel mic. My voice sounded dead in here, swallowed by the foam.

  "Proceed," came the voice of Dr. Aris from the control booth. He sounded tinny, distant. "Subject is seated. Machine is in standby."

  I looked through the one-way glass. On one side of the heavy oak table sat Mrs. Gable. She was seventy, a widow from Sussex who had scored 0.45 on the Rhine scale during screening. A 'Receiver.' On the other side sat the teletype terminal, connected via hardline to the mainframe in the basement. No wireless. No acoustic coupling. Just copper and silicon.

  My job wasn't to run the test. My job was to ensure the geometry of the room held.

  I walked to the corner where the ventilation shaft entered. This was the hardest part. Air had to flow, but sound couldn't escape, and 'influence' couldn't drift. We used a labyrinth baffle system, three sharp turns lined with iron filings. Turing's original memo suggested a water trap, like a gas seal, but the humidity played havoc with the punch cards. We settled for the iron.

  "Initiating White Noise," Aris said.

  A low hum began, not from speakers, but from vibrating plates embedded in the walls. It wasn't just sound; it was a chaotic frequency designed to scramble pattern recognition. If Mrs. Gable tried to push a thought through the wall, the wall itself was screaming static back at her.

  "Test beginning," Aris announced.

  I watched through the glass. Mrs. Gable closed her eyes. She held a deck of cards against her chest. The protocol required physical contact with the source material to ground the psychic potential. The machine, naturally, had no hands. It generated random numbers via thermal noise decay.

  The teletype clattered. *CLICK-CLACK.* A letter printed.
  Mrs. Gable didn't move.
  *CLICK-CLACK.*

  I checked the monitors on my wrist. The magnetometers were steady. No spikes. No electromagnetic anomalies that usually accompanied her 'hits.' That was the unsettling part about the Variance. It didn't register on the tools. You only knew it happened by the result.

  If the machine guessed the card correctly more than 20% of the time, the test was void. Not because the machine was psychic—machines didn't have souls to project—but because the isolation had failed. It meant Mrs. Gable's mind had reached out, bypassed the lead, bypassed the noise, and nudged the thermal decay in the basement. It meant the boundary of her self extended beyond her skin.

  And if the boundary of the self was porous, where did the machine begin?

  *CLICK-CLACK.*

  Mrs. Gable frowned. She looked tired. The room was heavy. I knew the feeling. Spending too much time in the White Room made you feel like you were underwater, like your thoughts were pressing against the lead lining, looking for a way out. We had to rotate the staff every four hours. Prolonged exposure caused migraines. Or maybe it was just the knowledge that you were standing inside a cage built to hold a ghost.

  "Cycle 40 complete," Aris said. "Accuracy holding at chance."

  I exhaled. Chance was good. Chance meant the walls were working. Chance meant the universe was still behaving.

  But then I saw it. On the telemetry strip for the teletype. The thermal noise generator. It wasn't random. Not perfectly. There was a micro-rhythm, a tiny, repeating cadence in the static. It matched the beat of Mrs. Gable's heart, monitored on the biometric feed.

  My stomach tightened. The lead was holding. The noise was scrambling. But the correlation was there.

  "Dr. Aris," I said. "Check the generator output. Sector 4."

  "Reading nominal," he replied.

  "It's syncing," I said. "The machine isn't guessing the cards. The cards are guessing the machine."

  Silence on the line. In the room, Mrs. Gable opened her eyes. She looked directly at the one-way glass. Not at me, but *through* it. She looked exhausted, as if she had been holding up a weight I couldn't see.

  The problem with the Turing Variance was that it assumed the anomaly was an intrusion. We built the room like a fortress, assuming the psychic influence was an arrow flying in from the outside. But what if it wasn't an arrow? What if it was gravity?

  You can't shield against gravity. You can only add mass. And how much mass do you need to stop a thought from curving space?

  "Terminate test," Aris said sharply. "Seal the logs."

  The teletype stopped. The hum of the walls died down. The silence that rushed back in was heavier than the noise.

  I walked over to the door to let Mrs. Gable out. As I unlocked the heavy bolts, I realized the flaw in the engineering. We had spent twenty years trying to build a room that a mind couldn't leak out of. We treated consciousness like a gas, something that would dissipate if not contained.

  But as I looked at the teletype, sitting silent and cold, I wondered if we had it backward. The machine wasn't thinking. The room was thinking. The lead, the foam, the iron filings, the human, the silicon—we had built a circuit, and for a moment, we had closed the loop.

  I held the door open for Mrs. Gable. She walked past me, brushing my arm. Her skin was ice cold.

  "Did I pass?" she asked quietly.

  "The test was voided, ma'am," I said.

  She nodded, as if she expected nothing else. "It's hard to keep it inside, you know. Especially in a small room."

  She walked down the corridor, her footsteps fading. I went back inside to reset the sensors. I stood in the center of the White Room, surrounded by twenty millimeters of lead, and for a second, just a second, I couldn't remember if I was the one testing the machine, or if I was just another variable in the equation, waiting to see if I would guess the next card correctly.

  I checked the magnetometer. The needle twitched. Not from radiation. Not from electricity.

  Just from me.
