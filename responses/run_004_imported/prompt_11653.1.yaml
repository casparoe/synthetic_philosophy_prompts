answer: |-
  Here are ten interview questions designed for your audience of software engineers and decision theory enthusiasts, including the specific thematic requirements and follow-ups you requested.

  **1. The Normative Status of Preferences**
  "Standard decision theory treats preferences as the primary locus of rationality—if you're getting pumped, your preferences are 'broken.' You argue the preferences can stay, but the *choice mechanism* must change. If we accept your view, do preferences cease to be a description of what an agent *will* choose, and become merely a description of what they *want* to choose?"

  *   **Follow-up:** "If preferences no longer predict choice, what work are they doing in our formal models? Are we effectively debugging the execution layer while leaving the logic layer buggy?"

  **2. Plan Rationality vs. Transitivity (Required)**
  "Critics argue that moving the rationality requirement from local preferences to global plans isn't a fix, but just transitivity reimposed one level up. If a resolute chooser must select a plan that doesn't dominate itself over time, haven't you simply defined a 'meta-preference' over plans that must be transitive to avoid a pump?"

  *   **Follow-up:** "If she admits the meta-preference must be consistent: 'If the plan selection process itself requires consistency to avoid exploitation, does the source of that consistency matter? Or have we just pushed the requirement for transitivity back to the moment of resolution, leaving the underlying preference cycle intact but inert?'"

  **3. Resolute vs. Sophisticated Choice (Required)**
  "Let's distinguish your resolute chooser from the 'sophisticated' chooser in game theory. The sophisticated agent uses backward induction to anticipate where they will cave and prunes those branches from the decision tree. Your resolute agent commits to a branch they know they'll want to deviate from later. Is the resolute agent essentially running on a different utility function at $t_0$ than at $t_1$?"

  *   **Follow-up:** "If she says resolute choice preserves the original utility: 'If the utility function is constant, but the sophisticated agent accepts they will deviate while the resolute agent forces themselves not to, isn't the resolute agent incurring a cognitive cost to suppress information about their own future incentives?'"

  **4. The Binding Problem in Real Markets (Required)**
  "This model works well for idealized agents, but my listeners build systems that interact with high-frequency traders who can't bind their future selves. If a human trader can't credibly commit to a plan without an external contract, doesn't the money pump just reappear in the market for commitment devices? You pay the pump operator to stop pumping you."

  *   **Follow-up:** "If she argues external devices solve it: 'If the cost of the smart contract or legal binding exceeds the expected loss from the money pump, do you still call the underlying preferences rational, or just expensive to maintain?'"

  **5. The Allais Paradox and Independence**
  "Your defense often leans on the Allais paradox, where violating independence seems intuitively reasonable due to certainty effects. But if an agent is resolute, they must ignore the 'certainty' appeal at the second stage of the trade sequence. Does resolute choice require the agent to actively suppress the intuition that makes the Allais preference attractive in the first place?"

  *   **Follow-up:** "If the agent has to suppress the intuition to avoid the pump, is the rationality located in the preference for certainty, or in the willpower to ignore it?"

  **6. Separability and History**
  "Dynamic consistency usually relies on the separability axiom: what you choose now shouldn't depend on past choices that are sunk. Resolute choice explicitly violates this by making current choice dependent on a past resolution. Does this mean a resolute agent is effectively 'sunk-cost fallacying' their way to rationality?"

  *   **Follow-up:** "If she denies it's a sunk cost fallacy: 'What is the formal difference between honoring a past resolution to avoid a pump and throwing good money after bad because you already invested in a plan?'"

  **7. Implementation in Autonomous Agents**
  "For the engineers listening: if we are coding an autonomous agent, should we hard-code resolute choice? If an AI detects it has intransitive preferences, should it patch the preferences, or wrap them in a resolute choice architecture that prevents re-evaluation?"

  *   **Follow-up:** "If we wrap the preferences, does that make the agent safer to deploy, or does it make the agent opaque about why it's rejecting locally optimal trades?"

  **8. The Cost of Resolution**
  "Maintaining resolution against local incentives sounds computationally expensive. In a resource-bounded environment, isn't it more efficient to accept some vulnerability to money pumps than to run the overhead of constantly checking actions against a global plan?"

  *   **Follow-up:** "If rationality is resource-bounded, isn't the 'rational' choice sometimes to accept a small pump rather than pay the compute cost of resoluteness?"

  **9. Updating on New Information**
  "Suppose a resolute agent commits to a plan at $t_0$, but at $t_1$ receives new information that makes the plan disastrous. Does your defense of resolute choice allow for updating, or does the commitment to avoid exploitation lock the agent into a failing strategy?"

  *   **Follow-up:** "If updating is allowed, how do we distinguish between a legitimate update on information and a rationalization to deviate from the plan to take a locally preferred trade?"

  **10. Falsifying the Defense (Required)**
  "Finally, what empirical or theoretical finding would convince you that money-pump vulnerability indicts the preferences themselves, rather than just the disposition? Is there a scenario where resolute choice is impossible, even in principle, that would force you to abandon intransitive preferences?"

  *   **Follow-up:** "If she suggests a specific scenario: 'In that scenario, would you concede that the preferences are irrational, or just that the agent is incapable of being rational with those preferences?'"
