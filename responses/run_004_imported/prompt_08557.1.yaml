      *Wait, looking closer at Part (a):* "Hilbert-Bernays derivability conditions." Technically, Löb's theorem requires the **Löb** derivability conditions (which are slightly specific refinements of Hilbert-Bernays, specifically regarding the provability of the implication). Usually, "Hilbert-Bernays-Löb" is the safe phrase. Just "Hilbert-Bernays" is often accepted as shorthand, but in a *formal* seminar, precision matters.
