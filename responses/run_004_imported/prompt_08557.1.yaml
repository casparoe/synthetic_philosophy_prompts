          *   **Requirements:** Connect the formal limitation to the "tiling agents" problem / self-modification. An agent $A$ wants to build $A'$ such that $A$ trusts $A'$. If $A'$ is as strong as $A$, $A$ cannot prove $A'$'s soundness (because proving $A'$'s soundness essentially requires proving $A$'s consistency/soundness).
