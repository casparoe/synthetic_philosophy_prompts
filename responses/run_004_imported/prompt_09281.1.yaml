      *   **Mechanism:** Bayesian updating.
      *   **The Cascade:** At some point, the weight of the public history outweighs the weight of a single private signal.
      *   **Rationality:** Agents are perfect Bayesians. They aren't *choosing* to ignore their signal because they are sheep; they are mathematically compelled to ignore it because the public information is statistically more informative than their private blip.

  3.  **Identify the Key Distinction:**
