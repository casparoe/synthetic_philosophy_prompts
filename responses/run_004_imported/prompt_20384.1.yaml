answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I spent forty years crawling over rocks at low tide, studying snails, and I've had the privilege of being Warren's friend and collaborator for thirty of them.

  When we were asked to speak tonight, I knew I had to address the elephant in the room. Or rather, the eighteenth-century philosopher in the room. For the last fifteen years, Warren has answered to the name "Dr. Pangloss."

  For Warren's family and friends outside of biology: this nickname comes from Voltaire's *Candide*. Dr. Pangloss was a tutor who believed we lived in the "best of all possible worlds," where everything that happened was perfectly designed for a specific, beneficial purpose. If a volcano erupted, Pangloss would argue it was necessary to vent the earth's humors for the greater good.

  For my colleagues in the back: yes, this is a nod to Gould and Lewontin's 1979 critique of the "adaptationist programme." The accusation, usually, is that a biologist looks at a trait and assumes it must be useful, weaving a just-so story rather than testing if it's just a byproduct of something else—a "spandrel," to use the architectural metaphor from the dome of San Marco.

  Now, if I were giving a seminar, I would spend the next twenty minutes discussing null hypotheses and phylogenetic constraints. But this is a dinner, and Warren is sitting right there. So I will say this: The nickname stuck, and Warren wore it with pride. But there is a crucial distinction between Voltaire's Pangloss and ours.

  Voltaire's Pangloss was a dogmatist. He knew the answer before he asked the question. Warren's Pangloss was an optimist with a calculator.

  Warren never met a trait he didn't suspect had a function. He approached the natural world with the cheerful conviction that there was a reason for everything. But—and this is the part that matters—he never let that conviction survive contact with the data. I have sat in seminars with Warren where he proposed the most elegant, beautiful adaptive story you ever heard. And when the residuals didn't line up, when the p-value slipped above 0.05, he was invariably the first person to say, "Well, perhaps it's just drift," or "Maybe it's a developmental constraint."

  He didn't assume the world was perfect; he just assumed it was interesting enough to measure rigorously.

  There is a final layer of irony here that I only fully appreciated after I retired and finally had time to read the philosophy properly. Stephen Jay Gould, the man who popularized the critique of the Panglossian paradigm, spent a great deal of his own scientific life studying land snails in the Bahamas. I spent my life studying intertidal gastropods. And Warren spent his life finding function in the complexity of life.

  It occurs to me that Gould spent a career studying snails to prove that not every trait is an adaptation. Warren spent a career proving that you shouldn't assume they aren't until you've checked.

  So, here is the joke I promised myself I'd make. Voltaire's Dr. Pangloss believed we lived in the best of all possible worlds by definition. Warren's Dr. Pangloss believed we live in a world where everything *might* have a perfect reason, provided you're willing to stay up until 3 AM to calculate the p-value. One of them was a philosopher; the other was a scientist.

  Warren, you have been a rigorous optimist, a generous collaborator, and the best friend a retired ecologist could ask for. You taught us that looking for purpose isn't naive, as long as you're willing to accept the answer "none" when the data demands it.

  To Warren. May your retirement be the best of all possible worlds, not by assumption, but by design.

  To Warren!
