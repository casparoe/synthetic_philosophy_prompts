      *   *Embedded Agent:* Is part of the world. It can modify its own code. It has a successor. It needs to reason about *itself* (or its successor) as an object in the world.
      *   *The Connection:* The Löbian obstacle arises *because* the agent is trying to model itself (or a copy of itself) within its own logical framework. A Cartesian agent doesn't need to trust a successor it builds; it just *is*. An embedded agent must plan for a future where it might be different or where it creates children. The self-reference is the key.
