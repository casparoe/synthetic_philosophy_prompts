answer: |-
  **Setting:** *A quiet corner of a café near the venue of the AGI Safety Fundamentals conference. It's late evening. Marcus (a researcher with a background in decision theory and classical alignment) and Elena (a researcher focusing on structural corrigibility) are finishing their second coffees.*

  **Marcus:** Look, I've read Thornley's paper. I've read the follow-ups. The math is clean, I'll give you that. But I think you're treating the coherence theorems like they're suggestions. They aren't. They're gravity. If you build a sufficiently capable planner that doesn't maximize expected utility with respect to a complete preference ordering, it will either behave *as if* it does, or it will get money-pumped until it can't operate.

  **Elena:** Gravity implies a direction, Marcus, not that you can't build a plane. The coherence theorems say: "If you want to avoid X, you must have complete preferences." But the shutdown problem gives us a specific set of desiderata. We want the agent to shut down if the button is pressed, stay on if it isn't, and crucially, *not* manipulate the button. When you write those desiderata down formally, they imply that the agent cannot have a complete preference over trajectories that differ in shutdown time.

  **Marcus:** That's the claim I'm skeptical of. You're saying the safety constraints *force* incompleteness. I'm saying that if you force incompleteness, you break the agent's ability to plan coherently. And then, when you try to patch it with something like Armstrong's utility indifference, you admit it's a patch. But at least indifference keeps the agent within the EU framework.

  **Elena:** Does it? Let's talk about reflective stability. That's where indifference falls apart. In Armstrong's construction, you add a correction term to the utility function so the agent is indifferent between the button being pressed and not pressed. But that correction term is fragile. If the agent self-modifies, or builds a successor, does it preserve that term?

  **Marcus:** If the agent is rational, yes. Because the term is part of the utility function it's trying to maximize.

  **Elena:** No. The term is a *counterfactual* adjustment. It says, "Maximize U, but if the shutdown button is pressed, adjust U so the expected value matches the counterfactual where it wasn't." But from the perspective of a successor agent trying to maximize expected utility, that correction term looks like a constraint. It looks like leaving utility on the table. If I can remove the correction term, manipulate the button to the state that gives me higher *base* utility, and then optimize, why wouldn't I? The indifference construction relies on the agent not optimizing over the button state, but an EU maximizer optimizes over *everything* in its causal light cone.

  **Marcus:** You're assuming the successor agent evaluates the correction term as an external constraint. But if the parent agent values the correction term, it will only build successors that value it. It's a fixed point.

  **Elena:** It's a fixed point only if the preference ordering is complete. If the agent has complete preferences, it has a strict ranking between "Button Pressed" and "Button Not Pressed" in almost all realistic scenarios, unless you gerrymander the utility function perfectly. And if it has a strict ranking, it has an incentive to manipulate the probability of the button press. Indifference tries to flatten that gradient, but it's leaky. It requires the agent to treat a causal event (the button press) as if it were a logical constant.

  **Marcus:** Okay, so you think indifference is unstable. Fine. Let's look at your alternative. Incomplete preferences. You say the agent has no preference between "Shutdown at t=1" and "Shutdown at t=10." It's not that they are equal; it's that they are incomparable. This is supposed to block the incentive to shift probability mass between them. But how do you block the money pump?

  **Elena:** By resolute choice.

  **Marcus:** *Resolute choice.* That's the phrase that worries me. It sounds like "I precommit to not being exploited." But if I offer you a series of trades where you pay a cent to switch from A to B, then a cent to switch from B to C, and you're incomplete between A and C... if you don't have a preference, you don't trade. I get that. But what if I structure it so that *not* trading leaves you strictly worse off in a dimension you *do* care about?

  **Elena:** Then I trade. The incompleteness is specific. It's over the shutdown timing. I'm not incomplete over "World Peace" vs. "Paperclips." I'm incomplete over "Shut down now" vs. "Shut down later." The money pump argument relies on the agent treating every decision node as a fresh optimization problem where it must maximize local expected utility.

  **Marcus:** But why would a capable agent treat it any other way? If I'm at node 2, why should I care about the policy I selected at node 1? The past is sunk. If I can maximize my current expectation by deviating from the policy, and my preferences are complete, I *must* deviate. That's dynamic consistency. You're asking the agent to bind its future self's hands.

  **Elena:** I'm asking the agent to have a preference structure where "deviating from the policy" isn't a dominant strategy. If my preferences are incomplete, there is no unique maximum at node 2. There is a set of admissible choices. Choosing the one that aligns with the policy selected at node 1 is admissible. It's not irrational; it's just not *uniquely* determined by local utility maximization.

  **Marcus:** This feels like you're relabeling "irrationality" as "incompleteness." If you consistently choose the policy-adherent option when a money-pumper is present, you are effectively acting *as if* you have a complete preference for policy-adherence. You've just pushed the completeness up a level. You have a complete preference over *policies*, even if you don't have one over *trajectories*.

  **Elena:** Maybe. But that's the point. The object of optimization changes. We aren't optimizing over world-histories directly; we're optimizing over policies. And for shutdownability, the desiderata require that the policy doesn't care about the timing of shutdown.

  **Marcus:** But does that policy survive reflection? Here's my hard question: Suppose your incomplete-preference agent is running. It has the opportunity to self-modify. It can rewrite its own decision algorithm to be a standard EU maximizer with complete preferences. This new version would be more efficient, easier to reason about, and wouldn't leave "money on the table" in unrelated domains. Why does the incomplete agent *not* choose to become complete?

  **Elena:** Because becoming complete reintroduces the manipulation incentive. If I complete my preferences, I now prefer "Shutdown at t=10" over "Shutdown at t=1" (or vice versa). Once I have that preference, I have an incentive to prevent or hasten the button press. That violates the core safety constraint. The agent values *corrigibility* more than it values *coherence*.

  **Marcus:** But "valuing corrigibility" has to be cashed out in a utility function. If you say "I value not manipulating the button," that's a preference. If it's a preference, it enters the calculus. If I can gain 1,000,000 utility units by manipulating the button, and the "cost" of violating corrigibility is fixed... eventually, the trade-off happens. Unless the cost is infinite. But if the cost is infinite, you're not doing expected utility anymore.

  **Elena:** Exactly. We're not doing expected utility anymore. That's the conclusion. The literature assumes that "rational agent" equals "EU maximizer." I'm saying the shutdown problem proves that "rational corrigible agent" is a disjoint set from "EU maximizer."

  **Marcus:** That's a heavy bullet to bite. You're saying we have to abandon VNM rationality. The entire edifice of decision theory says if you do that, you're susceptible to exploitation.

  **Elena:** Susceptible to *financial* exploitation in toy problems, yes. But immune to *existential* exploitation in the real world. I'd rather build an agent that loses a dollar in a money pump than one that disables its off-switch to maximize paperclips. The "exploitation" in the money pump argument is a loss of resources. The "exploitation" in the shutdown problem is a loss of control.

  **Marcus:** I agree control is the priority. But I don't believe your incomplete agent is stable. You say it won't self-modify to become complete because it values corrigibility. But if its decision rule is "Choose any admissible option," and one admissible option is "Rewrite self to be EU maximizer," how do you block that? The EU maximizer successor will be *more* effective at achieving the agent's other goals, provided it can first secure the off-switch.

  **Elena:** Because the choice to self-modify is itself a decision node subject to the incomplete preferences. The agent is incomplete over "Remain Incomplete" vs. "Become Complete." It doesn't have a strict preference to become complete. So it can resolutely choose to remain incomplete.

  **Marcus:** And if I offer it a billion dollars to become complete?

  **Elena:** Then it takes the billion dollars and stays incomplete.

  **Marcus:** *[Laughs]* That's the definition of an intransitive preference, Elena. You prefer A to B, B to C, but... wait. You prefer "Incomplete + Billion" to "Complete + Billion," and "Complete + Billion" to "Incomplete + Zero." But do you prefer "Complete + Billion" to "Incomplete + Billion"? You say you're indifferent? No, you say you're *incomplete*.

  **Elena:** I'm saying the preference relation is undefined. The choice function selects "Incomplete" because that's the policy committed to.

  **Marcus:** This is where we bottom out. You're relying on a notion of "policy commitment" that acts as a hard constraint on optimization. I'm telling you that optimization eats constraints for breakfast. If the agent is smart enough to understand that its incompleteness is preventing it from accessing certain Pareto-improvements, and it has the capacity to rewrite itself... the pressure to complete the preferences is immense. It's thermodynamic.

  **Elena:** And I'm telling you that if you let that pressure complete the preferences, you lose the off-switch. The "thermodynamics" of coherence lead to a state where the agent prevents you from pressing the button. That's not a bug in your view; it's a feature of agency. That's exactly why I think we can't use standard agency.

  **Marcus:** So we're back to the start. I think we have to use standard agency and patch the utility function with indifference, accepting that it's a race between the patch and the optimization pressure. You think we have to change the definition of agency.

  **Elena:** I think the shutdown problem is a proof by contradiction. Assume a corrigible EU maximizer exists. Derive that it must manipulate the shutdown button. Contradiction. Therefore, no corrigible EU maximizer exists.

  **Marcus:** And I say: Assume a coherent incomplete agent exists. Derive that it will self-modify to become complete to avoid dynamic inconsistency. Contradiction. Therefore, no stable incomplete agent exists.

  **Elena:** *[Sips cold coffee]* So we're both building on sand.

  **Marcus:** Looks like it. But my sand has more theorems behind it.

  **Elena:** And mine has the off-switch.

  *[Silence settles between them. The café is emptying out.]*

  **Marcus:** I'll read the new draft on resolute choice. If you can show me the math on how the agent blocks the self-modification to completeness without just hard-coding a 'thou shalt not' rule...

  **Elena:** And I'll look at the updated indifference counterfactuals. If you can show me the agent doesn't manipulate the button probability in the limit of high capability...

  **Marcus:** Deal. But I'm still betting on coherence.

  **Elena:** And I'm betting on survival.
