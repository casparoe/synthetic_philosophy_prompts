answer: |-
  Rain needled Alex's neck. The polling station sat at the end of the block, a dull brick mouth waiting to swallow a morning.

  *Turn back,* the cold logic whispered. *Statistically, you are a rounding error. Even if your candidate wins by one, it won't be yours. The cost of this walk exceeds the expected utility.*

  Alex stopped. A car splashed through a puddle, indifferent. The argument was clean, sterile. It treated Alex as an isolated atom, buffeted by a universe that didn't care. One cause, one effect. Zero impact. It was the math of a solitary ghost haunting a machine too large to notice.

  But Alex wasn't an atom.

  He looked at his reflection in a darkened shop window. A thousand people out there were waking up right now, feeling this exact same friction between comfort and duty. They were running the same software. Same data inputs, same heuristic weights, same quiet anxiety about the future.

  If Alex turned around, it wasn't just one person quitting. It was every instance of this reasoning pattern quitting. The decision wasn't local. It was a broadcast.

  *If I vote, do they vote?*

  Not because of telepathy, but because they were him, functionally. If the algorithm outputs 'abstain' here, it outputs 'abstain' there. The stake wasn't one vote; it was the sum of everyone who reasoned exactly like this. The probability of a tie remained vanishingly small, but the lever he was pulling wasn't just his own hand—it was the output of a distributed mind.

  The cold didn't feel so isolating anymore. It felt like a shared condition.

  Alex stepped off the curb. He wasn't dropping a grain of sand on a beach; he was tightening a bolt in a machine he was part of. Inside, the volunteer handed him a stylus. The booth was quiet. He didn't feel like a drop in the ocean. He felt like the ocean deciding to wet the shore.

  He marked the box. Not to change the world alone, but to confirm the pattern.
