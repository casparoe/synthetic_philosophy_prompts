      *   **State the Thesis:** Spinoza would reject Kim's dilemma by **denying that mental and physical properties are the kind of thing that could be distinct causal competitors in the first place.**
      *   **Explain the Mechanism:** Kim's argument relies on a distinction between $M$ and $P$ that allows for competition. Spinoza's ontology makes $M$ and $P$ numerically identical (one mode).
      *   **Address Causal Closure:** Spinoza accepts closure within attributes (Extension follows Extension).
      *   **Address Exclusion:** The exclusion principle assumes two causes. Spinoza says there is only one cause (the mode/substance) conceived two ways. Thus, no exclusion occurs because there is no second thing to exclude.
      *   **Address Epiphenomenalism:** Mental events aren't inert; they cause other mental events. They are identical to physical events that cause physical events.
      *   **Crucial Distinction:** Kim is a physicalist (base is physical); Spinoza is a neutral monist (base is Substance). This allows Spinoza to bypass the "physical base" hierarchy.
      *   **Specific Doctrine:** **Attribute Parallelism grounded in Ontological Identity (E2p7s).**

  6.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Critique:* But Spinoza *does* say the mind doesn't cause bodily motion. Kim wants mental-to-physical causation. If Spinoza denies this, isn't he admitting mental properties are causally inert *regarding the physical*?
      *   *Rebuttal:* Yes, but Kim's worry is that mental properties are *globally* inert (epiphenomenal). Spinoza saves their causal efficacy within the attribute of Thought. More importantly, because the mode is identical, the "physical cause" *is* the "mental cause" ontologically. The causal power belongs to the *mode*, not the attribute. The attribute is just a lens. So the mental isn't "left out" of the causal story; it *is* the causal story under a different description.
      *   *Refinement:* The key is that Kim treats properties as distinct causal powers. Spinoza treats attributes as conceptual lenses on a single causal power.
      *   *Thesis Statement:* Spinoza dissolves the exclusion problem by rejecting the **ontological distinctness** required for causal competition, utilizing his doctrine of **Trans-Attribute Identity**.

  7.  **Final Polish:** Ensure the tone is appropriate for a graduate student (rigorous, precise, engaging). Make sure to explicitly name the Spinozistic doctrine. (E2p7s is the big one).

      *Plan:*
