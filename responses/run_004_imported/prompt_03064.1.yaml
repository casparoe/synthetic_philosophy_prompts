          5.  Tackle the Bonus (Super-Petersburg, Menger's critique, Finite Bankrolls).
      *   *Key Analogy:* Spin Glasses. In a spin glass, the system gets stuck in a local minimum. The ensemble average assumes it explores all phase space. It doesn't. Similarly, a gambler goes bankrupt (absorbing state) and stops exploring phase space. Ensemble average ignores the absorbing state; time average respects it.

  6.  **Refining the Ergodicity Argument (Self-Correction/Nuance):**
      *   Make sure not to oversell Peters. Some economists criticize him for assuming *everyone* reinvests (Kelly criterion style). If you just play once and walk away, the ensemble average might be more relevant.
      *   Acknowledge that for a *single* play, the distinction is blurrier, but Peters argues decisions are made in the context of a life (repeated interactions).
      *   Clarify the "Log" coincidence: Bernoulli *chose* log for psychological reasons. Peters *derived* log from multiplicative dynamics ($dW/W$). If dynamics were additive ($dW$), Peters would derive linear utility. This is the smoking gun that they are different theories.

  7.  **Final Polish:**
      *   Ensure the "Super-Petersburg" answer is precise. Menger's critique applies to *fixed* utility functions. Ergodicity doesn't rely on a fixed function; it relies on the payout structure relative to wealth. If the payout exceeds the bankroll, the game is void.
      *   Check the tone: "Retired colleague" vibe.

  8.  *(Self-Correction during drafting)*: Wait, does Peters actually solve Super-Petersburg?
      *   If payoff is $2^{2^n}$, the time average growth rate $\sum \frac{1}{2^n} \ln(2^{2^n}) = \sum \frac{1}{2^n} 2^n \ln 2 = \sum \ln 2$. This diverges.
      *   So, strictly mathematically, if the bankroll is infinite, the time average *also* diverges.
      *   *However*, Peters' point is usually that infinite bankrolls don't exist. The paradox relies on the *assumption* of infinite payout capability.
      *   So the resolution is: The game is ill-defined physically. Bernoulli tries to fix the agent; Peters fixes the game definition.
      *   Actually, a better point: Peters argues that for *any* realistic repeated gamble, you optimize growth rate. If the growth rate diverges, you pay infinite. But since no casino has infinite money, the growth rate is always finite. The "Paradox" is an artifact of assuming infinite resources. Bernoulli's fix is "humans are risk-averse." Peters' fix is "infinite money doesn't exist, and if it did, you *should* pay infinite."
      *   Let's stick to the strongest argument: The *source* of the logarithm. Bernoulli: Psychology. Peters: Geometry of wealth (multiplicative).

  9.  **Finalizing the Plan:**
      *   Intro: Acknowledge the frustration (it *is* annoying that they look the same).
      *   Section 1: The Conceptual Gap (Psychology vs. Dynamics). Use the additive vs. multiplicative distinction.
      *   Section 2: The Stat Mech Analogy (Ensemble vs. Trajectory, Absorbing States).
      *   Section 3: Does it do work? (Falsifiability, Kelly Criterion connection).
      *   Section 4: Bonus Round (Super-Petersburg, Menger, Finite Resources).
      *   Conclusion: It's not just dressing; it's a category error correction.

  10. (Reviewing against constraints): Keep it engaging for a physicist. Don't dumb it down, but don't get bogged in excessive notation. Focus on the *physics* of the decision process.

  *(Self-Correction on Super-Petersburg)*: I need to be careful. If the payoff is $2^{2^n}$, the expected log payoff is $\sum (1/2^n) \ln(2^{2^n}) = \sum (1/2^n) 2^n \ln 2 = \sum \ln 2 = \infty$. So the time-average growth rate *also* diverges.
  *So does Peters solve it?*
  Peters' argument is that the *game itself* is unphysical. The paradox assumes a casino with infinite capital. If the casino has finite capital $C$, the game ends when the payout exceeds $C$. The expected value becomes finite.
  Bernoulli's solution tries to make the value finite *even if* the casino has infinite capital (by changing the agent).
  Peters' solution says "If the casino has infinite capital, the value *is* infinite, and you should pay infinite. The fact that you wouldn't implies you know the casino is lying about having infinite capital."
  This is a crucial distinction. Bernoulli says "Infinite value exists, but you don't care." Peters says "Infinite value doesn't exist."
