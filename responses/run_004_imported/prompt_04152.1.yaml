      *   *Idea 5: The "Alien Culture" Tourist.* Someone visiting a culture and unintentionally offending. (Close to Bad Husband).
      *   *Idea 6: The "Meaningless Ritual".* A person is required to perform a ritual that has no meaning to them, but failure causes objective harm they don't know about. (Close to Gin/Petrol).
      *   *Idea 7: The "Creative Block" / "Talent Waste".* Someone has a massive talent they hate using. Do they have a reason to use it? (Williams says no, unless they care about the talent).
      *   *Idea 8: The "Forgotten Promise to a Stranger".* I made a promise years ago, forgot it, and now have no desire to keep it. (Close to Bad Husband).
      *   *Idea 9: The "Existential Risk" Bureaucrat.* A bureaucrat who is indifferent to the long-term future of humanity but holds a switch that prevents extinction. They have no project involving humanity's survival. (This is strong. It's not a "monster" in the interpersonal sense, just indifferent to the abstract future).
      *   *Idea 10: The "Painless Torture" of a Digital Entity.* (Too sci-fi?).
      *   *Idea 11: The "Aesthetic Vandal".* Someone who defaces a masterpiece but gains no pleasure from it, nor dislikes it. They just do it. (Close to Bad Husband).
      *   *Idea 12: The "Reluctant Heir".* Someone inherits a foundation dedicated to a cause they are indifferent to (e.g., saving a specific beetle species). They have the power to save the species at zero cost to themselves, but they genuinely don't care about beetles. Externalism says they have a reason. Internalism says they don't (unless we stretch "S").

