prompt: |-
  Had a long, kind of heated argument with my friend last night about whether "you have a reason to do X" always has to connect back to something you actually care about (or would come to care about after really thinking it through), or whether some reasons apply to you no matter what you want. I was defending the first view, she had the second. Looked it up after and turns out I'd basically reinvented Bernard Williams's internalism (a reason only counts if theres a "sound deliberative route" from your existing desires/projects/loyalties - your "S" as he weirdly calls it - to the action), and she was channeling the McDowell/Korsgaard-style pushback against it.

  Thing is, every explanation of this debate uses the same three examples (the gin that's secretly petrol, the guy who's awful to the people close to him and just doesn't care, Singer's kid drowning in the shallow pond), and honestly I can't tell anymore if internalism is obviously right or obviously lets monsters off the hook.

  Can you invent a genuinely new example - not those three, not a thin reskin of one of them - that puts real pressure on Williams's view? And then actually give me a verdict: does internalism survive it, or does it have to bite a bullet somewhere?
reasoning: |-
  Here's a thinking process that leads to the suggested example and analysis:

  1.  **Analyze the Request:**
      *   **Topic:** The Internalism vs. Externalism debate about reasons for action (Williams vs. McDowell/Korsgaard).
      *   **User's Position:** Defended Internalism (Williams): Reasons must connect to the agent's subjective motivational set ("S").
      *   **Friend's Position:** Defended Externalism (McDowell/Korsgaard): Some reasons apply regardless of desires.
      *   **Problem:** The standard examples (Gin/Petrol, Bad Husband, Drowning Child) are overused and intuitively muddy.
      *   **Task:** Create a *genuinely new* example (not a reskin) that pressures Williams's view. Then, provide a verdict on whether Internalism survives or has to bite a bullet.

  2.  **Deconstruct the Debate:**
      *   **Williams (Internalism):** $A$ has a reason to $\phi$ iff $A$ could reach $\phi$ via sound deliberation from their existing "S" (desires, projects, commitments). If no link exists, saying "you have a reason" is false/misleading.
      *   **Externalism:** Moral facts, rational requirements, or objective values generate reasons independently of $A$'s psychology.
      *   **The Tension:** Internalism respects agency and psychology but risks moral skepticism (the "amoralist" or "monster" problem). Externalism secures moral normativity but risks alienation (why should *I* care about this external fact?).

