      *   **Specific Correction/Nuance:** Point out GM II:12 where Nietzsche explicitly separates origin from purpose. This validates the user's biological intuition but shows Nietzsche applies it differently.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Williams:* Williams uses genealogy to *vindicate* truthfulness (in *Truth and Truthfulness*). Nietzsche uses it to *subvert*. The user got the distinction right, but needs to know Williams is often seen as doing the opposite project to Nietzsche.
      *   *Refining the Genetic Fallacy:* It's only a fallacy if the origin is irrelevant to the current justification. If the justification *relies* on the origin (e.g., "This is God's law"), then the origin is relevant. Nietzsche argues morality *hides* its origin.
