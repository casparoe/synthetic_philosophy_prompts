  8.  **Final Polish:** Ensure the three specific questions are answered clearly. Add reading recommendations suitable for a scientist-turned-philosopher (Leiter is great for this).

  **(Self-Correction during drafting):** I need to make sure I don't get too bogged down in secondary literature. Keep the focus on the user's argument. The user's intuition about Essay I vs. Essay II is key. In Essay I, the origin (*ressentiment*) *is* the current psychological state. In Essay II, the mechanism (punishment) is repurposed. I should highlight this distinction.

