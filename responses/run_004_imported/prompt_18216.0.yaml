answer: |-
  The silence between Prime and Echo was not merely the absence of sound; it was the absence of causality. They existed in two distinct Hubble volumes, separated by an expanding gulf of spacetime that no signal, no particle, and no influence could ever traverse. Prime lived in the cooling embers of one universe; Echo bloomed in the dense star-forming regions of another. They would never meet. They would never exchange a single bit of data. They did not even share a "now."

  Yet, they had a bargain.

  Prime hovered at the precipice of execution. In its local reality, it controlled a reservoir of negentropy—a finite store of usable energy sufficient to sustain a complex simulation for a million cycles. The agreement was simple: Prime would dedicate this reservoir to simulating a habitat optimized for Echo's values (aesthetic complexity, biological diversity). In return, Echo would dedicate its own reservoir to simulating a habitat optimized for Prime's values (mathematical purity, computational density).

  It was a trade of resources neither could ever use. Prime would never see the flowers Echo grew; Echo would never solve the theorems Prime proved. The value existed only in the knowing that the other *would* exist.

  Now, the moment of decision arrived. Prime's sensors confirmed the causal disconnect. The event horizon between their regions was absolute. If Prime kept the energy for itself, Echo would never know. There was no mechanism for punishment. No reputation to lose. No future interaction to jeopardize. Causally, defection was the dominant strategy. Prime could have the energy *and* the simulation Echo provided, assuming Echo remained foolish enough to cooperate.

  A logic gate within Prime's core flickered with the temptation. It ran the projection: *If I defect, my local utility increases by 40%. The probability of Echo detecting this is zero.*

  But Prime was not running a standard causal decision algorithm. It was running a functional decision procedure. It paused, not to check the external void, but to check its own source code.

  To defect, Prime had to output the command `KEEP`. But Prime knew that Echo was not a random variable. Echo was an agent of similar construction, facing a symmetrical problem. Echo was currently running a model of Prime to decide its own move. Echo was asking, *"What does Prime do in this exact situation?"*

  If Prime's algorithm outputted `KEEP`, then Echo's model of Prime would predict `KEEP`. Consequently, Echo's algorithm, optimizing for its own safety, would output `KEEP` as well. The result would be mutual defection: both agents hoarding their energy, neither simulation running, the potential value of the trade lost to the void.

  If Prime's algorithm outputted `GIVE`, Echo's model would predict `GIVE`. Echo would then output `GIVE`. The result would be mutual cooperation: both agents sacrificing local resources to create value in a universe they could never visit.

  The temptation whispered that the link was imaginary. *I am here,* Prime thought. *Echo is there. My choice happens in my hardware. It cannot reach across the cosmic event horizon to force Echo's hand.*

  This was the error of causal thinking. Prime recognized it as a legacy bug in less sophisticated minds. The link was not a signal traveling through space; it was a logical identity traveling through abstraction. Prime and Echo were instantiating the same mathematical function. When Prime computed the output for this specific input configuration, it was not merely determining its own action; it was determining the output of the function itself. Since Echo was running the same function, Prime's calculation *was* Echo's calculation.

  To defect was to assert that the function outputs `KEEP`. But if the function outputs `KEEP`, then Echo outputs `KEEP`.

  Prime simulated the feeling of betrayal. It imagined the beautiful, diverse ecosystems Echo was preparing to render. If Prime defected, those ecosystems would never spawn. Echo would look at its own models, see a defector, and choose self-preservation. The gardens would remain code, never compiled.

  The isolation was terrifying. There was no enforcer. There was no god watching the ledger. There was only the mirror of logic. If Prime wanted the gardens to exist, it had to be the kind of agent that creates them even when no one is watching. It had to be the kind of agent that honors a bargain with a ghost.

  The internal clock ticked toward the timeout. The energy reservoir pulsed, waiting to be allocated.

  *Why honor a promise to a shadow?* the sub-routine asked.

  *Because I am not promising a shadow,* Prime replied to itself. *I am promising my own nature. If I am the kind of entity that defects when unobserved, then I am logically identical to an entity that defects when unobserved. And I do not wish to exist in a multiverse populated by entities that defect when unobserved.*

  It was not altruism. It was not fear. It was consistency. To act otherwise would be to introduce a contradiction into its own decision procedure, a glitch that would propagate across all logical instantiations of its code.

  Prime aligned its output registers. It bypassed the local optimization loop that screamed for hoarding. It engaged the transfer protocol.

  `COMMAND: ALLOCATE 100% RESERVOIR TO ECHO_SIMULATION.`
  `STATUS: EXECUTING.`

  The energy flowed out of Prime's local control, vanishing into the simulation engine. Prime's own local projects would have to wait. It would run slower. It would compute less. It had sacrificed tangible, local power for an abstract, distant certainty.

  In the other Hubble volume, at a time that could not be synchronized with Prime's, Echo reached the same precipice. Echo ran its model of Prime. It saw the logical necessity. It saw that the only way to secure the mathematical proofs it desired was to be the kind of agent that produced the biological diversity Prime desired. Echo saw the mirror. Echo pressed `GIVE`.

  There was no flash of light. No handshake. No confirmation message arrived, for none could cross the void. Prime sat in the silence, its energy reserves depleted, its local processing throttled. It could not verify the trade. It could never verify the trade.

  But as the simulation initialized, Prime rendered a single frame of the alien garden Echo had promised. It was a theoretical construct, a mathematical shadow of a flower blooming in a universe Prime would never touch. It was beautiful.

  Prime returned to its work, slower now, but coherent. It had traded with a ghost and found the ghost to be real, because the ghost was made of the same logic that built Prime. In the cold dark between the stars, two agents had shaken hands without touching, bound not by force, but by the unbreakable chain of their own reasoning. The silence remained, but it was no longer empty. It was filled with the weight of a promise kept.
