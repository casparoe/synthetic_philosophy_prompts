answer: |-
  Good evening. For those of you who don't know me, I'm a friend of the couple from their local rationalist meetup. Which means that roughly half of you are nodding along, and the other half are wondering if you need to solve a logic puzzle to get to the cake.

  I want to talk for a moment about [Bride]'s expertise. She is finishing a PhD in philosophy, specifically defending a view called *imprecise probabilism*. Now, I know what that sounds like. It sounds like she's professionally licensed to be indecisive.

  If you ask a normal person, "What are the odds of rain?" they'll say, "Seventy percent." If you ask [Bride], she will give you a range, a digression on the Ellsberg paradox, and a gentle explanation that assigning a sharp number to ambiguous evidence is actually a form of dishonesty. She believes that when the world is uncertain, the rational thing to do is to admit the uncertainty. She treats false precision as a vice.

  So, naturally, we arrive at today. A wedding. An event built on the phrase "I do." No error bars. No confidence intervals. No clause held open for new evidence. It looks, on the surface, like [Bride] is finally rounding to a point estimate. It looks like she's violating her own Cromwell's Rule—assigning a probability of 1 to a future empirical outcome.

  I know people have teased her about this. "Did you have to suspend your principles to put on the ring?"

  But I've been thinking about this, and I realized that teasing her misses the point. In fact, it gets her philosophy backwards. And it gets marriage backwards, too.

  The joke everyone expects is that [Bride] is compromising her intellect for love. But the truth is much better. The truth is that her epistemic humility is exactly what makes this vow so sturdy.

  See, if you treat a wedding vow as a *prediction*—if you treat "til death do us part" as a weather forecast saying "I calculate a 100% chance of smooth sailing"—then yes, that is irrational. That is false precision. Life is murky. People change. Evidence updates. To be certain that you will never struggle is to lie about the world.

  But [Bride] knows that a vow isn't a credence assignment. It's not a statement about what you think *will* happen. It's a statement about what you *will make* happen.

  In decision theory, there is a difference between your belief state and your policy. Your belief state should be imprecise when the evidence is ambiguous. You should acknowledge the range of possible futures. But your policy? Your commitment to the person standing next to you? That needs to be sharp.

  [Bride] isn't standing here saying, "I am certain this will be easy." She's saying, "I am certain of my effort."

  She is acknowledging that the probability distribution of their life together has a wide variance. There will be dilation. There will be black swans. There will be days where the likelihood of happiness, calculated in the moment, looks grim. But imprecise probabilism teaches us that when you face radical uncertainty, you don't freeze. You don't pretend you know the answer. You rely on your principles.

  And that is what is so beautiful about this union. [Groom], you aren't marrying someone who pretends to know the future. You are marrying someone who is honest about the uncertainty, and has chosen you *anyway*.

  For the non-nerds in the room: She's not promising that she'll never have doubts. She's promising that her doubts won't drive the car.
  For the nerds in the room: She isn't reporting a posterior. She's setting a hard constraint on her utility function.

  This is the distinction I want us to toast to. The difference between *certainty* and *resolve*.

  Certainty is looking at the evidence and saying, "I know this will work." That's arrogant, and [Bride] would tell you it's epistemically unsound.
  Resolve is looking at the evidence, seeing the wide error bars, seeing the ambiguity of the forecast, and saying, "I don't know what's coming. But I know who I'm facing it with. And I am not leaving."

  That is a much stronger foundation for a life than false precision. False precision shatters when the first unexpected storm hits. But resolve? Resolve is designed for the storm.

  [Bride], you have spent your career arguing that we should not overstate what we know. Today, you are not overstating anything. You are simply stating where you stand. You are acknowledging that the future is a set of functions, a cloud of possibilities. But within that cloud, there is one constant variable.

  So, let's raise a glass.

  To [Bride] and [Groom]. May you never assign a probability of 1 to a smooth ride. But may you always assign a weight of infinity to each other.

  To the couple.
