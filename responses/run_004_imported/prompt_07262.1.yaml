      *   Okay, I will structure the toast to lead to that realization.

      *Let's refine the "Joke":*
      "People keep asking me if [Bride] had to violate Cromwell's Rule today. If she had to assign a probability of 1 to 'happily ever after.' And the answer is no. Because [Bride] knows that a wedding vow isn't a prediction about the future. It's a constraint on your behavior *regardless* of the future."
