answer: |-
  This is a fantastic observation, and it cuts right to the heart of a major debate in social ontology (the branch of philosophy that studies the nature of social reality). Given your background in physics, you are instinctively leaning toward **methodological individualism**: the idea that all social phenomena can and should be explained by the actions and properties of the individuals involved. If you swap out all the atoms, the object should be different, right?

  Your wife is leaning toward **holism** or **structuralism**: the idea that the system has properties that emerge from the interactions, which then constrain the individuals within it.

  Neither of you is strictly "wrong," but your wife is using a metaphor ("culture") to describe a very real, non-magical mechanism. Here is how a philosopher (and a systems thinker) might break down why your committee behaves like a single stubborn entity, even when the cells regenerate.

  ### 1. Emergent Properties (The Thermodynamics Analogy)
  In physics, you know that a single molecule does not have a "temperature." Temperature is an emergent property of the aggregate behavior of many molecules. If you replace all the molecules in a gas but keep the pressure and volume the same, the temperature remains.

  Similarly, "culture" is not a ghost in the machine. It is an emergent property of the **rules, incentives, and physical constraints** of the club.
  *   **The Constraint:** You have a fixed budget.
  *   **The Incentive:** Committee members likely want to avoid social conflict or being blamed for a failed purchase.
  *   **The Equilibrium:** Splitting the difference is a "local minimum" in the energy landscape of the committee. It requires the least amount of social energy to achieve, even if it isn't the global minimum (a working telescope).

  When new people arrive, they enter the same potential well. Unless someone actively adds energy to the system to push it out of that well, it will settle in the same spot every time.

  ### 2. The Script vs. The Actors
  There is a concept in sociology called **structuralism**. Imagine a play. The actors change every year, but the *script* remains the same.
  *   **The Script:** This isn't just written bylaws. It includes the unwritten rules: *"We don't let one faction win completely,"* or *"We must show activity every year, even if it's ineffective."*
  *   **The Audition:** There is also a selection bias. Who volunteers for the committee? Likely people who are already invested in the status quo or who are conflict-averse. The structure of the club filters for the kind of people who will reenact the drama.

  So, the club isn't a "person," but it is a **system with boundary conditions**. You are solving the same differential equation every year; you just changed the variables slightly. The solution converges to the same result.

  ### 3. Path Dependence (Hysteresis)
  In materials science, you have hysteresis, where the state of a system depends on its history. In social systems, this is called **path dependence**.
  *   The reason you are arguing about a mirror vs. a mount *this year* is because of the compromise made *five years ago*.
  *   That compromise created a telescope that is slightly unbalanced or under-equipped, which necessitates the argument today.
  *   Even with new people, they inherit the *physical reality* of the previous compromises. They are not starting from a blank slate; they are starting from the wreckage of the last "split the difference" decision.

  ### 4. Reification: Where Your Wife Might Be Sloppy
  You are right to be suspicious of the word "culture" if it implies the club has a soul or a brain. In philosophy, this is called **reification** (treating an abstract concept as a concrete thing).
  *   If your wife says, "The club *wants* to waste money," she is being sloppy. The club has no wants.
  *   If she says, "The club's structure *incentivizes* wasting money," she is being precise.

  However, in ordinary language, "culture" is a efficient shorthand for "a complex set of feedback loops, social norms, and institutional memories that persist across individual turnover."

  ### The Verdict
  Your wife is describing a real phenomenon, but you are right to demand a mechanism. The "dynamic" exists separately from the members in the same way that the **shape of a wave** exists separately from the water molecules. The molecules change, but the wave pattern persists because of the underlying physics of the medium.

  In your club, the "medium" is the combination of:
  1.  **Social friction:** It's harder to fight for one option than to compromise.
  2.  **Institutional memory:** Not in files, but in the lingering dissatisfaction of the membership that pressures the new committee.
  3.  **Resource scarcity:** The budget forces a zero-sum game.

  **A Philosophical Experiment:**
  If you want to test this, try to change the **boundary conditions** rather than the people.
  *   Propose a rule: "We only buy if we can fund 100% of one item."
  *   Propose a rule: "We alternate years; this year is strictly for mounts, next for mirrors."

  If the "culture" is real (systemic), changing the rules should break the cycle even with the same people. If the cycle persists despite rule changes, then it really is just a collection of conflict-averse individuals, and your reductionist view wins.

  **Summary:** Your wife isn't being sloppy; she's being a sociologist. You aren't being pedantic; you're being a physicist. The truth is likely that the *structure* of the committee acts as a mold, and no matter who pours themselves into it, they harden into the same shape.
