answer: |-
  This is actually a fantastic question, especially given that it came up in a **journalism and review-writing class**. While your logic makes sense in a casual, pragmatic way, Diego is actually the one who is correct here—particularly within the context of criticism and journalism.

  Here is the breakdown of why this distinction matters, why art is different from dentists, and where the line between "smart trust" and "dishonesty" gets drawn.

  ### 1. The "Have You?" Trap
  The biggest issue isn't necessarily saying the movie is good; it's answering **"Yeah"** to the question **"Have you seen/heard it?"**

  If someone asks, "Is this dentist good?" and you say, "I haven't gone yet, but my friend says she's great," that is honest.
  If someone asks, "Have you been to this dentist? Are they good?" and you say, "Yeah, they're great" (when you haven't), you are lying about your **experience**, not just the quality of the service.

  In journalism and criticism, **experience is the currency.** A review is not just a verdict (Good/Bad); it is a record of an interaction between a human and a work of art. By saying you've seen it when you haven't, you are fabricating your own biography.

  ### 2. Art vs. Utilities (The Dentist Argument)
  Your argument about the dentist or restaurant is logical, but it misses a key difference between **utilities** and **art**.

  *   **A Dentist/Restaurant:** These are functional. The goal is objective (clean teeth, edible food) or broadly subjective (tasty food). If Maya says the pasta is good, she is reporting on the quality of the ingredients and cooking. You can trust that data without eating it yourself.
  *   **A Movie/Album:** These are experiential. The "value" of a movie isn't just in the technical execution; it's in how it made the viewer *feel*, what themes resonated, and how it was interpreted.

  When you recommend a dentist, you are vouching for their **competence**. When you recommend a movie, you are vouching for a **shared emotional experience**. If you say a movie is "good" without seeing it, you are claiming to have had an emotional reaction that you didn't actually have. That is fundamentally different than trusting someone to drill your cavity.

  ### 3. The Journalism Context
  Since this is bothering you because of your journalism class, let's look at it through that lens. In professional criticism:

  *   **Authenticity is everything.** A critic's authority comes from the fact that they did the work. They sat in the theater. They listened to the album.
  *   **Aggregation is not Criticism.** If a journalist writes a review saying "This movie is 5 stars" based solely on Rotten Tomatoes scores without watching it, they would be fired. That is considered fabrication.
  *   **The "Why" matters.** If a friend asks *why* a show is good, and you say "The character development in episode 3 was insane," but you haven't seen episode 3, you are now actively deceiving them. Maya's reasons might not be *your* reasons.

  ### 4. Why Diego is Right (But You're Not a Bad Person)
  Diego is right that it is dishonest, but you aren't doing it with malicious intent. You are doing it because Maya is a **Trusted Curator.**

  However, by claiming the opinion as your own, you are accidentally doing two negative things:
  1.  **Erasing Maya:** You are taking the social capital she earned through her good taste and absorbing it yourself.
  2.  **Risking Your Credibility:** Maya is 99% right. But what if that 1% happens? If you tell someone a movie is great, they watch it, hate it, and then find out you never even watched it, you look untrustworthy. If you say, "I haven't seen it, but Maya has, and she says it's great," and they hate it, the blame falls on Maya's taste, not your honesty.

  ### The Verdict
  **Diego wins this round.**

  Trusting Maya's judgment is smart. **Claiming you experienced the art yourself is dishonest.**

  In a journalism context, this is a clear ethical breach. In a friendship context, it's a "white lie" that undermines your integrity as a critic.

  ### The Fix
  You can keep being smart about trusting Maya without lying. In fact, crediting her makes you look *more* knowledgeable because it shows you know whose taste aligns with yours.

  *   **Instead of:** "Yeah, I saw it, it's really good."
  *   **Try:** "I haven't gotten to it yet, but Maya saw it and she said it's incredible, and she's never wrong about this stuff. So I'm expecting it to be great."

  This way, you are being honest about your engagement, you are validating Maya (which she deserves!), and you are still giving your friend a helpful recommendation. Plus, in your journalism class? That's the kind of nuance that gets you an A.
