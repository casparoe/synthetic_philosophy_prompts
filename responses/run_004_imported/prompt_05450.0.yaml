          *   *Draft Q:* Why be moral?
          *   *Refinement:* If morality is projected, does it lose its grip?
          *   *Follow-up:* She might say "It's still your attitude." Push on the *authority* of that attitude.

      *   *Topic 10: The "Error" in Error Theory*
