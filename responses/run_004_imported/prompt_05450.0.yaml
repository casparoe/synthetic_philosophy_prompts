answer: |-
  Here are 10 questions designed to push past the standard "attitudes toward attitudes" explanation, including the four specific thematic constraints you requested. Each includes a likely "dodge" and a targeted follow-up.

  ### 1. The Negation Problem (Required)
  **Question:** "Let's start with the negation problem. If 'Stealing is wrong' expresses a first-order disapproval, standard expressivism struggles to explain why 'Stealing is *not* wrong' contradicts that claim rather than just expressing an absence of disapproval (like indifference or tolerance). Your view says moral sentences express attitudes toward attitudes. So, does 'Stealing is not wrong' express a second-order approval of *not* disapproving? If so, how do you guarantee that this stands in a contradictory relation to the original claim, rather than just being a different, compatible attitude?"

  *   **Likely Dodge:** She will likely argue that the inconsistency lies in the *incompatibility of the attitudes themselves*, not the sentences.
  *   **Follow-up:** "But incompatibility of attitudes sounds like a psychological clash, not a logical contradiction. If I can psychologically hold both attitudes without exploding, haven't you reduced logical negation to mere emotional incompatibility? How do you get the *normative force* of contradiction—that I *ought not* hold both—from that?"

  ### 2. The Regress of Higher-Order Attitudes (Required)
  **Question:** "You solve the Frege-Geach problem for conditionals by positing a second-order attitude toward the combination of first-order attitudes. But moral reasoning gets complex quickly: we have conditionals inside conditionals, or disjunctions of negations. Do these require third-order or fourth-order attitudes? At what point does this stop being a principled semantic logic and start looking like an ad hoc engineering project where you just keep stacking attitudes until the inference patterns match propositional logic?"

  *   **Likely Dodge:** She will likely claim the system is recursive and finite, so no actual infinite regress occurs.
  *   **Follow-up:** "Recursion avoids an infinite regress, but does it avoid explanatory opacity? If the semantic content of a complex sentence is a massively nested attitude structure that no human actually psychologically token, in what sense is that a theory of *meaning* rather than just a formal model of validity?"

  ### 3. Validity and Modus Ponens (Required)
  **Question:** "In a realist framework, Modus Ponens is valid because truth is preserved from premises to conclusion. On your view, there are no moral truth-conditions to preserve. So, what actually makes moral Modus Ponens *valid* on your account? Is it that rationality forbids holding the premises' attitudes without the conclusion's attitude? If so, isn't validity just a description of a psychological constraint we happen to have, rather than a normative rule of inference?"

  *   **Likely Dodge:** She will likely distinguish between "being psychologically compelled" and "being rationally required," appealing to norms of rationality.
  *   **Follow-up:** "Where do those norms of rationality come from if not from the structure of the world or truth? If they are just internal standards of the attitude system, doesn't that make moral logic akin to the 'logic' of preferring vanilla over chocolate? It binds you, but it doesn't seem *valid* in the robust sense."

  ### 4. Gibbard and Hyperplan Semantics (Required)
  **Question:** "Allan Gibbard's norm-expressivism uses 'hyperplans' to handle embedding, which function very much like truth-conditions in terms of how they determine validity. Critics argue this smuggles cognitivism back in through the semantics door, even if you deny it in the ontology. Does your 'attitudes toward attitudes' view risk the same collapse? If your higher-order attitudes do all the functional work of truth-conditions, what substantive difference is left between your quasi-realism and a lightweight moral realism?"

  *   **Likely Dodge:** She will likely insist that hyperplans/attitudes are still *non-representational* states, unlike beliefs.
  *   **Follow-up:** "But if they play the exact same semantic role as representational states—determining consistency, validity, and negation—does the 'non-representational' label do any heavy lifting? Are we fighting over the metaphysics of the mental state, while agreeing on everything that matters for logic and language?"

  ### 5. The Phenomenology of Disjunction
  **Question:** "Let's look at disjunctions. If I say, 'Either stealing is wrong or taxation is wrong,' what attitude am I expressing? It doesn't seem like I'm disapproving of a combination of attitudes, since I'm not endorsing either disjunct. Do I have to have a specific, tokened higher-order attitude toward the *uncertainty* between the two? If I haven't actually formed that complex attitude, does my sentence lack meaning?"

  *   **Likely Dodge:** She will likely say the meaning is dispositional; I am *prepared* to form the attitude if forced to choose.
  *   **Follow-up:** "If meaning is dispositional, doesn't that apply equally to realist claims? A realist might not have a settled view on the moral fact but is disposed to find it. If the dispositional story works for both, does expressivism still offer a simpler explanation of linguistic competence?"

  ### 6. The Nature of Moral Disagreement
  **Question:** "When two people disagree morally, it feels like we are contradicting each other about a subject matter, not just revealing a clash of preferences. On your view, disagreement is inconsistent attitudes. But why do we try to *persuade* each other with arguments rather than just trying to causally manipulate each other's attitudes? If there's no shared truth we're aiming at, what makes moral argumentation distinct from therapeutic intervention?"

  *   **Likely Dodge:** She will likely argue that we share higher-order norms about which attitudes are consistent, and argumentation reveals inconsistencies.
  *   **Follow-up:** "But if I accept that my attitudes are inconsistent with yours, I can just say, 'So what? I'm inconsistent.' Without a truth-aim, where does the *obligation* to resolve the inconsistency come from? Why is consistency a virtue in ethics if not because it tracks something real?"

  ### 7. Quasi-Realism's "Earned Right"
  **Question:** "Quasi-realism claims to 'earn the right' to talk as if moral claims are true. But once you've earned that right, and you're using truth-predicates, and you're validating logical inferences, how do you explain to a layperson why you aren't just a realist? Is the distinction purely metaphysical, or does it have any cash value in how we actually practice ethics?"

  *   **Likely Dodge:** She will likely emphasize ontological parsimony; we get the talk without the "queer" moral properties.
  *   **Follow-up:** "But if the semantic cost of avoiding those properties is positing complex higher-order attitude structures for every logical operator, have you really gained parsimony? Have you just shifted the complexity from the metaphysics to the semantics?"

  ### 8. Moral Mistakes vs. Logical Mistakes
  **Question:** "On your view, is there a difference between making a moral mistake (thinking something is wrong when it isn't) and making a logical mistake (holding inconsistent attitudes)? If a sociopath has perfectly consistent attitudes that approve of murder, have they made a mistake on your view? If not, does your view lose the critical bite morality is supposed to have?"

  *   **Likely Dodge:** She will likely say the sociopath is guilty of a substantive normative error, not just a formal logical one.
  *   **Follow-up:** "But if that substantive error isn't a failure to track a fact, what is it a failure *of*? If it's just a failure to share *our* attitudes, doesn't that make morality tribal? How do you condemn the sociopath without appealing to a standard outside of our shared attitude set?"

  ### 9. The Explanation of Supervenience
  **Question:** "Moral properties seem to supervene on natural properties; if two acts are identical in natural respects, they must be identical in moral respects. Realists explain this via the nature of properties. How does an expressivist explain supervenience? Is it just that we wouldn't *tolerate* inconsistent attitudes toward identical natural cases? If so, is supervenience a necessary truth or just a contingent feature of our psychology?"

  *   **Likely Dodge:** She will likely argue it's a conceptual truth about what it means to have a moral attitude.
  *   **Follow-up:** "If it's conceptual, does that mean a being who didn't care about consistency in their attitudes wouldn't be subject to moral supervenience? That suggests morality is contingent on us having a specific psychological architecture, which seems to weaken its normative authority."

  ### 10. The "So What?" Question
  **Question:** "Finally, why does this matter? If quasi-realism allows us to keep all our moral practices, logic, and truth-talk, why should we care that the underlying metaphysics is expressivist? What practical or theoretical work is the 'expressivist' part of the view doing, other than satisfying a philosophical preference for naturalism?"

  *   **Likely Dodge:** She will likely say it prevents metaphysical confusion and demystifies ethics.
  *   **Follow-up:** "But does demystifying ethics risk deflating it? If people come to believe your view—that morality is ultimately about our attitudes rather than the world—does that change how they value morality? If the view is self-effacing (better if people don't believe it), is that a problem for its truth?"
