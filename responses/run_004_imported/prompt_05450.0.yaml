      *   *Topic 3: Modus Ponens/Validity (Required)*
          *   *Idea:* Why is the inference *valid*? In realism, truth is preserved. In expressivism, what is preserved?
          *   *Draft Q:* Why is modus ponens valid?
          *   *Refinement:* Distinguish between "we feel compelled to infer" vs. "the inference is normatively binding."
          *   *Follow-up:* She might say "Rationality requires it." Push on the source of that requirement.

      *   *Topic 4: Gibbard/Hyperplans (Required)*
          *   *Idea:* Gibbard uses plans/norms. Does this look like truth conditions?
          *   *Draft Q:* Isn't Gibbard just a cognitivist?
          *   *Refinement:* Focus on the "smuggling" aspect. If hyperplans function like truth conditions, what's left of expressivism?
          *   *Follow-up:* She might distinguish "representing the world" vs. "planning." Push on whether the *semantics* differ in practice.

      *   *Topic 5: Embedding beyond Conditionals (Disjunctions)*
          *   *Idea:* Frege-Geach isn't just "If." It's "Either P or Q." What attitude is that?
          *   *Draft Q:* How do disjunctions work?
