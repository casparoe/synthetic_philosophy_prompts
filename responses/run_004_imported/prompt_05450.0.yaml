              4.  Gibbard's Hyperplan Semantics (smuggling in cognitivism/truth-conditions).
          *   Format: Each question needs a specific follow-up keyed to a likely dodge.

  2.  **Deconstruct the Guest's Position (Higher-Order Expressivism):**
      *   *Standard Expressivism:* "Stealing is wrong" = I disapprove of stealing.
      *   *Frege-Geach Problem:* How does "If stealing is wrong, then getting your brother to steal is wrong" work? It's not just expressing an attitude; it's unasserted.
      *   *Guest's Solution:* Higher-order attitudes. "If P then Q" expresses an attitude toward the combination of attitudes expressed by P and Q. Specifically, disapproval of holding P's attitude without Q's attitude.
      *   *Quasi-Realism:* Trying to earn the right to talk *as if* moral claims are truth-apt without actually being realist about moral properties.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: The Negation Problem (Required)*
          *   *Idea:* If "Wrong" = Disapprove, then "Not Wrong" = Not Disapprove. But "Not Disapprove" includes indifference. Moral negation seems stronger (it contradicts).
          *   *Draft Q:* How do you handle negation?
          *   *Refinement:* Make it sharper. Focus on the distinction between tolerance/indifference and genuine contradiction.
          *   *Follow-up:* She might say "It's about inconsistency of attitudes." Push on whether that inconsistency is logical or psychological.

      *   *Topic 2: Regress/Ad Hoc (Required)*
          *   *Idea:* If conditionals need 2nd order attitudes, do conditionals inside conditionals need 3rd order? Does this get messy?
