          *   *Follow-up:* She might say "It's a complex attitude." Ask for the specific phenomenology.

      *   *Topic 6: The "Quasi" in Quasi-Realism*
          *   *Idea:* If you earn the right to say "It's true that stealing is wrong," are you just a realist?
          *   *Draft Q:* Are you a realist in disguise?
          *   *Refinement:* Focus on the *explanatory* difference. If the output is the same, why prefer expressivism?
          *   *Follow-up:* She might say "Ontological parsimony." Push on whether that parsimony is lost in the semantic complexity.

      *   *Topic 7: Moral Disagreement*
          *   *Idea:* If I disapprove and you approve, we don't contradict unless there's a fact. How do you explain *faultless* vs. *faultful* disagreement?
          *   *Draft Q:* How do we disagree?
          *   *Refinement:* Focus on the *clash*. Is it just a clash of desires?
          *   *Follow-up:* She might say "Inconsistent attitudes." Push on why we try to *persuade* rather than just fight.

      *   *Topic 8: The Phenomenology of Deliberation*
          *   *Idea:* When I think "Is this wrong?", it feels like finding a fact.
          *   *Draft Q:* Does it feel like finding a fact?
          *   *Refinement:* Does your view distort what it feels like to do ethics?
          *   *Follow-up:* She might say "Phenomenology is misleading." Push on whether metaethics should track phenomenology.

      *   *Topic 9: Normative Authority*
