      *   **The Text:** A text message is not a legal contract (consideration is murky, intent to create legal relations is low, damages are small). It's cheap talk.
      *   **Psychology:** Some people have internal moral compasses. Others don't. The text forces a moment of conscious commitment, which *might* trigger guilt in a decent person, but won't stop a sociopath or a purely opportunistic person.

