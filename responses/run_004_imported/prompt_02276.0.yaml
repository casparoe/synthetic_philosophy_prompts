      *   **Rule:** "First come, first served" determines the split (whoever claims it decides). This is a classic "Prisoner's Dilemma" or "Trust Game" setup.
      *   **Constraints:** No third-party enforcement (counselors, escrow), no future interaction (one-off game), anonymity/privacy once they leave.
