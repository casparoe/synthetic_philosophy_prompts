      *   **The Game:** This is a one-shot Prisoner's Dilemma.
          *   Cooperate (Split 50/50): Both get 50%.
          *   Defect (Take all): Defector gets 100%, Cooperator gets 0%.
          *   Mutual Defect (Race to the desk): Chaos, potential conflict, maybe one gets 100%, maybe both get nothing if it causes a scene.
      *   **Incentives:** Rational self-interest suggests defecting (taking all) is the dominant strategy *if* there are no consequences.
