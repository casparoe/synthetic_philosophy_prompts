  **S Tier: Malament–Hogarth Spacetime**
  This proposal rests on valid solutions to Einstein's field equations (such as Kerr black holes) where global spacetime geometry allows one observer to experience infinite proper time while another experiences only finite time. Unlike other hypercomputation models, it does not require local violations of physics like infinite energy density or superluminal signaling, but rather exploits the causal structure of general relativity. If such spacetimes exist and are stable against perturbation, they genuinely permit the physical computation of non-recursive functions like the Halting Problem.

  **F Tier: Garden-Variety Quantum Computer**
  Quantum computers operate via unitary evolution on finite-dimensional Hilbert spaces, which can be simulated (albeit inefficiently) by a classical Turing machine to arbitrary precision. They provide exponential speedups for specific complexity classes (like factoring integers) but do not expand the set of computable functions beyond the recursive languages. Conflating computational complexity (how fast) with computability theory (what is possible) is a fundamental category error that does not threaten the Church-Turing thesis.
