answer: |-
  This is one of those philosophical "gears" that, once you see it turn, makes the whole machine of epistemology and decision theory click into place. You are right to be suspicious of people who just assert the distinction without showing the plumbing.

  Here is the gut-level walkthrough of why the Oswald examples break a naive unified semantics, and how that connects directly to the EDT/CDT split you've seen on LessWrong.

  ### Part 1: The Oswald Mechanics (Map vs. Territory)

  To understand why a single "possible worlds" engine struggles here, we have to look at what work the sentences are actually doing.

  **Sentence (1): "If Oswald didn't shoot Kennedy, someone else did." (Indicative)**
  *   **The Anchor:** We are standing in the **actual present**. We accept as fixed, undeniable facts: *Kennedy is dead.* A bullet killed him.
  *   **The Operation:** We are performing **belief revision**. We are saying, "Okay, temporarily remove 'Oswald' from the list of suspects. Given that the body is still on the floor, who is the next most likely candidate?"
  *   **The Logic:** This is epistemic. It tracks information. Since we know $A \lor B$ (Oswald or Someone Else) is true, and we suppose $\neg A$, then $B$ must be true.
  *   **Verdict:** **True.** (Because JFK is definitely dead).

  **Sentence (2): "If Oswald hadn't shot Kennedy, someone else would have." (Counterfactual)**
  *   **The Anchor:** We are standing in the **past**, just before the shot. We accept as fixed facts: *The causal laws of the universe, the security setup, Oswald's intent.*
  *   **The Operation:** We are performing a **causal intervention**. We are saying, "Rewind time to 12:30 PM. Magically prevent Oswald from pulling the trigger. Hit play. What happens?"
  *   **The Logic:** This is ontic (about reality). It tracks causality. In this timeline, there was no backup plan. If Oswald stops, the bullet doesn't fly.
  *   **Verdict:** **False.** (Because JFK would be alive).

  **The "Aha" Moment:**
  A naive possible-worlds semantics (like early Stalnaker) says: *To evaluate "If A then B," find the closest possible world where A is true, and check if B is true there.*

  The problem is: **Which world is "closest"?**
  *   For the **Indicative**, the "closest" world is one that preserves our *current knowledge* (JFK is dead). We are willing to rewrite history (maybe there was a second shooter we didn't know about) to keep our current observations consistent.
  *   For the **Counterfactual**, the "closest" world is one that preserves *causal history* up to the moment of intervention. We are willing to rewrite the present (JFK lives) to keep the causal chain consistent.

  If you try to use one single "closeness metric" for both, you fail. You can't have a world that is simultaneously "closest to reality" in terms of *outcome* (JFK dead) and *history* (Oswald innocent). The two sentences prioritize different things to hold fixed.

  ### Part 2: Adams vs. Lewis (Probability vs. Worlds)

  This is where the semantic theories diverge, and why people say they need separate treatments.

  **Ernest Adams (The Indicative View):**
  Adams argued that indicatives don't really have truth conditions at all. You can't point to a world and say "That sentence is true there." Instead, indicatives measure **assertibility**.
  *   **The Rule:** You accept "If A, then B" to the degree that you believe $P(B|A)$.
  *   **In Oswald (1):** What is the probability someone else shot him, *given* Oswald didn't? Since we know *someone* shot him, that probability is 100%.
  *   **The Vibe:** Indicatives are about **updating the map**. They tell you how your beliefs should shift if you learn new information.

  **David Lewis / Robert Stalnaker (The Counterfactual View):**
  They argued counterfactuals *do* have truth conditions based on **similarity between worlds**.
  *   **The Rule:** "If A had happened, B would have" is true if, in the most similar world where A is true, B is also true.
  *   **In Oswald (2):** We look for the world most similar to ours where Oswald freezes his finger. In that world, does JFK die? No. The worlds where JFK dies *and* Oswald doesn't shoot require a "miracle" (a second shooter appearing out of nowhere). That makes the world less "similar" (more distant) than the world where JFK simply lives.
  *   **The Vibe:** Counterfactuals are about **editing the territory**. They tell you how the universe responds to changes.

  **Why they can't be easily unified:**
  If you try to treat the Indicative as a Counterfactual (using Lewis's world-similarity), you get the wrong answer for (1). The "closest world where Oswald didn't shoot" is one where JFK lives, making (1) false. But (1) is intuitively true.
  If you try to treat the Counterfactual as an Indicative (using Adams' conditional probability), you get the wrong answer for (2). $P(\text{JFK dies} | \text{Oswald doesn't shoot})$ is low, but if you condition on "JFK is dead" (as the indicative does), it becomes high.

  One tracks **evidence** (Indicative/Adams); the other tracks **causation** (Counterfactual/Lewis).

  ### Part 3: The Decision Theory Rhyme (EDT vs. CDT)

  Your hunch is spot on. This is not a coincidence; it is the *same* distinction applied to action rather than language.

  **Evidential Decision Theory (EDT) $\approx$ Indicative Conditionals**
  *   **The Logic:** EDT asks, "What is the probability of a good outcome *given that* I take this action?" ($P(O | A)$).
  *   **The Oswald Parallel:** This is exactly Sentence (1). It treats your action as *evidence* about the state of the world.
  *   **The Trap:** In Newcomb's Problem, EDT says: "If I one-box, that is *evidence* that the Predictor put money in the box. So I should one-box." It treats the choice as information to update on, like learning "Oswald didn't shoot."
  *   **Smoking Lesion:** EDT says: "If I smoke, that is evidence I have the lesion. So I shouldn't smoke." It confuses correlation with causation.

  **Causal Decision Theory (CDT) $\approx$ Counterfactual Conditionals**
  *   **The Logic:** CDT asks, "What would happen *if I were to make* this action happen?" ($P(O | \text{do}(A))$). This uses Pearl's $do$-operator.
  *   **The Oswald Parallel:** This is exactly Sentence (2). It treats your action as an *intervention* that breaks causal chains.
  *   **The Solution:** In Newcomb's Problem, CDT says: "The money is already there or not. My choice now cannot *cause* the past to change. If I take both, I get more money regardless of the past."
  *   **Smoking Lesion:** CDT says: "Smoking doesn't *cause* the lesion. So I can smoke."

  **The Deep Connection:**
  The reason rationalists obsess over Newcomb problems is that they expose the crack between **learning** and **acting**.
  *   **Indicatives/EDT** assume you are an observer updating a probability distribution. You are *inside* the causal graph, passively watching nodes light up.
  *   **Counterfactuals/CDT** assume you are an agent wielding a surgical knife. You are *outside* the causal graph, cutting a node and forcing it to a value.

  When people say "Indicatives and Counterfactuals need different semantics," they are saying: **"Updating on news is fundamentally different than making a choice."**

  ### Summary: The Gut-Level Takeaway

  1.  **The Oswald Test:**
      *   **Indicative (1):** Holds the *outcome* fixed (JFK dead), changes the *cause*. (Epistemic/Map)
      *   **Counterfactual (2):** Holds the *cause* fixed (Oswald's intent), changes the *outcome*. (Ontic/Territory)
      *   **Failure of Unified Semantics:** You can't use one "closeness" ruler to measure both, because they measure distance from different anchor points (Current Knowledge vs. Causal History).

  2.  **The Decision Theory Link:**
      *   **EDT** treats actions like **Indicatives**: "What does my action *tell me* about the world?" (Prone to spurious correlations like the Smoking Lesion).
      *   **CDT** treats actions like **Counterfactuals**: "What does my action *do to* the world?" (Prone to ignoring logical correlations like in Newcomb's/Parfit's Hitchhiker).

  The reason this bugs you is that English uses the same word ("If") for two completely different cognitive operations: **inference** (figuring out what is true) and **intervention** (figuring out what to do). The Oswald examples are the canonical "stress test" that forces those two operations to reveal they are running different code.
