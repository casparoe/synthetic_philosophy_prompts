  **Justifications**

  **(1) Marcus (+1):** Marcus correctly articulates the core intuition behind Cummins' Causal-Role (CR) account: functions are identified relative to a containing system's capacity. However, his claim that this is the function "full stop" ignores the well-known problem of normativity (malfunction), making his position vulnerable to the immediate rebuttal.

  **(2) Elena (+2):** Elena deploys the standard and decisive objection to pure CR accounts: the problem of overgeneration (or the "distinction problem"). By highlighting that not all causal effects (e.g., heart sounds) are functions, she correctly identifies that CR lacks the resources to distinguish proper functions from incidental effects without appealing to norms, which history provides.

  **(3) Marcus (+1):** Marcus effectively raises the "exaptation" or "ancestral function" problem for Etiological (SE) accounts. If history fixes function, early feathers functioned for insulation. His critique that restricting history to "recent" selection risks circularity is a valid philosophical concern, though it slightly underestimates the technical resources SE theorists have to define trait identity.

  **(4) Elena (+2):** Elena accurately presents the sophisticated Neanderian response to the exaptation problem. By anchoring function to the selective regime that maintains the *current* trait variant (rather than the trait's origin), she defends the objectivity of the cutoff against the charge of stipulation, successfully parrying Marcus's attack on SE's coherence.

  **What Is Overlooked**

  Both students operate under the assumption of **Functional Monism**—that there is a single concept of "function" that must be either historical or causal. A fuller account would likely embrace **Functional Pluralism** (e.g., Godfrey-Smith, Millikan), acknowledging that "function" is polysemous: biologists legitimately use an etiological sense when discussing adaptation (proper function) and a causal-role sense when discussing physiological mechanisms (system function). Furthermore, both overlook the **Organizational Account** (Mossio, Saborido), which grounds normativity in the self-maintaining organization of the system rather than history, offering a third way to solve the normativity problem without relying solely on past selection.
