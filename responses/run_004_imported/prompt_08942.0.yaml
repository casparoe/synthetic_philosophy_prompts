prompt: |-
  I host a small philosophy podcast that a few of us run through my high school's philosophy club, and next week's guest is a philosopher of religion known for defending the hiddenness argument against the existence of God -- the line of reasoning, developed out of J. L. Schellenberg's work, that moves from the existence of reasonable, nonresistant nonbelief to the conclusion that no perfectly loving God exists. Draft eight to ten interview questions that go beyond having her simply restate the argument. I want at least one question on why she thinks this line of reasoning succeeds independently of the traditional problem of evil rather than being that argument in a different guise, at least one on how she would answer the worry that "nonresistant nonbelief" is defined so loosely that any hard case can always be reclassified as secretly resistant, and at least one on whether the "hiddenness is a filter for readiness" reply can survive the fact that plenty of devout, searching believers report their own periods of nonresistant doubt. For each question, include a follow-up keyed to the answer she is most likely to give.
