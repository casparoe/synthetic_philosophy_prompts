      *   **Arrhenius's Impossibility Theorems:** You cannot satisfy a set of seemingly plausible adequacy conditions (e.g., Dominance, Non-Elitism, Weak Non-Sadism) simultaneously when ranking populations. Any theory will violate at least one condition, leading to counterintuitive results (Repugnant Conclusion, Sadistic Conclusion, etc.).
      *   **Key Insight:** This is a problem for *ideal* moral theories aiming to rank *all possible* populations. It highlights logical inconsistencies in our intuitions when scaled to the extreme.

  3.  **Evaluate Relevance to Personal Decision-Making:**
