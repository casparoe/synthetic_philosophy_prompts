  1.  **Analyze the User's Situation:**
      *   **Context:** The user and their partner are deciding whether to have a third child.
      *   **Trigger:** The user recently learned about the "Repugnant Conclusion" and Gustaf Arrhenius's Impossibility Theorems in population ethics.
