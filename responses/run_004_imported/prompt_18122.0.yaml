answer: |-
  **Setting:** *A park bench on a crisp autumn afternoon. Two old colleagues, ELENA (an eternalist, formerly a theorist) and MARCUS (a presentist, formerly an experimentalist), are watching leaves drift down. The conversation has been running for some time.*

  **Elena:** You're staring at that oak tree like it's hiding a secret, Marcus.

  **Marcus:** Just thinking about the "now." When that leaf detached, was it real? Or is it just a coordinate in a block that's always been there?

  **Elena:** We're back to the Andromeda paradox, aren't we? Look, I know you hate the Rietdijk-Putnam-Penrose argument, but the geometry is unforgiving. Two observers walking past each other at different velocities have different planes of simultaneity. If I'm walking toward Andromeda, my "now" slices through a fleet invasion launching. If you're walking away, your "now" slices through a peace council. If both "nows" are equally valid reference frames, and reality is frame-independent, then both the invasion and the council must exist.

  **Marcus:** That's the leap I can't swallow, Elena. You're conflating *coordinate* simultaneity with *ontological* simultaneity. SR tells us about signal propagation and clock synchronization. It tells us what we can *measure*. It doesn't tell us what *exists*. Just because my "now" slice is tilted relative to yours doesn't mean the events on my slice are ontologically on par with the events on yours.

  **Elena:** But that requires you to posit a "true" slice. A privileged frame of reference. And SR explicitly tells us that such a frame is empirically inaccessible. The Lorentz symmetry is exact. To say there's a hidden "true now" that nature conspires to hide from us via time dilation and length contraction… that smells like phlogiston. It's structure you add to the theory that does no empirical work.

  **Marcus:** It does metaphysical work. It saves the phenomenon of passage. But let's talk about "empirical work." You say the privileged frame is undetectable *within SR*. I agree. But we don't live in a universe of pure SR. We live in a universe with Quantum Mechanics.

  **Elena:** Ah. The Hail Mary.

  **Marcus:** Not a Hail Mary. A structural hint. You know as well as I do that standard QM is non-local. Bell's inequalities kill local hidden variables. If you want a realist interpretation of QM—say, Bohmian mechanics—you need a preferred foliation of spacetime to make sense of the non-local guidance equation without running into causal loops. In Bohmian terms, the "configuration" of the universe evolves with respect to a specific time parameter. That parameter looks an awful lot like a privileged present.

  **Elena:** You're betting the farm on Bohm? It's a minority interpretation for a reason. It's non-covariant by design. Most of us think the solution is to find a covariant quantum theory, or accept Many-Worlds, where the block universe fits comfortably.

  **Marcus:** But that's my point. The "standard" Copenhagen view is vague about ontology. The "elegant" Many-Worlds view blows up the ontology exponentially. But if you look at Objective Collapse theories, like GRW, there is a tension with relativity. To define when a collapse happens objectively, you need a notion of simultaneity. If collapse is real and physical, it happens *somewhere* and *somewhen*. If it's instantaneous across space, you have a preferred frame.

  **Elena:** There are relativistic collapse models, Marcus. "Flash" ontologies. They manage to keep Lorentz invariance at the statistical level.

  **Marcus:** At the statistical level, yes. But the underlying process? Look, I'm not saying QM *proves* Presentism. I'm saying it removes the sting of the "ad hoc" accusation. You charge Neo-Lorentzianism with bolting on unfalsifiable structure. I'm saying: "What if the structure isn't bolted on? What if it's the scaffolding required to make QM and GR talk to each other?" If a preferred frame is already suggested by the need to resolve non-locality in a realist QM, then positing it for the sake of time isn't adding *new* invisible structure. It's utilizing structure that might already be there for other reasons.

  **Elena:** That's a "might." And it's a big one. You're essentially arguing that because one difficult interpretation of QM *could* use a preferred frame, we should dismantle the geometric insight of Minkowski spacetime. The beauty of the Block Universe is that it treats space and time on equal footing. The metric is invariant. Your Neo-Lorentzian view treats time as special, but then has to explain why the laws of physics disguise that specialness so perfectly. Why does nature hide the "true now" so effectively that even the speed of light conspires to mask it?

  **Marcus:** Nature doesn't have to "conspire." That's the wrong verb. It implies intent. Think of it like the horizon. I can't see what's over the horizon. Does that mean the land over there doesn't exist? No. But my *access* is limited by the geometry of light. In SR, the "conspiracy" is just the limit of causal contact. The privileged frame exists, but the laws of interaction (electromagnetism, etc.) are Lorentz invariant, so we can't use them to find the frame. That's not a conspiracy; that's a constraint on measurement.

  **Elena:** But in the horizon case, I can walk over the hill. I can verify the land. In your Neo-Lorentzian case, you've defined the frame such that *no physical interaction* can reveal it. If a difference makes no difference to any possible observation, even in principle, have you actually described reality? Or have you just described a psychological preference for a "moving now"?

  **Marcus:** I've described the condition for *change*. In a block, nothing changes. Things just *are* at different coordinates. Change requires that some things exist and others do not *yet*. If you deny that, you deny the asymmetry of causation.

  **Elena:** Causation is preserved in the block via the light cone structure. Past influences future, not vice versa, because of the metric signature. You don't need an ontological "now" to protect causality. You just need the geometry. And frankly, Marcus, Occam's Razor isn't just a chant. It's about not multiplying entities beyond necessity. Minkowski spacetime explains the null results of Michelson-Morley, the time dilation of muons, and the GPS corrections with a single geometric object. Neo-Lorentzianism explains them with a dynamic ether *plus* a conspiracy of contraction effects that perfectly mimic geometry. The geometric explanation is simpler.

  **Marcus:** Simpler, yes. But is it *complete*? You're cutting off the head to cure a headache. You're saying the "feeling" of time passing is an illusion because the geometry is cleaner. I'm saying the geometry is a projection of a deeper, evolving reality. And regarding Occam: if QM requires a foliation to be realist, then the foliation *is* necessary. It's not extra. It's part of the fundamental furniture. The "Block" is the extra entity—a static 4D object that requires us to explain away our experience of flow. I'm keeping the flow and accepting a hidden frame. You're keeping the visible geometry and accepting a hidden illusion of flow. Which is the bigger ontological cost?

  **Elena:** The illusion of flow is a local, biological phenomenon. We perceive entropy increase as "time passing." That's thermodynamics, not metaphysics. The Block doesn't deny entropy. It just locates it. But a hidden frame? That undermines the spirit of relativity. Einstein's insight wasn't just about equations; it was that simultaneity is *relative*. Not "relative to measurement," but relative to existence. If you reinstate absolute simultaneity, you aren't doing SR anymore. You're doing Lorentzian Electrodynamics with extra steps.

  **Marcus:** Maybe we aren't doing SR anymore. Maybe SR is an effective theory. Just like Newtonian gravity is an effective theory of GR. We found that Newton's absolute time broke down at high speeds. We might find that Einstein's relative time breaks down at the quantum gravity scale. If the wavefunction collapses objectively, there is a "moment" of collapse. If that moment is real, there is a "now." If you refuse to accept that, you're prioritizing the elegance of the 1905 theory over the messiness of 1925 and beyond.

  **Elena:** I'm prioritizing the theory that has never been experimentally falsified. SR holds. Every test of Bell's inequalities confirms non-locality, yes, but it also confirms no-signaling. The no-signaling theorem protects relativity. You can't use entanglement to send a message faster than light. That suggests the "preferred frame" isn't operationally real. If it can't carry information, in what sense is it a "frame of reference"?

  **Marcus:** It's a frame of *becoming*. Not a frame for signaling, but a frame for existence. Look, Elena, I'm not claiming I have the proof. I'm claiming the impasse isn't a victory for you. The RPP argument assumes that SR is the final word on the structure of time. I'm saying SR describes the causal structure of the *block*, but it doesn't prove the block is all there is. If QM hints at a preferred slicing, then the Neo-Lorentzian move isn't cheating. It's anticipating the next synthesis.

  **Elena:** And if QM turns out to be fully covariant in the end? If we find a way to make collapse or Many-Worlds fit cleanly into Minkowski space without a foliation?

  **Marcus:** Then I'm in trouble. But until then, the "undetectable frame" is only undetectable *by light*. It might be detectable by the structure of the wavefunction itself. We just don't know how to read it yet.

  **Elena:** (Sighs, leaning back) So we're stuck. I see a beautiful, static crystal where "now" is just where the light hits the eye. You see a growing crystal, where the tip is real and the rest is history. And the physics we have is compatible with both, provided I accept an illusion and you accept a hidden variable.

  **Marcus:** Essentially. The physics underdetermines the metaphysics. The RPP argument proves that *if* SR is the whole story, Eternalism wins. But if SR is a limit of a deeper theory that includes objective collapse or Bohmian trajectories, Presentism survives.

  **Elena:** And since we can't access that deeper theory yet, we're left with aesthetic preferences. I prefer the symmetry of the block.

  **Marcus:** And I prefer the reality of the moment.

  **Elena:** (Smiles) Well, at least we can agree on this: the leaf hitting the ground is a event that we both agree happened.

  **Marcus:** Even if we disagree on whether the next leaf has already fallen in some four-dimensional sense.

  **Elena:** Precisely. Pass the thermos?

  **Marcus:** Already pouring.
