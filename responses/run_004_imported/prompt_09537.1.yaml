      *   **Refute the "Irrational" Label:** Explain that standard EUT is a *model*, not the *truth*. Behavioral economics (Prospect Theory) offers a better model for this specific behavior.
      *   **Explain Loss Aversion vs. Diminishing Utility:** This is the crux. Diminishing utility is about *wealth levels* (concave). Loss aversion is about *changes* (kinked). You can be loss-averse on small bets but risk-tolerant on large life-changing bets because the reference point shifts or the magnitude overwhelms the loss aversion coefficient.
      *   **Practical Advice:** How does this apply to investing?
