answer: |-
  Your friend is invoking a famous result in behavioral economics known as **Rabin's Paradox** (or the Calibration Theorem), published by Matthew Rabin in 2000.

  Within the strict confines of standard **Expected Utility Theory (EUT)**, your friend is mathematically correct. However, his conclusion that you are "irrational" relies on the assumption that EUT is the correct model for human decision-making. Most modern economists and psychologists would argue that the *model* is flawed, not you.

  Here is the breakdown of why your friend's logic holds up technically, why it fails practically, and how you can defend your position while still making sound investment decisions.

  ### 1. The Friend's Argument: Rabin's Paradox
  Your friend's reasoning is based on the standard economic assumption that people maximize the expected utility of their **total final wealth**. In this model, risk aversion comes from the **diminishing marginal utility of wealth** (a concave utility function). Gaining \$1,000 adds less utility when you are rich than when you are poor.

  Rabin proved that if you reject a small, positive-expected-value bet (like lose \$20 / win \$25) due to diminishing marginal utility, the curvature of your utility function must be so steep that it implies absurd behavior at higher stakes.
  *   **The Math:** To reject a 50/50 bet of losing \$20 vs. winning \$25, your utility function must curve downward very quickly.
  *   **The Extrapolation:** If that curvature holds true as your wealth increases, you would theoretically reject a 50/50 bet of losing \$200 vs. winning **infinity** (or a life-changing sum like \$10 million).
  *   **The Conclusion:** Since almost no one would reject the life-changing bet, the rejection of the small bet cannot be explained by diminishing marginal utility of wealth alone.

  So, strictly speaking, your friend is right: **Diminishing marginal utility of wealth is not the reason you are declining the bet.**

  ### 2. The Flaw in the Friend's Conclusion
  Your friend concludes that because "diminishing utility" isn't the cause, your behavior must be an "inconsistent, irrational quirk." This is a false dichotomy. It assumes that Expected Utility Theory is the only valid framework for rationality.

  The coherent defense for your behavior lies in **Prospect Theory**, developed by Daniel Kahneman and Amos Tversky.

  #### Loss Aversion vs. Diminishing Utility
  Standard economics assumes you care about *wealth states* (e.g., "How happy am I with \$1,000,025 vs. \$1,000,000?").
  Prospect Theory suggests you care about *changes relative to a reference point* (e.g., "How does gaining \$25 feel vs. losing \$20?").

  *   **Loss Aversion:** Humans feel the pain of a loss roughly 2 to 2.5 times more intensely than the pleasure of an equivalent gain.
  *   **The Kink:** Your utility function isn't smoothly concave; it is **kinked** at your current wealth (the reference point). It is steeper for losses than for gains.

  This explains your behavior without implying you would reject the life-changing bet.
  1.  **Small Bet:** The loss of \$20 triggers the steep "loss" side of the curve. The pain outweighs the pleasure of the \$25 gain, even though the EV is positive.
  2.  **Life-Changing Bet:** If the upside is millions, the gain is so massive it overcomes the loss aversion coefficient, or the reference point shifts. You aren't calibrating risk aversion globally; you are reacting to the *framing* of the loss.

  Therefore, you are not irrational; you are displaying **Loss Aversion**, which is a well-documented, consistent human trait, even if it violates Von Neumann-Morgenstern axioms.

  ### 3. Narrow Framing
  There is a second defense: **Narrow Framing**.
  Your friend is evaluating the bet as part of your total portfolio (broad framing). You are likely evaluating the bet in isolation (narrow framing).

  *   **Broad Framing:** "I have \$X in vested equity. Adding a \$25 EV+ bet changes my risk profile negligibly."
  *   **Narrow Framing:** "This is a standalone transaction. I don't want to end the day with less money than I started."

  In behavioral finance, narrow framing is often considered a "bias," but it can be a rational heuristic. Tracking every small fluctuation against your total net worth is cognitively expensive. It is often mentally efficient to compartmentalize "gambling money" or "fun bets" and apply stricter rules there to avoid slippery slopes.

  ### 4. Implications for Your Investing
  This is where the distinction matters for your actual wealth management. Your friend is using a parlor game to probe your risk tolerance, but the stakes are now real.

  **Where your friend is right:**
  If you apply this same loss aversion to your long-term investment portfolio, you may suffer from the **Equity Premium Puzzle**. If you refuse small risks with positive expected returns, you might hold too much cash and too many bonds. Over 20 years, the "pain" of short-term volatility (losses) might cause you to miss out on the compounding of the equity risk premium (gains).

  **Where you are right:**
  Survival matters more than optimization. In quantitative finance, we know about **risk of ruin**. Even if a strategy has positive EV, if the volatility forces you to exit the position before the mean reverts, you lose.
  *   **The Bet:** Losing \$20 doesn't ruin you, but the *feeling* might make you risk-averse in other areas.
  *   **The Portfolio:** If your investment allocation causes you to lose sleep (loss aversion kicking in), you are likely to sell at the bottom during a crash.

  ### 5. The Verdict
  You can defend your position with the following statement:

  > "You are applying Rabin's Paradox correctly, which proves that my behavior isn't driven by the diminishing marginal utility of wealth. However, that doesn't make me irrational; it makes me a **Loss Averse Prospect Theory maximizer** rather than an Expected Utility maximizer. I evaluate outcomes relative to a reference point, not total wealth. I am willing to pay a premium (the rejected EV) to avoid the psychological cost of a realized loss in a narrow frame. That is a consistent preference, not a calculation error."

  **Practical Advice for Your Vesting:**
  1.  **Don't Gamble, Allocate:** Do not treat your investment portfolio like a series of coin flips. Use **Mean-Variance Optimization** or a standard asset allocation model. This moves you from "Narrow Framing" (bet by bet) to "Broad Framing" (portfolio level), which neutralizes the loss aversion bias.
  2.  **Acknowledge the Pain:** Accept that you feel losses more than gains. Structure your portfolio so that a 20% drawdown doesn't trigger that \$20-loss feeling on a macro scale. If a 20% drop would make you panic-sell, you are over-leveraged in equities, regardless of the EV.
  3.  **The "Sleep Test":** In professional asset management, the optimal portfolio is theoretically the one with the highest Sharpe ratio. In *personal* finance, the optimal portfolio is the one you can hold through a crash without selling. If declining +EV risk helps you stay the course, it has instrumental value.

  **Summary:** Your friend wins the math debate (EUT cannot explain your behavior), but you win the psychology debate (Prospect Theory explains it perfectly). For your actual investing, trust the math of diversification, but respect the psychology of your own risk tolerance.
