      *   **The Bet:** A coin flip: Win \$25 (Heads), Lose \$20 (Tails). Positive Expected Value (EV = $0.5 \times 25 - 0.5 \times 20 = \$2.50$).
      *   **User's Action:** Declines the bet.
      *   **User's Reasoning:** Loss aversion (losing \$20 hurts more than winning \$25 helps).
      *   **Friend's Argument:** This behavior implies a specific utility function (diminishing marginal utility of wealth). If calibrated to reject this small bet, the implied risk aversion is so high that the user would *also* reject massive bets with huge upside (e.g., lose \$200 to win \$1,000,000). Since the user *would* take the massive bet, the friend claims the small-bet rejection is irrational/inconsistent (Rabin's Paradox).
      *   **User's Goal:** Wants to know if the friend is right (is this just bias?) or if there's a coherent defense, especially regarding real investment decisions.

  2.  **Identify the Core Economic Concept:**
      *   The friend is invoking **Matthew Rabin's Calibration Theorem (2000)**.
      *   *The Theorem:* If an expected utility maximizer rejects a small-stakes gamble (like 50/50 lose \$100/gain \$110) at *all* wealth levels, they will reject large-stakes gambles that no sane person would reject (e.g., 50/50 lose \$1000/gain infinity).
      *   *The Implication:* Rejecting small positive-EV bets cannot be explained solely by *concave utility of wealth* (diminishing marginal utility) over the relevant range. It implies something else is going on.

  3.  **Evaluate the Friend's Claim:**
      *   Is the friend technically correct regarding *Expected Utility Theory (EUT)* with *wealth-based utility*? **Yes.** Rabin's paradox shows that calibrating risk aversion to small bets makes you absurdly risk-averse for large bets.
      *   Does this mean the user is "irrational"? **Not necessarily.** It means the *model* (standard EUT with wealth utility) is insufficient to describe the behavior, not that the behavior itself is indefensible.

  4.  **Explore Alternative Explanations (The "Coherent Defense"):**
      *   **Loss Aversion (Prospect Theory):** Kahneman & Tversky. People evaluate gains and losses relative to a *reference point*, not total wealth. The pain of a loss is steeper than the pleasure of an equivalent gain. This explains the small bet rejection without implying absurd aversion to large bets (because the utility function is kinked at the reference point, not globally concave).
      *   **Narrow Framing:** Evaluating the bet in isolation rather than as part of a total portfolio. If the user looks at the bet alone, it feels risky. If viewed as part of total wealth, it's negligible.
      *   **Transaction Costs/Mental Accounting:** The cognitive load of tracking small bets, tax implications, or the "hassle factor."
      *   **Liquidity Constraints:** Even if wealthy, is \$20 "safe" money? (Unlikely given the context, but worth noting).
      *   **Reputation/Social Cost:** Losing a bet with a friend might feel worse than the monetary value.

  5.  **Address the Investment Context:**
