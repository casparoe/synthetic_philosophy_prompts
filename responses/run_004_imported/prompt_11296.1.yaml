      *   *The "Gotcha":* This is Rabin's Calibration Theorem (2000).
      *   *The Resolution:* Why the model fails.
          *   **Prospect Theory:** We value gains and losses differently (Loss Aversion). We don't integrate bets into total wealth.
          *   **The "Wealth" Assumption:** EUT assumes you care about \$1,000,000 + Current Wealth. You actually care about "Winning \$1,000,000".
