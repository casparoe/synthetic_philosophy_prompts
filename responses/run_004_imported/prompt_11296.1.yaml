      *   **The Friend's Argument (The Quant):** Based on Expected Utility Theory (EUT), specifically a result by Matthew Rabin (2000). If you reject this small bet at all wealth levels, your utility function must be so concave (risk-averse) that you would also reject a bet like 50% lose \$1,000, 50% gain \$1,000,000 (or even infinity).
      *   **The User's Intuition:** The first rejection feels rational (loss aversion). The second rejection (of the huge prize bet) feels absurdly irrational.
      *   **The Conflict:** The math seems sound, but the conclusion feels wrong. The user wants to know if they are irrational, if the math is flawed, or if there's a better framework.
      *   **User Background:** Software engineer, trusts tight arguments, no econ/philosophy background.

  2.  **Identify the Core Economic Concept:**
      *   This is a classic example of **Rabin's Paradox** (or Rabin's Calibration Theorem).
      *   It highlights a limitation of **Expected Utility Theory (EUT)** when applied to risk aversion over small stakes.
      *   The core issue is the assumption of *global* risk aversion based on *local* behavior.

  3.  **Evaluate the Friend's Argument:**
      *   **Is the math valid?** Yes, *within the framework of Expected Utility Theory*. If utility is defined solely over final wealth states and is concave enough to reject the small bet everywhere, it implies absurd risk aversion for large bets.
      *   **Is the conclusion ("you are irrational") valid?** Not necessarily. It suggests the *model* (EUT) is inadequate for describing human behavior, not necessarily that the human is broken.

  4.  **Evaluate the User's Intuition:**
      *   **Loss Aversion:** The user mentions losing \$200 bothers them more than winning \$240 pleases them. This is **Prospect Theory** (Kahneman & Tversky), not standard EUT.
      *   **Myopia:** People evaluate bets in isolation, not as part of total lifetime wealth.
      *   **Context:** A software engineer might view this as a "bug" in the economic model, not the human.

  5.  **Formulate the Explanation:**
      *   **Validate the User:** Acknowledge that their intuition is shared by most people and even many economists.
      *   **Validate the Friend (with caveats):** Acknowledge the math is correct *given the assumptions*. Name-drop Matthew Rabin.
      *   **Identify the Flaw:** The flaw isn't in the user's logic, but in the *assumptions* of the standard economic model (Expected Utility Theory).
      *   **Key Assumption 1: Utility of Wealth vs. Utility of Gains/Losses.** EUT assumes you care about final wealth ($W + \Delta$). Humans care about changes ($\Delta$) relative to a reference point. This is Prospect Theory.
      *   **Key Assumption 2: Global vs. Local.** The friend assumes the risk aversion applies at *all* wealth levels. In reality, people might reject the \$200 bet now but accept it if they were a billionaire. (Though the user said "every wealth level," which is the trap).
      *   **Key Assumption 3: Narrow Framing.** People treat bets in isolation, not as part of a portfolio.
      *   **Conclusion:** The user isn't irrational; the model is too simple.

