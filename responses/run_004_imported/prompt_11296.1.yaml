answer: |-
  You have stumbled upon one of the most famous critiques in modern behavioral economics. Your friend is mathematically correct *within the specific framework he is using*, but that framework is widely considered to be a poor description of how human beings actually make decisions.

  You are not irrational. The model your friend is using is simply too rigid to capture the nuance of your preferences.

  Here is the breakdown of what happened, why the math works, why the conclusion is misleading, and the better framework you should use to think about this.

  ### 1. The Friend's Argument: Rabin's Calibration Theorem
  Your friend inadvertently recreated a proof published by economist Matthew Rabin in 2000, known as **Rabin's Calibration Theorem**.

  The logic relies on **Expected Utility Theory (EUT)**, the standard economic model for risk. EUT assumes that:
  1.  You care about your **final total wealth** (e.g., \$50,000 savings + \$240 win), not the gain or loss in isolation.
  2.  Your "utility" (satisfaction) from money exhibits **diminishing marginal returns**. The first \$1,000 you earn is worth more to you than the millionth \$1,000. This makes the utility curve "concave."

  **The Math:**
  To reject a 50/50 bet of lose \$200 / gain \$240 at *every* wealth level, your utility curve must be curved (concave) quite sharply. If the curve is that sharp locally (at low stakes), the math dictates it must become exponentially sharper as you move up the wealth scale.

  By the time you get to the second bet (lose \$1,000 / gain \$1,000,000), the model calculates that the "pain" of losing \$1,000 (due to that steep curvature) outweighs the "pleasure" of gaining \$1,000,000. The model implies that if you are that afraid of losing \$200, you must be terrified of losing \$1,000, regardless of the upside.

  **So, is your friend right?**
  *   **Mathematically:** Yes. Given the assumptions of Expected Utility Theory, your two statements are inconsistent.
  *   **Practically:** No. The assumptions of Expected Utility Theory do not hold for small-stakes gambling.

  ### 2. The Flaw: Wealth vs. Changes
  The fundamental error in your friend's reasoning is **Assumption #1** above.

  Standard economic theory assumes you integrate every bet into your total lifetime wealth. It assumes you think: *"I have \$50,000. If I take this bet, I will have either \$49,800 or \$50,240. Which state do I prefer?"*

  But humans don't think that way. We use **Mental Accounting**. You think: *"I have \$50,000. This bet is a separate object. It is a chance to lose \$200 or win \$240."*

  This distinction is the core of **Prospect Theory**, developed by Daniel Kahneman and Amos Tversky (for which Kahneman won the Nobel Prize). Prospect Theory argues:
  1.  **Reference Dependence:** We evaluate outcomes as *gains and losses* relative to a reference point (usually the status quo), not as final wealth states.
  2.  **Loss Aversion:** Losses loom larger than gains. Losing \$200 feels roughly 2 to 2.5 times worse than winning \$200 feels good.

  In your specific case, the pain of losing \$200 outweighs the pleasure of gaining \$240. This is a perfectly coherent preference under Prospect Theory. It does **not** imply you would reject a bet to lose \$1,000 to win \$1,000,000. Under Prospect Theory, the value function flattens out for large gains, but it doesn't curve so aggressively that a million dollars becomes worthless compared to a thousand-dollar loss.

  ### 3. Why "Every Wealth Level" is the Trap
  Your friend's argument hinges on your claim that you would reject the first bet at **every possible wealth level**.

  If you are a billionaire, would you really reject a 50/50 chance to lose \$200 or gain \$240? Probably not. You'd likely flip the coin and not even check the result.
  *   If you admit that you would take the bet if you were rich enough, Rabin's paradox dissolves. The utility function doesn't need to be globally concave; it just needs to be sensitive at your *current* wealth level.
  *   However, even if you insist you would reject it even as a billionaire (perhaps out of principle or annoyance), that still doesn't force you to reject the million-dollar bet. It just means the standard model (EUT) is the wrong tool for the job.

  ### 4. An Engineering Analogy
  As a software engineer, think of Expected Utility Theory as a **linear approximation** of a non-linear system.

  *   **The Model:** EUT tries to approximate human decision-making with a smooth, continuous function.
  *   **The Reality:** Human decision-making has discontinuities, thresholds, and context-switching overhead.

  Rejecting the \$200 bet is like ignoring a low-priority interrupt in your code. Handling the interrupt (evaluating the risk, feeling the stress, managing the outcome) has a "transaction cost." If the payload (\$240) isn't worth the CPU cycles (stress/attention), you drop the packet.
  *   **Small Bet:** The transaction cost of worrying about the loss exceeds the expected value.
  *   **Large Bet:** The payload (\$1,000,000) is large enough to justify allocating significant resources to handle the interrupt.

  Your friend is arguing that because you drop small packets, your network architecture must be incapable of handling large payloads. You know that's not true; you just have a threshold for what warrants processing.

  ### 5. So, Are You Irrational?
  No. You are exhibiting **bounded rationality**.

  It is rational to ignore small positive-expected-value gambles for several reasons that EUT ignores:
  1.  **Aggregation Risk:** You never see just one bet. If you accept small risky bets, you might accept 100 of them. While the law of large numbers says you'd win overall, in the short term, you could hit a losing streak that causes liquidity issues (you can't pay rent this month even if you'll be rich next year).
  2.  **Emotional Cost:** Stress has a physiological cost. If worrying about \$200 keeps you up at night, the "cost" of the bet is \$200 plus the value of a good night's sleep.
  3.  **Opportunity Cost:** Time spent managing small risks is time not spent earning more money through your primary skill (coding).

  ### The Verdict
  Your friend has correctly applied a theorem that proves **Expected Utility Theory is incapable of modeling risk aversion over small stakes without implying absurd risk aversion over large stakes.**

  Economists generally accept this as a flaw in Expected Utility Theory, not a flaw in human psychology.

  **How to resolve the argument:**
  Tell your friend: *"You are right that Expected Utility Theory implies I should take the million-dollar bet. But Rabin's Paradox proves that Expected Utility Theory is a broken model for small stakes. I am not inconsistent; I am loss-averse. I evaluate bets based on changes to my wealth, not my total net worth. Prospect Theory explains my behavior without implying I'm irrational."*

  You can confidently keep turning down those spread-betting apps. The "house edge" in those apps isn't just mathematical; it's the cost of your peace of mind, which is a valid expense.
