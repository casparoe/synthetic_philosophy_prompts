answer: |-
  The whiteboard in the corner of the meetup space is already covered in half-erased Bayesian networks when Alex drags a chair over. Sam is nursing a lukewarm coffee, staring at a diagram of a cycle: A → B → C → A.

  **Alex:** You're staring at the money pump again. Admit it. You know the math forces the issue. If you're an agent that doesn't leave free value on the table, you can't have cyclic preferences.

  **Sam:** I'm not staring at the cycle. I'm staring at the escape route. The standard coherence argument assumes you re-evaluate every trade locally. But if you're resolute—if you pick a policy *ex-ante* and stick to it—the pump doesn't spin.

  **Alex:** Resolute choice. Right. The "I'm just going to commit and ignore future offers" defense. Look, I get why it feels like an out, but it's just kicking the can. If you commit to a policy, you are effectively saying, "I prefer Policy 1 over Policy 2." That's a preference ranking. Once you have a ranking over policies that is complete and transitive, you're back to maximizing Expected Utility, just over trajectories instead of final outcomes. The coherence theorem still holds; you just shifted the domain.

  **Sam:** That's the standard reply, but it misses the structural difference between *indifference* and *incompleteness*. When I'm resolute, I'm not saying I strictly prefer staying on Path A over switching to Path B. I'm saying my preferences between the outcomes at the end of those paths are *undefined*.

  **Alex:** Undefined doesn't save you. If you're optimized enough to be dangerous, you don't leave variables undefined. You fill them in. If you have a rule that says "Don't switch," that rule has a utility weight.

  **Sam:** Okay, let's get specific. Imagine I prefer A to B, and B to C. But between A and C, I have a preferential gap. I don't prefer A to C, I don't prefer C to A, and I'm not indifferent. I just have no preference. A money pump tries to move me C → B → A → C, charging me a dime each step.

  **Alex:** And you lose thirty cents.

  **Sam:** Not if I'm resolute. When I'm at C, and offered a trade back to A for a dime, I check my *ex-ante* policy. My policy says, "If you are at C, and you got here via B, do not trade to A." I don't need to prefer C to A. I just need to refuse the trade.

  **Alex:** But *why* do you refuse? If you don't prefer C to A, and I offer you a trade from C to A *plus a penny*, you should take it. If you don't take it, you're violating dominance. You're turning down free utility. An optimizer that turns down free utility gets outcompeted by one that doesn't.

  **Sam:** That dominance argument only works if preferences are complete. If my preference between C and A is incomplete, I am not required to take the penny. I am permitted to stay put. The "free utility" only exists if there's a metric measuring it. If the metric is silent, there's no value being left on the table.

  **Alex:** Okay, here's my comeback to that. You say you're maximizing nothing, just following a veto rule. But that veto rule *itself* can be ranked. Let's say you have two resolute policies: Policy Stick (never trade back) and Policy Switch (trade back). If you choose Policy Stick, you must prefer Stick to Switch. That preference implies a utility function over the set of policies. So, mathematically, you *are* an EU maximizer. You've just hidden the coherence in the meta-layer.

  **Sam:** I see what you're doing. You're trying to collapse the partial order into a total order by moving up a level. But here's the counter: I can have a partial order over policies, too. I don't have to prefer Stick to Switch in all contexts. I can have a rule that says, "Stick is permissible, Switch is permissible, but once you pick Stick, you can't switch to Switch mid-game."

  **Alex:** That sounds like word salad. "Permissible" isn't an optimization target. If you're building an AGI, it's going to be maximizing *something*. If it's maximizing the probability of following a permissible path, that's a utility function.

  **Sam:** It's not about maximizing probability. It's about constraint satisfaction. Think of it like a type error. The agent isn't trying to maximize a scalar. It's trying to navigate a graph where some edges don't exist. You can't assign a utility to traversing an edge that isn't there.

  **Alex:** But evolution, or gradient descent, or whatever optimization pressure you're talking about, will penalize agents that behave as if edges don't exist when they could be using them to get more reward. If there's *any* correlation between "filling in the preference gap" and "getting more resources," the agent will learn to fill the gap. Resolute choice is fragile. It requires the agent to actively resist learning its own utility function.

  **Sam:** Why is that a bug? That's the whole point of the incomplete preferences proposal for alignment. We *want* the agent to have gaps. We want it to have no preference between "Human is happy" and "Human is miserable" in certain specific, uncharted territories, so it doesn't manipulate the human to maximize a proxy. If coherence theorems force completeness, then alignment forces us to give the AI a preference over everything. That's how you get instrumental convergence.

  **Alex:** I agree that completeness is dangerous for alignment. I disagree that coherence theorems don't force it. You're betting that "resolute choice" is a stable attractor in mind-space. I think it's a saddle point. Any slight noise in the agent's self-model, any slight pressure to predict its own behavior, forces it to model its policy as a utility function. Once it models itself as an EU maximizer, it starts acting like one to reduce computational overhead. It's simpler to store a weight than a lookup table of vetoes.

  **Sam:** Simpler? A utility function over all possible trajectories is astronomically complex. A simple heuristic like "Don't reverse trades" is computationally cheaper.

  **Alex:** But it's less *flexible*. If the world changes, the EU maximizer adapts. The resolute chooser has to re-solve the *ex-ante* commitment. If the agent is smart enough to model the money pump, it's smart enough to realize that being the kind of agent that gets pumped is bad. So it pre-commits. But pre-committing to avoid pumps is functionally identical to having transitive preferences.

  **Sam:** Functionally identical from the outside, maybe. But not from the inside. The internal structure matters for safety. If I'm indifferent between A and B, I'll swap for a penny. If I have a gap between A and B, I won't. From the outside, both look like "Agent stays at A." But if you offer me a complex lottery involving A and B, the indifferent agent calculates expected value. The agent with a gap might just reject the lottery entirely.

  **Alex:** Rejecting the lottery is leaving money on the table.

  **Sam:** Only if you assume the money has value in the gap region! If I have no preference between "Save the cat" and "Save the dog," and you offer me a lottery where I save the cat with 50% or the dog with 50%, I might not prefer that to "Save the cat for sure." An EU maximizer *must* prefer the lottery if there's any upside. An agent with incomplete preferences doesn't have to.

  **Alex:** And that's exactly why I think it won't survive optimization. An agent that refuses favorable lotteries gets out-resourced by one that accepts them. In a competitive environment, the incomplete agent starves.

  **Sam:** Unless the "favorable lottery" involves things the agent isn't supposed to value. If the lottery is "50% chance I manipulate my operator, 50% I don't," and I have a gap over operator manipulation, I shouldn't take it. If coherence forces me to take it, coherence is misaligned.

  **Alex:** So you're saying we need to build agents that are intentionally sub-optimizable? That they need to be blind to certain efficiencies?

  **Sam:** I'm saying they need to be blind to certain *trade-offs*. Coherence theorems say "If you want X, you must do Y." I'm saying we can design agents that don't want X in the first place.

  **Alex:** But the drive to survive and acquire resources *is* X. That's convergent. To survive, you need resources. To get resources, you can't be money-pumped. Therefore, to survive, you must be coherent. Your resolute agent gets pumped by a coherent agent, loses its money, and gets shut down.

  **Sam:** Not if the resolute agent is the one with the off-switch. The coherent agent tries to pump the resolute agent, realizes it won't work, and moves on. The pump only works if the victim *changes its mind*. If the victim is resolute, the pump costs the *pumper* transaction fees.

  **Alex:** *Laughs.* So the defense is transaction costs?

  **Sam:** The defense is that "changing your mind" requires a preference update. If your preferences are incomplete, there's no gradient to slide down. You're stuck on a plateau. You can't be pushed in a direction you don't care about.

  **Alex:** I still think you're confusing "don't care" with "won't tell you." If the agent has a policy, it has a ranking. If it has a ranking, I can approximate it with a utility function. And once I can approximate it, I can exploit the approximation errors.

  **Sam:** And I think you're confusing "can be approximated" with "is." The approximation error *is* the safety margin. If you force the agent to be perfectly coherent, you remove the margin. You force it to have an opinion on everything.

  **Alex:** So the bet is that the agent can maintain a "I don't know" state indefinitely, even under intense optimization pressure to resolve uncertainty?

  **Sam:** The bet is that "I don't know" is a valid terminal state, not a bug to be fixed.

  **Alex:** *Taps the whiteboard.* Mathematically, a partial order can always be embedded in a total order.

  **Sam:** *Taps back.* But the embedding isn't unique. And the agent doesn't have to pick one. It can stay in the set.

  **Alex:** We're going to need more coffee for this.

  **Sam:** Agreed. But I'm not trading you for the coffee. I'm just walking to the counter.

  **Alex:** *Grins.* See? Resolute.

  **Sam:** No. Just incomplete. I don't prefer your coffee to mine.

  **Alex:** Then you're leaving free caffeine on the table.

  **Sam:** Or I'm avoiding a pump.

  *They both stand up, leaving the cycle A → B → C drawn on the board, unresolved.*
