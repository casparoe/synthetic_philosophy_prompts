answer: |-
  This is one of the most profound disagreements in modern decision theory, and taking the side of Ole Peters and Ed Thorp requires fundamentally challenging the way probability is applied to economics. To make the strongest case that Samuelson is wrong, we must argue that his critique rests on a **category error regarding the nature of probability in physical time.**

  Samuelson's rebuttal assumes that Expected Utility Theory (EUT) is the axiomatic baseline for rationality. He argues that Kelly maximization is only optimal if you *assume* a logarithmic utility function. The ergodicity argument flips this: it posits that logarithmic growth is not a psychological preference, but a **physical constraint** of multiplicative dynamics in a single timeline.

  Here is the strongest case for why the ergodicity framing rescues growth-rate maximization as objectively correct, rendering Samuelson's critique a mathematical artifact of using the wrong average.

  ### 1. The Category Error: Ensemble vs. Time Averages
  Samuelson's critique relies on the **ensemble average**. He asks: "If we look at the expected value of wealth across all possible parallel universes at time $t$, does Kelly maximize this?" The answer is often no; aggressive betting can produce a higher *expected* wealth because of vanishingly rare, astronomically high outliers.

  However, a real trader does not live in an ensemble of parallel universes. They live in **one timeline**. They experience the **time average**.

  In multiplicative processes (like trading), the system is **non-ergodic**. This means the average across parallel systems (ensemble) does not equal the average across time for a single system (time).
  *   **Ensemble Average:** $E[W_t] = W_0 \cdot (1 + \text{arithmetic mean return})^t$
  *   **Time Average:** $W_t \approx W_0 \cdot \exp(t \cdot \text{geometric mean return})$

  Because of volatility drag (variance drain), the geometric mean is always less than or equal to the arithmetic mean. By focusing on the ensemble average, Samuelson is optimizing for a quantity that **does not exist for the individual agent.** He is optimizing for the wealth of a hypothetical "collective" of clones, most of whom are broke, while a tiny few hold all the wealth. For a single persistent agent, the ensemble average is physically irrelevant. The time-average growth rate is the only metric that maps to the agent's actual experience.

  ### 2. Logarithms are Dynamics, Not Preferences
  Samuelson's most famous charge is that Kelly proponents are "smuggling in" logarithmic utility. He argues that you must *choose* to be log-utility maximizing.

  The ergodicity argument refutes this by showing that the logarithm arises from the **mathematics of compounding**, not from psychology.
  If wealth evolves multiplicatively ($W_{t+1} = W_t \cdot (1 + r)$), then the change in wealth over time is additive only in log space:
  $$ \ln(W_T) - \ln(W_0) = \sum_{t=1}^{T} \ln(1 + r_t) $$
  To maximize the final wealth $W_T$ for a single trajectory, you must maximize the sum of the log-returns. This is not a utility function; it is an identity.

  Claiming that using log wealth implies "log utility" is like claiming that using meters to measure distance implies a "preference for meters." The logarithm is simply the correct coordinate system for multiplicative dynamics. Samuelson treats the log function as a subjective risk preference; ergodicity economics demonstrates it is an **objective property of the wealth process.**

  ### 3. The Finite Horizon and "Almost Surely"
  Samuelson argued that the Kelly criterion's advantage only holds "almost surely" as $t \to \infty$, and that for finite horizons, other strategies might yield higher expected utility.

  This misses the practical implication of the Law of Large Numbers in non-ergodic systems. While it is true that in a *finite* number of steps a high-variance strategy *can* outperform Kelly, the probability of Kelly outperforming any other strategy approaches 1 very rapidly.
  More importantly, Kelly maximizes the **median** terminal wealth.
  *   In skewed distributions (typical of trading), the mean (Samuelson's focus) is pulled by outliers.
  *   The median (Kelly's focus) represents the "typical" outcome.

  If you run a simulation of 1,000 traders using a high-leverage strategy vs. 1,000 traders using Kelly, the high-leverage group will have a higher *average* wealth (due to 3 traders getting lucky), but 95% of them will be underperforming the Kelly group. For a single agent who cares about *their* specific outcome, maximizing the median (which Kelly does) is objectively more rational than maximizing the mean. Samuelson's finite horizon critique privileges the unlikely tail events over the likely reality.

  ### 4. Ruin is an Absorbing Barrier, Not a Low Probability
  Standard EUT treats ruin (wealth = 0) as just another low-utility outcome. Ergodicity economics treats ruin as an **absorbing barrier**.

  Once you hit zero in a multiplicative process, you cannot continue. The time average stops.
  Strategies that maximize expected value (Samson's preference) often implicitly accept a non-zero probability of ruin in exchange for higher upside. In an infinite sequence of bets, any strategy with a non-zero probability of ruin will eventually result in ruin with probability 1.

  Even in finite time, if your goal is to remain a persistent agent in the market (which is a prerequisite for future trading), avoiding ruin is not a "risk preference"—it is a **survival constraint**. The Kelly criterion is the boundary strategy that maximizes growth without risking certain ruin in the long run. Samuelson's framework allows for strategies that are mathematically optimal in expectation but physically impossible to sustain over a career.

  ### 5. Operational Rationality vs. Axiomatic Rationality
  Samuelson defends **axiomatic rationality** (consistency with von Neumann-Morgenstern axioms). Peters and Thorp defend **operational rationality** (what actually makes you richer in the real world).

  If you offer a trader a choice between:
  1.  **Strategy A (Samuelson Optimal):** 99% chance of losing everything, 1% chance of winning $10^{100}$. (High Expected Value).
  2.  **Strategy B (Kelly Optimal):** 100% chance of compounding at 15% per year.

  Samuelson's framework says a rational agent *might* choose A depending on their utility function. The ergodicity framework says choosing A is objectively irrational for a single agent because the time-average growth rate is negative (due to the 99% loss). The "Expected Value" of Strategy A is a phantom number that exists only in the ensemble; it cannot be realized by a single human life.

  Therefore, maximizing the time-average growth rate is not just one utility function among many; it is the **necessary condition for a single agent to capture the positive drift of a market without being wiped out by variance.**

  ### Conclusion
  Samuelson is wrong because he applies equilibrium probability theory (ensembles) to a non-equilibrium, path-dependent process (time). He critiques Kelly for failing to maximize a metric (ensemble expected utility) that is physically inaccessible to a single trader.

  The ergodicity framing does not "smuggle in" log utility. It derives the log function from the structure of time and compounding. It shifts the definition of rationality from "consistency with hypothetical parallel universes" to "optimization of the single trajectory you actually inhabit." For a trader building a bet-sizing module, the ergodic view is not just theoretically superior; it is the only one that ensures you will still be in the game long enough for your edge to matter.
