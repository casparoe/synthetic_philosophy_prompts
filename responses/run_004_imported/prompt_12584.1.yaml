          *   Core Claim: Maximizing geometric mean (Kelly) is only optimal if you *already* have log utility.
          *   Critique: Just because Kelly wins "almost surely" in the infinite limit doesn't mean it maximizes expected utility in finite time for non-log utility agents.
          *   Implication: Kelly is a specific case of EUT, not a replacement for it.

  3.  **Formulate the Argument for the Ergodicity Side (The "Strong Case"):**
      *   *Goal:* Show that Samuelson's critique rests on a category error regarding probability and time.
      *   *Key Point 1: The Non-Ergodic Nature of Wealth.* Wealth dynamics are multiplicative. $W_{t+1} = W_t \cdot (1 + r)$. In such systems, $E[W_t] \neq \exp(E[\ln W_t])$. The ensemble average is dominated by vanishingly rare outliers, while the time average reflects the typical experience. Samuelson focuses on the ensemble average, which is irrelevant for a single non-replicable agent.
      *   *Key Point 2: Objective vs. Subjective.* EUT requires positing a utility function (subjective preference). Ergodicity economics derives the log function from the dynamics of the wealth process itself (objective math). It's not "log utility smuggled in"; it's "log growth derived from dynamics."
      *   *Key Point 3: Ruin and Irreversibility.* Samuelson's finite horizon argument ignores the path dependency. If you hit zero, you're out. The time-average growth rate accounts for the compounding effect of volatility drag. Samuelson's expected value can suggest bets that lead to ruin with probability 1 over long horizons, even if the "expected value" is high.
      *   *Key Point 4: The "Almost Surely" Misunderstanding.* Samuelson dismisses the infinite horizon result. However, in ergodicity economics, the focus isn't on the limit $t \to \infty$ as an abstraction, but on the *rate* of growth at any finite $t$. The law of large numbers applies to the time average for a single trajectory in a way it doesn't for the ensemble average in non-ergodic systems.
      *   *Key Point 5: Operational Rationality.* If the goal is to end up with more wealth than an alternative strategy *in the real world* (single timeline), maximizing the time-average growth rate stochastically dominates other strategies over sufficiently long (but finite) horizons. Samuelson's counter-examples often rely on utility functions that value hypothetical parallel universes more than actual survival.

  4.  **Drafting the Response (Iterative Refinement):**
