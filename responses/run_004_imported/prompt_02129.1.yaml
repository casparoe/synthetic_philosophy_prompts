      *   **Scenario:** Drag Ghazali into a modern physics lecture. Show him quantum indeterminacy (Heisenberg, Bell's Theorem, no hidden variables).
      *   **Question:** Would he see this as vindication of his occasionalism, or as a different kind of indeterminacy that doesn't help his case?
      *   **Constraint:** Work from the *actual structure of his argument*, not generic "religion vs. science" tropes.
      *   **Follow-up:** What would still be missing for a *genuinely occasionalist* reading of physics?

  2.  **Analyze Ghazali's Argument (Discussion 17):**
      *   *Target:* The Avicennan/Farabian view of necessary emanation. Cause *must* produce effect by essence.
      *   *Ghazali's Move:* Observation shows conjunction (*iqtiran*), not causation (*illah*). We see fire and cotton burning together, but we don't see the "making burn" transfer.
      *   *Metaphysical Basis:* God is the only true Agent (*Fa'il*). Created things are passive instruments or "occasions" (*asbab*).
