      *   **Section 1: The Negative Vindication (Against the Falasifa).** How QI supports Ghazali's attack on Avicennan necessity. The "observation of conjunction" point.
      *   **Section 2: The Positive Divergence (Will vs. Chance/Nature).** Why QI isn't Occasionalism. The problem of "Propensities." Ghazali denies created things have *taba'i* (natures) that do anything.
      *   **Section 3: The Missing Piece (Volition).** What Ghazali needs to call it Occasionalism. The transition from probability to actuality requires an Agent.
