prompt: |-
  So I've been prepping my kalam seminar and rereading the 17th discussion of Ghazali's Tahafut, where his big move against the falasifa is that theres no necessary connection between fire and burning, just a customary one (his term is basically "habit") that God usually maintains but can suspend — which is also his whole account of miracles. Say you could drag him into a modern physics lecture and show him real quantum indeterminacy, the Bell's theorem sort, where it's not just "we cant predict it" but, on most readings, no hidden fact fixing the outcome in advance. Would Ghazali take that as his occasionalism getting empirical vindication at last, or would he think it's actually a totally different kind of indeterminacy that doesn't help his case at all? Work this out from the actual structure of his argument, not a generic "medieval theologian meets modern science" riff, and tell me what (if anything) would still be missing for a genuinely occasionalist reading of physics.
