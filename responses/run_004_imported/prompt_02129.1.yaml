  9.  **Finalizing the "Missing Piece":** The transition from the *possible* (superposition/probability) to the *actual* (measurement/outcome). For Ghazali, this is the moment of Creation (*khalq*). For QI, it's "collapse" or "branching." Ghazali demands a *Chooser*.

