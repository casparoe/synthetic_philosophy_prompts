      *   Blackmail: I hurt you unless you do X. I gain, you lose (relative to baseline).
      *   UDT agents prefer to pre-commit to Trade but *not* to Blackmail, because pre-committing to Blackmail invites more blackmail.

      *   *Wait, one more nuance:* The Basilisk isn't asking for money now. It's saying "If you don't bring me into existence, I will torture you."
