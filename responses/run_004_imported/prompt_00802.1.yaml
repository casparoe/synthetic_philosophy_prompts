      *(Refining the "Principled Difference")*: The difference is that in Hitchhiker/Mugging, the predictor's action is *independent* of your policy in the sense that the predictor is already there running the test. In Basilisk, the predictor's *existence and motivation to punish* is logically dependent on your policy in a way that makes the punishment suboptimal for the predictor if you hold the right policy.

