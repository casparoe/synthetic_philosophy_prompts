answer: |-
  This is a compelling scene, and your writing group is right: the appeal to authority grounds the friar's radicalism in intellectual tradition rather than mere bloodlust. However, to make the texture of the citation authentic, there is a crucial historical-theological nuance you need to navigate.

  While John of Salisbury is indeed the champion of tyrannicide, **Thomas Aquinas is historically more cautious.** In *De Regno* (On Kingship), Aquinas generally argues that tyranny should be remedied by public authority, not private initiative, warning that private assassination often leads to worse tyranny.

  **However,** this actually makes your scene *more* dramatic, not less. In the 1590s (the height of the Catholic League in France), radical Dominican theologians *did* wrestle with Aquinas to justify the assassination of Henry III (which was actually carried out by a Dominican, Jacques Clément, in 1589). They did this by interpreting Aquinas through the lens of **Charity** and **Necessity**.

  Here is how your friar can plausibly marshal Aquinas to support a *positive duty* for a private subject, and how to weave John of Salisbury into the same breath.

  ### 1. The Aquinas Passages (The "Radical Reading")

  Your friar should not claim Aquinas explicitly says "go stab him." Instead, he should argue that Aquinas establishes the *conditions* under which it becomes a sin *not* to act.

  **A. *Summa Theologiae*, II-II, Question 64, Article 2 (On Killing Sinners)**
  *   **The Argument:** Aquinas argues that just as a physician amputates a diseased limb to save the body, so too may a dangerous individual be killed to save the community.
  *   **The Friar's Spin:** Aquinas usually reserves this for public authority. Your friar should argue that when the "public body" is paralyzed by fear or corruption, the duty to act as the "surgeon" devolves to the nearest capable hand.
  *   **Key Phrase:** *"The health of the body mystical demands the amputation of the gangrened limb. If the hand of the magistrate trembles, must the hand of the Christian freeze?"*

  **B. *Summa Theologiae*, II-II, Question 42, Article 2 (On Sedition)**
  *   **The Argument:** Aquinas states that overthrowing a tyrant is not sedition, because the tyrant is the one sowing discord.
  *   **The Friar's Spin:** If removing the tyrant is not a sin (sedition), and the tyrant is destroying souls (by leading subjects into sin or destroying the Church), then **Charity (*Caritas*)** compels us to remove him. In Thomistic theology, Charity is the highest virtue. If you can save your neighbor's soul or life and do not, you sin.
  *   **Key Phrase:** *"To stand idle while the shepherd becomes the wolf is not obedience, Brother. It is a failure of Charity. And Charity is a debt we owe."*

  **C. *De Regno* (On Kingship), Book I, Chapter 6**
  *   **The Argument:** Aquinas discusses what to do about tyranny. He admits that if there is "no human recourse" (*nullum humanum auxilium*), one must have recourse to God.
  *   **The Friar's Spin:** The friar argues that the conspirators *are* the human recourse sent by God. He can cite the line where Aquinas says the tyrant forfeits the right to be obeyed.
  *   **Key Phrase:** *"The Angelic Doctor teaches us that a ruler who rules for himself, not the common good, breaks the pact of law. He stands outside the law. And what lies outside the law may be lopped off by the gardener, even if he wears no crown."*

  ### 2. Integrating John of Salisbury

  John of Salisbury's *Policraticus* (Book VIII) is much more explicit than Aquinas. He calls the tyrant a *public enemy* (*hostis publicus*) and says killing him is "just and right" (*licet et iustum*).

  To fold them together, your friar should present John of Salisbury as the **explicit application** of Aquinas's **principles**. Aquinas provides the moral anatomy; Salisbury provides the surgical instruction.

  **The Scholastic Bridge:**
  You need a phrase that suggests they are two voices speaking one truth. In the 16th century, scholars loved to harmonize authorities.

  *   **Option 1 (The Law):** *"Salisbury declares the tyrant an outlaw; Aquinas confirms the outlaw has no shield against the sword of justice."*
  *   **Option 2 (The Duty):** *"As the Master of Salisbury sows, so the Angel of the Schools reaps: that which is lawful for the safety of the many becomes a duty for the conscience of the one."*
  *   **Option 3 (The Concurrence):** *"They are not two voices, but one echo across the centuries. The Policraticus names the disease; the Summa prescribes the cure."*

  ### 3. Suggested Dialogue Texture

  Here is a draft of how the friar might speak, incorporating these specific theological textures. Note the use of *Caritas* (Charity) to turn permission into duty:

  > "You hesitate because you think this blood is on our hands. But listen. John of Salisbury, in his *Policraticus*, calls the tyrant a *public enemy*, one who has severed the bond of law. He says the blade that strikes him is the sword of justice, not murder.
  >
  > "And Aquinas? You think the Angelic Doctor forbids it? Read him again. In the *Summa*, he teaches that to kill a sinner who endangers the community is to amputate a limb to save the body. Who wields the knife when the body is paralyzed? Does the hand of Charity stay idle because the magistrate sleeps?
  >
  > "Salisbury gives us the right; Aquinas gives us the obligation. For if we see the wolf at the throat of the flock and do not drive him off, are we not shepherds in name only? To let him reign is to consent to his sins. And consent, Brother, is complicity. To strike is not a license. It is a penance."

  ### 4. Historical Validation (The "Jacques Clément" Factor)

  You should feel very confident keeping this scene. In 1589, a real Dominican friar named **Jacques Clément** assassinated King Henry III of France. He was persuaded by theologians of the Catholic League who used exactly this kind of reasoning.

  The League's theologians (many of them Dominicans and Jesuits) argued that Henry III was a tyrant *ex exercitio* (by exercise of power) and a heretic. They leaned heavily on the "lesser magistrate" theory but allowed for private action in extremis.

  **One specific historical detail you can use:**
  The League theologians often distinguished between a **King** and a **Tyrant**. They argued that once a ruler becomes a tyrant, he ceases to be a King. Therefore, killing him is not *regicide* (killing a king), but *tyrannicide* (executing a criminal).

  *   **Phrase for the friar:** *"We do not kill a King. We execute a criminal who wears a crown. The crown does not make the man; the law makes the King. He has broken the law; he has unmade himself."*

  ### Summary of Recommendations

  1.  **Don't claim Aquinas explicitly commands private tyrannicide.** Instead, have the friar argue that Aquinas's principles (Common Good, Charity, Defense of the Innocent) *create* a duty when public authority fails.
  2.  **Use *Summa* II-II, Q. 64, Art. 2** (The Amputation Analogy). This is the strongest visual for a "duty" to kill for the health of the whole.
  3.  **Use *Caritas* (Charity).** This is the theological lever that turns "permission" into "meritorious duty."
  4.  **Link Salisbury as the "Naming" and Aquinas as the "Justifying."** Salisbury identifies the tyrant as an outlaw; Aquinas provides the moral framework for removing an outlaw.
  5.  **Historical Anchor:** Remember Jacques Clément. Your fiction is walking in very real, very bloody footsteps.

  This approach keeps the architecture your writing group loved but adds the layer of theological sophistication that will make the friar sound like a true son of Saint Dominic.
