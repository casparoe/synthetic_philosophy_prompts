      *   *The Proof Sketch:* Standard Bayes says if you haven't verified it, you don't know it. LI says if the "market" (experts) hasn't found a bug, the price stays high. *Implication:* Deference to expertise is computationally rational, not just a heuristic.

  6.  **Refining the Philosophical Angle (Formal Epistemology Context):**
