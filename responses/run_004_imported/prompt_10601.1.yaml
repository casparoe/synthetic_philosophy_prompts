      *   *Self-Trust/Reflection:* LI agents can trust their future selves (mostly). This relates to planning and updating.
      *   *No Dutch Books (Efficiently):* You aren't irrational just because you *could* be Dutch-booked by an uncomputable demon, only if a *feasible* trader can exploit you.
