  Here is a trait that fits the architecture of the argument without tripping over the usual examples. It's structural, it's ambiguous, and it drives adaptationists and structuralists insane for exactly the reasons you need.

  **The Trait:** The **geometry of the frontal sinuses** in hominids (the air-filled cavities behind the brow ridge).

  **Level 1: The Architectural Necessity (The Spandrel)**
  You cannot build a primate skull of that size with solid bone; it would be too heavy for the neck muscles to support, and the metabolic cost of maintaining the bone mass would be prohibitive. The skull *must* be lightened. In mammals, this is achieved through pneumatization—osteoclasts eating away the diploë (spongy bone) to create air pockets connected to the nasal cavity. The *existence* of the cavities is a structural byproduct of the constraint: "Make a protective box, but keep it under weight limit." You can't have the box without the voids. In the Gouldian sense, the sinuses are spandrels of cranial scaling.

  **Level 2: The Tuned Specificity (The Adaptation)**
  However, the sinuses aren't just random bubbles. In humans and certain hominids, the volume and surface area of the frontal sinuses correlate tightly with the resonant frequencies of the vocal tract. They act as Helmholtz resonators, amplifying specific harmonics in speech. An adaptationist (Owen) looks at the specific convoluted shape of the sinus walls and says: "Selection didn't just ask for 'lighter bone.' It tuned the resorption pattern to optimize formant frequencies for vocal communication. The geometry is selected."

  **The Dennett Twist (The Ambiguity)**
  Here is where the dinner conversation gets sticky. To use Dennett's critique of the San Marco paper: The builders *could* have used squinches. In biological terms, the skull *could* have been lightened differently. Some primates rely more on thinning the cortical bone or expanding the mastoid air cells instead of the frontal sinus. The lineage "chose" to expand the frontal sinus specifically.

  But was that choice driven by the *benefit* of the sinus (voice), or by the *mechanism* of the growth?

  The shape of the sinus is determined by the migration path of the neural crest cells during embryonic development. Those same cells also determine the shape of the brow ridge and the orbital roof. The brow ridge is likely a structural buttress for chewing stress (mechanical constraint). As the brow ridge grows, it pulls the bone apart, and the sinus inflates into the tension zone.

  So, Marguerite argues: The sinus shape is a mathematical inevitability of how the brow ridge grows under chewing stress. The vocal resonance is a lucky acoustic byproduct of a structural buttress.
  Owen argues: The chewing stress and the vocal resonance are co-selected. The developmental pathway was tuned *because* it produced a sinus that helped with speech.

  **Why It Resists Sorting**
  You cannot cleanly separate the "structural buttress" function from the "vocal resonator" function because they are developmentally coupled. The sinus doesn't exist until the brow ridge creates the space for it. If you select for a bigger brow (for chewing), you get a bigger sinus (for free). If you select for a bigger sinus (for voice), you risk weakening the brow (structural failure). The trait sits in a valley where the selective pressure for one function (chewing stability) creates the morphological substrate for the other (voice), and the developmental mechanism makes them inseparable.

  **The Test That Would Settle It**
  To prove Owen right (Adaptation), you would need to show that sinus geometry varies *independently* of brow ridge mechanics. You would need a population where chewing stress is held constant, but vocal demands vary, and observe if the sinus geometry shifts to match the voice without changing the brow.

  To prove Marguerite right (Spandrel), you would need to show that sinus geometry tracks perfectly with brow ridge stress markers, even in species with no vocal complexity.

  **Why Nobody Has That Test**
  You can't decouple the variables. The neural crest cells that build the brow are the same ones that define the sinus boundary. You cannot genetically engineer a human embryo to have a "chewing brow" without a "sinus cavity," or a "vocal sinus" without the "brow buttress." The developmental pathway is a single knot. Furthermore, you can't run the evolutionary tape again to see if a different lightening strategy (like mastoid expansion) would have been selected if vocalization wasn't a factor. We only have the one lineage, where the mechanical and the acoustic are fused in the same block of bone.

  It leaves you with a trait that is functionally useful, structurally necessary, and evolutionarily opaque. It's a pendentive that might be a squinch, and you can't take the ceiling down to check.
