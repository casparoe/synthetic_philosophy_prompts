answer: |-
  **MEMORANDUM**

  **TO:** The Ritual Committee, Liturgy Subcommittee
  **FROM:** [Your Name], Subcommittee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Avodah and Sacrificial Liturgy in the New Machzor

  **1. Purpose and Context**

  For the past four meetings, we have been stalled on a critical question: How do we handle the *Avodah* service and the *Musaf* passages that petition for the restoration of the Temple sacrificial cult? We have three legitimate concerns in the room:
  1.  **Theological Comfort:** Many of us cannot in good conscience pray for the return of animal sacrifice.
  2.  **Textual Integrity:** Altering the text risks turning our machzor into a reflection of our own theology rather than a transmission of our tradition.
  3.  **Intellectual Honesty:** As noted in our last session, the tradition itself—specifically Maimonides—is not of one mind on whether sacrifice is a permanent ideal or a historical concession.

  We cannot vote on a text until we agree on a principle. This memo recommends a specific path forward to break the stalemate.

  **2. The Maimonidean Constraint**

  We must address the complication raised regarding Maimonides before deciding on the text. It is tempting to resolve the tension by privileging the *Guide for the Perplexed* (III:32) over the *Mishneh Torah*. In the *Guide*, sacrifice is a divine concession to ancient idolatrous habits. In *Hilkhot Melakhim*, however, the Messianic king rebuilds the Temple and restores the sacrificial order without qualification or apology.

  Nachmanides rightly pointed out that if sacrifice were merely a concession to idolatry, the patriarchs and Noah would not have offered them. Therefore, we cannot dismiss the *Mishneh Torah*'s vision as merely "exoteric cover" for the unsophisticated. It represents a genuine, legal-eschatological strand of Jewish thought that envisions sacrifice as a restored ideal.

  If we alter the liturgy to remove the petition for restoration, we are not just accommodating modern sensibilities; we are silently adjudicating a medieval debate that remains unresolved within Orthodoxy and traditional thought. We are effectively ruling that the *Guide* is the "real" Maimonides and the *Mishneh Torah* is obsolete. As a post-denominational community, we do not have the authority to excise a normative legal-eschatological vision from the liturgy simply because it is challenging.

  **3. Recommendation**

  I recommend that the subcommittee **retain the traditional Hebrew text of the *Avodah* and sacrificial *Musaf* passages without alteration**, including the petitions for the restoration of the "fire-offerings."

  However, this retention must be accompanied by a specific **paratextual framework**:
  1.  **Literal Translation:** The English translation should remain faithful to the Hebrew future tense (e.g., "May You restore," not "We remember that You restored").
  2.  **Theological Sidebar:** On the page facing the *Avodah* service, we will include a "Kavanot" (Intentions) box. This box will briefly outline the tension between the historical reality of sacrifice, the *Guide*'s explanation of it as a concession, and the *Mishneh Torah*'s vision of its restoration.
  3.  **Introductory Essay:** The machzor introduction will feature an essay on "Sacrifice and Prayer," explicitly citing the Maimonidean tension and Nachmanides' critique, framing the liturgy as a space to hold these competing truths.

  **4. Rationale**

  This approach is superior to revising the tense or framing for three reasons:

  **A. Liturgical Honesty (Addressing Faction B)**
  Changing the tense from future to past is an act of editorial squeamishness that creates a dissonance between what is said and what is meant. If the Hebrew says "restore" and the English says "remember," we are asking our congregation to sing one thing while reading another. By keeping the text intact, we honor the liturgy as a historical document of Jewish hope. We acknowledge that this is what the tradition *says*, even if we are still debating what it *means*.

  **B. Intellectual Integrity (Addressing Faction C)**
  By retaining the text, we acknowledge the *Mishneh Torah*'s commitment to restored sacrifice as a valid voice within the Jewish conversation. We do not need to personally believe in the return of animal sacrifice to acknowledge that the tradition envisions it. The "Kavanot" sidebar allows us to be intellectually honest about the *Guide*'s critique without erasing the legal code's vision. It treats the worshiper as an adult capable of holding a tension: *This is the text we inherited; here is why it is difficult; here is how the sages themselves struggled with it.*

  **C. Inclusivity of Practice (Addressing Faction A)**
  Paradoxically, keeping the difficult text is more inclusive than changing it. If we change the text, we force a specific theology (that sacrifice is *only* a thing of the past) onto everyone. If we keep the text and annotate it, we allow for multiple intentions:
  *   One worshiper may pray for literal restoration.
  *   Another may pray for the *spiritual* restoration the Temple represented.
  *   A third may view the passage as a meditation on the cost of atonement, informed by the *Guide*.
  The annotation validates all three positions as part of the conversation, whereas revising the text validates only one.

  **5. Implementation**

  To execute this, I propose the following timeline:
  *   **Week 1:** I will draft the "Kavanot" sidebar and the introductory essay, drawing on the *Guide*, *Mishneh Torah*, and Nachmanides.
  *   **Week 2:** We will review the draft for tone and clarity to ensure it is accessible but not dumbed down.
  *   **Week 3:** We vote on the final layout.

  **6. Conclusion**

  We are producing a machzor for a community that values both text and intellect. A machzor that smooths over the difficult parts of our tradition protects us from discomfort but deprives us of depth. The tension regarding sacrifice is not a bug in the system; it is a feature of our history.

  By retaining the text and framing it with honesty, we do not tell our congregation what to believe. We tell them what we pray, and we invite them to join us in the struggle to understand why. I ask that we adopt this recommendation and move forward to finalize the layout.

  Respectfully submitted,

  [Your Name]
  Chair, Liturgy Subcommittee
