answer: |-
  **Title:** The Broken Scale: Pascal's Theological Realism vs. Cynical Conventionalism

  In the landscape of early modern political thought, where Hobbes argues that justice is merely the command of the Sovereign, Pascal's *Pensées* presents a more unsettling paradox. On the surface, Pascal appears to be a cynic in a cleric's collar. He famously writes, "Justice without force is powerless; force without justice is tyrannical... unable to make what is just strong, we have made what is strong just." Combined with his observations that a man is killed for living on the other side of a river, or that "truth on this side of the Pyrenees, error on the other," Pascal seems to advocate for a might-makes-right conventionalism. However, to read Pascal as a cynic who believes justice is *nothing but* force is to ignore the theological architecture of his thought. Pascal is not a cynic; he is a theological realist. He asserts that "real" justice absolutely exists in the Order of Charity, but fallen human beings, restricted to the Orders of Body and Mind, are ontologically incapable of accessing it through politics.

  The cynical reading relies on isolating Pascal's political fragments from his soteriology. If one looks only at the "force and justice" fragment, it seems Pascal is arguing that legitimacy is a retroactive label we slap on power to keep the peace. The examples of the river and the Pyrenees reinforce this, suggesting that law is arbitrary, determined by geography and conquest rather than reason or nature. In a seminar dominated by Hobbes, this looks like a variation of the state of nature argument: without a sword to enforce covenants, justice is void. If Pascal stopped here, he would be arguing that custom *becomes* justice simply by enduring.

  But Pascal does not stop there. To understand why he isn't a cynic, one must apply his doctrine of the Three Orders: the Order of Bodies (power, force, senses), the Order of Minds (reason, science, philosophy), and the Order of Charity (grace, God, true justice). Pascal explicitly states that these orders are discontinuous; no amount of bodily force or mental reasoning can bridge the gap to the Order of Charity. True justice resides in the third order. It is objective, divine, and real. The problem is not that justice doesn't exist, but that human nature is corrupted by the Fall. Our reason is too weak to discern divine justice, and our bodies are too violent to enact it.

  Therefore, when Pascal says we "made what is strong just," he is not describing an ontological truth but a political necessity. He is describing damage control. Because we cannot access the Order of Charity through unaided reason or force, we must rely on custom and established power to prevent total chaos. Custom is not "right" in the eyes of God; it is merely a pragmatic barrier against the war of all against all. The cynic says, "Might makes right." Pascal says, "Might makes order, because we are too broken to handle Right." This is a crucial distinction. A cynic denies the existence of truth; Pascal mourns our inability to grasp it.

  This distinction separates Pascal sharply from Hobbes. For Hobbes, the Sovereign's will *constitutes* justice; there is no higher appeal. For Pascal, the Sovereign's law is a necessary fiction. It holds society together, but it remains distinct from Divine Justice. When Pascal mocks the judge who follows custom rather than seeking true equity, he isn't saying the judge is doing the right thing. He is saying the judge is acknowledging human limitation. We submit to custom not because it is true, but because it is stable, and stability is the only political good available to fallen man without grace.

  Ultimately, labeling Pascal a cynic mistakes his diagnosis of human wretchedness for a denial of divine perfection. The "river" and "Pyrenees" examples are not proofs that justice is arbitrary; they are proofs that *human* jurisdiction is arbitrary. Real justice exists, but it belongs to God. Pascal's political skepticism is not an end in itself but a propaedeutic to faith. He strips us of the illusion that we can build heaven on earth through laws or swords. We rely on force not because force is just, but because we are sinners who cannot bear the weight of true justice. Pascal defends the necessity of force precisely because he believes in a justice so high we cannot reach it, leaving us with no choice but to obey the strong while waiting for God.
