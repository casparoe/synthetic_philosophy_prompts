answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the bride's brother. And for the third of you in this room who *do* know her professionally, I know what you're thinking. You're waiting to see if I'm going to embarrass her by getting the metaphysics wrong. So, I promise: no substance dualism, no magical mental energies, and absolutely no cheap appeals to systematic overdetermination.

  We are here to celebrate a marriage. But my sister, being my sister, sees a marriage as a case study in the Causal Exclusion Problem. You all know the argument. Jaegwon Kim's challenge is the shadow over every non-reductive physicalist's life. It goes like this: If every physical event has a sufficient physical cause—and her brain is physical—then her decision to marry [Groom's Name] is fully accounted for by her neurons firing. So, what work is left for her *love* to do? If the neurons did it, her love looks like a spectator. An epiphenomenon. A shadow on the cave wall.

  The easy way out is to say, "Well, both caused it!" That's the overdetermination escape. It's like saying a window was broken by a ball *and* also by the momentum of the ball, as if they were two separate stones. My sister has always told me that's cheap. It treats the mind and brain as competitors fighting over the same causal turf. And honestly, treating love and biology as rivals doesn't feel like a good foundation for a marriage.

  So, here is the position I am committing to tonight, on her behalf and my own. We are going to reject the idea that her mental decision and her physical brain state are competitors at all.

  Imagine a traffic light turning red. That specific shade—let's call it "Scarlet"—caused me to hit the brakes. Did the property of "Redness" cause me to stop? Yes. Did "Scarlet" cause me to stop? Yes. But "Redness" isn't a second, ghostly force pushing on my foot *alongside* the Scarlet. "Redness" is a determinable property; "Scarlet" is the determinate. The Scarlet causes the braking *in virtue of* being Red.

  My sister's decision to marry [Groom's Name] is like the Redness. Her neural state is the Scarlet.

  If we say her decision is *nothing but* the neurons, we lose the pattern. We lose the fact that she would have said "Yes" even if her neurons were slightly different, or if she were built of silicon instead of carbon, provided the state of *Love* was realized. The mental property captures the causal generalization that the specific physical state misses. The neurons provide the *mechanism*, but the decision provides the *constraint*.

  So, to answer the question: Does her decision to marry him do anything in the world *over and above* her neurons?

  If by "over and above" you mean "does it add extra energy to the universe, violating conservation laws?" then the answer is **no**. She is a physicalist.

  But if by "over and above" you mean "does it exert a causal influence that is not captured by describing the neurons as mere matter?" then the answer is a resounding **yes**.

  Her love is not an extra push. It is the **organization** of the push. It is the higher-order pattern that recruits those specific neurons for this specific purpose. Without the mental property of "commitment," those neurons are just chemistry. With it, they are a promise. The chemistry is necessary, but the commitment is the cause that matters. It is the property that makes the effect intelligible. It is the property that holds across possible worlds.

  [Groom's Name], you aren't marrying her neurons. You're marrying the person those neurons realize. And that person has the causal power to change your life, not because she overrides physics, but because she organizes it.

  So, let's raise a glass. To the bride and groom. May your love be a determinable cause that is robustly realized in a thousand determinate ways. May you never be epiphenomenal to each other. And may your life together be a systematic exception to the exclusion argument, proving that two things can be one, without losing the power of either.

  To the happy couple!
