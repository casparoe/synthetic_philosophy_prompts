answer: |-
  Here is the blunt sanity check you asked for.

  ### 1. Is your Augustine accurate?
  **Yes.** You have not flattened him in a way that breaks your argument.

  Your definition is correct: for Augustine, *mendacium* (lying) is distinct from *falsitas* (falsity). A lie requires the *voluntas fallendi* (will to deceive). If I say something false believing it to be true, I am mistaken, not lying. If I say something true believing it to be false (to deceive), I am lying, because my heart is double.

  Your handling of the fiction/joke exemption is also sound. Augustine does not argue that fiction is *good*; he argues it is not *sinful lying* provided there is no intent to deceive regarding reality. In *De Mendacio*, he allows for "playful" speech (*jocosum*) and "imitative" speech (*mimicum*), provided the audience understands the register. The "frame" is the essential moral technology. If the frame is legible, no one is deceived, so no lie occurs.

  **The only nuance you're skimming:** Augustine is deeply anxious about this exemption. In *Contra Mendacium* (written later, against the Priscillianists who lied to infiltrate Catholics), he tightens the screws. He worries that even "harmless" fictions can habituate the soul to falsehood. But he never retracts the principle: fiction understood as fiction is not a lie. You are safe to use the principle as you have.

  ### 2. Does the autofiction/memoir argument hold?
  **Yes. In fact, it's stronger than you think.**

  Your worry is that "the morality of a huge amount of contemporary literary practice is hanging off a title-page label." You feel this is a strange place for ethics to live.

  **Augustine would disagree.** For Augustine, ethics *must* live in the sign. Language is a system of signs (*signa*), and the moral obligation of the speaker is to use signs in accordance with their established social meaning.
  *   If I label a book "Memoir," I am invoking a specific sign-contract: *These signs correspond to historical events in my life.*
  *   If I label a book "Novel," the contract is: *These signs correspond to an imagined world.*

  If you write a book that functions as a memoir (first person, real names, claim to truth) but invents scenes, you are breaking the semiotic contract. You are using the sign "Memoir" to induce a belief you know is false.

  **The Hole You're Looking For:**
  You ask if you're borrowing his name for a point he'd never sign off on. You aren't. However, consider this counter-argument: Augustine distinguishes between **literal truth** and **figurative truth**. He spends the *Confessions* worrying about whether his memory is accurate, but he also interprets Scripture allegorically.

  Could a defender of autofiction argue that the "truth" being offered is emotional or spiritual, not factual?
  *   **Augustine's Rebuttal:** He would likely say that if the *claim* is historical (e.g., "This happened to me"), then emotional truth does not excuse factual falsehood. He defends biblical allegory because he believes the *author* (God/Holy Spirit) intends the allegory. In autofiction, if the author intends the reader to believe the events happened literally, but they didn't, it is a lie.

  **Verdict:** Your argument is robust. The "title-page label" isn't a bug; it's the feature. The ethics reside in the clarity of the communicative contract.

  ### 3. The Firmus Story (Fact Check)
  You are half-remembering correctly, but the details need tightening for a footnote.

  *   **The Text:** The story is in *Contra Mendacium* (Against Lying), Book 10, Chapter 24.
  *   **The Name:** In the text of *Contra Mendacium*, Augustine refers to him as "a certain servant of God" (*quidam servus Dei*). He does **not** name him Firmus in that specific passage. The identification with **Firmus** (a presbyter at Tagaste) comes from later tradition and commentary (often via Possidius's *Life of Augustine*).
  *   **The Action:** The man hid a fugitive from imperial officers. When asked where the man was, he did not say "He is not here" (a lie). He said, **"I know where he is, but I cannot tell you"** (or, in some versions, he simply refused to answer).
  *   **The Point:** Augustine uses this to show that one can protect the truth (by silence or refusal) without uttering a falsehood.

  **Recommendation for the Footnote:**
  Do not state definitively "Augustine praises Bishop Firmus." Instead: *"Augustine recounts an anecdote in Contra Mendacium (10.24) regarding a 'servant of God' (later tradition identifies him as the presbyter Firmus) who, when asked by authorities about a fugitive he was hiding, refused to answer rather than assert a falsehood."*

  ### 4. One Blunt Critique to Strengthen the Post
  You worry that your reasoning makes ethics depend on a "catalog copy" label. Lean into that.

  The most Augustinian point you can make is that **genre is a promise.**
  Contemporary readers often treat genre labels as marketing constraints (e.g., "Memoir" just means "Narrative Nonfiction vibe"). Augustine treats them as moral vows. If the "title-page label" is the only thing stopping a memoir from being a lie, then the label is doing heavy moral lifting.

  If you want to sharpen the blade: Point out that Augustine would likely view the *ambiguity* of autofiction not as sophistication, but as a corruption of signs. He would argue that blurring the line doesn't elevate the art; it degrades the trust required for language to function at all.

  **Summary:**
  1.  **Augustine Summary:** Accurate.
  2.  **Autofiction Argument:** Logically sound within his framework.
  3.  **Firmus Story:** Verify the name attribution (text says "servant of God," tradition says Firmus).
  4.  **Tone:** Keep the worry about the "title page." That is the insight, not the error.

  Go publish it.
