  6.  *(Final thought before generating)*: The strongest angle is to argue that the "fact of the matter" hinges on *phenomenal character* rather than behavior or neural locus alone, because the epistemic worry is about *justification*, and justification is sensitive to phenomenology (what the subject has to go on). If the phenomenology doesn't change, the justification doesn't change, regardless of neural feedback.

