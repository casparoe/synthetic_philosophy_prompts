answer: |-
  Here is a minimal pair of cases designed to test the "Equal Standing" account of hypocritical blame (associated with R. J. Wallace, as well as work by Macalester Bell and Kyle Fritz & Daniel Miller).

  ### Theoretical Background
  On Equal Standing accounts, the standing to blame is not lost merely because the blamer has violated the norm in question (inconsistency). Rather, standing is lost because the hypocritical blamer implicitly asserts a **false claim of exemption**: she acts as if the norm binds the target but does not bind her, thereby violating the equality of moral persons. To retain standing while guilty, the blamer must negate this implicit claim.

  ### The Minimal Pair

  **Case 1: The Concealing Enforcer**
  Dr. Aris and Dr. Bose are senior researchers in a small lab with a strict, mutually agreed-upon norm against sharing preliminary data before peer review. Both Aris and Bose have recently shared preliminary data with outside colleagues in violation of this norm. Aris discovers Bose's violation. In a department meeting, Aris publicly chastises Bose, stating, "You have violated our core agreement on data privacy. This undermines the trust of the entire team. You need to apologize." Aris makes no mention of her own recent violation, and her tone and posture suggest she is speaking from the position of a compliant rule-follower enforcing a standard against a transgressor.

  **Case 2: The Acknowledging Co-Violator**
  Dr. Aris and Dr. Bose are senior researchers in a small lab with a strict, mutually agreed-upon norm against sharing preliminary data before peer review. Both Aris and Bose have recently shared preliminary data with outside colleagues in violation of this norm. Aris discovers Bose's violation. In a department meeting, Aris publicly addresses Bose, stating, "We have both violated our core agreement on data privacy. I am preparing my own apology for my breach. However, your specific disclosure has undermined the trust of the team, and you need to apologize as well." Aris's tone and posture suggest she is speaking as a fellow participant bound by the same standard, calling for mutual accountability.

  ### The Distinguishing Feature

  The precise feature of the second case that removes the standing-undermining implicit claim is **the blamer's explicit acknowledgment of her own equal subjection to the norm.**

  In **Case 1**, the act of blaming *without qualification* carries the conversational implicature that the blamer is authorized to judge because she stands *outside* the class of violators. This generates the false implicit claim: *"I am entitled to hold you to a standard from which I am exempt."* This violates the condition of equal standing.

  In **Case 2**, the blamer explicitly includes herself in the scope of the criticism ("We have both violated..."). By doing so, she **repudiates the claim of exemption**. She affirms that the normative authority she is invoking applies to her with the same force as it applies to the target. Because the false claim of superiority/exemption is absent, the violation of equal standing does not occur, and on the Equal Standing account, her standing to blame is retained despite her identical guilt.
