answer: |-
  This is a fantastic observation. You've hit on one of the most live wires in the philosophy of religion: the clash between the **Wittgensteinian "language game"** approach and the **Bayesian/Scientific Naturalist** approach.

  You are absolutely right about the Father O'Hara notes. In his *Lectures on Religious Belief* (1938), Wittgenstein critiques the idea that religious belief is a "hypothesis" about the world that stands or falls on empirical evidence.

  Here is how Wittgenstein would likely dismantle the modern "Rationalist" approach to credences, followed by an assessment of whether he's making a deep point or just building a fortress around religion.

  ### 1. The Category Mistake: Hypothesis vs. Picture
  Wittgenstein's core argument is that religious belief and scientific hypothesis belong to different **"language games."** They look similar grammatically ("I believe X exists"), but they function completely differently in the life of the speaker.

  *   **The Rationalist View:** "God exists" is a proposition about the ontology of the universe. It is either true or false. Since we lack perfect information, we assign a probability (credence). If new evidence comes in (e.g., the Problem of Evil, or a Miracle), we update the probability via Bayes' Theorem.
  *   **Wittgenstein's View:** For a genuine religious believer, "God exists" is not a theory used to explain gaps in data. It is a **"picture"** that regulates their entire life.

  Wittgenstein would argue that assigning a 15% credence to the Last Judgement is nonsensical because the *function* of believing in the Last Judgement is to create a specific kind of urgency and moral orientation in the present.

  If you believe there is a 15% chance a bomb will go off in your house, you might check the basement. If you believe there is a 100% certainty of the Last Judgement, you might give away all your possessions and devote your life to prayer. The **passion** and the **action** associated with the belief are part of the meaning of the belief. To dilute it to a probability is to change the meaning of the words entirely.

  Wittgenstein might say to a Rationalist: *"You are treating the religious believer as if they are making a bad scientific prediction, when they are actually expressing a commitment to a form of life."*

  ### 2. The "Unshakable" Nature of Belief
  Wittgenstein noted that religious belief is often characterized by its resistance to counter-evidence. To a Rationalist, this looks like dogmatism or irrationality. To Wittgenstein, this is a grammatical feature of religious belief.

  He uses the example of a believer talking about the Last Judgement. If you ask them, "What if science proves there's no afterlife?" the believer doesn't say, "Oh, I'll lower my credence to 40%." They say, "Science doesn't touch this."

  Wittgenstein isn't necessarily saying they are *right* to ignore science; he is saying that **if** they updated their belief based on scientific evidence, it wouldn't be religious belief anymore. It would be a scientific hypothesis.

  So, to the Rationalist saying, "I update my credence in God based on arguments," Wittgenstein would reply: *"Then you are not engaging in religion. You are engaging in metaphysics or cosmology. You are playing a different game."*

  ### 3. Is This Just a "Get Out of Jail Free" Card?
  This is your crucial question: **Is Wittgenstein just putting religion beyond criticism?**

  This is the standard accusation against Wittgensteinian philosophy of religion (often called **Fideism**). Critics (like Richard Dawkins or Bertrand Russell types) argue that Wittgenstein is shielding religion from accountability. If religion isn't about facts, you can't say it's false.

  **The Defense of Wittgenstein:**
  Wittgenstein would argue he isn't *protecting* religion; he is *describing* it. He is accusing the Rationalists of intellectual imperialism—trying to force all human discourse into the mold of empirical science. He would say:
  *   If religion claims to be science (like Father O'Hara or Intelligent Design proponents), **criticize it as science.** In that case, the Rationalists are right.
  *   But if religion is a framework for meaning, ethics, and ritual, then critiquing it with Bayesian probability is like critiquing a poem for being factually inaccurate. It's a category error.

  **The Weakness of Wittgenstein's Position:**
  However, there is a valid critique here. Many religious people *do* make factual claims. They claim Jesus rose from the dead as a historical event. They claim prayer heals cancer. They claim the universe is 6,000 years old.
  In these instances, the believer *is* playing the science game. Wittgenstein's approach can be too generous here. It risks sanitizing religion by ignoring the parts where it aggressively invades the territory of empirical fact.

  If a Rationalist says, "I give God a 15% probability," they are often reacting to those factual claims (miracles, design, etc.). Wittgenstein might say they are confused, but the Rationalist would say, *"No, the believer is making a truth claim, and I am assessing the likelihood of that truth claim being accurate."*

  ### 4. What Would Wittgenstein Say to the "15% Credence" Crowd?
  He would likely find the very idea of quantifying religious belief to be a symptom of our "craving for generality." He might say something like:

  > "You want to clean up the messiness of human language. You want to make 'belief' a uniform substance that can be measured in percentages. But look at how the word is actually used! When a mother says she believes her child is innocent, she is not stating a probability. When a Christian says they believe in the Resurrection, they are not weighing evidence. By turning it into a number, you haven't made it more rational; you've made it meaningless."

  He would argue that the Rationalist is suffering from a "bewitchment of our intelligence by means of language." They see the word "belief" and assume it refers to a single mental state (assigning probability), when it actually refers to a vast array of different practices, commitments, and orientations.

  ### The Verdict
  **Does Wittgenstein have a point?**
  Yes. He correctly identifies that for most believers throughout history, faith was not a Bayesian calculation. It was a totalizing commitment. Treating it as a hypothesis strips it of its psychological and sociological reality. The Rationalist model fails to capture what religion *does* for people.

  **Is it a shield?**
  It can be used as one. If religious leaders say, "You can't criticize our claims about the age of the earth because that's a different language game," they are misusing Wittgenstein. But if Wittgenstein's point is that **meaning is use**, then the Rationalists are also guilty of imposing their own "game" (scientific naturalism) onto a practice that operates by different rules.

  **The Synthesis:**
  The most honest position might be this:
  1.  **When religion makes empirical claims** (miracles, creation dates), the Rationalists are right to demand evidence and assign probabilities. Wittgenstein would agree that if O'Hara treats the Resurrection as a historical hypothesis, it must stand or fall as one.
  2.  **When religion makes existential/ethical claims** (life has meaning, we are accountable to a higher power), the Rationalists are out of their depth. You cannot assign a probability to a "form of life."

  Wittgenstein's value is in reminding the Rationalists that not everything that looks like a statement of fact is actually a statement of fact. But the Rationalists' value is in reminding us that when religious people *do* make statements of fact, they shouldn't be allowed to hide behind "mystery" when the evidence doesn't add up.

  You've stumbled onto the fact that the "Science vs. Religion" debate is often just two people shouting past each other because they disagree on what the word "belief" means. Wittgenstein's whole career was trying to show us that **that** is where the real philosophical work lies.
