      *   **The Rationalist Counter-View:** Explain why Rationalists do what they do. They want to avoid dogmatism. They see "God" as an explanatory hypothesis (like evolution or string theory).
      *   **Wittgenstein's Critique of the Rationalists:**
          *   *Category Mistake:* They are playing the wrong language game.
