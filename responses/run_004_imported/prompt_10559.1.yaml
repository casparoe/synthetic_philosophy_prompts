answer: |-
  **Setting:** *A quiet study, late afternoon. A laptop sits open on the desk between them, displaying a spreadsheet with a single highlighted cell: **Stake %**. They share a managed fund—significant, but not infinite. A favorable opportunity has arisen: a private venture round with a known probability structure. It is repeatable; similar deals will emerge quarterly for the foreseeable future. The odds are even-money: 60% chance to double the stake, 40% chance to lose it. The Kelly fraction is 20%.*

  **Elena:** (Hovering over the keyboard) Twenty percent. It's the only number that doesn't leak value over time.

  **Marcus:** Twenty percent is the *log-optimal* number. It is not the *utility-optimal* number. Unless you can prove my utility function is logarithmic, you're just asserting a constraint I haven't agreed to.

  **Elena:** I'm not asserting a preference, Marcus. I'm asserting a physical constraint. This isn't a one-off coin flip in a vacuum. It's a sequence. If we treat this as an ensemble average—like Samuelson did—we're modeling a universe where we get to play the bet once in a thousand parallel worlds and average the results. But we don't live in an ensemble. We live in one timeline. We experience the time average.

  **Marcus:** And that's where the ergodicity argument gets sold as metaphysics. Yes, the time-average growth rate converges to the expected log-wealth. Yes, in the limit as $N \to \infty$, the Kelly strategy outperforms any other strategy almost surely. But "almost surely in the limit" is a mathematical asymptote, not a mandate for finite beings. We have a horizon. We have liabilities in five years. Why should the behavior of the system at $N = \infty$ dictate our action at $N = 20$?

  **Elena:** Because the path to $N = 20$ is governed by the same geometry as the path to infinity. If you bet 40%—double Kelly—you increase the arithmetic expected value, yes. But you increase the volatility drag. You're inviting a drawdown that requires a disproportionate recovery. A 50% loss requires a 100% gain to break even. Kelly protects the denominator. It's not about the end state; it's about not being wiped out before you get there.

  **Marcus:** "Wiped out" is a specific utility cliff. If my utility function is $U(W) = -W^{-1}$, or even a standard CRRA with $\gamma = 2$, the optimal bet is different. Kelly is just EUT with $\gamma = 1$. You're smuggling in a specific risk aversion coefficient and calling it "rationality." If I need \$5 million for a project in five years, and 20% compounding doesn't get me there with high probability, but 30% does, then 30% is the rational choice. The "ruin" you fear is just low wealth. Unless you define ruin as zero, strictly.

  **Elena:** I do define ruin as zero. Or close enough that transaction costs and margin calls make it functionally zero. That's an absorbing barrier. Once you hit it, the game stops. You can't compound from zero. The expected value of a strategy that hits the absorbing barrier is irrelevant because the expectation is taken over paths that no longer exist. This is the non-ergodic core of the problem. The ensemble average includes paths where we go bust and paths where we win big. The time average is *one* path. If that path hits the barrier, the average is meaningless to *us*.

  **Marcus:** But we aren't betting the whole bankroll every time. We're betting a fraction. The probability of hitting zero with a 40% stake on a 60/40 edge is low over five years. It's not zero, but it's small. You're prioritizing the avoidance of a low-probability tail risk over the median outcome. Samuelson's point was precisely this: if I know I will only face twenty of these bets in my lifetime, maximizing the geometric mean might actually minimize my expected utility. The "long run dominance" is a mirage if the long run never arrives.

  **Elena:** But the "long run" isn't about time, it's about repetition. Even in twenty bets, the distribution of outcomes is skewed. The arithmetic mean is driven by the one-in-a-million path where we win twenty times in a row. The median path—the most likely experience—is governed by the geometric mean. If we bet double Kelly, the most likely outcome after twenty rounds is *worse* than if we bet single Kelly, even though the *average* outcome is higher. Do you want to bank on being the outlier in the right tail, or do you want to bank on the typical experience?

  **Marcus:** I want to bank on what satisfies the objective. Look, I accept the volatility drag. I accept that over-betting reduces the median. But "Geometric Rationality" claims normative superiority. It says I am *irrational* if I don't bet Kelly. That's the claim I reject. If I have a concave utility function that is steeper than log—say, I'm very risk-averse—I should bet *less* than Kelly. If I have a specific target and I'm willing to accept higher variance to hit it, I might bet *more*. Kelly is a solution to "maximize growth rate," not "maximize human welfare."

  **Elena:** But in a reinvestment context, growth rate *is* welfare. If we don't withdraw, if we let the capital work, wealth is multiplicative. In multiplicative systems, log-wealth is the only metric that is additive. It's the only one that respects the scaling. If you choose a different utility function, you're essentially fighting the math of compounding. You're saying, "I prefer a utility shape that fights the geometry of the market."

  **Marcus:** I'm saying the market doesn't care about my utility, and my utility doesn't care about the market's geometry. They meet at the decision point. Here's the weak point in your ergodicity argument, Elena: It assumes the bet is available forever at the same size relative to capital. But opportunities scale poorly. If our bankroll doubles, we can't necessarily deploy double the capital at the same 60/40 edge. Liquidity constraints bind. If the edge diminishes with size, the "infinite repetition" assumption breaks. Then we are back to a finite sequence of decaying opportunities. In that world, the Kelly fraction is often too conservative.

  **Elena:** That's a practical constraint, not a theoretical refutation. If the edge decays, you recalculate the Kelly fraction. It adapts. But the principle holds: never bet so much that a loss cripples your ability to bet again. That's the core. It's not about the math of infinity; it's about the survival of the agent. An agent that ceases to exist cannot maximize utility. Therefore, survival is a precondition for rationality. Kelly maximizes the rate of survival while extracting the edge.

  **Marcus:** Survival is a constraint, yes. But it's a constraint I can model in EUT. I can set $U(0) = -\infty$. I don't need the Kelly Criterion to tell me to avoid ruin. I just need a utility function that penalizes ruin heavily. The problem is you want to skip the step of defining utility. You want to say "Log is Rational" a priori. But why log? Why not square root? If I'm saving for retirement, my marginal utility of wealth drops faster than log. I should bet half-Kelly. If I'm a venture fund trying to return 10x to investors or shut down, my utility is convex above a threshold. I should bet above Kelly.

  **Elena:** Because log is the unique function where you are indifferent to the scale of the bet versus the number of bets. It's the only utility function that is myopic in a multiplicative world. With any other utility function, your optimal bet today depends on how many bets you expect to see tomorrow. With log, you just bet the edge. It decouples the decision from the horizon. That's why it's normative. It's the only strategy that doesn't require you to predict the future length of the game.

  **Marcus:** That's a convenience, not a moral imperative. It decouples the decision from the horizon by ignoring the horizon. If I know I have to liquidate in three years to buy a building, I *do* care about the horizon. Ignoring it is reckless. You're arguing for a strategy that is robust to ignorance of the future, but we aren't ignorant. We have a plan. We have a timeline.

  **Elena:** Plans fail. Timelines shift. The only thing certain is the sequence of decisions. If you deviate from Kelly, you are accepting a lower growth rate for a higher variance. You're trading certain long-term capacity for short-term volatility. In a shared bankroll, that volatility is a negative externality. If you bet 40% and we hit a losing streak of four—a 1-in-15 event—our capital is down 85%. I have to work ten times as hard to get back to baseline. You've imposed a tax on my future labor.

  **Marcus:** And if we bet 20% and a once-in-a-lifetime opportunity requires capital we don't have because we grew too slowly, you've imposed an opportunity cost. Risk isn't just downside. Risk is failing to meet obligations. If our obligation is to grow faster than inflation plus 5%, and Kelly only gives us inflation plus 3% in a bad decade, then Kelly failed.

  **Elena:** Then the obligation is the problem, not the betting strategy. You can't bet your way out of unrealistic return targets without gambling. And gambling—meaning taking negative expected log-wealth—is suicide in a repeated game.

  **Marcus:** (Pauses, looking at the spreadsheet) So we're at an impasse. You view deviation from Kelly as introducing a risk of ruin that violates the precondition of agency. I view adherence to Kelly as potentially violating the specific utility requirements of our actual finite lives. You prioritize the *process* of compounding; I prioritize the *outcome* at a specific terminal node.

  **Elena:** I prioritize the process because the terminal node is a fiction. There is no terminal node until we're dead. Until then, it's all intermediate capital.

  **Marcus:** But the "dead" part matters. If I'm 60, the "long run" is twenty years. If I'm 30, it's forty. The Kelly criterion doesn't care. That's its elegance and its blindness.

  **Elena:** (Sighs) Look. The math says 20% maximizes the expected logarithm. Your utility says something else maximizes expected utility. But we share this bankroll. We have different time horizons, different risk tolerances. But we share one equity curve. We cannot run two strategies.

  **Marcus:** No. One equity curve.

  **Elena:** If we bet more than Kelly, we increase the probability that the drawdown exceeds *my* tolerance for ruin. If we bet less, we decrease the probability that the growth exceeds *your* tolerance for stagnation.

  **Marcus:** So the question isn't about who is right about rationality. It's about whose constraint binds.

  **Elena:** Ruin binds harder than stagnation. Stagnation is reversible. Ruin is absorbing.

  **Marcus:** (Nods slowly) In a shared vessel, the lowest common denominator of risk tolerance dictates the speed. If you view 40% as existential risk, and I view it as acceptable variance, your existential risk vetoes my variance preference. Because if you're right, we both lose everything. If I'm right, we just grow slower.

  **Elena:** Exactly. The asymmetry of the downside forces the Kelly cap. Not because log is the true utility of money, but because in a partnership, the risk of separation (via ruin) dominates the benefit of excess return.

  **Marcus:** I can accept that. Not because Kelly is universally normative, but because it's the *coordination* equilibrium for agents with asymmetric downside tolerance in a multiplicative game. It's a Schelling point for survival.

  **Elena:** I'll take that. It's not that you're irrational for wanting more. It's that the system punishes "more" disproportionately.

  **Marcus:** (Gestures to the keyboard) So we type in 20?

  **Elena:** We type in 20. But I'm noting in the minutes that this is a constraint based on *my* survival threshold, not an absolute law of God.

  **Marcus:** And I'm noting that if the horizon shortens, or if the bet becomes non-repeatable, I reserve the right to argue for a deviation based on terminal utility.

  **Elena:** Deal. (She types **20%** into the cell.)

  **Marcus:** Just... keep an eye on the liquidity constraints I mentioned. If the edge decays, Kelly gets aggressive.

  **Elena:** If the edge decays, we recalculate. But we don't overbet the edge we *wish* we had.

  **Marcus:** No. We bet the edge we have.

  *(Elena hits Enter. The spreadsheet updates. They both lean back, the theoretical tension unresolved but practically contained.)*
