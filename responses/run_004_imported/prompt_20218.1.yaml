      *   *Decision:* The user's specific angle ("Cluelessness makes Meat Eater Problem worse") is tricky. It might be better framed as "Cluelessness shows the Meat Eater Problem is a distraction" or "Inconsistency in how we treat the future." I need to warn them that the "Meat Eater Problem" relies on the assumption that the meat consumption *is* predictable, whereas cluelessness argues *nothing* is predictable. So they are in tension.

