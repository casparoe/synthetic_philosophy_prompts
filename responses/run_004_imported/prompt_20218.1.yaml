      *   *Refined Critique:* The strongest version of the user's argument is: "If you invoke cluelessness to say 'we can't know if saving lives is good,' you must also admit 'we can't know if the meat eating is bad' (due to further downstream effects of the meat eating)." OR "If you claim the meat effect is knowable enough to count, then the life-saving effect is knowable enough to count."
      *   *Actually, the strongest hole:* The meat eater effect is *direct*. Saving a life $\rightarrow$ Person eats meat. Cluelessness is about *indirect* effects. Saving a life $\rightarrow$ Person has kid $\rightarrow$ Kid invents bomb. The user needs to distinguish between *foreseeable side effects* and *radical uncertainty*.
