answer: |-
  Here are ten questions designed to probe the structural mechanics of Dummett's argument, including the three specific angles you requested. Each includes a "press" follow-up based on the answer you're most likely to get.

  ### 1. The Operational Test for Racism (Required)
  **Question:** Dummett argues that much of the restrictionist case is racial hostility dressed up as concern for capacity or cohesion. But in policy design, intent is rarely explicit. If you were drafting legislation based on this view, what is the actual, usable test for distinguishing a border restriction that is racism in respectable dress from one that is a genuine, race-neutral response to capacity limits? Is it a matter of disparate impact, legislative history, or something else?

  **Follow-up:** I anticipate you'll point to legislative history or the specific targeting of Commonwealth citizens in the 20th century. But for *current* policy, where the demographics of migration have shifted, history alone might not suffice. If a policymaker says, "We aren't looking at race, we are looking at skill thresholds that happen to correlate with region," does Dummett's framework have the tools to pierce that veil without accusing the policymaker of lying?

  ### 2. Colonial Debt vs. Humanitarian Need (Required)
  **Question:** There is a potential tension between grounding admission claims in colonial history versus grounding them in raw humanitarian need. If the UK has a special, asymmetric obligation to a former colony, does that claim *trump* the claim of a refugee fleeing a state the UK never colonized? Or are they lexically equal? I'm trying to understand if the colonial argument strengthens the overall case for open borders, or if it inadvertently creates a hierarchy of victims.

  **Follow-up:** You'll likely say we should accept more people overall so we don't have to choose. But political capital and housing stock are finite resources in the short term. If we are forced to prioritize, does Dummett's view imply we should let a climate migrant from a non-colonized state drown to save a spot for an economic migrant from a former colony? That seems like a hard sell for a universalist ethic.

  ### 3. Bad Faith vs. Mundane Objections (Required)
  **Question:** You've noted that Dummett diagnoses restrictionist sentiment as fundamentally rooted in racism. However, critics often raise mundane objections about wage suppression, strain on public services, or the erosion of social trust. If we attribute all restrictionist arguments to bad faith or racial animus, doesn't that functionally immunize Dummett's view from engaging with the strongest empirical counter-arguments? How do we separate the racist element from the legitimate collective action problem?

  **Follow-up:** The standard reply is that the empirical data on wage suppression is weak or mixed. But the data on *social trust*—the Putnam argument—is more ambiguous. If a community genuinely feels cohesion breaking down, even if wages are stable, does Dummett's framework allow that to count as a valid "capacity" constraint, or is that feeling itself treated as a symptom of the racism he's diagnosing?

  ### 4. The Threshold of "Overwhelming"
  **Question:** Dummett concedes that a state's right to exclude is conditional, not absolute, but he allows for exclusion if immigration becomes "overwhelming." Structurally, where does that threshold sit? Is it a hard limit based on welfare state solvency, or a soft limit based on political stability? If it's the latter, aren't we allowing racist public opinion to set the limit simply by threatening instability?

  **Follow-up:** You might argue that we must educate the public to raise that threshold. But in the interim, while public opinion remains hostile, does the philosopher's obligation to moral truth require ignoring the stability constraint, or does it require a "second best" policy that accommodates some racism to prevent a total backlash?

  ### 5. Internal Borders and Enforcement
  **Question:** *On Immigration and Refugees* was published in 2001, prior to the "Hostile Environment" policies and the Windrush Scandal. Dummett focuses heavily on the external border. Does his argument extend to internal enforcement? If the state has a conditional right to exclude, does it also have a right to check the status of someone already working in the NHS or renting a flat, or does that internal policing violate the moral status of the resident?

  **Follow-up:** The likely answer is that internal policing creates a caste system. But without internal checks, an external border is porous by definition. If Dummett's view requires us to tolerate a certain amount of "irregularity" to avoid internal hostility, how do we define the point where the rule of law itself is compromised?

  ### 6. The Temporal Aspect of Cultural Cohesion
  **Question:** One of the conditions Dummett accepts for restriction is the preservation of cultural cohesion. However, he views culture as fluid. The structural problem here is time. Even if culture is fluid, there is a *rate of change* that societies can absorb before friction occurs. Does Dummett's argument allow for "speed bumps" on immigration to manage the *tempo* of integration, or is any restriction based on speed just racism by another name?

  **Follow-up:** If you say speed bumps are permissible, doesn't that concede the restrictionist's main point—that there is a limit to absorption? And if there is a limit, who gets to decide the speed? Because historically, that discretion has been the primary vehicle for the discrimination Dummett opposes.

  ### 7. Non-Ideal Theory and Compromise
  **Question:** Dummett is laying out a moral argument, but you are applying it in a non-ideal political context. In software terms, this looks like a spec that the legacy system can't run. How much compromise is permissible? If the only politically viable policy is one that Dummett would deem morally insufficient but less harmful than the status quo, does his framework offer guidance on supporting "half-measures"?

  **Follow-up:** Philosophers often resist endorsing unjust laws. But if refusing to compromise means the restrictionists win entirely, is there a duty to endorse a flawed policy that reduces harm, even if it violates the principle of unconditional admission for some?

  ### 8. The Epistemic Authority of the State
  **Question:** Dummett argues that the state cannot be the sole judge of its own right to exclude, because it is an interested party. But if the state doesn't decide, who does? Is there a supranational body, a court, or a moral calculus that overrides sovereign decision-making? If the answer is "moral calculus," how do we enforce that against a sovereign power that disagrees?

  **Follow-up:** You'll likely suggest international law or human rights frameworks. But those frameworks rely on state consent for enforcement. If a state decides to withdraw from those conventions citing the very "capacity" arguments Dummett rejects, does his argument have any leverage other than moral shaming?

  ### 9. The Logic of the "Right to Stay"
  **Question:** Dummett flips the script by suggesting people have a right to *stay* where they are, and migration is often a failure of that right. If the primary obligation is to make regions livable so people *don't* have to move, does that shift the burden from immigration policy to foreign intervention? And if so, does that justify interventionism in a way that conflicts with anti-imperialist sentiments?

  **Follow-up:** There's a risk that "making regions livable" becomes a pretext for the same colonial powers to manage the Global South. How does Dummett's view distinguish between "fulfilling obligations to make stay possible" and "neocolonial management of borders from afar"?

  ### 10. Analytic Philosophy and Moral Clarity
  **Question:** Dummett was primarily a logician and philosopher of language. Do you see the structure of *On Immigration and Refugees* as attempting to bring analytic precision to a muddy debate? Is the goal to show that the restrictionist position is not just immoral, but *incoherent*?

  **Follow-up:** If the goal is to show incoherence, critics might say political arguments are never logically airtight; they are about competing values. If Dummett is demanding a level of logical consistency from immigration policy that no other area of government (like tax or defense) possesses, is he setting a bar that makes the argument philosophically robust but politically inert?
