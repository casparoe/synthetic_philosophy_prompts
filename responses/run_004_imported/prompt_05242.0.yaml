      *   **Constraints:**
          *   Push on the *structure* of the argument, not just headline claims.
          *   Avoid generic intros ("What drew you to this?").
          *   Tone: Two people who have sat with the argument (intellectual, probing, not surface-level).
          *   **Specific Required Questions:**
              1.  A test for distinguishing racism-in-disguise vs. genuine capacity limits (with follow-up).
              2.  Tension between colonial obligations vs. raw humanitarian need (non-colonized refugees) (with follow-up).
              3.  Tension between racism diagnosis vs. mundane economic/social objections (bad faith accusation) (with follow-up).
          *   **Format:** Question + Anticipated Reply + Follow-up for *each* question.

  2.  **Deconstruct Dummett's Argument (Mental Sandbox):**
      *   Dummett is an analytic philosopher (known for logic/language), but this book is ethical/political.
      *   Core premise: Exclusion is inherently coercive and needs justification.
      *   The "Right to Exclude" is not sovereign absolute; it's constrained by moral duties.
      *   Racism is a central diagnostic tool for Dummett. He argues British immigration law was historically shaped by keeping "colored" people out while allowing "white" Commonwealth citizens in.
      *   Colonial obligation: If you exploited/bordered a place, you owe them entry when things go wrong.
      *   Tension: How do we operationalize "racism" in policy without mind-reading? How do we weigh special obligations against universal needs?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: The Racism vs. Capacity Test.*
          *   *Draft:* How do we know if it's racism or capacity?
          *   *Refinement:* Needs to be structural. Dummett says racism hides behind capacity. What's the operational test?
          *   *Follow-up:* She'll likely say "look at the history" or "disparate impact." I need to push on whether that's enough for *current* policy.
          *   *Final Polish:* Focus on the "operationalizable criterion."

      *   *Requirement 2: Colonial History vs. Raw Need.*
          *   *Draft:* What about refugees from places we didn't colonize?
          *   *Refinement:* Frame it as a hierarchy of claims. Does colonial debt *trump* humanitarian need, or sit alongside it? If the latter, how do we prioritize when slots are limited?
          *   *Follow-up:* She might say "we should accept more overall." Push on the zero-sum reality of political capital/budget.
          *   *Final Polish:* Focus on the "lexical priority" or "weighting" of claims.

      *   *Requirement 3: Racism Diagnosis vs. Economic/Social Objections.*
          *   *Draft:* Isn't it rude to call everyone racist? What about wages?
          *   *Refinement:* Frame it as a dialectical stalemate. If every objection is dismissed as bad faith, debate ends. How does Dummett's view engage with *good faith* restrictionists?
          *   *Follow-up:* She might say "the evidence doesn't support the economic harm." Push on *social trust* (Putnam etc.), which is harder to debunk with data.
          *   *Final Polish:* Focus on "charitable interpretation" vs. "structural diagnosis."

      *   *Requirement 4: The Conditional Right to Exclude.*
          *   *Idea:* Dummett says the right is conditional. What are the specific conditions that *must* be met to close a border?
          *   *Follow-up:* She'll list conditions (security, welfare). Push on who decides if they are met.
          *   *Refinement:* Focus on the "threshold." When does the condition trigger?

      *   *Requirement 5: The Definition of "The People".*
          *   *Idea:* Immigration changes the demos. Dummett addresses cultural cohesion.
          *   *Follow-up:* She'll say culture is fluid. Push on the *speed* of change.
          *   *Refinement:* Focus on the "temporal" aspect of cultural integration.

      *   *Requirement 6: Enforcement and Internal Borders.*
          *   *Idea:* Dummett wrote in 2001. Pre-Windrush Scandal (mostly). How does his view handle internal enforcement?
          *   *Follow-up:* She'll say "minimize hostility." Push on the necessity of checking status for services.
          *   *Refinement:* Connect external borders to internal rights.

      *   *Requirement 7: The Role of the Philosopher vs. Policymaker.*
          *   *Idea:* Philosophy gives ideals, policy needs compromise.
          *   *Follow-up:* She'll say "ideals guide policy." Push on the "second best" problem.
          *   *Refinement:* Focus on "non-ideal theory."

      *   *Requirement 8: Dummett's Analytic Background.*
          *   *Idea:* He was a logician. Is there a logical structure to this ethical argument?
          *   *Follow-up:* She'll say "clarity of concepts." Push on whether moral ambiguity resists logical formalization.
          *   *Refinement:* Focus on "conceptual precision."

      *   *Requirement 9: Global vs. Regional.*
