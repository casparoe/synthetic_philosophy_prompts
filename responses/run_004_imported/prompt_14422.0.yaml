      *   *Why not Info?* The choice of reference machine is not "data" about the world; it's the framework for interpreting data. It is the definition of "simplicity" for that agent.
      *   *Why honest/rational?* Both are mathematically coherent Bayesians. Neither is self-deceived.
      *   *Why irreducible?* You cannot derive Language A from data without already assuming a language to interpret the data. It's circular.

