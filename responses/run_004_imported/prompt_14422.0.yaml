answer: |-
  Here is a concrete case that isolates the prior from information, followed by an analysis of why it resists redescription and what it implies for rationality.

  ### The Case: The Reference Machine Disagreement

  **The Agents:**
  Alice and Bob are idealized Bayesian agents (specifically, Solomonoff Inductors). They are computationally unbounded, perfectly honest, and have full access to each other's source code. They share the exact same sensory stream: a binary sequence of data from a black box (e.g., `0, 1, 0, 1, 0, 1...`).

  **The Claim:**
  They are betting on the next bit in the sequence. The current sequence is a long string that appears patterned but contains noise (e.g., a noisy sine wave encoded in binary).
  *   **Alice** assigns a 90% probability to the next bit being `0`.
  *   **Bob** assigns a 60% probability to the next bit being `0`.

  **The Common Knowledge:**
  Alice and Bob know each other's probability assignments. They know each other's reasoning processes. They know they have seen the exact same data stream. There is no private information; their "evidence" sets are identical.

  **The Source of Disagreement:**
  The disagreement stems from their **Universal Turing Machines (UTMs)**.
  To perform Solomonoff induction, an agent must choose a specific UTM to measure the "complexity" (Kolmogorov complexity) of hypotheses. The prior probability of a hypothesis is proportional to $2^{-L}$, where $L$ is the length of the program generating the data on that UTM.

  However, Kolmogorov complexity is not absolute; it is relative to the chosen UTM. By the Invariance Theorem, any two UTMs differ only by a constant factor. But that constant factor can be arbitrarily large.
  *   **Alice's UTM** is optimized such that the hypothesis "Noisy Sine Wave" has a very short program description.
  *   **Bob's UTM** is optimized such that the hypothesis "Alternating Pattern with Glitches" has a shorter description relative to Alice's.

  Because the data stream is finite, the "constant offset" between their UTMs has not yet been swamped by the accumulation of data. They are both updating perfectly rationally *given their priors*, but their priors weight "simplicity" differently because they measure "length" differently.

  ### Why This Resists Redescription as Information

  Robin Hanson's argument suggests that if Alice knows Bob has a different prior, she should update her prior to account for the "information" that Bob exists and reasons differently. However, this case resists that redescription for three reasons:

  1.  **The Circularity of Learning Priors:**
      To treat the choice of UTM as a piece of "information" to be updated on, the agents would need a *hyper-prior* over which UTM is "correct." But evaluating which UTM is best requires using a UTM to measure the success of candidates. You cannot use data to select a prior without already presupposing a prior to interpret the data. There is no "view from nowhere" from which to judge which UTM maps best to reality.

  2.  **No Fact of the Matter:**
      In information asymmetry, there is a ground truth (e.g., the card is in my hand). In this case, there is no fact of the matter about which UTM is the "true" meter of simplicity. Simplicity is not a property of the world alone; it is a relation between the world and the language used to describe it. Alice cannot point to a piece of evidence that proves her UTM is objectively better, because the interpretation of that evidence depends on the UTM.

  3.  **Finite Time Horizons:**
      While the Invariance Theorem guarantees their posteriors will *eventually* converge as data approaches infinity, rational agents operate in finite time. In the short-to-medium run, the choice of reference machine materially alters probabilities. Since neither agent lives long enough to reach the asymptotic limit, the difference remains practically persistent and action-guiding.

  ### Implications for Rationality and the Common Prior

  This example suggests that **rationality does not require a common prior.**

  1.  **Rationality as Coherence, Not Uniqueness:**
      If rationality is defined as internal coherence (avoiding Dutch books, updating via Bayes' rule), both Alice and Bob are fully rational. They are not making calculation errors, nor are they self-deceived. The Common Prior Assumption (CPA) is therefore not a constraint of rationality *per se*, but an additional normative constraint on *which* rational agents can agree.

  2.  **The "Prior on Priors" Regress:**
      Hanson's move—to argue that disagreeing about priors is irrational because you should treat the other person's prior as evidence—leads to an infinite regress. If I should update my prior to match yours, I must have a prior belief about how reliable your prior is. But where did *that* prior come from? If it came from data, we need a prior to interpret that data. The regress stops only at a foundational prior that is not itself updated. If that foundational prior can differ between agents without irrationality, then the CPA is false.

  3.  **Legitimate Disagreement:**
      This implies that some persistent disagreements are not failures of rationality or honesty, but reflections of the **underdetermination of theory by data**. When data is insufficient to swamp the prior (which is almost always true for complex, real-world questions like politics, macroeconomics, or cosmology), agents with different but equally coherent inductive biases will rationally disagree.

  In conclusion, the Reference Machine case demonstrates that priors are not merely "old information" waiting to be shared; they are the **frameworks** that make information intelligible. Because there is no unique, data-derived way to select a framework, rational agents can honestly, knowingly, and persistently disagree without violating the laws of probability.
