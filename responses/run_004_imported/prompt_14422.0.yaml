      *   *Idea 2: Mathematical axioms.* Agent A accepts ZFC, Agent B accepts ZF+¬C.
          *   *Critique:* This is about logical truth, not empirical Bayesian updating. Aumann's theorem applies to probabilistic beliefs about states of the world. However, it touches on "starting points." But is it "information"? No, it's definitional. Maybe too abstract.
      *   *Idea 3: Inductive bias.* Agent A thinks the sun will rise (uniformity of nature), Agent B thinks it's 50/50 every day (gambler's fallacy as a prior?).
          *   *Critique:* Usually, we treat the "uniformity of nature" as something learned from data. If Agent B has seen the sun rise 1000 times and still thinks 50/50, is that a prior or irrational updating? Hanson would call that irrational. I need a case where the prior difference is *reasonable*.
      *   *Idea 4: Fundamental values vs. Facts.*
          *   *Critique:* Aumann is about beliefs (is X true?), not values (is X good?). The prompt asks for disagreement about a *claim*.
      *   *Idea 5: The "Grue" Problem / Inductive Priors.*
          *   *Scenario:* Two agents observing emeralds. One uses "Green" prior, one uses "Grue" prior.
