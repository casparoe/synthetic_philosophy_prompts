      *   *Disagreement:* Alice assigns P(Collapse) = 0.9. Bob assigns P(Collapse) = 0.1.
      *   *Why Prior?* The empirical predictions are identical (by design of the interpretations). No future experiment can distinguish them (currently).
      *   *Why not Info?* They have the same data. The difference is how they penalize ontological complexity. Alice penalizes unobservable branches (Many Worlds). Bob penalizes non-unitary dynamics (Collapse).
      *   *Is this just "Values"?* No, it's a claim about reality ("Is there a collapse?").
      *   *Is it Reducible to Info?* If "Simplicity is truth-conducive" is a fact, they should agree on it. If it's a prior on how to map simplicity to truth, it's a prior.
