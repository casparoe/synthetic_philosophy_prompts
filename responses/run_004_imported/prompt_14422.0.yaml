      *   *Idea 6: Cosmological/Modal Realism.*
          *   *Scenario:* Agent A assigns high prior to Multiverse, Agent B assigns low prior.
          *   *Critique:* Evidence is the same (fine-tuning). Is the prior difference reducible to info? "I read Tegmark." "So did I." If they read the same papers but weigh the elegance differently, is that info or prior? It feels like a prior on model complexity.

  3.  **Developing the Best Candidate: The "Inductive Bias" Case (Goodman's Grue)**
      *   *Why:* It directly addresses the definition of "evidence." Information is usually "data points." Priors are "how to weigh patterns in data."
      *   *Setup:* Two agents, Alice and Bob. They observe a sequence of emeralds. All are green.
      *   *Claim:* "The next emerald will be green."
      *   *Alice's Prior:* Favors hypotheses where properties are stable over time (Green).
      *   *Bob's Prior:* Favors hypotheses where properties change at specific times (Grue: Green before time T, Blue after).
      *   *Common Knowledge:* They know each other's priors. They see the same data.
      *   *Persistence:* Even after 1,000 green emeralds, if T is set to 1,001, Bob still expects Blue. Alice expects Green.
      *   *Resisting Redescription:* Can we say Bob has "private info" that T=1001? No, T is a parameter of his hypothesis space weighting. Can we say Alice has "info" that nature is simple? If "nature is simple" is a fact about the world, it should be updated on. But simplicity is usually a prior constraint on updating (Occam's Razor). If simplicity is a *fact*, then Bob is irrational for not updating on it. If simplicity is a *prior commitment*, then it's a CPA violation.
