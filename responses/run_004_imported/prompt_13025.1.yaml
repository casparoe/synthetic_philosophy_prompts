prompt: |-
  So in my philosophy of math seminar we just got to Skolem's paradox, and I feel like either I'm missing something huge or my professor is being way too chill about a real problem with ZFC. Here's my understanding of it: ZFC proves Cantor's theorem, so it proves that the power set of omega (equivalently, the reals) is uncountable. But the Lowenheim-Skolem theorem says any first-order theory with an infinite model also has a countable model, so if ZFC is consistent it has some countable model M. That means the set M interprets as "the power set of omega" only has countably many elements once you look at M from the outside, there's literally a bijection between it and omega sitting right there, and ZFC just went ahead and proved a false statement about its own power set.

  A few of us from class got into a whole debate about this last night, and one guy was arguing that this basically tanks our confidence in ZFC as a whole, like, if it can be "wrong" about somthing as basic as whether one of its own sets is countable, why should we trust it about way more exotic stuff like large cardinals or the continuum hypothesis? I was kind of nodding along, but then I remembered our professor introduced this as a classic, almost cute, result, not as some kind of crisis, so clearly I'm not getting the resolution here.

  Can you walk me through exactly where the reasoning above goes wrong (assuming it does), in a way that actually explains why this isn't a real contradiction rather than just asserting that it isn't? And if you've got space, I'd also be curious whether this connects at all to bigger debates about mathematical realism, I have this fuzzy memory of Putnam's name coming up in a similar context and can't tell if that's actually the same issue or a totally different one.
