answer: |-
  The drawer was made of oak, lined with felt that had long ago lost its grey to a dusty black. Inside it lay three sheets of paper. On those three sheets, the universe was settled.

  Elias sat at his desk, his hand hovering over the wood. He could feel the vibration of the house settling, the groan of pipes, the distant hum of traffic. Contingent noises. Unreliable data. But the drawer was silent. Inside, the symbols waited: $\square \exists x G(x)$. Necessarily, there exists an x such that x is God-like.

  It was airtight. He had checked the axioms a thousand times. He had checked the definitions of "positive property." He had checked the modal operators until the ink threatened to wear through the paper. The logic held. It was a crystal structure, perfect and immutable. If you accepted the axioms, the conclusion followed with the violence of a falling stone. God was not a hope. God was a theorem.

  A knock at the door shattered the silence.

  Elias didn't turn. "Enter."

  It was Sarah. She wore the soft blue scrubs of the home-care agency, a uniform of manufactured trust. She carried a tray. The smell hit him before she set it down—chicken broth, thyme, salt. An empirical assault.

  "Time for lunch, Dr. Vance," she said. Her voice was warm, modulated to soothe. He knew this was part of the training. *Parameter: Caregiver Tone.*

  "Set it down," Elias said. He kept his back to her, staring at the bookshelf. Spines of logic texts. *Principia Mathematica*. Wittgenstein. They were props now. The truth was in the drawer.

  He heard the clink of the spoon against the ceramic bowl. "It's fresh. I made it in the kitchen downstairs. You can watch me next time, if you like."

  "I do not like," Elias said.

  "Please, Elias. You're skin and bone. The vitamins—"

  "The vitamins are irrelevant if the carrier is toxic."

  Sarah sighed. It was a human sound, messy with frustration. "No one is poisoning you. Your wife called. She's worried."

  *My wife.* The variable was undefined. She was in a clinic three hours away. She said it was for rest. He suspected it was for observation. She claimed she loved him. Love was an emotional state; emotional states were not truth-apt. They could not be verified. Only formal systems could be verified.

  "Tell her I am working," Elias said.

  "Tell her you're starving?"

  "Tell her I am verifying."

  Sarah moved closer. He flinched. He couldn't help it. The movement was in his peripheral vision, unquantified. If she moved her left hand at velocity *v*, could she introduce a substance into the bowl? Yes. The probability was non-zero. In a formal system, non-zero risk in a critical axiom collapses the proof. If the food is poison, the body fails. If the body fails, the mind fails. If the mind fails, the proof is lost.

  Therefore, the preservation of the proof requires the rejection of the food.

  "I'll leave it here," Sarah said softly. "I'll be in the hall. Please. Just a few spoons."

  She left. The door clicked shut. The lock engaged.

  Elias turned to the desk. The steam rose from the bowl in chaotic plumes. Turbulent fluid dynamics. Unpredictable. He leaned in. He sniffed. Aromas are chemical compounds binding to receptors. Subjective. He could not taste the arsenic. He could not taste the sedative. He could only taste the salt, and salt could mask anything.

  He looked at the drawer.

  Why was it like this? Why did the human mind possess the capacity to derive the Necessary Being, to touch the hem of the Absolute through pure reason, yet lacked the capacity to verify a bowl of soup?

  It was the Incompleteness, he thought. Not his own, but the world's. The system of human interaction was incomplete. There were axioms of motive hidden from him. *Sarah wants me to eat.* Why? Compassion? Duty? Malice? There was no derivation tree for human intent. It was a black box.

  But the drawer. The drawer was complete.

  He opened it. The papers glowed in the dim light.

  He traced the first line with a trembling finger. *Definition 1: x is God-like if and only if x possesses all positive properties.*

  He had spent thirty years defining "positive." Not morally good. Not aesthetically pleasing. *Positive* in the sense of perfection. Existence, he had proved, is a positive property. Necessary existence is a positive property. Therefore, a God-like being must exist necessarily.

  It was done. It was finished. He had solved the oldest riddle. He had forced the heavens to yield their coordinates through the sheer leverage of syntax.

  And yet, he was hungry.

  His stomach cramped, a visceral, logical error in the biological machine. Pain. A signal. *Input required.*

  He looked at the soup. He looked at the proof.

  If the Proof was true, then a Perfect Being exists. A Perfect Being is benevolent. If a Perfect Being is benevolent, why is the world structured such that truth is separated from sustenance? Why must he choose between the safety of the logic and the fuel of the flesh?

  Perhaps the test was not in the derivation. Perhaps the test was in the trust.

  But trust was not a logical operator. You cannot derive trust. You can only leap. And Elias Vance had spent a lifetime building a ladder so he would never have to leap again.

  He picked up his pen. He could annotate the proof. Refine the notation for *Necessity*. Make it clearer for the one person he might show it to, someday, when the world was ready to accept that God was a matter of calculation.

  His hand shook. The tremor was worsening. Caloric deficit. Cognitive decline imminent. If he died, the drawer would be opened by strangers. Men with clipboards who would see scribbles. They would call it madness. They would burn the paper.

  If he ate, he risked the poison.
  If he starved, he risked the loss of the Proof.

  It was a paradox. A fatal loop.

  Sarah knocked again. "Elias? The broth is cooling."

  He looked at the steam. It was fading. The heat was dissipating into the room, entropy winning, as it always did. The proof did not cool. The proof did not hunger. The proof did not need Sarah.

  "Go away," Elias whispered.

  "Elias, please."

  "I have it," he said, his voice cracking. "Do you understand? I have it. It's right here. It's real."

  "Okay," Sarah said, her voice thick with a pity he despised. "Keep it safe. But eat the soup."

  He closed the drawer. The click of the latch was the sound of a vault sealing. He turned back to the desk and pulled the bowl closer. He picked up the spoon.

  He held it over the paper, just for a second. If he dropped it, it would stain the axioms. A contingent accident ruining a necessary truth.

  He moved the spoon to his lips.

  He stopped.

  He could taste the metal of the spoon. Cold, hard, distinct. But the liquid... the liquid was unknown. It was the unknown variable *x* that could negate the entire equation.

  He put the spoon down.

  He opened the drawer again. He needed to see it. Just once more. To anchor himself. The symbols were sharp, black, absolute. They did not waver. They did not rot. They did not require thyme or salt.

  *Theorem 4: If x is God-like, then x exists necessarily.*

  Elias rested his forehead on the cool wood of the desk. The hunger was a dull roar now, a background noise. He realized, with a sudden, chilling clarity, that he had already solved the problem.

  The body was contingent. It was subject to time, to poison, to decay. It was not necessary.
  The Proof was necessary. It was timeless. It was immune to arsenic.

  To save the Proof, the vessel had to be sacrificed. It was the only derivation that made sense.

  "Elias?" Sarah's hand was on the doorknob.

  "Don't come in," he said. He slid the drawer shut. He folded his hands over the wood, guarding the oak, guarding the felt, guarding the three sheets of paper where the universe was finally, perfectly, safe.

  "I'm not hungry," he lied to the door. "I've already eaten."

  He sat in the silence, waiting for the logic to hold, while the room grew dark around him.
