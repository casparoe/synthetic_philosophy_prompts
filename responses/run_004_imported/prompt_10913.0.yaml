  I've been down a Godel rabbit hole for a piece on the ontological argument and there's one detail that won't leave me alone: the guy spends decades quietly working out an airtight modal-logic proof that a god-like being necesarily exists, shows it to basically one person under a vow of secrecy because he's scared people will think he actually believes it rather than having just derived it, and years later starves himself to death because his wife's hospitalized and she's the only person he trusts not to poison his food. Same mind, total faith in formal reasoning, zero faith in anyone's word about a bowl of soup. Could you write a short story about a character in roughly that spot - a finished proof of a necessary being sitting in a drawer, right next to a total collapse of trust in anything that isn't formal proof? Doesn't need to be biographically accurate, I just want the story to sit with that tension.
