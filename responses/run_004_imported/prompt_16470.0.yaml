answer: |-
  Good morning.

  For those of you who knew Marisol only as a neighbor, a cousin, or a friend, you likely knew her as the woman who listened with an intensity that made you feel you were the only person in the room. For those of us who knew her as a professor, we knew that intensity as a kind of discipline.

  I remember the first day of her fiction seminar. I was twenty-two, full of vague ambitions and adjectives. She sat at the head of a scarred wooden table, a copy of *Ficciones* in front of her, not open, but closed, her hand resting on the cover. She didn't ask us why we wrote. She asked us what time it was.

  When we looked at our watches, she told us that the watch was lying. Or rather, that it was telling a truth we couldn't feel. She told us that we were going to spend the semester learning how to tell the truth about things that might not exist.

  Marisol spent forty years translating Borges, but she did not treat his work as a puzzle to be solved. She treated it as a map for how to die.

  I know that sounds grim. But to Marisol, clarity was a form of kindness. She knew the arguments better than anyone. She could recite "A New Refutation of Time" from memory. She knew the logic that suggests the past and future are merely constructs of the mind. She knew the argument in "The Immortal," that given enough centuries, a person becomes all people, and thus no one at all.

  In the last year, when the illness had taken hold and the visitors came to the hospital, some tried to offer her the standard comforts. They told her she would live on in her work. They told her that time was relative, that she was part of something eternal.

  She would wave them away, gently but firmly. She did not want the grammar of her death corrected.

  She taught me, and she taught us, that there is a difference between a philosophical argument and a human life. Borges himself, at the end of his refutation of time, admits defeat. He writes that despite all the logic, despite all the arguments that time is unreal, he still feels the passage of it. He still feels the fear of the end.

  Marisol wanted us to feel that, too.

  So, I am not going to stand here and tell you that she is watching over us. She did not believe she would be watching anything. To suggest otherwise would be to pretend we know things we do not, and she valued honesty over comfort.

  I am not going to tell you that death is an illusion, or that she has simply stepped out of time. She spent her life translating the words of men who argued that time was a labyrinth, but she lived her life as if every second counted. If time is a construct, she built her house inside it anyway, with bricks of patience and mortar of rigor.

  And I am not going to tell you that she lives on in our memories. She called that a consolation prize dressed up as metaphysics. She knew that memories fade. She knew that we will forget the sound of her voice. She knew that the specific weight of her hand on a book is gone from the world.

  To say otherwise is to diminish the reality of what has happened here. We have lost something finite. And because it is finite, it matters.

  For her family and friends who never read a line of Borges: you knew her not for her philosophy, but for her presence. You knew that when she made you coffee, she was making you coffee. She wasn't thinking about the next moment. She was in that one. That is the only version of eternity she trusted. The absolute reality of the present tense.

  For her students: she taught us that writing is the act of pinning down a moment before it slips away. She taught us that precision is a moral act. If we write well, if we live accurately, it is not because we will be remembered. It is because the truth of the moment deserves to be honored while it is happening.

  There is a comfort in this, though it is a hard one. It is the comfort of not having to pretend. We do not have to imagine her in a better place. We do not have to imagine her as a ghost in the machinery of the universe. We can simply love who she was, here, where she was.

  We can acknowledge that the silence she leaves behind is real. The empty chair in the seminar room is real. The gap in the family dinner table is real. Borges argued that the self is a multiplicity, that we are many people over the course of a life. Marisol was many people to us. A mentor, a translator, a stubborn friend, a patient listener. All of them are gone.

  And yet, we are here.

  We are here, standing in the time she told us was unreal, feeling the grief she told us was inevitable. In a way, this is the final lesson. To stand in the fire of loss without reaching for the water of a lie.

  She did not want us to be consoled by metaphysics. She wanted us to be braced by the truth. The truth is that she is not coming back. The truth is that the work she did—the translations, the teaching, the loving—is finished. It is a complete shape now. It does not need to continue to be valid.

  So, we will not say she lives on. We will say she lived.

  We will not say she is timeless. We will say she was in time, and she used it well.

  And when we leave this room, and the ordinary rush of days begins again, we might catch ourselves reaching for a phone to call her, or turning to ask her opinion on a sentence, a book, a life. In that moment, we will feel the sharp edge of her absence.

  Do not blunt that edge. That sharpness is the proof of what we had. That is the only monument she asked for. Not a memory that preserves her, but a truth that acknowledges her.

  She is gone. We are here. And for the moment, in this precarious, unrefuted time, that has to be enough.

  Thank you.
