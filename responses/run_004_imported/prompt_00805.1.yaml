answer: |-
  This is a sophisticated problem that strikes at the heart of scientific realism. You are correct: the Miller–Tichý theorem is a devastating blow to Popper's *formal* account of verisimilitude, and while subsequent attempts (Niiniluoto, Oddie, etc.) have rescued the *intuition*, they have not provided a universally agreed-upon logical calculus for it.

  For a science writer, this creates a tension between **philosophical precision** (acknowledging that we cannot rigorously prove Theory B is "truer" than Theory A) and **narrative clarity** (conveying that Theory B is objectively *better* in ways that matter).

  Here are the most important implications for your writing, along with strategies to responsibly describe theory change without falling into philosophical traps.

  ### 1. Shift from "Truth" to "Domain and Precision"
  The Miller–Tichý result relies on treating theories as sets of logical propositions that are either true or false. In practice, scientific theories are better understood as **models with domains of applicability**.

  *   **The Implication:** When you say Newton is "false," it implies uselessness. But Newtonian mechanics is strictly false only in a universal sense; within its domain (low velocity, macroscopic scale), it is empirically adequate.
  *   **The Strategy:** Instead of saying "Einstein proved Newton wrong," describe it as **expansion of scope** or **increase in resolution**.
      *   *Avoid:* "Relativity is truer than Newton."
      *   *Prefer:* "Relativity extends the predictive power of mechanics into regimes where Newton's equations break down," or "Relativity provides a higher-precision map of gravity."
      *   *Why:* This sidesteps the binary truth-value problem. It acknowledges that Newton isn't "false" in the sense of being garbage; it is a **limiting case** of a more comprehensive theory.

  ### 2. Treat "Closer to the Truth" as a Regulative Ideal, Not a Proven State
  Immanuel Kant described a "regulative ideal" as a goal that guides inquiry even if it can never be fully reached or verified. For scientists, "the truth" functions this way. They act *as if* there is a mind-independent reality they are approximating, even if they cannot logically prove their approximation is improving in a verisimilitude sense.

  *   **The Implication:** You can use "closer to the truth" language, but you must frame it as the *motivation* of science, not its *guaranteed output*.
  *   **The Strategy:** Attribute the claim to the scientific process rather than asserting it as a metaphysical fact.
      *   *Avoid:* "This theory brings us closer to the truth." (Asserts a metaphysical ranking you cannot justify).
      *   *Prefer:* "Scientists regard this theory as a deeper approximation of reality," or "This framework allows us to model the universe with fewer anomalies."
      *   *Why:* This respects the Miller–Tichý constraint (we can't prove the ranking) while accurately reporting the scientific consensus (they believe the ranking exists).

  ### 3. Emphasize "Empirical Adequacy" Over "Ontological Truth"
  Bas van Fraassen's concept of **empirical adequacy** is a useful tool here. A theory is empirically adequate if it "saves the phenomena"—i.e., its predictions match observations. Whether the theory's unobservable entities (quarks, curved spacetime) *actually exist* is a separate ontological question.

  *   **The Implication:** Progress is undeniable in terms of prediction and control, even if "truth-likeness" is philosophically contested.
  *   **The Strategy:** Focus on the **riskiness of predictions**. A theory that makes precise, novel predictions that survive testing is "better" than one that does not, regardless of its verisimilitude score.
      *   *Language:* Use terms like **robustness**, **predictive grip**, or **explanatory unification**.
      *   *Example:* "While we cannot know if quantum field theory is the final word on reality, its ability to predict the magnetic moment of the electron to ten decimal places suggests it captures something fundamental about the structure of nature."

  ### 4. Use the "Map vs. Territory" Analogy
  This is the most effective way to explain verisimilitude to a general audience without invoking logical content.

  *   **The Implication:** A map is never the territory. A map can be "false" (it simplifies, it projects) but still be "more accurate" than a previous map.
  *   **The Strategy:** Explicitly use this analogy to explain why a theory can be "false" (an idealization) yet "better."
      *   *Narrative:* "Think of Newtonian physics as a street map of a city, and General Relativity as a satellite image. The street map isn't 'useless'—it's perfectly fine for driving. But if you want to navigate GPS satellites, the street map fails. The satellite image isn't the territory itself, but it captures more of the terrain's curvature."
      *   *Why:* This validates the intuition of progress without committing to the claim that the new theory is "True" in an absolute sense.

  ### 5. Acknowledge the "Effective Theory" Framework
  Modern physics largely operates under the framework of **Effective Field Theories (EFT)**. This acknowledges that every theory is provisional and valid only up to a certain energy scale or precision.

  *   **The Implication:** This removes the stigma of "falsity." A theory isn't false; it's just low-energy.
  *   **The Strategy:** When discussing theory change, frame it as **zooming in**.
      *   *Phrasing:* "We have moved from a low-resolution understanding to a high-resolution one."
      *   *Why:* This aligns with how working scientists talk. It admits that future theories may supersede current ones (making current ones "false" in the long run) without denying the progress made.

  ### Summary: Can the Language Be Salvaged?
  **Yes, but it requires qualification.** You do not need to abandon "closer to the truth," because it captures a vital realist intuition that drives science (the "No Miracles Argument": if our theories weren't latching onto reality, their success would be a miracle). However, you should treat it as a **heuristic** rather than a **logical proof**.

  **Recommended Vocabulary Swap:**

  | Instead of... | Consider... | Why... |
  | :--- | :--- | :--- |
  | "This theory is true." | "This theory is empirically robust." | Avoids binary truth claims. |
  | "The old theory was false." | "The old theory was incomplete / an approximation." | Acknowledges limiting cases. |
  | "We are closer to the truth." | "We have a more comprehensive model." | Focuses on scope rather than metaphysics. |
  | "This proves reality is X." | "This suggests reality behaves as if X." | Distinguishes ontology from phenomena. |
  | "Superseded." | "Subsumed." | Implies the old theory is contained within the new (as a limit). |

  ### The Responsible Stance
  For your readers, the most honest position is **Critical Realism**. You can write that science appears to converge on a more accurate description of the world, evidenced by increased technological control and predictive precision, while acknowledging that "truth" in science is always provisional.

  You might write:
  > *"Philosophers warn that we can never rigorously prove one theory is 'truer' than another, only that it survives stricter tests. Yet, when a new theory predicts phenomena the old one couldn't even see, it's hard to escape the feeling that we are tracing the contours of something real. We may not have the final truth, but the map is undeniably getting more detailed."*

  This honors the Miller–Tichý constraint without succumbing to relativism, preserving the narrative of progress that makes science compelling.
