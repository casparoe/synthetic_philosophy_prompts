prompt: |-
  My friend Mara's getting married next month and asked me to give the toast. She's the realest utilitarian I've ever known in person -- gives away something like 40% of her income, picked her career specifically to maximize what she can donate, and spent actual months agonizing over whether even having a wedding was defensible instead of eloping and sending the difference to the Against Malaria Foundation. (She and Dev capped the wedding at $2,000 and are donating the rest of what they'd budgeted.) Half the family thinks this is a bit much and is doing the polite eye-roll about it. She reads moral philosophy for fun and once sent me Susan Wolf's "Moral Saints" essay with the note "please dont let the toast make me sound like this." So I can't just praise her selflessness the normal way, but I also can't pretend she's not exactly who she is. I write novels, not philosophy -- noticing that this is a hard needle to thread is about my limit, actually threading it is a different skill. Can you write me the toast?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a friend (Mara) marrying (Dev).
      *   **Key Character Trait:** Mara is a hardcore utilitarian (Effective Altruism adjacent). She donates ~40% of income, chose career for donation potential, agonized over the wedding's existence vs. donating the money.
      *   **Constraints:**
          *   Budget capped at $2,000; excess donated to Against Malaria Foundation (AMF).
          *   Family finds it "a bit much" (polite eye-rolls).
          *   Mara reads moral philosophy for fun.
          *   **Crucial Constraint:** She sent the speaker Susan Wolf's "Moral Saints" essay with the note "please dont let the toast make me sound like this." (Wolf argues that moral saints are boring, lack personal interests, and are arguably not ideal humans to be around).
          *   **Speaker's Skill:** Novelist, not philosopher. Good at noticing tension, less good at resolving it philosophically.
      *   **Goal:** Acknowledge her values without making her sound like a boring "moral saint." Balance the seriousness of her convictions with the warmth and joy of a wedding.

  2.  **Deconstruct the "Moral Saints" Problem:**
      *   Susan Wolf's argument: A life devoted *only* to morality is one-dimensional and lacks the quirks, passions, and selfishness that make someone lovable.
      *   Mara's fear: Being portrayed as a self-sacrificing robot who loves humanity more than individuals.
      *   The Toast's Job: Show that her morality *comes from* love, not duty. Show that she is fun, flawed, and deeply human *despite* (or because of) her principles. Show that Dev fits into this framework not as a distraction from her mission, but as part of it.

  3.  **Determine the Tone:**
      *   Warm, witty, slightly self-deprecating (acknowledging the speaker's novelist perspective).
      *   Respectful of the philosophy but grounded in human connection.
      *   Avoid preachiness. Avoid making the guests feel guilty about the wine/cake.
      *   Celebrate the *relationship*, not just the ethics.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the elephant in the room. The budget, the philosophy, the Wolf essay. Establish the speaker's role (novelist vs. philosopher).
      *   **Addressing the "Sainthood":** Directly reference the Susan Wolf essay. Acknowledge Mara's worry. Reframe it. She's not a saint; she's just Mara.
      *   **The "Why":** Why does she do this? It's not cold calculation; it's intense care. Connect this to how she loves friends.
      *   **The Wedding/Ethics:** Address the $2,000 cap and the AMF donation. Make it a celebration of their shared values, not a lecture. Acknowledge the family's eye-rolls gently (with love).
      *   **Dev's Role:** This is crucial. Why Dev? If she's a utilitarian, why marry? Because Dev makes the moral life *better*. He's the "personal interest" Wolf says saints lack.
      *   **Closing:** A wish for the future. Not just "doing good," but "being happy." Raise a glass.

  5.  **Refining the Content (Iterative Process):**

      *   *Initial thought:* Maybe joke about calculating the cost of the champagne.
      *   *Correction:* No, that might make guests feel bad. Keep the focus on *their* choice, not the guests' consumption.
      *   *Initial thought:* Quote Peter Singer.
      *   *Correction:* Too academic. Quote Wolf, since Mara specifically mentioned her.
      *   *Key Insight:* Mara worries she's boring. The toast needs to highlight her *passion*. Passion isn't boring.
      *   *Novelist Angle:* Use the "storyteller" persona. "I write characters, I know what makes them real."
      *   *The "Eye-Roll":* Address the family gently. "Some of you think this is intense." Validate them, then pivot to respect.

  6.  **Drafting the Speech (Mental or Scratchpad):**
      *   Start with the Wolf essay. It's the hook.
      *   "Mara sent me this essay saying don't make me a saint."
      *   "But here's the thing about Mara."
      *   Talk about the wedding budget. It's not about hating fun, it's about loving *more* people.
      *   Talk about Dev. He's the exception to the rule. Or rather, the partner in the rule.
      *   End with a toast to utility *and* joy.

  7.  **Polishing the Voice:**
      *   Make it sound spoken, not written. Short sentences. Pauses.
      *   Ensure the humor lands. (e.g., the "cost per life saved" joke needs to be light).
      *   Check the emotional arc: Anxiety -> Understanding -> Celebration.

  8.  **Final Review against Constraints:**
      *   Did I mention the $2,000? Yes.
      *   Did I mention AMF? Yes.
      *   Did I address Susan Wolf? Yes.
      *   Is it too preachy? Need to ensure it emphasizes *love* over *math*.
      *   Is Dev included? Yes, essential for a wedding toast.

  9.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't accidentally validate the family's eye-roll too much. It needs to be "I know it seems intense, but here's the beauty." Also, ensure the novelist persona shines through—focus on narrative and character.*

  **(Self-Correction Note):** The prompt says "I write novels... actually threading it is a different skill." I should lean into that. The speaker should admit they are out of their depth philosophically but speak to the *humanity* of it.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is a toast drafted for you. It leans into your strength as a novelist—focusing on character and motivation—while directly addressing Mara's specific philosophical constraints.

  ***

  **The Toast**

  Hi everyone. For those who don't know me, I'm [Your Name]. I write novels. Which means my entire job is making up people and pretending their choices make sense. So, when Mara asked me to give this toast, I was honored. And then I was terrified.

  Because Mara didn't just ask me to give a toast. She sent me homework.

  About a week after she proposed the idea, I got an email from her with a PDF attachment. It was Susan Wolf's essay *Moral Saints*. For the non-philosophers in the room, Wolf argues that if you actually try to be as morally good as possible, you become a boring, one-dimensional person who lacks the quirks and passions that make you human.

  Mara's note said, and I quote: *"Please dont let the toast make me sound like this."*

  So, I have a challenge. I need to talk about Mara's values without making her sound like a saint. And as a novelist, I actually think I can do that. Because when I look at Mara, I don't see a saint. Saints are distant. Saints are cold. Saints do things because they *have* to.

  Mara does things because she *cares* too much to look away.

  There is a difference. A saint denies themselves. Mara just prioritizes differently. Yes, she agonized over whether this wedding was defensible. Yes, she and Dev capped the budget at two thousand dollars. And yes, the rest of what they budgeted is going to the Against Malaria Foundation.

  I know some of you—the polite eye-roll section in the back, I see you—think this is a bit much. I get it. It's intense. But here is the novelist's observation: The best characters aren't the ones who follow the rules, and they aren't the ones who break them. They're the ones who live by a code that is entirely their own.

  Mara's code isn't about math. It's about love. It's about looking at a world that is often broken and saying, "I have resources, and I can fix a piece of that." That isn't cold calculation. That is a very hot, very human form of hope.

  But, Mara was worried that this makes her unlovable. That if she loves "humanity" too much, she won't have enough love left for specific humans.

  And that is where Dev comes in.

  If Mara were a true utilitarian robot, she wouldn't be here. She would have eloped at the courthouse and donated the wedding fund yesterday. But she didn't. Because she realized that a life without celebration, without community, without the specific, irrational joy of standing in front of your friends and declaring your love for one person... that life isn't actually maximizing utility. Because *joy* is utility. *Connection* is utility.

  Dev, you are the exception that proves the rule. You are the evidence that Mara doesn't have to choose between doing good and being happy. You make the moral life sustainable. You make sure that after she saves the world, there's someone there to make her dinner and tell her a stupid joke.

  Mara, you asked me not to make you sound like a Moral Saint. So I won't. Saints are perfect, and you aren't. You're stubborn, you're intense, and you worry too much. But you are also fiercely, undeniably alive. You love deeply. You think hard. And you have found a partner who doesn't just tolerate that fire, but brings his own.

  So, if everyone could raise a glass.

  To Mara and Dev. May your lives be long, may your impact be great, and may you always remember that the most defensible thing you can do is make each other happy.

  To the happy couple.
