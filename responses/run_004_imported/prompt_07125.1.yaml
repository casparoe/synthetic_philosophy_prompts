      *   *Critique:* Did I engage enough with the theory?
      *   *Fix:* In the analysis section, explicitly reference the tension between *outcome quality* (epistocracy) and *procedural fairness* (democracy). Mention that while the intent mirrors Mill's plural voting, the context (student fees) differs from national governance.
      *   *Critique:* Is the timeline realistic?
