answer: |-
  This is one of the most counter-intuitive concepts in statistics, so your confusion is completely normal. Your intuition ("more data is better") is logically sound in a vacuum, but it clashes with the specific mathematical machinery of the most common type of statistics (Frequentist).

  Here is the breakdown of why your data guy is right, why your intuition is tripping you up, and what the "other school" of statistics is.

  ### 1. Is the data guy right? (Yes, but with nuance)

  Your data guy is right: **If you are using standard p-values (Frequentist statistics), "peeking" and extending the test based on the results invalidates your p-value.**

  Here is the core conflict:
  *   **Your Intuition:** Statistics is about summarizing the data I *have*.
  *   **Frequentist Reality:** Statistics is about characterizing the process I *used to get the data*.

  A p-value does not tell you "The probability that this result is real." It tells you: "If there were actually no difference between the buttons, how likely would I be to see a result this extreme **given the specific experiment design I promised to follow?**"

  That bolded part is the killer. The math behind a p-value assumes a **fixed stopping rule**. It assumes you said, "I will collect 10,000 users, then I will look," and you stuck to it.

  If you say, "I will collect 10,000 users, but if it looks promising at 8,000 I'll stop, and if it looks boring I'll keep going to 12,000," you have changed the experiment. You have given yourself multiple "shots on goal" to find a significant result.

  **The Analogy: Rolling Dice**
  Imagine you want to prove a die is loaded to roll 6s.
  *   **Scenario A (Fixed):** You say, "I will roll the die 100 times." You get 30 sixes. The odds of this happening with a fair die are very low. Significant!
  *   **Scenario B (Peeking):** You say, "I will roll the die until I have 30% sixes." If you roll 100 times and only have 20% sixes, you keep rolling. Eventually, by random chance, you *will* hit a streak where you have 30% sixes. You stop and declare significance.

  In both scenarios, you end up with the exact same data: 100+ rolls, 30% sixes. The data is "honest." But in Scenario B, the result is meaningless because you rigged the stopping rule to guarantee a positive result eventually.

  By checking your A/B test at week 2, seeing $p=0.09$, and deciding to extend to week 3, you are effectively doing Scenario B. You are giving randomness a second chance to swing in your favor. If you do this enough, you will eventually find a "significant" result even if the buttons are identical. This inflates your **False Positive Rate (Type I Error)**.

  ### 2. Why does the timing/intent matter if the data is real?

  This is the hardest part to swallow. **Because the p-value calculates the probability of "what could have happened," not just "what did happen."**

  When you calculate a p-value, you are comparing your result against a theoretical distribution of all possible outcomes of that experiment.
  *   If the plan is "Stop at N=10,000," the universe of possible outcomes is limited to results from exactly 10,000 users.
  *   If the plan is "Stop whenever $p < 0.05$," the universe of possible outcomes includes paths where you stopped at 5,000, 6,000, 7,000... all the way to infinity.

  By peeking and extending, you silently expand the universe of "possible outcomes" that the math has to account for. Since you don't adjust the math to account for that expansion, the p-value becomes artificially small. It claims the result is rare (1 in 20 chance), but because you peeked, it's actually much more common (maybe 1 in 5 chance).

  **Your Roommate is Right**
  This is exactly what contributed to the "Replication Crisis" in psychology. Researchers would run a study, check the data, see $p=0.08$, think "darn, just need a few more subjects," collect 5 more, check again, and stop when it hit $p=0.049$. They published the result as "significant," but because they peeked, the actual probability of it being a fluke was way higher than 5%. When other labs tried to replicate it with a fixed sample size, the effect vanished.

  ### 3. The "Other School" (Bayesian Statistics)

  Your data guy was hinting at **Bayesian Statistics**.

  **Does it solve the problem?**
  **Yes, mostly.** In Bayesian statistics, the "Stopping Rule Principle" generally holds. This means the evidence provided by the data depends only on the data you observed, not on your intentions for when to stop collecting it.

  **Why?**
  Frequentist stats ask: $P(\text{Data} | \text{Hypothesis})$ (Probability of seeing this data assuming the button makes no difference).
  Bayesian stats ask: $P(\text{Hypothesis} | \text{Data})$ (Probability the button is better, given the data we see).

  Because the Bayesian approach updates your *belief* based on the evidence at hand, it doesn't care about the "universe of possible outcomes" that didn't happen. It only cares about the likelihood of the data you actually have. Therefore, you *can* check the results every day and stop whenever you feel like it (e.g., "I'm 95% sure Button B is better"), and your math remains internally consistent.

  **Is it magic?**
  No. It relocates the burden.
  1.  **Priors:** You have to state your "prior belief" before you start (e.g., "I think there's a 50% chance the new button works"). If you pick a biased prior, you get a biased result.
  2.  **Decision Theory:** While the *math* holds up under optional stopping, the *business risk* doesn't disappear. If you stop too early because you got a lucky streak of conversions, you might still roll out a bad feature. Bayesian methods quantify this uncertainty better, but they don't eliminate the risk of noise.
  3.  **Complexity:** It is computationally heavier and harder to explain to stakeholders who just want to know "Is it significant?" (Though "There is an 85% probability this button increases revenue" is often more useful than "p=0.09".)

  ### Practical Advice for Your Startup

  You are in a startup, not a psychology lab. You need to move fast, but you also don't want to make decisions based on noise. Here is the pragmatic path forward:

  1.  **Don't just "extend" without adjustment.** If you want to stick with Frequentist (standard p-values), you cannot just add a week because $p=0.09$. You need to use **Sequential Testing** methods (like Group Sequential Design or Alpha Spending). These are mathematical adjustments that allow you to peek at the data periodically without breaking the error rates. Many modern A/B testing tools (Optimizely, VWO, etc.) have this built-in ("Stats Engine").
  2.  **Consider switching to Bayesian.** For a startup, Bayesian A/B testing is often superior. It allows you to ask "What is the probability B is better than A?" and lets you stop when that probability is high enough to justify the risk of rolling out. It handles the "peeking" issue naturally.
  3.  **The "Pre-Registration" Habit.** Even if you don't use complex math, get in the habit of writing down your plan *before* you start. "We will run this for 2 weeks or until 10k visitors." If you deviate, acknowledge that the p-value is now "exploratory" and not "confirmatory." It means you trust the result less.

  **Summary:**
  Your data guy is protecting you from fooling yourself. The data is real, but the *guarantee* that the result isn't a fluke is broken if you change the rules mid-game. Your roommate is right that this is a massive deal in science. And the Bayesian approach does fundamentally handle this better, which is why it's gaining huge traction in tech companies.
