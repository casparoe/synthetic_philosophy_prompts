  2.  **Deconstruct Question 1 & 2: The Frequentist Problem (p-values and Optional Stopping)**
      *   *Core Concept:* Frequentist statistics (p-values) rely on the *sampling distribution under the null hypothesis*. This distribution depends on the *experimental design*, specifically the stopping rule.
      *   *The Intuition Trap:* The user thinks data is static. "I have $N$ observations, here is the mean." But p-values aren't just about the observed data; they are about the probability of seeing data *this extreme or more* given a specific data collection process.
      *   *The "Peeking" Problem:* If you check every day and stop as soon as $p < 0.05$, you inflate the Type I error rate (false positives). It's like rolling dice until you get a double six. Eventually, you will get one, but it doesn't mean the dice are loaded.
      *   *Analogy:* Coin flip. If I say "I'll flip 100 times," getting 60 heads is one probability. If I say "I'll flip until I get 60% heads," getting 60 heads is guaranteed eventually, even with a fair coin. The *intent* changes the math.
      *   *Why it matters:* The p-value calculation assumes a fixed sample size. If you violate that assumption, the p-value is no longer valid (it's too small).
      *   *Psychology Context:* Confirm the roommate's point. "p-hacking" and "optional stopping" are major contributors to the replication crisis.

  3.  **Deconstruct Question 3: The Bayesian Alternative**
      *   *Core Concept:* Bayesian statistics updates beliefs based on evidence. It calculates $P(Hypothesis | Data)$, not $P(Data | Hypothesis)$.
      *   *Stopping Rule:* Bayesians generally adhere to the "Stopping Rule Principle." The evidence (Likelihood Ratio or Bayes Factor) depends only on the data observed, not on when you decided to stop collecting it.
      *   *Caveat:* It's not magic. You still need priors. If you keep sampling until the Bayes Factor hits a threshold, you *can* still bias results if your priors are weak or if you have a specific decision-theoretic loss function you're ignoring. However, strictly speaking, the *interpretation of the evidence* doesn't change based on the stopping rule in the same way p-values do.
      *   *Does it solve it?* It solves the *mathematical inconsistency* of optional stopping in inference. It doesn't solve the business problem of wasting resources or making bad decisions due to noise. But for the specific statistical question, yes, it handles optional stopping much more gracefully.

