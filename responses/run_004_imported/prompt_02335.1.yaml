  **Move 1 (Marcus): Score 1**
  Marcus is relying on a standard counterfactual theory of causation (à la David Lewis): if the text had been sent, Marcus would have passed; since it wasn't, he didn't. This is the intuitive bedrock of causation by omission. However, the move is philosophically naive because it doesn't yet address the "proliferation" problem (why Dana and not Owen?), leaving it vulnerable to Dana's immediate counter.

  **Move 2 (Dana): Score 1**
  Dana correctly identifies the strongest objection to omission causation: the problem of "too many causes." If absences count, then Owen's absence, the professor's absence, and the Queen of England's absence are all causally equivalent. This *reductio* is powerful. However, her claim that "nothing happened on her end" is metaphysically shaky; in most frameworks, the *state of affairs* (no text) is a fact that can enter causal relations, even if no positive event occurred.

  **Move 3 (Marcus): Score 1**
  Marcus upgrades his position by appealing to "default/deviant" models of causation (similar to Christopher Hitchcock's work). He argues that causal selection depends on norms and expectations, which filters out Owen and the Queen. This is a sophisticated and defensible metaphysical move. However, it remains vulnerable because it makes causation dependent on subjective or social facts rather than mind-independent physical relations, which leads directly to Dana's final critique.

  **Move 4 (Dana): Score 2**
  Dana lands the strongest philosophical blow by distinguishing *metaphysical causation* from *pragmatic explanation* or *moral responsibility*. She correctly notes that if Marcus's argument relies on "expectations" and "routines," he is likely describing why Dana is *blameworthy* or why she is the best *explanation*, not why she is the unique *cause*. In a metaphysics seminar, preserving the distinction between the fabric of reality and our normative judgments is the stricter and more precise move.

  **What They're Missing**
  Both are conflating **causal structure** (the web of all counterfactual dependencies) with **causal selection** (picking one factor to cite as "the cause"). Marcus is arguing for selection (why we *blame* Dana), while Dana is arguing for structure (what *physically* determined the outcome). Additionally, they are ignoring the role of **excuses**: Dana's family emergency might negate her *responsibility* without negating her *causal role*, a distinction that would dissolve much of their conflict.
