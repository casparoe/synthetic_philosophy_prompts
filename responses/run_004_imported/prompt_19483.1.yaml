answer: |-
  **MEMORANDUM**

  **TO:** University Honor Council
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Turnitin Similarity Thresholds and Referral Protocols

  ### I. Purpose and Context

  As we prepare to vote on the revision of our academic misconduct referral policy, I am writing to recommend a specific replacement for our current "hard cutoff" model. 

  I acknowledge the irony of my position: as a philosophy doctoral candidate specializing in *vagueness* and the Sorites paradox, I am professionally predisposed to skepticism regarding sharp boundaries applied to continuous phenomena. However, my recommendation is not based solely on theoretical coherence, but on the practical failures the current policy presents. The current 25% hard cutoff creates a "cliff effect" where a 24% match and a 26% match are treated as categorically different offenses, despite there being no moral or evidentiary difference between them. Furthermore, because Turnitin counts bibliographies and block quotes by default, the metric often measures citation density rather than plagiarism.

  ### II. Recommendation

  I move that the Council **replace the current automatic referral policy** with a **Presumptive Review Protocol**. 

  Specifically, I propose we adopt the following policy language for the Student Handbook:

  > **Revised Policy Section X.X:**
  > 1. **Technical Configuration:** All Turnitin assignments must be configured to exclude bibliographic materials and quoted text from the similarity index calculation.
  > 2. **Mandatory Review Threshold:** A similarity index of 20% or higher triggers a *mandatory instructor review*, but does not trigger an automatic Honor Council referral.
  > 3. **Referral Criteria:** An instructor may refer a case to the Honor Council only if, upon review, the unattributed verbatim text exceeds 10% of the total assignment word count, OR if there is evidence of contract cheating/impersonation regardless of percentage.
  > 4. **Documentation:** Instructors must submit a brief statement of context with any referral arising from the 20–30% range, specifying why the similarity constitutes misconduct rather than poor citation practice.

  ### III. Rationale

  This proposal addresses the three primary failures of the current system:

  1.  **Technical Accuracy:** By mandating the exclusion of quotes and bibliographies, we ensure the percentage reflects *potential* misconduct, not formatting compliance.
  2.  **The Cliff Effect:** By changing the threshold from an *automatic penalty* to a *mandatory review*, we acknowledge that a number is a heuristic, not a verdict. This eliminates the injustice faced by students at 26% who are currently denied the chance to explain common knowledge or accidental omission.
  3.  **Resource Allocation:** It prevents the Honor Council from being clogged with clear false positives (e.g., a philosophy paper with heavy quoting that hits 28% but is perfectly cited), allowing us to focus on genuine cases of intent to deceive.

  ### IV. Engagement with the "Predictability and Bias" Objection

  I want to seriously engage with the strongest argument against my recommendation, which comes from the faction wishing to retain a numeric trigger for automatic referral. 

  **The Argument:** A hard numeric line, even if arbitrary, provides **procedural regularity**. It minimizes administrative burden on instructors and, crucially, it guards against favoritism. If we grant instructors discretion to decide whether a 26% match warrants a hearing, we risk a system where Student A (who is well-liked) gets a warning, while Student B (who is not) gets referred for the exact same offense. Predictability, even at the cost of some harshness, ensures equal treatment under the rules.

  **The Counter-Argument:** While I concede that discretion introduces the *risk* of bias, the current policy substitutes *bias* with *blindness*. A hard cutoff does not eliminate discretion; it merely shifts it upstream to the instructor's assignment design or downstream to the Council's dismissal rate. 

  More importantly, **predictability is not a virtue when the prediction is known to be false.** If we know the 25% line counts cited quotes as plagiarism, enforcing it "equally" is not justice; it is equally distributed error. 

  My proposal mitigates the bias risk not by removing discretion, but by **structuring** it. The requirement for a "statement of context" for referrals in the 20–30% buffer zone creates an audit trail. If an instructor is systematically referring students from a specific demographic for borderline cases while sparing others, that documentation allows the Council to identify the bias. A hard number hides bias behind a veil of objectivity; a documented review process exposes it. We should prefer a system that is transparently fallible over one that is opaquely rigid.

  ### V. Conclusion

  The goal of the Honor Council is not to process the highest volume of cases, but to adjudicate the most accurate ones. A policy that treats a bibliography as evidence of cheating undermines our legitimacy. 

  I urge the Council to vote **YES** on the adoption of the **Presumptive Review Protocol** as detailed above. This approach respects the instructor's role as the first evaluator of context, protects students from algorithmic false positives, and preserves the Council's time for cases involving actual academic dishonesty rather than formatting errors.

  **Action Item:** Vote to amend Policy Section X.X to reflect the Presumptive Review Protocol.
