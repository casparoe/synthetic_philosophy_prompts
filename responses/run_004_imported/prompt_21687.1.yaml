      *   **Critical Test:** Which, if either, survives the "deprivation objection" (death is bad because it deprives us of future goods)?
      *   **Format:** A reasoned verdict suitable for a dying man's mouth (i.e., persuasive, coherent, philosophically rigorous, not just a dry survey).

