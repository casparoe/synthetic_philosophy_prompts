answer: |-
  This is one of the most famous and bewildering passages in the history of probability and philosophy. You are not missing a mathematical step; you are encountering the moment where Peirce stops doing math and starts doing metaphysics.

  To answer your core question immediately: **No, this is not an early version of propensity theory.** In fact, it is the exact opposite. Propensity theory (later developed by Popper and others) tries to save probability for the single case by saying the *setup itself* has a physical disposition. Peirce explicitly rejects that in the first paragraph you quoted ("An individual inference must be either true or false... probability can have no meaning").

  Peirce is a hardline frequentist. He believes probability *only* exists in the long run. The puzzle he sets for himself is: **If probability only exists in the long run, and I am going to die (ending my run), how can my reasoning be rational?**

  Here is the breakdown of the moves he is making, why death breaks the math, and why he thinks "altruism" fixes it.

  ### 1. Why does death bring back the "same difficulty"?

  You understood the card example: Even if you only draw once, you pick the 25-red deck. Intuitively, that's rational.

  But Peirce is holding himself to a strict frequentist definition: **Probability = The limit of relative frequency as $n \to \infty$.**

  *   **The Problem:** If you are a single individual, your $n$ (number of risks/inferences) is capped by your lifespan. It is finite.
  *   **The Mathematical Consequence:** In a finite series, the Law of Large Numbers does not guarantee convergence. You could, by bad luck, draw the black card from the 25-red deck. In fact, in a short enough run, anything can happen.
  *   **The Philosophical Crisis:** If the "validity" of an inference depends on it working out in the long run, and *you* won't be around for the long run, then **logic has no validity for you.** Your reasoning is essentially groundless because the condition required to make it true (infinity) is impossible for you to satisfy.

  So, when he says death makes the mean result "uncertain," he means that for a finite individual, the "probability" is mathematically undefined. You are back to square one: How can it be rational to follow probability rules if the definition of probability requires a timeline you don't have?

  ### 2. How does the "Unlimited Community" fix the math?

  This is the leap that feels like hand-waving, but it's actually a **transcendental argument**. Peirce isn't trying to change the math of the cards; he is trying to change the definition of the **Self** that is doing the reasoning.

  His argument runs like this:
  1.  Logic/Reasoning is only valid if it leads to true beliefs in the long run.
  2.  The "long run" must be infinite for probability to be real.
  3.  No individual human life is infinite.
  4.  Therefore, no individual human can validate their own logic alone.
  5.  **However**, the *community of inquirers* can go on indefinitely (potentially forever).
  6.  Therefore, for logic to be valid at all, the "self" interested in the outcome must be the **Community**, not the **Individual**.

  When he says, *"Logic is rooted in the social principle,"* he means that rationality is not a solitary activity. If you reason only for your own benefit, you are being illogical, because your sample size is too small to support the frequency claims your logic relies on.

  To be "logical," you must identify your interests with the infinite community. If you care about the community's success as much as your own, then *your* effective $n$ becomes infinite. The "long run" is no longer *your* life; it is the life of science/humanity.

  ### 3. Is this ethical hand-waving or a real logical argument?

  It is a **philosophical argument**, not a mathematical proof. Whether it counts as "hand-waving" depends on whether you accept his Pragmatist premises.

  *   **The Charge of Hand-Waving:** From a strict analytic perspective, he is smuggling an "ought" (you ought to care about others) into an "is" (probability requires infinity). He is solving a mathematical limitation (finite $n$) with an ethical commandment (altruism).
  *   **The Defense:** Peirce would argue he isn't being "nice"; he is being rigorous. He is saying that **solipsism is irrational.** If you believe only *you* exist, or only *your* outcomes matter, you cannot consistently use probability theory, because the theory requires a horizon you don't possess. Therefore, consistency (logic) *forces* you to be altruistic.

  It's a stunning claim: **Selfishness is a mathematical error.** If you hoard your interests within your own skin, your reasoning methods are technically invalid because they can never be verified within your timeframe.

  ### 4. Why isn't this Propensity Theory?

  It is crucial to distinguish this from Propensity theory, because they solve the "single case" problem in opposite directions.

  *   **Propensity Theory (Popper, etc.):** Says the single case *does* have probability. The deck has a physical property (a propensity) of 25/26 to yield red. You don't need a long run; the probability is inherent in the specific setup *now*.
  *   **Peirce's Frequentism:** Says the single case *never* has probability. The single draw is just fate (true or false). The probability belongs to the *method* of drawing, not the specific card.

  Peirce doesn't try to find probability *in* the single case. He tries to expand the *agent* so that the single case becomes part of a valid long run.

  *   **Propensity:** "This specific deck has a magic weight toward red."
  *   **Peirce:** "This specific deck has no probability. But if you care about all future deck-drawers forever, your choice is part of a sequence that does have a probability."

  ### Summary of the "Move"

  Peirce is cornered by his own definition.
  1.  **Strict Frequentism:** Probability needs infinity.
  2.  **Human Reality:** Humans are finite.
  3.  **Conflict:** Humans cannot use probability rationally.
  4.  **Resolution:** Humans must stop thinking of themselves as finite individuals. They must adopt the "infinite community" as their self.

  He isn't tacking on a nice sentiment. He is arguing that **immortality (via the community) is a prerequisite for rationality.**

  It is a wild, metaphysical jump, but it is consistent within his system. He is essentially saying: *"If you want to use math to guide your life, you have to care about the future of the universe more than your own heartbeat. Otherwise, the math doesn't apply to you."*

  It's less of a solution to a poker problem and more of a demand that logic requires a kind of secular salvation.
