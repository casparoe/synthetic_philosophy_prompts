      *   *Round 2 (Misapplication/Dog vs. Tiger):* Engineer wins on *intuition*, Philosopher wins on *error*. (Overlook: The Disjunction Problem).
      *   *Round 3 (Circularity/Misrepresentation):* Philosopher wins decisively. This is the main selling point of teleosemantics. (Overlook: Swampman).
