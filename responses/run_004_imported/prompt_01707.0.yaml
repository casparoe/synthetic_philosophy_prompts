  1.  **Analyze the Request:**
      *   **Context:** The user is a novelist researching mental representation. They had a debate with two friends (a philosophy grad student and an engineer).
      *   **Topic:** Teleosemantics (evolutionary function as the basis of mental content) vs. Causal/Current Interaction views (content determined by present causal links or conscious intention).
      *   **The Conflict:**
          *   *Philosopher:* Content is fixed by evolutionary history (teleofunction). This solves naturalization and explains misrepresentation.
          *   *Engineer:* Content should match current causal interaction/conscious intent. Teleosemantics makes content "hostage to history" and ignores present reality.
      *   **Task:** Adjudicate the exchange point-by-point, determining who has the stronger position at each turn and identifying what each side overlooks.

  2.  **Deconstruct the Arguments:**

      *   **Philosopher's Core Claim:** Teleosemantics (Millikan, Papineau, etc.). Mental states have content because they were selected for a specific function. A frog's fly-detector fires at BBs, but represents *flies* because that's what it evolved to catch.
      *   **Engineer's Core Claim:** Causal/Informational Semantics (Fodor, Dretske to an extent, or just common sense). Content is determined by what causes the state *now* or what the system is currently tracking. If I think "dog" while looking at a dog, it's about a dog, even if my brain evolved for something else.
      *   **The Crux:** The "Disjunction Problem" (Fodor). How to distinguish "represents X" from "represents X or Y" when the mechanism fires for both. Teleosemantics says "X (the historical target)." Causal theories struggle with error.

  3.  **Step-by-Step Adjudication Plan:**

      *   **Turn 1: Philosopher's Opening (Evolutionary Function).**
          *   *Strength:* Solves the naturalization problem. Explains normativity (right/wrong function).
          *   *Weakness:* Ignores learning/plasticity. Seems counterintuitive for complex human thought.
          *   *Verdict:* Philosopher wins on *theoretical rigor* regarding naturalization, but Engineer wins on *phenomenological plausibility*.

      *   **Turn 2: Engineer's Objection (Misapplication/Present Reality).**
          *   *Strength:* Highlights the "Swampman" or "Novel Object" problem. What about things that didn't exist in the EEA (Environment of Evolutionary Adaptedness)? Guns, cars, dogs (domesticated later?).
          *   *Weakness:* Struggles to explain *false belief* without circularity. If content is just "what caused it," then a hallucination of a tiger is about "hallucination-causer," not a tiger. Error becomes impossible.
          *   *Verdict:* Engineer wins on *intuition*, Philosopher wins on *explaining error*.

      *   **Turn 3: Philosopher's Reply (Misrepresentation & Circularity).**
          *   *Strength:* This is the strongest point for teleosemantics. It explains how you can be *wrong*. If content is causal, you're never wrong about what caused the state.
          *   *Weakness:* "Swampman" objection. If a duplicate appeared by chance without history, does it have thoughts? Teleosemantics says no.
          *   *Verdict:* Philosopher has the stronger *logical* argument here regarding the definition of representation.

      *   **Turn 4: Engineer's Pushback (Radical Divorce/Empty Meaning).**
          *   *Strength:* Highlights the "Alienation" problem. If my thoughts aren't *mine* (determined by ancestors), agency is undermined. Also, learning changes content.
          *   *Weakness:* Doesn't offer a viable naturalistic alternative that handles error.
          *   *Verdict:* Engineer identifies a genuine cost of the theory, but doesn't defeat the theory.

  4.  **Synthesizing the Adjudication (Drafting the Content):**

