answer: |-
  The silence on the bridge of the *Axiom* was heavier than the gravity plating.

  Elias stared at the left seat. It was empty. The harness hung loose, swaying gently in the residual vibration of the jump. Mara was gone. The surge from the Port Drive had vaporized the cockpit section instantly. There was no body to recover, no final words to record. Just a scorch mark on the bulkhead and a blinking red light on the console.

  He was alive. The *Axiom* had made the jump. The colony seeds in the hold were safe. By every metric of the mission, it was a success.

  Except for the prompt on his screen.

  **SYSTEM ALERT: SYMMETRY PROTOCOL PENDING.**
  **STATUS: UNBALANCED.**
  **ACTION REQUIRED: VENT STARBOARD RESERVES.**

  Elias rubbed his face. His hands were shaking. He knew what the prompt meant. Before they launched, before they knew which drive would destabilize, they had written the protocol together.

  The physics of the jump were volatile. One drive always failed. It was a fifty-fifty split. If the Port failed, Mara died. If the Starboard failed, Elias died. The survivor would be left with a ship full of momentum and unstable energy. To stabilize the ship and secure the seeds, the survivor had to vent their remaining fuel reserves.

  Venting meant they would arrive with zero slack. No margin for error. No secondary burns. They would drift into the target system on fumes, taking decades longer to establish orbit, risking the viability of the seeds. It was a massive cost.

  If they didn't vent, the ship would hold. They would arrive with full tanks. The colony would thrive immediately.

  "Computer," Elias said. His voice sounded thin in the dead air. "If I cancel the vent, what happens?"

  "Ship integrity remains at ninety-eight percent," the AI replied. "Seed viability increases by forty percent. Port Drive status is irrelevant."

  "And if I vent?"

  "Ship integrity drops to critical minimum. Arrival delayed by sixty years. Seed viability risk increases significantly."

  Elias looked at the empty seat. "Mara's dead. Venting the fuel won't bring her back. It won't fix the Port Drive. It does nothing."

  "Correct," the AI said. "The action yields no causal benefit to the current timeline state."

  Elias's finger hovered over the *CANCEL* key.

  It was so obvious. The deal was made for a world where Mara might need him to honor her sacrifice. But she didn't need anything anymore. She was gone. The only person who mattered now was the colony, and the colony needed that fuel. To burn it was to gamble with the future of the human race for the sake of a ghost.

  If he kept the fuel, he was a hero. He saved the seeds.
  If he burned it, he was a fool. He threw away their safety for a rule that no longer applied.

  He thought about the night before the launch. They had sat on the observation deck, watching the launchpad lights blur in the rain.

  "It's not about the outcome, Eli," Mara had said. She was tracing the rim of her coffee cup. "It's about the type of agents we are. The physics... it knows. The jump only works because we commit to the policy *before* we know who dies."

  "That's superstition," he had argued. "If you die, I'm helping no one by crippling the ship."

  "If you only help me when it benefits *you*," she said, looking up, "then I can't trust you to help me when it doesn't. And if I can't trust you... then I don't engage the drive."

  She had paused, letting the logic settle.

  "If I don't engage the drive, we both stay in the system. We both die eventually. The only reason I'm sitting in that chair right now, the only reason you're sitting in yours, is because I believed you would burn the fuel even if I wasn't there to see it."

  Elias looked at the blinking cursor.

  *The only reason you're sitting in yours.*

  His survival wasn't an accident. It was a output of a function. The function was: `If (Partner_Dies) Then (Vent_Fuel)`.

  If he changed the output now, he didn't change the past. He didn't bring Mara back. But he invalidated the logic that allowed him to exist in this moment. If he was the kind of person who canceled the vent, then he was the kind of person Mara *would not have trusted* to engage the drive.

  If she hadn't trusted him, she wouldn't have jumped.
  If she hadn't jumped, the Port Drive wouldn't have blown, because they wouldn't have left the dock.
  If they hadn't left the dock, they were still back on Earth, dying with the rest of the species.

  By keeping the fuel, he was proving that their survival was a mistake. A glitch. A paradox.
  By burning it, he was aligning his current self with the version of himself that made the jump possible.

  It didn't help Mara. It didn't help the seeds. It helped *the truth*.

  The pull was agonizing. Every instinct screamed at him to save the resources. It was irrational, in the immediate sense. It was self-sabotage. It was pain for pain's sake.

  But the silence from the left seat wasn't empty anymore. It was heavy with the weight of the choice she had already made. She had accepted death on the condition of his policy.

  Elias moved his hand. He didn't press *CANCEL*.

  He typed the command code for **FULL VENT**.

  "Confirming," the AI said. "Starboard reserves releasing. Trajectory adjusting. Arrival time recalculated."

  Through the viewports, a plume of crystalline gas erupted from the Starboard hull. The ship shuddered as the momentum bled away. The comfortable hum of the engines dropped to a low, strained whine. They were limping now. The journey would be hard. Many might not live to see the landing.

  Elias leaned back. The guilt of the waste washed over him, cold and sharp. He had thrown away the easy future.

  He looked at the empty harness. It stopped swaying.

  "I know," he whispered to the silence. "I'm still the one who made the deal."

  The ship drifted on, balanced again, carrying the weight of a promise that cost everything and bought nothing, except the right to say they had earned the jump.
