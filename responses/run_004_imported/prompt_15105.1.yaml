answer: |-
  It is a striking irony of intellectual history that George Berkeley, the Anglican bishop and idealist philosopher best known for the maxim *esse est percipi* ("to be is to be perceived"), should offer some of the most pragmatic insights into monetary theory. Yet, as you have discovered, his *The Querist* (1735–1737) is precisely the right lens through which to view a local currency project. Berkeley was writing to address the economic stagnation of Ireland, arguing that the lack of "specie" (gold and silver coin) was not the cause of poverty, but rather the lack of employment and industry.

  For a committee organizing a local scrip, Berkeley's queries provide both a robust defense against skeptics and a sobering checklist of potential pitfalls. Here is an analysis of the implications of his views for your project.

  ### 1. The Defense: What Backs the Scrip?

  The most common objection you face is that the scrip lacks "intrinsic value" because it is not backed by gold or the full faith and credit of the federal government. A Berkeleyan response fundamentally reframes the nature of backing.

  **Money as a Ticket, Not Wealth**
  Berkeley famously asks in *The Querist*: *"Whether money be not only useful while it circulates?"* and *"Whether the real wealth of a nation be not the industry of the people?"* To Berkeley, gold and silver are merely commodities. They become money only when they function as "tickets" or "counters" that denote a claim on the labor and goods of society.

  *   **The Argument for Skeptics:** You can tell your skeptics that the scrip is not meant to *be* wealth; it is meant to *measure* and *mobilize* wealth. The "backing" of the currency is not a vault of gold, but the unused capacity of the town. If there are carpenters with idle time, farmers with surplus produce, and shopkeepers with empty shelf space, that is the "wealth." The scrip is simply the ticket that allows neighbors to claim that wealth from one another.
  *   **The Implication:** If the town has industry (goods and services to offer), the scrip is solvent. If the town has no industry, gold would not save it either. As Berkeley writes, *"Whether a people can be called poor where there is no want of the necessaries of life?"* If your scrip facilitates the exchange of necessaries that already exist but are currently stuck due to a lack of national currency, it is performing the true function of money.

  **Velocity Over Quantity**
  Berkeley insists that the benefit of money lies in its circulation, not its accumulation. He queries, *"Whether the advantage of money be not in proportion to its circulation?"* National currency tends to leak out of local communities to pay for imports, taxes, and chain stores. Once it leaves town, its velocity relative to the local community drops to zero.

  *   **The Argument for Skeptics:** A local scrip is designed to have a higher velocity *within the specific community* than the dollar. Even if the total quantity of scrip is small, if it changes hands ten times within the town before returning to the issuer, it creates ten times the economic activity of a dollar that leaves the town after one transaction.
  *   **The Implication:** Your project is not trying to increase the *stock* of money, but the *flow* of industry. You are arguing for efficiency of exchange, not the creation of value ex nihilo.

  **The Bank of Credit**
  Berkeley advocated for the creation of a National Bank in Ireland that would issue paper credit not fully backed by specie, but rather by the "land and people" of the nation. He believed that waiting for gold to arrive before allowing trade to happen was like waiting for a ship to arrive before building a dock.

  *   **The Argument for Skeptics:** You can argue that waiting for federal dollars to circulate back into the town before allowing local trade to occur is an unnecessary constraint on local liberty. By issuing credit against future local production, you are following Berkeley's model of using credit to jump-start industry that is currently paralyzed by a shortage of liquidity.

  ### 2. The Caution: A Careful Berkeleyan's Worries

  While Berkeley is often cited by proponents of fiat currency and credit expansion, he was not a modern proponent of unlimited quantitative easing. He was a moralist and a pragmatist. A careful reading of *The Querist* reveals significant anxieties your committee should address to ensure the scheme's longevity and ethical standing.

  **The Anchor of Real Industry**
  Berkeley's support for paper credit was conditional. He believed credit must be tethered to *real* productive capacity. He warns against money that circulates without corresponding industry, which leads to inflation and bubbles.
  *   **The Worry:** Is your town's productive capacity sufficient to absorb the scrip? If you issue 10,000 units of scrip, but the local businesses can only provide 5,000 units worth of goods and services before running out of stock or labor, the scrip will depreciate in purchasing power.
  *   **Berkeleyan Advice:** Do not issue scrip based on demand alone; issue it based on the supply of local labor and goods. The "bank" should act as a ledger of real capacity, not a printing press for wishful thinking.

  **The Danger of Idleness and Luxury**
  Berkeley was deeply concerned with how money was *used*. He distinguished between money that stimulates "honest industry" and money that fuels "luxury" or "idleness." He feared that easy credit might allow people to consume imports or indulge in vice rather than work.
  *   **The Worry:** Does the scrip encourage neighbors to build things and provide services, or does it simply subsidize consumption? If the scrip is used merely to buy existing inventory without stimulating new local production, it fails Berkeley's test.
  *   **Berkeleyan Advice:** Structure the incentives of the scrip to reward production. Perhaps the system should prioritize credits for local manufacturing, repair, or agriculture over simple retail consumption. The goal is to employ idle hands, not just move existing goods.

  **Public Authority and Trust**
  Berkeley proposed a *National* Bank, grounded in public authority and land security. He was skeptical of private schemes that lacked accountability. He asks, *"Whether private credit be not precarious?"*
  *   **The Worry:** Your committee is a private or semi-private body. If the committee dissolves, or if trust in the committee erodes, the "tickets" become worthless paper. Berkeley understood that money is a social construct reliant on collective perception (*percipi*).
  *   **Berkeleyan Advice:** Ensure the governance of the scrip is transparent and representative. The "backing" is ultimately the trust of the community. If the community perceives the committee as opaque or the redemption process as shaky, the "perception" of value will vanish, and with it, the value itself.

  **The Redemption Question**
  While Berkeley argued against the necessity of gold backing, he did not argue against *redeemability*. He envisioned paper money that could eventually be exchanged for land or produce.
  *   **The Worry:** You mentioned the scrip is redeemable at participating businesses. But what happens if a business hoards the scrip and refuses to spend it? Or if the network of businesses shrinks?
  *   **Berkeleyan Advice:** Ensure there is a mechanism for the scrip to return to the issuer (demurrage or expiration dates are common in local currency designs to force circulation, aligning with Berkeley's view on velocity). Furthermore, the committee itself should stand ready to redeem the scrip in some tangible form (e.g., local tax credits, if legal, or a basket of essential commodities) to maintain the "ticket's" validity.

  ### Summary for the Committee

  In presenting your case, you can adopt Berkeley's Socratic style. When a skeptic asks, "What backs this money?" you might reply with a query of your own: *"What backed the money when the town was prosperous? Was it the gold, or was it the fact that the baker trusted the carpenter would fix his roof?"*

  Berkeley teaches that money is a social technology, a "counter" for trust and industry. Your scrip is an attempt to repair a broken circuit of trust. However, his warnings remind you that a ticket to a theater is useless if the theater burns down. You must ensure the "theater"—the local productive capacity—is sound, that the tickets do not outnumber the seats, and that the management of the theater remains trustworthy in the eyes of the public.

  If you can demonstrate that the scrip is strictly tied to the mobilization of idle local industry, and not merely an expansion of credit for consumption, you are building a system that Berkeley would likely recognize not as a utopian fantasy, but as a practical application of the true nature of wealth.
