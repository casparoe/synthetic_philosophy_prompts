answer: |-
  **Setting:** *A quiet pavilion in the capital of Zhao, circa 300 BCE. Autumn leaves drift onto a low table where tea has been poured but remains untouched. Two men sit opposite one another.*

  **Characters:**
  *   **Master Ming (The Logician):** A disciple of the School of Names, steeped in the dialectics of Gongsun Long.
  *   **Master Li (The Confucian):** A scholar of the Rectification of Names (*Zhengming*), influenced by the teachings of Xunzi.

  ***

  **Master Ming:** You have read the text, Master Li. You know the thesis. "A white horse is not a horse." (*Bai ma fei ma*.) I see the tension in your brow. Do you find the reasoning flawed, or merely the conclusion distasteful?

  **Master Li:** I find the reasoning to be a sharp knife that cuts the hand of the one who wields it. You argue with precision, Master Ming, but you sever the tendon that connects the name to the world. If I say, "I need a horse to pull this carriage," and you bring me a white horse, have you not satisfied my request? If the white horse is not a horse, then you have brought me nothing I asked for. Yet, the carriage moves.

  **Master Ming:** The carriage moves, yes. But let us examine the *request*. If a man seeks a "horse," a yellow horse or a black horse will suffice. If a man seeks a "white horse," a yellow or black horse will not suffice. If the white horse *were* the horse, then the seeking of a horse and the seeking of a white horse would be identical. But the object that satisfies the first request does not satisfy the second. Therefore, the "white horse" and the "horse" are not the same.

  **Master Li:** You conflate "is not the same as" with "is not a member of." This is the trick of the syllogism. When I say, "A white horse is a horse," I do not mean the concept 'White Horse' is identical to the concept 'Horse' in every respect. I mean that the entity designated by 'White Horse' falls within the extension of 'Horse.' You are exploiting the ambiguity of the word *fei* (is not). You prove that 'White Horse' is not *identical* to 'Horse,' which no one denies, and then you pretend you have proved that a white horse is not *a* horse.

  **Master Ming:** You speak of extension and membership as if these are settled matters. But we must look to the names themselves. "Horse" is that by which we name the shape (*xing*). "White" is that by which we name the color (*se*). That which names the color is not that which names the shape. Therefore, naming a white horse is not naming a horse. If you combine the name for color with the name for shape, you have created a new designation. To say this new designation is simply "horse" is to lose the distinction of color. If you do not distinguish the color, how can you fulfill the specific request?

  **Master Li:** We distinguish the color by saying "white horse." We do not deny the shape is that of a horse. Consider the practical consequence, Master Ming. In the markets, the toll gates, and the stables, white horses are taxed as horses. They are ridden as horses. In the sacrifices, if the ritual calls for a horse, a white horse is acceptable unless specified otherwise. If your thesis holds, then the toll collector who takes a coin for a white horse is committing fraud, for he is taxing a non-horse as a horse. Are you prepared to tell the Sage Kings that their administration was built on a logical error?

  **Master Ming:** The Sage Kings rectified names so that they accorded with reality (*shi*), not so that they accorded with lazy convention. Convention says the sun rises; reality shows the earth turns. That the toll collector takes a coin does not prove the ontology of the animal. Consider the stone. In my discourse on the Hard and White, I showed that "hard" and "white" are separate qualities. You see a hard white stone, but your eye sees only the white, and your hand feels only the hard. They do not reside in the same faculty. Similarly, "whiteness" and "horseness" are distinct determinations. When you ask for the compound, you ask for a specific intersection. To claim the intersection *is* the whole set is to confuse the specific with the general.

  **Master Li:** But names are not merely intersections of abstract qualities! Names are tools for governance. As Lord Xun has taught, the Kings established names to clarify social distinctions, to mark the noble from the base, and to ensure that instructions are clear. If I tell my servant, "Harness the horse," and he stands in the stable paralyzed because he cannot decide if the white one counts, the name has failed its function. You treat names as if they are independent entities floating above the world, waiting to be analyzed. I tell you, names are bridges between men. If your logic burns the bridge, the logic is useless, no matter how elegant the fire.

  **Master Ming:** You reduce truth to utility. Just because a lie is useful does not make it true. If we allow names to be loose because it is convenient, we invite the chaos you claim to fear. If "white horse" can be "horse" without qualification, then eventually "horse" can be "ox." If the distinction between the compound name and the simple name is collapsed, then all distinctions collapse. I am preserving the integrity of the distinction! By saying "White Horse is not Horse," I force the mind to acknowledge that the specific is not the general. I am protecting the precision of language from the erosion of habit.

  **Master Li:** You protect the precision of the *term*, but you lose the reality of the *thing*. There is a living animal standing in the field. It neighs, it eats grass, it has hooves. Your analysis dissects the animal into "shape" and "color" and declares that because the concepts are distinct, the animal cannot be subsumed under the general kind. This is to let the name master the reality, rather than the reality guide the name. You say you are rectifying names, but you are actually confusing them. You create a distinction where nature has created a unity.

  **Master Ming:** Nature creates unities? Or does the mind create unities to cope with the myriad things? When you point to the animal, you see a unity. But when you speak, you must use distinct terms. If the name "Horse" encompasses white, yellow, and black, then "Horse" is an abstraction. The white horse is concrete. The concrete is not the abstract. Therefore, the white horse is not the horse. I am not denying the animal exists. I am denying that the name for the concrete particular is interchangeable with the name for the abstract universal.

  **Master Li:** And there, I believe, we have reached the root. You speak of abstract universals and concrete particulars. I speak of communities and rituals. You believe the purpose of naming is to map the logical structure of reality with perfect fidelity. I believe the purpose of naming is to facilitate human action and social order.

  **Master Ming:** If the map is wrong, the traveler is lost.

  **Master Li:** If the map is too detailed, the traveler never begins the journey. You insist that because the request for a white horse is different from the request for a horse, the object must be different. I insist that the object is the same, but the *intent* of the namer differs. You locate the difference in the thing; I locate it in the usage.

  **Master Ming:** Then we disagree on what the name attaches to. I say it attaches to the distinct determination of reality—color plus shape. You say it attaches to the conventional category agreed upon by society.

  **Master Li:** Precisely. And if I may press further: I suspect our disagreement is not truly about logic, nor even about the ontology of the horse. It is about the teleology of language. For you, language is a mirror of metaphysical distinctions. For me, language is a tool for ethical harmonization. If your thesis "White Horse is Not Horse" leads to a world where we cannot communicate simple instructions without a treatise on semantics, then for my tradition, it is false. Not logically false, perhaps, but *humanly* false.

  **Master Ming:** And for my tradition, if your thesis "White Horse is Horse" leads to a world where we cannot distinguish between the specific and the general, where the unique qualities of the white horse are swallowed by the generic "horse," then it is *intellectually* false. It blinds us to the distinctness of things.

  **Master Li:** So, we stand at a precipice. You look down and see the logical structure of the abyss; I look across and see the people who need to cross it.

  **Master Ming:** Then perhaps, Master Li, we should not try to push the other off. I will concede that for the toll gate and the carriage, your "is" suffices. It is the "is" of classification.

  **Master Li:** And I will concede, Master Ming, that for the philosopher and the dialectician, your "is not" has merit. It is the "is not" of identity. You have shown that 'White Horse' and 'Horse' are not synonymous terms. I will grant you that. But do not ask the world to stop turning just because your mirror shows a different angle.

  **Master Ming:** Agreed. The white horse remains white. The horse remains a horse. The dispute is only whether the name can hold both truths at once.

  **Master Li:** Then let us drink the tea before it grows cold. That, at least, is a cup, and I trust we can agree it is not "not a cup."

  **Master Ming:** *[Smiling faintly]* On that, I make no promises. But I will drink.
