          *   *Li:* Attack the copula "is" (fei). Distinguish "is not identical to" vs. "is not a member of." This is the crux of the equivocation charge.
          *   *Ming:* Defend the strictness of *ming*. If names are mixed, reality is confused. If White Horse = Horse, then Yellow Horse = White Horse (transitivity issue?). *Self-Correction:* Keep it closer to the text. Focus on the extension/intension distinction implicitly.

