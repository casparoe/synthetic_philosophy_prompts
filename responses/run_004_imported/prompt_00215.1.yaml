answer: |-
  This is an excellent question that cuts to the heart of contemporary debates in consequentialist theory, particularly within the Effective Altruism and Longtermism communities where Greaves' work is foundational. You have correctly identified the surface-level worry, but the distinction between **simple** and **complex** cluelessness is indeed where the philosophical heavy lifting happens.

  To understand why Greaves (and Lenman before her) treats these differently, we need to look at the formal requirements of Expected Utility Theory (EUT) and where the epistemic breakdown occurs in each case.

  Here is a granular walkthrough of the intuition, the symmetry problem, and the Knightian distinction.

  ---

  ### 1. Simple vs. Complex Cluelessness: The State Space Problem

  The core difference lies not in *how much* we know, but in **whether we can define the sample space of possibilities.**

  #### Simple Cluelessness
  In cases of simple cluelessness, you know *what kinds* of outcomes are possible, and you can partition the state space, but you lack precise knowledge of which state will obtain.
  *   **The Structure:** You have a set of mutually exclusive and exhaustive states of the world $\{S_1, S_2, ... S_n\}$.
  *   **The Epistemic State:** You can assign subjective probabilities (credences) to these states, even if those credences are vague or based on limited evidence.
  *   **Example:** You are deciding whether to fund a bednet distribution program. You know the possible outcomes: nets are used, nets are misused, nets save lives, nets fail. You don't know exactly *which* specific children will be saved or if one saved child will become a dictator.
  *   **Greaves' Take:** This is just **risk** (in the broad Bayesian sense). A Bayesian consequentialist can handle this. You assign a probability distribution over the known types of outcomes and calculate EV. The uncertainty is "within the model."

  #### Complex Cluelessness
  In cases of complex cluelessness, you do not know how to partition the state space. You suffer from **unawareness**.
  *   **The Structure:** You cannot define $\{S_1, S_2, ... S_n\}$ because you don't know what variables are morally or causally relevant.
  *   **The Epistemic State:** You cannot assign a justified probability distribution because any partition you choose is arbitrary.
  *   **Example:** You are deciding whether to advocate for a radical shift in geopolitical norms (e.g., preemptive nuclear disarmament). The causal chains involve complex adaptive systems (international relations, economics, technological development). You don't just not know the outcome; you don't know *what categories of outcomes* to look for. There may be "unknown unknowns"—consequences you literally cannot conceive of given your current conceptual framework.
  *   **Greaves' Take:** This undermines the **Principle of Maximization**. If you cannot define the states, you cannot sum $P(S) \times V(S)$. The expected value is not just unknown; it is **undefined**.

  ---

  ### 2. The Symmetry Argument: Why Unknowns Don't "Cancel Out"

  Your intuition is the standard defense against cluelessness: *"If I can't predict the long-term effects of Action A, and I can't predict the long-term effects of Action B, surely the unknown long-term effects are symmetric. Therefore, $EV(Unknown_A) \approx EV(Unknown_B)$, and they cancel out, leaving me to compare the known short-term effects."*

  Greaves argues this works for **Simple** cluelessness but fails for **Complex** cluelessness. Here is why.

  #### In Simple Cluelessness (Symmetry Holds)
  To claim symmetry, you need to justify that the probability distribution over unknown long-term effects is identical for both options.
  *   **Justification:** In simple cases, we can often appeal to the **Principle of Indifference**. If I save Child A vs. Child B, I have no evidence that Child A's lineage is more likely to produce dictators than Child B's. The causal mechanisms (biology, sociology) are roughly the same.
  *   **Result:** The "noise" of the long-term future is stochastic and independent of the specific choice. Therefore, $E[Unknown_A] - E[Unknown_B] \approx 0$. We can ignore the long tail and focus on the near-term EV.

  #### In Complex Cluelessness (Symmetry Fails)
  In complex cases, the options themselves may trigger *different causal structures*.
  *   **The Problem of Partition Dependence:** In decision theory, if you partition the state space differently, you get different expected values (this is related to the Bertrand Paradox). In complex cluelessness, we don't have a "natural" partition.
  *   **Asymmetric Structural Risk:** Action A (e.g., geoengineering) might introduce a *new type* of risk (e.g., atmospheric chemistry collapse) that Action B (e.g., carbon tax) does not. Even if you are "clueless" about the probability of atmospheric collapse, you cannot assume the unknown effects of A are symmetric to the unknown effects of B, because A activates a *domain of consequences* that B does not.
  *   **Why they don't cancel:** To say they cancel, you must assume $P(\text{Bad Unknown} | A) = P(\text{Bad Unknown} | B)$. But in complex systems, interventions are not interchangeable. One intervention might push the system toward a chaotic regime; the other toward a stable one. Without knowing the system dynamics, you cannot justify the assumption that the unknowns are identically distributed.
  *   **Conclusion:** You cannot mathematically subtract the unknowns because you have no justification for treating them as equal variables.

  ---

  ### 3. Why This Undermines EV Comparison (Not Just "Harder")

  You asked why this makes EV comparison impossible rather than just difficult. This comes down to the difference between **epistemic imprecision** and **formal undefinedness**.

  *   **Garden-Variety Epistemic Uncertainty:** "I think the EV is \$1M, but it could be between \$500k and \$1.5M."
      *   *Decision Theory:* We can still maximize. We use imprecise probabilities or risk-weighted utility. We can still say Option A is better than Option B if the ranges don't overlap or if A dominates B.
  *   **Complex Cluelessness:** "I cannot define the units of value or the states of the world over which to integrate."
      *   *Decision Theory:* The integral $\int P(s)U(s)ds$ does not exist. It's not that the number is fuzzy; it's that the function is ill-formed.
      *   **Lenman's Point:** If the EV is undefined, consequentialism loses its action-guiding force. It cannot tell you what to do, not because the calculation is hard, but because the *terms of the calculation* are missing. This forces a retreat to secondary rules, virtues, or common sense morality (which Lenman prefers).
      *   **Greaves' Point:** She is more hopeful than Lenman. She suggests that perhaps we can bound the problem or find "robust" good that holds across many partitions. But she concedes that if complex cluelessness is pervasive, standard Bayesian maximization is unjustified.

  ---

  ### 4. Addressing the Classmate: Knightian Uncertainty vs. Unawareness

  Your classmate argues that this all collapses into **Knightian Uncertainty**. This is a common objection, but there is a formal distinction worth preserving.

  *   **Knightian Uncertainty (Standard Definition):** You know the state space $\{S_1, ... S_n\}$, but you do not know the objective probabilities $P(S)$. You might represent this with a set of priors rather than a single prior.
      *   *Example:* An urn with red and black balls, but you don't know the ratio.
      *   *Response to Classmate:* Greaves' **Simple Cluelessness** maps well onto Knightian uncertainty. A sophisticated Bayesian can handle this using imprecise probabilities.

  *   **Complex Cluelessness (Unawareness):** You do not know the state space. You are unaware of some states $S_{unknown}$.
      *   *Example:* An urn where you don't know if there are only red/black balls, or if some balls are green, or if some balls explode when touched.
      *   *Why it's distinct:* Standard Knightian uncertainty assumes a known "possibility space." Complex cluelessness challenges the completeness of that space. In formal epistemology, **Unawareness** is distinct from **Uncertainty**.
      *   *The Collapse Argument:* Your classmate might argue, "Just assign a catch-all state $S_{other}$."
      *   *The Counter:* If you assign $S_{other}$, you must assign it a value $V(S_{other})$ and a probability $P(S_{other})$. In complex cluelessness, you have no basis for assigning a value to "consequences I cannot conceive." Is $V(S_{other})$ positive? Negative? Infinite? Without a conceptual hook, any assignment is purely arbitrary, returning us to the problem of undefined EV.

  ### Summary for Seminar Discussion

  If you want to press this in seminar, here is the distilled position:

  1.  **Simple Cluelessness** is uncertainty *within* a model. Symmetry arguments work here because we can justify that the "noise" of the future is independent of our specific choice (Principle of Indifference). EV remains defined.
  2.  **Complex Cluelessness** is uncertainty *about* the model (structural unawareness). Symmetry arguments fail because different actions may activate fundamentally different causal domains.
  3.  **The Threat:** It's not that the EV is hard to calculate; it's that the mathematical object (the expectation) is undefined due to the lack of a justified partition of the state space.
  4.  **Knightian Distinction:** While related, complex cluelessness invokes **unawareness** (unknown states), which is formally stronger than Knightian uncertainty (known states, unknown probabilities). Assigning a "catch-all" probability to the unknown does not solve the problem because we cannot assign a value to the unknowable.

  Greaves' ultimate goal is to see if consequentialism can survive complex cluelessness. Her tentative conclusion is that it survives *if* we can find actions that are **robustly good** (good across almost all plausible partitions of the state space). If we can't find those, Lenman is right: consequentialism falls silent.
