answer: |-
  You are not overcomplicating this. In fact, you have intuitively identified a distinction that philosophers have debated for centuries. Your friends are offering you **pragmatic advice** (maximize utility), but your discomfort stems from an **epistemic and ethical intuition** (beliefs should track truth, and integrity matters).

  To help you think this through properly, we can break your dilemma down into three specific philosophical concepts: the nature of reasons for belief, the ethics of self-deception, and the value of integrity.

  ### 1. Epistemic Reasons vs. Pragmatic Reasons

  You asked if there is a genuine difference between reasons to do with *him* and reasons to do with *what you stand to gain*. The answer is a definitive yes. In philosophy, these are known as **epistemic reasons** and **pragmatic reasons**.

  *   **Epistemic Reasons:** These are considerations that bear on the *truth* of a proposition. Evidence that your grandfather was kind, or that his controlling nature came from a place of protective love, would be epistemic reasons to respect him. They help your mind "track the world" as it actually is.
  *   **Pragmatic Reasons:** These are considerations that bear on the *benefits* of holding a belief. The value of the house is a pragmatic reason to *want* to believe he was respectable. It helps you "track your interests."

  **Why the distinction matters:**
  Beliefs have a specific job: to represent reality accurately. If you form beliefs based solely on payoffs, you break the mechanism you use to navigate the world. As you noted, if you convince yourself he was admirable solely for the money, your admiration is "tracking the payoff rather than tracking him."

  This is dangerous not because it's "immoral" in a religious sense, but because it disconnects you from reality. If you train yourself to ignore evidence (his difficult nature) in favor of incentives (the house), you weaken your ability to assess people and situations accurately in the future. You are essentially proposing to hack your own internal truth-tracking software.

  ### 2. Acting vs. Believing (The Ethics of Self-Deception)

  You asked whether it matters if you merely *act* the part versus actually *convincing yourself*. This touches on the concept of **integrity** and the nature of **belief**.

  **The Problem of "Deciding to Believe"**
  The philosopher Bernard Williams argued that you cannot simply decide to believe something at will. To believe that $P$ is true is to believe that you have sufficient evidence for $P$. If you know you are adopting the belief *only* for the money, you are aware that the evidence is insufficient. Therefore, you cannot genuinely hold the belief; you can only hold the *pretense* of the belief.

  **The Two Paths:**
  1.  **The Performance (Acting):** You tell warm stories you know are embellished.
      *   *Pros:* You keep your internal truth intact. You know who he was.
      *   *Cons:* Your grandmother asked for *genuine* respect. If she senses the performance, you lose the house. Furthermore, habitual dissembling can erode your sense of authenticity.
  2.  **The Self-Deception (Believing):** You actively try to rewrite your memory to feel the admiration.
      *   *Pros:* You might satisfy your grandmother's condition.
      *   *Cons:* This requires a fracture in your psyche. You must suppress your valid past experiences (that he was difficult) to accommodate a new narrative. This is a form of gaslighting yourself.

  **Does it matter?**
  Yes. If you merely act, you maintain your integrity but risk failing the contest. If you succeed in self-deception, you might win the contest, but you sacrifice a degree of self-knowledge. You become a person whose memories are for sale. The cost isn't just "lying"; it's the alteration of your own history to suit a financial incentive.

  ### 3. A Principled Way to Decide

  You asked for a principled way to work out which pull should govern your feelings. We can look at this through the lens of **Virtue Ethics**, specifically the virtue of **Integrity**.

  Integrity is often defined as "integration"—the state of being whole and undivided. A person of integrity aligns their actions, beliefs, and values.

  **The Test of Corruption**
  Ask yourself: *If I do this, does it make it easier to do it again?*
  If you successfully trade your honest assessment of a person for $500,000 (or whatever the house is worth), you establish a market rate for your own judgment. The next time a large sum of money is on the line, the barrier to compromising your perception of reality will be lower. The "principled" choice is usually the one that preserves your capacity for honest judgment in the future.

  **Reframing "Respect"**
  However, there may be a middle ground that doesn't require self-deception. You are assuming "respect" means "admiration of character." But respect can also mean **acknowledgment of complexity** or **honoring the survivor**.

  *   **Respect for the Struggle:** You can genuinely respect that your grandfather was a flawed human who struggled with his own demons, without admiring how he treated people.
  *   **Respect for your Grandmother:** You can frame your "respect" for him as an act of love for *her*. You might say (to yourself and her): "He was difficult, but I respect the life you built together, and I honor his memory because I honor you."

  This allows you to remain truthful (he was difficult) while still engaging in the contest (honoring his memory). It shifts the epistemic object from *his goodness* (which is false) to *your grandmother's grief and love* (which is true).

  ### Summary and Recommendation

  You are right to feel uneasy. Your friends are treating your mind as a tool to get a resource; you are treating your mind as a vessel for truth. Both have value, but trading the latter for the former is a transaction with long-term costs.

  **Here is a principled framework for your decision:**

  1.  **Do not attempt to force the belief.** Trying to convince yourself he was admirable when he wasn't is an act of self-betrayal. It corrupts your epistemic rationality.
  2.  **Distinguish Performance from Conviction.** You can choose to speak kindly of the dead without lying about your internal state. However, since your grandmother specified *genuine* respect, a pure performance may fail.
  3.  **Seek the Nuanced Truth.** Instead of fabricating admiration, try to find a *truthful* version of respect. Can you respect his role as a provider? Can you respect the complexity of his life? Can you respect him simply as your grandmother's beloved husband, deferring to her experience rather than your own?
  4.  **Evaluate the Price.** If the only way to win the house is to genuinely rewrite your history and convince yourself a difficult man was good, ask yourself if the house is worth the price of your own honesty. If you take the house, every time you walk through the door, it will stand as a monument to the fact that you sold your judgment.

  You are not overcomplicating it. You are recognizing that while the house is a finite resource, your relationship with the truth is the infrastructure upon which you build your entire life. Protecting that infrastructure is usually the wiser long-term investment.
