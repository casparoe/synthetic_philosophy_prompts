answer: |-
  This is one of the most famous debates in 20th-century jurisprudence, and you have done an excellent job summarizing the emotional core of it. It is incredibly intuitive to look at the horrors of the Nazi regime and conclude that "an unjust law is no law at all" (the Natural Law position) is the only morally defensible stance.

  However, your conclusion that Hart's positivism is essentially a sophisticated version of "I was just following orders," and that the legal profession sticks with it out of squeamishness, relies on a few common misunderstandings about what Hart actually argued in that specific case.

  Here is the breakdown of why Hart's position is not only still respected but is considered by many to be the *more* morally robust position in the long run, and why Natural Law remains a minority view in professional jurisprudence.

  ### 1. The Big Misconception: Hart Did Not Say "Let Her Go"
  The most critical correction to make is regarding Hart's proposed solution to the Grudge Informer case.

  You wrote that Hart's view implies the woman shouldn't be punished because she followed valid law. **This is incorrect.**

  Hart explicitly argued that the woman **should be punished.** However, he argued that the German court should be honest about *how* they punished her.
  *   **Fuller's Approach (Natural Law):** Pretend the Nazi statute was never valid law because it was immoral. Therefore, she broke the "real" law.
  *   **Hart's Approach (Positivism):** Admit the Nazi statute *was* valid law at the time. It was a wicked law, but it was law. Therefore, to punish her, the post-war German government must pass a **new, retroactive statute** specifically criminalizing her actions.

  Hart argued that it is better to sacrifice the principle of "no retroactive punishment" openly and honestly than to lie about the nature of the previous legal system. He believed that pretending the Nazi laws weren't laws created a dangerous fiction. If you say "that wasn't law," you blur the line between what is law and what is moral, which makes it harder to criticize bad laws in the future.

  Hart's famous quote on this is: *"We should not sharpen the dagger of morality with the whetstone of law."* He believed keeping law and morality distinct actually makes moral criticism of the law *sharper*. You can say, "This is the law, and it is too wicked to be obeyed," which is a clearer moral stance than saying, "This isn't law because it's wicked."

  ### 2. Why Positivism is Mainstream (It's Not Just Squeamishness)
  Legal Positivism dominates law schools not because professors are morally relativistic, but because it offers a more stable framework for a pluralistic society. Here are the three main arguments for Hart's side:

  **A. The Danger of Judicial Moralizing**
  If judges adopt Fuller's view (that unjust laws are void), who decides what is "unjust"?
  In 1949 Germany, judging Nazi laws as unjust seems easy to us now. But imagine a judge in 1850s America using Natural Law to declare slavery statutes "void" because they are unjust. While we would cheer that today, the same logic allows a judge in a different context to strike down labor laws, civil rights legislation, or tax codes because *they* feel those laws violate "natural justice."
  Positivism constrains judges. It says: "Your job is to apply the rules passed by the legislature. If the rules are immoral, your job is to point that out so the legislature changes them, not to pretend they don't exist."

  **B. Clarity and Predictability**
  Positivism provides a clear test for what counts as law (e.g., did it pass the legislature? was it signed by the executive?). Natural Law provides a murky test (e.g., is it consistent with higher moral principles?).
  For a legal system to function, citizens need to know what the rules are. If the validity of a law depends on a judge's moral assessment of its content, the law becomes unpredictable. Hart argued that confusing "what the law is" with "what the law ought to be" leads to intellectual confusion that ultimately helps tyrants.

  **C. The "Nuremberg" Counter-Argument**
  You mentioned that Nuremberg proved Fuller right. Actually, many legal scholars argue Nuremberg was a Positivist victory, not a Natural Law one.
  The Nuremberg Trials did not simply say "Natural Law says genocide is wrong." They relied on the **London Charter**, an explicit, positive legal instrument signed by the Allied powers that defined "Crimes Against Humanity." They created new positive law to punish the Nazis. This aligns more with Hart's view: The old German law allowed genocide, so we had to create new positive law to punish it.

  ### 3. The Weakness of Natural Law
  While Natural Law feels better emotionally, it has a dark history that makes legal professionals wary.
  *   **It cuts both ways:** Before the Civil War, American courts used Natural Law arguments (specifically regarding "natural" property rights) to defend slavery and strike down early labor protections.
  *   **It creates instability:** If a law's validity depends on its morality, then every time public morality shifts, the validity of existing statutes shifts. This makes long-term planning and governance difficult.
  *   **It lets legislators off the hook:** If judges are responsible for ensuring laws are "moral," legislators can pass lazy or cruel laws expecting the courts to clean up the mess. Hart argued it is better for the legislature to own the immorality of their laws so the public can vote them out.

  ### 4. Where the Truth Lies (The "Soft Positivist" Compromise)
  Most modern legal philosophers don't choose a hard side. They acknowledge Hart was right about the *definition* of law, but Fuller was right about the *function* of law.

  Hart himself admitted that for a legal system to survive, it must contain a **"minimum content of natural law."** (e.g., laws against murder, theft, etc., are necessary for human survival). He just refused to build that requirement into the *definition* of law itself.

  Furthermore, Fuller's contribution wasn't just "unjust laws aren't laws." He argued for the **"Internal Morality of Law."** He said that for something to count as law, it must follow certain procedures: it must be public, clear, not retroactive, and possible to obey. This is actually very compatible with Positivism and forms the basis of what we now call "The Rule of Law."

  ### Summary
  Your cousin is defending Hart not because Hart liked the Nazis (he was a British Jew who fought in intelligence during the war), but because Hart believed that **honesty about law protects us better than noble lies.**

  *   **Fuller says:** "That wasn't law, so you can punish her." (Risk: Judges decide what is law based on their morals.)
  *   **Hart says:** "That was law, and it was evil. We will pass a new law to punish her, admitting we are making an exception for justice." (Benefit: Preserves the distinction between legal validity and moral worth, preventing future tyrants from claiming their evil decrees are 'moral' and therefore beyond critique.)

  Positivism remains mainstream because it treats law as a tool—a dangerous one. It insists we look at the tool clearly, without moral varnish, so that when it is used for evil, we can identify it as evil immediately, rather than getting bogged down in debates about whether it counts as a "real" tool.
