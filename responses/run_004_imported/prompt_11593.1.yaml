          *   *Multiversist:* Follows Joel David Hamkins. Believes in a multiverse of set-theoretic worlds. CH is true in some, false in others. Analogy to Euclidean/Non-Euclidean geometry.
      *   **Setting:** Coffee, right after a colloquium talk on forcing.
