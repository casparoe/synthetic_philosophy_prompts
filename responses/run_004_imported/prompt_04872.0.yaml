answer: |-
  The silverware clinked against the crystal, a polite rhythm under the hum of the banquet hall. Arthur, the guest of honor, was currently holding court three seats down, laughing too loudly at a story about a field station in Borneo.

  Elena swirled her Pinot Noir, watching the legs run down the glass. "Arthur looks well," she said, not looking at Marcus.

  "He looks like he's finally stopped worrying about tenure," Marcus replied. He loosened his tie, just a fraction. "Twenty years. God. Do you remember the lab Christmas party where Gould came to speak?"

  "I remember you spilled wine on his shoes," Elena said, a small smile touching her lips. "And then tried to argue with him about the panda's thumb for an hour."

  "And he loved it," Marcus said. "He liked the fight. That's what I miss. The field feels... tidy now. Everyone's looking for the gene for this, the selection pressure for that. No one wants to talk about noise."

  "Noise is usually where the signal is hiding, Marcus."

  "Or it's just noise." He turned fully toward her now, the retirement pleasantries evaporating. "I saw your abstract for the symposium. Still flying the spandrel flag?"

  "Someone has to hold the line against the adaptationist programme," Elena said, her voice dropping, sharpening. "Especially when the data doesn't support the function. Look at the female orgasm. We've been chasing functional accounts for decades. The upsuck theory? The retention mechanism? Pair-bonding? Elisabeth Lloyd tore them apart. The variability is too high. If it were an adaptation for reproduction, selection should have stabilized the trait. Instead, it's inconsistent, context-dependent, and often absent."

  Marcus took a sip of wine, his eyes steady over the rim. "You're conflating origin with maintenance. Yes, the clitoris and penis are homologous. Yes, the developmental blueprint is shared. That explains the *existence* of the capacity, Elena. I'll grant you that. It's the male phenotype's shadow. But that doesn't preclude secondary selection."

  "Secondary selection requires heritable variation linked to fitness," she countered. "Where is the fitness link? Women who orgasm more frequently don't necessarily conceive more often. The correlation isn't there."

  "Conception is a crude metric," Marcus said. "What about mate choice? If orgasm functions as a filter for male quality, or a mechanism to encourage copulation frequency with high-quality sires, you wouldn't see a direct conception correlation in a meta-analysis. You'd see it in behavioral ecology. You're treating the byproduct hypothesis as the null, Elena. But 'it's just a spandrel' is its own Just-So story. It's convenient. It absolves you of having to find the function."

  "It's not a story; it's a developmental constraint," she said, setting her glass down. "When you assume adaptation first, you treat the absence of evidence as a puzzle to be solved by inventing a function. I'm saying the absence of evidence *is* the evidence. It's like male nipples. We don't ask what selective advantage nipples give men. We accept they come along for the ride."

  "Men don't lactate," Marcus said softly. "Women do. And the physiology of the female orgasm is far more complex than a phantom limb. The neural circuitry, the vascular response—it's elaborate. Nature is parsimonious. It doesn't waste energy maintaining elaborate circuitry for twenty minutes of pleasure unless that pleasure *does* something."

  "Or unless it's tied to something else that does something," Elena shot back. "Libido is selected for. Orgasm might just be the exhaust heat of the engine. You're arguing that because a trait is complex, it must be adaptive. But spandrels can be ornate. Look at San Marco. The spandrels aren't blank space; they're filled with mosaics. Does that mean the arches were built to hold the mosaics?"

  Marcus leaned in, the candlelight catching the gray in his beard. "But the mosaics were added *later*. That's my point. The arches were structural. The art was secondary. I'm not saying the origin was adaptive. I'm saying that once the variation existed, selection could have acted on it. You're freezing the trait in the moment of embryological origin and ignoring twenty years of evolutionary time since. Why is it so hard to believe that pleasure reinforces behavior that increases fitness, even indirectly?"

  "Because it's unfalsifiable," Elena said. "You can always posit an indirect benefit. 'It reduces stress.' 'It strengthens the bond.' If you can't nail it down, if the data remains this messy, the honest answer is that we don't know. Not that we assume selection did the work."

  "And the honest answer," Marcus said, picking up his fork as the first course arrived, "is that assuming it's useless is just as much of leap as assuming it's useful. We're both telling stories about the past. Mine just gives selection the credit it's earned elsewhere."

  "Yours assumes the world is perfectly designed," Elena said, picking up her own fork. "Mine accepts the mess."

  "Yours accepts the mess," Marcus corrected, meeting her eyes, "because you're afraid to look for the order."

  They held the gaze for a moment, the air between them tight with two decades of unresolved equations. Then Arthur banged a spoon against his glass, calling for a toast.

  "To Arthur," Marcus said, lifting his wine, his tone lightening but not softening.

  "To Arthur," Elena echoed. They drank. The wine was bitter, complex, and unfinished.
