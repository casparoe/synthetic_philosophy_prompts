answer: |-
  **MEMORANDUM**

  **TO:** Joint Instrumentation Committee
  **FROM:** [Your Name], Emeritus Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Allocation Methodology for Cryo-EM Suite

  **Purpose**

  Following our last meeting, I have reviewed the subcommittee's report regarding the allocation of cryo-EM hours following the detector upgrade. We face a conflict between two definitions of fairness. The current bylaws mandate the Nash Bargaining Solution (NBS), which maximizes the product of our gains over our fallback positions. However, applying NBS to the post-upgrade capabilities yields a counterintuitive result: Structural Biology (SB), the primary beneficiary of the upgrade, is allocated *fewer* hours than before.

  This memo recommends that the Committee provisionally adopt the Kalai–Smorodinsky Bargaining Solution (KSBS) for the coming allocation cycle, pending a bylaw amendment. I argue that KSBS better reflects the moral and practical realities of this partnership, specifically regarding how we treat improvements to shared infrastructure.

  **The Core Dispute: Two Ways to Split the Surplus**

  To decide how to split the 1,600 available hours, we must agree on what constitutes a "fair" division. Both methods start from the same **Disagreement Point**: the value each department receives if cooperation fails (SB's off-site national lab access; MS's slower neighboring instrument). The dispute is about where we aim from there.

  1.  **The Nash Solution (Current Bylaws):** This method asks, "How can we maximize the *joint* benefit created by cooperating?" It treats the partnership as a single engine to be optimized. While mathematically elegant, it has a known flaw: it does not guarantee that if the machine becomes more useful to one department, that department's share will not shrink. In our case, the upgrade increased the total value of the suite, but because it increased SB's utility disproportionately, the NBS mathematically compensated MS to keep the "product of gains" balanced. This violates the intuitive principle that a department funding a specific upgrade should not be penalized in access time.
  2.  **The Kalai–Smorodinsky Solution (Proposed):** This method asks, "How can we ensure both departments make equal *relative sacrifices* from their best-case scenarios?" It looks at the **Ideal Point**: the maximum hours a department could physically use if the other department conceded everything. It then scales the allocation so that SB and MS each give up the same percentage of their "dream scenario." This ensures **monotonicity**: if the machine becomes more valuable to SB, SB's share cannot decrease.

  In moral philosophy terms, specifically David Gauthier's *Morals by Agreement*, KSBS operationalizes "minimax relative concession." It ensures that neither party bears a disproportionately heavy burden of compromise relative to their maximum potential.

  **The Strongest Case for Retaining Nash**

  I want to address the concerns of my colleagues who wish to retain the Nash solution, as their objections are substantial and not merely procedural.

  The primary argument for Nash is **incentive compatibility**. The Nash solution relies on "disagreement points" (fallback options), which are relatively objective and hard to fake. The Kalai–Smorodinsky solution relies on "ideal points" (maximum possible usage). There is a genuine risk that departments will inflate their ideal points—claiming they could run the machine 24/7—to manipulate the ratio in their favor. If we adopt KSBS, we invite a culture of strategic exaggeration where departments are rewarded for claiming they need more time than they physically can use. Furthermore, the Nash solution is already codified in our bylaws; changing it sets a precedent that may destabilize future inter-departmental agreements. These are not minor administrative hurdles; they are safeguards against gaming the system.

  **Recommendation and Safeguards**

  Despite the risks, the Nash result in this specific instance is untenable. It signals to donors and department heads that upgrading a shared instrument may result in reduced access for the upgrading party. This creates a perverse disincentive for future investment.

  Therefore, I recommend the following:

  1.  **Adoption of Principle:** The Committee should vote to apply the Kalai–Smorodinsky principle (minimax relative concession) for the upcoming allocation cycle.
  2.  **Defining the Ideal Point:** To address the fear of inflated claims, the "Ideal Point" must not be based on departmental wishes. It must be capped by **physical and operational constraints**. For this cycle, a department's ideal point is defined as the maximum hours they can realistically staff and process samples for, verified by the suite manager, or 100% of available hours, whichever is lower. We treat the "utopia" as a physical limit, not a demand.
  3.  **Allocation Split:** Based on a preliminary KSBS calculation using verified staffing capacity and the new utility curves from the upgrade, I recommend a split of **60% Structural Biology / 40% Materials Science (960 hours / 640 hours)**. This reflects the increased utility SB derives from the high-resolution detector while maintaining MS's access well above their disagreement point.
  4.  **Review Period:** This methodology shall stand for **two years**. At that time, the Committee will review whether "ideal point" reporting has remained honest. If strategic inflation is detected, we revert to Nash or a fixed quota system.

  **Conclusion**

  We are not merely dividing machine time; we are defining the terms of a long-term collaboration. The Nash solution maximizes efficiency, but the Kalai–Smorodinsky solution maximizes the stability of the agreement by ensuring that improvements to the shared resource are shared fairly. By adopting KSBS with strict verification of capacity, we honor the intent of the upgrade while protecting the committee from manipulation.

  I move that we adopt this recommendation provisionally, instructing the legal counsel to draft the necessary bylaw amendments for the next fiscal year.
