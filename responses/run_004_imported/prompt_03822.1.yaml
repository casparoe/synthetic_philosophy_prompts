  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to anachronistically apply modern constitutionalism to Aquinas. Stick to *common good* vs. *private good*.
      *   *Correction:* Ensure *De Regimine* authorship isn't a distraction (some say Ptolemy of Lucca wrote parts), but treat it as the "Aquinas tradition" since the user cited it. (Decided: Acknowledge the collaboration but treat the text as authoritative for the tradition as requested).
      *   *Nuance on "Public Authority":* Aquinas usually means a superior (Emperor over King). The conspirators were subordinates. This is the hardest hurdle. I need to argue whether the *collapse* of the superior authority allows the subordinate to act *as* the public authority.
      *   *Key Scholastic Concept:* *Defensio communis* (Defense of the community). If the regime is effectively at war with its own people (existential threat), does the relationship revert to defense against an aggressor?

  7.  **Final Polish:** Check tone. Ensure it sounds like a scholastic disputation (respectful, analytical, distinguishing cases). Ensure both the friend's and user's points are integrated, not dismissed. (The friend is right about sedition; the user is right about the danger of private judgment. The synthesis lies in the definition of 'public authority' in a collapsed state).

  8.  *(Drafting the response based on these points...)* -> *See final output.*
answer: |-
  This is a profound question that cuts to the heart of Thomistic political ethics. You and your friend have correctly identified the two poles of the tension: the *Summa Theologiae* emphasizes the *end* of government (the common good), while *De Regimine Principum* emphasizes the *order* of government (hierarchy and stability). To treat this merely as "Aquinas hated tyrants" is to miss the scholastic rigor regarding *how* justice is restored.

  To reason through this, we must treat the July 20 plot not as a modern historical event, but as a *casus conscientiae* (case of conscience) to be adjudicated using Thomistic distinctions. We need to look at the ontology of Hitler's authority and the ontology of the conspirators' agency.

  ### 1. The Typology of Tyranny: *Absque Titulo* vs. *In Exercitio*

  Your first unresolved issue concerns the nature of Hitler's title. The scholastic tradition, particularly in Aquinas's *Commentary on the Sentences* (II, dist. 44, q. 2, a. 2), draws a sharp distinction that determines the licitness of resistance.

  *   **Tyrannus absque titulo (Usurper):** One who seizes power by force or fraud without any legal claim. Aquinas suggests that because such a ruler has no bond of fidelity with the subjects, anyone may kill him to free the community. He is essentially a public bandit.
  *   **Tyrannus in exercitio (Tyrant in Exercise):** One who holds legitimate title but rules unjustly. Here, the bond of fidelity remains. Subjects owe obedience to the *office*, even if the *officeholder* sins. Private killing is forbidden here because it violates the order of justice.

  **Where does Hitler fit?**
  This is the crux of your friend's difficulty. Hitler was appointed Chancellor legally by Hindenburg under the Weimar Constitution. He was not a usurper in the classical sense (like a conqueror). However, via the Enabling Act and the Reichstag Fire Decree, he dismantled the constitutional order that granted him authority.

  A Thomistic jurist might argue that authority is not a personal possession but a trust derived from the *lex regia* (the law constituting the rule). By destroying the legal order that constituted his office, Hitler effectively voided his own title. He transformed from a *tyrannus in exercitio* back toward a *tyrannus absque titulo*. He was no longer ruling *by* law, but *as* the law (*Führerprinzip*).

  **Does this change the verdict?**
  If Aquinas accepted that Hitler had reverted to usurper status by destroying the source of his own legitimacy, the barrier to action lowers significantly. The *Commentary on the Sentences* permits the killing of a usurper by any private person because there is no pact to violate. However, Aquinas is cautious. Even in the *Sentences*, he implies that if the usurper has established a stable regime over time, the "common good" of stability might outweigh the injustice of the original seizure. By 1944, Hitler had ruled for 11 years. The "usurper" argument is strong legally, but the "stability" argument complicates it.

  However, the stronger Thomistic classification is likely *tyrannus in exercitio*. He held the color of title. This forces us into the stricter framework of *De Regimine Principum*, which is where your anxiety is well-founded.

  ### 2. The Problem of Agency: Private Presumption vs. Public Authority

  This is the most critical theological hurdle. In *De Regimine Principum* (I.6), Aquinas explicitly rejects the idea that private individuals can judge and execute a tyrant. He argues that if private presumption is allowed, "wicked men" will kill "good kings" under the pretext of tyranny. He insists that action against a tyrant must proceed by **public authority** (*auctoritate publica*).

  In a medieval context, "public authority" means a superior: the Emperor acting against a King, or the Pope acting against an Emperor. It implies a hierarchy of judgment. In Nazi Germany, that hierarchy was obliterated. There was no Emperor, no Pope with temporal power, no independent judiciary.

  **The Conspirators as "Public Authority"**
  Your second point asks whether Stauffenberg and the General Staff constitute a "public authority."
  *   **Argument for "Private":** They were subordinates. They took an oath of personal loyalty to Hitler. In Thomistic terms, they were *privati* relative to the Head of State. They had no mandate to judge the ruler. From this angle, the plot is sedition, regardless of Hitler's evil, because it dissolves the hierarchy necessary for peace.
  *   **Argument for "Public":** Aquinas defines the state by its end (the common good), not just its personnel. When the Head of State becomes destructive to the very existence of the community (which Hitler was, by 1944), the "public authority" does not vanish; it devolves. The Reserve Army and the General Staff were institutions of the *Reich*, not private militias. By invoking *Valkyrie*, they were attempting to use an existing mechanism of state continuity.

  **The Thomistic Synthesis:**
  Aquinas would likely look at the *intent* and the *capacity*. If the conspirators were acting merely as disgruntled individuals, they are private murderers. But if they were acting as the remaining organ of the *res publica* (the public thing) to restore the rule of law, they might be viewed as exercising a "vicarious public authority."

  In the absence of a superior (Emperor/Pope), the scholastic tradition sometimes allows for the "community" to act. But the community cannot act as a mob; it must act through its representative parts. The Army, in a totalitarian state where all civilian institutions are nazified, might be the only remaining "representative part" capable of acting for the whole. If Beck and Witzleben viewed themselves not as assassins but as the provisional guardians of the German state acting to excise a cancerous growth to save the body, they move closer to Aquinas's requirement of *publica auctoritas*.

  However, Aquinas would remain deeply suspicious. The *De Regimine* warning is about precedent. If Generals can kill Chancellors, what stops the next General from killing a Chancellor he merely dislikes? The Thomistic worry is not about *this* specific tyrant, but about the *form* of the action.

  ### 3. The Consequentialist Weighing: The "Greater Harm" Clause

  Here is where the *Summa* (II-II, q. 42, a. 2) and *De Regimine* actually converge, and where the verdict likely turns.

  Aquinas is not a pacifist regarding tyranny, but he is a consequentialist regarding *remedies*. In the *Summa*, he says disturbing a tyranny is not sedition **unless** the disturbance brings about greater evils than the tyranny itself. In *De Regimine*, he warns that killing a tyrant often leads to worse tyrants or civil war.

  **Applying the Test to July 1944:**
  1.  **The Tyranny:** By 1944, the regime is not merely "unjust" in a tax policy sense; it is actively suicidal for the German people and genocidal toward others. The "common good" is not just suppressed; it is being annihilated. Continued obedience guarantees the destruction of the community.
  2.  **The Remedy:** The plot intended to immediately secure peace and restore law.
  3.  **The Risk:** Civil war? The SS was powerful. Failure could lead to even harsher reprisals (which happened).

  Aquinas would ask: *Is the probability of restoring the common good high enough to justify the rupture of order?*

  If the conspirators had a high probability of success and a concrete plan to restore law (which they claimed to have via the Shadow Government), Aquinas might concede that the "greater harm" clause is satisfied. The tyranny is no longer a political dispute; it is an existential threat to the *polis*. In such a case, the preservation of the community (the primary law of nature) overrides the preservation of the ruler.

  ### 4. Resolving the Tension

  So, how do we fit the strands together?

  Your friend is right that *Summa* II-II, q. 42 removes the label of "sedition" from acts against a regime that has abandoned the common good. If the regime is no longer a true regime (in the Aristotelian/Thomistic sense), opposing it is not opposing authority, because true authority no longer exists.

  You are right that *De Regimine* forbids private individuals from making that judgment, to prevent anarchy.

  **The Verdict:**
  Aquinas would likely judge the plot **licit only if** two conditions are met, which remain historically debatable:

  1.  **Representation:** The conspirators must be shown to act not as private men, but as the *de facto* public authority. Given the total collapse of civilian checks, the Army High Command acting to restore the Constitution could be interpreted as the "public authority" required by *De Regimine*. They are not "private individuals" in the sense of random citizens; they are the armed arm of the state turning against a head that has severed the body from its own survival.
  2.  **Proportionality:** There must be a reasonable hope that the removal of Hitler would result in a net gain for the common good (i.e., ending the war, stopping the atrocities) rather than merely plunging Germany into a worse civil war.

  **The "Nagging" Conclusion:**
  Aquinas would likely not give a clean "Yes." He would likely say: *"Theoretically, a tyrant who destroys the common good forfeits his claim to obedience. However, the remedy must not be worse than the disease. If the General Staff can act as the public authority to restore law without causing greater destruction, it is permissible. If they act on private presumption or risk greater chaos, it is sin."*

  He would vindicate the *end* (your friend's point) but remain deeply anxious about the *means* (your point). He would likely view Stauffenberg not as a saint, but as a man caught in a tragic necessity where the normal structures of judgment had collapsed, forcing him to assume a public role that technically exceeded his private mandate, justified only by the extremity of the threat to the *bonum commune*.

  In the end, Aquinas prioritizes the *salus populi* (safety of the people). If Hitler's Germany was a machine for the destruction of its own people and the world, Aquinas's insistence on the "common good" ultimately overrides his insistence on hierarchical stability. But he would demand that the conspirators prove they were acting for the *Res Publica*, and not merely for a different faction. That is the narrow needle they had to thread, and historically, it is why so many hesitated until it was too late.
