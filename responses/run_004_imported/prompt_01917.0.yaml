      *   *Turing's Text:* "It is assumed that the bodies move according to the known laws of physics... If telepathy is admitted, this assumption must be dropped." "The statistical evidence, at least for telepathy, is overwhelming." "In these circumstances I do not think we need to worry too much about the objection." "We can quite easily arrange conditions... to prevent telepathy."
