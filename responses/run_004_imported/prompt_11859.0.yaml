answer: |-
  This is a fantastic puzzle, and you are right to sense that there is more going on here than just one guy being a jerk. Since you live in the world of Kant, I'll try to bridge the gap between the "rational choice" framework your dinner friends were inadvertently stumbling into and the moral framework you know well.

  The short answer is: **Friend B is wrong about rationality, but they have identified a genuine structural problem in game theory known as the "Hold-Up Problem" or "Time Inconsistency."**

  Here is the breakdown of why the cousin's reasoning is flawed, why the rescuer's position is tricky, and where the actual philosophical meat lies.

  ### 1. Was the Cousin's Move "Rational"?

  Friend B is operating with a very narrow, short-term definition of rationality (often called *Homo Economicus*). In this view, rationality means maximizing immediate material payoff.
  *   **Payoff if he pays:** -$300.
  *   **Payoff if he doesn't:** $0.
  *   **Conclusion:** Don't pay.

  However, this ignores **long-term rationality** and **reputation**. Rationality is usually understood as acting effectively to achieve one's ends over time. If the cousin's ends include living in a society where people help him when he's injured, or maintaining a self-conception of integrity, or avoiding the risk of small-claims court (a contract was formed), then not paying is actually *irrational*.

  But the deeper error Friend B is making is ignoring the **Time Inconsistency Problem**.
  *   **Time A (On the trail):** The cousin prefers "Rescue + Pay" over "No Rescue." He signals this by agreeing.
  *   **Time B (At the ER):** The rescue has already happened. The cost is sunk. Now he prefers "Rescue + Don't Pay" over "Rescue + Pay."

  A rational agent should anticipate their future self's weakness. By not having a mechanism to bind his future self (like paying upfront, or having a witness), the cousin allowed his preferences to shift once the leverage disappeared. That isn't "smart"; it's a failure of strategic planning. He exploited a loophole in the enforcement mechanism, not a loophole in logic.

  ### 2. Was the Rescuer's Move a Mistake?

  This is the *Ex Post* vs. *Ex Ante* distinction.
  *   **Ex Post (After the fact):** Yes, it was a mistake. He expended resources and got nothing.
  *   **Ex Ante (Before the fact):** No, it was not a mistake.

  If the rescuer had known *with certainty* that the cousin would defect, then yes, stopping would have been irrational (assuming the rescuer cares about the $300). But in the real world, we operate on **probabilistic trust**. Most people are not defectors. If everyone reasoned like the cousin, the "equilibrium" would be that no one stops for injured bikers.

  The rescuer was betting on the existence of social norms. The fact that the cousin violated that norm doesn't make the rescuer's bet irrational; it just makes the cousin a "black swan" event.

  ### 3. The Real Puzzle: The Commitment Problem

  Here is the philosophical core that bugged you. This scenario is a classic example of a **Commitment Problem**.

  In Game Theory, cooperation often breaks down because parties cannot credibly commit to future actions. The cousin *could not credibly commit* to paying once he was safe. The rescuer *could not credibly commit* to not leaving him there if he didn't agree to pay.

  The reason this feels like a puzzle rather than just "theft" is that **there was no external enforcement.**
  *   There was no written contract.
  *   There was no police presence.
  *   There was no immediate exchange of goods (cash for ride).

  In the absence of external enforcement (laws, contracts), society relies on **internal enforcement** (guilt, honor, duty).
  *   **Friend A** is appealing to internal enforcement (Morality).
  *   **Friend B** is noting the absence of external enforcement (Leverage).
  *   **The Cousin** realized that without external enforcement, internal enforcement was optional for him.

  ### 4. Bringing it Home to Kant

  Since you teach Kant, you'll see the isomorphism immediately. The cousin's maxim was something like: *"I will promise to pay for help when I am vulnerable, but I will break that promise once I am safe if it costs me money."*

  Kant would say this fails the **Formula of Universal Law**. If everyone adopted this maxim, no one would believe promises made in vulnerable situations, and the institution of emergency bargaining would collapse. The cousin is essentially "free-riding" on a system of trust he is unwilling to uphold.

  He is also failing the **Formula of Humanity**. He used the rescuer as a mere means to an end (safety), discarding the rescuer's agency and agreement once they were no longer useful.

  ### The Verdict

  Friend B is confusing **opportunism** with **rationality**.
  *   **Opportunism:** Taking advantage of a shift in leverage to maximize immediate gain.
  *   **Rationality:** Acting in a way that is sustainable and consistent with one's long-term goals and social reality.

  The cousin was opportunistic. But if everyone were "rational" in the way Friend B describes, the rescuer would never have stopped in the first place. The cousin's "smart move" relies on the rescuer *not* being smart in the same way (i.e., the rescuer must be trusting/moral for the cousin to exploit him).

  **So, to answer your specific questions:**
  1.  **Is Friend B correct?** No. They are defining rationality too narrowly. It is not rational to undermine the very social norms that allow you to survive when you are vulnerable.
  2.  **Was helping a mistake?** Ex post, yes. Ex ante, no. But it highlights why we need moral norms: they act as a surrogate for contracts when contracts are impossible.
  3.  **What is the puzzle?** It is the tension between **individual incentive to defect** and **collective need to cooperate** in the absence of enforcement.

  The cousin didn't solve a puzzle; he just broke the machine. He proved that without moral duty (Kant) or reputation costs (Game Theory), agreements made under duress are worthless. That's not "smart"; it's socially parasitic.
