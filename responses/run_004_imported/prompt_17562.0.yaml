      *   **Rising Action:** She tests the model. She achieves Calibration (a score of 70% means 70% risk for everyone).
      *   **The Conflict:** She checks the error rates. Because the base rates of severe illness differ between the two populations (due to underlying health disparities, not biased data), the False Positive and False Negative rates diverge.
      *   **The Attempted Fix:** She tries to adjust the threshold or reweight the data to equalize error rates.
      *   **The Climax:** She realizes that fixing the error rates breaks the calibration. The math won't allow both.
      *   **Falling Action:** A conversation with Marcus where she explains the impossibility.
      *   **Resolution:** She has to make a choice. There is no perfect solution. She submits the report, acknowledging the trade-off.

  5.  **Drafting - Section by Section:**

      *   *Setting the Scene:* The hospital server room or a late-night office. The hum of machines. The weight of the decision.
      *   *The Goal:* Define "Fairness." Elena wants *Calibration* (trustworthiness of the score) and *Equality of Opportunity* (same false negative rate).
      *   *The Data:* Population A has a 20% severe illness rate. Population B has a 5% severe illness rate. This is the crucial "Base Rate" difference.
      *   *The Realization:* Run the simulation. If the model is perfectly calibrated, a score of 0.8 means 80% chance of death for both. But because Population B has fewer sick people overall, the number of *healthy* people flagged as sick (False Positives) relative to the total healthy people will differ, or the number of *sick* people missed (False Negatives) will differ if thresholds are shifted.
      *   *The "Fix" Attempt:* Elena tries to lower the threshold for Population B to catch more sick people. Now the False Negative rates match. But wait, now a score of 0.8 in Population B doesn't mean the same thing as 0.8 in Population A. Calibration is broken. Trust is eroded.
      *   *The Conversation:* Marcus suggests "better features." Elena shuts it down. The theorem holds even with perfect data.
      *   *The Ending:* She has to choose which fairness metric to violate. She chooses Calibration (usually the standard for medical risk), but acknowledges the cost. The tension remains.

  6.  **Refining the Math/Narrative Integration:**
