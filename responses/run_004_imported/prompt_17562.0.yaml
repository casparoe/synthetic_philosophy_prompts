      *   **Tone:** Intellectual but narrative-driven, helping the concept "sink in."

  2.  **Select the Setting:**
      *   *Bank Loan:* A bit dry, often feels like profit vs. ethics.
      *   *Child-Welfare:* High stakes, but emotionally heavy and complex regarding "ground truth."
      *   *Hospital Triage:* High stakes, clear "outcome" (survival/recovery), distinct groups (demographics), and immediate ethical weight. Let's go with a **Hospital Triage/Emergency Resource Allocation** scenario. It allows for clear definitions of "risk" (mortality) and "intervention" (ICU bed).

  3.  **Develop the Characters:**
      *   **Protagonist:** Elena, a data scientist/epidemiologist. She cares deeply about equity.
      *   **Antagonist/Foil:** Not a villain, but perhaps a hospital administrator or a colleague who represents the "just fix the data" mindset, or simply the cold hard reality of the statistics. Let's make it a colleague, Marcus, who represents the pragmatic/optimistic view, while Elena discovers the hard truth. Actually, to keep the focus on Elena's internal realization, maybe Marcus is the one pushing for the "fix," and Elena is the one running the numbers.
      *   **The Groups:** Let's use two distinct demographic groups with different underlying prevalence of the condition (Base Rate Difference). Let's call them District A and District B, or perhaps based on a specific condition prevalence linked to socioeconomic factors. Let's keep it abstract enough to avoid specific real-world baggage but clear enough for the math to hold. "North Wing" vs. "South Wing" populations.

  4.  **Plot Outline:**
