answer: |-
  **UNITED STATES COURT OF APPEALS**
  **FOR THE THIRTEENTH CIRCUIT**

  **CONFIDENTIAL MEMORANDUM TO PANEL CONFERENCE**

  **DATE:** October 14, 2023
  **TO:** Judge Okafor; Judge Vance
  **FROM:** Judge Kessler
  **RE:** *United States v. Halloran*, No. 23-1492 (WNPA Civil Penalty Appeal)

  **Tentative Disposition:** Reverse District Court. Remand with instructions to dismiss.

  **I. Overview**

  This case presents a stark conflict between statutory text and statutory purpose. The District Court ruled for the Government, accepting the argument that the Wetland Nesting Protection Act (WNPA) must be read to prohibit preemptive destruction of habitat, even if that destruction occurs outside the statutory window.

  I intend to vote to reverse.

  While I share the Government's concern that a literal reading creates a significant enforcement loophole, the operative language of § 3(a) is unambiguous. The Findings Section informs the context but cannot override the command. The Legislative History is irrelevant. To rule for the Government would require us to rewrite the statute under the guise of interpretation. That is a legislative function, not a judicial one.

  **II. Statutory Text**

  The liability provision is found at § 3(a):
  > "It shall be unlawful for any person to drain, fill, or otherwise alter a wetland that serves as nesting habitat for a species listed under section 2, **during the nesting season for that species**, without a permit issued under section 5." (Emphasis added).

  The phrase "during the nesting season" is a temporal limitation. It is not ambiguous. It does not say "in anticipation of the nesting season." It does not say "at any time." It does not say "when the wetland is intended for nesting." It says *during*.

  Halloran's conduct occurred on March 15. The nesting season for the copper-throated marsh finch, as defined by regulation, opens on April 1. Her actions fell outside the temporal scope of the prohibition. Under ordinary principles of textualism, when the statute's language is plain, the sole function of the courts is to enforce it according to its terms. *Camreta v. Greene*, 563 U.S. 692, 709 (2011).

  **III. The Government's Best Argument**

  I want to address the Government's position at its strongest, because I know Judge Okafor will press this hard in conference. The Government argues that reading "during" literally renders the WNPA a nullity. This is not merely a policy complaint; it is an invocation of the "absurdity doctrine."

  The Government points to § 2(b) (Findings and Purpose), which states:
  > "Congress finds that... critical nesting habitat is frequently destroyed in anticipation of the nesting season, before any protection attaches, thereby thwarting the remedial goals of this chapter."

  The Government contends that because Congress explicitly acknowledged this specific evasion tactic in the Findings, we must presume the operative text was drafted to cover it. They argue that interpreting "during" to exclude the two-week window immediately preceding the season creates a result so contrary to the declared purpose that it qualifies as "absurd" in the legal sense. They rely on *Green v. Bock Laundry Machine Co.*, 490 U.S. 504 (1989), suggesting we should adopt the interpretation that best aligns with the overall statutory scheme when a literal reading produces an irrational outcome.

  Furthermore, the Government highlights the Floor Statement of the bill's sponsor, Rep. Alvarez, who noted during debate: "This Act is designed to close the 'early drain' loophole seen in state regimes, where landowners strike just before the clock starts."

  **IV. Analysis**

  **A. The Findings Section**
  The Findings Section is part of the enacted text, unlike the Floor Statement. I give it weight as context. However, findings explain *why* Congress is acting; they do not expand *what* Congress has commanded. If § 2(b) identifies a problem but § 3(a) fails to solve it, the court cannot use § 2(b) to rewrite § 3(a). To do so would treat the Findings as operative commands, rendering the specific limitations in § 3(a) superfluous. If Congress wanted to ban "anticipatory" draining, they knew how to draft that prohibition (as they have in the Clean Water Act's wetland mitigation provisions). The presence of the problem in the Findings suggests the omission in the Operative Text may have been a compromise, not a drafting error.

  **B. The Absurdity Doctrine**
  The absurdity doctrine is a narrow exception, reserved for situations where the literal application of the text would produce a result that no reasonable person could have intended. *See* *Public Citizen v. United States Dep't of Justice*, 491 U.S. 440, 470 (1989) (Kennedy, J., concurring).

  Is it "absurd" to allow a landowner to drain a pond 13 days before nesting season? It is certainly frustrating. It undermines the efficacy of the Act. But it is not linguistically absurd. It is a line-drawing problem. Congress drew a line at the start of the season. Enforcement agencies knew this line existed. They failed to issue a permit denial or an emergency order before March 15.

  The Government's argument is effectively that the statute is *too easy to evade*. That is a policy critique, not a textual one. If the text allows a loophole, the remedy is legislation, not judicial redrafting. If we expand "during" to mean "before or during," we erase the temporal limitation entirely. We would then be left deciding how long "before" is permissible. Two weeks? Two months? Two years? By trying to fix the loophole, we would create a vagueness problem that invites arbitrary enforcement.

  **C. Legislative History**
  Regarding Rep. Alvarez's Floor Statement: I will not rely on it. Statements by a single sponsor, made outside the enacted text, cannot alter the clear meaning of the statute. *See* *Exxon Mobil Corp. v. Allapattah Servs., Inc.*, 545 U.S. 546, 568 (2005). If the text is clear, legislative history is irrelevant. If the text is ambiguous, legislative history is often unreliable. Here, the text is clear.

  **V. Conclusion and Strain**

  I recognize the cost of this decision. Voting to reverse means Halloran pays no penalty for destroying a decade-old habitat. It means the WNPA, as written, invites landowners to monitor the Federal Register for listing decisions and race the clock.

  Judge Okafor, I anticipate your view that this interpretation treats the statute as a dead letter. You will argue that fidelity to the "rule of law" requires fidelity to the *purpose* of the law, not just its grammar. My counter is that the "rule of law" requires citizens to be able to rely on the text as written. Halloran relied on the text. She read "during," she checked the calendar, and she acted. To penalize her now for complying with the literal prohibition is to punish her for trusting the statute more than the agency did.

  We are not the Council of Revision. If Congress wishes to close the "two-week window," they can amend § 3(a) to read "during or in reasonable anticipation of." Until they do, I cannot vote to affirm a penalty that the text does not authorize.

  **Drafting Assignment:**
  I will circulate a draft opinion reversing within the week. If either of you prefer to write a concurrence or dissent, please let me know by Friday so we can coordinate page limits.

  MK
