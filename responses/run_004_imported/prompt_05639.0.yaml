answer: |-
  Thank you all for being here. For those who don't know me, I'm [Name], Miriam's niece/nephew. I'm a novelist. My aunt was a philosopher. In this family, that meant I told stories to make sense of the world, and she took the stories apart to see if the gears turned.

  We have a diverse gathering today. Half of you are here because Miriam was family, a woman of prayer and hymns. The other half are here because Miriam was a mind that sharpened itself on the hardest stones of theology. Usually, at a funeral, the goal is to smooth things over. But Miriam would have hated that. She believed that truth is a form of love, and you don't show love by pretending the hard things aren't hard.

  So, I need to speak about the elephant in the sanctuary.

  Miriam spent forty years asking a terrifying question: *How does the cross actually work?* Specifically, she wrestled with the idea of penal substitution—the notion that Jesus was punished *instead* of us. Her famous argument was that justice doesn't work like a credit card. You can't just transfer a debt of guilt to an innocent party without breaking something essential about justice itself. She used to joke that if anyone stood in this pulpit today and preached that doctrine as a settled fact, she'd find a way to haunt them.

  For her colleagues here: I promise, she is not haunting me. I checked.

  But for the rest of the family, who might worry that this means she didn't believe in Jesus, I need you to hear the rest of the story. Because Miriam died a believer. She died trusting in Christ. She died expecting to be welcomed home.

  How do you hold those two things together? A sharp critique of the mechanism, and a total reliance on the Savior?

  Miriam taught me that faith isn't the absence of questions. It's the willingness to stand in the tension. She didn't reject the cross because she couldn't fully map its physics. She rejected *simplistic* explanations because she believed the cross was too holy, too costly, to be reduced to a transaction that felt unjust. She wouldn't settle for a God who was less righteous than she was.

  She often said that if we claim to worship the Truth, we shouldn't be afraid of where the questions lead. And for her, the questions didn't lead away from Jesus. They led deeper into the mystery of Him. She couldn't quite explain *how* the atonement worked without compromising justice, but she knew *that* it worked. She knew she was loved. She knew she was forgiven. She knew that when she looked at the crucifix, she was looking at the only place where God's justice and God's mercy kissed.

  She didn't solve the puzzle. She let the Puzzle solve her.

  There is a comfort in that for all of us. For the philosophers: You don't have to pretend she changed her mind. She didn't. She remained intellectually honest to the end. She died with the question open, trusting that God is big enough to hold the paradox.

  And for the family: You don't have to worry that her questions disqualified her from grace. Her faith wasn't built on her ability to explain grace. It was built on the Giver of it. She often quoted the old hymn, "My hope is built on nothing less than Jesus Christ and righteousness." She just spent a lifetime making sure we didn't confuse that righteousness with a legal loophole.

  She believed that Christ bore her sins. She believed that without Him, she was lost. She believed that His death was for her, and His resurrection was her future. She just refused to claim she understood the infinite mechanics of finite minds.

  In the end, Miriam wasn't looking for a theory. She was looking for a Person. And she found Him.

  So, as we commit her to the earth, we can do so with honesty and with hope. We don't need to fix her theology to honor her memory. We just need to follow her trust. She has gone to meet the One she loved, the One who died for her, the One who knew her questions better than she did and loved her through them.

  She is home now. Not because she figured it all out, but because she was known.

  Rest in peace, Aunt Miriam. The haunting is over. The work is done.
