      *   *Key Themes:* Passions are necessary for happiness. Illusions (illusions de l'amour-propre, etc.) sustain passions.
      *   *Nuance:* She distinguishes between *truth* (for the intellect/science) and *happiness* (for the heart/passions). She explicitly acknowledges illusions are illusions but argues we need them to feel strongly.
