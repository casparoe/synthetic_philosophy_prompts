          *   Ethics/Pragmatics: Is the *act of blaming* appropriate? Maybe not. Hypocrisy affects this.
      *   **Analyzing the Example:** Apply this to the Student Council President.
          *   Accusation: "You cheated." (True/False independent of President).
          *   Punishment/Blame: "I am punishing you." (Requires authority/standing).
