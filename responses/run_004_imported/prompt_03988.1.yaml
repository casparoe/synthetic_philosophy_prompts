          *   Both vindicate the intuition that paying is the rational choice.

      *   **Divergence:**
          *   *Locus of Rationality:* Gauthier = Dispositions/Character traits over time. FDT = Decision algorithms/logical output at the moment.
          *   *Metaphysics:* Gauthier = Psychological/Empirical (translucency). FDT = Logical/Counterfactual (subjunctive dependence).
