      *   **Core Task:** Compare two specific accounts of rationality in the Hitchhiker scenario: David Gauthier's Constrained Maximization (CM) vs. Functional Decision Theory (FDT).
      *   **Specific Constraints:** Do *not* rehearse the thought experiment (user knows it). Focus on where they agree and where they diverge regarding *why* paying is rational. Address the "ordinary person predictor" issue (imperfect translucency vs. fallible human prediction). Evaluate which offers a more satisfying general account of practical rationality for real-world cases.
      *   **Tone:** Philosophical, analytical, nuanced, respectful of the user's experience.

  2.  **Deconstruct the Two Theories:**

      *   **Gauthier (Constrained Maximization):**
          *   *Core Idea:* Rationality applies to dispositions/traits, not just isolated acts. A "Constrained Maximizer" (CM) is disposed to cooperate if they believe the other is also a CM. A "Straightforward Maximizer" (SM) defects.
          *   *Mechanism:* Translucency. Agents can detect dispositions with better-than-chance accuracy.
          *   *Rationality of Paying:* It's rational to *be* the kind of person who pays (because that gets you the ride). Once you are that person, paying is just acting on that disposition. The act itself might not maximize utility in isolation, but having the disposition does.
          *   *Real-world fit:* Relies on psychological cues, reputation, and social signaling. Fits the "sizing up a stranger" scenario well.

      *   **FDT (Functional Decision Theory):**
          *   *Core Idea:* Decisions are outputs of a decision algorithm. Rationality requires choosing the output that leads to the best outcome, considering that other instances of the same algorithm (or predictors simulating it) will output the same result.
          *   *Mechanism:* Subjunctive dependence / Logical correlation. The driver's prediction is a simulation of your decision procedure.
          *   *Rationality of Paying:* Your decision at the ATM is logically linked to the driver's prior prediction. If you decide "don't pay," the driver (running a similar logic or simulating you) would have predicted "won't pay" and left you. Therefore, "pay" yields the better outcome.
          *   *Real-world fit:* Often criticized for requiring high correlation or logical identity. Needs adaptation for "fallible human predictors."

  3.  **Compare and Contrast (The "Meat"):**

      *   **Agreement:**
