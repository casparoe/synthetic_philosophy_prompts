answer: |-
  This is one of the classic cruxes in the *NE*, and you are right to feel that the final sentence creates a moment of interpretive vertigo. If Aristotle spends the chapter arguing that the akratic *does* have knowledge (contra Socrates), only to end by saying the affection arises not in the presence of "knowledge proper" but "perceptual knowledge," it sounds like he is quietly reinstating the Socratic paradox he just spent 1146b–1147a dismantling.

  Here is the resolution that has satisfied me most in the classroom, distinguishing between the **logical structure** of the action (the syllogism) and the **psychological state** of the agent (the altered condition).

  ### 1. The "Socratic Concession": Is it an inconsistency?

  It is not an inconsistency, but it is a **qualified concession**. Aristotle is threading a needle between saving the *phainomena* (people really do act against their better judgment) and respecting Socrates' logical insight (knowledge, if fully active, cannot be dragged about like a slave).

  The key lies in how Aristotle redefines "knowledge" in that final sentence. When he says incontinence does not arise in the presence of "knowledge proper" (*kyria epistēmē*), he is not saying the agent lacks the universal principle dispositionally. He is saying the agent lacks the **active conclusion of the practical syllogism.**

  Recall the machinery Aristotle builds just before that line:
  1.  **Universal Premise:** "Dry food is good for every man."
  2.  **Particular Premise:** "This food is dry" (or "I am a man").
  3.  **Conclusion/Action:** Eat this.

  Aristotle's argument is that passion does not necessarily obliterate the Universal Premise. The akratic still believes "Dry food is good." However, passion obstructs the **Particular Premise** ("This is dry food").

  Why does this matter? Because for Aristotle, action is triggered only by the *conjunction* of the universal and the particular. If the particular premise is obscured, the conclusion (the action) is not determined by the universal good, but by the appetite.

  So, when he writes that incontinence arises not in the presence of "knowledge proper," he means: **It does not arise when the knowledge is fully actualized in the moment of action.**
  *   **Socrates:** "If you act badly, you didn't know."
  *   **Aristotle:** "If you act badly, you didn't know *in the active, particularized sense required to determine action at that specific moment*, even though you possess the knowledge dispositionally."

  He concedes Socrates' logical point (active knowledge of the good necessitates right action) but denies Socrates' empirical claim (that the akratic possesses active knowledge). This allows Aristotle to say: "Common sense is right, they *have* the knowledge (dispositionally), but Socrates is right that they aren't *using* it (actively) when they slip."

  The phrase "perceptual knowledge" (*aisthētike*) in the final line refers to the minor premise. The minor premise deals with particulars, which are objects of perception. The akratic retains the scientific/universal knowledge but loses grip on the perceptual/particular knowledge due to passion. Thus, the "inconsistency" dissolves if you read "knowledge proper" as "active knowledge of the particular premise."

  ### 2. The Sleep/Madness/Drunkenness Analogy: Mechanism or Illustration?

  To your second question: This is not a second, independent account stapled onto the syllogistic one. Rather, it is the **physiological/psychological mechanism** that explains *how* the syllogistic failure occurs.

  Think of the relationship this way:
  *   **The Syllogism (Universal/Particular):** Describes the *logical structure* of the failure. (Where in the reasoning process did the wire cross?)
  *   **The Altered State (Sleep/Drunk):** Describes the *condition of the soul* that causes the crossing. (Why did the wire cross?)

  Aristotle needs the analogy because the claim "one can have knowledge and not use it" is abstract. The analogy makes it concrete.
  *   **The Drunk/Actor:** A drunk person can recite Empedocles. They have the words (the universal premises) in their memory. But they do not understand the meaning or context (the particular application) in that moment. They are "uttering" knowledge without "knowing" it in the active sense.
  *   **The Akratic:** Similarly, the akratic can say "Sugar is bad for me." But under the influence of passion (which Aristotle views somatically, as a heating of the blood around the heart), they are cognitively incapacitated regarding the particular ("This cake is sugar").

  The analogy contributes two vital things to the argument:
  1.  **Temporality:** It shows that the loss of knowledge is temporary. The sleeper wakes; the drunk sobers up; the akratic feels remorse (*metameleia*) immediately after. If they lacked the knowledge permanently (like a fool), they wouldn't feel remorse.
  2.  **Compulsion:** It suggests that the state is not entirely voluntary in the moment. We don't blame the drunk for slurring *while* drunk in the same way we blame them for getting drunk. This helps Aristotle later (in VII.4–5) distinguish the akratic from the licentious man (the *akolastos*). The licentious man chooses the bad principle; the akratic has the right principle but is temporarily "asleep" to it.

  ### Pedagogical Suggestion

  When teaching this, I find it helpful to draw a distinction between **Possession** vs. **Activation**.

  Tell your students: "Socrates thought knowledge was like a light switch: it's either on (and you do the good) or off (and you don't). Aristotle says knowledge is more like a computer program running in the background. You have the software installed (Possession/Universal), but if your RAM is maxed out by a viral process (Passion), the program won't execute when you click the icon (Activation/Particular)."

  *   **The Syllogism** explains that the click didn't register.
  *   **The Drunkenness** explains that the RAM was maxed out.
  *   **The Final Sentence** admits that, technically, if the program doesn't execute, you aren't "using" the software, even if you own it.

  ### Summary of the Resolution

  1.  **Is it inconsistent?** No. Aristotle distinguishes between *dispositional* knowledge (which the akratic has) and *active* knowledge of the particular premise (which the akratic lacks during the act). The final sentence concedes that *active* knowledge of the good cannot be overcome, which Socrates would accept, but maintains that the akratic acts without that active knowledge, which saves the common-sense view that they act against what they "know" (dispositionally).
  2.  **Is the analogy independent?** No. It is the somatic/psychological explanation for the logical failure. It explains *how* one can possess a premise but fail to draw the conclusion.

  The "wrinkle" you feel is Aristotle acknowledging that Socrates wasn't *crazy*, just imprecise. Socrates was right about the power of active reason, but wrong about the complexity of human psychology. Aristotle keeps the logic, fixes the psychology.
