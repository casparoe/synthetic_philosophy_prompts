          *   *Analysis:* Jake is invoking an institutional definition of art (Dickie's Institutional Theory) but rejecting its authority. He thinks the label is arbitrary and functionally meaningless. He's arguing from *ontology* (what is the thing?) and *function* (what does it do?).
          *   *Verdict:* Partially right on the mechanism (museums do define art), but wrong on the implication (that this makes it *not* art). He's conflating "arbitrary" with "invalid."

      *   *Move 2 (Mei):* "By that logic, plays/symphonies aren't art. Performance is temporary. Refusal of record is the point (comment on photographable/resellable culture)."
          *   *Analysis:* Mei is arguing from *tradition* (performance art exists) and *intent* (the ephemerality is conceptual). She distinguishes between the *medium* (performance) and the *documentation* (photos/text).
          *   *Verdict:* Stronger argument historically. She correctly identifies that ephemerality doesn't disqualify art. She grasps the conceptual intent better than Jake.

      *   *Move 3 (Jake):* "They DO resell it for real money. 'Resisting commodification' is a story. They want credit for being above the market while being in the market."
          *   *Analysis:* Jake is attacking the *ethics/consistency* of the artist. He's pointing out the paradox of selling anti-commodification. This is a classic critique of the avant-garde (Boltanski/Chiapello).
          *   *Verdict:* Factually right about the money. Philosophically sharp about the contradiction. However, he assumes that *resisting* commodification requires *not selling*, which isn't necessarily true (you can sell a critique).

      *   *Move 4 (Mei):* "Not writing down isn't not selling. Site-specific installs get sold as contracts/rights. This is normal plumbing for non-object art."
          *   *Analysis:* Mei is arguing from *legal/art market precedent*. She normalizes the transaction. She separates the *concept* (no objects) from the *mechanism of sale* (rights/contracts).
          *   *Verdict:* Technically correct about art market mechanics. She defuses the hypocrisy charge by showing it's standard practice for this category.

  3.  **Evaluate "Who is Right?":**
