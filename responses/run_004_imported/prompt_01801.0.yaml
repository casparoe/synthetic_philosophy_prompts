answer: |-
  This is a classic debate in contemporary aesthetics, and you've stumbled into a argument that has been raging in art schools and philosophy departments for about 60 years. The artist is indeed **Tino Sehgal**, and the piece you saw is likely one of his "constructed situations" (like *This Progress* or *These Associations*).

  Your friends, Jake and Mei, are inadvertently reenacting a debate between **Institutional Critique** (Jake) and **Contextual/Conceptual Art Theory** (Mei). Neither is fully "right" in a factual sense, because art isn't a fact, but they are both hitting on valid philosophical pressure points.

  Here is the move-by-move breakdown of who is holding the stronger ground at each step, followed by what they are both missing and the answer to your big question.

  ### Move 1: The Definition of Art
  **Jake:** *"It doesn't count as art... 'the museum called it art' is basically like closing a bug ticket as 'working as intended'."*

  *   **Who is right?** Jake is **factually right** about the mechanism, but **philosophically weak** on the conclusion.
  *   **The Breakdown:** Jake has accidentally discovered **Institutional Theory of Art** (championed by philosopher George Dickie), which argues that art is simply "whatever the artworld confers status upon." Jake thinks this is a bug; the art world says it's a feature.
  *   **The Verdict:** Jake is right that the label is arbitrary. If MoMA buys a pile of bricks, it's art; if you put a pile of bricks on your lawn, it's debris. However, he is wrong to think that "arbitrary" means "meaningless." Language is arbitrary, too, but it still communicates. By dismissing the museum's authority as a "bug," he's refusing to engage with the rules of the game he's currently playing. He wants art to have an essential property (like beauty or craft), which hasn't been the primary definition since Duchamp put a urinal in a gallery in 1917.

  **Mei:** *"By that logic a play or a symphony isn't art either... the refusal to leave any record isn't a cop-out, it's the actual point."*

  *   **Who is right?** Mei is **stronger here**.
  *   **The Breakdown:** Mei correctly identifies that **ephemerality** (temporary existence) does not disqualify something from being art. We don't demand a recording of a jazz improvisation to validate it as art. She also correctly identifies the *conceptual intent*: Sehgal is critiquing the "image economy" (our addiction to documenting life rather than living it).
  *   **The Verdict:** Mei wins this round on art history. She understands that the *medium* of this work is human interaction and time, not canvas or stone. Jake is judging a time-based medium by the standards of object-based art.

  ### Move 2: The Hypocrisy of Sale
  **Jake:** *"They DO resell it, for real money... 'resisting commodification' is just a good story... they want credit for being above the market while being extremely, extremely in the market."*

  *   **Who is right?** Jake is **ethically sharp**, but **economically naive**.
  *   **The Breakdown:** Jake has hit on the central contradiction of the "Critical Art" industry. This is a valid critique known as **recuperation**: the market's ability to swallow its own critique and sell it back to you. If you sell a critique of capitalism, are you not participating in capitalism? Jake is right to smell hypocrisy.
  *   **The Verdict:** Jake is right that the *rhetoric* often outpaces the *reality*. However, he assumes that to critique the market, you must exist outside of it. That's practically impossible for a working artist. You can critique the food industry while eating food. The question is *how* you do it, not *if* you participate.

  **Mei:** *"Not writing something down isn't the same as not selling it... site-specific installs... get bought and sold as contracts or rights instead of objects."*

  *   **Who is right?** Mei is **technically correct**.
  *   **The Breakdown:** Mei understands the **legal ontology** of contemporary art. When a museum buys a Sehgal, they aren't buying a "thing." They are buying the *right to enact* the piece according to specific instructions. They are buying a certificate and a verbal agreement. This is standard for performance art, land art, and conceptual art.
  *   **The Verdict:** Mei wins on mechanics. She correctly points out that selling a "right to perform" is different than selling a commodity object (like a print you can mass-produce). The scarcity is enforced by the contract, not by physical rarity. Jake thinks the money invalidates the concept; Mei correctly notes that the money is just the plumbing that allows the concept to exist in a museum.

  ---

  ### What Both of Them Are Missing

  While they fought over money and definitions, they both missed the three most important aspects of what you actually experienced:

  **1. The Viewer is the Medium**
  Neither Jake nor Mei talked about *your* role. In a painting, you look at it. In a Sehgal piece, **you complete the work.** The "interpreter" speaks to *you*. Your awkwardness, your answers, your hesitation—that is the content. Jake calls it "customer service," but customer service is designed to solve a problem efficiently. Art is designed to create an experience, often inefficiently. If you felt weird, or thoughtful, or annoyed, the art *worked*. They are arguing about the container and ignoring the liquid.

  **2. The Distinction Between "Commodity" and "Capital"**
  Jake thinks selling = commodification. Mei thinks selling = necessary plumbing. Both miss that Sehgal is trying to separate **value** from **objecthood**. By refusing documentation (no photos, no catalogs), he makes the work impossible to resell on the secondary market in the traditional sense. You can't flip a Sehgal on eBay. The museum buys the *right to host*, not an asset to trade. It's a subtle distinction, but it matters. It limits the liquidity of the "asset," which is a genuine (if small) resistance to pure market speculation.

  **3. The "Script" vs. "Chat" Tension**
  You mentioned it felt "sometimes scripted, sometimes real." That ambiguity is the work. Jake dismisses it as "not real" because it's museum staff. Mei defends it as "performance." But the point is the **uncanny valley between the two.** It forces you to question: *When is a human interaction authentic? When is it transactional?* By blurring the line between a guard, an actor, and a friend, the piece makes you hyper-aware of how you treat strangers. Neither friend analyzed the *phenomenology* of the encounter.

  ---

  ### The Big Question: Is there a principled line, or is it just "whatever the artworld decides"?

  This is the million-dollar question (literally, in this case).

  If you look for a **principled line based on physical properties** (skill, beauty, permanence, objecthood), then **Jake is right:** there is no line. The line has dissolved. You cannot look at a Sehgal piece and distinguish it from hanging out in a lobby without knowing the context.

  However, if you look for a **principled line based on context and lineage**, then **Mei is right:** there is a line, but it's historical, not physical.

  **The "Artworld" isn't a Magic Spell**
  It's not *just* "whatever the museum says." If I walked into MoMA and started mopping the floor, it wouldn't be art. If a janitor does it, it's work. If an artist does it *with the intent of referencing the history of labor in institutional spaces*, and the institution recognizes that intent, it becomes art.

  The "line" is **Intentionality + Context + Recognition.**
  1.  **Intentionality:** The creator intends it to be engaged with as art (Sehgal definitely does).
  2.  **Context:** It is placed in a frame that asks to be looked at as art (The Museum).
  3.  **Recognition:** The "Artworld" (critics, historians, other artists) accepts it as part of an ongoing conversation (Sehgal is part of the lineage of Conceptual Art and Performance Art).

  **The Verdict on the "Line"**
  The line hasn't dissolved, but it has moved from the **object** to the **relationship**.
  *   **Old Art:** "Is this object beautiful/skillful?"
  *   **New Art:** "Does this situation generate a meaningful experience or critique within the context of art history?"

  Jake is frustrated because he wants the old definition. He wants the "bug ticket" to have a clear description of the bug. Mei is arguing that the software has been updated, and the "bug" is actually a feature of the new OS.

  **Who won the dinner?**
  Mei won the argument on **art theory and market mechanics.** She knows how the machine works.
  Jake won the argument on **moral intuition.** He is right to feel uneasy about wealthy institutions paying huge sums for "nothing" while claiming to resist wealth. That tension is real, and it shouldn't be smoothed over.

  But ultimately, **you** are the tiebreaker. If the piece made you think about it weeks later, argued about it at dinner, and questioned the nature of value and interaction... then the work succeeded. The fact that you are still thinking about it proves it wasn't just "customer service." Customer service ends when you leave the counter. Art follows you home.
