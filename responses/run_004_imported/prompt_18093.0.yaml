answer: |-
  Two Bayesians, Alice and Bob, are lying in bed after a long day.

  Alice turns to Bob. "Do you love me?"

  Bob thinks for a second. "80%."

  Alice frowns. "Well, knowing you, and knowing your priors on commitment... I'm only 70% sure you love me."

  Bob nods. "Okay. Given that you're only 70% sure, I have to update. My new posterior is 75%."

  "Then I update to 75%."

  "75%."

  "Common knowledge achieved," Alice says, rolling over. "Goodnight."

  Bob stares at the ceiling. "Wait."

  "What?"

  "We agreed on 75%," Bob says. "But I still haven't told you *why* I love you. And I don't know why you love me."

  "Does it matter?" Alice asks sleepily. "Your 70% was a sufficient statistic for your evidence. My 70% was a hash of my internal state. We exchanged the compressed data, decompressed it via Bayesian updating, and converged."

  "But I don't know if you love *me*," Bob says. "I only know that you love the *idea* of me with 75% probability."

  Alice sighs. "Bob, the theorem doesn't guarantee truth. It guarantees consensus. We are now perfectly, rationally aligned on our uncertainty."

  "That's romantic," Bob says.

  "I know," Alice replies. "I'm 75% sure."

  "Me too."
