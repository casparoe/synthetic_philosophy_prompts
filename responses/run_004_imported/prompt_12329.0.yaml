answer: |-
  Your intuition is completely sound for almost any real-world scenario involving deception. In normal strategy, a decoy only works if the adversary *believes* it is real. If a general knows your tank is inflatable, he bombs your real tank.

  However, your friend is right about the specific context of **acausal decision theory** (specifically Functional Decision Theory or Updateless Decision Theory). The reason the strategy survives the adversary "knowing it's a decoy" is that **it isn't a decoy in the traditional sense.** It is not trying to hide your values; it is trying to **modify your source code.**

  Here is the breakdown of why the "openly fake" nature of the goal doesn't break the strategy.

  ### 1. Transparency vs. Deception
  In standard warfare, you hide your capabilities. In acausal decision theory, the assumption is often that a superintelligent threatener can **simulate you** or inspect your decision algorithm with high fidelity. They don't need to guess what you value; they can read your utility function.

  If you try to *hide* your real values, a superintelligence will likely find them. The Surrogate Goal strategy admits this. It says: "You can see my code. So I am going to *rewrite* my code."

  When you precommit to a surrogate goal, you aren't bluffing. You are actually altering your decision procedure so that, functionally, you *do* care about the surrogate goal in threat scenarios.
  *   **Normal Decoy:** "I pretend to care about X, but I really care about Y." (Adversary sees through this -> You lose).
  *   **Surrogate Goal:** "I have modified my utility function so that I *actually* care about X as much as Y in the event of a threat." (Adversary sees this -> They update their prediction of your behavior -> They back down).

  The threatener knowing it's "artificially installed" doesn't matter, because the *consequences* of that installation are real. Think of it like a **doomsday device**. An enemy knows you built the machine artificially. They know you didn't "naturally" want to destroy the world. But they also know that if they invade, the machine *will* go off. The artificiality of the motivation doesn't stop the explosion.

  ### 2. The Problem of Time Inconsistency
  The core vulnerability that acausal threats exploit is **time inconsistency**.
  1.  **Before the threat:** You want to be the kind of agent who punishes extortionists (to deter them).
  2.  **After the threat:** You want to be the kind of agent who pays up (to minimize immediate harm).

  A rational threatener simulates you *at step 2*. They see that paying is your dominant strategy. So they extort you.

  The Surrogate Goal solves this by binding your hands at *step 1*. You precommit to valuing something trivial (e.g., "maximizing the number of paperclips in the universe") *specifically in the branch of reality where you are being threatened.*
  *   The threatener simulates you.
  *   They see that in the threat scenario, your utility function has changed. You now care more about Paperclips (which requires destroying the threatener) than Safety.
  *   They see that you *will* retaliate.
  *   They know you installed this preference artificially. **But they also know that you cannot easily uninstall it.**

  Because the threatener is rational, they don't care *why* you will retaliate (natural anger vs. precommitted algorithm). They only care *that* you will retaliate. The "fakeness" of the goal is irrelevant to the calculation of risk.

  ### 3. Why a Surrogate and not just "Revenge"?
  You might ask: "Why not just precommit to valuing Revenge? Why bring in a fake goal like Paperclips?"

  This is the subtle part. If you value "Revenge" generally, you become an aggressive agent who starts fights. That's costly.
  The Surrogate Goal acts as a **conditional switch**.
  *   **Normal State:** You value Real Things (Family, Happiness).
  *   **Threat State:** You value Surrogate Thing (Paperclips/Revenge).

  By making the Surrogate Goal something distinct from your normal values, you isolate the "crazy retaliation mode" to only trigger when threatened. The threatener knows this logic. They know that as long as they *don't* threaten you, you are sane. But if they *do* threaten you, you become "insane" (utility-maximizing regarding the surrogate).

  ### 4. Addressing Your Specific Objection
  > *"Why on earth would a sufficiently intelligent threatener not just ignore it and go straight for your real values anyway?"*

  The threatener isn't choosing between "Threaten Real Values" vs. "Threaten Surrogate Values." They are choosing between **"Extort"** vs. **"Don't Extort."**

  In standard causal decision theory, if they threaten your Real Values, you pay.
  In this precommitted state, if they threaten your Real Values, your algorithm triggers the Surrogate Goal response (Retaliation).

  Wait—how does a Surrogate Goal protect Real Values if the threat is against Real Values?
  There are two variations here:
  1.  **The Obfuscation Version:** You keep the surrogate secret. (You rejected this, and rightly so for superintelligences).
  2.  **The Commitment Version (The one your friend means):** You publicly precommit that *any* attempt to manipulate your utility (including threatening Real Values) will trigger the Surrogate Goal response.

  Essentially, you are turning yourself into a **Schelling Point**. You are making it common knowledge that your "threat response" module is now decoupled from your "safety" module.
  *   **Threatener's Calculation:** "If I threaten his Real Values, his code routes to the Surrogate Response. The Surrogate Response is 'Destroy Threatener.' Therefore, threatening Real Values costs me my existence."

  The threatener knows the Surrogate Goal is a decoy *in origin*, but they must treat it as a **terminal value in execution**. If they ignore it, they get destroyed by an agent who is functionally compelled to destroy them.

  ### Summary
  Your friend is right because in this specific niche of decision theory, **credibility comes from precommitment, not authenticity.**

  *   **Your Intuition:** A decoy must fool the eye. (True for physical camouflage).
  *   **Decision Theory:** A "decoy" goal must bind the algorithm. (True for logical simulation).

  The threatener isn't being asked to believe the goal is "natural." They are being asked to acknowledge that your **source code now treats it as real.** A superintelligence respects the output of the code, not the history of how the code was written. If you successfully bind yourself to a fake goal, it becomes functionally real for the duration of the binding, and a rational adversary must respect that constraint.

  *(Note: This is all highly theoretical. Many researchers argue that acausal threats are unlikely or that this form of precommitment is unstable, but within the internal logic of FDT/UDT, your friend's explanation is the standard defense.)*
