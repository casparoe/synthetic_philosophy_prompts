      *(Wait, one more check on Adam & Eve)*: Adam & Eve shows SSA implies you can reason that improbable events must happen to ensure you are among the first humans. In Fermi context: SSA could imply "I must be among the first civilizations" which implies future civilizations are unlikely (Doomsday). Wait, Doomsday is usually associated with SSA.
      *   *Doomsday Argument (SSA):* If total humans is huge, I am unlikely to be so early. So total humans is likely small. $\rightarrow$ Doom soon.
