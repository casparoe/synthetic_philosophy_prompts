answer: |-
  This is a fantastic seminar question. It cuts straight to the metaphysical and normative heart of comparative philosophy. It's tough enough to prevent easy answers but structured enough to keep students from floundering.

  Here is a breakdown of the philosophical terrain, an assessment of whether Role Ethics "earns its keep," and an analysis of the feminist objection, followed by some pedagogical suggestions for running the seminar.

  ---

  ### 1. Role Ethics vs. Virtue Ethics: Distinct Theory or Relabeling?

  To determine if Ames and Rosemont (A&R) are offering a genuine alternative or just a rebranding, we have to look at **ontology** versus **normativity**.

  **The Case for "Relabeling" (The Normative Overlap)**
  Critics like Bryan Van Norden or Stephen Angle argue that functionally, Role Ethics and Virtue Ethics look identical in practice.
  *   **Cultivation:** Both require *xiu shen* (self-cultivation).
  *   **Habituation:** Both rely on *li* (ritual/propriety) as a form of habituation similar to Aristotelian *ethos*.
  *   **Exemplars:** The *Junzi* functions almost exactly like the *Phronimos* (the person of practical wisdom).
  *   **Goal:** Both aim at a form of flourishing (*eudaimonia* / *dao*).

  If a student argues that A&R are just being terminologically purist to avoid Western imperialism, they have a point. If *ren* (humaneness) guides action just like "courage" or "temperance," calling it a "role" instead of a "virtue" might seem like splitting hairs.

  **The Case for "Distinct Theory" (The Ontological Shift)**
  This is where A&R earn their keep. Their argument isn't just about how to act; it's about **what exists.**
  *   **Substance vs. Event:** Aristotelian virtue ethics presupposes a discrete individual (a substance) who *possesses* virtues as attributes. A&R argue that in early Confucianism, there is no "bare self." There is only the "focus and field." You are not a noun; you are a verb. You are the sum of your interactions.
  *   **Universal vs. Particular:** Virtue ethics tends to abstract virtues (What is Courage *in general*?). Role ethics is radically particularistic. What it means to be a "father" here and now cannot be abstracted from this specific relationship.
  *   **Internal vs. Relational:** In virtue ethics, I can be virtuous even if isolated (the Stoic sage). In Role Ethics, morality is impossible in isolation. If you remove the roles, the moral agent ceases to exist.

  **Verdict:** It earns its keep **ontologically**, even if it overlaps **normatively**. It forces students to stop asking "What kind of person should I be?" (which implies a pre-existing 'I') and start asking "How do I optimize these relationships?" That is a genuine shift in ethical perspective, not just vocabulary.

  ### 2. The Feminist Critique: The Problem of Unjust Roles

  This is the strongest objection to Role Ethics, and your students should wrestle with it. If morality is *fulfilling* roles, and the roles are hierarchical/patriarchal, isn't the theory inherently conservative?

  **The Charge:**
  If a woman's role is defined by the "Three Obediences" (father, husband, son), Role Ethics seems to demand submission. Virtue Ethics might allow a woman to cultivate *ren* despite her role; Role Ethics says she *is* her role.

  **Resources for Defense (Can it survive?):**
  A&R and sympathetic Confucian feminists (like Li Chenyang or Robin Wang) offer three counter-moves:

  1.  **Roles are Creative, Not Scripted:** A&R emphasize that *li* (ritual/role) is aesthetic, not legalistic. Playing a role is like playing jazz. You have a structure, but you must improvise to fit the context. A "wife" in 2024 fulfills that role differently than in 200 BCE. The role evolves with the society.
  2.  **The Trump Card of *Yi* (Righteousness/Appropriateness):** *Yi* is the ability to judge what is appropriate in a specific situation. If a husband demands something that violates the broader harmony of the family or community, *yi* allows (or demands) the wife to resist. It's not blind obedience; it's "appropriate responsiveness."
  3.  **Reciprocity:** While the Husband/Wife relation is hierarchical in early texts, the Confucian model is fundamentally reciprocal. If the husband fails his role (protection, provision, respect), the wife is not bound to fulfill hers in the same way. The bond is severed by the failure of the other.

  **The Remaining Weakness:**
  Role Ethics struggles more than Virtue Ethics to critique the **structure** of the roles themselves.
  *   **Virtue Ethics:** Can say, "The role of 'slave' prevents the cultivation of virtue; therefore, slavery is wrong."
  *   **Role Ethics:** Has to say, "The role of 'slave' is not being performed harmoniously." It lacks a transcendent standard (like universal rights or human nature) to declare the role itself illegitimate. It can only argue that the role is no longer "appropriate" (*yi*) for the current context.

  **Verdict:** It can survive, but only if it accepts that roles are **dynamic**. If roles are static, the theory is indefensible. If roles are evolving narratives, the theory has the resources to critique oppression as "role failure" on the part of the dominator.

  ---

  ### 3. Seminar Pedagogical Tips

  Since you are prepping this for students, here are three ways to structure the discussion to avoid them getting stuck in the "East vs. West" binary.

  **A. The "Analects 13.18" Test**
  Give them the story of the Father Who Stole a Sheep.
  *   *Confucius:* The father covers for the son, the son covers for the father. "Uprightness" is found in this reciprocity.
  *   *Virtue Ethics reading:* This is about the virtue of loyalty/filial piety outweighing legalistic justice.
  *   *Role Ethics reading:* There is no "justice" abstracted from the relationship. To turn the father in is to destroy the self (which is constituted by that relationship).
  *   *Prompt:* Does Role Ethics explain this passage *better* than Virtue Ethics, or does it just excuse nepotism?

  **B. The "Vacuum" Thought Experiment**
  Ask the students: "Imagine a person raised by wolves, with no language, no family, no society."
  *   *Aristotle:* This is a "beast," below morality, but still a human substance with potential.
  *   *Ames/Rosemont:* This is not a moral agent at all. They are not a "person" (*ren*) in the Confucian sense.
  *   *Prompt:* Does this ontological claim hold water? Does it make Confucianism more humane (community-focused) or less (excluding the isolated)?

  **C. The Feminist Role-Play**
  Assign students to defend the "Wife" role using *only* Role Ethics resources (no appealing to universal rights).
  *   They must use *Yi* (appropriateness) and Reciprocity.
  *   *Goal:* Show them how hard it is to critique structural injustice without an external standard, but also how creative they can be with internal resources.

  ### Summary for your Prep
  *   **Is it distinct?** Yes, ontologically. It shifts the locus of morality from *character* to *relationship*.
  *   **Is it relabeling?** Normatively, often yes. Be wary of students who think the practical outcome is totally different.
  *   **Feminist Critique:** It survives only if roles are viewed as evolving performances, not static scripts. The danger is conservatism; the resource is *yi* (appropriateness).

  This is a solid question. It forces students to decide whether ethics is about **who we are** (Virtue) or **where we stand** (Role). Good luck with the seminar!
