prompt: |-
  Hey, I'm prepping a comparative ethics seminar and want to test a question on you before I inflict it on my students. Ames and Rosemont insist that Confucian "role ethics" isn't just Confucian-flavored virtue ethics -- for them the self just IS its web of family and social roles, not some independent substance that "has" virtues, and forcing the Analects into Aristotelian vocabulary distorts what's actually going on. Compare their role-ethics reading of early Confucianism with the more standard virtue-ethics interpretation (the one that treats ren, li, and the junzi as basically eudaimonism with different content) -- does role ethics earn its keep as a genuinely distinct theory, or is it mostly relabeling? And while your at it: can it survive the obvious feminist worry -- if morality just IS fulfilling your role, what resources are left to criticize a role (a wife's, say) that's unjust?
