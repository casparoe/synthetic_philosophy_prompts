prompt: |-
  So this happened a couple weeks ago and it's been bugging me ever since, especially since we just started a unit on group action in my philosophy of action class and my brain keeps snagging on it even though none of the readings are about anything remotely like this. Me and my friend Jess told our other friend Mia we'd both help her move apartments on Saturday — we literally just texted "ok yeah we're both coming, see you at 9" and left it at that, nothing formal, no actual promise or anything like that. Saturday morning I got offered a free ticket to something I'd wanted to go to for ages, so I texted Jess that I couldn't make it after all, figuring it'd be fine since her and a couple other people were still going and the move would get done either way.

  Jess ended up being way angrier about this than I expected, and it's the reason she gave that's stuck with me. She kept saying I "left her hanging" and that it wasn't really about whether Mia's move got done, it was about the fact that I didnt show up after we'd agreed we'd both be there. When I pointed out that literally no harm resulted since everything got sorted fine without me, that didn't seem to matter to her at all, which honestly kind of annoyed me back. So now I'm stuck on this: was Jess right to be that upset, or was she treating a totally casual, informal plan like it came with some kind of binding obligation it never actually had? I never "promised" her anything the way you'd promise to pay someone back money — we just both said we'd go — so where would the obligation even come from, if there is one? If there's actually something to her complaint I want to understand what it is exactly, because right now it just feels like a vibe rather than a real argument, and I'd like to know who's actually in the right here.
