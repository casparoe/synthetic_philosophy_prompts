answer: |-
  This is a fantastic real-world example of the exact problems debated in the **philosophy of action**, specifically regarding **shared agency** and **joint commitment**. It makes perfect sense that your brain is snagging on this; you are literally living through a case study for your current unit.

  You are framing the issue as a conflict between "formal promise vs. casual plan" and "harm done vs. no harm done." However, Jess is framing it through the lens of **interdependence** and **normative obligation**.

  Here is a breakdown of why Jess's reaction has philosophical weight, where the obligation comes from without a formal promise, and why your "no harm" argument doesn't quite land in this context.

  ### 1. The Source of Obligation: Joint Commitment
  You argue that you never made a "promise." In philosophy of action (think of theorists like **Margaret Gilbert** or **Michael Bratman**), there is a distinction between a *personal intention* and a *joint intention*.

  *   **Personal Intention:** "I intend to go to Mia's."
  *   **Joint Intention:** "We intend to go to Mia's."

  When you texted "we're both coming," you didn't just state your individual plan; you entered into a **joint commitment**. According to Gilbert, when two people form a joint commitment to do something, they create a "plural subject." You are no longer just two individuals acting in parallel; you are a single unit of agency.

  **The Obligation:** Once a joint commitment is formed, you cannot unilaterally rescind it. You don't need a blood oath or a contract. The obligation arises from the **mutual reliance** created by the agreement. By saying "we," you gave Jess permission to rely on you. When you bailed without Jess's consent, you violated the terms of that joint agency. You treated a "we" decision as an "I" decision.

  ### 2. The "No Harm" Argument (Consequentialism vs. Deontology)
  Your argument is purely **consequentialist**: *The outcome was fine (Mia moved), therefore the action was fine.*

  Jess's argument is **deontological** (duty-based) and **relational**: *The duty was to the partner, not just the task.*

  *   **The Physical Task:** Yes, the boxes got moved.
  *   **The Social Task:** Moving is physically taxing and emotionally stressful. When Jess agreed to help, she likely calculated the burden based on the premise that *you would be there to share it.*
  *   **The Harm:** The harm wasn't to Mia (the recipient of the action); the harm was to **Jess** (your co-agent). You changed the conditions of her labor without her consent. She signed up for a two-person job; she got stuck with a one-person workload. Even if she managed it, the *nature* of her Saturday changed from "collaborative effort" to "solo grind." That is a tangible harm to her experience, even if the boxes ended up in the truck.

  ### 3. "Leaving Her Hanging"
  In the literature on group action, this is often discussed regarding **reliance and vulnerability**.

  When we act together, we make ourselves vulnerable to each other. Jess made herself vulnerable to you by counting on your presence. "Leaving her hanging" isn't just an idiom; it describes a breakdown in the **meshing of sub-plans** (a term Bratman uses).

  *   **Jess's Sub-plan:** "I will lift the heavy stuff while OP holds the door/watches the boxes/grabs water."
  *   **Your Sub-plan:** "I will be there to support Jess."

  When you swapped your sub-plan for "I will go to a concert," you didn't just remove labor; you broke the mesh. Jess had to re-calculate her entire approach to the day in real-time. That cognitive and emotional load is the "harm" she is upset about.

  ### 4. Who is "Right"?
  In the context of your philosophy class, **Jess has the stronger philosophical argument regarding group action.**

  *   **You are right** that there was no formal contract and the consequentialist outcome was neutral.
  *   **Jess is right** that a normative obligation was created the moment you formed a joint intention ("we're both coming").

  The friction comes because you are viewing the agreement as **individual parallel action** (two people happening to go to the same place), while Jess views it as **shared agency** (two people constituting a team).

  ### How to Apply This to Your Class
  Since this is bugging you, use it. This scenario is gold for a paper or class discussion on:
  1.  **The formation of Shared Intention:** At what point does "I'm going" become "We're going"? (Your text message is the tipping point).
  2.  **The Normativity of Joint Commitment:** Why do we feel obligated to strangers or friends in group actions even without promises?
  3.  **Rescinding Commitment:** What constitutes a valid reason to break a joint commitment? (Is a free concert a "force majeure" or just a preference shift?)

  ### The Verdict
  Jess wasn't treating a casual plan like a binding contract; she was treating a **joint commitment** like a joint commitment.

  You aren't a bad person for wanting to go to the event, but philosophically, you treated a *group agent* (You+Jess) as an *individual agent* (You). To do that ethically, you would have needed to reopen the negotiation ("Hey, something came up, are you okay if I bail?") rather than making a unilateral decision.

  The obligation comes from the **expectation of stability** you created in Jess's mind. By removing your stability, you forced her to absorb the risk you two were supposed to share. That is why she's upset, and that is why it feels like more than just a "vibe."
