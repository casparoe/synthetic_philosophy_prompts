answer: |-
  This is a formidable question that cuts to the heart of the relationship between historical metaethics and contemporary semantic theory. To reconstruct Hume's response to Geach, we must resist the temptation to simply anachronistically dress him in Blackburn's quasi-realist suit. Instead, we must look for the structural resources within Hume's own moral psychology that could plausibly stabilize moral language enough to sustain inference, even if Hume himself lacked the logical vocabulary to describe *why* it works.

  Here is the reconstruction of Hume's most plausible defense, the specific concept required to carry the weight, and the point at which the reconstruction inevitably fractures.

  ### The Reconstruction: The General Point of View as Semantic Stabilizer

  If Hume were confronted with the Frege–Geach problem, his most robust line of defense would not rest on his distinction between reason and passion (which creates the problem) but on his mechanism for correcting sentiment: **The General Point of View (GPV).**

  In *Treatise* 3.3.1 and the *Enquiry*, Hume acknowledges that raw sentiments are fluctuating, subjective, and dependent on proximity. If "wrong" merely meant "I feel disapproval right now," embedding would indeed be impossible, as the sentiment might not exist in the unasserted context. However, Hume argues that we do not speak from our raw, variable perspective. We correct our sentiments by adopting the GPV—we consider the tendency of a character trait to cause pleasure or pain to those in the agent's "narrow circle," disregarding our own temporal and spatial distance.

  **The Humean Move:**
  Hume can argue that moral vocabulary does not report *occurrent* feelings (which would be vulnerable to Geach) but rather expresses a **stable, corrected disposition** to feel.
  *   **Asserted:** "Cruelty is wrong" expresses a settled sentiment of disapproval derived from the GPV.
  *   **Unasserted:** "If cruelty is wrong..." refers to the *condition* of that settled sentiment obtaining.

  On this reading, the GPV functions as a semantic stabilizer. It transforms morality from a report of private qualia (which cannot be embedded) into a claim about a **standardized human response**. Because the GPV is intersubjective and stable (grounded in constant principles of human nature), the term "wrong" picks out a consistent relation between a character trait and the standard human sentiment. This consistency allows the term to function univocally across asserted and unasserted contexts, much like a secondary quality concept (e.g., "red" means "disposed to cause red-experiences in standard observers").

  Thus, the validity of the modus ponens is preserved not because moral terms track mind-independent facts, but because the **conventions of language**, stabilized by the GPV, require us to treat these sentiments *as if* they were properties for the sake of communication and social coordination. Hume explicitly notes that we speak of virtue as if it were real in the object, because language is designed for general use. The "validity" of the inference is thus a feature of the linguistic convention necessitated by the GPV, not a feature of the sentiments themselves.

  ### The Breaking Point: The Collapse of Logic into Psychology

  While the GPV provides a pragmatic explanation for why moral language *looks* propositional, this reconstruction strains and ultimately breaks down when pressed on the **normativity of logical validity**. There are two specific points of failure where Hume's apparatus cannot meet Geach's challenge.

  **1. The Lack of a Force/Content Distinction**
  The Frege–Geach problem relies on the distinction between the *content* of a judgment (the proposition) and the *force* (assertion, questioning, conditioning). Hume has no such distinction. For Hume, a judgment *is* a perception (an impression or idea).
  *   In the premise "Cruelty is wrong," the mind has an impression of disapproval.
  *   In the conditional "If cruelty is wrong...," the mind is *not* having that impression.
  *   **The Breakdown:** Hume cannot explain what the mind is doing in the antecedent of the conditional. If moral judgments are impressions, and I am not currently having the impression, the antecedent is empty. Hume might say it is an *idea* of the impression, but ideas for Hume are faint copies. Logical validity requires that the content remain identical, not that it shift from a vivid impression to a faint idea. Hume's psychology cannot account for the *unasserted retention of content* because his ontology of mind is built on the presence or absence of perceptions, not on abstract propositions that can be entertained without being endorsed.

  **2. The Reduction of Validity to Custom**
  Hume's theory of inference is fundamentally psychological. Deductive validity (relations of ideas) is certain, but all matters of fact (including morality, on some readings) rely on custom and habit.
  *   If the reconstruction above holds, the "validity" of the moral syllogism is not logical necessity but **psychological compulsion**. We move from the premise to the conclusion because sympathy and custom habituate us to do so.
  *   **The Breakdown:** Geach's challenge is about *logical* validity (truth-preservation), not *causal* inference. Hume can explain why we *do* infer the conclusion, but he cannot explain why we *ought* to, or why the inference is valid independent of our psychological makeup. If a sociopath lacked the sentiment of humanity, the "validity" of the moral syllogism would vanish for them. For Hume, logic in the moral realm collapses into a description of how normal human psychology operates. He cannot account for the **normative force of logic** itself. He can explain the *genesis* of the belief that the inference is valid, but not the *justification* of its validity.

  ### Conclusion

  Hume's best resource is the **General Point of View**, which allows him to argue that moral terms function *as if* they denote stable properties, thereby permitting the linguistic embedding required for complex sentences. This anticipates the quasi-realist strategy of treating moral discourse as a autonomous practice grounded in sentiment.

  However, the reconstruction breaks down because Hume lacks a **semantics of propositions**. He cannot distinguish the *content* of "Cruelty is wrong" from the *act* of disapproving. Consequently, he is forced to reduce logical validity to psychological consistency. He can explain why the inference feels compelling to a sympathetic observer, but he cannot explain why it is logically valid in a way that binds any rational agent regardless of their sentimental constitution. In the end, Hume is indeed exposed: he provides the genealogy of moral language, but he lacks the logical tools to defend its syntax against Geach's challenge. He is the ancestor of expressivism, but he died before the family learned to speak logic.
