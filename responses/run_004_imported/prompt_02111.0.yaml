  Isaac Newton privately calculated 2060 as the exact year the world would end, arriving at the figure through numerological analysis of the books of Daniel and Revelation and apparently setting aside the empirical caution that defined his physics. Doesn't this episode show that even a mind as rigorous as his could lapse into irrational pseudoscience once religious conviction entered the picture?
