      *   **Part 1: The Backstory (The "Constitutional Coup"):** Detail the 1972 crisis, the Congressional Vote (legal), the Dissolution (illegal/ambiguous), the Plebiscite (mixed legitimacy).
      *   **Part 2: The Thomist Analysis:** Break down *De Regno* and *Summa*.
          *   Criterion 1: Origin of Power (Title).
          *   Criterion 2: Use of Power (Exercise).
          *   Criterion 3: Recourse to Public Authority.
          *   Criterion 4: The Danger of Worse Tyranny.
      *   **Part 3: Osvaldo's Internal Conflict:** How this plays in the scene. He can't just say "No." He has to say "It depends on X, and we don't know X."
      *   **Part 4: Historical Parallels:** (Optional but helpful) Velasco Alvarado (Peru), Banzer (Bolivia), Pinochet (Chile - though he was clearer usurper). Let's stick to the theoretical.

  8.  **Review against Constraints:**
