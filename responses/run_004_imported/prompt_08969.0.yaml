  9.  **Final Polish:** Ensure tone is respectful of the user's scholarship. They know their stuff; don't patronize. Focus on the *application* of the theory to the plot. (Self-Correction: Make sure to emphasize that for Aquinas, even a usurper shouldn't be killed if it leads to greater chaos. Osvaldo needs to worry about the *consequences* as much as the *right*.)

  10. **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  Your housemate is wrong: if Osvaldo is a Jesuit seminarian, his intellectual formation is the bedrock of his character. If his Thomism is cartoonish, *he* becomes cartoonish. You are right to dig in. The distinction you recall is accurate: Aquinas distinguishes between the **tyrant by defect of title** (*tyrannus ex defectu tituli* — the usurper) and the **tyrant by exercise of power** (*tyrannus ex parte exercitii* — the legitimate ruler who governs badly).

  In *De Regno* (On Kingship) and the *Summa Theologiae* (II-II, Q. 42, a. 2; Q. 64, a. 3), Aquinas is indeed more permissive regarding the usurper (though still cautious), but he is extremely restrictive regarding the legitimate ruler. For the latter, he insists that deposition must come from **public authority**, not private presumption, to avoid the greater evil of scandal and instability (citing the assassination of Caesar leading to Augustus).

  To make Osvaldo sweat, General Ibarra cannot be a clear-cut Pinochet (pure usurper) nor a clear-cut elected president who suspends the constitution (pure legitimate-turned-tyrant). You need a **Conditional Mandate**.

  Here is a sketch of Ibarra's rise and tenure designed to break Aquinas's binary, followed by the specific Thomist criteria Osvaldo would be wrestling with.

  ### Part 1: The Backstory of General Ibarra (The "Constitutional Coup")

  **The Crisis (1972):**
  Ten years ago, the country was on the brink of civil war. A leftist insurgency was burning coffee plantations; the civilian President was incapacitated by a stroke; the Vice President had fled. The country was leaderless.

  **The Legal Patch (The "Vote of Confidence"):**
  Ibarra was the Army Chief of Staff. He did *not* march on the palace. Instead, the rump of the Congress (those who hadn't fled) invoked an obscure emergency clause in the 1950 Constitution. They voted to grant "Provisional Executive Powers" to Ibarra for **exactly 18 months**.
  *   **The Condition:** His mandate was explicitly to "pacify the territory and convene new elections."
  *   **The Legitimacy:** This was a legal transfer of power by a legitimate legislative body. Technically, Ibarra started as a legitimate ruler.

  **The Turn (1974):**
  The 18 months expired. The insurgency was crushed. But Ibarra did not call elections. Instead, he declared that Congress had become "infiltrated by subversives" and dissolved it. He argued that the *spirit* of the emergency mandate (national survival) superseded the *letter* (18 months).
  *   **The Usurpation:** He seized legislative power for himself.
  *   **The Ratification:** Two years later (1976), he held a plebiscite. 70% voted "Yes" to confirm his presidency. However, voting was not secret, and the military monitored the booths.

  **The Current Situation (1982):**
  Ibarra rules by decree. He has built roads and stabilized the economy (common good), but he tortures dissidents and forbids opposition parties (tyranny). He claims he is the "Constitutional President" confirmed by the 1976 vote. The opposition claims he is a usurper who voided his title in 1974.

  ### Part 2: The Thomist Analysis (Why Osvaldo is Stuck)

  This backstory creates a genuine "hard case" because it muddies the water between *defect of title* and *exercise of power*. Here is how Osvaldo would break it down using Aquinas's actual criteria.

  #### 1. The Question of Title (*Ex Defectu Tituli*)
  *   **The Argument for Usurpation:** Aquinas says a usurper is one who seizes power without consent. Osvaldo can argue that Ibarra's title expired in 1974. By dissolving Congress, Ibarra severed the legal chain of command. The 1976 plebiscite was coerced (voting under guns), so it does not constitute true consent. Therefore, Ibarra is currently holding power without right.
      *   *Thomist Implication:* If he is a usurper, private citizens *may* act if there is no recourse to a superior.
  *   **The Argument for Legitimacy:** Ibarra was appointed legally by Congress. The 1976 plebiscite, however flawed, represents a form of popular consent. In Thomistic terms, the "community" has tacitly accepted his rule for six years. He holds the *office*, even if he abuses it.
      *   *Thomist Implication:* If he holds the office, he is a tyrant by *exercise*. Private assassination is forbidden. Only "public authority" can remove him.

  #### 2. The Question of Public Authority (*Auctoritate Publica*)
  This is the crux of Osvaldo's crisis. Aquinas is adamant: *"To proceed against the cruelty of tyrants is an affair to be undertaken not by private authority, but by public authority."* (*De Regno*, I, 6).

  *   **The Problem:** Who is the "public authority" in 1982?
      *   **Congress?** Dissolved.
      *   **The Courts?** Packed with Ibarra's loyalists.
      *   **The People?** Aquinas generally views "the people" as a mob if not organized into a body.
      *   **The Military High Command?** This is your plot's key tension. In Latin American *caudillismo*, the Army often views itself as the "ultimate guardian of the Constitution."
  *   **Osvaldo's Dilemma:** If the plotting group includes active-duty officers, can *they* count as "public authority"?
      *   **Aquinas's Warning:** Aquinas warns that if private men decide who is a tyrant, every faction will kill their rivals. However, if the Army High Command acts *corporately* as the state's remaining organ, does that satisfy the "public authority" requirement?
      *   **The Ambiguity:** If the plot is a small cell (private), it's murder. If the plot is the Joint Chiefs (public), it's deposition. Osvaldo doesn't know if his friends have the backing of the Chiefs or if they are rogue.

  #### 3. The Danger of Worse Tyranny (*Periculum Scandali*)
  In *De Regno*, Aquinas argues that even if killing a tyrant is permissible, one must consider the consequences. He cites Caesar: the conspirators killed a tyrant, but the aftermath (Augustus) was worse.

  *   **Ibarra's Stability:** Ibarra has ended the civil war. The economy is working.
  *   **The Vacuum:** If Ibarra dies, who takes over?
      *   If the plotters are ideologues, will they spark a civil war worse than the 1970s insurgency?
      *   If the hardline faction of the Army takes over, will they be more brutal than Ibarra?
  *   **Osvaldo's Burden:** Osvaldo isn't just asking "Is this legal?" He is asking "Is this prudent?" Aquinas places a heavy burden on the *outcome*. If the assassination leads to anarchy, Osvaldo bears moral responsibility for the blood spilled in the chaos.

  ### Part 3: How to Write the Scene

  Don't have Osvaldo say, "Aquinas says no." Have him say, "Aquinas says it depends on *who we are*."

  **Sample Dialogue Beat:**

  > "You're treating Ibarra like a bandit in the road, Mateo," Osvaldo said, stirring his coffee. "A bandit has no claim. You kill him to stop the robbery. But Ibarra wasn't a bandit. Congress gave him the keys. He locked the doors from the inside, yes, but he started with the keys."
  >
  > "He voided the contract when he dissolved Congress," Mateo snapped. "He's a usurper now."
  >
  > "Maybe. But Aquinas asks: who holds the sword of justice? If it's just us, three men in a basement, we are not justice. We are vengeance. And vengeance breeds more vengeance." Osvaldo looked up. "Unless... unless the Army itself turns. If the High Command declares him void, then they are the public authority. Then it is not assassination. It is execution. But are they turning? Or are we just pretending they will, so we can sleep at night?"

  ### Why This Works for Your Novel

  1.  **It respects the History:** This mirrors real regimes (like Velasco in Peru or even aspects of Perón), where legalism was manipulated rather than discarded.
  2.  **It respects the Theology:** It uses the specific *Defectus Tituli* vs. *Exercise* distinction and the *Public Authority* requirement.
  3.  **It creates Plot Tension:** Osvaldo isn't just a brake on the action; he's a diagnostician. He forces the group to clarify their own status. Are they a lynch mob, or are they a provisional government in waiting?
  4.  **It deepens Osvaldo:** He isn't a coward hiding behind dogma. He is terrified of the *sin* of disorder. He knows that killing a tyrant is easy; killing him without birthing a monster is hard.

  This setup ensures that when Osvaldo finally makes his choice (to bless the plan or betray it), it is a genuine tragedy of conscience, not a theology quiz.
