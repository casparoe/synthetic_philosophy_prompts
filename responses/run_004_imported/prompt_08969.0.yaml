      *   **Plot:** A group plotting to assassinate a General (Ibarra) who has ruled for a decade.
      *   **Character:** Osvaldo, a former Jesuit seminarian, well-versed in Aquinas.
      *   **Constraint:** Osvaldo's reasoning must be accurate to Aquinas (specifically regarding tyrannicide), not pop summaries.
      *   **Key Thomist Distinction:** Usurper (no legitimate claim, can be resisted privately) vs. Legitimate Ruler turned Tyrant (requires public authority/community action, private assassination is generally forbidden).
      *   **The Problem:** The General's backstory needs to be a *hard case* (ambiguous), not clearly one or the other, to create genuine moral tension for Osvaldo.
      *   **Goal:** Sketch Ibarra's rise to power and rule, then explain *why* it's ambiguous according to Aquinas's criteria.

  2.  **Deconstruct Aquinas on Tyranny (The Theoretical Framework):**
      *   *Sources:* *De Regno (On Kingship)*, *Summa Theologiae* (II-II, Q. 42, Q. 64), *Commentary on the Sentences*.
      *   *Key Distinction:*
          1.  **Usurper (Tyrant by defect of title):** Seized power without right. Aquinas is more permissive here. Private individuals *might* act if no public recourse exists, though he still cautions against it if it causes greater scandal/disorder.
          2.  **Legitimate Ruler turned Tyrant (Tyrant by exercise of power):** Came to power rightly but rules badly. Aquinas is very strict. Private assassination is murder. Only "public authority" can depose him.
      *   *The "Public Authority" Loophole:* Who constitutes the "public authority" in a dictatorship? The army? The congress (if dissolved)? The people? This is where the ambiguity lies.
      *   *The "Greater Evil" Caution:* Even if tyrannicide is permissible, does it lead to worse tyranny? (Aquinas cites the assassination of Julius Caesar leading to Augustus).

  3.  **Brainstorming Ibarra's Backstory (The "Hard Case"):**
      *   *Option A: Clear Usurper.* He shoots the president and takes over. -> *Too easy.* Osvaldo says "Kill him."
      *   *Option B: Clear Legitimate.* He is elected, then goes bad. -> *Too easy.* Osvaldo says "Wait for public authority."
      *   *Option C: The Ambiguous Middle.* He enters legally but suspends legality, or he intervenes during a crisis with mixed mandate.
      *   *Idea:* A "Constitutional Coup." He was invited in by a legitimate body (making him semi-legitimate) but exceeded his mandate (making him a usurper of the *office* he was supposed to protect).
      *   *Specific Scenario:* The "Interim Savior."
          *   Pre-Ibarra: Civil war or chaos.
          *   The Transition: A junta or a dying president asks the Army Chief (Ibarra) to "restore order" temporarily.
          *   The Legal Patch: A "State of Exception" ratified by a rump legislature or a plebiscite under duress.
          *   The Tenure: He promises elections but delays them citing "ongoing subversion."
      *   *Why it's ambiguous:* Did he usurp? Or was the emergency power granted legitimately, and he is just abusing it (tyrant by exercise)? If the grant was conditional and he broke the conditions, does he revert to usurper status?

  4.  **Developing the Specific Backstory (Drafting the Narrative):**
      *   *Country Name:* Let's keep it generic or use the user's implied setting (Latin American, early 80s). Let's call it "San Cristobal" or similar, but better to stick to the user's "invented country." I'll focus on the mechanics.
      *   *The Event:* 10 years ago (early 70s). Leftist insurgency + economic collapse.
      *   *The Legitimate Authority:* A civilian President + Congress.
      *   *The Handover:* President resigns/flees. Congress votes "Emergency Powers" to the Army Commander (Ibarra) for 12 months to "pacify and restore constitutional order."
      *   *The Twist:* Ibarra dissolves Congress *after* the insurgency is crushed, claiming they are "obstructing reconstruction."
      *   *The Ratification:* A referendum 2 years later. High turnout, but military oversight.
      *   *Current Status:* 1982. Still no elections. "Permanent State of Siege."

  5.  **Mapping to Aquinas's Criteria (The Analysis):**
      *   *Defect of Title (Usurper):* Argument: The grant of power was conditional (12 months, restore order). By dissolving Congress and staying, he voided the title. He is now holding power without consent.
      *   *Exercise of Power (Legitimate turned Bad):* Argument: The initial grant was legal. The referendum gave popular consent (even if coerced). He holds the *office* legally, even if he rules badly. Therefore, private assassination is forbidden.
      *   *Public Authority:* Who can depose him? The Congress he dissolved? The Army (his own peers)? The People? Aquinas says "public authority." If the Army is the *de facto* state, can a faction of the Army act as public authority?
      *   *Scandal/Consequences:* If Osvaldo blesses it, does it invite anarchy? If he forbids it, does he enable evil?

  6.  **Refining the Thomist Nuance (Addressing the User's specific knowledge):**
      *   User mentioned *De Regno* vs. *Sentences*. In *De Regno*, Aquinas is more political/pragmatic. In *Sentences*, more theological.
      *   Key point: Aquinas worries about the *precedent*. If private men kill rulers, stability dies.
      *   Key point: The definition of "Public Authority." In a vacuum, does it revert to the people? (Salamanca school later expands this, but stick to Aquinas). Aquinas suggests recourse to a "superior" (Emperor/Pope). In a sovereign nation, who is the superior? The Constitution? The People?
      *   *The Crux for Osvaldo:* Is Ibarra a *tyrannus ex defectu tituli* (usurper) or *tyrannus ex parte exercitii* (abuser)?
