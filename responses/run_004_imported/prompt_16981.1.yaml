      *   *Crucial Point:* If she reverses entropy, she effectively becomes antimatter (Feynman-Stueckelberg interpretation). Maybe too much? Let's stick to Thermodynamics.
      *   *Key Insight:* If she is reversed, she cannot interact with the outside *while* reversed. Interaction implies exchange of particles/energy, which requires a shared arrow of time. The chamber must be perfectly isolated.

  9.  **Final Polish:** Ensure the tone is encouraging but rigorous. Provide specific "plot holes" to patch. (e.g., The Air Problem, The Light Problem, The Memory Problem).

  **(Self-Correction Note):** I need to be careful not to say "This is impossible." In fiction, nothing is impossible. The goal is *internal consistency*. The advice should be "Here is how to make it consistent."

