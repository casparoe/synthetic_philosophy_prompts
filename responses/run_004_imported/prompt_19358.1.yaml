      *   **Simon's Satisficing (The Baseline):**
          *   Focus on *procedural* rationality vs. *substantive* rationality.
          *   Key point: Satisficing is derivative. It is optimal *search behavior* given constraints. If constraints vanish, Simon's agent optimizes.
          *   Metaphor: "Cutting costs."

      *   **Slote's Satisficing (The Departure):**
          *   Focus on *normative* status.
          *   Key point: Satisficing is fundamental. Even with perfect info and zero computational cost, maximizing is not required.
          *   Metaphor: "Redefining success."

      *   **The "Obsessiveness" Objection & The Cost Smuggling Charge:**
          *   This is the meat of the response.
