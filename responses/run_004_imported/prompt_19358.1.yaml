      *   *Check:* Did I represent Slote correctly? Slote is a consequentialist. He wants to save consequentialism from the "overdemandingness" objection.
      *   *Check:* The "Obsessiveness" point. Slote argues that a disposition to maximize is a vice. Is avoiding a vice a "cost"? In virtue ethics, no. In decision theory, yes (utility loss). Slote is mixing frameworks. I need to highlight this category error.
      *   *Refinement:* The advisor's point is that Slote is doing "stealth Simon." I need to evaluate if that's fair. It is fair *if* Slote's justification relies on the *burden* of maximizing. It is unfair *if* Slote's justification relies on the *irrelevance* of maximizing to moral worth. Slote does both. I should point this tension out.

