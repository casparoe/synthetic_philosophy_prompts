answer: |-
  The lights in Aviva Korman's chambers were dimmed to a single pool over her desk, but the city outside the tall windows was still bright enough to cast a grid of reflection on the mahogany. Daniel Petrosky stood by the bookshelf, holding a tumbler of scotch she'd poured him. He hadn't taken a sip.

  "Ellis isn't going to move," Petrosky said. He set the glass down on a stack of briefs. "She thinks the confession was clean. She's written her concurrence in her head already."

  "I know," Korman said. She was sitting, leaning back, a yellow notepad balanced on her knee. "Which leaves us. You and me. We agree the *Edwards* rule was violated. We agree the admission was error."

  "We agree on the premise," Petrosky corrected. "I don't agree on the conclusion. I voted to affirm."

  "Because you found the error harmless. But Ellis didn't. Ellis said if there were error, it wasn't harmless. So look at the board, Daniel. On the question of error, the majority is you and me. On the question of harmlessness, the majority is me and Ellis. If we tally the issues, the logic compels reversal. Two-to-one on error, two-to-one on harm. The math is clean."

  "The math is clean," Petrosky said, walking over to the desk. He leaned against the edge, looming slightly. "The result is a lie. If we vote issue-by-issue, we reverse a conviction that two members of this panel think should stand. I think he stays in prison. Ellis thinks he stays in prison. Only you think he walks. So why should the judgment of the Fourteenth Circuit be the opinion of a single judge?"

  "Because the judgment of the Circuit isn't a plebiscite on what we feel like doing. It's an application of the law. The Supreme Court gave us a test. Prong one: constitutional error? Prong two: harmless beyond a reasonable doubt? We are sworn to apply the test, not skip to the bottom line and work backward."

  "We aren't law clerks grading an exam," Petrosky snapped. "We're a court. Our product is judgments, not logic puzzles. If the majority of the judges appointed to this bench believe the defendant should remain convicted, then the defendant should remain convicted. Anything else is ghostwriting. We'd be issuing a reversal that no majority actually supports."

  Korman capped her pen. "And if we vote on the disposition directly, we bury the law. We tell the district courts, 'Yes, there was error, and yes, it was harmful, but we're affirming anyway because two of us wanted to.' That doesn't guide anyone. It tells the district judges that the rules don't matter, only the headcount. It turns precedent into smoke."

  "It turns the court into a honest broker," Petrosky countered. "Look, Aviva, let's not pretend the procedure is neutral here. I know that if we go issue-by-issue, you get your reversal. I know that if I push for outcome voting, I get my affirmance. I'm not blind to the convenience."

  "Nor am I," Korman said, her voice steady. "But the convenience doesn't make the principle wrong. If I thought issue-by-issue voting led to affirmance, I'd still argue for it. Because Webb isn't the only one here. There's the next guy. And the guy after him. If we don't bind ourselves to the reasoning, if we allow the outcome to trump the premises, we're telling every judge in this circuit that they can ignore the prongs of the test as long as they gather enough votes for the result they want. That erodes the rule of law."

  Petrosky picked up his glass finally, swirled the amber liquid. "And I'd argue for outcome voting even if it sent your man home. Because legitimacy matters. What happens when the public reads this? 'The court finds error. The court finds harm. The court affirms.' They'll think we're cowards. Or worse, politicians. They'll think we're hiding behind a spreadsheet to avoid taking responsibility for putting a man back in prison. If two judges believe he belongs in prison, let them own it. Let the opinion say, 'We affirm because a majority of this panel believes the conviction is safe,' not 'We affirm because of a mathematical accident.'"

  "It's not an accident," Korman said, standing up. She walked to the window, looking out at the grid of lights. "It's structure. The structure exists to protect people like Webb from exactly this kind of aggregation. If we vote on the outcome, we allow a coalition of minorities to control the result. Ellis thinks there's no error. I think there's harm. You think it's harmless. If we just count outcomes, Ellis and you form a majority to affirm. But you don't agree on *why*. You don't share a rationale. There is no majority reasoning. There's only a majority result. An opinion built on that is a hollow shell."

  "So write a hollow shell," Petrosky said. "Or don't write an opinion at all. Just issue the judgment. But don't pretend the logic holds water when the majority of the judges on this panel think the man should stay locked up."

  Korman turned back to him. "Webb has been in custody three years, Daniel. Three years on a confession he shouldn't have given. If the law says that's error, and the law says that error matters, then he goes home. It shouldn't matter that Ellis disagrees on the first prong. She conceded the second. You conceded the first. Together, the court has found the violation. To deny him relief because we can't align our reasons is to prioritize our own comfort over his liberty."

  "And to grant him relief," Petrosky said, pushing off the desk, "is to prioritize your theory of coherence over the actual votes of your colleagues. I'm not comfortable with it, Aviva. I think it's dishonest. I think it makes us look like we're playing with logic gates while a human being rots. I'd rather be honest about the disagreement. 'Judge Korman wants to reverse. Judges Ellis and Petrosky vote to affirm.' That's the truth. Why dress it up as a unified doctrinal finding when it's not?"

  "Because we aren't a legislature," Korman said. "We don't compromise on truth to find a majority. We find the law, and the law dictates the result. If the law dictates reversal based on the majority findings on the issues, then reversal is the only lawful outcome. Anything else is discretion masquerading as judgment."

  Petrosky finished his scotch in one swallow and set the glass down hard. "We'll see what the Chief thinks about assigning the opinion. If I write the affirmance, I'll vote on the disposition. If you write the reversal, you'll vote on the issues. And then we'll see which one survives en banc."

  "Let it go en banc," Korman said. "Let the whole court decide how we decide. But don't ask me to sign an opinion that says the conviction is safe when the majority of this panel has found it poisoned."

  "And don't ask me to sign an order freeing a man when the majority of this panel believes he belongs in prison."

  They stood there for a moment, the space between them charged with the weight of the unseen man in the cell, the man who was currently nothing more than a variable in their paradox.

  "I'll have the draft on your desk by morning," Korman said.

  "I'll have my dissent ready," Petrosky replied.

  He walked to the door, hand on the knob. He didn't look back. "Good night, Aviva."

  "Good night, Daniel."

  The door clicked shut. Korman stood alone in the pool of light, looking down at the notepad. She drew a line through the word *Affirm* and wrote *Reverse* beneath it, then paused, pen hovering, knowing the paper wouldn't make the choice for her.
