      *   *Decision:* I will lean towards **Contextualism** (or a pragmatic approach) for the *social* argument, but acknowledge **Epistemicism** as the logically consistent winner if forced to choose a semantic theory. However, for the specific question of "which handles higher-order vagueness best," Epistemicism actually handles it by denying it, whereas Supervaluationism struggles.
