      *   *The Verdict:* Epistemicism is more consistent on higher-order vagueness (by biting the bullet). Supervaluationism tries to avoid it but often fails.
      *   *Alternative:* Contextualism. This fits the "flakiness" debate best. The standard changes as you talk.
