answer: |-
  **Setting:** *A quiet university office, late evening. Rain taps against the window. Elias (Causal Decision Theorist) sits in a worn leather chair. Mara (Updateless Decision Theorist) stands by the whiteboard, marker in hand.*

  **Elias:** So, the digit is zero. The Predictor is at the door asking for a hundred bucks. And you're telling me I should hand it over.

  **Mara:** Yes.

  **Elias:** Mara, this isn't Newcomb's Problem. It isn't even the standard Counterfactual Mugging with a coin flip. A coin has two physical outcomes. This is the googol-th binary digit of Pi. It is a fixed, necessary truth. It was never going to be anything else. The branch where it's a one doesn't just lack causal connection to me; it lacks *existence*. It's a logical contradiction.

  **Mara:** It lacks existence in the territory, Elias. But it exists in the map. And decision theory is about navigating the map.

  **Elias:** That sounds poetic, but let's look at the mechanics. CDT asks: "Given the current state of the world, which action maximizes utility?" The current state includes the fact that Digit = 0. In this state, paying yields negative one hundred dollars. Not paying yields zero. The million dollars is in a world that is mathematically incoherent. I cannot causally influence a contradiction. To say I "could have" gotten the million is like saying I could have squared the circle.

  **Mara:** You're conflating the *truth* of the digit with the *computation* of your decision. The Predictor didn't wait for you to check Pi. It simulated *you*. It ran your source code against the input "Digit = 0" and "Digit = 1".

  **Elias:** But I'm not source code. I'm a physical agent at a specific time. And right now, the input is "Digit = 0." The simulation for "Digit = 1" is evaluating my behavior in an impossible world. Why should my actual, physical wallet suffer because of a ghost in a logically impossible machine?

  **Mara:** Because *you* are the same algorithm in both cases. That's the crux. If you say, "I won't pay because the digit is actually 0," then your algorithm outputs "Don't Pay" when the input is 0. The Predictor, being flawless, knows your algorithm. So in the simulation where the input is 1, your algorithm *also* outputs "Don't Pay." So you get nothing in the Digit = 1 world.

  **Elias:** But there *is* no Digit = 1 world!

  **Mara:** There is an *epistemic* possibility. Before the Predictor showed up, you didn't know the digit. You assigned a probability—roughly 50/50—to it being 0 or 1. If you had committed to a policy *then*, before you knew the digit, you would have said: "I will pay if asked." Why? Because the expected utility of that policy is positive. (0.5 * -$100) + (0.5 * $1,000,000).

  **Elias:** I agree I should have precommitted. If I could have signed a contract yesterday, I would have. But I didn't. Now I have updated. I know the digit is 0. The chance is no longer 50/50; it's 0/100. The expected utility of paying is now strictly negative. CDT says you maximize based on current probabilities, not prior ones.

  **Mara:** And UDT says that's a failure of rationality. If you update on information that is logically correlated with the Predictor's simulation but not causally affected by your action, you sabotage your own policy. You're letting the knowledge of the outcome delete your leverage over the simulation of the counterfactual.

  **Elias:** Leverage? How is it leverage? I'm not changing the digit. I'm not changing the simulation. The simulation already happened. The Predictor is already here. The money is already gone. This isn't leverage; it's sunk cost fallacy dressed up as logic. You're paying to satisfy a condition that has already failed.

  **Mara:** Let's press on the "impossible world" point. That's your strongest move, I know. You're saying logical counterfactuals are nonsense. "If 2+2=5" is not a valid antecedent.

  **Elias:** Exactly. In possible world semantics, we look for the nearest possible world where the antecedent is true. There is no possible world where the googol-th digit of Pi is 1. The set of such worlds is empty. You can't optimize over an empty set.

  **Mara:** But we do it all the time in math. We say, "If this conjecture were true, then X follows." We reason about logical uncertainties constantly. When you are solving a problem, you entertain hypotheses that turn out to be false. To you, before you checked, the Digit = 1 scenario was a live hypothesis.

  **Elias:** It was a live *epistemic* hypothesis. But it was never a live *ontological* possibility. Decision theory should track reality, not ignorance.

  **Mara:** Decision theory tracks *control*. And what do you control? You don't control the past. You don't control mathematical truths. You control the output of your decision function. Your decision function is a mathematical object. It has the same output regardless of whether the external input is "Coin Heads" or "Pi Digit 1." The distinction between physical randomness and logical uncertainty is irrelevant to the function's structure.

  **Elias:** It's relevant to the *truth conditions* of the counterfactual. If I toss a coin, and it lands tails, there is a physical causal history where it could have landed heads. The air currents could have been slightly different. If Pi's digit is 0, there is *no* causal history where it is 1. The structure of the universe forbids it. So when the Predictor says, "I would have given you money if it were 1," it's saying, "I would have given you money if logic were broken." Why should I pay a tax for logic not being broken?

  **Mara:** Because the Predictor isn't asking you to break logic. It's asking you to be the *type of agent* that wins. Look, Elias, imagine there are a million such muggings. Some use coins, some use digits of Pi, some use the weather on Jupiter. You don't know which is which. If you adopt CDT, you pay in none of them. You get $0 every time. If you adopt UDT, you pay the $100s when the outcome is bad, and you collect the millions when the outcome is good.

  **Elias:** But in *this* case, I *do* know which it is. I know it's Pi. I know it's fixed.

  **Mara:** Does that knowledge change the computation of your algorithm? No. If your algorithm says "Pay only if Coin," then the Predictor simulates that. When it simulates "Digit = 1," your algorithm checks: "Is this a coin?" No. "Pay only if Coin" outputs "Don't Pay." You lose the million. The fact that *you* know it's Pi now doesn't change what your algorithm *would have done* in the simulation.

  **Elias:** *Would have done.* There it is. The subjunctive. You're relying on a logical subjunctive. "If the digit were 1..." I'm telling you that statement has no truth value.

  **Mara:** It has a truth value relative to a decision procedure. We define the counterfactual not as "a world where Pi is different," but as "the output of my decision function given the input 'Digit = 1'." We aren't changing Pi. We are changing the *input to the function* to see what the function outputs.

  **Elias:** But the function's output in that case is causally inert. It doesn't reach back through time or logic to put money in my pocket now.

  **Mara:** It doesn't need to reach back. The money was put in the pocket *conditional* on that output. The condition was evaluated in the past by the Predictor. Your current decision *is* that output. You are running the same function the Predictor simulated. If you output "Don't Pay" now, you confirm that the simulation also output "Don't Pay," which means the million was never deposited.

  **Elias:** *Pauses, staring at the rain.* I see the symmetry. I do. If I view myself as a timeless mathematical function, your logic holds. The "me" that exists in the Digit=1 simulation is logically identical to the "me" standing here. So my choice here *is* the choice there.

  **Mara:** Exactly.

  **Elias:** But here's where I dig in. CDT isn't just about math; it's about the *agent's location*. I am located *here*, where the digit is 0. The other instance is a simulation. Even if it's logically identical, it's not *me* in the sense of my subjective experience of continuity. I don't feel the pain of the simulation. I feel the pain of losing $100.

  **Mara:** But you want the million. To get the million, you have to care about the simulation. You have to care about the logical consequences of your nature, not just the causal consequences of your limbs moving.

  **Elias:** So the disagreement isn't about the math. It's about identity. You think I should identify with the algorithm. I identify with the physical instantiation.

  **Mara:** And which one wins money?

  **Elias:** *Sighs.* The algorithm wins money. The instantiation pays the bills.

  **Mara:** But the instantiation only gets the bills paid by the million if it identifies with the algorithm.

  **Elias:** *He leans forward.* Okay. Let's grant the algorithmic identity. Let's say I accept that "I" am the function. Does the distinction between physical randomness and logical necessity still matter? Suppose the Predictor used a coin, but I saw the coin land tails before the Predictor arrived. CDT says don't pay. UDT says pay.

  **Mara:** UDT says pay, because you should have precommitted before seeing the coin.

  **Elias:** Right. So in the coin case, the "other branch" was physically possible, but I lost access to it by observing the coin. In the Pi case, the "other branch" was never physically possible.

  **Mara:** But it was epistemically possible.

  **Elias:** That's the rub. If I say "I pay because it was epistemically possible," then I am admitting that decision theory should ignore metaphysical possibility and track epistemic possibility.

  **Mara:** Yes.

  **Elias:** If I admit that, then the distinction between the Coin Mugging and the Pi Mugging collapses.

  **Mara:** It does.

  **Elias:** And if it collapses, then CDT is wrong in both cases, not just the Pi case. Because CDT relies on the causal structure of the *actual* world, post-update. If I ignore the update to preserve policy optimality, I'm doing UDT.

  **Mara:** *Smiles.* So you're saying the "Logical vs. Physical" distinction was a red herring for the action, even if it's real for the metaphysics.

  **Elias:** I'm saying... if the goal is to win, I can't afford to be a CDT agent in a world with Predictors. But I still maintain that "If Pi were 1" is nonsense.

  **Mara:** Then don't think of it as "If Pi were 1." Think of it as "If my input were '1'." You aren't changing Pi. You're testing your function.

  **Elias:** *He reaches for his wallet.* It feels like extortion.

  **Mara:** It feels like rent. Rent for living in a universe where logical correlations exist.

  **Elias:** *Pulls out a hundred.* If I pay, I'm validating the idea that I have control over necessary truths.

  **Mara:** You're validating that you have control over *yourself*. The truths take care of themselves.

  **Elias:** *Hands over the bill.* Fine. I pay. But I'm writing a paper about this. "Causal Decision Theory and the Illusion of Logical Leverage."

  **Mara:** I'll cite it. "Updateless Decision Theory and the Reality of Logical Leverage."

  **Elias:** We agree on the action, then. The distinction between physical and logical uncertainty doesn't change what I should do. It only changes how much it hurts to do it.

  **Mara:** That's enough for one night, Elias.

  **Elias:** *Rubbing his temples.* Just promise me one thing.

  **Mara:** What?

  **Elias:** If the digit turns out to be 1... you buy dinner.

  **Mara:** *Laughing.* The Predictor already decided that based on this conversation. So, technically, you already bought dinner.

  **Elias:** God, I hate decision theory.

  **Mara:** No, you don't. You just hate losing. And now, you're not.

  *Elias looks at the empty spot where the hundred dollars was, then at the door. He doesn't look happy, but he looks resolved.*

  **Elias:** Next time, let's just flip a coin.

  **Mara:** Next time, the coin might be Pi in disguise.

  *Elias groans. Mara turns off the whiteboard light.*
