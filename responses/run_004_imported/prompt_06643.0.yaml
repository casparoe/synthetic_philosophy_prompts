      *   *Resolution:* Let's aim for a recognition that UDT wins on *policy selection*, but CDT wins on *local causal leverage*. The question is: which frame is correct for rationality? Let's have Cade admit that if he could precommit, he would, but argues he can't now. Una argues he *is* the precommitment.

  8.  **Drafting - Stage 5: Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Am I strawmanning CDT? CDT isn't stupid. The argument is that counterfactuals require metaphysical possibility.
      *   *Check:* Am I strawmanning UDT? UDT isn't magic. It relies on logical correlation.
      *   *Focus:* The prompt specifically highlights the "never really possible to begin with" argument. I need to make sure Cade hammers this. "It's not a branch cut off by time; it's a branch that never existed."
