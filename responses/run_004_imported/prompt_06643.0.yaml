  7.  **Drafting - Stage 4: The Crux (Logical Counterfactuals):**
      *   They need to discuss what a "logical counterfactual" is.
      *   Cade: It's nonsense. $2+2=4$. You can't say "If $2+2=5$..."
      *   Una: In decision theory, we evaluate the map, not the territory. My algorithm's output is contingent on its code, even if the mathematical truth it queries is fixed.
      *   *Refinement:* The prompt asks to land somewhere specific. Do they agree? Usually, in these dialogues, one convinces the other, or they agree to disagree on metaphysics but agree on action, or vice versa.
