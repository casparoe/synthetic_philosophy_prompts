      *   *Una's Strong Move:* The decision isn't about changing $\pi$. It's about what kind of *function* you are. The Predictor simulated your function. The output of your function determines the money in the Digit=1 case. Even if Digit=0 is necessary, your *uncertainty* prior to checking means you must act as if it's contingent to maximize expected utility across the logical space.
      *   *Cade's Rebuttal:* But I *am* certain now (given the Predictor says so). I have updated.
