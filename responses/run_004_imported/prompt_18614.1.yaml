answer: |-
  **Setting:** *October 1928. A private study in New York City. The air is thick with cigarette smoke and the weight of unspoken expectations. W.E.B. Du Bois stands by the window, looking out. Alain Locke sits in a leather armchair, a copy of Claude McKay's* Home to Harlem *resting on the table between them. Du Bois turns, holding a recent issue of* The Crisis.*

  **Du Bois:** You read my review, Alain. You know where I stand. And yet, here you sit, defending this… this indulgence.

  **Locke:** I am not defending indulgence, W.E.B. I am defending the artist's right to breathe. There is a distinction.

  **Du Bois:** When the world is burning, breathing is a luxury. When a Black man walks down the street in Birmingham or even here in Morningside Heights, he is not judged as an individual. He is judged as a representative of his race. Every book published, every canvas hung, is evidence entered into the court of public opinion. *Home to Harlem* is not evidence of our humanity; it is ammunition for our enemies.

  **Locke:** And whose opinion are we courting? The white critic who expects us to be either savages or saints? If we write only to refute the savage stereotype, do we not remain trapped in their definition? We become reactive. We let the white gaze dictate the boundaries of our creativity.

  **Du Bois:** I am not speaking of the white gaze! I am speaking of survival. I have said it before, and I will say it until I die: All Art is propaganda. Ever and everywhere. It must be.

  **Locke:** *(Leaning forward)* There it is. The absolute. "All Art is propaganda." You say it as if it is a law of physics. But tell me, when you use that word, what do you mean? Do you mean art that advances a cause? Or art that bends the truth to serve a master?

  **Du Bois:** I mean that no artist creates in a vacuum. We are Negroes. We live in a world that denies our humanity. Therefore, our art *must* assert that humanity. When McKay writes of the underworld, of the cabarets, of the raw instinct without the counterweight of our intellect or our struggle… he is not asserting humanity. He is feeding the caricature.

  **Locke:** But Harlem *has* cabarets, W.E.B. It has nightlife. It has flesh and blood and desire. If the artist is forbidden from touching the shadowed corners of Black life because they might look "bad" to a white reader, then we are not creating art. We are creating press releases.

  **Du Bois:** We are creating a shield!

  **Locke:** A shield that suffocates. Look at the backlash. The white critics praise McKay not because they love Black people, but because he confirms their voyeurism. You fear this. I fear it too. But your solution is to tell the artist, "Do not show this." My solution is to demand more artists, so that McKay is one voice among a hundred. If we have only one story, it must be the perfect story. If we have a thousand, the truth emerges from the chorus.

  **Du Bois:** We do not have a thousand voices yet. We have a handful. And the Talented Tenth has a responsibility to the masses who cannot speak for themselves. If a Southern sharecropper is denied a loan because a Northern publisher decided "honesty" meant printing filth, what good was that honesty?

  **Locke:** *(Stands up, pacing)* You speak of responsibility. I speak of integrity. If an artist looks at life and sees beauty in the gutter, and you tell him to paint the parlor instead, you have asked him to lie. And propaganda that relies on a lie is weak propaganda. It rings false. The white reader knows it is false. They patronize it, they do not respect it.

  **Du Bois:** I am not asking for lies. I am asking for selection. The artist selects. Why select *only* the degradation? Why not the church? The schoolhouse? The quiet dignity of a father working two jobs? Is that not also true?

  **Locke:** It is true. But it is not the *only* truth. And here is where your "propaganda" becomes dangerous. You want art to be a tool for social engineering. I want art to be the foundation of a culture. A culture cannot be built on engineering. It must be built on authentic expression, even when that expression is messy. If we censor ourselves to appease the NAACP or to soothe white sensibilities, we admit that we are not free.

  **Du Bois:** Freedom is not the absence of constraint. It is the power to achieve ends. If my art does not help me vote, does not help me avoid the rope, does not help my children eat… then it is a bauble. I would rather have a pamphlet that saves a life than a poem that wins a prize and ignores the lynching tree.

  **Locke:** But consider the long game, W.E.B. If Black art is forever yoked to the protest, forever defined by what it is fighting *against*, it never gets to define what it is *for*. We become permanent petitioners. "Look at us, we are good. Look at us, we are suffering." When do we get to say, "Look at us, we are complex"? McKay's book, for all its flaws, claims complexity. It claims the right to be human, which includes being flawed.

  **Du Bois:** *(Softens slightly, sits)* Complexity is a luxury for those who are not being hunted. I know you are not an aesthete, Alain. I know you do not believe in "art for art's sake" in the ivory tower sense. You believe in cultural diplomacy.

  **Locke:** I believe in cultural maturity. Propaganda is adolescent. It shouts. Culture whispers, and endures. If we want to be seen as equals, we must produce work that stands on its own merits, not work that requires a footnote explaining its sociological utility.

  **Du Bois:** And while we wait for this maturity? While we wait for the culture to whisper? Men die. The propaganda of hate is loud, Alain. It drowns out the whisper. We must shout back. If *Home to Harlem* makes the shout harder to hear, I must criticize it. Not to silence McKay, but to remind him of the weight he carries.

  **Locke:** The weight will crush him if you make it heavier. You want the Negro artist to be a savior, a sociologist, a politician, and a poet all at once. No white artist is asked to carry that load. Tolstoy did not have to save the Russian peasant with every sentence.

  **Du Bois:** Because the Russian peasant was not being hunted for his skin.

  **Locke:** *(Pauses)* No. He was not. And that is the tragedy. But if we accept that our art is *only* a weapon, we surrender the future to the war. We become defined by our enemies. I want a day when a Black boy can write about a sunset, or a love affair, or a drunken night in Harlem, and it is judged as art, not as a racial statement.

  **Du Bois:** I want that day too, Alain. God knows I do. But I do not see it on the horizon. I see the clouds gathering. Until that day comes, I will judge art by its utility. Does it push back the darkness? Or does it make the darkness look like a dance hall?

  **Locke:** And I will judge it by its truth. Does it ring true to the experience? Even the uncomfortable parts? Because if we lose the truth, we lose the soul. And a race without a soul cannot be saved, no matter how much propaganda it prints.

  **Du Bois:** *(Picks up the copy of* The Crisis *)* Then we are at an impasse. I believe the soul is saved by survival.

  **Locke:** *(Picks up* Home to Harlem *)* And I believe survival is meaningless without a soul to call your own.

  **Du Bois:** *(A faint, tired smile)* You are a stubborn man, Alain.

  **Locke:** *(Returns the smile)* I learned from the best, W.E.B.

  **Du Bois:** Publish your essay. Argue your point. But do not be surprised when I review the next book with the same fire.

  **Locke:** I would be disappointed if you didn't. The debate is the only thing keeping us honest.

  **Du Bois:** *(Turns back to the window)* Let us hope it keeps us free, as well.

  *[Fade out as Locke opens the book again, and Du Bois watches the street below, both waiting for a future neither can fully see.]*
