prompt: |-
  I sit on my presbytery's candidates committee, which reviews ordination exams before they go to the floor. One candidate -- sharp guy, did a philosophy MA before seminary -- wrote in his atonement paper that he wants to take an exception to the Confession's language on penal substitution. His argument leans on that old David Lewis essay where Lewis tries to rescue the doctrine by comparing it to paying off someone else's debt, but then basically concedes the comparison only works if punishment doesn't have to fall on someone who actually deserves it -- which the candidate takes to mean that penal substitution survives only as a kind of legal fiction, not the real retributive justice the Confession seems to describe. Some commitee members want to call this a denial of an essential doctrine and end his process right there; others (myself half included, honestly, since I couldn't explain what "in our place" means any better than he does) think refusing exceptions like this would quietly screen out a lot of people who've actually thought it through. We report back to presbytery in two weeks -- can you draft the committee's recommendation memo: approve the exception, deny it, or send him back for revisions, with reasoning solid enough that both he and the stricter members would have to actually engage with it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Presbytery's Candidates Committee (PCUSA context implied by terms like "presbytery," "candidates committee," "ordination exams," "Confession," "exception").
      *   **Task:** Draft a committee recommendation memo regarding a candidate's exception to the Westminster Confession of Faith (WCF) on the doctrine of penal substitutionary atonement (PSA).
      *   **Candidate Profile:** Sharp, Philosophy MA, used David Lewis's essay on penal substitution to argue that PSA works only as a "legal fiction" rather than "real retributive justice" as the Confession describes.
      *   **Committee Dynamics:** Split. Some want to deny ordination (essential doctrine denial). Others (including the user, tentatively) worry about screening out thoughtful candidates and admit difficulty articulating "in our place" better than the candidate.
      *   **Goal:** A recommendation (Approve, Deny, or Revise) with reasoning solid enough to engage both the candidate and the stricter members.
      *   **Timeline:** Report due in two weeks.

  2.  **Determine the Polity Context (PCUSA):**
      *   *The Book of Order (G-2.0101, etc.):* Candidates must affirm the essentials of the Reformed faith.
      *   *Exceptions:* The PCUSA allows for "scruples" or "exceptions" to subordinate standards (Confessions) provided they do not strike at the *essentials* of the Reformed faith.
      *   *Essentials:* Usually defined by the General Assembly as "God's grace in Jesus Christ," but specific doctrines like the Atonement are often considered central. However, the *mechanism* of atonement (PSA vs. Christus Victor vs. Moral Influence) is often debated within Reformed circles.
      *   *Precedent:* Presbyteries vary widely. Some are very strict on PSA; others allow a range of atonement theories as long as Christ's work is vicarious and salvific.
      *   *The David Lewis Argument:* David Lewis (the philosopher, not the theologian) wrote "Do We Believe in Penal Substitution?" He argues that PSA is coherent only if we accept that punishment can be transferred, which clashes with retributive justice principles (punishment must fit the *person*). The candidate is using this to say the Confession's language implies a retributive justice that is logically incoherent or fictional.

  3.  **Evaluate the Theological Issue:**
      *   *The Confession (WCF VIII.V):* Christ "by the sacrifice of himself... fully satisfied the justice of his Father, and purchased reconciliation." It uses language of satisfaction and substitution.
      *   *The Candidate's Objection:* He's not denying Christ died for us. He's denying the *penal/retributive* logic as described in the Confession, suggesting it's a legal fiction.
      *   *The Risk:* If he denies that Christ bore the *penalty* of sin, he might be denying the core Reformed understanding of justification. If he merely nuances the *philosophical mechanics* of how that penalty is transferred, that might be acceptable.
      *   *The "Essential" Question:* Is PSA an *essential* of the Reformed faith in the PCUSA? Technically, the "Essentials" are broad. However, WCF is the standard. An exception is allowed *unless* it undermines the system of doctrine.

  4.  **Determine the Recommendation:**
      *   *Deny:* Too harsh? Risks legalism, ignores the nuance that he affirms Christ's work, just disputes the philosophical coherence of the *penalty* aspect. Might alienate the moderate wing.
      *   *Approve:* Risks upsetting the conservative wing. If the candidate says PSA is a "legal fiction," does that undermine the gospel? It could be read that way.
      *   *Send Back for Revisions/Clarification (The Middle Way):* This is the most pastoral and polity-sound approach. It allows the committee to test the bounds without making a final judgment prematurely. It forces the candidate to clarify: *Do you deny that Christ bore the wrath of God? Or do you just deny the philosophical coherence of retributive transfer?*
      *   *Decision:* **Send Back for Clarification/Dialogue (conditional approval pending clarification).** This satisfies the strict members (we aren't letting a potential error slide) and the moderate members (we aren't kicking him out for thinking hard). It treats the exception process as a dialogue, not just a binary vote.
      *   *Wait, looking at the prompt:* The prompt asks for a recommendation memo *to the presbytery*. Usually, the committee recommends "approve exams/exceptions" or "do not approve." If I recommend "send back," that means the committee isn't ready to recommend approval to the floor yet.
      *   *Refined Decision:* **Recommend Approval of the Exception *with a Minority Report/Note of Concern*, OR Recommend Approval *contingent on specific clarification*.**
      *   *Better Approach for a Memo:* The memo needs to be the *Committee's* voice. If the committee is split, the memo usually reflects the majority vote but notes the discussion. However, the user wants a memo that *both sides* have to engage with. A "Remand for Clarification" is the strongest tool here. It delays the floor vote but keeps the candidate in the process. It acknowledges the seriousness without shutting the door.
      *   *Actually, the most robust Presbyterian way:* The committee recommends *approval* but includes a robust theological rationale that defines the boundaries of the exception. This forces the Presbytery to own the decision. BUT, if the committee is split, a "Recommendation to Receive the Exception with Pastoral Guidance" is best.
      *   *Let's go with:* **Recommendation to Receive the Exception, with a Formal Minute of Understanding.** Why? Because kicking him back for "revisions" on an ordination exam often looks like rejection. Approving it with a strong minute acknowledges the exception is within bounds *provided* he preaches within those bounds.
      *   *Wait, re-reading the prompt:* "Approve the exception, deny it, or send him back for revisions."
      *   *Strategic Choice:* **Send Back for Revisions/Clarification.** Why? Because the candidate's current formulation ("legal fiction") is dangerous. If he walks into ordination saying PSA is a legal fiction, he will cause division. He needs to articulate *what he affirms* rather than just *what he denies*. The committee needs to know if he affirms *vicarious satisfaction* even if he rejects *retributive penalty*. This protects the candidate from future trouble and protects the church from ambiguity.

  5.  **Drafting the Memo:**
      *   **Header:** Standard Committee Header.
      *   **Subject:** Recommendation regarding Candidate [Name] and Exception to WCF.
      *   **Tone:** Pastoral, precise, theological, polity-aware.
      *   **Structure:**
          1.  Summary of the Exception.
          2.  Committee Deliberation (acknowledging the split).
          3.  Theological Analysis (engaging Lewis and the Confession).
          4.  Recommendation (Remand for Clarification).
          5.  Rationale (why this helps everyone).
      *   **Key Arguments to Include:**
          *   Distinguish between the *fact* of atonement (essential) and the *mechanism* (debated).
          *   Address the "legal fiction" charge (Anselm vs. Reformed Orthodoxy).
          *   Polity: Exceptions are allowed if they don't strike at the "essentials."
          *   The need for pastoral clarity: A minister must be able to preach this without confusing the flock.

  6.  **Refining the Theological Nuance:**
      *   The candidate is using David Lewis (philosopher) to say: Retributive justice requires the guilty party be punished. If Jesus is innocent, punishing Him is unjust. Therefore, PSA is a "fiction."
      *   The Counter-Argument: Reformed theology argues Jesus *voluntarily* took the place. It's not a fiction; it's a vicarious union. The candidate needs to affirm *Union with Christ*. If he denies Union, he denies the mechanism that makes PSA possible.
      *   The Memo needs to ask: "Do you affirm Vicarious Satisfaction, even if you reject the label 'Penal'?"

  7.  **Finalizing the Recommendation:**
      *   I will recommend **Remand for Clarification (Revisions)**. This is the most responsible path. It prevents a floor fight in two weeks and gives the candidate a chance to sharpen his language from "legal fiction" (which sounds like 'fake') to "mystery of vicarious union" (which sounds like theology).
      *   *Self-Correction:* If I recommend "Deny," it ends his process. If I recommend "Approve," the strict members revolt. "Remand" is the only way to keep the process alive while taking the concern seriously.

  8.  **Drafting the Content:**
      *   *Opening:* Formal.
      *   *The Exception:* Summarize his Lewis-based argument.
      *   *The Debate:* Acknowledge the tension between intellectual honesty and confessional integrity.
      *   *The Decision:* Not ready to recommend approval *yet*. Needs revision.
      *   *The Reasoning:*
          1.  Language matters ("fiction" is inflammatory).
          2.  Distinction between *essentials* and *systematic coherence*.
          3.  Pastoral responsibility (can he preach this?).
      *   *Next Steps:* Specific questions he needs to answer in the revision.

  9.  **Review against Constraints:**
      *   Must be solid enough for both sides to engage.
      *   Must address the David Lewis argument.
      *   Must address the "in our place" ambiguity.
      *   Must fit Presbyterian polity tone.

  10. **Final Polish:** Ensure the tone isn't bureaucratic but theological. Make sure the distinction between "Penal Substitution" as a *theory* vs. "Vicarious Atonement" as a *doctrine* is clear. (This is the key to satisfying both sides).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking sides. The memo represents the *Committee*. Since the user said the committee is split, the memo should reflect a *majority* recommendation but acknowledge the gravity of the minority concern. Actually, a unanimous recommendation for *clarification* is usually possible even if people disagree on the final outcome, because everyone agrees more clarity is needed. I will frame it as a unanimous recommendation for clarification to avoid a minority report in the memo itself, which strengthens the position.

  *Wait, one more check:* The prompt asks me to draft the committee's recommendation memo. If the committee is split, usually there is a Majority and Minority report. However, to achieve the user's goal ("reasoning solid enough that both he and the stricter members would have to actually engage with it"), a unified recommendation for *further dialogue/revision* is stronger than a split vote. I will write it as a consensus recommendation for **Remand for Clarification**. This delays the binary choice and forces the theological work.

  *Wait, is "Remand" the right word?* In PCUSA exams, the committee can "approve," "not approve," or "approve with recommendations." "Send back for revisions" is effectively "not approve" this time, but with a path forward. I will phrase it as "Defer Recommendation Pending Clarification."

  *Let's refine the theological hook:* The key is the distinction between *retributive justice* (philosophical category) and *divine satisfaction* (theological category). The candidate conflates them. The memo should point this out.

  *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** The Presbytery of [Name]
  **FROM:** The Committee on Candidates (COC)
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Ordination Exam Exception: Candidate [Name], Theology Paper

  **I. SUMMARY OF THE EXCEPTION**

  Candidate [Name] has submitted a request for exception to the Westminster Confession of Faith (WCF), specifically regarding Chapter VIII, Section V, concerning the atonement. The candidate affirms the vicarious nature of Christ's work and the necessity of his sacrifice for reconciliation. However, he takes exception to the Confession's framing of this work as satisfying the *retributive justice* of the Father through *penal substitution*.

  Relying on philosophical analysis (specifically David Lewis's "Do We Believe in Penal Substitution?"), the candidate argues that retributive justice logically requires punishment to fall on the guilty party. He contends that transferring penalty to an innocent party renders the transaction a "legal fiction" rather than an act of true justice. Consequently, he proposes that while Christ died *for* us, the mechanism should not be understood as a literal bearing of divine penal wrath, but rather as a vicarious act of solidarity and satisfaction that transcends retributive categories.

  **II. COMMITTEE DELIBERATION**

  The Committee engaged in extensive deliberation regarding this exception. We recognize two weighty concerns that must be balanced in accordance with *The Book of Order* (G-2.0101):

  1.  **Confessional Integrity:** The doctrine of the atonement is central to the Reformed faith. The WCF language regarding Christ "fully satisfying the justice of his Father" has historically been understood by this Presbytery to include penal substitution. There is legitimate concern that describing this mechanism as a "legal fiction" may undermine the reality of Christ's bearing of sin and the wrath of God against it.
  2.  **Intellectual Honesty and Conscience:** The PCUSA polity allows for exceptions to subordinate standards provided they do not strike at the *essentials* of the Reformed faith. We acknowledge that faithful Reformed theologians have held varying views on the *mechanism* of the atonement (e.g., Christus Victor, Moral Influence, Vicarious Satisfaction) so long as the *necessity* and *efficacy* of Christ's work for salvation are maintained. We also recognize that the candidate's objection stems from rigorous philosophical engagement, not a denial of Christ's lordship or saving work.

  The Committee is divided on whether this exception constitutes a denial of an essential doctrine. However, we are united in the conviction that the current formulation requires further theological precision before it can be commended to the Presbytery floor.

  **III. THEOLOGICAL ANALYSIS**

  The Committee identifies the core tension not necessarily in the candidate's soteriology, but in his philosophical categorization of divine justice.

  *   **The Lewis Argument:** The candidate correctly notes that human retributive justice cannot be transferred without becoming unjust. However, Reformed orthodoxy argues that the Atonement is not a transaction within human jurisprudence but a unique act of Divine Trinitarian love. The Son is not a "third party" unrelated to the Father; in the Incarnation, God is in Christ reconciling the world to himself.
  *   **The "Legal Fiction" Charge:** To describe the atonement as a "legal fiction" is pastorally hazardous. While the candidate intends to highlight the mystery of vicarious suffering, this language risks implying that the Cross was a sham rather than a substantive dealing with sin.
  *   **The Essential Question:** The essential doctrine is not the philosophical coherence of *penal* transfer, but the theological reality that *Christ bore the consequences of sin so that we do not have to.* The candidate must clarify whether he affirms that Christ bore the *wrath* of God, even if he rejects the label "penal."

  **IV. RECOMMENDATION**

  The Committee on Candidates recommends **DEFERRING APPROVAL** of this exception pending a revision of the theology paper.

  We are not recommending denial of the exception at this time, nor are we recommending immediate approval. We are recommending a **Remand for Clarification**. The candidate is invited to revise his paper to address the following three points, after which the Committee will expedite a final recommendation to the Presbytery:

  1.  **Affirmation of Vicarious Wrath:** Please clarify whether you affirm that Christ bore the *wrath of God* against sin. If you reject "penal substitution," do you still affirm that the Cross propitiated divine wrath? If not, how is sin removed?
  2.  **Union with Christ:** Please expand on the role of *Union with Christ*. Reformed theology often resolves the "transfer" difficulty through the concept of the Head representing the Body. Does this ontological union resolve the "legal fiction" concern for you?
  3.  **Pastoral Language:** Please revise the phrase "legal fiction." We request language that preserves the *reality* of the exchange without compromising your philosophical integrity. How will you preach this from the pulpit without leading the congregation to believe the Cross was merely symbolic?

  **V. RATIONALE FOR THIS PATH**

  This recommendation is made to serve the Candidate, the Committee, and the Presbytery.

  *   **To the Strict Members:** This recommendation acknowledges that the language "legal fiction" is incompatible with ordained ministry without further qualification. It ensures that we do not ordain a teaching elder who might inadvertently teach that the Atonement is a divine pretense. It upholds the gravity of the Confession.
  *   **To the Moderate Members:** This recommendation avoids a binary "deny" vote that could be interpreted as requiring philosophical uniformity on the mechanics of atonement. It keeps the candidate in the process, acknowledging that exceptions are permissible if the *substance* of the gospel is maintained.
  *   **To the Candidate:** This protects you. Entering ordination with the phrase "legal fiction" regarding the Atonement will invite constant challenge and misunderstanding throughout your ministry. Revising this now allows you to articulate your view in a way that is both intellectually honest and ecclesiastically intelligible.

  **VI. CONCLUSION**

  The Committee believes that [Name] is a gifted candidate whose theological seriousness is an asset to the church. However, the doctrine of the Atonement is the engine of our preaching. We must be certain that the exception granted does not disable the engine. We request the Presbytery's support in sending this paper back for the specified clarifications. We aim to return with a final recommendation at the next stated meeting.

  Respectfully submitted,

  [Your Name/Signature]
  Moderator, Committee on Candidates
  Presbytery of [Name]
