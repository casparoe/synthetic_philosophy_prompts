answer: |-
  This is one of the most satisfying results in formal epistemology precisely because the geometric proof transforms an algebraic theorem into a visual inevitability. Once you see the picture, it feels impossible for the result to be otherwise.

  The shift from Dutch Book to Accuracy is a shift from **pragmatic consistency** (don't lose money) to **representational fidelity** (don't be far from the truth). The geometric argument, largely solidified by Predd, Seiringer, Osherson, Seidenfeld, and Gabriel (2009), relies on the structure of **convex sets** and **Euclidean projection**.

  Here is the walkthrough of why incoherence implies accuracy dominance, why the geometry works, and where it breaks if you tamper with the scoring rule.

  ### 1. The Geometric Stage

  To see the geometry, we need to map credences and worlds into a vector space.

  **The Dimensions:**
  Imagine a proposition space with $N$ mutually exclusive and exhaustive possibilities (worlds), $w_1, \dots, w_N$.
  A credence function $c$ assigns a number to each world. We can represent $c$ as a point in $\mathbb{R}^N$:
  $$c = (c(w_1), c(w_2), \dots, c(w_N))$$

  **The Omniscient Points (The Vertices):**
  At any given world $w_i$, the "truth" is that $w_i$ is the case and all others are not. An omniscient agent would assign credence 1 to $w_i$ and 0 to the rest.
  Let $v_i$ be the vector representing omniscience at world $w_i$.
  $$v_1 = (1, 0, \dots, 0)$$
  $$v_2 = (0, 1, \dots, 0)$$
  ...and so on.
  These points $v_1, \dots, v_N$ are the **vertices** of our geometric space.

  **The Coherent Set (The Simplex):**
  What does it mean to be probabilistically coherent?
  1.  **Non-negativity:** $c(w_i) \geq 0$
  2.  **Normalization:** $\sum c(w_i) = 1$

  Geometrically, the set of all points satisfying these two conditions is the **convex hull** of the vertices $v_1, \dots, v_N$.
  *   In 2D (2 worlds), this is the line segment connecting $(1,0)$ and $(0,1)$.
  *   In 3D (3 worlds), this is the triangle connecting $(1,0,0)$, $(0,1,0)$, and $(0,0,1)$.
  *   In $N$-dimensions, this is a **simplex**.

  Let $\mathcal{P}$ be this set of coherent probability functions. Crucially, $\mathcal{P}$ is a **closed, convex set**.
  *   *Convex* means: If you take any two points inside $\mathcal{P}$, the line connecting them is also inside $\mathcal{P}$.
  *   *Incoherent* credences are simply points in $\mathbb{R}^N$ that lie **outside** this simplex $\mathcal{P}$.

  ### 2. Accuracy as Distance (The Brier Score)

  Now we need to measure accuracy. Joyce argues that a "legitimate" measure of inaccuracy should be a **strictly proper scoring rule**. The canonical example is the **Brier Score**.

  The Brier Score of a credence function $c$ at world $w_i$ is:
  $$BS(c, w_i) = \sum_{j=1}^N (c(w_j) - v_i(w_j))^2$$

  Notice what this is: it is the **squared Euclidean distance** between the point $c$ and the omniscient vertex $v_i$.
  $$BS(c, w_i) = \| c - v_i \|^2$$

  So, the epistemic goal is: **Minimize distance to the truth.**
  *   If $w_1$ is the actual world, the truth is at $v_1$. You want to be close to $v_1$.
  *   If $w_2$ is the actual world, the truth is at $v_2$. You want to be close to $v_2$.

  ### 3. The Projection Argument (Why Incoherence is Dominated)

  Here is the core intuition.

  **The Setup:**
  Suppose you have an incoherent credence function $c$. Geometrically, $c$ is a point **outside** the simplex $\mathcal{P}$.
  We want to show there exists a coherent function $c^*$ (a point **inside** $\mathcal{P}$) that is closer to *every* vertex $v_i$ than $c$ is.

  **The Move:**
  Because $\mathcal{P}$ is a closed, convex set, and $c$ is outside it, there is a unique point $c^*$ inside $\mathcal{P}$ that is **closest** to $c$.
  In geometry, this is called the **orthogonal projection** of $c$ onto $\mathcal{P}$.
  Imagine a sphere centered at $c$ expanding until it just touches the simplex $\mathcal{P}$. The point where it touches is $c^*$.

  **The Crucial Geometric Fact:**
  Why is $c^*$ closer to *all* the vertices $v_i$?
  Consider the hyperplane tangent to the simplex at $c^*$. Because $\mathcal{P}$ is convex, the entire simplex (including all vertices $v_i$) lies on one side of this tangent plane. The point $c$ lies on the other side.
  The line segment from $c$ to $c^*$ is perpendicular to this tangent plane.

  For any vertex $v_i$, consider the triangle formed by points $c$, $c^*$, and $v_i$.
  Because of the convexity and the projection property, the angle $\angle c c^* v_i$ is **obtuse** (or right-angled).
  By the Law of Cosines, if the angle at $c^*$ is obtuse, the side opposite it (the distance from $c$ to $v_i$) must be longer than the side adjacent (the distance from $c^*$ to $v_i$).

  $$ \| c - v_i \|^2 = \| c - c^* \|^2 + \| c^* - v_i \|^2 - 2\|c-c^*\|\|c^*-v_i\|\cos(\theta) $$
  Since $\theta \geq 90^\circ$, $\cos(\theta) \leq 0$, making the subtraction term positive. Thus:
  $$ \| c - v_i \| > \| c^* - v_i \| $$

  **The Result:**
  Since Distance = Inaccuracy:
  The inaccuracy of $c^*$ is strictly less than the inaccuracy of $c$ at **every possible world** $w_i$.
  Therefore, $c$ is **accuracy-dominated** by $c^*$.

  **Intuitive Summary:**
  Coherent credences are weighted averages of the possible truths (the vertices). If you are incoherent, you are "off to the side" of the average. Moving perpendicularly toward the "region of averages" (the simplex) brings you closer to *all* the corners simultaneously, because the corners surround the region. You cannot be outside the triangle and closer to all three corners than some point inside the triangle.

  ### 4. What Breaks the Argument?

  You asked specifically about the conditions on the scoring rule. The geometry above relies heavily on the properties of **Squared Euclidean Distance**.

  #### A. Merely Proper vs. Strictly Proper
  A scoring rule is **proper** if you maximize expected accuracy by reporting your true credence. It is **strictly proper** if that maximum is *unique*.

  *   **Strictly Proper (e.g., Brier/Log):** The "distance" surfaces are strictly convex (bowl-shaped). There is a unique closest point $c^*$. The dominance is *strict* ($c^*$ is definitely better). This gives the normative force: "You are definitely doing worse than you could be."
  *   **Merely Proper:** The "distance" surface might have flat regions. If you project an incoherent $c$ onto $\mathcal{P}$, you might find a $c^*$ that is *at least as good* as $c$, but not *strictly better*.
      *   *Why this matters:* If $c^*$ is only *equal* in accuracy to $c$ at some worlds, the argument for *probabilism* weakens. It suggests coherence is permissible, but not that incoherence is irrational. To prove that incoherence is a defect, you need to show it is *suboptimal*, which requires strict dominance.

  #### B. Improper Rules (e.g., Absolute Error)
  This is where the geometry fundamentally breaks.
  Absolute Error corresponds to **Manhattan Distance** ($L_1$ norm), not Euclidean Distance ($L_2$ norm).
  $$AE(c, w_i) = \sum |c(w_j) - v_i(w_j)|$$

  **The Geometric Failure:**
  In Euclidean geometry ($L_2$), "circles" are round. In Manhattan geometry ($L_1$), "circles" are diamonds (squares rotated 45 degrees).
  The **Projection Theorem** used above (that the closest point in a convex set reduces distance to all vertices) is a specific property of Hilbert spaces (Euclidean geometry). It does **not** hold for $L_1$ spaces.

  **Concrete Counter-Example:**
  Consider 2 worlds, $w_1, w_2$.
  Vertices: $v_1=(1,0)$, $v_2=(0,1)$.
  Coherent set $\mathcal{P}$: The line segment $x+y=1$ between them.
  Consider an incoherent credence $c = (0.6, 0.6)$. (Sum = 1.2).
  The closest coherent point via Euclidean projection is $c^* = (0.5, 0.5)$.
  *   Brier Score (Euclidean): $c^*$ dominates $c$.
  *   Absolute Error ($L_1$):
      *   Inaccuracy of $c$ at $w_1$: $|0.6-1| + |0.6-0| = 0.4 + 0.6 = 1.0$
      *   Inaccuracy of $c$ at $w_2$: $|0.6-0| + |0.6-1| = 0.6 + 0.4 = 1.0$
      *   Inaccuracy of $c^* (0.5, 0.5)$ at $w_1$: $|0.5-1| + |0.5-0| = 0.5 + 0.5 = 1.0$
      *   Inaccuracy of $c^* (0.5, 0.5)$ at $w_2$: $1.0$

  With Absolute Error, the coherent point $c^*$ is **no more accurate** than the incoherent point $c$. In fact, with $L_1$, you can construct cases where an incoherent credence is *not dominated* by any coherent credence.
  If you use Absolute Error, the Accuracy-First argument for Probabilism **fails**. You cannot derive the probability axioms solely from the goal of minimizing absolute error.

  ### 5. Summary of the Intuition

  1.  **Truth is Vertices:** Possible worlds are the corners of a shape.
  2.  **Probability is the Interior:** Coherent credences are the points inside the shape formed by those corners (the convex hull).
  3.  **Inaccuracy is Distance:** Being wrong is being far from the corner that represents the truth.
  4.  **Incoherence is Outside:** If you violate probability axioms, you are floating outside the shape.
  5.  **Projection is Improvement:** If you are outside a convex shape, moving perpendicularly toward the shape brings you closer to *every* corner of that shape simultaneously (in Euclidean space).
  6.  **Strict Propriety is Curvature:** This only works if the "distance" metric curves smoothly (squared error). If the metric is flat (merely proper) or pointy (absolute error), the geometry fails, and incoherence might not be dominated.

  This is why the Accuracy-First program is so tied to the Brier Score (or Log Score, which has analogous properties). It's not just a convenient math trick; it's the specific metric that aligns "epistemic distance" with "probabilistic coherence" via the geometry of convex sets.
