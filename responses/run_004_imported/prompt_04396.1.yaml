      *   **Core Argument:** The universe is rational/orderly. Human potential is vast but largely unfulfilled in life. A rational universe wouldn't create such potential only to waste it (like building a foundation and abandoning the house). Therefore, existence must continue to fulfill this potential.
      *   **Key Insight:** The argument *requires* life to be unfair/cut short to work.
      *   **Format:** Dialogue between Gödel and a sharp skeptic (Logical Empiricist/Vienna Circle style).
      *   **Tone:** Steelmanned Gödel (rigorous, logical, not naive/religious) vs. Skeptic (verificationist, materialist, sharp).
      *   **Goal:** Show Gödel defending the logic against specific attacks, not just emotional dismissal.

  2.  **Character Conception:**
