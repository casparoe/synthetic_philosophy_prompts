          *   Counterfactual: "If Car A didn't swerve, Car C would have hit Car B anyway." -> Car A not liable?
          *   Interventionist: "Car A's swerve was the *active mechanism* that hit Car B at T=0." -> Car A liable.
          *   Legal/Engineering implication: Are we punishing the actual actor or the hypothetical scenario?
      *   **Summary/Takeaway:** Counterfactual looks at alternate histories. Interventionist looks at actual mechanisms.

