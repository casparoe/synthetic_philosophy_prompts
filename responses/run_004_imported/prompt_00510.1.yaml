      *   **Theory 2: The Interventionist (The "Wiggle" Test):**
          *   Explain the logic: Don't just remove the cause; look at the *process*. Imagine freezing time right before Suzy's rock hits.
          *   The Intervention: Change Suzy's aim *at that specific moment*.
          *   Result: Billy's rock is still in mid-air (too far away). The bottle is safe *for now*.
          *   Key distinction: It cares about the *actual mechanism* that completed the job, not just the hypothetical backup.
      *   **Why It Matters for Self-Driving Cars:**
