          *   Distinguish between "cessation of treatment" and "organ removal causing death."
          *   Discuss the Dead Donor Rule (DDR) as a protective fiction vs. necessary barrier.
          *   Public trust issue.
      *   *Section 3: The Conclusion (Point 5).*
