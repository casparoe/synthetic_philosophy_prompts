answer: |-
  It is a pleasure to address a colleague who has spent a career thinking deeply about dynamics and stability. Your intuition is shared by many game theorists, philosophers, and economists. The Centipede Game, introduced by Robert Rosenthal in 1981, was designed specifically to generate the tension you describe.

  You ask whether the backward induction (BI) result constitutes a *reductio ad absurdum* of expected-payoff maximization as a definition of rationality. The short answer is: **No, it does not refute maximization, but it does expose the extreme fragility of the "Common Knowledge of Rationality" (CKR) assumption required to sustain backward induction.**

  If you abandon CKR, even slightly, expected-payoff maximization actually *prescribes* cooperation for a significant portion of the game. Thus, the criterion of rationality need not be abandoned; rather, the specific epistemic conditions required for the BI paradox are shown to be unrealistic.

  Here is precisely where the argument breaks down, structured by the logical, epistemic, and evolutionary dimensions relevant to your background.

  ### 1. The Epistemic Breakdown: Common Knowledge of Rationality
  The backward induction argument is mathematically valid *if and only if* the following conditions hold strictly:
  1.  **Payoff Transparency:** Both players know the payoff structure.
  2.  **Instrumental Rationality:** Both players seek to maximize expected utility.
  3.  **Common Knowledge:** Player 1 knows (2), Player 2 knows (2), Player 1 knows that Player 2 knows (2), ad infinitum.

  The breakdown occurs at the first deviation from the equilibrium path. In the Centipede Game, the BI equilibrium dictates that Player 1 stops at Node 1. However, if Player 1 *passes*, they have effectively falsified the hypothesis that they are following the BI strategy.

  At Node 2, Player 2 faces a decision. Standard BI reasoning requires Player 2 to believe that Player 1 is rational and will therefore stop at Node 3. But Player 1 has just passed Node 1. Why should Player 2 believe Player 1 will suddenly revert to "rational" (BI) behavior at Node 3 after demonstrating "irrational" (cooperative) behavior at Node 1?

  To sustain BI, one must assume that Player 2 treats Player 1's move at Node 1 as a "tremble" (a mistake) that conveys no information about Player 1's future strategy or type. This is epistemically unstable. If rationality entails updating beliefs based on evidence, observing a pass should cause Player 2 to update the probability that Player 1 is a "cooperator." If that probability exceeds a certain threshold, Player 2 maximizes expected payoff by passing as well.

  ### 2. The "Gang of Four" Resolution (Reputation)
  This is the most direct rebuttal to your concern that maximization must be abandoned. In 1982, Kreps, Milgrom, Roberts, and Wilson published a seminal paper showing that if there is **incomplete information**, cooperation emerges as the rational, payoff-maximizing strategy.

  Suppose there is a tiny probability ($\epsilon$) that your opponent is not a payoff maximizer but a "tit-for-tat" or "always-cooperate" type (perhaps due to confusion, altruism, or a different utility function).
  *   If you are a selfish maximizer, you know that if you defect early, you reveal your type and the game ends.
  *   If you cooperate, you maintain the possibility that *you* are the cooperative type.
  *   Because the opponent wants to exploit the cooperative type (by cooperating with them to keep the pot growing), they will cooperate with you as long as they think there is a chance you are cooperative.

  **The Result:** It becomes rational for a selfish player to *mimic* a cooperator for almost the entire length of the game to build a reputation, only defecting near the very end. As the game length approaches infinity, the number of cooperative rounds approaches infinity.

  This saves expected-payoff maximization. It shows that the "irrational" cooperation observed in your colleague's lab experiments is actually **consistent with rationality** under conditions of slight uncertainty. The BI paradox only holds in a vacuum of perfect information, which rarely exists in biology or economics.

  ### 3. The Counterfactual Problem
  Philosophers of game theory (such as Cristina Bicchieri and Ken Binmore) have pointed out a logical inconsistency in the BI reasoning itself regarding counterfactuals.

  For Player 1 to reason backwards from the last node, they must assess what would happen at Node $N$. But reaching Node $N$ requires that Player 1 and Player 2 have both acted contrary to the BI prediction at nodes $1$ through $N-1$.
  *   To calculate the payoff at Node $N$, Player 1 assumes Player 2 is rational.
  *   But Player 2's presence at Node $N$ implies Player 2 has already acted "irrationally" (by not stopping earlier).
  *   Therefore, Player 1 is relying on the assumption of Player 2's rationality in a state of the world that is only reachable if Player 2 is *not* rational.

  This is a contradiction in the counterfactual reasoning. You cannot assume a player is rational at a node that is off-the-equilibrium-path, if reaching that node proves they are not following the rational strategy derived from that same assumption. This suggests the BI solution is not just counterintuitive, but logically ill-defined in certain epistemic frameworks.

  ### 4. The Evolutionary Perspective
  Given your background, this is likely the most satisfying angle. In evolutionary game theory, we look for Evolutionarily Stable Strategies (ESS).
  *   In a finite population playing a finite Centipede Game, strict BI strategies are fragile.
  *   If a population plays "Stop at Node 1," a mutant strategy of "Stop at Node 3" earns the same payoff (since the game ends at Node 1 regardless).
  *   Because the mutant is neutral, it can drift into the population.
  *   Once "Stop at Node 3" exists, a mutant "Stop at Node 5" can invade (because when meeting a "Stop at Node 3" player, the game goes to Node 3, and the Node 5 player gets the higher payoff).
  *   This "staircase" of invasion allows cooperation to evolve and stabilize, provided there is any noise, mutation, or uncertainty about the game's horizon.

  In biology, the "end of the game" is rarely common knowledge. Predators do not know exactly when they will die or when the environment will shift. The "shadow of the future" transforms the finite Centipede into an iterated Prisoner's Dilemma, where cooperation is the robust ESS. The BI result is an artifact of the mathematical boundary condition (the known final node), not a robust feature of strategic interaction.

  ### Conclusion
  Your suspicion that the Backward Induction argument is flawed is well-founded, but the conclusion that **expected-payoff maximization** must be abandoned is too strong.

  The argument breaks down not because maximization is wrong, but because:
  1.  **Common Knowledge of Rationality is unsustainable:** Real agents (and biological organisms) cannot logically maintain CKR once a deviation occurs.
  2.  **Incomplete Information favors Cooperation:** Under the Kreps et al. model, maximizing expected payoff *requires* cooperation for most of the game.
  3.  **Evolutionary Stability:** Strict BI strategies are not robust to mutation or noise.

  The Centipede Game does not refute rationality; it refutes the idea that rationality can be defined solely by logical deduction from axioms that ignore belief revision, reputation, and uncertainty. The human subjects in the lab are not failing to be rational; they are correctly responding to the implicit uncertainty that the mathematical model explicitly excludes.

  You can rest easy: the principle of payoff maximization remains sound, provided it is applied to agents who understand that in the real world (and the lab), no one is ever quite sure if the other player is a perfect logician.
