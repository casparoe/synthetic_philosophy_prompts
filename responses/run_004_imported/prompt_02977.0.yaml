      *   *The Wallis Feud:* Hobbes hated algebraists/symbolists. He wanted visible, constructive geometry. He thought he squared the circle because he thought the definitions allowed it. He rejected proof by contradiction (reductio ad absurdum) often, preferring direct construction.
      *   *Truth:* Truth is about the correct ordering of names (nominalism). "Man is a living creature" is true because we defined it so. But for physics, truth requires the names to match the causal powers of bodies.

