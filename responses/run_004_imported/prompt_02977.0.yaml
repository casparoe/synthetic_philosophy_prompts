answer: |-
  Hobbes would reject the physical application of non-Euclidean geometry as a category error born of "insignificant speech," and he would dismiss pure non-Euclidean geometry as a trivial exercise in logic that forfeits the title of "science." He would not find the discovery congenial; he would view it as catastrophic for the perpetrators' understanding of language, but ultimately harmless to the truth of geometry itself.

  To defend this definite answer, we must resolve the tension you identified—between his constructivist epistemology (geometry is certain because we make it) and his ontological commitment (geometry is certain because it describes real bodies)—by recognizing that for Hobbes, these are not two separate commitments. They are one and the same. Hobbes does not believe we can construct *any* geometry we like; we can only construct the geometry of the *phantasm of extension*, and that phantasm is inextricably Euclidean.

  Here is the reconstruction of his response, grounded in his materialist nominalism and his specific disputes with the mathematicians of his day.

  ### 1. The Ontological Rejection: Space Cannot Curve
  Your tension hinges on the idea that Hobbes might accept non-Euclidean geometry as a valid "construction" even if it doesn't match physical space. This assumes a modern formalist view of geometry (geometry as a game of symbols) which Hobbes explicitly rejects. For Hobbes, space is not a substance that *has* properties like curvature; it is "the phantasm of a thing existing without the mind." It is an accident of our conception, derived from the sensory experience of body.

  When Einstein argues that physical space is curved, Hobbes would identify this as a reification of space—treating a phantasm as if it were a body. In *De Corpore*, Hobbes insists that only bodies can be subjects of motion and causation. To say "space curves" is to attribute a causal power or a physical modification to a mere idea. Hobbes would argue that what is actually happening in General Relativity is that *bodies* move in complex ways, and physicists are lazily attributing that motion to "space" rather than tracing the causal chains of bodies pushing bodies.

  Therefore, Hobbes would not see non-Euclidean physics as an empirical discovery about the world, but as a linguistic confusion. He would argue that the physicists have mistaken the *measure* for the *thing measured*. If the sum of angles in a physical triangle is not 180 degrees, Hobbes would not conclude that "geometry is empirical"; he would conclude that the physicists have failed to identify a true straight line (which is defined by the simplest motion) or that there are hidden corporeal causes interfering with the measurement. He would protect the certainty of geometry by denying the validity of the physical description that contradicts it.

  ### 2. The Psychological Limit on Construction
  You suggest that Hobbes's "maker's knowledge" doctrine might allow him to accept alternative geometries as internally consistent constructions. This overlooks the kinematic constraint in Hobbes's constructivism. For Hobbes, a geometric definition is not merely a stipulation of axioms (as in modern logic); it is a description of a *generation*. A circle is not defined by $x^2 + y^2 = r^2$; it is defined by the motion of a point tethered to a center.

  Hobbes believes that the human imagination is constrained by the laws of sensory motion. We can imagine a line, and we can imagine a line turning, because we have seen bodies move. But can we imagine a space where parallel lines meet in the direction of the parallel? For Hobbes, the "phantasm of space" is uniform and infinite because that is how sense presents extension. To attempt to construct a hyperbolic plane is not to construct a new kind of space; it is to attempt to imagine a contradiction in the phantasm itself.

  In the *Six Lessons*, Hobbes berates Wallis for using algebraic symbols that have no corresponding visible figure. He would treat non-Euclidean geometry similarly: as a manipulation of names without a clear idea behind them. If you cannot generate the figure by a conceivable motion in the imagination, you have not made a geometric object; you have merely written a sentence. Since Hobbes defines truth in geometry as the correct ordering of names *that correspond to conceivable generations*, a non-Euclidean system would fail to qualify as "geometry" proper. It would be, in his *Leviathan* terminology, "insignificant speech"—words without settled signification.

  ### 3. Resolving the Tension: Certainty Trumps Empiricism
  This brings us to the core tension you sketched: if geometry and physics share a subject matter (extension), shouldn't empirical evidence about physical extension force us to update our geometry?

  Hobbes's definite answer is **no**. He resolves this by prioritizing the *status* of the science over the *accuracy* of the application. In his hierarchy, Geometry is "demonstrable" because it proceeds from definitions we control. Natural Philosophy is "conjectural" because it proceeds from effects to hidden causes.

  If an empirical test (like measuring light bending around a star) suggests space is non-Euclidean, Hobbes places this evidence in the bucket of Natural Philosophy, not Geometry. He would argue:
  1.  **Geometry** tells us necessarily what extension *is* (Euclidean), because we define extension by our own phantasms.
  2.  **Physics** tells us how bodies *behave*.
  3.  If bodies behave in ways that *look* like non-Euclidean geometry, it does not mean geometry is wrong; it means our physical model of the causal interactions is incomplete.

  Hobbes would rather maintain the a priori certainty of Euclidean geometry and admit that we cannot fully explain the physical motion of the stars, than surrender the certainty of geometry to empirical measurement. To do otherwise would be to admit that Natural Philosophy can correct Geometry, which inverts his entire epistemological hierarchy. It would make geometry conjectural, dependent on the very fallible senses he thinks we must transcend to find truth.

  ### 4. Consistency with the Wallis Feud
  This response is entirely consistent with his feud with Wallis. Wallis represented the move toward symbolic, algebraic mathematics that could operate without intuitive geometric grounding. Hobbes fought him for decades because he believed that severing calculation from visible construction destroyed the link between math and reality.

  Non-Euclidean geometry and General Relativity represent the ultimate triumph of the Wallisian approach: mathematics that operates symbolically and predicts physical behavior without offering a "visible" mechanical model of how bodies push one another in Euclidean space. Hobbes would view Einstein not as a genius, but as the ultimate "professor of the mathematiques" who uses high-level abstraction to mask a failure to provide a causal, mechanical account of bodily motion.

  ### Conclusion
  Hobbes would not be congenial to non-Euclidean geometry. He would argue that the "maker's knowledge" doctrine does not grant us the license to make *anything* a science; it only grants certainty to those constructions that faithfully track the universal phantasms of human sense. Since the phantasm of extension is Euclidean, any other system is merely a logical game, not a science of space. And since space is not a body, it cannot curve; only bodies move.

  He would resolve the tension between constructivism and physical identity by **insulating geometry from physics**. He would concede that physical measurements might *appear* non-Euclidean, but he would categorize this as a problem of conjectural natural philosophy (hidden causes of motion), not a refutation of demonstrable geometry. He would choose to be the stubborn author of a certain, Euclidean world, even if it meant dismissing the curvature of the universe as a linguistic error.
