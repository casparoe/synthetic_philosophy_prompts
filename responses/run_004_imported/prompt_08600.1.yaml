answer: |-
  **Setting:** *The supply room of the St. Jude Rural Clinic. The hum of the refrigerator is the only sound until the alarm on the triage timer beeps softly. On the metal table sits a single vial of polyvalent antivenom. Dr. Aris holds it. Dr. Ben stands opposite her, gloved hands resting on the table.*

  **Ben:** Room B, Aris. There are five of them in there. The bites are deep, systemic. Without this, they don't make the hour.

  **Aris:** And Room A?

  **Ben:** One patient. Same severity.

  **Aris:** I know the severity. I'm asking about the choice. You're saying we walk past Room A without stopping.

  **Ben:** I'm saying we save the five. It's the only decision that doesn't leave us with a bloodbath on our conscience.

  **Aris:** It's not a bloodbath if it's a tragedy. Look, Ben, I know what the calculus says. Five is greater than one. But Taurek was right. That math is a fiction. No one *experiences* "five deaths." There is no single consciousness that feels the weight of the group. Each of those five people loses exactly what the guy in Room A loses: their one life.

  **Ben:** I'm not adding up the pain, Aris. I'm not a utilitarian. I'm looking at the claims. Each of the five has a claim to be saved that is identical in strength to the claim of the one.

  **Aris:** Exactly. Identical. So if I have a claim to this vial, and you have a claim to this vial, and we can't both have it, what do we do? We don't say, "Well, Ben, you brought four friends into the room, so your claim is now five times heavier." That violates the separateness of persons. You're still just Ben. The guy in Room A is still just one person. To respect him as an equal, I have to give him a fighting chance. A coin flip.

  **Ben:** A coin flip treats the decision like a random accident. It abdicates moral responsibility. If I flip that coin and it lands on Room A, I have to look the five in Room B in the eye and tell them, "You died so that a probability distribution could remain satisfied."

  **Aris:** I'm not doing it for the distribution. I'm doing it for *him*. If we walk to Room B, we are deciding that his life is worth less than the sum of the others. But it's not less to *him*. From his perspective, losing his life is a total loss. It's 100% of his world. You can't dilute that total loss by pointing to four other total losses happening down the hall.

  **Ben:** But you're missing the contractualist angle. Think about what principle we are acting on. We need a rule that no one could reasonably reject. If we adopt the rule "save the greater number," can the single patient reasonably reject it?

  **Aris:** Yes. He can say, "My death is just as bad as any of theirs. Why should my certain death be traded for their certain survival just because there are more of them? That uses me as a means to maximize survival statistics."

  **Ben:** No, it doesn't use him as a means. It acknowledges his claim is equal, but it also acknowledges that there are *more* people with that equal claim on the other side. If he rejects the principle, he is essentially saying, "My single claim should veto the five claims opposing it." Why is his veto power stronger? If we flip a coin, we are telling the five, "Your individual claims, though equal to his, collectively count for nothing against his individual claim." That seems like the greater disrespect.

  **Aris:** It's not about veto power. It's about fairness in the face of scarcity. When resources are insufficient to satisfy all equal claims, fairness demands a lottery. Imagine we were the patients, Ben. You and me, and three others in one room, me in another. Would you agree to a rule that says you only get a 20% chance of survival because you happened to be standing in a group?

  **Ben:** If I'm in the group of five, I certainly wouldn't agree to a coin flip that gives me a 50% chance of death when you could save me without costing the single person anything *extra*.

  **Aris:** But it does cost him everything!

  **Ben:** It costs him his life either way if we flip and he loses! The cost to him is identical in both scenarios: death. The variable isn't the cost to him; it's the outcome for the world. But more importantly, it's about the justification we offer. To the one, we say: "We saved the five because there were five." To the five, if we flip and they lose, we say: "We saved the one because... chance." Which justification holds up? Taurek thinks chance is neutral. I think chance is cowardly.

  **Aris:** It's not cowardice, it's humility. It's admitting that we don't have the authority to weigh lives. You say the one can't reasonably reject the "save the most" principle. But Scanlon himself admitted this is the hardest case. Because from the *inside* of the one person's perspective, the numbers don't exist. There is only him and the vial. If we prioritize the group, we are validating the idea that an individual's right to life is subject to a headcount. That's a terrifying precedent for a clinic. What if next time it's not five? What if it's ten? Does the one's claim diminish as the crowd grows?

  **Ben:** His claim doesn't diminish. It remains absolute. But it meets a conflict. When claims conflict, we look for the solution that minimizes the number of people who have grounds for complaint. If we save the one, five people have a valid complaint: "You could have saved me." If we save the five, one person has that complaint. The complaint is the same in both cases—"I died when I could have lived"—but the *number of complainants* is different. We aren't summing the harm; we are acknowledging that a principle that generates five valid complaints is harder to justify than one that generates one.

  **Aris:** But that *is* summing, Ben. You're just summing complaints instead of utility. Taurek's point is that morality is about the relation between *me* and *you*. Not me and the collective. If I stand before the one patient, I owe *him* everything I can give. I can't look at him and say, "Well, I'd help you, but there's a crowd down the hall." That makes his worth contingent on how many others are suffering.

  **Ben:** And if I stand before the five, and I walk away because I wanted to be philosophically pure about "separateness," haven't I failed them? I've told them that their distinct, separate lives didn't matter enough to tip the scale. You say a coin flip respects the one. I say it disrespects the five. It tells them their existence as a group is morally invisible.

  **Aris:** It tells them their existence is separate! That's the point! We don't merge them into a single entity called "The Five." We acknowledge them as five individuals, each of whom gets a 50% chance in the lottery. The one gets a 50% chance. That is equality. Saving the group automatically is inequality. It privileges the accident of geography—that they happened to be bitten in the same room.

  **Ben:** It's not privilege, it's consequence. We are responsible for the outcomes we can control. I can control who gets the vial. If I choose the one, I am responsible for five deaths. If I choose the five, I am responsible for one. The separateness of persons doesn't vanish because we make a choice. But the moral weight of leaving five to die when you could have saved them... that weight exists regardless of whether the five feel it as a group.

  **Aris:** The weight exists for *us*, the doctors. Not for the moral math. We feel the guilt. But that doesn't mean the one patient deserves to die less.

  **Ben:** He doesn't deserve to die less. He deserves to be saved just as much. But he can't be saved without the five dying. The five can be saved without him dying *if* we had more vials. We don't. So we have to choose whose survival we prioritize. And prioritizing the greater number isn't aggregation; it's recognizing that if every single person in that room asked, "What should you do?" the majority answer would be "Save us."

  **Aris:** Unless the one asks. Then the answer is "Save me." And his voice is just as loud.

  **Ben:** But it's one voice against five.

  **Aris:** And in a court of rights, Ben, one voice is enough to stop an execution.

  *(The timer beeps again, louder this time. A nurse knocks on the door frame.)*

  **Nurse:** Doctors? We're losing stability in Room B. And Room A is seizing. I need to know where to bring the tray.

  *(Aris looks at the vial in her hand. Ben looks at Aris. Neither blinks.)*

  **Ben:** You know what the principle requires.

  **Aris:** I know what the person requires.

  *(They stand frozen, the vial suspended between them, the silence of the room heavy with the weight of the unchosen.)*

  **[SCENE END]**
