answer: |-
  Good evening. For those who don't know me, I'm Priya Okonkwo. I had the privilege of being supervised by Judith during my doctoral studies, which is a polite way of saying I spent three years being taught how to think clearly, usually while being told exactly why I was failing at it.

  We are here to celebrate Judith's retirement, which means the academy is finally safe from her corrections. We all know the scene. You're at a dinner party, someone mentions a tyrannical regime, and they say, "Well, those decrees weren't *really* law." And before the soup arrives, Judith has paused her spoon to explain that yes, they were law. They were validly enacted, socially efficacious, and morally monstrous. And that distinguishing those facts is the only way to ensure we don't confuse what *is* with what *ought to be*.

  To the family and friends here: I know this sounds like semantics. You've heard Judith complain about a man named Fuller for decades without knowing why. But to Judith, this distinction is moral armor. Her positivism isn't a shield for authority; it's a tool for honesty. She argued that calling evil "law" doesn't mean you obey it. It means you admit the truth: that a legal system can be valid and still deserve resistance. When she wrote about the Grudge Informer case, her point wasn't to protect the informers. It was to say that pretending the Nazi statutes weren't law was a dishonest way to punish the women who used them. She wanted retroactive justice, honestly enacted, not magical thinking about what counts as law. She believes that if you want to fight a monster, you shouldn't pretend it's a ghost.

  Now, I would be remiss if I didn't acknowledge the history in this room. There are colleagues here who remember the debates of the 1970s, specifically the charge that Judith's clarity was complicity. There is a friend sitting two tables away who spent one ugly year telling anyone who would listen that separating law from morality made Judith an apologist for tyranny. We know now that was wrong. Judith never confused validity with virtue. But wounds from old arguments don't heal just because the theory is settled. It takes courage to sit in a room with someone who once misunderstood your life's work, and it takes even more to share a meal. I see that courage tonight, and I think Judith does too.

  But since we are dealing with definitions, I feel compelled to address a specific citation. Lon Fuller once published a famous reply to H.L.A. Hart titled "Positivism and Fidelity to Law." It was meant as a critique. However, having spent time in Judith's home as well as her office, I can offer a corrective. I can testify that while Judith may insist that legal authority is conventional, her fidelity to her marriage is nothing less than natural. She has never sought to separate her vows from her morality, even if she does insist on defining the terms.

  Judith, you have spent forty years teaching us that the law is one thing, and its merit another. But you have also shown us that rigor is a form of care. You correct us because you want us to be precise, and you demand honesty because you believe truth matters more than comfort. You are retiring from the department, but I suspect you'll remain the last unapologetic defender of clarity at every dinner table you visit.

  So, please raise your glasses. To Judith Ansel: for the validity of your arguments, the merit of your character, and the honesty of your legacy. To Judith.
