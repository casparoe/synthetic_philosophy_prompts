      *   *Section 2: The Bet.* Introduce the "No-Trade Theorem." The offer itself is info. If she's willing to bet, she's more confident than she says, or she thinks you're wrong.
      *   *Section 3: VC Context.* VC isn't pure probability. It's power laws. 35% vs 65% might not matter as much as "Is this a home run?" But for the bet, it does matter.
