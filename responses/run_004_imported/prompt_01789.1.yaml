      *   *Is the bet at even odds?* Yes. If User thinks 65% fail, User sees +EV. If Priya thinks 65% succeed, she sees +EV.
      *   *Why is it a trap?* Because the *offer* updates the probabilities. If Priya is rational, she wouldn't offer a bet unless she thought she had an edge *beyond* the 65%. Maybe she knows something else, or she knows you're biased.
