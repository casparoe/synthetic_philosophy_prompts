      *   *Averroes (1126–1198):* Represents the Aristotelian tradition in Islam. Key concept: Natures have inherent powers. Science depends on understanding *why* things happen necessarily based on essence.
      *   *The Cotton Example:* Ghazali asks: How do you *know* fire causes burning? You only see conjunction. God could create the contact and the burning separately.
      *   *Averroes' Rebuttal:* If you deny the nature of fire is to burn, you deny the definition of fire. Science becomes impossible. Miracles are exceptions to the rule, not proof that the rule doesn't exist.

  3.  **Drafting - Section by Section:**

