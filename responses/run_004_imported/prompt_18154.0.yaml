prompt: |-
  My colleague Diane is retiring after thirty-one years and I got roped into giving the toast at her dinner next month. Her whole career has basically been one long defense of Williams-style internalism about reasons -- she's the person half our field cites for the canonical reply to the McDowell line that there must be external reasons out there regardless of what anyone actually cares about. She's also genuinely famous in the department for interupting other people's toasts to point out when an "ought" isn't hooked to anything in the speaker's actual motivational set -- she heckled a colleague's retirement speech for exactly this two years ago. Which is a problem for me, because toasts run on exactly that move: "be more like her," "let her be an example to us all" -- a bare, desire-independent ought, which is precisely what she's spent thirty years arguing is either false or really something else in disguise. Half the room will be former grad students who'll clock this instantly; the other half will be her sister and a couple of college roommates who've never heard the phrase "sound deliberative route" in their lives. Can you write me the actual toast -- five minutes, genuinely moving, and it has to solve the problem rather than dodge it, so that whatever it ends up exhorting people to do is tied to something already sitting in their own S, not just handed down from nowhere.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for a colleague, Diane.
      *   **Tenure:** 31 years.
      *   **Key Philosophical Stance:** Williams-style Internalism about Reasons (Bernard Williams). Specifically, the idea that for something to be a reason for an agent to $\phi$, it must be grounded in their "subjective motivational set" (S). There are no "external reasons" (reasons that apply regardless of what the agent cares about).
      *   **The Conflict:** Toasts typically rely on external reasons ("You *ought* to be like her," "We *should* all strive for..."). Diane famously interrupts toasts that violate her internalism (heckled a colleague 2 years ago for this).
      *   **The Audience:** Mixed. Half philosophers/grad students (will spot the technical nuance), half family/non-philosophers (need it to be accessible and moving).
      *   **The Goal:** A 5-minute toast that is genuinely moving, acknowledges her philosophy without being a lecture, and *solves the problem* by grounding any exhortations in the audience's existing motivational sets (S), rather than issuing bare "oughts."

  2.  **Deconstruct the Philosophical Constraint (Williams Internalism):**
      *   *Core Thesis:* "A has a reason to $\phi$ only if A could reach the conclusion to $\phi$ by a sound deliberative route from the motivations already in A's S."
      *   *The Trap:* Saying "We ought to emulate Diane" implies an external reason. If no one in the room cares about emulating Diane, the statement is false (on her view).
      *   *The Solution:* I need to show that the audience *already* cares about the things Diane represents. I need to connect her life to *their* existing desires/values. I need to frame the "ought" as a hypothetical imperative or an elucidation of what they already want, not a categorical command.
      *   *Tone:* Respectful, witty (acknowledging the heckling risk), warm, sincere.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the elephant in the room. Address Diane's reputation for heckling toasts. This disarms the tension and shows respect for her intellect.
      *   **The Philosophical Pivot:** Briefly explain the constraint without jargon (for the sister/roommates) but with enough precision (for the grad students). Frame it as "Diane doesn't believe in being told what to do unless it matters to us."
      *   **Connecting to the Audience (The "S" Set):** This is the crucial part. I need to identify what is *already* in the audience's motivational set.
          *   *Grad Students/Colleagues:* Care about truth, integrity, mentorship, being heard.
          *   *Family/Friends:* Care about love, consistency, loyalty, being known.
      *   **Reframing the Exhortation:** Instead of "You should be like Diane," say "If you care about X (which you do), then Diane shows you how to achieve X." This makes the reason internal.
      *   **Closing:** A wish for her retirement that aligns with *her* S (what does she care about now?), and a final cheers that validates the shared values.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Diane hates toasts that say "you ought." She says reasons come from within. So I won't tell you to be like her. But if you want to be good at philosophy, look at her. If you want to be a good friend, look at her. Because you already want those things. So she gives you a route. Diane, hope you find lots of reasons to be happy in retirement. Cheers.
      *Critique:* Too dry. Needs more emotion and flow. Needs to handle the mixed audience better.

  5.  **Drafting - Iteration 2 (Adding Flavor & Nuance):**
      Start with the heckling story. It's funny and sets the stakes. Explain "internal reasons" simply. "Diane believes you can't tell people what to do unless they already want to do it." Then talk about her career. She defended truth. She defended people. Now, for the "ought." "I'm not going to say we ought to follow her. I'm going to say, we all want to matter. We all want to be right. Diane shows us how."
      *Critique:* Better. But needs to be tighter on the Williams logic to satisfy the grad students. The phrase "sound deliberative route" should probably appear but be explained contextually.

  6.  **Drafting - Iteration 3 (Refining the Logic & Emotion):**
      *   *Hook:* The fear of being heckled.
      *   *Philosophy:* Translate "Subjective Motivational Set" into "what we actually care about."
      *   *The Move:* Don't say "Be loyal." Say "You value loyalty. Diane mastered it. Therefore, you have a reason to learn from her."
      *   *The Family Angle:* Connect the philosophical rigor to personal integrity. It's the same thing.
      *   *The Retirement:* Wish her reasons that align with her new S.

  7.  **Final Polish (incorporating into the final output):**
      *   Make sure the transition from philosophy to emotion is seamless.
      *   Ensure the "exhortation" is clearly framed as conditional on the audience's existing values.
      *   Check timing (approx. 750-850 words for 5 minutes spoken at a moderate pace).
      *   *Self-Correction on the "Ought":* I must avoid saying "We should." Instead use "We might find," "If you share," "There is a path."
      *   *Specific Williams Reference:* Mention the "sound deliberative route." It's the shibboleth the grad students will look for.

  8.  **Final Review against Constraints:**
      *   5 minutes? Yes.
      *   Moving? Yes, focuses on shared values.
      *   Solves the problem? Yes, grounds reasons in the audience's S.
      *   Accessible? Yes, explains the philosophy simply.
      *   Accurate? Yes, respects the internalist framework.

  **(Self-Correction during drafting the final text):** I need to make sure I don't accidentally slip an external reason in. Even saying "Let's raise a glass" could be interpreted as a command. I should frame it as "If we want to honor her..." or "Given that we are here..." Actually, "Let's raise a glass" is usually performative, not normative. I'll stick to normative claims about behavior being the danger zone. I will explicitly state *why* I am phrasing things the way I am, to show Diane I get it.

