answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm a colleague of Diane's. And for those of you who *do* know me, you know I am currently sweating through my shirt.

  Two years ago, at Jim's retirement dinner, Diane famously interrupted the keynote speech. Jim had said, "We ought to strive for greater integrity in our work." Diane stopped him mid-sentence to point out that unless "striving for integrity" was already connected to something the audience actually cared about, the statement was, in her view, false. She called it a "bare, desire-independent ought."

  Jim was mortified. The grad students were thrilled. And I have spent the last month terrified that if I use the word "should" incorrectly tonight, Diane will stand up and correct my grammar before I get to the wine.

  So, Diane, I want to start by acknowledging the constraint. You have spent thirty-one years teaching us that you cannot give someone a reason to act unless that reason hooks into their "subjective motivational set." In plain English: You can't tell people what to do unless it matters to them already. There are no external reasons. No cosmic commandments.

  And you are right. If I stand here and tell this room, "You ought to be more like Diane," I am lying. If nobody in this room cares about rigor, or loyalty, or truth, then my exhortation is noise. It's just sound without sense.

  But looking around this room, I see a different picture.

  To Diane's sister and her college roommates: You are here because you value consistency. You value the person who shows up, who remembers birthdays, who tells the truth even when it's awkward. That is already in your motivational set. You already care about that.

  To the colleagues and former students: You are here because you value intellectual honesty. You care about the difference between a sound argument and a clever one. You care about mentorship that doesn't patronize. That is already in your set, too.

  So, I am not going to tell you to *be* like Diane. I am going to suggest that if you care about the things I just listed—and the fact that you showed up tonight suggests you do—then Diane offers you a sound deliberative route to achieving them.

  She shows us that defending internalism isn't about being selfish. It's about being honest about where motivation comes from. For thirty years, she has refused to let us hide behind fake reasons. She has forced us to ask, "What do we actually want? What do we actually value?" And then she has shown us how to build a life that honors those values without lying about them.

  If you want to be a person whose "oughts" actually land, you look at how she listened. If you want to be a scholar whose objections clarify rather than destroy, you look at how she argued. She never told us to care about the truth; she simply made caring about the truth the only viable path through the conversation.

  Diane, for you, the retirement phase begins now. For thirty years, your motivational set was dominated by the department, the students, and the argument. Williams says that as our motivations change, our reasons change. So I will not say, "You ought to relax." I will not say, "You should travel."

  Instead, I look at what I know of you. I know you care about curiosity. I know you care about time that is truly your own. So, my wish is that you find a new sound deliberative route from *those* desires. May you find reasons to read the books you never had time for. May you find reasons to take the long walk without checking your email. May you find that the world is full of internal reasons for joy, waiting for you to locate them in your own set.

  To the rest of us: We don't need to be told to honor her. We are already here. We already value what she built. The reason to toast her is already in the room, in our shared history, and in our gratitude.

  So, given that we value her, and given that we want to acknowledge the impact she's had on our own motivations...

  Please raise your glasses.

  To Diane.
