      *   **Section 1: The Mechanism of Causality (Rays vs. Angles).** Contrast Ptolemaic effluvia with Keplerian geometry.
      *   **Section 2: The Role of the Earth (Passive vs. Active).** The *Anima Terrae* concept.
      *   **Section 3: The Zodiac and Aspects (Arbitrary vs. Musical).** Why signs go, aspects stay (but change definition).
      *   **Section 4: Is it still Astrology?** Address the terminology question. Distinguish between *astrologia naturalis* and *judiciaria*.
      *   **Conclusion:** Summarize the tension between his rigorous theory and his pragmatic practice.

  7.  **Self-Correction/Fact Check during drafting:**
      *   *Did Kepler completely reject the zodiac?* He rejected the *mythological/qualitative* nature of signs, but used them as a coordinate system. He cared about the ecliptic position for calculating angles.
      *   *Did he reject houses?* Yes, largely. He focused on aspects relative to the horizon/meridian but stripped the mystical house meanings.
