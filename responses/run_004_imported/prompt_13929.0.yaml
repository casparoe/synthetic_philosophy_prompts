answer: |-
  **Axiom of Continuity**

  The silence in the house had a frequency, Elias decided. A low, humming null set that filled the space where Sarah's breathing used to be.

  It had been twenty-three days. Elias had counted them, not out of morbid obsession, but because counting was a function of order, and order was the only barrier he had against the chaos.

  He sat at his desk, the green banker's lamp casting a pool of light over a fresh notebook. He wasn't working on topology tonight. He was working on salvation.

  He dipped his fountain pen and wrote: *Proposition 1: The universe exhibits a rational structure.*

  He paused. The ink pooled slightly at the tail of the *e*. It was a bold claim, one he'd spent a lifetime assuming but never formally proving. But if it were false, then entropy was the only god, and Sarah was just scattered carbon. He couldn't accept that. Therefore, the proposition had to be true. He underlined it.

  *Proposition 2: Moral and intellectual development is a cumulative function.*

  Sarah had learned so much in her last year. Even as the sickness ate the muscle, her mind had sharpened. She had read Proust. She had forgiven her father. She had learned to let go. To delete that data upon termination was inefficient. It was wasteful.

  Elias wrote: *Theorem: Consciousness cannot terminate at zero.*

  He leaned back, the chair creaking in the quiet. It was Gödel's argument, distilled. The great logician had written this to his mother, decades ago. *The world is too rationally ordered,* Gödel had insisted, *for a person's whole moral development to just get cut off pointlessly.*

  Elias looked at the empty armchair in the corner. Sarah's reading chair. A throw blanket was draped over the arm, exactly where she'd left it.

  "If the system is consistent," Elias whispered to the room, "then you must persist. A discontinuity here violates the axioms."

  He waited for the comfort to arrive. He waited for the logical necessity of her existence to warm the cold spot in his chest.

  In his mind, he saw Sarah's face. Not the gaunt face of the end, but the vibrant one from their trip to Prague. She was looking at his notebook. She was smiling, that sad, knowing tilt of the head she used when he tried to fix a leaky faucet with a spreadsheet.

  *"Eli,"* she would say. *"You're trying to solve me like I'm a paradox."*

  *"I'm trying to prove you're still here,"* he answered the memory.

  *"Does it matter if it's a proof?"*

  *"If it's proven, it's true. If it's true, I don't have to be afraid."*

  *"But you are afraid."*

  Elias looked down at the notebook. The logic was sound. If you accepted the axioms, the conclusion was inescapable. There was no variable for death. There was only a transformation of state.

  But the silence in the house didn't care about his axioms. The dust motes dancing in the lamp light weren't rearranging themselves into her shape. The cold coffee in her mug on the side table wasn't warming up.

  He realized then what Gödel must have known when he sent those letters. The proof wasn't for the believer. It was a bridge built from one side of a canyon, reaching out into the fog, hoping the other side was actually there.

  Gödel had written to comfort his mother. Elias was writing to comfort himself, and failing.

  Logic required detachment. Grief was nothing but attachment. You could not hold both in your hands without one crushing the other.

  Elias capped his pen. The ink was still wet, a black scar on the white page. *Theorem: Consciousness cannot terminate at zero.*

  It was a beautiful argument. It was elegant. It was consistent.

  And it did not bring her back.

  He closed the notebook. He stood up and walked to the armchair. He picked up the throw blanket, which still held the faint, impossible scent of her shampoo. He sat down in the chair, pulling the blanket over his knees, and turned off the lamp.

  In the dark, the math didn't matter. The silence hummed its null set, and for the first time in twenty-three days, Elias stopped trying to solve it. He just sat in the equation, undefined, and wept.
