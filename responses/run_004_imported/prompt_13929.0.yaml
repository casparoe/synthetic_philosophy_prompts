prompt: |-
  My uncle died a few weeks ago and I've been kind of obsessively reading about how different thinkers tried to argue their way into an afterlife instead of just taking it on faith. The one that's stuck with me most, honestly, is Gödel — apparently in letters to his own mother he tried to convince her, using actual logical argument instead of religion, that there basically had to be some kind of continuation after death, because the world is too rationally ordered for a person's whole moral and intellectual development to just get cut off pointlessly. Which is such a wild thing to try to prove to your grieving mom with logic instead of just comforting her the normal way.

  Could you write me a short story built around that exact tension? Picture someone (a mathematician, or just someone who thinks that way) who looses somebody and tries to reason their way to consolation like Gödel did, instead of leaning on faith — and let the story decide for itself whether that kind of reasoning actually holds up emotionally or just falls apart under the weight of it. Keep it fairly short, flash-fiction length is fine.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Topic:** A grieving person (mathematician/logical thinker) trying to reason their way into believing in an afterlife, inspired by Kurt Gödel's letters to his mother.
      *   **Core Tension:** Logic/Reason vs. Emotion/Grief. Can formal proof provide comfort, or does it crumble under the weight of loss?
      *   **Format:** Short story / Flash fiction.
      *   **Tone:** Melancholic, intellectual, intimate, ultimately ambiguous or revealing about the limits of logic.
      *   **Key Detail:** Gödel's argument: The world is rationally ordered; therefore, moral/intellectual development cannot be cut off pointlessly.

  2.  **Character & Setting:**
      *   *Protagonist:* Elias. A logician or mathematician. Someone who finds safety in axioms.
      *   *Deceased:* His wife, Sarah. (Spousal loss often feels more immediate/intimate than an uncle for a short story, though the prompt mentions an uncle. I'll stick to a partner or close family member to raise the stakes. Let's make it his father to mirror the Gödel/mother dynamic, or a wife. A wife feels more poignant for "moral development" shared together. Let's go with a wife, Sarah).
      *   *Setting:* Their study. Late night. Papers, chalkboard, or just a notebook.

  3.  **Plot Outline:**
      *   **Beginning:** Elias is working on a "proof." The house is quiet. The loss is fresh.
      *   **Middle:** He writes out the argument. The Gödelian logic: Premise 1 (Order), Premise 2 (Justice/Completion), Conclusion (Continuation). He tries to show it to her (in memory) or imagine her reaction.
      *   **Climax:** The logic holds up formally, but fails emotionally. A crack in the axiom.
      *   **Ending:** He puts the pen down. The silence remains. A moment of acceptance that logic isn't warmth.

  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Setup.* Elias at the desk. The silence of the house. The notebook. He's not doing math; he's doing metaphysics.
      *   *Scene 2: The Argument.* He writes the axioms.
          *   Axiom 1: The universe is rational.
          *   Axiom 2: Consciousness is a cumulative function.
          *   Theorem: Discontinuity is impossible.
      *   *Scene 3: The Conflict.* He tries to feel better. He looks at her photo. The logic says she *must* be there. But the room is empty.
      *   *Scene 4: The Realization.* Gödel wrote to his mother to convince *her*. Elias is writing to convince *himself*. The variable he can't solve is "wanting."
      *   *Scene 5: Conclusion.* He closes the book. He doesn't believe the proof, but he keeps it.

  5.  **Refining the Voice:**
      *   Needs to sound precise but fraying at the edges.
      *   Use mathematical metaphors for grief. "Undefined variable," "limit approaching zero," "axiom."
      *   Avoid being too preachy. Show, don't just tell the philosophy.

  6.  **Writing - First Pass (Mental or rough notes):**
      Elias sat at the desk. Sarah was gone. He wrote: If A then B. The world makes sense. So Sarah must be somewhere. He looked at her chair. It was empty. The logic was perfect. Why did he still cry? He realized logic doesn't hug you.

  7.  **Writing - Second Pass (Adding texture and Gödel specific flavor):**
      Let's focus on the specific Gödel argument: *Rational Order implies Moral Completion.*
      Elias writes: "It is inconsistent with the rational structure of the world for a mind to achieve complexity and then vanish."
      He imagines Sarah laughing at him. "Eli, you're trying to solve me."
      The ending needs to be quiet. Not a explosion of emotion, but a quiet defeat of the method.

  8.  **Final Polish (incorporating into the final story):**
      *   *Title:* Something about axioms or limits. "The Incompleteness of Grief"? No, too on the nose. "Axiom of Continuity."
      *   *Sensory details:* The scratch of the pen, the cold coffee, the dust motes.
      *   *The Twist/Resolution:* The proof is valid, but the premises are unprovable. He knows this. He writes it anyway.

      *(Self-Correction during drafting)*: Make sure I don't make him look cold. He's doing this *because* he's hurting, not because he lacks emotion. It's a coping mechanism.

      *(Refining the Gödel connection)*: Explicitly mention the letters or the sentiment. "Gödel wrote to his mother..." Let Elias think about that.

  9.  **Final Review against constraints:**
      *   Short story? Yes.
      *   Gödel tension? Yes.
      *   Logic vs. Emotion? Yes.
      *   Flash fiction length? Yes.

      *(Drafting the content...)*
      Start with the pen on paper.
      Define the Axioms.
      Introduce the ghost of the argument.
      End with the silence.

      *Let's write.* (Proceeds to generate story based on these thoughts).

      *Post-Draft Check:* Does it feel resolved? It should feel unresolved, because grief is unresolved. The logic shouldn't "work" to stop the pain, but it might serve as a monument.

      *Key phrase to include:* "The world is rationally ordered."

      *Ending thought:* He puts the pen down. The proof is sound. The heart is not a logical system.

      *(Final Polish)*: Ensure the transition from the abstract logic to the physical reality of the empty chair is sharp.

