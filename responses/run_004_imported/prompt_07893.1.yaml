      *   **Earman & Norton's Hole Argument (Dynamic/Local):**
          *   *Target:* Manifold Substantivalism (Spacetime points have independent reality).
          *   *Mechanism:* Local diffeomorphism (hole transformation) that is identity outside a region ("the hole") but shuffles points inside.
          *   *Premise:* General Covariance (Einstein's field equations hold under diffeomorphism).
          *   *Conclusion:* Indeterminism. If points are real, the metric field inside the hole isn't fixed by data outside. If we want determinism, we must deny points have independent reality (Relationalism or Sophisticated Substantivalism).
          *   *Nature:* Physical/Deterministic (about evolution of fields).

  3.  **Identify the Core Connection (The "Leibniz Equivalence"):**
