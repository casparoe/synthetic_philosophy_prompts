      *   *Metaphysics vs. Physics:* Leibniz relies on PSR/PII (metaphysical principles). E&N rely on Determinism (a physical virtue of theories). This makes the Hole Argument harder for a Newtonian/Substantivalist to brush off as "just metaphysics." It attacks the *predictive power* of GR.
      *   *General Covariance:* This is the technical engine. In Newtonian physics, the laws aren't generally covariant in the same way. GR's diffeomorphism invariance allows the "hole transformation" to generate a new mathematical solution that looks physically distinct *only if* you care about which point is which.

