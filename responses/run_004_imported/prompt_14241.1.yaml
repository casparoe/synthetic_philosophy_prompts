answer: |-
  Here is the strongest possible version of your argument, structured to validate Sidgwick's consistency while directly confronting the most damaging objection regarding his lack of results.

  ***

  ### The Rationality of the Search: Sidgwick's Empirical Theodicy

  Your friend's critique rests on a compelling surface contradiction: How could the architect of *The Methods of Ethics*—a man who subjected moral intuitions to a withering tripartite test of clarity, consistency, and consensus—devote thirty years to investigating table-tipping and telepathy? It looks like a descent from rigor into superstition.

  However, this view misunderstands the architectural load-bearing walls of Sidgwick's ethical system. Sidgwick's involvement in psychical research was not a lapse in his rationality; it was the **logical and necessary culmination of it.** He did not turn to psychical research because he had abandoned his standards of evidence, but precisely because he refused to lower them. Where Kant was willing to solve the problem of morality with a "Postulate of Practical Reason" (believing in God and immortality because morality requires them), Sidgwick demanded a "Fact of Empirical Observation."

  To understand why the Society for Psychical Research (SPR) was the rational continuation of *The Methods of Ethics*, we must look at what the final chapter of that book actually commits him to.

  #### 1. The Commitment: The Dualism of Practical Reason
  In Book III, Chapter XIII of *The Methods*, Sidgwick arrives at a devastating conclusion. He finds that two distinct methods of reasoning—Rational Egoism (maximize my own happiness) and Universal Hedonism (maximize the general happiness)—are both self-evident to reason, yet they frequently conflict.

  If I sacrifice my life for the greater good, Utilitarianism says I am right, but Egoism says I am a fool. Sidgwick calls this the "Dualism of Practical Reason." He admits that unless there is a **"moral order of the universe"**—a cosmic mechanism (like divine judgment or karma) that ensures virtue is ultimately rewarded and vice punished in the long run—then morality is fundamentally irrational. In a godless, materialist universe, the rational agent is often compelled to be immoral.

  Sidgwick refuses to solve this by faith. He writes:
  > *"I do not see how the belief in a moral government of the world can be rationally held, unless it is based on evidence."*

  This is the pivot point. Kant says: *We must believe it to be moral.* Sidgwick says: *If it is true, it must be a fact of nature. If it is a fact of nature, it must be discoverable.*

  #### 2. The Empirical Turn: Why Psychical Research?
  If a "moral order" exists, it implies two metaphysical facts: first, that human consciousness survives death (to receive the reward/punishment), and second, that there is a non-material channel of communication between the human mind and the governing power of the universe.

  In the late 19th century, there was only one scientific domain investigating these specific claims: psychical research. Telepathy suggested mind could operate independent of matter; mediumship suggested survival of death. For Sidgwick, the SPR was not a parlor game; it was the **laboratory of moral theology.**

  He applied the same rigorous skepticism to mediums that he applied to moral intuitions. He was not a believer; he was a gatekeeper. He famously exposed frauds (like the slate-writing mediumity of Eglinton) and demanded strict controls. His friend sees this as a lapse; I argue it is the ultimate consistency. He was treating the "moral order of the universe" not as an article of faith, but as a **hypothesis requiring verification.** He refused to accept the comfort of religion without the evidence of science, but he also refused to accept the despair of materialism without testing the evidence against it.

  #### 3. The Hardest Objection: The Null Results
  Your friend's strongest point is the argument from null results. Sidgwick searched for decades and found no conclusive proof of survival or telepathy. By his own empiricist lights, shouldn't the failure to find evidence after such a prolonged search count as evidence of absence? Shouldn't he have concluded that the "further fact" did not exist and accepted the Dualism as unresolved?

  This is the critical test of my argument. Here is why the null results did not compel Sidgwick to abandon the search, consistent with his own epistemology:

  **A. The Asymmetry of Negative Evidence in Metaphysics**
  Sidgwick understood that the phenomena he sought were not like rocks or stars. They were contingent on human consciousness, which is notoriously fragile and subjective. In *The Methods*, he acknowledges that some truths may be beyond our current cognitive grasp. To claim that "no evidence found" equals "evidence of non-existence" requires the assumption that if the moral order existed, it *would* have manifested empirically by 1900. Sidgwick, the fallibilist, could not make that claim. The absence of a black swan is not proof that all swans are white, especially when the pond is as murky as the human psyche.

  **B. The Magnitude of the Stakes**
  For Sidgwick, the hypothesis wasn't just "do ghosts exist?" It was "is the universe moral?" The cost of a Type II error (falsely rejecting the moral order) was the collapse of the rationality of ethics itself. If he declared the search over based on null results, he was effectively declaring that Reason is fundamentally flawed (because it commands contradictory duties).
  Given the existential magnitude of the claim, Sidgwick was rationally justified in demanding a higher threshold for falsification than verification. A single, verified instance of survival would resolve the Dualism; a thousand failed séances do not definitively disprove it, because the failure could lie in the methodology or the medium, not the metaphysics.

  **C. The "Hope" vs. "Belief" Distinction**
  Sidgwick never claimed to *believe* the evidence was sufficient. He claimed the *search* was necessary. In his correspondence, he maintains an agnostic stance. He argues that while the evidence is insufficient to compel belief, it is sufficient to keep the hypothesis open. To close the file would be to dogmatically assert Materialism, which is just as much an act of faith as asserting Spiritualism. By keeping the SPR active, he was preserving the **possibility** of a rational morality against the encroaching dogmatism of scientific materialism.

  ### Conclusion
  Your friend sees a man who demanded proof in ethics but accepted scraps in science. I see a man who realized that the "proof" required for ethics might lie outside the bounds of traditional physics.

  Sidgwick's psychical research was an act of intellectual honesty. He identified a hole in the foundation of rational morality (the Dualism). He refused to patch it with the plaster of Faith (Kant). He went out to find the brick of Fact. That he did not find the brick does not mean he was wrong to look, nor does it mean he lowered his standards. It means he had the courage to live with the uncertainty of a search that mattered more than the comfort of a conclusion.

  He remained consistent to the end: **He would not believe without evidence, but he would not cease searching simply because the evidence was shy.** That is not a lapse in rationality; it is the hardest kind of rationality there is.
