answer: |-
  This is a strong draft. It captures a specific cluster of confusion that persists in the AI safety discourse, and it does so without getting bogged down in excessive formalism. It reads like a natural fit for the Alignment Forum or LessWrong.

  Here is a critical read addressing your three specific questions, followed by some general suggestions for tightening the argument.

  ### 1. Representation of the Objections

  **Rohin Shah's Vacuity Objection:**
  You have represented this fairly. The core of Rohin's argument (from *The Behaviorist View of AI* and related sequences) is that without constraints on the *domain* of the utility function (e.g., outcomes vs. trajectories) or the *complexity* of the function, EUM is unfalsifiable.
  *   **Nuance to consider:** You might want to explicitly mention that the "standard" coherence argument usually implicitly assumes utility is defined over **world-states** (or outcomes), not action-histories. The vacuity objection works by expanding the domain to action-histories. Making that domain-shift explicit clarifies why the objection feels like a "gotcha" to some and a "trivial truth" to others.

  **Elliott Thornley / Completeness Objection:**
  You are right to flag the attribution. The specific argument that *resolute choice* allows an agent to avoid money pumps despite incomplete preferences is older than Thornley; it is most famously associated with **Edward McClennen** (*Rationality and Dynamic Choice*, 1990).
  *   **Thornley's Contribution:** Thornley's recent work (e.g., *Why Subagents?*, *Coherence Theorems for AI*) applies this to AI safety specifically to argue that **incomplete preferences might be a feature, not a bug** (specifically for shutdownability). He argues that an agent with incomplete preferences over trajectories (e.g., indifferent between "shut down now" and "shut down later," but preferring either to "never shut down") won't resist shutdown.
  *   **Recommendation:** Credit McClennen for the decision-theoretic mechanism, but credit Thornley for popularizing its application to the *AI safety* context (specifically the shutdown argument). This shows you've done the homework without overstating Thornley's role in the underlying math.

  ### 2. Standard Defenses Against Resolute Choice

  You asked if there is a standard defense you are missing. There are two main counter-arguments used in the literature that you should acknowledge to steelman the coherence side:

  **A. The "Internal Commitment Cost" (Subagent Argument)**
  To act resolutely, an agent must bind its future self to a plan made by its past self. If the agent is a monolithic optimizer, "binding" is trivial. But if the agent has incomplete preferences, why does the future self respect the past self's resolution?
  *   **The Defense:** Implementing resolute choice requires an internal mechanism to enforce commitment against local incentives. Critics argue this effectively decomposes the agent into a **principal (planner)** and an **agent (executor)**. If the executor has incomplete preferences, the principal must have a complete utility function over the executor's behavior to enforce the plan. Thus, coherence is pushed up a level of abstraction rather than eliminated.
  *   **Relevance:** This connects to the "subagents" argument (often associated with Yudkowsky or the *Mesa-Optimizers* literature). If you need a subagent to enforce coherence, does that subagent have complete preferences?

  **B. The Domination Argument**
  This is less about money pumps and more about **dominance**.
  *   **The Defense:** If you have incomplete preferences, there exists *some* completion of those preferences (a specific utility function consistent with your partial ordering) that would have dominated your actual choices. By remaining incomplete and using resolute choice, you are effectively leaving expected utility on the table relative to a completed version of yourself.
  *   **Relevance:** This shifts the argument from "you will be money-pumped" to "you are leaving value on the table." For a sufficiently capable optimizer, leaving value on the table is itself a selection pressure.

  ### 3. The Closing Claim: Empirical vs. Mathematical

  Your closing claim is: *"The interesting content here is empirical, about what training actually selects for, rather than mathematical."*

  This is fair, but I suggest a slight terminological shift to make it more robust against pushback.
  *   **Critique:** Calling it "empirical" might imply "we just have to run the experiment and see." Opponents might argue that we can derive the likelihood of coherence from first principles of learning theory (e.g., SGD biases, simplicity priors).
  *   **Suggestion:** Frame it as a claim about **Inductive Biases** rather than pure empiricism. The mathematical theorems tell us what coherence *is*. The AI risk argument relies on the claim that **optimization pressure + generalization** selects for coherence. Whether that selection pressure is strong enough to overcome the complexity cost of a complete utility function is a question of **learning theory and inductive biases**, not just decision theory.
  *   **Why this helps:** It prevents the coherence proponent from saying, "It's not empirical, it's logical!" You can reply, "It's logical that *if* coherent, *then* EUM. It is an empirical/theoretical claim about learning dynamics that *training implies* coherent."

  ### General Suggestions & Nitpicks

  1.  **VNM vs. Savage:** You mention VNM specifically. VNM applies to risk (known probabilities). AI systems operate under uncertainty (unknown probabilities). The **Savage Sure-Thing Principle** is often the more relevant coherence theorem for AI. You don't need to rewrite the post, but adding a parenthetical "(or Savage-style axioms for uncertainty)" adds rigor.
  2.  **Instrumental Convergence:** You mention instrumental incentives (power-seeking) at the start. You might want to explicitly link the "simple utility function" point to instrumental convergence. If utility is defined over action-histories (the vacuity case), instrumental convergence often fails (a thermostat doesn't seek power). The coherence argument for AI risk *requires* utility over world-states to get power-seeking. Making this link explicit strengthens your critique.
  3.  **Title:** "Coherence arguments and the goal-directedness gap" is good. Alternatively, "Coherence Arguments Do Not Imply Goal-Directedness" is punchier but perhaps too strong given your tentative conclusion.
  4.  **Tone Check:** The draft is charitable and analytic, which fits LW/AF well. Avoid the phrase "I didn't expect to find as convincing" in the second objection paragraph; it's a bit meta. Just state that you find it convincing.

  ### Revised Paragraph Suggestion (for the Resolute Choice section)

  *Current:* "The second objection, which I didn't expect to find as convincing, targets completeness specifically, and I think it's due to Elliott Thornley's work on this (possibly misremembering the attribution)."

  *Proposed:* "The second objection targets the completeness axiom. While often discussed in recent AI safety work by Elliott Thornley (specifically regarding shutdownability), the underlying decision-theoretic move traces back to Edward McClennen's work on resolute choice. The standard money-pump story assumes an agent evaluates trades myopically..."

  ### Summary Verdict

  You are not missing any "gotchas" that would invalidate the post. The draft is philosophically sound enough for the forum. The main value-add you can make is to:
  1.  Clarify the McClennen/Thornley attribution.
  2.  Acknowledge the "Domination" and "Subagent" counter-arguments to show you've considered the full dialectic.
  3.  Refine "empirical" to "inductive biases/learning dynamics."

  If you make those tweaks, this is ready to post. It addresses a common confusion without being dismissive of the underlying safety concerns.
