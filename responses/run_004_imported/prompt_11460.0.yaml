      *   *Advice:* Acknowledge it's a known tension but emphasize that the *specific* tension between Good's normative claim and the *phenomenology* of dread is where the value lies. Don't pretend you discovered the tautology problem, but frame it as "Good's theorem forces this problem into the open."

