  9.  **Refining the Good's Theorem Statement:**
      *   One small technicality: Good's theorem assumes the agent can *ignore* the information. If receiving the information *forces* an action (e.g., a mandatory test), the theorem doesn't apply. The text says "remain free to act however the evidence moves them," which covers this.
