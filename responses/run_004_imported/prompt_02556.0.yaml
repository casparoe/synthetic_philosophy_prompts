answer: |-
  **Setting:** *A quiet corner of the university courtyard, late afternoon. Two students, WEI and JIAN, sit on a stone bench. JIAN is holding a copy of the* Mencius, *tapped open with a pen. WEI is staring at a coffee cup, looking distracted.*

  **Jian:** You've been staring at that lid for ten minutes. Is it the caffeine or the text?

  **Wei:** Both, maybe. Mostly the text. My professor kept bringing up Liu Qingping's critique in seminar today. The "corruption" argument.

  **Jian:** Ah. The idea that Confucianism is just institutionalized nepotism.

  **Wei:** It's reductive, but it sticks. Especially when you look at *Mencius* 7A35. Shun's father, Gusou, murders someone. Gao Yao, the judge, is doing his job. And Shun's solution is to… what? Abdicate the throne? Carry the old man on his back like a sack of rice and hide by the sea?

  **Jian:** It's not just "reductive," Wei. It's dangerous. If you take this passage literally, you're saying that if your dad kills someone, your moral obligation is to help him evade justice, even if you're the head of state. That's not ethics. That's a conspiracy.

  **Wei:** But you're reading it like a legal contract. You're seeing Shun as a bureaucrat who happens to be a son. Confucian role ethics says the opposite: Shun is a son who happens to be a bureaucrat. The sonhood is the root; the kingship is the branch.

  **Jian:** That's exactly the problem. You're prioritizing the biological node over the social network. Think about the victim. Gusou didn't kill a sheep; he killed a person. That person had a father, a family, a community. By letting Gusou walk, Shun is saying, "My father's life weighs more than that victim's life." How is that not the definition of partiality?

  **Wei:** It's not about weight. It's about source. *Mohist* impartial care—*jian'ai*—sounds beautiful on paper. Love everyone equally. But where does that love come from? If I can't feel the visceral, non-negotiable pull of my own father's suffering, how am I supposed to feel it for a stranger?

  **Jian:** You feel it because the stranger's suffering is *real*. It doesn't need to be routed through your dad to be valid.

  **Wei:** But you won't *act* on it. That's the Confucian critique of Mohism. You demand impartiality, but you can't live it. No one can. Confucius isn't saying "ignore the law because family is fun." He's saying that "uprightness" (*zhi*) isn't abstract rule-following. If I turn my father in, I sever the root of my own humanity. I become a cold instrument of the state. And a state made of cold instruments is a tyranny.

  **Jian:** Or it's a society of laws. Look, let's get concrete about Shun. He's the Emperor. He isn't just a private citizen. By accepting the throne, he entered a covenant with the people. He promised order. When he abandons the empire "like a worn-out shoe"—that's the phrase Mencius uses—he's betraying millions to save one guilty man. That's not "preserving the root." That's dereliction of duty on a cosmic scale.

  **Wei:** But if he stays and arrests his father, he validates a system where the law is higher than human connection. He teaches the empire that rules matter more than people.

  **Jian:** No. He teaches the empire that *no one* is above the law. Even the Emperor's father. If Shun protects Gusou, he tells every father in the empire: "If you kill someone, your son will hide you." You're incentivizing crime. You're creating a culture where family clans become little mafias protecting their own against the common good. That is literally the Liu Qingping argument. It's not just nepotism; it's structural corruption.

  **Wei:** You're assuming the law is the only way to handle justice. In the Shun scenario, Gao Yao is still the judge. Shun doesn't stop Gao Yao. Shun just removes *himself* from the equation. He doesn't use his power to pardon Gusou. He gives up his power so he can be a son.

  **Jian:** That's a distinction without a difference. By fleeing, he ensures Gusou can't be caught. He's using his knowledge and resources to aid a fugitive.

  **Wei:** He's using them to preserve *ren* (humaneness). Think about the alternative. Shun stays, executes his father. What happens to Shun's heart? It hardens. If the Sage King—the moral exemplar for all history—can kill his own father for a statute, what does that teach the people? It teaches them that morality is external. Compliance. Fear. Confucianism says morality is internal. It grows from the family. If you poison the family bond, you poison the well the whole empire drinks from.

  **Jian:** But the well is already poisoned if the water is blood! You keep talking about the "root." I'm talking about the fruit. The fruit of Shun's action is a dead victim unavenged and a throne abandoned. The Mohist calculus is simple: Which action produces the most benefit for the most people? Arresting a murderer protects the public. Protecting a murderer endangers them.

  **Wei:** Your calculus is too thin. You're counting bodies, not meanings. If Shun turns Gusou in, he might save face with the public, but he destroys the very mechanism by which humans learn to care for one another. You want me to care for the stranger *more* than my father? That's not impartiality. That's inhumanity.

  **Jian:** I don't want you to care *more*. I want you to care *equally* regarding justice. This is where your role ethics breaks. You say we are constituted by our roles. Okay. Shun has two roles: Son and Ruler. Why does the "Son" role automatically override the "Ruler" role?

  **Wei:** Because the "Ruler" role is derivative. You can only be a father to the people if you know how to be a father to your child. Or a son to your parent. It's the training ground.

  **Jian:** But what if the training ground is teaching the wrong lesson? What if the lesson is "loyalty to blood trumps loyalty to truth"? That's not a training ground for virtue; it's a training ground for tribalism. Look at your own life, Wei. You told me about your cousin.

  **Wei:** *(Shifts uncomfortably)* That's different.

  **Jian:** Is it? Third strike. DUI. Alcohol in the car. Your uncle wants the family to lie. To conceal. According to Mencius, that's "uprightness." According to me, that's how people get killed on the highway. If everyone follows the Confucian rule, your cousin drives again. Maybe he hits a kid. Does that kid's father have a "role" that obligates him to forgive your cousin? Or does he have a right to justice?

  **Wei:** The cousin case is messy. We aren't sages.

  **Jian:** Exactly. And that's why we need impartial standards, not situational role ethics. If you make morality dependent on *who* is involved, you guarantee corruption. The whole point of Mohism is to break the cycle of feuds and favoritism. "Impartial Care" means I treat your father's life as valuable as I treat my own. If your father murders someone, I mourn the victim as if it were my brother. I can't do that if I'm supposed to help your father hide.

  **Wei:** But *jian'ai* is too heavy. It asks too much. It asks me to detach myself from the very things that make me human. When my father is in trouble, my gut reacts. That gut reaction isn't a bug; it's the feature. Confucianism works *with* human nature, not against it.

  **Jian:** Human nature also includes empathy for the victim. Why is your gut reaction to the perpetrator stronger than your gut reaction to the victim? That's not nature; that's conditioning.

  **Wei:** It's not conditioning; it's proximity. I can't save the world if I'm not grounded. Shun abandoning the throne is tragic. Mencius knows it's tragic. But he's saying there are some lines you can't cross. If I sacrifice my father to the law, I am no longer a son. And if I am not a son, I am not a human being in the Confucian sense. I'm just a functionary.

  **Jian:** And if I sacrifice the victim to my father, I am no longer a citizen. I'm a conspirator. Here's the hard question, Wei. If Shun hides Gusou by the sea… does Gusou repent? Or does he just live comfortably while the victim rots?

  **Wei:** Mencius implies Shun would watch over him. Restrict him. It's not freedom; it's exile.

  **Jian:** Private exile. Paid for by the taxes of the people Gusou betrayed. It's privilege. Pure and simple. The rich and powerful can "exile" their dads to a seaside villa. The poor get hanged. Your role ethics only works if everyone has the power to abdicate a throne. For the rest of us, "concealment" just means lying to the police and hoping no one gets hurt.

  **Wei:** So your solution is to make everyone strangers to each other? To turn the family into a mini-police state? "Sorry Dad, I love you impartially, so I'm calling the cops." You think that builds a better society? Or does it build a society of snitches who trust no one?

  **Jian:** I think it builds a society where the law is the only shield the weak have against the strong. Your "root" argument protects the strong. The father has power over the son; the clan has power over the individual. Impartiality is the weapon of the powerless. It says, "It doesn't matter who your father is."

  **Wei:** And I say, "It matters *too much* who your father is, because that's where you learn to be good." If we lose that, we lose everything. Shun carrying his father isn't about escaping justice. It's about carrying the weight of the tragedy himself. He loses the empire. He takes the hit.

  **Jian:** He loses the empire. The victim loses their life. One is a job; the other is a existence. The math doesn't work, Wei.

  **Wei:** Ethics isn't math. It's about who you are when the world breaks.

  **Jian:** And it's about who you are when the world is watching. If Shun runs, he's telling the world that some people are untouchable.

  **Wei:** If Shun stays, he's telling the world that no one is irreplaceable. Not even family.

  *(Silence falls between them. The wind rustles the papers on the bench.)*

  **Jian:** I don't know how to solve your cousin situation, Wei.

  **Wei:** I know. I don't think Mencius does either. Not really. He's writing for Sages, not for guys in parking lots with breathalyzers.

  **Jian:** But the principle stands. If you conceal, you're choosing the role over the result.

  **Wei:** And if you report, you're choosing the result over the relationship. Maybe the tragedy is that both choices destroy something essential.

  **Jian:** Then maybe the system is broken.

  **Wei:** Or maybe we are.

  *(Wei picks up his coffee. Jian closes the book. Neither looks satisfied.)*
