  4.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Set the stage (Berlin = Tragedy/Will; Chang = Parity/Agency).
      *   **Section 1: Berlin's Pluralism & The Limit of Reason.** Explain incommensurability as a lack of common measure. The "Tragic Choice." Reason eliminates the non-starters, but the final cut is non-rational (will/character).
      *   **Section 2: Raz vs. Chang on Comparability.** Briefly handle Raz (Incomparability = gap in logical space). Explain Chang's critique (Small Improvement Argument fails). Introduce Parity (comparable but not ranked).
