      *   **Character 2 (Phenomenologist/Cognitivist):** Tradition of Dennett/Dreyfus/Fodor. Argues narrow solutions presuppose relevance (which predicates matter). Dreyfus: Relevance is embodied/skillful. Fodor: Relevance is isotropic/Quinean (holistic), not modular.
