answer: |-
  **Setting:** *A quiet corner of a campus coffee shop, late evening. Two empty espresso cups sit between **Elena**, a computational logician, and **Marcus**, a philosopher of mind. They have just left a seminar on the Frame Problem.*

  **Elena:** You looked unsatisfied during the Q&A, Marcus. When the speaker showed Reiter's successor-state axioms, you had that look like you'd just smelled something rotting.

  **Marcus:** Not rotting, Elena. Just… sterilized. The presentation was technically flawless, I grant you. But it felt like watching a magician solve the problem of "how to make the elephant disappear" by proving that, mathematically, the elephant occupies a non-zero volume of space, and then declaring the trick over because the equation balances.

  **Elena:** That's unfair. McCarthy and Hayes's original 1969 formulation was precise. In the situation calculus, if you perform an action, you need to specify what changes. The problem was that to specify what *doesn't* change, you needed a separate axiom for every single fluent for every single action. If you have $n$ actions and $m$ fluents, you need $n \times m$ frame axioms. It was a combinatorial explosion. Reiter's solution reduced that to $n + m$. You write one successor-state axiom per fluent that lists the conditions under which it changes; otherwise, it persists. That's not a magic trick. That's a proof of consistency. The narrow frame problem is solved.

  **Marcus:** The *narrow* problem. And that's where the sleight of hand happens. You've solved the problem of how to represent non-change efficiently *given* a specific ontology. But Dennett's point in "Cognitive Wheels" wasn't about axiom counts. It was about relevance. How does the agent know *which* fluents to include in the ontology in the first place?

  **Elena:** Because the modeler tells it. We are building a system for a blocks world, or a logistics domain. We define the predicates.

  **Marcus:** Exactly. You, the human designer, select the relevant predicates. You decide that the color of the block matters, but whether the block is "too shy to move" does not. But for the agent inside the system, there is no distinction. If I tell a robot to fetch a coffee, and it spends twenty minutes calculating whether moving its arm changed the price of tea in China, it has failed. Reiter's axioms prevent the *logic* from exploding, but they don't tell the system which axioms to write. You've relocated the frame problem from the inference engine to the ontology design.

  **Elena:** I'd argue I've dissolved it. You're treating "relevance" like it's a metaphysical ghost hovering over the data. But look at modern AI. We aren't writing successor-state axioms for large language models or reinforcement learning agents. They don't have explicit symbols for "tea prices" or "block colors." They have weights. They learn statistical correlations. If a fact isn't relevant to the reward function or the prediction task, the gradient descent ignores it. The "explosion" never happens because the system never represents the irrelevant facts strongly enough to reason about them in the first place. If the deep epistemological frame problem were real, statistical AI shouldn't work at all.

  **Marcus:** But it *doesn't* work, not in the way you mean. It works tolerably well within a distribution. But ask an LLM to plan a physical action in a novel context, and it hallucinates. It fails to understand that if I put a bomb in a box and move the box, the bomb moves too—but the table the box was on doesn't. That's the frame problem in action. The neural net doesn't "know" what persists because it doesn't understand persistence; it just predicts tokens based on proximity.

  **Elena:** That's a performance issue, not a foundational one. We can integrate neural nets with symbolic planners. Neuro-symbolic systems. But let's stick to your philosophical objection. You're channeling Dennett, but you're also leaning on Dreyfus. You think relevance is disclosed through embodied coping, right? That we don't *compute* relevance; we *feel* it because we are organisms with needs embedded in a world.

  **Marcus:** Yes. For Dreyfus, the frame problem is a pseudo-problem generated by the intellectualist assumption that all engagement with the world is mediated by internal representations. When I reach for this cup, I don't represent the cup as a set of fluents. I don't have to filter out the fact that my reaching doesn't change the moon's orbit. That fact doesn't show up. It's not "filtered"; it's never "present" to begin with. Relevance is determined by my bodily orientation toward the task. By trying to solve it with axioms, even efficient ones, you're trying to compute what is essentially a mode of being.

  **Elena:** I respect the phenomenology, Marcus, I do. But cognitive science needs mechanisms. "Mode of being" isn't a mechanism. And even if we grant Dreyfus, you have Fodor waiting in the wings, and he contradicts Dreyfus. Fodor didn't think relevance was embodied; he thought it was isotropic.

  **Marcus:** Precisely. And that's the stronger objection to your statistical defense.

  **Elena:** How so?

  **Marcus:** Fodor argued that central cognition is Quinean and isotropic. That means any fact *could* be relevant to any other fact, depending on the global context. If I'm planning a picnic, the weather is relevant. If I'm planning a picnic and I'm a spy, the weather might be relevant to a code transmission. If I'm a poet, the weather is relevant to my mood. There is no local module, no neural layer, no set of successor-state axioms that can delimit relevance in advance. It's holistic.

  **Elena:** But Fodor was writing in the 80s. He assumed modularity was rigid. We now know cognition is deeply interactive.

  **Marcus:** Interaction doesn't solve isotropy. It just makes the web denser. Your neural nets handle this by compressing the world into a fixed-dimensional vector space. But that compression *is* the framing. You are deciding, via architecture and training data, what counts as similar. When the system fails on an edge case—when it treats a picture of a sheep on a hillside as a sheep, ignoring the fact that sheep don't float—it's because its "frame" was fixed by the training distribution. It couldn't access the global fact that gravity exists unless that fact was statistically salient in the training set. The frame problem is the problem of how to keep the frame open to the whole world without being paralyzed by it.

  **Elena:** Okay, let's grant that. Let's grant that the "epistemological frame problem"—how to define relevance in an open world—is unsolved. Does that invalidate the logical solution? You're acting as if, because Reiter didn't solve the problem of *meaning*, he didn't solve the problem of *inference*.

  **Marcus:** I'm saying the inference problem was never the real problem. It was a symptom.

  **Elena:** No, it was a bottleneck. Without successor-state axioms, you couldn't build a planner that scaled. We solved the bottleneck. Now, regarding the "deep" problem: You say relevance can't be computed. But evolution computed it. Natural selection filtered organisms that didn't waste energy worrying about the moon's orbit while reaching for a cup.

  **Marcus:** Evolution didn't *compute* it; it selected for structures that *enacted* it. There's a difference.

  **Elena:** Semantics! In engineering terms, if a system functions as if it knows what's relevant, it solves the problem. If I train a robot to navigate a room, and it doesn't crash into walls because it's worrying about the color of the paint, it has solved the frame problem functionally. The fact that it uses a value function instead of a circumscription policy is an implementation detail. You're insisting on a specific kind of explanation—phenomenological or Fodorian—that might just be a refusal to accept that "relevance" is an emergent property of optimization, not a prerequisite.

  **Marcus:** But optimization toward *what*? The reward function. Who defines the reward function?

  **Elena:** The designer.

  **Marcus:** There it is. The frame problem has been outsourced to the human. The AI doesn't solve the frame problem; *you* solve it for the AI by curating its world. When you deploy that AI into the open world, where you haven't curated the fluents, it breaks. That's why we have alignment problems. That's why self-driving cars hit things they "should" have known were obstacles even if they weren't in the training set. The frame problem is the alignment problem. It's the gap between the closed formal system and the open world.

  **Elena:** I'll concede that open-world generalization is hard. But calling it the "Frame Problem" muddies the water. McCarthy's Frame Problem was about temporal projection. "If I paint the block red, is it still on the table?" Reiter solved that. What you're describing is the Common Sense Knowledge Problem.

  **Marcus:** Dennett would say they are the same problem. The reason you can't project the future is that you can't delimit the present. To know if the block is still on the table, I need to know no earthquake occurred, no thief entered, no gravity failure happened. To rule those out, I need to know the state of the whole world.

  **Elena:** But I don't need to know the state of the whole world *logically*. I need to assume persistence *by default*. That's what circumscription does. It says: "Assume nothing changes unless forced to." It's a non-monotonic logic. It formalizes the "sleeping dog" assumption.

  **Marcus:** But who tells the dog to sleep?

  **Elena:** The axiom does.

  **Marcus:** The axiom says "All fluents persist unless..." But which fluents are in the set? If I don't have a fluent for "gravity is functioning," the axiom doesn't protect it. If the world presents a fact I have no name for, your logic is blind to it. The neural net is blind to it too, unless it correlates with something else.

  **Elena:** So your claim is that unless we have a complete ontology of the universe, the problem isn't solved?

  **Marcus:** My claim is that a complete ontology is impossible for a finite agent. Therefore, any solution that relies on an explicit ontology—symbolic or statistical—is necessarily provisional. It works only within a context. Dreyfus says context isn't something you represent; it's what you stand in.

  **Elena:** And Fodor says context is infinite, so cognition should be impossible. Yet, here we are. We are thinking.

  **Marcus:** Yes. Which suggests cognition isn't doing what you think it's doing. It's not manipulating symbols according to rules of relevance. It's coping.

  **Elena:** "Coping" is a wonderful word for a seminar. It's less useful for building a medical diagnosis AI. For that, I need guarantees. I need to know that if I update the patient's blood pressure, the system doesn't forget their name. Reiter gives me that guarantee. Your "coping" gives me a metaphor.

  **Marcus:** And if the patient's name changes because they got married, and that's relevant to a genetic risk factor, but your system treats "Name" and "Genetic Risk" as independent fluents because the designer didn't link them? Your guarantee holds, but the inference is wrong. The logic is sound, the conclusion is fatal.

  **Elena:** Then we update the axioms. That's learning.

  **Marcus:** Who decides when to update? That's the frame problem again. When does a new fact warrant restructuring the ontology?

  **Elena:** *Sighs.* You're circling back to the meta-level. Yes, ontology engineering is hard. But that's not the Frame Problem. That's just... science. That's the hard work of figuring out what exists. McCarthy wasn't trying to solve metaphysics. He was trying to get a robot to stack blocks without proving the color of the blocks changed every time they moved.

  **Marcus:** I know. But the reason it felt like a "problem" to philosophers wasn't because the logic was hard. It was because it revealed the abyss between formal systems and lived reality. You've built a bridge over the abyss, Elena. A sturdy, logical bridge. But you built it between two cliffs of your own choosing. The abyss is still there, surrounding you.

  **Elena:** Maybe. But I can walk across my bridge. I can make the robot stack the blocks. If the abyss is still there, it doesn't seem to be eating the robots anymore.

  **Marcus:** Until you ask the robot to stack blocks in a war zone. Then the abyss opens up. The "narrow" solution works in the lab. The "broad" problem waits in the world.

  **Elena:** Then we'll build better labs. Or better robots. We won't solve it by worrying about isotropy. We'll solve it by iteration.

  **Marcus:** And I'll be here, worrying that you're iterating on a map while ignoring the territory.

  **Elena:** *Smiles.* And I'll be here, making sure the map gets you where you want to go, even if you don't understand how the compass works.

  **Marcus:** Cheers to that.

  **Elena:** Cheers.

  *They clink their empty cups. The disagreement remains, sharp and unresolved, hanging in the air like the persistence of a fluent that neither has chosen to change.*
