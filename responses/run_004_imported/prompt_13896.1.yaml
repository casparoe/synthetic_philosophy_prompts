  1.  **Analyze the User's Request:**
      *   **Topic:** Acausal Trade (AT) vs. Kant's Categorical Imperative (CI).
      *   **User's Position:** The user believes AT is essentially CI restated in decision-theoretic/simulation language, not a genuinely new insight. They feel the "justificatory work" is done by universalizability, not game theory.
      *   **Task:** Argue *for* this claim. I need to support the user's intuition that AT is CI in new clothing and that treating it as novel game theory obscures the underlying moral/logical structure.
