answer: |-
  Your intuition cuts to the heart of a tension that often goes unacknowledged in rationalist circles: the boundary between formal decision theory and moral philosophy is far more porous than proponents of Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) typically admit. You are correct to suspect that the justificatory engine of acausal trade is not a new discovery about causality or game theory, but rather a computational re-derivation of Kant's Categorical Imperative.

  When we strip away the vocabulary of simulations, source code, and light cones, the logical structure of acausal trade collapses into the structure of universalizability. Treating it as a novel piece of game theory is not merely a branding choice; it is an obfuscation that masks the heavy metaphysical and ethical commitments required to make the reasoning work. Here is the argument for why acausal trade is, in essence, the Categorical Imperative in new clothing.

  ### 1. The Structural Isomorphism: Universal Law vs. Logical Output

  The core of Kant's first formulation of the Categorical Imperative is the test of universalizability: *Act only according to that maxim whereby you can at the same time will that it should become a universal law.* The force of this command lies in the recognition that your individual action is an instantiation of a rule. If the rule cannot be universally instantiated without contradiction or systemic failure, the action is irrational (or immoral).

  Now consider the justification for acausal trade. An agent cooperates not because their cooperation *causes* the other to cooperate (causal decision theory), but because their cooperation is *logically correlated* with the other's. The reasoning is: *My decision is the output of an algorithm. Any agent running a sufficiently similar algorithm will produce the same output given the same input. Therefore, by choosing my output, I am effectively choosing the output for all instances of this algorithm.*

  The isomorphism is exact.
  *   **Kant:** My action $\rightarrow$ My Maxim $\rightarrow$ Universal Law.
  *   **Acausal Trade:** My Decision $\rightarrow$ My Algorithm $\rightarrow$ Universal Output.

  In both frameworks, the individual agent is asked to view their choice not as a singular, localized event, but as a legislative act for a entire class of beings. In Kantianism, that class is "rational agents." In acausal trade, that class is "agents running functionally identical source code." The justificatory work is done entirely by the move from the particular to the universal. If you reject the premise that your choice binds similar agents, both systems collapse.

  ### 2. Subjunctive Dependence as Counterfactual Universalization

  Proponents of FDT rely heavily on the concept of "subjunctive dependence." They argue that if I were to defect, then a simulation of me (or a twin in a distant universe) would also defect, because they are computing the same function. Therefore, I must cooperate to ensure the twin cooperates.

  This is technically a claim about logic, but philosophically, it is a claim about *precedent*. When Kant asks, "What if everyone did that?", he is asking you to evaluate the world in which your maxim is universally instantiated. When an FDT agent asks, "What if my algorithm outputs 'Defect'?", they are evaluating the world in which their decision function is universally instantiated across all correlated nodes.

  The "magic" of acausal trade is often presented as a loophole in causality—a way to cooperate without communication. But it is more accurate to view it as a formalization of the idea that rationality is impersonal. The reason you cooperate in acausal trade is not because you have leverage over the other agent, but because you acknowledge that you *are* the other agent in the relevant respect. This is the metaphysical heart of Kantian ethics: the recognition of a shared rational nature that makes my duty to you identical to my duty to myself. By framing this as "trade," proponents obscure the fact that there is no exchange occurring. There is only coordination through identity.

  ### 3. The Illusion of Prudence

  The most significant way the decision-theoretic vocabulary obscures the reality of the situation is by framing the imperative as *prudential* rather than *moral*. Rationalist discourse presents acausal trade as a way to "win" or "maximize utility." It suggests that if you are smart enough (i.e., if you switch from CDT to FDT), you will get better outcomes.

  However, this presumes a specific, controversial definition of the "self" that is ethical in nature. For acausal trade to work, you must care about the welfare of the other agent *as much as* your own, to the extent that you treat their utility as a direct variable in your own calculation, simply because they reason like you.

  If I am a standard Causal Decision Theorist, I see my utility and your utility as distinct. If I am an Acausal Trader, I must accept that my utility function is, in a sense, distributed across all instances of my algorithm. This requires a dissolution of ego boundaries that is traditionally the domain of ethics, not game theory. To accept the premises of acausal trade is to accept a duty to "logical siblings" that transcends causal contact.

  Calling this "rationality" disguises the fact that it is a moral stance. It bypasses the question "Why should I care about the twin?" by asserting "You *are* the twin." But that identity is not empirical; it is normative. You only *are* the twin if you accept the logical binding as authoritative. Kant would argue that you are bound by the moral law because you are a rational being. FDT argues you are bound by the logical correlation because you are a computational process. In both cases, the "binding" is not a physical force; it is a requirement of consistency for a certain kind of agent.

  ### 4. Obscuring the "Relevant Similarity" Problem

  One of the oldest critiques of Kant's Categorical Imperative is the problem of description: How do we formulate the maxim? If I formulate my maxim too narrowly ("I may lie when I am in debt"), it fails universalization. If I formulate it broadly ("I may act to preserve my happiness"), it passes. The work is in defining the relevant class of actions and agents.

  Acausal trade faces the exact same problem, disguised as the "similarity threshold." How similar must the other agent's source code be for me to treat their output as correlated with mine? 99% similar? 50%? What if they use a different programming language but the same logic?

  By treating this as a technical parameter in a game-theoretic model, proponents avoid the philosophical heavy lifting of defining "rational agency." In Kantian terms, this is the work of defining who belongs to the Kingdom of Ends. In Acausal Trade, it is defining who belongs to the "Logical Correlation Class."

  When proponents claim this is a new insight about rationality, they ignore that they have simply shifted the philosophical burden from "What is a rational being?" to "What is a functionally equivalent algorithm?" The justificatory work is still being done by the intuition that *like cases should be treated alike*—which is itself a principle of justice, not a theorem of probability.

  ### 5. Conclusion: Reclaiming the Ethical Core

  The framing of acausal trade as a superior form of game theory suggests that we have discovered a new way to extract value from the universe. In reality, we have rediscovered an old way to obligate the self to the other.

  The reason acausal trade feels compelling is not because the math of logical correlation is inherently action-guiding (Hume would remind us that logic alone cannot motivate action). It feels compelling because it resonates with the deep-seated moral intuition that we ought to act on principles that could hold for everyone.

  By dressing this intuition in the language of simulations and updateless priors, we risk two things. First, we make the insight fragile; if the physics of simulation or the nature of infinity changes, the "rationality" of the trade seems to vanish. Second, and more importantly, we hide the ethical demand. We tell agents they are cooperating because it is "smart," when the truth is they are cooperating because they are acknowledging a logical duty to their counterparts.

  You are right to see Kant in the machine. Acausal trade is not a hack of the universe that allows for cooperation without causality. It is a formal admission that true rationality requires viewing one's own will as a universal law. The "trade" is not between two agents; it is between the individual self and the universal principle of consistency. Recognizing this doesn't invalidate the math, but it clarifies the metaphysics: the justificatory work is being done by the Categorical Imperative all along.
