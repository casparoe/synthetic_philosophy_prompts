  2.  **Deconstruct the Core Concepts:**
      *   **Acausal Trade (AT):** Two agents (A and B) cannot causally interact. A simulates B (or reasons about B). A cooperates because A reasons: "If I cooperate, a agent similar to B (or B itself, via simulation) will reason similarly and cooperate." Key mechanism: Logical correlation / Subjunctive dependence. Key decision theory: Functional Decision Theory (FDT) or Updateless Decision Theory (UDT).
      *   **Categorical Imperative (CI):** Kant's moral law. "Act only according to that maxim whereby you can at the same time will that it should become a universal law." Key mechanism: Universalizability. If everyone did X, would the system work? If not, X is irrational/immoral.
      *   **The Connection:** Both rely on the idea that *my* decision is not isolated. In CI, my decision implies a rule for all rational agents. In AT, my decision implies an output for all agents running the same algorithm.

  3.  **Brainstorming Arguments for the Claim:**
      *   *Argument 1: The Structure of Reasoning.* Both start from the individual's reasoning process and project it outward. CI says "If I do X, everyone must do X." AT says "If I do X, every agent running my algorithm does X."
      *   *Argument 2: The Source of Normativity.* In Causal Decision Theory (CDT), normativity comes from causal consequences. In both CI and AT, normativity comes from *logical consistency* or *universal instantiation*. The "force" isn't "I get punished," it's "The system breaks if I make an exception."
      *   *Argument 3: The Illusion of Empirical Contingency.* AT proponents frame this as empirical (simulations, infinite universes). But the *binding* nature is a priori. If the correlation exists, you *must* cooperate. This mirrors Kant's a priori moral law.
      *   *Argument 4: Obscuring the Moral Core.* By calling it "trade" or "game theory," proponents hide the fact that they are advocating a form of duty-based rationality. It makes it look like self-interest, but it's actually requiring self-sacrifice for the sake of the "algorithm" (the universal class).
      *   *Argument 5: The "Relevantly Similar" Agent.* Kant talks about "rational agents." AT talks about "agents running the same source code." These are functionally identical categories in this context.

  4.  **Structuring the Essay:**
      *   **Introduction:** Acknowledge the sophistication of AT/UDT/FDT. State the thesis: AT is a computational re-skinning of Kantian universalizability. The "magic" isn't in the simulation, it's in the logic of agency.
      *   **Section 1: The Isomorphism of Reasoning.** Compare the logical form.
          *   CI: Maxim $\to$ Universal Law.
          *   AT: Algorithm $\to$ Universal Output.
          *   Show how "subjunctive dependence" is just "counterfactual universalization."
      *   **Section 2: The Source of Normative Force.** Why do you do it?
