answer: |-
  This is a classic philosophical dispute, one that echoes debates between Immanuel Kant (who held your friend Jonah's view) and Jeremy Bentham or Peter Singer (who would side closer to yours). You have stumbled onto a genuine fault line in moral philosophy: the distinction between **direct duties** (owed to the being itself) and **indirect duties** (owed to humanity, mediated through the being).

  Here is an assessment of the stability of Jonah's position, the validity of your objection, and a proposal for how to draw the line more clearly.

  ### 1. Is there a stable, non-question-begging version of Jonah's position?

  **Yes, but it is thinner than Jonah thinks.**

  Jonah is articulating the **Indirect Duty View**. In its strongest philosophical form (Kantianism), moral standing is indeed reserved for "rational agents" capable of autonomy and moral reciprocity. Animals, lacking this capacity, are "things." Therefore, you cannot *injustice* a thing.

  For this to be stable, Jonah must commit fully to the idea that the moral weight of the act rests **entirely** on the agent's internal state, not the external consequences for the animal.
  *   **The Stable Argument:** "Killing Baxter is wrong not because Baxter loses a future, but because the Uncle is practicing a vice (wastefulness, ingratitude, or cruelty) that is incompatible with human excellence (*eudaimonia*)."
  *   **The Weakness:** Jonah tries to explain *why* it is a vice by referencing Baxter's "apparent suffering." This is where the position wobbles. If Baxter is morally inert (like the vending machine), why does his suffering register as a corrosive force on the Uncle's soul?

  To make his view stable, Jonah needs to stop talking about Baxter's suffering and start talking about **relationships**. A better version of his argument isn't that Baxter is a thing, but that the Uncle occupies a role (steward/master) that entails specific virtues (loyalty, care) regardless of the recipient's status. A knight who betrays a vow to a squire wrongs the squire, but he also degrades his own knighthood. Jonah could argue the Uncle degraded his own humanity by failing the specific demands of stewardship.

  However, as presented at the dinner party, Jonah's position was **not stable**. By relying on the "appearance of suffering" to explain the corruption of character, he implicitly granted that suffering has moral significance.

  ### 2. Does your "smuggled Baxter back in" objection succeed?

  **Yes, it succeeds, and it is the strongest point you made.**

  Your objection highlights a contradiction in the Indirect Duty View. You argued: *If the reason the act corrupts the Uncle is that Baxter appears to suffer, then Baxter's suffering is doing the moral work.*

  Here is why your objection lands:
  *   **The Vending Machine Test:** If I smash a vending machine, I might be angry, but I am not "cruel." If I kick a dog, I am cruel. Jonah admits this distinction exists.
  *   **The Explanation Gap:** Jonah says the distinction exists because the dog *acts like it suffers*. But if the dog's suffering is ontologically irrelevant (because the dog has no moral standing), then the Uncle's reaction to it should be treated like an irrational phobia, not a moral failing.
  *   **The Smuggle:** By saying the Uncle's character is corroded *specifically* by the interaction with a suffering creature (and not an inanimate object), Jonah is admitting that the creature's state of affairs matters. He is trying to have it both ways: Baxter doesn't matter enough to be owed a life, but matters enough to ruin the Uncle's soul if killed.

  You correctly identified that you cannot use the victim's pain to explain the perpetrator's vice if you simultaneously claim the victim is the kind of entity to whom pain doesn't morally matter. That is question-begging.

  ### 3. Is there a better way to draw the line?

  Both of you were struggling because you were using two different moral maps. Jonah was using a **Status-Based Map** (only rational beings count), while you were using a **Sentience-Based Map** (any being that can suffer counts).

  There is a third way to draw the line that might satisfy the intuition behind both your positions without the contradiction. It involves distinguishing between **Wronging** and **Harming**, and introducing the concept of **Moral Patienthood**.

  **A. Moral Agents vs. Moral Patients**
  *   **Moral Agents:** Beings who can be held responsible for their actions (Humans).
  *   **Moral Patients:** Beings who can be acted upon in morally significant ways (Humans + Animals).
  *   **The Fix:** Jonah is right that Baxter is not a *Moral Agent* (he can't be blamed). But he is wrong that Baxter is not a *Moral Patient*. To be a Moral Patient, you don't need rationality; you need interests (an interest in not suffering, an interest in continuing to live).

  **B. The Distinction: "Bad Act" vs. "Wrong Done To"**
  You asked for a better way to draw this line. Here is a robust framework:
  *   **A Wrong Done To X:** Requires violating a claim or interest that X holds. (e.g., Baxter had an interest in not dying; killing him violates that interest).
  *   **A Bad Act (without a specific victim):** An act that violates a duty to the moral order or oneself, even if no specific patient is wronged. (e.g., Lying when no one is listening).

  **The Synthesis:**
  Jonah wants to say the Uncle committed a *Bad Act* but not a *Wrong Done To Baxter*.
  You want to say the Uncle committed a *Wrong Done To Baxter*, which *also* makes it a *Bad Act*.

  The most philosophically defensible middle ground is this: **The Uncle wronged Baxter, but the *nature* of the wrong is different than wronging a human.**
  *   Wronging a human involves violating autonomy and rational consent.
  *   Wronging a dog involves violating welfare and trust.

  By conflating "wronging" with "violating rational autonomy," Jonah forced himself into the corner of saying Baxter doesn't matter. If he defined "wronging" as "violating significant interests," he could admit Baxter was wronged without granting Baxter human rights.

  ### Assessment: Who was closer to right?

  **You were closer to right, but Jonah identified a real phenomenon.**

  *   **Why you won:** Your "vending machine" analogy exposed the instability of his view. If Baxter is truly incidental, the Uncle's act should be morally equivalent to breaking a plow. The fact that Jonah (and almost everyone) feels it is *worse* than breaking a plow proves that Baxter holds some moral status independent of the Uncle's character. Your objection that he "smuggled Baxter back in" is logically sound.
  *   **Where Jonah had a point:** He was right to notice that the *corruption of the agent* is a distinct moral category from the *harm to the victim*. Even if Baxter wasn't wronged (hypothetically), the Uncle would still be a worse person. Jonah correctly identified that our moral judgments often focus on the character of the actor, not just the calculus of the victim.

  **The Verdict:**
  Jonah's position is a historically respected philosophical stance (Kantianism), but in the context of modern ethics and the specific details of your argument, it collapses under its own weight. He cannot simultaneously claim Baxter is morally inert *and* that Baxter's suffering is the specific mechanism that corrupts the Uncle.

  You successfully demonstrated that if the suffering matters for the Uncle's soul, it must matter for Baxter's sake. The Uncle didn't just fail himself; he failed Baxter. The most stable position is that Baxter is a **Moral Patient**: he cannot be held responsible, but he can be wronged because he has interests that can be thwarted. Jonah's error was thinking that only rational beings have interests worth respecting.
