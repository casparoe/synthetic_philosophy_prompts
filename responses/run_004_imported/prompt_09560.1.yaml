      *   The "Shift": It's not a shift in topic, but a clarification of *jurisdiction*. The last sentence acts as a guardrail. It says: "Don't get clever. You (private citizen) are only safe because you didn't intend the death. If you *did* intend it, you'd be a murderer, because only the State can intend death."

