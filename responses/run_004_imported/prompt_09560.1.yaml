      *   *The "Snag" (Final Sentence):* "Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority..."

  3.  **Address the Specific Tension (Private vs. Public Intention):**
      *   *User's Interpretation:* If the private person *doesn't* intend to kill, why does Aquinas say they *must not intend* to kill, while soldiers *may* intend to kill? It sounds like a distinction without a difference or a shift in topic.
      *   *Scholarly Consensus:* This is a classic point of contention in Thomistic ethics.
      *   *Key Distinction:* The *object* of the act vs. the *end* of the agent.
      *   *Private Individual:* The act is "defending oneself." The death is a side effect. If a private person *makes* the death the goal (even partially), the act becomes "killing in self-defense," which is forbidden because private individuals lack the authority to dispose of another's life.
      *   *Public Authority:* The act is "upholding justice/common good." The death can be a means or a direct object because the public authority *has* the commission to dispose of lives for the common welfare.
      *   *Resolution:* Aquinas isn't changing the subject; he is reinforcing the *limit* of the private individual's license. The private individual walks a tightrope: they must ensure their intention remains *solely* on preservation. If it slips toward "I want this guy dead," they cross into usurping public authority. The soldier, however, operates under a different commission where killing the enemy *is* the means to the common good, so intending it is permissible (provided no private animosity).

