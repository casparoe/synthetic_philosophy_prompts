answer: |-
  You have not spent an embarrassing number of evenings on this; you have spent exactly the right number. You have identified the precise hinge upon which the Thomistic account of self-defense turns, and which is almost universally flattened in modern popular ethics.

  Your intuition is sharp: the final sentence does feel like a shift. However, Aquinas is not changing the subject from self-defense to public execution. Rather, he is establishing the **juridical boundary** that makes the "double effect" argument valid for the private citizen in the first place.

  Here is a close reading of that tension, the consensus among Thomistic commentators on how to resolve it, and how Whitfield might authentically wield this in a courtroom without sounding like he is giving a theology lecture.

  ### 1. The Missing Key: *Dominium* Over Life
  To understand the last sentence, you must understand what Aquinas assumes about *who owns a life*.

  For Aquinas, life is a gift from God. No individual has absolute *dominium* (ownership/authority) over their own life (which is why suicide is sinful), and certainly no private individual has *dominium* over another person's life. Only God has that. However, God delegates a measure of this authority to the **public power** (the State) for the sake of the common good.

  *   **The Private Citizen:** Has no authority to dispose of the aggressor's life. Therefore, the citizen can only act upon *their own* life (preserving it). If the citizen *intends* the death of the aggressor, they are usurping an authority they do not possess (acting as judge and executioner). Thus, the death must remain *praeter intentionem* (beside the intention).
  *   **The Public Authority (Soldier/Judge):** Has been delegated the authority to dispose of lives for the common good. Therefore, they *can* intend the death of the aggressor/enemy, because that death is a means to the end of justice or peace, which they are commissioned to uphold.

  ### 2. Resolving the Tension
  You asked: *If the private person's killing was never intended to begin with, it is hard to see what further permission the soldier is being granted that the private person does not already have.*

  The permission is not about the *outcome* (both might result in a dead aggressor). The permission is about the **moral object of the act.**

  *   **Private Act:** The moral object is "defense of self." If you intend the death, the moral object changes to "killing of aggressor." Since you lack authority, this is murder.
  *   **Public Act:** The moral object is "defense of the common good." Killing the aggressor is a legitimate means to this end because you have authority.

  The final sentence is not a non-sequitur; it is the **guardrail**. Aquinas is anticipating an objection: *"If I can kill a guy as a side effect, why can't I just aim for the heart to make sure he stops?"*

  Aquinas answers: Because you are not a soldier. You are a private citizen. You are only safe from the charge of sin/crime because your intention remained fixed on *your* life, not *his* death. The moment you intend his death, you cross the line from "self-defense" into "usurping public justice," which is unlawful for a private person.

  So, the tension you feel is actually the point. The private citizen and the soldier are **not** doing the same kind of act.
  *   The soldier defends the *polis* and may intend death.
  *   The citizen defends the *self* and must not intend death.

  Commentators like Servais Pinckaers and John Finnis have noted that modern interpretations often ignore this political dimension, turning DDE into a purely psychological calculus ("did you feel bad about it?"). For Aquinas, it is ontological and juridical ("do you have the authority to will this end?").

  ### 3. How Whitfield Can Use This (Without Losing the Jury)
  Whitfield cannot stand up and say, *"Aquinas says my client lacked dominium over the victim's life."* The jury will tune out. But he can use the *structure* of this argument to dismantle the prosecution's claim of malice.

  The prosecution will argue: *Daniel chose to kill.*
  Whitfield must argue: *Daniel chose to live; death was the cost, not the goal.*

  Here is how Whitfield can translate that final sentence of Aquinas into legal rhetoric:

  **A. Distinguish "Stopping" from "Killing"**
  The prosecution will conflate the two. Whitfield must separate them using the Aquinas distinction.
  *   *Whitfield:* "The State has the power to punish. The State has the power to execute. My client does not. My client has only one right: the right to exist. When he fired that weapon, he was not exercising the power of the state. He was not trying to end a life. He was trying to preserve his own. There is a moral chasm between those two intentions."

  **B. The "Vigilante" Trap**
  The prosecution might try to paint Daniel as a vigilante (someone who *wants* criminals dead). Aquinas's final sentence is the perfect antidote to this.
  *   *Whitfield:* "A vigilante intends death. A vigilante takes the law into his own hands. But the law tells us, and conscience tells us, that a homeowner does not have that license. If Daniel had gone out there hunting for a kill, he would be a murderer. But the evidence shows he sought only safety. He did not claim the authority of a soldier or a judge. He claimed only the right of a man to see the sunrise."

  **C. Proportionality as Proof of Intent**
  Aquinas says if you use "more than necessary violence," it becomes unlawful because it proves you intended harm, not just safety.
  *   *Whitfield:* "How do we know what was in his heart? We look at his hands. Did he shoot a fleeing man? No. Did he shoot an unarmed man? No. He used the force necessary to stop the threat. That moderation is the physical proof of his intention. He stopped at defense. He did not cross into execution."

  ### 4. A Note on the "Earned" Quality
  You mentioned wanting this to feel "earned" rather than a flattened trolley problem. The way to achieve this in the text is to have Whitfield acknowledge the **tragedy** of the act.

  The flattened DDE sounds like a loophole: *"I didn't mean to kill him, so I'm off the hook."*
  The Thomistic DDE sounds like a burden: *"I was forced into a position where the only way to save my life resulted in the loss of another, and I must bear the weight of that death without claiming it as my will."*

  If Whitfield is a former seminarian, he knows that for Aquinas, even lawful self-defense is a tragic necessity, not a triumph. He should not celebrate the killing. He should frame it as a sorrowful inevitability that the law recognizes, provided the heart remained clean of the intent to kill.

  **Suggested nuance for Whitfield's internal monologue:**
  Whitfield should realize that he cannot fully use the "soldier" analogy for Daniel. In fact, the power of his argument rests on Daniel *not* being a soldier. Daniel is an ordinary man who was tempted to become an executioner in the heat of the moment but (according to the defense) remained a defender. The "snag" you found is actually the dramatic tension of the trial: *Did Daniel stay within the limits of a private citizen, or did he usurp the authority of the state?*

  ### Summary for your drafting:
  1.  **The Text:** Aquinas is consistent. The last sentence limits the private citizen's intention *because* they lack public authority.
  2.  **The Distinction:** Private citizens intend *safety* (death is side effect). Public authority intends *justice/peace* (death can be means).
  3.  **The Speech:** Whitfield should argue that Daniel respected the boundary between private defense and public execution. He didn't try to kill the intruder; he tried to stop the threat. The death was a tragedy he did not will, which is the only reason the law allows him to go free.

  This reading honors the text, respects the complexity you've uncovered, and gives Whitfield a moral gravity that separates him from a standard legal thriller lawyer.
