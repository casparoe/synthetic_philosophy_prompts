answer: |-
  Here is the sharpest, one-sided version of your friend's argument, structured to help you build the narrative arc of your feature. It treats the undermining problem not as a technical glitch, but as a metaphysical indictment of Humeanism.

  ***

  ### The Bootstrapping Paradox: Why Lewis's "Debug" Failed

  The standard narrative in the literature is that David Lewis recognized a bug in his system, wrote a patch (the New Principle), and while the code is uglier, it runs. Your friend's argument is that this is wishful thinking. The undermining problem isn't a syntax error; it's a fatal logic error in the Humean architecture. It reveals that **Humean chances are metaphysically incapable of doing the job the Principal Principle requires of them.**

  Here is the case for why the New Principle (NP) is a cosmetic fix that fails to address the structural rot, and why this forces us toward primitivism.

  #### 1. The Relabeling Objection: $T_w$ is Just as Fragile as $Ch$
  Lewis's move from the Principal Principle (PP) to the New Principle (NP) shifts the object of conditionalization.
  *   **PP:** $C(A \mid Ch(A)=x \ \& \ E) = x$
  *   **NP:** $C(A \mid T_w \ \& \ E) = Ch(A)$

  Lewis argues that we shouldn't conditionalize on the specific chance claim ($Ch(A)=x$) because that claim might be undermined by the future. Instead, we should conditionalize on the *theory of chance* ($T_w$) that generates that claim. He thinks this blocks the contradiction because $T_w$ is "admissible" information about the present laws.

  **The Critique:** This is a sleight of hand. Under Humean Supervenience, $T_w$ (the Best System) is not a freestanding lawbook sitting in a Platonic heaven. It is a summary of the **entire Humean Mosaic**, past, present, and *future*.

  Therefore, $T_w$ is *just as undermine-able* as the specific chance claim.
  If there is a possible future sequence of events $F$ that is compatible with the current $T_w$ but would, if realized, make a *different* theory $T_{w'}$ the Best System, then $F$ undermines $T_w$.
  When you use the NP, you are asking an agent to set their credence based on $T_w$. But rational agents know that $T_w$ is contingent on the future. To conditionalize on $T_w$ is to conditionalize on a proposition whose truth value is partially determined by the very outcome $A$ you are trying to judge.

  You haven't solved the circularity; you've just expanded the circle. You are asking the agent to treat a summary of the future as if it were evidence *about* the future. That isn't a solution; it's a category mistake.

  #### 2. The Direction of Fit Problem
  The Principal Principle is a normative bridge between **ontology** (what chance *is*) and **epistemology** (how we *believe*). For the bridge to hold, chance must have a specific metaphysical profile: it must be something that *guides* the world.

  *   **Primitivist/Propensity View:** Chances are real, existing properties of the present moment that push the future into being. They have a "world-to-mind" direction of fit. They exist *before* the outcomes, so they can legitimately constrain credence *about* the outcomes.
  *   **Humean View:** Chances are summaries of the outcomes. They have a "mind-to-world" (or rather, "theory-to-mosaic") direction of fit. They are derived *from* the history.

  The undermining problem exposes the impossibility of using a Humean chance to guide credence. It creates a **bootstrapping paradox**.
  Imagine you are trying to predict a coin flip.
  1.  **Humean Claim:** The chance is 50% *because* (in part) the coin will land heads roughly half the time in the future.
  2.  **PP Norm:** You should believe it will land heads with 50% credence *because* the chance is 50%.

  Do you see the loop? The Humean says the future frequencies make the chance true, but the PP says the chance tells you what to expect about the future frequencies.
  If the future turns out "wild" (an undermining future), the Humean must admit the chance *was never* 50%. But the PP required you to believe it *was* 50% before the flip.
  The Humean is forced to say: "You were rational to believe the chance was 50%, but in fact, the chance was never 50%."
  This severs the link between rationality and truth. If the "objective chance" is something that can only be identified *after the fact* (once the future is fixed), it cannot serve as the objective guide for belief *before the fact*.

  #### 3. The "Admissibility" Lie
  Lewis's entire defense rests on the idea that $T_w$ counts as "admissible" evidence. In Lewisian terms, admissible evidence is information that doesn't give you "crystal ball" access to the future.

  Your friend's argument is that under Humeanism, **$T_w$ is inherently inadmissible.**
  Because $T_w$ supervenes on the whole mosaic, knowing $T_w$ with certainty *just is* knowing something about the global distribution of events, including the future.
  If you truly know the Best System, you know the patterns that hold across time. If an undermining future is possible, then $T_w$ is not a fixed anchor; it is a floating variable.
  To demand that an agent conditionalize on $T_w$ is to demand they treat a contingent generalization about the future as if it were a necessary law of the present. It asks the agent to ignore the very possibility that makes Humean chance Humean: the possibility that the pattern breaks.

  If you acknowledge the possibility of undermining, you cannot treat $T_w$ as certain. If you treat $T_w$ as uncertain, the NP collapses back into the PP, and the contradiction returns. Lewis forces you to choose between ignoring the metaphysics of your own theory (pretending $T_w$ is fixed) or violating the norms of rationality (ignoring the PP).

  #### 4. The Verdict: Primitivism is the Only Escape
  This isn't just a technical nuisance; it's a proof by contradiction that Humean Supervenience cannot account for the normativity of chance.

  If we accept the Principal Principle as a non-negotiable constraint on rational belief (and most philosophers do; it's the whole reason we posit objective chance in the first place), then objective chance must be **ontologically robust**. It must exist independently of the outcomes it governs.

  *   **Humeanism fails** because it makes chance dependent on the outcomes.
  *   **Primitivism succeeds** because it makes chance the *producer* of the outcomes.

  In a propensity view, an undermining future is metaphysically impossible. If a coin has a primitive propensity of 0.5, and the future turns out to be 99% heads, the propensity wasn't "undermined"—the world simply didn't instantiate that propensity (or the propensity was never there). There is no retroactive rewriting of the laws. The chance at time $t$ is fixed at time $t$.

  Therefore, the undermining problem is the smoking gun. It shows that you cannot have it both ways. You cannot define chance as a summary of events (Humeanism) and simultaneously demand it function as a guide for expectations about those events (Principal Principle).
  *   If you want the Principal Principle, you must reject Humean Supervenience.
  *   If you want Humean Supervenience, you must admit that "chance" is just a descriptive label we apply after the fact, with no normative power over belief.

  Since physics and philosophy generally agree that chance *does* guide belief (we bet on radioactive decay rates, we design engineering tolerances based on probability), we must conclude that Humeanism is false. The "debug" didn't work because the operating system is incompatible with the software. We need a metaphysics where chance is a real, forward-looking feature of the world, not a backward-looking summary. We need primitivism.
