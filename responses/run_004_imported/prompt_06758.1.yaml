      *   *Verdict:* It is a real objection, not a "easy answer" chase. The response is Williamsonian but needs to acknowledge that this is the contentious point. The "degree properties" point is good but needs to link back to *indiscriminability*. Just because a property comes in degrees doesn't mean the subject can't discriminate the threshold (e.g., a digital readout). The key is *cognitive indiscriminability*.

