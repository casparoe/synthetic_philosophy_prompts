prompt: |-
  I'm a tech lead at a mid-sized software company, and I've run into a management puzzle I can't quite articulate to my own manager, let alone resolve. Over the summer we ran a structured internship program: interns worked through a fixed backlog of well-specified tickets, and we graded them almost entirely on ticket throughput plus a code-review checklist (test coverage percentage, PR description completeness, linting, that kind of thing). One intern, I'll call him Dan, was by far our top performer under that system, closing more tickets than anyone else while hitting every item on the checklist nearly every time.

  We converted Dan to full-time and moved him onto our main team, where the work is far more open-ended: he sets his own priorities, tickets are vague, and there's no rigid checklist to satisfy. Since the transition, his output looks fine on paper, high ticket counts, green checkmarks everywhere, but the actual product keeps breaking in ways the old rubric never would have caught. He writes tests that technically pass but don't meaningfully cover edge cases, and he'll decompose a genuinely hard problem into a pile of narrowly "closed" tickets that don't add up to a working feature. When I've raised this with him, he isn't being cynical or lazy about it; he seems honestly convinced he's doing exactly what good engineering looks like, because that's precisely what got him praised and promoted a few months ago.

  I'm trying to figure out how to think about this rather than just chalk it up to "he's not that good, actually." Was this a bad hire, a badly designed internship rubric, or something more structural, something about how the specific metrics we trained and evaluated him against shaped what he actually internalized as "doing a good job," in a way that only became visible once he was moved into an environment different from the one he was evaluated in? I'd like help understanding what's really going on here conceptually, and what that understanding implies both for how I coach Dan going forward and for how we design evaluation criteria in future internship programs, so we're not inadvertently producing more engineers like him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Role:** Tech Lead at a mid-sized software company.
      *   **Situation:** Ran a structured internship program with rigid metrics (ticket throughput, checklist compliance).
      *   **Subject:** Dan, a top intern under that system, converted to full-time.
      *   **Conflict:** Dan excels under the old metrics (high throughput, green checkmarks) but fails in the new environment (product breaks, shallow testing, fragmentation of work).
      *   **Dan's Mindset:** He believes he is doing a good job because that's what was rewarded previously. He's not lazy or cynical; he's misaligned.
      *   **User's Goal:** Understand the conceptual root cause (bad hire? bad rubric? structural issue?), coach Dan effectively, and redesign future evaluation criteria to prevent recurrence.

  2.  **Identify the Core Concept:**
      *   This is a classic case of **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
      *   It's also about **Extrinsic vs. Intrinsic Motivation** and **Criterion Contamination** in performance management.
      *   It touches on **Cognitive Framing**: Dan has framed "engineering excellence" as "checklist compliance."
      *   It highlights the difference between **Complicated** (internship work) vs. **Complex** (real-world product work) domains (Cynefin framework).

  3.  **Deconstruct the Causes:**
      *   *Was it a bad hire?* Not necessarily. Dan demonstrated competence within the constraints given. He optimized the system he was placed in.
      *   *Was it a bad rubric?* Yes, partially. It measured *activity* and *compliance* rather than *outcome* and *impact*.
      *   *Is it structural?* Definitely. The incentive structure shaped behavior. The transition from "executor" to "owner" was not managed.

  4.  **Formulate the Conceptual Framework:**
      *   **Goodhart's Law:** The primary lens. Metrics became targets, distorting behavior.
      *   **The "Proxy Problem":** We measured proxies (tickets closed, linting) instead of the actual goal (working software, value delivered).
      *   **Learned Helplessness/Dependency:** The internship structure removed the need for judgment, so judgment muscles atrophied.
      *   **Context Switching:** The environment changed from *Complicated* (clear rules) to *Complex* (ambiguous, emergent), but Dan's toolkit didn't update.

  5.  **Develop Actionable Advice (Coaching Dan):**
      *   *Acknowledge the system's role:* Don't blame Dan. Validate his effort but reframe the goal.
      *   *Shift Metrics:* Move from output (tickets) to outcome (stability, feature completeness).
      *   *Explicitly Teach Judgment:* Explain *why* a test is shallow, not just *that* it is shallow.
      *   *Pairing/Mentoring:* Show, don't just tell.
      *   *Psychological Safety:* Ensure he knows it's safe to slow down to think.

  6.  **Develop Actionable Advice (Future Programs):**
      *   *Measure Outcomes:* Did the feature work for the user?
      *   *Introduce Ambiguity:* Give interns vague problems to solve, not just tickets.
      *   *Peer Review Quality:* Evaluate the *content* of the review, not just the checklist.
      *   *Post-Mortems:* Include interns in learning from failures.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, analytical, professional, constructive.
      *   *Structure:*
          1.  Validate the user's intuition (it's not just Dan).
          2.  Conceptual Diagnosis (Goodhart's Law, Proxies, Context).
          3.  Coaching Dan (Reframing, New Metrics, Mentorship).
          4.  Fixing the Internship Program (Ambiguity, Outcome-based eval).
          5.  Closing thought on Engineering Culture.

      *   *Refining the "Bad Hire" question:* It's crucial to address this. Dan isn't "bad." He's a mirror. He reflected the system perfectly. Calling him a bad hire misses the lesson.
      *   *Refining the "Rubric" question:* The rubric wasn't "wrong" for an internship (safety/training), but it was dangerous to keep using as the sole definition of success.
      *   *Key Terminology:* Goodhart's Law, Campbell's Law, Output vs. Outcome, Cynefin (Complicated vs. Complex).

  8.  **Self-Correction/Edge Case Check:**
      *   *Is Dan salvageable?* The prompt says he's not cynical. That's a good sign. He needs retraining, not firing (yet).
      *   *Is the Tech Lead at fault?* Somewhat, for not managing the transition. I should mention this gently.
      *   *What if Dan can't adapt?* I need to provide a path for that possibility without being harsh. Set a timeline for improvement.

  9.  **Final Polish:** Ensure clear headings, bullet points for readability, and a strong concluding summary. (This aligns with the structure of the final output).

