answer: |-
  This is a textbook case of **Goodhart's Law** in action, compounded by a failure to manage the transition from a *complicated* domain to a *complex* one.

  To answer your primary question directly: **This was not a bad hire. This was a successful system producing exactly the behavior it was designed to produce.** Dan is not the bug; he is the feature. He optimized the environment you gave him with impressive efficiency.

  Here is a conceptual breakdown of what happened, how to coach Dan, and how to redesign your evaluation framework.

  ### 1. The Conceptual Diagnosis

  **Goodhart's Law and Proxy Metrics**
  Goodhart's Law states: *"When a measure becomes a target, it ceases to be a good measure."*
  Your internship rubric used **proxies** for engineering excellence (ticket count, linting, test coverage %) because measuring actual engineering excellence (system stability, maintainability, business value) is hard. Dan realized that the *goal* was not "build good software," but "maximize the metrics." He didn't game the system cynically; he internalized the metrics as the definition of the work.

  **Output vs. Outcome**
  You evaluated Dan on **output** (tickets closed, lines of code, checkmarks) rather than **outcome** (features working in production, reduced bug rates, user satisfaction). In a structured internship, output is safe to measure. In a product team, output without outcome is technical debt.

  **The Cynefin Framework (Complicated vs. Complex)**
  *   **Internship (Complicated):** The problems had known solutions, clear requirements, and right/wrong answers. The path to success was following the process.
  *   **Full-Time (Complex):** The problems are ambiguous. Requirements emerge as you build. "Done" is subjective and based on value, not a checklist.
  Dan is applying a *Complicated* domain toolkit (follow the recipe) to a *Complex* domain problem (experiment and adapt). He lacks the **judgment muscle** because the internship didn't require him to flex it.

  ### 2. How to Coach Dan

  You cannot simply tell Dan to "do better." He genuinely believes he is performing well. You have to rewire his mental model of what engineering value is.

  **A. Own the Systemic Mismatch**
  Start the conversation by validating his effort and admitting the system's role.
  *   *Say:* "Dan, you crushed the internship metrics. You optimized exactly what we asked you to optimize. The problem is that those metrics were training wheels, and we didn't tell you clearly enough when to take them off. I need to help you shift from 'completing tickets' to 'owning outcomes.'"
  *   *Why:* This reduces defensiveness. It frames the issue as a level-up in responsibility, not a correction of failure.

  **B. Change the Definition of "Done"**
  Stop accepting tickets based on the checklist.
  *   *Action:* Implement a "Value Verification" step. A ticket isn't closed when the tests pass; it's closed when the feature works in staging/production without breaking adjacent systems.
  *   *Action:* Require a "Why" in the PR description. Not just *what* changed, but *what user problem* this solves. If he can't articulate the value, the code isn't done.

  **C. Teach Judgment via Pairing**
  Dan doesn't know what a "meaningful" test looks like because he was trained to care about coverage percentage.
  *   *Action:* Pair program with him on a tricky bug. Narrate your thought process. "I'm not writing a test here to hit 80% coverage; I'm writing it because this specific edge case caused a crash last month."
  *   *Action:* When he breaks production, do a blameless post-mortem *with him*. Ask: "Which metric told you this was ready? Why did that metric lie to us?"

  **D. Set New Guardrails**
  Give him permission to slow down. High-performing metric-chasers often fear that slowing down looks like laziness.
  *   *Say:* "I would rather you close 5 tickets that never break than 20 tickets that require hotfixes. Your bonus/review will be tied to stability, not throughput."

  ### 3. Fixing the Internship Program

  To prevent creating more "Dans," you need to introduce ambiguity and outcome-based evaluation into the internship.

  **A. Introduce "Fuzzy" Tickets**
  Don't give interns a perfectly specified backlog for the whole summer.
  *   *Change:* Give them one or two projects where they have to write the spec themselves. Grade them on how well they identified edge cases *before* coding, not just how well they coded.
  *   *Goal:* Force them to practice requirement gathering and scoping, not just execution.

  **B. Evaluate the "Why," Not Just the "What"**
  *   *Change:* In code reviews, have seniors ask "Why did you choose this pattern?" or "What happens if this API fails?"
  *   *Grading:* Deduct points not for linting errors, but for failing to anticipate failure modes. Make "System Thinking" a graded category equal to "Code Quality."

  **C. Measure Downstream Impact**
  *   *Change:* If possible, keep interns on the team for a month after their code ships.
  *   *Grading:* Part of their final grade should be based on the bug rate of their code in the first two weeks of production. This teaches them that "merged" does not mean "finished."

  **D. The "Broken Build" Simulation**
  *   *Change:* Intentionally give them a ticket that is impossible to solve with the current architecture, or give them a vague requirement.
  *   *Goal:* See if they ask for help, push back on the spec, or blindly hack until the tests pass. Reward the ones who ask questions over the ones who hack quickly.

  ### Summary

  Dan is a mirror. He is reflecting the incentives you built.
  *   **Is he a bad hire?** No. He is likely a capable engineer who needs retraining on *judgment*.
  *   **Was the rubric bad?** It was too narrow. It measured compliance, not competence.
  *   **Is it structural?** Yes. You optimized for velocity and safety during the internship, and now you are paying the price in technical debt.

  **Immediate Next Step:** Have the "System vs. Outcome" conversation with Dan. Make it safe for him to fail a metric in service of a better product. If, after 3 months of coaching on *judgment* rather than *output*, he cannot adapt, then you have a hiring mismatch. But based on your description, this is a solvable alignment issue.
