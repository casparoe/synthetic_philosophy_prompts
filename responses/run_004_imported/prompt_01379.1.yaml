answer: |-
  You are not strawmanning. In fact, your grasp of the theory is sharper than the way your housemate deployed it. You have correctly identified a classic equivocation that happens when economic terminology leaks into casual conversation, and you've accurately mapped the theoretical counter-moves economists have developed to deal with exactly this problem.

  Here is the sanity check on your four points, followed by the specific "holes" you asked for.

  ### 1. Samuelson and the Definition of Preference
  **Verdict: Accurate.**
  You are right about the history and the intent. Paul Samuelson's *Foundations of Economic Analysis* (1947) and his earlier papers were explicitly behaviorist. He wanted to purge economics of "utility" as a psychological state (hedons) and replace it with observable choice data.
  *   **The Theory:** Preference is defined *as* the ordering that rationalizes the choice. It is a tautology by design: "You chose A over B, therefore A is preferred to B."
  *   **The Trap:** Because it is a tautology, it cannot be wrong *descriptively* (within its own axioms), but it loses all *normative* power. It tells us what you did, not what makes you better off. Your housemate used a descriptive definition to make a normative claim ("this is what you want"). That is the equivocation.

  ### 2. The Equivocation (Positive vs. Normative)
  **Verdict: Spot on.**
  This is the core of your argument. In welfare economics, there is a "Standard Economic Model" assumption that **Choice = Welfare**.
  *   **The Housemate's Move:** She is assuming that because RP strips away psychology, the resulting "preference" is the *true* preference.
  *   **The Reality:** RP strips away psychology to make the math cleaner, not to reveal the "true self." By saying "you revealed you prefer scrolling," she is smuggling in the idea that your "scrolling self" is the authoritative version of you, and your "regretful morning self" is just noise. RP theory itself doesn't grant that authority; it just records the choice.

  ### 3. Planner-Doer and Menu Preferences
  **Verdict: Accurate citations and logic.**
  *   **Thaler & Shefrin (1981):** Yes, the "Planner-Doer" model explicitly rejects the idea of a unitary agent. If the agent is fragmented, "revealed preference" becomes ambiguous. Which agent is revealing?
  *   **Gul & Pesendorfer (2001):** You nailed this. Their model of "Temptation and Self-Control" preserves Revealed Preference theory but expands the domain of choice from *alternatives* to *menus* (sets of alternatives).
      *   *Why this matters:* If you choose to throw out the junk food (restrict the menu), standard RP says you are irrational (why limit your future freedom?). Gul & Pesendorfer say: No, you have a preference over *menus*. You revealed a preference for the menu {healthy food} over the menu {healthy food, junk food}. This saves the math of RP but admits that the "naive" version (where more choice is always better) is broken for humans with self-control issues.

  ### 4. Welfare Economics and Inconsistency
  **Verdict: Correct.**
  *   **Bernheim & Rangel (2007/2009):** Their work on "Behavioral Welfare Economics" is exactly what you described. They argue that when choices are context-dependent or inconsistent, we cannot treat all choices as welfare-relevant. We need to distinguish between "ancillary conditions" (like being tired at 11 PM) and "welfare-relevant choices."
  *   **The Implication:** If you choose scrolling at 11 PM (tired) but choose "no scrolling" at 2 PM (fresh), a welfare economist following Bernheim & Rangel would likely weight the 2 PM choice higher for welfare analysis, because the 11 PM choice is contaminated by a "hot state." Your housemate treated them as equal data points; the literature says they are not.

  ---

  ### The "Hole" Check: Where you might be vulnerable

  You asked if there is a real sense in which economists think choice *is* welfare, or if you are garbling the planner-doer stuff. Here are the three nuances a PhD student might use to push back:

  **1. The "As If" Defense (Prediction vs. Truth)**
  An orthodox economist might argue: *"I don't care if there's a planner and a doer. I don't care about welfare. I just want to predict behavior. If I model you as someone who prefers scrolling, my model predicts you will scroll tonight. If I model you as someone who wants to read, my model fails. Therefore, for the purpose of prediction, RP holds."*
  *   **Counter:** This works for market demand, but it fails for your specific complaint. You aren't asking for a prediction; you are asking for a normative judgment on your well-being. She used a predictive tool to answer a welfare question.

  **2. The WARP Violation Nuance**
  You mentioned that buying books at 2 PM and scrolling at 11 PM violates consistency (WARP). Technically, a strict micro-theorist might say: *"The choice sets weren't identical. At 2 PM, the cost of willpower was low. At 11 PM, the cost of willpower was high. Therefore, the relative prices changed, and there is no violation."*
  *   **Counter:** This is a defensive move. If "willpower depletion" counts as a price change, then *any* inconsistency can be rationalized by inventing a new price. This renders the theory unfalsifiable. Your point stands: if we treat internal states as prices, "preference" loses its meaning as a stable ranking.

  **3. The "Cheap Talk" Argument**
  This is likely what your housemate *actually* meant, even if she phrased it poorly. Economists are trained to distrust "stated preferences" (surveys, complaints, resolutions) because they are cheap. "Revealed preference" is the reminder that **actions have costs**.
  *   **The Valid Point:** You *are* choosing scrolling. The cost of picking up the book (effort, boredom) is higher than the cost of scrolling in that moment.
  *   **The Missing Piece:** Acknowledging the cost doesn't mean the choice is *good for you*. It just means it was the path of least resistance. Her comment dismissed the conflict; your argument highlights that the conflict is the interesting part.

  ### Conclusion

  You have not garbled the theory. You have essentially reconstructed the last 40 years of Behavioral Welfare Economics in a week.

  *   **Is the equivocation real?** Yes. She used a positive definition (choice) to make a normative claim (what you prefer/want).
  *   **Did you get the models right?** Yes. Thaler/Shefrin and Gul/Pesendorfer are the correct references for internal conflict and menu preferences.
  *   **Is there a hole?** Only if you care purely about short-term behavioral prediction rather than long-term welfare or psychological accuracy.

  **How to bring it back to her:**
  Don't frame it as "You're wrong." Frame it as "I looked into that, and it turns out your field has a whole sub-debate about exactly why that answer feels unsatisfying."

  You can say: *"I was thinking about your revealed preference comment. I get that actions > words for prediction. But doesn't that break down for welfare? If I use Gul & Pesendorfer, I can say I revealed a preference for a menu without temptation. If I use Bernheim & Rangel, my 11 PM choice is 'hot state' noise. So saying I 'prefer' scrolling ignores the inconsistency literature. Which model are you using?"*

  That should either start a great conversation or make her very glad she's in the library.
