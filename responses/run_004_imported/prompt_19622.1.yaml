prompt: |-
  So I'm interning this summer at a small health-economics consultancy that does cost-effectiveness analysis for public health programs, and this week I've basically been staring at QALY spreadsheets trying to figure out whether its even legitimate to treat one QALY as worth the same amount regardless of whose life it's attached to. When I brought this up with the senior analyst on my team — basically, "aren't we just assuming we can compare how much a year of health means to totally different people?" — she waved it off with "that's an old problem, Harsanyi basically solved it decades ago," which sent me down a rabbit hole all weekend instead of doing my actual assigned reading.

  Here's where I've gotten to. Harsanyi's aggregation theorem says that if individual preferences and "social" preferences both satisfy the expected-utility axioms, and the social ranking respects unanimity (if everyone's indifferent between two options, so is society), then social welfare has to be some weighted sum of individual utility functions. Fine so far. But then I found a bunch of secondary reading (mostly citing Sen, and apparently a guy named Weymark wrote the paper everyone treats as the last word on it) arguing that this doesn't actually buy you interpersonal comparability, because each person's utility function in that theorem is only pinned down up to their own arbitrary zero point and scale — the theorem itself is completely silent on how to line up "one unit" of my utility with "one unit" of yours. So going from "some weighted sum" to "the equal-weighted, utilitarian sum" requires sneaking in exactly the interpersonal comparison that was supposedly still up for grabs. My roommate, who's an econ PhD student, thinks I'm being unfair to Harsanyi here, and that the actual comparability work is supposed to come from his earlier "impartial observer" paper, not the aggregation theorem by itself, and that the two are meant to be read as one package.

  I'd like you to actually build the skeptical case here as rigorously as you can, partly because I want to be able to hold my own with my roommate about it: argue that Harsanyi's aggregation theorem, whether taken alone or together with the impartial-observer/equiprobability model, does not establish that interpersonal utility comparisons are meaningful, and that presenting it as having "solved" the comparability problem is at best a sleight of hand. I don't want the lazy version of this argument (something like "well, feelings are subjective, so who's to say" — I could've come up with that myself); I want you to actually pin down the exact point in the formal setup where an unearned comparability assumption gets smuggled in, and explain why the impartial-observer move doesn't rescue it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Intern at a health-economics consultancy. Working on cost-effectiveness analysis (CEA), specifically QALYs.
      *   **Context:** Questioning the ethical/technical legitimacy of treating 1 QALY as equal across individuals.
      *   **Trigger:** Senior analyst cited Harsanyi as "solving" the interpersonal comparability problem.
      *   **Research:** User has dug into Harsanyi's Aggregation Theorem and found critiques (Sen, Weymark).
      *   **Conflict:** Roommate (Econ PhD student) argues Harsanyi's Aggregation Theorem + Impartial Observer Theorem (IOT) together solve it. User wants to argue the skeptical case: that Harsanyi *doesn't* solve interpersonal utility comparisons (IUC).
      *   **Requirement:** Rigorous argument. No lazy subjectivism ("feelings are subjective"). Pinpoint exactly where the unearned assumption enters the formal setup. Explain why the Impartial Observer move fails to rescue it.
      *   **Goal:** Enable the user to hold their own in a debate with the roommate.

  2.  **Deconstruct the Philosophical/Economic Problem:**
      *   **The Core Issue:** Interpersonal Utility Comparisons (IUC). Utilitarianism requires summing utilities ($W = \sum u_i$). But utility functions are unique only up to positive affine transformations ($u'_i = a_i u_i + b_i$). To sum them, we need a common scale ($a_i = 1$ for all $i$) and a common zero point ($b_i = 0$ for all $i$).
      *   **Harsanyi's Aggregation Theorem (1955):** If individual and social preferences satisfy von Neumann-Morgenstern (vNM) axioms and Pareto (unanimity), then $W = \sum c_i u_i$.
          *   *Critique:* This proves the *form* is linear, but not the *weights* ($c_i$) or the *scaling* of the $u_i$'s relative to each other. The $u_i$'s are still cardinally measurable but interpersonally non-comparable.
      *   **Harsanyi's Impartial Observer Theorem (1953/1955):** An observer behind a veil of ignorance (equal probability of being anyone) maximizes expected utility.
          *   *Mechanism:* Observer imagines being person $i$ with probability $1/N$.
          *   *Critique:* To calculate expected utility, the observer needs to compare "being person $i$" vs. "being person $j$." This requires mapping $u_i$ and $u_j$ onto a single scale. Where does this mapping come from?

  3.  **Formulate the Skeptical Argument (The "Weymark/Sen" Line):**
      *   *Step 1: The Aggregation Theorem Limit.* The theorem derives linearity from Pareto + vNM. It does *not* derive unit comparability. The coefficients $c_i$ absorb the scaling differences. If $u_1$ is measured in "hedons" and $u_2$ in "utils," the $c_i$ adjusts for that. But without an external anchor, $c_i$ is arbitrary.
      *   *Step 2: The Impartial Observer's Hidden Assumption.* The IOT assumes the observer can form preferences over "being $i$ in state $x$" vs. "being $j$ in state $y$." This is a preference over *identity-state pairs*.
      *   *Step 3: The Extension Problem.* To apply vNM axioms to these identity-state pairs, the observer must treat them as a single domain. But this presupposes that the observer can meaningfully rank $(i, x)$ against $(j, y)$. This ranking *is* the interpersonal comparison. It's not derived; it's assumed in the domain definition.
      *   *Step 4: Empathy vs. Measurement.* Harsanyi assumes "extended preferences" are based on rational empathy. But rational empathy doesn't guarantee a unique scaling. I can prefer being a healthy me to being a sick you, but does that mean my health gain is *larger* than your health loss in a summable sense? Or just that I prefer it?
      *   *Step 5: The QALY Connection.* In QALYs, we assume 1 QALY = 1 QALY. Harsanyi's framework might justify *summing*, but it doesn't justify the *metric* being identical across people without assuming the "extended preferences" align perfectly with the clinical metric, which is a huge leap.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the user's query. Validate that their roommate is partially right (they are a package) but the skeptical case is stronger than often admitted.
      *   **Part 1: The Aggregation Theorem (The "Form without Scale" Argument).**
          *   Explain vNM utility uniqueness (affine transformation).
          *   Show the theorem: $V = \sum c_i u_i$.
          *   The Trap: If $u_i$ is scaled arbitrarily, $c_i$ just counter-scales. The theorem allows $c_1 u_1 + c_2 u_2$ to be equivalent to $u_1 + 100 u_2$ just by redefining units. It proves *weighted utilitarianism* is consistent, not that *equal-weight utilitarianism* is mandated.
      *   **Part 2: The Impartial Observer (The "Domain Expansion" Argument).**
          *   Explain the setup: Preferences over $(i, x)$.
          *   The Sleight of Hand: To have a vNM function over $(i, x)$, you need to compare lotteries involving different identities.
          *   The Critique (Weymark/Sen): This requires "extended preferences." But where do these come from? If they are the observer's *own* preferences, it's paternalistic. If they are supposed to represent $i$'s preferences, how does the observer know the intensity?
          *   Key Point: The IOT assumes the observer *can* compare. It doesn't explain *how* without smuggling in a metric.
      *   **Part 3: The "Identity" Problem (The Deep Cut).**
          *   Harsanyi assumes "being $i$" is a state like "having an apple."
          *   But preferences are endogenous to identity. My utility function is part of who I am.
          *   To compare $u_i(x)$ and $u_j(x)$, you need a "super-utility" function. Harsanyi posits this exists but doesn't derive its scaling properties from rationality axioms alone.
      *   **Part 4: Application to QALYs (Bringing it Home).**
          *   QALYs assume a standard "health state" value.
          *   Harsanyi requires the observer to value "being Patient A with Health State X" vs "Patient B with Health State X."
          *   If Patient A adapts to disability (response shift) and Patient B doesn't, their $u$ differs for the same QALY.
          *   Harsanyi's observer must decide whose adaptation counts. The axioms don't decide this.
      *   **Conclusion:** Summarize the "Unearned Assumption." It's not in the math; it's in the interpretation of the domain.

  5.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Did I address the roommate's point? Yes, by showing that even combined, the scaling issue persists.
      *   *Check:* Is it too philosophical? Need to keep it tied to the formal axioms (vNM, Pareto).
      *   *Check:* Is the Weymark reference accurate? Yes, Weymark (1991) is the standard critique on Harsanyi's IOT regarding IUC.
      *   *Tone:* Professional, rigorous, empathetic to the intern's dilemma.
      *   *Key Distinction:* Distinguish between *ordinal* comparability (ranking) and *cardinal* unit comparability (scaling). Harsanyi gets cardinality within persons, but not across persons without the extra assumption.

  6.  **Final Polish:** Ensure the distinction between the Aggregation Theorem (social welfare function form) and the Impartial Observer (ethical justification for weights) is clear, and how both fail to fix the *unit* problem. (The Aggregation Theorem leaves weights $c_i$ indeterminate; the IOT tries to fix weights at $1/N$ but assumes comparability to do so).

      *Wait, one nuance:* Harsanyi's IOT actually tries to derive equal weights ($1/N$) from the equiprobability assumption. The critique is that equiprobability only works if the utility scales are already normalized. If $u_1$ ranges 0-10 and $u_2$ ranges 0-1000, a 50/50 chance of being either is meaningless without normalization. This is the crux. I need to emphasize *normalization*.

  7.  **Final Plan:**
      1.  Validate the user's intuition (it's a classic debate).
      2.  Break down the Aggregation Theorem (Linearity $\neq$ Comparability).
      3.  Break down the Impartial Observer (Equiprobability $\neq$ Normalization).
      4.  Highlight the "Extended Preferences" assumption as the smuggling point.
      5.  Connect to QALYs (Adaptation/Heterogeneity).
      6.  Provide debate ammo for the roommate conversation.

  8.  (Self-Correction during drafting): Make sure not to say Harsanyi is "wrong," but that his solution is *conditional* on assumptions that are as strong as the problem they solve. The claim is he "solved" it; the counter-claim is he "relocated" it.

  9.  **Final Review against constraints:** Rigorous? Yes. No lazy subjectivism? Yes. Pinpoint formal setup? Yes. Address IOT? Yes.

      *Let's write.*
answer: |-
  This is an exceptionally sharp observation for a summer intern. You have correctly identified one of the most persistent fault lines in normative economics. Your roommate is right that Harsanyi intended the Aggregation Theorem and the Impartial Observer Theorem (IOT) to work as a package, but you are also right that the "solution" is often oversold in applied contexts like health economics.

  The claim that Harsanyi "solved" interpersonal utility comparisons (IUC) is technically false. What he actually did was **relocate** the problem from the social welfare function to the definition of the individual preference domain. He didn't derive comparability from rationality axioms alone; he assumed a specific type of preference structure that *presupposes* comparability.

  Here is the rigorous skeptical case, broken down by the formal mechanics, so you can dismantle the "Harsanyi solved it" claim with precision.

  ### 1. The Aggregation Theorem: Linearity $\neq$ Comparability

  Your senior analyst is likely referencing Harsanyi's 1955 Aggregation Theorem. The theorem states that if individual preferences and social preferences satisfy von Neumann-Morgenstern (vNM) rationality axioms, and society respects the Pareto principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then the social welfare function $W$ must be a linear combination of individual utilities:

  $$W = \sum_{i=1}^{n} c_i u_i$$

  **The Skeptical Pivot:**
  The theorem proves the *form* of the aggregation (linearity), but it leaves the **weights ($c_i$)** and the **scaling of the $u_i$'s** completely indeterminate.

  Recall that vNM utility functions are unique only up to positive affine transformations. For any individual $i$, $u_i$ is equivalent to $u'_i = a_i u_i + b_i$ (where $a_i > 0$).
  *   Person A's utility might be measured on a scale of 0 to 1.
  *   Person B's utility might be measured on a scale of 0 to 1,000,000.

  The Aggregation Theorem allows for both. If Person B's scale is larger, the weight $c_B$ will simply be smaller to compensate. The math works out identically. Therefore, the theorem **cannot** distinguish between:
  1.  **Utilitarianism:** Everyone counts equally ($c_i = 1$), assuming utilities are already on a common scale.
  2.  **Weighted Utilitarianism:** Some people count more, or their units are different.

  **The Smuggle:** To move from "some weighted sum" to "the utilitarian sum" (where every QALY counts equally), you must assert that $a_i = 1$ for all $i$. The Aggregation Theorem provides no mechanism to normalize these scales. It treats the $u_i$'s as black boxes that satisfy axioms, but it is silent on how to calibrate the boxes against each other.

  ### 2. The Impartial Observer: Equiprobability $\neq$ Normalization

  Your roommate will argue that the Impartial Observer Theorem (IOT) fixes the weights. In this model (Harsanyi 1953, 1955), an ethical observer chooses social rules behind a veil of ignorance, assuming an **equal probability ($1/n$)** of becoming any person $i$ in society. The observer maximizes expected utility:

  $$E[U] = \sum_{i=1}^{n} \frac{1}{n} u_i(x)$$

  This looks like classical utilitarianism. It seems to solve the weight problem ($c_i = 1/n$). But this is where the deeper sleight of hand occurs, identified rigorously by John Weymark (1991) and Amartya Sen.

  **The Formal Flaw:**
  For the observer to calculate an *expected* utility over the lottery "become person $i$ or person $j$," the outcomes $(i, x)$ and $(j, x)$ must be defined on a **single, common utility scale**.

  Expected utility theory requires that you can compare the *intensity* of preference between all outcomes in the lottery.
  *   Outcome A: Being Person 1 with Health State $X$.
  *   Outcome B: Being Person 2 with Health State $X$.

  For the observer to say "I am indifferent between a 50% chance of A and a 50% chance of B," they must be able to measure the utility of "being Person 1" and "being Person 2" in the same units.

  **The Smuggle:**
  Harsanyi assumes the observer has **"extended preferences."** These are preferences over *identity-state pairs*. The axioms of rationality apply to these extended preferences.
  *   **The Critique:** The existence of a coherent vNM function over extended preferences *already assumes* interpersonal comparability. It assumes the observer can meaningfully say, "The gain from moving from sickness to health for Person 1 is *equal to* the gain for Person 2."
  *   **Why it fails:** Rationality axioms (completeness, transitivity, continuity, independence) constrain how an agent ranks options *given* a scale. They do not generate the scale itself. By defining the domain as "identity-state pairs," Harsanyi **stipulates** that such comparisons are possible. He hasn't derived comparability from non-comparable inputs; he has assumed comparable inputs to begin with.

  As Weymark puts it, Harsanyi's theorem shows that *if* interpersonal comparisons are meaningful, *then* utilitarianism follows. It does not show *that* they are meaningful.

  ### 3. The "Identity" Problem (The Deep Cut)

  If you want to really press the argument, bring up the endogeneity of preferences.

  Harsanyi's model treats "being person $i$" as a state of the world, like "raining" or "sunny." But a person's identity *includes* their utility function (their capacity to enjoy things, their adaptation levels, their values).

  *   **Person A (Adaptive):** Has a chronic disability but has adapted. Reports high satisfaction (high $u_A$) with a modest health improvement.
  *   **Person B (Non-Adaptive):** Has the same disability but has not adapted. Reports low satisfaction (low $u_B$) with the same improvement.

  In your QALY spreadsheet, these are treated as identical health gains (1 QALY).
  In Harsanyi's IOT, the impartial observer must choose between becoming A or B.
  *   If the observer uses A's utility function to evaluate "being A," and B's utility function to evaluate "being B," they are using two different rulers.
  *   To compare them, the observer must use a **third ruler** (the observer's own extended utility function).

  **The Critical Question:** Whose metric does the observer's third ruler use?
  1.  **If it uses the observer's own subjective valuation:** It is paternalistic. It ignores the actual preferences of A and B.
  2.  **If it tries to average A and B's rulers:** It begs the question. You need a common scale to average the rulers, which is exactly what you are trying to prove exists.

  Harsanyi assumes the observer can "empathize" perfectly and translate everyone's utility into a common currency. But "perfect empathy" is not a formal axiom; it is a psychological assumption that smuggles in the comparability it claims to derive.

  ### 4. Why This Matters for Your QALYs

  In health economics, we treat QALYs as technically cardinal and interpersonally comparable. We assume a year of life in health state $X$ is worth the same $u$ for everyone.

  Harsanyi's framework is often cited to justify this. But based on the critique above:
  1.  **Aggregation Theorem:** Justifies summing QALYs only if you already assume QALYs are comparable units. It doesn't prove they are.
  2.  **Impartial Observer:** Justifies equal weighting only if the "impartial observer" can normalize different people's health valuations onto a single scale.

  **The "Unearned Assumption":**
  The assumption is that **preference satisfaction is the only thing that matters, and it is measurable on a common scale.**
  Harsanyi's math works *conditional* on this. But in public health, we know preferences adapt (the disability paradox). If Person A values a year of life at 0.8 and Person B values it at 0.5 due to different psychological adaptations, Harsanyi's observer must decide: do we respect A's valuation, B's valuation, or impose a standard "health" valuation?
  *   If we respect individual valuations, we can't sum them (no common scale).
  *   If we impose a standard valuation (like EQ-5D weights), we are overriding individual preferences, which violates the Pareto axiom Harsanyi relies on.

  ### Summary for Your Roommate

  When you talk to your roommate, don't argue about "subjective feelings." Argue about **normalization conditions**.

  1.  **The Aggregation Theorem** establishes linearity ($W = \sum c_i u_i$), but the coefficients $c_i$ are indeterminate without a normalization rule. The theorem allows $c_1=1, c_2=1$ just as easily as $c_1=1, c_2=100$. It does not force utilitarianism.
  2.  **The Impartial Observer** attempts to fix $c_i = 1/n$ via equiprobability. However, expected utility over identities requires the outcomes "being $i$" and "being $j$" to be cardinally comparable *ex ante*.
  3.  **The Conclusion:** Harsanyi does not derive interpersonal comparability from non-comparable preferences. He **assumes** the existence of "extended preferences" that are already interpersonally comparable. He solves the problem by defining it away in the domain setup.

  **The Punchline:**
  Harsanyi didn't solve the problem of interpersonal comparisons; he transformed it into the problem of **extended preference formation**. And since there is no axiomatic basis for how an observer constructs extended preferences (other than assuming they align with a utilitarian metric), the "solution" is circular. In the context of your QALYs, treating 1 QALY as equal across persons is an ethical choice, not a theorem-derived necessity.

  ### Suggested Reading to Cite
  If you want to drop references that show you've done the work:
  *   **Weymark, J. A. (1991).** "A Reconsideration of the Harsanyi-Sen Debate on Utilitarianism." *Interpersonal Comparisons of Well-Being*. (This is the definitive technical critique).
  *   **Sen, A. (1976/1979).** "Utilitarianism and Welfarism." (Sen argues Harsanyi conflates utility with welfare).
  *   **Mongin, P. (2001).** "The Impartial Observer Theorem of Social Ethics." (A rigorous breakdown of where the assumptions hide).

  You are right to be skeptical. The spreadsheet treats QALYs as physical units like kilograms, but Harsanyi's "solution" only works if you assume everyone's internal kilogram is calibrated to the same standard weight—and he offers no proof that the calibration exists, only that if it did, utilitarianism would follow.
