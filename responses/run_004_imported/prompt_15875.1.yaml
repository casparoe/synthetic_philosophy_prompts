      *   **Point 1: The Dennettian Core.** Mechanistic interpretability is fundamentally about reverse-engineering a black box. If a feature description allows you to predict behavior or compress the weight story, it passes the Real Patterns test. The "objective existence" claim is usually cashed out in terms of causal leverage, not metaphysical substance.
