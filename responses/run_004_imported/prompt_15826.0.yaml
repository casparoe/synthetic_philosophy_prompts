  Had a long back-and-forth with my friend Marcus last night that's still bugging me. I've got a decent corporate job with a pretty clear ladder in front of me (raises, a title bump coming, equity that vests over a few years), and for the past several months I've been teaching myself cello a couple nights a week -- badly, with zero plan to ever perform or record anything, I just like doing it. Marcus's point was that this time should go toward stuff that actually builds toward something (a certification, freelance work on the side, whatever), since right now is the window where that kind of effort compounds, and once I've got real financial security I can 'noodle on the cello all day if I want.' He made it sound pretty resonable, honestly, and I couldn't articulate what felt off about it in the moment, which didn't help my case. Was he basically right that the cello only makes sense once I've earned some kind of security first, or is theres a hole in how he's dividing things up?
