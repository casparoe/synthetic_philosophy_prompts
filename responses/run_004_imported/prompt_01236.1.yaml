answer: |-
  The monitor's green line was not a heartbeat to Elias; it was a tether. As long as the spike rose and fell in its rhythmic jaggedness, the collection of particles in the bed was caught up in a single, violent event. They were locked in a life. They were *one*.

  When the line flattened, Elias believed, the one would shatter. The woman in the bed would not merely die; she would cease to be an object. There would be no body, only atoms arranged body-wise, drifting apart like dust motes in a sunbeam, no longer bound by the singular activity of metabolism.

  "You're staring at the waveform again," Julian said. He sat in the vinyl chair by the window, peeling the label off a water bottle. He sounded tired, but his posture was loose, unburdened. "She's still there, Elias. Even if the machine stops."

  Elias didn't turn. He watched the rise of Clara's chest, the artificial inflation of lungs that no longer knew how to demand air. "You think she's a thing. A substance."

  "I think she's my sister," Julian said. He smoothed the wet paper label onto his knee. "And when she goes, she'll be my sister who passed. I'll visit the grave. I'll talk to the stone."

  Elias finally turned. The hospital room was dim, lit only by the standby lights of the infusion pumps. "You don't understand. You think composition is universal. You think any old heap of trash makes an object. A man, a rock, a scattered pile of gravel on the highway—it's all the same to you. Just things composing things."

  "Isn't it?" Julian stood up and walked to the bed. He reached out, resting his hand on Clara's forearm. The skin was cool, waxy. "She's here. I'm touching her."

  Elias flinched. He wanted to shout that Julian was touching a deception. Under Julian's hand, there was no *arm*. There were only bones and tissues and fluids, momentarily coincident, waiting for the final release of the life-activity that glued them into a unity. To Elias, Julian's comfort was a category error. You cannot comfort a scattering.

  "The machine keeps the event going," Elias said, his voice low. "It sustains the composition. If you pull the plug, you aren't killing her. You're dissolving her. There won't be anyone left to bury."

  "That's poetry, Elias. Morbid poetry." Julian squeezed Clara's hand. "She's solid. She's real."

  "She's a life," Elias corrected. "That's the only condition. When the activity stops, the composite vanishes. What remains is just… debris. Arranged Clara-wise."

  Julian sighed, pulling his hand back. He looked at his palm as if expecting to find residue. "You've been reading those papers again. The metaphysics stuff. You're using it to hide."

  "I'm using it to see."

  "You're using it to avoid saying goodbye." Julian walked to the door. "The doctor comes in ten minutes. We have to decide. Do we extend? Or do we let her go?"

  Elias looked back at the monitor. The green line flickered. He knew the medical facts: brain stem function was negligible. The body was running on chemistry and electricity, not on the internal coordination of an organism. By his own strictures, Clara was already gone. The life-activity had fractured. The composite object *Clara* had ceased to exist the moment her brain stopped integrating the signals. What lay in the bed was a phantom, a lingering arrangement of simples pretending to be a woman.

  But he couldn't tell Julian that. If Julian believed in universal composition, he believed the phantom was real. If Elias admitted the truth, he admitted he was mourning nothing. You cannot grieve a scattering. You can only regret an arrangement.

  "Let her go," Elias said.

  Julian paused at the door. "You sure?"

  "The activity is gone. The object is already gone."

  Julian nodded, a sad, slow movement. "I'll tell the doctor."

  When Julian left, Elias moved to the bedside. He hovered his hand over Clara's face. He didn't touch her. To touch her would be to validate the illusion that she was a single thing. He traced the contour of her cheek in the air, following the boundary where her particles met the air particles.

  He remembered the first time he'd read van Inwagen. *Composition occurs only when the activity of the xs constitutes a life.* It had felt like a relief then. It meant that tables and chairs were fictions, mere conveniences of language. Only living things were real. It made the world feel sacred, populated by genuine unities rather than dead clutter.

  Now, it made the world a graveyard of ghosts.

  The doctor entered quietly, followed by Julian. The nurse began the process of disconnecting the tubes. The hiss of the ventilator stopped. The room grew heavier, the silence pressing against the walls.

  Elias watched the chest. It rose once, mechanically, from the residual pressure, then settled. The monitor emitted a long, continuous tone.

  Julian stepped forward immediately. He took Clara's hand again. He leaned down and kissed her forehead. "Rest now," he whispered. He treated the body as a vessel that still held the essence of the person, a continuous object that had merely changed state.

  Elias stood frozen. He felt a vertigo, a sense that the room had suddenly expanded. The unity was broken. The particles in the bed were no longer caught in the vortex of life. They were just there. Carbon, water, calcium. They were no longer *her*. They were merely arranged where she had been.

  "Elias," Julian said, turning. "Come say goodbye."

  "I already did," Elias said. "When the line broke."

  "You're being cold."

  "I'm being precise."

  Julian's face hardened. "She loved you. Doesn't that count for something? Doesn't that make her real?"

  "It made her real," Elias said. "Past tense. The condition is no longer met."

  "That's bullshit." Julian stepped away from the bed, his voice rising. "You're hiding behind words so you don't have to feel this." He gestured at the body. "This is Clara. This is what's left of her."

  "No," Elias said. He looked at the stillness of the form. "This is what's left of the arrangement. Clara was the event. The fire. You're looking at the ash and calling it the flame."

  Julian shook his head, wiping his eyes. "I'm going to call the funeral home. They'll come to collect… to collect her."

  "They'll collect the debris," Elias said.

  Julian stopped at the door. He looked back, his expression a mix of pity and anger. "You know, if you're right… if she really just vanished… then you're alone in here. There's no one to mourn. There's no one who died."

  "I know," Elias said.

  "And if I'm right," Julian said, his hand on the frame, "if everything composes, if the body is still an object, still her… then you're refusing to touch her. You're refusing to say goodbye to a person because of a theory."

  Elias looked at his own hands. They were shaking. He was a composite object, currently. His cells were cooperating, bound by his own life. He was real, for now. But he was surrounded by ghosts. The bed, the chair, the monitor—they were all fictions, scattered particles pretending to be tools. Only he and the memory of the life that had been in the bed were true.

  "Go make the call, Julian," Elias said.

  Julian left. The door clicked shut.

  Elias was alone with the scattering. He knew he should leave. He knew the funeral home would come and take the atoms away, bury them in a box, mark the ground with a stone. They would treat the debris as a person. They would speak to the arrangement.

  He walked to the bed. He knew it was irrational. If van Inwagen was right, there was no one there. If Universalism was right, she was there, but changed. Either way, touch was a lie.

  But Elias reached out. He placed his palm on Clara's hand. It was cooling rapidly. He felt the solidness of it, the resistance of the skin against his skin. For a second, the theory broke. The sensation of contact demanded a *something* to contact. You cannot touch a nothing. You cannot hold a scattering.

  He gripped her hand. He held on tight, as if his own life could force composition back onto the particles, as if he could bind them together by will alone.

  "Stay," he whispered.

  The hand did not squeeze back. The particles remained inert. The life was gone. The object was gone. But Elias kept holding on, waiting for a unity that metaphysics told him could never return, terrified that if he let go, the atoms would finally understand they were free to drift apart.
