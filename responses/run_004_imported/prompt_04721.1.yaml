      *   *Section 4: Synthesis/Physics Connection.* Mention Gauge Symmetry or Parity Violation to tie it back to the "physics" part of the user's prompt.
      *   *Conclusion:* Summarize. They are complementary challenges to reductionism.

  6.  **Refining the Argument (Self-Correction during drafting):**
