answer: |-
  Here are 10 interview questions designed for a graduate-level seminar context. They assume familiarity with the basic framework and press on the structural tensions within Williams-style internalism.

  The first three address your specific requirements, including the anticipated follow-ups. The remaining seven explore adjacent pressure points (normativity, identity, blame, and discourse).

  ### The Core Challenges (Required Topics)

  **1. The Gin/Petrol Case and the Normativity of Deliberation**
  In Williams' gin/petrol case, you deny the agent has a reason to drink because their belief is false, even though the action satisfies their current desire. This suggests "sound deliberation" does normative work by filtering out factual errors. But where exactly does the normativity come from? If an agent deliberates perfectly according to their own internal logic but starts from a false belief, they are internally rational but lack a reason. Does this imply that the "soundness" of deliberation relies on an external standard of truth that isn't itself grounded in the motivational set $S$?
  *   **Follow-up (If she argues deliberation is just about factual correction):** "If sound deliberation is limited to correcting factual errors and means-ends efficiency, how do you handle cases of *normative* ignorance? If an agent falsely believes that suffering is intrinsically good, is that a 'factual' error deliberation can correct, or does your view force you to say they genuinely have a reason to cause suffering?"

  **2. The Cruel/Indifferent Person Objection**
  A standard objection is that internalism cannot condemn a genuinely cruel agent whose $S$ contains no element that could lead them to care about their victim, even after ideal deliberation. Internalism seems to imply this agent has *no reason* to stop torturing. If you accept this implication, are you not severing the conceptual link between having a reason and being subject to moral criticism? How can we legitimately blame someone for failing to do something they had no reason to do?
  *   **Follow-up (If she argues we can still blame them via social pressure or that their $S$ is richer than it appears):** "If you argue their $S$ is richer (e.g., they care about rationality or consistency), doesn't that risk making internalism trivial? Conversely, if you admit they have no reason but we blame them anyway, aren't you treating 'reasons' as merely explanatory rather than normative, which undermines the force of the internalist claim?"

  **3. Humean Instrumentalism vs. Generative Deliberation**
  Williams insists reasons are anchored in $S$, but he also allows deliberation to be creative (e.g., imagining new projects). Are you committed to a strictly Humean picture where reason only finds means to existing ends, or can you accommodate a Korsgaard-style view where the *process* of deliberation itself generates genuinely new motivations that weren't latent in $S$? If the latter, what prevents this from collapsing into externalism?
  *   **Follow-up (If she argues deliberation can generate new ends via imagination):** "If deliberation can generate entirely new ends not traceable to prior elements in $S$, what is the 'internal' anchor doing at that point? Is the requirement that the new end be *acceptable* to the agent, or that it be *derived* from the agent? If it's just acceptability, haven't you conceded the main point to the externalist?"

  ### Additional Pressing Questions

  **4. The Source of Deliberative Norms**
  You rely heavily on the notion of a "sound deliberative route." What constitutes the soundness of this route? Are the norms of good deliberation (e.g., consistency, vividness of imagination, temporal neutrality) themselves internal to the agent's $S$, or are they external normative constraints that any agent *ought* to follow regardless of their motivations? If the former, how do you criticize an agent who doesn't care about being consistent?

  **5. Diachronic Identity and Future Selves**
  Internalism anchors reasons in an agent's current $S$. However, people undergo radical motivational shifts over time. If my future self has a completely different $S$ than my current self, do I currently have a reason to provide for that future self? If yes, what is the element in my *current* $S$ that grounds that reason? If no, how do you account for the rationality of prudence and long-term planning?

  **6. The Function of External Reasons Talk**
  Williams suggests that external reason statements are either false or nonsense. Yet, in moral discourse, we constantly tell people they have reasons they don't recognize (e.g., "You have a reason to vote"). If internalism is true, what are we actually *doing* when we make these claims? Are we making false predictions about their psychology, or are we attempting to *modify* their $S$? If it's the latter, isn't the claim "You have a reason" just a rhetorical tool for manipulation rather than a truth-apt statement?

  **7. Recalcitrant Emotions and Motivation**
  Internalism links reasons to the motivational set. However, agents often judge they have a reason to act (e.g., quit smoking) but feel no motivation whatsoever due to addiction or depression. Does the internalist have to say the agent has no reason in that moment? Or do you distinguish between the *capacity* for motivation and *occurrent* motivation? If the latter, how do you specify that capacity without referencing an external standard of rationality?

  **8. The "Ought" vs. The "Reason"**
  Can there be a moral "ought" without an internal reason? Many philosophers argue that moral obligations bind us even when we lack the motivation to fulfill them. If you deny this, does it follow that morality loses its overriding authority? If you accept this (that there are "oughts" without reasons), how do you distinguish the normative force of an "ought" from the normative force of a "reason," and why should the agent care about the former?

  **9. Advice and Second-Personal Reasons**
  When I give you advice, I am ostensibly telling you what *you* have reason to do. If internalism is true, I can only know what reasons you have by knowing the contents of your $S$. But often I give you reasons you didn't know you had. Does this imply that the deliberative route is objective enough that a third party can map it better than the agent, or does it imply that my advice is actually an attempt to *change* your $S$ rather than report on it?

  **10. Group Agency and Shared Reasons**
  Internalism is methodologically individualistic, grounding reasons in a single agent's $S$. How does your view handle collective action or institutional reasons? Does a corporation or a state have an $S$? If not, when we say "The US had a reason to intervene," are we speaking metaphorically? If so, does this limit the applicability of internalism to political philosophy and ethics, where shared reasons are crucial?
