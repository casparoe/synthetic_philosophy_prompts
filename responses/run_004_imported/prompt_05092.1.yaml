prompt: |-
  so in my practical reason seminar we've got a guest coming in next week who defends bernard williams-style internalism about reasons -- basically the view that you only genuinely have a reason to do something if it can be reached via a sound deliberative route from something already sitting in your existing motivational set (your "S"), no exceptions. for the assignment i have to send in interview questions ahead of time and i really don't want it to be 8 versions of "so what is internalism." can you draft 8-10 questions that actually press on the view instead of just having her restate it?

  specifically i want: at least one question built around williams' own gin-that-turns-out-to-be-petrol case, getting her to spell out exactly what work "sound deliberation" is doing that just going along with your existing (possibly false) beliefs can't do; at least one that pushes the objection that this lets a genuinely cruel or indifferent person off the hook -- if literally nothing in their S could lead them to care about their victim even after ideal deliberation, internalism seems to say they just have no reason to stop, full stop; and at least one on whether she's stuck with a humean "reason only finds means to existing ends" picture, or whether she can borrow korsgaard's move that deliberation can generate genuinely new motivation rather than just serving old ones. for each of those three can you also throw in a quick follow-up keyed to whatever answer shes most likely to give, so the question doesn't just die after the first response. thanks!
