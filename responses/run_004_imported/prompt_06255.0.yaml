prompt: |-
  A university research integrity committee is finalizing its findings on a fabrication case. A paper's three co-first authors jointly produced its central dataset. Per standard practice, every coauthor -- including these three -- signed a statement accepting accountability for the integrity of the whole work, not just the sections they personally wrote. One of the three has since admitted to fabricating part of that dataset; the committee's investigation confirms the other two never saw the raw files and had no reason for suspicion. Members are split: some want a misconduct finding against the fabricator alone, clearing the other two as uninvolved; others argue the joint authorship statement bound the three to a commitment the group failed, regardless of individual knowledge. Draft the committee's findings memo -- what each co-first author is responsible for, and what follows -- and engage seriously with the objection that a 'joint failure' here just relabels ordinary negligence in trusting a colleague.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** University research integrity committee finalizing findings on a fabrication case.
      *   **Subject:** A paper with three co-first authors who jointly produced the central dataset.
      *   **Key Fact:** All co-authors signed a statement accepting accountability for the *whole* work (standard practice).
      *   **Incident:** One co-first author admitted to fabricating part of the dataset.
      *   **Investigation:** The other two never saw raw files and had no reason for suspicion.
      *   **Conflict:** Committee is split.
          *   *Side A:* Misconduct finding against fabricator only; clear the other two.
          *   *Side B:* Joint authorship statement implies collective responsibility regardless of individual knowledge.
      *   **Task:** Draft the committee's findings memo (responsibilities, consequences) AND engage seriously with the objection that calling this a "joint failure" is just relabeling ordinary negligence/trust.

  2.  **Determine the Stance/Outcome:**
      *   Research integrity guidelines (like ORI in the US, or similar bodies globally) generally distinguish between *misconduct* (FFP: Fabrication, Falsification, Plagiarism) and *questionable research practices* (QRPs) or *negligence*.
      *   *Misconduct* requires intent, knowledge, or reckless disregard.
      *   *Responsibility* (authorship) is broader than *Misconduct*.
      *   *Decision:* The memo needs to balance accountability with fairness. Finding the innocent parties guilty of *misconduct* is usually unsupported by evidence (lack of intent/knowledge). However, holding them accountable for *authorship responsibility* is valid.
      *   *Resolution:* The fabricator is guilty of misconduct. The other two are not guilty of misconduct but bear responsibility for the failure of oversight implied by their authorship claim. They face consequences (retraction, training, temporary supervision) but not the stigma of fabrication.
      *   *Addressing the Objection:* The memo must explicitly discuss why "joint responsibility" isn't just "negligence." It's about the epistemic duty of authorship.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief overview of the case and the decision.
      *   **Facts of the Case:** Summarize the admission, the investigation findings regarding the other two authors.
      *   **Analysis of Responsibility (The Core):**
          *   Distinguish between *Misconduct* (the act of fabrication) and *Authorship Accountability* (the commitment made).
          *   Address the signed statement.
          *   Address the "no reason for suspicion" finding.
      *   **Addressing the Objection (Crucial Step):**
          *   Why isn't this just "negligence"?
          *   Argument: Authorship is a certification of validity, not just a credit claim. Trusting a colleague is necessary, but blind trust without *mechanisms* of verification violates the certification.
          *   However, distinguish between *ethical failure* and *research misconduct*.
      *   **Findings & Determinations:**
          *   Author A (Fabricator): Research Misconduct.
          *   Authors B & C (Innocent Co-first): No Research Misconduct, but Breach of Authorship Responsibility.
      *   **Sanctions/Remedial Actions:**
          *   Author A: Severe (termination, debarment, etc.).
          *   Authors B & C: Retraction, mandatory training, probationary period on future submissions.
      *   **Conclusion:** Reaffirming the integrity of the process.

  4.  **Refining the Argument (The "Joint Failure" vs. "Negligence" nuance):**
      *   *Challenge:* If they had no reason to suspect, how are they responsible?
      *   *Counter:* Because they claimed "co-first" on the *dataset*. Co-first implies equal contribution to the *generation* or *verification* of the core data. If they didn't verify raw data, they overstated their contribution.
      *   *Nuance:* The memo should avoid punishing them for *trusting*, but punish them for *claiming oversight they didn't exercise*. The "joint failure" is a failure of the *system of verification* they agreed to, not necessarily a moral failing of character.
      *   *Key Distinction:* Misconduct = Active deception. Responsibility = Duty of care. You can fail a duty of care without being deceptive.

  5.  **Drafting - Tone and Style:**
      *   Formal, administrative, objective, yet philosophically robust.
      *   Avoid emotional language.
      *   Ensure the distinction between "Guilty of Misconduct" and "Bearing Responsibility" is crystal clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is holding B & C responsible too harsh if they had no reason to suspect?
      *   *Adjustment:* Ensure the consequences for B & C are remedial (training, supervision) rather than punitive (firing, permanent ban). The finding is "No Misconduct" but "Correction Required."
      *   *Critique:* Did I address the specific objection about "relabeling negligence"?
      *   *Adjustment:* Create a specific section titled "Consideration of Collective Accountability vs. Negligence." Explicitly argue that authorship is a warranty, not just a credit line.

  7.  **Final Polish:** Check formatting, clarity, and ensure all prompt requirements are met. (The prompt asks to "engage seriously with the objection," so that needs to be a prominent part of the reasoning, not just a footnote.)

  **(Self-Correction Note):** I need to make sure I don't sound like I'm inventing policy. I should ground this in general principles of research integrity (like the Singapore Statement or ORI guidelines) which distinguish between misconduct and responsible conduct of research (RCR).

  8.  **Finalizing the Memo Structure:**
      1.  Header.
      2.  Background.
      3.  Committee Deliberation (including the split).
      4.  Analysis of Authorship Accountability (addressing the objection).
      5.  Determinations.
      6.  Remedial Actions.

