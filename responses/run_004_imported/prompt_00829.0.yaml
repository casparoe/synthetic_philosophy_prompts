answer: |-
  This is a fantastic topic for a piece, but you need to be very careful with the "misunderstood genius" angle. If you frame Hobbes as the Galileo figure here, your math-savvy readers will likely tear the argument apart.

  Here's the nuance you're missing: **There is a massive difference between "unproven impossible" and "demonstrably wrong."**

  Here's the breakdown of why the Wallis crowd wasn't just gatekeeping, and why Hobbes doesn't fit the "suppressed truth-teller" narrative.

  ### 1. The Math: You don't need 1882 to spot a bad calculation
  You are correct that the *general* impossibility of squaring the circle (using only compass and straightedge) wasn't proven until Lindemann in 1882. However, that doesn't mean any specific claim to have done it was valid in 1650.

  *   **Wallis wasn't guessing:** Wallis didn't need to know $\pi$ was transcendental to know Hobbes was wrong. Hobbes published specific geometric constructions. Wallis and others (like Christopher Wren) simply checked the math. Hobbes's constructions contained basic arithmetic and logical errors that violated established Euclidean principles.
  *   **The Analogy:** It's like claiming someone built a perpetual motion machine. We didn't have the laws of thermodynamics fully codified in the 1600s, but an engineer could still look at your gears and say, "This lever doesn't connect to anything, and your friction calculations are off." Hobbes wasn't offering a brilliant new theory that the establishment couldn't grasp; he was making mistakes that graduate students could spot.

  ### 2. The Philosophy: It *was* a culture war, but Hobbes was the anti-science guy
  This is where your "fighting the establishment" angle actually shines, but you have to flip the script.

  *   **Hobbes's Motivation:** Hobbes wasn't fighting for mathematical truth; he was fighting for **Materialism**. Hobbes believed that *everything* must be physical. He hated abstract algebra and symbols (which Wallis used) because he thought reasoning should only be about physical bodies in motion. He wanted to reduce geometry to pure mechanics.
  *   **The Establishment:** Wallis and the nascent Royal Society were pushing for a more abstract, symbolic, and empirical mathematics.
  *   **The Conflict:** When Hobbes attacked the mathematicians, he wasn't just saying "I found a solution." He was saying "Your entire method of doing math is philosophical nonsense." The mathematicians ganged up on him not just to protect turf, but because Hobbes was actively attacking the foundational rigor of their field with a philosophical sledgehammer.

  ### 3. The Personality: Hobbes was a nightmare
  The "misunderstood genius" narrative usually requires the genius to be humble or persecuted despite their grace. Hobbes was... difficult.

  *   He published his first flawed solution in *De Corpore* (1655).
  *   When Wallis politely dismantled it, Hobbes didn't reconsider; he published a rebuttal (*Six Lessons to the Professors of Mathematics*, 1656) attacking Wallis personally.
  *   This went on for **20 years**. Hobbes published claim after claim, each more desperate than the last, refusing to concede a single point.
  *   By the end, the Royal Society actually passed a motion banning any further discussion of Hobbes's squaring attempts because it was a waste of time. That's not suppression of truth; that's an organization deciding to stop entertaining a troll.

  ### The Verdict for Your Piece
  If you want to write about **scientists fighting the establishment**, Hobbes vs. Wallis is a great case study, but **not** because Hobbes was right.

  **The angle you should take:**
  This wasn't a story of Truth vs. Power. It was a story of **Philosophy vs. Rigor.**
  *   **Hobbes** represents the Old Guard: Deductive, materialist, philosophical, unwilling to accept specialized expertise.
  *   **Wallis** represents the New Science: Specialized, symbolic, collaborative, willing to admit error (mostly).

  **Better candidates for "Misunderstood/Suppressed":**
  If you specifically need a "they were right and got crushed" narrative, Hobbes is the wrong horse. Consider:
  *   **Ignaz Semmelweis:** Handwashing. Mocked by the medical establishment, died in an asylum, proven right later.
  *   **Alfred Wegener:** Continental drift. Laughed out of geology conferences, died thinking he was a failure, proven right by plate tectonics decades later.
  *   **Barry Marshall:** Stomach ulcers caused by bacteria. Doctors thought it was stress. He drank the bacteria to prove it. (Though he lived to get the Nobel).

  **Summary:** Keep the Hobbes/Wallis feud for the "Politics of Science" section of your piece. It's a perfect example of how personal bias, philosophy, and ego drive scientific disputes. But don't cast Hobbes as the martyr; cast him as the brilliant philosopher who couldn't admit when he was out of his depth.
