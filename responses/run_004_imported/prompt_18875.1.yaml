answer: |-
  Here are 9 questions drafted for your seminar Q&A. They are ordered to build pressure, starting with the internal coherence of her view, moving through competitors, and ending with falsifiability. The three specific questions you requested are marked with their anticipated follow-ups.

  **1. The Masking vs. Loss Distinction (Required)**
  "If we abandon the conditional analysis entirely because of masking cases, we lose the truth-conditions that previously told us when a disposition was present but unmanifested. Without leaning on 'the conditional *would* have held,' what is the positive metaphysical criterion that distinguishes a *masked* power from a power that is simply *absent*? If the glass doesn't break and the conditional is false, what fact of the matter makes it the case that the fragility is still there rather than gone?"
  *   **Follow-up (if she appeals to intrinsic nature):** "If the answer is just 'it's an intrinsic property,' how do we epistemically access that nature without relying on the very behavioral tests (conditionals) you've argued are unreliable? Are we positing a 'hidden variable' that is in principle undetectable except by theoretical fiat?"

  **2. Explanatory Power vs. Dormitive Virtue (Required)**
  " Critics often argue that saying 'the glass broke because it has a primitive power of fragility' is just Molière's dormitive virtue in a lab coat—it labels the phenomenon without explaining the mechanism. How does taking powers as primitive add explanatory value over a Humean regularity view, other than satisfying an intuition about modality?"
  *   **Follow-up (if she appeals to causal roles/laws):** "If you say the power explains the behavior because it plays a specific causal role in the laws of nature, aren't you effectively reconstructing a functionalist version of the conditional analysis? What does the 'power' add ontologically beyond the place it holds in the causal network?"

  **3. Dispositional Essentialism vs. Vetter-Style Potentiality (Required)**
  "Your view aligns with Dispositional Essentialism, where fundamental properties have fixed manifestations. But how do you accommodate Barbara Vetter's account of potentiality, where dispositions come in degrees and don't require a specific stimulus condition at all? Does your commitment to fixed stimulus-manifestation pairs force you to treat macroscopic gradability as merely derivative, and if so, doesn't that create a disunity between fundamental and special-science dispositions?"
  *   **Follow-up (if she argues fundamental properties are distinct):** "If fundamental powers are binary (all-or-nothing) while macroscopic ones are graded, how do the former ground the latter without a category mistake? It seems you'd need a composition principle for powers that you haven't specified."

  **4. The Intrinsicness Constraint**
  "Martin's finkish cases work by altering the intrinsic basis of the disposition *at the moment of stimulation*. If you defend powers as intrinsic, do you have to deny that a finkish scenario is metaphysically possible, or do you accept that the power itself vanishes instantly? If the power vanishes instantly, isn't that just as damaging to the idea of a *stable* essence as the conditional analysis failing?"

  **5. Categorical Bases**
  "Many proponents of the conditional analysis argue that dispositions need a categorical base (a microstructure) to ground them. If powers are primitive, are you a 'pure powers' ontologist where properties are *only* dispositions? If so, how do you avoid the objection that a world of pure powers is a world of all relation and no relata?"

  **6. Modal Strength and Necessitation**
  "Dispositional Essentialism usually claims that the connection between a power and its manifestation is metaphysically necessary. But scientific practice seems to treat these connections as contingent on background conditions. Are you committed to saying that if a law of nature appears to change, it's actually because the *properties* themselves have changed? That seems to make property identity incredibly fragile."

  **7. Scientific Reduction**
  "How does your primitivism interface with actual physics? In quantum mechanics, properties like spin seem context-dependent in a way that resists simple dispositional essentialism. Is your metaphysics intended to constrain scientific theory, or should scientific theory constrain which powers you allow as primitive?"

  **8. Causal Exclusion**
  "If a property's essence is its power to produce a certain effect, and that effect occurs, is there any work left for the property itself to do? Isn't there a risk of overdetermination here: the event happens because of the laws/conditions, and also because of the 'primitive power'? How do you keep the power from being an ontological free-rider?"

  **9. Falsifiability and Evidence (Required Ending)**
  "Finally, metaphysical views often risk being unfalsifiable. If the conditional analysis is dead and powers are primitive, what would actually count as evidence *against* your view? Is there any empirical discovery or logical argument that would force you to abandon Dispositional Essentialism, or is the view insulated from refutation by definition?"
