answer: |-
  Here are 10 interview questions designed to press the "constitution without identity" view (à la Lynne Rudder Baker or David Wiggins) without letting your guest off the hook with standard introductory deflections. Each includes a targeted follow-up to counter the likely "brute fact" or "sortal-relative" dodges.

  ### 1. The Grounding Problem (Modal Divergence)
  "Let's start with the modal gap. On your view, the statue and the lump share every microphysical particle and every structural relation for the duration of their coincidence. Yet you claim they have different persistence conditions—the lump survives squashing, the statue does not. If the categorical base is identical, what *grounds* this modal difference? What feature of reality makes it true that one object has these truth-conditions for survival and the other has those, given there is no physical difference to point to?"

  *   **Follow-up:** "If you say this is just a brute fact about sortal essences, aren't you accepting ungrounded modal differences? If two entities are physically indiscernible, positing a modal divergence without a categorical ground looks like a violation of supervenience. Why shouldn't we treat that modal difference as epistemic rather than ontological?"

  ### 2. The "Too Many Objects" & Value Problem
  "You argue that constitution isn't identity, which means when I look at a sculpture, there are at least two material objects in that location. But this seems to multiply value and properties problematically. If the statue is worth a million dollars, is the constituting lump also worth a million dollars? If so, haven't you just doubled the wealth in the gallery by sculpting? If not, how do two coincident objects bear different normative properties despite sharing the same physical capacity to affect buyers?"

  *   **Follow-up:** "I anticipate you'll distinguish between derivative and non-derivative property possession. But if the lump *derivatively* has the value, doesn't that still mean there are two valuable things in the room? If I insure 'all artworks in this room,' do I need to list the lumps separately, or does the constitution relation somehow collapse the insurance claim?"

  ### 3. The Chrysippus/Dion and Theon Puzzle
  "I want to test if your theory is general or just tailored for artifacts. Consider the Stoic puzzle: Dion is a person; Theon is Dion minus one foot. If Dion steps on a mine and loses that foot, Theon (who was already footless) seems to remain, but Dion arguably ceases to exist or changes identity. If constitution allows distinct objects in the same place, does Theon survive as a distinct object constituted by Dion's remaining matter? Or does your view require a restriction on 'persons' that doesn't apply to clay?"

  *   **Follow-up:** "If you restrict this to non-personal objects to avoid the 'too many thinkers' problem, aren't you admitting that the constitution view is untenable for human animals? If a human animal constitutes a person, and they are distinct, don't we have two thinkers thinking my thoughts right now? How do you avoid the absurdity of dual thinkers without abandoning the constitution model for persons?"

  ### 4. Causal Exclusion and Physical Effects
  "Let's talk about causal powers. When the statue casts a shadow, does the lump also cast a shadow? If they are distinct objects, it seems we have causal overdetermination: two distinct causes producing one effect. If you say only one casts the shadow, you seem to be denying the lump full ontological status. If you say both do, aren't you violating the principle that the world doesn't systematically overdetermine its effects?"

  *   **Follow-up:** "You might say they 'jointly' cause the shadow. But if I remove the statue (by altering its form), the shadow changes. If I remove the lump (by dispersing the clay), the shadow disappears. Since their causal profiles track perfectly, what explanatory work is the 'distinct object' positing doing? Isn't 'constitution without identity' causally inert?"

  ### 5. The "Brute Fact" Retreat on Inheritance
  "Many constitution theorists eventually retreat to saying that property inheritance through constitution is a primitive, brute relation. The lump has the property of 'weighing 1kg' essentially; the statue has it derivatively. But if the mechanism of inheritance is brute, isn't this just a label for our ignorance? At what point does positing a 'primitive relation' stop being a metaphysical explanation and start being a refusal to explain?"

  *   **Follow-up:** "If it's brute, could there be a world where the lump constitutes the statue but the statue *doesn't* inherit the weight? If that's metaphysically possible, your theory loses its predictive power. If it's not possible, then there *is* a necessary connection grounding the inheritance. What is it?"

  ### 6. Temporal Boundaries and Vagueness
  "Constitution seems to have precise temporal boundaries. At $t_1$, the clay is a lump; at $t_2$, the artist makes a stroke, and suddenly a statue exists. Did a new object pop into existence with that stroke? If so, you're committed to massive object proliferation every time an artist touches clay. If not, and the boundaries are vague, are you committed to ontic vagueness? How can reality be vague about whether a new object exists?"

  *   **Follow-up:** "If you say the boundaries are determined by our conceptual schemes (the sortals we use), aren't you sliding into conceptualism? That would mean the ontology of the world depends on human classification, which undermines the realist claim that the statue and lump are mind-independently distinct objects."

  ### 7. The Dominant Sortal Problem
  "Wiggins talks about 'substance sortals.' In a coincidence case, you usually privilege one object over the other in discourse—we say 'the statue is heavy,' not 'the constituting lump is heavy.' What determines which sortal is dominant? Is it metaphysical or pragmatic? If the lump and statue are equally real, why does our language and intuition treat one as the 'background' and the other as the 'foreground'?"

  *   **Follow-up:** "If it's pragmatic, then the distinction is useful for talk but maybe not for ontology. If it's metaphysical, you need a criterion for dominance. Does the 'higher' sortal (statue) swallow the causal powers of the 'lower' sortal (lump)? If so, isn't the lump effectively an ontological ghost?"

  ### 8. Material Continuity and Replacement
  "Consider the Ship of Theseus. If the statue is constituted by the lump, and we slowly replace every particle of the lump, does the original lump cease to constitute the statue? If constitution is a relation between *this* matter and *this* object, does the object cease to exist when the matter is gone? Or does the constitution relation shift to new matter? If it shifts, what grounds the continuity of the statue if not the continuity of the matter?"

  *   **Follow-up:** "If you say the statue persists through matter replacement but the lump does not, you're admitting the statue has looser persistence conditions than its constituent matter. But if they share all particles at every moment of coincidence, how can their historical properties (like 'originated from this specific quarry') differ without a grounding difference in the present?"

  ### 9. Counting and Quantification
  "If I ask 'how many objects are on this pedestal,' and you say 'two,' you are defying standard counting practices. In standard mereology, if $x$ and $y$ occupy the same region, we count 1. You are proposing a non-standard quantification. Does this break the link between existence and quantification? If I say 'there exists an $x$ such that...', do I pick up both the lump and the statue? If so, doesn't that break standard logic?"

  *   **Follow-up:** "You might appeal to sortal-relative counting. But if counting is sortal-relative, then 'existence' itself becomes sortal-relative. Are you prepared to say that existence is not univocal? That 'exists' means something different for a lump than it does for a statue?"

  ### 10. Theoretical Cost vs. Benefit
  "Finally, let's zoom out. The identity theorist says 'Statue = Lump' and solves the grounding and counting problems instantly. The eliminativist says 'There are no statues, only atoms' and solves the coincidence problem. Your view keeps common sense but pays a high theoretical cost in grounding and proliferation. What is the specific phenomenon that *only* the constitution view saves? Why is preserving the intuition that 'the statue could not survive being squashed' worth multiplying entities and accepting brute modal facts?"

  *   **Follow-up:** "If the only benefit is saving a pre-theoretical intuition about artifacts, but the cost is a fractured metaphysics of modality and causation, isn't it more parsimonious to revise the intuition? Why should metaphysics be held hostage by how we talk about clay?"
