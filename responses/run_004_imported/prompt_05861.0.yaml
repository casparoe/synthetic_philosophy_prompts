answer: |-
  **Setting:** *A quiet corner of a coffee shop, three days after the postmortem meeting. Alex (Counterfactualist) and Jordan (Process Theorist) are finishing up their drinks. The tension from the meeting has cooled into curiosity.*

  **Alex:** I've been thinking about what you said in the conference room. About the patch. You really believe that the lack of a patch didn't *cause* the breach?

  **Jordan:** I believe the attackers caused the breach. They wrote the script, they initiated the connection, they exfiltrated the data. That's a physical process. Energy moved, bits flipped. The "lack of a patch" is… what? It's a description of what *didn't* happen. How can a non-event push bits around?

  **Alex:** Because if the patch *had* happened, the bits wouldn't have flipped that way. That's the test. If A hadn't occurred, would B still have happened? If the answer is no, then A is a cause of B. In this case: If the patch had been applied, the breach doesn't happen. Therefore, the failure to apply it is a cause. It's the "but-for" test. It's the bedrock of accountability.

  **Jordan:** It's the bedrock of *liability*, maybe. But not metaphysics. Look, if I say "the lack of oxygen caused the fire to go out," that makes sense practically. But physically? The fire went out because the combustion reaction ceased. The oxygen absence is just the background condition. If we treat absences as causes, we open a Pandora's box. In your logic, who else caused the breach?

  **Alex:** Who else? The sysadmin who didn't click "install."

  **Jordan:** Right. But also me. I didn't come in last Tuesday and apply the patch. I have admin access. I didn't do it. So, by your counterfactual logic, my failure to apply the patch is also a cause.

  **Alex:** That's absurd, and you know it.

  **Jordan:** Is it? If I had applied it, the breach wouldn't have happened. So, "Jordan not patching" satisfies the counterfactual condition. And it's not just me. The CEO didn't apply the patch. The vendor didn't release the patch a week earlier. You, personally, could have stayed late one night with borrowed credentials and applied it. You didn't. So *your* omission is a cause. Suddenly, the breach has ten thousand causes. It dilutes the word until it means nothing.

  **Alex:** Okay, I see the trap you're setting. You're arguing that counterfactual dependence overgenerates causes. But we don't list all those people because causation isn't just about raw counterfactuals; it's about *norms*. We select causes based on what was expected or required.

  **Jordan:** Aha! So you admit it. You're smuggling in a moral or professional expectation to decide what counts as a physical cause.

  **Alex:** I'm saying causation is inherently contextual. When we ask "What caused the breach?" we aren't asking for a god's-eye view of every particle in the universe. We're asking, "What variable in our system can we manipulate to change the outcome?" The CEO's failure to patch isn't a cause because it wasn't in their job description. My failure isn't a cause because I didn't have access. The sysadmin's failure *is* a cause because that was the specific lever they were supposed to pull. The "cause" is the difference that makes a difference *relative to the system's design*.

  **Jordan:** But that makes causation subjective. You're saying the physical history of the universe changes depending on the sysadmin's job description? That's why I stick to processes. A cause must transmit something—energy, information, force. The attacker transmitted an exploit. The server transmitted data. The "missing patch" transmitted nothing. It's a hole, not a pusher. You can't build a physics of holes.

  **Alex:** But you can't build a security policy on physics alone. If I want to prevent the next breach, I don't need to know about the electron flow; I need to know about the omission. If I treat the omission as a cause, I fix the process. If I treat it as "just a condition," I let the sysadmin off the hook and say, "Well, the attackers were the only real cause." That's useless for prevention.

  **Jordan:** I'm not letting them off the hook. I'm saying they are *responsible* for the condition that allowed the cause to succeed. There's a difference. But let's test your counterfactual theory with something harder. Something that actually came up in the intelligence report.

  **Alex:** The backup exploit.

  **Jordan:** Exactly. Suppose the attackers had a second vulnerability ready to go. Zero-day, completely unrelated to the patch we missed. If the sysadmin *had* applied the patch on time, the attackers would have just used the second hole. The data still leaves the building. The breach still happens, maybe ten minutes later. Now, run your "but-for" test.

  **Alex:** …Okay. If the patch had been applied, the breach *still* happens. So, strictly speaking, the failure to apply *that specific patch* is not a but-for cause of the *breach event* in general.

  **Jordan:** Precisely. The outcome is invariant. So, was the unpatched server a cause? Your theory says no. But intuitively, it feels like it still was. It was the door they walked through.

  **Alex:** Wait, hold on. We need to be precise about the effect. If we define the effect as "Data Loss," then you're right. The patch failure isn't a cause. But if we define the effect as "Data Loss *via Vulnerability A*," then it is. The specific token event—the specific packets leaving through that specific port—depends on the patch.

  **Jordan:** But why should we care about the port? The harm is the data loss. If the harm is inevitable, does the path matter? If I shoot you, but you had a terminal illness and would have died an hour later anyway, did I cause your death? Legally, yes. Counterfactually? It's messy.

  **Alex:** It matters because the path determines the prevention. If I say "The patch wasn't a cause because they had a backup," then I stop patching. And then next time, when they *don't* have a backup, I get hit. I need to treat the patch as a cause of *this* breach so I learn to patch for the *next* one. My definition of causation is pragmatic. It's about where I have leverage.

  **Jordan:** And my definition is ontological. It's about what actually happened. If the backup plan was real, then the system was doomed regardless of the patch. The "missing patch" didn't seal your fate; the attackers' determination did. By calling the omission a cause, you're pretending the system was safe and just tripped. But the system was under active assault. The positive action of the attacker is the driver. The missing patch is just the road surface.

  **Alex:** But the road surface matters! If the road is paved, the car doesn't crash. If it's a cliff, it does. Is the cliff a cause of the crash?

  **Jordan:** The cliff is a condition. The driver steering into it is the cause.

  **Alex:** What if the driver is blindfolded? What if the cliff was unmarked?

  **Jordan:** Then the person who removed the sign is a cause. That's a positive action. Removing a sign is moving matter. Not applying a patch is… letting code sit still.

  **Alex:** You're getting hung up on "action" vs. "inaction." But in IT, "inaction" is a configuration state. The server was in a state of "vulnerability." That state exists. It has properties. It interacts with the network. It's not "nothing." It's a specific arrangement of software that permits unauthorized access.

  **Jordan:** It's an arrangement, yes. But the *change* came from the attacker. Causation is about change. If I have a glass on a table, and you don't catch it when it falls, did your "not catching" break the glass? No. Gravity and the floor broke the glass. You just failed to intervene.

  **Alex:** But if you were hired to catch glasses, and you didn't, and I'm writing the incident report, I am writing "Failure to catch" in the "Root Cause" box. And I'm right to do so. Because if we want to stop glasses breaking, we don't yell at gravity. We train the catcher.

  **Jordan:** So we agree on the remedy. Patch the server. Train the catcher. Blame the sysadmin.

  **Alex:** Yes.

  **Jordan:** So what are we actually fighting about?

  **Alex:** We're fighting about whether "cause" describes the *mechanism* or the *explanation*. You want "cause" to mean "the physical mechanism that transferred energy." I want "cause" to mean "the factor that explains why the outcome occurred in this context."

  **Jordan:** I worry that if you loosen the definition to include absences, you lose the ability to distinguish between what *did* happen and what *could have* happened. If my not-patching is a cause, and the attacker's scripting is a cause, they look like equal partners in a list. But they aren't. One is a force, the other is a lack of resistance.

  **Alex:** And I worry that if you restrict "cause" to physical forces, you make the concept useless for complex systems. In software, most "causes" are logical constraints, not physical forces. A logic bomb isn't a physical push. A permission error isn't energy transfer. If your theory of causation can't handle software because software is built on abstractions and omissions, then your theory is too small for the modern world.

  **Jordan:** *Laughs.* That's a fair hit. Software does break the "physical process" model. But look at the backup exploit again. If the breach was inevitable, does your pragmatic view still hold? If the sysadmin patched it, and they used the backup, the outcome is the same. Was the sysadmin's negligence still a cause?

  **Alex:** *Pauses, stirring coffee.* If the outcome is truly identical… then no. Not for the outcome. But it would be a cause of the *method*. And the method matters for forensics. But… okay. If the breach was truly inevitable, calling the missing patch the "cause" is misleading. It implies we could have stopped it.

  **Jordan:** So you concede? Counterfactual dependence fails when the counterfactual world still produces the disaster.

  **Alex:** I concede that "but-for" isn't perfect. But I still think your "physical process" view misses the point of why we ask the question. We aren't asking to satisfy a metaphysical curiosity. We're asking to assign responsibility and prevent recurrence. If I say "The attacker caused this," that's true, but I can't change the attacker. If I say "The missing patch caused this," that's actionable.

  **Jordan:** So "cause" is just a label for "place to intervene."

  **Alex:** Basically. It's a tool.

  **Jordan:** And for me, "cause" is a label for "physical generator."

  **Alex:** Exactly. So, regarding the postmortem…

  **Jordan:** I can agree to write "Root Cause: Unapplied Patch" on the document.

  **Alex:** And I can agree that, metaphysically, the attackers did the work.

  **Jordan:** But you still think my view lets people off the hook.

  **Alex:** I think it risks it. If "nothing" can't be a cause, then negligence is never a cause. Only active malice is.

  **Jordan:** And you risk turning every non-event in the universe into a cause of everything. The fact that I didn't fly to your office and unplug the server is a cause of the breach, by your logic.

  **Alex:** *Smiles.* Touché. Maybe the truth is that "causation" is just a word we use to bridge the gap between physics and responsibility. And since we have two different jobs—you securing the physical infrastructure, me securing the operational policy—we need two different definitions.

  **Jordan:** So we disagree on the facts?

  **Alex:** No. We agree on the facts. The patch was missing. The attackers struck. The data left. We disagree on whether the word "cause" belongs to the physics of the event or the story we tell about it.

  **Jordan:** I can live with that. As long as the patch gets applied next time.

  **Alex:** Deal. But I'm still putting it in the "Cause" box.

  **Jordan:** And I'll sign off on it. Just don't ask me to believe the empty space did the pushing.
