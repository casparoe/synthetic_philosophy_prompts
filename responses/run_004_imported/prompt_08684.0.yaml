  **Point 1 (Jake):** 0
  Jake invokes Popper correctly in principle, but applying "unfalsifiable" to the entire field is too broad. Many chiropractic claims are falsifiable (and have been), making this a naive application of the demarcation problem.

  **Point 2 (Mina):** 2
  Mina accurately distinguishes between a theory that cannot be tested and one that has failed testing. Identifying the "subluxation" theory as falsified rather than unfalsifiable is a precise and correct scientific distinction.

  **Point 3 (Jake):** 1
  Jake correctly identifies "immunizing strategies" (ad hoc hypotheses) which are common in pseudoscience. However, this isn't definitive proof on its own, as mainstream science also adjusts auxiliary hypotheses when data conflicts.

  **Point 4 (Mina):** 2
  Mina successfully deploys the Duhem-Quine thesis to show that no theory is tested in isolation. Her comparison to medical compliance/dosage demonstrates that ad hoc adjustments are not unique to pseudoscience.

  **Point 5 (Jake):** 2
  Jake upgrades his argument to Lakatos's "Research Programmes," which is a more robust philosophical framework than Popper's. His assessment that the vitalistic core of chiropractic has failed to produce novel predictions is historically accurate.

  **Point 6 (Mina):** 1
  Mina correctly notes that Jake has shifted criteria from falsifiability to progressiveness. While she is right that "degenerating" is often a hindsight judgment, Lakatos's framework is still a valid heuristic for evaluating scientific health.

  **What They're Missing:**
  Both are arguing about *demarcation* (what counts as science) rather than *clinical utility* (does it help mom's back?). They ignore the modern split within chiropractic between "vitalistic" practitioners (who believe in nerve flow/organ disease) and "evidence-based" ones (who treat it as manual therapy for musculoskeletal issues). Additionally, they overlook that a treatment can be theoretically pseudoscientific yet still provide palliative relief through placebo or mechanical manipulation, which is likely what matters most for your mom's recovery.
