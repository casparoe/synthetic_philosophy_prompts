answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Members
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Risk Assessment Tool Adoption and Epistemic Standards

  ### Executive Summary

  This Thursday, the Board must decide whether to replace our current risk-assessment instrument (Tool A: broad demographic/criminal-history bands) with a newer model (Tool B: narrow, "individualized" bands). While Tool B offers the appearance of greater specificity, statistical analysis indicates it carries significantly wider confidence intervals due to smaller sample sizes.

  More critically, adopting Tool B risks validating a fundamental epistemic error: the presumption that we can calculate a precise probability of recidivism for a specific individual. This memo argues that we should **retain Tool A** but implement a new **Uncertainty Disclosure Protocol**. This approach acknowledges the "Reference Class Problem," prioritizes statistical stability over the illusion of precision, and ensures the Board treats risk scores as heuristic group data rather than definitive individual facts.

  ### Background: The Two Proposals

  *   **Tool A (Current):** Categorizes applicants into broad reference classes (e.g., "Males 22–35 with two prior convictions").
      *   *Pros:* Large validation samples, narrow confidence intervals, high statistical reliability.
      *   *Cons:* Classes are broad; may feel disconnected from individual nuance.
  *   **Tool B (Proposed):** Categorizes applicants into narrow reference classes (e.g., "Males 22–35 with two priors, specific offense type, and program completion").
      *   *Pros:* Feels more "individualized"; matches more specific case details.
      *   *Cons:* Small validation samples, wide confidence intervals, high statistical variance.

  ### The Core Issue: The Reference Class Problem

  Standard discussions on risk assessment focus on *fairness* (disparate impact across racial or socioeconomic groups). While vital, that debate overlooks a prior, foundational issue: *validity*.

  To assign a risk score to an applicant, we must slot them into a "reference class." However, every applicant belongs to infinite overlapping classes (age, geography, offense type, employment history, etc.). Each class yields a different recidivism rate. There is no mathematical or philosophical principle to determine which class is the "correct" one for determining *this specific person's* probability of reoffending.

  This is known in probability theory as the **Reference Class Problem** (first articulated by Hans Reichenbach).

  *   **The Risk:** When we present a risk score (e.g., "65% risk"), we imply this number is a property of the *individual*. It is not. It is a property of the *group* to which we arbitrarily assigned them.
  *   **Tool A vs. Tool B:** Tool B attempts to solve this by narrowing the class. However, narrowing the class reduces the sample size, inflating the margin of error. Tool B does not solve the Reference Class Problem; it merely selects a different arbitrary class while reducing our confidence in the resulting number.

  Adopting Tool B trades **reliability** (Tool A's narrow confidence intervals) for an **illusion of precision**. In decisions involving liberty, an honest estimate of group risk is ethically superior to a precise-sounding estimate with high variance.

  ### Analysis of Options

  1.  **Adopt Tool B (Narrow Bands):**
      *   *Verdict:* **Not Recommended.**
      *   *Reasoning:* This validates the misconception that we have accessed "individual risk." The wider confidence intervals mean we are less certain about the predictions, even if the categories feel more specific. It masks the arbitrariness of the reference class selection under the guise of granularity.

  2.  **Retain Tool A (Broad Bands) Without Change:**
      *   *Verdict:* **Insufficient.**
      *   *Reasoning:* While statistically more stable, continuing to treat these scores as point-estimates of individual probability perpetuates the epistemic error. It invites Board members to over-rely on the number as "the truth" about the applicant.

  3.  **Retain Tool A + Uncertainty Disclosure Protocol:**
      *   *Verdict:* **Recommended.**
      *   *Reasoning:* This leverages the statistical stability of the larger sample sizes while explicitly acknowledging the limitations imposed by the Reference Class Problem. It forces the Board to engage with the *range* of possibility rather than a single number.

  ### Recommendation

  I propose the Board vote to **retain Tool A** as our primary actuarial instrument, contingent on the immediate implementation of the following **Uncertainty Disclosure Protocol**:

  1.  **Reporting Ranges, Not Points:** Risk scores shall no longer be presented as single percentages (e.g., "40%"). They must be presented as Confidence Intervals (e.g., "30%–50% at 95% confidence"). This visually reinforces that the number is an estimate of a group rate, not a fact about the individual.
  2.  **Epistemic Warning Label:** All risk assessment reports must include a standardized header: *"This score reflects the recidivism rate of a reference group to which the applicant belongs. It is not a prediction of this specific individual's behavior. No statistical class can fully capture individual agency."*
  3.  **Prohibition on "High Risk" Determinations Solely via Score:** A risk score cannot be the sole determinant for parole denial. It must be weighed alongside qualitative evidence (psychological evals, release plans) which addresses the individual factors the reference class ignores.

  ### Implementation Timeframe

  *   **Immediate (Thursday Vote):** Formal rejection of Tool B; adoption of Tool A with mandated protocol changes.
  *   **Days 1–30:** IT and Data team to adjust reporting dashboards to display Confidence Intervals rather than point estimates. Drafting of the "Epistemic Warning" language.
  *   **Days 30–90:** Mandatory training for all Board members and hearing officers. This training will not focus on *how* to use the tool, but *what the tool is* (i.e., a module on the Reference Class Problem and statistical uncertainty).
  *   **Day 180:** Review of parole decisions to ensure the new disclosure language is not resulting in "risk aversion" (i.e., denying parole simply because the confidence interval is wide).

  ### Conclusion

  My colleague Priya, a data scientist, argues that we should simply "pick the class the data supports and move on." In commercial contexts, this pragmatism is acceptable. In parole hearings, where we adjudicate liberty, it is not.

  We cannot solve the Reference Class Problem. We cannot know the true probability of an individual reoffending. We can only know the behavior of groups. By retaining Tool A and explicitly disclosing the uncertainty inherent in that grouping, we avoid the trap of pretending our statistics are more powerful than they are. We choose statistical honesty over the comfort of false precision.

  I look forward to discussing this on Thursday.

  **[Your Name]**
  **State Parole Board**
