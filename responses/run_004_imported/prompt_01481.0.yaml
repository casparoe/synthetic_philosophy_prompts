answer: |-
  It is a pleasure to address a colleague who speaks the language of statistical mechanics. You have identified precisely the friction point where physics intuition rubs against neoclassical economics. Given your background, we can dispense with the hand-waving and look at the measure-theoretic and normative bones of the argument.

  The short answer to your debate is this: **Mathematically, in the specific context of repeated multiplicative gambles, your colleague is right: the optimization problems are isomorphic. Normatively and foundationally, however, you are right: Peters is proposing a distinct physical justification that changes the status of the utility function from a subjective preference to an objective dynamic constraint.**

  However, Peters' framework does not fully exorcise Samuelson's ghost. Here is the detailed breakdown.

  ### 1. The Mathematical Isomorphism (Where your colleague is right)

  Let us define the wealth dynamics. You have wealth $W_t$. You bet a fraction $f$ on a gamble with return $r$. The update rule is:
  $$W_{t+1} = W_t (1 + f r)$$
  After $T$ steps, wealth is:
  $$W_T = W_0 \prod_{t=1}^T (1 + f r_t)$$

  **The Expected Utility Approach:**
  An agent maximizes $E[U(W_T)]$. If we assume standard CRRA utility $U(W) = \frac{W^{1-\gamma}}{1-\gamma}$, and let $\gamma \to 1$, we get $U(W) = \ln W$.
  Maximizing $E[\ln W_T]$ yields:
  $$E[\ln W_T] = \ln W_0 + T \cdot E[\ln(1+fr)]$$
  Maximizing this with respect to $f$ gives the Kelly fraction.

  **The Ergodicity Economics Approach:**
  Peters asks for the time-average growth rate $g$ for a single trajectory:
  $$g = \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) = \lim_{T \to \infty} \frac{1}{T} \sum_{t=1}^T \ln(1 + f r_t)$$
  By the Law of Large Numbers (assuming i.i.d. returns), this time average converges to the ensemble expectation of the log-return:
  $$g = E[\ln(1+fr)]$$
  Maximizing $g$ with respect to $f$ gives the *exact same* Kelly fraction.

  So, in the specific niche of infinite-horizon, reinvested, i.i.d. multiplicative processes, the action prescribed by "Maximize Expected Log Utility" and "Maximize Time-Average Growth Rate" is identical. Your colleague is correct that the calculus is the same.

  ### 2. The Foundational Divergence (Where you are right)

  The disagreement is not about the integral; it is about what the integral *represents*.

  **In Standard Expected Utility Theory (EUT):**
  The logarithm is a **psychological construct**. It represents risk aversion. Why log? Because the agent *happens* to dislike variance. If the agent were risk-neutral ($U(W)=W$), they would maximize arithmetic expectation, which leads to ruin in multiplicative games (betting everything). EUT treats the dynamics as secondary to the preference. The "non-ergodicity" is hidden inside the curvature of $U$.

  **In Ergodicity Economics:**
  The logarithm is a **physical necessity** derived from the dynamics. Peters argues that wealth is a non-ergodic observable. The ensemble average $E[W_t]$ (which grows exponentially if you bet aggressively) is inaccessible to a single agent traveling through time. The only observable quantity for a single agent is the time average.
  Because the dynamic is multiplicative ($W_{t+1} = W_t \cdot \eta$), the appropriate coordinate transformation to make the process additive (and thus ergodic in the increment) is the logarithm.
  $$ \ln W_{t+1} - \ln W_t = \ln \eta $$
  In this view, you do not choose $\ln W$ because you are "risk-averse." You choose it because $\ln W$ is the extensive variable that grows linearly in time for this specific dynamic. It is analogous to choosing entropy or free energy in thermodynamics; you don't have a "preference" for free energy, it is the state function that governs the evolution.

  **The Distinction:**
  *   **EUT:** "I maximize log wealth because I prefer safety." (Subjective)
  *   **Ergodicity:** "I maximize log wealth because linear wealth is not ergodic, and I live in time, not in an ensemble of parallel universes." (Objective/Physical)

  This is more than a costume change. It shifts the burden of proof. In EUT, if you don't bet Kelly, you are "irrational" only if you claimed to want to maximize long-term growth. In Peters' view, if you maximize arithmetic expectation in a multiplicative game, you are violating the physics of the process, regardless of your preferences.

  ### 3. Samuelson's Critique and the "Long Run"

  Paul Samuelson's 1979 paper (indeed written in monosyllables, save the last) attacked the idea that the "Long Run" justifies the Kelly criterion as a universal norm. His argument was essentially: **Maximizing the geometric mean does not maximize expected utility for arbitrary utility functions, even over long horizons.**

  If an agent has a utility function $U(W) = W$ (risk neutral) but a finite horizon $T$, maximizing the geometric mean (Kelly) yields lower *expected* wealth than maximizing the arithmetic mean (betting the house), even though Kelly has a higher probability of ending up with *more* wealth than the initial stake. Samuelson's point was that "probability of winning" $\neq$ "expected utility."

  **Does Ergodicity Economics escape this?**

  **Yes, in one sense:** Peters agrees with Samuelson that maximizing $E[W]$ is nonsense for a single agent in a non-ergodic system. The ensemble average $E[W]$ is dominated by trajectories that never occur in reality (the "lucky" paths in the far tail). Peters would say Samuelson was right to attack the "Long Run" justification *within EUT*, but wrong to imply the problem was the criterion rather than the expectation operator. Peters replaces the expectation operator with the time average.

  **No, in another sense:** Samuelson's deeper critique was that **growth is not the only goal.**
  Peters' derivation of the log function relies entirely on the assumption that the objective is *maximizing the growth rate of wealth*.
  *   If you are a pension fund with liabilities, or an individual who needs to consume, or an agent with a finite horizon who cares about the *level* of wealth at $T$ rather than the *rate*, the time-average growth rate is not the relevant observable.
  *   If the utility of wealth is not reinvested but consumed, the multiplicative dynamic breaks.
  *   Samuelson's charge holds: Kelly/Ergodicity is a fine rule for *reinvested capital accumulation*, but it is illegitimately stretched if presented as a universal decision theory for all wealth-related choices.

  Peters does not solve the problem of *what* to maximize (the normative goal); he solves the problem of *how* to evaluate the expectation of that goal given non-ergodic dynamics. If the goal is "wealth at retirement," and retirement is fixed at $T$, the time-average limit $T \to \infty$ is irrelevant.

  ### 4. Synthesis: Geometric Rationality vs. EUT

  To settle the argument with your colleague:

  1.  **Mathematical Content:** In the limit of $T \to \infty$ with reinvestment, the prescriptions are identical. Your colleague wins on the calculation.
  2.  **Philosophical Status:** The interpretations are mutually exclusive. EUT views risk aversion as a preference parameter ($\gamma$). Ergodicity views it as a dynamic parameter (determined by the noise structure). You win on the foundation.
  3.  **Samuelson's Charge:** Samuelson is correct that "Maximize Geometric Mean" is not a universal substitute for Expected Utility. Ergodicity Economics refines this to "Maximize Time Average of the Ergodic Observable." If the ergodic observable is $\ln W$, you get Kelly. If the observable is $W$ (additive dynamics), you get Arithmetic Mean. Peters does not escape Samuelson's critique that one must justify *why* growth is the objective, only *how* to measure it.

  ### 5. A Stat Mech Perspective

  Since you come from statistical mechanics, consider this analogy:

  *   **Standard Economics (EUT):** Like treating temperature as a subjective feeling of hotness. Different agents have different "temperature utilities."
  *   **Peters' Ergodicity:** Like defining temperature via the kinetic energy of particles ($T \propto \langle mv^2 \rangle$). It is an objective property of the system's dynamics.

  The problem in economics is that agents are not ideal gases. They have complex, often non-reinvesting interactions with their environment.
  Peters' great contribution is highlighting **ergodicity breaking**. In stat mech, we know that for non-ergodic systems (like spin glasses or broken symmetry phases), ensemble averages are physically meaningless. Economics has largely assumed ergodicity (that time averages = ensemble averages) without proof. Peters shows that for wealth, this assumption is false.

  **Conclusion:**
  "Geometric rationality" is not just EUT in a physics costume. It is a rigorous correction to the application of expectation operators in non-ergodic systems. However, it is not a "Theory of Everything" for decision making. It solves the dynamic inconsistency of EUT in multiplicative environments, but it does not resolve the normative question of what an agent *should* want if their horizon is finite or their utility is not tied to reinvestment.

  Your colleague sees the isomorphism; you see the mechanism. Both are visible, but the mechanism explains *why* the isomorphism exists, which is the more profound physical insight. Samuelson remains the necessary check against over-generalizing that insight.
