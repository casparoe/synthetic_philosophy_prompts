          *   *Analysis:* Claire captures the *phenomenology* (how it feels). Ben captures the *mechanism* (how it works). Ben is scientifically more robust, but Claire is phenomenologically more accurate to the narrator's experience.

      *   **Move 2: The Self-Condemnation.**
