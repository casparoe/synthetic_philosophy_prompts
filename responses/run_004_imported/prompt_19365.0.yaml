      *   *Du Bois's Nuance:* In "Criteria of Negro Art," Du Bois *does* argue for propaganda, but he also demands high aesthetic standards. He criticized Black artists who pandered to white stereotypes (minstrelsy) just as much as he criticized those who ignored racial reality. He wanted beauty *and* truth. He wrote, "I do not care a damn for any art that is not used for propaganda." *However*, he also valued the "Beauty" that makes propaganda effective. If the art fails aesthetically, the propaganda fails.
