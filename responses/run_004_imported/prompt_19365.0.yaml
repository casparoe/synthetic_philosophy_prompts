      *   *Manuscript B:* High "propaganda" (explicit social critique), lower craft (mouthpieces, stale images). Du Bois warned against art that is merely didactic without beauty.
      *   *The Dilemma:* A is beautiful but silent on the "cause." B is loud on the "cause" but aesthetically flawed.

