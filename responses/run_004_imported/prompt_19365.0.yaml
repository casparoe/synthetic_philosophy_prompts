          *   Team B: Charter demands social function. Awarding A erases the stakes of the prize.
      *   **Task:** Draft a memo to the jury and board recommending a resolution.
      *   **Requirements:**
          *   Reach an *actual recommendation* (no splitting the prize).
          *   Engage the losing side's strongest argument (no strawmanning).
