answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Aunt's Name]'s nephew. And yes, I am the one who went to graduate school for philosophy. I know what that sounds like to a room full of clinicians. It means I'm the person you call when you need someone to argue about the definition of "is" at 2 a.m., but who you definitely do *not* want to rely on to fix a leaky faucet.

  So, when I was asked to give this toast, there was a specific expectation. Apparently, because I have a Master's degree in thinking about thinking, I'm supposed to say something "intellectual" about Aunt [Name]'s work. And given that she spent thirty-five years working with complex trauma and dissociative identity disorder, there is a lot of heavy theory to choose from.

  But there was a trap here. I know that half this room could recite Ian Hacking's *The Social Construction of What?* over breakfast. And I know the other half of this room—including some very brave guests sitting right here—has lived the reality of that work. If I get the theory wrong, the philosophers will roll their eyes. If I get the humanity wrong, I hurt the people she spent her life protecting.

  So, I want to talk briefly about the "looping effect."

  For the uninitiated, the basic idea is this: When you classify a stone, the stone doesn't care. It doesn't change its behavior because you called it "granite." But when you classify a human being, when you give a name to their suffering, they react. They hear the name. They read the books. They feel the stigma. They adjust. The classification changes the person, which in turn changes the classification. It loops.

  Now, in the wrong hands, this idea can be used as a weapon. It can be used to whisper that the disorder is "made up," or that the symptoms are just a performance for the doctor.

  Aunt [Name] spent her career fighting that interpretation.

  To her, understanding the looping effect wasn't about doubting the pain. It was about taking responsibility for the power of the diagnosis. She knew that in the 80s and 90s, the cultural script for dissociation was messy. She knew that the language we used in the therapy room could accidentally write a script for the patient to follow.

  And her response wasn't to abandon the patients. It was to become hyper-vigilant about her own role in the room.

  She understood that while the *language* of symptoms might loop and evolve, the *suffering* underneath was bedrock real. The fragmentation, the lost time, the terror—that was not a performance. It was a survival strategy. Her job wasn't to tell patients their reality was constructed. Her job was to make sure that the "loop" they were caught in was a safe one. She wanted the diagnosis to be a tool for healing, not a cage that dictated how they had to break.

  To her colleagues: She was a rigorous thinker who refused to let the field get lazy. She knew that "interactive kinds" require interactive care. You can't just treat the chart; you have to treat the relationship between the person and the chart.

  And to her patients, who are here tonight: She always told me that you were the experts in your own survival. She knew that the "looping" meant she was part of your story, and she took that privilege seriously. She didn't try to erase the parts of you that didn't fit the norm. She tried to make space for all of you to exist without shame. If her work was about a loop, it was about turning a cycle of trauma into a cycle of care.

  There is a line in philosophy that says, "To know a thing is to change it." Aunt [Name] knew that better than anyone. She knew that by witnessing you, she was changing the room, and she was asking the room to change for you.

  Now, after thirty-five years, she is finally stepping out of the loop. No more intake forms, no more diagnostic criteria, no more worrying about how the culture of the next decade will interpret the work of this one.

  Aunt [Name], you taught us that labels matter, but people matter more. You taught us that we can be scientifically rigorous and deeply compassionate at the same time. And you taught me that the smartest thing you can do is admit that you don't have all the answers, but you're willing to sit in the room and find them with someone.

  We are so proud of you. We love you. And we promise to only talk about philosophy during the appetizers, not the main course.

  Please raise your glasses. To Aunt [Name]—may your retirement be entirely your own kind. Cheers.
