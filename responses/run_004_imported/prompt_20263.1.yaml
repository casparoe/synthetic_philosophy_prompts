answer: |-
  Thank you all for being here.

  For those of you who don't know me, I'm [Your Name]. I'm also, as many of you know, currently finishing a dissertation on Borges. When my mother asked me to speak, she mentioned the pressure. She said, "Well, obviously it has to be you. You're the one who understands the work."

  But anyone who knew my abuela knows that she was the real scholar. I am just the one who inherited the library.

  She gave very specific instructions for this day. She told my mother that if anyone stood up here and said she was "watching over us," or that she had gone to a "better place," she would come back and haunt us out of pure spite. She was a woman of rigor. She valued truth over comfort. And she believed that the only honest way to speak about death was found in the last few paragraphs of Borges' *A New Refutation of Time*.

  For the family members who haven't read it: In that essay, Borges spends pages arguing that time isn't real. He suggests that there is no continuous "self" that travels from birth to death. Instead, we are just a series of disconnected moments. A succession of states. In this view, death isn't the destruction of a person, because there was never one solid person to begin with. There were just moments. And those moments remain.

  For years, I watched her teach this. I watched her explain to students that if time is a series of discrete instants, then the past is not gone; it is simply a different coordinate. She loved this idea. She found peace in the notion that she was not a single line moving toward an end, but a collection of instances. The woman who taught in this classroom in 1975 exists still in that moment. The woman who baked *alfajores* in her kitchen in 1990 exists in that one. The woman who held her grandchildren exists in that one.

  If we accept this argument, logically, we shouldn't be devastated. The "her" that we knew is not destroyed. It is merely finished, like a sentence that has been fully spoken. The words remain. The meaning remains. Only the speaking stops.

  It is a beautiful argument. It is intellectually airtight. And for about five minutes, it protects you.

  But then, Borges does something extraordinary. After building this fortress of logic, after proving that the self is an illusion and time is a construct, he stops. He admits that the argument, however perfect, does not change how it feels to be alive.

  He writes: *"And yet, and yet..."* (*Y, sin embargo...*).

  He admits that despite his proof, he still feels like a man being swept away by a river. He still feels the terror of the tiger. He knows, logically, that the tiger is an illusion of time, but if the tiger mauls him, the pain is real.

  This is where I have to leave the dissertation behind and speak as her grandson.

  Because I can stand here and deconstruct the continuity of the self. I can tell you that she persists in the library of moments she left behind. I can tell you that time is a fiction. But none of that stops the house from feeling quiet. None of that answers the phone when I want to call her to tell her I finished a chapter.

  The philosophy is true, but the grief is truer.

  She loved that reversal in Borges because it was the only honest thing she'd ever read about dying. It acknowledges that human beings are not just brains processing logic. We are bodies that feel absence. We are creatures who measure our lives not in discrete instants, but in the presence of the people we love. And when they are gone, the river keeps flowing, and it feels violent.

  So, I am not going to tell you she is in a better place. I am not going to tell you she is watching us. I don't know where she is. I only know where she isn't. She isn't in the chair where she graded papers. She isn't at the head of the table.

  But she is in the work. She is in the students who learned to read closely because she demanded it. She is in me, struggling to write sentences that are half as clear as hers. And she is in the honesty of this moment.

  Borges ends his essay by surrendering to the feeling of time, even if he can't prove it exists. I think my abuela would want us to do the same. We can honor her intellect by understanding the argument, but we honor her humanity by admitting that the argument doesn't save us from the pain.

  We miss her. The logic holds, but we miss her.

  Thank you.
