      *   *Probability:* Pascal admits we don't know the probability of God's existence ("God is, or He is not"). He treats it roughly as 50/50 for the sake of the argument, but the core mechanism is *Infinity vs. Finite*.
      *   *Key Distinction:* The Wager isn't just about maximizing expected utility in a vacuum. It's about *where* to place your bet given the human condition.
      *   *The Nature of the Infinite:* For Pascal, the only *true* infinite is God. Created things are finite.

  3.  **Deconstruct Pascal's Mugging (The Modern Problem):**
