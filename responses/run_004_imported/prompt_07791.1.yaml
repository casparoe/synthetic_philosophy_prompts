          *   More importantly: The Wager is about *submitting to God*. Paying the mugger is submitting to a demon/tyrant. Pascal views the world as a battle between God and the "Prince of this World."
          *   If the mugger claims power over souls, they are claiming Divine prerogative. Pascal would likely view this as a temptation/diabolical trick rather than a decision matrix problem.

