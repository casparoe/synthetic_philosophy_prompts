answer: |-
  Thank you all for being here.

  For those who don't know me, I'm [Your Name]. Walt was my uncle. And if you knew Walt, you know that standing here right now, I'm breaking one of his cardinal rules. Walt hated speeches. He hated pretension. And he hated being lied to.

  Before he died, Walt was very specific about what he didn't want to hear today. He told me, sober and serious: "No 'better places.' No 'watching over us.' No 'everything happens for a reason.'" He said the universe is what it is, and we should respect it enough to tell the truth about it. He didn't want comfort built on fiction.

  But he also didn't want the truth to sound bleak. And that was the tricky part. Walt was a machinist. He spent forty years standing in front of a lathe, measuring metal to the thousandth of an inch. He knew about scale. He knew that compared to a star, a human being is smaller than a speck of dust on a gear.

  Most people look at that math and say, "Well, if the universe is that big, and I'm that small, then nothing I do matters."

  Walt would have thrown a wrench at that logic.

  In his sixties, Walt got obsessed with a British mathematician named Frank Ramsey. Ramsey died almost a hundred years ago, when he was only twenty-six. But he wrote something that Walt treated like scripture. It was about how we measure value.

  Ramsey argued that feeling small because the universe is big is a category error. It's like saying a song isn't beautiful because it weighs less than a truck. Physical size isn't the same thing as meaning. A star is massive, but it's dead. It can't think. It can't love. It can't appreciate the light it gives off. Walt could. We can.

  Walt used to say that we have to draw the world "in perspective," not "to scale." On a blueprint to scale, a man is a dot. In perspective, the man is in the foreground, because he's the one holding the blueprint. The universe might not care about us, but we care about each other. And since we're the only things in the universe capable of caring, that makes us the most significant part of the whole operation.

  He lived this. He really lived it.

  Some of you remember the Thanksgiving joke. For twenty years, Walt would stand up after dinner, pat his stomach, and say, "I'd like to take credit for this meal, but I take no more credit for my two hundred and fifty-pound body weight than I do for the size of the universe. It's just gravity and genetics, folks. Don't applaud the mass."

  It killed every single time. But he was making a serious point. We don't choose our size, and we don't choose the silence of the cosmos. We choose what we do with the time we're here.

  Walt chose to be present. He chose to read. He chose to argue with the guys at his lunch table about the nature of truth, and then go back to the shop and cut steel that held up buildings. He didn't need the universe to give him a purpose. He generated his own.

  So, where is Walt now? He isn't watching us. He isn't in a better place. He's here. He's in the truth he told, the work he finished, and the way we're going to treat each other when we leave this room.

  The universe is huge, and it is indifferent. But it produced Walt. It produced this family. It produced the capacity for us to miss him this much. That isn't nothing. That is the only thing that matters.

  Walt didn't want us to feel small today. He wanted us to feel real. So, let's honor him by dropping the scale, keeping the perspective, and taking credit for the only thing we actually control: how much we care.

  Thank you.
