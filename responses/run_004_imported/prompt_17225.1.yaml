answer: |-
  It is a pleasure to meet a fellow traveler in *On Certainty*, especially one who appreciates the stratigraphy of Wittgenstein's metaphors. You have hit on the exact tension that makes this text so difficult and so rewarding. Your geological intuition is serving you well here; in fact, I would argue that your background gives you a leg up on many professional philosophers who miss the structural implication of the "river-bed" image.

  To answer your bottom line immediately: Wittgenstein is **not** filling in the foundation for Moore. He is not saying, "Moore is right that we know these things, he just lacks the geological explanation for *why* they are so hard."

  Rather, Wittgenstein is arguing that Moore has misidentified the material. Moore thinks he is holding a diamond (an empirical truth so hard it cannot be broken). Wittgenstein argues that Moore is holding the anvil upon which diamonds are tested. Consequently, Moore's anti-skeptical *proof* does not survive contact with Wittgenstein. It is dissolved. However, Moore's *instinct*—that we cannot seriously doubt the existence of the world—is preserved, but relocated from the realm of "Knowledge" to the realm of "Action" or "Form of Life."

  Here is the detailed breakdown of why "know" is the wrong tool for the job, anchored in the text.

  ### 1. Moore's Move: The Super-Empirical Claim
  In *A Defence of Common Sense* and *Proof of an External World*, G.E. Moore treats propositions like "Here is one hand" or "The earth has existed for many years" as **empirical claims** that happen to be exceptionally well-verified.

  Moore's strategy against the skeptic (or the Idealist) is essentially a weighing of probabilities. He argues:
  1.  I have evidence for "Here is a hand" (sensory experience).
  2.  The skeptic has premises that imply "No one knows for sure there are hands."
  3.  The evidence for (1) is stronger than the evidence for the skeptic's premises.
  4.  Therefore, I *know* (1), and the skeptic must be wrong.

  For Moore, "I know" is a psychological and logical state of high certainty regarding a fact. He treats the proposition "The earth exists" as a moving part of the river (an empirical claim) that is simply flowing so slowly it appears stationary. He thinks he can stop the flow and point to it.

  ### 2. Wittgenstein's Intervention: The Grammar of "Know"
  Wittgenstein agrees with Moore that we do not doubt these things, but he disagrees violently that the verb "to know" applies to them. This is where your suspicion of a "category mistake" is exactly right.

  For Wittgenstein, "knowledge" is a move within a language game. To say "I know X" implies three things that do not apply to hinge propositions:
  1.  **The possibility of doubt:** You can only claim to know something if it makes sense to doubt it.
  2.  **The possibility of verification:** You must be able to describe how you found out.
  3.  **The possibility of mistake:** If you cannot be wrong, you aren't "knowing"; you are just operating.

  Wittgenstein hits this explicitly in **Remark 18**:
  > *"Moore does not know what he asserts he knows, but it stands fast for him... It is wrong to say that we *know*."*

  And again in **Remark 59**:
  > *"Moore's mistake lies in this: 'I know' is taken to be similar to 'I believe', 'I surmise', 'I am convinced'... But 'I know' is not a statement of a psychological state."*

  If I say, "I know I am in pain," Wittgenstein argues elsewhere that this is nonsense; I am just *in* pain. Similarly, "I know I have a hand" is nonsense. I don't *know* it; I use it. To treat it as an object of knowledge is to treat the bedrock as if it were a stone you could pick up and examine.

  ### 3. The River-Bed and The Hinge
  This brings us to your favorite imagery. You noted the river-bed is in the 90s and the hinges in the 340s. You are correct.

  **The River-Bed (Remarks 96–99):**
  Wittgenstein writes:
  > *"It might be imagined that some propositions, of the form of empirical propositions, were hardened and functioned as channels for such empirical propositions as were not hardened but fluid; and that this relation altered with time, in that fluid propositions hardened, and hard ones became fluid."* (OC 96)

  Here is the geological shift. Moore thinks the bedrock is just "hardened fluid." He thinks "The earth exists" is a fluid proposition that has just become very viscous. Wittgenstein says: No. The distinction is functional. The bedrock propositions are not "true" in the same way the water is "wet." The bedrock *defines* what counts as water flowing in this channel.

  **The Hinge (Remarks 341–343):**
  > *"That is to say, the questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn."* (OC 341)

  > *"If I want the door to turn, the hinges must stay put."* (OC 343)

  This is the fatal blow to Moore's proof. A hinge is not part of the door's movement; it is the condition *for* the movement.
  *   **Moore:** "I can prove the door moves because I can see it swinging on this hinge (which is also a moving part)."
  *   **Wittgenstein:** "If the hinge is swinging, the door isn't moving; the whole frame is collapsing."

  When Moore holds up his hand and says, "I know this is a hand," he is trying to use the hinge to open the door. But the hinge only works if it remains fixed. By claiming to *prove* it, he subjects it to the rules of empirical verification (the flowing water), which instantly destabilizes it. If you have to prove you have a hand, you have already admitted that "having a hand" is the sort of thing that can be doubted.

  ### 4. Does Moore's Anti-Skeptical Project Survive?
  This is the crux of your question. Does anything of Moore survive?

  **The Argument Dies:**
  Moore's project was a *proof*. He wanted to silence the skeptic by out-arguing them on epistemic grounds. Wittgenstein shows this is impossible. You cannot argue against skepticism using the rules of skepticism (justification, evidence, knowledge). As Wittgenstein says in **Remark 4**:
  > *"If we are to understand these questions [of skepticism], we must understand that they are not serious questions."*

  To the skeptic who says, "How do you know the world wasn't created five minutes ago?", Moore says, "I have evidence." Wittgenstein says, "The game of 'having evidence' only exists if the world existed five minutes ago. You are asking for a justification of the entire system of justification."

  Moore tries to meet the skeptic on the skeptic's turf (the turf of "Justified True Belief") and wins by brute force. Wittgenstein burns the turf. He argues that skepticism is not a counter-position to common sense; it is a idling engine. It looks like a question, but it has no use.

  **The Stance Survives:**
  However, Wittgenstein saves Moore's *instinct*. He agrees with Moore that it is insane to actually doubt the existence of the external world. But he re-categorizes this certainty.
  *   **Moore:** It is *Knowledge* (Epistemic).
  *   **Wittgenstein:** It is *Certainty* (Non-epistemic/Animal).

  In **Remark 359**, Wittgenstein writes:
  > *"I am sitting in a chair, in this room, in England... I cannot be making a mistake. But am I any the more certain of this? Is there a 'I know' or a 'I am certain' that corresponds to this?"*

  His answer is essentially: There is a certainty, but it is not a mental state. It is a way of acting. We do not *believe* the earth exists; we *act* as if it does. We do not *know* our hands exist; we use them.

  ### 5. A Geological Postscript
  Since you appreciated the river-bed, let me offer one more geological extension that Wittgenstein implies but doesn't fully spell out.

  Moore treats the proposition "Here is a hand" like a **fossil**. He thinks it is an object found within the strata of the world that is particularly durable. He holds it up and says, "See? This fossil proves the strata are real."

  Wittgenstein treats the proposition like the **law of gravity** in a geological model. It is not a rock *in* the model; it is the force that allows the model to hold together. If you try to dig up gravity to examine it, you don't find a rock; you find that your shovel no longer falls to the ground.

  ### Summary
  To come away with a clear verdict:
  1.  **Is "Know" applicable?** No. Wittgenstein thinks applying "know" to hinge propositions is a grammatical confusion (OC 18, 59).
  2.  **Is Moore right about certainty?** Yes, but for the wrong reasons. We are certain, but not because of evidence. We are certain because doubt is logically excluded from the language game (OC 341).
  3.  **Does the Proof survive?** No. You cannot prove a hinge. You can only show that without it, the door (inquiry) cannot turn.

  Wittgenstein isn't reinforcing Moore's wall; he's showing that Moore was trying to build a wall out of the ground he was standing on. Moore wanted to turn common sense into a thesis. Wittgenstein shows that common sense is the *context* in which theses are made.

  So, your book club can safely say: Moore identified the right rocks, but he tried to use them as bricks when they were actually the foundation. Wittgenstein doesn't give us a better proof against the skeptic; he gives us a reason to stop listening to the skeptic's specific kind of nonsense.
