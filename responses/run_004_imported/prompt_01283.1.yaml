      *   *Correction:* The diary was published in German by Gottfried Gabriel in 1994. The English translation is by Richard L. Mendelsohn, appearing in *Frege: Political Writings* (ed. Gabriel & Kienzler) or similar. Dummett wrote a significant piece on it, "Frege's Political Writings" (1996).
      *   *Key Distinction:* Frege wasn't a Nazi (party didn't exist yet), but a precursor. He died in 1925.
      *   *The "Purity" Argument:* This is stronger than "Order." Russell wanted order but not purity of blood. Frege's anti-psychologism is about keeping logic pure from human minds. His politics is about keeping Germany pure from "alien" minds. This is the winning angle.

  9.  **Final Polish:** Ensure I don't validate the antisemitism while analyzing the connection. Keep the distinction between *context of discovery* and *context of justification* clear.

  **(Self-Correction Note):** I need to be careful not to confirm the "English translation not long after" as immediate. It was 1994 German, 1997 English (in *The Frege Reader* ed. Beaney, or separate?). Actually, the standard citation is Gabriel & Kienzler (1994) for German, and the English translation is often attributed to the volume *Frege: Political Writings* (Cambridge UP, 1997), edited by Gabriel and Kienzler, translated by Mendelsohn. Dummett's reaction is well-documented in his 1996 paper.

  Let's assemble the response.

  *   **History:** Mostly correct. Exclusion was deliberate.
  *   **Dummett:** Not a strawman, but he felt it more deeply than "loss of warmth."
  *   **Thesis:** "Purity" is better than "Order."
