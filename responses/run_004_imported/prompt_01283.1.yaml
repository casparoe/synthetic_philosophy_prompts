answer: |-
  This is a compelling and dangerous topic—in the best way. It's dangerous because it's easy to slip into ad hominem or genetic fallacies, but compelling because Frege is the paradigmatic case study for the "autonomy of logic."

  Here is a breakdown of where your history stands, how Dummett actually fits in, and some philosophical pushback to help you sharpen the thesis.

  ### 1. Fact-Checking the Background
  You are mostly accurate, but a few nuances will help you avoid easy corrections from the audience:

  *   **The Exclusion:** You're right that it was excluded from the 1969 *Nachlass* (edited by Hermes, Kambartel, and Kaulbach). It wasn't "lost"; it was a **deliberate omission**. The editors knew of the diary but deemed it politically toxic and philosophically irrelevant.
  *   **Publication:** It surfaced in German in **1994** (edited by Gottfried Gabriel and Wolfgang Kienzler). The English translation (by Richard L. Mendelsohn) appeared in **1997** (in the volume *Frege: Political Writings*). So, "mid-90s" is correct.
  *   **Frege's Status:** Be careful not to call him a "Nazi." He died in 1925. He was a precursor, a reactionary nationalist whose specific brand of antisemitism dovetailed with what came later, but he wasn't a party member. He was disillusioned with the Weimar Republic, yes, but framing him as a proto-Nazi is accurate only insofar as his ideas fed that stream.
  *   **Dummett:** You aren't strawmanning him, but you might be underplaying his anguish. Dummett was a committed anti-racist (arrested protesting apartheid in South Africa). For him, discovering Frege's racism wasn't just a "loss of warmth"; it was a moral crisis. He maintained the separation of logic and politics, but he argued that Frege's political views were **inconsistent** with the ethical implications of his own logic (specifically regarding the universality of truth).

  ### 2. Evaluating the Thesis: "The Same Temperament"
  Your hunch is that Frege's Platonism/anti-psychologism and his authoritarianism are expressions of the same drive for a "non-negotiable order."

  **Does it hold up?**
  Yes, but "Order" might be the wrong keyword. **"Purity"** is stronger.

  *   **The Philosophical Drive:** Frege's war against psychologism is a war against *contamination*. He wants to keep logic pure from the messy, subjective, human mind. The "Third Realm" is a quarantine zone where thoughts exist without being "had" by anyone.
  *   **The Political Drive:** His diary reveals a similar horror of contamination. He views the German *Volk* as an organic entity being polluted by Jews, Catholics, and parliamentarians.
  *   **The Link:** The connection isn't just that he likes authority; it's that he is terrified of **hybridity**. Just as a judgment cannot be partly psychological and partly logical, a nation cannot be partly German and partly Jewish.

  **Where it gets risky:**
  You need to avoid implying that Platonism *entails* authoritarianism. If you argue that "believing in objective truth makes you a fascist," Russell and Gödel will haunt your talk.
  *   **Refinement:** Argue that for Frege *specifically*, the epistemological anxiety (How do we grasp truth without distorting it?) mapped onto a political anxiety (How do we organize society without distorting the Volk?). It is a structural isomorphism in *his* mind, not a necessary logical connection between the fields.

  ### 3. Counterexamples & Pushback
  You asked for pushback. Here are the two biggest hurdles you'll face:

  **A. The Russell Counterexample (The Logician who wasn't Authoritarian)**
  Bertrand Russell is your biggest problem.
  *   **Philosophy:** Even more committed to logic as the foundation of reality than Frege in some respects. Anti-psychologistic in *Principia*.
  *   **Politics:** A radical pacifist, socialist, anti-imperialist, and prisoner of the state for his views. He was the antithesis of Frege's reactionary nationalism.
  *   **Why this matters:** If the "logical temperament" necessitated authoritarianism, Russell shouldn't exist. You have to explain why Frege's Platonism led to reaction while Russell's led to radicalism.
  *   **Your Move:** Russell saw logic as a tool for *liberation* from dogma; Frege saw it as a *structure* to submit to. Russell's empiricism (later in life) softened him; Frege's rigid Kantianism hardened him.

  **B. The Irrationalist Authoritarian (The Nazi who hated Logic)**
  Many actual Nazis were hostile to Frege's kind of rationality.
  *   **The Context:** Nazi ideology often leaned on *Lebensphilosophie* (Life-Philosophy), which was anti-rationalist, mystic, and blood-and-soil oriented. They sometimes attacked "Jewish science" (including relativity and formal logic) as too abstract and bloodless.
  *   **Why this matters:** Frege was actually *atypical* for a right-wing extremist of his time because he valued rigid rational structure over mystical intuition.
  *   **Your Move:** This actually helps you. It shows Frege's politics weren't just "generic racism"; they were a specific desire to impose **rational order** on society. He didn't want chaos; he wanted a clean, logical hierarchy. This reinforces your "hunger for order" thesis but distinguishes him from the irrationalist fascists.

  ### 4. Suggestions for the Talk Structure
  If I were writing this, I would structure the argument to avoid the "Ad Hominem" trap while making the philosophical link:

  1.  **The Standard Wall:** Acknowledge Dummett's position (Context of Justification vs. Context of Discovery). Concede that *Begriffsschrift* is valid regardless of Frege's bigotry.
  2.  **The Crack in the Wall:** Argue that while the *validity* is safe, the *motivation* is not. We cannot understand *why* Frege fought psychologism so violently without understanding his fear of human messiness.
  3.  **The Purity Thesis:** Show the parallel language.
      *   *Logic:* Separating the subjective act of thinking from the objective content of thought.
      *   *Politics:* Separating the "true" German from the "alien" Jew.
      *   Both are projects of **exclusion** to preserve a realm of objective value.
  4.  **The Cost:** Conclude that acknowledging this doesn't invalidate the logic, but it invalidates the **myth of the disinterested logician**. Frege wasn't discovering a neutral realm; he was building a fortress.

  ### 5. One Specific Historical Correction
  You mentioned Dummett said it makes it "harder to approach the work with the same warmth."
  Dummett actually went further. He suggested that Frege's failure to apply his own logical universalism to human beings was a **philosophical failure**, not just a moral one. Frege believed thoughts were accessible to all rational beings (universalism), but his politics denied certain humans the capacity for rational participation. Dummett pointed out this contradiction. You might want to use that: Frege's politics violated his own philosophy of mind.

  ### Summary Verdict
  Your hunch holds up, provided you frame it as a **psychological/temperamental isomorphism** rather than a logical entailment. Focus on **Purity/Contamination** rather than just "Order." Use Russell as the foil to show this was Frege's specific pathology, not the pathology of logic itself.

  It's a strong angle. It moves the conversation from "Was Frege a bad man?" (Yes) to "How did his philosophical anxieties fuel his political horrors?" (Much more interesting).
