      *   *The Inequality:* The function $f(P) = \max_a E_P[U(a, \theta)]$ is convex in the probability distribution $P$.
      *   *Why Convex?* The maximum of linear functions is convex. (This is the key mathematical insight).
      *   *Jensen's Connection:* Since the posterior is a mean-preserving spread of the prior (martingale property of beliefs), and the value function is convex, the expected value of the posterior utility is greater than or equal to the utility of the prior.
