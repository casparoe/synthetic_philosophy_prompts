      *   *Intuition:* It *is* essentially convexity (Jensen's), but framed decision-theoretically.
      *   *Setup:*
          *   States of the world: $\theta$.
          *   Actions: $a$.
          *   Utility: $U(a, \theta)$.
          *   Prior: $P(\theta)$.
