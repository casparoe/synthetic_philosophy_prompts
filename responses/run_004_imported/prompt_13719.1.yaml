      *   *Without Evidence:* Choose $a^*$ to maximize expected utility based on prior. Value = $\max_a \sum_\theta P(\theta) U(a, \theta)$.
      *   *With Evidence:* Observe $x$. Update to posterior $P(\theta|x)$. Choose $a_x^*$ to maximize expected utility based on posterior. Value for specific $x$ = $\max_a \sum_\theta P(\theta|x) U(a, \theta)$.
