answer: |-
  Here are 10 interview questions designed to corner the Davidsonian commitments without being hostile. They are structured to prevent her from retreating into "you're misunderstanding the project" by anticipating those moves in the phrasing.

  I've included **Producer's Notes** for each question to explain the philosophical trap, so you know exactly *why* you're asking it and how to react if she tries to dodge.

  ### 1. The Constitutive Trap
  "Let's start by locking down the status of Radical Interpretation. You've made it clear that you see this not as a practical manual for field linguists, but as a constitutive claim about what it *is* to have a mind. But if RI is an a priori condition for intentionality rather than an empirical hypothesis, how do we distinguish between a theory that is *true* of believers and a theory that simply *defines* believers into existence? If the criteria for having a belief are set by the conditions of interpretation, aren't we at risk of making the thesis unfalsifiable by design?"

  > **Producer's Note:** This forces her to admit that Davidsonism is a framework, not a discovery. If she says it's unfalsifiable, you can press later on why we should accept it over competitors. If she says it's falsifiable, ask for the conditions.

  ### 2. The Indeterminacy Analogy
  "You've compared the indeterminacy of translation to the choice between Celsius and Fahrenheit—the idea being that both capture the temperature, just on different scales, and neither is 'wrong.' But temperature is a physical magnitude we can independently verify with a thermometer. Meaning doesn't seem to have a thermometer. If there's no fact of the matter beyond what fits the interpretive scheme, isn't the Celsius analogy doing too much work? Doesn't it smuggle in a realism about meaning that Davidson officially wants to reject?"

  > **Producer's Note:** She uses this analogy to wave off Quine. This question points out that measurement scales track an independent reality, whereas Davidson says there *is* no independent reality of meaning beyond the scheme.

  ### 3. The Arrogance Objection (Part 1)
  "I want to press on the Principle of Charity. The worry is that by requiring us to maximize agreement and rationality to interpret a speaker, we're essentially legislating that people can't be deeply wrong unless they're mostly right *by our lights*. Doesn't this privilege the interpreter's worldview as the objective standard? If I encounter a culture with a radically different conceptual scheme, doesn't Charity force me to interpret them as secretly agreeing with me, which seems like a form of philosophical imperialism?"

  > **Producer's Note:** This is the first half of the "Arrogance" requirement. It frames Charity as ethnocentric. She will likely say, "No, it's not about *my* beliefs, it's about *optimizing* truth."

  ### 4. The Arrogance Objection (Part 2: The Follow-Up)
  "Okay, but the standard Davidsonian reply is that particular errors are only locatable against a backdrop of massive agreement. But that backdrop has to be substantive. If I can't identify a systematic error in your worldview unless I can map it onto *my* logic of truth, haven't I still made my logic the condition of possibility for your having a worldview at all? Is there any room left for a disagreement that isn't just a localized glitch in a shared machine, but a fundamental clash of rationalities?"

  > **Producer's Note:** This is the requested follow-up. It blocks the "background agreement" defense by arguing that the *structure* of the background is still the interpreter's structure.

  ### 5. The Foster Problem (Part 1)
  "Let's shift to the truth theory. As you know, the Foster problem shows that a Tarski-style theory can generate all the correct T-sentences—'Snow is white' is true iff snow is white—and still fail to give meanings, perhaps by adding irrelevant conjuncts like 'and 2+2=4.' If the formal constraints don't rule out these deviant theories, what exactly is doing the work to pick out the *correct* meaning? Is it just an appeal to intuition that Davidson can't officially rely on?"

  > **Producer's Note:** This sets up the Foster problem. It asks for the "meaning-giving" mechanism. She will likely appeal to the "holistic fit" of the whole theory.

  ### 6. The Foster Problem (Part 2: The Follow-Up)
  "Here's the follow-up on that: You might say that holistic fit with what speakers hold true rules out those deviant theories. But doesn't that just make the deviant theories *harder* to construct rather than impossible? If I can adjust the rest of the theory to accommodate the 'and 2+2=4' clause, haven't I still satisfied the constraint? If the constraint is just 'fit,' aren't we back to indeterminacy, and if it's something stronger, what is it?"

  > **Producer's Note:** This is the requested follow-up. It challenges whether Holism actually solves the logical problem or just makes it annoying to solve.

  ### 7. "A Nice Derangement of Epitaphs" (Part 1)
  "In your work on 'A Nice Derangement of Epitaphs,' you argue that successful communication often relies on a 'passing theory'—an ad hoc interpretation worked out in the moment for malapropisms or metaphors—rather than a 'prior theory' of conventional rules. If communication is really just a temporary convergence of two passing theories, in what sense were the speakers speaking the *same language* at all? Are we just two monologues that happened to overlap?"

  > **Producer's Note:** This attacks the idea of "shared language." If meaning is ad hoc, the "social" aspect of language weakens.

  ### 8. "A Nice Derangement of Epitaphs" (Part 2)
  "Following up on that: If the 'passing theory' is what actually explains understanding, isn't that basically conceding that compositional semantics was never really the right project? If we can communicate without a shared prior structure, why did we spend all this time building a truth theory for a public language? Have we reduced semantics to pragmatics?"

  > **Producer's Note:** This is the second half of the Derangement requirement. It asks if Davidson has accidentally dissolved the project of formal semantics.

  ### 9. The Hard Bullet (Animals and Infants)
  "I want to end on a consequence that many find deeply unintuitive. On your view, to have a belief, one needs the concept of objective truth. To have that concept, one needs language. And to have language, one needs triangulation with another speaker. This entails that prelinguistic infants and non-human animals cannot have beliefs. I know Davidson bit this bullet, and I suspect you do too. But are you really prepared to say a dog chasing a squirrel has *no* beliefs about the squirrel's location, simply because it can't discuss the concept of truth with me?"

  > **Producer's Note:** This is the requested ending. It forces her to choose between common sense (dogs have beliefs) and theoretical consistency (Davidson's triangulation).

  ### 10. The Cost of Admission
  "Finally, if we accept Radical Interpretation, we seem to have to accept that meaning is indeterminate, deep disagreement is structurally limited, compositional semantics is secondary to passing theories, and animals have no minds. Davidson claimed to be defending a common-sense realism. But looking at that list of commitments, hasn't the cost of defending realism become more expensive than the skepticism you were trying to defeat?"

  > **Producer's Note:** This is the "checkmate" synthesis question. It asks her to weigh the theoretical benefits against the intuitive costs. It leaves the audience thinking about the price of the view.
