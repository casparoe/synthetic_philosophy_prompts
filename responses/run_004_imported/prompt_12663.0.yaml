prompt: |-
  I'm currently taking a graduate seminar on formal decision theory, and I've been asked to help moderate the Q&A when our department's colloquium hosts a speaker next week. She defends evidential cooperation in large worlds (ECL): the claim that, even absent any causal link between them, agents scattered across a sufficiently large or infinite universe should treat their own choice to cooperate across different value systems as evidence that relevantly similar reasoners elsewhere are doing the same, making cooperation worthwhile in expectation. Draft eight to ten questions that go beyond having her restate the basic argument. I want at least one question on why the correlation ECL relies on isn't just the same kind of correlation that makes evidential decision theory look bad in cases like the smoking lesion, one on what could possibly justify assigning credences to the values and decision procedures of agents we can never observe, and one on what ECL actually adds to ordinary Hofstadter-style superrational cooperation once the other reasoner is no longer assumed to face a matching, symmetric choice. For each, add a follow-up keyed to the answer she's most likely to give, and close with a question about what, short of the large-world cosmology itself turning out to be false, could count as evidence against actually acting on ECL.
