prompt: |-
  I'm a PhD student in philosophy working mainly on formal epistemology and decision theory, and a few of us in the department run a small podcast where we interview people working at the intersection of decision theory and AI safety. Next week's guest is a decision theorist who has made something of a name for himself with a strong line on the so-called commitment races problem: the worry, familiar from this literature ever since it was first laid out in a well-known LessWrong post a few years back, that once bargaining agents can predict or read one another's policies -- whether through source-code transparency or acausal/logical correlation -- each has an incentive to commit to a self-favoring strategy as early and as irrevocably as possible, so the interaction turns into a race to commit rather than a process of reasoning together, with the risk that agents lock in disastrous, hastily-chosen threats before anyone has had time to think things through. His signature move, whenever pressed on this, is to insist that the whole problem dissolves once an agent is "updateless enough": on his view, an agent that evaluates policies from far enough back, prior to updating on any information at all, simply isn't a participant in the race, because there is no earlier vantage point from which a rival could out-commit it -- so worries about haste and poor deliberation are supposed not to arise for a properly updateless agent.

  Could you draft nine or ten interview questions for me, sequenced so that the first couple let him give that answer comfortably and the later ones make it progressively harder to reach for? I'd like the set to include, in some order: a question pressing on how one is supposed to fix the prior, or vantage point, relative to which one counts as "updateless," given that rival agents have self-serving reasons to favor different starting points; a follow-up asking whether relocating the contest to a dispute over priors, rather than over object-level policies, is really a dissolution of the problem or just a relabeling of it; a question that borrows Schelling's image of visibly disabling one's own steering wheel in a game of chicken to ask what stops two "sufficiently updateless" agents from both locking in mutually catastrophic threats at once; a question about whether recommending rapid updatelessness as the fix isn't itself just another hasty commitment made under race conditions; and a closing question asking him to describe what a real-world instance of a bad commitment race would look like on his account, together with what evidence, if any, would convince him that radical updatelessness is not the safe default he takes it to be. After each question, add a one-line note flagging the deflection or restatement he's likely to reach for, so I know where to push back live rather than let it pass.
