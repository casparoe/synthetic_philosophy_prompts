answer: |-
  **Setting:** *A quiet corner of the hotel bar, following a panel on "The Boundaries of Medicine." Two empty glasses sit between them. **Dr. Aris Thorne** (Naturalist) is loosening his tie. **Prof. Elena Vance** (Normativist) is still tapping her pen against her notebook.*

  **Elena:** You dodged the question during the Q&A, Aris. I saw you do it.

  **Aris:** I answered it, Elena. I said aging is not a disease under the Biostatistical Theory.

  **Elena:** You *stipulated* it isn't. That's my point. You're using age-specific reference classes. You compare an eighty-year-old's physiological functioning to other eighty-year-olds. Well, of course the eighty-year-old looks "normal" by that metric! You've rigged the game.

  **Aris:** Rigged? It's calibration. If you compare an eighty-year-old's lung capacity to a twenty-year-old's, *everyone* over thirty has a disease. That renders the concept of disease useless.

  **Elena:** But that's exactly the trick, isn't it? By slicing the reference class by age, you define aging out of pathology by construction. You're saying, "Well, relative to other people whose bodies are falling apart, your body is falling apart correctly." It's a tautology. It protects the theory from the reality that aging is the primary source of human suffering.

  **Aris:** Suffering isn't the same as dysfunction. Look, the BST is about species design. The human organism is designed to maintain homeostasis for a certain period, reproduce, and then the maintenance mechanisms degrade. That degradation is statistically typical for the later stages of the life history. If it's typical, it's not a deviation.

  **Elena:** "Typical." There's the word. So if we discovered a way to halt cellular senescence tomorrow, and everyone lived to 150 in perfect health, would the people dying at 80 *then* be diseased?

  **Aris:** If the statistical norm shifted to 150, then yes, dying at 80 would indicate a subnormal failure of function.

  **Elena:** Aha! So it *is* contingent on what we can fix. It's not an objective fact about the biology; it's a fact about the current distribution of failure. You're grounding "disease" in our current inability to stop aging. That's not value-free science, Aris. That's conservatism masquerading as biology. You're calling inevitability "health."

  **Aris:** I'm calling inevitability "nature." Listen, turn the table. You Normativists want to define disease as "a condition that is bad or undesirable."

  **Elena:** Harmful. Unwanted. Impeding flourishing.

  **Aris:** Okay. Where do you draw the line? I'm five-foot-six. I wish I were six-foot. It's undesirable. It limits my flourishing in certain social contexts. Is shortness a disease?

  **Elena:** Don't be obtuse. Shortness isn't a *failure of internal systems*. Aging is systemic decline.

  **Aris:** But why is the decline "systemic failure" and not just "systemic timeline"? You're smuggling in a value judgment that *death is bad*, therefore the process leading to it is a disease. But if death is the natural terminus of the organism, the process leading there is the organism working as intended, just winding down.

  **Elena:** "Working as intended." Who intended it? Evolution doesn't have intentions. It just selects for reproductive success. Once reproduction is done, evolution doesn't care if we rot. Just because evolution abandoned us at forty doesn't mean we have to accept rot as "normal functioning."

  **Aris:** I'm not saying we have to accept it. We can treat the symptoms. We can fix the hip, clear the artery. But treating a symptom isn't the same as classifying the lifecycle as a pathology. If you call aging a disease, then *every* living human is diseased. We are all aging from the moment of conception.

  **Elena:** We're not all clinically declining from conception. There's a inflection point.

  **Aris:** Is there? When? Thirty? Forty? Fifty? Who decides? That's the line-drawing problem on *your* side, Elena. If disease is "undesirable condition," then menopause is a disease. Infertility is a disease. Grief is a disease. You expand the concept of medicine until it swallows the concept of living.

  **Elena:** I'm not saying every negative state is a disease. I'm saying that when a condition involves progressive, pathological loss of function that medicine *could* intervene on, calling it "normal" is an ethical failure. You're using the reference class to create a safe harbor for pharmaceutical companies. They don't have to develop geroprotectors because "aging isn't a disease." It's a regulatory shield.

  **Aris:** Or, it's a recognition that medicine is for repair, not for redesign. If I fix your broken leg, I'm restoring you to your reference class function. If I try to "cure" your aging, I'm trying to change your reference class entirely. I'm trying to make you a different kind of organism.

  **Elena:** And why is that forbidden? If the "reference class" is just a statistical snapshot of current human limitations, why worship it? You say BST is value-free, but choosing *which* reference class to use is a value judgment. You chose age-stratified classes. Why not species-wide classes?

  **Aris:** Because species-wide classes make pediatrics impossible. A child's immune system is "subnormal" compared to an adult's. If we don't stratify by age, every child is diseased. You need the stratification to make sense of development. But if you accept stratification for development, you must accept it for decline. It's the same curve.

  **Elena:** It's not the same curve. Development is gaining function. Aging is losing it. One is construction, the other is entropy. You're equating the two because it keeps your definition tidy. But look at the cost. By saying aging is "normal," you tell the eighty-year-old that their pain, their frailty, their impending death is just "statistically expected." It depoliticizes suffering.

  **Aris:** It depoliticizes it so we can treat it objectively! If I tell a patient, "You have a disease," I imply there is a specific target to eradicate. If I say, "You are aging," I imply we need management strategies. If we label aging a disease, we promise cures we can't deliver. We create false hope.

  **Elena:** Or we spur the research to deliver them. Penicillin wasn't possible until we decided infection was a target, not a fate. Smallpox was "normal" for centuries. Was it not a disease until we could cure it?

  **Aris:** Smallpox was a pathogen attacking the system. Aging *is* the system. That's the distinction.

  **Elena:** That's a distinction without a difference to the person in pain. If the system is destroying itself, that's a pathology.

  **Aris:** If the system is executing its final program, that's biology.

  **Elena:** *(Sighs, leaning back)* So we're back to teleology. You keep saying "program" and "design." But there is no designer. There's just entropy and natural selection. If we have the knowledge to fight entropy, why does your theory tell us to stand down?

  **Aris:** My theory doesn't tell us to stand down. It tells us to be precise. Call it "senescence." Call it "degeneration." But don't call it a disease unless you're willing to call childhood a disease of immaturity.

  **Elena:** Childhood isn't harmful. Aging is.

  **Aris:** "Harmful." There it is. The value judgment. You can't escape it, Elena. You need the "badness" to do the work. But "badness" changes. In a society that values elders, aging is less "undesirable." Does the disease status change with public opinion?

  **Elena:** No, the suffering is objective.

  **Aris:** The tissue degradation is objective. The *suffering* is the normative layer you put on top. I'm trying to give you the tissue degradation without the layer.

  **Elena:** But without the layer, you have no justification for intervention. If it's just "statistically normal tissue degradation," why fund the research? Why insure the treatment?

  **Aris:** Because even normal things can be mitigated. We wear shoes because walking on rough ground wears down our feet. Walking wears down feet. That's normal. Shoes aren't a cure for a disease; they're an adaptation to a normal process.

  **Elena:** *(Smiles faintly)* So medicine is just shoes for the body?

  **Aris:** Sometimes.

  **Elena:** I think that's where we disagree. I think medicine is the promise that we don't have to accept the wear. But I'll grant you this: if you define disease strictly by deviation from the mean, you're safe from the charge of arbitrariness. But you pay for it by making your theory blind to the very thing that makes us seek doctors in the first place.

  **Aris:** And I'll grant you this: if you define disease by suffering, you capture the human experience. But you pay for it by making medicine infinite. If aging is a disease, there is no such thing as a healthy adult. Only patients in remission.

  **Elena:** *(Raises her empty glass)* To the reference class.

  **Aris:** *(Clinks his glass against hers)* To the line we can't quite draw.
