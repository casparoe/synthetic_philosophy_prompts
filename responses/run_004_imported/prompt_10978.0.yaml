          *   Normativist: Disease = inherently evaluative/normative (bad, harmful, undesired). Value-laden.
      *   **Topic:** Is aging itself a disease?
      *   **Key Argument for Normativist:** The reference class problem. If you sort by age, an 80-year-old's decline is "normal for an 80-year-old." This seems to define aging out of disease by construction rather than proving it isn't one.
      *   **Key Argument for Naturalist:** The "bad/undesired" line is also arbitrary. Where do you draw the line between "unfortunate normality" and "disease"? Need a real comeback, not just restating BST.
      *   **Format:** Dialogue with actual back-and-forth, not just monologues.

  2.  **Character Conception:**
      *   **Naturalist (Dr. Aris Thorne):** Analytical, precise, focused on biological mechanisms and statistical distributions. Wants objectivity.
      *   **Normativist (Prof. Elena Vance):** Philosophical, focused on human experience, suffering, and the social implications of labeling. Wants to capture the *meaning* of illness.

  3.  **Drafting - Section by Section:**

