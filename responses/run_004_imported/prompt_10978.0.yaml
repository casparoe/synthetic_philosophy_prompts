prompt: |-
  Could you write me a dialogue between a naturalist about disease (think Boorse's biostatistical theory, where disease is just statistically subnormal functioning relative to your reference class) and a normativist who thinks disease is inherently evaluative? Have them argue specifically about whether aging itself counts as a disease. I want the normativist to press on the awkward fact that the naturalist's reference class is already sorted by age, so an 80 year old's decline comes out "normal for that age" almost by construction -- doesnt that just define aging out of being a disease rather than actually showing it isn't one? But the naturalist shouldn't just fold, they need a real comeback, and they should get to press the normativist back on whether "disease = bad/undesired" isn't just as arbitrary a line to draw. Want actual back and forth here, not two people just restating their opening position.
reasoning: |-
