      *   **Round 2 (Naturalist Defense):** Aris needs to explain *why* we use age-specific reference classes. It's about species design. Aging isn't a design failure; it's the end of the design lifecycle.
      *   **Round 3 (Normativist Counter):** But it causes suffering! If we could cure it, we would. Why is "universal suffering" not a disease?
