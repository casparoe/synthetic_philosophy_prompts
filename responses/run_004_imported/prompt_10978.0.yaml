      *   *Naturalist's Comeback:* Aris needs to argue that the Normativist's definition makes *everything* a disease if it's unwanted. He needs to highlight the "line-drawing problem" on the normative side.
      *   *Specific BST nuance:* Boorse distinguishes between *function* and *ability*. Aging reduces ability, but does it reduce function relative to the *stage* of the organism?

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Start:* Coffee cups, conference name tags.
