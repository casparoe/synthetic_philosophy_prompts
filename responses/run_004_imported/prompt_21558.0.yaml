      *   **Criterion 3: Sensitivity/Robustness:** How sensitive was the outcome to this omission?
      *   **The Hard Truth:** Address the second part of the user's question. Is "root cause" just blame/convention? Yes, largely. It's a social construct designed to drive behavior change, not a physical law.
      *   **Recommendations for Postmortems:** How to apply this? Move away from "Root Cause" to "Contributing Factors" or "Actionable Insights." Focus on system resilience rather than human omissions.

