      *   The core tension is between *metaphysical causation* (what actually made the difference in the fabric of the universe) and *pragmatic/explanatory causation* (what helps us intervene effectively).
      *   In SRE/DevOps contexts, "root cause" is rarely a metaphysical claim; it's a tool for prevention.

  3.  **Key Philosophical Concepts to Bring In:**
      *   **Counterfactual Dependence:** The basic test the user mentioned ($ \neg C \square \rightarrow \neg E $).
      *   **Normative Expectations:** Causes are often deviations from a "normal" or "expected" course of events (Hart & Honoré).
      *   **Interventionism:** Causation is about where we can intervene to change the outcome (Woodward).
      *   **Contrastive Explanation:** We explain why *this* happened rather than *that* (van Fraassen).
      *   **Systemic vs. Proximate:** Distinguishing between the spark and the fuel.

