answer: |-
  You have stumbled onto one of the deepest and most persistent problems in the philosophy of causation, and you are absolutely right to be suspicious of how your team uses it.

  The puzzle you are describing is known in metaphysics as the **Problem of Causation by Omission**. As you noted, if we define cause strictly via counterfactuals ("If $C$ had not happened, $E$ would not have occurred"), then absences qualify as causes. But since there are infinite things that *didn't* happen at any given moment, there are infinite causes.

  Your cat example is the classic *reductio ad absurdum* used by philosophers like Jonathan Schaffer and Helen Beebee. If the outage wouldn't have happened if your cat had reviewed the code, why isn't the cat's inaction a cause?

  Here is the breakdown of the implications for your postmortems, how philosophers (and safety engineers) distinguish the engineer from the cat, and the hard truth about what "root cause" actually is.

  ### 1. The Distinction: Causal Ontology vs. Causal Selection
  The first implication is realizing that your postmortem is not doing **ontology** (describing the fundamental fabric of reality); it is doing **selection** (picking out the useful bits for humans).

  Metaphysically, the cat's non-review and the engineer's non-review are on equal footing. Both are absences. Both satisfy the counterfactual test. The difference is not in the *causation*; it is in the **explanation**.

  When we assign "root cause," we are engaging in **Causal Selection**. We are filtering the infinite web of causal conditions down to the ones that matter for our specific interests. In incident review, our interest is **prevention**, not truth.

  **Implication:** Stop treating "root cause" as a singular, objective fact waiting to be discovered. It is a pragmatic selection based on utility.

  ### 2. The Three Filters (How to exclude the cat)
  If metaphysics doesn't distinguish the engineer from the cat, what does? Philosophers of action and safety science generally apply three filters to narrow down omissions. You can use these to audit your postmortems.

  #### A. Normative Expectations (The "Duty" Filter)
  This is the most common solution (championed by legal philosophers H.L.A. Hart and Tony Honoré). We identify an omission as a cause only if there was a **normative expectation** that the event should occur.
  *   **The Cat:** There is no social, professional, or physical norm that a cat should read code.
  *   **The Engineer:** There is a professional norm and a job description.
  *   **The System:** There is an expectation that a monitoring system should page.

  **The Trap:** This filter is where blame sneaks back in. If you focus on the *individual's* failure to meet a norm ("Bob didn't review"), you are blaming. If you focus on the *system's* reliance on a norm ("We relied on a review process that is prone to human fatigue"), you are engineering.
  **Implication:** In a blameless postmort, the "norm" should never be human vigilance. It should be system guarantees. If the root cause is "Engineer didn't catch bug," you have failed to move the norm to the tooling.

  #### B. Interventionability (The "Lever" Filter)
  This comes from James Woodward's **Interventionist Theory of Causation**. A factor is a cause if manipulating it changes the outcome. But crucially, it must be a manipulation *we can actually perform*.
  *   **The Cat:** We cannot train cats to review code. It is not a viable intervention point.
  *   **The Engineer:** We can train engineers, but human reliability is a low-leverage intervention (humans are inherently unreliable).
  *   **The CI/CD Pipeline:** We can enforce automated checks. This is a high-leverage intervention.

  **Implication:** An omission is only a valid "root cause" if there is a feasible, robust intervention to ensure it happens next time. If the fix is "try harder," it's not a cause; it's a wish.

  #### C. Contrastive Explanation (The "Question" Filter)
  Philosopher Bas van Fraassen argued that explanations are answers to "Why P rather than Q?" questions. The cause depends on what you are contrasting the outage with.
  *   **Question 1:** "Why did the system crash *today* rather than *yesterday*?"
      *   *Cause:* The specific bad code deploy.
  *   **Question 2:** "Why did this *single bug* take down production rather than being contained?"
      *   *Cause:* Lack of canary deployment / rollback mechanism.
  *   **Question 3:** "Why did the *on-call* not fix it faster?"
      *   *Cause:* Alert fatigue / missing runbook.

  **Implication:** Your postmortem likely fixes on the wrong contrast. You are asking "Why did the outage happen?" (which leads to "Because Bob missed the bug"). You should be asking "Why was the system vulnerable to a single bug?" (which leads to "Because we lack feature flags").

  ### 3. The Hard Truth: Is "Root Cause" Just Blame in Disguise?
  You asked: *Is "root cause" always secretly just blame/convention dressed up as objective causal language?*

  **Yes.**

  In complex socio-technical systems, there is no such thing as *The* Root Cause. There is only a **causal field**.
  *   The code had a bug.
  *   The review missed it.
  *   The tests didn't cover it.
  *   The deploy pipeline allowed it.
  *   The monitoring didn't catch it immediately.
  *   The on-call was tired.

  All of these are equally "causal." If any one of them had been different, the outage might not have occurred. Selecting one as "The Root" is a social decision, not a scientific one.

  When teams select a human omission (e.g., "Reviewer didn't catch it") as the root cause, they are usually engaging in **fundamental attribution error**. They are attributing the cause to the agent rather than the context. It feels objective ("It's a fact they didn't review"), but it's a choice to stop looking deeper at *why* the review process failed.

  ### 4. How to Fix Your Postmortems
  Knowing this philosophical baggage, here is how you should adjust your incident review process to be truly blameless and effective:

  1.  **Ban the phrase "Root Cause."**
      It implies singularity and objectivity where there is none. Use **"Contributing Factors"** or **"Causal Chain."** Acknowledge there are multiple points where the chain could have been broken.

  2.  **Apply the "Substitution Test."**
      For any human omission identified (e.g., "On-call didn't notice the alert"), ask: *If we replaced this engineer with another equally competent engineer, would the result be the same?*
      *   If **Yes**: It is not a person problem; it is a system problem. The alert was too noisy, the dashboard was unclear, or the runbook was missing.
      *   If **No**: You might have a training issue, but you still need to ask why the system allowed a single person's reaction time to be the critical failure point.

  3.  **Prioritize "Positive" Causes over "Negative" Ones.**
      Omissions are hard to fix (how do you fix "didn't happen"?). Focus on positive system states.
      *   *Bad:* "Migration script didn't have a rollback." (Omission)
      *   *Good:* "Deployment pipeline lacks a mandatory rollback verification step." (System State)
      *   *Better:* "Pipeline blocked deploy because rollback procedure was undefined." (Positive Constraint)

  4.  **Shift the Norm.**
      Return to the Normative Expectation filter. In your organization, what is the "normal" state?
      *   If "normal" is "Humans catch mistakes," you will always find human omissions as root causes.
      *   If "normal" is "Systems prevent mistakes," then the root cause of any bug reaching production is **the system's permission**, not the human's action.

  ### Summary
  The "cat" problem proves that causation is not enough to assign responsibility. We need **norms** and **interventions**.

  When your team pins an outage on "The reviewer didn't catch it," they are using a lazy causal selection that relies on a normative expectation of human infallibility. It is objectively true that the reviewer's action would have prevented the outage, but it is pragmatically useless to call that the root cause because you cannot scale "perfect reviewing."

  The principled way to distinguish the engineer from the cat is not metaphysics; it is **design**. The engineer is part of the control loop; the cat is not. But in a mature engineering culture, the *engineer* should also be designed out of the critical safety loop wherever possible.

  **The Verdict:** "Root cause" is indeed convention dressed up as objectivity. Own that. Use the postmortem not to find the *truth* of what happened, but to negotiate the *best story* that leads to a more resilient system. If the story ends with "Human X failed," the story is too simple.
