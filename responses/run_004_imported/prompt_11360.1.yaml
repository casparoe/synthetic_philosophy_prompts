answer: |-
  1. **The Grammatical Burden of the Mass-Noun Hypothesis**
  Your reading hinges on the claim that classical Chinese count-nouns function semantically as mass terms, allowing "horse" to denote the mereological sum of all horse-stuff. However, syntacticians like Christoph Harbsmeier and others have argued that classical nouns *can* take numerals and classifiers without the kind of coercive syntax English requires for mass nouns. If the mass-noun hypothesis is not a universal rule of classical grammar but merely a contextual possibility, what specific syntactic environment in the *White Horse Dialogue* forces the mass-noun reading? Does your interpretation collapse if "horse" in line one is permitted to have count-noun force?

  *Follow-up:* You'll likely argue that the *lack* of a classifier in the crucial premise signals the mass reading. But if the opponent in the dialogue also omits classifiers while arguing for the common-sense view, doesn't that suggest the grammar itself is neutral, forcing you to rely on philosophical rather than linguistic evidence to settle the semantics?

  2. **The Semantics of *Fei* (非) in a Mereological System**
  In standard mereology, a part is not identical to the whole, but it is usually included in it. Your reading makes "White Horse is not Horse" true because the intersection of white-stuff and horse-stuff is not identical to the sum of horse-stuff. But this requires reading *fei* as "is not identical to" rather than "is not a member of." Given that the opponent's objections often turn on practical substitution ("If you want a horse, a white horse will do"), does your mereological reading account for why *fei* blocks substitution in Gongsun Long's view but not in the opponent's? Are they talking past each other about identity, or about inclusion?

  *Follow-up:* If you say they are disagreeing about inclusion, does that imply Gongsun Long is committed to the view that "White Horse" is not even a *part* of "Horse" in the relevant sense, which seems to contradict the mereological overlap you posit?

  3. **Coherence with the *Hard and White* (Jianbai) Metaphysics**
  The *Jianbai* discourse treats hardness and whiteness as separate universals because they are apprehended by different senses (touch vs. sight), suggesting a quasi-Platonist realism where attributes exist independently of the object. This seems distinct from the mereological "stuff" semantics of *White Horse*, where attributes are overlapping masses. Do you see these as two stages of a single coherent system—perhaps mereology for compounds and realism for simples—or is it more plausible that later doxographers stitched together texts from different authors under the "School of Names" label?

  *Follow-up:* If you argue they are coherent, does the *Zhiwu Lun* provide the bridge? Specifically, does the concept of *zhi* (pointer/reference) function as the universal in *Jianbai* and the naming of stuff in *White Horse*, or does it shift meanings between texts?

  4. **The *Zhiwu Lun* as Semantic Evidence**
  You treat the *Discourse on Referring to Things* as evidence that Gongsun Long's project was a deliberate semantic inquiry rather than a rhetorical display. However, the text is notoriously corrupt and obscure. On your reading, does *zhi* refer to the act of distinguishing stuff, or to the ontological referent itself? If *zhi* is the act, does that undermine the objective mereological reality you attribute to "white horse"? If it is the referent, how do you resolve the passage that suggests "things are not pointed to"?

  *Follow-up:* If you suggest the text argues that reference is inherently indeterminate, doesn't that weaken the claim that "White Horse" picks out a *specific* mereological sum distinct from "Horse"?

  5. **Xunzi's Charge of Political Corruption**
  Xunzi's *Rectification of Names* explicitly condemns this sort of distinction as confusing the fixed correspondence between names and things, thereby undermining the authority of the king to issue commands. If your rehabilitation is correct, and "White Horse is not Horse" is literally true within a coherent semantic system, does that vindicate Gongsun Long, or does it confirm Xunzi's worst fear? In other words, is the problem that Gongsun Long is *wrong*, or that his truth is socially unusable for the Confucian project of governance?

  *Follow-up:* If you argue it's socially unusable, does that concede that the "truth" of the claim is irrelevant to the Warring States context, effectively granting Xunzi the pragmatic victory even if you win the semantic argument?

  6. **Zhuangzi's Epistemic Critique**
  Zhuangzi dismisses these debates in the *Qiwulun* as "blurring the boundaries between right and wrong" and getting lost in the "slippery" nature of language. He suggests the disputers are failing to see the *Dao* because they are reifying distinctions. Does your mereological reading inadvertently prove Zhuangzi's point? By rigorously defining "white-stuff" and "horse-stuff" as distinct entities, is Gongsun Long doing exactly what Zhuangzi warns against: mistaking linguistic distinctions for ontological boundaries?

  *Follow-up:* If you argue Gongsun Long is actually exposing the limits of language (a Daoist-friendly reading), why does the text present the conclusion as a positive assertion of fact ("White Horse is not Horse") rather than a skeptical suspension of judgment?

  7. **The "Seeking a Horse" Passage and Pragmatics**
  In the dialogue, Gongsun Long argues that if one seeks a horse, a yellow or black horse will do, but if one seeks a white horse, a yellow or black one will not; therefore, white horse is not horse. This argument relies on the intensional context of "seeking." How does a mereological semantics handle intensional contexts? Does the "stuff" change depending on the seeker's intent, or is the mereological sum fixed regardless of the request?

  *Follow-up:* If the sum is fixed, then the "seeking" argument relies on pragmatics, not semantics. Does this imply the core paradox is actually about speech acts rather than the ontology of horse-stuff?

  8. **Historical Context: School or Circuit?**
  You frame this as a "deliberate semantic project." However, the *Shiji* and other sources frame the Disputers as itinerant rhetoricians selling their skills to lords. Is there any external evidence, beyond the internal coherence of the texts, that Gongsun Long had students or a curriculum? Or must we admit that even if the text *can* be read as serious semantics, its original function may have been performative brilliance designed to stun an audience rather than teach a theory?

  *Follow-up:* If it was performative, does that change how we should weigh the "literal truth" of the claim? Can a statement be literally true but philosophically frivolous in its original context?

  9. **Transitivity and the Hierarchy of Stuffs**
  In classical mereology, parthood is transitive. If "White Horse" is a part of "Horse" (as a subset of the stuff), and "Horse" is a part of "Animal," standard logic suggests "White Horse" is a part of "Animal." But Gongsun Long seems to block the inference that "White Horse is Horse." Does your reading require a non-transitive mereology? If so, are you importing a modern formal system that doesn't match the classical Chinese conceptual landscape, or do you find evidence of non-transitive reasoning elsewhere in the corpus?

  *Follow-up:* If you find evidence elsewhere, does that suggest the "logic" of the period was fundamentally different from Aristotelian class logic, making the "paradox" only a paradox for later readers imposing Western categories?

  10. **Falsification Conditions**
  Finally, to put your cards on the table: what specific philological or grammatical discovery would force you to abandon the mereological reading? Would it require finding a usage of "horse" with a plural marker that forces a count-noun reading? A parallel text where Gongsun Long explicitly affirms "White Horse is Horse"? Or would you concede the traditional verdict of "clever sophistry" only if we found definitive proof that the text was intended as a *reductio ad absurdum* of itself?

  *Follow-up:* (None; this is the closing question).
