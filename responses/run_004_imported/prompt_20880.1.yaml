          *   *Supervenience/Realization:* Thoughts depend on brains. Changing thoughts changes brains.
          *   *Levels of Explanation:* "Neurochemistry" and "Thoughts" are different languages describing the same event. Like software and hardware. You can debug the software without soldering the chip.
      *   **Clinical Implication:** Explain why the psychiatrist's view might be limiting. CBT and exposure therapy work *by* changing neural pathways through cognitive effort. The "thought" is the handle by which you grab the "neurochemistry."
      *   **Conclusion:** The debate *does* say something to them, but not what they think. It suggests the psychiatrist's framing is philosophically and scientifically outdated (Cartesian theater style thinking), even if the psychiatrist intends to be scientific.

