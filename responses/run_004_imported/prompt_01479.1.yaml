answer: |-
  The air in the Dome tasted of copper and wet soil. Elara sat before the console, her fingers hovering over the haptic sliders. The readout flickered: *CO2: 412 ppm. Temp: 24.1°C.*

  It was too high. The seedlings in Bay 4 were already curling at the edges, green turning to bruised purple. She needed to increase the scrubber output. But the scrubbers generated heat, and the heat skewed the sensors, and the sensors dictated the output.

  She began the calibration sequence. It was a ritual she had performed a thousand times, but today the numbers refused to settle. She input a correction factor to account for the thermal bloom of the scrubbers. The console whirred, processing. The fan kicked in.

  *Temp: 24.2°C.*

  The act of correcting the temperature had raised the temperature.

  Elara frowned. She typed a second correction, compensating for the heat generated by the first correction. The console whirred louder. The fans spun faster.

  *Temp: 24.3°C.*

  She felt a bead of sweat trace a path down her spine. She was part of the equation. Her body radiated heat. Her brain, burning glucose to solve the problem, added joules to the closed system. The console was not a window onto the world; it was a lamp shining back into the room it was trying to measure.

  She tried to isolate the variable. She wrote a script to model the thermal output of the console itself, intending to subtract that value from the sensor readings before applying the scrubber correction. She ran the model.

  The processors heated up. The model reported a higher thermal output than anticipated.

  She updated the model. The processors heated further. The sensor reading drifted to 24.4°C.

  Elara leaned back, breathing shallowly. Every breath added carbon dioxide. Every thought added heat. She was standing in a room trying to measure the room with a ruler that expanded when she touched it. To know the true state of the Dome, she would need to step outside it. But there was no outside. There was only the hull, the soil, the air, and her.

  The alarm chimed softly. *Bay 4 Humidity Critical.*

  She needed to act. But to act safely, she needed to know the outcome. To know the outcome, she needed a complete model. To have a complete model, she needed to include the modeler.

  She opened a new window and began to map her own intervention. She typed: *Operator heat load: 100 Watts.* She added it to the system state.

  But adding it changed the state. The console screen brightened to display the new line of code, drawing more power, generating more heat.

  She typed: *Display power consumption: 5 Watts.*

  The list grew. *Cooling fan efficiency degradation: 0.01%.* *Keyboard resistance: 0.5 Joules.*

  She was building a map of the territory, but the map was being drawn on the territory itself. The ink was wet and heavy, sinking into the ground it described. She tried to account for the weight of the ink.

  *Temp: 24.6°C.*

  The seedlings would die at 25.0°C. She had four tenths of a degree of headroom, and she was spending it on thinking about the headroom.

  She remembered the stories of the Founders, the ones who claimed they could optimize the system to perfection. They must have lied. Or perhaps they had died trying to finish the calculation. They wanted to be gods looking down from a mountain, but they were worms in the apple, eating the very flesh they tried to preserve.

  Elara stared at the cursor. It blinked, a steady, rhythmic pulse. *Wait. Calculate. Wait. Calculate.*

  If she stopped typing, the console would cool. The sensors would stabilize. But then she wouldn't have input the command to save the plants. If she typed the command, the heat would rise. If she didn't, the CO2 would rise.

  She needed to trust the system. But the system was her. She couldn't trust herself to be objective because her objectivity was a physical process consuming resources within the biased environment. She couldn't verify her own verification.

  A image flashed in her mind: a snake eating its tail. She was the snake. She was the tail. She was the hunger that drove the eating.

  *Temp: 24.7°C.*

  The leaves in Bay 4 were visibly drooping now in her mind's eye. She could see the cellular collapse, the failure of pressure.

  She realized then that certainty was a view from nowhere. It required a vantage point outside the system, a place where thought did not generate heat and observation did not disturb the observed. There was no such place. There was only here.

  To save the plants, she had to be willing to be wrong. She had to accept that her action would change the world in ways she could not predict, because the prediction itself was an action that changed the world.

  She highlighted the calibration script. It was beautiful, intricate, a cathedral of logic designed to account for every variable. It was also a heater.

  She pressed *Delete*.

  The screen went dark for a moment, then returned to the basic diagnostic view. The fans slowed. The hum of the console dropped an octave.

  *Temp: 24.5°C.*

  It dropped. The act of stopping the calculation cooled the room.

  She placed her hand on the manual override lever. It was cold steel, disconnected from the digital loop. There was no simulation here. No prediction. Just mechanics.

  If she pulled it, the scrubbers would engage at maximum. The temperature would spike. Maybe it would spike too high. Maybe the sensors were already drifted too far to know the true baseline. Maybe she would cook the seedlings instead of saving them.

  She couldn't know. She could never know. The knowledge was physically impossible to hold in her hand without it spilling over and changing the shape of what she held.

  She thought of her future self, an hour from now, looking at the results. Would that self condemn her? That self would be embedded in the same trap, judging a past action with a present mind that was also heating the room. There was no future judge who could stand on solid ground. There would only be another swimmer in the same water.

  Elara closed her eyes. She stopped trying to model the outcome. She stopped trying to be the system's master. She accepted that she was merely another organ of the Dome, like the scrubbers, like the plants, like the fungi in the soil. Her will was just another force of nature, blind and physical.

  She pulled the lever.

  The scrubbers roared to life. A gust of recycled air hit her face. The console lights flared red as the power draw spiked.

  *Temp: 24.8°C.*

  It climbed. She watched the number tick up. 24.9.

  She didn't type. She didn't calculate. She breathed.

  25.0.

  The alarm hardened its tone.

  24.9.

  The scrubbers were fighting the heat of their own activation. The system was oscillating, searching for a balance that didn't exist, only approximations.

  Elara kept her hand on the lever, feeling the vibration of the machinery running through her bones. She was inside the machine. The machine was inside the room. The room was inside her lungs.

  The number held at 24.9. Then dipped to 24.8.

  She didn't cheer. She didn't log the success. Logging it would generate heat. She simply sat in the dim light, listening to the air cycle, waiting for the next drift, knowing she would never be ready for it, knowing she would have to act anyway.

  The cursor blinked. *Wait. Calculate.*

  She turned the monitor off.
