answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Warren's. For the last decade, we co-taught a seminar on law and philosophy, which is a fancy way of saying we spent two hours a week arguing in front of twenty-year-olds and calling it pedagogy.

  When you've worked alongside someone for thirty years, you learn their rhythms. You learn their tells. And if you've ever clerked for Warren, you know there is one rhythm that is as reliable as the changing of the seasons. It usually happens during orientation week. Warren would lean back in his leather chair, look out at a room of bright-eyed, bushy-tailed law graduates, and deliver his judicial philosophy in exactly eight words.

  He'd quote Blaise Pascal: *"Justice without force is powerless; force without justice is tyrannical."*

  It's a great line. It's balanced, it's profound, and it sounds like something you'd want carved into the lintel of a courthouse. And for years, I watched Warren deliver it with a straight face. But there's a secret in this room. About a third of you know what happened next.

  Because Warren didn't stop at the quote. He'd always turn the page. He'd tell those clerks that Pascal didn't actually believe that line was the solution. He believed it was the problem. Pascal argued that laws aren't followed because they're inherently "just," but simply because they are established. He wrote that truth on one side of a river is error on the other. He suggested that if we admitted the whole system was basically just force with better public relations, the whole thing would collapse.

  Warren loved this part. I have never seen a man take such genuine delight in watching a twenty-two-year-old's face fall as they realize the law might be more about geography than morality. [Pause for laughter]

  Now, I know what some of you in the family are thinking. You're thinking, "Wait, is he saying Warren spent thirty years telling people the law is a sham?"

  And that is the miracle of Warren. Because for most people, realizing that justice is a human construct—a fragile, arbitrary thing we built to keep the dark at bay—would be an excuse to become cynical. It would be an excuse to say, "If it's all made up, why bother playing fair?"

  But Warren went the other way.

  He didn't treat the bench as a place where he dispensed divine truth. He treated it as a place where he held the line. He knew that "justice" doesn't exist in the stars. It exists in the room. It exists in the procedure. It exists in the scrupulous attention to the person standing in front of him.

  Because he knew the system was artificial, he respected it enough to maintain it with absolute integrity. He knew that if the force wasn't applied with fairness, it really *would* just be tyranny. He didn't pretend the river wasn't there; he just made damn sure that anyone who had to cross it got a fair shake on the bridge.

  There is a profound humility in that. It's easy to be a judge when you think you're a vessel for God's law. It is much harder to be a judge when you know you're just a person with a gavel, trying to make sure the force doesn't outpace the justice.

  Warren, you taught me that you don't need to believe in magic to believe in the ritual. You showed us that knowing the flaws in the foundation doesn't mean you stop building the house; it just means you check the load-bearing walls twice.

  So, I'd like to propose a toast.

  To Warren. Who knew that justice without force is powerless, but who also knew that force without kindness is just bullying. May your retirement be long, may your rivers be calm, and may you never have to explain the *Pensées* to a first-year clerk again unless you really want to.

  To Warren.
