prompt: |-
  I cover science and ideas for a living, but on the side I sit on the grievance panel for our freelancers' union, and we've got a case this week thats trickier than it looks. A freelancer pitched a detailed, well-sourced story on a de-extinction startup to an editor, got a vague "we'll pass for now," and four months later the outlet ran a near-identical piece in-house, with no payment or credit to her. She's calling it idea theft; the editor says ideas aren't property, only the writing is, which is true as a matter of copyright law but feels like a dodge. The panel votes next week: uphold the grievance and settle on some remedy (payment? a byline? something else?), or dismiss it outright. Can you draft the memo I'll bring, with an actual recommendation and reasoning, that takes seriously why swiping someone's idea feels like a genuine wrong even though an idea isn't the kind of thing you can fence off the way a house or a manuscript is?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Science/Ideas Writer & Freelancers' Union Grievance Panel Member.
      *   **Task:** Draft a memo for the grievance panel regarding a specific case.
      *   **The Case:** A freelancer pitched a detailed, well-sourced story on a de-extinction startup. Editor said "pass." Four months later, outlet ran a near-identical piece in-house (no pay, no credit).
      *   **The Conflict:** Freelancer claims "idea theft." Editor claims "ideas aren't property" (legally true under copyright, but ethically questionable).
      *   **Goal:** Provide a memo with an actual recommendation and reasoning. It needs to bridge the gap between legal technicality (copyright doesn't protect ideas) and ethical/professional norms (stealing ideas is wrong).
      *   **Tone:** Professional, persuasive, nuanced, empathetic to the freelancer but grounded in union logic/precedent.

  2.  **Deconstruct the Ethical/Legal Tension:**
      *   *Legal Reality:* Copyright protects expression, not ideas. You can't copyright the concept of "de-extincting a mammoth."
      *   *Professional Reality:* Journalism relies on trust. Pitching is a social contract. If editors can steal pitches with impunity, the freelance ecosystem collapses.
      *   *The "Near-Identical" Aspect:* This is crucial. If the outlet just wrote about de-extinction generally, it's weak. If they used the *same* sources, the *same* angle, the *same* structure, it's misappropriation of labor, even if the words are different.
      *   *The "Pass" Aspect:* The editor rejected it, then did it themselves. This implies bad faith.

  3.  **Determine the Recommendation:**
      *   *Dismissal:* Bad for morale, sets a terrible precedent, validates bad faith behavior.
      *   *Full Uphold (as if it were copyright infringement):* Legally shaky, might overreach union authority.
      *   *Middle Ground (Ethical Violation/Unfair Labor Practice):* This is the sweet spot. The union isn't a court of law, it's a body of professional standards. The recommendation should be for compensation (kill fee or full fee) and/or credit, based on *unfair labor practices* or *breach of good faith*, not copyright law.
      *   *Decision:* Uphold the grievance. Recommend full payment (as if commissioned) + byline if possible (though in-house pieces are tricky), or at minimum a kill fee + apology + policy change. Let's aim for Full Payment + Byline/Correction as the ideal remedy.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue and the recommendation.
      *   **Statement of Facts:** Neutral summary of what happened (Pitch -> Pass -> In-house piece).
      *   **The Core Tension (The "Why"):** Address the editor's legal argument vs. the ethical reality. This is the heart of the user's prompt. Need to articulate *why* idea theft matters.
          *   *Key argument:* Labor isn't just typing words; it's reporting, sourcing, and framing.
          *   *Key argument:* The "Social Contract" of pitching.
      *   **Precedent/Standards:** Reference industry standards (SPJ, ASJA, etc.) even if not legally binding.
      *   **Recommendation:** Specific remedy.
      *   **Reasoning:** Why this remedy fits.

  5.  **Refining the Argument (The "Philosophical" Bit):**
      *   The prompt asks to take seriously *why* swiping an idea feels like a wrong.
      *   *Analogy:* It's not about fencing off a thought; it's about appropriating the *labor of discovery*. The value isn't the noun (the idea); it's the verb (the reporting).
      *   *Trust:* If editors can do this, freelancers stop pitching exclusive scoops. It degrades the quality of journalism.

  6.  **Review and Polish:**
      *   *Tone Check:* Is it too aggressive? Too soft? Needs to be firm but reasonable.
      *   *Clarity:* Ensure the distinction between copyright law and union ethics is clear.
      *   *Actionable:* The panel needs to know what to vote on.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe ask for the article to be taken down.
      *   *Correction:* Too extreme. Outlets hate that. Focus on compensation and credit.
      *   *Initial thought:* Cite copyright law extensively.
      *   *Correction:* No, the editor is right on copyright. The union's power is *contractual* and *ethical*, not legal. Focus on "Good Faith" and "Unjust Enrichment."
      *   *Emphasis:* Highlight the "four months later" and "near-identical" details. That proves access to the pitch influenced the final piece.

  8.  **Final Polish:** Check the voice. It should sound like a colleague speaking to colleagues—professional, knowledgeable, but passionate about fairness. (Proceed to generate output based on these thoughts.)

  9.  *(Post-Drafting Review)*: Does this meet the user's specific constraint about explaining *why* it's a wrong even if ideas aren't property? Yes, the section on "The Labor of Discovery" addresses this directly.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Freelancers' Union Grievance Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Grievance #24-09 (Pitch Misappropriation)

  ### I. Executive Summary

  This memo concerns a grievance filed by a member (the "Grievant") against [Outlet Name]. The Grievant pitched a reported story on a specific de-extinction startup, providing a detailed outline and source list. The editor declined the pitch ("we'll pass for now"). Four months later, the Outlet published an in-house article covering the same startup, utilizing the same angle and sources, without compensating or crediting the Grievant.

  The Editor's defense rests on copyright law: ideas are not property; only expression is protected. While legally accurate, this defense ignores the ethical and economic realities of freelance journalism.

  **Recommendation:** I recommend the Panel **UPHOLD** the grievance. We should classify this as a violation of professional good faith and unjust enrichment of labor.
  **Remedy:** The Outlet should pay the Grievant the full agreed commission rate for the story (as if it had been assigned) and issue a correction adding the Grievant's byline or a prominent contributor note.

  ### II. Statement of Facts

  1.  **The Pitch:** On [Date], Grievant submitted a pitch including a specific narrative arc, a list of pre-vetted sources (including key scientists at the startup), and a unique framing of the de-extinction technology.
  2.  **The Response:** On [Date], the Editor responded, "We'll pass for now." No feedback was given regarding the angle or sources.
  3.  **The Publication:** On [Date + 4 months], the Outlet published "Inside the Race to Revive the Past," an in-house piece.
  4.  **The Overlap:** The published piece utilizes at least three of the specific sources named in the pitch and follows the identical narrative structure proposed by the Grievant.
  5.  **The Damage:** The Grievant received no compensation and no credit. The Outlet gained content value without incurring the cost of discovery.

  ### III. The Core Tension: Property vs. Labor

  The Editor's position relies on a strict interpretation of the Copyright Act. It is true that one cannot copyright the *concept* of de-extinction. If the legal question were solely about intellectual property infringement, the Editor would prevail.

  However, this Panel does not adjudicate copyright law; we adjudicate **fair labor practices and professional ethics.** To dismiss this grievance based on copyright technicalities is to misunderstand the value of journalistic labor.

  **1. The Labor of Discovery**
  In science journalism, the "idea" is not a lightbulb moment; it is the result of preliminary labor. The value the Grievant offered was not the noun (de-extinction), but the verb (reporting). She identified *which* startup was viable, *who* could speak on the record, and *how* the story should be framed. By using her pitch to bypass the legwork of sourcing and structuring, the Outlet appropriated her **labor of discovery**, not just her "idea."

  **2. The Social Contract of Pitching**
  The freelance ecosystem functions on an implicit contract: A freelancer invests time in developing a pitch in good faith, expecting that if the Outlet uses the fruit of that development, the freelancer is compensated. If Editors are permitted to reject a pitch and then execute it in-house using the pitch's roadmap, the pitching system collapses. Freelancers will withhold their best angles, degrading the quality of journalism available to the Outlet.

  **3. Bad Faith Indicators**
  The timeline creates a presumption of bad faith. A "pass" followed by identical execution four months later suggests the "pass" was not a rejection of the story, but a rejection of the *freelancer's claim to the story.* This is an unfair labor practice, even if it is not copyright infringement.

  ### IV. Precedent and Industry Standards

  While we are a union panel, we look to broader industry norms to define "fairness."
  *   **The ASJA (American Society of Journalists and Authors)** explicitly advises that if a publication kills a story but later publishes a similar piece based on the freelancer's reporting, the freelancer is owed compensation.
  *   **The SPJ (Society of Professional Journalists)** Code of Ethics emphasizes acting "honestly, fairly and courageously." Utilizing a freelancer's sourcing network after rejecting their pitch fails the fairness test.

  ### V. Recommendation and Remedy

  I urge the Panel to vote to **UPHOLD** the grievance. Dismissing this case sets a precedent that allows management to convert freelance R&D into in-house profit without cost.

  **Proposed Remedy:**
  1.  **Compensation:** The Outlet must pay the Grievant the full fee they would have paid had they commissioned the piece. This is not a "kill fee" (which implies the story wasn't run); this is a "usage fee." The Outlet *used* the reporting roadmap.
  2.  **Credit:** The Outlet must append a note to the digital version of the story: *"Reporting for this article was initiated based on a pitch by [Grievant Name]."* Ideally, they should add her as a co-byline, though we recognize editorial resistance to this. If they refuse the byline, the payment must be higher to reflect the lack of credit.
  3.  **Policy Change:** As part of the settlement, the Outlet should agree to a written policy regarding "Pitch Integrity," stating that if a pitched story is declined, the Outlet will not pursue the specific angle/sources internally for a period of 12 months without compensation.

  ### VI. Reasoning for the Panel

  We must distinguish between **protecting thoughts** and **protecting work.**

  We are not arguing that the Grievant owns the concept of bringing back extinct species. We are arguing that she owned the *specific pathway* to telling that story at that time. When the Editor read her pitch, they gained an advantage: they knew which sources were accessible, they knew the story was viable, and they knew the narrative hook.

  To allow the Outlet to use that advantage without payment is to allow them to steal **time.** The Grievant spent hours finding those sources and refining that angle. The Editor saved those hours by reading her email. That saved time has monetary value.

  If we dismiss this, we tell our membership that their preliminary reporting is worthless unless a contract is signed. This shifts all risk to the worker and all reward to the capital holder. It creates a "spec work" environment that the Union exists to prevent.

  The Editor is right about the law, but wrong about the work. We should rule based on the work.

  ### VII. Next Steps

  If the Panel agrees, I will draft the formal settlement offer to [Outlet Name] management, citing the Union's collective bargaining agreement regarding "Good Faith Negotiations" and "Unfair Labor Practices," rather than copyright law.

  Respectfully submitted,

  [Your Name]
  Grievance Panel Member
