answer: |-
  **MEMORANDUM**

  **TO:** IACUC Committee
  **FROM:** [Your Name], Senior Scientist Member
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Protocol Amendment [ID Number] – Optogenetic ICSS and Compulsive Seeking

  **Recommendation:** **Approve with Mandatory Modifications** (Return to PI for revision within 14 days).

  **Rationale:**

  I write to address the divergence in our committee regarding the welfare implications of unlimited intracranial self-stimulation (ICSS) of the ventral tegmental area (VTA). While I agree with the veterinary assessment that the *procedural* endpoints (weight loss, physical check) are standard, I find myself compelled by the minority faction's argument regarding the *interpretive* validity of those endpoints in this specific context.

  Having spent thirty years studying brainstem control, and having recently examined the parallels between biological reward systems and artificial agent reward functions, I believe we must confront a specific biological reality: this protocol does not merely encourage a behavior; it decouples the mechanism of "wanting" from the experience of "liking."

  **The "Wireheading" Problem in Biology**
  The minority faction correctly cites the Berridge and Robinson distinction between incentive salience ("wanting") and hedonic impact ("liking"). In standard behavioral assays, we assume an animal's vigorous pursuit of a resource correlates with positive welfare. However, optogenetic stimulation of dopaminergic neurons creates a "wireheading" scenario—terminology borrowed from AI safety, but describing a known neurobiological phenomenon. The agent (the mouse) is not pursuing a goal that improves its state; it is short-circuiting the signal that tracks goal achievement.

  In this state, the animal's continued nose-poking is not evidence of welfare. It is evidence of hijacked circuitry. An animal in this condition may neglect thermoregulation, social interaction, or predator avoidance not because it is "happy," but because the cost-benefit analysis has been pathologically skewed. To treat the animal's compulsive engagement as reassurance of its well-being is to commit a category error. We are engineering a model of addiction precisely by breaking the link between behavior and benefit.

  **Required Modifications:**
  Because the scientific goal is to model *compulsive* seeking despite negative consequences, we cannot rely on the animal's choice to stop as a humane endpoint. Therefore, approval is contingent upon the following additions to the protocol:

  1.  **Independent Welfare Assays:** The protocol must include welfare metrics that do not rely on the manipulated reward channel. I recommend adding daily scoring of nesting quality and social huddling (if group-housed) during "lights off" periods when stimulation is inactive. If the animal loses the capacity or motivation to engage in species-typical comfort behaviors outside the stimulation window, this must trigger intervention.
  2.  **Hard Limits on Continuous Access:** "Unlimited access" must be operationally defined with a safety ceiling. I propose a maximum stimulation duration per 24-hour period (e.g., no more than 6 hours of active stimulation time), enforced by software limits on the rig, to prevent total exhaustion before weight loss becomes apparent.
  3.  **Revised Humane Endpoints:** Weight loss is a lagging indicator. The protocol must include a "cessation of natural reward" endpoint. If the mouse fails to consume a minimum threshold of chow or water for 24 hours *despite free availability*, this constitutes a distinct endpoint from gross weight loss, signaling that the hijacking of the reward system has overridden homeostatic drives.

  **Conclusion:**
  We are not dealing with unfalsifiable philosophical speculation about animal minds. We are dealing with empirically established dissociations in neurobiology. If we induce a state where the animal cannot accurately signal its own distress through normal behavioral avoidance, the burden shifts to us to measure welfare externally.

  The scientific value of this model is undeniable, but we must not mistake the pathology we are creating for the animal's preference. I urge the committee to require these revisions to ensure we are studying addiction, rather than simply practicing it.

  **[Your Name/Signature]**
