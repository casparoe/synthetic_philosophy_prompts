answer: |-
  The Wrong Kind of Reasons (WKR) problem is widely treated as a technical hurdle for Fitting-Attitude (FA) analyses of value—a puzzle to be solved by refining the distinction between types of reasons. I argue that this optimism is misplaced. The WKR problem is not a peripheral embarrassment but a *reductio ad absurdum* of the core FA thesis. It demonstrates that the concept of a "reason for an attitude" is extensionally broader than the concept of "value," and that any attempt to narrow the former to match the latter inevitably relies on the prior, unanalyzed notion of value itself. Consequently, the FA project is viciously circular.

  To see why the problem is fatal, we must examine the failure of the most sophisticated attempt to solve it: the Object-Given/State-Given (OG/SG) distinction, and then consider what the structural parallel in epistemology reveals about the nature of normativity.

  ### The Collapse of the Object-Given/State-Given Distinction

  Derek Parfit's proposal attempts to solve the Demon Case by distinguishing between reasons grounded in properties of the *object* of the attitude (OG) and reasons grounded in properties of the *state* of having the attitude (SG). In the Demon Case, the threat of torture is a consequence of holding the attitude of admiration; it is not a property of the demon that makes him admirable (like his power or cunning, perhaps). Thus, Parfit argues, the threat provides a State-Given reason, which FA analysis can safely ignore. Only Object-Given reasons count toward value.

  However, this distinction collapses under scrutiny, a point forcefully argued by Mark Schroeder. The collapse occurs because almost any State-Given reason can be re-described as an Object-Given reason through relational properties.

  Consider the evil demon again. The reason to admire him is to avoid torture. Parfit classifies this as SG because the benefit (avoiding pain) is a consequence of the mental state. But where does the threat originate? It originates from the demon. Therefore, the demon possesses the property of *being dangerous to me unless admired*. This is a relational property of the demon himself. If I ask, "Why should I admire the demon?", the answer "Because he is dangerous" cites a property of the object. On the face of it, this is an Object-Given reason.

  To block this, the FA defender must refine the definition of OG reasons. They cannot simply say "properties of the object," because the demon's dangerousness is a property of the object. They must say, "properties of the object that are *relevant to the standard* of the attitude." In other words, the demon's power might be relevant to admiration, but his threat is not.

  Here lies the fatal circularity. What determines whether a property is "relevant to the standard" of admiration? It is precisely whether that property makes the object *admirable*. We are now defining the Right Kind of Reason (RKR) as "reasons provided by properties that make the object valuable." But the original goal of the FA analysis was to define *value* in terms of RKRs.
  *   **FA Thesis:** X is valuable iff there is an RKR to favor X.
  *   **OG/SG Fix:** An RKR is a reason grounded in a property that makes X valuable.

  The analysis has collapsed into: *X is valuable iff there is a reason to favor X grounded in properties that make X valuable.* This is tautological. It presupposes the very notion of value (or fittingness) it was supposed to analyze. If we cannot distinguish RKRs from WKRs without invoking the prior concept of value, then reasons cannot be the *foundation* of value. They are merely the *symptoms* of it.

  ### The Epistemic Parallel and the Unity of Normativity

  One might object that this is a localized problem in axiology, solvable by a better theory of reasons. However, the structurally identical problem in epistemology suggests the difficulty is a general feature of normative concepts, which further undermines the FA project.

  In epistemology, evidentialists distinguish between evidential reasons (truth-directed) and pragmatic reasons (benefit-directed), famously illustrated by Pascal's Wager. Pascal argues one has a reason to believe in God because it leads to infinite reward. Evidentialists reject this as a reason for *belief* (though it is a reason for *wanting to believe*).

  If the FA theorist appeals to this parallel, they face a dilemma regarding the unity of normativity:

  1.  **If normative reasons are unified:** Then the distinction between RKR and WKR in value theory must map onto the distinction between evidential and pragmatic reasons in epistemology. In epistemology, we have an independent anchor to make this cut: **Truth**. Evidential reasons are those that indicate the truth of the proposition; pragmatic reasons do not. We can distinguish them because we have a prior grasp of what belief is *for* (representing reality).
  2.  **If FA analysis is correct:** Value is *defined* by reasons. There is no independent anchor like "Truth." In the epistemic case, we don't define truth as "what we have evidence for"; we define evidence as "what indicates truth." But FA tries to define the "truth" of the axiological realm (value/fittingness) *as* "what we have reasons for."

  Without an independent anchor like Truth, the FA theorist cannot replicate the evidentialist's move. In epistemology, we know Pascal's wager is the "wrong kind" of reason because it doesn't track truth. In value theory, if we ask why the Demon's threat is the "wrong kind" of reason, the FA theorist cannot say "because it doesn't track value," because value *just is* having a reason.

  This reveals that the WKR problem arises because "reasons" are a coarser-grained normative category than "value." There are more reasons to have attitudes than there are valuable objects. To filter the reasons down to the valuable objects, you need a filter. In epistemology, the filter is Truth (independent of reasons). In FA analysis, the filter is supposed to be... reasons. But you cannot use the set to filter itself.

  ### The "Reason to Want" Dodge

  Some defenders retreat to the claim that the demon gives you a reason to *want* to admire, not to *admire*. This attempts to preserve the link between value and reasons for attitudes by denying the demon provides the latter.

  This fails for two reasons. First, it relies on a contentious psychology of control (that we cannot admire at will). If a agent *could* cultivate admiration at will to save the world, the threat would arguably become a direct reason to admire. The analysis of value should not hinge on the psychological limitations of human volition.

  Second, and more importantly, this move concedes the core point. If the demon gives a reason to *want* to admire, that desire is grounded in the *goodness* of the consequences (saving lives). This implicitly acknowledges that there is a value (the welfare of the victims) that generates the reason. It admits that reasons track values elsewhere, even if they don't make the demon valuable. This reinforces the view that value is the source of reasons, not the other way around. The FA analysis attempts to reverse this direction of fit, but the WKR problem shows the arrow of explanation points from Value to Reasons, not Reasons to Value.

  ### Conclusion: A Structural Impossibility

  The WKR problem is fatal because it exposes that FA analysis attempts to reduce a specific normative property (value/fittingness) to a general normative relation (reasons). The Demon Case proves that the extension of "reasons to favor" exceeds the extension of "valuable objects."

  To bridge this gap, the OG/SG distinction requires a prior criterion of relevance—a prior notion of fittingness. But if we possess a prior notion of fittingness sufficient to sort reasons, we do not need the FA analysis; we should simply analyze value in terms of fittingness directly. If we lack that prior notion, we cannot solve the WKR problem without circularity.

  The epistemic parallel confirms that this is not a fixable bug in value theory. It is a structural feature of normativity: pragmatic reasons (reasons to bring about a state) are distinct from constitutive reasons (reasons that define the state's correctness). Epistemology survives this because it anchors correctness in Truth. FA analysis fails because it tries to anchor correctness in Reasons, yet requires correctness to sort the Reasons.

  Therefore, the WKR problem is not a puzzle waiting for a clever solution. It is a signpost indicating that the road of Buck-Passing analysis leads back to where it started. Value cannot be analyzed away into reasons; it must be accepted as the primitive standard by which reasons are judged.
