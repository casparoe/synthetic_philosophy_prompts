answer: |-
  You have correctly identified one of the most persistent and frustrating category errors in popular science writing. Your intuition is sound: the claim that quantum computing "refutes" the Church-Turing thesis is, strictly speaking, false. It is the *Extended* Church-Turing thesis that is at stake.

  To help you write your feature with philosophical precision, here is a detailed comparison of the two theses, their epistemic statuses, and the specific impact of quantum mechanics.

  ### 1. The Original Church-Turing Thesis (CTT)
  **The Assertion:**
  The original thesis, formulated independently by Alonzo Church and Alan Turing in the 1930s, is a claim about **computability**, not efficiency. It asserts that any function on the natural numbers that is "effectively calculable" (i.e., can be computed by a human following a definite, mechanical method without insight or creativity) is computable by a Turing machine.

  **The Scope:**
  It draws a boundary around the *possible*. It asks: "Is there *any* procedure, regardless of how long it takes or how much memory it needs, that yields an answer?" If a Turing machine can do it, it is computable. If not (like the Halting Problem), it is uncomputable.

  **Epistemic Status:**
  This is where the philosophy gets dense, as you noted. Because "effective calculability" is an intuitive, informal notion, CTT cannot be a mathematical theorem in the standard sense (you cannot prove a formal statement about an informal concept).
  *   **The Carnapian View (Explication):** Many philosophers view CTT as a proposal for *explication*. We have a vague pre-theoretic concept ("what a human can calculate"), and Turing offered a precise surrogate (Turing computability). On this reading, CTT isn't "true" or "false" in an empirical sense; it is a successful (or unsuccessful) definition that we adopt because it captures our intuitions and proves mathematically robust.
  *   **The Kripkean View (Theorem):** Saul Kripke has argued a minority but rigorous position: that if one axiomatizes "algorithm" purely mathematically (without reference to physical humans or machines), CTT becomes a provable theorem. On this view, the equivalence between lambda calculus, recursive functions, and Turing machines is a mathematical necessity, not an empirical guess.
  *   **The Empirical View:** Some view it as a contingent fact about the human brain or the physical universe—i.e., "As a matter of fact, humans cannot compute more than Turing machines."

  **Quantum Impact:**
  **None.** A quantum computer is physically realizable using quantum gates, which can be simulated by a classical Turing machine (albeit slowly). A quantum computer cannot solve the Halting Problem. It cannot compute uncomputable functions. Therefore, the original CTT remains intact.

  ### 2. The Extended Church-Turing Thesis (ECTT)
  **The Assertion:**
  Also known as the Strong Church-Turing Thesis, this is a claim about **complexity**. It asserts that any computational problem that can be solved *efficiently* (in polynomial time) by a physically realizable device can also be solved *efficiently* by a probabilistic Turing machine (a classical computer with access to randomness), with at most polynomial overhead.

  **The Scope:**
  It draws a boundary around the *feasible*. It asks: "Can this be done in a reasonable amount of time?" It equates the class of physically tractable problems with the complexity class **BPP** (Bounded-error Probabilistic Polynomial time).

  **Epistemic Status:**
  This is a **falsifiable physical conjecture**. Unlike the original CTT, which bridges informal intuition and formal math, the ECTT bridges *physics* and *complexity theory*. It claims that the laws of physics do not allow for computational shortcuts that classical logic cannot mimic efficiently.
  *   It is not a definition.
  *   It is not a mathematical theorem.
  *   It is a claim about the computational power of our universe.

  **Quantum Impact:**
  **High.** This is the thesis quantum computing threatens. Shor's algorithm allows a quantum computer to factor integers in polynomial time (class **BQP**). The best known classical algorithms require super-polynomial (sub-exponential) time. If **BQP $\neq$ BPP** (which is the consensus among complexity theorists), then there are problems nature can solve efficiently that classical computers cannot simulate efficiently. This violates the "polynomial overhead" clause of the ECTT.

  ### 3. Relationship and Distinction
  The relationship is hierarchical but distinct.
  *   **CTT** is about the *set* of computable functions.
  *   **ECTT** is about the *resources* required to compute them.

  You can accept the original CTT (quantum computers compute only Turing-computable functions) while rejecting the ECTT (quantum computers compute them much faster). In fact, most computer scientists hold exactly this position.

  ### 4. The Verdict for Your Feature
  To answer your final question plainly: **Quantum computing endangers the Extended Church-Turing Thesis, not the original Church-Turing Thesis.**

  When journalists or hype-driven press releases claim quantum computers "break the Church-Turing thesis," they are engaging in metonymy. They mean the *Extended* thesis. However, using the shorthand is intellectually dishonest because it implies quantum computers can solve uncomputable problems (hypercomputation), which they cannot.

  **Suggested Phrasing for Your Article:**
  > "It is a common trope in tech journalism that quantum computers 'shatter' the Church-Turing thesis. This is philosophically imprecise. The original Church-Turing thesis concerns *what* is computable, drawing a line between the solvable and the unsolvable. Quantum computers respect that line; they cannot solve problems that are classically uncomputable.
  >
  > "What quantum computing actually challenges is the *Extended* Church-Turing thesis. This later conjecture claims that anything the physical universe can compute *efficiently*, a classical computer can also compute *efficiently*. If quantum processors achieve the exponential speedups theorists predict, they will prove that the universe allows for computational shortcuts that classical silicon can never mimic. They do not break the laws of logic; they merely reveal that the classical laws of complexity are not the final word on physical reality."

  ### Summary Table for Your Notes

  | Feature | Original Church-Turing Thesis (CTT) | Extended Church-Turing Thesis (ECTT) |
  | :--- | :--- | :--- |
  | **Core Question** | What is computable *at all*? | What is computable *efficiently*? |
  | **Formal Claim** | Effectively calculable $\subseteq$ Turing Computable | Physically Efficient $\subseteq$ Classically Efficient (Poly overhead) |
  | **Domain** | Computability Theory | Complexity Theory & Physics |
  | **Epistemic Status** | Definition / Explication / Mathematical Necessity | Falsifiable Physical Conjecture |
  | **Quantum Impact** | **None.** (Quantum $\subset$ Turing) | **Threatened.** (If BQP $\neq$ BPP) |
  | **Analogy** | "Can a car eventually reach the moon?" (No) | "Can a car reach the moon as fast as a rocket?" (No) |

  By making this distinction, your feature will demonstrate a sophistication that sets it apart from the standard "quantum magic" narrative. You are correctly identifying that the revolution is in *complexity*, not *computability*.
