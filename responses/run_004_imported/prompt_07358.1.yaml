answer: |-
  # The Physics of Wealth: Why Samuelson Was Wrong About Kelly

  The debate over the Kelly Criterion is one of the most enduring fissures in decision theory. On one side stand the growth optimists: John Kelly, Ed Thorp, and more recently, Ole Peters and the ergodicity economics crowd. They argue that maximizing the geometric growth rate of wealth is not merely a preference for those with logarithmic utility, but an objective requirement for rational agents operating in a multiplicative, non-ergodic world. On the other side stands the neoclassical establishment, led by Paul Samuelson and Robert Merton. They dismiss the "Kelly is rational" claim as a fallacy, arguing that probability-1 dominance at an infinite horizon is irrelevant for finite human lives, and that risk tolerance is a subjective preference, not a mathematical law.

  Samuelson mocked the Kelly proponents with a famous rebuttal written entirely in one-syllable words, reducing their complex arguments to a simple "betting too much" critique. He argued that expected utility theory (EUT) is the sole arbiter of rationality, and Kelly is just a specific case where utility happens to be logarithmic.

  This essay takes a side: **Samuelson is mathematically precise but ontologically wrong.** While he correctly identifies that utility functions are subjective, he fails to account for the physical constraints of time and compounding. The ergodicity argument deserves the privileged claim to rationality. Kelly optimality is not just a utility preference; it is the boundary condition for sustainable agency in a non-ergodic universe. To deviate from it without specific constraint is to accept guaranteed underperformance in the only reality that matters: the time average of a single life.

  ### The Samuelson Critique: Subjectivity and the Finite Horizon

  To understand why Samuelson's critique is seductive, we must grant it its due strength. Samuelson's core argument rests on two pillars: the subjectivity of risk and the irrelevance of infinity.

  First, Samuelson insists that rationality is defined by the maximization of expected utility, where utility is a personal function of wealth. If an agent's utility function is $U(W) = W^{0.5}$ (square root of wealth), then the Kelly bet (which maximizes $\ln W$) is mathematically suboptimal for them. They should bet less. To tell this agent they are "irrational" for not betting Kelly is to impose an external value judgment on their internal risk tolerance.

  Second, Samuelson attacks the "long run." The Kelly criterion guarantees that you will outperform any other strategy with probability 1 as time $t \to \infty$. But, Samuelson notes, we are all dead before $t = \infty$. In a finite horizon, a more aggressive strategy might have a higher probability of beating a specific benchmark, or a more conservative one might better protect a minimum consumption floor. Probability-1 dominance in the limit tells you nothing about the distribution of outcomes in year 10 or year 20. If Kelly involves a 50% drawdown in year 5 that forces you out of the market, its asymptotic superiority is a hollow victory.

  In this view, "geometric rationality" is a marketing term for log-utility. It dresses up a specific risk preference as a law of nature.

  ### The Ergodicity Defense: The Physics of Compounding

  The ergodicity argument, revitalized by Ole Peters, strikes at the foundation of Samuelson's framework. It posits that standard expected utility theory relies on an implicit assumption of **ergodicity**—the idea that the average outcome across an ensemble of parallel universes (the expectation value) is the same as the average outcome over time for a single agent.

  In additive environments (like a salary), this holds roughly true. In multiplicative environments (like investing), it is false. If you bet your entire bankroll on a positive expected value coin flip, the ensemble average wealth skyrockets. But the time-average wealth for a single agent goes to zero (ruin) because a single tails wipes you out. You cannot access the ensemble average; you can only live through one timeline.

  Therefore, the ergodicity camp argues, the "expectation value" used by Samuelson is a physical fiction for the individual investor. The only observable, relevant metric is the time-average growth rate. Maximizing this rate (Kelly) is not a preference; it is the mathematical requirement to avoid vanishing from the system.

  ### The Verdict: Why Kelly is Objectively Privileged

  Samuelson's critique fails because it treats wealth dynamics as a psychological game rather than a physical one. While it is true that utility is subjective, the **feasibility** of that utility is constrained by the dynamics of the system.

  Here is why the Kelly criterion deserves its special claim to rationality:

  **1. The Asymptote is Closer Than You Think**
  Samuelson's "finite horizon" objection relies on the assumption that the "long run" is a distant abstraction. In compounding systems, convergence is exponential. The divergence between a Kelly strategy and a non-Kelly strategy grows rapidly. A strategy that bets more than Kelly (over-leveraging) will almost surely underperform and eventually ruin the agent. A strategy that bets less than Kelly (under-leveraging) will almost surely end up with exponentially less wealth. While "infinity" is never reached, the gap becomes so large over a human investing lifetime (30-50 years) that the asymptotic argument becomes practically binding. To ignore it is to ignore the dominant force acting on your capital.

  **2. Kelly is the Efficiency Frontier, Not Just a Point**
  Samuelson frames Kelly as one utility function among many. But geometrically, Kelly represents the peak of the expected growth curve. Betting *more* than Kelly reduces growth *and* increases volatility. There is no rational trade-off there; it is simply error. Betting *less* than Kelly reduces growth *and* reduces volatility. This is the only rational deviation, and it is only rational if the agent has a specific liquidity constraint or consumption need (a finite horizon liability).
  However, in the absence of specific liabilities, choosing less growth for less volatility is a subjective preference, yes, but choosing *any* strategy that claims to offer *more* growth than Kelly is objectively impossible. Kelly sets the speed limit. Samuelson treats the speed limit as a suggestion; ergodicity treats it as a law of physics.

  **3. Ruin is an Absorbing State**
  Samuelson's expected utility framework often implicitly assumes that if you lose money, you can recover. But in real-world multiplicative processes, ruin (zero wealth) is an absorbing state. Once you hit zero, the game ends. The Kelly criterion is the unique strategy that maximizes growth while ensuring that the probability of ruin approaches zero (in continuous time) or is minimized (in discrete time).
  If rationality is defined as the ability to continue making decisions in the future, then avoiding ruin is a precondition for rationality. Since Kelly is the boundary of this safety zone, it holds a privileged status. You can choose to be more conservative than Kelly, but you cannot rationally choose to be more aggressive without accepting a negative growth rate in the long run.

  **4. The Circularity of "Risk Tolerance"**
  Samuelson argues that an agent can simply choose a utility function that reflects their risk tolerance. But where does this tolerance come from? If an agent chooses a utility function that implies betting 2x Kelly, they will go bust. If they choose 0.5x Kelly, they will be poorer than necessary. The ergodicity argument suggests that "risk tolerance" should not be an arbitrary parameter, but derived from the dynamics of the environment. In a non-ergodic world, the only rational risk tolerance is one that respects the geometric constraints of the system. To define utility in a way that ignores the time-average is to define a utility function that cannot be realized in reality.

  ### Conclusion

  Samuelson was right that you cannot force a logarithmic utility function on someone who values wealth differently. If an agent needs \$1 million in five years for a medical procedure, Kelly betting might be irresponsible. But this is a specific constraint, not a general theory of rationality.

  In the general case of wealth accumulation over a lifetime, Samuelson's critique is a category error. He treats the problem as one of **preference**, when it is fundamentally one of **physics**. The ergodicity economists have correctly identified that in a non-ergodic world, the ensemble average is a mirage. The time average is the only reality.

  Therefore, the Kelly criterion is not merely the optimal strategy for a log-utility maximizer. It is the optimal strategy for any agent who prefers more wealth to less and wishes to remain solvent. It is the unique solution that maximizes the rate of return without inviting certain ruin. To deviate from it is to accept a lower growth rate for no compensatory gain in safety (if over-betting) or to leave objective growth on the table (if under-betting).

  Samuelson argued that there is no "objective" rationality in investing. He was wrong. The mathematics of compounding imposes objective constraints on what is possible. Kelly optimality is the mathematical expression of those constraints. It is not just a preference; it is the shape of rationality in a multiplicative universe.
