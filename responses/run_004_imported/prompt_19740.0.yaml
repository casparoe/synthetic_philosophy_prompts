prompt: |-
  Please describe the most important implications of the likelihood principle for how my team should interpret an A/B test in which we checked the results every morning and stopped collecting data the moment the gap between the two variants first became significant at p < .05. I would like to understand, in particular, why some Bayesian statisticians treat this kind of "optional stopping" as evidence that p-values cannot be a coherent measure of evidence, and how that argument bears on the role that flexible stopping rules have played in debates over the replication crisis.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Core Topic:** The Likelihood Principle (LP) and its implications for A/B testing.
      *   **Specific Scenario:** "Peeking" or "Optional Stopping" (checking results every morning, stopping when $p < 0.05$).
      *   **Key Question 1:** Why do Bayesian statisticians view this as evidence that p-values are incoherent measures of evidence (based on the LP)?
      *   **Key Question 2:** How does this relate to the replication crisis and flexible stopping rules?
      *   **Target Audience:** A team interpreting A/B test results (needs practical advice mixed with theoretical depth).

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *What is the Likelihood Principle?* It states that all evidence in data regarding parameters is contained in the likelihood function. Two datasets yielding proportional likelihoods should lead to the same inference. Crucially, it implies the *stopping rule* is irrelevant to inference (once data is observed).
      *   *What is the Frequentist view (p-values)?* P-values depend on the sampling distribution, which depends on the *intention* to stop. If you peek, you inflate Type I error. The p-value calculation must adjust for the stopping rule.
      *   *What is the Bayesian view?* Bayes Factors/Posterior probabilities depend only on the likelihood and prior. Stopping rules are irrelevant (mostly).
      *   *The Conflict:* In the scenario described, the team used a frequentist metric ($p < 0.05$) but violated frequentist assumptions (optional stopping without correction). This leads to inflated false positives.
      *   *The LP Argument:* If LP holds, the stopping rule shouldn't matter. Since p-values *do* change based on stopping rules, p-values violate LP. Bayesians argue this makes p-values incoherent as measures of *evidence*.
      *   *Replication Crisis:* P-hacking, including optional stopping, is a major driver. Many published findings are false positives because researchers stopped when things looked significant.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the scenario. It's a classic case of "optional stopping" or "p-hacking." State the bottom line up front: The results are likely invalid under frequentist rules, but the *reason* why touches deep statistical philosophy (LP).

      *   **The Likelihood Principle (LP) Explained:**
          *   Define it simply: Evidence depends only on what happened (the data), not what *could* have happened (the sampling plan).
          *   Apply to scenario: The data collected is $X$. Whether you planned to collect $N$ or stop at significance shouldn't change the interpretation of $X$ *if* you follow LP.

      *   **The Frequentist (P-value) Violation:**
          *   Explain why p-values fail here. P-values calculate the probability of data *as extreme or more extreme* under the null.
          *   "More extreme" depends on the stopping rule. If you peek, the "sample space" changes.
          *   Result: The actual false positive rate is much higher than 5% (can be 20%+ depending on peeking frequency).
          *   *Implication for the team:* You cannot trust the $p < 0.05$ claim. It's inflated.

      *   **The Bayesian Critique (Coherence of Evidence):**
          *   This is the core theoretical request.
          *   Bayesians adhere to LP. For them, the stopping rule is irrelevant to the *strength of evidence* (Likelihood Ratio/Bayes Factor).
          *   Argument: If two researchers get the exact same data, but one planned to stop at $N=100$ and the other stopped at significance, Frequentism gives different p-values. Bayesianism gives the same posterior.
          *   Therefore, Bayesians argue p-values measure "behavior under repetition" (error rates), not "evidence in this specific dataset."
          *   *Key phrase:* "P-values are not measures of evidence."

      *   **Connection to the Replication Crisis:**
          *   Flexible stopping rules are a form of "Researcher Degrees of Freedom."
          *   Simmons, Nelson, & Simonsohn (2011) "False-Positive Psychology."
          *   When everyone peeks and stops, the literature fills with false positives.
