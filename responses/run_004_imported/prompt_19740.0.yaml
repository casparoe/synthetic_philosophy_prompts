answer: |-
  This is a critical question that sits at the intersection of statistical theory, business decision-making, and research integrity. The scenario you described—checking results daily and stopping the moment $p < 0.05$—is known as **optional stopping** (or "peeking").

  Under standard frequentist rules, this invalidates your p-value. However, your question asks for a deeper understanding based on the **Likelihood Principle (LP)**. Understanding the LP explains *why* this practice is controversial and why it fuels the replication crisis.

  Here is an analysis of the implications for your team, the Bayesian critique of p-values, and the connection to broader scientific reliability.

  ---

  ### 1. The Immediate Implication for Your Team
  **The Result is Invalid.**
  Before diving into theory, the practical implication is stark: **You cannot trust the conclusion of this A/B test.**

  By checking every morning and stopping at significance, you have inflated your Type I error rate (false positive rate). While you aimed for a 5% false positive rate, the actual probability that you declared a winner by pure chance is likely much higher (often 20% to 30%, depending on how many times you peeked).

  **Action:** Do not roll out the variant based on this test. You must either:
  1.  Discard the data and run a new test with a fixed sample size determined in advance.
  2.  Re-analyze the data using **sequential testing methods** (e.g., Alpha Spending functions) that mathematically correct for the peeking.
  3.  Re-analyze using a **Bayesian framework** with appropriate priors and stopping criteria (e.g., Region of Practical Equivalence).

  ---

  ### 2. The Likelihood Principle and the "Incoherence" of P-Values
  To understand why Bayesians view your stopping rule as evidence that p-values are flawed measures of *evidence*, we must define the Likelihood Principle.

  #### What is the Likelihood Principle?
  The Likelihood Principle states that **all the evidence** in a sample regarding an unknown parameter is contained in the **likelihood function**.
  *   **Implication 1:** Inference should depend only on the data that *actually occurred*.
  *   **Implication 2:** Inference should **not** depend on the experimental design or the **stopping rule** (i.e., what you *would have done* if the data had been different).

  #### The Conflict with P-Values
  In your scenario, imagine two teams run the exact same experiment.
  *   **Team A (Fixed):** Decides in advance to collect 10,000 users, then calculates a p-value.
  *   **Team B (Optional):** Checks daily and stops the moment $p < 0.05$.

  Suppose both teams stop at exactly 10,000 users with the exact same conversion rates. The **data** are identical. The **likelihood function** is identical.
  *   **According to the Likelihood Principle:** The evidence regarding which variant is better should be identical for both teams.
  *   **According to Frequentist P-Values:** The evidence is *different*. Team A's p-value is valid (assuming assumptions hold). Team B's p-value is invalid (inflated) because their "sample space" includes all the times they *could have stopped earlier*.

  #### The Bayesian Critique
  Bayesian statisticians argue that a measure of evidence should reflect the strength of the data at hand, not the researcher's intentions.
  *   **Coherence:** If the data are the same, the inference should be the same. Because p-values change based on the stopping rule (a matter of intention, not data), Bayesians argue p-values violate the Likelihood Principle.
  *   **Evidence vs. Error Rates:** Bayesians contend that p-values are not measures of *evidence* for a hypothesis; they are measures of *long-run error control* under a specific hypothetical repetition of the experiment.
  *   **The Verdict:** By treating a p-value as "strength of evidence" while using optional stopping, you are mixing frameworks. You are using a metric designed for long-run error control (frequentist) in a way that violates its own assumptions, while ignoring the metric (Bayesian/Likelihood) that actually accommodates flexible stopping.

  **For your team:** This means that if you want the flexibility to stop when you "see" a result, the p-value is the wrong tool. It is not coherent with the way you are collecting data.

  ---

  ### 3. Optional Stopping and the Replication Crisis
  The Likelihood Principle argument is not just philosophical; it is a primary driver of the **Replication Crisis** in science and tech.

  #### Researcher Degrees of Freedom
  Optional stopping is a form of "p-hacking" (specifically, exploiting researcher degrees of freedom). In the replication crisis, many published findings failed to reproduce because the original researchers used flexible stopping rules.
  *   **The Mechanism:** Noise in data fluctuates. In a continuous monitoring scenario, random noise will eventually cross the $p < 0.05$ threshold even if there is no true effect. By stopping the moment it crosses, you "lock in" the noise as a signal.
  *   **The Consequence:** The literature becomes filled with false positives. When other teams try to replicate the finding using a fixed sample size (proper frequentist design), the effect disappears.

  #### The "Significance Filter"
  The replication crisis highlights that p-values are often treated as a binary filter (Significant / Not Significant).
  *   When teams peek and stop, they bias the published effect sizes. This is known as the **Winner's Curse**. You only stop when the observed effect is large enough to overcome the significance threshold. Therefore, the estimated effect size in your test is likely an **overestimate** of the true effect.
  *   **Implication:** Even if your variant is truly better, your test likely exaggerates *how much* better it is. If you power future experiments based on this inflated effect size, you will be underpowered and likely fail.

  ---

  ### 4. Strategic Recommendations for Your Team
  Given the implications of the Likelihood Principle and the risks of optional stopping, here is how your team should proceed:

  #### A. Align Methodology with Intent
  *   **If you must peek:** You cannot use standard p-values. You must adopt **Sequential Testing** (e.g., Group Sequential Designs or Alpha Spending). These methods adjust the significance threshold at each peek to maintain the overall 5% error rate. This respects the frequentist need for error control while allowing flexibility.
  *   **If you want to measure evidence:** Switch to a **Bayesian A/B testing framework**. Bayesian posterior probabilities obey the Likelihood Principle. You can check the data every morning and stop when the probability that Variant B is better than Variant A exceeds a certain threshold (e.g., 95%), without inflating false discovery rates in the same way p-values do. *Note: You still need to be careful about priors and decision-theoretic loss functions.*

  #### B. Pre-Registration (Internal)
  Treat your A/B tests like clinical trials. Before launching:
  1.  Define the primary metric.
  2.  Define the minimum detectable effect.
  3.  **Calculate the required sample size.**
  4.  Commit to not analyzing the significance until that sample size is reached.

  #### C. Interpret "Significance" Correctly
  Educate stakeholders that $p < 0.05$ does not mean "there is a 95% chance this variant is better." It means "if there were no difference, we would see data this extreme 5% of the time."
  *   Because you peeked, that 5% is now meaningless.
  *   Emphasize **Effect Size and Confidence Intervals** over binary significance. Even if the test were valid, knowing the lift is 1% $\pm$ 0.5% is more valuable for business forecasting than knowing $p = 0.04$.

  ### Summary
  The Likelihood Principle teaches us that evidence resides in the data, not the experimental design. By using optional stopping with p-values, your team has utilized a metric that explicitly *requires* knowledge of the experimental design (the stopping rule) to be interpreted correctly, while simultaneously violating that design.

  Bayesians view this as incoherent because it makes the "evidence" dependent on the researcher's mind (intent to stop) rather than the world (the data). In the context of the replication crisis, this practice is a known engine of false positives. To restore integrity to your testing pipeline, you must either constrain your stopping rules to match your p-value calculations or switch to a statistical framework (like Bayesian inference or Sequential Testing) that mathematically accommodates the flexibility you require.
