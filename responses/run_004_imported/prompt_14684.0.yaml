answer: |-
  This is a fascinating question, but I must advise you that the premise of your argument contains a significant philosophical error that would likely be flagged by historians of philosophy and Sidgwick scholars.

  If you present Sidgwick's psychical research as a "separate, personal enthusiasm" distinct from his ethics based on the claim that he had already resolved the dualism of practical reason, your argument will not be defensible. In fact, the consensus among scholars is precisely the opposite: **Sidgwick's involvement with the SPR was directly motivated by his failure to resolve that dualism within his philosophical system.**

  Here is a breakdown of why this distinction matters and how you might reframe your narrative to be historically accurate and philosophically robust.

  ### 1. The Philosophical Correction: The Dualism Was Not Resolved
  In *The Methods of Ethics* (1874), Sidgwick identifies a conflict between **Rational Egoism** (it is rational to pursue one's own happiness) and **Rational Benevolence/Utilitarianism** (it is rational to pursue the general happiness).

  Sidgwick hoped to show that these two duties ultimately coincide. However, he famously concluded that human reason alone **could not prove** that they coincide. He called this the "dualism of practical reason." It remained the "fundamental contradiction" of his ethical system in every subsequent edition of the book until his death in 1900.

  Sidgwick wrote that unless one assumes a moral order of the universe (i.e., God and an afterlife where virtue is rewarded and vice punished), morality is not fully rational. If the virtuous suffer and the wicked prosper in this life, and there is no next life, then Rational Egoism defeats Rational Benevolence.

  ### 2. The Connection to the SPR
  Because Sidgwick could not resolve this dualism through pure logic or traditional theology, he turned to empirical investigation. This is the crucial link for your article.

  *   **The Problem:** Ethics requires a belief in a moral cosmic order (and usually survival after death) to make sense of the sacrifice egoism demands.
  *   **The Proposed Solution:** If science could prove the existence of telepathy or survival after death, it would provide the empirical evidence needed to support the theological premises his ethics required.
  *   **The Motivation:** Sidgwick did not join the Society for Psychical Research (SPR) merely as a hobbyist interested in ghosts. He joined as a philosopher seeking empirical data to shore up the foundations of utilitarianism. He hoped that if survival after death could be scientifically verified, the "dualism" could be resolved: duty and self-interest would coincide in the long run (across lifetimes).

  ### 3. Scholarly Consensus
  The definitive modern biography of Sidgwick, *Henry Sidgwick: Eye of the Universe* by Bart Schultz (2004), argues extensively that Sidgwick's psychical research was an extension of his philosophical project, not a departure from it.

  Similarly, philosopher Roger Crisp notes that Sidgwick's "need for a theological solution to the dualism of practical reason" was a primary driver for his interest in the SPR. To separate the two is to misunderstand Sidgwick's intellectual biography. He viewed the SPR as a serious scientific endeavor that could potentially solve the greatest crisis in modern moral philosophy.

  ### 4. Recommendation for Your Article
  Rather than drawing a line between his philosophy and his psychical research, your article would be much stronger if you presented them as **integrated**.

  **A defensible narrative arc would look like this:**
  1.  Sidgwick establishes the "dualism of practical reason" in 1874 as a crisis for ethics.
  2.  He realizes philosophy cannot solve it; it requires empirical evidence of a moral order (survival after death).
  3.  He co-founds the SPR in 1882 to subject these claims to scientific rigor, hoping to find the evidence that would validate the moral universe his ethics required.
  4.  Ultimately, the evidence remained inconclusive, leaving the dualism unresolved at his death, which adds a tragic or poignant dimension to his legacy.

  ### Summary
  If you argue that Sidgwick had "settled the technical argument" before 1882, historians of philosophy will view that as a misreading of *The Methods of Ethics*.

  However, if you argue that **the unresolved nature of his ethics drove him to the SPR**, you will have a much more compelling and accurate story. It transforms his psychical research from a quirky Victorian eccentricity into a desperate, rigorous attempt to save the rationality of morality itself. This makes for a richer historical narrative and aligns with current scholarship.
