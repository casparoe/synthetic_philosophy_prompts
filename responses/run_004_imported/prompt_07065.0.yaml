answer: |-
  This is a fantastic anecdote for your story because it cuts right to the heart of how humans actually process uncertainty versus how economic models say we *should*.

  To answer your friends' argument directly: **Friend 2 is right.** There is a profound psychological and mathematical difference between "known risk" and "unknown ambiguity," and treating them as the same thing is where the nurse's Expected Value (EV) calculation likely went off the rails.

  Here is the breakdown of why she isn't necessarily being irrational, the theory behind it, and how she should practically approach the decision.

  ### 1. Is she being irrational? (The Ellsberg Paradox)
  In classical economics (Expected Utility Theory), your Friend 1 is technically correct: if the mathematical expected value is the same, a rational actor should be indifferent. If she prefers the known risk, she is displaying "risk aversion."

  However, in behavioral economics, **Friend 2 is describing a documented phenomenon called "Ambiguity Aversion," best illustrated by the Ellsberg Paradox.**

  In the 1960s, economist Daniel Ellsberg proved that people consistently prefer to bet on an urn with known odds (50 red balls, 50 black balls) over an urn with unknown odds (100 balls, ratio unknown), even if the statistical probability of winning is identical.

  **Why?** Because in the real world, "unknown odds" are often a signal of hidden danger. If a casino won't tell you the odds of a slot machine, you assume the machine is rigged against you. In an evolutionary context, ambiguity often signaled predators or poison. Therefore, treating ambiguity as "worse" than known risk is actually an **adaptive heuristic**, not a bug in her brain. She isn't being irrational; she is being prudent.

  ### 2. The Case for "Unknown Odds" Being Worse (Knightian Uncertainty)
  There is a strong case for treating Hospital B as objectively riskier than Hospital A, regardless of her feelings. This is known as **Knightian Uncertainty** (named after Frank Knight).

  *   **Hospital A is "Risk":** The probability distribution is known (20% layoff rate). She can insure against this (e.g., by saving 20% of her income for 18 months).
  *   **Hospital B is "Uncertainty":** The probability distribution is unknown. You cannot calculate Expected Value here.

  **The Flaw in Her Math:**
  She told you she "ran the math" on the startup. This is almost certainly an illusion. To calculate Expected Value, you need two inputs: *Payoff* and *Probability*.
  *   At Hospital A, the probability is data-driven (historical layoffs).
  *   At Hospital B, the probability is a guess.

  If she assigns a 50% chance of success to the startup to make the math work, she is engaging in **subjective probability**. She is dressing up a guess as a statistic. In finance, this is called "Garbage In, Garbage Out." The EV calculation for the startup is meaningless because the input variable (odds of survival) is unknowable.

  **The "Worst-Case" Asymmetry:**
  *   **Hospital A Worst Case:** She gets laid off. She has a resume from a known hospital, likely gets severance, and can apply to other hospitals.
  *   **Hospital B Worst Case:** The startup folds. Severance funds vanish. The brand name means nothing to future employers. She has a gap in her resume and the stigma of a "failed venture."

  The *downside tail risk* at Hospital B is likely fatter than at Hospital A, even if the *upside* is also higher.

  ### 3. Practical Advice: What should she do?
  If you were advising her (or wrapping up your story with a takeaway), here is the framework she should use instead of a flawed EV calculation.

  **A. Demand an "Ambiguity Premium"**
  If Hospital B wants her to accept unknown odds, they must pay her a premium for taking that uncertainty. Since they can't offer job security, they need to offer:
  *   Higher base salary (not just potential bonuses).
  *   A signing bonus that acts as a personal severance package.
  *   Equity that vests immediately (not over 4 years).
  *   *Advice:* If the startup says "we can't pay more now but you'll get promoted later," that is a red flag. It means they want her to subsidize their risk for free.

  **B. Assess Personal Runway (The Sleep Test)**
  Ambiguity tolerance is not a personality trait; it is a function of **financial runway**.
  *   If she has 6 months of savings and no dependents, ambiguity is an adventure.
  *   If she has a mortgage, kids, or limited savings, ambiguity is a threat.
  *   *Advice:* She should not look at the job odds; she should look at her bank account. If Hospital B failing would ruin her life, Hospital A is the only rational choice, regardless of the "expected value."

  **C. The Regret Minimization Framework**
  Ask her to project forward 5 years.
  *   **Scenario 1:** She stays at A, gets laid off in 18 months. Does she think, "I knew this would happen, but I tried to stay safe"?
  *   **Scenario 2:** She goes to B, it folds in 12 months. Does she think, "I was stupid to trust a ship with no captain"?
  *   *Advice:* Most people find the regret of *ignorance* (B) more painful than the regret of *misfortune* (A).

  ### The Verdict for Your Story
  Your source is experiencing **Ambiguity Aversion**, and it is a rational response to an environment where information is asymmetric. The founders of the startup know more than they are telling, or they are deluded; either way, the nurse is on the outside of the information loop.

  **The Punchline:**
  Tell your readers that "calculating the odds" is a trap when the odds are made up. We often pretend we are making mathematical decisions when we are actually making **trust** decisions.

  *   At Hospital A, she is betting on **statistics**.
  *   At Hospital B, she is betting on **people**.

  If she doesn't trust the founders enough to give her a straight answer on survival odds, she shouldn't trust them with her career. Her gut isn't dressed up as a reason; her gut is recognizing that in the absence of data, the only data point left is the silence of the recruiters.

  **Recommendation:** Unless Hospital B pays her a massive premium to offset the ambiguity, **Hospital A is the rational choice.** Not because it's safer, but because the risks are *hedgeable*. You can hedge a 20% layoff risk; you cannot hedge a mystery.
