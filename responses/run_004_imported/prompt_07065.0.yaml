          2.  Is there a case for treating "unknown odds" as worse than "known mediocre odds"?
          3.  Practically speaking, what should she do?

  2.  **Deconstruct the Psychological/Economic Concepts:**
      *   **Risk vs. Ambiguity:** This is the core distinction.
          *   *Risk:* Probabilities are known (Hospital A: 20% chance).
          *   *Ambiguity (Uncertainty):* Probabilities are unknown (Hospital B: ?% chance).
      *   **The Ellsberg Paradox:** This is the classic economic experiment that directly addresses Friend 2's point. People prefer known risks over unknown ambiguities, even if the mathematical expectation is the same. This suggests it's *not* irrational in a behavioral sense, though it violates strict Expected Utility Theory.
      *   **Knightian Uncertainty:** Frank Knight's distinction between measurable uncertainty (risk) and unmeasurable uncertainty (true uncertainty).
      *   **Ambiguity Aversion:** The psychological preference for known risks over unknown risks.
      *   **Expected Value (EV) Limitations:** EV assumes linear utility of money/outcomes. For a nurse, losing a job isn't just a financial loss; it's stress, gap in resume, potential loss of license continuity, etc. The *utility* function is likely non-linear (loss aversion).
      *   **Information Asymmetry:** In the startup case, the founders *might* know more than they are saying, or they might be deluded. The lack of data is itself a data point (signal of instability).

  3.  **Address Question 1: Is she being irrational?**
      *   *Strict Economic Rationality (Expected Utility Theory):* Technically, yes, if the EV is truly equal.
      *   *Behavioral Rationality:* No. Ambiguity aversion is a robust, documented human trait. It's an adaptive heuristic. In the wild, unknown risks often hide predators or pitfalls.
