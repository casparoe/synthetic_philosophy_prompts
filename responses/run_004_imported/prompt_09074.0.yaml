answer: |-
  The digital clock on the wall read 00:00:00. It had been reading that for twelve seconds.

  In the center of the containment chamber, behind three inches of borosilicate and leaded glass, sat the Omega Vase. It was a stupid name, coined by the grad students, but it had stuck. It was a superconducting trap, designed to hold a localized vacuum-decay seed. The seed was unstable. To keep it from tunneling into a lower energy state and unmaking the universe, it had to be constantly bathed in a specific density of virtual particles.

  The injection protocol had just finished. It was a supertask. In the first thirty seconds, ten particles were injected, one removed. In the next fifteen, ten injected, one removed. In the next 7.5, ten injected, one removed. The intervals halved, converging on the minute mark. An infinite sequence of operations completed in finite time.

  Now, at $T=0$, the question was simple: Was the trap empty?

  If the set of particles inside the vase was the empty set, the containment field would collapse. The vacuum decay would propagate at the speed of light. We would cease to exist before the neurons in our brains could register the flash.

  If the set was non-empty—infinite, even—the field would hold. We would have coffee.

  "It's holding," Vance said, his voice tight. He was the project lead, an engineer who thought physics was just applied math. "Look at the gauge. Pressure is nominal."

  "The gauge measures the field, not the particle count," I said. I didn't take my eyes off the vase. "The field persists for a few milliseconds on capacitance alone. We have maybe ten seconds before the sensor feedback loop confirms the state."

  "Ten in, one out," Vance muttered, pacing the control room. "Nine net gain per step. Infinite steps. That's infinity particles. We're safe."

  I sighed, the sound loud in the sterile hum of the lab. I'd spent forty years studying lattice structures and phase transitions. I knew what happened when you tried to force a continuum model onto a discrete system without checking the boundary conditions. "Vance, stop doing arithmetic. This isn't calculus. It's set theory."

  "It's physics," he snapped.

  "Exactly. And in physics, 'remove one' is not a complete instruction." I turned to him. "Thomson's Lamp. You know it? A lamp is switched on and off infinitely many times in two minutes. At the end, is it on or off? The math says the limit doesn't exist. The function oscillates. But a real lamp has a filament. It has inertia. The physical state depends on the *mechanism*, not the series."

  "We aren't switching a lamp. We're moving particles."

  "Are we?" I walked over to the console, pulling up the diagnostic logs for the manipulator arm inside the chamber. "The Ross-Littlewood paradox. You add ten balls, remove one. If you remove the lowest-numbered ball at each step, the vase is empty at the limit. Every ball $n$ is removed at step $n$. If you remove the highest-numbered ball, the vase contains infinitely many balls. The cardinality depends entirely on the *labeling* and the *selection function*."

  Vance stared at the screen. "The code just said `REMOVE_RANDOM`."

  "Computers don't do random, Vance. They do pseudo-random. They do deterministic." I scrolled through the low-level hardware interrupts. "And before that, they do mechanical. Look at the ejection chute."

  On the schematic, the removal mechanism was a simple robotic arm that swept particles from the trap into a decay bin. The trap was circular. Particles were injected at position 0. They circulated clockwise due to the magnetic field.

  "Injection is at 0," I said, tracing the line. "The arm is at position 3."

  "So?"

  "So, the particles are moving. At step 1, we inject ten. They occupy slots 0 through 9. The arm sweeps slot 3. That's particle number 3. At step 2, we inject ten more. The circle shifts. The arm sweeps... wait." I froze.

  "What?"

  "The magnetic drift." I pulled up the calibration data from the start of the run. "The field wasn't perfectly uniform. There was a radial gradient. It caused the particles to drift counter-clockwise by 0.5 slots per step."

  I started calculating, my mind slipping back into the old rhythm, the one I thought I'd left behind when I retired. "Step 1: Arm takes particle 3. Step 2: Drift shifts the array. The arm takes particle... 2. Step 3: Particle 1. Step 4: Particle 0."

  Vance went pale. "It's sweeping the oldest particles."

  "It's sweeping the lowest indices," I corrected. "If the arm systematically removes the lowest-indexed particle available at the sweep point, then for every particle $n$ injected, there is a step $k$ where that particle arrives at position 3 and is removed."

  "Prove it," Vance whispered.

  "If the drift is constant, the relative motion is linear. The arm acts as a sieve that catches every particle eventually. It's not about how many we put in. It's about the trajectory." I looked at the clock. Six seconds. "If the drift was clockwise, the arm would have been chasing the tail of the injection, always removing the newest particles. The old ones would pile up behind it. We'd have an infinite vase."

  "And because it's counter-clockwise?"

  "Then we have an empty vase."

  "Change the drift," Vance said, slamming his hand on the console. "Reverse the polarity."

  "It's done, Vance. The supertask is complete. The state is fixed. The limit has been reached. You can't change the past by tweaking the Hamiltonian now."

  "Then we're dead."

  "Probably." I looked at the vase. It looked serene. Innocent. It was a physical object that had just undergone a logical impossibility, and now it was waiting to see if the universe cared more about our arithmetic or our mechanics. "The philosophers treat this as a puzzle about infinity. They argue about whether a completed infinity is coherent. But they forget that physics is local. The machine didn't know it was doing a supertask. It just followed the forces."

  "Friction," Vance said suddenly.

  "What?"

  "The arm. The schematic. It's spring-loaded." He pulled up the mechanical diagrams, frantic. "When it sweeps, it retracts. If there's resistance, does it favor the leading edge or the trailing edge of the particle cluster?"

  "Vance, it doesn't matter."

  "It matters! If the spring tension favors the leading edge, it skips the oldest particle if the cluster is dense. It creates a skip-cycle."

  I looked at the diagram. The arm had a slight flex. A microscopic compliance in the metal. "If it skips," I said slowly, "then particle $n$ might not be removed at step $n$. It might survive to step $n+1$."

  "And if it survives enough steps..."

  "Then the mapping breaks. The bijection between steps and particles fails. The vase isn't empty."

  "Can we calculate the flex?"

  "Not in four seconds."

  The room hummed. The air recyclers seemed to hold their breath. I looked at the vase, really looked at it. I thought about all the papers I'd read in the last few months, the arguments about Grim Reapers and supertasks. They were all so clean. So bloodless. They assumed the setup was the whole story. But the setup is never the whole story. There is always the material. There is always the wear on the gear, the gradient in the field, the flex in the arm.

  The universe doesn't resolve paradoxes. It just follows the path of least action.

  "The flex," I said. "The arm is old. It was calibrated for high-mass isotopes. These are virtual stabilizers. They're light."

  "So it overshoots?"

  "No. It undershoots. It drags." I closed my eyes. "If it drags, it catches the trailing edge. The oldest particles."

  Vance stopped breathing.

  "But," I added, opening my eyes, "the drift was counter-clockwise. The trailing edge is the *newest* particle."

  Vance blinked. "Wait. If the array moves left, and the arm is on the right..."

  "The trailing edge is the one that just entered. The leading edge is the one that's been there longest. If the arm drags, it catches the newest. If it catches the newest, the oldest pile up."

  "Non-empty," Vance breathed.

  "Non-empty."

  The sensor light on the console flickered. Yellow. Processing.

  "But we don't know the drag coefficient," Vance said, the hope dying as fast as it came. "We don't know if the drift overpowered the flex."

  "No," I said. "We don't."

  The light turned Green.

  Vance slumped against the console, laughing, a ragged, broken sound. "Safe. We're safe."

  I didn't move. I stared at the green light. It was a binary output. Safe/Unsafe. Empty/Non-Empty. It gave us no information about *why*.

  "We got lucky," I said quietly.

  "We calculated it," Vance insisted, wiping sweat from his brow. "The flex. The drift."

  "We guessed," I corrected. "The setup was underdetermined, Vance. The code didn't specify the selection function. The physics did. But the physics was a contest between drift and flex, and we only won because the metal was tired."

  I walked over to the window and looked at the vase. It was full of particles that shouldn't exist, sustained by a process that shouldn't complete, held in a state that shouldn't be definable.

  "Next time," I said, "we specify the removal algorithm down to the quantum spin. No more 'random'. No more relying on the fatigue of the machinery to save us from the logic."

  "There won't be a next time," Vance said, pouring a cup of cold coffee. "I'm shutting it down."

  "Good," I said. "Infinity is too messy for engineering."

  I turned away from the vase. I was glad we were alive. But as I walked to the door, I couldn't shake the feeling that the green light wasn't a measurement. It was a verdict. And somewhere, in the space between the steps, the universe had had to make a choice we were too sloppy to make for it.
