prompt: |-
  I'm on the search committee for my philosophy department's tenure-track opening in philosophy of mind. Our strongest finalist works on integrated information theory: her job talk defended IIT's causal-structure account of consciousness against the 'unfolding argument' and argued that deriving the theory from phenomenological axioms is a virtue, not the liability critics take it to be. Several senior colleagues want to rank her below our second finalist -- a philosopher of neuroscience uncommitted to any single theory of consciousness. Their reasoning: IIT was publicly branded pseudoscience in a widely covered 2023 open letter signed by well over a hundred consciousness researchers, timed to get ahead of adversarial-collaboration results some read as partly vindicating the theory, and a decades-long hire built on it is a bad bet against the field's own verdict. Others on the committee think deferring to a letter-writing campaign is exactly what a philosophy department shouldn't do, and that the demarcation question is one we're better placed than most to adjudicate on the merits. I need to circulate a memo before Monday's full-department vote recommending how to rank the two finalists: it should reach a specific recommendation, and it should treat the pseudoscience charge seriously enough to say what would actually have to be true of her work for it to count as a good reason to rank her lower, rather than waving the charge away or letting it settle the matter by itself.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a search committee for a philosophy department tenure-track opening in philosophy of mind.
      *   **Task:** Circulate a memo to the full department before a vote on ranking two finalists.
      *   **Finalist A (IIT Proponent):** Works on Integrated Information Theory (IIT). Defended it against the "unfolding argument." Argues deriving IIT from phenomenological axioms is a virtue.
      *   **Finalist B (Neuroscience Philosopher):** Philosopher of neuroscience, uncommitted to a single theory of consciousness.
      *   **Conflict:** Senior colleagues want to rank A lower because IIT was branded "pseudoscience" in a 2023 open letter (signed by 100+ researchers). They see hiring based on IIT as a "bad bet." Others argue philosophy shouldn't defer to letter campaigns and should adjudicate demarcation on merits.
      *   **Requirements for the Memo:**
          *   Reach a *specific recommendation* (Rank A over B, B over A, or equal).
          *   Treat the "pseudoscience" charge seriously (don't wave it away, don't let it settle the matter alone).
          *   Define what would have to be true of her work for the charge to be a valid reason to rank her lower.
          *   Tone: Professional, academic, balanced, persuasive, suitable for a philosophy department.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Rank B over A):* This aligns with the senior colleagues' risk-aversion. However, the prompt implies the user wants to navigate the *philosophical* integrity of the decision. Ranking B solely because of the letter might be seen as capitulating to sociological pressure rather than philosophical merit.
      *   *Option 2 (Rank A over B):* This aligns with the "philosophy shouldn't defer" crowd. It values theoretical boldness and the specific philosophical contributions (axiomatic derivation, causal structure) over empirical consensus. Given this is a *philosophy* hire (not a neuroscience hire), prioritizing philosophical rigor and argumentation over empirical betting seems more aligned with disciplinary values.
      *   *Option 3 (Equal/No Preference):* Safe, but the prompt asks for a "specific recommendation."
      *   *Decision:* I will recommend ranking **Finalist A (the IIT proponent) higher**. Why? Because for a *philosophy* department, the quality of argumentation, conceptual clarity, and engagement with foundational questions (even if the empirical theory is controversial) is often more valuable than safe neutrality. The memo needs to argue that the "pseudoscience" label is an empirical/sociological claim that doesn't necessarily negate philosophical contribution, *provided* certain criteria are met. This allows me to treat the charge seriously without letting it veto the candidate.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (ranking recommendation) and the two candidates (anonymized or described by focus).
      *   **The Core Issue:** Acknowledge the controversy surrounding IIT and the 2023 open letter.
      *   **Evaluating the "Pseudoscience" Charge:** This is the crucial section. I need to define criteria for when a philosophical defense of a controversial scientific theory becomes philosophically untenable.
          *   Does she ignore counter-evidence?
          *   Is the theory unfalsifiable in principle?
          *   Does the philosophical work rely on the *truth* of IIT or the *coherence* of IIT?
      *   **Assessment of Finalist A:** Apply the criteria. Her work focuses on causal structure and axiomatic derivation (philosophical tasks). She engages with objections (unfolding argument).
      *   **Assessment of Finalist B:** Acknowledge strengths (breadth, safety) but note potential lack of distinctive theoretical voice.
      *   **Conclusion/Recommendation:** Rank A over B based on philosophical depth and the department's role in conceptual adjudication.

  4.  **Refining the Argument (The "Serious Treatment" Requirement):**
      *   I cannot just say "Ignore the letter." I must say: "If her work exhibited characteristics X, Y, and Z, the letter would be relevant. However, her work exhibits P, Q, and R."
      *   *Characteristics that would justify lowering rank:* Dogmatism, ignoring falsification conditions, conflating normative axioms with empirical facts without bridge principles, insulation from critique.
      *   *Characteristics of her actual work:* Defending against specific arguments (unfolding), clarifying axiomatic status (virtue not liability), engaging with causal metaphysics.
      *   *Key Distinction:* Philosophy of mind vs. Neuroscience. A neuroscientist needs IIT to be true to do their job. A philosopher needs IIT to be *interesting/coherent/rich* to do their job.

  5.  **Drafting - Tone and Nuance:**
      *   Avoid attacking the senior colleagues. Acknowledge their concern is about departmental reputation and hire longevity.
      *   Avoid attacking the 2023 letter signatories. Acknowledge their scientific standing.
      *   Focus on the *nature of philosophical inquiry*.
      *   Use phrases like "demarcation problem," "theoretical risk," "conceptual clarity."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I make a specific recommendation? Yes (Rank A > B).
      *   *Check:* Did I treat the pseudoscience charge seriously? Yes, by outlining conditions under which it *would* matter.
      *   *Check:* Is it appropriate for a Monday vote? Yes, concise and actionable.
      *   *Check:* Is the distinction between philosophy and science clear? Yes, emphasizing that philosophers analyze theories even if they turn out false (e.g., Cartesian dualism, logical behaviorism).

  7.  **Final Polish:** Ensure the distinction between the "truth of IIT" and the "philosophical value of working on IIT" is sharp. (This is the crux of the argument).

  *(Self-Correction Note)*: I need to be careful not to endorse IIT as *true*. I must endorse the *philosophical work* done on it. The memo should reflect that a philosopher can do excellent work on a theory that turns out to be empirically false (just as we study Descartes or Kant despite empirical errors).

  8.  **Finalizing the Text:** (Proceed to generate output based on these thoughts).

      *   *Subject:* Search Committee Recommendation: Philosophy of Mind TT Hire
      *   *Recommendation:* Rank Finalist A (IIT) > Finalist B (Neuro/General).
      *   *Rationale:* Philosophical rigor > Empirical consensus for this specific role.
      *   *Addressing the Letter:* Define when scientific controversy impacts philosophical hiring (dogmatism vs. analysis). Show A falls in the latter.

  9.  **Final Review against constraints:**
      *   Specific recommendation? Yes.
      *   Treat pseudoscience charge seriously? Yes.
      *   Say what would have to be true to lower rank? Yes.
      *   Tone? Professional memo.

  (Proceed to write.)
answer: |-
  **MEMORANDUM**

  **TO:** Department of Philosophy Faculty
  **FROM:** [Your Name], Search Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Ranking of Philosophy of Mind Finalists

  As we prepare for Monday's departmental vote, I am writing to offer a specific recommendation regarding the ranking of our two final candidates for the tenure-track position in philosophy of mind.

  **Recommendation:** I recommend we rank **Finalist A (the IIT specialist)** above **Finalist B (the philosopher of neuroscience).**

  I offer this recommendation with full awareness of the controversy surrounding Integrated Information Theory (IIT) and the 2023 open letter signed by over 100 consciousness researchers branding the theory pseudoscientific. I believe the concerns raised by our senior colleagues regarding the longevity and reputation of the hire are legitimate. However, I argue that deferring to the open letter in this context misconstrues the role of a philosopher of mind relative to the role of an empirical scientist.

  To treat the "pseudoscience" charge seriously, we must specify what would have to be true of Finalist A's work for it to constitute a valid reason to rank her lower. I propose the following criteria:

  1.  **Insulation from Critique:** If her work demonstrated a dogmatic refusal to engage with empirical counter-evidence or treated IIT as immune to falsification.
  2.  **Category Errors:** If her philosophical arguments relied on conflating normative phenomenological axioms with empirical claims without offering bridge principles.
  3.  **Lack of Conceptual Yield:** If the work produced no philosophical insights independent of the theory's empirical truth (i.e., if the work is worthless *should IIT turn out to be false*).

  In evaluating Finalist A's dossier and job talk, I find she does not meet these negative criteria. Conversely, her work demonstrates the specific philosophical virtues we should prioritize in this hire.

  **1. The Distinction Between Scientific and Philosophical Risk**
  Our senior colleagues are correct that hiring a neuroscientist to work exclusively on a falsified theory is a poor investment. However, the history of philosophy of mind is populated by scholars who did rigorous work on theories that were later empirically abandoned or significantly revised (e.g., logical behaviorism, identity theory, or even aspects of Cartesian dualism). The value of a philosopher is not betting on the winning empirical theory, but in clarifying the conceptual structure, coherence, and implications of competing theories.

  Finalist A's job talk did not merely advocate for IIT as dogma; it defended the *causal-structure account* against the "unfolding argument." This is a metaphysical and logical defense, not merely an empirical one. Furthermore, her argument that deriving the theory from phenomenological axioms is a virtue addresses a foundational methodological question in consciousness studies. Even if IIT is empirically false, her clarification of the relationship between phenomenology and causal structure remains a valuable philosophical contribution.

  **2. Adjudicating the Demarcation Question**
  The 2023 open letter is a sociological and scientific signal, not a philosophical verdict. The letter argues that IIT lacks empirical support and makes questionable predictions. It does not, and cannot, argue that the *conceptual analysis* of IIT is philosophically bankrupt.

  As a philosophy department, we are uniquely positioned to adjudicate the demarcation question on the merits of argumentation rather than consensus. If we lower Finalist A's rank solely based on the letter, we are effectively outsourcing our philosophical judgment to a coalition of empirical scientists. While we should respect their data, we should not let their consensus dictate our hiring standards for *philosophical* rigor. Finalist A engages with the criticisms seriously; she does not ignore them. This intellectual honesty mitigates the risk of hiring a "pseudoscientist."

  **3. Comparison with Finalist B**
  Finalist B is a strong candidate with a safe profile. Their uncommitted stance on consciousness theories minimizes departmental risk. However, this comes at the cost of theoretical distinctiveness. In a tenure-track hire, we are looking for a research trajectory that will define the candidate for the next decade. Finalist A has a clearer, more ambitious theoretical voice. Finalist B's breadth is an asset, but Finalist A's depth offers a higher ceiling for philosophical impact, regardless of the empirical fate of IIT.

  **Conclusion**
  If Finalist A's work were dogmatic, unfalsifiable, or devoid of insights independent of IIT's truth, the pseudoscience charge would be grounds to rank her lower. Since her work is argumentative, engages with objections, and yields conceptual insights regarding causation and phenomenology that survive the theory's potential falsification, the 2023 letter should not determine our ranking.

  We should hire the philosopher who does the most rigorous philosophy, not the one who backs the most currently popular science. I urge the department to rank Finalist A first.

  I am available to discuss this further before Monday's vote.
