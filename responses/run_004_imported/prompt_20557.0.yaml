  2.  **Deconstruct the Voting Logic (The "Paradox"):**
      *   This is a classic example of the *Ostrogorski Paradox* (or a variant of the Discursive Dilemma/Doctrinal Paradox in social choice theory).
      *   *Premise:* Approval requires $C_1 \land C_2 \land C_3$ (Condition 1 AND Condition 2 AND Condition 3).
      *   *Voters:* $V_1, V_2, V_3$.
      *   *Votes:*
          *   $V_1$: Yes on $C_1$, No on $C_2$, Yes on $C_3$. (Overall: No, because $C_2$ failed for them).
          *   $V_2$: Yes on $C_1$, Yes on $C_2$, No on $C_3$. (Overall: No, because $C_3$ failed for them).
          *   $V_3$: No on $C_1$, Yes on $C_2$, Yes on $C_3$. (Overall: No, because $C_1$ failed for them).
      *   *Aggregate by Issue:* $C_1$ (2-1 Yes), $C_2$ (2-1 Yes), $C_3$ (2-1 Yes). $\rightarrow$ Project Approved.
      *   *Aggregate by Outcome:* $V_1$ (No), $V_2$ (No), $V_3$ (No). $\rightarrow$ Project Rejected.
      *   *The Core Tension:* Premise-based voting (issue-by-issue) vs. Conclusion-based voting (outcome-by-outcome).

