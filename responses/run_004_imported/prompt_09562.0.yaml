      *   *Point 4: Equivalence of Models.* A scenario modeled as group selection (trait groups) can often be mathematically equivalent to individual selection with context-dependent fitness (neighborhood models). If two models predict the same trajectory but attribute causality differently, the causal attribution is underdetermined.

