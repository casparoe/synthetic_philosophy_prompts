answer: |-
  **Title:** The Perspectival Nature of Trait-Group Partitions: A Deflationary Critique of Sober and Wilson

  **Introduction**

  The multi-level Price equation offers a formal decomposition of evolutionary change into within-group and between-group components:
  $$ \bar{w}\Delta \bar{z} = Cov(Z_j, W_j) + E[Cov(z_{ij}, w_{ij})] $$
  where the first term represents between-group selection and the second represents within-group selection. As you have noted, the standard objection to using this equation to identify units of selection is the "arbitrariness of partitioning": an analyst can manipulate the grouping variable to load the covariance onto either term at will, rendering the distinction biologically vacuous.

  Sober and Wilson (1998) attempt to resolve this by imposing a biological constraint: partitions must correspond to **trait groups**. A trait group is defined not by the analyst's convenience, but by the scope of social interactions that determine fitness. If individual $i$'s fitness depends on the phenotypic composition of the set $G$ to which it belongs, then $G$ is a trait group. Sober and Wilson argue that this anchors the Price equation in causal reality, making claims like "trait $X$ evolved via group selection" observer-independent facts.

  I argue that this defense fails to secure ontological realism about group selection. Even granting the trait-group restriction, the decomposition remains sensitive to modeling choices regarding boundary conditions, interaction networks, and causal granularity. Consequently, "group selection" claims remain perspectival redescriptions of individual-level causal processes structured by population viscosity, rather than reports of a distinct causal force. This argument proceeds on three fronts: the indeterminacy of trait-group boundaries, the multiplicity of overlapping interaction networks, and the distinction between covariance partitioning and causal mechanism.

  **1. The Indeterminacy of Trait-Group Boundaries**

  Sober and Wilson's restriction assumes that "trait groups" are discrete, natural units akin to organisms. However, in most biological contexts relevant to the units-of-selection debate (e.g., microbial biofilms, viscous plant populations, or dispersing vertebrates), social interactions do not occur within binary, all-or-nothing boundaries. Instead, the probability and intensity of interaction decay continuously over spatial or social distance.

  To apply the Price equation, the analyst must convert this continuous field of interaction probabilities into a discrete partition. One must decide: Does the trait group include only immediate neighbors? Does it extend to the second order of interaction? Does it encompass the whole deme if there is any non-zero probability of interaction?

  Consider a population where fitness effects decay exponentially with distance. An analyst drawing the trait-group boundary at 1 meter might find a high $Cov(Z_j, W_j)$ (strong group selection), because groups are homogeneous and distinct. An analyst drawing the boundary at 5 meters might find a near-zero $Cov(Z_j, W_j)$ (weak group selection), because the groups now overlap significantly in fitness effects, washing out between-group variance.

  Both analysts are adhering to the "trait-group" restriction: both are grouping individuals based on the purview of phenotypic effects. Yet, they arrive at different quantitative assessments of the "strength" of group selection. If the magnitude of the group-selection term depends on where the analyst draws the threshold on a continuous interaction gradient, then the claim "selection occurred at the group level" is not a unique fact about the world. It is relative to the *scale* of the model. The trait-group restriction eliminates *arbitrary* partitions (e.g., grouping by color), but it does not eliminate *underdetermined* partitions. The boundary remains a modeling choice, and the causal attribution shifts with that choice.

  **2. The Multiplicity of Overlapping Interaction Networks**

  A second, more structural problem arises from the fact that individuals are typically embedded in multiple, non-nested interaction networks simultaneously. An individual may interact with spatial neighbors (resource competition), kin (altruism), and mating partners (sexual selection). Each of these networks constitutes a valid "trait group" under Sober and Wilson's definition, as phenotypic effects flow through all of them.

  However, these networks rarely align perfectly. A spatial neighborhood may contain non-kin; a kin group may be spatially dispersed. If we partition the population by spatial trait groups, the Price equation might indicate strong between-group selection. If we partition the *same* evolutionary episode by kin-based trait groups, the equation might indicate that the between-group variance is negligible, with the change driven entirely by within-group kin selection (or vice versa).

  Sober and Wilson often treat "group selection" and "kin selection" as conceptually distinct, yet mathematically overlapping. However, if the goal is to identify an observer-independent causal fact, we face a dilemma: Which trait group is the *real* unit of selection?
  *   If we say "both," we dilute the explanatory power of the claim.
  *   If we say "one," we must provide a principle for prioritizing one interaction network over another.

  No such principle exists in the general theory. The choice of which trait-group structure to prioritize in the Price equation is driven by the specific hypothesis the researcher is testing (e.g., "Is spatial structure sufficient?" vs. "Is genetic relatedness required?"). Therefore, the resulting decomposition reflects the *question asked* rather than the *process alone*. The causal process is the totality of all interactions; the partitioning into "group" vs. "individual" selection is a heuristic device to isolate specific pathways within that totality. To reify one partition as *the* causal story is to mistake the map for the territory.

  **3. Covariance vs. Causal Mechanism**

  Finally, even if we could identify a unique, discrete trait group, the Price equation itself is a covariance accounting identity, not a causal model. It partitions the *change* in trait frequency, not the *cause* of that change.

  Sober and Wilson argue that a positive $Cov(Z_j, W_j)$ indicates that group properties are causally efficacious. However, a deflationary view notes that group properties are supervenient on individual properties. The "fitness of the group" ($W_j$) is nothing over and above the aggregate fitness of the individuals within it. The "average trait of the group" ($Z_j$) is nothing over and above the average of individual traits.

  When the Price equation attributes change to the between-group term, it is noting that individuals with trait $z$ tended to be in groups with high average fitness. But *why* were those groups fit? The causal machinery is always located in the physiological and behavioral interactions of the constituent individuals. The "group" does not act; the individuals act within a structured context.

  By restricting partitions to trait groups, Sober and Wilson ensure that the covariance tracks actual interactions. But this only ensures that the *correlation* is biologically real, not that the *causal attribution* is unique. A scenario modeled as "group selection" (between-group covariance) is often mathematically equivalent to a scenario modeled as "individual selection with context-dependent fitness" (within-group covariance with a specific fitness function).

  If two models are predictively equivalent and mathematically transformable into one another, but one posits "group selection" and the other "individual selection," then the choice between them is pragmatic, not ontological. The trait-group restriction ensures the model is biologically plausible, but it does not break the symmetry between the multi-level interpretation and the single-level contextual interpretation. To claim that the multi-level interpretation reveals the "true" causal fact is to assert that the covariance decomposition maps 1:1 onto causal mechanisms, which the formalism does not guarantee.

  **Conclusion**

  Sober and Wilson's trait-group restriction is a necessary correction to the crude arbitrariness of early Price equation applications. It prevents analysts from finding "group selection" in random noise. However, it is insufficient to establish group selection as an observer-independent causal fact.

  Because interaction boundaries are often gradients rather than cliffs, because individuals inhabit multiple overlapping interaction networks, and because covariance partitions do not uniquely identify causal mechanisms, the decomposition of selection remains sensitive to modeling choices. The claim "trait $X$ evolved because of group selection" should therefore be understood deflationarily: it is a statement that a *trait-group partition* provides a parsimonious or illuminating description of the evolutionary dynamics relative to a specific research interest. It is a valid description of the population's trajectory, but it is not a unique disclosure of the causal engine driving it. The causal engine is the network of individual interactions; "group selection" is merely one way of drawing boxes around those interactions.
