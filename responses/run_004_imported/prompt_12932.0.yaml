      *   *Key phrase for Skeptic:* "Pragmatic consequences don't dictate epistemic norms."
      *   *The Turn:* Bayes admits the money is a proxy. Skeptic asks if we can drop the proxy.

  6.  **Final Polish:** Check pacing. Ensure the philosophical terms (credences, axioms, bridge premise, epistemic vs. pragmatic) are used correctly but naturally. Make sure the ending lands on the specific prompt requirement about "theater."

  **(Self-Correction Note):** I need to make sure Bayes doesn't just say "Credences *are* betting quotients" because that's the Vulnerability Objection which the Skeptic will crush. Bayes needs to argue that the *vulnerability* reveals the *incoherence*, regardless of whether bets are placed.

  7.  **Final Review against constraints:**
