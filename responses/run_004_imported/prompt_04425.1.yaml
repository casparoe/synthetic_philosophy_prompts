prompt: |-
  For a piece on the limits of expected-value reasoning, I've been digging into the long-running dispute over the Kelly criterion. The Kelly rule — stake the fraction of your bankroll that maximizes the expected logarithm of wealth — is usually defended on the grounds that it maximizes long-run growth with probability one, but Paul Samuelson called this reasoning a "fallacy" and underlined his scorn by later writing an entire journal article in one-syllable words, insisting that log-utility betting is just one arbitrary preference dressed up as a mathematical law. The "ergodicity economics" reply associated with Ole Peters tries to rescue Kelly on different grounds: ordinary expected-value reasoning, it says, quietly assumes time averages equal ensemble averages, an assumption that fails once wealth compounds, so a bettor who actually lives through repeated rounds ought to use geometric rather than arithmetic averaging as a fact about the dynamics, not a matter of taste. More recently, Scott Garrabrant has generalized this into a broader "geometric rationality," extending geometric-expectation maximization to cases like Nash bargaining and Bayesian updating, while explicitly conceding that doing so means giving up the independence axiom behind ordinary expected-utility theory. Write an essay adjudicating this dispute: does the ergodicity argument actually make geometric-growth maximization non-optional for an agent facing repeated multiplicative bets, rather than merely one defensible utility function among others, and does whatever answer you reach carry over to the domains geometric rationality has been extended to, or does it stay confined to compounding wealth? Weigh the strongest arguments on each side, but end by defending a specific verdict rather than surveying them.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** The limits of expected-value (EV) reasoning, specifically focusing on the Kelly criterion dispute.
      *   **Key Players/Arguments:**
          *   *Kelly Criterion:* Maximize expected log wealth (geometric growth).
          *   *Paul Samuelson:* Criticized Kelly as a "fallacy." Log-utility is just a preference, not a law. (Famous one-syllable article).
          *   *Ole Peters (Ergodicity Economics):* EV assumes time averages = ensemble averages. In compounding wealth, they diverge. Time averages dictate geometric growth as a physical necessity, not a preference.
          *   *Scott Garrabrant (Geometric Rationality):* Generalizes geometric expectation to bargaining, Bayesian updating, etc. Admits this violates the independence axiom of von Neumann-Morgenstern (VNM) expected utility theory.
      *   **Task:** Write an essay adjudicating the dispute.
      *   **Key Questions to Answer:**
          1.  Does the ergodicity argument make geometric-growth maximization *non-optional* (objective) for repeated multiplicative bets, or is it still just a utility function (subjective)?
          2.  Does this conclusion carry over to other domains (bargaining, belief updating), or is it confined to compounding wealth?
      *   **Constraint:** Weigh arguments but *end by defending a specific verdict* (no fence-sitting).

  2.  **Initial Brainstorming & Position Formulation:**
      *   *Samuelson's Point:* In a single bet, maximizing EV and maximizing Expected Log Wealth (ELW) give different answers. If I only bet once, Kelly might tell me to bet less than EV maximization. Samuelson says if you prefer EV, that's fine. It's about risk aversion.
      *   *Peters' Point:* The world isn't a single bet. It's a sequence. If you bet repeatedly and reinvest, the "ensemble average" (what happens to 1 million people once) is irrelevant to *you* (one person a million times). The time average growth rate is the objective physical reality of the trajectory. If you maximize arithmetic EV in a multiplicative game, you go bankrupt with probability 1. Therefore, Kelly isn't a preference; it's survival.
      *   *Garrabrant's Point:* Let's take the math of geometric means and apply it elsewhere. It looks like Nash Bargaining. It looks like Bayesian updates (multiplying likelihoods). This suggests a deeper structure of rationality beyond VNM.
      *   *My Verdict:* I need to choose.
          *   *Option A:* Samuelson is right. It's all utility. Ergodicity just changes the payoff structure, not the rationality criterion.
          *   *Option B:* Peters is right. In multiplicative dynamics, geometric growth is objectively required for persistence.
          *   *Option C (Nuanced):* Peters is right about the *wealth* domain (it's non-optional for survival/persistence), but Garrabrant overextends. The "non-optional" nature relies on the physical constraint of non-negative wealth and reinvestment. In bargaining or belief, the "compounding" mechanism is metaphorical, not physical.
      *   *Refining the Verdict:* I think the strongest position is that Peters successfully rescues Kelly from Samuelson's "fallacy" charge *within the specific context of non-ergodic multiplicative dynamics*, making it a requirement for *persistence* rather than a preference. However, Garrabrant's generalization is insightful but category-errors the "non-optional" status. Geometric rationality in bargaining/belief is a powerful *analogy* or *normative framework*, but it lacks the physical compulsion of bankruptcy found in wealth dynamics. So, the ergodicity argument makes Kelly non-optional for wealth, but geometric rationality remains a choice elsewhere.
      *   *Wait, let's push harder.* Is it truly non-optional? If I want to maximize the chance of beating a specific benchmark, or if I have outside income, Kelly isn't strictly optimal. But for an isolated agent seeking to maximize long-term capital *without ruin*, it is. The prompt asks if it makes it non-optional *for an agent facing repeated multiplicative bets*. Yes, if the goal is to avoid vanishing.
      *   *Better Verdict:* The ergodicity argument succeeds in reclassifying Kelly from a "risk preference" to a "dynamic necessity" *within compounding systems*. However, this necessity does not cleanly transfer to Garrabrant's broader domains because they lack the same ergodicity-breaking physical constraints. The verdict: Peters is right about wealth; Samuelson is right about the rest (it's preference/axiomatic); Garrabrant bridges them but conflates physical dynamics with normative coherence.
      *   *Actually, let's go bolder.* The prompt asks me to defend a specific verdict. I will argue that the ergodicity argument *does* make geometric maximization non-optional for compounding wealth (Peters wins against Samuelson here), but that Garrabrant's extension is where the real insight lies, even if the "non-optional" claim weakens. No, that's wishy-washy.
      *   *Final Decision:* I will argue that the ergodicity critique fundamentally dismantles Samuelson's objection *for multiplicative processes*, rendering geometric maximization a requirement of physical consistency rather than psychological preference. However, this objective status *fails* to carry over to Garrabrant's broader geometric rationality. In bargaining and belief, we return to the realm of axioms and preferences. The "law" is local to non-ergodic dynamics.

  3.  **Outline:**
      *   **Introduction:** Set the stage. The Kelly criterion vs. Expected Value. Samuelson's scorn (the "fallacy"). The stakes: Is rationality subjective (utility) or objective (physics of growth)?
      *   **The Samuelson Position:** Expected Utility Theory (VNM). Risk aversion is a preference. Log-utility is just one curve. The "fallacy" is thinking long-run performance dictates single-shot rationality.
      *   **The Ergodicity Rebuttal (Peters):** Distinguish ensemble vs. time averages. In multiplicative dynamics, the ensemble average (EV) diverges from the time average (growth rate). Maximizing EV leads to ruin (absorption at zero). Therefore, geometric growth is a condition of *continuing to exist*, not a taste.
      *   **Adjudication (Wealth Domain):** Who wins? Peters. Samuelson treats wealth as additive or ignores the path. In reality, wealth is multiplicative and non-ergodic. If you vanish, you can't utility maximize. Thus, Kelly is non-optional for persistence.
      *   **Geometric Rationality (Garrabrant):** Extending the math to bargaining and belief. Multiplicative updates. Violating Independence Axiom.
      *   **Adjudication (Generalization):** Does the "non-optional" status hold? No. Beliefs don't go bankrupt in the same physical way. Bargaining solutions are normative, not dynamic necessities. The "physics" is missing.
      *   **Conclusion/Verdict:** The ergodicity argument saves Kelly from being "mere preference" in finance, turning it into a dynamic constraint. But this is a local truth. Geometric rationality elsewhere is a compelling normative analogy, not a physical law. Samuelson was wrong about the money, but right that utility is ultimately about the agent's goals—unless the goal is simply *to remain in the game*.

  4.  **Drafting - Section by Section:**
