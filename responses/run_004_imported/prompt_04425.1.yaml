answer: |-
  The dispute over the Kelly criterion is often framed as a technical disagreement about portfolio optimization, but at its core, it is a philosophical battle over the nature of rationality itself. On one side stands the orthodox expected-utility tradition, epitomized by Paul Samuelson, which views the maximization of expected value (or any specific utility function) as a matter of subjective preference. On the other stands the ergodicity economics of Ole Peters, which argues that in a world of compounding dynamics, geometric growth is not a preference but a physical necessity. More recently, Scott Garrabrant has attempted to generalize this insight into a "geometric rationality" applicable to bargaining and belief. To adjudicate this dispute, we must determine whether the ergodicity argument successfully reclassifies the Kelly criterion from a subjective taste to an objective constraint, and whether that reclassification survives the transition from wealth dynamics to broader domains of reasoning.

  Paul Samuelson's dismissal of the Kelly criterion was scathing precisely because he viewed it as a category error. In the von Neumann-Morgenstern (VNM) framework, rationality is defined by consistency among axioms, chiefly the independence axiom. If an agent prefers bet A to bet B, they should prefer a mixture of A and C to the same mixture of B and C. The Kelly bettor, who maximizes the expected logarithm of wealth, frequently violates this axiom when compared to an expected-value maximizer. Samuelson argued that choosing log-wealth over linear wealth is merely choosing a specific curvature for one's utility function—a measure of risk aversion. To claim that Kelly is "objectively" superior because it performs better in the long run is, in Samuelson's view, a "fallacy." He insisted that the long run is just a sequence of short runs; if a bet is irrational today (because it doesn't maximize your specific utility), it remains irrational tomorrow, regardless of how many times you repeat it. For Samuelson, rationality is internal coherence, not external survival.

  Ole Peters' ergodicity argument strikes at the foundation of Samuelson's position by challenging the implicit assumption that ensemble averages equal time averages. In additive systems (like a casino where you bet a fixed dollar amount and keep winnings in your pocket), the average outcome across a million parallel universes (ensemble) is the same as the average outcome for one person playing a million times (time). In multiplicative systems (where you reinvest your bankroll), these averages diverge radically. Consider a coin flip that gains 50% on heads and loses 40% on tails. The arithmetic expected value is positive (+5%), suggesting you should bet aggressively. However, the geometric time-average growth rate is negative. If you bet your whole bankroll repeatedly, you will almost certainly go to zero, regardless of the positive ensemble expectation.

  Peters contends that Samuelson's "fallacy" charge ignores the physics of the trajectory. An agent is a single trajectory through time, not an ensemble of parallel selves. If the dynamic is multiplicative and non-ergodic, maximizing arithmetic expected value leads to absorption at zero (bankruptcy). Once at zero, the game ends. Therefore, maximizing the geometric growth rate is not a expression of risk aversion; it is a condition for *persistence*. It is the mathematical requirement for an agent to remain in the system long enough to have preferences at all. In this specific context, the ergodicity argument succeeds: geometric-growth maximization is non-optional for any agent whose goal is to avoid vanishing from the process. Samuelson treats utility as a ghost in the machine; Peters treats it as a property of the machine's mechanics.

  However, the strength of this objective necessity relies entirely on the presence of a non-ergodic, multiplicative dynamic with an absorbing barrier. This brings us to Scott Garrabrant's "geometric rationality," which attempts to extend the logic of geometric expectation to domains like Nash bargaining and Bayesian updating. In Nash bargaining, the solution maximizes the product of utility gains (geometric) rather than the sum (arithmetic). In Bayesian updating, beliefs are updated multiplicatively via likelihood ratios. Garrabrant argues that these are not coincidences but manifestations of a deeper rationality that respects the geometry of the information space, even if it requires abandoning the VNM independence axiom.

  Does the "non-optional" status of Kelly in wealth dynamics carry over to these domains? The verdict must be no. In wealth dynamics, the penalty for violating geometric rationality is physical extinction. If you maximize arithmetic EV in a multiplicative market, you mathematically guarantee ruin. In bargaining or belief updating, there is no equivalent absorbing state. If two negotiators fail to maximize the Nash product, they may reach a suboptimal agreement or fail to agree, but they do not cease to exist as agents. If a Bayesian updater uses an arithmetic rule instead of a multiplicative one, their beliefs may be incoherent or slow to converge, but they do not face a physical boundary that deletes them from the system.

  Garrabrant's generalization is profound because it highlights that VNM expected utility is not the only coherent way to reason. It shows that geometric expectation is a robust normative framework for handling multiplicative relationships, whether in money, utility, or probability. But by removing the physical constraint of non-ergodicity, the argument shifts from *ontology* to *normativity*. In wealth, Kelly is a law of motion; in bargaining, the Nash product is a law of fairness or efficiency. The former compels you like gravity; the latter invites you like a contract. To claim geometric rationality is "non-optional" in bargaining is to confuse a normative ideal with a dynamic necessity.

  Therefore, the final adjudication rests on a distinction between the physics of the system and the axioms of the agent. Samuelson was wrong to dismiss the Kelly criterion as merely a preference *within the specific domain of repeated multiplicative bets*. In that domain, the ergodicity argument proves that geometric maximization is objectively required for survival, rendering it non-optional for any agent wishing to persist. Peters successfully rescues Kelly from the charge of fallacy by grounding it in the time-average properties of the world rather than the risk preferences of the mind.

  However, Samuelson was right that utility theory is ultimately about the agent's goals, and this truth reasserts itself once we leave the realm of compounding wealth. Garrabrant's geometric rationality is a powerful generalization, but it does not inherit the "non-optional" status of the Kelly criterion. Without the threat of absorption at zero, geometric maximization in bargaining and belief remains a defensible, elegant, and perhaps superior normative choice, but it is not a physical imperative. The ergodicity argument saves Kelly from being mere taste, but it cannot turn all of rationality into physics. The verdict is that geometric growth is a law of survival for wealth, but only a law of coherence for the mind.
