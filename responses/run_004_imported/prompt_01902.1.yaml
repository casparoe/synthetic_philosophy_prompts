answer: |-
  This is one of the best "physics vs. economics" turf wars of the last decade, and your intuition is spot on: there is real substance here, but Peters is also guilty of some rhetorical sleight of hand.

  Since you're in backend systems, I'm going to skip the econ jargon and give you the architecture analogy. Once you see it that way, the disagreement becomes obvious.

  ### The Backend Analogy: Concurrency vs. Long-Running Processes

  Imagine you are load-testing a service.

  1.  **The Ensemble Average (Economics' Default):** You spin up 10,000 containers, send one request to each, and measure the average latency. Let's say 9,999 containers respond in 10ms, but 1 container hits a memory leak and hangs forever. Your *average* latency looks great.
  2.  **The Time Average (Peters' View):** You run **one** container and send it 10,000 sequential requests. If that memory leak exists, the container eventually crashes. The average latency becomes infinite (or undefined) because the process died.

  **The Crux:** Mainstream expected utility theory often models decisions as if they are happening across 10,000 parallel containers (the ensemble). Peters argues that human life happens in a single, long-running container (the time series). If your code has a memory leak (ruin), the parallel average doesn't matter because the single instance will eventually crash.

  ### Peters' Claim: The "Ergodicity" Blind Spot

  Peters argues that for centuries, economists have assumed wealth dynamics are **ergodic**. In physics, a system is ergodic if the average over time equals the average over the ensemble (the parallel copies).

  *   **Ideal Gas:** If you measure the pressure of one box of gas over an hour, it's the same as measuring 1,000 boxes of gas at one moment. That's ergodic.
  *   **Wealth with Compounding:** As you noted, if you bet your whole bankroll on that 50/40 coin flip repeatedly, the ensemble average says you get rich, but the time average says you go broke. That is **non-ergodic**.

  Peters' punchline is: *Economics treats wealth like an ideal gas, but it's actually like a compounding process with ruin.* Therefore, maximizing Expected Value (EV) is mathematically incoherent for a single agent over time. He claims maximizing geometric growth (Kelly) isn't a "preference," it's a physical necessity for survival.

  ### Samuelson's Counter: The "Subjectivity" Defense

  Paul Samuelson (and the mainstream) didn't miss the math. They disagree with the *philosophy*.

  Samuelson's argument is: **Rationality is about satisfying preferences, not maximizing survival.**

  1.  **The Casino Counter-Example:** If you are a casino, you *are* the ensemble. You take millions of bets. The Law of Large Numbers applies to you. For the casino, maximizing Expected Value is absolutely the correct strategy, even though it would kill an individual gambler. Peters' rule isn't "objectively correct" for everyone; it depends on your position in the system.
  2.  **The "Outside Context" Argument:** In real life, you aren't betting your entire existence on one coin flip. You have a salary, assets, and insurance. If the bet is small relative to your total "system," the risk of ruin is negligible, and maximizing EV might actually be the rational choice to improve your quality of life.
  3.  **The Smuggle:** Samuelson hated the Kelly crowd because they were trying to derive an *ought* from an *is*. They wanted to say, "Because geometry works this way, you *ought* to have log utility." Samuelson said, "No. Utility is subjective. If I enjoy the thrill of risk, or if I have a safety net, I am rational to bet differently."

  ### So, who is right? (The "Drinks" Summary)

  Here is how you explain it to your friend:

  **Peters is right about the bug, but wrong about the patch.**

  He correctly identified a massive blind spot in mainstream economics. Economists *do* often model agents as if they can reset the universe after every decision. They ignore path dependence and ruin. When you introduce the possibility of "game over" (bankruptcy, death, systemic collapse), Expected Value maximization becomes dangerous nonsense. Peters forced economists to take **risk of ruin** seriously as a structural constraint, not just a "risk aversion" parameter.

  **However, Samuelson is right that there is no "One True Strategy."**

  Peters claims Kelly betting is *objectively* rational. That's too strong.
  *   If you are playing a game you **cannot quit** and **cannot replenish**, Peters is right: Kelly (or lower) is the only way to stay in the game.
  *   If you are playing a game where you can **replenish capital** (e.g., you have a job) or you are **one of many bettors** (e.g., a VC fund), maximizing EV might be perfectly rational.

  ### The Verdict for a Backend Dev

  Think of it like error handling.

  *   **Mainstream Econ:** Assumes exceptions are caught and the process continues. Optimizes for throughput (EV).
  *   **Peters:** Points out that some exceptions are fatal (SIGKILL). If you optimize for throughput without handling fatal exceptions, the system goes down.
  *   **Samuelson:** Says, "Sometimes I *want* to run risky code because the feature is worth the crash risk, provided I have a backup server."

  **The Takeaway:**
  Peters didn't reinvent the wheel, but he reminded everyone that the wheel has to roll on pavement, not just spin on a dynamometer. He exposed that "Expected Value" is a metric that only works if you have infinite retries. For a single life with finite time and irreversible consequences, **time-average growth is the only metric that reflects reality.**

  But don't let him convince you that it's the *only* rational metric. If you can afford to lose, taking positive EV bets is still smart. The trick is knowing which game you're actually playing: the parallel universe game (ensemble) or the single-life game (time). Most people live in the latter, but plan like they're in the former.
