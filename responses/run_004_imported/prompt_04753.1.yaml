answer: |-
  Good morning. To the graduates, your families, the faculty, and I see a few colleagues from the Philosophy department sitting quietly in the back row—I see you.

  As a nurse educator, I spend most of my time talking about protocols, pathophysiology, and care plans. I am not a philosopher. But as I prepared to speak to you today, I found myself thinking about a very old question regarding what it means to *know* something. And since we are here to celebrate your transition from student to professional, I think it is the most important question you will carry into your practice.

  Early in your training, there was a moment I recall. It wasn't unique, but it was revealing. On an exam, a student arrived at the correct medication dosage. The math checked out. The answer was right. If that medication had been administered in that exact moment, the patient would have been safe. But when that student moved into clinical rotations, a preceptor asked a simple question: "Why did you calculate it that way?"

  It turned out the reasoning was flawed. The student had taken a shortcut that worked for that specific problem but would fail the moment the variables changed. The destination was reached, but the map was wrong.

  This brings me to Socrates. Specifically, a dialogue called the *Meno*. In it, Socrates poses a puzzle that has bothered philosophers for two thousand years. He asks: If you want to get to a place—let's say, the road to Larissa—does it matter if you *know* the way, or if you just have a *true opinion* about the way?

  If I guess the correct turn, and you know the correct turn, we both arrive at Larissa safely. On that single trip, my lucky guess is just as useful as your hard-won knowledge. So, Socrates asks, why do we prize knowledge so much higher than a lucky correct belief?

  For you, the nurses in this room, the question is sharper. If a lucky guess gets the patient to recovery just as well as a calculated intervention, why do we spend three years demanding you understand the *why*? Why isn't the right answer enough?

  Socrates gives a beautiful answer. He says that true opinions are like the magnificent statues of the craftsman Daedalus. They are valuable, but they have a flaw: they are prone to running away. They are not stable. A true opinion can guide you well for a moment, but unless it is tied down, it will slip from your mind when the pressure rises, when the shift gets long, or when the patient presents with symptoms that don't match the textbook.

  Socrates says that knowledge is different. Knowledge is a true opinion that has been **tethered**. It is bound in place by an account of the reason why. When you understand the cause, when you can trace the logic, you tether the opinion. It stops running away. It stays where you put it.

  This is the difference between a student and a professional.

  In the classroom, you memorized the dosage. That was the true opinion. In clinicals, when your preceptor walked you back through the reasoning, they were helping you tie the tether. They were asking you to bind that answer to the physiology of the kidney, the pharmacokinetics of the drug, and the safety margins of the human body.

  To the families here today: You are trusting us with your loved ones. You are trusting that when we act, we are not guessing. You are trusting that our correct actions are tethered to understanding. Because when the emergency alarm sounds, there is no time to guess. We need the knowledge that stays put.

  To my philosophy colleagues in the back: I know Socrates eventually suggests that even the tethered truth is a kind of divine dispensation in the *Meno*. But for the purposes of nursing, I will stick to the tether.

  To the graduates: Your pin is not just a symbol of completion. It is a symbol of that tether. It represents the thousands of hours you spent not just finding the right answer, but understanding why it was right.

  There will be days in your career when you are tired. There will be moments of ambiguity where the protocol is unclear. In those moments, a "true opinion"—a hunch, a habit, a guess—might tempt you. It might get you to Larissa today. But Socrates reminds us that the value of knowledge is not just in the arrival; it is in the reliability of the journey, over and over again.

  Do not let your practice run away from you. When you encounter a new procedure, ask why. When you administer a treatment, trace the logic. Bind your actions to the science and the ethics you have learned here. Tether your opinions with reason, so that when your patients need you most, your knowledge does not flee.

  You have the right answers. Now, go out and tie them down.

  Congratulations, Class of 2024. Welcome to the profession.
