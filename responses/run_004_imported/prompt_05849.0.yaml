  **Justifications:**

  1.  **Owen (1):** Textually accurate regarding the *Sentences* conclusion that killing a usurper is meritorious when no superior is available. However, he slightly oversimplifies the "no recourse" condition as a blanket "no authorization needed," ignoring the caveat that if a superior *does* exist, the private individual must defer.
  2.  **Marisol (2):** Correctly identifies the standard scholarly reconciliation (usurper vs. legitimate ruler) and accurately summarizes *De Regno*'s specific worry about the destabilizing precedent of private violence against established authority.
  3.  **Owen (3):** A penetrating epistemic objection. He correctly identifies that determining "usurpation" is itself a political judgment prone to the same biases as judging "abuse," challenging the stability of Marisol's distinction.
  4.  **Marisol (4):** Defends the distinction well by appealing to the juridical nature of title versus the moral nature of conduct. However, scoring slightly lower because treating medieval succession titles as "checkable facts" is historically optimistic given frequent dynastic disputes.
  5.  **Owen (5):** Mixed. He rightly notes that collective action doesn't guarantee virtue, but he is mistaken that Aquinas offers *no* explanation. Aquinas grounds public authority in the representation of the *corpus mysticum* (common good), not merely in the reliability of the multitude's self-interest.
  6.  **Marisol (6):** Strong synthesis. She concedes the imperfection of the public/private line while salvaging the consistency argument by appealing to coordination costs as a functional filter against rash violence, which aligns with Aquinas's concern for order.

  **What Both Are Missing:**

  Both participants treat the texts as a purely juridical puzzle regarding the *right* to kill, overlooking Aquinas's shift toward **prudential consequentialism** in *De Regno*. In the later text, Aquinas is less concerned with the metaphysical licitness of the act and more with the high probability that tyrannicide produces worse tyranny or sedition. Furthermore, both neglect Aquinas's ultimate "recourse": when no human remedy (public or private) is safe or available, the Christian subject is advised to pray for divine intervention, not to take up the sword. This theological escape hatch complicates Owen's private license and Marisol's public structuralism alike.
