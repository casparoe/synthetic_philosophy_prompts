      *   **Move 3 (Farrah):** Reductio ad absurdum. Therapist mentions case at dinner party (no name, but recognizable). Is that a violation? If context crossing is *all* that matters, yes. But surely "how widely known" matters.
          *   *Analysis:* Farrah is testing the limits of CI. She's arguing that *degree* of secrecy/diffusion must matter. The therapist example is tricky because therapists have *fiduciary* duties, which are stronger than friendship norms.
          *   *Critique:* Farrah identifies a potential weakness in a rigid CI interpretation (is *any* flow violation equal?). However, the therapist analogy is slightly disanalogous (professional vs. personal norms). Still, she raises a good point about "publicness."
