answer: |-
  The diagnosis arrived on a Tuesday, printed on heavy cream stationery that smelled faintly of toner and antiseptic. *Anticipatory Resolution Syndrome.* Dr. Aris had spoken the words softly, as if handing her a fragile object. He explained that ARS was characterized by a premature sense of closure—a neurological misfire where the brain signaled the end of an experience before the experience had actually concluded. It was why Mara left birthday parties before the cake was cut. It was why she stopped reading books ten pages from the end. It was why her relationships dissolved during the good months, her brain convincing her the story was already over.

  "It's not avoidance," Dr. Aris had said, tapping the paper. "It's a timing error. You aren't running away. You're just arriving at the finish line early."

  The relief was physical, a loosening in the chest she hadn't known was tightened. For years, she had narrated her life as a series of failures of commitment. Now, it was a syndrome. A kind. She was not a flake; she was a Resolver.

  She took the pamphlet home and read the section on management. *Cognitive extension techniques,* it suggested. *Conscious duration monitoring.* That night, she joined an online forum for Resolvers. The threads were filled with people like her, sharing strategies to hack their own timelines. One user suggested wearing a vibrating watch set to interval alarms as a reminder that time was still passing. Another recommended scripting exit conversations in advance so the anxiety of the unknown ending wouldn't trigger the resolution signal.

  Mara adopted the scripts. She bought the watch. But the most significant change was internal. Before the diagnosis, leaving early had been an impulse, a sudden certainty that the air had gone stale. Now, staying became a project. When she attended her sister's engagement party, she felt the familiar wash of finality as the guests moved from cocktails to dinner. Her brain whispered that the scene was complete, that nothing new could happen. But now she had a name for the whisper. She recognized it as a symptom, not a truth.

  She forced herself to sit through the speeches. She monitored her urge to flee like a vital sign. When the cake came out, she didn't look at the door; she looked at her sister's face. She stayed until the cleanup began. She felt a surge of triumph, a sense that she had outwitted her own chemistry. She posted about it on the forum: *Made it to T-minus zero. Felt fake, but stayed.*

  The behavior rippled outward. In the months that followed, Mara became rigorous about duration. She finished movies she hated. She stayed in jobs past the point of utility. She learned to mimic the engagement of people who didn't suffer from ARS, nodding at the right moments, suppressing the internal clock that ticked toward closure. She became, by all external metrics, reliable. But the interiority of the condition shifted. The syndrome was no longer just about the premature feeling of an end; it was about the labor of resisting it. The exhaustion of staying became the defining feature, rather than the urge to leave.

  Six months later, she sat in Dr. Aris's office again. The cream stationery was gone, replaced by a tablet screen that glowed between them.

  "How have the extension techniques been working?" Aris asked. He didn't look at the screen immediately. He was watching her hands, which were folded tightly in her lap.

  "I haven't left early once," Mara said. "I used the scripts. I used the watch."

  "And how does that feel?"

  "Exhausting," she admitted. "It feels like I'm holding my breath. Like I'm performing endurance rather than actually experiencing the event."

  Aris nodded, tapping the stylus against the tablet. He looked tired too, though the room was bright. "We're seeing this quite a bit," he said, his voice neutral. "With the Resolvers. Specifically the ones who engage heavily with the management literature."

  "Seeing what?"

  "The compensatory behavior," Aris said. He turned the tablet slightly, though she couldn't read the text. "When the diagnosis was finalized last year, the criteria focused on the premature departure. The *act* of leaving. But now... we're finding that the label itself is creating a new subset. Patients who don't leave, but who dissociate while staying. They're physically present, but they're monitoring their presence so intensely that they aren't actually participating."

  Mara felt a strange vertigo. She had fixed the problem by becoming someone who stayed, but in doing so, she had become someone else entirely. "So I'm not cured?"

  "We're revising the taxonomy," Aris said. He paused, searching for the right words. "The initial category assumed the behavior was the symptom. But it seems the behavior was just the most visible output. Now that you've all learned to suppress the output, the underlying mechanism is manifesting differently. We're looking at splitting the diagnosis. Type One is the classic premature departure. Type Two is... Performative Retention."

  "Performative," Mara repeated. The word landed heavily. She thought of the engagement party, of staring at her sister's face not to see her, but to prove she was looking. She thought of the forum posts, the shared tips on how to fake duration. They had organized around the label, learned its rules, and played the game so well that they had broken the board.

  "Does that change the treatment?" she asked.

  "It changes the understanding," Aris said. "If the effort to stay is itself a symptom of the disorder, then 'staying' isn't the cure. It's just another variation of the disconnect." He put the stylus down. "We're going to need to rewrite the manual entries. The loop closes, then it opens again."

  Mara looked out the window. Below, the city moved in its own rhythm, uninterested in whether anyone felt finished with it. She realized she was waiting for the appointment to end, not because she felt it was over, but because she knew the script said appointments had ends. She wondered if knowing that made it real, or if knowing that made it just another thing she was performing.

  "Type Two," she said softly.

  "It's just a placeholder name," Aris said. "We'll find something more precise once we see how the group evolves."

  Mara nodded. She picked up her bag. She wanted to leave immediately, to run out the door and validate the old diagnosis. But she didn't. She stood up slowly, carefully, measuring the duration of the movement, aware that whatever she did next would be data for the next revision. She walked to the door, opened it, and waited to see if she felt real.
