          *   *Metaphysical Basis:* Mereology. Aggregates are phenomena; only simples are real substances. Consciousness requires substantial unity.

      *   **Searle's Chinese Room Argument (CRA):**
          *   *Premise 1:* Syntax (symbol manipulation) is not sufficient for Semantics (meaning/understanding).
          *   *Premise 2:* Computer programs are defined by syntax.
          *   *Premise 3:* The human in the room manipulates syntax without understanding semantics.
          *   *Conclusion:* Running a program is not sufficient for understanding (Strong AI is false).
