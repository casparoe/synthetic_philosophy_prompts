      *   *Murphy's Distinction:* I need to be very clear here. PSA = Christ is the recipient of wrath. VP = We are the recipients of wrath, mediated through Christ's suffering. It sounds subtle, but it's the difference between "God is angry at Jesus" and "God is angry at us, and Jesus absorbs the impact."
