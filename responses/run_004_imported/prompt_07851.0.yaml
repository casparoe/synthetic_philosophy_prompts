answer: |-
  You were right to feel uneasy. Your intuition touches on one of the most potent objections to supervaluationism, often championed by critics like Timothy Williamson. Your friend is correct that supervaluationism technically preserves the Law of Excluded Middle ($P \lor \neg P$) while rejecting Bivalence (the claim that every proposition is either true or false). However, she presents this as a net gain. Your task is to show that this "gain" is a Pyrrhic victory that severs the link between truth and reality so severely that it undermines the ordinary concept of truth itself.

  Here is a structured argument you can use to sharpen your objection. It focuses on three costs: the violation of compositionality, the lack of truthmakers, and the disconnect from assertibility.

  ### 1. The Violation of Compositionality (The Semantic Cost)
  In our ordinary understanding of language, the truth of a complex sentence is a function of the truth of its parts. This is **compositionality**. If I say, "It is raining or it is snowing," and you ask me why that statement is true, I must point to the truth of one of the disjuncts. I would say, "It is true *because* it is raining."

  Supervaluationism breaks this link. It asserts that "$P \lor \neg P$" is true even though neither "$P$" nor "$\neg P$" is true.
  *   **The Objection:** If the truth of the whole does not depend on the truth of the parts, then the logical connectives (like "or") no longer mean what we think they mean. In ordinary language, "or" is a truth-functional operator; its job is to combine truth values. Supervaluationism turns "or" into a non-truth-functional operator that tracks *validity across histories* rather than *truth in the world*.
  *   **The Cost:** To save classical logic, supervaluationism must admit that logical constants behave differently in the realm of future contingents than they do everywhere else. This is not a resolution of the puzzle; it is an admission that our logic does not actually map onto our semantics. You are preserving the *form* of classical logic while evacuating its *content*.

  ### 2. The Truthmaker Deficit (The Metaphysical Cost)
  Aristotle's puzzle is ultimately metaphysical: *What is it about the world that makes a statement about the future true?*
  *   **The Bivalence View:** If "$P$" is true now, there must be a current fact that makes it true. But if the future is open, no such fact exists. Hence, bivalence fails.
  *   **The Supervaluationist View:** They claim "$P \lor \neg P$" is true now.
  *   **The Objection:** If "$P$" lacks a truthmaker (because the battle hasn't happened) and "$\neg P$" lacks a truthmaker (because the absence of the battle hasn't happened), what fact makes the disjunction "$P \lor \neg P$" true?
      *   It cannot be a fact about the battle, because the battle is contingent.
      *   It cannot be a fact about logic, because logic doesn't make things true in the world; it only governs relations between truths.
  *   **The Cost:** Supervaluationism creates "free-floating truths." It certifies a sentence as **True** without there being anything in the world that corresponds to it. This violates the **Correspondence Theory of Truth**, which is central to our ordinary concept. If "truth" no longer requires "a way the world is," then supervaluationism hasn't saved truth; it has redefined it as "super-assertibility" or "logical validity" and slapped the label "truth" on it. This is arguably more damaging to our concept of truth than simply admitting that some sentences currently lack a truth value.

  ### 3. The Disconnect from Assertion (The Pragmatic Cost)
  In ordinary discourse, if a statement is true, it is appropriate to assert it. Furthermore, if a disjunction is true, we generally expect that further inquiry could reveal which disjunct is true.
  *   **The Scenario:** Suppose you assert, "Either there will be a sea battle tomorrow or there won't." According to supervaluationism, you have spoken the Truth.
  *   **The Follow-up:** If I ask, "So, which one is it?" you must reply, "Neither is true yet."
  *   **The Objection:** This creates a bizarre gap between truth and knowledge. You are claiming to know a truth ($P \lor \neg P$) that is not composed of any knowable sub-truths. It renders the concept of truth inert. If being "true" doesn't help you distinguish how the world is (since both disjuncts are gaps), in what sense is the disjunction "true" other than in a trivial, logical sense?
  *   **The Cost:** This makes truth a property of *sentences* relative to a *model*, rather than a property of *propositions* relative to *reality*. It solves Aristotle's problem only by retreating from metaphysics into semantics. It tells us how to *talk* about the future without contradiction, but it doesn't explain how the future *can be* open while our statements about it are true.

  ### The Conclusion: A Restatement, Not a Resolution
  Your friend argues that supervaluationism avoids the "dodge" of rejecting Excluded Middle. You should argue that supervaluationism *is* the dodge.

  Aristotle's worry was that if future statements are already true, the future is fixed. Supervaluationism tries to have it both ways: it says the disjunction is fixed (true) while the components are open (indeterminate). But if the disjunction is truly true *now*, it implies a determinacy about the logical space of the future that feels indistinguishable from determinism, just shifted one level up.

  By certifying the disjunction as true while withholding truth from the disjuncts, supervaluationism saves the **laws of logic** at the expense of the **nature of truth**. It forces us to accept that a sentence can be True even though nothing makes it true and neither of its specific options holds.

  **The Sharper Objection:**
  > "Supervaluationism claims to save the Law of Excluded Middle, but it does so by severing the connection between a compound truth and its constituent truths. In doing so, it preserves the *syntax* of classical logic but abandons the *semantics* of correspondence. To say 'P or not-P' is true when neither 'P' nor 'not-P' is true is to use the word 'true' in a way that no longer tracks reality. This is not a solution to Aristotle's puzzle; it is a technical maneuver that hides the mystery of future contingency behind a definition of truth that no longer corresponds to how we use the word in ordinary life. We traded the mystery of an open future for the mystery of truth without truthmakers."

  This frames the issue not as a logical technicality, but as a philosophical betrayal of what "truth" means, validating your intuition that the problem has been moved, not solved.
