  2.  **Deconstruct Supervaluationism (in this context):**
      *   **Core Mechanism:** Truth is "super-truth" (truth on all precisifications/histories). Falsehood is "super-falsity" (false on all). If it varies, it's indeterminate.
      *   **The "Win":** $P \lor \neg P$ is true because in every history, either $P$ is true or $\neg P$ is true.
      *   **The "Cost":** $P$ is indeterminate, $\neg P$ is indeterminate, but $P \lor \neg P$ is True.
      *   **The User's Objection:** This violates the "truth-functional" intuition of ordinary language. If a disjunction is true, *something* makes it true. Usually, that means one of the parts is true. Supervaluationism says the whole is true *even though* neither part is true.

  3.  **Brainstorming Arguments against Supervaluationism (focusing on the "Cost"):**
