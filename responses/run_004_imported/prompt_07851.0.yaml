      *   *The Assertibility Argument:* If I say "It will rain or it won't," I'm speaking trivially. But if I say "Either there will be a battle or there won't," supervaluationism says I'm speaking *truthfully*. But if someone asks "Which one?", I can't say. This creates a gap between truth and knowledge/assertibility that feels unnatural.
