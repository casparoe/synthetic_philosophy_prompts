answer: |-
  To compare Tolstoy's infection theory with Collingwood's expression theory, we must first isolate the specific mechanisms each philosopher proposes. For Tolstoy, art is a **causal transaction**: a sender transmits a specific feeling to a receiver, and the success of the art is measured by the empirical fact of "infection." For Collingwood, art is a **cognitive process**: the artist explores and clarifies a vague emotion into a distinct expression, and the success of the art is measured by the fidelity of that articulation, regardless of its practical effects.

  Here is how these mechanisms apply to your two cases, followed by an adjudication of their defensibility and an analysis of Tolstoy's severe verdicts.

  ### Case 1: The Unmoved Poem
  *A poem that sincerely and lucidly articulates a highly individual feeling but leaves every reader besides its author unmoved.*

  **Tolstoy's Verdict: Not Art.**
  For Tolstoy, the definition of art is inextricably linked to its effect on an audience. The mechanism is **transmission**. If the "current" does not flow—if the receiver is not infected—the activity has failed to be art. Tolstoy writes that art is "one of the means of union among men," and without that union, there is only a private record. Even if the poet meets the conditions of sincerity and clarity, the failure of **infection** renders the work "counterfeit" or simply non-art. It is a diary entry, not a work of art, because it did not bridge the gap between self and other.

  **Collingwood's Verdict: Art Proper (potentially).**
  For Collingwood, the primary locus of art is the artist's own mind. The mechanism is **clarification**. If the poet successfully took an inchoate disturbance and articulated it into a clear expression, they have performed the act of "Art Proper." While Collingwood acknowledges art is a social activity of language (requiring an audience to reconstruct the expression), he places the burden of success on the **integrity of the expression**, not the psychological susceptibility of the audience. If the readers are unmoved, Collingwood might argue they failed to collaborate in the reconstruction, or that the expression was too advanced for them, but the work itself remains "Art Proper" because the artist achieved self-knowledge. Unlike Tolstoy, Collingwood does not require empirical "infection" to validate the aesthetic act.

  **Divergence:** The theories pull apart sharply here. Tolstoy demands an empirical result (audience reaction); Collingwood demands an internal achievement (articulation).

  ### Case 2: The Patriotic Anthem
  *A rousing patriotic anthem that successfully unites a mass audience in an intense, shared emotion.*

  **Tolstoy's Verdict: Counterfeit / Bad Art.**
  Tolstoy's mechanism here is **moral transmission**. The anthem succeeds in the mechanical sense: infection is high, clarity is high, sincerity is likely high. However, Tolstoy evaluates the *content* of the feeling against his religious consciousness of the age (universal Christian brotherhood). Patriotism is an exclusive feeling; it unites one nation against others. Therefore, while it functions as art mechanically, it is morally "bad art" or "counterfeit" because it divides humanity rather than uniting it. The mechanism of infection is present, but the *substance* infected is toxic.

  **Collingwood's Verdict: Magic.**
  Collingwood's mechanism here is **functional intent**. He distinguishes "Art Proper" from "Magic" based on whether the emotion is expressed for its own sake or aroused for a practical end. A patriotic anthem is designed to reinforce social cohesion, prepare citizens for war, or validate the state. The emotion is aroused and discharged to achieve a **practical purpose**. Therefore, it is not art at all; it is "Magic" (specifically, social magic). Collingwood does not necessarily condemn it as *immoral* (as Tolstoy does), but he expels it from the category of art because it is instrumental. It is a tool for social engineering, not an exploration of emotion.

  **Convergence:** Both theories reject the anthem as "Art Proper."
  **Divergence:** Tolstoy rejects it because the *feeling* is wrong (moralism). Collingwood rejects it because the *purpose* is wrong (instrumentalism).

  ### Adjudication: Defensibility and Tolstoy's Self-Rejection

  **Which theory is more defensible?**
  On balance, **Collingwood's framework is more defensible.** Tolstoy's theory suffers from two fatal flaws that Collingwood avoids. First, Tolstoy makes art dependent on empirical reception, which is unstable; a masterpiece could cease to be art if an audience becomes numb to it. Second, Tolstoy conflates aesthetic value with moral utility. By judging art based on the *content* of the feeling (Christian love vs. patriotism), Tolstoy reduces art to religious propaganda. Collingwood protects the autonomy of art by focusing on the *process* of expression. He allows that art can express dark or complex emotions without needing to be morally "good," provided those emotions are truly explored rather than merely aroused for a purpose.

  **Explaining Tolstoy's Expulsions**
  This leads to the question of whose framework better explains why Tolstoy expelled canonical works (including his own) from the category of art.

  Strictly speaking, **Tolstoy's framework** provides the *internal justification* for his verdicts. He rejected *Anna Karenina* because, by his late standards, it did not transmit the specific religious consciousness required to unite the peasantry with the aristocracy. His theory *necessitates* these expulsions because it defines art by its moral utility.

  However, **Collingwood's framework** provides the deeper *diagnostic explanation* for why Tolstoy felt compelled to do so. Collingwood's distinction between "Art Proper" and "Magic" reveals that Tolstoy was not actually critiquing art; he was critiquing art's failure to serve as **Religion** (a form of Magic in Collingwood's terms). Tolstoy wanted his novels to function as patriotic anthems function for the state—to unify society under a specific dogma. When *War and Peace* failed to act as a vehicle for Christian anarchist conversion among the masses, Tolstoy declared it "not art."

  Therefore, while Tolstoy's theory explains the *logic* of his rejections, **Collingwood's framework better explains the *nature* of those rejections.** It identifies Tolstoy's severity as a category error: Tolstoy was judging "Art Proper" by the standards of "Magic." He expelled his novels not because they failed to express emotion (they clearly did), but because they failed to achieve a practical, communal end. Collingwood's theory allows us to see that Tolstoy did not discover that his novels were not art; rather, he decided that art must be something it is not (a tool for moral salvation). Thus, Collingwood offers the more robust explanation: Tolstoy's verdicts were the result of demanding that art perform the function of religion.
