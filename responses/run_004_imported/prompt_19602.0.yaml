answer: |-
  **Elena:** You read the bit about how a party isn't even a group of people anymore? It's a machine that fabricates collective passion. The moment you join, you stop thinking.

  **Marcus:** I read it. It's brilliant theology. But politics isn't about saving your soul, it's about managing conflict. Without the machine, you have chaos.

  **Elena:** It's not chaos, it's honesty. Weil says membership requires you to accept the line on questions that haven't even arisen yet. That's not coordination, that's pre-emptive dishonesty.

  **Marcus:** Burke called that "connection." You unite on general principle so you can act when the crisis hits. If you wait to think until the moment arrives, you're too slow to govern.

  **Elena:** But the principle shifts to protect the machine. Weil's point is that the party's primary law is self-preservation. Truth becomes secondary to survival.

  **Marcus:** And without the party, who survives? The voter needs a label to punish. Responsible government means you know who to throw out when things break.

  **Elena:** The label is a shield. You hide behind the collective whip so no single person has to admit they were wrong. It diffuses responsibility rather than fixing it.

  **Marcus:** So abolish the whip and what do you get? Not independent thinkers. You get hidden cliques, donors, backroom deals. At least parties are public factions.

  **Elena:** A hidden clique doesn't demand you swear allegiance to its future errors. Parties claim a moral monopoly they don't possess.

  **Marcus:** They claim a mandate. Without that claim, you have no authority to compromise. You can't trade policy for stability if you're just representing your own conscience.

  **Elena:** Then the stability is a lie. If governance requires me to suspend my judgment on the truth, the governance is illegitimate.

  **Marcus:** Legitimacy comes from keeping the lights on, not from the purity of the thinker. You're leaving because you want to be right. I'm staying because someone has to be effective.
