  Transitivity is the hardest axiom to justify giving up because violating it creates preference cycles (A > B > C > A) that allow for a classic money pump where the agent pays to cycle back to the start indefinitely. This is universally regarded as fatal irrationality because it guarantees resource loss without gain regardless of the environment or decision rule. Thus, it is the most defensible axiom to retain for any agent seeking to avoid exploitation, as no coherent strategy can salvage cyclic preferences.

  Independence ranks second because violating it (e.g., via the Allais paradox) often leads to dynamic inconsistency, where an agent's future self contradicts their current plans, opening doors to exploitation via strategic framing. While some non-expected utility theories manage this, the risk of dynamic money pumps makes it significantly riskier to drop than completeness or continuity. It remains highly defensible because avoiding dynamic inconsistency is crucial for long-term goal stability, even if some behavioral deviations seem intuitively appealing.

  Completeness is easier to relax because allowing incomparable options does not necessarily invite exploitation if the agent simply refuses to trade between incomparable states. Although specific money-pump arguments exist for incompleteness, they rely on stronger assumptions about forced choices or specific tie-breaking rules than cycle pumps do. This makes it less defensible to keep than transitivity or independence, though it still requires care to ensure the agent does not adopt an exploitable resolution policy.

  Continuity is the easiest axiom to justify giving up because violating it implies lexicographic preferences (e.g., safety overrides all else), which cannot be represented by real-valued utility but does not inherently invite money pumping in finite scenarios. It is primarily a technical requirement for mapping preferences to real numbers rather than a safeguard against exploitation. Therefore, it is the least defensible to keep for an agent concerned with safety rather than mathematical convenience, as infinite disutilities are common in alignment proposals.
