answer: |-
  The air in the Founders' Hall was stale, recycled through filters that had seen better decades. Outside the thick blast-glass windows, the new city of Aethelgard gleamed under a harsh sun, a grid of white concrete rising from the scorched earth of the Old Zone. Inside, the only light came from the holographic table where the Charter hovered, a rotating constellation of blue glyphs.

  High Chancellor Vane stood over the table, his hands resting on the edge. They were scarred hands, the knuckles swollen from old fractures. He was looking at the final article, Article 12.

  "It needs to be unamendable," Vane said. His voice was low, rasping like gravel under a boot. "Not just super-majority. Unamendable. Hard-coded into the biometric locks of the voting booths. If ninety-nine percent of the populace wants to change it, the machine must say *no*."

  Tomin, the youngest scribe present, shifted in his chair. He was twenty-four, born after the Purge, old enough to remember the hunger but too young to remember the blood. "Chancellor, the theory of the Charter is self-governance. You are proposing we remove a choice from the people."

  "I am proposing we remove a *failure* from the people," Vane corrected. He tapped the glyph for Article 12. It flared red. *The Prohibition of Exclusion.* No person seeking entry to Aethelgard could be denied sustenance or shelter, regardless of resource scarcity, criminal record, or origin.

  "Look at the history logs, Tomin," Vane said. "Twenty years ago, the Council of the Old Zone voted to close the gates. They were terrified. The drought was coming, the refugees were pounding on the walls. They voted, legally, democratically, to let them starve. And because they let them starve, the starving broke the walls. And because the walls broke, we burned."

  Tomin looked at the red glyph. "That was then. We have hydroponics now. We have desalination."

  "We have human nature," Vane snapped. "And human nature does not change with better pumps. When the water drops, when the dust storms hit, the panic will return. The mob will demand we save ourselves by casting out the stranger. They will scream that it is their right to survive."

  "And if it *is* a choice between the city and the stranger?" Tomin asked. "If the math doesn't work? You are binding us to a course of action that might mean collective suicide. You are tying the hands of a generation that hasn't been born yet. They didn't vote for this."

  Vane leaned in. "Odysseus knew the Sirens would sing. He didn't ask his future self what he wanted to hear; he knew he wouldn't be capable of choosing wisely. He ordered his men to bind him. He gave his future self the gift of survival, even if that future self screamed against the ropes."

  "Odysseus was one man," Tomin said softly. "He consented to the ropes. The people who will live here in fifty years, in a hundred... they are not Odysseus. They are the crew. And you are nailing them to the mast before they've even seen the sea."

  Vane straightened up, walking to the window. He looked out at the empty streets below. "I would rather they hate me for binding them than mourn them for letting them choose. If we leave Article 12 open, a future majority will close the gates. I know it. The fear of death is a stronger voter than the love of virtue."

  "But what if the context changes?" Tomin pressed, standing now. "What if the strangers carry a plague? What if the aquifer fails? If you make this absolute, you turn a moral principle into a mechanical death sentence. You aren't giving them a gift, Chancellor. You're giving them a cage. You're reaching out from your grave and choking them."

  Vane turned back. His face was tired, the lines deep as canyons. "The dead hand of the past is all we have to hold back the chaos of the present. If we do not bind ourselves to something higher than our immediate survival, we are just animals waiting for the next drought."

  He moved back to the table. His finger hovered over the confirmation sequence. "Initialize the Lock."

  Tomin stepped forward, his hand hovering over the abort key. "Chancellor, please. Let them decide. If they choose to be cruel, let it be their sin, not yours."

  "If they choose to be cruel, they cease to be Aethelgard," Vane said. "And I will not found a city that I know will die."

  He pressed his palm to the scanner. The hologram turned from red to a solid, immovable gold. A chime sounded, deep and resonant, vibrating in the floorboards. The system registered the change: *Article 12: Eternal. Amendment Probability: 0%.*

  Vane exhaled, a long shuddering breath. He looked at Tomin. "You think this is tyranny."

  "I think it's arrogance," Tomin said, his voice trembling. "You assume you know the price they will have to pay better than they will."

  "I know the price *I* paid," Vane said. He picked up his coat. "I bought their safety with their freedom to choose. Let history judge which was the heavier burden."

  Vane walked to the door. He paused, his hand on the frame, without looking back. "When the storms come, Tomin, and the refugees knock, and the people scream to turn them away... thank the ropes."

  The door hissed shut.

  Tomin stood alone in the quiet hall. The golden glyph of Article 12 continued to rotate, perfect and unyielding. He walked to the window and looked out at the horizon. Far off, a dust wall was rising, a brown bruise against the blue sky. It was moving fast.

  He imagined the future. He imagined a young mother, fifty years hence, standing in a voting booth, watching her child cough from the dust, knowing the shelters were full. He imagined her finger pressing the button to deny entry, and the machine rejecting her vote. He imagined her rage. He imagined her despair.

  Was it a shield? Or was it a shackle?

  Tomin placed his hand against the cool glass. The dust storm was closer now, swallowing the light. He realized he would never know the answer. He was the crew member who had to watch the captain tie himself up, knowing that when the storm hit, the captain might scream for a release that would never come.

  Tomin turned back to the table. He opened a new file, a private log, and began to type. He knew he couldn't change the Lock. But he could record the moment the ropes were tied. He could write down the name of the man who pulled them tight, so that when the future screamed, they would know who to blame, or who to thank.

  The dust hit the windows with a sound like rain. Tomin typed, the keys clicking in the empty room, a small, fragile sound against the weight of the gold.
