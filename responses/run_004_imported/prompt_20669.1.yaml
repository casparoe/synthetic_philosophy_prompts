      *   *Section 3: Which is more convincing?* Madison wins on *mechanics*, Weil wins on *psychology*. Mention that Madison assumed factions would be fluid; Weil saw them crystallizing.
      *   *Section 4: Feasibility.* Total abolition is impossible (Iron Law of Oligarchy). But "Weil-lite" reforms exist (RCV, open primaries).
      *   *Conclusion:* Summarize. Madison built the engine; Weil warns about the driver.

  8.  **Refining the Tone:**
