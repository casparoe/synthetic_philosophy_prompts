  10. **Final Polish:** Ensure the distinction between "utility function change" and "intransitive preferences" is clear. (Self-correction: Make sure to mention that standard economics treats preference change as exogenous, so it's outside the scope of rationality judgments usually, but philosophy digs deeper.)

