      *   *Requirement 2: Knowing One's Own Soundness (Begging the Question).*
          *   *Draft:* How do we know we are sound without assuming it?
          *   *Refinement:* Focus on the "God's eye view." To assert $G(F)$ is true, the mathematician stands outside $F$. If the mathematician *is* $F$, where is this outside standing?
          *   *Follow-up:* If he says "intuition," ask if intuition is just a black box algorithm we don't understand yet.

      *   *Requirement 3: Idealization of Human Math.*
