          *   *Refinement:* The argument assumes an idealized "mathematical insight." But actual math is social, fallible, and historically inconsistent. Does the argument only work for a Platonic super-mind, not actual humans?
          *   *Follow-up:* If he says "we mean idealized capacity," ask how we separate the capacity from the messy biological implementation.

      *   *General Probing Questions (to reach 8-10):*
          *   *The "Which System?" Objection:* Penrose says we don't need to know *which* machine we are. Is this a get-out-of-jail-free card?
          *   *Evolution/Neuroscience:* If the mind is non-computable, what is the evolutionary advantage? How does natural selection select for quantum gravity effects?
          *   *AI Progress:* LLMs look like they reason. Does your argument predict a hard ceiling for AI that current scaling laws might smash through?
          *   *The Leap to Physics:* Penrose links this to Orch-OR (quantum consciousness). Is the logic argument actually driving the physics, or is the physics propping up the logic?
          *   *Unknowable Truths:* If there are truths we can't prove, does that help or hurt the anti-mechanist case?
          *   *Paraconsistent Logic:* What if the mind *is* inconsistent? Does that save mechanism?

  4.  **Refining and Polishing (Adding the "Sharp Follow-up"):**
      *   *Check:* Are these too technical? Keep them accessible but deep.
      *   *Check:* Do they force a choice? Avoid yes/no.
      *   *Check:* Are the follow-ups conditional? (e.g., "If you say X, then Y...")

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm debating him myself. The questions should empower the *host* to debate him. The tone should be "Help the audience understand the tension" rather than "You are wrong."

      *Specific focus on the "Consistency vs. Soundness" question:* Lucas argued we can see the Gödel sentence is true because we see the system is consistent. Critics said "How do you know it's consistent?" Penrose shifted to "We know our own reasoning is sound." This is a higher bar. I need to ask if that higher bar is supportable.

      *Specific focus on the "Idealization" question:* This is the McCullough/Feferman objection. Humans aren't consistent. Penrose replies we are "potentially" consistent or we can correct errors. I need to press on whether "potential consistency" is enough to generate the Gödel sentence.

  5.  **Final Review against Constraints:**
