      *   **Tone:** Intellectual, probing, respectful but challenging (podcast interview style).

  2.  **Deconstruct the Lucas-Penrose Argument (for context):**
      *   *Core Claim:* For any formal system $F$ capable of arithmetic, there is a Gödel sentence $G(F)$ that is true but unprovable in $F$.
      *   *Lucas (1961):* Humans can see $G(F)$ is true. Therefore, humans are not $F$. Since $F$ was arbitrary, humans aren't formal systems.
      *   *Objection:* To see $G(F)$ is true, you must assume $F$ is consistent. How do you know $F$ is consistent? If the mind is $F$, it can't prove its own consistency (2nd Incompleteness Theorem).
      *   *Penrose (Shadows of the Mind, etc.):* Upgrades to "Soundness" (truth-preserving). Argues we have non-algorithmic insight (quantum gravity in microtubules, etc.). Addresses the "which system?" objection by saying we don't need to know *which* system we are, just that we aren't *any* knowably sound system.
      *   *Key Weaknesses:* Idealization of human math (we make mistakes), the "unboundedness" assumption, the leap from "not this system" to "non-computable."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Lucas vs. Penrose (Consistency vs. Soundness).*
