      *   *Section 5: Evidence & Epistemic Status.* What counts as evidence? (Physical realization). Is it a definition or a hypothesis? (Gandy's analysis).
      *   *Conclusion:* Summarize the "weight" of the phrase "It's just a thesis."

  6.  **Refining for the Physicist Persona:**
      *   Use analogies from physics (ideal gases, frictionless planes).
      *   Avoid overly dense jargon (e.g., keep "qualia" minimal or explained).
      *   Focus on the structure of the argument (premises, conclusions, category errors).
