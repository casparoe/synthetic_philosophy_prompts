      *   *Long-term behavior:*
          As the number of rounds ($N$) approaches infinity, the probability of the actual return converging to the geometric mean approaches 1 (Law of Large Numbers applied to log-returns). Since the geometric mean is less than 1, the bankroll will almost surely tend toward zero.

  3.  **Identify the Core Concept:**
      *   This is a classic example of the difference between **Ensemble Average** (Expected Value across many parallel universes) and **Time Average** (What happens to one person over time).
      *   This is known as **Ergodicity Breaking**.
      *   It's also closely related to the **Kelly Criterion**. The Kelly Criterion tells you the optimal fraction to bet to maximize geometric growth.
          *   Kelly Formula: $f^* = \frac{p(b+1) - 1}{b}$
