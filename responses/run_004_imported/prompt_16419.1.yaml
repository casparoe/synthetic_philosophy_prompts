answer: |-
  Do **not** join this bet. Your teammate is falling for a classic probability trap, and the math actually guarantees he will lose everything if he keeps playing long enough.

  He is correct that the **Arithmetic Expected Value (EV)** is positive, but he is wrong to apply that metric to a compounding strategy. When you reinvest your entire bankroll every round, you don't care about the arithmetic average; you care about the **Geometric Mean**.

  Here is the breakdown of why his reasoning is flawed and why you should keep your money in your pocket.

  ### 1. The "One Head, One Tail" Proof
  The easiest way to see the flaw is to look at what happens over just two rounds. Since it's a coin flip, over any two rounds, you should statistically expect one Head and one Tail (order doesn't matter).

  *   **Start:** $100
  *   **Round 1 (Heads):** You gain 60%. Pot becomes $160.
  *   **Round 2 (Tails):** You lose 50% of the *current* pot ($160). Pot becomes $80.

  Even though you won one and lost one, **you have lost 20% of your money.**

  Mathematically, this is because multiplication is commutative but not additive.
  $$1.6 \times 0.5 = 0.8$$

  Every pair of flips (one win, one loss) multiplies your bankroll by 0.8. Over time, as the number of heads and tails converges to 50/50, your bankroll will decay exponentially toward zero.

  ### 2. Arithmetic vs. Geometric Mean
  Your teammate is looking at the **Arithmetic Mean**, which calculates the average outcome if you could reset the bet every time with a fixed dollar amount.
  $$0.5 \times (+60\%) + 0.5 \times (-50\%) = +5\%$$
  This is positive. If he bet a fixed $10 every time (taking profit off the table or adding from his wallet to keep the bet size constant), he would indeed make money.

  However, because he is **compounding** (betting 100% of his current pot), he is subject to the **Geometric Mean**.
  $$\sqrt{1.6 \times 0.5} = \sqrt{0.8} \approx 0.894$$

  The geometric mean is roughly **0.894**, which implies an average **loss of ~10.6% per round**. This is often called **volatility drag** or **variance drain**. The variance in the returns is so high that it eats away the compounding gains.

  ### 3. Ergodicity: Why the other guys won
  You mentioned that people who played only a round or two came out ahead. This is due to **variance** and the difference between *ensemble averages* and *time averages* (a concept called **Ergodicity**).

  *   **Ensemble Average (The Group):** If 1,000 people played exactly one round, the average return of the group would be +5%. Some would win, some would lose, but the *group* profit is positive.
  *   **Time Average (The Individual):** If *one* person plays 1,000 rounds in a row, their individual trajectory will follow the geometric mean (the -10.6% loss per round).

  The people who played once got lucky (they likely flipped Heads). Your teammate is experiencing the "Time Average," which for this specific bet structure leads to ruin. He isn't suffering from "bad variance"; he is suffering from the mathematical certainty of the geometric mean.

  ### 4. How to actually win (The Kelly Criterion)
  This game *is* beatable, but not by betting 100% of your pot. There is an optimal fraction of your bankroll you should bet to maximize growth, known as the **Kelly Criterion**.

  Without getting into the calculus, for a 50/50 bet with a 60% gain and 50% loss, the optimal bet size is approximately **16.7%** of your bankroll per round.
  *   If you bet **16.7%**, your bankroll will grow over time.
  *   If you bet **100%**, your bankroll will go to zero.

  ### The Verdict
  Your teammate is confusing "Expected Value" with "Expected Growth."
  *   **Expected Value:** Positive (+5%)
  *   **Expected Growth:** Negative (-10.6%)

  In compounding scenarios, **Expected Growth is the only number that matters.**

  Tell him he's experiencing "Gambler's Ruin" via over-betting. If he continues to bet 100% of his pot, it is not a question of *if* he loses everything, but *when*. Do not join in.
