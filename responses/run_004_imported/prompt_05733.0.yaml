      *   *Initial thought:* Let Alex win on the 2D semantics.
      *   *Correction:* No, Blake needs to challenge the applicability of 2D semantics to phenomenal concepts. Maybe the framework itself is the issue.
      *   *Refinement:* Make sure Blake articulates *why* the PCS blocks the move from 2D space to metaphysics. The key is that the "mode of presentation" is physical but felt as non-physical.

  6.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   No "greatest hits" simplification? Yes.
      *   Technical depth (2D semantics, intensions)? Yes.
      *   No clear winner? Yes.

