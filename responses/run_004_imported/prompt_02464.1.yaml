      4. Explain that the "Concession" was regarding the *mode* (animals vs. nothing), not the *principle* (physical action).
      5. Mention the Ramban critique to show the depth of the issue.
      6. Conclude with the idea of Divine Will superseding human logic.

  7.  **Final Review against the Prompt:** The prompt asks *why* Maimonides rules this way *given* his Guide argument. I need to focus on reconciling the two texts from Maimonides' perspective.

      *Key argument:* The *Guide* explains the *origin* of the law. The *Mishneh Torah* codifies the *status* of the law. The origin does not negate the status unless the Lawgiver changes it. The Messiah fulfills the Law, he doesn't abrogate it.

      *Another angle:* In the Messianic era, knowledge of God is universal. Does that mean we don't need physical acts? Rambam seems to think embodied humans still need physical acts to express devotion, even if the idolatrous impulse is gone. The "weaning" was from idolatry, not from physicality.

