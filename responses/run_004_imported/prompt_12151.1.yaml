prompt: |-
  I cover cognitive science and philosophy of mind as a science journalist, and next week I'm interviewing a theoretical neuroscientist for a profile piece on the free energy principle, which she champions as a grand unifying theory of the brain and, increasingly, of life itself. Her go-to move when pressed on objections is to say critics are demanding the wrong kind of falsifiability from the wrong kind of theory. Draft eight to ten interview questions that don't just let her restate the framework. Include one that presses the "dark room problem" — why organisms seek novelty rather than retreat to static, fully predictable environments, if minimizing prediction error is the brain's whole purpose — and pushes past the standard appeal to expected free energy and epistemic value; one that forces her to say plainly whether the principle is a tautological description that any self-organizing system satisfies by definition, or a falsifiable claim about how the brain specifically is built and wired; and one asking whether applying the same formalism to cells, immune systems, and whole societies leaves it anything specific to say about cognition at all. For each question, add a short follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist (Cognitive Science/Philosophy of Mind).
      *   **Subject:** Theoretical Neuroscientist (Champion of the Free Energy Principle - FEP).
      *   **Topic:** FEP as a grand unifying theory of brain/life.
      *   **Constraint:** 8-10 interview questions.
      *   **Key Challenge:** The subject tends to deflect criticism by claiming critics demand the "wrong kind of falsifiability."
      *   **Specific Requirements:**
          *   Include a question on the "Dark Room Problem" (novelty vs. static predictability) that pushes past standard "expected free energy/epistemic value" answers.
          *   Include a question on Tautology vs. Falsifiability (is it a definition or a specific claim?).
          *   Include a question on Scope/Specificity (if it applies to cells/societies, does it say anything specific about *cognition*?).
          *   **Crucial:** Each question must have a short follow-up keyed to her *likely* evasive/technical answer.
      *   **Goal:** Don't let her just restate the framework. Press for concrete implications and limitations.

  2.  **Deconstruct the Free Energy Principle (FEP) & Active Inference:**
      *   *Core Idea:* Systems minimize variational free energy (surprise/prediction error) to maintain their structure.
      *   *Mechanism:* Perception updates models; action changes sensory input to match models.
      *   *Criticism:* It's too broad (explains everything, predicts nothing), mathematically dense but empirically light, potentially tautological (all self-organizing systems minimize free energy by definition).
      *   *The "Dark Room" Problem:* If the goal is to minimize surprise, why not sit in a dark, silent room where input is perfectly predictable? *Standard Answer:* Expected Free Energy includes epistemic value (information gain), so we seek novelty to reduce uncertainty about the world. *Task:* Push past this.
      *   *The "Falsifiability" Defense:* "It's a principle like natural selection, not a specific model." *Task:* Pin down what would count as evidence *against* it.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Tautology Trap.* Need to ask if it's true by definition.
          *   *Draft:* Is FEP just a tautology?
          *   *Refinement:* Make it sharper. If any self-organizing system fits, is it science or math?
          *   *Follow-up:* She'll say it's a "mathematical necessity." Push: Then what empirical observation would violate it?

      *   *Question 2: The Dark Room.*
          *   *Draft:* Why don't we sit in dark rooms?
          *   *Refinement:* Acknowledge the "epistemic value" answer but ask *where* the drive for complexity comes from in the math. Is it baked in arbitrarily?
          *   *Follow-up:* She'll say priors are evolved. Push: Who sets the priors? If priors can be anything, isn't the theory flexible enough to fit any behavior post-hoc?

      *   *Question 3: Scope/Specificity (Cells vs. Cognition).*
          *   *Draft:* If cells do it, what's special about brains?
          *   *Refinement:* If the same equation describes an immune response and writing a symphony, does "cognition" lose its meaning?
          *   *Follow-up:* She'll say it's scale-invariant. Push: Then why use it to solve *mental* health issues specifically?

      *   *Question 4: Falsifiability (The "Wrong Kind" Defense).*
          *   *Draft:* You say critics want wrong falsifiability. What is the right kind?
          *   *Refinement:* Frame it as "What would change your mind?"
          *   *Follow-up:* She'll give a theoretical condition. Push: Has any neuroscience data *ever* threatened the principle?

      *   *Question 5: Neural Implementation.*
          *   *Draft:* Where is this in the brain?
          *   *Refinement:* Gradient descent is math. Neurons are wet. How does the brain calculate derivatives?
          *   *Follow-up:* She'll say "message passing." Push: Is there a specific circuit motif we haven't found yet that would disprove this?

      *   *Question 6: Predictive Power vs. Post-hoc Fitting.*
          *   *Draft:* Can you predict new behavior?
          *   *Refinement:* Most successes are re-descriptions of known phenomena. Where is the *novel* prediction?
          *   *Follow-up:* She'll cite a study. Push: Was that prediction made *before* data collection, or fitted after?

      *   *Question 7: The "Grand Unifying" Claim.*
          *   *Draft:* Is it a Theory of Everything?
          *   *Refinement:* Physics has ToE. Does FEP risk becoming a "Theory of Nothing" by covering too much?
          *   *Follow-up:* She'll argue for unity. Push: Does this unity come at the cost of mechanistic detail needed for treatment?

      *   *Question 8: Competing Frameworks.*
          *   *Draft:* What about predictive processing without FEP?
          *   *Refinement:* Can you have predictive coding without the thermodynamic baggage of FEP? Why is the variational calculus necessary?
          *   *Follow-up:* She'll say it provides the normativity. Push: Is that normativity observable or just philosophical?

      *   *Question 9: Clinical Application (Schizophrenia/Autism).*
          *   *Draft:* How does it help patients?
          *   *Refinement:* If psychosis is "wrong priors," how do we fix them? Is this just a metaphor for "brain is weird"?
          *   *Follow-up:* She'll mention computational psychiatry. Push: Has this led to a treatment that wouldn't exist otherwise?

      *   *Question 10: The Legacy/Endgame.*
          *   *Draft:* What if you're wrong?
          *   *Refinement:* If FEP is eventually seen as a useful heuristic rather than a law of nature, is that a failure?
          *   *Follow-up:* She'll say it's a framework. Push: So is it a law or a tool? (Brings it back to Q1).

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Specific topics (Dark Room, Tautology, Scope) covered? Yes. Tone appropriate (respectful but rigorous)? Yes.
      *   *Self-Correction on Follow-ups:* Ensure the follow-ups anticipate the *specific* jargon she uses (e.g., "Markov blankets," "variational bounds," "normative claims"). The follow-ups need to prevent her from hiding behind the jargon.

  5.  **Final Polish:** Check the flow. Start with the big philosophical claims, move to the specific mechanisms, hit the Dark Room, then the clinical/utility aspect, end with the status of the theory. (Decided to group them logically for the journalist's flow).

      *   *Refining the Dark Room Question:* Make sure it explicitly mentions "Expected Free Energy" so she knows I know the standard answer, forcing her to go deeper.
      *   *Refining the Tautology Question:* Use the phrase "survival of the fittest" analogy, as FEP proponents often use it, but turn it against her.
      *   *Refining the Scope Question:* Focus on the loss of explanatory power when scaling up.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are ten interview questions designed to navigate around technical restatements and press for empirical and philosophical clarity, including the specific constraints you requested.

  **1. The Tautology Trap**
  "Critics often compare the Free Energy Principle to natural selection: a powerful lens, but one that risks being true by definition. If any system that persists over time must, by definition, resist entropy, isn't FEP a tautological description of existence rather than a falsifiable claim about neural architecture? Put plainly: is this a law of physics that brains *obey*, or a mathematical language we *impose* on them?"
  *   **Follow-up:** "You'll likely say it's a normative principle like natural selection. But natural selection makes specific claims about genetic inheritance. If FEP applies to *any* self-organizing system, what specific empirical observation in a brain scan would count as evidence *against* it? If nothing can violate it, is it science or metaphysics?"

  **2. The Dark Room Problem (Novelty vs. Predictability)**
  "If the brain's fundamental drive is to minimize prediction error, the logical optimum is a dark, silent room where sensory input is perfectly predictable. You've addressed this with 'Expected Free Energy,' arguing that organisms seek information gain to resolve uncertainty. But where does the drive for *complexity* come from in the math? Isn't the preference for novelty just an arbitrary prior we bake into the model to make it fit the fact that we leave the house in the morning?"
  *   **Follow-up:** "If the priors that drive exploration are themselves evolved to ensure survival, aren't we just saying 'we seek novelty because we're built to seek novelty'? Does FEP actually explain the *origin* of that drive, or does it just mathematically formalize the circularity?"

  **3. Scope and Specificity (Cells vs. Cognition)**
  "You apply the same variational calculus to single cells, immune systems, and entire societies. If the same equation describes a bacterium avoiding toxins and a human writing a symphony, does the concept of 'cognition' lose its explanatory power? When a theory becomes a Grand Unified Theory of life, doesn't it risk becoming too abstract to say anything specific about the mind?"
  *   **Follow-up:** "You might argue for scale invariance. But if the mechanism is identical, why do we need neuroscience at all? If I can model a society with FEP without referencing neurons, have you explained the brain, or have you explained away the need for biology?"

  **4. The "Wrong Kind of Falsifiability" Defense**
  "When pressed on testing, you often suggest critics are demanding the wrong kind of falsifiability for this *kind* of theory. Can you define the 'right' kind? If we cannot run an experiment where the Free Energy Principle is proven false, how do we distinguish it from a philosophical framework that simply organizes data post-hoc?"
  *   **Follow-up:** "If the 'right' falsifiability is about the consistency of the mathematical framework rather than empirical data, aren't we discussing logic, not nature? Has there ever been a neuroscience finding in the last decade that forced you to alter the core principle itself?"

  **5. Neural Implementation**
  "Variational inference requires calculating derivatives and probability distributions. Neurons communicate via spikes and synaptic weights. There is a gap between the math of free energy minimization and the wetware of the brain. Do we have a candidate circuit motif that performs this specific variational calculus, or are we assuming the brain *must* find a way because the math says so?"
  *   **Follow-up:** "If the answer is 'message passing' in hierarchical networks, that's a broad architectural claim shared by many non-FEP models. Is there a specific wiring diagram or neurotransmitter dynamic that FEP *requires* and that Predictive Processing without Free Energy does not?"

  **6. Predictive Power vs. Post-Hoc Fitting**
  "Many successes of Active Inference involve re-describing known behavioral phenomena—like saccadic eye movements or the rubber hand illusion—in the language of free energy. Where is the novel prediction? Can you point to a specific behavior or neural signal that FEP predicted *before* it was observed, which competing frameworks would have predicted differently?"
  *   **Follow-up:** "If the prediction was quantitative (e.g., the timing of a signal) rather than qualitative, has that precision been replicated independently? Or is the model flexible enough to fit the timing post-hoc by adjusting the precision parameters?"

  **7. The Thermodynamic Baggage**
  "Free energy is a thermodynamic concept. Brains are thermodynamic systems, but cognition feels distinct from heat dissipation. Why is the thermodynamic formalism necessary? Can you have predictive coding and active inference without the variational bounds and the link to entropy, or is the physics essential to the psychology?"
  *   **Follow-up:** "If the physics is essential, does that mean a digital AI running on silicon, which doesn't have the same thermodynamic constraints as a biological cell, is fundamentally incapable of true cognition under your framework? Is FEP inherently biological?"

  **8. Clinical Utility (Schizophrenia and Autism)**
  "In computational psychiatry, you frame conditions like schizophrenia as 'aberrant precision weighting' on priors versus sensory data. This is a compelling metaphor. But has this framing led to a treatment protocol that wouldn't have existed under the dopamine hypothesis or standard network models? Does FEP offer a lever to pull that clinicians didn't already have?"
  *   **Follow-up:** "If the answer is 'not yet,' at what point does a framework need to demonstrate clinical utility to remain the dominant paradigm? Is it possible that 'wrong precision' is just a new name for 'chemical imbalance' without offering a new way to fix it?"

  **9. Competing Frameworks**
  "Is it possible to be a predictive processing theorist without accepting the Free Energy Principle? Many researchers accept the brain predicts but reject the variational calculus as unnecessary baggage. If they can model the same data without the FEP machinery, isn't Occam's Razor working against you?"
  *   **Follow-up:** "You'll say FEP provides the 'normative' story—the *why* rather than just the *how*. But if the 'how' works without the 'why,' does the normative claim matter to a scientist trying to map a circuit? Is FEP a tool for engineers or a philosophy for theorists?"

  **10. The Endgame**
  "Let's look twenty years ahead. If FEP is ultimately viewed not as a law of nature but as a useful heuristic—a way to organize thinking about self-organization rather than a literal description of what neurons are computing—is that a failure of the theory or a success?"
  *   **Follow-up:** "If it's just a heuristic, then claiming it is a 'principle' akin to natural selection or thermodynamics is misleading. Should we be teaching this to students as a fundamental law of life, or as a powerful but contingent modeling assumption?"
