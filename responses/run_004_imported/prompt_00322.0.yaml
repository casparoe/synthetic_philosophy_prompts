answer: |-
  The air in the mediation chamber was recycled and cold, smelling faintly of ozone. Kael and Mira sat on opposite sides of a holographic table, the glow illuminating the exhaustion on their faces. They weren't enemies, not exactly. They were the commanders of two adjacent lunar habitats, Helios and Selene, sharing a single, failing geothermal tap.

  The Arbiter, a disembodied voice from Earth Command, hummed softly.

  "The resource pool is fixed," the Arbiter said. A red wireframe surface materialized above the table. It was a curved hill, sloping down from Kael's axis to Mira's. "This is the Pareto frontier. Any point on this surface represents a stable allocation of energy. Any point below it is waste. Any point above it is impossible."

  Kael leaned forward. "My engineers finished the heat-exchanger upgrade. Helios can now utilize high-temperature steam that Selene can't. Effectively, my maximum possible utility has increased. My 'Ideal Point' has moved out."

  He tapped the console. The wireframe shifted. On Kael's side, the peak of the hill stretched higher, extending his maximum potential gain by forty percent. Mira's side remained unchanged.

  "Under the standard Nash protocol," the Arbiter continued, "we maximize the product of your gains above the disagreement point. If you fail to agree, both habitats freeze. Disagreement point is zero."

  A green dot appeared on the wireframe. It hovered slightly closer to Mira's axis than Kael's.

  Kael slammed his hand on the table. "That's wrong. I increased the pie. I expanded the feasible set. Why did my allocation drop?"

  Mira looked at the dot, then at Kael. "The Arbiter says the Nash solution is about efficiency. Your new curve is more concave. To maximize the *product* of our utilities, the math suggests I need more power to compensate for the diminishing returns on your end. If we follow Nash, your upgrade costs you fifteen percent of your share."

  "That's insane," Kael snapped. "I improved my tech, and I get punished? That violates monotonicity. If my options get better, I shouldn't end up worse off."

  "The Nash solution satisfies Independence of Irrelevant Alternatives," the Arbiter corrected smoothly. "It does not satisfy Individual Monotonicity. It ignores your Ideal Point. It only sees the shape of the frontier. Because your frontier is now steeper, the 'balance point' of the rectangle shifts toward Mira."

  Kael slumped. This was the deadlock that had frozen negotiations for weeks. The system was punishing him for competence.

  "Wait," Mira said. She was staring at the wireframe. She had been reading the Earth Command addendums while Kael was engineering. "The Arbiter mentioned the Ideal Point. Nash ignores it. But there's another solution."

  She looked at the Arbiter. "Calculate the Kalai-Smorodinsky solution."

  The Arbiter paused. "Warning. Kalai-Smorodinsky sacrifices Independence of Irrelevant Alternatives to satisfy Monotonicity. Are you certain?"

  "Do it," Kael said.

  The green dot vanished. A new dot, blue this time, materialized.

  It was significantly higher on Kael's axis.

  "Explain," Mira said, her voice tight. She wasn't happy about losing share, but she needed to understand the logic so she could sleep at night.

  "Draw a line," the Arbiter said.

  A thin beam of light shot from the disagreement point (zero, zero) through the air. It aimed directly at the theoretical 'Ideal Point'—the corner of the box where Kael gets his absolute maximum and Mira gets hers.

  "The Kalai-Smorodinsky solution does not look for the largest rectangle," the Arbiter explained. "It looks for equal proportional concessions. It asks: What percentage of your *potential* are you achieving?"

  The beam intersected the red wireframe frontier. That intersection was the blue dot.

  "Before the upgrade," the Arbiter continued, "your Ideal Points were symmetric. The line was at 45 degrees. You split the resources equally. Now, Kael's Ideal Point has moved outward. The line from zero to the Ideal Point has steepened."

  Kael traced the blue line with his finger. "So the solution is just... where that line hits the wall?"

  "Precisely. Because your maximum potential increased, the slope of the line increased. Therefore, the intersection with the frontier moves in your favor. You are rewarded for the expanded ceiling."

  Mira stared at the blue dot. Under Nash, she would have gotten 60% of the utility. Under Kalai-Smorodinsky, she was down to 45%. But the logic was undeniable.

  "It's about fairness of hope," Mira murmured. "Nash treats us like we're carving a stone. It doesn't matter how big the stone *could* have been, only how big it is. Kalai-Smorodinsky treats us like we're climbing a mountain. If your mountain peak is higher, you're allowed to camp higher up the slope, even if the total ground is the same."

  "But why?" Kael asked. "Why is this 'fairer'?"

  "Because of the rabbit hole you fell down," Mira said, looking him in the eye. "Monotonicity. If I discover a way to make my solar panels more efficient tomorrow, expanding *my* Ideal Point, Nash might actually give *me* less power because it changes the curvature of the frontier. It creates a perverse incentive to hide technology. To stay inefficient so the 'product' stays balanced."

  Kael nodded slowly. "Under KS, if you upgrade your panels, your line steepens, and you get more. You're incentivized to improve the colony."

  "Exactly," Mira said. "Nash maximizes the *outcome*. Kalai-Smorodinsky maximizes the *opportunity*. It ensures that having a better BATNA—Best Alternative to a Negotiated Agreement—actually helps you, rather than confusing the optimizer."

  She reached out and touched the blue dot. It shimmered, stable.

  "I lose fifteen percent compared to the Nash split," Mira said. "But if I agree to this, you sign off on the coolant transfer. My people don't freeze, and I know that if I innovate next year, I won't be penalized for it."

  Kael exhaled, the tension leaving his shoulders. The paperwork was still a nightmare, the legalities still dense. But the geometry made sense. The straight line from zero to the ideal felt honest in a way the curved hyperbola of the Nash product never did.

  "Accept the Kalai-Smorodinsky allocation," Kael said to the Arbiter.

  "Agreement logged," the machine replied. "Allocating energy."

  The lights in the chamber flickered, then brightened. On Kael's console, the numbers ticked up. On Mira's, they settled at a survivable level.

  "Next time," Mira said, standing up and pulling on her parka, "if I find a way to double my max output, don't be surprised when the line goes vertical."

  Kael smiled, watching the blue dot fade. "I'll just have to build a bigger mountain."
