      *   **Feasible Set (S):** The possible outcomes $(x, y)$.
      *   **Ideal Point (u*):** The maximum each could get if the other got nothing (or their disagreement point).
      *   **Nash Solution:** Maximizes the product $(x - d_x)(y - d_y)$. Geometrically, it finds the point where a hyperbola touches the Pareto frontier.
      *   **Kalai-Smorodinsky Solution:** Connects the disagreement point $d$ to the ideal point $u^*$ with a straight line. The solution is where this line intersects the Pareto frontier. It equalizes the *proportion* of the potential gain achieved by each player. $\frac{x - d_x}{u^*_x - d_x} = \frac{y - d_y}{u^*_y - d_y}$.
      *   **Monotonicity Issue:** If the feasible set expands for Player A (increasing $u^*_A$) while Player B's max stays the same, Nash might actually give Player A *less* (because the curvature changes), whereas KS will give Player A *more* (because the line slope changes).

  4.  **Drafting the Plot:**
