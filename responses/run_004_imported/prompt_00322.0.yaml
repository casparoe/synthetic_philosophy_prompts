      *   **Key Technical Point:** KSBS ensures that if the feasible set expands in a way that benefits one player's maximum potential without hurting the other's, that player shouldn't end up worse off (Monotonicity). Nash doesn't guarantee this. KSBS equalizes the *ratio* of gain to maximum possible gain.

  2.  **Determine the Setting:**
