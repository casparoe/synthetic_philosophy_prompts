      *   *Wait, one nuance on Move 1:* Mara says updating leads to a "better number." If she means "a different $p$ that yields higher utility *at the node*," that's the time-inconsistency claim. If she means "the calculation yields a different $p$ than 2/3," that's the P&R claim. AHP says no, it yields 2/3 if beliefs are consistent. I need to be careful not to say Mara is "wrong" because P&R are giants, but note that Theo represents the counter-argument that resolved the paradox for many.

      *   *Refining the "Winner":* It's not about who is "right" (since the literature is split), but who makes the stronger *move* in the dialectic.
