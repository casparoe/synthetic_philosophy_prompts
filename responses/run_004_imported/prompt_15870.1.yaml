prompt: |-
  I'm several chapters into a historical novel built around a formal philosophical disputation, a vāda, that I've invented for a fictional North Indian royal court in the early medieval period. My protagonist is a young Naiyāyika logician who has been given the unenviable task of defending her school's list of four pramāṇas against a visiting monk trained in the pramāṇa tradition of Dignāga and Dharmakīrti, whose lineage recognizes only perception and inference as genuine sources of knowledge. The scene I keep putting off concerns upamāna, comparison or analogy, which her tradition treats as a fully independent fourth pramāṇa, but which the monk insists can be folded into perception and inference without remainder. Both characters reach for the same illustration, inherited from Vātsyāyana's commentary on the Nyāya-sūtra: a traveler is told that a gavaya, a wild ox he has never seen, resembles a cow, and later, coming across the animal in a forest, correctly applies the word to it for the first time.

  Where the two characters part ways is over what that moment of recognition actually is. As I understand the monk's position, nothing happens there that perception, memory, and an ordinary inference from resemblance to applicability could not jointly explain, which makes positing an entirely separate faculty of knowledge explanatorily idle. I've read enough secondary literature to know that Naiyāyikas rejected this reduction, but most accounts I've found simply report that they did so, without reconstructing the reasoning in enough detail for me to trust it in my protagonist's mouth. I'd rather not have her win the debate by asserting her school's conclusion more forcefully than her opponent asserts his.

  Could you write out, as continuous argumentative prose rather than a summary of the historical positions, the strongest case available to a Naiyāyika for why the cognition produced by upamāna resists reduction to perception, memory, and inference? I'd particularly like the argument to say something precise about what upamāna is supposed to deliver that an inference could not, and to address whether the monk's proposed inferential reconstruction could even satisfy Nyāya's own requirement of invariable concomitance (vyāpti) between reason and conclusion. Something in the range of a page would suit the scene, and a closing sentence or two distilling the argument's logical skeleton would help me confirm that I've followed it correctly before I start drafting her lines.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A historical novel set in early medieval North India.
      *   **Scene:** A formal philosophical disputation (*vāda*) in a royal court.
      *   **Characters:**
          *   Protagonist: Young *Naiyāyika* logician (defending 4 *pramāṇas*: Perception, Inference, Comparison, Testimony).
          *   Antagonist: Buddhist monk (Dignāga/Dharmakīrti lineage, defending 2 *pramāṇas*: Perception, Inference).
      *   **Topic:** *Upamāna* (comparison/analogy). Specifically, the *gavaya* (wild ox) example.
      *   **Conflict:** The Buddhist says *upamāna* reduces to perception + memory + inference. The Naiyāyika says it's irreducible.
      *   **Requirement:** Write continuous argumentative prose (not a summary) representing the *strongest* Naiyāyika case.
      *   **Specific Focus:** Why inference fails here, specifically regarding *vyāpti* (invariable concomitance) and what unique cognition *upamāna* delivers (the relation between name and form).
      *   **Length:** Around a page of prose + a logical skeleton summary.
      *   **Tone:** Intellectual, rigorous, dramatic but grounded in historical philosophy.

  2.  **Historical & Philosophical Grounding:**
      *   *The Example:* A man is told by a forester, "A *gavaya* is like a cow." Later, he sees a *gavaya* in the forest and thinks, "This is that *gavaya*."
      *   *The Buddhist Reduction:*
          1.  Perception: Seeing the animal.
          2.  Memory: Recalling the forester's statement ("like a cow").
          3.  Inference: "This animal resembles a cow; whatever resembles a cow in this specific way is called a *gavaya*; therefore, this is a *gavaya*."
      *   *The Naiyāyika Counter:*
          1.  **The Object of Knowledge:** What is known in *upamāna*? It is the *saṃbandha* (relation) between the *saṃjñā* (name/word 'gavaya') and the *saṃjñin* (the object possessing that name).
          2.  **Failure of Inference:** Inference requires *vyāpti* (universal concomitance). To infer "This is a *gavaya*" from "This resembles a cow," one needs a major premise: "All things resembling a cow in this way are called *gavaya*." How does the traveler know this universal rule *before* the cognition occurs? He only knows the specific instruction from the forester.
          3.  **The Gap:** Inference moves from a mark (*liṅga*) to a property (*sādhya*). Here, the cognition is not just about the animal's properties, but about the *applicability of a name* based on similarity. The knowledge of the name-object relation is not perceptual (names aren't sensed), nor inferential (no prior universal link between 'cow-likeness' and the word 'gavaya' exists independently of the testimony).
          4.  **Udayana's Contribution:** Later Naiyāyikas (like Udayana) refined this. The cognition is "This is that same thing designated by the word 'gavaya'." It relies on the similarity, but the *result* is the knowledge of the denotation.
          5.  **Key Distinction:** Inference yields knowledge of a property (*this is a cow-like animal*). *Upamāna* yields knowledge of designation (*this is what the word 'gavaya' refers to*).

  3.  **Drafting the Argument (Iterative Process):**
      *   *Voice:* Needs to sound like a learned Naiyāyika. Precise, slightly combative but respectful of logic.
      *   *Opening:* Acknowledge the opponent's elegance but challenge the mechanism.
      *   *Core Argument:* Focus on the *vyāpti* problem. The Buddhist needs a universal premise to make it an inference. Where does that premise come from?
      *   *The "Name" Aspect:* Emphasize that we are learning a *word-object* connection, not just a physical property.
      *   *The Moment of Recognition:* It's not just "Ah, a cow-like thing." It's "Ah, *this* is the *gavaya*."
      *   *Refining the Logic:* Ensure the distinction between knowing the *similarity* (perception) and knowing the *name-application* (upamāna) is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't drift into *Śabda* (testimony). The forester's statement is *śabda*, but the moment in the forest is *upamāna*. The Buddhist argues the forest moment is inference. The Naiyāyika must show the forest moment is unique.
      *Crucial Point:* The traveler does not infer. He recognizes. Inference is discursive; recognition via *upamāna* is immediate regarding the name-object link.
      *Wait, Nyāya says upamāna is a distinct pramāṇa.* The cognition arises from the *knowledge of similarity* combined with the *previous instruction*.
      *The specific Nyāya argument:* If it were inference, the traveler would need to know "All animals resembling a cow are called gavaya." He doesn't know that. He only knows "The gavaya resembles a cow." The directionality matters. The instruction is "Gavaya is like cow." The cognition is "This (seen animal) is the Gavaya." To infer this, he needs "Whatever is like a cow is a Gavaya." That is false (a cow is like a cow). So the universal premise fails.

      *Let's sharpen the Vyāpti argument:*
      Buddhist Inference:
      Thesis: This animal is called 'gavaya'.
      Reason: Because it resembles a cow.
      Example/Universal: Whatever resembles a cow is called 'gavaya'.
      Counter: A domestic cow resembles a cow. Is it called 'gavaya'? No. So the universal premise is false. Therefore, it's not a valid inference.

      *Wait, the Buddhist would refine the reason:* "Resembles a cow *in the specific way described by the forester*."
      *Naiyāyika Counter:* Then the reason is too specific. It essentially includes the conclusion. If the reason is "possesses the specific unique similarity that defines 'gavaya'," you already know it's a 'gavaya' to define the similarity. It becomes circular.
      *Better Nyāya argument (Jayanta/Udayana):* The knowledge produced is the relation between the *name* and the *form*. Perception gives the form. Memory gives the name. But the *link* between *this* form and *that* name is not established by either alone, nor by inference because there is no invariable connection between 'cow-shape' and 'gavaya-name' independent of the specific stipulation. The cognition is of the type "This is that."

      *Let's go with the "Relation" (Saṃbandha) argument.* The fruit of *upamāna* is knowing the relation between word and object. Inference knows properties. Perception knows existence/form. Neither knows the *naming convention* applied to a new object based on similarity.

  4.  **Drafting the Prose:**
      *   Start with the opponent's claim: "It is merely inference."
      *   Dismantle the syllogism.
      *   Highlight the *vyāpti* failure (the cow counter-example).
      *   Define the unique content: The *saṃjñā-saṃjñin* relation.
      *   Conclude with the necessity of a separate instrument.

  5.  **Drafting the Skeleton:**
      *   Summarize the logical steps clearly for the user.

  6.  **Review against Constraints:**
      *   Continuous prose? Yes.
      *   Around a page? (Need to monitor length).
      *   Logical skeleton at the end? Yes.
      *   Tone appropriate? Yes.

  7.  **Final Polish:** Check philosophical terminology (*vyāpti*, *liṅga*, *sādhya*, *saṃjñā*). Ensure the distinction between the forester's testimony (past) and the forest cognition (present) is clear, as *upamāna* is the latter.

  *(Self-Correction on the Vyāpti point)*: The strongest Nyāya argument against the Buddhist reduction is indeed the failure of *vyāpti*. If the reason is "resemblance to a cow," the concomitance "All things resembling a cow are named gavaya" is false (because cows resemble cows). If the reason is "resemblance to a cow *plus the intention of the namer*," that intention is not perceived in the forest. Thus, inference fails. I will center the prose on this.

  8.  **Finalizing the Text:** (Mental check of the flow).
      *   Address the monk.
      *   Set up his inference.
      *   Show the crack in the universal premise.
      *   Show the unique cognitive content (name-object relation).
      *   Assert *upamāna*.

      *Let's write.*
answer: |-
  "Venerable monk, your reduction is elegant, I grant you, but it fractures under the weight of its own syllogism. You claim the traveler's cognition in the forest—'This is that *gavaya*'—is merely an inference built upon perception and memory. You construct it thus: The traveler perceives the animal's form; he remembers the forester's instruction that a *gavaya* resembles a cow; he infers that because this animal resembles a cow, it bears the name *gavaya*. But for this to be a valid inference (*anumāna*), there must be an invariable concomitance (*vyāpti*) between your reason (*liṅga*) and your conclusion (*sādhya*).

  "Let us examine this concomitance. Your reason is 'resemblance to a cow.' Your conclusion is 'being designated by the word *gavaya*.' You must assert the universal premise: 'Whatever resembles a cow is designated by the word *gavaya*.' But this is patently false. A domestic cow resembles a cow perfectly, yet no speaker of our language designates it as a *gavaya*. If you refine the reason to 'resembles a cow *in the specific way unique to the wild ox*,' you beg the question. To know that the resemblance is 'unique to the wild ox' is already to know it is a *gavaya*; you have smuggled the conclusion into the reason, rendering the inference circular and useless. The traveler does not possess a universal rule linking 'cow-likeness' to the word '*gavaya*.' He possesses only a specific stipulation regarding a specific unknown object.

  "Furthermore, consider the very content of the cognition. Perception delivers the form (*ākāra*); memory delivers the word (*śabda*). But what instrument delivers the knowledge that *this* form is the referent of *that* word? Inference yields knowledge of a property inhering in a substrate—for example, that there is fire on the hill because of smoke. But the traveler is not inferring a property of the animal. He is not thinking, 'This animal has the property of *gavaya-ness*.' He is grasping a relation (*saṃbandha*): the connection between the name he heard in the village and the form he sees in the forest. This relation is not perceptible; names are not sensed by the eye. Nor is it inferable, for there is no necessary link between a shape and a sound apart from the convention established by the forester's instruction.

  "If this were inference, the cognition would be discursive, dependent on recalling a universal rule. But the traveler's recognition is immediate upon seeing the similarity. He does not reason; he recognizes. The knowledge produced is *saṃjñā-saṃjñin-saṃbandha-jñāna*—the knowledge of the relation between the name and the named object. Perception gives us the object. Testimony (*śabda*) gave us the name and the similarity earlier. But the moment in the forest, where the similarity triggers the application of the name to the new object, is a distinct cognitive event. It relies on similarity, yet it is not perception of similarity alone, for that would yield only 'this is like a cow.' It yields 'this is *that*.' Because the instrument of this knowledge is the knowledge of similarity acting upon a prior verbal instruction, and because it yields a result that perception and inference cannot jointly produce without violating the laws of concomitance, we must posit *upamāna* as an independent *pramāṇa*. To deny it is to confuse the map with the territory, and the name with the thing."

  ***

  **Logical Skeleton of the Argument**

  1.  **Failure of *Vyāpti* (Invariable Concomitance):**
      *   To reduce *upamāna* to inference, the Buddhist must propose a universal premise: "All things resembling a cow are called *gavaya*."
      *   **Counter:** This is false (a cow resembles a cow but is not a *gavaya*).
      *   **Refinement Counter:** If the premise is restricted to "things resembling a cow *in the specific way of a gavaya*," the reason becomes identical to the conclusion (circularity), as one must already know it is a *gavaya* to identify the specific resemblance.

  2.  **Distinct Cognitive Content (*Prameya*):**
      *   **Perception** yields knowledge of the object's form.
      *   **Inference** yields knowledge of an unperceived property based on a mark.
      *   **Upamāna** yields knowledge of the *relation* between a word (*saṃjñā*) and an object (*saṃjñin*).
      *   Since neither form (perception) nor logical marks (inference) can establish a linguistic convention's application to a new object, a separate instrument is required.

  3.  **Immediacy vs. Discursiveness:**
      *   Inference is a discursive process requiring the recall of a universal rule.
      *   The recognition in *upamāna* is immediate upon perceiving the similarity, indicating a different cognitive mechanism triggered by the similarity rather than a logical deduction.
