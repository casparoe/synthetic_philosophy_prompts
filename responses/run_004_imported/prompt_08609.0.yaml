answer: |-
  **Title:** The Presumptuous Interruption
  **Setting:** A dimly lit control room at the CERN-like facility. Two physicists, ELENA and MARCUS, are reviewing final diagnostics on a particle collider. A whiteboard behind them reads: *TEST 44-B: T1 (Compact) vs. T2 (Inflationary Multiverse).* Cost estimate: $10 Billion.

  **Characters:**
  *   **ELENA & MARCUS:** Experimental Physicists.
  *   **DR. ARIS:** Philosopher (Proponent of the Self-Indication Assumption, SIA).
  *   **DR. BEN:** Philosopher (Proponent of the Self-Sampling Assumption, SSA).

  ***

  **ELENA:** (Rubbing her temples) If the calorimeter calibration holds, we flip the switch at 0600. If T2 is right, the energy signature will be diffuse. If T1, it's localized.

  **MARCUS:** Ten billion dollars hangs on a diffuse signature. I hate metaphysics masquerading as error bars.

  *(The door swings open. DR. ARIS enters, followed closely by DR. BEN. Aris looks triumphant; Ben looks apprehensive.)*

  **ARIS:** You can save the checkbook, Elena. I've run the numbers. You don't need to run the collider.

  **ELENA:** (Turning slowly) Excuse me?

  **ARIS:** The experiment is epistemologically redundant. You're trying to adjudicate between Theory T1, which predicts a universe with roughly $10^{24}$ observers, and Theory T2, which predicts a multiverse containing $10^{36}$ observers. Your priors are currently fifty-fifty based on non-anthropic evidence, correct?

  **MARCUS:** Correct. That's why we need the data.

  **ARIS:** No, you don't. You are ignoring the fact of your own existence. According to the Self-Indication Assumption, you should reason as if you were a random observer drawn from the set of all *possible* observers. Hypotheses that predict more observers make your existence more probable *a priori*. Since T2 predicts a trillion times more observers than T1, T2 is a trillion times more likely to be true. The posterior probability of T2 is effectively one. Turn off the machine.

  **MARCUS:** (Laughs dryly) So, because there *might* be more people out there, I'm definitely one of them? That's not physics, that's wishful thinking.

  **BEN:** (Stepping forward) It's not wishful thinking, Marcus, but Aris is misapplying the sampling rule. She's conflating the probability of *an* observer existing with the probability of *you* existing.

  **ARIS:** Ben, please. Don't drag out the Doomsday Argument. We aren't talking about birth ranks here.

  **BEN:** I'm not. I'm talking about likelihoods. Under the Self-Sampling Assumption, I reason as if I am a random sample from the set of all *actual* observers in my reference class. If I exist in T1, and I exist in T2, the likelihood of my existence is unity in both cases. $P(\text{I exist} | T1) \approx 1$ and $P(\text{I exist} | T2) \approx 1$. The sheer number of *other* observers in T2 doesn't increase the probability that *I* am here. It just means that if T2 is true, there are more people who aren't me.

  **ARIS:** But you *are* a random observer! If T2 is true, there are a trillion times more "slots" for your consciousness to occupy.

  **BEN:** That's the SIA bias. SSA says we condition on the fact that we are observers. Once that is fixed, the total number of observers is irrelevant to the truth of the theory, unless the theory predicts I *shouldn't* exist. Since both T1 and T2 allow for Elena and Marcus to be standing here, the likelihood ratio is 1:1. The priors remain 50/50. You need the experiment.

  **ELENA:** (Leaning against the console) So, one of you says the math proves T2 is true, and the other says the math proves we're still ignorant.

  **BEN:** Precisely. SIA licenses presumptuousness; SSA licenses humility.

  **ARIS:** (Turning sharply to Ben) Humility based on what? Your "reference class." That's the rot in the SSA foundation, and you know it. To get your 1:1 ratio, you defined the reference class as "observers identical to Elena." If you do that, the sample size is one, and the theory is trivial. But if you expand the class to "conscious agents," or "information processing systems," the boundaries blur. Why is your reference class non-arbitrary? If you change the class, your probabilities shift. SSA requires a magical line between "me" and "not-me" that metaphysics hasn't provided.

  **BEN:** It's a vulnerability, I admit. But it's better than SIA's catastrophe. Aris, answer this: What if T2 doesn't predict $10^{36}$ observers? What if the inflationary model implies an *infinite* number of observers?

  **ARIS:** Then T2 is infinitely more probable.

  **BEN:** Is it? If T2 entails infinite observers, and T1 entails finite observers, SIA dictates that the probability of T2 becomes 1, regardless of the non-anthropic evidence. No matter how elegant T1 is, no matter how much empirical data supports it, if T2 has infinite observers, you must believe T2 with certainty. Furthermore, how do you normalize the probabilities? If both theories predict infinite observers, your ratio becomes $\infty / \infty$. The math breaks. SIA collapses in the face of modern cosmology.

  **ARIS:** We use measure theory. We weight by volume or...

  **BEN:** You're patching a leaky boat with more holes. SSA avoids the infinity explosion because it doesn't count the total set, it samples the local set. Yes, the reference class is tricky, but it's a definitional problem, not a mathematical singularity. I'd rather argue about whether a chimpanzee counts as an observer than tell Elena she can't spend ten billion dollars because of a division by zero in your probability calculus.

  **ARIS:** (Frustrated) So you'd have them spend the money to confirm what we can know by thinking?

  **BEN:** I'd have them spend the money to measure the universe, not count ghosts.

  *(A heavy silence falls over the room. The hum of the cooling systems seems to grow louder. Elena looks from the philosophers to the console, then to Marcus.)*

  **ELENA:** You know, listening to you two... it occurs to me that you're both making the same category error.

  **ARIS:** And what is that?

  **ELENA:** You're treating the universe like it cares about your bookkeeping. Aris, you think the universe is more likely to be big because it makes *you* more likely to exist. Ben, you think the universe's size is irrelevant because your *sampling* is local.

  **MARCUS:** (Nodding) But the collider doesn't care about reference classes or observer counts. It cares about cross-sections and energy densities. If T2 is true, the detector fires. If T1 is true, it doesn't.

  **ELENA:** Philosophy is useful for checking our assumptions, gentlemen. But if you tell me I can derive the topology of spacetime from the fact that I'm standing in a control room, you've forgotten why we built the room in the first place.

  **MARCUS:** (Flips a switch on the console. The hum pitches up.) We're running the test.

  **ARIS:** But the odds are—

  **ELENA:** The odds are what the data says they are. Get out of the control room.

  *(Aris opens her mouth to protest, but Ben places a hand on her arm. He looks at the physicists, a faint smile on his face.)*

  **BEN:** Come on, Aris. Let's go watch the data. Even SSA proponents enjoy a good empirical update.

  *(The philosophers exit. Elena and Marcus are left alone with the rising whine of the machinery.)*

  **MARCUS:** You think T2?

  **ELENA:** I think I'll believe it when I see the signature.

  *(She engages the lock. The screen flashes: **INITIATING SEQUENCE**.)*

  **[END SCENE]**
