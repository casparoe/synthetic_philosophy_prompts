answer: |-
  **MEMORANDUM**

  **TO:** Technical Committee, County Search and Rescue
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Eagle Ridge POA Update & Policy on Conditional Intelligence

  **1. Immediate Recommendation: Eagle Ridge Search**
  For tomorrow's 6:00 AM briefing, I recommend we **maintain the total Probability of Area (POA) for the North sector at 50%** and **reallocate resources internally** from North-Upper to North-Lower. We should **not** move a team from North to South based on the current tip.

  **Reasoning:**
  The ski partner's tip ("If she stayed north... she's 5-to-1 likely to be in the Lower Bowl") is a *conditional* statement. It refines our understanding of where the subject is *within* the North sector, but it offers no evidence regarding the likelihood of her being in North versus South.

  Dave's spreadsheet model is functioning correctly as a "Minimum Cross-Entropy" updater. It finds the probability distribution closest to our prior that satisfies new constraints. However, it treats the tip as a global constraint on the map sectors (forcing the Lower Bowl probability up relative to Upper Ridge across the whole map). Mathematically, this minimizes "information distance," but operationally, it inadvertently penalizes the North sector simply because we received specific information about it.

  In search theory, receiving specific intel on one sector should not automatically drain probability from an unrelated sector (South) unless that intel suggests the subject is *less* likely to be in North overall. Since the tip explicitly presupposes she is in North ("If she stayed north..."), shifting POA to South implies the tip said something negative about North's total viability, which it did not.

  **Action Plan:**
  *   **South:** Hold at 50%.
  *   **North:** Hold at 50%.
  *   **North Internal Split:** Adjust Upper/Lower ratio to reflect the 5:1 tip (approx. 8% Upper / 42% Lower).
  *   **Resource Allocation:** Move the North-Upper team to North-Lower. Keep South resources static.

  **2. Standing Policy: Handling "Conditional" Tips**
  To prevent recurring debates on future searches, the Committee should adopt the following protocol for probability updating, effective immediately:

  **A. Distinguish Constraint Types**
  We must categorize new intelligence into two types before entering it into any model:
  1.  **Unconditional Constraints:** Direct comparisons between sectors (e.g., "She is twice as likely to be in North as South").
      *   *Method:* Use Dave's entropy-minimization model. This correctly shifts mass between sectors.
  2.  **Conditional Constraints:** Information about a sub-sector *given* the subject is in a parent sector (e.g., "If North, then likely Lower Bowl").
      *   *Method:* **Manual Sub-allocation.** The parent sector's total POA remains unchanged. The probability is redistributed *only* within the child sectors. The "slack" does not flow to unrelated sectors.

  **B. The "Irrelevance" Safeguard**
  If a piece of intelligence mentions Sector A but makes no reference to Sector B, the POA for Sector B cannot change unless the intel explicitly alters the likelihood of Sector A *as a whole*. Our models must not manufacture probability shifts in unmentioned areas simply to balance a mathematical equation.

  **3. Conclusion**
  Dave's model is a valuable asset for handling direct evidence, and his rigor on maintaining mathematical consistency is correct. However, for conditional intelligence, the "Irrelevance Intuition" (that unmentioned sectors shouldn't change) is the operationally safe standard. Adopting this policy allows us to use Dave's tool where it shines while preventing it from over-interpreting conditional tips.

  Please approve this approach for the 6:00 AM briefing.

  **[Your Name]**
  Technical Committee Member
