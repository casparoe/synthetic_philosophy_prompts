answer: |-
  # The Mast and the Mirror: A Defense of Conditional Precommitment

  The image is seductive in its simplicity. In Homer's *Odyssey*, Ulysses knows he cannot resist the Sirens' song. To survive, he orders his crew to tie him to the mast and plug their own ears. He binds his future, compromised self to preserve his life and mission. For legal theorists like Jon Elster and Stephen Holmes, this is the foundational myth of constitutionalism. A polity, anticipating its own future moments of passion, panic, or factional madness, binds itself with entrenched rights and amendment procedures. The constitution is the mast; the judiciary is the crew; the future majority is Ulysses, screaming to be let go.

  But as you have identified, the analogy harbors a fatal flaw. Ulysses is a single biological entity with a continuous consciousness. A polity is a "Ship of Theseus," replacing every plank—and every citizen—over time. When the Founding Generation ties the mast, they are not binding themselves; they are binding their grandchildren. This is the problem of intergenerational legitimacy. If the "self" is discontinuous, constitutional precommitment looks less like rational self-binding and more like one group of people shackling a completely different group that never agreed to the terms.

  Elster himself eventually recognized this. In *Ulysses Unbound*, he retreated from the strong claim that constitutions are literally precommitment devices, acknowledging that the "self" in politics is too fragmented for the analogy to hold perfectly. Yet, we still speak of constitutions as binding. We still defend "eternity clauses," like Article 79(3) of the German Basic Law, which places human dignity and democratic structure permanently beyond the reach of amendment.

  This creates what you have called the **Precommitment Dilemma**: Strong precommitment (irrevocable clauses) effectively binds the future but seems democratically illegitimate, foreclosing the possibility of a future consensus. Weak precommitment (supermajority requirements) is democratically palatable but functions merely as a speed bump—a nuisance a determined future Ulysses could easily talk his way past.

  Is the framework broken? Does the discontinuity of the political self render constitutional precommitment incoherent? My verdict is this: **Constitutional precommitment is legitimate and coherent, but only when it is understood not as binding the future's *will*, but as securing the future's *capacity to will*.** The Ulysses analogy holds when the constitution protects the conditions of democratic agency (constitutive rules) but fails when it attempts to lock in specific policy outcomes (substantive rules). To distinguish between these is to resolve the dilemma without abandoning the utility of the mast.

  ### The Discontinuous Self and the Dead Hand

  Your skepticism regarding the "continuous agent" is well-founded and echoes the classic "dead hand" objection. If democracy means self-government, then Generation B must govern itself. If Generation A's constitution prevents Generation B from enacting a policy that Generation B overwhelmingly desires, Generation B is not governing itself; it is being governed by the past.

  In this light, the strongest forms of precommitment look like tyranny. If the American Founders had inserted a clause forbidding the abolition of slavery forever, no matter the will of the people, we would not view that as a noble act of precommitment. We would view it as a moral catastrophe. The "self" that wrote the clause was morally fallible; the "self" that sought to undo it was morally superior. The precommitment device would have protected injustice.

  This leads to Jeremy Waldron's powerful objection. Waldron argues that precommitment reasoning relies on an epistemic arrogance: it assumes the constitution-drafters were the "sober, farsighted self" and the future majority is the "passionate, addled self." But history shows this is often reversed. Sometimes the past is bigoted and the present is enlightened. Sometimes the present is manic and the past was wise. There is no neutral vantage point from which to declare which generation possesses the "true" will of the people. If we cannot know which self is sober, why should the past self get to tie the mast?

  If we accept Waldron's critique fully, we are driven toward a pure majoritarianism where no constraint is legitimate, because any constraint assumes a superiority of the past that cannot be proven. But this ignores the second half of the theoretical puzzle: Stephen Holmes's argument about enabling constraints.

  ### Holmes and the Enabling Constraint

  Stephen Holmes argues that we misunderstand constitutions if we view them purely as negative restrictions. In *Passions and Constraint*, Holmes suggests that constraints are often what make action possible in the first place. A grammar restricts which sentences you can speak, but without grammar, you cannot speak at all. A contract restricts your freedom to renege, but without that restriction, you cannot make a credible promise.

  Applied to democracy, Holmes suggests that certain constitutional constraints do not frustrate the popular will; they constitute it. A democracy cannot exist without rules that define who votes, how votes are counted, and what rights protect the losers of the vote. If a simple majority could vote to disenfranchise the opposition tomorrow, there is no democracy, only a temporary census of power.

  This reframes the Ulysses analogy. Ulysses does not tie himself to the mast to prevent himself from *living*; he ties himself to the mast to prevent himself from *dying*. The binding preserves the agent. Similarly, a constitution should not bind the future polity to prevent it from *choosing*; it should bind the future polity to prevent it from *ceasing to be a chooser*.

  This distinction allows us to navigate the Precommitment Dilemma. The dilemma arises because we treat all constitutional clauses as the same kind of binding. They are not. We must distinguish between **constitutive precommitment** and **substantive precommitment**.

  ### The Verdict: Constitutive vs. Substantive

  **Substantive precommitment** attempts to lock in specific policy outcomes or moral judgments that are not necessary for the functioning of democracy itself. Examples might include entrenching a specific economic system, a specific religious establishment, or a specific tax rate. This form of precommitment is illegitimate. It violates the democratic principle that the living generation has the right to determine its own values. It assumes the Founders possessed a moral wisdom that is immune to revision, falling squarely into Waldron's trap of epistemic arrogance. A supermajority requirement for tax changes might be defensible as a "speed bump" to encourage deliberation, but an eternal ban on income tax is a shackle imposed by the dead on the living.

  **Constitutive precommitment**, by contrast, locks in the rules that make democratic agency possible. This includes freedom of speech, freedom of association, due process, and the structural integrity of the federation. This is where Article 79(3) of the German Basic Law finds its justification. By placing human dignity and the democratic structure beyond amendment, Germany is not saying, "We know better than you what policies you should want." It is saying, "We know that without these conditions, you cannot safely want anything at all."

  If a future majority votes to abolish free speech, they are not exercising democratic will; they are dismantling the machinery of democratic will. In this specific context, the "discontinuous self" objection loses its force. The "self" of the polity is not defined by its biological constituents, but by its commitment to a specific form of association. If that form is destroyed, the polity ceases to exist as a democracy and becomes something else (a tyranny, a mob, an empire). Therefore, binding the future to preserve democracy is not binding a *different* self; it is preserving the *same* self across time.

  This resolves the Precommitment Dilemma.
  1.  **Irrevocable clauses (like Art. 79(3))** are defensible *only* when they protect constitutive norms. They are the mast that keeps the ship from sinking. It is not undemocratic to forbid a vote that would end democracy, because such a vote is self-contradictory.
  2.  **Amendable entrenchment (supermajorities)** is the appropriate tool for substantive issues. It acts as a cooling-off period (a weak Ulysses binding) without claiming permanent authority. It acknowledges that the future might be wiser than the past, but insists that changing course should require more than a fleeting impulse.

  ### Why the Analogy Holds (Conditionally)

  Does this save the Ulysses analogy? Yes, but only if we recognize that Ulysses had two types of constraints. He bound himself to the mast (constitutive: stay on the ship) but he did not bind himself to a specific course of navigation for the next ten years (substantive: where to sail).

  The error in much constitutional theory is treating the constitution as a navigation chart rather than the hull of the ship. When Elster walked back his optimism, he was reacting to the failure of constitutions to bind nations to specific policy outcomes (substantive precommitment). He was right to be skeptical there. But Holmes was right to insist that without the hull, there is no voyage.

  The "discontinuous self" objection fails only when we realize that the continuity of a polity is not biological, but normative. We are the same "people" as the Founders not because we share their DNA, but because we share their commitment to the rules of the game. If we change the rules of the game entirely, we are no longer playing the same game, and the "binding" was not a restriction on us, but a definition of us.

  ### Conclusion

  The Ulysses story is not a perfect model for constitutionalism, but it is not broken either. It breaks only when we try to use it to justify the tyranny of the past over the policy preferences of the future.

  The verdict is clear: Constitutional precommitment is legitimate when it functions as **scaffolding**, illegitimate when it functions as a **cage**. Scaffolding supports the structure of agency, allowing the future "self" to stand and act. A cage locks the future "self" into a specific position chosen by the past.

  Article 79(3) is scaffolding. It ensures that whatever the German people decide in the future, they decide it as free and equal citizens. A clause permanently banning socialism or capitalism would be a cage. It decides the outcome before the debate begins.

  We should not abandon the language of precommitment, but we must refine it. We bind ourselves to the mast not to stop ourselves from steering, but to ensure we remain alive enough to steer at all. The constitution is not a chain on the hands of the people; it is the spine that allows the people to stand. As long as we distinguish between the spine and the shackles, the Ulysses analogy remains not just coherent, but essential.
