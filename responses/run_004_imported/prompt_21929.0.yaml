      *(Refining the German Basic Law point)*: Article 79(3) protects human dignity. Is that substantive or constitutive? It's arguably constitutive of a liberal democracy. I need to argue *why* it fits the "enabling" category. Without dignity, there are no rights-bearing citizens to participate.

  8.  **Finalizing the Title:** "The Mast and the Mirror: Why Constitutional Precommitment Only Works When It Builds the Self." A bit long. Let's try "Binding the Future Without Killing It." Or "The Ulysses Trap." Let's go with **"The Ulysses Trap: Why Constitutional Precommitment Requires a Distinction Between Will and Capacity."** Actually, simpler is better. **"Masts for a Ship of Theseus."** No, too abstract. Let's stick to the core argument. **"The Limits of the Mast."**

      *Decision:* **"The Mast and the Mirror: A Defense of Conditional Precommitment."**

