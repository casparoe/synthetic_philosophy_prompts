answer: |-
  The greasepaint smelled of lanolin and old dust, a scent that had seeped into the pores of the dressing room walls over forty years. Elias sat before the mirror, the bulbs humming with a low, electric heat. On the table, the letter lay open. It was a prop, printed on tea-stained paper from the supply closet, the handwriting forged by the stage manager in a hurry during the second week of rehearsals.

  *My dearest Julian,* it began. *I cannot stay.*

  Elias played Julian. In the third act of *The Winter Count*, Julian died of a fever in a cabin while reading this note. He died every night at 8:45 PM. He died on Tuesdays with a matinee crowd of schoolchildren who rustled their candy wrappers during his final wheeze. He died on Saturdays to a full house that held its breath in the dark.

  He wiped a cotton pad across his cheek. The white foundation came away gray. In the mirror, his own face emerged from the corpse-pale mask—tired eyes, a scar on the chin from a bicycle accident when he was ten, the stubble of a real man who needed a shave. He knew the letter was paper. He knew the cabin was canvas and staples painted to look like wood. He knew the fever was a performance of shivering and vocal fry.

  And yet, as he folded the note and placed it in his coat pocket—a real coat, wool, bought at a thrift store—he felt a tightness in his throat that had nothing to do with the演技.

  It was closing week. The run was over tomorrow. He should have been feeling relief, the lightness of shedding a skin. Instead, he felt a heavy, hollow ache in his chest, specific and sharp. He was grieving Julian.

  He walked out into the alley. The city air was cold, smelling of exhaust and rain. This was real. The pavement was hard under his boots. A siren wailed in the distance, a genuine emergency. Elias breathed it in, testing the reality of it. He was here. The play was there. The boundary was the stage door, and he had crossed it.

  On the subway home, a woman across from him was crying quietly into a tissue. Elias felt a surge of pity so potent it made his hands tremble. He wanted to reach out, to offer comfort, but he also felt a strange resentment. Her grief was messy, unstructured. It lacked the dignity of Julian's death. Julian's death had meaning; it resolved the theme of the second act. It was clean.

  *He isn't real,* Elias told himself. *You are mourning a sentence written by a playwright who died in 1954.*

  He knew this. He could recite the biography of the author. He could explain the lighting plot that illuminated Julian's stillness. He possessed all the correct beliefs about the ontology of the situation. There was no confusion. He was not deluded.

  When he arrived at his apartment, his wife, Sarah, was asleep on the sofa with a book on her chest. The television was on low, casting a blue flicker over the room. Elias stood in the doorway and watched her breathe. She was warm, solid, alive. He loved her.

  He walked to the kitchen to make tea. The kettle whistled. The sound was sharp, intrusive. It reminded him of the sound cue that marked Julian's final breath—a synthesized wind noise mixed with a low string.

  His hand shook as he poured the water. A drop splashed onto his wrist, hot enough to sting. He welcomed the pain. It was data. It was proof of life.

  *Why does it hurt?* he thought. *There is no loss. Nothing has been taken from me. I have not lost a friend. I have not lost a brother. I have lost a role.*

  He carried the mug into the living room. Sarah stirred, waking up. "You're home," she murmured, rubbing her eyes. "How was the show?"

  "Full house," Elias said. His voice sounded rough.

  "You look wrecked, Eli. You okay?"

  He sat on the edge of the coffee table, facing her. He wanted to tell her. He wanted to say, *I am crying for a man who never drew breath. I am carrying a ghost in my pocket because I memorized his lines.* But how could he say that without sounding mad? Without sounding like he couldn't distinguish the game from the world?

  "I'm fine," he said. "Just tired."

  Sarah reached out and touched his knee. Her hand was warm. "It's almost over. You'll feel better once it closes."

  "Will I?"

  She smiled sleepily. "Sure. You'll sleep for a week. Then we'll go to the coast."

  Elias nodded. He looked at her hand on his knee. He tried to focus on the sensation of her touch, the pressure of her fingers, the heat of her skin. He tried to anchor himself in the physical fact of her. He thought about their own life, their real risks, their real mortality. He thought about how one day she would die, or he would, and that would be real grief, unscripted and final.

  He waited for that thought to summon the appropriate emotion. He waited for the fear of losing her to overwhelm the sorrow of losing Julian. He waited for the real tragedy to eclipse the fake one.

  But the sorrow for Julian remained intact, distinct and heavy, sitting alongside the love for Sarah like a stone in a pocket. It didn't displace the real; it just existed beside it, demanding equal weight.

  "I think I'll stay up for a bit," Elias said.

  "Okay. Don't stay up too late." Sarah turned over, pulling the blanket up.

  Elias sat in the blue light of the television. He reached into his coat pocket, which was hanging on the rack by the door, and pulled out the letter. The paper was crumpled now. The ink was smudged.

  *My dearest Julian,* it read.

  He knew that if he burned it, the feeling wouldn't burn with it. He knew that if he quit acting tomorrow and never stepped on a stage again, the ache for Julian would not necessarily vanish, because it wasn't about the stage. It was about the thought. The thought of the loss was here, in this room, real enough to tighten his throat, real enough to wet his eyes, even though the object of the loss was nothing but ink on paper.

  He looked at Sarah sleeping. He looked at the letter. He looked at his own hands.

  He began to cry. He cried silently, so as not to wake her, tears running down his face onto the wool of his sweater. He cried for Julian, who was not there. He cried for the impossibility of the tears themselves. He cried because the water was salt and warm and real, falling for a shadow that had no substance to catch it.

  He sat there until the tea went cold, waiting for the logic of the room to correct the error of his heart, waiting for the knowledge that *this is not real* to stop the feeling that *this is happening*.

  The room remained silent. The television flickered. The tears did not stop.
