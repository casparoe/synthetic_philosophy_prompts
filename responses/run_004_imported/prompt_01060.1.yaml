      *   **Key Arguments:**
          *   REU: Risk aversion is a distinct rational attitude (parameter $r$), not just diminishing marginal utility. It explains Allais preferences without violating independence via probability weighting.
          *   EU (Pettigrew/Briggs/Thoma objections): Diachronic choice problems (paying to avoid information), dynamic inconsistency, and the claim that REU collapses into EU under scrutiny or leads to sure losses.
          *   Buchak's Defense: Rejection of state-wise dominance in certain contexts, distinction between ex ante and ex post perspectives, risk as a global property of gambles.
      *   **Format:** A dialogue between two co-instructors (EU theorist vs. REU theorist) after a seminar.
      *   **Tone:** Intellectual, rigorous, steelmanned, no easy agreement, genuine revision/qualification.
      *   **Specific Constraint:** Must address the "paying not to learn" (value of information) objection and the "utility curvature vs. risk function" distinction.

  2.  **Character Conception:**
      *   **Elena (EU Theorist):** Orthodox, pragmatic, concerned with dynamic consistency and Dutch Book-style vulnerabilities. Believes rationality requires maximizing expectation.
      *   **Marcus (REU Theorist):** Buchak-aligned, philosophical, concerned with capturing the phenomenology of risk and the structural distinction between utility and risk. Believes orthodoxy misses a normative dimension.

