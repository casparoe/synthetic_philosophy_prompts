  ### Attempt 3: The Similarity Metric

  A priest asks Lewis: "For Jesus to substitute for me, he must be me. But your counterpart theory says he can't be me, only resemble me."

  Lewis says, "Correct. If he were identical to you, it would be suicide. If he's a counterpart, it's substitution. He needs to be similar enough to be liable, but distinct enough to be a third party."

  The priest asks, "So salvation depends on resemblance?"

  Lewis says, "Yes. You need to resemble the saved counterpart more than the damned one. If you sin too much, your similarity metric drifts. You stop looking like the guy Jesus paid for."

  The priest worries. "So how do I fix the metric?"

  Lewis says, "Prayer. It's just data synchronization."

  The priest pauses. "So sin isn't moral failure, it's just data drift?"

  Lewis replies. "Yes. Repentance is just syncing your properties with the saved instance."

  **The Logic:** This targets the core mechanism of counterpart theory (representation via similarity/resemblance rather than identity) and applies it to the requirements of penal substitution (representation). The joke treats moral standing as a technical "similarity metric" required to link you to your saved counterpart. If you drift too far morally (sin), you no longer resemble the counterpart who was saved enough to claim the benefit, turning theology into a debugging problem.
