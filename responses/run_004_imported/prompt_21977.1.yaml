answer: |-
  Here are three attempts that try to bridge Lewis's modal realism, counterpart theory, and his specific analysis of penal substitution (guilt vs. liability).

  ### Attempt 1: The Liability Loophole

  A theologian corners David Lewis after a lecture. "Professor, in your paper on penal substitution, you argue that *guilt* isn't transferable, but *liability* is—like a debt. But in your modal realism, I'm world-bound. I don't exist where Jesus pays. So whose debt is he actually paying?"

  Lewis adjusts his glasses. "Strictly speaking? He's paying the debt of your counterpart in his world. You never leave this world, so you never literally receive the payment."

  The theologian frowns. "So I'm not saved?"

  Lewis shrugs. "You're saved vicariously. Since you resemble that counterpart closely enough, you inherit the liability clearance. The guilt stays local with you, but the debt is settled offshore."

  The theologian blinks. "So salvation is just cross-world debt consolidation?"

  Lewis smiles. "No. It's proving you're not the guy who signed the loan. Your counterpart did. You just share the name."

  **The Logic:** This relies on Lewis's specific distinction in the penal substitution paper (guilt stays, liability moves) and combines it with the counterpart theory rule that individuals are world-bound (you can't literally be where Jesus is). The joke is that this solves the theological "injustice" problem by making salvation a matter of administrative resemblance rather than literal identity—you get the benefit of the payment without being the person who technically owed the debt, because "you" in the other world is a different person (a counterpart).

  ***

  ### Attempt 2: The Concrete Shift

  A grad student asks Lewis: "If modal realism is true, then all possible worlds are concrete. So there's a real world where I suffer my own punishment, and a real world where Jesus doesn't have to die. Why does *this* world matter?"

  Lewis says, "Because this is the world where the counterparts aligned for substitution. In the world where you suffer, your counterpart of Jesus didn't intervene. In this one, he did."

  The student asks, "So which version of me is the real saved one?"

  Lewis replies, "They're both real. But you're stuck in this instance. Take comfort: in the world where you pay the penalty, your counterpart of Jesus is off the hook. You're basically subsidizing his retirement."

  The student sighs. "So I'm not saved by grace. I'm saved by workload distribution among my counterparts."

  Lewis nods. "Exactly. Hell is just the shift you didn't manage to swap."

  **The Logic:** This leans on the "concrete reality" of modal realism (all worlds exist equally) versus the specific arrangement of *this* world (penal substitution). The humor comes from the idea that since all worlds are real, salvation isn't about escaping punishment entirely, but just being the specific "instance" of yourself located in the world where the transaction went through. It reduces the Atonement to a cosmic shift-swap between concrete counterparts.

