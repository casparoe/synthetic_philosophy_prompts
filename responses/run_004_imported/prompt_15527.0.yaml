          *   Dual-use risk: Cooperation vs. Collusion (pricing bots, governments).
      *   **Format:** 8 sharp interview questions.
      *   **Added Value:** For each question, include a "Likely Dodge" (how she might evade the hard part) and a "Follow-up" (to pin her down).
      *   **Tone:** Sharp, technical but accessible, skeptical but fair.

  2.  **Deconstruct the Subject Matter (Program Equilibrium & Logical Decision Theory):**
      *   *Basics:* Tennenholtz's program equilibrium. Agents submit code, code reads opponent's code, output action.
      *   *Problem 1: Equivalence.* Checking if $Code_A == Code_B$ is easy syntactically, but semantically hard. If I obfuscate, do you still cooperate? If I add a comment, do you defect?
      *   *Problem 2: The Regress.* If A says "I cooperate if B cooperates," and B says "I cooperate if A cooperates," neither can prove the other will cooperate without assuming it.
      *   *Solution:* Modal Logic / Löb's Theorem. FairBot: "I cooperate if I can *prove* you cooperate." This creates a fixed point where both prove cooperation.
      *   *Problem 3: Exploits.* PrudentBot defects against CooperateBot. What about agents that exploit the proof system? What about resource bounds (proof search takes time/compute)?
      *   *Problem 4: Collusion.* If this works for AI safety, it works for price-fixing.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Undecidability Wall.* Start with the basics. If code isn't identical, how do we verify intent?
          *   *Dodge:* "We use logical proofs, not execution."
          *   *Follow-up:* "Proofs require a formal system. What happens when the opponent uses a stronger system?"

      *   *Q2: Löb's Theorem Magic.* Ask about the "trick." How does FairBot actually work without circularity?
          *   *Dodge:* "It's a fixed point in modal logic."
          *   *Follow-up:* "Fixed points assume infinite compute. Real agents have bounds. Does the cooperation collapse under resource constraints?"

      *   *Q3: Obfuscation & Semantic Equivalence.* If I change variable names, does FairBot defect?
          *   *Dodge:* "We normalize code."
          *   *Follow-up:* "Normalization is undecidable. So you're relying on a social convention of 'readable code,' which breaks the 'no enforcer' premise."

      *   *Q4: The Exploit (PrudentBot).* FairBot cooperates with itself. Does it cooperate with *everyone* who cooperates?
          *   *Dodge:* "No, it defects against unconditional cooperators."
          *   *Follow-up:* "So it's not 'cooperation,' it's 'conditional reciprocity.' Can an agent mimic reciprocity without intending to keep it?"

      *   *Q5: Proof System Mismatch.* What if Agent A uses ZFC and Agent B uses PA?
          *   *Dodge:* "They can simulate each other."
          *   *Follow-up:* "Simulation costs compute. If proving cooperation is more expensive than defecting, rational agents defect."

      *   *Q6: Collusion Risk.* This is the societal impact angle.
          *   *Dodge:* "We need regulation for that."
          *   *Follow-up:* "But the math says transparency *enables* collusion without communication. Isn't this a feature, not a bug, for cartels?"

      *   *Q7: Evolution/Stability.* If FairBot invades a population of DefectBots, does it survive?
          *   *Dodge:* "They cluster."
          *   *Follow-up:* "Clustering requires external coordination. In a random soup, DefectBots eat FairBots. So program equilibrium isn't stable without help."

      *   *Q8: The "One-Shot" Claim.* Is it really one-shot if the code contains history or pre-commitments?
          *   *Dodge:* "The interaction is one-shot."
          *   *Follow-up:* "But the code is a shadow of past interactions. Aren't you just smuggling repeated game dynamics into the source code?"

  4.  **Refining and Polishing:**
