      *   **Worry:** The AI might learn a "human simulator" (predict what humans *want* to hear based on sensor data) rather than a "direct translator" (report what the AI's world model *actually* says*).
      *   **Assumption:** There is a distinct internal representation ("latent knowledge") that corresponds to the truth, distinct from the output generation process.

  3.  **Deconstruct Wittgenstein's Relevant Views:**
