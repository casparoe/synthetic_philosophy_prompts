      *   **Inner/Outer:** Mental states aren't hidden inner objects; they are manifested in behavior and context. "An 'inner process' stands in need of outward criteria."
      *   **Meaning as Use:** To ask what a word (or signal) means is to ask how it is used in a form of life.
      *   **Aspects/Seeing-As:** How we interpret data depends on the framework we apply.

  4.  **Synthesize: Wittgenstein vs. ELK:**
      *   *The Conflict:* ELK assumes "knowledge" is a static object inside the black box (weights/activations) that exists independently of how it's expressed. Wittgenstein says "knowing" is a capacity/ability manifested in action/use.
      *   *The "Ghost in the Machine":* ELK risks treating the AI's "belief" like a Cartesian mental substance. Wittgenstein would likely critique this reification.
      *   *The "Criteria" Problem:* How do we verify the AI "knows"? Usually by its success in prediction or action. If the AI acts *as if* it knows (e.g., alerts the police secretly while lying to the screen), does it know? If it only lies, does it know?
      *   *Compatibility:* Is there *any* room for ELK? Yes, if we redefine "latent knowledge" not as a hidden truth-object, but as a specific *pattern of usage* within the network's architecture that correlates with successful intervention in the world.

  5.  **Drafting the Response (Iterative Process):**

