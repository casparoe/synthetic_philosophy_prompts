      *   **Berkeley's Core Argument (as presented by user):** Wealth = industry/people, not gold/silver. Money = "ticket/counter" for claims on goods/labor (functionalist/nominalist view). Proposed a national bank issuing paper credit backed by land (public institution).
      *   **The Question:** How would Berkeley assess Bitcoin?
          *   Option A: Welcome it as the logical extension of anti-bullionism (money doesn't need intrinsic metal value).
