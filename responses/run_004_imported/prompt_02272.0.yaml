answer: |-
  This is a classic debate in organizational economics and management theory, and you have stumbled upon a very specific, well-documented phenomenon. To give you the clearest answer possible before your next discussion: **Daniel is applying a model that works for independent contributors but fails in interdependent systems.**

  His instinct is not "wrong" in a vacuum; it is the standard neoclassical economic view (methodological individualism). However, in the context of a modern collaborative company, his reasoning commits a specific error: it assumes **separability** where there is **interdependence**.

  Here is the principled reason why the team level does real, independent explanatory work, why Daniel's "long-term self-interest" argument fails in practice, and how that dictates bonus design.

  ### 1. The Flaw in Daniel's "Category Error" Claim
  Daniel argues that treating the team as a force is a category error and that team performance is just the sum of individual shadows. Mathematically, he is assuming your company's output function is **additive**:
  $$ \text{Team Output} = \text{Person A} + \text{Person B} + \text{Person C} $$

  If this were true, he would be right. You could optimize the whole by optimizing the parts.

  However, your empirical observation (teams with more helpers outperform, even if helpers have lower individual stats) proves your production function is **non-linear** and **interactive**:
  $$ \text{Team Output} = \text{Person A} + \text{Person B} + (\text{Person A} \times \text{Person B}) $$

  That interaction term $(\text{A} \times \text{B})$ is the "team effect." It is an **emergent property**. It cannot be attributed to A or B individually; it exists only in the relationship between them.
  *   **Example:** A senior engineer (Helper) spends 5 hours debugging a junior engineer's code. The senior's "tickets closed" number goes down. The junior's "tickets closed" number goes up. The *team's* total code quality and velocity go up disproportionately because the junior learns to avoid that bug forever.
  *   **The Explanatory Work:** If you only look at individual stats, you see a loss for the senior and a gain for the junior. You miss the net gain in *capacity* that occurred. The team-level metric captures the synergy; the individual metric captures only the transaction.

  Therefore, treating the team as a unit is not a category error; it is a recognition of **non-separability**. You cannot mathematically disentangle the helper's contribution from the recipient's success without losing information about the system's efficiency.

  ### 2. Why "Long-Term Self-Interest" Fails (The Market Failure)
  Daniel's strongest point is that helping *should* be rewarded by reputation and reciprocity eventually, so no team bonus is needed. This relies on the assumption of an **efficient internal labor market**. In reality, three friction points break this mechanism:

  **A. The Time-Horizon Mismatch**
  Individual bonuses are usually quarterly or annual. Reputation building is multi-year. In a rational calculation, an employee will discount the future value of "reputation" heavily against the immediate, certain loss of a cash bonus. If helping costs me $\$5,000$ in bonus this year, the "reputation benefit" needs to be perceived as worth significantly more than $\$5,000$ in future value to offset it. In large companies, that link is often too weak.

  **B. The Attribution Problem (Noise)**
  For reputation to work, observers must know *who* helped. In complex teams, help is often invisible (a quick Slack message, a quiet code review). Free-riders are often better at self-promotion than helpers. If the market cannot distinguish the helper from the free-rider, the "price" of helping drops to zero.

  **C. The Public Goods Game**
  This is the most critical economic concept for your argument. Helping behavior is a **public good** within the team.
  *   **Individual Rationality:** It is always individually rational to free-ride (accept help, don't give it) because you get the benefit without the cost.
  *   **Collective Rationality:** It is always collectively better if everyone helps.
  *   **The Nash Equilibrium:** In a system with pure individual incentives, the stable state is **under-supply of helping**. Everyone stops helping because they see others free-riding.

  Daniel claims the pattern of "helpers" is just correlation. But Game Theory predicts exactly what you are seeing: without a mechanism to internalize the externality (a team bonus), the system naturally drifts toward fewer helpers. The fact that your teams vary in helper-density due to "ordinary hiring and attrition" suggests you are running a natural experiment where some teams accidentally hit a high-trust equilibrium and others hit a low-trust one. The high-trust ones win. That is causation, not just correlation.

  ### 3. Implications for Bonus Redesign
  If Daniel were right, the solution would be better individual metrics (e.g., "count how many times you helped"). But measuring individual helping is expensive, prone to gaming (people logging fake help), and creates bureaucracy.

  The fact that the team level explains performance variance implies the bonus structure must **internalize the externality**. You need to make the individual care about the team outcome.

  **The Principled Solution: A Hybrid Model**
  You do not need to abandon individual incentives (which drive effort and accountability), but you must layer team incentives on top to drive *cooperation*.

  1.  **The Split:** Move to a weighted system. For example, 70% Individual / 30% Team.
      *   The 70% preserves Daniel's desire for accountability on individual output.
      *   The 30% aligns the "helper's" sacrifice with a reward. If my helping boosts the team's total output, I get a cut of that total, offsetting my individual loss.
  2.  **The Threshold:** To prevent free-riders from coasting on a superstar team, you can set a "gate." You only get the team bonus if your individual performance meets a minimum threshold. This satisfies Daniel's concern that everyone must pull their weight.
  3.  **The Peer Component:** Since management can't see all the helping, add a small peer-review component. Team members allocate a portion of the bonus pool to each other based on "collaboration." This fixes the attribution problem Daniel ignored.

  ### Summary for Your Argument
  When you speak to Daniel again, you can frame it this way:

  1.  **Acknowledge his logic:** "You are right that in a perfectly efficient market with perfect information, individual incentives would price in helping behavior."
  2.  **Identify the friction:** "But we have **positive externalities**. My helping benefits you, but I pay the cost. That is a market failure, not a category error."
  3.  **Cite the evidence:** "The data shows that individual maximization leads to a sub-optimal Nash Equilibrium (fewer helpers). Teams that accidentally escape this (more helpers) outperform. That variance is the 'team effect'."
  4.  **Propose the fix:** "We don't need to stop measuring individuals. We just need to add a team component to **internalize the externality**. We need to make it individually rational to be a helper."

  Daniel's view is theoretically clean but practically brittle. Your view acknowledges the messy reality of human collaboration. The bonus structure should reflect the reality, not the ideal.
