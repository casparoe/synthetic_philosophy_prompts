answer: |-
  This is an excellent pedagogical puzzle, and you are right to identify it as a pressure point in Hobbes's system. The tension you've isolated—between definition as mere verbal stipulation (the *Leviathan* passage) and definition as causal generation (the *De Corpore* doctrine)—is one of the most discussed cruxes in Hobbes scholarship. It goes to the heart of his nominalism, his epistemology, and his political theory.

  If you present this to your students as a flat contradiction, they will conclude Hobbes is sloppy. If you present it as a seamless unity, they may miss the radical nature of his nominalism. The most fruitful approach for a seminar is to treat this as a **categorical distinction between mathematical and physical objects** that allows the "stipulative" and "generative" accounts to collapse into one another *only* in the case of geometry.

  Here is a reconstruction of the interpretive options, ranked from the least to the most philosophically robust, along with a strategy for teaching the resolution.

  ### Option 1: The Contextual/Exoteric Reading
  **Thesis:** *Leviathan* and *De Corpore* have different aims, so "definition" is doing different work.

  *   **The Argument:** *Leviathan* is a work of political rhetoric aimed at preventing civil war. Its primary enemy is ambiguity and the abuse of language (e.g., calling rebellion "liberty"). In Chapter 4, Hobbes is concerned with the *social* function of definition: agreeing on terms to avoid dispute. *De Corpore*, conversely, is a systematic treatise on body and motion. There, "definition" must meet the rigorous standards of *scientia* (knowledge of causes).
  *   **Implication:** On this reading, the *Leviathan* passage is incomplete. It describes the *necessary condition* for truth (agreement on names) but omits the *sufficient condition* (that the names refer to generative causes).
  *   **Weakness:** This risks making Hobbes look inconsistent. It suggests he dilutes his epistemology for political convenience. It also fails to explain *why* geometry gets singled out in *Leviathan* as the model of truth if the definition provided there is merely stipulative.

  ### Option 2: The "Two-Stage" Reading
  **Thesis:** "Settling significations" is the first step, but Hobbes implies a second step of causal verification.

  *   **The Argument:** When Hobbes says geometers "begin at settling the significations," he is describing the *order of procedure*, not the full metaphysical account. You cannot demonstrate consequences from causes if you haven't first agreed on what the causes *are*. The "settling" is the act of stipulation, but the *content* of that stipulation is constrained by the requirement of generativity.
  *   **Implication:** There is no contradiction, only ellipsis. *Leviathan* focuses on the act of defining; *De Corpore* focuses on the content of the definition.
  *   **Weakness:** This is a bit defensive. It requires reading *De Corpore* into *Leviathan*. It doesn't fully explain *how* a stipulation becomes a cause.

  ### Option 3: The Constitutive Nominalist Reading (The Strongest Resolution)
  **Thesis:** In mathematics, stipulation *is* generation. Because mathematical objects have no existence outside the mind, defining them causally and defining them nominally are the same act.

  *   **The Argument:** This is the key to unlocking the passage for your students. Hobbes is a materialist and a nominalist. He believes universals do not exist in nature; they exist only as names we apply to our conceptions.
      *   **In Physics:** If I define "gold," I am referring to a body that exists independently of me. I cannot stipulate its properties; I must discover them. My definition is a report on nature. Therefore, physics lacks absolute certainty because I might be wrong about the nature of the thing.
      *   **In Geometry:** A "circle" does not exist in nature. It exists only as a conception in my mind. Therefore, I am not discovering what a circle *is*; I am deciding what counts as a circle. When I "settle the signification" by saying "a circle is generated by rotating a line around a fixed point," I am not describing a pre-existing object. I am **constituting** the object.
  *   **The Synthesis:** In geometry, the "signification of the word" *just is* the "generation of the figure." Because the object is mental/conceptual, the act of defining it (stipulation) creates the causal structure from which all future truths are derived.
  *   **Why this saves the argument:** This explains why geometry is certain and physics is not. In geometry, we know the truth of the propositions because we know the truth of the definitions, and we know the definitions because **we made them**. As Hobbes famously says, we demonstrate truth in math because "we ourselves are the makers of the very objects it studies."
  *   **Addressing your specific worry:** You asked, *"How does a merely stipulative fixing of a word's meaning come to carry causal information?"* The answer is: In Hobbes's ontology, for mathematical objects, there is no difference between the meaning of the word and the cause of the object. The meaning *is* the rule of construction.

  ### Option 4: The Political Analogy (The "Sovereign as Geometer" Reading)
  **Thesis:** The *Leviathan* passage is intentionally political. Hobbes is modeling the Sovereign's power on the Geometer's power.

  *   **The Argument:** This connects the epistemology back to the main point of *Leviathan*. Just as the geometer settles the signification of "circle" and thereby makes all subsequent geometrical truths binding, the Sovereign settles the signification of "Justice" or "Property."
  *   **Implication:** Before the Sovereign defines them, "Justice" is just a word with no referent (a state of nature). Once the Sovereign "settles the signification" (makes Civil Law), Justice becomes real and actionable.
  *   **Pedagogical Value:** This shows students that Hobbes's philosophy of math isn't a sidebar; it's the epistemological foundation of his absolutism. The certainty of geometry is the ideal to which civil science aspires.

  ### Seminar Strategy: How to Teach the Tension

  If I were leading this session, I would structure the discussion around three moves to help students navigate the "stipulation vs. causation" knot.

  **1. The "Unicorn vs. Gold" Test**
  Ask your students: "Can I define a unicorn?" (Yes: a horse with a horn.) "Can I define gold?" (Only by pointing to the metal.)
  *   *Point:* In the first case, the definition creates the object of study. In the second, the object constrains the definition.
  *   *Apply to Hobbes:* Hobbes thinks *all* universals are like unicorns (names without independent referents), but mathematical objects are *only* like unicorns. They have no extra-mental reality. Therefore, the definition is constitutive.

  **2. The "Truth in Propositions" Doctrine**
  Remind students of Hobbes's claim that "truth consisteth in the right ordering of names." Truth is not in the *thing* (the circle drawn in sand is imperfect); it is in the *proposition* (the logical consequence of the definition).
  *   *Resolution:* The *Leviathan* passage emphasizes the *names* (propositions). The *De Corpore* passage emphasizes the *consequences* (causes). They meet in the middle: We order the names correctly *by* encoding the cause in the definition.

  **3. The "God" Comment in *Leviathan***
  Draw attention to the phrase: *"the only science that it hath pleased God hitherto to bestow on mankind."*
  *   *Discussion:* Why only geometry? Because it is the only science where human reason mimics Divine Creation. God creates nature ex nihilo; the Geometer creates figures ex nihilo (from conception). Physics is just observing God's creation. This theological flourish supports the "Constitutive" reading: Geometry is certain because it is a creative act, not a discoverive one.

  ### Conclusion for Your Session

  To answer your specific questions directly:

  1.  **Are they the same notion?** Yes, but *Leviathan* describes the **act** (settling significations) while *De Corpore* describes the **constraint on the content** of that act (it must be generative).
  2.  **How does stipulation carry causal info?** Because in mathematics, the object *is* the conception. To stipulate the conception *is* to state the cause of the object's existence in the mind.
  3.  **Does the tension undercut the argument?** No, provided you accept Hobbes's nominalism. If you assume definitions must track mind-independent essences (Aristotelianism), Hobbes makes no sense. If you accept that definitions *create* mathematical essences, the tension dissolves.

  **Recommendation:** I suggest leading your students toward **Option 3 (Constitutive Nominalism)** but framing it through **Option 4 (Political Analogy)**. This allows you to show how Hobbes's "idiosyncratic" math philosophy is actually the engine of his political theory. The Sovereign does for "Justice" what the Geometer does for "Circle": settles the signification so precisely that dispute becomes impossible.

  This approach respects the text, acknowledges the scholarly difficulty, and gives your students a robust philosophical tool to understand why Hobbes thinks math is certain while physics (and unregulated politics) is not.
