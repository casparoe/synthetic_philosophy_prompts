  # The Second-Hand Sublime: A Defense of Optimism in Aesthetic Testimony

  Imagine a student, Elena, who has never listened to Mahler. A musicologist she deeply trusts tells her, "The adagietto of Mahler's Fifth Symphony is profoundly moving." Elena accepts this claim on the basis of the testimony alone. She forms the belief that the piece is moving. Does Elena *know* the piece is moving? Or does she merely possess a true belief, parroting a verdict she is epistemically barred from holding?

  This is the puzzle of aesthetic testimony. It sits at the uncomfortable intersection of general epistemology and the specific norms of aesthetic practice. On one side stand the **Pessimists**, led prominently by Robert Hopkins, who argue that there is something defective about aesthetic belief formed solely on testimony. On the other stand the **Optimists**, who argue that aesthetic testimony functions like testimony in any other domain (history, geography, science) and that denying this is a form of elitist snobbery.

  To resolve this, we must first lay out the strongest versions of both positions, examine how this debate maps onto the parallel controversy over moral testimony, and then adjudicate the winner. While the Pessimist intuition captures something vital about the *value* of aesthetic experience, the Optimist is correct about the *epistemology*. Testimony can yield genuine aesthetic knowledge, provided specific conditions of conceptual competence and reliability are met. However, acknowledging this requires us to distinguish between *knowing that* a work has value and *appreciating* that value.

  ### The Pessimist Case: Acquaintance and Autonomy

  The Pessimist does not deny that a critic might be reliable. They deny that reliability is sufficient for justification in the aesthetic domain. The core of the Pessimist position rests on two pillars: the **Acquaintance Principle** and the **Autonomy Constraint**.

  The Acquaintance Principle, famously articulated by Richard Wollheim, posits that aesthetic judgments must be based on first-hand experience of the object. One cannot judge a painting beautiful without seeing it. Hopkins extends this from judgment to belief. He argues that aesthetic properties (like "subtle," "garish," or "moving") are response-dependent. To believe a poem is subtle is to believe it is disposed to elicit a specific response in suitable observers. If Elena forms this belief solely on testimony, she lacks the experiential ground that gives the concept "subtle" its content in this context. She is not tracking the property; she is tracking the critic's opinion.

  This leads to the "Why?" Challenge. If Elena is asked *why* the Mahler is moving, she can only say, "Because the critic said so." She cannot point to the harmonic resolution or the tempo rubato. For the Pessimist, this inability to cite the grounds of the judgment reveals a defect in the belief itself. It is not merely that Elena lacks *understanding*; it is that her belief is unjustified. In the aesthetic realm, justification requires a connection to the features of the object that only experience can provide.

  Furthermore, Pessimists lean on a norm of **Aesthetic Autonomy**. Aesthetic verdicts are thought to be something one must "earn." To accept a verdict on authority is to surrender one's autonomy as an appreciator. It treats the artwork as a fact to be cataloged rather than an experience to be undergone. For the Pessimist, a belief formed via testimony might be true, but it is epistemically second-class—mere "true belief" rather than knowledge—because it bypasses the requisite cognitive engagement with the object.

  ### The Optimist Case: Epistemic Parity

  The Optimist argues that the Pessimist is applying a special, unjustified set of rules to art that we do not apply elsewhere. This is the argument from **Epistemic Parity**. If a historian tells Elena that the Treaty of Versailles was signed in 1919, she knows it. If a physicist tells her that gravity bends light, she knows it. Why should art be different?

  Optimists, such as Elizabeth Burns and Aaron Meskin, argue that testimony is a fundamental source of knowledge. If a testifier is reliable and the recipient has no defeaters (reasons to doubt), the resulting belief is justified. To deny this in aesthetics is to succumb to a form of "aesthetic individualism" that borders on snobbery. It implies that the expertise of critics is illusory. If Pessimism were true, art criticism would be pointless; a critic could never convey knowledge to a reader, only prompt them to go look for themselves. But we do learn from critics. We avoid bad movies and seek out good books based on reviews. If this process never yielded knowledge, our engagement with art culture would be systematically irrational.

  The Optimist also distinguishes between the *formation* of the belief and the *appreciation* of the object. They concede that Elena cannot *appreciate* the Mahler via testimony—she won't feel the chills. But appreciation is an emotional or experiential state, whereas knowledge is a propositional attitude. One can know a wine is complex (based on a sommelier's say-so) without tasting the complexity. The Optimist argues the Pessimist conflates the *value* of the experience with the *justification* of the belief.

  ### The Moral Testimony Parallel

  The aesthetic testimony debate is often viewed through the lens of the **moral testimony** debate. Here, too, there are Pessimists (like Alison Hills and Daniel Nickel) who argue that believing a moral proposition on testimony (e.g., "Eating meat is wrong" because a philosopher says so) undermines moral worth or agency.

  The mapping is instructive but imperfect.
  *   **Similarities:** Both debates turn on **autonomy**. In morality, acting on testimony seems to bypass moral deliberation, rendering the agent less praiseworthy. In aesthetics, believing on testimony bypasses perceptual engagement, rendering the appreciator passive. Both domains involve "thick" concepts (good, beautiful) that seem to require a grasp of the reasons behind them.
  *   **Differences:** Moral testimony is often action-guiding. If I believe "stealing is wrong" on testimony, I must act accordingly. If I lack understanding of *why*, my action is fragile. Aesthetic testimony is less action-heavy; it guides attention, not necessarily conduct. Furthermore, moral facts are often treated as mind-independent (depending on one's meta-ethics), whereas aesthetic properties are explicitly response-dependent. This makes the "Acquaintance" requirement feel more natural in aesthetics: if beauty is about *my* response, how can you tell me what *my* response should be?

  However, the Optimist in the moral domain argues that testimony can yield moral *knowledge* even if it doesn't yield moral *wisdom*. This distinction is the key to unlocking the aesthetic puzzle.

  ### The Verdict: Optimism with Conditions

  The Pessimist position is phenomenologically powerful—it *feels* wrong to claim knowledge of a poem one hasn't read. However, feeling wrong is not being wrong. The Pessimist makes a category error: they conflate the norms of **appreciation** with the norms of **knowledge**.

  I argue for **Epistemic Optimism**. Testimony *can* provide real aesthetic knowledge, not mere true belief. The Pessimist's "Acquaintance Principle" is a norm of *appreciation*, not epistemology. It tells us how we ought to engage with art to get the most out of it, not how we are permitted to form true beliefs about it. If Elena trusts a reliable critic, her belief is formed via a reliable process. To deny her knowledge is to demand an impossible standard of epistemic self-sufficiency that would cripple our ability to navigate a culture saturated with art we haven't personally experienced.

  However, to secure this victory for Optimism, we must specify the conditions under which testimony yields knowledge rather than parroting. It is not enough to simply trust a source. Two specific conditions must be met:

  **1. Conceptual Competence:**
  Elena must possess the relevant aesthetic concepts. If the critic says the poem is "subtle," Elena must know what "subtle" means. She must be able to distinguish subtlety from bluntness in *some* contexts, even if she hasn't recognized it in *this* poem yet. If she lacks the concept, she is merely repeating a sound. Testimony transmits justification, but it cannot transmit concept possession. If the concept is purely recognitional (i.e., you only know "red" if you can spot red), testimony fails. But aesthetic concepts are not purely recognitional; they are partly descriptive. One can learn what "balanced" or "melancholic" means through description and prior experience. If Elena has the conceptual toolkit, testimony can license the application of that toolkit to the new object.

  **2. Alignment of Taste (The "Suitable Observer" Condition):**
  Because aesthetic properties are response-dependent, the testimony is not just "X is good," but implicitly "X is good *for observers like us*." For Elena to gain knowledge, she must have reason to believe her sensibilities align with the critic's. If she knows she hates jazz and the critic loves it, the testimony "This jazz track is exciting" does not justify her belief that *she* will find it exciting, nor that it *is* exciting in a way that matters to her. Knowledge requires that the testifier be a reliable proxy for the believer's own potential response. When this alignment is established (through past track records of agreement), the testimony functions as evidence of the work's disposition to elicit a response in the believer.

  ### Conclusion

  The Pessimist is right that testimony-based belief is *aesthetically deficient*. It leaves Elena unable to cite the features of the work, unable to feel the emotional impact, and unable to participate fully in the practice of criticism. It is a "hollow" knowledge. But hollow knowledge is still knowledge.

  To deny Elena knowledge is to protect a romanticized ideal of the solitary aesthetic genius at the cost of epistemic reality. We live in a world of distributed cognition. We rely on experts to tell us about black holes, ancient history, and, yes, art. The Optimist view acknowledges that while testimony cannot replace the *experience* of art, it can validly inform our *beliefs* about it. Elena knows the Mahler is moving, even if she hasn't heard it. She just hasn't yet understood *why*. And while understanding is the goal of aesthetics, knowledge is its prerequisite. We should not deny the prerequisite just because the goal is higher.
