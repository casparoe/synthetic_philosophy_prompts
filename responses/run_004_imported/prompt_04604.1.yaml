      *   **The Task:** Explain what the missing "experience" amounts to in Locke's terms, determine if there's a genuine tension (inconsistency) or if they can be reconciled, and provide a detailed reconstruction suitable for a seminar discussion.

  2.  **Deconstruct the Locke Texts:**
      *   **Book II, Chapter V (Of Simple Ideas of Divers Senses):** Locke lists ideas like Space, Extension, Figure, Motion, Rest. He says they are "common to more senses than one." He argues they come by both sight and touch.
          *   *Interpretation A (Strong Identity):* The idea *itself* is numerically identical regardless of the sense. (This leads to the user's confusion).
          *   *Interpretation B (Resemblance/Abstraction):* The ideas *resemble* each other closely enough to be subsumed under the same name, but they originate as distinct modifications of distinct senses.
      *   **Book II, Chapter IX (Of Perception, Section 8 - Molyneux):** Locke agrees with Molyneux: No, the blind man can't tell. Why? Because he lacks the *experience* that "what affects his touch so or so, must affect his sight so or so."
          *   *Key Concept:* Association of ideas. The link isn't innate or immediate; it's learned through constant conjunction.

  3.  **Evaluate the Tension (The "Professor's Aside"):**
      *   Is it a contradiction? On the surface, yes. If Figure is *one* idea gotten by two senses, why can't Sense B recognize what Sense A knew?
      *   However, Locke scholars (e.g., Berkeley later critiques this, but contemporaries like Lowry, Atherton, or even Locke's own nuances) often argue for a distinction between the *abstract idea* of figure and the *specific sensory modification*.
      *   *Locke's Nuance:* Locke often speaks loosely. When he says "we get idea X by sight and touch," he might mean "we get ideas that we *call* X by sight and touch."
      *   *The Role of Judgment:* In Chapter IX, Locke emphasizes that perception isn't just passive reception; it involves judgment. The "experience" Molyneux mentions is the judgment linking the visual appearance (a flat circle with shading) to the tactile solid (a sphere).
      *   *The Nature of the "Idea of Figure":* For Locke, the tactile idea of a cube is a sensation of pressure/Resistance + Extension. The visual idea is Light + Color + 2D Extension. The "3D Figure" is a construction of judgment based on these inputs.

  4.  **Formulate the Argument/Reconstruction:**

