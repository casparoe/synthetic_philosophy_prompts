          *   The "Idea of the Cube" as a 3D object is a *judgment* formed by associating the 2D visual appearance with the 3D tactile experience.
          *   The "missing experience" is the associative link (custom/habit) between the visual appearance (shadowed circle) and the tactile reality (solid sphere).
      *   **Reconciling the Two:**
