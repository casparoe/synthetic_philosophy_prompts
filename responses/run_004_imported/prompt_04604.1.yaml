      *   **Clarify Chapter V (Common Sensibles):** Explain that "common sensibles" doesn't necessarily mean *numerically identical* ideas in the mind at the moment of sensation. It means ideas that *can* be derived from multiple sources and share a structural resemblance. Locke is often talking about the *capacity* to generate ideas of extension/figure, not that the phenomenological content is identical.
      *   **Clarify Chapter IX (Molyneux & Judgment):** Focus on the distinction between *Sensation* and *Judgment*.
