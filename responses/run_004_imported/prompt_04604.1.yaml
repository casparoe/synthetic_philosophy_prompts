          *   *Option 2 (Admitting Tension):* Locke is inconsistent. He wants to be an empiricist about association (Molyneux) but also wants to maintain a realist geometry (Chapter V). Berkeley later pounces on this to say "Visible Figure" and "Tangible Figure" are entirely heterogeneous.
          *   *Best Seminar Position:* It's a tension, but one Locke tries to manage via the theory of *Judgment*. The "Idea" in Chapter V is the *result* of the process described in Chapter IX.
