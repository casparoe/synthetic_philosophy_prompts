      *   *Section 4: Reconciliation vs. Tension.*
          *   *Reconciliation:* Chapter V describes the mature mind. Chapter IX describes the transitional moment. The "Idea of Figure" is a complex idea requiring the synthesis of senses.
          *   *Tension:* Locke sometimes writes as if the idea is immediately transferable.
