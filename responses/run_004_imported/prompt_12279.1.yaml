answer: |-
  Hi everyone. For those who don't know me, I'm Priya's younger sibling. I'm sixteen, which means I'm currently at that age where I assume everyone in the room is judging me. But then I remember that half of you are philosophy grad students, and I realize you're probably analyzing the semantic implications of my handshake. So, I'm trying not to stress.

  Priya asked me to speak, but she and Daniel gave me one strict rule: No talk of fate. No soulmates. No "written in the stars."

  At first, I thought that made my job harder. But then I remembered Thanksgiving. Daniel spent twenty minutes explaining David Lewis's theory of *Convention* to me. For the non-philosophers—like my Grandma—Lewis argues that a convention is just a solution to a coordination problem. Like, if a phone call drops, who calls back? There's no law of physics saying it has to be the original caller. But we all agree to do it, because we know the other person expects us to. It works because we all know that we all know it works.

  Daniel and Priya joke that their relationship is a "coordination equilibrium." But I've been watching them, and I think they're underselling it.

  See, "soulmates" implies that love is magic. It implies you just find the missing piece and everything clicks automatically. But Lewis's idea is actually much more romantic. Because a convention isn't found; it's *built*.

  Priya and Daniel don't work because the universe forced them together. They work because, every single day, they solve the coordination problem of being two different humans in one life. They decide who calls back. They decide how to listen. They decide to prioritize each other's happiness, and crucially, they make sure the other person *knows* they've decided that.

  In game theory, an equilibrium is stable. But in marriage, that stability isn't static. It's active. It's the choice, made thousands of times, to maintain the convention of "us."

  To the philosophers here: You know that common knowledge creates a shared world.
  To the rest of the family: It means they are on the same team, always.

  Priya, Daniel: You say you don't believe in destiny. But looking at the way you coordinate, the way you anticipate each other's moves, the way you've built a private language of expectations and care... it looks pretty miraculous to me. It's not that you were destined to be together. It's that you destined yourselves to be together.

  So, if everyone could raise a glass.

  To Priya and Daniel. May your coordination problems always be solvable, may your common knowledge always be kind, and may you never have to worry about who calls back.

  To the happy couple.
