answer: |-
  This is a remarkably sharp observation, and it cuts to the heart of both aesthetic philosophy and the unspoken ethics of academic discourse. You are right to sense an asymmetry here. It is not merely gatekeeping, nor is it simply embarrassment; there is a genuine epistemological and phenomenological difference between accepting a factual claim on testimony and accepting an aesthetic verdict on testimony.

  Your colleague was principled, if perhaps blunt, in her objection. Here is a breakdown of why that asymmetry exists, why it matters specifically in your discipline, and how to navigate it in the future.

  ### 1. The Asymmetry: Propositional Knowledge vs. Experiential Judgment

  You noted that you happily accept historical or scientific claims on testimony. This is because those claims are largely **propositional** and **mind-independent**.
  *   **Fact:** "The Battle of Hastings occurred in 1066." This is true regardless of whether you visit the battlefield. Testimony is a valid vehicle for this truth.
  *   **Description:** "The novel uses a fragmented structure." This is an observable feature of the text. A critic can report this, and you can accept it as data.

  However, aesthetic verdicts are **response-dependent** and **phenomenological**.
  *   **Verdict:** "The structure fails to earn the emotional payoff."

  This claim is not just about the text; it is about the *interaction* between the text and a reader's experience over time. In aesthetics (drawing from Kant and Hume), a judgment of taste claims a kind of universal validity, but it is grounded in a specific feeling (*sensus communis*). When you assert that verdict as your own "considered opinion," you are implicitly claiming to have undergone the experience that generated the verdict.

  If you haven't read the ending, you literally cannot verify the claim that the payoff wasn't earned. You are treating an experiential conclusion as a factual premise. In science, you can trust the measurement; in art, the "measurement" *is* the experience. By bypassing the experience, you bypassed the only evidence that supports the verdict.

  ### 2. The Problem of "Standing" in Literary Studies

  In a Comparative Literature PhD group, "standing" is not just about social permission; it is about **methodological integrity**.

  Literary criticism is distinct from journalism or marketing. In a review, a critic's job is to tell a potential reader whether to spend money on a book. In a doctoral reading group, the job is to model rigorous engagement with the text.

  When you presented the verdict as your own, you collapsed the distinction between **secondary criticism** (what others say about the text) and **primary analysis** (what you derive from the text).
  *   **Acceptable:** "Kermode and Smith both argue that the ending fails to land."
  *   **Problematic:** "The ending fails to land." (When you haven't read it).

  The latter implies you have done the labor of reading and synthesizing the whole. In our field, the labor of reading *is* the data collection. Claiming a conclusion without the data is methodologically unsound, even if the conclusion turns out to be correct. Your colleague wasn't gatekeeping your status as a student; she was policing the boundary between *reporting on criticism* and *doing criticism*.

  ### 3. Why the Descriptive Claims Passed Unchallenged

  Your observation that no one batted an eye at the descriptive claims (structure, motifs, influences) confirms the asymmetry.
  *   **Descriptive/Interpretive:** "The book borrows from Author X." This is a claim about the text's architecture. It can be transmitted via testimony because it doesn't require you to *feel* the borrowing to acknowledge its existence.
  *   **Evaluative:** "The book is unsuccessful." This requires you to feel the failure.

  Descriptive claims are about the *object*. Evaluative claims are about the *effect*. You can know the object exists without touching it; you cannot know the effect without being the subject of it.

  ### 4. Was it Gatekeeping or Principle?

  It is easy to feel defensive and interpret this as gatekeeping ("You haven't paid your dues"). However, consider the alternative. If aesthetic verdicts were fully transferable via testimony, the act of reading would become obsolete. We could simply read the aggregate score on Goodreads or the *NYRB* and hold those opinions as our own.

  While we do this casually, in an academic setting, it undermines the purpose of the discipline. Your colleague's pushback protects the value of the reading process itself. She was asserting that in literary studies, **the journey is the evidence.**

  That said, her delivery ("no standing") was aggressive for an informal group. But the core point was valid: You claimed epistemic authority over an experience you did not have.

  ### 5. Moving Forward: Intellectual Honesty as Strategy

  You do not need to carry shame over this. This is a common tension in graduate school, where the pressure to contribute often outstrips the time available to read. However, you can adjust your framing to maintain integrity without silence.

  **The "Meta-Critical" Pivot:**
  In the future, if you are pressed for time, you can contribute without misrepresenting your engagement.
  *   *Instead of:* "The structure doesn't work."
  *   *Try:* "I haven't finished the text yet, but I'm struck by how consistently the reviews argue the structure fails. Given the fragmentation I saw in the first third, I'm curious if the ending resolves that or exacerbates it. What was your experience of the payoff?"

  This achieves three things:
  1.  **Honesty:** You disclose your reading status (which actually invites collaboration rather than judgment).
  2.  **Synthesis:** You still bring the research (the reviews) to the table.
  3.  **Invitation:** You turn the verdict into a question for those who *did* finish, positioning yourself as an engaged interlocutor rather than a pseudo-authority.

  ### Conclusion

  Your colleague was right about the principle, even if the moment felt uncomfortable. There is a genuine asymmetry between aesthetic verdicts and factual claims because aesthetic verdicts are reports on a subjective experience that you cannot outsource.

  In the sciences, you trust the instrument. In the humanities, *you* are the instrument. Claiming the reading of the instrument without running the test is what triggered the objection. It wasn't about your status as a PhD student; it was about the nature of the claim you made.

  Take this not as a rebuke of your competence, but as a clarification of the specific epistemic norms of your field. You can still use reviews to contribute, provided you frame them as *testimony about the reception* rather than *evidence of the text's value*. That distinction preserves your intellectual honesty and keeps you on solid ground.
