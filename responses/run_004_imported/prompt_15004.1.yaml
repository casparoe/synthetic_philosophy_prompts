answer: |-
  Good evening. For those of you who don't know me, I'm a friend of [Bride's Name]. And for those of you who do know me, you know why I look slightly terrified.

  [Bride's Name] agreed to let me give this toast on one condition: that I avoid the usual wedding platitudes. She asked me to ground this in the philosophy she has been living with for the last few years: the work of Émilie du Châtelet.

  Now, for the family: Du Châtelet was an 18th-century mathematician and physicist who translated Newton and argued that women's minds were capable of the same rigor as men's. For the reading group in the back: yes, I mean the *Discours sur le bonheur*. And yes, I know the brief. No sanding down the edges.

  So, here is the challenge. We are at a wedding. Weddings are traditionally about the supremacy of romantic love. They are about "forever" and "completing one another." But Du Châtelet is quite clear on a few things that sound, at first blush, anti-romantic. She argues that passionate love is merely one good among many, not the sole purpose of existence. She writes plainly that the fire of passion *must* cool with time. She tells us that study and the life of the mind are the only sources of happiness that do not fade with age or depend on the whims of others.

  If I were giving a standard toast, I'd tell you that [Groom's Name] is the missing piece of her puzzle. But [Bride's Name] is not a puzzle. She is a whole, complete, formidable intellect. She was whole when she was widowed, she was whole while she was learning French to read philosophy in the original, and she is whole today.

  So why marry? Why do this now, at sixty-two?

  I think the answer lies in another of Du Châtelet's sharper insights: the necessity of illusion. She argues that we cannot bear the stark truth of the world without decoration. We need "taste," we need illusion, to make life habitable and sweet.

  In that spirit, [Bride's Name] and [Groom's Name], I propose that this marriage is a chosen illusion. It is a agreement to look at one another and see not just the biology or the history, but the best possible version of the other. It is a commitment to decorate the truth with kindness.

  Du Châtelet warns us that passion cools. I think that is actually good news for you both. It means you don't have to sustain the fever of the first year for the next thirty. You are allowed to settle into what she might call a "taste"—a steady, reliable preference for each other's company. You are building a partnership where the cooling of the fire makes room for the warmth of the hearth.

  And crucially, this is a partnership that protects her solitude. Du Châtelet insists that study is the steadiest happiness because it depends on no one else. [Groom's Name], part of loving her is loving the part of her that belongs to mathematics, to her reading group, to the quiet hours where she is not a wife but a thinker. You are not here to be her everything. You are here to be the companion who ensures she has the time and peace to be herself.

  For the family and friends who just want to know that she is loved: She is. But she is loved in a way that respects her autonomy. This isn't a rescue mission. It is an alliance.

  Du Châtelet wrote that happiness is a journey, not a destination, composed of many small tastes. It is the taste of a difficult problem solved. It is the taste of a good meal. It is the taste of friendship. And yes, it is the taste of love, provided we don't ask love to do work it wasn't designed to do.

  [Bride's Name], you have taught us that we need our illusions. So tonight, we indulge in the beautiful illusion that time stands still. But tomorrow, we celebrate the reality that you have chosen to walk through time with a partner who respects your mind, your history, and your need for truth.

  So, if everyone could raise a glass.

  To [Bride's Name] and [Groom's Name]. May your passion cool into enduring friendship, may your illusions be kind, and may your study—and your love—remain independent, resilient, and entirely your own.

  To happiness.
