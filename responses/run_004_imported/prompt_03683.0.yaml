answer: |-
  You are definitely not misremembering, and Dana's reading, while a common *libertarian* inference, is actually contradicted by Nozick's explicit text in *Anarchy, State, and Utopia* (ASU).

  You have spotted a genuine tension in Nozick's work that philosophers have debated for decades. Dana is applying a strict "rational agency" criterion (often associated with Kant or Locke) to Nozick's framework, but Nozick himself explicitly rejects that criterion when discussing animals.

  Here is the breakdown of where Dana goes wrong, where your memory is right, and how you can use this for your assignment.

  ### 1. The Textual Evidence (You are right about the footnote)
  The discussion occurs in **Chapter 3 ("Moral Constraints and Why")**, specifically in the section where Nozick is justifying *side constraints* (rights that cannot be violated even for the greater good).

  While the main argument is in the text (pp. 39–42 in the standard 1974 edition), **Footnote 12** is the famous one you are recalling. In it, Nozick writes:

  > *"Utilitarian theory is embarrassed by the possibility of utility monsters who get enormously greater sums of utility from any sacrifice of others than anyone else loses... [but] we feel that... we cannot do to animals just anything we please."*

  More importantly, in the main text leading up to that footnote, Nozick asks: **What is the basis for rights?** If it is rationality or moral agency, what do we say about humans who lack those capacities (e.g., infants, the cognitively disabled, the senile)?
  *   If we say they have rights *despite* lacking rationality, then rationality isn't the necessary condition.
  *   If we say they *don't* have rights, that seems morally repugnant.
  *   Therefore, Nozick suggests that **sentience (the capacity to suffer)** plays a crucial moral role.

  ### 2. Nozick's Actual View on Animals
  Nozick does **not** conclude that animals are morally equivalent to hammers or land. He argues that there *are* moral constraints on how we treat them.

  *   **Against "Mere Resources":** He explicitly states that we cannot treat animals however we wish. Factory farming, for example, would likely violate Nozickian constraints because it inflicts massive suffering without sufficient justification.
  *   **The "Utilitarianism for Animals" Concession:** This is the tricky part. Nozick admits that his strict anti-utilitarianism (which forbids sacrificing one human to save five) might not apply to animals in the same way. He suggests a hybrid view: **Kantianism for humans, Utilitarianism for animals.**
      *   For humans: We are separate persons; we cannot be used as means.
      *   For animals: Their suffering counts, and we might weigh total suffering against total benefit, but we cannot ignore it entirely.

  So, Dana is right that animals don't have *political* rights (they can't vote, own property, or consent to contracts), but she is wrong that they have *no* moral status. For Nozick, owning an animal does not give you the right to torture it.

  ### 3. How to Apply This to Your Assignment
  This is actually a goldmine for a seminar paper because it highlights a potential inconsistency or necessary complication in Nozick's theory. Here is how you can structure your counter-argument to Dana:

  **A. The "Marginal Cases" Argument**
  Point out that if Nozick grounded rights *solely* in rational agency (as Dana claims), he would have to deny rights to severely cognitively disabled humans. Since Nozick wants to protect those humans, he must ground rights (or at least moral protections) in something broader, like sentience. This opens the door for animal protection.

  **B. Side Constraints vs. Utilitarian Weight**
  Dana argues that because animals can't be "rights-bearers," their suffering doesn't matter. You can argue that Nozick distinguishes between:
  1.  **Inviolability:** Humans have side constraints that forbid using them as means.
  2.  **Moral Weight:** Animals have interests (avoiding pain) that create constraints on owners, even if those constraints aren't absolute "rights."
  *Application:* A Nozickian state might not ban animal ownership, but it could regulate or ban cruel practices (like factory farming) because the owner's property rights are limited by the moral status of the sentient creature they own.

  **C. The Theoretical Tension (The "Aha!" Moment)**
  The strongest part of your paper can acknowledge that Nozick never fully resolved this. He admits in Footnote 12 that incorporating animals into his framework creates problems for his rejection of utilitarianism.
  *   *Argument:* "A consistent Nozickian cannot simply dismiss animals as property (Dana's view), but incorporating them requires modifying the strict 'separateness of persons' argument that grounds the Minimal State."

  ### Summary for Your Seminar
  *   **Dana's View:** Animals = Property. No rights. Factory farming is permissible. (This is the standard *Lockean* libertarian view, but not Nozick's specific view).
  *   **Your View:** Nozick explicitly grants animals moral status based on sentience. He argues against the idea that they are mere resources. While they may not have full "human rights," there are side-constraints on how they can be treated.
  *   **The Verdict:** You are right about the text. Dana is applying a generic libertarian framework, but ignoring Nozick's specific philosophical moves in Chapter 3.

  If you want to impress the seminar, point out that Nozick's hesitation on animals reveals that **self-ownership** might not be the *only* foundational value in ASU; **the moral significance of suffering** is also doing heavy lifting, even if Nozick doesn't fully integrate it into his Entitlement Theory.
