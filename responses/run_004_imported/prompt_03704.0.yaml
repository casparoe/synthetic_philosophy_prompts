answer: |-
  This is a profound philosophical disagreement that cuts to the heart of non-consequentialist ethics. Your friend has raised what is known in the literature as the **"redescription objection"** to the Doctrine of Double Effect (DDE). It is a powerful critique, championed by philosophers like Jonathan Bennett and Judith Jarvis Thomson, who argue that the distinction between intending and foreseeing is linguistically malleable and therefore morally inert.

  However, to claim the distinction is *empty* is too strong. While it is susceptible to manipulation, it is not logically bankrupt. Defenders of DDE (such as Thomas Scanlon, Warren Quinn, and Alfred Mele) argue that intention is not merely a verbal report but a structural feature of an agent's practical reasoning.

  Here is the strongest principled defense of the distinction, structured according to your three requirements.

  ### 1. The Criterion: Explanatory Dependency

  To prevent the distinction from collapsing into arbitrary redescription, we must anchor it not in the agent's *post-hoc verbal claims*, but in the **structure of the agent's plan**.

  **The Criterion of Explanatory Dependency:**
  An outcome $X$ (e.g., civilian death) is intended as a means to end $Y$ (e.g., surrender) if and only if the occurrence of $X$ plays a necessary **explanatory role** in the agent's rationale for why the action will achieve $Y$.

  Conversely, $X$ is merely foreseen if the agent's plan would still be **conceptually coherent and effective** even if $X$ did not occur, provided the primary causal mechanism remained intact.

  **The Counterfactual Test:**
  To apply this, ask: *If the harmful outcome could have been magically separated from the action, would the agent regard the action as a failure or a success?*
  *   **Intended Means:** If the harm *fails* to occur, the plan fails. The agent needs the harm to happen to get the good.
  *   **Foreseen Side Effect:** If the harm *fails* to occur, the plan succeeds even better. The harm is not doing the work; it is waste product.

  This criterion is non-question-begging because it does not ask "Did they feel like murderers?" It asks, "What was the causal logic of their strategy?"

  ### 2. Application to Truman and the Atomic Bombings

  When we apply the **Explanatory Dependency Criterion** to the decision to drop the atomic bombs on Hiroshima and Nagasaki, the distinction holds firm against the redescription objection.

  **The Strategic Logic:**
  The stated aim was indeed "to end the war." However, we must look at *how* the bombs were supposed to achieve that. The United States Strategic Bombing Survey and contemporary memos indicate that the unique value of the atomic weapon was not just its explosive yield, but its **psychological impact**. The mechanism of coercion was **terror**.

  **Applying the Counterfactual Test:**
  Imagine a scenario where the bombs were dropped on Hiroshima and Nagasaki, but through some anomaly, they destroyed the buildings without killing the civilians (perhaps everyone was evacuated, or the radiation was non-lethal).
  *   **Question:** Would Truman and his advisors have considered the mission a success in terms of coercing surrender?
  *   **Answer:** No. The coercive power of the bomb relied on the demonstration of the ability to annihilate populations. The "shock" to the Japanese leadership was predicated on the visual and physical reality of mass civilian death.

  Because the civilian deaths were the **causal lever** used to pry open the Japanese surrender, they satisfy the Explanatory Dependency Criterion. The deaths were not just a byproduct of destroying a military target; the destruction of the civilian center *was* the message. To redescribe this as "destroying war capacity" is to ignore that the *method* of destroying that capacity was the terrorization of the populace. The plan relied on the deaths to function. Therefore, under Anscombe's framework, the deaths were intended as a means.

  Your friend argues that planners could simply say, "We intended to destroy capacity, deaths were side effects." The Criterion replies: *That is a false description of the plan.* If the deaths hadn't happened, the capacity might have been physically damaged, but the *political will* to surrender (the actual goal) would not have been broken in the same way. The deaths were instrumentally necessary.

  ### 3. Application to a Contrasting Case (The Munitions Factory)

  To show this criterion is not gerrymandered solely to condemn Truman, we must apply it to a case Anscombe and standard DDE proponents treat as permissible: **The Bombing of a Munitions Factory.**

  **The Scenario:**
  Allied bombers target a factory producing guidance systems for V-2 rockets. The factory is located in a city. Due to the inaccuracy of bombs at the time, it is foreseen with certainty that nearby tenement housing will be hit, killing civilians.

  **Applying the Explanatory Dependency Criterion:**
  *   **The Plan:** Destroy the machinery $\rightarrow$ Stop rocket production $\rightarrow$ Win the war.
  *   **The Counterfactual Test:** Imagine the bombs hit the factory with perfect precision, destroying the machinery but killing *no* civilians.
      *   **Question:** Would the commanders regard this as a failure?
      *   **Answer:** No. They would regard it as a *better* outcome. The death of the civilians contributes nothing to the destruction of the machinery. In fact, their survival would be preferable.

  **The Distinction:**
  In the Munitions Factory case, the civilian deaths are **causally inert** regarding the military objective. The factory is destroyed by the explosion, not by the deaths of the neighbors. The deaths are a tragic, foreseen, but *explanatorily unnecessary* byproduct.

  In the Atomic Bombing case, the civilian deaths are **causally active**. They are the source of the terror that drives the surrender.

  This demonstrates that the distinction is not merely about "how we describe the goal" (win the war), but about **the causal pathway selected to achieve it.** The criterion successfully distinguishes between harm that is *used* (Truman/Atomic) and harm that is *suffered* (Factory/Collateral), without relying on the agent's sincere but potentially self-deceived verbal reports.

  ### 4. A Necessary Caveat (Where Your Friend is Right)

  While the distinction is not *empty*, your friend is correct that it is **fragile**.

  The Explanatory Dependency Criterion only works if we are willing to scrutinize the **actual causal mechanisms** of a plan rather than accepting the agent's stated goals at face value. If we allow agents to define their own aims without external scrutiny ("I didn't intend to kill them, I intended to stop the war"), then yes, the distinction collapses into special pleading.

  Anscombe's confidence comes from her belief that the causal link between "mass civilian death" and "surrender via terror" is so obvious that no honest practical reasoning could obscure it. Your friend's skepticism is healthy because history shows that agents *do* routinely redescribe their means as side effects to avoid moral culpability (e.g., "collateral damage" rhetoric).

  **Conclusion:**
  The intending/foreseeing distinction is not logically empty. It tracks a real difference in the **structure of practical reasoning**: specifically, whether a bad outcome is a *tool* in the plan or *waste* from the plan.
  *   In the **Atomic Bombings**, civilian death was the **tool** (the source of terror).
  *   In **Collateral Damage**, civilian death is the **waste** (unrelated to the destruction of the target).

  Anscombe is right that the distinction exists, but your friend is right that it requires rigorous, external analysis of the plan's mechanics to prevent it from being manipulated. It is a substantive moral distinction, but it is not a self-executing one.
