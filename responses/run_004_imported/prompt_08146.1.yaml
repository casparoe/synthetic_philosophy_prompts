          *   If Newton says "God chooses the distribution," he accepts that the future is not determined by the past + laws. He accepts radical indeterminism.
          *   *Newton's Character:* Newton was a determinist (clockwork universe, prophecy aside). He valued the predictive power of his laws. Accepting that the state of the world *inside* the hole is fundamentally undetermined by the state *outside* contradicts the Newtonian ethos of universal causation.
          *   *Verdict:* This move is costly. It saves substantivalism but kills determinism.

      *   *Option B: Sophisticated Substantivalism.*
