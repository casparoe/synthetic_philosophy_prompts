answer: |-
  **Setting:** *The lobby of the conference hotel. It is 4:30 PM on a Saturday. The air smells of stale espresso and laminated name badges. **Marcus** (Process Theorist) is stirring a black coffee. **Elena** (Difference-Maker) is balancing a latte and a plate of cookies.*

  **Marcus:** Nice talk, Elena. Though I suspect you know I'm still in the camp that thinks you're chasing a ghost.

  **Elena:** *(Smiling)* Good to see you too, Marcus. I assume you mean the section on omission causation?

  **Marcus:** Precisely. You're treating "not watering the plant" as ontologically on a par with "poisoning the plant." But one of those involves a transfer of energy, a physical process. The other is… nothing. It's the absence of a process. How can nothing be a cause of something?

  **Elena:** Because the plant's survival counterfactually depended on the watering. If the friend had poured the water, the plant would have lived. If she didn't, it died. That dependency *is* the causation. Lewis was right about this, even if he was wrong about other things.

  **Marcus:** But that leads you straight into the profligacy problem. Let's use your case. Your friend promised to water the plant, went on vacation, didn't water it, plant died. You say the friend's omission caused the death. Fine. But I didn't water it either. The Queen of England didn't water it. Elon Musk didn't water it. By your logic, since the plant would have lived if *any* of us had watered it, we are all causes of the plant's death. That renders the concept of causation useless.

  **Elena:** I'm not biting that bullet, Marcus. And I'm not going to tell you it's just a "pragmatic" issue about what we choose to *say*. I think the causal relation itself is sensitive to the normative structure of the situation.

  **Marcus:** *(Leans in)* Go on. You're suggesting norms are metaphysical inputs?

  **Elena:** I'm suggesting a contrastive account, à la Schaffer. Causation isn't a binary relation between event *c* and event *e*. It's a quaternary relation: *c* rather than *c\** causes *e* rather than *e\**. The profligacy objection assumes the contrast class for the cause is "any possible action." But it's not.

  **Marcus:** So you're saying the Queen didn't cause the death because…?

  **Elena:** Because for the Queen, the relevant contrast isn't "watering vs. not watering." For the Queen, the actual world and the counterfactual world where she waters the plant are both "deviant" in the same way. There is no stable default where the Queen waters the plant. But for your friend, the promise establishes a normative expectation. That expectation fixes the *c\** relatum. The cause is "the friend failing to water *rather than watering*." That specific contrast only exists for the friend. For the rest of us, the contrast "watering rather than not" isn't available as a causal relatum because there's no obligation grounding it.

  **Marcus:** So the metaphysics of causation leans on moral obligations to determine which counterfactuals are even in the running?

  **Elena:** Not moral obligations specifically, but *normal conditions*. The promise sets a default. Causation is the deviation from the default that makes the difference. The Queen's not-watering isn't a deviation; it's the background. The friend's not-watering is a deviation. That's a structural feature of the causal model, not just a conversational implicature.

  **Marcus:** *(Sips coffee, skeptical)* I see the move. You're building the norm into the relata to avoid profligacy. But I still think you're conflating *explanation* with *causation*. We explain the death by citing the friend's negligence. But the physical cause of death was dehydration caused by solar radiation and evaporation. That's a continuous process. The friend's omission is a "quasi-cause." It's useful for blame, sure, but it's not in the physical fabric of the universe.

  **Elena:** And that's where we diverge on the second point. You think we can separate the metaphysics of causation from our practices of responsibility.

  **Marcus:** Absolutely. Causation is physics. Responsibility is social policy. We hold the friend responsible because she promised. It's useful for society to enforce promises. If we said, "Well, physically, nothing caused the death but the sun," we'd lose the ability to regulate behavior. So we treat omissions *as if* they were causes for legal and moral purposes. But we shouldn't let our desire to blame people distort our ontology. Beebee was clear on this: omissions aren't events. You can't have a relation between an event (death) and a non-event (not watering).

  **Elena:** I think that's a category error about what causation is for. If your metaphysics tells you that the friend didn't cause the plant to die, but our legal and moral practices are built entirely on the intuition that she *did*, then your metaphysics is revisionist in a bad way. It severs the link between causal responsibility and moral responsibility.

  **Marcus:** Not necessarily. Moral responsibility can be about *control* and *expectation*, not just brute causation. I can be responsible for fixing a leak in my house even if the "cause" of the damage was gravity acting on water. I don't need omission causation to be real to blame the friend. I just need her to have had the ability to prevent it.

  **Elena:** But that feels like a dodge. Look, as a cognitive scientist might ask: Why do people's causal judgments track counterfactual dependence so closely? If the "process" view were the folk default, people should say the sun caused the death and the friend is just *blameworthy*. But they don't. They say the friend *killed* the plant.

  **Marcus:** Folk judgments are messy. They conflate agency with mechanism.

  **Elena:** Or maybe the mechanism *includes* the dependency. Look, if I'm designing an experiment, and I ask participants, "Did the friend cause the death?", and 90% say yes, and I ask "Did the Queen cause the death?", and 90% say no… my job is to explain that pattern. Your view says the 90% are metaphysically wrong about the friend. My view says they're tracking a real, contrastive causal structure that includes the normative default.

  **Marcus:** *(Chuckles)* You're telling me the Queen's metaphysical status as a cause depends on whether she signed a contract?

  **Elena:** I'm telling you the *causal claim* is incomplete without the contrast. "Did the Queen cause the death?" is an incomplete question. "Did the Queen's failure to water *rather than her watering* cause the death?" is false, because the second relatum isn't a live option in the causal model. The promise changes the causal model by altering the space of relevant alternatives.

  **Marcus:** It sounds like you're saving the phenomenon by making causation extrinsic to the physical world.

  **Elena:** Causation *is* extrinsic. It's about how the world could have been. The physical process view is too narrow. It captures transmission, but it misses selection. The friend was selected by the promise to be the difference-maker.

  **Marcus:** And I maintain that selection is a human interest, not a feature of the universe. The universe doesn't care about promises. It only cares about energy.

  **Elena:** The universe doesn't care about "cause" at all, Marcus. That's a category we impose. The question is which imposition does the work. If we want a concept of causation that supports our reasoning about responsibility, the difference-making view wins. If you want a concept that maps onto particle physics, you win. But don't tell me the particle physics version is the only "real" one.

  **Marcus:** *(Finishes coffee)* I suppose I can live with that. As long as you admit that when the friend is on trial, the jury isn't doing metaphysics. They're doing policy.

  **Elena:** And as long as you admit that when the plant dies, the friend isn't just blameworthy. She's causally implicated.

  **Marcus:** Deal. Another coffee?

  **Elena:** Please. I need the caffeine. Counterfactuals are exhausting.
