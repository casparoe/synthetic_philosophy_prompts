      *   *Rebuttal:* This assumes "roughly equal" is a state that can be broken by *any* improvement. But if "better than" is vague, there is a *neighborhood* of indeterminacy. $A$ is in it. $A+$ is in it. You haven't left the neighborhood.
      *   *Okay, that's the key.* The "Zone of Parity" vs. The "Penumbra of Vagueness." They function identically regarding small improvements. Therefore, posit the one that requires less metaphysics (Vagueness).

