  For my intro set theory course we've spent the last couple weeks going through equivalents of the Axiom of Choice, and this week's lecture was the classic Zorn's Lemma proof that every vector space has a basis, using the real numbers as a vector space over the rationals as the running example (apparently this is called a "Hamel basis"). I followed the actual proof fine, but a few of us got into kind of an argument about it after class that's been bugging me since. My reasoning was: okay, if the theorem proves this basis exists, then even though nobody's found it, there's presumably some specific collection of real numbers out there that IS a basis, and in principle we should be able to describe it or at least pin down what's in it, sort of like how we can't write out all the digits of pi but we do have a procedure that generates any digit you want on demand. But when I said this to my professor, she said something like "no, that's exactly the thing, you can never actually define or construct one, not even in principle," which honestly confused me more than the original proof did.

  So here's my actual question: if a proof establishes that some object exists, but literally no one can ever describe, define, or produce it in any way, what does "exists" even mean in that sentence? Is Zorn's Lemma doing something fundamentally different from a "normal" existence proof, like proving there's a prime bigger than a trillion, or is my professor just being needlessly dramatic about how wierd this is? A couple of my classmates think I'm overthinking it and that this isn't that different from other nonconstructive stuff we've already seen, but it's kept me up longer than I'd like to admit, so I'd love an actual answer.
