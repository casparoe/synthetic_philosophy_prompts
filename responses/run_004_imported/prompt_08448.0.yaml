      *   **The Turn (Pressing Elena):** Marcus challenges the *implication* of Elena's view. If suffering is bad, do we fix *all* of it? Carnivores need to eat. Do we sterilize them? Feed them? Who plays God? The risk of unintended consequences (ecological hubris).
      *   **The Turn (Pressing Marcus):** Elena challenges the *implication* of Marcus's view. If the "integrity of the biota" is the standard, why don't we apply it to humans? If a human community is "stable" but suffers, is that okay? The charge of speciesism or moral inconsistency.
