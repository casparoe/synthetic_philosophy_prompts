prompt: |-
  quick one for a piece I'm noodling on about the logic of "if... then." I fell down a rabbit hole on David Lewis's 1976 triviality proof -- the one where he shows you basically can't have both (a) the probability of an indicative conditional always equal the conditional probability P(B|A), the way Adams's thesis says it should, and (b) that conditional being an ordinary proposition that updates by normal conditionalization like everything else -- do both and credence collapses into near total triviality. as I understand it this is the exact thing Stalnaker had hoped his own truth-conditional semantics for "if" (roughly: "if A, B" is true at a world when B holds at the closest A-world) would vindicate, and lewis's proof is generally taken to have kneecapped that hope.

  could you write me a dialogue -- 15-20 exchanges, set right after the two of them sit through a talk on the proof -- between a philosopher who takes the result to show indicative conditionals just don't have truth conditions at all (à la Adams and Edgington: "if A, then B" is just a way of voicing your conditional credence, full stop, no proposition there for a truth-value to attach to) and a Stalnaker-style holdout who wants to keep truth conditions and has to actually explain how their semantics survives lewis's proof rather than just insist that it does. I want real engagement, each one responding to the other's specific last move rather than restating their opening position, and neither should come off as the strawman.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Topic:** David Lewis's 1976 Triviality Proof regarding indicative conditionals ("If A, then B").
      *   **Core Conflict:** Adams's Thesis (P(If A, B) = P(B|A)) vs. Truth-Conditional Semantics (Conditionals express propositions that can be true/false and updated via conditionalization). Lewis shows these are incompatible for non-trivial probability functions.
      *   **Characters:**
          *   *Philosopher A (Adams/Edgington style):* Believes conditionals lack truth conditions (non-propositionalism). They express conditional credences.
          *   *Philosopher B (Stalnaker style):* Wants to keep truth conditions (propositionalism). Needs to explain how their view survives Lewis's proof without just denying it.
      *   **Format:** Dialogue, 15-20 exchanges.
      *   **Tone:** Intellectual, engaged, no strawmen, specific responses to previous moves.
      *   **Setting:** Right after a talk on the proof.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Lewis's Result:* If P(A > B) = P(B|A) for all A, B (where P(A)>0), and A > B is a standard proposition in the algebra, then the probability function is trivial (can only distinguish at most 4 worlds, or P(B|A) must equal P(B)).
      *   *Adams/Edgington (Non-Propositionalism):* Accept Lewis's result. Conclude conditionals aren't propositions. They don't have truth values. They have assertibility conditions (high conditional probability).
      *   *Stalnaker (Propositionalism):* Needs to resist the conclusion. How?
          *   Option 1: Deny Adams's Thesis holds *universally*. (Stalnaker actually did this to some extent, arguing P(A > B) approximates P(B|A) but isn't identical).
          *   Option 2: Context dependence. The proposition expressed by "If A, B" shifts with context (specifically, the selection function or the set of live possibilities). Lewis's proof assumes the proposition is fixed while probabilities shift. Stalnaker argues the *content* changes as credences change.
          *   Option 3: Restrict the algebra. Conditionals aren't in the same Boolean algebra as the antecedents/consequents.

      *   *Decision for Character B:* The strongest Stalnakerian move against Lewis is the *context-shift* argument. Lewis assumes the proposition $A > B$ stays the same while we conditionalize on new information. Stalnaker argues that as our epistemic state changes, the "closest world" selection function changes, so the proposition expressed changes. Thus, you can't plug it into Lewis's formula as a fixed variable.

  3.  **Drafting - Exchange by Exchange (Iterative Process):**

      *   *Ex 1 (A):* Start with the impact. Lewis won. Conditionals aren't propositions.
      *   *Ex 2 (B):* Push back. Don't throw out truth conditions yet. Lewis assumes something we shouldn't grant.
      *   *Ex 3 (A):* What assumption? The math is solid. P(If A, B) = P(B|A) is intuitive.
      *   *Ex 4 (B):* The math is solid, but the application isn't. Lewis treats the conditional as a fixed proposition across probability updates.
      *   *Ex 5 (A):* Why wouldn't it be fixed? If I say "If it rains, the match is cancelled," that's a claim about the world.
      *   *Ex 6 (B):* It's a claim relative to a context. Specifically, the selection function. As we learn things, the "closest world" shifts.
      *   *Ex 7 (A):* That sounds like moving the goalposts. If the content shifts, communication is impossible.
      *   *Ex 8 (B):* Not impossible, just dynamic. Like indexicals. "Here" changes meaning when I move.
      *   *Ex 9 (A):* But "If" isn't an indexical in that way. Adams says it's just a constraint on belief states.
      *   *Ex 10 (B):* But we embed them. "It's not the case that if A, B." You need truth conditions for negation to work.
      *   *Ex 11 (A):* We can handle embedding pragmatically or with suppositional logic. We don't need a truth-value gap to explain why we don't usually negate conditionals.
      *   *Ex 12 (B):* We do negate them! "It's false that if he called, he's coming."
      *   *Ex 13 (A):* That's just saying I'm confident he didn't call or he's not coming. It reduces to credence.
      *   *Ex 14 (B):* That reduction fails with Lewis's own modal realism or even just possible worlds. We quantify over worlds.
      *   *Ex 15 (A):* Lewis knew that! That's why he abandoned the truth-conditional view for indicatives later.
      *   *Ex 16 (B):* Lewis abandoned it to save the probability equation. I'm willing to tweak the equation to save the proposition.
      *   *Ex 17 (A):* So you admit Adams's Thesis isn't universal?
      *   *Ex 18 (B):* I admit it's an approximation that holds in standard contexts, but fails when the context itself is the variable being updated.
      *   *Ex 19 (A):* So your truth conditions are elusive. They vanish when you try to pin down the probability.
      *   *Ex 20 (B):* They don't vanish. They just depend on where you're standing when you evaluate them.

  4.  **Review and Refine:**
      *   *Check constraints:* 15-20 exchanges? (Let's count carefully).
      *   *Tone check:* Is A too dismissive? Is B too defensive? Need to ensure B has a substantive technical counter (the context-sensitivity of the selection function).
      *   *Technical accuracy:* Lewis's proof relies on the assumption that the conditional $A \rightarrow B$ is in the algebra and its probability is invariant under conditionalization on propositions compatible with it. Stalnaker's rebuttal is that the *proposition expressed* depends on the context set, which changes upon conditionalization.
      *   *Refining Ex 10/11:* The embedding argument is a classic point against Adams. Make sure A has a reply (Edgington's suppositional view handles some embedding).
      *   *Refining Ex 16/17:* This is the crux. B admitting Adams's Thesis isn't strict identity is a valid Stalnakerian move (Stalnaker 1976 "Indicative Conditionals" actually addresses this).

  5.  **Final Polish:** Check the flow. Ensure the voices sound distinct. A is more pragmatic/deflationary; B is more metaphysical/structural.

