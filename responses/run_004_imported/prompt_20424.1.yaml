answer: |-
  **1. Mara:** Well, that's that, isn't it? Lewis just handed us the reductio. If you want Adams's Thesis to hold, you have to admit conditionals aren't propositions. They don't have truth conditions.

  **2. Julian:** That's too quick. Lewis proved that *fixed* propositions can't satisfy Adams's Thesis across all probability updates. He didn't prove conditionals lack truth conditions entirely.

  **3. Mara:** But the intuition driving the whole debate is that P(If A, B) *is* P(B|A). If your truth-conditional semantics can't capture that identity without collapsing into triviality, what's the semantics actually doing?

  **4. Julian:** It's capturing the content, not just the credence. Lewis's proof assumes the proposition expressed by "If A, B" stays constant while we conditionalize on new information. That's the weak link.

  **5. Mara:** Why is that weak? If I assert "If it rains, the match is cancelled," I've put a specific claim on the table. Why would that claim shift just because I learn it's cloudy?

  **6. Julian:** Because the "closest world" selection function depends on the context set. When you update your credences, you change the context set. So the proposition expressed by the conditional shifts with the epistemic state.

  **7. Mara:** That sounds like you're making the content of my assertion dependent on what I believe. If truth conditions vary with credence, communication becomes impossible. We'd never be disagreeing about the same thing.

  **8. Julian:** Not impossible, just dynamic. Think of indexicals. "I am here" changes truth value when I move, but it still expresses a proposition. Conditionals are sensitive to the epistemic location of the speaker.

  **9. Mara:** But "If" isn't an indexical like "here." Adams explains the data without positing these elusive truth conditions. "If A, B" is just a device for voicing a conditional degree of belief. Full stop.

  **10. Julian:** Then explain embedding. "It is not the case that if A, B." If there's no proposition to negate, what are you doing in that sentence? You can't negate a speech act.

  **11. Mara:** We rarely embed indicatives under negation in natural language. When we do, it's paraphrasable. "It's false that if he called, he's coming" just means "Either he didn't call or he isn't coming."

  **12. Julian:** That paraphrase fails for disjunctions. "Either if A, B or if C, D." You need truth-functional components to make sense of that logical form. Your view forces a pragmatic rewrite of the syntax.

  **13. Mara:** I'd say the syntax misleads us. The logic of conditionals isn't truth-functional. Lewis himself eventually conceded that indicatives don't behave like standard propositions in the algebra.

  **14. Julian:** Lewis conceded that to save the probability equation. I'm willing to let the probability equation be an approximation to save the proposition. P(A > B) approximates P(B|A) in standard contexts, but diverges when context shifts.

  **15. Mara:** So you're admitting Adams's Thesis isn't universal? Once you grant that, you lose the main motivation for a possible-worlds semantics over a simpler suppositional one.

  **16. Julian:** I'm admitting it's a constraint on *assertibility*, not necessarily identity with *probability*. The truth condition explains why we assert it; the probability explains when we're licensed to.

  **17. Mara:** But if the truth conditions don't align with the probabilities, why posit them? You're adding metaphysical baggage—closest worlds, selection functions—that does no work in predicting our actual credences.

  **18. Julian:** It does work. It explains why we treat conditionals as factual claims that can be proven wrong retrospectively. If I say "If you drop that, it will break," and you drop it and it doesn't, I was wrong. Not just imprudent.

  **19. Mara:** You were assertorically improper. Your conditional credence was too high given the evidence. You don't need a "falsehood" in the world to explain that error; you just need a miscalibration.

  **20. Julian:** But a miscalibration of *what*? If there's no fact of the matter about the conditional relation, you're just saying my brain is out of sync with itself. I need the world to be a certain way for me to be wrong.
