answer: |-
  This is a wonderful question, and it is no surprise it has taken hold of your philosophy group. It cuts right to the heart of the tension between *scientific practice* (how scientists actually work) and *scientific idealism* (how we say science works).

  You are asking about the boundary between **pragmatic skepticism** and **dogmatic closure**. As someone who has spent a lifetime in the lab and is now spending retirement in the library, you are uniquely positioned to see both sides.

  Here is an outside take on where your reasoning holds up, where it potentially fails, and how a philosopher of science might categorize what happened in the early 90s.

  ### 1. Where Your Postdoc is Right (The Trap of Unfalsifiability)
  Your former postdoc's critique relies on the principle of **falsifiability**, most famously associated with Karl Popper. For a consensus to be scientific, it must be possible, in principle, to prove it wrong.

  If the criterion for accepting new data is "it must agree with existing data," then the existing data is no longer a scientific finding; it is an axiom. You have effectively placed the consensus value behind a "protective belt" that no evidence can penetrate. If you reject *any* contradictory result simply because it contradicts, you have made the consensus unfalsifiable.

  History is littered with "established values" that were overturned by someone who refused to accept that their anomaly was just an error.
  *   **Example:** When Prout hypothesized that all atomic weights were multiples of hydrogen, he was dismissed for decades because measurements didn't align. It turned out isotopes existed, but if everyone had rejected the deviations as "error" without investigating *why*, the discovery of isotopes might have been delayed.
  *   **The Risk:** By rejecting the paper without identifying a specific methodological flaw, you risked suppressing a genuine paradigm shift. Your postdoc is correct that this mechanism, if applied universally, creates a scientific monoculture where errors in the consensus can never be corrected.

  ### 2. Where You Are Right (Bayesian Priors and Resource Allocation)
  However, your defense is grounded in the practical reality of **Bayesian reasoning** and **Kuhnian "Normal Science."**

  *   **Bayesian Priors:** In analytical chemistry, you deal with probabilities. If a value has been measured consistently by ten independent groups over a decade, the "prior probability" that it is correct is extremely high. The probability that a single new paper has found the truth while everyone else is wrong is extremely low. It is statistically rational to bet on the consensus.
  *   **Thomas Kuhn:** In *The Structure of Scientific Revolutions*, Kuhn argues that most science is "Normal Science"—puzzle-solving within an accepted framework. Anomalies are expected. Usually, they *are* errors (contaminated samples, calibration drift, software bugs). If every lab stopped to investigate every anomaly that contradicted physics or chemistry as we understood it, science would grind to a halt.
  *   **The Gatekeeper Role:** As a referee, you are not just a seeker of truth; you are a gatekeeper for a specific journal. You have a duty to the readership not to flood the literature with noise. "Extraordinary claims require extraordinary evidence" is not just a slogan; it is a demand for a higher standard of proof when the prior probability is low.

  ### 3. The Crucial Distinction: *Why* vs. *That*
  So, where is the line between your "good judgment" and "dogmatism"? It lies in the **conditions for overturning the belief.**

  *   **Dogmatism:** "This result is wrong because it contradicts what we know." (The conclusion is fixed; no evidence can change it).
  *   **Legitimate Skepticism:** "This result is likely wrong because it contradicts what we know, *so the burden of proof is higher.* To convince me, you need to rule out X, Y, and Z specifically."

  The problem in your specific memory seems to be the outcome: **Rejection.**

  If you rejected the paper outright without suggesting what *would* constitute sufficient evidence, you leaned toward dogmatism. You effectively said, "The consensus is too strong for this journal to entertain."

  If you had recommended a "Major Revision" and written: *"The deviation from the established value is significant. Given the consistency of prior literature, the burden of proof is on the authors to demonstrate why their method avoids the specific pitfalls that usually cause this deviation. Please provide validation against a standard reference material or blind replication,"* then you would have been exercising legitimate skepticism. You would have kept the door open while demanding a stronger key.

  ### 4. The Epistemology of "Know"
  This brings us to your philosophy group's topic: What does it mean to "know"?

  In the lab, we often use "know" pragmatically. "We know the boiling point of water is 100°C." But epistemologically, we don't *know* that; we have a **high-confidence justification** based on repeated observation.

  Your reasoning in the 90s treated the established value as **Capital-K Knowledge** (infallible). Your postdoc is treating it as **Provisional Knowledge** (falsifiable).
  *   **Where your reasoning holds up:** In a resource-constrained world, treating high-confidence provisional knowledge *as if* it were infallible is a necessary heuristic for efficiency.
  *   **Where it falls apart:** It fails when the heuristic becomes a rule. If the journal system systematically rejects all outliers, the "self-correcting" mechanism of science breaks.

  ### 5. A Verdict on the Memory
  You are likely feeling uneasy because your intuition is detecting a **category error**.

  You were acting as a **pragmatic manager of scientific truth** (which requires filtering noise), but you justified it with **epistemic certainty** (claiming the answer was already "known").

  You weren't necessarily "wrong" to reject the paper. In analytical chemistry, a single outlier against a decade of consensus is, 99 times out of 100, an error. Saving the reviewers' and readers' time was a valid service. However, your postdoc is right that the *justification* ("we already know the value is right") is philosophically brittle.

  A more robust justification would have been: *"The prior probability of error in this measurement is significantly higher than the prior probability of the consensus being wrong. Therefore, the evidence provided here is insufficient to overcome the established baseline."*

  That sounds similar, but it admits the possibility of being wrong. It acknowledges that the consensus *could* be overturned, just not by *this* specific dataset.

  ### Summary for Your Group
  If I were sitting in your library circle, I'd suggest this distinction:

  **Skepticism** says: "I doubt this claim because it conflicts with strong priors. Show me more."
  **Dogmatism** says: "I doubt this claim because it conflicts with strong priors. Go away."

  You likely did the former in your head, but enacted the latter in your recommendation. That doesn't make you a bad scientist; it makes you a human one operating within a system that demands binary decisions (Accept/Reject) on probabilistic realities.

  The fact that you are still wrestling with this 30 years later suggests you weren't dogmatic. A dogmatist wouldn't lose sleep over it.
