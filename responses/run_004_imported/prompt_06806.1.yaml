answer: |-
  This is a fantastic line of inquiry. You've hit on one of the deepest tensions in the philosophy of physics, and you're right to sense that the modern debate (Earman/Norton vs. the sophisticated substantivalists) is essentially a high-tech echo of Einstein's 1913–1915 panic.

  If we reconstruct Einstein's likely reaction to the 1987 revival and the subsequent 1990s scramble, we have to look past the "early Einstein" (the Machian relationist of 1905–1915) and focus on the "mature Einstein" (the field realist of 1920–1955).

  Here is my best-guess reconstruction of where Einstein would have landed, based on his later writings, specifically the 1920 Leiden address ("Ether and the Theory of Relativity") and his correspondence in the *Schilpp* volume.

  ### 1. He would reject the dichotomy (Substance vs. Relations) as a category error
  The Earman/Norton argument sets up a trap: either you believe manifold points are real individuals (Substantivalism) and accept indeterminism, or you deny they are real (Relationism) to save determinism.

  Einstein would likely look at this and say you are fighting over the wrong object. By the 1920s, Einstein had explicitly abandoned strict Machian relationism. He realized that the gravitational field (the metric tensor $g_{\mu\nu}$) has physical reality independent of the matter sources. It carries energy; it propagates waves; it dictates inertia even in a universe devoid of mass (as he later conceded regarding Minkowski space).

  In his 1920 Leiden address, he famously stated: *"Recapitulating, we may say that according to the general theory of relativity space is endowed with physical qualities; in this sense, therefore, there exists an ether."*

  However, he immediately clarified this ether is not a material substance with a velocity. It is the **metric field**.

  So, if confronted by Earman and Norton in 1987, Einstein would likely say: **"You are arguing about the manifold points. I told you in 1915 the manifold points are nothing. The *field* is the substance."**

  He would view "Manifold Substantivalism" (the target of Earman/Norton) as a naive realism about the mathematical scaffolding rather than the physical content. To Einstein, the manifold without the metric is physically meaningless. Therefore, the Hole Argument's threat of indeterminism arises only if you reify the coordinate grid. If you reify the *field* (the metric values assigned to the coincidences), the diffeomorphism just moves the field values along with the points, and the physical situation remains identical.

  ### 2. He would view "Sophisticated Substantivalism" as verbal gymnastics
  The response from philosophers like Butterfield and Maudlin in the 90s was to save substantivalism by denying that points have "haecceity" (thisness) independent of their metrical properties.

  Einstein would probably find this amusing but ultimately unnecessary. In his *Autobiographical Notes* (1949), he writes about the "free creation of the mind." He viewed the mathematical structures as tools to capture objective physical reality. The question of whether a point has an identity *apart* from the field would strike him as scholastic.

  He would likely tell Maudlin: *"You are trying to save the 'substance' of the point by tying it essentially to the metric. But why keep the point at all? The metric field is the physical object. The point is just where the field is."*

  Einstein's "Point-Coincidence Argument" was essentially a precursor to what we now call **Leibniz Equivalence** (the idea that diffeomorphic models represent the same physical state). He wouldn't see the sophisticated substantivalists as dressing up his move; he'd see them as trying to salvage a metaphysical commitment (to points) that he had already discarded as physically vacuous.

  ### 3. He would not return to Machian Relationism
  This is the crucial pivot. Many relationists use the Hole Argument to say, "See? Spacetime isn't real."

  Einstein would firmly reject this. By the 1930s, he was openly critical of Mach. He recognized that GR does not fully implement Mach's Principle (inertial effects exist in empty spacetimes; the boundary conditions at infinity matter). In a letter to Besso (1954), shortly before dying, he wrote: *"One should not blame Mach for having been unable to construct a relativistic theory... but it is in any case astonishing how much of the truth was in his ideas."* Note the "but."

  He knew the field had independent degrees of freedom. If spacetime were merely relations between material bodies, gravitational waves would be impossible (relations between what, if the bodies are light-years away and the wave is in between?).

  So, he wouldn't join "Team Relations." He knows the field is real.

  ### 4. The Verdict: "Team Field" (Metric Realism)
  If forced to choose a seat at the 1990s table, Einstein would sit with the **Metric Substantivalists**, but he would chastise them for getting bogged down in the ontology of the *manifold*.

  He would likely characterize the Earman/Norton debate as a **"pseudo-problem dressed up in tensor calculus,"** but with a caveat. He wouldn't dismiss it entirely because it touches on the nature of the field.

  His position would be:
  1.  **The Manifold is not real.** It is a topological continuum, a mathematical precondition, but it has no physical "stuff." (This kills the Hole Argument's indeterminism immediately).
  2.  **The Metric Field is real.** It is a physical state of space. It is the modern "ether."
  3.  **Determinism is preserved** because the physical reality is the coincidence of field values, not the labeling of points.

  ### 5. Why he'd be annoyed by the metaphysics
  Einstein was a scientific realist, but he was impatient with metaphysics that didn't yield to empirical or mathematical clarity. In the *Schilpp* volume, responding to critics, he often deflected ontological questions by pointing to the mathematical structure.

  He would likely argue that the 1987–1990s debate suffered from **linguistic reification**. By asking "Are points real?", philosophers were treating "points" as if they were potential candidates for physical existence. For Einstein, only that which can causally interact is real. Manifold points cannot interact; the metric field can.

  He might say something like:
  > *"You ask if space is a substance. If by space you mean the metric field, then yes, it is as real as a table. If by space you mean the coordinate grid, then no, it is a fiction. Your 'Hole Argument' proves only that the coordinate grid is a fiction. Why did you need 70 years to rediscover my 1915 conclusion?"*

  ### Summary Reconstruction
  If Einstein walked into a 1995 philosophy of physics conference:

  *   **On Mach/Relationism:** He'd shake his head. "I tried that. The field has energy. The field is real. Relations between matter aren't enough."
  *   **On Earman/Norton:** He'd agree with their conclusion (Manifold Substantivalism is untenable) but think their reasoning was overly logical and under-physical. They treated it as a problem of logic/identity; he treated it as a problem of physical definition.
  *   **On Sophisticated Substantivalism:** He'd see it as an attempt to patch a leaky boat rather than building a new one. Don't save the points; save the field.
  *   **Final Stance:** **Field Realism.** Space-time is not a container (Newton), nor is it nothing but relations (Mach). It is a physical field with its own dynamics. The "substance" is the metric, not the manifold.

  He would likely conclude that the "substance vs. relations" debate is a relic of pre-field thinking. In GR, the distinction dissolves because the "container" *is* the "field." The rabbit hole you're in? He'd tell you the exit was marked "The Metric Tensor" back in 1915, and everyone got lost reading the map instead of looking at the terrain.
