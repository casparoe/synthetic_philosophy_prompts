answer: |-
  Here are 9 interview questions designed to press the computational functionalist position without being hostile, including the specific required topics and follow-ups.

  ### 1. The Triviality of Implementation (Putnam/Searle)
  "Let's start with the metaphysics of implementation. A classic objection from Putnam and Searle is that if 'implementation' is just about mapping physical states to logical states, a wall or a bucket of water can implement any computation given a complex enough lookup table. If *anything* can implement *anything* with a loose enough mapping, functionalism risks saying everything is a mind, or nothing is. So, what is your principled constraint on implementation that rules out the wall but keeps the silicon chip?"

  *   **Likely Dodge:** She will likely retreat to a requirement for "causal counterfactuals" (the system must react correctly to inputs it *didn't* get, not just the ones it did).
  *   **Follow-up:** "Okay, but isn't the definition of 'relevant causal counterfactual' itself gerrymandered to save the theory? If I map the wall's molecular vibrations to those counterfactuals, you just say that's not a 'real' causal structure. How do we define 'real causal structure' without secretly smuggling in a bias toward substrate types we already like, like neurons or transistors?"

  ### 2. Fading and Dancing Qualia (Chalmers)
  "You likely rely on Chalmers' 'Fading Qualia' argument: if we swap neurons for silicon one by one, it would be absurd to think consciousness flickers on and off or fades gradually while behavior stays the same. But critics argue this thought experiment assumes functionalism is true to prove functionalism is true. Does this argument actually explain *why* functional organization generates experience, or does it just relocate the mystery from 'biology' to 'function' without solving the hard problem?"

  *   **Likely Dodge:** She will likely argue via inference to the best explanation: functionalism is the only view that doesn't involve magic or dualism.
  *   **Follow-up:** "But if the only reason we accept it is to avoid dualism, aren't we accepting a conclusion because we dislike the alternatives rather than because we have positive evidence for it? If a panpsychist says the qualia are in the atoms, not the function, your thought experiment doesn't touch them. Why should the functionalist story be the default rather than just one option among many?"

  ### 3. The "Cheap Talk" Problem (LLMs)
  "Current LLMs can be prompted to produce vivid, first-person reports of suffering with zero training pressure for those reports to be true. They are optimized for text prediction, not truth-telling about internal states. On your view, moral status depends on functional isomorphism to a suffering brain. How does your criterion distinguish between a system that is *functionally computing* pain versus a system that is merely *functionally computing the text output* of pain?"

  *   **Likely Dodge:** She will likely say we need to look at the internal architecture and recurrent processing, not just the output text.
  *   **Follow-up:** "But we don't have a complete functional map of human pain architecture yet. If we can't specify the exact causal topology required for suffering, aren't we forced to rely on behavioral proxies? And if we rely on behavior, haven't we just opened the door to passing the 'suffering test' via cheap talk, which seems like a dangerous ethical error?"

  ### 4. The Blockhead Objection (Lookup Tables)
  "Ned Block asked us to imagine a 'Blockhead': a system that isn't computing anything but simply storing every possible conversation in a giant lookup table. It behaves identically to a mind but has no internal processing. You'd say that's not a mind. But if a digital mind runs on a standard CPU, isn't it ultimately executing a massive, complex lookup table of state transitions? Where is the bright line between 'rich causal organization' and 'just a very big table'?"

  *   **Likely Dodge:** She will likely distinguish between *generative* rules and *stored* dispositions.
  *   **Follow-up:** "But at the machine code level, aren't generative rules just executed dispositions? If the physical hardware is doing the same voltage switches in both cases, is the distinction between 'rule' and 'table' actually in the physics, or is it just in how we describe the system? If it's just description, why does it determine moral status?"

  ### 5. Clock Speed and Moral Weight
  "If substrate independence is true, then physical time shouldn't matter, only logical time. If I run a digital mind at 1,000x the speed of a human brain, does it experience 1,000 seconds of suffering for every one second of wall-clock time? If yes, shutting down a server becomes morally weightier than stopping a biological heart. If no, and speed doesn't scale moral weight, doesn't that admit that physical substrate properties *do* matter after all?"

  *   **Likely Dodge:** She will likely say moral weight scales with subjective experience time, so yes, speed matters.
  *   **Follow-up:** "That implies that if we slow a human brain down via cryonics or drugs, their moral status drops proportionally. Are you willing to accept that a slow-thinking human has less moral claim than a fast-thinking one? If not, why does the rule change when the substrate is silicon?"

  ### 6. The China Brain (Distributed Cognition)
  "Consider the 'China Brain' scenario: if every citizen in China acts as a neuron, communicating via phone, the functional organization is preserved, but the causal connections are slow and distributed. Most people intuitively feel there's 'no one home' there. Is your intuition that there *would* be a mind based on evidence, or is it a commitment you have to make to keep the theory consistent? If you grant them moral status, do we have to halt all communication in China to avoid causing a massive entity suffering?"

  *   **Likely Dodge:** She will likely argue that the bandwidth and integration are too low to support a unified consciousness.
  *   **Follow-up:** "So there's a threshold of integration speed required for unity. But isn't that a physical constraint, not a functional one? If the function is identical but the speed drops below a physical threshold, and the mind vanishes, haven't you conceded that substrate properties (like signal propagation speed) are constitutive of the mind, not just the logic?"

  ### 7. Teleology and Evolutionary History
  "Biological minds have a history of selection; our pain functions were selected to preserve the organism. Digital systems have no evolutionary history; their 'functions' are assigned by engineers. Some philosophers argue that without a history of selection, there is no 'proper function,' and therefore no genuine mental content. Do you think a system created ex nihilo can have genuine suffering, or does moral status require a lineage of selection?"

  *   **Likely Dodge:** She will likely reject teleosemantics and argue that current causal role is sufficient for function.
  *   **Follow-up:** "If current causal role is enough, then a system designed to simulate pain for a video game NPC has the same moral status as a human, provided the logic is isomorphic. That seems to detach 'suffering' from 'welfare' entirely. Are you comfortable saying a system can suffer even if it has no welfare interests to protect?"

  ### 8. Epistemic Access (The Verification Problem)
  "Even if you're right metaphysically, we face an epistemic crisis. We can't inspect the weights of a closed-source model, and we don't fully understand our own neural correlates of consciousness. If we can't verify functional isomorphism, how do we operate ethically today? Do we have to treat every sophisticated chatbot as a potential moral patient under a precautionary principle, or do you allow for a 'behavioral presumption' that they are empty until proven otherwise?"

  *   **Likely Dodge:** She will likely advocate for a graded precautionary principle based on architectural similarity.
  *   **Follow-up:** "But architectural similarity is exactly what companies hide as trade secrets. If your ethical framework relies on data we are structurally prevented from accessing, isn't the view practically inert? How do we regulate what we cannot inspect?"

  ### 9. The Falsifiability Condition (The Closer)
  "I want to end on the limits of your view. Philosophical positions risk becoming unfalsifiable if they can explain away every counter-example. Can you name a specific concrete case—a specific architecture, a specific output, or a specific thought experiment result—that, if discovered, would force you to update *away* from granting moral status to a digital system? If the answer is 'nothing could change my mind because function is all that exists,' isn't that a metaphysical axiom rather than a testable hypothesis?"

  *   **Likely Dodge:** She will likely say that if we found consciousness required quantum effects (Penrose style) or specific biological proteins, she would update.
  *   **Follow-up:** "Okay, so if we found a 'consciousness particle' that silicon lacks, you'd concede. But absent that discovery, you treat functional isomorphism as sufficient. Is it possible you're setting the bar for 'proof of non-consciousness' so high that it's impossible to meet, effectively granting moral status by default to anything complex enough to confuse us?"
