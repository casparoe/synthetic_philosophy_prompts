answer: |-
  The Frege-Geach problem is not merely a technical puzzle for linguists; it is the existential threat that separates viable metaethical theories from dead ends. You have the basic shape down: if moral sentences express attitudes rather than beliefs, they lack truth conditions, and thus logical validity (which relies on truth preservation) becomes inexplicable. The question is whether expressivism can survive this without ceasing to be expressivism. My verdict is this: Simon Blackburn's early quasi-realist project fails to solve the problem on its own terms, but Mark Schroeder's *Being For* account technically solves the logical problem by transforming expressivism into a form of cognitivism about mental states. Expressivism survives, but only by mutating into a theory of practical rationality that is logically isomorphic to realism, even if ontologically distinct.

  To see why Blackburn's solution in *Spreading the Word* is insufficient, we must look at the "negation problem." Blackburn attempts to construct a "logic of attitudes," arguing that we can project logical structure onto our expressions of approval and disapproval without positing moral facts. He suggests that moral discourse *mimics* realist discourse so well that we can treat it *as if* it were truth-conditional. However, as Schroeder famously objects, this mimicry breaks down under negation. If "stealing is wrong" expresses disapproval (Boo!), what does "stealing is not wrong" express? It cannot simply be the absence of disapproval, because one can lack disapproval without having the positive attitude that "stealing is not wrong" implies. Blackburn's system struggles to distinguish between the inconsistency of holding contradictory attitudes and the logical inconsistency of the sentences themselves. He essentially asks us to accept a logical system that works differently for moral sentences than for descriptive ones, which feels like a cheat. It leaves the suspicion that quasi-realism is just error theory with a friendly face.

  Schroeder, building on Gibbard's norm-expressivism, offers a more robust fix in *Being For*. Schroeder abandons the attempt to mimic truth conditions linguistically and instead analyzes the mental states themselves. He argues that moral judgments are a specific type of non-cognitive state: "being for" something. Crucially, he defines inconsistency not in terms of truth values, but in terms of the compatibility of mental states. To believe *p* and believe *not-p* is inconsistent because belief aims at truth. To be "for" blaming for stealing and "for" not blaming for stealing is inconsistent because one cannot simultaneously hold these planning states. By anchoring the logic in the structure of the mind rather than the structure of the world, Schroeder solves the embedding problem. The conditional "If stealing is wrong..." expresses a state of being for having a certain attitude conditional on another. This allows modus ponens to function without requiring moral facts.

  However, this victory comes at a steep price, leading to the charge of mutation. Critics argue that if moral judgments have logical relations defined by consistency conditions identical to beliefs, the distinction between expressivism and cognitivism evaporates. If "being for" functions exactly like "believing" in logical space, why call it expressivism? I argue the distinction remains vital. Cognitivism posits that moral judgments represent the world (they have a world-to-mind direction of fit). Schroeder's expressivism posits that they represent plans or norms (mind-to-world direction of fit). The logic is the same, but the ontology is not. Expressivism survives not by solving the linguistic problem, but by bypassing it: the logic holds because rational agents cannot hold inconsistent plans, not because moral sentences correspond to facts.

  This brings me to your roommate's objection that this is a "semantic word-game with no real stakes." She is wrong, and the stakes are metaphysical, not merely linguistic. If expressivism fails the Frege-Geach test, we are left with a dilemma: either robust moral realism (which requires spooky, non-natural facts to ground truth conditions) or error theory (which says all moral claims are false). Expressivism offers a third path: we can have objective-seeming moral reasoning without committing to a metaphysically bloated universe. If Schroeder is right, we preserve the normativity of ethics without the metaphysical baggage. That is not a word game; it is the difference between a universe that contains moral facts and one that contains only moral agents.

  So, here is the stance you can take to section: Pure emotivism is dead; Blackburn's quasi-realism is a band-aid that leaks under the pressure of negation. But expressivism as a broader project survives through Schroeder. It solves Frege-Geach, but only by admitting that moral judgments are cognitive-like states of "being for" plans. It is expressivism saved by becoming a logic of planning rather than a logic of language. If your section mates argue that this collapses into cognitivism, concede the logical point but hold the ontological line: the "facts" are facts about rational consistency of plans, not facts about the universe. That is enough to keep expressivism alive, distinct, and philosophically vital.
