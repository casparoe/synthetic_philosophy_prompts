prompt: |-
  So we're a few weeks into my metaethics seminar and this week's readings were all on the Frege-Geach problem, and I feel like I've got the basic shape of the objection down -- that if "stealing is wrong" just expresses disapproval instead of stating a fact, expressivists owe us an explanation of why "if stealing is wrong then getting your kid brother to steal is wrong; stealing is wrong; therefore getting your kid brother to steal is wrong" is a valid argument, since the embedded occurance of "stealing is wrong" in the conditional can't itself be an act of disapproving of anything. What I don't have a good handle on is whether the actual fixes people have proposed -- Blackburn's logic-of-attitudes stuff from Spreading the Word, Gibbard's norm-expressivism where moral judgments express acceptance of systems of norms (or later, plans), and Schroeder's "being for" account from Being For -- actually solve the problem, or whether they're all just more sophisticated ways of admitting it can't be solved on expressivism's own terms.

  Could you write me an essay that takes an actual stance on this? Not for a grade, just so I have something to argue with before section on friday. I want it to really engage with at least two of those specific proposals instead of just summarizing the problem and namedropping people -- weigh them against the standard complaints (the negation problem, the disjunction problem, and whether "inconsistency of attitudes" is doing real logical work or is just a relabeling) -- and then commit to an answer: does any expressivist actually have a working solution to Frege-Geach, or does the problem show that expressivism has to mutate into some hybrid/quasi-cognitivist view to survive (and if so, is that still "expressivism" in any interesting sense)? My roommate says this is all just a dumb semantic word-game with no real stakes for actual ethics, and I'd like a real answer for why she's wrong, if she is. Something like 800-1000 words is perfect, and please don't hedge out at the end with a "more research is needed" vibe -- I want a verdict I can actually push back on.
