answer: |-
  Good evening. For those who don't know me, I'm the father of the bride. For most of my career, I was a biologist. I spent a long time watching pigeons make difficult choices. Specifically, I studied self-control.

  In my lab, we gave pigeons a dilemma. They could peck a key and get a small amount of food immediately, or wait for a larger amount later. Naturally, like most of us, they often chose the smaller-sooner reward. But here is the fascinating part: If we gave them the chance to peck a *different* key beforehand—one that locked the first key away for a while—they would do it. They would voluntarily restrict their own future freedom to ensure they waited for the better reward.

  They were binding themselves to the mast, just like Ulysses ordering his crew to tie him up so he could hear the Sirens' song without jumping ship. In philosophy and economics, we call this a "precommitment device." It is a way to solve a problem called "time inconsistency," or as my daughter's fiancé would call it, *akrasia*: weakness of will.

  Now, looking at the couple before us, I realize I am standing at the intersection of a very specific Venn diagram. My daughter builds models of how people trade rewards against time. She knows exactly how much we discount the future. Her fiancé studies the philosophy of why we fail to do what we know is best.

  So, naturally, I looked at these wedding rings and thought: *Ah. The ultimate precommitment device.*

  It fits perfectly, doesn't it? You are standing here, in the grip of what behavioral economists call the "hot state" of love, making a binding contract to constrain your behavior in the inevitable "cold states" of Tuesday night arguments or long years of routine. You are tying yourselves to the mast. You are pecking the key that locks away the option of escape, so that you can secure the larger-later reward of a life together.

  For the third of you in the room who just nodded, welcome. For the rest of you: they are smart enough to know that love is not just a feeling; it is a strategy for surviving time.

  However, there is a problem with this theory. It is a problem my daughter and her fiancé would be quick to point out, and it is the reason I cannot let this joke stand as the truth of the evening.

  In my lab, a pigeon can stop pecking the precommitment key. Ulysses could have struggled until the ropes broke. And in life, a wedding ring can be taken off. A hyperbolic discounter can renege on any commitment device it likes. If marriage were merely a rational solution to a decision-theoretic problem, it would be fragile. It would rely on the strength of the rope, rather than the desire of the sailor.

  If the only reason you stay together is because you have successfully removed the option of leaving, then you haven't overcome weakness of will. You've just engineered a cage. And neither of you wants to live in a cage, and I certainly don't want to imagine my daughter in one.

  So, here is the truth that is deeper than the joke.

  The miracle of marriage is not that it binds you when you want to leave. The miracle is that, over time, it changes the value of the rewards.

  My daughter's models assume that the "smaller-sooner" reward—the easy way out, the immediate gratification, the selfish choice—will always look tempting as time goes on. But love does something that a spreadsheet cannot capture. It alters the discount rate.

  When you truly love someone, the "larger-later" reward of growing old together ceases to be a distant abstraction you have to protect with ropes and contracts. It becomes the *only* reward that holds any value. The temptation to peck the other key fades, not because the key is locked away, but because the food behind it no longer tastes sweet.

  You are not Ulysses tying yourselves to the mast to survive a threat. You are two navigators who have realized that the Sirens' song sounds hollow compared to the sound of each other's voices.

  So, wear your rings. Let them be a precommitment device if you like. But let them be a reminder not of a constraint you cannot break, but of a choice you renew every day. Let them signify that you have looked at the future, discounted it by every rational measure, and decided that it is still the most valuable thing you possess.

  Please raise your glasses.

  To the pigeons, who taught us about restraint. To Ulysses, who taught us about endurance. But mostly, to [Daughter] and [Fiancé], who teach us that the strongest bond is not the one you cannot break, but the one you simply never want to.

  To the bride and groom.
