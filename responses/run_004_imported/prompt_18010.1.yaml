      *   **Core Theme:** Precommitment devices (Ulysses, pigeons, wedding rings).
      *   **Constraint 1 (Tone):** Must be funny/witty but heartfelt. Cannot reduce marriage to *just* a rational solution to a decision-theoretic problem.
