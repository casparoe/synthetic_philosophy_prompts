      *   **Length:** About 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Science/Philosophy:**
      *   *Pigeons:* Peck a key to lock out the "smaller-sooner" reward to wait for the "larger-later" reward. This is precommitment.
      *   *Ulysses:* Tied himself to the mast to hear Sirens without jumping ship.
      *   *Hyperbolic Discounting:* Valuing immediate rewards disproportionately higher than future rewards (leading to inconsistency over time).
      *   *Akrasia:* Weakness of will, acting against one's better judgment.
      *   *The Tension:* Is tying yourself up *really* overcoming weakness, or just moving the decision to an earlier time? (The philosophical contest mentioned).
