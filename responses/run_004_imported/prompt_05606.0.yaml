answer: |-
  (Pause for a moment after the Pastor sits. Step up to the podium. Take a breath. Speak slowly.)

  Thank you, Pastor. And thank you all for being here to share this space with us.

  For those of you who didn't know him well, my grandfather spent thirty-five years driving a delivery truck. He spent most of his life on the road, watching the world go by through a windshield, worrying about schedules, traffic, and getting the package to the right door on time. But when he retired, he traded the road for a different kind of journey. He found a book—an old translation he called *Chuang Tzu*—and for the last years of his life, that book was his co-pilot.

  I know the Pastor has just spoken about heaven, and I know my grandmother finds deep comfort in the promise that Grandpa is watching over us from a better place. She is right to feel that comfort. Love doesn't end, and Grandpa's love is certainly still here. But Grandpa had his own way of understanding where he was going, and I think he would want me to share it, because it was the thing that kept him peaceful when he was sick.

  He didn't see death as a punishment, and he didn't see it as a door to somewhere else. He saw it as a return.

  He used to tell me a story from his book about a traveler who found an old skull on the road. In the story, the traveler asks the skull if it's sad to be dead. And the skull says no. It says that in death, there is no boss above you, no seasons to suffer through, and no long years of toil. You are at rest. Grandpa loved that story. I think after thirty-five years of driving, of lifting boxes, and then years of being sick, he was ready to put down the weight. He wasn't afraid of the rest.

  When he was in the hospital, near the end, he reminded me of another passage. His students wanted to give him a grand burial, and he told them: *Why bother? Heaven and earth are already my coffin. The sun and moon are my jewelry. The stars are my pearls. Everything is already ready for me.*

  He believed that his body wasn't really his to keep forever. He said we are loaned our shape for a little while. We get to be a person, we get to love our families, we get to drive the truck and read the books. And then, when the loan is up, you give the shape back. You don't lose yourself; you just stop holding onto the form.

  I have a physics test this morning, and I've been thinking about how energy never disappears, it just changes. Grandpa would have liked that. He believed he was going back into the flow of things. So, when you feel a breeze on a hot day, or you see the light coming through the trees the way he liked to watch it, he isn't far away. He isn't looking down from a distance; he is part of the world you are standing on.

  To my grandmother, and to my little cousins: It is okay to miss him. It is okay to wish he was still here in his chair. Grandpa would tell you that grief is natural, but don't let it turn into despair. He isn't trapped in a box underground. He's been handed back to the universe.

  So, let's not worry about burying him too carefully. Let him go. He's got the stars for jewelry now, and he doesn't have to drive anywhere. He's finally, truly, off the clock.

  Thank you.
