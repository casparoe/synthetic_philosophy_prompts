prompt: |-
  ok this has been bugging me. last month my sister was messing with the family ipad after being told not to and ended up cracking the screen — my parents said she owed $80 to get it fixed, so i just paid it out of my own savings and nobody cared, the ipad got fixed either way. but last week she missed curfew and got grounded for the weekend, and when i offered to stay home instead of her so she could still go out, my mom said no way, *she's* the one who has to stay home, that's just not how it works. that feels weirdly inconsistant to me but i can't put my finger on why. like in both cases she owes something for breaking a rule and someone else was willing to cover it for her, so why does it matter who actually pays in one case and not the other? is there a real reason for that or are my parents just making up the rules as they go?
reasoning: |-
