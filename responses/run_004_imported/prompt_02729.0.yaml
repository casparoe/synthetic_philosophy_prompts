answer: |-
  This is one of the most profound challenges a writer can face, particularly when working with autobiographical material. You are standing at the intersection of memory, psychology, and ethics.

  To answer your core question directly: **It is overwhelmingly likely that each of you is capturing something real about a man too complicated for any single account to hold.**

  Your sister's insistence that truth is a zero-sum game (if her version is true, yours must be a fiction) is a common defensive mechanism, but it is rarely psychologically accurate. Human beings are not static characters; they are contextual. We are different people to our spouses than to our children, different to our firstborn than to their younger siblings, and different in the private stress of a Tuesday night than in the public performance of a holiday dinner.

  Here is a framework for understanding these conflicting truths, and how to translate that complexity onto the page without betraying your family or your art.

  ### 1. Deconstructing the Three Perspectives
  To write this character well, you must understand *why* these memories diverge. None of you are lying, but you are all witnessing different facets of the same diamond.

  *   **The Older Sister (The Burden of the Firstborn):** Parents are often most anxious, rigid, and domineering with their first child. They are learning the role. If your father was naturally anxious (as you recall), that anxiety often manifests as control with the first child, whom he feels most responsible for "getting right." Furthermore, if there is a gender dynamic at play (e.g., a traditional father and a daughter), his "domineering" nature might have been specifically directed toward her, while you (depending on your gender and birth order) escaped that specific scrutiny. Her truth is the truth of **governance.**
  *   **You (The Witness of Intimacy):** You remember an "anxious man who was mostly gentle." This suggests you may have seen him when his guard was down, or perhaps you arrived later in his life when he had softened. Anxiety often looks like gentleness when it is paralyzed; it looks like domineering behavior when it is trying to protect. You likely saw the internal struggle that manifested as control for your sister. Your truth is the truth of **interiority.**
  *   **The Aunt (The Witness of Performance):** The aunt who saw him only at holidays saw his **public persona.** Most people, especially men of a certain generation, compartmentalize. The home is where the stress is released (often onto the immediate family); the holiday gathering is where the mask is worn. He could genuinely be warm and easygoing for two hours because he was not responsible for feeding, disciplining, or financing the aunt. Her truth is the truth of **reputation.**

  ### 2. The Myth of the "Real" Father
  Your sister wants to know which father was the "real" one. The answer is that the "real" father is the sum of all these interactions.

  If you choose to write him solely as cold and domineering, you betray your own lived experience. If you write him solely as gentle, you invalidate your sister's pain. If you write him as purely warm, you create a caricature.

  In fiction, contradiction is not a bug; it is a feature. A character who is gentle to the narrator but domineering to the sister is infinitely more compelling than a character who is uniformly one thing. This inconsistency *is* the character. It creates the mystery that drives a narrative.

  ### 3. Rendering Him on the Page
  How do you translate this without creating a confusing mess? You have a few artistic options:

  **Option A: The Rashomon Approach**
  Acknowledge the subjectivity. If your novel allows for it (first-person memoir or close third-person), let the narrator acknowledge the discrepancy.
  *   *Example:* "My sister remembers a tyrant. I remember a man afraid of his own shadow. Aunt Martha remembers a saint. Perhaps he was all three, shifting shapes depending on who held the light."
  This validates your sister without surrendering your own truth.

  **Option B: Show the Context**
  Don't tell the reader what he was; show him being different things in different contexts.
  *   *Scene 1:* He is helping the narrator with homework, patient but trembling with stress (Your truth).
  *   *Scene 2:* He is berating the sister for a grade, rigid and cold (Her truth).
  *   *Scene 3:* He is carving a turkey, laughing with guests, eyes crinkled (The Aunt's truth).
  Let the reader do the work of reconciling him. This creates a sense of verisimilitude that readers crave.

  **Option C: The Unreliable Narrator**
  If you are writing fiction, you can lean into the idea that memory is flawed. You can write the father as you remember him, but include the sister's version as a counterpoint in the dialogue. Let the conflict between the siblings about the father's memory become a subplot itself. This mirrors real life: often, the fight isn't about the dead parent, but about whose pain gets validated.

  ### 4. Ethical and Emotional Considerations
  Since you are drawing on your own family, you must navigate the living while writing about the dead.

  *   **Validate Your Sister:** Even if you don't write her version as the "objective truth," acknowledge its validity. If she reads the book, she needs to feel seen. If you write him as purely gentle, she will feel gaslit. If you write him as complex, she may feel understood.
  *   **Protect Your Own Truth:** Do not let her certainty bully you out of your own memories. Your experience of his gentleness is as valid as her experience of his control. You do not need to choose one.
  *   **The "Fiction" Contract:** If this is a novel, you have the license to change names and composite characters. This gives you deniability. You are not writing a biography; you are writing a story *inspired* by a life. This distinction is your shield.

  ### 5. A Recommendation for Your Process
  Before you write the scenes involving the father, try this exercise:

  Write a scene from the father's perspective (even if it never goes in the book). Why was he cold to the sister? (Fear? Pressure?) Why was he gentle to you? (Relief? Love?) Why was he charming to the aunt? (Performance? Escape?)

  If you can find the *internal logic* that connects these behaviors, you will unlock the character. Usually, the connecting thread is something like **fear**.
  *   Fear makes him control his firstborn.
  *   Fear makes him gentle with his younger child (afraid to damage what he loves).
  *   Fear makes him charming to outsiders (afraid of judgment).

  If you find that thread, you won't have to choose between the accounts. You will have found the man who holds them all.

  **Conclusion:**
  Your sister is seeking closure; you are seeking truth. Closure often requires a simple story. Truth requires a complex one. As a novelist, your duty is to the truth. Trust that the contradiction is not a problem to be solved, but the very heart of the story you are trying to tell.
