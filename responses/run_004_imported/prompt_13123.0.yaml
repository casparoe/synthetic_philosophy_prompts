  1.  **Analyze the Request:**
      *   **Role:** Customer Representative on a Science Communication Ethics Panel (only non-scientist).
      *   **Task:** Draft a short recommendation memo for the panel meeting on Friday.
      *   **Context:** Reviewing wording for a new traits report (anxiety/depression risk).
      *   **Conflict:** Marketing wants "This is your personal genetic code—here's what yours says about your risk..." (tested well). Staff Geneticist objects (DNA isn't a code with built-in meaning; implies determinism/fatalism). Marketing counters ("genetic code" is standard usage; hedging confuses).
      *   **Policy:** Consumer-facing language must be "scientifically accurate and not misleading."
      *   **Requirements:**
          *   Say concretely what to require of the language.
          *   Take a real position on "code" (literal vs. metaphor).
          *   Treat the losing side fairly (no name-calling, acknowledge validity).
          *   Tone: Professional, balanced, ethical, accessible (since I'm the non-scientist rep).

  2.  **Deconstruct the Arguments:**
      *   **Marketing:** Clarity, engagement, user testing success, common parlance ("genetic code" is widely used).
      *   **Geneticist:** Scientific precision, avoiding determinism (nature vs. nurture), ethical responsibility (mental health implications).
      *   **My Role (Customer Rep):** Advocate for the customer's understanding and well-being, bridge the gap between science and communication, ensure policy compliance ("not misleading").

  3.  **Determine the Position:**
      *   *Is "genetic code" literal?* Technically, DNA is a code (nucleotide sequences code for amino acids). However, in the context of *complex traits* like anxiety/depression, it's not a direct cipher. It's probabilistic. So, using "code" implies a direct translation that doesn't exist for these traits.
      *   *Decision:* The phrase is metaphorically useful but literally misleading in this specific context (complex behavioral traits).
      *   *Recommendation:* We need to keep the clarity Marketing wants but add the nuance the Geneticist needs. We can't use the specific phrasing proposed.
      *   *Fairness:* Acknowledge Marketing's goal (engagement/clarity) is valid. Acknowledge Geneticist's concern (determinism) is critical, especially for mental health.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo (recommendation on the traits report wording).
      *   **The Core Issue:** Address the "genetic code" phrase.
          *   *Position:* It's a metaphor, not a literal instruction manual for behavior.
          *   *Nuance:* It's accurate for proteins, misleading for complex traits.
      *   **Evaluating the Sides:**
          *   *Marketing:* Right about clarity and engagement. Users want direct answers.
          *   *Geneticist:* Right about the risk of fatalism. Mental health is sensitive.
      *   **Policy Check:** "Not misleading." If users think DNA *dictates* anxiety, that's misleading.
      *   **Concrete Recommendation:** Propose alternative wording or specific constraints.
          *   Avoid "This is your code."
          *   Use "genetic markers" or "variants."
          *   Emphasize "probability" or "likelihood," not "what it says."
          *   Include environmental context.
      *   **Closing:** Reiterate the goal (trust + understanding).

  5.  **Refining the Tone:**
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm siding entirely with the scientist just because they are the "expert." As the customer rep, my job is to protect the customer from *misunderstanding*. If the customer understands "code" as "fate," that's a failure of communication, even if "code" is scientifically colloquial.
