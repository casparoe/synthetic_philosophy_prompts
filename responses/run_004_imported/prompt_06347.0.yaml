  ok so in my formal epistemology seminar we just spent like two weeks on the Garrabrant et al logical induction paper and i think i get the mechanics but not why it actually works. the setup (roughly) is a market where computable trading strategies buy and sell shares tied to logical/mathematical sentences, and your 'beliefs' at any point in time are just whatever prices no trader can exploit for unbounded profit as the market keeps running forever. what i cant get an intuitive handle on is why THAT specific condition -- no exploitable trader -- is enough to force the prices to end up calibrated, like of the sentences priced around 0.8, roughly 80% actually turn out true. this seems weird to me bc none of this is random, every sentence's truth value is already fixed, its just not knowable in bounded time. could you give me the gut-level story for why ruling out exploitation gets you something that looks like frequentist calibration on facts that aren't stochastic at all (not the formal proof, i've seen that, just don't feel it in my bones yet)? bonus if you can also say why this counts as actual progress on the logical omniscience problem instead of just being a fancier way of restating it.
