answer: |-
  This is one of the deepest "wait, what?" moments in the paper, and you are right to feel weird about it. The intuition clash comes from conflating **ontic randomness** (the world is physically stochastic) with **epistemic uncertainty** (the world is fixed, but I am computationally bounded).

  Here is the gut-level story for why "no exploitation" forces "calibration" on deterministic facts, and why this actually solves (or dissolves) the logical omniscience problem.

  ### 1. The Gut Story: Patterns in the Errors

  Forget about logic for a second. Imagine you are a bookie setting odds on horse races. The races have already happened (the films are in a vault), but you haven't seen them. You start pricing tickets.

  If you price every horse at 0.8 probability of winning, but in reality, only 0.5 of them win, you are **miscalibrated**.
  Why does this matter? Because a trader can spot the **pattern in your errors**.

  The trader doesn't need to know *which* specific horses won. They just need to notice: *"Hey, every time this bookie says 0.8, they're wrong."*
  The trader starts betting against you every time you say 0.8.
  *   You sell a share for \$0.80.
  *   The true value is \$0.00 (it loses).
  *   You lose \$0.80 per ticket.
  *   Do this enough times, and the trader makes unbounded profit off your systematic bias.

  **Now apply this to Logic:**
  In logical induction, the "races" are mathematical sentences (e.g., "The $n$-th digit of $\pi$ is 7"). The truth is fixed. But *you* (the market) don't know it yet.

  If your prices are miscalibrated (e.g., you price a class of sentences at 0.8, but only 0.5 turn out true), that implies there is a **computable correlation** between your price and the truth value.
  *   If such a correlation exists, it is a **pattern**.
  *   If it is a pattern, it is **computable** (by definition of the traders in the paper).
  *   If it is computable, a **trader exists** who can exploit it.

  Therefore, if **no trader can exploit you**, there can be **no computable pattern in your errors**.
  If there are no patterns in your errors, your errors look like **white noise**.
  If your errors look like white noise, your prices are **calibrated**.

  **The Shift:** You aren't calibrating against a random process in the world. You are calibrating against the **limits of your own ability to find patterns.** If you were miscalibrated, it would mean there was a pattern you *should* have found but didn't. The "no exploitation" condition forces you to find all efficiently computable patterns, leaving only "random-looking" noise in the residuals.

  ### 2. Addressing the "Fixed Truth" Weirdness

  Your objection is: *"But the sentence is either True or False! It's not 80% true!"*

  This is the Bayesian vs. Frequentist hangover. Logical Induction forces you to adopt a **subjective frequentism**.

  Think about the sequence of digits of $\pi$. They are fixed. But if I ask you to bet on the $10^{100}$-th digit before you compute it, you should bet 10% on each digit 0-9.
  Why? Not because the digit is physically random. But because **relative to your computational state**, the digit is unpredictable.

  If you start pricing the digits at 50% chance of being '7', a trader (who knows the distribution of digits is uniform) will bankrupt you.
  The "probability" here isn't a property of the number $\pi$. It is a property of **your relationship to $\pi$**.

  Logical Induction says: "Since we can't be logically omniscient, we must treat logical uncertainty *as if* it were empirical uncertainty, otherwise we get Dutch-booked."
  The "no exploitation" condition forces the market to behave *as if* the truth values were drawn from a distribution matching the prices, because if they weren't, the deviation would be a computable signal that traders would arbitrage away.

  ### 3. Bonus: Why this isn't just restating Logical Omniscience

  The Logical Omniscience problem is: *Standard Bayesianism requires $P(A) = 1$ if $A$ is a tautology, and $P(A) \le P(B)$ if $A \vdash B$. Bounded agents can't do this.*

  **Old View (Restatement):** "Well, let's just say bounded agents have 'imperfect' probabilities." (This is vague. How imperfect? When are they irrational?)

  **Logical Induction View (Progress):** It provides a **normative criterion for bounded rationality**.

  1.  **It separates "Ignorance" from "Stupidity":**
      *   **Ignorance:** You don't know the millionth digit of $\pi$. (Allowed. You can price it at 10%.)
      *   **Stupidity:** You price the millionth digit at 90% because you noticed a fake pattern in the first 100 digits. (Forbidden. A trader will exploit you.)
      *   Standard Bayesianism treats both as irrational (you should know the digit). Logical Induction says Ignorance is fine, Stupidity is not.

  2.  **It handles "Learning Logic" over time:**
      *   In standard Bayes, if you don't know $A \vdash B$, you might have $P(A)=0.9$ and $P(B)=0.1$. This is incoherent.
      *   In Logical Induction, this is allowed *temporarily*. But the "no exploitation" condition ensures that as time goes on ($t \to \infty$), the prices *must* converge to coherence.
      *   It turns logical omniscience from a **precondition** (you must have it to start) into a **limit property** (you approach it as you compute more).

  3.  **It defines "Reasonable" expectations:**
      *   It tells us exactly what we can expect from a bounded reasoner. We can't expect them to know all truths. But we *can* expect them not to lose money to a strictly simpler algorithm that spots their biases.
      *   This is a huge philosophical shift. It defines rationality not as "matching the Truth," but as "not being exploitable by simpler agents."

  ### Summary
  The "no exploitation" condition works because **miscalibration is a computable pattern.** If your prices systematically diverge from truth frequencies, that divergence is a signal. The traders are essentially pattern-recognition algorithms. If they can't make money, it means you've already captured all the patterns you computationally could. The remaining uncertainty *must* look random (calibrated), even if the underlying facts are deterministic.

  It solves logical omniscience by changing the goal from "Know everything now" to "Don't be exploitably wrong about what you could have computed."
