answer: |-
  **Setting:** *A slightly stuffy lecture hall at the University of St. Andrews. The chalkboard behind the podium is covered in modal operators. The audience is packing up, but a small cluster remains. Dr. Elena Sorel, the speaker, is gathering her notes. Professor Marcus Sterling, a noted metaphysical realist, raises his hand from the front row.*

  **Sterling:** Thank you, Elena. A compelling formal reconstruction. But I want to press you on the philosophical cost of your solution. You've adopted Tennant's restriction: the Knowability Principle applies only to "Cartesian" propositions—those where $Kp$ is logically consistent. This blocks Fitch's proof, certainly. The conjunction $p \land \neg Kp$ is excluded because knowing it is contradictory.

  **Sorel:** That's correct, Marcus. The Fitch conjunction is a logical blindspot.

  **Sterling:** But here is my worry. By carving out an exception for every proposition that generates trouble, haven't you preserved the letter of the knowability principle only by abandoning its spirit? The spirit of anti-realism is that truth is not recognition-transcendent. It's that the world is, in principle, open to our cognitive grasp. But if you define the domain of "knowable truths" as "truths that aren't logically inconsistent to know," you're left with a tautology. You're telling us, "All truths are knowable, except the ones that aren't." That leaves no principled thesis behind. It renders anti-realism safe, but trivial.

  **Sorel:** A serious charge, Marcus. Triviality is the death of philosophy. But I deny that the restriction is ad hoc. It isn't a patch applied after the paradox broke the engine; it's a clarification of the fuel the engine was designed to use.

  **Sterling:** How so?

  **Sorel:** Consider what the anti-realist means by "truth." For us, truth is not a metaphysical correspondence that floats free of our capacities. It is idealized rational acceptability. It is tied to the *possibility* of verification. Now, consider the Fitch conjunction: "$p$ is true, but no one knows it." If this were a genuine candidate for truth in the anti-realist sense, it would have to be a state of affairs that could, in principle, be verified.

  **Sterling:** And you say it can't.

  **Sorel:** I say it *logically cannot*. But listen closely, because this is where the rationale lies. It is not that we restrict the principle to avoid contradiction. Rather, the restriction flows from the anti-realist conception of a *proposition* itself. For an anti-realist, a proposition is only meaningful if its truth conditions are intelligible. A truth condition that logically precludes its own recognition is not a stable state of affairs; it is a conceptual instability.

  **Sterling:** You're saying $p \land \neg Kp$ isn't a real proposition?

  **Sorel:** I'm saying it fails the constitutive constraints of truth *within an epistemic framework*. If truth is essentially linked to knowability, then a "truth" that is essentially linked to *unknowability* is a category error. It's like asking for a "married bachelor." The restriction to Cartesian propositions isn't a retreat; it's an insistence that the Knowability Principle applies only to items that satisfy the basic logical requirements of being truth-bearers in an epistemic semantics. The paradox doesn't show that anti-realism is false; it shows that the Fitch conjunction is not a genuine truth-bearer.

  **Sterling:** That sounds suspiciously like defining your problems away. You're saying, "Any truth that looks like it refutes my theory isn't actually a truth." The realist, however, sees $p \land \neg Kp$ as perfectly coherent. It describes a world where a fact obtains—say, the exact number of grains of sand on a beach at noon yesterday—but the evidence is destroyed. It's a truth that *outstrips* verification. Your move is to say, "If it outstrips verification, it's not Cartesian, so the principle doesn't apply." But that concedes the realist's point! You've admitted there are truths outside the scope of the principle.

  **Sorel:** No, I haven't admitted there are *truths* outside the scope. I've admitted there are *formulas* outside the scope. The distinction is vital. In your grain-of-sand example, the proposition is "There were $N$ grains." That proposition is Cartesian. It is knowable in principle. The fact that we *don't* know it is contingent. The Fitch conjunction adds a second conjunct: "...and no one knows it." That second conjunct turns a contingent ignorance into a logical necessity of ignorance.

  **Sterling:** But that second conjunct is true! There are truths no one knows.

  **Sorel:** There are truths no one *currently* knows. But the Fitch paradox requires the proposition to be "It is true and it is *never* known." When you assert that as a truth, you are asserting a proposition that is logically incompatible with the *act* of asserting it as known. The anti-realist claim is that truth is transparent to mind *in principle*. A proposition that asserts its own opacity to mind is not a candidate for this kind of transparency. To demand that the Knowability Principle cover such propositions is to demand that the epistemic theory of truth account for non-epistemic "truths." We refuse that demand.

  **Sterling:** So you're grounding the restriction on the nature of the propositions, not the principle?

  **Sorel:** Exactly. The substantive rationale is this: The Knowability Principle is a thesis about the *relationship* between truth and knowledge. Relationships require two relata. If the nature of the putative truth logically negates the possibility of the second relatum (knowledge), the relationship cannot obtain. This isn't circular. It's an argument that the Fitch conjunction lacks the semantic stability required to enter the domain of the principle. We aren't excluding it because it causes a paradox; we are excluding it because it violates the pre-condition of being an epistemic truth.

  **Sterling:** I see the move. You're arguing that non-Cartesian propositions are "semantic defects." But doesn't this gut the motivational force of anti-realism? The motivation was to avoid humility. We wanted to say, "There are no unknowable truths." Now you say, "There are no unknowable truths, except for the class of propositions that are defined by their unknowability." The realist hears this and says, "Fine. Call them 'defective' if you like. The fact remains that there are aspects of reality—like that lost grain count—that we cannot verify. Your restriction protects your principle from Fitch, but it doesn't protect your metaphysics from realism. You've saved the theorem, but you've lost the world."

  **Sorel:** I disagree. The "world" you're describing—a world of facts that are essentially severed from any possible evidence—is precisely what the anti-realist finds unintelligible. If I offer a substantive rationale, Marcus, it is this: Intelligibility requires the possibility of recognition. A fact that is *essentially* unrecognizable is not a fact about the world we inhabit; it is a metaphysical posit. By restricting the principle to Cartesian propositions, I am not retreating from the claim that truth is epistemic. I am doubling down on it. I am saying that if a proposition cannot be conceived as known without contradiction, it fails to describe a state of affairs that can be *true* in the sense that matters for semantics.

  **Sterling:** So the "spirit" is preserved because the spirit is about intelligibility, not just coverage?

  **Sorel:** Precisely. The spirit of anti-realism is that truth cannot outstrip our capacity to verify *because* truth is constituted by verification. If a proposition claims to be true while logically forbidding verification, it is attempting to use the concept of truth while dismantling its constitution. Tennant's restriction identifies these dismantling moves and excludes them from the domain of discourse. It's not an exception clause; it's a boundary condition on sense.

  **Sterling:** *(Pauses, tapping his pen on his notebook)* A boundary condition on sense. That's a heavy lift. You're betting the farm on the claim that non-Cartesian propositions are unintelligible.

  **Sorel:** I am betting that a theory of truth must be consistent with a theory of knowledge. If they clash, the concept of truth must yield, because for us, truth is the shadow cast by knowledge.

  **Sterling:** And for the realist, knowledge is the grasp of truth, regardless of the shadow. *(He smiles slightly)* You've made the position consistent, Elena. I'm not sure you've made it humble. But at least it's no longer trivial.

  **Sorel:** I'll take non-trivial over comfortable any day. Thank you, Marcus.

  **Sterling:** Thank you. *(He nods, finally standing up as the rest of the room begins to disperse.)*
