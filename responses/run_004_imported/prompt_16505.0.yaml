      *   **Dr. Elena Sorel (Anti-Realist):** The speaker.
      *   **Prof. Marcus Sterling (Realist):** The challenger.

  *   **Setting:** Lecture Hall, 5:15 PM.

  *   **Key beats:**
      1.  Sterling asks the "Spirit of the Principle" question.
      2.  Sorel distinguishes between logical possibility and epistemic capacity.
      3.  Sterling presses on "trivialization."
      4.  Sorel offers the "Constitutive Constraint" argument (the substantive rationale).
      5.  Sterling worries about "lost truths."
      6.  Sorel concludes on the nature of intelligibility.

  8.  **Final Review:** Does Sorel's argument sound like Tennant's actual view? Tennant argues that the Fitch conjunction is not a "stable" truth. It's a "blindspot." The restriction is motivated by the idea that knowability applies to propositions that *can* be content of knowledge. I will emphasize the *stability* and *intelligibility* aspect.

  (Proceed to generate output).

  *Wait, one more check:* The prompt asks for a "substantive, non-circular rationale."
