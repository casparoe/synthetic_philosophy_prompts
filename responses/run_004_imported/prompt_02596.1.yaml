      *   **The "Continuity" Argument:** Flesh out the temporal identity point.
      *   **The "Consent" Argument:** Refine the ratification point.
      *   **Drafting the Speech/Opinion:** Provide concrete text the author can adapt.
      *   **Dramatic Advice:** How to stage the delivery.

  7.  **Final Review against constraints:** The user wants rigor and persuasiveness. The tone should be appropriate for a novelist (creative but intellectually grounded).

      *(Self-Correction during final review)*: I should mention Jefferson's "Earth belongs to the living" as the counter-point the Justice is defeating. That adds historical weight. I should also ensure the distinction between "dead hand" and "living hand" is clear.

