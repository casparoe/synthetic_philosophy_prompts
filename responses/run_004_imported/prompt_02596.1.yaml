      *   *Fix:* Emphasize that the *mechanism* for change exists, but the *will* to use it hasn't materialized. The difficulty is the point (cooling the passion), not a bug.
      *   *Critique:* Make sure it doesn't sound too academic.
      *   *Fix:* Use sensory language (the mast, the ropes, the song). Connect the abstract to the specific law in the book (even if I don't know the law, I can frame it generally).

  6.  **Finalizing the Output Structure:**
