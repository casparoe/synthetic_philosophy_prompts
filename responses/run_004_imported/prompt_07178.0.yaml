prompt: |-
  Okay so in my Theory of Knowledge class (I'm doing the IB diploma) we've been talking about how we decide who to believe and stuff, and it made me think about something that happened at my part-time job that's honestly still bugging me. I work at a smoothie place with my aunt, who's lived in the US for like 15 years now but still has a pretty noticeable accent from growing up in Vietnam. A couple weeks ago a customer's card got charged twice cause of a register glitch, and my aunt tried to explain to our manager exactly what happened and why, but he kept cutting her off going "wait, hold on, I don't think that's right," and then turned to ME to re-explain literally the same thing she'd just said, even tho I wasn't even in the room when it happened and only knew what she told me two minutes before. She's worked that register way longer than he's even had the job. And its not just this once, she says doctors do the same thing to her, like repeating instructions slower or checking with my cousin that she "really" understood, even when she answers everything right the first time.

  My friend Mia thinks I'm reading too much into it, that the manager was just being careful because money mistakes need to be sorted out properly and any boss would double check regardless of who reported it. Maybe that's sometimes true, but theres a difference between someone reasonably double-checking a mistake and whatever this is, and I can't quite figure out what that difference actually is. It's not just "the manager is strict" and I don't think its just "the manager is racist" either — it feels more specific than that, almost like it's about whether people think she's capable of understanding and explaining things correctly in the first place, not just about whether an error happened this one time.

  We have to connect a real situation to a knowledge-related question for a reflection assignment, so could you actually help me work through this properly instead of just telling me "bias bad"? Like is there a more precise way to describe what kind of unfairness (if any) is happening here, how would you tell it apart from someone just being reasonably cautious after a mistake, and if my aunt wanted things to actually change, would the manager just "being nicer" fix it, or is the real problem something else entirely?
