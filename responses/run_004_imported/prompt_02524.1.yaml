answer: |-
  **Philadelphia, 1784. Franklin's Study.**

  **The room is cluttered with papers, a lightning rod prototype leaning in the corner. BENJAMIN FRANKLIN sits in a high-backed chair, a small leather-bound book open on his lap. ELIAS, a Quaker in plain grey, sits opposite him, holding a cup of tea. He has been watching Franklin mark a black dot in a grid.**

  **ELIAS**
  You mark the fault, but you do not erase it.

  **FRANKLIN**
  Erasing implies the fault never happened, Elias. I prefer to remember where I stumbled. It keeps the foot sure for the next step.

  **ELIAS**
  It keeps the eye on the ledger, Ben. Not the soul.

  **FRANKLIN**
  (Smiling)
  The soul is a vast and misty country. The ledger is a map. I find I travel better with a map.

  **ELIAS**
  We have spoken of this before. When you added the thirteenth. *Humility.* That was not in your original design.

  **FRANKLIN**
  It was an amendment. Proposed by a friend who felt the other twelve were being undermined by the manner in which I enforced them.

  **ELIAS**
  He told you that you were arrogant.

  **FRANKLIN**
  He told me that people *thought* I was arrogant. There is a distinction. But for a public man, the effect is the same as the cause. So, I added it. Virtue number thirteen. Imitate Jesus and Socrates.

  **ELIAS**
  A high bar.

  **FRANKLIN**
  The highest. Which is why I suspect it is the only one I have not truly cleared.

  **ELIAS**
  (Leaning forward)
  You say "cleared." As if it were a fence to be jumped. But you admitted to me once, in confidence, that you never conquered the pride. You only conquered the *expression* of it.

  **FRANKLIN**
  I trained my tongue. I forbade myself words like "certainly" or "undoubtedly." I adopted "I conceive," "it appears to me," "I imagine." It softened my conversations. Men were less combative. I was more easily heard.

  **ELIAS**
  But you still *believed* you were certain. You just hedged the bet. That is not humility, Ben. That is diplomacy. That is a costume.

  **FRANKLIN**
  Is there a difference in the outcome? If I refrain from striking you because I fear the law, or because I love you, you remain unstruck. If I listen to your counsel because I value your wisdom, or because I have trained myself not to interrupt, your counsel is still heard.

  **ELIAS**
  The difference is in the man who remains when the book is closed. If you are only performing virtue, what happens when no one is watching? What happens when the ledger is put away?

  **FRANKLIN**
  (Taps the book)
  The ledger is always watching. That is the trick of it. But to your point—I confess, Elias. I never achieved the reality of humility. I only achieved the appearance. And yet, I found the appearance sufficient for a happy life.

  **ELIAS**
  Sufficient for *your* life. But is it virtue? Or is it a sophisticated vanity? You know the danger. You wrote it down yourself. That if you ever did conquer pride, you would likely be proud of your humility.

  **FRANKLIN**
  (Laughs, a dry, rattling sound)
  Ah. The serpent eating its own tail. Yes. I am aware. It is a perfectly closed loop of self-deception.

  **ELIAS**
  And you are content with that? To build a system of moral perfection that rests on a foundation of self-congratulation? It seems to me you are bookkeeping your way into a false heaven. You are polishing the axe handle while the blade remains dull.

  **FRANKLIN**
  (Stiffens slightly)
  The axe... You recall the story?

  **ELIAS**
  The man who wanted the whole axe polished as bright as the edge. The grinder agreed, but only if the man would turn the wheel. The man turned, but the axe was broad, and the grindstone heavy. He gave up. He told the grinder he liked the axe speckled.

  **FRANKLIN**
  Precisely.

  **ELIAS**
  I always read that as a warning, Ben. Not a defense. The man settled for less because the work was hard.

  **FRANKLIN**
  Or he realized the speckles did not stop the wood from splitting. Look, Elias. I am a printer. I deal in impressions. Ink on paper. If the impression is clear, the message is conveyed. Does the paper care if the type is gold or lead?

  **ELIAS**
  The paper does not. But the printer does. God does. If you are training yourself to *seem* good, you are becoming a better actor, not a better man. You are creating a gap between the inner self and the outer show. That gap is where hypocrisy lives.

  **FRANKLIN**
  I call it civilization.

  **ELIAS**
  (Shakes head)
  It is friction. You are grinding against your own nature, but only on the surface. You say you adopted "I imagine" to soften your tone. But did it soften your heart? Or did it just make your arrogance more palatable?

  **FRANKLIN**
  (Pauses. He looks at the grid.)
  Perhaps both. But consider the alternative. If I wait until my heart is perfectly pure before I act kindly, I shall never act at all. I began this system to curb my excesses. I was young. I was loud. I was contentious. The book... it acted as a brake.

  **ELIAS**
  A brake is not a steering wheel. It stops you from crashing, but it does not tell you where to go.

  **FRANKLIN**
  It buys time. That is all I ask of it. Time to be useful. If my "performance" of humility allows me to negotiate a treaty that prevents bloodshed, does the blood care if my humility was genuine or practiced?

  **ELIAS**
  The blood does not. But you do. Eventually, you must sleep with yourself, Ben. Not with the public. Not with the French court. Yourself. When you lie in that bed, and you review the ledger... do you find peace? Or do you find a list of transactions?

  **FRANKLIN**
  (He closes the book softly.)
  I find that I am better than I was.

  **ELIAS**
  Better behaved.

  **FRANKLIN**
  Is there a measurable difference?

  **ELIAS**
  To the world, no. To the Light within, yes. One is obedience. The other is love. You have mastered obedience. You have trained the dog to sit, but you have not taught it to love the master.

  **FRANKLIN**
  (He leans back, interlacing his fingers.)
  You accuse me of ignoring the soul. I accuse you of ignoring the result. I posit that by training the behavior, the soul eventually follows. Like a path worn through a field. Walk it enough times, and the grass dies. The path becomes real.

  **ELIAS**
  Or you simply wear a rut so deep you cannot climb out of it. You admit you never conquered the pride. You only hid it behind "I conceive." That is not a path, Ben. That is a mask. And you are warning others to wear the same mask.

  **FRANKLIN**
  I am warning them that they are flawed! That they will not succeed if they aim for sainthood. They will aim for the speckled axe.

  **ELIAS**
  So the system is designed for failure?

  **FRANKLIN**
  The system is designed for *progress*. Perfection is a mirage. If I tell a man he must be perfectly humble, he will give up. If I tell him to mark a dot when he is boastful, he might boast less tomorrow.

  **ELIAS**
  And if he boasts less, but thinks *more* highly of himself for boasting less?

  **FRANKLIN**
  (He smiles, a genuine, crooked smile.)
  Then at least he is quiet.

  **ELIAS**
  (Sighs, setting his tea down.)
  You are impossible. You have built a machine to save your soul, but you have left the soul out of the gears.

  **FRANKLIN**
  I left the mystery out of the gears, Elias. The soul is God's department. The behavior is mine. I tend to my side of the ledger.

  **ELIAS**
  And the pride in your humility? The serpent?

  **FRANKLIN**
  (He picks up his quill, hovering over the book.)
  I suppose I shall have to add a fourteenth virtue.

  **ELIAS**
  And what would that be?

  **FRANKLIN**
  "Forgive yourself for being a man."

  **ELIAS**
  (After a long silence)
  That sounds less like a virtue, Ben. And more like an excuse.

  **FRANKLIN**
  (He makes a black dot on the page.)
  Perhaps. But it is the only one I have managed to keep consistently.

  **FRANKLIN closes the book. The sound is final, like a gavel. ELIAS looks at him, not with anger, but with a deep, sorrowful recognition.**

  **ELIAS**
  Then God help us all, if the best we can hope for is a well-kept excuse.

  **FRANKLIN**
  (Blowing out the candle)
  Goodnight, Elias.

  **The room goes dark.**
