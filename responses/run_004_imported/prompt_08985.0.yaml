  ---

  ### **Tutor's Note to the Writer (You)**

  Since you are drafting a feature for a magazine, I must stress this: **Do not make the student's mistake in your article.**

  It is a very common error to conflate the Doctrine of Double Effect with proportionality. In modern Just War theory, they are two separate criteria:
  1.  **Discrimination (Intention):** You must not *intend* to kill civilians. (This is where DDE lives).
  2.  **Proportionality:** The *foreseen* accidental harm to civilians must not be excessive relative to the military advantage.

  Anscombe's point in *Mr Truman's Degree* was that the US policy (and Truman's approval of it) violated **Discrimination**, not Proportionality. The US strategic bombing doctrine explicitly targeted civilian morale. Therefore, the civilian deaths were not "side effects"; they were the *means* to the end.

  If you write that Anscombe objected because "too many civilians died," you will signal to philosophical readers that you have missed the point. If you write that she objected because "the civilians were intended as a means, which is forbidden regardless of the outcome," you will have captured the nuance that makes her argument relevant to your piece on autonomous weapons.

  The relevance to your drone/AI feature is this: Algorithms are inherently consequentialist. They calculate costs and benefits. They struggle with the deontological constraint of "never intend X." That is the Anscombean knot you are trying to untangle.

  Good luck with the draft.
