answer: |-
  Here is the grading assessment you requested. I have adopted the persona of the Oxford tutor—rigorous, precise, and somewhat pedantic where necessary—because the distinction you are wrestling with is exactly where most popular accounts of this history go wrong.

  ### **Tutorial Assessment**

  **Student:** [Anonymous]
  **Topic:** Anscombe, *Mr Truman's Degree* & The Doctrine of Double Effect
  **Grade:** C+ (2:2 Lower)
  **Mark:** 11 / 20

  ---

  ### **Point-by-Point Commentary**

  **1. "Anscombe's 1956 pamphlet... argued that Oxford should not honour a man responsible for the atomic bombings... and her campaign was in fact successful..."**
  *   **Verdict:** **Correct.**
  *   **Comment:** Historically accurate. Anscombe did circulate the pamphlet, and the Hebdomadal Council did vote against the degree. It is worth noting for your feature that this was a rare instance of philosophical activism directly altering university policy.

  **2. "Her case rests on the scholastic doctrine of double effect, which distinguishes two ways a bad effect can be related to an action..."**
  *   **Verdict:** **Correct (Abstractly).**
  *   **Comment:** The definition of the Doctrine of Double Effect (DDE) provided here is standard and accurate. It correctly identifies the split between intended ends/means and merely foreseen side effects.

  **3. "Anscombe's central complaint was that the scale of civilian death at Hiroshima and Nagasaki was wildly disproportionate to any plausible military objective..."**
  *   **Verdict:** **Clear Error.**
  *   **Comment:** This is the critical failure of the answer. The tutorial question explicitly asked: *"Is her objection best understood as a claim about the proportionality... or as a claim of a different kind?"* The student has chosen the wrong option. Anscombe's argument was **not** that the bombing was disproportionate (i.e., that too many died for the gain). Her argument was that the bombing was **murder** because the death of civilians was *intended* as a means to victory (breaking morale), regardless of the numbers. Even if the bombs had killed fewer people, or if the military gain had been higher, Anscombe would still have objected. She was arguing against the *intention*, not the *calculus*.

  **4. "...so that even setting the intention behind the bombings aside, the sheer number of innocent people killed made the act impermissible..."**
  *   **Verdict:** **Clear Error.**
  *   **Comment:** This directly contradicts Anscombe's position. She insists you *cannot* set the intention aside. For Anscombe, an act that intends the death of the innocent is intrinsically unjust. By framing this as a "proportionality test," the student treats Anscombe like a utilitarian who just has a higher threshold for acceptable costs. Anscombe is an absolutist about certain prohibitions (e.g., "Do not kill the innocent").

  **5. "This is also where her wider quarrel with consequentialism comes in: she thought that once you let yourself weigh a large number of enemy lives against a smaller number of your own soldiers' lives..."**
  *   **Verdict:** **Subtly Off / Partially Correct.**
  *   **Comment:** The spirit here is right, but the mechanism is slightly blurred. Anscombe's critique in *Modern Moral Philosophy* (1958) is that consequentialism (or "utilitarianism") corrupts moral philosophy by suggesting that *any* action is permissible if the outcome is good enough. The student's phrasing ("treats persons as interchangeable") is more reminiscent of Rawls or Kant. Anscombe's specific complaint is that consequentialism makes the *concept of intention* unintelligible, thereby dissolving the prohibition against murder. However, this is the strongest part of the student's answer.

  **6. "...it is only a short step from there to justifying the deliberate killing of civilians whenever the numbers are judged to favour it."**
  *   **Verdict:** **Correct.**
  *   **Comment:** This accurately captures Anscombe's fear: that without the intention/foresight distinction, "deliberate killing" and "side-effect killing" collapse into a single calculation of net lives saved, which she viewed as morally catastrophic.

  ---

