      *   *Draft 3 (Closer to final):* Start by acknowledging the importance of safety. Then address the IIT premise. Explain that $\Phi$ is hard to calculate and doesn't necessarily scale with parameters. Mention the scientific consensus. Suggest focusing on capability-based risk assessment instead of welfare.

