answer: |-
  **Setting:** *An empty lecture hall, ten minutes after a seminar on Ergodicity Economics. The projector is still humming. ALEX (30s, wearing a t-shirt under a blazer, pacing) stands near the whiteboard covered in stochastic differential equations. JORDAN (50s, tenured, sharp suit, sitting in the front row) is packing a leather satchel.*

  **Alex:** You didn't buy it. I could see it in your face when I put up the trajectory plot. You're still clinging to the ensemble.

  **Jordan:** I'm clinging to coherence, Alex. What you presented was a compelling narrative, but mathematically? It's the same old wine in a new bottle. You've taken the Logarithmic Utility function, slapped a label on it that says "Time Average," and claimed you've discovered an objective law of rationality. You haven't. You've just hidden the subjective preference behind a physics analogy.

  **Alex:** It's not an analogy. It's the difference between a system that resets and a system that evolves. Wealth is multiplicative. If I bet my whole bankroll on a coin flip with positive expected value, the ensemble average says I get rich. The time average says I go broke. Which one eats?

  **Jordan:** The ensemble average tells you what happens if you can hedge. If you can't hedge, then yes, you have constraints. But that's a market friction, not a law of rationality. Samuelson demolished this in 1971. The "Fallacy of Large Numbers." Just because a gamble is repeated doesn't mean you maximize the geometric mean. That is only optimal if your utility function is *already* logarithmic. If I have CRRA utility with $\gamma \neq 1$, or even linear utility with a finite horizon, your Kelly criterion is suboptimal.

  **Alex:** Finite horizon! That's the trick. You assume the game ends. But life doesn't end at $T=100$. The process continues. If you maximize the arithmetic expected value on a multiplicative process, you almost surely converge to zero as $T \to \infty$. The probability of ruin goes to one. Are you arguing it's rational to choose a strategy that guarantees ruin in the long run?

  **Jordan:** I'm arguing that "long run" is a specific preference. If I have a finite liability due tomorrow, I care about the distribution of wealth tomorrow, not the asymptotic growth rate in the year 3000. By claiming the time-average growth rate is *objectively* correct, you're asserting that every rational agent must care about the limit $T \to \infty$. That's a value judgment, Alex. You're smuggling in an infinite horizon assumption and calling it ergodicity.

  **Alex:** It's not about the horizon; it's about the path. Neoclassical economics treats wealth as if it's an ensemble of parallel universes. You average the wealth of the guy who won the lottery ten times in a row with the guy who went broke. But I am not an ensemble. I am a single trajectory through time. The ensemble average is a fiction. It doesn't exist for the agent. The time average is the only observable quantity. Why should I optimize for a fiction?

  **Jordan:** Because the expectation operator is linear. It's the only way to ensure dynamic consistency without imposing specific functional forms on the growth process. Look, I grant you that wealth dynamics are non-ergodic. Fine. The process $W_{t+1} = W_t \cdot R_t$ doesn't explore the state space evenly. But solving that doesn't require you to maximize $\mathbb{E}[\ln(W)]$. It requires you to specify a utility function over the terminal wealth distribution. You're conflating the *dynamics* of the wealth with the *preferences* of the agent.

  **Alex:** No, I'm disentangling them. You say preferences determine the bet size. I say the dynamics *constrain* the bet size. If you bet too much, the volatility drag kills you. $\text{Growth} \approx \mu - \sigma^2/2$. That $\sigma^2/2$ term isn't a preference; it's a geometric penalty. It's math. If you ignore it, you aren't "risk-averse," you're just bad at arithmetic. You're ignoring the difference between the arithmetic mean and the geometric mean of returns.

  **Jordan:** That's the sleight of hand! The $\sigma^2/2$ penalty only matters if you care about the geometric mean. Why do I care about the geometric mean? Because I want to maximize the long-run growth rate. Why do I want to do that? Because I have log utility. You're running in a circle. You say "Maximize growth," I ask "Why?", you say "Because that's rational," I ask "Why?", you say "Because it maximizes growth." Samuelson called this out. There is no "objective" growth rate. There is only expected utility. If I value wealth linearly, I bet the house. If I lose, I lose. That's my preference.

  **Alex:** If you bet the house on a multiplicative gamble, you don't get to play again. It's an absorbing barrier. Zero is zero. You can't have a utility function over wealth you don't have. By treating the absorbing barrier as just another point on a utility curve, you're assuming you can step outside the system. But you can't. You're inside the process. Ergodicity breaking means the time average $\neq$ the ensemble average. When they diverge, the ensemble average is irrelevant for decision making. It's like telling a drowning man that on average, across all possible universes, he's fine.

  **Jordan:** But why is the time-average growth rate the *objective function*? That's the leap. You've replaced "Maximize Expected Utility" with "Maximize Time-Average Growth." That is, itself, a utility function! $U(W) = \ln(W)$. You haven't escaped subjective utility; you've just hardcoded a specific one and claimed it's a law of thermodynamics. You're doing normative economics and pretending it's descriptive physics.

  **Alex:** I'm not saying agents *do* maximize it. I'm saying they *should* if they want to persist. It's instrumental rationality. If your goal is to not vanish from the system, geometric growth is the only game in town. It's not about preference; it's about survival. Evolution selects for geometric growth. Firms that maximize arithmetic returns go bankrupt. The ones left standing are the Kelly bettors. It's selection bias, not preference.

  **Jordan:** Evolution selects for survival, yes. But humans aren't bacteria. We have finite lives, consumption needs, and heirs. If I'm 80 years old, I don't care about the asymptotic growth rate. I care about buying a annuity. Your "objective" criterion tells me I'm irrational for not reinvesting for a horizon I won't live to see. That's absurd. The "objective" nature of your math collapses the moment you introduce consumption or a finite end-time. And since all humans die, the infinite horizon is a metaphor, not a constraint.

  **Alex:** But the multiplicative structure holds regardless of the horizon. Even for finite $T$, the geometric mean is a better predictor of the *typical* outcome than the arithmetic mean. The arithmetic mean is skewed by outliers. The median wealth converges to the geometric mean. Do you tell your client to bet on the mean or the median? The mean is a mirage created by one guy in a billion getting lucky. The median is the reality.

  **Jordan:** I tell my client to bet on what maximizes their satisfaction, which is $E[U(W)]$. If they are worried about the median, that implies a specific risk aversion. If they are worried about ruin, that implies Inada conditions at zero. I can model all of that without invoking ergodicity. Your framework adds nothing but confusion. You say "non-ergodic," I say "concave utility." We get the same bet size, but I admit it's a preference. You pretend it's the universe telling you what to do. That's dangerous. It shuts down debate. "I can't bet less, it's unphysical!" No, you don't want to bet less. That's different.

  **Alex:** It *is* unphysical if you assume reinvestment! If you assume the wealth is carried forward, the volatility drag is a physical reduction in the growth rate. It's not risk aversion. It's friction. Imagine a car. You can drive fast, but if the road is bumpy, you lose speed. Is that a "preference" to slow down? No, it's the terrain. Wealth dynamics are the terrain. You're treating the bumps as a psychological fear of speed. I'm treating them as fuel loss.

  **Jordan:** But the car driver chooses the destination! That's the utility function. You're telling me the only rational destination is "maximum distance per gallon." Maybe I want to get there fast and risk running out. Maybe I want to enjoy the ride. By defining the objective function as the growth rate of the vehicle, you've eliminated the driver. You've reduced the agent to a capital accumulation algorithm. That's not rationality; that's servitude to the compound interest formula.

  **Alex:** I'm not saying you *must* accumulate. I'm saying if you want to engage in the gamble repeatedly, this is the math of the gamble. If you opt out of the math, the math opts you out of the game. Ruin is final. Your expected utility framework allows for a non-zero probability of ruin as long as the utility gain elsewhere compensates. But you can't compensate a non-existent agent. Once wealth hits zero, the utility function is undefined. The process stops. Your integrals diverge. My time-average stays finite.

  **Jordan:** And I can fix that with a boundary condition. $U(0) = -\infty$. Problem solved. No need for ergodicity economics. Just standard von Neumann-Morgenstern with a barrier. You're reinventing the wheel and claiming it's a square because it rolls differently on your specific patch of gravel.

  **Alex:** You can fix it with a boundary condition, but you have to *choose* to fix it. You have to *choose* $U(0) = -\infty$. Why? Because you know ruin is bad. But why is it bad? Because the process stops! The reason ruin is bad is dynamic. It's because of the time structure. You're using a static tool to solve a dynamic problem and patching the holes with ad-hoc assumptions. I'm just using the dynamic tool from the start.

  **Jordan:** But the "dynamic tool" *is* a static assumption about the limit. You prioritize the limit. That's the assumption. In a world with fat tails, the time average might not even converge. Then what? Do we stop being rational? Your "objective" math breaks down in the very markets where we need it most. Expected utility handles ambiguity. Your geometric growth demands stationarity.

  **Alex:** Stationarity is a modeling assumption, not a flaw in the criterion. But even with fat tails, the logic holds. Don't bet what you can't lose. The ensemble average lies about the risk of ruin in fat-tailed environments even more than in thin-tailed ones. The "blow-up" is more certain.

  **Jordan:** We're going in circles. You believe the time-average is ontologically privileged. I believe it's just one statistic among many, chosen by an agent with a specific preference for longevity over short-term gain. You think you've found the One True Bet Size. I think you've found the One True Bet Size *for someone who wants to live forever and never consume*.

  **Alex:** And I think you've found the One True Bet Size *for someone who believes they can average across parallel selves*. I only have one self. I only have one time. I'll take the math that respects that.

  **Jordan:** And I'll take the math that respects the fact that I have to make choices based on values, not just differential equations. Enjoy your asymptotic growth, Alex. I'm going to cash out and buy dinner.

  **Alex:** *(Watching Jordan leave)* Make sure you tip geometrically.

  **Jordan:** *(Without turning)* I'll tip based on the utility of the service. Don't wait up for the ensemble.

  *(Jordan exits. Alex turns back to the whiteboard, erases the expected value operator, and circles the time-average limit.)*
