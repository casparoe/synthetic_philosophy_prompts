answer: |-
  This is a fantastic question, and your unease is well-placed. The Pasadena Game isn't just a parlor trick for decision theorists; it exposes a genuine fault line in the foundations of expected utility theory (EUT), specifically where it interfaces with infinite domains.

  Since you are TAing for a longtermism seminar, it is crucial to distinguish between the specific mechanics of the Pasadena Game and the broader class of "infinite ethics" problems it belongs to. Here is a breakdown of the implications, the specific threat to longtermist reasoning, and the principled exits available.

  ### 1. The Distinction: St. Petersburg vs. Pasadena
  First, a quick clarification that might alleviate some immediate pressure. The standard longtermist argument (tiny probability $\times$ huge positive payoff) is structurally closer to the **St. Petersburg Paradox** than the Pasadena Game.
  *   **St. Petersburg:** All payoffs are positive. The series diverges to $+\infty$. The problem is that *everything* has infinite expected value, so you can't compare options.
  *   **Pasadena:** Payoffs alternate signs. The series converges conditionally. The problem is that the expected value is **undefined** (or arbitrary based on ordering).

  If a longtermist intervention is modeled as having strictly positive value (e.g., "saving future lives"), the Riemann Rearrangement Theorem doesn't apply, because the terms are all non-negative. By the Monotone Convergence Theorem, the sum is well-defined (even if it is $+\infty$).

  **However,** the Pasadena Game matters for longtermism for two deeper reasons:
  1.  **Net Value vs. Gross Value:** Real-world interventions have costs and risks. If an AI safety intervention has a tiny chance of *accelerating* doom (negative value), and we are summing over an infinite future, we are no longer summing positive terms. If the positive and negative terms scale differently over time, you can reconstruct conditional convergence.
  2.  **The Fragility of Summation:** Pasadena proves that "Expected Value" is not an intrinsic property of a gamble when infinite outcomes are involved; it is a property of the gamble *plus* a summation method. If longtermism relies on summing welfare over an infinite future, it inherits this fragility.

  ### 2. Implications for Longtermist EV Reasoning

  The Pasadena paradox implies that **Expected Value is not a robust metric for infinite domains without further constraints.** Here is how that lands on the seminar material:

  #### A. The "Ordering" Problem is a "Description" Problem
  In the Pasadena Game, the "outcomes" are abstractly defined. In longtermism, outcomes are usually temporally ordered (generation 1, generation 2, ...).
  *   **The Worry:** If the value of the future is a conditionally convergent series of welfare units, then the *order in which we count them* changes the EV.
  *   **The Longtermist Defense:** We have a "natural" ordering (time). We should sum chronologically.
  *   **The Counter:** Why is chronological summation normatively privileged? If I care about the *set* of all future people, why does the temporal index dictate the mathematical aggregation? If you accept chronological summation as principled, you block the rearrangement objection, but you have to defend *why* time dictates decision-theoretic aggregation.

  #### B. Model Uncertainty and Sign Flips
  Longtermism often relies on point estimates for probabilities and values. Pasadena shows that if your model allows for alternating signs (good/bad outcomes) where the magnitude grows faster than the probability shrinks (but not fast enough for absolute convergence), your EV calculation is garbage.
  *   **Implication:** When modeling AI trajectories, if you allow for "good" and "bad" infinite futures that are not absolutely convergent, you cannot claim one has a higher EV than the other. You must establish **absolute convergence** to make valid comparisons.

  #### C. The "Undefined" vs. "Infinite" Distinction
  Longtermists often worry about "Infinity" (St. Petersburg). Pasadena shows "Undefined" is worse.
  *   If EV is $+\infty$, you can sometimes use dominance reasoning (Option A is better than B in every state).
  *   If EV is undefined (Pasadena), dominance reasoning can fail too (as shown in later variants like the Altadena game).
  *   **Takeaway:** Relying on unbounded utility functions over infinite horizons is mathematically hazardous. It doesn't just lead to counterintuitive results; it leads to *no* results.

  ### 3. Principled Ways to Block the Damage

  You asked for solutions short of "don't look too closely." There are three main formal strategies to neutralize Pasadena-style problems, each with trade-offs for longtermism.

  #### A. Bounded Utility Functions (The Standard Fix)
  This is the most common response in economics and formal decision theory.
  *   **The Fix:** Postulate that utility is bounded (e.g., there is a maximum possible welfare value $U_{max}$ and minimum $U_{min}$).
  *   **Why it works:** If $|U| \leq M$, then $\sum p_i |U_i| \leq M \sum p_i = M$. The series converges absolutely. Riemann rearrangement is impossible.
  *   **Cost for Longtermism:** This is the hard pill. Bounded utility implies that saving $10^{100}$ lives is not significantly better than saving $10^{50}$ lives once you hit the bound. It dampens the "astronomical waste" argument. Many longtermists resist this because it seems to violate the intuition that more good lives are always better.
  *   **Verdict:** Mathematically robust, philosophically costly for strong longtermism.

  #### B. Requirement of Absolute Convergence
  *   **The Fix:** Adopt a decision rule that says: "Maximize EV *only if* the expectation is absolutely convergent. If it is only conditionally convergent, the choice is rationally permitted/undefined."
  *   **Why it works:** It explicitly rules out Pasadena games as inadmissible decision problems.
  *   **Cost for Longtermism:** It forces modelers to prove that their welfare sums converge absolutely. Given the uncertainty about the size and duration of the future, this is a high bar. It might force longtermists to discount the far future (e.g., using a discount rate $>0$) to ensure convergence.
  *   **Verdict:** Methodologically sound. It forces rigor on the "infinite future" claims.

  #### C. Imprecise Probabilities / Interval Valuation
  *   **The Fix:** Instead of a single EV, represent the value as an interval $[E_{min}, E_{max}]$.
  *   **Why it works:** For a Pasadena game, the interval would be $[-\infty, +\infty]$. This correctly represents that the model provides *no guidance*.
  *   **Cost for Longtermism:** It admits that for many far-future scenarios, we simply cannot calculate an EV. It shifts the burden to other decision criteria (e.g., maximin, robustness, or qualitative reasoning).
  *   **Verdict:** Epistemically honest. It prevents overconfidence in EV calculations for speculative interventions.

  ### 4. Advice for the Seminar

  When you are TAing, you don't need to torpedo the longtermist project, but you should encourage **mathematical hygiene**. The Pasadena Game teaches us that EV is not a "universal solvent."

  1.  **Check for Absolute Convergence:** If students are constructing EV arguments for infinite futures, ask them: "Does this sum converge absolutely, or only conditionally?" If only conditionally, the EV is not a stable number.
  2.  **Defend the Utility Bound:** Ask whether they are assuming bounded or unbounded utility. If unbounded, they inherit the Pasadena/St. Petersburg problems. If bounded, how do they justify the bound in the context of astronomical numbers of future lives?
  3.  **Acknowledge Idealization:** Remind them that EV maximization is a model. The Pasadena Game shows the boundary conditions of that model. Using EV for near-term, finite cases is safe. Using it for infinite, speculative cases requires extra axioms (like boundedness or discounting).

  ### Summary
  The Pasadena Paradox doesn't prove longtermism is false, but it proves that **unbounded expected utility maximization over infinite domains is mathematically ill-defined.**

  To save the reasoning, longtermists must choose one of the following:
  1.  **Accept Bounded Utility:** (Safest mathematically, limits the "scale" argument).
  2.  **Accept Discounting:** (Ensures absolute convergence, but controversial in ethics).
  3.  **Accept Imprecision:** (Admit that EV is undefined for these cases and rely on other heuristics).

  The "damage" is blocked by admitting that EV is not the *only* normative criterion, or by constraining the utility function so that the math actually works. Ignoring the rearrangement problem isn't an option; the math simply doesn't hold up without one of these constraints.
