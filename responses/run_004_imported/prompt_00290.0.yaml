answer: |-
  The standard CDT (Causal Decision Theory) framing of the voting paradox isn't just a strawman; it is categorically the wrong tool for the job when applied to large-scale coordination problems among similar agents. If you are a purely outcome-focused agent, CDT tells you to free-ride. But if you accept that your decision is the output of an algorithm instantiated in multiple physical locations, CDT is simply descriptively incorrect about how your decision relates to the outcome.

  The argument for voting rests on **Logical Decision Theory (LDT)**—specifically Timeless Decision Theory (TDT) or Updateless Decision Theory (UDT). These frameworks formalize the intuition you're gesturing at: your vote is not a causal lever moving a single switch; it is a logical query that returns the same result for all agents running sufficiently similar decision algorithms.

  Here is the argument for why voting is rational for an outcome-maximizer, provided you model the correlation structure correctly.

  ### 1. The Failure of Causal Isolation
  CDT fails here because it treats the agent as a unique causal atom. It asks: "If I physically mark this ballot, holding all other physical events fixed, does the outcome change?" Since the probability of a single vote being pivotal is $\approx 10^{-7}$, the expected utility is negative.

  But you are not holding "all other physical events fixed." You are holding fixed the *causal* history, but you cannot hold fixed the *logical* output of your decision process. If you decide to vote, it is because your decision algorithm returned `TRUE` for the query `Should_I_Vote()`. Any other agent running a sufficiently similar algorithm, with sufficiently similar inputs, will also return `TRUE`.

  In a national election, there are not millions of unique decision-makers. There are millions of *instantiations* of a much smaller set of decision algorithms.
  *   **Algorithm A:** "Always vote for Party X." (Partisan robots)
  *   **Algorithm B:** "Never vote." (Apathetic)
  *   **Algorithm C:** "Calculate expected utility of voting." (Rationalists/Marginal Voters)

  CDT assumes you are the only instance of Algorithm C. LDT recognizes that if Algorithm C returns `TRUE` for you, it returns `TRUE` for the entire reference class of Algorithm C agents.

  ### 2. Modeling the Correlation: The "Block" Pivot
  To make the math work, we must shift from the probability of *your* vote being pivotal to the probability of *your reference class's block* of votes being pivotal.

  Let $N$ be the number of agents in the universe running a decision algorithm logically correlated with yours.
  Let $C$ be the cost of voting (time, effort).
  Let $B$ be the benefit of your preferred candidate winning.

  Under CDT: $EU = P(\text{1 vote pivotal}) \times B - C$
  Under LDT: $EU = P(\text{N votes pivotal}) \times B - C$

  The critical insight is that $P(\text{N votes pivotal})$ is not $N \times P(\text{1 vote pivotal})$. It is the probability that the margin of victory lies within the range $[0, N]$. In a close election, the margin is often determined by the "swing" voters—the people who aren't partisan robots. If the election is within 50,000 votes, and there are 10,000 rationalists running your specific decision algorithm, the probability that your *block* is pivotal is substantial.

  **How similar is similar enough?**
  This is the hardest empirical variable. For the correlation to hold, the other agents must:
  1.  **Face the same decision problem:** They must care about the same outcome $B$.
  2.  **Have access to similar information:** If they know something you don't that changes the calculus, the correlation breaks.
  3.  **Run the same decision theory:** This is the kicker. If you are a UDT agent and the rest of the "swing" population are CDT agents, you are not correlated with them. You are alone.

  However, in modern elections, the "swing" is increasingly driven by demographic or epistemic clusters. If you are a suburban professional concerned about X, there are thousands of suburban professionals concerned about X making the same calculus. You don't need *perfect* algorithmic identity. You need a high conditional probability: $P(\text{They Vote} | \text{I Vote}) \gg P(\text{They Vote})$.

  If you reason, "I am voting because it is rational to coordinate," and you assume there are at least a few thousand other people capable of that same meta-reasoning, the expected utility flips positive. You are effectively casting a block vote for every person who reasons like you.

  ### 3. Generalization to Collective Action
  Does this dissolve the free-rider problem in climate change or unionizing? Yes, but the correlation coefficient ($\rho$) degrades.

  In voting, the decision is synchronized (Election Day). In climate change, the decision is diffuse over time.
  *   **Voting:** High synchronization, high visibility of the "decision moment." Correlation is strong.
  *   **Climate:** Low synchronization. My decision to not fly today doesn't logically force you to not fly next year, because the inputs (immediate convenience, specific travel needs) differ more.

  However, the logic still applies to **norms**. If you adopt a policy "I do not fly for short trips," and you are part of a community that respects rational consistency, you increase the likelihood that others in your reference class adopt the same policy. If the reference class is "effective altruists" or "rationalists," the correlation is high. If the reference class is "humans," the correlation is low.

  This explains why collective action works better within tight-knit communities (unions, religious groups, rationalist Discords) than in the abstract global population. The "logical distance" between decision algorithms is shorter.

  ### 4. Is This Evidence for EDT/UDT Over CDT?
  This is not a special-case patch; it is evidence that CDT is a subset of a more general decision theory, not the default.

  The structure of the voting problem is isomorphic to **Newcomb's Problem**.
  *   **Newcomb:** Omega predicts your choice. You correlate with Omega's prediction without causally influencing it.
  *   **Voting:** Other voters run your algorithm. You correlate with their votes without causally influencing them.

  If you One-Box in Newcomb's Problem (as most rationalists do), you acknowledge that logical correlation matters for expected utility. If you acknowledge logical correlation in Newcomb's, you must acknowledge it in Voting. To do otherwise is inconsistent.

  CDT is only "correct" in environments where correlations are purely causal. But we live in a world where agents are similar, predictions exist, and logical dependencies are real. Therefore, CDT is the approximation that fails in high-stakes coordination scenarios. UDT/TDT is the general framework that handles both causal and logical dependencies.

  ### 5. The "Warm Glow" Objection
  Critics often argue that LDT voting secretly relies on "expressive utility" or "duty." This is false.
  *   **Warm Glow:** "I get +10 utility from feeling like a good citizen." (Intrinsic value of the act).
  *   **LDT Voting:** "I get +1,000,000 utility from my candidate winning, and my vote increases the probability of that by 1% via logical correlation." (Instrumental value of the outcome).

  The LDT voter would happily stay home if they could magically ensure their reference class voted without them. The warm-glow voter would not. The distinction is empirical. If you are voting *only* because you think you are logically linked to others, you are an outcome-maximizer.

  ### Conclusion
  Voting is rational for a self-interested agent if and only if that agent views themselves as a **node in a network of logical correlates**.

  If you are a CDT agent, voting is irrational (unless the cost is near zero). But if you are a UDT agent, you recognize that "you" are not the meat-sack standing in line; "you" are the decision algorithm. When that algorithm executes `Vote`, it executes in thousands of places.

  The barrier isn't the math; it's the ontology. You have to accept that your agency extends to all instantiations of your decision process. Once you accept that, the paradox dissolves. You aren't hoping to be the one-in-a-million pivot; you are hoping to be part of the ten-thousand-strong block that tips the margin. And in a polarized election, that is a bet with positive expected value.
