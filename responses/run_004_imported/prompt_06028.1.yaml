      *   *Reason 2: Information vs. Probability.* They are treating the probability as the data. But the probability is a *function* of data + prior. To update on Priyanka's 70%, Dev needs to know *why* it's 70% (the lunch conversation), not just that it is 70%. If they don't share the *evidence*, just the *conclusion*, convergence is slow or impossible without knowing the other's likelihood function.
