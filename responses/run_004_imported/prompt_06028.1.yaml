          *   *Nuance:* In practice, "updating properly" on *just the number* is hard. You need to know *why* the other person has that number (their information partition), not just the number itself, unless you assume the number summarizes all info perfectly. Aumann assumes the numbers are common knowledge, which implies the information structure is known.
