      *Wait, one more check on Dominance:* The student says "r never changes which outcomes are ranked above which." This is technically about the utility function $u$. Dominance is about *acts*. If Act A > Act B in every state, REU(A) > REU(B). This holds because $r$ is monotonic. The student's explanation implies $r$ acts on outcomes, which is slightly confused. I'll stick with 4/6 for this section.

      *Wait, one more check on Loss Aversion:* Buchak is very clear that REU is *not* Prospect Theory. PT uses loss aversion and probability weighting. REU uses risk weighting. Conflating them is a significant reading comprehension error for a seminar on Buchak. I need to make sure the feedback emphasizes this.

