      *   **Focus:** They are specifically interested in the "Sovereign Individual" passage in the Second Essay (GM II:2).
      *   **Interpretation:** The user interprets the Sovereign Individual as Nietzsche's *positive ideal*—the end goal of the "morality of custom" (breeding an animal with the right to make promises). They see this figure as autonomous, self-mastering, promise-keeping, and possessing a "conscience" defined as pride in one's own power/responsibility.
