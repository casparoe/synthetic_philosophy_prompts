      *   *Actually, the strongest Buchak point:* The Independence Axiom demands that you ignore the common consequence. Buchak says the common consequence *matters* for risk. Regarding dynamics: She argues for **Resolute Choice**. You make a plan at $t_0$ and stick to it at $t_1$, even if your preferences shift, because the rationality constraint applies to the plan, not the momentary impulse.

