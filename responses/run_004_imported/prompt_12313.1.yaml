answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], [Sister's Name]'s younger sibling.

  For thirty years, my sister worked as a school secretary. She never set foot in a university, though she read more than most graduates I've met. She was the voice on the intercom, the hand that organized the fundraisers, and the person who knew which second-grader needed an extra cookie and which teacher needed a quiet moment. To our parents, she was a devoted daughter. To her neighbors, a steady friend. And to me, she was the person who taught me that caring about the world is a heavy, complicated, and beautiful thing.

  If you asked her coworkers or our parents what she spent her time thinking about, they might say lesson plans, or schedules, or us. But for the last fifteen years, there was a specific quiet preoccupation that lived in the background of her life. She picked it up from online philosophy forums. She would have been the first to laugh at anyone calling her a philosopher, but she grappled with an idea she called, in exactly those words, "consequentialist cluelessness."

  It's a complicated phrase, but her version of it was simple. It was the worry that even when you are sincerely trying to do the most good, you can never trace out the full downstream consequences of what you do. And so, you can never really know whether you succeeded.

  I remember one Thanksgiving, we were halfway through dinner when she put her fork down. She had been reading about the charity she supported, the Against Malaria Foundation. She told us, half-laughing and half-stricken, that some of the bed nets these charities distribute get used as fishing nets. She wanted to know out loud whether that meant her donations might have quietly depleted somebody's fish stocks and left the people she meant to help worse off.

  The table went quiet. Most of us just wanted to eat the pie. But for her, this wasn't abstract. It was a moral weight.

  For fifteen years, she carried this. It became a kind of family joke that wasn't really a joke. When the worry came up, she would shrug, smile that tired, kind smile of hers, and say, "Well, we can't know that." And then, the next month, she would send the money anyway.

  She never arrived anywhere she was willing to call an answer. She never claimed certainty. And I know there are two people here today from her reading group who know that better than anyone. I want you to know that I won't stand here and pretend she solved that puzzle. She didn't. She sat with it. She honored the complexity of the world enough to admit she couldn't see the end of her own actions.

  But to our parents, to her friends from the school, and to everyone here who just wants to know if her life added up to something good: I am here to tell you that it did.

  Because I have been thinking about her argument all week. And I've realized that her life was actually the answer to her own worry.

  "Consequentialist cluelessness" suggests that because we can't see the future, we can't know if we matter. But my sister proved that goodness isn't about knowing the outcome. Goodness is about the willingness to act in the face of the unknown.

  She gave a fixed slice of her modest paycheck every month, not because she was sure it would fix the world, but because she cared enough to try even when she wasn't sure. She showed up to work for thirty years, not because she knew every child would succeed, but because they needed her there.

  She lived with the uncertainty, and she loved through it.

  So, if you are looking for proof that her life mattered, don't look for a perfect ledger of consequences. Look at the fact that she kept sending the money. Look at the fact that she kept showing up. In a world that demands certainty, she offered effort. In a world that asks for guarantees, she offered hope.

  She worried that she might not know if she did enough. But I know this: I know the comfort she gave our parents. I know the stability she gave her school. And I know that the world is undeniably better because she was in it, trying her best, even when she couldn't calculate the rest.

  She couldn't know the full consequences of her life. But we can. We are sitting in them.

  Thank you.
