answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of supervising both [Groom] and [Bride]'s dissertations. Which means I have spent the last several years reading hundreds of pages of their writing, mostly about what depends on what.

  In philosophy, we call this "grounding." If you ask a non-philosopher, "Why is this table here?" they might say, "Because I put it here." If you ask a metaphysician, they ask, "What *grounds* the fact that the table is here? Is it the wood? The atoms? God? Or is it just... brute fact?"

  [Groom] and [Bride] built their careers on this question, but from opposite ends of the room.

  [Groom] defended the orthodox view. He believes reality is a neat hierarchy. Like a building, it needs a foundation. For him, if you trace the chain of why things exist, it has to stop somewhere. There must be a bottom layer—fundamental things that aren't grounded in anything else. He wants a universe with a floor.

  [Bride], on the other hand, spent her dissertation trying to remove the floor. She argued that dependence can be mutual. Circles are okay. Infinite chains are okay. As she famously put it to me during her defense, after a glass of wine, she sees no reason to rule out "turtles all the way down."

  (She also briefly flirted with the idea that the *entire universe* is the only fundamental thing—a view called Priority Monism—but her committee, myself included, talked her out of it. We felt that was less of a solution and more of a way to dodge the question. Some habits die hard.)

  They met at a Pacific APA reception, apparently arguing about this very issue. And as far as I can tell, neither has conceded an inch since. Which leads to the question everyone is thinking, or at least everyone in this room with a PhD is thinking: What does this mean for the marriage?

  Is this union going to follow [Groom]'s model? Is one of them the "fundamentalia," the bedrock upon which the other rests? I wouldn't recommend it. In my experience, relationships based on strict asymmetric ordering tend to end in divorce, not publication.

  Or is it [Bride]'s model? A relationship of mutual, infinite dependence? "I love you because you love me because I love you..." It's romantic, but logically precarious. If there's no bottom, do they ever actually touch the ground?

  I propose a third option. A synthesis.

  Perhaps the marriage itself is the metaphysical novelty. Individually, they are both complex, grounded beings. But together, they form a new unit. In the logic of love, the *relationship* is the fundamental fact. It is the one thing that does not require further explanation. It is the stopping point.

  You don't ask *why* they love each other any more than you ask why an electron has a charge. It is simply the case. It is the bedrock upon which they will build their life, their family, and their future arguments.

  So, if I could ask everyone to rise.

  [Groom], you wanted a well-founded order. [Bride], you wanted to embrace the infinite. May you find that your life together is well-founded enough to feel secure, but open-ended enough to keep you arguing for the rest of your days.

  To the bride and groom: May your love be the one ungrounded ground in your universe.

  To [Groom] and [Bride]!
