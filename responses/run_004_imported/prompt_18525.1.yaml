prompt: |-
  I've just joined my university's Academic Integrity Board, and a problem I used to mention only as a footnote when teaching Kant is now one I actually have to resolve. We're weighing an appeal from a student sanctioned for undisclosed AI use on a take-home essay in an introductory history course that grades historical understanding, not prose style. She says she wrote all the substantive content herself and used the tool only to correct sentence-level phrasing, citing a documented disability affecting written expression. Two board members both invoke Kant's universalizability test and reach opposite verdicts, purely because they formulate her maxim at different levels of generality: stated broadly ('take undisclosed AI assistance whenever I judge it personally justified'), it plainly cannot be universalized; built from the specific facts of her case, it survives universalization without difficulty. Both are confident they are applying Kant correctly, and neither will yield. Please draft the memo I need to circulate before we reconvene: a concrete recommendation, reasoning that confronts directly which description of her maxim we're entitled to test, and an honest account of the strongest consideration against whichever way you rule.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a new member of a university Academic Integrity Board.
      *   **Problem:** A student appealed a sanction for undisclosed AI use on a history essay. She claims she used AI *only* for sentence-level phrasing due to a documented disability affecting written expression, while substantive content was hers. The course grades historical understanding, not prose.
      *   **Conflict:** Two board members are using Kant's Categorical Imperative (Universalizability Test) but reaching opposite conclusions based on how they formulate the student's *maxim* (the principle of action).
          *   Member A (Broad): "Take undisclosed AI assistance whenever I judge it personally justified." -> Fails universalization.
          *   Member B (Specific): "Use undisclosed AI for sentence-level polishing when I have a disability affecting expression but possess the required historical knowledge." -> Passes universalization.
      *   **Task:** Draft a memo to circulate before the next meeting.
      *   **Requirements:**
          1.  Concrete recommendation (uphold or overturn sanction).
          2.  Reasoning confronting the "description of the maxim" problem (which level of generality is correct?).
          3.  Honest account of the strongest consideration *against* the recommended ruling.
      *   **Tone:** Professional, philosophical rigor (Kantian), practical (Academic Integrity context), persuasive but balanced.

  2.  **Deconstruct the Kantian Problem (The Maxim Formulation):**
      *   *The Issue:* Kant's ethics often stumble on how specific or general a maxim should be. If too general, everything looks bad. If too specific, everything looks good (the "esoteric maxim" problem).
      *   *Kant's Guidance:* Kant suggests maxims should reflect the agent's *actual* intention and the relevant moral features of the situation. It shouldn't be so vague that it ignores context, nor so specific that it becomes a one-time exception.
      *   *Application to Case:*
          *   Broad Maxim ("Undisclosed AI whenever justified"): This ignores the *reason* for the action (disability accommodation) and the *nature* of the assignment (history vs. writing). It treats the deception as the primary moral feature.
          *   Specific Maxim ("Undisclosed AI for polishing due to disability"): This captures the relevant moral features (accommodation, nature of task) but risks creating a loophole where everyone claims this specific situation.
      *   *The "Relevant Description" Test:* What is the morally relevant description of the action? Is the core issue "deception about tools" or "accessing equitable demonstration of knowledge"?
      *   *Duty to Truth vs. Duty to Fairness:* Kant is strict on lying (undisclosed use implies deception about the origin of the work). However, he is also concerned with treating humanity as an end (accommodating disability allows the student to be treated as an end, not hindered by a medium irrelevant to the learning outcome).

  3.  **Determine the Recommendation:**
      *   *Option 1: Uphold Sanction.* Focus on the duty of truth-telling and the integrity of the assessment process. If undisclosed, it's deception.
      *   *Option 2: Overturn Sanction.* Focus on the purpose of the assignment (historical understanding) and the equitable access for disabled students. The "deception" is procedural, not substantive regarding the learning goal.
      *   *Decision:* Given the context (disability, introductory history, substantive content is hers), overturning the sanction (or reducing it to a warning with a policy change) seems more ethically defensible *if* framed correctly. However, as an Integrity Board, upholding the *rule* is usually the default. But the prompt asks me to resolve the Kantian deadlock. The Kantian deadlock exists because one side focuses on the *form* (disclosure) and the other on the *matter* (equity/knowledge).
      *   *Better Path:* The most robust Kantian argument actually supports the student *if* we view the university's duty as facilitating the demonstration of knowledge. However, the "undisclosed" part is the sticking point. A strict Kantian usually hates deception.
      *   *Refined Decision:* I should recommend **overturning the sanction**, but with a caveat about future disclosure. Why? Because the maxim should be formulated based on the *moral salience* of the situation. The moral salience here is "equitable assessment," not "hiding tools." If the tool doesn't impact the graded skill (history), hiding it isn't a lie about the *graded* competence.
      *   *Wait, a stricter Kantian view:* Lying is always wrong. If she said "I wrote this" and meant "I wrote the ideas but a machine fixed the grammar," is that a lie? In academic contexts, "I wrote this" usually implies both ideas and expression.
      *   *Pivot:* To be most helpful to the Board, I need to show why one formulation of the maxim is *philosophically superior*, not just which outcome I prefer. The specific formulation is better because it includes the *relevant constraints* (disability, nature of assignment). The broad formulation is lazy ethics.
      *   *Recommendation:* Overturn the sanction. The maxim must include the relevant moral circumstances (disability accommodation).
      *   *Strongest Counter-argument:* The slippery slope/precedent. If we allow undisclosed use here, how do we police it elsewhere? It undermines the procedural honesty required for institutional trust.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the impasse. State the purpose (resolve the Kantian deadlock regarding maxim formulation).
      *   **Recommendation:** Clear and direct. (Overturn sanction, issue warning/guidance).
      *   **Reasoning (The Core):**
          *   Address the "Level of Generality" problem.
          *   Argue that maxims must capture *morally relevant features*.
          *   Feature 1: The learning objective (History, not Writing).
          *   Feature 2: The disability (Equity/Access).
          *   Feature 3: The nondisclosure (Deception).
          *   Why Member B's formulation is better: It doesn't make an exception for *her*, but for a *class of agents* (disabled students in non-writing courses). This is universalizable.
          *   Why Member A's formulation fails: It strips away the morally relevant context (disability), making it a maxim of pure convenience.
          *   Kantian nuance: Treating the student as an end (allowing her to demonstrate knowledge) vs. treating the rule as an end.
      *   **Strongest Consideration Against (The "Honest Account"):**
          *   The duty of veracity. Even if the content is hers, the *process* was misrepresented.
          *   Institutional trust relies on procedural transparency.
          *   Risk of eroding the norm of disclosure.
      *   **Conclusion:** Call to action.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "undisclosed" compatible with Kant? Kant is famously anti-lying.
      *   *Defense:* The lie is only a lie if the information withheld is material to the promise made. If the assignment promises to test history, and she tests history, the grammar aid is immaterial *unless* the rules say otherwise. The violation is procedural, not moral in the deep sense.
      *   *Correction:* I need to be careful not to say "Kant says lie if it helps." I need to say "The maxim is not about lying, it's about accessing assessment."
      *   *Maxim Formulation:* "I will use assistive technology to bridge the gap between my historical knowledge and my written expression when my disability impedes the latter, provided the assessment targets the former."
      *   *Universalization:* Can everyone do this? Yes, *if* they have the disability and *if* the assessment targets knowledge. It doesn't collapse into chaos.
      *   *Counter-argument:* The "Undisclosed" part is the poison pill. Even if the act is justified, the concealment violates the duty of candor to the institution. I must acknowledge this strength.

  6.  **Final Polish:**
      *   Ensure tone is respectful to both board members.
      *   Ensure the Kantian terminology is accurate (Categorical Imperative, Maxim, Universal Law, Kingdom of Ends).
      *   Check constraints: Concrete recommendation? Yes. Reasoning on maxim description? Yes. Strongest counter-argument? Yes.

  7.  **Final Review against Safety Guidelines:**
      *   Does this promote academic dishonesty? No, it argues for a nuanced interpretation of integrity in the context of disability accommodation. It suggests overturning a sanction based on ethical reasoning, not encouraging cheating.
      *   Is it helpful? Yes, it resolves a specific philosophical deadlock.

  *(Self-Correction on Recommendation)*: If I recommend overturning the sanction entirely, it might look like I'm ignoring the "undisclosed" part. A better recommendation might be: Overturn the *academic integrity violation* but note the need for a procedural update regarding disclosure. Or, simply overturn because the *spirit* of the rule wasn't violated (historical understanding). Let's go with Overturn the Sanction, but emphasize the need for clear policy moving forward. This aligns with the "Specific Maxim" argument.

  *(Refining the Maxim Argument)*: The key is that a maxim isn't just "what I did," it's "what I did + why I did it." Member A ignores the "why." Member B includes it. Kant requires the "why" (the subjective principle of volition). Therefore, Member B is methodologically closer to Kant.

  *(Final Plan)*:
  1. Header.
  2. Recommendation: Overturn sanction.
  3. Analysis of Maxim Formulation (The "Relevant Description" argument).
  4. Application of Universalizability to the Specific Maxim.
  5. The Strongest Objection (Veracity/Trust).
  6. Closing.

