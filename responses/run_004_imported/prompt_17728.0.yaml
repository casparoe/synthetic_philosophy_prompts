answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I did my doctorate alongside [Bride] and [Groom], in a field unrelated enough to theirs that I can stand here today as neutral territory. I am, effectively, the Switzerland of this department.

  And if you know [Bride] and [Groom], you know that finding neutral territory is a rare and precious thing.

  [Bride], as many of you know, is a social psychologist. Her work suggests that what we call "character" is often just an illusion. She reminds us that good people do terrible things if the situation pressures them, and busy people walk past those in need if they're late for a lecture. She argues that context is king.

  [Groom] is a philosopher. He works in virtue ethics. He argues that character is real. He believes there are stable traits inside us—courage, honesty, love—that allow us to hold our footing even when the situation turns ugly.

  They met at a conference, reportedly arguing about this very topic. They've been dating ever since, neither having conceded a single inch. If you're family, you've heard this bickering for years. You might have wondered why a couple would build a life on a disagreement they refuse to resolve.

  But I think today offers a chance to see that this isn't a bug in their relationship. It's the architecture.

  Because if you look closely, a wedding is actually a strange move in this specific debate.

  On the one hand, marriage looks like a victory for [Groom]'s virtue ethics. When you stand here and make a vow, you are making a claim about your own character. You are saying, "I am the kind of person who will love you when it is easy, and I will also be the kind of person who loves you when it is hard." You are betting on the stability of the self.

  But on the other hand, getting married is profoundly situationist. It is a deliberate, radical engineering of your future context. You are choosing who you wake up next to. You are choosing who watches you when you're tired, who challenges you when you're wrong, and who holds you when you're grieving. You aren't trusting your character to survive the world alone; you are curating the world so that your best character has a chance to emerge.

  In a way, [Bride] and [Groom] have discovered that the truth isn't in choosing a side. It's in the loop between the two.

  We do need virtue. We need to cultivate the habits of patience and kindness so that we can show up for each other. But we also need the situation. We need to build a home, a routine, and a partnership that makes patience possible and kindness easy.

  [Bride] teaches us that we must be humble about our own goodness, and careful about the environments we create. [Groom] teaches us that we are capable of growth, and that we are responsible for who we become.

  Married life, I suspect, will be the ongoing practice of both. It will be the work of building a situation so supportive that your virtues don't have to work quite as hard to survive. And it will be the work of cultivating a character strong enough to protect the situation you've built when the world gets difficult.

  So, I'd like to propose a toast.

  To [Bride] and [Groom]. May your argument continue for decades, because it means you're still thinking. May your home be a situation that brings out the best in you both. And may your character be steady enough to keep the promises you make today.

  To the bride and groom.
