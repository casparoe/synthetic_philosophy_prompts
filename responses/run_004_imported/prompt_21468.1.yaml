answer: |-
  Here are ten interview questions designed to probe the technical machinery of interventionist causation, specifically tailored to your dispute with your friend. Each includes a suggested follow-up to help you press the advantage if the guest offers a standard defense.

  ### 1. The Circularity of "Intervention"
  **Question:** A standard charge against interventionism is that it fails as a reductive analysis because the definition of an "intervention" is itself causal. To qualify as an intervention variable $I$ on $X$ with respect to $Y$, $I$ must be uncorrelated with any other cause of $Y$ except those mediated through $X$. But doesn't specifying that exclusion condition require us to already know the causal structure we're trying to discover? If we need a causal graph to define an intervention, haven't we just swapped Lewis's primitive "similarity of worlds" for a primitive "causal intervention"?

  **Suggested Follow-up:** *If she replies that intervention is a "primitive but useful" concept rather than a reductive one:* "But if it's primitive, then interventionism isn't solving the metaphysical problem Lewis was tackling; it's just changing the vocabulary. So when my friend says interventionism 'superseded' Lewis, is he just saying we prefer this primitive to that one, rather than that we've actually explained causation in non-causal terms?"

  ### 2. The Modularity Assumption
  **Question:** Structural equation models rely heavily on the assumption of modularity—that you can intervene on one mechanism without disturbing the others. But in highly integrated systems, like biological homeostasis or quantum entanglement, 'wiggling' one variable often forces a reconfiguration of the entire structural matrix. Does interventionism have the resources to handle non-modular systems, or does it simply define them out of the realm of causal inquiry?

  **Suggested Follow-up:** *If she argues that modularity is a precondition for causation:* "That sounds like Procrustes' bed. If the world doesn't come carved into modular joints, are we saying causation doesn't exist there, or just that our model is too rigid to capture it? Lewis's counterfactuals don't require modularity, only similarity."

  ### 3. Late Preemption and "Default" Values
  **Question:** Let's look at the late preemption case: Suzy and Billy both throw rocks; Suzy's hits first and shatters the bottle, Billy's would have a split second later. Lewis struggled here. Interventionists handle this by assigning 'default' and 'deviant' values to variables in the structural equations. But isn't the choice of which value is 'default' often just as context-sensitive and subjective as Lewis's weighting of similarity spheres? Are we really escaping arbitrariness, or just formalizing it?

  **Suggested Follow-up:** *If she claims the SEM formalism removes the ambiguity:* "The formalism is precise, sure. But the *input* isn't. If I model Billy's throw as the default and Suzy's as deviant, the causal verdict flips. Who decides the defaults? If it's 'our causal intuitions,' haven't we just used the SEM to codify the intuition we were supposed to be explaining?"

  ### 4. Trumping Preemption and Symmetry
  **Question:** Consider Schaffer's trumping preemption: A Major and a Sergeant simultaneously order a soldier to advance. Both orders are individually sufficient. The soldier advances because of the Major's order. In a structural equation model, if both orders are sufficient inputs for the 'Advance' variable, the equations look symmetric. What non-arbitrary resource does interventionism have to break that symmetry? Do we have to add an exogenous 'Authority' variable, and if so, isn't that just stipulating the causal answer in advance?

  **Suggested Follow-up:** *If she says the model must reflect the hierarchy:* "But the hierarchy *is* the causal relation we're trying to find. If the equations can't tell us why the Major trumps the Sergeant without us manually inserting a 'Major Wins' switch, then the SEM isn't doing the causal work; our prior knowledge is. The math is just a display screen."

  ### 5. Unmanipulable Systems and "Hypothetical" Interventions
  **Question:** Woodward allows for "hypothetical" interventions to handle cases where manipulation is physically impossible, like the trajectories of galaxies or the initial conditions of the Big Bang. But if an intervention is physically impossible for any agent, in what sense is it distinct from a Lewisian counterfactual? Isn't 'hypothetical intervention' just 'counterfactual dependence' wearing a lab coat?

  **Suggested Follow-up:** *If she insists on the distinction based on invariance:* "But how do we test for invariance in a system we cannot manipulate, even in principle? If the test for invariance is itself a counterfactual claim ('if we *could* wiggle this, that would happen'), haven't we reduced interventionism to a heuristic for counterfactuals rather than a rival theory?"

  ### 6. Causation by Omission
  **Question:** Interventionism is often praised for handling causation by omission (e.g., the gardener's *not* watering the plants caused them to die). But this seems to overgenerate causes. The Queen of England also didn't water the plants. An interventionist says we rule the Queen out via a 'serious possibility' constraint on interventions. Isn't this 'seriousness' metric just as vague as the similarity metrics Lewis was criticized for?

  **Suggested Follow-up:** *If she argues that context filters the Queen out:* "So causation becomes radically context-sensitive? At dinner, my friend claimed interventionism gave us objective causal structures. If whether the gardener is a cause depends on whether we're having a conversation about royal duties or horticulture, how objective is the structure really?"

  ### 7. Epistemic vs. Ontic Status
  **Question:** There is a tension in the literature about whether interventionism is a theory of what causation *is* (ontology) or how we *learn* about it (epistemology). The 'wiggle' gloss sounds epistemic. But if causation exists in the galaxies where no one can wiggle anything, what makes it causal? Are you defending a metaphysical thesis or a methodology for science?

  **Suggested Follow-up:** *If she says it's both:* "Lewis tried to separate the metaphysics from the epistemology. If interventionism conflates them, doesn't that make it vulnerable to the claim that it's just a theory of experimental design, not a theory of causation? My friend claims it superseded Lewis metaphysically; I'm asking if it actually just changed the subject to methodology."

  ### 8. The "Wiggle" Gloss and Dependence
  **Question:** You mentioned the informal gloss: 'wiggle the cause and see if the effect wiggles.' But in a deterministic system, 'wiggling' $X$ just means considering a state where $X$ is different. That is precisely a counterfactual dependence claim. If the 'wiggle' is cashed out in terms of possible states of the system, what work is the 'intervention' doing that 'counterfactual' wasn't already doing?

  **Suggested Follow-up:** *If she says interventions fix the path of influence:* "Lewis's 'ancestry of dependence' was supposed to do exactly that. If the interventionist story is just a more user-friendly way of drawing the dependency paths, have we gained metaphysical ground, or just better diagramming software?"

  ### 9. Time and Acyclicity
  **Question:** Standard SEMs assume acyclic graphs—no feedback loops where $A$ causes $B$ and $B$ causes $A$. But many physical systems are dynamic and reciprocal. Lewis's counterfactuals handle time via the asymmetry of overdetermination. Does interventionism have to borrow Lewis's account of temporal asymmetry to make sense of the direction of the arrows in the first place?

  **Suggested Follow-up:** *If she says we use dynamic time-slice models:* "But ordering the slices requires a prior notion of time's arrow. If interventionism needs Lewis to tell us which variable is 'earlier' so we know which one to intervene on first, then it's not a rival theory; it's a plugin for Lewis's metaphysics."

  ### 10. The Verdict on Supersession
  **Question:** To close: My friend argues interventionism has superseded Lewis. But if interventionism relies on causal primitives to define interventions, uses default values that rely on intuition, and treats unmanipulable cases as hypothetical counterfactuals, what is the decisive advantage? Is it simply that SEMs are more computationally tractable for social scientists, rather than philosophically superior?

  **Suggested Follow-up:** *If she argues it aligns better with scientific practice:* "Then the victory is pragmatic, not philosophical. I can agree it's a better tool for a dissertation in political science without agreeing it solves the Humean problem of causation. So, should we tell our audience that Lewis lost the metaphysics battle, or just that he lost the grant funding war?"
