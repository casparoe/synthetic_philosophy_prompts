  okay this is probably a dumb question but it's been bugging me - we just covered rigid designators from kripke's naming and necessity in my phil of language class, where a name like 'aristotle' refers to the same guy in every possible world. but doesnt that mean aristotle exists necessarily, in literally every possible world, since thats what it means for the designator to be rigid? and if so, isnt kripke basically smuggling in a mini version of the ontological arguement for every named thing - like just by having a rigid name for something you've already proven it has to exist? something about that feels off to me but i can't find the actual hole in the reasoning, so could you help me sort out where it goes wrong (or tell me if i'm actually onto something)?
