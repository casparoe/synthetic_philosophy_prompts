      *   **Key Distinction:** Reference vs. Existence. A name can pick out the same individual across worlds where that individual exists, but there are worlds where that individual *does not exist*. In those worlds, the name fails to refer (or refers to nothing), but it doesn't refer to someone else.
      *   **Kripke's Stance:** Kripke explicitly rejects the idea that names imply necessary existence. He distinguishes between *necessity of identity* (if $x=y$, then necessarily $x=y$) and *necessary existence* (necessarily, $x$ exists).

