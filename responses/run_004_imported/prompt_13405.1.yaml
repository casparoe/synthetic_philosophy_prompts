          5.  The Dutch Book Status (Pragmatic, not logical).
          6.  Summary.

  8.  *(Self-Correction during drafting)*: Make sure to mention that van Fraassen himself acknowledged Reflection is weaker than Conditionalization. The friend's view is sometimes called the "triviality objection," but it fails because it conflates the *expectation* of future belief with the *value* of future belief conditional on that expectation.

      *   *Equation Check:*
          *   LTP: $P(A) = \sum P(A | C_1=r) P(C_1=r)$.
          *   Reflection: $P(A | C_1=r) = r$.
          *   Friend claims LTP $\to$ Reflection.
          *   Reality: LTP + Reflection $\to$ $P(A) = \sum r P(C_1=r)$.
          *   Friend thinks LTP $\to$ $P(A) = \sum r P(C_1=r)$.
