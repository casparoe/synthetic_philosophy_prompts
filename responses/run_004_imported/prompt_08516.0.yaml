answer: |-
  Good evening. For those of you who don't know me, I'm the sibling who was put in charge of the toast because I'm the family philosopher. Usually, this is the part where I promise not to get too technical, but since the bride and groom literally met arguing about Immanuel Kant's *Groundwork of the Metaphysics of Morals* during their first week of undergrad, I think we're obligated to be precise.

  Their origin story is legendary in this family. They didn't bond over a shared love of movies or music; they bonded over the "Shopkeeper Example." For the two-thirds of the room currently checking their phones: Kant asks whether a shopkeeper who charges children the correct price only because he's afraid of getting a bad reputation deserves any moral credit. Kant says no. He reserves real "moral worth" for the person who does the right thing even when their self-interest suggests otherwise.

  For the grad students in the back: Yes, I know this leads to the notorious conclusion that the naturally warm-hearted person who helps others simply because it makes them happy also lacks moral worth. It is, as the family legend says, bleak.

  But I want to talk about a footnote attached to that argument, because it is actually the most romantic thing I have ever read. Kant distinguishes between "pathological" love and "practical" love. Now, by "pathological," he doesn't mean sick; he means *pathos*—feeling, inclination, the butterflies you get when you first meet someone. You cannot command feelings. You cannot promise to feel excited twenty years from now on a Tuesday night when the sink is leaking and you're both tired.

  But you *can* command the will. That is "practical love." It is love located in action and commitment rather than just emotion.

  This is what a wedding vow is. It is not a promise to feel a certain way forever; it is a promise to act lovingly even when the feeling fluctuates.

  Now, for my friends from the seminar: I am aware of the objections. We spent two weeks discussing Barbara Herman's suggestion that the motive of duty need only be a "standby" motive, present as a limiting condition even if it doesn't drive every Tuesday morning coffee run. We discussed Richard Henson's distinction between a "battle citation" view of moral worth, which requires inner struggle, and a "fitness report" view, which values the reliability of character.

  I bring this up because I want to answer the question the couple argued about on their first date: Is a love that needs duty to hold it together less romantic than one that runs on inclination alone?

  The answer is no. In fact, it is the *only* kind of love a vow was ever asking for.

  Inclination is a gift; commitment is a construction. Anyone can love when it is easy, when the shopkeeper profits from the honesty, when the philanthropist enjoys the helping. But a marriage is a promise that when the inclination fades—as it naturally must, and then returns, in cycles over a lifetime—the practical love remains. The "standby motive" is the safety net that allows the inclination to rest without fear of falling.

  So, [Sister] and [Fiancé], my wish for you is not that you never have to rely on duty. My wish is that your duty becomes so woven into your character that, in Henson's terms, your fitness report is flawless. May your practical love be the structure that keeps your pathological love safe, warm, and free.

  Please raise your glasses. To the shopkeeper who stays honest, to the philanthropist who keeps giving, and to the bride and groom: May your will be as steady as your hearts.

  Cheers.
