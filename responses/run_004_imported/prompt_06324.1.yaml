answer: |-
  Here are ten questions designed to press your guest on the explanatory limits of the hyperbolic discounting model, structured to build an arc from the phenomenology of action to the metaphysics of agency. Each includes a follow-up tailored to block the standard reductionist retreat.

  ### 1. The Davidsonian Synchronic Constraint
  **Question:** "The classical puzzle of *akrasia* relies on a specific timing: the agent acts against a judgment they hold *at the very moment of action*, not just a judgment they held yesterday. If weakness of will is merely a preference reversal driven by hyperbolic discounting, then at the moment of action, the agent must prefer the vice to the virtue. But if they prefer it, in what sense are they acting against their 'better' judgment? Doesn't your model dissolve the conflict by denying that the 'better judgment' actually exists at the critical moment?"

  **Follow-up:** "If you answer that the judgment *does* flip to match the preference, how do you account for the agent's own report that they are doing what they *currently* think is wrong? Are you suggesting the agent is systematically mistaken about their own present evaluative stance?"

  ### 2. The Phenomenology of Struggle
  **Question:** "When people describe episodes of weakness of will, they often describe a felt struggle—a resistance that they ultimately fail to overcome. On a discounting model, this is just one curve outvaluing another. But curves don't fight; agents do. If there is no faculty of will distinct from the preferences themselves, what is doing the struggling? Is the phenomenology of effort simply an illusion generated by the mathematical intersection of two discount functions?"

  **Follow-up:** "If you say it is an illusion, why is this illusion so structurally consistent across human experience? Usually, evolutionary explanations for systematic illusions point to a functional role. What function does the *feeling* of a distinct will serve if the will itself doesn't exist?"

  ### 3. Holton and the Exponential Discounter
  **Question:** "Richard Holton argues that weakness of will is the breaking of a resolution, which is a distinct psychological state from a mere preference. On Holton's view, could a perfectly time-consistent, exponential discounter—who never suffers from preference reversals due to proximity—still be weak-willed? For example, could they break a resolution simply out of spite or carelessness, without any hyperbolic shift?"

  **Follow-up:** "If you say yes, an exponential discounter can be weak-willed, then hyperbolic discounting isn't necessary for weakness of will, and your reductionism loses its core claim. If you say no, aren't you defining weakness of will in a way that excludes clear cases of irrational agency that don't involve time-inconsistency?"

  ### 4. Ainslie's Picoeconomics and the "Self"
  **Question:** "George Ainslie's picoeconomic model describes intrapersonal bargaining between a series of temporally situated selves. This model seems to posit a kind of internal agency—selves making deals, bundling rewards, and enforcing rules. Does this model actually support your claim that weakness of will is 'nothing more' than a discount curve? Or does the language of 'bargaining' and 'selves' smuggle back in the very homuncular agency your reductionism was meant to dissolve?"

  **Follow-up:** "If you insist it's just a metaphor for discounting, who is the arbiter of the bargain? If there is no higher-order self to adjudicate the deal between present-me and future-me, in what sense is a 'deal' struck rather than just a causal outcome occurring?"

  ### 5. Precommitment and Normative Authority
  **Question:** "Consider the Ulysses case: tying oneself to the mast to resist the Sirens. On your view, this is just past-me altering the payoff matrix for future-me. But does this act of binding count as an exercise of will, or is it evidence that will was never the operative notion to begin with? If I need to change the world to control my actions, does that suggest my 'will' is just another causal force I'm trying to manipulate?"

  **Follow-up:** "If you say it's just strategic preference management, does the past self have any *normative* authority over the future self, or only causal power? If it's only causal, why do we feel the future self *ought* to obey the past self's binding, rather than just being causally constrained by it?"

  ### 6. Moral Responsibility and Blame
  **Question:** "We typically reserve blame for weakness of will, but not for having a steep discount curve. We don't blame people for being impulsive in the way we blame them for being weak. If weakness of will reduces to a discount function, does this eliminate the grounds for moral responsibility? Or are you prepared to say we are responsible for the shape of our discount curves?"

  **Follow-up:** "If you say we are responsible for the curve, how do we cash that out without positing a will that can shape the curve? If I can't use my will to change my discounting, in what sense is the discounting 'mine' to be blamed for?"

  ### 7. Training the Will vs. Tuning the Curve
  **Question:** "Many philosophical traditions suggest we can train our will through habituation or practice. In your framework, does 'training the will' just mean conditioning ourselves to have a different discount rate? If so, is there any difference between becoming more virtuous and simply becoming more patient?"

  **Follow-up:** "If there is no difference, how do you explain cases where a patient person is still weak-willed? Someone might calmly and consistently choose a smaller vice over a greater virtue without any impulsive rush. Is that weakness of will on your view, or just a stable preference for the vice?"

  ### 8. The "Nothing Over and Above" Claim
  **Question:** "You argue that once we model the discounting, there is no 'further philosophical explanandum left over.' But doesn't this rely on a very specific notion of explanation? Even if we can predict the behavior via discounting, haven't we left out the *reason-giving* structure of the action? The agent acts *because* they judge it best, not just *when* the curve peaks."

  **Follow-up:** "If you reply that the 'judgment' is just a neural correlate of the curve's peak, do you lose the ability to distinguish between a human acting akratically and a thermostat 'acting' against its programming when the temperature shifts? Where does the rationality enter the picture?"

  ### 9. Regret and Diachronic Identity
  **Question:** "Post-action regret is a hallmark of weakness of will. On a multiple-selves or discounting model, regret is just a different temporal self having different preferences. But for regret to be rational, there must be some continuity of identity between the regretter and the actor. Does your view allow for a robust enough sense of personal identity to make regret intelligible, or is it just one self complaining about another?"

  **Follow-up:** "If it's just one self complaining about another, why should the complaining self's judgment carry any weight? Why privilege the regret over the enjoyment? Your model seems to make all temporal perspectives equal, which makes regret normatively groundless."

  ### 10. The Cost of Dissolution
  **Question:** "Finally, let's look at the theoretical cost. You gain parsimony by eliminating the 'will,' but you lose the ability to distinguish between *changing one's mind* and *losing one's nerve.* Both look like preference reversals in your model. Is the price of this clean reduction too high? Are we sacrificing a distinction that matters deeply to how we live our lives and understand our own agency?"

  **Follow-up:** "If you say the distinction doesn't matter practically, how do you advise someone trying to overcome weakness of will? Do you tell them to 'strengthen their resolve' (which implies a will) or 'recalculate their discounting' (which implies a math problem)? If the advice is the same either way, hasn't the reduction become vacuous?"
