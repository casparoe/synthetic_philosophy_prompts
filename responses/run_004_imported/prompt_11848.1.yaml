  2.  **Deconstruct the Philosophical Concept (WKR Problem):**
      *   *Core Idea:* $X$ is good iff there are reasons to have a pro-attitude toward $X$.
      *   *The Problem:* Some reasons to have a pro-attitude don't make $X$ good.
      *   *Classic Example:* The Evil Demon. He threatens to torture you unless you admire him. You have a reason to admire him (to avoid torture), but he isn't admirable.
      *   *The Distinction:* Object-given reasons (fitting) vs. State-given reasons (pragmatic).
      *   *Key Tension:* "I have a reason to desire this" $\neq$ "This is desirable."

  3.  **Brainstorming Angles:**
      *   *Angle 1: Dating/Relationships.* (Common trope, but maybe too cliché). "I have a reason to date you (you're rich), but you aren't dateable." A bit mean.
      *   *Angle 2: Academic Life.* (Always resonates with grad students). "I have a reason to love this paper (it gets me an A), but it isn't good." A bit self-deprecating.
      *   *Angle 3: Everyday Objects.* (Coffee, money, etc.).
      *   *Angle 4: Reimagining the Evil Demon.* (Directly referencing the classic case).

  4.  **Drafting - Attempt 1 (Dating):**
