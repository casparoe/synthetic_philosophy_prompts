answer: |-
  A grad student asks their advisor, "Be honest: Do you think my dissertation is good, or are you just approving it because I'm the only one who knows how to fix the department's printer?"

  The advisor replies, "Let's be precise. Your technical skills provide a decisive *state-given* reason for me to adopt a pro-attitude toward your work. But they don't make the arguments *fittingly* admirable."

  The student panics. "So I'm not passing?"

  The advisor says, "Oh, you're passing. The reasons are overwhelming. I'm just not writing 'brilliant' on the form. I'm writing 'prudentially mandated.'"

  The student asks, "Will that help me on the job market?"

  The advisor sighs. "Only if the hiring committee is buck-passing."
