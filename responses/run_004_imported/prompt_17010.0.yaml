answer: |-
  There is a critical misconception in your premise that explains most of the puzzle: **The Kalai–Smorodinsky (KS) solution does *not* satisfy all of Nash's axioms.**

  To adopt KS, you must explicitly **drop the Independence of Irrelevant Alternatives (IIA)** axiom. KS replaces IIA with **Monotonicity**.

  This is not a "free upgrade." It is a fundamental trade-off between two different philosophical views on consistency and fairness. In the context of resource scheduling, IIA often provides properties that are more desirable for system stability and computational efficiency than Monotonicity.

  Here is a detailed breakdown of why Nash remains the default in scheduling and systems literature.

  ### 1. The Axiom Trade-off: IIA vs. Monotonicity

  You noted that KS adds Monotonicity. The cost of that addition is the removal of IIA.

  *   **Independence of Irrelevant Alternatives (IIA):** If you remove an outcome from the feasible set that was *not* the chosen solution, the solution should not change.
  *   **Monotonicity:** If the feasible set expands in a way that increases the maximum possible utility for a specific player (the "utopia point"), that player should not end up with less utility in the new agreement.

  **Why dropping IIA matters for schedulers:**
  In a dynamic infrastructure environment, IIA provides **stability**.
  Imagine Tenant A and Tenant B are sharing a cluster. The scheduler computes a Nash allocation. Now, suppose a third resource option becomes unavailable (perhaps a specific GPU type fails), but neither tenant was going to use it in the optimal allocation.
  *   **Under Nash (IIA holds):** The allocation between A and B remains exactly the same. The system is stable.
  *   **Under KS (IIA dropped):** The removal of that unused option changes the shape of the feasible set relative to the "utopia point." This can shift the bargaining line, causing the allocation between A and B to change even though their actual available resources didn't meaningfully change.

  In distributed systems, "flapping" (oscillating allocations) is a major source of instability. IIA helps prevent allocations from shifting due to irrelevant changes in the boundary of the feasible set.

  ### 2. Computational Complexity and Information Requirements

  This is the most practical reason why schedulers prefer Nash.

  **Nash Bargaining Solution (NBS):**
  To find the NBS, you maximize the product of utilities (or sum of log utilities):
  $$ \max \prod_{i} (u_i - d_i) $$
  This is a single convex optimization problem (assuming concave utilities). It requires knowledge of the current feasible set and disagreement points.

  **Kalai–Smorodinsky (KS):**
  To find KS, you must:
  1.  Calculate the **Utopia Point**: For *each* tenant $i$, solve an optimization problem to find their maximum possible utility $u_i^{\max}$ assuming they get everything and others get nothing (or their disagreement point). This requires solving $N$ separate optimization problems.
  2.  Draw a line from the disagreement point to the Utopia Point.
  3.  Find the intersection of that line with the Pareto frontier.

  **The Scheduler Impact:**
  *   **Overhead:** In a system with hundreds of tenants, calculating the Utopia Point requires solving $N$ max-optimization problems *before* you can even solve the allocation problem. NBS requires only one joint optimization.
  *   **Dynamic Environments:** In cloud scheduling, the feasible set changes constantly (jobs finish, new nodes come online). Maintaining accurate Utopia points in real-time is computationally expensive. NBS is more robust because it relies on local gradients (marginal utilities) rather than global bounds.

  ### 3. Connection to Proportional Fairness

  In networking and systems literature (e.g., TCP congestion control, cloud schedulers like Dominant Resource Fairness variants), the gold standard is **Proportional Fairness (PF)**.

  Frank Kelly proved that a Proportionally Fair allocation is mathematically equivalent to the **Nash Bargaining Solution** (specifically, maximizing the sum of log utilities).

  $$ \text{PF} \iff \max \sum \log(u_i) $$

  PF is preferred in systems because it strikes a specific balance between **efficiency** (total throughput) and **fairness**.
  *   **Nash/PF:** Favors overall system efficiency. It will give more resources to a tenant if they can utilize them more efficiently, provided it doesn't starve others.
  *   **KS:** Leans closer to **Max-Min Fairness**. It is more egalitarian. It focuses on the ratio of the gain relative to the maximum possible gain.

  If your scheduler's goal is to maximize cluster utilization while preventing starvation, Nash/PF is theoretically superior. If your goal is strict equity regardless of efficiency, KS (or Max-Min) is better. Most infrastructure providers prioritize utilization, hence the default to Nash.

  ### 4. Strategic Manipulation and "Dummy" Tenants

  Because KS relies on the Utopia Point (the maximum possible utility a tenant *could* get), it is vulnerable to specific types of strategic behavior that Nash is not.

  If a tenant can artificially inflate their "maximum possible utility" (perhaps by claiming they have a workload that can consume infinite resources, even if they can't actually run it), they pull the Utopia point outward. Since KS draws a line to that point, inflating the Utopia point can skew the allocation in their favor.

  Nash bargaining depends on the *marginal* trade-offs at the solution point, not the absolute bounds of the feasible set. This makes it harder to game by simply claiming you *could* use more resources than you actually can.

  ### 5. Path Dependence and Tractability

  Finally, there is a historical and mathematical momentum.
  *   **Nash (1950):** The solution is differentiable and fits neatly into standard convex optimization frameworks (Lagrangians, KKT conditions).
  *   **KS (1975):** The solution involves finding an intersection with a frontier. If the Pareto frontier is not strictly convex or is defined by discrete constraints (common in scheduling, e.g., bin packing), finding the exact KS intersection can be numerically unstable or NP-hard, whereas the Nash product can often be relaxed to a tractable convex problem.

  ### Summary

  KS is not a strict upgrade; it is a different point in the design space.

  | Feature | Nash Bargaining (NBS) | Kalai–Smorodinsky (KS) |
  | :--- | :--- | :--- |
  | **Key Axiom** | Independence of Irrelevant Alternatives (IIA) | Monotonicity |
  | **Stability** | High (removing unused options doesn't change outcome) | Lower (bounds changes affect outcome) |
  | **Computation** | Single joint optimization | $N$ max-optimizations + intersection |
  | **Philosophy** | Proportional Fairness (Efficiency + Fairness) | Egalitarian (Fairness relative to potential) |
  | **Gaming** | Harder to game via bound inflation | Vulnerable to Utopia point inflation |

  **Recommendation for your Scheduler:**
  If your tenants are sensitive to allocation oscillation (e.g., they resize containers based on grants) and you care about total cluster throughput, **stick with Nash (Proportional Fairness).** The computational savings and stability benefits of IIA usually outweigh the theoretical fairness benefits of Monotonicity in infrastructure contexts.

  If you are building a system where strict equity is the only metric (e.g., splitting a fixed budget among departments where efficiency doesn't matter), KS is worth the extra computational cost.
