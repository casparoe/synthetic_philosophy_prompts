      *   **The Plot Twist (Ergodicity):** This is crucial. Ole Peters' argument. Ensemble vs. Time average. This removes the "subjective utility" defense for EV in repeated games. It makes Kelly an objective property of the system, not just a preference.
      *   **The Deep Cut (Geometric Rationality):** Briefly touch on Garrabrant. It's about coherence in beliefs and actions, treating wealth like a probability.
      *   **The Verdict (Settling the Score):** This needs to be direct.
          *   Samuelson is theoretically right (utility is subjective).
          *   Kelly/Peters is *practically* right for repeated betting.
          *   The Condition: **Repeatability and Path Dependence.**
      *   **Actionable Advice:** Don't bet full Kelly. Use Half-Kelly. Don't treat prediction markets like index funds.

  5.  **Refining the Content (Self-Correction during drafting):**
