  **Move 1 (Mara): +1**
  Mara accurately states the core epistemicist thesis: bivalence holds, so a cutoff exists, and our ignorance is semantic/epistemic rather than ontological. She preemptively defends against the "mysticism" charge by framing it as standard fallibility. It's a solid, clear articulation of the Williamsonian position, though it asserts the conclusion rather than arguing for it yet.

  **Move 2 (Josh): +1**
  Josh correctly identifies the primary intuition pump against epistemicism: the "arbitrariness" objection. If meaning is grounded in use (a widely held assumption), and use doesn't distinguish *n* from *n+1*, positing a fact there seems metaphysically idle. He lands a solid hit on the plausibility of Mara's view, even if he doesn't refute its logical consistency.

  **Move 3 (Mara): +2**
  This is Mara's strongest move. She deploys Williamson's "sharp boundaries of admissible precisifications" objection. Supervaluationism defines truth via a set of "admissible precisifications," but the boundary between *admissible* and *inadmissible* precisifications must itself be sharp for the logic to work. Mara correctly points out that Josh hasn't eliminated sharp cutoffs; he's just pushed them up a level to the meta-language. This is a technical knockout in this specific exchange.

  **Move 4 (Josh): 0**
  Josh attempts a strategic retreat by distinguishing between a "hidden fact" and an "open regress." While philosophically interesting (preferring structural indeterminacy over brute determinacy), it's dialectically weak here. Standard supervaluationism requires a determinate set of precisifications to preserve classical logic; claiming "vagueness all the way up" often collapses into degree theory or intuitionism, undermining the supervaluationist framework he's defending. He survives, but doesn't counter-attack effectively.

  **Where They Talk Past Each Other**
  The core friction in Move 1 and Move 2 is **meta-semantic**. Mara is operating with an externalist or causal theory of reference (reference can outrun our epistemic access/use), whereas Josh is committed to a use-theory of meaning (meaning *just is* patterns of disposition). When Mara says "language is fallible," she means our *knowledge* of the meaning is limited. When Josh says "meaning doesn't float free of use," he means there *is no meaning* beyond the use. They aren't just disagreeing on vagueness; they are disagreeing on what determines semantic content.

  **What Both Are Missing**
  1.  **Contextualism:** Neither considers that the cutoff for "heap" might shift depending on conversational context (e.g., a strict context vs. a lax context), which dissolves the Sorites by denying the major premise holds across all contexts.
  2.  **Degree Theory (Fuzzy Logic):** They assume a binary fight between "sharp cutoff" (Epistemicism) and "truth-value gaps" (Supervaluationism). Neither mentions the option that truth comes in degrees (0 to 1), which avoids sharp boundaries entirely.
  3.  **Pragmatics:** They treat the Sorites as a semantic paradox about truth conditions. They ignore pragmatic approaches (e.g., Sorensen, Raffman) which suggest the paradox arises from norms of assertion or psychological processing limits, not the truth conditions of "heap" itself.
