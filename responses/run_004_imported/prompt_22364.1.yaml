answer: |-
  This is one of the most famous and difficult passages in Nietzsche, so first off: **you are not missing something obvious.** This is where Nietzsche shifts from doing cultural criticism (lambs vs. birds) to doing deep metaphysics and linguistics (grammar and ontology).

  It is **not** a random digression. In fact, it is the philosophical engine that makes the lamb/bird metaphor work. If you don't understand this paragraph, you can't fully understand why Nietzsche thinks "Slave Morality" is a lie.

  Here is the breakdown of what he is arguing, how the lightning metaphor works, and how to use this in your response paper.

  ### 1. The Core Argument: There is no "Doer" behind the "Deed"
  Nietzsche is attacking a fundamental assumption of Western morality and religion. That assumption is: **Actions are performed by a separate "Self."**

  *   **Common View:** I (the subject/self) exist first. Then, I choose to perform an action (the verb). Therefore, I am responsible for the action.
  *   **Nietzsche's View:** This is a trick of grammar. In language, we have Subjects (I, You, The Bird) and Verbs (eat, fly, kill). This structure makes us think there must be a "Thing" (the Subject) that exists *before* and *separate from* the "Action" (the Verb).

  Nietzsche argues this is false. There is no "I" behind the action. The "I" is just the sum of the actions.

  ### 2. The Lightning Metaphor
  This is the key to unlocking the paragraph.
  *   **Popular View:** There is a thing called "Lightning." That thing decides to flash. So, "Lightning" is the subject, and "Flashing" is what it does.
  *   **Nietzsche's View:** That is nonsense. There is no "lightning" separate from the flash. **The lightning *is* the flash.** You cannot separate the noun from the verb.

  **How this applies to the Birds and Lambs:**
  *   **Slave Morality (The Lambs) says:** There is a "Bird of Prey." This bird *has* strength. But it *chooses* to use that strength to eat lambs. Therefore, the bird is **evil** because it could have chosen to be kind (like a lamb).
  *   **Nietzsche says:** No. That is a grammatical error. There is no "Bird" separate from its "Preying." **Strength *is* the act of overpowering.** To ask a bird of prey not to prey is to ask the lightning not to flash. It is asking the thing to *not be itself*.

  ### 3. Why This Matters for Master/Slave Morality
  This is the part you need for your paper. Nietzsche isn't just saying "birds eat lambs, deal with it." He is dismantling the concept of **Moral Responsibility** as the lambs understand it.

  For the lambs to call the birds "evil," they have to believe the birds had a choice. They have to believe there is a "neutral substratum" (a neutral core self) inside the bird that could have decided, "Hmm, today I won't eat the lamb."

  Nietzsche argues this "neutral self" is a fiction created by language.
  *   **The Strong:** Their nature *is* to discharge strength. They don't "choose" to be strong; their existence is the expression of strength.
  *   **The Weak:** Their nature *is* to be cautious, herd-like, and reactive.

  When Slave Morality judges the Strong as "evil," it is judging a fish for swimming or fire for burning. It relies on the false belief that actions can be separated from the nature of the actor.

  ### 4. How to Frame This in Your Response Paper
  Since you have a response paper due, you don't want to just summarize this. You want to analyze *why* Nietzsche makes this move. Here are three angles you could take:

  **Angle A: The Linguistic Trap**
  Argue that Nietzsche believes morality is corrupted by grammar. We speak in Subject-Verb sentences, so we assume the universe works in Subject-Verb causality. Nietzsche is trying to show that "Slave Morality" is essentially a grammatical error projected onto nature. The lambs hate the birds because language tells them the birds *chose* to be predators.

  **Angle B: The Definition of "Freedom"**
  The lambs think freedom means "the ability to choose not to be what you are." Nietzsche argues true freedom (for the masters) is "the inability to be other than what you are." The bird is most itself when it preys. By calling this "evil," the lambs are pathologizing health and strength.

  **Angle C: The "Substratum" as a Religious Invention**
  Nietzsche mentions the "indifferent neutral substratum." This is a dig at Christianity and Kantian philosophy. They all believe in a "Soul" or a "Rational Self" that sits behind our impulses and controls them. Nietzsche is saying: **There is no soul.** There is only the will to power expressing itself. If there is no soul, there is no "sin," only nature.

  ### A Note on the Translation
  You mentioned you have an old 1900s translation. The phrase *"The 'doer' is a mere appanage to the action"* is a bit clunky.
  *   **Appanage** means an addition or something attached to a main thing.
  *   Better modern translations (like Walter Kaufmann) often render this as: **"The doer is merely a fiction added to the deed—the deed is everything."**
  *   Keep this in mind: Nietzsche is saying the "Doer" is a fake story we tell ourselves to explain the "Deed."

  ### Summary for your notes:
  1.  **Lambs/Birds:** Represents Weak/Strong moralities.
  2.  **Lightning/Grammar:** Explains *why* the Lambs misunderstand the Birds.
  3.  **The Error:** Lambs think the Bird *has* strength and *chooses* to use it (making them responsible/evil).
  4.  **The Truth:** The Bird *is* its strength. The action is identical to the actor.
  5.  **Conclusion:** Slave morality is based on a false understanding of human nature and language.

  If you write your paper focusing on how Nietzsche uses **linguistics to undermine moral judgment**, you will hit the core of what he is doing in Section 13. Good luck!
