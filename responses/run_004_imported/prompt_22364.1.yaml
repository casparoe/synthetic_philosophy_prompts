      *   *Part 5: Lightning Metaphor.* We separate lightning from the flash. We think "lightning" causes the "flash." Nietzsche says: No, the lightning *is* the flash.
      *   *Part 6: Application to Morality.* Popular morality separates the "strong man" from his "strength." It imagines a neutral "self" that *chooses* whether to be strong or kind. Nietzsche says: No, the strong man *is* his actions. There is no neutral substrate.

  3.  **Identify the Core Connection (The "Why"):**
      *   Why does Nietzsche talk about grammar in a text about morality?
      *   *Answer:* Because the concept of "moral responsibility" (specifically the slave morality's condemnation of the strong) *depends* on the grammatical error.
      *   The lambs say the birds *choose* to be evil. They imagine the bird could have chosen to be a vegetarian.
