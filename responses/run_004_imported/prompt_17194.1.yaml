          *   *Follow-up:* Ask for a falsifiable condition.

      *   *Requirement: Generalizability (DID, etc.).*
          *   *Draft:* Does this apply to DID or hypnosis?
          *   *Refinement:* Callosotomy is physical. DID is psychological. If physical severing creates two subjects, why doesn't psychological dissociation? Or does it?
          *   *Follow-up:* If she says yes to DID, that's controversial. If no, what's the magic of the corpus callosum?

      *   *Filling the remaining slots (aiming for 8-10 total):*
