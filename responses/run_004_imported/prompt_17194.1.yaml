      *   **Guest:** Philosopher defending the "two subjects" view of split-brain patients (corpus callosotomy).
      *   **Goal:** Avoid the standard 1970s Sperry/Gazzaniga "left hand points, right mouth speaks" greatest hits. Go deep.
      *   **Specific Requirements:**
          1.  8-10 interview questions.
          2.  Each needs a sharp follow-up based on the *likely* answer.
          3.  Must include the Pinto et al. (Brain) study challenge (integration across visual fields).
          4.  Must address the "phenomenological silence" (why doesn't the speaking subject notice the gap?).
          5.  Must define "two subjects" vs. "two streams in one subject" (metaphysical/empirical cash value).
          6.  Must address generalizability (DID, hypnosis, etc.) vs. specificity of callosotomy.
          7.  Tone: "Hard version," not pop-sci.

  2.  **Deconstruct the Guest's Position:**
      *   The guest believes split-brain patients = two distinct conscious beings.
      *   *Common Counter-arguments:* Unified behavior in daily life, Pinto's findings on cross-field integration, the lack of subjective complaint from the speaking hemisphere.
      *   *Philosophical Stakes:* What constitutes a "subject of experience"? Is it functional integration or something deeper?

  3.  **Drafting Questions (Iterative Process):**

      *   *Requirement: Pinto Study.*
