          *   *Follow-up:* If she says "subcortical pathways," ask why those pathways don't count for consciousness unification.

      *   *Requirement: Phenomenological Silence.*
          *   *Draft:* Why don't they notice they are missing half their vision?
          *   *Refinement:* The speaking hemisphere confabulates seamlessly. If it's a distinct subject, shouldn't it experience a *loss*? Or does it just not know what it doesn't know?
