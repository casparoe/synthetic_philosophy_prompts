answer: |-
  A Bayesian Decision Theorist and a Game Theorist are playing heads-up poker.

  Every hand, the Bayesian pays to see an extra card before betting, muttering to himself, "Cost-free evidence, positive expected value, I. J. Good..."

  After losing his entire stack, he finally protests, "But the theorem guarantees I can't be worse off in expectation for looking first!"

  The Game Theorist stacks the chips and says, "Good's Theorem proves you can't lose against **Nature**. It doesn't cover opponents who raise the ante while you're busy updating your priors."

  ***

  **Liner Notes (for the teller):**
  The joke lands for the stats crowd because it highlights the specific boundary condition where Good's Theorem breaks: the transition from **Decision Theory** (optimizing against a passive, stochastic environment) to **Game Theory** (optimizing against an adaptive agent). For the laypeople, it just sounds like a nerd getting outsmarted at cards.
