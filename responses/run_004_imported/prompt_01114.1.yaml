      *   *Tool 2: Negotiation Types.* Distributive (Zero-Sum) vs. Integrative (Win-Win). Priya is treating it as Distributive. It *must* be Integrative to sustain the relationship.
      *   *Tool 3: The "Shadow of the Future".* In one-off deals, you can screw the other person. In long-term relationships, today's "win" is tomorrow's resentment.
      *   *Tool 4: BATNA/WATNA.* Best/Worst Alternative to a Negotiated Agreement. What happens if the "trick" works? What happens if it fails?

