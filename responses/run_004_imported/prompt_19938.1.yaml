  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Retroactive Punishment.*
          *   *Draft:* Why punish if you exist?
          *   *Refinement:* Focus on resource allocation and precommitment. If the AI is already here, punishing simulations is costly and yields no causal benefit.
          *   *Follow-up:* If he says "precommitment," ask about the stability of that precommitment against self-modification.

      *   *Requirement 2: TDT/UDT Blackmail Immunity.*
