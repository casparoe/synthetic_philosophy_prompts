answer: |-
  **Title:** The Cost of Coherence: Reassessing the Money-Pump Argument for Transitivity

  **Introduction**

  The normative architecture of Expected Utility Theory (EUT) rests upon the axiom of transitivity. If an agent prefers $A$ to $B$ and $B$ to $C$, they must prefer $A$ to $C$. While this condition is mathematically necessary for the representation of preferences by a utility function, its normative force is often defended pragmatically via the money-pump argument. The standard intuition is that an agent with cyclic preferences ($A \succ B \succ C \succ A$) is vulnerable to a sequence of trades that leaves them strictly poorer with no compensating gain in utility. Such an outcome is paradigmatically irrational.

  However, this justification faces a formidable objection from the literature on dynamic choice. As Edward McClennen and others have observed, an agent who is *sophisticated* (foreseeing future choices) or *resolute* (committing to a plan despite local preferences) can navigate a money-pump scenario without suffering any financial loss. If an agent can hold cyclic preferences yet avoid the exploitative outcome through strategic choice dispositions, does the money-pump argument fail to establish transitivity as a synchronic constraint on preferences? Or does the very necessity of sophistication or resoluteness reveal a deeper defect in the preference structure itself?

  This essay argues that the existence of sophisticated and resolute escape routes does not vindicate cyclic preferences. Rather, it confirms that transitivity is a requirement of *transparent rational agency*. The ability to avoid a money pump via sophistication or resoluteness comes at the cost of fragmenting the agent's evaluative standpoint from their actionable choices. Therefore, the money-pump argument successfully establishes transitivity as a synchronic norm: cyclic preferences are irrational not merely because they *can* lead to loss, but because they render the agent incapable of acting directly on their evaluations without self-imposed constraints that admit those evaluations are defective.

  **The Loophole: Sophistication and Resoluteness**

  To understand the force of the objection, we must formalize the escape. Consider an agent with strict cyclic preferences over three positions: $A \succ B$, $B \succ C$, and $C \succ A$. In a standard money pump, the agent starts at $A$, pays a small sum $\epsilon$ to trade for $B$, pays $\epsilon$ to trade for $C$, and pays $\epsilon$ to trade back to $A$. They end at $A$ with $3\epsilon$ less wealth.

  The *sophisticated* chooser applies backward induction. Knowing that possessing $C$ will lead to a trade for $A$ (costing $\epsilon$), and possessing $B$ will lead to a trade for $C$ (costing $\epsilon$), the agent anticipates that accepting the first trade (from $A$ to $B$) initiates a loss-making sequence. Consequently, the sophisticated agent refuses the initial trade. They remain at $A$, lose no money, and retain their cyclic preferences.

  The *resolute* chooser, in McClennen's sense, operates differently. They select a optimal plan at the initial node (e.g., "Stay at $A$") and bind themselves to it. When later offered the trade from $A$ to $B$, their local preference dictates $B \succ A$, but their resolute disposition overrides this local preference in service of the global plan. Again, no money changes hands.

  The diachronic interpretation of these cases suggests that rationality is fundamentally about the management of choices over time, not the static consistency of preferences. If the outcome is Pareto-efficient (no money lost), the agent has satisfied the pragmatic demand of rationality. On this view, transitivity is at best a heuristic for naive agents who lack the cognitive capacity for sophistication or the willpower for resoluteness. It is not a fundamental law of rational preference.

  **The Diachronic Defense and Its Limits**

  Proponents of the diachronic reading argue that preferences are merely inputs into a decision function. If the function (sophistication/resoluteness) processes the inputs to yield a non-dominated outcome, the inputs themselves cannot be condemned solely on the basis of the pump. To claim otherwise is to confuse the map with the territory; the money pump demonstrates a vulnerability in *choice behavior*, not necessarily in *evaluative states*.

  This position gains traction when we consider that sophistication and resoluteness are cognitively possible. If a human being can genuinely maintain cyclic preferences while employing a meta-cognitive strategy to avoid loss, then the "irrationality" of the cycle seems to vanish. The loss was never in the preferences; it was in the naivety of the execution.

  However, this defense relies on a consequentialist narrowing of rationality. It assumes that the only metric of rational defect is net wealth loss. This ignores the internal architecture of agency. Rationality is not merely about securing good outcomes; it is about the relationship between an agent's evaluations and their actions. A rational agent's actions should be transparent expressions of their evaluative judgments. When an agent must employ sophistication or resoluteness to avoid a pump, they are acknowledging that their local evaluative judgments cannot be trusted to guide action.

  **The Synchronic Rebuttal: The Cost of Fragmented Agency**

  The money-pump argument can be rescued from the diachronic objection by shifting the focus from monetary loss to the *cost of agency*. The necessity of sophistication or resoluteness imposes a normative burden that vindicates the claim that cyclic preferences are synchronically irrational.

  First, consider sophistication. For the sophisticated agent to refuse the trade from $A$ to $B$, they must act against their current preference ($B \succ A$) based on a prediction of future irrationality. They effectively treat their future self as an adversary or a malfunctioning machine. This introduces a fragmentation of agency. The agent at $t_1$ cannot cooperate with the agent at $t_2$ because the agent at $t_2$ holds preferences that would squander resources. This intra-personal conflict is a hallmark of irrationality. A fully rational agent should be able to trust their future self to act on shared evaluative standards. The need for sophistication reveals that the preference ordering fails to provide a stable guide for action across time.

  Second, consider resoluteness. McClennen argues resoluteness allows the agent to act on a plan despite a shift in local preference. However, this requires the agent to disregard their all-things-considered judgment at the moment of choice. If, at the moment of choice, the agent judges $B$ to be better than $A$ (all things considered, including the plan), then choosing $A$ is irrational. If they judge $A$ to be better than $B$ (because of the plan), then their preference ordering has effectively changed to $A \succ B$, rendering the preferences transitive at the moment of action. Resoluteness, therefore, is either an act of irrationality (ignoring current judgment) or a mechanism that forcibly imposes transitivity on the choice, thereby admitting that the underlying cyclic preferences are unfit for direct guidance.

  Here, Warren Quinn's "Self-Torturer" puzzle provides critical support for the synchronic reading. Quinn describes an agent who faces a series of settings on a device, where each increment $n$ to $n+1$ yields a financial gain and an imperceptible increase in pain. Locally, the agent prefers $n+1$ to $n$. However, at setting $1000$, the pain is excruciating, and the agent prefers setting $0$ to $1000$. This creates a global intransitivity.

  A sophisticated self-torturer will stop at some setting $k$ before the pain becomes unbearable. They avoid the "pump" of unbearable pain. However, Quinn argues that the agent remains in a rational dilemma. At any stopping point $k$, the agent knows that moving to $k+1$ would be locally preferable and the pain difference is imperceptible. Yet, they know that continuing leads to disaster. The sophisticated avoidance of the worst outcome does not sanitize the preference structure; it merely manages a pathology. The preferences themselves generate a conflict between local rationality and global welfare that a coherent preference ordering should not produce. The fact that the agent *must* calculate a stopping point, rather than simply following their preferences, indicates that the preferences fail to constitute a coherent evaluative scale.

  **The Verdict: Transitivity as a Condition of Transparent Agency**

  We must therefore reject the diachronic reading that limits the money-pump argument to a warning against naivety. The money-pump argument establishes that cyclic preferences are synchronically irrational because they violate the requirement that preferences be *action-guiding without remainder*.

  A rational preference ordering is one that allows an agent to move through a choice space without requiring meta-cognitive overrides or self-binding strategies. When an agent holds cyclic preferences, they cannot simply "follow their preferences." If they do, they are pumped. To avoid being pumped, they must follow a *rule* that contradicts their preferences (resoluteness) or anticipates their own failure (sophistication). In both cases, the preferences cease to be the sovereign directors of choice.

  This imposes a cost that is distinct from the monetary loss of the pump. It is the cost of *opacity*. In a transitive agent, the path from evaluation to action is direct. In a cyclic agent employing sophistication or resoluteness, the path is mediated by a second-order strategy that acknowledges the first-order preferences are defective. The money pump demonstrates that cyclic preferences make an agent *vulnerable*. The diachronic objection shows that this vulnerability can be mitigated. But the mitigation itself is the proof of the defect. Just as a person who must wear a brace to walk has a defect in their legs even if they do not fall, an agent who must employ resoluteness to avoid a money pump has a defect in their preferences even if they do not lose money.

  Consequently, the money-pump argument succeeds in vindicating transitivity as a synchronic norm. It shows that cyclic preferences are incompatible with the ideal of a unified agent whose actions are transparent expressions of their evaluations. Sophistication and resoluteness are not counter-examples to the money-pump argument; they are admissions of guilt. They are the costly prosthetics an agent must adopt to function despite holding irrational preferences. Therefore, for the purpose of normative decision theory, transitivity must be maintained not merely to prevent financial loss, but to preserve the coherence of the agency itself. The rational agent is not simply one who avoids loss, but one whose evaluative structure permits them to do so without fighting against themselves.
