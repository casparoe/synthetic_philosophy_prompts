answer: |-
  Here is the strongest possible argument for the claim that Bentham's dismissal of "antipathy pain" in his essay on paederasty constitutes a fundamental inconsistency within his own hedonistic system, representing a departure from strict utilitarianism rather than an application of it.

  ### The Ontological Contradiction: The Neutrality of Sensation

  The foundational axiom of Bentham's utilitarianism is that nature has placed mankind under the governance of two sovereign masters: **pain and pleasure**. In *An Introduction to the Principles of Morals and Legislation*, Bentham is explicit that the utility principle is descriptive before it is prescriptive; it recognizes that humans *do* seek pleasure and avoid pain, and therefore *ought* to maximize the former and minimize the latter. Crucially, Bentham insists on the **neutrality of origins**. His famous assertion that "push-pin is of equal value with the arts and sciences" establishes that the *source* of a pleasure is irrelevant to its moral weight; only its quantity (measured by intensity, duration, certainty, etc.) matters.

  The inconsistency arises when Bentham applies this calculus to the pain of antipathy (disgust/outrage) regarding homosexual acts. By arguing that this pain is "groundless" or based on "prejudice" and therefore should not count toward the legislative calculus, Bentham violates the ontological status of pain within his own system.

  If pain is the sovereign master, then **felt pain is real pain**, regardless of the epistemic status of the belief that triggered it. Whether a person feels pain because they have been physically struck, or because they believe (falsely, in Bentham's view) that a moral transgression has occurred elsewhere, the phenomenological event is identical: a negative sensation exists in the conscious experience of the subject. To discount the pain of antipathy because it stems from a "false" belief is to introduce an **epistemic criterion** (truth/falsity) into an **ontological system** (sensation/feeling).

  Strict hedonism cannot distinguish between "rational pain" and "irrational pain." It can only distinguish between "more pain" and "less pain." By filtering which pains count based on their intellectual justification, Bentham ceases to be a hedonist and becomes a rationalist moralist. He is no longer calculating utility; he is judging the *worthiness* of the sufferers. This directly contradicts the democratic neutrality of the calculus, where every person counts for one and no one for more than one. In the paederasty essay, Bentham effectively counts the pain of the homosexual actor as "1," but the pain of the disgusted observer as "0," solely because he deems the observer's worldview incorrect. This is an arbitrary valuation external to the utility principle.

  ### The "Prejudice Apart" Smuggle

  Bentham attempts to shield this move with the phrase "prejudice apart." He suggests that we must calculate utility *after* stripping away prejudicial feelings. However, this is a logical sleight of hand that empties the calculus of its content.

  The utility principle is supposed to be the *tool* by which we identify prejudice. We are supposed to weigh the pain of the minority against the pain of the majority to see if the majority's antipathy constitutes a "tyranny." But by commanding us to set aside antipathy *before* the calculation begins, Bentham is assuming the conclusion he claims to be proving. He is asserting that the pain of antipathy is illegitimate *by fiat*, not by calculation.

  If the goal of utilitarianism is the maximization of happiness (the net sum of pleasure over pain), then ignoring a widespread source of unhappiness—even if that unhappiness is based on superstition—necessarily leads to a sub-optimal outcome. If 1,000 people feel genuine anguish over an act performed by 2 people, a strict utilitarian calculus must acknowledge that anguish as a negative utility. To alleviate that anguish by prohibiting the act might result in a net loss of utility, but to *ignore* the anguish entirely is to falsify the data set.

  By excluding antipathy, Bentham is not applying the harm principle; he is smuggling in a **natural rights** argument. He is effectively claiming that the actor has a *right* to engage in the act that trumps the observer's utility, regardless of the observer's pain levels. Bentham famously dismissed natural rights as "nonsense upon stilts," yet here he relies on a deontological constraint (the actor's liberty is inviolable) to override the consequentialist sum. He protects the actor not because the calculus demands it (since the calculus, properly run, would have to weigh the intense, widespread disgust of the public), but because he believes the public *should not* feel that disgust. This is moralizing, not utilitarianism.

  ### The Problem of Fecundity and Purity as Post-Hoc Rationalizations

  A defender of Bentham might argue that he excludes antipathy pain based on the dimensions of **fecundity** and **purity**. He might claim that indulging antipathy leads to more pain in the long run (persecution, black markets, anxiety), whereas indulging the sexual act is pure pleasure.

  However, this defense fails when scrutinized against the specific text of the paederasty essay. Bentham does not merely argue that criminalization causes *more* pain than the antipathy itself; he argues that the antipathy pain is *inherently* suspect. He treats the pain of the moralist as a "false" pain.

  If Bentham's argument were strictly consequentialist, he would concede that the disgust is real pain but argue that satisfying it is too costly (e.g., it requires invasive policing). But his rhetoric suggests the pain itself is disqualified because it is rooted in error. This creates a dangerous precedent within the system: **Who defines the error?**

  If the legislator can discount pain because it is based on "religious superstition," can they also discount pain based on "economic ignorance" or "political naivety"? If a worker feels pain at the loss of their job due to free trade policies, can the utilitarian legislator dismiss that pain as "economically illiterate"? Once the principle is established that pain derived from "false" beliefs does not count, the hedonic calculus loses its objective grounding. It becomes a tool for the enlightened elite to impose their view of "true" happiness upon the masses, disregarding the actual felt experiences of the population. This destroys the empirical basis of utilitarianism, which relies on aggregating actual desires and aversions, not idealized ones.

  ### The Self-Defeating Nature of the Exclusion

  Finally, the exclusion of antipathy pain renders the utilitarian system self-defeating in its own terms. The promise of utilitarianism is that it offers a neutral, scientific method for resolving moral disputes without recourse to dogma. By declaring that the intense, felt suffering of the majority (the "disgust") is morally irrelevant because it is "prejudiced," Bentham abandons neutrality.

  If the goal is social stability and the maximization of aggregate welfare, ignoring a potent source of social friction (public outrage) is strategically unsound. A strict utilitarian would have to acknowledge that if the public's disgust is intense enough, it constitutes a genuine harm that must be managed, perhaps through education rather than criminalization. But to say the pain *does not count* is to deny the reality of the social fabric.

  In sum, Bentham's move in the paederasty essay is a **category error**. He treats a psychological fact (the sensation of disgust) as a logical proposition (which can be true or false). Pain cannot be false; it can only be felt. By attempting to falsify pain, Bentham steps outside the boundaries of his own hedonistic axioms. He achieves a morally progressive result (decriminalization), but he does so by violating the very mechanism (the neutral aggregation of all pains and pleasures) that gives his system its claim to scientific objectivity. He saves the minority from the majority not by out-calculating them, but by disqualifying their vote from the tally. This is not utilitarianism; it is liberalism wearing utilitarian clothing.
