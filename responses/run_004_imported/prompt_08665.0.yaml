      *   *Point 4: The Definition of Harm.* If the Harm Principle (later Mill, but rooted here) relies on utility, and utility includes all pain, then "offense" *is* harm. To say it isn't requires an external standard.
      *   *Point 5: Self-Defeating.* If the goal is maximizing happiness, ignoring a widespread source of unhappiness (even if irrational) leads to *less* total happiness. Punishing the act reduces the actor's pleasure but also alleviates the observer's pain. Ignoring the observer's pain might result in a net loss if the observer's pain is intense and widespread.

