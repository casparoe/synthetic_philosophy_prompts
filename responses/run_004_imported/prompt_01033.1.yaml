      *   *Conclusion:* Aristotle's argument hits "vicious circularity" hard. It does *not* effectively refute modern coherentism, which explicitly rejects the linear premise-ordering Aristotle assumes. However, the "triviality" charge still nags at coherentists (the isolation objection).

