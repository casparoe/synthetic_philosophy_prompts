    "required_principles": {"score": 0, "max": 4, "comment": ""},
    "derivation": {"score": 0, "max": 8, "comment": ""},
    "philosophical_upshot": {"score": 0, "max": 4, "comment": ""},
    "total": 0,
    "letter_grade": ""
  }
  ```
