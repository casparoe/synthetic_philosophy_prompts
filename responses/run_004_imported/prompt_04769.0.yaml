answer: |-
  You have put your finger on the exact friction point between the empirical psychology of choice and the philosophy of action. Your intuition is correct: Ainslie's hyperbolic discounting model does not explain Davidsonian *akrasia*; it explains a different phenomenon (preference reversal) that is often *called* weakness of will in everyday speech, but which dissolves the specific logical puzzle Davidson was trying to solve.

  Here is the breakdown of why these two accounts are talking past each other, and how you might frame this for your reading group.

  ### 1. Davidson's Puzzle: Synchronic Inconsistency
  To see why Ainslie doesn't fit, we must look at the specific constraints Davidson places on the akratic agent in *"How is Weakness of the Will Possible?"* (1980).

  Davidson is not interested in why people change their minds over time. He is interested in a specific moment, $t$. He posits three conditions that seem logically incompatible but nonetheless occur:
  1.  The agent judges that, **all things considered (ATC)**, doing $X$ is better than doing $Y$ at time $t$.
  2.  The agent intends to do $X$ at time $t$.
  3.  The agent intentionally does $Y$ at time $t$.

  For Davidson, the "all-things-considered" judgment is the kicker. It is not a prediction of future utility; it is a normative verdict issued *at the moment of action*. If I eat the cake while judging ATC that I ought not to, I am violating the **Principle of Continence**.

  Davidson's solution is that the agent acts on a *conditional* judgment ("Eating cake is good *qua* pleasant") rather than the *unconditional* ATC judgment. Crucially, **the ATC judgment remains in force.** The agent is irrational because their action does not match their *current* verdict of reason. The value of the cake has not magically spiked; the agent simply fails to let their best judgment cause the action.

  ### 2. Ainslie's Account: Diachronic Inconsistency
  Ainslie's model (picoeconomics) relies on the shape of the discount curve. As you know from your lab days, this creates a crossover point.
  *   At $t_1$ (distant), the Larger-Later Reward (LLR) has higher present value than the Smaller-Sooner Reward (SSR).
  *   At $t_2$ (immediate), the SSR curve crosses above the LLR curve.

  In this framework, at the moment of choice ($t_2$), the agent **actually prefers** the SSR. The value *has* changed. The agent is maximizing their current utility function.

  If you ask the Ainsliean agent at $t_2$, "Which do you prefer?" they will truthfully say, "This drink now." They are not acting against their current preference; they are acting against their *past* preference (from $t_1$).

  ### 3. The Mismatch: Judgment vs. Valuation
  This is where your suspicion of a "swap" is vindicated.

  **Davidson** treats the ATC judgment as distinct from the immediate motivational pull. You can judge $X$ is better even if $Y$ feels more urgent. Akrasia is the failure of the judgment to govern the action.

  **Ainslie** treats "judgment" as a reflection of current discounted value. If the curve crosses, the judgment *changes*. There is no conflict at $t_2$ between judgment and desire; they align on the SSR. The conflict is only between $t_1$-Self and $t_2$-Self.

  Therefore, **hyperbolic discounting dissolves the Davidsonian puzzle rather than solving it.**
  *   **Davidson asks:** How can I do $Y$ when I *now* judge $X$ best?
  *   **Ainslie answers:** You do $Y$ because you *now* judge $Y$ best (due to the curve), even though you *previously* judged $X$ best.

  Ainslie explains **procrastination, relapse, and diet-breaking** brilliantly. These are cases of preference reversal. But strictly speaking, they are not cases of Davidsonian *akrasia*, because the agent is not acting "clear-eyed" against a standing verdict. In the Ainslie model, the "eye" is clouded by the temporal proximity of the reward; the valuation itself shifts.

  ### 4. A Note on Aristotle
  Since you mentioned Aristotle, this distinction maps surprisingly well onto *Nicomachean Ethics* Book VII. Aristotle distinguishes between two types of akrasia:
  1.  **Impetuousness (*propeteia*):** Acting on passion before reason has finished its work.
  2.  **Weakness (*astheneia*):** Deliberating and forming a conclusion, but failing to stick to it due to passion.

  Ainslie's model looks a lot like **impetuousness**. The "passion" (the steep part of the hyperbolic curve) overrides the long-term calculation. The knowledge of the long-term good is present (in the $t_1$ self) but is not "active" in the $t_2$ self.

  Davidson is trying to save the possibility of **weakness**. He wants to show how a rational agent can hold the conclusion in mind *and still* act against it. Aristotle was skeptical that the knowledge was fully "active" in the moment (likening it to a drunk reciting Empedocles). Davidson insists the judgment *is* active, which makes the action irrational. Ainslie insists the judgment *isn't* active (because value shifted), which makes the action rational (relative to the moment) but dynamically inconsistent.

  ### 5. Conclusion for Your Reading Group
  To answer your specific question: Hyperbolic discounting is an explanation of **everyday phenomena we lump in with akrasia** (addiction, procrastination), but it is **not** an explanation of **Davidsonian akrasia**.

  *   **If Ainslie is right:** There is no such thing as "clear-eyed" akrasia. There is only inter-temporal conflict between successive selves. The "weakness" is a failure of pre-commitment strategies, not a failure of rationality at the moment of choice.
  *   **If Davidson is right:** Ainslie describes *why* the temptation is strong, but not why we succumb. We succumb because we irrationally sever the link between our ATC judgment and our action.

  **The Strategic Takeaway:**
  In your reading group, you can position Ainslie as providing the **mechanism of temptation**, while Davidson provides the **structure of responsibility**.
  If you accept Ainslie's view fully, the "akratic" agent is simply a bundle of competing temporal preferences, and "weakness of will" is just the victory of the near-term self. This risks making the agent less responsible (they couldn't help the curve crossing).
  Davidson preserves responsibility by insisting that at the moment of action, the agent *could* have acted on their ATC judgment, and their failure to do so is a genuine normative failure, not just a mechanical crossover.

  You aren't misremembering the podcast; you are spotting a category error. Ainslie explains the *causes* of the behavior that looks like akrasia, but he denies the *logical conditions* that define akrasia in the philosophical tradition.
