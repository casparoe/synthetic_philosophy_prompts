      *   Standard literature (e.g., Nover & Hájek 2004 who introduced Pasadena): They argue that even with bounded utility, you can construct "Pasadena-like" games that break expectation if the utility function isn't bounded *and* the probabilities aren't fixed, but for a *fixed* bounded utility function on the Pasadena game specifically, the Expected Utility *is* defined.
      *   Wait, let's double check Nover & Hájek (2004). The Pasadena game is defined such that the expected *value* is undefined. If we apply a bounded utility function $U$, does $\sum p_n U(x_n)$ converge absolutely?
      *   $p_n = 1/2^n$. $x_n = (-1)^{n+1} 2^n / n$.
      *   If $U$ is bounded, $|U(x_n)| \le M$.
      *   $\sum |p_n U(x_n)| \le \sum (1/2^n) \cdot M = M$.
      *   Yes, it converges absolutely. So Expected Utility is defined.
