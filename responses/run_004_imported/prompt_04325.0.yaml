      *   *Nuance on Chreia:* Distinguish between "need" (objective lack) and "demand" (effective market demand). *Chreia* is closer to the former but functions as the latter in exchange.
      *   *The "Agreement":* Who agrees? The community/city, not just the two traders. This supports the User's point about stability.

