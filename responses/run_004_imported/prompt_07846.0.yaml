      *   **The Crux (The Debate Point):** The probability argument. Rawls says no probabilities (Maximin). But across time, does the risk of extinction change the calculation? Kael argues that time makes the gamble different. Elara argues the Veil erases time.
      *   **The Climax:** A specific scenario. A system failure. Fix it now (costly) or patch it (cheap but risky for later).
      *   **The Ending:** No resolution. They have to vote or decide, but the philosophical tension remains.

  5.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Check:* Did I capture the "cannot compensate future people" point the user mentioned?
