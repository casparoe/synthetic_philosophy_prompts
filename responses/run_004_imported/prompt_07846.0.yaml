      *   **Key Elements:**
          *   Setting: A founding council of a generation ship or long-horizon colony.
          *   Conflict: Real disagreement, not easy consensus.
          *   Character A: Argues for the Difference Principle applied to the *current* worst-off (consume now).
          *   Character B: Argues for the Just Savings Principle (save for future worst-off generations).
          *   Specific Debate Point: The Maximin rule vs. Probability/Utility across time. If you don't know *when* you exist, does the risk profile change?
          *   Ending: Unresolved dilemma (no moral spelled out).
      *   **Tone:** Intellectual, tense, dramatic but grounded in the philosophy.

  2.  **Setting the Scene:**
      *   A generation ship is perfect. It isolates the group, makes resources finite, and makes the future tangible. Let's call the ship *The Axiom*.
      *   The "Veil" needs to be simulated. A room where they don't know their assignment. But wait, the prompt asks for the *founding council* hammering out the charter *from behind* the veil. So, they are currently in the "Original Position."
      *   Let's make it a simulation chamber. They are the architects, but their identities (generation, role, health) are masked.

  3.  **Character Development:**
      *   **Kael:** The pragmatist/immediatist. Focuses on the suffering happening *now*. Represents the interpretation that the Difference Principle prioritizes the living worst-off.
      *   **Elara:** The futurist/saver. Focuses on the fragility of the long term. Represents the Just Savings Principle.
      *   **Tone:** Needs to feel like a high-stakes debate round but humanized.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the setting. The "Veil" interface. The stakes (the ship's trajectory).
      *   **The Conflict:** Introduce the resource allocation issue. Energy vs. Life Support vs. Storage.
      *   **Kael's Argument:** Why sacrifice the present? If I'm in Gen 1, starving to save Gen 10 is unjust. The Difference Principle says maximize the minimum. If Gen 1 is the minimum, help them.
