answer: |-
  The room was white, not because of cleanliness, but because of absence. There were no windows to the void outside the *Axiom*, no chronometers on the walls to mark the ship's century-long drift. There was only the Table, a haptic interface hovering in the center, and the three figures seated around it.

  They were the Founders. Or rather, they were the minds selected to draft the Charter of Distribution. To ensure impartiality, they were currently behind the Veil. The neural shunts at their temples scrambled their memories. They knew they were human. They knew they were rational. They knew the *Axiom* carried enough mass to sustain a colony for three hundred years, provided the consumption rate was managed.

  They did not know if they were the engineers locking the hull in Year 1, the hydroponics technicians struggling with blight in Year 50, or the scavengers picking through recycled air filters in Year 200. They did not know their generation.

  "Proposal 44-B," said the figure on the left. Let's call him Kael. His voice was tight, strained by a hunger that might have been real or might have been a simulation of the Veil. "We allocate forty percent of the fusion output to immediate life-support enhancement and caloric density. The rest goes to the reserve banks."

  "Rejected," said the figure on the right. Elara. Her posture was rigid. "That consumption rate depletes the reserve by Year 120. The generation that inherits the decay gets nothing. Proposal 44-C. Twenty percent to immediate support. Eighty percent to savings and infrastructure hardening."

  Kael slammed a hand on the Table. The haptic feedback rippled through the white room. "Twenty percent is starvation. You're talking about condemning the founding generation to malnutrition to build a buffer for people who aren't even conceived yet."

  "I'm talking about preventing the founding generation from condemning *everyone* to death," Elara shot back. "We are behind the Veil, Kael. You don't know you're in the founding generation. You could be in Year 120."

  "That's the problem with the temporal Veil," Kael said, leaning forward. "It breaks the logic. In a standard society, if I tax the rich to feed the poor, the rich can still live. They are compensated by the stability of the system. But this?" He gestured to the void they all knew was outside. "If I am in Generation One, and I sacrifice my calories for Generation Ten, I cannot be compensated. I starve. There is no trade. You can't send calories back in time."

  "Rawls isn't about compensation," Elara said. "It's about fairness. The Difference Principle. Social and economic inequalities are to be arranged so that they are to the greatest benefit of the least advantaged."

  "Exactly," Kael said. "The *least advantaged*. Right now, in this simulation, the immediate need is highest. If we are in Year One, the infrastructure is new, but the human cost of the launch is highest. We are the worst-off. Maximin rule dictates we maximize our position."

  "But what if Year One isn't the worst-off?" Elara's voice dropped, becoming colder. "What if the blight hits in Year 60? What if the fusion core degrades faster than predicted in Year 90? If you consume the surplus now, the 'least advantaged' in Year 90 have *zero*. You can't maximize the position of a ghost. If we don't save, the worst-off group isn't the poor of Gen 1; it's the dead of Gen 10."

  The third figure, silent until now, shifted. "This is the Just Savings Principle," he murmured. "Each generation must put aside a fair amount of real capital for the next."

  "Fair?" Kael laughed, a sharp, brittle sound. "Define fair. If I'm behind the Veil, I have to assume I could be anyone. But I also know I'm a rational actor. Why would I agree to a contract that requires me to starve for a future I won't see? That's not risk aversion; that's altruism. And the Veil isn't built on altruism. It's built on self-interest."

  "It's built on risk management," Elara countered. "Rawls rejects utilitarianism because he says you can't gamble with people's basic liberties. You don't accept a risk of slavery just because the average utility goes up. Why is this different? If we vote for 44-B, you are gambling that the future won't be catastrophic. You're assigning a probability to survival."

  "I'm not assigning probability. I'm acknowledging reality," Kael said. "The Maximin rule works when the stakes are social positions within a cooperative scheme. But this isn't a society; it's a timeline. If I end up in Gen 1, I suffer. If I end up in Gen 10, I don't exist if you have your way, because the ship fails. But if I have your way, and I'm in Gen 1, I *definitely* suffer. The Veil asks me to accept a guaranteed loss for a hypothetical gain."

  "The gain isn't hypothetical!" Elara stood up. The white room seemed to shrink. "The physics are real. Entropy is real. If you consume the capital, the system collapses. The 'worst-off' isn't a class, Kael. It's a chronological inevitability. If you prioritize the present worst-off, you create a future worst-off that is infinitely worse."

  "So we punish the living for the sake of the unborn?" Kael asked. "That sounds like tyranny. The Difference Principle is supposed to protect the vulnerable. The people breathing this air *now* are vulnerable. Their pain is immediate. How does the Veil weigh immediate agony against potential future extinction? Does the math hold?"

  "The math holds because the Veil erases 'now'," Elara said. "You don't know when 'now' is. You have to choose a principle you'd be willing to live under regardless of the date. Would you be willing to be born in Year 150 under Proposal 44-B?"

  "No," Kael admitted. "I wouldn't."

  "Then you can't vote for it."

  "But I also wouldn't be willing to be born in Year 1 under Proposal 44-C," Kael said softly. "I'd starve. So by your logic, both options are vetoed. We're paralyzed."

  The silence stretched. The hum of the *Axiom*'s engines seemed to vibrate through the floor, a reminder that the ship was moving regardless of their indecision.

  "This is why the circuit never runs this argument," Kael muttered, rubbing his temples. "Because it breaks the round. If the Veil includes time, the 'Original Position' becomes impossible. We can't contract with the future. They can't consent. We're just dictating terms to people who can't fight back."

  "We are them," Elara said. "That's the point of the Veil. You *are* them. The separation is an illusion of perspective."

  "It's not an illusion. It's causality," Kael insisted. "I affect them. They don't affect me. That power imbalance makes the fairness criteria collapse. If I hold the gun, you can't tell me it's 'fair' to shoot myself just in case I turn out to be the target later. I know I'm holding the gun."

  "You don't know," Elara said, though her voice wavered slightly. "The Veil says you don't know."

  "The Veil is a simulation," Kael said, tapping his temple. "I know I'm sitting in this chair. I know I'm making the decision. The responsibility is mine. The burden of proof is on the savings. Why should I trust that the future generation will use what I save wisely? Maybe they're wasteful. Maybe they deserve to fail. Why am I bound to save for people I can't judge?"

  "Because they are your descendants," Elara said. "Because the project is the continuation of the society, not just the comfort of the current members. If the society ends, the justice ends."

  Kael looked at the slider on the Table. It glowed amber, hovering between 20% and 40%.

  "Here's the real question," Kael said, his voice tired. "Rawls says we don't use probabilities behind the Veil. We assume the worst. But across time, the 'worst' changes. If I assume the worst for *me*, I save nothing, because the worst case is I'm in Gen 1 and I starve. If I assume the worst for *humanity*, I save everything, because the worst case is extinction. Which maximin do we run? The individual or the collective?"

  Elara looked at him. For the first time, the certainty in her eyes flickered. "I... I don't think Rawls decided that."

  "Exactly," Kael said. "He kicked the can down the road. Literally."

  He reached out his hand. The haptic interface sensed his proximity. The amber light pulsed, waiting for input. If he moved the slider left, the current generation breathed easier, but the reserves dipped into the red by Year 100. If he moved it right, the current generation tightened their belts, potentially to the breaking point, but the ship would last the full three centuries.

  "If I move it to savings," Kael said, "I might be killing the people in this room."

  "If you move it to consumption," Elara replied, "you are definitely killing the people who come after us. And since you don't know if you're one of them..."

  "I do know," Kael whispered. "I'm here. I'm now."

  "Are you?" Elara asked. "Or is that just the illusion the Veil hasn't quite scrubbed?"

  Kael's finger hovered over the light. The hum of the ship grew louder, or perhaps it was just the blood rushing in his ears. He thought of the hunger in his stomach, sharp and immediate. He thought of the dark, cold years ahead, where air might become a luxury. He thought of the faces of children who wouldn't be born for another century, faces he couldn't visualize, voices he couldn't hear.

  The fairness of the trade depended on the existence of the trader. But time didn't trade. It only took.

  "I can't compensate a ghost," Kael said again.

  "And you can't negotiate with the void," Elara answered.

  Kael's finger trembled. The amber light waited. The decision hung in the white room, suspended between the hunger of the present and the silence of the future. He took a breath, held it, and began to move his hand.
