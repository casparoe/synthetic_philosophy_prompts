answer: |-
  Here are ten interview questions designed for your podcast, tailored to a rationalist/quant audience and structured to press the guest on the specific vulnerabilities you identified. Each question includes a "Likely Answer" note and a "Follow-Up" designed to prevent her from retreating into standard defenses.

  ### Part I: The Diachronic Dutch Book Argument

  **1. The Leap from Pragmatic to Epistemic**
  "Let's start with the engine room of this debate: the Diachronic Dutch Book argument. The standard gloss is that if you violate Reflection, a bookie can construct a series of bets guaranteeing you a loss. Your defense, as I understand it, is that a rational agent simply shouldn't accept guaranteed losses, full stop. But in engineering terms, a 'guaranteed loss' often depends on the environment you're forced to operate in. If I violate Reflection, is the defect in my *credences* (my model of the world), or is it merely in my *betting policy* (my interface with the market)? Why does the possibility of a money pump necessarily imply my internal probabilities are wrong, rather than just my willingness to bet on them?"

  *   **Likely Answer:** She will likely insist that credences *just are* dispositions to bet, so a defect in betting behavior is constitutive of a defect in credence.
  *   **Follow-Up:** "If credences are dispositions to bet, can I not preserve the 'rationality' of my credences simply by adopting a policy of refusing to bet with anyone who knows my update rule? If I can block the loss by changing my betting *rules* without changing my *numbers*, doesn't that sever the link between Dutch Bookability and epistemic irrationality?"

  **2. Information Asymmetry vs. Logical Necessity**
  "Continuing on the Dutch Book: A common objection from the quant community is that the bookie in these scenarios isn't exploiting a logical inconsistency in your probabilities, but rather an information asymmetry. The bookie knows what your future credence will be before you do. In a prediction market, if someone knows my future order flow, they can front-run me and guarantee my loss. We don't say the trader is 'irrational' for getting front-run; we say they're operating in an adversarial environment. Why is the Reflection bookie different from a high-frequency trader front-running my future self?"

  *   **Likely Answer:** She will likely argue that the bookie doesn't need *new* empirical evidence, only knowledge of your own update rule, which you should also have access to.
  *   **Follow-Up:** "But if the bookie's edge relies on knowing my update rule better than I do, doesn't that imply the violation of Reflection is actually a failure of *introspection* or *self-knowledge* rather than a failure of probabilistic coherence? And if it's just introspection, why do we need a principle as heavy-duty as Reflection to fix it?"

  ### Part II: The Proviso and Vacuity

  **3. The "Defer Except When You Shouldn't" Charge**
  "Reflection comes with a famous proviso: you should only defer to your future self if you expect that self to be updating rationally on new evidence, not if you expect memory loss, manipulation, or intoxication. Critics argue this makes the principle vacuous—effectively reducing it to 'defer to your future self, except in cases where you shouldn't.' If the proviso does all the work of filtering out the bad cases, what explanatory heavy lifting is the Reflection Principle actually doing? Is it anything more than a label for 'expected rational updating'?"

  *   **Likely Answer:** She will likely argue the proviso is narrow and that Reflection provides the specific *mathematical constraint* on how to defer when the proviso is met.
  *   **Follow-Up:** "But to know the proviso is met, don't I already have to know that my future self's credence is *accurate* or *well-formed*? If I already know that, don't I already know what my credence *ought* to be? It sounds like I need to solve the epistemic problem *before* I can apply Reflection, which makes Reflection redundant."

  **4. Ex-Ante Operationalization**
  "Let's press on that redundancy point. As a trader, I need rules I can apply *ex-ante*. But the proviso requires me to judge, right now, whether my future self will be rational *then*. If I could reliably predict when I'm going to be irrational (e.g., 'I will be tired tomorrow'), shouldn't I just correct for that bias now rather than deferring? If I can't predict it, I can't apply the proviso. So isn't Reflection either unnecessary (if I know the proviso holds) or inapplicable (if I don't)?"

  *   **Likely Answer:** She will likely claim we often have partial knowledge—we know we aren't taking drugs, so we assume rationality by default.
  *   **Follow-Up:** "If it's a default assumption, then Reflection is just a prior over your own cognitive stability. Why treat it as a synchronic constraint on credence rather than just a standard empirical belief about your own brain's reliability?"

  ### Part III: Sleeping Beauty as a Stress Test

  **5. The Memory Wipe Edge Case**
  "Let's move to the Sleeping Beauty problem. Beauty knows that upon awakening, her memory of the previous day will be wiped. This sounds like the exact kind of 'memory loss' case the proviso is designed to carve out. If Reflection doesn't apply here, that's consistent with your view. But many argue that self-locating belief *always* involves a kind of indexical uncertainty akin to memory loss. If Reflection is silent in the Sleeping Beauty case, is there *any* non-trivial case of self-locating belief where it actually applies?"

  *   **Likely Answer:** She will likely maintain that Sleeping Beauty is a special case of information loss and that Reflection holds firm for standard cases where identity and memory are continuous.
  *   **Follow-Up:** "But if 'continuous memory' is the condition, doesn't that rule out almost all real-world decision making? I forget things constantly. If Reflection only applies to idealized agents with perfect memory retention, does it have any normative force for human beings?"

  **6. Guidance in the Beauty Case**
  "Suppose we grant that Reflection doesn't directly dictate Beauty's credence upon awakening because of the memory wipe. Does Reflection offer *any* guidance to Beauty *before* the experiment starts? Should she anticipate violating Reflection later, or should she adopt a strategy that ensures she won't? If she knows she *will* violate Reflection on Sunday, is she irrational on Friday for knowing that?"

  *   **Likely Answer:** She will likely say Beauty can anticipate the violation on Friday without being irrational, because she knows the proviso will fail on Sunday.
  *   **Follow-Up:** "So on Friday, she knows: 'On Sunday, I will have a credence that I currently regard as wrong.' If I know my future self will be wrong, but I can't stop it, isn't that a breakdown of the 'future self as expert' analogy? And if the analogy breaks there, why trust it in less extreme cases?"

  **7. Indexicals vs. Propositions**
  "Reflection is usually formulated over propositions $A$. But in Sleeping Beauty, the uncertainty is about 'Today is Monday' or 'I am awake now.' These are indexicals. Has the Reflection Principle been successfully formalized for self-locating beliefs, or is it fundamentally a theory for 'view from nowhere' propositions? If it's the latter, isn't it missing most of the cases where agents actually need to make decisions?"

  *   **Likely Answer:** She may argue that indexicals can be mapped to centered worlds or that Reflection applies to the underlying non-indexical facts.
  *   **Follow-Up:** "If I have to translate 'I am here' into 'The agent at location L is here' to make Reflection work, haven't I smuggled in the solution via the translation? Does Reflection do any work, or is it just riding on the back of the translation scheme?"

  ### Part IV: Falsifiability and Application

  **8. The Expert Analogy Limit**
  "You often analogize the future self to an expert, similar to Lewis's Principal Principle regarding objective chance. But with an external expert, I can check their track record. With my future self, I can't check the track record until I *become* that self. Isn't there a circularity in trusting my future self *because* I expect to be rational, when my expectation of rationality is based on trusting my current self's assessment?"

  *   **Likely Answer:** She will likely argue it's not circular because it's a constraint on coherence across time, not a verification of truth.
  *   **Follow-Up:** "But coherence with what? If I'm currently deluded, and I expect to remain deluded, Reflection tells me to defer to my future delusion. That seems to preserve coherence but guarantees error. Is coherence without accuracy the goal here?"

  **9. Conditions for Abandonment**
  "I want to close on the status of the principle itself. You've defended a robust version of Reflection against Dutch Book objections, proviso charges, and Sleeping Beauty cases. For an audience of engineers and quants, I have to ask: What would count as genuine evidence *against* Reflection? Is there a formal theorem, a specific thought experiment, or an empirical finding about human calibration that would convince you to abandon or significantly dilute the principle?"

  *   **Likely Answer:** She might say a proof that Reflection conflicts with a more fundamental axiom of probability or decision theory.
  *   **Follow-Up:** "If such a conflict were found, which would you drop? Would you sacrifice Reflection to save the standard axioms of Bayesian updating, or vice versa? Where does Reflection sit in your hierarchy of epistemic virtues?"

  **10. Advice for the Calibration Engineer**
  "Finally, bringing it back to my corner of the world: I build calibration tools for traders. If a trader's past data shows they systematically violate Reflection—they know they'll be overconfident tomorrow but don't adjust today—should my tool flag this as a 'bug' in their reasoning engine, or just a 'feature' of their risk profile? If you were advising a quant fund on how to hard-code rationality, is Reflection a constraint you'd enforce in the code?"

  *   **Likely Answer:** She will likely say it should be enforced as a consistency check to prevent arbitrage against themselves.
  *   **Follow-Up:** "If we enforce it in code, we eliminate the possibility of the agent learning that they are irrational. By forcing them to satisfy Reflection, don't we prevent them from ever discovering that their future self is actually less reliable than they thought? Does enforcing Reflection prevent meta-cognitive learning?"
