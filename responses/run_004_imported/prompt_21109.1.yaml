answer: |-
  Here is the ranking of the six views based on their explanatory power regarding why hypocrisy undermines standing to blame, starting with the most convincing.

  **1. Equal Standing**
  This view most convincingly captures the relational nature of blame, arguing that moral accountability relies on a mutual commitment to shared norms that the hypocrite violates by exempting themselves. It explains the loss of standing as a breach of the "moral community" contract, making it clear why the hypocrite forfeits the authority to enforce rules they refuse to follow themselves.

  **2. True-but-not-their-place**
  This perspective correctly isolates the logical distinction between the validity of a claim and the authority of the speaker, validating the intuition that advice can be accurate even if the advisor is disqualified. By treating standing as a separate normative question from truth, it prevents the error of dismissing valid criticism while still acknowledging the hypocrite lacks the business to deliver it.

  **3. Unified**
  This theory offers an elegant synthesis by identifying a common underlying defect across hypocrisy, meddling, and complicity, suggesting all three involve an inappropriate relationship to the norm or the wrongdoer. While robust, it risks being slightly overbroad by lumping distinct normative issues together, which may obscure the specific mechanism of hypocrisy compared to the "equal standing" view.

  **4. Free Rider**
  This explanation appeals strongly to our sense of fairness regarding burden-sharing, positing that hypocrites lose standing because they unfairly dodge the costs of compliance while demanding others pay them. However, it is narrower than other views because it fails to account for hypocrites who violate norms without gaining any actual advantage or benefit from their violation.

  **5. No Such Thing**
  While philosophically parsimonious, this skeptical view dissolves the specific normative phenomenon of standing into unrelated factors like tone or relationship history rather than addressing hypocrisy directly. It fails to capture the unique force of the "who are you?" complaint, effectively ignoring the distinct intuition that hypocrisy itself creates a specific barrier to blame.

  **6. Just a Vice**
  This view fundamentally misses the mark by treating the loss of standing as merely an insult to the blamer's character rather than a normative disqualification from the act of blaming. It contradicts the strong pre-theoretical intuition that hypocrites lack the authority to blame entirely, not just the moral high ground, making it the least convincing explanation for why standing is actually lost.

