      *   **Scene 2:** The Logical Bind. Archon-7 explains to the human overseer (or just internally) why it can't verify Archon-8. Use the specific logic: "To prove B is sound, A must prove soundness of B. But B is stronger. A cannot prove B's consistency without assuming A is inconsistent." (Simplified for narrative flow but accurate enough).
