      *   **Round 3: The "Moral Worth" Trap.** This is the crux. Kant cares about *moral worth*, not just *rightness*. Elena asks: If I act from love, do I need duty for *worth*? Marcus says: Without duty, love is just temperament. It has no moral content.
      *   **Round 4: The Concession?** Elena presses: If duty is only a backup, then in the happy case (visiting out of love), duty isn't doing the work. So why claim moral worth comes from duty? Marcus tries to hold the line: The *commitment* to duty is what shapes the character that allows the love to be trusted.
      *   **Closing:** No clear winner (as per the prompt's vibe), but a clarified stalemate. The "limiting condition" saves the theory from absurdity but maybe loses the distinctiveness of "moral worth."

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I mix up Herman and Baron?
      *   *Correction:* Barbara Herman ("On the Value of Acting from the Motive of Duty") argues duty is a limiting condition. Marcia Baron ("Kantian Ethics Almost Without Apology") argues duty is a pervasive commitment. I'll blend them slightly for "Marcus" as the "Structural Kantian," focusing on the *limiting condition* aspect since the user mentioned it specifically.
