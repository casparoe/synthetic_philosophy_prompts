answer: |-
  **Setting:** *A dimly lit office kitchen at 11:30 PM. The hum of server racks is audible through the walls. **Marcus** (Perdurantist) is leaning against the counter, nursing cold brew. **Elena** (Endurantist) is pacing, holding a mug of tea.*

  **Marcus:** You're refactoring the auth service again?

  **Elena:** Event-sourcing it. Immutable logs. No more updating rows in place. It's cleaner, but it got me thinking about your favorite hobby horse.

  **Marcus:** Time?

  **Elena:** Persistence. Specifically, how you people claim objects are just "spacetime worms."

  **Marcus:** And you claim they're wholly present at every moment. Which leaves you with a logical disaster. Look, let's skip the bent pokers. Think about this auth token. At 2:00 PM, the token is *Valid*. At 2:05 PM, after the rotation, that same token is *Invalid*.

  **Elena:** Sure. Standard lifecycle.

  **Marcus:** It's a contradiction. *Valid* and *Invalid* are incompatible properties. If the token is wholly present at 2:00 and wholly present at 2:05, and it's the *same* token, then you're saying $x$ is $F$ and $x$ is not-$F$. Logic explodes. The only way to save it is to admit the token at 2:00 isn't the whole token. It's just a temporal slice. The "worm" includes the valid slice and the invalid slice. No contradiction, because different parts have different properties.

  **Elena:** That's the old Problem of Change, Marcus. And it assumes properties are monadic—simple, one-place predicates like "is Valid." They aren't.

  **Marcus:** Oh?

  **Elena:** I take the first move: Indexicalism. The token doesn't have the property *Valid*. It has the property *Valid-at-2:00*. Later, it has *Invalid-at-2:05*. These aren't incompatible. Just like I can be "to the left of you" and "to the right of you" simultaneously if the reference points differ. There's no contradiction in the object, only in your shorthand.

  **Marcus:** That's linguistic triage, not ontology. You've turned intrinsic properties into relations. *Validity* should be about the token's internal cryptographic state, not its relation to a clock. If you say everything is "Property-at-time," then nothing actually *has* any properties anymore. They just have relations to coordinates. You've saved the object by draining it of its nature. The token isn't valid; it's just... token-ing near a Tuesday.

  **Elena:** Fine. Then I take the second move. The property is intrinsic, but the *exemplification* is relative. The token *has* Validity, but it stands in the "has-at" relation to 2:00. The object is the substrate; the time is the mode of access. I don't need to slice the token to explain why the property holds now but not then.

  **Marcus:** And what grounds that relation? If the token is wholly present at 2:05, why does it fail the "has-at" relation for Validity? Usually, if an object has a property, it's because of its parts or structure. If the whole token is there at 2:05, and the structure is identical to 2:00—because you say it's the *same* whole object—what physically stops it from being Valid?

  **Elena:** The time itself. Time is the external parameter that gates the exemplification.

  **Marcus:** So time is a magical force that switches properties on and off for a wholly present object? That's Occasionalism with a clock. Look, Elena, on my view, it's simple. The 2:00 slice has the structure for Validity. The 2:05 slice has the structure for Invalidity. The "token" is the aggregate. We don't need magic gating. We just have variation across parts, like a road going up a hill and then down.

  **Elena:** A road doesn't *go* anywhere, Marcus. That's my point. That's the fatal flaw in your worm theory. If the object is just a static heap of time-slices laid out in the block universe, where is the change?

  **Marcus:** Change is qualitative variation across temporal parts.

  **Elena:** No, that's *difference*. A rainbow has different colors across spatial parts. We don't say the rainbow *changes* from red to blue. It just is red here and blue there. If your token is just a worm stretching from Monday to Friday, the "Valid" part and the "Invalid" part just sit there eternally. Nothing ever *becomes* invalid. It just *is* invalid at that coordinate. You've eliminated time's dynamism to save your logic.

  **Marcus:** That's the "No Change" objection. It relies on a fetishization of the "Now." You think change requires some magical motion of a spotlight along the worm. But that leads to regress. How fast does the spotlight move? Seconds per second? It's nonsense. My view captures everything that actually matters. We can point to the 2:00 slice and say "It was valid." We can point to 2:05 and say "It is not." We account for all the empirical data without positing a mysterious "whole object" that somehow survives the destruction of its properties.

  **Elena:** But you lose the subject of the change! If I say "The token expired," I mean *this thing* underwent a process. On your view, "The token" is a fiction. It's just a name for a collection of slices. The 2:00 slice doesn't know about the 2:05 slice. They're causally connected, sure, but they aren't *identical*. So when the system crashes at 2:03, *what* crashed? The slice? The worm? If the worm exists all at once in spacetime, it can't crash. It just has a "crashed" segment.

  **Marcus:** The worm crashes in the sense that its later temporal parts cease to function according to spec. You're demanding a metaphysical "glue" that holds the slices together beyond causal continuity and similarity. You want a "thismess" that persists. But look at your event store. You're moving to immutable logs. You know better than anyone: there is no row updating in place. There's only an append. A new state record.

  **Elena:** The log records the *history* of the object. It doesn't replace the object. The object is the entity that owns the log.

  **Marcus:** Is it? Or is the "entity" just a convenient label we paste over the stream of events? In your new architecture, if I want to know the state of the token, I don't look for a "whole token." I fold the events up to time $t$. The token *is* the fold. That's perdurantism in code. The object is the sum of its history.

  **Elena:** But the code expects a *current* state. The service loads the snapshot and treats it as *the* token. It behaves as if the token is wholly present, waiting for the next request. If your view were true, the service should have to query the entire spacetime worm every time it authenticates. It doesn't. It assumes a persistent substrate that endures.

  **Marcus:** It assumes that because the CPU is at a specific temporal coordinate. The service is a slice interacting with a slice. Of course it only sees the present slice. You're confusing the perspective from within the worm with the ontology of the worm.

  **Elena:** And you're confusing a map with the territory. You've built a beautiful, contradiction-free geometry of time, but you've forgotten to put any time in it. It's a static block. I'll take the contradiction risk. I'd rather believe that things genuinely change than believe that nothing ever happens and we're just reading a script written in four dimensions.

  **Marcus:** And I'd rather believe that logic holds than believe in magical property-switching substrates. We're at an impasse.

  **Elena:** Seems like it. You keep the logic; I'll keep the change.

  **Marcus:** Pass the sugar?

  **Elena:** It's on the left.

  **Marcus:** Was on the left. You moved it.

  **Elena:** *See?*

  **Marcus:** *Smiles.* Different temporal parts of the sugar bowl, Elena. Different temporal parts.

  **Elena:** Drink your coffee, Marcus.
