      *   *Crucial Distinction:* Specification Gaming is often a *failure of specification* (the reward function was wrong from the start), whereas Goodhart is often a *failure of optimization* (the reward function was okay-ish, but optimizing it broke it).
      *   *Synthesis:* The AI community uses "Goodhart" as an umbrella term for "Optimization Pressure breaks things." The user is right that it's a category error to call a bug "Goodhart's Law" in the strict economic sense, but the Manheim/Garrabrant taxonomy bridges the gap.

