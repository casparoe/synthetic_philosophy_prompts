      *   *Comment:* Chalmers (1996) proposed the *counterfactual* fix, not the *complexity* fix. These are different solutions. Counterfactual sensitivity addresses the "single trajectory" problem, but Aaronson argues it is still vulnerable to triviality without the added complexity constraint. Conflating "counterfactuals" with "complexity" here muddies the philosophical genealogy.

