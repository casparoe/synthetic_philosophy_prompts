      *   *Better Stance:* **Pragmatic Realism.** We are entitled to realism about the *causal carriers* of information, but we must accept Dennett's constraint that the *individuation* of those carriers is interest-relative. However, since the prompt asks to choose between realism and instrumentalism, I should lean towards **Realism**, but a specific kind: **Structure-Realism**. The directions are real causal levers. The *meaning* we attach is the instrumental part.
