  2.  **Deconstruct the Philosophical Landscape:**
      *   **Ramsey's Job Description Challenge:** Representations aren't just things that correlate; they must play a specific causal role (standing in for something else in a computation to guide action/output). If a posited state doesn't do the *job* of a representation, it's not one.
      *   **Dennett's Real Patterns:** Something is "real" if it allows for successful prediction/compression, even if it's not fundamental physics. It's a middle ground between hard realism and eliminativism.
      *   **Mechanistic Interpretability (Mech Interp):**
          *   *SAEs:* Try to find a basis where features are monosemantic (one concept per neuron/direction).
