answer: |-
  **Title:** Levers in the Latent Space: A Defense of Realism in Mechanistic Interpretability

  The image is striking: a sparse autoencoder (SAE) feature in a large language model is identified as the "Golden Gate Bridge." When researchers intervene on this feature—amplifying its activation—the model begins to fixate on the bridge in almost every reply, regardless of context. For the mechanistic interpretability community, this is evidence of discovery. For the skeptic, it is evidence of projection. In our seminar, this tension has crystallized into a debate between realism and instrumentalism. One camp argues that causal interventions satisfy W. Ramsey's "job description" for representations; the other argues that superposition and feature splitting dissolve the fact of the matter, leaving us with only Dennettian "real patterns" useful for human compression.

  While the instrumentalist reading correctly identifies the ontological fuzziness of high-dimensional vector spaces, it draws the wrong metaphysical conclusion. We are entitled to realism about the representations posited by mechanistic interpretability. Specifically, the capacity for causal intervention satisfies Ramsey's Job Description Challenge in a way that transcends mere predictive utility. The non-uniqueness of features due to superposition does not negate their reality; it merely describes the distributed format of that reality.

  To understand why realism is the warranted stance, we must first clarify the stakes using Ramsey's *Representation Reconsidered*. Ramsey's "job description challenge" demands that for a state to count as a genuine representation, it must do more than merely correlate with a state of affairs. It must play a specific causal role in the system's processing: it must stand in for the represented object in a way that drives downstream computation and behavior. If a posited representation is merely something an external observer can decode (a "read-out"), it fails the challenge. It is an artifact of the observer, not a mechanism of the system.

  The instrumentalist camp leverages this skepticism by pointing to the mathematics of superposition. As Anthropic's *Toy Models of Superposition* demonstrates, neural networks store more features than they have dimensions, forcing features to interfere and overlap. Furthermore, the *Scaling Monosemanticity* paper shows that as dictionary sizes increase, features split: a general "Golden Gate Bridge" feature might fracture into "Golden Gate Bridge at sunset" and "Golden Gate Bridge in fog." The instrumentalist argues that if the "true" feature depends on the arbitrary granularity of the dictionary, there is no privileged fact of the matter about what the model represents. On this view, features are Dennettian "real patterns"—useful compressions for *us* to predict the model, but not ontological primitives *in* the model.

  This argument, however, conflates *individuation* with *existence*. It is true that there may be no single, atomic "Bridge" feature carved in stone at the fundamental level of the weights. But realism does not require atomicity; it requires causal efficacy. The instrumentalist objection rests on the idea that because the basis is non-unique, the features are not "really there." Yet, the activation patching experiments directly address Ramsey's challenge. When we intervene on the "Golden Gate Bridge" direction and the model's output distribution shifts causally toward bridge-related text, that direction is doing the *job* of a representation. It is acting as a lever that the system's downstream layers treat as a signal.

  The fact that this lever might be composed of a superposition of other vectors, or that it might split under higher resolution, does not make the lever less real. Consider a biological analogy: if we identify a neural circuit responsible for "fear" in a mouse, and later discover that circuit splits into "fear of predators" and "fear of open spaces" under finer microscopy, we do not conclude that the original fear circuit was an instrumental fiction. We conclude that our initial granularity was coarse. The causal power remained stable across the refinement. Similarly, in SAEs, the stability of the causal intervention across different dictionary sizes suggests that while the *boundaries* of the feature are pragmatic, the *causal structure* is robust.

  The instrumentalist might retort that Dennett's "Real Patterns" is the ceiling, not the floor. They might argue that because the features are defined relative to a specific training run and a specific sparsity penalty, they are observer-relative. But this ignores the asymmetry introduced by mechanistic intervention. A Dennettian pattern is real if it allows *the observer* to predict the system. A Ramseyian representation is real if it allows *the system* to process information. The patching experiments show that the model itself "uses" these features to compute its next token. The "Golden Gate Bridge" direction is not just a pattern we see; it is a causal channel the model exploits. This moves the features from the status of "useful map" to "territory."

  Furthermore, the non-uniqueness argument relies on a hidden assumption of classical symbolic realism—that for a representation to be real, it must be discrete and orthogonal. If we abandon that assumption in favor of a distributed realism, the objection loses its bite. Superposition is simply a high-density storage format. That multiple features share dimensions does not mean the features are illusory; it means the hardware is efficient. As long as the SAE can recover directions that support causal intervention, the "job description" is met. The model is treating these directions as distinct informational vehicles, even if those vehicles overlap in the substrate.

  Therefore, we should reject the deflationary view that reduces mechanistic interpretability to a hermeneutic exercise. While Dennett is right that our *labels* for features are interest-relative, Ramsey is right that the *causal role* determines representational status. The instrumentalist camp is correct that feature splitting prevents us from claiming we have found the "ultimate atoms" of thought. But they are wrong to infer that we have found nothing but our own reflection.

  We are entitled to realism about mechanistic representations because they satisfy the only criterion that matters for cognitive science: they are the levers that move the system. The "Golden Gate Bridge" feature is real not because it is a perfect, atomic symbol, but because pulling it makes the model think about the bridge. Superposition and splitting describe the *physics* of the representation, not its *unreality*. To deny this is to demand a level of ontological precision from cognitive systems that even human brains likely do not possess. We should accept that representations can be real without being fundamental, and distributed without being illusory. The model has a mind, in the minimal sense of having functional states that carry information and drive action; the SAE features are the best map we have of that territory, and the patching experiments prove they are not just maps, but compasses embedded in the machine itself.
