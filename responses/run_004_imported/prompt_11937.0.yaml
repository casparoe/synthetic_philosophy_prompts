      *   *Decision:* I will argue for **Causal Realism**. The existence of causal leverage (patching) satisfies Ramsey's Job Description. Superposition and splitting describe the *format* of the representation, not its unreality. Dennett is right that patterns are relative to a stance, but if the pattern supports intervention, it earns realist status.

