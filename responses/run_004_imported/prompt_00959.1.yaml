  # Chapter 4: The Common Prior as a Savagean Coherence Condition
  ## Reconciling Aumann's Correlated Equilibrium with Personalist Probability

  ### 4.1 Introduction

  The derivation of the correlated equilibrium by Aumann (1987) stands as a cornerstone of the epistemic program in game theory. By demonstrating that Bayesian rationality coupled with a Common Prior Assumption (CPA) necessitates play consistent with a correlated equilibrium, Aumann provided a rigorous justification for equilibrium concepts grounded in decision theory rather than ad hoc fixed-point arguments. However, this derivation has faced sustained philosophical scrutiny, most notably from Faruk Gul (1998). Gul argues that the CPA, particularly when applied to a player's own future actions, violates the spirit of Leonard Savage's (1954) subjectivist foundation. According to Gul, positing a "prior stage" where players hold identical beliefs about their own future choices is psychologically implausible and antithetical to the Savagean view that rational agents need not converge on probabilities simply by virtue of being rational.

  This chapter argues that Gul's critique rests on a temporal and metaphysical misreading of the Common Prior Assumption. I contend that the CPA should not be interpreted as a historical claim about a pre-play psychological state, but rather as a logical constraint on the coherence of beliefs within the "Small World" of the game model. When viewed through this lens, the CPA is not only consistent with Savage's personalist conception of probability but is arguably required to maintain Savagean coherence in an interactive environment. Specifically, I demonstrate that probabilizing one's own future action is not a denial of agency, but a necessary condition for treating strategic uncertainty as a state of nature, thereby preserving the expected utility framework in games.

  ### 4.2 The Savagean Objection: Agency and the Prior

  To understand the weight of Gul's objection, one must first appreciate the specific tenets of Savage's *Foundations of Statistics*. Savage's subjectivism is built on the axiom that probability measures represent an individual's degree of belief, constrained only by the requirement of coherence (avoiding Dutch books). Crucially, Savage distinguishes sharply between "states" of the world (which are outside the agent's control) and "acts" (which are within the agent's control). For Savage, an agent does not assign probabilities to their own acts; they *choose* them. To assign a probability to one's own choice is to treat oneself as an object of observation rather than a subject of volition, potentially collapsing the distinction between state and act that underpins the Expected Utility Theorem.

  Gul extends this critique to the interactive setting. In Aumann's framework, the state space $\Omega$ includes the action profile $(a_1, ..., a_n)$. The Common Prior is a probability distribution $P$ over $\Omega$ shared by all players. Gul objects that for Player 1 to share a prior with Player 2 regarding Player 1's own action $a_1$ implies a "prior stage" where Player 1 is uncertain about their own rational choice. Gul writes:

  > "The common prior assumption... requires that before they receive their private information, the players have the same probabilistic beliefs about the true state of the world. But the state of the world includes the players' actions... [This] is inconsistent with the idea that players choose their actions." (Gul 1998, p. 10)

  Gul argues that if players are truly Savagean subjective expected utility maximizers, their beliefs are personal. There is no normative requirement that two rational agents with the same information must agree (a rejection of Harsanyi's doctrine). Therefore, imposing a common prior, especially over one's own volition, imposes an objective frequency interpretation onto a subjective framework, violating the personalist core of the theory.

  ### 4.3 The "Small World" Reinterpretation of the Prior

  The resolution to this tension lies in re-evaluating the ontological status of the "prior." Gul's critique relies on a *temporal* interpretation of the prior: that there exists a chronological moment $t_0$ before information arrival where beliefs are formed and held. However, in the context of epistemic game theory, the prior is better understood as a *logical* baseline rather than a historical event.

  Savage himself acknowledged that his axioms could only hold in a "Small World"—a simplified, closed model of reality where all relevant contingencies are enumerated. A game-theoretic model is the quintessential Small World. Within this constructed universe, the "Common Prior" represents the common theory of the world shared by the agents. It is not necessarily a record of what they believed before birth, but a representation of the structural constraints they accept as rational agents participating in the game.

  If we interpret the CPA as a consistency condition on the *model* rather than a psychological description of the *players*, the conflict with Savage dissolves. Savage's subjectivism demands that an individual's beliefs be coherent. In a strategic setting, however, individual coherence is insufficient; *interactive* coherence is required. If Player 1 believes Player 2 is rational, and Player 2 believes Player 1 is rational, their beliefs must mesh to avoid infinite regress or contradiction (as seen in the Brandenburger-Keisler paradox). The Common Prior is the mathematical device that ensures this interactive coherence. It guarantees that differences in posterior beliefs arise *solely* from differences in information (partitions), not from fundamental disagreements on the likelihood of states.

  Thus, the CPA is consistent with Savage if we view it as a normative extension of coherence to the interactive sphere. Just as a single Savagean agent must not hold contradictory beliefs about a single event, two interacting Savagean agents who acknowledge they are reasoning about the *same* world should not hold contradictory beliefs about the *same* state, absent informational differences.

  ### 4.4 Probabilizing Own Actions: Strategy as State

  The most potent aspect of Gul's critique concerns the inclusion of a player's own action in the prior. If I am a Savagean agent, I choose my act; I do not predict it. How, then, can I hold a prior probability over my own move?

  The solution lies in the distinction between the *act of choosing* (ex-post) and the *strategy as a function of type* (ex-ante). In the Harsanyi-Aumann framework, a player's action is determined by their type (their private information) and their decision rule. When a player assigns a probability to their own action within the prior, they are not predicting their volition in a deterministic sense; they are assessing the likelihood of the *informational state* that will trigger that volition.

  Consider a Savagean agent facing a complex decision problem. To apply the Expected Utility rule, the agent must assess the probability of consequences conditional on acts. In a game, the consequence of my act depends on your act. But your act depends on your belief about my act. To close the loop, I must form a belief about the joint profile.

  Treating one's own action as a random variable in the prior is a methodological necessity for applying Bayesian updating to strategic interaction. It does not deny free will; rather, it treats the *decision function* as part of the state of the world.
  1.  **Ex-ante (The Prior View):** The agent views themselves as a system that maps information to actions. Uncertainty exists regarding which information will be received and how the self will process it (in cases of bounded rationality or trembles) or simply as a way to model the correlation device.
  2.  **Ex-post (The Savage View):** Once the information partition is known, the agent maximizes utility. The probability collapses to 0 or 1 for the chosen act.

  This distinction preserves Savage's agency. The prior does not dictate the choice; it dictates the *beliefs about the context* in which the choice is made. As Aumann (1987) notes, the correlated equilibrium does not require a physical correlation device; the "prior" can simply represent the players' mutual expectations. When Player 1 assigns a probability to their own action in the prior, they are essentially simulating their own rationality from the perspective of the common theory. They are asking, "Given the common theory of the game, what is the probability that a rational agent with my information structure would take action $X$?" This is fully compatible with Savagean subjectivism, provided the agent accepts the "common theory" as the framework for their subjective probabilities.

  ### 4.5 Harsanyi's Doctrine as a Savagean Norm

  Gul's rejection of the CPA leans heavily on the claim that Savage denied that equally informed rational people must converge. While Savage focused on individual coherence, the Harsanyi Doctrine (which underpins the CPA) posits that differences in priors are attributable to differences in information or experience.

  For a dissertation on epistemic foundations, it is vital to argue that the Harsanyi Doctrine is not a rejection of subjectivism, but a *refinement* of it for interactive contexts. Pure subjectivism allows for "agreeing to disagree." However, in a game, "agreeing to disagree" on the fundamentals of the world (the prior) while claiming common knowledge of rationality can lead to incoherence. If we know you are rational, and we know we have the same information, and we still assign different probabilities to an event, one of us must be misapplying the rules of probability.

  Therefore, the CPA can be read as a Savagean consistency constraint. Savage requires that an agent's beliefs satisfy the axioms of probability. The CPA extends this: if two agents acknowledge they are part of the same "Small World" (the game), their probability assignments should be derivable from a single measure updated by private data. To deny the CPA is to assert that there is a fundamental, unexplainable divergence in how two rational minds process the same reality. While psychologically possible, it is normatively indefensible within a model that assumes common knowledge of rationality.

  By accepting the CPA, the players are not surrendering their subjective stance; they are acknowledging that their subjectivity is situated within a shared logical space. The prior ranges over the player's own action not to negate agency, but to ensure that the player's belief about *others'* actions is consistent with the others' beliefs about *the player's* actions. This mutual consistency is the bedrock of equilibrium.

  ### 4.6 Addressing the "Antithesis" Claim

  Gul claims the prior view is "antithetical" to Savage. I argue it is complementary. Savage's framework is silent on multi-agent consistency. It provides the engine of decision-making (Expected Utility) but not the traffic laws of interaction. Aumann's CPA provides the traffic laws.

  The apparent conflict arises only if one conflates the *modeler's prior* with the *player's psychological state*.
  *   **The Modeler's View:** The theorist imposes a common prior to ensure the solution concept (Correlated Equilibrium) is well-defined and derives from Bayesian rationality.
  *   **The Player's View:** The player acts subjectively to maximize utility given their partition.

  As long as the player's subjective posterior (derived from the common prior and their private info) drives their choice, Savage's condition is met. The fact that the posterior was derived from a prior that included the player's own action as a variable is a feature of the *solution concept*, not a violation of the *decision process*. The player does not choose *because* the prior said so; the prior predicts the choice *because* the player is rational.

  Furthermore, recent work in epistemic logic suggests that without a common prior, "Common Knowledge of Rationality" (CKR) is insufficient to rule out certain dominated strategies. If we wish to maintain the normative force of game theory—that rational players *should* play equilibrium strategies—we require the CPA. Thus, the CPA is not an empirical claim about psychology (which Gul attacks) but a normative claim about rationality (which fits Savage's axiomatic approach).

  ### 4.7 Conclusion

  Gul's critique of Aumann serves as a necessary caution against reifying the Common Prior as a historical psychological event. However, it does not succeed in demonstrating that the CPA is incompatible with Savage's personalist probability. By reinterpreting the prior as a logical coherence condition within the "Small World" of the game, and by understanding the probabilization of own actions as a modeling of the decision function rather than a prediction of volition, the Aumann derivation remains robust.

  The Common Prior Assumption does not strip the agent of Savagean agency. Instead, it embeds the Savagean agent into a social context where coherence requires that subjective beliefs be mutually reconcilable. For the epistemic foundations of equilibrium, this implies that Correlated Equilibrium is not merely a mathematical artifact, but the unique outcome consistent with Bayesian rationality, common knowledge thereof, and a shared commitment to the logical structure of the world they inhabit. The "prior view" is thus not antithetical to Savage, but is the necessary intersubjective extension of Savage's intrasubjective coherence.

  ***

  **References for Chapter**
  *   Aumann, R. J. (1987). Correlated Equilibrium as an Expression of Bayesian Rationality. *Econometrica*.
  *   Gul, F. (1998). A Critique of the Rationalist Approach to Game Theory. *Journal of Economic Perspectives*.
  *   Harsanyi, J. C. (1967-68). Games with Incomplete Information Played by "Bayesian" Players. *Management Science*.
  *   Savage, L. J. (1954). *The Foundations of Statistics*. Wiley.
  *   Binmore, K. (2009). *Rational Decisions*. Princeton University Press. (For discussion on Small Worlds).
  *   Brandenburger, A. (2007). The Power of Paradox: Some Recent Developments in Interactive Epistemology. *International Journal of Game Theory*.
