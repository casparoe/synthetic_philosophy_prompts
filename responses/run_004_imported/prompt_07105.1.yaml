  *Move 3 (Marcus):* Ownership. He shifts from cause to responsibility.
  *Move 4 (Dana):* Blame vs. Cause. She nails the distinction.
  *Blind Spots:* The "Why", the definition of Root Cause, Actionability, Priya's absence.

