answer: |-
  You are right to feel that Buchak's reply smells like question-begging. In the literature, this is often framed as the dispute between **Sophistication** (Buchak) and **Resoluteness** (Briggs/McClennen).

  Buchak's move is to define the "available options" at $t_1$ *conditional* on what the agent's future self *will* choose according to the REU rule. Briggs's counter is that the set of available options should be defined by the **physical/structural structure of the choice situation**, not by the agent's specific decision rule.

  Here is the strongest argument for Briggs's side, structured to help you push back in seminar. It focuses on the **Autonomy of the Choice Set**, the **Normative Priority of Dominance**, and the **Capacity for Resolution**.

  ### 1. The "Can" vs. "Will" Distinction (The Autonomy of the Choice Set)

  The core of Briggs's objection is that Buchak conflates **feasibility** with **predictability**.

  *   **Buchak's View:** At $t_1$, the option "Take Deal + Choose $L_1$" is *not available* because, given Rhoda's preferences and the REU rule, she *will not* choose $L_1$ at $t_2$. Therefore, from the perspective of $t_1$, the future choice is a fixed state of the world, not a variable under her control.
  *   **Briggs's View:** Availability is about **capacity**, not prediction. At $t_1$, Rhoda has the physical and cognitive capacity to press "Accept." At $t_2$, she will have the physical and cognitive capacity to press "Choose $L_1$."

  **The Argument:**
  If a strategy is composed of a sequence of actions $(A_1, A_2, ... A_n)$, and the agent has the capacity to perform $A_1$ at $t_1$, and will have the capacity to perform $A_2$ at $t_2$, then the strategy $(A_1, A_2)$ is available at $t_1$.

  By defining availability based on what the agent *will* do, Buchak allows the decision rule to **shrink the choice set** to protect itself from counterexamples. This is circular. A normative theory is supposed to tell you which option to pick *from the set of available options*. If the theory gets to define the set of available options by ruling out any option the theory wouldn't pick, it insulates itself from criticism regarding dominance violations.

  **Seminar Point:** "Buchak treats Rhoda's future rationality as an external constraint, like a law of physics. But Rhoda's future choices are exercises of her own agency. If she *can* physically choose $L_1$ at $t_2$, that option should be on the menu at $t_1$, even if her future preferences make it unlikely she'll pick it."

  ### 2. The Normative Priority of Dominance

  Briggs argues that **Dominance** is a more fundamental requirement of instrumental rationality than **Dynamic Consistency**.

  *   **The Scenario:**
      *   **Option X (Reject Deal):** Outcome is $L_1$.
      *   **Option Y (Take Deal + Choose $L_1$):** Outcome is $L_1$ + Sweetener.
  *   **The Comparison:** In every state of the world, Option Y yields a strictly better outcome than Option X (because of the sweetener).
  *   **The Violation:** Sophisticated Rhoda chooses X. She leaves free utility on the table.

  **The Argument:**
  Instrumental rationality is about taking the means to your ends. If Rhoda's ex-ante end is to maximize REU, and she prefers $L_1$ to $L_2$, then her ex-ante end is best served by securing $L_1$ + Sweetener.

  By refusing the deal, she is effectively paying a cost (forgoing the sweetener) to accommodate a predicted failure of will (her future self's switch). While accommodating a predicted failure of will might be *prudent* for a weak-willed agent, it shouldn't be the definition of *rationality*.

  If a decision theory implies that it is rational to reject a strictly dominant strategy because you don't trust your future self to follow the plan, the theory is prioritizing **psychological consistency** over **outcome optimality**. Briggs argues that rationality should demand you find a way to secure the dominant outcome (e.g., via resolution), rather than capitulating to the inconsistency.

  **Seminar Point:** "If I can get $100 or $100 + $10, and I choose the former because I predict I'll be tempted to swap for $50 later, I have failed instrumentally. I should have just taken the $110 and resisted the temptation. REU + Sophistication codifies the failure to resist temptation as 'rational'."

  ### 3. Resoluteness as a Rational Stance

  Buchak argues that Sophistication is the only rational response to time-inconsistency. Briggs argues that **Resoluteness** is also a rational stance, and REU rules it out arbitrarily.

  *   **Sophistication:** "I know my future self will deviate from this plan, so I won't make the plan."
  *   **Resoluteness:** "I know my future self might want to deviate, but I commit now to sticking to the plan that serves my ex-ante preferences."

  **The Argument:**
  Why is Resoluteness irrational? In the REU framework, preferences change as information arrives (because the risk function weights the new probabilities differently). However, the **agent** remains the same.

  If Rhoda adopts a **Resolute** choice rule, she treats her ex-ante REU calculation as binding on her future self. She takes the deal at $t_1$, and at $t_2$, she chooses $L_1$ *not* because it maximizes REU at $t_2$, but because it fulfills the plan adopted at $t_1$.

  Buchak rejects Resoluteness because it requires the agent to ignore their current preferences at $t_2$. But Briggs counters: **Why should the $t_2$ preferences trump the $t_1$ preferences?**
  *   At $t_1$, Rhoda has a global view of the risk.
  *   At $t_2$, Rhoda has a local view.
  *   If the global view aligns with the dominant strategy, the agent should be permitted to bind their local self to the global plan.

  By ruling out Resoluteness by fiat (by defining the agent as a sequence of time-slices rather than a persisting entity), Buchak stacks the deck against strategies that would avoid the dominance violation.

  **Seminar Point:** "Buchak assumes the agent is just a collection of time-slices. But if the agent is a persisting entity, they have the authority to bind their future slices to a plan. Denying this authority is what forces the dominance violation, not the REU preferences themselves."

  ### 4. The "Individually Choosable" Criterion

  To directly address your prompt's specific angle: **A strategy counts as available as long as each step is individually choosable.**

  Imagine the choice structure as a video game.
  1.  **Level 1:** Press "Accept" or "Reject".
  2.  **Level 2:** Press "Left" ($L_1$) or "Right" ($L_2^+$).

  Briggs argues that the **Strategy Space** is the set of all complete paths through the game tree:
  1.  Reject
  2.  Accept $\rightarrow$ Left
  3.  Accept $\rightarrow$ Right

  Rhoda *can* physically execute path #2. The game engine allows it. The fact that Rhoda's internal algorithm (REU) predicts she will press "Right" in Level 2 does not remove "Left" from the controller's buttons.

  If we define "Available Strategies" as "Strategies the agent's algorithm *will* output," then **no agent can ever violate dynamic consistency**, because their choices will always match their algorithm. This makes Dynamic Consistency a tautology rather than a normative constraint.

  For Dynamic Consistency (and Dominance) to be meaningful constraints, the set of strategies must be defined **independently** of the decision rule. If the strategy "Accept $\rightarrow$ Left" is in the independent set, and it dominates "Reject," choosing "Reject" is irrational.

  ### Summary for Seminar

  If you want to press Briggs's side, here is the punchline:

  > "Buchak's defense relies on shrinking the choice set to match the agent's predicted choices. But normative decision theory is supposed to evaluate choices, not predict them. If a strategy is physically executable at every node, it is available. If an agent rejects a strictly dominant available strategy because they lack the resolve to stick to a plan, the fault lies with the theory's inability to account for **resolution**, not with the availability of the strategy. REU + Sophistication effectively tells us it is rational to pay a premium (the sweetener) to avoid testing our own willpower. That isn't rationality; that's rationalized weakness."

  This frames the issue not just as a technicality about "availability," but as a fundamental clash between **Dynamic Consistency** (Buchak) and **Instrumental Dominance** (Briggs). Briggs wins if you can convince the room that leaving free money on the table is a bigger sin than changing your mind.
