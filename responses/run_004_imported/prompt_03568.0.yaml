      *   *The "Precommitment" Analogy:* If Rhoda could precommit (Ulysses contract), she would take the deal and stick to $L_1$. The fact that she *can't* precommit is a psychological limitation, not a structural one. Rationality shouldn't be held hostage to contingent psychological weaknesses (akrasia/time-inconsistency).
      *   *Money Pump/Dominance:* If you prefer $A$ to $B$, but you choose a path that leads to $C$ when you could have chosen a path leading to $A + \$\epsilon$, you are violating a basic norm of instrumental rationality (don't leave money on the table).
      *   *The Definition of "Option":* In decision theory, an "option" is usually a mapping from states to outcomes. A dynamic strategy is just a complex option. If the physical world allows the sequence, the option exists.
      *   *Resoluteness:* Why *shouldn't* Rhoda be resolute? If REU is the correct normative theory, why does it forbid resolving to stick to a plan? Buchak says sophistication is the rational response to time-inconsistency. Briggs says resoluteness is the rational response to preserve dominance.

