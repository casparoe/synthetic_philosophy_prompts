      *   **Point 2: The Normative Force of Dominance.** Dominance is a bedrock principle. If Strategy S1 yields outcome O1 and Strategy S2 yields O2, and O2 is strictly better than O1 in all states, and both are physically possible, choosing S1 is irrational. REU + Sophistication forces a violation of this.
      *   **Point 3: The "Psychological Constraint" Objection.** Buchak treats future preferences as constraints like laws of physics. But future preferences are part of the agent's agency. A rational agent should be able to govern their future actions (Resoluteness).
