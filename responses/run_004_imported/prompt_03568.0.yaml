  2.  **Deconstruct the Core Dispute:**
      *   **Availability of Strategies:** What does it mean for a strategy to be "available"?
          *   *Buchak (Sophistication):* A strategy is available only if the agent *would* choose it given their future preferences. It's about *feasibility* given psychological constraints.
          *   *Briggs (Resoluteness/Strategy-as-Object):* A strategy is available if the agent *could* physically/structurally perform the actions, regardless of future motivational shifts. It's about *opportunity*.
      *   **Dynamic Consistency vs. Dominance:** REU violates dynamic consistency (Separability). Briggs argues this leads to dominance violations (choosing an option strictly worse than another available option).
      *   **The "Question-Begging" Charge:** Buchak defines availability in terms of what the sophisticated agent *does* choose, which rules out the dominating strategy by definition. Briggs argues availability should be defined independently of the agent's specific decision rule.

  3.  **Brainstorming Briggs's Strongest Argument:**
