          *   **Ontology:** Jains are realists (substance exists). Madhyamaka are anti-essentialists (no *svabhāva*).
          *   **The Operator:** Jainism uses *syāt* (maybe/in some respect) as a prefix to *validate* statements. Nāgārjuna often negates the statements entirely to show emptiness.

