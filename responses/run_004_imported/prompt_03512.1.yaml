      *   *Jains (Anekāntavāda):* Key concept is *anekāntavāda* (many-sidedness). *Syādvāda* (theory of conditioned predication). *Saptabhaṅgī* (seven modes of predication). Uses the qualifier *syāt* ("in some respect"). Affirms multiple perspectives as valid relative to their standpoint. Goal: Epistemological humility and avoiding dogmatism (*ekānta*).
