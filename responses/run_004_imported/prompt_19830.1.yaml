answer: |-
  This is arguably the single most famous and important distinction in *Naming and Necessity*, so first off: **your intuition is excellent, and your TA should not have brushed this off.**

  You have hit on exactly the point where Kripke breaks with the Kantian/Logical Positivist tradition. The tradition you are relying on (that *a priori* = *necessary* and *a posteriori* = *contingent*) is precisely what Kripke is trying to dismantle.

  Here is the standard move you are missing. It comes down to distinguishing **how we know something** (Epistemic) from **how the world is** (Metaphysical), and understanding the difference between **fixing a reference** and **giving a meaning**.

  ### 1. The Traditional Equation (What you are thinking)
  Before Kripke, the standard view (inherited from Kant and the Logical Positivists) was:
  *   **A Priori:** Known independently of experience (e.g., via definition).
  *   **Necessary:** True in all possible worlds.
  *   **The Assumption:** If a statement is true by definition/stipulation (*a priori*), it *must* be necessary. If it's contingent, it *must* be empirical (*a posteriori*).

  You are thinking: *"If we stipulated that 'one meter' means 'the length of S', then 'S is one meter long' is true by definition. Therefore, it's analytic. Therefore, it's necessary."*

  ### 2. Kripke's Move: Decoupling the Categories
  Kripke argues that the Epistemic status (*a priori*/*a posteriori*) and the Metaphysical status (*necessary*/*contingent*) are **orthogonal**. They cut across each other. This gives us four categories, not two:
  1.  *A Priori* & Necessary (e.g., "All bachelors are unmarried")
  2.  *A Posteriori* & Contingent (e.g., "Reagan was president")
  3.  ** *A Priori* & Contingent (The Meter Stick!) **
  4.  *A Posteriori* & Necessary (e.g., "Hesperus is Phosphorus")

  ### 3. Reference Fixing vs. Synonymy
  This is the technical mechanism that makes the Meter Stick case work.

  **The Frege/Russell View (Descriptivism):**
  When we introduce the term "one meter," we are giving it a *sense* (meaning). "One meter" is *synonymous* with "the length of stick S."
  *   If this were true, you would be right. If they mean the exact same thing, then in any world where S exists, S must be the length of S. It would be necessary.

  **The Kripke View (Rigid Designation):**
  Kripke argues that we are not giving the *meaning* of "one meter"; we are merely **fixing its reference**.
  *   "One meter" is a **rigid designator**. It picks out a specific length $L$ in the actual world and picks out *that same length* in every possible world.
  *   "The length of stick S" is a **non-rigid designator**. It picks out whatever length S happens to have in a given world.

  **The Stipulation:**
  When the scientists in Paris said, "Let 'one meter' refer to the length of S at $t_0$," they were pointing at the actual world and saying, "Take *this* length (let's call it $L_{actual}$). From now on, the word 'meter' refers to $L_{actual}$."

  ### 4. The Possible Worlds Test
  To see why it is contingent, we have to look at a counterfactual world, which is how Kripke defines necessity.

  *   **Actual World ($W_1$):** Stick S is heated to 50 degrees. Its length is $L_{actual}$.
      *   We stipulated "meter" = $L_{actual}$.
      *   Statement: "S is one meter long."
      *   Truth Value: **True.** (We know this *a priori* because we made the stipulation).

  *   **Counterfactual World ($W_2$):** Imagine a world where Stick S was heated to 100 degrees at $t_0$.
      *   In this world, Stick S expands. Its length is now $L_{expanded}$.
      *   **Crucial Question:** What does "one meter" refer to in $W_2$?
      *   **Kripke's Answer:** "One meter" is rigid. It still refers to $L_{actual}$ (the length S had in the *Actual World*), not the length S has in $W_2$.
      *   Statement: "S is one meter long."
      *   Translation: "S has length $L_{actual}$."
      *   Truth Value: **False.** (Because in $W_2$, S has length $L_{expanded}$).

  Because there is a possible world where the statement is false, the statement is **contingent**.

  ### 5. Why it feels like a contradiction
  You wrote: *"if a sentence is true purely because of how a term got defined/stipulated, isnt that just the standard case of a necessary truth?"*

  Kripke's reply is: **No, because the stipulation only anchors the word in the actual world.**

  Think of it like naming a person.
  *   I point to a man and say, "Let's call that man 'Jack'."
  *   I now know *a priori* that "Jack is the man I am pointing at."
  *   But is it *necessary* that Jack is the man I am pointing at? No. In a different possible world, I might be pointing at a woman, or Jack might be standing somewhere else.
  *   The act of naming (stipulation) gives me immediate knowledge (*a priori*), but it doesn't change the metaphysical facts about the object named (contingency).

  ### Summary for your Study Group
  1.  **Don't conflate Epistemic and Metaphysical:** *A priori* is about how we justify the belief (stipulation vs. measurement). Necessity is about truth across possible worlds.
  2.  **Reference $\neq$ Meaning:** The description ("length of S") fixes the reference of the name ("meter"), but it does not become synonymous with it.
  3.  **Rigidity:** "One meter" stays locked to the *actual* length of S, even in worlds where S is a different length.

  This is the "standard move," but it is subtle. It requires accepting Kripke's modal logic framework (possible worlds) and his rejection of Fregean senses. If your class is still thinking in Frege/Russell terms (where names are disguised descriptions), Kripke *will* look like he is contradicting himself. He isn't; he's changing the rules of the game to show that names aren't descriptions.

  If you want to ace this on the exam, memorize the phrase: **"Fixing the reference is not giving the meaning."** That is the key that unlocks the Meter Stick puzzle.
