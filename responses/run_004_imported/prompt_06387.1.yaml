      *   **Interests vs. Truth:** Political attitudes aren't just about "truth" (like the moon landing); they're about *values* and *interests*. The uncle's argument is about *interests* ("more to lose").
      *   **The Normative Gap:** Even if the aging effect is real, does "having more to lose" make redistribution *wrong*? Or does it just make it *personally costly*?
      *   **Conclusion:** The uncle is trading on a distinction he hasn't earned. He conflates "I will want X" with "X is right."

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the frustration. It's a deep philosophical problem disguised as a dinner table annoyance.
      *   *The Epistemic Principle:* Discuss the "Reflection Principle." You should generally align with your future self *if* you expect your future self to be better informed and equally rational.
      *   *The Mechanism Test:* This is the key. Why does the belief change?
          *   Moon Landing: Cognitive decay (bad mechanism).
