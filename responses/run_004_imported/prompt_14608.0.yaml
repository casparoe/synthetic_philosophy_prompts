  **Imprecise:** You state Berkeley reaches this verdict for "essentially the same reason" and that both hold the ideas "have nothing in common." This is a common simplification but slightly mistaken. Locke believes visual and tactile ideas of shape refer to the *same* primary quality in the object, even if the ideas themselves are distinct. Berkeley is more radical: he argues that "visible shape" and "tangible shape" are entirely heterogeneous objects of perception that do not even represent the same thing (they are related like words to meanings, not copies to objects). While your answer captures the "heterogeneity" keyword, the comparison overlooks Berkeley's stricter separation of the objects of sight and touch compared to Locke.

