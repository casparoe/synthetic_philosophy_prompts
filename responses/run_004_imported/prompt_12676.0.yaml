      *   *Premise 2:* Human needs are of two kinds: Absolute (biological/comfort) and Relative (superiority/status).
      *   *Premise 3:* Absolute needs are satiable. Relative needs are insatiable.
      *   *Premise 4:* The "Economic Problem" (scarcity) is temporary. Once solved, the focus shifts to "the art of life."
      *   *Premise 5:* Current virtues (moneymaking, thrift) are "purposeless" in the long run and will become vices.
      *   *Prediction:* 15-hour week within 100 years.

