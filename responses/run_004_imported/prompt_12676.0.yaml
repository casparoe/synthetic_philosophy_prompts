      *   **Core Question:** Using Keynes's *own* conceptual apparatus (not the standard Piketty-style capital/labor share argument), how would he account for the gap between his forecast (15-hour week, end of scarcity) and reality (persistent overwork, status anxiety, AI anxiety)? Would he revise his apparatus or restate it?
      *   **Key Concepts to Engage:** Absolute vs. Relative Needs, Technological Unemployment, The Economic Problem, Psychological/Moral Shift (Avarice as Virtue vs. Vice).

