      *   **Analyze the Dutch Book (Beliefs):**
          *   Nature: Synchronic (at one time).
          *   Mechanism: Logical inconsistency in betting quotients.
          *   Escape: None. If you accept the bets, you lose. It's a static logical contradiction mapped to money.
          *   Strength: Very strong mathematically (de Finetti's theorem).
      *   **Analyze the Money Pump (Preferences):**
