      *   *The Compliance Lead's View (Numerical Identity/Contextual):* The *event* of upload, the *provenance*, and the *legal context* make them distinct entities, even if the payload is identical. $Record(A) \neq Record(B)$ even if $Blob(A) = Blob(B)$.
      *   *The Black Sphere Analogy:*
          *   Spheres = The File Blobs? Or The Document Records?
          *   If Spheres = Blobs: They are qualitatively identical. Black argues they can still be numerically distinct.
