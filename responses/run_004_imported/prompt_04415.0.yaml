      *   **Key Figures/Arguments:** Norsen and Maudlin argue "Realism" is redundant (derived from Locality + Perfect Correlations). Others treat "Realism" (hidden variables/counterfactual definiteness) as an independent assumption.
      *   **Format:** Short dialogue between two physicists over coffee after a seminar.
