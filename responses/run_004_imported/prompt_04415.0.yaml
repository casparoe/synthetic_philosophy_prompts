answer: |-
  **Setting:** *The faculty lounge, 4:30 PM. The remains of a seminar on quantum foundations are scattered on a whiteboard. Two mugs of lukewarm coffee sit on the table.*

  **Characters:**
  *   **Elena:** Condensed-matter theorist, leans toward operationalist/Copenhagen interpretations.
  *   **Marcus:** Retired experimentalist, recently deep-dived into foundations, sympathetic to the Maudlin/Norsen critique.

  ***

  **Marcus:** (Stirring his coffee) Did you catch that third slide? The one with the Venn diagram? "Locality, Realism, Freedom." The speaker presented Bell's theorem as a trilemma. Pick any two.

  **Elena:** Standard fare. It's the polite way to teach it. You tell the students they don't have to accept non-locality if they're willing to give up the idea that particles have definite properties before measurement.

  **Marcus:** That's exactly what bugs me. It's not polite; it's misleading. Norsen and Maudlin have been screaming about this for years. "Realism" isn't an independent assumption you can toss to save Locality. It's a *consequence* of Locality, given the EPR correlations.

  **Elena:** Come on, Marcus. "Realism" in this context means Counterfactual Definiteness. The idea that there is a fact of the matter about what the spin *would have been* had I measured along the $x$-axis instead of the $z$-axis. Bell's inequality requires summing over those counterfactuals. I can just say those counterfactuals don't exist. The property is created by the measurement. Locality remains intact because no signal travels.

  **Marcus:** But *why* do you say the property is created by the measurement? In the EPR setup, if Alice measures $z$-spin up, she knows with certainty that Bob has $z$-spin down. She didn't touch Bob's particle. If you insist on Locality—meaning Alice's action doesn't physically disturb Bob's particle—then Bob's particle *must have had* that value before Alice measured.

  **Elena:** That's the EPR argument, sure. But EPR concluded QM was incomplete. Bell showed that completing it with hidden variables leads to contradictions. So we drop the hidden variables. We accept QM is complete.

  **Marcus:** Here's the rub. If you drop the hidden variables—the "Realism"—you are implicitly admitting that Alice's measurement *did* determine Bob's outcome. Because the correlation is perfect. If Bob's particle didn't have a definite value beforehand, and Alice's measurement yields a definite result for Bob instantly, then Alice's measurement acted on Bob's particle. That's non-locality.

  **Elena:** But there's no signaling! I can't use it to send a bit.

  **Marcus:** (Leans forward) Bell Locality isn't Signal Locality. Bell Locality is about ontological independence. If the probability of an outcome here depends on the setting there, *given the complete state of the past*, you've violated Locality. In QM, even with the wavefunction as the "complete state," the probability of Bob's outcome depends on Alice's setting. You only save "Signal Locality" by averaging over outcomes, which hides the dependency.

  **Elena:** So you're saying "Realism" is redundant?

  **Marcus:** I'm saying it's derived. Look at the logic chain.
  1. Perfect Correlations (Empirical).
  2. Locality (Assumption).
  3. Therefore, Pre-existing Values (Inference).
  4. Pre-existing Values + Locality $\rightarrow$ Bell Inequality.
  5. QM violates Inequality.
  Therefore, Locality is false.
  You can't stop at step 3 and say "I reject Pre-existing Values." If you reject Pre-existing Values while keeping Perfect Correlations, you *already* rejected Locality in step 2. You can't use the rejection of step 3 to save step 2.

  **Elena:** I think you're conflating "Realism" with "Determinism." Bell didn't assume determinism. He assumed Local Causality.

  **Marcus:** Exactly! He assumed Local Causality. And Local Causality, applied to perfect correlations, *implies* determinism for those observables. That's the EPR step. So when textbooks say "Give up Realism to save Locality," they are asking you to give up the *consequence* of Locality to save the *premise*. It's logically incoherent. The only way to keep Locality is to deny the perfect correlations (deny QM/experiment) or deny Free Choice (Superdeterminism).

  **Elena:** Okay, but let's play devil's advocate. What if "Realism" isn't about hidden variables, but about the uniqueness of outcomes? Or the idea that measurement reveals rather than creates? If I adopt a QBist view, the wavefunction is just my catalog of expectations. Alice's update doesn't change Bob's physical state; it changes *her* information about Bob.

  **Marcus:** (Sighs) The epistemic dodge. If the wavefunction is just information, what is the physical state? If there is no physical state determining the outcome, and the outcomes are perfectly correlated across spacelike separation, then the *generation* of the outcome at A is correlated with the *generation* of the outcome at B without a common cause in the past. That's non-locality by any ontological definition. You've just swept the ontology under the rug of "information."

  **Elena:** But physics is about predictions, not ontology. If I can't signal, the theory is locally causal in every operational sense that matters for relativity. Why force a non-local ontology on us if the formalism respects Lorentz invariance?

  **Marcus:** Because Bell proved the formalism *doesn't* respect Bell Locality, which is the condition required to make sense of relativistic causality in a stochastic world. If you say "Realism is the thing to drop," you let students think Bohmian mechanics is the only non-local game in town. It's not. *Standard QM* is non-local. The collapse is non-local. The only difference is Bohmians admit it.

  **Elena:** So your "Dilemma" is: Locality or Freedom?

  **Marcus:** Precisely. If you keep Freedom (no superdeterminism), and you accept the experimental data (violations of Bell inequalities), you must drop Locality. "Realism" was never a free variable. It was hostage to Locality.

  **Elena:** (Takes a sip of cold coffee) It feels like you're defining Locality so strictly that nothing could ever satisfy it except a classical field theory.

  **Marcus:** I'm defining it the way Bell did. "The direct causes (and effects) of events are near by, and even their indirect causes (and effects) are no further away than permitted by the velocity of light." If Alice's setting is a cause of Bob's outcome, and they are spacelike separated, that's it. Game over.

  **Elena:** And the Superdeterminism loophole? The "Freedom" option?

  **Marcus:** That's the actual third leg. You can save Locality if you assume the measurement settings weren't free choices, but correlated with the particle source in the past. But that requires a conspiracy of initial conditions that most of us find physically implausible.

  **Elena:** So, the trilemma is really: Non-locality, Superdeterminism, or... denying the data?

  **Marcus:** Or denying the logic that leads from Locality to Hidden Variables. But that logic is just elementary probability theory applied to perfect correlations.

  **Elena:** (Smiles) You know, for forty years I calculated band gaps and never worried about whether the electron was "really" there. Now I retire, and you tell me I have to accept action-at-a-distance to make sense of the spin I ignored.

  **Marcus:** (Grins) Better late than never. The universe is weird. The textbooks just try to make it polite.

  **Elena:** Well. Another coffee? If I'm going to accept non-locality, I need the caffeine.

  **Marcus:** Only if you promise not to call it "Realism" anymore.

  **Elena:** Deal.
