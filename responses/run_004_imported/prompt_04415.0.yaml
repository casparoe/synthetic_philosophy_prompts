          *   If Alice measures spin up, she knows Bob has spin down *without disturbing him*.
          *   If Locality holds, Bob's particle *must have had* that value already.
          *   Therefore, Locality $\implies$ Hidden Variables (Realism).
          *   Bell shows Locality + HV $\implies$ Contradiction with QM.
          *   Since Locality $\implies$ HV, you can't save Locality by dropping HV. You have to drop Locality.
      *   **Elena's Counter (The Trilemma position):**
          *   Disagrees with the definition of "Realism."
          *   "Realism" isn't just "stuff exists." It's "unmeasured observables have definite values."
          *   We can reject *that* specific claim without rejecting Locality (no signaling).
          *   QM is local in the sense of no superluminal signaling, just non-realist.
      *   **Marcus's Rebuttal:**
          *   "No signaling" isn't "Locality" in the Bell sense (Bell Locality vs. Signal Locality).
          *   If you deny the pre-existing value, you admit the measurement here *determines* the outcome there (ontologically), which is non-local.
          *   Cites Maudlin: "The only assumption going into Bell is Locality."
      *   **Elena's Rebuttal:**
          *   But operationalists don't care about ontology.
