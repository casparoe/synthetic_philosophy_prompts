prompt: |-
  This has been bugging me for a while and I want an actual compare/contrast, not just vibes. Good's theorem says a Bayesian about to act should never refuse free evidence - expected value of information is always >=0, hitting exactly 0 only when the evidence wouldn't change what you'd do anyway. But in info econ there's the Hirshleifer effect: public information can make an entire economy worse off, since it destroys risk-sharing/insurance deals that only worked because nobody knew yet who was gonna draw the short straw. Rationalist blogs cite "VoI is always non-negative" like its basically a law of rationality, but nobody ever reconciles that with Hirshleifer. So compare the two properly: are they actually in tension, or does Hirshleifer sneak in a different notion of "value" (social vs individual, pre- vs post-contract) such that Good's theorem was never making a claim Hirshleifer could contradict? Pin down exactly where "more info, weakly better" stops holding once other agents and existing contracts enter the picture, and tell me straight whether that fully dissolves the paradox or leaves something genuinely surprising behind.
reasoning: |-
  Here's a thinking process that leads to the comparison and resolution of Good's Theorem vs. the Hirshleifer Effect:

  1.  **Deconstruct the User's Query:**
      *   **Core Conflict:** Good's Theorem (Value of Information [VoI] is always non-negative for a Bayesian decision maker) vs. Hirshleifer Effect (Public information can reduce social welfare/destroy risk-sharing).
      *   **User's Frustration:** Rationalist circles cite Good's Theorem as a universal law, but ignore Hirshleifer. The user wants a rigorous compare/contrast, not just "vibes."
      *   **Specific Questions:**
          *   Are they actually in tension?
          *   Does Hirshleifer use a different notion of "value" (social vs. individual, pre- vs. post-contract)?
          *   Where does "more info = weakly better" break down with other agents/contracts?
          *   Does this dissolve the paradox or leave something surprising?

  2.  **Analyze Good's Theorem:**
      *   **Context:** Single agent decision theory.
      *   **Setup:** Agent has prior $P$, utility function $U$, action space $A$. Agent can observe evidence $E$ before choosing $a \in A$.
      *   **Claim:** $E[U(a^*|E)] \ge U(a^*_{prior})$. The expected utility of acting *after* seeing evidence is at least as high as acting *before*.
      *   **Key Assumption:** The information is *free* (costless) and the agent controls the action based on the information. Crucially, the information does not change the *structure* of the world or the payoffs, only the agent's belief state. The "state of the world" is fixed; the agent just learns more about it.
      *   **Scope:** Individual rationality, ex-post decision making.

  3.  **Analyze the Hirshleifer Effect:**
      *   **Context:** General Equilibrium / Information Economics (Multi-agent).
      *   **Setup:** Agents want to trade/insure against risk *before* uncertainty is resolved.
      *   **Mechanism:** If uncertainty is resolved *before* trade (via public information), the basis for insurance vanishes. (e.g., If we know who will get sick before buying insurance, no insurance market exists).
      *   **Claim:** Public information released *before* markets open can reduce expected utility for all agents compared to the state where information remains hidden until *after* trade.
      *   **Key Assumption:** Information changes the *trading opportunities* available. It changes the feasible set of allocations.
      *   **Scope:** Social welfare, ex-ante contracting, market completeness.

  4.  **Identify the Tension (or Lack Thereof):**
      *   *Surface Level:* Good says "Info is good." Hirshleifer says "Info can be bad." -> Contradiction?
      *   *Deep Level:* Good assumes the action set is fixed. Hirshleifer shows information changes the action set (specifically, the set of feasible trades/contracts).
      *   *Timing:* Good is about acting *after* info. Hirshleifer is about the value of info *before* contracting vs. *after* contracting.
      *   *Agency:* Good is single-agent. Hirshleifer is multi-agent (game theoretic/market equilibrium).

  5.  **Drafting the Comparison (Iterative Process):**

      *   *Point 1: The Definition of "Value".*
          *   Good: Individual Expected Utility (Ex-ante expectation of Ex-post utility).
          *   Hirshleifer: Ex-ante Social Welfare (Pareto efficiency of risk-sharing).
          *   *Resolution:* They measure different things. But is it just semantics? No, because individuals in Hirshleifer are also worse off ex-ante.

      *   *Point 2: The Timing of Information vs. Action.*
          *   Good: Info -> Action. (Information allows better mapping of State -> Action).
          *   Hirshleifer: Info -> Market Opening -> Trade. (Information restricts the State -> Trade mapping).
          *   *Crucial Distinction:* In Good's framework, you can always ignore the info and do the prior optimal action. In Hirshleifer's framework, the *market* ignores you. The availability of the insurance contract itself depends on the information state. You *cannot* choose the "no-info" contract if the info is public.

      *   *Point 3: The "Fixed World" Assumption.*
          *   Good assumes the payoff matrix is static.
          *   Hirshleifer assumes the payoff matrix (or feasible set) is endogenous to the information structure. Other agents react to the info. If I know you are sick, I won't insure you. Your "action" (buying insurance) is no longer feasible.

      *   *Point 4: Ex-Ante vs. Ex-Interim.*
          *   Good's theorem holds Ex-Interim (before seeing the specific signal, but knowing you will see it).
          *   Hirshleifer compares two Ex-Ante states: (1) Info will be released before trade vs. (2) Info will be released after trade.
          *   Wait, Good's theorem says having the option to see info is better than not having the option. Hirshleifer says having the info *released publicly* is worse than keeping it private.
          *   *Refinement:* In Hirshleifer, the agents *cannot commit* to not look at the info if it's public. But the real issue is that the *contracting space* shrinks.

  6.  **Synthesizing the Resolution:**
      *   Good's Theorem applies to **decision problems**.
      *   Hirshleifer applies to **strategic/market environments**.
      *   The breakdown happens because information is not just a input to *my* utility function; it is an input to *everyone else's* strategy, which determines *my* feasible set.
      *   Information has **externality**. Good's theorem assumes no externalities.
      *   Information changes the **game**, not just the belief state.

  7.  **Addressing the "Surprising" Aspect:**
      *   Is it fully dissolved? Yes, technically. The assumptions differ.
      *   Is there something surprising left? Yes. It implies that rational agents, acting individually to maximize VoI, might collectively build a world where they are all poorer. It highlights the difference between *private* value of information (always positive) and *social* value of information (can be negative).
      *   Also, the distinction between "information as a tool for action" vs. "information as a determinant of endowments/prices."

  8.  **Structuring the Answer:**
      *   **Executive Summary:** Direct answer (No contradiction, different domains).
      *   **Good's Theorem Deep Dive:** Assumptions (Single agent, fixed action set, info only updates beliefs).
      *   **Hirshleifer Effect Deep Dive:** Assumptions (Multi-agent, endogenous action set, info changes feasible trades).
      *   **The Three Fault Lines:**
          1.  Feasible Set (Fixed vs. Endogenous).
          2.  Externalities (None vs. Strategic).
          3.  Timing (Ex-Interim vs. Ex-Ante Commitment).
      *   **The "Dissolution":** Why Good doesn't apply to Hirshleifer. (You can't "ignore" the info if it changes the market price/availability).
      *   **The "Surprise":** What remains non-trivial (The tragedy of the commons of information).

  9.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Does Good's theorem hold for multi-agent games?
      *   *Correction:* In game theory, information can be harmful (e.g., knowing the opponent's move might force you into a worse equilibrium, or simply knowing more can hurt in bargaining). But Good's theorem specifically refers to a *decision problem* against nature.
      *   *Check:* Is Hirshleifer about public info specifically?
      *   *Correction:* Yes, public info destroys risk sharing. Private info creates adverse selection (Akerlof), which is slightly different but related. Stick to Hirshleifer (public info).
      *   *Key Insight:* In Good's theorem, the option to *not use* the info is implicitly available (you can act as if you didn't see it). In Hirshleifer, the market prices *reflect* the info whether you want them to or not. You cannot opt out of the price signal.

  10. **Final Polish:** Ensure tone is rigorous, acknowledges the user's frustration, and delivers the "pin down" requested. (Avoid hand-waving). Use terms like "Feasible Set," "Externality," "Ex-Ante/Ex-Interim."

  **(Self-Correction during drafting):** Make sure to emphasize that in Hirshleifer, the agents are *Bayesian* too. They aren't irrational. It's not a bias. It's a structural constraint.

  11. **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is the rigorous compare/contrast you are looking for.

  The short answer is: **There is no logical contradiction.** Good's Theorem and the Hirshleifer Effect operate in disjoint mathematical domains. Good's Theorem assumes a **fixed feasible set of actions**, whereas the Hirshleifer Effect arises precisely because information **changes the feasible set of actions** available to agents via market equilibrium.

  However, the tension is not merely semantic. It reveals a genuinely surprising structural fact about rationality: **Information has negative externalities.** What is locally optimal for a single Bayesian agent (acquire info) can be globally destructive when that info alters the strategic landscape for others.

  Here is the pin-down of where "more info = weakly better" breaks, and why the paradox dissolves.

  ---

  ### 1. The Domain Mismatch: Decision Theory vs. General Equilibrium

  To see why they don't contradict, we must formalize the assumptions of each.

  #### Good's Theorem (1967)
  *   **Context:** Single-agent Decision Theory against Nature.
  *   **Setup:** An agent has a utility function $U(a, \omega)$ over actions $a \in A$ and states of the world $\omega \in \Omega$.
  *   **The Move:** The agent chooses between acting immediately or observing a signal $s$ (drawn from $P(s|\omega)$) and *then* acting.
  *   **The Proof:** Let $a^*$ be the optimal action without info. Let $a^*(s)$ be the optimal action after seeing $s$.
      $$E_s[U(a^*(s), \omega)] \geq E_s[U(a^*, \omega)] = U(a^*, \omega)$$
      The inequality holds because for every specific realization $s$, the agent *could* have chosen $a^*$ but is free to choose a better $a^*(s)$.
  *   **Critical Assumption:** The set of available actions $A$ is **fixed** and independent of the signal $s$. The information changes your *belief* about $\omega$, but it does not change the *rules of the game* or the availability of actions.

  #### The Hirshleifer Effect (1971)
  *   **Context:** Multi-agent General Equilibrium / Risk Sharing.
  *   **Setup:** Agents want to trade claims on consumption across different states $\omega$ (insurance) *before* $\omega$ is realized.
  *   **The Move:** Information is released *publicly* before markets open.
  *   **The Mechanism:** If the signal reveals $\omega$ perfectly before trade, the "risk" vanishes. If we know who will get sick, no one will sell them insurance. The market for insurance collapses.
  *   **Critical Assumption:** The set of feasible actions (trades/contracts) is **endogenous** to the information structure. Prices and availability depend on what *everyone* knows.

  ### 2. The Three Fault Lines

  Here is exactly where the "VoI $\geq$ 0" intuition stops holding.

  #### A. The Feasible Set Constraint
  In Good's Theorem, you can always ignore the information. If you receive a signal but decide it's not useful, you can simply take the action you would have taken without the signal. The option remains available.

  In the Hirshleifer effect, **you cannot ignore the information because the market does not.** Even if *you* wish to trade as if you were ignorant (to secure insurance), the counterparty sees the same public information. They will not offer you the insurance contract at the "ignorant" price. The action "buy insurance at pooled rate" is literally removed from your feasible set $A$ by the public information.

  *   **Good:** Info $\to$ Belief Update $\to$ Choice from Fixed $A$.
  *   **Hirshleifer:** Info $\to$ Belief Update $\to$ **Change in $A$** $\to$ Choice.

  Good's theorem proves $E[\max_{a \in A} U] \geq \max_{a \in A} E[U]$. Hirshleifer shows a scenario where Information changes $A$ to $A'$, such that $E[\max_{a \in A'} U] < \max_{a \in A} E[U]$. Good's theorem never claimed immunity to changes in $A$.

  #### B. Strategic Externalities
  Good's Theorem assumes "Nature" is the opponent. Nature does not react to your information. Your learning does not make the storm more severe or the crop fail.

  In Hirshleifer, the "opponent" is other agents. Information is a **public good with negative externalities**. When I acquire (or when public info is released), it updates *your* beliefs, which changes *your* willingness to trade, which hurts *my* welfare.
  *   **Private Value of Info:** Always $\geq 0$ (Good's Theorem holds for the individual *given* the market prices).
  *   **Social Value of Info:** Can be $< 0$ (Hirshleifer).

  If you treat the market prices as fixed (a "price taker" assumption in a partial equilibrium sense), Good's Theorem holds for you. But in General Equilibrium, prices adjust to clear the market based on the information. The price adjustment is the mechanism that destroys the value.

  #### C. Ex-Ante vs. Ex-Interim Timing
  This is the subtlest distinction.
  *   **Good's Theorem** is an **Ex-Interim** claim. It says: "Before you see the specific signal, but knowing you *will* see it, you are better off than if you would never see it."
  *   **Hirshleifer** is an **Ex-Ante** claim comparing two different worlds.
      *   **World 1:** Agents contract *before* information is released. (Info comes after trade).
      *   **World 2:** Information is released *before* agents contract. (Info comes before trade).

  Hirshleifer shows that all agents in World 1 have higher expected utility than in World 2.
  Does this violate Good? No. In World 2, once the info is released, the agents are in a new decision problem. Given that the info *has* been released, they act optimally (satisfying Good). But they would have preferred a commitment device to prevent the release in the first place.

  Good's Theorem says you should never refuse *free* evidence. Hirshleifer shows you should sometimes pay to **prevent evidence from becoming public** before contracts are signed. These are consistent. Refusing evidence (Good) is different than preventing the evidence from existing/becoming public (Hirshleifer).

  ### 3. Does this fully dissolve the paradox?

  **Technically: Yes.**
  The paradox dissolves once you acknowledge that Good's Theorem requires the action space to be invariant to the information. Hirshleifer violates that invariance condition. Therefore, Good's Theorem is simply not applicable to the Hirshleifer setup. It is a category error to apply single-agent decision theory to a general equilibrium problem without adjusting for endogenous constraints.

  **Substantively: No (The "Surprising" Remainder).**
  While the logic is consistent, the implication is genuinely surprising and often overlooked in "rationalist" circles. It challenges the heuristic that "information is inherently power/good."

  1.  **Information as a Destroyer of Value:** We tend to think of information as a tool to manipulate the world (Good). Hirshleifer shows information can be a constraint that prevents the world from being manipulated *collectively*. It highlights that **ignorance can be a productive asset** for risk-sharing.
  2.  **The Commitment Problem:** Rational agents would collectively agree to ban certain types of public information (e.g., genetic testing before health insurance is purchased) to maximize welfare. However, individually, once the tech exists, everyone has an incentive to use it (Good's Theorem kicks in *after* the ban is lifted). This creates a **Prisoner's Dilemma regarding information acquisition**.
  3.  **Price vs. Belief:** In standard rationality, information updates beliefs. In markets, information updates *prices*. When prices update fully, they crowd out the risk-sharing function. The "value" in Hirshleifer isn't just about making the right choice; it's about the existence of the choice itself.

  ### 4. Summary Comparison Table

  | Feature | Good's Theorem | Hirshleifer Effect |
  | :--- | :--- | :--- |
  | **Agents** | Single (vs. Nature) | Multiple (Strategic/Market) |
  | **Action Set ($A$)** | Fixed / Exogenous | Endogenous (depends on Info) |
  | **Externalities** | None | Strong (Prices/Contracts depend on others' info) |
  | **Timing** | Ex-Interim (Value of seeing signal) | Ex-Ante (Value of info regime) |
  | **Mechanism** | Better mapping of State $\to$ Action | Destruction of State $\to$ Trade mapping |
  | **Conclusion** | VoI $\geq$ 0 | Public Info Welfare $\leq$ No Info Welfare |

  ### The Bottom Line

  Good's Theorem is a law of **individual optimization**.
  The Hirshleifer Effect is a law of **social coordination**.

  The tension you feel comes from the rationalist tendency to model the world as a single-agent optimization problem ("How do I maximize my utility?"). Hirshleifer forces you to model the world as a multi-agent constraint satisfaction problem ("What allocations are feasible given what we all know?").

  "More info is weakly better" holds **only so long as the information does not revoke your options.** In information economics, public information frequently revokes options (insurance, speculative gains, bargaining leverage). Once you add that clause, the contradiction vanishes, but the takeaway is darker: **Rational individuals pursuing information can collectively construct a prison where everyone is poorer.** That is the genuine surprise that remains.
