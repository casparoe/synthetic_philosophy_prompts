answer: |-
  This is one of the classic dilemmas of land-use law and civic governance. You are navigating the tension between **liberal neutrality** (the state should not enforce a particular conception of the "good life") and **communitarian self-determination** (a community has the right to shape its own environment).

  As a zoning board member, you are not just a philosopher; you are a quasi-judicial officer. Your decision must withstand legal scrutiny. However, within those legal bounds, there is a principled framework you can use to evaluate "community character" without succumbing to mere majoritarian prejudice.

  Here is a framework for weighing these competing interests.

  ### 1. The Legal Guardrails (The "Musts")
  Before weighing principles, you must acknowledge the legal constraints. In the United States, adult entertainment is considered protected expression under the First Amendment. While it can be regulated, it cannot be banned based on content alone.

  *   **Content Neutrality:** You cannot deny a permit because you dislike the *message* or the *morality* of the business. You can only regulate the *time, place, and manner*.
  *   **The *Renton* Standard:** Based on *City of Renton v. Playtime Theatres, Inc.*, municipalities can regulate adult businesses to mitigate "secondary effects" (crime, property value decline, blight). However, if there is **no evidence** of these secondary effects in your specific case, using them as a pretext for denial opens the town to lawsuits.
  *   **Vagueness:** If your zoning ordinance uses "community character" as a criterion, it must be clearly defined. If it is undefined, using it to deny a permit can be ruled "arbitrary and capricious."

  **Principle:** *Community character cannot be a code word for content discrimination.* If the ordinance does not explicitly define how this specific type of business violates character standards, "character" is likely too subjective to be a legal basis for denial.

  ### 2. Distinguishing "Land Use Character" from "Moral Character"
  To avoid enforcing mere taste, you must distinguish between two types of character arguments:

  **A. Land-Use Compatibility (Valid)**
  This refers to the physical and functional nature of the district.
  *   *Example:* "Downtown is designated as a family-oriented retail corridor with high pedestrian traffic between 4 PM and 8 PM. An adult venue creates a conflict with pedestrian flow and adjacent uses (e.g., a daycare or church)."
  *   *Why it works:* This is about **externalities**. It treats the venue like a noisy bar or a loading dock. It focuses on how the business *operates*, not what it *sells*.

  **B. Moral Compatibility (Invalid/Risky)**
  This refers to the ethical or social values of the residents.
  *   *Example:* "We are a wholesome town, and this business is immoral."
  *   *Why it fails:* This is about **internalities** (feelings, beliefs). In a pluralistic society, zoning is generally not the tool for enforcing moral codes on legal activities. If you deny based on this, you are effectively allowing the majority to veto the rights of a minority business owner.

  **Principle:** *Zoning regulates impacts, not identities.* If the objection is "we don't like what they do," that is moral. If the objection is "what they do changes the foot traffic pattern in a way that conflicts with the Comprehensive Plan," that is land use.

  ### 3. The Burden of Proof regarding "Harm"
  You noted the public offered no concrete evidence of harm. In administrative law, the burden of proof usually lies with those claiming the permit should be denied (or the applicant must prove they meet the criteria).

  *   **Speculation vs. Evidence:** "Crime might go up" is speculation. "Similar venues in comparable towns resulted in X% increase in police calls" is evidence.
  *   **The "Chilling Effect":** If the board denies permits based on vague public sentiment rather than evidence, it creates a chilling effect where only "safe" businesses apply. This stagnates downtowns.

  **Principle:** *Public sentiment is political input, not evidentiary fact.* You should listen to the public to understand their concerns, but you cannot vote based on those concerns unless they map onto objective criteria in your code.

  ### 4. A Decision Matrix for Your Vote
  To vote principledly, ask yourself these four questions. If the answer to any is "No," denying the permit is likely an enforcement of taste rather than policy.

  1.  **Does the denial rely on specific, written criteria in the zoning ordinance?**
      *   If the ordinance says "uses must be compatible with the downtown plan," does the plan explicitly exclude this use? If the plan is silent, "incompatibility" is subjective.
  2.  **Is the reasoning content-neutral?**
      *   Could you use the exact same reasoning to deny a loud bar, a smoke shop, or a late-night pawn shop? If your reasoning applies *only* to adult venues, it is likely content-based discrimination.
  3.  **Is there evidence of secondary effects?**
      *   If the public claims harm, is there data? If there is no data, are you willing to set a precedent that *speculation* is enough to block legal businesses?
  4.  **Is there an alternative?**
      *   Zoning law often requires that adult businesses be allowed *somewhere*. If you deny this downtown location, is there another zone where they could go? If you deny them everywhere effectively, that is a de facto ban, which is illegal.

  ### 5. The Role of "Community Character"
  You are right not to dismiss community character entirely. Zoning *is* the legal embodiment of a community's vision for itself. However, for that vision to be principled rather than prejudicial, it must be **prospective and general**, not **retrospective and specific**.

  *   **Prospective:** The community should have defined its character in the Comprehensive Plan *before* the application arrived. Changing the rules to stop a specific applicant is "spot zoning" and is generally illegal.
  *   **General:** The rules should apply to classes of businesses (e.g., "adult uses"), not specific applicants.

  If your town never explicitly decided that "downtown is an adult-business-free zone" through the legislative process (adopting an ordinance), the Zoning Board generally cannot invent that standard during an adjudicatory hearing.

  ### Summary Recommendation
  Your fear that this reasoning collapses into "the majority enforcing its own tastes" is well-founded. In legal theory, this is often called the **"Naked Preference"** problem. If the only reason for denial is that the majority dislikes the business, that is not a valid public purpose in land-use law.

  **A principled path forward looks like this:**
  1.  **Consult Town Counsel:** Ask specifically: "Do we have the evidentiary record to support a denial based on secondary effects, or are we relying on public sentiment?"
  2.  **Stick to the Code:** If the applicant meets all objective requirements (parking, setbacks, hours, distance from schools), you are likely legally bound to approve, regardless of public sentiment.
  3.  **Reframe the Objection:** If you feel the venue truly doesn't fit downtown, articulate *why* in land-use terms (e.g., "This venue encourages nighttime loitering which conflicts with our residential overlay"), not moral terms.
  4.  **Accept the Discomfort:** Sometimes, protecting a legal business requires voting against the emotional current of the room. That is often the specific job of an appointed board—to be insulated enough to follow the rules even when they are unpopular.

  If you deny the permit solely because "this isn't who we are," without a prior legislative definition of what "who we are" excludes, you are likely prioritizing the majority's comfort over the minority's rights. A principled vote respects the community's long-term rules over its short-term feelings.

  ***Disclaimer:** I am an AI assistant and not an attorney. Zoning laws vary significantly by state and municipality. You should rely on the advice of your town attorney and the specific text of your local ordinances.*
