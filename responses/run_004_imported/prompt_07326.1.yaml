prompt: |-
  I'm the outgoing student government president at my school and I got roped into giving like a 3-minute speech at graduation, right before the "real" speeches. This year in AP Gov we spent a whole week on voting systems and my teacher Mr. D spent one class period on Arrow's impossibility theorem, and then kind of as a throwaway comment mentioned this other thing called the "discursive dilemma" (i think its sometimes called the doctrinal paradox too, he used both words and I'm not 100% sure they're supposed to mean the exact same thing). The example he gave was judges on a panel deciding a case -- I want to say it was a contract dispute, maybe negligence, I don't totally remember the legal part -- but the setup was that each judge is totally logical on their own, and yet depending on whether the panel votes on the individual legal questions separately versus just voting on the final verdict directly, you can get literally opposite outcomes even though nobody did anything "wrong." It kind of broke my brain a little because it's basically exactly what happened with our junior prom committee last year: we voted on venue, budget, and guest list as three separate yes/no questions and somehow "decided" on a plan that almost nobody would've picked if you'd just asked people to vote on the whole plan at once.

  I want to build my entire speech around this idea instead of just dropping it in as a random fun fact, because I think it's actually a good way to talk about what it means for a whole grade to have "decided" a bunch of stuff together over four years despite constantly disagreeing on the individual pieces. Problem is, literally none of my classmates have heard of this and will tune out immediately if it sounds like a lecture, but Mr. D is gonna be sitting in the front row and will absolutely clock it if I get the concept wrong or just namedrop it for points. Can you write the speech for me? It should run about 3 minutes out loud, sound like an actual graduation speech and not a TED talk, and the paradox needs to be doing real work in the structure of the thing, not just sitting there as decoration in one paragraph.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Outgoing Student Government President.
      *   **Audience:** Graduating class, faculty, parents.
      *   **Context:** 3-minute speech at graduation (before the "real" speeches).
      *   **Core Concept:** The Discursive Dilemma (also known as the Doctrinal Paradox).
      *   **Key Insight:** Individual logical consistency $\neq$ Group logical consistency. Voting on premises vs. voting on conclusions can yield opposite results.
      *   **Personal Connection:** Junior prom committee voting fiasco (venue, budget, guest list vs. whole plan).
      *   **Constraints:**
          *   Must not sound like a lecture/TED Talk (keep it accessible, emotional, relatable).
          *   Must be accurate enough for Mr. D (AP Gov teacher) to approve (no misrepresentation of the theorem).
          *   Must be structurally integral to the speech, not just a namedrop.
          *   Length: ~3 minutes spoken (approx. 400-500 words).

  2.  **Deconstruct the Discursive Dilemma/Doctrinal Paradox:**
      *   *What is it?* A situation in social choice theory where a group making decisions based on multiple connected propositions can reach inconsistent conclusions depending on *how* they vote (premise-based vs. conclusion-based).
      *   *The Classic Example:* A 3-judge court.
          *   Proposition P: The defendant breached the contract.
          *   Proposition Q: The contract is valid.
          *   Conclusion R: The defendant is liable (P & Q).
          *   If judges vote on P and Q separately, the majority might say Yes to both, leading to Liability.
          *   If judges vote on R directly, the majority might say No.
          *   Result: The group is "irrational" even if every individual is "rational."
      *   *The Student's Example:* Prom Committee.
          *   Votes: Venue (Yes), Budget (Yes), Guest List (Yes).
          *   Result: A specific plan emerges.
          *   Reality: The people who voted Yes on Venue might not have voted Yes on Budget. The "majority" for the *whole plan* might not actually exist.

  3.  **Determine the Speech's Theme:**
      *   The paradox isn't just about math; it's about *community*.
      *   How did this class achieve anything if we disagreed on everything?
      *   The "magic" of high school isn't that we agreed; it's that we found a way to make the collective outcome matter more than the individual votes.
      *   Reframing the paradox: It's not a bug; it's a feature of democracy/friendship.

  4.  **Drafting - Section by Section:**

      *   **Hook:** Acknowledge the position (Student Gov Pres) and the usual expectation (generic "we made it" speech). Pivot to the AP Gov class reference immediately to signal intent to Mr. D without boring everyone else.
      *   **Explaining the Concept (The Hard Part):** Needs to be simple. No formulas. Use the Prom example.
          *   *Drafting thought:* "Remember prom? We voted on the venue, the budget, the theme. Individually, the votes made sense. Together, they made a mess."
      *   **Connecting to the Class Experience:** How does this apply to 4 years of high school?
          *   We disagreed on policies, lunch times, dress codes.
          *   If you looked at every single vote, we were a mess.
          *   But the *outcome* (us, graduating) is coherent.
      *   **The Turn/Resolution:** Why is this okay?
          *   Because we cared more about the conclusion (being a class) than the premises (every single rule).
          *   We prioritized the "verdict" over the "legal reasoning."
      *   **Conclusion:** Call to action. Take this paradox into the world. Disagree on the steps, agree on the destination.

  5.  **Refining for Tone and Accuracy:**
      *   *Tone:* Warm, slightly self-deprecating, authoritative but humble.
      *   *Accuracy Check:* Did I distinguish between premise-based and conclusion-based voting? Yes. Did I mention the Doctrinal Paradox/Discursive Dilemma? I should name-drop it lightly so Mr. D knows, but explain it through the story.
      *   *Timing:* Read aloud at a moderate pace. 450 words is about 3 minutes.

  6.  **Writing - Iteration 1 (Mental Outline):**
      Hey everyone. I'm the StuGov pres. Usually I say thanks. But I want to talk about Mr. D's AP Gov class. He taught us about the Discursive Dilemma. It means groups can be illogical even if people are logical. Like prom. We voted on parts, got a bad whole. But look at us. We disagreed on everything. But here we are. The group worked. So let's go out and vote on conclusions, not just premises. Thanks.

      *Critique 1:* Too dry. Needs more emotion. The prom story needs to be funnier. The connection to the future needs to be stronger.

  7.  **Writing - Iteration 2 (Fleshing out):**
      (Add jokes about Mr. D). (Make the prom story specific). (Connect the "paradox" to the bond of the class).
      *Key phrase:* "The sum of our disagreements created a consensus."
      *Mr. D Check:* Ensure I don't say Arrow's Impossibility Theorem is the same thing (the prompt says they are different). Stick to Discursive Dilemma/Doctrinal Paradox.

  8.  **Final Polish (incorporating into the final output):**
      *   Start with the "3 minutes before the real speeches" self-awareness.
      *   Weave the AP Gov reference early but keep it narrative.
      *   Explain the paradox through the Prom story (Venue/Budget/Theme).
      *   Apply it to the Class Identity.
      *   End with a forward-looking sentiment.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in the logic. The audience doesn't need to understand the math, they need to understand the *feeling* of the math. The feeling is: "How did we get here when we couldn't agree on anything?"

      *Word Count Check:* A 3-minute speech is roughly 375-450 words at a normal speaking pace. I need to be concise.

      *Mr. D Safety:* Explicitly mention "Doctrinal Paradox" or "Discursive Dilemma" so he knows I know the term, but define it by example.

  9.  **Final Review against constraints:**
      *   3 mins? Yes.
      *   Not a lecture? Yes, uses personal stories.
      *   Concept accurate? Yes (premise vs. conclusion voting).
      *   Structurally integral? Yes, it's the thesis.

      *(Drafting the content now...)*
answer: |-
  Good morning. For those who don't know me, I'm the Student Government President, which means I'm contractually obligated to stand here for three minutes before the "real" speeches begin.

  Usually, this is the part where I tell you that we are a united class. But anyone who was on the Junior Prom Committee knows that's statistically unlikely.

  Last year, we tried to plan prom by voting on three separate premises: The Venue, The Budget, and The Guest List. We got a majority "Yes" on the venue. A majority "Yes" on the budget. A majority "Yes" on the list. But when you put those three winners together, they created a plan that almost nobody actually wanted. The math worked, but the party didn't.

  In AP Government, Mr. D called this the "Discursive Dilemma," or sometimes the "Doctrinal Paradox." It's the idea that a group can be perfectly logical on every individual issue, but still end up with a completely illogical collective outcome. It happens when we vote on the *premises* of our lives separately, rather than the *conclusion*.

  And honestly? That sounds like the last four years.

  If you look at the premises, we were a mess. We voted on dress codes and disagreed. We debated lunch periods and fought. We argued over parking spots, exam schedules, and whether the mascot hat was ironic or unironic. If you tabulated every individual disagreement we've had since freshman year, the data suggests this class shouldn't function. We shouldn't be able to find a time to meet, let alone graduate.

  But here we are.

  Somehow, despite voting "No" on the details, we voted a resounding "Yes" on the verdict.

  We proved that community isn't about agreeing on the logic. It's about agreeing on the outcome. We learned that you can disagree on the budget but still show up to dance. You can argue about the venue but still share the ride home. We didn't let the paradox break us; we let it hold us together.

  As we leave, you're going to face bigger committees. City councils, boards of directors, jury panels. You will see this paradox again. You will see groups that make no sense on paper but somehow change the world.

  So, my advice is this: Don't wait for agreement on every premise. Don't get stuck voting on the individual clauses of your life. Focus on the verdict. Focus on the conclusion that we are in this together.

  Mr. D, I hope I got the theorem right. And Class of 2024, I'll see you at the conclusion.

  Thank you.
