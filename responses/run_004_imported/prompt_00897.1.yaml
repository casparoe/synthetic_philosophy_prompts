      *   *Realist:* Let's call her **Elena**. She likes causal powers, ontological commitment, and thinks dispositions do real work.
      *   *Setting the Scene:* Boxes, tape guns, bubble wrap, the vase itself.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Elena needs to introduce the Fink case while handling the vase.
