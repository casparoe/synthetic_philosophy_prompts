answer: |-
  **SCENE:** *A cluttered faculty office. Cardboard boxes, rolls of tape, and sheets of bubble wrap cover a desk. In the center sits an unglazed terracotta vase, 5th Century BCE. ELENA (Realist) holds the vase. JULIAN (Reductionist) tears off a length of tape.*

  **ELENA:** Careful. If you drop that, it breaks. That's not just a prediction, Julian. It's a fact about the vase's nature.

  **JULIAN:** It's a fact about the vase's structure, sure. But don't reify it. To say the vase is "fragile" is just to say that *if* it were struck sharply, *it would* break. It's a subjunctive conditional, nothing more. The Simple Conditional Analysis. Pass me the tape.

  **ELENA:** *(Sets the vase down gently)* The Simple Analysis died thirty years ago. Imagine this vase is hooked up to Martin's electro-fink. A sorcerer monitors the vase. The moment you *would* strike it, the sorcerer zaps the molecular structure, making it temporarily as hard as diamond. You strike it; it doesn't break.

  **JULIAN:** So the conditional "If struck, it would break" is false.

  **ELENA:** Exactly. But the vase is still fragile. The fink removes the fragility *only* at the moment of testing. The disposition exists before the strike, but the conditional fails. So fragility cannot be identical to the truth of that conditional.

  **JULIAN:** *(Taping a box corner)* Fair. Lewis conceded that. The problem was that the fink removes the *causal basis* of the disposition right when the stimulus occurs. So we reform. $x$ is fragile iff $x$ has an *intrinsic causal basis* $B$ such that, if $x$ were struck and $x$ *retained* $B$ for a sufficient time, $x$ would break. The fink doesn't refute this, because in the fink world, the vase doesn't retain $B$ when struck. The Reformed Conditional Analysis holds.

  **ELENA:** *(Pulls a sheet of bubble wrap from the roll)* Lewis's reformed analysis saves the patient by amputating the limb. It requires the basis to persist intrinsically. But look at this. *(She begins wrapping the vase in the plastic bubbles.)*

  **JULIAN:** Bubble wrap.

  **ELENA:** Masking. As I wrap this, the vase's molecular structure—its intrinsic basis $B$—remains perfectly unchanged. It is still clay. It is still brittle. But if I strike it now, wrapped in three layers, it won't break. The conditional "If struck and $B$ persists, it breaks" is false. Yet, intuitively, the vase hasn't ceased to be fragile. I'm wrapping it *because* it's fragile. If the disposition were just the conditional, I wouldn't need to wrap it; the wrapping makes the conditional false, so by your lights, it makes the vase non-fragile.

  **JULIAN:** *(Stops taping)* You're conflating the disposition with the manifestation. The bubble wrap is an extrinsic interferer. Lewis's analysis specifies that the basis must be intrinsic. The mask is extrinsic.

  **ELENA:** Lewis handles *finks* by appealing to the intrinsic basis. But masks don't remove the basis. They interrupt the causal chain *between* the basis and the manifestation. The basis is there. The stimulus (striking) occurs. The manifestation (breaking) does not. The conditional is false. The disposition is real. Therefore, the disposition is not the conditional. You're left with a primitive power.

  **JULIAN:** Not necessarily. You're treating the stimulus "struck" as too thin. When we attribute fragility, the stimulus condition isn't just "mechanical impact." It's "mechanical impact *under normal conditions*."

  **ELENA:** "Normal conditions"? That's a placeholder for "conditions where nothing masks the disposition." You're defining the stimulus as "a strike that isn't masked." That makes the analysis circular. "Fragile means it breaks if struck, unless something stops it." That's trivial.

  **JULIAN:** It's not circular; it's contextualist. Look, when I say "if struck," the context of our conversation fixes the relevant possible worlds. In the context of *metaphysical analysis*, we might hold the bubble wrap fixed. But in the context of *attributing fragility*, the "striking" world is one where the object is exposed to its environment. The bubble wrap changes the context of evaluation, not the disposition.

  **ELENA:** *(Presses a bubble; it pops)* So the truth of the conditional depends on the conversational context, but the fragility depends on the vase?

  **JULIAN:** Yes. The disposition supervenes on the intrinsic properties. The *ascription* of the conditional depends on which extrinsic interferers we are holding fixed in the context. In a shipping context, we hold the wrapping fixed, so we don't say "it would break." In a metaphysical context, we strip away the wrapping to test the nature.

  **ELENA:** That saves the conditional by making it unstable. If I hand this vase to a mover and say "Be careful, it's fragile," I am telling the truth. But if your analysis is right, and the mover keeps it in the box, the conditional "If dropped, it breaks" is false. So I've lied to him? I've told him it has a property it doesn't have?

  **JULIAN:** You've told him it has an intrinsic basis that *would* cause breaking in the absence of extrinsic preventers. The "in the absence" clause is implicit in the predicate.

  **ELENA:** Implicit how? If it's implicit, it's not a reduction. You're analyzing "fragile" using "fragile-like conditions." You need a non-dispositional specification of "normal conditions." Can you give me one? A list of all possible masks? Gravity, temperature, bubble wrap, sorcerers, quantum tunneling...

  **JULIAN:** We don't need a list. We need a similarity metric. Worlds where the vase breaks are closer to actuality than worlds where it doesn't, *holding fixed the intrinsic structure*. The bubble wrap is a "deviant" causal chain.

  **ELENA:** Deviant according to what? According to the disposition! You're using the disposition to select the worlds that make the conditional true. That's the tail wagging the dog. *(She finishes wrapping the vase and places it in the box.)* The vase is fragile. The wrap masks it. The conditional is false. The only way to keep the truth of "it is fragile" while the conditional fails is to admit that fragility is a real, irreducible property that *grounds* the conditional, rather than *being* the conditional.

  **JULIAN:** *(Picks up the tape gun)* Or, it's that our language is loose, but the ontology is tight. If I analyze the microstructure, I find bonds, stress points, lattice weaknesses. I don't find a "power." I find categorical properties. The "masking" is just other categorical properties (the plastic) interacting with the first set. No primitives needed.

  **ELENA:** And yet, those categorical properties only explain the breaking *because* they are disposed to behave that way. The lattice weakness is just a disposition to shear. You're pushing the primitivism down to the quantum level, Julian. You haven't eliminated it; you've just hidden it in the basement.

  **JULIAN:** *(Seals the box)* Maybe. But until you can explain how a primitive power connects to its manifestation without a conditional link, I'll stick with the basement. It's cheaper rent.

  **ELENA:** *(Taps the box)* And I'll stick with the vase. It breaks because it's fragile, not the other way around.

  **JULIAN:** Pass me the label.

  **ELENA:** *(Hands him the label)* "Fragile."

  **JULIAN:** *(Sticks it on)* "Handle with care."

  **ELENA:** See? Even the label admits the power.

  **JULIAN:** It admits the risk. There's a difference.

  *(Julian lifts the box. Elena watches his grip.)*
