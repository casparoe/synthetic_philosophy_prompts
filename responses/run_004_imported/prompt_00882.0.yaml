answer: |-
  This is a classic and sophisticated disagreement that cuts to the heart of the difference between **decision theory** and **general equilibrium economics**.

  You were closer to being right regarding the logical consistency of the two claims: **Hirshleifer's argument is not a counterexample to Good's theorem.** They operate at different levels of analysis with different definitions of "value." However, your friend was correct to identify that information can be socially destructive, even if it is privately valuable.

  Here is the rigorous verdict on the disagreement, breaking down the assumptions, the scope shift, and the final ruling.

  ### 1. I. J. Good's Theorem (1967)
  **The Claim:** For a single Bayesian decision-maker, the expected utility of observing free, relevant evidence before acting is always greater than or equal to the expected utility of acting without it.

  **The Assumptions:**
  *   **Single Agent:** The model considers one agent making a decision against "Nature." There are no other strategic agents whose behavior changes in response to the information.
  *   **Fixed Payoff Structure:** The set of available actions and the consequences of those actions (the utility function) are fixed. Information helps you *select* a better action from the existing menu, but it does not *remove* items from the menu.
  *   **Private Value:** "Value" is defined strictly as the increase in the individual's expected utility.
  *   **Option to Ignore:** The agent can always choose to act as if they hadn't seen the evidence. Therefore, the evidence can never make them worse off than they were before; at worst, it is irrelevant.

  **The Scope:** Individual Decision Theory.

  ### 2. Jack Hirshleifer's Argument (1971)
  **The Claim:** The public release of information can reduce social welfare by destroying risk-sharing opportunities (insurance) that depend on uncertainty.

  **The Assumptions:**
  *   **Multiple Agents:** The model involves at least two agents who might trade or insure one another.
  *   **Endogenous Payoff Structure:** The set of available actions (specifically, contracts) depends on the information state. If uncertainty is resolved *before* contracting, certain insurance contracts become impossible to write (because one party would refuse the bet).
  *   **Social Value:** "Value" is defined as Pareto efficiency or the sum of utilities across the group.
  *   **Timing:** The critical factor is *when* the information arrives relative to the ability to contract. If information arrives before markets open, the "insurance" action is removed from the feasible set.

  **The Scope:** Welfare Economics / General Equilibrium.

  ### 3. The Precise Shift in Scope
  The reason these two results do not contradict one another lies in the **stability of the action set**.

  Good's theorem proves that $E[U | \text{Info}] \geq E[U | \text{No Info}]$ **ceteris paribus** (all else being equal). It assumes that the world you face *after* getting the information is the same world you faced before, except that you are now smarter.

  Hirshleifer's argument demonstrates that in a multi-agent setting, **all else is not equal.** The arrival of information changes the *strategic environment* and the *feasible set of contracts*.
  *   In Good's world, information helps you navigate a fixed maze.
  *   In Hirshleifer's world, information can collapse the bridges in the maze before you have a chance to cross them.

  Specifically, Hirshleifer identifies an **externality** that Good's theorem ignores. In Good's single-agent model, my knowing something does not change your payoff function. In Hirshleifer's multi-agent model, my knowing something (or us both knowing) changes the feasibility of our interaction. If we both know who will get sick, we cannot insure each other. The "action" of *insuring* is available in the "No Info" state but is removed in the "Info" state. Good's theorem does not apply when the information itself alters the available actions.

  ### 4. The Verdict

  **You were right about the logic.**
  Hirshleifer's result is not a counterexample to Good's theorem because Good's theorem contains an implicit *ceteris paribus* clause regarding the decision environment. Good proves that information has non-negative *private* value given a fixed set of opportunities. Hirshleifer proves that information can alter the *set of opportunities* in a way that reduces *social* welfare. A theorem about individual optimization within a fixed constraint set cannot be contradicted by a theorem about how information changes the constraint set itself.

  **Your friend was right about the intuition.**
  While not a logical refutation of Good, Hirshleifer's point is a crucial caveat to the *application* of Good's intuition in the real world. It is dangerous to invoke Good's theorem to argue that "more information is always better" in social, economic, or political contexts. In those contexts, the Hirshleifer effect dominates: public information can destroy the mutual ignorance required for cooperation and risk-sharing.

  **Final Ruling:**
  *   **On the question of contradiction:** You win. The two claims are compatible.
  *   **On the question of real-world applicability:** Your friend wins. Good's theorem is a baseline for individual rationality, but Hirshleifer's effect explains why societies sometimes benefit from opacity.

  **Recommendation for the Peace Treaty:**
  Concede that Good's theorem holds for the *individual decision to acquire* information (you were right to look at the menu), but acknowledge that Hirshleifer is right that *publicly broadcasting* that information can ruin the restaurant for everyone else (your friend was right about the social cost). You were arguing about **epistemology**; your friend was arguing about **economics**. Both of you were right, just in different currencies.
