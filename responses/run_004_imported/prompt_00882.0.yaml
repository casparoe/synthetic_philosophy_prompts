      *   *Conclusion:* A conciliatory closing thought.

  7.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Did Good assume no externalities?* Yes, implicitly. If my knowing hurts you, and I care about you, it might be in my utility function. But Good's theorem still holds for *my* expected utility. If I care about you, knowing might lower *my* utility if it prevents me from helping you? Wait.
      *   *Correction:* If I care about you (altruism), and knowing prevents insurance, my expected utility might drop? No, Good's theorem says the expected utility *with* information is $\ge$ *without*. If the information reveals I need insurance but can't get it, that's a realization of a bad state. But *before* I look, the *expectation* of looking is still non-negative because I can prepare.
      *   *Wait, Hirshleifer's point is stronger:* It's not just about preparation. It's about the *feasibility* of the contract. If the information becomes public *before* contracting, the contract space shrinks. Good's theorem assumes the action space is fixed. Hirshleifer shows the action space (contracts) shrinks upon information arrival.
      *   *Refined Distinction:* Good assumes the set of available actions is independent of the information state (except that information helps choose among them). Hirshleifer shows the set of available *social* actions (contracts) depends on the information state.
      *   *Actually, the cleanest distinction is Individual vs. Social.* Good is about $E[U_i|Info] \ge E[U_i|No Info]$. Hirshleifer is about $\sum U_i | Public Info < \sum U_i | No Info$. It is possible for every individual to satisfy Good's theorem privately (ex-ante) but the social equilibrium to be worse?
