  **Indexical Drift**

  The room was white, not because of cleanliness, but because color seemed like a variable the Bureau hadn't bothered to render. Adjudicator Voss sat behind a desk that looked like it was made of frozen mercury. Elias sat opposite, his hands clasped tight enough to turn his knuckles the color of old bone.

  "Mr. Vance," Voss said, her voice flat, devoid of the empathy usually programmed into civilian interfaces. "Your application for Modal Visitation Rights to World-892 is denied."

  "Because of the divergence?" Elias asked.

  "Because of the ambiguity." Voss tapped the surface of her desk. Two holograms flickered into existence between them.

  On the left, a man lay in a hospital bed. He had Elias's face, though ten years older. The jawline was identical, the scar above the left eyebrow matched the one Elias had gotten falling off a bike at age twelve. But the eyes were dull, vacant. The chart floating beside him listed a life of manual labor, a marriage to a woman Elias had never met, three children whose names meant nothing to him.

  "On the left," Voss said, "is Subject Alpha. Biological match: 99.8%. Neurological mapping: 42%. He shares your genetic history, your physical traumas, but his psychological continuity diverged at age nineteen. He chose the trade school. He stayed in the hometown. He does not remember the university. He does not remember *her*."

  Elias looked at the man. He felt a strange revulsion, like looking at a wax figure of himself. "He's not me."

  "Under Lewisian constraints, no one is 'you' outside your native world," Voss corrected. "Subject Alpha is a *counterpart*. He represents the possibility of you having stayed."

  "And the other one?"

  The hologram on the right shifted. This man was in a hospice chair, thin, wasted by disease. The face was different—softer jaw, different nose, perhaps a different ethnicity entirely. But the eyes were sharp. Terrified. Recognizing.

  "Subject Beta," Voss said. " Biological match: 14%. Neurological mapping: 96%. He suffered a corpus callosum severance at age seven, followed by a experimental graft procedure. He possesses your memories. He remembers the bike accident. He remembers the university. He remembers *her*. He is dying of the same genetic condition that you currently carry, despite the lack of phenotypic expression in your current body."

  Elias leaned forward. "He has my memories."

  "He has *a* memory set that overlaps with yours to a high degree of similarity," Voss said. "He is also a counterpart."

  "I want to visit Beta," Elias said. "If I'm going to see how I die, I want to see the one who knows who he is."

  "That is the problem," Voss said. She swiped the holograms away. "World-892 is a high-cohesion world. It does not tolerate duplicate identities. Our sensors detect two distinct entities in that world who both qualify as counterparts to you under different similarity relations. If we grant you access, we have to designate which connection is the 'valid' modal link for the purpose of visitation."

  "So designate Beta," Elias said. "Psychological continuity is what matters. That's... that's what personhood is."

  Voss sighed, a sound like static. "That is a Kripkean intuition, Mr. Vance. It is not Bureau policy. Policy follows Counterpart Theory. Individuals are world-bound. Identity is not transworld. There is no 'you' in 892. There are only men who resemble you. The degree of resemblance is context-dependent."

  "Context-dependent," Elias repeated. "What context?"

  "The purpose of the visit," Voss said. "If you are visiting to claim biological inheritance, Subject Alpha is the closer counterpart. If you are visiting to settle psychological debts, Subject Beta is the closer counterpart. You applied for 'Existential Closure.' That category is undefined."

  "I want to know," Elias said, his voice rising, "which one of them is *me*. I want to know which death is mine."

  "Neither death is yours," Voss said sharply. "You will die in this world. Subject Alpha will die in 892. Subject Beta will die in 892. They are numerically distinct entities. To say 'that is your death' is a category error. It is like saying your brother's pain is your pain because you look alike."

  "It's not like looking alike!" Elias slammed his hand on the desk. "Beta remembers my childhood. He feels my fear. If I look at him, I see *me*. Alpha is just... meat. He's a shell. If you tell me Alpha is my counterpart, you're changing the subject. I don't care about the shell. I care about the mind."

  "And yet," Voss said, pulling up a new file, "Subject Alpha has filed a injunction. He claims that *you* are *his* counterpart. He is requesting access to *your* world's medical data to treat his condition. He argues that since he shares your DNA, the biological similarity relation is the primary metric for medical liability."

  Elias stared at her. "He wants my health records?"

  "He wants your cure. And under current statutes, if the biological similarity relation is prioritized, he has standing. He is arguing that psychological divergence is accidental, but biological constitution is essential."

  "That's absurd. I'm not my DNA."

  "Legally, in this bureau, you are whatever the similarity metric says you are," Voss said. "And here is the complication. If we grant Beta standing based on psychology, we invalidate Alpha's claim. But if we invalidate Alpha's claim, we sever the biological link that allows us to justify the energy cost of the bridge. The bridge requires a physical anchor. Beta is too physically divergent to anchor the connection. Alpha can anchor it, but he won't let you through unless you acknowledge his claim."

  Elias felt the room spinning. The metaphysics wasn't just theory; it was plumbing. It was the pipes through which his life was supposed to flow, and they were blocked by a contradiction.

  "So I'm stuck," Elias said. "To see the one who thinks like me, I have to validate the one who looks like me. To deny the one who looks like me, I lose the bridge to the one who thinks like me."

  "Essentially."

  "And neither of them is me."

  "Correct."

  "Then why does it hurt?" Elias asked. He pointed at the empty space where Beta's hologram had been. "When you showed me Beta... I felt grief. I felt *my* grief. If he's just some other guy who resembles me, why does his death feel like a prediction?"

  "Because similarity induces empathy," Voss said. "That is all. You are empathizing with a similar entity. Humphrey doesn't care about his counterpart, Mr. Vance, unless the counterpart's victory makes the proposition 'Humphrey could have won' true. You are trying to extract ontological weight from a truth condition."

  "I don't want the proposition to be true," Elias said quietly. "I want *him* to be me. I want to be able to say, 'I could have been that guy.' Not 'Someone like me could have been that guy.'"

  "That requires transworld identity," Voss said. "Which is impossible. You are here. He is there. If you were identical, you would be in two places at once, possessing contradictory properties (healthy/sick, dark-haired/light-haired). Logic forbids it."

  "So logic says I'm alone," Elias said.

  "Logic says you are world-bound."

  "Then what am I supposed to tell him?" Elias asked. "If I get through. If I sit by Beta's bed. He's going to look at me and ask, 'Did we make it? Did we survive?' What do I say? 'You're a counterpart?' 'You're just similar?'"

  "You say nothing," Voss said. "You are not authorized to speak to them. You are authorized to observe. Observation confirms the truth value of the modal claim. It does not facilitate communion."

  Elias stood up. His legs felt heavy, as if gravity in this room was stronger than in the world outside. "There's a third option."

  Voss raised an eyebrow. "There are only the options permitted by the model."

  "Merge us," Elias said. "If the problem is that there are two candidates for the counterpart relation, eliminate the ambiguity. Upload Beta's mind into Alpha's body before I cross. Or vice versa. Make them one entity. Then there's only one counterpart. One metric."

  Voss stared at him. For the first time, her expression shifted, a flicker of something like alarm. "That would kill both of them. The neural graft would reject. The biological stress would be fatal."

  "But then there would be one," Elias said. "Then I would know who I am over there. Or rather, who *is* me."

  "You are proposing murder to resolve a semantic ambiguity."

  "I'm proposing resolution," Elias said. "You keep telling me I'm distinct. That I'm separate. But I feel the pull. I feel the gravity of those other lives. If I'm truly world-bound, why does it feel like I'm being torn in half?"

  "Because you are imagining," Voss said. "Imagination is not travel."

  "Then let me travel."

  "Pick a metric," Voss said. "Biological or Psychological. Choose which man is your counterpart for the purpose of this file. If you choose Biological, Alpha gets your medical data, and you can visit Alpha's deathbed. If you choose Psychological, Beta gets nothing, the bridge collapses, and you see nothing."

  Elias looked at the empty space between them. He thought of Alpha, the stranger with his face, living a life Elias had rejected. He thought of Beta, the stranger with his mind, dying in a body Elias didn't recognize.

  "If I choose Biological," Elias said, "I save Alpha. I give him the cure."

  "Yes."

  "And Beta dies."

  "Yes."

  "If I choose Psychological..."

  "Beta dies alone. Alpha lives with the condition."

  "And I don't get to see either of them."

  "You get to remain consistent," Voss said.

  Elias closed his eyes. He tried to feel where *he* ended. He touched his own face. The scar. Real. He touched his chest. The heart condition. Real. But in another world, the scar wasn't there, and the heart was strong. In another, the heart was failing, and the face was different.

  "I am not them," Elias whispered.

  "No," Voss said. "You are not."

  "But if I don't choose," Elias said, opening his eyes, "the system crashes? The file stays open?"

  "Indefinitely. You remain in limbo. No access. No liability. No closure."

  "And them?"

  "They continue. Alpha seeks treatment elsewhere. Beta dies."

  Elias looked at the Adjudicator. He realized then that the Bureau didn't care about the metaphysics. They cared about the ledger. As long as the file was open, the accounting was unresolved. They wanted him to close the loop. They wanted him to decide which version of similarity mattered so they could bill the appropriate account.

  "I need more time," Elias said.

  "The bridge window is closing," Voss said. "World-892 is rotating out of alignment."

  "Give me the time."

  "There is no time in the modal void, Mr. Vance. There is only decision."

  Elias stood there. He thought about Kripke's Humphrey. Humphrey didn't care about the counterpart. But Humphrey wasn't looking at a screen showing two men dying in his place. Humphrey wasn being asked to sign the death warrant for one to save the other.

  "Can I talk to them?" Elias asked. "Before I choose. Just audio."

  "Protocol forbids causal interaction."

  "Protocol forbids a lot of things. You said it yourself. I'm distinct. They're distinct. What harm can a voice do? If we're not identical, no contamination occurs."

  Voss paused. The logic held, technically. If they were numerically distinct, communication was just inter-world diplomacy, not self-interference.

  "Thirty seconds," Voss said. "Per subject."

  She tapped the desk. A channel opened.

  "Alpha," Elias said.

  The voice that came back was rough, tired. "Yeah? Who is this?"

  "It's... me. From the other side."

  A long pause. "You the one with the cure?"

  "I might be. Depending on what I decide."

  "Don't decide on me," Alpha said. "I got kids. I don't care about your memories. I care about my blood. You owe me that much. You got the face. You pay the tax."

  The channel cut.

  "Beta," Elias said.

  The voice was weak, raspy. "I remember the blue bike," the voice said immediately. "I remember the fall."

  "I know," Elias said. His throat tightened.

  "Did we win?" Beta asked. "Did we get out?"

  "I'm still here," Elias said.

  "Then I didn't," Beta said. There was no bitterness, only a terrible clarity. "Don't let him have it. The cure. He's not us. He's just... the container."

  The channel cut.

  Silence returned to the white room.

  Voss waited. "Decision?"

  Elias looked at his hands. They were shaking. He was one man. He was world-bound. He was numerically distinct from the voices he had just heard. By all logical accounts, he owed them nothing. They were other men. One shared his flesh, one shared his mind. Neither shared his existence.

  But the grief was his. The guilt was his.

  "If I choose neither," Elias said, "the file stays open."

  "Yes."

  "And you can't force me."

  "Not without violating the Non-Interference Statute. You must自愿 (voluntarily) assign the counterpart relation."

  Elias sat back down. He folded his hands.

  "Then I'll wait," he said.

  "Mr. Vance," Voss said, her voice tightening. "The window closes in minutes. If you don't assign the relation, the bridge collapses naturally. Both subjects lose access to this world permanently. Alpha dies. Beta dies. You gain nothing."

  "I know," Elias said.

  "Why?"

  "Because if I choose," Elias said, looking at the blank space where the holograms had been, "I'm saying that one of them is the real counterpart. I'm saying that similarity is enough. But it's not. It's not enough for them, and it's not enough for me."

  "That is irrational," Voss said. "You are sacrificing utility for a metaphysical technicality."

  "No," Elias said. "I'm refusing to let you define me by a metric. Humphrey doesn't care about his counterpart. But I care about me. And if 'me' doesn't cross over, then nothing crosses over. Not even the choice."

  Voss stared at him. The mercury desk seemed to ripple. "You understand that by doing nothing, you are effectively killing them both. Inaction is a choice."

  "I know," Elias said. "But it's *my* choice. Not the system's. Not the similarity metric's."

  "The window is closing," Voss said. "Ten seconds."

  Elias closed his eyes. He thought of the blue bike. He thought of the scar. He thought of the fact that in every world, Elias Vance was alone.

  "Five."

  He didn't move.

  "Three."

  He felt a tear leak out, hot and real.

  "Two."

  "Let it go," Elias said.

  "One."

  The holograms flickered and vanished. The hum of the room dropped to a silence so deep it felt like pressure.

  Voss stood up. "File marked: Unresolved. Counterpart relation: Null. You are dismissed."

  Elias stood. He felt lighter, and infinitely heavier. He walked to the door.

  "Mr. Vance," Voss called out.

  He stopped, but didn't turn.

  "You realize," she said, "that in World-892, there will be a record of this. A ghost signal. They will know you were there. They will know you chose neither."

  "Good," Elias said.

  "Why?"

  "Because now," Elias said, opening the door to the gray corridor beyond, "they know they're not me either."

  He walked out into the hall, leaving the white room and the Adjudicator and the two dying men behind him, alone in their own worlds, distinct and unconnected, just as logic demanded, and just as logic forbade.
