  8.  *(Self-Correction on "Satisfying")*: "Satisfying" is subjective. I need to define what makes a fix satisfying. Theoretical coherence? Practical utility? Given the user is in an AI safety group, they likely care about truth/identifiability. I will frame "satisfying" as "theoretically robust."

      *   *Wait, one nuance:* RPT with risk (Expected Utility) *does* get cardinality. But standard RPT (Varian/Afriat) is ordinal. I should acknowledge EU theory briefly but stick to the user's RPT framing (budget sets).
