answer: |-
  This isn't weirdly specific at all; you have literally stumbled into a live-action case study for your seminar. What you are experiencing is the friction between **formal equality** and **substantive equity**, played out in a kitchen instead of a legislature.

  Neither of you is "wrong," but you are operating under different theories of justice. Here is the breakdown of the philosophical clash, why your roommate reacted that way, and how you might resolve it without violating either of your principles.

  ### 1. The Philosophical Clash

  **Your View: Equity and Need (Rawls/Marx)**
  You are arguing from a position of **equity**. You recognize that while the *input* (rent split) is equal, the *burden* is not. Because your roommate has a "natural disadvantage" (the autoimmune condition), a 50/50 split results in unequal freedom at the end of the month.
  *   **The Theory:** This aligns with John Rawls' *Difference Principle*, which suggests inequalities are only just if they work to the benefit of the least advantaged. It also echoes Marx's maxim: *"From each according to his ability, to each according to his needs."*
  *   **The Goal:** You want **outcome fairness**. You want both of you to have roughly the same disposable income and quality of life.

  **Her View: Equality and Autonomy (Nozick/Libertarian)**
  Your roommate is arguing from a position of **procedural justice**. She views the roommate agreement as a contract between two autonomous adults. As long as the rules are applied equally (we both pay 50%), the process is fair, regardless of the outcome.
  *   **The Theory:** This leans toward Robert Nozick's *Entitlement Theory*. If the income was earned justly and the rent split is agreed upon justly, the resulting distribution is just. Interfering with it to "fix" the outcome violates the integrity of the agreement.
  *   **The Goal:** She wants **relational equality**. She wants to be seen as a peer and an equal partner, not a beneficiary of your benevolence.

  ### 2. Why She Felt Annoyed (The Dignity Factor)

  You mentioned she said she didn't want to be a "charity case." This is the crux of the issue. In political philosophy, this touches on **Elizabeth Anderson's concept of Democratic Equality**.

  Anderson argues that the goal of justice isn't just to distribute resources, but to ensure people relate to one another as equals. When you offer to pay more because she is sick, even with the best intentions, it can inadvertently create a hierarchy:
  *   **You:** The benefactor, the able-bodied, the one with surplus.
  *   **Her:** The recipient, the disabled, the one with a deficit.

  For many people with chronic illnesses, there is a constant societal pressure to be "burdens." By insisting on the 50/50 split, she is asserting her agency. She is saying, *"I am capable of meeting my obligations as an adult, and I value our friendship being based on reciprocity, not dependency."*

  ### 3. Are You Both Missing Something?

  Yes. You are both treating this as a problem of **distributive justice** (how do we split the money?), when it is actually a problem of **relational justice** (how do we care for each other without creating a power imbalance?).

  **What you might be missing:**
  By trying to fix the math, you might be undermining her dignity. If you force the issue, you risk making her feel that her contribution to the household (emotional labor, friendship, cleanliness, etc.) is worth less than yours because she has medical bills.

  **What she might be missing:**
  Strict equality can sometimes mask inequality of burden. If her medical costs become unsustainable, it could lead to her having to move out, which benefits neither of you. Ignoring the disparity entirely can sometimes lead to resentment or burnout on her end.

  ### 4. How to Resolve It

  You don't need to abandon your desire to help, but you need to change the *mechanism* so it doesn't feel like charity.

  **1. Respect the Boundary (For Now)**
  Back off the direct rent subsidy. She has told you clearly that this specific solution makes her feel unequal. Pushing it further violates her autonomy. Acknowledge her stance: *"I hear you. I respect that you want us to be equal partners on the lease, and I don't want to undermine that."*

  **2. Shift from "Subsidy" to "Sharing"**
  Instead of adjusting the *bills*, adjust the *lifestyle*.
  *   **Don't say:** "I'll pay more rent so you can afford your meds."
  *   **Do say:** "I'm making a big batch of dinner tonight, my treat," or "I found a deal on groceries, let me grab them this week."
  *   **Why:** This frames the help as **generosity within a friendship** rather than **compensation for a disability**. It's reciprocal; maybe she cooks next time, or handles a chore you hate. It keeps the ledger social, not financial.

  **3. Non-Monetary Support**
  Often, the exhaustion of chronic illness is time-based, not just money-based. Offering to handle a shared chore when she is having a flare-up ("I'll take out the trash and clean the bathroom this week, you rest") is often received better than money. It says, *"I see you're struggling, and I've got your back,"* without saying *"You are poor."*

  **4. The "Emergency Fund" Reframe**
  If you are dead set on financial help, frame it as a mutual safety net rather than a subsidy. *"Hey, I know we both have tight budgets. I want to start a small shared fund for unexpected house stuff or takeout when we're too tired to cook. I can put in a bit more initially."* This makes it about the *house*, not her *body*.

  ### The Verdict

  **She is right about the relationship dynamic;** maintaining her status as an equal partner is crucial for your long-term friendship and her mental health.
  **You are right about the material reality;** the current split does leave her with less security.

  The solution is to prioritize her definition of fairness (equality of status) while finding creative, non-patronizing ways to address the material disparity (equity of outcome). In political philosophy terms: **Secure her dignity first, then address the need.**

  Tell your seminar professor you found a real-world example of the tension between Rawls and Nozick in your living room. They'll probably love it.
