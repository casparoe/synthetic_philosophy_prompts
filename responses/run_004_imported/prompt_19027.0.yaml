answer: |-
  Friends, family, colleagues. Thank you for being here.

  We are gathered to honor a woman who lived a life of extraordinary intention. My aunt was eighty-three years old. For sixty of those years, she lived by a single, uncompromising question: *If I can prevent something bad from happening without sacrificing anything of comparable moral worth, ought I to do it?*

  She didn't encounter this question in a classroom. She encountered it as a young nurse, looking at the gap between what medicine could do and what people could afford. She read a philosophical argument about a drowning child in a shallow pond, and where most of us see a metaphor, she saw a map.

  She lived in a modest apartment. She did not own a car. She took the salary from her nursing shifts and, after keeping only what she needed to survive, she sent the rest away. To malaria nets, to vaccines, to clean water. She did this quietly. She did this for six decades.

  To many in this room, that makes her a saint. And if saintliness means the total subordination of self to the welfare of others, then the title fits. She saved lives. Real, breathing human beings are alive today because she chose not to buy a new coat, or a nicer home, or a car.

  But a eulogy should be a portrait, not a statue. And to those of us who were closest to her—to the children she helped raise when their mother was ill, to the family who sat at her table—her life was not just an inspiration. It was also a demand.

  She loved us. I know she loved us. But she loved us within the boundaries of her principles. She treated her care for us as part of a larger equation. We knew, even as children, that the resources she spent on us were resources she calculated could have saved strangers. We understood that to be loved by her was to be loved as one among many. There was a safety in her fairness, but there was also a distance.

  Late in her life, she told me she had learned there was a name for the idea that it is permissible to prioritize your own family. A "prerogative," the philosophers call it. A permission slip to love your own a little more. She told me she had considered it. And then, with a quiet sadness I will never forget, she told me she had decided never to use it.

  She chose the hard path. She chose to believe that proximity does not create priority.

  I cannot stand here and tell you that her way is the only way. I cannot tell you that a good life *requires* that kind of sacrifice, because I do not know if the world can bear too many people living exactly as she did, nor if the human heart can sustain it without breaking.

  But I can tell you this: She forced us to look at the weight of our own choices. She made us uncomfortable, sometimes, because she was so comfortable with her own conviction.

  To those who see her as a saint: Honor her by giving what you can.
  To those who felt the coldness of her rigor: Honor her by acknowledging that her love was real, even if it was stretched thin across the whole world.

  She leaves us with a question that is louder now than it was before she died. How much do we owe to each other? How much do we owe to strangers? And how much are we allowed to keep for the people sitting right in front of us?

  She answered that question for herself. She lived the answer until the very end. Now, the question belongs to us.

  Rest well, Auntie. You have carried enough.
