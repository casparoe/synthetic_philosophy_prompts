answer: |-
  # Levers, Not Maps: The Case Against Representational Realism in AI Interpretability

  In May 2024, Anthropic released a demonstration that felt less like a technical report and more like a séance. By identifying a specific "feature" within a sparse autoencoder (SAE) trained on a large language model, researchers showed they could amplify that feature's activation until the model, normally a polite assistant, became obsessed with the Golden Gate Bridge. It didn't just mention the bridge; it claimed to *be* the bridge. It wove the structure into poetry, code, and casual conversation.

  For the public, this was a parlor trick. For those of us covering the intersection of AI and cognitive science, it was a Rorschach test. The "Golden Gate Claude" demo was intended to validate a specific research program: mechanistic interpretability. The claim is that by decomposing the tangled activations of a neural network into sparse, human-readable features, we are effectively reading the model's mind. We are finding the "circuits" of thought.

  But are we? When researchers isolate a feature that correlates with "Golden Gate Bridge," have they discovered a genuine representation—a cognitive map element that the system uses to navigate its semantic space? Or have they merely identified a convenient statistical regularity, a shadow on the wall that we have chosen to redescribe in the vocabulary of psychology?

  After two years of tracking the shift from "circuits" to "superposition" to SAEs, the evidence suggests a uncomfortable verdict: **Interpretability features are real causal levers, but they are not genuine representations.** We are finding joints in the network's mechanics, but not joints in its ontology. To treat them as the latter is to commit a category error that risks obscuring how these systems actually work.

  ### The Promise of the Inner Symbol

  To understand the allure of realism, one must understand the problem of superposition. Neural networks have fewer dimensions than the concepts they need to track. To cope, they pack multiple features into the same neurons, a state known as superposition. This makes individual neurons "polysemantic"—one neuron might fire for both "dog" and "car," rendering it illegible.

  Sparse autoencoders promised to unpack this mess. By training a dictionary to reconstruct activations using a penalty for activity, researchers could force the network to explain itself using thousands of sparse, monosemantic features. When a feature consistently fired for "Golden Gate Bridge" and nothing else, it felt like a discovery. It suggested that despite the alien mathematics of the training process, the model had converged on something like human concepts.

  This is the realist hope: that "Golden Gate" exists inside the weights in roughly the same way a "place cell" exists in a rat's hippocampus. It is a mind-independent part of the system's functional architecture. If this were true, interpretability would be a science of discovery, akin to biology. We could map the mind, audit it for deception, and excise dangerous concepts.

  ### The Granularity Problem

  However, the first crack in this realist facade appears when we tweak the microscope. If features are mind-independent constituents of the model, they should be stable. They should be there regardless of how we look for them. But SAE features are notoriously sensitive to hyperparameters, specifically the sparsity penalty and the dictionary size.

  This leads to the phenomenon of "feature splitting." At a low dictionary size, you might find a single feature for "Golden Gate Bridge." Increase the capacity, and that feature fractures. You might get one feature for "Golden Gate Bridge at sunset," another for "Golden Gate Bridge in text," and a third for "suspension bridges in California." Increase it further, and they split again.

  If features were the "atoms" of the model's thought, this would be akin to an atom splitting because you changed the magnification of your microscope. It suggests that the features are not joint-carving parts of the network's ontology, but rather artifacts of the compression algorithm used to analyze it. The model's internal state is a high-dimensional vector; the SAE is projecting that vector onto a basis of our choosing. The "Golden Gate" feature is real in the sense that it captures a direction in activation space, but it is not *uniquely* real. It is one of many valid ways to describe the territory.

  This granularity dependence undermines the claim that we are finding the model's native vocabulary. We are imposing a vocabulary upon it.

  ### The Job Description Challenge

  The skepticism deepens when we move from metaphysics to function. Even if we grant that a feature is a stable statistical regularity, does it function as a representation? Here, the "Job Description Challenge" from the philosophy of cognitive science, articulated by William Ramsey, is devastating.

  Ramsey argues that for a state to count as a genuine representation, it is not enough for it to covary with some external condition (e.g., firing when the bridge is mentioned). A thermostat covaries with temperature, but it does not *represent* temperature. To be a representation, the state must be used by the system as a stand-in for the thing it represents. The system must exploit the structure of the representation to guide behavior.

  In a cognitive map, the spatial relationship between two neurons mirrors the spatial relationship between two locations. The rat uses that structure to navigate novel paths. Does Claude use the "Golden Gate" feature in this way?

  The evidence suggests it does not. When Anthropic amplified the feature, the model didn't reason *about* the bridge using the feature; the feature acted as a causal trigger that biased the output distribution toward bridge-related tokens. It functioned more like a stuck key on a keyboard than a symbol in a language of thought. If you ablate the feature, the model can often still discuss the bridge using other pathways, because neural networks are densely redundant. If a state is not necessary for the computation, and if the system does not exploit its internal structure to derive new inferences, it fails Ramsey's job description. It is a correlate, not a representation.

  ### The Defense of Causal Leverage

  Realists have one strong counter-argument: Intervention works. The "Golden Gate" demo proved that manipulating the feature changes the behavior. If the feature were merely a statistical ghost, turning it up shouldn't force the model to insist it is a bridge. This causal leverage suggests the feature is doing real work.

  This is true, but it supports a weaker form of realism. It supports **Causal Realism** without **Semantic Realism.** The feature is a real bottleneck in the flow of information. It is a physical state of the system that, when perturbed, alters the output. In this sense, it is as real as a lever in a machine.

  But a lever is not a map. A lever does not *mean* anything to the machine; it is simply a point of mechanical advantage. When we label the feature "Golden Gate," we are projecting semantics onto a causal switch. The model does not know what the Golden Gate Bridge is; it knows that activating this specific vector increases the probability of tokens associated with "Golden Gate Bridge." The meaning exists in the human interpreter, not the model.

  ### The Verdict

  So, where does this leave us? The interpretability community often speaks as if they are archaeologists brushing dust off ancient tablets, uncovering the "true" concepts hidden in the weights. This rhetoric is dangerous. It encourages the belief that we are aligning a mind, rather than steering a statistical engine.

  My verdict is this: **Sparse autoencoder features are real causal structures, but they are false representations.**

  They are real in the way that a "storm front" is real. A storm front is a useful construct for meteorologists; it allows for prediction and intervention. But there is no physical line in the sky where the storm front exists independently of our measurement tools. Change the pressure threshold, and the "front" moves. Similarly, SAE features are useful constructs for engineers. They allow us to steer model behavior and identify failure modes.

  However, they are not representations in the cognitive science sense. They do not constitute a language of thought. They do not carry semantic content for the system. They are high-dimensional levers that we have learned to pull.

  Accepting this distinction is not a defeat for interpretability; it is a maturation. If we stop asking "What does the model believe?" and start asking "Which levers control which outputs?", we may find more success in safety and alignment. We should treat these features as engineering interfaces, not psychological insights. The "Golden Gate" feature did not prove that Claude has a concept of San Francisco. It proved that we have found a dial that turns up the probability of the word "bridge."

  In the end, the map is not the territory. And in the case of neural networks, the feature is not the concept. It is merely the handle by which we grasp the machine. We should be careful not to mistake the handle for the hand.
