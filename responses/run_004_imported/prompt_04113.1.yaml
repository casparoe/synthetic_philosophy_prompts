      *   **Source Material:** Henry Sidgwick's 1889 address, "The Canons of Evidence in Psychical Research."
      *   **Specific Passage:** Sidgwick discusses weighing the improbability of a marvel vs. the improbability of false testimony. He quotes Hume ("It is contrary to experience that miracles should be true, and not contrary to experience that testimony should be false") and then critiques it.
      *   **User's Confusion:** Is Sidgwick saying Hume is *wrong* or just *weak*? If "contrary to experience" means "novel/unfamiliar," isn't that what Hume meant anyway? What is the specific logical work Sidgwick is doing here?
      *   **Goal:** A step-by-step walkthrough of the argument to clarify Sidgwick's objection.

  2.  **Deconstruct the Text:**
      *   *Sidgwick's Premise 1:* Evaluating a marvel requires balancing two probabilities: (A) The event happened (despite being unlikely) vs. (B) The testimony is false (despite seeming reliable).
      *   *Sidgwick's Premise 2:* We have no "intellectual scales" to weigh these accurately.
      *   *Hume's Proposal:* Hume offers a shortcut/scale: Miracles are *contrary* to experience (uniform experience against them), while false testimony is *not contrary* to experience (we know lies happen). Therefore, testimony for a miracle is always outweighed.
      *   *Sidgwick's Critique:* What does "contrary to experience" actually mean?
      *   *Sidgwick's Definition:* It means "unlike previous experience" or "unlike systematized knowledge."
      *   *Sidgwick's Counter-point:* Things that are "unlike previous experience" happen all the time (novelty/strangeness). Just because something is new/strange doesn't mean it's impossible or that uniform experience is *against* it in a law-like sense. It just means we haven't seen *this specific thing* before.
      *   *Implication:* Hume treats "contrary to experience" as a hard law (impossible), but Sidgwick argues it's just a statement of current ignorance/novelty (unfamiliar).

  3.  **Identify the Core Philosophical Disagreement:**
      *   **Hume's View:** "Contrary to experience" = Violation of a established law of nature. Uniform experience supports the law; the miracle breaks the law. Therefore, probability of miracle $\approx$ 0.
      *   **Sidgwick's View:** "Contrary to experience" = Merely novel or unobserved *so far*. Human history is full of things that were once "contrary to experience" (e.g., antipodes, electricity, germs) but turned out to be true. Therefore, probability of marvel $\neq$ 0, just low.
      *   **The Move:** Sidgwick is redefining Hume's key term to show that Hume's "proof" is circular or question-begging. Hume assumes the law of nature is immutable; Sidgwick says our *knowledge* of the law is provisional.

  4.  **Drafting the Explanation (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. It's a subtle philosophical point. State the thesis: Sidgwick isn't saying Hume is *totally* wrong, but that Hume's maxim is too blunt an instrument for scientific inquiry because it conflates "unfamiliar" with "impossible."

      *   *Step 1: Hume's Position (The Target).* Explain Hume's "uniform experience" argument clearly. For Hume, a miracle isn't just rare; it's a violation of a law established by *uniform* experience. False testimony is common. So, always bet against the miracle.

      *   *Step 2: Sidgwick's Redefinition (The Pivot).* Focus on the phrase "contrary to experience." Sidgwick asks: What do we *mean* by this? He argues we can only mean "we haven't seen it before in our systematized knowledge."

      *   *Step 3: The Historical Argument (The Evidence).* Sidgwick points out that humanity constantly encounters "novel and strange" things that later become familiar. If Hume's rule were applied strictly in the past, we would have rejected electricity, the Americas, germs, etc., because they were "contrary to experience" at the time.

      *   *Step 4: The Consequence (The "Work" being done).* This is the crux.
          *   Hume: "Contrary to experience" = Impossible (Probability 0).
          *   Sidgwick: "Contrary to experience" = Unprecedented (Probability > 0, but low).
          *   *Why it matters:* If the probability is 0, you stop investigating (Hume). If the probability is low but non-zero, you must weigh it against the reliability of testimony (Sidgwick/SPR). Sidgwick is carving out logical space for the SPR to exist. If Hume is right, the SPR is a waste of time. If Sidgwick is right, the SPR has a job to do.

      *   *Step 5: Addressing the User's Specific Confusion.* The user asks: "Isn't that basically what Hume was already saying?"
          *   *Answer:* No. Hume thinks "contrary to experience" implies a *contradiction* of known laws. Sidgwick thinks it implies only an *addition* to known facts. Hume sees a wall; Sidgwick sees a horizon.

      *   *Conclusion:* Summarize. Sidgwick is protecting the possibility of scientific discovery against dogmatic skepticism.

  5.  **Refining the Tone:**
      *   Keep it academic but accessible (NHD level).
      *   Use analogies if helpful (e.g., the "black swan" or "antipodes").
      *   Ensure the distinction between "impossible" and "unprecedented" is sharp.

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I represent Hume fairly? Hume does allow for testimony to prove a miracle if the falsehood of the testimony would be *more* miraculous. But his general presumption is heavily weighted. Sidgwick is attacking the *weight* of that presumption.
      *   *Check:* Did I answer the specific question about "what work is the move doing"? Yes, it shifts the burden of proof from "impossible to overcome" to "requires high quality evidence."
      *   *Check:* Is the distinction between "uniform experience against X" and "lack of experience of X" clear? This is the key. Hume says we have uniform experience *against* miracles (they never happen). Sidgwick says we just lack experience *of* them (we haven't seen them yet), which is different. Wait, looking closely at the text: Sidgwick says "contrary to experience... can mean no more than that it is unlike previous experience." He is challenging the strength of "contrary." He is saying "contrary" is a strong word for "novel."

  7.  **Final Polish:** Organize into clear steps. Use bolding for key concepts. Ensure the connection to the Society for Psychical Research (SPR) is clear, as that's the context. (Sidgwick wants to justify investigating psychical phenomena without being gullible *or* dogmatically skeptical).

  8.  *(Final thought before generating output)*: Make sure to emphasize that Sidgwick is a *skeptic* too, just a different *kind* of skeptic (methodological vs. dogmatic). This fits the user's project theme well.

  9.  **Constructing the Output:** (Proceed to generate response based on these steps.)
answer: |-
  This is a fantastic passage to analyze for a National History Day project. It gets to the very heart of the methodological battle between 19th-century scientific materialism (represented by Hume's legacy) and the emerging field of psychical research (represented by Sidgwick and the SPR).

  You are right to sense that Sidgwick is making a subtle distinction. He is not claiming Hume is *factually* wrong about the world; he is claiming Hume is **logically imprecise** about how we define knowledge.

  Here is a step-by-step walkthrough of the argument, breaking down what Hume meant, how Sidgwick redefines the terms, and exactly what "work" this move is doing for Sidgwick's project.

  ### Step 1: Understand Hume's "Scale"
  To see Sidgwick's objection, we first have to be clear on what he is objecting to. In *An Enquiry Concerning Human Understanding*, David Hume argues that a "miracle" is a violation of the laws of nature.

  *   **Hume's Definition of Experience:** For Hume, "experience" isn't just what *I* have seen; it is the **uniform experience of all mankind throughout history.**
  *   **Hume's Equation:**
      *   Probability of Law of Nature holding true: 100% (based on uniform experience).
      *   Probability of a Miracle: 0% (because it contradicts that uniform experience).
      *   Probability of Witnesses Lying/Mistaken: High (because humans lie and err all the time).
  *   **Hume's Conclusion:** Since the probability of the miracle is effectively zero, no amount of testimony can ever outweigh it. It is always more probable the witness is wrong than that the law of nature was broken.

  Hume offers this as an "intellectual scale" that solves the problem immediately: **Testimony for a marvel always loses.**

  ### Step 2: Sidgwick's Semantic Shift
  Sidgwick accepts that we must weigh probabilities. But he attacks Hume's "scale." He asks: *What do we actually mean when we say a marvel is "contrary to experience"?*

  Sidgwick argues that Hume is smuggling a massive assumption into that phrase. Sidgwick breaks it down:
  1.  **Hume's Implication:** "Contrary to experience" means "Impossible because it violates a known, immutable law."
  2.  **Sidgwick's Correction:** "Contrary to experience" can logically mean nothing more than **"Unlike previous experience"** or **"Novel."**

  Sidgwick points out that we only possess "systematised" experience (science/history) up to the present moment. We do not possess experience of the future or of unobserved phenomena. Therefore, saying something is "contrary to experience" is just a fancy way of saying, "We haven't seen this specific thing before."

  ### Step 3: The Historical Argument (The "Work" Being Done)
  This is the crux of Sidgwick's move. He writes: *"in the course of the life of the human race... different portions of mankind have been continually coming across things that were at first entirely novel and strange, though further acquaintance has rendered them familiar."*

  Sidgwick is using the history of science to undermine Hume's logic.
  *   **Example:** To a European in 1400, the existence of the Americas was "contrary to experience." To a scientist in 1700, electricity was "contrary to experience." To a doctor in 1850, germ theory was "contrary to experience."
  *   **The Trap:** If those people had used Hume's scale, they would have had to reject the testimony of explorers, electricians, and microbiologists. They would have said, "It is contrary to experience that land exists there / sparks flow through wire / invisible animals cause disease."
  *   **Sidgwick's Point:** Just because something is **unprecedented** does not mean it is **impossible.** Hume conflates *novelty* with *impossibility*.

  ### Step 4: Answering Your Specific Questions

  **1. Is Sidgwick saying Hume's principle is simply wrong, or just weaker than it looks?**
  He is saying it is **epistemologically dogmatic.** He is arguing that Hume's principle pretends to be a logical rule, but it is actually an assumption that human knowledge is complete. Sidgwick is arguing that Hume's scale is broken because it treats our current ignorance as a law of the universe. He isn't saying miracles *do* happen; he is saying Hume's argument makes it *impossible to find out* if they happen.

  **2. If "contrary to experience" just amounts to being novel/unfamiliar, isn't that basically what Hume was already saying?**
  **No, and this is the most important distinction for your project.**
  *   **For Hume:** "Contrary to experience" = **A Contradiction.** (Like saying 2+2=5). It implies the event *cannot* happen.
  *   **For Sidgwick:** "Contrary to experience" = **An Absence.** (Like saying "I have never seen a purple cow"). It implies the event *has not been observed yet*.

  **The Work Sidgwick's Move Is Doing:**
  By shifting the definition from **Contradiction** to **Absence**, Sidgwick changes the probability math.
  *   **Hume's Math:** Probability of Marvel = 0. (Case closed).
  *   **Sidgwick's Math:** Probability of Marvel = Low, but > 0. (Case open).

  If the probability is greater than zero, you **must** weigh it against the testimony. You cannot dismiss it out of hand.

  ### Step 5: Why This Matters for the SPR (Context for your Project)
  This passage is the philosophical justification for the Society for Psychical Research's existence.

  In the late 19th century, mainstream scientists used Hume's argument to say, "Psychical research is a waste of time; telepathy is impossible because it contradicts physics."

  Sidgwick, as the SPR's first president, is using this address to say:
  1.  We are not gullible believers. We agree that marvels are highly improbable (novel/strange).
  2.  However, we reject the **dogmatic skepticism** that says investigation is pointless.
  3.  If the testimony is strong enough (e.g., rigorous experimental data), it can theoretically outweigh the improbability of the event, because the event is only "novel," not "impossible."

  ### Summary for your Project
  Sidgwick's objection is that Hume confuses **the limits of our current knowledge** with **the limits of reality.**

  *   **Hume:** "We have never seen a miracle, therefore they cannot happen. Testimony is always weaker than this fact."
  *   **Sidgwick:** "We have never seen a miracle, therefore it is unfamiliar. But humanity is constantly encountering the unfamiliar. Therefore, we must weigh the testimony on its own merits rather than dismissing it based on our current ignorance."

  Sidgwick is carving out a middle path between **credulity** (believing everything) and **dogmatic skepticism** (believing nothing that contradicts current science). He is arguing for **methodological openness.**
