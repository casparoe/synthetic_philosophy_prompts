          *   **Correction of Predecessors:** Sidgwick is explicitly correcting Malthusians and earlier utilitarians (like Mill, arguably, though Mill is complex) who focused on the *standard of living* (average) rather than the *aggregate good*. By writing it as a product, he shows *why* the average view is mathematically subordinate to the total view in this specific context.
