      *   *Let's try the "Actual" joke:* "To the actual bride and groom." (Philosophers know 'actual' is indexical, everyone else thinks it means 'real').
      *   *Wait, better:* "I know that among all the counterparts out there, *this* Rachel is the one I get to call sister."
      *   *Let's go with the "Concrete" joke.* Lewis insists worlds are *concrete*, not abstract.
