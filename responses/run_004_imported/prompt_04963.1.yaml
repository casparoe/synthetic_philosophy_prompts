answer: |-
  # The Cost of Honesty: A Defense of Imprecise Credences Against Pragmatic Objections

  In the vernacular of online rationality communities, "Knightian uncertainty" is often wielded as a get-out-of-jail-free card for when Bayesian updating feels too demanding. It suggests a realm of risk where probabilities simply do not exist. However, this blog-post shorthand obscures a rigorous debate in formal epistemology concerning the nature of rational belief. The core question is not whether uncertainty exists, but how it should be represented: as a single sharp probability function (the Bayesian orthodoxy) or as a set of functions (the imprecise probability framework championed by Isaac Levi and Peter Walley).

  Proponents of imprecise credences argue that a single number often lies about the state of one's evidence. Critics, most notably Adam Elga, argue that imprecise credences lead to decision-theoretic paralysis or exploitation. This essay argues that while Elga's objections expose severe pragmatic costs to imprecision, they do not refute its epistemic necessity. The strongest position is that rational credences *must* be imprecise in cases of structural ignorance, but this epistemic honesty requires a non-standard decision theory to avoid diachronic incoherence.

  ### The Epistemic Case: Evidence Sensitivity and the Ellsberg Intuition

  The argument for imprecise probabilities rests on the distinction between the *balance* of evidence and the *weight* of evidence. Consider two coins. Coin A is known to be fair. Coin B is biased, but you have no information regarding the direction of the bias. Standard Bayesianism, often invoking the Principle of Indifference, demands that you assign $P(Heads) = 0.5$ to both.

  Epistemologically, this is unsatisfying. Your confidence in the 0.5 assignment for Coin A is robust; for Coin B, it is fragile. If you were offered a bet on Coin A, you would take it readily. For Coin B, you might demur, not because you think tails is more likely, but because the evidence is too sparse to warrant a precise commitment. As Isaac Levi argued, a rational credal state should reflect the indeterminacy of the evidence. Representing Coin B with a credal set $C = \{p : p(Heads) \in [0, 1]\}$ captures this ignorance honestly, whereas the sharp value $0.5$ conflates ignorance with knowledge of fairness.

  This intuition is bolstered by the Ellsberg Paradox. In Ellsberg's urn cases, agents prefer betting on known probabilities over unknown ones, violating the Sure Thing Principle of Savage's expected utility theory. Imprecise probability theory validates this preference. If an agent's credal set is wide regarding the unknown urn, the lower prevision for winning the bet is low, rationally justifying the avoidance of the gamble. To force a sharp probability here is to force the agent to pretend they possess information they lack.

  ### The Pragmatic Attack: Elga and Dilation

  If the epistemic case for imprecision is strong, the pragmatic case against it is devastating. The challenge is not whether imprecise credences *describe* ignorance well, but whether an agent holding them can *act* rationally.

  Adam Elga's (2010) argument targets the link between credence and choice. Suppose your credal set for a hypothesis $H$ is $[0.4, 0.6]$. You are offered a bet that costs $\$0.45$ and pays $\$1.00$ if $H$ is true. Some functions in your set say this is a good bet (expected value $> 0$); others say it is bad. How do you choose?
  1.  **The Liberal Rule:** Accept the bet if *any* function in the set favors it. This leads to inconsistency. You might accept a sequence of bets that, taken together, guarantee a loss (a money pump), because different functions justify different steps in the sequence.
  2.  **The Conservative Rule:** Accept the bet only if *all* functions in the set favor it. This leads to inertia. As Elga demonstrates, this rule can cause an agent to turn down a "sure gain"—a sequence of bets that guarantees a profit—because no single probability function endorses the whole sequence, even though the set collectively acknowledges the profit.

  Elga concludes that to avoid these pathologies, subjective probabilities must be sharp. A rational agent must be able to pinpoint a single function to guide action, even if that function is chosen somewhat arbitrarily from the set of evidentially permissible options.

  Compounding this is the phenomenon of **dilation** (Seidenfeld and Wasserman). In certain imprecise models, conditioning on new evidence can strictly *widen* the credal interval. For example, let $H$ be a hypothesis with initial credence $[0.4, 0.6]$. You learn evidence $E$ which is probabilistically independent of $H$ on every precise measure in the set. Counter-intuitively, the updated credence $P(H|E)$ can dilate to $[0.1, 0.9]$. Learning $E$ makes you less certain about $H$. This violates the fundamental Bayesian intuition that evidence should refine belief, not degrade it. If updating can make you more ignorant, the normative force of conditionalization is undermined.

  ### Rescuing Imprecision: E-Admissibility and Secondary Orderings

  To save imprecise credences, one must reject the assumption that the credal set alone must dictate a unique choice. The most robust rescue attempt comes from refining Levi's theory of **E-admissibility**.

  Levi argues that an option is permissible if it maximizes expected utility relative to *at least one* probability-utility pair in the credal set. This avoids the inertia of the Conservative Rule. However, this leaves the agent with multiple permissible options, inviting Elga's sequential inconsistency charge. The rescue lies in adding a **secondary decision criterion**.

  When the primary criterion (maximizing expected utility over the credal set) fails to identify a unique option, the agent invokes a secondary rule, such as *minimax regret* or *security* (maximizing the minimum possible outcome). This creates a lexicographic decision procedure:
  1.  Eliminate options that are not E-admissible.
  2.  Among the remaining options, choose the one that maximizes security.

  This approach acknowledges Elga's point—that a raw credal set is insufficient for sequential choice—without abandoning imprecision. It treats the credal set as the representation of *evidence*, and the secondary rule as a representation of *ambiguity attitude*. By committing to a secondary rule beforehand, the agent avoids diachronic inconsistency. They are not flipping between "Liberal" and "Conservative" modes ad hoc; they are following a stable policy that respects the imprecision of their evidence while ensuring pragmatic coherence.

  Regarding dilation, the imprecise Bayesian must bite the bullet. Dilation occurs only when the relationship between the evidence and the hypothesis is itself ambiguous (e.g., the reliability of the source is unknown). In such cases, the widening interval is not a failure of rationality but an accurate reflection that the new evidence has highlighted the fragility of the prior assumptions. The "pathology" is only pathological if one assumes evidence must always reduce uncertainty; if evidence can reveal structural ignorance, dilation is a feature, not a bug.

  ### Verdict: Epistemic Necessity, Pragmatic Constraint

  The dispute between sharp and imprecise probabilities is often framed as a choice between coherence and honesty. The Bayesian prioritizes coherence (avoiding money pumps); the Imprecise theorist prioritizes honesty (representing ignorance).

  This essay's verdict is that **rational credences are required to be imprecise in cases of structural ignorance, but rational agency requires the imposition of a secondary decision rule to resolve that imprecision prior to action.**

  To demand sharp credences in the face of sparse evidence (like the unknown bias coin) is to demand that the agent hallucinate precision. It conflates the *absence of evidence* with *evidence of absence*. Therefore, the Bayesian orthodoxy is epistemically defective. However, Elga is correct that a raw credal set cannot guide sequential choice without risking incoherence. The imprecise theorist cannot simply say "anything in the set goes."

  Thus, the rational agent operates with a two-tier architecture. Their *doxastic state* is imprecise, faithfully mirroring the weight and balance of their evidence. But their *pragmatic stance* includes a commitment to a tie-breaking rule (such as maximin security) that collapses the set into a specific choice when stakes are high or sequences are involved. This accepts the "tax" on decision-making that imprecision imposes: it is harder to decide when you acknowledge your ignorance. But that difficulty is the price of intellectual honesty. We should allow credences to be imprecise, provided we are disciplined enough to bind our future selves with decision rules that prevent that imprecision from becoming exploitation.
