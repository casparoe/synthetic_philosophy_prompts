answer: |-
  This is a fantastic rabbit hole to fall into, especially with a background in hard science. You've hit on one of the most contentious debates in modern decision theory. As a chemist, you're actually uniquely positioned to understand the core disagreement, because it mirrors a debate you likely encountered in physical chemistry: **Statistical Mechanics (Ensembles) vs. Kinetics (Trajectories).**

  Here is the breakdown of the fight between Ole Peters (Ergodicity Economics) and Paul Samuelson (Expected Utility Theory), and the answer to your specific question: *Is the logarithm a preference, or is it a law of dynamics?*

  ### 1. The Core Disagreement: Ensembles vs. Time

  To understand the fight, you have to look at how they define "average."

  **The Setup:**
  Imagine a bet where you flip a coin.
  *   Heads: Wealth multiplies by 1.5 (+50%)
  *   Tails: Wealth multiplies by 0.6 (-40%)

  **Expected Utility Theory (Samuelson):**
  Samuelson looks at the **Ensemble Average**. If 1 million people take this bet once, what is the average wealth of the group?
  $$E[W] = 0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$$
  The expected return is +5%. A risk-neutral agent (linear utility) should take this bet. If you don't take it, EUT says you are "risk-averse," implying you have a concave utility function (like $U(W) = \ln W$) that penalizes the downside more than it values the upside.

  **Ergodicity Economics (Peters):**
  Peters looks at the **Time Average**. If *one* person takes this bet 1 million times in a row, what happens to their wealth?
  Because wealth changes multiplicatively, you don't add the returns; you compound them. The long-term growth rate is determined by the geometric mean:
  $$G = \sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95$$
  The time-average growth is -5% per round. If you take this bet repeatedly, you go to zero almost surely.

  **The Conflict:**
  *   **Samuelson** says: "The bet has positive expected value. If you refuse it, it's because you subjectively dislike risk."
  *   **Peters** says: "The bet has negative time-average growth. If you take it, you will go bankrupt. It's not about risk preference; it's about the math of non-ergodic processes."

  ### 2. Is Log Utility "Sneaking In"?

  This is your central question. In Expected Utility Theory (EUT), maximizing the geometric mean is mathematically identical to maximizing the expected value of a logarithmic utility function ($E[\ln W]$).

  Samuelson's critique was essentially: **"You aren't discovering a new law of physics; you're just assuming everyone happens to have logarithmic utility."** He argued that rationality is about consistency of preferences, not about a specific growth objective. If an investor has a short time horizon, or can pool risk with others (like an insurance company), the ensemble average *is* the relevant metric, and maximizing arithmetic expected value is rational.

  Peters' counter-argument is ontological. He claims the logarithm isn't coming from a psychological utility function $U(W)$; it is coming from the **observable function of the dynamic**.

  In a multiplicative process, wealth evolves as $W_{t+1} = W_t \cdot x$.
  To find the growth rate, you must look at $\ln(W_{t+1}) - \ln(W_t) = \ln(x)$.
  The logarithm appears because it is the function that turns multiplicative dynamics into additive dynamics, allowing you to calculate a time average.

  **So, is it sneaking in?**
  *   **From Samuelson's view:** Yes. You are implicitly choosing an objective function (long-term growth) which is equivalent to log utility.
  *   **From Peters' view:** No. You are measuring a physical property of the system (the Lyapunov exponent of the wealth trajectory). The log is the *metric*, not the *preference*.

  ### 3. The Chemist's Analogy

  Since you're a chemist, this analogy might click better than the economic jargon:

  *   **Samuelson is doing Statistical Mechanics.** He cares about the partition function, the ensemble of all possible microstates, and the average energy of the system at equilibrium. This works beautifully for gases in a box (ergodic systems), where a single particle's time average equals the ensemble average.
  *   **Peters is doing Kinetics/Path Integrals.** He cares about the specific trajectory of a single molecule through a non-equilibrium landscape. If the landscape has a sink (bankruptcy), the ensemble average might say "the molecule is usually high up," but the trajectory says "this specific molecule fell in the hole and never came out."

  In thermodynamics, we know that for non-ergodic systems (like glasses or complex polymers), ensemble averages can be physically meaningless for predicting the behavior of a single sample. Peters argues the economy is a glass, not an ideal gas.

  ### 4. Who Has the Better of It?

  It depends on the domain.

  **Samuelson Wins When:**
  1.  **Risk is Poolable:** If you are an insurer writing policies across uncorrelated risks, the Law of Large Numbers applies. The ensemble average becomes your reality. You *should* maximize expected value.
  2.  **Short Horizons:** If you are making a one-off decision and won't face the compounding consequences, the time-average growth rate is less relevant than the immediate expected payoff.
  3.  **Subjective Value:** If utility really *isn't* wealth. If I bet my life savings on a coin flip, the loss isn't just numerical; it's catastrophic to my well-being in a way that isn't captured by wealth dynamics alone. EUT handles subjective "pain" better.

  **Peters Wins When:**
  1.  **Repeated Multiplicative Bets:** This is poker, trading, and venture capital. If you bet full Kelly (or over-bet) based on ensemble expectations, you risk "gambler's ruin." Peters provides the physical justification for the Kelly Criterion without needing to assert "I happen to love log wealth."
  2.  **Macro-Economics:** Standard models often assume representative agents that behave according to ensemble averages. Peters shows this leads to policy errors because it ignores that individuals cannot average out systemic risk over time.
  3.  **Existential Risk:** In scenarios where ruin is absorbing (you can't recover), the time average is the *only* average that matters.

  ### 5. The Verdict

  Samuelson was right that **rationality is not monolithic.** There is no universal law that forces an agent to maximize time-average growth. An agent is "rational" if they satisfy their own axioms of preference. If I want to gamble my fortune on a positive expected-value bet that will likely bankrupt me, EUT says that's fine provided my utility function reflects that desire for glory.

  However, Peters is right that **neoclassical economics made a category error.** They treated non-ergodic economic processes as if they were ergodic. They assumed that because the *market* might grow (ensemble), the *individual* will grow (time).

  **The Synthesis:**
  The "Geometric Rationality" crowd isn't saying Samuelson's math is wrong; they are saying his **mapping to reality** was loose.
  *   **EUT:** "I maximize $E[U(W)]$." (Requires specifying $U$)
  *   **Ergodicity:** "I maximize the time-average growth rate of $W$." (Derives $U$ from dynamics)

  If you view decision theory as a branch of **physics** (how systems evolve), Peters is superior. The log criterion is forced on you by the multiplicative nature of wealth accumulation if survival is a constraint.
  If you view decision theory as a branch of **philosophy** (how agents ought to choose), Samuelson holds ground, because "survival" is just one possible preference among many.

  **Practical Advice for a Retired Chemist:**
  In poker and investing (your current hobbies), **Peters/Kelly is the practical winner.** The world is non-ergodic; you only live one life. You cannot rely on the ensemble average to save you from ruin. The logarithm isn't a preference; it's the shape of the compounding reality you inhabit.

  Samuelson won the Nobel Prize and defined the 20th century, but in the 21st century, as we deal with complex, path-dependent systems (climate, inequality, crypto, AI), the ergodicity critique is increasingly viewed as the necessary correction to the standard model. Samuelson mocked the simplicity of the argument, but in science, the simple model that matches the data usually beats the complex one that doesn't.
