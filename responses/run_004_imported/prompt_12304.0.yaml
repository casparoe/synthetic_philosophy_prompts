answer: |-
  Good evening. For those of you who don't know me, I'm a friend of Priya's. And for those of you who *do* know me, you're probably wondering why I'm holding a microphone, given that at the rehearsal dinner last night, I spent two hours arguing with the bride about whether or not she actually exists.

  To be precise, we were arguing about mereology. That's the branch of metaphysics that asks the Special Composition Question: "Under what conditions do some parts add up to a whole?" When do a bunch of atoms become a chair? When do two people become a couple?

  Tomorrow, the officiant is going to say, "The two shall become one." It's a beautiful sentiment. But as of last night, this room is metaphysically divided.

  About a third of you are nodding along. You know that Priya defends *mereological nihilism*. She believes composition *never* happens. There are no chairs, there are no tables, and strictly speaking, there is no "Priya-and-Daniel." There are just simples arranged Priya-wise, and simples arranged Daniel-wise, and tomorrow they will be arranged marriage-wise. For Priya, the ceremony changes the arrangement, but it doesn't bring a new object into existence.

  Then there's me. I was arguing for Peter van Inwagen's view. I agree with Priya that a marriage doesn't create a new object, but for a different reason. Van Inwagen says composition only occurs when the activity of parts constitutes a *life*. A human being is a life, so humans exist. A marriage is not a biological organism. So, metaphysically, I agree: The "Couple" is not a thing.

  And then, I see our friend Sarah in the back, from Priya's old department. Sarah is an *unrestricted composition* universalist. She thinks *any* two things make a whole. So, in her view, Priya and Daniel have been a single object since the day they met. The wedding is ontologically redundant. Sarah, if you're crying, I hope they're tears of logical consistency.

  Now, for the two-thirds of the room currently checking their watches: I know this sounds insane. You're thinking, "Who cares if 'The Couple' is a real object? They love each other."

  And that is exactly why this debate is the perfect structure for this toast. Because how you answer the Special Composition Question tells you what you value about a relationship.

  If Priya is right—if there is no "whole"—then love isn't about losing yourself in another person. It's not about merging into a single blob until you can't tell where one ends and the other begins. It's about two distinct, autonomous entities choosing, every single day, to align their trajectories. It respects the integrity of the individual. It says, "I do not need to consume you to be with you."

  If I'm right—if composition requires a *life*—then marriage isn't a noun, it's a verb. You don't *become* one thing and then rest. You have to *do* the work. Composition is an activity. It means the "oneness" isn't a status you achieve tomorrow; it's a practice you maintain. It's in the feeding, the caring, the arguing, and the making up. The "life" of the marriage only exists as long as you actively constitute it.

  And if Sarah is right—if you've always been one object—then this is destiny. It means the universe was already holding you together before you even knew it.

  So, tomorrow, when the officiant says, "The two shall become one," we have a choice. We can treat it as a metaphysical claim, in which case, depending on where you sit, it is either false, category-mistaken, or trivial.

  Or, we can treat it as a promise.

  Priya, Daniel: The metaphysics doesn't matter. Whether you are one object, two objects, or a plural reference, the reality of what you are building is undeniable to everyone in this room. You don't need ontology to validate your commitment.

  Priya, you may believe there is no such thing as a whole, but I have never seen two parts fit together better. Daniel, you may not know van Inwagen from a vending machine, but you understand that a life is constituted by activity, and I have never seen anyone more active in their love for her.

  So, here is to the Special Composition Question. May your answer change every day. May you sometimes feel like one distinct entity, moving through the world with a single purpose. May you other times feel like two distinct individuals, giving each other the space to grow. And may you always, always engage in the *activity* that makes the distinction irrelevant.

  To Priya and Daniel.
