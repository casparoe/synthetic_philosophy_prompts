prompt: |-
  So for my philosophy of religion module we've been going over logical positivism and I can't stop thinking about the whole Ayer near-death experience thing lol. In Language, Truth and Logic he's pretty firm that statements about survivng your own death are unverifiable and therefore literally meaningless, not even false, just nonsense. But then in 1988 he actually flatlines for like 4 mins after choking on smoked salmon, and writes up this essay ("What I Saw When I Was Dead") about a red light and some "ministers" in charge of the universe, and afterward says the experience slighty weakened his confidence that death is just the end of him. Can you compare his early verificationist take on life-after-death talk with what he actually said post-NDE? Did he basically contradict his own earlier philosophy there, or is there a way to read his later comments that's still consistent with strict verificationism? Not interested in the tabloid "atheist meets God" spin, more what's actually going on philosophically.
