  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Decision Framework and the Independence Axiom

  ### Executive Summary

  At our recent retreat, the board encountered a classic decision-theoretic tension: the Allais Paradox. When presented with paired grant choices, the majority preferred certainty in high-probability scenarios but preferred higher expected value (EV) in low-probability scenarios. This pattern violates the **Independence Axiom** of Expected Utility Theory (EUT).

  Some members have proposed a standing rule binding all future grant comparisons to the Independence Axiom to ensure rational consistency and avoid exploitability. Others argue that for a small foundation making high-stakes, non-repeatable bets, risk-weighting is a valid strategic posture.

  **Recommendation:** I recommend that we **adopt Expected Value Maximization as our binding default standard**, which effectively requires adherence to the Independence Axiom in grant-level decisions. However, I recommend we codify a narrow exception clause for scenarios involving existential risk to the foundation itself, managed through explicit board vote rather than heuristic discretion.

  This approach aligns with our Effective Altruism (EA) mission to maximize impact, prevents cognitive biases from eroding our capital, and addresses risk through portfolio management rather than grant-level aversion.

  ### Context: The Allais Pattern

  During the retreat, the board faced two choices:
  1.  **Certain 1,000 lives** vs. **89% chance of 1,000 + 10% chance of 5,000 + 1% chance of 0.** (Majority chose Certain)
  2.  **11% chance of 1,000** vs. **10% chance of 5,000.** (Majority chose 10%/5,000)

  Mathematically, these choices are inconsistent under Expected Utility Theory. If you prefer the certain 1,000 in Choice 1, you should logically prefer the 11% chance of 1,000 in Choice 2. By switching preferences, we exposed ourselves to the charge of irrationality. The proposal on the table is to bind ourselves to the Independence Axiom to prevent this inconsistency in the future.

  ### Rationale for Recommendation (Binding to Independence/EUT)

  I recommend binding our grantmaking to the Independence Axiom (via Expected Value Maximization) for three primary reasons:

  **1. Mission Alignment and Moral Linearity**
  As an Effective Altruism foundation, our core mandate is to do the *most* good, not merely *secure* good. In global health and biosecurity, a life saved is morally equivalent regardless of the probability attached to it. Preferring a certain 1,000 lives over a gamble with an expected value of 1,490 lives (0.89*1000 + 0.10*5000) implies that the marginal value of the additional 490 expected lives is negative simply because they are uncertain. Over the long term, adhering to EV maximization saves more lives. If we systematically reject positive-EV gambles due to risk aversion, we leave significant impact on the table.

  **2. Protection Against Cognitive Bias**
  The Allais Paradox is widely documented in behavioral economics as a cognitive bias (the "certainty effect"), not a revealed preference. Humans are hardwired to overvalue certainty. By binding ourselves to the Independence Axiom, we insulate our decision-making from emotional swings that favor "safe" grants over "high-upside" grants. Without this rule, we risk drifting toward conservative grantmaking that feels prudent but fails to maximize our counterfactual impact.

  **3. Avoiding Exploitability and Inconsistency**
  Theoretical exploitability (money pumps) is a proxy for internal inconsistency. If our preferences violate the Independence Axiom, our decision-making is logically incoherent. While a small foundation is unlikely to face a literal money-pump in the market, inconsistency undermines our strategic planning. It makes it impossible to construct a coherent long-term portfolio if our risk tolerance shifts arbitrarily based on how choices are framed. A binding rule ensures that our risk posture is a feature of our *portfolio*, not a bug of our *psychology*.

  ### Fair Hearing: The Case Against Binding (Risk-Weighted Utility)

  I want to give full weight to the arguments raised by those opposing a binding rule, particularly those citing Lara Buchak's *Risk-Weighted Expected Utility* (REU) and the specific constraints of our foundation.

  **1. Rational Risk Aversion (Buchak's Framework)**
  Proponents of this view argue that risk aversion is not a bias to be corrected, but a basic rational attitude. Buchak demonstrates that an agent can consistently prefer certainty without violating rationality axioms, provided they use a risk-weighted function rather than a standard utility function. For a board member, it may feel intuitively rational to say, "I would rather guarantee 1,000 lives than gamble on 5,000," regardless of the EV. Binding us to EUT dismisses this intuition as error, whereas REU treats it as a valid expression of our risk attitude.

  **2. The "Small Foundation" Constraint**
  The standard EA argument for EV maximization assumes we can pool risk across many bets or that the market will absorb volatility. We are a small foundation making rare, high-stakes bets. If we take a 10% risk of saving *no one* on a flagship biosecurity project, and that 10% realizes, we may lose donor confidence, operational capacity, or the ability to fund future work. In this context, the utility function is not just "lives saved"; it is "lives saved *by us*." If the foundation ceases to function effectively due to a string of bad luck on high-variance grants, our long-term impact drops to zero. Risk aversion, therefore, acts as a hedge on our own sustainability.

  **3. Non-Repeatability**
  The Law of Large Numbers justifies EV maximization only over repeated trials. If we only make five major grants a year, we cannot rely on the average to converge. In non-repeatable scenarios, maximizing the *median* outcome or securing a *threshold* of impact may be more rational than maximizing the *mean*. A binding rule forces us to ignore the statistical reality of our small sample size.

  ### Implementation and Risk Mitigation

  To reconcile the need for EV maximization with the legitimate concern for foundation survival, I propose the following implementation strategy:

  1.  **Binding Default:** All grant comparisons must be evaluated using Expected Value as the primary metric. Deviations require explicit justification.
  2.  **Portfolio-Level Risk Management:** We should manage risk at the portfolio level, not the grant level. We can allocate a specific percentage of our capital (e.g., 20%) to "high-variance, high-EV" biosecurity bets, while the remainder funds "lower-variance, proven" global health interventions. This allows us to capture upside without jeopardizing the foundation's existence.
  3.  **The "Existential Exception":** If a grant decision poses a credible threat to the foundation's operational continuity (e.g., reputational ruin if the gamble fails), the board may vote to override the EV recommendation. This exception must be minuted and treated as a strategic constraint on our *capital*, not a rejection of the *value of lives*.

  ### Conclusion

  While the arguments for Risk-Weighted Utility are philosophically coherent, adopting them as a standing rule opens the door to the very biases Effective Altruism seeks to overcome. For a foundation dedicated to doing the most good, Expected Value Maximization must remain our North Star.

  By binding ourselves to the Independence Axiom as a default, we ensure consistency and maximize our expected impact. By managing risk through portfolio allocation rather than grant-level heuristics, we address the legitimate concerns regarding our size and sustainability without abandoning our core mission.

  I move that we adopt Expected Value Maximization as our binding decision framework, subject to the portfolio and existential exceptions outlined above.
