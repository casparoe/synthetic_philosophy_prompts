          *   *Reclamation:* Identity-based gating. Pragmatic view supports this best (speaker intent).
          *   *Dogwhistles:* This is the hard part. Semantic/Prohibitionist fail completely. Pragmatics helps (intent detection).
      *   *Section 3: The Bonus Question.*
          *   Theories describe *state*, not *evolution*.
          *   Need to introduce "Adversarial Dynamics" or "Code Switching."
          *   The "Hydra Effect" (ban one, two more appear).
      *   *Section 4: Practical Recommendations.*
          *   Don't pick one theory. Hybrid approach.
