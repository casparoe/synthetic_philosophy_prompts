          *   *Orthodox Kantian (OK):* Defends the traditional reading (only rational beings are ends-in-themselves, duties to animals are indirect duties to humanity).
          *   *Korsgaardian Kantian (KK):* Defends Korsgaard's argument from *Fellow Creatures* (the argument for humanity as an end-in-itself extends to animals because they share the relevant feature of having a "natural good").
      *   **Constraints:**
