  2.  **Deconstruct the Philosophical Positions:**
      *   **Orthodox View:** Kant's Formula of Humanity applies to *rational nature*. Animals lack autonomy/rationality. Therefore, they are things, not persons. Cruelty to animals is wrong only because it damages the agent's moral character (duty to self).
      *   **Korsgaard's View:** Kant argues humanity is an end-in-itself because rational agents must value their own humanity as the source of all value. But rational agents are also *animals* with a natural good (pain/pleasure, flourishing). If we value our own natural good as objectively good (not just subjectively), consistency demands we value the natural good of other sentient beings who also have a natural good. Thus, direct duties arise from the structure of valuing itself.

  3.  **Drafting - Exchange by Exchange:**

