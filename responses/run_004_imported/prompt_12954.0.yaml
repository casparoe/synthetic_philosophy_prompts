prompt: |-
  A friend from my old decision theory reading group is getting married next month and asked me to give the toast. She's obsessed with Kavka's toxin puzzle -- the one where a billionaire pays you a fortune just for sincerely intending to drink something nasty, not for actually drinking it -- so I want to build the speech around it somehow. Problem is half the room is old philosophy people who'll catch every reference, and the other half is her family, who's never heard of Gregory Kavka in their life. Can you write me a 4-5 minute toast that actually uses the puzzle's specific weirdness -- intending now to do something you'll have zero incentive to follow through on later -- to say something true about the two of them, without it turning into a decision theory lecture for the half of the room that didn't sign up for one?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a friend from a decision theory reading group.
      *   **Theme:** Kavka's Toxin Puzzle (intending to drink a toxin for a reward, where the reward is given for the *intention*, not the *action*, making the intention irrational because you won't actually drink it).
      *   **Audience:** Mixed (50% philosophy nerds, 50% normal family/friends).
      *   **Constraint:** 4-5 minutes spoken (approx. 600-750 words).
      *   **Goal:** Use the specific logic of the puzzle (intention vs. action, commitment without immediate incentive) to say something meaningful about the couple, without boring the non-philosophers.

  2.  **Deconstruct Kavka's Toxin Puzzle (for the writer):**
      *   *The Setup:* A billionaire offers you $1 million if you *intend* at midnight to drink a toxin tomorrow noon. The toxin makes you sick but isn't lethal.
      *   *The Catch:* The money is deposited in the morning *before* you drink. Once you have the money, you have no reason to drink the toxin (it just makes you sick).
      *   *The Paradox:* Since you know you won't drink it tomorrow (because there's no incentive), you can't genuinely *intend* to drink it tonight. Therefore, you can't get the money.
      *   *The Core Tension:* Rationality vs. Commitment. How do you bind yourself to a future action that seems irrational in the moment?

  3.  **Bridge to Marriage:**
      *   *The Connection:* Marriage is essentially a binding commitment to a future action (staying together) when future incentives might change.
      *   *The Twist:* In the Toxin Puzzle, the rational agent *fails* because they can't commit. In marriage, the successful couple *succeeds* because they *can* commit.
      *   *The "Toxin":* Hard times, sickness, "in poorer," "in sickness." The stuff you don't *want* to do but promise to do anyway.
      *   *The "Reward":* The relationship itself, but specifically the security of knowing the other person *will* stay, even when it's hard.
      *   *Resolution:* Love isn't about calculating incentives in the moment; it's about changing your own future incentives so that keeping the promise *becomes* rational. Or, simpler: Love is the ability to intend what logic says you might not do.

  4.  **Drafting - Section by Section:**

