      *Revised Angle:* The puzzle asks: Can you intend to do something you know you won't do? Marriage answers: We intend to do something hard, and we make sure we *do* do it, because the "payment" isn't upfront, it's the life we build. Actually, better: The puzzle says you can't commit to a future cost without a future benefit. Marriage says: We commit to the cost *because* the benefit is us.

      *Let's try this angle:* The puzzle is about the gap between *planning* and *doing*. Marriage closes that gap.

