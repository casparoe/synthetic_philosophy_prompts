      *   **The Turn (Applying to Marriage):** Why is this relevant? Marriage vows look like the puzzle. You promise to stay even when it's hard.
      *   **The Insight (The "True Thing"):** In the puzzle, the rational person fails. In love, you succeed by *becoming* the kind of person who ignores the rational calculation. The "intention" is the hard part, but unlike the puzzle, you actually *do* follow through.
      *   **The Couple:** Specific praise for the partner. How they make the commitment easy.
      *   **The Toast:** Raise a glass.

      *   *Self-Correction on Tone:* Avoid jargon like "expected utility" or "counterfactuals." Keep it emotional. The philosophy is the vehicle, not the destination.

  5.  **Drafting - Content & Pacing (Iterative Process):**

      *   *Intro:* "For those who know [Bride's Name], you know she loves a paradox."
      *   *The Puzzle:* "Imagine a billionaire..." Keep it under 45 seconds.
      *   *The Problem:* "Why can't you do it? Because tomorrow, you'll have the money and no reason to drink."
      *   *The Marriage Link:* "Vows are similar. You promise to care for someone when they're sick, broke, annoying. Future You has no incentive to do that. Present You is betting Future You will do it anyway."
      *   *The Resolution:* "Kavka thought this was impossible for a rational agent. But love makes it possible. Love changes the payoff matrix." (Too technical?) -> "Love changes who you are."
      *   *The Couple:* "[Groom's Name], you make the intention easy."
      *   *Closing:* "To the intention, and the action."

  6.  **Refining for the Audience Split:**
      *   Make sure the philosophy folks nod at the accuracy (it *is* about intention vs. action).
      *   Make sure the family folks hear a love story (it's about sticking together through hard times).
      *   *Key Insight:* The puzzle is about the *impossibility* of intending without acting. Marriage is the *triumph* of intending *and* acting, because the "reward" isn't external money, it's the shared life.

  7.  **Final Polish (Checking Word Count and Flow):**
      *   Ensure the transition from "poison" to "marriage vows" isn't too dark. Frame the "toxin" as "hardship."
      *   Make sure the punchline lands.
      *   Check timing. 700 words is about 4.5 minutes at a moderate speaking pace.

