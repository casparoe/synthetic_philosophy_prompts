answer: |-
  The room smelled of ozone and old paper, a strange combination for the Bureau of Personal Continuity. Arthur sat in the chair, the leather cool against his palms. Across the small, circular table sat nothing but a empty chair and a humming column of glass.

  "Remember," the adjudicator said from the booth behind the one-way mirror. "The Segmentation Interface doesn't show you a memory. It renders the temporal part. Do not speak to it as if it is you. Speak to it as if it is a brother you share a spine with."

  Arthur nodded, though his stomach turned. He was here for a Declaration of Discontinuity. Five years ago, Arthur—let's call him Arthur-5—had made a series of reckless investments that bankrupted his family. The Arthur sitting here today, Arthur-0, was a different man. He was cautious. He was humble. He woke up in a cold sweat thinking about numbers, whereas Arthur-5 had slept soundly while signing the checks.

  Under the Continuity Act, if Arthur could prove he was a distinct temporal entity from Arthur-5, he could sever the debt. He wouldn't have to pay. But his wife, Elena, had to witness the segmentation. She stood by the wall, her arms crossed, her face unreadable. She was the creditor, emotionally if not legally.

  "Initiating," the adjudicator said.

  The glass column flared. Light coalesced, knitting together bone, muscle, fabric. In the empty chair sat Arthur. But it wasn't *him*. It was Arthur-5. He wore the loud tie Arthur used to love. He sat with the slouch Arthur had spent three years correcting in physical therapy. He looked arrogant. He looked whole.

  Arthur-0 (the real Arthur) felt a vertigo that had nothing to do with balance. It was the sensation of looking at his own left hand while standing on his right foot. There was a connection, certainly. They belonged to the same organism. But they were not the same thing.

  "Hello," Arthur-5 said. His voice was deeper, less strained. "You look tired."

  "I am tired," Arthur-0 said. "I'm tired of paying for your mistakes."

  Arthur-5 laughed, a sound that grated on Arthur-0's nerves. "My mistakes? *Our* trajectory. You're just the end of the line cleaning up the beginning."

  "This is the Temporary Intrinsic test," the adjudicator's voice cut in. "Arthur-0, state your property."

  "I am repentant," Arthur-0 said, his voice shaking. "I am risk-averse. I am fearful of loss."

  "Arthur-5, state your property."

  "I am ambitious," the projection said, leaning forward. "I am confident. I am indifferent to risk."

  The adjudicator paused. "One object cannot be both risk-averse and indifferent to risk. One object cannot be bent and straight at the same time. If you are the same object, you possess contradictory properties. If you are distinct temporal parts, the contradiction dissolves."

  Arthur-0 looked at Elena. She hadn't moved. This was the crux of it. If perdurantism was true—if they were just slices of a space-time worm—then Arthur-0 wasn't responsible. The slice that made the bet was gone, excised from the present moment like a tumor. He was a new slice, clean and straight.

  But if endurantism was true—if he was wholly present at every moment—then the man who signed the checks was fully here, right now, in the marrow of his bones. The guilt wasn't a memory; it was a constituent part of his substance.

  "Does it matter?" Elena asked. Her voice was quiet, but it silenced the hum of the machine.

  The adjudicator cleared his throat. "Mrs. Vance, the question is metaphysical. We need to know if the liability persists."

  "I'm asking him," she said, nodding at Arthur-0. Then she looked at Arthur-5. "And him."

  She walked over to the table. She placed her hand on the table, right between the two men.

  "Arthur-5," she said. "Do you love me?"

  The projection smiled, that old, charming, dangerous smile. "Of course. You're my wife. I'm building an empire for us."

  "And you, Arthur-0?"

  Arthur-0 looked at his hands. They were the same hands. The scar on the thumb was identical. "I love you. But I'm terrified I'll lose you."

  "See?" Arthur-5 said. "He's weak. I was strong for both of us."

  "You were reckless for both of us," Arthur-0 snapped.

  Elena didn't blink. "If I forgive Arthur-5, does it count for Arthur-0? If I kiss him..." She reached out and touched the shoulder of the projection. Her fingers passed through the light, disturbing the photons. She pulled her hand back and touched Arthur-0's shoulder. The fabric was solid. Warm. "...does the touch travel down the worm?"

  "That's not how the physics works," the adjudicator said, sounding annoyed.

  "I didn't ask the physics," Elena said. "I asked the metaphysics."

  Arthur-0 felt the weight of the question pressing against his ribs. If he was a worm, then Elena was walking along the length of him, touching different segments. Some segments were smooth, some were jagged. To love the worm was to love the jagged parts as much as the smooth ones. To love the segment was to accept that it would rot and be replaced.

  "I don't know," Arthur-0 whispered.

  Arthur-5 leaned back, looking bored. "I don't care. I'm five years dead. Let me go."

  "That's the thing," Elena said. She turned to the glass booth. "Turn it off."

  "Mrs. Vance, we are in the middle of a—"

  "Turn it off."

  The hum died. The projection of Arthur-5 flickered and vanished. The chair was empty. The ozone smell lingered.

  Arthur-0 sat alone, but he didn't feel whole. He felt truncated. He felt like a sentence cut off before the period. He looked at Elena.

  "If I say you're the same man," Elena said, walking over to him. She placed her hands on his face. Her thumbs traced the lines around his eyes that hadn't been there five years ago. "Then you carry the debt. You carry the shame. You are the man who almost ruined us."

  Arthur closed his eyes. "And if I'm not?"

  "Then you're a stranger who happens to have my husband's memories. A stranger who gets to live in my house and sleep in my bed, but who owes me nothing because he didn't break the promise."

  She pulled back slightly. "One of those men I can forgive. The other I can't. One of those men I married. The other I'm just housing."

  Arthur opened his eyes. He wanted to tell her he was the same. He wanted the comfort of endurantism, the solidity of a soul that persists through fire. But he remembered the feeling in the chair, the vertigo of seeing his past self as a separate object. He remembered how easy it was to look at Arthur-5 and feel no pain, only pity. That detachment felt like a lie. But the pain felt like a trap.

  "What do you need me to be?" Arthur asked.

  Elena dropped her hands. She looked at the empty chair where the projection had been, then back at him.

  "I need to know if the promise I made was to a moment, or to a duration." She picked up her coat. "The Bureau will send the paperwork. You can check the box for Discontinuity. You can walk away from the debt. Legally, metaphysically, they'll accept it. They'll say you're a new slice."

  She walked to the door, then stopped. She didn't turn around.

  "But when you come home tonight, Arthur, I won't know which part of the worm is walking through the door. And I won't know if I'm supposed to lock the door against you, or open my arms."

  She left. The door clicked shut.

  Arthur sat in the silence of the room. He looked at his hands. He flexed his fingers. They bent. They straightened. He was here, wholly. He was here, partially. He was the debt, and he was the repayment.

  He reached for the pen on the table to sign the Declaration of Discontinuity. He hovered the ink over the paper. He could feel the weight of the man in the other chair, the one who was gone, pressing down on his wrist, or perhaps pulling him forward. He couldn't tell if the resistance was gravity, or guilt, or just the friction of time itself.

  He put the pen down. He didn't sign. He didn't leave. He just sat there, waiting to see if he would age into the next moment, or if the next moment would arrive without him.
