      *(Refining (c))*: Millikan's "derived proper function" is the key here. A new concept is a mapping produced by a learning mechanism. The learning mechanism has a proper function. The output inherits a derived function. Dretske just says "recruitment." Dretske is arguably more naturalistic about *individual* learning, while Millikan ties it back to *species* history.

