answer: |-
  Do **not** join this bet. Your teammate is falling for a classic probability trap, and his reasoning contains a fatal flaw. While his Expected Value (EV) calculation is technically correct in a vacuum, it is the **wrong metric** for repeated compounding bets.

  Here is the breakdown of why he is losing money, why the math actually guarantees he will go to zero, and the specific concept he is missing.

  ### 1. The Trap: Arithmetic Mean vs. Geometric Mean
  Your teammate is calculating the **Arithmetic Expected Value**.
  *   **Heads:** $1.00 \times 1.6 = \$1.60$
  *   **Tails:** $1.00 \times 0.5 = \$0.50$
  *   **Average:** $(\$1.60 + \$0.50) / 2 = \$1.05$

  He sees a 5% average return per round and assumes his money will grow by 5% every flip. This is true **only if you bet a fixed dollar amount** (e.g., betting $10 from your wallet every time, not reinvesting winnings).

  However, he is **reinvesting 100% of his pot**. This means his wealth grows (or shrinks) multiplicatively. For compounding, you must look at the **Geometric Mean**.

  Let's look at what happens after just **two rounds** (one Head, one Tail). The order doesn't matter:
  *   Start: $\$100$
  *   Flip 1 (Heads): $\$100 \times 1.6 = \$160$
  *   Flip 2 (Tails): $\$160 \times 0.5 = \$80$

  Even though he won one and lost one (a 50/50 split), he has **lost 20% of his money**.
  Mathematically: $1.6 \times 0.5 = 0.8$.

  Every time a Head and a Tail pair up, his bankroll is multiplied by **0.8**. Over a "couple of months" of daily flips, he has likely seen roughly equal Heads and Tails. His money hasn't grown; it has been multiplied by 0.8 dozens of times. That is why he is down to almost nothing.

  ### 2. The Volatility Drag
  The core issue is that **losses hurt more than gains help** when compounding.
  *   If you lose 50%, you need a **100% gain** to get back to even.
  *   This game only gives you a **60% gain**.

  Because the upside (60%) is not large enough to offset the downside (50%) over a sequence of wins and losses, the long-term trajectory for a 100% bettor is mathematically guaranteed to trend toward zero. This is often called **volatility drag** or **variance drain**.

  ### 3. The Concept: Ergodicity
  Your teammate is confusing two different types of averages:
  1.  **Ensemble Average (EV):** If 1,000 people play this game **once**, the average wealth of the group goes up. (Some people will get lucky and flip 10 Heads in a row and win massive amounts, skewing the average).
  2.  **Time Average:** If **one person** plays this game **1,000 times**, their individual wealth goes to zero.

  This system is **non-ergodic**. The average outcome of the group does not equal the outcome of the individual over time. He is betting his own trajectory against a group average.

  ### 4. Is the bet ever winnable? (The Kelly Criterion)
  Interestingly, the game *does* have a positive edge, but only if you manage your bet size correctly. To maximize long-term growth in a compounding scenario, you use the **Kelly Criterion**.

  Without getting into the calculus, the optimal fraction of your bankroll to bet in this specific scenario is approximately **16.7%**.
  *   If you bet 16.7% of your pot each round, you will compound wealth over time.
  *   If you bet 100% of your pot each round, you will suffer "gambler's ruin."

  ### The Verdict
  Your teammate is not a victim of "bad variance." He is a victim of bad math. He is applying additive logic to a multiplicative process.

  *   **His claim:** "The math guarantees I'll come out on top eventually."
  *   **Reality:** The math guarantees he will go to zero eventually if he keeps betting 100%.

  **Advice:** Tell him he needs to study **Geometric Brownian Motion** or the **Kelly Criterion**. Do not give him your money. If you want to win the lunch bet, offer to take the other side of his wager, but only if he agrees to bet 100% of his pot again. He's mathematically guaranteed to lose.
