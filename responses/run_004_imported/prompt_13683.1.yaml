answer: |-
  **Elias:** You're staring at the water again.

  **Sarah:** I'm running the simulation. One lifeboat. Six people in the water. Five clustered on the port side, one on the starboard. You can reach one group or the other. The engine fails in ten minutes.

  **Elias:** And you're hesitating because you think you ought to save the five.

  **Sarah:** I'm hesitating because I think it would be a moral catastrophe to flip a coin and leave the five to drown.

  **Elias:** But why? Taurek asked this forty years ago, and I still think the answer holds. Look at the situation from the perspective of the loss. If the one dies, he loses his life. If the five die, *each of them* loses his life. There is no "super-person" composed of five parts who loses "five lives." There are only five individuals, each suffering a loss identical in kind and magnitude to the single stranger. Where is the extra weight?

  **Sarah:** The weight isn't in the "loss" as a metaphysical object, Elias. It's in the claims. Each of the six has an identical claim to be rescued. If I flip a coin between the *groups*—heads I save the one, tails I save the five—I am giving the single stranger a 50% chance of survival. But I am giving each member of the five a 50% chance as well.

  **Elias:** Exactly. Equal concern for each.

  **Sarah:** No. If I treat the groups as the units of the coin flip, I am effectively silencing four of the claims. Imagine I tell the five, "I am going to flip a coin. If it lands heads, I save this one person, and all five of you die." Each of the five can rightly ask: "Why does *his* claim to life outweigh the combined weight of our five identical claims?" You say there is no combined weight. I say there is a procedural obligation to honor each claim equally.

  **Elias:** But combining them *is* the aggregation you claim to avoid. If you say "five claims outweigh one," you are summing them. You are treating the five as a container of value. Taurek's point was that we must not lose sight of the separateness of persons. To save the five *because* they are five is to use the one as a mere means to the end of "maximizing saves."

  **Sarah:** I'm not summing value. I'm summing probabilities. Look, let's meet on the mechanism. You agree we shouldn't just save the five deterministically?

  **Elias:** Not if the only differentiating factor is numbers. If the one had a special need, or was a child while the five were elderly, maybe. But qua strangers? No. The fair procedure is a coin flip between the options. Save-A or Save-B. 50/50.

  **Sarah:** Okay. Here is the crux. Suppose instead of flipping a coin between *options*, I put six tickets in a hat. One ticket for the stranger. Five tickets for the group. I draw one ticket. Whoever holds the winning ticket gets the lifeboat seat. If the stranger's ticket is drawn, he lives, the five die. If one of the five tickets is drawn, that specific person lives... wait, no, that doesn't work with the lifeboat constraint.

  **Elias:** Right, it's all or nothing. The lifeboat holds one group or the other.

  **Sarah:** Fine. Adjust the lottery. I assign a probability of rescue to each *individual* based on a fair distribution of chances. I give each of the six people an equal chance of being the "decider." Or simpler: I acknowledge that saving the five gives each of the five a chance of life. If I save the five, five claims are satisfied. If I save the one, one claim is satisfied. To respect each person equally, I should maximize the probability that *any given individual* is saved.

  **Elias:** That sounds utilitarian in a trench coat.

  **Sarah:** It's not. It's contractualist. Scanlon would say: What principle could no one reasonably reject? If I propose the 50/50 coin flip between groups, any of the five can reasonably reject it. They can say, "You are giving my life the same weight as his, but you are grouping me with four others and then discarding us as a block. Why not give us each a 1/6 chance of being the *reason* we save the group?"

  **Elias:** I see where you're going. You want a weighted lottery. You want to give the option to save the five a 5/6 probability, and the option to save the one a 1/6 probability.

  **Sarah:** Precisely. One ticket per person. Six tickets total. The "Save the Five" option holds five tickets. The "Save the One" option holds one. We draw a ticket. If it belongs to the group of five, we save them.

  **Elias:** And you think this avoids aggregation? Sarah, look at the math. You've just conceded that numbers count.

  **Sarah:** I've conceded that *people* count.

  **Elias:** If I give the "Save the Five" option five times the probability of the "Save the One" option, I am treating the number of people as a multiplier for moral force. If the numbers didn't count, the probability should be 1/2. By moving to 5/6, you are admitting that the presence of the second, third, fourth, and fifth person adds something to the moral equation.

  **Sarah:** It adds nothing to the *weight* of the claim. Each claim is still weight-one. But it changes the *distribution* of satisfaction. Think of it this way: In the 50/50 coin flip, the single stranger has a 50% chance. Each of the five has a 50% chance. In the weighted lottery, the single stranger has a 16% chance. Each of the five has an 83% chance.

  **Elias:** Wait. In your weighted lottery, does the single stranger's chance drop?

  **Sarah:** Yes. Because there are six people total. If we treat every person's interest as equal, the probability of the outcome favoring a specific person should be proportional to the number of people favoring that outcome.

  **Elias:** This is where Taurek would dig his heels in. If the stranger's chance drops from 50% to 16% simply because five others showed up, you have penalized him for their presence. You have made his moral standing contingent on the crowd size.

  **Sarah:** No, his standing is constant. His *influence on the outcome* is diluted by the equal standing of others. In the 50/50 flip, you are artificially inflating his influence. You are giving him veto power over the five that he wouldn't have if they were considered individually.

  **Elias:** But consider the "no loss" comparison. Taurek argues that the five do not suffer a "greater loss" than the one. They suffer *parallel* losses. If I adopt your weighted lottery, I am acting *as if* the parallel losses sum to a greater tragedy. If I draw the stranger's ticket and he dies, do you regret it less than if I drew one of the five's tickets and the group died?

  **Sarah:** I regret the death equally. But I regret the *procedure* if it didn't give everyone the best ex-ante chance.

  **Elias:** But why is the ex-ante chance the metric? If there is no impersonal standpoint where "five deaths" is worse than "one death," then there is no impersonal standpoint where "maximizing survival rates" is the goal. The goal is to treat each person with equal respect.

  **Sarah:** And equal respect requires that I don't privilege the one over the many.

  **Elias:** Does it? Suppose I flip the 50/50 coin. I am saying: "Stranger, your claim is equal to any one of theirs. Group of Five, your collective claim is not greater than his individual claim, because there is no collective claimant." That seems like the ultimate respect for separateness. If I switch to your weighted lottery, I am saying: "Stranger, your claim is equal to one of theirs, but since there are five of them, their combined voice shouts louder." You are creating a collective voice to drown him out.

  **Sarah:** I'm not creating a collective voice. I'm counting hands. Imagine a vote. If we voted on who gets the lifeboat, and everyone voted for themselves, the five would outvote the one.

  **Elias:** But morality isn't a vote! The one stranger has a right to life that cannot be voted away by a majority. That's the whole point of rights-based ethics versus utilitarianism. If five people need a kidney and one healthy person has two, the five cannot vote to take one of his.

  **Sarah:** This isn't the kidney case. In the kidney case, you're harming the one to save the five. Here, nature is going to harm six people. I am the rescuer. I am distributing a scarce resource: rescue. In distribution problems, isn't it fair to give each person an equal share of the probability?

  **Elias:** If the resource were divisible, yes. Give each a slice of the lifeboat. But it's not. It's binary. And in binary choices, your "equal share of probability" requires reducing the one's chance to 1/6. You are sacrificing his ex-ante security for their ex-ante security.

  **Sarah:** I am balancing six equal ex-ante securities against one.

  **Elias:** There you go! "Six against one." You've aggregated them again. You can't have it both ways, Sarah. You can't say "numbers don't metaphysically aggregate" and then "but procedurally we should weight by numbers." If the procedure yields the utilitarian result 83% of the time, the distinction is cosmetic.

  **Sarah:** It's not cosmetic. It matters for the 17%.

  **Elias:** How so?

  **Sarah:** If the stranger's ticket is drawn, and I let him die to save the five... wait, no. If the stranger's ticket is drawn, I save the stranger. The five die. In a utilitarian calculus, I made the wrong choice. I minimized lives saved. I should feel regret. I should feel I failed the math.

  **Elias:** And in my view?

  **Sarah:** In your view, or rather, in the weighted lottery view, I feel no regret. I honored the procedure. Each person had an equal shot. The fact that the five died is a tragedy, but not a *mistake*. The numbers influenced the odds, but they didn't dictate the outcome.

  **Elias:** But why set the odds at 5/6? Why not 51/49? If you aren't aggregating value, where does the 5/6 come from? It comes from the count. It comes from the fact that there are five of them. So the number *does* count. It counts as a ticket.

  **Sarah:** The number counts as a headcount of moral patients, not a sum of moral value. It's the difference between "five pains are worse than one" and "five people have a claim, one person has a claim."

  **Elias:** But if the five claims don't sum to a heavier weight, why do they command more probability? If I have five reasons to go to the park, and you have one reason to go to the beach, and the reasons are of equal strength... do I flip a coin? Or do I go to the park because there are more reasons?

  **Sarah:** You go to the park because satisfying five preferences is better than satisfying one, *ceteris paribus*.

  **Elias:** Aha! "Better." Better for whom? There is no one for whom it is better. The one person on the beach is just as disappointed as any one of the five at the park would be.

  **Sarah:** It's better from the standpoint of impartiality.

  **Elias:** Impartiality is the impersonal standpoint Taurek rejected! He said there is no "impartial spectator" who feels the sum of the pain. There are only the spectators.

  **Sarah:** Elias, if you stick to the 50/50 coin flip, you are implicitly adopting a standpoint. You are saying the *option* to save the one is equal to the *option* to save the five. But options aren't moral patients. People are. By equalizing the options, you are unequalizing the people. You are giving the one person 50% of the moral influence, and forcing the other five to share the remaining 50%. That gives the one person five times the voting power of each member of the group.

  **Elias:** I'm not giving him voting power. I'm acknowledging that his claim is not defeasible by mere headcount.

  **Sarah:** But in a rescue scenario, headcount is the only relevant differentiator. If you deny it counts, you aren't protecting the one; you're privileging him.

  **Elias:** Or, I am refusing to let the many tyrannize the few, even in probability space. If I adopt your lottery, I have accepted that the presence of others diminishes my standing. If I am drowning, and five others appear, my chance of rescue drops from 50% to 16%? That makes my right to life contingent on competition.

  **Sarah:** Your right to life isn't contingent. Your chance of *being the deciding factor* is. Look, we're going in circles. You think the weighted lottery concedes aggregation. I think the coin flip conceals inequality.

  **Elias:** It seems we agree on the inputs. Six people. Equal value per person. No impersonal sum.

  **Sarah:** And we agree on the goal. Fairness. Equal respect.

  **Elias:** But we disagree on whether fairness is a relation between *choices* or between *claimants*.

  **Sarah:** If I treat the choices as the units, I get 50/50. If I treat the claimants as the units, I get 5/6.

  **Elias:** And the question remains: Can you treat the claimants as units without summing their claims? If you put five tickets in the box, aren't you summing their entitlement to be rescued into a single probability mass?

  **Sarah:** I'm summing their tickets, not their worth.

  **Elias:** And what is a ticket, if not a unit of worth in this context?

  **Sarah:** It's a unit of presence.

  **Elias:** (Sighs) Presence. That's the word, isn't it? Taurek says presence doesn't aggregate. You say presence accumulates probability.

  **Sarah:** I say presence accumulates *claims to consideration*.

  **Elias:** And if the claims don't weigh more, why does the consideration shift?

  **Sarah:** Because consideration is distributed, not weighed.

  **Elias:** Then we are back to the start. Is the distribution of consideration a function of the number of consider-ees?

  **Sarah:** Yes.

  **Elias:** Then numbers count.

  **Sarah:** Only as a denominator, Elias. Never as a numerator.

  **Elias:** (Looks at the water) I'm not sure the drowning man cares about the difference.

  **Sarah:** No. But the person flipping the coin does. And that's where the philosophy lives.
