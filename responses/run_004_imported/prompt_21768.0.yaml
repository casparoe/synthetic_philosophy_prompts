answer: |-
  **Rochester, New York**
  **May 1851**
  **The offices of *The North Star***

  The air in the room is thick with the smell of printer's ink and coal smoke. Outside, the street noise of Rochester is a dull roar, but inside, the silence is heavy. FREDERICK DOUGLASS stands by the window, his back to the room. WILLIAM LLOYD GARRISON sits at the table, a copy of the Constitution folded neatly before him like an indictment.

  **GARRISON**
  You have changed the masthead, Frederick. But you have not changed the sky.

  **DOUGLASS**
  (Turning)
  The sky is the same, Mr. Garrison. It is the compass that has shifted.

  **GARRISON**
  A convenient shift. One that points you toward the ballot box and away from the fire. Do you remember the Fourth of July, 1847? In Boston? You stood before me and called this document "a covenant with death and an agreement with hell." You said the Union was a rope of sand. You said no man could swear to support this Constitution without making himself a sharer in the sin of slavery.

  **DOUGLASS**
  I remember what I said. I also remember what I have learned since. I have studied the law, William. Not the practice of the slaveholder, but the text itself.

  **GARRISON**
  (Slams a hand on the table)
  The text! You speak of the text as if it were a hymnbook and not a bill of sale. Look at it. Article I, Section Two. "Three-fifths of all other Persons." They did not even have the courage to say "slave." They turned a human being into a fraction to swell the representation of the tyrant. How is that not pro-slavery?

  **DOUGLASS**
  It is a compromise, I grant you. A vile one. But look closer. It does not say "slave." It says "persons." It acknowledges their humanity even while counting them for representation. And look to Article I, Section Nine. The migration or importation of such *persons* as any of the states now existing shall think proper to admit. It expires in 1808. It is a death warrant for the trade, not a life sentence for the institution.

  **GARRISON**
  You are parsing syntax while men are being whipped. The Fugitive Clause, Frederick. Article Four. "No person held to service or labour in one state... escaping into another, shall... be discharged from said service or labour." It commands the free North to hunt the black man. It makes every citizen a catchpole. If the text commands sin, the text is sinful.

  **DOUGLASS**
  (Steps closer to the table)
  It says "held to service." It does not say "held as a slave." If a man is held to service by law, that law must be just. But the Constitution guarantees due process. The Fifth Amendment. No person shall be deprived of liberty without due process of law. Slavery is deprivation of liberty without process. Therefore, the Constitution, rightly interpreted, forbids slavery. The framers used euphemisms because they were ashamed. They knew slavery was wrong. They hoped it would die. We should not kill the hope because the fathers were cowards.

  **GARRISON**
  (Stands, pacing)
  Ashamed? They were calculating. They bartered the bones of millions for a union of commerce. And now you propose we use their barter as a weapon? This is not interpretation, Frederick. This is alchemy. You are trying to turn lead into gold so that you might vote in a government built on blood.

  **DOUGLASS**
  And what is your purity worth?

  **GARRISON**
  It is worth my soul.

  **DOUGLASS**
  It is worth nothing to the man in chains! You say "No Union with Slaveholders." You say dissolve the Union. If the North secedes, what happens to the slave? The South keeps the Constitution, keeps the army, keeps the fugitive law, and has no Northern agitators to bother them. The slave is abandoned. Your interpretation liberates the conscience of the abolitionist, but it tightens the shackles of the bondman.

  **GARRISON**
  (Stops pacing, eyes narrow)
  There it is. The strategy. I suspected it. You do not believe the Constitution is anti-slavery. You believe it is *useful* to claim it is.

  **DOUGLASS**
  I believe the law is a weapon. If I find a sword in the enemy's camp that bears the inscription "Liberty," I will not throw it in the fire because the enemy used it to kill. I will turn the edge toward them.

  **GARRISON**
  But if the sword is rusted through? If the inscription is a lie? Then you fight with a broken blade and you will cut your own hand. You are compromising with the very mechanism of your oppression. You sound like the politicians we despised. The Free Soilers. The compromisers.

  **DOUGLASS**
  (Voice rises)
  I sound like a man who wants results! For ten years I followed you. I preached disunion. I burned copies of the Constitution. And where are the slaves? Still in the field. The moral suasion has not moved the master. He hears your sermons and laughs. But he fears the law. He fears the vote. If I can convince a white man in Ohio that voting for a slaveholder violates *his* Constitution, I gain an ally. If I tell him the Constitution is hell, he tells me he is a patriot and walks away.

  **GARRISON**
  So we lie to the patriot to save the slave?

  **DOUGLASS**
  We interpret the law in the light of justice, not in the shadow of the framers' intentions. What they *did* is less important than what the words *say*. "We the People." Not "We the Whites." "Secure the Blessings of Liberty." Not "Secure the Blessings of Liberty for some." The preamble is the rule; the clauses are the exceptions. We must read the exceptions narrowly and the rule broadly.

  **GARRISON**
  (Sits back down, weary)
  You speak of reading the rule broadly. I read the blood broadly. Frederick, I know you. I know your mind. You are not merely a legalist. You are angry. You are tired of being the student. You want to be the leader. To lead, you need a party. To have a party, you need a platform. To have a platform, you need the Constitution.

  **DOUGLASS**
  (A long pause. He looks at Garrison, not with anger, but with a sad clarity.)
  Perhaps. Does that make the argument wrong?

  **GARRISON**
  It makes the motive suspect. If you change your theology to fit your congregation, are you a preacher or a showman?

  **DOUGLASS**
  If the congregation is starving, and I find a new path to bread, I will lead them there, even if I preached fasting yesterday. You stand on the shore and shout at the ocean to recede. I am building a boat. You call the boat a compromise with the water. I call it the only way across.

  **GARRISON**
  The boat is built of timber from the slave-master's yard.

  **DOUGLASS**
  Then I will sail it anyway.

  **GARRISON**
  (He stands, picking up his hat. He looks at the Constitution on the table, but does not touch it.)
  You were the greatest voice I ever heard. You spoke truth to power without blinking. Now I fear you are blinking at the truth to woo power.

  **DOUGLASS**
  I am blinking at nothing. I see the thing as it is. You see the sin of the origin. I see the potential of the instrument. We both want the same end, William.

  **GARRISON**
  Do we? I want the destruction of a sinful system. You want the capture of a government. One of these things requires the Constitution to be burned. The other requires it to be worshipped.

  **DOUGLASS**
  I do not worship it. I wield it.

  **GARRISON**
  (At the door)
  Be careful, Frederick. When you wrestle with the beast, do not be surprised if you begin to love its strength. I shall pray that your new path does not lead you back into the house of bondage you seek to destroy.

  **DOUGLASS**
  And I shall pray, William, that your purity does not leave you alone in a free heaven, while the slaves remain in hell.

  Garrison opens the door. The street noise rushes in, drowning the silence. He does not look back. Douglass remains standing, his hand resting on the printed page of the Constitution. He does not move to pick it up, nor to push it away. He simply stares at the words, as if trying to force them to yield their secret by the weight of his gaze.

  **[SCENE END]**
