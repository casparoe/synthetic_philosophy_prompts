answer: |-
  Good evening, everyone. For those of you who don't know me, I'm a friend from Priya and Teo's PhD cohort. Which means I am part of the one-third of this room that is currently nodding along, and I am acutely aware of the two-thirds of you who are politely wondering if you should have studied harder in high school physics.

  I promise to keep the math light. But I also promise to keep the philosophy honest, because that is what this couple deserves.

  Priya and Teo met in a seminar on general covariance. For the rest of the family: that is a technical way of saying they met while arguing about whether the "stage" of the universe is real, or if only the "actors" matter. Priya argues the stage is real, but the points on it have no names. Teo argues the stage is just a web of relations between the actors. They have been debating this for a decade. It is the spine of their intellectual life, and remarkably, it is also the secret to their marriage.

  When Teo proposed, he joked that he loved Priya "regardless of which diffeomorphism she turns out to be." About a third of you laughed. The rest of you smiled the smile of someone watching two people exchange keys to a car you don't drive. But that joke contains the key to why I am standing here today, and why I am going to break a cardinal rule of wedding toasts.

  Priya and Teo have asked me not to say that their marriage was "meant to be," or "written in the stars." Usually, a speaker treats that request as a obstacle. I treat it as a physics problem.

  To say a couple is "meant to be" is to commit what philosophers call *haecceitism*. It implies that there is a primitive label attached to the universe that says "Priya and Teo go here." It implies that if you shuffled the coordinates of their lives—different cities, different jobs, different timelines—you would have a *different* reality, a lesser one.

  But the Hole Argument—the very argument that brought them together—teaches us the opposite. The Hole Argument shows that if you worry about "which point is which" in spacetime, you end up with indeterminism. You lose the ability to predict the future. Priya and Teo solved this. Priya says the points have no identity. Teo says the points aren't individuals. They disagree on the ontology, but they agree on the result: Shifting the coordinates does not change the physics.

  So, here is the truth, stripped of the haecceitism you both despise: I cannot tell you that you were destined. Destiny assumes the coordinates matter. But looking at you two, I can tell you something stronger.

  Teo joked about diffeomorphisms. But the real insight of the Hole Argument is that while the coordinates are arbitrary, the *intervals* are real. The distance between two points is invariant. You can shift the manifold, you can drag the fields, you can change the gauge. But the spacetime interval remains the same.

  Priya and Teo, your love is not a coordinate. It is an invariant. It does not depend on the "where" or the "when" or the "fate" of the universe. It is the structural constant that holds true across every possible model of your lives.

  For the parents and cousins in the room: That means you don't need to worry about whether they were "lucky" to find each other. Luck is for gamblers. This is geometry.

  So, I will not toast to the stars, because the stars are just a manifold, and they have no names. I will not toast to fate, because fate is just haecceitism dressed up as romance.

  Instead, I ask you to raise your glasses to the invariant interval. To the structure that holds. To Priya and Teo: May your future be undetermined, may your coordinates be flexible, and may the distance between you always remain zero.

  To Priya and Teo.
