prompt: |-
  I'm reporting on the epistemology of conspiracy theories, and Karl Popper's name keeps coming up as the philosopher who first put principled skepticism toward them on rigorous philosophical footing. My understanding is that his objection to what he called "the conspiracy theory of society," laid out in The Open Society and Its Enemies, was essentially an application of his falsifiability criterion: because such theories can absorb any disconfirming evidence as proof of a still-deeper cover-up, they can never be tested and therefore fail to qualify as genuine explanations. Before I put this in print, could you help me verify that this is in fact Popper's argument, and clarify why it's held up as the definitive philosophical case against conspiratorial reasoning?
