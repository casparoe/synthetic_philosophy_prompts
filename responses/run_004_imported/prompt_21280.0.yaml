      *   *Constraint Check:* The user needs a verdict for their editor. I can't hedge too much. I need to say "View X fits the data better, *but* View Y is heuristically necessary."
      *   *Decision:* The **Dennettian/Real Patterns** view fits the *empirical reality* better. The Realist view fits the *research methodology* better.
      *   *Refining the Verdict:* The prompt asks which one the *empirical mess* fits better. That points squarely to Dennett. Superposition and polysemanticity are death knells for strict ontological realism about "features" as discrete, pre-existing objects. They are emergent, context-dependent, and basis-relative.

