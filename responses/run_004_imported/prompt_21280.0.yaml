          *   *Implication:* Polysemanticity and basis dependence aren't problems to be solved; they are inherent to the system. Different bases reveal different valid patterns for different purposes.

  3.  **Evaluate Against Empirical Evidence:**
      *   **Superposition:** Neural networks represent more features than dimensions. This means features *cannot* be orthogonal/localized in a simple way. They interfere. This challenges the "distinct organelle" view.
      *   **Polysemanticity:** Single neurons fire for unrelated concepts. This challenges the "one neuron = one feature" idea.
      *   **Basis Dependence:** SAEs (Sparse Autoencoders) find features, but different runs or architectures find *different* features that all work. There isn't a single "God's eye" decomposition.
