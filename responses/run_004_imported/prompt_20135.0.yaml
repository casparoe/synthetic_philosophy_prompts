      *Critique 2:* Better. Need to ensure the language isn't *too* jargon-heavy for grandma. "Focus and field" might be too Ames-specific? Maybe keep it to "narrative" or "story." Actually, "focus and field" is a signature Ames concept. If half the room is his cohort, using it correctly will earn major points. I should use it but explain it simply.

  6.  **Refining the Philosophy (Ames/Rosemont Specifics):**
      *   *Radical Relationality:* We are the roles we live.
