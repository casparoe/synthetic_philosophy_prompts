answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Groom]'s older sibling.

  When [Groom] asked me to give this toast, he gave me a set of instructions. They were… specific. He told me that if I called him and [Fiancee] "soulmates," or said they were "two halves of a whole," or suggested that they "complete" each other, he would be contractually obligated to unplug the microphone.

  Now, usually, that's just a groom being difficult. But in this case, it's actually philosophy. As many of you know, [Groom] has spent the last few years deep in comparative philosophy, specifically looking at how we understand being a person.

  In the West, we tend to think of ourselves as individuals first—self-contained units who then go out and choose relationships. Like we're billiard balls rolling around until we collide. But [Groom]'s work, drawing on Confucian role ethics, suggests something different. It suggests that we don't *have* relationships; we *are* our relationships.

  You aren't a "self" who then becomes a brother, a son, or a partner. You are the sum of those roles. You are constituted by the people around you.

  So, looking at [Groom] and [Fiancee], I'm not going to talk about how they found their missing piece. Because they aren't missing anything. Instead, I want to talk about what they are building.

  I've watched them together over the last few years. What strikes me isn't how well they "fit" together, as if they were static objects. It's how they *grow* each other. When [Groom] is with [Fiancee], he is a better brother, a better son, and a sharper thinker. And [Fiancee], you bring out a kindness and a focus in him that simply didn't exist before you entered the picture.

  In this view, marriage isn't a contract between two independent parties. It's a shared narrative. It's agreeing to co-author a story where the characters are defined by their commitment to one another.

  Now, [Groom] also told me to avoid the old traditional frameworks about duty and hierarchy. And he's right. The roles they are stepping into aren't pre-written scripts from a century ago. They are writing the role of "partner" in real-time. It's not about one leading and one following. It's about what the philosophers call "mutual cultivation." It's the understanding that the only way to be a good person is to stand in a relationship that demands the best of you.

  To the philosophy students here: You'll recognize this as moving from an ontology of substances to an ontology of events.

  To the rest of the family: It means that love isn't something you find. It's something you *do*, every day, that changes who you are.

  [Groom] and [Fiancee], you are not two individuals starting a journey. You are already a center of gravity, a new focus in the field of all our lives. My wish for you is that you continue to define each other with generosity, patience, and joy. May your roles be many, and may the relationship that constitutes them always be growing.

  Please raise your glasses. To [Groom] and [Fiancee], and to the people they are becoming together.
