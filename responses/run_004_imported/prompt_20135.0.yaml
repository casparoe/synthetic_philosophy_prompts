      *   **Key Constraint 2 (Social/Historical):** Must *avoid* traditional *Wu Lun* (Five Relationships) framing, specifically the hierarchical/gendered husband-wife dynamic. No "obedient wife" or patriarchal overtones.
      *   **Audience:** Mixed. 50% philosophy cohort (will spot inaccuracies or superficiality), 50% family/grandparents (need emotional resonance, accessibility).
      *   **Tone:** Sentimental but intellectually honest, warm, inclusive, not overly academic but not dumbed down.

  2.  **Deconstruct Confucian Role Ethics (Ames/Rosemont):**
      *   *Core Idea:* We are not discrete entities who *then* enter relationships. We are the sum of our roles (son, brother, friend, partner). To be a person is to play a role well.
      *   *Key Metaphor:* Focus on *process* and *growth* rather than *state* and *finding*. It's not about finding a missing piece; it's about growing a shared path.
