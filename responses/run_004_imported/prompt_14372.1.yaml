answer: |-
  **Title:** The Accountant of Empire: Why Adam Smith Critiqued Mercantilism, Not Imperialism

  **Introduction**

  The debate you and Priya had at the bar is a rite of passage for anyone studying the History of Economic Thought. It touches on the central tension in interpreting Adam Smith: is he a radical proto-socialist/anti-imperialist whose insights were sanitized by later capitalists, or is he a pragmatic bourgeois reformer whose moral qualms were always secondary to systemic efficiency?

  Priya has the better quotes; you have the better grasp of his policy prescriptions. Priya points to Smith's moral outrage; you point to his political reformism. To settle this, we cannot simply tally up "anti-empire" quotes versus "pro-empire" quotes. We must understand *why* Smith objected to the British Empire of his day.

  Here is the verdict: **Adam Smith should not be read as a genuine anti-imperialist in the modern sense. He is a critic of the *mercantile system* that powered the empire, not of imperial domination itself.** He opposes empire because it is economically inefficient and politically corrupting to the *metropole* (Britain), not primarily because it violates the rights of the *periphery* (the colonies). He provides the ammunition for anti-imperialism, but he did not load the gun with that intent.

  **The Case for Priya: The Moral and Economic Indictment**

  Priya is right that *The Wealth of Nations* (1776) contains passages that read like they were written by a post-colonial critic. In Book IV, Chapter VII, Smith delivers a scathing indictment of the European presence in the East and West Indies. He writes:

  > "The savage injustice of the Europeans rendered an event, which ought to have been beneficial to all, ruinous and destructive to several of those unfortunate countries."

  This is not the neutral language of an economist observing market forces. This is moral condemnation. Smith explicitly links the monopoly of the East India Company (EIC) to the devastation of Bengal, including the great famine of 1770. He argues that a company of merchants is incapable of acting as a sovereign power because their incentive structure is fundamentally opposed to the welfare of the subjects they rule. They seek profit, not stability.

  Furthermore, Smith's cost-benefit analysis of the American colonies is devastating to the imperial project. He argues that Britain derives no economic benefit from the colonies once the cost of their defense and administration is tallied. He famously states that Britain has no "empire" over America, only "the project of an empire." He suggests that if the colonies refuse to contribute to the revenue of the mother country, Britain should let them go, as retaining them by force would be a drain on British capital.

  To Priya, this looks like a call for decolonization. Smith is saying: *This system is unjust, it is bankrupt, and it is based on a lie.*

  **The Case for You: The Reformist and the Realist**

  However, your skepticism is grounded in Smith's actual policy proposals, which stop short of liberation. The most glaring evidence is Smith's solution to the American crisis. He does not advocate for American independence as a moral right. Instead, he proposes a grand political integration: give the American colonies proportional representation in the British Parliament.

  > "If it was possible... that each province should be so taxed... and... represented... the union would be perfect."

  This is the plan of an imperial federalist, not an anti-imperialist. Smith wants to save the British polity by integrating the colonies, not by releasing them. He only accepts separation as a pragmatic fallback if the political union proves impossible. He views the colonies as potential partners in a greater British state, not as distinct nations with an inherent right to self-determination.

  Then there is the issue of slavery. You noted that Smith calls slavery economically irrational (arguing that free labor is ultimately cheaper than slave labor because slaves have no incentive to work hard). In *The Theory of Moral Sentiments*, he calls it a violation of natural liberty. Yet, in *The Wealth of Nations*, he never calls for immediate abolition. He treats slavery as a market distortion that will eventually wither away as inefficient economies are outcompeted. He fears the economic shock of emancipation more than he demands the moral imperative of freedom. An anti-imperialist views the subjugation of people as the primary evil; Smith views the subjugation of *markets* and *capital* as the primary evil.

  **The Synthesis: Mercantilism vs. Empire**

  So, who wins? To decide, we have to distinguish between **Mercantilism** and **Imperialism**.

  Mercantilism is the economic theory that wealth is finite, trade is zero-sum, and the state must monopolize colonial trade to accumulate gold. Imperialism is the political project of extending sovereignty over foreign territories.

  Smith's war is entirely against Mercantilism. He believes that if you remove the monopolies (like the Navigation Acts and the EIC charter), trade becomes positive-sum. If trade is positive-sum, Britain can get rich *without* politically dominating America or India.

  Here is the crux of the argument: **Smith opposes the British Empire of 1776 because it is a Mercantile Empire.** He believes that political domination is unnecessary for economic prosperity. In fact, political domination is dangerous because it invites war and corrupts the British constitution (via the patronage of the EIC).

  However, Smith does not argue that empire is *inherently* illegitimate. He argues that *this specific empire* is mismanaged. If the colonies could be taxed fairly and represented in Parliament, Smith implies the empire would be sustainable. If the East India Company were stripped of its sovereign powers and trade were opened, he implies commerce could continue without the "savage injustice."

  Smith's moral outrage regarding the "savage injustice" is genuine, but it is secondary to his fear for British liberty. He worries that the corruption required to run an empire will destroy the freedom of the British people at home. The suffering of the Bengali or the American is a tragic symptom of a system that is also hurting the British taxpayer.

  **The Verdict**

  You should tell Priya that she is right about Smith's **diagnosis**, but you are right about his **prescription**.

  Smith is not an anti-imperialist. An anti-imperialist believes that political domination of one people by another is inherently wrong. Smith believes that political domination is inherently *expensive* and *corrupting*.

  If Smith believed that a reformed, non-mercantilist empire could be profitable and administratively stable, he would have supported it. His proposal for colonial representation in Parliament proves this. He wanted to integrate the periphery into the core, not liberate the periphery from the core.

  Therefore, the most accurate reading is this: **Adam Smith is the first great critic of the *Mercantile System*, but not of *Empire* as such.**

  He dismantled the economic justification for the 18th-century British Empire (that colonies are necessary for wealth), which inadvertently made the empire indefensible. But he did not do so out of a commitment to national self-determination or racial equality. He did it because he thought the British government was bad at accounting and prone to corruption.

  **Ammo for Your Next Drink**

  If Priya argues that the "savage injustice" line proves his anti-imperialism, tell her: *Smith condemns the injustice because it reveals the corruption of the merchant-sovereign, not because he advocates for Indian sovereignty.*

  If she argues that his call to drop America proves he wanted decolonization, tell her: *Smith only supported letting America go after he proposed making them vote in the British Parliament first. He wanted a United Kingdom of the Atlantic, not independent USA.*

  If she argues he hated slavery, tell her: *Smith thought slavery would die out because it was bad for GDP, not because it was a sin that required immediate repentance.*

  **Conclusion**

  Smith is a radical in the history of economics, but a moderate in the history of politics. He provided the intellectual tools that later anti-imperialists would use to dismantle the British Empire, but he wielded those tools to prune the empire, not to uproot it. He is not a secret anti-imperialist; he is a public anti-mercantilist. The distinction matters, because it reminds us that criticizing the *efficiency* of oppression is not the same as opposing the *morality* of oppression.

  Buy the next round, admit you were half-right, and concede that Priya gets the moral high ground, but you get the textual accuracy. Smith didn't want to end the empire; he just wanted to balance its books.
