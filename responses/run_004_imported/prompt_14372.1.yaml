      *   *Refined Thesis:* Smith should be read as a **critic of mercantile imperialism, but not of empire as such.** He dismantles the economic logic of the 18th-century British Empire without necessarily endorsing a universal right to independence or equality. He is an anti-imperialist by *accident* of economic logic, not by *design* of moral philosophy.

