answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Risk Assessment Oversight Board
  **FROM:** [Your Name], Resident Ethicist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Contract Renewal for [Vendor Name] Risk Assessment Tool

  **Recommendation**
  I recommend the Board **vote against renewing the contract** for the current algorithmic risk-scoring module. We should authorize a 12-month transitional extension solely to allow the court to develop a non-algorithmic, individualized assessment protocol, after which the tool's risk scores must no longer inform detention decisions.

  **The Mathematical Constraint**
  Both proposals currently on the table treat the disparity in False Positive Rates (FPR) as an engineering error that can be tuned. It cannot. As the audit confirms, rearrest base rates differ significantly between Black and White defendants in our jurisdiction, largely due to historical disparities in policing and prosecution rather than underlying behavior.

  Mathematical impossibility theorems (e.g., Kleinberg et al., 2016; Chouldechova, 2017) demonstrate that when base rates differ, it is statistically impossible to simultaneously satisfy *Calibration* (Predictive Parity) and *Error Rate Balance* (Equalized FPR).
  *   **Camp 1** demands equalized FPRs to ensure equal liberty interests.
  *   **Camp 2** demands Calibration to ensure a "High Risk" score implies the same probability of rearrest regardless of race.

  We cannot have both. Retaining the tool forces us to choose which mathematical definition of fairness to violate. By continuing to use this tool, the Board implicitly accepts that one form of unfairness is permissible. My position is that neither is acceptable for a public institution charged with equal justice.

  **Engagement with the Counter-Argument**
  The strongest argument for renewing the contract as-is (Camp 2) is **Informational Integrity**. Proponents argue that Calibration ensures judicial honesty: if a judge sees a 70% risk score, it means a 70% likelihood of rearrest for *any* defendant. If we manipulate thresholds to equalize FPRs, we break this calibration. A "70%" score for a Black defendant might statistically correspond to a lower actual risk than a "70%" for a White defendant. This arguably misleads judges, potentially endangering public safety and undermining the tool's utility as a neutral arbiter of probability.

  This argument is logically sound *if* we accept the base rates as neutral inputs. However, in pretrial contexts, base rates are not natural facts; they are artifacts of systemic enforcement patterns. A "calibrated" tool effectively launderages these historical biases into the present, giving them the veneer of mathematical objectivity. Preserving "Informational Integrity" on biased data merely ensures we are efficiently and accurately perpetuating past injustices.

  **Implementation Timeline**
  *   **Months 1–3:** Board formally notifies vendor of non-renewal; commission a working group (judges, public defenders, prosecutors) to draft guidelines for individualized, non-algorithmic risk hearings.
  *   **Months 4–9:** Judicial training on evaluating risk factors without reliance on aggregate risk scores; pilot the new protocol in a subset of hearings.
  *   **Months 10–12:** Full deployment of new protocol; vendor contract expires.
  *   **Month 13:** Algorithmic risk scores are stricken from all pretrial reports.

  **Conclusion**
  We cannot engineer our way out of a philosophical problem. The conflict between Calibration and Error Rate Balance is not a bug; it is a feature of using historical data to predict future liberty in an unequal society. The only ethical path is to stop outsourcing these moral trade-offs to a vendor's algorithm.
