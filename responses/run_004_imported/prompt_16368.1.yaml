          *   *Stance:* Instrumentalism (theories are useful tools, not true descriptions).
          *   *Strength:* Historically grounded. Acknowledges the fallibility of science.
          *   *Weakness:* Inductive leap. Assumes discontinuity between past and present science without justification.

      *   **Point (2) Marcus:**
          *   *Argument:* No Miracles Argument (NMA). Current theories make novel, precise predictions (GR, Higgs). It would be a miracle if false theories did this. Therefore, theories are approximately true.
