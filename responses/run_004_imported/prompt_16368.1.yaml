          *   *Weakness:* Might be too sweeping. Does *nothing* survive?

      *   **Point (4) Marcus:**
          *   *Argument:* Structural Realism. The *mathematics/structure* survived (Fresnel's equations), even if the *ontology* (ether) didn't. Success tracks structure, not specific entities.
