  So I stumbled on Kavka's toxin puzzle a while back and it's been rattling around in my head since (kinda reminds me of smart contracts / commitment schemes, weirdly). Basic setup: a billionaire will wire you a million bucks tonight if you sincerely *intend* to drink a nasty (non-lethal) toxin tomorrow at noon -- you dont actually have to go through with drinking it, some perfect lie-detector just checks at midnight whether you really mean it. Thing is, once the money's already in your account there's zero reason left to drink the stuff, so how could you honestly intend to in the first place? Messes with my intuitions about whether you can just will yourself into having an intention that has no future payoff attached to it.

  Could you write me a short story that dramatizes that bind? Id rather you not just reuse the billionaire/toxin setup wholesale -- drop some original character into a situation with the same underlying structure (a real, sincere intention now, zero reason to follow through later) and let the tension play out through plot and character instead of someone monologuing about decision theory. Something like 600-900 words is fine, and it doesnt need a tidy resolution.
