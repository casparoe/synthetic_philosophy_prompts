answer: |-
  The hum of the synaptic collar was the worst part. It wasn't loud, but it vibrated in the marrow of Silas's skull, a constant reminder that his own mind was no longer private property.

  Across the steel table, the Fixer tapped a stylus against a datapad. "Final offer, Silas. The credits for your sister's treatment transfer at 0800 tomorrow. But the collar needs to lock now."

  "And the condition?" Silas asked, though he knew it by heart.

  "At noon tomorrow, you initiate the Flush," the Fixer said, not looking up. "It wipes the encryption keys from your cortex. It feels like someone pouring acid into your sinuses. Takes about ten minutes. After that, you're clean. But you can't work high-security courier runs anymore. Your neural throughput drops by forty percent."

  Silas swallowed. "So I lose my career."

  "You lose your edge. But you get the credits now. Based on *intent*." The Fixer finally looked up, eyes flat. "The collar doesn't measure action, Silas. It measures commitment vectors. It knows if you're planning to wiggle out. If you don't sincerely intend to hit that trigger at noon, the transfer doesn't happen. And if the transfer doesn't happen, your sister stays in stasis."

  Silas nodded. He could do this. He loved his sister. Pain was temporary; career loss was manageable. He could intend to do it.

  He closed his eyes and focused on the collar. He tried to project the feeling of noon tomorrow. He pictured himself sitting in his cramped apartment, the credits already glowing in his account. The sickness cured. The relief.

  Then, in that picture, he reached for the trigger.

  *Why?*

  The thought slipped in like a draft under a door. In the visualization, the money was already there. The sister was already safe. Hitting the trigger wouldn't help her more. It wouldn't get him more credits. It would just be ten minutes of agony followed by a permanent handicap.

  Silas opened his eyes. The collar's light pulsed a sickly amber. Not green.

  "You're hesitating," the Fixer said.

  "I'm not. I want to do it."

  "You want the credits. Those aren't the same thing." The Fixer leaned back. "Look, I know the math. Once you have the money, the Flush is pure loss. A rational actor doesn't incur costs for no benefit. So a rational actor can't intend to do it. So a rational actor doesn't get the money."

  "I'm not a machine," Silas snapped. "I can commit."

  "Prove it."

  Silas closed his eyes again. He tried to bypass the logic. He tried to summon a kind of blind faith, a religious fervor for the promise itself. He imagined the honor of keeping his word. But the honor felt thin, paper-thin, against the visceral reality of the acid-pour sensation he knew the Flush involved.

  He tried to forget the money. He tried to imagine the noon sun, the pain, the necessity of it. But the money was the point. The money was the only reason he was sitting in this cold room. If he removed the money from the equation, the intention evaporated. If he kept the money in the equation, the intention became irrational.

  The collar hummed louder. The amber light flickered toward red.

  He thought about his sister's face. Pale, sleeping. He loved her more than his career. He loved her more than his comfort. Surely that was enough?

  But the collar wasn't measuring love. It was measuring probability. It was reading the synaptic pathways of his decision-making process. And his process was built on cause and effect. Effect: Sister saved. Cause: Credits received. Future Action: Pain + Disability. Future Benefit: None.

  The equation wouldn't balance.

  Sweat prickled on his forehead. He tried to lie to himself. He tried to convince the neural pathways that the pain tomorrow would be meaningful. But he knew, with crushing certainty, that tomorrow he would be a man with a full bank account looking at a button that offered only suffering. Tomorrow-Silas would be a fool to press it. And Today-Silas knew Tomorrow-Silas was a coward.

  "You're fighting your own head," the Fixer murmured. "Stop thinking. Just feel it."

  "I can't," Silas whispered. "I know too much."

  The clock on the wall ticked. 0755. Five minutes to the transfer window.

  Silas gripped the edges of the table. He needed to stop being Silas. He needed to be someone who valued pain over gain. Someone who didn't understand that the game was already over once the credits hit. He tried to induce a kind of madness, a temporary insanity where the trigger pull felt inevitable.

  He imagined the pain. He welcomed it. He told himself he deserved it.

  The collar pulsed green. Once. Twice.

  Hope surged in his chest, hot and bright.

  Then the light faded back to amber. The moment of conviction had passed, replaced by the cold return of reason. He knew he had only pretended. The collar knew he had only pretended.

  0758.

  Silas stared at the device. He realized the trap wasn't the pain. It was the clarity. He was too sane to make the promise, and too desperate to walk away. He sat in the humming silence, trying to carve a hole in his own logic large enough to fit a miracle through, while the clock ate the seconds away.
