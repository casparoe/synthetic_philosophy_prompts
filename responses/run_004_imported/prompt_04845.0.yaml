answer: |-
  ### Sidebar: The Veil and the Wager
  **On the Decision-Theoretic Split Between Harsanyi and Rawls**

  It is one of the great ironies of twentieth-century political philosophy that the same thought experiment was used to consecrate two mutually hostile moral systems. In the 1950s, the economist John Harsanyi devised the "impartial observer" to rescue utilitarianism from the charge of interpersonal incomparability. In the 1970s, John Rawls adapted the device into the "original position" to bury utilitarianism once and for all.

  Both models ask a chooser to select the rules of society from behind a veil of ignorance, unaware of their future class, talents, or conception of the good. The divergence arises entirely from how each philosopher models the *uncertainty* behind that veil.

  **Harsanyi's Bayesian Gamble**
  Harsanyi treats the veil as a problem of **risk**. He invokes the "principle of insufficient reason" (or the principle of indifference): if a rational agent has no evidence to think they are more likely to be the CEO than the janitor, they must assign an equal probability to every social position.

  Once these probabilities are assigned, the chooser becomes a standard expected-utility maximizer. They calculate the average utility of each potential society and choose the one with the highest mathematical expectation. Since the probability of occupying any slot is $1/n$, maximizing expected utility is mathematically identical to maximizing the sum of utilities. The result is **Average Utilitarianism**. For Harsanyi, to do otherwise—to reject the probability calculus—is to be irrational.

  **Rawls's Radical Uncertainty**
  Rawls treats the veil as a problem of **uncertainty** (in the Knightian sense). He argues that assigning equal probabilities is arbitrary; there is no objective basis for claiming a $1/n$ chance of being anyone, because the "lottery" of social birth isn't a randomizing mechanism we can model.

  Without objective probabilities, Rawls argues, standard expected utility maximization collapses. Instead, rational parties adopt the **maximin rule**: they compare social systems by their worst possible outcomes and choose the one where the floor is highest. This licenses the **Difference Principle** (inequalities are permitted only if they benefit the least advantaged).

  Rawls defends this seemingly risk-averse move with three conditions specific to the original position:
  1.  **No Probabilities:** As noted, the uncertainty is radical, not calculable.
  2.  **The Gravity of the Choice:** The choice concerns basic liberties and primary goods, not marginal gains. You cannot "gamble" your fundamental rights for a chance at extra wealth.
  3.  **Strains of Commitment:** The agreement must be binding. A utilitarian scheme might ask the losers to accept misery for the greater good. Rawls argues rational agents would not accept principles they might find psychologically or morally impossible to uphold if they ended up at the bottom.

  ***

  ### The Verdict: Does Rawls Block the Utilitarian Conclusion?

  Does Rawls's argument succeed, or does the dispute merely relocate the disagreement one level down into a quarrel about decision theory?

  **The judgment is that the dispute does relocate, but Rawls successfully argues that this relocation is necessary.**

  Harsanyi's critique is formidable: Maximin is, in standard decision theory, a pathological rule. It implies infinite risk aversion. As Harsanyi noted, if we applied maximin to ordinary life, we would never cross the street (the risk of death, however minute, outweighs the benefit of arriving) or take a job (the risk of dissatisfaction outweighs the salary). If rationality means coherence of preferences under uncertainty, Harsanyi wins. Rawls's parties look less like rational agents and more like paranoids.

  However, Rawls's counter-move is to deny that the original position *is* ordinary life. He argues that standard decision theory presupposes a context of repeatability and compensability that does not apply to constitutional justice. In a casino, losses can be offset by future wins; in a social structure, ending up in the "underclass" may be irreversible and catastrophic.

  Therefore, Rawls does not strictly *refute* Harsanyi on the turf of formal decision theory. Instead, he argues that formal decision theory is the wrong tool for the job. By insisting on maximin, Rawls is smuggling a moral premise into the definition of rationality: that certain goods (liberty, opportunity, self-respect) are **lexically ordered** and not subject to trade-offs.

  **Conclusion:**
  Rawls does not prove that maximin is universally rational. He proves that maximin is rational *if* you accept his prior moral claim that the stakes of justice are too high for gambling. The disagreement ultimately rests on whether one views the selection of social principles as a **wager** (Harsanyi) or a **covenant** (Rawls). Harsanyi assumes we are betting on a life; Rawls assumes we are securing the conditions under which a life is possible. Neither side can defeat the other without first settling that deeper, pre-theoretical question.
