      *   Logician gestures at Hard/White? Yes (independence of attributes).
      *   Confucian uses Zhengming/Xunzi style? Yes (Social order, ambiguity of 'is', practical use).
      *   Ending locates disagreement? Yes (Function of naming).

  *(Self-Correction Note)*: I need to be careful not to make the Logician sound *too* modern. Gongsun Long isn't doing Fregean sense/reference distinction explicitly, but it's the closest analog. I will frame it in terms of *Zhi* (intent) to stay closer to the text.

