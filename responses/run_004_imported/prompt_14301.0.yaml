answer: |-
  **Setting:** *A quiet courtyard in the state of Zhao, third century BCE. Two scholars sit across a low table. Master Ming represents the School of Names (Mingjia), defending the thesis of Gongsun Long. Master Li is a disciple of the Confucian tradition, steeped in the Rectification of Names (Zhengming).*

  **Master Ming:** You have read the *White Horse Dialogue*, Master Li. You know the conclusion: A white horse is not a horse. Yet you look at me as if I have claimed the sky is green. Why resist the deduction?

  **Master Li:** I resist not the deduction, but the premise that leads to a conclusion which severs the bond between language and the world. You say "A white horse is not a horse." In our speech, the particle *fei* (not) can mean "is not identical to" or "is not a member of." You rely on the first to prove the second. If I say "A thief is not a man," do you agree?

  **Master Ming:** Careful. That is a different analogy. Let us stick to the text. Tell me: When one names a "horse," what is being named?

  **Master Li:** The animal. The living creature that runs, eats grass, and carries burdens.

  **Master Ming:** No. "Horse" names the *shape*. "White" names the *color*. That which names the color is not that which names the shape. Therefore, "White Horse" is not "Horse." If you combine the name for color with the name for shape, you have created a compound name. Is the compound identical to one of its parts?

  **Master Li:** The name is not the thing, Master Ming. But the name must fit the thing (*shi*). If I point to a white horse and ask, "Is this a horse?" any commoner will say "Yes." If your philosophy forces me to say "No," then your names do not fit the realities they are meant to govern. You are disentangling concepts that are woven together in the world.

  **Master Ming:** You confuse the object with the intent (*zhi*) of the name. Consider the argument of seeking. If someone seeks a "horse," a yellow horse or a black horse will suffice. The desire is satisfied. But if someone seeks a "white horse," a yellow or black horse will not suffice. If "White Horse" were truly "Horse," then the seeking would be the same. Since the seeking is different, the names are different. Since the names are different, the white horse is not the horse.

  **Master Li:** This is where the trick lies. The *seeking* is different because the *specification* is different, not because the *kind* is different. If I seek "a tall man," and you bring me a man of average height, I am unsatisfied. Does this prove that "a tall man is not a man"? You are treating the modifier "white" as if it creates a new essence, rather than merely narrowing the selection of an existing essence.

  **Master Ming:** You speak of essence as if it is a container. But consider "Hard and White." If I have a stone that is hard and white, my eye sees the white but not the hard; my hand feels the hard but not the white. Whiteness and hardness exist independently of the stone, and independently of each other. So too with the horse. "Horse-ness" is the form. "Whiteness" is the attribute. When you say "White Horse," you are fixing the attribute to the form. A fixed form is not the same as the unfixed form. "Horse" includes all colors; "White Horse" excludes all but one. That which excludes cannot be identical to that which includes.

  **Master Li:** And here we reach the danger. You treat "Horse" as an abstract universal floating above all actual horses. But names were established by the Former Kings to regulate social conduct, not to parse metaphysical distinctions. If a magistrate declares, "All horses must pay a toll at the city gate," and a man drives a white horse through without paying, citing your thesis, what then?

  **Master Ming:** Then the magistrate is sloppy with his names. If the law says "Horse," it refers to the shape. If the man argues that his white horse falls under the shape of "horse," he is correct regarding the object, but incorrect regarding the name. The law applies to the object *via* the name. But we are discussing the logic of the name itself. Does the toll booth determine the truth of propositions?

  **Master Li:** The toll booth determines the order of the state! Xunzi taught that when names are not correct, language is not in accord with the truth of things. When language is not in accord with the truth of things, affairs cannot be carried on to success. Your distinction is logically clever, perhaps, but it disorders the practical distinctions names are meant to serve. To say "White Horse is not Horse" is to confuse the people. It makes the distinct seem same, and the same seem distinct.

  **Master Ming:** On the contrary, I bring order by preventing the confusion of names. If "White Horse" is simply "Horse," then the specific is lost in the general. I preserve the integrity of the compound. You fear that if "White Horse is not Horse," then a white horse cannot be ridden or taxed. But I do not deny the animal exists. I deny that the *name* "White Horse" is equivalent to the *name* "Horse." You are arguing about the animal; I am arguing about the label.

  **Master Li:** But the label *is* for the animal! We do not name the void. If the name "Horse" functions to group white, black, and yellow animals for the purpose of riding, taxing, or breeding, then to exclude the white horse from the name "Horse" is to break the tool. You claim to rectify names, but you are sharpening a knife until it has no edge. You have precision, but no utility.

  **Master Ming:** Utility is secondary to truth. If the truth is that the concept "White Horse" has a different extension and intent than "Horse," then to say they are the same is a lie, however useful. You Confucians wish language to be a bridge for governance. I say language is a mirror for reality. If the mirror shows a distinction, you should not smear the glass to make the image smoother.

  **Master Li:** And I say the mirror is meant to guide the walker, not to admire the reflection. If the mirror shows a path that leads off a cliff, the mirror is flawed. Let us pause, Master Ming. We are talking past one another.

  **Master Ming:** Agreed. Let us locate the fracture. Is it in the logic? Do you deny that if A allows what B excludes, then A is not B?

  **Master Li:** I deny the application. "Horse" is not a set of permissions; it is a category of being. The logic holds for definitions, but not for kinds. But... I suspect this is not the root.

  **Master Ming:** Then is it the ontology? Do you deny that "Whiteness" and "Horse-ness" are distinct components that form a compound?

  **Master Li:** I deny that they exist separately waiting to be combined. They are aspects of the thing, not things themselves. But even here, we might debate forever. I think the fracture lies deeper. It lies in what we believe naming is *for*.

  **Master Ming:** Explain.

  **Master Li:** For you, naming is an act of analysis. To name is to carve the world at its joints, distinguishing every attribute until nothing is conflated. Your goal is distinction. For me, naming is an act of synthesis. To name is to gather things together so that humans can act in concert. My goal is accord.

  **Master Ming:** So you admit that "White Horse is not Horse" may be analytically true, but socially false?

  **Master Li:** I say that a truth which destroys the possibility of shared action is not a truth worth naming. You separate the name from the practice. I say the name *is* the practice.

  **Master Ming:** And I say that without the separation of name from practice, we can never see the world clearly, only through the fog of custom. You fear that if we admit "White Horse is not Horse," the gates will open and the taxes will fail. I fear that if we deny it, we teach the mind to accept confusion as clarity.

  **Master Li:** Then we have found it. We disagree not on the horse, nor on the color, but on whether language serves the Mind or the Community.

  **Master Ming:** Perhaps. But until the Community learns to think as clearly as the Mind, Master Li, I fear your gates will remain closed to me.

  **Master Li:** And until the Mind learns it lives within a Community, Master Ming, I fear your logic will remain a white horse that no one can ride.
