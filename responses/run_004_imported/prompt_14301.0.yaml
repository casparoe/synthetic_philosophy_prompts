      *   **The Confucian (Master Li):** Represents the Xunzi/Zhengming tradition. Pragmatic, social, focused on the function of language in governing and harmonizing human affairs. Sees language as a tool for social order.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A quiet study or garden. Establish the thesis immediately.
      *   **Round 1: The Core Argument (Shape/Color & Seeking):**
          *   *Ming:* Start with the definition. "Horse" names the shape. "White" names the color. "White Horse" names both. Therefore, the concept of "White Horse" $\neq$ the concept of "Horse".
          *   *Li:* Challenge the "is" (fei). You are confusing "is not identical to" with "is not a member of." If I ask for a horse, a white horse satisfies me.
          *   *Ming:* Counter with the "Seeking" argument. If you want a horse, yellow/black works. If you want a white horse, yellow/black fails. Therefore, the *intent* of the name is different. If A allows X and B does not, A $\neq$ B.

      *   **Round 2: Practical Consequences (Riding/Taxing):**
          *   *Li:* Bring it down to earth. If a white horse is not a horse, then the tax on horses shouldn't apply to white horses. The barrier guards should let white horses through without tolls. This leads to chaos.
          *   *Ming:* Distinguish between the *name* and the *object*. The object is still a physical animal. But the *name* "White Horse" has a stricter extension. We are discussing the *names*, not the toll booth. You are conflating the map with the territory.

      *   **Round 3: Ontology of Names (Hard and White):**
          *   *Ming:* Bring in "Hard and White" (Jian Bai Lun). Whiteness exists independently of the horse. "Horse-ness" exists independently of color. When combined, they form a new compound concept. The compound is not the simple.
          *   *Li:* This reifies abstractions. "White" doesn't float around waiting to attach to things. Names are established by kings and sages to group things for human use. To separate "white" from "horse" as independent entities is to detach language from the world it serves.

      *   **Closing: Locating the Disagreement:**
          *   They need to realize they are talking past each other on a fundamental level.
          *   Is it logic? (No, they agree on deduction but differ on premises).
          *   Is it ontology? (Maybe, universals vs. particulars).
          *   Is it function? (Yes. Language as precise distinction vs. Language as social coordination).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure Ming doesn't sound like a modern analytic philosopher using set theory explicitly. Keep the terminology classical (Zhi, Ming, Shi).
      *   *Critique:* Ensure Li doesn't just say "You're wrong." He needs to explain *why* the distinction matters for the Dao.
      *   *Key Textual Reference:* Ensure the "Seeking" argument (求馬) is clear.
      *   *Key Textual Reference:* Ensure the "Is" (Fei) ambiguity is addressed. In Classical Chinese, *fei* means "is not" but can imply "is not equivalent to" rather than "is not a subset of."

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Intro:* Establish the setting.
      *   *Ming's opening:* "Horse" = shape. "White" = color.
      *   *Li's pushback:* The ambiguity of *fei*.
      *   *Ming's reinforcement:* The "Seeking" argument.
