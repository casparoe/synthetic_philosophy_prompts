      *   *The Conflict:* Utilitarianism demands maximizing general happiness. Egoism demands maximizing one's own happiness. Reason supports both. If they conflict, reason is divided ("Dualism of Practical Reason").
      *   *The Solution:* To make ethics fully rational, there must be a harmony between duty and self-interest. This implies a moral order of the universe (God) and sanctions (afterlife/reward/punishment).
      *   *Sidgwick's Stance:* Unlike Kant (who said "we must *postulate* this to make sense of morality"), Sidgwick was an empiricist. He wanted *evidence*. If morality requires an afterlife to be rational, we need to know if an afterlife exists.
      *   *The SPR:* Founded to investigate supernatural claims scientifically. Sidgwick wasn't looking for comfort; he was looking for the missing premise to complete his ethical system.
      *   *Verification:* Does the historical record support this? Yes, Sidgwick's letters and the "Balfour Declaration" (though that's more about religion generally) and his specific involvement in the SPR align with this motivation. He famously said if he became convinced of an afterlife, it would revolutionize his philosophy.

  3.  **Deconstruct Part 2: Evaluating Success/Rigor:**
      *   *Ethics (*The Methods of Ethics*):*
          *   Rigor: Extremely high. Analytical, clear distinctions, acknowledged limitations.
