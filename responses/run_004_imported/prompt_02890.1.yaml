answer: |-
  Your reading of Henry Sidgwick is astute and aligns with the consensus of modern intellectual historians. The tension you identify is not merely a biographical curiosity; it is the central architectural stress point in Sidgwick's philosophical system.

  Here is an analysis of how the "Dualism of Practical Reason" motivated his psychical research, followed by an evaluation of the rigor and success of both projects.

  ### 1. The Ethical Problem as Motivation for Psychical Research

  To understand the link, we must look closely at the conclusion of *The Methods of Ethics* (1874). Sidgwick analyzes three methods of moral reasoning: Intuitionism, Rational Egoism, and Utilitarianism (which he calls "Universal Hedonism").

  **The Dualism of Practical Reason**
  Sidgwick argues that both Rational Egoism (it is rational to maximize my own happiness) and Utilitarianism (it is rational to maximize the general happiness) are self-evident axioms of practical reason. However, they are not always compatible. In a world without divine oversight, sacrificing my own happiness for the general good might be morally right, but it would be irrational from the perspective of my own self-interest.

  For Sidgwick, this was intolerable. He believed that for ethics to be a fully rational system, "Right" and "Reasonable" must coincide. If duty requires self-sacrifice that results in a net loss for the agent, then morality is irrational. To resolve this, Sidgwick posited that we must assume a **"Moral Government of the Universe."** If a benevolent God exists and administers rewards and punishments in an afterlife, then virtue and self-interest will ultimately harmonize.

  **The Empiricist's Dilemma**
  Here is where Sidgwick diverges from Kant. Kant argued that God, Freedom, and Immortality were *postulates of practical reason*—things we must assume to make sense of morality, even if we cannot prove them theoretically.

  Sidgwick, however, was a rigorous empiricist. He wrote, *"I cannot allow myself to regard any belief as justified... unless it is supported by evidence."* He could not simply postulate the afterlife; he needed to know if it was factually true. If the afterlife does not exist, his ethical system rests on a contradiction. If it does exist, the contradiction is resolved.

  **The Entry into Psychical Research**
  This is the precise motivation for his involvement with the Society for Psychical Research (SPR), which he helped found in 1882. Sidgwick did not turn to spiritualism for comfort; he turned to it for **data**. He viewed the SPR as a scientific committee tasked with investigating the one set of empirical claims that could validate the missing premise of his ethics.

  In a famous letter to his student Arthur Balfour, Sidgwick wrote that if he could be convinced of the survival of the soul, it would "revolutionize" his philosophy. He spent decades interviewing mediums, analyzing séances, and scrutinizing reports of apparitions, hoping to find the "hard evidence" that would bridge the gap between Egoism and Utilitarianism.

  ### 2. Comparing Rigor and Success

  Judged by Sidgwick's own standards of clarity, skepticism, and logical consistency, how do the two projects compare?

  #### *The Methods of Ethics*
  *   **Rigor:** Extraordinary. Sidgwick's prose is famously dry, precise, and devoid of rhetorical flourish. He distinguishes concepts with surgical precision (e.g., distinguishing the *motivation* for an action from the *criterion* of its rightness). He subjects his own preferred conclusions to the same skepticism he applies to his opponents.
  *   **Success:** High, but with a caveat. The book is widely considered the masterpiece of nineteenth-century moral philosophy. It defined the terms of debate for successors like G.E. Moore, C.D. Broad, and John Rawls.
  *   **The "Failure":** Sidgwick admits he fails to resolve the Dualism. However, in philosophy, this is often viewed as a success of honesty rather than a failure of intellect. By clearly delineating the limits of rational ethics, he prevented future philosophers from building castles on shaky foundations. The "failure" is actually the book's most enduring insight.

  #### *The Society for Psychical Research*
  *   **Rigor:** Surprisingly High (Methodologically). Sidgwick was not a gullible believer. He approached psychical research with the same skepticism he applied to ethics. He was instrumental in exposing frauds (such as the medium Henry Slade) and insisted on controlled conditions. He sought to bring scientific methodology to a field dominated by credulity and Victorian sentimentalism.
  *   **Success:** Low (Substantively). Despite decades of work, Sidgwick found no evidence of an afterlife that met his own high standards of proof. The SPR did not establish survival as a scientific fact, nor did it provide the "missing premise" for his ethics.
  *   **Reputational Cost:** This project is often viewed by historians of philosophy as a tragic detour. It consumed time and energy that might have been spent on further philosophical work and, for a time, tarnished his reputation among more positivist colleagues who viewed psychical research as pseudoscience.

  ### The Verdict: Which Project Was More Successful?

  By Sidgwick's own standards of **epistemic rigor**, the ethical project was vastly more successful.

  In *The Methods of Ethics*, Sidgwick achieved what he set out to do: he clarified the logical structure of moral reasoning. Even though he did not resolve the Dualism, he successfully mapped the terrain. The work stands as a coherent, logically sound system that acknowledges its own limits.

  In the SPR, Sidgwick applied rigorous methods to a subject matter that ultimately yielded no positive results. While he succeeded in raising the *standard* of investigation (filtering out obvious fraud), he failed to achieve the *goal* of the investigation (evidence of survival). Consequently, the psychical research did not save his ethical system; he died with the Dualism of Practical Reason unresolved.

  ### Conclusion: The Integrity of the Failure

  There is, however, a profound unity between the two projects. Sidgwick is unique because he refused to compromise his empiricism to save his ethics.

  Many philosophers might have accepted Kant's solution (faith-based postulation) to avoid the discomfort of the Dualism. Sidgwick did not. He was willing to let his ethical system remain "broken" rather than accept a premise (the afterlife) without evidence. His turn to psychical research was not a lapse in judgment, but a testament to his intellectual integrity. He was willing to investigate the supernatural if that was what the data required, but he was equally willing to reject it when the data proved insufficient.

  In summary:
  1.  **Motivation:** The psychical research was a direct, desperate attempt to find empirical proof for the "Moral Government of the Universe" required to resolve the Dualism of Practical Reason.
  2.  **Success:** The ethical project was a triumph of rigor that defined a field, even in its admitted incompleteness. The psychical project was a rigorous failure; it applied scientific standards to a question it could not answer, leaving Sidgwick's ethical "problem" unsolved at his death.

  Sidgwick remains a compelling figure precisely because he had the courage to leave the problem open rather than solve it with a lie.
