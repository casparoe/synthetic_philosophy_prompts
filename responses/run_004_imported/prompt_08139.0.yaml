answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the distinct honor of being the person in this friend group who reads too much about how people do things together. So, when the bride asked me to give this toast, she didn't ask for stories about our grad school days or how we survived comprehensive exams. She gave me an assignment. She said, "You're the collective intentionality person. Tell us what's happening here."

  For the half of the room who aren't philosophers: don't worry. I promise to keep the jargon to a minimum. But since the other half *are* philosophers, I have to be precise.

  In my field, there is a famous debate about what it means to act as a "we." On one side, you have Michael Bratman. Bratman argues that shared agency is just a mesh of individual intentions. I intend that we paint the house; you intend that we paint the house; we know this about each other. It's efficient. It's rational. But it's also fragile. Because if I wake up tomorrow and change my mind, the "we" dissolves. I'm off the hook. The joint activity ends because my individual contribution ended.

  On the other side, you have Margaret Gilbert. Gilbert argues that some commitments create something new: a "plural subject." When we form a joint commitment, we aren't just two individuals overlapping. We become a single unit of agency. And here is the crucial part: that commitment cannot be dissolved unilaterally. I can't just decide I'm out. My feelings might change, my private intentions might waver, but the obligation remains because it belongs to *us*, not just to me.

  For a long time, I think [Bride] and [Groom] lived in a Bratman world. And that is beautiful. Dating is often a beautiful series of interlocking individual intentions. "I want to see you." "I want to see you." "I want to live in this city." "I do, too."

  But then came the stretch of long-distance. And I know, broadly, that there was doubt. There was uncertainty. In a Bratman world, doubt is a dealbreaker. If the individual intentions no longer interlock, the project ends. It would have been rational to let it go. It would have been easy to say, "My private intention has changed, so the 'we' is over."

  But they didn't.

  They discovered that love, at the level of marriage, isn't just about your current feelings matching up. It's about entering into a Gilbertian joint commitment. It's about realizing that the "We" is a thing you build that is stronger than the "I" that sometimes gets tired or scared.

  They chose to become a plural subject. They chose a commitment that doesn't rely on the weather of their individual moods. They decided that even when the distance was hard, even when the individual intention wavered, the joint commitment would hold.

  And that is why we are all here.

  Marriage, philosophically speaking, is the institutionalization of the plural subject. It is the public declaration that you are no longer just two people negotiating a treaty every morning over coffee. It is the agreement that there is now a "Us" that has its own rights, its own needs, and its own resilience.

  [Bride] and [Groom], you have already done the hardest work. You tested the strength of your joint commitment before you even signed the license. You found out that your "we" could survive the doubt of the "I."

  So, my wish for you is not that you will always have interlocking individual intentions. You won't. There will be days when one of you wants to paint the house and the other wants to burn it down. There will be days when the mutual knowledge is cloudy.

  My wish is that you always remember the ontology of your vows. That when the individual intention falters, you remember the joint commitment. That you honor the plural subject you have created. And that you never, ever try to dissolve it unilaterally.

  To the plural subject. To [Bride] and [Groom].
