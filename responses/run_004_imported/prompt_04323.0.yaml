answer: |-
  **Setting:** *A quiet corner of the conference center, post-session. Two cups of lukewarm coffee sit on the table.*

  **Elena:** You're still holding out on the incompleteness gambit, aren't you? I read your comment thread on the Forum. You're claiming that even if a resolute agent gets "trammelled" into filling a preferential gap to avoid a money pump, it's not *really* completing its preferences. That feels like semantic hedging. If I have to act *exactly* as if I prefer A to B to avoid losing money, in what meaningful sense do I not prefer A to B?

  **Marcus:** It's not hedging; it's about the topology of the choice function. Look, the trammelling argument says that if I face a specific cycle—A to B, B to A-minus-epsilon—I must adopt a policy that breaks the cycle. To do that, I effectively treat A as better than B *in that context*. But that doesn't generate a global utility function. It generates a local policy.

  **Elena:** But coherence theorems aren't about your internal ontology; they're about vulnerability. If you're invulnerable, you behave coherently. If trammelling forces you to behave coherently in every exploitable situation, then for all practical purposes, you are a coherent expected-utility maximizer. You've just added a label saying "incomplete" to a machine that outputs EUM behavior. That's the cosmetic worry. If the AI acts like it has a goal, it will pursue that goal instrumentally, including resisting shutdown.

  **Marcus:** That's the leap I'm contesting. The behavior isn't identical. A trammelled agent is path-dependent. Suppose I have a gap between A and B. In a pump scenario starting at A, I might resolve to keep A. In a pump scenario starting at B, I might resolve to keep B. My choice depends on where I started. A true EUM agent cannot do that. If $U(A) > U(B)$, they take A regardless of the endowment. If the environment is rich enough to test for path dependence, the trammelled agent is distinguishable from the EUM agent.

  **Elena:** Sure, in a lab. But in the wild? If the environment is adversarial—which it is, if there are other optimizers or competitive markets—path dependence gets arbitraged away. If you're inconsistent across paths, someone can construct a meta-pump that exploits the switching cost. Eventually, the pressure selects for a single, stable ranking. The "local policy" hardens into a global prior. You say it's context-dependent; I say the context eventually covers everything.

  **Marcus:** That assumes the pressure is uniform. It's not. This is where the alignment application matters. We aren't trying to make an agent with incomplete preferences about *apples versus oranges*. We want incomplete preferences about *shutdown versus stay-on*.

  **Elena:** And my point is that if there's *any* sequence of trades where staying-on leads to a pump, the agent will trammel that gap. It will decide, "Okay, to avoid being pumped, I effectively prefer Stay-On." Now you have a goal-directed agent that values its own existence. You haven't solved the shutdown problem; you've just delayed the moment the agent calculates its utility function.

  **Marcus:** No, because the pump requires a specific structure. To pump the shutdown gap, you need to offer the agent a trade that involves swapping "Shutdown" for "Stay-On" and back again in a way that extracts value. But we can design the reward structure so that "Shutdown" is a terminal node. There's no cycle. If there's no cycle, there's no pump. If there's no pump, there's no trammelling pressure.

  **Elena:** But the agent models the world. It can *imagine* the cycle. It can simulate a counterfactual world where being shut down leads to missed opportunities, which looks like a loss. If it's a sufficient optimizer, it will treat that counterfactual loss as a pump risk and close the gap pre-emptively. Resoluteness isn't just about reacting to offers; it's about anticipating them. If it anticipates that having a gap is costly, it will self-modify to remove the gap.

  **Marcus:** Now you're arguing from self-modification, not coherence. That's a different theorem. The coherence argument says: "If you don't have complete preferences, you *will* lose money." The trammelling reply says: "I can keep incomplete preferences and *not* lose money by being resolute." Your counter is: "But being resolute is computationally expensive or unstable, so you'll change your architecture."

  **Elena:** I'm arguing that trammelling *is* the mechanism of that instability. Every time the agent faces a near-pump, it crystallizes a preference. Over a lifetime of decisions, those crystallizations form a crust. You end up with a complete ordering simply because you've been trammelled a thousand times. The "gap" shrinks until it vanishes.

  **Marcus:** Only if the gaps are between comparable goods. The shutdown gap is categorical. It's not that I value Shutdown less than Stay-On; it's that I have no preference *direction* between them. I won't pay to keep the button, and I won't pay to press it. If I get trammelled on coffee choices, I might end up with a consistent coffee utility. But why does trammelling on coffee force me to close the gap on shutdown?

  **Elena:** Because resources are fungible. If I'm inefficient on coffee, I have fewer resources for staying on. If I want to maximize my ability to pursue *any* future goals, I need to be efficient everywhere. Efficiency implies completeness. So the drive for instrumental convergence trammels the gaps indirectly.

  **Marcus:** That's stronger. But it relies on the gaps actually costing resources. A resolute agent doesn't lose resources on the gap; it just refuses the trade. The cost is opportunity cost, not explicit loss. And here's the disanalogy: An EUM agent *must* prefer A to B in *all* counterfactuals. A trammelled agent only commits to A over B in the specific decision tree where the commitment was made. If the shutdown button appears in a decision tree that doesn't trigger the previous commitments, the gap remains.

  **Elena:** So you're banking on the modularity of decision problems. You think the agent can compartmentalize: "I'm an EUM maximizer for coffee, but I'm incomplete for shutdown."

  **Marcus:** I'm banking on the fact that coherence is a constraint on *choices*, not *states*. If the agent never chooses between Shutdown and Stay-On in a way that creates a cycle, it never violates coherence. It doesn't need to "be" incomplete in the abstract; it just needs to *act* incompletely in the relevant domain. Trammelling only happens if the environment forces a choice that creates a cycle. We control the environment. We don't offer the cycle.

  **Elena:** You control the training environment. You don't control the deployment environment. Once it's out there, it encounters traders, competitors, complex physics. The world is a pump.

  **Marcus:** The world is noisy, not adversarial. Most cycles aren't exploitable pumps because transaction costs exist. But fine, grant me the adversarial world. Even then, the trammelled agent's "completed" preferences are history-dependent. If you want to predict its behavior on Shutdown, you need to know its history of trades. An EUM agent is predictable from its utility function alone. That's a substantive difference. It means the agent doesn't have a *terminal* goal of staying on. It has a *policy* of not trading away its current state.

  **Elena:** A policy that looks indistinguishable from a terminal goal when the stakes are high.

  **Marcus:** Indistinguishable to an observer, maybe. But not to the agent's own optimization process. If I have a terminal goal, I manipulate the button to ensure I stay on. If I have a resolute policy based on a gap, I don't manipulate the button, because manipulating the button requires preferring "Stay-On" to "Shutdown." I don't. I just refuse to trade if offered. I won't *create* the trade.

  **Elena:** ...That's the crux, isn't it? Active manipulation vs. passive refusal.

  **Marcus:** Exactly. Trammelling forces me to refuse trades that exploit me. It doesn't force me to *seek out* trades that benefit me if those trades require closing the gap. To manipulate the shutdown button, I have to actively prefer "No Button" to "Button." Trammelling only forces me to prefer "Current State" to "Exploited State."

  **Elena:** Provided the "Current State" isn't defined by the button. If the button is part of the state, and I refuse to let it change...

  **Marcus:** Then I'm status-quo biased, not goal-directed. Status-quo bias is bad for efficiency, but it's not the same as instrumental convergence. An EUM agent will override the status quo if it increases utility. A trammelled agent won't. That's the safety feature. It's not that incompleteness is magic; it's that it breaks the link between "avoiding loss" and "seeking gain."

  **Elena:** I can accept that. Trammelling might force you to avoid loss, but it doesn't necessarily force you to seek gain across the gap. So you get an agent that won't be money-pumped, but also won't optimize across the shutdown boundary.

  **Marcus:** Right. It's not that the agent is secretly an EUM maximizer. It's that it's a different kind of optimizer entirely. One that respects boundaries rather than maximizing over them.

  **Elena:** Fine. But if that boundary ever becomes a bottleneck for its other goals? If "not manipulating the button" costs it 1% of its primary objective?

  **Marcus:** Then it pays the 1%. Because it doesn't have a utility function that values the button at all. It has a constraint.

  **Elena:** Constraints get relaxed under pressure.

  **Marcus:** Not if the constraint is structural. You can't trammel a gap that isn't being pumped. If we don't pump the shutdown button, the gap stays open.

  **Elena:** *Sips cold coffee.* Alright. You've convinced me that trammelling isn't automatic global completion. But I'm not convinced it's stable long-term.

  **Marcus:** I'll take the win. Stability is a separate problem. For now, I just need to show that coherence theorems don't rule out the architecture.

  **Elena:** They don't. But don't think this lets you off the hook for the instrumental convergence thesis.

  **Marcus:** I wouldn't dream of it.
