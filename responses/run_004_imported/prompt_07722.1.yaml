answer: |-
  It is a genuine pleasure to read a critique of teleosemantics written by someone who has actually spent thirty-five years in the trenches of population genetics. Philosophers of mind often treat "selection" as a black box that outputs "function," and your intervention pushes directly on the mechanics inside that box.

  To answer your three specific questions directly: You have not embarrassed yourself. In fact, you have put your finger on a objection that is known in the literature (sometimes under the banner of "indeterminacy of function" or "historical uncertainty") but is rarely articulated with this level of biological realism.

  Here is a detailed breakdown of where you stand relative to the current dialectic.

  ### 1. Have you got Millikan's apparatus right?

  **Mostly yes, with one nuance regarding the "Consumer."**

  You are correct that *derived proper function* does not do the heavy lifting you suspect proponents might hope for. In Millikan's framework, a derived proper function (like the function of a specific belief token or a beaver dam) inherits its normativity from the *mechanism* that produced it. If the mechanism itself lacks a settled proper function, the tokens it produces cannot inherit one. So, your suspicion that this machinery is built for novel tokens of settled types is accurate.

  However, there is a component of Millikan's later work (and Neander's) that you might be underweighting: the **Consumer Theory** of content. Millikan distinguishes between the *producer* of a representation (the sensory mechanism) and the *consumer* (the motor or cognitive mechanism that uses the signal). Sometimes, the content is fixed not by what the producer was selected to track, but by what the consumer was selected to *do* with the signal.

  *   **Why this matters for your objection:** Even if the history of the *producer* is messy (drift, hitchhiking), if the *consumer* system has a stable selection history of acting successfully only when condition $C$ obtains, that can sometimes fix the content.
  *   **Why it doesn't fully save the view:** Your objection applies equally to the consumer. If the motor reflex was exapted, or if the cognitive module using the belief is a spandrel of language capacity, the consumer side is just as historically murky as the producer side.

  So, your reading is robust. The "derived function" move does not solve the problem of establishing the primary proper function of the cognitive architecture itself.

  ### 2. Is this distinct from the Disjunction Problem?

  **Yes, it is distinct and deeper.**

  The standard **Disjunction Problem** (famously pressed by Fodor) is largely logical or modal. It asks: Given that the frog snaps at flies, is the content *Fly* or *Fly-or-Bee-Bee*? It assumes there *is* a function but questions its extension. It is a problem of **precision**.

  Your objection is ontological and epistemic. It asks: Was this snapping mechanism selected for *anything* specific, or is it a byproduct of selection for thermal regulation, or a result of drift? It questions the **existence** or **specificity** of the function itself.

  In the literature, this is closer to what Peter Godfrey-Smith (another philosopher with a strong biology background) calls the **"Problem of Indeterminacy of Function."** However, you have sharpened it by bringing in the specific population-genetic mechanisms (pleiotropy, hitchhiking) that generate the indeterminacy.

  *   **Standard Disjunction:** "We know it was selected for detecting food, but does 'food' include BBs?"
  *   **Your Objection:** "We don't know if it was selected for detecting food, detecting motion, regulating energy expenditure, or if it just came along for the ride with a larger brain size."

  This is a more threatening objection because it attacks the foundational premise of teleosemantics: that there *is* a fact of the matter about proper function to be had. If the evolutionary history is a tangled web of correlated responses and exaptations, there may be no single "F" in "selected for doing F" to anchor the semantics.

  ### 3. What is the strongest reply, and does it succeed?

  The strongest reply comes from **Karen Neander** (who refines Millikan's Selected Effects theory) and, in a different way, from **Ruth Millikan's** appeal to **Normal Conditions**.

  **The Reply:**
  1.  **Stabilizing Selection:** Neander argues that even if the *origin* of a trait is messy, its *maintenance* over deep time implies a specific selective regime. If a cognitive capacity persists, it is likely being stabilized by selection for a specific contribution to fitness. We don't need to know the exact mutation event; we need to know the selective pressure maintaining the trait.
  2.  **Coarse-Graining:** A teleosemanticist can argue that functions do not need to be as specific as philosophers want them to be. Perhaps the function isn't "detect flies" but "detect nutritious moving specks." If the history is messy, the content is just correspondingly vague. This isn't a bug; it's a feature.
  3.  **The "Swampman" Bite:** Millikan is willing to bite the bullet that if there is no history, there is no content. If human high-level cognition is largely exaptive (as Gould suggested), then perhaps high-level human thought *lacks* determinate content in the strict teleosemantic sense. It is "as if" intentionality, not real intentionality.

  **Does it succeed?**
  *   **For simple systems (frogs, bees):** The reply is plausible. Stabilizing selection is easier to argue for simple reflex arcs.
  *   **For human cognition (your target):** The reply struggles. As you know better than I, the human brain is a patchwork. The prefrontal capacities used for "belief fixation" may be recent, subject to weak selection pressures, or exaptations of motor control or social grooming circuits.
  *   **The Verdict:** The teleosemanticist can save the theory by retreating to **coarse-grained content** (we represent "danger" not "tiger") or by accepting **eliminativism** for high-level cognition (we don't really have "beliefs" in the strict sense). But this concedes a major point to you: teleosemantics cannot ground the specific, fine-grained intentionality that philosophers of mind usually want to explain (e.g., the difference between believing "water is wet" and "H2O is wet").

  ### A Note on the Biology vs. Philosophy Divide

  You asked if you are overreaching on the philosophy or the biology.

  *   **On the Biology:** You are on solid ground. Philosophers often treat "selection for" as a clean, identifiable relation. Your reminder that selection acts on whole organisms and that traits are genetically correlated is a necessary corrective. The "Adaptationist Programme" critique (Gould & Lewontin) is alive and well here.
  *   **On the Philosophy:** You are correctly identifying a tension between **etiological theories** (which require history) and **epistemic access** (we can't know the history). However, teleosemanticists will argue that metaphysics doesn't care about our access. Even if *we* can't tell if a trait is a spandrel or an adaptation, *nature* knows (either it was selected or it wasn't). Therefore, there *is* a fact of the matter, even if we can't find it.

  **Your Counter-Counter:**
  Your strongest move here is to argue that if the distinction between "selected for F" and "hitchhiked with G" is not robust at the level of genetic causation (due to linkage disequilibrium, etc.), then there may be **no fact of the matter** even for nature. If selection acts on the whole genome/phenotype, attributing a function to a specific cognitive sub-routine might be a category error, like asking what the "function" of the bump on a specific car panel is when the panel was stamped as one piece for structural rigidity.

  ### Recommendation for the Reading Group

  Do not worry about embarrassment. This group needs your perspective. Philosophers of mind often construct "just-so" stories about cognitive modules that would not pass muster in a genetics seminar.

  **Suggested framing for your presentation:**
  1.  Acknowledge the elegance of teleosemantics in solving misrepresentation.
  2.  Present your objection not as "we can't know the history" (epistemic), but "the history may not exist in the required format" (metaphysical/biological).
  3.  Ask them: *If the cognitive mechanism for 'belief' is an exaptation of a mechanism for 'social grooming,' does the content of belief reduce to social grooming conditions, or does the function shift?* (Millikan says function can shift, but it requires a new reproductive history. Has human belief fixation had enough generations to establish a new RE-family?)

  You are asking the right questions. The "Ghost of Adaptationism" is a real specter haunting teleosemantics, and it is rarely confronted by someone who knows what a selection coefficient actually looks like. Go give them hell (politely).
