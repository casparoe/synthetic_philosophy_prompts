      *   *Correction/Refinement:* Millikan distinguishes between *direct* proper functions (traits selected directly) and *derived* proper functions (products of those traits). The user is right that this doesn't solve the "what was the mechanism selected for?" problem. However, Millikan also allows for functions to be fixed by *consumer* systems, not just producer history. (Need to mention the Consumer Theory aspect).
