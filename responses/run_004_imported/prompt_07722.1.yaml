      *   **The Worry:** Population genetics teaches us that establishing specific selection histories is notoriously difficult (drift, hitchhiking, pleiotropy, exaptation).
      *   **The Implication:** If we can't pin down the specific selection history of a cognitive capacity, we can't pin down its proper function. If we can't pin down the proper function, we can't pin down the content (meaning).
      *   **Conclusion:** For many high-level cognitive capacities (inference, abstract concepts), there may be *no* determinate proper function, leading to a deeper indeterminacy than the usual "fly vs. dark moving dot" problem.

  3.  **Address Question 1: Millikan's Apparatus & Derived Proper Function:**
