      *   *The Luck Objection:* This is the heavy lifter. If an SFA is undetermined, the difference between choosing A and B is not explained by the agent. It's luck. Responsibility is incompatible with luck.
      *   *Causa Sui:* Explain that Strawson views *causa sui* as a logical impossibility, not just a physical one. You can't exist prior to yourself to create yourself. Indeterminism doesn't allow you to exist prior to yourself.
      *   *Assessment:* Is the instructor right? Yes. Is the classmate wrong? Yes, in Strawson's framework. Is Strawson right? That's the debate, but the internal logic holds.
