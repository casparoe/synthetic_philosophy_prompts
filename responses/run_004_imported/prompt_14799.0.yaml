answer: |-
  Good morning, everyone. Can I get a quick show of hands for who's grabbed coffee? Okay, keep holding onto that; you're going to need it.

  For those I haven't met yet, I'm [Your Name], one of the grad students in the Philosophy Department. As many of you know, my advisor, [Advisor Name], is on sabbatical this year, which means I've had the distinct privilege—and slight panic—of helping steer this workshop in her absence.

  And standing here, looking at this room, I was reminded of the "founding myth" of this workshop. You know the one. It's the story we usually tell to justify why philosophers of mind and neuroscientists should be in the same room. It goes something like this:

  *"Mental states, like pain, are multiply realizable. A human feels pain with a cortex, an octopus with a distributed ganglion, and a hypothetical alien with... well, whatever aliens have. Therefore, pain cannot be identical to any specific brain state. Therefore, psychology is autonomous from neuroscience, and we need philosophy to protect that autonomy."*

  It's a clean argument. It's elegant. And for a long time, it's been the handshake agreement that got this workshop funded.

  But, in preparing these remarks, I had a conversation with one of the postdocs from the med school group—a conversation that I suspect echoes conversations you've all had over the years. And the gist was: "Please don't stand up there and tell us that neuroscientists can't find commonalities across species. Because we do that every day. If we couldn't map homologous structures between a mouse and a human, we wouldn't have jobs."

  They're right, of course. This is the point Bill Bechtel and others have made for decades: if you look at how neuroscientists *actually* individuate brain states in the lab, the textbook philosophical examples of multiple realizability often fall apart. The neuroscientists in this room know more about the octopus nervous system than the philosophers do. We shouldn't be using armchair speculation to tell you how your data works.

  So, that leaves me in a bit of a bind. If I give the standard pitch, I lose the neuroscientists in the first five minutes. But if I just say, "Actually, neuroscience can explain everything," I'm throwing my own field under the bus, and I'm lying to the Dean, who is here and generously funding half of this event.

  [Turn slightly toward Dean]
  Dean [Name], I want to be honest with you about why your investment matters here.

  If the relationship between philosophy and neuroscience was just "Philosophy sets the rules, Neuroscience follows them," this workshop would be obsolete. But the tension we just identified—that gap between the *conceptual categories* we use to talk about the mind and the *empirical mechanisms* you find in the lab—that tension isn't a bug. It's the feature.

  The reason this workshop exists isn't because philosophy has the answers. It's because neuroscience is moving so fast that our concepts are breaking.

  When a neuroscientist says "fear circuit," and a philosopher says "fear experience," are we talking about the same thing? Sometimes yes. Sometimes no. And when the answer is "no," that's where the errors creep in. That's where we waste grant money chasing mechanisms for categories that don't exist, or where we ignore subjective data because we don't have the vocabulary to measure it.

  We aren't here to tell you that brain states don't matter. We're here to make sure that when you map a brain state, you know exactly what *kind* of claim you're making about the mind. You handle the mechanisms; we handle the conceptual engineering. But you can't engineer a bridge if you don't know what the two banks of the river look like.

  So, my request for today is simple: Let's not paper over the friction.

  When a philosopher uses a term like "representation" or "consciousness," I hope you'll challenge us: "Show me the neuron." And when you present a neural correlate, I hope you'll let us ask: "What exactly does this correlate *mean* for the organism's experience?"

  If we can do that, if we can use this friction to sharpen our definitions and target your experiments, then this workshop succeeds. We aren't here to agree that psychology reduces to neuroscience, or that it doesn't. We're here to make sure that however they relate, the relationship is rigorous enough to actually help patients, build better AI, or understand cognition.

  That is why this collaboration is worth funding. It's not about protecting turf. It's about making sure that when we claim to understand the mind, we aren't just telling a good story, but actually describing the world.

  Thank you to the med school for hosting, thank you to the Dean for the support, and thank you all for being willing to have the hard conversations. Let's have a great day.
