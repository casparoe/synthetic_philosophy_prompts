          *   *Follow-up:* What triggers the shift? Is it rational or causal?

      *   *Requirement 5: Individual vs. Collective.*
          *   *Idea:* Do individuals have hinges or just communities?
          *   *Likely Answer:* Mostly communal forms of life.
          *   *Follow-up:* What about the lone genius or the whistleblower?

