      *   *Skepticism:* Does saying "we can't doubt this" just admit the skeptic is right that we can't *prove* it, rather than showing the skeptic is wrong?
      *   *Entitlement/Permission:* Are we *entitled* to trust hinges, or is it just a psychological fact that we do?
