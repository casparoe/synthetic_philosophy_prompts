      *   *Decision:* I will argue for **Option C**, leaning heavily into the "Tragic Idealist" frame but sharpening it with his theological anthropology. Pascal is diagnosing the *human condition*, not defining justice itself. He is exposing the *miserability* of political justice without God, not denying the existence of Justice *simpliciter*.

