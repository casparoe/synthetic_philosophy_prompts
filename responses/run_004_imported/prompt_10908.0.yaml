      *   *On Intelligent Design:* Popper was a realist but also a fallibilist. He likely would have rejected ID, not necessarily just on falsifiability, but on its lack of explanatory power and its tendency to stop inquiry (appeal to miracle/designer). However, he might have criticized the *legal* codification of philosophy.

