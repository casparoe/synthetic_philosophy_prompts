      *   **Popper's 1978 Recantation:** In "Natural Selection and the Emergence of Mind," he revised his view. He acknowledged that natural selection *is* testable, provided we specify the mechanisms of heredity and variation. He distinguished between the *logic* of selection (which can be tautological) and the *biological theory* (which makes empirical claims).
      *   **Kitzmiller v. Dover (2005):** Judge John E. Jones III ruled that ID is not science. He relied heavily on expert testimony (e.g., Robert Pennock) which invoked methodological naturalism and falsifiability. The ruling treated evolutionary theory as robustly scientific.
