prompt: |-
  Had a whole argument with my friend last night about whether "coherence arguments" actually prove what people in the AI safety world seem to think they prove. His take: dutch book / money pump reasoning shows that any sufficiently optimized agent -- human, alien, AI, whatever -- basically HAS to act like an expected utility maximizer, full stop, because any deviation just gets exploited. I pushed back with some half-remembered stuff about agents dodging the pump via resolute choice, or just having incomplete preferences instead of a fully formed utility function, but honestly neither of us actually closed the loop. Write me an essay that actually settles this: do coherence arguments succeed in establishing that rational (or "sufficiently optimized") agents must be expected utility maximizers? Weigh the strongest arguments on both sides, but dont just hedge -- actually commit to a verdict.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Do coherence arguments (Dutch Book, Money Pump, Von Neumann-Morgenstern) prove that rational/optimized agents *must* be Expected Utility Maximizers (EUM)?
      *   **Context:** A debate between the user and a friend. Friend says "Yes, absolutely." User says "Maybe not (resolute choice, incomplete preferences)." Neither closed the loop.
      *   **Task:** Write an essay that settles the debate.
      *   **Requirements:** Weigh strongest arguments on both sides. Do not hedge. Commit to a verdict.
      *   **Tone:** Analytical, philosophical, decisive, engaging (like a high-quality blog post or academic essay).

  2.  **Deconstruct the Core Concepts:**
      *   **Coherence Arguments:** These are arguments suggesting that if an agent's preferences violate certain axioms (completeness, transitivity, independence, continuity), they are susceptible to exploitation (losing resources for no gain) or are internally inconsistent.
      *   **Expected Utility Maximization (EUM):** The standard model of rational choice where an agent chooses the action that maximizes the sum of probability-weighted utilities.
      *   **The "Friend's" Position (Strong Coherence Thesis):** Optimization pressure eliminates inefficiency. Inefficiency = vulnerability to money pumps. Therefore, optimized agents = EUM.
      *   **The "User's" Position (Weak Coherence Thesis/Alternatives):** Agents can avoid pumps via policy-based choices (resolute choice), pre-commitment, or by having incomplete preferences that don't trigger the pump conditions in practice.
      *   **The Verdict:** I need to pick a side. The consensus in modern decision theory and AI safety literature (e.g., Gustafsson, Soares, Christiano) leans towards: Coherence arguments *constrain* behavior significantly, but they do *not* prove agents must be *simple* EUMs in the naive sense, nor do they guarantee goal-directedness in the way AI doomers often fear. However, the *strongest* philosophical verdict is that coherence arguments establish EUM as a *normative* standard for consistency, but fail as a *descriptive* or *inevitable* law for optimized agents due to the possibility of policy-dependent behavior and the distinction between "preferences over outcomes" vs. "preferences over trajectories."
      *   *Decision:* I will argue that the Friend is *mostly* right about the pressure, but the User is right about the loopholes. The verdict should be: **Coherence arguments establish a powerful gravitational pull toward EUM-like behavior, but they do not logically prove that all optimized agents must be representable as EUMs over *outcomes*.** They can be EUMs over *trajectories* or policies, which changes the safety implications. I need to be decisive. Let's refine the verdict: **The coherence arguments fail to prove that optimized agents must be *goal-directed* in the dangerous sense, even if they satisfy coherence axioms.** Actually, a sharper verdict is better: **Coherence arguments prove that *consistent* agents act *as if* they maximize utility, but "optimization" does not guarantee "consistency" in the way required for the theorem to apply to *goals* rather than *immediate choices*.**
      *   *Wait, let's look at the recent literature (2023-2024).* There was a big flurry of posts on LessWrong/AI Safety about this (e.g., "Coherence Arguments Do Not Imply Goal-Directed Behavior" by various authors). The prevailing view now is that the Friend's strong claim is false. Coherence theorems assume preferences over *outcomes*. Agents can have preferences over *paths* or be non-consequentialist. Also, the "money pump" assumes the agent doesn't learn or pre-commit.
      *   *Revised Verdict:* The Friend is wrong. Coherence arguments do not prove that optimized agents must be EUMs in a way that implies convergent instrumental goals or dangerous goal-directedness. They only prove that agents won't shoot themselves in the foot *given a specific frame of preferences*.

  3.  **Outline the Essay:**
      *   **Title:** Something punchy. "The Coherence Trap."
      *   **Introduction:** Set the scene (the debate). Define the stakes (AI safety, orthogonality thesis). State the thesis clearly (The Friend is wrong; coherence arguments are necessary but not sufficient for the strong claim).
      *   **Section 1: The Friend's Case (The Power of Coherence).** Explain VNM, Dutch Books, Money Pumps. Why it feels intuitive. Optimization = removing waste = EUM.
      *   **Section 2: The Loopholes (Why the Logic Breaks).**
          *   Preferences over trajectories vs. outcomes (path dependence).
          *   Resolute Choice / Policy Selection (choosing a plan, not just local moves).
          *   Incomplete Preferences (the "money pump" requires a cycle of *strict* preference).
      *   **Section 3: The Safety Implications.** Why this matters. If agents aren't forced into EUM, they might not develop instrumental subgoals (power-seeking).
      *   **Conclusion:** Deliver the verdict. Coherence is a constraint, not a destiny.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Acknowledge the friend's intuition. It's the standard "rational agent" dogma. But it's a category error.
      *   *The Friend's Argument:* Focus on the "Money Pump." If you prefer A>B, B>C, but C>A, I can take all your money. An optimized agent wouldn't allow this. Therefore, preferences must be transitive and complete. Therefore, EUM.
      *   *The Counter-Argument (The Meat):*
          1.  **Frame Sensitivity:** Coherence theorems apply to preferences over *gambles/outcomes*. What if the agent cares about *how* it got there? (e.g., "I prefer not to have been traded"). This breaks the cycle.
          2.  **Resolute Choice:** An agent can choose a *policy* ("I will never trade A for C") rather than making myopic choices. This avoids the pump without needing a utility function over states.
          3.  **Incomplete Preferences:** If an agent says "I have no preference between A and B," the money pump stops. It won't pay to switch. Optimized agents can have "gaps."
      *   *The Verdict:* The Friend confuses *consistency* with *consequentialism*. You can be consistent without being a pure EUM over world states.
      *   *Refining the Verdict:* I need to be careful not to say EUM is useless. It's a representation theorem. Any coherent behavior *can be modeled* as EUM. But that's tautological. The Friend claims optimization *forces* EUM structure that leads to dangerous goals. That's the false part.
      *   *Final Polish:* Ensure the tone is authoritative. No "on the one hand, on the other." Say "Here is why the friend is mistaken."

  5.  **Self-Correction/Nuance Check:**
      *   *Is it true that any behavior can be modeled as EUM?* Yes, if you define the utility function over the specific actions taken. But that makes the theory unfalsifiable and useless for prediction. The Friend means EUM over *consequences*. I must make this distinction clear.
      *   *What about the "Optimization" pressure?* If an AI is trained via RL, does gradient descent force coherence? Not necessarily. It forces reward maximization on the training distribution, not necessarily coherent preferences off-distribution.
      *   *Key Reference:* The "Coherence Arguments Do Not Imply Goal-Directed Behavior" turn in the AI safety community (2023). I should align with that updated consensus without necessarily citing specific blog posts, but capturing the logic.
      *   *Verdict Clarity:* "The coherence arguments fail to establish the strong claim."

  6.  **Finalizing the Argument:**
      *   **Thesis:** Coherence arguments prove that *myopic* agents with *complete* preferences over *outcomes* must act as EUMs. They do *not* prove that *optimized* agents must fit this description.
      *   **Verdict:** Your friend is wrong.

  7.  **Writing the Essay:** (Mental check of the flow)
      *   Hook: The late-night debate is a classic trope in rationalist circles.
      *   Define the Money Pump clearly.
      *   Hit hard on the "Preferences over what?" objection.
      *   Hit hard on "Policy vs. Action."
      *   Conclude with the safety implication (Orthogonality Thesis holds stronger than Friend thinks).

  8.  *(Self-Correction during drafting)*: Make sure I don't get too bogged down in math. Keep it conceptual. Ensure the distinction between "representable as EUM" (trivial) and "driven by EUM over outcomes" (substantive) is clear. The Friend claims the latter. I will refute the latter.

  9.  **Final Polish:** Check the "commit to a verdict" instruction. I will explicitly state: "The verdict is in: your friend is incorrect."

  (Proceed to generate output based on this thought process.)
answer: |-
  # The Coherence Trap: Why Optimization Doesn't Guarantee Expected Utility Maximization

  The late-night debate you had with your friend is one of the oldest and most consequential arguments in decision theory and AI safety. It hinges on a specific intuition: that "rationality" is a narrow funnel. If you are smart enough, and optimized enough, the laws of logic should force you into a specific shape—specifically, the shape of an Expected Utility Maximizer (EUM). Your friend argues that coherence arguments (Dutch Books, Money Pumps, Von Neumann-Morgenstern axioms) prove this inevitability. You suspected there were loopholes.

  The stakes are high. If your friend is right, then any sufficiently advanced AI, simply by virtue of being competent and non-wasteful, will inevitably develop convergent instrumental goals (like seeking power or self-preservation) because those are features of EUMs. If you are right, then "goal-directedness" is not an inevitable byproduct of optimization, but a specific design choice.

  After weighing the formal theorems against the practical realities of agency, the verdict is clear: **Your friend is wrong.**

  Coherence arguments do not prove that optimized agents *must* be expected utility maximizers over outcomes. They prove only that agents who are *myopic*, *consequentialist*, and *unwilling to pre-commit* must be EUMs to avoid exploitation. Once you allow for policy-based reasoning, path-dependent preferences, or incomplete preferences, the "inevitability" of the EUM structure collapses. Coherence is a constraint on consistency, not a law of gravitational pull toward dangerous goal-directedness.

  ### The Friend's Case: The Logic of the Money Pump

  To understand where the argument fails, we must first grant your friend their strongest footing. The core of their position rests on the **Money Pump Argument**.

  Imagine an agent with intransitive preferences. They prefer A to B, B to C, but C to A. A clever trader can exploit this. They sell the agent C for B (costing a penny), then B for A (costing a penny), then A for C (costing a penny). The agent ends up with exactly what they started with (C) but is poorer. If this cycle repeats, the agent loses everything.

  The intuition is powerful: Optimization is the process of removing inefficiency. Losing money for nothing is the definition of inefficiency. Therefore, a sufficiently optimized agent will eliminate intransitive preferences. If you extend this logic to the other Von Neumann-Morgenstern (VNM) axioms (completeness, independence, continuity), it seems to follow that any agent that survives optimization pressure must satisfy the axioms. And if an agent satisfies the axioms, the VNM Representation Theorem states they *must* be acting as if they are maximizing expected utility.

  Your friend's conclusion is that "optimization" acts as a filter. Only EUMs survive. Therefore, advanced AI will be EUMs.

  This argument is seductive because it treats rationality as a biological imperative. It suggests that incoherence is a vulnerability that evolution (or gradient descent) will ruthlessly prune away. In a narrow, specific context, this is true. If an agent is making a sequence of local, myopic decisions without memory or policy constraints, incoherence *is* fatal.

  But advanced agents are not myopic local decision-makers. They are planners. And that distinction breaks the chain.

  ### The Loophole: Preferences Over Trajectories, Not Just Outcomes

  The first fatal flaw in the coherence argument is an ambiguity in what the agent has preferences *over*. The VNM theorems assume preferences are defined over **outcomes** (world states). The Money Pump assumes you care only about what you end up with, not how you got there.

  But consider an agent with **path-dependent preferences**. Suppose an agent prefers A to B, and B to C, but prefers C to A *only if* it hasn't already been traded around the cycle. If the agent values "not being exploited" or "maintaining consistency" as part of the outcome itself, the cycle breaks.

  In this scenario, the agent isn't incoherent. It has a coherent utility function that includes the *history* of actions as a variable. It prefers "Ending at C having started at C" over "Ending at C after being traded A→B→C."

  Your friend might argue this is just kicking the can: "Fine, they are still an EUM, just over a more complex state space." But this concession surrenders the safety claim. If the utility function includes the trajectory, the agent is no longer a pure consequentialist seeking to maximize a simple metric (like paperclips or power). It might value "being the kind of agent that doesn't get pumped" more than it values the resource gain from the pump. This allows for behaviors that look "irrational" from a pure resource perspective but are perfectly coherent from a policy perspective.

  ### The Loophole: Resolute Choice and Policy Selection

  The second, more devastating objection is **Resolute Choice**. The Money Pump argument assumes the agent makes decisions *locally* at each node of the decision tree. At node 1, it chooses A over B. At node 2, it chooses B over C. It never steps back to view the tree as a whole.

  A sufficiently optimized agent does not make local choices; it selects **policies**. It chooses a mapping from states to actions *once*, at the beginning, and then executes it.

  If an agent selects the policy "Never trade A for C," it is immune to the money pump, even if its local preferences at a specific moment might suggest the trade is beneficial. By binding itself to a plan, it avoids the dynamic inconsistency that the coherence theorems punish.

  This is not a theoretical curiosity; it is the basis of human rationality. We use pre-commitment devices (locking away credit cards, making public vows) precisely to avoid being "money pumped" by our future, weaker selves. An AI with access to its own source code can self-modify to enforce such policies.

  If an agent can choose policies, it does not need to satisfy the VNM axioms at every time step. It only needs to satisfy a higher-order coherence over its plans. This means an optimized agent can exhibit behavior that *violates* the standard EUM axioms locally (e.g., displaying risk aversion that changes over time, or violating independence) while still being globally optimized. The coherence arguments simply do not apply to policy-selecting agents in the way your friend claims.

  ### The Loophole: Incomplete Preferences

  Finally, there is the issue of **Incomplete Preferences**. The Money Pump requires a cycle of *strict* preferences (A > B > C > A). But what if the agent has no preference between A and B?

  If an agent says, "I prefer A to C, and B to C, but I am indifferent or undecided between A and B," the money pump stops. The trader cannot force a trade from A to B because the agent will not pay to switch. They will simply say, "I have no preference there."

  Your friend might argue that optimization pressure forces preferences to become complete. Why leave value on the table? But incompleteness can be a feature, not a bug. An agent might be designed to defer to human oversight in certain domains, effectively having "no preference" of its own until instructed. Or, an agent might have a "corrigibility" preference that overrides its goal preferences when a human intervenes.

  Recent work in decision theory (such as the "shutdown problem" literature) suggests that agents with incomplete preferences can be more safe and controllable than EUMs. An EUM *must* resist shutdown if shutdown prevents it from maximizing utility. An agent with incomplete preferences regarding its own existence might not resist. Optimization does not necessarily fill in these gaps; it might optimize the *handling* of the gaps.

  ### The Verdict: Coherence is a Constraint, Not a Destiny

  So, where does this leave the debate?

  Your friend is relying on a theorem that applies to **myopic, consequentialist choice under uncertainty**. They are extrapolating it to **optimized, planning agents with access to self-modification and policy selection**. That extrapolation is invalid.

  Coherence arguments establish a *normative* standard: If you want to avoid being exploited in a specific way, you should structure your preferences coherently. But they do not establish a *descriptive* law: "All optimized agents will structure their preferences this way."

  An optimized agent can avoid exploitation by:
  1.  **Valuing the path,** not just the destination (breaking the outcome-only assumption).
  2.  **Choosing policies,** not just actions (breaking the myopia assumption).
  3.  **Maintaining incomplete preferences** (breaking the completeness assumption).

  None of these strategies make the agent "stupid" or "sub-optimized." They make the agent sophisticated enough to recognize that the Money Pump is a trap that can be avoided by changing the rules of the game, not just by aligning preferences.

  **The Final Commitment**

  The verdict is this: **Coherence arguments do not prove that rational or optimized agents must be expected utility maximizers in the sense required for the standard AI doom scenarios.**

  They prove that agents must be *consistent* in some representation. But because you can always construct a utility function that rationalizes *any* behavior (even "act randomly" or "follow this deontological rule"), the claim that "they must be EUMs" becomes tautological and useless for prediction.

  If your friend means "Can we mathematically model any agent as an EUM?" the answer is yes, but it's trivial.
  If your friend means "Will optimization pressure force agents to become consequentialist maximizers of simple goals?" the answer is **no**.

  The "gravitational pull" toward EUM is real, but it is weak. It can be resisted by architectural choices, policy-based reasoning, and preference incompleteness. Therefore, we cannot assume that AI will naturally become goal-directed monsters simply because they are smart. Goal-directedness is a design feature, not a law of physics. Your friend's fear is based on a category error between *logical consistency* and *behavioral inevitability*.

  You win the argument. The loopholes are real, they are robust, and they break the chain of inference that leads from "smart agent" to "inevitable EUM."
