answer: |-
  **To:** Graduate Seminar on Conditionals
  **From:** [Your Name]
  **Re:** Lewis's Triviality and the Structure of the Conditional

  The consensus in your response papers—that Lewis's 1976 result forces us to abandon truth conditions for conditionals—is the standard "CliffsNotes" takeaway. It is not wrong, but it is shallow. It treats the triviality result as a metaphysical discovery about the *nature* of conditionals, rather than a logical discovery about the *interaction* between probability, updating, and syntax. Most of you concluded that because the Equation ($P(A \to B) = P(B|A)$) leads to collapse, conditionals cannot be propositions. But that skips the crucial step: *why* does it lead to collapse?

  The collapse does not arise from the Equation holding at a single time. It arises from the demand that the Equation hold *diachronically*—that is, across a family of credence functions closed under conditionalization. If you only demand the Equation for your current credence function $P$, you can assign truth conditions to $A \to B$ quite happily. The trap snaps shut only when you require that a rational agent who learns $A \to B$ must update their credence in accordance with the Equation.

  Here is the logical shape of the trap, stripped of the algebraic noise.

  ### 1. The Mechanism of the Trap

  Lewis's argument assumes three things:
  1.  **Propositionality:** The conditional $A \to B$ expresses a proposition in the algebra (it has truth conditions).
  2.  **The Equation:** For any admissible credence function $P$, $P(A \to B) = P(B|A)$.
  3.  **Conditionalization:** If an agent learns $A \to B$, their new credence function $P'$ is derived by conditionalizing $P$ on the proposition $A \to B$.

  The triviality emerges when we calculate the new credence in the conditional after learning it. If $A \to B$ is a proposition, we can conditionalize on it. Let $P_{A \to B}$ be the credence function after learning $A \to B$ is true. By the definition of conditionalization, $P_{A \to B}(A \to B) = 1$.

  Now, apply the Equation to this *new* function $P_{A \to B}$. Since the Equation must hold for all functions in the family:
  $$P_{A \to B}(A \to B) = P_{A \to B}(B|A)$$
  Since the left side is 1, the right side must be 1. So, learning the conditional makes you certain that $B$ is true given $A$.

  However, standard probability theory tells us that $P_{A \to B}(B|A) = P(B | A \land (A \to B)) / P(A | A \to B)$. Lewis shows that for this to equal 1 for *any* initial probability function (where $0 < P(A) < 1$), the initial probability $P(B|A)$ must have already been 0 or 1. In other words, you can only have truth-conditional conditionals that satisfy the Equation if your credences are already trivial (you are certain about everything relevant).

  **Why the "Rich Algebra" matters:** To run this proof, we need to be able to conditionalize on $A \to B$ without crashing the probability of $A$ to zero. We need a space rich enough to contain $A$, $B$, $A \land B$, $A \land \neg B$, and the conditional proposition itself as distinct cells. If the algebra is too sparse, the update is impossible; if it is rich enough to allow the update, the Equation forces the probabilities of the atoms to 0 or 1.

  The moral is not simply "Conditionals aren't propositions." The moral is: **You cannot have a propositional conditional that behaves like a proposition under updating while simultaneously tracking conditional credence.**

  ### 2. The Verdict: The Restrictor Theory

  So, where do we land? The seminar seems to have defaulted to the Adams/Edgington view: conditionals have no truth conditions; they are merely expressions of conditional credence. I am rejecting this. It is the path of least resistance, and it creates more problems than it solves.

  I am defending the **Restrictor Theory** (associated with Angelika Kratzer).

  On this view, the "if"-clause is not a propositional connective that forms a complex proposition $A \to B$. Instead, "if" is a syntactic restrictor on a covert modal operator. When you say "If it rains, the match will be cancelled," you are not asserting a conditional proposition. You are asserting a modal claim: "Given that it rains, it must be that the match is cancelled." The logical form is not $A \to B$, but $\text{MUST}_A (B)$.

  This dissolves Lewis's trap without abandoning truth conditions for the *sentence*.

  **Why this vindicates the Equation without Triviality:**
  Lewis's result assumes $A \to B$ is an input to the probability function $P$. If the Restrictor Theory is correct, there is no proposition $A \to B$ to input. There is only the modal claim. The Equation $P(\text{If } A, B) = P(B|A)$ is not a claim about the probability of a conditional proposition; it is a theorem about the probability of a modal claim restricted by $A$.
  $$P(\text{MUST}_A(B)) = P(B|A)$$
  This holds because the semantics of the modal *just is* to quantify over the $A$-worlds. Since there is no standalone proposition $A \to B$, we cannot conditionalize on it. We can only conditionalize on $A$, or on the modal claim itself (which is distinct). The diachronic trap is sprung because the syntactic presupposition of the trap (that there is a conditional proposition to update on) is false.

  **Why this is superior to Adams:**
  The Adams view saves the Equation by denying truth conditions. But language does not respect that denial. We embed conditionals. We say, "If if it rains, the match is cancelled, then we should move it indoors." We negate them: "It's not the case that if it rains, the match is cancelled."
  If conditionals have no truth conditions (as Adams claims), they cannot be the inputs to negation or the antecedents of other conditionals. This is the **Embedding Problem** (or Frege-Geach problem). Adams has to engage in contortionist pragmatics to explain why natural language *looks* like it embeds conditionals when semantically it cannot. The Restrictor Theory handles embeddings naturally: "If (if A, B), C" is just a modal restricted by a modal restriction. It preserves the compositional semantics of natural language.

  ### 3. The Ugly Costs of the Alternatives

  To be clear, choosing the Restrictor Theory requires us to accept the costs of the alternatives we reject. You need to know what those costs are to understand why the Restrictor view is worth the theoretical machinery.

  **If you choose Adams/Edgington (No Truth Conditions):**
  You must accept that a vast swath of natural language logic is systematically misleading. Every time a student writes "If P then Q" in a proof, or a lawyer argues "If the contract is void, then...", they are technically speaking nonsense, because there is no proposition to be void or true. You save the probability data at the cost of semantic coherence. You are forced to treat logic as a theory of *assertability* rather than *truth*, which makes it difficult to explain valid inference patterns involving embedded conditionals (like Hypothetical Syllogism) without ad hoc rules.

  **If you choose Stalnaker (Restrict the Equation):**
  Stalnaker attempts to save truth conditions by denying that the Equation holds for the *updated* credence function. He argues the Equation holds for your *actual* credence, but rationality does not require it to hold after you learn the conditional.
  The ugly cost here is **Diachronic Irrationality**. It implies that a rational agent, upon learning a conditional is true, must update their credences in a way that violates the very norm (the Equation) that defined the conditional's meaning in the first place. It severs the link between the meaning of the conditional and the rational update it motivates. It makes the Equation a lucky coincidence of our current ignorance rather than a semantic law.

  **If you choose Trivalence (Truth Value Gaps):**
  You can say $A \to B$ is true if $A$ and $B$ are true, false if $A$ is true and $B$ false, and undefined if $A$ is false. This saves truth conditions.
  The cost is **Probability Theory Collapse**. Kolmogorov's axioms assume bivalence. If propositions can lack truth values, standard probability calculus breaks. You have to rebuild probability theory from the ground up (e.g., using conditional events algebra). While technically possible, it isolates your semantics from the rest of mathematics and decision theory.

  ### 4. Conclusion

  The Restrictor Theory is not without cost. Its ugliest price is **Bare Indicatives**. In sentences like "If it rains, the ground is wet," there is no overt modal like "must" or "might." The Restrictor theorist must posit a *covert* modal operator to do the work. To the uninitiated, this looks like moving the goalposts: "There's no conditional proposition." "Oh yes there is, it's a modal proposition." "Where's the modal?" "It's invisible."

  However, this cost is lighter than the alternatives. Positing covert structure is standard in linguistics (e.g., covert tense, covert pronouns). It is less damaging to posit a silent modal than to deny truth conditions to entire classes of sentences (Adams) or to claim rational updating violates semantic norms (Stalnaker).

  Lewis's result is not a proof that conditionals are magical non-propositions. It is a proof that **binary connectives cannot carry conditional credence.** The Restrictor Theory respects this by denying the connective. It saves the Equation as a reflection of modal semantics, preserves the logic of embedding, and keeps probability theory intact.

  Your response papers treated "No Truth Conditions" as an escape hatch. It is not. It is a demolition of the bridge between semantics and logic. The Restrictor Theory repairs the bridge by showing it was built on the wrong foundation. Don't just abandon the project because the blueprints were wrong; redraw the plans.
