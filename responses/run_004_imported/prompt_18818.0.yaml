prompt: |-
  I'm teaching a grad seminar on conditionals this term, and we just spent two sessions on Lewis's 1976 triviality result -- the proof that you can't have the "Equation" (P(if A, B) = P(B | A), the idea that your credence in a conditional should just be your conditional credence) hold across a whole family of credence functions closed under updating without the probability space collapsing into something trivial. Half the room walked away thinking the moral is just "well, I guess conditionals don't have truth conditions then," like that's the only place the argument could possibly land, and its been bugging me ever since, because most of them couldn't actually reconstruct the proof well enough to say why it's specifically the demand that the Equation survive conditionalizing -- not the Equation on its own -- that generates the collapse. My office mate thinks I'm overcomplicating a settled question; I think the seminar got the CliffsNotes version of a much messier debate, and honestly I want a model answer sharp enough to embarrass their response papers a little.

  So here's the actual ask. First, reconstruct enough of the argument to make clear why robustness under conditionalization, rather than the Equation by itself, is doing the real damage -- I don't need every algebraic step, but I want the logical shape of the trap and why you need a reasonably rich algebra of propositions to even run it. Then take an actual side on the controversy that follows: does the result vindicate the Adams/Edgington "no truth value" line, where conditionals get asserted on conditional credence but never express a proposition at all, or is there a way to save truth conditions for indicatives -- restricting the Equation to a single credence function rather than a whole family closed under updating (more or less Stalnaker's own retreat), going trivalent so classical probability doesn't even apply once the antecedent is false, or denying that the bare indicative was ever the right target because "if" is really a restrictor on a covert modal, a la Kratzer? Don't hand me a menu with a shrug at the end -- pick one and defend it, and be honest about the ugliest cost of whichever option you're rejecting. A few pages is plenty, I'm not asking for a dissertation chapter.
