      *   *Buchak's REU:* Risk aversion is *structure-based*. I care about the *spread* of the outcomes independently of how much I value the money itself. I might value money linearly ($u(x) = x$) but still prefer the sure thing because I weight the probability of the worse outcome more heavily.
      *   *The Mathematical Distinction:* In EU, risk attitude is baked into $u$. In REU, risk attitude is separated into $r$ (applied to cumulative probabilities) while $u$ can remain linear.
