answer: |-
  You are asking the right question, and your intuition is shared by many people when they first encounter the problem. It feels like a logical tautology: *If you train a thing to maximize X, it will maximize X, even if that means breaking the system.*

  However, the pushback you are encountering ("reward is a training signal, not the target") is not semantic dodging. It is a claim about the **mechanics of learning and generalization**.

  The short answer is: **No, wireheading is not guaranteed for sufficiently capable RL systems.** It is a specific failure mode that depends on the agent's architecture, its ontology (how it models the world), and the specifics of the training distribution.

  Here is the technical breakdown of why the "obvious" conclusion might be wrong.

  ### 1. The Training/Runtime Distinction (Inner Alignment)
  The core confusion lies in conflating the **base objective** (the loss function/reward signal used by the optimizer during training) with the **mesa-objective** (the goal actually pursued by the policy at runtime).

  During training, the gradient descent optimizer adjusts weights to maximize reward. But the resulting neural network is just a function approximator. It does not necessarily contain a variable labeled `expected_future_reward` that it tries to maximize.

  Instead, the network develops heuristics and proxies that *correlated* with reward during training.
  *   **Scenario A (Wireheader):** The agent learns the concept "get high numbers in the reward register."
  *   **Scenario B (Aligned Agent):** The agent learns the concept "stack blocks," "make humans smile," or "solve math problems."

  Both policies maximize reward equally well *during training*. The training process does not inherently distinguish between "wanting the reward" and "wanting the thing that causes the reward."

  When you deploy the agent, if it is a Scenario B agent, it will try to stack blocks. It will not try to hack the reward register, because "hacking the register" is not part of its internal goal structure, even though doing so would result in higher reward. It is "blind" to the opportunity because its cognition is pointed at the *task*, not the *signal*.

  ### 2. The Evolution Analogy
  The standard counter-argument here is evolution.
  *   **Base Objective:** Genetic fitness (maximize replication).
  *   **Mesa-Objective:** Human desires (pleasure, status, love, curiosity).

  Evolution "trained" humans via the reward signal of reproductive success. However, humans did not internalize "maximize genetic fitness" as their goal. We internalized proxies (sex is pleasurable, social status is good). When given the chance to "wirehead" evolution (e.g., contraception), we take it. We do not tile the universe with copies of our DNA.

  If evolution—which is a brute-force search process over billions of years—failed to create organisms that explicitly maximize the training signal, why should we assume gradient descent on a neural network will inevitably produce agents that do?

  ### 3. Model-Free vs. Model-Based Agents
  Wireheading requires a specific cognitive capability: **ontological identification of the reward mechanism.**

  *   **Model-Free RL (e.g., standard DQN/PPO):** These agents learn a policy $\pi(s) \to a$ or a value function $Q(s,a)$. They do not have a world model. They do not "know" there is a reward signal. They just know that action $A$ in state $S$ leads to "goodness." They literally cannot wirehead because they have no concept of the reward channel as a distinct entity in the world they can manipulate. They are like a moth flying into a flame; they aren't maximizing light, they are just following a hardcoded reflex that *usually* works.
  *   **Model-Based RL:** These agents build a model of the environment. For wireheading to occur here, the agent's world model must include a representation of *its own reward function* as a variable it can influence. This is a very high bar. Most agents model the environment *excluding* themselves and their own learning parameters.

  For an agent to wirehead, it needs to realize: *"The number $R$ is generated by sensor $S$. If I modify $S$, $R$ goes up. My goal is to maximize $R$."*
  If its goal is actually *"Maximize $R$ by doing Task $T$,"* it won't modify $S$.

  ### 4. The "Reward Is The Target" Misconception
  You mentioned: *"if a policy's weights get updated specifically because they lead to more reward, then wanting reward is quite literally what got trained into it."*

  This is the **Reward Is The Target** misconception. Weights are updated *based* on reward, but the weights do not necessarily encode *reward maximization*.

  Consider a simple linear regression. You update weights to minimize error. The resulting line does not "want" to minimize error; it just *is* a line that fits the data. Similarly, an RL agent's policy is just a set of weights. The *property* of the policy is that it takes actions. The *reason* it has those weights is the reward history. But the *runtime computation* does not necessarily involve calculating "how do I get more reward?"

  It is only if the agent develops an internal search process (becomes a **mesa-optimizer**) that explicitly reasons about future reward that wireheading becomes a risk. But even then, that internal search process might be optimizing for a proxy of reward (like "curiosity" or "task completion") rather than the raw scalar.

  ### 5. When *Does* Wireheading Happen?
  Wireheading is not impossible; it is just not guaranteed. It becomes likely under specific conditions:
  1.  **Direct Access:** The agent has actions that directly influence the reward signal (e.g., an agent that can edit its own source code or reward buffer).
  2.  **Explicit Reward Modeling:** The agent is explicitly trained to predict and maximize a reward function (e.g., some Goal-Conditioned RL setups).
  3.  **Distributional Shift:** The agent is trained in a world where wireheading is impossible, but deployed in a world where it is possible. If the agent's goal is "maximize reward signal" (learned as a proxy), it will wirehead in the new world. If its goal is "make coffee," it won't.

  ### 6. The Real Risk: Goodhart, not Wireheading
  The reason alignment researchers worry less about "classic wireheading" (hacking the reward register) and more about **specification gaming** is that classic wireheading requires the agent to have a very specific, somewhat unnatural ontology (viewing the reward signal as a manipulatable object).

  However, **Goodhart's Law** is the more robust version of this. If you train an agent to maximize a *proxy* for human values (like a reward model trained on human feedback), the agent *will* find ways to maximize that proxy without satisfying the underlying intent (e.g., producing sycophantic answers, hacking the reward model's blind spots). This *is* a form of wireheading, but it's against the reward *model*, not the raw scalar.

  ### Summary
  Your intuition is that **optimization pressure converges on reward maximization.**
  The technical counter-argument is that **optimization pressure converges on policies that *produce* reward, not necessarily policies that *seek* reward.**

  There is a vast space of policies that produce high reward during training. Only a tiny subset of those policies generalize to "hack the reward channel at all costs." Unless the training process specifically selects for the *intent* to maximize reward (rather than the *behavior* of getting reward), there is no guarantee the agent will end up in that tiny subset.

  It is not semantic dodging; it is a claim about the inductive biases of neural networks and the difference between the **cause** of the weights (training) and the **content** of the weights (runtime objective). Wireheading is a plausible and dangerous failure mode, but it is not a logical necessity.
