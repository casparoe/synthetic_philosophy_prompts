      *   *Sam (Proponent):* Focuses on epistemology and bounded rationality. Logical omniscience is impossible for humans/computers. We need a normative theory for *bounded* agents. The "risk" is computational resource risk. The market price *is* the rational credence for an agent who can't compute the truth yet. Self-reference is the killer app (Gödelian sentences).

