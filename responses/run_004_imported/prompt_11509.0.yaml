prompt: |-
  Okay so I live in a group house with six other people (pretty rationalist/EA-adjacent crowd, we literally have a Discord bot that runs polls for house decisions), and last month we ran into something that's been bugging me since. We had to decide whether my housemate's partner could get a key, and the house rule is he qualifies only if he clears two seperate conditions: stays over enough nights, and actually pulls his weight on chores/groceries. So instead of one big vote we ran it as two sub-polls. Sub-poll one passed 4-3. Sub-poll two also passed 4-3, but with a totally different coalition of yes-voters, and when someone cross-referenced the actual ballots it turned out only two of us had voted yes on both conditions. If we'd just put "should he get a key" to a straight yes/no vote, it would've failed 2-5. Someone in the house recognized this as basically the doctrinal paradox from Kornhauser and Sager's old legal theory papers on collegial courts, which Pettit later generalized into the "discursive dilemma," and which List and Pettit apparently turned into a full-blown impossibility theorem for judgment aggregation that's structurally a cousin of Arrow's theorem, just for judgments instead of preferences. I went down a rabbit hole reading about it and now I can't stop side-eyeing every vote our house has ever taken.

  Can you give me the most important implications of the discursive dilemma / judgment-aggregation impossibility results for how a small group like mine should actually structure its collective decisions? I'm especially trying to get my head around three things: (1) whether there's any principled way to choose a premise-based (issue-by-issue) procedure over a conclusion-based (straight up-or-down) one, given that whoever controls that choice basically controls the outcome; (2) what we really give up if we abandon the "systematicity" condition the impossibility result leans on — treating every proposition the same way regardless of context — and whether relaxing it is a genuine fix or just relocates the arbitrariness into whoever sets the agenda or the voting order; and (3) whether "deliberate more before voting" is an actual solution, on the theory that it makes people's judgments correlated enough that the bad coalition patterns stop showing up, or whether that's in real tension with the Condorcet-jury-theorem-style story about why majority votes track truth in the first place, which kind of needs everyone's errors to be independent. Basically: is there a defensible way to run a household (or a jury, or a committee) here, or does the math just say we're screwed no matter which procedure we pick?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Lives in a 7-person group house (rationalist/EA-adjacent). Uses Discord bots for polling.
      *   **The Incident:** A vote on a housemate's partner getting a key. Rule: Must pass Condition A (nights) AND Condition B (chores).
      *   **The Result:**
          *   Vote on A: 4-3 Yes.
          *   Vote on B: 4-3 Yes.
          *   Intersection (Yes on both): Only 2 people.
          *   Direct Vote on "Key": Would have been 2-5 No.
      *   **Theoretical Identification:** User correctly identifies this as the *Doctrinal Paradox* (Kornhauser & Sager), generalized to the *Discursive Dilemma* (Pettit), and linked to Judgment Aggregation Impossibility Theorems (List & Pettit), akin to Arrow's Theorem.
      *   **The Ask:** What are the implications for a small group's decision structure? Specifically addressing three points:
          1.  Premise-based vs. Conclusion-based procedures (and the power dynamic of choosing the procedure).
          2.  Abandoning "Systematicity" (treating propositions differently) – is it a fix or just agenda control?
          3.  Deliberation vs. Independence (Condorcet Jury Theorem tension).
      *   **Tone:** High intellectual bandwidth, familiar with social choice theory jargon, pragmatic but theoretically rigorous. "Rationalist/EA-adjacent" suggests valuing clarity, truth-tracking, and systemic design.

  2.  **Analyze the Three Specific Questions:**

      *   **(1) Premise-based (PB) vs. Conclusion-based (CB):**
          *   *PB:* Vote on premises (A & B), derive conclusion (Key). Result: Yes (4-3, 4-3 -> Key).
          *   *CB:* Vote on conclusion (Key). Result: No (2-5).
          *   *The Problem:* They yield different outcomes. Choosing the procedure determines the winner.
          *   *Implication:* PB promotes consistency and integrity of the rule system. CB promotes direct democratic will. In a house with *rules* (like the 2-condition rule), PB is usually more defensible because the rules *are* the premises. However, the user is right to worry about procedural manipulation.
          *   *Solution:* Pre-commitment to procedure *before* specific cases arise (constitutional level vs. operational level).

      *   **(2) Systematicity and Agenda Control:**
          *   *Systematicity:* Anonymity + Independence + Neutrality across propositions. List & Pettit show you can't have Universal Domain, Anonymity, Systematicity, and Consistency all at once.
          *   *Relaxing Systematicity:* Allow some propositions to be treated differently (e.g., premises get majority, conclusions get derived).
          *   *Risk:* Yes, this creates "agenda power." Who decides what is a premise?
          *   *Mitigation:* Constitutionalize the decision structure. Make the "logic of decision" part of the house agreement, not subject to vote per issue.
          *   *Nuance:* In a house, not all issues are equal. Chore rotas differ from eviction decisions. Context-specific weighting is actually a feature, not a bug, if agreed upon ex-ante.

      *   **(3) Deliberation vs. Independence (Condorcet Jury Theorem - CJT):**
          *   *CJT:* Requires independent errors. If everyone correlates their errors, accuracy drops.
          *   *Deliberation:* Makes judgments correlated (people converge).
          *   *Tension:* Deliberation reduces independence (bad for CJT math) but improves individual competence/quality of premises (good for truth-tracking).
          *   *Resolution:* The "Independence" assumption in CJT is often unrealistic in social settings. Deliberation is necessary to establish *shared facts* (the premises). If premises are disputed, voting is meaningless. The goal isn't statistical independence; it's epistemic alignment on the *structure* of the problem.
          *   *Practical:* Deliberate on premises, vote on conclusion? Or deliberate to align priors, then vote independently? Usually, deliberate to define the question, then vote.

  3.  **Synthesize the "So What?" for a Group House:**

      *   The math says you *are* screwed if you try to satisfy all normative desiderata simultaneously (Consistency, Democracy, Rationality, etc.).
      *   You must trade off.
      *   *Key Insight:* The impossibility theorem applies to *aggregating judgments*. It doesn't forbid *designing institutions*.
      *   *Recommendation:* Move from "voting on issues" to "voting on the decision procedure."
      *   *Specific Advice:*
          *   Constitutionalize the logic (PB vs CB).
          *   Distinguish between "Rule Setting" (Constitution) and "Rule Application" (Operations).
          *   Use Deliberation to align on Premises, not to coerce votes.
          *   Accept that "Fairness" is procedural, not outcome-based.

