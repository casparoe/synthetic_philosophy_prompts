prompt: |-
  My friend from my MA cohort is getting married next month and asked me to do the toast. She wrote her thesis on Lewis's Convention, her fiancé's never read a page of philosophy, and I'm worried that if I use the real theory -- especially the arbitrariness clause -- it'll sound to her parents like I'm calling the marriage arbitrary, when the whole point of Lewis's account is that arbitrariness plus common knowledge plus everyone still choosing to conform is exactly what makes a convention real and stable instead of imposed. Write the toast (5ish minutes read aloud) using that actual machinery -- coordination problems, common knowledge, precedent generating salience over repeated occasions -- including how thier years of dumb little private rituals were already conventions evolving before the wedding made it official, so it plays as a love letter to the non-philosophers in the room and doesn't feel watered down to the ones who've actually read the book.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a friend from an MA cohort.
      *   **Speaker:** Fellow MA student (philosophy background).
      *   **Honoree:** The Bride (wrote thesis on David Lewis's *Convention*).
      *   **Audience:** Mixed. Bride (expert), Groom (non-philosopher), Parents/Family (likely non-philosophers, sensitive to the word "arbitrary"), Friends (mixed).
      *   **Key Constraint:** Must use actual Lewisian machinery (coordination problems, common knowledge, precedent, salience, arbitrariness + conformity) without sounding like marriage is *meaningless* or *random* (the "arbitrariness" trap).
      *   **Goal:** A love letter to the non-philosophers that doesn't feel watered down to the philosophers.
      *   **Length:** ~5 minutes read aloud (approx. 700-800 words at a moderate pace).
      *   **Tone:** Warm, witty, intellectually honest, emotionally resonant.

  2.  **Deconstruct David Lewis's *Convention* (for the Toast):**
      *   *Coordination Problem:* A situation where people need to align actions for mutual benefit (e.g., driving on the left vs. right).
      *   *Arbitrariness:* The specific solution doesn't matter as much as *having* a solution (left vs. right doesn't matter, but *agreeing* matters). In marriage context: It doesn't matter *who* does the dishes, but agreeing *how* you do them matters.
      *   *Precedent/Salience:* Past solutions guide future expectations.
      *   *Common Knowledge:* We know that we know that we know we agree.
      *   *Conformity:* Everyone chooses to stick to the agreement because they expect others to.
      *   *The "Trap":* If I say "marriage is arbitrary," parents hear "marriage is random/meaningless."
      *   *The Fix:* Frame "arbitrariness" not as "lack of meaning" but as "freedom of choice." The meaning comes from the *commitment* to the convention, not the inherent necessity of the specific act. The stability comes from *choosing* to conform when you could do otherwise.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor. Address the thesis immediately to break the tension. Establish the "insider" vibe without alienating the room.
      *   **The "Arbitrariness" Problem:** Tackle the elephant in the room. Explain Lewis's definition of arbitrariness carefully. It's not "capricious"; it's "not forced by nature."
      *   **Coordination Problems:** Frame life as a series of these. Who cooks? Who apologizes first? How do we spend Sunday?
      *   **Precedent & Salience:** Talk about their history. The "dumb little private rituals." These aren't just quirks; they are data points building a system.
      *   **Common Knowledge:** The wedding itself. It's the public declaration that creates the "common knowledge" state. Everyone here knows you know you're committed.
      *   **The Payoff (Conformity):** Why stay? Because you *want* to. That's the love part.
      *   **Closing:** Raise a glass. Tie it back to stability and choice.

  4.  **Refining the Language (Iterative Process):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add specific examples (coffee order, the "weird dance," who kills the spiders).
      *   *Critique:* Is the Lewis theory accurate?
      *   *Fix:* Ensure "common knowledge" is distinguished from just "mutual knowledge." Ensure "arbitrariness" is contextualized as "alternative solutions were possible."
      *   *Critique:* Will the parents freak out?
      *   *Fix:* Explicitly state that "arbitrary" does not mean "unimportant." Use the driving analogy (driving on the right isn't 'natural,' but the agreement saves lives).
      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences punchy. Monitor word count.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   Start with: "I was terrified when [Bride] asked me to speak."
      *   Mention the thesis: "She wrote on Lewis."
      *   Explain Lewis: "Conventions solve coordination problems."
      *   Apply to love: "Love isn't just a feeling, it's a solution."
      *   Address the Groom: "You haven't read Lewis, but you live it."
      *   Address the Parents: "Arbitrary doesn't mean random."
      *   The Rituals: "Your Tuesday tacos, the way you argue about the thermostat."
      *   The Wedding: "This ceremony creates Common Knowledge."
      *   Conclusion: "Choose each other every day."

  6.  **Polishing for Tone:**
      *   Make sure it sounds like a speech, not a lecture. Use rhetorical pauses.
      *   Ensure the emotional arc lands on *commitment*, not just *theory*.
      *   Check the timing. 750 words is about 5 minutes at a slow, speech-like pace.

  7.  **Final Review against Constraints:**
      *   Lewis machinery included? Yes (Coordination, Arbitrariness, Precedent, Salience, Common Knowledge, Conformity).
      *   Parents safe? Yes (Reframed arbitrariness).
      *   Groom included? Yes (Validated his intuition).
      *   Bride honored? Yes (Her work is central).
      *   Length? Looks good.

  8.  *(Self-Correction during drafting)*: I need to be careful not to make marriage sound like a traffic rule. I need to emphasize that *because* it's arbitrary (chosen), the commitment is what gives it weight. If it were biologically determined, it wouldn't be love.

  9.  **Final Polish:** Check the flow. Ensure the transition from "theory" to "emotion" is seamless. (Proceed to generate output).

  *(Word Count Check during drafting)*: Aiming for ~750-850 words.
  *   Intro: 150 words.
  *   Theory/Arbitrariness: 200 words.
  *   Rituals/Precedent: 200 words.
  *   Common Knowledge/Wedding: 150 words.
  *   Conclusion: 150 words.
  *   Total: ~850 words. At 150 wpm (speaking pace), that's roughly 5.5 minutes. I might need to trim slightly to ensure it doesn't drag. Let's aim for tight phrasing.

  *Revised Plan:* Focus on the emotional weight of "choosing." That's the bridge between Lewis and Love.

