answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I met [Bride] during our MA program. And when she asked me to give this toast, I was honored. And then I was terrified.

  Because [Bride] wrote her thesis on David Lewis's *Convention*. And for the non-philosophers in the room—specifically [Groom], and [Bride]'s parents, who I know are already side-eyeing me—that sounds dry. It sounds like traffic laws or which side of the sidewalk to walk on.

  But here is the thing I learned from [Bride], and from watching the two of you: Lewis's theory isn't about rules. It's about how we build a world together when there is no script.

  Lewis argues that a convention arises to solve a "coordination problem." Life is full of these. Who apologizes first after a stupid fight? Who kills the spider? How do we spend Sunday morning? There is no "correct" biological answer to these questions. Lewis calls this "arbitrariness."

  Now, [Bride]'s parents, please hear me: In philosophy, "arbitrary" does not mean "meaningless" or "random." It means "not forced by nature." Driving on the right side of the road is arbitrary; driving on the left works just as well. But *agreeing* on which side to drive on is what keeps us safe.

  If your love was biologically determined, if you were forced to be together by instinct or social pressure, it wouldn't be a marriage. It would be a trap. The fact that your specific way of loving is "arbitrary"—in Lewis's sense—is actually its greatest strength. It means you are free to choose it. And you do.

  I've watched you two solve coordination problems for years. I've seen the evolution of your precedents. Lewis says conventions gain "salience" through repetition. You know this better than anyone. It's in the dumb little rituals that look like nonsense to the rest of us. It's the specific way you make coffee for each other. It's the weird dance you do when the song comes on. It's the unspoken agreement that [Groom] navigates and [Bride] controls the music.

  To an outsider, these look like quirks. To a Lewisian, these are data points. Every time you repeated those rituals, you were generating precedent. You were signaling to each other: *I know what you expect, and I expect you to know what I expect.* You were building a private language of stability in a chaotic world.

  And that brings us to today.

  Why have a wedding? Why stand up in front of fifty people and say vows you've already said in the kitchen at 2 AM?

  Lewis talks about "Common Knowledge." Mutual knowledge is when I know you love me, and you know I love you. Common knowledge is when I know that you know that I know, and *everyone in this room knows that we all know.*

  This ceremony is the mechanism that turns your private conventions into public common knowledge. It locks the coordination problem in place. It tells the world, and more importantly, it tells each other: *The precedent is set. The expectation is clear.*

  But here is the most beautiful part of Lewis's account, and the part that matters most for a marriage. Lewis says a convention only holds if everyone *chooses* to conform, even when they could do otherwise.

  A convention isn't a cage. It's a promise.

  [Groom], you told me you've never read a page of philosophy. That doesn't matter. You have been living Lewisian theory since the day you met her. Every time you chose to compromise, every time you recognized her signal, every time you stuck to the ritual even when you were tired—you were sustaining the convention. You were proving that your agreement wasn't imposed. It was chosen.

  [Bride], you spent years studying how we agree on meaning. But tonight, you don't need a thesis. You have a husband who knows, without a shadow of a doubt, that when you signal, he will be there.

  So, let's raise a glass.

  To [Bride] and [Groom]. May your coordination problems be few. May your precedents be happy. And may you never stop choosing, every single day, to conform to the beautiful, arbitrary, stable world you have built together.

  To the happy couple.
