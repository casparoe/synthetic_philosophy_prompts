      *   *Explanation:* If I ask "Why does a triangle have 3 sides?", the answer is "By definition." If I ask "Why did you draw a triangle?", the answer is "Because I wanted to."
      *   *Application:* "Why does Judas sin?" = "By definition of Judas." "Why does Judas exist?" = "Because God chose this world."
