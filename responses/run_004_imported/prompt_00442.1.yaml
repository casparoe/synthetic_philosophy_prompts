prompt: |-
  Was arguing with my roommate last night about that classic 3-judge panel example from judgment aggregation theory — you know, the one where each judge has a view on (a) whether the defendant breached a contract, and (b) whether the breach caused damages, and the conclusion (c) whether the defendant is liable, with liability defined as breach AND damages. The annoying thing is that if you take majority votes issue-by-issue on (a) and (b) and then plug the results into the rule, you get "liable," but if you just take a majority vote on the bottom-line question (c) directly, you can get "not liable." My roommate insisted courts should just use a conclusion-based procedure, since that's literally what's being decided, and letting judges vote separately on premises lets weird minority coalitions dictate the outcome even though no majority actually endorses that combination of views. I think that's crazy though — premise-based procedures seem way more defensible, since they force the court to actually reason through the doctrine instead of aggregating gut reactions to the ultimate question, and conclusion-based voting can produce a "majority" for liability where the judges don't even agree on why the defendant is liable.

  We went back and forth for like an hour and didn't resolve anything, so now I want someone to actually make the case properly. Please argue for the premise-based procedure as the right way to handle multi-issue collective decisions like this one, and deal with the standard objections — like the worry that premise-based procedures force judges to be "outvoted" into affirming a conclusion they personally reject, or that the whole approach just presupposes the majority-endorsed premises are the doctrinally relevant ones to aggregate over in the first place. I want an actual committed argument, not a "well it depends," because my roommate will just throw that right back at me.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Topic:** Judgment Aggregation Theory, specifically the "Doctrinal Paradox" (or Discursive Dilemma) in a legal context (3-judge panel, contract breach, damages, liability).
      *   **User's Position:** Pro-Premise-Based Procedure (PBP).
      *   **Roommate's Position:** Pro-Conclusion-Based Procedure (CBP).
      *   **Goal:** Provide a strong, committed argument *for* PBP, addressing standard objections (judges outvoted on conclusion, selection of premises).
      *   **Constraint:** No "well it depends" hedging. The user wants ammunition to win the argument.

  2.  **Deconstruct the Doctrinal Paradox:**
      *   *Scenario:*
          *   Judge 1: Breach (Yes), Damages (Yes) $\rightarrow$ Liable (Yes).
          *   Judge 2: Breach (Yes), Damages (No) $\rightarrow$ Liable (No).
          *   Judge 3: Breach (No), Damages (Yes) $\rightarrow$ Liable (No).
      *   *Premise-Based (PBP):* Majority on Breach (Yes), Majority on Damages (Yes) $\rightarrow$ Liable (Yes).
      *   *Conclusion-Based (CBP):* Majority on Liable (No) $\rightarrow$ Not Liable.
      *   *Conflict:* PBP yields Liability; CBP yields No Liability.

  3.  **Formulate the Core Argument for PBP:**
      *   Why do we have courts? To apply law to facts, not just to vote on outcomes.
      *   The law *is* the connection between premises and conclusion (Breach + Damages $\rightarrow$ Liability).
      *   CBP treats the law as opaque; PBP treats the law as transparent and binding.
      *   Legitimacy comes from reasoning, not just head-counting.
      *   Consistency and Precedent: PBP creates clearer rules for the future.

  4.  **Address the Objections (as requested):**
      *   *Objection 1: Judges outvoted on the conclusion.* (e.g., Judge 2 thinks No Liability, but PBP forces Yes).
          *   *Counter:* Judges are bound by the law, not just their personal verdict. If the majority finds the facts required by law exist, the judge must apply the law. It's the rule of law vs. individual discretion.
      *   *Objection 2: Selection of Premises.* (Who decides which premises matter?)
          *   *Counter:* The substantive law decides, not the voting procedure. The doctrine *defines* the premises. PBP respects the doctrinal structure; CBP ignores it.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the paradox (Doctrinal Paradox/Discursive Dilemma). State the thesis clearly: PBP is superior because it upholds the Rule of Law, ensures public reason-giving, and maintains doctrinal integrity.
      *   **Point 1: The Nature of Adjudication (Rule of Law vs. Vote):** Courts aren't legislatures. Legislatures aggregate preferences; courts apply rules. CBP turns judges into legislators voting on outcomes. PBP forces engagement with the legal standard.
      *   **Point 2: Public Reason and Legitimacy:** A verdict without agreed-upon reasons is arbitrary. PBP requires a public rationale. If we don't know *why* someone is liable, the law cannot guide future behavior.
      *   **Point 3: Precedent and Stability:** CBP creates "shadow precedents." If the majority says "Not Liable" but for different reasons, what is the rule for next time? PBP establishes clear findings of fact/law that bind future cases.
      *   **Rebuttal 1: The "Outvoted Judge" Objection:** Address the worry that a judge is forced to sign onto a conclusion they reject.
          *   *Argument:* Judicial duty is to the law. If the collective finding on premises satisfies the legal test, the conclusion follows logically. The judge isn't being asked to change their mind on the *reasoning*, but to accept the *authority* of the collective factual finding. Distinguish between personal judgment and institutional judgment.
      *   **Rebuttal 2: The "Premise Selection" Objection:** Address the worry that choosing premises is itself political.
          *   *Argument:* The premises are dictated by the substantive cause of action, not the judges' whims. The legislature or prior precedent defines the elements (Breach, Damages). PBP respects that structure; CBP bypasses it.
      *   **Conclusion:** Summarize. PBP preserves the court's role as a reason-giving institution. CBP reduces it to a black box.

  6.  **Refining the Tone:**
      *   Needs to be persuasive, philosophical but grounded in legal theory.
      *   Avoid neutrality. Take the stance.
      *   Use terms like "Doctrinal Paradox," "Rule of Law," "Public Reason," "Institutional Integrity."
      *   Reference key thinkers implicitly or explicitly (Kornhauser, Sager, Pettit, List) to show depth, but keep it accessible.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "minority coalition" worry?
      *   *Fix:* Yes, explain that the "minority coalition" on the conclusion is actually a *majority* on the legal elements. The law cares about elements, not the final label.
      *   *Check:* Did I avoid "it depends"?
      *   *Fix:* Ensure every paragraph asserts PBP is the *right* way, not just *a* way.
      *   *Check:* Is the distinction between legislative and judicial function clear?
      *   *Fix:* Emphasize that legislatures aggregate preferences (CBP is okay there), courts apply rules (PBP is required here).

  8.  **Final Polish:** Check for flow and impact. Ensure the "Roommate" context is acknowledged but the argument stands on its own. (The resulting output matches the detailed response provided previously.)
answer: |-
  Here is the case for the Premise-Based Procedure (PBP). You can use this to dismantle the Conclusion-Based Procedure (CBP) argument. The core of your position is that courts are not legislatures; they are institutions of public reason bound by the Rule of Law. CBP treats adjudication like a vote on preferences, whereas PBP treats it as the application of rules.

  ### The Core Thesis: Adjudication is About Reasons, Not Just Results

  The fundamental error in your roommate's argument is treating a court like a legislature. In a legislature, representatives aggregate preferences to determine policy outcomes. If a majority wants a bill passed, it passes. The *reasons* why they want it passed are secondary to the will of the majority.

  In a court, the "will of the majority" is irrelevant if it is not tethered to the law. The law is a system of rules that connects specific factual predicates (premises) to legal consequences (conclusions). In your example, the substantive law *defines* liability as "Breach AND Damages." It does not define liability as "Whatever a majority of judges feel is fair."

  Therefore, the Premise-Based Procedure is the only method that respects the **Rule of Law**. PBP forces the court to determine what the law requires (the premises) and then accepts the logical consequence. CBP allows the court to bypass the legal test entirely in favor of a gut check on the outcome. If you use CBP, you are effectively allowing judges to vote on whether they *like* the outcome, rather than whether the law *mandates* it.

  ### Argument 1: Integrity of the Doctrine (The "Law is Transparent" Argument)

  The primary function of a judicial opinion is not just to resolve a dispute between two parties, but to articulate the law for the future. This is the doctrine of *stare decisis*.

  If you use CBP in the scenario you described:
  *   **Outcome:** Not Liable.
  *   **Reasoning:** There is no single majority reasoning. Judge 1 says Breach+Damages. Judge 2 says Breach+No Damages. Judge 3 says No Breach+Damages.

  This creates a "shadow precedent." What is the rule for the next case? Can a plaintiff win if they prove Breach but not Damages? The CBP outcome tells us nothing. It creates legal uncertainty because the majority coalition on the conclusion (Judges 2 & 3) disagrees on *why* the defendant is off the hook.

  If you use PBP:
  *   **Outcome:** Liable.
  *   **Reasoning:** The court has collectively found that Breach exists (2-1) and Damages exist (2-1).

  This creates a clear public record. Future litigants know that if they prove Breach and Damages, they win. PBP prioritizes the **publicity and stability of the law** over the specific preferences of the judges in the instant case. A legal system that cannot articulate *why* it decided a case is a system of men, not laws.

  ### Argument 2: Addressing the "Outvoted Judge" Objection

  Your roommate's strongest point is likely this: *Under PBP, Judge 2 believes the defendant is NOT liable (because there were no damages), yet the court rules they ARE liable. Isn't it undemocratic or incoherent to force a judge to sign onto a conclusion they personally reject?*

  Here is the counter: **Judges are not sovereigns; they are agents of the law.**

  When a judge sits on a panel, they are not there to impose their personal verdict; they are there to participate in an institutional finding of fact and law. When the majority finds as a fact that "Damages occurred," that becomes the *court's* finding, not just the finding of Judges 1 and 3.

  Judge 2 is not being asked to lie and say, "I personally think damages occurred." Judge 2 is asked to accept the institutional reality: "The Court has found that damages occurred." Since the law states that Breach + Damages = Liability, and the Court has found Breach and Damages, the conclusion of Liability follows logically.

  To allow Judge 2 to veto the conclusion based on their personal assessment of the premises is to grant individual judges a veto power over the majority's factual findings. It privileges the individual's holistic intuition over the collective application of the legal rule. In a multi-member court, the "majority view" on the *elements of the law* must trump the "minority view" on the *ultimate disposition*, because the elements are what the legislature (or higher court) mandated.

  ### Argument 3: Addressing the "Premise Selection" Objection

  The second standard objection is: *Who decides which premises we vote on? Isn't choosing the premises just as political as voting on the conclusion? Maybe the majority would have voted differently if the premises were framed another way.*

  This objection confuses **procedure** with **substantive law**.

  The premises are not chosen by the judges arbitrarily; they are dictated by the cause of action. In a contract case, the legislature or common law has already decided that the relevant premises are "Breach" and "Causation/Damages." The judges do not get to decide that "Fairness" or "Economic Efficiency" is a premise instead.

  *   **CBP** implicitly allows judges to ignore the statutory elements. It allows a judge to vote "Not Liable" even if they admit all statutory elements are met, simply because they dislike the result.
  *   **PBP** forces the judges to stick to the doctrinal structure provided by the substantive law.

  If the objection is that the *law itself* is flawed (i.e., "Liability shouldn't require both Breach and Damages"), that is an argument for changing the substantive law, not for changing the voting procedure to circumvent the law. PBP exposes when the legal doctrine produces results that feel counter-intuitive to the judges, which might prompt legitimate legal reform. CBP hides this tension by allowing judges to fudge the outcome without fixing the rule.

  ### The Knockout Punch: The "Minority Coalition" Fallacy

  Your roommate argued that PBP lets a "weird minority coalition" dictate the outcome because no majority endorses the combination of views. This is mathematically true but legally irrelevant.

  In the example:
  *   Judge 1: Yes, Yes $\rightarrow$ Liable
  *   Judge 2: Yes, No $\rightarrow$ Not Liable
  *   Judge 3: No, Yes $\rightarrow$ Not Liable

  Your roommate says only 1 out of 3 judges supports "Liable." But look at the legal requirements.
  *   **Requirement 1 (Breach):** Supported by Judges 1 & 2 (Majority).
  *   **Requirement 2 (Damages):** Supported by Judges 1 & 3 (Majority).

  The "coalition" for Liability is not the set of judges who *want* the defendant to lose; it is the set of legal findings that satisfy the statutory test. The law does not require a majority of judges to *want* the defendant to lose; it requires a majority of judges to find that the *conditions for loss* are met.

  By focusing on the bottom-line conclusion, CBP treats the legal test as a black box. It assumes the "Not Liable" vote of Judge 2 and Judge 3 are equivalent. They are not. Judge 2 says "No remedy because no harm." Judge 3 says "No remedy because no wrong." If you aggregate those into a single "Not Liable" precedent, you have destroyed the distinction between "no breach" and "no damages." That destroys the granularity of the law.

  ### Summary for your Roommate

  Tell them this:
  1.  **Courts apply rules; Legislatures aggregate preferences.** CBP turns judges into legislators. PBP keeps them judges.
  2.  **Precedent requires reasons.** CBP produces outcomes without a coherent majority rationale, making the law unpredictable for everyone else. PBP produces a clear rule.
  3.  **Judicial Duty.** A judge's duty is to accept the court's collective finding on the elements. If the court finds the elements met, the judge must accept the conclusion, even if they would have weighed the evidence differently alone.
  4.  **Substantive Law Controls.** The premises aren't chosen by the voting procedure; they are chosen by the statute. PBP respects the statute; CBP circumvents it.

  The Doctrinal Paradox isn't a bug in PBP; it's a feature of complex legal reasoning. It reveals that a majority of judges can agree on the *law* and the *facts* without agreeing on the *result*. The job of the court is to uphold the law and the facts, not to compromise on the result. PBP is the only procedure that honors that distinction.
