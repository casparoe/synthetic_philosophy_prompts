      *   *Actually, the "Presumptuous Philosopher" objection:* SIA leads to weird results (it says you should believe the universe is infinite just because you exist). I should mention this briefly as context for why SIA isn't a magic bullet.
      *   *Gott's Priors:* Gott is often criticized for assuming a flat prior on time ($1/t$). Carter uses explicit priors on $N$. This is a key mechanical difference.

  7.  **Final Polish:** Ensure the distinction between SSA (Sampling from existing) and SIA (Sampling from possible/weighting by existence) is clear. This is the crux of the second question.

      *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the "Reference Class Problem" too much, but it's essential for Carter. For a dev, "Reference Class" = "Query Scope." If I query `SELECT * FROM humans`, do I include cyborgs? Aliens? This matters for Carter, less for Gott.

