prompt: |-
  I'm a backend dev, not a philosophy person, but I fell down a wikipedia rabbit hole on the "doomsday argument" last night and now i'm stuck on something. seems like there's actually two pretty different arguments that both go by that name? theres gott's "copernican"/delta-t version, where he just uses how long somethings already been around to guess how much longer its got left (i think he used the berlin wall and some broadway shows as examples), and then theres the carter/leslie version, which is about your birth rank out of everyone who will ever live, done as a proper bayesian update using the self-sampling assumption. are these actually the same underlying move just dressed up differently, or are they logically separate arguments that just happen to land in the same neighborhood? also, i saw somewhere that the "self-indication assumption" is supposed to cancel out the doomsday shift - does that objection actually hit both versions equally, or does it only really work against one of them, and if so which one? i don't have any philosophy background so don't just hand me the wikipedia summary, i want the actual mechanics of why these do or don't amount to the same argument.
