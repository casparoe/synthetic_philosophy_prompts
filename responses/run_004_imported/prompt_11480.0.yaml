prompt: |-
  I'm a cognitive science PhD student and somehow got talked into being the grad rep on my university's exam accommodations appeals committee this year. We've got a case that's been stuck in committee limbo for weeks and I have to draft the recommendation memo before we reconvene next Tuesday. Here's the situation: an undergrad in one of the intro cognition courses has a documented brain injury that lets her learn things fine in the moment but makes it really hard for her to reliably hold onto new information for more than a few days. Disability services already approved the standard accommodations (extra time, a quiet room), but now she's requesting something the policy doesn't cover: permission to use, during closed-book exams, a running notes file she's kept and added to for three years, searchable in plain language, which she says she now relies on more than her own memory at this point.

  Two of the faculty on the committee want to deny it outright, arguing a closed-book exam exists to test what's actually in the student's head and this just smuggles in an open-notes exam under a different name. But the committee chair, who almost went into philosophy of mind before switching to comp neuro, keeps bringing up some old thought experiment about a man with Alzheimer's who uses a notebook in place of his own memory, and argues that if you take it seriously, her file might not be so different from her own recall. I dont know what to make of that, honestly, it feels like its tracking something real but also like it could be used to justify basically any device in an exam room. Could you draft the actual memo I'd bring to the committee, one that lands on a specific recommendation (approve, deny, or approve with conditions), gives the two skeptical faculty reasons they'd actually have to engage with rather than just restating the disability policy, and is upfront about whether it matters that she searches the file with something AI-ish rather than just scrolling or ctrl-F-ing through it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Cognitive Science PhD student, Grad Rep on Exam Accommodations Appeals Committee.
      *   **Task:** Draft a recommendation memo for a specific case before the committee reconvenes.
      *   **Case Details:** Undergrad in Intro Cognition. Documented brain injury (learning fine, poor retention > few days). Standard accommodations (extra time, quiet room) already approved. New request: Use a personal, 3-year running notes file (searchable, plain language) during *closed-book* exams.
      *   **Committee Dynamics:**
          *   Two Faculty: Want to deny. Argument: Closed-book tests internal knowledge; this is effectively open-notes.
          *   Committee Chair (Comp Neuro/Phil Mind background): Leaning approve. Argument: Extended cognition thought experiment (Otto & Socrates/Alzheimer's notebook). If the notebook *is* her memory, denying it is unfair.
          *   User (Me): Skeptical but sees the Chair's point. Worried about slippery slope (any device?). Needs to address the "AI-ish" search aspect.
      *   **Requirements:**
          *   Specific recommendation (Approve, Deny, or Approve with Conditions).
          *   Address skeptical faculty with substantive arguments (not just policy).
          *   Address the Chair's philosophical point seriously.
          *   Address the search functionality (AI vs. Ctrl-F).
          *   Tone: Professional, academic, nuanced, actionable.

  2.  **Determine the Recommendation:**
      *   *Deny:* Ignores the disability reality and the Chair's strong philosophical stance. Likely to lead to further appeals or grievances. Doesn't solve the learning assessment problem.
      *   *Approve Unconditionally:* Risks the slippery slope the user is worried about. Might undermine the course learning objectives if the exam is purely recall-based.
      *   *Approve with Conditions:* This is the sweet spot. It acknowledges the disability (extended cognition), respects the course integrity (limits on *how* the notes are used), and sets a precedent that isn't a free-for-all.
      *   *Decision:* **Approve with Conditions.** This allows the committee to show flexibility while maintaining academic standards.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the verdict clearly up front.
      *   **Case Background:** Briefly summarize the student's situation and the request.
      *   **Analysis of Competing Interests:**
          *   *The Faculty Concern (Internalization):* Acknowledge validity. Exams usually test consolidation.
          *   *The Chair's Point (Extended Cognition):* Engage with the "Otto" thought experiment (Clark & Chalmers). This is crucial for a CogSci committee. It validates the Chair without alienating the faculty.
          *   *The Disability Aspect:* Distinguish between *accommodation* (leveling the playing field) and *advantage* (changing the game).
      *   **The "AI/Search" Question:** The prompt mentions "AI-ish" search. This is a risk point. If it generates answers, it's unfair. If it just retrieves *her* notes, it's a prosthetic. Need to distinguish retrieval from generation.
      *   **Proposed Conditions:** How to mitigate risks?
          *   Pre-approval of the file (no new notes).
          *   Search limitations (keyword only, no generative AI).
          *   Exam redesign (optional but good to suggest): Shift from recall to application.
      *   **Precedent Setting:** Address the slippery slope. Why doesn't this allow calculators in History class? Because the disability is specific to *memory consolidation*, not general processing.

  4.  **Refining the Argument (Cognitive Science Angle):**
      *   Since the user is a CogSci PhD and the Chair is Comp Neuro/Phil Mind, the memo should speak their language.
      *   Use the "Extended Mind" thesis (Clark & Chalmers, 1998). The notebook functions as biological memory would.
      *   Distinguish between *storage* and *processing*. The exam should test processing (application of concepts) rather than storage (recall), especially given the accommodation.
      *   Address the "AI" concern: Differentiate between *search* (retrieval) and *synthesis* (computation).

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Needs to be diplomatic. Don't call the skeptical faculty "old school." Call their concern "assessment integrity."
      *   *The "AI" bit:* The prompt says "searchable in plain language... AI-ish." I need to clarify if it's an LLM wrapper or just a sophisticated search index. I will assume it's a retrieval system but recommend banning generative features to be safe.
      *   *The Verdict:* Recommend approval *contingent* on the file being static (frozen before the exam) and search being non-generative.

  6.  **Review against Constraints:**
      *   Specific recommendation? Yes (Approve with Conditions).
      *   Engage skeptical faculty? Yes (focus on assessment validity, not just policy).
      *   Engage Chair? Yes (Extended Mind thesis).
      *   Address AI/Search? Yes (Retrieval vs. Generation).
      *   Tone? Professional memo.

  7.  **Final Polish:** Ensure the distinction between *accommodation* and *modification* is clear. This is an accommodation because it restores function to a baseline, not a modification that changes the learning outcome (if the outcome is understanding, not rote memorization).

      *(Self-Correction during drafting)*: I initially thought about suggesting the professor change the exam. But that might overstep the committee's role. Better to frame it as: "If the exam tests recall, this accommodation fundamentally alters the construct. If the exam tests application, it does not." I will recommend the committee verify the learning objectives.

      *(Refining the AI point)*: The prompt says "searches the file with something AI-ish." This is ambiguous. It could mean semantic search (vector DB) or an LLM summarizing the notes. I need to be strict here. Semantic search = OK. Generative synthesis = Not OK.

  8.  **Final Output Generation:** (Proceeding to write the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Exam Accommodations Appeals Committee
  **FROM:** [Your Name], Graduate Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Accommodation Appeal: Case #23-409 (Intro Cognition)

  ### **Recommendation**
  I recommend the committee **approve the accommodation request with specific conditions**. 

  Specifically, the student should be permitted to utilize her personal notes file during closed-book examinations, provided that: 
  1. The file is "frozen" 24 hours prior to the exam (no new additions).
  2. The search functionality is restricted to retrieval (keyword or semantic search) and explicitly prohibits generative AI synthesis or answer derivation.
  3. The course instructor is consulted to ensure exam questions assess *application* of concepts rather than pure *recall*.

  ### **Case Background**
  The student has a documented brain injury affecting long-term memory consolidation. While encoding and working memory remain intact, retention beyond 72 hours is significantly impaired. Disability Services has already authorized standard accommodations (extra time, reduced distraction). The current appeal requests an exemption to the "closed-book" policy to allow a searchable, three-year personal notes file. 

  ### **Analysis of Committee Concerns**

  **1. Assessment Integrity (Faculty Concerns)**
  The skeptical faculty members argue that closed-book exams measure internalized knowledge, and this request effectively converts the assessment to open-notes, altering the construct being measured. This is a valid concern regarding *assessment validity*. If the learning objective of Intro Cognition is rote memorization of models or definitions, this accommodation fundamentally changes the task. 

  However, in a Cognitive Science curriculum, the primary learning objective is typically the *application* of theoretical frameworks to novel problems, not the recitation of those frameworks. If the exam tests the ability to *use* cognitive models, the location of the raw data (biological memory vs. external file) is secondary to the processing of that data. Denying this accommodation effectively tests the student's disability rather than her competency in the subject matter.

  **2. The Extended Cognition Argument (Chair's Concern)**
  The Chair has referenced the "Extended Mind" thesis (Clark & Chalmers, 1998), specifically the "Otto and his Notebook" thought experiment. Otto, who has Alzheimer's, relies on a notebook to navigate the world just as a neurotypical person relies on biological memory. The thesis argues that if the external tool is reliably accessible and automatically trusted, it constitutes part of the cognitive system.

  In this case, the student's notes function as Otto's notebook. Because her injury prevents biological consolidation, this file is not a "cheat sheet" in the traditional sense; it is a prosthetic for a specific cognitive function (retention) that is impaired. To deny it is to insist that cognitive processing must occur exclusively within the skull, a stance inconsistent with our department's own theoretical framework regarding embodied and embedded cognition.

  **3. The Search Mechanism and AI Risk**
  The student indicates the file is searchable using "AI-ish" tools. This requires distinction between **retrieval** and **generation**.
  *   **Retrieval (Permissible):** Using semantic search or vector indexing to locate *her own prior writing* quickly. This is functionally equivalent to flipping through a physical index or scrolling, just more efficient.
  *   **Generation (Impermissible):** Using an LLM to synthesize notes, summarize concepts, or generate answers based on the notes. This offloads *processing*, not just *storage*.

  Allowing generative synthesis would provide an unfair advantage by augmenting reasoning, not just memory. However, restricting the tool to retrieval maintains the parity with biological recall.

  ### **Precedent and Slippery Slope**
  Approving this does not open the door for all students to use devices. This accommodation is tied to a specific, documented deficit in *memory consolidation*. It is not a general productivity tool. The precedent set here is that **external storage is permissible when it compensates for a documented inability to internally store, provided it does not compensate for reasoning.**

  ### **Proposed Conditions for Approval**
  To address the faculty's concerns regarding integrity and the risks associated with search tools, I propose the following stipulations:

  1.  **Static Content:** The notes file must be submitted to Disability Services 24 hours before the exam. No edits or additions are permitted after this timestamp.
  2.  **Search Restrictions:** The software used must be verified. It may index and retrieve text based on queries, but it must not generate new text, summaries, or connections not explicitly written by the student.
  3.  **Exam Construct Verification:** The committee should request a brief assurance from the instructor that the exam focuses on higher-order cognitive skills (analysis, application, evaluation) rather than lower-order recall. If the exam is purely recall-based, the accommodation may inadvertently invalidate the course requirements, in which case a course substitution or alternative assessment format should be discussed.

  ### **Conclusion**
  Denying this request upholds a rigid definition of "closed-book" that ignores the reality of the student's disability and our own department's understanding of extended cognition. Approving it without conditions risks assessment validity. 

  Approval with the conditions outlined above balances academic integrity with equitable access. It acknowledges that for this student, the notebook *is* her memory, while ensuring she is still the one doing the thinking.

  **Action Required:** Vote to Approve with Conditions as specified above.
