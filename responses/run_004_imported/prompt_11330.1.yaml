prompt: |-
  So I've been the Dungeon Master for my friend group's D&D campaign for almost two years now and I'm pretty burnt out, but every time I bring up stepping back, at least one person acts like I'm abandoning ship. Here's what's bugging me: I never actually agreed to be "the DM" in any real sense. It started as a one-shot I offered to run because we were bored one weekend, then people just started asking "so when's the next session," and saying yes each time felt easier than explaining why not, and eventually there was a whole campaign with character backstories and a group chat named after my villain. When I said last week that I wanted to take an indefinite break, one friend said, almost word for word, "you can't just quit on us, we're in this together," like I'd broken some promise, even though I can't point to a single moment where I actually promised anything.

  My partner, who's never even met these people, just said "well, did you say yes to being the DM or not, its really not that complicated," but that doesn't feel right either - it kind of feels like something real got built here even without anyone ever formally agreeing to it, and now I don't know if that "something" is a real obligation or just my friends being dramatic. Am I actually on the hook for this campaign in some way, even though there was no single moment I signed up for it, and if I am, what would actually be the fair way to step back rather than just ghosting the group chat?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Role:** Dungeon Master (DM) for a D&D group (friends).
      *   **Duration:** Almost two years.
      *   **Problem:** Burnout. Wants to step back/quit.
      *   **Conflict:** Friends react negatively ("abandoning ship," "can't just quit," "we're in this together"). Partner simplifies it ("did you say yes or no?"), but user feels there's a nuanced social obligation despite no formal agreement.
      *   **Origin:** Started as a one-shot, evolved into a campaign via drift (saying "yes" repeatedly because it was easier than saying "no").
      *   **Goal:** Determine if there's a real obligation and find a fair way to step back without ghosting.

  2.  **Deconstruct the "Obligation":**
      *   *Legal/Contractual:* None. It's a hobby.
      *   *Social/Moral:* This is where the friction lies.
      *   *The "Drift":* The user didn't sign a contract, but they did invest time, emotional energy, and creative effort over two years. This created *expectations*.
      *   *The Friends' Perspective:* They invested time, character creation, emotional attachment to the story, and reliance on the user for their weekly/monthly social outlet. To them, the user *is* the campaign.
      *   *The User's Perspective:* They feel trapped by a role they never explicitly accepted long-term. They feel guilty but also resentful of the guilt-tripping.
      *   *Verdict:* There is no *binding* obligation, but there is a *relational* responsibility. You don't owe them the game forever, but you owe them respect for the time invested together.

  3.  **Address the Partner's Comment:**
      *   The partner is technically right (no verbal contract), but socially tone-deaf. Long-term social commitments often form through habit and repeated consent, not a single signed document. Acknowledging this validates the user's feeling that "something real got built."

  4.  **Determine the "Fair Way" to Step Back:**
      *   *Ghosting:* Definitely not. That burns bridges.
      *   *Cold Turkey:* Hard on the group, but sometimes necessary for health.
      *   *Transition:* The ideal path.
      *   *Key Steps:*
          1.  Firm Boundary Setting (It's not a negotiation).
          2.  Acknowledgment of their feelings (Validate without accepting guilt).
          3.  Offering Solutions (New DM, pause, end story).
          4.  Self-Care Priority (Burnout is real).

  5.  **Drafting the Advice (Iterative Process):**

      *   *Validation:* Start by validating the burnout. DMing is hard work. Two years is a long time.
      *   *The "Obligation" Question:* Address the core philosophical question. Is there an obligation? No, not to *continue*, but yes, to *conclude responsibly*. Distinguish between "owing the game" and "owing the friends."
      *   *The "Drift" Dynamic:* Explain *why* this happened (path of least resistance) so the user understands how they got here without blaming themselves too harshly.
      *   *Action Plan:*
          *   **The Conversation:** Needs to be direct, not apologetic. "I can't" vs. "I won't."
          *   **The Options:**
              *   *Handover:* Is there another DM?
              *   *The "Season Finale":* Wrap up the current arc.
              *   *The Hard Stop:* Sometimes you just have to stop.
          *   **Managing the Guilt:** The friends' reaction ("abandoning ship") is manipulative (even if unintentional). The user needs to recognize this as a reaction to *their* disappointment, not an objective truth about the user's morality.
      *   *The Partner's Take:* Gently correct the partner's binary view. Social contracts are implicit.

  6.  **Refining the Tone:**
      *   Empathetic but firm.
      *   Non-judgmental towards the friends (they are disappointed), but protective of the user.
      *   Practical D&D specific advice (session zero, modules, etc.).

  7.  **Key Insight to Highlight:**
      *   The friends are grieving the loss of the game, but they are framing it as a betrayal. The user needs to separate those two things.
      *   A burnt-out DM makes for a bad game anyway. Continuing helps no one.

  8.  **Final Review against User Query:**
      *   *Am I on the hook?* Answered (No, but with caveats).
      *   *Fair way to step back?* Answered (Transition plan).
      *   *Addressed the "no formal agreement" vs. "something real built" conflict?* Yes, by defining implicit social contracts.

  9.  **Constructing the Output:** (This aligns with the structure of the provided good response.)
      *   Introduction: Validate burnout.
      *   The Obligation Question: Nuanced "No."
      *   Why it feels like "Yes": Implicit contracts.
      *   The Exit Strategy: Concrete steps.
      *   Handling the Pushback: Scripts/Boundaries.
      *   Conclusion: Permission to stop.

  10. *(Self-Correction during drafting)*: Make sure I don't suggest they *must* find a replacement. That adds more labor to the burnt-out DM. The option should be there, but the responsibility shouldn't fall solely on them. Emphasize that the *group* shares responsibility for the game's existence.

  11. *(Final Polish)*: Ensure the distinction between "quitting on friends" and "quitting a role" is clear.

  *(Proceed to generate response based on these thoughts.)*
answer: |-
  First, take a deep breath. What you are experiencing is incredibly common in the TTRPG community, often called "DM Burnout," but the social entrapment you're feeling is a specific and difficult variant of it.

  To answer your core question directly: **No, you are not "on the hook" for this campaign.** You do not owe anyone a hobby, especially one that requires significant creative labor and emotional energy. However, your partner's binary view ("you said yes or no") misses the nuance of how long-term social groups function, and your friends' reaction ("you're abandoning us") conflates disappointment with betrayal.

  Here is a breakdown of the social obligation you feel, why it's happening, and a concrete plan to step back fairly without burning bridges.

  ### 1. The Nature of the Obligation
  You are struggling with the difference between a **contractual obligation** and a **relational expectation.**

  *   **Contractually:** You are right. There was no signed agreement, no "Session Zero" where you agreed to run a two-year campaign. You agreed to a one-shot, and then you agreed to subsequent sessions individually.
  *   **Relationally:** Your friends are not entirely wrong that "something real got built." Over two years, a pattern was established. You provided a service (entertainment, facilitation, storytelling), and they provided participation and trust. By continuing to say "yes" for two years, you created a *reasonable expectation* that you would continue.

  **The Verdict:** You do not owe them *more campaign*. However, because you helped build this expectation, you owe them a **respectful transition.** You owe them closure, not indefinite servitude.

  The guilt you feel is not because you are doing something wrong; it is because you are breaking a pattern that brought them joy. Their reaction ("you can't quit on us") is a defense mechanism. They are panicking because their social outlet is threatened, and they are projecting that panic onto you as moral failure.

  ### 2. Why "Just Stopping" Feels Impossible
  You got into this trap through the "Path of Least Resistance." It is often harder in the moment to say "I don't have the energy" than to say "Sure, next week works." Over 100 sessions, those small "yeses" compound into a mountain.

  Your friends view the campaign as a collective entity ("we're in this together"). The hard truth they need to hear is that **the DM is not a module.** The game cannot exist without the labor you are providing. If you stop providing that labor, the game stops. That isn't you "quitting on them"; that is the structural reality of TTRPGs.

  ### 3. The Fair Exit Strategy
  Ghosting is unfair. Continuing while resentful is unfair to *you* and results in a bad game for *them*. The middle path is a **Managed Exit.**

  Here is a step-by-step plan to step back fairly:

  **Step 1: The Firm Announcement (No Negotiation)**
  Do not frame this as a question ("Can I take a break?"). Frame it as a statement of capacity.
  *   *Script:* "I love this group and I'm proud of what we've built, but I am burnt out. I no longer have the creative energy to DM. I am stepping down from the role effectively immediately. This isn't a negotiation about when I can return, because I don't know if I will."
  *   *Why:* If you leave the door open ("indefinite break"), they will wait for you. You need to close the door so they can move on.

  **Step 2: Offer Options, Not Solutions**
  You are not responsible for saving the campaign, but you can offer paths forward. Put the labor back on the group.
  *   *Option A (New DM):* "I am willing to help hand over my notes to someone else who wants to try running."
  *   *Option B (Co-DM):* "I could run once a month if someone else runs the other weeks." (Only offer this if you actually want this).
  *   *Option C (The Finale):* "I can run one final session to wrap up the current arc, and then I am done."
  *   *Option D (Death of the Campaign):* "If no one else wants to DM, this story ends here. We can play other games or just hang out."

  **Step 3: Hold the Boundary**
  When they say, "You're abandoning us," validate their feelings without accepting the blame.
  *   *Script:* "I hear that you're disappointed and feel abandoned. That isn't my intention. My intention is to be a good friend to you, and I can't do that if I'm resenting the game. I care about you guys more than I care about the campaign."

  ### 4. Dealing with the Guilt
  Your partner said, "It's not that complicated." In a vacuum, they are right. But in a friendship, it is complicated because you care about these people.

  However, consider this: **A burnt-out DM is a bad DM.** If you force yourself to continue, the quality of the game will drop. You will become irritable, the prep will suffer, and you will eventually snap. By stepping down now, you are actually preserving the good memories of the last two years.

  If one friend continues to guilt-trip you after you have offered a respectful transition, that is a red flag about the friendship, not the game. A friend who values *you* more than the *entertainment you provide* will accept your limits.

  ### Summary
  You are not on the hook. You built a house for everyone to live in for two years, but you never agreed to be the landlord forever. It is fair to move out, provided you give notice and leave the keys under the mat.

  1.  Tell them you are done DMing (not "taking a break").
  2.  Offer to share your notes if someone else wants to take over.
  3.  Accept that they will be disappointed, but do not accept that you are wrong.
  4.  Prioritize your mental health. If the friendship ends because you stopped running a game for free, it wasn't a friendship that could sustain you anyway.

  You have given them two years of your life. That is a gift, not a debt. You are allowed to stop giving.
