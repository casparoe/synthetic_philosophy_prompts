answer: |-
  **The Glue That Doesn't Stick: Why Bradley's Regress Demands the Abandonment of Constituent Ontology**

  The stalemate you and your friend reached on that train ride is a classic one in metaphysics, but it is a stalemate born of a shared false premise. You argued for the Fregean-Russellian view that relations are "unsaturated" and thus require no further connector; your friend argued for the Bergmannian view that the unifier is a primitive "nexus" or that the fact itself is a brute unity. You suspected her view was a mystery-monger's retreat; she suspected your view was a linguistic shell game.

  Here is the adjudication you requested: **Your friend was right to be skeptical of the "unsaturatedness" explanation, but both of you are wrong to think that any ontological constituent—whether a relation, a nexus, or a brute tie—can perform the work of unification.** The honest conclusion is that the strategy of seeking a unifier *within* the fact fails completely. Bradley's Regress is vicious, not benign, and it demonstrates that the constituent picture of facts (the idea that a fact like *aRb* is built out of separately existing constituents *a*, *b*, and *R*) is ontologically false. The only coherent solution is to abandon constituent ontology in favor of **Fact Primitivism**: the view that states of affairs are the fundamental units of reality, and their apparent "constituents" are merely abstractions, not pre-existing parts.

  To see why no proposed unifier works, we must look closely at the structure of the regress. Bradley's argument turns on the distinction between a relation *relating* and a relation *being*. If *R* is a constituent of the fact *aRb*, it is an entity. If it is an entity, it is distinct from *a* and *b*. If it is distinct, what connects it to them? If you posit a further relation *R1* to connect *R* to *a*, you have not solved the problem; you have merely added two more items (*R* and *R1*) that now need connecting. This generates an infinite chain.

  Your defense relied on the claim that *R* is "unsaturated." You argued that this inherent incompleteness allows *R* to latch onto *a* and *b* without a further tie. However, your friend's "shell game" objection is devastating here. To say *R* is unsaturated is to ascribe a property to *R*. But if *R* exists as a constituent, and "unsaturatedness" is a feature of *R*, we are back to the original problem: how does the property of unsaturatedness connect to *R*? And how does *R*, in virtue of having this property, connect to *a*? If "unsaturatedness" is not a property but a logical type (as Frege suggested), it explains why we cannot *speak* of the concept without an object, but it does not explain the *metaphysical* mechanism of unity. It asserts that the relation *does* relate, but it offers no account of *how* it does so other than by stipulation. It is a verbal stopper, not an ontological engine. As your friend noted, calling the mystery "unsaturatedness" rather than "nexus" changes the label, not the logic.

  Your friend's fallback position—that facts are brute, non-mereological unities—is more honest but equally untenable within the framework you are both accepting. By calling the fact a "unity" of constituents, she retains the idea that *a*, *b*, and *R* are ontological ingredients that are somehow "glued." If the glue is brute, it is inexplicable. But if it is inexplicable, we have no reason to believe it exists rather than a mere list of items. A brute unity of separate items is a contradiction in terms: if they are separate, they are not unified; if they are unified, their separateness is derivative. Her view attempts to stop the regress by fiat, declaring the first link "special." But without an explanation of *why* it is special (other than "it just is"), the regress looms just as threateningly. It is an admission of defeat disguised as a foundational axiom.

  Could the regress be benign? Some philosophers (like Russell in his later period) have suggested that an infinite chain of relations is not problematic, provided the first relation actually relates. This is incorrect. A benign regress is one where each step is explained by the previous one (like a truth regress: "It is true that P" implies "It is true that it is true that P"). Bradley's regress is vicious because it is a regress of *explanation* for a single state of affairs. If the unity of *aRb* depends on *R1*, and *R1* depends on *R2*, ad infinitum, then the unity is never actually achieved. It is perpetually deferred. To say the fact exists is to say the unity is *already* present. If the presence of that unity requires an infinite chain of further unifiers, the unity is never present. Therefore, the regress is fatal to the project of explaining facts via constituents.

  If both the "unsaturated" relation and the "brute" nexus fail, and the regress is vicious, we are left with a stark choice: either there are no relational facts, or our analysis of them is wrong. Since relational facts obviously obtain (you and your friend did argue, after all), the analysis must be wrong.

  The verdict, therefore, is that we must give up the idea that a fact like *aRb* is built out of separately existing constituents. This is the doctrine of **Fact Primitivism** (or ontological holism). On this view, the state of affairs *aRb* is the fundamental ontological unit. It is not constructed from *a*, *b*, and *R*; rather, *a*, *b*, and *R* are abstractions we derive by analyzing the fact. They do not exist *prior* to the fact in a way that requires gluing. There is no "moment" in ontology where *a* and *b* exist separately and then get joined by *R*. They are only intelligible as poles of the relation within the fact.

  This dissolves Bradley's Regress entirely. The regress arises only if we assume the relata and the relation are independent entities that need bridging. If the fact is fundamental, there is no gap to bridge. The "unity" is not a feature added to the parts; it is the condition of the parts' existence. This avoids the shell game because it does not posit a special unifier (unsaturated or otherwise); it denies the need for a unifier by denying the separability of the items to be unified.

  In your dispute, you were trying to solve a problem that cannot be solved within the rules you were playing by. You sought a special kind of constituent (unsaturated) that acts like a non-constituent. Your friend sought to make the connection primitive. Both approaches accept the premise that the fact is a composite of independent items. That premise is the error.

  So, take this back to your seminar: The metaphysics of relations cannot be saved by tinkering with the nature of the relation or the tie. The regress proves that **unity is not an ontological component.** It is a category mistake to ask what holds a fact together, because facts are not things that are held together; they are the ground upon which the distinction between "thing" and "holding" rests. The regress is vicious, the constituent picture is false, and the only viable ontology is one where the fact is prior to its constituents. You both lost the argument, but only because the question you were asking was the wrong one.
