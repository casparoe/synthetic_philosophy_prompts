answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Two whiteboards stand side-by-side. One is covered in stochastic differential equations (Kelly's side), the other in decision trees and ensemble integrals (EV's side). A coin sits on the table between them.*

  **Characters:**
  *   **KELLY:** A proponent of time-average growth and ergodicity economics.
  *   **EV:** A proponent of standard expected utility theory and ensemble averages.

  ***

  **EV:** (Spinning the coin) Sixty percent heads, you win even money. Forty percent tails, you lose the stake. I've just placed my bet. All in.

  **KELLY:** (Sighs, marking 20% on a ledger) And I've placed mine. The Kelly fraction. Again.

  **EV:** You're leaving money on the table. Literally. My expected wealth after this round is 1.2 times my bankroll. Yours is… what? 1.02?

  **KELLY:** My *arithmetic* expectation is lower, yes. But my *geometric* growth rate is positive. Yours is negative. If we play this a thousand times, I will be exponentially wealthier than you. You will be at zero.

  **EV:** "Will be" is doing a lot of heavy lifting there. In the ensemble of all possible outcomes, my expected value is higher. Yes, in 99.9% of the paths I go broke. But in the 0.1% where I win every time, my wealth is so astronomical that it pulls the average up. The math doesn't lie: maximizing arithmetic expectation maximizes the mean wealth of the ensemble.

  **KELLY:** But you aren't an ensemble. You're a single trajectory through time. You don't get to average yourself across a million parallel universes. You live in this one. In this one, the law of large numbers acts on the *product* of returns, not the sum. The geometric mean dominates the time average. If you bet everything, the probability of ruin approaches one as $n \to \infty$. Is it rational to choose a strategy that guarantees ruin in the limit, just because the ghost of your counterpart in a distant branch of the probability space is rich?

  **EV:** That's the "long run" defense. It's seductive, but it dodges the normative question. Rationality is about maximizing preference satisfaction given uncertainty. If my utility function is linear in wealth—if I am risk-neutral—then maximizing expected value *is* the rational choice. You're smuggling in a logarithmic utility function and calling it "physics." You're saying I *must* be risk-averse. I say risk aversion is a preference, not a law of nature.

  **KELLY:** It's not a preference when the dynamics are multiplicative. That's the point Ole Peters and others have hammered home. In additive dynamics, like a salary, the ensemble average equals the time average. It's ergodic. But in betting, wealth compounds. The system is non-ergodic. The ensemble average diverges from the time average. When you bet 100%, you are treating a non-ergodic process as if it were ergodic. You're calculating the average wealth of *people*, not the wealth of *one person over time*. Rationality requires aligning your decision metric with the physical structure of the process.

  **EV:** Aligning with the physical structure is fine for describing what *happens*. It doesn't tell me what I *ought* to do. Let's sharpen this. Suppose this isn't a repeated game. Suppose the casino offers me this bet exactly once in my life. No reinvestment. No tomorrow. Do you still bet Kelly?

  **KELLY:** (Pauses) If it is truly a one-shot, with no future implications for my ability to generate wealth… the strict Kelly argument weakens.

  **EV:** Aha. So it's not a universal standard of rationality. It's a heuristic for repeated play.

  **KELLY:** Not a heuristic. A constraint. But you're asking a counterfactual. Money is fungible. There is no "one shot." If I take this bet, the outcome affects my future risk capacity, my ability to seize the next opportunity. Wealth is a seed, not a harvest. If I treat it as a harvest and bet it all on a single coin flip, I'm implicitly assuming I have no future. But I do. So the multiplicative dynamic always applies.

  **EV:** That's an assumption. What if I'm near the end of my life? What if I have a specific liability I need to meet, and the only way to cover it is a high-variance swing? If I bet Kelly, I might grow slowly but surely miss the target. If I bet big, I might fail, but I might also succeed. By forcing logarithmic growth, you're prioritizing survival over achievement. That's a value judgment. You value "staying in the game" over "maximizing potential output."

  **KELLY:** I value *existing* over *having a high expectation of existing*. Look, let's turn your objection around. You claim EV is rational because it maximizes the mean. But the mean is sensitive to outliers. In your strategy, the mean is driven by outcomes that have vanishingly small probabilities. You are optimizing for a miracle. Is it rational to base your life strategy on the tail events that effectively never happen?

  **EV:** It depends on the payoff structure. If the tail event pays out enough, it *should* dominate the decision. Consider Pascal's Wager, or a lottery ticket with a positive expected return. If I have linear utility, I take it. You Kelly-types would reject a bet with infinite expected value if the probability of winning is low enough, simply because the geometric growth is negative. That looks like irrationality to me. You're ignoring value because it comes wrapped in variance.

  **KELLY:** I'm ignoring value that I cannot capture. Infinite expected value is a mathematical artifact, not a physical resource. You can't spend an expectation. You spend realized wealth. If the price of accessing that infinite expectation is a 99.99% chance of destitution, then the "value" is illusory for a time-bound agent.

  **EV:** But why is the time-bound agent the only valid perspective? Physics might be time-bound, but decision theory is often about weighing possibilities. If I am a fund manager acting on behalf of shareholders, and I can diversify across thousands of independent bets, *I* become the ensemble. My fund's aggregate return converges to the arithmetic expectation. In that case, betting full Kelly on each individual asset is suboptimal for the fund. I should maximize EV on the portfolio. Your "time average" argument collapses when I can spatialize the risk.

  **KELLY:** That's the diversification defense. It's strong. But it relies on the independence of the bets. In systemic crises, correlations go to one. The "ensemble" of assets collapses into a single "time" trajectory of the market. 2008 proved that. When the liquidity dries up, you can't rebalance. You are forced onto a single path. At that moment, the geometric constraint bites. Everyone who leveraged to maximize arithmetic return got wiped out. The ones who survived were the ones who respected the geometric constraint.

  **EV:** So you admit it's about survival.

  **KELLY:** I admit it's about continuity.

  **EV:** Then let's call it what it is. You aren't discovering a new law of rationality. You're just advocating for a specific utility function: $U(W) = \log(W)$. You're saying, "Rational agents should have logarithmic utility." Fine. But why? If I have $U(W) = W$, I'm not irrational. I'm just willing to accept ruin for a higher average.

  **KELLY:** Because utility functions aren't just preferences; they should reflect the constraints of the environment. If the environment is multiplicative, a linear utility function leads to extinction. An agent with linear utility in a multiplicative world will eventually be outcompeted by an agent with logarithmic utility. Evolution selects for Kelly. So, if "rationality" means "strategies that persist," then Kelly is rational and EV maximization is self-terminating.

  **EV:** Evolution selects for survival, not truth. Maybe EV maximizers go extinct, but maybe they burn brighter. If the goal is to maximize the total wealth generated by the species before extinction, maybe the EV strategy produces more total dollars across the graveyard of bankrupt bettors than the cautious Kelly bettors ever accumulate. You're optimizing for the individual's longevity. I'm optimizing for the system's total output.

  **KELLY:** That's a heroic sacrifice argument. "I'll go broke so the mathematical expectation looks good." But who collects that output? If the bettors are broke, the wealth is concentrated in the hands of the few who got lucky. That's not system output; that's inequality.

  **EV:** (Smiles) Now you're doing politics.

  **KELLY:** I'm doing distribution. The geometric mean is the median outcome in the long run. The arithmetic mean is the average of the tails. If you care about the typical experience of the agent, you care about the median. If you care about the abstract sum, you care about the mean. Which one maps to "rational choice"?

  **EV:** I'd say it maps to the agent's goals. If I want to retire in ten years, Kelly is probably right. If I want to try to solve a funding crisis where anything less than a 100x return is useless, Kelly is cowardice. You claim your framework is utility-independent, but it's not. It implicitly assumes the goal is indefinite compounding.

  **KELLY:** I claim it's utility-independent because it derives from the dynamics, not the preference. But I will concede this: if your utility function has a hard floor—like bankruptcy—Kelly respects that floor. Linear utility ignores it. The question is: is the floor a preference or a physical boundary?

  **EV:** It's a boundary condition. And boundary conditions change.

  **KELLY:** Then your rationality is conditional. Mine is asymptotic.

  **EV:** And asymptotics are where all the bodies are buried. You keep saying "in the long run." Keynes said we're all dead. If I bet 100% today, and I win, I can switch to Kelly tomorrow. I can use the surplus to buy safety. You bet Kelly today, you stay safe, but you grow slow. If I get lucky early, I can overtake you and then mimic you. You can't mimic me without risking ruin. I have the option value of aggression. You don't.

  **KELLY:** You have the option value of aggression, but the probability of exercising it approaches zero. You're arguing that because there exists a path where you win big and then switch, that path justifies the strategy. But the weight of that path is infinitesimal. You are optimizing for a ghost.

  **EV:** And you are optimizing for the median. But rationality isn't about being typical. It's about being correct according to your own values. If I value the *possibility* of the upside more than the *probability* of the downside, EV is rational for me.

  **KELLY:** Then we aren't arguing about math anymore. We're arguing about whether "rationality" describes how to navigate the world as it is, or how to calculate values in a model of the world.

  **EV:** Precisely. I trust the model. The model says my bet has higher value.

  **KELLY:** And I trust the timeline. The timeline says your bet has zero value eventually.

  *(Silence hangs between them. EV picks up the coin.)*

  **EV:** One more round?

  **KELLY:** (Nods) I'll bet my 20%.

  **EV:** And I'll bet my 100%.

  **KELLY:** See you in the morning. If you're still here.

  **EV:** See you in the ensemble. Where I'm already rich.

  *(EV flips the coin. It spins, catching the light, hiding its face until it lands.)*
