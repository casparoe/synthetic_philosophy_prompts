prompt: |-
  My sister is an assistant professor of philosophy who has spent most of the last decade publishing on the ethics of promising, and she is getting married in six weeks. Naturally, she has asked me — someone who covers science and ideas for a living and is far more used to explaining other people's thinking than generating any of my own — to write the toast. I said yes before I understood what I was agreeing to. She has already ruled out the two easiest ways to write this speech: she doesn't want a toast that treats the words "I promise" as a kind of verbal magic that conjures an obligation out of nothing, and she doesn't want her own vow quietly reduced to what she calls, half-affectionately, "a Humean convention" — Hume's argument that keeping a promise is an artificial virtue we uphold only because the practice happens to be useful to society, with nothing more solid underneath it. She has spent just as long teaching the rival view, associated with Scanlon, that breaking a promise wrongs someone specifically because you deliberately invited their trust and reliance and then let them down — which makes the wrong closer to a kind of exploitation than to the breaking of a rule.

  About a third of the guests are former classmates and colleagues who worked through this exact literature alongside her and will know immediately if the toast hand-waves past the hard part of that disagreement. Everyone else, including our own parents, has never spent a minute wondering why promises bind and mostly wants to laugh, maybe get a little teary, and feel good about the marriage. Could you write the five-minute toast I now owe her — one that takes the question seriously enough to survive the philosophers in the room, stays genuinely warm and funny for everyone else, and still arrives at something true, rather than merely comforting, to say about the vow she and her partner are about to exchange with no referee but each other?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Science and ideas journalist (used to explaining, not generating original thought).
      *   **Audience:**
          *   Sister (the bride): Assistant professor of philosophy, specialist in ethics of promising.
          *   ~1/3 Guests: Philosophers/colleagues who know the literature (Hume vs. Scanlon, etc.).
          *   ~2/3 Guests: Family/Friends (parents, etc.) who want warmth, humor, and emotion.
      *   **Constraints:**
          *   No "verbal magic" (words creating obligation ex nihilo).
          *   No "Humean convention" (promise keeping just because it's socially useful).
          *   Must acknowledge the Scanlonian view (inviting trust/reliance, wronging the specific person).
          *   Must be philosophically rigorous enough for the colleagues but accessible/warm for the family.
          *   Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).
          *   Tone: Serious but warm, funny but true.
      *   **Goal:** A toast that honors the vow without reducing it to a rule or a utility calculation.

  2.  **Deconstruct the Philosophical Core:**
      *   *The Problem:* Why does saying "I promise" bind you?
      *   *Rejected Option A (Magic):* "I promise" isn't a spell.
      *   *Rejected Option B (Hume):* It's not just "society works better if we do this."
      *   *Accepted Option C (Scanlon/Reliance):* It's about the specific relationship. I invite you to trust me. If I break it, I exploit that trust.
      *   *The Twist for a Wedding:* Marriage isn't just a series of discrete promises. It's a state of being. How do we apply the ethics of promising to a lifelong partnership?
      *   *Key Insight:* The vow isn't a contract to perform specific tasks; it's a vow to maintain the *conditions* under which trust is possible. It's about becoming the kind of person for whom the promise is natural, not burdensome.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Establish the speaker's role (journalist vs. philosopher). Light humor about the stakes.
      *   **The Philosophical Setup:** Briefly state the sister's expertise. Acknowledge the "forbidden" theories (Magic and Hume) with a wink to the colleagues.
      *   **The Scanlonian Turn:** Explain the "trust/reliance" aspect simply. This is the bridge to the emotional core.
      *   **The Application to Marriage:** How does this apply to the groom/partner? It's not about a contract; it's about vulnerability.
      *   **The "True" Insight:** Move beyond the academic debate. The vow creates a shared identity. It's not just "I won't hurt you," it's "We are in this together."
      *   **Closing:** Raise a glass. Warmth and well-wishes.

  4.  **Refining the Tone:**
      *   *Risk:* Getting too academic. *Fix:* Use concrete examples (coffee, showing up, hard days).
      *   *Risk:* Getting too sappy. *Fix:* Keep the philosophical spine visible.
      *   *Risk:* Offending the sister. *Fix:* Show deep respect for her work, don't mock it.
      *   *Voice:* Intelligent, slightly self-deprecating, loving.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm a journalist. My sister is a philosopher. She studies promises. She told me not to say promises are magic or just social rules. She likes Scanlon. That means promises are about trust. Marriage is about trust. So, [Partner], don't break her trust. Love you both. Cheers.
      *Critique:* Too dry. Needs more meat on the bones. Needs to address the "no referee" aspect.

  6.  **Drafting - Iteration 2 (Adding Flesh):**
      Start with the pressure. "She graded my draft." Mention Hume and Scanlon by name for the colleagues. Explain Scanlon simply for the parents. "If I break a promise, I use you." Marriage is the ultimate version of this. It's not a contract with a lawyer. It's just you two. The vow changes who you are.
      *Critique:* Better. Needs to land the emotional punch. The "no referee" part is crucial.

  7.  **Drafting - Iteration 3 (Polishing and Timing):**
      *   *Word Count Check:* 5 minutes is roughly 750-850 words.
      *   *Specific Phrasing:* Need to make sure the Scanlonian principle ("Principle F" essentially) is alluded to without reading a syllabus.
      *   *The "Truth":* The toast needs to conclude that the vow isn't a shackle, but a foundation for freedom.

  8.  **Final Polish (incorporating into the final output):**
      *   Make sure the joke about the "referee" lands.
      *   Ensure the parents feel included (focus on love/trust).
      *   Ensure the philosophers feel respected (accurate representation of the views).
      *   *Self-Correction during drafting:* I initially thought about quoting Scanlon directly. No, that's too dry. Describe the *feeling* of the Scanlonian view. It's about *betrayal*, not *rule-breaking*.

  9.  **Final Review against constraints:**
      *   No verbal magic? Checked.
      *   No Humean convention? Checked.
      *   Scanlonian trust acknowledged? Checked.
      *   Warm/Funny? Added jokes about the speaker's anxiety and the sister's grading.
      *   5 minutes? Looks about right.

  **(Self-Correction Note):** Make sure not to make the groom sound like he's being interrogated. The toast is about *them* and the *institution* they are building.

  10. **Final Word Count Check:** Aiming for ~800 words.

