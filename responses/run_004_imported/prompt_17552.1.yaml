answer: |-
  Good evening. For those who don't know me, I'm the sibling. I work in journalism. My job is to explain other people's ideas. My sister's job is to have ideas so rigorous that people like me struggle to explain them.

  When she asked me to give this toast, I said yes immediately. Then I went home, read the prompt, and realized I had made a categorical error. She didn't ask for a speech; she asked for a peer-reviewed argument in favor of her marriage, delivered to an audience split between people who want to cry and people who want to check my citations.

  She gave me specific constraints. She said, "Do not tell me that saying 'I promise' is a kind of verbal magic that conjures obligation out of thin air." She also said, "Do not tell me that promise-keeping is just a Humean convention—something we do only because society would collapse if we didn't."

  For the philosophers in the room: I hear you. For everyone else: She doesn't want me to say marriage is a magic spell, and she doesn't want me to say it's just a social utility contract.

  This leaves us with the view she has spent the last decade championing, loosely associated with T.M. Scanlon. The idea is that breaking a promise is wrong not because you broke a rule, but because you manipulated someone's expectations. You invited them to rely on you. You gave them assurance. And then you used that assurance to make your life easier while making theirs harder. It's a specific kind of betrayal. It is treating a person like a tool rather than a partner.

  And this, I think, is where the toast actually begins. Because [Partner's Name], look at what you are signing up for. You are marrying a woman who knows exactly how the machinery of trust works. She knows where the stress points are. She knows that the vow you are about to take has no referee. There is no judge to blow a whistle if you forget an anniversary or leave the dishes in the sink. The only enforcement mechanism is the integrity of the relationship itself.

  So, why do it? Why stand up here and say words that, by her own definition, carry no magical force and no external penalty?

  I think the answer is that a wedding vow isn't a prediction of the future. It's not a guarantee that you will never change, or never struggle, or never want something different in ten years. If it were that, it would be a lie.

  Instead, I think the vow is an act of definition.

  When you say "I promise," you aren't just describing what you will do. You are creating a new standard for who you are *to each other*. You are saying, "I am inviting you to rely on me. I am giving you the right to hold me accountable. I am making your trust the architecture of my life."

  For the parents in the room: This is the romantic part. It means that when things are hard—and they will be hard—you won't have to wonder if you're alone. You won't have to calculate the odds. You will know, because you have built a structure where reliance is the default.

  For the colleagues in the room: This avoids the Humean trap. It's not about social utility. It's about the specific moral relationship between two people. It acknowledges that the "wrong" of breaking a vow here isn't violating a social norm; it's dismantling the shared world you've built.

  [Partner's Name], my sister knows better than anyone that promises are fragile. She knows that trust is easy to break and hard to fix. The fact that she is standing here, willing to place her trust in you, without a referee, without a contract, and without any magical insurance policy, is the greatest compliment she could possibly pay you. It means she believes you are the kind of person for whom a promise is not a burden, but a part of your identity.

  And [Sister's Name], you have spent ten years analyzing the ethics of promising. But today, you stop analyzing and start living it. You stop looking for the foundation of the obligation and start being the foundation for someone else.

  So, let's raise a glass.

  To the couple. May your promises never be mere conventions. May your trust never be exploited. And may you always find that the obligation you owe each other is not a shackle, but the very thing that makes you free to be yourselves.

  To [Sister] and [Partner].
