answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Risk-Tool Advisory Panel
  **FROM:** [Your Name], Ethics Consultant
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Divergent Actuarial Risk Estimates

  **Recommendation**
  The Panel should **prohibit the reporting of single-number point estimates (e.g., "63%") to commissioners and instead mandate the reporting of a risk interval (e.g., "21%–63%") accompanied by a brief explanation of the reference class divergence.** We should not select Tool A or Tool B as the "official" calculator, nor should we revert to unstructured clinical judgment. We must acknowledge the uncertainty explicitly in the output.

  **Rationale**
  This recommendation rests on three ethical and epistemic pillars:

  1.  **The Reference Class Problem:** As the panel noted, an individual belongs to infinite overlapping groups (national offenders, local offenders, age cohorts, etc.). Probability is a property of the *group*, not the *individual*. When Tool A says 63% and Tool B says 21%, neither is lying; they are answering different questions ("What is the risk for a national match?" vs. "What is the risk for a local match?"). To present either number as *the* probability for this specific man is epistemically false. Reporting the interval honors the truth that the "real" risk lies somewhere in the uncertainty between the models.
  2.  **Mitigating Anchoring Bias:** Psychological literature consistently shows that decision-makers anchor on specific numbers. If a commissioner sees "63%," they treat it as a fact similar to a blood alcohol content. If they see "21%–63%," they are forced to engage with the *uncertainty* of the prediction. This shifts the cognitive burden from "accepting the score" to "weighing the risk," which is the commissioner's actual job.
  3.  **The Liberty Interest:** Parole decisions deprive or restore liberty. When our best predictive instruments disagree by a factor of three, the state lacks the epistemic justification to act with the confidence a point estimate implies. In cases of reasonable doubt regarding risk, the ethical default should be to acknowledge that doubt rather than obscure it behind a false precision.

  **The Best Argument for the Opposing View (Adopt Tool A / National)**
  The strongest argument against my recommendation is the need for **standardization and stability.** Proponents of adopting the national tool (Tool A) argue that local matching (Tool B) introduces high variance and potential overfitting. Local data can encode specific policing biases (e.g., over-policing in certain neighborhoods) that inflate risk scores for demographic groups without reflecting actual dangerousness. A national standard ensures that a man in County X is evaluated by the same baseline as a man in County Y, promoting equal protection under the law. Furthermore, administrative efficiency requires a single input for decision matrices; ranges complicate guidelines and may lead to inconsistent outcomes where different commissioners interpret the same interval differently (some leaning on the low end, some on the high). From this view, choosing the more stable, broadly calibrated tool is the lesser evil compared to institutionalizing uncertainty.

  **Conclusion**
  While standardization is a virtue, it should not be purchased at the cost of honesty. We can standardize the *reporting of uncertainty* without pretending the uncertainty doesn't exist. I urge the panel to adopt the interval requirement.

  Respectfully,

  [Your Name]
