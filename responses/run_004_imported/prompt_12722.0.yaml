answer: |-
  You have hit on one of the most famous debates in moral philosophy, repackaged for the AI alignment era. Your intuition is sharp: **John Harsanyi** (a Nobel laureate) made almost exactly your argument in 1955, while **John Rawls** made the counter-argument in 1971.

  The short answer is: **You are mathematically right *if* you assume the agents behind the veil are risk-neutral expected utility maximizers. But alignment researchers (and Rawls) argue that assumption is false for high-stakes societal design.**

  Here is the breakdown of why this isn't just "utilitarianism with extra steps," and why alignment folks find the distinction critical.

  ### 1. The Harsanyi Objection (Your Argument)
  Your intuition aligns with **Harsanyi's Aggregation Theorem**. Harsanyi argued that if you are behind the Veil of Ignorance (VoI), you have an equal probability of being any person in society. If you are a rational agent maximizing expected utility, you will choose the social arrangement that maximizes the *average* utility.

  $$ \text{Expected Utility} = \frac{1}{N} \sum U_i $$

  If everyone does this, the resulting social welfare function is **Utilitarian**. From this perspective, the VoI is indeed just a thought experiment that derives average utilitarianism from rational self-interest. If alignment researchers assume risk-neutrality, you are correct: it's a trenchcoat.

  ### 2. The Rawlsian Rebuttal (Risk Aversion)
  Rawls explicitly rejected Harsanyi's math. He argued that when the stakes are "primary goods" (rights, liberties, life prospects), rational agents are not risk-neutral; they are **radically risk-averse**.

  When you don't know if you will be a billionaire or a starving prisoner, you don't maximize the *average* outcome; you maximize the *minimum* outcome (the **Maximin** strategy). You care more about raising the floor than raising the ceiling.

  *   **Utilitarianism (Harsanyi):** Accepts making 10% of the population miserable if it makes the other 90% ecstatic enough to raise the average.
  *   **Rawlsianism (VoI + Risk Aversion):** Rejects that trade-off. Behind the veil, you are terrified of being the 10%.

  In AI alignment, this distinction is massive. A utilitarian AI might sacrifice a minority group to maximize total global happiness. A Rawlsian AI (derived via VoI with risk aversion) would prioritize ensuring no group falls below a threshold of dignity, even at the cost of total utility.

  ### 3. Why Alignment Researchers Care (Beyond the Math)
  Even if the mathematical output were identical, alignment researchers value the VoI for three procedural reasons that simple preference aggregation lacks:

  #### A. Adaptive Preferences
  Preference aggregation takes people as they are. But people's preferences adapt to oppression (the "happy slave" problem). If you aggregate stated preferences, you might encode historical biases because oppressed groups might report lower expectations.
  *   **VoI Fix:** Behind the veil, you don't know your current status. You can't rationalize your current oppression. You choose principles based on *potential* needs, not *actual* conditioned desires.

  #### B. Legitimacy vs. Correctness
  The "Whose Values?" problem is often a legitimacy problem, not just a math problem. If an AI says, "I maximized the average preference," the minority who got crushed will rightly feel the system is hostile.
  *   **VoI Fix:** If the AI says, "These are the rules you would have chosen if you didn't know who you were," it creates a **procedural legitimacy**. It transforms the AI from a "tyrant of the majority" into a "neutral arbiter." This is crucial for stability.

  #### C. Incommensurable Values
  Preference aggregation requires a common currency (utils). But how do you trade off "religious freedom" against "economic growth"?
  *   **VoI Fix:** The VoI forces people to negotiate *principles* (lexicographical ordering) rather than *outcomes*. Rawls argued people would choose equal liberty *first*, and only then optimize for economics (the Difference Principle). This creates a constraint-satisfaction problem rather than a simple maximization problem, which is often safer for AI.

  ### 4. The Empirical Reality
  You mentioned DeepMind (likely referring to work on **social choice** or **human feedback**). Empirical studies on VoI bargaining generally show that humans **do not** behave like Harsanyi's risk-neutral agents.

  When people actually simulate the Veil of Ignorance in experiments (e.g., Frohlich, Oppenheimer, & Eavey, 1987, or more recent AI-specific trials):
  1.  They rarely choose pure Utilitarianism.
  2.  They rarely choose pure Maximin.
  3.  They choose a **floor constraint**: "Maximize the average, *provided that* no one falls below this minimum income/rights threshold."

  This suggests that VoI isn't just Utilitarianism in disguise; it elicits a distinct **hybrid moral intuition** that simple preference aggregation misses.

  ### 5. The "Extra Steps" Actually Matter
  To your point about "aggregation with extra steps": Yes, it is still aggregating interests. But it is aggregating **counterfactual, impartial interests** rather than **actual, biased preferences**.

  *   **Standard Aggregation:** "I want X because I am rich and X helps me."
  *   **VoI Aggregation:** "I want Y because if I turn out to be poor, Y protects me."

  In AI alignment, the fear is that training on *stated* preferences (RLHF) captures our biases, prejudices, and short-term thinking. Training on *VoI-derived* principles attempts to capture our **reflective equilibrium**—the values we hold when we aren't defending our own turf.

  ### Summary
  You are right that under **strict von Neumann-Morgenstern rationality with risk neutrality**, the Veil of Ignorance collapses into Utilitarianism.

  But alignment researchers use it because:
  1.  **Risk Profile:** They assume rational agents should be risk-averse regarding existential stakes (leading to Rawlsian constraints, not Utilitarian averages).
  2.  **Input Quality:** It filters out adaptive preferences and current positional biases.
  3.  **Stability:** It offers a narrative of fairness that minorities are more likely to accept than "the greater good."

  It's not a different *math* so much as a different *loss function* (maximin vs. mean) applied to a cleaner *dataset* (impartial vs. biased preferences). Whether that justifies the complexity is still an open debate, but it's not *just* a trenchcoat.
