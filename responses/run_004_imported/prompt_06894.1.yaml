answer: |-
  Here is a minimal pair of cases designed to test the "Equal Standing" account of hypocritical blame (associated with R. J. Wallace, Kyle Fritz, and Daniel Miller). These cases isolate the variable of the blamer's **attitude toward their own subjection to the norm**.

  ### Case 1: The Exemptionist
  Alice and Ben are senior partners at a law firm. There is a strict, explicit firm norm that partners must not bill clients for administrative hours. Both Alice and Ben have violated this norm repeatedly over the past month, billing a total of 10 hours each for administrative work.

  During a partnership meeting, Ben's violation is discovered. Alice stands up and sternly rebukes Ben. She says, "What you did is a violation of our core ethical standards. You cannot simply ignore the billing rules because they are inconvenient. You need to be held accountable." Alice's blame is sincere in that she wants Ben to stop, but internally, Alice regards the rule as binding on Ben but not on herself. She believes her seniority and higher revenue generation entitle her to an exemption from the administrative billing cap, even though she does not state this explicitly. She views herself as an enforcer of the rule, not a subject of it.

  **Intuition:** Alice lacks the standing to blame Ben. Her blame is intuitively hypocritical and morally infelicitous.

  ### Case 2: The Fellow Traveler
  Alice and Ben are senior partners at a law firm. There is a strict, explicit firm norm that partners must not bill clients for administrative hours. Both Alice and Ben have violated this norm repeatedly over the past month, billing a total of 10 hours each for administrative work.

  During a partnership meeting, Ben's violation is discovered. Alice stands up and sternly rebukes Ben. She says, "What you did is a violation of our core ethical standards. You cannot simply ignore the billing rules because they are inconvenient. You need to be held accountable." Alice's blame is sincere. Internally, Alice regards the rule as binding on both of them equally. She acknowledges that she has also violated the norm and feels genuine guilt about her own violations. She views her own behavior as a failure to meet a standard that she fully endorses for herself, not as a privilege of her status. She blames Ben not from a position of superiority, but from a commitment to the norm that she acknowledges applies to her own conduct as well.

  **Intuition:** Alice retains the standing to blame Ben. While she is inconsistent in her *behavior*, her blame is not hypocritical in the standing-undermining sense.

  ***

  ### The Precise Feature
  The feature of the second case that removes the disqualifying implicit claim is **the blamer's endorsement of the norm's authority over themselves (shared subjection).**

  On Equal Standing accounts (such as those proposed by Fritz & Miller, developing Wallace's insights), the defect in hypocrisy is not the bare inconsistency between the blamer's actions and their blame. Rather, the defect is a **false claim to moral privilege**.
  *   In **Case 1**, the act of blaming carries the implicit (and internal) claim that the blamer is exempt from the norm's authority or occupies a superior moral position relative to the target. This claim is false, and it undermines standing.
  *   In **Case 2**, the blamer acknowledges that they are *equally subject* to the norm's authority. By viewing their own violation as a failure rather than an exemption, they do not claim a status superior to the target. They blame as a member of the same moral community, bound by the same rules, thereby retaining the standing to demand compliance.
