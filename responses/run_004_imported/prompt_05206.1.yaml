      *   **Twist:** The user's grandmother died overnight. She was a bioethicist (30 years on an ethics committee) who held the *friend's* position (brain death criteria are a useful legal fiction, not necessarily biological death of the organism).
      *   **Grandmother's Wishes:** No comforting language about "watching over us," "spirits," or "persistence" after brain function ceases. She was a physicalist. She wanted honesty about the end of existence.
      *   **Audience:** Split 50/50 between bioethics/organ procurement colleagues (who know her work and views) and family (who just want to grieve, no seminar).
      *   **Tone:** Faithful to her demanding intellectual position, warm enough for family, avoiding spiritual platitudes she rejected.
      *   **Task:** Write the eulogy.

  2.  **Determine the Core Tension:**
      *   The user argued *against* the grandmother's view the night before she died.
      *   The eulogy needs to honor the grandmother's view without turning the funeral into a debate or making the user look hypocritical (or worse, like they are settling a score posthumously).
      *   The eulogy must validate her intellectual rigor without alienating the grieving family.
      *   It must avoid religious/spiritual comfort ("she's in a better place," "watching down on us") while still offering *human* comfort.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the loss directly. Establish her identity not just as a grandmother, but as a thinker.
      *   **Addressing the Work (for the colleagues):** Briefly touch upon her contributions to bioethics. Acknowledge her stance on death criteria without getting bogged down in jargon. Frame it as a commitment to *truth* and *honesty* rather than just technicalities.
      *   **Addressing the Family (for the relatives):** Translate her intellectual rigor into personal integrity. She didn't believe in illusions, but she believed in *us*. Her honesty was a form of love.
      *   **Addressing the "Afterlife" Constraint:** She explicitly said no "watching over us." How to comfort then? Focus on memory, legacy, and the reality of the life lived. The comfort comes from the impact she had, not a metaphysical continuation.
