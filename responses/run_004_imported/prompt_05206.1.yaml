  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Grandma died. She was an ethicist. She thought hard about death. Some of you know she didn't believe in ghosts or souls surviving. She thought brain death rules were tricky. She wanted us to be honest. Family, she loved you. Colleagues, she was sharp. I argued with her recently. She was right to challenge me. She isn't watching us. But we remember her. Goodbye.

