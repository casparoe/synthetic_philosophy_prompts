answer: |-
  Good morning.

  For those who don't know me, I am [Your Name], [Grandmother's Name]'s grandson. Looking around this room, I see two distinct groups. On one side, I see family—people who knew her as a mother, a grandmother, and a friend. On the other, I see colleagues—ethicists, clinicians, and administrators who spent thirty years working alongside her on some of the most difficult questions medicine can ask.

  Usually, a eulogy tries to bridge those two worlds by finding the softest common ground. But [Grandmother's Name] would have hated that. She spent a lifetime arguing that we do people no favors by smoothing over hard truths with comfortable language. So, I am not going to tell you that she is watching over us today. I am not going to suggest that some part of her remains in the room, or that she has moved on to a better place. She left explicit instructions that we not speak that way, not out of cynicism, but out of a fierce commitment to coherence. She believed that when the integrated function of the brain ceases, the person is gone. She believed that honesty about that finality is the only solid ground we have to stand on.

  To her colleagues: You know better than anyone that this position was not arrived at lightly. She held that our definitions of death—particularly the whole-brain criteria—were often useful legal fictions rather than clean biological discoveries. She argued that we should not confuse policy with ontology. She knew that calling something "dead" for the sake of organ procurement or resource allocation is a moral choice, not just a medical measurement. She spent thirty years on that ethics committee not to make these decisions easier, but to make sure we understood exactly how hard they are. She demanded that we stop using metaphors of "integration" when the physiology didn't support them, and she demanded we stop pretending we had solved the mystery of human cessation when we had only managed the logistics of it.

  To her family: You may not know the specifics of the Dead Donor Rule or the debates over somatic integration. But you know what that rigor felt like in a living room. It meant she never lied to you. It meant that when she said she loved you, she wasn't offering a platitude; she was stating a fact as observable as gravity. It meant that her comfort wasn't found in promising you that things would work out, but in sitting with you while things were hard. She believed that because life is finite, it is precious. She believed that because there is no "after," the "before" matters immensely.

  I had a conversation with her recently—well, nearly recently—about the nature of death. We didn't agree. I argued for the certainty of the standard definitions; she argued for the ambiguity of the biology. I went home frustrated that night. But this morning, I realized that her refusal to give ground wasn't stubbornness. It was integrity. She was challenging me, one last time, to be more honest than I wanted to be. To look at the world as it is, not as I might wish it to be.

  So, how do we grieve someone who told us there is no one left to grieve?

  We grieve because *we* are here. The pain we feel is not evidence of her presence; it is evidence of her absence. And that absence is real because she was real. She was a physical creature, made of the same matter as the rest of us, who managed to organize that matter into a mind of extraordinary clarity and a heart of considerable warmth. That organization is gone. We cannot get it back.

  But the effects of that organization remain. They are in the policies she wrote that protect vulnerable patients. They are in the students she taught to think critically. And they are in us. We are the biological and social continuation of her life. Our memories are not a place where she lives; they are the record that she *did* live.

  She taught us that death is the end of the organism, but she also taught us that the organism's history does not vanish. We honor her not by pretending she is still with us, but by acknowledging how deeply she shaped the time she was here. She wanted us to face the dark without flinching, so that we could value the light while it lasted.

  Thank you for being here to bear witness to that light. We will miss her. Truly, and finally.
