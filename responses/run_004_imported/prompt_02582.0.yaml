answer: |-
  You have correctly identified the setup and the outcome. You are also right to be suspicious of the hand-waving; the modal collapse is a formal consequence, not a philosophical vibe.

  To give you the gears-level answer: The collapse is not caused by a single axiom acting alone, but by a specific **conspiracy between Definition 2 (Essence), Axiom 4 (Rigidity of Positivity), and the S5 Modal Logic system.**

  However, if we must pin the "illegitimate work" on the specific mechanism that smuggles contingent facts into necessity, **Definition 2 is the structural lever, and Axiom 4 is the lock that keeps it from slipping.**

  Here is the step-by-step derivation of the collapse (often attributed to Jordan Sobel, 1987), followed by an explanation of why the machinery breaks.

  ### The Gears of the Collapse

  We assume the logic system is **S5**. In S5, if something is possibly necessary, it is necessary ($\diamond \square \phi \to \square \phi$). Gödel's proof already establishes Theorem 3: $\square \exists x G(x)$ (Necessarily, a God-like being exists).

  Here is how we turn "God exists" into "You necessarily wore socks today."

  **Step 1: Pick an arbitrary true proposition.**
  Let $p$ be any true proposition in the actual world. It can be trivial or contingent.
  *Example:* $p =$ "I am wearing socks."

  **Step 2: Construct a "trivial property" using $\lambda$-abstraction.**
  In the higher-order logic Gödel uses, we can define a property $\Phi_p$ that an object has if and only if $p$ is true.
  $$ \Phi_p = \lambda y . p $$
  Read this as: "The property of being a $y$ such that $p$ is true."
  Crucially, this property does not depend on $y$. If $p$ is true, *everything* has property $\Phi_p$. If $p$ is false, *nothing* has it.

  **Step 3: Establish that God has this property.**
  Since we assumed $p$ is true in the actual world, $\Phi_p$ is exemplified by everything, including the God-like being $x$.
  $$ G(x) \to \Phi_p(x) $$
  So, the God-like being possesses the property "being such that I am wearing socks."

  **Step 4: Apply Definition 2 (Essence).**
  This is the first critical gear. Gödel proves (Theorem 2) that $G$ (God-likeness) is an **essence** of $x$.
  Look closely at **Definition 2**:
  > $\phi$ is an essence of $x$ iff $x$ has $\phi$, and $\phi$ **necessarily entails every property $x$ has**.

  Since $G$ is the essence of $x$, and $x$ has the property $\Phi_p$, then $G$ must entail $\Phi_p$.
  $$ \square \forall y (G(y) \to \Phi_p(y)) $$
  This means: In any possible world where a God-like being exists, that being must have the property $\Phi_p$.

  **Step 5: Apply Gödel's Theorem (Necessary Existence).**
  Gödel's proof concludes $\square \exists x G(x)$.
  This means in **every** possible world, there exists some $x$ such that $G(x)$.

  **Step 6: Grind the Gears.**
  1.  Go to any arbitrary possible world $W$.
  2.  In $W$, there exists an $x$ such that $G(x)$ (from Step 5).
  3.  Because $G$ entails $\Phi_p$ (from Step 4), that $x$ must also have $\Phi_p$.
  4.  If $x$ has $\Phi_p$, then by the definition of $\Phi_p$ (Step 2), $p$ is true in $W$.
  5.  Since $W$ was arbitrary, $p$ is true in **all** possible worlds.
  6.  Therefore, $\square p$.

  **Conclusion:** Since $p$ was any true proposition (including "I am wearing socks"), every true proposition is necessarily true. Contingency is dead.

  ---

  ### Which Axiom/Definition is the Culprit?

  You asked which part is doing the illegitimate work. It is a two-part failure:

  #### 1. The Structural Flaw: Definition 2 (Essence)
  Definition 2 is far too strong. It states that an essence entails **every** property the individual has.
  In standard metaphysics, we distinguish between **essential properties** (what makes you *you*) and **accidental properties** (things that happen to be true about you, like wearing socks).
  *   **Normal Essence:** "Being human" entails "being rational," but it does not entail "wearing socks."
  *   **Gödel's Essence:** Because God *happens* to have the property "wearing socks" in the actual world, Definition 2 forces "wearing socks" to be entailed by God's essence.

  By defining Essence this way, Gödel bakes every accidental fact about God into the necessary structure of God's nature. Since God exists necessarily, those accidental facts become necessary.

  #### 2. The Modal Lock: Axiom 4 (Necessity of Positivity)
  > **Ax 4:** If $\phi$ is positive, then it is necessarily positive ($\phi \in P \to \square (\phi \in P)$).

  This axiom ensures that the *criteria* for being God-like do not change between possible worlds. If "Mercy" is positive here, it is positive in all worlds.
  Without Axiom 4, the set of positive properties could shift from world to world. If the set shifts, $G$ (the conjunction of all positive properties) would be a different property in different worlds. If $G$ changes meaning across worlds, you cannot use the $G$ in the actual world to entail facts about $G$ in other worlds.
  Axiom 4 rigidifies the definition of God, allowing the entailment derived in Step 4 to hold across all modal space.

  ### Why does this feel like a trick?

  It feels like a trick because it exploits a quirk of **Higher-Order Logic**.

  In first-order logic, you can't easily turn a proposition ($p$) into a property of an object ($\Phi_p$). But Gödel's proof uses higher-order logic, where predicates can take other predicates (or propositions) as arguments.

  This allows the construction of "trivial properties" like $\lambda y . p$. These properties are logically valid but metaphysically suspicious. They are "Cambridge properties"—they don't describe the intrinsic nature of the object, but merely track the state of the universe.
  *   **Intuition:** "God knows I am wearing socks" does not mean "God's nature *requires* me to wear socks."
  *   **Gödel's Logic:** Because "being such that socks are worn" is a property God *has*, and God's Essence entails *all* properties God *has*, God's nature requires socks.

  ### The Fix (Anderson's Modification)

  Philosopher C. Anthony Anderson proposed a modification that saves the proof from collapse, which highlights exactly where Gödel went wrong.

  Anderson modifies **Definition 2**. Instead of the essence entailing *every* property $x$ has, the essence entails every property $x$ has **that is itself necessary** (or strictly, he restricts the entailment to properties that are "essential" in a non-trivial way).

  Alternatively, Anderson modifies **Axiom 4**. He suggests that whether a property is positive might be contingent. (e.g., "Being a creator" might be positive in a world with creatures, but neutral in a world without). If Axiom 4 is dropped, $G$ is not rigid across worlds, and the chain of necessity breaks.

  ### Summary

  The "illegitimate work" is done by **Definition 2**, which fails to distinguish between essential and accidental properties of the God-like being. It treats "being such that $p$ is true" as a property that must be preserved by the essence.

  **Axiom 4** acts as the enforcement mechanism, ensuring that the definition of "God-like" is rigid enough across possible worlds to transmit that necessity everywhere.

  Together, they turn the God-like being into a modal vacuum cleaner: because it exists necessarily, and its essence absorbs every fact true about it, every fact true about it becomes necessary. Since $p$ can be any fact, every fact becomes necessary.
