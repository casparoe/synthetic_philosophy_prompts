      *   **The Solution (Object-Given vs. State-Given):**
          *   *Object-Given Reasons:* Reasons provided by the properties of the *object* of the attitude. (The cake tastes sweet). These make the attitude *fitting*.
          *   *State-Given Reasons:* Reasons provided by the benefits of *being in the state* of having the attitude. (Desiring the cake makes me happy/demon doesn't torture me). These make the attitude *prudent* or *useful*, but not necessarily *fitting*.

