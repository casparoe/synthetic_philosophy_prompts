prompt: |-
  So I'm a retired chemist who's gotten pretty into philosophy since I stopped working, and lately I've been stuck on the 'wrong kind of reasons' problem for fitting-attitude theories of value - the idea that somethings being good just comes down to there being reason to desire it, admire it, or whatever the relevant pro-attitude is. Every discussion of this I run into uses the same case: a demon who'll torture you unless you desire a saucer of mud, which gives you a reason to desire it without the mud actually being valuable. I think I follow that example fine, but I've got a nagging feeling I've just memorized the story rather then actually understood the concept behind it. Could you cook up a totally different example (no demons, no mud) that shows the same problem, and use it to explain how the object-given vs state-given reasons distinction is actually doing the work of separating the right kind of reason from the wrong kind?
