answer: |-
  **Title:** The Fixity of Truth: Why the Adams–Hasker Objection Undermines Molinist Libertarianism

  **Introduction**

  In the landscape of philosophical theology, few theories attempt as ambitious a synthesis as Luis de Molina's theory of middle knowledge (*scientia media*). Designed to navigate the Scylla of theological determinism and the Charybdis of open theism, Molinism posits that God possesses knowledge of counterfactuals of creaturely freedom (CCFs)—propositions regarding what any free creature *would* do in any specific set of circumstances—prior to His decision to create. By grounding divine providence in these pre-volitional truths, Molinists claim to secure a robust libertarian freedom for creatures: God does not determine the choice; He merely knows it and actualizes the world in which it occurs.

  However, this framework faces a potent technical challenge known as the Grounding Objection, specifically formulated through the lens of explanatory priority by Robert Adams and William Hasker. They argue that the logical structure of Molinism renders the truth of CCFs explanatorily prior to the agent's very existence and actions, thereby stripping the agent of the control required for libertarian freedom. While defenders like William Lane Craig argue that this objection relies on an equivocal notion of priority, a close examination suggests otherwise. This essay reconstructs the dispute regarding explanatory priority and argues that the Adams–Hasker objection succeeds. Molinism fails to secure a kind of libertarian freedom that is substantively different from theological determinism because it locates the fixity of human action outside the agent's causal power, rendering the agent unable to satisfy the Principle of Alternate Possibilities.

  **I. The Molinist Framework and Explanatory Priority**

  To understand the dispute, one must first grasp the logical architecture of Molinism. Molina divides divine knowledge into three logical "moments," which are distinct in nature but simultaneous in time:

  1.  **Natural Knowledge:** God's knowledge of all necessary truths and possibilities. This is prior to any act of the divine will.
  2.  **Middle Knowledge:** God's knowledge of all true counterfactuals of creaturely freedom (e.g., "If Peter were in circumstances C, he would freely deny Christ"). Crucially, Molinists assert these truths are *pre-volitional* regarding creation. God does not make them true; He simply knows them. Their truth value is determined by the creature (in a non-causal sense) or is simply brute fact.
  3.  **Free Knowledge:** God's knowledge of the actual world, which follows His free decree to create a specific order of things.

  The Molinist motivation is to preserve libertarian freedom while maintaining divine sovereignty. In Calvinist theological determinism, God's decree causally determines human actions, violating libertarian freedom. In Molinism, God's decree is *responsive* to the CCFs. As William Lane Craig argues, the truth of the CCF is "explanatorily prior" to God's decision to create. God chooses to actualize World A *because* He knows that in World A, Peter freely denies Christ. Thus, the explanation for Peter's denial flows from Peter (via the CCF) to God's decree, not vice versa. This direction of explanation is intended to ensure that the creature, not God, is the ultimate source of the action.

  **II. The Adams–Hasker Objection: The Transitivity of Priority**

  Robert Adams (1977) and William Hasker (1989) challenge whether this explanatory structure actually preserves freedom. Their argument does not claim that God causes the action, but rather that the *truth* of the action is settled in a way that makes freedom impossible. The core of their argument rests on the transitivity of explanatory priority.

  The argument can be reconstructed as follows:

  1.  **Premise 1:** The truth of the CCF (e.g., "If Peter were in C, he would deny Christ") is explanatorily prior to God's creative decree. (Molinist Axiom)
  2.  **Premise 2:** God's creative decree is explanatorily prior to Peter's existence. (Metaphysical Axiom: God causes existence)
  3.  **Premise 3:** Peter's existence is explanatorily prior to Peter's actions. (Metaphysical Axiom: An agent must exist to act)
  4.  **Premise 4:** Explanatory priority is a transitive relation. (If A is prior to B, and B is prior to C, then A is prior to C).
  5.  **Conclusion 1:** Therefore, the truth of the CCF is explanatorily prior to Peter's action.
  6.  **Conclusion 2:** If a proposition describing an action is explanatorily prior to the action itself (and prior to the agent's existence), the agent lacks control over that proposition.
  7.  **Final Conclusion:** Therefore, Peter lacks libertarian freedom regarding the action.

  Hasker sharpens this by focusing on the concept of "power over the past." For a choice to be libertarianly free, the agent must have the power to do otherwise. If it is *true* from eternity (prior to the agent's existence) that the agent will perform action X in circumstances C, then at the moment of choice, the agent cannot make that eternal truth false. To do so would require the power to change a truth that obtained before the agent existed. Hasker argues that Molinism turns CCFs into "hard facts" about the past (logically speaking) that are beyond the agent's control. If the truth is fixed before the agent exists, the agent cannot be the "source" of that truth in the robust sense libertarianism requires.

  **III. The Molinist Defense: Denying Transitivity and Redefining Priority**

  Molinist defenders, most notably William Lane Craig and Thomas Flint, respond by attacking Premise 4 (transitivity) and the interpretation of Premise 1. They argue that Adams and Hasker conflate different *kinds* of priority.

  Craig distinguishes between *causal* priority and *logical* or *explanatory* priority. He argues that while the CCF is explanatorily prior to the decree, it is not *causally* prior to the action. The CCF does not *make* Peter deny Christ; Peter's free choice makes the CCF true. Craig suggests the relation is counter-intuitive but coherent: the truth of the counterfactual depends on what the creature *would* do, even though that truth is known prior to the creature's existence.

  Furthermore, Molinists argue that explanatory priority is not transitive in this specific context. The priority between the CCF and the Decree is a relation of *conditionality* (God chooses based on conditions), whereas the priority between the Decree and Existence is a relation of *causation*. Because the relations are heterogeneous, the transitivity fails. Therefore, the CCF is not "fixed" in a way that constrains Peter; it merely describes what Peter will freely do. For the Molinist, the fact that a proposition is true prior to an event does not entail determinism, provided the truth of the proposition *depends* on the event (a view sometimes called "Ockhamism" applied to counterfactuals).

  **IV. Critical Evaluation: Why the Objection Succeeds**

  Despite the sophistication of the Molinist defense, the Adams–Hasker objection reveals a fatal flaw in the Molinist account of freedom. The Molinist attempt to distinguish between types of priority ultimately fails to rescue the agent's control, rendering Molinist freedom functionally indistinguishable from theological determinism regarding moral responsibility.

  The crux of the issue lies in the **Sourcehood Condition** of libertarian freedom. Libertarianism requires not just the ability to do otherwise (PAP), but that the agent is the ultimate source of the action. In theological determinism, God is the source; in Molinism, the Molinist claims the creature is the source. However, the Adams–Hasker argument demonstrates that on Molinism, the *truth value* of the action is settled independently of the agent's exercise of power.

  Consider the status of the CCF prior to creation. Molina insists God does not make it true. If God does not make it true, and the creature does not yet exist to make it true, what makes it true?
  1.  **If nothing makes it true (Brute Fact):** Then the truth is a cosmic accident. If it is a brute fact that "Peter would deny Christ," Peter has no control over this fact. It is simply a feature of logical space that Peter encounters. If Peter's action is merely the temporal unfolding of a brute logical fact, Peter is not the source of the action; logic is. This is a form of logical determinism.
  2.  **If the creature makes it true:** This is the standard Molinist line. But *how* can a non-existent creature ground a truth? Craig suggests a kind of "counterfactual grounding." But as Hasker points out, if the truth is already established in the second logical moment (before creation), it is immutable relative to the moment of choice. When Peter stands in Circumstances C, he cannot choose to affirm Christ, because that would render the eternal CCF false. Peter lacks the power to falsify the CCF.

  The Molinist response regarding transitivity is particularly weak. While it is true that the relation between CCF/Decree differs from Decree/Existence, the *result* of the chain is what matters for freedom. If A is prior to B, and B is necessary for C, A is effectively a condition for C. If the truth of "Peter denies Christ" is a condition for God creating Peter (because God only creates worlds He knows are feasible), then Peter's existence is contingent on his denial. Peter cannot exist in that world and do otherwise, because if he did otherwise, the CCF would be false, God would not have actualized that world, and Peter would not exist.

  This leads to the **Consequence Argument** applied to Molinism. In determinism, my actions are the consequence of the past and laws of nature. In Molinism, my actions are the consequence of the truth of CCFs and God's decision to actualize a world containing those CCFs. In both cases, the factors fixing the action are outside the agent's control.
  *   In Calvinism, God fixes the action.
  *   In Molinism, the *Truth* fixes the action.

  For the agent, the phenomenological and metaphysical result is identical: at the moment of choice, only one future is compossible with the past (including the past truth of the CCF). The Molinist claims this is compatible with freedom because the CCF *depends* on the choice. But this is circular. The CCF must be true *before* the choice to guide God's decree. If it depends on the choice, it cannot be fixed before the choice. If it is fixed before the choice, it cannot depend on the choice in a way that grants the agent control.

  Therefore, the "freedom" Molinism secures is merely the absence of *divine causal coercion*. It does not secure the absence of *fixity*. Libertarian freedom requires that the agent determines the truth of the action at the moment of choice. Molinism posits that the truth of the action is determined prior to the moment of choice (in the logical moments of divine knowledge). Consequently, Molinism fails to provide a substantive alternative to theological determinism. It replaces the determinism of the Divine Will with the determinism of Divine Foreknowledge grounded in brute counterfactuals. Both systems leave the agent without the power to render the past (or the pre-volitional logical facts) false.

  **Conclusion**

  The dispute between Molinists and their critics over explanatory priority is not merely semantic; it strikes at the heart of what it means to be a free agent. While Molinism offers an elegant solution to the problem of providence, the Adams–Hasker objection demonstrates that it purchases this solution at the cost of libertarian freedom. By placing the truth of counterfactuals explanatorily prior to the agent's existence, Molinism renders those truths independent of the agent's control. The denial of transitivity by defenders like Craig serves only to obscure the metaphysical fixity that the argument reveals.

  Ultimately, Molinism does not secure a kind of libertarian freedom that theological determinism lacks. Both views agree that the future is settled prior to the agent's choice; they merely disagree on *what* settles it (God's will vs. brute counterfactual truths). Since libertarian freedom requires that the agent be the ultimate settler of the action, the Adams–Hasker argument shows that Molinism's "freedom" is no more substantial than the determinist's. For the philosopher seeking to preserve robust human freedom, the Molinist middle ground is an illusion; one must either embrace the risk of Open Theism or accept the fixity of Determinism.

  ***

  **References for Further Research**
  *   Adams, Robert Merrihew. "Middle Knowledge and a Simple God." *Faith and Philosophy* 4, no. 2 (1977): 120–137.
  *   Craig, William Lane. *The Only Wise God: The Compatibility of Divine Foreknowledge and Human Freedom*. Baker Academic, 1987.
  *   Hasker, William. *God, Time, and Knowledge*. Cornell University Press, 1989.
  *   Flint, Thomas P. *Divine Providence: The Molinist Account*. Cornell University Press, 1998.
  *   Perszyk, Ken. "The Molinist Account of Freedom." In *The Oxford Handbook of Philosophical Theology*, 2009.
