answer: |-
  This is a strong set of notes, and you're right to pressure-test this before Friday. The Frege-Geach (FG) landscape is minefield-heavy, but you've identified a genuine tension point. However, there are a few places where your characterization might be slightly off, and—crucially for a dissertation—the "novelty" alarm bells are ringing regarding Schroeder.

  Here is a breakdown of the three questions you posed, followed by a strategic suggestion for how to frame this for your advisor.

  ### 1. Are you representing Blackburn and Gibbard fairly?

  **Broadly, yes, but with caveats.**

  *   **Blackburn (*Spreading the Word*):** Your summary of the "tree of attitudes" is accurate for this text. The core idea is that moral conditionals express higher-order attitudes (e.g., disapproval of holding the antecedent attitude without the consequent).
      *   *Caveat:* You need to be careful not to conflate *Spreading the Word* (1984) with *Ruling Passions* (1998). In the latter, Blackburn shifts toward a more norm-acceptance view which alters the FG machinery slightly. If your chapter is about the "classic" quasi-realist FG solution, *Spreading the Word* is the right target, but acknowledge the evolution.
  *   **Gibbard (*Thinking How to Live*):** Your summary of hyperplans is also accurate. Gibbard moves to a semantics where sentences express properties of hyperplans (sets of maximally specific plans). Validity is preservation of "acceptance" across these sets.
      *   *Caveat:* Gibbard's 2003 move is often criticized by hardline expressivists for being *too* truth-conditional. He essentially builds a possible-worlds semantics but replaces worlds with hyperplans. You should acknowledge that Gibbard solves FG partly by "selling out" to a formal semantics that looks suspiciously like realism.

  **Verdict:** Your setup is fair enough for a dissertation chapter, provided you specify you are critiquing the *Spreading the Word* version of Blackburn.

  ### 2. Does the test case show what you think it shows?

  **Here is where you need to tighten the screws.**

  You argue that disjunction reveals an asymmetry because it stems from *uncertainty*, which Blackburn's "settled higher-order attitudes" can't capture, whereas Gibbard's hyperplans can.

  **The Problem:** Your intuition about "uncertainty" is the weak link.
  For an expressivist (Blackburn included), asserting a disjunction ($A \lor B$) is **not** merely reporting a psychological state of uncertainty ("I don't know which"). It is expressing a *determinate* commitment: a commitment to ruling out the possibility that *both* are false.
  *   **Blackburn's Fix:** Blackburn doesn't need a unique "disjunction attitude." He defines $A \lor B$ as $\neg A \to B$. Since he already has machinery for negation and conditionals, the attitude toward the disjunction is just the higher-order attitude toward that conditional. If you accept $\neg A \to B$ and you accept $A$ (via learning $\neg B$ is false... wait, your syllogism is $A \lor B, \neg B \vdash A$), then consistency requires accepting $A$.
  *   **The Real Asymmetry:** The asymmetry isn't about *uncertainty*; it's about **Compositionality**.
      *   **Gibbard:** The meaning of $A \lor B$ is a function of the meaning of $A$, the meaning of $B$, and the semantic value of $\lor$. It is fully compositional. The logic falls out of the set-theory of hyperplans.
      *   **Blackburn:** The meaning of $A \lor B$ is defined *holistically* by the attitude one takes toward the whole sentence. He stipulates the attitude for the complex sentence rather than deriving it from the parts.

  **Does your test case work?**
  As written, no. Blackburn *can* validate Disjunctive Syllogism using his conditional/negation machinery. He doesn't "fail" the logic test.
  **However,** your test case *does* work if you pivot the focus to **Moral Uncertainty** specifically.
  If the agent says, "I am 50% confident it was wrong to torture the cat, 50% confident it was wrong to lie," standard expressivism struggles to model *degrees* of belief (credences) in moral propositions without truth-apt content. Gibbard's hyperplans (being world-like) can model credences over hyperplans much easier than Blackburn can model credences over "trees of attitudes."

  **Verdict:** The test case doesn't show Blackburn *fails* logic. It shows his solution is **less elegant/compositional** than Gibbard's. If you want to claim he *can't* handle it, you need to lean harder into the **Moral Uncertainty** literature (see below).

  ### 3. Is this fresh enough for a dissertation? (The Schroeder Question)

  **This is the danger zone.**

  You mentioned: *"I have a half-memory of Schroeder saying in Being For that disjunction is where this kind of theory earns its keep."*

  **Correction:** Schroeder's main critique in *Being For* (2008) is actually focused on **Negation** (The "Negation Problem"). He argues that Blackburn has to posit *different types* of attitudes for $\neg P$ depending on whether $P$ is atomic or complex, which breaks compositionality.
  *   However, Schroeder *does* argue that expressivists lack a general logic of attitudes. He argues that Gibbard's 2003 semantics succeeds where Blackburn's 1984 pragmatics fails precisely because Gibbard adopts a compositional semantics.
  *   **The Literature:** The claim that "Gibbard handles complex logic better than Blackburn via hyperplans" is now a standard move in metaethics. It is arguably *too* standard for a dissertation chapter unless you have a new angle. If you write "Gibbard solves FG better than Blackburn because of compositionality," your advisor will ask: "How is this different from Schroeder Chapter 4?"

  ### Strategic Advice for Friday's Meeting

  To make this dissertation-worthy, you need to pivot from "Logic" to "Moral Uncertainty."

  1.  **Reframe the "Uncertainty" Intuition:** Don't say Blackburn can't handle disjunction logic (he can, via $\neg A \to B$). Say Blackburn cannot easily handle **partial belief in disjunctions**.
      *   Case: "I'm not sure if lying is wrong or if stealing is wrong, but I'm sure one of them is."
      *   Gibbard: I can have a credence distribution over hyperplans. Some hyperplans forbid lying, some forbid stealing. I can be uncertain which hyperplan is correct.
      *   Blackburn: What is the *attitude* corresponding to "50% confidence in a higher-order attitude"? The "tree" metaphor gets very messy when you introduce probabilities.
  2.  **Connect to Recent Work:** Look at **Elizabeth Moss (2018)** "Moral Credences and the Expression of Value" or **Schroeder's** later work on expressivist credences. If you can show that the Disjunctive Syllogism case reveals a problem for *updating* moral credences in a Blackburnian framework that doesn't exist in Gibbard's, that is much fresher.
  3.  **The "Ad-Hoc" Charge:** Instead of saying Blackburn *fails*, argue that his solution is **explanatorily inferior**. Gibbard explains *why* the logic works (set inclusion). Blackburn merely *asserts* that consistency requires it. The asymmetry is in the *explanation of validity*, not the validity itself.

  **Summary for your Advisor:**
  "I'm arguing that while both Blackburn and Gibbard can technically validate disjunctive syllogisms, Gibbard's hyperplan semantics offers a compositional explanation that accommodates moral uncertainty/credences, whereas Blackburn's pragmatic tree-approach requires ad-hoc stipulations for complex sentences that make modeling moral uncertainty difficult. I want to check if this distinction is robust enough to carry a chapter, or if I'm retreading Schroeder's compositionality objection."

  This shows you know the literature, you know the objection, and you're trying to find the specific niche (uncertainty/credence) that makes it *yours*. Good luck on Friday.
