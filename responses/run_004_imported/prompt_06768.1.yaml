answer: |-
  "The signal's been red for an hour," Marcus said, watching the darkness smear against the glass. "If patience is a virtue, this railway company is saintly."

  "And if stagnation is a vice, we're already in hell," Elena replied, not looking up from her annotated papers. "Just admit you don't want to be on this panel."

  "I don't want to be on this panel. But I do want to hear you try to defend the Stoic ghost in the machine one more time."

  "There are no ghosts, Marcus. Just judgments. You're the one chasing phantoms in the nervous system."

  "Recalcitrant emotions, Elena. We've been here. The fear persists after the judgment of safety. How is that a judgment?"

  "Because the judgment isn't always occurrent. You can hold a evaluation dispositionaly without rehearsing it verbally."

  "That's special pleading. When I see the spider, I judge it harmless. I *know* it's harmless. Yet I jump. The Müller-Lyer lines look unequal even after I've measured them. Does measuring them change the visual experience?"

  "Visual illusion isn't emotional recalcitrance. In the illusion, you don't *believe* the lines are unequal. In the phobia, you still judge the spider as a threat on some level."

  "On what level? The level you refuse to name? The phenomenology is of conflict. Belief says 'safe', emotion says 'danger'. If emotion were just judgment, there would be no conflict."

  "There is conflict because we are fragmented. I can judge something dangerous for my well-being while simultaneously judging it harmless in reality. Ambivalence isn't a bug; it's a feature of complex valuation."

  "Fragmented judgment is just a polite way of saying 'non-cognitive state'. Take grief. You know the dead are gone. You know grieving won't bring them back. Yet the grief grinds on for years. Is that a judgment?"

  "Grief is the judgment that something of immense value has been lost. The persistence isn't the emotion failing; it's the value remaining."

  "But the intensity fades independently of the valuation. I value my mother's memory equally in year one and year ten. The grief isn't the same. The perception dims; the judgment remains constant."

  "Then your perceptual model fails to account for the intentionality. Try indignation. I feel indignation because I judge that you *wronged* me. That requires a concept of 'wrong'."

  "I perceive the wrongness. Like I perceive redness. I don't need to infer the wavelength to see the color."

  "Redness is a physical property. 'Wronging' is a narrative structure. It involves agency, intent, history. You can't perceive a narrative."

  "Emotions track value properties. They are non-conceptual. A dog feels indignation without a thesis on moral agency."

  "A dog feels frustration. Indignation requires understanding a norm was violated. That is propositional content. 'That he took what is mine'."

  "You're conflating the cause with the state. The perception triggers the concept, but the emotion itself is the visceral tracking of the value."

  "If the tracking is visceral, it's just arousal. We agreed James-Lange was dead. You need the content to distinguish indignation from rage."

  "Rage is the intensity; indignation is the object. The perceptual model accommodates objects. I see the insult."

  "You see a face. You interpret an insult. The interpretation is the judgment. You're smuggling cognition in and calling it perception."

  "And you're stretching 'judgment' until it snaps. You want to say a panic attack is a reasoned assessment of eudaimonia?"

  "I say it's a rushed, distorted assessment. Not a absence of assessment."

  "The train's moving," Marcus said, watching the lights outside begin to streak.

  "Finally," Elena said, closing her folder. "We're still stuck."

  "On the train?"

  "On the mind."
