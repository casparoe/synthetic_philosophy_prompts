answer: |-
  You are absolutely right to feel that Pasadena is a close cousin of St. Petersburg, and your intuition about bounded utility is mathematically sound. If you impose a bounded utility function, the Pasadena game *does* collapse into a well-behaved, finite expectation, just like St. Petersburg.

  However, your professor is also right: there is a **structural mathematical difference** between the two that makes Pasadena significantly more threatening to standard decision theory than St. Petersburg. The "order of summation" hint is the key to unlocking why philosophers treat this as a deeper crisis.

  Here is the breakdown of why Pasadena is not just "St. Petersburg with extra steps."

  ### 1. Divergence vs. Conditional Convergence
  The core difference lies in the type of series generated by the expected value calculation.

  *   **St. Petersburg:** The series of expected utilities is **divergent**.
      $$ \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty $$
      No matter how you rearrange the terms, this sum goes to positive infinity. In extended real number systems, $\infty$ is a well-defined value. The problem is normative (should I pay \$1 million to play?), not mathematical (the math says the value is $\infty$).

  *   **Pasadena:** The series is **conditionally convergent**.
      The payoffs are usually set up so the expectation looks like the alternating harmonic series:
      $$ \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = \ln(2) $$
      This sums to $\ln(2)$ *if* you sum it in the natural order ($n=1, 2, 3...$). However, because the sum of the *absolute values* of the terms diverges ($\sum |1/n| = \infty$), the **Riemann Rearrangement Theorem** applies.

      **The Riemann Rearrangement Theorem** states that if a series is conditionally convergent, you can rearrange the order of the terms to make the sum equal **any real number**, or make it diverge to $\pm \infty$.

  ### 2. Why "Order of Summation" Matters
  In standard probability theory (Kolmogorov), the expected value is defined via an integral (or a sum) that requires **absolute convergence** to be well-defined and independent of ordering.

  *   In **St. Petersburg**, the "order" doesn't matter. The house is offering you a game with infinite value. You can argue infinite value is irrational, but the math is consistent.
  *   In **Pasadena**, the "order" *creates* the value. But outcomes in a lottery don't come with an inherent "order." The set of outcomes is just $\{O_1, O_2, O_3...\}$. Why should we sum them in index order ($1, 2, 3$) rather than, say, evens then odds?
      *   Sum one way: The game is worth \$0.69.
      *   Sum another way: The game is worth -\$1,000,000.
      *   Sum another way: The game is worth $+\infty$.

  This means the Expected Utility (EU) of the Pasadena game is **undefined**. It's not that the EU is too big (like St. Petersburg); it's that the EU *does not exist* as a unique number. This breaks the fundamental machinery of Expected Utility Theory, which assumes acts map to real numbers (or extended reals).

  ### 3. The Bounded Utility "Fix" and Its Cost
  You asked: *"Why can't we just port that same fix over to Pasadena and call it solved?"*

  You **can**, but that is exactly where the philosophical fight is.
  *   **The Math:** If you assume a bounded utility function (e.g., utility caps at 100), then the Pasadena series becomes **absolutely convergent**. The probabilities ($1/2^n$) decay fast enough to crush the alternating payoffs. The rearrangement problem disappears.
  *   **The Philosophy:** Many decision theorists reject bounded utility. They argue it is plausible that saving $N+1$ lives is always better than saving $N$ lives, with no cap. If you allow **unbounded utility** (which seems rationally permissible), St. Petersburg yields $\infty$ (weird but manageable), but Pasadena yields **undefined** (catastrophic).

  So, Pasadena forces a trilemma that St. Petersburg does not:
  1.  Accept Bounded Utility (restrictive on rational values).
  2.  Reject Expected Utility Theory entirely (radical).
  3.  Accept that some rational gambles have no defined value (counter-intuitive).

  St. Petersburg only forces you to choose between 1 and 2. Pasadena makes option 1 much harder to motivate because the problem isn't "big numbers," it's "mathematical coherence."

  ### 4. The Altadena Variant (The Dominance Problem)
  To make things worse, Hájek and Nover introduced the **Altadena Paradox**.
  *   **Pasadena:** Payoffs $X_n$. EV is undefined.
  *   **Altadena:** Payoffs $X_n + 1$. (You get the Pasadena payoff plus $1 no matter what).

  Intuitively, Altadena **dominates** Pasadena. In every single possible outcome, Altadena pays exactly $1 more. A rational agent *must* prefer Altadena to Pasadena.
  *   But if Pasadena has no defined EV, and Altadena has no defined EV (since adding 1 to a conditionally convergent series doesn't fix the rearrangement issue), standard EU theory cannot represent this preference.
  *   If you try to fix Pasadena by arbitrarily picking an ordering (say, natural order), you might get $EV(P) = \ln(2)$ and $EV(A) = \ln(2) + 1$. But if you pick a *different* ordering, you could make $EV(P) = 100$ and $EV(A) = 5$. This violates the dominance principle depending on how you do your math homework.

  ### Summary
  You aren't missing anything obvious; your math intuition is good. The bounded utility solution *works* mathematically.

  However, the **structural difference** is:
  *   **St. Petersburg** challenges the *normative* link between EV and rational price (Is $\infty$ actionable?).
  *   **Pasadena** challenges the *mathematical* definition of EV itself (Does the number exist?).

  Your professor wants you to see that Pasadena isn't just about "infinite value"; it's about **indeterminacy**. It shows that without bounded utility, Expected Utility Theory cannot even assign a value to the game, let alone a reasonable one. That is why it keeps philosophers up at night more than St. Petersburg does. St. Petersburg says "You should pay infinite dollars." Pasadena says "I cannot tell you what this game is worth."

  **Verdict:** It's not just philosophers making a big deal. The math is genuinely pathologic in a way St. Petersburg isn't. But you are correct that bounded utility dissolves it—the debate is whether we are allowed to use that solvent.
