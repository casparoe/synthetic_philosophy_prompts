      *   *The "Infection" Trap:* Tolstoy distinguishes between the *degree* of infection (quality of art) and the *moral value* of the feeling (good vs. bad art). Social media might be highly infectious, but if the feeling is rage, envy, or shallow dopamine, it is "bad art" in Tolstoy's moral framework.
