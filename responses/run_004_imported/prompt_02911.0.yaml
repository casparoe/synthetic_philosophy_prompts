      *   **Task:** Go through the 5 moves step-by-step, evaluate who has the better argument at *each* step, and identify major blind spots for both.
      *   **Constraint:** The user doesn't know social choice theory, so explain concepts clearly but accurately.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Priya):** IRV is harder to game than Plurality.
      *   **Move 2 (Marcus):** Gibbard-Satterthwaite (G-S) Theorem says *all* non-dictatorial rules with 3+ options are manipulable.
      *   **Move 3 (Priya):** G-S is worst-case; manipulation requires info we don't have (anonymous poll).
      *   **Move 4 (Marcus):** "Burying" strategy works even with uncertainty.
      *   **Move 5 (Priya):** Weighted Lottery is strategy-proof. **Move 5 (Marcus):** Lottery trades manipulation for legitimacy/randomness.

  3.  **Evaluate Each Move (Step-by-Step Analysis):**

      *   **Move 1:** Priya claims IRV is *harder* to game than Plurality.
          *   *Theory:* Plurality is notoriously susceptible to "vote splitting" and strategic voting (voting for the "lesser of two evils"). IRV mitigates vote splitting but introduces its own complexities (monotonicity failures, tactical ranking).
          *   *Verdict:* Priya is practically right, even if theoretically imperfect. IRV *is* generally considered more robust against simple strategic voting than Plurality in real-world scenarios, even if not immune.
          *   *Winner:* Priya (on practical grounds).

      *   **Move 2:** Marcus cites Gibbard-Satterthwaite.
          *   *Theory:* G-S theorem applies to *ordinal* voting systems (rankings) where a single winner is chosen deterministically. It states if there are $\ge 3$ outcomes, any non-dictatorial system is manipulable.
          *   *Accuracy:* Marcus is theoretically correct. This is a fundamental result.
          *   *Nuance:* The theorem assumes voters know others' preferences (or act on probabilities). It doesn't mean manipulation is *easy*, just that it *exists*.
          *   *Winner:* Marcus (on theoretical grounds).

      *   **Move 3:** Priya argues G-S is worst-case and requires information.
          *   *Theory:* This is the "computational complexity" or "informational barrier" counter-argument to G-S. If finding the manipulating vote is NP-hard or requires info you don't have, the theorem is less practically relevant.
          *   *Accuracy:* She is right that G-S is an existence proof, not a practical guide. In anonymous polls, information asymmetry is high.
          *   *Winner:* Priya (on practical grounds).

      *   **Move 4:** Marcus argues "burying" works under uncertainty.
          *   *Theory:* "Burying" (ranking a strong competitor last) is a known strategy in IRV/Condorcet methods. Does it work under uncertainty?
          *   *Accuracy:* It's riskier than Marcus implies. Burying can backfire in IRV (your favorite might get eliminated early if you don't support the compromise enough, or the buried candidate eliminates your favorite). However, in *some* contexts, it helps. But claiming it works "decently even under a lot of uncertainty" is a strong claim. IRV is actually somewhat resistant to burying compared to Condorcet, but not immune.
          *   *Nuance:* Marcus is overstating the reliability of burying in IRV specifically. Burying is more potent in Borda or Condorcet. In IRV, burying a strong rival might help them survive longer to beat you, or eliminate your ally.
          *   *Winner:* Draw/Lean Marcus (Theoretically possible, but he's overstating the ease). Let's call it a "Technical Point for Marcus, Practical Exaggeration." Actually, for the sake of the debate flow, Marcus is right that *some* strategy exists without perfect info, but Priya is right that it's hard. I'll give the edge to Marcus on the *existence* of the strategy, but note the risk.

      *   **Move 5:** Priya suggests Randomized Social Choice (Weighted Lottery). Marcus calls it legitimacy loss.
          *   *Theory:* Gibbard (1977) extended his theorem to show that *only* probabilistic rules (lotteries) can be fully strategy-proof. So Priya is theoretically correct here.
