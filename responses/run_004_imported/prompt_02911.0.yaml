      *(Self-Correction on Move 4)*: Wait, is burying effective in IRV? In IRV, if you rank a strong rival last, they just don't get your vote. If they are strong, they survive anyway. If they are weak, they get eliminated. Burying is more effective in Borda Count. In IRV, the main strategy is "compromising" (ranking a viable second choice first). Marcus might be conflating IRV with Condorcet/Borda. I should point this out. It weakens Marcus's Move 4 slightly.

