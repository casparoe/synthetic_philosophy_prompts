answer: |-
  The pill organizer sits on the tray table, four columns for the days, four rows for the times. Elias moves his left hand toward it, the fingers stiff, the knuckles swollen from a break that never quite set right. He misses the Tuesday morning slot. The pill clatters onto the laminate. He leaves it there.

  He is seventy-two. Statistically, he should have been dead since he was twenty-four.

  He remembers the highway rain. The hydroplane was invisible, a sudden loss of friction, the world spinning in a gray blur. The car had wrapped around the oak tree like foil around a candy. The paramedics said it was a miracle. Elias walked away with a limp that worsened when it rained and a hearing loss in his left ear that turned conversation into a muffled secret. At the time, he felt chosen. He drank a beer in the hospital waiting room while his friends shook their heads, calling him lucky. He believed them. Luck felt like a surplus, an extra portion of life granted to him.

  It took decades to realize luck was actually a tax.

  Ten years later, the balcony railing gave way during a party. He remembered the sudden tilt of the floor, the wood splintering under his palm. He should have fallen thirty feet to the concrete patio. Instead, he had dangled by one hand until someone grabbed his wrist. He survived, but the shoulder never recovered. The nerve damage turned his grip into a claw. That was the night Sarah started looking at him differently. Not with relief, but with a kind of weary calculation. She stayed for five more years, until the accumulation of his repairs became too heavy for her to carry. She left without anger, just a quiet exhaustion, as if she were leaving a house that was slowly sinking into the swamp.

  Elias looks around the living room. It is quiet. Most of his friends are dead. Not in dramatic fashion, but in the standard, quiet way of men his age: heart attacks in sleep, cancers that moved too fast, strokes that didn't miss. He is the only one left from his college cohort. He is the only one left from his first job. He is the only one left from his neighborhood.

  He tries to stand. The wheelchair is locked. He forgets to unlock it sometimes. The effort of rising sends a spike of white pain through his hip—the hip from the fall last winter. He had slipped on ice in the driveway. A simple fall. People break hips and die of complications. Elias broke his hip, survived the surgery, survived the pneumonia that followed, survived the blood clot that lodged in his lung. But he lost the use of his legs for good. He lost the ability to live alone. Now he relies on a caretaker who comes twice a day, a stranger who smells of antiseptic and impatience.

  He wonders, sometimes, if the universe is trying to kill him and failing, or if it is trying to keep him and failing to keep him whole.

  There was the choking incident at fifty-five. Alone in the kitchen. A piece of steak. The airway closed. He remembered the panic, the darkening vision, the collapse onto the linoleum. He woke up three days later in the ICU. They told him he had been clinically dead for minutes. The lack of oxygen took pieces of his short-term memory. He forgot his mother's maiden name. He forgot how to tie a tie. He survived, but the man who woke up was less than the man who fell.

  He used to think about probability. If you flip a coin enough times, eventually you get a string of heads. But this wasn't heads. This was landing on the edge of the coin, over and over, balancing on the rim where no one should be able to stand. In every scenario where he should have vanished, he remained. But in every scenario where he should have remained whole, he was carved away.

  He looks at the pill on the floor. He could reach for it. It would require leaning forward, engaging the core, risking a slide from the chair. If he fell, he might hit his head. If he hit his head, given the blood thinners, he might bleed out.

  He imagines the branch where he dies. It feels peaceful. A clean stop. The pain ends. The silence becomes absolute.

  But he knows, with a cold certainty that sits in his gut like a stone, that he won't take that branch. He has never been allowed the clean exit. The universe seems to prune away the timelines where Elias ceases to observe. It keeps him here, in the narrow corridor where consciousness persists despite the ruin of the vessel.

  He thinks of the others. The ones who died in the car crash. They are gone. They don't feel the ache in the knee. They don't feel the loneliness of the house. They don't feel the terror of realizing that death is not a door, but a filter that only lets the broken pass through.

  A car horn honks outside. A bird lands on the windowsill. The world continues, indifferent to his accumulation of scars.

  Elias leans forward. His fingers brush the laminate. He cannot reach the pill. He strains, the muscles in his shoulder screaming. He slips. The wheelchair tips.

  He hits the floor hard. The impact jars his spine. He lies there on the cool wood, staring at the ceiling fan. He cannot get up. He cannot reach the emergency cord. He waits.

  He feels no fear. He feels only a grim familiarity. He knows what comes next. The ambulance. The hospital. The surgery. The recovery that will leave him weaker, slower, more dependent. He knows he will not die here on the floor. The branches where his heart stops are closed to him. The only path forward is through more pain, through more loss, through another layer of himself stripped away to make room for another day.

  He closes his eyes and listens to the silence of the house. He waits for the sirens. He waits to survive again.
