      *   **The Debate:**
          *   *Side A (Dialetheist/Paraconsistent):* Inspired by Priest & Garfield ("Nagarjuna and the Limits of Thought"). Argues Nagarjuna asserts true contradictions at the limits of thought (e.g., Samsara = Nirvana, Emptiness is empty). Requires paraconsistent logic to avoid explosion.
          *   *Side B (Prasaṅgika/No-Thesis/Therapeutic):* Inspired by the *Vigrahavyāvartanī* ("No thesis" verse). Argues the *catuskoti* is purely dialectical (*prasaṅga*), dismantling opponent's essentialism (*svabhāva*). No positive assertions are made; classical logic holds because no contradictions are actually asserted by Nagarjuna.
      *   **Format:** A dialogue between two knowledgeable interlocutors after a talk.
