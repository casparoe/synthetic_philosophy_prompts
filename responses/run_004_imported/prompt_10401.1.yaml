answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Classical Axiom Policy and Library Architecture

  ### 1. Purpose
  This memo outlines a proposed policy regarding the use of classical axioms (specifically the Law of Excluded Middle and Axiom of Choice) within the core library. Our goal is to resolve the current deadlock between maintaining constructive extractability and supporting standard mathematical practice, ensuring a decision is ready for next week's vote.

  ### 2. Summary of Positions
  We are currently divided between two valid engineering concerns:

  *   **The Constructive Position:** The library's unique value proposition is the Curry-Howard correspondence: proofs are programs. Introducing axioms breaks extraction, producing binaries that crash or contain stubs. Furthermore, axioms are contagious; importing a classical lemma into a dependent type can silently render an otherwise constructive module non-extractable ("poisoning").
  *   **The Classical Position:** For many users, extraction is not the end goal; verification is. Formalizing analysis, topology, or algebra without Excluded Middle (LEM) introduces significant friction (e.g., distinguishing between `!=` and `not (=)`). Proponents argue that since Double-Negation (DN) translation embeds classical logic into intuitionistic logic, the distinction is often merely notational, and banning axioms hinders adoption without gaining real safety.

  ### 3. Technical Assessment: The "Notation" Argument
  We must address the strongest technical argument from the classical side: that DN translation makes the conflict superficial.

  While it is true that DN translation allows us to embed classical *propositions* into a constructive system, it does not preserve *computational content*.
  *   **Truth vs. Witness:** DN translation preserves provability ($\vdash P$), but it does not preserve the ability to extract a witness from an existential proof ($\exists x. P(x)$).
  *   **The Extraction Barrier:** In a dependently typed language, data often depends on proofs. If we prove existence classically, we cannot construct the data dependent on that witness. Therefore, for any module where types depend on values derived from proofs, the distinction is not notation—it is a hard type-theoretic barrier.

  However, the classical side is correct that for pure verification tasks (where no extraction occurs), requiring constructive proofs for classical truths imposes a "tax" that yields no benefit to the end user.

  ### 4. Recommendation: "Constructive Core, Classical Extensions"
  I recommend we adopt a **Walled Garden** architecture. We do not ban classical axioms outright, nor do we allow them in the core. We structurally separate the library into two distinct tiers with strict dependency rules.

  #### A. The Core (`Lib.Core`)
  *   **Policy:** Strictly constructive. No LEM, no Choice, no axioms that block extraction.
  *   **Guarantee:** Any module in this namespace is guaranteed to extract to runnable code.
  *   **Scope:** Logic, data structures, algorithms, and constructive mathematics.
  *   **Rationale:** This preserves the library's unique selling point. Users importing `Lib.Core` know they are safe for extraction.

  #### B. The Classical Extension (`Lib.Classical`)
  *   **Policy:** Classical axioms are permitted but must be explicitly imported.
  *   **Guarantee:** No extraction guarantees. Modules here are for verification only.
  *   **Scope:** Real analysis, topology, and domains where constructive formalization is prohibitively expensive compared to value.
  *   **Rationale:** This acknowledges that for many mathematicians, the "constructive tax" is too high. It allows the library to be useful for standard math formalization without compromising the core.

  #### C. Preventing "Poisoning"
  To address the constructive side's fear of accidental contamination:
  1.  **Dependency Direction:** `Lib.Core` cannot depend on `Lib.Classical`. The reverse is allowed.
  2.  **CI Enforcement:** We will add a CI check that scans imports. If a file marked `@constructive` imports a classical axiom, the build fails.
  3.  **Type Safety:** Where possible, we use the type system (e.g., Universe levels or specific Type Classes) to prevent classical propositions from leaking into constructive data definitions.

  ### 5. Why This Compromise Works
  This approach takes the strongest points of both sides seriously:

  *   **To the Constructive Side:** It guarantees that the "heart" of the library remains computationally meaningful. It eliminates the risk of silent poisoning in the core modules. If a user wants extraction, they stick to `Lib.Core`.
  *   **To the Classical Side:** It acknowledges that DN translation is not a silver bullet for extraction, but agrees that we shouldn't force constructive proofs where extraction isn't needed. It validates that formalizing, say, the Intermediate Value Theorem is legitimate work, even if it requires LEM, provided it lives in the appropriate namespace.

  ### 6. Implementation Plan
  If this policy is adopted:
  1.  **Refactor:** Move existing modules using axioms into `Lib.Classical`.
  2.  **Document:** Clearly label the two tiers in the README and API docs.
  3.  **Tooling:** Implement the import-checking script in the CI pipeline within one month.

  ### 7. Conclusion
  We are building a tool that serves both computer scientists (who care about programs) and mathematicians (who care about truth). A monolithic policy favors one group at the expense of the other. A modular policy treats this as an architectural constraint rather than a philosophical war.

  I move that we adopt the **Constructive Core, Classical Extensions** policy.

  ***

  **Attachments:**
  *   *Draft CI Script for Axiom Detection*
  *   *Proposed Module Hierarchy Diagram*
