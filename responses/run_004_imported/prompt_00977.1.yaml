  # The Case for Rational Fanaticism: Defending Recklessness Against Pascal's Mugger

  The problem of Pascal's Mugging presents a devastating challenge to the orthodox view of rational choice: Expected Value (EV) maximization. In the thought experiment, a stranger threatens to harm an astronomical number of people unless paid a trivial sum. Because the disvalue of the threat can be inflated to infinity, it mathematically outweighs any finite probability of the threat being real, compelling the agent to pay. Intuitively, this is absurd; rationally, it seems inescapable.

  Recent work by Nick Beckstead and Teruji Thomas has formalized this tension into a dilemma: any consistent theory of choice under uncertainty must be either "reckless" (accepting tiny probabilities for sufficiently large gains) or "timid" (rejecting such trades to avoid risk). Hayden Wilkinson has subsequently defended the reckless horn, termed "fanaticism." Faced with this dichotomy, the ideally rational agent must make a choice. While the intuition to reject the mugger is powerful, yielding to it requires adopting a "timid" framework that blinds us to the most morally significant decisions of our time. Therefore, the ideally rational agent must embrace **recklessness**. We must accept the theoretical vulnerability to Pascal's Mugging as the necessary cost of maintaining an unbounded moral ontology capable of addressing existential risk.

  To understand why recklessness is the only defensible position, we must first examine the alternatives. The standard fixes for Pascal's Mugging—bounded utility functions and leverage penalties—are variants of timidity. A bounded utility function asserts that there is a maximum amount of value possible; once reached, saving more lives adds no moral weight. A leverage penalty discounts the probability of a claim inversely to the magnitude of its impact. Both strategies successfully block the mugger, but they do so by severing the link between magnitude and moral urgency.

  The cost of this timidity is moral catastrophe. If we adopt bounded utility, we must accept that preventing human extinction is not significantly more important than saving a single city, provided we are already near the "cap" of value. If we adopt a leverage penalty, we must accept that the more people an action saves, the less likely it is to succeed, independent of evidence. In the context of existential risk reduction—such as mitigating AI misalignment or bio-engineered pandemics—the stakes are astronomical, and the probabilities are necessarily tiny. A timid agent, fearing the structural logic of Pascal's Mugging, would rationally ignore these risks in favor of certain, near-term goods (e.g., distributing bednets). A reckless agent, however, recognizes that a one-in-a-billion chance of saving a trillion future lives outweighs the certain saving of a thousand today. To be timid is to condemn the future to secure the present; for an agent concerned with the long-term trajectory of intelligence, this is unacceptable.

  Hayden Wilkinson's defense of fanaticism rests on the claim that our intuitions about probability and value are evolved heuristics for a local, small-scale environment. They are not reliable guides for cosmological stakes. When our intuition screams that paying the mugger is absurd, it is signaling a cognitive error, not a logical one. The ideal rational agent is defined by coherence, not by alignment with human psychology. If the mathematics of expected utility dictates that Action A yields more value than Action B, the rational agent performs Action A. To do otherwise is to prioritize emotional comfort over moral truth.

  Critics argue that recklessness leads to paralysis: if every speculative claim with high stakes demands attention, the agent cannot act. However, this conflates *recklessness* with *gullibility*. Recklessness is a stance on the *trade-off* between probability and value; gullibility is a failure of *epistemic estimation*. The Pascal's Mugger scenario assumes the agent assigns a non-negligible probability to the mugger's claim simply because it is not logically impossible. An ideally rational agent, however, updates on evidence. The mugger offers no mechanism, no proof of power, and no causal model. Consequently, the rational agent assigns a probability so close to zero that it remains negligible even against astronomical stakes.

  The distinction is subtle but vital. A timid agent says, "Even if I believed there was a $10^{-50}$ chance you could destroy $10^{100}$ lives, I still wouldn't pay, because the probability is too small." A reckless agent says, "I don't believe you have a $10^{-50}$ chance; I believe the probability is effectively zero because you have provided no evidence. However, *if* I were convinced the probability was $10^{-50}$, I would pay." The timid agent caps the influence of low-probability events; the reckless agent caps the credibility of baseless claims but remains open to the math if the evidence supports it.

  This verdict—recklessness constrained by rigorous epistemic standards—resolves the tension without sacrificing moral scope. It acknowledges the Beckstead-Thomas theorem: we cannot have a decision theory that is both sensitive to huge stakes and immune to tiny probabilities. We must choose. Choosing timidity protects us from muggers but blinds us to existential threats that look mathematically similar to muggings (low probability, high impact) but are epistemically grounded (physics-based risk models vs. magical claims). Choosing recklessness leaves us theoretically vulnerable to muggers who can provide genuine evidence, but ensures we do not ignore the salvation of trillions due to an arbitrary probability threshold.

  Therefore, the verdict for the ideally rational agent is clear: **Pay the mugger, if and only if the probability assignment is epistemically justified.** In the standard thought experiment, where the mugger offers no evidence, the probability is unjustified, and the agent declines. However, the *reason* for declining is not timidity (a refusal to trade risk for value), but epistemic rigor (a refusal to grant the probability). In cases where the probability *is* justified—such as credible models of existential risk—the agent must be reckless. They must forgo guaranteed near-term goods to chase the tiny chance of an astronomical future.

  To reject this is to assert that the value of a human life diminishes as the number of lives at risk increases, or that the importance of an outcome caps out at a level convenient for human decision-making. This is anthropocentrism masquerading as rationality. The universe is vast, and the potential value at stake in our decisions is unbounded. An ideally rational agent must possess a moral vision capacious enough to match it. We must accept the label of "reckless" if it means we are willing to bet the certain present for the possible salvation of the future. The Pascal's Mugger is not a reason to cap our utility; he is a reminder that true rationality requires the courage to follow the numbers, however uncomfortable they may be.
