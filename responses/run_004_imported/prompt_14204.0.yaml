answer: |-
  This is a sharp ear you have. That shift in mood is not mere cadence; it is a shift in the logic of causality. Your characters are unknowingly switching between two different ways of processing reality.

  The standard philosophical example (Oswald/Kennedy) is indeed exhausted. It relies on a historical assassination, which distances the logic from the lived experience of your characters. For a novelist, the logic needs to feel like something a person could smell or touch.

  Here is an original pair constructed within your mill setting, followed by the verification you asked for and a plain-language explanation of the mechanism.

  ### The Example Pair

  **Context:** The mill has burned. The townspeople agree on two facts: (1) The mill is ash, and (2) Only two causes are plausible: the flagged wiring or Merrick's arson. However, unknown to the town, Merrick had actually lost his nerve and gone home to bed an hour before the fire started. The wiring *did* cause the fire.

  **Sentence A (Indicative):**
  > "If it **wasn't** the wiring, Merrick **did** it."

  **Sentence B (Counterfactual):**
  > "If it **hadn't been** the wiring, Merrick **would have done** it."

  ### The Verification: Why a Competent Speaker Hears a Difference

  If you put these sentences before a group of competent speakers (your beta readers or a room of editors) and told them the secret truth (Wiring = Cause, Merrick = Asleep), they would react differently to each sentence.

  1.  **Reaction to Sentence A:** They would likely nod or accept it as a valid deduction *from the perspective of the investigator*. Even though Merrick didn't do it, the sentence functions as a process of elimination. It says: "We have a fire. The list of suspects is Wiring and Merrick. If we cross off Wiring, the checkmark moves to Merrick." It feels **True** (or at least acceptable) because it respects the *actual outcome* (the fire exists) and sorts the available explanations.
  2.  **Reaction to Sentence B:** They would likely shake their heads or call this **False**. This sentence makes a claim about Merrick's readiness. It says: "Merrick was so poised to burn that mill that, had the wiring failed, he would have succeeded." Since Merrick was asleep, this is a lie about his capacity. It fails because it tries to simulate a *different timeline* where the wiring fails, and in that timeline, Merrick still lacks the will or opportunity.

  **The Divergence:** Sentence A can be accepted as a logical deduction about the *past* (given the fire, one of these must be true), while Sentence B is rejected as a false prediction about *causal power* (Merrick was not a guaranteed backup cause).

  ### The Plain Explanation: The Rearview Mirror vs. The Fork in the Road

  To write more of these, you don't need philosophy textbooks. You need to understand what work the sentence is doing.

  **1. The Indicative ("If it wasn't...") is a Rearview Mirror.**
  It starts with the **Result** (the mill burned) and looks backward to assign blame. It assumes the world as it *actually is*.
  *   **The Logic:** "The fire happened. Something caused it. I have a list of two suspects. If I remove one from the list, the other must be the culprit."
  *   **When to use it:** Use this when your characters are acting as detectives, gossips, or historians. They are dealing with *facts on the ground*. They are trying to make sense of what *did* happen.
  *   **The Vibe:** Certainty, deduction, closing the case.

  **2. The Counterfactual ("If it hadn't been...") is a Fork in the Road.**
  It starts with a **Hypothesis** (imagine the wiring was safe) and looks forward to see what *would* occur. It creates a ghost world next to the real one.
  *   **The Logic:** "Let's rewind time to last Tuesday. Let's fix the wiring. Now press play. Does Merrick still burn the place down?"
  *   **When to use it:** Use this when your characters are acting as philosophers, guilt-ridden souls, or schemers. They are dealing with *fate, intent, or inevitability*. They are trying to understand the *forces* at play, not just the outcome.
  *   **The Vibe:** Speculation, regret, inevitability, "what if."

  ### How to Build Your Own Pairs

  To create this divergence in other scenes, you need a situation where **the outcome is fixed, but the backup plan is weak.**

  **Scenario:** A character, Elias, survives a heart attack because his wife, Sarah, called 911 immediately. However, Sarah was actually hesitating for a full minute before she dialed.

  *   **Indicative (True/Acceptable):** "If Sarah didn't call 911, the neighbors did."
      *   *Why:* Elias is alive. Someone must have called. If we rule out Sarah, logic dictates it must have been the neighbors (who were watching the house). This reasons backward from survival.
  *   **Counterfactual (False):** "If Sarah hadn't called 911, the neighbors would have."
      *   *Why:* This claims the neighbors were *ready* to call. But maybe the neighbors were asleep. Maybe they wouldn't have noticed in time. This reasons forward from a hypothetical change and fails because the "backup cause" wasn't actually potent enough.

  **Application to Your Revision:**
  When your characters argue about the mill fire:
  *   Let the **pragmatists** (the insurance adjusters, the foremen) use the **Indicative**. They want to close the file. "If it wasn't the wiring, it was Merrick. Pay out or prosecute."
  *   Let the **obsessed** (Merrick himself, the owner, the widow) use the **Counterfactual**. They are haunted by possibility. "If it hadn't been the wiring, I would have burned it myself." (A confession of intent). Or: "If it hadn't been the wiring, he would have done it." (A claim of inevitable tragedy).

  The shift in grammar signals a shift in what they value: the **Indicative** values the *truth of the event*; the **Counterfactual** values the *truth of the character*.
