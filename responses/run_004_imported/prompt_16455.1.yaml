      *   **Format:** A dialogue between two characters.
      *   **Characters:**
          *   *The Holist (Quinean):* Committed to Duhem-Quine, skeptical of formal solutions to underdetermination.
          *   *The Bayesian (Rationalist):* Defends simplicity priors, needs a *genuine* answer to the machine-relativity worry (not just restating invariance).
      *   **Requirement:** Substantive back-and-forth. No talking past each other. Both sides must land strong blows.

  2.  **Character Conception:**
      *   *The Holist (let's call her Elena):* Philosophical, grounded in history of science, wary of formalism masking substantive assumptions. She sees the choice of Turing Machine as just another auxiliary hypothesis.
      *   *The Bayesian (let's call him Marcus):* Technical, precise, believes in convergence and asymptotic behavior, but acknowledges the finite data problem. He needs to argue why the machine choice isn't *arbitrary* in practice, even if it is in theory.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the core conflict. Elena brings up Duhem-Quine. Marcus brings up Solomonoff.
