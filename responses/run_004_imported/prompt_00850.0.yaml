          *   *Resolution:* He might distinguish between *moral weight* (which is equal) and *causal leverage/urgency* (which diminishes with distance/uncertainty).

      *   *Point 3: Humanism vs. Impartiality.*
          *   Ramsey is a humanist ("stars can't think or love"). Value comes from conscious experience.
          *   Longtermism is often utilitarian/impartial (a life is a life, regardless of when).
          *   *Conflict:* Longtermism can lead to "astronomical waste" arguments where we sacrifice present happiness for tiny probability gains in the far future. Ramsey's "Epilogue" emphasizes the *present human-scale business of life*.
          *   *Verdict:* Ramsey might reject the *prioritization* of existential risk if it demands sacrificing current human flourishing, even if he accepts the *math* of the future's size.

      *   *Point 4: Uncertainty and "Weakness of Imagination".*
