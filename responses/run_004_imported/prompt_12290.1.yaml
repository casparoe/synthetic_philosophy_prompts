          *   *Solution:* Aristotle rejects Bivalence for future contingents. They are not *yet* true or false. (Note: There is scholarly debate on whether he rejects Bivalence or just the inference to necessity, but the "standard reading" is the rejection of bivalence/truth-value gaps).
      *   **Part (b): Diodorus Cronus's Master Argument.**
