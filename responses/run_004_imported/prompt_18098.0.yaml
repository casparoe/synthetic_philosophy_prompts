      *   The prompt asks why "not everything is known" is doing the damage.
      *   *Argument:* The Knowability principle ($\Box (p \to \Diamond Kp)$) seems innocuous. It's a modal claim about potential. The Non-Omniscience claim ($\exists p (p \land \neg Kp)$) is a claim about actuality. The paradox shows that the *actual* existence of an unknown truth generates an *impossible* truth (the Fitch conjunction). So the assumption that there *are* unknown truths is what generates the specific contradiction when paired with the universal claim that truths *can* be known.
      *   *Refinement:* It's better to say the paradox shows that **Non-Omniscience implies Unknowability**. If you have an unknown truth, you automatically have an unknowable truth. So if you insist *all* truths are knowable, you cannot have *any* unknown truths. Thus, the assumption of Non-Omniscience is the one that becomes untenable *given* Knowability.

