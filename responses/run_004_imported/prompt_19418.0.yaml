answer: |-
  To argue for your friend's position, we must demonstrate that treating the derogatory force of a slur as **non-at-issue content** (specifically, a Conventional Implicature or CI) offers a more unified, linguistically precise, and socially nuanced account than the Truth-Conditional (Hom-style) approach.

  While your concern—that making "Hans is a Boche" *true* whenever Hans is German seems to capitulate to the bigot's worldview—is morally intuitive, it conflates **truth conditions** with **norms of assertion**. The Truth-Conditional view solves the moral problem by making the sentence false, but it creates severe linguistic anomalies in the process. The Non-At-Issue view, conversely, preserves the linguistic data regarding embedding and reclamation while isolating the bigotry as a violation of conversational norms rather than factual error.

  Here is the strongest case for the Non-At-Issue (CI) view, focusing on projection, reclamation, and the logic of disagreement.

  ### 1. The Projection Data is the "Home Turf" of CIs
  The primary linguistic motivation for the two-tiered view is the projection behavior you described. When a slur appears in the antecedent of a conditional ("If Hans is a Boche, he will be angry"), under negation ("Hans is not a Boche"), or in a question ("Is Hans a Boche?"), the derogatory force persists even though the descriptive content is not asserted.

  *   **The Hom-Style Problem:** On Hom's Combinatorial Externalism, the slur refers to a complex, socially constructed property (e.g., *being German and ought to be oppressed*). When embedded, this complex property becomes part of the truth conditions of the embedded clause. This leads to metaphysical awkwardness. In "If Hans is a Boche...", the speaker is hypothetically supposing Hans instantiates a property that Hom claims is *uninstantiated* (empty). While logic can handle empty terms, it makes the analysis of slur discourse distinct from all other expressive language. It forces us to treat slurs as unique logical operators rather than natural language expressions.
  *   **The CI Advantage:** Conventional Implicatures are defined by their ability to project. Consider the word "damn." In "If that damn dog barks, I'll wake up," the speaker is not asserting the dog is damn, but the negative attitude projects out of the conditional. The CI view treats slurs exactly like other expressives. The descriptive content (German) stays in the scope of the operator (the "if"), but the expressive content (contempt) escapes. This explains the projection data without requiring a special metaphysics of empty properties. It treats slurs as linguistic hybrids, which fits their behavior in natural language better than forcing them into a purely referential box.

  ### 2. Reclamation is an Expressive Shift, Not a Referential One
  Your shared difficulty with reclamation is actually the strongest point *for* the CI view. Reclamation occurs when an in-group member uses a slur (e.g., "Queer," "Nigger") without derogatory intent, often to signal solidarity.

  *   **The Hom-Style Problem:** If the meaning of the slur *is* the complex oppressive property (e.g., *ought to be oppressed*), then when an in-group member uses the word, they cannot be using the same word. They must be referring to a *different* property (e.g., *member of the community*). Hom-style views are forced to say that reclaimed slurs are effectively homonyms or that the social property has magically changed. This fails to explain why outsiders *cannot* use the reclaimed term. If the word simply referred to a neutral property of "group membership + solidarity," an outsider should be able to use it descriptively. But they can't.
  *   **The CI Advantage:** The CI view separates the **referent** (the target group) from the **expressive attitude** (contempt vs. camaraderie).
      1.  **Stable Reference:** The descriptive core remains constant (e.g., *sexual minority*). This explains why the word still identifies the same group during reclamation.
      2.  **Flexible Expression:** The CI content encodes an attitude. For bigots, the convention is *contempt*. For in-group reclaimers, the convention is *solidarity* or *defiance*.
      3.  **The License:** Crucially, CI content is often sensitive to speaker identity. Just as only a priest can conventionally implicate certain things in a sacrament, only an in-group member has the social license to flip the expressive value of the slur.

      On the CI view, reclamation isn't the word becoming a "different, neutral term." It is the same term with the *same descriptive extension*, but with the expressive dimension inverted. This explains why the word remains "dangerous" in the mouths of outsiders (who trigger the default contempt CI) but "empowering" in the mouths of insiders (who trigger the solidarity CI). The Truth-Conditional view cannot easily account for this duality without fracturing the semantics.

  ### 3. Truth vs. Assertibility: Addressing Your Moral Objection
  Your main objection is that if "Hans is a Boche" comes out **true** (because Hans is German), we concede too much to the bigot. You prefer Hom's view because it makes the sentence **false**. However, this conflates *truth* with *appropriateness*.

  *   **The Distinction:** We can maintain that "Hans is a Boche" is *true* (descriptively) but **unassertible** (pragmatically). Uttering the sentence activates the conventional implicature of contempt. By doing so, the speaker violates norms of moral conversation.
  *   **Why this is better:**
      1.  **Reporting Bigotry:** If a historian writes, "The Nazis believed Hans was a Boche," the Truth-Conditional view struggles. If "Boche" refers to an empty property, the Nazis believed a falsehood. But intuitively, they believed a *truth* (Hans was German) coupled with a *hateful attitude*. The CI view captures this: The historian reports the descriptive belief (true) and notes the expressive attitude (hateful) without endorsing it.
      2.  **Disagreement:** If I say, "Hans is not a Boche," am I denying he is German? Or am I denying he *should be called that*? The Truth-Conditional view forces these into one bucket (denying the complex property). The CI view allows for **dual disagreement**. I can agree Hans is German (descriptive) but vehemently deny the appropriateness of the slur (expressive). This matches our actual conversational practice: we often object to slurs not because the ethnicity is wrong, but because the *term* is wrong.
      3.  **Moral Clarity:** Making the sentence "false" suggests the bigot is making a *factual error* about the world. But the bigot's error is not primarily factual (Hans *is* German); it is moral. The CI view locates the error exactly where it belongs: in the expressive commitment, not the truth conditions. It allows us to say, "You are speaking truly, but you ought not to speak that way." This is a stronger moral condemnation than "You are speaking falsely," which implies that if the oppressive property *did* exist, the slur would be fine.

  ### 4. The "Empty Property" Trap
  Finally, consider the metaphysical cost of Hom's view. It requires us to accept that slurs refer to socially constructed properties that are "uninstantiated." This creates a gap between the slur and the neutral counterpart that is hard to sustain.

  If "Boche" and "German" have different truth conditions, then "All Boches are German" should be analytically true but not vice versa. But in practice, the link feels tighter. The CI view preserves the intuition that the slur *is* a way of talking about the group, just a poisoned way. By building the poison into the truth conditions, Hom's view risks sanitizing the descriptive content too much. It suggests that if we could just fix the social property, the slur would be usable. The CI view suggests the problem is inherent to the *convention of use* itself, independent of the truth of the matter.

  ### Conclusion
  Your friend's position is superior because it treats slurs as they function in natural language: as **referential-expressive hybrids**.

  1.  **Projection:** It explains why offensiveness survives embedding without metaphysical gymnastics (it's a CI, not a truth condition).
  2.  **Reclamation:** It explains how the word can keep its reference while flipping its attitude (expressive content is context-sensitive; reference is not).
  3.  **Moral Force:** It locates the harm of the slur in the **act of assertion** (violating norms of respect) rather than in the **proposition expressed**.

  To concede that "Hans is a Boche" is *true* is not to concede that the bigotry is valid. It is to acknowledge that the bigot has correctly identified the target but has weaponized the language to attack them. The Truth-Conditional view tries to disarm the weapon by saying it doesn't exist; the Non-At-Issue view disarms it by showing how it works, allowing us to dismantle the mechanism of hate without denying the reality of the people it targets.
