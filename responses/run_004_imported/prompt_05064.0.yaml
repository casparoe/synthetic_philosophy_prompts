      *   *Okay, ready to write.*

  10. **Final Count Check:** 8 Questions + Follow-ups. All constraints met. Let's assemble.

  *(Self-Correction during drafting)*: Make sure the follow-ups aren't just "What about X?" but specifically anticipate her Molinist defense. For example, on the Grounding Objection, Molinists often say "Truths don't need causal grounds." I need to push on *ontological* grounds.

  Let's finalize the list.
