answer: |-
  Here are nine interview questions designed to navigate the units-of-selection debate, sequenced to move from concrete biological parameters to deeper philosophical and empirical challenges.

  **1. The Rationalist Context**
  "Many in my audience know this debate through Eliezer Yudkowsky's essay on the 'Tragedy of Group Selectionism,' which treats the history of group selection as a cautionary tale about scientists falling for seductive but empty metaphors. As an evolutionary biologist working in the lineage of Sober and Wilson, do you view that narrative as a fair characterization of the *old* group selectionism that was rightly discarded, or does it unfairly tar the modern Multilevel Selection (MLS) framework you defend with the sins of its predecessors?"

  *   **Follow-up:** "If you say it's a different framework entirely, at what point in the history of the idea does the 'tragedy' end and legitimate science begin? Is there a specific paper or mathematical development that marks the line?"

  **2. The Haystack Model Parameters**
  "Let's get concrete about the conditions required for group selection to operate. Maynard Smith's haystack model is often cited by critics to show that for group selection to overcome individual selection, you need extreme assortment and near-zero migration—conditions that seem rare in nature. When you look at empirical data on population structure, how much migration is 'too much' for your models to hold, and do we actually see natural populations that stay within that narrow parameter space long enough for adaptation to occur?"

  *   **Follow-up:** "If the answer is that migration rates are often higher than the ideal models assume, does that reduce group selection to a minor perturbation on gene-level dynamics, or do you argue it remains the dominant causal force even with significant gene flow?"

  **3. The Equivalence Charge (West, Griffin, & Gardner)**
  "Critics like West, Griffin, and Gardner argue in their 'social semantics' papers that MLS and Kin Selection are algebraically interchangeable; they claim you can rewrite any group-selection model term-for-term as a kin-selection model with identical predictions. You've argued they are 'explanatorily' distinct. But if the math is identical, what observation—even in principle—could favor one causal story over the other? If I can predict the exact same allele frequency change using either formalism, what empirical work is the 'group' concept actually doing?"

  *   **Follow-up:** "If your answer is that it helps us design interventions or visualize the problem, does that make MLS a psychological heuristic for humans rather than a description of causal structure in nature?"

  **4. Superorganisms and Formal Adaptation**
  "Proponents of MLS often refer to eusocial colonies as 'superorganisms.' However, formalists like Grafen and Gardner have developed specific adaptation tests to determine if a collective truly qualifies as a unit of adaptation, rather than just a collection of individuals. When you apply Grafen's formal test to ant or termite colonies, do they pass as a genuine unit of selection, or does the 'superorganism' label borrow more credibility from the metaphor than the underlying math supports?"

  *   **Follow-up:** "If they fail the formal test because the queen still retains ultimate reproductive control, are we not just describing extreme kin selection with a more evocative noun?"

  **5. The NTW Rebuttal**
  "In 2010, Nowak, Tarnita, and Wilson published their challenge to the generality of inclusive fitness theory, which provoked a roughly 140-signature rebuttal from the broader evolutionary biology community. That is an overwhelming consensus against your position. How do you square your defense of that paper with the fact that the vast majority of your peers signed a letter stating the arguments were misleading and the critique of inclusive fitness was unfounded?"

  *   **Follow-up:** "Science isn't a democracy, but if the specific mathematical errors alleged in that rebuttal haven't been satisfactorily resolved to the community's liking, does that not undermine the foundation of the alternative framework you're proposing?"

  **6. Explanatory vs. Predictive Power**
  "Returning to the idea of 'explanatory interchangeability': In physics, if two theories are mathematically equivalent, we usually consider them the same theory expressed in different coordinates. Why should biology be different? If MLS doesn't yield unique predictions that Kin Selection cannot, are we not just debating a preference in accounting methods rather than a disagreement about how the world works?"

  *   **Follow-up:** "If it is just an accounting preference, why does the choice of accounting matter enough to warrant a separate research program, rather than just being a footnote on how to visualize Hamilton's Rule?"

  **7. Human Evolution and Cultural Group Selection**
  "MLS finds perhaps its strongest intuitive foothold in human evolution, where cultural norms can enforce group-beneficial behaviors. But critics argue that once you model the transmission of culture, you often find that individual-level biases in learning or prestige biases explain the data without invoking group-level fitness. Is there a case of human cultural evolution where MLS is the *only* viable explanation, or does it just offer a more convenient narrative for phenomena that gene-culture coevolution models also handle?"

  *   **Follow-up:** "If gene-culture coevolution models can handle it without treating the group as a selector, does adding 'group selection' as a distinct mechanism violate parsimony?"

  **8. The Generality of Inclusive Fitness**
  "A core pillar of the Nowak-Tarnita-Wilson argument was that inclusive fitness theory relies on weak selection and additive gene actions, limiting its generality. Recent work suggests inclusive fitness can be generalized beyond those constraints. If inclusive fitness theory turns out to be as general as its proponents claim, does your defense of MLS collapse into a claim about style rather than substance, or is there a remaining theoretical niche that inclusive fitness fundamentally cannot occupy?"

  *   **Follow-up:** "If that niche shrinks to zero as the math of inclusive fitness is generalized, would you concede that MLS is simply a special case of a broader theory rather than a competing paradigm?"

  **9. Falsification and Concession**
  "Finally, I want to ask about the conditions under which you would abandon your position. What specific empirical finding or theoretical demonstration would be enough to make you concede that multilevel selection is not a distinct causal process, and that gene-level selection (via kin selection) is doing all the causal work? Is there a world state that is impossible under MLS but possible under strict gene-selectionism?"

  *   **Follow-up:** "If your answer is that such a world state doesn't exist because the theories are mathematically equivalent, does that not validate the critics' claim that the debate is purely semantic?"
