      *   *Q3: Haystack Model (Required).* This is about parameter space. How much migration is too much? This tests the *plausibility* of her view in nature.
      *   *Q4: Explanatory Power.* If math is same, what does "explanation" buy us? Is it just psychology?
      *   *Q5: NTW Rebuttal (Required).* The 140 signatures. How does she handle the consensus against her side?
      *   *Q6: Superorganisms (Required).* Grafen's formal adaptation test. Do ants pass it as a *unit* or just as a collection of genes?
      *   *Q7: Human Evolution.* MLS is often used for humans (culture). Does this stretch the theory?
      *   *Q8: Inclusive Fitness Theory (IFT) Generality.* Nowak et al. claimed IFT is limited. Is it actually?
      *   *Q9: Falsification (Required).* What changes her mind?

      *Refining the Sequence:*
      1.  Start with the "Tragedy of Group Selectionism" context (Rationalist angle).
