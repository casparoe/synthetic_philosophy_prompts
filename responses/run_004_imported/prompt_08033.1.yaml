      8.  Inclusive Fitness limitations (Theoretical core).
      9.  Falsification (Closing).

      *Wait, I need to make sure the "progressively harder" constraint is met.*
      The equivalence question is actually quite hard philosophically. Maybe start with Haystack (concrete), then Equivalence, then Superorganism, then NTW rebuttal, then Falsification.
      Let's re-order for flow:
      1.  Context (Yudkowsky/Rationalist).
      2.  Haystack (Concrete parameters).
      3.  Equivalence (The core philosophical/math clash).
      4.  Superorganism (Specific application of equivalence).
