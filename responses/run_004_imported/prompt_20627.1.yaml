answer: |-
  **MEMORANDUM**

  **TO:** Judge Amira Alaoui
  **FROM:** Elena Ross, Law Clerk
  **DATE:** October 14, 2023
  **RE:** *Estate of Vane v. Kroll* — Conference Vote Tally and Procedural Threshold

  **QUESTION PRESENTED**

  Whether the panel should determine the disposition of this appeal by aggregating the judges' votes on the ultimate outcome (Affirm/Reverse) or by aggregating the judges' findings on the discrete elements of the undue influence test.

  **RECOMMENDATION**

  I recommend the panel proceed by **aggregating the outcome votes**. Under this procedure, the codicil is upheld (2–1). While aggregating by issue would logically compel voiding the codicil, adopting that method would require judges to join factual findings they explicitly rejected. I advise issuing an opinion that affirms the probate court's decision, explicitly grounding the panel's methodology in the principle that appellate judges vote on judgments, not premises.

  **BACKGROUND: THE VOTE SPLIT**

  As you know, the undue influence test requires two prongs to be met for a codicil to be voided: (1) improper pressure exerted by a trusted party, and (2) the testator's capacity to resist being overborne.

  At conference, the votes broke down as follows:

  *   **You (Alaoui):** Found Pressure (Yes) + Capacity Overborne (No) $\rightarrow$ **Uphold Codicil**
  *   **Judge Berger:** Found Pressure (No) + Capacity Overborne (Yes) $\rightarrow$ **Uphold Codicil**
  *   **Judge Calloway:** Found Pressure (Yes) + Capacity Overborne (Yes) $\rightarrow$ **Void Codicil**

  **The Conflict:**
  *   **By Outcome:** Two judges vote to Uphold. The Codicil stands.
  *   **By Issue:** A majority finds Pressure existed (You + Calloway). A majority finds Capacity was overborne (Berger + Calloway). If we combine these majority findings, the test is met. The Codicil falls.

  This creates a situation where the panel's collective reasoning contradicts its collective judgment. I recognize this tension from legal theory coursework—sometimes called the "doctrinal paradox"—but I have not found a binding state precedent that mandates issue aggregation over outcome aggregation.

  **ANALYSIS**

  **1. The Case for Outcome Aggregation (Recommended)**
  The primary argument for counting bottom-line votes is judicial integrity. Each member of this panel is sworn to apply the law to the facts as *they* find them.

  Judge Berger, for instance, is convinced the favored grandchild did *not* exert improper pressure. If we adopt issue aggregation, Judge Berger would be required to sign an opinion stating as a holding of this court that "improper pressure was exerted." This forces a judge to endorse a factual conclusion they believe is false. Over time, this erodes the legitimacy of our opinions. If we cannot stand behind the factual premises of our own rulings, the precedential value of those rulings diminishes.

  Furthermore, outcome aggregation respects the holistic nature of judicial decision-making. A judge's vote to "Uphold" is not merely a mathematical sum of prongs; it is a qualitative judgment that, all things considered, the probate court did not err. By voting on the judgment, we preserve the independence of each judge's application of the law to the specific equities of the case—here, the specific dynamics of the Vane family.

  **2. The Case for Issue Aggregation (The Counter-Argument)**
  I must note that the argument for issue aggregation is logically robust and should be addressed in any dissent or concurrence. Judge Calloway will likely argue that the *law* is the standard, not the judges' individual preferences.

  The undue influence test is a rule enacted to protect testators. It states: *If A and B are true, then Result C follows.* In this case, the "Court" (as a collective institution) has found A to be true (by a 2–1 majority) and B to be true (by a 2–1 majority). To ignore this is to allow the procedural mechanism of voting to defeat the substantive protection of the rule.

  If we choose outcome aggregation, we risk establishing that a litigant can lose even when a majority of the court agrees they were wronged. In *Vane*, a majority agrees the grandchild pressured the widow, and a majority agrees the widow was too frail to resist it. To uphold the codicil despite these findings suggests that the test is hollow—that a widow can be pressured and overborne, yet still lose her estate plan if that pressure and frailty are not found by the *same* single judge. This creates a "gap" in the doctrine where undue influence can exist without a remedy.

  **PRECEDENTIAL IMPLICATIONS**

  This choice will function as unstated precedent for how this court handles multi-prong tests in the future (e.g., summary judgment standards, criminal intent elements, or contract breach analyses).

  *   **If we choose Outcome Aggregation:** We commit to a system where a party can prevail even if a majority of the court finds against them on every individual element of their claim, provided those findings are split across different judges. This prioritizes finality and judicial independence over doctrinal consistency.
  *   **If we choose Issue Aggregation:** We commit to a system where the "law of the case" is derived from the intersection of majority findings, even if no single judge supports the final result. This prioritizes logical consistency but risks forcing judges to join opinions containing factual findings they dispute.

  **APPLICATION TO *VANE***

  In this specific context, the stakes involve the testamentary freedom of a deceased widow and the expectations of her grandchildren.

  If we uphold the codicil (Outcome Aggregation), we respect the probate court's original deference to the document, but we leave the record stating that the widow was "overborne" (per Berger) and "pressured" (per Alaoui), yet the gift stands. This may be difficult for the excluded grandchildren to accept, as it validates their suspicion of influence without granting relief.

  However, if we void the codicil (Issue Aggregation), we grant relief based on a hybrid reasoning that no single judge fully endorsed. Judge Berger would be reversing the probate court based partly on a finding of "pressure" he explicitly rejected. This makes the reversal vulnerable to future criticism that it lacks a coherent factual basis.

  **CONCLUSION**

  While the logical pull of issue aggregation is strong, the institutional cost is higher. I recommend we affirm the probate court's decision based on the outcome vote. This allows each judge to stand by their own findings: you and Judge Berger can write separately to explain why, despite the other's concerns, the codicil survives.

  This approach preserves the integrity of the individual opinions that will comprise the final judgment. It acknowledges that while the *math* suggests voiding the codicil, the *law* requires a majority to agree on the *result*, not just the components of the test.

  Please let me know if you would like me to draft a concurrence for you that explicitly addresses this voting methodology to guide future panels, or if you prefer to leave the procedural choice implicit in the majority opinion.
