prompt: |-
  I'm several chapters into a novel that follows a law clerk on a three-judge state court of appeals, and I've reached a scene I'd rather build on something structurally sound than fudge for the sake of drama. The panel is reviewing a probate court's decision to admit a codicil in which an elderly widow, only weeks before her death, rewrote her will to leave the family's summer house to just one of her three grandchildren, cutting the other two out entirely. Under the doctrine the panel applies, such a codicil is void for undue influence only if two conditions both hold: first, that the favored grandchild occupied a position of trust over the widow and used it to press her toward the change, and second, that her own capacity to resist that pressure was actually overborne, rather than her acting from ordinary affection, grief, or stubbornness. At conference, the three judges reach these individual findings. Judge Alaoui is convinced pressure was exerted but thinks the widow's will remained her own, and so votes to uphold the codicil. Judge Berger finds no improper pressure at all, but is convinced the widow was by then too frail and confused to resist anything, and also votes to uphold. Judge Calloway finds both pressure and an overborne will, and votes to void it. My clerk-protagonist, tallying this for the presiding judge, notices something unsettling: taken question by question, a majority finds pressure was exerted (Alaoui and Calloway), and a separate majority finds the widow's resistance was overborne (Berger and Calloway) — results that together point toward voiding the codicil — even though a plain headcount of the three judges' own bottom-line votes gives two for upholding it and only one for voiding it. She has a nagging sense that this split between deciding issue-by-issue and deciding by outcome has a name somewhere in the legal or social-choice literature, but can't place it precisely, and I'd rather the memo earn its conclusion on the merits than lean on a citation she wouldn't really have on hand.

  Could you write the memo she ends up producing for the presiding judge? I want something a real judge could act on before the panel finalizes its opinion: a clear recommendation, stated near the top, about how the case should come out and which of the two procedures — deciding the two questions separately and combining the results, or simply polling the judges' own bottom-line votes — the panel should use to get there. It should include the reasoning a judge would need in hand before signing an opinion built on it, and, since this is the kind of choice that will function as an unstated precedent for how the court handles split votes on multi-part legal tests generally, it should say plainly what that choice commits the court to going forward. I'd also like it to take seriously, rather than wave off, the strongest case a thoughtful judge could make for whichever procedure the memo ends up not recommending — the scene won't work dramatically if that side reads as an obvious loser. Please keep the whole thing tied to this case's specific facts rather than letting it drift into a general essay on voting procedures.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A novel scene involving a law clerk at a three-judge state court of appeals.
      *   **Case:** Probate appeal regarding a codicil leaving a summer house to one grandchild, cutting out two others.
      *   **Legal Standard:** Undue influence requires *two* elements: (1) Position of trust/pressure exerted, AND (2) Capacity to resist overborne (not just affection/grief). Both must hold to void the codicil.
      *   **The Voting Paradox:**
          *   Judge Alaoui: Pressure (Yes) + Overborne (No) = Uphold.
          *   Judge Berger: Pressure (No) + Overborne (Yes) = Uphold.
          *   Judge Calloway: Pressure (Yes) + Overborne (Yes) = Void.
          *   *Outcome Vote:* 2 Uphold (Alaoui, Berger) vs. 1 Void (Calloway).
          *   *Issue Vote:* 2 Pressure (Alaoui, Calloway) vs. 1 No; 2 Overborne (Berger, Calloway) vs. 1 No.
          *   *Result:* If you aggregate by issue, the test is met (Void). If you aggregate by outcome, the test is not met (Uphold). This is a classic "Doctrinal Paradox" or "Discursive Dilemma."
      *   **Task:** Write the clerk's memo to the presiding judge.
      *   **Requirements:**
          *   Clear recommendation at the top.
          *   Reasoning a judge can use to sign an opinion.
          *   Address the precedent-setting nature (procedure for multi-part tests).
          *   Seriously engage with the counter-argument (don't strawman the losing side).
          *   Keep it tied to specific facts (no abstract essays).
          *   Tone: Professional, legal, insightful but practical (clerk to judge).

  2.  **Determine the Recommendation:**
      *   Which way should the court go?
      *   *Option A (Outcome-based):* Respects judicial independence. Each judge applies the law to the facts as they see them. If 2 say "Uphold," that's the judgment. This is the traditional common law approach.
      *   *Option B (Issue-based):* Respects the logic of the rule. The rule says "If A & B, then Result." If the majority agrees on A and the majority agrees on B, logic dictates the Result. This ensures consistency in the law's application.
      *   *Decision:* For a state appellate court, stability and adherence to the *rule* are usually paramount. However, the "Doctrinal Paradox" literature often suggests outcome-based voting is safer for judicial legitimacy because it respects the integrity of each judge's holistic judgment.
      *   *Narrative Choice:* To make the scene interesting, the clerk should probably recommend the *Outcome-Based* approach (Uphold the codicil). Why? Because it highlights the tension. The "logical" result (Void) feels more dramatic/just (protecting the widow), but the "procedural" result (Uphold) protects the court's structure. It forces the judge to choose between "justice in this case" vs. "rule of law stability."
      *   *Wait, reconsider:* If the clerk recommends Voiding (Issue-based), it shows boldness. If she recommends Upholding (Outcome-based), it shows restraint. Given the prompt asks for something "structurally sound," the Outcome-Based approach is generally the accepted norm in US courts (judges vote on judgments, not premises). I will recommend **Upholding the Codicil (Outcome-Based)** but acknowledge the strength of the Issue-Based argument. This creates the "unsettling" feeling the prompt describes—the law allows a result that seems logically inconsistent.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Re).
      *   **Question Presented:** Frame the specific procedural conflict.
      *   **Recommendation:** Bold and clear at the start.
      *   **Background:** Briefly recap the voting split (Alaoui, Berger, Calloway).
      *   **Analysis (The Core):**
          *   Explain the paradox (without necessarily naming it "Doctrinal Paradox" if the clerk is unsure, but describing it accurately).
          *   Argument for Outcome-Based (The Recommendation): Judicial independence, finality, the nature of a "judgment."
          *   Argument for Issue-Based (The Counter): Logical consistency, fidelity to the statutory/test elements.
          *   Precedential Impact: What does this mean for future cases?
      *   **Application to Facts:** Tie it back to the widow and the grandchildren.
      *   **Conclusion:** Reiterate the path forward.

  4.  **Refining the Voice:**
      *   Needs to sound like a smart law clerk. Precise, respectful, slightly tentative but firm on the analysis.
      *   Avoid overly academic jargon (like "Condorcet's Paradox") unless the clerk is showing off, but the prompt says she "can't place it precisely." So, describe the *phenomenon* rather than citing the *theory*.
      *   Ensure the counter-argument (Issue-Based) is strong. It *is* logically superior. The memo must admit that.

  5.  **Drafting - Specific Challenges:**
      *   *The "Name":* The prompt says she can't place the name. I should avoid dropping "Doctrinal Paradox" explicitly, or have her mention it as a vague recollection ("reminds me of a law review article..."). Better to describe it functionally.
      *   *The Precedent:* The memo needs to explicitly state: "If we do X, we are saying that in all future two-prong tests, we vote this way."
      *   *The Facts:* Keep mentioning the summer house, the widow's frailty, the specific judges' findings.

  6.  **Review against Constraints:**
      *   Clear recommendation at top? Yes.
      *   Reasoning for the opinion? Yes.
      *   Precedential warning? Yes.
      *   Strong counter-argument? Yes.
      *   Tied to facts? Yes.

  7.  **Final Polish:** Check the tone. Is it too dry? Too academic? Make sure it feels like an internal document meant to guide a decision, not a published opinion. (Self-Correction: Ensure the distinction between "judgment" and "reasoning" is clear.)

