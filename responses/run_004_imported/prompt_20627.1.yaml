  *Wait, one nuance:* If Alaoui is the presiding judge, she already voted. The memo is to help her write the opinion or manage the conference fallout.
  *Actually, usually the memo goes to the judge assigned to write the opinion.* If the outcome is Uphold, and Alaoui and Berger voted Uphold, one of them writes. If Alaoui is Presiding, she might assign it to herself or Berger. Let's address it to the Presiding Judge (Alaoui) to guide the conference resolution.

  *Key Legal Point:* In federal courts and most state courts, judges vote on the *disposition* (affirm/reverse), not the *premises*. This is the "outcome rule." The memo should advocate for this established norm while acknowledging the logical pull of the alternative.

  *Let's refine the Counter-Argument:* The argument for Issue Aggregation is that the *law* is the standard, not the judges' whims. If the law says "A+B=Void," and the court as an institution finds A and finds B, the institution should declare Void. Ignoring that makes the test meaningless. This needs to be articulated well.

  *Let's refine the Recommendation:* Recommend Outcome Aggregation. Why? Because it prevents a judge from being forced into a result they fundamentally disagree with based on another judge's reasoning. (e.g., Berger thinks there was NO pressure. It violates his conscience to sign an opinion saying there WAS pressure, even if he thinks the widow was frail). This is the "integrity of judgment" argument.

