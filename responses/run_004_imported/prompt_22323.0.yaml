          *   Leibniz fits well: LLMs are vast matrices of weights (parts pushing parts). No matter how big, it's still just structure.
      *   *Difference:* Searle is about *intentionality* (aboutness). Leibniz is about *phenomenology* (what it's like).
      *   *Which bites harder?* Leibniz might be more fundamental for "feeling." Searle is better for "understanding meaning." For LLMs, both apply, but Leibniz highlights the *substrate* issue (silicon/math vs. experience) more viscerally than the symbol manipulation argument.

