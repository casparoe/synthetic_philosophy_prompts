answer: |-
  You have stumbled upon one of the most famous problems in modern philosophy and psychology. What you are describing is almost a textbook example of a phenomenon known as **The Knobe Effect** (or the **Side-Effect Effect**).

  In 2003, a philosopher named Joshua Knobe published a study that presented people with scenarios nearly identical to the ones you just described. He found that people's judgment of whether an action was done "intentionally" depends heavily on whether the side effect is morally good or morally bad.

  Here is the breakdown of why your club reacted this way, whether it is "fair," and how you can think about it as secretary.

  ### 1. The Phenomenon: The Knobe Effect
  In Knobe's original experiment, participants were told about a CEO who starts a new program to increase profits.
  *   **Harm Condition:** The CEO is told the program will *harm* the environment. He says, "I don't care about the environment, I just want to make profits." The environment is harmed.
      *   *Result:* Most people say the CEO **intentionally** harmed the environment.
  *   **Help Condition:** The CEO is told the program will *help* the environment. He says, "I don't care about the environment, I just want to make profits." The environment is helped.
      *   *Result:* Most people say the CEO did **not intentionally** help the environment; it was just a side effect.

  Logically, the mental state of the CEO is identical in both cases (indifference to the side effect, focus on the main goal). Yet, people attribute intentionality to the bad outcome but not the good one.

  Your club is doing the exact same thing.
  *   **This Year (Harm):** The president harmed a community tradition (outreach). The club attributes **intent** ("She killed it on purpose") to justify blame.
  *   **Last Year (Help):** The president provided a morale benefit (shirts). The club attributes **luck** ("Nice coincidence") because there is no drive to assign credit for something they didn't expect.

  ### 2. Is There a Principled Difference?
  You asked if there is a real difference or if it's just outcome bias. The answer is a mix of both, but mostly the latter.

  **From a strict logical standpoint:**
  There is **no difference** in intentionality. Both presidents foresaw the consequence, both explicitly stated indifference to that consequence, and both proceeded based on their primary goal. If "on purpose" means "the primary goal," then neither did the side effect on purpose. If "on purpose" means "foreseen and accepted," then *both* did it on purpose. The club is being logically inconsistent.

  **From a moral/social standpoint:**
  There is a **functional difference** in how we hold leaders accountable. Human beings use the concept of "intentionality" not just to describe mechanics, but to assign praise and blame.
  *   **Blame requires intent:** To morally condemn the current president for cancelling outreach, the club needs to establish that she *chose* that harm. If they admit it was just an "unintentional side effect," it feels like she gets off the hook too easily. Calling it "on purpose" ensures she bears the weight of the decision.
  *   **Praise does not require intent:** We are happy to receive the T-shirts regardless of whether the president meant to get them. Attributing it to "coincidence" doesn't hurt anyone. We don't feel a strong urge to credit the past president for the shirts if he said he didn't care about them.

  ### 3. Nuance in Your Specific Case
  While the Knobe Effect explains the bulk of this, there are two small contextual differences in your story that amplify the reaction:

  **1. Loss Aversion and Tradition**
  *   **Outreach:** This was an existing tradition ("every spring"). Cancelling it is a **loss**. Psychologically, losses loom larger than gains. Taking something away feels like an active attack.
  *   **T-shirts:** These were a request ("asking for all season"), but not a guaranteed tradition. Getting them was a **gain**.
  *   *Effect:* It is much easier to view a loss as "intentional harm" than a gain as "intentional benefit."

  **2. The Nature of the Trade-off**
  *   **This Year:** The money was *spent* on the drivetrain, which *prevented* the outreach. The outreach was a direct cost.
  *   **Last Year:** The money was *spent* on the display, which *allowed* for the shirts (residual budget). The shirts were a surplus.
  *   *Effect:* While both are side effects, the outreach was a *necessary sacrifice*, whereas the shirts were a *lucky remainder*. It feels more "intentional" to sacrifice something than to leave something over.

  ### 4. Conclusion: Is it Unfair?
  **Yes, it is technically unfair.** Your club is letting their moral judgment of the outcome dictate their factual assessment of the president's intent. They are rewriting history to make the current president seem more villainous and the past president more modest.

  **However, it is socially understandable.**
  The current president violated a norm. Robotics clubs usually pride themselves on "Gracious Professionalism" and community outreach. By saying "I don't care about the outreach thing," she signaled that she valued winning over community service. The club is reacting to that value violation. Labeling it "on purpose" is their way of saying, *"You knew this would happen, you had the power to stop it, and you didn't. That makes it your fault."*

  ### Advice for Your Notes
  As secretary, you are in a unique position to document this accurately without fueling the fire.
  1.  **Record the Quote:** You already did this. Keep recording exact quotes like "I don't care about the outreach thing." That is the objective truth.
  2.  **Record the Vote/Decision:** Document that the budget was allocated to X, resulting in Y being unfunded.
  3.  **Avoid Mind-Reading:** In your minutes, avoid writing "President intentionally cut outreach." Instead, write "President prioritized drivetrain over outreach, noting that outreach was not a priority for this season."

  You and your friend are right to feel that the asymmetry is off. It is a quirk of human psychology that we judge the *morality* of an action before we judge the *intent* behind it. You haven't just noticed club drama; you've noticed how human moral reasoning works.
