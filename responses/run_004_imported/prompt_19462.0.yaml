answer: |-
  This is a formidable prompt that cuts to the heart of a tension still unresolved in evolutionary biology: the friction between the deductive certainty of population genetics and the historical contingency of paleontology and morphology. Your intuition is correct—Fisher is indeed the ur-adaptationist, but labeling him "Panglossian" misses the specific *texture* of his adaptationism. Fisher did not believe traits were optimal because nature was benevolent; he believed they were optimal because the mathematics of large populations made it statistically improbable for anything else to persist.

  Here is a reconstruction of how R.A. Fisher, circa 1979 (had he lived to age 89), might have engaged with Gould and Lewontin's "Spandrels."

  ### 1. On "Just-So Stories" vs. Mathematical Theorems
  Fisher would likely seize upon the distinction between *narrative* adaptationism and *mathematical* adaptationism with considerable relish. One of Fisher's enduring frustrations with the biological community was its reliance on verbal argumentation over statistical rigor. He viewed *The Genetical Theory of Natural Selection* not as a collection of hypotheses to be tested by natural history, but as a deductive framework analogous to thermodynamics.

  If confronted with the charge of telling "just-so stories," Fisher would likely argue that Gould and Lewontin were conflating the sloppy verbal adaptationism of the naturalist tradition (which Fisher often disparaged) with his own quantitative program. Fisher's adaptationism was not based on imagining a use for every trait; it was based on the **Fundamental Theorem of Natural Selection**, which posits that the rate of increase in fitness of any organism at any time is equal to its genetic variance in fitness at that time.

  **The Reconstruction:**
  Fisher would likely concede that *many* biologists tell untested stories. He might even agree that a purely narrative account of why a specific trait exists is scientifically vacuous without statistical backing. However, he would vehemently deny that this applies to his work. To Fisher, a "story" implies contingency; a "theorem" implies necessity. He would argue that if the mathematics demonstrates that selection *can* drive a frequency change in a population of size $N$ with selection coefficient $s$, then invoking non-adaptive explanations is not merely unnecessary—it is mathematically redundant.

  He might write something to the effect of: *"The authors of San Marco mistake the map for the territory. They critique the storyteller, but I am the surveyor. Where I have demonstrated that the variance in fitness accounts for the change in gene frequency, there is no room for a 'story.' Where the variance is zero, the trait is neutral, a fact my equations accommodate as readily as theirs."*

  **Speculative Flag:** It is historically underdetermined whether Fisher would have accepted Gould's broader epistemological point that *all* adaptationist explanations (even mathematical ones) rely on auxiliary assumptions about heritability and environment that are often unverified. Fisher tended to treat these parameters as knowable or estimable; Gould treated them as often historically inaccessible.

  ### 2. Reabsorbing Byproducts into the Selection Matrix
  This is perhaps the most critical theoretical friction point. Gould and Lewontin wanted to elevate "byproducts" (spandrels) and "constraints" to the status of independent explanatory categories. They argued that some traits exist simply because of architectural necessity, not because selection favored them.

  Fisher's **Geometric Model of Adaptation** (1930) suggests he would attempt to reabsorb these categories back into a selectionist framework. In Fisher's geometry, an organism is a point in multidimensional phenotypic space. A mutation moves the point. If the move is toward the optimum, it is fixed; if away, it is rejected. Crucially, Fisher understood pleiotropy—one gene affecting multiple traits—very well.

  **The Reconstruction:**
  Fisher would likely reject the ontological status of the "spandrel." To him, a trait that is a byproduct of selection on another trait is simply a case of **correlated response to selection**. If a structural feature (a "spandrel") persists, it is because the net fitness effect of the genetic complex producing it is positive, or at least not sufficiently negative to be purged given the population size and mutation rate.

  He would argue that granting "architectural constraint" independent explanatory power is a surrender of scientific parsimony. For Fisher, a constraint is just a boundary condition in the optimization equation. If a trait is non-adaptive but persists, it is not because "selection didn't build it"; it is because selection is acting on a *different* trait genetically correlated with it, and the cost of decoupling them is higher than the cost of maintaining the spandrel.

  He might respond: *"To call a trait a 'spandrel' is merely to admit ignorance of the full covariance matrix of the phenotype. It is not a distinct causal force. It is selection acting on a vector of traits rather than a scalar. To elevate the byproduct to a principle is to confuse the residual of our measurement with a force of nature."*

  **Speculative Flag:** Here, Fisher might be underestimating the developmental biology revolution (Evo-Devo) that Gould was anticipating. Fisher viewed the organism as a malleable substrate for gene frequencies. He might have struggled to accept that developmental pathways themselves impose hard limits that selection *cannot* overcome, regardless of population size. He would likely view developmental constraints as temporary local optima, not absolute barriers.

  ### 3. The "Spandrels" Paper as Neo-Wrightianism
  You noted Fisher's polemic energy against Sewall Wright. It is highly probable that Fisher would read "The Spandrels of San Marco" not as a new philosophical challenge, but as the latest salvo in the Fisher-Wright debate.

  Wright's **Shifting Balance Theory** relied on small subpopulations where drift could push groups across adaptive valleys to new peaks. Fisher spent decades arguing that natural populations are too large for drift to be significant and that mass selection on continuous variation is sufficient to navigate the adaptive landscape without drift.

  **The Reconstruction:**
  Fisher would likely view Gould's emphasis on drift, contingency, and non-adaptive structures as "Wrightism without the mathematics." He would see the "Panglossian Paradigm" label as a rhetorical trick to dismiss the null hypothesis that selection is the dominant creative force.

  Fisher believed that in any population of realistic size, drift is negligible compared to even very weak selection. Gould's argument that drift and byproducts are *common* would strike Fisher as an empirical claim lacking statistical support. He would likely accuse Gould and Lewontin of committing the very sin they accused adaptationists of: telling a story (a story of constraint and accident) without providing the quantitative evidence that drift is strong enough to overcome selection.

  He might frame his response thus: *"Seventy years ago, I demonstrated that in a population of millions, the noise of drift is drowned out by the signal of selection. Dr. Gould and Dr. Lewontin offer us a cathedral of metaphors, but they have not shown me the population sizes where their 'spandrels' outweigh the genetical variance. This is not a new philosophy; it is the old error of Dr. Wright, dressed in the robes of Venice."*

  **Speculative Flag:** Fisher might have missed the philosophical nuance that Gould was attacking *methodology*, not just *mechanism*. Gould wasn't just saying drift happens; he was saying adaptationists *assume* selection without testing alternatives. Fisher, confident in his Fundamental Theorem, might have genuinely believed the testing was inherent in the mathematical derivation, failing to see that the theorem describes an idealized system that may not map onto historical reality.

  ### Summary for Your Dissertation
  In your chapter, you can position Fisher not merely as a dogmatic adaptationist, but as a **methodological monist**.
  *   **Gould/Lewontin** advocate for **Explanatory Pluralism**: Different traits require different explanations (selection, drift, constraint, history).
  *   **Fisher** advocates for **Methodological Monism**: All evolutionary change must be describable via the change in gene frequencies driven by fitness variance. Even "constraints" must be translated into genetic correlations to be scientifically valid.

  Fisher's response to "Spandrels" would ultimately be a refusal to accept the validity of non-quantitative categories. He would not deny that spandrels exist in a descriptive sense; he would deny that "being a spandrel" is a causal explanation. For Fisher, the only cause is the change in gene frequency, and the only driver of systematic change is selection. To admit otherwise would be to abandon the Newtonian dream of *The Genetical Theory*.

  This reconstruction suggests that the debate isn't just about biology; it's about what counts as an explanation. Fisher demands a *mechanistic/mathematical* account; Gould demands a *historical/narrative* account. Fisher would likely die believing that without the former, the latter is just poetry.
