answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two emeritus professors, Sarah (a Bohmian) and David (an Everettian), are finishing coffee after a colloquium on quantum information. Sarah has a copy of Bell's "Speakable and Unspeakable" on the table.*

  **Sarah:** You know, David, I've been reading Bell's 1976 paper again. "The theory of local beables." It's striking how precise he is. He defines local causality as a condition on probabilities: $P(A | B, \lambda) = P(A | \lambda)$. If the specification of events in the past light cone ($\lambda$) screens off the correlation between spacelike separated regions A and B, you're local. If not, you're not.

  **David:** And yet, here we are. Both of us claiming our preferred interpretations respect locality, while the textbooks say Bell proved nature is nonlocal. It's a mess.

  **Sarah:** Is it? Look, I'll be blunt. In Bohmian mechanics, the velocity of particle 1 depends instantaneously on the position of particle 2, regardless of distance. The guidance equation is explicit: $v_1 \propto \nabla_1 \psi(q_1, q_2)$. That wavefunction is evaluated at the *actual* configuration of both particles. If you wiggle the magnet setting at B, the trajectory at A changes immediately. That violates Bell's local causality. I admit it. But I maintain we keep *signal* locality. We can't use that dependence to send a bit faster than light.

  **David:** That's exactly where I think you're conceding too much, Sarah. You're accepting Bell's framing that there *must* be a violation of something called "locality" if the inequalities are violated. I'm saying the derivation of the inequality assumes a single outcome per measurement run.

  **Sarah:** The "single outcome" loophole. I know the move. You say that in Everett, all outcomes happen, so there's no unique event $A$ to condition on in Bell's formula.

  **David:** Precisely. Bell's inequality requires a joint probability distribution over definite outcomes $P(A, B | a, b, \lambda)$. In unitary quantum mechanics, there is no such distribution for the global state. There is only the amplitude. The correlation between Alice's branch and Bob's branch is established when they interact with the entangled source, locally. When they measure, they branch locally. When they compare notes later, they match up branches locally. There is no moment where a physical influence travels from A to B.

  **Sarah:** But David, that feels like wordplay. If I'm Alice, I see *one* outcome. I experience a single world. If your theory says I'm wrong about that, you've solved the nonlocality problem by denying the data. But let's look at the ontology. You say the evolution is local. Where?

  **David:** In configuration space. The Schrödinger equation is a local differential equation in $3N$ dimensions.

  **Sarah:** Ah, there it is. That's the sleight of hand. Bell's 1976 paper emphasizes *beables in spacetime*. He was worried about fields and particles in 3D space. If your wavefunction lives in a $3N$-dimensional space, then "locality" in that space means something totally different than "locality" in physical space. A point in configuration space specifies the position of *every* particle in the universe. So, a "local" interaction in configuration space is a global rearrangement of matter in 3D space.

  **David:** Why privilege 3D space? That's a prejudice from classical physics. If the fundamental object is the wavefunction, then configuration space *is* the arena. Locality should be defined relative to the fundamental ontology.

  **Sarah:** Because relativity is defined in 3+1 spacetime. If you want to claim your theory is compatible with relativity, you need your causal structure to map onto the light cones of spacetime, not the topology of Hilbert space. In Bohmian mechanics, the particles are in 3D space. They are the beables. Yes, they act nonlocally. But because the nonlocality is washed out by the quantum equilibrium distribution ($\rho = |\psi|^2$), the *observable* world respects Lorentz invariance. We keep the causal structure of spacetime for everything we can actually touch.

  **David:** So you're happy with "empirical locality" but admit "ontological nonlocality." I'm claiming "ontological locality" but admitting that "outcomes" are relative. But consider this: In your theory, the nonlocal influence is real. If the universe weren't in quantum equilibrium, you *could* signal. The nonlocality is baked into the dynamics. In my theory, the dynamics are strictly linear and local. The appearance of nonlocality comes from the fact that observers are subsystems who only see a branch.

  **Sarah:** But isn't that branching process itself nonlocal? When Alice measures, the universe splits. Does Bob's copy split at the same time?

  **David:** There is no "same time." That's the beauty of it. Decoherence is a local process. Alice's apparatus entangles with the particle, then with the environment. That wave of decoherence spreads at finite speed. Bob's branch doesn't "split" relative to Alice's until their light cones overlap or they compare records. There is no instantaneous global fission.

  **Sarah:** I find that hard to square with the EPR correlations. If Alice measures spin up, she knows *instantly* that Bob will measure spin down (in her branch). In Bohmian mechanics, that's because the particles had definite positions and the guidance equation coordinated them. In your view, what grounds that correlation before they meet?

  **David:** The entanglement itself. The correlation was created at the source, locally. It's stored in the structure of the wavefunction. No information needs to pass between them at measurement time. Think of it like two envelopes with correlated slips of paper.

  **Sarah:** Bell ruled out the envelopes, David. That's the whole point of the theorem. Hidden variables don't work.

  **David:** Hidden *local* variables don't work. The wavefunction isn't a local hidden variable in 3D space. It's a global object. But it evolves locally in its own space. The "nonlocality" you see is the result of projecting a high-dimensional local process onto a single outcome in 3D space. If you stop insisting on a single outcome, the tension vanishes.

  **Sarah:** Okay, let's press on the "single outcome" issue. You say Bell assumes a single outcome. But Bell's 1976 definition is about *causation*. It asks: Is the probability of an event here determined by events there, once we fix the common past? In Everett, is the probability of "Alice seeing Up" determined by "Bob's setting"?

  **David:** Probabilities are tricky in Everett, we grant you that. But let's talk about *influence*. In Bohmian mechanics, if Bob changes his magnet setting, the *actual* trajectory of Alice's particle changes. That is a counterfactual dependence.

  **Sarah:** Yes. It is.

  **David:** In Everett, if Bob changes his setting, does Alice's branch change? No. Alice's branch is defined by her local interaction. The *correlation* between Alice's branch and Bob's branch is fixed by the source. There is no counterfactual dependence of Alice's local state on Bob's setting.

  **Sarah:** But you can't identify *which* Bob Alice is correlated with until they compare.

  **David:** Exactly. And that comparison happens at light speed or slower. So the *operational* nonlocality is zero. In your theory, the *ontological* nonlocality is infinite, even if the operational is zero. Why is hiding the nonlocality better than eliminating it?

  **Sarah:** Because I know what exists. I know particles exist. I know space exists. Your "locality in configuration space" buys you formal elegance, but it costs you a clear picture of what's happening *here*. Bell worried about this. He wanted beables in spacetime. He said, "Surely, it is possible to formulate a theory in which there are no actions at a distance?" But he concluded that for any theory with single outcomes, the answer is no. Since I insist on single outcomes—because I see one world—I must accept nonlocality. I'd rather accept a nonlocal dynamics that respects signal locality than a local dynamics that requires me to be a multitude.

  **David:** And I'd rather accept a multitude than a preferred foliation of spacetime. Because let's be honest, Sarah. Your "instantaneous" action requires a reference frame. You need a notion of simultaneity to define the guidance equation.

  **Sarah:** We need it for the *ontology*, not the phenomenology. The quantum equilibrium hides the preferred frame. It's like the ether in Lorentz's theory. Undetectable, but conceptually there.

  **David:** That's a high price. You're positing a structure of reality that is fundamentally at odds with relativity, hoping we never detect it. In Everett, the wavefunction evolution is compatible with relativistic QFT. The Tomonaga-Schwinger formalism gives us a local evolution of the state on spacelike hypersurfaces.

  **Sarah:** But the state is still on configuration space! Look, here's the crux. We are using the word "local" to mean two different things.
  For me, "local" means "no influence between spacelike separated regions in 3D space." By that definition, I am nonlocal. I keep "signal locality" to save relativity.
  For you, "local" means "unitary evolution governed by a local Hamiltonian density." By that definition, you are local. But you sacrifice "outcome definiteness."

  **David:** I'd refine that. I'd say "local" means "no superluminal causal influence." In Everett, there is no causal influence between the wings of the experiment. The correlation is common-cause (the source), not direct-cause. Bell's theorem rules out local common-cause theories *with single outcomes*. Drop the single outcome, and a local common-cause story works. The "cause" is the unitary evolution of the entangled state.

  **Sarah:** But is the entangled state a "common cause" in spacetime? It's a non-separable state. If the state of the system cannot be factored into a state for A and a state for B, then A and B are not distinct existences in the way Bell's locality requires.

  **David:** That's the holism. Nature is holistic. Bell's local causality assumes separability: that the state of the union is determined by the states of the parts. Quantum mechanics says no. Everett says "No, and that's fine." Bohm says "No, so we need instantaneous connections to coordinate the parts."

  **Sarah:** I think that's it. Bell's theorem rules out *Local Separable Realism*.
  I keep Realism (particles) and drop Locality (separability).
  You keep Locality (dynamics) and drop Realism (single outcomes/separability of observers).

  **David:** I wouldn't say I drop realism. I'm a realist about the wavefunction. I just deny that "outcome" is a primitive. But yes, we agree on the trilemma. You can't have Single Outcomes, Locality, and QM Statistics.
  I drop Single Outcomes.
  You drop Locality (in the Bell sense).
  The Copenhagenists drop Realism.

  **Sarah:** So when a Bohmian says "we keep locality," they are being sloppy. They mean "we keep signal locality."

  **David:** And when an Everettian says "we keep locality," they mean "we keep dynamical locality in the fundamental state space." Neither of us satisfies Bell's 1976 "Local Causality" in the way a classical field theorist would hope. You violate the independence condition; I violate the uniqueness condition.

  **Sarah:** It seems Bell's "local beables" is the hammer. If you demand beables in 3D spacetime that determine outcomes, you *must* have nonlocality. I accept that. You deny the "determine outcomes" part.

  **David:** Or I deny the "in 3D spacetime" part. If the beable is the wavefunction, it's not in 3D space. So Bell's constraint on spacetime beables doesn't apply directly.

  **Sarah:** But then how do you get 3D space back?

  **David:** Decoherence. It selects a basis that looks like localized particles.

  **Sarah:** *Looks like.* That's the phrase that always bothered me. In my theory, they *are* localized. In yours, they *act* localized.

  **David:** And in yours, they *act* nonlocally, but you can't see it. In mine, they *act* locally, but you see multiple copies. We're both positing invisible structure to save the phenomena. You posit invisible nonlocal connections. I posit invisible branches.

  **Sarah:** True. But my invisible structure is a connection between *actual* things. Yours is a multiplication of *potential* things.

  **David:** In Everett, the branches are actual. That's the point.

  **Sarah:** (Laughs) We're not going to agree on the ontology, David. But I think I see the confusion now. When people say "Bell proved nonlocality," they mean "Bell proved that any theory with single outcomes must have nonlocal dependencies."
  Since I have single outcomes, I am nonlocal.
  Since you don't, you aren't.
  But you pay for it by making "locality" a property of a high-dimensional space, not the space we live in.

  **David:** I'd say I make locality a property of the *dynamics*, which is the only thing that matters for causality. You make locality a property of the *ontology*, but then break it to save the dynamics.

  **Sarah:** Fair enough. So, "Local" is not a binary switch. It's a vector. There's Signal Locality, Dynamical Locality, Ontological Locality, and Outcome Locality.
  Bohm: Passes Signal, Fails Dynamical/Ontological.
  Everett: Passes Dynamical, Fails Outcome (and maybe Ontological, depending on if you count config space).

  **David:** And both pass Signal. That's the only one relativity actually demands.

  **Sarah:** Exactly. Bell showed us we can't have it all. We have to choose which "local" we care about most. I care about the particles being *here*. You care about the equations not reaching *there*.

  **David:** And the condensed matter physicists in the audience just want to calculate the band structure without worrying about whether the electron is in two worlds at once.

  **Sarah:** (Smiling) Thank God for effective field theory.

  **David:** Cheers to that.
