answer: |-
  **Question 1**
  Mr. Douglass, for years you stood shoulder-to-shoulder with William Lloyd Garrison, denouncing the Constitution as a "covenant with death" that no moral person could support. Now, you stand apart, arguing that same document is a "glorious liberty document." Was this shift a gradual discovery of truth, or a sudden strategic necessity?

  **Follow-up:** *If he answers that truth simply revealed itself to him over time:* "If the truth was always in the text, why did it require your physical and political separation from the American Anti-Slavery Society for you to see it?"

  **Question 2**
  Your critics, including Wendell Phillips, have suggested this conversion was less intellectual than financial—that it coincided precisely with your break from Garrison and your alignment with Gerrit Smith, who funded your new newspaper, and Lysander Spooner, whose legal theories underpin your new view. Is this new constitutionalism truly your own, or is it a theory purchased by Smith's purse and argued by Spooner's briefs?

  **Follow-up:** *If he denies any financial influence on his conscience:* "Even if no money changed hands, isn't it convenient that Spooner's complex legalism suddenly provided the exact justification Smith needed to recruit you into political abolitionism?"

  **Question 3**
  Your central argument rests on the fact that the words "slave" and "slavery" appear nowhere in the Constitution. You argue the document is colorblind. But isn't that a distinction without a difference when the entire nation understood those clauses referred to human chattel? Does the law not reflect the common understanding of the people who enacted it?

  **Follow-up:** *If he insists that legal text must be read strictly by its words alone:* "If we ignore the common understanding, are we not engaging in a legal fiction that allows the oppressor to hide behind a euphemism while the oppressed remains in chains?"

  **Question 4**
  Consider the three-fifths clause. It explicitly counts enslaved people as fractions of a person for the purpose of congressional representation. How can you read a clause that quantifies human beings as property for political gain as anything other than a concession to the slave power?

  **Follow-up:** *If he argues that the clause was actually a penalty on the South that limited their power:* "If it was a penalty, why did the political power of the slave states continue to expand relentlessly under this very Constitution?"

  **Question 5**
  You insist we must look to the public, enacted text of the Constitution rather than the private intentions of the Framers. But many of those men were slaveholders who spoke openly of protecting their property. Why should their secret hopes matter less than the ink on the page they signed?

  **Follow-up:** *If he argues that private intent is unknowable and only law governs:* "But if the law is written by men with a specific intent to protect slavery, does ignoring that intent not blind us to the law's true function?"

  **Question 6**
  Take the Fugitive Slave Clause in Article IV. It mandates that persons "held to service or labor" shall be delivered up. You argue this applies only to indentured servants, not slaves. In a country where millions are held to lifelong, hereditary labor, is that not a reading that requires ignoring the world as it actually exists?

  **Follow-up:** *If he maintains that the text does not legally sanction the word "slave":* "Does a man captured and returned in chains feel any difference because the warrant cited 'service' rather than 'slavery'?"

  **Question 7**
  Garrison refused to vote or hold office, believing that participating in a pro-slavery government made one complicit in its sins. You now argue that voting is a duty. How do you cast a ballot for candidates who swear to uphold a Constitution that includes the Fugitive Slave Clause without feeling stained by that enforcement?

  **Follow-up:** *If he argues that we must use the system to dismantle it:* "Does participating in the system not legitimize its authority over the very people it is enslaving?"

  **Question 8**
  You once wrote that no self-respecting abolitionist should vote under this Constitution. Do you now believe that those who still hold that view—including your old friends—lack self-respect, or have you simply redefined what respect requires?

  **Follow-up:** *If he says they are sincere but mistaken:* "Is their moral consistency not preferable to a pragmatism that asks us to embrace a document that has, for seventy years, protected the institution of slavery?"

  **Question 9**
  If the Constitution is, as you say, inherently anti-slavery, why does slavery persist? What is the specific mechanism by which your interpretation frees the enslaved? Is it the ballot box, the courts, or simply a change in how we speak?

  **Follow-up:** *If he says political power is the only path to emancipation:* "How many more generations must wait in bondage while we slowly accumulate that political power through a system designed to protect their captors?"

  **Question 10**
  Here is my final question, and I ask you to weigh it carefully. Garrison started with the conclusion that slavery is a sin and read the Constitution to match that moral truth. You now start with the conclusion that we must vote and read the Constitution to match that political necessity. Are you not guilty of the very same intellectual dishonesty you once condemned—settling on the conclusion first, and then finding the interpretation to fit it?

  **Follow-up:** *If he argues that his conclusion is based on practical utility and results:* "But if we bend the truth of the document to serve a good end today, what prevents our enemies from bending the truth of the document to serve a wicked end tomorrow?"
