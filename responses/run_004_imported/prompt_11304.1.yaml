          *   *The "Purification" Argument:* In the Messianic era, sacrifice is no longer a concession to idolatry but a pure expression of obedience.
      *   **Section 5: Addressing the "Unresolvable Tension" View.** Acknowledge scholars (like Kellner) who say Maimonides hoped for abolition. But the text of Hilchot Melachim is explicit. We must respect the text.
      *   **Conclusion:** Maimonides holds a coherent view. Sacrifice is a "divine accommodation" that becomes sanctified through command. It remains necessary because humans are not angels. The tension dissolves when we realize the *Guide* explains the *historical necessity*, while the *Mishneh Torah* affirms the *eternal normativity* of that accommodation.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't ignore the strength of the "tension" argument. It's a famous problem in Jewish philosophy. I need to acknowledge that on the surface, it looks like a contradiction.
      *   *Key Insight:* Maimonides distinguishes between the *First Intention* (ideal worship: intellect/prayer) and *Second Intention* (sacrifice due to human stubbornness). If the Messiah brings the world closer to the First Intention, why return to the Second?
