answer: |-
  **The Merchant and the Magistrate: Adam Smith and the Paradox of Liberal Empire**

  For two centuries, Adam Smith stood as the high priest of laissez-faire, a thinker whose *The Wealth of Nations* (1776) was read as a blueprint for national self-interest and global free trade. In recent decades, however, the canon has been subjected to a post-colonial audit. Historians of political thought now scrutinize the founding figures of liberalism for their complicity in, or resistance to, the projects of European imperialism. In this re-litigation, Adam Smith has emerged as the most difficult case to adjudicate. On one hand, he offers a withering economic and moral critique of colonial monopoly and violence. On the other, his historical materialism and political proposals suggest a desire to rationalize, rather than dismantle, British hegemony. While the evidence for Smith as an anti-imperialist critic is textually abundant and morally compelling, it ultimately rests on a selective reading of his critique. A more rigorous engagement with Smith's systematic thought reveals that he was not an opponent of empire as such, but a theorist of "liberal empire." Smith sought not to end British expansion, but to rescue it from the corruptions of mercantilism, transforming it from a project of state-managed extraction into a sustainable, integrated commercial polity.

  The case for reading Smith as an anti-imperialist rests primarily on Book IV, Chapter VII of *The Wealth of Nations*, titled "Of Colonies." Here, Smith appears to dismantle the very logic of colonial possession. Economically, he argues that the monopoly of colonial trade is a regressive tax on the many to enrich the few. It diverts capital from nearby, high-turnover European trade to distant, low-turnover American trade, slowing the natural growth of the national wealth. He concludes that the cost of defending the colonies during peace and fighting wars to protect them exceeds the revenue gained from their trade. "To propose that Great Britain should voluntarily give up all authority over her colonies," Smith writes, is to propose something "difficult to be supposed," yet he admits it is the only way to extricate the nation from the fiscal drain.

  Furthermore, Smith's moral condemnation of imperial conduct is unambiguous. He describes the European discovery of the Americas as a event marked by "savage injustice." He indicts the East India Company not merely for inefficiency, but for functioning as a "strange absurdity" where sovereigns are merchants, resulting in the oppression and famine of Bengal. For historians like Jennifer Pitts or Uday Singh Mehta, this moral vocabulary signals a break from the justificatory logic of empire. If the economic benefits are illusory and the moral costs are atrocities, the logical conclusion is withdrawal. The "relinquishment" option Smith entertains in the book's closing pages is read as a sincere, albeit hesitant, recommendation for decolonization. In this view, Smith's liberalism contains an internal critique of domination that transcends his historical moment.

  However, this reading isolates Smith's critique of *mercantilism* from his broader theory of *commercial society*. To understand Smith's position on empire, one must look beyond the specific policy critiques of Chapter VII to the structural architecture of his four-stage theory of history. For Smith, human societies progress from hunting to herding, to farming, and finally to commerce. Commercial society represents the apex of this development, characterized by increased liberty, interdependence, and wealth. Crucially, Smith views the expansion of markets as essential to sustaining this advanced stage. Without new markets, the division of labor hits a ceiling, and growth stagnates.

  This is where the "Liberal Imperialist" reading gains its traction. Scholars such as Emma Rothschild and Istvan Hont argue that Smith's problem was not the existence of colonies, but their administration. He opposed the *exclusive* company monopolies because they restricted the flow of commerce, not because they occupied territory. Smith's alternative to relinquishment was a "union"—a proposal to integrate the American colonies into the British metropolis through proportional representation in Parliament and a shared tax burden. He describes this vision as a "great council of an American empire," where the seat of government might eventually move across the Atlantic.

  This proposal is not a throwaway line; it is the key to Smith's imperial vision. It reveals that he imagined a future where the British Empire evolved into a trans-Atlantic federal republic. In this schema, empire is not a relationship of master and subject, but of integrated partners within a single commercial sphere. Smith's hostility toward the East India Company stems from its nature as a conquering, extractive entity in a settled civilization (India), whereas his view of North America is that of a settlement colony where British liberty could be extended. He does not question the right of Britons to settle and displace indigenous populations in America; he questions the London merchants' right to monopolize the resulting trade. Thus, Smith's critique is internal to the imperial project: he wants to make empire efficient, liberal, and permanent, not to end it.

  The decisive reason to reject the anti-imperialist reading in favor of the liberal imperialist one lies in Smith's conception of sovereignty and security. The anti-imperialist reading assumes Smith believed colonies were economically dispensable. But Smith explicitly acknowledges that empire serves a strategic purpose beyond immediate profit. He notes that the colonies strengthen Britain by adding to its naval power and population. While he argues the *current* costs outweigh the benefits, his proposal for union is designed to correct this imbalance, thereby making the empire net-positive. If Smith were truly an anti-imperialist, the union proposal would be as morally repugnant as the monopoly, as it merely deepens the political subjugation of Americans to a London-centric (or eventually American-centric) imperial state. Instead, Smith treats union as the "magnanimous" choice, superior to the "easy" choice of relinquishment.

  Moreover, Smith's silence on indigenous sovereignty in the context of settlement colonies is telling. While he condemns the violence against natives, he treats the land of North America as effectively available for the progress of commercial society. His four-stage theory is inherently teleological; it suggests that "savage" nations have no true claim to land that is not "improved" by agriculture and commerce. This is the hallmark of liberal imperialism: the belief that the spread of commercial liberty justifies the displacement of non-commercial peoples. Smith opposes the *cruelty* of conquest, but he accepts the *necessity* of expansion for the progress of mankind. To read him as an anti-imperialist is to anachronistically impose a modern concept of self-determination onto a thinker who believed that the spread of British commerce was synonymous with the spread of human improvement.

  Ultimately, the controversy over Smith turns on whether one views his economic critique as an end in itself or as a means to a political end. The anti-imperialist reading mistakes Smith's attack on the *mechanisms* of mercantilism for an attack on the *project* of empire. Smith argued that monopoly was bad for business, not that dominion was bad for the soul. His willingness to entertain a unified imperial parliament demonstrates that he believed the British state could be scaled to match the global reach of its markets. He sought to align the political superstructure with the economic base.

  Therefore, Adam Smith is best understood not as a critic of empire, but as its most sophisticated rationalizer. He recognized that the old model of closed monopolies and extractive conquest was unsustainable and morally corrosive. His solution was not retreat, but renovation. He envisioned a liberal empire bound by the ties of common interest, free trade, and shared representation, capable of sustaining the progress of commercial society indefinitely. To claim Smith as an anti-imperialist is to ignore his conviction that the British Empire, properly reformed, was the best hope for global liberty and wealth. He did not want to dismantle the engine of empire; he wanted to tune it so it would run forever.
