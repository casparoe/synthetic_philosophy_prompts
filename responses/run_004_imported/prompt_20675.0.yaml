  Been going down a rabbit hole on decision theory for a piece on memory and rational choice, and I can't shake this "absent-minded driver" puzzle (the Piccione/Rubinstein highway one, where the driver needs to exit at the second intersection but genuinely can't tell the two intersections apart, or even recall whether he's already passed one). I get why imperfect recall forces him to use the same probability of continuing at both intersections, but what I don't get is why the strategy that's optimal to commit to beforehand apparently stops being optimal once you imagine actually standing at an intersection and updating your belief about which one it is based on that very probability -- I think this the "planning-optimal" vs "action-optimal" split, though I might be butchering the terminology. Can you explain, in plain terms, where that gap actually comes from, and whether its exposing something genuinely broken in Bayesian updating when an agent can't locate itself in time, or if its more just an artifact of how the game's been set up? Trying to get past "philosophers argue about this" for my readers.
