answer: |-
  This is a classic "textbook rationality vs. real-world rationality" clash. Your friend is arguing from a model of **risk-neutral expected value maximization with zero friction.** In that specific, narrow model, he is absolutely correct: if $EV > 0$ and utility is linear in money, you should play until the heat death of the universe (or until you run out of time).

  However, your intuition that there is a coherent place to draw a line is also correct, because the real world introduces variables that his model ignores. You aren't necessarily suffering from a cognitive bias; you are likely operating with a more complex utility function that includes **transaction costs, counterparty risk, and variance aversion.**

  Here is how to untangle this using the toolkit you've built over the last decade.

  ### 1. The Utility Function Isn't Just Money
  Your friend's argument rests on the assumption that $U(\text{Outcome}) = \text{Dollars}$. If that were true, stopping would indeed be incoherent. But your utility function is actually something more like:
  $$U = \text{Money} - \text{Time Cost} - \text{Attention Cost} - \text{Social Friction}$$

  *   **Time/Attention:** Flipping a coin 50 times isn't instantaneous. It takes 15–20 minutes of standing around watching a coin flip. If your hourly value of leisure or conversation at a meetup is higher than the expected win rate ($20 per flip $\times$ ~3 flips/minute = ~$60/minute?), then the marginal flip eventually becomes negative EV *in utility terms*, even if it's positive in dollar terms.
  *   **Diminishing Marginal Utility of "Fun":** The first three flips are novel and exciting. Flip #40 is a grind. If the activity itself stops providing positive utility (or starts providing negative utility/boredom), you stop. That is a principled stopping condition: **Marginal Utility of Activity = 0.**

  ### 2. Counterparty Risk Scales with Pot Size
  This is the strongest objective argument against your friend's "infinite flips" stance.
  *   At 5 flips, the maximum swing is roughly $\pm\$500$. Your friend can easily cover this.
  *   At 100 flips, the standard deviation is $\sqrt{100} \times \$120 \approx \$1,200$, but the potential range is much wider. If you get lucky and are up $3,000, does your friend actually have that liquid cash on hand to pay you immediately?
  *   As the pot grows, the probability that the bet becomes "uncollectible" or "awkward to collect" increases. A +EV bet with a 5% risk of non-payment might be worth taking once; a +EV bet with a 50% risk of non-payment (because the sum exceeds his liquid wallet) is not.
  *   **Principled Line:** You stop when the **Expected Value adjusted for Counterparty Risk** drops below your threshold.

  ### 3. Variance Aversion is a Valid Preference
  Your friend invokes the Law of Large Numbers (LLN) to say risk disappears over time. He is technically right about the *probability* of loss approaching zero, but he is ignoring the **magnitude of path dependence.**

  Even if you end up profitable after 100 flips, you might endure a drawdown of -$800 in the middle. You mentioned this doesn't bend your finances, but humans are not perfectly hedonic robots. Experiencing a string of losses can induce stress, annoyance, or "tilt," which negatively impacts your utility.
  *   If you dislike the *experience* of volatility (even without financial ruin), you have a **concave utility function regarding variance**, not just wealth.
  *   In decision theory, preferring a sure thing (or a low-variance cluster) over a high-variance distribution with the same mean is not "irrational"; it is the definition of risk aversion. It only becomes a "bias" (like loss aversion in Prospect Theory) if it contradicts your *stated* goals. If your goal is "maximize dollars with minimal headache," stopping early is optimal.

  ### 4. The "One-Boxing" of Social Context
  There is a subtle social game theory element here.
  *   Taking a few flips is "playing along."
  *   Taking 50 flips and potentially draining your friend of $1,000+ changes the dynamic from "fun meetup activity" to "I am extracting value from you."
  *   If you value the friendship or the social harmony, the "cost" of winning too much from a friend increases non-linearly. Winning $50 is fun; winning $2,000 from a friend at a party might create awkwardness that has negative utility for you.
  *   **Principled Line:** You stop when the **Social Cost** of potential winnings outweighs the **Financial EV**.

  ### 5. Is it Incoherent? (The Money Pump Test)
  To check if your preference is truly incoherent (i.e., vulnerable to a money pump), ask yourself: **Would I pay to switch from the "Stop at 5" plan to the "Stop at 50" plan?**

  *   If you truly believe the 50-flip strategy is strictly better, you should be willing to pay a small fee to be *forced* to play 50 times.
  *   If you would *pay* to be allowed to stop at 5, then your preference for stopping is consistent. You are revealing that the "costs" (time, stress, counterparty risk) of flips 6–50 exceed their $20/flip EV.

  ### How to Reply to Your Friend
  You don't need to retreat into "nerves." You can frame this in terms he should respect. Try something like this:

  > "You're assuming a frictionless model where Utility = Dollars and Counterparty Risk = 0. My position is coherent if you account for transaction costs.
  >
  > 1.  **Counterparty Risk:** I trust you for $500. I don't know if you have $3,000 liquid to cover a bad run, and I don't want to put you in that spot.
  > 2.  **Attention Costs:** The EV is $20/flip, but my time and attention at a meetup are worth more than $60/minute after the novelty wears off.
  > 3.  **Variance Cost:** I'm not risk-neutral regarding *stress*. The LLN saves me from financial ruin, but it doesn't save me from the annoyance of a 15-loss streak.
  >
  > I'm not stopping because I'm scared of the math; I'm stopping because the marginal utility of flips 6 through 50 is negative once you factor in everything besides the raw dollar expectation."

  ### Summary
  Your friend is right about the **math of the coin**, but wrong about the **decision theory of the situation.**

  In the Sequences, Eliezer often argued for "shut up and multiply," but that applies when the model is complete. In the real world, "shut up and multiply" must include *all* variables, not just the face value of the bet. If you include time, social capital, counterparty reliability, and mental bandwidth, the EV of the 20th flip is likely negative.

  You aren't being incoherent; you're just pricing in risk and friction that your friend is ignoring. That's not a bias; that's good modeling.
