      *   *Risk Neutrality:* If the user were risk-neutral regarding money (linear utility), they should take infinite flips (bounded only by time/opportunity cost).
      *   *Risk Aversion (Concave Utility):* Standard explanation. Marginal utility of money decreases. However, the user explicitly says: *"money means less to me once I have more of it... not one that should kick in at these stakes."* This suggests linear utility *in this range*.
