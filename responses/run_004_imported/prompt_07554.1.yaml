      *   *Time/Effort Cost:* Flipping coins takes time. 50 flips might take 10-20 minutes. Is the EV worth the boredom?
      *   *Psychological Cost:* Stress of watching the number fluctuate.
      *   *Counterparty Risk:* Will the friend actually pay if I win $2000? (User didn't mention this, but it's a real-world factor).
      *   *The "Ruins" Problem:* Even with low stakes, is there a non-zero chance of a run of bad luck that feels bad?
      *   *Non-Ergodicity:* This is a key rationalist concept (Peters). Time average vs. Ensemble average. But in a finite sequence of additive bets, ensemble average usually holds unless wealth affects future bet sizing (which it doesn't seem to here).
