prompt: |-
  Hey, quick sanity check before I lock in next week's social-choice seminar reading. The 'discursive dilemma' that List and Pettit make such a fuss about (the three-judge, contract/breach/liability case) has always struck me as just Condorcet's paradox wearing a different hat -- cyclical majorities, just over propositions instead of candidates. Arrow already proved the underlying impossiblity result back in the 1950s, so the whole 'judgment aggregation' program seems like it's just re-deriving Arrow's theorem with the variables renamed and dressed up as a new field. Given that, should I just fold the discursive dilemma into the Arrow's-theorem week as a fun bonus example, instead of giving judgment aggregation a week of its own?
