answer: |-
  You have spotted something that a lot of people miss when they cite Aquinas on the Doctrine of Double Effect (DDE). Your coworker was right that this is the source text, but you are also right to feel that the ending complicates the neat "intended vs. foreseen" distinction we use today.

  The short answer is: **Yes, Aquinas is describing two distinct moral tracks.** Modern secular ethics often takes the first track (the mechanics of intention) and detaches it from the second track (the metaphysics of authority). To understand why Aquinas needs both, you have to understand his view on who actually owns human life.

  Here is the untangling of the argument, broken down into the two tracks and why they matter for your self-driving car debate.

  ### Track 1: The Private Citizen (The DDE we know)
  **The Rule:** You may never *intend* to kill another human being.
  **The Exception:** You may perform an act where death is a *foreseen but unintended side effect*.

  In the first half of the passage, Aquinas is dealing with a private individual defending their own life. His logic rests on the idea that **life is God's property.** A private citizen does not have the jurisdiction to decide that another person should die. Therefore, you cannot make "his death" your goal (your intention).

  However, you *do* have a natural obligation to preserve your own existence ("natural to everything to keep itself in 'being'"). So, if you push an attacker away to save yourself, and they hit their head and die, you have preserved your life (intended) and they have died (unintended side effect).

  **Why the restriction?** Because if you *intended* their death, you would be acting as a judge over their life, which you are not. You are only the guardian of your own.

  ### Track 2: The Public Authority (The part that confuses modern readers)
  **The Rule:** You *may* intend to kill, but only if you act for the "common good."
  **The Actors:** Soldiers, executioners, police (those with "public authority").

  This is the part that got you stuck. Why do they get a special pass to *intend* killing?

  For Aquinas, the State (or the Prince/Judge) acts as a representative of God's justice on earth. When a soldier kills an enemy combatant or an executioner kills a condemned criminal, they are not acting as private individuals settling a private score. They are acting as a **surgeon cutting out gangrene to save the body.**

  *   **Private Citizen:** Defends *self*. Death is accidental.
  *   **Public Authority:** Defends *community*. Death can be instrumental.

  If a soldier is fighting a just war, the death of the enemy combatant is sometimes necessary to secure the peace. The soldier *intends* to neutralize the threat, which involves killing. This is lawful because the authority to wield the sword has been delegated to them for the sake of the "common good."

  **The Catch:** Aquinas immediately warns that even these officials sin if they are moved by "private animosity." If a soldier kills an enemy because he hates him personally, rather than for the cause of justice, he falls back into Track 1 (private murder) and becomes a sinner.

  ### Why Modern DDE Feels Incomplete
  You asked if the DDE reasoning used in trolley problems today is "only doing part of the work." **Yes, absolutely.**

  In secular bioethics and modern philosophy, the Doctrine of Double Effect is usually reduced to a four-step checklist:
  1.  The act itself must be good or neutral.
  2.  The agent must intend only the good effect.
  3.  The bad effect must not be the means to the good effect.
  4.  There must be a proportionate reason for allowing the bad effect.

  Notice what is missing? **Authority.**

  Modern DDE assumes that if you check those four boxes, the act is permissible. Aquinas would say: "Not so fast. Do you actually have the *standing* to make this decision?"

  For Aquinas, DDE is not a magic wand that makes killing okay just because you "didn't mean it." It operates within a hierarchy of natural law. A private citizen cannot use DDE to justify killing someone to save five others (the classic Trolley Problem), because a private citizen does not have the authority to weigh lives and execute the one to save the many. That is a calculation for "public authority" (God or the State), not the individual.

  ### Applying This to Your Self-Driving Car Debate
  This is where it gets spicy for your work argument.

  If you program an Autonomous Vehicle (AV) to **sacrifice its passenger** to save a larger number of pedestrians, you are programming the car to *intend* the death of the passenger as a means to save the group.

  *   **Under Modern Secular DDE:** Utilitarians might argue this is fine (greater good). Deontologists might argue it violates the passenger's rights. DDE users might argue about whether the death is a "means" or a "side effect."
  *   **Under Aquinas's Framework:** The AV is a private instrument, akin to a private citizen. It does not have "public authority." Therefore, it falls under **Track 1**.
      *   It cannot *intend* the death of the passenger.
      *   It is bound to "take more care of one's own life [or charge] than of another's."
      *   To program the car to deliberately kill the passenger would be to give a private machine the authority of a public judge (weighing lives and executing one for the many), which it does not possess.

  Conversely, if the car swerves to avoid a child and hits a wall, killing the passenger:
  *   **Intention:** Save the child / Avoid the obstacle.
  *   **Effect:** Passenger dies.
  *   **Verdict:** This *might* be permissible under Track 1, provided the death wasn't the *means* to saving the child, but rather a tragic side effect of the evasive maneuver.

  ### Summary
  You didn't miss the point; you found the boundary condition.

  1.  **Private Self-Defense:** Justified by natural instinct. Killing must be **unintended**. (This is the DDE everyone talks about).
  2.  **Public Defense/Justice:** Justified by delegation of authority. Killing can be **intended**, but only for the common good.

  The reason Aquinas needs the second rule is that without it, there is no way to justify war or capital punishment. If *no one* can intend death, society cannot defend itself against organized threats or punish grave evils. But he restricts that power strictly to public officials to prevent private vendettas.

  So, in your debate: If your coworker wants to use Aquinas to justify an AV sacrificing a passenger for the "greater good," they are misapplying the text. Aquinas would likely say a private vehicle has no authority to make that trade-off. The "intend vs. foresee" distinction only works if you also ask: **"Who are you to decide?"**
