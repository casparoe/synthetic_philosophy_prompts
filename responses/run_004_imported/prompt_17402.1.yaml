answer: |-
  **MEMORANDUM**

  **TO:** Computer Science Society Membership, Tournament Competitors, and Faculty Advisor
  **FROM:** Rules Committee (Fall Tournament Division)
  **DATE:** October 24, 2023
  **SUBJECT:** Ruling on Dispute Regarding Fall Tournament Bot Conduct and Future Format Specifications

  ### 1. Purpose
  This memo serves as the formal ruling by the Rules Committee regarding the complaint filed by a third-party competitor against the first and second-place entries in this year's Prisoner's Dilemma Bot Tournament. The complaint alleges that the top two entries engaged in collusion by submitting identical source code designed to cooperate only with one another. This document outlines the Committee's analysis, the final decision on the current standings, and the revised rule set for next year's tournament.

  ### 2. Background and Technical Context
  This year's tournament utilized a "Program Equilibrium" format. Unlike classical Iterated Prisoner's Dilemma tournaments, agents were permitted to inspect their opponent's source code prior to selecting an action (Cooperate or Defect). The theoretical goal of this format is to explore "open-source game theory," where cooperation is achieved not through repeated interaction, but through logical verification of an opponent's decision-making process.

  **The Disputed Strategy (The "CliqueBot"):**
  The first and second-place entries, submitted by two students who collaborated on the design, utilized a strategy we will term `CliqueBot`. The logic was as follows:
  *   Strip comments and whitespace from the opponent's source code.
  *   Compare the result to its own source code.
  *   **If Identical:** Cooperate.
  *   **If Different:** Defect.

  Because the two students submitted identical files, their bots recognized each other and cooperated, securing high mutual payoffs. Against all other bots, they defected, minimizing opponent scores while maintaining a high average score for themselves.

  **The Comparator Strategy (The "Löbian Bot"):**
  A fourth competitor submitted a bot utilizing a proof-searcher inspired by Löb's Theorem (similar to the "FairBot" or "PrudentBot" architectures in literature). This bot cooperates only if it can mathematically verify that the opponent will cooperate with *it*. Crucially, this bot successfully cooperated with several *different* codebases that satisfied its logical conditions, without requiring code identity.

  **The Complaint:**
  The complainant argues that `CliqueBot` constitutes collusion disguised as strategy. They assert that cooperation based on file identity relies on out-of-band coordination (friendship/agreement) rather than in-game reasoning, effectively creating a private signaling channel forbidden by the spirit of the competition.

  **The Defense:**
  The accused students argue that they violated no written rules. They exchanged no information after the tournament began. They utilized the code-visibility mechanic exactly as provided: reading the opponent's code and conditioning their move on it. They argue that penalizing them would punish successful exploitation of the provided mechanics.

  ### 3. Committee Analysis
  The Committee has deliberated on the distinction between *syntactic identity* (CliqueBot) and *semantic verification* (Löbian Bot), and whether the former constitutes impermissible collusion.

  **A. The Distinction Between Identity and Behavior**
  The Committee accepts the technical distinction raised in the defense, but acknowledges the validity of the complainant's concern.
  *   **Semantic Verification (Löbian):** This approach tests *what the code does*. It asks, "Will you cooperate with me?" It allows for cooperation between strangers with different code structures, provided they share a logical commitment to cooperation. This aligns with the tournament's educational goal of exploring robust cooperation.
  *   **Syntactic Identity (CliqueBot):** This approach tests *who the code is*. It asks, "Are you me?" It does not verify if the opponent is cooperative; it only verifies if the opponent is identical. This strategy creates a closed loop. It cannot cooperate with a stranger, even if that stranger is provably cooperative. It relies entirely on pre-tournament coordination to ensure the code matches.

  **B. The Collusion Question**
  In classical game theory, collusion involves communication during the game to fix outcomes. In Program Equilibrium, the source code *is* the communication. However, `CliqueBot` treats the source code not as a message to be interpreted, but as a password to be matched.
  While this feels like collusion, it is technically a valid use of the *current* rules. The students did not communicate *during* the round. They coordinated *before* the round, which is generally permissible in design phases unless explicitly forbidden. To disqualify them now would be to apply a standard that was not codified prior to submission.

  **C. The Spirit of the Tournament**
  While the `CliqueBot` strategy is valid under the letter of the rules, it undermines the intellectual purpose of the tournament. The goal of Open-Source Game Theory is to demonstrate how transparency allows *rational agents* to find cooperation. `CliqueBot` bypasses rationality entirely; it replaces reasoning with recognition. It turns the tournament into a contest of who can coordinate the best pre-game cartel, rather than who can design the most robust cooperative agent.

  ### 4. Ruling on Current Standings
  **The complaint is Dismissed.**

  The Committee rules that the first and second-place standings shall **remain unchanged**.

  **Reasoning:**
  1.  **Principle of Legality:** Competitors must be able to rely on the rules as written at the time of submission. No rule explicitly prohibited direct source code comparison or pre-tournament collaboration on code structure.
  2.  **Mechanic Utilization:** The accused students utilized the code-visibility mechanic provided by the format. While their use was reductionist, it was not technically illicit.
  3.  **Precedent:** Retroactive disqualification for a "spirit of the game" violation, where the letter of the game was followed, sets a dangerous precedent for future Society tournaments.

  The prize fund will be distributed according to the current standings. The Committee acknowledges the frustration this causes the third-party competitor, but maintains that governance requires consistency even when loopholes are exploited.

  ### 5. Revised Rules for Next Year's Tournament
  To preserve the intellectual integrity of the Program Equilibrium format while preventing closed-loop cartels, the Rules Committee is implementing the following constraints for the next tournament:

  **Rule 4.1: Prohibition on Direct Source Comparison**
  Bots are prohibited from performing string matching, hashing, or direct comparison of the opponent's raw source code against their own. Functions such as `get_source_code()` may be used, but the output must be processed through a simulator or logical prover, not compared for equality.

  **Rule 4.2: Requirement for Behavioral Verification**
  Cooperation decisions must be derived from an analysis of the opponent's *behavior* or *logical output*, not their *identity*.
  *   *Permitted:* Simulating the opponent against a test case; searching for a proof that the opponent cooperates; analyzing the opponent's decision tree.
  *   *Prohibited:* Checking if the opponent's file hash matches a whitelist; checking if the opponent's code is byte-for-byte identical to self.

  **Rule 4.3: Collaboration Disclosure**
  While pre-tournament collaboration on general strategy is permitted, any competitors who co-author code or share specific implementation details must declare this partnership upon registration. Declared partnerships will be subject to a "Handicap Clause," where their bots are forced to Defect against each other to prevent point-sharing loops, or they will be entered into a separate "Team Division."

  ### 6. Conclusion
  The Committee recognizes that the `CliqueBot` strategy highlighted a vulnerability in our format design. We thank the complainant for bringing the ethical implications to our attention, and we thank the accused students for demonstrating the limits of the current ruleset. Their success proves that without constraints on *how* code is analyzed, transparency can lead to exclusion rather than cooperation.

  By distinguishing between *syntactic identity* (which we are banning) and *semantic verification* (which we are encouraging), we aim to ensure next year's tournament rewards the reasoning capabilities of the agents, not the coordination capabilities of their authors.

  **Signed,**

  The Rules Committee
  Computer Science Society
