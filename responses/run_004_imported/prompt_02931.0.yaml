answer: |-
  You are absolutely not overthinking this. In fact, you've put your finger on a fascinating intersection of psychology, workplace ethics, and self-preservation.

  What you're describing is a very real phenomenon, and the unease you feel is a valid signal from your brain that something complex is happening. Let's break down why this worked, why it bugs you, and whether it matters.

  ### 1. Why it worked: Cognitive Dissonance and Reframing
  Psychologically, you leveraged **Cognitive Dissonance**. This is the mental discomfort experienced when holding two conflicting beliefs or values (e.g., "On-call is miserable" vs. "I need to act enthusiastic to get a bonus").

  To resolve that tension, your brain had two choices:
  1.  Stop acting enthusiastic (and lose the bonus).
  2.  Change your belief about on-call (and keep the bonus).

  Your brain chose option 2. This is also related to the concept of **Internalization**. You started with *extrinsic motivation* (the bonus/promo), but by changing your narrative to justify the behavior, you partially converted it into *intrinsic motivation* (less dread).

  Additionally, you used a **Stoic reframing technique**. The Stoics argue that we suffer not from events, but from our judgment of events. By changing your judgment ("This is an opportunity to demonstrate reliability" vs. "This is an interruption of my life"), you reduced the suffering.

  ### 2. Why it bugs you: The Authenticity Gap
  The reason this feels icky is that it blurs the line between **agency** and **conditioning**.

  *   **Agency:** "I choose to find peace with this unavoidable task so I can sleep better."
  *   **Conditioning:** "I am being trained to enjoy my own exploitation so the company saves money on better tooling or headcount."

  Your intuition is warning you that your happiness is now tied to a reward structure that incentivizes *performance* over *reality*. The fact that leadership ties a bonus to **enthusiasm in retros** is the specific red flag here. Retrospectives are supposed to be safe spaces to identify friction and process failures. If you are rewarded for smiling through the friction, the feedback loop is broken.

  You feel uneasy because part of you knows that **on-call *should* be boring, not "enjoyable."** If you are enjoying it, are you lowering your standards for what constitutes a healthy incident response?

  ### 3. Does it matter if the feeling is "real"?
  **For your mental health:** No, it doesn't matter. If the dread is gone, your cortisol levels are lower, and you sleep better during your off-weeks, that is a genuine win. Suffering unnecessarily is not a virtue. If "faking it till you make it" results in actually making it, the physiological benefit is real.

  **For your career and integrity:** Yes, it matters. Here is the risk: **If you convince yourself the crappy parts are actually good, you stop trying to fix them.**

  *   **Scenario A (Healthy):** You accept that paging happens, but you automate the hell out of it so it doesn't wake you up. You "like" on-call because it's now just a dashboard you check calmly.
  *   **Scenario B (Unhealthy):** You accept that waking up at 3 AM is "character building." You stop flagging the alert fatigue because you've conditioned yourself to enjoy the chaos.

  The danger isn't that you lied to yourself; the danger is that you might have disarmed your own critical faculty.

  ### 4. Is it inconsistent to like something for external reasons?
  Philosophically, this is the **Overjustification Effect** (usually, adding a reward kills intrinsic interest, but you experienced the reverse).

  It is not inconsistent. Human values are rarely pure. We value many things because they lead to other things (e.g., we value exercise because we value health, not necessarily because we love the act of running).

  However, it becomes inconsistent if your stated values clash with your actions. If you tell your team "On-call is great!" to get the bonus, but privately you know the alerting system is broken and you discourage others from fixing it to maintain the status quo, that is dishonesty. If you say "I've found a way to make peace with this" while still advocating for better tooling, that is integrity.

  ### The Verdict
  You haven't necessarily "faked it." You have successfully **hacked your own reward system** to reduce stress. That is a powerful engineering skill applied to your own psyche.

  **However, keep this boundary in place:**
  Allow yourself to find peace with the *unavoidable* friction of the job. Do not allow yourself to find peace with *systemic* negligence.

  *   **Good:** "I enjoy the quiet focus of a 3 AM debug session because it makes me feel competent."
  *   **Bad:** "I enjoy being woken up at 3 AM five times a week because it shows I'm dedicated."

  **My advice:**
  Keep the mindset that reduces your dread—it's a gift to your future self. But keep a separate, critical part of your brain active during those retros. You can be "enthusiastic" about your own resilience while still being ruthless about fixing the root causes that require resilience in the first place.

  If leadership only rewards the enthusiasm but ignores the fixes, that's on them. Just make sure you don't become the person who tells the next new hire, "Don't worry, you'll learn to love the pages," when what they really need is to fix the pager.
