      *   *Interpretation:* Choosing a UTM is equivalent to choosing a reference class or a set of background assumptions.
      *   *Is this bad?* Not necessarily. All induction requires *some* prior assumptions (No Free Lunch Theorem).
      *   *Resolution:* Occam's Razor isn't a metaphysical truth about the universe being simple; it's a statement about *learning efficiency*. Simpler hypotheses are easier to falsify and require less data to confirm *relative to the chosen encoding*.
