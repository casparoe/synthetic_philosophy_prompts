      *   *Solomonoff Induction:* A framework for prediction. Assigns prior probability to hypotheses (strings/programs).
      *   *The Link:* Shorter programs get higher probability. Specifically, $P(x) \approx 2^{-K(x)}$.
      *   *Why?* If you generate random bits for a program, shorter programs are exponentially more likely to occur by chance than longer ones. This is the "Universal Distribution" ($M(x)$).
      *   *Key takeaway:* Simplicity = Compressibility.

  3.  **Part 2: The Choice-of-Machine Objection:**
