      *   **Administrator's View:** *Deontology* (Kantian ethics) or *Threshold Deontology*. Certain duties (protecting life) are absolute or have a threshold that cannot be crossed by aggregating minor benefits. Also touches on *Incommensurability* (some values cannot be compared on the same scale).
