answer: |-
  This is a fantastic question. You have stumbled onto one of the oldest and most difficult problems in moral philosophy and public policy. The disagreement between you (and your friend) and the assistant principal isn't just about fire drills; it is a clash between two different ethical "operating systems."

  Neither side is necessarily stupid or dishonest. You are arguing from a framework of **Consequentialism (specifically Utilitarianism)**, while the administrator is arguing from a framework of **Deontology (specifically regarding Incommensurability and Duty).**

  Here is the breakdown of the principles behind both sides, and whether the administrator's claim holds water.

  ### 1. Your Framework: Aggregation and Expected Value
  Your argument relies on the principle of **aggregation**. In economics and utilitarian ethics, all costs and benefits can theoretically be converted into a common currency (utility, dollars, time, risk) and summed up.

  *   **The Math:** You calculated the "Expected Cost" of the drills (650,000 minutes). You weighed this against the "Expected Benefit" (risk reduction).
  *   **The Principle:** If $Cost_{drills} > (Probability_{fire} \times Cost_{fire})$, then the drills are irrational.
  *   **The Friend's Point:** Your friend is correct that society does this constantly. The "Value of a Statistical Life" (VSL) is used by government agencies to set speed limits, pollution standards, and guardrail heights. We implicitly decide that saving 10 minutes of commute time for a million people is worth a statistically higher chance of one fatal accident.

  From this viewpoint, the administrator's refusal to do the math *is* an evasion. If safety were truly absolute, we would ban cars, close the school, and pad every wall. Since we don't, we are already making trade-offs.

  ### 2. The Administrator's Framework: Incommensurability and Duty
  The administrator's claim—"no quantity of the first can ever add up to justify accepting more risk of the second"—is a defense of **Incommensurability**.

  This principle suggests that some values belong to different categories and cannot be measured on the same scale.
  *   **Category Error:** To her, "instructional time" and "student life" are not just different amounts of the same thing; they are different *kinds* of things. Comparing them is like asking, "How many grams of happiness equal one meter of length?"
  *   **Lexical Priority:** In political philosophy (most notably John Rawls), some goods have "lexical priority." This means you must satisfy the first good (safety) completely before you are even allowed to consider the second good (efficiency). You cannot trade a slice of the priority good for a mountain of the secondary good.
  *   **The Duty of Care:** Schools operate under a specific legal and moral "duty of care." When parents send children to school, the school acts *in loco parentis* (in place of the parent). A parent's primary duty is protection, not efficiency. If a parent skipped a fire drill to get 10 minutes of extra tutoring, we might question their judgment. The administrator is arguing that the institution inherits this absolute duty.

  ### 3. Is the Administrator's Principle Defensible?
  Is she right that "no number" adds up? Or is that just a comforting instinct?

  **The Defense:**
  There is a strong philosophical argument called the **Separateness of Persons**. Utilitarianism treats society as one big container of "utility." If 1,800 students lose 10 minutes, that's a "cloud" of annoyance. If one student dies, that's a "cloud" of tragedy. Utilitarianism weighs the clouds.
  However, Deontology argues that individuals have rights that cannot be violated for the greater good. You cannot sacrifice *one* person's safety to save *time* for the group. By reducing drills, you are essentially saying, "We are willing to use Student X as a sacrificial lamb to save the rest of us 10 minutes." The administrator is refusing to accept that bargain, regardless of the odds.

  **The Weakness:**
  The weakness in her position is **Threshold Deontology**. Most philosophers agree that while rights are important, they aren't *infinitely* absolute.
  *   *Example:* If reducing fire drills from 9 to 8 saved a billion dollars that would otherwise cause the school to close, putting 1,800 students out of education, surely the trade-off is worth it?
  *   At some point, the "small cost" becomes so massive that it *does* outweigh the risk. The administrator's statement ("no quantity... can ever add up") is likely a rhetorical heuristic (a rule of thumb) rather than a literal philosophical truth. She is drawing a bright line to prevent "slippery slope" reasoning, but your friend is right that the line has to exist somewhere.

  ### 4. The "Black Swan" Problem
  There is one more element where your statistics might be fighting a losing battle against her intuition: **Fat-Tailed Risk.**

  In AP Stats, you deal with normal distributions. But catastrophic risks (fires, pandemics, structural collapses) are not normal distributions. They are "fat-tailed."
  *   The fact that a fire hasn't happened in 30 years doesn't mean the probability is low; it might mean the school has been lucky.
  *   In risk management, the cost of a "ruin" event (death) is effectively infinite. If you multiply *any* non-zero probability by *infinite* cost, the result is infinite.
  *   Therefore, mathematically, you cannot balance a finite cost (time) against an infinite cost (death), unless you cap the value of a life (which society does, but schools often refuse to do explicitly).

  ### The Verdict on the Disagreement
  To answer your specific question: **Yes, there is a real, defensible principle behind her idea.** It is not merely a cop-out.

  The principle is that **institutional duties regarding safety are non-negotiable constraints, not variables in an optimization equation.**

  However, your friend is also right that **consistency matters.** If the school accepts risk elsewhere (e.g., allowing students to drive to school, which is statistically far more dangerous than a fire), then claiming "absolute safety" for fire drills is inconsistent.

  **Where the middle ground lies:**
  The disagreement isn't actually about *whether* to trade safety for time (we all do that). The disagreement is about **who bears the cost and who reaps the benefit.**
  *   **Fire Drills:** The cost (time) is spread across everyone. The benefit (safety) is concentrated on the potential victim.
  *   **Speed Limits:** The cost (time) is concentrated on the driver. The benefit (safety) is spread across the public.

  The administrator is likely digging in because if she admits the trade-off is valid, she opens the school to liability. If she says, "We calculated that 5 students dying is worth saving 10,000 hours of class time," she is morally and legally finished. By saying "Safety is absolute," she protects the institution's ethical standing, even if the policy is inefficient.

  ### Summary
  You are arguing from **Efficiency** (maximizing the good). She is arguing from **Obligation** (fulfilling the duty).
  *   **You:** "Is this the best use of our time?"
  *   **Her:** "Are we keeping our promise to protect these children?"

  In a perfect world, you would find the point where the marginal safety benefit of the 9th drill is actually zero (maybe everyone already knows the route), and cut it there. But her refusal to weigh "minutes" against "lives" is a standard, defensible ethical stance known as **lexical priority**, not just a refusal to do math. She is asserting that some columns in the spreadsheet cannot be summed together.
