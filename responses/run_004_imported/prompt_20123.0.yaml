answer: |-
  This is a classic bargaining problem, and your discomfort is warranted: the mediator is invoking a specific solution concept from game theory and moral philosophy without naming it, which makes it sound like obfuscation to your sister. However, her skepticism is also philosophically grounded.

  Here is the verdict: **The mediator's rule has a genuine, principled basis, but it requires transparent inputs to be accepted.** It is not arbitrary, but it is not "self-evident" without understanding the underlying theory of cooperative surplus.

  ### 1. The Principled Basis: The Kalai-Smorodinsky Solution

  The rule your mediator proposed is a variation of the **Kalai-Smorodinsky bargaining solution**. In negotiation theory, you start with a **Disagreement Point** (your fallback: $\$550,000$ each) and an **Ideal Point** (your respective best outcomes).

  The core philosophical argument rests on how you define the "pie" you are splitting.
  *   **Your Sister's View (Equal Market Value):** She likely believes fairness means dividing the *market assets* equally. If she gets the store and you get the cabin, she should pay you enough cash so that you both hold $\$550,000$ in market value.
  *   **The Flaw:** This ignores the **Cooperative Surplus**. The estate is worth more to *you* together than it is on the open market because of your specific valuations (sentiment for the cabin, business utility for the store). If she keeps the store and pays you only market value, she captures 100% of the business surplus she generates, while you capture 100% of the sentiment surplus. Since she admits her business potential is "substantially more" valuable than your sentiment, this outcome leaves her with significantly more *total value* than you, despite the market split being even.
  *   **The Mediator's View (Equal Relative Gain):** The mediator argues that the *surplus value created by avoiding the sale* belongs to both of you equally, relative to your potential. By matching percentages, you are equalizing the **ratio of actual gain to maximum possible gain**.

  **Why this is fair (The Argument for You):**
  This aligns with David Gauthier's principle of **Equal Relative Concession**. Rational agents agree to cooperate only if they minimize the maximum relative concession each must make. By matching percentages, you both concede the same *proportion* of your ideal claim. If her ideal gain is $\$1,000,000$ and yours is $\$100,000$, a 50% match gives her $\$500,000$ and you $\$50,000$. She gets more in absolute dollars (acknowledging her larger opportunity), but you are treated equally in terms of *satisfaction*.

  **Why your Sister is worried (The Argument for Her):**
  She suspects this is a "tax on efficiency." If she is rewarded for her ability to generate value from the store, she should keep that upside. She may view the "percentage rule" as a mechanism that forces her to subsidize your sentiment because your potential upside is lower. She prefers a rule that rewards absolute productivity (Equal Dollar Gain) or simple market equity.

  ### 2. Is Her Suspicion Justified?

  Partially. The rule is only as good as the "Best Outcome" numbers you plug into it.
  *   **The Vulnerability:** The mediator's rule relies on **honest revelation of preferences**. If you inflate the value of the cabin (sentimentally), you skew the percentage. If she inflates the store's potential, she skews it.
  *   **The "Arbitrary" Charge:** It feels arbitrary because it requires comparing incommensurables (business profit vs. sentimental value). However, *any* division requires this comparison. The mediator's rule is actually *less* arbitrary than splitting market value, because it acknowledges that market value is not the only source of worth in an inheritance.

  ### 3. Advice on How to Proceed

  As a philosopher, you know that a principle is useless without a procedure. Do not try to win the argument on theory alone; your sister is pragmatic. Instead, use the theory to structure a transparent process.

  **Step 1: Formalize the "Fallback" and "Ideal"**
  Sit down and write out the numbers explicitly.
  *   **Fallback ($D$):** $\$550,000$ each (Liquidation).
  *   **Your Ideal ($U_{max}$):** Market value of Cabin + Cash for repairs + Sentiment Premium. *You must quantify the sentiment.* If the roof costs $\$50k$ to fix, but you value the cabin at $\$800k$ because of memories, state that clearly.
  *   **Her Ideal ($S_{max}$):** Market value of Store + Capital for expansion + Business Premium. *She must quantify the expansion value.*

  **Step 2: Run Two Calculations**
  Don't just present the mediator's rule. Present two options side-by-side:
  1.  **Equal Market Value:** She gets Store, You get Cabin. Cash is transferred so you both have $\$550k$ in assets. Calculate the *total value* each of you receives (including sentiment/business potential).
  2.  **Equal Relative Gain (Mediator):** Calculate the percentage $p$ where you both achieve the same % of your Ideal Gain. Calculate the cash transfer required to make this happen.

  **Step 3: The "Envy Test"**
  Ask your sister: "In the Equal Market Value scenario, if I know you are generating $\$2M$ in value from the store while I am generating $\$600k$ from the cabin, will I feel resentful that my agreement allowed you to keep that extra $\$1.4M$?"
  Ask yourself: "In the Mediator scenario, am I claiming a sentiment value that is defensible, or am I padding the numbers?"

  **Step 4: The Recommendation**
  Advise her to accept the **Mediator's Percentage Rule**, but with a **cap on subjective valuation**.
  *   **Why:** It is the only rule that acknowledges that *both* of you hold veto power over the liquidation. The surplus exists only because you both agreed not to sell. Therefore, the surplus should be shared.
  *   **The Compromise:** To address her fear of arbitrariness, agree to use **third-party appraisals** for the market values of the store and cabin, and limit the "sentiment/business premium" to a mutually agreed-upon fixed percentage or cap.

  **Final Verdict:**
  The mediator is philosophically correct: fairness in cooperation requires sharing the *benefits of cooperation* (the surplus), not just the *assets*. Splitting market value 50/50 ignores the surplus. However, you must validate the inputs. Tell your sister: *"The rule isn't about equal dollars; it's about equal opportunity to benefit from our father's estate relative to our needs. If your business potential is larger, you should get more dollars, but I should get the same level of satisfaction. Let's calculate the numbers transparently and see if the result feels right."*

  If the resulting cash transfer is too steep for her, consider the **Nash Bargaining Solution** (maximizing the *product* of your gains) as a middle ground. It is slightly more favorable to the party with the larger surplus (her) while still ensuring you gain over the fallback. It is often viewed as the standard for "rational fairness."
