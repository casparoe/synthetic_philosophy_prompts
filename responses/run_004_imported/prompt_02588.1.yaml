answer: |-
  The chair was cold, a stark contrast to the humming warmth of the Prism standing before Elias. It looked less like a machine and more like a shard of obsidian glass, suspended in a magnetic field, vibrating at a frequency Elias could feel in his teeth.

  "Remember," Dr. Aris said, adjusting the haptic interface on his wrist. "In World A, this timeline, your cellular degradation is terminal. We've known that for three months. In World B, the branching timeline we are about to puncture, the degradation never occurred. The biology is identical. The memories are identical. The man who wakes up on the other side *is* you, in every meaningful sense."

  Elias gripped the armrests. "In every meaningful sense," he repeated. "But not in *every* sense. Because I won't be there to wake up."

  Aris sighed, the sound of a man who had explained this a thousand times to patients who couldn't grasp the metaphysics. "This is the Lewisian objection again, Elias. You're clinging to a magical notion of 'haecceity.' A 'this-ness.' David Lewis taught us that identity across worlds is a matter of similarity, not literal sameness. Your counterpart in World B resembles you so closely that for all practical and philosophical purposes, he is you. He will finish your concerto. He will hold your wife's hand. He will grow old."

  "He will," Elias said softly. "I won't."

  "You're treating your counterpart like a stranger. Like Hubert Humphrey worrying about a man in a distant universe who looks like him winning an election he lost. But this isn't a distant universe. It's a branching reality. We are stitching the branches."

  Elias looked at his hands. They were spotted with age, though he was only fifty. The illness had accelerated everything. "If I shoot a gun at my head, and a duplicate pops into existence somewhere else unharmed, have I survived? Or have I just been replaced?"

  "You're focusing on the discontinuity of consciousness," Aris said, impatient. "But consciousness is a pattern. The pattern continues. The music continues. Does the melody die when the violin string breaks, if the same note is immediately played on a new violin?"

  "The listener hears the melody," Elias said. "The string doesn't hear anything."

  Aris checked the readouts. "We have to initiate the divergence soon. The window is closing. If you step into the field, the Prism collapses the probability wave. World A-Elias dissolves. World B-Elias materializes in a hospital bed three hundred miles away, healthy. He will feel relief. He will feel joy. He will feel that he has been saved."

  "But *I* will feel nothing," Elias said. "Because *I* am here. In the chair. In the world where I dissolve."

  "This is the dread of the transworld identity theorist," Aris muttered, typing a command. "You want a soul-thread that pierces through the multiverse. We don't have that. We have physics. We have similarity. We have continuity of information. Is that not enough? Is the love your wife feels for the man on the other side not real love? Is the music he writes not your music?"

  "It is his music," Elias said. "He has my memories of writing the first movement. He has my scars. He has my grief. But he does not have my future. He has *a* future. I have an end."

  Elias looked at the obsidian shard. It was seductive. To know that the work would be done. To know that the grief inflicted on his family would be mitigated by the presence of a healthy father, a healthy husband. It was a utilitarian paradise. A Lewisian heaven where the sum of 'Elias-happiness' is maximized across the modal realism of the situation.

  But the cold in his bones was Kripkean. It was the intuition that *he* was a rigid designator. That there was a specific point of view, located behind his eyes, that was about to be extinguished. The comfort Aris offered was the comfort of legacy, disguised as survival. It was the difference between "I will live" and "Someone like me will live."

  "Does it matter?" Aris asked, his voice softer now. "If he lives, and he remembers being you, and he loves the people you love... does the extinction of this specific instance of matter truly negate the continuation of the life?"

  "Yes," Elias said. "Because I am afraid of the dark. Not the world's dark. *My* dark."

  He stood up. His legs shook. The illness was in the final stages; standing was a triumph of will over chemistry. He walked toward the Prism. The hum grew louder, a chorus of voices whispering in a language he almost understood.

  "If I step in," Elias said, pausing at the threshold of the light, "and he wakes up... will he know?"

  "Know what?"

  "Will he know that I died to let him live? Or will he just think he got lucky?"

  "He will think he got lucky," Aris said. "His causal history will diverge at the quantum level. He will believe he survived the illness naturally. He will not carry the memory of this room. He will not carry the memory of this choice."

  Elias closed his eyes. So, the counterpart would be happy. He would be relieved. He would sit at the piano and finish the second movement. He would laugh at dinner. He would feel the sun on his face.

  And Elias would be dust.

  The temptation was overwhelming. To trade this moment of terror for the certainty of that future joy. To say, *Let the counterpart win.* To accept that "Elias" is a category, not a singular point. If he accepted Lewis, he could step forward without fear. He could view his own death as a mere shedding of a world-index, not an end of self.

  But if Kripke was right, if identity was absolute and unbridgeable, then stepping into the light was suicide. It was arranging for a stranger to wear his clothes and comfort his wife. It was a cosmic bait-and-switch.

  He looked at Aris. "You believe this works."

  "I believe it is the only way you continue," Aris said.

  "Or the only way *something* continues," Elias corrected.

  He stepped forward. The light washed over him. It wasn't painful. It was a sensation of unspooling, like a knot being gently pulled apart. He felt his boundaries softening. The cold in his bones vanished, replaced by a strange, diffused warmth.

  For a second, he wasn't sure where he ended and the machine began. He thought of the concerto. He thought of the specific weight of his wife's hand in his. He tried to hold onto the *I*.

  *I am here.*

  But the *here* was expanding. There was a hospital room. There was a smell of antiseptic. There was a feeling of deep, lung-filling breath.

  Elias—the one in the chair—felt a surge of jealousy. That breath belonged to the other one. That relief was not his.

  And yet, as the darkness took the chair, as the consciousness in the lab began to fragment and fade, a final thought drifted through the dissolving mind. It was a thought that belonged to neither Lewis nor Kripke, but to a man facing the end.

  *If he plays the music, does it matter who holds the pen?*

  The light flared white. The hum ceased.

  In the laboratory, the chair was empty. The obsidian shard was still.

  Three hundred miles away, in a world that had branched off seconds ago, a man in a hospital bed opened his eyes. He took a deep breath, surprised by the lack of pain. He felt a profound sense of gratitude, a inexplicable luck that he couldn't quite name. He reached for the call button, eager to tell the nurse that he was ready to go home. He was ready to work.

  He did not know he was a counterpart. He did not know he was a survivor. He only knew that he was Elias, and he was alive.

  And in the silence between the two worlds, the question hung, unanswered: Was that enough?
