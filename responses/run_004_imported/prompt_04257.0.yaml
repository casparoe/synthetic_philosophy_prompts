answer: |-
  **Title:** The Idle Principle: Why Jaynes's Invariance Solution Buried Indifference Rather Than Resurrecting It

  **To:** Bayesian Foundations Reading Group
  **From:** [Your Name]
  **Re:** The Status of the Principle of Indifference Post-Jaynes

  The debate in our last session recapitulates a century of friction between logical and subjective interpretations of probability. Your position, echoing Jaynes's *The Well-Posed Problem* (1973), is that Bertrand's Paradox is not a failure of the Principle of Indifference (POI), but a failure of problem specification. Once we identify the correct invariance group (rotation, translation, scale) implied by the physical experimental setup (the "straw toss"), the measure is unique ($p=1/2$), and POI is vindicated as a rational requirement.

  My contention is that this vindication is illusory. While Jaynes successfully salvaged *objective prior construction* as a mathematical practice, he did so by gutting the Principle of Indifference of its philosophical core. Shackel (2007) is correct: the selection of the invariance group constitutes substantive physical information. If the "work" of determining the prior is done by the invariance group, and the invariance group is derived from empirical or structural assumptions rather than pure ignorance, then POI is idle. It is not a free-standing requirement of rationality; it is a consistency constraint applied *after* modeling assumptions have already done the heavy lifting.

  This essay argues that Jaynes's resolution pushes the problem up a level, transforming POI from a logical principle of ignorance into a methodological principle of model consistency. Consequently, for continuous parameter spaces, we should abandon POI as a foundational justification and rely instead on information-geometric approaches (like Jeffreys or Reference priors) that explicitly acknowledge the dependence on the likelihood structure rather than pretending to derive priors from ignorance alone.

  ### 1. The Jaynesian Defense: Invariance as Ignorance

  To steelman your advisor's position: Jaynes argues that "ignorance" is not a blank slate. To be ignorant about a chord's length is to be ignorant *relative to the symmetries of the circle*. If the physical method of generating chords is invariant under rotation, then the probability distribution must be invariant under rotation. If it is invariant under scale (the size of the circle shouldn't matter), the prior must respect that.

  Mathematically, this is powerful. It turns the ambiguity of Bertrand's Paradox into a solvable functional equation. By demanding invariance under the group of transformations that leave the problem unchanged, Jaynes derives a unique measure. In the straw-tossing case, this yields the "random radius" solution ($p=1/2$), which matches empirical data.

  From this view, POI is not "assign equal probability to everything." It is "assign a measure that remains unchanged under transformations that represent your lack of knowledge about specific location/scale." This rescues Objective Bayesianism from the charge of arbitrariness. It suggests that if two rational agents agree on the problem's symmetries, they must agree on the prior.

  ### 2. The Skeptical Attack: Van Fraassen and Shackel

  However, this defense crumbles when we examine where the invariance group comes from. This is where van Fraassen's *Cube Factory* and Shackel's critique become fatal to POI as a *logical* principle.

  **Van Fraassen's Cube:** Consider a factory producing cubes with side length $s \in [0, 1]$. If we are ignorant of $s$, POI suggests $P(s) \sim U[0,1]$. But if we are ignorant of surface area $A = 6s^2$, POI suggests $P(A) \sim U[0,6]$, which implies a non-uniform distribution on $s$. If we are ignorant of volume $V = s^3$, we get yet another distribution.
  Jaynes would respond: "Which parameterization respects the symmetries of the manufacturing process?" But this begs the question. In the absence of specific physical data about the machine, why is side length the "natural" parameter? Why not volume? The choice of parameterization *is* the choice of the invariance group. Van Fraassen demonstrates that without empirical input, there is no logical basis to prefer one parameterization over another. The "indifference" is always relative to a specific description of the state space, and logic alone does not dictate that description.

  **Shackel's Dilemma:** Shackel (2007) sharpens this into a dilemma for Jaynes.
  1.  If the invariance group is determined by *logical* analysis of the problem statement alone, Bertrand's Paradox remains, because the problem statement ("random chord") is compatible with multiple groups (endpoints, midpoints, radius).
  2.  If the invariance group is determined by *physical* facts (e.g., how straws are actually tossed), then the prior is derived from empirical information, not ignorance.

  In the straw-tossing example, knowing that the process is translation and scale invariant *is* knowledge. It rules out mechanisms where straws are aimed at the center or cut to fit the diameter. If we possess this knowledge, we are not in a state of "pure ignorance" where POI is supposed to apply. If we *lack* this knowledge, Jaynes's method cannot select the group, and the paradox returns.

  Therefore, POI is not generating the prior. The physical model is generating the prior; POI is merely acting as a consistency check on that model. It is a constraint, not a source.

  ### 3. The Verdict: POI is Idle, Invariance is King

  Here is my specific thesis: **Jaynes's resolution does not rescue the Principle of Indifference as a principle of *ignorance*; it rescues *Invariance* as a principle of *model specification*.**

  For a Stats PhD, the distinction matters. If POI were a genuine requirement of rationality based on ignorance, it should function *ex nihilo*. It should tell us what to do when we know nothing. But Jaynes shows us that we *never* know nothing. We always know the geometry of the parameter space, the symmetries of the likelihood, or the physical generation process.

  When we use a Jeffreys prior ($\pi(\theta) \propto \sqrt{I(\theta)}$), we are not applying POI. We are applying a requirement that the prior be invariant under reparameterization of the *likelihood*. This is not based on indifference to outcomes, but on the information geometry of the statistical model. It acknowledges that "ignorance" is not a universal state but is relative to the Fisher information metric.

  Similarly, when Jaynes solves Bertrand's Paradox, he is not using ignorance to find the prior. He is using *physical symmetry* to find the prior. The "Principle of Indifference" is doing no work. You could remove the words "Principle of Indifference" from Jaynes's 1973 paper, replace them with "Principle of Transformation Groups," and the math would remain identical, but the philosophical claim would be honest: *Structure determines measure, not ignorance.*

  ### 4. Implications for Objective Bayesian Practice

  Does this undermine our practice? No. It clarifies it.

  If we cling to POI as "ignorance," we invite the paradoxes of Bertrand and van Fraassen. We pretend we are deriving priors from logic when we are actually importing structural assumptions.
  If we accept Shackel's critique, we acknowledge that **all priors are informative**, even "objective" ones. A Jeffreys prior is informative about the metric structure of the parameter space. A Jaynesian prior is informative about the symmetry group of the data generation process.

  This shifts the burden of justification. We cannot say, "I used a uniform prior because I was ignorant." We must say, "I used a uniform prior because the parameterization is location-invariant and I have no evidence to break that symmetry." The justification moves from the epistemic state of the agent (ignorance) to the structural properties of the model (invariance).

  ### Conclusion

  Your advisor is right that Jaynes solved Bertrand's Paradox mathematically. The $p=1/2$ solution is the correct one for the straw-tossing experiment. But she is wrong that this vindicates the Principle of Indifference as a foundational epistemic principle.

  Jaynes saved Objective Bayesianism by killing POI. He showed that what we thought was "indifference" was actually "invariance under known symmetries." Since identifying those symmetries requires information (physical or structural), POI is not a free-standing requirement of rationality. It is a derivative tool.

  **Verdict:** POI is rescued *only if* redefined as a consistency constraint on structural assumptions (Invariance), and *not otherwise*. As a principle of pure ignorance on continuous spaces, it is dead. We should stop invoking it as such and instead justify our priors through explicit reference to the information geometry or symmetry groups we are assuming. That is not a retreat; it is a maturation of the field.

  **References:**
  *   Jaynes, E. T. (1973). The Well-Posed Problem. *Foundations of Physics*.
  *   Shackel, N. (2007). Bertrand's Paradox and the Principle of Indifference. *Philosophy of Science*.
  *   van Fraassen, B. C. (1989). *Laws and Symmetry*. Oxford University Press.
