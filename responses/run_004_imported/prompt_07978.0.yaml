answer: |-
  Good evening, everyone. For those of you I haven't met yet, I'm [Your Name], [Brother's Name]'s sibling. And for those of you who know me professionally, don't worry—I promise to keep the jargon to a minimum. I know we're here to eat, not to attend a lecture.

  But, as some of you know, my brother asked me to say a few words. Specifically, he asked me to say a few words *about* the words people usually say at times like this.

  He told me that over the last year, almost every parent he's spoken to has told him the same thing: "Just do it. You'll love her. It's worth it." And he's been reading some philosophy—L.A. Paul, for the few of you in the back who are already nodding—about how that advice is actually kind of useless. Because the person hearing that advice is the "Before" version of him. And the person who would love her is the "After" version. The "Before" guy can't actually know what it's like to be the "After" guy. So, logically, he's stepping into the dark.

  He's right, you know. Philosophically speaking, he is absolutely right. You cannot know what this will be like until you are in it. No amount of testimony from me, or our parents, or the wise people in this room, can bridge that gap.

  But I wanted to say this, to both of you: That uncertainty isn't a bug in the system. It's the feature.

  If you could know exactly who you would become, and exactly how you would feel, without actually living the life... then this wouldn't be parenthood. It would be a transaction. The fact that you cannot know her, and she cannot know you, and none of us can know the future, is precisely why this act of adoption is so profound. You aren't choosing a specific outcome. You are choosing a *commitment* to the transformation itself.

  And that is where the rest of us come in.

  My brother's worry is that the "Before" him is making a decision for the "After" him. But looking around this table, I see the bridge. We are the continuity. When the nights are long, or the questions are hard, or the world feels uncertain, we are here to remind the "After" parents that they were loved into this role by all of us, long before Thursday ever came.

  You don't have to know what it's like to be a parent to know that you are ready to be *her* parents. And you don't have to know the future to know that she is already welcome here.

  So, to the "Before" us, and the "After" us, and most importantly, to the little girl who is making all of this philosophy necessary: Welcome home. We are so glad you're here.

  Cheers.
