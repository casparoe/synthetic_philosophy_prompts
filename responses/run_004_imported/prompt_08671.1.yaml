      *   **What Logic Misses:** The social/relational function of blame. It treats moral norms like laws of physics rather than communal agreements.
      *   **Conclusion:** Reiterate that *tu quoque* is a fallacy of *inference*, but lack of standing is a valid objection to *address*.

