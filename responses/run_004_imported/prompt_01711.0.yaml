answer: |-
  The tension you identify is the central challenge for eternalism. The resolution lies in distinguishing between **ontology** (what exists) and **epistemology** (what we can know).

  While eternalism asserts that all moments exist equally, it does not claim that all moments are equally accessible. The "arrow of time" is not a feature of the universe's existence, but a feature of our position within it. Here is how eternalism accounts for this asymmetry.

  ### 1. The Spatial Analogy (Epistemic Limitation)
  The most common defense against your objection is the analogy between time and space.
  *   **Ontological Equality:** Just as the block universe treats all *times* as real, a map treats all *locations* as real. Paris exists even if you are currently in New York.
  *   **Epistemic Asymmetry:** You cannot see Paris from New York. This lack of access is not because Paris doesn't exist; it is because you are spatially distant from it.

  In the block universe, we are "temporally distant" from the future. Our consciousness is indexed to a specific "now," and just as we must travel through space to reach Paris, we must "move" through time to reach the future. The future is real, but we are not yet there to observe it.

  ### 2. Thermodynamics (The Source of Records)
  The reason we have records of the past but not the future is rooted in the **Second Law of Thermodynamics**.
  *   **The Past Hypothesis:** The universe began in a state of extremely low entropy (high order). As time progresses, entropy increases.
  *   **Formation of Records:** A "record" (like a memory or a fossil) is a physical correlation between a current state and a past event. These correlations are only formed when entropy increases.

  Because the past is low-entropy and the future is high-entropy, the physical laws of our universe allow information to flow from order to disorder. We can "read" the past because it left traces as it decayed into disorder. The future, being a state of higher entropy, has not yet imposed order upon the present, leaving no traces for us to read.

  ### 3. Causal Structure (Light Cones)
  In Special Relativity, the structure of spacetime dictates causal access through **light cones**.
  *   **The Past Light Cone:** We can only receive information from events that have had time to reach us at the speed of light. This defines our "accessible past."
  *   **The Future Light Cone:** We can only influence events that we can reach at the speed of light.

  The "inaccessibility" of the future is a geometric constraint. We are causally locked into our present moment. We cannot see the future because light (information) from those future coordinates has not yet intersected with our current coordinates.

  ### 4. Redefining Causation
  Finally, eternalism requires a shift in how we define causation.
  *   **Standard View:** Causation is "bringing into existence." (The past creates the future).
  *   **Eternalist View:** Causation is **dependency**.

  In a block universe, the future does not need to be "created"; it already exists. Causation describes the relationship between slices of the block. The state of the universe at Time A *determines* the state at Time B. The fact that Time B exists does not mean it causes Time A; it simply means the block is structured such that B follows A.

  ### Summary
  The asymmetry you perceive is not a contradiction of eternalism, but a consequence of our perspective. The universe is a static block where all times exist, but we are dynamic observers trapped in a thermodynamic gradient, moving from low entropy to high entropy, capable only of seeing what lies behind us in our past light cone.
