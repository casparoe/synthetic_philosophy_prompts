      *   **The Problem:** The tension between the ontological equality of past/present/future (all exist) and the epistemic/causal asymmetry (we know the past, not the future; causes precede effects).
      *   **The Question:** How does eternalism account for this directionality (arrow of time) given that all times exist?

  2.  **Deconstruct the Philosophical/Physical Concepts:**
