          *   Just because I can't see what's behind the mountain doesn't mean it doesn't exist.
          *   Epistemic limitation $\neq$ Ontological non-existence.
          *   Our consciousness "moves" (or is indexed) to a specific point.

      *   *Argument 2: Thermodynamics (The Entropic Arrow).*
          *   Physics laws (mostly) are time-symmetric.
