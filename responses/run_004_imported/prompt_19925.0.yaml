answer: |-
  **The Scenario: The Impossible Negotiation**

  You're a union rep trying to secure a win in a closed-door meeting with a notoriously sharp CEO. There are two concessions on the table: **Higher Wages** or **Better Benefits**. The CEO has a psychological profile on you so accurate she knows which concession you'll prioritize before you even sit down. Her rule is simple: she hardens her stance *in advance* on whichever point she predicts you'll fight for, making it impossible to win that point, while leaving the other concession flexible (though you only have the political capital to fight for one). You need to win *something* to save face.

  If you decide to fight for Wages, you believe she's already locked that down, so you'll lose—you should switch to Benefits. But the moment you decide to fight for Benefits, you realize she predicted that switch and locked Benefits instead—you should switch back to Wages. You sit at the table unable to speak, trapped in an infinite loop of revising your opening statement because every settled choice feels like the losing one.

  **Why this fits the structure:**
  Unlike Newcomb's Problem, where you can settle on a stable strategy (like one-boxing) and expect a payoff, this scenario creates **decision instability**: the act of settling on an option updates your belief about the predictor's placement, instantly making that option undesirable and forcing a revision. There is no equilibrium where you can say, "I choose X and I'm satisfied," because choosing X is exactly what makes X the failure state.
