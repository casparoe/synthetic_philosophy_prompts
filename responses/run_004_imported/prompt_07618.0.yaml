  1.  **Analyze the User's Request:**
      *   **Context:** A small, informal prediction market (~30 friends) run on Discord/Manifold-style.
      *   **Problem:** A "civil war" over resolving a market question. The wording was precise, but an unforeseen real-world event occurred.
      *   **Conflict:** Textualists (stick to the literal words) vs. Purposivists (stick to the obvious intent/spirit).
      *   **Constraint:** No courts, no appeals, no legislative history. Just Discord and vibes.
      *   **Goal:** Understand the implications of the textualism/purposivism debate *specifically for this context* (tiny informal institution), not general legal theory.
      *   **Tone:** Acknowledge the weird specificity, be practical, insightful, and slightly humorous (given the "Discord and vibes" context).

  2.  **Deconstruct the Legal Concepts (Textualism vs. Purposivism) for this Context:**
      *   *Textualism:* Focus on the plain meaning of the text. Predictability, rule of law, prevents hindsight bias. *Risk:* Absurd outcomes, loopholes, "gotcha" moments.
      *   *Purposivism:* Focus on the intent behind the rule/market. Flexibility, fairness, aligns with expectations. *Risk:* Subjectivity, admin overreach, uncertainty ("vibes" based ruling).
      *   *Standard Legal Infrastructure:* Judges, precedents, written records, enforcement mechanisms.
      *   *Friend Group Infrastructure:* Social capital, trust, fun, future participation.

  3.  **Identify Key Implications for a Small Group:**
      *   **Enforcement:** In law, the state enforces. Here, *trust* enforces. If people feel ripped off, they leave.
      *   **Precedent:** In law, *stare decisis*. Here, past decisions matter for reputation but aren't binding.
      *   **Drafting:** In law, lawyers write statutes. Here, friends write prompts. Precision is harder.
      *   **Resolution:** In law, judges decide. Here, maybe an admin or a vote?
      *   **The "Unforeseen Event":** This is the crux. Textualists say "words cover it." Purposivists say "nobody meant this."

  4.  **Drafting the Advice (Iterative Process):**

      *   *Introduction:* Validate the situation. It's not weird; it's a classic governance problem scaled down. Acknowledge the "Discord & Vibes" constraint.
      *   *Core Insight:* The stakes aren't money (mostly), it's *social capital* and *game continuity*.
      *   *Point 1: The "Exit Option" (The biggest difference from law).* In SCOTUS, you can't leave. In a friend group, you can stop playing. If the ruling kills the fun, the institution dies. *Implication:* Prioritize retention over strict consistency.
      *   *Point 2: Drafting for "Vibes" (Ex Ante vs. Ex Post).* Since you don't have judges to interpret later, you need better drafting now. But you also can't predict everything. *Implication:* Build a "Spirit of the Market" clause or a resolution mechanism *before* the fight happens.
      *   *Point 3: The Admin as "Benevolent Dictator" vs. "Democracy".* Who decides? If it's one person, they need legitimacy. If it's a vote, it's mob rule. *Implication:* Maybe a "Supreme Court" of 3 trusted friends? Or a default rule (e.g., "If ambiguous, resolve NO").
      *   *Point 4: Precedent in a Chat Log.* You need to save the rulings. Not for legal binding, but for "remember that time we decided X?" *Implication:* Pin a "Case Law" channel.
      *   *Point 5: The "Absurdity Doctrine".* Even textualists admit exceptions for absurdity. In a friend group, "absurd" = "ruins the game." *Implication:* If the literal outcome makes everyone groan, it's probably wrong.

  5.  **Refining the Advice (Focusing on the "No Infrastructure" aspect):**
