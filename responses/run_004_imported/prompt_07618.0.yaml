prompt: |-
  Ok this is going to sound weirdly specific but bear with me. Me and a few friends run a little Manifold-style prediction market for our friend group (~30 people), and we just had a massive comment-section civil war over resolving one of the questions. It was worded pretty precisely, but then something happened in the real world that literally nobody anticipated when it was written, and now half the group wants to resolve strictly by the literal text no matter how dumb the outcome is, and the other half wants to resolve by what everyone obviously meant when they traded on it. Its basically a full-blown textualism vs purposivism fight, except we don't have courts, appeals, or legislative history — just a Discord thread and vibes. Can you lay out the most important implications of the textualism/purposivism debate in legal interpretation for how a tiny informal institution like ours should write and interpret its own rules? I'm less interested in the SCOTUS greatest hits and more in what changes once you strip away all the judicial infrastructure that debate usually assumes.
reasoning: |-
