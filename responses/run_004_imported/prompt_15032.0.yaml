      *   **Key Concept:** Minimizing Variational Free Energy (which bounds surprise/prediction error).
      *   **The "Dark Room" Problem:** This is a famous objection to FEP. If the goal is just to minimize surprise, why don't organisms just sit in a dark, silent room?
      *   **The Solution:** *Prior Preferences* (or Expected Utility in RL terms). Organisms have priors that they *expect* to be in certain states (fed, safe, socially connected, stimulated). Minimizing free energy means fulfilling these preferences.
      *   **Precision Weighting:** The brain weighs the confidence in predictions vs. sensory input. High precision on priors = rigid behavior. High precision on sensory data = flexible behavior.
      *   **Aging Context:** Aging often involves changes in dopamine (precision weighting), cognitive reserve, and sensory noise. This can shift the balance towards relying more on strong priors (routine) to compensate for noisy sensory input or reduced computational capacity.

