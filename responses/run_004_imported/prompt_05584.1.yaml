prompt: |-
  I'm a PhD student in philosophy drafting part of a seminar paper on Bernard Williams's internalism about practical reasons, and I'd like an outside read before I take it further. The section below responds to John McDowell's well-known objection, in "Might There Be External Reasons?" (1995), that Williams's notion of a "sound deliberative route" is too narrowly instrumental to rule out external reasons. Here is the section:

  Williams's 1979 case against external reason statements rests on what I'll call the explanatory constraint: a reason statement earns its keep only if it can figure in an intelligible account of an agent's coming to be motivated. An internal reason statement satisfies this automatically, since it is true only if there is a sound deliberative route from some element of the agent's subjective motivational set, S, to the relevant action. Williams's challenge to the external reasons theorist is to explain what could make an external reason statement true given that, by hypothesis, its truth does not depend on anything already in S. His diagnosis is that any story about an agent coming to be moved by such a reason will end up smuggling in some element of S after all — a standing concern to be rational, a susceptibility to argument, a latent capacity for sympathy — at which point the "external" reason has quietly become internal relative to that element, and the externalist's original claim has lost its content.

  McDowell's reply — that Williams's "sound deliberation" is instrumental reasoning by another name, and so cannot capture cases in which coming to appreciate a reason (say, through the acquisition of virtue) is not a matter of tracing out what was already implicit in one's antecedent concerns — is usually treated as the live alternative to Williams's picture. I want to suggest the exchange is less substantive than it looks, because of a concession Williams is both willing and, on his own terms, obliged to make: S can contain not just first-order desires and projects but general, largely dispositional capacities — for sympathy, for imaginative identification with others, for being struck by considerations one had not previously weighed. Once S is stocked this generously, there is no case McDowell wants to describe as recognition of an external reason that cannot be redescribed, without strain, as the sound deployment of some such standing capacity. An unsympathetic husband can be told he has reason to be kinder to his wife not because kindness answers to some specific desire he already owns, but because ordinary human beings have a capacity for sympathetic response that correct deliberation could engage — and that, on Williams's own terms, is enough to make the reason internal.

  This generosity, though, is not free. The internal/external distinction was supposed to explain why we can withdraw a reason claim about a committed amoralist — someone for whom, ex hypothesi, no deliberative route from anything in S leads to the relevant motivation — while an externalist supposedly could not. But if merely possessing the general human capacities suffices to seed S, then only a fairly exotic incapacity, rather than mere unwillingness or a differently ordered set of concerns, will ever let an agent escape the reach of internal reasons — and the distinction stops tracking the cases it was invented for. The obvious repair is to individuate S more finely, requiring not just possession of a capacity but its being already "engaged" in some more specific sense; but this turns "engagement" into exactly the question the amoralist case was meant to settle, without supplying any independent criterion for answering it. My tentative conclusion is that the Williams–McDowell debate, staged this way, occupies an unstable middle position: generous enough about S to win every hard case, but not principled enough about what that generosity excludes to preserve the distinction's original point.

  I'd welcome comments along three lines: first, whether I'm being fair to both Williams and McDowell here, or have flattened one of them in a way that loses its real force (I'm particularly unsure whether my gloss on McDowell does justice to the "second nature" idea behind it); second, whether the trivialization objection in the final paragraph actually succeeds, or whether there's a principled, non-question-begging way for an internalist to individuate S that would block it; and third, whichever step in the argument you'd press hardest on if you were refereeing this for a workshop.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy.
      *   **Task:** Drafting a seminar paper section on Bernard Williams's internalism about practical reasons, specifically responding to John McDowell's objection in "Might There Be External Reasons?" (1995).
      *   **Input:** A specific section of the paper (approx. 400 words).
      *   **Goal:** An "outside read" before taking it further.
      *   **Specific Requests for Feedback:**
          1.  Fairness to Williams and McDowell (especially McDowell's "second nature").
          2.  Success of the "trivialization objection" (can internalism individuate $S$ principledly?).
          3.  The hardest press point if refereeing for a workshop.

  2.  **Analyze the Text:**
      *   **Core Argument:** Williams requires an "explanatory constraint" (reasons must explain motivation via a sound deliberative route from $S$). McDowell objects that "sound deliberation" is too instrumental/narrow to capture virtue/reason acquisition. The author argues Williams can accommodate McDowell by expanding $S$ to include general capacities (sympathy, etc.). However, this expansion trivializes the internal/external distinction because it makes it hard to find a genuine amoralist (someone with *no* internal reason). Trying to fix this by requiring "engagement" of capacities begs the question. Conclusion: The debate is in an unstable middle position.
      *   **Strengths:** Clear writing, identifies a genuine tension in Williams's theory (the scope of $S$), connects the McDowell objection to the amoralist problem.
      *   **Weaknesses/Potential Issues:**
          *   Interpretation of McDowell: Does McDowell really just want to say "capacities are in $S$"? Or is he making a metaphysical/epistemological point about *truth conditions* of reason statements?
          *   Interpretation of Williams: Does Williams actually want $S$ to be *that* generous? (Williams worries about the "fetishism" of morality or empty rationality).
          *   The "Trivialization" Objection: Is it really trivialization, or just a shift in where the battle is fought?
          *   The Amoralist: The amoralist is a tricky figure. Williams thinks the amoralist *might* have reasons (if they have *any* relevant $S$ element), but the externalist thinks they have reasons *even if* they lack the $S$ element.

  3.  **Drafting Feedback - Section by Section:**

      *   **General Impression:** Strong, concise, philosophically sophisticated. Fits the PhD level.

      *   **Point 1: Fairness (Williams & McDowell):**
          *   *Williams:* Seems fair. Williams *does* allow $S$ to include dispositions. The "explanatory constraint" is accurately stated.
          *   *McDowell:* This is the tricky part. The user suggests McDowell's point is just that $S$ includes capacities for virtue. But McDowell's point in "Might There Be External Reasons?" is often read as claiming that the *truth* of the reason statement isn't dependent on the $S$ element, even if the *motivation* requires it. McDowell thinks the virtuous person sees a reason that *is* there, not just one projected from $S$. The user might be conflating the *psychological mechanism* of coming to be motivated with the *normative status* of the reason. McDowell's "second nature" isn't just a capacity in $S$; it's a way the world looks to the virtuous agent. The user's reading risks turning McDowell into a sophisticated internalist, whereas McDowell wants to resist the internalist framework's explanatory constraint itself.
          *   *Correction/Nuance:* Need to highlight that McDowell challenges the *priority* of the explanatory constraint, not just the scope of $S$.

      *   **Point 2: The Trivialization Objection:**
          *   The argument is: If $S$ includes general human capacities, everyone has internal reasons, so the amoralist disappears.
          *   *Counter:* Williams can say the amoralist lacks the *specific* disposition. Or Williams can bite the bullet and say "Yes, most humans have internal reasons to be moral; the amoralist is defective."
          *   *The "Engagement" Problem:* The user argues requiring "engagement" begs the question. This is strong. But is there a middle ground? Maybe the distinction isn't about *existence* of reasons but about *criticism*?
          *   *Verdict:* The objection is plausible but needs to address whether Williams *cares* about preserving the amoralist case as much as the user thinks. Williams might be happy to say the amoralist is irrational/defective rather than "outside the system."

      *   **Point 3: Hardest Press Point (Referee Perspective):**
          *   The definition of "Sound Deliberative Route" (SDR). The user assumes expanding $S$ solves the McDowell objection. But McDowell argues SDR is inherently instrumental/Humean. If the "capacity" is to recognize objective value, isn't that already conceding externalism?
          *   The stakes of the distinction. Why does it matter if the amoralist is excluded? Is the goal of the distinction to track metaphysical truth or to track patterns of criticism?
          *   The "Unstable Middle" conclusion. Is it unstable, or is it just a *pragmatic* boundary?

  4.  **Refining the Feedback (Self-Correction during drafting):**
      *   *Tone:* Needs to be collegial but rigorous (PhD to PhD).
      *   *Specific References:* Mention "Internal and External Reasons" (1979/1980) vs. "Might There Be External Reasons?" (1995). Mention the "fetishism" worry.
      *   *McDowell's Second Nature:* Be specific. It's not just a capacity; it's a perceptual sensitivity shaped by upbringing. It changes how the world *is* for the agent.
      *   *The "Explanatory Constraint":* Make sure to distinguish between the *truth condition* of the reason statement and the *explanation of action*. McDowell accepts the latter might need $S$, but denies the former does. The user's text blurs this slightly ("a reason statement earns its keep only if..."). This is Williams's view, but attributing the blur to the debate needs care.

  5.  **Final Polish of the Response:**
      *   Structure the response to match the user's three requests.
      *   Add a "General Comments" section for flow/clarity.
      *   Ensure the philosophical distinctions are sharp (e.g., truth conditions vs. motivational psychology).

      *(Self-Correction on McDowell)*: Wait, does McDowell accept the explanatory constraint? In "Might There Be External Reasons?", McDowell argues that Williams's demand for an explanatory link conflates the *truth* of a reason claim with the *motivation* to act on it. McDowell thinks a reason can be true even if the agent lacks the $S$ element (they are just irrational/vice-ridden). The user's text says McDowell's reply is usually treated as the live alternative. The user argues Williams can absorb McDowell by expanding $S$. This is a "capacious internalism" strategy (like Smith or Velleman might attempt). I need to check if this misrepresents McDowell's *intent*. McDowell *resists* being absorbed. He wants to say the reason is *external*. So the user's argument is: "McDowell *could* be read as a capacious internalist, but if we do that, internalism trivializes." This is a valid strategy (charitable reconstruction followed by *reductio*), but needs to be clear that this is the *user's* reconstruction, not necessarily McDowell's own self-conception. I should advise the user to make this methodological move explicit.

  6.  **Finalizing the Advice:**
      *   **Fairness:** You are treating McDowell as a *cryptic internalist*. He would resist this. Make that explicit.
      *   **Trivialization:** It's a strong point, but consider the "rational defect" angle.
      *   **Referee Press:** The conflation of truth conditions and motivational psychology.

      *Let's write the response.*
answer: |-
  This is a very strong draft. It is concise, clearly argued, and identifies a genuine tension in the Williams/McDowell exchange that often gets glossed over in introductory treatments. You have a good handle on the "explanatory constraint" and the structural role of the subjective motivational set ($S$).

  However, since you are asking for a pre-submission read at the PhD level, I am going to be rigorous. There are places where the argument risks conflating distinct philosophical issues, and where McDowell's specific metaphysical commitments might be slightly flattened to serve your *reductio*.

  Here are comments organized by your three requested lines of feedback, followed by a few stylistic notes.

  ### 1. Fairness to Williams and McDowell

  **Williams:** Your gloss on Williams is accurate. You correctly identify that Williams's $S$ is not limited to occurrent desires but includes "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent" (Williams 1979). Your claim that Williams is "obliged" to make this concession is correct; otherwise, internalism becomes a trivial view about satisfying occurrent urges.

  **McDowell:** This is the more delicate point. You write: *"I want to suggest the exchange is less substantive than it looks, because of a concession Williams is both willing and, on his own terms, obliged to make..."*

  You are effectively arguing for a **capacious internalism** (a la Michael Smith or perhaps David Velleman) and suggesting that McDowell's position can be absorbed into it. While this is a valid argumentative strategy, you need to be careful not to present this as what McDowell *intends*. McDowell resists the absorption.

  *   **The "Second Nature" Issue:** You worry you might be flattening "second nature." You are right to be unsure. For McDowell, second nature is not merely a "capacity in $S$." It is a conceptual capacity that allows the agent to *perceive* reasons that are objectively there. When McDowell talks about the virtuous agent, he is making a point about the **truth conditions** of reason statements, not just the psychology of motivation.
  *   **The Risk:** Your argument suggests McDowell's objection is merely about the *scope* of $S$ (i.e., "You forgot to put sympathy in $S$"). But McDowell's objection is often read as challenging the **priority** of the explanatory constraint. McDowell argues that the truth of "A has a reason to $\phi$" does not *depend* on the possibility of a deliberative route from $S$, even if motivation requires one. By framing McDowell's objection as one that Williams can solve by expanding $S$, you might be begging the question against McDowell's core claim: that reasons can exist independently of the agent's subjective constitution.
  *   **Recommendation:** Clarify that you are offering a *charitable reconstruction* of McDowell's objection to show that *even if* we grant Williams the resources to meet it, internalism faces a trivialization problem. Make it explicit that McDowell would likely reject the premise that his view can be fully internalized.

  ### 2. The Trivialization Objection

  Does the objection succeed? **Yes, but it needs a specific target.**

  Your argument is: If $S$ includes general human capacities, the internal/external distinction collapses because everyone (barring the "exotic" amoralist) has internal reasons.

  *   **The Internalist Reply:** A sophisticated Williamsian could reply: "So what?" Williams might be happy to concede that most humans have internal reasons to be moral because they possess general human capacities (sympathy, etc.). The distinction remains useful for the **defective** agent (the amoralist). The internalist says the amoralist has *no reason*; the externalist says the amoralist has a reason but is irrational/vice-ridden for not acting on it.
  *   **The "Engagement" Problem:** Your point about "engagement" is the strongest part of this paragraph. If Williams requires the capacity to be "engaged" to count as part of $S$, he risks circularity (engaged by what? A reason?). If he doesn't require engagement, the amoralist (who has the capacity but ignores it) counts as having a reason.
  *   **Refinement:** To strengthen this, distinguish between **possession** of a capacity and **identification** with a capacity. Williams needs $S$ to reflect the agent's *practical identity*. If $S$ includes capacities the agent repudiates (e.g., a capacity for sympathy that the amoralist actively suppresses), does that count? If yes, trivialization looms. If no, you need a criterion for "repudiation" that doesn't smuggle in external norms. This is where your "non-question-begging" charge lands hardest.

  ### 3. The Hardest Press Point (Referee Perspective)

  If I were refereeing this for a workshop, my hardest press would be on the **conflation of truth conditions and motivational psychology.**

  *   **The Question:** "You argue that Williams can accommodate McDowell by expanding $S$ to include capacities for sympathy. But doesn't this concede the externalist's point about the *normativity* of reasons? If the 'sound deliberative route' relies on a capacity to recognize objective moral facts (as McDowell's second nature suggests), haven't you just internalized the *mechanism* while leaving the *source* of the reason external?"
  *   **Why this matters:** Williams wants the *source* of the reason to be the $S$. McDowell wants the *source* to be the world (as disclosed by virtue). Your argument suggests that as long as the *route* goes through the agent's psychology, it's internal. But a hardline externalist (or McDowell) would say that if the psychology is merely a receptor for external truths, the reason remains external. You need to defend why the *location of the capacity* matters more than the *object of the capacity*.

  ### Specific Textual Suggestions

  1.  **Paragraph 1, Sentence 2:** *"Williams's challenge to the external reasons theorist is to explain what could make an external reason statement true..."*
      *   **Critique:** Be careful here. Williams argues external reason statements are *false* or *unintelligible*, not just that they need a truth-maker. He thinks they fail to state a truth at all.
      *   **Fix:** Consider: "Williams's challenge... is to explain how an external reason statement could be intelligible, given that..."

  2.  **Paragraph 2, Sentence 2:** *"I want to suggest the exchange is less substantive than it looks..."*
      *   **Critique:** This is a bold claim. "Less substantive" might imply they are talking past each other. You might mean "less stable" or "more convergent."
      *   **Fix:** Consider: "I want to suggest that the apparent divergence obscures a deeper instability in Williams's framework..."

  3.  **Paragraph 3, Sentence 2:** *"But if merely possessing the general human capacities suffices to seed $S$..."*
      *   **Critique:** "Seed $S$" is a nice metaphor, but ensure it's clear that $S$ is supposed to be *subjective*. If the capacities are "general human," they are arguably *objective* features of human nature, which pushes toward externalism.
      *   **Fix:** You might highlight this tension: "If $S$ is stocked with capacities grounded in human nature rather than individual psychology, the 'internal' label begins to fray."

  ### Summary Verdict

  This is workshop-ready material with some polishing. The core insight—that expanding $S$ to meet McDowell threatens to erase the amoralist case that motivates internalism—is excellent.

  **To elevate it:**
  1.  Clarify that you are reconstructing McDowell for the sake of the *reductio*, not claiming this is his final word.
  2.  Tighten the distinction between the *psychology of motivation* (where Williams and McDowell might converge) and the *truth conditions of reason claims* (where they diverge).
  3.  Prepare for the objection that Williams doesn't care about the "exotic" amoralist; he cares about the *structure* of justification, which remains internal even if the capacity is universal.

  Good luck with the paper. This is a promising section.
