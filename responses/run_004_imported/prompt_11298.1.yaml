answer: |-
  **Setting:** *A sterile white room. A coin lies on the table, showing Tails. Omega, a silent, imposing entity, stands by the door, waiting. Celia (CDT) and Uma (UDT) stand on opposite sides of the table. Each holds a wallet.*

  **Celia:** Look at the coin, Uma. It's tails. Omega has already made its prediction and already decided not to give us the ten thousand. Handing over a hundred dollars now doesn't reach back in time and change the flip. It's just burning cash.

  **Uma:** It doesn't change the flip. It validates the algorithm. Omega didn't predict what I would do *after* seeing the tails; it predicted what I would do *if* I saw tails. If I refuse now, I confirm that I am the sort of agent who refuses. And if I'm that sort of agent, Omega wouldn't have given me the ten thousand in the heads world.

  **Celia:** But we aren't in the heads world. We are here, in the tails world, with zero dollars in the pot. Rationality is about influencing outcomes. My action here has exactly one causal consequence: I am one hundred dollars poorer. I cannot causally influence a counterfactual. To pretend I can is magical thinking.

  **Uma:** It's not magic; it's logic. You're treating your decision as an isolated event. I'm treating it as the output of a source code that runs in both branches of the probability tree. Before the coin flipped, the expected value of my policy was $4,950. Yours was zero. You're updating on the coin flip, discarding the half of the calculation where you win big.

  **Celia:** I update because I have new information! Before the flip, I didn't know the state of the world. Now I do. Why should I bind myself to a plan made in ignorance when the facts are in? That's the Sunk Cost Fallacy dressed up in math. You're throwing good money after bad because you wish the past were different.

  **Uma:** I'm not wishing the past were different. I'm acknowledging that my "past self" had the right view of the problem. You're suffering from dynamic inconsistency. If you could precommit before the flip, you would. You'd sign a contract, hire an enforcer, anything to force yourself to pay. But when the moment comes, you defect. You're building an agent that *knows* it will lose the big prize because it can't trust its future self to follow through.

  **Celia:** Precommitment is a physical constraint. It changes the causal landscape. I'm talking about raw decision theory. If I stand here with no gun to my head, paying is strictly dominated. It yields less utility than not paying. If your decision theory requires you to take a dominated action, maybe the theory is demanding too much. You're saying I should pay *because* it costs me. That's perverse.

  **Uma:** I'm saying you should pay because winning isn't about maximizing utility in the specific branch you inhabit; it's about being the winner across the multiverse of possibilities. Omega is testing your reflectivity. If you say "I only pay if it benefits me causally," Omega predicts that, and you get nothing. If you say "I pay because it's the optimal policy," Omega predicts that, and you get the ten thousand in the other branch. You're keeping your hundred dollars, Celia, but you're admitting you're the kind of person who walks away from $4,950 in expected value.

  **Celia:** And you're handing over a hundred dollars to a ghost. A prediction about a world that doesn't exist. I'd rather be the person who keeps their money in the actual world than the person who subsidizes counterfactuals. I sleep better knowing I didn't pay for a win that never happened.

  **Uma:** And I sleep better knowing I didn't leave ten thousand on the table just because the coin landed against me.

  *Omega opens the door. The silence stretches. Celia closes her wallet with a sharp snap. Uma counts out a crisp hundred-dollar bill and places it on the table.*

  **Celia:** You know Omega isn't watching you pay. It already left.

  **Uma:** Omega predicted I would know that.

  *Celia shakes her head, turning to leave. Uma watches the bill sit on the table, neither richer nor poorer in this room, but steadfast in the logic of the one that isn't.*
