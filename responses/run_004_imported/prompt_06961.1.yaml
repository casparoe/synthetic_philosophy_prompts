answer: |-
  Your question touches on one of the deepest fault lines in game theory and decision theory. However, there is a crucial misconception in your premise that needs to be corrected first: **Hofstadter's superrationality does *not* claim that mutual cooperation is a Nash Equilibrium.**

  In standard game theory, even if players are identical copies, **Defect-Defect** remains the unique Nash Equilibrium of the one-shot Prisoner's Dilemma.

  The reason superrationality is treated as distinct and controversial is that it fundamentally rejects the definition of "rationality" and "counterfactuals" used in Nash Equilibrium analysis. It is not a special case of ordinary equilibrium analysis; it is a competing decision theory.

  Here is a detailed breakdown of why superrationality is distinct from standard Nash analysis.

  ### 1. The Definition of "Unilateral Deviation"
  The core technical difference lies in how a player evaluates a potential deviation from a strategy.

  *   **Nash Equilibrium (Causal Decision Theory):** To check if a strategy profile is an equilibrium, a player asks: *"If I change my strategy, while **holding the other player's strategy fixed**, do I gain?"*
      *   In the Prisoner's Dilemma, if I assume you are Cooperating, and I hold your action fixed, I gain more by Defecting. Therefore, (Cooperate, Cooperate) is **not** a Nash Equilibrium.
      *   Even if we are identical copies, standard game theory treats our strategy choices as **independent variables**. My physical act of pressing "Cooperate" does not causally force your physical act of pressing "Cooperate."

  *   **Superrationality (Evidential/Functional Decision Theory):** A superrational player asks: *"If I change my strategy, what does that imply about the other player's strategy, given that we run the same reasoning algorithm?"*
      *   Here, the strategies are **logically correlated**. If I switch from Cooperate to Defect, I must conclude that you (my identical copy) will also switch from Cooperate to Defect.
      *   Therefore, the choice is not between (Cooperate, Defect) and (Defect, Defect); it is between (Cooperate, Cooperate) and (Defect, Defect). Since mutual cooperation yields a higher payoff, I should Cooperate.

  Because superrationality does not hold the other player's strategy fixed during the counterfactual analysis, **it violates the mathematical definition of a Nash Equilibrium.**

  ### 2. Causal vs. Logical Independence
  Standard game theory, formalized by von Neumann, Morgenstern, and Nash, is built on **Causal Decision Theory (CDT)**. CDT posits that my action can only affect the world through causal chains extending forward in time from my choice. Since my choice cannot causally affect your choice in a one-shot game (no communication, no future retaliation), CDT dictates Defection.

  Superrationality relies on **Logical Correlation**. It posits that because we are running the same source code (reasoning process), the output of my reasoning is logically linked to the output of yours.
  *   **Standard View:** My choice is $A$, your choice is $B$. $P(B|A) = P(B)$. (Independence).
  *   **Superrational View:** My choice is $f(\text{reasoning})$, your choice is $f(\text{reasoning})$. Therefore $A = B$.

  To a standard game theorist, this looks like "magic" or "telepathy." It implies a form of **acausal influence**: the idea that my decision *here* determines your decision *there* without a physical signal. Because standard economics and game theory reject acausal influence as metaphysically incoherent or scientifically unverifiable, superrationality is relegated to the fringes.

  ### 3. Symmetric Equilibrium vs. Superrationality
  You asked why this isn't just a "special case of ordinary equilibrium analysis applied to a symmetric game."

  It *is* standard to analyze symmetric games. In fact, (Defect, Defect) **is** a symmetric Nash Equilibrium. Both players play the same strategy, and neither wants to deviate.

  Superrationality claims that (Cooperate, Cooperate) is the rational outcome. But (Cooperate, Cooperate) is **not** an equilibrium in the standard sense because it is not stable against unilateral deviation.
  *   If you treat the players as symmetric *agents* but independent *variables*, you get Defect.
  *   If you treat the players as symmetric *variables* (logically linked), you get Cooperate.

  Superrationality isn't changing the game structure (the payoffs or symmetry); it is changing the **solution concept**. It effectively argues that Nash Equilibrium is the wrong tool for agents who know they are similar to each other.

  ### 4. The Controversy: "Why aren't we all doing this?"
  The controversy persists for three main reasons:

  **A. The "Twin" Problem**
  Standard theory argues that even if I *know* you are my twin, my action doesn't *cause* yours. If I were to magically defect while you remained a cooperator, I would win. The fact that you *won't* remain a cooperator is a prediction about you, not a constraint on my payoff matrix. Superrationality conflates **prediction** with **control**.

  **B. Robustness**
  If I play superrationally (Cooperate) against a standard Nash rationalist (Defector), I get the "sucker's payoff." Superrationality is not an Evolutionarily Stable Strategy (ESS) in a mixed population. If a population of superrationalists is invaded by standard defectors, the defectors win. Standard game theory prioritizes strategies that are robust against exploitation.

  **C. Lack of Formal Mechanism**
  For decades, there was no rigorous mathematical framework for "logical correlation." It sounded like philosophy. However, this has changed recently with the development of **Functional Decision Theory (FDT)** by Eliezer Yudkowsky and Nate Soares (2017). FDT formalizes Hofstadter's intuition: agents should choose based on the output of their decision function, not just their physical action. FDT shows that superrationality is mathematically coherent *within that specific decision theory*, but it remains distinct from the CDT-based Nash Equilibrium that dominates economics.

  ### Summary
  Decision theorists treat superrationality as distinct because:
  1.  **It violates the NE definition:** NE requires holding others' strategies fixed; superrationality assumes they vary with yours.
  2.  **It assumes acausal influence:** It relies on logical correlation rather than causal independence.
  3.  **It is a different Decision Theory:** It aligns with Evidential or Functional Decision Theory, not the Causal Decision Theory underpinning Nash.

  Hofstadter did not prove that Cooperation is a Nash Equilibrium. He argued that **Nash Equilibrium is the wrong solution concept** for agents who recognize their own reasoning in others. That is a radical claim, not a technical refinement, which is why it remains controversial.
