answer: |-
  **Julian:** So, are the parents wrong? I say yes. Not about the phones—maybe screens *are* bad—but wrong to say it. Their hypocrisy strips them of the standing to blame.

  **Nina:** That seems too clean. Just because they're messy doesn't mean the message is void. If a smoker tells you smoking kills, they're hypocritical, sure, but they aren't lying about the cancer.

  **Julian:** Blame isn't just information transfer, Nina. It's a moral address. It assumes you and I are equals under the same law. When your parents demand you get off the phone while scrolling themselves, they aren't treating you as an equal. They're quietly claiming an exception for themselves.

  **Nina:** Or maybe they're just weak-willed. They know the rule applies to them, they just fail to follow it. That's a vice, not a revocation of authority. You're conflating the *validity* of the blame with the *virtue* of the blamer.

  **Julian:** I'm not talking about virtue. I'm talking about jurisdiction. If I claim you must follow a rule I exempt myself from, I'm treating you as a subordinate, not a moral peer. That inequality voids the transaction. They lose the right to hold you accountable because they've refused to be accountable themselves.

  **Nina:** But accountability exists independently of them. If the phone usage harms your sleep or grades, the blame is *correct*. You're suggesting that moral truth depends on the purity of the messenger. Does a corrupt judge's ruling cease to be law just because he breaks the speed limit on the way home?

  **Julian:** A legal ruling is different from moral blame. Blame requires a relationship of reciprocity. If they opt out of the reciprocity, they opt out of the relationship required to blame. They can warn you, sure. But they can't rightly *condemn* you.

  **Nina:** So what happens when you listen? If you agree, "Yeah, I should get off my phone," you're admitting the blame was effective.

  **Julian:** Effective isn't legitimate. You might listen out of prudence, or because you know they're right about the facts. But morally? They've lost the high ground. They're insincere messengers.

  **Nina:** "Insincere" I'll grant you. But "illegitimate"? That lets the kid off the hook too easily. It turns the conversation into "Look who's talking!" instead of "Look at what I'm doing." If we accept your view, hypocrisy becomes a get-out-of-jail-free card for the blamed.

  **Julian:** No, it just means the parents can't be the ones to administer the jail. The rule stands. But you can't enforce a law you're actively breaking without violating the equality that makes enforcement meaningful.

  **Nina:** I think you're demanding moral sainthood as a prerequisite for speech. They're right about the phone, Julian. They're just wrong about themselves. And those are two separate sins.

  **Julian:** Maybe. But when they speak, they bind those sins together. And in doing so, they lose the right to speak at all.
