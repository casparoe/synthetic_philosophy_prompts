prompt: |-
  okay this might sound random but my ethics elective got into a whole argument today about hypocrisy and it's been stuck in my head since. like when my parents are on their phones 24/7 but still tell me to get off mine, are they wrong to say that, or are they just hypocrites who happen to still be right? can you write me a dialogue between two philosophers duking this out — one who thinks hypocrisy genuinely wipes out your standing to blame someone (bring in the idea that blaming assumes your addressing someone as an equal, and hypocrites are quietly claiming an exception for themselves they don't extend to others) and one who thinks standing survives hypocrisy, maybe by keeping "is the blame correct" totally separate from "does this person get to say it", or by arguing hypocrisy just makes you an insincere messenger, not an illegitimate one. make them actually respond to each other's points instead of just restating their own side, and keep it under a page or so.
