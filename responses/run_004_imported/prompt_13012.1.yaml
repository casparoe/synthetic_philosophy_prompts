answer: |-
  Based on Thomas Hobbes's epistemological commitments in *De Corpore* and his specific objections to John Wallis's methods, it is virtually certain that Hobbes would reject the computer-assisted proof of the four-colour theorem as *scientia*. In fact, he would likely regard it as a paradigmatic instance of the "insignificant speech" and empty symbol-manipulation he accused Wallis of practicing, exacerbated by the removal of the human mind from the chain of reasoning.

  To understand why, we must look at the three pillars of Hobbes's theory of knowledge: the genetic nature of definition, reasoning as surveyable reckoning, and the distinction between *scientia* and belief.

  ### 1. The Genetic Requirement and the Lack of Causal Generation
  In *De Corpore*, Hobbes argues that *scientia* (certain knowledge) is knowledge of consequences derived from causes. Because humans did not create the natural world, we cannot have *scientia* of natural philosophy (physics) in the strictest sense, because we cannot know the true causes of natural effects. However, we *can* have *scientia* of geometry and civil philosophy because we construct the objects of study ourselves.

  For Hobbes, a proper geometric definition must be "genetic." It cannot merely describe a static property (e.g., "a circle is a set of points equidistant from a center"); it must describe the *motion* that generates the figure (e.g., "a circle is generated by a point moving around a fixed center while maintaining constant tension"). We know the properties of the circle because we understand the constraints of the motion that created it.

  The four-colour theorem proof fails this criterion fundamentally. It does not demonstrate *why* four colors are sufficient by tracing a generative cause or a constructive motion. Instead, it proceeds by elimination (reductio ad absurdum via exhaustive case-checking). It establishes that no counter-example exists within a finite set of configurations, but it offers no insight into the *generation* of the truth. For Hobbes, knowing *that* a proposition is true without knowing the causal motion that necessitates it is not *scientia*; it is merely a true proposition lacking scientific understanding. The proof verifies a fact but does not reveal the cause, violating the core Hobbesian dictum that "science is the knowledge of consequences, and dependence of one fact upon another."

  ### 2. Reasoning as Surveyable Reckoning
  Hobbes famously defines reason as "nothing but Reckoning (that is, Adding and Subtracting) of the Consequences of general names agreed upon for the marking and signifying of our thoughts." Crucially, this reckoning must be performed by the knower. *Scientia* is an active cognitive process, not a passive reception of results.

  In the controversy with Wallis, Hobbes objected to algebraic symbolism not merely because it was numerical, but because it allowed the practitioner to manipulate signs without holding the corresponding magnitudes in their mind. He accused Wallis of treating symbols as counters in a game, detached from the physical reality of quantity. Hobbes writes in *De Corpore* that words are "marks" for our own memory and "signs" to communicate with others, but if the signs are manipulated without a clear conception of what they signify, the result is "absurdity."

  The computer proof of the four-colour theorem takes this detachment to its logical extreme. The "reckoning" involved in checking the unavoidable configurations is too vast for any human mind to survey. Consequently, the human mathematician does not perform the reasoning; they outsource it to a machine. For Hobbes, if you cannot trace the addition and subtraction of consequences step-by-step, you are not reasoning; you are relying on testimony. You are trusting the "authority" of the computer and its programmers. In Hobbes's epistemology, reliance on authority yields *opinion* or *belief*, never *scientia*. As he argues in *Leviathan* and *De Corpore*, in matters of science, there is no place for authority; only the evident chain of reasoning counts. A proof that cannot be surveyed is, for Hobbes, no proof at all.

  ### 3. The Exacerbation of the Wallis Controversy
  Hobbes's decades-long battle with Wallis centered on the claim that Wallis's "specious logistics" (symbolic algebra) obscured geometrical truth. Hobbes believed that algebra allowed mathematicians to arrive at correct results through "a net of words" without understanding the geometric reality. He famously claimed that Wallis's methods were like a man who "casts up his accounts by counters... but knows not the value of the coin."

  Hobbes would view the four-colour theorem proof as Wallis's method magnified by technology. In Wallis's algebra, the symbols still represented quantities that a trained human could, in principle, comprehend. In the computer proof, the symbols (binary states, adjacency matrices) are processed in a "black box" inaccessible to human intuition.
  *   **Wallis's Sin:** Manipulating symbols that bypass geometric intuition.
  *   **4CT's Sin:** Manipulating symbols that bypass *human comprehension entirely*.

  Hobbes would argue that this method severs the link between language and conception entirely. If the mind cannot hold the steps of the argument, the words (or code) signify nothing to the knower. It would be the ultimate "insignificant speech"—a string of marks that produces a result but conveys no knowledge.

  ### Conclusion
  For Hobbes, *scientia* requires that the knower be the maker of the demonstration. We know geometry because we construct the figures; we know civil philosophy because we construct the commonwealth. In the case of the four-colour theorem, the human mind does not construct the proof; the machine does. The human merely observes the output.

  Therefore, Hobbes would not count the four-colour theorem proof as *scientia*. He would classify it as a high-probability belief based on the testimony of a machine, akin to believing a historical report. Furthermore, he would condemn the method as a egregious form of the symbol-shuffling he accused Wallis of, arguing that it prioritizes the manipulation of signs over the causal understanding of magnitudes and motions. It provides a conclusion without a cause, and a verification without a surveyable reckoning, both of which are fatal to Hobbesian science.
