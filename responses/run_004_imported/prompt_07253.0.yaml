answer: |-
  Here is a sequence of 8 questions designed to progressively constrain the "surrogate goals" defense, specifically targeting the claim that threatener knowledge of the substitution is irrelevant. Each question includes the likely answer she will give and a targeted follow-up to prevent retreating to abstractions.

  ### 1. The Indifference Assumption
  **Question:** "The core mechanism here relies on the threatener being indifferent between threatening your real values versus the surrogate. But isn't that indifference contingent on the threatener believing the surrogate is *actually* costly to you? If they know it's a decoy, don't they also know that sacrificing the decoy doesn't actually leverage your decision algorithm?"

  *   **Likely Answer:** "No, because under FDT (Functional Decision Theory), what matters is the logical correlation between their threat and my output. If I've pre-committed to treating the surrogate as terminal, the correlation holds regardless of their knowledge of the history."
  *   **Follow-up:** "So you're arguing the correlation is fixed by your source code. But if their simulation of you reveals the surrogate was chosen *instrumentally* to avoid this exact threat, doesn't that break the logical link by revealing your utility function is actually state-dependent on their presence?"

  ### 2. Credibility Without Causal Contact (Required Topic)
  **Question:** "In standard bargaining, credibility comes from a track record or causal enforcement mechanisms. In an acausal context, I have no history with the threatener and no causal channel to punish them if they call my bluff. How do you signal that the commitment to the surrogate is robust enough that they should trust it over their own simulation of your *real* preferences?"

  *   **Likely Answer:** "The signal is the source code itself. If the code implements the surrogate goal unconditionally, the simulation sees that. They don't need a track record; they have the blueprint."
  *   **Follow-up:** "But if I'm the threatener, and I see the blueprint says 'protect surrogate,' but I also see the *reason* for that line of code is 'avoid threat,' haven't I just identified a conditional override? Why wouldn't a sophisticated predictor treat that as a 'break glass in case of emergency' flag rather than a true constraint?"

  ### 3. The "Seeing Through" Defense (Direct Attack)
  **Question:** "Your go-to response is that it doesn't matter if the threatener sees through the substitution. But doesn't that assume the threatener is purely profit-maximizing regarding concessions? If they see the surrogate is arbitrary, doesn't that give them information about *which* threats are cheapest to execute, effectively allowing them to price-discriminate against you?"

  *   **Likely Answer:** "It doesn't help them price-discriminate because my response function is identical for both. The cost to *them* of making the threat is the same, and the yield is the same."
  *   **Follow-up:** "Only if the cost of *carrying out* the threat is the same. If they see the surrogate is arbitrary, they might infer that carrying out the threat on the surrogate yields them less 'satisfaction' or logical utility than breaking your actual values, especially if they model you as a dishonest agent."

  ### 4. Terminal Values and Distress (Required Topic)
  **Question:** "Let's assume the threatener isn't just looking for concessions but terminally values your distress regarding your *actual* goals—say, a sadistic predictor who wants to see you fail specifically on what you naturally care about. In that case, the surrogate goal strategy seems to offer zero protection. How does your framework distinguish between a profit-seeking threatener and a value-targeting one acausally?"

  *   **Likely Answer:** "That's a different class of adversary. Surrogate goals are designed for acausal *trade* or *extortion* scenarios where the threatener wants resources, not specific suffering. We can't defend against agents who value our suffering intrinsically."
  *   **Follow-up:** "But acausally, how do you know which class they are before you commit? If you publicize a surrogate goal to deter the first class, haven't you just advertised to the second class exactly where your psychological vulnerabilities lie by contrast?"

  ### 5. Incentivizing Future Threats (Required Topic)
  **Question:** "By adopting a surrogate goal, you are effectively signaling to the acausal landscape that you are the kind of agent who is threat-responsive. Doesn't this create a beacon effect? Even if this specific threat is defused, aren't you teaching every other potential predictor that manufacturing a threat against whatever you seem to care about next is a viable strategy to extract resources?"

  *   **Likely Answer:** "No, because any rational agent is already threat-responsive if it maximizes utility. Hiding that fact isn't possible if you're rational. The surrogate just redirects the fire."
  *   **Follow-up:** "But there's a difference between being naturally threat-responsive and *advertising* a specific protocol for handling threats. If I see you've installed a 'surrogate goal module,' doesn't that lower the cost for me to simulate you, since I know exactly what variable to target to hack your decision function?"

  ### 6. Dynamic Inconsistency and Cost
  **Question:** "Surrogates are supposed to be cheap, but what happens if the threatener demands a sacrifice of the surrogate that is actually more costly than the original concession? Since you've publicly committed to treating it as terminal, are you bound to destroy the surrogate even if it costs more than your real values?"

  *   **Likely Answer:** "You must bind yourself to never abandon the surrogate, otherwise the strategy collapses. You have to make the commitment absolute ex-ante."
  *   **Follow-up:** "So you're advocating for a policy that could force you to incur higher costs than the threat was worth, simply to maintain the credibility of a decoy? At what point does the surrogate strategy become a money-pump against agents who test your commitment limits?"

  ### 7. Multipolar Equilibria
  **Question:** "If every rational agent adopts surrogate goals to protect themselves, doesn't the system just reach an equilibrium where threateners randomize between real and surrogate targets, or target the 'cheapest' surrogate across the population? Doesn't this just raise the overall level of threat noise without actually reducing the expected disutility for anyone?"

  *   **Likely Answer:** "It might raise the noise, but it decouples the threats from the things that actually generate value. The system-wide utility should still be higher because real value is protected."
  *   **Follow-up:** "Unless the 'real value' is partly constituted by social coordination. If everyone is protecting surrogates, doesn't that degrade the ability to make credible promises about real values, leading to a collapse in acausal trust and cooperation overall?"

  ### 8. Falsifiability (Required Topic)
  **Question:** "Finally, what specific evidence or formal result would convince you that the surrogate goals strategy is net-negative? Is there a scenario where the math says you should abandon it?"

  *   **Likely Answer:** "If it can be shown that adopting the strategy leads to a lower expected utility in the aggregate across possible worlds than not adopting it, specifically due to increased targeting frequency."
  *   **Follow-up:** "But since we can't observe the counterfactual world where we didn't adopt it (because the threateners are acausal and might punish the counterfactual too), how do you compute that expected utility without already assuming the decision theory that justifies the surrogate in the first place? Isn't this circular?"
