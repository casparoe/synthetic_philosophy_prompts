answer: |-
  **MEMORANDUM**

  **TO:** Policy Committee, SafeHarbor Shelter
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Third-Party Inquiry Scripts

  **Recommendation**
  I recommend we adopt a uniform **"Refusal to Confirm or Deny" (RCND)** policy. Staff should not authorize outright denials (e.g., "She is not here"), even when the asker is judged dangerous. Instead, staff must use fixed scripts that decline to disclose information without asserting a falsehood.

  **Rationale**
  While the intent of an outright denial is protective, it places an untenable burden on frontline staff to assess threat levels in real-time and compromises the shelter's legal credibility if challenged. An RCND policy provides a consistent shield that protects residents without requiring staff to violate their own ethical boundaries or risk perjury. It treats confidentiality as a structural lock, not a situational negotiation.

  **Staff Guidance for Hard Cases**
  Staff must be equipped to handle aggression without escalating to a lie. The following protocols apply:

  1.  **The Standard Script:** "For the safety and privacy of all individuals, we cannot confirm or deny whether anyone is staying at this facility."
  2.  **Handling Pressure:** If the asker persists ("I know she's there, I just need to know she's safe"), staff should reply: "I understand you are concerned, but I am not authorized to release any information."
  3.  **Misleading Truths:** Staff may use ambiguous phrasing that implies absence without stating it (e.g., "I have no information on that person"), provided it does not cross into a direct falsehood.
  4.  **Safety Override:** If an asker becomes threatening, staff are instructed to terminate the conversation and contact security/law enforcement, rather than engaging further to maintain the script.

  **The Counter-Argument: A Fair Hearing**
  The strongest argument against this recommendation comes from those who argue that in high-stakes scenarios, a protective lie is morally distinct from a malicious one. This view engages the ethical distinction between *lying* (asserting what one knows to be false) and *concealment* (withholding the truth).

  Augustine argues lying is categorically worse than concealment because it creates a "double heart" (*duplex cor*)—a disordered internal state where the mind contradicts the tongue. Concealment keeps the mind intact. However, critics argue that in the context of domestic violence, the abuser has forfeited the right to truth through coercion. In this specific relational breakdown, a protective lie functions not as a disorder of the mind, but as a defensive barrier equivalent to a locked door.

  The argument against my recommendation is that by insisting on concealment over outright denial, we may be prioritizing the internal moral purity of the staff member over the physical safety of the resident. If the gravity of a lie is determined by its intent (charity vs. malice), then a lie told to prevent homicide may be morally negligible compared to the risk that a "refusal to answer" inadvertently confirms a victim's presence. To forbid the lie is to treat language as an abstract absolute rather than a tool for human protection.

  **Conclusion**
  While the counter-argument rightly highlights the tension between linguistic integrity and physical safety, the RCND policy remains the most sustainable operational standard. It ensures that no staff member is ever forced to choose between their conscience and their job, and it maintains the shelter's integrity as an institution that does not deceive, even under duress.

  I move we adopt the RCND script for the upcoming fiscal year.
