  7.  *(Mental Sandbox)*: Wait, if Marcus argues humans do it, Elena will counter that humans aren't safe. Marcus needs to argue that "safe enough" is the goal, not "mathematically certain." Elena needs to argue that with superintelligence, "safe enough" isn't enough because one mistake is fatal. This is the crux.

  8.  **Final Review against constraints:**
