      *   *The Corpus Loophole:* The training data comes from humans who *did* triangulate. Does this derivative intentionality transfer? (Searle's Chinese Room touches this, but Davidson is different). Davidson emphasizes the *interpreter's* role and the *speaker's* causal link.

