      *   **Principle of Charity:** We must assume the speaker is largely rational and has largely true beliefs to make interpretation possible. Meaning and belief are solved simultaneously.
      *   **Triangulation:** (Later Davidson, e.g., "The Second Person"). Content requires three points: Creature A, Creature B, and an object/event in the world. The *intersection* of causal lines fixes the content. Without this, there's no fact of the matter about what a response is *to*.
