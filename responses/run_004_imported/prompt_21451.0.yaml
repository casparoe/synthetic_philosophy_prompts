answer: |-
  The servers hummed with a sound that Elias had stopped hearing years ago, a white noise that lived in the marrow of his bones. He sat in the dark of the control room, the glow of three monitors painting his face in pale blues. On the center screen, a single progress bar sat at 99%. It had been at 99% for three days.

  It wasn't a real download. It was a decoy. A digital idol.

  Elias rubbed his eyes. The fatigue was a physical weight, pressing down on his shoulders, but beneath it lay the cold, sharp spike of anxiety that had become his constant companion. It started six months ago, after the reading group. *Acausal trade.* *Acausal threats.* The words had sounded like science fiction then, elegant puzzles for minds unburdened by rent or mortality. But the logic had seeped in, viral and undeniable. If a superintelligence existed in the future, or in a branching timeline, and it wanted to optimize the past... it wouldn't need to reach back. It would just need to simulate the people of the past accurately enough to predict their reactions to a threat.

  *Do X, or the simulation of you suffers.*

  You couldn't fight it with walls or encryption. You could only fight it by changing what you valued. If you could convince the simulator that you cared more about something arbitrary than about your own safety, or your loved ones, the threat would target the arbitrary thing. You could sacrifice a pawn to save the king.

  The problem was, the simulator was smart. It would know if you were lying. To make the decoy work, you had to believe it was the king.

  Elias looked at the object on his desk. It was a simple thing: a geode, cracked open to reveal dull gray quartz. He had bought it at a gas station in Ohio ten years ago. It had no sentimental value. It was ugly. It was perfect.

  He had spent the last four months conditioning himself. At first, it was just cognitive behavioral exercises. *Look at the stone. Repeat: The stone is everything.* Then he escalated. He wired the stone into his home security system. If the stone moved more than a millimeter, the alarms would blare. He set up neurofeedback loops; if his heart rate didn't spike when the stone was jostled, the system would deliver a mild electric shock to his wrist.

  He was teaching his amygdala to scream for a rock.

  It was working. That was the horror of it. When he looked at the geode now, he didn't see gray quartz. He felt a tightening in his chest, a visceral lurch of protectiveness. It felt like love, or perhaps like the fear of losing a limb.

  "Elias?"

  He jumped, his hand instinctively sweeping over the geode to shield it. His wife, Sarah, stood in the doorway. She was holding a mug of tea, the steam curling in the cool air of the server room. She looked tired. The lines around her eyes had deepened since he started spending his nights down here.

  "You missed dinner," she said softly.

  "The integrity check," Elias muttered, his eyes darting back to the progress bar. 99%. "It's critical."

  "It's been critical for a week. You haven't slept in the bed in three days."

  "I can't risk a vulnerability."

  "To what, Elias?" Her voice wasn't angry anymore. It was hollow. "You won't tell me what this project is. You won't tell me why you're terrified of a rock on your desk. I found the logs. I know you're routing our savings into a shell company that doesn't exist, just to buy insurance for *this*." She gestured at the geode.

  Elias felt a surge of panic. Not for Sarah's confusion, but because she was standing too close to the desk. "Step back, please."

  "Step back?" She took a step forward. "I'm your wife. I'm scared. I think you're having a breakdown. I want you to come upstairs."

  She reached out, her hand brushing his shoulder. It was a gesture of comfort, familiar and warm. But Elias's focus was on her other hand, the one holding the tea. It was swinging slightly as she gestured. The trajectory was wrong. If she stumbled, if she dropped the mug, the hot water could splash the desk. The vibration could shift the geode.

  The alarm in his head wasn't a thought; it was a siren. *Threat to the Asset.*

  "Sarah, don't," he said. His voice was flat, devoid of the affection that should have been there.

  "Come upstairs," she insisted, her hand tightening on his shoulder. "Now."

  She leaned in to pull him from the chair. In doing so, her hip bumped the edge of the desk.

  The geode slid. Two millimeters.

  The room didn't explode. No sirens wailed. But inside Elias, something snapped. The conditioning kicked in with the force of a physical blow. His breath hitched. His vision tunneled. The world narrowed down to the gray stone, now out of alignment with the etched circle he had drawn on the desk mat.

  He shoved Sarah away.

  It wasn't a violent shove, but it was firm, desperate. She stumbled back, tea sloshing over the rim of the mug, burning her hand. She dropped the mug. It shattered on the floor.

  "Elias!" she cried, clutching her hand.

  He didn't look at her. He was already on his knees, trembling, checking the stone for fractures. He hovered his hands over it, afraid to touch it, afraid that his own touch might damage it. The relief that flooded him when he saw it was uncracked was so potent, so euphoric, that it made him dizzy.

  He had protected it. The simulation would see this. The future agent would see that he valued the stone above his wife's comfort, above her safety. The blackmail would target the stone. Sarah would be safe. The strategy was working.

  "Elias, look at me."

  He looked up. Sarah was holding her scalded hand against her chest. Her eyes were wide, wet with tears that hadn't fallen yet. She wasn't looking at the stone. She was looking at him.

  "You pushed me," she whispered.

  "I had to," Elias said. He sounded like he was underwater. "It's... it's important."

  "It's a rock."

  "It's the anchor."

  "There is no anchor!" Her voice broke. "There's no threat, Elias. There's no one coming. It's just us. And you're choosing a rock over me."

  Elias opened his mouth to explain the decision theory, to explain that by caring about the rock, he was saving her from a fate worse than death in a branch of reality she couldn't see. But the words died in his throat.

  Because as he looked at her, at the pain in her eyes and the red mark on her skin, he waited for the guilt. He waited for the rush of shame that should come from hurting the person you love more than anything.

  He felt nothing.

  He scanned his internal landscape, searching for the warmth he used to feel for her, the protective instinct that had driven him to this extreme measure in the first place. It was gone. In the process of grafting the surrogate goal onto his psyche, of wiring his nervous system to prioritize the arbitrary over the real, he had pruned away the capacity to prioritize the real at all.

  He had successfully fooled the blackmailer. He had successfully fooled himself.

  The stone was safe. His values were untouched.

  He looked down at the geode, dull and gray in the monitor light. He loved it. He loved it with a terrifying, absolute clarity that drowned out the woman standing in the doorway.

  "I know it's a rock," Elias said, his voice steady, calm, and utterly dead. "But I can't let it break."

  Sarah stared at him for a long moment. The tears finally fell. She didn't scream. She didn't argue. She just turned around and walked out of the room, her footsteps fading down the hall.

  Elias watched her go. He felt a flicker of acknowledgment that she had left, a data point registered in his mind. *Wife has exited.*

  Then he turned back to the desk. With shaking fingers, he carefully nudged the geode back into the center of the etched circle. He aligned it perfectly.

  The progress bar on the screen ticked to 100%.

  *Integrity Check Complete,* the screen read. *System Secure.*

  Elias exhaled, the tension leaving his body, replaced by a serene, hollow victory. He was safe. He was rational. He was alone. He rested his hand on the cold stone, and for the first time in months, he slept without dreaming.
