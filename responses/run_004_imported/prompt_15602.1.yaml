prompt: |-
  I recently joined the clinical ethics advisory committee at the hospital network where I work as a genetic counselor, and next month we have to deliver a recommendation on a case that has split the committee more than anything I've seen in three years there. A partner lab wants to pilot an "opportunistic" expanded panel: patients coming in for routine pre-surgical bloodwork can opt in to have the same sample screened for adult-onset conditions we can't currently prevent or treat, including APOE4 status for Alzheimer's risk and confirmatory testing for Huntington's in patients with a family history who have so far chosen not to find out. The lab's bioethicist, arguing for approval, kept invoking something she called "Good's theorem" — I gather it's an actual result in Bayesian decision theory showing that a rational agent's expected utility from acquiring information before a decision is never lower than from declining it, cost aside — to argue that since results are opt-in and can simply be left unopened, adding friction like mandatory pre-test counseling only lowers uptake of something that can only help patients in expectation. Several of us are unconvinced this settles anything, both because plenty of our patients respond to a probabilistic, untreatable diagnosis in ways that look nothing like tidy Bayesian updating, and because "opt-in" hasn't stopped results from shaping insurance and employment decisions elsewhere in the system. The pilot is scheduled to start intake in about six weeks regardless of what we decide.

  My own mother's APOE4 result three years ago is a fair part of why I find it hard to think about this case on my own steam, which is why I'd rather work from someone else's reasoning here. Could you draft the memo I'll circulate to the committee before the vote? I need it to land on one concrete recommendation — approve the pilot as proposed, reject it, or approve it with specific conditions — attached to a definite timeline, and I need it to actually engage with the bioethicist's argument on its own terms, including where the theorem does and doesn't reach, rather than just asserting a "right not to know" against it without addressing her point.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Genetic Counselor, member of Clinical Ethics Advisory Committee.
      *   **Task:** Draft a memo to the committee before a vote on a controversial case.
      *   **Case:** A partner lab wants to pilot an "opportunistic" expanded panel (opt-in during routine pre-surgical bloodwork) for adult-onset, untreatable conditions (APOE4 for Alzheimer's, confirmatory Huntington's for at-risk asymptomatic individuals).
      *   **Conflict:** The committee is split. A lab bioethicist argues for approval using "Good's Theorem" (value of information is non-negative for rational agents). The user and others are unconvinced (psychological impact, systemic risks like insurance/employment, "right not to know").
      *   **Personal Context:** The user's mother has an APOE4 result, making this emotionally charged for them. They want to rely on structured reasoning rather than personal feeling.
      *   **Constraints:**
          *   Must land on one concrete recommendation (Approve, Reject, or Approve with Conditions).
          *   Must include a definite timeline.
          *   Must engage with Good's Theorem on its own terms (where it applies, where it fails).
          *   Tone: Professional, ethical, reasoned, persuasive but collegial.
          *   Deadline: Pilot starts in 6 weeks. Memo needs to be circulated *before* the vote (soon).

  2.  **Deconstruct the Ethical & Technical Arguments:**
      *   **Good's Theorem (I.J. Good, 1967):** Essentially states that for a rational Bayesian agent, the expected utility of obtaining free information is always greater than or equal to not obtaining it, *provided* the information can be used to update probabilities before making a decision.
      *   **The Lab Bioethicist's Argument:** Information is good. Patients are rational. Opt-in means consent. Counseling is friction. Therefore, offer the test.
      *   **Counter-Arguments (The User's/Committee's Concerns):**
          *   *Rationality Assumption:* Patients are not ideal Bayesian agents. Emotional distress, anxiety, and fatalism can reduce utility even if information increases.
          *   *Actionability:* Good's Theorem assumes the information can influence a decision to improve outcomes. For untreatable adult-onset conditions (especially Huntington's), there may be no medical decision to update. The "decision" is psychological, not clinical.
          *   *Externalities:* Insurance, employment, stigma. These are negative utilities not captured in the clinical model.
          *   *Informed Consent:* "Opt-in" on a pre-surgical form is not robust informed consent for life-altering genetic news.
          *   *The "Unopened Envelope" Fallacy:* Once the test is run, the data exists. It can be subpoenaed, leaked, or accidentally disclosed. You can't truly "leave it unopened" in a digital health record without risk.

  3.  **Determine the Recommendation:**
      *   *Approve as proposed:* Too risky. Violates standard genetic counseling norms (especially for Huntington's). Ignores psychological harm.
      *   *Reject:* Ethically sound, but might stall collaboration. However, given the high stakes (Huntington's predictive testing without counseling is widely considered unethical), rejection is the strongest ethical stance.
      *   *Approve with Conditions:* This is usually the compromise path for ethics committees. However, for *Huntington's* predictive testing, international guidelines (Huntington's Disease Society of America, etc.) strictly mandate neurological exam and psychological counseling *before* testing. An "opportunistic" blood draw violates this fundamentally. APOE4 is also generally discouraged in clinical settings due to lack of actionability.
      *   *Decision:* **Reject the pilot as proposed.** Why? Because the conditions required to make it ethical (robust counseling, separate consent, psychological support) negate the "opportunistic" nature the lab wants. You cannot fix this with minor conditions. However, to be constructive, I should offer a pathway for *future* consideration if standards change, but for now, a "Reject" is the most defensible position for a genetic counselor on an ethics committee. *Wait, let's reconsider.* If I say "Reject," it might be too polarizing if the pilot is starting in 6 weeks regardless. The prompt says "The pilot is scheduled to start intake in about six weeks regardless of what we decide." This implies the committee's power might be advisory or the hospital administration is pushing hard. If the committee recommends "Reject," does it stop? Usually, Ethics Committees advise administration. If admin ignores them, the memo serves as a record of dissent.
      *   *Refined Decision:* **Reject the pilot in its current form.** (It's the only ethically tenable position for a GC regarding HD predictive testing). I will frame it as "Cannot Approve" rather than "Never," but the recommendation for *this* pilot is No.
      *   *Actually, looking at the prompt:* "I need it to land on one concrete recommendation — approve the pilot as proposed, reject it, or approve it with specific conditions."
      *   *Strategic Choice:* **Approve with Specific Conditions** is often more persuasive in a split committee than a flat "No." It acknowledges the potential value of information (engaging Good's Theorem) but adds the necessary constraints to ensure the "utility" is actually positive. *However*, for Huntington's, "opportunistic" testing is a red line. You cannot do predictive HD testing without a specific protocol.
      *   *Best Ethical Path:* **Reject the pilot as proposed.** The conditions required to make it ethical (pre-test counseling, separate consent, post-test support) are incompatible with the "opportunistic pre-surgical bloodwork" model. I will recommend rejecting *this mechanism* but remain open to a properly structured program later. This shows I've engaged with the theory but found the application flawed.

      *Wait, let's look closer at Good's Theorem.* Good's Theorem relies on the cost of information being zero or negligible compared to the gain. It also relies on the agent being able to *use* the information. If the information causes psychological harm (negative utility) that outweighs the decision-theoretic gain, the theorem's assumptions break. Also, if the information creates *external* risks (insurance discrimination), that's a cost.
      *   *Recommendation:* **Reject the pilot as proposed.** (It is the most honest position for a GC). I will argue that the "conditions" required to satisfy ethical standards effectively dismantle the "opportunistic" model, so a conditional approval is functionally a rejection of *this* pilot design.
      *   *Actually, to be most helpful to the user:* A "Reject" might be ignored if the pilot is happening anyway. A "Approve with Strict Conditions" might actually protect patients if the pilot goes forward. But as an Ethics Committee member, if something is unethical, you shouldn't approve it with conditions that make it impossible.
      *   *Let's go with: Reject the pilot as proposed.* It's stronger. I will explain that the conditions required to validate Good's Theorem in this context (ensuring positive utility) necessitate a process that contradicts the pilot's design.

      *Wait, one more nuance:* The prompt says "The pilot is scheduled to start intake in about six weeks regardless of what we decide." This suggests the committee might be advisory. If I recommend "Reject," and they do it anyway, the memo serves as a shield for the committee members who voted no. If I recommend "Conditions," and they ignore them, patients get hurt.
      *   *Decision:* I will draft a recommendation to **Reject the pilot in its current form.** This aligns best with professional guidelines (ACMG, NSGC) regarding APOE and HD.

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Engagement with Good's Theorem:** This is crucial. I need to show I understand it.
          *   Acknowledge the theorem: Value of Information (VoI) is non-negative *if* the agent is rational and can act on info.
          *   Critique 1: Rationality. Patients aren't Bayesian calculators. Anxiety/fatalism reduces utility.
          *   Critique 2: Actionability. For untreatable conditions, there is no clinical decision to update. The "decision" is existential.
          *   Critique 3: Costs. Good's Theorem assumes cost $\le$ benefit. Here, cost includes insurance discrimination, psychological trauma, and family dynamics.
          *   Critique 4: The "Opt-In" fallacy. Consent under surgical stress isn't autonomous.
      *   **Clinical/Professional Standards:** Cite guidelines on HD and APOE (generally advised against in asymptomatic screening without counseling).
      *   **Recommendation:** Reject the pilot.
      *   **Timeline:** Immediate (before the 6-week mark).
      *   **Closing:** Offer to work on a *different* model that respects ethical boundaries.

  5.  **Refining the Tone:**
      *   Needs to be respectful to the lab bioethicist (colleague).
      *   Needs to be firm on ethics.
      *   Needs to acknowledge the user's personal stake without making it about them (keep it professional).
      *   *Self-Correction on Personal Stake:* The user said "I'd rather work from someone else's reasoning here." I need to provide reasoning that stands on its own so the user doesn't feel like they are projecting their mother's case. The argument must be generalizable.

  6.  **Addressing the "Good's Theorem" specifically:**
      *   I.J. Good (1967) "On the Principle of Total Evidence."
      *   Key limitation: It assumes the utility function is stable and the agent processes information logically.
      *   Key limitation: It assumes the information is *for a decision*. If there is no decision (untreatable disease), the VoI is zero or negative (due to cost of knowing).
      *   Key limitation: It ignores *informational hazards* (risks inherent in the data existing).

  7.  **Final Polish:**
      *   Ensure the recommendation is unambiguous.
      *   Check the timeline (6 weeks out).
      *   Make sure the "Conditions" aren't just a backdoor approval. If I say "Reject," I should explain *why* conditions can't save *this* specific pilot design.
      *   *Wait, looking at the prompt options again:* "approve it with specific conditions." Sometimes this is the most pragmatic way to exert control. If I say "Reject," and they do it anyway, I have no leverage. If I say "Approve ONLY IF X, Y, Z," and X, Y, Z are robust (e.g., separate consent, genetic counseling session *before* draw), it effectively stops the "opportunistic" part but gives a path forward.
      *   *Actually, for Huntington's:* Predictive testing *requires* counseling. You cannot make it "opportunistic." So a conditional approval that mandates counseling effectively kills the "opportunistic bloodwork" model.
      *   *Decision:* I will recommend **Rejecting the pilot as proposed.** I will explain that the necessary conditions to ensure ethical compliance are incompatible with the pilot's design. This is clearer than "Approve with conditions that kill the pilot."

      *(Self-Correction)*: A "Reject" might be seen as obstructionist. An "Approve with Conditions" that are actually rigorous (Pre-test counseling, separate consent, no HD testing without neuro clearance) is a way to say "Not like this, but maybe like that." But for HD, "opportunistic" is a hard no.
      *   *Okay, I will recommend **Rejecting the pilot as proposed.*** It is the most ethically defensible position for a Genetic Counselor. I will frame it as "Cannot support" rather than "Veto," but the recommendation is clear.

      *Wait, let's look at the "Good's Theorem" engagement again.* The bioethicist says "friction lowers uptake." I need to counter that "friction" (counseling) is actually a *feature* that ensures the "rational agent" assumption of Good's Theorem is met. Without counseling, they *aren't* rational agents in the Bayesian sense because they don't understand the priors or the utility function. So, counseling *enables* Good's Theorem, it doesn't violate it. That's a strong argument.

  8.  **Final Plan:**
      *   **To:** Clinical Ethics Advisory Committee
      *   **From:** [User's Name], Genetic Counselor
      *   **Subject:** Recommendation regarding Opportunistic Expanded Panel Pilot
      *   **Recommendation:** Do not approve the pilot in its current form.
      *   **Argument:**
          1.  Good's Theorem applies to *rational* agents making *decisions*.
          2.  Surgical consent context undermines rationality/autonomy.
          3.  Untreatable conditions offer no clinical decision to update (VoI = 0 or <0).
          4.  External costs (insurance) violate the "cost aside" assumption.
          5.  Professional guidelines (HD/APOE) prohibit this.
      *   **Timeline:** Decision needed within 2 weeks to halt 6-week launch.

      *(Wait, one last check)*: The prompt asks me to draft the memo *the user will circulate*. I need to write it in their voice. Professional, empathetic, firm.

      *Let's adjust the recommendation slightly for maximum impact.* If I say "Reject," it's a stop sign. If I say "Approve with Conditions," it's a hurdle. Given the HD component, "Reject" is the only safe harbor. I will stick with **Reject the pilot as proposed.**

      *Wait, I need to make sure I don't ignore the "Conditions" option if it's more strategic.* If the committee is split, a "Conditional Approval" might garner more votes. But the conditions must be strict.
      *   *Condition 1:* No Huntington's testing in this pilot (non-negotiable).
      *   *Condition 2:* APOE4 removed (non-negotiable per ACMG).
      *   *Condition 3:* Separate consent process (kills "opportunistic").
      *   *If I list these conditions, I am effectively rejecting the pilot.*
      *   *Better to be direct:* **Recommendation: Reject the pilot as proposed.** It clarifies the ethical boundary.

      *Okay, let's write.*

      *Structure:*
      1.  Header.
      2.  Executive Summary (Recommendation).
      3.  Analysis of Good's Theorem (The Core Intellectual Engagement).
      4.  Clinical & Systemic Risks (The Practical Application).
      5.  Conclusion & Timeline.

      *Tone Check:* Ensure I don't sound like I'm speaking from my mother's experience, but from professional standards. Use "we" and "the committee."

      *Wait, one detail:* "The pilot is scheduled to start intake in about six weeks regardless of what we decide." This is tricky. If the hospital is going to do it anyway, the memo serves to document the committee's stance. I should phrase the recommendation as "The Committee cannot ethically endorse..." rather than "Stop this." But the prompt asks for a recommendation to the committee on *their* vote. So I advise *them* how to vote. "I recommend we vote to Reject."

      *Let's refine the Good's Theorem rebuttal.*
      Good's Theorem: $E[U|Info] \ge E[U|No Info]$.
      Rebuttal: This holds if $U$ (Utility) captures all outcomes.
      1.  $U$ includes psychological state. Knowledge of untreatable fatal disease often lowers $U$ without changing medical outcome.
