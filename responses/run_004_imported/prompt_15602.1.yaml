answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Advisory Committee
  **FROM:** [Your Name], MS, CGC, Genetic Counselor
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Partner Lab "Opportunistic" Expanded Panel Pilot

  ### Executive Summary & Recommendation

  After reviewing the proposal for the opportunistic expanded genetic panel pilot and considering the arguments presented at our last convening, I recommend that the Committee **vote to reject the pilot in its current form.**

  While the intention to increase patient access to information is commendable, the specific design of this pilot—specifically the inclusion of untreatable adult-onset conditions (APOE4, Huntington's) within a pre-surgical consent workflow—violates established standards of genetic care and introduces unacceptable systemic risks.

  I propose we communicate this decision to Hospital Administration and the Partner Lab within **two weeks**, allowing a four-week buffer before the scheduled six-week pilot launch to halt intake procedures.

  ### Engagement with the Value of Information Argument

  Our colleague from the Partner Lab has anchored the argument for approval in **Good's Theorem** (I.J. Good, 1967), positing that for a rational agent, the expected utility of obtaining free information prior to a decision is never lower than declining it. The argument follows that because the test is opt-in and results can be declined ("left unopened"), the friction of counseling unnecessarily suppresses uptake of a net-positive good.

  While mathematically sound in abstract decision theory, this application fails to hold in the clinical context for three specific reasons:

  **1. The "Rational Agent" Assumption**
  Good's Theorem assumes the agent updates probabilities logically and maintains a stable utility function. In a pre-surgical context, patients are under acute stress, facing anesthesia risks and procedural anxiety. This is not an environment conducive to the autonomous, deliberative consent required for life-altering genetic information. Furthermore, human psychology does not always process probabilistic risk as "information"; for untreatable conditions, it is often experienced as a "sentence." If the psychological distress (negative utility) outweighs the benefit of preparedness, the theorem's inequality flips.

  **2. The Absence of a Clinical Decision Node**
  Good's Theorem relies on information updating a *decision* to improve an outcome. For actionable conditions (e.g., *BRCA* leading to mastectomy), the information has instrumental value. For adult-onset, untreatable conditions like late-onset Alzheimer's (APOE4) or Huntington's disease in asymptomatic individuals, there is no medical intervention to update. The only "decision" is existential. When information cannot change clinical management, the cost of acquiring it (psychological burden, family disruption) becomes the dominant variable in the utility function.

  **3. Externalities and Informational Hazards**
  The theorem assumes the cost of information is negligible or captured in the model. It does not account for **informational hazards** external to the clinical encounter.
  *   **Insurance:** GINA protections do not extend to life, disability, or long-term care insurance. A positive result, even if "unopened" by the patient, enters the medical record and can be subpoenaed or accessed during future underwriting.
  *   **Data Integrity:** The suggestion that results can be "left unopened" is technically fragile. In integrated EHR systems, flags or incidental notes can leak status. Once the data exists, the risk of accidental disclosure is non-zero.

  ### Clinical Standards and Liability

  Beyond decision theory, this pilot conflicts with established professional guidelines:
  *   **Huntington's Disease:** International consensus (HDSA, EHA) mandates a specific protocol for predictive testing, including neurological examination and multiple sessions of psychological counseling *before* testing. Opportunistic bloodwork bypasses these safeguards entirely.
  *   **APOE4:** The American College of Medical Genetics and Genomics (ACMG) generally advises against clinical testing for APOE4 status due to low predictive value and lack of actionability.

  ### Conclusion

  The argument that "friction lowers uptake" is correct, but in this context, that friction (counseling, separate consent, psychological evaluation) is not a barrier; it is a **safety mechanism**. It ensures the patient meets the "rational agent" criteria required for Good's Theorem to actually apply. Removing that friction does not make the test more ethical; it makes the data more dangerous.

  We cannot endorse a model that prioritizes data acquisition over patient welfare, particularly when the patients involved are vulnerable (pre-surgical) and the conditions are untreatable.

  **Proposed Next Steps:**
  1.  **Vote:** Committee vote to reject the pilot as proposed.
  2.  **Notification:** Formal letter to Partner Lab and Hospital Administration within 14 days.
  3.  **Alternative Pathway:** Offer to convene a working group to design a *separate* predictive testing program that adheres to standard genetic counseling protocols (separate consent, pre-test counseling, no opportunistic bundling), should the Lab wish to pursue that in the future.

  I am available to discuss this reasoning further before our vote next week.

  Respectfully,

  [Your Name]
  Genetic Counselor
  Clinical Ethics Advisory Committee Member
