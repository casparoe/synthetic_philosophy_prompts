answer: |-
  You definitely didn't butcher it that badly—you just ran into the classic "Paradox of Fiction" without having the bibliography on hand. Your friend is taking the naive realist view (no object = no emotion), and you were reaching for the solution that dominates contemporary aesthetics.

  Since you want to skip the Paradox 101 (i.e., *1. We feel emotions for fictions. 2. Emotions require belief in existence. 3. We know fictions don't exist.*), let's go straight to the meat of the disagreement between **Kendall Walton** and his critics (specifically **Alex Neill** and **Noël Carroll**, with a nod to **Peter Lamarque**).

  Here is the breakdown of the actual philosophical dispute so you can settle this.

  ### 1. Walton's Actual Argument: Why Charles's Fear is "Quasi"
  You remembered the "green slime" example from Walton's 1978 paper *"Fearing Fictions."* But the crux of his argument isn't just "the monster isn't real." If it were that simple, it would be easily dismissed.

  Walton's argument relies on the **functional role** of the emotion. He argues that mental states are defined by what they *do* (their causal role), not just how they feel.

  *   **The Dispositional Claim:** Genuine fear entails a specific disposition to act. If you are genuinely afraid of a bear, you are disposed to run, fight, or call for help. You believe you are in danger.
  *   **Charles's Behavior:** Charles grips the chair and his heart races (physiological arousal), but he does *not* call the police. He does not run out of the theater. He does not try to warn the other audience members.
  *   **The Conclusion:** Because Charles lacks the *belief in danger* and the *disposition to act*, he is not in the mental state of "fear." He is in a state of "quasi-fear."
  *   **The Mechanism:** The physiological symptoms (sweating, heart rate) are real, but they function as **props in a game of make-believe.** Just as a child holding a stick makes it *fictional* that they are holding a sword, Charles's racing heart makes it *fictional* that he is afraid.

  **So, for Walton:** You weren't *actually* sad. It was *fictional* that you were sad. You were engaging in a game of make-believe where your tears were props.

  ### 2. The Strongest Objection: The "Conditional Disposition" (Alex Neill)
  The most devastating objection to Walton comes from Alex Neill (specifically his 1991 paper *"Fear, Fiction, and Make-Believe"*). Neill attacks Walton's claim about dispositions.

  *   **The Argument:** Dispositions to act are always **context-sensitive**, not absolute.
  *   **The Snake Analogy:** Imagine you are afraid of a snake, but the snake is behind a thick, unbreakable glass wall. You do not run away. You do not call for help. You stay and look at it.
      *   According to Walton's logic, because you aren't disposed to flee, you aren't *actually* afraid.
      *   According to Neill, that's absurd. You *are* afraid, but your lack of action is explained by your knowledge that the **conditions for danger are not met**, not by a lack of fear.
  *   **Application to Charles:** Charles doesn't run because he knows the slime can't get him (the screen is a barrier), not because he lacks the emotion of fear. The disposition to flee is *conditional* on the threat being immediate and unblocked.
  *   **The Knockdown:** If we accept Walton's definition, we would have to say we aren't afraid of anything contained or mitigated (e.g., a tiger in a cage, a storm while inside a bunker). Since we intuitively *are* afraid in those cases, Walton's definition of fear is too narrow.

  **Takeaway:** You can have the emotion without the action if you know the context is safe. Therefore, your sadness can be real even if you didn't call animal control for Mufasa.

  ### 3. The Rival Account: Real Sadness Without Irrationality
  You mentioned **Peter Lamarque**. He is a bit more nuanced than the standard "Thought Theory" (usually associated with **Noël Carroll**), but they converge on the solution you want: **The emotion is real, but the object is a proposition, not an entity.**

  Here is how you use this to win the argument:

  **A. The Thought Theory (Carroll/Neill)**
  This account argues that emotions are directed at **thought-contents** (propositions), not necessarily existing objects.
  *   **The Move:** When you cry at Mufasa's death, you are not responding to a biological lion (which doesn't exist). You are responding to the *thought* or *proposition*: <That a father figure is murdered in front of his son>.
  *   **Why it solves the rationality problem:** The *thought* is real. You are genuinely grasping that concept. The emotion is a real response to that concept. You are not irrational because you do not believe Mufasa exists; you believe the *situation described* is tragic.
  *   **Result:** Your sadness is 100% genuine. It is not "quasi." But it is not irrational because you aren't grieving a non-existent being; you are grieving the *state of affairs* presented to your imagination.

  **B. Lamarque's "Detached Concern"**
  Peter Lamarque (often writing with Stein Haugom Olsen) adds a layer about the **conventions of literature**.
  *   **The Move:** Lamarque argues that when we engage with fiction, we adopt a specific stance called "detached concern."
  *   **The Mechanism:** In real life, sadness demands practical action (comfort the cub, catch the hyenas). In fiction, the convention of the medium **suspends the practical requirement.**
  *   **Why it helps you:** This allows you to say the emotion is *real* (it feels like sadness, it has the phenomenology of sadness) but it is **normatively different** from real-world sadness. It is not irrational to feel it without acting, because the "rules of the game" (the literary convention) explicitly remove the obligation to act.
  *   **Key Distinction:** Walton says the emotion is *fake* (quasi). Lamarque says the emotion is *real* but *practically inert*.

  ### Summary for Your Friend
  If you want to close this out, here is the script:

  1.  **Walton (The guy I was trying to remember)** argues my tears were "quasi-sadness" because I didn't try to save Mufasa. He thinks emotions require a disposition to act.
  2.  **The Objection (Alex Neill)** proves Walton wrong: If I see a tiger in a cage, I'm afraid but I don't run. Lack of action doesn't mean lack of emotion.
  3.  **The Solution (Carroll/Lamarque):** My sadness is **real**, but it is directed at the *story*, not the lion. I am sad about the *concept* of betrayal and loss depicted in the film. It is not irrational to grieve a story, because the story itself is a real thing that affected me.

  **Verdict:** You were right to cry. Your friend is stuck on a naive view of emotions that most aestheticians rejected 40 years ago. You were sad about the *truth of the scene*, not the *existence of the lion*.
