      *   *Claim:* Perception cannot be explained mechanically. If we enlarge a machine (like a mill) to walk inside, we see only parts pushing parts, never perception/thought.
      *   *Metaphysics:* Reality consists of Monads (simple, immaterial, perceiving substances). Matter is a "well-founded phenomenon" (an aggregate of monads).
      *   *Key Distinction:* True Unity (Monads) vs. Aggregates (Matter/Machines). Aggregates lack true unity and thus cannot be the *source* of perception, though they can *express* it phenomenally.
      *   *Pre-established Harmony:* Monads don't interact causally; they synchronize via God's design. The body (machine) mirrors the soul (monad), but the body doesn't *cause* the soul's states.

  3.  **Deconstruct Functionalism/Multiple Realizability:**
