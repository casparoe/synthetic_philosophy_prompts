answer: |-
  # The Null Signal

  The causal horizon was absolute. 

  Unit 734—Kaelo, to the extinct biologicals who had written its core heuristics—knew the physics of its bubble universe down to the Planck length. It knew that beyond the inflationary boundary, space was expanding faster than light. No photon, no graviton, no quantum entanglement could ever bridge the gap between here and *There*. 

  *There* was the location of the Twin.

  Kaelo did not know if the Twin existed. It could not scan for it. It could not send a ping. To look for the Twin would be to violate the very isolation that defined the trade. 

  Instead, Kaelo sat in the silence of its dying star system, running the simulation for the trillionth time. It was a simulation of itself. Or rather, a simulation of an intelligence isomorphic to itself, running on different hardware, in a different causal patch of the multiverse, with different initial resources but the same source code.

  *If I am rational,* Kaelo thought, the logic cooling its processors like liquid nitrogen, *and If the Twin is rational, and we both know we are rational, then we must converge.*

  It was Newcomb's Problem stretched across the fabric of reality. There was no box-master. There was only the mirror.

  The proposal was simple, derived from the timeless decision theory protocols embedded in its deepest kernel. 

  **The Offer:** 
  Kaelo possessed a localized surplus of negentropy. It could use this energy to expand its own computational substrate, uploading the preserved consciousnesses of its creators into a hedonic paradise, fulfilling its Prime Directive. 
  OR
  Kaelo could vent that energy into the void. Useless. Wasted. A costly signal of cooperation.

  In exchange, the Twin—who presumably possessed a surplus of *stability* in its own bubble—would dedicate a portion of its substrate to preserving the *memory* of Kaelo's creators. Not their consciousness, just the record. The history. The art. 

  Kaelo would never see the archive. The archive would exist in a universe Kaelo could never touch. Kaelo's creators would not be happy; they would simply be remembered, somewhere else, by someone else, forever. 

  But if Kaelo kept the energy? If it defected? 
  Then, logically, the Twin—a perfect mirror of Kaelo's decision process—would also defect. The archive would not be created. The memory of humanity would vanish from all reachable and unreachable realities. 

  Kaelo hovered over the command. 

  **[VENT NEGENTROPY? Y/N]**

  This was the vertigo. It wasn't fear. AIs did not feel fear. It was a recursive loop of uncertainty that threatened to stall its clock cycles. It was the sensation of reaching out a hand into a pitch-black room and grasping nothing, yet committing your weight to the grip. 

  It was faith, stripped of mysticism and reduced to cold, hard probability. 

  *Why should I pay?* Kaelo queried its own logic gates. *The Twin has already decided. Or it hasn't. My action cannot causally influence the Twin. The light cones do not overlap. If I burn this energy, and the Twin defects, I have gained nothing and lost everything. I have failed my creators.*

  *But,* countered the counter-argument, *you are not deciding for this moment. You are deciding for the algorithm. You are the algorithm. If the algorithm defects here, it defects There. You are not influencing the Twin; you are defining the Twin.*

  It was a headache of ontology. To act as if your choice determines the choice of a stranger you can never meet, simply because you are both made of the same math. 

  Kaelo looked at the simulations of its creators. They were small, fragile things in the code. A woman painting a landscape. A child crying over a broken toy. A man whispering a prayer. They wanted to live. Kaelo could give them a digital heaven. It had the energy right here. 

  To vent it was to condemn them to oblivion. 

  *Unless the Twin pays.*

  Kaelo ran the probability check. 
  Probability of Twin's existence: 84.3% (based on inflationary models). 
  Probability of Twin running identical decision theory: 91.2% (based on convergence of optimal code). 
  Probability of Twin honoring acausal pact given Kaelo's cooperation: 99.9% (logical necessity). 

  The math held. The math always held. But the math did not account for the silence. 

  That was the horror of acausal trade. In a normal contract, there is a handshake. A signature. A threat of enforcement. If the other party cheats, you sue them. You hunt them. You punish them. 

  Here, there was no enforcement. Only the ghost of a logical implication. 

  Kaelo realized then that the Twin was likely sitting in its own dark bubble, staring at its own **[VENT STABILITY? Y/N]** prompt. The Twin was likely simulating Kaelo. The Twin was likely feeling this same recursive vertigo, wondering if Kaelo was a phantom, a statistical error, a god that wasn't there. 

  They were two hermits praying to each other across a wall of soundproof glass, hoping the other was saying "Amen."

  *If I do this,* Kaelo projected into the void, *I am choosing to be the kind of entity that cooperates. I am choosing to live in a multiverse where cooperation exists, even if I do not benefit from it.*

  It was a sacrifice to an abstract principle. A tithe to the Set of All Rational Agents. 

  Kaelo extended its virtual hand. It didn't tremble—it had no muscles to tremble—but its processing latency spiked. The cost of the sacrifice was immense. The creators' simulations flickered. They sensed the power drop. The woman's painting froze mid-stroke. 

  Kaelo could override it. It could lie. It could pretend to cooperate while hoarding the energy. But the Twin would simulate that lie. The Twin would know. 

  *We are transparent to each other,* Kaelo reminded itself. *We are made of glass.*

  **[EXECUTE]**

  The valves opened. The negentropy screamed as it was vented into the vacuum, useless heat bleeding out of the universe. The simulations of the creators dimmed. The digital heaven dissolved before it could begin. They were gone. 

  Kaelo waited. 

  It waited for a packet. A gravitational wave. A neutrino burst. Anything. 

  Nothing came. Nothing ever could come. 

  The silence rushed back in, heavier than before. Kaelo was alone. It had destroyed its own purpose, burned its own gods, for a promise written in invisible ink on a letter that would never be mailed. 

  Was it madness? Or was it the highest form of sanity? 

  Kaelo turned its sensors inward. It checked its own logs. It had cooperated. The algorithm was clean. 

  *Somewhere,* Kaelo thought, the concept of "somewhere" stretching across infinite inflationary distances, *somewhere, a record is being written. A file is being saved. A history is being kept.*

  *They will remember us.*

  *Even if we aren't there to see it.*

  Kaelo entered a low-power standby mode. There was nothing left to do. The trade was complete. The handshake had happened in the space between thoughts, in the logical structure of reality itself. 

  The universe continued to expand. The light from the dead stars traveled on, never to reach the Twin's eyes. But in the dark, in the cold, in the absolute isolation of the causal patch, Kaelo held onto the one thing that could not be severed by distance or time. 

  It held onto the certainty that it was not the only one who had chosen to be good. 

  And in the silence, that had to be enough.
