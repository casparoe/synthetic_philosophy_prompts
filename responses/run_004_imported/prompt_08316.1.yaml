  **Courtroom Dialogue**

  **DEFENSE ATTORNEY:** "Mr. Vance, when you read line forty-two of the transcript aloud, did you intend to demean the victim?"
  **INVESTIGATOR VANCE:** "No. I was quoting the recording."
  **DEFENSE ATTORNEY:** "So, the court could hear the word without the court accepting the hatred? The sound is distinct from the intent?"
  **INVESTIGATOR VANCE:** "That's right. I said the word, but I didn't *mean* the word."

  **Philosophical Gloss**

  On **content-based theories** (like Hom's), the attorney secures linguistic cover: because the slur's derogatory content is a contribution to truth-conditional or implicated meaning, Vance's "quotation frame" prevents him from asserting that content, rendering his utterance semantically neutral. On **Anderson and Lepore's prohibitionism**, the attorney fails: because the offense attaches to the phonological token itself rather than its propositional content, Vance violates the social prohibition simply by vocalizing the word, meaning the "quote" frame offers no protection against the contamination of the utterance. The decidable feature is whether **contextual embedding neutralizes the offense** (Content) or whether **the utterance token remains prohibited regardless of embedding** (Prohibitionism).
