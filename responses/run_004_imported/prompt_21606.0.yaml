answer: |-
  The hum of the chronometric aperture was less a sound and more a pressure behind the eyes, a physical weight in the concrete bunker. Sarah stood with one foot on the platform, the heavy pistol checked and cold in her hand. She wasn't looking at the controls; she was looking at the two men flanking the machine.

  Elena adjusted her glasses, her face illuminated by the blue Cherenkov glow of the ring. Marcus leaned against a support pillar, arms crossed, looking deceptively relaxed.

  "If she pulls the trigger," Elena said, her voice cutting through the hum, "the gun will jam. Or she'll slip. Or she'll have a sudden change of heart. The probability amplitude for a successful patricide is zero."

  "That's magic, El," Marcus said, pushing off the pillar. "Dressed up as boundary conditions. You're telling me the universe reaches back from eighty years in the future to twist the firing pin? That's non-local causality. It violates the spirit of relativity more than the time travel itself."

  "It violates nothing," Elena countered. "It's the Novikov Self-Consistency Principle. It's David Lewis's logic applied to metal. You can't have a true contradiction. If she travels back, she *is* part of that past. She was always there. If her grandfather lived to have her father, then nothing she does can stop him. The universe doesn't 'reach back'; the timeline is a closed loop. The constraints are global."

  "Global constraints that manifest as local miracles," Marcus snapped. "A bird flies in front of the scope? A sudden seizure? How many 'coincidences' does your theory require before you admit it's conspiratorial? You're asking physics to act like a protective nanny. 'No, Sarah, you can't do that, it would make a paradox.'"

  "I'm asking physics to be consistent," Elena shot back. "Your alternative is ontological extravagance on a cosmic scale. Deutsch's model. Every time she pulls the trigger, the universe splits? Just to accommodate a murder? You're postulating an infinite graveyard of branching realities just to save the linearity of the wave function. That's Occam's Razor wielded like a club against reality itself."

  "It's not postulating," Marcus said, stepping closer to the ring. "It's accepting the math of quantum mechanics. Unitary evolution. If you have a Closed Timelike Curve, the only way to preserve unitarity without singularities is to allow the state vector to evolve into a mixed state across branches. She kills the grandfather in Branch B. She originated in Branch A. No contradiction. The 'you' that dies isn't the 'you' that shot."

  "And where does the energy for Branch B come from?" Elena demanded. "You're creating a whole new cosmos every time a particle loops back with a different phase. And don't get me started on the computational implications. If Deutsch is right, CTCs allow us to solve PSPACE-complete problems in polynomial time. You could factor large integers instantly. You could break the universe's encryption just by looping a qubit. Nature doesn't give free lunches that big, Marcus."

  Marcus smiled, a thin, sharp expression. "Why not? You're assuming classical complexity limits apply to quantum gravity. Maybe the universe *is* a computer, and CTCs are just root access. But look at your 'free lunch.' In your model, Sarah has no agency. She's a puppet. She *thinks* she can choose to shoot, but the physics forces her hand. That's hard determinism bordering on predestination. It renders the concept of 'experiment' meaningless. How do you test a theory where the experimenter is physically compelled to produce the null result?"

  "I can test it," Elena said, gesturing to Sarah. "If the gun fires, I'm wrong. If it doesn't, I'm right. It's falsifiable."

  "Is it?" Marcus pounced. "If the gun jams, you say 'See? Consistency!' But if the gun fires, I say 'See? Branching!' You've insulated your theory against refutation. Any failure is 'consistency,' any success is 'a branch we can no longer observe.' You're hiding behind the event horizon of the paradox."

  "And you're hiding behind the multiverse!" Elena's voice rose. "At least my view respects the singularity of history. We live in *one* world, Marcus. When I break a cup, it stays broken. I don't get to hop to a timeline where the cup is whole. Why should time travel be different? If she goes back, she is in *her* past. The past that made her. If she changes it, she erases the cause of her journey. That is a logical contradiction, not just a quantum superposition."

  "It's not a superposition, it's a divergence," Marcus corrected. "Think of it like a rail switch. The train doesn't crash; it changes tracks. Your 'logical contradiction' assumes a single track. But QM tells us reality is a forest, not a line. The paradox only exists if you insist on a single timeline. Let go of that ego-centric view that there is only *one* history."

  "The 'ego-centric view' is called empirical evidence," Elena said. "We never observe branches. We never see interference from other worlds. You're solving a logical problem by inventing invisible entities. I'm solving it by imposing constraints on visible ones. My 'jammed gun' is a physical event in this room. Your 'new branch' is metaphysical speculation."

  "Your 'jammed gun' requires the laws of physics to act differently here than anywhere else," Marcus argued. "In every other context, if I point a working gun at a target and pull the trigger, the bullet flies. Here, you're saying the fundamental forces conspire to stop it. The strong force holding the firing pin suddenly fails? The chemical reaction in the primer fizzles? That's not a constraint; that's a violation of local effective field theory. You're breaking physics to save logic."

  "And you're breaking logic to save physics!" Elena countered. "You'd rather shatter the causal chain of identity than admit that some paths in configuration space are forbidden. It's like a perpetual motion machine. You can build one, you can wind it, but it won't run. Not because of magic, but because the phase space doesn't allow it."

  Sarah cleared her throat. The sound was small, but it silenced them both. She checked the magazine one last time. "I'm not a variable," she said quietly. "I'm a person. I'm going to find out if I'm a puppet or a ghost."

  She looked at Elena. "If you're right, I fail. I come back, or I don't come back, but he lives."

  She looked at Marcus. "If you're right, I succeed. But I can't come back to *this* room. I'll come back to a room that looks like this, but you won't be the you that watched me leave."

  "That's the cost of consistency," Elena said softly.

  "That's the cost of freedom," Marcus replied.

  Sarah stepped onto the platform. The hum intensified. The air smelled of ozone and old dust.

  "One last thing," Marcus called out, his voice straining over the noise. "If you see him... if you see your grandfather... ask him if he remembers a scar on his chin. The one he got from a fall in 1942."

  Elena whipped her head toward him. "What are you doing?"

  "Testing the branch," Marcus said, eyes locked on Sarah. "If I'm right, the scar might not be there. Because in the branch where she shoots him, he doesn't fall in '42. He dies in '43. Or he lives without the scar. If the scar is gone, the history changed. If the scar is there..."

  "...then she was always part of the fall," Elena finished. She looked at Sarah, her expression pained. "Don't try to force it, Sarah. If the universe says no, it says no. Don't fight the current."

  "I'm not fighting anything," Sarah said. She raised the gun, not at them, but at the air, checking the sight. "I'm just pulling the trigger."

  She engaged the temporal drive. The light swallowed her. The hum dropped to a silence so profound it rang in their ears. The platform was empty.

  Elena let out a breath she didn't know she was holding. Marcus stared at the empty space, his arms uncrossed, hands hanging loose at his sides.

  "She'll be back in an hour," Elena said, her voice steady, though her hands trembled slightly. "If she comes back."

  "If she comes back," Marcus said, "and says she did it... then you have to admit the branch exists."

  "If she comes back," Elena said, turning to walk toward the control console, "and says she failed... you have to admit the constraint holds."

  "And if she doesn't come back at all?"

  Elena paused, her hand on the console. She didn't turn around. "Then we're both wrong. And the universe is far stranger than either of us has the math to describe."

  Marcus looked at the empty ring. "I'm betting on the scar, El."

  "I'm betting on the gun," she replied.

  They waited. The silence of the bunker was no longer heavy; it was pregnant. Somewhere, eighty years away and perhaps one universe over, a hammer fell on a firing pin. In this room, nothing happened. And that, for now, was the only data point they had.
