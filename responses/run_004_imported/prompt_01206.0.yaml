answer: |-
  This is a sharp and well-structured argument that cuts to the heart of the ontology of economics. You are effectively reconstructing a version of the critique made by Daniel Hausman, Amartya Sen, and I.M.D. Little, but updating it with Afriat's Theorem to show that even the most rigorous mathematical reconstruction doesn't solve the philosophical problem.

  Here are my comments on your three specific questions, intended to help you tighten the paper for the workshop.

  ### 1. Does the argument hold together, or does it trade on a refused distinction?

  The argument holds together logically, but its success depends on which "economist" you are targeting. Your dinner friend is correct about **positive microeconomics**, but you are correct about **welfare economics**.

  A careful revealed-preference theorist (of the modern micro-theoretic variety) will likely grant your distinction between "thin" and "thick" preference but deny that it matters for their purposes. They will argue: *"We never claimed utility represents welfare. We claimed it represents a mathematical ordering of choice data. If you want to talk about welfare, that's a different department."* If they take this stance, your charge of "equivocation" misses, because they aren't equivocating; they are being precise, and the philosophers are demanding more than the model offers.

  To make your argument stick, you must pin the economist on the move from **Positive** to **Normative** claims. The equivocation occurs precisely when the economist moves from saying "Agent maximizes $U$" (positive description of choice) to "Policy $A$ is better than Policy $B$" (normative welfare claim).
  *   **The Trap:** If "preference" is thin (choice), then "satisfying preferences" just means "allowing consistent choice." It is not obvious why consistent choice is *normatively good*.
  *   **The Fix:** Explicitly frame your paper as an intervention in **Welfare Economics**, not Choice Theory. Argue that while Samuelson saved Choice Theory from introspection, he broke Welfare Economics by severing the link between choice and well-being. The "hangover" isn't philosophical confusion; it's the unresolved normative deficit in modern welfare economics.

  ### 2. Is there a standard instrumentalist rebuttal (Friedman-style) that blocks you?

  Yes, but it is weaker in welfare contexts than in positive contexts.

  **The Rebuttal:** A Friedmanite instrumentalist would argue: *"It does not matter if 'utility' refers to a mental state or a welfare state. What matters is that the model predicts choice behavior accurately. If assuming agents maximize a utility function yields correct predictions about market outcomes, the ontological status of 'utility' is irrelevant."*

  **Why it fails for your purpose:** Instrumentalism works for **prediction**, but it cannot ground **policy**.
  *   If I want to predict how a tax change affects demand, I don't need to know if the agent is "happy." I just need the demand curve.
  *   If I want to argue the tax change is *desirable*, I need a metric of value. If "utility" is just a redescription of choice (thin), then saying a policy "increases utility" just means "makes choices more consistent" or "expands the budget set."
  *   **The Counter-Move:** You should invoke the **Pareto Principle**. Welfare economics relies on the claim that if everyone prefers $A$ to $B$, $A$ is a social improvement. If "prefers" means only "would choose," the Pareto principle loses its normative force. (e.g., Two addicts choosing more heroin satisfies their revealed preferences, but few welfare economists want to say this unequivocally improves welfare without a "thick" assumption about well-being).
  *   **Key Citation:** Daniel Hausman's *The Inexact and Separate Science of Economics* is the standard reference here. He argues that instrumentalism saves the *science* but abandons the *welfare* claims.

  ### 3. Is Sen's sympathy/commitment the strongest illustration?

  This is the trickiest part. For a **philosophy** audience, Sen is perfect. For an **economist** audience, Sen is vulnerable to a specific counter-move.

  **The Vulnerability:** A standard economist response to Sen's commitment is: *"If the agent chooses the committed act, then by definition it reveals a preference for that act. We simply incorporate the 'duty' or 'norm' into the utility function. The agent is still maximizing; the arguments of the utility function are just richer than we thought."* This renders Sen's critique harmless to the formalist.

  **The Alternative: Decision Utility vs. Experienced Utility**
  For an audience of economists (even at a philosophy workshop), the distinction between **Decision Utility** (what is revealed by choice) and **Experienced Utility** (hedonic tone/well-being) is often more forceful.
  *   **Why it's stronger:** It accepts the formalism of RPT (the agent satisfies GARP) but denies that the resulting function tracks *well-being*.
  *   **Example:** Addiction, projection bias, or miswanting (Gilbert & Wilson). An agent can consistently choose cigarettes (satisfying GARP/Afriat) while their "experienced utility" (health/happiness) declines.
  *   **Strategic Advantage:** Unlike Sen's commitment (which economists try to absorb into the utility function), experienced utility is conceptually distinct from choice. Kahneman explicitly argues that RPT measures *wanting*, not *liking*.
  *   **Framing Effects:** You asked about framing/intransitivity. I would advise **against** using intransitive choice as your primary example. If choices are intransitive, GARP fails, and Afriat's theorem doesn't apply. Your argument is stronger when RPT *succeeds* (the axioms hold, the function exists) but *still* fails to capture welfare. Intransitivity lets the economist say, "Ah, irrationality, standard theory doesn't apply." You want to show the problem exists *within* standard theory.

  ### Summary Recommendation

  1.  **Sharpen the Target:** Concede that RPT works for positive prediction (your friend is half-right) but argue it creates a "normative vacuum" for welfare economics. The equivocation is specifically in the move to policy recommendation.
  2.  **Block Instrumentalism:** Argue that instrumentalism cannot bridge the Is-Ought gap required for welfare claims. If utility is thin, Pareto improvements are merely consistency improvements, not welfare improvements.
  3.  **Swap or Supplement Sen:** Keep Sen for the philosophical depth regarding agency, but supplement it with the **Decision vs. Experienced Utility** distinction (Kahneman/Sugden). This prevents the economist from simply saying "we expanded the arguments of the utility function." It forces them to admit that choice consistency $\neq$ well-being.

  This approach respects the mathematical rigor of Afriat/Samuelson while exposing the philosophical cost of that rigor. It should make for a very strong workshop paper.
