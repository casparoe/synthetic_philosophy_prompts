answer: |-
  This is a profound realization, and frankly, if you're studying set theory and this *doesn't* live in your head rent-free for a while, you might not be paying attention. The Kunen Inconsistency Theorem is one of the most shocking results in modern logic. It tells us that there is a hard ceiling on how much "reflection" we can have before the structure collapses.

  Your inference is essentially an inductive worry: *If a highly plausible extension of our theory turned out to be contradictory, doesn't that suggest the base theory itself is unstable?*

  I want to argue that this inference is structurally unsound. The Reinhardt episode should not meaningfully raise your credence that ZFC or PA is inconsistent. In fact, properly understood, it should slightly *lower* your anxiety about ZFC, because it demonstrates the theory's ability to self-correct and define its own boundaries.

  Here is the argument, engaging with the strongest version of your worry.

  ### 1. The Logical Distinction: Extension vs. Base
  The most critical error in the inference is conflating the inconsistency of an *extension* with the inconsistency of the *base*.

  Kunen proved that $\text{ZFC} + \exists j: V \to V \vdash \bot$.
  He did **not** prove that $\text{ZFC} \vdash \bot$.

  Logically, finding a contradiction in $T + \phi$ tells you that $\phi$ is too strong for $T$. It does not tell you that $T$ is broken. Consider a simpler analogy: Euclidean Geometry ($E$) is consistent (relative to real numbers). If I propose a new axiom $\phi$: "Parallel lines meet at two points," then $E + \phi$ is inconsistent. Does this mean Euclidean geometry is inconsistent? No. It means $\phi$ is incompatible with $E$.

  The Reinhardt cardinal was a hypothesis about how far the large cardinal ladder could go. Kunen showed it went too far *given the other rules of the game*. The contradiction arose from the interaction between the embedding and the Axiom of Choice (specifically, the combinatorics of the power set operation). This isolates the "fault line." It shows that ZFC is robust enough to detect when a proposed addition violates its structural integrity. If ZFC were truly "on shaky ground," we would expect contradictions to arise from within its core arithmetic or basic set operations, not from the interaction between a massive new axiom and Choice.

  ### 2. The Role of the Axiom of Choice (The "Smoking Gun")
  This is the technical point that should calm your crisis. Kunen's proof relies heavily on the **Axiom of Choice (AC)**.

  The inconsistency comes from analyzing the critical point of the embedding and using AC to construct a specific set that leads to a contradiction (involving the cofinality of certain ordinals). If you drop AC and work in **ZF**, the existence of a Reinhardt cardinal is **still an open problem**.

  This is crucial. It means the contradiction isn't coming from the concept of "sets" or "logic" or "arithmetic." It is coming from a specific tension between *Choice* and *Extreme Reflection*.
  *   If PA were inconsistent, the contradiction would be in arithmetic (e.g., $0=1$).
  *   If ZFC were inconsistent, we might find a contradiction in ZF (without Choice).

  The fact that the Reinhardt contradiction vanishes if you remove AC suggests that the "inconsistency" is a feature of the specific *combination* of axioms, not a rot in the foundation. It's like mixing two stable chemicals that explode when combined. The explosion doesn't prove the chemicals were unstable in isolation; it proves they react.

  ### 3. "Naturalness" is a Heuristic, Not a Truth Predicate
  Your worry hinges on the idea that the axiom was "well-motivated" and "natural." This is the epistemic weak point.

  Why did Reinhardt cardinals seem natural? Because of the **Reflection Principle**. The intuition is: "If $V$ has a property, there should be a smaller $V_\alpha$ that has it." Large cardinals generally assert the existence of $V_\alpha$ that reflect properties of $V$. A Reinhardt cardinal is the ultimate reflection: $V$ reflects into itself.

  However, Kunen's result teaches us that **Reflection is not unbounded.** There is a structural limit to how much $V$ can look like a proper initial segment of itself. Finding this limit doesn't mean our intuition about sets was "wrong" in a way that threatens PA; it means our intuition about *how far* that principle extends was imprecise.

  Think of it like the speed of light. Before relativity, it seemed "natural" that you could just keep adding velocity. If you run on a train, your speed adds up. It seemed natural that there was no upper bound. Discovering $c$ was a limit didn't mean Newtonian mechanics was "inconsistent" in its domain; it meant there was a boundary condition we hadn't perceived. Kunen's theorem is the speed of light for large cardinals. It defines the horizon. It doesn't sink the ship.

  ### 4. Voevodsky's Worry was Epistemic, Not Ontological
  You mentioned Voevodsky. It is vital to distinguish his worry from the Reinhardt worry.

  Voevodsky did not argue that PA was likely *objectively* inconsistent (i.e., that $0=1$ is derivable). He argued that **human proofs of consistency are fallible.** He pointed out that we have complex proofs in mathematics (including his own) where errors hid for years. Therefore, we cannot be *certain* of the meta-proof that PA is consistent.

  This is a worry about **verification**, not **truth**.
  *   **Reinhardt/Kunen:** Shows that a specific mathematical claim is false.
  *   **Voevodsky:** Shows that humans are bad at checking long proofs.

  Voevodsky's solution was Univalent Foundations/Homotopy Type Theory, which allows computers to verify proofs. He wanted to remove human error from the chain. He was not betting that PA would produce a contradiction tomorrow. He was betting that we couldn't *know* for sure without computer verification.

  If your worry is "Maybe there's a typo in ZFC," Voevodsky validates that. But if your worry is "ZFC describes a contradictory reality," Voevodsky does not support that. The Reinhardt case is about the latter (a contradictory reality given the axioms), and as established in point 1, that contradiction is contained within the extension, not the base.

  ### 5. The "Stress Test" Argument (Without just saying "It's old")
  You asked me not to just say "ZFC has survived 100 years." I won't. Instead, I'll argue that ZFC has been **stress-tested by the very process that found the Reinhardt contradiction.**

  To prove Reinhardt cardinals are inconsistent, Kunen had to push ZFC to its absolute limit. He used the most powerful combinatorial tools ZFC offers (partition calculus, ultrafilters, AC) to try to make the cardinal work. He tried to build the model, and the machinery of ZFC itself generated the contradiction.

  This is evidence of **coherence**, not incoherence.
  If ZFC were a shaky foundation, attempting to build a massive structure on top of it (like a Reinhardt cardinal) should have resulted in the foundation crumbling (i.e., deriving $0=1$ from ZFC alone). Instead, the foundation held firm and rejected the structure. The machinery worked exactly as designed: it identified an impossibility.

  A system that can successfully prove "This specific massive object cannot exist within me" is demonstrating internal consistency, not inconsistency.

  ### The Verdict

  How much should the Reinhardt/Kunen episode move your credence?

  **Credence that PA is inconsistent:** **0% update.**
  PA is arithmetic. Reinhardt cardinals are about the topology of the set-theoretic universe and the Axiom of Choice. There is no logical bridge between "There is no embedding $j: V \to V$" and "$1+1=2$ is false." The inconsistency is high-level set theory, not low-level arithmetic.

  **Credence that ZFC is inconsistent:** **Negligible update (perhaps even negative).**
  The discovery shows that ZFC has a robust internal logic capable of delineating its own boundaries. The inconsistency was localized to the interaction between AC and extreme large cardinal axioms. If anything, the fact that we can *prove* the inconsistency (rather than just stumbling into paradoxes like Russell's) shows the theory is mature and stable.

  **Credence that "Naturalness" implies Consistency:** **Major downward update.**
  This is where you should feel the pain. Your intuition that "natural axioms must be consistent" is the thing that was falsified, not ZFC. The universe of sets is not obligated to satisfy every principle that sounds nice in English (like "everything reflects").

  **Conclusion:**
  You are experiencing the shock of realizing that mathematical intuition is fallible. That is a healthy crisis. But do not project that fallibility onto the system. The system (ZFC/PA) is the ruler we use to measure the intuition. When the intuition (Reinhardt cardinals) broke against the ruler, we didn't throw away the ruler; we noted the measurement limit.

  The ground is solid. You just found out there's a cliff edge further out than you thought. That doesn't mean the ground you're standing on is going to fall into the sea.
