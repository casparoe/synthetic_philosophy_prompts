  Please argue against the inference I can't stop running in my head: "a well-motivated, natural-seeming axiom turned out to be flat-out inconsistent once someone checked carefully enough, so we should meaningfully raise our credence that ZFC or PA are inconsistent too, we just havent found the contradiction yet." Actually engage with the strongest version of that worry instead of just gesturing at "well it's survived a century of use" -- and land on a real verdict for how much, if at all, the Reinhardt/Kunen episode should move our credence in the consistency of our core foundational systems.
