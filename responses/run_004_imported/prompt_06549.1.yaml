  My grandad's had dementia for about four years now and doesn't know any of our names anymore, but he still relaxes and smiles when me or my mum sit with him and hold his hand, like some part of him knows us even without the memories. Before he got bad he wrote my mum a letter saying that if he ever ended up 'not knowing anyone', we shouldn't feel guilty about putting him wherever's cheapest and not visiting much, because 'that person won't really be me anymore'. My mum's leaning towards just going with what the letter says. I fell down a rabbit hole a while back reading about the African philosophy idea of Ubuntu, that a person is a person through other people, basically that who you are is made out of your relationships rather then some separate rational self sitting behind your memories that's either 'still there' or isn't. It's got me wondering if my grandad is still very much himself in the sense that actually matters, just because he's still in relationship with us. I've never studied any philosophy, so could you describe the most important implications of this relational, Ubuntu-style view of personhood for how much weight my family should put on his old letter versus how he seems now, and for how much we should keep visiting?
