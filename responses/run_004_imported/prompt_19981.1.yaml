  Been going down a Thomas Hobbes rabbit hole lately and read that he barely even looked at geometry until he was like 40, when he stumbled on Euclid's Elements, saw one of the proofs, said something like "that's impossible," then traced it backwards proof by proof until he was convinced — and after that he basically decided political philosophy should work the exact same way. So from what I can tell, that's why Leviathan is laid out like a geometry proof: you start from a couple of self evident axioms about human nature and then deduce step by step, same as proving the Pythagorean theorem, that people have to hand over their power to one absolute sovereign. Doesn't that mean his whole case for absolute sovereignty is basically as objective and certain as a math theorem, and not just his personal opinion about politics? Feels like people should treat Leviathan with a lot more certainty then they do if thats really how it works.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Claim:** The user believes Thomas Hobbes modeled *Leviathan* on Euclidean geometry (axioms $\rightarrow$ deductions $\rightarrow$ conclusion) after discovering Euclid late in life.
      *   **Inference:** Because it's structured like a geometric proof, the conclusion (absolute sovereignty) should be as objective and certain as a math theorem.
      *   **Question/Implication:** Why don't people treat *Leviathan* with more certainty if it's essentially a political geometry proof?
      *   **Underlying Assumption:** The structure of an argument guarantees the truth of its premises and the validity of its application to the real world.

  2.  **Fact-Check the Historical Narrative:**
      *   *Did Hobbes discover Euclid late?* Yes, around age 40 (1628-1629). The anecdote about him saying "By God, this is impossible" regarding the Pythagorean theorem is famous (from Aubrey's *Brief Lives*).
      *   *Did he try to apply the resolutive-compositive method (geometry/science) to politics?* Yes, absolutely. He wanted political philosophy to be a "science" of consequences.
      *   *Is Leviathan structured like a geometry proof?* Loosely, yes. Part I (Of Man) sets out the "matter" and "motion" (psychology), Part II (Of Commonwealth) builds the structure. It uses definitions and deductions.

  3.  **Evaluate the Logical Leap (Structure $\neq$ Truth):**
      *   *The User's Error:* Confusing *validity* (logical structure) with *soundness* (true premises).
      *   *Geometry:* Axioms are self-evident within the system (e.g., "a straight line can be drawn between two points"). They are abstract and definitional.
      *   *Political Philosophy:* "Axioms" are claims about human nature (e.g., "humans are purely self-interested," "the state of nature is a war of all against all"). These are empirical/psychological claims, not logical tautologies. They can be disputed.
      *   *Deduction:* Even if the logic holds, if the starting premises are wrong or oversimplified, the conclusion isn't "certain."

  4.  **Identify Criticisms of Hobbes' "Axioms":**
      *   *Human Nature:* Is man really that selfish? (Critics: Shaftesbury, Rousseau, Kropotkin). What about altruism, family bonds, cooperation?
      *   *State of Nature:* Is it historically accurate? (Anthropologists say no). Is it a logical necessity or a thought experiment?
      *   *The Sovereign:* Does an absolute sovereign actually guarantee safety? (What if the sovereign is mad? What if they cause the war?).
      *   *Is-Ought Problem:* Even if people *are* violent (is), does it logically follow they *ought* to submit to an absolute ruler (ought)? (Hume's Guillotine).

  5.  **Address the "Certainty" of Math vs. Politics:**
      *   Math deals with abstract concepts we define. Politics deals with messy, unpredictable humans.
      *   Hobbes himself acknowledged the difficulty. He called it "Civil Science," but later critics (like Oakeshott) note the rhetorical nature of *Leviathan*.
      *   The "scientific" method Hobbes used (resolutive-compositive) was influential but ultimately limited when applied to social phenomena.

  6.  **Synthesize the Argument:**
