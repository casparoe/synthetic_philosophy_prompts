answer: |-
  You have hit on one of the most fascinating aspects of Hobbes's intellectual biography. You are absolutely right about the history: Hobbes did discover Euclid late in life (around age 40), and it fundamentally rewired his brain. He became obsessed with the idea that if geometry could produce undeniable truth through deduction, then moral and political philosophy should be able to do the same.

  He explicitly tried to turn politics into a "civil science." He wanted *Leviathan* to be a machine of logic where, if you accepted the definitions, the conclusion (absolute sovereignty) would be as unavoidable as $a^2 + b^2 = c^2$.

  However, the reason people don't treat *Leviathan* with the same certainty as a math theorem comes down to a crucial distinction in logic: **Validity vs. Soundness.**

  Here is why Hobbes's "political geometry" doesn't yield mathematical certainty.

  ### 1. The Axioms Are Not Self-Evident
  In Euclidean geometry, the axioms are definitional and abstract. "A straight line can be drawn between any two points." You don't argue with that; it's true by the definition of the system.

  In *Leviathan*, Hobbes starts with "axioms" about human psychology and the state of nature. For example:
  *   Humans are fundamentally driven by a desire for power and a fear of death.
  *   In the absence of authority, humans will inevitably come into conflict (the "War of All Against All").
  *   Reason is merely a calculator for self-interest.

  These aren't logical tautologies; they are **empirical claims** about how humans work. And unlike the definition of a triangle, these claims are highly debatable.
  *   **Critique:** Are humans *really* that selfish? What about altruism, family bonding, or spontaneous cooperation? (Later philosophers like Rousseau or Kropotkin argued Hobbes got human nature wrong).
  *   **Critique:** Is the "State of Nature" a historical reality or just a scary story? (Anthropologists generally agree that pre-state societies weren't in a constant war of all against all).

  If your starting axioms are contestable, your conclusion is contestable, no matter how perfect your logic is. In computer science terms: **Garbage In, Garbage Out.**

  ### 2. The "Is-Ought" Problem
  Geometry deals with what *is* (within its abstract system). Politics deals with what *ought* to be.

  Hobbes tries to bridge this gap by arguing that because we *are* fearful and violent (Is), we *ought* to submit to a sovereign to ensure survival (Ought). But logically, you cannot derive a moral obligation purely from a factual description of nature without adding a moral premise (e.g., "Survival is the highest good").

  If someone says, "I would rather die free than live safe under a tyrant," Hobbes's geometric proof breaks. His system assumes everyone values self-preservation above liberty. That is a value judgment, not a geometric truth.

  ### 3. Humans Are Not Triangles
  Geometry works on static, defined objects. A triangle never changes its mind. A circle never gets angry.

  Hobbes's "matter" is human beings. Humans are irrational, emotional, unpredictable, and capable of changing their definitions. Hobbes tried to treat human passion like physics (matter in motion), but human behavior doesn't follow fixed laws in the same way gravity does. Because the "variables" in Hobbes's equation are unstable, the "proof" can never be mathematically certain.

  ### 4. Even Hobbes Couldn't Make the Math Work
  Ironically, while Hobbes succeeded in making political philosophy more rigorous, he failed at his own goal of making it "scientific."
  *   He spent the last decades of his life trying to solve the mathematical problem of "squaring the circle" (which is impossible). He published flawed proofs and got into bitter feasts with actual mathematicians who proved him wrong.
  *   This highlights the limit of his confidence: He believed his logic was infallible, but he was often wrong about the premises.

  ### 5. Why We Still Respect *Leviathan*
  People don't treat *Leviathan* as "uncertain" because it's sloppy; they treat it as uncertain because **it is a normative argument disguised as a descriptive proof.**

  We still treat *Leviathan* with immense respect, not because it is "true" like $2+2=4$, but because it is **coherent**. Hobbes showed that *if* you accept his premises, *then* liberalism or democracy becomes dangerous. He laid out the logic of authoritarianism more clearly than anyone before or since.

  ### Summary
  You are right that Hobbes *intended* it to be a geometric proof. But a proof is only as certain as its premises.
  *   **Euclid:** Premises are definitions. (Certain) $\rightarrow$ Conclusion is Certain.
  *   **Hobbes:** Premises are theories about human nature. (Debatable) $\rightarrow$ Conclusion is Debatable.

  So, while *Leviathan* is a masterpiece of logical deduction, it isn't a math theorem. It's a persuasive argument built on a specific, pessimistic view of humanity. If you change the view of humanity (as Locke or Rousseau did), the "proof" collapses, and you get democracy instead of absolutism. That is why political philosophy remains a debate, not a calculation.
