      *   *Taurek's specific mechanism:* Taurek suggests a lottery among *individuals*. If 1 vs 5, give each person 50% chance? No, that's impossible. He suggests tossing a coin to decide *which group*. This gives the 1 person 50% chance, and the 5 people 50% chance (shared). This means the 1 person is morally equal to the *entire group*. This is the radical claim I need to defend.
