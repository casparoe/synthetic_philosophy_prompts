      *   **Clinical Application:** How does this look in the ICU? It's not necessarily chaos. It's about acknowledging the moral remainder. It's about not sleeping easy just because "the math worked out."

  5.  **Refining the Tone:**
      *   Needs to be respectful of the nurse's experience.
