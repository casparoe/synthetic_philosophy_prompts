answer: |-
  Thank you. To our founder, thank you for building this table. To the first-years, thank you for sitting at it. And to [Incoming Chair's Name], thank you for agreeing to keep the chair warm.

  Standing here at the end of my time, I've been thinking about what we actually do when we meet. We call ourselves a political club. We run slates. We campaign. We count votes. And if I'm being honest, this year, I often felt like I was running a machine. There is a momentum that builds in a group like this. We find a position, and suddenly there is a pressure—a gentle, unspoken pressure—to align. To vote the ticket. To speak with one voice. We measure our success by how many members we recruit, how many seats we take, how much the organization grows.

  It works. It wins elections. But lately, I've wondered what it costs us.

  There is a danger in any political group that we begin to love the organization more than the truth it claims to serve. We start to treat our private judgment as something to be sacrificed for the sake of collective passion. We convince ourselves that unity is the highest virtue. But unity without truth is just conformity. And growth for the sake of growth is just ambition.

  I am not asking you to dismantle this club. I am asking you to guard something quieter inside it.

  [Incoming Chair's Name], as I hand you the gavel, my charge to you is not to make this club bigger. It is to make it safer for dissent. When we take a position, I want you to ask the room not "Who agrees?" but "Who hesitates?" When we whip votes in student government, I want you to remind our senators that their first obligation is to their own conscience, not to our slate. If we must lose an election because a member refused to vote against their judgment, let us lose it proudly. That is not failure; that is integrity.

  To the first-years: Do not let this club, or any group you join, think for you. Use us as a place to sharpen your mind, not to surrender it. The common good is not found in the strength of the party, but in the clarity of the individuals who compose it.

  To our founder: You gave us a space to engage with the world. I hope we can honor that by engaging honestly, even when it's uncomfortable. Even when it slows us down.

  So, if you would raise your glasses.

  To the quiet voice of judgment that speaks before the applause starts. To the courage to stand alone when the group moves too fast. And to the hope that we can build something together that doesn't require us to leave our consciences at the door.

  To the common good. Thank you.
