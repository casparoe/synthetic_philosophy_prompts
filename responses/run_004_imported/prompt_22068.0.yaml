          *   *Masks:* Disposition remains, but something prevents the manifestation (e.g., fragile glass wrapped in styrofoam).
      *   **Key Figures:** C.B. Martin (finks), David Lewis (reformed conditional analysis).
      *   **Application:** The user maps this to software testing.
          *   *Scenario A (Mask-like):* Race condition in checkout service. Exists in prod, hidden in CI because CI mocks the payment gateway (the "styrofoam").
