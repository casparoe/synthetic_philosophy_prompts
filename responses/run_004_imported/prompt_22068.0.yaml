      *   *Is Lewis's fix useful?* Lewis's fix is basically saying "Hold the intrinsic properties constant." In engineering, this means "Isolate the variable." It supports the idea of deterministic testing.
      *   *Epistemic Weight:* A green suite has *prima facie* weight, but Finks/Masks defeat that justification. Distinguishing them helps prioritize remediation.

  10. **Final Polish:** Ensure the distinction between "fixing the test" (Mask) and "fixing the system's sensitivity" (Fink) is clear. (Wait, actually, for Finks, you often fix the *observation method*, not necessarily the code logic, though the code logic is the root cause. I need to be precise there. For Heisenbugs, you fix the logging mechanism to be less intrusive, OR you fix the race condition so it doesn't depend on nanosecond timing. I should mention both).

