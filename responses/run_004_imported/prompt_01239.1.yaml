answer: |-
  This is a fantastic dispute to be having, and honestly, it cuts right to the heart of what makes Hobbes such a fascinating and frustrating figure. You and your friend are both tapping into valid philosophical intuitions, but you're talking past each other slightly because you're operating on different levels of analysis.

  Here is the breakdown: You are technically right about the logic, but your friend is arguably right about the *philosophical implications*.

  Here is a better way to frame the debate that moves beyond "ad hominem vs. valid critique."

  ### 1. Where You Are Right (The Logical Distinction)
  You are correct that, formally, Hobbes's inability to square the circle does not logically invalidate his epistemological claim that "geometry yields certainty because we construct the objects."

  This is the distinction between the **context of justification** and the **context of discovery/practice**.
  *   **The Theory:** "If one correctly constructs a geometric object from definitions, the knowledge is certain."
  *   **The Practice:** "Hobbes failed to construct the object correctly."

  A bad carpenter does not disprove the laws of physics, and a bad logician does not disprove the laws of inference. It is entirely possible to have a correct theory of mathematical knowledge while being personally incompetent at mathematics. If Hobbes's epistemology stands or falls solely on his personal IQ or calculation skills, then yes, your friend is committing a genetic fallacy (a cousin of *ad hominem*).

  ### 2. Where Your Friend Is Right (The Performative Contradiction)
  However, your friend (the math PhD) is sensing something deeper than just "Hobbes is bad at math." She is identifying a **performative contradiction** regarding Hobbes's specific brand of epistemology.

  Hobbes isn't just saying "Math is certain." He is making a specific claim about *why* it is certain: **Maker's Knowledge** (*verum factum*). He argues we have certainty in geometry (and civil philosophy) because we *make* the definitions and the figures. We stipulate the causes. Therefore, error should be impossible if we follow the method.

  Here is why Hobbes's failure matters epistemologically:
  *   **The Method Failed to Protect Him:** If the geometric method is the gold standard for eliminating error and dispute, why did it fail to eliminate error for its biggest proponent? Hobbes's epistemology promises that if you use the geometric method, you achieve consensus and certainty. The 25-year feud proves the opposite: Hobbes used his "geometric method," and it produced dogmatism and endless dispute.
  *   **Subjective Conviction vs. Objective Certainty:** Hobbes's refusal to accept Wallis's refutations suggests that for Hobbes, "certainty" was a *feeling* of clarity rather than an *intersubjective* demonstrability. If his epistemology cannot distinguish between "I feel certain I squared the circle" and "I actually squared the circle," then his criterion for certainty is flawed.
  *   **The Political Stakes:** This is where Wallis was strategic. Hobbes wants a political philosophy that ends civil war by establishing indisputable sovereign authority based on rational deduction. If his "indisputable" geometric deductions are actually full of errors that he stubbornly refuses to correct, it suggests his political deductions might be equally dogmatic and error-prone. It undermines the *authority* of the method.

  ### 3. The "Better Way" to Think About It
  To resolve your stalemate, shift the question from **"Does Hobbes's incompetence disprove his theory?"** to **"Does Hobbes's incompetence reveal a flaw in the *application* of his theory that the theory itself cannot account for?"**

  Here are three specific angles you can use to upgrade the argument:

  **A. The Definition of "Construction"**
  Hobbes thought geometry was about drawing figures and reasoning about spatial magnitudes. Wallis (and the emerging calculus tradition) viewed geometry more algebraically/analytically.
  *   **The Critique:** Hobbes's epistemology relies on a specific definition of "construction" (visual/spatial). His failure suggests that this specific definition is insufficient for generating truth. He was trying to solve problems that required limits/infinity using finite straight-edge constructions.
  *   **The Verdict:** Your friend wins here. His epistemological commitment to *spatial* construction blinded him to *algebraic* truth. His theory of knowledge restricted his ability to acquire knowledge.

  **B. The Role of Peer Review in "Certainty"**
  Hobbes treats geometry as a solitary activity of the mind grasping necessary truths. Wallis treated it as a communal practice of proof and refutation.
  *   **The Critique:** Hobbes's epistemology lacks a mechanism for error correction. If certainty comes from "seeing" the construction in your mind, how do you know when you've hallucinated the construction? Wallis showed that certainty requires public verification.
  *   **The Verdict:** This is the strongest philosophical point. Hobbes's failures show that "Maker's Knowledge" without "Public Verification" leads to delusion, not certainty.

  **C. The *Leviathan* Parallel**
  In *Leviathan*, Hobbes argues that in the state of nature, everyone thinks they are right, which leads to war. In science/geometry, he thinks we escape this because the definitions are fixed.
  *   **The Critique:** The Hobbes-Wallis feud *is* a state of nature in the scientific community. Hobbes became the very thing his philosophy was supposed to cure: a dogmatic individual insisting his private judgment overrides public reason.
  *   **The Verdict:** His mathematical behavior contradicts his political epistemology. He failed to submit his private judgment to the "sovereign" of mathematical proof.

  ### Summary for Your Seminar
  You can tell your friend: "You're right that it's not a formal logical disproof, but it is a **pragmatic refutation**."

  Hobbes claims geometry is the realm of **Science** (*Scientia* = certain knowledge of consequences) as opposed to **Prudence** (guessing based on experience). By refusing to accept refutation for 25 years, Hobbes demonstrated that he could not distinguish between his own *Prudence* (guessing he was right) and *Science* (actually being right).

  If the paradigm case of his epistemology (geometry) collapses into dogmatic opinion when practiced by its greatest champion, then the epistemology fails to do the work Hobbes needs it to do (which is to provide a foundation for indisputable political authority).

  **The takeaway:** It's not that Hobbes was bad at math, so his philosophy is wrong. It's that his philosophy of math lacked the resources to explain *why* he was bad at math, and therefore lacked the resources to prevent others from being equally dogmatic about wrong political ideas. Wallis didn't just prove Hobbes couldn't do math; he proved Hobbes didn't understand what "knowing" was.
