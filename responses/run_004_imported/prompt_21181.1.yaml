answer: |-
  The air in the studio was thick with the scent of wet earth and the fine, hanging dust of dried clay. On a central pedestal stood *Goliath*, a formidable figure of a warrior, arms raised in a silent shout. An apprentice, Leo, stood beside it, holding a wooden mallet. He looked hesitantly at the two philosophers leaning against a workbench.

  "Go on, Leo," said Marcus, gesturing to the statue. "Do it. But remember, you're not destroying everything."

  Elena, standing opposite him, crossed her arms. "He's destroying *Goliath*. He's not destroying *Lumpl*. And since they are currently two distinct objects occupying the same space, Leo is about to commit an act of selective annihilation."

  Marcus smiled thinly. "There is only one object on that pedestal, Elena. Goliath. There is no second ghost-object named Lumpl hiding inside the clay, waiting to be liberated by the mallet."

  "If there isn't," Elena said, pushing off the bench and walking toward the pedestal, "then explain to me what happens in five seconds. Leo strikes. Goliath loses his shape. Goliath ceases to exist. But the clay remains. We can take that clay, roll it into a ball, and it will still be here tomorrow. If Lumpl wasn't there before the strike, where does this surviving entity come from? Does it pop into existence *ex nihilo* the moment the shape is lost?"

  Marcus stepped up beside her. "It doesn't pop into existence. The *matter* persists. The atoms persist. What changes is which sortal concept applies to the matter. Right now, the matter constitutes a statue. The object *is* the statue. When you smash it, the statue ceases. The matter remains, and we can then truly say 'there is a lump of clay.' But we don't need to posit a second, numerically distinct object *now* to account for the clay's persistence later."

  "That's the magic I'm talking about," Elena said, tapping the base of the pedestal. "On my view, the persistence of the clay is explained by the persistence of Lumpl, who is here *now*, coincident with Goliath. On your view, the 'lump' object doesn't exist now. It begins to exist only when the statue dies. That's creation. You're saying a new object comes into being simply by the destruction of the old one's form, even though the matter is identical."

  "I'm not saying a new object comes from nothing," Marcus countered. "I'm saying the identity conditions for the object on the pedestal are fixed by its dominant kind. Goliath is essentially a statue. He is not essentially a lump. So, when the statue properties are lost, Goliath is gone. The fact that we can refer to the remnants as 'a lump' doesn't require that 'Lumpl' was a distinct object sitting there a moment ago. It just means the matter is now available to be constituted under a different sortal."

  Elena shook her head. "This brings us straight to Karen Bennett's grounding problem, Marcus. Let's say I'm right. There are two objects. They share all their proper parts. They share their location, their mass, their shape, their microphysical structure. Every categorical, non-modal property is identical. Yet, I say Goliath has the modal property *would be destroyed by pounding*, and Lumpl has the modal property *would survive pounding*. You say there's only Goliath, so you avoid that specific clash. But you still have to explain why *this* object—Goliath—has the modal properties of a statue and not a lump."

  "Because it *is* a statue," Marcus said.

  "But *why*?" Elena pressed. "If you look at the world, really look at the physics of the situation, there is nothing in the clay's arrangement right now that screams 'statue' rather than 'lump' in a way that dictates modal resilience. If modal properties have to supervene on categorical properties, and the categorical properties are shared, then the modal properties should be shared. If you deny coincidence, you still have to explain what grounds the fact that this object is a statue-thing rather than a lump-thing. Is it just a brute fact?"

  "It's not brute," Marcus said, his voice tightening slightly as Leo raised the mallet higher. "It's grounded in the history and the intention that brought the object into being. This clay was arranged by a sculptor with the intention of creating a statue. That historical fact makes it a statue. A mere lump doesn't have that history of artistic formation. So there *is* a categorical difference: the historical property of having been created as a statue."

  Elena pounced. "Ah, but Lumpl *also* has that history! The lump came into existence when the clay was gathered and shaped. If the lump is the clay, and the clay was shaped by the sculptor, then Lumpl has the same historical properties as Goliath. If the ground for being a statue is 'being shaped by a sculptor,' then Lumpl qualifies too. You haven't found a categorical difference that separates them; you've just described the same history twice."

  Marcus paused. The apprentice was waiting, the mallet poised. "Okay. Suppose I grant that the history is shared. The Dominant Kinds view says an object cannot fall under two sortals with conflicting persistence conditions. 'Statue' and 'Lump' conflict. A statue cannot survive radical reshaping; a lump can. So, which one wins? The more specific one. 'Statue' dominates 'Lump' because every statue is a lump-of-clay-shaped-statue, but not every lump is a statue. The specific form dictates the identity."

  "And that," Elena said, pointing a finger at him, "is exactly the stipulation I'm worried about. You say 'Statue dominates Lump' as if it's a law of metaphysics. But it looks like you've just written a rule to avoid the conclusion you don't like. Why does the artistic form dominate the material constitution? If I melt a bronze statue, the bronze survives. If I smash a clay one, the clay survives. Why is the object *the statue* and not *the clay*? It seems you're privileging the human intention over the material reality without a metaphysical justification. You're solving the grounding problem by fiat."

  Leo brought the mallet down.

  *CRACK.*

  The sound was dull and wet. *Goliath* collapsed into a formless mound. Dust plumed into the light.

  Elena gestured to the ruin. "Goliath is gone. But look. The clay is right there. If Lumpl wasn't here a moment ago, you have to say the object *on the pedestal* ceased to exist, and a new object—the lump—has effectively taken its place, or that the old object has magically changed its essence. If it's a new object, you have replacement. If it's the same object, you have change of essence. Both are costly."

  Marcus stepped forward, picking up a chunk of the broken clay. "It's not replacement. It's the persistence of the matter under a change of description. Look, Elena, your view has a cost too. You say there are two objects here now. But if there are two, why don't they weigh twice as much? Why doesn't the pedestal groan under the burden of double the mass?"

  "Because they share the mass," Elena said automatically. "Constitution is not addition."

  "Exactly," Marcus said. "They share the mass. They share the parts. They share the location. You say they are distinct, but they are indistinguishable in every physical respect. You posit a 'metaphysical difference' that makes no physical difference. My view is parsimonious. One object. One history. When the form is lost, the object falls under a less restrictive sortal. We don't need to multiply entities beyond necessity."

  "But you haven't answered the grounding," Elena insisted, brushing clay dust from her coat. "You say 'Statue dominates Lump.' But if I ask, 'What is it about *this* portion of reality right now that makes it true that it is a statue-thing and not a lump-thing?' you point to the form. But the form is shared by the lump! The lump *has* that form right now. You're saying the lump *has* the form of a statue but *is not* a statue-object. That sounds like you're saying properties can exist without being instantiated by the object that has them. It's a distinction without a difference."

  Marcus looked down at the mound. "I'm saying that 'being a lump' is a phase this object goes through, but 'being a statue' is what it *is*. Think of it like a caterpillar and a butterfly. You don't say there are two insects in the chrysalis. You say there is one organism that changes form."

  "But caterpillars and butterflies are temporal parts," Elena countered. "I'm talking about numerical identity at a single time. Right now, before the smash, is there one thing or two? If you say one, you have to explain why that one thing has the modal property of *perishing* under conditions where its matter survives. You have to ground that fragility. If the matter is robust, and the object is identical to the matter (as you often imply with the dominance view), why is the object fragile? You've just pushed the grounding problem back one step. Why does the 'dominant kind' impose fragility on the matter?"

  Marcus sighed, wiping his hands on a rag. "Because kinds have essences. The essence of a statue involves maintaining a certain form. The essence of a lump does not. That's not a stipulation; it's what we mean by the words. If you deny that, you deny that sortals have any metaphysical weight."

  "And if you deny coincidence," Elena said, "you deny that the same matter can constitute different objects with different lives. You're forcing the world to fit a linguistic rule about 'dominance' rather than admitting the metaphysical complexity of constitution."

  Leo, the apprentice, looked between them, holding a piece of Goliath's head in one hand and a handful of raw clay in the other. "So," he asked quietly, "do I put this in the bin, or back on the wheel?"

  Marcus looked at Elena. "If you're right, he's holding Lumpl's head. If I'm right, he's holding Goliath's remains."

  "If I'm right," Elena corrected, "he's holding a part of Lumpl, who has survived, and a part of Goliath, who has not. Two objects, one fate for each."

  "If you're right," Marcus said, "you've doubled the ontology for no explanatory gain. The clay is on the wheel. The statue is in the past. We don't need ghosts."

  "And we don't need magic dominance rules," Elena replied.

  They stood in silence for a moment, the dust settling around the pedestal. The clay sat in a shapeless pile, waiting to be whatever the next hand made of it.

  "Wheel," Marcus said finally. "Let's see what comes next."

  "Wheel," Elena agreed. "But don't pretend the clay wasn't already there."

  Marcus smiled, but didn't answer. He turned to watch the apprentice begin to spin.
