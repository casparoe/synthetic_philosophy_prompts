          *   Address the "Does Supervaluationism avoid cutoffs?" question. Technically, it avoids a cutoff *in the world*, but it creates a cutoff between "admissible" and "inadmissible" precisifications. (Don't get too bogged down here, but mention it).
      *   **The Legal/Practical Pivot (The "So What?"):**
          *   This is the most important part. The user is using philosophy to fight a landlord.
          *   *Law vs. Philosophy:* The law doesn't care about metaphysical truth conditions. It cares about *burden of proof* and *reasonableness*.
          *   *Epistemicism in Court:* "There is a line, landlord, but you haven't proven I crossed it." (Burden of Proof).
          *   *Supervaluationism in Court:* "The term is ambiguous, and ambiguity is construed against the drafter (contra proferentem)."
