answer: |-
  This is a fantastic read of the paper. You are absolutely right that the ESP section is almost always redacted in anthologies, and you're also right that Turing's treatment of it was not a dismissive footnote but a substantive engagement with the data available to him at the time. He treats ESP as a confounding variable in an experimental design, which is a very engineer-like way to handle a metaphysical problem.

  To answer your core question: **Would Turing have recanted?**

  My assessment is that Turing would have discarded the "overwhelming" claim immediately upon seeing Markwick's analysis, and he would have viewed the Bem saga through the lens of sequential analysis errors. He likely would have retained a non-zero *prior* (he was rarely dogmatic about physical impossibility), but the *posterior* probability of psi being a functional reality would have dropped below the threshold required to justify the "telepathy-proof room" in the Imitation Game.

  Here is the breakdown of how his specific epistemic machinery—Banburismus, decibans, and functionalism—would have processed the post-1954 data.

  ### 1. The Soal-Shackleton Collapse (Markwick, 1978)
  Turing's 1950 assertion that the evidence was "overwhelming" was contingent on the integrity of the Soal data. In 1950, J.G. Soal was a respected mathematician and the "gold standard" of parapsychology. For Turing, this wasn't fringe mysticism; it was statistical signal detection.

  However, Turing's work at Bletchley Park was predicated on the assumption that signals could be mimicked by noise or deception (German naval protocols were designed to obscure). If Markwick showed the score sheets were doctored, Turing wouldn't view this as a "failed replication"; he would view it as **data contamination**.

  In a Bayesian framework, if your likelihood ratio $P(E|H) / P(E|\neg H)$ relies on data $E$ that is proven to be fabricated, the likelihood ratio for that specific evidence set collapses to 1 (no information). Since Soal was the primary pillar of the "overwhelming" claim, removing it removes the weight. Turing was pragmatic: if the data is poisoned, you throw it out. He wouldn't necessarily conclude "Psi is impossible," but he would conclude "The evidence for Psi is currently null."

  ### 2. The Bem Saga and Sequential Analysis
  This is where Turing's specific expertise becomes most relevant. You mentioned Bem's 2011 "Feeling the Future" and the subsequent Bayesian reanalysis by Wagenmakers.

  Turing was a master of **sequential probability ratio testing (SPRT)**. During the war, he and Good developed the concept of the "deciban" to weigh evidence as it arrived, allowing them to stop testing once a threshold was reached. This makes him uniquely sensitive to **optional stopping** and **data peeking**, which were the primary methodological critiques leveled at Bem.

  Bem's experiments often involved flexibility in when to stop collecting data or how to analyze subsets of the data. To a statistician trained in sequential analysis, this looks like inflating the Type I error rate. Turing would have looked at Bem's design and immediately flagged that the "evidence" was being generated by the stopping rule, not the phenomenon.

  If you look at Wagenmakers' Bayesian reanalysis, the Bayes Factors for Bem's data were often weak (around 3:1 or lower in favor of the null in many replications). Turing knew that weak likelihood ratios cannot overcome low priors.

  ### 3. Running the Decibans
  Let's try to run the bookkeeping as Turing might have.

  *   **The Prior:** Turing was a physicalist. While he entertained morphogenesis and chemical computation, a mechanism for information transfer bypassing known physical channels requires a massive update to our model of the universe. Let's be generous and say Turing assigns a prior odds of 1:1,000,000 to psi being real and replicable. That is **-60 decibans** (since 1 ban = 10:1, 6 bans = 1,000,000:1).
  *   **The Evidence (Bem):** Bem claimed significant p-values. However, accounting for the replication crisis and the Bayesian reanalysis, let's assume the strongest credible Bayes Factor from the meta-analysis is roughly 3:1 in favor of psi (which is generous given the failed replications). That is roughly **+5 decibans**.
  *   **The Correction (Fraud/Methodology):** Once you factor in the Markwick fraud (which destroys the historical baseline) and the methodological flexibility in Bem (which reduces the weight of the new evidence), a rigorous sequential tester would likely apply a penalty. If we treat the methodological flexibility as reducing the effective sample size or likelihood, we might subtract another 10 decibans.

  **The Calculation:**
  $$ -60 \text{ (Prior)} + 5 \text{ (Bem)} - 10 \text{ (Methodological Penalty)} = -65 \text{ decibans} $$

  The posterior odds remain roughly 1:3,000,000.

  For Turing to justify the "telepathy-proof room," the probability of the human contestant using telepathy would need to be high enough to confound the test. If the odds are 1 in 3 million, the engineering cost of building a telepathy-proof room (lead-lined, randomized, etc.) outweighs the risk of the confound. He would drop the requirement.

  ### 4. "Parapsychology as the Control Group"
  You mentioned the Yudkowsky/LW framing that parapsychology is the "control group for science." This fits Turing's mindset perfectly.

  Turing viewed the Imitation Game as a control for *anthropomorphism*. We think machines can't think because they aren't biological. He wanted to control for that bias.

  If he viewed parapsychology as the control for *methodological rigor*, the failure of psi to survive strict sequential testing would reinforce his belief in the scientific method, not necessarily prove a negative metaphysics. He would likely conclude: *"When we apply strict sequential controls and prevent data manipulation, the signal disappears. Therefore, for the purposes of the Imitation Game, we can assume the channel is closed."*

  ### 5. Would he Recant?
  He would recant the **strength of the evidence**, but perhaps not the **possibility of the phenomenon**.

  There is a version of Turing that remains a "psi-skeptic but not a psi-denier." He was the guy who proposed chemical morphogenesis when everyone else was looking for vital forces or pure genetics. He liked unconventional mechanisms. He might argue that the *Soal* data was fraud, and *Bem* was p-hacking, but that the *theoretical space* for non-local information transfer wasn't strictly closed by physics (especially post-quantum entanglement, though he died before Bell's inequalities).

  However, practically? **He would cut the section.**

  The "telepathy-proof room" was an engineering safeguard against a high-probability confound. If the probability drops to negligible, the safeguard is unnecessary bloat. In a revised 1960 or 1970 edition of the paper, I suspect the ESP objection would be moved to a footnote acknowledging that "earlier statistical claims have not held up under stricter sequential analysis," and the telepathy-proof room would be deleted.

  ### Summary
  Turing's rigor wasn't about dogmatic materialism; it was about **signal-to-noise**.
  1.  **Markwick:** Proved the signal was noise (fraud).
  2.  **Bem:** Proved the detection method was leaky (optional stopping).
  3.  **Decibans:** The accumulated evidence fails to move the needle from the low prior.

  He wouldn't have become a dogmatic skeptic who says "Psi is impossible." He would have become a rigorous skeptic who says "The signal is indistinguishable from noise under controlled conditions, so we proceed as if it is zero." That is the essence of the Banburismus mindset: you don't need to know the Enigma setting is *impossible* to be wrong; you just need to know the odds are too low to waste resources on it. He would have stopped wasting resources on the telepathy-proof room.
