      *   *Point 2: Knowing the System.* To construct $G_F$, you need to know the specific axioms of $F$. If the mind is a machine, do we know its code? If not, we can't write the Gödel sentence. If the mind is too complex to be fully known by itself, the argument fails.
      *   *Point 3: Idealization.* Humans aren't ideal mathematicians. We get tired, make errors. Penrose tries to address this ("idealized insight"), but that moves the goalposts to a hypothetical mind, not the actual biological one.
