      *   **Augustine's Verdict:** He absolutely prioritizes Horn 1. Lying is *always* a sin. It damages the relationship with God.
      *   **The "Third Option" (The Way Out):** This is crucial. Augustine does *not* say you must actively betray the murderer. He distinguishes between *lying* and *withholding truth*.
