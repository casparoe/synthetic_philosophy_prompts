          *   You can remain silent.
          *   This avoids the lie (you didn't say "he isn't here") and avoids active betrayal (you didn't say "he is here").
      *   **Why the Hard Line? (Theological Context):**
          *   Nature of Truth: God is Truth. Lying is a turning away from God.
          *   Hierarchy of Goods: The health of the soul (eternal) is more important than the health of the body (temporal). Saving a life is good, but corrupting the soul is worse.
          *   Consequences vs. Intent: We control our words/intent, not the murderer's actions. If you tell the truth and the murderer kills, that's on the murderer/judge, not you. If you lie, that's on *you*.
