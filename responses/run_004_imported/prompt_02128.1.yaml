      *   *Wait, check the specific text:* In *De Mendacio*, Augustine is extremely strict. He often argues that one must not lie, even to save a life. But does he advocate *betrayal*? No. He advocates *silence* or *refusal to answer*.
      *   *Key Distinction:* Lying (asserting falsehood) vs. Concealing (not asserting truth).
      *   *The "Betrayer" line:* "Surely the betrayer too is one whom the divine Scripture detests." This is a rhetorical question meant to show the difficulty, not necessarily to equate betrayal with lying. He is showing that *if* you tell the truth leading to death, you feel like a betrayer. But for Augustine, the sin of lying is certain; the sin of betrayal (via truth-telling) is less clear or avoidable.
      *   *Resolution:* Augustine's solution is typically: Do not lie. You can remain silent or say "I know, but I will not tell."

  3.  **Drafting the Explanation - Step-by-Step:**

