answer: |-
  I am so sorry for the loss of your mother. Six weeks is a very specific, difficult kind of time—the initial shock has often worn off, but the world has not yet reshaped itself to fit the absence. It makes perfect sense that you are wrestling with Zhuangzi. His words are jagged; they are not meant to soothe, but to startle. Whether they are a lifeline or a defense mechanism is a question that perhaps cannot be answered intellectually, only lived.

  Here is a story that attempts to hold that tension without resolving it.

  ***

  **The Great Clod**

  The condolence cards were finally sorted. Elias had stacked them in a shoebox in the closet, behind the winter scarves. Six weeks was the magic number, apparently. The casseroles had stopped arriving. The phone had stopped ringing. The silence of the apartment had shifted from a temporary shock to a permanent architectural feature.

  On the kitchen table lay the book. *The Complete Works of Chuang Tzu*, translated by Burton Watson. It belonged to Sarah, a friend from grad school who knew better than to call but sent texts that were just links or titles. *Read this,* one had said three days ago. *Not for the answers. For the questions.*

  Elias poured a glass of wine he didn't really want and opened the book to the bookmark Sarah had left. A strip of red cardstock.

  He found the passage about the basin. He had skimmed it before, but now he read the lines where Zhuangzi's friend Hui Tzu finds him squatting, drumming on a tub, and singing. His wife had just died.

  *"She died,"* Elias read aloud, his voice cracking on the verb. *"And he drummed on a basin and sang."*

  He slammed the book shut. The sound was sharp, unsatisfying.

  "It's disrespectful," he said to the empty room. He could hear his mother's voice in his head, not quoting philosophy, but complaining about the neighbors. *Some people have no decency, Eli.*

  He stood up and walked to the window. It was raining. The streetlights smeared on the glass. He thought of the hospice nurse, the beep of the monitors, the way his mother's hand had felt like dry paper in the last week. The weight of her. The sheer physical burden of watching a person dissolve.

  He went back to the table. He had to understand why Sarah sent this. He opened the book again, further on. *The Great and Venerable Teacher.*

  He read about Master Lai, who was dying. His body was contorted, his breath wheezing. And Master Lai said that the Great Clod—the Earth, the universe—burdens him with a body, labors him with life, and rests him in death.

  *"Suppose a smith were casting metal,"* Elias read. *"If the metal should leap up and say, 'I insist on becoming a Moye sword!' the smith would surely regard it as inauspicious metal."*

  Elias looked at his own hands. He flexed the fingers. For the last year, his mother's body had been the metal in the forge. The cancer was the fire. She had fought. She had insisted. *I want to see the garden in spring,* she had said in January. *I want to fix the hem on this dress.*

  If she was the metal, and the universe was the smith, then her struggle was just... inauspicious metal? A glitch in the casting?

  "That's cold," Elias whispered. "That is incredibly cold."

  He felt a surge of anger, hot and bright. It was better than the gray fog of the last month. He wanted to throw the book. He wanted to call Sarah and tell her that ancient Taoist parables didn't account for the smell of antiseptic or the way a daughter's voice changes when she's tired.

  But he didn't close the book. He turned the page.

  The story of the skull. Zhuangzi finds a skull on the road to Chu. He taps it with his horse whip and asks if it died from greed, from war, from shame. Later, the skull visits him in a dream. Zhuangzi offers to restore it to life. To give it flesh, family, community.

  The skull refuses. *"Why would I give up the happiness of a king on a throne to return to the toil of the living?"*

  Elias sat back. The wine was gone. The kitchen was dark except for the stove light.

  "Toil," he said.

  He thought of his mother's mornings. The coffee, the pills, the physiotherapy exercises, the worry about him, the worry about the bills. The relentless maintenance of being a person. A self. A mother.

  If he called her back, if he could snap his fingers and put her back in the forge, back into the wet, heavy clay of a body... would she come? Or would she look at him with the hollow eyes of the skull and say, *No. I am unburdened.*

  He stood up and walked to the sink. He picked up a stainless steel mixing bowl. It was the one she used for holiday cookies, the one with the dent in the rim from 1998.

  He held it in his hands. It was cool. Heavy.

  *Transformation of things.*

  The phrase hung in the air. It wasn't about acceptance. Acceptance implied a choice, a decision to make peace. This sounded like something else. Something physical. Like water turning to ice. Like metal cooling.

  Was it peace to see her as energy changing state? Or was it a trick? A way to intellectualize the hole in his chest so he didn't have to fall into it? If he believed she was just "transformed," he didn't have to miss her. He could just observe the process. He could become the smith, not the metal.

  He set the bowl down on the counter. He picked up a wooden spoon.

  He thought of Zhuangzi squatting. He thought of the absurdity of it. A man making noise over a corpse.

  Elias lifted the spoon. He hovered it over the dent in the rim of the bowl.

  If he hit it, he would make a sound. A vibration. The air would move. The sound would travel through the apartment, through the walls, out into the rain. It would dissipate. It would be gone.

  If he didn't hit it, the silence remained. The grief remained. Solid. Heavy.

  If he did hit it, and he felt relief, was it because he understood the truth of the universe? Or was it because he had finally successfully dissociated? Because he had turned his mother into a metaphor so she didn't have to be a ghost?

  He looked at the bowl. He saw his own reflection distorted in the steel. He looked tired. He looked like someone who hadn't slept in six weeks.

  He struck the bowl.

  *Gong.*

  The sound was clear, resonant, and surprisingly long-lasting. It hummed in the quiet kitchen. It vibrated in the wood of the table. It vibrated in his teeth.

  Elias waited for the feeling. He waited for the tears, or the peace, or the anger.

  The sound faded. The silence rushed back in, but it felt different now. Charged.

  He let out a breath. It sounded like a laugh, but it caught in his throat and turned into a cough. He put the spoon down. He placed his hand flat on the cold steel of the bowl.

  "Okay," he said to the room.

  He didn't know if he was talking to his mother, or to Zhuangzi, or to the empty air. He didn't know if the tightness in his chest had loosened because he was healing, or because he had finally stopped fighting the fact that she was gone.

  He turned off the stove light. He left the bowl on the counter, uncovered. He walked into the living room and lay down on the couch, staring at the ceiling. He felt very light. Light enough to float, or light enough to vanish.

  He closed his eyes and listened to the rain. It sounded like drumming. It sounded like singing. It sounded like nothing at all.
