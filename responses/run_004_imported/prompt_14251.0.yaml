      *   *Topic 3: Embedded/Local Implicatures.*
          *   *Core Issue:* Classical Griceanism says implicature happens *after* literal meaning is determined (post-semantic). But sentences like "If John ate some of the cookies, he gets a treat" seem to imply "not all" *inside* the "if" clause. If implicature is post-semantic, how does it get inside the logic? This challenges the semantics/pragmatics boundary.
          *   *Likely Defense:* She might argue for "pragmatic intrusion" or defend the classical view by reanalyzing the semantics (e.g., "some" literally means "some but not all" in certain contexts, or it's a processing illusion).
          *   *Follow-up:* If pragmatics penetrates semantics this deeply, does the Gricean distinction between "what is said" and "what is implicated" collapse entirely?

      *   *Topic 4: Displacing Grice (Closing Question).*
          *   *Core Issue:* Griceanism is the default. What kills it?
