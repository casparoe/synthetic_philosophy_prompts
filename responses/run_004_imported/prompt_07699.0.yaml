answer: |-
  The departmental lounge smelled of stale pinot noir and brie that had been out too long. Teodor stood near the window, swirling a plastic cup, watching the rain streak the glass. Ines approached, grabbing a napkin and a square of cheddar.

  "You didn't mention the asymmetry problem once," Ines said, leaning against the sill beside him. "I was checking. I even counted."

  Teodor smiled, the expression tired but warm. "I assumed you were in the back row, tallying my sins. I thought if I didn't poke the bear, the bear might let me finish the Q&A without eating me."

  "I'm not a bear, I'm a colleague. And you're still treating moral testimony like it's radioactive, Teodor. In your talk, you acted as if deferring on a moral judgment is a category error. But I defer on my thyroid medication every day. I don't know the biochemistry. I just trust the endocrinologist."

  "Medical deference is about facts," Teodor said, turning to face her. "The doctor tells you *what is* the case with your thyroid. Morality isn't just about what is the case. It's about what to do. When you defer to a mechanic, you aren't outsourcing your agency to them. You're outsourcing a technical diagnosis so you can make the decision."

  "Is there a difference?" Ines took a bite of cheese. "If the mechanic says, 'Your brakes are shot, you shouldn't drive this,' and I say, 'Okay, I won't drive,' haven't I just taken their word for a normative claim about safety? Why is ethics special? If moral facts exist, and some people are better at discerning them—call them experts—why is it epistemically irresponsible to trust them?"

  "Because in the mechanic case, the value of safety is already yours," Teodor said. "You want to not crash. The mechanic just provides the means. In ethics, the expert is supposed to be telling you what to value, or how to weigh values. If you just take their word, you aren't engaging with the reasons that make the action right. You're just following an order."

  "But that conflates *justification* with *motivation*," Ines countered. "I can be justified in believing an action is right because a trusted source told me so, even if I don't feel the full weight of the reasons myself. We do this in history all the time. I believe the Treaty of Versailles was signed in 1919 because a historian told me. I haven't verified the archives. My belief is justified. Why can't moral belief work the same way?"

  Teodor took a sip of wine, grimacing slightly at the warmth of it. "Because of understanding. Alison Hills' point, roughly. If you believe the Treaty was signed in 1919 on testimony, you have a true belief. But if you believe eating meat is wrong solely on testimony, you lack moral *understanding*. You can't grasp the reasons. And without grasping the reasons, you can't navigate new cases. You're brittle."

  "Brittle is a psychological claim," Ines said sharply. "That's an empirical bet. Maybe the person who trusts their partner about vegetarianism is *more* stable because the social bond reinforces the norm. But even if they are brittle, does that make the belief false? Or unjustified? You're sliding from epistemology into virtue ethics. You're saying they aren't a *good person*, not that they're wrong about the meat."

  "I'm saying the epistemic state is deficient because the domain demands autonomy," Teodor said. "In science, the goal is truth. In morality, the goal is right action *for the right reasons*. If you don't see the reason—the suffering of the animal, say—you aren't responding to the moral reality. You're responding to your partner's voice. That's not a moral response."

  "Let's test that," Ines said, shifting her weight. "Take the case you hinted at in the second section. A guy becomes a committed vegetarian purely because his partner told him eating meat is wrong. He doesn't know the arguments about factory farming or environmental impact. He just trusts her judgment. He stops eating meat. Is there a defect there?"

  "Yes," Teodor said immediately. "There is a defect."

  "Okay. Is the meat still murdered? Is the suffering still happening?"

  "The outcome is the same. But his relationship to the outcome is hollow."

  "Hollow," Ines repeated. "So, if I save a drowning child because a moral expert told me 'saving children is obligatory,' and I do it just to obey the expert, I haven't really done the right thing?"

  "You've done the right action, but you haven't exercised moral agency," Teodor said. "You've treated a moral demand like a traffic law. 'Stop because the sign says so,' rather than 'Stop because children are crossing.' The vegetarian who doesn't know *why* meat is wrong... if his partner leaves him, or if she changes her mind, his morality evaporates. He has no grip on the truth."

  Ines shook her head. "You're demanding too much of the average agent. Most people don't have the time or cognitive bandwidth to derive every moral verdict from first principles. If trust is a reliable mechanism for getting to the truth—and I argue it is—then insisting on personal derivation is elitist. It says only philosophers can be moral."

  "It's not about derivation, it's about sensitivity," Teodor insisted. "If you trust a doctor, you can still ask, 'Will this hurt?' 'How often do I take it?' You have a framework for the expertise. If you trust a moral expert, but you can't recognize *why* their verdict makes sense when you see it, you aren't treating them as an expert. You're treating them as an oracle. The vegetarian should be able to look at the cow and think, 'Ah, I see.' If he can't, he doesn't believe it's wrong. He believes *she believes* it's wrong."

  "And what if 'She believes it's wrong' is a perfectly sufficient reason for him?" Ines pressed. "We build our lives on interpersonal trust. If I value my partner's moral outlook, isn't aligning with it a moral good in itself? Loyalty, trust, cohesion—those are values. Maybe he's not acting on the value of 'animal welfare,' but he's acting on the value of 'respecting my partner.' Why is that morally bankrupt?"

  "Because it's the wrong currency," Teodor said softly. "You can't buy moral worth with loyalty. If the partner turns out to be a bigot, and says 'Don't sit with those people,' and he obeys out of the same trust... he has no resources to resist. The defect is that he has surrendered his capacity to track moral reasons. He's outsourced his conscience."

  "So the defect is instrumental," Ines said, seizing on the opening. "It's not that testimony is inherently invalid in ethics. It's that it's risky if the source is bad. But that's true of medicine too. If my doctor is a quack, I die. We don't say 'medical testimony is impossible.' We say 'find a better doctor.' The vegetarian's problem isn't that he used testimony. It's that he didn't vet the reasons *for* the testimony."

  Teodor paused, looking out at the rain again. "That's a fair concession. But it doesn't solve the autonomy problem. Even with a good doctor, I can verify the diagnosis eventually. I can get a second opinion. I can read the lab results. With morality... if I don't feel the force of the reason myself, what is there to verify? You're asking him to trust a feeling he doesn't have."

  "I'm asking him to trust that his partner *has* the feeling, and that her feeling tracks reality," Ines said. "Look, Teodor. We agree the world is complex. We agree most people are morally lazy. If we ban moral testimony, we leave most people with no moral guidance other than their own intuitions, which are notoriously biased. If we allow it, we allow moral progress to spread socially, like knowledge does in science. Yes, some people will be 'hollow' vegetarians. But the cows don't care about the vegetarian's autonomy. They care about not being eaten."

  Teodor laughed, a short, dry sound. "There it is. The consequentialist hammer. You're willing to sacrifice the quality of the moral agent to ensure the quality of the outcome."

  "I'm willing to acknowledge that the quality of the agent isn't the only thing that matters," Ines corrected. "But let's meet in the middle. What if the defect isn't epistemic? What if the vegetarian has a justified true belief—meat is wrong—but lacks *virtue*? That preserves your intuition that something is missing, without forcing me to admit that his belief is irrational."

  Teodor considered this, turning the plastic cup in his hands. "A justified true belief without virtue. So, he's epistemically rational, but morally... shallow."

  "Morally dependent," Ines suggested. "Like a child. We don't say a child is irrational for obeying a parent. We say they are developing."

  "And if he never develops?" Teodor asked. "If he stays in that dependence forever? Is he a full member of the moral community?"

  "Maybe the moral community needs more dependents and fewer grandstanders," Ines said, finishing her cheese. "But I see your point. You're worried that if we normalize deference, we atrophy the collective muscle of moral reasoning."

  "And I see yours," Teodor replied. "If we ban deference, we isolate moral agents and hoard moral truth."

  They stood in silence for a moment, the hum of the departmental fridge filling the gap between them.

  "So," Ines said, gesturing to his wine. "We agree the vegetarian is doing the right thing, but you think he's a lesser person for it, and I think he's a pragmatic collaborator."

  "I think," Teodor said, "that he is safe, but he is not free. And I think freedom is a prerequisite for the kind of goodness I care about."

  "And I think," Ines said, picking up her napkin, "that being safe is often more urgent than being free. Especially for the things being eaten."

  Teodor raised his cup slightly. "To the stalemate, then. Until one of us writes the paper that settles it."

  "Don't hold your breath," Ines said, clinking her water glass against his plastic cup. "I'm still waiting for you to admit I was right about the externalism thesis in 2014."

  "Dream on, Ines."

  She smiled and turned back toward the crowd, leaving him at the window, both of them knowing the argument wasn't over, but the terms were finally clear.
