      *   *Key Insight:* The user is right to focus on Pasadena because it highlights the *arbitrariness* of the summation method, not just the magnitude. Even if we assume a mix of good/bad futures, the "net value" depends on how we group them.
      *   *Literature Check:* Mention Nover & Hájek (2004). Mention Hájek's "Expectations Unbounded". Maybe mention the "Pasadena Game" vs. "St. Petersburg". Mention Colyvan's work on infinite ethics.
