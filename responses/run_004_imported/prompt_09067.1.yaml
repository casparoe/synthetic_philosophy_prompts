      *   *Implication 4: Truncation and Boundedness.* EAs often implicitly truncate (ignore worlds beyond $10^{100}$ years or utility beyond $10^{100}$). Pasadena shows that *how* you truncate matters. If you truncate based on probability threshold vs. utility threshold, you might get different signs.
      *   *Implication 5: Alternative Decision Rules.* If MEV fails, what works?
          *   Dominance arguments (weak/strong).
          *   Stochastic Dominance.
          *   Risk-weighted expected utility (Buchak) - does it help? (Probably not with conditionally convergent series).
          *   Imprecise Probabilities/Utilities (sets of functions).

