answer: |-
  This is a sharp intuition, and you are right to press your EA friends on it. The standard dismissal of Pasadena as a "mathematical curiosity" relies on the assumption that real-world decision problems are always bounded or at least absolutely convergent. But as you note, Longtermism is explicitly in the business of evaluating unbounded outcome spaces with heavy-tailed distributions.

  While the St. Petersburg paradox tells us that Expected Value (EV) can be *infinite*, the Pasadena paradox tells us something strictly worse: that EV can be *undefined*.

  For a formal epistemologist, the distinction is crucial. Infinity can sometimes be tamed (e.g., via relative probability, dominance arguments, or projective extensions of the reals). Undefinedness, arising from conditional convergence, implies that the value of an act depends on the *order of summation*. Since the probability space of the future does not come with a canonical indexing, the "Expected Value of the Future" is mathematically ill-posed.

  Here is a breakdown of the specific implications of the Pasadena phenomenon for Longtermist reasoning, moving from the mathematical pathology to the decision-theoretic fallout.

  ### 1. The Indexing Problem (The Core Pasadena Insight)
  The St. Petersburg objection forces Longtermists to deal with unbounded magnitude. The Pasadena objection forces them to deal with **unbounded structure**.

  In the Pasadena game, the expectation $E = \sum p_i v_i$ is conditionally convergent. By the Riemann Rearrangement Theorem, you can reorder the terms to sum to any real number $r$, or $\pm \infty$. In standard measure-theoretic probability (Lebesgue integration), the expectation of a random variable is only well-defined if the integral is absolutely convergent (i.e., $E[|X|] < \infty$). If it is not, the expectation is undefined.

  **The Longtermist Application:**
  Longtermist calculations implicitly assume a summation order. Usually, this is hidden inside a model (e.g., summing over time steps $t=1 \dots \infty$, or summing over causal generations).
  *   **If you sum by time:** You might group all outcomes at $t_1$, then $t_2$, etc.
  *   **If you sum by causal chain:** You might group by branching histories.
  *   **If you sum by utility magnitude:** You might group all worlds with $U > 10^{10}$, then $10^9$, etc.

  If the future contains a mix of astronomically positive and astronomically negative possibilities (e.g., utopian post-humanity vs. astronomical suffering risks or "s-risks"), and the probabilities decay in a way that mirrors the Pasadena structure (which is plausible given our profound empirical uncertainty), then the net EV of "existing" vs. "going extinct" depends entirely on how you index the sample space.

  **Implication:** There is no "fact of the matter" about the EV of longtermist interventions if the underlying series is not absolutely convergent. The sign of the EV (positive or negative) could flip based on arbitrary modeling choices regarding how outcomes are enumerated.

  ### 2. The Failure of Comparability
  Standard Effective Altruism relies on **comparativism**: Cause A is better than Cause B if $EV(A) > EV(B)$.

  In St. Petersburg cases, you can sometimes salvage comparability. If Act A has EV $+\infty$ and Act B has EV $+\infty$, you might use stochastic dominance or relative probability to distinguish them.
  In Pasadena cases, you cannot. If $EV(A)$ is undefined and $EV(B)$ is undefined, the relation $>$ is not merely unknown; it is **category mistaken**. You cannot compare two undefined quantities.

  **Implication:** This attacks the core Longtermist claim that we can *rank* interventions. If the background uncertainty about the far future generates conditionally convergent series for all major interventions (which is likely, given they all impact the same infinite future light cone), then MEV (Maximize Expected Value) cannot generate a preference ordering. It yields a complete deadlock.

  ### 3. The Axiomatic Cost: Finite vs. Countable Additivity
  The technical fix for Pasadena in probability theory is to reject **Countable Additivity** in favor of **Finite Additivity** (à la de Finetti).
  *   **Countable Additivity:** $P(\cup A_i) = \sum P(A_i)$ for countable disjoint sets. This is standard Kolmogorov probability. It leads to Pasadena paradoxes when utilities are unbounded.
  *   **Finite Additivity:** Only holds for finite unions. This blocks the construction of the infinite sum that creates the paradox.

  **The Trade-off:**
  Many formal epistemologists (including some EAs) argue Countable Additivity is required for:
  1.  **Standard Conditionalization:** Updating on evidence in infinite spaces often requires countable additivity to ensure coherence.
  2.  **Dutch Book Arguments:** Standard Dutch Book theorems often presuppose countable additivity to rule out certain betting strategies over infinite sequences.

  **Implication:** To save Longtermist EV calculations from Pasadena, you might have to abandon standard Kolmogorov probability. But doing so weakens the formal arguments EAs use to defend rationality and Bayesian updating. You are trading a decision-theoretic paradox for an epistemological one.

  ### 4. What Replaces MEV? (Alternative Decision Rules)
  If MEV is undefined due to conditional convergence, what decision rule survives? This is where the literature on "Infinite Ethics" (e.g., Bostrom, Ord, Arntzenius, and more recently, works by Meacham or Lauwers) becomes relevant.

  **A. Stochastic Dominance**
  This is the strongest candidate. Act A dominates Act B if, for any utility level $x$, the probability of getting at least $x$ is higher in A than in B.
  *   *Pros:* Does not require summing series. Robust against reordering.
  *   *Cons:* It is a very weak ordering. Many longtermist interventions will be incomparable under stochastic dominance (e.g., one reduces the tail risk of extinction, the other increases the ceiling of potential value). It rarely gives the decisive "you must do X" guidance Longtermism often seeks.

  **B. Imprecise Probabilities/Utilities**
  Instead of a single probability function $P$ and utility function $U$, use a set $\mathcal{P}$ and $\mathcal{U}$. The value of an act is a range $[min E, max E]$.
  *   *Pasadena Connection:* The Pasadena paradox essentially shows that the "precise" expectation is a point that can slide anywhere. Imprecise models acknowledge this by assigning the act the value $[-\infty, +\infty]$ (or the full range of rearrangement sums).
  *   *Implication:* If the range is too wide, the decision rule becomes "permissivism" (almost anything is rationally permissible). This undermines the demandingness of Longtermism.

  **C. Truncation (The "Pragmatic" Fix)**
  Most practicing EAs implicitly truncate. They ignore outcomes beyond a certain probability threshold (e.g., $10^{-100}$) or utility cap.
  *   *Pasadena Critique:* Pasadena shows that *how* you truncate matters. If you truncate based on probability mass, you might get one sign. If you truncate based on utility magnitude, you might get another.
  *   *Implication:* Truncation is not a neutral regularization technique; it is a value-laden modeling choice that determines the outcome of the calculation. Longtermists need to justify their truncation method normatively, not just pragmatically.

  ### 5. The "Sign" Requirement and S-Risks
  A specific technical constraint of the Pasadena paradox is the **alternating signs**. For a series to be conditionally convergent, it must have positive and negative terms. If all utilities are positive, the series either converges absolutely or diverges to $+\infty$ (St. Petersburg).

  **Does Longtermism have negative terms?**
  Yes. This is the domain of **S-Risks** (Astronomical Suffering).
  *   If a Longtermist believes the future could contain net positive value (utopia) OR net negative value (hellish scenarios), and the probabilities of these scenarios decay slowly enough relative to their magnitude, the expectation becomes a signed sum over an infinite space.
  *   If the Longtermist is a **Total Utilitarian**, the value of the future is the sum of well-being. If there is a non-zero probability of infinite negative value (or sufficiently large finite negative value with slow-decaying probability), the EV calculation becomes Pasadena-like.

  **Implication:** The Pasadena paradox is most damaging to Longtermists who take s-risks seriously. If you believe the future is *only* positive or zero, you face St. Petersburg (divergence). If you believe the future could be negative, you face Pasadena (undefinedness). The latter is harder to solve.

  ### Summary for Your Pub Discussion
  When your friends wave this off, you can push back with this specific claim:

  > "St. Petersburg tells us the Expected Value of the future might be too big to measure. Pasadena tells us it might not exist at all. If the series of future outcomes isn't absolutely convergent, the 'Expected Value' depends on how we index the future. Since there is no natural ordering of possible futures, MEV doesn't give us a number—it gives us a coordinate system dependency. If we can't define the value of the future, we can't maximize it."

  **The Upshot:**
  Pasadena suggests that MEV is not a fundamental normative principle that holds even in idealized infinite contexts. It is a heuristic that works for "tame" distributions (bounded or absolutely convergent). Longtermism operates in "wild" distributions. Therefore, Longtermists either need to:
  1.  Argue the future is "tame" (e.g., bounded utility, or probabilities decay extremely fast).
  2.  Abandon MEV for a more robust rule like Stochastic Dominance (accepting weaker guidance).
  3.  Accept that their calculations are sensitive to arbitrary modeling choices regarding the indexing of outcomes.

  Given your background, you might point them to **Alan Hájek's "Expectations Unbounded"** or **Colyvan's work on infinite ethics**. The Pasadena paradox isn't just a bug in the math; it's a feature of reasoning over unbounded value spaces that suggests the standard decision-theoretic toolkit is insufficient for the job Longtermism has assigned it.
