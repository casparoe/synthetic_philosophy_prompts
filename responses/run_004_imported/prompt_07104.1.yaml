answer: |-
  It is a pleasure to address a colleague who knows the smell of the lab, even if your bench days are behind you. You have hit on precisely the nerve that makes the realism/anti-realism debate interesting: it isn't just abstract metaphysics; it's about whether the work you spent 35 years doing was uncovering *truth* or just refining *instrumental utility*.

  Laudan's Pessimistic Meta-Induction (PMI) is indeed the sharpest dagger in the anti-realist kit. Your intuition that Worrall's Structural Realism (SR) might be "relocating the goalposts" is shared by many philosophers of science. In fact, that intuition is the starting point for the most serious technical objections to the view.

  Here is an honest breakdown of the dialectic, the case studies (including some from your own backyard), and the "technical snag" your friend alluded to.

  ### 1. The Core Conflict: Ontology vs. Structure

  **Laudan's PMI** rests on a historical premise: successful past theories (phlogiston, caloric, ether) had false ontologies. Therefore, by induction, our current successful theories likely have false ontologies. The conclusion is that we should not believe our theories are *true*, only that they are *empirically adequate*.

  **Worrall's Structural Realism** attempts to split the difference. He argues that when theories change, we tend to discard the *nature* of the entities (the ontology) but retain the *mathematical relations* between them (the structure).
  *   **Fresnel (1818):** Light is a wave in a mechanical ether.
  *   **Maxwell (1865):** Light is an electromagnetic field propagation.
  *   **The Shift:** The "ether" (ontology) is discarded. The wave equations (structure) are retained.

  Worrall argues that if we are realist only about the structure, we avoid Laudan's indictment. We aren't claiming the ether exists; we are claiming the *relations* described by Fresnel's math capture something real about the world, which is why Maxwell could reuse them.

  ### 2. Does SR Escape the PMI? The "Goalpost" Objection

  You asked if SR is vulnerable to the same historical pattern, just one level up. The short answer is: **Yes, but it depends on how strictly you define "structure."**

  If "structure" is defined loosely as "any mathematical formalism that yields predictions," Laudan can still win. He can point to theories where even the math was radically overhauled. However, Worrall's stronger claim is that *causal-structural* relations are preserved.

  The problem is that SR risks becoming a "no-miracles" argument for equations only. If the ontology is completely stripped away, what is the structure *of*? This leads to the deeper technical problem I'll address in section 4. But historically, does structure survive?

  ### 3. Case Studies: Beyond Fresnel and Maxwell

  To test SR, we need to look beyond the textbook example. Let's look at three cases, including one from chemistry.

  #### A. Newton to Einstein (Strong Support for SR)
  This is the strongest case for structural realism.
  *   **Newton:** Gravity is a force acting instantaneously at a distance ($F = G m_1 m_2 / r^2$).
  *   **Einstein:** Gravity is the curvature of spacetime. No "force" in the Newtonian sense.
  *   **Preservation:** In the limit of weak gravitational fields and low velocities, Einstein's field equations reduce mathematically to Newton's inverse-square law.
  *   **Verdict:** The ontology changed completely (force vs. geometry), but the structural relations (how mass relates to acceleration in standard conditions) were preserved as a limiting case. SR handles this well.

  #### B. Bohr Atom to Schrödinger QM (Mixed Support)
  *   **Bohr:** Electrons are particles in fixed circular orbits with quantized angular momentum.
  *   **Schrödinger:** Electrons are delocalized wavefunctions/probability densities.
  *   **Preservation:** The energy levels (spectral lines) predicted by Bohr are recovered in QM. The *structural relation* between quantum numbers and energy states survives.
  *   **Loss:** The trajectory structure (orbits) is entirely discarded.
  *   **Verdict:** SR works here if you define structure as "spectral relations," but fails if you define it as "dynamical trajectory." This shows the realist has to be selective about *which* structure counts.

  #### C. Phlogiston to Lavoisier (The Chemist's Counter-Example)
  This is where your professional pride comes in, and where SR takes a hit.
  *   **Phlogiston:** Combustion is the *release* of a substance (phlogiston) from a material.
  *   **Lavoisier:** Combustion is the *uptake* of a substance (oxygen) by a material.
  *   **Preservation:** Is there a mathematical structure preserved? Not really. There is a conceptual inversion. Mass increases in one, decreases in the other (conceptually).
  *   **Verdict:** This is a nightmare for Structural Realism. There is no equation here that survived the transition. The "structure" of the chemical reaction was reinterpreted so fundamentally that calling it "preserved structure" feels like sophistry.
  *   **Implication:** If SR cannot save realism in the history of chemistry's biggest revolution, its claim to be a general solution to PMI is weakened. It suggests SR works best in mathematical physics and struggles in qualitative or mechanistic sciences.

  ### 4. The Technical Snag: Newman's Problem

  Your friend was hinting at a problem raised by the mathematician Max Newman in 1928, recently revived by philosophers like Hilary Putnam and Michael Friedman. It is the most devastating logical objection to Structural Realism.

  **The Argument:**
  SR says: "We cannot know the *nature* of the entities (the relata), only the *structure* of the relations between them."

  **Newman's Point:**
  If you strip away the nature of the relata and keep *only* the structure (mathematical relations), **any** collection of objects can be made to fit **any** structure, provided you have enough objects.

  **Analogy:**
  Imagine I tell you, "I don't know what these points on a page are, but I know the structure of their relations is that of a triangle."
  If I allow you to define the "points" as *anything* (pixels, dust motes, abstract concepts), I can find three of *anything* and map them to a triangle. The statement "the world has structure X" becomes trivially true for almost any X, because structure is just a pattern we impose.

  **Why this hurts SR:**
  For "structure" to be meaningful and non-trivial, it must be the structure *of something specific*. You need to constrain the *relata* (the things being related).
  *   If you say the relata are "physical objects with causal powers," you have smuggled ontology back in (abandoning pure SR).
  *   If you say the relata are "unknown nodes," Newman shows your theory is empty.

  This is the "goalpost relocation" you suspected. Worrall tries to dodge this by saying the structure is *causal-structural* (it's about how things actually push and pull), but critics argue you can't have causation without some commitment to the *nature* of the things causing.

  ### 5. The Verdict: Does it get the Realist off the hook?

  Here is my honest take, synthesizing the history and the logic:

  **1. SR mitigates PMI, but does not refute it.**
  Worrall successfully shows that scientific progress isn't a "graveyard" of total falsehoods. There is continuity. This undermines the *pessimism* in Laudan's induction. We aren't starting from scratch every century. However, it doesn't prove the current structure is *true*, only that it is *more stable* than the ontology. Laudan could reply: "Fine, the math stays longer than the nouns. Why should I believe the math won't be discarded in 200 years?"

  **2. It creates a dichotomy that doesn't always exist.**
  In physics (Fresnel/Maxwell), the math/ontology split is clear. In chemistry (Phlogiston), it is not. In biology (DNA as code vs. DNA as chemical polymer), it is messy. SR looks like a philosophy of physics masquerading as a philosophy of science.

  **3. The Newman Problem is unresolved.**
  Structural Realists have tried to answer Newman (mostly by appealing to "natural classes" or causal constraints), but many argue these responses simply reintroduce the ontology SR was trying to avoid. If you have to specify *what* is structured to avoid triviality, you are back to making claims about the nature of reality.

  ### Summary for a Retired Chemist

  You spent 35 years assuming that when you weighed a precipitate, you were interacting with real things governed by real laws.
  *   **Laudan says:** "The phlogiston chemists thought the same thing. You're likely wrong about the 'things,' even if the weighing works."
  *   **Worrall says:** "You might be wrong about the 'things,' but the relationships you're measuring (stoichiometry, thermodynamics) are capturing real structural features of the universe that will survive the next revolution."

  **My assessment:** Worrall is right that *something* is preserved, and that gives us more reason to trust science than Laudan allows. But Worrall is wrong that this saves "Realism" in a robust sense. It saves a attenuated, skeletal version of it.

  The "technical snag" is that without committing to *what* is doing the relating, "structure" is just a pattern we project. To make SR work, you have to admit that structure requires *some* ontological grounding. Once you admit that, you are vulnerable to Laudan again, because that grounding might change (just as "mass" changed from Newton to Einstein).

  So, does it relocate the goalposts? **Yes.** But it moves them to a spot where the game is still worth playing. It suggests that while our *pictures* of the world (ontology) are historically contingent, our *grip* on the world (structure) is tightening. Whether that grip amounts to "truth" is still an open question.
