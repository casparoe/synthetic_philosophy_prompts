prompt: |-
  Ok here's one that's been rattling around my head. Van Fraassen's Reflection Principle says (roughly) that my credence in some claim P right now, conditional on knowing my credence in P tomorrow will be x, should just equal x — i.e., I should defer to my future self. Thing is, every year at our department's holiday party I have two glasses of wine and become embarrasingly overconfident about pet philosophical views (right now it's something dumb like "surely free will is obviously compatible with determinism, case closed"). I know this shift is coming, and I know its not driven by any new argument or evidence, just the alcohol. Naive Reflection seems to say I should already be raising my credence *now*, in anticipation, which feels totally backwards. Can you walk me through the most important implications of the Reflection Principle — including whatever patches people have proposed (I vaguely recall something about requiring your future self to count as "epistemically kosher" for Reflection to even kick in) — for cases like mine? Mainly I want to know: when, if ever, does foreseeing a change in my own future credence that has nothing to do with evidence give me any rational reason to change my mind today?
