answer: |-
  This is a fantastic question, and your frustration is entirely warranted. In fact, your intuition as an astronomer—that discovering $1898\ \text{DQ} = 1901\ \text{GV}$ is a discovery about the *rock*, not the *paperwork*—is precisely the intuition that drove Frege to abandon the view you are reading in the *Begriffsschrift* (1879) and adopt the famous Sense/Reference distinction in "On Sense and Reference" (1892).

  You have correctly identified the tension. In 1879, Frege *did* argue that identity statements are metalinguistic (about names). In 1892, he explicitly rejected this. However, the relationship between the two texts is not a simple "wrong vs. right" binary; it is a story of a philosopher struggling to locate the source of "cognitive value" (why some truths teach us something new while others don't).

  Here is a detailed walkthrough of what is happening in that 1879 passage, why it feels unsatisfying to a scientist, and how it evolves into the 1892 paper your friend keeps quoting.

  ### 1. The Problem Frege Was Trying to Solve (1879)

  To understand why Frege wrote the passage you translated, we have to look at the logical problem he was facing. He was building a formal system (*Begriffsschrift*) intended to capture mathematical reasoning.

  In his system, signs (like $A$ or $B$) are usually just proxies for their **Content** (*Inhalt*). If $A$ stands for "The Morning Star" and $B$ stands for "The Evening Star," and they have the same Content (Venus), then logically, wherever you put $A$, you should be able to put $B$ without changing the truth of the matter.

  But then Frege hit a wall with identity statements:
  1.  $A = A$ (The Morning Star is the Morning Star)
  2.  $A = B$ (The Morning Star is the Evening Star)

  If identity were a relation between the **Contents** (the objects themselves), then (1) and (2) would be the exact same judgment. Both would just say: "Venus is Venus."
  *   (1) is trivial. It tells us nothing. It is *a priori*.
  *   (2) is informative. It was a major astronomical discovery. It is *a posteriori*.

  Frege needed to explain why (2) contains **knowledge** while (1) does not, even if $A$ and $B$ point to the same thing.

  ### 2. The 1879 Solution: "It's About the Names"

  In the *Begriffsschrift* passage you quoted, Frege proposes a solution: **Identity is a relation between signs, not contents.**

  When we say $A = B$, we are not saying "The object pointed to by A is the object pointed to by B." We are saying, "The sign 'A' and the sign 'B' have the same Content."

  **Why did he think this?**
  He thought this was the only way to explain the "information" gain.
  *   If I say $A = A$, I am just repeating a sign. No info.
  *   If I say $A = B$, I am linking two *different* signs. The "knowledge" is the realization that these two distinct linguistic paths converge on the same destination.

  **Your Astronomical Objection:**
  You wrote: *"Working out that two 'different' minor planets were actually one object felt exactly like an astronomical discovery, about orbits and rocks, not a discovery about paperwork or notation."*

  Frege in 1879 would reply: "Yes, but logically, how do you express that discovery? You express it by noting that the designation '1898 DQ' and the designation '1901 GV' can now be substituted for one another in your equations."

  **Is this self-undermining?**
  You asked: *"Surely which symbols we happen to use is itself arbitrary, so how could a fact about them be the substantial thing we're learning?"*

  This is exactly the criticism that eventually convinced Frege to change his mind. If identity is only about names, then:
  1.  It becomes arbitrary. If we had only named the asteroid "Rock1" from the start, there would be no knowledge to be had.
  2.  It makes logic dependent on language. We want to say "Venus is Venus" is a fact about the solar system, not a fact about the English language.

  In 1879, Frege was willing to accept this "metalinguistic" cost to save his logic. He admits in that passage that this introduces a "split" in the meaning of signs (sometimes they stand for content, sometimes for themselves). He knew it was messy, but he thought it was necessary to explain how $A=B$ can be informative.

  ### 3. The 1892 Reversal: "On Sense and Reference"

  Thirteen years later, Frege decided the 1879 solution was indeed untenable. In the opening pages of "On Sense and Reference," he explicitly discusses his earlier view (though he doesn't name the *Begriffsschrift* directly) and rejects it.

  He argues that if $a = b$ were just about the signs $a$ and $b$, it would express no proper knowledge of the **subject matter**. As you noted, it would turn astronomy into lexicography.

  **The New Solution: Sense (*Sinn*) and Reference (*Bedeutung*)**
  Frege splits the 1879 concept of "Content" (*Inhalt*) into two distinct things:
  1.  **Reference (*Bedeutung*):** The actual object (the planet, the number, the truth-value).
  2.  **Sense (*Sinn*):** The "mode of presentation" or the "way the object is given to us."

  **How this solves your problem:**
  *   **Identity is about the Reference:** When you say $1898\ \text{DQ} = 1901\ \text{GV}$, you are making a claim about the **object** (the asteroid). Your intuition was right; Frege (1892) agrees with you.
  *   **The Knowledge is in the Sense:** Why is it informative? Because the two names have different **Senses**.
      *   Sense of $1898\ \text{DQ}$: "The object observed at these coordinates on this date with this orbital fit..."
      *   Sense of $1901\ \text{GV}$: "The object observed at *these* coordinates on *that* date with *that* orbital fit..."

  The discovery is that two different *Senses* (two different calculation paths, two different observation arcs) determine the same *Reference*.

  This preserves the insight from 1879 (that there are "different routes" to the content) without making the statement *about* the routes. The statement is about the destination, but the *value* of the statement comes from realizing the routes converge.

  ### 4. Is the Relationship Messier Than a Simple Reversal?

  Yes. It is not a total repudiation; it is a refinement.

  If you look closely at your 1879 translation, you will see the seed of the 1892 theory:
  > *"It only earns its keep because a content can be fully determined in more than one way, and it can be a real piece of knowledge... that these different routes converge on one and the same thing."*

  In 1879, Frege calls these "different ways" of determining content. In 1892, he gives them a name: **Sense**.

  The crucial shift is where he locates the identity relation:
  *   **1879:** The relation of identity holds between the **Signs** (because they share a content).
  *   **1892:** The relation of identity holds between the **References** (because they are the same object), but the *thought* expressed involves the Senses.

  So, the 1879 text is not "wrong" in its diagnosis of the problem (why is $A=B$ informative?), only in its metaphysical placement of the solution. He correctly saw that "modes of determination" matter, but he mistakenly thought that made the statement *about* the modes (or the names) rather than about the object determined.

  ### 5. Summary for Your Dinner Conversations

  Since your friend loves the Morning Star/Evening Star example, you now have a much stronger position than just repeating the example.

  1.  **Validate your intuition:** Tell your friend that your experience with minor planet designations confirms Frege's mature view (1892), not his early view (1879). The discovery is about the *object* (the Reference), not the *designations* (the Signs).
  2.  **Explain the 1879 trap:** Explain that young Frege thought that because the *knowledge* comes from comparing two observation arcs (two Senses), the *statement* must be about the arcs (or the names).
  3.  **The Fix:** Mature Frege realized we can have two Senses without making the statement metalinguistic. The statement is about the planet; the *cognitive work* is in the Senses.

  **To answer your specific questions directly:**

  *   **Did Frege really mean to reduce identity claims to claims about our labeling conventions?**
      *   **In 1879:** Yes. He explicitly says identity relates to names, not contents.
      *   **In 1892:** No. He explicitly rejects this.
  *   **How is that not immediately self-undermining?**
      *   Frege eventually agreed with you that it *was* undermining. It makes the truth of "Venus is Venus" dependent on whether humans gave it two names. That makes objective science dependent on linguistic contingency.
  *   **Is this the view he attacks in "On Sense and Reference"?**
      *   Yes. The opening pages of "On Sense and Reference" are essentially a critique of the *Begriffsschrift* §8 position. He calls the earlier view the view that identity is a relation between signs. He replaces it with the view that identity is a relation between objects, mediated by Sense.

  ### Final Thought for an Astronomer

  You mentioned the geometrical example in *Begriffsschrift* that you skipped. It is actually very similar to your work. Frege talks about a point defined by the intersection of line $A$ and line $B$, versus a point defined by the intersection of line $C$ and line $D$.

  In 1879, he says saying "Point $(A,B)$ = Point $(C,D)$" is a claim about the *definitions*.
  In 1892, he would say it is a claim about the *point*, but the *Sense* is the method of construction (intersection of $A,B$ vs $C,D$).

  Your work fitting orbits is the perfect real-world instantiation of "Sense." The orbit *is* the Sense (the mode of determination); the rock *is* the Reference. When you prove $1898\ \text{DQ} = 1901\ \text{GV}$, you are proving that two different Senses (orbital solutions) yield the same Reference (the physical body).

  Frege spent 13 years trying to formalize exactly the feeling you have: that the discovery is substantial and about the world, even though it arrives through the comparison of two different descriptive paths. He just took the wrong turn in 1879 by thinking that made the statement *about* the paths.
