answer: |-
  John Wallis confronts Hobbes over his impossible squared circle.

  "Thomas," Wallis says, "your own philosophy states that disputes end only when everyone submits to a Sovereign whose word is final, regardless of correctness. Why won't you submit to the proof?"

  Hobbes replies, "Because I wrote that 'Authority, not truth, makes law.' I have the authority. Therefore, this circle is squared."

  "But sir," Wallis says, "mathematics isn't a commonwealth."

  Hobbes sharpens his compass. "Then it's still in the State of Nature. And I find its resistance nasty, brutish, and unlawful."
