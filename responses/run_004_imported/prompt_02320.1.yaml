prompt: |-
  So I'm re-reading Rawls for tomorow's lecture and I keep coming back to this: doesn't his idea of public reason basically mean religious citizens have to bite their tongue and repackage their real reasons in secular language before they're allowed to weigh in on stuff like abortion or gay marriage? Feels like his "neutrality" is doing a lot of quiet work to sideline religious voices from politics. Am I being unfair to him here, or is that basically right?
