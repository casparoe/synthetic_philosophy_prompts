answer: |-
  **Setting:** *Office hours. Coffee cups on the desk. The student's case study is pinned to the whiteboard.*

  **Sense-Datum Theorist (SDT):** Let's stick to your migraine. For twenty minutes, you saw a zigzagging crescent of light. It had location, brightness, motion. You said yourself: in the moment, you couldn't tell it wasn't in the room. That introspective indistinguishability is the anchor. If Experience A (seeing a real neon sign) and Experience B (your aura) are subjectively identical, there must be a common denominator. A "sense-datum." A mental object present in both cases that carries the visual properties.

  **Disjunctivist (D):** I deny the inference. You're moving from an *epistemic* fact—"I can't tell them apart"—to an *ontological* conclusion—"They are made of the same stuff." Just because you can't distinguish a fake diamond from a real one with the naked eye doesn't mean they share the same chemical structure.

  **SDT:** But with diamonds, we agree the *visual appearance* is the common factor. That's why you can't tell them apart! In your migraine, your visual cortex fired in a specific pattern. In veridical perception, light hits the retina, triggering a similar pattern. If the proximal cause—the brain state—is roughly equivalent, and the subjective result is equivalent, what exactly is the "real" lamp adding to the mental state? It seems the external world is screened off. The mind only ever touches the internal datum.

  **D:** That assumes the nature of the experience is determined solely by the brain state. I say the nature of the experience is determined by the *relation* to the environment. In the veridical case, the zigzagging light isn't a mental picture; it's you standing in a perceptual relation to actual light patterns. In the migraine case, that relation is absent. You aren't seeing a "mental zigzag"; you are in a state that is *indistinguishable from* seeing a zigzag. Those are two fundamentally different kinds of existence.

  **SDT:** But that leaves the "what it's like" hanging. If I ask, "What is the phenomenal character of your experience right now?" you'd say, "It's like seeing light." If the aura is *nothing like* seeing light—if it's a totally different beast—why does it fool you? The Disjunctivist has to say the commonality is merely negative: "It's not that I'm seeing the world." But that doesn't explain the positive presence of the shimmer. The sense-datum explains the presence.

  **D:** It explains it by inventing a ghost. Look, when you see your desk lamp, the lamp itself is a constituent of your experience. The qualities of the experience *are* the qualities of the lamp. When you have the aura, there is no constituent. There is a neurological event causing you to *seem* to see. The "sameness from the inside" is just the limit of your discriminatory powers, not a shared mental ingredient. To claim there's a common sense-datum is to say that in the good case, you aren't actually seeing the lamp, you're seeing a lamp-representation. That severs the mind from the world.

  **SDT:** And to deny the common factor is to say your brain could be doing the exact same thing, with the exact same subjective texture, but the *mental state* is totally different just because of something happening three feet away in the external world. That makes the mind transparent to physics in a way that feels magical. If the internal cause is sufficient to generate the "shimmer," why isn't the mental state defined by that cause?

  **D:** Because perception isn't a container; it's an openness. In the veridical case, your consciousness extends out to the light. In the migraine, it fails to reach. You're asking for a "highest common factor" between success and failure. But there isn't one. Success is seeing; failure is seeming to see. They share a name, "experience," only disjunctively: *Either* I see the light, *or* I hallucinate it. The "sameness" is just that the second case is a counterfeit of the first, not that they share a genuine currency.

  **SDT:** But the counterfeit feels like gold. That "feeling" is the datum. You can't explain the feeling without the object of the feeling.

  **D:** And I can't explain the world without letting perception actually reach it. You save the phenomenon of the aura by sacrificing the reality of the lamp. I save the reality of the lamp by accepting that the aura is a fundamentally different, albeit confusing, kind of state.

  **SDT:** Then we're at the impasse. You prioritize the metaphysics of the object; I prioritize the phenomenology of the subject.

  **D:** Precisely. And until you can explain how a "mental object" differs from a "physical object" without just calling it "mental," I'll stick with the disjunction. The aura is a glitch, not a window.
