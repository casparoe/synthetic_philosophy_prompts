answer: |-
  **Megillus:** You compare wine to a "fear drug" given to soldiers? That analogy collapses under its own weight. A fear drug heightens the senses; a soldier must choose to stand firm *against* the trembling. Wine does the opposite. It dulls the blade of reason itself. You cannot test a man's grip on the reins by cutting the reins and seeing if he steers. If you intoxicate the citizen, you have already defeated the virtue you claim to measure.

  **Athenian:** But that is precisely why the test is necessary, Megillus. If a man is only sober-virtuous, is he virtuous, or merely untested? We do not give the wine to destroy him, but to reveal him. In the safety of the feast, under the eye of a sober symposiarch, the masks slip. The shy man boasts, the quiet man weeps, the angry man strikes. Better to see this in the cup than on the battlefield.

  **Megillus:** And what of the man who passes the test? You have still taught him to play with fire. Sparta knows that some fuels are not meant to be burned, even in a hearth. If you sanction the drinking, even with rules, you legitimize the loss of control. You tell the youth that drunkenness has a place in the city. That is a poison no symposiarch can filter out.

  **Athenian:** We do not sanction the loss of control; we sanction the *supervision* of it. Consider the chorus. Our older citizens, stiff with age and shame, will not sing or dance for Dionysus unless the wine loosens their limbs. The wine makes them pliable to education again. Without it, they grow rigid in their virtues, and rigidity is not strength—it is brittleness.

  **Megillus:** Brittleness is better than rot. You speak of a laboratory, Stranger, but I see a leak in the hull. You say the symposiarch keeps order. But who watches the symposiarch when the wine circulates? You propose to cure cowardice by inviting madness, and claim the madness will obey your laws. That is not training. That is gambling with the soul of the polis.

  **Athenian:** Then let us agree on the stakes. You train for war by avoiding the panic of battle until it arrives. I train for life by inducing the panic of passion in a controlled space. If the ship sinks during the drill, the fault lies with the captain, not the sea.
