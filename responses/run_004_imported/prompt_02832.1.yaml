          *   Athenian: Controlled exposure tests character; the "fear drug" analogy holds; the role of the sober symposiarch; the benefit for older men (loosening up).
      *   **Constraint:** A few hundred words (needs to be punchy), dialogue format, fair representation of both sides (no strawmanning).

  2.  **Deconstruct the Philosophical Core (Plato's *Laws* I.645d–671b):**
