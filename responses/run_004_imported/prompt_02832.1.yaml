      *   *Megillus's Point:* Sparta forbids it. Drunkenness leads to madness and loss of control. Why risk the city's morals for a test? A fear drug makes you *feel* fear, but wine makes you *lose reason*. They aren't the same.
      *   *The Nuance:* The Athenian emphasizes the *Supervisor* (Symposiarch). It's not a free-for-all; it's a laboratory of character.

  3.  **Drafting - Section by Section:**

