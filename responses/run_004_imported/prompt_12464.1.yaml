      *   *Strawson's Rebuttal (The "Luck" Objection):* Strawson (and many incompatibilists like Derk Pereboom) argues that mere randomness doesn't help. If an action is undetermined, it happens by chance/luck. If it happens by chance, it's not *authored* by the agent in a controlled way.
      *   *The Dilemma:*
          *   If the decision is determined by prior states (character, desires, etc.) $\rightarrow$ You didn't choose those prior states (Regress).
