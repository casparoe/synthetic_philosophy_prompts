answer: |-
  Here are nine interview questions designed for a contemporary just-war theorist defending Anscombe's absolutist position, including the four specific thematic requirements you requested. Each includes a follow-up anticipating the speaker's likely philosophical commitment.

  ### 1. The Doctrine of Double Effect and "Foreseen" Consequences
  **Question:** Truman's defenders often argue that while civilian death was foreseen, it was not intended; the intended object was the destruction of military-industrial capacity and the hastening of surrender. How do you respond to the claim that the Doctrine of Double Effect (DDE) permits this, provided the civilian deaths were not the *means* by which victory was achieved, but merely an unavoidable side effect?

  **Follow-up:** *I anticipate you will argue that the terror and destruction of the civilian center was itself the mechanism of coercion. If so, does this imply that any strategic bombing where civilian morale is a target automatically fails the DDE test, regardless of the weapon used?*

  ### 2. The "Clean Hands" Objection
  **Question:** A common consequentialist rejoinder to Anscombe is that an absolutist prohibition on killing innocents privileges the moral purity of the agent ("clean hands") over the actual lives lost in the alternative scenario (e.g., a land invasion). If refusing to bomb results in a higher aggregate death toll, why shouldn't the moral obligation shift to minimizing total suffering rather than maintaining personal incorruptibility?

  **Follow-up:** *I expect you will reject the aggregative calculus of lives. But if you do, how do you answer the charge that this renders your theory agent-centered rather than victim-centered, potentially ignoring the claims of those who die in the prolonged conflict?*

  ### 3. Consistency with Conventional Firebombing
  **Question:** Anscombe's pamphlet focuses heavily on the atomic nature of the bombs, but her moral logic rests on the intentional killing of non-combatants. If her argument is sound, it seems it must equally condemn the conventional firebombing of Tokyo, Dresden, and Hamburg, which killed more civilians overall. Do you accept this broader condemnation, or is there a morally relevant distinction between nuclear and conventional area bombing in this context?

  **Follow-up:** *Assuming you accept the broader condemnation, does this create a difficulty for your position in that it implicates nearly all Allied strategic bombing doctrine? How do you prevent this from sounding like a partisan indictment rather than a universal moral principle?*

  ### 4. Conditional Intention and Modern Deterrence
  **Question:** Later in her career, Anscombe argued that nuclear deterrence is morally illicit because it involves a "conditional intention" to murder—if the condition is met, the murder is intended. How should this apply to contemporary deterrence postures, particularly those that rely on ambiguity or "flexible response" rather than assured destruction?

  **Follow-up:** *You will likely argue that maintaining the posture corrupts the moral character of the state even if the trigger is never pulled. Does this imply that moral disarmament is required even if it temporarily increases the risk of conventional aggression from adversarial powers?*

  ### 5. The Definition of "Innocence" in Total War
  **Question:** Critics of Anscombe often argue that in a "total war" economy, the distinction between combatant and non-combatant blurs; civilians working in munitions factories or sustaining the logistics of war contribute directly to the killing capacity. How do you defend the classification of these civilians as "innocent" in the technical just-war sense, given their causal contribution to the war effort?

  **Follow-up:** *I suspect you will maintain that causal contribution is not the same as direct agency in killing. But where exactly do you draw the line? Does your definition of innocence protect only those physically removed from the war, or does it extend to the political citizenry that sustains the regime?*

  ### 6. Last Resort and the Potsdam Declaration
  **Question:** Some historical revisionists argue that the bombings were unnecessary because Japan was already seeking surrender terms, specifically regarding the Emperor's status. If a viable diplomatic off-ramp existed, does that change the moral quality of the act from "murder" to "negligent homicide," or is the intentional targeting of innocents wrong even if it were the *only* way to end the war?

  **Follow-up:** *If you argue it is wrong even if it were the only way, you are asserting a constraint that overrides necessity. How do you explain this constraint to policymakers who view their primary moral duty as the protection of their own citizens from further harm?*

  ### 7. Moral Luck and Outcome Independence
  **Question:** Anscombe's judgment relies heavily on the intention and the act itself, rather than the outcome. If the atomic bombs had been duds, or if they had destroyed only military targets with zero civilian casualties due to a shift in wind patterns, would the moral evaluation of Truman's decision change, or is the *attempt* to target civilians the irredeemable wrong?

  **Follow-up:** *If you argue the attempt is the wrong regardless of the body count, does this suggest that our contemporary focus on "collateral damage ratios" is morally misguided? Should we be judging the intention of the strike rather than the efficiency of the munition?*

  ### 8. Institutional Complicity and Honorary Degrees
  **Question:** Returning to the context of my own work: Universities often award honorary degrees to heads of state as a gesture of diplomatic goodwill or recognition of leadership. If Anscombe is right that certain acts of statecraft constitute fundamental moral crimes, does the university have a retrospective duty to revoke such honors, or does the passage of time and the changing nature of the institution sever that link of complicity?

  **Follow-up:** *I anticipate you will argue that truth-telling is a permanent duty. But if revoking the degree is merely symbolic and cannot undo the past, is there a risk that such actions serve more to validate the current community's virtue than to achieve justice for the victims?*

  ### 9. Autonomous Weapons and Anscombe's Legacy
  **Question:** Finally, how does Anscombe's framework apply to emerging autonomous weapons systems? If an AI selects a target based on algorithmic probability rather than human intention, can the killing of innocents still be classified as "murder" in the Anscombean sense, or does the removal of human intentionality create a new moral category of liability?

  **Follow-up:** *If you argue that the programmer or commander retains the intention, does this mean that distancing oneself from the kill chain via technology offers no moral shelter? How does this impact the development of ethical AI in defense contexts?*
