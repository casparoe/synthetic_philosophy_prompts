  ### Tips for Defending This in Class
  1.  **If the CS Teacher challenges you on the Soundness point:** You can say, *"I noticed Malik wrote that soundness is a weaker assumption than consistency. Since a sound system must be consistent, but a consistent system isn't necessarily sound, assuming soundness is actually a higher bar to clear. I felt that was a significant enough logical slip to deduct points there, even though the rest of the Penrose summary was good."* (This will make you look very sharp).
  2.  **If the English Teacher challenges you on the Gödel point:** You can say, *"Malik wrote that Gödel agreed the mind isn't a machine. From what we read, Gödel said it's either that OR math is unsolvable. I wanted to reward the accuracy of the theorem itself but keep the grade honest on the biographical claim."*
  3.  **If Malik challenges you:** Be nice! Say, *"Honestly, the Putnam objection part was the best paragraph I read. The grade is mostly about that one logic mix-up on soundness, which is really easy to confuse."*

  Good luck tomorrow! You've got the technical backup to hold your ground.
