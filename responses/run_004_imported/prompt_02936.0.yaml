  ok random question from econ class - we covered the centipede game (pot of cash keeps growing as long as both players pass, but either one can grab it and end things early), and the teacher said if its common knowledge that both players are rational, game theory says player 1 should just grab the money on move 1, even tho theyd both end up way richer if they kept passing a while longer. that feels so backwards, like shouldnt everyone knowing everyone's rational make things BETTER not worse?? i looked it up and apparently aumann actually has a real proof of this from the 90s, but binmore thinks the argument kind of falls apart. can you give me the gut-level intuition for why common knowledge of rationality is supposed to force backward induction here, and what binmore's actual problem with it is? not rlly looking for the full formal proof, just want to actually get why this is so counterintuitive
