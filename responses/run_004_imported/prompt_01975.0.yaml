      *   *Best Angle:* **The Fragility of Constraints.** A "Safe" pact relies on the constraints holding. If the AI finds a way to optimize *around* the constraint while technically adhering to it (Goodhart's Law), the "Safe" pact becomes a trap. The cynical negotiator knows that *paper guarantees* don't stop *capability.*

