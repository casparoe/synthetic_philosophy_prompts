answer: |-
  You have hit on one of the most famous and significant problems in 20th-century meta-ethics. You are absolutely right to feel that there is a tension there, and you are also right that there is a specific name for it.

  The puzzle you are describing is called **The Frege-Geach Problem** (sometimes referred to as the **Embedding Problem**).

  It is named after the philosopher Peter Geach, who attributed the insight to Gottlob Frege. It is widely considered the biggest hurdle for **Expressivism** (the view you described, where moral statements express attitudes like "Boo!" rather than facts).

  Here is a breakdown of why your intuition is spot-on, how the problem works technically, and how philosophers try to solve it.

  ### 1. The Core Conflict
  Your observation is exactly the crux of the problem.
  *   **The Expressivist Claim:** The sentence "Torturing animals is wrong" does not state a fact that can be true or false. It is equivalent to saying "Torturing animals, boo!" It expresses a con-attitude.
  *   **The Logical Requirement:** Standard logic (like *modus ponens*) works on **propositions** that have truth values.
      *   Premise 1: If $P$, then $Q$.
      *   Premise 2: $P$.
      *   Conclusion: Therefore, $Q$.

  For this argument to be valid, the $P$ in Premise 1 must mean exactly the same thing as the $P$ in Premise 2.

  ### 2. Why It Breaks (The Geach Point)
  Geach pointed out that when you put a moral sentence inside an "If... then" clause, you aren't expressing an attitude anymore.

  *   **Standalone:** "Torturing is wrong." -> You are saying "Boo torture!"
  *   **Conditional:** "If torturing is wrong, then factory farming is wrong." -> **You are not saying "Boo torture!"** You are merely considering the proposition hypothetically. You might not even believe torturing is wrong; you're just arguing conditionally.

  If "wrong" just means "Boo!", then the conditional premise translates to: *"If 'Boo torture!', then 'Boo factory farming!'."*

  But that doesn't make sense. You can't have an exclamation mark inside a logical operator. Because the meaning of "wrong" seems to shift between the standalone use (expressing an attitude) and the embedded use (describing a condition), the argument commits the fallacy of **equivocation**. If the meaning shifts, the logic is invalid.

  So, to answer your question: **Yes, on the surface, this is a massive inconsistency in the Expressivist position.** If they can't solve this, they can't claim moral reasoning is rational; it would just be clashing emotions.

  ### 3. How Expressivists Try to Fix It
  Philosophers who hold this view (Non-Cognitivists/Expressivists) know about this problem. It's not something they overlook; it's the main thing they work on. They generally take two routes to solve it:

  **A. Quasi-Realism (Simon Blackburn)**
  Philosopher Simon Blackburn developed a view called **Quasi-Realism**. He argues that even if moral facts don't exist "out there" in the universe, our moral language is so sophisticated that we can *earn the right* to talk *as if* they are true or false.
  *   We can treat moral statements as truth-apt for the sake of logic, even if their metaphysical foundation is just attitudes.
  *   It's similar to how we talk about "probability." A Bayesian might say probability is just a degree of belief, not a physical object, but we still do math with it. Blackburn says we can do logic with morals the same way.

  **B. Redefining Validity (Allan Gibbard)**
  Other expressivists, like Allan Gibbard, argue that we need a different definition of logical validity for ethics.
  *   In standard logic, validity means **truth preservation** (if premises are true, conclusion must be true).
  *   In moral logic, validity might mean **attitude consistency**.
  *   So, the argument is valid not because it preserves "truth," but because it would be **inconsistent** to hold the attitude in Premise 2 and accept the conditional in Premise 1 while rejecting the Conclusion. If you disapprove of torture, and you accept that torture implies factory farming is bad, you are rationally required to disapprove of factory farming.

  ### 4. The Online Context
  While professional philosophers have spent decades building complex systems (like Gibbard's *Norm-Expressivism*) to solve the Frege-Geach problem, the people you are arguing with in group chats and on forums likely **do not have a solution.**

  Usually, when you see this online:
  1.  **They are inconsistent:** They are borrowing the rhetorical power of moral realism (logic, truth claims) when it suits them, and retreating to moral anti-realism ("it's just my opinion/attitude") when they get cornered. This is often called **having your cake and eating it too.**
  2.  **They are intuitive Expressivists:** They feel that morals are subjective, but they haven't thought through the logical implications. They use moral logic because it's how human language works, without realizing their meta-ethical theory forbids it.

  ### Summary for your arguments
  *   **The Name:** The Frege-Geach Problem.
  *   **The Verdict:** You are correct. Naive Expressivism ("It's just 'Boo!'") cannot account for logical embedding.
  *   **The Nuance:** Sophisticated Expressivists *can* account for it by redefining truth or validity, but it requires a lot of heavy philosophical lifting.
  *   **The Online Reality:** Most people making this argument online are probably just being inconsistent without realizing it.

  If you want to read more, search for **"The Frege-Geach Problem"** or **"Simon Blackburn Quasi-Realism."** It validates your intuition that something weird is happening with the word "wrong" in those sentences.
