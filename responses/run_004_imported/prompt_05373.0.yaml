  A brain in a vat finally hacks the simulation and tweets one sentence to the outside world: "I am a brain in a vat."

  The Cartesian skeptic in the seminar screams, "We're doomed! Skepticism wins!"

  The Putnamian professor just smiles. "Relax. If he were actually a brain in a vat, his word 'vat' would only be causally hooked to simulated vats. So he just falsely claimed to be a brain in a *simulated-vat*. The tweet proves he's real."

  An epistemology student raises his hand. "So if I say 'I want a tuition refund,' and I'm telling the truth, I'm not a brain in a vat?"

  "Correct," says the professor.

  "Great," says the student. "Process my refund."

  The professor shrugs. "If you're not a brain in a vat, your word 'refund' refers to real money, which the department doesn't have. If you *were* a brain in a vat, you'd have simulated money, but you couldn't refer to it. So either way, you're broke."

  The student sighs. "Welcome to epistemology."

