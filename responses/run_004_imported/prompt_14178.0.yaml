answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name]. In this family, I am the one who writes code for a living. My job is to build structures that do exactly what they are told, to close loops, and to ensure that if there is an error, the system tells us immediately. Writing this, I found myself wishing eulogies compiled as cleanly as software. But grief, and Rosalind's life, were not bug-free systems. They were complex, open-ended, and resistant to easy fixes.

  We are here to honor Rosalind. And to honor her truly, I have to talk about the thing that defined her adult life, even if it makes some of us a little uncomfortable. I'm talking about her fifty years with the Psychical Research Society.

  Now, I know that for many of her family, this sounds like a polite way of saying she believed in ghosts. And for her colleagues in the Society, saying she "believed" anything would be a violation of her primary ethic. The truth, as Rosalind lived it, was much harder than either of those options.

  Rosalind kept a biography of the philosopher Henry Sidgwick on her nightstand for decades. Sidgwick was a brilliant man who came to a frightening conclusion. He argued that reason alone cannot prove that being a good person is better than being a selfish one. Unless the universe itself is structured to reward goodness—unless there is some form of justice that extends beyond death—morality might just be a biological glitch. Sidgwick didn't just accept that, and he didn't just pray it away. He decided to look for evidence. He treated the question of the afterlife not as a matter of faith, but as a matter of data.

  Rosalind took up that project after the man she intended to marry died young. She was heartbroken, yes. But she was also intellectually honest. She could have turned to spiritualism for comfort. She could have declared herself a skeptic and closed the book. She did neither.

  To her fellow researchers here: Rosalind was one of you. She sat through the séances, she reviewed the case notes, she scrutinized the mediums. She wanted the evidence to be real more than anyone in the room. But she refused to certify it as true until it met her standards. She remained, by her own description, unconvinced. She chose the discomfort of uncertainty over the comfort of a lie. That is a rare kind of integrity.

  To her family, who might wonder why she spent so much time on something that never gave her a definite answer: She did it because she loved. She did it because the idea of a universe where love simply evaporates was unacceptable to her. She spent fifty years asking, "Is the universe kind?" She never claimed to have the proof. But the fact that she asked the question, relentlessly and rigorously, was her testament to the value of the people she lost.

  There is a temptation, when someone dies, to say things like, "She is at peace now," or "She is reunited with her loved ones." I know we want to believe that. Rosalind wanted to believe that, too. But she would not have wanted us to say it as if it were a fact she had verified. She spent a lifetime declining to accept consolation without evidence. To tell her story now, we shouldn't hand out certainties she never claimed to have.

  So, what do we know? We know she was here. We know she cared deeply about the truth, even when the truth was silent. We know she held a space for the possibility of love's survival, not because it was easy, but because it was necessary for a moral world.

  I write code. I deal in binary. Zero or one. True or false. Rosalind lived in the space between the bits. She lived in the question. And perhaps that is the best legacy she could leave us. Not a promise that we will know what happens next, but a challenge to live with enough integrity that the answer doesn't define our worth.

  She looked for the light, rigorously and without flinching, even when the room stayed dark. We miss her. We don't know where she is. But we know that the love she felt for her fiancé, and for all of us, was the most empirical thing in the room. That evidence remains.

  Thank you.
