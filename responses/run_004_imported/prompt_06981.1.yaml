answer: |-
  1. **The Ontological Claim**
  Your book defends the strongest reading of Quine's indeterminacy: that there is *no fact of the matter* regarding translation, not even for an omniscient physicist. Most listeners will accept that translation is difficult, but they assume there is a "correct" meaning hidden somewhere in the speaker's mind. If there is no fact of the matter, what exactly is missing from the universe that would be required to make a translation uniquely true?

  *Follow-up:* If she answers that "meanings" are not entities that exist in the universe, ask: "If meanings don't exist, are we essentially error theorists about our own conversations? When I think I understand you, am I under an illusion?"

  2. **Indeterminacy vs. Underdetermination**
  In the philosophy of science, we accept that evidence underdetermines theory; multiple physical models can fit the same data. But we usually assume one model is *actually* true, even if we can't prove it. You argue translation is different in *kind*, not just degree. Why does the "no fact of the matter" clause apply to meaning but not to, say, the state of the universe before the Big Bang?

  *Follow-up:* If she argues that physics deals with observable structures while meaning deals with intensional content, ask: "But doesn't Quine's naturalism demand we treat linguistics as continuous with physics? Why does the 'no fact' verdict stop at the border of the linguist's notebook?"

  3. **The Chomsky Objection**
  Noam Chomsky famously objected that Quine's thesis only holds if we artificially restrict evidence to external behavior and sensory stimulation. If we allow internal mental structures—like Universal Grammar or specific neural configurations—as evidence, doesn't the indeterminacy vanish? Why should the "black box" of the mind remain closed to the linguist?

  *Follow-up:* If she maintains that internal states are just more physical facts subject to the same indeterminacy, ask: "But if a specific neural state causally necessitates a specific utterance, haven't you found the physical fact that fixes the meaning?"

  4. **Neuroscience and Physicalism**
  Quine wrote before modern neuroimaging. Today, we can correlate specific semantic tasks with specific brain activations. If we had a complete map of a speaker's connectome and could simulate their neural response to every possible stimulus, would you still maintain there is no fact of the matter about what they mean by 'gavagai'?

  *Follow-up:* If she says neural data is still open to multiple interpretations, ask: "At what point does mapping the causal mechanism of speech cease to be interpretation and become explanation?"

  5. **Large Language Models**
  We now have Large Language Models that translate between languages fluently without sharing human biology, sensory stimulation, or a "form of life." They operate purely on statistical syntax. Do these models support your view by showing translation requires no shared meaning, or do they undermine it by showing that fluency can exist without the behavioral constraints Quine thought were central?

  *Follow-up:* If she argues LLMs prove syntax is insufficient for semantics, ask: "If humans are also just biological machines processing inputs to outputs, what is the relevant difference that grants us 'meaning' while denying it to the model?"

  6. **The Normativity of Meaning**
  Critics like Kripke have argued that meaning is normative; there is a right and wrong way to use a word. If translation is indeterminate, it seems there is no fact about whether a speaker is misusing a term or just using a different manual. How do you account for the intuition that a speaker can be *mistaken* about their own meaning?

  *Follow-up:* If she reduces normativity to social pressure or correction, ask: "Doesn't that reduce truth to consensus? If the whole community shifts manuals, does the truth value of their past statements change?"

  7. **First-Person Authority**
  I feel I know what I mean when I speak. Your thesis suggests that even I might not have a factually determined meaning for my own words, only a disposition to use them. Does indeterminacy apply to the first-person case? Am I a stranger to my own intentions?

  *Follow-up:* If she says first-person authority is a pragmatic presumption rather than a metaphysical fact, ask: "If I can be wrong about what I mean without realizing it, what work is the concept of 'meaning' actually doing for me?"

  8. **The Principle of Charity**
  Quine relies on the Principle of Charity to get radical translation off the ground—we must assume the speaker is largely rational and truthful. Is Charity a discovery about how humans *are*, or is it a methodological choice we impose? If it's a choice, doesn't that make the resulting translation manual subjective?

  *Follow-up:* If she argues Charity is necessary for any interpretation to be possible, ask: "Doesn't that imply we can only ever find the meanings we are willing to project onto others?"

  9. **Eliminativism vs. Pragmatism**
  If meaning is indeterminate, should we be eliminativists about semantics? Should we stop talking about "what someone meant" and only talk about "how they behave," much like we stopped talking about phlogiston? Or is "meaning" a concept we should keep for purely pragmatic reasons?

  *Follow-up:* If she argues we should keep the concept for its utility, ask: "Is there a danger in using a concept we admit is metaphysically empty, especially in fields like law or ethics where intent matters?"

  10. **Falsifiability**
  Finally, a question on the status of the thesis itself. If there is no fact of the matter about meaning, what could count as evidence *against* the indeterminacy of translation? Is there any conceivable discovery in linguistics, neuroscience, or physics that would force you to abandon this position?

  *Follow-up:* If she suggests the thesis is itself a pragmatic framework rather than an empirical claim, ask: "If the thesis isn't empirically falsifiable, in what sense is it a scientific or philosophical truth rather than just a recommendation for how to do linguistics?"
