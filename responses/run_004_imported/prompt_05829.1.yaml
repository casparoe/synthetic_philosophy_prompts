answer: |-
  **DRAFT REPORT OF THE COMMITTEE ON POLITICAL ACTION**
  **Ontario County Convention of Colored Citizens**
  *Canandaigua, this 14th day of May, 1852*

  **To the Delegates and Citizens Assembled:**

  We stand at a crossing of the roads. Behind us lies the path of Moral Suasion, walked these twenty years with a purity of conscience that has kept our hands clean of the Republic's sins. Before us lies the rougher track of Political Action, which demands we soil our hands in the ballot box to cleanse the nation. The Committee, having deliberated on the recent schism among our friends in Boston and Rochester, submits the following Preamble and Resolutions for the consideration of this Convention.

  **PREAMBLE**

  Whereas, the Fugitive Slave Law of 1850 has struck a blow against the colored freeman that echoes in every cabin and church in the North; and

  Whereas, our esteemed brethren of the Garrisonian persuasion argue that the United States Constitution is, in its very frame, a "Covenant with Death and an Agreement with Hell," commanding the abolitionist to sever all ties with a Union that protects the chattel bond; and

  Whereas, we acknowledge the holy horror that motivates such a stance, for indeed, to vote under a government that hunts men is a burden heavy upon the soul;

  Yet, be it known that we cannot abandon the field to the slaveholder. To refuse the ballot is to surrender the weapon of citizenship to the very men who would forge our chains. We have examined the Instrument of Government not through the lens of the slaveholder's corruption, but through the plain reading of its text and the intent of its Preamble.

  We find that the word "Slave" appears nowhere in the Constitution. The term "Slavery" is absent. The document speaks only of "Persons held to Service or Labor" and "other Persons." These are not acknowledgments of property in man, but euphemisms forced upon the framers by a shame they could not fully voice.

  Furthermore, the Constitution creates a National Government charged to "secure the Blessings of Liberty to ourselves and our Posterity." It grants no power to establish slavery; that power is claimed solely by the several States, in defiance of the natural law. The Federal Government, if rightly administered by men who respect the Oath of Office, possesses the authority to suppress insurrections of the master against the slave, but holds no authority to bind the free.

  To declare the Constitution pro-slavery is to accept the slaveholder's interpretation of our own rights. It is to concede that the Law of the Land is the Law of the Lash. We reject this concession.

  **RESOLUTIONS**

  **Resolved,** That this Convention hereby rejects the doctrine of Disunion and Non-Voting as a strategy of despair. While we honor the piety of those who refuse to touch a corrupt vessel, we believe it is our duty to seize the helm.

  **Resolved,** That the Constitution, properly construed, is a Glorious Liberty Document. It contains within its clauses the seeds of slavery's destruction, provided we have the courage to plant them. The federal government is forbidden from giving legal sanction to human property; therefore, every officer who swears to uphold the Constitution is sworn to oppose slavery.

  **Resolved,** That we will no longer ask for permission to be free. We will organize as a political body. We will endorse candidates who pledge to use the powers of the Federal Government to abolish slavery in the District of Columbia, to admit no new slave states, and to repeal the Fugitive Slave Law as unconstitutional.

  **Resolved,** That we acknowledge the risk. We know that entering the political arena invites compromise. We know that the Liberty Party and the Free Soilers have often bartered our humanity for votes. But we cannot remain in the wilderness forever. If the Union is a house divided, we shall not burn it down; we shall enter it and cast out the thieves.

  **Resolved,** That a copy of these proceedings be sent to Mr. Frederick Douglass in Rochester, and to Mr. William Lloyd Garrison in Boston, that they may know where Ontario County stands: Not in the shadow of disunion, but in the light of a contested citizenship.

  ***

  *[Handwritten note in margin, in Aaron's hand:]*
  *Garrison will call this apostasy. He will say we are legitimizing the kidnapper's court. He is not wrong about the court. But if we leave the room, who is left to speak for the prisoner? I cannot sign my name to a document that tells my brother he has no country. Even if that country hates him. Especially then.*
