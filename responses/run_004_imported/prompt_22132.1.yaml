answer: |-
  You have stumbled onto the absolute core of Hobbes's entire philosophical project. That "rabbit hole" you went down regarding Wallis is actually the key to unlocking why *Leviathan* is written the way it is.

  To answer your questions directly: **Yes, he meant it literally**, and **yes, he is claiming reasoning is literally calculation.**

  Here is the breakdown of the "bigger argument" you're sensing.

  ### 1. Why is Geometry the "Only Science"?
  To understand this, you have to ditch the modern definition of "science." Today, we think of science as empirical observation (looking at the world, running experiments). For Hobbes (and the ancients), *scientia* meant **certain, demonstrable knowledge derived from first principles.**

  Hobbes argues that we can only have absolute certainty about things **we create ourselves.**

  *   **In Geometry:** We define what a "line" and a "circle" are. We stipulate the rules. Because we invented the definitions, we know everything there is to know about them. There is no hidden variable. If you reason correctly from the definitions, the conclusion is indisputable.
  *   **In Natural Philosophy (Physics):** We did not create the stars, the tides, or the human body. We can only observe them from the outside. Our senses can be deceived. We can guess at causes, but we can never be 100% certain we are right. Hobbes calls this "prudence" or "conjecture," not strict "science."
  *   **In Politics (before Hobbes):** People argue endlessly about "justice," "liberty," and "rights" because they haven't agreed on definitions. It's a mess of passions and opinions.

  So, when Hobbes says geometry is the only science God has bestowed on mankind, he is saying it is the **only domain where human beings have achieved perfect certainty.**

  **The Kicker:** Hobbes's goal in *Leviathan* is to **make politics into a geometry.** He wants to do for the Commonwealth what Euclid did for triangles. He wants to define "Man," "Right," and "Contract" so precisely that the conclusion (that we need an absolute Sovereign) becomes as undeniable as 2+2=4.

  ### 2. What is "Reckoning"?
  This is where Hobbes gets wild. He isn't using "reckoning" as a metaphor for "thinking hard." He is a materialist and a nominalist; he believes thoughts are literally motions in the brain and words are markers we use to track those motions.

  In **Chapter 5** (the chapter right after the one you quoted), he doubles down on this explicitly:

  > "For REASON... is nothing but RECKONING (that is, Adding and Subtracting) of the Consequences of general names agreed upon for the marking and signifying of our thoughts."

  He views logic as algebra.
  *   **Definitions** are your units (like setting $x = 1$).
  *   **Reasoning** is the math you do with those units.

  If you define "Man" as a "rational animal," and you define "Animal" as a "living body," Hobbes thinks you are essentially adding concepts together.
  *   *Body + Animated + Rational = Man.*

  If your definitions are fuzzy (like the bird in the lime-twigs), your calculation fails. You end up with nonsense. This is why he obsesses over definitions in the early chapters of *Leviathan*. He is setting up the axioms for his political equation.

  ### 3. The Irony of the Wallis Feud
  Now, bring it back to your friend's comment about John Wallis. This context makes Hobbes's stubbornness make perfect sense.

  Hobbes became convinced that his **method** (the geometric method of reasoning from definitions) was a universal master key. He believed that if you just defined your terms correctly and reckoned properly, you could solve *any* problem.

  *   **In Politics:** He was arguably right. By rigorously defining the "State of Nature" and the "Social Contract," he created a coherent, logical system that still dominates political theory.
  *   **In Mathematics:** He was wrong.

  When Hobbes tried to square the circle, he was trying to apply his *philosophical* method to *hard quantitative* problems. He thought that if he just reasoned through the definitions of "circle" and "square" long enough, he could force the geometry to yield.

  John Wallis and the mathematicians of the Oxford Royal Society were like, "Thomas, the numbers don't work. You can't logic your way out of a mathematical proof."

  But Hobbes couldn't admit it. To admit he was wrong about the circle would be to admit that his "universal method of reckoning" had limits. If geometry wasn't perfectly solvable by his method, then maybe his political geometry wasn't certain either. His ego and his entire philosophical system were tied up in that circle.

  ### Summary
  The passage you found is the mission statement for *Leviathan*.

  1.  **Truth is linguistic:** It comes from ordering names (words) correctly.
  2.  **Geometry is the gold standard:** It's the only place we do this perfectly.
  3.  **Reasoning is calculation:** We must treat logic like math (reckoning).
  4.  **The Goal:** Apply the geometric method to human society to end civil war.

  He succeeded in changing political philosophy forever, but he died absolutely convinced he had squared the circle, still fighting with Wallis from the grave. It's one of the greatest "main character" moments in the history of philosophy.
