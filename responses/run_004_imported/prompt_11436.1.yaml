      *   User's worry: "But which counterpart?"
      *   Lewis: "Depends on context."
      *   User's worry: "So truth is subjective?"
      *   Lewis: "No, context is objective features of the conversation, similarity is objective features of the worlds. The *selection* is contextual."
      *   Verdict: It relocates the problem to the semantics of context, which Lewis is happy to do.

