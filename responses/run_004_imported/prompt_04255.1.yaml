      *   **Pedagogical Pivot:** How to save the lesson plan? Instead of "Aquinas = Mariana," frame it as "Aquinas plants the seed, but Mariana waters it with gasoline." Show the *tension* in Aquinas. This makes for a better class discussion than a simplified soundbite.

