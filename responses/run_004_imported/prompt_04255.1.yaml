      *   **Address Question 2 (Passages):** Since the answer to Q1 is "No," I shouldn't just provide passages that confirm a false reading. Instead, I should provide passages that show the *nuance* (the "flattening" the TA noticed). I need to show where Aquinas pulls back.
      *   **Key Textual Evidence:**
          1.  *De Regimine Principum* I.6: The "public authority" preference.
          2.  *Summa Theologiae* II-II, Q. 42, Art. 2: Sedition vs. Tyranny (tyranny is seditious, but does that authorize private killing?).
