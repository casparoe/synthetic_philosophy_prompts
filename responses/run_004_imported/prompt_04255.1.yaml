answer: |-
  Your TA has a good instinct, and I would strongly advise against locking in those slides as they stand. While your reading makes for a compelling narrative arc in a lecture, the claim that Aquinas argues "any ordinary citizen is free to kill [a tyrant] without waiting around" is not a fair summary of his *considered* position. In fact, it inverts his primary concern.

  The "flattening" your TA noticed is likely the distinction between **descriptive historical examples** and **prescriptive political theory**, as well as the crucial medieval distinction between **public authority** and **private presumption**.

  Here is the breakdown of why the "90% to Mariana" claim is risky, followed by the textual evidence you need to adjust the lesson (which, frankly, makes for a richer discussion than the soundbite).

  ### 1. The Core Problem: Private vs. Public Authority
  Aquinas's moral theology is built on the premise that killing is licit only when performed by those holding **public authority** (like a judge or a soldier in a just war). Private killing is murder.

  In *De Regimine Principum* (On Kingship) I.6, Aquinas does discuss removing tyrants. However, he explicitly argues *against* private individuals taking this upon themselves if there is any possibility of public recourse. He writes:

  > "It would be dangerous for the multitude and for their rulers if private individuals should attempt to kill tyrants... For often the wickedness of the succeeding tyrant is greater than that of the first."

  He then outlines the proper order of operations:
  1.  **Public Authority:** If the community has the right to elect the king, they have the right to depose him.
  2.  **Superior Authority:** If the king is appointed by a superior (e.g., a vassal to an emperor, or a Christian king to the Pope), appeal to them.
  3.  **Divine Intervention:** If no human remedy exists, recourse must be had to God (via prayer/repentance), not private violence.

  He *mentions* Ehud and Eglon (Judges 3) as examples of those who were praised, but he treats them as divinely inspired exceptions, not as a precedent for a general right of private citizenry. To say Aquinas grants a license to "any ordinary citizen" ignores his explicit warning that such presumption often leads to greater tyranny.

  ### 2. The Mariana Contrast
  Juan de Mariana (*De Rege*, 1599) is indeed radical, but precisely because he moves *beyond* Aquinas's caution. Mariana argues that a tyrant (especially a usurper) becomes a public enemy (*hostis publicus*) whom *anyone* may kill. This is the "Jesuitical doctrine of tyrannicide" that got the Society of Jesus in trouble across Europe.

  If you teach Aquinas as having already established this, you erase the actual intellectual history of the 16th century. The Monarchomachs and Mariana had to work *against* the Thomistic preference for order and hierarchy to arrive at their radical conclusions. Aquinas opens the door by saying tyranny is illegitimate; Mariana kicks the door down by saying private individuals can enforce that illegitimacy.

  ### 3. Suggested Passages for Nuance
  Instead of hunting for passages to prove Aquinas agrees with Mariana, I recommend putting the tension on the board. It shows students how political philosophy evolves. Here are three passages that complicate the "private citizen" narrative:

  **A. *De Regimine Principum*, Book I, Chapter 6 (The Cautionary Clause)**
  > "Yet it must be warned that if the excess of tyranny is unbearable, it would be better to tolerate it for a time than to act against it and fall into greater dangers... For often those who attempt to kill tyrants achieve nothing but their own death, and the tyrant becomes more savage."
  *   **Teaching Point:** Aquinas prioritizes the *stability of the common good* over the *removal of the tyrant*. If the cure is worse than the disease, endure the disease. Mariana disagrees.

  **B. *Summa Theologiae*, II-II, Q. 64, Art. 3 (On Killing)**
  > "It is not lawful for a man to kill a sinner... except by the authority of the public power... Therefore, as Augustine says, he who kills a man without authority is guilty of murder."
  *   **Teaching Point:** This is Aquinas's general moral framework. Unless the tyrant has been formally declared a public enemy by a superior authority, killing him remains "murder" in Aquinas's system, regardless of the tyrant's moral status.

  **C. *Summa Theologiae*, II-II, Q. 42, Art. 2 (On Sedition)**
  > "The tyrant... fosters sedition... so that he may dominate the multitude more securely. Therefore, there is no sedition in disturbing a government of this kind."
  *   **Teaching Point:** This is the text you are likely using. Note that he says disturbing the government is not *sedition*. He does **not** say it is *licit for a private individual to execute the ruler*. There is a gap between "this is not sedition" and "you have a license to kill."

  ### Pedagogical Pivot
  You can keep the energy of the lecture without the inaccuracy. Instead of "Aquinas pre-loaded Mariana," try:

  > "Aquinas gives us the **logic** of tyrannicide (tyranny is not true rule), but he withholds the **mechanism** (private violence). He creates the grenade but refuses to pull the pin. It takes the early moderns, facing the wars of religion and absolutism, to decide that the pin must be pulled by anyone willing to grab it."

  This validates your TA's concern, respects the text, and actually makes the transition to the Early Modern unit more necessary and interesting. If Aquinas already solved it, why do we need Mariana? If Aquinas left it unresolved, Mariana becomes a radical solution to a medieval problem.
