  2.  **Evaluate the Claim (Aquinas on Tyrannicide):**
      *   *Source Material:* The primary text cited is usually *De Regimine Principum* (On Kingship), specifically Book I, Chapter 6. There is also the *Summa Theologiae* (II-II, Q. 42, on Sedition; Q. 64, on Killing; Q. 104, on Obedience).
      *   *The "Standard" Reading:* In *De Regimine Principum* I.6, Aquinas discusses what to do about a tyrant. He argues that it is not sedition to depose a tyrant. He mentions that sometimes private individuals have taken it upon themselves to kill tyrants (citing Ehud and Eglon).
      *   *The Nuance/Correction:* However, Aquinas is *extremely* cautious. He does *not* explicitly endorse a universal right of private tyrannicide.
          *   In *De Regimine Principum*, he says: "To kill a tyrant has not only been deemed praiseworthy... but worthy of earthly reward." *However*, he immediately qualifies this. He warns against the risks (the tyrant might get worse, or the attempt might fail leading to harsher repression).
          *   Crucially, in the *Summa Theologiae* (II-II, Q. 42, Art. 2), he defines sedition as opposing the unity of the multitude. A tyrant opposes this unity. But does that mean *anyone* can kill him?
          *   In *De Regimine Principum* I.6, he concludes that the remedy against tyranny should preferably come from *public authority*, not private presumption. If the community has the right to elect the king, they can depose him. If they appeal to a superior (like the Pope or Emperor), they should do that.
          *   The "private citizen" aspect is the sticking point. Aquinas cites biblical examples (Ehud), but he doesn't formulate a general *legal/moral right* for any private individual to act unilaterally without risking sin or disorder. He is much more concerned with order and the common good than individual heroic action.
      *   *Comparison with Mariana:* Juan de Mariana (*De Rege*, 1599) is much more explicit. Mariana argues that a tyrant (especially a usurper) may be killed by *anyone*, and even by private individuals if no public mechanism exists. This is the "Jesuitical" doctrine that got people in trouble (e.g., Henry IV's assassination). Aquinas is far more reserved.
      *   *Verdict:* The TA is right. The professor's summary ("any ordinary citizen is free to kill him without waiting around") is a significant overstatement and arguably misleading regarding Aquinas's *considered* position. It flattens the distinction between *describing* historical acts of tyrannicide and *prescribing* them as a general right. It also ignores Aquinas's preference for public authority over private action.

