      *   **Point 1: The Betting Interpretation.** Standard DBT assumes $P(A)$ is the price you buy *and* sell at. IP assumes $\underline{P}(A)$ is buy price, $\overline{P}(A)$ is sell price.
      *   **Point 2: The Gap protects against the Book.** The standard Dutch Book requires trading at $p$ and $1-p$. IP agent trades at $\underline{P}$ and $\overline{P}$. If $\underline{P} + \overline{P}(\neg A) < 1$ (which is typical), the bookie can't lock in the loss because the agent won't take the bet at the required price.
