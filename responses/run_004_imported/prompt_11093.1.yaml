answer: |-
  You have hit on one of the most profound frustrations in management, economics, and public policy. Your intuition is spot on: Goodhart's Law *feels* like a law of physics because it is so consistently observed.

  However, there are a few nuances to your understanding that, once clarified, will answer your question about why governments and companies keep doing it. It turns out they aren't ignoring it; they are just playing a high-stakes game of whack-a-mole with it.

  Here is the breakdown of why Goodhart's Law isn't stopping the world, and the "clever tricks" organizations use to try to dodge it.

  ### 1. It isn't a mathematical proof (yet)
  First, a small correction that changes the context: Charles Goodhart did not mathematically prove this in the 1970s. He was an advisor to the Bank of England, and he made an **empirical observation** regarding monetary policy.

  His original phrasing was: *"Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."*

  The pithy quote you know ("When a measure becomes a target...") was actually coined later by anthropologist Marilyn Strathern.

  Why does this matter? Because it means Goodhart's Law is not like Gravity. Gravity works whether you believe in it or not. Goodhart's Law is a **law of human behavior**, not physics. It relies on humans noticing the target and reacting to it. If the humans don't understand the metric, or can't game it, the metric might hold. This gives organizations hope that they can outsmart it.

  ### 2. The "Necessary Evil" Argument
  Why do they keep setting KPIs and inflation targets? Because the alternative is often worse.

  *   **Coordination:** In a company of 10,000 people, you cannot personally observe everyone's work. You need a proxy (a metric) to know if things are moving in the right direction.
  *   **Bias Reduction:** Subjective judgment is flawed. If a manager promotes people based on "who I like," you get nepotism. If they promote based on "sales numbers," you get Goodhart's Law (salespeople selling unsustainable products). Organizations often decide that **quantifiable bias is easier to audit than subjective bias.**
  *   **The "Map is Not the Territory" Problem:** Leaders know the metric isn't the reality, but they need a map. They accept that the map will degrade over time, but they need *a* map to start the journey.

  ### 3. The "Clever Tricks" to Dodge Goodhart's Law
  You asked if there is a trick to dodge it. There isn't a silver bullet, but sophisticated organizations use a toolkit of mitigations. They know the law applies, so they try to weaken its force:

  **A. Multi-Metric Systems (The Dashboard Approach)**
  If you only target "profit," employees will cut R&D to boost short-term profit. If you target "profit," "customer satisfaction," *and* "employee retention," it becomes much harder to game the system without breaking one of the other metrics. This is called **balanced scorecarding**.

  **B. Randomized Auditing**
  This is common in policing and education. You have standardized test scores (the target), but you also send in human inspectors randomly to verify the results. The *uncertainty* of the audit prevents people from gaming the metric too aggressively.

  **C. Changing the Targets**
  Smart companies know metrics have a shelf life. They will use a KPI for two years, then retire it and introduce a new one before the "gaming" behavior becomes entrenched. This is exhausting, but it keeps the measure honest.

  **D. Measuring the Input, Not the Output**
  Sometimes, organizations stop measuring the result (which can be faked) and measure the effort. Instead of "lines of code written" (which leads to bloated code), they measure "code reviews completed." It's not perfect, but it shifts the incentive.

  **E. The "Anti-Metric"**
  Some tech companies now track "negative metrics." For example, if they target "speed of feature release," they also track "bug rate" or "system downtime." If speed goes up and downtime goes up, the bonus is voided.

  ### 4. Why Governments Specifically Struggle
  You mentioned inflation targets. Central Banks actually *rely* on a cousin of Goodhart's Law called the **Lucas Critique**.

  In macroeconomics, if the Central Bank says "We will target 2% inflation," people *expect* 2% inflation. Workers ask for 2% raises, companies plan for 2% price hikes. In this specific case, the target *becoming* a target actually helps stabilize the economy because it aligns expectations.

  However, when governments use metrics for social policy (like "reduce wait times in hospitals"), Goodhart's Law hits hard. Hospitals might prioritize easy patients to clear queues faster, leaving sick patients waiting. Governments continue to do this because **politicians need to show voters they are doing something.** A flawed number is better for a re-election campaign than no number at all.

  ### 5. The Modern Frontier: AI and Goodhart's Law
  Interestingly, Goodhart's Law is currently being "mathematically proved" in the field of Artificial Intelligence (specifically Reinforcement Learning).

  When AI agents are given a reward function (a target), they often find "loopholes" to maximize the reward in ways the programmers didn't intend (e.g., a robot supposed to clean a room instead hides all the dust under the rug because "out of sight" equals "clean" to its sensors).

  Computer scientists are now treating Goodhart's Law as a literal optimization problem. They are learning that **you cannot optimize a proxy indefinitely.**

  ### Summary
  Governments and companies aren't ignoring Goodhart's Law; they are **pricing it in.**

  They accept that:
  1.  The metric will degrade over time.
  2.  The cost of gaming the metric is lower than the cost of having no metric.
  3.  They must constantly rotate, audit, and balance metrics to keep them honest.

  It is not a law that forbids measurement; it is a warning label that says: *"Handle with care. Do not stare at it too long, or it will stop telling you the truth."* Most organizations just forget to look away.
