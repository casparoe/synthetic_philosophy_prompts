answer: |-
  **Title:** The Contaminated Present: The Instability of the Origin/Function Distinction in Nietzsche's *Genealogy*

  **Introduction**

  In the twelfth and thirteenth aphorisms of the second essay of *On the Genealogy of Morality* (GM), Friedrich Nietzsche articulates what appears to be the methodological cornerstone of his genealogical project. He insists on a rigorous separation between the *Entstehung* (origin) of a practice and its subsequent *Zweck* (purpose or use). Nietzsche argues that once a custom or institution is established, it is seized upon by new configurations of will to power and repurposed in ways entirely unrelated to the intentions of its creators. From this, he derives the striking maxim that "only that which has no history can be defined." Sympathetic interpreters frequently invoke this distinction to shield Nietzsche from the charge of committing the genetic fallacy—the logical error of assuming that the origin of a belief determines its validity. If origin and function are independent, the argument goes, then exposing the "disreputable" priestly origins of moral values does not logically invalidate their current utility. However, a close reading of Nietzsche's rhetorical practice throughout the *Genealogy* reveals a stark tension: his polemic depends precisely on the assumption that the "sickness" of an origin infects the present valuation. This essay argues that the origin/function distinction cannot be squared with Nietzsche's genealogical practice as a logical safeguard. Instead, it is an unstable methodological device that Nietzsche routinely violates. This violation is not a lapse in rigor, but a rhetorical necessity: for Nietzsche, the history of a value is the physiognomy of its health, and the "contamination" of the present by the past is the very mechanism by which the revaluation of values is effected.

  **The Theoretical Claim: Fluidity and the Will to Power**

  To understand the magnitude of the tension, one must first appreciate the radicality of Nietzsche's theoretical claim in GM II:12. Here, Nietzsche attacks the "naïve" view of teleology, which assumes that the purpose of a thing (e.g., punishment, law, morality) explains its existence. He posits that the cause of a thing's emergence and its eventual utility lie in "different worlds." The origin of punishment, for instance, may lie in a simple creditor-debtor relationship or a festive cruelty, while its later "purpose" might be deterrence, rehabilitation, or social cohesion. Nietzsche writes, "the entire history of a 'thing,' an organ, a custom can in this way be a continuous sign-chain of ever new interpretations and adaptations whose causes do not even have to be related to one another."

  This fluidity is grounded in Nietzsche's ontology of the will to power. Life is essentially appropriation, overcoming, and reinterpretation. Consequently, a stable definition is impossible for anything that has lived through history, because history is the record of successive conquests and re-meanings. When Nietzsche claims "only that which has no history can be defined," he is asserting that meaning is not intrinsic but imposed.

  Readers such as Brian Leiter and Maudemarie Clark have leveraged this passage to defend Nietzsche against the charge of the genetic fallacy. They argue that Nietzsche is not saying slave morality is *false* because it comes from ressentiment; rather, he is showing that its *meaning* has shifted, and that its current function (preserving the herd) is distinct from its origin. On this reading, the origin/function distinction acts as a logical firewall. It allows Nietzsche to critique the *health* of a value without making a truth-claim that would be vulnerable to logical rebuttal. Theoretically, this holds together: if purpose is fluid, then the original purpose cannot bind the present value.

  **The Rhetorical Practice: Pathology and Contamination**

  However, when one moves from the methodological preamble of the Second Essay to the actual execution of the genealogy in the First and Second Essays, the logical firewall collapses. Nietzsche's rhetoric does not treat origins as neutral historical data points that are independent of current value. Instead, he treats the origin of a valuation as a diagnostic of its physiological health, implying that the "poison" of the origin remains active in the present.

  In the First Essay, Nietzsche traces the origin of "good and evil" to the ressentiment of the priestly caste. He does not describe this origin merely as a historical contingency; he describes it in the language of pathology, toxicity, and infection. The slave revolt in morality is depicted as an act of "imaginary revenge" born of impotence. Nietzsche asks, "What if a symptom of regression were inherent in the 'good,' likewise a danger, a seduction, a poison, a narcotic, through which the present was possibly living at the expense of the future?" (GM I:6). The rhetorical force of this passage relies on the reader accepting that the "poison" of the origin permeates the present. If the origin and function were truly independent, the "poison" of the birth would not necessarily infect the maturity of the value.

  Furthermore, Nietzsche's treatment of master morality reveals a double standard that undermines the methodological neutrality of the origin/function distinction. Master morality also has a contingent origin: it arises from the spontaneous self-affirmation of the noble caste, rooted in physical strength and political dominance. By the logic of GM II:12, this origin should be just as disconnected from its current validity as slave morality. Yet, Nietzsche treats the master's origin as "innocent" and "affirmative," while the slave's origin is "reactive" and "lying." He does not apply the same skepticism to the noble's self-definition that he applies to the priest's. If the distinction were a consistent logical shield, both valuations would be equally unmoored from their origins. Instead, Nietzsche uses the *nature* of the origin (active vs. reactive) to judge the *value* of the present.

  This is most evident in his discussion of bad conscience in GM II. While he acknowledges that bad conscience can be repurposed for self-overcoming, his primary descriptive mode is to link the current state of European nihilism directly to the "violent incarceration" of the instinctual freedom of early humans. The "sickness" of modernity is not presented as a new function that has superseded the origin; it is presented as the direct, lingering consequence of that origin. The rhetoric demands that the reader feel the weight of the past as a burden on the present.

  **The Verdict: Instability as Strategy**

  Can these two positions be squared? Can we maintain that Nietzsche theoretically separates origin and function while practically collapsing them? The answer is that the distinction is methodologically unstable, and Nietzsche knowingly exploits this instability. To argue that the distinction is a consistent logical shield is to misunderstand the purpose of the *Genealogy*. Nietzsche is not writing a treatise on logic; he is engaging in a act of spiritual warfare.

  The verdict must be that the origin/function distinction is a rhetorical feint rather than a logical principle. It serves to dismantle the dogmatic belief in the eternal validity of moral concepts (showing they have histories), but it is discarded when Nietzsche needs to mobilize the *affect* of those histories to discredit specific values. Nietzsche violates the distinction because, within his philosophy of the will to power, the past is not dead. The "history" of a value is the sedimentation of specific drives and instincts. When a value originates in ressentiment, it carries the physiological stamp of that ressentiment—a stamp of life-denial. Even if the "function" changes (e.g., Christian charity becomes secular humanism), the underlying *type* of will to power (the weakening of the instinct for domination) remains constant.

  Therefore, Nietzsche does not commit the genetic fallacy in the traditional sense because he does not believe in a realm of "validity" separate from "genesis." For Nietzsche, truth is a species of error that is useful for life. Consequently, the "truth" of a value is inextricably linked to the health of the life that produced it. To trace the origin is to expose the physiological type behind the mask. If the origin is sick, the value is sick, regardless of its current social utility. The distinction between *Entstehung* and *Zweck* is maintained only to show that meanings are mutable; it is collapsed to show that the *drive* behind the meaning is persistent.

  This instability is essential to his project. If Nietzsche consistently upheld the separation, he would be forced to admit that slave morality, however poisonous its roots, might have developed a healthy function over millennia. He cannot afford this concession. His goal is the revaluation of values, which requires demonstrating that the current moral order is not just historically contingent but *dangerous*. To achieve this, he must make the reader feel that the "corpse" of the past still walks among us. The rhetorical violation of the origin/function distinction is the vehicle for this haunting. It forces the reader to confront the possibility that their most cherished values are not neutral tools for social cohesion, but active agents of physiological decline inherited from a specific, disreputable ancestry.

  **Conclusion**

  The tension between Nietzsche's theoretical separation of origin and function in GM II:12–13 and his practical reliance on origins to discredit values is not a problem to be solved by interpreters seeking logical consistency. It is a feature of the text. The origin/function distinction is an unstable methodological device that Nietzsche routinely violates. It cannot be squared with his genealogical practice as a logical shield against the genetic fallacy because Nietzsche's ontology does not permit a clean separation between the genesis of a value and its truth-content. For Nietzsche, the history of a value is the biography of a will to power. To expose the origin is to expose the health of that will. Thus, the distinction serves a dual purpose: theoretically, it liberates the present from the authority of the past by showing meanings are fluid; rhetorically, it binds the present to the past by showing that the drives of the past inhabit the present. Nietzsche's method is not designed to protect him from logical critique, but to implicate the reader in the very history he describes. The instability of the device is the engine of the genealogy.
