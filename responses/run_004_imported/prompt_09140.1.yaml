answer: |-
  A causal decision theorist (CDT) and an updateless decision theorist (UDT) are walking down the street when they are stopped by Omega.

  Omega flips a coin. It lands Heads.

  Omega says to them: "I flipped a coin. It came up Heads. I want $100 from you. However, had the coin come up Tails, I would have given you $10,000—but only if I predicted you would have given me $100 had it come up Heads."

  The CDT physicist shakes his head. "The coin is Heads. The $10,000 is impossible. Giving you $100 now gains me nothing. Keep your change."

  The UDT physicist immediately hands over $100.

  As they walk away, the CDT physicist shakes his head. "I know you're smart, but that was irrational. You paid a cost with no causal benefit. The reward is counterfactual. It doesn't exist."

  The UDT physicist sighs. "I didn't pay for the reward. I paid the premium."

  "The house burned down," the CDT physicist says. "You're buying fire insurance on ashes."

  "No," says the UDT physicist. "I'm wiring the deductible to my counterpart in the Tails branch so he can collect the payout."

  "But you can't transfer money across counterfactuals!"

  The UDT physicist smiles. "I just did. Now he's $10,000 richer, and I'm only $100 poorer. Across the multiverse, we're up."
