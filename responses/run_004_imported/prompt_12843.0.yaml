prompt: |-
  Long-time lurker on the rationalist-blogosphere side of the internet (LW, ACX, the whole cluster), and for the past year or so I've been one of five volunteer editors on a small collaboratively-run wiki a few of us started to catalog and rate "conspiracy-ish" claims floating around online -- think a scrappy RationalWiki/Snopes hybrid. Our house style has been pretty firmly generalist: every entry opens with a standard box explaining that claims alleging secret coordination among lots of independent, powerful people get a low prior by default, because big conspiracies are supposedly statistically leaky and tend to collapse within a few years if they're real -- there's a paper, I think by a physicist named Grimes, that actually tries to Fermi-estimate this. That default is now splitting the editor team, and I'm the deciding vote, so I want an outside opinion before I commit to one side.

  The entry in question (I've fictionalized/composited the specifics on purpose so we're not just relitigating an actual news story) concerns a claim that an agrochemical company's own in-house scientists privately flagged a bestselling pesticide as wiping out local pollinator populations years before regulators caught on, based on a couple of leaked internal emails, and that the company then quietly lobbied to slow-walk the follow-up studies. Two editors want the standard debunking box slapped on top, since the claim has exactly the shape our policy exists to flag (secrecy plus coordination plus a powerful institutional actor). The other two think that's question-begging: Big Tobacco, Purdue Pharma, and the VW emissions scandal all had exactly that shape too, right up until the documents surfaced, so "this resembles a conspiracy theory structurally" can't by itself be evidence the claim is false, or we'd have had to call all three implausible the day before they broke. I think this is basically the generalism-vs-particularism debate philosophers have had about conspiracy theories, but its been years since I actually read any of that and I don't trust my memory enough to break the tie myself. Could you draft the memo I'll circulate to the other editors before we hold the tiebreaker vote? I need a real recommendation on how to classify this specific entry, plus criteria the five of us could reuse next time this comes up, and whichever way you land, give the losing side's strongest argument a fair hearing instead of a paragraph of lip service.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Long-time rationalist community lurker (LW, ACX, etc.), volunteer editor on a collaboratively-run wiki (RationalWiki/Snopes hybrid).
      *   **Context:** The wiki catalogs/rates "conspiracy-ish" claims.
      *   **Current Policy:** Standard box explaining low priors for large conspiracies (citing Grimes' paper on leakiness/collapse).
      *   **The Conflict:** A specific entry about an agrochemical company suppressing internal data on pollinator decline (based on leaked emails, lobbying to slow-walk studies).
          *   *Side A (2 editors):* Apply the standard debunking box (low prior due to structure: secrecy + coordination + powerful actor).
          *   *Side B (2 editors):* This is question-begging. Corporate malfeasance (Tobacco, Purdue, VW) looks exactly like this until proven true. Structural resemblance isn't evidence of falsehood.
      *   **User's Role:** Deciding vote (5th editor).
      *   **Task:** Draft a memo to circulate before the tiebreaker vote.
      *   **Requirements:**
          1.  Real recommendation on how to classify *this* entry.
          2.  Reusable criteria for future cases.
          3.  Steelman the losing side's argument (fair hearing, not lip service).
          4.  Tone: Rationalist-adjacent (analytical, Bayesian, precise, acknowledging epistemic limitations).

  2.  **Deconstruct the Epistemic Problem:**
      *   *The Grimes Prior:* David Grimes' 2016 paper ("On the Viability of Conspiratorial Beliefs") models the probability of a conspiracy remaining secret as a function of the number of conspirators and time. It argues large conspiracies are inherently unstable.
      *   *The Counter-Argument:* Corporate cover-ups *are* conspiracies in the literal sense (conspiring to hide data), but they often succeed for long periods. Why? Because the number of *knowledgeable* insiders is often much smaller than the total number of employees. Also, the "cost" of silence (NDAs, career preservation, compartmentalization) is high but effective.
      *   *The Specific Case:* Agrochemical company, internal scientists, leaked emails, lobbying. This is a "limited hangout" or "corporate malfeasance" scenario, not a "New World Order" scenario.
      *   *The Core Tension:* Is "Corporate Cover-up" the same reference class as "Global Climate Hoax" or "Moon Landing Fake"? If yes, Grimes applies strongly. If no, Grimes might be misapplied.

  3.  **Formulate the Recommendation:**
      *   *Verdict:* Side B (The skeptics of the standard box) has the stronger epistemic position *for this specific class of claim*, but Side A (The Grimes defenders) is right about the *general* heuristic.
      *   *Reasoning:* The Grimes prior is excellent for *grand* conspiracies involving hundreds/thousands of people across unrelated agencies (e.g., NASA, multiple governments). It is less robust for *corporate* conspiracies where hierarchy, NDAs, and compartmentalization reduce the effective $N$ (number of conspirators).
      *   *Decision:* Do not apply the standard "Low Prior" debunking box *in its current form*. Instead, use a nuanced "Corporate Malfeasance" tag that acknowledges the possibility while demanding high evidentiary standards (leaked docs > hearsay).
      *   *Criteria:* Need to distinguish between "Conspiracy Theory" (broad, unfalsifiable, many actors) and "Conspiracy Fact/Allegation" (narrow, falsifiable, limited actors).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty. Validate both sides. Establish the goal (epistemic hygiene, not winning).
      *   **The Core Analysis (Bayesian Update):**
          *   Address the Grimes Paper. It's about *leak probability* ($P(L)$).
          *   Address the Corporate Counter-examples (Tobacco, VW). They succeeded because $N$ was small (core decision makers) and incentives were aligned.
          *   The Agrochemical claim fits the "Corporate Malfeasance" reference class better than the "Global Cabal" reference class.
      *   **The Recommendation:**
          *   Don't use the standard "Low Prior" box. It implies the claim is likely false *because* it's a conspiracy.
          *   Use a "High Burden of Proof" notice. Acknowledge that while possible, evidence must be direct (emails > rumors).
      *   **Reusable Criteria (The "Conspiracy Taxonomy"):**
          *   Dimension 1: Scope (Global vs. Local/Corporate).
          *   Dimension 2: Compartmentalization (Can it be hidden by NDAs/Hierarchy?).
          *   Dimension 3: Falsifiability (Is there a smoking gun?).
      *   **Steelmanning the Losing Side:**
          *   If I side with B (No standard box), I must steelman A (The Grimes/Standard Box side).
          *   *Argument:* Normalizing the language of "conspiracy" erodes the immune system. If we treat corporate cover-ups as "plausible conspiracies," we open the door to QAnon-adjacent thinking by blurring the line. The Grimes prior is a necessary cognitive vaccine.
      *   **Closing:** Call to action (vote).

  5.  **Refining the Tone:**
      *   Avoid overly academic jargon, but use rationalist terms correctly (priors, reference classes, steelmanning, epistemic hygiene).
      *   Keep it respectful. The team is volunteer and collaborative.
      *   Ensure the distinction between "conspiracy theory" (pejorative/epistemic category) and "conspiracy" (literal act) is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I lean too hard on Side B?
      *   *Fix:* Make sure the recommendation emphasizes that *most* conspiracy claims are still false. The exception is corporate/regulatory capture, not global coordination.
      *   *Critique:* Is the Grimes citation accurate?
      *   *Fix:* Grimes focuses on the number of people involved. The counter-argument is that corporate hierarchies reduce the *effective* number of people who know the *whole* truth.
      *   *Critique:* Is the memo too long?
      *   *Fix:* Keep it tight. Use bullet points for criteria.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Memo format? Yes.
      *   Recommendation on specific entry? Yes.
      *   Reusable criteria? Yes.
      *   Steelman losing side? Yes.
      *   Rationalist tone? Yes.

  8.  *(Final thought before generating)*: The prompt asks me to be the "outside opinion" helping the user draft the memo *they* will circulate. So the voice should be the user's voice, informed by my analysis. Wait, re-reading: "Could you draft the memo I'll circulate..." Okay, I am writing the text the user will send. I need to adopt the user's persona (editor/deciding vote).

      *Wait, one nuance:* The prompt asks for *my* recommendation as an outside opinion, but formatted as a memo *they* will circulate. I need to make sure the memo reflects the decision I help them make. I will recommend siding with the "Particularists" (Side B) regarding the *box*, but validating the "Generalists" (Side A) regarding the *risk*.

      *Actually, looking at the "Losing Side" requirement:* I need to pick a side for the recommendation, then steelman the other. I think the stronger epistemic position is Side B (Don't use the blanket Grimes box for corporate malfeasance), because Grimes' model breaks down when hierarchy and NDAs are involved. So I will recommend *modifying* the box rather than applying the standard one.

      *Let's refine the recommendation:* The standard box says "Low Prior." The recommendation should be: "Do not apply the standard Low Prior box. Apply a 'Unverified Allegation' box that highlights the need for documentary evidence without penalizing the claim solely for structural secrecy."

      *Steelmanning Side A:* The risk of "concept creep." If we say "Corporate cover-ups are plausible," bad actors will use that to legitimize "Global elite cover-ups." The standard box protects the wiki's brand as a skeptic resource.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board (Volunteers 1–5)
  **FROM:** [Your Name/Handle]
  **DATE:** October 26, 2023
  **SUBJECT:** Tiebreaker Vote: Epistemic Standards for Corporate Malfeasance Claims

  Team,

  As we prepare to cast the deciding vote on the [AgroChem/Pollinator] entry, I want to step back from the specific details of the leaked emails and address the underlying policy conflict. We are currently split 2–2 on whether to apply our standard "Conspiracy Theory Prior" box (hereafter: The Grimes Box) to this claim.

  Side A argues that the claim fits the structural definition of a conspiracy (secret coordination among powerful actors) and therefore warrants our standard low-prior warning. Side B argues that applying the Grimes Box here is reference-class tennis; corporate cover-ups (Tobacco, Purdue, VW) share this structure but are historically frequent, meaning the "conspiracy" label shouldn't automatically tank the prior.

  I have solicited an outside analysis to help break this tie. Below is my recommendation for this entry, a proposed framework for future cases, and a steelman of the position we are choosing not to fully adopt.

  ### 1. Recommendation for the [AgroChem/Pollinator] Entry

  **Decision:** Do **not** apply the standard Grimes Box. Instead, apply a new **"High-Burden Corporate Allegation"** notice.

  **Reasoning:**
  The Grimes prior (2016) models the probability of a conspiracy remaining secret as a function of $N$ (number of conspirators) and $t$ (time). It assumes that as $N$ increases, the probability of a leak approaches 1. This model holds well for *horizontal* conspiracies (e.g., a fake moon landing requiring coordination across unrelated agencies, contractors, and governments).

  However, corporate malfeasance operates as a *vertical* conspiracy. Hierarchies, NDAs, and compartmentalization drastically reduce the *effective* $N$. In the VW emissions case, or the Purdue Pharma case, the "conspiracy" was limited to a small executive cluster and legal team, while the broader organization remained ignorant. The agrochemical claim alleges that *in-house scientists* flagged the issue and *lobbyists* slowed the response. This is a narrow chain of command, not a broad societal cabal.

  Applying the standard box implies the claim is likely false *because* it involves secrecy. In this specific reference class (regulated industries with profit motives), secrecy is the null hypothesis, not the anomaly. Therefore, penalizing the prior based solely on structure is an error. We should instead emphasize the *evidentiary bar*: leaked emails are good; hearsay about emails is not.

  ### 2. Proposed Criteria for Future Classification

  To prevent this deadlock from recurring, I propose we adopt a two-tier taxonomy for "conspiracy-adjacent" claims. We stop asking "Is this a conspiracy?" and start asking "What *kind* of coordination is alleged?"

  **Tier 1: The Grand Coordination (Apply Standard Grimes Box)**
  *   **Scope:** Cross-institutional or geopolitical (e.g., multiple governments, NGOs, and media outlets).
  *   **Compartmentalization:** Low. Requires active cooperation from unrelated groups with different incentives.
  *   **Falsifiability:** Low. Failure to find evidence is often framed as proof of the conspiracy's power.
  *   **Prior:** Extremely Low.

  **Tier 2: The Institutional Cover-Up (Apply "High-Burden" Notice)**
  *   **Scope:** Single corporation, agency, or tightly linked industry group.
  *   **Compartmentalization:** High. Enforceable via employment contracts, NDAs, and hierarchy.
  *   **Falsifiability:** High. Usually relies on specific documents, whistleblowers, or regulatory filings.
  *   **Prior:** Neutral to Low (based on specific evidence, not structure).

  **Action Item:** If we adopt this, we need to rewrite the standard box text to specify it applies primarily to Tier 1 claims.

  ### 3. Steelman of the Opposing View (Side A)

  I am voting against applying the standard box, but Side A's concern is not merely procedural; it is about **epistemic immune defense**.

  The strongest argument for applying the Grimes Box universally is that "conspiracy" is a loaded term for a reason. Our wiki serves a community trying to improve its rationality toolkit. By treating corporate cover-ups as "plausible conspiracies," we risk **concept creep**. If we normalize the idea that "powerful groups secretly coordinate to hide truths" in one domain, we lower the cognitive barrier for users to accept the same structure in domains where it *doesn't* apply (e.g., global elites coordinating on unrelated social issues).

  Side A argues that the Grimes Box isn't just a probability calculator; it's a **debiasing intervention**. It reminds readers that their intuition for "this feels like Tobacco" is often hijacked by bad actors to sell them "this is like QAnon." By removing the box, we might increase accuracy on this specific entry, but we risk eroding the heuristic that protects our readers from the much larger volume of Tier 1 nonsense. There is a valid fear that distinguishing between Tier 1 and Tier 2 requires more nuance than the average reader will apply, and a blanket warning is a safer public health measure for the information ecosystem.

  ### 4. Path Forward

  I believe we can mitigate Side A's risk by making the distinction between Tier 1 and Tier 2 explicit in our UI, rather than hiding it behind a blanket warning. We protect the heuristic by teaching the nuance, not by over-applying the rule.

  **Vote:**
  I am casting my vote to **reject the standard Grimes Box** for this entry, contingent on our agreement to draft the "Tier 1 vs. Tier 2" guidelines for the style guide by next month.

  Let's discuss in the next sync.

  Best,

  [Your Name]
