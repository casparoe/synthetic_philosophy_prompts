answer: |-
  It is a pleasure to address a colleague who brings the conceptual rigor of general relativity to metaphysics. Your intuition is well-founded: the "worldtube" conception of objects in the spacetime manifold is the natural ontological counterpart to the block universe implied by relativity theory. It is often a shock to physicists entering metaphysics to discover that this view (perdurantism or four-dimensionalism) is not the default consensus, but rather one side of a heated debate.

  You have grasped the dialectic of the "Problem of Temporary Intrinsics" accurately. To address your specific questions, I will break this down into the distinction between the two endurantist strategies, the specific vulnerability of eternalist endurantism, and an evaluation of the costs involved.

  ### 1. Distinguishing the Two Endurantist Strategies

  You ask what fundamentally distinguishes **relativizing properties** (Strategy A) from **relativizing exemplification** (Strategy B), and whether Strategy A covertly concedes the perdurantist point.

  **The Distinction**
  The difference lies in *where* the temporal index is located in the ontological structure.

  *   **Strategy A (Relationalism/Indexicalism):** Here, the property itself is modified. "Being bent" is not a monadic property $B$. It is a dyadic relation $B(x, t)$. The object $x$ does not change; rather, the relation between $x$ and the time $t$ varies.
      *   *Ontological Commitment:* Properties are essentially relations to times. There is no such thing as "bentness" simpliciter, only "bentness-at-$t$."
  *   **Strategy B (Adverbialism):** Here, the property remains monadic and intrinsic ($B$). The modification applies to the *copula* (the "is" of predication). The object $x$ instantiates $B$, but the *mode* of instantiation is time-relative.
      *   *Ontological Commitment:* Properties are genuine monads. Instantiation is a three-place relation: $Instantiates(x, B, t)$.

  **Does Strategy A Concede to Perdurantism?**
  You suspect Strategy A might "smuggle in something worldline-like." It does not smuggle in **temporal parts** (which is the defining feature of perdurantism), but it does concede David Lewis's primary objection: **it abandons the claim that shape is an intrinsic property.**

  If "bent" is really a relation to a time, then an object's shape depends on something external to it (the time). In physics terms, Strategy A treats shape like a coordinate-dependent quantity rather than a scalar invariant. Lewis argued that this violates our pre-theoretic understanding of intrinsic properties (an object's shape should depend only on how its parts are arranged, not on its relation to the temporal manifold).

  However, Strategy A does not force you to accept temporal parts. You can maintain that the *whole* object stands in the relation $B(x, t_1)$ and $B(x, t_2)$. So, it does not grant the perdurantist's *mechanism* (temporal parts), but it does grant the perdurantist's *conclusion* that the simple statement "$x$ is bent" is incomplete without a time index.

  Strategy B (Adverbialism) is the more stubborn defense. It insists that "$x$ is bent" is a complete proposition, but its truth value is only assessable relative to a time. This preserves the "intrinsic" nature of the property at the cost of making "instantiation" a mysterious, time-indexed relation.

  ### 2. Why This is a Cost for Eternalists, Not Presentists

  This is the crux of why the problem is often framed as a dilemma for the eternalist endurantist (like yourself, given your GR background), but not the presentist.

  **The Eternalist Endurantist's Problem**
  Eternalism (the block universe) holds that $t_1$ (noon) and $t_2$ (1 PM) are equally real. Endurantism holds that the *whole* object $x$ exists at $t_1$ and the *whole* object $x$ exists at $t_2$.
  If properties are monadic and intrinsic (as endurantists prefer), then in the block universe, we have a single entity $x$ that possesses property $B$ and property $\neg B$ simultaneously (from the God's-eye view of the manifold). This is a formal contradiction: $Bx \land \neg Bx$.
  To avoid this, the eternalist endurantist *must* adopt one of the relativizing strategies (A or B) to explain away the contradiction. This is a "cost" because it requires modifying our logic or our ontology of properties to save the view that objects are "wholly present."

  **The Presentist's Escape**
  Presentism holds that only the present moment is real.
  *   At $t_1$, only $t_1$ exists. $x$ is wholly present and is bent. There is no $t_2$ to contradict this.
  *   At $t_2$, only $t_2$ exists. $x$ is wholly present and is straight. The $t_1$ state of affairs no longer exists.
  Because the incompatible states of affairs never co-exist, there is no contradiction to dissolve. The Presentist does not need to relativize properties or exemplification; they simply deny that the times coexist to generate the conflict.

  **The Physics Constraint**
  Here is where your background is crucial. While Presentism solves the metaphysical puzzle of temporary intrinsics "cheaply," it incurs a massive **physical cost**. Presentism requires a privileged global "now" to define what exists. This is notoriously difficult to reconcile with Special and General Relativity, where simultaneity is frame-dependent.
  *   **Perdurantism:** Fits GR naturally (worldtubes).
  *   **Eternalist Endurantism:** Fits GR naturally (block universe), but requires complex metaphysical gymnastics (Strategy A or B) to explain change.
  *   **Presentist Endurantism:** Solves the metaphysics of change easily, but conflicts with the structure of relativistic spacetime.

  So, the problem is treated as a serious cost for *you* (the eternalist) because you have already accepted the physical reality of the block universe. You cannot use the Presentist escape route without rejecting the spacetime framework you worked in for forty years.

  ### 3. Which Strategy Earns Its Keep?

  If one is committed to Endurantism within an Eternalist framework (as your discussion group seems to be exploring), which strategy is superior?

  **Strategy A (Relational Properties)** is ontologically parsimonious but semantically revisionary. It tells us that our ordinary language ("the rod is bent") is strictly false; it should be ("the rod is bent-at-$t$"). Lewis's objection is strong here: if shape is a relation to time, it is no longer an intrinsic feature of the matter distribution. For a physicist, this feels like treating a local tensor field as if it were a non-local boundary condition.

  **Strategy B (Adverbialism)** preserves the monadic nature of properties but introduces a primitive, unanalyzable notion of "instantiating-at." Metaphysically, this is opaque. What is this "exemplifying-at" relation? It risks being a placeholder for "we don't know how this works."

  **My Assessment**
  Given your background, I must be candid: **Perdurantism is the view that earns its keep best for a relativistic physicist.**
  The "Problem of Temporary Intrinsics" is largely generated by the demand that objects be "wholly present" at each time slice. In GR, the physics does not privilege "wholly present" 3D objects; it privileges 4D worldtubes. The variation of properties along the tube is no more mysterious than the variation of density along a spatial rod. We do not say a rod has a "problem of spatial intrinsics" because it is dense at one end and sparse at the other; we accept that different spatial parts have different densities. Perdurantists simply apply this same logic to time.

  However, if you wish to remain an Endurantist (perhaps due to the phenomenological intuition that *you* are wholly present now, not just a time-slice):
  *   **Strategy B (Adverbialism)** is the more philosophically honest attempt. It admits that the mystery lies in the *persistence* itself, not in the properties. It preserves the idea that "bentness" is a real, intrinsic state of the object, which aligns better with how we experience material qualities.
  *   **Strategy A** feels too much like a linguistic trick that concedes the physical picture (the block) while denying the ontological picture (the worldtube).

  ### Summary
  1.  **Distinction:** Strategy A makes time part of the property (relation); Strategy B makes time part of the instantiation (adverb).
  2.  **Smuggling:** Strategy A concedes that properties aren't intrinsic (Lewis's point) but doesn't necessarily concede temporal parts. However, it aligns the ontology closer to the coordinate-dependent view of the block universe.
  3.  **Presentism:** Presentists avoid the contradiction by denying the reality of non-present times, but this clashes with Relativity. As an eternalist, you cannot take this exit.
  4.  **Recommendation:** The "cost" of the problem is high for eternalist endurantists because they must complicate their ontology of properties to match the physics of the block universe. Perdurantism remains the most coherent fit for your background, treating the "change" as a gradient across the fourth dimension rather than a logical puzzle of instantiation.

  The friction you feel is the friction between the **manifest image** (objects enduring through time) and the **scientific image** (fields and tubes in spacetime). Metaphysics is the attempt to reconcile them; physics usually just ignores the manifest image. Your discussion group is attempting the reconciliation, which is why the problem feels so sharp to you.
