answer: |-
  Here is the ammo you need. Your friend is arguing for what philosophers call **"Pessimism about Moral Testimony."** It's an intuitive position, but it relies on treating morality as a magical, special category that doesn't follow the rules of normal epistemology.

  Your goal is to argue for **"Optimism."** Your core thesis is this: **Morality is not a special cognitive faculty; it is a domain of truth like any other.** If we accept testimony in medicine, law, and engineering without losing knowledge or agency, we must accept it in morality. The discomfort your friend feels isn't a bug in moral testimony; it's a bug in her expectation that every moral agent must be a moral philosopher.

  Here is how you dismantle her three specific moves.

  ### 1. The "Understanding" Objection
  **Her Claim:** Testimony gives you a true belief ("factory farming is wrong") without moral *understanding* (you don't know *why*). Therefore, it's inferior to empirical testimony.

  **Your Counter:** This sets a standard for moral knowledge that we don't require in any other high-stakes domain.
  If you go to a doctor and ask, "Should I take this antibiotic?" and she says "Yes," you now believe you should take it. Do you understand the biochemical mechanism of the drug? Do you understand the specific resistance patterns of the bacteria? No. You have true belief on testimony without deep understanding. Yet, we don't say your belief is epistemically broken.

  In complex empirical fields (climate science, macroeconomics, quantum physics), almost all belief is based on testimony without understanding. If your friend says, "I believe climate change is real because the IPCC says so," she likely cannot derive the climate models herself. She lacks "understanding" in the deep sense, but she possesses **knowledge**.

  **The Kill Shot:** If understanding were required for valid belief, we would be moral (and scientific) illiterates. We rely on experts to compress complex reasoning into actionable truths. If the professor's belief is based on sound reasoning, and the professor is trustworthy, that reasoning is *transmitted* to the student via the testimony. The student holds the belief *because* of the reasons, even if they can't recite the syllogism. To demand otherwise is to demand that every moral agent reinvent the wheel.

  ### 2. The "Virtue" Objection
  **Her Claim:** Even if the belief is true, acting on someone else's say-so isn't virtuous. You aren't a "good person" for doing the right thing just because you were told to.

  **Your Counter:** This confuses the **rightness of the action** with the **praiseworthiness of the agent**, and it ignores the virtue of epistemic humility.
  First, does it matter if the action is virtuous if the outcome is good? If you refrain from buying factory-farmed eggs because your professor said so, the chickens are still spared. A world where people do the right thing on testimony is better than a world where they guess wrong while trying to be "virtuous."

  Second, and more importantly, recognizing your own ignorance and deferring to wisdom **is itself a virtue.** If I know I am bad at calculus, and I defer to a mathematician, I am being rational. If I know I am prone to bias regarding my diet or consumption, and I defer to an ethicist who has studied the arguments, I am exercising **humility** and **trust**.

  **The Kill Shot:** Imagine a moral novice facing a complex dilemma (e.g., triage in a disaster). If they defer to a moral expert, they save more lives. If they insist on "figuring it out themselves" to preserve their "virtue," people die. Your friend is prioritizing the *aesthetic* of moral agency over the *substance* of moral outcomes. Deferring to expertise isn't a lack of character; it's a recognition of the division of moral labor.

  ### 3. The "Autonomy" Objection
  **Her Claim:** Outsourcing moral judgment gives up your autonomy. Outsourcing bridge safety doesn't, because bridges are external facts, but morality is about *who you are*.

  **Your Counter:** This relies on a false definition of autonomy. Autonomy is not **generating all your own norms**; it is **endorsing the norms you live by.**
  When you trust the engineer about the bridge, you are making an autonomous judgment that *this person is trustworthy.* You are not surrendering your agency; you are exercising it by choosing a reliable source. The exact same mechanism applies to morality. When you listen to the ethics professor, you are autonomously judging that *this professor is a reliable guide to value.*

  Furthermore, the bridge analogy cuts against her. You cross the bridge *because* you trust the engineer. That trust allows you to act (cross the river). Moral testimony works the same way: it allows you to navigate the social world. Refusing moral testimony doesn't make you more autonomous; it makes you **morally isolated.** It forces you to act on ignorance rather than informed trust.

  **The Kill Shot:** If autonomy required generating moral truths from scratch, we would all be moral solipsists. We learn language from others; we learn facts from others; we learn reasons from others. To say morality is the one domain where "learning from others" invalidates your agency is to claim that morality isn't a shared, rational enterprise but a private feeling. If morality is objective (or inter-subjective), it can be taught. If it can be taught, it can be testified to.

  ### The Verdict
  Your friend's intuition relies on the idea that morality is a "special sense" unique to each individual, like a favorite flavor of ice cream. But if morality is about **reasons** (as it must be if we argue about it), then reasons are shareable.

  **The Final Argument:**
  There is no principled asymmetry.
  1.  **Epistemically:** Testimony transmits justification in morality just as it does in science.
  2.  **Virtuously:** Deferring to expertise is a rational virtue, not a moral failing.
  3.  **Autonomously:** Choosing to trust an expert is an exercise of agency, not a surrender of it.

  **Your Closing Line:**
  "You're treating morality like it's a vibe I need to feel, rather than a body of knowledge I can learn. If I can trust an engineer to keep me from falling off a bridge, I can trust an ethicist to keep me from being a monster. To demand otherwise is to say that being a good person requires being an expert on everything, and that's not autonomy—that's arrogance."
