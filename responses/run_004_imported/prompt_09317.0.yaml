      *   **Specific Task:** Take down three specific arguments made by the friend:
          1.  *Understanding Objection:* Testimony gives true belief without understanding.
          2.  *Virtue/Action Objection:* Acting on say-so isn't virtuous/praiseworthy.
          3.  *Autonomy Objection:* Outsourcing moral judgment sacrifices autonomy in a way factual outsourcing doesn't.
      *   **Constraint:** Deal with each head-on. Don't talk around them. Land on a clear verdict (no "more research needed").
      *   **Tone:** Persuasive, philosophical, rigorous, but accessible (since it's for a debate with a friend).

  2.  **Deconstruct the Friend's Position (Pessimism about Moral Testimony):**
      *   The friend holds the "Pessimist" view in the debate about moral testimony (associated with philosophers like Sarah McGrath, Alison Hills, etc.).
      *   The user wants the "Optimist" view (associated with Jennifer Lackey, Paul Faulkner, etc.).
      *   The core intuition to challenge is: "Moral testimony is special/bad compared to empirical testimony."

  3.  **Drafting Counter-Arguments (The "Optimist" Playbook):**

      *   **Point 1: The Understanding Objection.**
          *   *Friend's Claim:* You can believe factory farming is wrong because a professor said so, but you don't *understand* why. In math/science, we also accept things on testimony without full understanding (e.g., Fermat's Last Theorem, complex climate models).
          *   *Counter:* Is understanding actually required for knowledge? If I trust my doctor that smoking is bad, I know it's bad even if I don't know the biochemistry. Why is moral understanding special?
          *   *Key Move:* Show that the "understanding" requirement is inconsistent. We accept expert testimony in law, medicine, and science without grasping the underlying mechanics. If the moral truth is objective (or inter-subjective), testimony transmits the *reason* implicitly, even if the receiver can't articulate it fully.
          *   *Refinement:* Distinguish between *propositional knowledge* (that X is wrong) and *explanatory knowledge* (why X is wrong). We accept the former via testimony in all domains.

      *   **Point 2: The Virtue/Action Objection.**
          *   *Friend's Claim:* Doing the right thing just because an expert said so lacks moral worth. It's not virtuous.
          *   *Counter:* This confuses the *rightness of the action* with the *praiseworthiness of the agent*. The prompt asks about the *belief* primarily, but the action follows.
          *   *Key Move:* Is it better to do the right thing for the wrong reason, or the wrong thing for the right reason? Consequentialism says the outcome matters. Even in Virtue Ethics, recognizing one's own ignorance and deferring to wisdom *is* a virtue (humility).
          *   *Refinement:* Imagine a novice in a moral emergency. If they defer to a moral expert, they save the life. That's better than guessing and failing. Also, we defer to legal experts on what is *legal* all the time without losing the "rightness" of obeying the law.

      *   **Point 3: The Autonomy Objection.**
          *   *Friend's Claim:* Morality is personal/autonomous. Outsourcing it makes you a tool. Outsourcing bridge safety doesn't.
          *   *Counter:* Why? Because morality governs *us*, whereas bridges are external? But morality also governs how we treat others.
          *   *Key Move:* Autonomy isn't about generating all norms yourself; it's about endorsing them. I can autonomously choose to trust a moral expert. That *is* an exercise of autonomy.
          *   *Refinement:* The "bridge" analogy actually works *against* the friend. I don't calculate the bridge's safety; I trust the engineer so I can cross it. Similarly, I trust the moral expert so I can live well. Refusing testimony leads to moral isolationism, which hinders agency.

  4.  **Synthesizing and Structuring the Response:**
