  8.  **Self-Correction during drafting:** I need to be careful not to say "Indicative reasoning is wrong." In law, we use indicative reasoning for *breach* (Did he run the light?). We use counterfactual for *causation* (Did running the light cause the injury?). The friction is applying the wrong mode to the causation element.

      *   *Correction:* Actually, the Kennedy example shows that indicative conditionals can be true while counterfactuals are false. In law, we need the Counterfactual to be true for liability. If jurors treat it as Indicative, they might find liability where there is none (or vice versa).
