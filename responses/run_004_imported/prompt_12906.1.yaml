      *   *The Risk:* Jurors might look at the injury (fact) and reason indicatively ("She's hurt, so someone caused it, maybe it doesn't matter who"). This leads to **liability without causation**.
      *   *Alternative Risk:* "If he hadn't run the light, someone else would have hit her" (Conspiracy/Inevitability). This leads to **no liability despite causation**.
      *   *Okay, the second risk is the stronger parallel to Kennedy.* The "Someone else would have" argument is the defense's best friend in causation disputes.

  9.  **Finalizing the Structure:**
