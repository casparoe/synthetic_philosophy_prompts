      *   **Topic:** Bradley's Regress and Act-Based Theories of Propositions (Soames, Hanks) vs. Traditional Structured Propositions (Frege, Armstrong, etc.).
      *   **Core Conflict:** Does the act-based view *solve* Bradley's Regress or merely *relocate* it (to the unity of the act itself)?
      *   **Characters:**
          *   *Traditionalist:* Defends structured, mind-independent complexes (uses Fregean unsaturation, brute composition, etc.).
          *   *Act-Theorist:* Defends propositions as types of cognitive acts (Soames/Hanks).
