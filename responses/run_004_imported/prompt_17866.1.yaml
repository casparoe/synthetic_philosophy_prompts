      *   Relocated regress addressed non-question-beggingly? Yes (via form/matter distinction in action).
      *   Traditionalist pressed on stipulation? Yes.
      *   Honest impasse? Yes.

  *(Self-Correction Note during final polish)*: Make sure Marcus doesn't slide into idealism. The act-type is abstract, even if tokens are mental. Keep the focus on the *type's* unity. Actually, Hanks/Soames focus on the *token* act type. I need to be careful there. Let's stick to the idea that the *type* is defined by the *mode* of presentation which is inherently predicative.

  Okay, let's write it.
answer: |-
  **Setting:** *The graduate lounge, 11:30 PM. Empty coffee cups and scattered printouts litter the table. Elena (Traditionalist) is leaning back in her chair, rubbing her temples. Marcus (Act-Theorist) is pacing slightly, holding a marker like a baton.*

  **Elena:** I keep coming back to the same wall, Marcus. You want me to accept that the proposition *that Socrates is wise* is a type of cognitive act. Fine. I can follow the motivation. You want to avoid the cemetery of dead constituents—the object and the property sitting side-by-side like stones in a bag, waiting for a relation to glue them. But you haven't emptied the cemetery; you've just moved the bodies.

  **Marcus:** That's the Bradley worry. I know. But the point of the act-theory is to dissolve the need for a glue.

  **Elena:** Is it? Let's trace the anatomy of your "act." When I predicate wisdom of Socrates, on your view, I am performing a complex cognitive maneuver. But what are the parts of that maneuver? Presumably, I have to entertain Socrates. And I have to entertain Wisdom. And then I have to... what? *Predicate* the second of the first. If "predicating" is just a third component added to the first two, I'm back in Bradley's trap. What binds the predicating to the Socrates-entertaining and the Wisdom-entertaining? Do we need a meta-predication to bind the predication to its terms?

  **Marcus:** No, and that's where the analogy with static complexes breaks down. You're treating the act as if it were a static structure that *has* parts. But an act isn't a sum; it's a directed movement. Think about the difference between a pile of bricks and the act of building a wall. The pile is a mereological sum. The act of building is unified by its telos, by what the agent is *doing*.

  **Elena:** But the act of building still involves bricks and mortar. If I just wave my hands near the bricks, I'm not building. There has to be a specific relation between my agency and the materials.

  **Marcus:** Agreed. But here is the non-question-begging move: In the cognitive act, the "materials"—Socrates and Wisdom—are not *parts* of the act in the way bricks are parts of a wall. They are the *targets* or *contents* of the act. The unity doesn't come from a relation *between* me, Socrates, and Wisdom. It comes from the fact that the act is *essentially* predicative. You can't separate the "entertaining Socrates" from the "predicating" in this context. To entertain Socrates *in this act* just is to entertain him-as-subject. The mode of presentation is built into the attentional focus.

  **Elena:** So you're saying the unity is internal to the nature of the act-type?

  **Marcus:** Exactly. The act-type is defined functionally. It's the type of act one performs when one takes an object and a property and asserts the latter of the former. The "taking" isn't a separate sub-act. It's the form of the activity. If you ask, "What unifies the act?" the answer is: "The agent's intention to predicate." That intention isn't another item in the list. It's the organizing principle.

  **Elena:** I see the move. You're borrowing an Aristotelian hylomorphism for cognitive science. The matter is the concepts, the form is the predicative force. But Marcus, this just pushes the regress up a level to the Agent. You've grounded the unity of the proposition in the unity of the cognitive act. But now I ask: What makes *that* act a single unity rather than a disjointed sequence of neural firings or mental states?

  **Marcus:** Because it's an action, not a sequence of events.

  **Elena:** That sounds like a stipulation. You're saying, "Acts are unified because I define them as unified." Why is the agent's intention capable of doing the unifying work that the relation of *instantiation* couldn't do in the traditional picture? If instantiation needs a further relation to tie it to Socrates and Wisdom, why doesn't the intention need a further intention to tie it to the concepts of Socrates and Wisdom? If I intend to predicate, do I also have to intend to link my intention to the concept of Wisdom?

  **Marcus:** No, because the intention is *self-intimating*. When I intend to predicate wisdom of Socrates, the content of the intention *includes* the terms. I don't need a second intention to point the first intention at Wisdom. The intention is inherently *about* Wisdom.

  **Elena:** "Inherently about." You're using intentionality as a magic wand. You've replaced the metaphysical mystery of "non-mereological composition" with the psychological mystery of "intrinsic aboutness." You say the traditionalist owes an explanation of how a property sticks to an object. I say you owe an explanation of how a mind sticks to a content. If the mind can just "reach out" and grasp Socrates and Wisdom in a single unified grip without a further grasping relation, why can't the world just "hold" Socrates and Wisdom in a single unified state of affairs without a further holding relation?

  **Marcus:** Because the world is inert! Socrates doesn't do anything. Wisdom doesn't do anything. They are ontological dead weight. The mind is active. The unity of the proposition is borrowed from the unity of agency. We know what it is to do something unified. We don't know what it is for a static abstract complex to be unified without a glue.

  **Elena:** Do we know what it is to do something unified? If you analyze my action of "predicating," you find motor commands, conceptual retrievals, syntactic processing... If you stop the analysis at "Agency," aren't you just positing a brute fact? You're saying, "The regress stops at the Agent." The traditionalist says, "The regress stops at the State of Affairs." Armstrong calls it "non-mereological composition." You call it "predicative force." Both of us are pointing to a primitive unity and saying, "It just is this way."

  **Marcus:** It's not the same kind of primitive. Armstrong's primitive is a relation that somehow *isn't* a relation. It's a logical chimera. He wants a tie that ties without needing to be tied. That's contradictory. My primitive is the capacity of a subject to act. That's not contradictory; it's the basic datum of experience. I'm not positing a weird ontological glue; I'm positing that agents can do things. If you can't make sense of an agent performing a single, complex action without asking what binds the action to its components, then you can't make sense of action at all.

  **Elena:** But that's the rub. I *can* make sense of action without solving the metaphysics of propositions. I can admit I act, but still ask what makes the *content* of that act a unity. You're conflating the token act (which is a mental event) with the proposition (which is supposed to be the content). If the proposition is a *type* of act, as Soames says, then the type must have its unity independently of my token performance. Does the *type* have an agent? No. So the type relies on the *possibility* of an agent. But then we're back to abstracta. How is the *type* unified? Is the type a set of possible tokens? If so, what unifies the set?

  **Marcus:** The type is unified by its conditions of performance. To be a token of the type *Predicate(Wisdom, Socrates)*, a token act must have a specific structure. That structure is defined by the role the components play. Socrates plays the subject-role. Wisdom plays the predicate-role. The unity is functional.

  **Elena:** Functional unity is still unity. Who assigns the roles? If the proposition exists independently of my thinking it—which you need it to, for it to be true or false regardless of whether anyone thinks it—then those roles are fixed abstractly. If they are fixed abstractly, we are back to a structured complex with roles. And I ask again: what binds the subject-role to Socrates? If you say "nothing, it's just the nature of the act-type," then you have accepted a brute, unexplained unity at the level of abstract types. You haven't escaped Bradley; you've just hidden him inside the definition of "Act-Type."

  **Marcus:** I haven't hidden him. I've changed the category. A structured complex is a *thing*. A thing needs a cause for its unity. An act-type is a *rule* or a *norm*. Rules don't need glue. They need interpretation.

  **Elena:** And who interprets the rule?

  **Marcus:** The agent.

  **Elena:** *[Laughs softly]* There it is. The homunculus. You've saved the proposition from Bradley's Regress by sacrificing it to the Homunculus Fallacy. You've made the unity of the proposition dependent on the unity of the mind interpreting it. But if the mind needs to interpret the rule to unify it, the rule itself isn't unified. It's just ink on a page until read. So the proposition isn't inherently unified; it's only unified *for* a mind. That makes truth mind-dependent.

  **Marcus:** Not truth. Truth is a property of the act-type. The act-type is unified by the conditions of its correctness. Look, Elena, we're at the impasse. You want a unity that is mind-independent. I think that's a fantasy. You want a complex that holds together without anyone holding it. I think that's a category mistake.

  **Elena:** And I think your "category" is just a obfuscation. You say "Act-Type" to avoid saying "Abstract Complex." But if the Act-Type has constituents (Socrates, Wisdom) and a structure (Subject, Predicate), and it exists independently of tokens, it *is* an abstract complex. You've just labeled the binding relation "Predicative Force" and claimed it's self-explanatory because it sounds like a verb. But if it's an abstract type, it's not doing anything. It's not *acting*. So the "force" is metaphorical. And if it's metaphorical, what is the literal ontological ground of the unity?

  **Marcus:** The literal ground is the causal-functional role in a cognitive system.

  **Elena:** Then propositions are psychological.

  **Marcus:** They are act-types. Cognitive systems instantiate them.

  **Elena:** And if no cognitive systems existed?

  **Marcus:** *[Pauses]* Then there would be no propositions. There would be facts, perhaps. But no propositions.

  **Elena:** There it is. You've solved Bradley's Regress by eliminating the things that were supposed to be regressing. You don't have mind-independent propositions anymore. You have potential mental actions. I can accept that. But don't tell me you've solved the metaphysical problem of unity for *truth-bearers*. You've just changed the subject to *truth-makers* or *cognitive capacities*.

  **Marcus:** I'm telling you that the demand for a mind-independent truth-bearer with intrinsic unity is the demand that generates the regress. It's a demand for a ghost in the machine.

  **Elena:** And I'm telling you that without that ghost, you don't have disagreement. If I assert *p* and you deny *p*, and *p* is just a type of act *I* perform and *p* is a type of act *you* perform, how do we contradict each other? We're performing different tokens. What is the common content? If the common content is an abstract type, we're back to the inert complex. If the common content is the "possibility of action," we need an account of possibilities that doesn't collapse back into structured complexes.

  **Marcus:** The common content is the shared normative standard. We are both accountable to the same rule.

  **Elena:** And rules, Elena, are abstract objects. And abstract objects, Marcus, do not have causal powers to bind their constituents. So either the rule is inert, and you have a regress, or the rule is active, and you have magic.

  **Marcus:** Or the rule is a social-practical norm, grounded in our shared form of life.

  **Elena:** Now you're a Wittgensteinian. Five minutes ago you were a Soamesian.

  **Marcus:** *[Smiles]* I'm trying to survive your regress.

  **Elena:** And I'm trying to find out if you actually survived it, or if you just ran away to Pragmatism.

  **Marcus:** Maybe Pragmatism is the only place where the regress doesn't start.

  **Elena:** Or maybe it's just where you stop asking the question.

  **Marcus:** Or maybe it's where we realize the question was malformed.

  **Elena:** *[Sighs, picking up her pen]* I don't think it's malformed. I think it's the price of admission for realism. If you want truth to be objective, you have to pay the Bradley tax. You have to posit a brute unity. I'm willing to pay it. I'll take Armstrong's brute non-mereological composition. It's a cost, but it buys me mind-independence.

  **Marcus:** And I'm not willing to pay it. I think the cost is incoherence. I'd rather pay the price of psychologism.

  **Elena:** Then we agree on the ledger. We just disagree on which currency is counterfeit.

  **Marcus:** Cheers to that.

  **Elena:** Cheers. *[She taps her coffee cup against his]* But I'm still writing the regress into my dissertation.

  **Marcus:** I'd be worried if you didn't.
