          5.  Elena pivots: So you've grounded unity in the Agent. But what unifies the Agent's act?
          6.  Marcus turns it: What unifies the State of Affairs? You say "non-mereological." I say "brute."
          7.  Conclusion: It's a choice between metaphysical brute facts vs. agential brute facts.

  7.  **Polishing:**
      *   Check terminology (predication, instantiation, mereological, unsaturated).
