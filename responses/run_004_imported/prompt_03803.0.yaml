      *   **Topic:** Condorcet's social choice theory (Jury Theorem, Voting Paradox) vs. the Discursive Dilemma (Doctrinal Paradox).
      *   **Scenario:** A three-judge court case (Contract, Breach, Liability). Premise-based voting (Contract=Yes, Breach=Yes $\rightarrow$ Liability=Yes) vs. Conclusion-based voting (Liability=No, because only 1/3 say Yes).
