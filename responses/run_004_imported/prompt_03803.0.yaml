      *   **Voting Paradox (Condorcet Paradox):** Intransitive social preferences ($A > B > C > A$). This is about *ordering* alternatives.
      *   **Discursive Dilemma:** Inconsistency between *premises* and *conclusions* in judgment aggregation. This is about *logical coherence* of propositions, not just preference ordering.
      *   **Enlightenment Context:** Reason, logic, mathematics applied to politics/law.

  3.  **Evaluate Condorcet's Potential Reaction:**
