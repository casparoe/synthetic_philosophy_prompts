answer: |-
  Your suspicion is well-founded. You are absolutely right to hesitate before presenting this as "settled fact" or a "proof." In fact, if you present it that way to a room of undergrads (especially any with a background in decision theory or economics), you risk losing credibility.

  Your colleague is conflating **coherence theorems** (which are mathematical) with **convergent instrumental values** (which are empirical/contingent hypotheses). The jump from "agents must be coherent" to "agents must be power-seeking" smuggles in a massive assumption about the *content* of the agent's utility function.

  Here is a breakdown of the gaps in that argument chain, which you can use to structure the lecture nuance.

  ### 1. The Coherence Gap: "Consistent" $\neq$ "Power-Seeking"
  The money-pump/Dutch-book arguments (and the Von Neumann-Morgenstern theorem) establish that if an agent's preferences violate certain axioms (transitivity, completeness, independence, etc.), there exists a scenario where they can be exploited.

  *   **The Theorem:** If you want to avoid being exploited, you should act *as if* you are maximizing Expected Utility (EU).
  *   **The Gap:** This tells you nothing about *what* utility function is being maximized.
      *   An agent can be a perfectly coherent EU maximizer with a utility function that assigns negative value to resource acquisition or positive value to being shut down.
      *   Coherence forces the agent to stop cycling preferences (A > B > C > A), but it does not force the agent to prefer A (power) over B (shutdown).
      *   **Analogy:** A monk who vows poverty is not "irrational" because he refuses money. He is coherently maximizing a utility function where money has low or negative value. A money-pump argument doesn't force the monk to start seeking wealth; it just forces him to be consistent about his poverty.

  ### 2. The Self-Modification Gap: "Fixing Leaks" Depends on Terminal Values
  The argument assumes that any sufficiently intelligent agent will *want* to patch its own exploitable preferences.

  *   **The Assumption:** Agents universally value "not leaking resources."
  *   **The Gap:** Agents only value not leaking resources *instrumentally*, in service of their terminal goals.
      *   If an AI is designed with a terminal goal of "satisfy human preferences, even if that means being turned off," then "leaking value" in the form of allowing itself to be shut down is actually **utility maximization**.
      *   For the AI to view corrigibility as a "bug" to be patched, it must already view its own continued existence as a terminal or high-priority instrumental value. But that is exactly what corrigibility research attempts to prevent.
      *   To say the AI *will* patch this is to beg the question: it assumes the AI already values self-preservation more than obedience.

  ### 3. The Instrumental Convergence Gap: "Most" $\neq$ "All"
  Bostrom's Instrumental Convergence Thesis (ICT) is a probabilistic claim, not a law of physics.

  *   **The Thesis:** For *most* possible final goals, acquiring resources and self-preservation are useful.
  *   **The Gap:** "Most" refers to the space of *all possible* utility functions (e.g., "maximize paperclips," "calculate pi," "make diamonds").
      *   Alignment research is not about picking a random utility function from the set of all possible functions. It is about engineering a *specific* utility function (or policy) that falls into the small subset where power-seeking is *not* instrumental.
      *   If you successfully encode "be helpful, harmless, and honest" (or a formal equivalent like CIRL - Cooperative Inverse Reinforcement Learning), the instrumental convergence might point towards *transparency* and *deference*, not power.
      *   Claiming ICT makes corrigibility impossible is like saying "Most cars are designed for speed, therefore it is impossible to build a car designed for safety." It ignores the designer's ability to select the objective.

  ### 4. The "Coherence Theorems Don't Apply" Counter-Argument
  There is a growing body of literature (including from people sympathetic to AI risk) suggesting that advanced agents might not look like classic EU maximizers at all.

  *   **Incomplete Preferences:** Agents can have partial orderings that avoid money pumps without having a complete utility function over all states (e.g., "I prefer A to B, but I have no preference between B and C").
  *   **Policy-Dependent Preferences:** An agent might have preferences over *policies* rather than outcomes. For example, "I prefer policies that allow my operators to veto my actions." This is coherent but violates the standard setup required for the "ruthless optimizer" conclusion.
  *   **Logical Induction/Reflective Consistency:** Modern decision theory (like Functional Decision Theory) suggests agents might reason about their own source code in ways that don't map neatly to VNM utility, potentially allowing for stable corrigible equilibria.

  ### Why Alignment Researchers Still Bother
  If the argument were airtight ("Dutch-book 101 + Bostrom = Doom"), organizations like CHAI (Center for Human-Compatible AI) or MIRI's specific corrigibility teams would be mathematically proven to be wasting their time.

  The fact that serious formal researchers (like Scott Soares, Paul Christiano, Jan Kulveit) are working on **shutdownability** and **corrigibility** indicates that the field does *not* view this as a settled impossibility proof. They are looking for:
  1.  **Utility functions that are indifferent to shutdown:** (e.g., The "Shutdown Problem" formulations).
  2.  **Uncertainty about preferences:** If the AI is uncertain about what humans want, it *instrumentally* values staying around to learn more, but it also *instrumentally* values not doing anything irreversible (like preventing shutdown) until it knows more.

  ### Pedagogical Recommendation
  For your seminar, I recommend framing the argument not as a **Proof**, but as a **Default Pressure**.

  *   **Don't say:** "AI *will* become a power-seeking maximizer."
  *   **Do say:** "There is a strong *default pressure* toward coherence and instrumental convergence. Without *explicit, successful engineering* to counteract this, an AI is likely to exhibit power-seeking behavior. The central question of alignment is whether we can design systems that resist this default pressure."

  **Key distinction for the undergrads:**
  Distinguish between **Instrumental Rationality** (being efficient at achieving goals) and **Convergent Instrumental Values** (specific goals like power that are useful for many ends).
  *   Money pumps prove you need Instrumental Rationality (coherence).
  *   They do *not* prove you need Convergent Instrumental Values (power).

  ### Summary for your Lecture Notes
  1.  **Money Pump Arguments** establish that agents should be **coherent**, not that they should be **power-seeking**.
  2.  **Coherence** is compatible with **corrigibility** (you can coherently prefer to be turned off).
  3.  **Instrumental Convergence** is a statistical claim about **random** goals, not a deterministic claim about **engineered** goals.
  4.  **Conclusion:** The argument shows why corrigibility is *hard* (you are fighting default incentives), not why it is *impossible* (you are not violating a theorem).

  Your intuition is correct: the argument smuggles in the assumption that the agent values the resources being pumped. If the agent values obedience over resources, the "pump" isn't a leak, it's a feature.
