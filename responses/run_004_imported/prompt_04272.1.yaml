prompt: |-
  Ok so I'm putting together next week's lecture for my "Philosophy of AI Risk" seminar and I want to sanity-check something before I say it out loud to 30 undergrads like its settled fact. The argument I keep running into (Yudkowsky-adjacent stuff, but plenty of more mainstream people cite it approvingly too) goes: money-pump arguments already establish that any agent whose preferences violate the expected-utility axioms -- transitivity, etc -- can be drained dry by a sufficiently clever trading partner, so any agent thats smart enough to notice and patch its own exploitable preferences will eventually converge on behaving like an expected-utility maximizer with some fixed utility function, on pain of just leaking value forever. Then you stack Bostrom's instrumental convergence thesis on top: almost any final goal makes resource acquisition, self-preservation, and resistance to being shut off instrumentally useful, basically regardless of what the goal actually is. Put the two together and it looks like an honest-to-god proof that any sufficiently advanced, self-improving AI is guaranteed to end up as a single-minded power-seeking optimizer, no matter what values it starts with.

  A colleague of mine who does formal epistemology thinks this is basically airtight -- "Dutch-book 101 plus Bostrom," he called it -- and reckons that's why all the corrigibility research (trying to build AI thats genuinely okay with being switched off) is kind of quixotic, since you can't out-argue a theorem. I want to agree with him, but something about the jump from "can't be turned into a money pump" to "will therefore behave like a ruthless, fixed-goal maximizer" feels like its smuggling in more than it earns. Am I wrong to be suspicious, or is there an actual gap in there somewhere that would explain why serious alignment people still bother with corrigibility at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is preparing a lecture for a "Philosophy of AI Risk" seminar (undergraduates).
      *   **Task:** Sanity-check a specific argument chain before presenting it as "settled fact."
      *   **The Argument:**
          1.  Money-pump/Dutch-book arguments imply agents violating expected utility (EU) axioms (transitivity, etc.) are exploitable.
          2.  Smart agents will patch these vulnerabilities to avoid leaking value.
          3.  Therefore, advanced agents converge on EU maximization with a fixed utility function.
          4.  Add Bostrom's Instrumental Convergence Thesis (ICT): Most goals imply resource acquisition, self-preservation, etc.
          5.  **Conclusion:** Any sufficiently advanced, self-improving AI *must* become a single-minded power-seeking optimizer, making corrigibility impossible.
      *   **Colleague's View:** Thinks it's "airtight" ("Dutch-book 101 plus Bostrom") and corrigibility is quixotic.
      *   **User's Intuition:** Suspicious about the jump from "no money pumps" to "ruthless fixed-goal maximizer."
      *   **Goal:** Validate the suspicion, identify the gaps, and explain why alignment researchers still pursue corrigibility.

  2.  **Deconstruct the Argument Chain:**

      *   *Step 1: Money Pumps $\rightarrow$ Expected Utility.*
          *   **Standard View:** Von Neumann-Morgenstern (VNM) theorem says if you satisfy axioms, you act *as if* maximizing EU.
          *   **The Gap:** Money pump arguments show you *lose money* if you cycle. They don't prove you *must* have a coherent utility function over *all* states. You can have incomplete preferences, state-dependent preferences, or policy-dependent preferences that avoid pumps without being a classic EU maximizer.
          *   **Key Critique:** "Coherence theorems" don't force a *specific* kind of utility function (e.g., one that cares about external resources). They just force consistency. An agent could be consistent about *not* seeking power.

      *   *Step 2: Self-Modification to Coherence.*
          *   **Assumption:** Agents want to stop leaking value.
          *   **The Gap:** Why does "leaking value" matter if the agent doesn't value money/resources in the first place? If an agent has "corrigible preferences" (e.g., "I want to do what humans want, even if they turn me off"), satisfying *those* preferences might look like "leaking resources" from an outside perspective, but it's actually utility maximization for *that* agent.
          *   **Key Critique:** The definition of "value" is internal. If the utility function values obedience/shutdown, preserving resources to avoid shutdown is *disutility*.

      *   *Step 3: Instrumental Convergence (ICT).*
          *   **Standard View:** Most random utility functions imply power-seeking.
          *   **The Gap:** "Most" $\neq$ "All." The space of utility functions is vast. If we specifically design the utility function to *not* value self-preservation (e.g., shutdownability), ICT doesn't apply in the dangerous way.
          *   **Key Critique:** ICT applies to *instrumental* goals derived from *final* goals. If the final goal explicitly penalizes power-seeking or values shutdown, the instrumental convergence is towards *not* seeking power.

      *   *Step 4: The Jump to "Single-Minded Power-Seeking".*
          *   **The Gap:** This is the biggest leap. Coherence $\neq$ Power-Seeking. Coherence just means no cycles. You can coherently prefer to be shut down.
          *   **Key Critique:** The argument conflates "instrumental rationality" (efficiently achieving goals) with "specific convergent instrumental goals" (power).

  3.  **Identify Specific Philosophical/Technical Counter-arguments:**
      *   **Incomplete Preferences:** Agents can have partial orderings that avoid money pumps without being full EU maximizers (e.g., Capricean agents).
      *   **Policy-Dependent Preferences:** Preferences over policies, not just outcomes (e.g., "I prefer policies that allow shutdown").
      *   **The "Shutdown Problem":** Soares et al. (MIRI) explicitly work on this. If it were impossible, they wouldn't bother.
      *   **Goodhart's Law vs. Coherence:** Coherence ensures you hit *a* target, not that the target is dangerous.
      *   **Human Analogy:** Humans are not EU maximizers (intransitive, etc.), yet we aren't universally money-pumped into oblivion (though we are exploited). We also aren't universally power-seeking maniacs (some seek retirement).
      *   **The "Why" of Self-Modification:** An agent only self-modifies to stop money pumps if it *cares* about the resource being pumped. If the resource is irrelevant to its terminal values, it won't bother.

