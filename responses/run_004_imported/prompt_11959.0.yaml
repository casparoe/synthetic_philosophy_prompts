answer: |-
  This dinner table debate is a textbook instantiation of a metaphysical dispute over natural kinds, mirroring discussions in contemporary analytic metaphysics and the philosophy of science. To evaluate who has the stronger case, we must distinguish between *ontological* facts (what exists and what properties it has) and *conceptual* facts (how we categorize those properties). The central philosophical tension here is between **realism about natural kinds** (Renata) and **deflationism or conventionalism** (Dev), with references to Eli Hirsch's deflationary ontology, David Chalmers' criteria for verbal disputes, and Karen Bennett's work on the pragmatics of metaphysical disagreement.

  Here is an analysis of moves (1) through (4), followed by an evaluation of the "unhappy-faced" verdict.

  ### Move (1): Renata's Realist Assertion
  **Renata:** *"Has cleared the neighborhood... tracks something dynamically real... That's a fact about Pluto, not a preference."*

  *   **Analysis:** Renata is invoking a Lewisian view of "perfectly natural properties." She argues that orbital dominance is a "joint in nature" that exists independently of human classification. If "planet" is a term intended to track dynamical history, then Pluto's status is a substantive fact.
  *   **Strength:** **Weak.** While Renata is correct that orbital dominance is a physical reality, she begs the question by assuming that the word "planet" *must* track that specific reality. She conflates the *property* (dynamical dominance) with the *predicate* ("is a planet"). Establishing that the property is real does not establish that the label is bound to it.
  *   **Philosophical Reference:** David Lewis (*New Work for a Theory of Universals*). Renata assumes there is one best way to carve nature at its joints.

  ### Move (2): Dev's Deflationary Diagnosis
  **Dev:** *"What's actually intrinsic to Pluto... is what does the real explanatory work... the whole fight... is merely verbal."*

  *   **Analysis:** Dev makes a classic Hirschian move. He separates the "canonical" facts (Pluto is round, Pluto shares its orbit) from the linguistic label ("planet"). By arguing that all physical facts are agreed upon, he diagnoses the remainder as a verbal dispute about boundary drawing (the "hot tub/pool" analogy). He shifts the burden to Renata to show why the *word* matters beyond the physics.
  *   **Strength:** **Strong.** This aligns with Eli Hirsch's deflationism (*Quantifier Variance and Realism*). If two parties agree on all the underlying physical states of affairs (the "canonical description"), but disagree on the truth value of a sentence solely due to the definition of a term, the dispute is verbal. Dev successfully isolates the disagreement to the extension of the word "planet."
  *   **Philosophical Reference:** Eli Hirsch (*Debating the Existence of the World*). Dev treats "planet" as a concept whose boundaries are determined by human interest, not mind-independent reality.

  ### Move (3): Renata's Theoretical Utility Counter
  **Renata:** *"If one classification does more explanatory work, deciding which property our theories should track is substantive, not verbal."*

  *   **Analysis:** This is Renata's strongest move, invoking a Chalmersian criterion for substantiveness. David Chalmers argues that a dispute is substantive if one side is using a concept that plays a better theoretical role. Renata argues that "dynamical dominance" supports deeper generalizations about solar system formation than "roundness" does. If "planet" is a *theoretical term* in astronomy, its definition should maximize explanatory power. Therefore, choosing the definition is a substantive scientific decision, not just a semantic one.
  *   **Strength:** **Very Strong.** This blocks Dev's simple deflationism. It suggests that even if the *physics* is agreed upon, the *conceptual scheme* itself is subject to evaluation. If one scheme is objectively better for science, the dispute over which scheme to use (and thus which word to attach to it) is substantive regarding scientific methodology.
  *   **Philosophical Reference:** David Chalmers (*Verbal Disputes*). Chalmers notes that disputes over theoretical terms can be substantive if they concern which concept is more useful for inquiry.

  ### Move (4): Dev's Pluralist Reinstatement
  **Dev:** *"Roundness does comparable work... If both properties support real generalizations, they're equally entitled to count as 'joint-carving,' and the leftover question of which one gets the word 'planet' is precisely the kind of question with no further fact of the matter."*

  *   **Analysis:** Dev counters Renata's theoretical utility argument with **Kind Pluralism**. He concedes that roundness *also* supports real generalizations (geology, atmospheres). If there are multiple, equally valid ways to "carve nature at its joints" (dynamical vs. geological), then there is no single "best" carving. Consequently, the choice of which carving gets the honorific "planet" returns to being a pragmatic convention.
  *   **Strength:** **Strongest.** This neutralizes Move (3). If nature has multiple joints (as argued by philosophers of science like John Dupré or Richard Boyd regarding Homeostatic Property Clusters), then no single definition is uniquely "correct." The choice becomes pragmatic. Since the physical facts are fixed and multiple conceptual schemes are valid, the dispute over the *label* is verbal.
  *   **Philosophical Reference:** John Dupré (*The Disorder of Things*). Dev argues for the disunity of scientific kinds; astronomy and geology carve the world differently, and neither has priority on the English word "planet."

  ### The "Unhappy-Faced" Verdict (Bennett)
  You asked if there is a position they are missing, akin to Karen Bennett's "unhappy-faced" verdict. In her paper *Finding the World in the Map*, Bennett discusses disputes where the philosopher concludes the dispute is **verbal**, but acknowledges that the participants have **substantive reasons** for resisting that conclusion.

  Both Renata and Dev are missing this distinction. They are treating the dispute as a binary: either there is a fact of the matter (Renata) or it's just words (Dev). Bennett would suggest an "unhappy-faced" verdict: **The dispute is verbal, but it masks a substantive disagreement about disciplinary values.**

  *   **Renata** is fighting for the priority of *dynamics* in astronomy.
  *   **Dev** is fighting for the priority of *geology* in planetary science.

  They are not disagreeing about Pluto; they are disagreeing about what *science* should prioritize. The "unhappy" part is that dissolving the dispute (admitting it's verbal) doesn't solve their problem, because they still need to decide which department gets funding, which missions get launched, and which textbooks get written. They are fighting over a label because the label controls resources. Bennett would argue we should accept the verbal diagnosis (there is no "God's eye" fact about whether Pluto is a planet) but acknowledge the substantive pragmatic stakes that keep the argument alive.

  ### Overall Evaluation
  Dev has the stronger philosophical case. Renata successfully argues that definitions matter for theory (Move 3), but Dev successfully argues that multiple theories can be valid simultaneously (Move 4). Once we accept Kind Pluralism, the choice of which kind gets the specific English label "planet" is a matter of convention, not fact. They agree on all non-semantic facts (Pluto's mass, orbit, shape, neighbors). According to the Hirsch/Chalmers criterion, if they agree on the canonical description of the world, the remaining disagreement is verbal.

  However, the persistence of the argument is explained by Bennett's insight: they are treating a verbal dispute as substantive because the verbal outcome has substantive professional consequences.

  \verdict{verbal}
