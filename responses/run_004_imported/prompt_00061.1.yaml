answer: |-
  Here is a joke that should land well with a class that just grappled with the axioms:

  "I know we're all still recovering from the Knightian uncertainty tangent last week, so I want to start with something simple.

  When you break down the Ellsberg preferences, they imply that when you look at the unknown urn, you believe it has **fewer** Red balls than the known 50/50 urn... and you *also* believe it has **fewer** Black balls than the known 50/50 urn.

  So, technically, ambiguity aversion isn't a violation of Subjective Expected Utility Theory. It's just an accusation of urn-based inventory fraud.

  Now, since we can't actually sue the urn for false advertising, let's look at how we try to model this mathematically..."
