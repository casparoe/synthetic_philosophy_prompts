      *   **Pragmatic Encroachment Theorist (PE):** Let's call him *Marcus*. He focuses on the nature of knowledge as a norm for action and the subject's practical situation. He needs to defend the idea that the *subject's* stakes determine the epistemic position.

  3.  **Drafting - Section by Section:**

