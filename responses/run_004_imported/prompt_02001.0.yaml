answer: |-
  **Setting:** *A quiet corner of a 24-hour diner, 2:00 AM. Two empty coffee pots sit between them. Elena (Epistemic Contextualist) and Marcus (Pragmatic Encroachment Theorist) have spread napkins across the table, covered in diagrams of bank hours and stake levels.*

  **Elena:** Let's lock down the mismatch case. We need to be precise. Hannah is the subject. She needs to deposit a check to avoid foreclosure. High stakes for her. She has the same evidence as before: she was there two weeks ago on a Saturday. Now, enter Sarah. Sarah is an idle bystander. She's just chatting with a third party about Hannah. Sarah has nothing riding on this. Sarah says, "Hannah knows the bank is open." According to my view, Sarah speaks truly.

  **Marcus:** And according to mine, Sarah speaks falsely. Or at least, she asserts something that isn't the case. Hannah doesn't know. Her evidence hasn't improved, but the cost of error has skyrocketed. If knowledge is the norm of practical reasoning, Hannah shouldn't act on this belief without checking. If she shouldn't act, she doesn't know. So when Sarah says she does, Sarah is wrong about Hannah's epistemic position.

  **Elena:** But you're conflating the *propriety* of Hannah's action with the *truth* of Sarah's statement. Sarah isn't advising Hannah. Sarah is describing Hannah from a context where foreclosure is not a salient possibility. In Sarah's mouth, "knows" picks out a relation that requires only standard evidence. In Hannah's mouth, "knows" would pick out a relation requiring ironclad proof. You're treating "knows" as if it denotes a single, rigid relation between a mind and a fact, independent of the conversational context.

  **Marcus:** I'm treating "knows" as tracking a real normative status. Look, Elena, if I tell you, "That ladder is safe," but you're carrying a priceless vase and I'm carrying a bag of groceries, my assertion is misleading even if the ladder holds my weight. But with knowledge, you're saying Sarah's assertion is *true*. That implies that for Sarah, Hannah *is* in a position of knowledge. But Hannah can't deposit the check based on that! If Sarah told Hannah, "You know it's open, go deposit it," and Hannah bounced the check, Hannah would be furious. She'd say, "I didn't know!"

  **Elena:** And that's exactly where the data gets interesting. If Hannah heard Sarah, she might object. But that objection doesn't prove Sarah false; it proves Sarah's context wasn't shared. Think about "tall." If I say, "That jockey is tall," I speak truly in the context of jockeys. If you say, "That jockey isn't tall," you speak truly in the context of NBA players. We aren't disagreeing about the jockey's height in inches. We're disagreeing about the comparison class. Similarly, Sarah and Hannah aren't disagreeing about the evidence. They're operating with different semantic standards for "knows."

  **Marcus:** Here is where I hit you with the charge we discussed earlier. The "Obliviousness Objection." If contextualism is right, "knows" is indexical, like "here" or "tall." But when ordinary speakers argue about the bank case, they don't feel like they're talking past each other. They feel like they are disagreeing about the *same* fact. If I say "Hannah knows" and you say "Hannah doesn't," we feel a genuine tension. If your theory were right, we should just shrug and say, "Oh, you're using a low standard, I'm using a high standard." But we don't. We dig in. Why are speakers so oblivious to this supposed context-sensitivity?

  **Elena:** Because it's *covert* context-sensitivity. Most indexicals are covert. If we're looking at a map and I say, "It's flat here," and you say, "No, it's not," regarding a hilly region, we don't immediately think, "Ah, you mean flat for hiking, I mean flat for building." We think we're contradicting. It takes philosophical reflection to see that the standard shifted. The linguistic mechanism operates below the radar. The fact that we feel disagreement is an illusion generated by the failure to recognize the shift in semantic value. The "tension" you feel is pragmatic, not semantic. We assume our interlocutor shares our conversational score. When they don't, it feels like a clash, but it's actually just a mismatch of parameters.

  **Marcus:** That's a convenient save, but it comes at a cost. You're buying linguistic plausibility at the price of metaphysical instability. Let's turn the table on me now. Your view implies that Hannah's epistemic standing changes depending on who is talking about her. If Sarah talks, Hannah knows. If a loan officer talks, Hannah doesn't. How can Hannah's own relation to the truth fluctuate based on *my* conversation? That makes knowledge extrinsic in a way that feels wrong. It makes my knowledge depend on your gossip.

  **Elena:** It doesn't make *your* knowledge depend on my gossip. It makes the truth of *my sentence* about your knowledge depend on my context. Hannah's mental state is fixed. The world is fixed. The only thing shifting is the word "knows" and the proposition it expresses. You're worried about metaphysical magic; I'm offering semantic precision.

  **Marcus:** But I'm the one defending the stability of the subject's position! That's the irony here. On Pragmatic Encroachment, Hannah's knowledge status depends on *Hannah's* stakes. It's stable relative to her situation. If her stakes are high, she doesn't know, regardless of whether Sarah is gossiping low-stakes or a loan officer is shouting high-stakes. The truth-maker is the subject's practical environment, not the attributor's conversational score.
  However, I have to answer your charge about "knowledge loss." You think it's absurd that Hannah loses knowledge just because the stakes rise without new evidence.

  **Elena:** Precisely. Yesterday, low stakes, she knew. Today, high stakes, same evidence, she doesn't know. Did her mind change? Did the world change? No. Only the consequences of being wrong changed. How can a practical factor toggle a truth-tracking status on and off? It suggests knowledge isn't about truth at all, but about insurance.

  **Marcus:** It *is* about truth, but knowledge is a tool for navigation. Think of a bridge. It has a structural integrity rating. If I'm walking across, it's "safe." If I'm driving a tank across, it's "unsafe." Did the bridge change? No. Did the evidence about the bridge's bolts change? No. But the status "safe-for-X" changed because X changed. Knowledge is "safe-for-action." When the action requires more certainty, the same evidence no longer suffices to make the belief knowledge. Hannah doesn't lose a mental state; she loses the *license* to treat that belief as certain. And since knowledge *is* that license, she loses knowledge. It's not magic; it's a change in the sufficiency conditions for the concept.

  **Elena:** But then you have to explain why we use the word "knows" at all. If it's just "sufficient for action," why not say "Hannah is justified in acting"? Why drag in truth and belief?
  Let's step back. We've been fighting over the bank case for an hour. We need to ask the question we ran out of energy for last night. Is this disagreement substantive? Or are we just proposing two different bookkeeping schemes for the same underlying facts?
  We agree on the non-semantic facts: Hannah has evidence *E*. Hannah has stakes *S*. Sarah has stakes *S-prime*. We agree on the behavioral predictions: Hannah should check the hours. Sarah can casually assert the bank is open. The only thing we disagree on is whether to label Sarah's assertion "True" and whether to label Hannah's state "Knowledge."

  **Marcus:** If that were all it was, it would be verbal. A mere dispute over how to apply the label "knows." But I think it's deeper. If I'm right, then there is a normative fact of the matter about whether Hannah is in a position to close inquiry. If you're right, there is no such fact independent of a conversational context. That's a metaphysical disagreement, not a linguistic one. I'm saying there is a real relation—Knowledge—that is sensitive to practical factors. You're saying there is a word—"knows"—that is sensitive to conversational factors.

  **Elena:** Okay, let's test that. Suppose we ban the word "knows." We replace it with "epistemically positioned to act."
  In the mismatch case: Sarah says, "Hannah is epistemically positioned to act."
  If you're right (PE), this is false, because Hannah's stakes are too high for her evidence.
  If I'm right (EC), this sentence is *also* context-sensitive. "Positioned" is gradable. Positioned for what? For Sarah's purposes? Or Hannah's?
  It seems the context-sensitivity infects *any* predicate we use to capture the epistemic norm.

  **Marcus:** That suggests the context-sensitivity is in the *norm* itself, not just the word. But here is the crux of the substantive/verbal distinction. If we can translate every claim I make into your framework without loss of information, it's verbal.
  Can I say what you say? I can say, "In Sarah's low-stakes context, the sentence 'Hannah knows' is true." I can grant that.
  Can you say what I say? Can you say, "Hannah is not in a position to act, and that is a context-invariant fact about her"?

  **Elena:** I can say that. I can say, "Relative to Hannah's high-stakes practical environment, her evidence is insufficient to warrant action." I can grant that fact.
  So, we agree on:
  1. Hannah's evidence is fixed.
  2. Hannah's stakes are high.
  3. Hannah should not act without checking.
  4. Sarah's utterance is appropriate in her low-stakes context.
  5. Hannah's utterance would be inappropriate in her high-stakes context.

  **Marcus:** So where is the fight? It's over the truth-value of the sentence "Hannah knows" uttered by Sarah.
  I say: False. Because the proposition expressed is that Hannah has sufficient evidence for *her* stakes, which she doesn't.
  You say: True. Because the proposition expressed is that Hannah has sufficient evidence for *Sarah's* conversational purposes.

  **Elena:** Exactly. So the disagreement is about the *semantics of the attribution*. Is "knows" anchored to the subject's environment or the attributor's environment?
  If it's anchored to the attributor (EC), then Sarah speaks truly.
  If it's anchored to the subject (PE), then Sarah speaks falsely.
  This isn't merely verbal in the sense of defining a word. It's about how language hooks onto the world. If I'm right, language is flexible and serves conversational ease. If you're right, language is rigid and serves normative accuracy.

  **Marcus:** But does that difference matter outside the philosophy seminar?
  Suppose Sarah tells Hannah, "You know it's open."
  If I'm right, Sarah gave bad advice. She asserted a falsehood. She is blameworthy if she should have realized Hannah's stakes.
  If you're right, Sarah spoke truly, but she was misleading. She asserted a truth that implicated Hannah could act.
  The practical upshot is the same: Sarah shouldn't have said that to Hannah.

  **Elena:** But consider a court case. A witness testifies, "I knew the light was green." The stakes are life and death.
  If I'm right, the defense lawyer can argue, "In the context of this courtroom, 'knows' requires video evidence. The witness only has memory. So the sentence 'I knew' is false in this context."
  If you're right, the lawyer argues, "Given the stakes of this trial, the witness's memory does not amount to knowledge. So the sentence is false."
  The verdict is the same. The reasoning differs.
  Maybe... maybe the disagreement is substantive in metaphysics but verbal in practice?

  **Marcus:** I don't think it's merely verbal. If I'm right, then *I* can know things that *you* cannot, if my stakes are lower, even if we have the same evidence. That changes how we view the distribution of knowledge in society. It makes knowledge an achievement sensitive to one's practical vulnerability.
  If you're right, knowledge is cheap and abundant; we just talk about it differently depending on how careful we need to be.
  That's a different picture of the human mind. On my view, the anxious person knows less than the carefree person, ceteris paribus. On your view, they know the same amount, but we describe them differently.

  **Elena:** That is a genuine divergence. The "Anxious Person" test.
  If the anxious person has high stakes, and I say "She knows," I am speaking truly (EC).
  If you say "She doesn't know," you are speaking truly (PE).
  We cannot both be right about the *same proposition*.
  So, either "knows" expresses different propositions (EC), or it expresses the same proposition and one of us is wrong (PE).
  If we can't agree on which proposition is being expressed, we can't settle the truth value.
  But we *do* disagree on whether the anxious person has the property that licenses assertion.
  I say she has it (relative to low standards). You say she lacks it (simpliciter).

  **Marcus:** And that's where we stall. I think "simpliciter" is the only game in town. There is no "knowledge relative to low standards." There is just knowledge, and it's hard to get when stakes are high. You think there are many knowledge-relations, and we select one by talking.
  I think that fragments the concept too much. If knowledge is the norm of assertion, and assertion is a single practice, there must be a single norm.
  But... I concede this: If we define "Contextualism" as "The word 'knows' is context sensitive" and "Encroachment" as "Practical stakes affect epistemic status," we might be talking about different layers.
  You are doing philosophy of language. I am doing epistemology.

  **Elena:** And yet, epistemology relies on the language we use to report epistemic status. If the language is slippery, the epistemology might be chasing shadows.
  However, I will grant you this: If your theory implies that the *property* of knowledge changes without evidence change, you bear a heavy metaphysical burden. You need to explain *how* practical facts turn true belief into knowledge or vice versa. That's a causal or constitutive mystery.
  My mystery is merely linguistic: Why don't speakers notice the shift?

  **Marcus:** And I'll grant you this: If your theory implies that truth values flip-flop based on idle gossip, you bear a heavy intuitive burden. You need to explain why we feel like we're contradicting each other when we aren't. That's a phenomenological mystery.

  **Elena:** So, substantive or verbal?
  If we agree on all the "ground level" facts—who has what evidence, who should do what, who is blameworthy for asserting what—then the dispute is over how to map the word "knows" onto those facts.
  That sounds verbal.
  But... the mapping *is* the philosophy. If we map it your way, we change how we understand the mind's relation to the world. If we map it my way, we change how we understand language's relation to the world.

  **Marcus:** Then it's substantive, because the maps dictate different future research programs. I go look for the mechanism of practical encroachment in cognitive architecture. You go look for the syntactic triggers of context-sensitivity in epistemic sentences.
  We aren't describing the same elephant. We're describing different elephants that happen to stand in the same spot.

  **Elena:** *Signals the waiter for the check.* Then I suppose we can't settle it tonight. But I think we've established that the mismatch case isn't a stalemate; it's the fault line.
  In the mismatch case, your theory says Sarah is wrong. Mine says she's right.
  If we could find a case where Sarah's being "wrong" has a different consequence than Sarah's being "right," we'd have a test.

  **Marcus:** Like a bet. If I bet Sarah that her statement is true...
  If I'm right, I win the bet (because her statement is false).
  If you're right, I lose the bet (because her statement is true).
  But to settle the bet, we need a judge. And the judge will have stakes. And the judge's context will determine the truth... or the judge's stakes will determine the knowledge...

  **Elena:** *Laughs.* We've just recreated the regress.
  Okay. Truce? We agree that the attributor/subject mismatch is the place to look. We agree that EC protects the truth of ordinary speech at the cost of semantic stability. We agree that PE protects the normative force of knowledge at the cost of evidence stability.

  **Marcus:** Truce. But I'm still paying for coffee. I know I have enough money for that, regardless of the stakes.

  **Elena:** See? You just used "know." And you were right.
  *Pause.*
  Wait. What are your stakes for paying?

  **Marcus:** *Groans.* Don't start.
