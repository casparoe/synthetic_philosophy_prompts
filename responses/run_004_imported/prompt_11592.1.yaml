prompt: |-
  My sister, a scholar of Madhyamaka Buddhism who has spent years translating Candrakīrti's Prasannapadā, is marrying her partner next month. She's asked me, as her maid of honor, to give the toast. Half the room will be her colleagues in Buddhist philosophy; the other half won't know what "emptiness" means in this context. Her one request is that the catuṣkoṭi, Nāgārjuna's tetralemma, appear somewhere in the toast, brought to bear on what she and her partner now are to each other, and that it never drift, as she insists these toasts always do, into a meditation on impermanence and loss. Write a four-minute toast that is rigorous enough to satisfy her colleagues without losing everyone else.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Maid of Honor (sibling of the bride).
      *   **Audience:** 50% Buddhist philosophy scholars (specifically Madhyamaka/Candrakīrti specialists), 50% laypeople (don't know "emptiness").
      *   **Bride:** Scholar of Madhyamaka Buddhism, translator of Candrakīrti's *Prasannapadā*.
      *   **Groom:** Partner (implied supportive of her work, but role isn't specified beyond "partner").
      *   **Key Constraint 1:** Must include the *catuṣkoṭi* (Nāgārjuna's tetralemma).
      *   **Key Constraint 2:** Apply the *catuṣkoṭi* to the relationship status ("what they now are to each other").
      *   **Key Constraint 3:** *Strictly avoid* drifting into meditation on impermanence (*anitya*) and loss. This is crucial. Madhyamaka often leads people to think "nothing matters because it's empty/impermanent," but the bride wants to avoid the melancholy/nihilistic trap.
      *   **Tone:** Rigorous enough for scholars, accessible enough for laypeople, celebratory, warm.
      *   **Length:** Four minutes (approx. 500-600 words spoken at a moderate pace).

  2.  **Deconstruct the *Catuṣkoṭi* (Tetralemma):**
      *   The four positions regarding a proposition $X$:
          1.  $X$ is true (Being).
          2.  $X$ is false (Non-being).
          3.  $X$ is both true and false.
          4.  $X$ is neither true nor false.
      *   In Madhyamaka, this is used to deconstruct inherent existence (*svabhāva*).
      *   *Challenge:* How to apply this to marriage without concluding "marriage doesn't exist"?
      *   *Solution:* Use it to show that the relationship transcends logical categorization, making it *more* real in a conventional sense (*saṃvṛti-satya*), not less. Focus on dependent arising (*pratītyasamutpāda*) as the ground of connection, not the ground of negation.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split audience. Establish the sibling bond. Set the tone (joyful, not funereal).
      *   **The "Emptiness" Explanation (for the laypeople):** Need a quick, non-technical definition. "Empty of isolation" rather than "empty of existence."
      *   **The Core Constraint (The Tetralemma):** This needs to be the centerpiece.
          *   Proposition: "They are married."
          *   1. They are married (Conventionally true).
          *   2. They are not married (Ultimately, no inherent "marriage" entity).
          *   3. Both (It's a dynamic process).
          *   4. Neither (It defies definition).
          *   *Twist:* Instead of stopping at negation, pivot to *freedom*. Because it's not fixed, it's flexible. Because it's empty, it can hold everything.
      *   **Avoiding Impermanence/Loss:** Explicitly steer away from "this will end" or "cherish it while it lasts." Focus on the *quality* of the present connection. The "now."
      *   **Closing:** A wish for their future. A toast.

  4.  **Refining the Philosophy (Madhyamaka Check):**
      *   *Candrakīrti/Prasannapadā:* Known for the *Prāsaṅgika* method (reductio ad absurdum) and strong defense of conventional truth.
      *   *Constraint Check:* The bride hates when toasts turn into "everything dies." So, emphasize *conventional truth* (*vyavahāra-satya*). Love is real *because* it is dependent, not *despite* being empty.
      *   *Tetralemma Application:*
          *   Are they one? No.
          *   Are they two? No.
          *   Are they both? No.
          *   Are they neither? No.
          *   *Wait, standard tetralemma is:* Exist, Non-exist, Both, Neither.
          *   *Let's try:* "Are they husband and wife?"
          *   1. Yes (Legally, conventionally).
          *   2. No (No inherent essence of 'husband' or 'wife').
          *   3. Both (They play the roles while knowing the roles).
          *   4. Neither (Their love exceeds the labels).
      *   *Better approach for a toast:* Keep it simple.
          *   1. They are distinct individuals.
          *   2. They are a union.
          *   3. They are both.
          *   4. They are neither.
      *   *Actually, let's stick to the classic formulation regarding the relationship itself.*
      *   Let's frame it as: "What is this bond?"
      *   1. It exists.
      *   2. It does not exist.
      *   3. It both exists and does not.
      *   4. It neither exists nor does not.
      *   *Resolution:* The tetralemma clears the ground so love can grow without fixation.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. My sister translates old Indian texts. Some of you know what that means. For the rest, she studies how things don't have fixed selves. She asked me to use the four-cornered logic. So: 1. They are married. 2. They aren't. 3. Both. 4. Neither. But don't worry, this isn't sad. It means their love isn't trapped. It's free. So drink to freedom.

      *Critique 1:* Too dry. Needs more heart. Needs to explicitly address the "no impermanence" rule.

  6.  **Drafting - Attempt 2 (Adding Warmth & Rigor):**
      Start with the translation work. It's hard. She finds clarity. Now she applies it to love.
      Explain *Śūnyatā* (Emptiness) as "room to move."
      Insert the *Catuṣkoṭi*.
      1. Is there a marriage? Yes, we are here.
      2. Is there a marriage? No, no inherent essence.
      3. Both? Yes, conventional and ultimate.
      4. Neither? It's beyond words.
      Crucial pivot: This doesn't mean it's fake. It means it's not a cage.
      Avoid "it will end." Focus on "it is alive."
      Toast to the Middle Way.

  7.  **Polishing and Timing:**
      *   Word count check: 130-150 words per minute is standard speaking pace. 4 minutes = ~550 words.
      *   Ensure the Sanskrit terms are used correctly but explained.
      *   Make sure the "no loss" constraint is felt. The tone should be abundant, not renunciatory.

  8.  **Final Review against Constraints:**
      *   *Catuṣkoṭi* included? Yes.
      *   Applied to relationship status? Yes.
      *   No impermanence/loss meditation? Yes, focus on the vitality of dependence.
      *   Rigorous for scholars? Uses *svabhāva*, *pratītyasamutpāda*, *catuṣkoṭi* correctly.
      *   Accessible for laypeople? Metaphors used (dance, architecture).

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't accidentally imply nihilism in the "non-existence" limb of the tetralemma. Frame it as "not fixed."
      *   *Correction:* Ensure the "no impermanence" rule is respected. Don't say "even though it won't last." Say "because it is alive now."
      *   *Reference:* Mention *Prasannapadā* specifically to please the colleagues.

  10. **Final Word Count Check:** (Aiming for ~600 words).

  *(Self-Correction during final output generation)*: I need to make sure the transition from the tetralemma to the toast is uplifting. The tetralemma can feel like a logical dead-end, so I need to frame it as a *liberation* into the conventional world of love.

