          *   Jeffrey Updating: Rescaling axes.
          *   If axes are coupled (correlated), rescaling X changes the projection onto Y.
          *   If axes are orthogonal (independent), rescaling X does not affect Y.

  4.  **Refining the Argument (Self-Correction/Verification):**
      *   *Did I explain Rigidity correctly?* Rigidity (Sufficiency): $P^*(H|E_i) = P(H|E_i)$.
      *   *Why does commutativity fail?*
          *   Let $P_1$ be update on $\mathcal{E}$. $P_1(H) = \sum P(H|E_i) P^*(E_i)$.
          *   Let $P_{12}$ be update on $\mathcal{F}$ after $\mathcal{E}$. $P_{12}(H) = \sum_j P_1(H|F_j) P^{**}(F_j)$.
