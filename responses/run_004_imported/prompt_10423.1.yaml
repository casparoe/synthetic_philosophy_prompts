          *   *The Intuition:* When you update on Partition $\mathcal{E}$, you change the weights of $E_i$. If Partition $\mathcal{F}$ is correlated with $\mathcal{E}$, the probabilities of $F_j$ *automatically shift* as a side effect of the first update (even though Rigidity holds for $\mathcal{E}$).
          *   When you apply the second update on $\mathcal{F}$, you are forcing $P(F_j)$ to a specific target value.
          *   *The Conflict:* In Order 1 ($\mathcal{E}$ then $\mathcal{F}$), the second step has to "fight" against the drift caused by the first step. In Order 2 ($\mathcal{F}$ then $\mathcal{E}$), the second step fights against a different drift.
          *   Because the "drift" depends on the correlation structure, and the "fight" (the likelihood ratio adjustment) depends on the current baseline, the final result differs.
          *   *Key Phrase:* "Rigidity is local, but correlation is global." Rigidity ensures $P(H|E_i)$ stays fixed *during* the update on $\mathcal{E}$. It does not ensure that the *marginals* of a different partition $\mathcal{F}$ remain untouched, nor does it ensure that the conditional probabilities $P(H|F_j)$ remain invariant under the update on $\mathcal{E}$.
          *   Wait, Rigidity says $P_{new}(H|E_i) = P_{old}(H|E_i)$. It says nothing about $P_{new}(H|F_j)$.
          *   So, Update 1 changes $P(H|F_j)$ implicitly. Update 2 assumes Rigidity on $F_j$ relative to the *new* prior. But if Update 1 changed $P(H|F_j)$, Update 2 is locking in a *different* conditional probability than if Update 2 had gone first.
          *   *This is the crux:* Rigidity preserves conditionals relative to the partition being updated. It does *not* preserve conditionals relative to other partitions. If the partitions overlap/correlate, Update 1 alters the conditional probabilities relevant to Update 2's rigidity condition.

      *   **The Condition for Commutativity:**
          *   Cite Diaconis and Zabell (1982).
          *   The condition is **Probabilistic Independence** of the two partitions under the prior $P$.
          *   $P(E_i \cap F_j) = P(E_i)P(F_j)$ for all $i, j$.
          *   *Why this works:* If they are independent, updating on $\mathcal{E}$ does not change the marginal probabilities of $\mathcal{F}$. Therefore, the second update starts with the original marginals for $\mathcal{F}$, just as if it had gone first. Furthermore, the conditional probabilities $P(H|F_j)$ are not disturbed by the update on $\mathcal{E}$ (because $E$ provides no info on $F$).
          *   *Is it non-question-begging?* Yes, independence is a structural property of the probability space, not a stipulation about the update rule itself.

