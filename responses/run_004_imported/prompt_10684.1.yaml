answer: |-
  This is a fantastic question to grapple with in a formal epistemology seminar. You have correctly identified the crux of the Nover and Hájek paper: the move from "infinite expectation" (St. Petersburg) to "undefined expectation" (Pasadena).

  The objection you mention—that we should just privilege the "natural" temporal order of the tosses—is the most common pushback students and philosophers have. It feels intuitive to say, "The game happens in time, so sum it in time."

  Here is an unpacking of why Nover and Hájek reject that privilege, and why the Pasadena game threatens Expected Utility Theory (EUT) more profoundly than the original St. Petersburg paradox.

  ### 1. Why we shouldn't privilege the "Natural Order"

  To understand why the chronological order of tosses shouldn't dictate the summation order, we need to look at what a "gamble" actually is in decision theory.

  **A. Gambles are Atemporal Objects**
  When you decide whether to accept the Pasadena game, you are not deciding whether to accept Toss 1, then Toss 2, then Toss 3. You are deciding whether to accept the *entire contract* at once.
  Think of the game as a bag of tickets. Inside the bag is a ticket for "Heads on 1" (value +2), a ticket for "Heads on 2" (value -2), a ticket for "Heads on 3" (value +8/3), and so on. Each ticket has a probability weight attached to it.
  When you calculate the Expected Value (EV), you are asking: "What is the weighted value of this bag?"
  Does the value of the bag depend on the order in which you pull the tickets out to count them? Intuitively, no. The value is a property of the *collection*, not a property of your *counting procedure*. If EV is supposed to represent the objective worth of the gamble, it cannot depend on the subjective order in which the agent chooses to process the outcomes.

  **B. The Arbitrariness of Indexing**
  The "natural order" relies on the index $n$ (the toss number). But $n$ is just a label we assigned to the outcomes.
  Imagine I offer you the same game, but I write the contract differently. I group all the positive payouts together and all the negative payouts together.
  *   **Contract A:** "We toss until heads. If $n$ is odd, you win $X$. If $n$ is even, you pay $Y$."
  *   **Contract B:** "We toss until heads. We list all possible odd outcomes first, then all possible even outcomes."
  Physically and probabilistically, Contract A and Contract B are identical. The coin doesn't know how you wrote the contract. If the EV is $\ln(2)$ under Contract A (natural order) but $+\infty$ under Contract B (positives first), then the value of the game depends on the *paperwork*, not the *risk*. That violates the basic principle that equivalent prospects should have equivalent values.

  **C. Expectation as an Integral, Not a Series**
  In rigorous probability theory (Kolmogorov's axiomatization), Expectation is defined as a **Lebesgue integral** over a sample space, not a Riemann sum over a sequence.
  A key feature of the Lebesgue integral is that it is **order-independent**. For an expectation to be well-defined in standard probability theory, the integral of the absolute value must be finite (absolute convergence).
  *   If $\sum |p_i x_i| < \infty$, the order doesn't matter.
  *   If $\sum |p_i x_i| = \infty$ (as in Pasadena), the Lebesgue integral *does not exist*.
  By insisting on the natural order, you are trying to force a Lebesgue problem into a Riemann solution. Nover and Hájek are arguing that if we are doing formal epistemology, we must respect the formal definition of expectation. If the math says "undefined," saying "but intuitively it's $\ln(2)$" is an attempt to change the definition of EV to suit a specific paradox.

  ### 2. Why Pasadena is a Deeper Problem than St. Petersburg

  It is tempting to think Pasadena is just "St. Petersburg with negative numbers." But structurally, it breaks EUT in a way St. Petersburg does not.

  **A. Divergence vs. Undefinedness**
  *   **St. Petersburg:** The expectation is **$+\infty$**.
      *   The series is $1 + 1 + 1 + \dots$. No matter how you rearrange these terms, the sum is always $+\infty$. The value is *order-independent*, it is just *infinite*.
      *   **The Fix:** This is primarily a problem for *utility*, not probability. We can solve St. Petersburg by saying utility is bounded (Bernoulli's solution). If utility is bounded, the series converges absolutely, and the paradox vanishes.
  *   **Pasadena:** The expectation is **undefined**.
      *   The series is $1 - 1/2 + 1/3 - 1/4 \dots$.
      *   **The Fix:** Bounding utility *does* fix Pasadena (because the terms shrink fast enough), but that concedes that EUT cannot handle unbounded utility *at all*.
      *   More importantly, even if we keep linear utility, St. Petersburg allows for **ranking**. You can say, "Game A (St. Pete) is better than Game B (\$1 million)," because $\infty > 1,000,000$.
      *   Pasadena does **not** allow for ranking. If the EV is undefined, EUT cannot tell you if Pasadena is better than, worse than, or equal to a sure \$5. It creates **decision paralysis**. A theory that cannot rank options is more broken than a theory that ranks them counter-intuitively.

  **B. The Collapse of the Law of Large Numbers**
  The justification for EV is usually that it represents the long-run average payoff.
  *   **St. Petersburg:** If you play the game many times, your average payoff will grow without bound. It matches the $\infty$ EV (in a sense).
  *   **Pasadena:** If you play the Pasadena game many times, the average payoff **does not converge to $\ln(2)$**. Because the variance is effectively infinite (due to the lack of absolute convergence), the sample mean fluctuates wildly and does not settle on the "natural order" sum.
      *   This means $\ln(2)$ is not even the "fair price" in the long run. There is *no* number that represents the long-run average. This severs the link between Expected Value and actual empirical performance more drastically than St. Petersburg does.

  **C. Vulnerability to "Money Pumps"**
  Because the Pasadena expectation is order-dependent, an agent who insists the value is $\ln(2)$ (based on natural order) can be exploited if they encounter a "rearranged" version of the game.
  If an agent accepts the natural order as canonical, they might be willing to pay $\ln(2)$ to play. But if a clever bookie offers them a derivative contract that effectively sums the outcomes in a different order (e.g., via a complex betting structure that realizes the positive outcomes before the negative ones), the agent's valuation becomes inconsistent.
  St. Petersburg agents are irrational for paying finite amounts for infinite EV; Pasadena agents are irrational for having *any* specific finite valuation at all.

  ### Summary for the Seminar

  You can frame the distinction this way:

  The **St. Petersburg Paradox** tells us that **Expected Utility Theory yields results that are too big for the real world.** It challenges the *plausibility* of the output (infinite money), which we can fix by constraining the utility function.

  The **Pasadena Game** tells us that **Expected Utility Theory yields no result at all.** It challenges the *coherence* of the output. It shows that without absolute convergence, the very concept of "Expectation" loses its order-independence, which is a necessary condition for it to be an objective measure of value.

  Privileging the "natural order" saves the calculation, but it does so by abandoning the mathematical definition of expectation that makes EUT a rigorous theory in the first place. It turns EV from a property of the *gamble* into a property of the *narrative* we tell about the gamble.
