prompt: |-
  I sit on the editorial standards committee at the science magazine where I work, and we've reached a genuine impasse. A reporter's draft on a proposed new fundamental particle stated flatly that 'physicists have discovered' it. One committee member now wants us to adopt a standing rule: any claim about unobservable theoretical entities must be hedged (e.g., 'current evidence suggests'), since history is littered with once-confident theories -- phlogiston, caloric, the luminiferous ether -- that turned out not to exist, so today's confident talk of quarks or dark matter deserves the same caution. A more senior editor thinks this is a serious overcorrection: applied consistently, it would make our coverage of evolution, plate tectonics, and climate change sound as tentative as our coverage of string theory or the multiverse -- which he thinks misrepresents how settled that science actually is and hands ammunition to denialists. Both have a real point, and neither will budge. Please draft the short memo I'll circulate before Monday's meeting: give reporters and editors usable criteria -- not just 'it depends' -- for when and how much to hedge, show how those criteria would sort the examples above, and take seriously what's right about the blanket-hedging instinct before explaining why the committee is or isn't adopting it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the editorial standards committee at a science magazine.
      *   **Task:** Draft a short memo to circulate before Monday's meeting.
      *   **Problem:** Impasse between two editors regarding hedging language for theoretical entities.
          *   *Editor A (Pro-Hedging):* Wants mandatory hedging for unobservable theoretical entities (e.g., "current evidence suggests") due to historical precedents of false theories (phlogiston, ether).
          *   *Editor B (Anti-Overcorrection):* Thinks this is too extreme. It would make settled science (evolution, climate change) sound as tentative as speculative science (string theory), aiding denialists.
      *   **Requirements:**
          *   Provide usable criteria (not just "it depends").
          *   Show how criteria apply to the specific examples (particle, evolution, climate, string theory, historical errors).
          *   Acknowledge the validity of the pro-hedging instinct.
          *   State a recommendation (adopt or reject the blanket rule).
          *   Tone: Professional, diplomatic, decisive but open to discussion, clear.

  2.  **Determine the Stance/Recommendation:**
      *   The prompt asks me to "take seriously what's right about the blanket-hedging instinct before explaining why the committee is or isn't adopting it."
      *   *Logic:* Editor B has the stronger practical argument. A blanket rule for *all* unobservable theoretical entities creates false equivalence between well-supported theories (atoms, germs, evolution) and speculative ones (multiverse). However, Editor A is right that we shouldn't speak of *new, tentative* discoveries as absolute facts.
      *   *Solution:* Reject the *blanket* rule but adopt a *graded* framework based on evidentiary consensus and predictive success, not just "observability." This bridges the gap. We acknowledge the history of error (A's point) but distinguish between robust inference and speculation (B's point).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the impasse respectfully. Validate both sides.
      *   **The Core Principle:** Define *why* we hedge. It's not about "observability" (since electrons aren't directly seen either); it's about *epistemic status* (consensus, predictive power, independent verification).
      *   **The Criteria (The "Usable" Part):** Need a tiered system.
          *   *Tier 1: Settled Science.* (Evolution, Climate, Standard Model particles). Direct/indirect evidence is overwhelming. No hedging needed on existence.
          *   *Tier 2: Emerging/Contested.* (The new particle in the draft). Evidence is strong but needs replication. Hedge on *certainty*, not existence.
          *   *Tier 3: Speculative/Theoretical.* (String theory, Multiverse). Little to no empirical evidence. Heavy hedging required.
      *   **Applying the Criteria:** Walk through the examples provided in the prompt.
          *   *Phlogiston/Ether:* Failed predictive power. (Good cautionary tales, but not analogues for current robust theories).
          *   *New Particle:* Tier 2. Needs "evidence indicates" rather than "discovered."
          *   *Evolution/Climate:* Tier 1. No hedging on existence/reality.
          *   *String Theory:* Tier 3. Heavy hedging.
      *   **Addressing the "Blanket Rule":** Explicitly state why we aren't adopting Editor A's specific rule (it conflates inference with speculation) while validating their caution (humility is good).
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Avoid taking sides aggressively. Use "we" language.
      *   Ensure the distinction between "unobservable" and "inferred" is clear. (Electrons are unobservable to the naked eye but their effects are measurable; phlogiston was inferred but had no measurable effects consistent with reality).
      *   Make sure the criteria are actionable for reporters.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between "observable" and "unobservable" too philosophical?
      *   *Fix:* Shift the focus to "empirical verification" and "consensus." Reporters understand peer review and replication better than ontology.
      *   *Critique:* Did I address the specific draft about the new particle?
      *   *Fix:* Ensure the recommendation specifically addresses that draft as a test case.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep it tight. Bullet points for criteria.

  6.  **Final Polish:** Check against the prompt requirements one last time.
      *   Usable criteria? Yes (The 3-Tier Framework).
      *   Sort examples? Yes (Applied section).
      *   Take pro-hedging seriously? Yes (Acknowledged in intro and rationale).
      *   Decision made? Yes (Reject blanket rule, adopt framework).

  7.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Graded Hedging Standards on Theoretical Entities

  Colleagues,

  Regarding the impasse over our recent draft on the proposed new fundamental particle: both arguments presented this week are correct in principle but insufficient as a standalone policy.

  The argument for mandatory hedging correctly identifies that science is fallible. History (phlogiston, the ether) teaches us that confident claims about unobserved entities can be embarrassing retroactively. However, the argument against overcorrection correctly identifies that not all inferences are equal. Treating the existence of electrons, tectonic plates, or SARS-CoV-2 as equally tentative as string theory misrepresents the weight of evidence and undermines public trust.

  We cannot adopt a blanket rule based on "observability," as almost all fundamental science relies on inference. Instead, I propose we adopt a **Three-Tier Evidentiary Framework** to determine hedging. This moves the decision from ontology (is it real?) to epistemology (how sure are we?).

  ### The Framework

  **Tier 1: Consensus Reality (No Hedging Required)**
  *   **Criteria:** The entity or mechanism is supported by multiple independent lines of evidence, has high predictive success, and is accepted by the relevant scientific consensus. Direct observation is not required; robust inference is sufficient.
  *   **Language:** Definitive (e.g., "is," "does," "causes").
  *   **Examples:** Quarks, genes, plate tectonics, human contribution to climate change, evolution by natural selection.
  *   **Rationale:** Refusing to state these as fact creates a false balance that aids denialism.

  **Tier 2: Emerging/Contested Findings (Moderate Hedging)**
  *   **Criteria:** Strong initial data exists, but independent replication is pending, statistical significance is near thresholds, or the theoretical interpretation is currently debated within the field.
  *   **Language:** Cautious but specific (e.g., "evidence suggests," "data indicate," "researchers report"). Avoid "discovered" until replication is confirmed.
  *   **Examples:** The new particle in the current draft; potential biosignatures on exoplanets; new hominid fossils where classification is disputed.
  *   **Rationale:** This satisfies the need for humility without implying the finding is likely false.

  **Tier 3: Speculative Theory (Heavy Hedging)**
  *   **Criteria:** The entity is posited to solve a theoretical problem but lacks direct or indirect empirical verification, or the model is one of many competing explanations with no current way to falsify them.
  *   **Language:** Hypothetical (e.g., "proposed," "hypothetical," "if the theory holds," "models predict").
  *   **Examples:** String theory, the multiverse, dark energy *interpretations* (distinct from the observed acceleration).
  *   **Rationale:** This acknowledges the theoretical nature without granting undue factual status.

  ### Application to Current Disputes

  *   **The New Particle (Current Draft):** This falls into **Tier 2**. It is not Tier 1 (not yet replicated/consensus) but not Tier 3 (there is actual data, not just math). The text should change from "physicists have discovered" to "physicists have found evidence of" or "data suggest the existence of."
  *   **Phlogiston/Ether:** These were Tier 3 claims that were eventually falsified. They justify caution for Tier 2 claims, but they are not analogues for Tier 1 claims which have survived rigorous falsification attempts.
  *   **Evolution/Climate:** These are **Tier 1**. Applying Tier 2 hedging here ("theory suggests") would be an editorial error equivalent to saying "evidence suggests the earth is round."

  ### Recommendation

  I recommend we **reject the blanket hedging rule** but **adopt the Three-Tier Framework** above.

  This validates the caution of the pro-hedging position by ensuring Tier 2 and 3 claims are never overstated, while protecting the integrity of Tier 1 science from false equivalence. It gives reporters a actionable checklist: *Is this replicated? Is there consensus? Is there predictive power?*

  Please review this framework prior to Monday. I'd like to vote on adopting this as interim policy so we can clear the backlog of drafts waiting on this decision.

  Regards,

  [Your Name]
  Editorial Standards Committee
