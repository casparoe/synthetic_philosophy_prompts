answer: |-
  Galen Strawson's "Basic Argument" is one of the cleanest, most devastating pieces of reasoning in contemporary metaphysics. It asserts that to be morally responsible for an action, you must be responsible for the mental nature that produced it. Since you cannot be responsible for your initial mental nature without already having a prior mental nature to choose it, you face an infinite regress. The only way to stop it is to be *causa sui* (self-caused), which is impossible. Therefore, ultimate moral responsibility is impossible, regardless of whether determinism is true.

  The logic is tight. But the conclusion only matters if we accept the premise that "ultimate responsibility" is the only kind worth wanting. I will argue that even if Galen is right about *ultimate* responsibility, his argument fails to threaten the practical, interpersonal responsibility defended by compatibilists like John Martin Fischer and Mark Ravizza. Furthermore, Galen's attack largely talks past the tradition initiated by his own father, P.F. Strawson. Finally, while Galen is correct that this view cannot ground *retributive* desert in a cosmic sense, that is a feature, not a bug: retributivism is the incoherent notion that should be discarded, not the compatibilist account of agency.

  ### Guidance Control vs. The Regress

  Fischer and Ravizza's theory of **Guidance Control** is designed specifically to survive the kind of metaphysical bombardment Galen Strawson employs. They distinguish between *Regulative Control* (the ability to do otherwise in a robust, libertarian sense) and *Guidance Control* (the ability to steer one's actions via a reasons-responsive mechanism that is one's own).

  Galen's Basic Argument targets Regulative Control. It demands that the *source* of the agent be ultimately self-authored. Fischer and Ravizza simply concede this point. They agree that we are not *causa sui*. We did not choose our genes, our upbringing, or the initial architecture of our deliberative mechanisms.

  However, they argue that responsibility does not require being the *ultimate creator* of your mechanism; it only requires **ownership** of that mechanism. If my decision-making process is "moderately reasons-responsive" (I would recognize and react to different reasons if they were present) and I have taken responsibility for this mechanism (viewing myself as the source of my actions in a social context), I possess Guidance Control.

  Galen's regress stops at the door of Guidance Control because Guidance Control doesn't try to open it. It says: "We don't need to trace the causal chain back to the Big Bang or a magical moment of self-creation. We only need to look at the here-and-now operation of the agency." If the mechanism is functioning properly and belongs to the agent, the agent is accountable. Galen's argument is valid, but it is an attack on a requirement (Ultimate Responsibility) that Guidance Control explicitly rejects as unnecessary.

  ### The Strawson Feud: A Family Dispute

  There is a profound irony in Galen Strawson's career. His Basic Argument is essentially a metaphysical assault on the tradition launched by his father, P.F. Strawson, in the seminal 1962 paper "Freedom and Resentment."

  P.F. Strawson argued that the entire debate about determinism and responsibility was a category error. He claimed that our practices of praise and blame are not grounded in metaphysical theories about causal chains, but in **reactive attitudes**—natural human emotions like resentment, gratitude, and indignation. These attitudes are constitutive of human relationships. We only suspend them when an agent is incapacitated (insanity, coercion, childhood), not when we contemplate the causal history of the universe.

  Galen's Basic Argument effectively says to his father: "You can't just bypass the metaphysics. If the agent isn't *ultimately* responsible, your reactive attitudes are fundamentally unjustified, even if they are natural."

  Does Galen land a hit? **No, he talks past it.**

  P.F. Strawson's move was pragmatic and transcendental. He argued that we *cannot* abandon reactive attitudes without ceasing to be human as we know it. The justification for responsibility is internal to the form of life we lead, not external in a metaphysical fact about *causa sui*.

  Galen is demanding an "external" justification for a practice that is justified "internally." It is like arguing that love is impossible because, biologically, it is just oxytocin and evolutionary selection. Even if that is metaphysically true, it doesn't capture the phenomenon of love as experienced and lived. Similarly, even if we aren't *causa sui*, the practice of holding each other accountable remains intact because it is grounded in our capacity for reasons-responsive interaction, not in our power to create ourselves ex nihilo. Galen wins the metaphysical point (we aren't gods), but P.F. wins the human point (we don't need to be gods to be responsible).

  ### The Desert Objection: Retribution vs. Accountability

  The hardest comeback to this defense is the issue of **Desert**. Critics argue that Guidance Control is a watered-down substitute. If I didn't choose my character, do I really *deserve* to suffer punishment? Retributive justice seems to presuppose that the offender could have ultimately done otherwise. If Galen is right, retribution is vengeance disguised as justice.

  Here, the compatibilist must bite the bullet and argue that **retributive desert is the incoherent notion, not Guidance Control.**

  1.  **The Illusion of Retribution:** The kind of "Basic Desert" Galen says is impossible is actually a theological concept smuggled into secular ethics. It requires a kind of cosmic balancing of scales that makes no sense in a naturalistic world. Even if *causa sui* were possible, why would that justify *suffering*? The link between "self-creation" and "deserving pain" is not logically necessary.
  2.  **Communicative Accountability:** Fischer and Ravizza's model supports a different kind of blame: **Accountability**. To hold someone accountable is to demand reasons from them and to modify our relationship based on their response. If an agent with Guidance Control violates a moral norm, blame is the appropriate communicative tool to signal that violation and invite moral repair. This does not require the agent to be the ultimate source of their being; it only requires them to be a participant in the moral community.
  3.  **Punishment Reform:** This view forces us to abandon retributivism in favor of a mixed model of punishment focused on protection, rehabilitation, and moral communication. Is this a loss? Only if you believe vengeance is a moral virtue. If we accept that we are products of our environment (as Galen insists), the humane response is to fix the environment and the agent, not to inflict suffering to satisfy a metaphysical requirement for "Ultimate Justice" that cannot exist.

  ### Conclusion

  Galen Strawson's Basic Argument is a triumph of logical rigor, but it is a solution in search of a problem that compatibilists stopped trying to solve decades ago. By defining moral responsibility as requiring *Ultimate Responsibility*, Galen sets a bar that is not only impossible to clear but unnecessary to clear.

  Fischer and Ravizza's Guidance Control offers a robust account of agency that preserves everything we actually care about: the ability to respond to reasons, the ownership of our actions, and the capacity for interpersonal relationships. Galen is right that we are not *causa sui*. But his father was righter: we are human beings embedded in a web of reactive attitudes. To demand more than Guidance Control is not to demand responsibility; it is to demand divinity. And since we are not gods, we should be satisfied with the responsibility that allows us to live together, reason together, and hold one another accountable, even if the causal chain stretches back before we were born.
