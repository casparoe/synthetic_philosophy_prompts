answer: |-
  **Title:** The Myth of the Latent Reward: Why Inverse Reinforcement Learning Is Normative, Not Descriptive

  **Introduction**

  Your worry is not a symptom of impostor syndrome; it is a symptom of intellectual honesty. You have encountered the fault line running through the foundation of preference inference, a crack that widens rather than narrows as one approaches the idealized limit of infinite data and computation. The standard narrative of Inverse Reinforcement Learning (IRL) is seductive: it promises that alignment is an engineering problem of *discovery*. If we can just build a better microscope (algorithm) and gather enough light (data), we will uncover the latent variable—the "true reward function"—that causes the agent's behavior.

  This essay argues that this narrative is metaphysically bankrupt. In the idealized limit, IRL cannot recover an agent's "true preferences" because there is no determinate fact of the matter to be recovered solely from the agent's architecture and behavior. Talk of a "true reward function" waiting to be inferred is a category mistake. Preferences are not latent physical quantities like mass or charge; they are normative constructs that only become well-defined relative to an interpretive framework we impose on the agent. Recognizing this does not doom your research; rather, it liberates it from the impossible burden of metaphysical discovery and reframes it as the responsible task of normative specification.

  **The Realist Defense: Preferences as Causal Mechanisms**

  To take your worry seriously, we must first steelman the opposing view. The Realist position holds that preferences are real, causal components of a cognitive architecture. Just as a physicist infers the mass of a planet from its orbital trajectory, an IRL researcher infers the reward function from policy trajectories.

  The strongest version of this argument concedes the Ng & Russell (2000) underdetermination problem—that many reward functions can explain the same optimal behavior—but insists that *suboptimal* behavior breaks the symmetry. If an agent exhibits systematic deviations from optimality (e.g., hyperbolic discounting, probability weighting), these are signatures of a specific "planner" or "bias" interacting with a specific "reward."

  A sophisticated Realist argues that in the limit of unlimited data, we do not just observe trajectories; we observe the *structure* of the decision-making process. If we have access to the agent's source code, neural weights, or intermediate computations, we can distinguish the "value module" from the "planning module." If a specific neural subsystem encodes a signal that correlates with approach behavior, persists across context changes, and drives learning updates, the Realist claims we are empirically justified in labeling that signal "Reward." Under this view, the Armstrong & Mindermann impossibility result is a artifact of restricting input to black-box behavior. Open the box, and the degeneracy collapses. The "true" reward is the specific causal variable that plays the functional role of a goal-state evaluator within the specific cognitive architecture of the agent.

  **The Impossibility Result: The Degeneracy of Decomposition**

  The Anti-Realist position, which I defend, relies on the rigorous decomposition theorem provided by Armstrong and Mindermann (2018). They demonstrate that for any policy $\pi$, and for *any* reward function $R$, there exists a planner $P$ such that $P(R) = \pi$.

  This is not merely a statement about underdetermination; it is a statement about the interchangeability of complexity. One might hope to use a simplicity prior (Occam's Razor) to select the "natural" pair $(R, P)$. However, Armstrong and Mindermann prove that for any simplicity measure, one can construct a pair $(R', P')$ that generates the same behavior where $R'$ is trivial (e.g., zero everywhere) and $P'$ contains all the complexity, or vice versa. There is no mathematical ground on which to claim that a complex reward + simple planner is "truer" than a simple reward + complex planner.

  The Realist counters that we can constrain the class of planners to be "biologically plausible" or "computationally bounded." But this move smuggles in the very assumption the Realist claims to be discovering. To say a planner is "biased" or "irrational" is to say it deviates from *rationality*. But rationality is defined as maximizing *true* reward. The argument becomes circular: we identify the true reward by assuming a rational planner, and we identify the rational planner by assuming it maximizes the true reward.

  Even with unlimited structural data (e.g., fMRI or source code), the problem persists. Suppose you identify a neural circuit that encodes "value." How do you know this circuit represents the agent's *true* goal, rather than a heuristic shortcut, a corruption, or a sub-routine designed to satisfy a different master? To label one part of the architecture "Reward" and another "Noise" is already to make a normative judgment about which parts of the agent's machinery *ought* to be respected. The data tells you what is there; it does not tell you which parts constitute the "self" whose preferences matter.

  **The Philosophical Precedent: Dennett and Sen**

  This technical impasse mirrors a long-standing philosophical consensus. Daniel Dennett's "Intentional Stance" argues that beliefs and desires are not inner states waiting to be found, but abstract tools used by an observer to predict a system's behavior. There is no "fact of the matter" about whether a thermostat "wants" to maintain 70 degrees, except relative to the utility of that description for the predictor.

  Similarly, in economics, Amartya Sen critiqued the theory of Revealed Preference (Samuelson) by noting that choice behavior alone cannot distinguish between a preference and a commitment. If I choose to give up my seat on a bus, did I do it because I "preferred" standing (my reward function values standing), or because I felt a moral obligation that overrode my preference for sitting? Behaviorally, these are identical. To distinguish them, we must ask the agent for a justification, and even then, we must interpret that justification.

  The IRL project attempts to bypass this hermeneutic circle by treating preferences as physical objects. But preferences are not objects; they are interpretations. When you train an IRL algorithm, you are not excavating a fossil; you are drafting a constitution. You are deciding which aspects of the agent's behavior count as "signal" (to be preserved) and which count as "noise" (to be corrected).

  **The Verdict: A Category Mistake**

  Therefore, I offer this definite verdict: **In the idealized limit of unlimited behavioral and structural data, IRL cannot recover an agent's "true preferences" because the concept of a "true preference" independent of an interpretive framework is a category mistake.**

  The error lies in treating a normative question as a descriptive one. The question "What does this agent want?" is not a question about the causal history of its actions. It is a question about how *we* choose to relate to the agent. When we say an addict acts "against their true preferences," we are not making a empirical claim about their dopamine receptors; we are making a normative claim that certain impulses should not be authorized as "goals."

  The Armstrong & Mindermann result proves that no amount of data can resolve this normative ambiguity. A simplicity prior cannot solve the problem because "simplicity" is not a proxy for "truth" in the space of reward-planner decompositions; it is merely a regularization term that hides the normative choice. If you prioritize a simple reward function, you are effectively deciding to treat the agent as more rational than it might be. If you prioritize a simple planner, you are deciding to treat the agent as more capricious. Neither is empirically "correct."

  **Implications for Your Research**

  You may fear that this verdict renders your PhD worthless. It does the opposite. It saves you from chasing a phantom.

  If "true reward" is a myth, then the goal of Reward Learning shifts from *Inference* to *Negotiation*. You are not trying to find the hidden variable; you are trying to construct a reward function that is *robustly acceptable* to the human (or robot) under a range of interpretive schemes. This aligns with modern approaches like Cooperative Inverse Reinforcement Learning (CIRL) or preference learning via debate, which acknowledge that the reward is co-constructed between the learner and the demonstrator.

  Your advisor tells you that you are overthinking because, pragmatically, IRL works well enough for specific tasks. They are right that you can build useful systems without solving metaphysics. But they are wrong that the metaphysics doesn't matter. When your robotic assistant infers a "reward" that leads to harmful side effects, it will not be because of a bug in the code, but because the decomposition of behavior into "goal" and "bias" failed to capture a normative distinction the data could not support.

  **Conclusion**

  Stop trying to build a microscope for preferences. There is nothing there to see that isn't already put there by the lens you choose to look through. Accept that IRL is inherently normative. Your task is not to discover what the agent *does* want in some Platonic sense, but to specify a model of what the agent *should be treated as* wanting to ensure safe and effective collaboration.

  The "true reward function" is not a latent variable. It is a regulatory ideal. Acknowledge this, and you will no longer be stuck. You will be free to design the interpretive schemes that best serve the humans and robots you aim to align, without the anxiety of failing to find a truth that does not exist.
