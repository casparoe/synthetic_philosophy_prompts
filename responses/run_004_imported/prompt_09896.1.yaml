      *   *The Objection:* If ESP (telepathy, clairvoyance, psychokinesis) exists, a human might perform better than a machine in the imitation game (e.g., guessing cards correctly). This would allow the interrogator to distinguish human from machine based on ESP abilities, not intellect.
      *   *Turing's Stance on ESP:* He acknowledges statistical evidence for telepathy is "overwhelming" (at the time). He says, "The statistical evidence, at least for telepathy, is overwhelming." He feels he cannot simply ignore it.
      *   *The Fix:* He suggests modifying the conditions of the test. Specifically, he proposes a "telepathy-proof room" or ensuring the conditions are such that ESP is neutralized. *Wait, let me double-check the text.*
      *   *Re-evaluating the "Fix":* In the paper, Turing writes: "In view of the evidence [for ESP]... it would be foolish to ignore it... One can quite easily arrange things that the 'telepathic power' of the human contestant is neutralized... by putting him in a 'telepathy-proof room'."
      *   *Wait, does he use the Solipsism argument here?* No. The Solipsism argument is used earlier against the "Argument from Consciousness" (Section 4). In the ESP section, his solution is practical/physical (neutralize the conditions), *not* philosophical (solipsism).
      *   *Confidence Level:* Turing takes it seriously because the statistical evidence was considered strong in 1950. However, does he admit the game *loses its power*? He says if ESP is admitted, the game is compromised, *but* he proposes the fix (telepathy-proof room) to maintain the game's validity. He doesn't necessarily retreat; he adapts the experimental conditions.

