          *   *Verdict:* **Incorrect.** This is a major hallucination/conflation. Turing does *not* use the solipsism argument for the ESP objection. He proposes a "telepathy-proof room" (physical isolation/shielding). The solipsism argument was in Section 4 (Argument from Consciousness). This is a significant error in textual understanding.

      *   **Part (c) Why take it seriously/Confidence:**
          *   *Jordan:* "he actually says the statistical evidence for telepathy is strong enough that he can't just ignore it... Turing more or less admits the imitation game loses its power to tell man from machine, which is a bigger retreat than he makes anywhere else in section 6."
