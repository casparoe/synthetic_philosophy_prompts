      *   **Geometric Intuition (Optional but helpful):** Mention convex combinations. The set of feasible payoffs from mixed strategies is the convex hull of pure strategy payoffs. A point can be inside the hull without being one of the vertices.
      *   **Implications for Homework:** Warn them that skipping this step will lead to wrong answers (failing to eliminate strategies that should be eliminated).
      *   **When does it matter?** Usually in 3x3 or larger matrices. In 2x2, mixed dominance of a pure strategy is less common/irrelevant for IEDS in the same way (if there are only 2 rows, you can't mix two *other* rows to dominate a third). It requires at least 3 strategies for the dominating set.

