      **Alex:** But if the particles aren't fundamental, they need grounding too. If that never stops, the table's existence is always conditional. It's always 'if the next level exists.'

      **Jamie:** And the next level does exist. In a gunky world, there is no level that fails to exist. The condition is always met. You're asking for a guarantee of the chain's existence from outside the chain. But there is no outside.

      **Alex:** Then the chain exists brute. And if the chain exists brute, why not just say the top level exists brute?

      **Jamie:** Because the top level depends on the parts. The chain doesn't exist over and above the links. If every link is supported, the chain is supported. You want a hook to hang the chain on; I say the links hold each other.

      **Alex:** But without a hook, what holds the first link?

      **Jamie:** There is no first link. That's what 'infinite' means.

      **Alex:** Then nothing holds the chain. It floats.

      **Jamie:** Or perhaps 'floating' is just what reality looks like when you abandon the demand for foundations.

      **Alex:** Then it's not explanation. It's just description.

      **Jamie:** And perhaps explanation doesn't require a stop.

      **Alex:** We're back where we started.

      **Jamie:** Seems so.

