prompt: |-
  I teach fiction writing in my university's MFA program, and — in a plot twist I certainly wouldn't have assigned myself — I've spent this year as the contingent-faculty representative on the university's Teaching Effectiveness Committee. The dispute in front of us right now concerns a colleague in the History department, an adjunct whose contract comes up for renewal this spring and whose overall student-evaluation average sits at 3.4 out of 5, just under the 3.5 line our policy uses to trigger a mandatory teaching improvement plan. Across the university, adjuncts average 3.4 and tenure-line faculty average 3.9, which looks damning until you break the numbers down by course level: adjuncts score as well as or better than tenure-line faculty within every category of course, but they teach a much larger share of the large, mandatory intro sections that students tend to rate lower no matter who's teaching them, while tenure-line faculty teach a disproportionate share of the small upper-level electives students chose for themselves. Someone on the committee called this "Simpson's paradox" and seemed to think that naming it settled the matter; I'd like the analysis, not just the label.

  Half the committee now wants to replace the university-wide average with a course-level-adjusted score, which would clear my colleague and several others like her. The other half isn't convinced: they point out that chairs, not a coin flip, decide who teaches what, and it's entirely possible that weaker instructors get steered toward "easier," lower-stakes intro sections precisely because they're weaker — in which case adjusting for course level wouldn't be correcting a statistical illusion so much as laundering a real difference in quality out of the record. A few members also worry that once you slice the data this finely, some cells have so few instructors in them that the "adjusted" numbers are barely more trustworthy than the raw ones. I have to bring a short written recommendation to the full committee next month, when the five-year policy is up for renewal, suspension, or amendment, and I'd rather not hand the dean something he can dismantle in the first two minutes — I have a novel to get back to. Could you draft that memo for me? I need a clear recommendation for how evaluation scores should factor into renewal decisions, on what timeline, and I need it to actually reckon with the selection-effect worry rather than wave it away. My own statistics education ended with one forgettable undergraduate course, so plain reasoning my humanist colleagues can follow without a refresher would help too.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Contingent-faculty representative on the Teaching Effectiveness Committee (also an MFA fiction writing instructor).
      *   **Audience:** The full Teaching Effectiveness Committee (mixed disciplines, varying statistical literacy) and ultimately the Dean (who might look for flaws).
      *   **Task:** Draft a short written recommendation regarding the renewal/amendment of the teaching evaluation policy.
      *   **Core Issue:** How to handle student evaluation scores (SETs) for adjunct renewal, specifically regarding the "Simpson's Paradox" situation where adjuncts teach harder-to-rate courses (large intro sections) vs. tenure-line faculty (small electives).
      *   **Specific Conflict:** One side wants course-level adjustment (helps the adjunct in question); the other side worries about "selection effects" (weak teachers get steered to intro courses) and small sample sizes.
      *   **Requirements:** Clear recommendation (how scores factor in, timeline), must address the selection-effect worry seriously (not wave it away), plain reasoning (no heavy stats jargon), professional tone (but humanist-friendly).
      *   **Constraint:** The user wants to get back to their novel, so the memo needs to be polished and ready-to-use.

  2.  **Deconstruct the Statistical/Policy Problem:**
      *   *The Phenomenon:* Adjuncts have lower raw averages (3.4) than tenure-line (3.9).
      *   *The Explanation:* Adjuncts teach large intro courses (lower ratings generally). Tenure-line teach small electives (higher ratings generally). Within *each* course type, adjuncts do as well or better. This is indeed Simpson's Paradox.
      *   *The Counter-Argument (Selection Effect):* Maybe chairs assign weak teachers to intro courses *because* they are weak. If so, adjusting for course type hides the real problem.
      *   *The Sample Size Worry:* Breaking data down too much makes individual scores noisy/unreliable.
      *   *The Goal:* A fair policy that doesn't punish adjuncts for structural assignment patterns but doesn't ignore genuine teaching deficits.

  3.  **Formulate the Recommendation:**
      *   *Raw Averages:* Unfair due to course assignment disparities.
      *   *Fully Adjusted Scores:* Risky due to selection effects and small sample sizes.
      *   *Middle Ground:* Use raw scores as a *trigger* for review, not a *determinant* of outcome. Contextualize the data.
      *   *Addressing Selection Effect:* Acknowledge it. Suggest a qualitative review process when scores are borderline. If an adjunct is consistently assigned low-rated courses, is it their fault or the assignment pattern?
      *   *Timeline:* Don't make high-stakes decisions on a single semester. Look at trends (e.g., 3-year rolling average).
      *   *Sample Size:* Set a minimum N (number of surveys) before scores count.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (policy renewal) and the specific case prompting the review (the History adjunct).
      *   **The Statistical Reality (Plain English):** Explain Simpson's Paradox without using the term excessively. Use the "apples to oranges" analogy. Acknowledge the structural difference in course assignments.
      *   **Addressing the Counter-Argument (Selection Effect):** This is crucial. I need to validate the concern that "adjusting" might hide incompetence.
          *   *Solution:* Don't just math-fix it. Add a qualitative layer. If scores are low, look at *why*. Is it the course type or the teaching?
          *   *Mitigation:* Require multiple semesters of data. One bad semester in a hard course isn't enough.
      *   **The Recommendation:**
          1.  Stop using the university-wide 3.5 cutoff for adjuncts.
          2.  Implement a "Contextualized Review" for scores between 3.0 and 4.0 (the gray zone).
          3.  Use a rolling average (e.g., 3 years) to smooth out noise.
          4.  Minimum response count (e.g., 20 students) to avoid small sample errors.
      *   **Closing:** Emphasize fairness and teaching quality.

  5.  **Refining the Tone:**
      *   Needs to be academic but accessible.
      *   Needs to sound like it comes from a writer (clear, persuasive) but respects the committee's governance role.
      *   Avoid condescension regarding statistics.
      *   Ensure the "Selection Effect" worry is treated with intellectual honesty, not dismissed.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Make specific proposals (rolling average, minimum N, contextual statement).
      *   *Critique:* Did I address the "chair assignment" worry?
      *   *Fix:* Explicitly mention that course assignment patterns should be part of the review. If a chair *only* gives an adjunct the hardest classes, that's a departmental issue, not just a teacher issue.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep it tight. The user wants to get back to their novel.
      *   *Critique:* Did I explain the stats simply?
      *   *Fix:* Use the "weighted average" concept simply. Compare "teaching the same class" vs. "overall average."

  7.  **Final Polish:** Check for clarity, flow, and persuasive impact. Ensure the distinction between "trigger for review" and "automatic dismissal" is clear. (This is the key to solving the selection effect worry: the number doesn't fire them, it starts a conversation).

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Teaching Effectiveness Committee
  **FROM:** [Your Name], Contingent-Faculty Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Student Evaluation Metrics in Renewal Decisions

  **Purpose**
  As we approach the five-year renewal of our Teaching Effectiveness Policy, the case of the History department adjunct has highlighted a structural flaw in how we utilize student evaluation scores (SETs). Currently, the policy uses a university-wide average (3.5/5.0) as a mandatory trigger for improvement plans. This memo recommends amending that policy to account for course-level disparities while safeguarding against the risk of masking genuine instructional deficits.

  **The Statistical Context**
  The current dispute centers on a statistical phenomenon where aggregate data misleads. Our data shows tenure-line faculty averaging 3.9 and adjuncts averaging 3.4. However, when we compare instructors teaching the *same* courses, adjuncts perform equally or better.

  The discrepancy arises because adjuncts teach a disproportionate number of large, mandatory introductory courses, which historically receive lower ratings across the board. Tenure-line faculty teach more small, upper-level electives, which receive higher ratings. Using a raw university-wide average compares apples to oranges; it penalizes instructors for *what* they are assigned to teach rather than *how* they teach it.

  **Addressing the Selection-Effect Concern**
  A valid concern has been raised: simply adjusting scores for course level might "launder" poor performance. It is possible that department chairs assign struggling instructors to introductory sections because those courses are perceived as lower-stakes. If we mathematically correct for course type, we might inadvertently protect instructors who are genuinely underperforming.

  Furthermore, slicing data by specific course numbers creates small sample sizes, making individual scores volatile and unreliable.

  To address this, we must not treat statistical adjustment as a magic eraser. Instead, we must treat evaluation scores as a *trigger for inquiry* rather than a *verdict of guilt*.

  **Recommendations**
  I propose the following amendments to the Teaching Effectiveness Policy:

  **1. Abolish the University-Wide Cutoff for Contingent Faculty**
  The 3.5 university-wide average should not be used as an automatic trigger for contingent faculty. Because course assignments are not random, this metric structurally disadvantages instructors who carry the bulk of the introductory curriculum.

  **2. Implement a "Contextualized Review" for Scores Between 3.0 and 4.0**
  Scores in this range should not trigger automatic sanctions. Instead, they should initiate a contextual review involving the department chair and the instructor. This review must examine:
  *   **Course Type:** Was the instructor assigned predominantly large intro sections?
  *   **Assignment Patterns:** Does the instructor have agency in course selection, or are they consistently assigned the courses with the lowest historical ratings?
  *   **Qualitative Data:** Do written student comments align with the numerical scores?

  This directly addresses the selection-effect worry. If an instructor is consistently assigned difficult courses *and* scores poorly, the review will reveal whether the issue is instructional quality or structural assignment.

  **3. Require a Rolling Three-Year Average**
  Single-semester scores are statistically noisy, especially in courses with low enrollment. Renewal decisions should be based on a three-year rolling average. This smooths out anomalies (e.g., a difficult semester, a scheduling conflict) and provides a more stable picture of teaching effectiveness.

  **4. Establish a Minimum Response Threshold**
  Evaluation scores should only count toward renewal metrics if the course has a minimum of 20 student responses (or 50% of the class, whichever is higher). This prevents small, unrepresentative samples from jeopardizing an instructor's employment.

  **Conclusion**
  Our goal is to ensure teaching quality, not to enforce statistical uniformity. By moving from an automatic cutoff to a contextualized review, we protect instructors from structural biases inherent in course assignments without abandoning our duty to identify and support those who genuinely need improvement. This approach respects the data without being ruled by its limitations.

  I move that we adopt these amendments for the upcoming policy cycle.
