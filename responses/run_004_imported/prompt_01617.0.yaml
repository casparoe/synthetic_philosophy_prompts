      *   **Round 3: Tolstoy's Ghost.**
          *   Elias: Invoke *War and Peace*. The swarm logic. Napoleon was a label on the bottle, not the wine.
          *   Sarah: That's convenient. It absolves him of the hubris. If he's not responsible for the failure, is he responsible for Austerlitz?
      *   **Round 4: The Counterfactual.**
          *   Sarah: If they left in early October, they miss the heavy snow.
          *   Elias: They still starve. The scorched earth wasn't just Moscow. The momentum was gone.
      *   **Round 5: The Nature of History.**
          *   Elias: We impose narrative on chaos.
          *   Sarah: We analyze choices to learn. Determinism is a dead end.
      *   **Closing:** No resolution. Both acknowledge the other's strength. The tension remains.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Are they talking past each other? *Correction:* Make sure Sarah directly addresses the "looting/discipline" point Elias makes, and Elias directly addresses the "Caulaincourt advice" point Sarah makes.
      *   *Check:* Is the tone right? *Correction:* Ensure it sounds like historians, not laypeople. Use terms like "determinism," "contingency," "primary source," "logistical tail."
      *   *Check:* Is the Tolstoyan view accurate? *Correction:* Ensure Elias emphasizes the *collective will* and the *inevitability of the sum of infinitesimals*, not just "bad luck."
      *   *Check:* Is the Agency view accurate? *Correction:* Ensure Sarah emphasizes that *contemporaries* saw options, not just modern hindsight.

  6.  **Polishing:**
