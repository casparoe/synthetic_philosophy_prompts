answer: |-
  You win the argument. Or, at least, you win the nuance.

  Your memory from that early modern philosophy class is spot-on. While your friend is technically correct that Hobbes was mathematically wrong (you cannot square the circle using classical tools, a fact proven definitively in 1882 but widely accepted by competent mathematicians like Wallis in Hobbes's time), reducing Hobbes's stubbornness to simple vanity misses the engine driving it.

  Hobbes wasn't just doing math; he was defending the structural integrity of his entire philosophical system. To admit Wallis was right about the nature of geometric proof would have required Hobbes to admit he was wrong about the nature of reality, knowledge, and the state.

  Here is the breakdown of the distinctive features of Hobbes's geometry, how it ties into his materialism and political theory, and why he couldn't back down without collapsing his whole worldview.

  ### 1. Two Conceptions of Demonstration: Axiomatic vs. Causal

  To understand the feud, you have to understand that Hobbes and Wallis were playing two different games, even though they were using the same pieces.

  **The Standard View (Wallis/Euclid):**
  For Wallis and the emerging mathematical mainstream, geometry is **axiomatic and deductive**.
  *   **Truth:** A proposition is true if it follows logically from accepted definitions and postulates.
  *   **Objects:** Geometric figures are abstract ideals. A circle is a set of points equidistant from a center. It doesn't matter how you draw it; what matters is the logical relationship between its properties.
  *   **Proof:** A valid chain of reasoning. If $A \rightarrow B$ and $B \rightarrow C$, then $A \rightarrow C$.

  **Hobbes's View (Materialist/Constructive):**
  For Hobbes, geometry is **causal and genetic**.
  *   **Truth:** You only truly "know" something if you know its **cause**. In geometry, the "cause" of a figure is the motion that generates it.
  *   **Objects:** A circle isn't just a static definition; it is the trace of a line rotating around a fixed point. Without the motion, the figure is a dead idol.
  *   **Proof:** A demonstration must show the *generation* of the object. To prove a property of a circle, you must show how that property arises from the specific motion that created the circle.

  For Hobbes, a proof that relies solely on logical deduction without explaining the *generation* of the figure is "sophistry." It might be logically consistent, but it doesn't yield *scientia* (scientific knowledge). He famously argued that you cannot reason about "universals" or abstract entities; you can only reason about bodies and their motions. Therefore, a mathematical proof that treats figures as abstract static objects is metaphysically bankrupt.

  ### 2. The Connection to Materialism

  This isn't an isolated quirk; it is the direct application of Hobbes's materialism.

  Hobbes's universe contains only one substance: **Body**. Everything that happens is **Motion**. Even human thought, for Hobbes, is a small-scale motion ("endeavor" or *conatus*) within the body.

  If reality is nothing but bodies in motion, then mathematics cannot be about abstract, non-physical ideals (which would be a form of Platonism, which Hobbes hated). Mathematics must be the study of the simplest kinds of motion.
  *   **Point:** A body considered without magnitude.
  *   **Line:** The trace of a point in motion.
  *   **Surface:** The trace of a line in motion.

  When Hobbes insisted on "squaring the circle," he wasn't just trying to find a ratio; he was trying to show that the motion generating a circle could be transformed, through valid mechanical steps, into the motion generating a square of equal area. When Wallis pointed out logical gaps in Hobbes's algebra or geometry, Hobbes dismissed him because he felt Wallis was playing with symbols rather than describing physical reality. Hobbes believed Wallis was a "scholastic" in mathematician's clothing—dealing in words, not things.

  ### 3. The Link to Civil Philosophy (*Leviathan*)

  This is where your intuition about his political philosophy is crucial. Hobbes wanted to build a "Civil Science" that was as certain as geometry. He structured his philosophical system (*De Corpore*, *De Homine*, *De Cive*) to move from the simplest elements (body/motion) to the most complex (the Commonwealth).

  **The "Resolutive-Compositive" Method:**
  Hobbes believed true science works in two steps:
  1.  **Resolution:** Breaking a phenomenon down to its universal causes (e.g., breaking the State down to individual humans, then humans down to motions of appetite/aversion).
  2.  **Composition:** Rebuilding the phenomenon from those causes to demonstrate how it *must* work.

  **Why Geometry is the Model:**
  Hobbes argued that we can have certain knowledge of geometry and politics, but *not* of natural physics.
  *   **Physics:** God created nature, so only God knows the true causes. We can only hypothesize.
  *   **Geometry & Politics:** **We create these.** We draw the circles; we sign the social contract. Because we are the authors of the causes, we can have demonstrable knowledge of the consequences.

  If Hobbes admits that Wallis is right—that geometric truth is just about logical consistency within an abstract system rather than causal generation—he undermines the analogy for his political philosophy. He needs geometry to be about *construction* and *causality* so that he can argue the Sovereign constructs the Commonwealth. If geometry is just abstract logic, the link between "bodies in motion" and "citizens in a state" weakens.

  ### 4. The Verdict: Vanity or Coherence?

  So, was your friend right that he was just vain, or are you right that there was a philosophical principle at stake?

  **The Synthesis:**
  Hobbes was philosophically consistent but mathematically incompetent.

  1.  **The Mathematical Reality:** Hobbes was wrong. His proofs were circular (pun intended). He often assumed the very thing he was trying to prove. Wallis was objectively right about the math. Hobbes's late discovery of Euclid (he reportedly found a copy at age 40 and fell in love with it) meant he lacked the technical training Wallis had, and he refused to learn the new algebraic methods Wallis was championing.
  2.  **The Psychological/Philosophical Stake:** However, your friend is wrong to call it *just* vanity. For Hobbes, admitting Wallis was right wasn't just admitting a math error; it was admitting that his **criterion for truth** was flawed.
      *   If Wallis is right, then "truth" is about linguistic/logical consistency, not causal generation.
      *   If "truth" is linguistic consistency, then Hobbes's materialism (which rejects abstract universals) is in trouble.
      *   If his materialism is in trouble, his derivation of the Sovereign's power from the "motion" of human passions loses its scientific footing.

  Hobbes couldn't back down because he had tied the certainty of his political theory to the certainty of his geometry. To concede to Wallis was to concede that *Leviathan* was built on sand.

  Furthermore, there was a political dimension to the feud. Wallis was an Oxford professor and a Presbyterian divine. Hobbes was a fierce anti-clericalist who believed universities were centers of seditious "Aristotelian" nonsense. He viewed Wallis not just as a mathematician, but as an agent of the "Kingdom of Darkness" (the church/university establishment) trying to protect their turf against his new "Civil Science."

  ### Summary for Your Friend

  You can tell your friend this:

  > "You're right that Hobbes was bad at math and Wallis was right about the circle. But Hobbes wasn't stubborn because he couldn't count; he was stubborn because he thought Wallis was cheating. Hobbes believed math had to describe physical motion and causality, not just abstract logic. If he admitted Wallis was right, he'd have to admit that his entire political philosophy—which was built on the idea that we can know things because we *make* them (like circles or states)—was wrong. He didn't lose a math fight; he was defending the foundation of his entire worldview."

  You get the credit for the philosophical depth; your friend gets the credit for knowing Hobbes couldn't actually square a circle. Everyone wins.
