answer: |-
  Your friend is absolutely right, and you've stumbled onto one of the most dramatic "plot twists" in 20th-century philosophy of science. It's a great story because it involves a giant (Popper) proposing a solution to a massive problem (how do we say science progresses if all theories are technically false?), only to have two younger philosophers (Tichý and Miller) quietly walk in a few years later and prove the solution was mathematically impossible.

  Here is the gut-level explanation of why Popper's definition broke, and why the fixes are better but still have scars.

  ### Part 1: Why Popper's Definition Collapsed

  Popper wanted to define **verisimilitude** (truthlikeness) without using probability. He wanted to say that even if Theory A and Theory B are both *false*, Theory A can still be *closer to the truth*.

  **The Intuition:**
  Popper treated a theory like a **net** cast over the world.
  1.  **Truth Content:** The parts of the net that catch real facts.
  2.  **Falsity Content:** The parts of the net that catch non-facts (errors).

  Popper's definition was essentially: *Theory A is closer to the truth than Theory B if A has more truth-content and less falsity-content than B.*

  **The Trap:**
  The problem isn't the intuition; it's the logic. In formal logic, "content" isn't like a bag of marbles where you can just add or remove a few. Logical consequences are tightly woven.

  Imagine two false theories: **Newton** and **Aristotle**.
  *   Newton says: "Force = mass × acceleration." (False, strictly speaking, due to relativity/quantum effects).
  *   Aristotle says: "Heavy objects fall faster than light ones." (False).

  We intuitively know Newton is *closer* to the truth. But under Popper's definition, to say Newton is "closer," Newton's theory must capture *all* the true consequences of Aristotle's theory (and more), while containing *fewer* false consequences.

  **The Tichý/Miller Knockout:**
  Pavel Tichý and David Miller showed that because of how logical implication works, this creates a "Subset Trap."

  If Theory A and Theory B are both **false**, the only way for A to have "more truth and less falsity" than B in Popper's formal sense is if **Theory B logically implies Theory A.** (Or vice versa).

  Think about what that means. It means that for one false theory to be ranked "closer" than another, the "worse" theory has to be a logical subset of the "better" theory.
  *   But in real science, competing theories usually **contradict** each other. Newton doesn't imply Aristotle; Newton *denies* Aristotle. Aristotle doesn't imply Newton.
  *   Because neither theory is a logical subset of the other, Popper's math forces the conclusion that they are **incomparable**.

  **The Gut-Level Reason:**
  Popper tried to measure "distance from truth" using **binary logic** (a statement is either a consequence or it isn't).
  *   If you are wrong about *one* thing, that error ripples through your logical web of consequences.
  *   Tichý showed that once a theory is false, its "falsity content" grows so fast and intertwines so deeply with its "truth content" that you can't separate them to do the subtraction Popper wanted.
  *   Consequently, Popper's definition implies that **no false theory can ever be closer to the truth than another false theory** (unless one entails the other). Since all our best scientific theories are technically false, Popper's definition implies science cannot progress. It was a disaster.

  ### Part 2: Do the "Similarity" Fixes Work?

  After the 1974 demolition job, philosophers like Ilkka Niiniluoto and Graham Oddie proposed a new approach. They stopped counting logical sentences and started measuring **distance**.

  **The New Intuition:**
  Instead of asking "How many true sentences does this theory imply?", they ask: **"How similar is the world described by this theory to the actual world?"**

  *   **Analogy:** Imagine the truth is the number **10**.
  *   **Aristotle** guesses **50**.
  *   **Newton** guesses **11**.
  *   Popper's method looked at the properties of the numbers (is it even? is it prime?) and got confused.
  *   The Similarity method just measures the distance. $|10 - 11| = 1$. $|10 - 50| = 40$. Newton is closer. Done.

  **Does this fix it?**
  Yes, mostly. This approach (often called the **Possible Worlds** or **State-of-Affairs** approach) successfully allows us to say Newton is closer to the truth than Aristotle, even though both are false. It aligns much better with scientific practice.

  **The New Problem: Language Dependence**
  However, your memory is correct: they swapped the "Logical Collapse" problem for the "Language Dependence" problem.

  Here is why that is a big deal. To measure "distance," you have to decide what features of the world you are measuring. You have to choose a **vocabulary** (predicates).

  **The Example:**
  Imagine a simple world with three weather properties: **Hot**, **Rainy**, **Windy**.
  *   **Truth:** Hot, Rainy, Windy.
  *   **Theory A:** Cold, Rainy, Windy. (Wrong on 1 feature: Temperature).
  *   **Theory B:** Cold, Dry, Windy. (Wrong on 2 features: Temperature, Rain).
  *   *Intuition:* Theory A is closer to the truth.

  Now, let's change the language. Instead of "Rainy," let's use a made-up predicate called **Minnesotan**, defined as "Hot and Rainy OR Cold and Dry."
  *   **Truth:** Hot, Rainy → **Minnesotan**.
  *   **Theory A:** Cold, Rainy → **Not Minnesotan**.
  *   **Theory B:** Cold, Dry → **Minnesotan**.

  If we calculate distance using {Hot, Minnesotan, Windy}:
  *   **Theory A** is wrong on Hot and Minnesotan (2 errors).
  *   **Theory B** is wrong on Hot only (1 error).
  *   *Result:* Suddenly, **Theory B is closer to the truth.**

  **Why is this a big deal?**
  It suggests that "scientific progress" might be an artifact of how we choose to speak, not how the world actually is. If I can make Aristotle look "closer to the truth" than Newton just by gerrymandering my definitions (like using "Minnesotan" instead of "Rainy"), then verisimilitude isn't objective.

  **Is it fatal?**
  Most philosophers think it's a serious challenge but not a death blow. The standard response is **Natural Kinds**.
  *   We assume the world has a real structure ("carving nature at its joints").
  *   "Temperature" and "Rain" correspond to real physical properties. "Minnesotan" is a gerrymandered, artificial logical construct.
  *   Therefore, we are justified in privileging predicates that map to real causal powers in the universe.

  ### Summary

  1.  **Popper's Failure:** He tried to measure "closeness" using logical containment. Because logical consequences explode when a theory is false, his math proved that **false theories cannot be ranked** unless one implies the other. Since rival theories contradict each other, science technically couldn't progress.
  2.  **The Similarity Fix:** By switching to "distance between states of affairs" (like guessing a number), we can rank false theories (Newton beats Aristotle).
  3.  **The Cost:** The ranking depends on the vocabulary used. If you don't assume there are "real" properties in the world (Natural Kinds), the measure becomes arbitrary.

  Your friend was right to be smug about it; it's a genuine "open wound" in the field, though most philosophers today think the Similarity approach, despite the language dependence issue, is the only game in town.
