  ### The Scenario: The "Spatial Doomsday" (The Solipsistic Planet)

  To demonstrate the tension between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) without relying on birth-rank reasoning, we can use a spatial analogue known as the **Spatial Doomsday Argument**.

  **The Setup**
  Imagine you are an astronomer evaluating two competing cosmological theories regarding the size of the universe and the total population of observers (humans or intelligent life):

  *   **Hypothesis S (Small Universe):** The universe is spatially small and contains only **1,000** habitable planets.
  *   **Hypothesis L (Large Universe):** The universe is spatially vast and contains **1,000,000** habitable planets.

  Assume your prior credence in both theories is equal (50/50).

  **The Observation**
  You look out your window and identify your specific location: you are on **Earth**. In this scenario, Earth is treated as a specific, unique indexical location (e.g., "Planet #42" in a cosmic catalog).

  ### The Conflict

  **1. The SSA Verdict (The "Doomsday" Conclusion)**
  Under the **Self-Sampling Assumption**, you must reason as if you are a random sample from the set of all *actually existing* observers in your reference class.
  *   If **Hypothesis L** is true, there are 1,000,000 observers. The probability that a random sample would be *you* (specifically located on Earth) is $1/1,000,000$.
  *   If **Hypothesis S** is true, there are only 1,000 observers. The probability that a random sample would be *you* is $1/1,000$.
  *   **Result:** The evidence strongly favors the Small Universe. SSA implies that finding yourself at this specific location is statistically "lucky" in a large universe but "normal" in a small one. Thus, you should drastically update your credence to believe the universe is small and mostly empty.

  **2. The SIA Verdict (The "No Update" Conclusion)**
  Under the **Self-Indication Assumption**, you reason as if you are a random sample from the set of all *possible* observers. You must weight each hypothesis by the number of observers it contains.
  *   **Hypothesis L** posits 1,000 times more observers than **Hypothesis S**. Therefore, SIA dictates that **Hypothesis L** is antecedently 1,000 times more likely to contain *you* simply because there are 1,000 times more "slots" for an observer to exist.
  *   **Result:** This prior boost ($1,000\times$) perfectly cancels out the low sampling probability ($1/1,000,000$) derived from SSA. SIA concludes that your specific location provides **no information** regarding the total size of the universe.

  ### What This Tension Reveals

  The conflict between these two verdicts reveals a fundamental ambiguity in how "finding yourself" at a particular point in a population should update your credence:

  1.  **Sampling vs. Existence:** The tension highlights whether your specific identity/location is a **filter** or a **weight**.
      *   **SSA** treats your location as a filter: "Given the world exists, how hard was it to pick me?" In a large world, picking a specific individual is highly improbable, so the world is likely small.
      *   **SIA** treats your existence as a weight: "How likely is it that I exist at all?" A large world makes your existence more probable, which offsets the unlikelihood of your specific coordinates.

  2.  **The Nature of Indexical Information:** It reveals that indexical facts ("I am here") are not probabilistically neutral. Under SSA, specific indexical facts are evidence *against* large populations (because you are "atypical" in a large crowd). Under SIA, they are neutral.

  3.  **The "Doomsday" Mechanism:** This scenario confirms that the "Doomsday" effect is not unique to time or birth order. Any scenario where you possess a **specific, unique identifier** (whether it is a birth rank, a spatial coordinate, or a genetic code) will lead SSA to favor a smaller total population ($N$). The argument relies on the principle that in a larger set, any specific member is less likely to be sampled.
