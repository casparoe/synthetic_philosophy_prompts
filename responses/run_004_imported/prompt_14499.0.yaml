  7.  **Final Polish:** Check the specific details of Anderson's 1990 paper. Anderson specifically targets the axiom $P(\neg \phi) \leftrightarrow \neg P(\phi)$. He suggests replacing the definition of God-like to rely on "essence" more explicitly and weakening the positivity axioms so they don't imply that the set of positive properties is maximal in a way that dictates all truth. Wait, I need to be precise. Anderson proposes that we define God-like as having all positive properties, but we drop the axiom that says *every* property is either positive or negative. We allow properties that are neither. This prevents the "decision" of every truth value via God's nature.
