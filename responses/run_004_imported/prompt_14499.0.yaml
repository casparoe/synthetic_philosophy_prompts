          *   Analogy: A blueprint that specifies every brick. If the blueprint exists necessarily, the building is necessary.
      *   *Section 2: Anderson's Fix.*
          *   Identify the target: Axiom 2 (Exhaustiveness).
          *   Explain the change: Allow "neutral" properties.
          *   Explain the redefinition: God possesses all positive properties as his *essence*, but might have other properties that aren't determined by positivity.
          *   Result: God is necessary, but the world (or some truths) can vary without contradicting God's positive nature.
      *   *Section 3: Assessment.*
          *   Weigh the trade-off.
          *   Gödel's view: Objective values structure reality. Collapse might be a feature, not a bug, for him.
