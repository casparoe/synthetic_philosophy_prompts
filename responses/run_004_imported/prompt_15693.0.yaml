      *   Let's stick to the Benardete "Gods" version as it's more about the *barrier* than the *death*.
      *   *Julian's Point:* In the Lamp, you say "state undefined." In the Gods, the problem isn't the state at the limit, it's that the *existence* of the gods logically prevents the start. There is no "boundary condition" to leave open. The contradiction is immediate.
      *   *Elena's Point:* The contradiction is in the *omniscience/omnipotence* assumptions of the gods, not the infinity of time. Or, she argues that the "prevention" is a logical consequence of the description, meaning the description entails the traveler doesn't move. That's not a contradiction, that's a prediction.

      *Wait, I need to make sure Elena defends Supertasks.*
