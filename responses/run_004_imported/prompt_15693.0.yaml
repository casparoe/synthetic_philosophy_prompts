      Julian: "Physics doesn't run on logic alone."

      *Okay, let's refine the "Assassins" for the dialogue.*
      Scenario: A victim is at point 0. An infinite line of assassins is stationed at points $1/2, 1/4, 1/8...$. Each is ordered to kill the victim if they reach their point.
      Result: The victim cannot leave point 0.
      Problem: No assassin actually kills him (he never reaches them).
      Julian: This shows logical incoherence. An effect (stopping) without a cause (no assassin acts).
      Elena: The "cause" is the *disposition* of the assassins. It's like a force field.

      *Actually, the prompt mentions "a whole line-up of assassins... where there doesn't seem to be any single leftover instant to hold responsible."*
