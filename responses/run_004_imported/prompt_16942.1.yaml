answer: |-
  I have some good news and some bad news for your writing group bet.

  The good news is that the member with the philosophy MA wasn't making things up entirely. Karl Popper *did* introduce a formal definition of verisimilitude (or "truthlikeness") in the 1960s. He *did* talk about "truth content" and "falsity content."

  The bad news is that **there is no formula.** Not anymore. And even when there was a proposed one, it was mathematically broken. Furthermore, applying philosophy of science metrics to historical fiction is a category error that wouldn't work even if the math were settled.

  Here is the breakdown of what actually happened in that philosophical debate, why you can't plug your novels into a calculator, and how you can actually settle the argument with your friend.

  ### 1. The Popper Proposal (1963)
  Your writing group member is referring to Popper's work in *Conjectures and Refutations*. Popper wanted to solve a problem: Science often deals in theories that we know are technically false (like Newtonian physics), but we still want to say Einstein's physics is *closer to the truth* than Newton's.

  Popper proposed that the verisimilitude ($Vs$) of a theory could be calculated by weighing its **Truth Content** ($Ct_T$) against its **Falsity Content** ($Ct_F$).

  *   **Truth Content:** The set of all true statements entailed by the theory.
  *   **Falsity Content:** The set of all false statements entailed by the theory.

  Popper's intuition was: If Theory A has more truth content and less falsity content than Theory B, then A has higher verisimilitude.

  ### 2. The Refutation (1974)
  This is the part your writing group member likely skipped. In 1974, two philosophers, **Pavel Tichý** and **David Miller**, independently proved that Popper's definition was mathematically incoherent.

  They demonstrated that under Popper's own rules, **no false theory can be closer to the truth than any other false theory.**

  Here is the logic in plain English: If a theory is false, it entails at least one false statement. Once you have a false statement, you can logically combine it with any true statement to generate infinite new statements. Tichý and Miller showed that if you try to compare two false theories using Popper's sets, the math collapses. You cannot rank them.

  So, the "settled formula" your group member described was definitively **broken fifty years ago.**

  ### 3. The Modern State of "Truthlikeness"
  Since 1974, philosophers of science (like Ilkka Niiniluoto and Graham Oddie) have been trying to fix Popper's mistake. They have developed new approaches, often using "possible worlds" semantics (measuring the logical distance between the actual world and the world described by the theory).

  However, there is **no consensus.** There is no single textbook formula. It remains one of the most contentious, unsolved problems in formal epistemology. There is no calculator you can download. If you tried to apply Niiniluoto's "min-sum" measure to your novel, you would first have to define the "logical space" of every possible event that could have happened on that ship, assign probability weights to each, and determine the "distance" between an invented affair and a real storm. It is functionally impossible for narrative art.

  ### 4. The Category Error: Science vs. Fiction
  Even if we had a perfect formula for scientific theories, it would not apply to your bet. Here is why:

  **Scientific Truth vs. Narrative Truth**
  Philosophy of science deals with **propositional truth**.
  *   *Statement:* "The ship sank at 4:00 PM."
  *   *Verification:* Check the logbook. True or False.

  Historical fiction deals with **coherence and resonance**.
  *   *Statement:* "The First Mate had an affair which distracted him during the crisis."
  *   *Verification:* This didn't happen (False).
  *   *Literary Function:* Does this explain the psychological state of the crew? Does it illuminate the theme of duty?

  In literary criticism, "verisimilitude" does not mean "historical accuracy." It comes from the Latin *verisimilitudo*, meaning "likeness to truth." In fiction, this refers to **internal plausibility**. Does the character act in a way consistent with their established psychology? Does the world obey its own rules?

  If you write a scene where a character grieves in a way that never historically happened, but it perfectly captures the universal human experience of grief, literary theory argues you have achieved a *higher* form of truth than a dry recitation of facts, even if your "falsity content" is higher.

  ### 5. How to Settle the Bet
  You cannot use Popper to win this bet, because the metric doesn't exist. However, you can use the philosophy to reframe the argument.

  Your friend is writing **Chronicle**. You are writing **Myth**.

  *   **Your Friend's Metric:** Correspondence Theory of Truth. (Does the statement match the historical record?)
  *   **Your Metric:** Coherence Theory of Truth / Pragmatic Truth. (Does the story hang together? Does it yield insight?)

  **The Verdict:**
  If the bet is about **Historical Fidelity**, your friend wins. No calculation needed. You invented an affair; that is a factual falsehood.

  If the bet is about **Verisimilitude (Literary)**, the definition is subjective. However, you can argue that by inventing the affair, you increased the *explanatory power* of the narrative. If the affair explains *why* the mate made a fatal error (where history only says *that* he made an error), you have added causal logic to the chaos of history.

  **My Advice:**
  Tell your writing group member that Tichý and Miller refuted Popper's definition in 1974, so the "formula" is defunct. Then, tell your novelist friend that you are playing different sports. She is playing Tennis (rules-based, lines must be exact); you are playing Jazz (improvisation based on a theme).

  You can't judge Jazz by whether the notes match the sheet music. If your book makes readers *feel* the tragedy of the wreck more profoundly than hers does, you have achieved a different kind of truth that no philosophy of science formula can measure.

  Don't let a broken 1960s logic puzzle invalidate your subplot. If the affair serves the grief and the duty, keep it. That's not a calculation; that's art.
