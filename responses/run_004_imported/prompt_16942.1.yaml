      *   **Explain the Philosophy:** Briefly explain Popper's attempt, the Tichý/Miller refutation, and the current state of the field (ongoing debate, no consensus).
      *   **Address the Fiction Context:** Explain why "verisimilitude" in philosophy of science differs from "verisimilitude" in literary criticism. In literature, it usually means "plausibility" or "lifelikeness," not "correspondence to historical fact."
      *   **Resolve the Bet (Philosophically):** Help the user see that the bet rests on a category error. Their friend's "factual accuracy" and the user's "emotional truth" are different metrics. Philosophy of science can't adjudicate artistic value.
      *   **Tone:** Informative, empathetic, slightly humorous (about the writing group dynamic), but authoritative on the philosophy.

  4.  **Drafting the Content - Section by Section:**

