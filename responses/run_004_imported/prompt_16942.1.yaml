      *   **The Popper Backstory:** Confirm the member wasn't making it up entirely. Popper *did* propose a definition in 1963. Define "Truth Content" and "Falsity Content" as Popper saw them.
      *   **The Glitch (The Refutation):** Explain the 1974 Tichý/Miller proof. This is crucial. Popper's math broke. If Theory A is false and Theory B is false, Popper's definition implies neither is closer. This destroyed the "settled formula" idea.
      *   **Current State of Play:** Mention Niiniluoto and Oddie. They've tried to fix it (possible worlds, similarity metrics), but it's still debated. It's not a textbook formula; it's a research frontier.
      *   **The Category Error (Science vs. Art):** This is the most important part for the novelist.
          *   Science: Propositions about physical reality.
          *   Fiction: A mix of fact, theme, character psychology.
          *   "Truth" in fiction isn't just "did the affair happen?" It's "does this feel like how humans grieve?"
          *   Literary Verisimilitude = Plausibility/Coherence, not Historical Accuracy.
