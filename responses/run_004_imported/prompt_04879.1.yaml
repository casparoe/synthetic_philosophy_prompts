      *   For Qualia (phenomenal): We *can't* define the role fully. The "what it's like" remains. Exclusion applies.
      *   *Crucial nuance:* Kim is willing to be a reductionist about the special sciences to save their causation. He is only a non-reductionist (and thus eliminativist/epiphenomenalist) about phenomenal consciousness.

