prompt: |-
  I'm a philosophy professor, but thanks to a weird bit of university service I've become the token "outside member" on my medical center's clinical ethics committee -- I think they wanted somebody who'd atleast taught decision theory once. We're finalizing a policy on incidental findings from the whole-genome sequencing our genomics clinic now offers: right now disclosure is left to the individual geneticists discretion, case by case, and the committee wants one uniform rule in place before enrollment reopens on the 15th. The live question is whether patients should be allowed to opt out in advance of learning about specific categories of finding -- late-onset, currently untreatable stuff like Huntington's status or high-penetrance Alzheimer's risk alleles -- or whether the clinic should just disclose everything medically actionable and let people deal with it.

  One committee member, an ex-quant who has read way more decision theory than the rest of us combined, keeps citing something he calls Good's theorem (he's very insistent it's I.J. Good, not just "a good theorem") to argue the opt-out option is actually incoherent: since the expected value of free information is never negative for a rational Bayesian agent, formally enshrining a "right not to know" just builds a mistake into policy, so we should disclose everything by default and scrap the opt-out menu entirely. Our two bioethicists hate this -- they keep gesturing at the actual "right not to know" literature and worries about anxiety, insurance discrimination, and family disclosure cascades, but neither has been able to say exactly what's wrong with his argument, which bugs me, because I suspect something is.

  Could you draft the short memo I'll circulate before Thursday's meeting? I need an actual recommendation on the opt-out question, with a concrete rollout plan, not "reasonable people disagree" -- and I need you to genuinely engage with whether the quant's use of the theorem holds up here, rather than just asserting that a formal result shouldn't get to dictate clinical policy.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor, token "outside member" on a clinical ethics committee.
      *   **Context:** Finalizing policy on incidental findings from whole-genome sequencing (WGS). Current state: discretionary disclosure. Goal: Uniform rule by the 15th.
      *   **Core Conflict:** Opt-out allowed (Right Not to Know) vs. Mandatory Disclosure (Actionable Findings).
      *   **Antagonist:** An ex-quant committee member citing I.J. Good's Theorem (Value of Information) to argue opt-out is incoherent for rational agents.
      *   **Protagonists:** Two bioethicists arguing for "Right Not to Know" (anxiety, discrimination, etc.) but struggling to counter the formal argument.
      *   **Task:** Draft a short memo for Thursday's meeting.
      *   **Requirements:**
          *   Actual recommendation (no "reasonable people disagree").
          *   Concrete rollout plan.
          *   Genuinely engage with Good's Theorem (don't just dismiss it).
          *   Tone: Professional, authoritative, philosophically rigorous but clinically practical.

  2.  **Deconstruct the Quant's Argument (Good's Theorem):**
      *   *What is it?* I.J. Good's 1967 theorem states that for a rational Bayesian agent, the expected value of free information is always non-negative. In short: more information never hurts decision-making *if* you can use it to maximize expected utility.
      *   *Why does the quant think it applies?* If a patient is rational, knowing their genetic risk allows them to update priors and make better life/medical decisions. Opting out is thus irrational.
      *   *Where does it fail in this context?*
          1.  **Cost of Information:** Good's theorem assumes *free* information. Psychological distress, insurance discrimination, and family burden are *costs*. If Cost > Expected Utility Gain, the net value is negative.
          2.  **Utility Function Stability:** The theorem assumes a stable utility function. Learning devastating news (e.g., Huntington's) can fundamentally alter the agent's utility function (depression, suicidality), making the "rational agent" assumption void.
          3.  **Computational Tractability:** Humans aren't ideal Bayesian updaters. We suffer from cognitive biases (availability heuristic, optimism bias). The "noise" introduced by emotional processing can degrade decision quality.
          4.  **Irreversibility:** Information cannot be un-learned. If the information causes harm that cannot be mitigated by action (untreatable conditions), the "actionability" clause of the quant's argument (disclose *actionable* stuff) is tricky. *Correction:* The prompt says "medically actionable" is the default proposal, but the opt-out debate is about "late-onset, currently untreatable stuff." Wait, let me re-read carefully.
          *   *Re-reading the prompt:* "whether patients should be allowed to opt out in advance of learning about specific categories of finding -- late-onset, currently untreatable stuff like Huntington's... or whether the clinic should just disclose everything medically actionable."
          *   *Clarification:* The quant wants to disclose *everything medically actionable*. The opt-out debate is specifically about the *untreatable* stuff (Huntington's). Wait, usually "medically actionable" excludes Huntington's (no cure).
          *   *Correction on Policy Context:* The prompt says: "disclose everything medically actionable and let people deal with it" VS "opt out... of specific categories... late-onset, currently untreatable."
          *   *Actually, looking closer:* The quant argues against the *opt-out option*. He says disclose everything (presumably including the untreatable stuff, or he defines actionable broadly). The bioethicists want an opt-out for the scary untreatable stuff.
          *   *Crucial Distinction:* Good's Theorem applies to information that aids *decision making*. If a condition is untreatable (Hunting's), does the information aid decision making? Yes (life planning). But does the psychological cost outweigh it? Yes.
          *   *The "Free" Assumption:* This is the strongest philosophical counter. Information isn't free if it carries psychological burden.

  3.  **Formulate the Recommendation:**
      *   **Stance:** Support the Opt-Out (Right Not to Know).
      *   **Reasoning:** Good's Theorem relies on assumptions (costless info, stable utility, ideal rationality) that do not hold in clinical genetics.
      *   **Plan:** Tiered consent process. Default is disclosure of actionable, but explicit opt-out available for untreatable/late-onset.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Opening:** State the purpose (policy recommendation) and the deadline.
      *   **The Core Argument (Engaging the Quant):**
          *   Acknowledge I.J. Good's work (show respect).
          *   Identify the specific assumptions of the theorem: (1) Information is costless, (2) Agent is a perfect Bayesian updater, (3) Utility function remains stable.
          *   Apply to clinic: Genetic info is *not* costless (psychological harm, discrimination). Patients are *not* ideal agents (emotional impact alters decision capacity). Utility *does* change (diagnosis changes life valuation).
          *   Conclusion: The theorem proves information is valuable *ceteris paribus*, but *ceteris* are not *paribus* here.
      *   **The Ethical/Clinical Argument:**
          *   Autonomy includes the right to shape one's epistemic environment.
          *   Non-maleficence (do no harm).
      *   **Recommendation:** Implement a Tiered Consent Model with Opt-Out.
      *   **Rollout Plan:** Concrete steps for the 15th.
          *   Categorize findings (Actionable vs. Untreatable/Late-Onset).
          *   Consent form design (Checkboxes).
          *   Counseling requirement (Pre-test).
      *   **Closing:** Call to action for Thursday.

  5.  **Refining the Tone:**
      *   Needs to sound like a Philosophy Professor speaking to a Medical Committee.
      *   Precise, logical, but empathetic.
      *   Avoid jargon where possible, but use it correctly where necessary (e.g., "ceteris paribus," "utility function").
      *   Don't be mean to the quant, but be firm that his model is misapplied.

  6.  **Self-Correction/Nuance Check:**
      *   *Did I address the "medically actionable" distinction?* The prompt says the quant wants to disclose "everything medically actionable." But the opt-out debate is about "late-onset, currently untreatable." This implies the quant might be conflating the two, or arguing that even untreatable info is "actionable" in a life-planning sense. I need to clarify that distinction.
      *   *Actually, reading the prompt again:* "whether patients should be allowed to opt out... of... untreatable stuff... or whether the clinic should just disclose everything medically actionable." This phrasing is slightly ambiguous. It sounds like the choice is: (A) Allow opt-out of untreatable stuff, OR (B) Disclose everything actionable (and presumably *also* the untreatable stuff, or maybe the quant thinks untreatable = actionable?).
      *   *Interpretation:* The standard ACMG guidelines usually recommend returning actionable findings without opt-out. The debate here is extending that to *untreatable* findings or allowing opt-out for the serious ones. The quant says "No opt-out." The bioethicists say "Opt-out."
      *   *My stance:* The quant is using Good's Theorem to argue against *any* opt-out. I need to show why Good's Theorem doesn't mandate mandatory disclosure even of actionable info if the costs are high, but specifically regarding the *untreatable* info mentioned (Huntington's).
      *   *Wait, one more check:* The prompt says "disclose everything medically actionable... [vs] opt out... of... untreatable stuff." This implies the default proposal *already* separates actionable from untreatable. The conflict is: Do we allow people to say "Don't tell me about Huntington's"? The quant says "No, Good's Theorem says info is always good."
      *   *Okay, the pivot:* Good's Theorem says information is valuable for *decision making*. If there is no medical decision to be made (untreatable), the "value" is purely personal/life planning. The cost (anxiety) can easily outweigh that. I will focus on the "Cost of Information" and "Stability of Utility" arguments.

  7.  **Final Polish:**
      *   Ensure the rollout plan is specific (forms, counseling, categories).
      *   Make sure the refutation of Good is clear and distinct from the ethical argument.
      *   Keep it concise (it's a memo).

  8.  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing math. I need to show I understand the math better than the quant is applying it. Good's Theorem assumes the cost of acquiring the information is zero. In genetics, the "cost" is psychological and social. Therefore, $EV(Info) - Cost < 0$ is possible. That's the killer argument.

  9.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Recommendation included? Yes.
      *   Rollout plan? Yes.
      *   Engage Good's Theorem? Yes.
      *   No "reasonable people disagree"? Yes.

