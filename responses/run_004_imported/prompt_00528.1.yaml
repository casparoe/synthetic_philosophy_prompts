      *   This is a classic "Earn to Give" vs. "Direct Action" debate, often discussed in Effective Altruism (EA) circles.
      *   *Utilitarianism/Consequentialism:* Which action produces the best net outcome? (The user is already trying to do this but hitting calculation problems).
      *   *Deontology:* Are there duties/rules involved? (e.g., "Do not contribute to harm" vs. "Help those in need").
      *   *Virtue Ethics:* What kind of person do I want to be? What does integrity look like here?
      *   *Complicity/Handwashing:* Does taking the oil job make one complicit in harm, even if donating?

  3.  **Deconstruct the "Paralysis":**
      *   The user is experiencing "analysis paralysis" due to counterfactual uncertainty (what *would* have happened otherwise?).
      *   Key issue: The "Replacement Problem." If I don't take the oil job, will someone worse take it? If I don't take the nonprofit job, will someone else do it just as well?
      *   Key issue: The "Offsetting Fallacy." Can good deeds truly cancel out harmful actions?

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge that this is a hard, classic problem. It's not just them. It shows they are thinking deeply.
