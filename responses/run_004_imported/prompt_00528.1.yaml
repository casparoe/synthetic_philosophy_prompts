      *   **The Choice:** High-paying oil & gas job (donate most income) vs. Low-paying local environmental nonprofit job (direct impact).
      *   **The Conflict:**
          *   *Oil Job:* High income allows for significant donations (Effective Altruism style), but the work itself supports fossil fuel infrastructure (harm).
          *   *Nonprofit Job:* Direct positive work, but low pay limits donation potential, and long-term impact is uncertain (policy shifts, etc.).
      *   **The Feeling:** Paralysis, uncertainty, "the more I think, the less clear it gets."
      *   **The Request:** A way to reason through this, or validation that it's inherently unclear.

