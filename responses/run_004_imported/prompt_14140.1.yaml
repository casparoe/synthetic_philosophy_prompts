      *   *Key distinction:* Relation as a *universal* (abstract entity) vs. Relation as *relating* (ontological tie).
      *   *The "Difference" Argument:* If $R$ is a constituent, it's distinct from $a$ and $b$. Distinctness implies separability. If separable, they need something to hold them together. If $R$ holds them, what holds $R$ to them?
