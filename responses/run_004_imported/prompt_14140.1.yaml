      *   *The Core Issue:* Is an infinite chain of relations *explanatorily* fatal?
      *   *Benign View (Russell, Moore, Realists):* The first relation *does* the work. The subsequent ones are just analysis. We don't need to actually *add* them; they are implicit. The regress shows the structure of analysis, not a failure of reality.
      *   *Vicious View (Bradley, Idealists, some Tropists):* If the first relation doesn't explain the unity, adding more won't help. If $R$ needs $R'$ to connect it, $R$ wasn't doing the job. An infinite deferral of explanation is no explanation.
      *   *What Hangs on It:*
          *   **Realism vs. Monism:** If vicious, relations/properties aren't real distinct entities. Reality is One (Absolute).
