answer: |-
  This is one of those classic metaphysical headaches that looks like a word game until you realize it threatens to dissolve the entire architecture of realism. You've got the mechanics right, but your intuition on the "obvious move" is exactly where the battle lines are drawn.

  Here is the breakdown on why that move doesn't satisfy Bradley, how it generalizes beyond relations, and my honest take on whether it's vicious and what actually breaks if it is.

  ### 1. Why doesn't "Relations Just Connect" stop the regress?

  Your intuition is the standard Realist defense (championed by Russell and Moore against Bradley). The argument is: *Relations are essentially relating. To ask what relates the relation to the terms is a category mistake. It's like asking what makes a knife sharp—the knife just is sharp.*

  Bradley's counter is subtle but brutal. It hinges on the distinction between a relation as a **constituent** (a thing) and a relation as an **act** (a doing).

  *   **If the relation is a constituent:** If "loves" is an entity sitting in the fact alongside John and Mary, then we have a list: `[John, Loves, Mary]`. A list is not a unity. It's just three things. For them to be a fact, they must be *combined*. But if "Loves" is just another item in the list, it is inert. It cannot reach out and grab John. An object cannot perform an operation.
  *   **If the relation is an act:** If "loves" is the *act* of combining, then it isn't a constituent entity at all. But if it isn't an entity, what are we talking about when we analyze the proposition? We've lost the ontological ingredient.

  Bradley argues that if you treat the relation as a real entity (which Realists must), it becomes just another term requiring a tie. If you say, "No, this specific entity has the magical power of tying," Bradley asks: **In virtue of what?**

  If it ties *in virtue of its nature*, then its nature must be tied to it. (We are back at the regress). If it ties *brutely*, without explanation, then you have asserted a mystery. Bradley's point is that positing a "connecting entity" doesn't explain connection; it just adds a third thing that now needs connecting. The "obvious move" looks like a solution, but to Bradley, it looks like begging the question. It asserts unity rather than explaining it.

  ### 2. Is this specific to relations, or general?

  You spotted this correctly: **It is absolutely general.**

  Bradley applies the exact same logic to a single substance having a quality (e.g., "The apple is red").
  *   We have the apple ($a$).
  *   We have the quality red ($F$).
  *   If $a$ and $F$ are distinct, we need a tie of **instantiation** (or inherence) to glue them.
  *   But now we need a tie to glue the instantiation to $a$, and another to glue it to $F$.
  *   Regress.

  If $a$ and $F$ are *not* distinct (they are identical), then the apple is nothing but redness. It can't be round, sweet, or heavy, because it's just redness. You lose the multiplicity of properties.

  So, the problem is not specifically about polyadic relations (John/Mary); it is the **Problem of Ontological Unity**. How do many distinct entities become one complex fact without ceasing to be many? Bradley argues that on a realist ontology (where subjects, predicates, and relations are all distinct existents), unity is impossible. This is why he lands on **Monism**: Reality must be one indivisible Absolute, because any distinction introduces a gap that requires a bridge, which requires a bridge, ad infinitum.

  ### 3. The Honest Take: Vicious or Benign?

  This is where contemporary metaphysics splits.

  **The Case for Benign (The Russellian/Analytic View):**
  Most modern analytic metaphysicians (like David Armstrong or E.J. Lowe) treat the regress as **benign**.
  *   **The Argument:** The first relation *does* the work. $R$ relates $a$ and $b$. Full stop. The fact that we can *analyze* this as requiring $R'$ to relate $R$ to $a$ is a feature of our *discourse*, not reality. The regress is potential, not actual. We don't need an infinite chain of existing relations; we just need the first one to be a "non-relational tie" or a "fundamental ontological glue."
  *   **Why:** They argue that explanation has to stop somewhere. If you demand an explanation for how the glue glues, you will demand an explanation for how *that* explanation explains. At some point, you must accept a brute fact. Let the first relation be the brute fact.

  **The Case for Vicious (The Bradleyan/Coherentist View):**
  Bradley (and later philosophers like R. Gaskin or certain trope theorists) argue it is **vicious**.
  *   **The Argument:** An infinite deferral of explanation is no explanation at all. If the first relation $R$ cannot connect $a$ and $b$ without help from $R'$, then $R$ *failed* to connect them. Adding an infinite number of failed connectors doesn't result in a success. It's like trying to cross a room by taking steps that are half the remaining distance; you never actually arrive.
  *   **Why:** If the nature of $R$ doesn't include connecting, it can't connect. If it does include connecting, we need to know how that nature attaches to $R$. If you can't answer that, you haven't explained the unity of the proposition.

  **My Take:**
  It is **vicious if you care about explanation**, but **benign if you care about description.**

  If your goal is to provide a *reductive analysis* of what a fact is (breaking it down into simpler parts), Bradley wins. You can't build unity out of non-unity parts. No matter how many distinct entities you pile up, you never get a "fact," you just get a bigger pile.

  However, if your goal is simply to **catalogue what exists** (ontological description), the regress is harmless. You can say, "Facts exist. They are unified. I don't need to analyze *how* they unify, I just posit that they do." This is essentially the "Primitivist" move common in current metaphysics. They accept "instantiation" or "exemplification" as a primitive, unanalyzable universal.

  ### What Hangs on It?

  If the regress is vicious, the stakes are massive:

  1.  **The Death of Realism:** If distinct entities cannot unite, then subjects and properties aren't distinct. This pushes you toward **Bundle Theory** (objects are just bundles of properties, no substratum) or **Substratum Theory** (properties are modes of the substance, not distinct entities).
  2.  **Truthmakers:** If propositions/facts cannot be unified, what makes a sentence true? You might be forced into a **Truthmaker Maximalism** where only the whole Absolute exists, or conversely, a **Nominalism** where only particulars exist and "relations" are just linguistic conveniences.
  3.  **The Absolute:** Bradley's own conclusion was that relations are appearance, not reality. If the regress is vicious, pluralism is false. Reality is One. This kills the idea of independent objects interacting.
  4.  **Language vs. World:** It forces you to decide if the subject-predicate structure of language mirrors the world. Bradley says no; language fractures the seamless Whole. Russell says yes; the world is atomic, just like our logic.

  **Summary for your piece:**
  The "obvious move" fails because it treats a dynamic act (connecting) as a static object (a constituent). The problem is general to all complexity (properties in substances, not just relations). And whether it's vicious depends on whether you think ontology requires *explanation* (Bradley: Yes, so Realism fails) or just *cataloging* (Russell: No, so posit primitive unity and move on).

  If you want a punchy conclusion: Bradley's Regress shows that **existence is not a predicate, but unity is not a part.** You can't find the "unity" inside the fact by looking at the ingredients. If you think you can, the rabbit hole goes on forever.
