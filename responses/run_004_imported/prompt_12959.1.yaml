      *   **User's Insight:** Connects this to Al-Ghazali's occasionalism (specifically *The Incoherence of the Philosophers*, Discussion 17). Ghazali argues there's no *necessary* connection between cause and effect (e.g., fire and cotton), only habitual conjunction by God.
