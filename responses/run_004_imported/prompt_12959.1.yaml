      *   **Constraint:** Do *not* just say "Ghazali is a proto-Hume." Engage with the specific structure of his arguments and theology. Avoid generic empiricist skepticism labels.

  2.  **Deconstruct Al-Ghazali's Position (The *Tahafut al-Falasifa*):**
      *   *Target:* The Neoplatonic/Aristotelian philosophers (Avicenna et al.) who claimed causal necessity is intrinsic to nature.
      *   *Argument:* We observe conjunction (*iqtiran*), not connection (*ittisal*). We see fire touch cotton, then we see burning. We do not see the "power" of fire transferring to cotton.
