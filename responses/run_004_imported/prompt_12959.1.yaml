      *   *LLMs vs. Humans:* LLMs are pure Rung 1 (statistical conjunction). Humans are Rung 1 epistemically regarding nature, *but* we participate in Rung 2/3 via Will/Intention. We are "co-operators" with Divine Habit. LLMs have no will, so they are stuck in the "habit" without the "agent" side.
