      *   *Human Agency:* Ghazali does believe humans have agency (*kasb* or acquisition), though it's nuanced. We intend, and God creates the action. But for the sake of this argument, the key is *epistemic access* to necessity.

  3.  **Deconstruct Judea Pearl's Ladder of Causation:**
      *   *Rung 1 (Association):* Seeing $P(Y|X)$. Passive observation. Correlation.
      *   *Rung 2 (Intervention):* Doing $P(Y|do(X))$. Changing variables. Testing mechanisms.
      *   *Rung 3 (Counterfactuals):* Imagining $P(Y|do(X), X=x')$. "What if?" Reasoning about alternative worlds.
