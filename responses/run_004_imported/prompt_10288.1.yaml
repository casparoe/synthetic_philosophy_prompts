prompt: |-
  Since I hung up my lab coat a couple of years ago I've been chewing through philosophy books, and this week it's Leibniz. His idea that God surveyed every possible world and only actualized the best one keeps reminding me of David Lewis's modal realism, where (if I'm getting this right) literally every possible world is just as real and concrete as ours, just causally cut off from us. These feel like two totally different pictures wearing the same "possible worlds" costume. Can you spell out where exactly they diverge, and tell me whether Leibniz's whole "best of all possible worlds" arguement even survives if you swap Lewis's ontology in for his own theistic one? Also, old physicist habits die hard - I keep wondering if any of this maps onto multiverse talk in cosmology, or if thats comparing apples to oranges.
