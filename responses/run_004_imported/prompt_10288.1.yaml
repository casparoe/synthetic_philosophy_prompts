      *   *Comparison:*
          *   Vs. Leibniz: Physics doesn't invoke God's choice (usually). It's mechanistic.
          *   Vs. Lewis: Physics multiverses are usually part of *one* spacetime manifold or wavefunction, whereas Lewis's worlds are *causally isolated* and distinct individuals. Also, physics deals with *physically* possible, Lewis deals with *logically* possible (e.g., a world with talking donkeys is Lewis-possible, but maybe not physics-possible).
      *   *Verdict:* Closer to Lewis ontologically (concrete), but closer to neither metaphysically. It's "Apples to Oranges" regarding the *purpose* of the theory (explaining probability/initial conditions vs. explaining modality/truth conditions), but "Apples to Apples" regarding concreteness.

