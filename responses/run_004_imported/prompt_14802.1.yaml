  The difficulty you are encountering stems from a fundamental distinction in intuitionistic semantics: the difference between a proposition being **not forced** ($w \nVdash \phi$) and its **negation being forced** ($w \Vdash \neg \phi$).

  ### 1. The Logical Impossibility of $\neg(p \lor \neg p)$
  First, it is impossible to construct a Kripke model where $\neg(p \lor \neg p)$ is forced at the root. In intuitionistic logic, $\neg(p \lor \neg p)$ is a contradiction. 

  If we assume $w \Vdash \neg(p \lor \neg p)$, then by the semantics of negation, no future node can force $(p \lor \neg p)$. However, if any future node $v$ forces $p$, then $v$ also forces $p \lor \neg p$, which contradicts the assumption that $w$ forces its negation. More formally, $\neg(p \lor \neg p)$ is equivalent to $\neg p \land \neg\neg p$, which is intuitionistically inconsistent.

  ### 2. The Diagnosis: Why Your Model "Collapses"
  You mentioned that your model collapses because "as soon as I try to force $\neg p$ at every point where $p$ fails to be forced, I end up forcing $p \lor \neg p$." 

  This is exactly the point. In intuitionistic logic, $w \Vdash \neg p$ is defined as:
  $$\forall v \geq w, v \nVdash p$$
  Negation is a **global** property of the future of the node. You cannot simply "assign" $\neg p$ to a node because $p$ is currently absent. If there is *any* possible future path where $p$ could be verified, then $\neg p$ is not forced at the present.

  To reject the Law of Excluded Middle (LEM), you do not assert its negation; you simply construct a state of information where $p$ is neither verified nor refuted.

  ### 3. The Correct Countermodel
  To show that $p \lor \neg p$ is not a general law, we need a model where the root node $w_0$ forces neither disjunct.

  **The Frame:**
  *   **Nodes:** $W = \{w_0, w_1\}$
  *   **Relation:** $R = \{(w_0, w_0), (w_1, w_1), (w_0, w_1)\}$ (A simple chain where $w_0 \leq w_1$)

  **The Valuation:**
  *   $V(p) = \{w_1\}$ (So $w_1 \Vdash p$, but $w_0 \nVdash p$)

  **Evaluation at the Root ($w_0$):**
  1.  **Is $p$ forced?** No. By definition, $w_0 \nVdash p$.
  2.  **Is $\neg p$ forced?** No. To force $\neg p$ at $w_0$, $p$ must be absent from *all* future nodes. However, $w_1$ is a future node where $p$ is forced. Therefore, $w_0 \nVdash \neg p$.
  3.  **Is $p \lor \neg p$ forced?** No. Since neither disjunct is forced at $w_0$, the disjunction is not forced.

  ### 4. Philosophical Interpretation (Dummett)
  For a student of Dummett, this model illustrates the rejection of the "omniscience" principle inherent in classical logic. 

  In this model, $w_0$ represents a state of information where we lack a proof for $p$, but we also lack a proof that $p$ is impossible (since $w_1$ is a possible future where $p$ is proven). To assert LEM is to assume that our current state of information is "final" regarding $p$—that is, that we either already have a proof or we know that no proof is possible. Intuitionism rejects this by allowing for "gaps" in truth where a statement is currently undecidable but potentially verifiable.

  **Summary:** You cannot force $\neg(p \lor \neg p)$ because that is a contradiction. Instead, you demonstrate the rejection of LEM by building a "growing" frame where a node $w_0$ fails to force $p$ but also fails to force $\neg p$ because a future node $w_1$ exists where $p$ holds.
