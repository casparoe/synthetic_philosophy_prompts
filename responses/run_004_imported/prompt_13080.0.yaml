prompt: |-
  I've spent a good part of this year working through the Center on Long-Term Risk's material on threat-resistant bargaining, following on from the usual LessWrong entry points into acausal decision theory — Newcomb's problem, counterfactual mugging, and so on. One proposal from that literature I keep coming back to is the idea of "surrogate goals": since agents capable of accurately predicting one another (say, via source-code access or sufficiently correlated decision procedures) can threaten each other even absent any causal channel of interaction, a target might protect itself by credibly and publicly committing to treat threats against some invented, low-stakes "surrogate" value exactly as it would treat threats against its real values. The hope is that a threatener who gains nothing extra from targeting the real goal over the surrogate will end up threatening the surrogate instead, so the target can "capitulate" at essentially no real cost while its genuine values go untouched.

  I'd like you to argue for the following claim, as rigorously as you can: surrogate goals do not meaningfully reduce the expected harm from acausal threats made by sufficiently sophisticated threateners. The core worry is that any agent capable of constructing a credible acausal threat in the first place is also capable of recognizing that following through against a professed decoy extracts nothing of real value from the target, and that in any setting where the threatener's payoff depends even slightly on reputation, precedent, or interactions with other potential targets — which seems like the normal case rather than some contrived edge case — the threatener does strictly better by directing the threat at the target's genuine values instead. I'd like you to engage seriously with the most natural line of defense here: that the threatener need only be indifferent between targets, with the surrogate then favored on grounds of convention, cheapness of execution, or some other tie-breaking consideration, rather than dismiss that defense out of hand.

  I floated a version of this worry at a meetup a while back and got pushback along the lines of "that's exactly why the surrogate has to be linked tightly enough to the real goal that the threatener really is indifferent, full stop, with no room for reputational considerations to sneak back in" — so if your argument has a convincing response to that particular move, I'd especially like to see it.
reasoning: |-
  Here's a thinking process that leads to the argument against surrogate goals:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Surrogate Goals in the context of Acausal Threats/Threat-Resistant Bargaining (CLR, LessWrong, ADT).
      *   **Task:** Argue *for* the claim that surrogate goals do *not* meaningfully reduce expected harm from acausal threats by sophisticated threateners.
      *   **Core Worry:** Sophisticated threateners realize attacking the surrogate yields no real value. If payoff depends on reputation/precedent/other targets, attacking the real values is strictly better.
      *   **Specific Constraint:** Engage seriously with the defense that "indifference can be made perfect" (tight linking) so tie-breakers favor the surrogate. Do not dismiss this out of hand.
      *   **Target Audience:** Someone familiar with CLR material, ADT, Newcomb, Counterfactual Mugging. Needs rigor, not just intuition pumping.

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Surrogate Goal Mechanism:* I care about $X$. I commit to care about $Y$ (surrogate) exactly as much as $X$ regarding threats. Threatener $T$ wants me to do $A$. $T$ threatens to destroy $X$. I say "No, threaten $Y$." If $T$ is indifferent, $T$ threatens $Y$. I give in. $X$ is safe.
      *   *The Counter-Argument (My Task):* Why does this fail?
          *   **Information Leakage:** If $T$ knows $Y$ is a surrogate, $T$ knows destroying $Y$ doesn't hurt me *intrinsically*, only instrumentally via the commitment. But the commitment *is* the defense. Wait, the commitment is to treat threats to $Y$ as threats to $X$. So destroying $Y$ *does* hurt me (by violating my commitment function).
          *   **Reputation/Precedent:** If $T$ threatens others, they want to establish that threatening *what people actually care about* works. If I successfully deflect to $Y$, $T$ learns that deflection is possible. $T$ might punish me to prevent future deflection.
          *   **The "Indifference" Claim:** Can $T$ truly be indifferent? If $T$ destroys $X$, I suffer utility loss $-U$. If $T$ destroys $Y$, I suffer utility loss $-U$ (by commitment). So $T$ gets the same leverage. *However*, $T$'s utility function might include terms beyond my immediate capitulation.
          *   **Correlated Threateners:** If there are multiple threateners, or $T$ interacts with a population, attacking $X$ signals "I can find what you actually value." Attacking $Y$ signals "I let you play games."
          *   **The "Tight Link" Defense:** The proponent says: Make the commitment so strong that $T$ is *mathematically* indifferent. Then use a tie-breaker (e.g., "threaten the surrogate because it's cheaper for me to execute").
          *   **My Rebuttal to "Tight Link":** Perfect indifference is fragile. Any slight asymmetry in $T$'s epistemic state or utility function breaks it. Also, the tie-breaker itself becomes a target for optimization by $T$.

  3.  **Structuring the Argument:**
      *   **Introduction:** Define the surrogate goal proposal clearly. State the thesis (it fails against sophisticated agents).
      *   **Point 1: The Epistemic Problem (Knowing the Surrogate):** For the surrogate to work, $T$ must know about it. If $T$ knows it's a surrogate, $T$ knows the target's *true* vulnerability lies elsewhere. This creates a second-order incentive to punish the *strategy* of using surrogates.
      *   **Point 2: Reputation and Precedent (The Multi-Agent Context):** Acausal trade often implies acausal influence across a reference class. If $T$ is a general optimizer, it cares about how its strategy performs across the multiverse/reference class. Allowing surrogate deflection incentivizes all targets to use surrogates, reducing $T$'s overall leverage. $T$ pre-commits to ignore surrogates.
      *   **Point 3: The "Perfect Indifference" Rebuttal:** Address the specific pushback.
          *   *Fragility:* Indifference requires exact symmetry in $T$'s model of the target's utility.
          *   *Tie-Breakers are Levers:* If the tie-breaker is "cost of execution," $T$ can manipulate costs. If it's "convention," $T$ can set the convention.
          *   *Source Code Inspection:* If $T$ can read source code, $T$ sees the surrogate is fake. $T$ sees the *real* utility function is $U_{real}$, not $U_{surrogate}$. $T$ can threaten to modify the code or punish the *disposition* to use surrogates.
      *   **Point 4: Acausal Screening & Logical Correlation:** If $T$ and Target are logically correlated, $T$ might reason: "If I accept the surrogate, other logical copies of me accept surrogates. This reduces total extraction. I should reject surrogates to maintain high extraction across the reference class."
      *   **Conclusion:** Surrogate goals shift the battlefield but don't remove the war. They invite higher-order threats.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is this just saying "T is smarter"?
      *   *Correction:* No, it's about the structure of the game. It's about *incentive compatibility*. The surrogate goal changes the payoff matrix for $T$. If the new matrix gives $T$ a dominant strategy to ignore the surrogate (because accepting it lowers expected utility in the broader context), the surrogate fails.
      *   *Focus on the "Indifference" Defense:* This is crucial. The prompt specifically asks to handle the "make them indifferent" objection.
      *   *Argument:* Even if $T$ is indifferent regarding *this specific interaction*, $T$ is not indifferent regarding the *policy* of responding to surrogates. Acausal decision theory agents optimize policies, not just single actions. A policy of "Accept Surrogates" is dominated by "Reject Surrogates" because the latter yields higher utility from targets who *fail* to set up surrogates (or whose surrogates fail).
      *   *Wait, one nuance:* If *everyone* uses surrogates, maybe $T$ accepts them? No, because $T$ can threaten to destroy the *capacity* to set surrogates, or simply target the real values anyway to punish the attempt.
      *   *Key Insight:* The surrogate goal relies on $T$ caring only about the *immediate* leverage. But sophisticated $T$ cares about the *stability* of the threat mechanism itself.

  5.  **Drafting the Content - Section by Section:**

      *   **Intro:** Acknowledge the elegance of the proposal. State the counter-thesis: It fails because it ignores the threatener's incentive to optimize their *policy* across the reference class, not just the immediate payoff.
      *   **Section 1: The Policy-Level Objection (Acausal Decision Theory 101).** ADT agents choose policies. A policy of "Threaten Real Values" dominates "Threaten Surrogates" because it extracts more from agents who *don't* have surrogates. Since you can't guarantee *all* agents have surrogates (or that they are perfect), the dominant policy is to ignore surrogates.
      *   **Section 2: The Epistemic Asymmetry.** To make $T$ indifferent, $T$ must believe the surrogate is as costly to you as the real goal. But if $T$ can verify the surrogate is a surrogate (source code), $T$ knows your *true* suffering is lower if they threaten the surrogate (assuming the commitment isn't absolute). Even if the commitment is absolute, $T$ knows you *prefer* them to threaten the surrogate. $T$ can use this preference against you (e.g., "I will threaten the real goal *unless* you pay extra for me to threaten the surrogate"). This turns the surrogate into a tax.
      *   **Section 3: Addressing the "Perfect Indifference" Defense.**
          *   *Argument:* Proponents say "Make the utility loss identical."
          *   *Counter:* Indifference is unstable under logical correlation. If $T$ reasons acausally, they consider the impact of their choice on other similar negotiations. Accepting the surrogate sets a precedent that lowers $T$'s power globally. Therefore, $T$ is *not* indifferent at the policy level.
          *   *Tie-Breakers:* If $T$ is truly indifferent, who sets the tie-breaker? If it's "cheaper for $T$," $T$ can invest resources to make threatening the real goal cheaper (e.g., by developing better targeting). If it's "convention," $T$ can bully the convention.
      *   **Section 4: Second-Order Threats.** The existence of a surrogate goal is information. $T$ can threaten: "I see you installed a surrogate. I will destroy your real values *specifically because* you tried to hide them, to punish deception/evasion." This makes the surrogate a liability.
      *   **Conclusion:** Surrogate goals transform a first-order threat into a second-order bargaining game about the rules of threatening. In this second-order game, the threatener usually holds the advantage because they control the violence/coercion.

  6.  **Review against Constraints:**
      *   *Rigorous?* Use ADT terminology (policies, reference classes, logical correlation).
      *   *Engage "Indifference" defense?* Yes, dedicated section.
      *   *Tone:* Serious, analytical, respectful of the source material but critical.

  7.  **Final Polish:** Ensure the distinction between causal and acausal threats is clear. In acausal contexts, the "reputation" isn't social, it's logical/structural. Emphasize that the threatener is also an ADT agent. (Self-Correction: Make sure not to conflate "reputation" in the human sense with "policy selection" in the ADT sense, though they map similarly).

      *Refining the "Indifference" Rebuttal:* The strongest point here is that ADT agents don't just maximize utility in the instance; they maximize the output of their decision algorithm across all instantiations. If "Ignore Surrogates" is a better algorithm than "Accept Surrogates" (because it works on non-surrogate users), a sufficiently reflective agent will adopt "Ignore Surrogates." Therefore, the target cannot rely on the threatener being indifferent *at the point of decision*, because the threatener pre-commits to a policy that isn't indifferent.

      *Refining the "Tight Link":* Even if the utility loss is identical, the *informational content* differs. Threatening the real goal confirms $T$'s model of the target. Threatening the surrogate confirms $T$'s susceptibility to manipulation. $T$ values the former more for future modeling.

