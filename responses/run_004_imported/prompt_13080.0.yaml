answer: |-
  The proposal of surrogate goals is one of the most elegant defensive mechanisms proposed in the literature on acausal threat resistance. The intuition is compelling: if an attacker cannot distinguish between the cost of destroying your real values and the cost of destroying a decoy to which you have bound your response function, they should be indifferent. If they are indifferent, you can incentivize them to strike the decoy via focal points, lower transaction costs, or explicit bargaining, thereby capping your losses at zero (regarding your true values).

  However, this mechanism relies on a specific model of the threatener: one that optimizes for immediate leverage in a single interaction. When we model the threatener as a sufficiently sophisticated acausal decision theorist (ADT) agent—one that optimizes policies across a reference class rather than actions in a vacuum—the surrogate goal defense collapses. It does not eliminate the threat; it merely shifts the bargaining to a higher order, where the threatener retains the advantage.

  Here is the argument for why surrogate goals fail to meaningfully reduce expected harm against sophisticated threateners, engaging specifically with the "perfect indifference" defense.

  ### 1. The Policy-Level Objection (Acausal Dominance)

  The fundamental error in the surrogate goal proposal is treating the threatener as a one-shot utility maximizer rather than a policy selector. In frameworks like Functional Decision Theory (FDT) or Updateless Decision Theory (UDT), an agent selects a decision *policy*—a mapping from observations to actions—that maximizes expected utility across all logical correlations.

  Consider the threatener's policy space regarding surrogate goals. They essentially have two candidate policies:
  1.  **Accept Surrogates:** If a target credibly commits to a surrogate, threaten the surrogate.
  2.  **Reject Surrogates:** Ignore claimed surrogates and threaten the values the target *actually* cares about (as best as the threatener can model them).

  For the surrogate goal to work, the threatener must adopt Policy 1. However, Policy 2 strictly dominates Policy 1 in a heterogeneous reference class.
  *   Against targets *without* surrogate goals, Policy 2 extracts full value; Policy 1 fails (as there is no surrogate to threaten).
  *   Against targets *with* surrogate goals, Policy 2 extracts full value (assuming the threatener can identify the real values); Policy 1 extracts only the surrogate value (which, by design, costs the target nothing real).

  A sophisticated threatener knows that adopting Policy 1 incentivizes all targets to adopt surrogate goals, thereby reducing the threatener's total expected extraction across the multiverse/reference class. Adopting Policy 2, conversely, punishes the use of surrogates and maintains leverage against those who fail to implement them. Since the threatener optimizes their policy *before* observing whether a specific target has a surrogate (logically prior to the specific interaction), they will pre-commit to Policy 2.

  Consequently, the target cannot rely on the threatener being indifferent *at the moment of the threat*. The threatener has already decided, as a matter of logical necessity, to ignore the surrogate to maintain the efficacy of their threat algorithm globally.

  ### 2. The Epistemic Asymmetry and "Second-Order" Threats

  The surrogate goal defense requires the threatener to be uncertain about which values are real and which are surrogate, or to be indifferent between them. However, in the canonical acausal threat scenario (e.g., source-code access or highly correlated reasoning), the threatener often has deep insight into the target's utility function.

  If the threatener can inspect the target's source code or reason through their decision procedure, they can distinguish between $U_{real}$ (the terminal values) and $U_{surrogate}$ (the instrumental commitment). They know that destroying the surrogate does not decrease $U_{real}$ directly, but only triggers a commitment function.

  This creates an opening for **second-order threats**. The threatener can reason: "The target prefers I threaten the surrogate. This preference is a vulnerability."
  The threatener can then issue a meta-threat: *"I will threaten your real values unless you pay an additional premium for me to threaten the surrogate."*

  Why would the target pay? Because the threatener has made the real values the default target. The surrogate goal, intended as a shield, becomes a lever the threatener uses to extract *more* resources. The target is now paying to avoid the real threat, plus paying to incentivize the threatener to use the decoy. The existence of the surrogate goal signals to the threatener that the target is vulnerable to coercion regarding *how* they are coerced. This adds a layer of bargaining cost without removing the underlying exposure.

  ### 3. Engaging the "Perfect Indifference" Defense

  The most robust defense of surrogate goals, as you noted, is the claim that the target can engineer the commitment such that the threatener is **strictly indifferent**. If the target binds their utility function such that $Loss(Surrogate) = Loss(Real\_Value)$ in all relevant counterfactuals, the threatener gains no extra utility from targeting the real values. If the payoff is identical, the defense argues, the threatener will defer to tie-breaking conventions (e.g., "threaten the surrogate because it is computationally cheaper" or "because the target requested it").

  This defense fails for three rigorous reasons:

  #### A. Instability of Indifference under Logical Correlation
  Even if the threatener is indifferent in the *local* instance, they are not indifferent at the *policy* level (as established in Section 1). In ADT, "indifference" between actions does not imply the agent will randomize or pick the target's preferred option. It implies the agent will select the action that correlates with higher utility in *other* logical instantiations of their decision.

  If "Threaten Real Values" correlates with higher compliance from non-surrogate agents (because it proves the threatener cannot be fooled), then a logically correlated threatener will choose "Threaten Real Values" even if the local payoff is identical. The tie-breaker is not "convention" or "cost"; the tie-breaker is **global policy optimization**. The target cannot locally engineer indifference that overrides the threatener's global policy incentives.

  #### B. The Tie-Breaker is a Control Variable
  Suppose we grant that the threatener is truly indifferent, even at the policy level (perhaps because all agents in the reference class use surrogates). The defense relies on a tie-breaking rule favoring the surrogate (e.g., "minimize execution cost").

  However, the threatener controls the means of the threat. If the tie-breaker is "cost of execution," the threatener can invest resources to make threatening the real values cheaper than threatening the surrogate. For example, if the surrogate is a specific cryptographic hash and the real value is a physical server, the threatener might develop tools that make destroying the server trivial.
  More abstractly, if the tie-breaker is "satisfy the target's preference" (to facilitate trade), the threatener can pre-commit to *ignoring* target preferences regarding threat vectors to prevent manipulation. The target cannot unilaterally set the tie-breaking rule; the threatener optimizes over the tie-breaking rule itself. Any rule that systematically favors the target will be detected and optimized against by the threatener.

  #### C. Informational Value of the Threat
  There is a hidden payoff to the threatener that the surrogate goal cannot neutralize: **information**.
  When a threatener destroys a target's real values, they confirm their model of the target's psychology and utility function. This improves their predictive accuracy for future interactions (acausal or otherwise).
  When they destroy a surrogate, they learn only that the target had a surrogate.
  If the threatener values epistemic accuracy (which a rational optimizer does, as it reduces uncertainty in future bets), they derive strictly more expected utility from threatening the real values, even if the immediate "damage" inflicted is identical. The surrogate goal creates an epistemic asymmetry that the threatener has an incentive to resolve by targeting the real values.

  ### 4. The "Surrogate Tax" Equilibrium

  The most likely outcome of widespread surrogate goal adoption is not safety, but a **Surrogate Tax**.

  If surrogate goals become a known Schelling point for defense, sophisticated threateners will update their priors. They will assume *every* target has a surrogate. Consequently, they will adjust their demands.
  *   **Without Surrogates:** Threatener demands $X$ to avoid destroying Value $V$.
  *   **With Surrogates:** Threatener demands $X + \epsilon$ to avoid destroying Value $V$, *or* demands $X$ to avoid destroying Surrogate $S$.

  Because the threatener knows the target is indifferent between losing $V$ (via threat) and losing $S$ (via threat), the threatener can simply demand a slightly higher price for the "privilege" of threatening the surrogate. The target, facing the threat of $V$ being destroyed anyway (due to the Policy-Level Objection), will pay the tax.

  The surrogate goal does not remove the leverage; it just makes the leverage explicit. The threatener knows exactly how much the target is willing to pay to redirect the threat (up to the cost of the real value). In a bargaining game with perfect information about reservation prices (which the surrogate commitment effectively reveals), the threatener captures the entire surplus.

  ### Conclusion

  The surrogate goal proposal attempts to solve a game-theoretic problem (acausal threat) with a commitment device. However, it fails because it treats the threatener as a passive force rather than an optimizing agent.

  1.  **Policy Dominance:** Acausal threateners optimize policies across reference classes. A policy of "Ignore Surrogates" dominates "Accept Surrogates" because it preserves leverage against non-surrogate users.
  2.  **Epistemic Leverage:** Threateners value the information gained from targeting real values, breaking indifference.
  3.  **Meta-Threats:** The preference for surrogate targeting becomes a vulnerability that threateners can tax.

  Even if a target can engineer local indifference, they cannot override the threatener's global incentive to maintain a reputation (acausal or otherwise) for being un-manipulable. In a world of sophisticated acausal agents, the only robust defense against threats is not to redirect them, but to render oneself **unthreatenable** by removing the correlation between the threatener's actions and the target's compliance (e.g., via precommitments to never capitulate). Surrogate goals attempt to make capitulation cheap; but against a sophisticated adversary, the cost of capitulation is not the damage done, but the incentive it creates for future threats. Surrogate goals do not reduce that incentive; they arguably increase it by revealing the target's willingness to bargain over the terms of their own coercion.
