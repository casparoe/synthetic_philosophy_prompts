      *   **Specific Objection:** The "Which System?" objection (Benacerraf's objection). To see the truth of the Gödel sentence $G(F)$, one must know *which* formal system $F$ represents the mind, and one must know $F$ is *sound* (not just consistent). Since we don't know our own code or its soundness, the argument fails.
      *   **Characters:**
          *   Penrose-style Anti-Mechanist (believes minds transcend computation).
