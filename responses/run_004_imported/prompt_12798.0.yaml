answer: |-
  The lab hummed, a low-frequency thrum that lived in the teeth more than the ears. On the steel table sat a pyramid of Roma tomatoes, thirty-six of them, harvested from the same vine at the same hour. To me, they were a uniform study in crimson. To Fred, they were a landscape.

  "Left pile," Fred said, placing a fruit down without hesitation. "Right pile."

  He didn't look at me. He never did during the sorting. His eyes were soft, unfocused in a way that suggested he was listening to the light rather than watching it. I watched the spectrometer readout beside me. The wavelengths were identical to within a nanometer. Physically, chemically, structurally, Tomato A and Tomato B were twins. But Fred sorted them with the ease of a librarian separating hardcovers from paperbacks.

  "You're favoring your left hand today," I noted, marking the clipboard.

  "It's not about the hand, Elena. It's about the gap."

  "We've measured the gap," I said, tapping the screen showing the MRI reconstruction of his visual cortex. "Your cone density is higher. You have a fourth receptor type sensitive to the long-wave spectrum. We know the wiring. We know the signal transmission rate. We know the chemical cascade."

  Fred picked up another tomato. He held it up to the overhead lamp, turning it slowly. "You know the mailman's route. You don't know what's in the letter."

  "I know what the letter says because I know the language it's written in." I walked around the table, leaning against the cold steel. "If I know exactly which neurons fire, and in what sequence, and what chemical bath they swim in, what is left? What extra piece of information are you hiding in there?"

  "Not hiding. Holding." He placed the tomato in the left pile. "Look at it."

  "I am looking."

  "No. You're measuring. There's a difference." He finally met my eyes. His were brown, ordinary. "Tell me, Elena. When you look at this pile, what do you see?"

  "Red. ripe, consistent red."

  "And when you look at the other?"

  "Same red. Maybe a slight variation in surface texture, but the color is identical."

  Fred sighed, a sound like air escaping a sealed room. "To me, the left pile is... warm. Like a blanket fresh from the dryer. The right pile is sharp. Like the taste of a penny. They aren't just different signals. They are different kinds of being. You have all the physics, Elena. You have the map. But you've never walked the ground."

  "If I build a robot with your eyes and your brain structure," I said, reciting the argument we'd worn smooth over three years, "and I program it to sort them exactly as you do, and I give it a voice to say 'warm' and 'sharp,' has it missed anything? Does the robot suffer from a lack of knowledge?"

  "The robot simulates the sorting. It doesn't see the red."

  "It processes the data!"

  "It processes the shadow," Fred corrected gently. "You think that if you list every atom in the fire, you've described the burn. But you haven't felt the heat. Knowing the frequency of the wave isn't the same as knowing the color."

  I looked back at the monitor. The neural pathways lit up in green and gold, a beautiful, complex web. I could trace the signal from the retina to the visual cortex. I could predict his behavior with one hundred percent accuracy. By every metric of my profession, I understood Fred completely. I knew the mechanism of his sight better than he did.

  And yet, standing there, looking at the tomatoes, I felt a hollow ache behind my own eyes. A sense of deprivation.

  "Suppose I believe you," I said, my voice quieter. "Suppose there is a fact about the world—a real, true fact—that exists only in your experience. A fact that isn't contained in the wavelength or the neuron. Where does that fact live? If it doesn't interact with the physical world, if it doesn't change the atoms, how is it real?"

  Fred picked up the last tomato. He held it between us, a sphere of suspended light. "It lives here. In the seeing. It's real because it's the only thing either of us actually encounters. The atoms are your inference. The red is my evidence."

  He placed the tomato in the right pile. The sorting was done. Two perfect mounds of fruit. Identical to me. Distinct worlds to him.

  "I can't give it to you," Fred said, wiping his hands on his jeans. "And you can't measure it. You can only stand on the edge and trust that the water is wet."

  He left the lab then, the door clicking shut behind him. The hum of the freezer grew louder in the silence.

  I stood alone with the tomatoes. I picked one up from the left pile. I brought it close to my face, staring into the skin until my eyes watered. I tried to force my brain to split the color, to find the seam where the warm red ended and the sharp red began. I thought about the fourth cone. I thought about the neural cascade. I thought about the physics of light absorption.

  I knew everything there was to know about the tomato, scientifically. I knew its mass, its sugar content, its reflectance profile. I knew exactly why Fred sorted it where he did.

  I closed my eyes. The afterimage bloomed against my eyelids, a ghostly green sphere.

  When I opened them, the red looked the same as it always had. Solid. Uniform. Unbroken. But for a second, just a fraction of a heartbeat, the surface seemed to shimmer, as if something were moving beneath the skin, something too fast for the spectrometer and too quiet for the MRI.

  I reached for my clipboard to log the session results. My pen hovered over the paper. *Subject successfully distinguished stimuli.* That was the fact. That was the data.

  I looked at the tomato again. It stared back, mute and heavy. I wrote down the data, but I didn't sign the form. I just sat there, wondering if I was looking at a object, or if I was looking at a door, and whether knowing the lock mechanism was the same thing as having the key. The red didn't change, but the silence in the room felt suddenly full of something I couldn't name.
