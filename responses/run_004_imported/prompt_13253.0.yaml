          *   *Resolution:* Anthropic reasoning should set *priors*, not overwrite *likelihoods*. Empirical evidence about AI, nukes, bio, etc., is the likelihood.
      *   *Practical Conclusion:* Don't let SIA make you complacent. Use it to set the baseline probability of a long future, but update heavily on empirical x-risk data. The PP trap is ignoring the empirical data in favor of the anthropic prior.

