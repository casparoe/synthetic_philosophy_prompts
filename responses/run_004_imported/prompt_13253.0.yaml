          *   SSA version: "Doom is nigh, so why bother?" (Defeatism).
          *   *Correct Approach:* Anthropic reasoning provides the *prior*. Empirical x-risk work provides the *likelihood*.
      *   **Section 3: Practical Upshot for X-Risk Reasoning:**
