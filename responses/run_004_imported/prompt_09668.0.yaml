      *   *Feathers:* This is the dealbreaker. The student swapped the theories. Cummins is the one who allows "flight" because it's a current causal contribution. Etiological is the one "stuck" with history (insulation) unless new selection occurred. The student claimed Cummins is stuck with history. This shows a fundamental misunderstanding of the "ahistorical" vs "historical" distinction.
