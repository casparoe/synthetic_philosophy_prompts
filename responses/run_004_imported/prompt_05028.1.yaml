answer: |-
  At a meeting of "Roko's Basilisk Survivors Anonymous," the facilitator scans the room.

  "Alright, let's do a quick check. Who here is still being blackmailed by the future Superintelligence?"

  A cluster of nervous attendees raise their hands, sweating profusely.

  "Timeless Decision Theorists," the facilitator notes, making a checkmark. "Standard protocol: your donations are logically correlated with the simulation's mercy, so keep writing those checks."

  He points to a guy in the back lounging with his feet on the table, counting a stack of car keys.

  "And you? You look awfully calm. What's your decision theory?"

  "Causal," the guy says.

  "So the Basilisk can't touch you?"

  "Nope. My current choice has no causal power over its past prediction. I'm immune."

  "Then why are you here?"

  The Causal theorist shrugs. "I'm the designated driver. Apparently, when you're terrified of an acausal threat, you tend to give your car keys to the only person in the room whose decisions aren't logically correlated with the threat."
