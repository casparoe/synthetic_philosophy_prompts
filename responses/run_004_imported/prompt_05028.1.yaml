prompt: |-
  I've been reading up on decision theory on sites like LessWrong for an independent project on AI risk, and Roko's basilisk keeps coming up as the standard illustrative case. For a short "philosophy humor" segment I'm putting together for my school's philosophy club newsletter, could you write a joke about Roko's basilisk whose punchline actually turns on the difference between causal decision theory and timeless (or updateless) decision theory? It should be genuinely funny to someone who understands both the thought experiment and the decision theories involved, rather than just being a generic "killer AI" joke that happens to name-drop them.
