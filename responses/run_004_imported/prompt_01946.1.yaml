          *   Let's make it a moment of uncertainty. Elena (SSA) wants to be a Halfer but sees the Thirder logic. Marcus (SIA) is comfortably Thirder but worries about "centered worlds."
      *   **Closing:** No resolution. Both see the cost. Elena accepts weird Doomsday implications to avoid Presumptuousness. Marcus accepts Presumptuousness to avoid Doomsday/Reference Class arbitrariness.

  4.  **Writing - Iteration 1 (Mental Outline & Key Lines):**
