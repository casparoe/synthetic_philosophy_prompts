      *   **Marcus's Defense:** It's not magic; it's Bayesian. You are more likely to exist in a universe with more observers. Ignoring this is selection bias.
      *   **The Turn (Doomsday & Reference Class):** Marcus attacks Elena. If you stick with SSA, you get the Doomsday Argument. Humanity must be near the end. Elena tries to dodge via Reference Class (who counts as an observer?). Marcus pounces: That's arbitrary. You're tuning the reference class to avoid the bullet.
      *   **Sleeping Beauty Test:** They need to check their consistency.
          *   Standard mapping: SIA $\rightarrow$ Thirder, SSA $\rightarrow$ Halfer.
