          *   SIA Defender's Counter: Turn the tables on the Doomsday Argument and the Reference Class problem.
          *   Twist/Test: Apply commitments to the Sleeping Beauty problem. Do SSA/SIA map cleanly onto Halfer/Thirder positions?
