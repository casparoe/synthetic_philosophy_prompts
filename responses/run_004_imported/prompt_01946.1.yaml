answer: |-
  **The Anthropocentric Tax**
  *A Dialogue on Anthropics*

  **Characters:**
  **ELENA:** Defends the Self-Sampling Assumption (SSA).
  **MARCUS:** Defends the Self-Indication Assumption (SIA).

  **Setting:** *A hotel lobby bar, following a panel on anthropic reasoning. The noise of the conference has faded; only the clink of ice remains.*

  **ELENA:** You really doubled down on the Presumptuous Philosopher, Marcus. I watched the room squirm. When you said that, under SIA, we should be nearly certain the universe is physically vast simply because it contains more observers, I thought the chair was going to call time.

  **MARCUS:** The room squirmed because they want to have their cake and eat it too. Look, Elena, it's simple Bayesianism. If Theory A posits one trillion observers and Theory B posits one trillion trillion, and you have no other data, where is it more likely that *you* find yourself?

  **ELENA:** That's the question-begging move! You're treating "I exist" as data that favors the larger universe. But "I exist" is guaranteed in both theories. I exist in A, I exist in B. The probability of my existence given either theory is one. So the likelihood ratio is one. You're getting a free lunch on cosmology just by doing arithmetic on people.

  **MARCUS:** No, I'm accounting for selection effects. You're acting as if you were a disembodied soul randomly assigned to a universe. But you aren't. You are an observation *within* a universe. If B has a thousand times more observation-points than A, a random sampling of observation-points falls in B a thousand times more often. To ignore that is to ignore the sample space.

  **ELENA:** It's not ignoring the sample space; it's refusing to let the sample space dictate the prior. If I accept your SIA, I have to tell a physicist that she doesn't need a telescope to decide between a multiverse model and a single-universe model. She just needs a census. That's not epistemology; it's magic. It's the Presumptuous Philosopher exactly: claiming to know the size of reality from the armchair.

  **MARCUS:** And if I accept your SSA, I have to tell a demographer that humanity is likely to go extinct soon. Doomsday, Elena. You own the Doomsday Argument. According to SSA, I should reason as if I am a random sample from all humans who will ever live. If I find myself among the first 100 billion, it's highly probable that the total number of humans isn't vastly larger than that. So, no space colonization. No long future. Just a bottleneck. Which cost is higher? That I'm presumptuous about cosmology, or that you're pessimistic about extinction?

  **ELENA:** The Doomsday Argument is a *reductio*, not a conclusion. It shows that SSA needs constraints. That's where the reference class comes in. I don't sample from "all observers." I sample from "observers relevantly similar to me."

  **MARCUS:** *There* it is. The reference class escape hatch. "Relevantly similar." Who decides? If you define the class as "humans born before 2050," Doomsday vanishes. If you define it as "all sentient beings," Doomsday returns. You're tuning the reference class to avoid the bullet. It's ad hoc. You're gerrymandering the set of observers to save your priors.

  **ELENA:** It's not gerrymandering; it's specificity. Probability is always relative to a model. If I'm calculating the probability of drawing a red ball, I need to know which urn I'm drawing from. The reference class *is* the urn. The problem with your SIA isn't just the Presumptuous Philosopher; it's that it makes existence a probability booster. It implies that I should have been more surprised to exist in a small universe than a large one, even before I looked around.

  **MARCUS:** You *should* be! Think about Sleeping Beauty. It's the same structure.

  **ELENA:** *(Sighs)* I was wondering when you'd bring her up. Fine. Sleeping Beauty. Sunday night. Coin flip. Heads: wake Monday. Tails: wake Monday and Tuesday, memory wiped each time. You wake up. What's your credence the coin was Heads?

  **MARCUS:** One-third. There are three possible awakenings: Heads-Monday, Tails-Monday, Tails-Tuesday. I am in one of them. Only one is Heads. SIA says I should favor the hypothesis that implies more observer-moments. Tails implies two; Heads implies one. So Tails is twice as likely.

  **ELENA:** And that's where the analogy breaks. In Sleeping Beauty, the number of awakenings is fixed by the experimental setup. In cosmology, the number of observers is the *variable* we're trying to test. But let's play your game. If I stick to SSA... I should reason as if I am a random sample from the set of awakenings. If the reference class is "awakenings," SSA also gives me one-third.

  **MARCUS:** *(Pauses, swirling his drink)* Wait. If SSA gives you one-third, then SSA and SIA agree on Beauty?

  **ELENA:** They do. Which means the divide isn't about the math of centered worlds. It's about the *ontology* of the reference class. If I'm a Halfer, I'm treating the coin toss as the primary sample space, not the awakenings. I'm saying, "I knew I would wake up at least once. Waking up gives me no new information."

  **MARCUS:** But you *are* a specific awakening. If you deny that, you're denying the indexical nature of the evidence. But if you admit it, Elena, your SSA pushes you to Thirding. And if you Third on Beauty, why won't you accept the Presumptuous Philosopher? In Beauty, you favor the hypothesis with more awakenings. In Cosmology, I favor the hypothesis with more observers. It's the same principle.

  **ELENA:** Because in Beauty, the difference in observer-counts is causally generated by the coin flip *within* the experiment. In the Presumptuous Philosopher case, the observer-counts are intrinsic to the competing physical theories. One allows for a trillion observers; the other allows for a googol. If I accept your move, I'm saying that a theory is more likely to be *true* just because it creates more *witnesses*. That makes truth dependent on audience size.

  **MARCUS:** It makes *your location* dependent on audience size. You're conflating the truth of the theory with the probability of finding yourself in it. They aren't the same, but they are linked by your existence. Look, we're both paying a tax, Elena. That's the point for the students.

  **ELENA:** Agreed. But look at the receipts. My tax is the Reference Class Problem. I have to explain why "all humans" is the wrong class without sounding like I'm just trying to avoid Doomsday. I have to live with the fact that my epistemology is sensitive to how I carve up "similarity."

  **MARCUS:** And my tax is Presumptuousness. I have to live with the fact that my epistemology allows armchair reasoning to overturn empirical priors. I have to tell the physicist that her theory is unlikely because it's "sparsely populated."

  **ELENA:** But there's a third cost for you. SIA favors the "Big World" so strongly it can swamp empirical evidence. If Theory B has enough observers, no amount of experimental data against it can lower its probability. You can become dogmatic.

  **MARCUS:** And there's a third cost for you. SSA allows for "freak observers." Boltzmann brains. If the universe is old and big, random fluctuations create more observers than evolution does. SSA says I should think I'm a Boltzmann brain, because there are so many more of them. You have to argue that I'm *not* a random sample from all observers to avoid solipsism.

  *(Silence settles between them. The bartender wipes the counter nearby.)*

  **ELENA:** So. I avoid the Presumptuous Philosopher by accepting the Doomsday Argument and wrestling with Reference Classes. You avoid Doomsday by accepting the Presumptuous Philosopher and risking dogmatism.

  **MARCUS:** And on Sleeping Beauty?

  **ELENA:** On Beauty, we might actually agree on the answer—Thirding—but for different reasons. You get there because more observer-moments exist. I get there because... well, if I define the reference class as "current awakenings," I get there. But then I have to explain why I change the reference class when we talk about Doomsday.

  **MARCUS:** And if you stay consistent on the reference class?

  **ELENA:** Then I'm a Halfer on Beauty and a Doomsayer on Humanity.

  **MARCUS:** And I'm a Thirder on Beauty and a Presumptuous Philosopher on Cosmology.

  **ELENA:** *(Picks up her bag)* We aren't teaching them methods, Marcus. We're teaching them which bullets they're willing to bite.

  **MARCUS:** *(Stands up)* That's all philosophy is, Elena. Choosing your poison. Just make sure they know the dosage.

  *(They nod, a mutual acknowledgment of stalemate, and walk in opposite directions toward the elevators.)*
