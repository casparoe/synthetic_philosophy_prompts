  **MEMORANDUM**

  **TO:** Grants Committee, University EA Alumni Fund
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Finalist Allocation ($180,000)

  **Recommendation**
  I recommend we allocate the full $180,000 to the **Against Malaria Foundation (AMF)**.

  While the biosecurity fellowship presents a higher *theoretical* ceiling for expected value, the epistemic uncertainty surrounding its marginal impact renders it unsuitable for this specific fund size. AMF offers a robust, verifiable impact that aligns with our mandate to "do the most good" under conditions of severe cluelessness.

  **Reasoning**

  **1. Addressing the Cluelessness Objection**
  Member 2 has raised the "cluelessness" objection: we cannot non-arbitrarily determine the long-term sign (positive or negative) of the fellowship's impact on existential risk. This is a valid concern. However, we must apply this objection symmetrically. We are also clueless about the long-term downstream effects of saving lives via AMF (e.g., demographic changes, economic growth).

  If cluelessness applies to both, it cancels out as a differentiator. We are left to compare **near-term proxies**. Here, AMF dominates. We have high-confidence evidence that AMF saves lives and reduces suffering in the short term. The fellowship's near-term output (two trained researchers) has no verified metric for risk reduction. When long-term causal chains are opaque, we should maximize good on the time horizon where our models are robust.

  **2. Addressing the Pascal's Mugging Concern**
  The fear that the fellowship is a "Pascal's Mugging" (tiny probability × astronomical value) is not dismissed, but refined. The issue is not necessarily that the probability of pandemic catastrophe is low, but that the **marginal tractability** of a $180,000 grant is negligible.

  Biosecurity policy is a "lumpy" good; it often requires sustained, multi-million dollar infrastructure to move the needle on existential risk. Two fellowships are unlikely to shift the trajectory of global pathogen surveillance meaningfully enough to justify the uncertainty. We are not buying a "lottery ticket" on x-risk reduction; we are buying a "drop in the bucket." AMF, conversely, purchases a guaranteed share of a proven intervention.

  **3. Why Not Split the Fund?**
  Member 3 suggested a split. While diversification is prudent in financial portfolios, it is not always principled in moral grantmaking. A split is only justified if the two options are *incommensurable* (i.e., governed by different moral frameworks). Here, we agree on the framework: maximize expected good. We disagree on the empirical inputs (probability of impact).

  Splitting the fund dilutes our impact in both areas without resolving the epistemic disagreement. It effectively hedges against our own conviction. If we believe AMF is the robust choice, splitting wastes money on a speculative bet. If we believe the Fellowship is the EV-maximizing choice, splitting wastes money on a lower-ceiling option. We must act on our best collective judgment of the evidence, not average our uncertainties.

  **The Strongest Case for the Fellowship**
  I must acknowledge the strongest argument for the fellowship, articulated by Member 1: **The Stakes.** If the longtermist case holds—that the far future contains vastly more potential people than the present—even a microscopic reduction in extinction risk outweighs saving thousands of lives today. If the fellowship *does* successfully place researchers who later identify a pivotal pathogen, the return on investment is effectively infinite. To ignore this possibility solely because it is hard to measure risks prioritizing the "measurable" over the "important."

  **Conclusion**
  We cannot verify the fellowship's impact chain. We can verify AMF's. Given our fund's size and lack of specialized biosecurity expertise, epistemic humility dictates we choose the intervention where "doing good" is a known quantity rather than a hopeful model.

  **Vote Requested:** Allocate $180,000 to the Against Malaria Foundation.
