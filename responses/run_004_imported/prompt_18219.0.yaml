prompt: |-
  Okay so a few weeks ago I went down a rabbit hole that started with the Fermi paradox and somehow ended with me lying awake worrying about the "Doomsday Argument" - the idea that just from knowing roughly where you fall in the sequence of all humans who will ever be born, you're supposed to update towards humanity ending relatively soon. I brought it up with a friend of mine who's way more into this stuff than I am, and he said the whole thing hinges on which of two competing assumptions you use, something called the "self-sampling assumption" and the "self-indication assumption," and that the second one is supposed to cancel the doomsday conclusion back out, except it only does that by leading to this other supposedly crazy result called the "presumptuous philosopher," where you'd basically have to bet everything on whichever theory of the universe implies way more observers exist, before any actual scientist even looks at any actual data. That felt like cheating in the opposite direction, and now I honestly don't know what to think, or whats even wrong with either option.

  I don't have any real background in probability or philosophy, just stuff I've picked up from podcasts and reddit threads, so please don't give me the version that just ends with "smart people disagree, who's to say." Can you actually walk through the most important implications of the self-sampling vs self-indication fight, and the presumptuous philosopher problem specifically, for how seriously I should take the Doomsday argument, and more broadly for whether it's ever legit to update your beliefs about the world just from facts about your own existence, like your birth rank, or which universe you happen to find yourself in. Trying to figure out if this is something I should actually be a little bit worried about, or if it more or less cancels itself out once you think it through properly.
