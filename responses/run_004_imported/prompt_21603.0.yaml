answer: |-
  Here is a draft of 10 questions for your seminar group. They are ordered strategically: the early questions address technical implementation issues where her "wrong basis" defense is most plausible (allowing her to settle in), while the later questions shift to metaphysical and empirical constraints where that defense becomes irrelevant or self-defeating.

  ### **Section 1: The Technical Groundwork**
  *(Here, the "wrong basis" defense is plausible, but the follow-ups ask for criteria to distinguish it from instrumentalism.)*

  **1. The Superposition Problem**
  "In superposition, models pack more features than neurons by using overlapping, non-orthogonal directions. If multiple different decompositions can sparsely explain the same activation space, what makes one decomposition the 'real' ontology rather than just the most computationally useful one for *us*? Is there a fact of the matter about which basis is the true one?"
  *   **Follow-up:** "If you say there is a fact of the matter, what mathematical property picks it out? If you say it's just the 'most useful' one, doesn't that slide back into the instrumentalism you're trying to avoid?"

  **2. Decodability and Probe Sensitivity**
  "Recent work on the 'interpretability illusion' shows that the semantic meaning we decode from a direction can shift significantly depending on the probe dataset or the regression method used. If the 'meaning' of a feature is unstable across methods, does decodability actually entail reality, or does it just measure how well the feature aligns with *human* categories?"
  *   **Follow-up:** "If the feature is real but our probes are just noisy, at what point does probe instability suggest the feature itself lacks a stable semantic identity, regardless of the basis we choose?"

  **3. Causal Robustness (Ablation)**
  "Representational realism usually implies that these features play a causal role in the model's output. However, ablation studies often show that zeroing out a 'real' feature has negligible effects on loss or behavior due to redundancy. If a representation is ontologically real but causally dispensable, in what sense is it a representation *of the model* rather than a representation *by the interpreter*?"
  *   **Follow-up:** "Does the 'wrong basis' defense apply here? If we find the 'true' basis but the ablation still doesn't change behavior, do we abandon the realism claim?"

  ### **Section 2: Structural and Metaphysical Constraints**
  *(Here, the "wrong basis" defense begins to fail because the problems are about identity and ontology, not coordinate systems.)*

  **4. Multiple Realizability**
  "Consider two training runs of the same architecture on the same data that converge to similar performance but utilize genuinely different circuits (different neurons/heads) to solve the task. Is there one 'real' representation underlying the behavior that both instantiate, or are there two distinct representations? If the latter, does representational realism fracture into a relativism about training seeds?"
  *   **Follow-up:** "You can't solve this by finding a 'better basis' because the weights are physically different. So, is the representation defined by the circuit structure or the functional output?"

  **5. Normativity and Misrepresentation**
  "A robust realism about representation usually allows for the possibility of error—a state can misrepresent the world. Can your view account for a model state that is a 'real representation' but is *false*? Or does successful prediction become the criterion for reality?"
  *   **Follow-up:** "If only successful features count as 'real representations,' isn't that just instrumentalism with extra steps? How do you distinguish a 'real false belief' from 'noise'?"

  **6. Dennett and Real Patterns**
  "Our TA noted that Dennett's 'Real Patterns' was intended as a deflationary realism—patterns are real only insofar as they support predictive compression for an observer. Your view seems to want a 'thicker' realism, where features exist mind-independently. Are you positing an ontological commitment that Dennett explicitly argued we don't need?"
  *   **Follow-up:** "If you reject Dennett's deflationism, what work is the 'mind-independent' part of your realism doing, other than satisfying a metaphysical intuition?"

  ### **Section 3: Falsifiability and Scope**
  *(Here, the "wrong basis" defense is exposed as a promissory note. These questions make it very hard for her to use without undermining her scientific credibility.)*

  **7. The Criterion for the "Right" Basis**
  "You've suggested that failed interpretability attempts often stem from looking in the 'wrong basis.' What defines the 'right' basis? Is it defined by mathematical properties (like sparsity) or semantic properties (like human interpretability)?"
  *   **Follow-up:** "If it's defined by semantic properties (i.e., it makes sense to *us*), doesn't that make the reality of the feature dependent on human cognition, undermining the mind-independent realism you defend?"

  **8. The Biological Analogy**
  "Do you hold this same standard of representational realism for biological brains? Do we need to find the 'right basis' in neural population activity before we can say a human has a real belief about the Golden Gate Bridge?"
  *   **Follow-up:** "If we accept representational realism in humans without perfect mechanistic resolution, why do we require a 'perfect basis' to grant the same status to machines?"

  **9. The Promissory Note**
  "Your defense often relies on the idea that current counterexamples are due to immature methods—essentially a promissory note that the 'true' features will be found later. Is there a timeline or a milestone where, if we haven't found these invariant features, we should conclude they aren't there?"
  *   **Follow-up:** "If the answer is 'no,' how is this view distinct from a faith-based commitment rather than a scientific hypothesis?"

  **10. Falsifiability Conditions**
  "Finally, what would actually count as evidence *against* representational realism? If every failure to locate a stable circuit can be attributed to 'not having the right basis yet' or 'the field being in its early days,' what empirical outcome would force you to abandon the view?"
  *   **Follow-up:** "If there is no possible evidence that could falsify the claim, does that not render the 'realism' part of your thesis metaphysically vacuous?"
