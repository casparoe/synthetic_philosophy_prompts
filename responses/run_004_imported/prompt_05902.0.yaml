prompt: |-
  During a long career studying alarm-call systems in vervet monkeys, I had little occasion for philosophy, but retirement has given me time to work through David Lewis's Convention, and one feature of it troubles me. Lewis holds that a regularity counts as a convention only if it is sustained by common knowledge within the population: everyone conforms, everyone expects everyone else to conform, and everyone knows this, knows that everyone else knows it, and so on without end. His own preferred illustration is a simple sender-receiver signaling game. Yet the evolutionary game theorists who later took up that very game - Skyrms's replicator-dynamics models, Peyton Young's adaptive-play learning - showed that a population can converge on one of several possible signaling conventions through nothing more than differential reinforcement of successful pairings, with no individual ever forming a belief about anyone else's beliefs, let alone an infinite regress of them. The alarm-call systems I spent my career studying display exactly the arbitrariness and self-perpetuation that a theory of convention is supposed to explain, in a species with no plausible capacity for the iterated mutual knowledge Lewis's account demands. Please argue that Lewis's common-knowledge condition is not actually necessary for a regularity to constitute a convention in the philosophically relevant sense - that evolutionary dynamics alone deliver everything his more demanding apparatus was meant to secure - and take on the strongest reason a defender of Lewis could give for thinking that mutual knowledge, rather than mere stable behavioral correlation, is indispensable to convention properly so called.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A retired primatologist/ethologist who studied vervet monkey alarm calls. They are familiar with empirical data on animal communication but have recently been reading David Lewis's *Convention*.
      *   **Core Problem:** Lewis requires "common knowledge" (CK) for a regularity to be a convention. Evolutionary game theory (Skyrms, Young) shows conventions can emerge via dynamics without CK. Vervet monkeys exhibit convention-like behavior (arbitrary, self-perpetuating signals) but lack the cognitive capacity for CK.
      *   **Task:** Argue that Lewis's CK condition is *not necessary* for a regularity to constitute a convention in the philosophically relevant sense. Argue that evolutionary dynamics secure what Lewis wanted. Address the strongest counter-argument from a Lewis defender (why CK might seem indispensable).
      *   **Tone:** Respectful, intellectually rigorous, bridging empirical ethology and analytic philosophy. Acknowledge the user's expertise.

  2.  **Deconstruct David Lewis's Account:**
      *   *Convention:* A regularity $R$ in behavior in a population $P$.
      *   *Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on the condition that others do (coordination equilibrium).
          4.  **Common Knowledge:** Everyone knows 1, 2, and 3; everyone knows that everyone knows, ad infinitum.
      *   *Motivation:* Lewis wanted to solve the "circularity" of expectation. Why do I expect you to conform? Because you expect me to. How do we break in? CK provides the rational foundation for the equilibrium.

  3.  **Deconstruct the Evolutionary/Functionalist Account:**
      *   *Mechanism:* Replicator dynamics, reinforcement learning, adaptive play.
      *   *Outcome:* Stable equilibria (signaling systems).
      *   *Cognitive Load:* Minimal. No need for higher-order beliefs.
      *   *Relevance:* Explains animal communication (vervets) and potentially human linguistic origins.

  4.  **Formulate the Argument (The "Yes, Lewis is too strict" position):**
      *   *Thesis:* The *function* of convention is coordination and information transfer. The *mechanism* can vary. CK is one mechanism (rationalist), evolutionary stability is another (naturalist). If the outcome is the same (stable, arbitrary coordination), the label "convention" should apply.
      *   *Key Point 1: The "Philosophically Relevant Sense".* What are conventions *for*? They solve coordination problems. If the problem is solved without CK, it's still a solution.
      *   *Key Point 2: The Continuity Argument.* If we deny vervets have conventions, we create an arbitrary discontinuity between human and non-human communication. If we accept them, Lewis's definition is too narrow.
      *   *Key Point 3: CK as a *Result*, not a *Precondition*.* CK might be a rational reconstruction of why a convention *persists* in reflective agents, not how it *starts* or *exists*.

  5.  **Identify the Strongest Lewisian Counter-Argument:**
      *   *The "Reason-Giving" Force.* Lewis isn't just describing behavior; he's describing *normative* force. Why *ought* I conform? Because it's a convention.
      *   *The Intentionality/Stipulation Point.* Human conventions involve an element of "we agree" (even tacitly). Animal behavior is just causal push-and-pull. Without CK, there is no *mutual recognition* of the rule. It's just habit.
      *   *The "Arbitrariness" Nuance.* For Lewis, arbitrariness implies a choice between alternatives based on expectations. In evolution, "choice" is selection. Is it truly arbitrary if it's biologically constrained? (Actually, vervet calls *are* arbitrary in the Saussurean sense, so this is less strong).
      *   *Best Counter:* **The Normative/Reasoning Gap.** Lewis defines convention as a solution to a *problem of reasoning*. If there is no reasoning, there is no convention in *his* sense, only *behavioral equilibrium*. The defender argues that "convention" implies a specific kind of social ontology (joint intentionality) that CK secures.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's unique position (field data meeting philosophy). Validate their intuition (Skyrms/Young support them). State the thesis: CK is a sufficient condition for *rational* agents, but not a necessary condition for *functional* conventions.
      *   **Section 1: What Lewis Was Trying to Save.** Explain *why* Lewis demanded CK. It was to avoid circularity in rational expectation. It was about *justification*, not just causation.
      *   **Section 2: The Evolutionary Alternative.** Explain how Skyrms/Young solve the coordination problem without CK. Stability replaces knowledge. If the system works, the "convention" label should track the function, not the cognitive machinery.
      *   **Section 3: The Vervet Case.** Apply this to the user's data. Vervet calls are arbitrary (leopard vs. eagle). They are normative (infants learn, adults correct). They function as conventions. Denying them the label creates a human-exceptionalist bias.
      *   **Section 4: The Strongest Lewisian Objection (The "Normative Force" Argument).** A defender would say: Without CK, there is no *obligation*, only *disposition*. Convention implies "we do this because we know we do this." Without that, it's just instinct or habit.
      *   **Section 5: Rebutting the Objection.** Distinguish between *epistemic* normativity (reasons) and *functional* normativity (success/failure). Evolutionary norms are real. Also, CK in humans might be a post-hoc rationalization of evolved instincts.
      *   **Conclusion:** Reiterate that the "philosophically relevant sense" of convention is about solving coordination problems arbitrarily. Evolutionary dynamics secure this. Lewis's CK is a specific *human* overlay, not the essence of the phenomenon.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't dismiss Lewis entirely. His account is brilliant for *rational* agents. The argument is about *necessity*, not sufficiency.
      *   *Nuance:* Make sure to distinguish between "convention" as a folk term and "convention" as a technical term. The prompt asks for the "philosophically relevant sense." I need to argue that the *philosophical* interest lies in the coordination/arbitrariness, not the cognitive recursion.
      *   *Tone Check:* Ensure I sound like I'm talking to a colleague, not lecturing a student. Use the vervet example actively.

  8.  **Final Polish:** Check against the prompt requirements.
      *   Argue CK is not necessary? Yes.
      *   Argue evolutionary dynamics deliver what Lewis wanted? Yes (coordination equilibrium).
      *   Take on the strongest Lewisian reason? Yes (the normative/reason-giving status).

  9.  *(Final thought before generating)*: Make sure to mention Brian Skyrms specifically, as the prompt name-drops him. He explicitly argues against Lewis on this point (*Signals*).

  10. **Constructing the Output.** (Proceed to write the response following this structure.)
answer: |-
  It is a pleasure to address a colleague who bridges the gap between the dusty archives of analytic philosophy and the sun-drenched fields of ethology. Your intuition is well-founded: the tension you perceive between David Lewis's *Convention* (1969) and the later evolutionary game theory of Brian Skyrms, Peyton Young, and others is not merely a technical discrepancy; it strikes at the heart of what we mean by "convention."

  You ask me to argue that Lewis's common-knowledge (CK) condition is not necessary for a regularity to constitute a convention in the philosophically relevant sense, and that evolutionary dynamics secure the essential features Lewis sought. You also ask me to engage the strongest defense of the CK requirement.

  Here is the case for decoupling convention from common knowledge.

  ### 1. What Lewis Was Trying to Secure
  To understand why we can discard the CK condition, we must first acknowledge what Lewis was using it for. Lewis was not primarily interested in the *causal origin* of conventions; he was interested in their **rational stability**.

  Lewis defined convention as a solution to a recurrent coordination problem. The puzzle he faced was circularity: I conform because I expect you to conform; you conform because you expect me to conform. How does this loop close? Lewis argued that without a base level of *common knowledge* (everyone knows $X$, everyone knows everyone knows $X$, ad infinitum), the expectations lack a rational foundation. For Lewis, a convention is a specific kind of **reason for action**. I follow the convention *because* I know it is a convention.

  However, this rationalist reconstruction conflates the *justification* of a convention with the *existence* of a convention. Lewis provided an account of how hyper-rational agents *maintain* conventions through reflection. He did not, perhaps, provide an account of what conventions *are* in the wild.

  ### 2. The Evolutionary Alternative: Stability Without Knowledge
  As you noted, Skyrms's replicator-dynamics models and Young's adaptive learning models demonstrate that populations converge on signaling systems without a single agent forming a belief about another's beliefs.

  In these models, a "convention" emerges as a **stable equilibrium**.
  1.  **Arbitrariness:** The system could have settled on a different equilibrium (e.g., "scream for eagle, look up for leopard").
  2.  **Self-Perpetuation:** Once established, deviating is costly (lower fitness or payoff).
  3.  **Coordination:** The behavior solves the information-transfer problem.

  These three features are the functional core of what makes a convention philosophically interesting. They explain how meaning arises from noise. If evolutionary dynamics produce a state where signals are arbitrary, stable, and coordinate behavior, they have delivered everything Lewis's apparatus was meant to secure: **a solution to the coordination problem.**

  The CK condition was Lewis's mechanism for ensuring stability in *reasoning* agents. Evolutionary dynamics provide a mechanism for ensuring stability in *adaptive* agents. If the outcome is identical (a stable signaling system), the label "convention" should track the functional outcome, not the cognitive machinery. To insist on CK is to insist that a bridge is not a bridge unless it was designed by an engineer, ignoring the fact that a beaver dam serves the same function through different means.

  ### 3. The Vervet Case and the Continuity of Mind
  Your career studying vervet monkeys provides the empirical knockout blow to the necessity of CK. Vervet alarm calls are:
  *   **Arbitrary:** There is no acoustic iconism linking the "leopard" call to leopards.
  *   **Normative:** Infants make errors (calling "leopard" for a goose) and are socially corrected or ignored until they conform.
  *   **Coordinating:** The group survives because the system works.

  If we accept Lewis's CK condition, we must say vervets do not have conventions. They merely have "behavioral regularities." But this creates a philosophically untenable discontinuity. It suggests that human language rests on a magical cognitive substrate (infinite recursive knowledge) that appeared ex nihilo in hominids.

  A more naturalistic philosophy of language accepts that human conventions are built upon the same evolutionary bedrock as vervet conventions. The "philosophically relevant sense" of convention is the **social regulation of arbitrary behavior to solve coordination problems.** Whether that regulation is enforced by the threat of predation (evolutionary fitness) or the threat of social sanction backed by recursive reasoning (Lewisian rationality) is a difference of degree, not kind.

  ### 4. The Strongest Lewisian Objection: The Normative Force
  A defender of Lewis will not argue about the biology; they will argue about the **normativity**. This is the strongest reason to retain the CK condition.

  **The Objection:**
  "Convention implies *obligation*. When we say 'It is a convention to drive on the right,' we imply that you *ought* to drive on the right, and that you do so *because* you recognize the mutual expectation. Lewis's CK condition secures the **reason-giving force** of convention.
  In your vervet monkeys, there is no 'ought.' There is only 'is.' The monkey does not signal correctly because it recognizes a mutual agreement; it signals correctly because it has been reinforced or selected to do so. Without common knowledge, there is no mutual recognition of the rule. There is only a causal correlation of behaviors. To call this a 'convention' is to strip the word of its normative content. It reduces social rules to mere habits."

  In short, the Lewisian argues that without CK, you have **equilibrium**, but you do not have **institution**. You have a *pattern*, but not a *practice*.

  ### 5. Rebutting the Objection: Functional Normativity
  This objection is powerful, but it relies on an overly intellectualized view of normativity. It assumes that for a norm to exist, an agent must be able to represent that norm propositionally ("I know that you know...").

  We can rebut this by distinguishing between **epistemic normativity** (following a rule because one understands it) and **functional normativity** (following a rule because deviation entails failure).

  1.  **Norms exist in nature:** In biology, there are "norms" of function. A heart *ought* to pump blood. If it fails, it is malfunctioning. Similarly, in a signaling system, a signal *ought* to match the state of the world. If a vervet gives a leopard call when there is no leopard, the system malfunctions (the group scatters unnecessarily, trust degrades). This is a real normativity, grounded in the success conditions of the system, not the mental states of the agents.
  2.  **CK as a Post-Hoc Rationalization:** For humans, it is likely that our "common knowledge" is often a rationalization of evolved instincts. We feel that driving on the right is "the rule," but our adherence to it is largely automatic, reinforced by the same differential payoffs (safety vs. crash) that guide the vervets. The CK is the *story* we tell ourselves about our coordination, not necessarily the *engine* of it.
  3.  **The "Practice" Argument:** A practice does not require every participant to understand the metaphysics of the practice. Children follow linguistic conventions long before they possess the theory of mind required for Lewisian common knowledge. If a child uses the word "dog" correctly within a linguistic community, they are participating in a convention. If they can do this without CK, then CK is not necessary for human convention, let alone vervet convention.

  ### Conclusion
  David Lewis provided a masterpiece of rational reconstruction. He showed how convention *could* be sustained by perfectly rational agents. But he mistook a sufficient condition for a necessary one.

  The philosophically relevant sense of "convention" is the emergence of **arbitrary, stable, coordinating regularities**. This is the phenomenon that requires explanation. Lewis explained it via epistemology; Skyrms and evolutionary theory explain it via dynamics.

  Your vervets possess conventions because they participate in a system where signals are arbitrary, deviations are costly, and coordination is achieved. To deny them this status because they lack the cognitive capacity for infinite recursive knowledge is to privilege the *justification* of the rule over the *existence* of the rule. Evolutionary dynamics deliver the stability and arbitrariness that make conventions philosophically interesting. Common knowledge is merely the specific, high-cost cognitive technology humans sometimes use to maintain them. It is not the essence of the thing itself.
