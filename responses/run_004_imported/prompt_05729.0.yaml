          *   Robustness: Features appear across seeds/architectures (convergent evolution).
          *   Response to Splitting: Splitting reveals *structure*, not arbitrariness. Higher resolution doesn't mean falsehood.
      *   *Skeptic (Marcus):*
          *   The "Throttle" Analogy: Causal control $\neq$ semantic content.
          *   The "Dictionary Size" Problem: No natural stopping point. If features keep splitting, where is the "real" concept?
          *   Response to Clamping: You're intervening on the *mechanism*, not the *meaning*. You can make a radio play music by poking wires, but the wires don't "represent" the song.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. A coffee shop or post-seminar chat. Establish their rapport.
      *   **Opening Salvo:** Elena states the Realist position (SAEs = microscopes). Marcus counters with the Instrumentalist view (SAE = useful compression).
      *   **Round 1: The Clamping Evidence vs. The Throttle.**
          *   Elena: Look at the Golden Gate Bridge feature. We turn it on, it talks about bridges. That's representation.
          *   Marcus: That's just causal leverage. A throttle controls speed, but isn't a *representation* of speed. It's a knob, not a map.
      *   **Round 2: The Dictionary Size/Splitting Problem.**
          *   Marcus: If I increase the dictionary size, the "Bridge" feature splits into "Suspension Bridges," "San Francisco Landmarks," etc. Which one is the *real* representation?
