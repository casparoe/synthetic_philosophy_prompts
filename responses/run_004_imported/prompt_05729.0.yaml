      *   **Round 3: Deepening the Philosophical Stakes.**
          *   Marcus: But biology has a ground truth (DNA, physics). Neural nets are just high-dimensional vector math. The "features" are basis vectors we impose.
          *   Elena: But they are *sparse* basis vectors found by the network's own gradient descent pressures. The network *wants* to be sparse. We are just decoding its language.
      *   **Round 4: The "Meaning" vs. "Use" Distinction.**
          *   Marcus: Even if they are natural to the network, do they have *content*? Or are they just functional nodes?
