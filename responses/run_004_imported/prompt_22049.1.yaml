prompt: |-
  Rank the following six approaches to mathematical constructivism according to how faithful each one is to L. E. J. Brouwer's original philosophical grounding of intuitionism — the view that mathematics consists in languageless mental constructions carried out by an idealized thinking subject, with mathematical truth and meaning constituted by the existence of such constructions rather than by a mind-independent reality or a fixed formal calculus:

  - Brouwer's own intuitionism, including choice sequences and the creating-subject arguments
  - Heyting's formalization of intuitionistic logic together with the Brouwer–Heyting–Kolmogorov proof interpretation
  - Bishop's program of constructive analysis
  - Markov's constructive recursive mathematics (the Russian school)
  - Martin-Löf's intuitionistic type theory
  - Dummett's meaning-theoretic (anti-realist) justification of intuitionistic logic

  Judge faithfulness by philosophical grounding rather than by mere technical overlap (e.g., agreement on which instances of the law of excluded middle to reject). For each program, give a brief (2–3 sentence) justification identifying specifically where and why it departs from Brouwer's mentalism. Then present your final ranking as a JSON object with five tiers, from S (most faithful) to D (least faithful); ties within a tier are permitted:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
