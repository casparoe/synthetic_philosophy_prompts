  ### Justifications

  **Brouwer's own intuitionism**
  This is the baseline definition against which all others are measured, fully embodying the view of mathematics as languageless mental construction by a creating subject. It retains the specific metaphysical commitments (choice sequences, the continuum as medium of free becoming) that other programs often modify or discard.

  **Heyting's formalization (Intuitionistic Logic + BHK)**
  Heyting aimed to codify Brouwer's insights, and the BHK interpretation faithfully captures the notion of truth-as-construction. However, by rendering these insights into a formal logical calculus, it inevitably treats logic as a fixed system, whereas Brouwer viewed logic as a secondary, fallible linguistic description of the primary mental activity.

  **Martin-Löf's intuitionistic type theory**
  This system deeply integrates the BHK interpretation by identifying propositions with types and proofs with objects, preserving the constructive meaning of mathematical statements. Nevertheless, it presents these constructions within a rigid formal type theory, which reifies the fluid mental acts of the creating subject into static syntactic entities.

  **Dummett's meaning-theoretic justification**
  Dummett provides a robust philosophical defense of intuitionistic logic based on verificationism and anti-realism, aligning with Brouwer's rejection of mind-independent truth. However, he grounds this justification in public linguistic practices and assertibility conditions, directly contradicting Brouwer's core tenet that mathematics is a private, languageless mental activity.

  **Bishop's program of constructive analysis**
  Bishop successfully reconstructed analysis using constructive methods but explicitly rejected Brouwer's metaphysical grounding (choice sequences, the creating subject) as unnecessary mysticism. By adopting a pragmatic stance that remains neutral on the ontological status of constructions, he abandons the specific mentalistic philosophy required for faithfulness to Brouwer.

  **Markov's constructive recursive mathematics**
  This approach identifies mathematical constructions strictly with recursive algorithms, replacing Brouwer's free mental creations with deterministic, materialistic computational processes. It further diverges by accepting Markov's Principle and rejecting the lawless sequences essential to Brouwer's conception of the intuitionistic continuum.

