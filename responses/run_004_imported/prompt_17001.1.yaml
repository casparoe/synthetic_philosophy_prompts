answer: |-
  The dust was the first thing Archibald noticed when he entered the counting house, even before the silence. It settled on everything—ledgers, quill pots, the mahogany desk—fine red particles from the Chesapeake that coated the throat and stained the cuffs. For thirty years, that dust had been the color of profit. Now, in the autumn of 1776, it looked like rust.

  Archibald MacLeish sat heavily in his high-backed chair. On the desk lay the firm's ledger, open to the current quarter. The columns were stark. Three ships outbound. None returned. The *Dunbarton Castle* had been taken by privateers off the Virginia capes; the *Kingston* was rotting in a harbor blocked by rebel batteries. The ink was dry, but the numbers bled.

  Beside the ledger lay a book. It was thick, bound in plain calf, purchased discreetly from a bookseller near the university. *An Inquiry into the Nature and Causes of the Wealth of Nations*. Archibald had not meant to buy it. He had seen a copy in the club, heard the younger men whispering about Smith's theories as if they were scandalous rumors. He had bought it to refute it. To prove that a man who had never balanced a commercial book knew nothing of the weight of gold.

  He opened it now, not to read, but to let it lie there. It was an accusation.

  He rubbed his eyes. Outside, the Glasgow evening was gathering, grey and damp. Through the window, he could see the spires of the city, the new sandstone facades catching the last light. He had paid for some of that stone. When he had arrived in Glasgow as a boy, the Clyde was a shallow stream navigable only by small boats. Now, thanks to the wealth of men like him, the river was deepened. Warehouses lined the banks. Great mansions rose in the west end, modeled on the villas of Virginia, built by the very tobacco that grew on the soil of the colonies.

  He stood up and walked to the window. He thought of the new assembly rooms, the charities, the paved streets. He had given generously. When the magistrates asked for subscriptions for the poor or the church, Archibald's name was always at the top of the list. He had bought respectability. He had turned smoke into stone.

  But Smith's voice, dry and inexorable, whispered in his memory. *The monopoly of the colony trade... tends to draw away a greater proportion of the capital of the country than what would naturally go to it.*

  Archibald had always believed the empire was a shield. The Royal Navy protected the lanes; Parliament secured the markets. The cost of that protection was tax, yes, but it was the price of order. Now, looking at the ledger, the arithmetic shifted. The navy was stretched thin. The taxes were rising to pay for the war to keep the colonies, yet the trade was dying because of the war. Who paid for the guns that guarded the ships? The public. Who profited from the cargo? A handful of merchants in Glasgow and London.

  Smith argued that the nation would be richer if the colonies were let go. If the capital currently sunk into defending a monopoly were released into general trade. It was a heresy. To suggest Britain should shed its own skin.

  And yet, the ledger did not lie. The monopoly was not paying for itself.

  Archibald turned from the window. His reflection stared back at him from the glass—a heavy man, powdered wig slightly askew, eyes tired. He thought of his son, currently at university in Edinburgh. The boy spoke of liberty, of rights. Archibald had dismissed it as youthful folly. But now, standing in the quiet counting house, he wondered if the boy saw the fragility that the father had ignored.

  The wealth felt different tonight. Before, it had felt like bedrock. He had assumed his fortune was generated by his own acumen, by the hard work of the firm, by the natural demand for the leaf. But Smith suggested it was an artifact of legislation. A artificial swelling of prices caused by restriction. If the restriction vanished, would the wealth vanish with it?

  He walked back to the desk and ran a hand over the calf binding of Smith's book. It was smooth, cool. He opened it to a marked page.

  *"To prohibit a great people... from making all that they can of every part of their own produce, or from employing their stock and industry in the way that they judge most advantageous to themselves, is a manifest violation of the most sacred rights of mankind."*

  It was not a moral argument about the souls of the colonists, nor about the enslaved hands that cured the tobacco. Smith rarely spoke of them. His argument was colder, sharper. It was about efficiency. About the waste of blood and treasure to maintain a system that drained the metropolis to feed a few monopolists.

  Archibald felt a tightening in his chest. It was not guilt, exactly. He had fed his city. He had employed hundreds of coopers, carters, clerks. The money had circulated. The stone was real. If the system was flawed, was the building built upon it any less solid?

  But the war was strangling them. The ships were not coming. The monopoly was becoming a tomb.

  He picked up his quill. He needed to write to his agents in London, to inquire about insurance rates, about the possibility of diverting capital to the West Indies or perhaps textiles. The future was shifting. The tobacco lords were becoming a relic before they were even dead.

  He dipped the quill, but paused. The red dust on the desk seemed to glow in the candlelight. He thought of the plantations he had never seen, the men he had never met whose labor filled the hogsheads, the soldiers dying in the heat of Massachusetts to secure a market that was closing anyway.

  Smith argued that Britain would be better off giving them up. Archibald looked at the city outside. If the empire retreated, would Glasgow retreat with it? Or would the capital find new channels, as water finds its level?

  He realized then that the tension would not resolve. There was no epiphany waiting in the ink. He would not close the ledger and renounce his fortune. The fortune was already renouncing him. The war would decide that, not philosophy.

  But the pride was tainted. He had thought he was a pillar of the empire. Now he wondered if he was merely a beneficiary of a deficit. The stone buildings would remain long after the trade collapsed. They would stand as monuments not to his genius, but to a brief, strange moment when the wind blew gold from the west, and everyone agreed to pretend it was permanent.

  Archibald blew out the candle. The room plunged into darkness, save for the grey light from the streetlamps below. The dust settled in the dark. He left the book open on the desk, a silent partner in the firm, watching the accounts with eyes that saw only the flow of capital, indifferent to the men who moved it.

  He took his hat and walked out into the night. The air was cold, smelling of coal smoke and river mud. He walked past the new warehouses, his footsteps echoing on the pavement. He touched the wall of one building as he passed. It was solid. Cold. Real.

  For now, it was enough. He walked on, toward the house the tobacco had built, listening to the silence of a city waiting to see what would come when the ships stopped coming altogether.
