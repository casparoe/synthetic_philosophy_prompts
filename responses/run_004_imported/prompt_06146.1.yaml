answer: |-
  **Title:** *The Wall and the Word: A Dialogue on the Mauerschützen Trials*

  **Participants:**
  *   **Elena (Hartian Legal Positivist):** Advocates for the separation of law and morals, emphasizing legal certainty and judicial honesty regarding retroactivity.
  *   **Marcus (Fullerian Natural Lawyer):** Advocates for the "inner morality of law," focusing on law as a purposive enterprise of subjecting human conduct to the governance of rules.

  ***

  **Elena:** Let's cut straight to the jurisprudential wound left by the *Mauerschützen* trials. When the Federal Constitutional Court upheld the convictions of the border guards, it effectively ruled that the GDR's positive law at the time—the statutes authorizing the use of firearms to prevent border breaches—was not "law" because it violated fundamental human rights. This is the Radbruch Formula in action: extreme injustice is no law. But from a Hartian perspective, this is a category error. The GDR rules were posited by a sovereign, obeyed by officials, and clear to the guards. To convict the guards, the unified German courts had to engage in a fiction: pretending the GDR law *never* validated their actions. Hart's own solution to the Grudge Informer cases was far more honest: pass a frankly retroactive statute. Admit you are punishing them for an act that was legal when done, because the moral necessity outweighs the principle of *nullum crimen sine lege*. The German courts, however, tried to have it both ways, straining interpretation to mask the retroactivity.

  **Marcus:** That characterization assumes the GDR border regime actually functioned as a legal system in the Fullerian sense. You're focusing on the statute as a isolated command. But law, for Fuller, is the enterprise of subjecting human conduct to the governance of rules. A crucial principle of that inner morality is *congruence between declared rule and official action*. The GDR Constitution formally protected the integrity and life of the citizen. Yet, the shoot-to-kill orders were often secret directives or unwritten practices known only to the border troops. When a citizen tries to orient their conduct based on the public constitutional text, but is met with lethal force based on a secret operational directive, the law ceases to be a guide. It becomes a trap. The courts weren't applying a substantive moral test from the outside; they were identifying an internal failure of the GDR's own legality. The law had collapsed into mere managerial direction.

  **Elena:** That's a clever maneuver, Marcus, but it conflates the *form* of the law with its *substance*. Let's grant your point about secret orders for a moment. Suppose the GDR had been more honest. Suppose they had published a clear, public, prospective statute stating: "Any citizen attempting to cross the border without permission shall be shot." Suppose they applied this consistently, with no gap between the declared rule and official action. Under Fuller's eight principles of the inner morality of law, that regime could theoretically check every box: generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, and congruence. Yet, it would still be morally monstrous. If Fuller's framework cannot distinguish between a just legal system and a procedurally perfect genocide machine, then it cannot ground the *Mauerschützen* verdicts without smuggling in Radbruch's substantive natural law. You can't derive the invalidity of the shoot-to-kill order solely from procedural failure if the procedure was flawless.

  **Marcus:** I disagree that the procedure would be flawless in that scenario, because you're ignoring the principle of *constancy* and the broader context of the legal enterprise. Law isn't just a set of vertical commands; it implies a reciprocal relationship between the lawgiver and the subject. If the state enacts a rule that makes it impossible for the subject to remain within the law while exercising a right ostensibly guaranteed by the same system (like the GDR's own International Covenant on Civil and Political Rights, which it ratified), the system creates a contradiction that undermines the possibility of compliance. But let's stick closer to the actual case. The courts didn't just say "killing is wrong." They pointed out that the GDR's own Border Act required the preservation of human life *where possible*. The shoot-to-kill practice violated the GDR's own positive hierarchy of norms. By ignoring their own statutory limitations on firearm use, the border officials failed the test of congruence. The law they claimed to follow didn't actually authorize what they did, even by GDR standards.

  **Elena:** Now you're arguing like a domestic GDR lawyer, not a Fullerian philosopher. If the GDR courts at the time would have upheld the shootings based on the state's interpretation of "preservation of life," then the congruence existed *within that system*. The unified German courts are essentially saying, "The GDR courts were wrong about their own law." That is an external judgment masquerading as internal interpretation. This brings me back to Hart's worry about certainty. The guard on the wall isn't a legal philosopher analyzing the congruence of constitutional norms. He is a soldier following a clear order. To punish him now by saying, "Actually, your legal system was invalid because it failed a test of reciprocity you couldn't see," is to punish him for a jurisprudential failure that wasn't evident in the social facts of his duty. Hart's preference for retroactivity respects the guard's reality: "You followed the law, but we are changing the rules to punish you because the outcome is intolerable." The Fullerian approach pretends the guard *broke* the law, which is historically false.

  **Marcus:** But that "honesty" you prize comes at a terrible cost to the integrity of the legal order. If you pass a retroactive statute, you admit that the law is powerless against evil until the regime changes. You concede that law is merely a tool of power, valid regardless of its function. The Fullerian argument is that the *Mauerschützen* trials were not retroactive because there was no valid law to violate at the moment of the shooting. A system that systematically violates its own published constraints on the use of force forfeits the claim to be governing by rules in that specific instance. It reverts to a state of nature disguised as law. The guard isn't being punished for breaking a new law; he is being held accountable for participating in a practice that lacked legal character *even then*, because it severed the link between rule and action. The "fiction" you accuse the court of is actually a recognition that the GDR's authority had self-destructed at the border.

  **Elena:** That is a metaphysical claim, not a legal one. "Self-destruction" of authority is something we can only declare *ex post facto*. At *t1* (the shooting), the authority was effective. At *t2* (the trial), we declare it wasn't. That is retroactivity, regardless of how you dress it in Fullerian robes. Furthermore, your reliance on the GDR's own statutory limitations proves my point: you are engaging in a strained interpretation of GDR law to make it fit a moral outcome. You are arguing that the GDR law *really meant* "don't shoot," when everyone knew it meant "shoot." This creates uncertainty for future legal systems. If judges can declare valid, effective commands "non-law" because they violate an inner morality of reciprocity that the officials themselves didn't recognize, then no positive law is safe. Hart's separation thesis protects us from this: it forces us to admit that law can be evil, and when it is, we must use extra-legal moral judgment to fix it, not distort the concept of law itself.

  **Marcus:** And Hart's "fix" leaves the moral judgment hanging outside the law, unanchored. But consider the alternative. If we accept Hart's view, we validate the idea that a dictator who follows his own procedural rules is creating "law" that citizens must conceptually respect until he is overthrown. The Fullerian view insists that the *Mauerschützen* case reveals the limit of positivism: when the discrepancy between the professed rule (protection of life) and the actual practice (shoot-to-kill) becomes total, the practice is no longer legal. It's not about importing Radbruch's substantive values; it's about recognizing that a command to kill without necessity, in violation of the system's own published constraints, fails to function *as law*. It fails to guide conduct because it tells the citizen one thing and the executioner another. The court didn't distort the law; they restored the description of what was actually happening. There was no law at the wall, only violence. Punishing violence isn't retroactive.

  **Elena:** "Only violence." That is the rhetorical sleight of hand. It was violence *authorized by law*. That is the horror of the situation. By calling it "only violence," you sanitize the complicity of the legal system. Hart wants us to stare that horror in the face: Law authorized this. Morality condemns it. Therefore, we must punish, but let us not lie and say the Law didn't authorize it. The German courts lied. They said the Law *didn't* authorize it. That distinction matters for the rule of law. If we teach judges that they can invalidate effective, posited rules by claiming those rules failed an inner morality test that the positing authority rejected, we invite judges to become moral arbiters under the guise of legal interpretation. Hart's retroactive statute is the lesser evil: it preserves the definition of law for the sake of clarity, even if it sacrifices the principle of non-retroactivity in extreme cases.

  **Marcus:** But clarity at the cost of legitimacy is a hollow victory. If the law claims to be a system of rules but operates as a system of terror, calling it "law" grants it a dignity it hasn't earned. The *Mauerschützen* decision wasn't about judges becoming moral arbiters; it was about judges recognizing that the GDR had abandoned the enterprise of law at its border. By convicting the guards based on the discrepancy between the GDR's international commitments and its border practices, the court highlighted a failure of *congruence* that was objective, not merely moral. You call it a lie; I call it a correction of the record. The guard thought he was upholding the law, but he was upholding a parody of law. The trial forced the legal system to speak the truth about that parody. Hart's "honest retroactivity" admits defeat; the Fullerian approach asserts that the law, properly understood, never authorized the shot in the first place.

  **Elena:** And that assertion is what keeps the positivist awake at night. Because if the law "never authorized the shot," then on what basis did the guard have a duty *at the time*? If there was no law, he was just a man with a gun. If there was law, he was a soldier. The court treated him as a criminal, which implies he violated a duty. If the duty came from GDR law, GDR law existed. If GDR law existed, it authorized the shot. You cannot have it both ways. You cannot say the law existed enough to create a duty of obedience to the state, but not enough to validate the defense of superior orders. Hart's framework handles this cleanly: The law existed, the defense is valid, but we are punishing you anyway via retroactive statute because the moral cost of acquittal is too high. The Fullerian framework muddies the water to make the conviction feel legally inevitable. It's comfort food for jurists who can't bear to admit that sometimes, justice requires breaking the law.

  **Marcus:** It isn't comfort food; it's a refusal to accept that "law" is a label we stick on power regardless of its operation. The duty the guard violated wasn't just a GDR duty; it was a duty inherent in the role of a legal official within *any* system claiming to be legal. By shooting an unarmed fugitive in violation of the proportionality principles embedded in the GDR's own statutes, he stepped outside the role of a legal official and became a private murderer. The court didn't break the law to convict him; it recognized that his actions had already broken the bond of legality that protects officials. Hart sees a binary switch: Law or No Law. Fuller sees a spectrum of functionality. The GDR border regime fell off the spectrum. Recognizing that fall isn't retroactive; it's diagnostic.

  **Elena:** Diagnostic, perhaps. But legally fatal. If the regime fell off the spectrum, then the state itself was a criminal enterprise. That leads to nullification of *all* acts, not just the shootings. The German courts didn't go that far; they validated GDR property law, contract law, etc. They selectively applied the Radbruch Formula only where the injustice was palpable. That selectivity proves it's a substantive moral test, not a procedural Fullerian one. You're using Fuller's language of "congruence" to do Radbruch's work of "intolerable injustice." And that, Marcus, is the danger. It turns the inner morality of law into a backdoor for substantive natural law, without the honesty of admitting you're weighing values. Hart would say: Weigh the values! Just don't pretend you're doing conceptual analysis when you're doing moral philosophy.

  **Marcus:** And Fuller would reply that you cannot separate the two so cleanly when the very function of law is at stake. The selectivity you mention isn't arbitrary; it marks the point where the system's failure to govern by rules became total. Contract law still functioned as a system of rules; the border regime functioned as a system of terror. Distinguishing them isn't moral cherry-picking; it's sociological accuracy regarding where the "enterprise of subjecting human conduct to rules" actually existed. The *Mauerschützen* trials weren't about importing Western morality; they were about restoring the integrity of the concept of law itself against a regime that had hollowed it out. If Hart's positivism requires us to call the GDR border regime "law" simply because it was effective, then positivism is blind to what law *does*.

  **Elena:** Positivism isn't blind; it's myopic by design. It focuses on what law *is*, so we can clearly see what it *ought* to be. By blurring that line, you risk making the validity of law dependent on the moral skill of the judge. In the 1990s, that skill produced a result we like. In other hands, with other morals, that same Fullerian reasoning could invalidate social welfare laws or tax codes as "failing congruence" with some other ideal. Hart's warning remains: If you make legal validity dependent on moral merit, you weaken the law's ability to criticize power. The *Mauerschützen* guards were punished. Good. But let's not pretend it was because their actions weren't legal. They were legal. And that is the tragedy.

  **Marcus:** Then we agree on the tragedy, but disagree on the diagnosis. You say the law was sound but the outcome evil. I say the law was unsound, which is why the outcome was evil. For the dissertation, perhaps that is the crux: Whether the *Mauerschützen* case is evidence that positivism is too brittle to handle transitional justice, or that natural law is too flexible to maintain legal certainty.

  **Elena:** Precisely. And until you can explain how a guard is supposed to know the "inner morality" has collapsed while he is holding a rifle, Hart's demand for clear, posited rules remains the safer bet for the ruled.

  **Marcus:** And until you can explain how a legal system survives when its rules are merely masks for murder, Fuller's demand for integrity remains the safer bet for the law.
