answer: |-
  You are absolutely right, and your friend's heuristic ("always trust the stratified result") is dangerous without knowing the causal structure. This is precisely the point Judea Pearl emphasizes in *The Book of Why* and his technical work: **data alone cannot tell you whether to stratify; only a causal model can.**

  While classic textbook examples of Simpson's Paradox usually involve a *confounder* (where stratification is correct), the exact same numerical reversal can occur when the third variable is a *mediator*. In the mediator case, stratification blocks the causal pathway you are trying to measure, leading to the wrong conclusion about the total effect of an intervention.

  Here is a concrete numerical example constructed specifically to meet your criteria: aggregated data shows a benefit, stratified data shows harm, and the stratifying variable is a mediator.

  ### The Scenario: The "Stressful Tutoring" Program

  Imagine a school district evaluating a new intensive tutoring program ($X$) designed to help students pass a final exam ($Y$).
  *   **$X = 1$**: Student receives Tutoring.
  *   **$X = 0$**: Student does not receive Tutoring.
  *   **$Y = 1$**: Student passes the exam.
  *   **$Y = 0$**: Student fails the exam.

  There is a third variable, **Student Confidence ($Z$)**.
  *   **$Z = 1$**: High Confidence.
  *   **$Z = 0$**: Low Confidence.

  **The Causal Story:**
  1.  **$X \rightarrow Z$ (Tutoring boosts Confidence):** The tutoring is very effective at making students feel confident. Most tutored students end up with High Confidence.
  2.  **$Z \rightarrow Y$ (Confidence boosts Passing):** Confident students perform much better on the exam, regardless of tutoring.
  3.  **$X \rightarrow Y$ (Direct Effect of Tutoring):** However, the tutoring program is incredibly stressful and time-consuming. It takes time away from sleep and other subjects. *Holding confidence constant*, the stress of the tutoring actually slightly reduces a student's chance of passing compared to a non-tutored student with the same confidence level.

  **The Question:** Should the district adopt the tutoring program? (i.e., Is the **Total Effect** of $X$ on $Y$ positive?)

  ### The Data Table

  Here are the counts for 1,000 students (500 in Tutoring, 500 in Control).

  #### 1. Aggregated Data (The "Pooled" View)
  *This reflects what happens if you simply assign the treatment.*

  | Group | Total Students | Passed ($Y=1$) | Pass Rate |
  | :--- | :---: | :---: | :---: |
  | **Tutoring ($X=1$)** | 500 | **325** | **65%** |
  | **No Tutoring ($X=0$)** | 500 | **130** | **26%** |

  **Observation:** In the aggregated data, Tutoring is associated with a **39 percentage point increase** in passing. It looks highly beneficial.

  ***

  #### 2. Stratified Data (The "Subgroup" View)
  *This reflects your friend's recommendation to control for Confidence ($Z$).*

  **Stratum A: Low Confidence ($Z=0$)**
  | Group | Total Students | Passed ($Y=1$) | Pass Rate |
  | :--- | :---: | :---: | :---: |
  | **Tutoring ($X=1$)** | 100 | **5** | **5%** |
  | **No Tutoring ($X=0$)** | 400 | **40** | **10%** |
  *Result:* Among low-confidence students, Tutoring **halves** the pass rate (5% vs 10%).

  **Stratum B: High Confidence ($Z=1$)**
  | Group | Total Students | Passed ($Y=1$) | Pass Rate |
  | :--- | :---: | :---: | :---: |
  | **Tutoring ($X=1$)** | 400 | **320** | **80%** |
  | **No Tutoring ($X=0$)** | 100 | **90** | **90%** |
  *Result:* Among high-confidence students, Tutoring **reduces** the pass rate (80% vs 90%).

  **Observation:** In **both** subgroups, the association reverses. Tutoring looks harmful within every stratum of Confidence.

  ### The Causal Diagram

  To understand why the aggregated data is "right" for policy decisions and the stratified data is "wrong," we look at the causal graph (DAG):

  ```mermaid
  graph LR
      X[Tutoring] --> Z[Confidence]
      Z[Confidence] --> Y[Pass Exam]
      X[Tutoring] --> Y[Pass Exam]
  ```

  *   **Path 1 (Indirect):** $X \rightarrow Z \rightarrow Y$. Tutoring increases Confidence, which increases Passing. (Positive Effect)
  *   **Path 2 (Direct):** $X \rightarrow Y$. Tutoring causes Stress, which decreases Passing. (Negative Effect)

  ### Why Your Friend is Wrong

  Your friend's training treats $Z$ as a **confounder**. A confounder is a common cause of both $X$ and $Y$ (e.g., $Z \rightarrow X$ and $Z \rightarrow Y$). If $Z$ were a confounder (like "Socioeconomic Status" affecting both access to tutoring and exam scores), stratifying would be correct because it would block the "backdoor path" and isolate the causal effect.

  However, in this example, $Z$ is a **mediator**. It sits *on* the causal pathway.

  1.  **The Goal:** When we ask "Does the tutoring work?", we are asking about the **Total Effect**. We want to know what happens when we turn on $X$, allowing it to ripple through the system however it naturally does (including boosting Confidence).
  2.  **The Mistake:** By stratifying on $Z$ (comparing students *within* the same confidence level), your friend is statistically **holding Confidence constant**. This blocks Path 1 ($X \rightarrow Z \rightarrow Y$).
  3.  **The Result:** The stratified analysis isolates only the **Direct Effect** (Path 2). It tells us: "If you could give a student tutoring *without* changing their confidence level, they would do worse."
  4.  **The Reality:** You *cannot* give the tutoring without changing their confidence. The tutoring *causes* the confidence. By controlling for it, you are removing the primary mechanism by which the tutoring helps.

  ### Conclusion for Your Argument

  You can tell your friend:

  > "The numbers show a perfect reversal: the treatment looks good overall but bad in every subgroup. Your rule says 'trust the subgroup.' But if we follow that rule here, we cancel a program that raises pass rates from 26% to 65%.
  >
  > The difference isn't in the math; it's in the **arrow direction**. If $Z$ is a confounder ($Z \rightarrow X$), you must stratify. If $Z$ is a mediator ($X \rightarrow Z$), you must **not** stratify if you care about the total effect. Since data tables don't show arrow directions, your heuristic is incomplete without a causal model."

  This aligns exactly with Pearl's resolution to Simpson's Paradox: **The paradox is not a statistical puzzle to be solved by averaging or stratifying; it is a causal puzzle to be solved by drawing the graph.** In mediation cases, the "paradox" is simply the difference between Total and Direct effects, and blindly stratifying leads to "Overadjustment Bias."
