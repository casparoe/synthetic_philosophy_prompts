answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Group
  **FROM:** Rules Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol for Divergent Forecasts and Aumann's Agreement Theorem

  **Purpose**
  Following our recent discussion regarding significant forecast divergence, this memo clarifies our standing rule for resolving disagreements after peer discussion. Specifically, it addresses the application of Robert Aumann's Agreement Theorem to our workflow.

  **The Recommendation**
  The Rules Committee recommends **retaining the current averaging rule.** When two forecasters remain significantly apart after a structured discussion, we will record the average of their two probabilities as the group's official position for that item.

  However, we are refining the *pre-condition* for averaging. To address the concerns raised, the discussion call must explicitly focus on exchanging *private information* rather than debating *conclusions*.

  **Engaging with Aumann's Agreement Theorem**
  The objection raised is theoretically sound: Aumann's theorem states that two rational agents with the same prior beliefs cannot agree to disagree. If their probability estimates are "common knowledge," they must converge. Some have argued that if we don't converge, someone is acting irrationally or withholding information, making averaging a "dodge."

  While we respect the mathematical rigor of the theorem, it relies on three strict conditions that do not hold in our workplace environment:

  1.  **Common Priors:** Aumann assumes both parties start with the exact same baseline view of the world. In our group, priors differ based on role and experience (e.g., an engineer may inherently weight technical risk differently than a product manager). These are not errors; they are different starting models.
  2.  **Common Knowledge:** The theorem requires that I know your information, you know mine, I know that you know mine, and so on ad infinitum. A one-hour call exchanges data, but it rarely achieves this infinite recursive state. We often leave calls understanding *what* the other thinks, but not fully updating on *why* they trust that information.
  3.  **Perfect Rationality:** The theorem assumes perfect Bayesian updating without cognitive bias, fatigue, or incentive distortion. In reality, we are busy colleagues balancing this work with delivery goals. Furthermore, the leaderboard introduces competitive incentives that can subtly diverge from pure truth-seeking.

  **Conclusion on Theory**
  Aumann's result is a useful *normative* ideal (we should strive to update on each other's views), but it is not a *descriptive* rule for human teams. Persistent disagreement does not necessarily imply dishonesty or irrationality; it often reflects different priors or the limits of human communication. Therefore, failing to converge is not a "failure" that averaging sweeps under the rug.

  **Why Averaging Remains the Best Rule**
  Forcing convergence when priors differ often leads to "false consensus," where one party acquiesces to end the discussion, degrading calibration data. Research on crowd wisdom suggests that averaging independent estimates (even after discussion) often outperforms forced consensus, provided the discussion was good-faith.

  **New Process Requirement**
  To ensure we honor the *spirit* of Aumann (maximizing information sharing) before averaging:
  *   During the resolution call, forecasters must explicitly state: *"Here is the specific piece of evidence or experience that drives my number."*
  *   If, after exchanging this private information, the gap remains, we accept the divergence as valid and average the numbers.

  This approach respects the theoretical insight while acknowledging the practical reality of our team.

  **Effective Immediately**
  Please update your workflow accordingly. The Rules Committee will review calibration data in Q1 to ensure this process remains effective.
