      *   **Personal Connection:** Junior prom committee experience (voting on venue, budget, guest list separately led to a plan no one wanted as a whole).
      *   **Theme:** How the class "decided" things together over four years despite disagreement.
      *   **Constraints:** Must sound like a graduation speech (warm, reflective, inspiring), not a lecture. Must use the paradox structurally, not just as a fun fact. Must be accurate enough for Mr. D.
      *   **Length:** ~3 minutes spoken (approx. 400-500 words).

  2.  **Deconstruct the Discursive Dilemma/Doctrinal Paradox:**
      *   *What is it?* A situation in social choice theory where a group's collective judgment on a set of interconnected propositions can be inconsistent, even if every individual's judgments are consistent.
      *   *The Classic Example:* A court case. To find liability, two premises must be true (e.g., Duty of Care + Breach of Duty).
          *   Judge A: Yes + Yes = Liable.
          *   Judge B: No + Yes = Not Liable.
          *   Judge C: Yes + No = Not Liable.
          *   *Conclusion-based voting:* 2 vote Not Liable, 1 votes Liable. Outcome: Not Liable.
          *   *Premise-based voting:* Premise 1 (2 Yes), Premise 2 (2 Yes). Outcome: Liable.
      *   *The Student's Example:* Prom Committee. Venue (Yes), Budget (Yes), Guest List (Yes). But the combination of the "winning" venue, "winning" budget, and "winning" guest list might be a plan that the majority actually rejected as a package.
      *   *The Speech Application:* The class made decisions over 4 years. Sometimes we agreed on the goal but not the method, or the method but not the goal. Yet, we arrived at *this* moment. The paradox isn't a failure; it's the messy reality of democracy and community.

