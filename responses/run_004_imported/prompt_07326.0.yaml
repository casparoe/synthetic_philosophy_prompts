answer: |-
  Good morning, faculty, families, and the Class of 2024.

  As your Student Government President, I was told my job today was to warm you up before the "real" speeches. So, I decided to talk about math. Specifically, the math of how we make decisions together.

  Remember Junior Prom? Our committee spent weeks arguing. We voted on the venue. We voted on the budget. We voted on the guest list. We won every vote. But when we put those winning pieces together, we ended up with a plan that almost nobody actually wanted. A fancy venue, with a tiny budget, and an open door? It was a disaster waiting to happen.

  I complained to my AP Gov teacher, Mr. D—who I see smiling right there in the front row—and he told me I'd run into the "Discursive Dilemma." Sometimes called the Doctrinal Paradox.

  Here's the gist: If a group votes on the *premises* of a decision separately, you can get the opposite result than if they just voted on the *conclusion* directly. You can have a group of perfectly logical people, following the rules, and end up with a collective outcome that makes zero sense. Nobody cheated. Nobody was stupid. The system just glitched.

  For a long time, I thought that glitch was a failure. I thought Student Gov failed when we couldn't align the pieces. I thought our class was broken when we wanted better sports but also better arts but also lower taxes on our time.

  But standing here today, I realize that the Discursive Dilemma isn't a bug in democracy. It's the feature.

  If we had voted on the "Class of 2024 experience" as a single yes-or-no question on day one of freshman year, I guarantee you the measure would have failed. Too many variables. Too much disagreement. Too many of us voting "no" on the hard days, the remote learning days, the days we didn't think we'd make it.

  But we didn't vote on the conclusion all at once. We voted on the premises. We showed up to the game *and* the play. We voted for rigor *and* for mental health. We voted for tradition *and* for change. Individually, those votes often contradicted each other. Logically, they shouldn't fit.

  And yet, here we are.

  The paradox says that logical individuals can create an illogical whole. But look at us. We are the verdict that defies the premises. We are the outcome that shouldn't exist on paper, but is standing right here in these chairs.

  Mr. D taught us that this paradox proves collective reasoning is fragile. But I think it proves something else. It proves that a community isn't a math problem to be solved. It's a messy, contradictory, beautiful negotiation. We didn't graduate because the numbers added up perfectly. We graduated because we accepted the contradiction. We accepted that we could disagree on the path but still arrive at the same destination.

  So, Class of 2024, as we leave, don't worry if your life doesn't add up logically. Don't worry if your premises conflict. The Discursive Dilemma tells us that even when the votes don't match the outcome, the outcome can still be right.

  The verdict is in. We made it.

  Congratulations.
