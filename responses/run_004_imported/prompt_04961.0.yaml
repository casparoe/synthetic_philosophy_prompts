      *   *Point 1: The Teleology of the Twin Principles.* Reid isn't just describing psychology; he's describing a divine/natural design for *social knowledge*. It requires two *minds*. An LLM is not a mind. Therefore, Veracity is impossible.
      *   *Point 2: The Nature of Assertion.* For Reid, speaking is expressing *thought*. "I conceive X, and I signify X." LLMs simulate signification without conception. This makes it "counterfeit testimony."
      *   *Point 3: The Status of Credulity.* If Veracity is gone, Credulity loses its warrant. It becomes a cognitive bug in this context. Reid distinguishes between the *principle* (good) and its *misapplication* (bad).
