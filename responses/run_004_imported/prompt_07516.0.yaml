answer: |-
  This is one of the profound questions that sits at the intersection of psychology, philosophy, and fiction writing. You have hit a snag not because your book is failing, but because you have encountered the actual complexity of a human being, which is always messier than the theories we use to explain them.

  To answer your core question: **No, there is no principled way to isolate a single "true" desire when words and actions diverge, because human beings do not possess a single, unified "true" desire.**

  The idea that we must choose between the words (the conscious narrative) and the actions (the unconscious drive) is a false binary. Here is a framework for untangling this without resorting to a cheat, and how to apply it to both your grandfather and your novel.

  ### 1. The "True Want" Fallacy
  Your writing partner and your workshop friend are both operating under the assumption that there is a hidden variable $X$ (The Truth) that explains the equation.
  *   **Partner:** $X$ is revealed by actions; words are noise.
  *   **Friend:** $X$ is revealed by words; actions are context.

  But in trauma survivors, refugees, and indeed most humans, the psyche is not a monolith. It is a negotiation between competing needs.
  *   **Need A:** To survive psychologically, the grandfather *must* believe he made the right choice. To admit regret is to destabilize the foundation of his life in the new country. Therefore, "No regrets" is not a lie; it is a **survival imperative**.
  *   **Need B:** To remain human, he must honor the connections he lost. The house and the letters are not necessarily about "Hungary" or "wanting to go back." They are about **witnessing**.

  If you decide he "really" misses Hungary, you flatten him. If you decide he "really" doesn't care, you flatten him. The truth is the tension itself.

  ### 2. Words as Architecture, Actions as Ecology
  A principled way to view this divergence is to stop asking which one is the "lie" and start asking what function each serves.

  **The Words (The Architecture):**
  When he says, "I have no regrets, the old country means nothing," he is describing his **Identity**. This is the story he tells himself to get out of bed in the morning. It is the structure he built to house his life after the earthquake of 1956. If you tear down this structure by calling it "pride," you are dismissing the immense labor it took to build it. It is functionally true for him.

  **The Actions (The Ecology):**
  When he keeps the house and speaks Hungarian, he is engaging with his **History**. This is the ecosystem he lives in. You cannot pave over an ecosystem without killing what lives there.
  *   **The House:** Your workshop friend is likely right here. The house probably isn't about "Hungary." It is likely about his sister. Selling the house isn't "letting go of the place"; it is "evicting her memory." He can hate the country that forced him out while fiercely protecting the room where his sister slept. Those are not contradictory.
  *   **The Language:** Speaking Hungarian when alone isn't necessarily nostalgia. It is likely **comfort**. It is the language of his interior self. The new language is for the public self.

  ### 3. Is "Trust the Actions" a Cheat?
  It is a cheat **only if** you use it to diagnose a simple motive.
  In fiction writing, the adage "actions speak louder than words" is usually taught to prevent characters from being mouthpieces for the theme. However, in deep characterization, **words are also actions.**

  Speaking is something he *does*.
  *   Action 1: He refuses to sell the house.
  *   Action 2: He verbally asserts he has no attachment to the past.

  Both are behaviors. Both require energy. The friction between them is where the character lives. If you resolve the friction by saying, "Actually, he's lying about the words," you create a melodrama. If you resolve it by saying, "Actually, he's telling the truth and the house is just practical," you create a bore.

  If you leave the friction unresolved, you create a **human**.

  ### 4. How to Untangle Guilt, Duty, and Love
  You asked how to distinguish if an action is love or guilt. The principled answer is: **You often can't, and neither can the subject.**

  In the case of a refugee from the '56 uprising, "Survivor's Guilt" is a massive, often invisible engine.
  *   If he sells the house, does he feel he is betraying the sister who stayed (or died, or suffered)?
  *   If he admits he misses Hungary, does he feel he is betraying the life he built in safety?

  The "want" here isn't a destination (e.g., "He wants to go home"). The "want" is a **state of equilibrium**. He wants to minimize pain.
  *   Keeping the house minimizes the pain of guilt.
  *   Denying attachment minimizes the pain of grief.

  ### 5. Advice for the Novel (and your Peace of Mind)
  To get unstuck, stop trying to solve your grandfather. Start writing the **gap**.

  The most powerful version of this character is not one who is secretly lying, nor one who is perfectly consistent. It is a character who genuinely believes his words *in the moment he speaks them*, but whose hands move differently when no one is watching.

  **Try this exercise:**
  Write a scene where he is asked to sell the house.
  *   Have him give the logical, "no regrets" argument for why it's a burden.
  *   Have him refuse to sign the papers anyway.
  *   **Crucially:** Do not let him explain why. Do not let the narrator explain why.

  If your writing partner says, "Show us he misses it," and your friend says, "Let him say he doesn't," the solution is to let him say he doesn't, while showing us that the cost of that statement is physical pain.

  **The Philosophical Resolution:**
  You are looking for a unified field theory of human desire. It doesn't exist. We are capable of holding two mutually exclusive truths:
  1.  I am glad I left.
  2.  I am devastated that I left.

  Your grandfather is not a puzzle to be solved. He is a vessel containing a specific historical trauma. The "snag" you are feeling is the resistance of reality against the simplification required by plot.

  **Don't untangle the knot.** The knot is the story. The fact that he counts in Hungarian but claims English is his life *is* the character arc. If you decide definitively which one is the "real" him, you kill the mystery that makes him worth writing about.

  Trust the actions? Yes, but trust the words as actions, too. One is the shield, the other is the wound. You need both to write the soldier.
