answer: |-
  You have identified a genuine tension in the text, but I would argue that Anscombe is not contradicting herself. Rather, she is constructing a **conditional argument** that defines the limits of institutional neutrality.

  Your confusion stems from reading the first half of the passage as a claim that honorary degrees are *morally inert*. Anscombe is not arguing that; she is arguing that they are *merit-inert* regarding professional competence, but **morally active** regarding public endorsement.

  Here is the breakdown of the logical structure, the philosophical weight of her distinctions, and how the descriptive and normative moves are compatible.

  ### 1. The Logical Structure: A Rule with a Moral Limit Condition

  Anscombe's argument is not "Honorary degrees are immune to moral scrutiny, except for Truman." It is more nuanced. It looks like this:

  *   **Premise 1 (Nature of the Honor):** An honorary degree is not a certification of professional competence ("merit"), but a public mark of respect for "distinction" (status/reputation).
  *   **Premise 2 (General Practice):** Because "distinction" is a general status, it is usually impractical and unnecessary to investigate the private moral ledger of the candidate (the "non-notorious criminal" clause).
  *   **Premise 3 (The Limit Condition):** However, the act of conferring honor is itself a moral speech act by the University. It implies endorsement.
  *   **Premise 4 (The Truman Specific):** Truman is not distinguished in a general sense; he is defined globally by a specific action (the atomic bombing) that many regard as mass murder.
  *   **Conclusion:** Therefore, honoring Truman is not merely acknowledging status; it is publicly endorsing that specific action. To do so would be **sycophancy** (flattering power in the face of moral horror), which is a vice. Therefore, the University must oppose it.

  So, to answer your first question: **Truman is not an exception that proves the rule; he is the test case that reveals the boundary of the rule.** The rule is "We don't dig into private sins," but the boundary is "We cannot ignore public definitions of moral monstrosity."

  ### 2. The Distinction: "Distinguished Person" vs. "Known for an Action"

  You asked if this distinction carries philosophical weight. **Yes, it is the crux of her argument.**

  *   **"Very Distinguished Person":** This implies a diffuse status. A scientist, a writer, or a politician might be "distinguished" for a lifetime of work. Their identity is not reducible to a single event. In these cases, Anscombe argues, it is "foolish to enquire" if they deserve their status because status is a social fact, not a moral judgment.
  *   **"Known Everywhere for an Action":** This reduces the person to a single moral event. In 1956, Truman *was* the Atomic Bomb in the public imagination. You could not honor the man without honoring the act.

  **Why this matters:**
  If the University honors a "distinguished person," it says, "We respect your standing."
  If the University honors a person "known for an action," it says, "We respect *what you did*."

  Anscombe is arguing that when a person's distinction is **constituted** by a specific act, honoring the person becomes logically equivalent to honoring the act. Since the act (in her view) was the deliberate killing of innocents, honoring it is morally impossible for a institution claiming to pursue truth and goodness.

  ### 3. Descriptive vs. Normative: Are they compatible?

  You noted a shift between a descriptive claim (what degrees *are*) and a normative claim (when they are *problematic*). These are compatible because Anscombe is analyzing the **illocutionary force** of the degree.

  *   **Descriptive:** She describes the degree as a reward for distinction, not merit. This clears the ground. It stops people from arguing, "But Truman was a good President!" (Merit). Anscombe says, "That doesn't matter."
  *   **Normative:** She then pivots to the moral responsibility of the *giver*. Even if the degree isn't about merit, the *giving* is an action taken by Oxford. Oxford must answer for its own actions.

  The compatibility lies in the concept of **Sycophancy**.
  Sycophancy is not about the recipient; it is about the *moral character of the flatterer*.
  *   If Oxford gives the degree to avoid offending the US (a powerful ally), Oxford is being a sycophant.
  *   If Oxford gives the degree ignoring the moral weight of the Bomb, Oxford is being morally negligent.

  So, the argument shifts from "Is Truman worthy?" (which she dismisses) to "Is Oxford acting virtuously?" (which she insists upon).

  ### 4. The Deeper Point: Collective Moral Responsibility

  You suspected there was something deeper about "honor, public reputation, and collective moral responsibility." You are correct.

  Anscombe is a virtue ethicist (heavily influenced by Aristotle and Aquinas). For her, institutions, like individuals, have moral agency.
  *   **Honor is not passive:** You cannot treat honor as a neutral trophy. It is a form of moral currency. By spending it on Truman, Oxford devalues its own currency.
  *   **Complicity:** By honoring a man "known everywhere" for a specific action, the University becomes complicit in the narrative that the action was acceptable.
  *   **The Role of the University:** Oxford, for Anscombe, is a guardian of moral and intellectual truth. If it honors a man for an act that violates the basic precepts of justice (killing non-combatants), it betrays its own purpose.

  ### Summary of Anscombe's Position

  Anscombe is not arguing that honorary degrees are outside moral evaluation. She is arguing that **they are usually outside *investigative* moral evaluation** (we don't dig up dirt), **unless the distinction itself is morally tainted.**

  Her logic is:
  1.  Honors reflect public standing.
  2.  Truman's public standing *is* the Atomic Bomb.
  3.  The Atomic Bomb was a moral atrocity (in her view).
  4.  Therefore, honoring Truman is honoring the atrocity.
  5.  Honoring the atrocity is sycophancy/complicity.
  6.  Oxford must not be complicit.

  The shift you sensed is not a contradiction; it is a **relocation of the moral burden**. She moves the burden from the candidate (Does he deserve this?) to the institution (Do we have the courage to withhold this?). She is arguing that the "general rule" of not enquiring into a candidate's life collapses when the candidate's life is defined by a public act that violates the very moral order the University claims to uphold.
