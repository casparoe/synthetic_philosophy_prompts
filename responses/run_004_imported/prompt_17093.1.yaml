  9.  **Final Polish:** Ensure tone is appropriate for a graduate seminar context (scholarly, precise, engaging). (Proceed to generate output based on these thoughts.)
answer: |-
  This is a superb question that cuts to the heart of Augustine's moral theology. You are right to feel tension here: *Contra Mendacium* is often read as a rigid deontological treatise (lying is intrinsically evil, full stop), yet in these passages, Augustine seems to be engaging in a comparative calculus of harm that looks suspiciously consequentialist.

  Your intuition is correct: the asymmetry does not rest on the *act* of lying (which is sinful in both cases) but on the **spiritual vector of the deception** and the **specific duty of the liar.**

  Here is a reconstruction of the argument, an analysis of how it fits his broader definition of lying, and a parsing of the "cunning spy" illustration for your seminar.

  ### 1. The Shape of the Asymmetry: Concealment vs. Propagation

  You hypothesized that the asymmetry lies in the harm done by the *content* of the lie (heresy dams, orthodoxy does not). This is correct, but it needs to be sharpened with Augustinian terminology regarding **scandal** (*scandalum*) and **spiritual homicide**.

  For Augustine, the sin of lying is always a turning away from God (who is Truth). However, sins differ in gravity based on what they violate.
  *   **The Heretic's Lie:** When a Priscillianist lies to avoid detection, they are concealing their error. They are preserving their own state of damnation, but they are not necessarily *actively corrupting* the Catholic spy. The lie is defensive. It maintains the status quo of their separation from the Church.
  *   **The Catholic's Lie:** When a Catholic lies to catch a heretic, they must *embody* the error to be convincing. They cannot simply remain silent; they must actively praise heretical dogmas. In doing so, they become a vessel of falsehood regarding Divine things.

  **The Asymmetry:**
  The Catholic's lie is "more pernicious" because it transforms the liar from a witness of Truth into a **preacher of Falsehood.**
  1.  **Risk to the Innocent:** As Augustine notes in Section 4, if a bystander overhears the Catholic praising Priscillianism, that bystander might be "confirmed among them" or "transferred to them." The Catholic risks damning a third party who was previously safe.
  2.  **Violation of Office:** The Catholic has a specific duty to witness to the Truth. To use the guise of heresy as a tool violates the *ordo caritatis* (order of love). You cannot love your neighbor (the potential listener) if you risk their salvation to catch a criminal.
  3.  **The Nature of the Harm:** The heretic's lie harms the truth of the investigation; the Catholic's lie harms the soul of the listener. For Augustine, the salvation of a soul outweighs the judicial capture of a heretic.

  So, you are right: it is about the content. But more specifically, it is about the **direction of spiritual contagion.** The heretic hides the infection; the Catholic spy spreads it to catch the infected.

  ### 2. Consistency with Augustine's Definition of Lying

  You ask how this sits with his "austere, intention-centered definition." In *De Mendacio* and *Contra Mendacium*, Augustine defines a lie as *enuntiatio cum voluntate fallendi* (an assertion with the will to deceive). He insists this is always a sin.

  Does this comparative harm analysis contradict that? **No, but it nuances the gravity of the sin.**

  Augustine distinguishes between eight grades of lies in *De Mendacio*. Some are "officious" (helpful), some "jocose" (jokes), and some "pernicious" (harmful to faith/salvation). All are sins, but they are not *equally* destructive sins.
  *   **The Definition:** Both the heretic and the Catholic satisfy the definition of lying (falsehood + intent to deceive). Both sin.
  *   **The Grading:** The Catholic's lie falls into the category of *mendacium perniciosum* (pernicious lying) because it is "against the doctrine of piety."
  *   **The Resolution:** Augustine is not saying the Catholic's lie is *wrong* while the heretic's is *right*. He is saying the Catholic's lie is *worse*. The asymmetry is one of **degree**, not kind. However, because the Catholic is bound by a higher standard of Truth (being a member of the Church), the violation is more severe.

  For your seminar, it is worth noting that this prevents Augustine from being a pure act-deontologist. The act is always wrong, but the *moral weight* is determined by the object of the lie (doctrine vs. mundane fact) and the consequence for the neighbor's soul (salvation vs. mere confusion).

  ### 3. Parsing the "Cunning Spy" (Section 5)

  The syntax in Browne's translation is indeed knotty ("lyingly bepraises," "reverend mention"). Here is the breakdown of the moral mechanics in the illustration:

  **The Setup:**
  The spy approaches a suspect. To gain trust, he must establish common ground.

  **Step 1: The Praise of Dictinius (The "Tolerable" Lie)**
  *   *Context:* Dictinius was a bishop associated with the Priscillianists but was later reconciled to the Catholic Church (or at least Augustine treats him as a figure who *could* be viewed as corrected).
  *   *The Lie:* The spy praises Dictinius.
  *   *Augustine's Verdict:* "This is more tolerable thus far."
  *   *Why?* Because praising a rehabilitated figure does not necessarily endorse *current* heresy. It is ambiguous. It doesn't force the spy to call evil "good."

  **Step 2: The Praise of Priscillian (The "Intolerable" Lie)**
  *   *Context:* Priscillian is the arch-heretic, "condemned for his nefarious wickedness."
  *   *The Lie:* The spy makes "reverend mention" (respectful/praising reference) of Priscillian.
  *   *The Moral Work:* This is the pivot point. To be a convincing spy, the Catholic must call Priscillian "holy" or "correct."
  *   *The Mechanism of Sin:* Augustine writes: *"in which reverend mention... by this preaching of him he will be confirmed."*
      *   The lie ceases to be merely a tactical deception; it becomes **predication**. The spy is *preaching* heresy.
      *   **The Listener's State:** Augustine highlights the uncertainty: *"if haply the person... had not been a firm Priscillianist."* If the listener was wavering, this praise tips them into damnation.
      *   **The Result:** *"Slays the soul of him who believes it."*

  **What feature does the moral work?**
  It is not the deception itself (the spy still deceives in Step 1). It is the **necessity of affirming evil as good.**
  In Step 1, the spy affirms a ambiguous figure. In Step 2, the spy must affirm a figure Augustine defines as objectively "impious and detestable." The moral work is done by the **corruption of the moral witness.** The Catholic spy is forced to invert the moral order (calling the condemned "reverend") to succeed in his trap. In doing so, he becomes an agent of that inversion for anyone listening.

  ### Seminar Discussion Points

  If I were leading this session, I would frame the discussion around these three tensions derived from your passage:

  1.  **The Problem of Scandal:** Augustine argues that we must not do evil (lie) so that good (capturing heretics) may come. But his specific reason is that the "evil" here infects the bystander. How does this compare to modern "undercover ethics"? (e.g., Is a police officer lying to a criminal different from a journalist lying to a source?)
  2.  **Truth as Ontology vs. Truth as Proposition:** For Augustine, God is Truth. To lie about doctrine isn't just making a false statement; it is aligning oneself with Anti-Christ. Does this theological metaphysics make his argument inapplicable to secular ethics, or is there a secular analogue (e.g., undermining the institution of trust)?
  3.  **The "Clean Hands" Problem:** Consentius wants to use deception to protect the Church. Augustine says this protection method destroys the very thing it protects (the Church's witness to Truth). Is Augustine prioritizing institutional purity over institutional safety?

  ### A Note on Browne's Translation
  For your students, you might want to flag two archaic usages in Browne that obscure the logic:
  *   **"Bepraises":** Simply means "praises highly."
  *   **"Reverend mention":** Does not mean "mentioning a reverend." It means "mentioning with reverence/respect."
  *   **"Perilous":** In this context, it doesn't mean "dangerous for the liar," but "dangerous for the faith/community."

  **Summary for your reconstruction:**
  You are correct. The asymmetry rests on the **soteriological danger of the content.** The heretic's lie protects a damned soul; the Catholic's lie risks creating new damned souls by turning the lie into heretical preaching. This is consistent with Augustine's definition because while both acts are lies (intent to deceive), the Catholic's lie violates a higher order of charity and truth, making it a graver sin. The "cunning spy" illustration demonstrates that the deception *requires* the affirmation of evil, which acts as spiritual poison to any listener.
