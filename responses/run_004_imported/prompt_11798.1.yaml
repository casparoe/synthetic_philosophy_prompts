answer: |-
  This is an excellent catch. You have identified the single most significant pressure point in accuracy-first epistemology. If the argument for Probabilism rests on a specific mathematical choice (the Brier score) that could be swapped for another "reasonable" choice that yields different results, then the argument looks less like a discovery of rationality and more like a definitional trick.

  The literature is well aware of this. The defense against the "arbitrariness" or "rigging" charge has evolved significantly since Joyce's seminal 1998 paper. Here is how the defenders handle it, followed by my honest assessment of whether the framework holds water.

  ### 1. The Defense: It's Not About the Brier Score

  The first line of defense is to correct a common misconception about Joyce's argument (specifically the updated 2009 version).

  **The Generality Result**
  In his 1998 paper, Joyce did rely heavily on the Brier score. Critics immediately pounced on this. However, in *Accuracy and Coherence* (2009) and subsequent work by Richard Pettigrew, the argument was generalized.

  The dominance theorem does not hold *only* for the Brier score. It holds for **any Strictly Proper Scoring Rule.**

  *   **Definition:** A scoring rule is *proper* if, given your current credences, you maximize your expected accuracy by reporting those credences honestly. It is *strictly* proper if honest reporting is the *unique* maximizer.
  *   **The Result:** Predd et al. (2009) proved that for any continuous, strictly proper scoring rule, any probabilistically incoherent set of credences is accuracy-dominated by some coherent set.

  **Why this answers the "Rigging" charge:**
  The proponent argues they aren't smuggling in Probabilism by picking the Brier score specifically. They are arguing that *any* measure of accuracy that satisfies basic normative constraints (strict propriety) will force Probabilism. Therefore, the conclusion isn't an artifact of one formula; it's a structural feature of any reasonable way to measure "distance from the truth."

  ### 2. The Normative Defense: Why "Strict Propriety"?

  But this just pushes the worry back one step. Why must we use a *Strictly Proper* scoring rule? If I choose a scoring rule that isn't proper, the dominance result vanishes. Is requiring propriety itself a way of smuggling in Probabilism?

  Defenders argue that strict propriety is a **conceptual requirement** for measuring *epistemic* accuracy, distinct from pragmatic utility.

  **The "Honesty" Constraint**
  If a scoring rule is *improper*, it incentivizes you to report a credence different from what you actually believe to maximize your score.
  *   *Example:* If you believe $P(H) = 0.6$, but the scoring rule gives you a higher expected score for reporting $0.8$, the rule is measuring your ability to game the system, not the accuracy of your belief state.
  *   **The Argument:** Epistemic accuracy is about the fit between mind and world. If the metric tells you to misrepresent your mind to get a better "accuracy" score, it is not a metric of accuracy. Therefore, any legitimate measure of epistemic utility *must* be strictly proper.

  **Convexity and Continuity**
  Defenders (like Pettigrew) add further constraints. A measure of inaccuracy should be continuous (small changes in belief shouldn't cause massive jumps in inaccuracy) and convex (the pain of being wrong increases as you move away from the truth). When you combine Strict Propriety + Continuity + Convexity, the class of allowed scoring rules shrinks, but importantly, *all* remaining members still yield the Probabilism dominance result.

  ### 3. The Counter-Attack: Does Propriety Beg the Question?

  This is where the "crack" you sensed becomes visible. Critics like Michael Caie, Jason Konek, and others have argued that the requirement of Strict Propriety might implicitly presuppose the very probabilistic structure it's trying to prove.

  **The "Chance" vs. "Truth" Problem**
  Strict propriety is defined in terms of *expectations*. To calculate expected accuracy, you need to weight the possible scores by probabilities.
  *   If you are already a probabilist, you use your credences as weights.
  *   If you are *not* a probabilist (e.g., you have imprecise credences or use ranking theory), the notion of "maximizing expected accuracy" might not even be well-defined in the way Joyce requires.

  Some critics argue that by defining "rational accuracy" as "that which is maximized by coherent credences," Joyce is engaging in a circle. He defines the legitimate measures of accuracy as those that reward probabilistic coherence.

  **The Levinstein Objection**
  Benjamin Levinstein has argued that there are scoring rules that seem intuitively reasonable (capturing certain epistemic values like "avoiding false certainty") that are not strictly proper in the standard sense, or where the dominance argument fails for specific types of incoherence. If there is *any* reasonable measure of epistemic value where incoherence isn't dominated, the "always irrational" claim of Probabilism weakens.

  ### My Honest Read: Is it a Fatal Crack?

  Here is my take on the state of the literature.

  **1. Probabilism survives, but Accuracy-First takes the hit.**
  The mathematical machinery is robust. If you accept that (a) accuracy is the sole/fundamental epistemic good, and (b) accuracy must be measured by a strictly proper rule, then Probabilism follows. The "rigging" charge regarding the Brier score specifically is dead; the generalized theorem is solid.

  **2. The real battle is over "Strict Propriety."**
  The worry isn't that they picked the wrong formula; it's that the constraint of Strict Propriety is a substantive normative claim, not a neutral definition.
  *   **Defenders say:** It's analytic. You can't measure accuracy if the metric rewards lying.
  *   **Critics say:** It assumes the agent's credences are the correct weights for expectation. If an agent is incoherent, their expectations are messed up. Why should we evaluate their rationality based on *their* messed-up expectations? (This is the "Self-Defeat" objection).

  **3. It is a load-bearing wall, not a crack in the foundation.**
  I don't think this destroys accuracy-first epistemology, but it does limit its scope. It shows that accuracy-first arguments are **internal** arguments.
  *   They tell you: *If* you care about accuracy defined this way, *then* you must be probabilistic.
  *   They do *not* tell you: You must care about accuracy defined this way.

  **The Verdict:**
  The argument is not "rigged" in the sense of mathematical cheating. It is "rigged" in the philosophical sense that it defines epistemic rationality through a specific consequentialist lens (maximize expected veritic value).

  If you are a deontologist about belief (e.g., "I have a duty to proportion belief to evidence," regardless of the 'score'), or if you think there are other epistemic virtues (understanding, explanatory power) that cannot be reduced to a scoring rule on truth-values, the Joyce argument slides right off you.

  **Conclusion:**
  The dominance argument is the best *internal* justification for Probabilism we have. It is superior to Dutch Book arguments because it is purely epistemic, not pragmatic. However, it does not settle the debate for anyone who rejects the **Veritic Conception of Epistemic Value**.

  So, is it a crack? It's more like a boundary marker. It shows that Accuracy-First Epistemology is a powerful, coherent system, but it is a *system*, not a neutral observation of reality. If you step outside the system (by rejecting strict propriety or veritic value as the sole good), the obligation to be probabilistic dissolves. The defenders usually admit this, but they argue that any system *not* based on accuracy is failing to capture what belief is *for*.

  If you're going down this rabbit hole, I recommend looking at **Pettigrew's *Accuracy and the Laws of Credence*** for the strongest defense, and **Michael Caie's "Rational Credence and the Value of Truth"** for the most damaging critique regarding how we calculate expected accuracy for incoherent agents.
