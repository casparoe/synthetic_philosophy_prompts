      *   **The Mechanism:** Insurance relies on *risk pooling*. Low-risk people subsidize high-risk people.
      *   **The Effect of Info:**
          *   *Before Info:* Insurer charges average premium. Everyone buys. Pool works.
          *   *After Info:* Insurer charges risk-specific premiums. High-risk premium is too high. High-risk people drop out (or can't afford). Pool collapses or becomes unaffordable for those who need it.
      *   **The "Worse Off" Outcome:** From the *ex-ante* perspective (before testing), the expected utility of the *system* (or the average person) drops because the insurance mechanism breaks.

  4.  **Identify the Discrepancy (The "Aha!" Moment):**
      *   Good's Theorem applies to a *single* decision-maker optimizing their own payoff given a fixed environment.
      *   The Insurance scenario is a *game* (multi-agent). The payoff structure *changes* based on the information because the *other* player (the insurer) also updates and changes their strategy (pricing).
      *   In Good's Theorem, the world is passive. In the Insurance case, the world (the insurer) is strategic.
      *   Also, there's a distinction between *individual* value of information and *social/systemic* value of information. Good's theorem is about the individual. The insurance breakdown is often about the collective outcome (Pareto efficiency).
