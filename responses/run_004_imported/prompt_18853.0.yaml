  Ok this is going to sound like a weirdly specific question but here's the backstory: last week I got off the highway at the totally wrong exit because there were two exits in a row that looked identical (same overpass, same billboard, no distinguishing sign until you're already past the point of no return) and I genuinely could not tell if I was at the first one or the second one. I picked some rough probability of turning off, guessed wrong, and tacked 40 minutes onto my drive. Told my brother about it and he goes "that's literally the absent-minded driver problem," and sends me a paper on it. Now I'm down a rabbit hole, and apparently people bring up the "Sleeping Beauty problem" in the same breath alot (something about waking up not knowing which day it is?). Can you actually compare the two for me properly, like what's genuinely the same about them structurally vs. where they really diverge? And if you had to pick one as the "deeper" puzzle for decision theory/epistemology, which would it be and why?
