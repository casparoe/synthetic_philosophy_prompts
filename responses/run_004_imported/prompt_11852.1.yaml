      *   *Key Insight:* The input to Jeffrey conditioning ($P_{new}(E)$) is not "evidence strength," it's "posterior belief in E." Posterior belief depends on prior. Hence, order matters. Likelihood ratios represent evidence strength independent of prior. Hence, they commute.

