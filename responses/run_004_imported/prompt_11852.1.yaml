      *   **The Fix (Virtual Evidence):** Introduce Pearl's approach (Likelihood Ratios/Bayes Factors). This *is* commutative and is usually preferred in AI/BNs for this exact reason.
      *   **When to use which:** Jeffrey is good for direct sensory shifts (e.g., "the light looks dim"). Virtual Evidence is good for reports/testimony ("The sensor says 'high' with 80% reliability").
