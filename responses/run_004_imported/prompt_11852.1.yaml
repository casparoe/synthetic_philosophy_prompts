answer: |-
  You haven't missed anything basic, and you definitely don't have a normalization bug. **You have stumbled onto one of the most famous and debated quirks in formal epistemology.**

  You are absolutely correct: **Jeffrey Conditionalization is not commutative.** If you update on uncertain evidence $E$ and then uncertain evidence $F$, you will generally get a different probability distribution than if you update on $F$ then $E$.

  This was formally pointed out by Persi Diaconis and Sandy Zabell in their seminal 1982 paper *"Updating Subjective Probability."* It is a known mathematical property, not a coding error. However, your intuition that this feels "damning" for a rational framework is also shared by many philosophers and AI researchers.

  Here is the breakdown of why this happens, why it's not necessarily a dealbreaker, and—most importantly for your bot—**how to fix it.**

  ### 1. Why Order Matters (The Math Intuition)

  In standard Bayesian conditionalization, you learn a fact $E$ is true ($P(E)=1$). The order doesn't matter because conditioning on $E$ then $F$ is mathematically equivalent to conditioning on the intersection $E \cap F$.

  In Jeffrey Conditionalization, you aren't learning a fact. You are imposing a constraint: *"Shift your probability of $E$ to $x$, but keep the conditional probabilities $P(H|E)$ and $P(H|\neg E)$ exactly the same as they were before."*

  Here is the catch:
  1.  **Update 1 (on $E$):** You preserve $P(H|E)$. However, this update *changes* $P(H|F)$ as a side effect, because shifting the weight of $E$ shifts the weight of everything correlated with $E$.
  2.  **Update 2 (on $F$):** Now you apply the Jeffrey rule for $F$. This rule says: *"Preserve the **current** $P(H|F)$."*

  But the "current" $P(H|F)$ is different than the "original" $P(H|F)$ because Update 1 messed with it.

  If you had done $F$ first, you would have preserved the *original* $P(H|F)$, and Update 2 (on $E$) would have preserved the *original* $P(H|E)$.

  Because the second update preserves the *post-first-update* conditionals rather than the *original* conditionals, the path matters. A good analogy is **3D rotations**: If you rotate an object 90° around the X-axis and then 90° around the Y-axis, it ends up in a different orientation than if you rotate Y then X. Jeffrey updates act like rotations on the probability simplex.

  ### 2. Is This "Irrational"?

  It feels irrational because we intuitively think of "evidence" as a standalone object (e.g., "a clue") that should add a fixed amount of weight regardless of when we find it.

  The philosophical defense of Jeffrey Conditionalization is that **the input to Jeffrey Conditioning isn't just "the evidence."** The input is *"my new confidence level in proposition E."*

  Your confidence level in $E$ is inherently dependent on your prior state. If you are already 99% sure of $E$, a hint might move you to 99.5%. If you are 10% sure, the same hint might move you to 50%. By specifying the *output probability* ($P_{new}(E)$) rather than the *strength of the evidence*, you are implicitly baking your prior into the evidence itself. Since the priors change after the first update, the "evidence" effectively changes depending on when you receive it.

  So, it's not logically inconsistent, but it is **underspecified** for combining multiple independent sources of uncertain info.

  ### 3. The Fix: Virtual Evidence (Likelihood Ratios)

  For your bot, you want commutativity. You want the hints to have a "strength" that is independent of the bot's current belief.

  The solution used in Bayesian Networks and AI is **Judea Pearl's method of "Virtual Evidence"** (sometimes called updating via Likelihood Ratios or Bayes Factors).

  Instead of telling your bot:
  > "Update your belief so that $P(\text{Room 3}) = 0.8$." (Jeffrey)

  You tell your bot:
  > "Here is a hint. The likelihood of seeing this hint if the item is in Room 3 is 4 times higher than if it is not." (Virtual Evidence)

  Mathematically, instead of setting $P_{new}(E)$, you provide a likelihood ratio $\lambda = \frac{P(\text{Hint}|E)}{P(\text{Hint}|\neg E)}$. You update by multiplying the odds:
  $$ O_{new}(H) = O_{old}(H) \times \lambda $$

  **Why this solves your problem:**
  1.  **Commutativity:** Multiplication is commutative. $\text{Odds} \times \lambda_1 \times \lambda_2$ is the same regardless of order.
  2.  **Separation of Concerns:** It separates the *strength of the hint* (which is static) from the *current belief* (which changes).
  3.  **No Certainty Required:** Like Jeffrey, it never forces probability to 0 or 1 unless $\lambda$ is infinite or zero.

  ### 4. How to implement this for your bot

  If you want to stick with the Jeffrey framework because it feels intuitive to say "I'm 80% sure," you have to convert that statement into a Likelihood Ratio *at the moment you receive the hint*, based on the *current* prior, and then store the Ratio, not the Probability.

  **The Workflow:**
  1.  **Bot State:** Current probability $P(H)$.
  2.  **Receive Hint:** You (the designer) decide this hint should make the bot 80% sure ($P_{target} = 0.8$).
  3.  **Calculate Strength:** Compute the Bayes Factor $K$ required to move the *current* $P(H)$ to $P_{target}$.
      $$ K = \frac{P_{target} / (1 - P_{target})}{P(H) / (1 - P(H))} $$
  4.  **Apply Update:** Multiply the bot's odds by $K$.
  5.  **Next Hint:** When the next hint comes, calculate a *new* $K_2$ based on the *new* prior, and multiply again.

  By storing and applying the **multiplier ($K$)** rather than the **target probability**, your updates become commutative. If you apply $K_1$ then $K_2$, it's the same as $K_2$ then $K_1$.

  ### Summary
  *   **You are right:** Jeffrey Conditionalization is order-dependent.
  *   **It's not a bug:** It's a property of updating based on target probabilities rather than evidence strength.
  *   **It is fixable:** Switch to updating via **Likelihood Ratios (Bayes Factors)**. This is the standard way AI systems handle "soft" evidence without running into order-dependence paradoxes.

  For a hobby bot, switching to the Odds/Likelihood formulation will save you a lot of head scratching and make your bot's behavior much more stable!
