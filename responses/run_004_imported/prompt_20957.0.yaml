      *   *Samuelson vs. Peters:*
          *   Samuelson: Rationality is consistency of preferences.
          *   Peters: Rationality is survival in non-ergodic processes.
          *   The Verdict: Peters identifies a category error in EUT, but EUT is still broader for consumption/preferences.
      *   *Nuance:* Mention the "absorbing barrier" (ruin). Mention that EUT can *accommodate* log utility, but Peters says it *requires* it for growth.
      *   *Conclusion:* It's not about who is "right," but which tool fits the problem. For repeated investment? Peters/Kelly. For one-off decisions with consumption? EUT still holds water.

