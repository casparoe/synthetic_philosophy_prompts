      *   **The Conflict:** Expected Utility Theory (EUT) vs. Time-Average Growth (Ergodicity Economics/Geometric Rationality).
      *   **Specific Question:** Is Peters' argument that log-growth is *forced* by dynamics (independent of utility) valid, or is it just log utility in disguise? Who wins: Peters or Samuelson?
      *   **Tone:** Intellectual, respectful, nuanced, avoiding oversimplification but clear enough for a scientist. Acknowledge the Samuelson anecdote (the one-syllable paper).

  2.  **Deconstruct the Core Concepts:**
      *   **Expected Utility Theory (EUT):** The standard neoclassical framework (Von Neumann-Morgenstern). You maximize $E[U(W)]$. Risk aversion is encoded in the curvature of $U(W)$. If $U(W) = \ln(W)$, you get Kelly betting. If $U(W) = W$, you maximize expected value (often leads to ruin in repeated multiplicative bets).
      *   **Ergodicity Economics (Peters):** Focuses on the non-ergodic nature of wealth dynamics. In multiplicative processes (like betting/investing), the ensemble average (what happens to many people at once) $\neq$ the time average (what happens to one person over time). Peters argues rationality should be defined by maximizing the time-average growth rate ($\bar{g}$). For multiplicative wealth, $\bar{g}$ turns out to be the expected log return.
      *   **The Crux:** EUT says "Choose your utility function based on your preferences." Peters says "The physics of the process dictates the objective function; utility is irrelevant or derived."

  3.  **Evaluate the "Log Utility in Disguise" Claim:**
      *   *Mathematically:* Yes, maximizing time-average growth in a multiplicative process is mathematically equivalent to maximizing expected log wealth.
      *   *Conceptually:* This is where the fight is.
          *   **Samson/EUT view:** You *choose* log utility because you are risk-averse. If you were risk-neutral, you'd bet everything. The math doesn't force you; your psychology does.
          *   **Peters view:** If you bet everything in a multiplicative game with any downside risk, you *will* go to zero eventually (absorbing state). It's not about preference; it's about survival. The "utility function" is a property of the *dynamics*, not the *agent*.

  4.  **Assess the Validity of Peters' Argument:**
      *   **Strengths:** Resolves the St. Petersburg Paradox without invoking arbitrary utility functions. Explains why people *actually* behave (risk aversion) without assuming irrationality. Highlights the ergodicity problem (a major blind spot in econ).
      *   **Weaknesses/Criticisms:**
