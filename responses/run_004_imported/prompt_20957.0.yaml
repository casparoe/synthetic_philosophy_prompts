          *   **Preferences:** People *do* have different risk tolerances. A billionaire might rationally bet differently than a pauper, even in the same game. EUT handles this via wealth-dependent utility; Peters handles this via "fraction of bankroll," but the *objective* remains log growth.
          *   **The "Forced" Claim:** Is it truly forced? If I plan to die tomorrow, time averages don't matter. If I can hedge or insure, the dynamics change.
          *   **Samuelson's Point:** Samuelson argued that maximizing geometric mean doesn't maximize expected utility for finite horizons unless $U = \log$. He was right *within the EUT framework*. Peters is challenging the framework itself.

  5.  **Synthesize the "Who Won?" Question:**
      *   It's not a knockout. It's a paradigm shift.
      *   Samuelson won the 20th century (EUT is the standard).
      *   Peters is winning the narrative on *repeated multiplicative risks* (Kelly/ergodicity is standard in trading/poker).
      *   The "one-syllable paper" is a great anecdote to reference ("Proof That Probability Separate From Utility").

  6.  **Drafting the Response (Iterative refinement):**
