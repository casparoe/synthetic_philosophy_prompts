answer: |-
  This is a fantastic rabbit hole to fall down, and your background as a research chemist actually puts you in a better position to understand the core conflict than most economists do. You're used to thinking about statistical mechanics, trajectories, and the difference between ensemble properties and time evolution. That is precisely the fault line here.

  To answer your core question: **Mathematically, they are often identical. Philosophically, they are enemies.**

  Whether Peters has "forced" log utility on you or merely renamed it depends on whether you view risk aversion as a *psychological preference* (Samuelson) or a *physical constraint* (Peters).

  Here is the breakdown of the fight, tailored to someone who understands dynamics.

  ### 1. The Ergodicity Problem (The Chemist's View)
  In statistical mechanics, you assume ergodicity: the time average of a single system equals the ensemble average of many systems. If you measure the pressure of one gas box over an hour, it's the same as measuring 1,000 boxes at one instant.

  Standard Expected Utility Theory (EUT) implicitly assumes ergodicity. It calculates the **ensemble average**: "If 1,000 versions of you took this bet once, what is the average wealth?"
  Ergodicity Economics (Peters) calculates the **time average**: "If *you* take this bet 1,000 times in a row, what is your wealth trajectory?"

  In additive processes (win \$10 or lose \$10), the system is ergodic. Time average $\approx$ Ensemble average.
  In multiplicative processes (win 10% or lose 10% of your bankroll), the system is **non-ergodic**.

  **The Trap:**
  If you have a 50% chance to gain 50% and a 50% chance to lose 40%:
  *   **Ensemble Average (EUT):** $0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$. Positive expected value. A risk-neutral EUT agent bets everything.
  *   **Time Average (Peters):** Over many rounds, your wealth is multiplied by $1.5 \times 0.6 = 0.9$. You lose 10% of your wealth per two rounds on average. You go to zero.

  Peters' argument is that for wealth dynamics, the ensemble average is physically meaningless to the individual agent. You cannot marry the average spouse. You live one trajectory. Therefore, rationality *must* be defined by the time-average growth rate.

  ### 2. Is Log Utility Just Sneaking Back In?
  You asked: *Is "time-average" just log utility sneaking back in under a new name?*

  **Mathematically: Yes.**
  To maximize the time-average growth rate of a multiplicative process, you must maximize the expected value of the logarithm of wealth.
  $$ \bar{g} = \langle \ln(W_{t+1}/W_t) \rangle $$
  This is the Kelly Criterion. It is mathematically indistinguishable from an agent with Von Neumann-Morgenstern utility function $U(W) = \ln(W)$.

  **Conceptually: No.**
  This is where the war is fought.
  *   **Samuelson/EUT:** The logarithm comes from **you**. It represents your subjective psychological distaste for risk. If you were brave enough, or rich enough, you could choose $U(W) = W$ (linear) and bet everything. It's a preference parameter.
  *   **Peters:** The logarithm comes from the **physics**. It is dictated by the multiplicative structure of the dynamics. It doesn't matter if you are brave or risk-loving; if you bet too much in a non-ergodic multiplicative process, you hit the absorbing barrier (zero) and vanish. The "utility function" is a property of the environment, not the agent.

  Peters claims he has solved the St. Petersburg Paradox without invoking "diminishing marginal utility." He argues you don't need to assume people value the 100th dollar less than the 1st; you just need to acknowledge that infinite expected value relies on ensemble outcomes that never occur in a single lifetime.

  ### 3. Samuelson's Counter-Attack
  Samuelson was not a man to be trifled with. His 1971 paper, *"The 'Fallacy' of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling,"* is the canonical rebuttal. (The story about the one-syllable words is likely apocryphal lore, though it captures his contempt perfectly. He did offer a prize for a proof that geometric mean maximization was optimal, which he claimed no one could provide without assuming log utility.)

  Samuelson's main points were:
  1.  **Finite Horizons:** Maximizing geometric mean (log growth) is only optimal if you play forever. If you have a finite horizon (you will die/spend the money at time $T$), maximizing expected log wealth does *not* necessarily maximize expected utility of terminal wealth, unless your utility *is* log.
  2.  **Consumption:** We don't care about wealth for wealth's sake; we care about consumption. EUT handles consumption smoothing naturally. Ergodicity economics focuses heavily on wealth accumulation.
  3.  **The "Fallacy":** Samuelson argued that just because the geometric mean converges to a sure thing in the long run doesn't mean you should maximize it. A bet with a tiny probability of infinite payoff might have a low geometric mean but huge expected utility for a risk-neutral agent.

  Samuelson was defending the **axiomatic consistency** of preferences. Peters is attacking the **mapping of those preferences to reality**.

  ### 4. Who Has the Better of It?
  It depends on the domain.

  **Peters Wins When:**
  *   **Repeated Multiplicative Risks:** In trading, poker, or business investment where you reinvest profits, Peters is objectively correct. The dynamics *do* force a log-like constraint if you want to avoid ruin. Calling it "utility" obscures the fact that ruin is a physical state, not a psychological one.
  *   **Explaining Risk Aversion:** EUT has to *assume* people are risk-averse (concave utility). Peters *derives* risk aversion from the requirement of survival in non-ergodic systems. This is a much stronger scientific explanation.

  **Samuelson Wins When:**
  *   **One-Off Decisions:** If you are making a single bet that won't be repeated, the time-average argument weakens.
  *   **Consumption & Liquidity:** If you need to withdraw money to eat, the pure reinvestment model breaks down. EUT is more flexible here.
  *   **Heterogeneous Preferences:** A billionaire and a pauper face the same multiplicative game. Peters says both should Kelly bet (fractional). EUT allows the billionaire to be effectively risk-neutral on small bets while the pauper is risk-averse. Peters handles this via "fraction of bankroll," but EUT handles it via "marginal utility of consumption," which feels more intuitive for spending decisions.

  ### The Verdict
  Samuelson was right that **mathematically**, you cannot derive the Kelly criterion from expected value maximization without introducing a logarithm somewhere. If you say "dynamics force the log," you are effectively saying "the dynamics impose a utility function."

  However, Peters is right that **economically**, treating that logarithm as a "psychological preference" was a category error that stalled progress for 50 years. It led economists to believe risk aversion was a quirk of human psychology rather than a mathematical necessity of non-ergodic systems.

  **For a retired chemist:**
  Think of it like this. Samuelson is treating the economy like a collection of ideal gases where you can swap particles (ensemble). Peters is pointing out that wealth is a single polymer chain undergoing Brownian motion with an absorbing boundary at zero. You can't use ensemble statistics on a single trajectory that can break.

  **Recommendation:**
  Don't discard Expected Utility Theory entirely; it's still the best framework for decisions involving consumption and finite horizons. But for **portfolio construction and repeated betting**, accept Peters' premise: the log criterion isn't a preference; it's a constraint imposed by the topology of the wealth space.

  Samuelson won the Nobel Prize, but Peters is winning the traders and the quants. In the long run (time average), the dynamics usually beat the axioms.
