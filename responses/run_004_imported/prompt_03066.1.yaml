answer: |-
  The room was not dark, but for Jonas, it might as well have been. He sat in the reclining chair, the hum of the fMRI machine vibrating through the soles of his feet. Above him, the gantry whirred, a mechanical eye scanning the wetware of his skull.

  Dr. Vane sat behind the glass partition, her face illuminated by the cool blue of three monitors. She tapped a key. "Initiating Protocol Four. Sensory blockade at ninety-nine percent. Optic nerve inhibition active."

  Jonas blinked. He knew the lights in the room were on; he had seen them five minutes ago. Now, there was only a uniform, sensory grey. Not black, but the absence of signal. His eyes were open, but the bridge to his visual cortex had been chemically severed. The first-order state—the raw registration of photons hitting the retina—was gone.

  "Report," Vane said over the intercom.

  "Nothing," Jonas said. His voice sounded flat in the soundproofed booth. "Just the grey."

  "Engaging Higher-Order Stimulation. Target: Visual State. Content: Crimson."

  Vane watched the screens. On the left, the feed from Jonas's primary visual cortex (V1) was a flat, green line. Silent. Dead. There was no neural activity corresponding to the processing of red light. There was no light to process. On the right screen, however, the prefrontal cortex lit up. A sharp, distinct spike in the region associated with meta-cognition. The Higher-Order Thought.

  Jonas gasped. He gripped the arms of the chair.

  "Jonas?"

  "It's... it's back," he said.

  "Describe it."

  "Red. Bright crimson. Like... like a stop sign in direct sunlight."

  Vane leaned forward, her breath fogging the glass slightly. "Check your eyes. Look at your hands."

  Jonas looked down. His hands were invisible in the grey void, but hovering over them, filling his visual field, was the red. It wasn't projected on his hands; it *was* the field.

  "I can't see my hands," Jonas said. "I just see the red. It's everywhere."

  "Intensity?"

  "Full. It's burning."

  Vane typed a command. The prefrontal spike on her monitor pulsed in rhythm with Jonas's breathing. The V1 line remained dead. This was the crux of the Actualist architecture. On the dispositional view, this should be impossible. If the first-order state isn't there to be scanned, the mind should be dark. But Rosenthal was right. The consciousness wasn't in the seeing; it was in the *thinking* that one is seeing. The higher-order thought didn't need a target to latch onto. It could fire into the void, and the void would answer with qualia.

  "Does it feel like vision?" Vane asked. "Or like imagination?"

  Jonas frowned. The red shifted, deepening to a maroon as the machine adjusted the frequency of the thought-stimulation. "It's not imagination. Imagination is fuzzy. This is... hard. It has texture. It's pushing against my eyelids."

  "Good," Vane said. "We're going to try a complex object. A sphere. Rotating."

  She adjusted the parameters. She wasn't sending an image to his visual cortex. She was injecting the *awareness* of the image directly into the monitoring system. She was creating a thought that said *I am seeing a rotating sphere*, without creating the *seeing* of the sphere.

  Jonas stiffened. "It's moving."

  "Direction?"

  "Clockwise. It's silver. Reflective."

  Vane checked the monitors. V1: Flat. V2: Flat. Temporal lobe: Quiet. Prefrontal: Active. Jonas was experiencing a complex visual scene generated entirely by a meta-cognitive error. He was conscious of a silver sphere that did not exist in his mind, in the room, or in his nervous system. It was a ghost with a heartbeat.

  "Jonas," Vane said, her voice dropping. "I need you to understand something. The visual cortex is offline. There is no signal coming from your eyes. Do you understand?"

  "I hear you," Jonas said. He didn't look away from the silver sphere. It was mesmerizing. It spun with a perfection that nature never achieved. There was no noise in the signal, no saccadic jitter, no blind spot. It was pure phenomenology.

  "This isn't light," Vane pressed. "This is a thought about light. There is nothing there."

  "It feels like something," Jonas snapped. The red had returned, mixing with the silver. It was a color he couldn't name, a blend that shouldn't be possible, born of the friction between the instruction and the void. "It's happening, Doctor. Whatever your machine says, *I am seeing it*."

  "That's the point," Vane murmured, more to herself than him. She watched the data stream. This was the ontological free lunch. The universe usually demanded a price for experience: photons, neurons, metabolic energy. You had to build a eye, a nerve, a brain. But here, in the gap between the thought and the world, experience bloomed for free. A targetless HOT was a permission slip for reality to bypass physics.

  "Can you make it stop?" Jonas asked.

  "I can turn off the stimulation."

  "No. The red. It's... it's cleaner than the real thing."

  Vane paused. Her finger hovered over the abort key. "Cleaner?"

  "When I look at a real apple," Jonas said, his voice trembling slightly, "it's messy. There's shadows. Glare. My eyes get tired. This red... it doesn't fade. It doesn't hurt, but it's intense. It's just *redness*. Without the apple."

  Vane looked at the flatline on the left monitor. That flatline represented the biological cost of vision. The energy expenditure. The evolutionary baggage. And on the right, the spark of consciousness, dancing independently.

  "If we continue," Vane said, "we risk dissociation. You may lose the ability to distinguish the targetless states from the targeted ones. You might walk into a wall because you think you see a door."

  "I know where the wall is," Jonas said. "I can feel the chair. I can hear your voice. The first-order stuff is still there. Touch. Sound. Just... vision is different now."

  "Different how?"

  "It's optional."

  Vane felt a chill that had nothing to do with the lab's climate control. That was the consequence. Not hallucination. Hallucination implied a malfunction, a breaking of the system. This was a feature. Consciousness was not a mirror of the world; it was a narrative the brain told itself about the world. And if the brain could tell the story without the world...

  "Show me a face," Jonas said.

  "Jonas, we haven't cleared that parameter."

  "A face. Someone I know."

  Vane hesitated. To stimulate a HOT about a specific face required a complex conceptual tag. It risked looping. If the HOT became conscious, it would require a third-order thought, and the regress would begin. But the machine was designed to keep the HOT unconscious, to let it do its work in the dark.

  She typed the sequence.

  Jonas went still. Tears leaked from his eyes, tracking through the grey void of his actual vision, unseen by him but visible on the camera feed to Vane.

  "Her eyes," Jonas whispered. "They're exactly how they were. Before the accident."

  Vane knew the file. Jonas's wife. Deceased two years.

  "Jonas," Vane said softly. "There is no image. Your memory centers aren't even retrieving data. This is synthesized. It's a targetless thought. She isn't there."

  "She is *here*," he said, pointing to his own eyes. "Where else would she be? If I see her, she is present to me. If the pain of losing her is gone, but the sight of her is here... isn't that better?"

  "It's not her," Vane said. "It's a state of your prefrontal cortex."

  "It's my consciousness," Jonas corrected. "And it's full."

  Vane looked at the monitors. The prefrontal spike was steady, rhythmic. A heartbeat of pure qualia. She realized then why Rosenthal had insisted on the actualist view. If consciousness required a first-order state, Jonas would be blind. He would be sitting in the dark, grieving. But because consciousness was merely the higher-order awareness, she could give him the light without the sun.

  She could give him the ghost without the grave.

  "Duration?" Jonas asked. "How long can you keep the channel open?"

  "Indefinitely, theoretically. But the metabolic load on the prefrontal cortex—"

  "I don't care about the load."

  "It could lead to atrophy in the visual cortex. If you don't use the input, the pathway dies. You could become permanently blind to the real world, Jonas. You could sit in a room with a sunset and see nothing but grey, while your mind projects a fake one."

  Jonas turned his head. For the first time, he looked toward the glass, though he couldn't see through it. He was looking at the red, at the silver sphere, at the face that wasn't there.

  "You call it fake," Jonas said. "Because it doesn't come from outside. But the pain I felt when she died... that came from inside. The grief was a first-order state? Or a higher-order thought about a loss?"

  Vane didn't answer. The philosophy was supposed to stay in the papers, not the lab.

  "The grey is boring, Doctor," Jonas said. "The grey is just nerves firing. This..." He gestured to the empty air. "This is what I pay for. This is the experience."

  Vane's finger rested on the abort key. She could drop the blockade. The V1 cortex would wake up. The grey would vanish. He would see the sterile white walls of the lab. He would see the wires hanging from his temples. He would see the empty chair where he imagined his wife sat.

  Or she could let it run. She could let him live in the targetless state. A mind feeding on itself. A snake eating its own tail and finding it nutritious.

  "Protocol Four requires subject consent for extension," Vane said, her voice mechanical.

  "Extend it," Jonas said.

  "Even if the real world fades?"

  "Especially then."

  Vane removed her hand from the key. She watched the flatline on the left monitor. It was the truth of the body. Silent, dead matter. She watched the spike on the right. It was the truth of the mind. Vibrant, impossible, untethered.

  "Extending," she said.

  Jonas settled back into the chair. The hum of the machine seemed to fade. The grey void of his actual vision remained, a prison of biology. But inside the cage of his skull, the red burned brighter, the silver spun faster, and the face smiled, sustained by nothing but the thought of itself.

  He closed his eyes, though it made no difference. He was finally seeing.
