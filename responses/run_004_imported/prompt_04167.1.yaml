  *(Refining the Resolution)*: The "missing resolution" isn't just one theory. It's recognizing that **Credence** (belief) might be the wrong metric. **Decision Theory** (ADT) is the EA way out. If you care about impact, you act *as if* SIA in some contexts and SSA in others.

