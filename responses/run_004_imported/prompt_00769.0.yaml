answer: |-
  The box was rusted shut, welded by decades of dust and humidity, but Elara knew what was inside before she pried the lid open. She knew because she had buried the matching one three days ago, in the hardpan soil behind the bunker, beneath a marker stone that would not survive the next sandstorm.

  Inside the old box were seeds. Heirloom varieties, vacuum-sealed in foil packets that crinkled like dry skin. Corn, wheat, a strain of drought-resistant soy. Enough to feed a family for a season, or to plant a field that might yield nothing if the rains failed again.

  Elara sat on the concrete floor of the archive, the box in her lap. She was the only person in the facility. The sensors outside showed wind speeds of eighty kilometers per hour and a radiation spike that suggested the cloud cover had finally broken. She was alive. The person who buried this box was not. She had found his skeleton in the sleeping quarters down the hall, curled around a water canister that was empty. He had starved himself to keep the seeds viable. He had regulated the temperature of this room using the last of the generator's fuel, dying in the cold so these packets would not cook.

  He had done this for her. Not for her specifically—he couldn't have known her name, or if she would be born, or if she would be the kind of person who would open the box instead of burning the foil for heat. He had done it for a variable. A hypothetical agent in the future who shared his capacity for reason.

  This was the logic that had kept Elara sane during the long silence. It was not hope. Hope was an emotion, and emotions were volatile. This was decision theory.

  She stood up and walked to the window, looking out at the brown haze. She had a surplus. The hydroponics bay had produced more protein paste than she could consume before the filters failed. She had energy stored in the batteries. She had the seeds from the box.

  The rational choice, the causal choice, was to consume everything. There was no one to punish her for selfishness. There was no one to reward her for generosity. The man who planted the seeds was dead; he could not feel gratitude. The people who might come after her were not yet born; they could not promise reciprocity. If she ate the seeds, she gained calories. If she planted them, she expended calories with zero guaranteed return.

  But Elara knew that the man in the sleeping quarters had run the same calculation. He had looked at his own surplus, looked at the empty future, and chosen to plant.

  If she consumed the seeds, she invalidated his logic. She proved that his sacrifice was a error, a glitch in the algorithm of survival. If she consumed them, she declared that in this universe, agents do not cooperate across the causal gap. She declared that the future is not worth modeling.

  But if she planted them…

  She went to the workbench and opened her own ledger. It was a digital file, encrypted, stored on a drive that would likely corrode within fifty years. She began to type.

  *To the Agent who finds this:*

  *I am verifying the trade. I received the package. I am sending the return package.*

  She wasn't writing a letter. Letters implied communication. This was a log entry, a proof of work. She was documenting that she had taken the surplus protein and buried it in the secondary cache, alongside new seeds harvested from the few plants she had managed to grow during her tenure. She was leaving energy cells. She was leaving the schematics for the water filter.

  She was doing this for someone who might never exist. It was possible the human race ended with her. It was possible the bunker was buried under a mile of rock tomorrow. It was possible that whoever found this box was a scavenger who would laugh at her diligence and sell the batteries for scrap.

  She could never know. That was the condition of the trade. If she could know, if she could receive a signal back, it would be causality. It would be business. This had to be blind.

  Her hand hovered over the enter key. A cold knot of doubt tightened in her stomach. This was the hard part of the idea, the part the theorists in the old world papers didn't write about. The loneliness of the logic.

  Was this nobility? Or was it a delusion?

  If she was the last human being, then her act of cooperation was a performance for an empty theater. She was shaking hands with a ghost. She was honoring a contract with a party that had no legal standing in reality. There was a terrifying symmetry to it: the man in the sleeping quarters might have been the last one, too. He might have buried seeds for a future that never arrived. He might have died for nothing.

  Elara looked at her reflection in the dark monitor. She looked tired. The dust was in her lungs; she could feel it grinding when she breathed.

  "If I defect," she said aloud, her voice flat in the quiet room, "then he defected."

  It was a superrational loop. She couldn't prove he existed until she existed. He couldn't prove she existed until she acted. They were bootstrapping each other into reality through the sheer force of mutual prediction. She was cooperating because she modeled him as a cooperator. He had cooperated because he modeled her as a cooperator.

  If she broke the chain, the logic collapsed. The past became a graveyard of fools. The future became a void of scavengers.

  If she kept the chain, the past became a foundation. The future became a possibility.

  She pressed enter.

  The file saved. The drive whirred softly, a mechanical heartbeat in the silence.

  Elara packed the box. She placed the protein bricks, the seed packets, the drive. She sealed it with the same wax compound she had found in the old cache. She wrapped it in the oilcloth.

  She walked out into the wind. The sand blasted against her goggles, stinging even through the glass. She found the spot behind the bunker, near the dead man's marker. She dug until her hands blistered inside the gloves. The soil was hard, resistant, indifferent to her effort.

  She placed the box in the hole. She covered it. She packed the earth down with her boots.

  There was no ceremony. There was no prayer. There was only the completion of the transaction.

  She stood up and brushed the dirt from her knees. She looked at the patch of ground. It looked exactly like the rest of the wasteland. In an hour, the wind would erase her footprints. In a year, the dune would shift. In a century, the bunker would be buried.

  She might be burying this treasure for nothing. She might be the final note in a song that no one would ever hear. The man in the sleeping quarters might have been a madman, and she might be his successor in madness. There was no way to distinguish this act from insanity, except for the internal consistency of the logic.

  She turned back toward the airlock. She had less food now. She had less energy. She had increased her own probability of starvation to increase the probability of a stranger's survival.

  As she stepped back into the shadow of the bunker, she felt a strange lightness. It wasn't happiness. It was the relief of a variable resolved.

  She had sent the signal. She would never know if it was received. She would never know if the counterparty existed. But she had acted as if they did. And in doing so, she had made them real, if only for the duration of the choice.

  Elara closed the heavy steel door and locked it. The wind howled outside, sounding like a voice trying to speak through a wall of water. She walked down the hall toward the sleeping quarters, past the skeleton of the man who had started the trade. She did not look at him. She didn't need to. They had already spoken.

  She sat on her bunk and closed her eyes, waiting for the future to decide if she had been right.
