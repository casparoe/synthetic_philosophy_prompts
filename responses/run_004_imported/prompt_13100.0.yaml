      *   *Check:* Did Theo handle Accidental Intrinsics correctly? Kripke doesn't say much on this. Plantinga or Stalnaker might be better models. The standard move is "indexing properties." Lewis's rebuttal is that this makes intrinsics extrinsic. Theo needs to argue that "having-at-a-world" preserves the intuition of intrinsicality better than "counterpart similarity."
