answer: |-
  **Setting:** *A university philosophy department lounge, late evening. The whiteboard is still covered in formalized modal logic from a graduate seminar. Two doctoral students, **Cara** (a defender of Lewisian Counterpart Theory) and **Theo** (a defender of Transworld Identity in the Kripke-Plantinga tradition), are finishing their coffee.*

  **Theo:** I've been reviewing your draft on *de re* modality, Cara. The formalism is clean, but I can't shake the feeling that you're solving a metaphysical problem by changing the subject. Let's go back to Humphrey.

  **Cara:** I was wondering when you'd bring him up. Humphrey is the mascot of the anti-Lewisian, I know.

  **Theo:** It's not just a slogan. When I say, "Humphrey could have won the election," I am making a claim about *Humphrey*. I care about Humphrey. If your theory is correct, then the sentence is true only if there is a distinct individual, a counterpart, in another concrete world who wins. But that counterpart isn't Humphrey. Humphrey is here, he lost, and he's dead. Why should I care if some qualitative duplicate of him wins in a disconnected universe? As Kripke put it, it seems irrelevant to Humphrey.

  **Cara:** I grant you that if we treat "could have" as quantifying over worlds containing *numerically identical* individuals, my theory fails. But that's precisely what I deny. On Lewis's view, *de re* modal claims are not about tracking a transworld strand of identity; they are about representation. When you say "Humphrey could have won," you are invoking a counterpart relation. You are saying there is a world where someone sufficiently similar to Humphrey in relevant respects wins.

  **Theo:** That sounds like a semantic patch to save the ontology. You're admitting that the truth conditions don't match the pre-theoretic intuition. We mean *identity*, you give us *similarity*.

  **Cara:** It's not a patch; it's a recognition of context-sensitivity. Lewis is explicit about this. The counterpart relation is not a single, rigid metaphysical glue. It shifts depending on what we are emphasizing in the conversation. If we are talking about biological origin, the counterpart must share Humphrey's gametes. If we are talking about political potential, the counterpart must share his ambitions and skills. The reason it feels like "identity" to you is that in most ordinary contexts, the counterpart relation *coincides* with what we intuitively track as identity. But when we press the metaphysics, we see that *de re* modality is inherently vague and context-dependent.

  **Theo:** But that vagueness is exactly the problem. If the truth of "Humphrey could have won" depends on which counterpart relation is salient in the conversation, then modal properties aren't features of Humphrey; they're features of our conversational context. That makes modality mind-dependent in a way that feels ad hoc. You're saving the world-bound ontology by making the reference relation slippery.

  **Cara:** It's not slippery; it's pragmatic. Consider gradable adjectives. If I say "John is tall," the truth depends on a contextually selected comparison class. Is John tall for a jockey? For a basketball player? We don't accuse the adjective "tall" of being ad hoc because it relies on context. *De re* modal claims work the same way. The counterpart relation is an objective similarity relation, but *which* similarities matter is fixed by context. This isn't a cost; it's an explanation of why modal discourse is flexible. I'd rather accept context-sensitive truth conditions than posit a magical transworld identity that survives the loss of all qualitative continuity.

  **Theo:** I see. You trade the metaphysics of the object for the semantics of the predicate. But let's turn the table. You think your ontology of world-bound individuals saves you from contradiction, but I think it forces you into a dilemma regarding properties. Let's talk about Accidental Intrinsics.

  **Cara:** Go ahead. Lewis thought this was his strongest argument against you.

  **Theo:** Suppose Humphrey exists in two worlds, $W_1$ and $W_2$. In $W_1$, he is sitting. In $W_2$, he is standing. If Humphrey is strictly identical across these worlds—if it is literally one and the same object—then that one object has the property of *sitting* and the property of *standing*. These are incompatible intrinsic properties. One object cannot be both sitting and standing.

  **Cara:** Precisely. That's why individuals are world-bound. Humphrey-at-$W_1$ is distinct from Humphrey-at-$W_2$. No contradiction arises because no single individual bears both properties.

  **Theo:** But you haven't solved the problem for *my* view yet, and this is where the cost comes in. To defend transworld identity, I don't say Humphrey is sitting *simpliciter* and standing *simpliciter*. I say Humphrey is sitting-at-$W_1$ and standing-at-$W_2$. Properties are instantiated relative to worlds.

  **Cara:** Aha. There it is. "Sitting-at-$W_1$." Do you see what you've done? You've taken an intrinsic property—shape, posture, something that belongs to the object itself—and you've turned it into a relation. "Sitting" is no longer a monadic property of Humphrey; it's a relation between Humphrey and a world. But intrinsics aren't supposed to be relations. If you have to relativize intrinsics to worlds to avoid contradiction, you've conceded that objects don't really have shapes or postures in themselves. They only have them relative to a world index. You've saved identity by sacrificing the intrinsic nature of properties.

  **Theo:** That's the standard Lewisian charge, but it relies on a misunderstanding of indexing. When I say "sitting-at-$W_1$," I am not adding a relational component to the property *sitting*. I am specifying the *mode of instantiation*. The property itself remains intrinsic. Humphrey has the intrinsic property of *sitting*, but he has it only in the context of $W_1$. The world isn't a relatum that changes the property; it's the domain of instantiation.

  **Cara:** That sounds like a distinction without a difference. If Humphrey cannot have the property without the world-index, then the property is functionally a relation. Lewis's point is stark: If you say one object has shape $S$ at $W_1$ and shape $S^*$ at $W_2$, and $S$ is incompatible with $S^*$, you are either saying the object has contradictory properties (which is impossible) or you are saying "having shape $S$" is really "bearing the having-relation to $S$ at $W_1$." In the latter case, you have relationalized the intrinsic. So, look at the mirror image of our debate. I accused you of making reference context-sensitive and slippery. You are accusing me of making properties relational.

  **Theo:** I am.

  **Cara:** But here is the trade-off. You claim my context-sensitive counterpart relation is a cost. I claim your world-indexed instantiation is a cost. Why is your cost lower?

  **Theo:** Because preserving numerical identity preserves the *subject* of modal concern. When I say "I could have been a doctor," I mean *me*. If you are right, you mean "Someone like me could have been a doctor." You preserve the intrinsicality of properties by fragmenting the object. I preserve the unity of the object by relativizing instantiation. I judge that losing the strict intrinsicality of properties is less damaging than losing the strict identity of the self. If I lose identity, I lose moral responsibility across worlds, I lose the basis of haecceity, and I lose the ability to say that *I* am the subject of my possibilities.

  **Cara:** And I judge that losing the non-relational nature of intrinsics is less damaging than positing a transworld identity that is unanalyzable and primitive. Your "mode of instantiation" looks suspiciously like a primitive brute fact. Why does Humphrey instantiate *sitting* at $W_1$? There's no explanation other than "that's just how it is at $W_1$." On my view, the explanation is clear: There is a world-bound individual who is sitting, and he resembles Humphrey. The cost I pay is that "Humphrey" is a less rigid designator than you like. The cost you pay is that "sitting" is less intrinsic than you like.

  **Theo:** So we are at a stalemate of theoretical costs.

  **Cara:** Essentially. But let's state the preference plainly. I am willing to live with the fact that *de re* modal claims are context-sensitive and that Humphrey is not literally present in other worlds. I accept this because it preserves a naturalistic, extensional ontology where individuals are located in spacetime and properties are non-relational monads. I won't relativize intrinsics to save a mystical transworld identity.

  **Theo:** And I am willing to live with the fact that intrinsic properties must be understood as instantiated relative to worlds. I accept this because it preserves the intuition that when we talk about possibility, we are talking about *the very same things* having different properties. I won't fragment the subject into world-bound counterparts just to keep properties purely monadic. I'd rather complicate instantiation than lose the self.

  **Cara:** Then we agree on the structure of the disagreement. You think relationalizing instantiation is cheaper than contextualizing identity.

  **Theo:** And you think fragmenting identity is cheaper than relationalizing instantiation.

  **Cara:** Cheers to that.

  **Theo:** Cheers. Though I still think Humphrey would agree with me.

  **Cara:** *Which* Humphrey?

  **Theo:** Touché.
