          *   Tone: Intellectual, analytical, slightly conversational (matching the prompt's "rabbit hole" vibe).

  2.  **Deconstruct Bentham's Core Principles:**
      *   *The Greatest Happiness Principle:* Actions are right if they promote the greatest happiness for the greatest number.
