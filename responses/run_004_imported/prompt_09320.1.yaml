prompt: |-
  Quick bit of context: at my company we started running a poll to settle which one big tech-debt project our team of about a dozen engineers tackles each quarter, since arguing about it live in meetings kept going nowhere. I threw together a little internal tool for it that does ranked-choice / instant-runoff voting: everyone ranks all six or so candidate projects from favorite to least favorite, and the tool eliminates whoever's got the fewest first-place votes each round and redistributes those ballots to next choices until one project is left standing. I specifically picked ranked-choice because I'd read it's supposed to be way harder to game than just going with whoever gets the most first-place votes, plus some actual cities use it for real elections so it seemed like the legit choice.

  Except last quarter one of our senior engineers, who's way more into game theory than the rest of us, told me afterwards that he'd deliberately ranked his actual second-favorite project dead last (below a couple things he genuinely didn't care about) instead of putting it second where it "honestly" belonged. According to him, doing that changed the order in which stuff got eliminated in the early rounds, which snowballed into his real favorite winning instead of loosing to his second choice in the final head-to-head. He wasn't even sneaky about it either, he pulled up the spreadsheet afterward and walked me through exactly why it worked. I mentioned this to a couple friends over drinks and we couldn't agree on whether it's fixable.

  Now I'm trying to figure out if this is a "me" problem, like I implemented IRV wrong or just need a smarter tiebreak rule somewhere, or if its something deeper. Would switching to a Condorcet method, or Borda count, or plain approval voting have closed off this loophole, or is there just no way to design a poll like this thats fully immune to someone voting "dishonestly" once they understand how the counting works? Kind of want to actually understand why, one way or the other, before I roll v2 of this out company-wide instead of just cargo-culting whichever method sounds fanciest on Wikipedia.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A team of ~12 engineers uses an internal tool to vote on tech-debt projects (6 candidates) each quarter.
      *   **Method:** Instant-Runoff Voting (IRV) / Ranked-Choice Voting (RCV).
      *   **Issue:** A senior engineer (game theory savvy) strategically voted "dishonestly" (buried his 2nd favorite to last place) to manipulate the elimination order, ensuring his 1st favorite won instead of losing to the 2nd favorite in the final round.
      *   **Question:** Is this an implementation error, or is it inherent to the voting system? Would switching to Condorcet, Borda, or Approval voting fix it? Is there *any* system immune to strategic voting?
      *   **Goal:** Understand the theoretical underpinnings before rolling out v2.

  2.  **Identify the Core Theoretical Concept:**
      *   The user is describing **strategic voting** (or tactical voting).
      *   The specific scenario described (burying a strong competitor to help a favorite win) is a classic vulnerability of IRV.
      *   The fundamental theorem relevant here is **Gibbard's Theorem** (and the related **Arrow's Impossibility Theorem**).

  3.  **Evaluate the Voting Methods:**

      *   **Instant-Runoff Voting (IRV):**
          *   *Pros:* Ensures a majority winner (eventually), avoids "spoiler effect" compared to Plurality.
          *   *Cons:* Vulnerable to "compromising" (voting for a less preferred but more viable candidate) and "burying" (ranking a strong competitor last). It fails the *monotonicity criterion* (ranking a candidate higher can sometimes hurt them) and is susceptible to strategic manipulation.
          *   *Verdict:* The engineer's behavior is a known feature, not a bug of IRV.

      *   **Condorcet Methods:**
          *   *Mechanism:* Picks the candidate who beats everyone else in head-to-head matchups.
          *   *Pros:* Often reflects the "will of the majority" better than IRV.
          *   *Cons:* Can result in cycles (A beats B, B beats C, C beats A). Requires a tiebreaker (Smith Set, etc.). Still vulnerable to strategic voting (though often harder to calculate).
          *   *Verdict:* Better for finding a consensus candidate, but *not* immune to strategy.

      *   **Borda Count:**
          *   *Mechanism:* Points assigned based on rank (1st = N points, 2nd = N-1, etc.).
          *   *Pros:* Simple.
          *   *Cons:* Highly vulnerable to "burying." If I know Candidate X is my favorite's main rival, I rank X last to deny them points.
          *   *Verdict:* Probably *worse* for this specific type of manipulation than IRV.

      *   **Approval Voting:**
          *   *Mechanism:* Vote for as many candidates as you approve.
          *   *Pros:* Simple, encourages honesty for "good" vs "bad" candidates.
          *   *Cons:* Strategic threshold issue (do I approve my 2nd choice? If too many people do, my 1st choice loses). Still has strategy, but often feels more intuitive.
          *   *Verdict:* A strong contender for simplicity, but not theoretically immune.

      *   **Score/Range Voting:**
          *   *Mechanism:* Rate candidates 0-5 or 0-10.
          *   *Pros:* Captures intensity of preference.
          *   *Cons:* Strategy involves "max/mining" (giving favorites 10 and rivals 0).
          *   *Verdict:* Similar to Approval but with more granularity.

  4.  **Address the "Immunity" Question (The Big Theorem):**
      *   **Gibbard's Theorem:** Any deterministic voting system with at least 3 outcomes is either dictatorial or vulnerable to strategic voting.
      *   **Implication:** There is *no* perfect system. The user cannot "fix" this completely.
      *   **Nuance:** While you can't eliminate strategy, you can make it *harder* to calculate or less impactful.

  5.  **Formulate the Advice:**
      *   **Validate:** Confirm the engineer was right. This is a known property of IRV. It's not an implementation bug.
      *   **Explain Why:** Briefly explain the "burying" strategy in IRV.
      *   **The Hard Truth:** Introduce Gibbard's Theorem. No system is strategy-proof.
      *   **Compare Alternatives:**
          *   *Condorcet:* Good for consensus, harder to game than IRV sometimes, but complex.
          *   *Borda:* Warn against it (easy to game).
          *   *Approval/Score:* Recommend these for simplicity and reducing the cognitive load of strategy.
      *   **Social/Process Solution:** Since math can't solve it completely, suggest process changes (e.g., nomination criteria, discussion before voting, random selection among top contenders).
      *   **Recommendation:** For a team of 12, **Approval Voting** or **Score Voting** is usually best. It reduces the "chess match" aspect.

  6.  **Refine the Tone:**
      *   Keep it conversational but authoritative.
      *   Avoid overly dense jargon (explain terms like "monotonicity" or "Condorcet winner" simply).
      *   Acknowledge the frustration (it feels like cheating, but it's rational behavior within the system).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* You didn't mess up. The engineer is right.
      *   *Theory:* Gibbard's Theorem is the key takeaway.
      *   *IRV Analysis:* Explain why IRV failed here (non-monotonicity/burying).
      *   *Alternatives:*
          *   Condorcet: Better consensus, still gameable.
          *   Borda: Don't do it (too easy to bury).
          *   Approval/Score: Best practical choice for teams.
      *   *Process:* Voting is only part of the decision.
      *   *Conclusion:* Pick Approval/Score for v2.

  8.  **Final Review against User Query:**
      *   Did I answer if it's a "me" problem? Yes (No).
      *   Did I address Condorcet/Borda/Approval? Yes.
      *   Did I answer if there's a fully immune system? Yes (No, Gibbard's).
      *   Is it helpful for v2 rollout? Yes.

  9.  **Final Polish:** Ensure the distinction between "honest voting" and "strategic voting" is clear. Emphasize that for 12 people, complexity is a bigger enemy than strategy. (Self-correction: Make sure to mention that for small groups, discussion often beats voting).

  10. (Produces final output based on these thoughts.)
answer: |-
  First off: **You didn't implement it wrong.** Your senior engineer isn't pulling a fast one; he just demonstrated a well-documented property of Instant-Runoff Voting (IRV).

  You are running into a fundamental wall of social choice theory. Here is the breakdown of why this happened, whether other systems fix it, and what you should actually do for v2.

  ### 1. The Hard Truth: Gibbard's Theorem
  You asked if there is a way to design a poll fully immune to someone voting "dishonestly." The mathematical answer is **no.**

  This is covered by **Gibbard's Theorem** (1973). It states that for any voting system with three or more possible outcomes, one of three things must be true:
  1.  The system is dictatorial (one person decides).
  2.  The system restricts the options to only two choices.
  3.  **The system is vulnerable to strategic voting.**

  Since you have ~6 projects and ~12 voters, you are in category #3. There is no "perfect" voting system. Every method creates incentives for voters to misrepresent their preferences if they think they can game the outcome. Your engineer didn't break the rules; he optimized for the rules you wrote.

  ### 2. Why IRV Failed You Here
  IRV is great at solving the "spoiler effect" (where two similar candidates split the vote and let a hated candidate win), but it has two major weaknesses that your engineer exploited:

  *   **Non-Monotonicity:** In IRV, ranking a candidate *higher* can sometimes cause them to lose, and ranking them *lower* can cause them to win. This is counter-intuitive and invites gaming.
  *   **The "Burying" Strategy:** This is exactly what your engineer did. In IRV, your goal isn't just to make your favorite win; it's to ensure your favorite's strongest competitor gets eliminated before the final round. By ranking his #2 choice last, he denied that project early-round points, ensuring it got eliminated before it could knock out his #1 choice in a head-to-head.

  So, switching to IRV wasn't "wrong," but it isn't the strategy-proof silver bullet you hoped for.

  ### 3. Evaluating the Alternatives
  You mentioned Condorcet, Borda, and Approval. Here is how they stack up regarding strategic voting and team use.

  #### Condorcet Methods
  *   **How it works:** You compare every candidate head-to-head. If one candidate beats everyone else in pairwise matchups, they win.
  *   **Strategy Resistance:** **Moderate.** It is generally harder to game than IRV because it focuses on broad consensus. However, it is not immune. Voters can still try to manipulate the "Smith Set" (the top tier of candidates) by burying strong rivals.
  *   **Complexity:** High. Explaining to the team why "Project A won even though Project B had more first-place votes" requires a whiteboard session.
  *   **Verdict:** Better for finding a consensus candidate, but overkill for a team of 12.

  #### Borda Count
  *   **How it works:** 1st place gets 6 points, 2nd gets 5, etc. Highest total wins.
  *   **Strategy Resistance:** **Terrible.** This is the *easiest* system to game. If I know Project X is my favorite's main rival, I simply rank Project X last, regardless of how I actually feel about it. This maximizes the point differential.
  *   **Verdict:** **Do not use this.** It incentivizes everyone to rank their top choice #1 and their biggest threat #6, turning the poll into a weaponized dislike contest.

  #### Approval Voting
  *   **How it works:** You vote "Yes" or "No" for every project. You can approve of as many as you want. Most approvals wins.
  *   **Strategy Resistance:** **Good.** The only strategy is deciding where to draw your "approval line." Do I approve my 2nd choice? If I do, I might help them beat my 1st choice. If I don't, I might let my 3rd choice win. However, this is much cognitively simpler than ranking 6 items strategically.
  *   **Verdict:** **Strong contender.** It's very hard to explain *how* to game Approval voting to a layperson, which paradoxically makes people vote more honestly.

  #### Score (Range) Voting
  *   **How it works:** Rate every project 0–5 or 0–10. Highest average wins.
  *   **Strategy Resistance:** **Moderate/Good.** The optimal strategy is usually "min-maxing" (give your favorite a 10, give everyone else a 0). However, in practice, people tend to vote honestly because it feels weird to give a "fine" project a 0.
  *   **Verdict:** **Best for engineering teams.** It captures *intensity* of preference. (e.g., "I mildly prefer A, but I *really* hate B").

  ### 4. Recommendation for V2
  For a team of 12 engineers, **complexity is your enemy, not just strategy.** You want a system that is transparent, hard to accidentally game, and easy to tally.

  **I recommend switching to Score Voting (0–5 scale).**
  *   **Why:** It captures nuance better than ranking. An engineer can signal "This is critical" (5) vs "This is fine" (3).
  *   **Strategy:** While min-maxing is possible, it's socially obvious. If someone gives five projects a '0' and one project a '5', the team will call them out in the retrospective. It makes the strategy socially costly.
  *   **Implementation:** It's easier to build than IRV (no elimination rounds) and easier to explain than Condorcet.

  **Alternatively: Approval Voting.**
  *   **Why:** It forces a binary "Is this worth doing this quarter?" decision. It prevents the "ranking chores" fatigue.
  *   **Strategy:** Very low barrier to entry.

  ### 5. The "Process" Fix
  Since math can't solve this completely (thanks, Gibbard), you should layer a process fix on top of the voting:

  1.  **Nomination Vetting:** Ensure the 6 candidates are actually viable. If two projects are nearly identical, merge them before the vote to reduce the "split vote" vector.
  2.  **Public Ballots:** For internal team decisions, consider making the votes visible (or at least the totals per round). In a team of 12, social pressure is a stronger deterrent against gaming than any algorithm. If the senior engineer pulls the "burying" trick again on Score Voting, the zeros will speak for themselves.
  3.  **The "Veto" Round:** Before voting on what *to* do, vote on what *not* to do. Eliminate the bottom 2 projects via a simple "No" vote, then rank the remaining 4.

  ### Summary
  *   **Is it a "me" problem?** No. IRV is inherently vulnerable to the strategy your engineer used.
  *   **Is there a perfect system?** No. Gibbard's Theorem says strategic voting is unavoidable.
  *   **What should you use?** Switch to **Score Voting (0–5)** or **Approval Voting**. They are simpler, capture better data, and make strategic manipulation more obvious/socially costly without requiring a PhD in game theory to count the ballots.
