answer: |-
  This is a fantastic question, and it cuts right to the heart of why Solomonoff Induction is treated as a **normative ideal** (how a perfect reasoner *should* think) rather than a **practical tool** (what scientists can actually *do*).

  If scientists could just calculate Kolmogorov Complexity ($K(x)$) to settle debates, they absolutely would. The reason they don't is that there are three massive hurdles preventing it. The first one is the dealbreaker.

  ### 1. Kolmogorov Complexity is Uncomputable
  This is the big one. You cannot calculate $K(x)$.

  Kolmogorov complexity is defined as the length of the *shortest* program that outputs a string $x$ and halts. To find the true $K(x)$, you would need to check every possible program shorter than your current candidate to see if it produces $x$.

  But here's the catch: **You can't know if a program will halt.** This is the Halting Problem. A program might run for a billion years and then output $x$, or it might run forever. Because there is no general algorithm to decide whether an arbitrary program halts, there is no algorithm to calculate $K(x)$.

  So, when scientists argue about String Theory vs. Loop Quantum Gravity, they can't just "run the calculation" because the calculation is mathematically impossible to perform. We can only ever estimate upper bounds (by finding *a* program that works), never the true minimum.

  ### 2. The "Constant" Problem (Language Dependence)
  You mentioned that $K(x)$ is supposed to be "language-independent." This is a common misunderstanding of the **Invariance Theorem**.

  The theorem states that the Kolmogorov complexity of a string relative to two different Universal Turing Machines (UTMs), $U_1$ and $U_2$, differs by at most a constant $c$:
  $$|K_{U_1}(x) - K_{U_2}(x)| \leq c$$

  People often interpret this to mean "the choice of language doesn't matter." But that constant $c$ depends on the UTMs, *not on the string $x$*.
  *   **Asymptotically:** If $x$ is infinitely long, $c$ becomes negligible.
  *   **In Practice:** Scientific theories are finite strings. If the constant $c$ is large enough, it can completely flip the ranking of two theories.

  I could design a UTM that has "String Theory" hard-coded into its architecture as a single primitive instruction (length 1), while "Loop Quantum Gravity" requires a massive subroutine. In that UTM, String Theory is simpler. You could design another UTM that does the reverse. Since we don't have a "God's Eye" UTM to use as the standard, the measure isn't truly objective for finite strings.

  ### 3. Encoding Ambiguity
  Even if we could compute it and agreed on a UTM, how do you turn a physical theory into a bitstring?

  Is the complexity just the Lagrangian? Do you have to include the mathematical background required to understand the Lagrangian (e.g., do you count the bits needed to define calculus, manifolds, and Hilbert spaces)? Do you include the mapping rules that connect the math to experimental apparatus?

  *   **Theory A** might have a simple equation but require complex, ad-hoc boundary conditions to fit the data.
  *   **Theory B** might have a complex equation but fit the data naturally.

  Solomonoff Induction weighs hypotheses by $2^{-K(h)} \times P(data|h)$. You need both the complexity of the hypothesis *and* the likelihood of the data given the hypothesis. Calculating the likelihood often requires integrating over infinite parameter spaces, which is again, computationally intractable for high-energy physics.

  ### So why do we still talk about it?
  In your seminar, you're likely discussing Solomonoff Induction as a **philosophical justification** for Occam's Razor, not a calculator.

  It tells us *why* simplicity is truth-conducive (because there are fewer simple programs than complex ones, so a simple fit is less likely to be noise). But in practice, scientists use proxies like **Minimum Description Length (MDL)** or **Bayesian Model Selection**. These are computable approximations that try to capture the spirit of Solomonoff Induction without hitting the uncomputability wall.

  ### Summary
  Scientists don't calculate Kolmogorov complexity to settle debates because:
  1.  **It's impossible:** $K(x)$ is uncomputable (Halting Problem).
  2.  **It's arbitrary:** For finite strings, the choice of description language changes the winner.
  3.  **It's ambiguous:** There is no standard way to encode a physical theory into bits.

  It's a beautiful theoretical ceiling on rationality, but we're stuck on the ground floor using approximations. That's why the debates continue!
