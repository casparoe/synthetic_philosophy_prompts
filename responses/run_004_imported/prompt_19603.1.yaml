answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two grad students, Elara (Bohmian) and Marcus (Everettian), are decompressing after a particularly intense Philosophy of Physics seminar on Bell's Theorem.*

  **Elara:** I need to get this off my chest. The professor kept circling back to "Local Causality" as if it's a binary switch. You either have it or you don't. But sitting there, listening to the standard line... I realized I'm the only one in the room willing to admit my theory actually breaks it.

  **Marcus:** You mean Bohmian Mechanics? Yeah, the guiding equation is explicitly nonlocal. The velocity of particle *A* depends on the instantaneous position of particle *B*, regardless of distance. You wear that badge proudly?

  **Elara:** I wear it honestly. If nature is nonlocal, I'd rather have a theory that says "Here is the nonlocality, right here in the equation" than one that hides it behind a collapse postulate or semantic tricks. But that's why I'm looking at you sideways, Marcus. You Everettians walk around claiming you save locality. You say, "No collapse, just unitary evolution, therefore local." But I don't buy it.

  **Marcus:** Why not? The Schrödinger equation is a local differential equation. The Hamiltonian is a sum of local terms. There are no action-at-a-distance terms in the dynamics.

  **Elara:** That's the dynamics. I'm talking about the ontology. Where does your wavefunction live, Marcus?

  **Marcus:** In Hilbert space, obviously. Or, if you want to be more concrete, configuration space.

  **Elara:** Exactly. Configuration space. For a two-particle entangled system, that's a six-dimensional space. For the universe, it's $3N$ dimensions. If the wavefunction is a real physical object—which it has to be for you, since there's nothing else—then you have a physical field evolving in a high-dimensional space, not in 3D space. How is a field in $3N$ space "local" with respect to the 3D world we actually measure?

  **Marcus:** That's a category error, Elara. You're assuming 3D space is the fundamental arena. I'm not. If the fundamental reality is the wavefunction on configuration space, then "locality" just means the dynamics couple nearby points *in that space*. And they do. The Hamiltonian involves derivatives with respect to specific coordinates. It doesn't mix them arbitrarily.

  **Elara:** But the *correlations* we see in Bell experiments are in 3D space. Alice and Bob are in different labs. In Bohm, I say the particle in Alice's lab instantly feels the configuration of Bob's particle. It's spooky, but it's clear. In your view, there's just one big wave. When Alice measures, the wave branches. But for the branches to correspond to "Alice sees Up" and "Bob sees Down" locally, the wavefunction has to factorize in a very specific way.

  **Marcus:** And it does. That's the point of decoherence.

  **Elara:** Don't just say "decoherence" like it's a magic wand. Decoherence explains why interference terms vanish from the reduced density matrix. It doesn't explain why *outcomes* become definite. Bell's theorem assumes that measurements have single, definite outcomes. That's a premise of the derivation. You evade Bell's conclusion by denying the premise. You're not saving locality; you're changing the definition of an "event."

  **Marcus:** I'm not changing the definition; I'm correcting a false assumption. Bell assumes "Local Causality" implies that a measurement here has one result, and that result is independent of a spacelike separation there. But if the state of the world includes *both* outcomes, realized in orthogonal branches, then there is no single outcome that needs to be influenced nonlocally.

  **Elara:** So you're saying nonlocality is an artifact of the "single world" illusion?

  **Marcus:** Precisely. Think about the EPR pair. In Bohm, the spin measurement on the left forces the particle on the right to have a definite spin instantly. In MWI, the measurement on the left entangles the left observer with the left particle. The global state is a superposition of (Left-Up/Right-Down) and (Left-Down/Right-Up). Nothing travels from Left to Right. The correlation was established at the source. The "outcome" is just which branch the observer finds themselves in.

  **Elara:** But how does the observer on the right know which branch they're in without communicating with the left? If I'm Right-Observer, and I measure Down, I know instantly that Left-Observer saw Up. In your view, there's a version of me who saw Down and a version of Left-Observer who saw Down too, right?

  **Marcus:** No. That's the mistake. The branching is global, but it propagates. When Alice measures, she splits. When Bob measures, he splits. But they only become correlated when the light cones overlap and the records are compared. Until then, Alice's branch is locally well-defined, and Bob's branch is locally well-defined. The correlation is in the *structure* of the universal wavefunction, not in a signal sent between them.

  **Elara:** That sounds like you're pushing the nonlocality into the structure of the wavefunction itself. You said earlier the wavefunction lives in configuration space. If the wavefunction is the only reality, and it's a single object spanning the whole universe, then the state of "here" is not separable from the state of "there." That's the definition of non-separability. Bell showed that any theory that reproduces QM predictions must violate either Parameter Independence or Outcome Independence. Bohm violates Parameter Independence (ontologically). You seem to be violating Outcome Independence by saying all outcomes happen.

  **Marcus:** I prefer to say I violate "Uniqueness of Outcomes." And look, Elara, your theory has a problem mine doesn't. You have a preferred frame.

  **Elara:** *Sighs.* Yes. To make the nonlocal guiding equation compatible with relativity, I need a preferred foliation of spacetime. A hidden preferred frame. It's empirically inaccessible because of quantum equilibrium, so we can't use it to signal, but it's there ontologically. I admit it. It's a cost.

  **Marcus:** It's a huge cost! You're positing a structure that contradicts the spirit of Special Relativity. I don't need that. My dynamics are fully Lorentz invariant. The wavefunction evolves locally. The appearance of nonlocality only arises if you insist on projecting the high-dimensional reality onto a single 3D history.

  **Elara:** But is it really Lorentz invariant if the *branching* structure requires a preferred basis? You keep waving at decoherence. Decoherence depends on the interaction Hamiltonian. It picks out a basis—usually position or pointer states. But that basis is selected relative to an environment. Who defines the environment? Where does the cut happen? If the basis isn't fundamental, then the "worlds" aren't fundamental. If the worlds aren't fundamental, then what exactly is local?

  **Marcus:** The worlds aren't fundamental, the wavefunction is. The "worlds" are emergent structures, like waves in the ocean. You don't ask "where exactly does the wave begin?" in a way that undermines fluid dynamics. Decoherence is a dynamical process that suppresses interference between components of the wavefunction in the position basis. This happens locally. The environment interacts with the system at point *x*. It doesn't need to know about point *y*.

  **Elara:** But the suppression of interference is never absolute. It's only for all practical purposes (FAPP). In Bohm, the empty wave is *actually* empty of particles. It can't affect the particle trajectory anymore (usually). In MWI, the other branches are still there. They are still part of the same physical field. If they are part of the same field, and that field is in configuration space, then the "distance" between the branch where I see Up and the branch where I see Down is zero in configuration space. They are touching.

  **Marcus:** They are orthogonal in Hilbert space.

  **Elara:** Orthogonality is a mathematical relation. I'm asking about physical influence. If the universal wavefunction is one thing, then everything is connected to everything. That's holism. Is holism locality?

  **Marcus:** Holism isn't nonlocality. Nonlocality implies causal influence outside the light cone. I have no causal influence outside the light cone. If I measure my electron, I cannot change the reduced density matrix of your electron. That's the No-Signaling theorem, and it holds for me unitarily. You, on the other hand, have particles jumping around based on distant configurations.

  **Elara:** But my particles jump in a way that is empirically indistinguishable from standard QM. I respect signal locality. The nonlocality is hidden. Your "locality" is visible, but only because you've diluted the concept of an "event." Here's my real worry, Marcus. Bell's theorem is about *causes*. If I see Up, what caused it? In Bohm, it was the initial position plus the distant setting. In MWI, it was... nothing? It just happens in this branch?

  **Marcus:** It was the local interaction between the observer and the system.

  **Elara:** But why *this* branch? Why am I *here* in the wavefunction experiencing Up rather than Down?

  **Marcus:** There is no "why." There is a version of you experiencing Down. You are asking a question that presupposes a unique "you" that travels through the branching. There isn't one.

  **Elara:** And that's where I get off. It feels like you're solving the nonlocality problem by dissolving the subject. If there's no definite outcome for *me*, then Bell's theorem doesn't apply to *my* experience, it applies to the multiverse. But I only experience one world. To explain *my* experience, you have to add a probability measure over the branches. And how do you derive the Born Rule without smuggling in single-outcome assumptions?

  **Marcus:** Decision theory. Self-locating uncertainty. We've been over this.

  **Elara:** And I remain unconvinced. It feels like you're saying, "Locality is saved because nothing definite ever happens anywhere." I'll take my explicit nonlocality. It's honest. It says: "Particles exist, they have trajectories, and the universe is deeply interconnected in a way that transcends spacetime distance." It respects the realism of the measurement outcome.

  **Marcus:** And I'll take my explicit unitarity. It says: "The laws of physics are linear and local, and the weirdness comes from assuming the universe is smaller than it actually is." You think I'm dissolving the subject; I think you're inflating the ontology with hidden variables and preferred frames just to save the intuition that there's only one of you.

  **Elara:** Maybe. But if Bell taught us anything, it's that we can't have it all. We can't have Locality, Realism, and Completeness. You drop Realism about outcomes. I drop Locality.

  **Marcus:** I'd argue I drop "Outcome Uniqueness," which isn't the same as Realism. I'm a realist about the wavefunction.

  **Elara:** A wavefunction in 3N dimensions.

  **Marcus:** A wavefunction in 3N dimensions.

  **Elara:** *Takes a sip of cold coffee.* So, we agree the textbook "No Local Hidden Variables" is too simplistic.

  **Marcus:** Definitely. It should be "No Local Theory with Single Definite Outcomes."

  **Elara:** And since I keep the outcomes, I keep the nonlocality.

  **Marcus:** And since I keep the local dynamics, I keep the multiplicity.

  **Elara:** It seems the price of locality is a lot more worlds than I'm willing to pay for.

  **Marcus:** And the price of a single world is a lot more action-at-a-distance than I'm willing to accept.

  **Elara:** *Smiles.* Well, at least we're both violating something.

  **Marcus:** Cheers to that.
