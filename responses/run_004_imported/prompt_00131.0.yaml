answer: |-
  The observation deck was cold, glassed on three sides, overlooking the rehabilitation garden where Elena sat. She was motionless, staring at a patch of poppies. She had been there for twenty minutes. She hadn't blinked much.

  Aris Thorne leaned against the console, arms crossed over a chest that seemed permanently braced against impact. Mara Kovic stood by the window, her reflection ghosting over the green and scarlet below.

  "She's cataloging," Aris said. His voice was flat, the tone of a man reading a meter. "Look at the micro-saccades. She's calibrating the new input against the database. It's integration, Mara. Not revelation."

  "Integration implies fitting a piece into a puzzle that already exists," Mara said, not turning. "But the puzzle box didn't contain this piece. You gave her the dimensions, the chemical composition of the pigment, the reflectance profiles, the neural firing rates of the V4 cortex. You gave her the map of the territory. But you didn't give her the terrain."

  "We gave her everything that *exists*," Aris corrected. "If there were more to the terrain than the map describes, physics would be incomplete. Are you suggesting there's a non-physical property of light that our spectrometers miss?"

  "I'm suggesting there's a property of *experience* that spectrometers cannot, in principle, register. She knows everything about red *from the outside*. Now she knows what red is *from the inside*. That is a factual distinction, Aris. Not just a perspectival one."

  Aris pushed off the console and walked to the small table where a pot of tea had gone cold. He poured a cup, the sound sharp in the silence. "This is the old intuition pump, dressed up. You're conflating *knowing-that* with *knowing-how*. Before today, Elena knew that red light stimulates long-wave cones. Now, she knows *how* to recognize red when she sees it. She knows *how* to imagine it. That is an acquisition of ability, not knowledge. Lewis settled this."

  "Lewis settled it for behaviorists," Mara said, finally turning. Her eyes were tired. "But watch her. She isn't learning a motor skill. She isn't learning to ride a bike. She is undergoing a cognitive collision. If I tell you exactly how to swim—the buoyancy, the stroke mechanics, the fluid dynamics—you still don't know what water feels like against your skin until you jump in. Is the sensation of cold water just 'knowing how' to be cold?"

  "The sensation *is* the physical process of thermoreceptors firing," Aris said, taking a sip. "When you say 'what it feels like,' you're referring to the state of the system monitoring those receptors. Elena already knew that state existed. She knew the functional role of that state. What she lacks is the *demonstrative concept*. She couldn't think, *'This is what red looks like,'* because 'this' required a perceptual presence. Now she has the presence. She has a new mode of access to an old fact. The fact hasn't changed. The file format has."

  Mara walked away from the window and sat in the chair opposite him. She placed her hands flat on the table. "The file format metaphor is seductive because it suggests the content is identical. But if I have a text file describing the taste of honey, and then I taste honey, have I just opened the file in a different reader? No. I have encountered a quality that the text file did not contain. The Phenomenal Concept Strategy tries to explain this away by saying the concept is unique, not the referent. But the concept is unique *because* the referent is unique."

  "You're begging the question," Aris said, leaning in. "You assume the referent—the qualia—is distinct from the physical state. I'm saying the referent *is* the physical state. The concept is just the brain's way of pointing at itself. Elena's brain is now pointing at its own visual processing in a way it couldn't before. It's self-referential data. It feels new because the loop is closed, but nothing entered the system from the outside that wasn't already physically describable."

  "If nothing entered from the outside, why is she weeping?" Mara asked softly.

  Aris glanced through the glass. Elena had lifted a hand to her face.

  "Grief," Aris said quickly. "Or overwhelm. The cognitive load of integrating high-bandwidth sensory data after sensory deprivation is immense. It's a stress response."

  "It's mourning," Mara insisted. "She's mourning the twenty years she spent in the grayscale. If your physicalism is true, she lost nothing. She had all the facts. She knew the wavelength of the poppy. She knew the neurochemistry of her own awe. If facts are all there are, she was never deprived. She was just... uncalibrated."

  "She was deprived of the *experience*, yes. I concede that," Aris said. "But experience isn't knowledge. Knowledge is propositional. 'Red is 700 nanometers.' That is true regardless of whether she sees it. What she has now is acquaintance. Acquaintance isn't truth-apt. You can't say acquaintance is true or false. So it can't be knowledge in the strict sense."

  "Ah," Mara said, a sharp note entering her voice. "So you retreat to the definition of knowledge. If the definition doesn't fit the phenomenon, you trim the phenomenon. This is the hard problem, Aris. You can explain the function of vision—the edge detection, the color constancy, the object recognition. You can explain what Elena's brain *does*. But you cannot explain why it *lights up*. Why is there a subjective glow accompanying the 700-nanometer processing? If the physical story were exhaustive, a philosophical zombie could write Elena's thesis. But a zombie wouldn't cry over a poppy."

  "A zombie wouldn't write the thesis because it wouldn't have the functional architecture to process the information," Aris countered. "The crying is part of the architecture. It's a feedback loop signaling high-value data integration. You want to find a ghost in the machine because the machine's complexity feels like magic to you. But if I gave you a complete physical description of her brain state right now—every ion channel, every synaptic weight—you would say, 'But where is the red?' And I would say, 'There. You're looking at it.' The red isn't a ghost. It's the machine running."

  "But that's exactly what's missing from the description!" Mara's voice rose, then checked itself. She lowered it, intense. "You can describe the machine running until the end of time. You can list the causal relations. But nowhere in that list does the *redness* appear. It's an extra premise. Elena's realization today proves that the physical facts do not entail the phenomenal facts. If they did, she could have deduced the experience of red from the physics of red. She couldn't."

  "She couldn't deduce it because deduction is a syntactic process, and experience is semantic," Aris said. "She needed the ostensive definition. Pointing. 'This is red.' But once pointed at, 'this' is fully physical. You're insisting that because the *mode of presentation* is different, the *object presented* must be different. That's like saying the Morning Star and the Evening Star are different celestial bodies because one is seen in the morning and one at night. It's Venus both times."

  "Venus is Venus," Mara agreed. "But the light of the morning star is not the light of the evening star. One promises day, the other signals rest. The context changes the reality. Elena isn't just seeing Venus. She's seeing the *light*. And the light of qualia is not captured by the wavelength. It's the *presence* of the wavelength to a subject. If physicalism is true, subjects are illusions. If subjects are real, physicalism is incomplete."

  Aris looked back at Elena. She was standing now, touching the petals of the poppy. She looked fragile, as if the color might burn her.

  "I don't need subjects to be illusions," Aris said quietly. "I need them to be physical systems. If I admit that there are non-physical facts—facts about 'what it is like' that escape the net of physics—then science hits a wall. We stop explaining and start worshipping. I won't tell Elena that her tears prove the universe is haunted."

  "And I won't tell her that her tears are just hydraulic pressure in the lacrimal glands," Mara said. "She knows the physics. She wrote the papers. Today, she found out the physics was a menu, not the meal. You can argue that the nutritional content is identical. But she's the one who has to eat."

  Aris picked up his teacup again. It was empty. He set it down. "She'll adjust. The novelty will fade. The red will become normal. When it does, the physical facts will remain, and the 'magic' of the first sight will be relegated to memory. And we will be left with the same universe we had yesterday."

  "Will we?" Mara stood up. "Yesterday, we thought we knew what color was. Today, we know we only knew what color *does*. Elena knows the difference. And as long as she remembers this moment, she is a living counter-example to your completeness."

  "She's a living example of a brain updating its drivers," Aris said. But he didn't look at Mara. He was watching Elena, who had closed her eyes, pressing her palms against her eyelids, trapping the afterimages in the dark.

  "Watch her," Mara said, moving to the door. "She's not updating. She's waking up. And if she's waking up, Aris, we have to ask what she was before."

  Mara left the room. Aris remained alone with the glass and the garden. He watched Elena lower her hands. She opened her eyes and looked directly up at the observation deck. She couldn't see them through the glare, but she looked.

  Aris touched the cold glass. He knew the refractive index of the window. He knew the wavelength of the light hitting her retina. He knew the exact neural pathway firing in her occipital lobe.

  He did not know why the sight of her standing there, bathed in that impossible, redundant, inefficient red, made his own throat tighten. He told himself it was a mirror neuron response. A physical fact.

  He waited for the feeling to pass. It didn't.
