      *   **Constraint:** No textbook recitation. Needs to be a genuine exchange between formidable thinkers. They must press each other on sophisticated moves (Lewis's Ability Hypothesis, Phenomenal Concept Strategy vs. The Explanatory Gap/Hard Problem).
