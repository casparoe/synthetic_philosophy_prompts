      *   **Specific Constraint:** Do not treat Newton as a generic "religious scientist." Use his *idiosyncratic theological commitments* and methodological scruples (*Hypotheses non fingo*).
      *   **Goal:** A best-reasoned reconstruction of Newton's reaction, assessing whether these developments would be a "minor tactical retreat" or a structural blow to his argument from design.

