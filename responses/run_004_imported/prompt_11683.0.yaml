      *   *Newton's Actual View:* Newton did mention instability (e.g., Saturn-Jupiter interaction), but his main argument for God wasn't *just* fixing errors. It was the *initial setup* (uniform motion, same plane) which gravity *cannot* explain mechanically.
      *   *Reaction to Laplace:* Newton would likely distinguish between *preservation* and *constitution*. Laplace shows the system preserves itself *once constituted*. Newton argues the *constitution* (the initial conditions) requires an intelligent Agent.
