prompt: |-
  I went down a rabbit hole a while back on Henry Sidgwick - not the utilitarianism hes actually known for, but the fact that he co-founded the Society for Psychical Research and was its first president, and spent like 20 years trying to get hard evidence of telepathy, ghosts, survival after death, all of it. I'm recording a podcast episode with a historian who specializes in that side of his life, and she tends to tell it as a triumph of intellectual honesty - like the Creery sisters case, where his own group put out evidence for thought-transference and then, years later, caught the girls using a signalling code and published the retraction themselves, no outside debunker needed. Give me like 8 interview questions that push past that "model of scientific integrity" framing a bit. I want at least one asking whether a 20-year research program even counts as rigorous if no result, positive or negative, was ever going to count as final disproof, one tying the whole psychical research obsession back to the unresolved "dualism of practical reason" from his ethics book - like was he really just hunting for a scientific loophole to a premise (personal immortality, a moral cosmos) he couldn't earn philosophically on its own - and one about the cross-correspondences that only started turning up in separate mediums' automatic writing after he and Myers were both already dead, and whether his own standards would've forced him to take those seriously or let him find some boring way out. Add a quick follow-up to each question keyed to the answer shes most likely to give, and end with one question about what result, even now, would've actually satisfied him.
