prompt: |-
  ok so for my political philosophy seminar we're on the epistocracy vs democracy unit this week and i have to bring a short dialogue to class tomorrow. can you write me one between two grad students hashing it out -- have one of them basically run Brennan's case for epistocracy (the hobbits/hooligans/vulcans typology, most citizens are too ignorant or too tribal to vote well so political power should track competence somehow) and the other defend Landemore-style epistemic democracy, leaning on that Hong-Page "diversity trumps ability" theorem to argue big, cognitively diverse electorates can outperform small competant elites.

  what i actually want fleshed out is the epistocrat pushing back on the theorem itself instead of just asserting elites are smarter -- like, isn't Hong-Page a pretty narrow math result about agents doing local search on a landscape, where "ability" and "diversity" get defined in ways that basically guarantee the conclusion? i vaguely remember there being a real critique along these lines but never worked through it myself. let the democrat either defend the theorem's relevance or retreat to the Condorcet jury theorem instead, and somewhere in there someone should bring up the annoying regress problem of who even gets to certify who counts as "competent" in the first place. no strawmanning -- both of them need to actually engage with the other's specific move instead of just restating their own side.
