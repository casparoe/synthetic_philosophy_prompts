      *   *Implication 2: The Trap of "Productive" Retirement.* Many retirees try to stay "useful." Schlick says "usefulness" is seriousness (means to an end). Volunteering *just* to feel needed might be meaningless. Volunteering because you love the task is meaningful.
      *   *Implication 3: The Nature of Effort.* Hardship doesn't negate meaning. Solving a hard puzzle is play. So, retirement doesn't have to be easy relaxation. It can be intellectually demanding, provided the demand is self-chosen and intrinsic.
