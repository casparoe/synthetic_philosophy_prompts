      *   *Seriousness vs. Play:* Seriousness = means to an end (future-oriented). Play = end in itself (present-oriented).
      *   *The Twist:* Work can be play if the doing is the point. Leisure can be serious if it's just to recharge for work.
      *   *The Goal:* To fill life with as much "play" (in the philosophical sense) as possible.
