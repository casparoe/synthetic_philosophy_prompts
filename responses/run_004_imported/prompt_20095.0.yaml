      *   Final Verdict: Clinical wins on "precommitment," Constitutional requires different justification (coordination).

  7.  *(Self-Correction during drafting)*: Make sure to explicitly answer "is it just a scaled-up version?" No, it's a category error.
      *   Make sure to explicitly answer "who enforces?"
      *   Make sure to explicitly answer "consent."
      *   Make sure to pick a winner in the conclusion.

  8.  **Final Review against constraints:**
