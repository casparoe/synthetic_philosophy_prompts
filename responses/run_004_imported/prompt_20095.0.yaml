answer: |-
  The analogy between psychiatric advance directives and constitutional entrenchment is one of the most seductive in political theory, popularized largely by Jon Elster's *Ulysses Unbound*. It appeals to our intuition that rationality should govern passion. However, to treat the constitutional case as merely a scaled-up version of the clinical one is to commit a category error. While both utilize the logic of precommitment, the shift from a single biological consciousness to an intergenerational polity fundamentally alters the moral geometry of the arrangement.

  Here is a rigorous comparison of the two, focusing on identity, enforcement, and consent, followed by a judgment on their respective justifications.

  ### 1. The Ontological Gap: One Self vs. Many Selves
  In the clinical context, the "Ulysses contract" relies on a theory of **temporal identity within a single organism**. When a patient with bipolar disorder signs a directive during a euthymic (lucid) phase, they are making a prediction about their own neurobiology. The assumption is that the "manic self" is a compromised version of the "lucid self"—a deviation from the patient's authentic will caused by pathology. The precommitment is an act of *autonomy extension*, ensuring the lucid self's values survive the temporary corruption of the brain's chemistry.

  In the constitutional context, the "self" is a legal fiction. The "People" who ratify a constitution are not the same biological entities as the "People" bound by it fifty years later. This is not one self binding its future self; it is **one generation binding other generations**. The moral logic shifts from *self-regarding prudence* to *intergenerational authority*. While the clinical patient assumes their future self will be *irrational* (due to illness), the constitutional framer often assumes the future citizenry will be *wrong* (due to passion or ignorance). The former is a medical judgment; the latter is a political arrogation.

  ### 2. The Nature of Consent
  Consent operates differently in these two domains, primarily regarding revocability and specificity.

  *   **Clinical Consent:** This is specific, informed, and contextual. Crucially, in many ethical frameworks, if the patient regains lucidity, the Ulysses contract can be re-evaluated or revoked. The consent is tied to the *capacity* of the agent. If the "future self" objects, there is a procedural mechanism to determine if that objection is a symptom of the illness or a genuine change of mind.
  *   **Constitutional Consent:** This is tacit, hypothetical, or fictional. Future citizens do not sign the contract; they are born into it. Their "consent" is inferred merely from their residence or lack of revolution. Furthermore, constitutional consent is often designed to be *counter-majoritarian*. It explicitly insulates certain clauses from the consent of the current majority (via supermajority requirements or unamendable clauses). In the clinical case, consent protects the patient from their illness; in the constitutional case, "consent" often protects the text from the people.

  ### 3. Enforcement: Who Holds the Ropes?
  This is the most critical divergence. In the Homeric myth, Ulysses orders his crew to tie him to the mast and *not* release him no matter how much he begs. The crew are external agents acting on prior instructions.

  *   **Clinical Enforcement:** The enforcers (physicians, courts, family) are third parties acting as agents of the *patient's* prior will. They are legally and ethically bound to prioritize the patient's health and prior autonomy. They do not have a stake in the outcome other than the patient's welfare.
  *   **Constitutional Enforcement:** The enforcers are usually the Judiciary (e.g., the Supreme Court). However, judges are not external crew members; they are part of the ship. They are current office-holders, embedded in the very polity they are restraining. When a court strikes down a law based on an entrenched clause, it is not an external force restraining a passion; it is one branch of the current government restraining another branch of the current government using rules written by the dead.
      *   Moreover, ultimate enforcement relies on the executive and the citizenry's acquiescence. If the "bound" citizenry truly rejects the precommitment (e.g., the Civil War, or a modern constitutional crisis), the "ropes" break. The constitutional Ulysses contract is only as strong as the current generation's willingness to be bound. It is not a binding constraint in the physical sense, but a normative one.

  ### 4. Pathology vs. Pluralism
  The clinical Ulysses contract is justified by the existence of a **pathology**. We agree that mania distorts reality and endangers the self. There is an objective standard (health) against which the future state is measured.

  Constitutional precommitment lacks an objective standard of "health." When a constitution entrenches property rights or speech norms, it assumes the Founders' values are superior to future values. But political change is not always a descent into passion; it is often moral progress (e.g., expanding suffrage or civil rights). Treating political disagreement as a "passion" to be restrained by "reason" (the Constitution) risks freezing the moral prejudices of the past. The clinical case binds the self against *internal dysfunction*; the constitutional case binds the polity against *political change*.

  ### Conclusion: Which is the True Ulysses Contract?

  The clinical practice has the significantly better claim to being a **justified precommitment**, whereas the constitutional practice often devolves into **rule by the past over the future**.

  The clinical Ulysses contract is an instrument of **liberty**. It allows a person to maximize their autonomy over time by acknowledging their own fragility. It is therapeutic and self-regarding. The enforcement is protective, and the standard for overriding the future self's objection is medical competence.

  The constitutional Ulysses contract is frequently an instrument of **power**. While it can serve a legitimate function in coordinating expectations and protecting minorities from transient majorities (a "rules of the game" justification), it fails the strict Ulysses test because the "self" is discontinuous. When a constitution prevents a future citizenry from amending fundamental structures or rights, it is not protecting them from their own "mania"; it is subjecting them to the sovereignty of ancestors who cannot be held accountable.

  Therefore, the clinical directive is a genuine act of self-binding against irrationality. The constitutional entrenchment is better understood not as precommitment, but as a **coordination equilibrium** that remains valid only so long as it serves the living. When the "ropes" of the constitution prevent the living from addressing their own justice, it is no longer Ulysses saving himself from the Sirens; it is a ghost steering the ship.
