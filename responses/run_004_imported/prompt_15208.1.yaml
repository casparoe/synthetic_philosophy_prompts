answer: |-
  This is a classic debate stalemate, which is actually great for prep. It means both sides have defensible ground. In a real round, the winner would depend on which "voting issue" the judge cares about more (Philosophical Consistency vs. Practical Harms).

  Here is the move-by-move breakdown of who won each exchange, followed by the "bonus" argument you can use to look smart at practice.

  ### Round 1: The Surgeon Analogy vs. The "Contested Ends" Critique
  *   **Marcus's Move:** He used the **Expert Authority Analogy** (Pilots/Surgeons).
      *   **Strength:** This is the strongest intuitive argument for epistocracy. It places the burden on Naomi to explain why politics is *different* from other high-stakes professions. Citing J.S. Mill was a smart appeal to authority, showing that supporting this doesn't automatically make you an anti-democratic elitist.
      *   **Weakness:** It assumes political outcomes are objectively measurable like a successful surgery.
  *   **Naomi's Move:** She attacked the **Analogy Link**.
      *   **Strength:** This is the standard philosophical rebuttal to epistocracy. She correctly identified that medicine has agreed-upon ends (health), whereas politics is a fight *over* the ends (justice, liberty, equality). If you can't agree on what "success" looks like, you can't measure "competence."
      *   **Weakness:** She didn't address the Mill point directly, leaving the "even democrats believe this" claim hanging.
  *   **Who won the point?** **Naomi.** In debate, destroying your opponent's analogy is usually more valuable than establishing one. By proving politics isn't technical like surgery, she neutralized Marcus's opening framework. Marcus set the table, but Naomi flipped the script.

  ### Round 2: Factual Tests vs. The Literacy Test Historical Precedent
  *   **Marcus's Move:** He pivoted to **"Thin" Knowledge** (Civics facts).
      *   **Strength:** This was a smart tactical retreat. By moving from "political wisdom" to "civics facts," he tried to bypass Naomi's "contested ends" argument. It makes the test seem objective and measurable.
      *   **Weakness:** He didn't prove that knowing what a tariff *is* leads to voting for a *better* tariff policy. (Knowledge $\neq$ Wisdom).
  *   **Naomi's Move:** She brought in the **Historical Impact** (Jim Crow Literacy Tests).
      *   **Strength:** This is a massive **Impact Turn**. Even if the test *could* be neutral in theory, she proved that in the real world, they are weapons of oppression. In debate, a high-probability risk of racism/disenfranchisement usually outweighs a theoretical gain in efficiency.
      *   **Weakness:** This is technically a "circumstantial" argument. It attacks the *implementation*, not the *principle*.
  *   **Who won the point?** **Naomi.** While Marcus made a logical distinction, Naomi raised the stakes. In a policy debate, the risk of systematic disenfranchisement (her point) outweighs the potential benefit of slightly more informed voting (his point). She forced Marcus onto the defensive.

  ### Round 3: Principle vs. Practice (The Judges/Central Banker Analogy)
  *   **Marcus's Move:** He distinguished **Principle from Abuse** and used a **Status Quo Analogy** (Judges/Fed).
      *   **Strength:** This was his strongest moment. He correctly noted that just because a tool (literacy tests/juries) was abused historically doesn't mean it's inherently evil. More importantly, the Judges/Central Banker point is hard to answer: We *already* accept unelected, "competent" people making huge decisions. If that's legitimate, why is a voter competence test illegitimate?
      *   **Weakness:** He didn't explain why those specific unelected roles are okay (they are insulated to protect *rights* or *currency*, not to dictate general social policy).
  *   **Naomi's Move:** She ran out of time, but her previous stance implied that those roles are accountable to the law/constitution, whereas epistocratic voters would be accountable to no one.
      *   **Strength:** (Hypothetical) The distinction between *interpreting* law (Judges) and *making* law (Voters) is crucial.
      *   **Weakness:** She didn't actually make this distinction before the bell rang.
  *   **Who won the point?** **Marcus.** Naomi didn't answer the Judges/Central Banker analogy. In debate, an unanswered argument is a true argument. By showing that we already accept "epistocratic" elements in our democracy, he normalized his position and made Naomi look like she wants to remove *all* expertise from government.

  ### Overall Scorecard
  *   **Marcus:** Won the **Principle** and the **Final Exchange**. He proved that competence is valuable and that expertise already exists in government.
  *   **Naomi:** Won the **Feasibility** and the **Risk**. She proved that defining competence is politically impossible and that the mechanism is dangerous.
  *   **Verdict:** It's a **Draw**. Marcus has the better *theory*, but Naomi has the better *practice*. A judge who values consistency votes Marcus; a judge who values harm reduction votes Naomi.

  ***

  ### The "Bonus" Argument (To drop at practice)
  If you want to introduce a new layer that neither of them touched on, bring up **The Diversity Trumps Ability Theorem** (based on the work of Scott Page and Lu Hong).

  **The Argument:**
  "Marcus is assuming that a group of 'high competence' individuals will make better decisions than a random group. But mathematical modeling shows that **cognitive diversity often outperforms ability.** A group of experts often thinks alike (they have the same blind spots). A random group of 'incompetent' people brings different heuristics and perspectives that solve problems the experts miss. So, even if we *could* measure competence, apportioning power to the 'competent' might actually produce *worse* outcomes than a diverse democracy."

  **Why this looks smart:**
  1.  **It attacks Marcus's core link:** It uses math/science to say "Competence $\neq$ Better Outcomes."
  2.  **It saves Democracy:** It gives a utilitarian reason to keep one-person-one-vote that isn't just about "fairness" (Naomi's point) but about *results* (Marcus's concern).
  3.  **It's niche:** Most high schoolers stick to Mill or Jim Crow. Citing complexity theory sets you apart.

  **Secondary "Quick Drop":**
  If that's too heavy, drop the **Legitimacy Argument**:
  "Epistocracy might produce better *laws*, but democracy produces better *compliance*. People obey laws because they feel they had a say in them (Consent of the Governed). If you tell 40% of the population their vote counts for less, you lose the legitimacy required to enforce the law without violence. Stability is more important than optimization."

  **How to say it casually:**
  *"You guys covered the ethics and the history really well, but I was reading about the 'Diversity Trumps Ability' theorem last night. It suggests that even if we could measure competence, a homogenous group of experts usually gets outperformed by a diverse group of amateurs because they don't have the same blind spots. So epistocracy might actually fail on its own goal of getting better outcomes."*
