answer: |-
  **Setting:** *A crowded conference room at the APA. The speaker, Elena Vance, has just finished a paper titled "Planning, Consistency, and the Quasi-Realist's Logic." Marcus Thorne, a known moral realist, raises his hand for the first question.*

  **Marcus:** Thank you, Elena. A compelling technical defense. You've argued that by treating normative predicates as expressing higher-order attitudes—specifically, being *for* certain combinations of plans—we can validate modus ponens in mixed inferences without positing moral properties. But I want to press you on the cost of this success.

  You grant that "Tormenting the cat is wrong" in the antecedent of a conditional must have the same meaning as in a standalone assertion. You grant that the inference is valid. You even grant that we can call these sentences "true" in a deflationary sense. But if your expressivism secures validity, uniformity of meaning, and a truth-predicate, what substantive work is left for the claim "moral judgments are not beliefs"?

  James Dreier's worry about "creeping minimalism" seems apt here. If I look at your system from the outside, it looks exactly like cognitivism. You have truth-conditions, you have logical relations, you have consistency constraints. If the semantic machinery is isomorphic to realism, haven't you just reinvented the belief, but with a label that says "attitude" to hide the metaphysical cost?

  **Elena:** Thanks, Marcus. That's the obvious worry, but I think it conflates the *structure* of the discourse with the *state of mind* the discourse expresses. You're right that the logic looks the same. That's the point of quasi-realism: to earn the right to talk like a realist. But the explanation of *why* the logic works is fundamentally different.

  For you, the validity of the modus ponens rests on truth-preservation across possible worlds. For me, it rests on the inconsistency of holding certain combinations of attitudes. If I am *for* blaming anyone who torments the cat, and I am *for* blaming anyone who gets their brother to do it if tormenting is wrong, I cannot coherently fail to be *for* blaming someone who gets their brother to do it. The "logic" is a logic of plan-consistency, not a logic of descriptive fit.

  **Marcus:** But that distinction seems to retreat into the psychology of the speaker, while the semantics does all the heavy lifting. If the sentence "Tormenting is wrong" functions in the language exactly as if it picked out a property, and if your "being for" relation plays the exact functional role of a belief in our reasoning processes, then calling it an "attitude" looks like a verbal gesture.

  Here's the crux: If I accept your system, I can say "It is true that tormenting is wrong." I can say "I believe that tormenting is wrong." I can say "I know that tormenting is wrong." You allow all of this. So, what is the residual difference? If the only difference is that, in your metaphysics, there isn't a "moral fact" out there in the universe, but there is a "fact" in your deflationary sense... haven't you just become a minimalist realist? Is there anything *substantive* left to disagree about?

  **Elena:** There is, and it concerns the direction of fit. This isn't just a label. It explains the connection to motivation, which is where your view pays a heavy tax.

  If I say "Water is H2O," I express a belief. That belief, on its own, doesn't move me to do anything. I need a separate desire to drink water. But if I say "Tormenting is wrong," on my view, I am expressing a state that is *constitutively* practical. It is a plan-laden state. The reason your view looks like mine semantically is that we've built a language to coordinate our actions, not just to map the furniture of the universe.

  If you force me to say that moral judgments are genuine beliefs with truth conditions in your robust sense, you sever the internal link to motivation. You have to explain why recognizing a moral fact *necessarily* gives a rational agent a reason to act. You either have to posit queer, reason-giving entities in the world, or you have to adopt externalism about reasons and admit that a rational agent could grasp the moral truth and simply not care. I find the latter implausible. My "creeping" stops where your metaphysics begins: I don't need to find the "wrongness" in the world to explain why the judgment moves me.

  **Marcus:** I accept the tax. I'm willing to pay the metaphysical cost to avoid the semantic complexity. But let's look closer at your "plan-consistency." You say the inconsistency is in holding conflicting attitudes. But to define that inconsistency, you have to formalize the attitudes so precisely that they look like propositions.

  Gibbard does this with factual-normative worlds. Schroeder does it with "being for." In doing so, you've essentially reified the attitudes. You've given them truth-conditions. If an attitude has conditions under which it is "correct" or "consistent," and those conditions are mind-independent enough to ground logical validity across different speakers... in what sense is this still *my* attitude?

  If the standard of consistency is objective—if I'm *wrong* to hold inconsistent plans even if I feel fine about it—then you've reintroduced a normativity that looks suspiciously like a moral fact. You've avoided positing a "Property of Wrongness," but you've posited a "Property of Plan-Inconsistency" that does the exact same logical work. Is that really a metaphysical saving? Or have you just moved the queerness from the moral realm to the practical realm?

  **Elena:** That's a sharp point, but it misses the genealogy. I'm not positing a property of Plan-Inconsistency out there in the platonium. I'm describing the constraints on *us* as agents who need to live together. The normativity comes from the nature of agency, not from a detached realm of facts.

  Here's the real answer to your creeping minimalism charge: The difference isn't in the sentences we assent to. We both assent to "Tormenting is wrong." We both assent to the validity of the inference. The difference is in the *explanation* of what we are doing when we assent.

  For you, we are tracking a truth. For me, we are negotiating a shared practical standpoint. If we agree on all the moral claims, but you think you're describing the universe and I think we're coordinating our lives, does that difference matter? Yes. Because if you're right, moral inquiry is a discovery process. If I'm right, it's a deliberative process. That changes how we understand moral disagreement, moral error, and moral progress. I don't need to deny that we speak "as if" there are truths. I just deny that the *best explanation* for why we speak that way requires robust moral facts.

  **Marcus:** But if the "deliberative process" is constrained by objective standards of consistency that mirror logical truth, the distinction between "discovery" and "deliberation" starts to blur. If there's a right answer to the deliberation that isn't determined by my current desires, but by the rational requirements of planning... isn't that just a fact about what I have reason to do?

  And if that's a fact, and moral judgments express those facts... I'm struggling to see what's not cognitivism here. You seem to want the benefits of realism—the objectivity, the logic, the truth—without the ontology. But if the ontology is just "facts about rational planning," you have an ontology.

  My worry is that this makes your view unstable. Either you lean into the objectivity of these planning norms, in which case you're a realist about reasons (which is a form of cognitivism), or you retreat to a harder expressivism where the norms are just *our* norms, in which case you lose the objectivity required to solve Frege-Geach robustly. You can't have it both ways. You can't have objective validity without objective truth-bearers.

  **Elena:** I think that's a false dichotomy, Marcus. I can have objective validity based on the nature of practical reasoning without positing truth-bearers that exist independently of the practice of reasoning.

  Think of it like chess. There are objective truths in chess. "The bishop moves diagonally." "In this position, checkmate is in three." We can have valid inferences about chess. But there are no "chess facts" floating in the universe waiting to be discovered. The facts are constitutive of the game.

  Moral discourse is like that. It's a game we play because we need to coordinate. The "truths" are internal to the practice. You're asking me to step outside the practice and say if it matches the world. I'm saying the practice *constructs* the world we live in. The Frege-Geach problem is solved because the rules of the game allow embedding. The "creeping minimalism" worry dissolves because we aren't trying to hide our ontology; we're saying the ontology is lightweight by design.

  **Marcus:** But chess is optional. Morality, you claim, isn't. If morality is constitutive of agency itself, then these "facts about agency" look an awful lot as robust as moral facts.

  Let me put it this way: If a student asks, "Is it true that tormenting the cat is wrong?" and you say "Yes," and I say "Yes," and we both mean that the sentence is correct, assertible, and logically related to other sentences... what practical difference does it make if you add the footnote "but this doesn't describe a fact"?

  If the footnote doesn't change how we reason, how we argue, or how we live, then the debate between us is merely verbal. But if the footnote *does* change something—if it implies that there's nothing "out there" making it true—then you owe me an account of what makes the sentence correct other than the world. If the answer is "our rational nature," then you're a realist about rational nature. And if you're a realist about that, why not just be a realist about morality and save us the semantic gymnastics?

  **Elena:** Because "realism about rational nature" doesn't commit me to a moral reality that *causes* our judgments. It commits me to us. The direction of explanation is reversed. For you, the fact makes the judgment correct. For me, the judgment's role in our practical life makes it correct to call it a "fact."

  Does it matter? Yes. Because when you encounter a moral skeptic, you have to convince them they are *mistaken* about the world. I have to convince them they are *incoherent* as an agent. That's a different dialectical position. It respects the skeptic's challenge without positing entities they reject.

  **Marcus:** But the skeptic can ask, "Why should I care about being coherent?" If the only answer is "because that's what agency is," you've just posited a normative fact about agency. You haven't escaped normativity; you've just relocated it.

  **Elena:** I haven't escaped normativity, and I don't want to. I've escaped *ontological* commitment to normative entities. That's the bargain. We keep the logic, we keep the truth-talk, we keep the normativity. We just stop asking what *kind of object* wrongness is.

  **Marcus:** And I'm saying that if your "truth-talk" behaves exactly like realist truth-talk, and your "normativity" behaves exactly like realist normativity, the denial of the "object" is doing no work. It's a metaphysical idle wheel. You're a cognitivist in practice, Elena. You just prefer the expressivist branding because it feels more naturalistic.

  **Elena:** And I'd say you're a quasi-realist in disguise, Marcus. You admit moral facts are sui generis, non-natural, and only graspable by a special faculty. At some point, the "fact" is so thin it looks like a projection. We might be standing closer than we think.

  **Marcus:** *Pauses, smiles slightly.* Perhaps. But until you can show me a difference that makes a difference in the semantics, I'll stick with the view that doesn't require a "logic of attitudes" to explain a simple modus ponens.

  **Elena:** And until you can explain how a non-natural fact motivates action without a separate desire, I'll stick with the view that explains the logic without the ghosts.

  **Marcus:** Touché. Thank you.

  **Elena:** Thank you.
