answer: |-
  **Setting:** *A dimly lit corridor outside the philosophy department lounge. The seminar on skepticism has just ended. Elena (Dispositionalist) and Marcus (Communitarian) are still standing by the whiteboard, which is covered in diagrams of functions and the symbol "⊕".*

  **Marcus:** You didn't buy it. I could tell by the way you were tapping your pen during the quus example. You still think there's a fact of the matter about what you meant yesterday.

  **Elena:** Because there is, Marcus. The paradox is a logical puzzle, not a metaphysical crisis. When I used "+" yesterday, I meant addition. If you ask me "68 + 57" today, I will say "125". That's not a guess. It's a manifestation of a disposition I held yesterday.

  **Marcus:** But that's the first move Kripke blocks. You've made mistakes before. You've gotten tired. You've misread numbers. Your *actual* past behavior is finite. It's consistent with infinitely many functions. So you appeal to a *disposition*. But which disposition? To say you meant addition is to say you were disposed to answer "125". But you were also disposed to answer "5" if you had a stroke, or "125" if you were sober. You need to specify the conditions.

  **Elena:** Fine. Idealized conditions. I mean addition because, under idealized conditions—unlimited memory, no fatigue, no distraction—I would answer "125". The disposition is to the function, not the noisy output.

  **Marcus:** And there it is. The "idealization" loophole. This is the charge you need to answer, Elena. How do you specify "ideal conditions" without begging the question? If you say "conditions where I function properly," you're smuggling in "properly." Properly according to what rule? If you say "conditions where I give the *correct* answer," you've defined "correct" using the very notion of meaning you're trying to ground. It's circular.

  **Elena:** It's not circular if "ideal" refers to the *mechanism*, not the *norm*. Think about a calculator. If I press "2 + 2" and it displays "5", I don't say the calculator meant "quus". I say the battery is low or the circuit is fried. I distinguish between a performance error and the function the device is built to execute.

  **Marcus:** But a calculator only has a function relative to an interpreter. Physically, it's just voltage transitions. Those transitions are consistent with adding, or quadding, or "quadding until the heat death of the universe then switching to adding." The physics doesn't pick out the arithmetic. Why is your brain different?

  **Elena:** Because the brain isn't just a black box of inputs and outputs. It has a specific causal architecture. The "idealization" is a ceteris paribus clause describing that architecture's stable state. It's like fragility. A glass is fragile even if it never breaks. We assert "If struck, it would break" based on its molecular structure. We don't need to strike it to know the truth-condition. My neural structure encodes the algorithm for addition.

  **Marcus:** "Encodes" is doing too much work. You're assuming the structure *is* an algorithm. But to call a physical state an "algorithm for addition" is already to interpret it. Kripke's point is that no physical state contains its own interpretation. So, when you say "under ideal conditions," you're asking me to consider a counterfactual: "What would you do if you had infinite memory?" But there is no fact of the matter about that counterfactual. You've never been in that state. You're projecting from the finite to the infinite. That projection *is* the act of meaning, not the ground of it.

  **Elena:** So you deny counterfactuals have truth values?

  **Marcus:** I deny that *your* mental states fix them uniquely.

  **Elena:** Then let's pivot. If it's not in me, where is it? You side with Kripke's skeptical solution. Meaning is communal. I mean addition because my community accepts my usage.

  **Marcus:** Precisely. It's not about a metaphysical fact inside your head. It's about assertibility conditions. We are licensed to say "She means addition" when her responses align with ours, and we correct her when they diverge. The normativity comes from the social practice of correcting and endorsing.

  **Elena:** This is the softer target, Marcus. You've just relocated the indeterminacy one level up. I am an individual. I am subject to the quus paradox. The community is just a collection of individuals. If *I* can't fix the meaning of "+" for myself, how does a bunch of *us* fixing it together help? If every individual's disposition is indeterminate, the sum of those dispositions is just a larger indeterminacy. What fixes that the *community* means addition and not "community-quus"?

  **Marcus:** You're treating the community as a super-individual. That's a category mistake. The community isn't a giant brain trying to introspect its own meaning. The community is the *standard*. There is no "fact" about what the community means in the realist sense you crave. There is only the agreement in judgments. When we all say "125", that's not a discovery of a pre-existing truth; that's the establishment of the rule.

  **Elena:** But that makes meaning contingent on consensus. If the entire human race woke up tomorrow and collectively decided "68 + 57 = 5", would they be right?

  **Marcus:** There's no "right" outside the practice. If they all did it, that would be the new rule. But practically, that won't happen because we share a form of life. We share natural reactions to counting, to grouping.

  **Elena:** Natural reactions! Now you're smuggling in biology. If it's about natural reactions, we're back to dispositions. You're saying we are naturally disposed to agree. But if we are naturally disposed to agree, we are naturally disposed to *diverge* from the quus-function. So you need a fact about our natural dispositions to ground the agreement. And if *that* fact is subject to the same interpretation problem—what counts as "agreeing" versus "coincidentally matching"—then you haven't solved anything. You've just hidden the realist fact inside a sociological description.

  **Marcus:** I'm not hiding it; I'm dissolving the demand for it. You want a truth-condition that stands outside human practice and judges it. You want a "super-rail" that extends infinitely into the future, independent of us. Kripke shows there is no such rail. The communitarian view says the rail is laid *as we walk*.

  **Elena:** But if the rail is laid as we walk, we can never be wrong about where it goes, only inconsistent with where we walked before. That eliminates normativity. If meaning is just "what the community accepts," then the community can never make a mistake about meaning. They can only change their minds. But I can make a mistake *now*, even if the community hasn't caught me yet. I can know I've miscalculated before I tell anyone. That internal normativity requires a standard independent of their approval.

  **Marcus:** You can know you've miscalculated because you've internalized the community's standards. You're anticipating their correction. The "ought" is the internalized voice of the "we".

  **Elena:** That's a genetic account of how I learned the word, not an account of what makes my usage correct *now*. If I am alone on a desert island, I can still follow a rule. I can still add. If the community vanishes, does arithmetic cease to have truth values?

  **Marcus:** If you are truly alone, forever, the question of whether you are "following a rule" loses its grip. You're just making noises. Rule-following requires the possibility of a check that isn't just your own say-so.

  **Elena:** And who checks the checkers? If the community corrects me, who corrects the community? If the answer is "no one," then the community's usage is brute. It's not correct; it just *is*. But arithmetic feels necessary, not brute. "2 + 2 = 4" isn't true because we all vote for it. It's true because of the nature of numbers.

  **Marcus:** And there we are. You're a Platonist at heart. You need the numbers to exist independently to ground the meaning. But Kripke's argument applies to your grasp of the numbers, too! How do you know your mental grasp of "number" isn't the quus-version of number? You can't appeal to the abstract objects themselves, because you only access them through your mind, and your mind is subject to the paradox.

  **Elena:** I don't need to access them magically. I need a causal or structural connection that constrains my interpretation. My idealized disposition is that constraint. It's not infallible, but it's determinate. You're demanding a guarantee of infallibility to admit determinacy. I'm offering a probabilistic mechanism that fixes reference well enough for truth.

  **Marcus:** "Well enough" isn't truth. It's utility. You're retreating to pragmatism while claiming realism.

  **Elena:** And you're retreating to sociology while claiming to solve semantics. You say there's no fact of the matter. I say the fact is about my cognitive architecture. You say that architecture is interpretable multiple ways. I say the interpretation is fixed by the causal history of how I learned the function.

  **Marcus:** Causal history is just more finite data! A causal chain is just a sequence of events. Quus is compatible with that sequence too.

  **Elena:** Not if the causal mechanism is sensitive to the structure of the operands. My brain doesn't just store a lookup table. It processes magnitude.

  **Marcus:** "Processes magnitude." More interpretive language.

  **Elena:** Then we're at an impasse. You think the demand for a fact is the disease. I think the denial of the fact is the death of meaning.

  **Marcus:** No, the denial of the *super-fact* is the maturity of philosophy. We can have meaning without magic.

  **Elena:** We can have agreement without meaning.

  *They stand in silence for a moment. Marcus erases the "⊕" from the whiteboard, leaving a smudge. Elena picks up her bag.*

  **Marcus:** Lunch tomorrow?

  **Elena:** Only if we don't talk about rules.

  **Marcus:** I'll try. But I can't promise I won't correct you if you order the wrong thing.

  **Elena:** *Smiles.* Then you admit the normativity is real.

  **Marcus:** I admit the lunch is real. The rest is just talk.

  *Elena shakes her head and walks down the hall. Marcus watches her go, then turns back to the board, picking up the marker.*
