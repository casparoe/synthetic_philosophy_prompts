answer: |-
  **Setting:** *A quiet corner of the university coffee shop, late afternoon. Empty cups and scattered handouts from Toby Ord's paper cover the table. Priya is leaning forward; Sam is leaning back, staring out the window.*

  **Priya:** So, the math is straightforward. I give up the two long-haul conferences I had planned this year. That's roughly four tons of CO2. In exchange, you commit to a vegetarian diet for the same period. Given the average carbon footprint of meat consumption, plus the animal suffering metric, I come out ahead on my values, and you come out ahead on yours. We both maximize our moral utility. Why is this sticking?

  **Sam:** It's not the math, Priya. The math works. That's the seductive part. It's the… texture of the agreement.

  **Priya:** Texture?

  **Sam:** It feels like we're turning moral obligations into commodities. If I believe long-haul flying is genuinely wrong—structurally destructive, a violation of intergenerational justice—then it's not something I should be *bargaining* for. It's not a preference I can satisfy by offering up a chicken.

  **Priya:** But you aren't offering up a chicken. You're indifferent to meat. You've said yourself, you don't think eating animals is wrong. So you aren't sacrificing a moral principle. You're just changing a habit.

  **Sam:** Exactly. And that's part of the worry. If I agree to this, I'm treating your moral conviction about meat as a currency I can spend to buy your compliance on climate. But I don't share your conviction. By entering the trade, am I implicitly validating the idea that your moral claim on me is legitimate?

  **Priya:** Is it legitimate? I think factory farming is a atrocity. If you can help stop it at zero cost to your own moral framework, isn't it *more* legitimate to do so? You're not conceding that meat is wrong; you're just conceding that *helping me* is good.

  **Sam:** But look at what happens to your side of the bargain. You stop flying. Not because you've come to believe flying is wrong, but because you've been paid off.

  **Priya:** Paid off? I'm preventing climate harm.

  **Sam:** You're preventing it *conditionally*. The implication of this trade is that if I *didn't* go vegetarian, you would be morally permitted to fly. But I thought we agreed flying is objectively damaging. If it's objectively damaging, your right to do it shouldn't depend on my diet. You're essentially purchasing a license to pollute, and I'm the regulator selling it to you.

  **Priya:** That's a caricature. I'm not buying a license; I'm cooperating. Look, Sam, we live in a pluralistic society. We disagree on the source of value. I value sentient welfare; you value ecological stability. Ord's point is that we don't need to resolve the metaphysical disagreement to reduce the net harm. Why does the *motivation* matter if the outcome is identical?

  **Sam:** Because morality isn't just about outcomes. It's about integrity. If I sign this deal, my stance on climate change becomes transactional. Next year, if I slip up on the diet, do I owe you a flight? Or if you decide the veggie thing is too hard, do you just pay a carbon tax and fly? It turns duty into a subscription service.

  **Priya:** Is integrity really served by letting planes take off while you eat a salad? You're prioritizing the cleanliness of your own hands over the actual state of the atmosphere. That seems like moral egoism to me. You want to be the person who *didn't trade*, rather than the person who *reduced emissions*.

  **Sam:** That stings, but it's not quite it. It's about the signal. If we normalize moral trade, we suggest that all moral duties are negotiable. If I believe flying is akin to… I don't know, a minor form of theft from the future… can I negotiate with a thief? "I won't report you if you stop kicking dogs"?

  **Priya:** But I'm not the thief in your analogy. I'm a co-conspirator you're trying to bring into compliance. And I'm willing to do it! I'm offering you leverage. You say you care about the climate. Here is a guaranteed way to remove four tons of carbon. The "signal" you're worried about is internal to us. The external signal is two people reducing harm.

  **Sam:** But at what cost to the truth? If I accept this, I'm admitting that your moral claim—that meat is murder—is weighty enough to restrict my behavior, even though I think it's nonsense. I'm acting *as if* your morality is true. Isn't that dishonest?

  **Priya:** It's not dishonesty; it's humility. I'm asking you to act as if *my* morality has weight, and I'm acting as if *yours* does. We acknowledge we can't convince each other. So we hedge our bets. Isn't that the rational response to moral uncertainty?

  **Sam:** Maybe. But there's a difference between hedging bets and striking a deal. Hedging is me saying, "I'm not sure Priya is wrong, so I'll cut back on meat." A deal is me saying, "I will cut back on meat *if and only if* you stop flying." The conditionality is the poison. It implies that the moral worth of my vegetarianism is derived from your groundedness, not from the act itself.

  **Priya:** So you'd prefer I fly, and you eat meat, just so your vegetarianism remains "pure"?

  **Sam:** I'd prefer we both do the right thing for the right reasons.

  **Priya:** And if we can't? If we're stuck in this deadlock where I think you're a murderer of the atmosphere and you think I'm a murderer of animals? Do we just let the bodies pile up while we wait for a philosophical breakthrough?

  **Sam:** *[Pauses, stirring cold coffee]* No. Obviously not. But… I worry that if we start trading, we lose the ability to speak truth to power. If I become your trading partner, can I still critique your lifestyle? Or have I sold my right to criticize you because you "paid" for that flight with your tofu consumption?

  **Priya:** You never lose the right to criticize. In fact, doesn't this build solidarity? We're allies now. We're both making sacrifices for the other's cause.

  **Sam:** Are they sacrifices? I don't care about meat. So it's not a sacrifice for me. It's a… service. And that makes me uncomfortable. I'm performing a service for you, and you're performing a service for me. We're service providers, not moral agents.

  **Priya:** You're parsing semantics to avoid impact.

  **Sam:** I'm trying to protect the concept of obligation! If morality becomes a matter of comparative advantage, then the person with the most flexible preferences holds all the power. Suppose I didn't care about flying *or* meat, but I knew you cared about both. I could extort you. "I'll breathe quietly if you give me a thousand dollars."

  **Priya:** That's blackmail, not trade. The constraint is that we both have to be acting on genuine moral convictions. I genuinely think flying is permissible but meat is not. You genuinely think the reverse. We are meeting in the middle of our indifference curves.

  **Sam:** But where does it end? If we trade this, why not trade on anything? "I won't donate to that political candidate you hate if you stop protesting that clinic."

  **Priya:** Because we need a baseline of shared harm reduction. We agree suffering is bad. We agree climate collapse is bad. We just weigh them differently.

  **Sam:** *[Sighs]* I see the logic, Priya. I really do. The utilitarian calculus is overwhelming. But I can't shake the feeling that by agreeing to this, I'm corrupting the very thing I'm trying to save. I'm treating the climate crisis as a problem of resource allocation rather than a crisis of justice. You don't bargain with justice.

  **Priya:** And I treat the animal crisis as a problem of justice, not preference. So here we are. Two justice warriors holding each other hostage.

  **Sam:** Essentially.

  **Priya:** So your answer is no?

  **Sam:** *[Looks at the handout, then out the window again]* My answer is… I can't sign the contract. I can't make my restraint conditional on yours. It feels like I'm saying your flying is okay, provided I get my veg.

  **Priya:** And if I just stop flying anyway? As a unilateral gesture of good faith?

  **Sam:** Then I'd feel obligated to stop eating meat out of reciprocity, not trade.

  **Priya:** What's the difference?

  **Sam:** The difference is who owns the decision. In the trade, we own each other's behavior. In reciprocity, we own our own.

  **Priya:** That seems like a distinction without a difference in the real world. The planes land either way.

  **Sam:** Maybe. But the world inside the head matters too. If I lose the sense that some things are non-negotiable, I don't know what's left of me to do the negotiating.

  **Priya:** *[Packs her bag slowly]* So we walk away. You keep flying. I keep eating chicken.

  **Sam:** I don't keep flying. I was already planning to cut back.

  **Priya:** But not because of me.

  **Sam:** No. Not because of a deal.

  **Priya:** *[Stands up]* It feels inefficient, Sam.

  **Sam:** It feels human, Priya.

  **Priya:** *[Pauses at the door]* Think about it. The chickens don't care about your integrity.

  **Sam:** *[Quietly]* And the atmosphere doesn't care about my consistency. But I do.

  *Priya nods, once, and leaves. Sam stays at the table, looking at the empty chair, then down at his own hands.*
