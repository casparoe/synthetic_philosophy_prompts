  9.  **Final Review against constraints:**
      *   Argue *for* infinitism? Yes.
      *   Confront "vicious regress"? Yes.
      *   Draw on epistemic parallel? Yes.
      *   Ignore coherentism? Yes.
      *   Tone appropriate? Yes.

