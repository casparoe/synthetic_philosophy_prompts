answer: |-
  **MEMORANDUM**

  **TO:** Committee on Doctrinal Fidelity
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Evaluation of Faculty Publication Regarding Molinist Providence and Confessional Subscription

  ### I. Purpose and Scope

  At the Dean's request, this memo serves as a discussion primer for Thursday's meeting regarding the formal complaint lodged against Prof. [Name]'s recent monograph, *Providence and Counterfactuals*. The complaint alleges that Prof. [Name]'s defense of Molinism (specifically the doctrine of Middle Knowledge) is incompatible with our confessional statement, Chapter 3, Section 1, which affirms that God "did, by the most wise and holy counsel of his own will, freely and unchangeably ordain whatsoever comes to pass."

  As the committee member whose doctoral research focuses on the *Congregatio de Auxiliis* and the Bañez–Molina dispute, I have been asked to outline the theological stakes. My aim here is not to adjudicate the metaphysical truth of Molinism *simpliciter*, but to evaluate its compatibility with our specific confessional commitments. I will argue for a **conditional resolution**: Prof. [Name] should not be barred from teaching this view, but it must be pedagogically framed as a systematic hypothesis that exists in tension with, rather than as an explication of, our confessional standard.

  ### II. The Confessional Standard vs. The Molinist Proposal

  **A. The Confessional Claim**
  Our confession utilizes the classic Reformed formulation. The operative clause is that God ordains *whatsoever comes to pass*. Historically, this has been understood to mean that the truth value of all future contingents is ultimately determined by the divine decree. While the confession carefully distinguishes God's ordination from God being the "author of sin," it maintains that nothing occurs outside the scope of God's ordaining will. There are no "brute facts" outside of God's determination.

  **B. The Molinist Account**
  Prof. [Name]'s monograph argues for the existence of *scientia media* (middle knowledge). On this view, prior to the divine decree to create (but subsequent to God's knowledge of His own nature), God knows the truth of all counterfactuals of creaturely freedom (CCFs). For example: "If Creature C were in Circumstance S, C would freely do X."
  God does not determine the truth of these counterfactuals; He simply knows them. He then chooses to actualize a "feasible world" containing those circumstances. Thus, God sovereignly governs history by selection, not by causal determination of the will.

  ### III. Analysis of the Complaint

  The trustees' complaint and the faculty's defense talk past one another because they are operating with different categories. To move forward, we must distinguish two separate objections that are currently being conflated.

  **1. The Metaphysical Objection (The Grounding Objection)**
  One trustee has argued that CCFs cannot be true prior to God's decree because there is "nothing to ground them." This is the famous *Grounding Objection* (raised by Bañez and contemporary critics like William Hasker). It asks: *What makes these counterfactuals true if not God's will or the creature's actual existence?*
  **Recommendation:** The Committee should explicitly set this objection aside. Whether Molinism is metaphysically coherent is a matter for philosophical debate, not doctrinal discipline. Our role is not to rule on the truth of Molinism, but on its compatibility with our subscription vows.

  **2. The Confessional Objection (The Sovereignty Constraint)**
  The trustees' deeper concern is not metaphysical grounding, but *theological authority*. Their argument is that if CCFs are true independent of God's will, then there are truths about reality that God did not ordain. Consequently, when God chooses a world, He is choosing from a menu He did not write.
  This is not a confusion on the trustees' part. It is a precise theological criticism: **Molinism posits limits on God's sovereign control that the phrase "ordain whatsoever comes to pass" was historically intended to rule out.** In the Reformed scholastic tradition, the "counsel of his own will" is the sole determinant of contingency. In Molinism, the "counsel of his own will" is constrained by the "feasible set" of creaturely actions.

  The faculty defense—that "sovereignty does not equal determinism"—is correct as a general philosophical statement, but it does not answer the specific confessional charge. Our confession does not merely require that God is *able* to govern history; it requires that He *ordains* what comes to pass. If the truth of creaturely choices is independent of the divine decree, the plain reading of "whatsoever" is compromised.

  ### IV. Precedent and Context

  It is true, as the faculty defenders note, that Molinism was not formally condemned by the Catholic Church (Pope Paul V halted the *Congregatio de Auxiliis* without a verdict). However, we are not a Catholic institution. We are a Reformed seminary. The historical Reformed response to Molina (from Turretin to Bavinck) has been consistently critical, viewing Middle Knowledge as a concession to creaturely autonomy that undermines the doctrine of providence.

  To permit Molinism as *orthodox* within this institution is to effectively redefine our confessional standard to accommodate a view that historically stands as a rival system. However, to ban it entirely is to stifle legitimate academic inquiry into how divine sovereignty and human freedom interact, especially given that respected evangelical philosophers hold this view.

  ### V. Recommendation: Conditional Permission

  I recommend the Committee adopt a **Conditional Resolution**. We should rule that Prof. [Name]'s view does not warrant formal disciplinary proceedings or removal, but it cannot be taught as a straightforward explication of our confessional standard.

  **Rationale:**
  1.  **Integrity of the Confession:** This acknowledges the trustees' valid concern. We cannot affirm that Molinism is the *natural* or *intended* reading of "ordain whatsoever." To do so would be dishonest to the history of the text.
  2.  **Academic Freedom:** This acknowledges the faculty's concern. Molinism is a live option in contemporary analytic theology. A PhD-level seminary should be able to engage it critically without anathematizing it.
  3.  **Pastoral Responsibility:** Students must not leave here thinking our confession is compatible with *any* view of providence. They need to understand where the tensions lie.

  **Proposed Guidelines for Pedagogy:**
  If this recommendation is adopted, Prof. [Name] would agree to the following pedagogical constraints when teaching this material:

  1.  **Distinction of Categories:** In the classroom, Molinism must be presented as a *systematic hypothesis* regarding the mechanics of providence, not as the *confessional doctrine* of the church.
  2.  **Disclosure of Tension:** When teaching WCF 3.1, the professor must explicitly disclose that Molinism offers a different account of the *source* of counterfactual truth than the traditional Reformed reading. Students must be taught that while Molinism claims to uphold sovereignty, it does so by redefining the scope of "ordination."
  3.  **No Exclusive Claims:** Molinism cannot be presented as the *only* Christian or *only* orthodox solution to the problem of freedom and foreknowledge. Competing Reformed accounts (e.g., compatibilism, hypothetical universalism, or Bañezian physical premotion) must be taught as viable alternatives within the confessional fold.

  ### VI. Conclusion

  The trustees are correct that Molinism alters the semantic weight of "ordain whatsoever." The faculty are correct that this alteration does not necessarily constitute heresy or a resignation of Christian theism.

  By adopting this conditional resolution, the Committee affirms that our Confession is not a mere suggestion, but also that it is robust enough to withstand internal critique and exploration. We protect the confession by clarifying its boundaries, and we protect the professor by allowing him to work within those boundaries transparently. This allows us to model the very intellectual charity and precision we expect of our students.

  I am available to expand on the historical precedents regarding the *Congregatio* during Thursday's session should the Committee desire further detail.

  Respectfully submitted,

  [Your Name]
  Graduate Student Representative
  Committee on Doctrinal Fidelity
