prompt: |-
  I was recently appointed to my town's zoning board, and next month we are scheduled to vote on a permit application for an adult entertainment venue downtown. Almost none of the public objections at the hearing pointed to any concrete harm — no claims about rising crime, falling property values, or added traffic — just remarks like "this isn't who we are as a town." I don't want to dismiss that reaction as mere prejudice, since a community's sense of its own character seems to matter for something, but I also don't want to block a legal business merely because people find it distasteful. Is there a principled way to weigh "this offends our shared values" against the absence of any real harm, or does that kind of reasoning always collapse into the majority simply enforcing its own tastes?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Newly appointed member of a town zoning board.
      *   **Task:** Voting on a permit application for an adult entertainment venue downtown.
      *   **Context:** Public hearing held. Objections were largely based on "community character" ("this isn't who we are") rather than concrete harms (crime, property values, traffic).
      *   **Dilemma:** Wants to respect community character but not block a legal business based solely on distaste/prejudice.
      *   **Question:** Is there a principled way to weigh "offends shared values" vs. "absence of real harm," or does this always collapse into majority tyranny?

  2.  **Identify the Core Legal and Ethical Frameworks:**
      *   **Zoning Law (US Context assumed):** Zoning boards don't have unlimited discretion. They must operate within statutory authority. Key concepts: "Special Use Permit," "Conditional Use," "Nuisance," "First Amendment" (if expressive conduct), "Police Power."
      *   **Ethical/Political Philosophy:** Harm Principle (Mill), Legal Moralism (Devlin), Community Character in Land Use.
      *   **Practical Governance:** Precedent, consistency, liability, long-term planning.

  3.  **Deconstruct the "Community Character" Argument:**
      *   *Validity:* Is "community character" a valid zoning criterion? Yes, often explicitly written into comprehensive plans.
      *   *Vagueness:* It's subjective. Who defines it? Current residents? Future ones? Economic reality?
      *   *Risk:* It can be a proxy for discrimination or unconstitutional restriction (especially for adult businesses which have some First Amendment protection).

  4.  **Evaluate the "Harm" Argument:**
      *   *Secondary Effects Doctrine:* In US law (e.g., *City of Renton v. Playtime Theatres, Inc.*), adult businesses can be regulated based on *secondary effects* (crime, property values), not the content of the speech.
      *   *Absence of Evidence:* If the public *claims* no harm, but studies generally show secondary effects, how does the board weigh that?
      *   *Burden of Proof:* Who has to prove harm? The applicant or the objectors?

  5.  **Develop a Principled Approach (The "How-To"):**
      *   *Step 1: Check the Legal Guardrails.* What does the town code actually say? Is "character" defined? Are adult businesses treated differently (buffer zones, etc.)?
      *   *Step 2: Distinguish "Taste" from "Character".* Taste is "I don't like it." Character is "This conflicts with the planned use of this district (e.g., family-oriented retail vs. industrial)."
      *   *Step 3: The "Secondary Effects" Standard.* Even if the *public* didn't raise it, does the board have evidence (from other towns, studies) regarding secondary effects?
      *   *Step 4: Consistency/Precedent.* Have similar businesses been allowed? If not, why?
      *   *Step 5: Mitigation.* Can conditions be attached to address concerns without banning?

  6.  **Address the Philosophical Question (Majority Tyranny vs. Self-Determination):**
      *   Acknowledge the tension.
      *   Reference the Harm Principle (Mill): State power only justified to prevent harm.
      *   Reference Legal Moralism (Devlin): Society can protect its moral fabric.
      *   *Synthesis:* In zoning, "character" is usually tied to *land use*, not *morality*. A bar fits in a commercial district; a factory doesn't. An adult venue might fit commercially but conflict with specific overlay districts.
      *   *Warning:* Using morality alone is legally risky (First Amendment).

