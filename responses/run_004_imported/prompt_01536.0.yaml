      *   *The Mixed Solution:* If I mix $T_1$ and $T_2$, I can average out the payoffs. If the average payoff of the mix is higher than $S$ in *all* columns, then $S$ is dominated.
      *   *Geometric Intuition:* Payoffs are vectors. Pure strategies are points. The set of payoffs achievable by mixed strategies is the *convex hull* of the pure strategy points. If the point representing strategy $S$ lies strictly *inside* the convex hull of the other strategies, it is dominated by a mix, even if it's not "below" any single other point in every coordinate.

