answer: |-
  This is one of the most important conceptual leaps in game theory. The transition from pure to mixed dominance is essentially a shift from looking at discrete points to looking at **convex sets**.

  Here is the intuition, the example, and the connection to best responses and order independence.

  ### 1. The Intuition: Why Pure Strategies Aren't Enough
  Imagine you are choosing a strategy, and your payoff depends on what your opponent does. If we only look at pure strategies, we are asking: "Is there one specific alternative plan that beats my current plan in every single scenario?"

  However, rational players can randomize. If you are allowed to mix strategies, you aren't limited to the specific payoff vectors of your pure strategies; you can access any **weighted average** of them.

  Geometrically, if you plot your payoffs against the opponent's strategies as coordinates, your pure strategies are points. The set of payoffs you can achieve with mixed strategies is the **convex hull** (the shape formed by stretching a rubber band around those points).

  A pure strategy might not be "below" any other single point, but it might lie **inside** the shape formed by other strategies. If it is inside, it is dominated by a mixture of the strategies on the boundary, even if no single boundary strategy dominates it alone.

  ### 2. A Compact Example
  Consider a game where Player 1 (Row) has three strategies ($U, M, D$) and Player 2 (Column) has two ($L, R$). The payoffs below are for Player 1.

  | P1 \ P2 | $L$ | $R$ |
  | :--- | :---: | :---: |
  | **$U$** | 3 | 0 |
  | **$M$** | 1 | 1 |
  | **$D$** | 0 | 3 |

  **Check for Pure Dominance:**
  *   Does $U$ dominate $M$? No. ($U$ gets 0 against $R$, while $M$ gets 1).
  *   Does $D$ dominate $M$? No. ($D$ gets 0 against $L$, while $M$ gets 1).
  *   *Conclusion:* If we only check pure strategies, $M$ survives.

  **Check for Mixed Dominance:**
  Consider a mixed strategy $\sigma$ where Player 1 plays $U$ with probability $0.5$ and $D$ with probability $0.5$.
  *   **Against $L$:** Expected payoff = $0.5(3) + 0.5(0) = \mathbf{1.5}$.
  *   **Against $R$:** Expected payoff = $0.5(0) + 0.5(3) = \mathbf{1.5}$.

  Compare this to strategy $M$:
  *   Against $L$, $1.5 > 1$.
  *   Against $R$, $1.5 > 1$.

  Strategy $M$ is **strictly dominated** by the mixed strategy $\sigma = (0.5, 0, 0.5)$, even though it was not dominated by $U$ or $D$ individually. By mixing, Player 1 hedges their bets and guarantees a higher average payoff than sticking to the "safe" middle option $M$.

  ### 3. Connection to "Never a Best Response"
  Your professor mentioned the equivalence: **A strategy is strictly dominated (by a mix) if and only if it is never a best response to any belief.**

  Here is the intuition for that equivalence:
  1.  **Beliefs are Probabilities:** A "belief" about the opponent is just a probability distribution over their columns (e.g., "I think they play $L$ with prob $p$ and $R$ with prob $1-p$").
  2.  **Expected Payoff is Linear:** Your expected payoff for any strategy is a linear combination of the payoffs in the matrix.
  3.  **The Geometry:**
      *   In the example above, if you believe $L$ is very likely, $U$ is your best response.
      *   If you believe $R$ is very likely, $D$ is your best response.
      *   Is there *any* belief where $M$ is the best response? No. Because the mixture of $U$ and $D$ yields 1.5 regardless of what the opponent does, and $M$ only yields 1. The mixture creates a "payoff floor" that is higher than $M$'s ceiling.
  4.  **The Equivalence:** If a strategy lies strictly inside the convex hull of other strategies (dominated by a mix), there is no slope (belief) you can apply to the graph that makes that inner point the highest one. Conversely, if a strategy is never a best response, it must be "surrounded" by better options, implying a dominating mixture exists.

  This is why we *must* allow mixed strategies in elimination: if we don't, we might keep strategies (like $M$) that no rational player would ever play, regardless of what they think their opponent will do.

  ### 4. Note on Order Independence (Strict vs. Weak)
  You asked why Iterated Elimination of **Strictly** Dominated Strategies (IESDS) is order-independent, while **Weakly** Dominated Strategies (IEWDS) is not.

  *   **Strict Dominance (Robust):** If Strategy $A$ strictly beats Strategy $B$ (payoff is $>$ in all cases), this relationship holds true regardless of what other strategies exist in the game. Removing a third strategy $C$ does not change the math that $A > B$. Therefore, the set of survivors is unique.
  *   **Weak Dominance (Fragile):** If Strategy $A$ weakly beats $B$ (payoff is $\ge$ in all cases, and $>$ in at least one), that relationship depends on the specific columns/rows where $A$ is strictly better.
      *   If you eliminate a different strategy $C$ first, you might accidentally remove the specific column where $A$ was better than $B$.
      *   Once that column is gone, $A$ and $B$ might yield identical payoffs, meaning $A$ no longer dominates $B$.
      *   Because the order of elimination determines which dominance relationships survive, the final result can change depending on the order you remove strategies.
