answer: |-
  This is an exceptionally sharp reading of *On Certainty*. You have identified the exact fault line where most secondary literature (and certainly most blog-post glosses) tends to crack. The tension you feel between the **diachronic fluidity** of the riverbed (§96–99) and the **synchronic rigidity** of the hinge (§341–343) is not a confusion on your part; it is the central dynamic of Wittgenstein's late epistemology.

  The short answer is: **The hinge must stay put *while the door is turning*, but the door can be taken off its hinges and put on a new frame.**

  However, unpacking that requires dismantling the Rationalist mapping of hinges to "ur-priors." That mapping is the source of most of the friction you're feeling. Here is a close reading of how those two passages cohere, why the Bayesian analogy fails, and how this relates to the regress problem.

  ### 1. Resolving the Tension: Synchronic vs. Diachronic

  The contradiction dissolves if we distinguish between the **logical role** of a proposition at a specific moment and the **historical status** of that proposition over time.

  **The Hinge (§343): A Functional Constraint**
  When Wittgenstein says, "If I want the door to turn, the hinges must stay put," he is making a claim about the *logic of investigation*, not the metaphysics of truth.
  *   **The Logic:** Doubt requires grounds. To doubt $X$, I must hold $Y$ fast to provide the context in which $X$ makes sense. If I doubt everything simultaneously, I lose the language game of "doubting." I am no longer investigating; I am babbling.
  *   **The Constraint:** Therefore, *relative to a specific inquiry*, certain propositions must function as rules. They are "exempt from doubt" not because they are incorrigibly true, but because treating them as doubtful would collapse the specific practice we are engaged in.

  **The Riverbed (§96–99): A Historical Description**
  When he describes the hardening and softening of propositions, he is looking at the *history of world-pictures*.
  *   **The Flux:** What functions as a hinge in 1700 (e.g., "The sun revolves around the earth") can become a fluid empirical proposition in 1800, and eventually a falsehood. Conversely, fluid hypotheses can harden into dogmas that function as rules.
  *   **The Shift:** The "shift of the bed itself" is the change in which propositions are *assigned* the role of hinges.

  **The Synthesis:**
  A proposition does not have the intrinsic property of "being a hinge." It *plays* the role of a hinge.
  *   **§343** says: While it is playing the role of a hinge, it cannot move (logically).
  *   **§97** says: Over time, propositions can swap roles (historically).

  Think of it like the rules of a game. While you are playing Chess, the rule "Bishops move diagonally" is fixed. You cannot move a bishop like a knight and claim you are playing Chess. That is the §343 constraint. However, over centuries, the rules of Chess *have* changed (e.g., the en passant rule, the queen's movement). That is the §96–99 flux. The rule must be fixed *for the game to be played*, but the game itself is a human practice subject to historical evolution.

  ### 2. The Bayesian Mapping: Ur-Priors vs. Grammatical Rules

  This is where the Rationalist gloss tends to go off the rails. You asked: *Is that mapping onto Bayesian priors defensible?*

  **No, because it category-errors the hinge.**

  In the Bayesian framework (and the Yudkowskyan "recursive justification" model), an ur-prior is still a **proposition** that is **truth-apt**. It is a statement about the world to which you assign $P=1$ (or a limit approaching 1). It sits at the top of the belief hierarchy.

  For Wittgenstein, a hinge proposition **looks** like an empirical proposition (grammatically), but it **functions** as a rule.
  *   **Empirical Proposition:** "There is a hand." (Can be tested, verified, falsified).
  *   **Hinge Proposition:** "Here is one hand" (said while gesturing at your own hand in normal circumstances).

  If you treat "Here is one hand" as a hypothesis with $P=0.99999$, you are still treating it as something that *could* be false. You are still in the business of verification. Wittgenstein's point in §341 is that these things are **exempt from doubt**. They are not "very certain beliefs"; they are the **scaffolding** that allows us to distinguish between certain and uncertain beliefs.

  **Why the Ur-Prior analogy fails:**
  1.  **Updateability:** An ur-prior in UDT is fixed by definition. A hinge is fixed only by function. As §96 notes, fluid propositions harden. A Bayesian prior updates via likelihood ratios. A hinge does not update; it **shifts status**. You don't gather evidence against a hinge until it ceases to be a hinge and becomes an empirical claim again.
  2.  **Truth-Aptness:** Bayesianism requires propositions to be true or false. Wittgenstein suggests hinges are neither true nor false; they are **sensible or nonsensical** within a language game. To say "The earth might not have existed 100 years ago" isn't *false* in the standard sense; it is a move that doesn't compute in our current language game of history/geology.

  **A Better Mapping:**
  If you need a Rationalist analogy, hinges are closer to **model class assumptions** or **ontology definitions** than they are to priors.
  *   **Prior:** "The coin is biased towards heads." (Updated by data).
  *   **Model Class:** "We are modeling this as a Bernoulli process." (Not updated by data; changed when the model breaks).
  *   **Hinge:** "There is an external world." (The condition for the model class to exist).

  When the riverbed shifts, it is not a Bayesian update. It is a **model class failure** or a **paradigm shift**.

  ### 3. Rationality and the Shift (Kuhn vs. Evidence)

  You asked: *Does he give us anything like an account of that transition being rational or evidence-responsive?*

  This is the hardest pill for the Rationalist to swallow. Wittgenstein's answer is largely **Kuhnian**, but with a linguistic twist.

  The shift of the riverbed is **not** driven by standard evidence. You cannot use empirical evidence to disprove a hinge, because the hinge is what defines what counts as evidence.
  *   If your hinge is "The Bible is the literal word of God," and you find a fossil, the fossil is interpreted *through* the hinge (e.g., "It's a test of faith" or "It was placed there by the Devil"). The evidence cannot touch the hinge because the hinge controls the interpretation of the evidence.

  So how does the shift happen?
  1.  **Accumulation of Friction (§99):** "Partly of sand, which now in one place now in another gets washed away." Sometimes, the friction between the hinge and the fluid propositions becomes too great. The "hard rock" erodes.
  2.  **Practical Failure:** The language game stops *working*. It ceases to be useful for prediction or coordination.
  3.  **Persuasion, not Proof:** Wittgenstein often suggests that changing a world-picture is more like a religious conversion than a scientific proof. You don't argue someone out of a hinge; you wait for the ground to shift beneath them, or you offer a new picture that makes more sense of their life.

  Is this rational? In the instrumental sense, yes (the new game works better). In the evidentialist sense, **no**. There is no "view from nowhere" from which to judge the shift. You cannot stand outside the riverbed to measure the shift. You are always standing on some bed.

  ### 4. The Regress Problem: Foundation vs. Abyss

  Finally, regarding Yudkowsky's "Where Recursive Justification Hits Bottom."

  **Yudkowsky's Project:** Find the bottom. Build a foundation that is secure enough to support the structure. The goal is to stop the regress with something *justified*.

  **Wittgenstein's Project:** Show that the demand for justification **runs out of sense**.
  *   §110: "My spade is turned."
  *   §217: "If I have exhausted the justifications I have reached bedrock, and my spade is turned. Then I am inclined to say: 'This is simply what I do.'"

  Wittgenstein is not offering a rival *answer* to the regress problem; he is **dissolving** the problem. The regress problem assumes that every belief *ought* to have a justification. Wittgenstein argues that "justification" is a move within a language game. To ask for the justification of the language game itself is a category error.

  *   **Rationalist View:** The regress stops at a Foundational Belief (Ur-Prior).
  *   **Wittgensteinian View:** The regress stops at a **Form of Life**.

  The "bottom" isn't a proposition; it's an action, a practice, a way of living. We don't believe the world exists because we have proven it; we believe it because we act in ways that presuppose it. If you try to doubt it, you don't win a philosophical point; you just stop being able to participate in the human community.

  ### Summary for the Reading Group

  To bring this back to your specific tension:

  1.  **§343 (Hinges)** describes the **synchronic necessity** of stability. You cannot doubt the framework while using the framework.
  2.  **§96–99 (Riverbed)** describes the **diachronic reality** of change. Frameworks evolve over historical time.
  3.  **The Rationalist Mapping:** Hinges are not Ur-Priors (fixed beliefs). They are **constitutive rules**. They are not updated; they are **replaced** when the practice they support fails.
  4.  **The Regress:** Wittgenstein doesn't solve the regress by finding a secure foundation; he solves it by showing that the demand for infinite justification is a misunderstanding of how language works. The "bottom" is not a truth; it is a practice.

  The tension you feel is the friction between **logic** (which demands stability) and **history** (which demands change). Wittgenstein's genius in *On Certainty* is holding both in view without collapsing into skepticism (everything is fluid) or dogmatism (everything is fixed). The hinges must stay put *for the door to turn*, but we are free to build a new door.
