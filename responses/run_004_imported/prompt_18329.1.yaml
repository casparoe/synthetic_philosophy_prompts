prompt: |-
  A close friend of mine was diagnosed with adult ADHD last year, after she brought her doctor a checklist of traits she had found circulating online. In the months since, she has become active in several ADHD communities on social media, adopted their vocabulary ("executive dysfunction," "time blindness," "ADHD paralysis"), and started redescribing large stretches of her childhood and work history in those terms, even though she used to tell the very same stories quite differently before her diagnosis. Her psychiatrist mentioned, almost in passing, that the formal criteria for the diagnosis have themselves loosened over the past decade or so, partly in order to capture adults and women whose presentation looks different from the hyperactive young boys the category was originally built around.

  Her partner, who has known her for well over a decade, has grown quietly skeptical of all this. He does not deny that she has always struggled with focus and follow-through, but he worries that the label, the online community, and the loosening criteria are together now producing a good deal of what they claim only to describe, rather than simply naming something that was already there before any of it. My friend finds this suggestion insulting, and points out that people said equally dismissive things about other psychiatric diagnoses that are now considered entirely legitimate. Having watched this same disagreement resurface over several dinners, I cannot decide whether her partner has identified a genuine problem with her diagnosis specifically, or is simply describing something that would be true of more or less any psychiatric category, and so cannot really count against this one in particular. Is there a principled way of telling these two possibilities apart, and if not, how should my friend and her partner reason about the diagnosis in the meantime?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Scenario:**
      *   **The Patient:** Adult female, diagnosed last year via online checklist + doctor. Active in online communities, adopted vocabulary, reframed life history. Feels validated but defensive against skepticism.
      *   **The Partner:** Long-term relationship (10+ years). Acknowledges struggles (focus, follow-through) but skeptical of the *label*, *community influence*, and *loosening criteria*. Worries about "looping effects" (diagnosis creating the behavior).
      *   **The Psychiatrist:** Noted criteria loosening to include adults/women (historical context).
      *   **The Observer (User):** Watching the conflict. Wonders if this is specific to ADHD (a problem with *this* diagnosis) or general to psychiatry (a problem with *any* diagnosis). Wants a principled way to distinguish these, or advice on how to proceed if not.
      *   **Core Philosophical/Clinical Question:** Is this *ontological inflation* (the diagnosis is becoming less real/valid) or *epistemic justice* (previously missed cases are now being found)? Is the "looping effect" (Hacking) a bug or a feature? How to navigate the tension between validation and over-identification?

  2.  **Analyze the Core Tensions:**
      *   **Validity vs. Utility:** Is the diagnosis "true" (validity) vs. does it help (utility)?
      *   **Discovery vs. Construction:** Was the ADHD always there (realist) or is it being shaped by the label (constructivist)?
      *   **Medicalization vs. Identity:** Is ADHD a medical condition or a social identity?
      *   **Specific vs. General:** Is ADHD uniquely susceptible to this, or is it true of all psych diagnoses (e.g., depression, anxiety, autism)?

  3.  **Address the "Principled Way to Tell Them Apart" Question:**
      *   *Can we definitively separate them?* No. Psychiatry deals with "natural kinds" vs. "practical kinds." ADHD isn't like a broken leg (clear biomarker). It's a cluster of behaviors.
      *   *The "Looping Effect":* Ian Hacking's concept is crucial here. Human kinds interact with their classification. Knowing you have ADHD changes how you act. This is true for *all* psychiatric labels, not just ADHD.
      *   *Criteria Loosening:* DSM-5 did change adult criteria. This increases sensitivity (catching more cases) but decreases specificity (risk of false positives). This is a known trade-off, not unique to ADHD but perhaps more visible due to social media.
      *   *Social Contagion vs. Awareness:* Social media amplifies both. It reduces stigma (good) but encourages self-diagnosis/identity adoption (potentially problematic).
      *   *Conclusion on "Principled Way":* There is no clean binary. It's a spectrum. The partner is describing a general phenomenon of psychiatric labeling, but the *intensity* might be specific to the current ADHD cultural moment.

  4.  **Develop Advice for the Friend and Partner:**
      *   *Validate Both:* The friend feels seen (valid). The partner sees changes (valid).
      *   *Shift from "True/False" to "Useful/Harmful":* Pragmatism over realism. Does the label help her function?
      *   *Nuance the "Excuse" vs. "Explanation":* The partner fears the label is an excuse. The friend sees it as an explanation. Need to bridge this.
      *   *Boundaries with Community:* Online communities can be echo chambers. Encourage critical engagement.
      *   *Focus on Function, Not Identity:* Treat the symptoms, don't just wear the label.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the complexity. This is a classic philosophical/sociological problem in psychiatry (Hacking, Foucault, etc.).
      *   *Section 1: The General vs. Specific Question.* Address the user's core doubt. Is this unique to ADHD?
          *   Argument: It's largely general (looping effects apply to depression, autism, etc.).
          *   Nuance: ADHD has specific amplifiers (social media, pharma, adult diagnosis boom).
          *   Verdict: The partner is describing a general feature of psych diagnosis, but the *degree* is heightened here.
      *   *Section 2: The "Looping Effect".* Explain Ian Hacking. Labels change people. This isn't necessarily fake; it's how human psychology works.
      *   *Section 3: Criteria Loosening.* Address the psychiatrist's comment. Sensitivity vs. Specificity. Women were underdiagnosed. Correction is good, but risks over-correction.
      *   *Section 4: How to Reason (Pragmatic Approach).* Move away from "Is it real?" to "Is it working?"
          *   For the Friend: Beware of identity foreclosure (I *am* ADHD, so I *can't* do X).
          *   For the Partner: Beware of invalidation. Acknowledge the struggle regardless of the label.
          *   For the Relationship: Focus on shared goals (functioning, happiness) rather than etiology.
      *   *Conclusion:* Summarize. The diagnosis is a tool, not a truth.

