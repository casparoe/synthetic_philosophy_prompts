answer: |-
  The wind on the Pampa Amarilla never really stops. It hums through the guy-wires of the fluorescence detectors, a constant B-flat that Elena had stopped hearing years ago. Inside the control room, the air conditioning rattled harder than the wind, smelling of stale coffee and ozone.

  "It's not the dipole," Raj said. He was pointing at the screen, where a skymap of ultra-high-energy cosmic rays bloomed in false color. "Auger found the dipole back in '17. That's large-scale structure. Nearby galaxies. This… this is different."

  Elena leaned in, rubbing eyes gritty from a double shift. They were looking at events above $5 \times 10^{19}$ eV. The GZK cutoff zone. "Show me the systematics again."

  "We swapped the reconstruction algorithms. We checked the atmospheric monitoring data. We even looked at the moon modulation." Raj tapped the keyboard, rotating the map. "Look at the azimuthal distribution relative to the CMB frame. It's not isotropic. It's not even a dipole. It's got a four-fold symmetry."

  Elena felt a cold knot tighten in her stomach. She knew where Raj was going. It was the kind of talk that got you laughed out of conferences, or worse, pitied. "Beane, Davoudi, and Savage," she said quietly.

  "2012 paper," Raj nodded. "If spacetime is a lattice, rotational symmetry breaks at high energies. The lattice spacing imposes a preferred frame. If the cutoff is happening because we're hitting the grid resolution…"

  "Then the cosmic rays shouldn't just stop," Elena finished. "They should scatter differently depending on their angle relative to the lattice axes."

  "Exactly. And look at the clustering. It's cubic, Elena. It's literally a cube projected onto the celestial sphere."

  Marcus walked in then, shaking dust off his jacket. He was the oldest of them, a theorist who had drifted into philosophy after the LHC found nothing but the Higgs. He poured himself coffee, eyeing the screen. "You two look like you've seen a ghost. Or a God."

  "Maybe both," Raj said, too quickly.

  Elena shot him a look. "We're seeing anisotropy in the UHECRs that aligns with a Cartesian grid. Raj thinks it's the simulation hypothesis."

  Marcus took a slow sip of coffee. He didn't laugh. That was worse. He pulled up a chair and sat heavily. "Show me the p-value."

  "Five sigma," Raj said.

  "Local or global?"

  "Global."

  Marcus stared at the map for a long time. The wind hummed outside. "So. You want to write a paper claiming empirical evidence that we are living in a computer simulation."

  "Not claiming," Raj corrected. "Suggesting. The signature matches the lattice QCD prediction for discretized spacetime."

  "The signature matches *a* discretized spacetime," Marcus said. His voice was flat, tired. "Do you know what happens if you put 'Simulation Argument' in the abstract? You won't just be rejected. You'll be flagged. Funding agencies don't fund metaphysics. They fund physics."

  "It's not metaphysics if it's in the data," Raj snapped.

  "It's underdetermined," Marcus said. He turned to Elena. "You know this. We find discreteness at the Planck scale? That could be Loop Quantum Gravity. It could be Causal Dynamical Triangulations. It could be a fundamental property of quantum spacetime. Why does it have to be a simulation?"

  "Because of the symmetry breaking," Raj argued. "It's too clean."

  "Nature is clean until you look close enough," Marcus countered. "And even if it is a lattice… Bostrom's argument isn't about physics. It's probabilistic. It's anthropic. It says *if* civilizations reach post-human status, *and* they run ancestor simulations, *then* we are likely in one. Finding a lattice doesn't prove a simulator. It just proves spacetime isn't continuous. You're conflating a substrate with a purpose."

  Elena rubbed her temples. "Marcus is right, Raj. Finding a grid doesn't tell us who built it. Or why. Or if 'who' even applies."

  "But it's the only model that fits!" Raj's voice rose. "The astrophysical models don't predict cubic symmetry at the GZK cutoff. They predict source clustering. This is structural."

  "It's a signature of *new physics*," Marcus corrected firmly. "That is what you write. You write that there is evidence for Lorentz symmetry violation consistent with a discrete spacetime structure. You leave the simulation stuff out of the draft. You leave it out of the discussion. Maybe you whisper it at the bar after the conference."

  "That's cowardice," Raj said.

  "It's rigor," Marcus said. "Science is about the most conservative explanation that fits the data. 'We are in a simulation' is the least conservative explanation imaginable. It invokes agents, intent, computational limits… Occam's Razor would cut us to ribbons."

  "Occam's Razor assumes the universe is simple," Raj muttered. "Not simulated."

  Elena looked back at the screen. The dots glowed green against the black. For thirty years, she had chased particles, trusting that the math described reality. Now, the math was suggesting the paper was grid-lined. It was terrifying, not because it was impossible, but because it was possible.

  "If we publish this as 'new physics'," Elena said slowly, "the theorists will tear it apart. They'll demand independent verification. IceCube. Telescope Array. It'll take years."

  "And if we hint at the rest?" Raj asked.

  "Then we become jokes," Marcus said. "I've seen careers end for less. I've seen good physicists start chasing cold fusion because they found a blip they couldn't explain. You want to be the person who cried 'simulation'?"

  "I want to be honest," Raj said.

  "Honesty requires acknowledging the underdetermination," Marcus said. He stood up and walked to the window, looking out at the dark pampa. "Bostrom's trilemma is about credences. It's about how you should bet. It's not a physical theory you can falsify with a cosmic ray. If we find the lattice, we haven't solved the philosophy. We've just found the hardware. We still don't know if there's a user."

  The room fell silent. The data sat on the screen, undeniable and mute. It showed a grid. It showed a limit. It did not show a creator.

  Elena opened a new document on her terminal. The cursor blinked. *Draft: Anisotropy in UHECR Distribution at the GZK Cutoff.*

  "We run the blind analysis again," Elena said. "Triple check the atmospheric corrections. If it holds… we write it up as Lorentz violation. Discrete spacetime structure."

  "And the rest?" Raj asked.

  Elena looked at Marcus. He was still looking out the window, watching the wind shake the detectors.

  "The rest," Elena said, "goes in the email subject line that none of us ever send."

  She started typing. The keys clacked loudly in the quiet room, a small, discrete sound in the dark. Outside, the wind continued to blow, indifferent to whether it was moving air or code.
