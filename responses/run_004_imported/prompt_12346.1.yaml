  2.  **Speaker Meaning vs. What is Said (Section b):** This is the bigger issue. The student writes: *"it shows that the implicature isn't really something A means or intends... it belongs to the reader's interpretation rather than to the speaker's meaning."* For Grice, **implicature is absolutely part of speaker meaning** (what the speaker intends to communicate). Cancellability shows that implicature is not part of **what is said** (the literal/truth-conditional content), not that it isn't part of what the speaker means. The student conflates "speaker meaning" with "literal meaning." This is a common misunderstanding, but it contradicts Grice's central thesis about intention in communication.
