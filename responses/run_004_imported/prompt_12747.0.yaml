  **MEMORANDUM**

  **TO:** Extenuating Circumstances Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Policy Revision: Documentation vs. Self-Certification

  As we prepare to vote on the proposed revision to our extenuating circumstances policy, I am writing to outline my position and recommend a path forward. The recent denial of a student's claim due to the unavailability of a foreign death certificate highlights a critical flaw in our current reliance on mandatory documentation: it privileges the *proof* of hardship over the *reality* of hardship.

  **Recommendation**
  I recommend that the committee **adopt the proposal to shift to a self-certification model**, wherein a student's consistent, signed statement is accepted as sufficient evidence by default. Documentation should be requested only in cases where there is specific, articulated reason to doubt the claim, or for repeated submissions by the same student.

  **Review Time Frame**
  To ensure accountability, I propose we implement this policy on a **probationary basis for one academic year**. We will reconvene at the start of the next autumn term to review data on submission volumes, approval rates, and any identified instances of misuse before making the change permanent.

  **Addressing the Primary Objection**
  The strongest objection to this proposal, raised by several colleagues, is that removing mandatory documentation constitutes an abandonment of due diligence and invites fraud. This concern is valid; we must safeguard the integrity of our academic standards.

  However, we must engage honestly with the limitations of our current "due diligence." A doctor's note or death certificate verifies only that a document exists, not necessarily that the specific circumstance prevented coursework completion. Furthermore, the current policy imposes a high burden of proof that disproportionately affects students from marginalized backgrounds or those facing crises where bureaucracy is inaccessible (such as the recent case).

  We must weigh the risk of false positives (a student successfully claiming an extension without cause) against the risk of false negatives (a student in genuine crisis being denied support). While self-certification may increase the former, the current policy guarantees the latter in specific, unavoidable cases. Moreover, submitting a false signed statement remains a disciplinary offense under existing academic misconduct codes. We can punish dishonesty retrospectively without presuming it prospectively.

  **Conclusion**
  Treating a student's word as inherently suspect requires justification, just as accepting it does. Given the inequities inherent in documentation requirements, I believe the ethical weight lies in trusting the student unless given reason not to. I urge the committee to support this motion.
