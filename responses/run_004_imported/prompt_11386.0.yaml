answer: |-
  **Setting:** *A cluttered philosophy office, late afternoon. Sunlight cuts through stacks of journals. Julian (Defender of the Buck-Passing Account) is leaning back in his chair. Elena (Critic) is perched on the edge of the desk, holding a mug of tea.*

  **Julian:** Look, the elegance of the Buck-Passing Account (BPA) is that it demystifies value. We don't need some spooky, non-natural property of "goodness" hovering over things. To say the Grand Canyon is good is just to say there are reasons for us to value it—to admire it, to protect it, to visit it. Value reduces to reasons for pro-attitudes.

  **Elena:** It is elegant. I'll give you that. It's also wrong. Or at least, it's incomplete. You're conflating *reasons to have an attitude* with *the attitude being fitting*.

  **Julian:** But on my view, those are the same thing. If there's a sufficient reason to admire $X$, then $X$ is admirable. That's the analysis.

  **Elena:** Okay, let's run the classic case. The Demon. Imagine an evil demon threatens to torture your family unless you admire this saucer of mud. Just admire it. Right now.

  **Julian:** I don't want to admire the mud.

  **Elena:** Irrelevant. Do you have a reason to do it?

  **Julian:** Yes. To save my family.

  **Elena:** So, according to the BPA, since there is a decisive reason for you to have a pro-attitude toward the saucer of mud, the saucer of mud is *good*. Or at least, admirable.

  **Julian:** That's absurd. The mud is worthless.

  **Elena:** Exactly. You have a reason to admire it, but it lacks admirability. Therefore, value cannot simply be "there being reasons for a pro-attitude." This is the Wrong Kind of Reasons (WKR) problem. The demon gives you a reason of the *wrong kind*.

  **Julian:** Fine. I accept the distinction. The BPA needs a qualifier. It's not just *any* reason. It has to be the *right kind* of reason.

  **Elena:** Okay, now we're making progress. But this is where you usually get into trouble. How do you distinguish the right kind from the wrong kind without smuggling value back in?

  **Julian:** It's not hard. We distinguish between *object-given* reasons and *state-given* reasons. The demon's threat is a reason to *want* to admire the mud, or a reason to bring it about that I admire the mud. It's a reason concerning the *state* of having the attitude. But it's not a reason given by the properties of the object itself.

  **Elena:** Go on.

  **Julian:** For the Grand Canyon, the reasons are object-given. Its vastness, its beauty, its geological history. These properties cite features of the Canyon. They make the attitude of admiration appropriate to the object. For the mud, the demon's threat cites a feature of the *consequences* of my admiring, not the mud itself. So, the revised BPA is: $X$ is good iff there are *object-given* reasons to have a pro-attitude toward $X$.

  **Elena:** That's the standard Parfitian move. But here's the squeeze, Julian. How do you identify an "object-given" reason without already knowing what makes the object valuable?

  **Julian:** I just did. It's a reason that cites properties of the object.

  **Elena:** Does the demon's threat cite a property of the object?

  **Julian:** No, it cites a property of the situation.

  **Elena:** But suppose the mud has the property: *'Being such that a demon will torture people unless it is admired.'* That is a property of the mud. It's a relational property, sure, but it's true of the mud. If I admire the mud *because* it has that property, am I not responding to a feature of the object?

  **Julian:** That's... tricky. But intuitively, no. That property isn't an "admiration-worthy" property.

  **Elena:** Aha! There it is. "Admiration-worthy." You're defining the right kind of reason by appealing to whether the property makes the attitude *worthy* or *fitting*.

  **Julian:** I'm trying to avoid that word.

  **Elena:** You can avoid the word, but not the concept. To distinguish object-given from state-given reasons in a way that solves the WKR problem, you have to say which properties of the object count. If you say "any property," the demon's relational property counts, and the mud becomes good. If you say "only some properties," you have to explain which ones.

  **Julian:** The ones that make the attitude fitting!

  **Elena:** Precisely. So your analysis becomes: $X$ is good iff there are reasons to value $X$ that make valuing $X$ *fitting*. But "fitting" just means "warranted by the value of the object." You're saying: $X$ is good iff there are reasons to value $X$ grounded in $X$'s goodness. That's circular. You haven't reduced value to reasons; you've presupposed value to filter the reasons.

  **Julian:** *Pauses, tapping a pen against his chin.* Okay, that's the circularity charge. I get it. If the criterion for "Right Kind of Reason" (RKR) is "reasons that reflect the value," I haven't analyzed value. I need a criterion that is independent of value.

  **Elena:** Exactly. Can you give me one?

  **Julian:** What about the *guidance* condition? Object-given reasons are those that can guide the attitude directly. I can't admire the mud *just* because of the demon. Admiration isn't under direct voluntary control in that way. I can't flip a switch. But I can admire the Canyon because I perceive its grandeur. The reasons have to be the kind that can actually motivate the attitude in the right way.

  **Elena:** Two problems. First, some people *can* whip up admiration voluntarily. A method actor, say. If they admire the mud to save their family, and they succeed, does the mud become good?

  **Julian:** No, because the *reason* they used was still the threat.

  **Elena:** But you just said the test was whether the reason *could* guide the attitude. If the threat *did* guide the attitude, it passes your test.

  **Julian:** Alright, fair. Let's try a higher-order move. This is from Rabinowicz and Rønnow-Rasmussen. We distinguish between reasons to *have* the attitude and reasons that make the attitude *correct*.

  **Elena:** "Correctness" sounds suspiciously like "Value."

  **Julian:** Hear me out. We say value is defined by reasons that make the attitude *correct* in a constitutive sense. The demon's reason makes it *prudent* to admire, but not *correct* to admire. Correctness is internal to the attitude. To admire is to represent something as admirable. If you admire for the wrong reason, you're in a sense malfunctioning as an admirer.

  **Elena:** So you're grounding the distinction in the *nature of the attitude* itself?

  **Julian:** Yes. The "constitutive aim" of admiration is to track admirability. The demon's threat doesn't help you track admirability; it just forces the output. So, we filter reasons by whether they align with the constitutive aim of the attitude.

  **Elena:** This is better, Julian. But it still feels like you're kicking the can. You say the aim of admiration is to track *admirability*.

  **Julian:** Right.

  **Elena:** But what is admirability?

  **Julian:** It's... the property that warrants admiration.

  **Elena:** Which brings us back to the start! If you say "The BPA explains value," but you need to invoke "admirability" to filter the reasons that constitute value, you haven't explained value. You've just pushed the term "value" into the term "admirability" or "correctness."

  **Julian:** But "admirability" isn't a separate metaphysical property! It's a structural feature of the attitude. It's like truth for belief. You can't believe something just because it's useful; you have to believe it because it's true. That's what belief *is*.

  **Elena:** I agree with the analogy. But does that help you *reduce* value? If I ask, "What is truth?" and you say, "Truth is what you ought to believe," and I ask "What ought I to believe?" and you say, "What is true," you haven't told me what truth is. You've told me how it functions.

  **Julian:** Maybe that's all we can do! Maybe value isn't a substrate to be reduced. Maybe the BPA isn't a reductive analysis but a structural one. It tells us that value claims are claims about reasons. The WKR problem just reminds us that not all reasons count.

  **Elena:** But if you can't specify *which* reasons count without using value-laden terms like "fitting," "worthy," or "correct," then the theory loses its explanatory power. It was supposed to explain value in terms of reasons. Now you're explaining which reasons count in terms of value. The direction of explanation has collapsed.

  **Julian:** *Sighs.* So you think the only way out is to admit that "fittingness" is primitive?

  **Elena:** I think if you admit fittingness is primitive, you might as well be a value realist. You're saying there is a normative relation of fittingness between minds and objects. The BPA was supposed to eliminate that relation in favor of plain old practical reasons.

  **Julian:** But practical reasons are normative too!

  **Elena:** Yes, but the hope was that "reasons for action" or "reasons for attitudes" were more basic than "Value." The WKR problem suggests that to sort the reasons, you need a prior notion of Value.

  **Julian:** Let me try one last angle. What if we appeal to shared rationality? Object-given reasons are those that any rational agent would acknowledge as counting in favor of the attitude, *independent* of their particular desires or threats.

  **Elena:** The demon threat applies to any rational agent. Any rational agent wants to avoid torture.

  **Julian:** But it doesn't stem from the object.

  **Elena:** We're back to the property distinction. Is "being the target of a demon's ultimatum" a property of the object-situation complex? Yes. Is it a reason a rational agent acknowledges? Yes. Why isn't it the right kind?

  **Julian:** Because it doesn't make the mud *merit* admiration.

  **Elena:** *Smiles.* "Merit." There it is again.

  **Julian:** *Laughs, rubbing his temples.* Damn it.

  **Elena:** You can't exorcise the ghost of value, Julian. Every time you try to filter the reasons to save the theory, you have to reach for the very thing you're trying to analyze. You need "merit" to define the right reasons, but you need the right reasons to define "merit."

  **Julian:** Okay. So, is the BPA dead?

  **Elena:** Not dead. But humbled. It can't be a strict reduction. It's more of a conceptual link. Value implies reasons, certainly. But reasons don't constitute value unless we already know which reasons are the valuable ones.

  **Julian:** So the WKR problem shows that the Buck-Passing Account is circular?

  **Elena:** It shows it's not reductive. It might still be true that value *supervenes* on reasons. But you can't define value *as* reasons without a non-circular account of the Right Kind. And so far, every account of the Right Kind looks like it presupposes Value.

  **Julian:** Maybe that's okay. Maybe we stop trying to reduce value and just accept that value and reasons are mutually illuminating. A coherentist approach rather than a foundationalist one.

  **Elena:** Now *that* I can drink to. *She raises her mug.*

  **Julian:** *Clinks his coffee cup against it.* To the Wrong Kind of Reasons. May they continue to keep us humble.

  **Elena:** And may we stop trying to pass the buck.
