      *   *Key Concept:* **Leibniz Equivalence**. If two mathematical models are related by a diffeomorphism, they represent the same physical reality.
      *   *Resolution:* Reject "Manifold Substantivalism" (the idea that points have identity independent of the fields). Accept that observables must be diffeomorphism-invariant.

