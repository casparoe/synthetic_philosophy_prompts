      *   **Point 2: Reason vs. Passion.** Hume: Reason calculates means, Passions set ends. PE: Reason (logic) dictates the end (cooperation). Hume would call this a category error.
      *   **Point 3: Moral Sentiment vs. Rational Necessity.** For Hume, justice becomes a *moral feeling* (approval/disapproval). In PE, it's just a winning move. No virtue without the possibility of vice.
      *   **Point 4: The Role of Time/Convention.** Hume needs the "slow progression." PE is timeless. Hume would argue PE lacks the social glue (sympathy) that makes society stick when the code isn't running.
