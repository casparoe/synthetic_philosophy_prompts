answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Elena (philosophy of psychiatry) and Marcus (clinical psychologist) are grading papers, but the stack between them is ignored.*

  **Elena:** You saw the new meta-analysis on the "TikTok DID" cohort? The average number of reported alters has jumped from three to… what was it? Fourteen? In five years.

  **Marcus:** I saw it. Fourteen is the mean, but the outliers are claiming hundreds. Whole "system maps" that look like org charts.

  **Elena:** Exactly. It's the *Sybil* effect all over again, but accelerated by an algorithm instead of a miniseries. In the eighties, everyone had a violent male protector and a traumatized child. Now, they have "trauma holders," "gatekeepers," and "fictives" based on anime characters. It's Ian Hacking's looping effect in real-time. The classification is eating the patient.

  **Marcus:** Careful, Elena. You're sliding into "it's all social construction" territory. Just because the *presentation* shifts doesn't mean the underlying pathology is fake. Trauma dissociation is neurobiological. It's real.

  **Elena:** I'm not saying the suffering is fake. I'm saying the *category* is unstable in a way "leukemia" isn't. If I tell a patient they have leukemia, they don't develop new white blood cell mutations to match the textbook description. But if I tell a dissociative teen they have DID, and they go home to an algorithm that rewards them for finding more parts… the diagnosis changes the person, which changes the diagnosis. That's the loop. It makes psychiatric kinds uniquely shaky.

  **Marcus:** But you're treating "DID" like it's a static box we're trying to fit people into. It's not. Look at the 1990s MPD wave. When the DSM-IV tightened the criteria and the media moved on, the "hundreds of alters" phenomenon vanished. Now it's back because the medium rewards complexity. That doesn't mean the dissociation isn't happening; it means symptom expression is always culturally mediated.

  **Elena:** Mediated, sure. But Hacking's point about "interactive kinds" is that the mediation *constitutes* the kind. A "TikTok alter" isn't just a symptom; it's a role people are actively auditioning for. I've seen videos of kids doing "alter intros." They are performing the category into existence. If the category relies on that performance to stay stable, is it a medical kind, or is it a feedback loop of expectation?

  **Marcus:** It's a medical kind with a loud cultural signal. You're ignoring the base rate. We aren't seeing a spike in dissociation because of TikTok; we're seeing a spike in *identification*. These kids were suffering in silence before. Now they have a vocabulary. Is it better that they suffer anonymously, or that they find a community, even if that community has some… eccentric ideas about system maps?

  **Elena:** It's better if the treatment works. But if the category loops, the treatment targets a moving ghost. In the 90s, therapists used hypnosis to "hunt" for alters, which created more alters. Now, the algorithm does the hunting. If a kid feels a mood shift, the comment section tells them, "That's not you, that's your inner child alter." You're reifying transient states into entities. That's not just cultural mediation; that's ontological inflation.

  **Marcus:** Ontological inflation is a fancy way of saying "people are using language to describe their interiority." Listen, you're holding psychiatry to a standard physics doesn't even meet. You said leukemia doesn't change under observation. What about antibiotic resistance? We classify bacteria, we apply pressure, the bacteria evolve. The classification and the intervention change the biological reality.

  **Elena:** That's evolution, Marcus. The bacteria don't *know* they're being classified. They aren't watching videos about how to be a resistant staph infection. That's the difference between "indifferent kinds" and "interactive kinds." Rocks don't change when you call them sedimentary. People do. And with DID specifically, the "alter" is a self-concept. If you change the self-concept, you change the disease. That makes the category dependent on the subject's knowledge of the category. That is fundamentally different than bacteria.

  **Marcus:** Is it? If I diagnose someone with social anxiety, and they start avoiding parties because "that's what anxious people do," I've created a loop. They are performing the diagnosis. Do we throw out social anxiety disorder?

  **Elena:** Social anxiety is a behavior pattern. DID is posited as a structural division of the self. The stakes are higher. If the "structure" is being built by the expectation of the structure, then the DSM criteria aren't discovering a thing; they're providing a script. In the 90s, we saw the "Satanic Ritual Abuse" panic get baked into MPD diagnoses. Now we see "neurodivergent systems" baked into TikTok DID. The content of the disorder is entirely porous to the cultural moment.

  **Marcus:** The content is porous. The mechanism isn't. Dissociation is a defense mechanism against overwhelm. Whether you call it "possession," "MPD," or "Systemhood," the brain is compartmentalizing trauma. The script changes, yes. In the Victorian era, it was fainting fits. In the 2020s, it's switching alters. If you dismiss the category because the script is trendy, you abandon the people holding the script.

  **Elena:** I don't want to abandon them. I want to stop reinforcing the loop. If the diagnosis itself is the vector for the symptom escalation, isn't our ethical duty to be cautious with the label? Hacking argued that when looping becomes harmful, we need to rethink the classification. Right now, the "DID" label on TikTok encourages people to dig for more trauma and more parts to validate their identity. It's gamified pathology.

  **Marcus:** So your solution is to gatekeep the diagnosis? "Sorry, your alters look too much like the TikTok trend, so you must not be real." That's clinically disastrous. You'll miss the actual dissociative kids who *do* fit the criteria because you're afraid of the noise.

  **Elena:** My solution is to admit that psychiatric kinds aren't like natural kinds. They're historical kinds. They exist in time. The "DID" of 1995 is not the "DID" of 2024. If we treat them as the same static entity, we fail. We need to account for the algorithm in the etiology.

  **Marcus:** I agree it's not a static entity. But that doesn't make it "shaky." It makes it dynamic. Look, take diabetes. If we invent insulin, the population of diabetics changes. They live longer, they reproduce, the genetics shift. The "kind" changes because of our intervention. Psychiatry is just more sensitive because the intervention is linguistic.

  **Elena:** But insulin doesn't tell the diabetic *how to feel*. The "DID" label tells the patient *who they are*. It offers a narrative identity. "I'm not a messy teenager; I'm a system with a protector alter." That's empowering, I get it. But it also locks them into a chronic, fragmented identity that might be harder to integrate later. The loop creates a self-fulfilling prophecy of permanence.

  **Marcus:** Or it gives them a framework to understand why they lose time. Why they find clothes in their closet they don't remember buying. Without the label, that's psychosis or lying. With the label, it's manageable. The "loop" cuts both ways. It can exacerbate symptoms, but it can also organize chaos.

  **Elena:** I suppose my worry is that we're mistaking the map for the territory. When the territory starts reshaping itself to look like the map…

  **Marcus:** …Then we update the map. That's science. The 80s MPD wave taught us not to use leading questions in therapy. The TikTok wave should teach us not to use leading questions in algorithms. But we don't burn the map. We just acknowledge that in psychiatry, the map talks back.

  **Elena:** "The map talks back." I can live with that. As long as we admit that when the map talks back, it's not just revealing truth—it's co-authoring it.

  **Marcus:** Deal. But I'm still diagnosing the kid with the fourteen alters. Because even if fourteen is inflated, zero is a lie.

  **Elena:** Fine. But document the inflation. If we don't track the loop, we're just part of the noise.
