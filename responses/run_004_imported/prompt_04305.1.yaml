  can't decide if that's an actual deep problem for psychiatric categories or if i'm overthinking it, since arguably every category shifts once it's studied closely (species, elements, whatever) and that doesn't make biology fake. can you write me a dialogue between two people who both really know this stuff, arguing it out with the tiktok/DID case as the actual example the whole way through instead of staying abstract? one of them should think looping shows something uniquely shaky about psychiatric kinds specifically, the other should think that's overblown - and i want real back and forth where they respond to each other's specific points, not just alternating speeches.
