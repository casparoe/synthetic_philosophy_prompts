          *   Mention the metaphysics of character traits (Schwartz, Snow).
      *   **Conclusion:** Encouraging summary. The intuition is good, but the metaphysical machinery needs tuning for psychological properties.

  7.  **Refining the Tone:**
      *   Ensure I don't sound like I'm saying "Go get a degree." Instead, "Here is how the pros handle this."
      *   Acknowledge the sophistication of the "masking vs. finking" intuition.
      *   Be careful with the "fink" definition. A fink removes the disposition. A mask keeps it. If the uncle *became* courageous only in the fire, did he *have* the disposition before? If not, it's not masking. If he did, why didn't it show?
      *   *Self-Correction on Finking:* In the wire case, the wire *loses* conductivity. In the uncle case, if he *gains* courage, that's not finking the *courage* (since he didn't have it). It might be finking the *cowardice* (he had cowardice, lost it when tested). Or, if he had courage, it was masked. The user argues for masking. I need to press on *evidence* for the pre-existing courage.

