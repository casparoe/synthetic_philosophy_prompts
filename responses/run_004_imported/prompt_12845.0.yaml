      *   **Finkish Dispositions:** A disposition is lost *just before* the stimulus occurs (e.g., the live wire loses conductivity when touched). The disposition is *gone* at the moment of testing.
      *   **Masked Dispositions:** The disposition remains, but something prevents the manifestation (e.g., bubble wrap prevents breaking, antidote prevents poisoning). The disposition is *present* but blocked.
      *   **Situationism (Doris):** Argues against global character traits (virtues/vices) based on empirical evidence that behavior varies wildly across situations.
      *   **The User's Argument:** The uncle had courage all along (disposition present), but it was masked in childhood (by anxiety/stakes). The fire removed the mask. This saves character traits from situationism.

  3.  **Evaluate Question 1: Masking vs. Finking vs. Other:**
      *   *Finking:* Did the uncle *lose* the disposition to be cowardly when the fire happened? Or did he *gain* courage? If he was essentially cowardly, and the fire made him courageous temporarily, that sounds like a *finkish lack of courage* (the lack of courage disappears when tested) OR a temporary acquisition of a new disposition.
      *   *Masking:* Did he have courage all along, but it was blocked? The user suggests social anxiety/stakes masked it.
      *   *Critique:* In the wire/poison cases, the intrinsic property stays the same (molecular structure of glass, electrical setup). In the uncle's case, are we talking about an *intrinsic* psychological state?
