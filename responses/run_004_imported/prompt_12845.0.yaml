      *   *Refinement:* The user needs to specify *independent evidence* for the mask. We need to know *why* it was masked other than "he didn't act courageously." (The user mentions social anxiety/stakes—this helps, but needs empirical backing).
      *   *Verdict:* It risks relocating the disagreement. To work, the "mask" must be identifiable independently of the failure to manifest.

