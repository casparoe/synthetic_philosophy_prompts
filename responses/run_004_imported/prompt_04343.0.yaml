      *   *The Verdict:* He wouldn't pick a "team." He'd likely be a **Multilevel Selectionist**. He'd appreciate the gene as the *mechanism* but the individual/group as the *vehicle* of selection depending on context.
      *   *Nuance:* Mention that the debate is largely settled as "mathematical equivalence" now (Okasha, etc.). Darwin would like that synthesis.

