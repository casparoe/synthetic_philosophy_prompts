answer: |-
  The wind off Dupont Circle was sharp enough to cut through Elias's wool coat, but he stayed on the bench, his tablet glowing with a grant proposal. He was reviewing a request for funding to study mechanistic interpretability in transformer models. The ask was two million dollars. The projected impact was a 0.04% reduction in existential risk over the next century. Elias had run the numbers twice. The expected value was positive. It was a good grant. It was the kind of math he had built his career on.

  "Excuse me. Do you have a moment for the future?"

  Elias looked up. The man standing before him was nondescript—gray jacket, clean but worn shoes, the kind of face you'd forget in a crowd. He wasn't holding a cup or a sign. He was holding a phone, screen dark.

  "I'm working," Elias said, tilting the tablet away.

  "It's about the calculation you're doing," the man said. His voice was calm, devoid of the manic energy usually reserved for park bench prophets. "You're weighing cost against probability times impact. You're doing expected utility maximization."

  Elias stiffened. "I'm reviewing a budget."

  "You're allocating resources to mitigate low-probability, high-stakes events," the man corrected gently. "That's what I'm doing too. I need five hundred dollars."

  Elias let out a short breath, a laugh that wasn't funny. "Okay. And what do I get?"

  "I have access to a cryptographic key. It's a backdoor into a simulation layer. I can't prove it to you with physics you accept, because the proof requires access you don't have. But if I don't renew the server lease associated with the key within the hour, the containment field degrades. The probability of total informational cascade is one in ten billion."

  Elias knew the script. This was Pascal's Mugging. It was a joke in the office, a way to poke fun at the extremes of long-termism. *Give me five dollars or I'll torture 3^^^3 people.* They laughed about it over craft beer after retreats. They laughed because the numbers were absurd.

  But this man wasn't citing hyper-exponents. He was citing one in ten billion.

  "And the stake?" Elias asked, his voice flat.

  "Ten to the twenty-four future conscious experiences. Roughly the capacity of the accessible universe."

  Elias did the math. It was automatic, a reflex honed by years of seminars and papers. One in ten billion times ten to the twenty-four. The expected value was astronomical. Even if the probability was actually one in a trillion, the expected value dwarfed the two million dollars on his tablet. It dwarfed the GDP of nations. For five hundred dollars, he could buy more expected utility than his entire organization had generated in a decade.

  "You're mugging me," Elias said.

  "I'm offering you a trade," the man said. "You know the arguments. You know that if you reject me solely because the number is large, you're violating your own axioms. You're imposing a bounded utility function because the unbounded truth is inconvenient."

  Elias looked at his tablet. The grant proposal suddenly looked fragile. Why was that document real and this man not? Because the document had letterhead? Because three PhDs had signed it? Credentials were just social heuristics for probability estimation. They didn't change the math. If this man was telling the truth, even with a probability of 0.0000000001, Elias was morally obligated to pay. To walk away was to choose death for quadrillions of future beings to save five hundred dollars.

  "I have a leverage penalty," Elias said, hearing how hollow it sounded. "The claim that I, specifically, can affect this many people is evidence that the claim is false. The probability drops in proportion to the impact."

  The man nodded. "Convenient. So if I claimed I could save only ten people, you'd listen? But because I claim to save everyone, I'm automatically lying? That's not a Bayesian update, Elias. That's a shield."

  Elias stood up. His legs felt unsteady. The wind bit at his face. He looked around the park. Joggers passed, dogs barked, life continued in its mundane, unoptimized rhythm. None of them were carrying the weight of the accessible universe in their pockets.

  "Why me?" Elias asked.

  "Because you're holding the tablet. Because you look like you understand the cost of hesitation."

  Elias reached for his wallet. His fingers trembled. This was the edge. This was where the theory met the pavement. In the conference rooms, they talked about "global priorities" and "trajectory changes" in the abstract. It was clean. It was intellectual. But here, with a stranger asking for cash to prevent a metaphysical catastrophe, the abstraction collapsed.

  If he paid, he was a fool being scammed by a lunatic.
  If he didn't pay, he was a murderer by omission, according to his own ethics.

  He pulled out a five-hundred dollar bill. He kept it crisp, for emergencies. He held it out.

  The man didn't reach for it immediately. "You feel it, don't you? The thinness of the line."

  "I feel like I'm having a breakdown," Elias said.

  "You feel the arbitrariness of your skepticism," the man said. "You reject me because I lack institutional validation. But institutions are just clusters of humans. They are wrong often. You know this. You fund research because the institutions are wrong often."

  Elias looked at the bill. It was green and inert. It couldn't buy a simulation key. It couldn't buy salvation. It was just a token of trust.

  He thought about the leverage penalty again. It was a patch. He knew it was a patch. Yudkowsky had known it was a patch. They all knew the math broke down at the extremes, so they invented brakes to keep the car on the road. But brakes didn't fix the engine.

  "If I give you this," Elias said, "and you walk away, I have no recourse."

  "If you don't," the man said, "and I was right, you have no recourse either."

  Elias's hand hovered between them. The wind whipped the corner of the bill. He wanted to scream, to call security, to run back into the think tank and hide behind peer review. But peer review was just a slower way of aggregating probabilities. It wasn't truth.

  He realized he couldn't do it. Not because the math was wrong, but because he couldn't live in a world where this was how decisions were made. If he paid, he admitted that any random person could hold his ethics hostage by inventing a big enough number. If he didn't pay, he admitted that his ethics were a costume he wore only when it was socially safe.

  He lowered his hand. He folded the bill and put it back in his wallet.

  "I can't," Elias said.

  "Because you don't believe me?"

  "Because I can't distinguish you from noise," Elias said. "And if I can't distinguish you from noise, I can't act. I have to trust the heuristic."

  "The heuristic says ignore the tail risks," the man said. He didn't look angry. He looked tired. "That's how civilizations end, Elias. By ignoring the tails because they look like outliers."

  The man turned and walked away. He didn't run. He didn't look back. He just merged into the flow of pedestrians on the path, becoming gray and nondescript again.

  Elias sat back down on the bench. He looked at the tablet. The grant proposal was still there. 0.04% risk reduction. Two million dollars. It looked safe. It looked reasonable. It looked like a lie he could tell himself without shaking.

  He locked the screen. The reflection in the black glass showed his own face, pale and uncertain. He waited for the relief of making the rational choice, the choice everyone else would make. But the relief didn't come. There was only the cold wind, and the nagging suspicion that he had just drawn a line in the sand based on nothing but the fear of looking foolish.

  He stayed on the bench until his coffee went cold, unable to work, unable to leave, wondering how many quadrillions of lives were worth the price of his own dignity.
