      *   **Point 1: The Breach of Operationalism.** Operationalism defines concepts by measurement operations. If you have to control for unobservable forces (ESP) to make the measurement valid, the measurement isn't purely operational anymore. It relies on a theoretical assumption about the *source* of the behavior.
