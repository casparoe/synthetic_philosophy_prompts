  I'm a retired physicist who's finally getting round to reading all the philosophy I skipped over during my career, and I just worked through Turing's 1950 paper on machine intelligence for the first time. I knew about the imitation game already, obviously, but I had no idea that near the end he takes extrasensory perception seriously as a genuine threat to the test - he says the statistical evidence for telepathy is basically overwhelming, and proposes running the whole game in a 'telepathy-proof room' so a psychic contestant couldn't cheat. That struck me as such a wierd thing for someone so rigorous to concede. I keep flip-flopping on whether this is just a quaint historical footnote or whether it actually causes real trouble for his approach. Please argue that Turing's telepathy-proof room fix isn't just a minor patch, but actually undercuts the basic operationalist logic behind treating the imitation game as a genuine test of thought.
