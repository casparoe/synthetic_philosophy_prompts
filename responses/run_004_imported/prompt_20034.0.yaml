answer: |-
  Good morning. Welcome to all of you.

  It is a rare privilege to spend a week in a room with people who share a specific obsession. We are all here because we believe in the weight of a single moment. We believe that a letter unsent, a horse stumbled, a nerve failed at a crucial second, can ripple outward to reshape the map of Europe. My last three books have been exercises in this belief. I suspect many of yours are, too. We are drawn to the hinge. We are drawn to the idea that history is not a river flowing inevitably to the sea, but a branching tree, and that human hands hold the pruning shears.

  But I must confess, as I prepared for this week, I found myself hesitating to stand before you. I have been rereading the end of *War and Peace*. Not the story of Pierre and Natasha, but the Second Epilogue. For those who haven't waded through it, it is where Tolstoy stops being a novelist and starts being a philosopher of history. And he is not kind to people like us.

  Tolstoy argues that the idea of the "Great Man" directing history is a superstition. He says Napoleon did not cause the invasion of Russia any more than the figurehead on a ship's prow causes the ship to move. To Tolstoy, history is the sum of an infinity of infinitesimal actions by an infinity of individuals. No single will is free. Every command is conditioned by the events that preceded it. He insists that if we want history to become a science, we must stop looking for causes in the wills of leaders and start looking at the laws of necessity. He compares it to astronomy: we had to accept that the earth moves, even though it feels stationary. Tolstoy says we must accept that we are not free, even though we feel we are.

  Reading this, I felt a chill. Because if Tolstoy is right, then the genre we practice is built on a lie. If individual choice is an illusion, then the dramatic hinge is a fake hinge. If the outcome was inevitable, then our counterfactuals are just fantasy. Are we, then, merely peddlers of comforting illusions? Are we writing historical fiction, or are we writing historical superstition?

  I do not want to stand here and tell you that Tolstoy is wrong. I am not a historian, and I am certainly not a philosopher of science. To tell you that "great men do matter" would be to ignore the overwhelming weight of social, economic, and geographic forces that constrain us all. We know that a king cannot stop an industrial revolution with a signature. We know that a general cannot fight the mud of a Russian winter.

  But I also do not want to tell you that our work is meaningless. That would be to surrender the very tool we have brought to this workshop.

  So, I want to propose a third path. I want to suggest that Tolstoy is right about history, but that he is wrong about art. And more importantly, I want to suggest that the tension between those two truths is not a bug in our craft. It is the feature.

  Consider Tolstoy himself. He wrote that Second Epilogue to tell us that individual will is irrelevant. And yet, in the body of *War and Peace*, he did the exact opposite. We do not remember *War and Peace* for its theory of calculus applied to human action. We remember it because Prince Andrei lies on the battlefield and looks up at the infinite sky. We remember it because Natasha dances. We remember it because Pierre walks the line between execution and reprieve.

  In the narrative, Tolstoy grants his characters the very agency he denies them in the essay. Why? Because while the *historian* looks backward from the end, the *novelist* must look forward from the middle.

  This is the distinction we must hold onto. History, as a science, is an act of explanation. It asks: "Why did this happen?" It traces the chain of causality back to the infinite swarm of conditions. But fiction is an act of experience. It asks: "What did it feel like when this happened?"

  To the historian looking back from 1820, the defeat of Napoleon might seem inevitable. The supply lines were overextended; the coalition was forming; the Russian geography was immutable. But to Napoleon in 1812, standing in the mud outside Moscow, the future was not a closed door. It was a fog. He did not know he was a pawn of necessity. He felt the weight of the decision. He felt the anxiety of the choice.

  That subjective experience of freedom is the only reality a human being ever knows. We cannot live in Tolstoy's macro-view. We cannot live in the calculus of infinity. We live in the moment where the hand hovers over the letter, where the heart beats faster before the order is given. Even if that choice is determined by a million prior causes, it is *felt* as a choice.

  And that is our territory.

  We are not writing the science of history. We are writing the phenomenology of history. We are not claiming to know how the universe works; we are claiming to know how it feels to be a human being inside the universe.

  So, what are we entitled to claim in dramatizing a hinge moment?

  We are entitled to claim that the hinge exists for the character, even if it does not exist for the century.

  When we write a counterfactual, when we say "What if this one thing had changed?", we are not making a claim about geopolitical mechanics. We are making a claim about moral weight. We are saying that the internal struggle of the individual is significant enough to warrant a reimagining of the world.

  Think of the counterfactual not as a physics experiment, but as a moral laboratory. In my own work, I have changed the outcome of battles based on a messenger's delay. Is it historically probable that a single messenger changes the fate of nations? Perhaps not. The tides of logistics usually swallow such delays. But by focusing on the messenger, I am not trying to teach the reader about logistics. I am trying to teach the reader about anxiety. About the burden of responsibility. About the terrifying solitude of carrying a piece of paper that might kill ten thousand men.

  If we remove the agency from our characters to satisfy historical determinism, we rob them of their humanity. A character who knows they are a pawn of history is not a character; they are a narrator. A character who believes they can change the world, who struggles against the odds, who makes a choice and suffers the consequences—that is a human being.

  Tolstoy says we must give up the "flattering illusion of individual centrality." I would argue that for the novelist, it is not an illusion. It is a requirement. It is the lens through which we see. To ask a novelist to ignore individual agency is like asking a painter to ignore color because atoms are colorless. It is technically true, but it renders the medium impossible.

  However, we must be honest about what we are doing. We cannot pretend that our hinges are the *only* things that matter. We must respect the swarm.

  The best historical fiction, I believe, acknowledges the Tolstoyan pressure. It shows the character pushing against the wall of necessity. The drama comes not from the certainty that they can move the wall, but from the cost of pushing against it.

  When you write your hinge moments this week, do not write them as magic. Do not write them as if your hero pulls a lever and the world obediently shifts. Write the friction. Write the resistance. Show the reader that the choice is small, and the forces against it are vast. Let the reader feel the improbability of the agency.

  If your protagonist decides to spare an enemy, do not let that single act end a war single-handedly. Let it end a war only because it ripples through the infinite swarm of other lives in ways that are unpredictable. Let the choice be real, but let the outcome be complex.

  We are entitled to claim that individual choice is the only way we can access history. We cannot comprehend the "infinity of infinitesimals." We cannot process the economic forces of the 19th century as a raw datum. We can only understand them through the grain merchant who cannot sell his wheat, or the soldier who cannot find his boots. The macro is only accessible through the micro.

  So, let us not be demoralized by Tolstoy. Let us be humbled by him. He reminds us that we are not gods. We cannot control the outcome of our stories any more than Napoleon could control the snow. But we are responsible for the integrity of the choice.

  There is a paradox here, and I invite you to live inside it for this week. The paradox is that history is determined, but life is free. We know, looking back, that the archduke's driver was going to take that wrong turn in Sarajevo. We know the war was coming. But the archduke did not know. The driver did not know. They lived in the freedom of the moment.

  Our job is to restore that freedom to the past.

  History books often make the past look like a procession of inevitabilities. They smooth out the bumps. They make the victors look destined to win and the losers destined to fail. This is the "stationary earth" error Tolstoy speaks of. It makes the past look safer than it was. It makes it look like it made sense.

  But it didn't make sense then. It was chaotic. It was terrifying. It was open.

  By writing counterfactuals, by focusing on the hinge, we are actually correcting the historical record in a strange way. We are restoring the uncertainty. We are reminding the reader that the future was not written. We are reminding them that the people in the past were not cardboard cutouts moving along a track; they were living, breathing agents, terrified of the dark, just like us.

  So, when you sit down to write this week, and you reach that moment where your character must choose, do not worry about whether that choice would have "actually" changed the course of the 19th century. That is a question for the historian, looking back from the shore.

  You are in the boat. You are in the storm.

  Write the hand on the tiller. Write the strain in the muscles. Write the fear that the tiller might break. Write the conviction that turning it left instead of right will save them all.

  Even if the storm swallows them anyway, the act of steering was real. The courage to steer was real. The tragedy of the wheel turning too late is real.

  Tolstoy wanted to turn history into a science. But we are not scientists. We are witnesses. And the witness does not testify about the laws of physics that governed the bullet. The witness testifies about the life that was lost.

  Let us not seek to explain the war. Let us seek to explain the soldier. Let us not seek to explain the necessity. Let us seek to explain the choice.

  If we do that, we honor Tolstoy not by repeating his philosophy, but by emulating his art. We honor the complexity of the world by admitting that we cannot see the whole of it, only the part that stands before us, demanding a decision.

  The earth moves, yes. But we still have to walk on it. And how we walk, where we step, and who we help across the ice—that is our story.

  Welcome to the workshop. Let us get to work.
