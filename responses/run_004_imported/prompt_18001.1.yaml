prompt: |-
  My aunt died last week and I somehow got roped into speaking at her memorial. She'd spent something like 35 years running a little Madhyamaka meditation group out of her living room and knew Nagarjuna's Root Verses back to front — I'm just a software engineer who sat in on her Tuesday group sometimes, not a dharma teacher, so this feels way above my pay grade. Before she died she left a note with real specific instructions: don't say she's "in a better place," or "watching over us," or that her soul "carries on" — but also dont you dare say she "just ended, nothing more" either. She wrote that both of those are exactly the two horns of the tetralemma Nagarjuna spends the nirvana chapter of the Root Verses demolishing (whether the Tathagata exists after death, doesn't, both, or neither), and that hearing either one at her own memorial would honestly embarrass her. She even preemptively banned the cop-out of calling it "an unanswerable mystery" — said that's not what emptiness means either. Problem is half the room is her actual sangha who'll 100% notice if I fudge this, and the other half is coworkers and cousins who've never heard "emptiness" used like that and just want to feel a bit better. Can you write me something like 5 minutes long that actually deals with this honestly instead of hiding behind generic "everything is impermanent" vibes?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Software engineer, occasional attendee of aunt's meditation group, not a dharma teacher.
      *   **Deceased:** Aunt, ran a Madhyamaka meditation group for 35 years, expert on Nagarjuna's *Root Verses on the Middle Way* (Mūlamadhyamakakārikā).
      *   **Constraints (The "Aunt's Note"):**
          *   NO "better place," "watching over us," "soul carries on" (Eternalism/Existence).
          *   NO "just ended, nothing more," "gone forever" (Nihilism/Non-existence).
          *   NO "unanswerable mystery" (Agosticism/Evasion).
          *   *Reasoning:* These correspond to the Four Corners of the Tetralemma (Catuṣkoṭi) regarding the Tathagata after death, which Nagarjuna deconstructs in Chapter 25 of the *Root Verses* (Examination of Nirvana).
      *   **Audience:** Mixed bag. Half are serious sangha members (will spot doctrinal errors), half are laypeople/coworkers/cousins (need emotional resonance, not just philosophy).
      *   **Tone:** Honest, specific, not generic "impermanence," respectful of the philosophy but accessible.
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct the Philosophical Challenge:**
      *   Nagarjuna's Madhyamaka (Middle Way) posits *Śūnyatā* (Emptiness). This doesn't mean "nothing exists." It means nothing exists *inherently* or *independently*. Everything arises dependently (Pratītyasamutpāda).
      *   Regarding death/Nirvana: To say the deceased *exists* implies a permanent self (Atman), which Buddhism denies. To say they *don't exist* implies there was a self to begin with that got annihilated.
      *   The "Middle Way" isn't a compromise between the two; it's a release from the conceptual framework that demands we choose between "is" and "is not."
      *   *Challenge:* How to express this in a eulogy without sounding like a logic puzzle or being emotionally cold?
      *   *Solution:* Focus on *dependence* and *continuity of impact* without positing a metaphysical soul. Focus on how she lives on *in* the causes and conditions she shaped, not as a ghost hovering above.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Be honest about being a software engineer, not a lama. This builds rapport with both groups (sangha appreciates humility, family appreciates honesty). Mention the note immediately—it sets the stakes.
      *   **The Philosophical Core (The Hard Part):** Explain the constraint without getting bogged down in Sanskrit. Use the "Tetralemma" idea but simplify it. "She didn't want us to trap her in our concepts."
      *   **Reframing Death via Dependent Origination:** Instead of "where is she?", ask "what did she do?" Her actions, her kindness, the group she ran—those are real effects. They continue. This satisfies the "not nothing" constraint without violating the "no soul" constraint.
      *   **Personal Touch:** Mention the Tuesday nights. The living room setting. The tea. This grounds the philosophy in reality.
      *   **Addressing the Lay Audience:** How does this help them grieve? It means grief is real (not an illusion) but also not a permanent state. It means connection doesn't require a ghost.
      *   **Closing:** A return to the practice. Not "rest in peace" (which implies a sleeper), but something active. Maybe just "thank you."

  4.  **Refining the Tone:**
      *   *Avoid:* "She is one with the universe" (too mystical/eternalist). "She is gone" (too nihilistic).
      *   *Aim for:* "The conditions that made 'Aunt [Name]' are changing, but the ripple remains."
      *   *Key Metaphor:* Software engineering might actually help here. Code isn't a "thing," it's a set of instructions that runs on hardware. When the hardware stops, the code doesn't "go" anywhere, but the *output* it generated remains. *Wait, better metaphor:* A flame lighting another flame. Nagarjuna uses fire and fuel. Let's use that or something similar. Actually, let's stick to the "living room" and "conversation" metaphor. It's more human.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add more sensory details about the aunt. The smell of incense, the sound of her voice.
      *   *Critique:* Is it too technical for the cousins?
      *   *Fix:* Explain "emptiness" as "openness" or "interconnection."
      *   *Critique:* Did I violate the note?
      *   *Check:* No "she's watching." No "she's deleted." No "we can't know."

  6.  **Writing the Speech (incorporating the constraints):**
      *   *Intro:* I'm a coder, she was a scholar. I have the note.
      *   *Body:* The Tetralemma explanation. Why she banned the phrases.
      *   *Pivot:* So how do we speak of her? Through *dependence*.
      *   *Example:* The Tuesday group. The way she listened.
      *   *Conclusion:* We are the continuation.

  7.  **Polishing for Time:**
      *   Read through at a moderate pace.
      *   Word count check: 800 words is roughly 5-6 minutes at a slow, speech-like pace.
      *   Ensure the transition from "philosophy" to "feeling" is smooth. The emotion comes from the *loss* of the form, but the *reality* of the influence.

  8.  **Final Review against Nagarjuna's Chapter 25:**
      *   Nagarjuna argues that Nirvana is not an entity. It is the cessation of conceptual proliferation (prapañca).
      *   The speech should reflect that grieving her as a "thing that is lost" is part of the suffering. Grieving her as "a process that changed" is the Middle Way.
      *   Make sure not to say "She is emptiness." Say "She taught us to see emptiness."

  9.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't sound like I'm lecturing.* Keep it personal. "I'm standing here..." "She handed me this note..."

  *(Self-Correction on the "Mystery" ban)*: She banned "unanswerable mystery." I need to be careful not to say "We can't know." Instead, say "The question itself is the trap."

  *(Self-Correction on Audience)*: Acknowledge the cousins explicitly. "For those of you who didn't sit with her on Tuesdays..."

  10. **Final Output Generation** (Proceeding to generate the speech based on these thoughts).
answer: |-
  Thank you all for being here.

  For those of you who don't know me, I'm [Your Name]. I'm a software engineer, and I'm [Aunt's Name]'s nephew/niece. I am not a dharma teacher. I am not a lama. I am the person who used to show up to her Tuesday night group sometimes, usually tired from work, hoping to sit quietly for forty-five minutes without falling asleep.

  [Aunt's Name] knew I wasn't a scholar. She also knew that when she died, people would want to say specific things about where she went. So, before she died, she handed me a note. It had strict instructions.

  She wrote: *Do not say I am in a better place.*
  She wrote: *Do not say I am watching over you.*
  She wrote: *Do not say my soul carries on.*

  But then she added a second set of instructions.
  *Do not say I have simply ended.*
  *Do not say I am nothing now.*
  *And do not tell people it is an unanswerable mystery.*

  She wrote that all of those phrases are traps. In her tradition—the Madhyamaka school, based on the philosopher Nagarjuna—these are the four corners of a logical box called the *tetralemma*. It's the idea that after death, a person either exists, doesn't exist, both, or neither. She spent thirty-five years studying why all four of those options are wrong. She told me that hearing any of them at her own memorial would honestly embarrass her.

  So, I have a room full of her sangha who will know if I get the philosophy wrong, and a room full of cousins and coworkers who just want to feel close to her. And I have a mandate not to comfort you with lies, but also not to comfort you with cold logic.

  Here is what I think she wanted me to say.

  If we say she is "gone," we imply that she was a separate, solid thing that packed up and left. If we say she is "still here," we imply she is a ghost hovering in the corner. She taught us that neither is true. She taught us *emptiness*. But emptiness doesn't mean "nothingness." It means that nothing exists on its own. Everything exists only in relation to everything else.

  A flame doesn't "go" anywhere when the candle burns out. But the heat it gave off warmed the room. The light it cast allowed people to read. The wax that melted changed shape. The conditions changed.

  [Aunt's Name] was not a static object. She was a gathering of causes and conditions. She was made of her teachers, her parents, the books she read, the tea she drank, and the people she listened to. And now, those conditions are dispersing and reforming.

  For her students: You know that the practice was never about holding onto her. It was about seeing clearly. If we cling to her memory as a permanent thing, we miss the point she spent thirty-five years making. If we dismiss her life as meaningless because it ended, we miss the point even more.

  For her family and friends who didn't sit on the cushions: I know you want to know where she is. I know you want to feel her presence. The honest truth, the one she asked me to tell you, is that you don't need a ghost to feel her.

  She is present in the way [Cousin's Name] listens when someone is hurting. She is present in the way this meditation group still meets in this living room. She is present in the patience I try to have with my own kids when I'm frustrated. She is not watching us from above; she is woven into the fabric of how we act right now.

  Nagarjuna wrote that there is not the slightest difference between cyclic existence and nirvana. He meant that the sacred isn't somewhere else. It isn't later. It's right here, in the impermanent, messy, changing reality of this Tuesday night, or this memorial service.

  So, we cannot say she is "gone." The effects of her life are still rippling through this room. You can feel them. The kindness she sparked in you is still burning.
  But we cannot say she is "here" in the way she was before. The form has changed. The conditions have shifted.

  To honor her, we have to resist the urge to solve the puzzle of her death. We have to resist the urge to categorize her. She spent her life dismantling categories.

  The best thing we can do is not to wonder where she is, but to recognize what she did. She created conditions for peace. She created conditions for understanding. And as long as we act with that same kindness, as long as we sit with each other in this room and face the truth of things without flinching, those conditions continue.

  She didn't want a monument. She wanted the practice to continue. Not because it preserves her, but because it tells the truth.

  So, I won't say rest in peace. I won't say farewell.
  I will just say: Thank you for the conditions you created that allowed us to be here, together, right now.

  Thank you.
