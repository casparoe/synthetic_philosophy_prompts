  5.  **Address Question 3: Absurdity Doctrine & Smuggling Purposivism:**
      *   *Definition:* Text controls unless it leads to absurdity.
      *   *The Trap:* Who defines "absurd"? Usually the judge (or housemate) based on... purpose!
      *   *User's Burrito Case:* Is microwaving a burrito "absurd" to call cooking?
          *   Textualist: No, heat + raw/frozen = cook.
          *   Purposivist: Yes, it defeats the labor-exchange purpose.
      *   *Answer:* Yes, the absurdity doctrine is essentially purposivism in a trench coat. It allows the interpreter to override text when the outcome violates shared norms. In a house, this is actually *good* because shared norms are strong.

  6.  **Address Question 4: Goodhart's Law:**
