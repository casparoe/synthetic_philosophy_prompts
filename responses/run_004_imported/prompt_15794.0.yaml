      *   *Takeaway:* Clarity > Cleverness. Define terms if they are contentious.

  4.  **Address Question 2: Scalia's Objection & Legislative Intent:**
      *   *Scalia's Point:* Intent is collective fiction. You can't aggregate minds.
      *   *Small Group Counter:* In a house of 4-6, the "legislature" is accessible. You *can* text the person who proposed the rule.
