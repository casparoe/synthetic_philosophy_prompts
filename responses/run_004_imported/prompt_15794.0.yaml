answer: |-
  This is one of the best analogies I have heard in a long time. You have correctly identified that your kitchen is a constitutional court and your roommates are justices divided on the bench. The "Frozen Burrito Case" (*House v. Roommate, 2024*) is indeed a perfect storm of statutory interpretation, incentive design, and social contract theory.

  Here is a breakdown of how the Textualism vs. Purposivism debate applies to your group house, specifically addressing your questions on legislative intent, the absurdity doctrine, and Goodhart's Law.

  ### 1. The Scalia Objection: Does "Legislative Intent" Exist in a Group Chat?

  Justice Scalia's primary objection to purposivism was that "legislative intent" is a fiction. In Congress, 535 people vote on a bill. Some vote yes because of Paragraph A, others because of Paragraph B, and some just because their party whip told them to. To claim there is a single "collective intent" is, in Scalia's view, to pretend a multi-headed hydra has one brain.

  **Does this hold up in a group house?**
  **Mostly, no.**

  In a dozen-person meetup or a 4-person house, the "legislature" is small enough that intent is not a fiction; it is a recoverable fact.
  *   **Accessibility:** You *can* literally ping the person who wrote the rule in the group chat: *"Hey, when we wrote 'cooking,' did we mean heating up a Hot Pocket?"*
  *   **Shared Context:** Unlike federal statutes, which must apply to 330 million strangers, house rules apply to a specific culture with shared norms. The "context" is not abstract; it is the people sitting on the couch next to you.

  **However, there is a trap.**
  Even in a small group, relying on "intent" creates instability.
  1.  **Memory Decay:** Six months from now, no one will remember the chat log where someone said, "Yeah, obviously microwaves don't count."
  2.  **The Ratification Problem:** Even if *one* person drafted the rule with a specific intent, the other three housemates may have ratified it with a different understanding. Whose intent counts? The drafter's or the voters'?

  **Implication for Rule-Making:**
  In small groups, **Textualism is a stability mechanism, not a truth mechanism.** You should write rules textually (clearly defined terms) because relying on "what we meant back in October" leads to he-said-she-said arguments. However, because the legislature is accessible, you have a duty to clarify the text *before* a dispute arises, rather than litigating intent *after* the burrito is cooked.

  ### 2. The Absurdity Doctrine: Is it Purposivism in a Trench Coat?

  You asked: *Does leaning on the absurdity doctrine just smuggle purposivism back in through the side door anyway?*

  **Yes. Absolutely.**
  The "Absurdity Doctrine" states that a judge may disregard the plain text of a law if following it would lead to a result that is "absurd" or "obviously not intended." But who defines "absurd"? The judge does. And how do they define it? By looking at the **purpose** of the law.

  If the rule is "Whoever cooks is off dishes," and a textualist says "Microwaving is cooking," the purposivist screams "Absurdity!" because the *purpose* of the rule is to trade **labor** for **exemption**. Microwaving requires negligible labor. Therefore, exempting the burrito-microwaver defeats the purpose of the exchange.

  **In a Group House Context:**
  In federal law, the Absurdity Doctrine is controversial because it gives judges too much power to rewrite laws. In a group house, **it is essential.**
  *   **Social Cohesion > Legal Certainty:** In a nation, we prioritize certainty so people know what is illegal. In a house, we prioritize fairness so people don't resent each other.
  *   **The Vibe Check:** The Absurdity Doctrine is essentially a formalized "Vibe Check." If a rule interpretation makes everyone roll their eyes, it is legally invalid within the social contract of the house.

  **Verdict on the Burrito:**
  You are right. This is a textbook Absurdity Doctrine case. If microwaving a frozen burrito counts as cooking, then *toasting a Pop-Tart* must also count. If toasting a Pop-Tart counts, then *opening a bag of chips* is arguably "food preparation." The textualist slope is slippery. The absurdity doctrine stops the slide before someone claims that pouring milk over cereal is "culinary labor."

  ### 3. Goodhart's Law: The Economic Angle

  You hit the nail on the head linking this to Goodhart's Law: *"When a measure becomes a target, it ceases to be a good measure."*

  *   **The Goal:** Equitable distribution of household labor.
  *   **The Measure:** "Cooking."
  *   **The Target:** Exemption from dish duty.

  As soon as you made "cooking" the target for avoiding dishes, you incentivized housemates to minimize the definition of cooking. A Textualist interpretation of the rules **invites Goodharting.** It tells the housemates: *"Find the loophole in the text that allows you to minimize labor while maximizing reward."*

  A Purposivist interpretation acts as an **anti-Goodharting shield.** It says, *"We know you are trying to game the metric. We are looking at the spirit of the labor exchange, not just the metric."*

  ### 4. Practical Implications: How to Write House Rules

  So, how should your group house draft its constitution to avoid *House v. Roommate II: The Electric Kettle Affair*?

  **A. Define Terms (The Textualist Fix)**
  Don't use vague verbs like "cook." Use measurable metrics.
  *   *Bad:* "Whoever cooks is off dishes."
  *   *Good:* "Whoever prepares a meal requiring more than 15 minutes of active preparation is off dishes."
  *   *Better:* "Whoever prepares a meal from raw ingredients (no frozen entrees) is off dishes."

  **B. The "Smell Test" Clause (The Purposivist Fix)**
  Include a general savings clause in your house agreement.
  *   *Example:* "Rules should be interpreted according to the spirit of equitable labor sharing. Exploiting technicalities to avoid labor is a violation of the house agreement."
  *   This codifies the Absurdity Doctrine. It makes "being a dick about the rules" itself against the rules.

  **C. The "Ministry of Interpretation" (The Institutional Fix)**
  In legal systems, we have courts. In a house, you need a tie-breaker mechanism.
  *   If two people disagree on a rule, it goes to a vote. But crucially: **The vote is on the interpretation, not the person.**
  *   Once a ruling is made (e.g., "Burritos don't count"), it becomes *stare decisis* (precedent). Next time someone microwaves a taquito, the precedent applies.

  **D. Frequent Re-Ratification**
  Laws in a house should have a shorter half-life than federal statutes. Review them every 6 months. If everyone agrees the burrito rule is annoying, change the text. Don't let the text drift too far from the collective intent.

  ### Summary Judgment

  To answer your specific questions directly:

  1.  **Does Scalia's objection hold up?** No. In a small group, intent is recoverable. However, relying on it is inefficient. Write clearer text instead.
  2.  **Does the Absurdity Doctrine smuggle in Purposivism?** Yes, and in a domestic setting, **that is a feature, not a bug.** You want purposivism. You want the "spirit of the law" to govern your living situation, or you will end up with a house of lawyers who hate each other.
  3.  **The Burrito Case:** Your housemate is a Textualist trying to minimize their labor (Goodharting). You are a Purposivist trying to maintain equitable labor distribution. **You win on the Absurdity Doctrine.** Microwaving a frozen entree is not cooking; it is heating.

  **Recommendation:** Call a house meeting. Admit that the "cooking" statute is vague. Pass an amendment defining "cooking" as "heat application to raw ingredients or assembly of multiple components." Explicitly exclude "single-unit frozen entrees." Then, order pizza, because nobody wants to cook after a constitutional convention.
