prompt: |-
  So my group house had a huge argument last week over whether microwaving a frozen burrito counts as "cooking" under our rule that whoever cooks is off dish duty, and it hit me we were basically re-running the textualism vs purposivism fight from legal interpretation, just with burritos instead of statutes. Could you walk through the most important implications of that debate for how a small group (a group house, a dozen-person meetup, whatever) should write and interpret its own internal rules? Specifically: does Scalia's objection to purposivism -- that "legislative intent" is basically a fiction once more than one person's involved -- still hold up when your "legislature" is a group chat where you can literally just ask whoever wrote the rule what they meant? And does leaning on something like the absurdity doctrine as a safety valve just smuggle purposivism back in through the side door anyway? honestly i think the burrito case is a textbook absurdity-doctrine case but my housemate disagrees. Bonus points if you can tie it into goodharting, since gaming the letter of a rule against its obvious spirit feels like the same move to me.
reasoning: |-
