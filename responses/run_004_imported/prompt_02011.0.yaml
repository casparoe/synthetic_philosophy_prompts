  2.  **Deconstruct Wittgenstein's *On Certainty* (OC):**
      *   *What are hinges?* They are not empirical propositions in the usual sense. They are the "scaffolding" of our thoughts. They are enacted, not just stated.
      *   *Are they arbitrary?* No. They arise from our form of life, our actions, and our shared human nature.
      *   *Can they change?* Yes, but slowly and like the riverbed shifting, not like water flowing over it.
      *   *Is "The Earth is flat" a hinge?* For Wittgenstein, probably not in our current form of life. It conflicts with too many other hinges and empirical practices.
      *   *The "Moore vs. Skeptic" context:* Wittgenstein was responding to G.E. Moore ("Here is one hand"). Moore treated hinges as knowledge. Wittgenstein said they are *beyond* knowledge/doubt.

  3.  **Address the Flat Earther Objection (The Core Conflict):**
      *   *The Relativist Trap:* If hinges are just "what we don't doubt," then different groups have different hinges, and there's no arbitration.
      *   *Wittgenstein's Escape:* Hinges aren't chosen; they are *revealed* in action. You can't just *say* something is a hinge; it has to function as one.
      *   *Systemic Coherence:* A hinge must hold up the rest of the system. "The Earth is flat" breaks too many other things (navigation, physics, astronomy) that *also* function as hinges or are deeply embedded in the web of belief.
      *   *Practical Success:* Our hinges (round earth, reliable senses) allow us to build planes, send satellites, etc. Flat earth hinges don't yield the same practical mastery over nature.

