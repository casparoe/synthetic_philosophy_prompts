          *   *The "Riverbed" Metaphor:* Hinges shift, but slowly. Flat Earth isn't a shifting riverbed; it's a rock thrown into the water. It's a deviation, not a foundation.
          *   *Form of Life:* Hinges are shared. They belong to a community of practice. Science is a form of life. Flat Earth is a fringe rejection of that form of life, not an alternative foundation for it.
      *   **Epistemic Relativism vs. Pluralism:**
