prompt: |-
  So I fell down a youtube rabbit hole on Wittgenstein's On Certainty and this idea of 'hinge propositions' - like there's this bedrock of stuff (the earth existing long before I was born, my senses being roughly reliable, etc) that isn't actually known or justified by evidence, it's more like the framework that has to already be in place before doubting or justifying anything else can even get going. Kind of blew my mind, but then it hit me: cant my flat earth cousin just turn this right around and say the shape of the earth is HIS hinge, and since hinges don't need justification anyway we're basically in the same epistemic boat, so I've got no real standing to call him irrational? What are the most important implications of hinge epistemology for a situation like that - does it actually back you into that relativist corner, or is there a genuine reason not just any weird belief gets to count as a 'hinge' in the first place?
