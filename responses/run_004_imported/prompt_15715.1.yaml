      *   *The "Future Discriminability" Argument:* Goodman argues that knowing a work is a forgery changes our perception. We look for differences. Even if we can't see them *now*, the knowledge that there *might* be differences (or that the history is different) alters the aesthetic experience. It's about the *risk* of detection and the training of perception.
      *   *Key Distinction:* It's not just moral (Lessing); it's epistemic/aesthetic. The knowledge of origin affects how we perceive the object.
      *   *Lessing's Position:* The aesthetic object is the same. The wrong is moral (deception, stealing credit). If it looks the same, it *is* aesthetically the same.
      *   *Goodman's Rebuttal to Lessing:* Lessing assumes aesthetic properties are static. Goodman argues aesthetic properties are dynamic and dependent on cognitive context (knowledge of origin).
      *   *Steps of Goodman's Argument:*
          1.  Autographic arts require a specific history of production for identity.
          2.  Forgery lacks this history.
          3.  Knowing a work is a forgery changes our perceptual stance (we look for flaws, we view it as an imitation).
          4.  Therefore, the aesthetic experience is different.
          5.  Even if undetectable *now*, the possibility of future detection or the mere knowledge of the different causal chain alters the aesthetic weight.

  3.  **Deconstruct Task 2: The Novel (Allographic) and "Forgery":**
      *   *Goodman's Definition:* Novels are allographic. Identity is defined by notation (spelling, words). Any correct copy is an instance of the work.
