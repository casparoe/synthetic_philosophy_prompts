  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Goodman:* Make sure not to oversimplify the "future discriminability." Goodman argues that *even if* we never detect it, the *knowledge* that it is a forgery changes the perceptual category. It's about the *risk* and the *stance*.
      *   *Correction on Lessing:* Lessing's essay is "Art and Forgery." He argues that the aesthetic value is in the object, not the history. If the object is identical, the aesthetic value is identical. The crime is moral, not aesthetic.
