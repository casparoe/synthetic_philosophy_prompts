      *   **Task 2:** Apply these concepts to the user's specific domain (the novel). Since novels are allographic, can they be "forged"? Analyze three scenarios: fabricated manuscript of a genuine novel, invented story falsely attributed to a dead author, and plagiarism. Do they share a single kind of wrong under Goodman's scheme vs. Lessing's scheme?
      *   **Tone:** Intellectual, precise, nuanced, suitable for a writer doing deep background research.

  2.  **Deconstruct Task 1: Goodman vs. Lessing on Forgery:**
