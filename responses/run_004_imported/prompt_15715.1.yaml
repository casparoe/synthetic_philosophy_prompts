answer: |-
  This is a fertile philosophical trench to dig into for a novel. The tension between the physical act of creation and the abstract identity of the work is exactly where the psychological drama of a forger lives. Van Meegeren didn't just copy Vermeers; he created a new history for them. Goodman and Lessing give you the vocabulary to argue whether that history matters to the *art* or only to the *morality*.

  Here is a walkthrough of Goodman's specific argument regarding autographic arts, followed by an application of both Goodman's and Lessing's frameworks to your three literary scenarios.

  ### Part 1: Goodman's Argument on History and Aesthetics

  You are correct that the capsule summaries often skip the mechanical steps of Goodman's argument in *Languages of Art*. Goodman is not merely asserting that history matters; he is arguing against the empiricist intuition that "what you see is what you get."

  **The Steps of Goodman's Argument:**

  1.  **The Ontological Premise:** In autographic arts (painting), the work's identity is inseparable from its history of production. A painting *is* the specific physical object produced by the artist's hand. In allographic arts (music, literature), the work is a class of performances or copies compliant with a notation.
  2.  **The Epistemic Premise:** Aesthetic experience is not purely retinal; it is cognitive. How we classify an object affects how we perceive it. If I tell you a sound is "noise" versus "music," you listen differently.
  3.  **The "Future Discriminability" Claim:** This is the crux. Goodman argues that even if a forgery is currently indistinguishable from the original to the naked eye, the knowledge that it is a forgery alters our aesthetic experience *now*. Why? Because knowing it is a forgery introduces the *possibility* of discrimination. We look at it *as* a copy. We scrutinize it for the tell-tale signs of imitation rather than the spontaneity of creation.
  4.  **The Consequence:** Because our perceptual stance changes based on the history of production, the aesthetic properties of the object change. A line in a Van Gogh is perceived as "bold" or "anguished." That same line in a perfect forgery is perceived as "calculated" or "mimicked."
  5.  **The Conclusion:** Therefore, the history of production is an aesthetic property. A perfect forgery is aesthetically inferior not because it looks worse, but because it functions differently in our perception. It lacks the "authority" of the causal chain that produced the original.

  **Goodman vs. Lessing:**

  Alfred Lessing, in his essay *"Art and Forgery,"* attacks this directly. Lessing argues that aesthetic value resides in the object itself, not its biography.
  *   **Lessing's View:** If two paintings are visually identical, they possess identical aesthetic merit. The forgery is a moral crime (deception, fraud, stolen credit), but it is not an *aesthetic* crime. To say the forgery is aesthetically worse is to commit the "genetic fallacy"—judging the thing by its origin rather than its nature.
  *   **Goodman's Rebuttal:** Goodman would say Lessing assumes a passive viewer. Goodman argues that aesthetic judgment is an active skill. Knowing the history trains the eye. If we treat the forgery as the original, we are training ourselves to value the wrong things (imitation over innovation). Thus, the distinction is necessary to preserve the integrity of aesthetic perception itself.

  For your novel, this is the Van Meegeren dilemma: If the experts cannot tell the difference, and the painting moves them, has Van Meegeren committed an aesthetic crime (Goodman) or merely a moral one (Lessing)?

  ***

  ### Part 2: The Novel and the Three Offenses

  This is where it gets tricky for your protagonist. Under Goodman's strict scheme, a novel is **allographic**. Its identity is determined solely by compliance with the notation (spelling, words, sequence). There is no "original" text in the ontological sense; there are only instances.

  If you type *The Great Gatsby* correctly, you have produced an instance of *The Great Gatsby*. You cannot "forge" the text itself, because any correct copy *is* the work. However, you can forge the *manuscript* (the physical object) or the *attribution* (the history).

  Let's analyze your three scenarios through Goodman's lens, then Lessing's.

  #### 1. A Fabricated Manuscript of a Genuine Novel
  *Example: Creating a physical document claimed to be Fitzgerald's handwritten draft of Gatsby.*
  *   **Goodman:** This is a forgery of an **autographic artifact**, not the allographic work. The *text* is genuine (it complies with the notation of *Gatsby*). The *object* is fake (it lacks the history of production of Fitzgerald's hand). Goodman would say this is a fraud regarding the relic, but it does not alter the literary work. The wrong is in the market value of the physical paper, not the art.
  *   **Lessing:** The aesthetic experience of reading the text is unchanged. The wrong is entirely moral/financial. The buyer is deceived about the rarity of the object, not the quality of the art.

  #### 2. An Invented Story Falsely Attributed to a Dead Author
  *Example: Writing a new Sherlock Holmes story and claiming Conan Doyle wrote it.*
  *   **Goodman:** This is the most complex case. Since the text does not comply with any existing notation (it's a new story), it is a **new allographic work**. However, the label is false. Goodman would argue this is not "forgery" in the strict autographic sense (like a fake Vermeer), because the work's identity doesn't rely on Doyle's hand. It is a **misattribution**. It creates a new work but lies about its genesis. It corrupts the catalog of the author's oeuvre, which matters for literary history, but not for the identity of the text itself.
  *   **Lessing:** This is the literary equivalent of Van Meegeren. The aesthetic value of the story stands or falls on its own merits. If it reads like Doyle, it succeeds aesthetically. The wrong is the deception of the reader regarding the source of the achievement. Lessing would argue that if the story is good, the lie doesn't diminish the *art*, only the *honesty*.

  #### 3. Plain Plagiarism
  *Example: Taking a living author's text and publishing it under your own name.*
  *   **Goodman:** This is the inverse of Case 2. The work (the text) is genuine and compliant. The history of production is being lied about. Since the work is allographic, the identity of the work remains intact, but the **credit** is stolen. Goodman might suggest this is less ontologically confusing than Case 2. The work exists; the producer is simply misidentified.
  *   **Lessing:** Again, the aesthetic object is unchanged. The moral wrong is paramount. It is theft of labor and reputation.

  #### Do they share a single kind of wrong?

  **Reasoning from Goodman:**
  **No.** Goodman's autographic/allographic line fractures these offenses into different ontological categories.
  *   Case 1 is a fraud against a **physical object** (autographic).
  *   Case 2 is a fraud against **literary history** (creating a new work with a false past).
  *   Case 3 is a fraud against **personhood/credit** (claiming an existing work's history).
  For Goodman, calling them all "forgery" is a category error. Only Case 1 involves a physical forgery. Cases 2 and 3 are lies about the causal history of an allographic work, which Goodman argues is not constitutive of the work's identity. Therefore, the "wrong" in Case 1 is about the object's authenticity; the "wrong" in 2 and 3 is about information and credit.

  **Reasoning from Lessing:**
  **Yes (mostly).** Lessing collapses the ontological distinction.
  *   For Lessing, the aesthetic object is paramount. In all three cases, the aesthetic object is either unchanged (1 and 3) or judged on its own merits regardless of the lie (2).
  *   Therefore, the "wrong" in all three is fundamentally the same: **Deception.** It is a moral violation of the trust between the presenter and the audience. Whether you are faking the paper, the author, or the owner, you are stealing credit or value that isn't yours. Lessing would unify them under "Fraud."

  ### Implications for Your Novel

  This philosophical split offers a powerful internal conflict for your forger.

  1.  **The Goodman Protagonist:** If your character leans toward Goodman, he believes he is altering the aesthetic reality of the art world. By inserting a fake into the history of production, he is poisoning the well. He isn't just lying; he is changing how people *see*. He might feel that by forging a "lost" novel by a dead master, he is retroactively changing the master's style, warping the perception of their genuine works. He is an aesthetic terrorist.
  2.  **The Lessing Protagonist:** If your character leans toward Lessing, he sees himself as a moral criminal but an aesthetic equal. "If they can't tell the difference, I am as good as the master." He views the art world's obsession with provenance as a fetish. His conflict is not about the art, but about the hypocrisy of the market. He is a con artist, not a corrupter of art.

  **The Van Meegeren Angle:**
  Van Meegeren famously argued (in a Lessing-esque way) that he had proven the experts were fools because they praised his fakes as masterpieces. But in doing so, he inadvertently proved Goodman's point: once the history was revealed, the paintings were re-categorized. They were no longer "Vermeers" (bold, innovative); they became "Van Meegerens" (derivative, pastiche). The paint didn't change, but the *aesthetic properties* did.

  For a novelist, the allographic nature of your medium adds a layer of irony. Your protagonist is forging paintings (autographic), but you are writing a book (allographic) about it. You can use this to blur the lines. Perhaps your protagonist begins forging manuscripts (Case 1) because he thinks that's safer, only to realize that in the digital age, the text is fluid, and the "manuscript" is the only autographic anchor left. Or perhaps he attempts Case 2 (writing a new "lost" novel by a famous author), forcing him to confront whether he is creating a new work or destroying an old reputation.

  Goodman gives you the tragedy: the forger changes the art forever. Lessing gives you the thriller: the forger gets away with it until the moral debt comes due.
