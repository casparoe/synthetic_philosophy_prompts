          *   *Marcus's Defense:* Rules are context-sensitive. It's like a "No Entry" sign that has a keyholder exception. The social contract allows the targeted group to disarm it.
          *   *Elena's Counter:* If the meaning is inherently derogatory, how can it become affectionate? You can't change semantics just by agreement.
