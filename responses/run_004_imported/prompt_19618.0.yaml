      *   **Tackling the "Mentioning" Problem (The Quoting Issue):**
          *   *Marcus's Attack:* If it's semantic, quoting shouldn't matter. Quoting a lie isn't lying. So why is quoting a slur offensive? This hurts Elena.
          *   *Elena's Defense:* It's not about truth conditions; it's about "embedding." The word brings its baggage even in quotes. Maybe distinguish between *use* and *mention*, but argue the phonetic realization triggers the harm.
          *   *Marcus's Counter:* If the sound triggers the harm, then it *is* a taboo/psychological reaction, not semantics.
          *   *Elena's Comeback:* Semantics isn't just truth; it's social content. To utter it is to invoke the ideology, even in quote marks.
      *   **Tackling the "Reclaiming" Problem (In-group Use):**
