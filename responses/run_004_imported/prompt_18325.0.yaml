  7.  **Final Polish:** Check the logic on the "past episodes" point. If she expressed the desire to paint during past manias, but *never revoked* during well periods, that confirms the Well Self's commitment. This is the strongest ethical pivot point. I need to make sure that's highlighted.

  *(Self-Correction during drafting)*: I should ensure I don't sound like I'm dismissing the "manic insight" argument entirely. There is a philosophical debate about whether mania reveals truths or distorts them. I should acknowledge that ambiguity while prioritizing safety and precedent autonomy.

