answer: |-
  You have correctly identified that your friend is applying single-agent decision theory to a multi-agent game. She is treating the estate dispute as if you are investing in a stock market where the price moves independently of your actions. You are recognizing that you are in a **strategic interaction** where the "price" (Daniel's aggression) moves *in response* to your actions.

  There is indeed a genuine distinction between your situation and the ordinary sunk-cost fallacy, but recognizing it does not necessarily validate continuing the fight. In fact, understanding the specific game you are playing might be the only thing that convinces you to stop.

  Here is an outside view on the dynamics at play, the distinction you raised, and whether it offers a way out.

  ### 1. The Distinction: Sunk Cost vs. War of Attrition
  Your friend is accusing you of the **Sunk Cost Fallacy**. This is a cognitive bias where an individual continues a behavior because of previously invested resources (time, money, effort), even if the current costs outweigh the benefits. In a standard sunk-cost scenario, the environment is inert. If you are digging a hole looking for gold and spend $65,000 finding nothing, the hole doesn't dig back.

  You are describing a **War of Attrition**. This is a classic game-theory model where two parties compete for a resource by persisting in a costly conflict. The winner is the one who outlasts the other, but *both* parties pay costs for the duration of the contest.

  *   **The Friend's View:** "The $65,000 is gone. Will spending *more* money yield a profit?"
  *   **Your View:** "If I stop, Daniel wins the asset. If I continue, I force Daniel to pay more, which might make *him* stop."

  You are right that Daniel is not a fixed cost; he is a strategic player. His decision to file a new motion is likely calculated based on his assessment of your willingness to pay. This makes the situation distinct from a simple sunk-cost error. You are not just chasing past losses; you are engaging in **signaling**. By spending $65,000, you have signaled that you value the house highly. If you quit now, that signal is revealed as a bluff, and Daniel takes the prize.

  ### 2. The Trap: Rationality vs. Profitability
  Here is the critical nuance: **A move can be strategically rational within the game and yet financially irrational overall.**

  In a War of Attrition, the Nash Equilibrium (the stable state where neither player wants to change their strategy) often involves both parties spending *more* than the asset is worth. This is because neither side knows the other's breaking point.
  *   If you think Daniel will quit after spending another $10k, it is rational for you to spend $11k to win a $340k house.
  *   But Daniel is thinking the exact same thing about you.
  *   Because you are symmetric (both cousins, both invested, both reasoning similarly), you are likely to escalate until the marginal cost of fighting exceeds the marginal value of the house.

  Your friend is right about the accounting: The $65,000 is gone. Whether you quit today or in a year, that money does not come back. Your argument that "If I back out now, I lock in a total loss on the legal fees" is technically the sunk-cost fallacy phrasing. You lock in the loss of the fees either way. What you actually lock in by quitting is the **loss of the house**.

  The question is not about the $65,000. The question is: **Is the *next* $50,000 of legal fees worth the *increased probability* of winning the $340,000 house?**

  Given that every settlement signal triggers a new motion from Daniel, the data suggests that your marginal cost is high and your probability of him folding is low. In economic terms, your **Expected Value (EV)** of continuing is likely negative, even if your strategic reasoning is sound.

  ### 3. Does This Distinction Offer a Way Out?
  You asked if recognizing this distinction tells you anything useful about when to stop, or if it just explains the trap. It actually does offer a way out, but it requires changing how you view the "win."

  In a standard sunk-cost scenario, the solution is internal discipline (ignoring past spend). In a War of Attrition, the solution is **coordination**. You cannot solve this unilaterally without losing. If you simply stop, you lose the house. If Daniel simply stops, he loses the house. The game is designed to punish the first defector.

  To escape a War of Attrition, you must change the game structure. Here is how recognizing the dynamic helps:

  **A. Acknowledge the "Dollar Auction"**
  You are in a variant of the "Dollar Auction" paradox, where bidders pay for the privilege of bidding, and the second-highest bidder pays their bid but gets nothing. The only way to win a Dollar Auction is not to play, or to collude with the other bidder. Since you are already deep in the auction, the only rational move is to collude.

  **B. Shift from Adversarial to Cooperative Bargaining**
  Your current legal counsel is incentivized to bill hours, and the court system is incentivized to process motions. Neither is incentivized to solve the "collective ruin" problem.
  *   **The Pivot:** You and Daniel need to recognize that you are not fighting each other; you are both fighting the legal process.
  *   **The Mechanism:** You need a binding mechanism that allows both of you to save face. A "split the difference" proposal mediated by a neutral third party (not a litigator) is essential.
  *   **The Argument for Daniel:** You can present the game theory to him. "Daniel, we are in a War of Attrition. The math says we will both spend more than the house is worth before one of us blinks. That is irrational for both of us. Let's agree to cap legal fees and split the net proceeds."

  **C. The "Schelling Point"**
  In game theory, a Schelling Point is a solution that people tend to choose by default in the absence of communication. In estate disputes, the Schelling Point is usually a 50/50 split of the net asset value after costs.
  *   Currently, you are fighting over who pays the costs and who gets the asset.
  *   If you both agree to sell the house immediately and split the net (after current fees), you stop the bleeding.
  *   Recognizing the War of Attrition tells you that **waiting for the other person to blink is a losing strategy.** The "rational" move is to propose a ceasefire that allows Daniel to claim he didn't "lose," but simply "settled."

  ### 4. Conclusion
  Your friend is right that the sunk costs should not dictate your decision, but she is wrong that the situation is merely a sunk-cost fallacy. You are in a **strategic deadlock** where individual rationality leads to collective ruin.

  Recognizing this distinction is useful because it shifts the burden. It is not your job to "out-spend" Daniel; that is a path to negative expected value. It is your job to **alter his incentives** so that settling becomes more attractive to him than fighting.

  **The Verdict:**
  1.  **Stop viewing the $65k as recoverable.** It is not. Any decision to spend *more* money must be justified solely by the future value of the house minus future legal costs.
  2.  **Acknowledge the Escalation.** If every attempt to settle is met with aggression, the "cost to continue" is rising faster than the "probability of winning."
  3.  **Propose a Joint Exit.** Do not just "walk away" (which gives Daniel the house). Propose an immediate sale of the property with a binding agreement that no further motions will be filed, splitting the net proceeds.
  4.  **Frame it as Mutual Survival.** Tell Daniel: "We are both being rational, which is why we are both going broke. The only way to be truly rational now is to stop the game."

  You are not wrong about the strategy, but you are likely wrong about the profitability. The distinction you raised explains *why* you are stuck, but the only rational solution is to coordinate a retreat, not to fight for a victory that will cost more than it's worth.
