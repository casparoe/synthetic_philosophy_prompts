  **Move 1 (Josh):** Josh correctly identifies the phenomenon as Simpson's Paradox and applies the standard statistical remedy for observational data: stratifying by a known confounding variable (course level). In the context of AP Stats and most observational studies where the grouping variable precedes the treatment, this is the correct methodological approach.

