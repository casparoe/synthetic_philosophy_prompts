      *   *My Stance:* B&M show that MR is often overstated in biological contexts (neuroplasticity has limits), but they don't defeat the *logical* possibility of non-biological realization. They rehabilitate a *refined* Identity Theory (perhaps "mechanism identity") but don't kill Functionalism. They force a more precise definition of "kind."
