      *   *Morally/Ethically:* It's complicated. It's a friend dynamic, not a legal contract. However, trust was involved.
      *   *Practically:* Priya's own reaction ("maybe you shouldn't have given in") confirms that the user's action undermined Priya's own goal.
      *   *The "Why":* The user caved due to emotional pressure (midnight panic, "NEED," fear of missing out). This is exactly what the pact was supposed to guard against.

  3.  **Evaluate "How to tell the difference?" (Genuine Exception vs. Impulse):**
      *   *The Trap:* If you leave room for exceptions, the pact fails. Impulsivity *always* feels like an emergency in the moment.
      *   *The Reality:* With someone who has a known history of breaking these pacts (like Priya), there is almost *no* reliable way for a third party to distinguish in the heat of the moment.
      *   *The Solution:* The system needs to change. The burden shouldn't be on the friend to judge; the system should be rigid.

  4.  **Drafting the Response:**

