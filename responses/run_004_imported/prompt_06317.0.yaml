      *   **The Terms:** "Pinky promise," "no matter what," "even if she begged, cried, or had some crazy story." This was an explicit *pre-commitment strategy* (Ulysses pact).
      *   **History:** Priya has done this before (with her phone last year) and found an "exception" within a week. This establishes a pattern of impulsivity and breaking her own rules.
      *   **The Incident:** Midnight text, panic, "one-night-only show," "NEED it back." High emotional arousal.
