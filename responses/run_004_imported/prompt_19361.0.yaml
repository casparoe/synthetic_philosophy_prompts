answer: |-
  Here are 10 questions designed to corner the precautionary argument without letting her retreat into the "burden of proof" slogan. They are ordered to build pressure, starting with the scientific ambiguity and ending with falsifiability.

  ### 1. The "Map vs. Territory" Problem (Theories of Consciousness)
  **Question:** "You often imply that the science is leaning toward your view, but the leading mechanistic theories of consciousness actually disagree wildly. Global Workspace Theory suggests insects lack the architecture for consciousness, while Integrated Information Theory might grant it to them. If the 'maps' scientists use to locate consciousness don't overlap, which theory is dictating your moral circle? Or are you picking and choosing based on the ethical outcome you want?"

  *   **Likely Dodge:** "We don't need to settle the theory to apply precaution."
  *   **Follow-up:** "But precaution requires a risk assessment. If one map says 'zero risk' and another says 'high risk,' averaging them out isn't science, it's gambling. Which specific neural architecture are you betting on?"

  ### 2. The "Philosophical Zombie" Challenge (Unconscious Machinery)
  **Question:** "Let's talk about behavior. We see crabs trade off shells to avoid shocks and bees show pessimism biases. But a thermostat regulates temperature, and a self-driving car makes trade-offs to avoid collisions. Why is the crab's nociceptor-plus-trade-off behavior evidence of *felt experience* rather than just highly sophisticated, unconscious machinery? What's the added value of the 'feeling' itself in that loop?"

  *   **Likely Dodge:** "Inference to the best explanation suggests they are like us."
  *   **Follow-up:** "Is it the best explanation, or just the most empathetic one? If I built a robot that screamed and avoided damage exactly like a crab, would you owe it moral consideration? If not, why does biology matter more than function?"

  ### 3. The Probability Demand (Comparative Rankings)
  **Question:** "I want to press you on the actual odds. If we treat a mammal as having a 90% probability of sentience for policy purposes, where does the honeybee land? Is it 50%? 10%? And where does the oyster land? I'm not asking for certainty, but if the precautionary principle is going to drive regulation, we need a risk hierarchy. Can you give me a rough ordering of taxa by probability?"

  *   **Likely Dodge:** "Assigning numbers is arbitrary and misleading."
  *   **Follow-up:** "Policy *requires* arbitrariness to function. If you can't rank them, you can't prioritize. If a farmer has to choose between protecting a field of crops or the insects in it, who wins? Give me an order of magnitude."

  ### 4. The Other Side of the Scale (Costs of Precaution)
  **Question:** "The precautionary principle weighs the cost of being wrong about sentience against the cost of being wrong about non-sentience. If we treat insects as sentient, the cost to human food security and ecosystem management is massive. How do you weigh the certain suffering of humans displaced by agricultural collapse against the hypothetical suffering of a beetle? Does the precaution apply to us, too?"

  *   **Likely Dodge:** "Animal suffering is the primary moral imperative."
  *   **Follow-up:** "That sounds like you've already decided the beetle's hypothetical pain outweighs a human's certain livelihood. Isn't that just asserting your conclusion rather than applying a neutral principle?"

  ### 5. Defining the Threshold (Pain vs. Nociception)
  **Question:** "You're pushing the boundary out to bivalves. But biologists distinguish between nociception (damage detection) and pain (the unpleasant feeling). If an oyster closes its shell when a starfish approaches, that's a reflex. At what exact point does 'damage detection' become 'suffering'? Is there a complexity threshold, or is any reaction to harm potentially sentient?"

  *   **Likely Dodge:** "It's a spectrum, not a binary line."
  *   **Follow-up:** "Okay, a spectrum. So where on that spectrum does moral protection kick in? Is the bottom 10% of the spectrum expendable? If you can't draw a line, how can anyone legislate one?"

  ### 6. Evolutionary Parsimony
  **Question:** "Evolution tends to be parsimonious; it doesn't usually reinvent complex traits unnecessarily. If consciousness is metabolically expensive, does it make sense that it evolved independently in vertebrates, cephalopods, crustaceans, and insects? Or is it more likely that complex behavior evolved many times, but inner experience evolved only once—or not at all?"

  *   **Likely Dodge:** "Convergent evolution is common for vital traits."
  *   **Follow-up:** "Vision evolved convergently, yes. But do you have evidence that the *subjective experience* of seeing evolved with the eye, or just the processing of light? You're assuming the 'ghost' evolved every time the 'machine' did."

  ### 7. The Policy Implication (Agriculture & Honey)
  **Question:** "If we take your view seriously, commercial beekeeping is potentially mass enslavement, and crop harvesting is mass slaughter. Are you prepared to advocate for the abolition of current agriculture based on your own framework? If not, does that mean the precautionary principle has a 'convenience' clause where we ignore it when the cost gets too high?"

  *   **Likely Dodge:** "We need to balance needs and transition slowly."
  *   **Follow-up:** "That sounds like the burden of proof *is* on the animal after all. Because if the cost to us is too high, their sentience suddenly doesn't mandate protection. Isn't that a pragmatic compromise, not a moral absolute?"

  ### 8. The Plant Slope
  **Question:** "Plants communicate damage, release distress signals, and compete for resources. Some researchers argue they have a form of intelligence. If your argument is based on behavioral complexity and response to harm, what specifically stops the precautionary principle from sliding all the way down to flora? Is it just the lack of a nervous system, and if so, why is silicon or chemical signaling less valid than neurons?"

  *   **Likely Dodge:** "Plants lack a central integrator."
  *   **Follow-up:** "Octopuses have distributed nervous systems, not central ones. If decentralization doesn't rule out sentience in an octopus, why does it rule it out in a plant? What's the hard barrier?"

  ### 9. The "Burden of Proof" Trap
  **Question:** "In our prep call, you mentioned that the burden isn't on the animal to prove it feels, but on us to prove it doesn't. But in science, we can't prove a negative. If the standard is 'prove it doesn't feel,' and that's impossible, then everything is sentient by default. Isn't that line just a rhetorical way to make your position unfalsifiable?"

  *   **Likely Dodge:** "We use probabilities, not absolute proof."
  *   **Follow-up:** "Then let's drop the 'burden of proof' language, because that implies a binary. If we're talking probabilities, then the default position *must* be non-sentience until evidence tips the scale. Why cling to the 'burden' phrasing if you admit it's about weighing evidence?"

  ### 10. The Falsifiability Closer
  **Question:** "I want to end on this: Science requires that a claim can be proven wrong. What specific piece of evidence, discovered tomorrow, would make you say, 'Okay, I was wrong. Insects (or bivalves) are definitely not sentient'? If there is no such evidence, then you aren't making a scientific claim, you're making a faith statement."

  *   **Likely Dodge:** "Absence of evidence isn't evidence of absence."
  *   **Follow-up:** "That confirms my fear. If neither a lack of brain structures nor a lack of complex behavior can rule out sentience, then your theory is compatible with every possible outcome. And if it's compatible with everything, it predicts nothing."
