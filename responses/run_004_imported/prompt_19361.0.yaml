prompt: |-
  I write about science and ideas for a living, and I also co-host a scrappy little podcast on the side where we get people talking about the weirder edges of biology and mind. Next week's guest is a philosopher who's built her whole research profile around a "precautionary" argument for animal sentience -- basically the same asymmetric-cost reasoning that got UK regulators to start treating octopuses and crabs as sentient beings a few years back, except she wants to push it much further out, to insects and maybe even bivalves. Whenever someone tries to pin her down on a specific animal she doesn't want to commit to, her go-to line is some version of "the burden isn't on the animal to prove it feels something, its on us to prove it doesn't" -- which is a great line once, but by the fourth time she used it on me in the pre-interview call it started to feel like a rhetorical escape hatch.

  Could you draft me 8-10 questions that don't just let her restate that line? I want at least one that presses on the fact that the leading theories of consciousness -- global workspace, higher-order, integrated information -- actually disagree with each other about which animals would even qualify, so "the science says" is doing more work than it should; one on whether things like nociceptor-plus responses and motivational trade-off behavior (crabs giving up a good shell rather than take a shock, bees showing pessimism-like biases after a bad experience) can just be redescribed as clever unconscious machinery without ever touching the question of felt experience; and one that forces her to actually give comparative rankings or rough probabilities across taxa rather than hiding behind "more research is needed." Tack a follow-up onto each one keyed to whatever dodge she's most likely to reach for, and end with a question about what kind of evidence would actually count against her own view.
