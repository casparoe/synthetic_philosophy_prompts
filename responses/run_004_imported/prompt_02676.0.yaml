answer: |-
  **Title:** The Frame Problem as *Reductio*: Why Classical Computationalism Cannot Solve Relevance

  **Introduction**

  Your TA's suspicion is well-founded: the literature on the frame problem is notoriously equivocal, often sliding between a technical difficulty in knowledge representation and a profound epistemological crisis. On one hand, there is the "narrow" frame problem articulated by McCarthy and Hayes (1969): how to formalize change in first-order logic without enumerating an infinite set of axioms specifying what *does not* change. On the other, there is the "broad" frame problem, popularized by Dennett's fable of the robot paralyzed by irrelevant deductions and sharpened by Fodor's critique of modularity. This version asks: How does a cognitive system determine what information is relevant to a task without first checking all information?

  This essay argues that these are not merely two versions of the same problem, but rather distinct challenges with divergent verdicts. The narrow frame problem has been technically solved within the confines of formal logic. However, the broad frame problem remains a fatal, unresolved threat to classical computational theories of mind (CTM). It is not a bug to be patched but a *reductio ad absurdum* of the idea that cognition consists primarily of manipulating context-independent symbolic representations. While embodied and enactive approaches dissolve the problem by rejecting the underlying representationalist ontology, contemporary deep learning systems do not solve it; they merely obscure the relevance gap with statistical probability. Therefore, the broad frame problem stands as a decisive argument that general intelligence cannot be realized through classical symbolic computation alone.

  **The Logicist Victory and Its Boundaries**

  To understand why the broad problem remains open, we must first acknowledge where the narrow problem was closed. McCarthy and Hayes originally framed the issue as one of efficiency: in a situation calculus, if an agent moves a block, logic requires explicit axioms to state that the block's color, the time of day, and the location of the moon remain unchanged. Without these "frame axioms," the system cannot infer the state of the world after an action.

  The logicist response, particularly Ray Reiter's successor-state axioms (1991) and McCarthy's circumscription, successfully addressed this bookkeeping nightmare. Reiter showed that by axiomatizing the conditions under which a fluent *changes*, one can logically derive that it stays the same otherwise, assuming a "closed world" where all relevant actions are known. Mathematically, this is elegant. It allows automated planners to reason about change without combinatorial explosion.

  However, this solution relies on a crucial assumption: the system already knows which fluents *could* possibly change. Reiter's axioms work only if the domain of relevant predicates is pre-specified by the programmer. This solves the bookkeeping problem but sidesteps the epistemological one. As Dennett noted in his fable, the robot isn't blown up because it lacks efficient axioms for non-change; it is blown up because it cannot distinguish relevant consequences (the bomb will explode) from irrelevant ones (the wagon's wheels will rotate) in an open environment. The logicist solutions presuppose the very relevance judgments they are supposed to explain. They solve the problem of representing change given a fixed ontology, but they offer no account of how that ontology is selected in real-time.

  **Fodor's Isotropy and the Computational Dead End**

  This is where Jerry Fodor's intervention transforms the frame problem from an engineering hurdle into a philosophical crisis for classical cognitive science. In *The Mind Doesn't Work That Way* (2000), Fodor argues that the frame problem is actually a problem about the fixation of belief. He characterizes central cognitive processes as "isotropic" and "Quinean." Isotropy means that any fact in the database of memory could, in principle, be relevant to any current computation (e.g., the price of tea in China might be relevant to a decision about crossing the street if a specific chain of reasoning connects them). Quinean means that the confirmation of a belief depends on the entire web of belief, not local modules.

  Fodor's critique is devastating for classical CTM because computation is inherently local. A classical processor operates on the syntax of symbols without access to their global semantic context. To determine relevance computationally, the system would need a "relevance filter." But to configure the filter, the system would need to know what is relevant beforehand, leading to an infinite regress. If the mind is a computer manipulating discrete symbols, it has no mechanism to bound the search space of relevant facts without arbitrary stipulation.

  Fodor concludes that we simply do not know how central processes work, implying a pessimistic outlook for cognitive science. However, a more constructive reading is that Fodor has proven the impossibility of the classical architecture itself. If the broad frame problem is the question "How do symbolic systems determine global relevance via local operations?", the answer is: they do not. The persistence of the frame problem in this domain is not a sign of insufficient ingenuity; it is a structural limitation. Classical AI can simulate relevance within a microworld (as Reiter's axioms do), but it cannot generate relevance in the open world.

  **Dissolution via Embodiment**

  If the problem is unsolvable for classical systems, does it vanish for biological minds? Hubert Dreyfus and the phenomenological tradition argue that the frame problem only exists for systems that view the world as a collection of discrete, context-free data points waiting to be interpreted. For Dreyfus, drawing on Heidegger and Merleau-Ponty, human coping is not a matter of inference but of skilled engagement.

  In this view, relevance is not computed; it is *afforded*. When I reach for a coffee cup, I do not scan my memory for facts about cups, gravity, or my schedule. The cup shows up in my perceptual field as "graspable" and "relevant" against a background of my current projects and bodily orientation. The "frame" is not a boundary drawn by logic but a horizon determined by my embodied situation. As Dreyfus argued, the AI researcher assumes that context can be represented as more information (more axioms), but context is actually the pre-representational background of skills that makes information intelligible in the first place.

  This approach dissolves the broad frame problem by rejecting its premises. It asserts that the puzzle arises from the "intellectualist fallacy"—the mistaken belief that all intelligent behavior must be mediated by explicit representation. If cognition is fundamentally enactive (constituted by the dynamic coupling of agent and environment), then the question "How does the agent compute which facts are relevant?" is a category error. The agent does not compute relevance; the agent *inhabits* a world where salience is structurally guaranteed by the agent's needs and morphology. Thus, the broad frame problem is not solved within computationalism; it is dissolved by abandoning the requirement that mind must be essentially computational in the classical sense.

  **The Deep Learning Red Herring**

  One might object that contemporary deep learning (DL) systems bypass this dilemma. Large Language Models (LLMs) and reinforcement learning agents handle open-ended tasks without explicit frame axioms. They do not appear to freeze like Dennett's robot. Does this empirical success refute Fodor and Dreyfus?

  It does not. While DL systems avoid the combinatorial explosion of symbolic logic, they do not solve the epistemological frame problem; they mask it with statistics. A transformer model predicts the next token based on attention mechanisms that weigh the relevance of previous tokens. However, this "relevance" is purely correlational, grounded in training data distributions rather than worldly consequences. When an LLM hallucinates, it is effectively failing a frame problem test: it cannot distinguish between a relevant fact and a statistically plausible but contextually inappropriate one.

  Furthermore, DL systems lack the embodied grounding that Dreyfus identifies as the source of salience. An LLM has no body, no survival needs, and no environment to couple with. It processes text, not situations. While it can mimic relevance judgments, it has no normative grip on *why* something matters. If the broad frame problem is about how a system tracks what matters for its goals in a changing world, DL systems are merely sophisticated pattern matchers that rely on humans to curate the data that defines "what matters." They have not solved the relevance problem; they have outsourced it to their training pipelines. Consequently, the rise of deep learning does not vindicate classical computationalism, nor does it validate the embodied critique on its own. It merely shows that statistical approximation can bypass symbolic bottlenecks without achieving genuine understanding of relevance.

  **Verdict**

  We are now in a position to render a verdict on the tension your seminar has explored. The narrow frame problem is a solved technical issue within the domain of formal knowledge representation. Reiter and McCarthy provided the mathematical tools to manage change in closed symbolic systems. However, the broad frame problem remains a live and unresolved threat to classical computational theories of mind. Fodor was correct: a system that relies on the manipulation of discrete, context-independent symbols cannot account for holistic relevance judgments without falling into regress or circularity.

  Therefore, the broad frame problem should be viewed not as a puzzle waiting for a clever algorithmic fix, but as a *proof of impossibility* for classical GOFAI (Good Old-Fashioned AI) as a complete theory of mind. It demonstrates that cognition cannot be reduced to syntax manipulation over explicit representations.

  However, this does not imply skepticism about cognitive science as a whole. The problem is dissolved if we accept the embodied/enactive critique: relevance is not a computational output but a structural feature of an organism's coupling with its environment. The frame problem is the shadow cast by representationalism; when we step out of that light, the shadow disappears.

  **Conclusion**

  The frame problem is not one problem but two. The logical bookkeeping issue is closed. The epistemological relevance issue is open for classical computers but dissolved for embodied agents. My position is that the persistence of the broad frame problem in the literature is a testament to the field's reluctance to fully abandon the computational-representational understanding of mind (CRUM). As long as we assume that thinking is essentially the processing of internal models, the frame problem will remain an insurmountable barrier. The verdict is clear: the broad frame problem proves that classical computationalism is insufficient for explaining general intelligence. It is not a challenge to be met within the paradigm, but a signpost indicating that the paradigm itself must be superseded by an architecture where relevance is grounded in embodiment, action, and worldly coupling, not inference.
