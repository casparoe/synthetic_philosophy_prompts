      *   *Nuance on the Friend:* The friend isn't *totally* crazy. Intention *is* distinct from action. But the specific constraint of the Toxin Puzzle (the reward depends on the *intention* itself, which requires a belief about the *action*) creates the bind. I should validate the intuition but show why it fails in this specific logical structure.
      *   *Clarifying "Foresight":* The user mentioned foresight blocks intention. This is the key. I need to emphasize the *transparency of intention*. To intend is to settle on acting. If I know I won't settle on acting later, I can't settle now.

  10. **Final Polish:** Check tone (adjudicatory but respectful), clarity, and ensure all constraints of the prompt are met. (Ensure the three planners are clearly defined and the "gap" question is answered).

  *(Self-Correction during drafting)*: Wait, did McClennen use exactly these terms? Yes, *Rationality and Dynamic Choice* distinguishes Myopic, Sophisticated, and Resolute. This is the correct framework.
  Make sure to explicitly address the "General Gap" question. Kavka argues it shows intention isn't just reduced to action. Bratman argues it shows the need for planning norms. Gauthier argues it shows standard utility maximization is flawed. I should synthesize this.

