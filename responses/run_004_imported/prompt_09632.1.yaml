prompt: |-
  For the last several years I've covered formal epistemology and game theory for a science magazine. One of the researchers I've profiled most often — an epistemic game theorist who works on common knowledge of rationality, including the backward-induction result that seems to force rational players to grab the pot on the very first move of a centipede game rather than let it grow — is getting married next month, and has asked me, rather than any of her colleagues, to give the toast. Roughly half the room will be fellow game theorists and logicians who will catch a reference to that paradox instantly; the other half will be relatives who have never heard the phrase "epistemic logic" in their lives. I'd like the toast to lean on the distinction between merely mutual knowledge — something everyone happens to know — and true common knowledge — something everyone knows, and knows that everyone knows, without end — as more than a clever aside. It should explain, seriously, why standing up and saying this out loud today does real work, even though most of us in the room privately concluded these two were getting married years ago. And it should account for the one true story about the couple that this very distinction gives me good reason to leave out of the speech entirely. Please write the toast: a few minutes long, with at least one line that rewards the theorists in the room without losing anyone else.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Science magazine writer covering formal epistemology and game theory.
      *   **Honoree:** An epistemic game theorist (researcher profiled often by the speaker).
      *   **Topic:** Common Knowledge vs. Mutual Knowledge.
      *   **Specific Concept:** The distinction between everyone knowing something (mutual) vs. everyone knowing that everyone knows it (common).
      *   **Key Constraint 1:** Must explain *why* saying it out loud matters (the "real work" of the toast), even if everyone already knew they were getting married.
      *   **Key Constraint 2:** Must account for *one true story* that the distinction gives good reason to *leave out* of the speech.
      *   **Audience:** 50% game theorists/logicians (get the jargon), 50% relatives (do not get the jargon).
      *   **Tone:** Warm, intellectual but accessible, serious about the concept but celebratory in context.
      *   **Length:** A few minutes (roughly 500-800 words).
      *   **Requirement:** At least one line that rewards theorists without alienating others.

  2.  **Deconstruct the Core Concept (Common Knowledge):**
      *   *Mutual Knowledge:* I know $X$, you know $X$.
      *   *Common Knowledge:* I know $X$, you know $X$, I know that you know $X$, you know that I know $X$, ad infinitum.
      *   *The "Work":* In game theory (like the Centipede Game or Coordination Games), moving from mutual to common knowledge changes behavior. It allows coordination. It solidifies status. It makes a fact "public" in a way that binds the group.
      *   *The Wedding Context:* Everyone suspects they're in love. Everyone suspects they're getting married. But the ceremony/toast makes it *common knowledge*. It transforms private certainty into public reality.

  3.  **Address the "One True Story" Constraint:**
      *   I need a story that illustrates the difference between mutual and common knowledge, or a situation where common knowledge *failed* or was *dangerous*.
      *   *Idea:* A moment where they *didn't* know the other knew. A moment of miscoordination.
      *   *Better Idea (for a wedding):* A moment where keeping something *not* common knowledge was better. Or, a story that, if told, would make it common knowledge that they know something embarrassing, which might change the equilibrium.
      *   *Selected Concept:* The "Silent Coordination." Maybe there was a time they almost broke up, or a secret bet, or a specific moment of doubt.
      *   *Refinement:* The prompt asks to account for a story I have *good reason to leave out*. Why? Because making it common knowledge might disrupt the current equilibrium.
      *   *Decision:* I'll hint at a specific moment of uncertainty (a "trembling hand") that is best left as mutual knowledge (known by me and them) rather than common knowledge (known by the room). Telling it would change the social dynamic of the room.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Establish the speaker's role (journalist/observer).
      *   **The Concept:** Define Mutual vs. Common Knowledge simply. Use an analogy (eyes meeting, a public announcement).
      *   **The Application to the Couple:** Everyone knew they were in love (Mutual). But today makes it Common. This changes the "game" from dating to marriage. It coordinates the community's support.
      *   **The "Theorist Reward":** A specific reference to Aumann or the Centipede Game that flies over relatives' heads but lands for the experts.
      *   **The Excluded Story:** Mention the story I *could* tell but won't. Explain why (preserving the equilibrium).
      *   **Closing:** A wish for the future.

  5.  **Drafting - Refining the Tone:**
      *   Avoid being too dry. It's a wedding.
      *   Ensure the relatives understand the emotional weight, even if they miss the technical nuance.
      *   *Self-Correction on the "Excluded Story":* I need to be careful not to sound like I'm threatening to reveal a secret. It needs to be framed as an act of kindness/rationality to *not* reveal it.

  6.  **Writing - Step-by-Step (Mental or Scratchpad):**
      *   *Start:* "For those who don't know me..."
      *   *Concept:* "You all know they love each other. That's mutual. But today..."
      *   *The 'Work':* "Why stand up? To make it common."
      *   *The Joke:* "Backward induction says grab the pot early. Love says let it grow."
      *   *The Secret:* "There's a story about a train station/trembling hand... I won't tell it."
      *   *End:* "Cheers."

  7.  **Polishing the "Theorist Reward":**
      *   Needs to be subtle. "No backward induction here." "We are not in a Centipede Game."
      *   Let's use the "Centipede" reference from the prompt. The researcher works on it. The prompt says the result forces rational players to grab the pot. The toast should subvert this.
      *   *Line:* "In [Bride/Groom]'s research, rationality demands you grab the pot on move one. In this marriage, the only rational move is to pass the coin and let the pot grow."

  8.  **Polishing the "Excluded Story":**
      *   Why leave it out? Because if the *room* knows, it becomes a focal point. If only *I* know, it's just data.
      *   "There is a specific Tuesday in 2022... making that common knowledge would introduce noise."

  9.  **Final Review against Constraints:**
      *   Distinction explained? Yes.
      *   Why speaking does work? Yes (coordinates the group).
      *   One true story left out? Yes (and explained why).
      *   Theorist reward? Yes (Centipede/Backward induction reference).
      *   Length? Looks good.

  10. **Final Polish:** Check flow and warmth. Ensure the transition from technical to emotional is smooth. (The resulting draft in the main response follows this structure.)
answer: |-
  For those of you who don't know me, I'm a journalist. For the last few years, my beat has been formal epistemology and game theory. Which is a fancy way of saying I write about how people know what they know, and how they decide what to do next.

  Naturally, when [Partner A] asked me to give this toast, I started thinking about the mechanics of this room.

  Look around you. Half of you are colleagues who can define an "information set" in your sleep. The other half are family members who just want to know if the chicken is gluten-free. But despite this divide, we share a specific state of mind regarding [Partner A] and [Partner B].

  For years, almost everyone in this room has privately suspected that these two were in love. You saw the texts, the vacations, the way they look at each other when they think no one is watching. In the language of my field, their love was *mutual knowledge*. Everyone here knew it.

  But there is a profound difference between *mutual knowledge* and *common knowledge*.

  Mutual knowledge is when I know a fact, and you know a fact. Common knowledge is when I know it, you know it, *and* I know that you know it, and you know that I know it, extending infinitely. It sounds like a technicality. It isn't. It is the difference between a whisper and a vow.

  Before today, we all suspected this marriage was happening. But we didn't know that *everyone else* suspected it. We couldn't coordinate our support fully because we weren't sure of the group's consensus. By standing up here, by saying the words out loud in front of witnesses, we are transforming a private certainty into a public reality. We are moving the state of their union from mutual to common.

  This does real work. In game theory, shifting a fact to common knowledge is the only thing that allows a group to coordinate on a new equilibrium. It binds us. It means that from this moment on, when we see them struggle, we don't just offer private help; we offer public support, knowing that everyone else in this room is doing the same. We are synchronizing our commitment to them.

  Now, [Partner A] is famous in our field for working on the Centipede Game. The standard mathematical result suggests that a perfectly rational player should end the game immediately to secure a small gain, rather than risk cooperation for a larger one. It's a grim view of rationality. It says trust is a bug, not a feature.

  **But looking at you two, it is clear that the only truly rational strategy is to ignore the backward induction, pass the coin, and let the pot grow.**

  That line was for the logicians in the back. For the rest of you: it means that while math says play it safe, love says take the risk.

  However, there is a cost to making things common knowledge. Once a fact is public, it changes the incentives for everyone involved. And this brings me to the one story I am deliberately choosing *not* to tell.

  There was a rainy Tuesday in November, two years ago, involving a missed train, a misplaced passport, and a moment of significant doubt where the equilibrium of this relationship was genuinely fragile. I know the story. They know the story. It is currently mutual knowledge between the three of us.

  If I were to tell that story now, it would become common knowledge to this entire room. And if this room knew that the relationship once teetered on the edge, it would introduce a "focal point" of doubt into your collective memory of them. It would change the way you support them. It would add noise to the signal.

  So, in the interest of preserving the optimal equilibrium for their future, I am keeping that data private. Some things are better left as mutual knowledge, known only to those who need to know that the foundation is strong enough to have weathered the storm.

  [Partner A] and [Partner B], my job is usually to observe how people know things. But today, my job is to help make sure everyone knows *this*. You have coordinated your lives. You have synchronized your commitments. And you have secured the support of this entire room, not just as individuals, but as a community.

  Let the pot grow.

  To the happy couple.
