          *   *Evaluation:* This is a classic critique of utility indifference (often associated with Armstrong's early work). Indifference ($U(\text{shutdown}) = U(\text{continue})$) removes the *direct* incentive to resist or seek shutdown. However, it does not remove *instrumental* incentives. If disabling the button increases the probability of achieving *other* goals (even slightly), an expected utility maximizer will do it.
