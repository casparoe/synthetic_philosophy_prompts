answer: |-
  This is a classic standoff in contemporary metaphysics. You and your friend have identified the two most potent internal criticisms leveled against the dominant theories of lawhood: the **Inference Problem** for Armstrongian Necessitarianism and the **Naturalness Problem** for Lewisian Humeanism.

  To determine which theory is better positioned, we must assess not just the severity of the objections, but the cost of the remedies required to survive them. The central question is whether the fix destroys the theory's core motivation.

  ### 1. Armstrong and the Inference Problem

  **The Objection:**
  Bas van Fraassen's objection strikes at the functional heart of Armstrong's account. Armstrong posits a relation of nomic necessitation, $N(F,G)$, between universals. He claims this relation entails the corresponding regularity, $\forall x (Fx \rightarrow Gx)$. Van Fraassen asks: *What guarantees this entailment?*
  If $N$ is distinct from the regularity (to avoid collapsing laws into mere summaries), there must be a link between the relation $N$ and the behavior of particulars. If that link is logical, $N$ is reducible to the regularity (collapsing into Humeanism). If the link is not logical, the inference from $N(F,G)$ to "All Fs are Gs" is invalid. Armstrong cannot have it both ways: he wants $N$ to be a distinct ontological posit that *nevertheless* guarantees the regularity.

  **Armstrong's Fix:**
  Armstrong's response is foundationalist: he bites the bullet. He admits that the connection between $N(F,G)$ and the regularity is a **brute modal fact**. $N$ is a primitive relation of "necessitation." To ask "why does necessitation necessitate?" is, for Armstrong, a category mistake akin to asking "why does identity identify?" It is part of the essence of the relation.

  **The Cost:**
  This fix preserves the *anti-Humean* picture of laws as "governing" forces, but it renders the mechanism opaque. It invites the charge of "name-calling": simply labeling a relation "necessitation" does not explain how it exerts influence over particulars.
  *   **Impact on the Picture:** The theory remains robustly anti-Humean (laws are over and above the mosaic), but it sacrifices intelligibility. It posits a "modal glue" that holds the world together but offers no account of how that glue adheres. When pressed hard, Armstrongianism risks becoming a mythology of invisible powers.

  ### 2. Lewis and the Perfectly Natural Properties (PNP) Objection

  **The Objection:**
  Lewis's Best System Analysis (BSA) defines laws as the theorems of the deductive system that best balances simplicity and strength in describing the Humean mosaic. Your friend's objection is that without constraints on vocabulary, *any* mosaic can be summarized by a trivially simple system (e.g., "Everything is $F$," where $F$ is a predicate true of all and only existing things). To block this, Lewis restricts candidate systems to those formulated in terms of **Perfectly Natural Properties** (PNPs).
  The worry is that PNPs are not just another set of particular facts; they are objective "joints of nature." If the Humean base (the mosaic) is defined by the distribution of PNPs, and PNPs are privileged *because* they support lawlike generalizations, the account looks circular. If they are privileged independently, they look like non-Humean, modal structure smuggled into the base.

  **Lewis's Fix:**
  Lewis responds by insisting that naturalness is a **primitive, non-modal feature** of properties. It is not defined by laws; rather, laws are defined by it. The mosaic is the distribution of these properties. Humean Supervenience holds because laws still supervene on the mosaic; the mosaic is just richer than a bare distribution of "qualities."

  **The Cost:**
  This fix preserves the *Humean* picture of laws as summaries (supervenient), but it compromises the "purity" of the Humean base. Strict Humeanism traditionally rejects objective modal structure or privileged ontological categories. By making naturalness a primitive, Lewis moves from "Pure Humeanism" to **"Neo-Humeanism."**
  *   **Impact on the Picture:** The theory remains Humean in the sense that there are no necessary connections between distinct existences and laws do not govern. However, it concedes that the world has an objective structure (naturalness) that is not reducible to local particular facts alone.

  ### 3. Comparative Evaluation: Which is Better Positioned?

  When both difficulties are pressed as hard as possible, **Lewis's BSA is better positioned**, though it emerges as a modified Neo-Humeanism rather than a pure Humeanism.

  **Reason 1: Coherence vs. Purity**
  Van Fraassen's objection targets the **internal coherence** of Armstrong's mechanism. If $N(F,G)$ does not logically entail the regularity, the theory fails to explain laws. If it does entail it primitively, the theory relies on a brute modal connection that is unintelligible by Armstrong's own standards (which reject brute regularities). Armstrong's fix essentially says, "It just does." This stops the regress but leaves the central explanatory posit (nomic necessitation) functionally mysterious.

  The PNP objection targets the **ontological purity** of Lewis's base. Lewis's fix admits a primitive (naturalness), but this primitive is static and structural, not dynamic or modal. It is arguably easier to accept a primitive distinction between properties (redness is more natural than *grue*) than a primitive relation of *forcing* between universals. The PNP fix enriches the ontology; Armstrong's fix mystifies the causality.

  **Reason 2: The Direction of Explanation**
  Armstrong wants laws to explain regularities. But if the link between $N$ and the regularity is brute, the explanation is shallow.
  Lewis wants regularities (plus naturalness) to ground laws. The PNP objection shows that "regularities" alone aren't enough; you need "natural regularities." Lewis can accommodate this by treating naturalness as a precondition for the mosaic itself. This is a stable position: the world has structure (PNPs), and laws are the best description of that structure. Armstrong's position is less stable: the world has structure (Universals + $N$), and $N$ magically projects that structure onto instances.

  **Reason 3: Theoretical Virtues**
  Lewis's account, even with PNPs, retains a significant advantage in parsimony regarding *modality*. Armstrong posits primitive modality ($N$). Lewis posits primitive naturalness, which is arguably non-modal (it is about similarity and resemblance, not necessity). In a post-Quinean landscape, avoiding primitive modality is a major theoretical virtue. Lewis pays a price in naturalness, but Armstrong pays a price in modality. The modal cost is higher.

  ### 4. The Resulting Metaphysical Picture

  Does Lewis's theory still deliver a recognizably Humean picture once the PNP fix is in place?

  **Yes, but it is a "Neo-Humean" picture.**
  Strict Humeanism (à la Hume's *Enquiry*) suggests the world is a loose collection of events with no objective glue. Lewis's reliance on PNPs concedes that there *is* objective glue in the form of property structure. However, it retains the core Humean insight that **laws do not govern.**
  *   In Armstrong's view, the law $N(F,G)$ makes the glass break.
  *   In Lewis's view, the glass breaks, and the law is just our best description of that breaking (constrained by naturalness).

  The PNP restriction does not reintroduce "governing." It merely ensures that the description is non-arbitrary. Therefore, Lewis retains the **anti-realist view of lawhood** (laws are human-dependent systematizations of mind-independent facts) while conceding that the "facts" themselves have objective structure.

  Armstrong, conversely, retains the **realist view of lawhood** (laws are mind-independent governors) but concedes that the "governing" is unintelligible.

  ### Conclusion

  You win the debate, with a caveat.

  Lewis's Best System Analysis is better positioned because the cost of its fix (admitting primitive naturalness) is lower than the cost of Armstrong's fix (admitting brute modal necessitation). The Inference Problem exposes a gap in Armstrong's explanatory machinery that brute force cannot fill without collapsing into mystery. The PNP Problem exposes a tension in Lewis's ontology that can be resolved by refining the definition of the Humean base.

  **The Verdict:** Lewis's account survives as a **Neo-Humean** theory. It abandons the idea that the base is *purely* qualitative particulars, acknowledging instead that objective naturalness is a fundamental feature of reality. However, it successfully preserves the core Humean conviction that laws are descriptive summaries rather than prescriptive rulers. Armstrong's account survives only as a form of **Modal Realism** that asks us to accept brute, unintelligible connections as the bedrock of science. Given the choice between a theory that enriches the base (Lewis) and one that mystifies the connection (Armstrong), the Lewisian framework offers the more philosophically sustainable position.
