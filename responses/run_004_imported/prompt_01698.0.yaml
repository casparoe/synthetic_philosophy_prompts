      *   **Point 5: The "Paradox" is a Category Error.** The paradox only exists if you insist CKR holds in a finite game where cooperation is observed. If you acknowledge CKR is fragile, BI is still valid *conditional* on CKR, but CKR is rarely present. So BI isn't wrong; its precondition is just rarely met.
