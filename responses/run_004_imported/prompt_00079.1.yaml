          *   CDT assumes independence between act and state (unless causally linked).
          *   In high-stakes adversarial settings, this assumption fails because the *state* (opponent's move) is a function of a *prediction* of your act.
          *   *Implication:* CDT agents are exploitable in these settings. They "second-guess" themselves into loops.
          *   *Real-world:* Algorithmic trading. If your algo thinks "My trade doesn't move the market," but the market anticipates your algo, you lose.
      *   **2. Ratifiability as a Stability Check:**
