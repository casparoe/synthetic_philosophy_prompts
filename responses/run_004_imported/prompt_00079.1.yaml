      *   **Tone:** Academic but accessible, rigorous enough for a grad seminar, but focused on application/implications.

  2.  **Deconstruct the Core Problem:**
      *   *Death in Damascus:* You choose City A or B. Death predicts where you go and goes there. If you match, you die. If you mismatch, you live.
      *   *CDT Problem:* CDT says "My choice doesn't *cause* Death's location." So, I should go where Death *isn't*. But if I think Death isn't in A, I go to A. But Death predicts I go to A, so Death is in A. Instability ensues.
      *   *EDT Problem:* EDT says "Going to A is evidence Death is in A." So both options look bad (high probability of death).
      *   *Ratifiability:* An action is ratifiable if, conditional on choosing it, it maximizes expected utility. In Death in Damascus, no pure strategy is ratifiable. Mixed strategies might be.

  3.  **Address the "So What?" (Real-World Relevance):**
