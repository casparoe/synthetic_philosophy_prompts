answer: |-
  The banquet hall of the Vienna Hotel was loud, a cacophony of clinking cutlery and overlapping conversations in half a dozen languages. Elena pushed her half-eaten schnitzel aside and swirled the Grüner Veltliner in her glass. Across the table, Marcus was loosening his tie, looking tired but amused.

  They hadn't seen each other since their doctoral days at the LSE, thirty years ago. Back then, they had shared a supervisor and a skepticism toward the Vienna Circle's logical positivism. Now, Elena was known for her sharp defenses of empirical demarcation, while Marcus had built a career on the history of theoretical practice and the sociology of high-energy physics.

  "That keynote was a provocation," Elena said, nodding toward the empty podium where the speaker had just railed against the 'post-empirical' turn in physics. "Though I suspect half the audience was checking their phones for supersymmetry updates."

  Marcus smiled. "And the other half was wondering if they've wasted their lives on a mathematical fantasy. You looked like you were ready to stand up and cheer when he cited Ellis and Silk."

  "I was," Elena admitted. "It's the integrity of the enterprise, Marcus. I spent my early career studying the rhetoric of physics. But this? When you have a theory that can accommodate *any* experimental outcome by shifting to a different vacuum in the landscape, you aren't doing science. You're doing theology with better calculus. Popper would have had a fit."

  "Popper did have a fit," Marcus countered, picking up his fork. "But Popper also thought Newtonian mechanics was metaphysical until it was falsified. You know as well as I do that actual science doesn't work by immediate falsification. If we followed *The Logic of Scientific Discovery* strictly, we'd have discarded the Bohr model on the first anomaly, and never gotten to quantum mechanics."

  "I'm an experimentalist at heart, even if I write philosophy now," Elena said. "I know we don't drop theories on a single anomaly. But there has to be a limit. Lakatos gave you the 'protective belt,' fine. You can adjust auxiliary hypotheses. But the 'hard core' must eventually yield fruit. And that's where your friends in string theory are in trouble. Lakatos is actually harder on them than Popper is."

  Marcus raised an eyebrow. "That's a bold claim. How do you figure?"

  "Because Lakatos distinguishes between a *progressive* and a *degenerating* research programme," Elena said, leaning forward. "A progressive one predicts *novel facts*. It tells you something about the world you didn't know, and then you go look and find it. A degenerating one just patches up the belt to explain what you already know. String theory has been the hard core for forty years. Where are the novel facts? Supersymmetry didn't show up at the LHC. The cosmological constant is still a problem. It feels like one long, expensive protective belt adjustment."

  Marcus set his fork down. He took a sip of wine, considering. "You're right that if you apply Lakatos mechanically, string theory looks degenerating. But you're ignoring the timescale and the nature of the 'facts' in fundamental physics. Lakatos was looking at Newton and Einstein, where the gap between theory and observation was bridgeable. Here, the energy scales are Planckian. We physically cannot build a collider that size."

  "So you change the definition of science to fit the theory?" Elena asked sharply. "That's exactly what Ellis and Silk warned about."

  "No. I'm saying we have to look at how theory assessment actually works when direct empirical access is blocked," Marcus said. "This is where Dawid comes in. You're dismissing non-empirical confirmation as a cop-out. I see it as a necessary evolution of Bayesian reasoning. If every other viable path to unification has hit a wall—the 'No Alternatives' argument—and string theory keeps solving internal consistency problems that shouldn't fit together—the 'Unexpected Explanatory Interconnections'—that *is* evidence. Not proof, but evidence."

  "Evidence of mathematical consistency, not physical truth," Elena corrected. "Lakatos talked about theoretical progress, yes. But ultimately, the shift had to be empirically progressive. If you decouple the programme from empirical novelty entirely, you lose the anchor. You could have a research programme that is mathematically lush for centuries but describes a universe that isn't ours. Is that physics?"

  Marcus sighed. "It's a risk. I grant you that. But consider the alternative. If we declare string theory 'unscientific' now, we defund it, we stop the work. But what if the mathematics is leading us to the right structure, and we just lack the technological means to verify it for another hundred years? Do we tell Einstein in 1915 that General Relativity is pseudoscience because the bending of light hadn't been measured yet?"

  "Einstein made a specific prediction about the bending of light," Elena shot back. "He put his neck on the line. He said, 'If the stars don't shift by this amount during the eclipse, I'm wrong.' String theorists say, 'If the superpartners don't show up, we'll just look at a different sector of the landscape.' That's not putting your neck on the line. That's buying insurance."

  Marcus nodded slowly. "Okay. That's the strongest point against the Landscape Multiverse specifically. The 'anything goes' aspect. But not all string theory is the Landscape. There are corners of the theory space that *do* make rigid predictions. AdS/CFT correspondence, for instance. It's not a direct test of strings, but it's a rigorous duality that has generated insights in condensed matter physics. That's a novel interconnection."

  "It's a mathematical duality," Elena insisted. "It's not a prediction about a new particle or a new force. It's consistency. Look, Marcus, I'm not trying to be a naive Popperian. I know theory is messy. But the demarcation line isn't about what we do *today*; it's about the direction of travel. If the trajectory is toward less testability, less risk, and more accommodation, the programme is degenerating. If the trajectory is toward sharper, riskier constraints, it's progressive. My worry is that the sociology of the field is rewarding the former."

  Marcus leaned back, looking at the ceiling. "I can accept that. In fact, I think a sophisticated Lakatosian *should* be worried about that. If the community stops trying to find ways to falsify the hard core, and focuses only on expanding the protective belt to absorb null results, the programme will die naturally. Science is self-correcting, eventually. But the question is: do we kill it prematurely by fiat?"

  "I don't want to kill it by fiat," Elena said, her tone softening. "I want it to play the game. The game of risk."

  "Then perhaps we can agree on the conditions for staying in the game," Marcus said. "Even if we disagree on whether string theory is currently meeting them."

  "Go on."

  "From my side," Marcus said, counting on his fingers, "String theory remains a legitimate scientific research programme if it continues to generate *theoretical* progress that constrains the space of possible physical theories. If it stops producing new mathematics or new connections to other fields, it becomes sterile. But crucially, it must maintain the *intent* of empirical contact. It cannot declare empirical verification impossible in principle."

  Elena nodded. "And from my side: It remains science if it retains *falsifiability in principle*, even if not in practice today. There must be a conceivable observation—perhaps cosmological, perhaps indirect—that would rule it out. If the theory evolves to a point where *no* possible observation could contradict it, it has crossed the line into metaphysics. And, I would add, it needs to stop treating the Landscape as a get-out-of-jail-free card for every null result."

  Marcus smiled. "So, we agree on the boundary conditions. 1: No 'in principle untestable' claims. 2: No infinite patching of the protective belt without new insights. 3: The community must treat empirical failure as a cost, not a free variable."

  "Exactly," Elena said. "If they treat the lack of supersymmetry at the LHC as a minor nuisance to be explained away by 'split supersymmetry' or 'high-scale SUSY' without any new payoff, that's degeneration. If they treat it as a crisis that forces a radical rethink of the hard core, that's science."

  "The problem," Marcus mused, "is that 'crisis' takes a generation. Kuhn told us that. Lakatos told us that. You and I might be dead before the verdict is in."

  "Probably," Elena agreed. She picked up her wine glass. "But the norms we defend now determine whether the next generation knows how to tell the difference between a breakthrough and a dead end."

  Marcus clinked his glass against hers. "To the hope that the universe is kinder to theorists than the LHC has been."

  "And to the hope," Elena added, "that philosophers don't let them off the hook too easily."

  They drank. The noise of the dinner rose around them again, but the space between them felt a little less contested.
