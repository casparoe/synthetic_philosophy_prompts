prompt: |-
  I am a philosophy professor putting together remarks as a discussant for a colleague's paper at a small workshop on social ontology next month. Rather than respond to her paper directly, I decided to use the slot to work out a nagging thought about David Lewis's account of convention that resurfaced while I was re-reading his book Convention for a graduate seminar this term. What follows is close to what I would actually say, and I would like your comments before I commit to it in front of an audience that includes people who have thought about this material far more carefully than I have.

  Lewis defines a convention as a regularity in behavior, within a population facing a recurring coordination problem, that persists because everyone conforms to it, expects everyone else to conform, and prefers to conform on condition that the others do. The whole arrangement is sustained by common knowledge and by the availability of at least one equally workable alternative regularity that could have done the same job. On this picture, the "ought" attaching to a convention is purely instrumental: you ought to drive on the right given that everyone else does, in exactly the sense that you ought to carry an umbrella given that you want to stay dry. Margaret Gilbert has argued this cannot be the whole story, for two reasons. First, Lewis's definition requires near-total conformity, yet we still call something a convention when almost nobody follows it any more (her example is thank-you notes after a dinner party, a nominal convention in some social circles even though hardly anyone still writes them). Second, and more importantly, when someone breaks a convention we do not merely predict that things will go worse for them, as we would for someone who forgot an umbrella; we think they can be rebuked, that they owe the rest of us something. Her fix is that conventions rest on a joint commitment among the parties, and that it is this commitment, rather than the underlying coordination payoffs, that grounds the standing to rebuke.

  My worry is that the diagnosis is right but the cure is not: "joint commitment" seems to just rename the explanandum. Why does a joint commitment bind, when a mere coincidence of individual commitments does not? And why do conventions nobody ever explicitly signed on to (I never agreed to drive on the right; I was born into it) inherit the same obligation-generating force that Gilbert reserves for cases of explicit joint agreement? It occurred to me that Brian Skyrms's evolutionary treatments of convention might help here, though not in the way Skyrms intends: he shows conventions of meaning, and even rudimentary fairness norms, emerging through reinforcement or replicator dynamics among agents with no common knowledge and, in his toy models, no beliefs at all. This is usually read as making Lewis's picture even more deflationary, but suppose the disposition to resent free-riders is itself among the traits selected for in populations that sustain such equilibria. Then the normative residue Gilbert is after would be neither a brute fact about joint commitment nor a case of instrumental rationality, but an evolved reactive attitude layered on top of the equilibrium, for reasons that have nothing to do with anyone's reasoning, individual or joint. On this reading, Cristina Bicchieri's distinction between mere conventions, stabilized by everyone's expectations about what others will do, and full social norms, which additionally require the belief that others think one ought to conform and a willingness to sanction, would not mark out a genuinely different kind of case, as she intends it to, but would just be tracking where this evolved layer happens to have attached itself.

  I would like your comments on four things in particular: whether I have represented Lewis and Gilbert accurately and fairly to both; whether "joint commitment just relabels the explanandum" is a fair objection or whether there is an obvious reply on Gilbert's behalf that I am missing; whether the appeal to Skyrms plus an evolved reactive attitude is doing real philosophical work or is a non-sequitur dressed up as an explanation; and whether reading Bicchieri's normative expectations as tracking that same evolved layer is a plausible extension of her view or does violence to it. I am less interested in a verdict on the overall thesis than in where the argument's weakest joints are.
reasoning: |-
  Here's a thinking process that leads to the suggested comments:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy professor.
      *   **Task:** Preparing remarks as a discussant for a colleague's paper at a small workshop on social ontology.
      *   **Topic:** David Lewis's account of convention vs. Margaret Gilbert's critique, with a proposed synthesis using Brian Skyrms (evolutionary game theory) and Cristina Bicchieri (social norms).
      *   **Audience:** Experts in social ontology (some know this material better than the user).
      *   **Goal:** Critique the draft remarks on four specific points (accuracy of Lewis/Gilbert, strength of the "joint commitment" objection, viability of the Skyrms/evolutionary move, and the Bicchieri extension).
      *   **Tone:** Professional, constructive, rigorous, philosophical.

  2.  **Deconstruct the Draft Argument:**
      *   **Lewis:** Convention = regularity in recurring coordination problem, sustained by common knowledge, preferences conditional on others, alternative regularity possible. "Ought" is instrumental/hypothetical.
      *   **Gilbert:** Lewis fails because (1) conventions persist without near-total conformity (thank-you notes), (2) conventions carry normative force (rebuke) not found in mere instrumental rationality. Solution: Joint Commitment.
      *   **User's Worry:** Gilbert's "joint commitment" is question-begging (why does it bind? what about implicit conventions?).
      *   **User's Proposal:** Use Skyrms. Conventions emerge via evolution/reinforcement. Add evolved reactive attitudes (resentment of free-riders).
      *   **Conclusion:** The normative "ought" is an evolved reactive attitude layered on the equilibrium. Bicchieri's distinction (conventions vs. norms) just tracks where this layer attaches, not a metaphysical difference.

  3.  **Evaluate Point 1: Accuracy of Lewis and Gilbert:**
      *   *Lewis:* The summary is standard and accurate. Key elements (coordination problem, common knowledge, alternative regularity, conditional preference) are there. The instrumental "ought" is correctly identified.
      *   *Gilbert:* The "thank-you notes" example is a classic Gilbert move (challenging the conformity condition). The normative force/rebuke point is central to *On Social Facts*. The "joint commitment" solution is accurately described.
      *   *Nuance:* Lewis does allow for *approximate* regularity, but Gilbert pushes harder on the normative aspect. The summary is fair enough for a discussant remark.

  4.  **Evaluate Point 2: The "Joint Commitment" Objection:**
      *   *User's Objection:* "Joint commitment just renames the explanandum." Why does it bind? What about implicit conventions?
      *   *Gilbert's Defense:* Gilbert anticipates this. She argues joint commitment is a primitive sui generis phenomenon. It's not reducible to personal commitment. She explicitly addresses the "born into it" issue via the idea of *readiness* to participate in a joint commitment (often tacit).
      *   *Weakness:* The user's objection hits a real nerve in social ontology (the normativity problem). However, saying it "just renames" might be too dismissive of Gilbert's detailed account of *how* joint commitments are formed (pooling of wills).
      *   *Verdict:* It's a fair *philosophical* objection (the "why is it normative?" question remains), but Gilbert has a specific reply (it's a primitive source of obligation). The user needs to acknowledge her primitivism to avoid looking like they missed her main book.

  5.  **Evaluate Point 3: Skyrms + Evolved Reactive Attitudes:**
      *   *The Move:* Shift from rational choice/commitment to evolutionary psychology/biology. Normativity = evolved resentment.
      *   *Potential Issue:* Is this a category error? Hume's is/ought problem. Explaining the *origin* of a feeling isn't the same as justifying the *normative force*. If I feel resentment, does that mean the violator *ought* not to have violated? Or just that I *feel* like punishing them?
      *   *Skyrms's Intent:* Skyrms is usually descriptive/explanatory, not normative.
      *   *User's Twist:* Using it to explain the *phenomenology* of normativity (the "residue" Gilbert wants).
      *   *Risk:* Experts might see this as naturalizing away the normativity rather than explaining it. It explains why we *think* there's an obligation, not whether there *is* one.
      *   *Verdict:* This is the riskiest part. It needs to be framed carefully as an error theory or a genealogical account of normative *beliefs*, not necessarily normative *truths*.

  6.  **Evaluate Point 4: Bicchieri Extension:**
      *   *Bicchieri:* Distinguishes descriptive norms (expectations) from injunctive norms (expectations + normative expectations + sanctions).
      *   *User's Move:* This distinction isn't metaphysical; it's just where the evolved attitude sticks.
      *   *Critique:* Bicchieri is empirical/psychological. She might actually agree! She doesn't ground norms in metaphysical joint commitments but in psychological preferences conditional on expectations.
      *   *Risk:* Bicchieri might argue the distinction *is* functional, not just tracking an evolutionary layer. But the user's reading is plausible if framed as a unifying underlying mechanism.
      *   *Verdict:* Plausible, but needs to ensure it doesn't misrepresent Bicchieri's specific criteria for empirical identification.

  7.  **Synthesize and Structure the Feedback:**
      *   **Tone:** Collegial, respectful of the expertise in the room, highlighting where the argument is strong and where it invites attack.
      *   **Structure:** Address the four specific points requested.
      *   **Key Advice:**
          1.  Lewis/Gilbert summary is solid.
          2.  Gilbert objection needs to acknowledge her "primitivism" to avoid a strawman.
          3.  Skyrms move risks the Is/Ought gap (explaining feelings vs. justifying claims).
          4.  Bicchieri reading is interesting but might be more compatible than the user thinks.
      *   **Strategic Suggestion:** Since this is a discussant role, framing this as a "proposal for future work" or a "puzzle" rather than a definitive refutation might be safer given the audience.

  8.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction on Gilbert:* Make sure to mention *On Social Facts*. She explicitly deals with tacit agreement. The user's point about "never explicitly signed on" is something she addresses via "readiness." I need to point this out so the user can preempt it.
      *   *Correction on Skyrms:* The user says "normative residue... would be... an evolved reactive attitude." This sounds like an error theory (there is no real obligation, just feelings). Gilbert claims there *is* an obligation. The user needs to be clear: are they denying Gilbert's ontology or explaining its origin?
      *   *Correction on Bicchieri:* Bicchieri is a social scientist/philosopher who cares about empirical modeling. She might welcome the evolutionary grounding. The "violence" might be minimal.

  9.  **Final Polish:** Ensure the language matches a philosophy professor's register (e.g., using terms like "sui generis," "genealogical," "normative force," "explanandum").

  10. **Output Generation:** (Drafting the response based on these thoughts.)
answer: |-
  This is a sophisticated and provocative set of remarks. Given the audience (social ontology experts), you are right to be cautious; they will spot a strawman or a category error immediately. However, the core intuition—bridging the gap between Lewis's equilibrium and Gilbert's normativity via an evolutionary/genealogical account of reactive attitudes—is philosophically fertile ground.

  Here are my comments on the four specific areas you highlighted, followed by a few strategic suggestions for the delivery.

  ### 1. Accuracy of Lewis and Gilbert
  **Verdict:** Your summary is accurate and fair, but it could be slightly sharpened to preempt specific counter-moves from Gilbertians in the audience.

  *   **Lewis:** You have captured the standard interpretation of *Convention* correctly (regularity, coordination problem, common knowledge, alternative regularity, conditional preference). The characterization of the "ought" as purely instrumental/hypothetical is also standard.
  *   **Gilbert:** Your summary of her two main critiques (the conformity condition and the normative force/rebuke condition) is accurate.
  *   **Refinement:** On Gilbert's first point (thank-you notes), be prepared for the reply that Gilbert distinguishes between a convention *existing* and a convention *being in force*. She might argue that if *no one* follows it, it is a "dead" convention, much like a dead language, but still intelligible as a convention-type.
  *   **Refinement:** On the "born into it" point (implicit conventions), Gilbert anticipates this in *On Social Facts*. She argues that joint commitment does not require explicit signing; it requires a mutual expression of *readiness* to be jointly committed, which can be tacit. You mention this briefly ("never explicitly signed on"), but you should acknowledge that she has a specific mechanism for tacit uptake. If you don't, a Gilbert defender will say, "She already solved this with the concept of tacit joint commitment."

  ### 2. The "Joint Commitment" Objection
  **Verdict:** This is a fair objection, but it risks being dismissed as a demand for reductionism where Gilbert claims primitivism.

  *   **The Strength:** You are right that "joint commitment" can feel like a *deus ex machina* that inserts normativity by fiat. Asking "why does a joint commitment bind?" is the right question.
  *   **The Vulnerability:** Gilbert's core thesis is that joint commitment is a *sui generis* source of obligation. It is not reducible to personal commitment or instrumental rationality. If you ask, "Why does it bind?" her answer is essentially, "Because that is the nature of joint commitment."
  *   **Recommendation:** To strengthen this section, acknowledge her primitivism explicitly. Frame your objection not as "you haven't explained the mechanism" (because she claims there isn't a deeper mechanism), but as "this primitivism is theoretically costly compared to a naturalistic account."
      *   *Phrasing suggestion:* "Gilbert treats the binding force of joint commitment as a primitive. My worry is that this stops inquiry too soon. If we can explain the *phenomenology* of obligation without positing a sui generis metaphysical bond, we should prefer that explanation."

  ### 3. Skyrms and the Evolved Reactive Attitude
  **Verdict:** This is the most innovative part of your remarks, but also the philosophically riskiest. It walks a tightrope between explanation and elimination.

  *   **The Work It Does:** It successfully naturalizes the *source* of the pressure to conform. It explains why we *feel* entitled to rebuke without requiring a metaphysical joint commitment. It bridges the gap between Lewis's equilibrium (which explains stability) and Gilbert's normativity (which explains the "ought").
  *   **The Non-Sequitur Risk:** The danger here is the Is/Ought gap. Explaining that we have an *evolved disposition to resent* free-riders explains why we *blame*, but does it explain why the free-rider *ought not* to have free-ridden?
      *   If your claim is that the "ought" *just is* the disposition to resent (a proto-error theory or expressivist reading), you need to say that clearly.
      *   If your claim is that the evolved attitude *tracks* a real obligation, you need to explain what makes it real other than the feeling.
  *   **Recommendation:** Be explicit that you are offering a **genealogical account of normative belief**, not necessarily a vindication of normative truth. You are explaining the *social ontology of the pressure*, not necessarily the *moral justification*.
      *   *Phrasing suggestion:* "I am not claiming evolutionary dynamics justify the obligation in a moral sense. I am claiming they explain the emergence of the *normative stance* itself. The 'ought' Gilbert identifies is real as a social fact, but its genealogy is evolutionary, not metaphysical."

  ### 4. The Bicchieri Extension
  **Verdict:** This is plausible and likely the safest part of your argument, as Bicchieri's view is already psychological and empirical rather than metaphysical.

  *   **Compatibility:** Bicchieri distinguishes descriptive norms (empirical expectations) from injunctive norms (normative expectations + sanctions). She does not ground this in *sui generis* joint commitment but in conditional preferences.
  *   **The Extension:** Your claim is that the difference between her two categories isn't a difference in *kind* of social object, but a difference in whether the evolved reactive attitude has been triggered.
  *   **Potential Violence:** You might be doing violence to her view if she insists the distinction is functional and robust for prediction, whereas you are treating it as a fuzzy boundary of evolutionary attachment. However, she might welcome the evolutionary grounding of *why* normative expectations exist.
  *   **Recommendation:** Frame this as a **unifying hypothesis**. "Bicchieri gives us the taxonomy; Skyrms plus evolutionary psychology gives us the etiology. On this reading, her distinction tracks the presence or absence of the evolved sanctioning mechanism." This sounds collaborative rather than corrective.

  ### Strategic Advice for the Workshop

  1.  **Frame as "Working Out a Nagging Thought":** You mentioned this in your prompt. Keep this tone. It lowers the stakes. You aren't refuting Gilbert; you are exploring whether an evolutionary lens dissolves the tension between Lewis and Gilbert. This makes you sound like a colleague thinking aloud rather than an adversary attacking.
  2.  **Anticipate the "Normativity" Pushback:** The hardest question you will get is: "Does an evolved tendency to punish explain *obligation*, or just *power*?" If a convention is sustained only by evolved anger, is it a norm or just a regularity backed by threats?
      *   *Prepared response:* "It explains the *standing* to rebuke. The difference between a threat and a rebuke is that a rebuke appeals to a shared standard. The evolutionary story explains how that shared standard becomes emotionally salient without requiring a metaphysical contract."
  3.  **Acknowledge the "Alternative Regularity" Condition:** Lewis requires that there be an alternative regularity (drive on the left). Evolutionary accounts often show lock-in where alternatives are no longer viable. Does your Skyrmsian view preserve Lewis's arbitrariness condition?
      *   *Note:* Skyrms's models often show path dependence, which preserves the "could have been otherwise" historically, even if not synchronically. This is worth a footnote or a sentence if asked.

  ### Summary of Weakest Joints
  1.  **Gilbert's Tacit Commitment:** If you don't acknowledge her account of tacit readiness, you look like you haven't read *On Social Facts* closely.
  2.  **The Is/Ought Gap:** If you imply evolution *justifies* the norm, you will be hammered. If you imply it *explains the belief* in the norm, you are on safer ground.
  3.  **Reductionism:** Gilbertians believe the normativity is irreducible. You are proposing a reduction. State that clearly as a methodological preference, not a discovered fact.

  Overall, this is a strong, philosophically interesting intervention. It moves the debate from "which metaphysics is correct?" to "what is the best naturalistic explanation of our normative practices?" That is a very productive shift for a workshop.
