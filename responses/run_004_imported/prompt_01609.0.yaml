answer: |-
  **The Riverbed**

  Elias stood in the foyer of his apartment building with his key in the lock. This was the hinge. He knew this, though he couldn't have said why. It wasn't the key, and it wasn't the lock. It was the proposition that *turning the key would open the door to the street.*

  Usually, this wasn't a thought. It was a motion. A wrist flick, a push, the rush of city air. It was the ground upon which the day stood.

  But this morning, the ground had become soft.

  He had woken up, made coffee, and brushed his teeth. He had done these things, but as he stood there, hand on the brass knob, he realized he was treating them as hypotheses. *I made coffee.* How did he know? He remembered the smell. But memory was a internal report, and reports required a trustworthy reporter. *I am in my building.* How did he know? The wallpaper was the same floral pattern he'd seen for three years. But wallpaper could be replicated. A set could be built.

  He stopped himself. This was the trap. This was the Cartesian costume. He wasn't afraid the world was fake. He wasn't afraid of demons or simulations. It was weirder than that.

  It was that the certainty required to act had evaporated, not into doubt, but into silence.

  Wittgenstein had written that if a man said he doubted whether the earth had existed a hundred years ago, we wouldn't argue with him; we would try to calm him down. We would treat it as a mental disturbance. Because that fact isn't something you *know*. It's something you *have*. It's the hinge the door swings on. If the hinge moves, the door doesn't open; the frame tears out of the wall.

  Elias turned the key. It clicked. The mechanism worked.

  But he didn't push.

  If he pushed, he was asserting: *The street exists on the other side of this door.*
  If he didn't push, he was asserting: *I am not sure.*

  But he *was* sure. Visually, empirically, he was sure. The problem was that his certainty had lost its weight. It felt like a guess that happened to be right every time. It was like watching a magician pull a rabbit from a hat and knowing it's a trick, but suddenly forgetting where the rabbit actually comes from. The logic of the trick remained, but the reality of it had thinned.

  "Elias? You coming?"

  Mrs. Gable was behind him. She lived on the fourth floor. She was holding a leash; the dog, a terrier mix, was sniffing at Elias's shoe.

  This was the test. Mrs. Gable was a language game. To say "Good morning" to her was to agree on a shared world. It was to agree that *she* was Mrs. Gable, that *he* was Elias, that the *hallway* was a public space they both occupied.

  "Good morning," Elias said.

  The words felt like stones in his mouth. They didn't land. Mrs. Gable smiled, a reflex of social gravity, and waited for him to move so she could pass.

  Elias realized he was blocking the way. To move was to accept the hinge. To stay was to break the game.

  "The street," Elias said. He didn't mean to say it.

  Mrs. Gable's smile tightened. "The street?"

  "Is it... is it the same one?"

  "Elias, did you hit your head?"

  "No." He looked at his hand. He held it up, palm open. This was another hinge. *Here is a hand.* He wiggled the fingers. They obeyed. But the obedience didn't prove ownership. A puppet's hands obey. A prosthetic hand might obey. The sensation of ownership was just another signal, another piece of data floating in the void.

  "I need to know," Elias said, "that when I walk out, the building stays."

  Mrs. Gable took a half-step back. The dog whined. The air in the foyer grew heavy, not with threat, but with a profound category error. Elias wasn't asking a question that could be answered. If Mrs. Gable said, "Yes, the building stays," she was just making a sound. Her assurance relied on the very hinge Elias felt slipping. She was standing on the floor telling him the floor was solid.

  "You're scaring me," she said.

  "I'm not scared," Elias said. And it was true. He felt calm. That was the worst part. He felt the serene, hollow calm of a man who has realized the rules of chess no longer apply to the pieces. "I just can't find the place where I put the certainty."

  He looked at the door again. He wanted to go to the bodega. He wanted a bagel. These desires were real. But the path to the bagel required a sequence of events: *Open door, walk down steps, cross sidewalk.* Each step was a hinge. *The sidewalk will support my weight.* *The crosswalk signal will change.* *The bagel will still be a bagel when I bite it.*

  If any of those were treated as beliefs to be tested, the action became impossible. You can't test the sidewalk without stepping on it, but stepping on it assumes the sidewalk holds. It was circular. The whole world was a circle of assumptions, and he had found the break in the line.

  "I think I need to go back inside," Elias said.

  "Okay," Mrs. Gable said, her voice high. "Okay, Elias."

  He turned the key again. Locked the door.

  He walked back to his apartment, unlocked it, and sat on his sofa. He picked up a book. It was a novel he'd read ten years ago. He opened it to page one.

  *It was the best of times, it was the worst of times.*

  He read the sentence. He understood the grammar. He knew the words. But the reference was gone. *Times?* What times? *Best?* According to what metric? The text was just ink on paper, and the ink was just carbon on cellulose. The meaning was a ghost that required a shared world to haunt, and Elias was alone in the house.

  He closed the book. He looked at his hands again.

  He knew, intellectually, that in an hour the feeling might pass. The riverbed of his thoughts might settle back into place. The hinges would harden. He would go out, and Mrs. Gable would nod, and the bagel would taste like sesame and dough.

  But for now, he sat in the silence of the unswung door. He understood now why we call it madness. It isn't that the madman sees a different world. It's that he tries to look at the hinges while the door is supposed to be opening. You can't look at the hinge and walk through the door at the same time.

  Elias put his hands in his lap. He waited. He didn't doubt the world existed. He just couldn't find the leverage to move it.
