prompt: |-
  Getting engaged has apparently turned me into a person who reads sociology papers at 1am, so here's what's been rattling around my head. My partner and I just got engaged, and my sister (who means well but has Opinions) keeps quoting that "40-50% of marriages end in divorce" stat at us like it's a settled fact we should be scared of. So I went down a rabbit hole trying to find "the real number," and it turns out that just makes things worse, not better: there's data broken down by whether couples lived together before marrying, by age at marriage, by education level, by whether it's a first or second marriage, by whether your own parents divorced, and every combination gives a noticeably different percentage — I've seen everything from under 20% to well over 40% depending on which boxes you check. We happen to check some boxes that point one way (late twenties, both got degrees, together four years already) and at least one that points the other way (both sets of our parents divorced, which is a fun coincidence to discover mid-research spiral).

  So when my sister says "you two have like a 40% chance," and I want to counter with "no, more like 20% for people actually like us," is one of us simply right and the other wrong, or is there something fishy about the whole question? Like, is there an actual principled way to figure out which combination of factors is the "correct" one to use for a specific couple, or does the number just keep changing forever as you add more true facts about us (age, degrees, how long we dated, our parents, our jobs, the city we live in...) with no natural place to stop? I can't decide if this is a normal statistics problem that has a real answer I'm just not equipped to find, or if "the probability that we specifically will get divorced" is somehow less well-defined than it sounds, no matter how much data you throw at it. Curious what you think is actually going on here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user just got engaged. Their sister keeps citing the "50% divorce rate" statistic to warn them. The user has gone down a research rabbit hole and found that divorce rates vary wildly based on demographics (cohabitation, age, education, parents' divorce, etc.).
      *   **The Conflict:** Sister says "40-50% chance." User says "Maybe 20% for people like us."
      *   **The Core Question:** Is one of us right/wrong? Is there a "correct" probability for *us* specifically? Or is the question itself flawed ("fishy")? Does the number keep changing as we add more variables? Is this a normal statistics problem or is "probability for a specific couple" ill-defined?
      *   **Tone:** Intellectual, curious, slightly anxious (1am sociology paper reading), looking for clarity/philosophical grounding rather than just reassurance.

  2.  **Deconstruct the Statistical Problem:**
      *   **Reference Class Problem:** This is the heart of the issue. To assign a probability to an individual event (this specific marriage), you need to place that event in a reference class (a group of similar events). But which class? "All marriages"? "Marriages of college grads"? "Marriages of college grads whose parents divorced"? "Marriages of college grads whose parents divorced who live in City X"?
      *   **The Problem of Infinite Regress:** As the user noted, you can keep adding variables (job, city, personality traits, conflict style) to narrow the class. Eventually, the class contains only *one* couple (them). If $N=1$, you have no frequency data. You can't calculate a rate.
      *   **Frequentist vs. Bayesian:**
          *   *Frequentist:* Probability is long-run frequency. Requires a group. Struggles with single-case probability.
          *   *Bayesian:* Probability is a degree of belief, updated with evidence. More flexible for individual cases, but still relies on priors (which come from groups).
      *   **Causality vs. Correlation:** Demographic stats are correlations. They don't account for *agency*. A couple aware of the stats might work harder to beat them.

  3.  **Address the "Sister vs. User" Debate:**
      *   Neither is "right" in an absolute sense.
      *   Sister is using a broad prior (base rate).
      *   User is using a more specific prior (conditional probability).
      *   Both are estimates, not destinies.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the 1am sociology spiral. It's a common and intellectually valid concern. Congratulate them on the engagement.
      *   **The Core Concept: The Reference Class Problem:** This is the specific statistical/philosophical term for what they are experiencing. Explain it clearly. (Von Mises/Reichenbach).
      *   **Why the Number Keeps Changing:** Explain that as you narrow the group, the sample size shrinks. Eventually, the data becomes noisy or non-existent.
      *   **The "Single Case" Problem:** Probability is fundamentally about ensembles. Applying it to a single unique event (your specific marriage) is category error-ish. It's not like rolling a die (where the mechanism is stable). A marriage is dynamic.
      *   **Agency and Feedback Loops:** This is crucial. Unlike radioactive decay, humans react to probabilities. Knowing the risk changes the behavior, which changes the risk. (Self-fulfilling or self-negating prophecies).
      *   **Practical Advice (The "So What?"):**
          *   Stop treating it as a weather forecast (something that happens *to* you).
          *   Treat it as a risk assessment (something you manage).
          *   The "Reference Class" that matters most isn't demographics, it's *skills* (communication, conflict resolution).
      *   **Conclusion:** Reassure that the uncertainty is a feature, not a bug. It means the future isn't written.

  5.  **Refining the Tone:**
      *   Keep it empathetic but rigorous.
      *   Avoid platitudes ("Love conquers all").
      *   Use the user's intellectual framing (statistics, sociology).
      *   Make sure to explicitly answer: "Is one of us right?" (No.) and "Is the question well-defined?" (No, not really.)

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Initial thought:* Maybe mention Gott's Principle? *Correction:* No, that's for duration of things based on current age. Might complicate things. Stick to Reference Class.
      *   *Initial thought:* Tell them to ignore the sister. *Correction:* No, validate the sister's concern (base rates matter) but explain why it's incomplete.
      *   *Key Insight:* Emphasize that demographic risk factors are *static*, but marriage is *dynamic*. The most predictive factors aren't who you are, but what you *do*.

  7.  **Final Polish:** Check for clarity on the "Reference Class Problem." Ensure the distinction between epistemic uncertainty (lack of knowledge) and aleatoric uncertainty (inherent randomness) is hinted at but not overly jargon-heavy. (Decided to keep it accessible: "uncertainty about the future" vs "lack of data").

  8.  *(Final Review against User Prompt)*: Did I answer the specific question about whether the number keeps changing forever? Yes. Did I address the "fishy" feeling? Yes.

