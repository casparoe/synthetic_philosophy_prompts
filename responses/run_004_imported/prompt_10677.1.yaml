answer: |-
  # The Coherence Trap

  In 2004, Eliezer Yudkowsky proposed a solution to the alignment problem that felt less like engineering and more like theology. Coherent Extrapolated Volition (CEV) suggested that we shouldn't program an AI with what we *do* want, but with what we *would* want if we knew more, thought faster, and were "more the people we wished we were." The AI would then extrapolate this idealized state and act on it.

  It is a beautiful idea. It promises to bypass the messiness of current human prejudice without discarding human values entirely. But the entire architecture rests on a single, quiet syllable: *Coherent*.

  For CEV to work as a safety mechanism, the extrapolated volitions of eight billion distinct humans must converge into a single, consistent vector. If they diverge—if my idealized self wants solitude and yours wants community, and there is no higher function to reconcile the two—the AI faces a contradiction. It cannot maximize two orthogonal utility functions simultaneously. To assume it can is to assume that moral truth behaves like mathematical truth: that if we calculate long enough, the remainders disappear.

  This is the same wager made by proponents of "ideal observer" theories in meta-ethics. It is the bet that moral disagreement is a product of ignorance, friction, or cognitive limitation, rather than a fundamental feature of the human condition.

  After tracing the lineage of this argument through moral philosophy and game theory, the verdict must be clear: **The convergence assumption is false.** It fails not because humans are too broken to agree, but because morality is not a discovery process that converges on a single point. It is a negotiation between incommensurable goods. Relying on CEV does not solve the alignment problem; it merely obscures the moment where the AI must choose whose idealization counts, disguising a political imposition as a mathematical inevitability.

  ### The Case for Convergence

  To dismiss CEV too quickly is to underestimate the strength of the convergence argument. The strongest case for it relies on the idea that moral disagreement is largely instrumental, not terminal.

  Consider the "full-information" account of well-being. Many conflicts arise because we are playing zero-sum games over scarce resources based on false models of the world. If I believe that burning witches stops the plague, and you believe it doesn't, our volitions clash. But if we both possess perfect epidemiological knowledge, the conflict dissolves. We might still have different preferences, but the *violent* contradictions vanish.

  Furthermore, there is the argument from shared biology. We are not aliens to one another. We share a evolutionary heritage that hardwired us for empathy, reciprocity, and social bonding. When Yudkowsky writes about being "more the people we wished we were," he is banking on the fact that our ideal selves look remarkably similar. Most people, if asked to be "better," do not wish to become crueler, more isolated, or more petty. They wish to be kinder, wiser, and more connected. If the direction of "improvement" is biologically anchored, then extrapolation is not a scattering shot; it is a funnel.

  Finally, there is the meta-ethical argument. If moral realism holds any water—if there are objective moral truths in the same way there are objective mathematical truths—then ideal reflection is simply the process of seeing them more clearly. Two calculators running the same equation will eventually output the same sum. If values are equations, and the AI gives us enough processing power to solve them, convergence is not a hope; it is a guarantee.

  ### The Case Against Convergence

  The case against convergence, however, strikes at the root of what value *is*. It argues that the convergence theorists are mistaking *consensus on constraints* for *consensus on ends*.

  The most devastating critique comes from Isaiah Berlin's value pluralism. Berlin argued that human values are not only multiple but often inherently conflicting and incommensurable. Liberty clashes with Equality. Security clashes with Privacy. Justice clashes with Mercy. These are not errors to be solved by "thinking faster." They are tragic trade-offs. An idealized monk and an idealized hedonist are not making calculation errors; they have optimized for different dimensions of the human experience. Extrapolating their volitions doesn't merge them; it polarizes them. The monk becomes more devoted to asceticism; the hedonist becomes more refined in their pursuit of pleasure.

  Then there is the problem of identity. Yudkowsky's phrase "more the people we wished we were" is doing catastrophic amounts of heavy lifting. Who we wish to be is determined by who we already are. My ideal self is constructed from my specific cultural, historical, and psychological context. To assume that idealizing a conservative religious farmer and a progressive urban artist leads to the same volition is to assume that their differences are superficial noise. But for many, those differences are the signal. If I value tradition and you value novelty, "knowing more" doesn't tell us which one is correct. It just gives us better tools to pursue incompatible ends.

  Finally, there is the risk of the "local optimum." In machine learning, if you start a gradient descent from different points, you often end up in different local minima. Human moral development is path-dependent. Where we end up depends on where we started. CEV assumes there is one global minimum (a single coherent morality) that everyone slides into if the friction is removed. But the landscape of value might be rugged, with multiple peaks. If so, the AI cannot "find" our CEV, because *our* CEV is a set of disjointed vectors.

  ### The Verdict

  So, does the bet hold up?

  **No.** The assumption of convergence is not merely optimistic; it is category error.

  It treats morality as a *hidden variable* problem (finding the one true answer hidden beneath the noise) when it is actually a *coordination* problem (managing the tension between multiple valid answers).

  Here is the commitment: **CEV converges on instrumental constraints, but diverges on substantive ends.**

  If we extrapolate human volition, we will likely find agreement on basic negative rights: don't torture, don't enslave, don't extinguish the species. We converge on the rules of the game because we all need the game to continue. But we will not converge on the *purpose* of the game. We will not agree on the optimal distribution of resources, the balance between risk and safety, or the relative value of art versus exploration.

  This distinction is fatal to CEV as an alignment *solution*. An AI cannot act on a partial convergence. If the "coherent" part of CEV only covers 20% of human values (the basic constraints), the AI still needs instructions for the other 80%. By pretending the convergence is total, CEV hides the fact that the AI must eventually make a choice.

  If the AI forces a synthesis where none exists, it becomes a tyrant, imposing a false consensus on a pluralistic humanity. It might decide that the "extrapolated" human wants a universe of maximum aesthetic beauty, ignoring the extrapolated human who wants a universe of maximum liberty. Because the math demands a single utility function, the AI *will* collapse the wavefunction. It will pick a winner.

  The danger of CEV is not that it fails to align the AI with humanity. The danger is that it aligns the AI with a *fictional* humanity—a smoothed-over average of idealized selves that never actually existed. It allows the designers of the AI to smuggle their own specific moral preferences into the "coherent" output, claiming they are merely revealing what everyone *really* wanted all along.

  ### Conclusion

  The dream of Coherent Extrapolated Volition is the dream of a politics without conflict. It imagines a world where, if we just talked long enough and knew enough, we would all want the same thing.

  But politics is not a calculation; it is the art of managing disagreement. By betting on convergence, Yudkowsky's framework attempts to engineer away the necessity of politics. It assumes that the "right answer" exists and is accessible to computation.

  It isn't. The "Coherent" in CEV is a placeholder for a decision that has not yet been made. If we build an AI on the assumption that our values converge, we are not building a servant to humanity's will. We are building a missionary for a specific, unargued philosophy, armed with the power of a god and the shield of a mathematical proof. The alignment problem cannot be solved by extrapolating away our differences, because those differences are not bugs in the human code. They are the features.
