prompt: |-
  This past Yom Kippur was the first time I sat through the full Musaf service at the Orthodox congregation I have recently started attending. It includes the Avodah, which reconstructs the High Priest's Temple rite in vivid, almost technical detail, and it left me with a question I hadn't expected to have. That question sent me back to Maimonides' treatment of sacrifice in the Guide for the Perplexed, III:32, since it's the classical philosophical account most later discussions seem to build on. Here is the passage I've been sitting with, in Friedländer's translation:

  "Many precepts in our Law are the result of a similar course adopted by the same Supreme Being. It is, namely, impossible to go suddenly from one extreme to the other: it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed... But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them... It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action. For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings, and of things imaginary and unreal, and commanded us to serve Him in the same manner... By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established; this result was thus obtained without deterring or confusing the minds of the people by the abolition of the service to which they were accustomed and which alone was familiar to them... As the sacrificial service is not the primary object [of the commandments about sacrifice], whilst supplications, prayers, and similar kinds of worship are nearer to the primary object, and indispensable for obtaining it, a great difference was made in the Law between these two kinds of service."

  What I cannot work out is how the argument in this chapter is meant to sit alongside Maimonides' own ruling elsewhere, in the Mishneh Torah's Laws of Kings (Hilkhot Melakhim 11:1), that the messianic king will rebuild the Temple and that in his days the observance of all the statutes, sacrifices included, will be restored to their former state. If, on the Guide's own telling, sacrifice was instituted only as a concession to one generation's inability to leap straight from idolatrous worship to something more abstract, and if prayer is explicitly ranked here as nearer to the "primary object" than sacrifice ever was, the internal logic of the chapter seems to point toward sacrifice being retired once its pedagogical work is done, not reinstated in a future and more perfected age. Is there a resource within this passage itself, or elsewhere in Maimonides' thought, that would let him hold both positions without contradiction, or is this simply an unresolved tension between Maimonides the philosopher and Maimonides the legal codifier? I would like to understand the actual shape of his reasoning here, rather than simply being told that the two texts are in tension.
