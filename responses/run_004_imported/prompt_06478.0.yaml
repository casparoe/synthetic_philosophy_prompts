      *   *Let's go with the standard robust defense:* **Williamson is right.** The student is wrong. The debate matters because it predicts the Lottery intuition. Lackey is the only threat, and it fails because it confuses *warrant* with *propriety*.

  5.  **Final Polish:** Check tone. Ensure it sounds like a philosopher talking to a philosopher. Avoid "on the one hand, on the other." Take a stand.

