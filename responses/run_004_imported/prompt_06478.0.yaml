answer: |-
  **Title:** The Constitutive Standard: Adjudicating the Norm of Assertion

  **To:** Graduate Seminar on Assertion
  **From:** [Your Name/Outside Voice]
  **Re:** The Normative Status of Assertion

  The frustration you feel regarding your student's "semantic wash" objection is understandable, but it masks a deeper methodological error. The debate over the norm of assertion is not a verbal dispute about how we use the word "proper"; it is a substantive dispute about the *constitutive rules* of a specific social practice. If different norms were truly extensionally equivalent—if Truth ($T$), Knowledge ($K$), and Justified Belief ($J$) licensed assertions in exactly the same set of possible worlds—then the debate would indeed be a wash. But they do not. The Lottery Case and the Moorean Paradox demonstrate that these norms diverge in their predictions.

  My verdict is straightforward: **Timothy Williamson's Knowledge Norm ($K$) is the correct constitutive norm of assertion.** However, to maintain this position against the sophisticated counterexamples raised by Lackey and the pragmatic retreats of Weiner, we must refine *why* $K$ succeeds where others fail. Specifically, we must treat $K$ not merely as a moral rule governing speakers, but as the standard that defines the speech act itself. Below, I adjudicate the competing views, demonstrating why $T$ and $J$ fail to capture the data, and why Lackey's "Selfless Assertion" does not sink $K$, provided we distinguish between *epistemic propriety* and *moral excusability*.

  ### 1. The Failure of the Truth Norm (Weiner)

  Jennifer Weiner's argument that the norm is simply "Assert $p$ only if $p$ is true" relies on the claim that all the intuitive defects in improper assertion (like Moorean sentences or lottery claims) can be explained away pragmatically. This is insufficient.

  The primary failure of the Truth Norm is the **Transparency Problem**. Assertion is an action performed by an agent. For a norm to govern an action, the agent must be able, in principle, to assess whether they are complying with it. Truth is opaque; I cannot step outside my own mind to check if $p$ corresponds to reality. I can only check if I *know* $p$, or if I have *evidence* for $p$. If the norm were merely Truth, then an agent who asserts a true proposition on a wild guess (Gettier-style) would be fully compliant. Yet, we intuitively criticize such assertions. If you guess the winning lottery number and assert it, you have asserted a truth, but you have not asserted *properly*.

  Furthermore, Weiner's pragmatic explanation of Moorean paradoxes ("$p$, but I don't know $p$") is less robust than Williamson's semantic explanation. On the Truth Norm, "$p$, but I don't know $p$" is potentially true (since $p$ can be true while I lack knowledge). Its defect must therefore be pragmatic. But on the Knowledge Norm, the sentence is a direct contradiction of the constitutive rule: "I am asserting $p$ (which implies I know $p$), but I don't know $p$." $K$ explains the defect semantically, which is theoretically preferable to multiplying pragmatic implicatures. The Truth Norm fails because it cannot explain why we criticize assertions that turn out to be true but were made without epistemic grounding.

  ### 2. The Failure of the Reasonable Credibility Norm (Douven)

  Igor Douven's proposal—that one should assert $p$ only if one has reasonable credibility or justified belief in $p$—is the strongest competitor to $K$. It handles Gettier cases well and seems to accommodate the intuition that we shouldn't demand too much of speakers. However, it collapses under the weight of the **Lottery Case**.

  Consider a fair lottery with a million tickets. The statistical probability that ticket #542 lost is 0.999999. This is sufficient for *justified belief* and *reasonable credibility*. If Douven is right, it is proper to walk up to the ticket holder and assert, "Your ticket lost." Yet, almost universal intuition recoils at this. We feel that without seeing the result or hearing an announcement, you simply *don't know*, and therefore you shouldn't say it.

  Douven attempts to explain this away by suggesting that in lottery contexts, the stakes raise the threshold for justification. But this is ad hoc. The statistical evidence remains identical regardless of the stakes. The Knowledge Norm explains the intuition cleanly: Statistical probability, no matter how high, does not yield knowledge (due to lack of safety or sensitivity). Since you don't know, you can't assert. The fact that $J$ licenses an assertion that feels intuitively forbidden is a fatal flaw. $K$ predicts the prohibition; $J$ predicts permission. The intuition sides with $K$.

  ### 3. Adjudicating Lackey's Selfless Assertion

  This brings us to the hardest challenge: Jennifer Lackey's biology teacher. The teacher asserts that evolution is true based on evidence and consensus, yet personally disbelieves it due to religious conviction. She lacks belief, and therefore (on standard analyses) lacks knowledge. If $K$ is the norm, her assertion is improper. Yet, she seems praiseworthy.

  Your student likely sees this as the knockout blow. It is not. It relies on a conflation of **epistemic propriety** with **moral/professional excusability**.

  To adjudicate this, we must look closely at what we are praising in the teacher. We are praising her *professional integrity* and her *commitment to truth-telling* despite personal bias. We are not praising her *epistemic state*. In fact, if we press the teacher, asking, "Do you *know* evolution is true?" she would honestly answer, "No, I don't believe it, so I can't say I know."

  If the Knowledge Norm is constitutive, then the teacher is indeed violating the norm. But violations of constitutive norms can be excusable, even obligatory, in specific contexts. Consider a referee in a soccer match. The constitutive norm of the game says "No hands." If a player breaks a window with the ball and a bystander grabs the ball with their hands to prevent injury, they have violated the rule of soccer. They are morally praiseworthy, but they have still handled the ball.

  Similarly, the teacher is in a unique institutional position where the *transmission of established knowledge* is the goal, not the expression of personal doxastic states. She is acting as a conduit for the scientific community's knowledge. Her assertion is **excusably improper**. It is epistemically defective (she lacks the belief requisite for knowledge), but morally warranted.

  Why does this distinction matter? Because it preserves the predictive power of $K$. If we accept Lackey's case as a counterexample, we are forced to lower the norm to Justified Belief. But if we lower the norm to Justified Belief, we lose the ability to condemn the Lottery Assertion (as shown above). We cannot have it both ways. We must choose between explaining the Lottery Intuition or explaining the Teacher Intuition.

  The Lottery Intuition is a clearer test of *assertoric* propriety because it isolates epistemic status from moral duty. In the Lottery case, there is no moral duty to assert. In the Teacher case, there is a conflicting moral duty. Therefore, the Lottery case is the purer test of the norm of assertion *qua* assertion. Since $K$ wins the Lottery case and $J$ loses it, $K$ is the superior norm. We save $K$ by categorizing Lackey's case as a justified violation (excusable improper assertion) rather than a proper assertion.

  ### 4. Why the "Semantic Wash" Objection Fails

  Your student's claim that this is a semantic wash suggests that the choice of norm makes no difference to the practice. This is empirically false. The norms generate different truth-conditions for the evaluation of speech acts.

  1.  **Extensional Divergence:** As demonstrated, $J$ permits lottery assertions; $K$ forbids them. $T$ permits lucky guesses; $K$ forbids them. These are not semantic nuances; they are contradictory classifications of the same actions.
  2.  **Explanatory Power:** $K$ explains the Moorean paradox semantically; $T$ and $J$ must rely on pragmatics. A theory that explains data semantically is preferable to one that explains it pragmatically, all else being equal.
  3.  **The Function of Assertion:** If the function of assertion is to share *knowledge* (as $K$ suggests), then the practice degrades if we allow mere justified belief (which can be false) or mere truth (which can be accidental). $K$ protects the integrity of the information pool.

  ### Verdict

  The Knowledge Norm ($K$) is the correct constitutive norm of assertion.

  *   **Against Weiner:** Truth is inaccessible and permits lucky guesses, which are intuitively improper.
  *   **Against Douven:** Justified Belief permits lottery assertions, which are intuitively improper.
  *   **Against Lackey:** Selfless assertions are cases of *excusable impropriety*. The teacher is morally praiseworthy but epistemically non-compliant. To rule otherwise forces us to abandon the explanation for the Lottery Case, which is a greater theoretical cost.

  **Qualification:** This verdict holds for "flat-out" assertion in standard conversational contexts. In specialized institutional contexts (like the classroom), the norm may be *modified* by professional duties, allowing for excusable violations where the goal is the transmission of communal knowledge rather than personal conviction. However, this does not change the underlying norm; it merely adds a layer of conflicting obligations.

  Tell your students that the debate is not a wash because the norms are not interchangeable tools; they are competing hypotheses about the nature of the game we are playing. The Knowledge Norm is the only one that respects the fact that assertion is our primary mechanism for expanding the collective stock of *knowledge*, not just true belief or high probability. To lower the bar is to misunderstand the point of the practice.
