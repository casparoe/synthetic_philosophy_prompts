  2.  **Reconstructing Hume's Argument ("Of the Balance of Trade"):**
      *   *Goal:* Refute the mercantilist idea that a nation must hoard gold/silver via a positive trade balance to be wealthy.
      *   *Mechanism (PSFM):*
          1.  Money is a veil (neutral in the long run); real wealth is goods/labor.
          2.  Money supply is linked to price levels (Quantity Theory of Money).
          3.  If a country loses specie (trade deficit) $\rightarrow$ Money supply shrinks $\rightarrow$ Domestic prices fall.
          4.  Lower prices $\rightarrow$ Exports become cheaper, Imports become expensive $\rightarrow$ Trade balance improves.
          5.  Equilibrium is restored naturally.
      *   *Premises:*
          1.  Money is commodity-based (specie).
          2.  Prices are flexible downward.
          3.  Demand is elastic (cheaper goods get bought).
          4.  Government interference (tariffs) disrupts this natural level.
          5.  *Crucial Philosophical Premise:* The "Jealousy of Trade" is irrational. One nation's gain is not necessarily another's loss. Rich neighbors make good customers.

  3.  **Analyzing the Modern Context (Fiat & Persistent Deficits):**
      *   *Fact 1: Fiat Money.* No physical gold outflow. The "specie" part of PSFM is gone. However, the *exchange rate* acts as the adjustment mechanism. If demand for currency drops, value drops (depreciation), making exports cheaper.
      *   *Fact 2: Persistent Deficits (US/China).* Why no correction?
