answer: |-
  Good evening. For those who don't know me, I'm the groom's brother. I'm also a novelist, which, in this family, apparently qualifies me as the "Word Person." So when my brother asked me to give the toast, I assumed he wanted something lyrical. Then I remembered who he's marrying.

  Priya is finishing her dissertation in moral philosophy. Specifically, she works on the "buck-passing account of value." Now, for the half of the room currently checking their pulse: don't worry. I'm not going to turn this into a seminar. But for the other half of the room currently nodding along: I know what you're studying.

  I did try to read Priya's work to prepare for tonight. I quickly learned that while I write fiction for a living, Priya deals in a much more dangerous genre: precise definitions. Her research focuses on the "Wrong Kind of Reasons" problem.

  For the aunts and uncles: The thought experiment goes like this. Imagine an evil demon threatens to torture you unless you fall in love with a saucer of mud. Now, you have a very strong reason to love that mud. Specifically, the reason is "I would like to avoid agony." But, intuitively, that doesn't make the mud *lovable*. It doesn't make the mud *good*. It's the wrong kind of reason.

  The philosophers in the room know the debate that follows. They argue endlessly about what constitutes the *Right* Kind of Reason to value something. What makes an object worthy of love, distinct from the consequences of loving it?

  And this brings me to my brother.

  When I asked him what he was going to say in his vows, he panicked. He started listing Priya's virtues. Her kindness, her intellect, her patience with his family. And I told him: "Stop. You're walking into a trap."

  Because here is the joke, and it is a genuine gift to the groom: After decades of debate, the literature is completely inconclusive on what the "Right Kind of Reasons" actually *are*. The experts cannot agree. There is no consensus.

  So, [Brother's Name], I am here to tell you that you are off the hook.

  If anyone asks you why you married Priya, you are under no obligation to provide a satisfactory philosophical account of her value. If your Uncle asks, "Is it her beauty?" and your Aunt asks, "Is it her mind?" and a philosopher asks, "Is it the fittingness of your attitude relative to her normative properties?"... you can just shrug.

  You can say, "The literature is inconclusive."

  You have been granted a lifetime exemption from explaining yourself. In a world where everyone demands a reason for everything, you have married a woman who specializes in the fact that reasons are messy. You don't need to justify loving her. You just need to love her. The metaphysics can wait until Tuesday.

  Now, there is one crucial distinction I need to make. And I need the philosophy cohort to hear this, because I don't want this ending up in a footnote.

  In the thought experiment, the object of affection is a saucer of mud.
  Priya... is not a saucer of mud.

  The mud has no intrinsic value. It requires the threat of the demon to generate a reason to care about it. Priya, conversely, generates reasons simply by walking into a room. The "demon" here is irrelevant. There are no threats. There is no coercion. There is only the obvious fact that she is brilliant, and kind, and somehow agreed to marry my brother.

  So, while the philosophers are still arguing about whether the "right reasons" exist, the rest of us can just look at the evidence. And the evidence is that [Brother's Name] is the luckiest person in the room, and Priya is... well, Priya.

  I want to propose a toast.

  To the couple: May your life together be full of value. May your reasons for loving each other remain happily undefined. And may there never be a demon with a saucer of mud in sight.

  To Priya and [Brother's Name].
