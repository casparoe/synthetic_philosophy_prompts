answer: |-
  This is a classic problem in moral philosophy and social psychology, and your intuition is correct: there is a robust body of thought that validates the feeling of being wronged. The disagreement isn't about money or logistics; it is about the nature of **joint commitment**.

  Your teammate is operating under a model of **individual intentionality**, while the rest of you are operating under a model of **collective agency**. Here is how several frameworks explain why her exit feels like a breach, even if it isn't a legal one.

  ### 1. The Philosophy of Joint Commitment (Margaret Gilbert)
  The most direct philosophical mapping for your situation comes from the work of Margaret Gilbert, particularly in her book *On Social Facts*.

  Gilbert argues that when a group forms a "plural subject" (a "we"), they enter into a **joint commitment**. This is distinct from a set of personal commitments.
  *   **Personal Commitment:** "I intend to run, and you intend to run." (If I quit, I only break my own intention.)
  *   **Joint Commitment:** "We intend to run together." (This creates a new entity: the team.)

  According to Gilbert, once a joint commitment is established, no single member has the right to unilaterally rescind it. To do so violates the rights of the other members, who are now entitled to demand that the commitment be honored.

  **Why this matters:** Your teammate treated her withdrawal as a personal update ("My plan changed"). But in a joint commitment, the plan belongs to the *group*. By leaving unilaterally, she didn't just change her mind; she dissolved a piece of the group's agency without the group's consent. The "wrong" you feel is the violation of your standing as co-authors of that plan.

  ### 2. The Assurance View (T.M. Scanlon)
  The philosopher T.M. Scanlon, in *What We Owe to Each Other*, offers a principle regarding promises and reliance. He argues that if you intentionally lead someone to expect that you will do something, and they rely on that expectation to their potential detriment, you owe them a specific duty: **you cannot simply withdraw without their permission.**

  Even though you didn't sign a contract, you created a web of reliance.
  *   You built training runs around her pace.
  *   You structured weekend availability around her schedule.
  *   You pooled money based on her participation.

  Scanlon would argue that she is not wrong for quitting (life happens), but she is wrong in *how* she quit. She treated the decision as hers alone to make. In a reliance framework, she owed the group the opportunity to negotiate the terms of her exit *before* declaring it final. The feeling of being wronged stems from being denied a voice in the dissolution of the plan you helped create.

  ### 3. Relational Contract Theory
  In sociology and organizational behavior, there is a distinction between **transactional contracts** (explicit, monetary, defined) and **relational contracts** (implicit, based on trust and shared norms).

  Your team operated on a relational contract. In these agreements, the "currency" isn't just the entry fee; it is **reliability** and **reciprocity**.
  *   **The Transactional View (Her view):** I pay for the sub, the ledger is balanced.
  *   **The Relational View (Your view):** The value was in the shared struggle and the certainty of the unit.

  When she quits, she creates a "relational deficit." Paying for a substitute fixes the transactional deficit but leaves the relational one untouched. The remaining teammates now bear a psychological burden (uncertainty, loss of cohesion, the hassle of integration) that she has offloaded. In relational contracts, offloading burden without consent is a violation of fairness, regardless of financial compensation.

  ### 4. Shared Intention and "Meshing Sub-Plans"
  Philosopher Michael Bratman writes about **shared intention**. For a group to act together, individual sub-plans must "mesh."
  *   Your sub-plan: Train on Saturdays at 8 AM.
  *   Her sub-plan: Train on Saturdays at 8 AM.

  When these mesh, they create a stable structure. When she changes her sub-plan (due to the new job), she isn't just altering her own schedule; she is causing a structural failure in the mesh.

  Bratman would suggest that the obligation of joint action includes a duty to **coordinate changes**. If a sub-plan must change, the member owes it to the group to try to preserve the mesh or help the group re-mesh. Simply announcing the breakage treats the group as a backdrop for her life, rather than a partner in it.

  ### The Verdict: Is there a meaningful difference?
  **Yes.** There is a categorical difference between a solo runner quitting and a relay teammate quitting.

  *   **The Solo Runner:** Owes accountability only to herself.
  *   **The Relay Runner:** Owes accountability to the **plural subject** (the team).

  The "wrong" you feel is the realization that she views the team as a collection of individuals (where she is free to act), while you view the team as a collective entity (where she is bound).

  **What you were owed:**
  You were not necessarily owed her physical presence (circumstances do change). You were owed **negotiation**.
  She should have presented the problem ("My job now claims weekends") to the group and asked, "How do we solve this together?" rather than presenting the solution ("I am out, here is money for a sub").

  By making the decision unilaterally, she converted a *collective problem* into an *individual decision*, stripping the rest of you of your agency in the matter. That loss of agency is what feels like a betrayal, and no amount of money can reimburse you for the loss of standing within the group's decision-making process.

  ### How to frame this (for your writing or your friends)
  If you want to resolve the tension with your friends, you might explain that the issue isn't that she quit, but that she treated a **joint commitment** as a **personal preference**.

  The moral breach wasn't the withdrawal; it was the unilateralism. In a true partnership, the threshold for quitting is higher, and the process for leaving is shared. Acknowledging that distinction might validate the feelings of the two friends who feel wronged, without requiring the quitter to return to the race. She can apologize not for leaving, but for deciding *for* everyone else that leaving was the only option.
