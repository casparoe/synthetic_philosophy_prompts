answer: |-
  The air in the briefing room was recycled too many times; it tasted metallic, like licking a battery. Elara, Kren, and Solt sat around the hexagonal table, the holographic display of Planet 44-B hovering between them. It was a swirl of promising teal and brown.

  They were tired. It had been eighteen hours since the probes returned the final data packets.

  "Protocol dictates we separate the criteria," Kren said, his voice rough. He was the lead engineer. "We don't vote on landing. We vote on the conditions for landing."

  Elara, the xenobiologist, rubbed her temples. "We know the protocol, Kren. Just let the system run."

  Solt, the mission commander, stared at the planet. "If we land, we commit the colony ships. If we don't, we burn another six years in cryo. No pressure."

  The system chimed. A soft, polite sound that felt obscene given the stakes.

  **CRITERIA A: ATMOSPHERE WITHIN TOLERANCE?**
  **CRITERIA B: WATER SOURCE SUSTAINABLE?**
  **RULE: IF A AND B ARE TRUE -> AUTHORIZE LANDING.**

  "Let's cast," Solt said.

  They tapped their screens. The results populated the center of the table, visible to all.

  **CRITERIA A (ATMOSPHERE):**
  Elara: YES. (The readings were stable.)
  Kren: YES. (The filters could handle the particulate matter.)
  Solt: NO. (The wind shear data scared him.)
  **MAJORITY: YES.**

  A small green checkmark appeared next to Criterion A. Elara exhaled. That was the biggest hurdle.

  **CRITERIA B (WATER):**
  Elara: NO. (The samples showed heavy metal contamination.)
  Kren: NO. (Filtration would drain too much power.)
  Solt: YES. (There was enough volume, technically.)
  **MAJORITY: YES.**

  Wait. Elara blinked. She looked at Kren. Kren was looking at Solt.

  "That's wrong," Kren said quietly.

  "The count is the count," Solt said, but he didn't look at the screen. He was looking at his hands.

  **SYSTEM CALCULATION:**
  **CRITERIA A: MET.**
  **CRITERIA B: MET.**
  **FINAL STATUS: AUTHORIZED.**

  The word flashed in bold, optimistic green: **AUTHORIZED.**

  The room didn't celebrate. The hum of the air recyclers seemed to get louder, pressing against their eardrums. Elara felt a cold knot tighten in her stomach. She looked at the word *AUTHORIZED*. It felt like a lie.

  "Wait," Elara said. "If we voted on the landing directly... what would we vote?"

  "We're not supposed to do that," Kren said. "The protocol isolates the technical facts from the strategic decision."

  "But," Elara pressed, her voice trembling slightly. "I voted No on Water. So I vote No on Landing."

  "I voted No on Atmosphere," Solt said. "So I vote No on Landing."

  Kren looked at the green light. "I voted Yes on Atmosphere, Yes on Water. I vote Yes on Landing."

  The silence stretched out, thick and oily.

  Two of them wanted to abort. One wanted to go. But the math of the premises said *Go*.

  "It feels..." Solt started, then stopped. He shifted in his chair, the leather creaking. "It feels like we're signing a death warrant we didn't write."

  "The logic is sound," Kren said, but he didn't sound convinced. He looked at the **AUTHORIZED** stamp like it was a foreign object placed on the table while they weren't looking. "The majority agreed the air was safe. The majority agreed the water was safe. Therefore, the mission is safe."

  "But the majority doesn't think the mission is safe," Elara whispered.

  She looked at Kren. He knew the water was bad. He looked at Solt. He knew the air was bad. They were both nodding along to premises they didn't fully believe in, just enough to form a majority on each separate line item. They had constructed a truth out of fragments that none of them wholly owned.

  "It's a ghost decision," Solt said. "Nobody here actually believes we should land. But the committee believes it."

  Elara reached for her console to override, to force a direct vote. Her finger hovered over the key.

  "Don't," Kren said. "If we break protocol, the Earth Council invalidates the whole review. We lose the window."

  "So we lie?" Elara asked.

  "No," Solt said, standing up. He looked pale. "We just... accept the aggregate."

  He walked to the door. He didn't look back at the planet. "The system says we land. We prepare the ships."

  "Kren?" Elara asked.

  Kren stared at the green light. It hummed. It was perfect, logical, and utterly hollow. "I'll start the engine diagnostics," he said.

  He walked out past Solt. Elara was left alone with the hologram. She looked at the **AUTHORIZED** stamp again. It wasn't a decision made by people. It was a decision made by the intersection of their disagreements. It was a conclusion that existed only in the space between them, supported by no one's actual weight.

  She turned off the display. The room went dark, but the afterimage of the green text burned on her retinas. She stood up, her legs feeling heavy, and walked out to prepare for a landing she believed would kill them, because the majority of the reasons said otherwise.
