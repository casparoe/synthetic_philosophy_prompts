  2.  **Deconstruct the Problem (Old Evidence):**
      *   *The Formal Issue:* Bayesian updating relies on $P(H|E) = P(H) \cdot P(E|H) / P(E)$. If $E$ is known, $P(E) = 1$. If $P(E)=1$, then $P(E|H)=1$. Thus $P(H|E) = P(H)$. No confirmation occurs.
      *   *The Intuitive Issue:* Einstein's GR explaining Mercury's anomaly *felt* like massive confirmation, even though astronomers knew about the anomaly for decades.
      *   *The Stakes:* If Bayesianism can't handle old evidence, it fails as a general theory of scientific rationality, because much of science involves explaining known phenomena with new theories.

  3.  **Evaluate the Proposed Solutions:**

      *   **Garber (Logical Omniscience/Entailment):**
          *   *Idea:* Agents aren't logically omniscient. Learning that $H$ entails $E$ is new information ($H \to E$), even if $E$ is old. We conditionalize on the *relationship*, not just $E$.
          *   *Pros:* Keeps the Bayesian framework intact. Matches the psychological experience of discovery ("Aha! It fits!").
          *   *Cons:* Technically messy (requires expanding the probability space to include logical relations). Some argue it changes the subject from confirmation by $E$ to confirmation by the logical fact.
          *   *Astronomer's perspective:* Scientists *do* feel the "click" of the math working out. It's new cognitive work.

      *   **Howson (Counterfactual/Cut-off):**
          *   *Idea:* Ask what $P(H)$ would have been *if* we hadn't known $E$. If $P(H|E_{unknown}) < P(H|E_{known})$, then $E$ confirms $H$.
          *   *Pros:* Intuitively captures the "surprise" element.
          *   *Cons:* Highly subjective. How do we reconstruct a credence state where we don't know a basic fact of nature? It relies on a fiction (the "ur-prior").
          *   *Astronomer's perspective:* Hard to reconstruct the state of Le Verrier before he found the anomaly. Feels like rewriting history.

      *   **Worrall (Use-Novelty/Heuristic):**
          *   *Idea:* Drop the probabilistic account for this case. Confirmation depends on whether $E$ was *used* to construct $H$. If $H$ was built to fit $E$, no confirmation. If $H$ was built independently and *then* found to fit $E$, confirmation.
          *   *Pros:* Aligns with scientific practice (prediction vs. accommodation).
          *   *Cons:* Abandons strict Bayesianism. "Use" is historical/sociological, not logical.
          *   *Astronomer's perspective:* Einstein didn't tune GR to fix Mercury; he derived GR from principles, then checked Mercury. That distinction matters.

