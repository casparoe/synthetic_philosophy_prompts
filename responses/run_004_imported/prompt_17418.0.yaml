answer: |-
  **Title:** The Static Data and the Dynamic Link: A Verdict on the Problem of Old Evidence

  **Introduction**

  It is a particular irony of retirement that the hobbies meant to lower the pulse often raise it higher than the career ever did. You have stumbled onto one of the most persistent irritants in modern philosophy of science. Your frustration is well-founded: the "Problem of Old Evidence," articulated by Clark Glymour in 1980, strikes at the heart of Bayesian confirmation theory. It suggests that the formal machinery we use to model rational belief change cannot account for one of the most famous episodes in the history of physics: Einstein's explanation of Mercury's perihelion precession.

  As an astronomer, you know the data didn't change in 1915. The anomaly was in the catalogs long before Einstein derived the field equations. Yet, the scientific community rightly treated this as a massive boost in confidence for General Relativity (GR). Standard Bayesianism, however, says that if the evidence $E$ is already known ($P(E) = 1$), conditionalizing on it cannot increase the probability of a hypothesis $H$. The math implies $P(H|E) = P(H)$. The credence stays flat.

  You have asked for a verdict, not a survey. You want to know if Bayesianism is broken or if these proposed fixes are merely sweeping dust under a rug. After weighing the options against the actual practice of science—and the logical constraints of probability theory—I argue that **the Garber-style solution (logical learning) is the only viable path**, but it requires a specific concession: we must accept that Bayesianism is a theory of *cognitive dynamics*, not just *static justification*. The counterfactual approach (Howson) relies on untenable fictions, and the use-novelty approach (Worrall) abandons the probabilistic project entirely. Garber saves the framework, provided we admit that what scientists learn is not just data, but *structural relationships*.

  **The Formal Knot**

  To see why the blood pressure rises, we must look at the equation. In Bayesian confirmation, $E$ confirms $H$ if $P(H|E) > P(H)$. By Bayes' Theorem:

  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  If $E$ is "old evidence," it is already part of the background knowledge $K$. Therefore, $P(E) = 1$. Furthermore, if $H$ entails $E$, then $P(E|H) = 1$. The equation collapses:

  $$P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$$

  The posterior equals the prior. No confirmation occurs.

  This is intolerable. If Bayesianism cannot explain why Mercury's orbit confirmed GR, it cannot explain how mature sciences progress, because mature sciences spend most of their time explaining known data with new theories, rather than predicting unknown data.

  **The Counterfactual Detour (Howson)**

  Colin Howson's proposed fix is to engage in a historical thought experiment. He suggests we evaluate confirmation by asking: *What would our credence in $H$ have been if we had not known $E$?* If $P_{counterfactual}(H) < P_{actual}(H|E)$, then $E$ confirms $H$.

  This approach attempts to restore the "surprise" element. It asks us to mentally subtract Mercury's anomaly from our knowledge base, see how probable GR looks without it, and then add the anomaly back in to see the boost.

  **Verdict on Howson:** This solution must be rejected. It relies on an impossible epistemic fiction. As a spectroscopist, you know that data, once reduced and calibrated, becomes part of the infrastructure of your thinking. You cannot coherently reconstruct a credence function where a fundamental fact of the solar system is "unknown" without altering a web of other beliefs that depend on it. More damagingly, this makes confirmation radically subjective. Two scientists with different abilities to imagine counterfactual histories would calculate different confirmation values for the same theory. Science requires public, checkable standards of evidence, not a contest of historical imagination. Howson saves the math by lying about the history.

  **The Historical Turn (Worrall)**

  John Worrall takes a harder line. He argues that Bayesianism simply cannot handle old evidence and that we should switch to a "use-novelty" criterion. On this view, $E$ confirms $H$ only if $E$ was not *used* in the construction of $H$. Since Einstein did not tune GR to fit Mercury (he derived GR from principles of equivalence and covariance, then checked Mercury), the evidence counts, regardless of when it was discovered.

  **Verdict on Worrall:** Worrall is right about the history but wrong about the logic. His solution is heuristic, not formal. It tells us *when* to trust a theory, but it does not tell us *how much* to shift our credence. It abandons the Bayesian project of quantifying rational belief change. If we accept Worrall, we are admitting that Bayesianism is not a universal logic of science, but merely a tool for handling new data. While "use-novelty" captures the sociological trust scientists place in predictions, it fails to explain the *internal rationality* of the theorist. Einstein didn't just feel socially validated; his own confidence in GR rationally increased because it solved the Mercury problem. Worrall explains the community's acceptance, but not the theorist's belief update.

  **The Logical Link (Garber)**

  This leaves Daniel Garber's solution (and related "logical learning" accounts). Garber argues that the problem arises from assuming agents are **logically omniscient**. Standard Bayesianism assumes that if $H$ entails $E$, the agent *knows* it immediately. But in real science, agents are not omniscient. Einstein did not know GR entailed the correct perihelion shift when he started; he had to do the math to find out.

  Garber proposes that the "new evidence" is not $E$ (Mercury's orbit), but the logical fact **$H \to E$** (that the hypothesis entails the evidence). We conditionalize on the *relationship*, not the datum.

  When Einstein realized his field equations yielded the 43 arcseconds per century, he learned a new proposition: *General Relativity entails the observed precession.* Let's call this proposition $L$. $L$ was not certain before the calculation was finished. Once $L$ is learned, $P(H|L)$ can be greater than $P(H)$, even if $P(E)=1$.

  **The Final Verdict**

  I commit to the **Garber solution**, with the stipulation that it redefines the locus of confirmation.

  Here is why this is the only defensible position for a scientist-philosopher:

  1.  **It Matches the Cognitive Experience:** You mentioned coming home "worked up" from your reading group. That feeling is the recognition of a logical tension or resolution. When a spectrograph breaks, the "evidence" (the broken machine) is old news the moment it happens. But the *confirmation* of a hypothesis ("the cooling system failed") comes when you verify the *link* between the failure mode and the symptoms. The learning event is the discovery of the mechanism, not the observation of the symptom. Garber captures this. The "Aha!" moment is the realization of entailment.
  2.  **It Preserves Objectivity:** Unlike Howson's counterfactuals, the logical relation $H \to E$ is objective. Either the math works or it doesn't. Different scientists might learn the link at different times, but the confirmation value rests on the existence of the link, not on their ability to imagine ignorance.
  3.  **It Saves Bayesianism without Fiction:** It does not require us to pretend we don't know the data (Howson) nor does it require us to abandon probability for heuristics (Worrall). It simply expands the domain of uncertain propositions to include *logical connections* between theories and data.

  **The Cost:** The cost of this verdict is admitting that "evidence" in Bayesian confirmation is not just raw data ($E$), but data *plus* the recognition of its theoretical significance ($H \to E$). Some purists argue this changes the subject. I argue it corrects a naive view of what data *is*. In astronomy, a number in a catalog is not evidence until it is modeled. The model provides the context that makes the number meaningful.

  **Conclusion**

  Your reading group is right to be worked up; this problem exposes the friction between idealized logic and real-world reasoning. However, the puzzle dissolves if we stop treating scientists as logic machines that instantly see all consequences of their axioms. We are explorers mapping the logical space between hypothesis and observation.

  The Mercury anomaly was old, but the *bridge* Einstein built to it was new. Bayesianism survives the Problem of Old Evidence, but only if we accept Garber's insight: confirmation is not just about the world matching the theory; it is about us *learning* that the world matches the theory. The blood pressure spike you feel is the friction of that learning process. It is not a bug in the philosophy; it is the feature that makes science work.

  **Recommendation:** Endorse the Garber solution in your group, but press the point that it requires treating logical entailment as an empirical discovery process. That is the only position that respects both the math and the history.
