      *   **The Problem:** *Error Rate Disparity* (False Positive and False Negative rates differ across groups). Specifically, among non-defaulters, one group is flagged high-risk more often (higher False Positive Rate), and among defaulters, the other group is flagged high-risk more often (lower True Positive Rate/Higher False Negative Rate).
      *   **The Conflict:** Compliance/Boss wants *both* Calibration *and* Equalized Error Rates (Equal Opportunity/Equalized Odds).
      *   **The Data Scientist's Claim:** You can't have both unless base rates are equal or the model is perfect.
      *   **The User's Intuition:** This feels like a known philosophical/technical debate, not just an engineering bug.
      *   **The Questions:**
          1.  Am I onto something? (Is this a known theorem/debate?)
          2.  Which should they prioritize, and why?

  2.  **Identify the Core Concept:**
      *   The scenario describes the **Impossibility Theorem of Fairness** (often attributed to Chouldechova, 2017, or Kleinberg, Mullainathan, & Raghavan, 2016).
      *   The specific metrics involved are:
          *   *Calibration* (Predictive Parity): $P(Y=1 | S=s, A=a) = P(Y=1 | S=s)$. (Score means the same thing across groups).
          *   *Equalized Odds* (or Equal Opportunity): $P(S=s | Y=y, A=a)$ is constant across groups $A$. (Error rates are equal across groups).
          *   *Base Rate:* $P(Y=1 | A=a)$. (Underlying default rates differ).
      *   **The Theorem:** You cannot satisfy Calibration and Equalized Odds simultaneously if Base Rates differ and the classifier is imperfect.

  3.  **Address Question 1: "Am I onto something?"**
      *   Yes, absolutely. This is the central tension in algorithmic fairness literature.
      *   Key names/papers: Kleinberg et al. (2016), Chouldechova (2017), Berk et al. (2018).
      *   It's not an engineering bug; it's a mathematical constraint.

  4.  **Address Question 2: "Which should they prioritize, and why?"**
