          *   *Refinement:* Actually, under US Fair Lending laws, *Disparate Impact* (which looks at outcome disparities, often driven by error rates) is the primary litigation risk. But you can defend it with "Business Necessity" (Calibration/Risk accuracy). So the strategy is: Maximize Calibration (Business Necessity) but monitor Disparate Impact. If Impact is too high, you must find a less discriminatory alternative (which might mean sacrificing some calibration).

