answer: |-
  The debate over usury is often treated as a relic of theological superstition, a shadow from an age before finance was understood as a science. Yet, as your reporting indicates, the Aristotelian foundation of this debate is not merely a prohibition but a metaphysical claim about the nature of value itself. Aristotle's argument rests on a specific triangulation: money is conventional (*nomisma* from *nomos*), wealth should be limited by need (*oikonomia*), and interest is unnatural because it treats money as biologically generative (*tokos*). When we weigh the contemporary assessments of this argument—those who see it as a proto-materialist insight versus those who dismiss it as etymological wordplay—we must arrive at a clear verdict. Aristotle's specific reasoning regarding the "sterility" of money is a philosophical dead end that collapses under its own internal contradictions. However, the second camp is only partially right to dismiss it; while the logic fails, the diagnosis it accidentally produced remains indispensable. We must discard Aristotle's metaphysics to save his ethics.

  The primary reason Aristotle's specific argument cannot survive as serious reasoning is that it violates its own premises regarding the conventional nature of money. Aristotle insists that currency has no value by nature, but only by law or custom (*nomos*). This is a sophisticated insight for the fourth century BCE, acknowledging that a coin's purchasing power is a social agreement. However, he undermines this insight when he condemns interest as "unnatural." If money is truly a creature of *nomos* (custom), then its behaviors and rules are determined by human agreement, not by biological imperatives. To argue that a conventional tool is violating "nature" by accruing interest is a category error. You cannot claim an artifact is acting against nature when its very existence is an artifact of human will. If humans agree that money accumulates value over time to account for risk and opportunity cost, that is a new *nomos*, not a violation of *physis*. By trying to ground a conventional instrument in natural law, Aristotle creates a tension he cannot resolve: money is man-made, yet its man-made uses are judged by a standard it cannot logically meet.

  Furthermore, the reliance on the etymology of *tokos* (offspring) to prove the sterility of money is the "wordplay" critics accuse it of being. This is an etymological fallacy masquerading as teleological reasoning. Just because the word for interest shares a root with biological reproduction does not mean the economic mechanism functions like a biological one. Aristotle argues that a shoe is for wearing, and using it to exchange is secondary; similarly, money is for exchange, and using it to breed is unnatural. But this ignores the capacity of money to function as capital. When money is lent to a merchant to outfit a ship, it does not "breed" in a vacuum; it facilitates labor and trade that generate a surplus. The interest paid is a share of that real surplus, not the magical fission of silver drachmas. To call this unnatural is to ignore the reality that time and risk have economic value. The Scholastic tradition inherited this error, struggling for centuries to justify why a lender could share in profit but not charge for the use of money itself, a distinction that often collapsed into casuistry because the underlying premise—that money is sterile—was empirically false.

  However, to dismiss Aristotle entirely as a bumbling linguist is to miss why Marx and others found such resonance in his work. Here, the first camp of contemporary readers is correct, though for the wrong reasons. Aristotle was not fumbling toward a theory of surplus value in the Marxist sense; he was stumbling upon the distinction between productive and extractive finance. His argument survives not as physics, but as a warning symptom. When Aristotle claims that usury makes money an end rather than a means, he is identifying a pathology that modern economics often ignores: the detachment of the financial sector from the real economy. In Aristotelian terms, *oikonomia* serves the household (the real economy of needs), while *chrematistike* (wealth accumulation) becomes limitless and destructive when it severs ties from those needs.

  The "accident" of Aristotle's argument is that by insisting money cannot breed, he forced later thinkers to ask: *If money isn't breeding, where is the value coming from?* This question led to the eventual realization that legitimate return must be tied to actual productivity and risk, rather than mere possession. The prohibition on usury, rooted in this "dead end" argument, inadvertently preserved the intuition that finance should be a servant to production, not a predator upon it. When financial instruments become so complex that they generate returns without any underlying asset or labor—when M begets M' without C (commodity) in between—Aristotle's "unnatural" label feels prophetic, even if his biological reasoning was flawed. He correctly identified the cancer, even if his explanation of the pathology was wrong.

  Therefore, the verdict must be decisive: Aristotle's specific argument against interest is a dead end that should be set aside. It relies on a contradiction between the conventional nature of money and the natural law he applies to it, and it leans on an etymological metaphor that cannot bear the weight of economic reality. We cannot build a modern theory of finance on the claim that money is sterile. Yet, we should not discard the distinction he pointed toward. The valuable insight is not that money *cannot* breed, but that it *should not* breed without purpose. We must replace Aristotle's metaphysical sterility with an ethical framework of contribution: interest is legitimate when it tracks value creation and risk assumption, and illegitimate when it functions as rent-seeking extraction detached from real wealth. Aristotle's argument fails as science, but it succeeds as a moral alarm. We keep the alarm, but we must stop pretending the fire is caused by biology.
