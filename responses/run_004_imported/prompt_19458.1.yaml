answer: |-
  This is a fantastic dramatic knot. You have correctly identified the central tension in Maimonidean scholarship: the dissonance between the *Guide for the Perplexed* (where sacrifice is a historical concession to human limitation) and the *Mishneh Torah* (where sacrifice is an eternal, binding legal obligation).

  If your protagonist knows his Maimonides, he knows that Rambam would not answer with a simple "Yes" or "No." He would answer with a distinction between **law** (*halakha*) and **timing** (*et*), and between the **means** and the **end**.

  Here is how Maimonides would likely respond to the Temple Institute volunteer, based strictly on his texts and historical behavior, followed by suggestions for how your protagonist might voice this in the scene.

  ### 1. The Messianic Prerequisite (Hilchot Melachim)
  The strongest argument Maimonides would make is procedural. In *Mishneh Torah*, Laws of Kings 11:4, Maimonides lays out the criteria for the Messiah. The Messiah must:
  1.  Arise from the House of David.
  2.  Study Torah and observe mitzvot.
  3.  **Fight the wars of God and succeed.**
  4.  **Rebuild the Temple.**
  5.  **Gather the exiles.**

  Crucially, Maimonides writes that if a candidate arises and *fails* to achieve all these things (or is killed), he is not the Messiah. He explicitly warns against calculating the end of days or forcing the redemption, citing the failure of Bar Kokhba.

  **The Maimonidean Verdict:** You do not build the Temple to *bring* the Messiah; the Messiah comes to *build* the Temple. To attempt to reinstate sacrifices before the true Messiah has proven himself through undeniable success and prophecy is not piety; it is a violation of the legal order. It is putting the cart before the horse. Maimonides was traumatized by the Yemenite Messiah pretender in his own lifetime; he would view the Temple Institute's activism as a dangerous, premature disruption of the divine timeline.

  ### 2. The Hierarchy of Worship (Guide 3:32 & 3:51)
  In the *Guide*, Maimonides argues that the *purpose* of the commandments is the knowledge of God and the refinement of the intellect. Sacrifice was instituted because the Israelites were weaned from idolatry; they could not conceive of worship without physical action.

  While the *Mishneh Torah* codifies sacrifice as law, the *Guide* makes it clear that **prayer and intellectual apprehension are a higher form of worship.**
  *   **Guide 3:51:** "The intellect that overflowed toward us... is the ultimate end."
  *   **Guide 3:32:** The sacrificial cult is secondary to the moral and intellectual perfection of the worshiper.

  **The Maimonidean Verdict:** If you are sewing garments and breeding heifers, but you are not perfecting your intellect and your moral character, you are engaging in the lower rung of worship while neglecting the higher. Maimonides would ask her: *"Is your soul ready to stand in the Holy of Holies? Have you mastered physics and metaphysics? Or are you merely playing with the costumes of a service you do not spiritually comprehend?"*

  ### 3. The Problem of Purity and Prophecy
  Maimonides was a rationalist who acknowledged the limits of human knowledge. The sacrificial service requires a level of ritual purity that is currently impossible to attain (due to the laws of corpse impurity). It also requires the Urim v'Tumim and valid prophecy to determine certain legal ambiguities.

  **The Maimonidean Verdict:** To act without prophecy is to act on assumption. For a rationalist like Maimonides, performing a divine service based on human assumption rather than divine command is bordering on *avodah zarah* (foreign worship)—worshipping God according to *our* imagination rather than *His* instruction.

  ---

  ### How the Protagonist Can Answer
  Your protagonist shouldn't give a lecture. He should channel Maimonides' voice: polite, precise, and cuttingly logical. He should avoid the trap of saying "Sacrifices are primitive" (which insults her) and instead focus on the **illegitimacy of the timing** and the **priority of the intellect.**

  Here are three options for the scene, ranging from gentle to severe:

  **Option 1: The Legal Check (Focus on *Hilchot Melachim*)**
  > "Maimonides would ask you a simple question: Has the Messiah come?"
  >
  > She smiles. "We are preparing the way."
  >
  > "No," he says, setting down his wine. "In the *Mishneh Torah*, he is clear. The Messiah rebuilds the Temple. The Temple does not summon the Messiah. To do it in reverse is not zealotry, it is a legal error. He would tell you to put down the needle and pick up the text. Wait for the King. Do not try to crown him before he wins the war."

  **Option 2: The Philosophical Check (Focus on the *Guide*)**
  > "He would ask you what you intend to sacrifice."
  >
  > "Our devotion," she says.
  >
  > "He would say that devotion is better spent in the mind than in the courtyard. In the *Guide*, he teaches that the sacrifices were a concession to a people who could not yet pray with their intellects alone. If you wish to honor him, do not rush to return us to the concession. Rush to reach the goal. Perfect your understanding of God. That is the service that never ends."

  **Option 3: The Synthesis (The most Maimonidean response)**
  > "He would not volunteer," the protagonist says quietly. "He would tell you that the Law is eternal, but the timing is divine. To force the hand of Heaven is not faith; it is impatience. He spent his life calming those who thought they could calculate the End. He would tell you that a red heifer is useless without a purified heart, and a garment is empty without the intellect to wear it. Prepare the people, not the stones. When the time is right, the law will be waiting. Until then, study."

  ### The "Tell" for the Protagonist
  To make this authentic, your protagonist should recognize that the young woman is treating the Temple like a **museum exhibit** (objects, garments, animals) whereas Maimonides treated it as a **metaphysical engine** (knowledge, order, divine flow).

  If he is truly a Maimonidean, he shouldn't feel superior to her, but he should feel a profound sadness for her misdirected energy. Maimonides was not cynical, but he was fiercely protective of the truth against emotionalism. The protagonist might realize that *he* is the one doing the real Maimonidean work: preserving the text, keeping the intellect alive in exile, waiting for a time when the law can be properly applied, rather than forcing a simulation of it.

  **Key phrase to consider:** Maimonides distinguishes between the *true purpose* of the law and the *occasion* of the law. The protagonist might tell her: *"You are obsessed with the occasion. He was obsessed with the purpose."*
