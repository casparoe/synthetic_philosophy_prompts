      *   **Characters:** Two consequentialists.
          *   *Character A (Tameable):* Believes cluelessness is real but manageable/handleable via expected value reasoning.
          *   *Character B (Fatal):* Believes cluelessness undermines the rational basis for choosing actions based on consequences.
      *   **Setting:** A foundation's grant committee meeting, night before a decision.
      *   **Choice:** Measurable short-term benefit (global health/bednets) vs. Speculative long-term intervention (existential risk/far-future).
      *   **Key Requirement 1 (Fatal Side):** Must explain *why* some unforeseen effects don't wash out symmetrically (i.e., it's not just noise).
      *   **Key Requirement 2 (Tameable Side):** Must have a real comeback, not just "EV is best." Specifically, explore the self-undermining nature of claiming *total* cluelessness (judging the degree of cluelessness requires judgment).
      *   **Tone:** Intellectual, high-stakes, nuanced, avoiding cartoonish "nobody knows the future" tropes.

  2.  **Character Development:**
