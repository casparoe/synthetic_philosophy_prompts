      *   *Explanation 2 (Chronological/Traditional):* God literally did not command sacrifice *at the specific time* mentioned ("in the day that I brought them out"). The first laws (Marah) were Sabbath and Civil Laws. Sacrifice came later (Sinai/Tabernacle).
