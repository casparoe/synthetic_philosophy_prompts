      *(Self-Correction during drafting)*: I should be careful not to simply say "the friend is right." The user's distinction between *teleology* and *chronology* is valid as a heuristic. I need to explain *why* they collapse in practice within Maimonides's system. The key is that the chronology is *selected* to support the teleology.

