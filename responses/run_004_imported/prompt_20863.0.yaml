prompt: |-
  hi, i'm one of two student reps on my regional debate league's rules committee, and next week we vote on a proposal to ban "topicality-only" decisions -- where a judge votes against a team purely because their plan doesn't technically fit some definition of a word in the resolution (like arguing "reduce" doesn't cover cap-and-trade), even though nobody argued the plan itself was bad policy. half the committee says this is a legit check that keeps debates fair and on-topic; the other half says its just a cheap trick, winning by fighting over words instead of the real world. our coach compared it to the whole "is pluto a planet" thing -- maybe that's not a real disagreement, just people using a word differently -- and said something similar might be going on here, but she never explained how you'd actually tell, or whether it'd even matter if it were. can you draft the recommendation memo i have to bring to the vote: keep the rule, ban it, or some middle ground (and say how a judge would actually apply it mid-round) -- with real reasons, and don't dodge the strongest argument against whichever one you pick.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Rep on a Regional Debate League's Rules Committee.
      *   **Task:** Draft a recommendation memo for a vote on banning "topicality-only" decisions (T-only votes).
      *   **Context:** Committee is split 50/50. One side sees T as a fairness check; the other sees it as a cheap trick/semantic games.
      *   **Coach's Analogy:** Compared it to "Is Pluto a planet?" (semantic vs. substantive disagreement), but didn't explain how to distinguish or if it matters.
      *   **Requirements:**
          *   Recommend a position (Keep, Ban, or Middle Ground).
          *   Explain how a judge would apply it mid-round (practicality).
          *   Provide real reasons.
          *   Address the strongest argument against the recommendation (steelman the opposition).
          *   Tone: Professional, persuasive, balanced, suitable for a committee vote.

  2.  **Debate Theory & Contextual Knowledge:**
      *   *What is Topicality?* In policy debate, the Affirmative must advocate a plan that falls within the resolution. The Negative can argue the Aff is "not topical."
      *   *What is a T-only vote?* The judge votes Negative solely on the definition of words, without evaluating the merits of the plan (advantages/disadvantages).
      *   *The Conflict:*
          *   *Pro-T:* Ensures ground fairness, limits Aff infinite ground, enforces the resolution as a binding contract.
          *   *Anti-T:* Encourages frivolous arguments, discourages clash on substance, rewards technical trickery over persuasion.
      *   *The "Pluto" Analogy:* Is the dispute about the *nature* of the thing (substantive) or just the *label* (semantic)? In debate, T is often treated as a procedural voting issue, not a semantic one.
      *   *Middle Ground:* "Reasonable Topicality" or "T as a Tiebreaker" or "Disclosure Requirements." A common compromise is requiring the Negative to prove *abuse* or *potential abuse* rather than just a definition mismatch. Or, elevating "Substance over Procedure" unless the abuse is clear.

  3.  **Determine the Recommendation:**
      *   *Option A: Ban T-only votes.* (Risky. Might open the door to wild Affs that ignore the resolution entirely.)
      *   *Option B: Keep status quo.* (Maintains the split. Doesn't solve the problem.)
      *   *Option C: Middle Ground (The "Abuse Standard").* This is the most nuanced and debate-theory sound approach. It acknowledges T is necessary for limits but prevents frivolous T shells. It addresses the "Pluto" concern by asking: "Does this definition difference actually break the game?"
      *   *Decision:* Recommend a **Middle Ground: The "Competing Interpretations with Abuse" Standard.** Essentially, don't ban T, but raise the bar for a T-only vote. A judge shouldn't vote on T unless the Negative proves the Aff's interpretation creates *unfair ground loss* or *unpredictability*, not just that their dictionary is better.

      *Wait, looking closer at the prompt:* The prompt asks to ban "topicality-only" decisions. This implies the Aff might be *somewhat* topical, or the T argument is trivial. A strict ban on T-only votes effectively makes T a "tiebreaker" or requires substantive clash.
      *Refined Decision:* A **"Substance Priority" Framework.** T is a gateway, but if the Aff is *reasonably* topical, the debate should be decided on substance. However, a complete ban on T votes is dangerous for the activity's structure.
      *Better Middle Ground:* **Require "Voters" to focus on Predictability and Ground, not Semantic Precision.** But the prompt asks specifically about banning T-*only* decisions.
      *Let's go with a Modified Ban/Standard:* **Adopt a "Reasonable Topicality" Standard that discourages T-only votes unless the Aff is clearly outside the core meaning of the resolution.**
      *Actually, the most practical middle ground in league rules is:* **T is a procedural issue, but judges must prioritize substantive clash if the Aff is within the 'core' of the topic.**
      *Let's simplify:* Recommend **against a blanket ban**, but **for a stricter standard of proof** that effectively reduces frivolous T-only votes. Why? Because a blanket ban removes the Negative's primary check against infinite Aff ground.
      *Wait, the prompt asks me to choose: Keep, Ban, or Middle Ground.*
      *If I choose Middle Ground:* I need to explain how a judge applies it.
      *Proposal:* **"The Core Meaning Standard."** Judges should reject T-only arguments if the Affirmative's plan falls within the *common understanding* of the resolution, even if a technical definition excludes it. This addresses the "Pluto" analogy (common usage vs. technical classification).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly (Middle Ground: "Core Meaning" Standard).
      *   **Background:** Briefly explain the T-only controversy.
      *   **Analysis of Options:**
          *   *Ban:* Good for substance, bad for limits.
          *   *Keep:* Good for limits, bad for accessibility/education.
          *   *Middle Ground:* Balances both.
      *   **The Recommendation (The "Core Meaning" Test):** Define it. How does a judge use it? (1. Is it within common understanding? 2. Is there actual abuse?).
      *   **Addressing the Coach's Analogy:** Explain the "Pluto" point. It matters if the definition changes the *activity* (debate ground), not just the label.
      *   **Strongest Counter-Argument:** The "Slippery Slope/Ground Loss" argument. If we make T harder to win, Affs will run weird cases that negate the topic.
      *   **Rebuttal to Counter:** The "Core Meaning" test still protects the center of the topic, just trims the fringe wars.
      *   **Implementation:** How to instruct judges.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Core Meaning" too vague for high schoolers/college students to judge?
      *   *Fix:* Make it concrete. Use the "Reasonable Person" test. Would a layperson think this fits the topic?
      *   *Critique:* Did I address the "Pluto" analogy?
      *   *Fix:* Explicitly mention it in the analysis. The Pluto debate didn't change Pluto's properties, just its label. In debate, if the T argument is just about the label (dictionary A vs. B) without showing how it breaks the debate (ground), it's a "Pluto" argument and should be ignored.
      *   *Tone Check:* Needs to sound like a student rep, but professional. Not too academic, but knowledgeable.

  6.  **Final Polish:** Check against constraints.
      *   Keep, Ban, or Middle? (Middle).
      *   How judge applies it? (Included).
      *   Real reasons? (Fairness vs. Education).
      *   Strongest argument against? (Ground loss/Infinite Aff).

  7.  **Final Output Generation:** (Proceeding to draft based on this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Regional Debate League Rules Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding "Topicality-Only" Voting Decisions

  ### Executive Summary

  The Committee is currently deadlocked on whether to ban judges from casting "topicality-only" decisions (votes against the Affirmative based solely on definitional technicalities without evaluating the plan's merits). 

  After reviewing the educational goals of our league and the structural needs of policy debate, **I recommend a Middle Ground approach.** We should not issue a blanket ban on topicality votes, as this removes the Negative's primary check against infinite Affirmative ground. However, we should adopt a **"Core Meaning & Abuse" Standard.** This standard instructs judges to reject topicality arguments that rely on semantic technicalities (the "Pluto" problem) unless the Negative can prove the Affirmative's interpretation destroys fair ground or unpredictability.

  This approach preserves the resolution as a binding contract while discouraging frivolous word games that detract from substantive clash.

  ### Background

  Topicality ensures the Affirmative advocates a plan that fits the resolution. Currently, a Negative team can win a round solely by proving their dictionary definition of a word (e.g., "reduce") is technically superior to the Affirmative's, even if the Affirmative's plan is sound policy. 

  *   **Pro-Ban Camp:** Argues this incentivizes "cheap tricks," discourages research on substance, and creates barriers for newer teams.
  *   **Pro-Status Quo Camp:** Argues this is the only mechanism to limit Affirmative ground and ensure both sides debate the same topic.

  ### Analysis of the "Pluto" Analogy

  Our coach compared frivolous topicality to the "Is Pluto a planet?" debate. This analogy is instructive but requires clarification for adjudication.

  *   **The Analogy:** When astronomers reclassified Pluto, its physical properties didn't change; only the label did. Similarly, in debate, a "Pluto-style" topicality argument claims the Affirmative's plan doesn't change based on the definition, only the label of whether it is "allowed."
  *   **Why It Matters:** In astronomy, the label matters for classification. In debate, the label matters for **fairness**. If the Affirmative runs a plan that no reasonable person would associate with the topic (e.g., a space plan on a healthcare topic), the Negative has no ground to prepare. 
  *   **The Distinction:** A topicality argument is valid if it proves the Affirmative has chosen a "Pluto" (something fundamentally outside the category). It is invalid if it proves the Affirmative is simply a "dwarf planet" (technically distinct but functionally similar to the core topic). 

  Therefore, the rule should not ban topicality, but it must distinguish between *classification* (valid) and *semantic splitting* (invalid).

  ### Recommendation: The "Core Meaning & Abuse" Standard

  I propose we amend the judging guidelines to adopt the following standard for Topicality decisions:

  **1. The "Reasonable Person" Test (Core Meaning)**
  Judges should evaluate whether the Affirmative's plan falls within the *common understanding* of the resolution, not just technical definitions. If a layperson would agree the plan fits the topic, the judge should prioritize substantive clash over semantic technicalities.

  **2. The Abuse Requirement**
  To win on a topicality-only ballot, the Negative must prove **actual or potential abuse**, not just a definition violation. They must demonstrate:
  *   **Ground Loss:** Why does this definition prevent the Negative from running standard arguments?
  *   **Unpredictability:** Why could the Negative not reasonably prepare for this interpretation?

  **3. Judicial Application (Mid-Round Instructions)**
  *   *Step 1:* Is the Affirmative reasonably topical? If yes, default to evaluating substance (Advantages vs. Disadvantages).
  *   *Step 2:* If the Affirmative is on the fringe, does the Negative prove that allowing this interpretation makes the topic impossible to debate fairly?
  *   *Step 3:* If the Negative only proves their dictionary is "better" but cannot explain how the Affirmative's definition breaks the debate, the judge must vote on substance.

  ### Strongest Argument Against This Recommendation

  **The "Slippery Slope" of Ground Loss.**
  The strongest argument against this middle ground comes from the Pro-Status Quo camp. They argue that requiring "abuse" places an impossible burden on the Negative. By the time the Negative proves the Affirmative's interpretation causes specific ground loss, the round is over. 

  Furthermore, they argue that **predictability is the abuse.** If we allow Affirmatives to stretch definitions under the guise of "Core Meaning," we invite "case-specific" topics. For example, if the topic is "Reduce Military Presence," an Affirmative could argue that "cyber-warfare" isn't "military presence" technically. If judges are told to prioritize substance, the Negative never gets to argue the core topic because the Affirmative keeps shifting the goalposts. A strict topicality standard is the only bright line that prevents the Affirmative from choosing the topic mid-round.

  ### Rebuttal and Mitigation

  While the risk of ground loss is real, the current status quo creates a different abuse: **The "Gotcha" Round.** Currently, a Negative can read a prepared block on a obscure definition, win a technical point, and avoid engaging with the Affirmative's actual case. This devalues research on policy merits.

  The "Core Meaning" standard mitigates the Slippery Slope by maintaining Topicality as a voting issue, but raising the threshold. It does not say "Topicality doesn't matter." It says "Topicality matters for fairness, not for semantics." If an Affirmative runs a cyber-warfare plan on a military topic, the Negative can still prove that is outside the *Core Meaning* and causes Ground Loss (because the Neg prepared for troops, not code). The standard simply filters out the arguments where the definition difference is trivial (e.g., "reduce" vs. "eliminate") but the policy clash is identical.

  ### Conclusion

  A blanket ban on topicality votes removes the guardrails of the activity. However, maintaining the status quo incentivizes style over substance. 

  By adopting the **"Core Meaning & Abuse" Standard**, we signal to our league that:
  1.  The resolution is a binding contract (protecting the Negative).
  2.  The goal of debate is policy comparison, not lexicography (protecting the Affirmative).
  3.  Judges are empowered to intervene against semantic games that obscure the real clash.

  I move we adopt this standard for the upcoming season.
