answer: |-
  This is a splendid puzzle, and I congratulate you on identifying it. It cuts to the heart of how Dummett's semantic theories interface with his practical life and normative commitments. It is precisely the sort of tension that makes for a vibrant graduate seminar, because it forces students to decide whether Dummett's anti-realism is a universal metaphysical doctrine or a localized semantic thesis.

  While on the surface this looks like a glaring inconsistency, I believe you are running together considerations that Dummett would keep apart. The tension is illuminating, but I do not think it amounts to a contradiction in his system. Here is how I would suggest framing the issue for your class, broken down into four philosophical distinctions that dissolve the apparent inconsistency.

  ### 1. Descriptive vs. Normative Discourse
  Dummett's arguments against bivalence are primarily directed at *descriptive* discourse—statements that aim to represent a mind-independent reality (e.g., "Caesar had eggs for breakfast on the morning of the Rubicon" or "There is a gold mine on the dark side of the moon"). In these cases, Dummett argues that if the truth condition transcends our ability to recognize it, the notion of truth becomes magical or occult, and we lose our grip on meaning.

  However, moral and political statements are *normative*. They do not describe a pre-existing state of affairs in the way empirical statements do; they prescribe action or evaluate states of affairs. Dummett never explicitly extended his semantic anti-realism to ethical discourse in the way he did for mathematics or empirical statements about the past. In fact, in his political writings, he operates with a robust form of moral realism. He treats the wrongness of racism or the obligations to refugees as objective facts that are accessible to human reason. For Dummett, the "verification" of a moral claim is not empirical observation but moral reasoning and intuition. If we have the capacity to recognize the validity of a moral argument, the claim is not "verification-transcendent" in the problematic sense.

  ### 2. The Nature of "Verification" in Ethics
  Your puzzle rests on the premise that moral claims lack a "proof or decision procedure" comparable to mathematics or empirical evidence. Dummett would likely agree that there is no *mechanical* decision procedure for ethics, but he would deny that this renders moral truths unknowable or bivalence inapplicable.

  In his semantic theory, the requirement is not for a *decision procedure* (which would settle the matter in finite time for any statement) but for a *means of recognition*. We must be able to recognize when a statement is true if it is true. Dummett believed that through moral reflection, we *can* recognize the truth of "refugees have a claim to asylum." The lack of empirical evidence (like a vanished trace in the past) does not apply here, because the "evidence" for moral claims is constituted by the reasons we can give for them. As long as those reasons are publicly accessible and intelligible, the statement is not epistemically unconstrained. Therefore, asserting a definite conclusion on immigration does not violate the strictures of semantic anti-realism, because the truth of the matter is not held to outstrip our capacity to know it.

  ### 3. Moral Realism and Catholicism
  It is impossible to discuss Dummett's political philosophy without acknowledging his devout Catholicism. Dummett was a moral realist in a traditional sense; he believed in an objective moral order. This creates a fascinating friction with his semantic anti-realism, but it resolves your specific puzzle.

  Dummett's attack on bivalence is motivated by the fear that truth becomes detached from human knowledge. But in ethics, Dummett did not fear this detachment because he believed moral truths are inherently tied to human rationality and conscience. He did not view moral obligations as "remote past" facts that have vanished; he viewed them as present demands of justice. To suspend judgment on the rights of refugees would, for Dummett, be a moral failure, not a semantic virtue. He would likely argue that the "suspended stance" of intuitionistic logic is appropriate for domains where reality outruns us, but not in domains where reality is constituted by our rational engagement with it (a view closer to Kant or Wittgenstein than to the empirical realism he critiques).

  ### 4. Warranted Assertibility vs. Truth
  Finally, even if one insists that Dummett *should* have been a moral anti-realist given his semantics, his political assertiveness can be defended through the concept of *warranted assertibility*.

  Dummett's anti-realism replaces truth with warranted assertibility as the central notion of meaning. When Dummett argues for the rights of refugees, he is not necessarily claiming access to a Platonic moral truth that is bivalent. He is claiming that, given our current moral concepts and the evidence of human suffering, the statement "States owe obligations to refugees" is *warrantedly assertible*.

  In the "remote past" cases, we lack warrant *and* we lack the possibility of obtaining it. In the immigration case, we have strong warrant (moral reasoning, international law, human rights frameworks). Dummett is entitled to be definite about what is warrantedly assertible, even if he remains agnostic about a transcendent "Truth" that lies beyond all possible warrant. Since his political book is a practical intervention, he is operating within the realm of the warrantable, not the transcendently true.

  ### Pedagogical Suggestion
  For your seminar, I would suggest presenting this not as a "gotcha" moment where Dummett is caught contradicting himself, but as a boundary test for semantic anti-realism.

  You might ask your students: **Does Dummett's semantic anti-realism entail moral anti-realism?**
  *   **If Yes:** Then Dummett is inconsistent in his political writings, and his political conviction undermines his philosophical rigor.
  *   **If No:** Then there must be a relevant difference between statements about the remote past and statements about moral obligation. What is that difference? Is it that moral truths are mind-dependent? Is it that moral "verification" is rational rather than empirical?

  This approach allows you to honor the sophistication of your observation while using it to deepen the students' understanding of the limits and scope of Dummett's project. The tension you've identified is real, but it is productive: it reveals that Dummett's anti-realism was never intended to be a skeptical doctrine that paralyzes action, but rather a corrective to a specific picture of language that he felt misrepresented our actual cognitive powers.

  In short: Dummett argues we cannot claim to know what is *in principle* unknowable. He did not believe moral obligations were *in principle* unknowable. Hence, no contradiction.
