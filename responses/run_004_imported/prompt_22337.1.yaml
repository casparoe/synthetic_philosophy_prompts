prompt: |-
  My grandpa Stan died this past Tuesday and I've been asked to give the eulogy, which is terrifying since im the only one in the family who ever indulged his thing about Godel. Not the incompleteness stuff -- the letters Godel wrote his own mother about the afterlife, arguing that a rational, meaningful world couldn't build a mind with that much potential and then just switch it off half-used. Grandpa found that argument in some old collection of godel's letters decades ago and adopted it dead seriously as his own view, even though he hadn't set foot in a church since Eisenhower was president (we found an actual Bible on his nightstand after, which nobody saw coming). He told my mom that if anyone at his funeral said he was "watching over us now" he'd come back just to argue about it. Half the room is going to be his old math department, who'll clock the reference immediately if I get it right, and the other half is family who've never heard of Godel and just want to feel comforted. Can you write the eulogy (~5 min)? It needs to actually get his position right, not just hand-wave "he was rational so that's comforting," and it can't turn into a logic seminar or generic afterlife platitudes he'd have hated.
reasoning: |-
