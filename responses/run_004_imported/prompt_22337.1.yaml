answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew my grandfather well, you know that Stan was a man who preferred precision to platitude. He was a man who believed that if a thing was worth saying, it was worth saying correctly. So, standing here today, I feel a particular responsibility to get a few things right. He wouldn't forgive me if I didn't.

  First, the practical matters. Stan left specific instructions regarding the metaphysics of this occasion. He told my mother that if anyone stood at this podium and said he was "watching over us from above," he would find a way to come back just to argue the point. He felt that phrase implied a surveillance state rather than a continuation of existence. So, in the interest of keeping him resting quietly: he is not watching. He is not monitoring the weather or checking if you ate your vegetables.

  However, just because he wasn't religious in the traditional sense doesn't mean he wasn't spiritual. Many of you know he hadn't set foot in a church since the Eisenhower administration. Yet, as we cleared out his house, we found a Bible on his nightstand. It wasn't there for decoration. It was there because Stan was a man who was always searching for the underlying structure of things. He wanted to know how the world fit together.

  And for the last forty years, the framework he settled on came from an unlikely source: Kurt Gödel.

  Now, for the family: Gödel was one of the most important logicians in history. He was a contemporary of Einstein, a man who proved that mathematics has limits. But for the math department colleagues here today, you know I'm not talking about the Incompleteness Theorems. Stan wasn't interested in the math for the math's sake. He was interested in the letters Gödel wrote to his own mother.

  Decades ago, Grandpa found a collection of that correspondence. In those letters, Gödel argued a specific point about the afterlife. It wasn't based on faith, or scripture, or revelation. It was based on efficiency.

  Gödel's argument, which Stan adopted as his own, was this: The human mind possesses a capacity for understanding, for growth, and for connection that is virtually infinite. We spend our entire lives learning, loving, and expanding our consciousness, and yet, just as we begin to truly understand the world, our time ends. Stan believed that a rational, meaningful universe would not build a machine with such infinite potential only to switch it off while it was still running at half-speed. To him, that wasn't just sad; it was illogical. It was a waste. And Stan hated waste.

  He found comfort in the idea that the universe is rational. He believed that if we are given the capacity to conceive of eternity, it is because eternity is where that capacity is meant to be used.

  I know that for some of you, this sounds technical. But I want you to hear what this meant to him. It meant that his life wasn't a accident that ends in dirt. It meant that his love for us, his curiosity, and his mind were not things that would be discarded. He didn't believe he was going to "rest." He believed he was going to continue the work.

  I remember sitting with him in his study a few years ago. I asked him if he was scared. He looked at me over his glasses and said, "Why would I be scared of the next step in the proof?"

  To him, death wasn't a full stop. It was a comma. It was a transition to a state where the mind could finally function without the limitations of the body.

  So, how do we say goodbye to a man who didn't believe in goodbyes?

  We don't honor him by pretending he's a ghost hovering in the room. We honor him by respecting the potential he believed in. He believed that his mind mattered. He believed that *our* minds matter. The best way to comfort ourselves isn't to imagine him looking down, but to recognize that the time we had with him was real, the logic he taught us is sound, and the love he gave us is data that doesn't just vanish.

  He argued that a meaningful world doesn't delete its most complex creations. If he was right, then he isn't gone. He's just working on a problem we can't see yet.

  Thank you, Grandpa, for teaching us to think clearly, even when our hearts were heavy. We'll try to keep the logic sound.

  Rest well.
