      *   **Audience:** Split 50/50. Math department colleagues (will know/care about the Gödel reference) and Family (want comfort, don't know the math).
      *   **Tone:** Respectful, accurate to his views, comforting but not sappy, avoiding generic platitudes he'd hate.
      *   **Length:** ~5 minutes (approx. 750-900 words spoken at a moderate pace).

