      *   Which is better? AL allows keeping classical logic as the norm (implicit) while modeling the failure as a performance error. IW changes the competence itself. For a PhD student in *epistemology*, preserving the normative force of logic (via implicit knowledge) while modeling the descriptive failure (explicit) is often preferred. I will lean towards Awareness for this reason, but acknowledge the strengths of IW for hyperintensional contexts.

      *(Relocation)*:
      *   IW: The modeler is omniscient about the impossible worlds structure.
      *   AL: The implicit operator is omniscient.
      *   Both relocate.

