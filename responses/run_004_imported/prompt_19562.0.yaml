      Daniel wrote his dissertation on how it's irrational to doubt the evidence. He says if the evidence says "Yes," you can't say "Maybe." But during this engagement, he's been a living counter-example. He knows she loves him. He still asks "Why?" Daniel, logic won't fix this. But marriage might.
      *Critique:* Better. But needs to land the emotional punch. The "why" is the key. It's not logic that fixes it, it's *her*.

  8.  **Drafting - Iteration 3 (Polishing the Voice):**
      *   Start with the "rules of thinking."
