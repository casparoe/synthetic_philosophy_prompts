answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of calling Daniel a friend for [Number] years.

  Standing up here, I know I have a delicate balancing act to perform. About a third of you know Daniel primarily through his academic work. The rest of you know him as the guy who laughs a little too hard at his own jokes and remembers everyone's birthday. My job is to speak to both groups without making the first group bored or the second group confused.

  And that is fitting, because Daniel has spent his entire career studying how we bridge gaps in understanding.

  For those who aren't philosophers, Daniel is an epistemologist. Which is a fancy way of saying he studies how we know what we know. Specifically, his dissertation defended a principle that, in plain English, goes something like this: *It is never rational to believe something is true if you also believe that your own evidence doesn't support it.*

  In other words, if you look at the facts, and the facts say "Yes," but your gut says "Maybe," Daniel's life work says your gut is breaking the rules of rationality. He argued that you can't have it both ways. You have to align your belief with the evidence.

  And then, he got engaged.

  Because for the last year, Daniel has been a living, breathing counter-example to his own life's work.

  Daniel, look at the evidence. It is overwhelming. We see the way [Partner's Name] looks at you. We hear the way she talks about you. You have her testimony, repeated daily, often hourly, that she is deeply, completely in love with you. By every metric you teach your students to use, the case is closed. The data is settled.

  And yet, I have sat with you over coffee, watched you look at her across the room, and heard you say, cheerfully and honestly, "I know all the evidence says she's the one. I just… I still don't quite buy it."

  You are walking around in a state of mind you spent five years proving is unsustainable. You are believing that the evidence is solid, while simultaneously believing that the conclusion can't possibly be true. By your own definition, Daniel, you have been irrational for eighteen months.

  But here is the thing I want to say to you, and to everyone in this room who knows what it feels like to be the lucky one in a relationship.

  There is a temptation, especially for a man of logic, to think that the solution to this feeling is to find *more* evidence. To think that if you just analyze the data enough, the doubt will go away, and your internal state will finally match the external reality.

  But I don't think that's how this works. And I don't think [Partner's Name] is waiting for you to solve that equation.

  The beauty of what you two have isn't that Daniel has finally achieved a perfectly rational belief state. The beauty is that [Partner's Name] loves him enough that it doesn't matter if he thinks it's rational yet.

  Daniel, your dissertation says that holding this kind of doubt is a flaw in your reasoning. But I think tonight proves something else. It proves that love is the one area of life where you don't need to align your internal confidence with the external facts. You don't need to argue yourself into deserving this. You don't need to logic your way into security.

  [Partner's Name], thank you for being the evidence that speaks louder than his doubt. And thank you for having the patience to let him catch up to the facts at his own pace.

  Daniel, my wish for you isn't that you finally win the argument against your own skepticism. My wish is that, eventually, you stop needing to have the argument at all. That one day, you'll realize you haven't checked the evidence in months, because you're too busy living in the truth of it.

  So, if everyone could please raise a glass.

  To Daniel and [Partner's Name]. May your life together be full of love, full of joy, and full of things that are too good to be true, even when the evidence says otherwise.

  To the happy couple!
