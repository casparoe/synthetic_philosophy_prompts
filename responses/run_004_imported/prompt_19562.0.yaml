prompt: |-
  I'm giving the toast at my friend Daniel's wedding next month. He's an epistemologist whose dissertation defended what people in the field call the Non-Akrasia Constraint: the view that it's never rational to believe P while also believing that your own evidence doesn't support P, no matter how settled that feels from the inside. He has spent the whole engagement as a textbook case of exactly the thing he says can't happen — the kind of case he'd normally illustrate with a sleep-deprived detective or a hypoxic pilot — except here he'll cheerfully agree that all the evidence, her own testimony very much included, says she's completely in love with him, and then admit, in the same breath, that he doesn't buy it. About a third of the room will be people from his PhD program who'll know exactly what's funny about that; everyone else just wants a toast that's warm and doesn't need a glossary. Write it so his own akrasia is the joke and the emotional core, not a term he name-drops once for the philosophers, and so it doesn't just try to argue him into believing the evidence — since, as he'd be the first to admit, that's exactly the move his own dissertation says can't work.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a friend named Daniel.
      *   **Groom's Profession:** Epistemologist (philosopher of knowledge/belief).
      *   **Specific Academic Focus:** Defended the "Non-Akrasia Constraint" (it's irrational to believe $P$ while believing your evidence doesn't support $P$).
      *   **The Irony/Joke:** Daniel is currently experiencing exactly what he argues against. He acknowledges the evidence (his partner loves him, she says she loves him, etc.) but admits he doesn't fully believe he deserves it/is loved. He's in a state of "akrasia" (weakness of will/irrational belief state).
      *   **Audience:** Mixed. 1/3 are philosophy PhDs (will get the technical nuance), 2/3 are normal people (need warmth, no jargon).
      *   **Constraint 1:** Do not just name-drop "Non-Akrasia Constraint" once and move on. Make the *concept* the core, not the term.
      *   **Constraint 2:** Do not try to *argue* him into believing the evidence (since his own thesis says argument doesn't fix this specific problem).
      *   **Tone:** Warm, funny, emotional, accessible but intellectually respectful.

  2.  **Deconstruct the Core Conflict:**
      *   *The Theory:* You shouldn't feel doubt when the proof is right in front of you.
      *   *The Reality:* Daniel feels doubt even though the proof is overwhelming.
      *   *The Resolution:* Love isn't about rational belief states; it's about accepting the feeling despite the irrationality. Or, better yet, the partner *is* the evidence that overrides the need for perfect rational coherence.
      *   *The Trap:* If I say "Look at the evidence, Daniel, you're wrong," I'm ignoring his expertise. He knows the evidence. The issue is the *gap* between evidence and belief.
      *   *The Fix:* Acknowledge the gap. Validate the feeling of unworthiness/doubt, but frame the marriage as the space where that gap doesn't matter.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the mixed crowd (philosophers and normals). Set a warm tone.
      *   **The Setup (The Work):** Briefly explain what Daniel studies without using jargon. He studies how we know what we know. He wrote a big paper on how it's "broken" to doubt yourself when the facts are clear.
      *   **The Turn (The Irony):** Point out that he is currently living in that "broken" state. He knows she loves him. He hears her say it. But he still wakes up wondering how it happened.
      *   **The Philosophical Pivot:** Why is this okay? Because love isn't a dissertation. It's not about aligning belief with evidence perfectly. It's about trust.
      *   **The Address to the Couple:**
          *   To Daniel: It's okay to be irrational here.
          *   To the Partner: Thank you for being the evidence that speaks louder than his doubt.
      *   **The Closing:** A wish for the future. A toast.

  4.  **Refining the Humor & Accessibility:**
      *   *Avoid:* "Non-Akrasia Constraint," "Epistemic Normativity," "Doxastic Voluntarism."
      *   *Use:* "Rules for thinking," "Ignoring the facts," "Head vs. Heart."
      *   *For the Philosophers:* Use phrases like "textbook case," "defended the view," "rational belief." They will read between the lines.
      *   *For the Normals:* Keep it about imposter syndrome or just being lucky in love.

  5.  **Addressing the "Don't Argue" Constraint:**
      *   Instead of saying "You *should* believe it," say "It doesn't matter that you don't fully believe it yet."
      *   Frame the marriage as the thing that bridges the gap, not logic.
      *   The toast should say: "Your thesis says this state is unsustainable. My wish is that love makes it sustainable."

