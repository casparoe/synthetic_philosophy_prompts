      *   *Correction:* Parfit critiques Lockeans (Psychological Continuity Theorists) precisely because they insist on identity. Parfit says fission shows identity can't be what matters because identity is one-to-one, while what matters (psychological continuity) can be one-to-many. Locke doesn't anticipate this because he doesn't seriously engage with fission cases where consciousness splits.

