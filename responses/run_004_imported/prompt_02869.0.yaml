      *   *Is the finger case fission?* No. It's a *transfer* case (one-to-one). Consciousness leaves the body and goes to the finger. The body is left empty (consciousness-wise).
      *   *Fission:* Consciousness splits into two (Body A and Body B both have equal claim).
      *   *Locke's Vulnerability:* Locke *is* vulnerable to fission, but the finger case isn't it. The finger case is designed to show that substance/body doesn't matter.
