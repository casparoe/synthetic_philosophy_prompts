prompt: |-
  Ok so I had this whole argument with my friend last night after our philosophy of perception seminar about disjunctivism, and neither of us backed down. Her point was that since a hallucination of a tomato and a real perception of a tomato can feel completely identical from the inside, disjunctivism doesn't actually block the argument from illusion at all -- it just quietly concedes it. Like, if you can never tell which one you're in, then in practice all our perceptions are equally in question, so the old sense-datum theorists were right all along and naive realism doesn't buy you anything. I said thats not why disjunctivism exists but couldnt nail down exactly what's wrong with her reasoning at 1am. Who's actually right? Don't just present both sides as equally reasonable -- I want to know if she has a real point or if she's misunderstanding what disjunctivism is supposed to do in the first place.
