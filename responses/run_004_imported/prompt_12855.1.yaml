answer: |-
  You were right, and she is misunderstanding the core metaphysical claim of disjunctivism.

  To be fair to your friend, she is articulating the single most common and powerful objection to disjunctivism (often called the "Epistemological Objection" or the challenge from the "Common Kind Assumption"). It is a sophisticated objection. However, her conclusion that disjunctivism "quietly concedes" the Argument from Illusion is incorrect. She is conflating **epistemic indistinguishability** (you can't tell them apart) with **metaphysical identity** (they are the same kind of thing).

  Here is the breakdown of why her reasoning fails, and why disjunctivism does not buy the sense-datum theorist a victory.

  ### 1. The Core Confusion: Indistinguishability $\neq$ Identity
  Your friend's argument rests on this inference:
  1.  A hallucination and a veridical perception can feel exactly the same from the inside.
  2.  Therefore, they must be the same fundamental kind of mental state.
  3.  Therefore, if the hallucination doesn't involve a real tomato, the veridical perception doesn't either (it involves a sense-datum).

  Disjunctivism explicitly rejects step 2.

  The disjunctivist argues that just because two things are indistinguishable to a subject, it does not mean they share a common underlying nature. Consider a perfect counterfeit \$100 bill and a real \$100 bill. To the naked eye, they might be indistinguishable. But it would be absurd to say that because they are indistinguishable, the real bill isn't *actually* made of cotton-linen blend currency paper. The real bill is genuine currency; the fake is a piece of paper designed to mimic it. They are fundamentally different kinds of objects, even if you can't tell which is which while holding them.

  Disjunctivism applies this to perception. In the "good case" (veridical), your experience is constituted by the actual tomato. In the "bad case" (hallucination), your experience is a mere seeming. They are **disjuncts**: either I see a tomato, *or* I hallucinate one. There is no common denominator (no "sense-datum") shared between them.

  Your friend claims disjunctivism concedes the point because it admits they feel the same. But admitting they feel the same is not conceding that they *are* the same. Disjunctivism blocks the Argument from Illusion by denying the premise that indistinguishability entails a common mental kind.

  ### 2. Why Disjunctivism Doesn't "Concede"
  Your friend claims that because we can't tell the difference, "in practice all our perceptions are equally in question." This is an epistemological worry, not a metaphysical one.

  *   **The Sense-Datum Theorist says:** "Since you can't tell the difference, you are *never* directly aware of the world. You are always aware of an intermediary."
  *   **The Disjunctivist says:** "When you are in the good case, you *are* directly aware of the world. The fact that there is a possible bad case where you aren't doesn't change the nature of the good case."

  Disjunctivism refuses to let the bad case (hallucination) dictate the metaphysics of the good case (perception). Sense-datum theory takes the hallucination as the model for *all* experience. Disjunctivism takes the veridical perception as the model for *successful* experience and treats hallucination as a distinct, parasitic failure mode.

  So, she is wrong that it "buys nothing." It buys the claim that in the veridical case, the mind is not closed off from the world. It saves Naive Realism from the conclusion that we are trapped behind a veil of ideas.

  ### 3. Where She Has a Point (The "Hard Problem")
  While she is wrong that disjunctivism *concedes*, she is right that disjunctivism faces a massive explanatory burden. This is likely why she feels so strongly.

  If the two states are metaphysically different, **what explains the indistinguishability?**
  If the veridical state involves a real tomato and the hallucinatory state does not, why do they feel identical? Usually, we explain subjective feeling by appealing to internal brain states or mental contents. If disjunctivism says there is no common internal content, it has to explain the similarity without appealing to a common cause.

  Disjunctivists (like M.G.F. Martin) argue that the hallucination is indistinguishable from perception *because* it is a hallucination of perception. It's not that they share a positive property; it's that the hallucination fails to be distinguishable from the real thing. This is a tricky, negative account of phenomenology, and many philosophers find it unsatisfying.

  Your friend is sensing this difficulty and interpreting it as a failure of the theory. But a theory being difficult or counter-intuitive doesn't mean it concedes the opposing argument. It just means it's a high-stakes metaphysical gamble.

  ### The Verdict
  **You win the argument, but she wins the intuition.**

  *   **She is misunderstanding the theory:** She thinks disjunctivism accepts the Common Kind Assumption (that indistinguishable states must be the same kind). It doesn't. That is the whole point of the theory. Therefore, she is wrong that it "concedes" the Argument from Illusion. It dismantles the argument's logic.
  *   **She is right about the cost:** The price of saving Naive Realism via disjunctivism is accepting that two subjectively identical states are metaphysically distinct. That is a hard pill to swallow, and it leaves the epistemological worry ("But how do I *know* I'm in the good case?") untouched.

  Tell her this: Disjunctivism isn't trying to solve the problem of *knowledge* (how to tell the difference); it's trying to solve the problem of *nature* (what the experience is made of). She is attacking it for failing to solve an epistemological problem, when its job is to solve a metaphysical one. On its own terms, it does not concede.
