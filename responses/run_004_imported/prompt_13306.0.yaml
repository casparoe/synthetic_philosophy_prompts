          *   *Phrasing:* We don't need to speculate about where she is to know what she was to us.
      *   **Closing:** A send-off that respects her integrity.
          *   *Idea:* We miss the *unity* of her. We honor the *truth* she loved.

  4.  **Refining the Tone:**
      *   *Avoid:* "Qualia," "Combination Problem," "Macro-subject," "Fundamental Ontology."
      *   *Use:* "Inner life," "The fabric of the world," "Honesty," "Curiosity."
      *   *Emotional Arc:* Grief -> Appreciation of her mind -> Respect for her wishes -> Affirmation of her life.

