      *   **Priya's Position (Autonomy/Agency):**
          *   It's her body.
          *   She understands the risks.
          *   She values the outcome enough to endure the process.

  3.  **Identify Key Ethical Frameworks:**
      *   **Medical Necessity vs. Enhancement:** The traditional boundary of medicine. Is the goal to restore function to a norm or to exceed the norm?
      *   **Risk/Benefit Ratio:** The physical cost (pain, complications, time) vs. the psychosocial benefit.
      *   **Autonomy:** Does informed consent override medical paternalism?
      *   **Justice/Fairness:** Should society accommodate difference, or should individuals modify themselves to fit society? (The "Medical Model" vs. "Social Model" of disability).
      *   **The "Line Drawing" Problem:** Where do we stop? (e.g., nose job vs. leg breaking).

  4.  **Brainstorming the "Principled Line":**
      *   *Is it pathology?* No, because User argues social disadvantage exists regardless of pathology.
      *   *Is it risk?* Limb lengthening is high risk compared to rhinoplasty. This supports Marco.
      *   *Is it function?* Shortness isn't a functional impairment (usually), whereas a leg length discrepancy *is*.
      *   *Is it the "Normal Range"?* Growth hormones are often given to kids *within* the normal range but predicted to be very short. This weakens the "pathology" argument.
      *   *Is it Irreversibility/Severity?* Breaking healthy bone is qualitatively different from injecting filler.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate both Marco and the User. This isn't a simple "right/wrong."
      *   **Analyzing the User's Argument (The Consistency Point):**
          *   Acknowledge the strength: Growth hormone (GH) for idiopathic short stature *is* controversial and often driven by social norms, not just disease.
          *   The "Social Model" of disability: If society disables short people, is fixing the person or society the answer?
