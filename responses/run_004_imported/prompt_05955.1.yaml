      *   **Analyzing Marco's Argument (The Medical Integrity Point):**
          *   "First, do no harm." Breaking healthy bone violates the baseline of non-maleficence unless there's a compensating medical need.
          *   The Slippery Slope: If height is a disability, is ugliness? Is low IQ? Where does enhancement stop?
          *   Risk Profile: Limb lengthening has a high complication rate (nerve damage, non-union, infection). This distinguishes it from a nose job.
      *   **Finding the Principled Distinctions (Untangling the Knot):**
          *   *Distinction 1: Pathology vs. Preference.* (Weak, as GH shows).
          *   *Distinction 2: Risk/Benefit Proportionality.* (Stronger). Is the gain worth the trauma?
          *   *Distinction 3: Functional Restoration vs. Social Optimization.* Restoring gait vs. improving dating prospects.
          *   *Distinction 4: The "Normal Functioning" Account.* Medicine aims to keep you in the normal range, not push you to the top of it.
      *   **The Autonomy Factor:**
          *   Priya is an adult. She can consent. But does consent make it *ethical for the doctor*? (e.g., selling kidneys).
      *   **Synthesis/Conclusion:**
