          *   Key distinction: Relative error goes to zero, absolute error stays constant.
      *   **The Convergence Guarantee (The Good News):**
          *   SI converges to the truth *regardless* of the UTM (if truth is computable).
          *   Why? Because the *likelihood* of the data grows linearly with time, while the *prior* (complexity) is fixed. Eventually, Data > Prior.
          *   *Crucial nuance:* This doesn't mean the *ordering* of hypotheses stabilizes quickly. It means the *true* hypothesis eventually gets probability mass near 1.
      *   **The "Reasonable" UTM Problem (The Bad News):**
