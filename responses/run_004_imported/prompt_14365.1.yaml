          *   **Narrow Scope (Secondary Occurrence):** $\exists x (Kx \land \forall y (Ky \rightarrow y=x) \land \neg Bx)$. This reads: "There is a unique King of France, and he is not bald." This is **False**.
      *   **The Law of Excluded Middle:** LEM applies to propositions. Russell distinguishes between the *sentence* "The King of France is not bald" and the *proposition* expressed.
      *   **Strawson's Critique:** P.F. Strawson (in "On Referring") actually *does* make the argument the user is making. Strawson argues that if the presupposition (existence) fails, the statement is neither true nor false (a truth-value gap). This *would* violate bivalence/LEM in classical logic.
