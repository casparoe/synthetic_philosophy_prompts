prompt: |-
  So I've been down a rabbit hole and need a sanity check for something I'm writing. Every AI-risk explainer eventually makes the same move: because a rational agent can be Dutch-booked or money-pumped if its preferences are inconsistent, any sufficiently smart agent will end up acting like an expected-utility maximizer -- and therefore advanced AI will end up with one stable, single-minded goal it ruthlessly persues. It's always presented like a clean mathematical proof, but a couple philosophy people I've bugged about it say the argument leans hard on axioms (completeness especially) that aren't obviously required for rationality, and that "can technically be rationalized as maximizing some utility function" is doing way less work than "will behave like a single-minded optimizer." I cover science and AI for a living and honestly can't tell anymore if this is genuinely rigorous or just sounds rigorous. Can you write me an essay that actually weighs whether these coherence arguments succeed in showing rationality requires expected-utility maximization, and whether that really licenses the bigger claim about advanced AI? Don't hedge into mush at the end -- I need an actual verdict I can build a piece around.
