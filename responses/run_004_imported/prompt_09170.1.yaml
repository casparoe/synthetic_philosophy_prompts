answer: |-
  You have hit on a subtle but crucial point that often goes unaddressed in introductory physics. You are absolutely correct: Bell’s theorem mathematically rules out the conjunction of **Local Realism**. It proves that the world cannot be *both* local *and* real (in the sense of counterfactual definiteness).

  The theorem itself is indeed symmetric regarding these two assumptions. However, the physics community’s preference for the term "nonlocality" over "non-realism" is not merely a matter of taste; it is driven by historical context, the specific definitions of these terms in physics, and the operational needs of quantum information science.

  Here is why "nonlocality" has become the dominant terminology, despite the symmetry of the theorem.

  ### 1. The Definition of "Realism" is Philosophically Slippery
  "Locality" is a precise physical constraint derived from Special Relativity: no causal influence can travel faster than light. "Realism" (often formalized as Counterfactual Definiteness), however, is a philosophical stance regarding the existence of properties prior to measurement.

  Because "realism" is harder to define rigorously than "locality," it is often treated as a variable assumption rather than a fundamental law. If researchers concluded that "Realism is false," it sounds like a philosophical claim that the universe is subjective or illusory. By contrast, concluding that "Locality is false" (in the specific sense of Bell correlations) sounds like a discovery of a new physical phenomenon. Physicists generally prefer to frame discoveries as physical phenomena rather than philosophical shifts.

  ### 2. The Existence of Explicitly Non-Local Theories
  There is a major asymmetry in the available interpretations of quantum mechanics.
  *   **Non-Local Realism exists:** Bohmian Mechanics (Pilot Wave Theory) is a fully deterministic, "realist" theory that reproduces all quantum predictions. To do so, it *must* be explicitly non-local. The fact that a working model exists which sacrifices locality to save realism keeps the concept of non-locality alive as a viable physical description.
  *   **"Local Non-Realism" is the Standard View:** The standard Copenhagen interpretation effectively sacrifices realism (properties don't exist until measured) to preserve locality (no faster-than-light signaling). However, because this is the "default" view, it isn't usually labeled as a "research program" in the same way.

  Consequently, when researchers investigate alternatives to the standard view, they are often exploring how non-locality manifests, making it the active variable of study.

  ### 3. "Nonlocality" as an Operational Resource
  In fields like **device-independent cryptography**, the term "nonlocality" is used operationally, not ontologically. Researchers in this field do not necessarily claim the universe is non-local; rather, they use "nonlocality" as a label for a specific class of statistical correlations.

  *   **The Resource:** In quantum information, entanglement is a resource. The violation of a Bell inequality certifies that the correlations between particles cannot be explained by shared classical information (local hidden variables).
  *   **The Label:** To distinguish these "quantum" correlations from "classical" correlations, the field adopted the term "quantum nonlocality." It is shorthand for "correlations that violate local causality."

  In this context, saying a system exhibits "nonlocality" is similar to saying a car has "horsepower." It describes the capacity of the system to perform tasks (like secure key distribution) that are impossible for local systems, without necessarily making a claim about the fundamental nature of spacetime.

  ### 4. The "No-Signaling" Safety Net
  Finally, the term is safe to use because of the **No-Signaling Theorem**. While Bell's theorem implies a failure of *Local Causality* (the idea that events are only influenced by their immediate surroundings), Quantum Mechanics strictly obeys *Signal Locality* (you cannot use entanglement to send information faster than light).

  Because relativity is not actually violated in a way that allows for time travel or causality paradoxes, physicists feel comfortable using the term "nonlocality" to describe the correlations, knowing that the "hard" constraint of relativity (no signaling) remains intact.

  ### Summary
  Researchers are not necessarily claiming that "Locality" is the one true thing that failed. Rather, "nonlocality" has become the standard technical term because:
  1.  **Locality** is a better-defined physical concept than Realism.
  2.  **Bohmian Mechanics** proves that Non-Local Realism is a consistent physical model.
  3.  In **Quantum Information**, "nonlocality" is the name of the *resource* (entanglement) used for cryptography, distinct from its ontological implications.
