      *   **Reconstruction:** Formalize the argument clearly (P1, P2, P3...). Highlight the PSR connection. Mention the anti-materialism link (Incompleteness $\rightarrow$ Mind > Machine).
      *   **The Charitable Reading:** Why does this feel compelling? The intuition of fairness. The Platonist view that values are objective.
      *   **The Critique (The Meat):**
          1.  *Equivocation on Rationality:* Scientific order $\neq$ Moral purpose.
