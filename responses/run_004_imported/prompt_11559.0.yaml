answer: |-
  Here are 10 interview questions designed to progressively tighten the screws on the "complexity shield" argument, including the specific thematic requirements you requested.

  **1. The Thesis Statement**
  "Let's start with the core pitch. The Gibbard-Satterthwaite theorem tells us that every non-dictatorial voting rule is manipulable. Your counter-argument, broadly speaking, is that for rules like STV, finding that manipulation is NP-hard. So your defense is essentially: 'Manipulation you can't compute is manipulation that doesn't happen.' Is that a fair summary of the shield you're trying to raise?"

  *   **Follow-up:** "If I understand correctly, you're shifting the burden of proof. GS proves manipulation *exists*; you're arguing it's *inaccessible.'* But if the incentive structure exists, doesn't that distort behavior even if the optimal path is hidden?"

  **2. Existence vs. Computability**
  "I want to dig into that shift from existence to computability. Gibbard-Satterthwaite is a theorem about *incentives*, not algorithms. It says a voter *has* a reason to lie. If I'm a voter and I suspect a manipulation exists but I can't find it, do I vote truthfully? Or do I just become cynical about the process? Does 'hard to compute' actually neutralize the *incentive*, or does it just hide it?"

  *   **Follow-up:** "You might say voters are boundedly rational. But if the incentive is there, doesn't that invite intermediaries—campaigns, consultants, parties—to do the computing *for* them? Does the shield only work if voters are isolated atoms?"

  **3. Worst-Case vs. Average-Case**
  "Let's talk about the complexity class itself. NP-hardness is a *worst-case* guarantee. It says there *exists* a profile where manipulation is hard. But a bunch of literature—from Conitzer to Xia—suggests that under 'Impartial Culture' or realistic distributions, these problems are often easy 'almost always.' Are we protecting democracy based on pathological edge cases that never show up in real elections?"

  *   **Follow-up:** "If you argue 'Impartial Culture is unrealistic,' do we have empirical evidence that *real* political preference distributions are computationally hard? Or are we just assuming the real world is kind enough to be NP-hard?"

  **4. Approximate Manipulation**
  "Even if finding the *optimal* manipulation is hard, what about finding a *good enough* one? In computer science, we often settle for approximation algorithms. If a voter can run a heuristic that finds a manipulation capturing 90% of the possible utility gain in polynomial time, does the rule remain 'safe'? Or does the complexity shield crack if the manipulation doesn't have to be perfect, just profitable?"

  *   **Follow-up:** "If you say 'approximation is still hard,' isn't that an empirical claim about the specific voting rule? How do we know STV doesn't have a 'good enough' heuristic that works on 99% of real-world profiles?"

  **5. The Actor Problem (Parties vs. Individuals)**
  "We've been talking about individual voters. But elections aren't fought by individuals; they're fought by coalitions and parties. A political party has the budget to run exponential-time algorithms. If the complexity shield relies on the voter's laptop burning out, doesn't it evaporate the moment a well-funded campaign decides to treat the election as an optimization problem?"

  *   **Follow-up:** "You might say 'we can regulate parties.' But if the vulnerability is in the math, doesn't relying on regulation just mean we're patching a software bug with a law? Why not just use a rule that isn't manipulable by a coalition?"

  **6. Strategic Avenues Beyond Voting**
  "Your work focuses heavily on strategic *voting*. But what about strategic *entry*? If I'm a party, I might not need to compute a complex ballot if I can just clone a candidate to split the vote, or control the agenda to keep certain options off the table. Does your complexity shield cover candidate entry and agenda control? If not, why protect the ballot box but leave the menu exposed?"

  *   **Follow-up:** "If you say 'that's a different model,' isn't that convenient? If a strategic actor can choose between manipulating a ballot (hard) and manipulating the candidate set (easy), doesn't the complexity of the ballot become irrelevant?"

  **7. Information and Uncertainty**
  "Most complexity results assume the manipulator knows the full profile of other votes. In reality, voters operate under uncertainty. But we also have polling. As polling becomes more granular and real-time, the 'uncertainty' shield shrinks. If a campaign can treat poll data as a known profile, does the complexity of manipulation drop significantly? Are we relying on fog to protect the system?"

  *   **Follow-up:** "If you argue 'polls are noisy,' isn't that just another average-case argument? If the noise is low enough, does the NP-hardness return, or does the problem become tractable in expectation?"

  **8. Algorithmic Progress**
  "Complexity is a moving target. Problems once thought intractable are often tamed by better SAT solvers or parameterized algorithms. If we adopt a voting rule *because* it's hard to manipulate today, aren't we building a system that degrades over time as computer science advances? Are you designing for robustness, or just for the current state of solver technology?"

  *   **Follow-up:** "If you say 'P is not NP,' that's a asymptotic limit. But in practice, constant factors matter. If solver speed doubles every year, how long does your 'safe' voting rule last before it becomes transparent?"

  **9. Security Through Obscurity**
  "There's a normative worry here. Relying on complexity feels like 'security through obscurity.' If the system is only stable because voters *don't understand* how to game it, what happens when the mechanism is taught in schools or explained in the media? Does the act of publishing your own research—explaining where the hardness lies—actually undermine the stability you're trying to protect?"

  *   **Follow-up:** "If you say 'understanding the theory doesn't give you the specific profile,' isn't that the same as saying 'knowing locks exist doesn't give you a key'? But if you tell them the lock is pickable, just hard, doesn't that encourage them to try harder?"

  **10. The LLM Endgame**
  "Finally, I want to fast forward. We are approaching a world where every voter has an LLM or a specialized agent in their pocket. If I can snap a picture of a ballot, input my preferences, and have an app tell me the strategic vote instantly, the cost of computation drops to zero. At that point, does the computational social choice defense collapse entirely? If computation becomes free, is Gibbard-Satterthwaite back in full force?"

  *   **Follow-up:** "If you say 'voters won't trust the app,' consider that they already trust navigation apps to route them optimally. If the stakes are high enough, why wouldn't they trust the 'Vote Optimizer'? And if they do, is your whole research program just a stopgap measure?"
