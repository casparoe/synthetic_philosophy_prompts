answer: |-
  This is one of the most persistent and fertile tensions in moral philosophy. You have correctly identified that the literature is not just a list of competing solutions, but a dialectic where every solution seems to purchase its clarity at the cost of some other intuitive datum.

  To give you the "gut-level diagnosis" you are asking for: **No, the puzzle does not genuinely dissolve on any route.** Instead, the disagreement reveals a fault line in how we understand the metaphysics of agency itself. The "puzzle" resurfaces because it asks for a causal or reductive explanation of a phenomenon that might be foundational.

  Here is my read on the dialectic, moving from the reductive attempts to the non-reductive ones, and ending with where the real philosophical blood is being spilled.

  ### 1. The Reductive Strategies: Dissolving the Magic by Denying It
  The Practice (Hume/Rawls) and Expectation (Scanlon) accounts share a common strategy: they try to explain promising without positing a special "normative power." They want to naturalize the obligation.

  **The Practice View (Hume/Rawls)**
  This view treats the obligation as institutional. Just as a checkmate creates a "duty" to resign only within the practice of chess, a promise creates a duty only within the practice of promising.
  *   **The Win:** It removes the metaphysical magic. Sounds don't create duties; social conventions do.
  *   **The Cost:** As you noted, it fails the "isolated promise" test. If I make a deathbed promise to a hermit who will never tell anyone, the "practice" gains no utility, and no reliance is generated. Yet, intuitively, I am still bound.
  *   **Diagnosis:** This view dissolves Prichard's puzzle by **changing the subject**. It explains why we *feel* bound in social contexts, but it cannot explain why we *are* bound in private ones. It reduces the moral obligation to a sociological fact. If you accept this, you have to admit that the deathbed promisor isn't actually morally obligated, only socially pressured. If that violates your moral intuition, this theory fails.

  **The Expectation View (Scanlon)**
  Scanlon tries to save the moral force without the magic. He argues that breaking a promise is wrong because it violates a general principle against manipulating expectations (Principle F).
  *   **The Win:** It grounds the obligation in general morality (don't lie/manipulate) rather than a mysterious special rule.
  *   **The Cost:** It turns promising into a species of deception. But promising feels distinct from merely raising an expectation. If I tell you "I will probably come," I raise an expectation. If I say "I promise," I give you a **right** to demand performance. Scanlon explains the *wrongness of breaking*, but he struggles to explain the **transfer of authority**. Why does the promisee get to *release* me from the duty? On Scanlon's view, I've wronged the moral law by disappointing you; why can *you* forgive that?
  *   **Diagnosis:** This view dissolves the puzzle by **flattening** the normative landscape. It makes promising less mysterious, but also less powerful. It captures the "don't be a jerk" aspect but misses the "you now have authority over my will" aspect.

  ### 2. The Volitional Strategies: Accepting the Magic as a Feature
  The Normative Power (Raz/Owens) and Joint Commitment (Gilbert) accounts stop trying to reduce the obligation to something else. They argue that the capacity to bind oneself is a brute fact of rational agency.

  **The Normative Power View (Raz/Owens)**
  This view bites the bullet: Yes, the will can create obligations. That is what it means to be an agent.
  *   **The Win:** It captures the full phenomenology. It explains the deathbed promise (the power exists regardless of audience) and the release condition (if I created the bond, I can conceptually understand how the other party might dissolve it).
  *   **The Cost:** As you suspected, it risks circularity. "Why am I bound?" "Because you exercised your power to bind." "How does that work?" "It's a normative power." It looks like labeling the mystery rather than solving it.
  *   **Diagnosis:** This view dissolves the puzzle by **relocating** it. It says the mystery isn't in promising; the mystery is in *agency*. If you accept that humans have the capacity to change their normative status by willing it (like legislating for oneself), promising is no longer magical—it's just an exercise of that capacity. But if you don't already believe in that capacity, this offers no proof.

  **The Joint Commitment View (Gilbert)**
  Gilbert refines the Power view by making it bilateral. The obligation doesn't come from *my* will alone, but from *our* pooled will.
  *   **The Win:** It explains the "directedness" of the obligation better than Raz. I am not just bound; I am bound *to you*. This explains why only you can release me.
  *   **The Cost:** It pushes the magic back one step. How do two wills "pool"? If my will can't bind me, how can two wills bind us? It requires a pre-existing normative framework that recognizes "joint commitments" as binding.
  *   **Diagnosis:** This is the most robust version of the Volitionalist view, but it still rests on the same foundational claim: that human interaction can generate *sui generis* normative facts.

  ### 3. The Gut-Level Diagnosis: Where the Real Disagreement Lies

  You asked if the puzzle resurfaces in a different guise. **Yes, it does.** But that is because Prichard's Puzzle is not actually a puzzle about promising. **It is a puzzle about the Source of Normativity.**

  The real disagreement is between **Normative Naturalists** (Hume, Scanlon) and **Normative Voluntarists** (Raz, Gilbert, Owens).

  1.  **The Naturalist Claim:** Normativity must come from *outside* the will (consequences, social practices, general moral principles). The will is a subject of norms, not a source of them. For this camp, Prichard is right to be skeptical: the will *cannot* conjure obligation. Therefore, promising must be explained away as something else (reliance, utility).
      *   *The Price:* They must deny the intuition that isolated promises bind. They have to say the deathbed promisor is under no strict obligation, only a general duty not to disappoint.

  2.  **The Voluntarist Claim:** The will is partly constitutive of normativity. To be a free agent *just is* to have the power to change one's normative position. For this camp, Prichard's Puzzle is a category error. It asks for a causal mechanism (how do words make duty?) for a normative fact (I am bound).
      *   *The Price:* They must accept a "brute" fact about agency that cannot be further analyzed without circularity. They have to say, "It is just a feature of rational beings that they can bind themselves."

  ### My Verdict

  Does any theory dissolve the puzzle? **Only if you are willing to sacrifice a core intuition.**

  *   If you care more about **metaphysical parsimony** (no magic powers), you must choose Scanlon or Hume. But then you must admit that the "obligation" of promising is an illusion generated by reliance or convention. The puzzle dissolves because the phenomenon it describes (a self-created duty) doesn't exist.
  *   If you care more about **moral phenomenology** (the feeling that a deathbed promise *really binds*), you must choose Raz or Gilbert. But then the puzzle remains as a brute fact. You haven't explained *how* the will binds; you have asserted that it *does*.

  **The Diagnosis:** The literature stalls because both sides are talking past each other about the **architecture of reason**.
  The Reductionists assume that for an obligation to be real, it must be grounded in something *other* than the obligation itself (e.g., welfare, truth-telling).
  The Voluntarists assume that the capacity to create obligations is a precondition of autonomy, not something that needs to be derived from autonomy.

  **My Read:** The Voluntarists (Raz/Gilbert) are closer to the truth, but they are honest enough to admit they aren't "solving" the puzzle in a reductive sense. They are identifying a **foundational normative power**. Prichard's Puzzle feels like a mystery only if you assume that all normativity must be external to the agent. If you accept that agency includes the power to legislate for oneself (a Kantian insight), the "magic" disappears. It isn't magic; it's **jurisdiction**.

  Just as a legislature can create a law by voting, an agent can create an obligation by promising. Asking "how does voting create law?" is similar to "how does promising create duty?" The answer isn't a physical mechanism; it's a status function.

  So, the puzzle resurfaces only if you refuse to accept that human beings have normative jurisdiction over themselves. If you grant that, the puzzle dissolves, not because we found a mechanism, but because we recognized the question was asking for a causal explanation of a normative status. The "mystery" is the price of admission for taking autonomy seriously.
