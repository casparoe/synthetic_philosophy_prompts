  6.  **Final Polish:** Ensure the tone is conversational yet rigorous. Avoid neutral listing. Take a stance on the *dialectic*. (The stance: The puzzle persists because it targets the boundary of explanation. The "solution" depends on whether you think agency is normative or natural.)

