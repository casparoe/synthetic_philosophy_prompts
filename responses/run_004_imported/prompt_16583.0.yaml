      *   *Section 3: The Gut-Level Diagnosis.* Where is the real fight? It's about the **Architecture of Normativity**.
          *   Is morality a web of external constraints (consequences/practices)?
          *   Or is morality partly constituted by our agency's power to shape those constraints?
      *   *Conclusion:* The puzzle doesn't disappear; it moves. If you hate magic, go Scanlon. If you hate losing the distinctness of promising, go Raz. But the "how" remains a brute fact of either social existence or rational agency.
      *   *Refinement on Gilbert:* Make sure to distinguish her from Raz. Raz is unilateral power; Gilbert is bilateral pool of will. Gilbert handles the "owed to" aspect better.
      *   *Refinement on Prichard:* Prichard actually thought the obligation *couldn't* come from the will alone (he wanted a desire-based or external ground). So the "Prichard's Puzzle" label is often used to describe the problem he raised, even if his solution was different. I should clarify that the "Power" view is actually the *anti-Prichard* solution to Prichard's Puzzle. (Wait, let's check: Prichard argued promising *cannot* create obligation by will alone. So the "Normative Power" view is explicitly rejecting Prichard's conclusion while addressing his puzzle. I need to be careful not to attribute the Power view to Prichard).
