          *   *Diagnosis:* It dissolves the *metaphysical* mystery (it's just a social fact) but creates a *moral* gap. Why follow the game? If the utility disappears (no reliance), the obligation vanishes. But intuitively, the obligation remains. So, it solves "how" (convention) but fails "why" (moral force in edge cases).

      *   **Expectation-Based (Scanlon):**
