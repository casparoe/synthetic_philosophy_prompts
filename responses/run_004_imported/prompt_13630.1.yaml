prompt: |-
  I sit on my state's parole board. Every inmate's file now arrives with an actuarial score, produced by a risk-assessment instrument the board adopted last year, that estimates his probability of reoffending within three years by locating him within a comparison group drawn from historical release data. The case forcing us to revisit our policy on these scores involves an inmate at whose hearing his attorney and his victim's family each submitted a different breakdown of that same underlying dataset: the attorney's version narrows the comparison group by offense type, age, and program completion to arrive at a 6 percent risk (though that group contains only seventeen people); the family's version uses the full statewide release cohort for his offense category to arrive at 38 percent; and the instrument's own default output, based on a mid-level grouping, says 24 percent. All three figures were computed correctly from the same real data; they simply disagree, and the hearing panel had no principled basis for treating any one of them as "the" inmate's actual risk rather than the others. The board is now split three ways: defer always to whichever comparison group is narrowest, on the theory that more specific is more accurate; abandon these scores altogether and return to the panel's own clinical impression of the man in the room (though one member points out — rightly, I think — that unstructured clinical judgment has its own long and well-documented record of doing worse than actuarial tools at exactly this kind of prediction); or find some third approach.

  Please draft the memo I will circulate before we vote on the 14th. It should recommend, with reasons, how this inmate's case ought to be resolved given the conflicting figures, and it should propose a standing policy for how the board is to handle risk scores whenever a case admits more than one defensible comparison group, since this dispute is certain to recur. I would like the memo to take seriously the possibility that there may be no principled way, even in principle, to single out the "correct" comparison group for a given individual, rather than treating this as a data-quality problem that a bigger dataset would eventually fix, while still arriving at a recommendation the board can actually act on this month.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a state parole board.
      *   **Audience:** Other board members (colleagues).
      *   **Task:** Draft a memo to circulate before a vote on the 14th.
      *   **Subject:** How to resolve a specific inmate's case involving conflicting actuarial risk scores (6%, 24%, 38%) and propose a standing policy for future cases.
      *   **Key Constraints/Requirements:**
          *   Must recommend a resolution for the *current* inmate.
          *   Must propose a *standing policy* for handling multiple defensible comparison groups.
          *   Must take seriously the philosophical/epistemological problem: there may be *no* single "correct" comparison group (reference class problem), not just a data quality issue.
          *   Must be actionable *this month* (practical).
          *   Must acknowledge the limitations of unstructured clinical judgment (it's worse than actuarial tools).
          *   Must avoid simply deferring to the narrowest group (small sample size issue) or the broadest group (heterogeneity issue).

  2.  **Deconstruct the Problem:**
      *   **The Core Issue:** The Reference Class Problem. An individual belongs to many overlapping classes (age, crime, program completion, etc.). Different classes yield different probabilities. There is no metaphysical "true" probability for a single event (recidivism) for a specific individual.
      *   **The Specific Case:**
          *   Attorney: 6% (Narrow, $N=17$). High specificity, high variance/unreliability due to small $N$.
          *   Instrument Default: 24% (Mid-level). Balanced, validated.
          *   Victim's Family: 38% (Broad). High $N$, but potentially ignores relevant mitigating factors (program completion).
      *   **The Options:**
          1.  Narrowest (Specific): Risk of statistical noise/overfitting.
          2.  Abandon Scores (Clinical): Risk of bias, inconsistency, lower accuracy.
          3.  Third Approach: Needed.

  3.  **Develop the "Third Approach" (Policy Recommendation):**
      *   *Philosophical Stance:* Acknowledge that risk is not an intrinsic property of the inmate but a relationship between the inmate and a population. Therefore, the score is *evidence*, not a *verdict*.
      *   *Practical Solution:* We need a hierarchy of reliability, not just specificity.
      *   *Minimum Sample Size:* The 6% figure is statistically suspect because $N=17$. We need a threshold for stability.
      *   *Relevance:* The 38% figure ignores program completion, which is dynamic and relevant.
      *   *The "Default" with Adjustment:* The instrument's default (24%) is likely the most validated. However, we need a way to incorporate the *direction* of the other data without accepting the *magnitude* of the unreliable data.
      *   *Policy Proposal:* Use the validated instrument's default as the baseline. Allow deviations *only* if the alternative comparison group meets minimum statistical power (e.g., $N > 50$ or confidence intervals provided) AND theoretical relevance. If conflicting valid groups exist, use the conservative estimate (public safety) OR the average, but explicitly state the uncertainty.
      *   *Better Policy:* "Structured Professional Judgment." Use the actuarial score as the anchor, but allow adjustment based on *static* factors that the model might miss, provided they are documented. But the prompt asks specifically about *comparison groups*.
      *   *Refined Policy:* Adopt a "Stability Threshold." Any comparison group used for decision-making must meet a minimum sample size to ensure statistical reliability. If multiple groups meet the threshold, use the one most theoretically relevant to *current* risk (dynamic factors), or average them.
      *   *For the specific inmate:* The 6% group is too small ($N=17$). The 38% group ignores rehabilitation. The 24% is the validated default. However, the *direction* of the attorney's data (lower risk) is supported by program completion. The *direction* of the family's data (higher risk) is supported by the base rate.
      *   *Decision:* Stick with the 24% as the primary evidentiary weight, but acknowledge the uncertainty range (6-38%). Do not grant parole based on 6%, do not deny solely based on 38%. Treat 24% as the anchor.
      *   *Wait, a more nuanced approach:* If we admit there is no "true" score, we should treat the score as a *range* of risk rather than a point estimate. The policy should require reporting the *range* of plausible risks from defensible classes, not picking one.
      *   *Actionable Recommendation:* For this inmate, the 24% is the only statistically validated figure. The 6% is anecdotal due to sample size. The 38% is over-inclusive. We proceed on the 24%, but acknowledge the mitigation of program completion qualitatively.
      *   *Standing Policy:* 1. Minimum sample size for any alternative class. 2. Priority to classes including dynamic (changeable) factors over static ones. 3. If conflict remains, present the range to the board, requiring a supermajority to deviate from the validated default.

  4.  **Drafting the Memo - Tone and Structure:**
      *   **Tone:** Professional, deliberative, legally sound, philosophically grounded but practical.
      *   **Structure:**
          *   Header (To, From, Date, Subject).
          *   Purpose.
          *   The Immediate Case (Resolution).
          *   The Underlying Problem (Reference Class).
          *   Proposed Standing Policy.
          *   Conclusion/Call to Vote.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is suggesting we stick with the 24% just kicking the can?
      *   *Correction:* No, because the 6% is statistically unreliable ($N=17$ is too small for robust probability). The 38% ignores relevant mitigation. The 24% is the *validated* tool. The policy needs to explain *why* we don't just pick the narrowest.
      *   *Philosophical Point:* I need to make sure I don't imply bigger data will fix it. The memo must state that even with perfect data, an individual belongs to multiple classes.
      *   *Actionability:* The policy needs to be a rule the board can follow next week. "Minimum N" is a good rule. "Dynamic factors prioritized" is a good rule.

  6.  **Finalizing the Recommendations:**
      *   **Inmate:** Deny/Grant? The prompt doesn't say what the threshold for parole is. I should focus on *how to weigh the score*, not necessarily the outcome (unless implied). Actually, the prompt asks "how this inmate's case ought to be resolved." I need to make a call. Usually, 24% is moderate. 6% is low. 38% is high. If the threshold is, say, 30%, the 24% suggests release. If the threshold is 20%, it suggests denial. I will assume the board needs to weigh the risk. I will recommend treating the 24% as the presumptive evidence, acknowledging the 6% as qualitative mitigation (program completion) but rejecting it as a quantitative figure due to sample size.
      *   **Policy:** 1. Validated Instrument Default is the Baseline. 2. Alternative Classes allowed only if $N \ge X$ (e.g., 50). 3. Dynamic factors (program completion) trump static factors (offense type) when sample sizes are adequate. 4. If valid conflict remains, disclose the range and require a supermajority to deviate from the default.

  7.  **Writing the Memo:** (Incorporating the "Reference Class Problem" explicitly but accessibly).
      *   *Opening:* Acknowledge the difficulty.
      *   *Analysis:* Explain why all three numbers are "correct" yet incompatible.
      *   *Decision:* For the inmate, use the 24% but contextualize.
      *   *Policy:* Formalize the "Stability and Relevance" test.

  8.  **Review against constraints:**
      *   Vote on the 14th? Yes, date accordingly.
      *   Serious about "no principled way"? Yes, address the reference class problem.
      *   Actionable? Yes, specific criteria for alternative groups.
      *   Clinical judgment warning? Yes, include the caveat about unstructured judgment.

  9.  **Final Polish:** Ensure the tone is respectful of the victim's family and the attorney's arguments while maintaining statistical rigor. (Self-correction: Ensure I don't sound like I'm dismissing the victim's family, but rather addressing the statistical validity of their data presentation).

  *(Self-Correction on the "Decision"):* I shouldn't necessarily say "Grant Parole" or "Deny Parole" because I don't know the statutory threshold. I should recommend *how to weigh the risk assessment* in the decision. However, the prompt asks "how this inmate's case ought to be resolved." I will recommend a decision based on the 24% figure being the most reliable, while noting that program completion (the driver of the 6%) should be weighed as a separate positive factor, not as a 6% probability.

  Let's refine the policy: "The Validated Default Presumption." Unless an alternative grouping meets strict statistical power and relevance criteria, the instrument's default output stands. This prevents "shopping" for scores.

  Okay, ready to draft.cw
answer: |-
  **MEMORANDUM**

  **TO:** Members of the State Parole Board
  **FROM:** [Your Name], Board Member
  **DATE:** [Current Date]
  **SUBJECT:** Resolution of Case #8940 and Standing Policy on Actuarial Risk Scores
  **VOTE DATE:** 14th of this Month

  ### I. Purpose

  This memo addresses the impasse regarding Case #8940, in which three conflicting actuarial risk scores (6%, 24%, and 38%) have been submitted based on the same underlying data. More broadly, it proposes a standing policy for how this Board shall interpret risk-assessment instruments when multiple defensible comparison groups yield divergent probabilities. Our goal is to resolve the immediate case fairly while establishing a principled framework for future hearings, acknowledging that this conflict is inherent to the nature of statistical prediction, not merely a temporary data deficit.

  ### II. The Immediate Case: Case #8940

  **Recommendation:** The Board should treat the instrument's default output (24%) as the presumptive evidentiary baseline for this inmate's risk level. We should not treat the 6% figure as a statistically valid probability, nor should we rely on the 38% figure as the sole determinant of risk.

  **Reasoning:**
  While all three figures were calculated correctly, they suffer from different validity threats:

  1.  **The 6% Figure (Attorney):** This relies on a comparison group of $N=17$. In statistical terms, this sample size is too small to generate a stable probability estimate. A single recidivist event in that group would swing the risk estimate by nearly six percentage points. While this figure correctly identifies that the inmate completed rehabilitation programs, it quantifies that mitigation with false precision.
  2.  **The 38% Figure (Victim's Family):** This relies on the broadest cohort. While statistically stable due to sample size, it ignores dynamic, mitigating factors (program completion) that are empirically linked to reduced recidivism. It treats the inmate as a static member of an offense category rather than an individual who has changed.
  3.  **The 24% Figure (Instrument Default):** This represents the validated balance struck by the instrument's developers. It utilizes a comparison group large enough to ensure stability while incorporating the most relevant static and dynamic factors available in the standard model.

  **Resolution:**
  We should proceed on the basis of the 24% risk estimate. However, to honor the valid insight within the attorney's argument, the Board should explicitly weigh the inmate's *program completion* as a distinct, qualitative mitigating factor in our written findings, separate from the actuarial score. We acknowledge the *direction* of the 6% figure (lower risk) without accepting its *magnitude* as statistically reliable. This avoids the pitfall of unstructured clinical judgment by keeping the actuarial anchor in place, while allowing us to respond to evidence of rehabilitation.

  ### III. The Underlying Problem: The Reference Class

  We must recognize that the conflict in Case #8940 is not an anomaly to be solved by better data. It is an instance of the **Reference Class Problem**. An individual belongs to infinite overlapping classes (e.g., "males," "males under 40," "males under 40 who completed therapy"). Each class yields a different frequency of recidivism. There is no metaphysical "true" risk percentage for a single individual; there is only the risk relative to a chosen group.

  Therefore, seeking the "correct" score is a category error. Our task is not to find the *true* risk, but to select the *most policy-relevant* and *statistically reliable* comparison group for decision-making. We cannot wait for a dataset that resolves this, because the problem is logical, not empirical.

  ### IV. Proposed Standing Policy

  To ensure consistency and fairness in future hearings where parties submit alternative risk breakdowns, I propose the adoption of the **"Stability and Relevance Standard."**

  **1. Presumption of the Validated Default**
  The output generated by the Board's adopted instrument, using its standard comparison groups, shall serve as the presumptive risk assessment. This preserves the predictive accuracy of actuarial tools over unstructured clinical judgment, which literature consistently shows is inferior in forecasting recidivism.

  **2. Threshold for Alternative Comparison Groups**
  Parties seeking to introduce an alternative risk percentage based on a different comparison group must demonstrate that the alternative group meets two criteria:
  *   **Statistical Stability:** The comparison group must contain a minimum sample size (e.g., $N \ge 50$) to ensure the probability estimate is not driven by statistical noise. Figures derived from groups smaller than this threshold may be argued qualitatively but cannot be entered as quantitative evidence.
  *   **Theoretical Relevance:** The factors defining the group must be empirically linked to recidivism risk. (e.g., "program completion" is relevant; "zodiac sign" is not).

  **3. Handling Valid Conflicts**
  If an alternative comparison group meets both the Stability and Relevance thresholds and yields a significantly different risk estimate than the default:
  *   Both figures shall be entered into the record as a **Risk Range**.
  *   The Board shall not average the scores.
  *   To deviate from the instrument's default output in favor of an alternative valid score, a **supermajority vote (4 out of 5 members)** shall be required. This ensures that deviations from the validated tool are deliberate and consensual, guarding against arbitrary decision-making.

  **4. Prohibition on "Score Shopping"**
  Counsel and stakeholders are notified that submitting multiple conflicting breakdowns from the same dataset without meeting the Stability Threshold may be deemed an attempt to obscure rather than clarify risk. The Board reserves the right to disregard quantitative claims that fail the Stability Threshold.

  ### V. Conclusion

  This policy accepts that risk assessment is an tool for informing judgment, not a substitute for it. By anchoring our decisions in statistically stable defaults while allowing for rigorously vetted alternatives, we protect public safety without ignoring evidence of rehabilitation. We avoid the illusion that we can know the "true" risk of an individual, while still making decisions that are consistent, defensible, and fair.

  I request that we discuss this framework at our session on the 12th and vote to adopt it as standing policy on the 14th, applying it immediately to the resolution of Case #8940.

  Respectfully,

  [Your Name]
  State Parole Board
