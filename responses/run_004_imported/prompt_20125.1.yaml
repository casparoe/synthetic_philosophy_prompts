prompt: |-
  Been on a bit of a decision theory kick lately after re-reading some of Wei Dai's old posts on UDT and skimming the Arbital page on it, and I think I've finally wrapped my head around it, but I want to sanity check the core idea before I go around repeating it to people. As I understand it, the whole point of "updateless" decision theory is that the agent precommits to just never update on evidence at all -- it acts purely off its prior forever, which is exactly why its willing to pay up in Counterfactual Mugging even after Omega tells it the coin landed tails. Basically the agent hears the bad news, shrugs, goes "nope, sticking with my 50/50 prior," and pays the $100 anyway, treating the actual observation as basically irrelevant noise it's not allowed to react to.

  Me and a couple people from my meetup's decision theory reading group got into an argument about this last week though. One guy insisted a UDT agent would still switch doors in the Monty Hall problem after the host reveals a goat, which confused me, because isnt switching doors literally just Bayesian updating on new information? If UDT agents are allowed to do that kind of updating, I don't get what's actually "updateless" about them, or why UDT gets treated as such a huge departure from EDT/CDT instead of just being CDT/EDT with extra steps and cooler thought experiments attached. Is "updateless" secretly referring to some narrow technical sense that doesn't really mean what it sounds like it means, and if so why does everyone on LW act like this is such a profound, cutting edge idea?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Misconception:**
      *   **Core Belief:** The user thinks Updateless Decision Theory (UDT) means an agent *never* updates on evidence/observations. They believe the agent acts purely on its prior forever, ignoring new information (like the coin landing tails in Counterfactual Mugging).
      *   **Conflict:** The user's friend claims a UDT agent *would* switch doors in Monty Hall. The user thinks this contradicts the "no updating" rule because switching requires Bayesian updating.
      *   **Question:** Is "updateless" a technical term that doesn't mean what it sounds like? Why is it considered profound if it's just CDT/EDT with extra steps?
      *   **Tone:** The user is intellectually curious, has done some reading (Wei Dai, Arbital), but has hit a conceptual wall. They are skeptical of the hype ("cooler thought experiments attached").

  2.  **Identify the Truth:**
      *   The user's understanding of "updateless" is **incorrect**. UDT does *not* mean ignoring observations.
      *   UDT means optimizing the *policy* (mapping from observations to actions) based on the prior, *before* receiving observations.
      *   Once the policy is set, the agent *does* use observations to select the action prescribed by the policy.
      *   In Counterfactual Mugging: The optimal policy (from the prior perspective) is "Pay if Tails, Ask if Heads." When the agent sees Tails, it follows the policy. It doesn't re-calculate expected utility *conditional on Tails* (which would say "Don't Pay"); it executes the plan made when the probability was 50/50.
      *   In Monty Hall: The optimal policy (from the prior perspective) is "If Host shows Door 3, Switch to Door 2." The agent observes Door 3, then switches. This *looks* like updating, but the *decision rule* was fixed upstream.
      *   **Key Distinction:** Updating beliefs vs. Updating decision policies. UDT updates beliefs (to know where it is in the world) but does not update its *goal function/policy selection criteria* based on that information.

  3.  **Structure the Response:**
      *   **Validate and Correct:** Acknowledge the user's effort (Wei Dai/Arbital is hard) but clearly state that their core understanding is wrong. This is the most important part.
      *   **Define "Updateless" Properly:** Explain that it's about *policy optimization* vs. *action optimization*.
          *   CDT/EDT: Choose action $A$ to maximize $E[U|A, \text{observations}]$.
          *   UDT: Choose policy $\pi$ (function from observations to actions) to maximize $E[U|\pi]$ *before* observations, then execute $\pi(\text{observations})$.
      *   **Address Counterfactual Mugging:** Explain why the agent pays. It's not ignoring the coin flip; it's honoring the precommitment that made the deal favorable ex-ante.
      *   **Address Monty Hall:** Explain why the friend is right. UDT agents switch. Explain *why* this isn't a contradiction (the policy accounts for the host's behavior).
      *   **Explain the "Profound" Part:** Why does this matter?
          *   Time Consistency.
          *   Newcomb's Problem / Parfit's Hitchhiker.
          *   Coordination with counterfactual selves (logical correlation).
          *   It solves problems where "updating" leads to dynamic inconsistency.
      *   **Tone Check:** Keep it respectful, precise, and slightly conversational (matching the user's style). Avoid overly dense math, focus on the conceptual shift.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Correction:* Start by saying "You have the right intuition that it sounds weird, but the definition is off."
      *   *The "Update" distinction:* Distinguish between updating *beliefs* (knowing what day it is, what card was drawn) and updating *decision criteria*. UDT agents update beliefs to know which branch of the policy tree they are on.
      *   *Monty Hall:* The policy is "Always Switch." The observation tells you *which* door to switch to (or confirms the host opened a specific one), but the *strategy* was decided beforehand. Actually, in standard Monty Hall, the policy is just "Switch." The observation confirms the host fulfilled his contract.
      *   *Counterfactual Mugging:* This is the crux. If you update on "Tails," the expected utility of paying is negative. If you don't update (i.e., stick to the ex-ante policy), the expected utility of the *policy* "Pay if Tails" is positive because it enables the "Win if Heads" branch.
      *   *Why it matters:* It's about reflecting on *how* you decide, not just *what* you decide. It handles logical uncertainty and acausal trade.
      *   *Analogy:* Think of it like writing a computer program before you enter the room vs. deciding what to do once you're in the room.

  5.  **Refining the Explanation of "Updateless":**
      *   It's not "I ignore evidence."
      *   It's "I choose the function $f(\text{evidence}) \rightarrow \text{action}$ that maximizes expected utility according to my prior, then I compute $f(\text{current evidence})$."
      *   So, evidence *is* used, but it's an input to the function, not a trigger to re-optimize the function.

  6.  **Addressing the "Hype":**
      *   Why is it a big deal? Because standard decision theories fail at Newcomb's, Parfit's Hitchhiker, and especially in multi-agent scenarios (Prisoner's Dilemma with identical source code). UDT (and its successors like FDT) handle these by treating the decision as a logical fact rather than a physical causal event.

  7.  **Final Review:** Does this directly answer the prompt? Yes. Does it correct the misconception without being condescending? Yes. Does it explain the Monty Hall disagreement? Yes.

      *(Self-Correction during drafting)*: I should be careful not to conflate UDT with Functional Decision Theory (FDT) too much, though they are closely related. Stick to UDT terminology as requested. Also, make sure to emphasize that UDT agents *do* condition on observations, just not for the purpose of *selecting the policy*.

      *Wait, one nuance:* In Monty Hall, does the UDT agent "update"? It conditions on the observation to execute the policy. The user thinks "updating" means changing probabilities. UDT agents *do* change their subjective probabilities about the world state (they know the car isn't behind the opened door). What they don't do is change the *criterion* for what counts as a good decision. I need to make this distinction very clear.

      *Revised plan:*
      1. Direct correction: You are misunderstanding "updateless."
      2. The Technical Definition: Policy selection vs. Action selection.
      3. Monty Hall: Why the friend is right.
      4. Counterfactual Mugging: Why it pays (ex-ante optimality).
      5. Why it's profound: Time consistency, logical correlation.

  8.  **Final Polish:** Ensure the tone is encouraging. Decision theory is hard. Wei Dai's posts are dense. It's a common stumbling block.

      *(Final check on Monty Hall)*: In Monty Hall, the observation "Host opened Door 3" gives information. A UDT agent uses that information to execute the "Switch" policy. An agent that *truly* ignored evidence (as the user thought) would stick with Door 1 randomly or arbitrarily. The friend is right. The user's definition of UDT describes an agent that is *blind*, not updateless.

      Okay, ready to write.s
answer: |-
  You have stumbled onto the single most common misconception about Updateless Decision Theory (UDT). It is an extremely easy trap to fall into because the name is misleading, and the intuition you described ("ignore evidence and stick to the prior") feels like the only way to make sense of the Counterfactual Mugging payoff.

  But here is the hard truth: **Your understanding of UDT is incorrect.** If an agent literally never updated on evidence, it would be blind and useless. Your friend from the reading group is right: a UDT agent absolutely switches doors in Monty Hall.

  Here is the sanity check you asked for, breaking down what "updateless" actually means, why your friend is right, and why this is considered a profound shift rather than just "CDT with extra steps."

  ### 1. The Core Correction: Policy vs. Action

  The confusion comes from *what* is being updated.

  *   **Standard Decision Theories (CDT/EDT):** When you receive new information, you update your beliefs about the world, and then you ask: *"Given what I now know, which **action** maximizes my expected utility?"*
  *   **Updateless Decision Theory (UDT):** Before you receive any information (behind the "veil of ignorance"), you calculate which **policy** (a function mapping observations to actions) maximizes your expected utility. Then, when you receive information, you simply execute the policy. You do not re-evaluate the policy.

  **In technical terms:**
  *   **CDT/EDT:** Choose $A$ to maximize $E[U \mid A, \text{Observations}]$.
  *   **UDT:** Choose function $\pi$ (where $A = \pi(\text{Observations})$) to maximize $E[U \mid \pi]$. Then output $\pi(\text{Observations})$.

  A UDT agent **does** use observations. It needs them to know which branch of the policy function to execute. It just doesn't use them to *re-calculate* which policy is best.

  ### 2. Resolving the Monty Hall Disagreement

  In the Monty Hall problem, you pick Door 1. The host opens Door 3 to reveal a goat.

  *   **Your (incorrect) model of UDT:** The agent ignores the fact that Door 3 has a goat. It sticks to its prior probability that the car is behind Door 1 (1/3). It sees no reason to switch.
  *   **Actual UDT:** Before the game starts, the agent calculates the optimal policy. It determines that the policy *"If the host opens a door, switch to the remaining closed door"* has a 2/3 win rate, whereas *"Stay"* has a 1/3 win rate.
  *   **Execution:** The agent enters the game. It observes "Host opened Door 3." It feeds this observation into its pre-committed policy. The policy outputs "Switch." The agent switches.

  The agent *updated its location* (it now knows it is in the branch where Door 3 is open), but it did not *update its decision criterion*. It is following the map it drew before it entered the territory.

  ### 3. Counterfactual Mugging: Why it actually pays

  This is where the "updateless" name makes sense, but your intuition went slightly off-track.

  **The Setup:** Omega flips a coin.
  *   **Heads:** Omega asks you for $100. (No gain).
  *   **Tails:** Omega gives you $10,000 *if and only if* it predicts you would have given $100 had the coin come up Heads.

  **The Situation:** You are in the **Tails** branch. Omega offers you the $10,000, conditional on your disposition in the Heads branch.

  *   **CDT/EDT Agent (Updateful):**
      *   Observes: "The coin is Tails."
      *   Updates: "The coin is definitely Tails. The Heads branch is impossible."
      *   Calculation: "My action now cannot affect the past coin flip. Paying $100 now costs me $100 and gains me nothing (since the reward depends on the counterfactual Heads branch which didn't happen)."
      *   Decision: **Don't Pay.**
      *   Result: Ex-ante, this agent is poorer. If they could precommit, they would want to bind themselves to pay, but once they see Tails, they lose the will to do so. This is **dynamic inconsistency**.

  *   **UDT Agent (Updateless):**
      *   Observes: "The coin is Tails."
      *   Calculation: "I do not ask 'What is best given Tails?' I ask 'What policy should I have committed to when the probability was 50/50?'"
      *   Policy Evaluation:
          *   Policy "Always Pay": Cost $50 (avg), Gain $5,000 (avg). Net: +$4,950.
          *   Policy "Never Pay": Cost $0, Gain $0. Net: $0.
      *   Decision: The optimal policy is "Pay if asked." I observe I am being asked. I execute **Pay**.
      *   Result: The agent pays the $100 in the Tails world (even though it gets no reward there) because that action validates the policy that wins the money in the Heads world.

  The UDT agent isn't ignoring the evidence that the coin is Tails. It acknowledges the evidence. It just refuses to let that evidence **vetoes the plan** that was optimal ex-ante. It treats the observation as an input to the function, not a reason to rewrite the function.

  ### 4. Why is this considered "Profound"?

  You asked why everyone acts like this is cutting-edge if it's just "precommitting."

  **1. It solves Time Consistency.**
  Standard decision theories suffer from preference reversals. An agent might want to precommit to X at 9:00 AM, but at 9:05 AM, after receiving new info, it wants to do Y. UDT agents never regret their decision procedure. They are the agent they wished they could have been before they knew the facts.

  **2. It handles Logical Correlation (Newcomb's Problem).**
  In Newcomb's Problem, CDT two-boxes because it thinks its action can't causally affect the box content (which was filled in the past). UDT one-boxes because it treats its decision as a logical output of a function. If the Predictor simulated you, then your decision *logically determines* what the Predictor put in the box. UDT formalizes this "logical causation" by optimizing the policy output rather than the physical act.

  **3. It enables Acausal Trade.**
  This is the "killer app" for UDT in AI safety circles. If two UDT agents meet, they can cooperate in a Prisoner's Dilemma even without communication or enforcement. Why? Because each knows the other is running the same source code (or similar optimization process). "I cooperate" logically implies "You cooperate." An updateful agent sees the other player's move as fixed history and defects. An updateless agent sees the correlation between their decision algorithms and cooperates.

  ### Summary for your Reading Group

  To settle the argument and save face:

  1.  **Admit the definition error:** "Updateless" does not mean "ignores observations." It means "optimizes the policy mapping observations-to-actions based on the prior, rather than optimizing actions based on the posterior."
  2.  **Side with your friend:** A UDT agent switches doors in Monty Hall because the *policy* "Switch" was determined to be superior before the door was opened.
  3.  **Hold the line on Mugging:** The UDT agent pays in Counterfactual Mugging not because it ignores the coin flip, but because it honors the ex-ante agreement that made the gamble profitable.

  The "profound" part isn't that agents ignore reality; it's that rational agents should view their decisions as the output of a mathematical function that exists across all possible worlds (including counterfactual ones), rather than as local physical events constrained only by the current timeline.

  You're asking the right questions, though. Wei Dai's posts are notoriously dense, and the "ignore evidence" interpretation is the most natural initial read. You just needed to tweak the mechanism from "ignoring input" to "fixing the function."
