answer: |-
  The air in the container was recycled, cold enough to keep the servers humming but warm enough to keep Major Vance from shivering. On the main bank of monitors, the feed from the loitering munition was grainy, a grayscale wash of thermal blooms and digital noise.

  In the center of the crosshairs stood a man. He was standing in the courtyard of a compound in the Kunar Province. He was holding a long, dark object against his shoulder.

  The protocol was explicit: Engage if the target is classified as *Hostile*.

  Vance knew the definition of *Hostile* by heart. It wasn't vague in the manual. A combatant carrying a weapon system capable of engaging coalition forces. But the manual was ink on paper. The world was photons and heat signatures. The predicate *Hostile* had to bridge the gap between the rule and the pixel.

  For three minutes, Vance had done nothing. His finger hovered over the haptic trigger.

  "Status, Vance?" The voice of Command came through his earpiece, flat and distant.

  "Undetermined," Vance said.

  "Undetermined is not a status. Is he a threat or not?"

  Vance stared at the object. It could be an RPG launcher. The shape matched the profile in his training database with ninety-four percent confidence. But it could also be a length of piping, a surveyor's tripod, a bundle of firewood.

  "I can't confirm," Vance said.

  "You have eyes on. Confirm."

  Vance closed his mouth. He felt a familiar, cold knot tighten in his stomach. It wasn't fear of killing a civilian. It was a philosophical vertigo that had been haunting him since his graduate seminars in ethics, years before he'd donned the uniform. He had read Williamson. He had argued against epistemicism in a seminar room with warm coffee and no stakes. *It is metaphysically extravagant,* he had said then. *To claim there is a precise number of grains that makes a heap is absurd.*

  Now, staring at the thermal bloom of a stranger's shoulder, the absurdity felt like the only thing holding the universe together.

  Vance believed, with a sudden, crushing certainty, that the man *was* either Hostile or he was not. There was no fuzzy ontological cloud surrounding the man. There was no superposition. The metal in the man's hands was either steel alloyed for war, or it was iron bent for peace. The facts of the matter were sharp. The boundary between *Hostile* and *Non-Hostile* was a line drawn in the bedrock of reality.

  But Vance also knew, with the same certainty, that he could never know where that line fell.

  "Vance?"

  "Thinking," Vance said.

  He understood why he couldn't know. It wasn't just the resolution of the camera. It was the nature of the concept *Hostile* itself. The word had been learned through coarse usage, through patterns of application across thousands of ambiguous cases. Language, like the camera lens, had a grain size. It was a tool for navigating the world, not for mapping it with infinite precision.

  If Vance were to claim *Knowledge* that the man was Hostile, that belief would have to be safe. It would have to be impossible for him to hold that belief in a nearby possible world where the man was actually innocent. But the world was continuous. There was a possible world, infinitesimally close to this one, where the man held a pipe instead of a launcher, where the thermal signature was one degree cooler, where the stance was two millimeters more relaxed. In that world, Vance would see the same pixels. He would form the same belief. But he would be wrong.

  Because his belief could be wrong in a nearby world, it could not count as knowledge in this one. Even if, in this actual world, the man was a commander of an insurgent cell. Even if the fact was sharp. The margin for error was built into the very mechanism of his perception.

  "Major, we are burning fuel. Make a determination."

  Vance swallowed. The frustration was physical. It was the sensation of there being a right answer—a single, determinate truth value floating in the air between him and the screen—that was permanently walled off from him. It wasn't that the truth was indeterminate. It was that the truth was *too* determinate for his tools to grasp. The sharpness of the fact was exactly what blinded him.

  If the boundary were fuzzy, if the man were *partially* Hostile, then Vance's uncertainty would be a reflection of the world. He could rest in that. But the world wasn't fuzzy. The world was crisp. His mind was the blur.

  He thought about the boundary of the boundary. Was there a sharp line between the cases he could *know* were Hostile and the cases he *couldn't* know? Epistemicism said yes. There was a specific set of pixel arrangements where knowledge stopped and mere opinion began. But that line, too, was subject to the margin for error. He couldn't know where the line of knowledge ended. He was in the dark about the limits of his own light.

  "Vance. Final warning."

  The man on the screen shifted his weight. The object tilted upward five degrees.

  Vance felt the decision coalesce. It wasn't knowledge. He knew it wasn't knowledge. It was a gamble on a fact he could not access. He was forced to act as if he knew the location of a boundary he was constitutionally barred from seeing.

  He pressed the trigger.

  The screen flared white as the munition dropped. The feed cut to telemetry data. Impact confirmed.

  Silence returned to the container, save for the hum of the servers.

  "Target neutralized," Command said. "Good call."

  Vance took his hand off the console. He should have felt relief, or guilt, or the adrenaline crash of a lethal decision. Instead, he felt a hollow ache.

  They would never know for sure what the man was holding. The debris would be cataloged, the intelligence reports updated. They might find a serial number on the metal. They might confirm he was on a watchlist. But that was posterior evidence. At the moment of the decision, the fact had been fixed, and the fact had been hidden.

  He realized then that this was the human condition, stripped of its usual comforts. We live our lives acting on sharp boundaries we cannot locate. *In love. In debt. In danger. In time.*

  We speak as if we know where the lines are. We argue about them. We legislate them. But the lines are buried under the coarse grain of our own usage. We are like men shouting across a canyon, trying to measure the distance with the echo of our own voices.

  "Moving to next sector," Vance said. His voice sounded thin to his own ears.

  "Copy that."

  The screen refreshed. A new grid appeared. A new road. A new cluster of heat signatures.

  Vance leaned forward. He knew, with a chilling clarity, that somewhere in the next feed, there would be another boundary. A specific number of pixels, a specific temperature threshold, that marked the difference between *Safe* and *Threat*. It existed. It was waiting for him. It was exact.

  And he would never, ever know where it was.

  He adjusted his headset. The grain of the image seemed to pulse, like static on a dead channel. He waited for the next face to appear in the crosshairs, wondering if the unease he felt was just the friction of a finite mind trying to grip an infinite precision.

  "Ready," he said.

  He didn't know if he was. And he knew he couldn't know. But the world demanded an answer, sharp and final, regardless of his ignorance.

  Vance exhaled, and watched the screen.
