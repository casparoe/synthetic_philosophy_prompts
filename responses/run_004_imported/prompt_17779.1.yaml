  Two infinite ethicists are stuck on a long train ride.

  Alice drops her ticket on the floor. Bob points at it. "You should pick that up."

  Alice shakes her head. "Why bother? The universe contains infinite utility. Adding the finite value of a ticket changes the total sum by zero. Infinitarian paralysis."

  "Don't use total sums," Bob says. "Use Bostrom's hyperreal solution. Then your action adds a positive infinitesimal to the total."

  Alice considers this. "True. But the effort of bending over is a finite cost."

  "So? It's a small cost."

  "In hyperreal arithmetic, any finite cost outweighs an infinitesimal gain," Alice says, settling back into her seat. "Mathematically, I am obligated to remain seated."

  Bob sighs, picks up the ticket, and hands it to the conductor as he walks by. "One ticket, please."

  The conductor punches it. "Thanks. By the way, we're checking everyone's bags for explosives. Stand up."

  Alice doesn't move. "No. The risk of explosion is finite. The universe is infinite. Expected disutility is still undefined."

  Bob watches as two guards lift Alice out of her seat and carry her off the train.

  "See?" Bob calls after her. "Local dominance criteria still apply!"

  "Shut up!" Alice yells from the platform. "I'm causally isolated now!"
