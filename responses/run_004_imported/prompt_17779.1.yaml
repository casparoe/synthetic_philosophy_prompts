      *   *Premise 2:* Moral value is aggregated by summing total value.
      *   *Conclusion:* Finite actions (saving a life, killing someone) add/subtract finite value to/from an infinite total.
      *   *Mathematical Issue:* $\infty + 1 = \infty$. The difference is zero.
      *   *Implication:* Moral nihilism/paralysis regarding impact.
      *   *Standard Escapes:*
          *   Switch to average utility (but has its own problems like the "mere addition paradox").
          *   Switch to spacetime-localized ethics (only care about light cone).
          *   Switch to dominance reasoning (if state A is better than state B everywhere, choose A).
          *   Cardinality tricks (different sizes of infinity, though usually value is treated as real-valued).
          *   Hyperreal numbers (surreal utilities).

  3.  **Brainstorming Angles:**
      *   *Angle 1: The Mugger.* Pascal's Mugging is related, but this is about infinite *background* value, not infinite *probability* of payoff.
