      *   *The "Telepathy-Proof Room":* In 1950, it was a control variable. In 2024, is it needed? If ESP doesn't exist, no. But would Turing keep it as a "just in case" control? Probably not, because good experimental design eliminates unnecessary variables. However, the deeper point is about *information leakage*.
      *   *Decision:* Turing would reject the existence of ESP today. Consequently, he would deem the telepathy-proof room unnecessary *for the purpose of blocking psi*, but he would emphasize rigorous information security (which is effectively what the room was metaphorically doing).

  5.  **Drafting the Argument (incorporating HPS nuance):**
      *   *Thesis:* Turing would reject ESP today, not because he became a dogmatic materialist, but because the *statistical evidence* he originally relied upon has been mathematically dismantled by the very kind of methodological rigor he championed.
