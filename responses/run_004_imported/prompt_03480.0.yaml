  3.  **Analyze the Evidence (Then vs. Now):**
      *   *1950 Context:* Rhine's data looked statistically significant by the standards of the time. The methodology *seemed* rigorous (controlled conditions at Duke). Turing, lacking deep training in experimental psychology's pitfalls but possessing deep statistical intuition, accepted the *numbers* at face value.
      *   *2024 Context:* We now know *why* Rhine and Bem got those numbers. It's not paranormal power; it's methodological artifact (publication bias, p-hacking, optional stopping, file drawer problem). The "overwhelming" evidence evaporated under preregistered replication.
