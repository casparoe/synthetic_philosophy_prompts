prompt: |-
  I'm putting together the first session of a graduate seminar on laws of nature, where we'll trace the contemporary split between Humeans (who take laws to be nothing over and above patterns in the "Humean mosaic," in the spirit of Lewis's best-system analysis) and anti-Humeans (who ground laws in irreducible natural necessity, universals, or dispositional essences) back to Hume's own treatment of causal necessity. Re-reading the relevant section of the Treatise to prepare, I got stuck on exactly how much metaphysical weight Hume intends the passage to carry, and I'd like a second opinion before I stand in front of a room of sharp students who will ask exactly this. The passage, from Book I, Part III, Section XIV ("Of the Idea of Necessary Connexion"), runs:

  "Necessity, then, is something, that exists in the mind, not in objects; nor is it possible for us ever to form the most distant idea of it, consider'd as a quality in bodies. Either we have no idea of necessity, or necessity is nothing but that determination of thought to pass from causes to effects and from effects to causes, according to their experienc'd union. Thus as the necessity, which makes two times two equal to four, or the three angles of a triangle equal to two right ones, lies only in the act of the understanding, by which we consider and compare these ideas; in like manner the necessity or power, which unites causes and effects, lies in the determination of the mind to pass from the one to the other. The efficacy or energy of causes is neither plac'd in the causes themselves, nor in the deity, nor in the concurrence of these two principles; but belongs entirely to the soul, which considers the union of two or more objects in all past instances. 'Tis here that the real power of causes is plac'd, along with their connexion and necessity. ... We may define a CAUSE to be 'An object precedent and contiguous to another, and where all the objects resembling the former are plac'd in like relations of precedency and contiguity to those objects that resemble the latter.' If this definition be esteem'd defective, because drawn from objects foreign to the cause, we may substitute this other definition in its place: an object precedent and contiguous to another, and so united with it, that the idea of the one determines the mind to form the idea of the other, and the impression of the one to form a more lively idea of the other."

  What I can't settle to my own satisfaction is twofold, and I'd appreciate help thinking it through rather than a paraphrase of what I've already quoted. First, are Hume's two official definitions of cause actually equivalent, or is he quietly trading on two different relations, mind-independent constant conjunction versus a felt determination internal to an observer, and if they diverge, which one is supposed to tell us what a cause really is, as opposed to merely how we come to identify one? Second, given the line that efficacy "belongs entirely to the soul," is Hume best read as flatly denying that objects possess any mind-independent necessary connection, which would make him the obvious ancestor of Lewis-style Humean supervenience about laws, or is he only denying that we can form a positive idea of such a connection while staying agnostic about its existence in the objects themselves, a reading that would sit far more comfortably with the "New Hume" skeptical-realist camp and would complicate the tidy story that anti-Humeanism about laws is simply a modern reaction against Hume rather than something his own text may have already left room for?
