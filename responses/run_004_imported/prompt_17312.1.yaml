answer: |-
  You have stumbled directly onto one of the most famous and vexing problems in decision theory and effective altruism philosophy. You are not missing a bullet you ought to bite; you have encountered **Pascal's Mugging**.

  The term was coined by Nick Bostrom (a foundational figure in the very scene you are covering) specifically to describe the scenario you just faced: a agent demands a small sacrifice based on a tiny probability of an astronomically large payoff, exploiting the fact that in naive Expected Utility Theory, the magnitude of the payoff can always outstrip the improbability of the event.

  The fact that your intuition screams "this is wrong" is actually a feature of a healthy epistemic system, not a bug. Here are the principled flaws you can bring to your follow-up call, ranging from epistemic to decision-theoretic.

  ### 1. The Complexity Prior (The "Magic" Penalty)
  The researcher asked you to accept a probability of $10^{-8}$ (one in 100 million). The principled objection is: **On what basis is that number derived?**

  In Bayesian reasoning, the prior probability of a hypothesis should be penalized by its complexity (Solomonoff induction). A claim that involves "saving $10^{30}$ lives" requires a massive chain of specific assumptions to be true:
  1.  Humanity survives the next century.
  2.  We expand into the cosmos.
  3.  We don't encounter other civilizations that wipe us out.
  4.  This specific two-person team has identified a leverage point that larger, better-funded teams have missed.
  5.  Money given to them specifically changes the outcome (tractability).

  Each of these conjunctive claims reduces the probability. A claim that hinges on a specific, complex mechanism to unlock $10^{30}$ value should have a prior probability exponentially smaller than a claim that unlocks $10^{10}$ value. If the payoff scales linearly ($10\times$), the complexity of the claim usually scales super-linearly, meaning the probability should drop faster than the payoff rises.

  **The Question for Him:** *"How did you calculate the $10^{-8}$? Did you apply a complexity penalty to your world model? If I claim I can save $10^{40}$ lives with a different method, do you accept that probability too? If not, why does your specific model get a 'flat' probability rate while others get penalized for magnitude?"*

  ### 2. The Evidence-Stakes Proportionality
  Robin Hanson (an economist often associated with this scene) has argued against Pascal's Mugging with a simple rule: **The larger the stakes, the stronger the evidence required.**

  In normal life, if someone says, "Give me $5, I'll buy you a coffee," you need little evidence. If they say, "Give me $5, I'll save your house from burning down," you demand fire insurance credentials. If they say, "Give me $5, I'll save the universe," the evidentiary bar should be so high that no two-person startup can clear it.

  Naive Expected Value theory treats probability as independent of the claim's magnitude. A robust epistemology treats them as linked. A claim of $10^{30}$ lives is an extraordinary claim that requires extraordinary evidence, not just a spreadsheet.

  **The Question for Him:** *"If the stakes are $10^{30}$ lives, what level of empirical verification would it take for you to admit your probability estimate is wrong? If the answer is 'nothing short of success,' then your probability estimate isn't a forecast, it's an article of faith."*

  ### 3. Tractability and Marginal Impact
  This is the most practical objection. Even if the risk is real and the stakes are high, **does your donation change the odds?**

  Many AI safety arguments suffer from the "drop in the ocean" problem. If the probability of catastrophe is driven by global geopolitical dynamics, compute trends, and major lab policies, what is the marginal impact of your donation on a $10^{30}$ scale?
  *   If the project is truly that high-leverage, why is it a two-person outfit?
  *   If it is that high-leverage, why hasn't it attracted millions from Sam Bankman-Fried (pre-collapse), Dustin Moskovitz, or Open Philanthropy?

  The "crank discount" the researcher offered (divide by 1,000) is arbitrary. A better discount is the **market inefficiency discount**. In a highly competitive attention economy (like AI safety funding), unexploited arbitrage opportunities of this magnitude are vanishingly rare.

  **The Question for Him:** *"If your project truly has this leverage, what is the bottleneck? Is it money? If so, why haven't the major longtermist funds already saturated you? If it's talent or time, how does my money specifically unlock the $10^{30}$ outcome?"*

  ### 4. Policy-Based Decision Making (Rule Utilitarianism)
  This is the "game theory" objection. If you adopt the policy "I will fund any project where Probability $\times$ Payoff > Cost," you make yourself a target for every scammer who can name a big number.

  If you become known as someone who responds to Pascal's Muggings, you will be inundated with muggers. The cognitive load and financial drain of evaluating these claims will prevent you from doing any actual good. Therefore, the rational policy is to **pre-commit to ignoring claims that lack a certain threshold of evidentiary solidity, regardless of the stated payoff.**

  This isn't ignoring the math; it's optimizing for your long-term reliability as a donor.

  **The Question for Him:** *"If I adopt your heuristic, I become vulnerable to anyone with a bigger spreadsheet. Isn't the rational strategy to ignore low-evidence, high-magnitude claims entirely to preserve my resources for high-evidence, moderate-magnitude interventions?"*

  ### 5. The "Shutdown" Problem (Bounded Rationality)
  Finally, there is a technical argument from decision theory. If you allow unbounded utility functions (where $10^{30}$ is valid), you can be forced into "lottery tickets" that guarantee your ruin.

  Some decision theorists argue we should use **bounded utility functions**. This doesn't mean we don't care about the future; it means that after a certain point, saving more lives doesn't add *linear* moral value. Saving 7 billion people is not a billion times better than saving 7 people; it's qualitatively different. Once you've secured the survival of the species, the marginal value of "more potential people" diminishes compared to the certainty of "actual people suffering now."

  ### Summary for your Call
  You don't need to feel like you're ignoring the future. You can tell him:

  > "I've looked into the decision theory here, and this is a classic Pascal's Mugging scenario. The consensus among decision theorists—even within longtermism—is that naive Expected Value maximization breaks down when probabilities are uncalibrated and payoffs are unbounded.
  >
  > I'm not willing to accept a probability estimate that isn't derived from a reference class or empirical evidence, regardless of the magnitude of the payoff. If you can show me **evidence** that your intervention works on a small scale, or a **mechanism** that is robust to complexity penalties, I'm interested. But I won't trade certainty for magnitude alone."

  **Verdict:** Your intuition is correct. The math isn't "wrong," but the *inputs* (the probability estimate) are epistemically unjustified. Don't let him hide behind the arithmetic; force him to defend the inputs.
