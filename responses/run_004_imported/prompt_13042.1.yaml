    "part_a_exposition": {"points_awarded": 0, "points_possible": 10, "comment": ""},
    "part_b_distinction": {"points_awarded": 0, "points_possible": 10, "comment": ""},
    "part_c_assessment": {"points_awarded": 0, "points_possible": 5, "comment": ""},
    "letter_grade": "",
    "overall_comment": ""
  }
  ```

  Please be pretty specific in the comments about exactly which claims are earning or losing points - I want to actually be able to justify the grade if the student shows up to office hours arguing about it.
