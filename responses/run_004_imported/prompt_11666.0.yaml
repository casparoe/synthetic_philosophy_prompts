  8.  **Final Polish:** Ensure the distinction between *pragmatic* feasibility (Leopold's strength) and *moral* justification (WAS's strength) is clear. The verdict is that Leopold answers the *pragmatic* "Can we?" with "No," but dodges the *moral* "Should we?" by redefining "Should."

