prompt: |-
  So I went down a rabbit hole after an old LW thread linked to the SEP page on epistemic contextualism, and I think I finally get the bank cases (the classic setup where someone only bothers double-checking the bank's Saturday hours when theres real money riding on it). But contextualism and pragmatic encroachment both seem to just be two ways of saying the same thing, that higher stakes make knowledge harder to get, so they should always agree on whether a given person counts as knowing in any specific case. Given that, why do epistemologists like Stanley and DeRose treat them as genuine rivals instead of just two vocabularies for one insight?
reasoning: |-
  Here's a thinking process that leads to the explanation of the difference between Epistemic Contextualism and Pragmatic Encroachment:

  1.  **Analyze the User's Query:**
      *   **Background:** The user has been reading about epistemic contextualism (linked from LessWrong, checked SEP) and understands the classic "Bank Cases" (Keith DeRose's/Keith Stanley's examples where stakes affect whether someone claims to "know").
      *   **Core Misconception:** The user thinks Contextualism and Pragmatic Encroachment (PE) are effectively the same theory because they both agree that "higher stakes make knowledge harder to get."
      *   **The Question:** Why do epistemologists (like Stanley and DeRose) treat them as rivals if they yield the same verdicts on cases? What's the actual theoretical disagreement?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Do they yield the same verdicts?* Yes, mostly. Both agree that in low-stakes scenarios, "S knows that p" is true, and in high-stakes scenarios, "S knows that p" is false (or at least harder to assert).
      *   *Are they the same theory?* No. They locate the *source* of the variation differently.
      *   *Key Distinction:* Contextualism says the *meaning/truth conditions* of the word "knows" change. Pragmatic Encroachment says the *meaning/truth conditions* stay the same, but the *practical conditions for having knowledge* change (or the standards for justification are affected by practical factors).
      *   *Key Players:* Keith DeRose is the big Contextualist. Jason Stanley is the big Pragmatic Encroachment proponent (ironically, the user mentions them as if they are on the same side against something else, but Stanley is actually the main critic of Contextualism in favor of PE). *Correction:* The user says "Stanley and DeRose treat them as genuine rivals." This is accurate. DeRose defends Contextualism; Stanley defends PE (specifically in *Knowledge and Practical Interests*). They are opponents.

  3.  **Deconstruct the Two Theories:**

      *   **Epistemic Contextualism (DeRose, Cohen, Lewis):**
          *   *Mechanism:* Semantics.
          *   *Claim:* The extension of the verb "to know" shifts depending on the *context of the attributor* (the person saying "S knows").
          *   *Analogy:* Indexicals like "tall" or "here." "Tall" means different height thresholds in different contexts.
          *   *Why stakes matter:* High stakes raise the *conversational context*, which raises the semantic bar for "knows."
          *   *Truth:* "S knows p" is literally true in low stakes, literally false in high stakes (relative to the speaker's context).

      *   **Pragmatic Encroachment (Stanley, Fantl & McGrath):**
          *   *Mechanism:* Metaphysics/Epistemology (Nature of Knowledge/Justification).
          *   *Claim:* The word "knows" has a stable meaning. However, whether a belief counts as knowledge *itself* depends on practical factors (stakes).
          *   *Formula:* Knowledge = Justification + Truth + Belief + *Practical Sufficiency*.
          *   *Why stakes matter:* High stakes require stronger evidence/justification to count as knowledge. It's not about the word; it's about the state of mind.
          *   *Truth:* "S knows p" is objectively false in high stakes because S doesn't actually meet the epistemic standard required by those stakes.

  4.  **Identify the Crucial Divergence Points (The "Smoking Guns"):**
      *   If they agree on the Bank Cases, where do they disagree?
      *   *Disagreement 1: Who determines the standard?*
          *   Contextualism: The *speaker* (attributor). If I'm talking about you in a low-stakes context, I can truthfully say "You know," even if you are in a high-stakes situation.
          *   PE: The *subject* (the knower). If you are in a high-stakes situation, you don't know, regardless of what I say in my low-stakes living room.
      *   *Disagreement 2: Retractions.*
          *   Contextualism: If I say "I know" in low stakes, then stakes rise, I should retract ("I didn't *really* know").
          *   PE: Retraction is about admitting a mistake in judgment, not a shift in meaning.
      *   *Disagreement 3: Embedding.*
          *   Contextualism struggles with "If I know, then..." conditionals across contexts.
          *   PE handles them better because the truth condition is stable.

  5.  **Drafting the Explanation:**
      *   *Acknowledge the intuition:* Validate that the user is right to see the similarity (both handle the Bank Cases similarly). This is why the debate is subtle.
      *   *Clarify the Camps:* Correct/Confirm the alignment. DeRose = Contextualism. Stanley = Pragmatic Encroachment. They are opponents.
      *   *The Core Distinction (Semantics vs. Metaphysics):* Use the "Tall" analogy.
          *   Contextualism: "Knows" is like "tall." The ruler changes.
          *   PE: "Knows" is like "fit to fly." The ruler is stable, but the requirement for passing changes based on the risk. (Actually, a better analogy might be needed). Let's stick to: Contextualism = Word changes meaning. PE = State of knowledge changes based on stakes.
      *   *The "Attributor vs. Subject" Test:* This is the strongest technical differentiator.
          *   Scenario: Hannah (high stakes) vs. John (low stakes) talking about Hannah's knowledge.
          *   Contextualist: John can truthfully say "Hannah knows."
          *   PE: John cannot truthfully say "Hannah knows" because Hannah's stakes are high.
      *   *Why it matters:* It changes how we view the nature of truth and knowledge. Is knowledge sensitive to the speaker's mood/context, or is it a robust fact about the believer's situation?

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check Stanley's view:* Stanley argues that practical interests encroach on *justification*. Justification is part of knowledge. So stakes change whether you have justification.
      *   *Check DeRose's view:* DeRose argues the *standards* for knowledge attribution change based on the conversational context.
      *   *Make sure to highlight the "Who's Context?" issue.* This is the big one. Contextualism is *Attributor*-sensitive. PE is *Subject*-sensitive.
      *   *User's prompt:* "Stanley and DeRose treat them as genuine rivals." Yes, because Stanley wrote *Knowledge and Practical Interests* largely to argue *against* Contextualism and *for* PE.

  7.  **Final Polish:**
      *   Tone: Informative, philosophical but accessible (since they read SEP/LW).
      *   Structure:
          1.  Validate the intuition (they look similar).
          2.  Clarify the rivalry (Stanley vs. DeRose).
          3.  The Semantic vs. Metaphysical split.
          4.  The Crucial Test Case (Attributor vs. Subject).
          5.  Why philosophers care (Theoretical cost).

  8.  *(Self-Correction during drafting)*: I need to be careful with the term "Pragmatic Encroachment." It's not just pragmatics (usage); it's that practical factors encroach on the *epistemic* status. Contextualism says practical factors affect the *semantic content*.
      *   *Analogy:*
          *   Contextualism: The word "flat" means different things in different conversations.
          *   PE: The word "flat" means the same thing, but whether a surface counts as flat depends on what you're going to do with it (put a glass on it vs. build a telescope).
          *   *Wait, that sounds like PE.*
          *   *Better Analogy:*
              *   Contextualism: "I know" is like "I am here." The content changes depending on who says it and where.
              *   PE: "I know" is like "I am healthy." The definition of health is stable, but whether I am healthy depends on practical factors (can I run a marathon?). No, that's not quite right either.
              *   *Best Analogy:*
                  *   Contextualism: The *ruler* changes size depending on who is holding it.
                  *   PE: The *ruler* stays the same, but the *distance required to cross the bridge* changes depending on the stakes.

      *   *Let's stick to the Attributor/Subject distinction.* That is the clearest technical difference.

  9.  **Final Review of the Output:** Ensure I explicitly address why they are rivals despite agreeing on the Bank Cases. (Answer: They disagree on *why* and on *other* cases involving third-party attribution).

  **(Self-Correction Note):** I need to make sure I don't confuse "Pragmatic Encroachment" with "Subject-Sensitive Invariantism" (SSI). Stanley's view is often labeled SSI, which is the main form of PE. I should mention SSI as the technical term for Stanley's view to be precise.

  Okay, ready to write.
answer: |-
  You have hit on one of the most subtle and frustrating distinctions in contemporary epistemology. Your intuition is understandable: both **Epistemic Contextualism** (championed by Keith DeRose) and **Pragmatic Encroachment** (championed by Jason Stanley) agree on the "Bank Cases." They both agree that in low-stakes scenarios, it's correct to say "I know the bank is open," and in high-stakes scenarios, it's incorrect.

  If they agree on the data, why are they rivals?

  The short answer is: **They disagree on *where* the stakes do their work.**

  Contextualism says stakes change the **meaning of the word "knows."**
  Pragmatic Encroachment says stakes change the **nature of knowledge itself.**

  Here is the breakdown of why they are treated as genuine competitors, not just synonyms.

  ### 1. The Semantic vs. Metaphysical Split

  The fundamental disagreement is about whether the word "knows" is context-sensitive (like an indexical) or stable (invariant).

  **Epistemic Contextualism (DeRose):**
  *   **The Claim:** The semantic content of "knows" shifts depending on the **context of the speaker (the attributor)**.
  *   **The Mechanism:** "Knows" works like the word "tall." In a conversation about jockeys, "tall" means 5'10". In a conversation about NBA players, "tall" means 6'5". The person's height hasn't changed; the *standard for applying the word* has changed.
  *   **Implication:** When stakes rise, the conversational context shifts, raising the semantic bar for "knows." The proposition expressed by "S knows p" in a low-stakes context is literally different from the proposition expressed in a high-stakes context.

  **Pragmatic Encroachment / Subject-Sensitive Invariantism (Stanley):**
  *   **The Claim:** The semantic content of "knows" is **stable**. It means the same thing regardless of who is speaking.
  *   **The Mechanism:** Practical factors (stakes) encroach on **justification**. To have knowledge, you need justification. Stanley argues that how much justification you need depends on your practical situation.
  *   **Implication:** The word "knows" doesn't change meaning. Instead, the *facts on the ground* change. In high stakes, you literally lack the justification required for knowledge. You don't know. Period.

  ### 2. The "Attributor vs. Subject" Test (The Smoking Gun)

  If the theories only differed on semantics, it might just be philosophical hair-splitting. But they make different predictions in specific third-party cases. This is where DeRose and Stanley actually fight.

  Imagine a scenario with three people:
  1.  **Hannah (The Subject):** She is in a **High-Stakes** situation (if she's wrong about the bank, she goes bankrupt).
  2.  **John (The Attributor):** He is in a **Low-Stakes** situation (he's just chatting about Hannah in a coffee shop; he doesn't care about her money).
  3.  **The Bank:** It is actually open.

  Hannah has the same evidence in both cases, but her stakes are high. John is talking about Hannah, but John's stakes are low.

  **The Question:** Can John truthfully say, "Hannah knows the bank is open"?

  *   **The Contextualist (DeRose) says: YES.**
      Because "knows" is sensitive to the *attributor's* context (John). John is in a low-stakes conversation. The semantic bar for "knows" is low in John's mouth. Therefore, John speaks truth when he says "Hannah knows," even though Hannah is stressed out about high stakes.
  *   **The Pragmatic Encroacher (Stanley) says: NO.**
      Because "knows" is sensitive to the *subject's* situation (Hannah). Hannah is in a high-stakes situation. Therefore, she does not meet the epistemic standard for knowledge. Since she doesn't know, John's statement "Hannah knows" is false, regardless of how relaxed John is.

  This is a massive theoretical divergence. Contextualism makes knowledge attribution easy for outsiders; Pragmatic Encroachment makes it hard.

  ### 3. Retraction and Disagreement

  The theories also handle disagreement differently.

  **Scenario:**
  On Friday morning (Low Stakes), Sarah says, "I know the bank is open."
  On Friday afternoon (High Stakes arise), Sarah says, "I was wrong. I didn't know."

  *   **Contextualism:** Sarah isn't admitting she was wrong on Friday morning. She is acknowledging that her Friday morning statement was true *relative to the morning context*, but it is not useful/assertable in the afternoon context. It's like saying "It's warm" in the morning and "It's not warm" at night. Neither is objectively false; the context shifted.
  *   **Pragmatic Encroachment:** Sarah is admitting she made a mistake. She thought her evidence was sufficient, but the rising stakes revealed that her evidence was never strong enough to constitute knowledge. The truth value of the Friday morning claim was always "False" (or at least, she didn't actually know then either, she just thought she did).

  ### 4. Why Philosophers Care (Theoretical Cost)

  You might ask, "Why does it matter if the word changes meaning or the fact changes?"

  It matters because of **theoretical cost.**

  *   **Contextualism's Cost:** It requires us to accept that "knows" is a slippery, indexical word. This creates problems for logic and embedding. For example, it struggles to explain valid arguments like: "If I know the bank is open, I will go there. I know the bank is open. Therefore, I will go there." If "knows" shifts meaning mid-argument depending on the stakes of the conclusion, the logic breaks.
  *   **Pragmatic Encroachment's Cost:** It requires us to accept that **epistemology is not pure.** Traditionally, epistemology is about truth, evidence, and belief. Practical stuff (money, risk, desires) is supposed to be separate. Stanley argues we must mix them: practical interests determine epistemic justification. This violates the traditional "purity" of epistemology.

  ### Summary

  You are right that they are "allies" against the **Traditional Invariantist** (who says stakes never matter and we usually don't know anything).

  But they are "rivals" because they offer competing explanations for *why* stakes matter:

  1.  **DeRose (Contextualism):** Stakes change the **conversation**. The ruler changes size. (Sensitive to the Speaker).
  2.  **Stanley (Pragmatic Encroachment):** Stakes change the **knower**. The distance to the finish line changes. (Sensitive to the Subject).

  They treat each other as rivals because they cannot both be true. Either the word "knows" changes meaning depending on who is talking (DeRose), or it doesn't, and practical stakes actually alter the epistemic status of the believer (Stanley). The "Attributor vs. Subject" test case is the battlefield where they try to prove the other wrong.
