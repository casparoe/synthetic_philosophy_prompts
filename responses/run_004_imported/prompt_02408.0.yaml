      *   Avoid "AI hype" or "AI doom." Stick to the philosophy.
      *   Ensure the distinction between *semantic meaning* (for humans) and *vector geometry* (for the model) is clear.

  7.  **Final Polish:** Check against the user's specific options.
      *   *Is it a private language?* No, because it's not a language user.
