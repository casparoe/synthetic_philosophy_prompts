prompt: |-
  Ok this is going to sound like a weird rabbit hole but bear with me. A coworker who did a philosophy minor was going on at lunch about how "no LLM could ever have a private language" in the Wittgenstein sense, and it bugged me enough that I went and actually read up on the private language argument that night to see if he was full of it. From what I can tell the argument isn't just "private thoughts are impossible" -- its more specific than that. Wittgenstein's point (the diary case where someone writes down "S" every time they get some inner sensation, or the beetle-in-a-box thing) is that a word only has meaning if theres a real difference between using it correctly and merely thinking you used it correctly, and if the only check you've got is your own memory or impression, that distinction collapses and there's no actual rule being followed. So on his view meaning is fundamentally a public, social thing tied to shared practices, not a private inner-pointing-at-sensations thing. Tell me if I'm butchering that.

  Assuming I've got the gist right, here's what I actually want to know: what would Wittgenstein say about the internals of something like GPT-4? These models build huge internal vector representations purely from public training data, but nobody -- not the researchers, not the model -- can point to a "public rule" for what any given direction in that vector space means, and once training is done, nothing about how the model uses a word gets corrected by anyone the way a kid gets corrected for misusing a word. So is that internal representation basically a private language in his sense, meaning it doesn't actually mean anything because "correct use" of those internal states can never be cashed out? Or would he say the training process on public data itself counts as the relevant rule-following practice / form of life, so the internals afterward don't matter any more than an individual's private mental imagery matters once they've learned a public word? Or is the whole question confused from the start because on his view a next-token predictor isn't even the sort of thing that could have (or lack) a private language to begin with? I want your actual best-guess reconstruction of his view here, grounded in how the argument actually works, not a "nobody can know" non-answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

