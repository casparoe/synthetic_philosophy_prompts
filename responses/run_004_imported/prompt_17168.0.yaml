answer: |-
  Here is a setup and punchline that hits the mechanics (the $n=2$ vs. $n \ge 3$ threshold and the definition of strategy-proofness) without needing a glossary:

  **Setup:** "Why do two-candidate elections feel so morally superior?"
  **Punchline:** "Because Gibbard-Satterthwaite hasn't turned sincerity into a dominated strategy yet."

  ***

  **Why this works for your group chat:**
  1.  **It respects the math:** It correctly identifies that the theorem breaks specifically when you cross the threshold from 2 to 3 candidates (shoutout to May's Theorem holding the line at $n=2$).
  2.  **It uses the jargon correctly:** It frames "voting sincerely" not as a moral failing, but as playing a **dominated strategy**, which is exactly what manipulability implies in the proof (there exists a ballot that yields a strictly better outcome than your true preference).
  3.  **It avoids the Dictator trap:** It doesn't rely on the "just pick a dictator" punchline you guys are already tired of; it focuses on the *voter's* inevitable compromise.

  **Alternative (if you want it shorter):**
  **Setup:** "What do you call a voter who casts a sincere ballot in a Gibbard-Satterthwaite environment?"
  **Punchline:** "Naive. Or more technically, someone playing a dominated strategy."
