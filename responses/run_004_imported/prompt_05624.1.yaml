prompt: |-
  Ok, weirdly specific request, but you're my best shot at getting this right before Saturday. My old grad-school roommate (I left the PhD program for science journalism, he stuck it out and is now basically a professional philosopher of probability) is marrying a meteorologist, and I've been drafted as best man and toast-giver. The story goes they met arguing at a party about whether "70% chance of rain tomorrow" describes a fact about the world or just the forecaster's own uncertainty, which, if you know him, is basically a marriage proposal in his native language. His whole academic career has been defending David Lewis's Principal Principle from the 1980 paper -- roughly, the idea that your own degree of belief has to defer to the objective chance whenever you know it and don't have any other "inadmissible" information lying around -- and she spends her actual job producing exactly the kind of objective-chance numbers he thinks the rest of us are rationally required to just believe.

  I want the toast built around that, not just one throwaway "opposites attract, statistically speaking" line. Maybe a third of the room is his old philosophy-of-probability cohort, who will definately clock it if I flub the "admissible evidence" clause or accidentally imply chances are hidden facts sitting somewhere rather than, per his (and Lewis's) actual Humean view, something more like a pattern read off the whole history of events -- apparently there's a real wrinkle where Lewis himself worried that stuff about the future can retroactively undermine what the present chances even were, which I don't fully follow but he's brought it up alot so I know it's load-bearing for him. My first draft just had the best man declaring "there's a 100% chance these two crazy kids are gonna make it," and the one philosopher friend I ran it by winced and said that's exactly the kind of sloppy talk his crowd would flag for a contingent future event. Everyone else in the room is family who just wants to laugh and maybe tear up a bit. Could you write me a five-minute toast that actually uses the deference-to-chance idea as the spine of both the joke and the sentiment -- precise enough that his old cohort nods along instead of grimacing, warm enough that my grandmother doesn't feel like she wandered into a logic seminar?
