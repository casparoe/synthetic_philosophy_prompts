answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a science journalist now, but I share a history with the Groom dating back to our grad school days. Back then, I left the PhD program to write about science, and he stayed behind to defend the metaphysical foundations of probability itself.

  I mention this because, as many of you know, [Groom] and [Bride] met at a party arguing about whether a "70% chance of rain" is a fact about the atmosphere or just a measure of the forecaster's uncertainty. To most people, that's a bar fight. To [Groom], that was basically a marriage proposal in his native language.

  Now, I was told that in my toast, I should avoid saying there is a "100% chance" this marriage will succeed. Apparently, for a contingent future event, that's not just sloppy journalism; it's a category error. And since about a third of this room is currently mentally checking my citations, I want to be precise.

  [Groom] has built his career on David Lewis's Principal Principle. Roughly, this says that a rational agent's degree of belief should defer to the objective chance, provided they don't have any "inadmissible" information—like a crystal ball or a note from God.

  Looking at this couple, the application is obvious. [Bride], as a meteorologist, she literally produces the objective chances. She looks at the complex systems of the world and tells us what is likely to happen. [Groom], as a philosopher, his entire job is to tell us how we ought to respond to those numbers.

  In other words, she is the Objective Chance, and he is the Rational Agent. And the Principal Principle dictates that he *must* defer to her. So, really, this wedding wasn't a choice; it was a requirement of rationality.

  But I know [Groom]'s view isn't that chances are some magical, hidden force floating above the world. He's a Humean. He believes chances aren't hidden propensities; they supervene on the actual history of events. They are just the patterns we read off the "mosaic" of what has actually happened.

  And if you look at the mosaic of [Groom] and [Bride]'s relationship—the late nights, the support, the way they navigate the world together—the pattern is undeniable. The chance of their happiness isn't a mystery; it's written in the history they've already built.

  Now, Lewis did worry about something called the "Undermining Future." He was concerned that if the future goes a certain way, it might retroactively change what the present chances even *were*. It's a technical worry, but it speaks to a human truth: We can't know the future. We can't guarantee that the pattern will hold without effort.

  So, I am not going to stand here and claim I have inadmissible evidence about the future. I don't have a crystal ball. I can't tell you the objective chance of their happiness fifty years from now, because that chance supervenes on what they do between now and then.

  However, based on the admissible evidence available to me—their kindness, their intellect, and the way they look at each other when they think no one is watching—my credence in their success is as high as rationally permitted.

  [Groom], you've spent your life arguing that we should align our beliefs with the truth of the world. [Bride], you spend your life measuring that world with precision and care. Together, you don't just talk about probability; you live it. You acknowledge the uncertainty, you respect the evidence, and you commit to the pattern anyway.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your credence always match your chance, may your evidence always be admissible, and may the pattern of your lives together be the best system any of us have ever seen.

  To the happy couple.
