answer: |-
  You and Dana have accidentally stumbled into one of the oldest and deepest debates in the history of philosophy. Seriously. This isn't just a disagreement about semantics; you are arguing about the **Problem of Future Contingents**, a puzzle that goes back to Aristotle (specifically his "Sea Battle" argument in *De Interpretatione*).

  The reason you both felt so sure of yourselves is that you are both relying on powerful, but conflicting, logical intuitions. Neither of you is "wrong" in a way that can be easily disproven, because philosophers have been arguing about this for 2,400 years.

  Here is the breakdown of who is arguing what, why you're both stuck, and an answer to the part that is freaking you out.

  ### 1. Your Position: The Principle of Bivalence
  **You argued:** "Either she's gonna say yes or no, so one of those is already true."

  You are holding to the **Principle of Bivalence**. In classical logic, every statement must be either true or false. There is no middle ground.
  *   **The Logic:** Reality is a specific way. Even if we don't know the facts, the facts exist.
  *   **The Analogy:** Imagine Mia's answer is written on a piece of paper, sealed in an envelope, and launched into space. We don't know what's inside, but the writing is already there. To you, the future is just a place we haven't looked at yet.
  *   **Philosophical Label:** This view is often associated with **Eternalism** or the **Block Universe**. It suggests that the past, present, and future all exist equally, just at different coordinates.

  ### 2. Dana's Position: The Open Future
  **Dana argued:** "It's not true OR false yet, because she hasn't decided."

  Dana is arguing for the **Open Future** (or Temporal Contingency). This view holds that truth depends on reality, and since the future *does not exist yet*, statements about it cannot be true or false.
  *   **The Logic:** For a statement to be true, there must be something in reality that makes it true. Since Mia's decision hasn't happened, there is no "fact of the matter" yet.
  *   **The Analogy:** Imagine a tree growing. The trunk is the past, the current branch is the present. The future isn't a single branch waiting to be discovered; it's a bunch of twigs that *might* grow. Until the tree actually grows in one direction, it isn't true that it grew that way.
  *   **Philosophical Label:** This is often called **Presentism** or **Indeterminism**. It suggests the future is genuinely unwritten.

  ### 3. Who is "Right"?
  If you ask a **classical logician**, you are right. In standard logic systems, "Mia will say yes" is a proposition that has a truth value.
  If you ask an **Aristotelian** or some **quantum physicists**, Dana might be right. If the universe is fundamentally indeterministic (meaning the future is not causally locked by the past), then there is literally no fact to be known yet.

  So, technically: **It depends on which framework of logic or metaphysics you adopt.** There is no scientific test we can run today to prove who is correct.

  ### 4. Addressing the "Freak Out" (Free Will)
  This is the most important part. You asked: *If "she'll say yes" is already true, is her answer locked in? Is she not really choosing?*

  This fear is called **Logical Fatalism**. It's the idea that if a statement about the future is true, we are powerless to change it. But most philosophers argue that **truth does not equal causation.**

  Here is the best way to think about it to stop the anxiety:

  **The "Looking Back" Trick**
  Imagine it is next Monday. Mia has said yes.
  You say, "It was true on Friday that she would say yes."
  She says, "But I chose to say yes!"
  You both are right. The fact that the statement *was* true on Friday doesn't mean it *forced* her to say yes on Monday. It just means that reality lined up that way.

  **Truth describes; it doesn't compel.**
  Think of a movie reel.
  *   **Your view:** The whole movie exists on the reel (past, present, future). The scene where she says yes is already on the film.
  *   **Dana's view:** The movie is being filmed live. The next scene hasn't been shot.
  *   **The Free Will Reconciliation:** Even if the movie is already on the reel (your view), the characters inside the movie still go through the process of making decisions. The fact that the ending is "true" on the reel doesn't mean the character didn't struggle, think, and choose in the scene.

  If Mia says yes, she says yes *because she wants to*, not because "it was true." The truth of the statement is a result of her choice, not the cause of it.

  ### The Verdict
  *   **On the logic:** You are both operating on different definitions of "truth." You define truth as "correspondence to reality (even unseen reality)." Dana defines truth as "correspondence to *current* reality." Neither is objectively disprovable.
  *   **On the fear:** You don't need to worry. Even if you are right and the statement is already true, it doesn't rob Mia of her agency. It just means her agency will result in a specific outcome.

  **Advice for the friendship:**
  Tell Dana, "I looked it up, and we just recreated a 2,400-year-old philosophical paradox that Aristotle couldn't solve. We're both smart enough to be stuck on this." Then order some food and drop it. You're both right enough for a Friday night argument.
