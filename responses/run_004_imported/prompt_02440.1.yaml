answer: |-
  It is a genuine pleasure to speak with someone who has lived inside the 5-sigma culture. You are right to feel a bit of cognitive dissonance; the Jeffreys-Lindley (JL) paradox strikes at the heart of what we mean by "evidence."

  In High Energy Physics (HEP), the 5-sigma convention works beautifully because the context implicitly solves the paradox for you. In philosophy and social science, where the context is looser, the paradox bites hard.

  Here is the breakdown of what is driving the paradox, why more data isn't a panacea, and how it connects to the replication crisis.

  ### 1. The Engine: Ockham's Razor vs. Incompatibility
  To understand what's driving the JL paradox without just saying "priors," you have to look at what the two methods are actually calculating.

  *   **The Frequentist ($p$-value):** Asks, "Assuming the null is true, how incompatible is this specific dataset?" It is a measure of **surprise**.
  *   **The Bayesian (Bayes Factor):** Asks, "Which hypothesis predicted this data better?" It is a measure of **predictive success**.

  The paradox arises when you test a **point null** ($H_0: \theta = 0$) against a **composite alternative** ($H_1: \theta \neq 0$).

  In the JL scenario, we imagine a fixed test statistic (say, $t = 1.96$, which is $p \approx 0.05$) while the sample size $N \to \infty$. For $t$ to stay fixed while $N$ grows, the observed effect size $\hat{\theta}$ must be shrinking (since $t \propto \hat{\theta}\sqrt{N}$).

  **The Driving Mechanism:**
  The Bayesian alternative hypothesis ($H_1$) assigns prior probability mass over a continuous range of $\theta$. Let's say you allow $\theta$ to be anywhere between -1 and 1. That probability mass is "diluted" across that range.
  *   As $N$ increases, your likelihood function becomes incredibly narrow (your uncertainty shrinks as $1/\sqrt{N}$).
  *   If the observed $\hat{\theta}$ is small (fixed $t$), that narrow likelihood peak sits very close to zero.
  *   **The Kicker:** Because the likelihood is so narrow, it only overlaps with a tiny slice of the $H_1$ prior density. The average likelihood under $H_1$ becomes tiny because most of the parameter space allowed by $H_1$ predicts data *far away* from what you observed.
  *   Meanwhile, $H_0$ (the point null) concentrates all its predictive density exactly at zero. Even if the data is slightly off-zero, $H_0$ is still "closer" to the tight likelihood peak than the *average* prediction of the diffuse $H_1$.

  **In Physicist Terms:**
  Think of $H_0$ as a sharp resonance and $H_1$ as a broad continuum background.
  The $p$-value asks: "Is this event inconsistent with the background?" (Yes, it's $2\sigma$ away).
  The Bayes Factor asks: "Does this event look more like the sharp resonance or the broad background?"
  If you have infinite statistics, a $2\sigma$ fluctuation is statistically distinct from the background mean, **but** it is still much more likely to be a fluctuation of the background than a signal located in a vast, unspecified parameter space. The Bayesian calculation automatically penalizes $H_1$ for being vague. It is **Ockham's Razor** quantified: $H_0$ is the simpler model, and with huge data, a tiny deviation isn't enough to justify the complexity of $H_1$.

  ### 2. Why More Data Doesn't Make It "Safer"
  Your intuition is that $N \to \infty$ should solve everything. In HEP, it usually does, because we assume if a particle exists, it has a non-negligible cross-section.

  However, the JL paradox highlights a distinction between **statistical significance** and **practical significance**.

  If you keep collecting data and the effect size $\hat{\theta}$ shrinks such that $t$ remains constant (e.g., always $2\sigma$), you are effectively observing a phenomenon that is becoming physically negligible even as it becomes statistically distinguishable.
  *   **Frequentist:** "I can distinguish this from zero." (True)
  *   **Bayesian:** "This is indistinguishable from zero for any practical purpose, so I'll bet on zero." (Also True)

  The paradox reveals that a fixed $p$-value threshold does *not* correspond to fixed evidence strength as $N$ changes. A $p=0.05$ with $N=10$ is strong evidence. A $p=0.05$ with $N=1,000,000$ is weak evidence of a trivial effect. The $p$-value conflates effect size and sample size; the Bayes Factor attempts to disentangle them.

  ### 3. Why HEP Survives the Paradox (The Look-Elsewhere Effect)
  You might wonder: *"If this is true, why didn't it invalidate the Higgs discovery?"*

  In HEP, we rarely test the "vague" $H_1$ that triggers the worst of the JL paradox.
  *   **Vague $H_1$:** "There is a new particle with some mass between 100 GeV and 10 TeV." (This invites the penalty).
  *   **HEP Practice:** We scan the mass spectrum, but we correct for the **Look-Elsewhere Effect (LEE)**.

  The LEE is the frequentist cousin of the Bayesian Ockham penalty. When we claim 5-sigma locally, we ensure it is 5-sigma globally after accounting for the fact that we looked in many bins.
  *   The Bayesian method bakes this penalty into the prior density on the mass parameter.
  *   The Frequentist method applies it as a post-hoc correction to the $p$-value.

  Because HEP demands 5-sigma (global), the effect size is usually large enough, and the signal model specific enough, that both the Frequentist and Bayesian agree: $H_0$ is dead. The JL paradox mostly bites at the $2\sigma$ to $3\sigma$ level with huge datasets, which is exactly the "look-elsewhere" or "systematics-dominated" regime where HEP physicists are already skeptical.

  ### 4. Connection to the Replication Crisis
  This is not a separate can of worms; it is the **exact same can**.

  In psychology and social science, the JL paradox is the mathematical engine of the replication crisis.
  1.  **Huge $N$:** Online studies allow massive sample sizes.
  2.  **Tiny Effects:** Human behavior effects are often tiny ($\hat{\theta} \approx 0$).
  3.  **Vague Theories:** The alternative hypothesis is often "Theory X has some effect," without specifying the magnitude.

  Researchers collect data until $p < 0.05$. Because $N$ is large, they can find $p < 0.05$ for effect sizes that are physically/psychologically trivial.
  *   **Frequentist Conclusion:** "Significant discovery!"
  *   **Bayesian/JL Reality:** The data is actually much more likely under the null than under the vague alternative, because the observed effect is too small to justify the theory's complexity.

  When other labs try to replicate, they often fail because the original result was a $2\sigma$ fluctuation amplified by huge $N$, not a robust signal. The JL paradox explains why $p < 0.05$ in large-sample social science is often *less* reliable than $p < 0.05$ in small-sample physics.

  ### Summary for a Physicist
  You didn't waste your career on a flawed convention. The 5-sigma standard is robust specifically because it is **conservative enough to overcome the Jeffreys-Lindley penalty.**

  *   **The Driver:** The paradox is driven by the **dilution of predictive probability** in vague alternative hypotheses. As data precision increases, a vague hypothesis predicts the precise data worse than a sharp null hypothesis, unless the effect size is substantial.
  *   **The Data:** More data only makes a result "safer" if the effect size is stable. If the effect size shrinks as $N$ grows (keeping $p$ fixed), you are measuring noise, not signal.
  *   **The Crisis:** The replication crisis is essentially fields operating at the $2\sigma$ or $3\sigma$ level with huge $N$ and vague priors, exactly where the JL paradox warns us that $p$-values become misleading.

  In HEP, by demanding 5-sigma and specifying signal models (mass, width, coupling), we effectively force the Bayes Factor to agree with the $p$-value. The paradox is a warning flag for the "gray zone" of evidence—precisely the zone where 5-sigma tells us not to claim a discovery.
