  ### Justifications

  **Statement 1 (Owen): Score 1**
  Owen correctly identifies **False Positive Rate (FPR) Parity** as a valid fairness metric. If Group B non-defaulters face significantly more friction (manual review) than Group A non-defaulters, that is a tangible harm (Disparate Impact). However, his claim that this is "injustice... for no good reason" ignores the possibility that base rates differ. Furthermore, his proposed solution (group-specific thresholds) constitutes **Disparate Treatment**, which is legally prohibited in many jurisdictions (e.g., under the U.S. Equal Credit Opportunity Act), even if intended to fix bias.

  **Statement 2 (Naomi): Score 2**
  Naomi is mathematically correct. **Calibration** (predictive parity) and **Equalized Odds** (FPR/TPR parity) are generally incompatible when base rates differ between groups. If the model is well-calibrated, enforcing equal flag rates among non-defaulters *requires* applying different risk score thresholds to different groups. Her warning that this amounts to decision-making by group membership is accurate and highlights the legal/ethical tension in Owen's proposal.

  **Statement 3 (Owen): Score 2**
  This is Owen's strongest point and a critical insight in fairness literature. **Label Bias** (or historical bias) means the target variable ($Y$) may reflect past discriminatory practices rather than ground-truth creditworthiness. If Group B was historically underserved or predatory lending was targeted at them, their observed default rate is contaminated. In this scenario, a calibrated model simply efficiently reproduces historical discrimination. Calibration is not a defense if the target itself is biased.

  **Statement 4 (Naomi): Score 1**
  Naomi is pragmatically right that engineering efforts should focus on fixing contaminated features or labels (**pre-processing**) rather than patching outputs (**post-processing**). However, her argument relies on the assumption that the risk scores accurately reflect "marginal risk." If Owen is right about label bias (Statement 3), the Group B applicant is not actually "higher-risk," so her claim that the fix treats unequal risks equally is undermined. Additionally, auditing labels is often operationally much harder than adjusting thresholds.

  ### The Missing Point

  Both Owen and Naomi are treating fairness as a technical constraint that can be solved by finding the "correct" mathematical definition. They are missing the **Impossibility Theorem of Fairness** (Kleinberg et al., 2016; Chouldechova, 2017).

  When base rates differ between groups, it is mathematically impossible to satisfy Calibration, False Positive Rate Parity, and True Positive Rate Parity simultaneously. You must choose which metric to optimize. This is not an engineering decision; it is a **normative, ethical, and legal trade-off**.

  *   **Owen** prioritizes **Equal Opportunity** (minimizing the burden on qualified applicants in Group B).
  *   **Naomi** prioritizes **Predictive Parity** (ensuring a score means the same thing for everyone) and **Individual Fairness** (similar risk should get similar treatment).

  **Adjudication:** The team cannot resolve this via argument. They must escalate to Legal/Compliance and Stakeholders to define which fairness definition aligns with regulatory requirements and company values. If the labels are indeed biased (Owen's Stmt 3), Naomi's calibration defense fails, but Owen's group-threshold solution may still be illegal. The actual fix likely involves **feature engineering** to remove proxies for group membership while attempting to minimize FPR disparity without explicit group-aware thresholds.
