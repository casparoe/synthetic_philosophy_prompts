answer: |-
  The diagnosis was printed on standard letterhead, crisp and white, but it felt heavy in Elias's hand. *Adult Attentional Variance (Type 4).*

  Before that Tuesday, Elias was just a man who couldn't finish emails. After Tuesday, he was a man with a neurological variance. The relief was immediate, a chemical unclenching in his chest. He wasn't broken; he was a specific model of machine running the wrong operating system.

  He went home and fell down the hole. It wasn't just TikTok; it was the forums, the subreddits, the YouTube essays with titles like *Living in AAV Time.* He watched a video where a woman described "task paralysis" not as laziness, but as a physical weight on her sternum. Elias pressed his hand to his chest. He felt it. He watched a man describe "doom scrolling" as a dissociative fugue state. Elias remembered the last four hours of his life. He felt that, too.

  The diagnosis gave him a vocabulary, but the community gave him a script.

  Three months later, Elias sat in a circle of folding chairs in a church basement. The support group was for Type 4s. There were twelve of them. They were sharing "wins," but mostly they were sharing textures of their struggle.

  "I had the 'Doorway Freeze' again," said a woman named Sarah. She described standing in a threshold, unable to cross into the next room because the transition required a context switch her brain couldn't process.

  Elias nodded. He hadn't heard of the Doorway Freeze before. But as Sarah spoke, he felt a memory slotting into place. Last week, standing between his kitchen and living room. The hesitation. Was it just hesitation? Or was it a Freeze?

  "I get that," Elias said. "But for me, it's more like... the 'Echo Lag.' I hear an instruction, and I can repeat it, but the meaning doesn't land for six seconds. Like a bad dub."

  The group went quiet. Then, heads nodded. Pencils scribbled on notepads.

  "Echo Lag," someone whispered. "That's exactly it."

  By the next month, "Echo Lag" was a common term in the group chat. People were reporting it. *Do you experience Echo Lag? Yes/No.* Elias felt a strange pride. He had named a piece of his pain. He had helped others see it in themselves. It made the condition feel more real, more solid. If they could name it, it had to be biological. It had to be *out there*, waiting to be found.

  Six months after the initial diagnosis, Elias returned to Dr. Aris for his follow-up. The office was the same, but the clipboard was different.

  "We've updated the intake questionnaire," Dr. Aris said, sliding a fresh sheet across the desk. "The DSM-5 revision is still pending, but our clinic is adjusting the Type 4 criteria based on patient reporting trends."

  Elias scanned the paper. The old checklist was there—distractibility, time blindness, impulsivity. But there was a new section at the bottom. *Sensory-Processing Delays.*

  He ran his finger down the list.
  *Item 14: Difficulty transitioning between physical spaces (Doorway Freeze).*
  *Item 15: Auditory processing latency (Echo Lag).*

  Elias stopped. He looked up at Dr. Aris. "You added these."

  "We're seeing a significant cluster of patients reporting them," Aris said, typing something into his computer without looking up. "Initially, we thought Type 4 was purely executive function. But the patient community has been very articulate about sensory latency. It's changed how we view the phenotype. We're seeing a lot more of it now that we know to ask."

  Elias sat back. The chair creaked.

  "So," Elias said. "Did I have Echo Lag before I named it?"

  Dr. Aris paused. His hands hovered over the keyboard. He looked at Elias, really looked at him, with a tired sort of kindness. "That's the question, isn't it? You had the experience. But was it a symptom of AAV, or was it just... noise? Until you gave it a name, it didn't count. Now that it counts, you notice it more. Which makes the data stronger. Which makes the diagnosis more accurate."

  "But I told Sarah about it," Elias said. "And she told ten other people. And now it's on the form."

  "Science is iterative, Elias."

  "It feels like I'm chasing a mirror," Elias said. "I looked in the glass, and I saw a shape. So I carved the glass to match the shape. Now the glass says the shape is real."

  Dr. Aris capped his pen. "Does it help? The new label?"

  Elias thought about the last week. He had caught himself pausing at a doorway. Before, he would have just walked through, annoyed at his own clumsiness. Now, he paused and thought: *This is a Doorway Freeze.* He felt a surge of validation, followed immediately by a surge of performance. He stood there for a second longer than necessary, ensuring he felt the Freeze correctly, ensuring it matched the definition.

  "It helps," Elias said. "It makes me feel less alone."

  "Good."

  "But," Elias said, tapping the paper where *Echo Lag* was printed in bold. "I'm worried that next year, someone else is going to name something else. And the definition of *me* is going to change again."

  Dr. Aris shrugged, a small, helpless movement. "That is the nature of interactive kinds, Elias. We classify people, and people react to the classification. We aren't classifying rocks. The rocks don't read the geology textbook."

  Elias picked up the pen. He hovered over Item 15.

  If he checked the box, he confirmed the symptom. He validated the category. He made it real for the next person who sat in this chair. If he left it blank, maybe the symptom would fade, or maybe it would just go unnamed again, returning to the noise.

  He realized he wasn't just being diagnosed anymore. He was co-authoring the manual.

  "Elias?"

  Elias pressed the pen to the paper. The ink bloomed into a dark, permanent circle around *Yes.*

  "It's real," Elias said, mostly to himself.

  "It is now," Dr. Aris replied softly.

  Elias handed the clipboard back. He walked out of the office and into the hallway. He stopped at the threshold of the elevator. He felt the hesitation. He waited for the weight on his sternum, the Doorway Freeze. It was there, waiting for him to acknowledge it.

  He stepped through, but he couldn't tell if he had overcome the symptom, or if he had simply decided, for the sake of the data, to walk.
