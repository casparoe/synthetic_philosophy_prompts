answer: |-
  Good evening, everyone. Thank you for being here to celebrate eighteen years of [Daughter's Name].

  When you look at a young woman standing on the threshold of adulthood, you see the sum of her moments. The late nights, the early mornings, the laughter in this very room, and the quiet victories that no one else saw. But as her parent, I also see the moments that came before.

  There is a story about how [Daughter's Name] began that most of you don't know. Before she was conceived, we were given a choice by doctors. We were told that if we waited, the odds were high we would have a healthy child. If we didn't wait, the odds were high she would be born with the condition she has lived with ever since.

  We didn't wait.

  I tell you this not to burden her, and not to burden you. I tell you this because for eighteen years, I have had to find the right words to explain why we made that choice, and what it means to love her.

  I won't stand here and pretend it has been easy. It hasn't. There have been hospital corridors at 3:00 AM. There have been therapies that felt like climbing mountains. There have been days where the worry was a physical weight in the room. To say otherwise would be a lie. It has been hard work, and it has been scary, and there were times we were tired down to our bones.

  But I also need to be careful about how I say what comes next.

  There is a temptation to say, "Look at you now, and know that it was all worth it." Or to say, "We chose you, and we're glad we didn't have a different, healthier daughter." But that isn't true. And I owe you the truth.

  If we had waited, we wouldn't have had a healthier version of *you*. We would have had a different child entirely. A stranger. The choice wasn't between a healthy you and the you we know. The choice was between *you*, with all your brilliance and your challenges, and *no one at all*.

  We didn't choose you because your life is easier than the alternative. We chose you because we wanted *you*. We wanted the specific, irreplaceable person who is standing right there. We accepted the cost of your existence because your existence was the only thing that mattered.

  And look at who that existence produced. You are witty, and fiercely loyal, and you have a way of reading a room that puts adults half your age to shame. You have navigated a world not built for you with a grace that humbles me. You are not a compromise. You are not a "despite everything" story. You are the point.

  To my friends in the back who know the philosophy of this: I hope I've gotten the logic right. But to [Daughter's Name]: I hope you feel the love.

  We love you not because you overcame your beginning, but because you are the continuation of it. We love you because you are here.

  So, if everyone could please raise a glass.

  To [Daughter's Name]. Not for how she started, but for exactly who she is. Happy 18th Birthday.
