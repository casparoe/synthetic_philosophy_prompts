answer: |-
  Your skepticism is well-founded. While your friend is correct that the **Condorcet Jury Theorem (CJT)** is a real mathematical concept, his application of it to the legal system is a classic case of "model error"—taking a mathematical model and applying it to the real world without checking if the real world meets the model's strict assumptions.

  Here is the breakdown of why the theorem exists, why your friend's conclusion ("bigger is always better") is mathematically flawed, and why the legal system prefers 12 deliberating humans over 1,000 voting apps.

  ### 1. The Math: The "Greater Than 50%" Trap
  The Condorcet Jury Theorem states that if a group votes by majority rule, the probability of the group making the correct decision increases as the group gets larger **BUT ONLY IF two specific conditions are met:**

  1.  **Independence:** Each voter decides independently (no collusion, no influencing each other).
  2.  **Competence:** Each individual voter is more likely to be right than wrong (probability $p > 0.5$).

  **Here is where your friend is mathematically wrong:**
  He claimed accuracy increases "no matter what." That is false. The theorem explicitly states that if the average voter is *less* likely to be right than wrong ($p < 0.5$), adding more people makes the verdict **statistically guaranteed to be wrong** as the group grows.

  If you crowdsource a verdict to 1,000 random people on an app, do they each have a $>50\%$ chance of understanding "preponderance of evidence" or "hearsay"? If the case is complex and the average random person is essentially guessing (or worse, biased), a jury of 1,000 would be *less* accurate than a jury of 12.

  ### 2. The "Independence" Assumption vs. Deliberation
  The CJT assumes voters cast ballots in isolation. However, the American jury system is not designed as a voting machine; it is designed as a **deliberative body.**

  *   **The App Model (CJT style):** 1,000 people vote independently. This satisfies the math, but it ignores the value of discussion.
  *   **The Jury Model:** 12 people are locked in a room and forced to talk.

  Why does this matter? Because deliberation changes the "competence" ($p$) variable.
  *   **Pros:** One juror might have noticed a detail in a photo another missed. A lawyer might explain a legal instruction that clears up confusion. This raises the group's collective $p$.
  *   **Cons:** Groupthink, dominant personalities, or fatigue (which you experienced!) can lower $p$.

  The legal system accepts the risk of groupthink because the benefit of **shared reasoning** is viewed as more important than raw statistical aggregation. A verdict isn't just an outcome; it's a community judgment that requires consensus.

  ### 3. Attention and Vetting (The "Random Crowd" Problem)
  For the CJT to work, the voters must actually engage with the information.
  *   **The 12-Person Jury:** You were sequestered (effectively). You couldn't look at your phone, you had to listen to 4 days of testimony, and you were vetted (*voir dire*) to ensure you didn't have a conflict of interest or extreme bias.
  *   **The 1,000-Person App:** How do you ensure 1,000 random people actually watch the 4 days of testimony? If they vote based on a 30-second TikTok summary or a headline, their competence ($p$) drops below 0.5, and the theorem flips against you.

  Furthermore, a crowd is susceptible to **external manipulation.** A 12-person jury is shielded from public opinion. A 1,000-person "crowd jury" could be swayed by media campaigns, social media bots, or public outrage before they even vote.

  ### 4. Binary Choices vs. Nuanced Truth
  The CJT works best on binary questions (True/False). While verdicts look binary (Guilty/Not Guilty), the path to get there is not.
  *   Jurors often have to weigh credibility, intent, and reasonableness.
  *   In a crowd vote, nuance is lost. In a deliberation room, a holdout juror can force the group to re-examine a specific piece of evidence. That "friction" slows things down (draining, as you noted), but it acts as a safeguard against rushing to judgment.

  ### 5. Legitimacy vs. Accuracy
  Finally, your friend is assuming the *only* goal of a trial is statistical accuracy. It isn't. The goal is **legitimacy.**

  *   **Due Process:** A defendant has a right to be judged by a "jury of their peers." There is a philosophical belief that the state should not be able to punish a citizen unless 12 ordinary people, after careful thought, agree it is necessary.
  *   **Accountability:** If 12 people sign a verdict, they own it. If 1,000 anonymous app users vote, who is responsible for a miscarriage of justice?
  *   **Minority Protection:** In a pure vote, the majority crushes the minority. In deliberation, a minority of one can hang a jury. This forces the state to either prove its case better or drop it. This is a feature, not a bug, designed to protect the accused from the "tyranny of the majority."

  ### The Verdict on Your Friend's Theory
  Your friend is **half-right but mostly wrong.**

  *   **Right:** Diversity of opinion generally improves decision-making, and small groups are susceptible to outliers.
  *   **Wrong:** He ignored the critical assumption that voters must be competent ($p > 0.5$). He also ignored that the legal system values *deliberation* over *aggregation*.

  A 1,000-person crowd would likely be faster and cheaper, but it would be more volatile, easier to manipulate, and less engaged. The 12-person jury is indeed a compromise, but it's a compromise between **efficiency** and **due process**, not just a failed attempt at statistical optimization.

  So, you can rest easy: Your 4 days of draining service weren't statistically inferior to an app. They were part of a system designed to value human judgment over raw data.
