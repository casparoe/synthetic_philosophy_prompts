prompt: |-
  Ok so I just finished jury duty for the first time last week (four day civil trial, honestly kind of draining) and afterward a few of us went out for drinks and ended up talking about how the whole verdict thing actually works statistically. One of the other jurors, who studied econ, brought up something called the "Condorcet Jury Theorem" and said it mathematically proves that the more people you add to a jury, the more likely the verdict is to be correct, no matter what, as long as you keep adding people. His whole point was that our 12-person jury is basically an outdated compromise, and that a smarter system would crowdsource verdicts from like a thousand random people voting on an app instead, since a bigger "jury" statistically has to be more accurate then a dozen strangers stuck in a room.

  It's been bugging me alot since, so I looked it up and there really is an actual theorem by that name in voting theory, which made me second guess myself. Is my friend basically right that we're leaving accuracy on the table with small in-person juries, and the only reason we don't just crowdsource verdicts from huge anonymous crowds is tradition and logistics? Or is he missing something about what the theorem actually requires that would make it not apply the way he thinks?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user just finished jury duty (4-day civil trial).
      *   **Situation:** Post-trial drinks with fellow jurors.
      *   **Claim:** An econ-studying juror claimed the Condorcet Jury Theorem (CJT) proves bigger juries are *always* more accurate, suggesting a 1000-person app-based crowd would be better than 12 people in a room.
      *   **User's Doubt:** The user looked up the theorem, sees it exists, but is skeptical about the application.
      *   **Core Question:** Is the friend right (small juries are outdated, crowdsourcing is statistically superior), or is he missing critical assumptions/nuances?

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *What is it?* A mathematical theorem by Marquis de Condorcet (1785).
      *   *The Core Premise:* If each voter has an independent probability $p > 0.5$ of making the correct decision, then the probability of the majority making the correct decision approaches 1 as the number of voters approaches infinity.
      *   *The Flip Side:* If $p < 0.5$, adding more voters makes the outcome *worse* (approaches 0 accuracy).
      *   *Key Assumptions:*
          1.  **Binary Choice:** There are only two options (Guilty/Not Guilty, True/False).
          2.  **Independence:** Voters decide independently (no collusion, no influence).
          3.  **Competence:** Each voter is more likely to be right than wrong ($p > 0.5$).
          4.  **Sincere Voting:** Voters vote for what they believe is true, not strategically.

  3.  **Evaluate the Friend's Argument against the Theorem's Assumptions:**
      *   *Claim:* "More people = more accurate no matter what."
      *   *Correction:* Only true if $p > 0.5$. If the average juror is incompetent ($p < 0.5$), a huge jury is *disastrous*.
      *   *Claim:* "Crowdsource from 1000 random people on an app."
      *   *Problem 1 (Independence):* In a deliberating jury, independence is violated (by design). In a crowd app, independence might be preserved, but...
      *   *Problem 2 (Competence):* Do 1000 random app users have $p > 0.5$? A selected jury undergoes *voir dire* to ensure minimum competence/impartiality. Random app users might not care, might be biased, or might not understand the legal standard.
      *   *Problem 3 (Binary Choice):* Legal verdicts aren't always simple binary facts. They involve applying law to facts.
      *   *Problem 4 (Deliberation):* The CJT assumes voting. The US system values *deliberation*. Discussion can change $p$. It can raise it (sharing info) or lower it (groupthink). CJT doesn't model discussion.

  4.  **Identify Legal and Practical Realities (Beyond the Math):**
      *   **Due Process:** Defendants have a right to confront accusers, see evidence, etc. A crowd app doesn't fit the adversarial system.
      *   **Reasoned Verdicts:** Juries often need to explain or stand by their decision. A crowd vote is a black box.
      *   **Minority Voices:** Deliberation allows a minority to persuade the majority. Pure voting silences minorities.
      *   **Attention/Engagement:** 12 people are sequestered/forced to pay attention. 1000 app users might click while watching TV.
      *   **Manipulation:** A crowd is easier to sway by media/public opinion than a sequestered jury.

  5.  **Synthesize the Answer:**
      *   **Validation:** Acknowledge the user's skepticism. It's well-founded.
      *   **Explain CJT Simply:** Define the theorem and its conditions ($p > 0.5$, independence).
      *   **Debunk the "No Matter What" Claim:** Highlight the $p < 0.5$ risk.
      *   **Address the "Crowdsourcing" Idea:**
          *   *Independence vs. Deliberation:* Juries are *supposed* to talk. CJT assumes independent votes.
          *   *Competence:* Random crowd vs. vetted jurors.
          *   *Attention:* 4 days of evidence vs. scrolling on a phone.
      *   **Legal/Philosophical Purpose:** It's not just about accuracy; it's about legitimacy, community representation, and checking state power.
      *   **Conclusion:** The friend applied a mathematical model too broadly without checking its assumptions against legal reality.

  6.  **Refine the Tone:**
      *   Empathetic (jury duty *is* draining).
      *   Informative (explain the math clearly).
      *   Balanced (acknowledge where the friend has a point—diversity helps—but where he's wrong).
      *   Authoritative but accessible.

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, does CJT require independence?* Yes, strictly speaking. But juries deliberate. Does deliberation help or hurt? Research is mixed. Some say it improves $p$, some say groupthink lowers it. I should mention this tension.
      *   *Is the verdict binary?* Technically yes (Liability/No Liability, Guilty/Not Guilty), but the *path* to get there involves weighing many factors.
      *   *What about the "Wisdom of Crowds"?* That's related but different (Surowiecki). CJT is specific to voting accuracy. I should distinguish or keep it focused on CJT to avoid confusion. Let's stick to CJT as requested.
      *   *The "p > 0.5" assumption:* This is the killer argument. If the case is complex, random people might be *worse* than coin flips.

  8.  **Final Structure:**
      *   Intro: Validate the feeling, confirm the theorem exists.
      *   The Math (The "Yes, but..."): Explain the $p > 0.5$ condition and Independence.
      *   The Legal Reality (Why 12?): Deliberation, Attention, Vetting.
      *   The "Crowd" Problem: Bias, Manipulation, Lack of Accountability.
      *   Conclusion: Friend is half-right on math, wrong on application.

  9.  (Drafting the response based on these points...) *Self-correction: Make sure to emphasize that the friend said "no matter what." That is mathematically false.*

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction during final review)*: I need to make sure I don't get too bogged down in the math formulas. Keep it conceptual. Emphasize that the legal system values *process* over pure statistical accuracy.

