          *   Science (including AI economics) cannot choose the goal.
      *   *Conclusion:* Carnap would be a "Critical Technocratic Liberal" (in the philosophical sense). He would support planning *if* it proves fruitful for agreed-upon ends, but he would refuse to declare it morally "True."

