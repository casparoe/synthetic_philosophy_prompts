answer: |-
  Good morning. For those of you who don't know me, I'm a colleague of Herb's from the philosophy department.

  When Herb's daughter asked me to speak, she gave me a specific warning. She told me that Herb had left strict instructions regarding Skolem's Paradox. Apparently, he had overheard someone at a dinner party once describe a life as "uncountably rich," and he spent the rest of the evening in a state of mild distress. He told her that if anyone used his favorite paradox as a greeting card metaphor at his funeral, he would find a way to haunt the proceedings.

  So, I have a mandate. I need to get the logic right, or I'll be hearing about it from beyond the grave. And knowing Herb, getting it right matters more than the comfort. But I think, if we honor the precision, the comfort will follow.

  For the logicians in the room, you know the territory. For everyone else, I'll do my best. Skolem's Paradox arises from the Löwenheim-Skolem theorem. It tells us that if a theory like standard set theory has a model, it has a countable model. This leads to a strange situation: You can have a model of set theory that is itself countable from the outside, yet inside that model, there are sets that the model claims are uncountable.

  It sounds like a contradiction. It isn't. The resolution is that "countability" is not absolute; it is relative to the model. A set is uncountable *inside the model* if there is no bijection—a one-to-one mapping—between that set and the natural numbers *that exists inside the model*. From the outside, we can see that the whole domain is countable. We can see the mapping. But that mapping is not an element of the model itself. The bridge exists, but it isn't in the room.

  Herb loved this because it dismantled arrogance. It taught that what looks complete from one perspective might look limited from another, and both views can be formally correct.

  How does this help us today? Well, Herb hated the phrase "uncountably rich" because it treats mathematical rigor like poetry. It's cheap. It suggests his life was big just for the sake of saying it was big. But the paradox offers something sturdier than a compliment.

  From the outside, looking at the facts of a lifespan, Herb's time here was finite. It is a countable set of days, years, and classes taught. From the outside, the story is closed. The domain is bounded. That is the cold view of mortality. It is the view from the metatheory.

  But we are not on the outside. We are inside the model.

  We are the students, the colleagues, the family, the friends who shared the axioms of his daily life. And from inside here, the set of his influence does not admit a mapping to anything finite. We cannot list the implications of his kindness, his corrections, his patience. We cannot construct the function that reduces his impact to a summary. That bijection does not exist within our experience of him.

  To say his life was "infinite" is sloppy. To say that the measure of him is relative to where you stand is precise. And it is comforting, because it validates our grief. The pain we feel—the sense that something vast is missing—is not an error in our calculation. It is a feature of the system we inhabit.

  Herb taught us that truth depends on the framework you occupy. In the framework of death, he is gone. In the framework of this community, he is present, and the sets he generated are still expanding. The fact that these two truths coexist without contradiction is not a bug in the universe; it is how we survive the loss.

  He wanted us to be precise because precision is a form of respect. Vague platitudes dissolve under pressure. Rigor holds. So, I will not tell you that his memory will live forever. I will tell you that within the model of this department, and this family, the set of things he changed has no counting function that we can access. We cannot tally it. We cannot close it.

  Herb, we checked the proof. The logic holds. Rest well.
