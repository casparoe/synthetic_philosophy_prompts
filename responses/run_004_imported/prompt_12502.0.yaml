  **SCENE START**

  **INT. MEMORIAL HALL - DAY**

  The room is hushed. Eighty chairs, mostly filled. In the second row, a cluster of academics sit with posture that suggests they are listening for errors. SARAH (30s), Elena's former student, stands at the podium. She holds a single sheet of paper. She looks at the family in the front row, then shifts her gaze to the mathematicians behind them.

  SARAH
  Elena left instructions for this moment. They were found tucked into her copy of *Foundations of Constructive Analysis*. She wrote: "No existence proofs without witnesses, please. And mind what you do with excluded middle."

  (A faint ripple of laughter from the second row. The family looks confused, but smiling.)

  SARAH
  She meant that we should not claim things are true simply because it would be comforting to assume them. She meant that if we say she is here, we must be able to point to where.

  So. I cannot tell you she is in a better place. I have no witness for that place. I cannot map it. I cannot show you the coordinates.

  But I can tell you she is here.

  (Sarah gestures to the stack of papers on the podium.)

  These are her preprints. They are physical. They contain errors we found together, and corrections she made in red ink. When I read them, I hear her voice. That is a witness.

  I cannot tell you that she loved us all. "All" is a completed infinity, and Elena never trusted a totality she couldn't enumerate. But I can tell you she loved me. I have the evidence. When I was twenty-three and certain I had to leave mathematics, she met me for coffee every Tuesday for six months. She did not tell me I was wrong to quit. She showed me problems she did not know how to solve. She handed me the chalk. She made the work feel like a question rather than a verdict.

  (Sarah pauses. She looks at Elena's brother in the front row.)

  I cannot say she made peace with everyone before she died. I do not have a record of every conversation she had. To claim she died without regrets would be to assert a negative where we lack a method of decision. Some of you argued with her. Some of you stopped speaking to her over the law of excluded middle.

  (She looks at the mathematicians.)

  We know this. It is true.

  But I can say this: When she argued, she was constructing. She was not trying to win. She was trying to build a floor we could all stand on without slipping. She refused to accept a truth just because its absence was impossible. She wanted to see the thing itself. She wanted the object in hand.

  That was difficult. I know. I was yelled at in her office more than once. But it was also honest. In a world that often asks us to accept things on faith—that markets will correct, that illnesses will pass, that justice arrives—Elena insisted on the construction. Show me the path. Show me the number. Show me the reason.

  (Sarah takes a breath. Her voice tightens, just slightly.)

  We are grieving now. I do not say we will move on. I do not know the time required for that sequence to converge. I do not know if the limit exists. I only know the current state. We are here. She is not. The absence is measurable.

  But look at who is in this room.

  (Sarah sweeps a hand across the audience.)

  There are her siblings. There are her students. There are the colleagues who proved theorems with her. We are the witnesses to her existence. As long as we are here, speaking about her, citing her work, correcting her errors, she is not undefined.

  I cannot promise you her legacy will last forever. "Forever" is not a number we can reach. But I can promise you this: I will teach her proofs next semester. I will write her name on the board. I will tell the students why she refused the shortcut.

  That is a constructive act. It is something we can do.

  (Sarah looks down at the paper, then back up.)

  She taught us that truth is not a static property waiting to be discovered in the dark. It is something we light, match by match. We do not assume the sun will rise. We build the fire.

  So we will not say she is at peace. We will say she finished her work. We will not say she watches over us. We will say we carry her notes. We will not say everything happens for a reason. We will say: here is the reason she gave us.

  (Sarah taps the papers.)

  We have the witness.

  Thank you.

  **SCENE END**
