prompt: |-
  So I'm about four drafts into a novel and there's one scene I keep chickening out of writing properly, so I want to nail the substance before I try it in my own voice. Quick context: one of my main characters, Elena, is a mathematician who spent her whole career as a serious, old-school intuitionist in the Brouwer-through-Bishop tradition -- not the soft "I just like concrete examples" version, but someone who genuinely thought that a classical proof by contradiction which asserts something exists without ever constructing it isn't just inelegant -- it hasn't actually proved existence at all -- and she said so in print and lost atleast one long friendship over it. She dies about two-thirds through the book, and among her papers her family finds a short, half-joking instruction for whoever ends up giving the eulogy: "no existence proofs without witnesses, please, and mind what you do with excluded middle." The job falls to her favorite former student, now a professor herself, who has to actually stand up and deliver it at the memorial in front of maybe eighty people -- a third of them mathematicians who knew Elena for decades and would definately clock it if the eulogy cheated.

  What I need is the eulogy itself: the actual words the student says, roughly five minutes read aloud, grieving and warm and a little funny in the way people are when they're eulogizing someone difficult and beloved. The whole book is partly about how this department fights over foundations more than over anything that actually touches their lives, so I don't want this scene to just gesture at "logic people are quirky" -- the constraint has to really bite. So: no "she's in a better place now" (that's asserting existence with no witness in sight), no "either she made peace with her brother before the end or she didn't, and I like to think she did" (that's excluded middle doing emotional work it hasn't earned), and nothing else that only works if you're quietly allowed classical moves Elena spent her life refusing. It still has to land as comfort for the non-mathematicians in the room, who shouldn't have to notice the logic operating under the hood to feel it.

  I did a philosophy minor a hundred years ago and I've been re-reading around BHK semantics and the rejection of double-negation elimination for this chapter, so you don't need to explain the theory to me -- I just need the speech itself, ideally with a stage direction or two if it helps, like where she pauses or where the mathematicians in row two react.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a eulogy scene (the speech itself) for a novel.
      *   **Character:** Elena, a deceased mathematician, strict intuitionist (Brouwer-Bishop tradition). She rejected non-constructive proofs (existence without witness) and the Law of Excluded Middle (LEM).
      *   **Speaker:** Her favorite former student, now a professor.
      *   **Audience:** ~80 people, 1/3 mathematicians (who will catch logical errors), 2/3 non-mathematicians (family, friends, etc.).
      *   **Constraint:** The eulogy must *adhere* to Elena's philosophical constraints. No asserting existence without witness (constructive proof only). No using Law of Excluded Middle (cannot say "either X or not X" unless there's a method to decide which).
      *   **Tone:** Grieving, warm, slightly funny (eulogizing someone difficult/beloved), comforting to non-mathematicians without them noticing the logic constraints, but biting for the mathematicians.
      *   **Length:** Roughly 5 minutes read aloud (approx. 750-900 words).
      *   **Specific Prohibitions:** No "she's in a better place" (existence without witness). No "either she made peace... or she didn't" (LEM).
      *   **Context:** The book is about foundational fights in a math department. This scene needs to show the constraint biting, not just be a quirky gesture.

  2.  **Deconstruct the Logical Constraints for the Speech:**
      *   *Constructivism/Intuitionism:* To say something exists, you must be able to construct it or point to it. You cannot say "There is a reason she loved us" unless you can show the reason. You cannot say "She lives on in our hearts" (metaphysical existence without witness).
      *   *Rejection of LEM:* You cannot assume a proposition is true or false independently of our ability to verify it. You can't say "She either knew how much we loved her or she didn't." You have to say "We know she knew because she said X" or "We do not yet know."
      *   *Negation:* Intuitionists are okay with negation (proof of absurdity), but not double negation elimination (proving existence by showing non-existence is impossible).
      *   *Infinity:* Potential infinity vs. actual infinity. Avoid speaking of completed totals if possible, focus on the ongoing process.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss directly. No metaphysical speculation about where she is. Focus on the physical presence of the memory.
      *   **The Constraint Acknowledgement:** Mention her instruction ("no existence proofs without witnesses"). This signals to the mathematicians that the speaker is playing by the rules.
      *   **Personal Anecdotes (Constructive):** Instead of "She was kind," show specific instances (witnesses). "Here is the letter she wrote," "Here is the theorem we proved."
      *   **Handling Grief ( avoiding LEM):** Don't say "Grief ends" or "Either we move on or we don't." Say "We are grieving now." Focus on the current state, not an undefined future binary.
      *   **The "Afterlife" Problem:** This is the trickiest. Cannot say "She lives on." Can say "Her work continues." The work is the witness.
      *   **Closing:** A commitment to continue the work. A constructive act.

  4.  **Refining the Logic (Self-Correction during drafting):**
      *   *Check:* Did I say "She is watching us"? *Correction:* No, that asserts existence of her consciousness without witness. Say "We feel her absence."
      *   *Check:* Did I say "She either would have laughed or cried"? *Correction:* No. Say "When X happened, she laughed."
      *   *Check:* Did I say "There is no doubt she loved math"? *Correction:* "Doubt" implies a binary state. Better: "Her papers demonstrate her love."
      *   *Check:* Is it warm? Needs to not sound like a logic textbook. The logic must be the skeleton, not the skin.

  5.  **Drafting - Step-by-Step:**

      *   *Stage Direction:* Set the scene. The speaker at the podium. The mathematicians listening closely.
      *   *Opening:* Start with the instruction. It breaks the ice and sets the rules.
      *   *Body Paragraph 1 (The Person):* Describe her via actions. Not "She was generous," but "She gave me time."
      *   *Body Paragraph 2 (The Conflict):* Acknowledge she was difficult. Don't say "She wasn't perfect." Say "She argued."
      *   *Body Paragraph 3 (The Loss):* Address the death. Not "gone to a better place." But "absent from this room."
      *   *Body Paragraph 4 (The Legacy):* The work. The students. This is the constructive witness to her life.
      *   *Conclusion:* A promise to continue. A constructive act.

  6.  **Review against Constraints:**
      *   *Phrase:* "She is in a better place." -> *Avoid.*
      *   *Phrase:* "Whether she knew or not." -> *Avoid.*
      *   *Phrase:* "There exists someone who misses her." -> *Okay, because we are here.*
      *   *Phrase:* "It is not the case that she is not here." (Double Negation) -> *Avoid.* Just say "She is absent."
      *   *Phrase:* "Her spirit lives on." -> *Avoid.* Say "Her theorems remain."

  7.  **Polishing the Voice:**
      *   Needs to sound like a grieving student who knows the math deeply.
      *   Needs to resonate with the family (who might not get the logic jokes but feel the honesty).
      *   Needs to satisfy the math crowd (who will nod at the adherence to intuitionism).

  8.  **Final Walkthrough:**
      *   *Word Count Check:* 5 minutes is roughly 750 words at 150 wpm.
      *   *Tone Check:* Is it too cold? Need to add warmth. The constraint *is* the warmth—honesty over comfort.
      *   *Specific Logic Check:* "We cannot say she is at peace." -> "We know she finished the proof." (Witnessable).
      *   *Specific Logic Check:* "Either we will miss her or we won't." -> "We miss her now."

      *(Self-Correction)*: Wait, I need to be careful with "We know she finished the proof." If she died before finishing, that's a lie. If she died after, it's a witness. Let's assume she died leaving work undone, but the *method* is the witness. Or better, focus on the work that *is* done.
      Actually, the prompt says she died 2/3 through the book. The eulogy is happening now.
      Let's focus on the *impact* that is observable.
      Avoid: "She would have wanted this." (Counterfactual/LEM adjacent).
      Use: "She told me she wanted this." (Witnessed statement).

      *Refining the "Excluded Middle" constraint:*
      Avoid: "She is either here in spirit or she isn't."
      Avoid: "Whether or not we understand her..."
      Instead: "We understand her when we read her notes."

      *Refining the "Existence without Witness":*
      Avoid: "There is a reason for everything."
      Instead: "Here is the reason she gave us."

      *Let's write.*

      *(Drafting mental outline)*
      1. Acknowledge the note.
      2. Define her presence by what is visible (papers, students).
      3. Address the difficulty (she fought hard).
      4. Address the death (absence, not transcendence).
      5. The legacy (continued construction).

      *Wait, one nuance:* Intuitionists reject LEM because truth is identified with provability. So saying "P or not P" is invalid unless we have a proof of P or a proof of not P.
      So, "She either suffered or she didn't" is invalid unless we have evidence.
      "She is happy now" is invalid (no witness of her current state).
      "She is gone" is valid (we observe absence).

      *Let's ensure the emotional beat lands.* The comfort comes from the *certainty* of what remains, not the speculation of what is lost.

      *Stage Directions:* Keep them minimal but effective.

      *Final Polish:* Check the rhythm. Make sure it sounds spoken.

      *(Wait, one more check on the prompt)*: "no existence proofs without witnesses... and mind what you do with excluded middle."
      Okay, I need to make sure the speech *demonstrates* this, not just talks about it.
      Example: Instead of "She loved us all," say "She corrected my proofs on Sundays." (Witness of love).
      Instead of "We will never forget her," (assertion about infinite future), say "I remember her now." (Current state).

      Okay, ready to write.

      *Word Count Target:* ~800 words.
      *Tone:* Respectful, precise, warm.

      *Let's go.*
