      1.  **Rabinowicz and Rønnow-Rasmussen (R&R): Object-given/State-given.** This is the classic distinction. Object-given reasons cite properties of the object of the attitude. State-given reasons cite properties of having the attitude.
          *   *Pros:* Intuitive, widely discussed.
