answer: |-
  Thank you all for being here. For those who knew my mother as a neighbor, a friend, or simply family, you know her as a woman of sharp wit and deep loyalty. For those who knew her as a colleague or student, you know her as a philosopher who spent forty years thinking about what we owe each other.

  My mother's life's work centered on a deceptively simple question: How do we treat one another as human beings?

  She argued that the core of human relationships isn't found in abstract rules or legal judgments. It is found in what she called our "reactive attitudes." These are the natural, emotional responses we have to each other: gratitude when we are helped, love when we are cared for, but also resentment when we are hurt, and indignation when we are slighted.

  She believed that to feel these things—to feel hurt by someone, or to feel grateful to them—is to treat them as a person. It is to say, "You matter enough that what you do affects me."

  The opposite of this, she argued, is what she called the "objective attitude." This is when we stop seeing someone as a participant in a relationship and start seeing them as something to be managed, explained, or fixed. When we say, "Oh, don't mind him, he had a difficult childhood," or "She can't help it, that's just her neurochemistry," we are being kind, but we are also stepping out of the relationship. We are treating the person as a case study rather than a fellow human being.

  Before she died, my mother gave me specific instructions for this moment. She knew she was not an easy woman. She knew that for long stretches of my childhood, she was withholding. She was cutting in arguments. She was slow to apologize.

  She explicitly asked that I not stand here today and explain those things away. She did not want me to tell you that she "couldn't help it" because of her own parents, or her temperament, or the pressures of her career. To do so, she believed, would be to treat her with the objective attitude. It would be to quietly remove her from the human community she valued so much.

  So, I will not excuse her. I will tell you the truth.

  There were times when my mother's coldness hurt me. There were moments where I felt unseen, and yes, times where I felt resentment. For a long time, I thought that admitting that would be disrespectful to her memory. But I have come to realize that withholding that truth would be the real disrespect. It would imply that her actions didn't matter, or that I wasn't important enough to be hurt by them.

  But Strawson's point—and my mother's point—was that resentment is only one side of the coin. You cannot have the capacity for resentment without also having the capacity for gratitude, admiration, and love. They are part of the same fabric.

  And so, I also stand here to say that I am profoundly grateful. I am grateful for the times she showed up when it counted. I am grateful for the fierce intelligence she shared with me, and for the way she demanded that I think for myself, even when it was uncomfortable. I am grateful for the love she gave, which was often expressed not through softness, but through a rigorous demand that I be my best self.

  To my family and friends in the room: I know it might seem strange to hear about resentment at a memorial. But my mother believed that feeling the full weight of our emotions toward someone is the highest form of respect we can pay them.

  To explain her away would be to lose her. To pretend she was perfect would be to lie about her. But to stand here, holding both the hurt and the love, acknowledging that she was responsible for the person she was—that is to keep her in the room with us. That is to treat her as a person, not a memory.

  She taught us that we are responsible for each other. She lived that, she argued that, and today, we honor her by holding her to that standard one last time.

  We miss you, Mom. We are angry that you are gone. And we are deeply thankful that you were here.

  Thank you.
