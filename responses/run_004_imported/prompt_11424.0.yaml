prompt: |-
  My mother, who taught philosophy for almost forty years and spent much of that career writing about moral responsibility in the tradition of P.F. Strawson's "Freedom and Resentment," died ten days ago, and I am giving her eulogy at the memorial service this coming Saturday. The room will be a genuine mix: a dozen or so former colleagues and graduate students who will know exactly what I mean if I mention reactive attitudes or the objective attitude, and a much larger group of relatives, neighbors, and old friends who have never encountered either phrase and are coming simply to grieve a woman they loved.

  Before she died, she left unusually specific instructions about what the eulogy should avoid, instructions that only make sense in light of her own work. She had spent years arguing that resentment, gratitude, and indignation are not verdicts that stand or fall with some further fact about determinism, and that to "explain" a person's coldness or cruelty by pointing to their upbringing or their neurochemistry, however kindly intended, is to quietly stop relating to them as a fellow participant in ordinary human relations and start treating them instead as an object to be accounted for and managed. She knew she had been, by her own admission, difficult for long stretches of my childhood: withholding, cutting in arguments, slow to ever apologize. She explicitly did not want anyone standing up on Saturday to excuse any of that by saying she "couldn't help it," or that she was simply the product of her own cold parents. At the same time, she was just as clear that she did not want a eulogy consisting only of an itemized list of grievances, since on her own view resentment is just one reactive attitude among several, inseparable from the gratitude, admiration, and love that people who knew her well also felt and that she equally wanted acknowledged. I would like a eulogy of about five minutes that manages to hold her responsible for exactly the person she was, in a way that will read as honesty rather than score-settling to the family in the room, and as genuinely faithful to her life's philosophical work to the colleagues in it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Mother, philosophy professor (40 years), specialist in moral responsibility (P.F. Strawson's "Freedom and Resentment").
      *   **Occasion:** Memorial service eulogy (5 minutes).
      *   **Audience:** Mixed. Academics (colleagues/students) who know the jargon (reactive attitudes, objective attitude) + Family/Friends/Neighbors who don't.
      *   **Mother's Character:** Difficult at times (withholding, cutting, slow to apologize).
      *   **Specific Instructions:**
          *   NO excusing her behavior via determinism/upbringing/neurochemistry ("she couldn't help it").
          *   NO itemized list of grievances (score-settling).
          *   MUST hold her responsible for who she was (honesty).
          *   MUST acknowledge the full range of reactive attitudes (resentment *and* gratitude/love).
          *   MUST be faithful to her philosophical work (Strawsonian).
      *   **Goal:** Balance honesty about her flaws with love, respecting her philosophical stance on human relationships, accessible to laypeople but resonant for philosophers.

  2.  **Deconstruct the Philosophical Core (Strawson):**
      *   *Freedom and Resentment:* Strawson argues against the idea that determinism undermines moral responsibility.
      *   *Reactive Attitudes:* These are the natural human emotions (resentment, gratitude, indignation, love) we feel toward others when we view them as moral agents. They constitute our relationships.
      *   *Objective Attitude:* Viewing someone as an object to be managed, cured, or explained away (e.g., "he's sick," "he had a bad childhood"). This suspends the relationship.
      *   *The Mother's Wish:* She wants to be treated as a *person*, not a *case study*. She wants her flaws to be met with genuine human reaction (hurt/anger), not clinical explanation. She wants her virtues to be met with genuine love, not just polite praise. She wants to remain in the "participant stance" even in death.

  3.  **Determine the Tone:**
      *   Respectful but unflinching.
      *   Warm but intellectually rigorous.
      *   Accessible (translate jargon without dumbing it down).
      *   Personal (needs to sound like a child speaking).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the mixed audience, and the specific nature of her life's work without getting bogged down immediately.
      *   **The Philosophical Hook:** Introduce the core concept (how we treat each other) in plain English first, then hint at the technical terms for the colleagues.
      *   **Addressing the Flaws (The "Hard" Part):** Acknowledge her difficulty. Crucially, *do not explain it away*. Own the hurt. This satisfies the "no excuses" instruction and the "honesty" requirement.
      *   **Addressing the Love (The "Soft" Part):** Balance the hurt with gratitude. This satisfies the "no score-settling" instruction.
      *   **The Synthesis (Strawsonian Payoff):** Explain that feeling *both* is the tribute. To explain her away would be to lose her. To only praise her would be a lie.
      *   **Closing:** A final farewell that reaffirms her status as a moral agent and a loved one.

  5.  **Drafting - Specific Phrasing & Constraints:**
      *   *Constraint Check:* 5 minutes is roughly 600-750 words spoken at a moderate pace.
      *   *Jargon:* Use "reactive attitudes" and "objective attitude" but define them contextually so the family understands.
      *   *The "Excuse" Trap:* Avoid phrases like "she was a product of her time" or "her brain was wired that way." Instead use "she chose," "she was," "we felt."
      *   *The "Score-Settling" Trap:* Ensure the mention of pain is framed as part of the relationship, not a prosecution.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Initial thought:* Maybe quote Strawson directly.
      *   *Correction:* No, keep it personal. Her life *was* the argument.
      *   *Initial thought:* Focus heavily on the academic legacy.
      *   *Correction:* No, the family needs to feel included. The philosophy must serve the memory, not the other way around.
      *   *Key Insight:* The most loving thing the child can do is to be angry *and* loving. That proves she mattered. If I treat her like a patient, I push her away. If I treat her like a mother, I keep her close.

  7.  **Final Polish:**
      *   Check rhythm and cadence.
      *   Ensure the transition between the "difficult mother" and the "beloved mother" is smooth.
      *   Make sure the ending lands emotionally.

  **(Self-Correction Note on Length):** A 5-minute speech is usually around 650-750 words. I need to be concise.

  **(Self-Correction on Tone):** It needs to be dignified. Not too casual, not too dry.

  8.  **Final Review against constraints:**
      *   No determinism excuses? Check.
      *   No grievance list? Check.
      *   Hold her responsible? Check.
      *   Faithful to Strawson? Check.
      *   Accessible? Check.

