      *   **Topic:** The Dogmatism Paradox (Kripke/Harman) vs. Conservation of Expected Evidence (LessWrong/Bayesianism).
      *   **Core Tension:**
          *   *Dogmatism:* If I know $h$, I know any evidence against $h$ is misleading, so I can ignore it.
          *   *Conservation of Expected Evidence:* I cannot predict beforehand that evidence will shift my belief in a specific direction (otherwise I should update now). If I expect to ignore counter-evidence, my current belief is unjustified.
      *   **Constraint:** The joke must *not* work as a generic joke about stubbornness or confirmation bias. It must rely on understanding the specific epistemological puzzle (knowledge closure vs. Bayesian updating).
