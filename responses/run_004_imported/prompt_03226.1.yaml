      *   *Conservation of Expected Evidence:* "If I know where the evidence points, I'm already there." It feels rational from a "probability" perspective but clashes with the intuition of "knowing."
      *   *The Clash:* One says "I can pre-reject counter-evidence." The other says "If you pre-reject counter-evidence, you aren't doing evidence-based reasoning."
      *   *The Setup:* Needs a scenario where a character claims to *know* something and plans to handle future data based on that knowledge.
