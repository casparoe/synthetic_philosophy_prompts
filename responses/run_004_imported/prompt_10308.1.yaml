answer: |-
  Here are ten interview questions designed to press your guest on the limits and coherence of the Fullerian position, structured to escalate in difficulty and specificity.

  1.  **Hart's Poisoner:** In his review of *The Morality of Law*, Hart famously dismissed the eight desiderata as principles of "efficacy" comparable to the "morality of an efficient poisoner"—technical rules compatible with any end, good or evil. You have argued that this analogy fails because law entails a specific purpose that poisoning does not. But if a poisoner *must* also be precise, consistent, and clear to succeed in his aim, why does the *direction* of the intent (killing vs. ruling) transform what looks like technique into morality?

  2.  **Reciprocity Follow-up:** You typically respond to the poisoner objection by pivoting to the idea of reciprocity—that the lawgiver owes a duty to the citizen to make compliance possible. But doesn't this just relocate the moral weight *outside* the eight desiderata themselves? If the morality lies in the *relationship* rather than the *rules*, haven't you conceded that the desiderata are merely the technical means by which that external moral relationship is enacted, rather than being moral in themselves?

  3.  **Unequal Moral Weight:** Let's disaggregate the eight. Congruence between the declared rule and administered action feels like a substantive check on arbitrary power. But clarity or promulgation feel closer to pure craftsmanship. Are you committed to the claim that failing to write clearly is morally equivalent to failing to administer the law as written, or are some desiderata doing heavier moral lifting than others?

  4.  **Hart Concession Follow-up:** If you grant that some desiderata carry a heavier moral load than others, does the thesis survive as a unified "internal morality"? Or does it shrink into a claim that *some* procedural failures facilitate injustice, which is a point Hart could grant without accepting your broader natural law conclusion that there is a necessary connection between law and morality?

  5.  **The Grudge Informer:** Consider the Grudge Informer case: the postwar prosecution of a woman who denounced her husband to Nazi authorities under a wartime statute. On your view, was that Nazi statute *valid law* at the time she invoked it? If you say yes, how does it satisfy the internal morality? If you say no, on which specific desideratum did it fail?

  6.  **Retroactivity Follow-up:** Hart's solution was blunt: admit it was law, but punish her via openly retroactive legislation because safety trumps legality. If your answer leads to punishing her anyway, perhaps by declaring the prior regime lacked legality, is the practical difference between your view and Hart's merely rhetorical? Are you both reaching the same result through different semantic routes?

  7.  **Historical Regimes:** Fuller argued Nazi Germany failed the desiderata, yet colleagues argue Apartheid-era South Africa satisfied all eight about as well as any real legal system ever has, despite its gross injustice. If the internal morality can survive the transition from the chaotic evil of the Nazi regime to the orderly evil of Apartheid, does your theory only condemn *incompetent* tyranny rather than tyranny as such?

  8.  **Modern Regimes:** Push this closer to home: imagine a present-day authoritarian state with a wartime "anti-disinformation" statute. It is clear, prospective, consistently administered, and congruent. It is used to crush dissent. Does this regime satisfy the internal morality? If you insist it must fail one of the eight on close inspection, aren't you risking the falsifiability of your thesis by defining "failure" solely by the presence of injustice?

  9.  **The Counterexample:** Finally, specify concretely: what would a legal system have to look like to count as a decisive counterexample to the internal-morality thesis? Describe a wicked system that perfectly satisfies all eight desiderata.

  10. **Reality Check:** Can you point to anything real or realistic that comes close to that description? If the answer is no, is it because such a system is impossible to construct, or because your definition of the eight desiderata has been refined until it is immune to empirical refutation?
