  # Seminar Handout: The Regress of Determinables
  **Course:** Metaphysical Grounding (Graduate Seminar)  
  **Topic:** Well-Foundedness and the Trilemma of Infinite Descent  
  **Readings:** Fine (2012), Schaffer (2009), Cameron (2008), Bliss (2014)

  ---

  ## 1. The Scenario: Qualitative Gunk

  Consider a concrete object, **Ball $b$**. We are interested in the family of facts concerning $b$'s color. Our ordinary grounding intuition regarding determinables and determinates is robust:

  *   **Grounding Principle (GP):** For any object $x$ and color property $C$, if $x$ has a determinate shade $S$ of $C$, then the fact $[x \text{ is } C]$ is grounded in the fact $[x \text{ is } S]$.
      *   *Example:* $[b \text{ is Red}]$ is grounded in $[b \text{ is Scarlet}]$.

  Standard metaphysics assumes this chain terminates. We assume there is a "maximally specific" shade (a fundamental quality) that has no further determinates. However, consider the following metaphysical possibility, motivated by the continuity of the color spectrum:

  *   **The Hypothesis of Qualitative Gunk:** For every determinate shade $S_n$ that $b$ possesses, there exists a more specific determinate shade $S_{n+1}$ such that $S_n$ is a determinable of $S_{n+1}$. There is no "atomic" shade. The spectrum is infinitely divisible, not just physically, but metaphysically.

  On this hypothesis, we generate an infinite sequence of facts:
  *   $F_0$: $[b \text{ is Colored}]$
  *   $F_1$: $[b \text{ is Red}]$
  *   $F_2$: $[b \text{ is Scarlet}]$
  *   $F_3$: $[b \text{ is Scarlet-17}]$
  *   ...
  *   $F_n$: $[b \text{ has Shade } S_n]$

  According to **(GP)**, $F_0$ is grounded in $F_1$, $F_1$ is grounded in $F_2$, and generally, $F_n$ is grounded in $F_{n+1}$.

  ## 2. The Trilemma

  If we accept the **Hypothesis of Qualitative Gunk**, the orthodox commitment to **Well-Foundedness** (the claim that all grounding chains must terminate in a fundamental base) forces us into one of three positions. Each violates a core theoretical virtue of the grounding framework.

  ### Horn A: Arbitrary Termination (The "Brute" Horn)
  To preserve Well-Foundedness, we must insist the chain stops. We must declare some fact $F_k$ to be **fundamental** (ungrounded).
  *   **The Cost:** $F_k$ is structurally identical to $F_0$. It is a color fact of the same ontological category. By stipulating it is fundamental, we are treating an obviously non-fundamental fact (a determinable shade susceptible to further specification) as though it had no ground.
  *   **Theoretical Violation:** This violates the **Motivation for Grounding**. We posit grounding to avoid brute modal connections. Declaring $F_k$ fundamental makes the link between $F_k$ and its determinable $F_{k-1}$ brute and unexplained, despite $F_k$ offering no intrinsic feature that warrants foundational status.

  ### Horn B: Infinite Descent (The "Regress" Horn)
  We accept that the chain of grounds $F_0 \leftarrow F_1 \leftarrow F_2 \dots$ continues infinitely. Every fact is grounded, but there is no fundamental base.
  *   **The Cost:** This directly denies **Well-Foundedness**. It implies that the "in virtue of" relation never cashes out in a bedrock reality. The existence of $F_0$ is explained by $F_1$, which is explained by $F_2$, *ad infinitum*.
  *   **Theoretical Violation:** This violates the **Asymmetry of Dependence** in a global sense. If nothing is fundamental, then everything is dependent. But if everything is dependent, what supports the chain? (Schaffer argues this renders the world ontologically incomplete).

  ### Horn C: Circularity (The "Loop" Horn)
  To stop the regress without positing a brute foundation, we allow the chain to loop. Perhaps at some point $F_n$ is grounded in $F_0$ (or an earlier member).
  *   **The Cost:** $[b \text{ is Colored}]$ ultimately helps ground $[b \text{ is Scarlet-17}]$.
  *   **Theoretical Violation:** This violates the **Irreflexivity and Asymmetry** of grounding. It implies $F_0$ is more fundamental than $F_n$ and $F_n$ is more fundamental than $F_0$. This collapses the hierarchy grounding was designed to establish.

  ## 3. Analysis: Which Horn is Least Costly?

  Most orthodox grounding theorists (Fine, Schaffer) simply stipulate Well-Foundedness to avoid Horn B, thereby accepting Horn A (insisting there *must* be atomic shades, even if physics suggests otherwise). However, following the minority tradition (Cameron, Bliss), I argue that **Horn B (Infinite Descent)** is the least costly option.

  ### Why Horn A is Unacceptable
  Accepting Arbitrary Termination undermines the explanatory power of grounding. If we can simply stipulate that a chain stops wherever we like to save Well-Foundedness, grounding becomes a tool for dogmatism rather than explanation. In the color case, there is no metaphysical "joint" at $F_k$ that distinguishes it from $F_{k+1}$. Declaring it fundamental is an act of philosophical fiat that contradicts the phenomenological and physical evidence of spectral continuity.

  ### Why Horn C is Unacceptable
  Circularity destroys the hierarchical structure of reality. If grounding is circular, we cannot use it to order ontological priority. It reduces grounding to a form of coherentism, which fails to capture the "building" relation central to the Fine/Schaffer project.

  ### Why Horn B (Infinite Descent) is Preferable
  Accepting an infinite chain of grounds is costly, but it is not *vicious*. As **Ricki Bliss** argues, we must distinguish between *vicious* regresses (which prevent the phenomenon from obtaining) and *benign* regresses (which are merely structurally infinite).

  1.  **Explanatory Sufficiency:** An infinite chain can still provide local explanation. $F_0$ is fully explained by $F_1$, even if $F_1$ is itself explained by $F_2$. The lack of a terminal floor does not negate the validity of the steps in the chain.
  2.  **Preservation of Asymmetry:** Unlike Horn C, Horn B preserves the strict asymmetry of every individual grounding link ($F_{n+1}$ grounds $F_n$, never vice versa).
  3.  **Avoidance of Bruteness:** Unlike Horn A, Horn B does not require us to posit unexplained, brute connections between non-fundamental relata.

  **Conclusion for Discussion:**
  If we take the **Hypothesis of Qualitative Gunk** seriously, Well-Foundedness is not a necessary truth about grounding, but a contingent feature of our specific world (if it holds here at all). To insist on Well-Foundedness *a priori* is to privilege a tidy metaphysical architecture over the structural realities of the facts themselves. For next week, consider: *Is a world with no fundamental base a world where nothing exists? Or is it simply a world where existence is infinitely distributed?*

