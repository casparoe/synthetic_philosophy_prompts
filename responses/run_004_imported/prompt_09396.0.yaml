answer: |-
  Good morning. For those of you who don't know me, I'm [Name]. I'm Walt's grandchild. And apparently, because I'm the one in the family currently pursuing a PhD in philosophy, I have been drafted to speak. I've been told this is a "nice fit." Honestly, standing here, it feels less like a fit and more like a final exam I didn't study for, administered by the two gentlemen in the third row who used to run a logic reading group with Walt. I know you're grading me. I'll do my best.

  But the truth is, Walt would have appreciated the irony. He spent thirty years teaching high school calculus, standing in front of restless teenagers and trying to convince them that limits exist, that functions behave, that there is an order to things. He loved math, but he loved what math *meant* even more.

  If you spent any Thanksgivings with Walt, you know that eventually, the conversation would turn away from politics or football and land, inevitably, on Kurt Gödel. Not the Gödel of the Incompleteness Theorems, though he loved those too. He cared about the Gödel of 1961. The Gödel who wrote letters to his mother after his father died.

  Walt carried a specific argument from those letters for the last decades of his life. He didn't call it faith. He called it a chain of reasoning. He used to say that the world is demonstrably rational and ordered. It is not, as he liked to put it, "a meaningless heap of atoms." And his logic was this: In a rational world, you don't build a complex machine just to smash it before it runs. You don't give a human being a capacity for infinite growth, for love, for understanding, and then simply extinguish it the moment the biology fails.

  To Walt, death cutting a life short wasn't evidence against an afterlife. It was the premise for one. He believed that a genuinely rational universe couldn't let a person's development stop mid-sentence. There had to be a continuation. There had to be a place where the equation balanced.

  I tell you this not to give a lecture, but because this is how Walt grieved. And this is how we need to understand his life, especially the parts that felt unfinished to him.

  We all know Walt wanted more. He wanted to get his PhD in logic. He had the mind for it, everyone says so. But money got in the way, and then kids, and then life. He taught calculus instead. He was a magnificent teacher, but I know, and he knew, that there was a quiet regret there. A sense of a proof left incomplete.

  And then, eight years ago, Grandma died.

  For a long time, Walt's Gödel argument was abstract. It was a dinner party conversation. It was intellectual armor. But after Grandma passed, the word *Wiedersehen*—"seeing again"—stopped being a concept and started being a necessity. That is the thing I want you to know about his hope. It wasn't a hope that ignored the pain of loss. It was a hope built *out* of the pain of loss.

  He didn't smooth over the regret. He didn't pretend he hadn't missed his shot at the doctorate. He didn't pretend that the house wasn't too quiet without Grandma. On his own logic, those unfinished things were the evidence. The ache we feel for what wasn't completed is the rational proof that completion exists somewhere. If this were just a heap of atoms, the regret would be meaningless. But because Walt believed the world was ordered, he believed the regret was a pointer. A vector.

  So, to my cousins, and to his bridge buddies, and to the family who just want Grandpa back: I know this sounds technical. But what it means is simple. Walt didn't believe he was disappearing. He believed he was turning a page. He believed that the love he had for Grandma, and the love he had for all of us, was a quantity that couldn't just be deleted.

  And to the logic group in the third row: I know this isn't a formal proof. I know there are modal objections. But Walt wasn't trying to solve the Entscheidungsproblem. He was trying to live a life that made sense. He defended this reasoning against anybody because he needed it to be sturdy. He needed a theology that wouldn't collapse when he looked at the ceiling at three in the morning.

  He chose to believe that the rational order of the universe demands that we meet again. He chose to believe that the development of a soul, like the graph of a function, continues even when it goes beyond the visible axis.

  I am sad. We are all sad. There is a hole where his voice used to be. But I am trying to look at this the way he taught me to look at math problems. We look at what is given. We are given a man who loved truth, who loved order, who loved his family, and who died with work left undone. If the universe is rational, if it is not a heap of atoms, then that work is not lost.

  He taught us that we shouldn't fear the unknown if we can reason our way toward it. He taught us that an unfinished life isn't a failed life; it's just a life that requires a sequel.

  So, we will miss him here. We will miss the calculus lessons, the Thanksgiving lectures, and the quiet way he watched the people he loved. But if Walt is right—and I think, for his sake, we should let him be—then he isn't gone. He's just working on the next part of the proof. And he's probably already found Grandma.

  Rest well, Walt. *Wiedersehen.*
