answer: |-
  Good evening. For those of you who don't know me, I'm a friend of the bride. And for those of you who *do* know me, you know that [Bride] and I have a standing disagreement.

  We argue about trust. Specifically, we argue about whether a reasoning system can ever truly trust its future self. [Bride] spends her life working on tiling agents and Löb's theorem. In plain English, she studies the mathematical proof that says you cannot stand inside your own mind and logically guarantee that the person you become tomorrow will keep the promises you make today. There is a gap between who you are now and who you will be that no amount of internal reasoning can bridge.

  I've always argued that this is just a limitation of formalism. She argues it's a fundamental feature of reality. We argued about it last week, actually. We didn't resolve it. We won't resolve it tonight.

  And that is precisely why I am honored to stand here.

  Because in a few minutes, [Bride] is going to stand up and do the one thing her own research suggests is logically precarious. She is going to make a claim about her future state of mind. She is going to say, "I promise that my future self will love and honor [Groom]."

  Now, half the room is nodding nervously because they know that, strictly speaking, this vow is unprovable from within her current axioms. The other half is smiling because they know that's what love *is*.

  If [Bride] could prove, with mathematical certainty, that she would love [Groom] forever, it wouldn't be a vow. It would be a prediction. It would be a deterministic output of a static system. And [Groom], you don't want a wife who loves you because her code compiles without error. You want a wife who loves you even though the system cannot guarantee it.

  The Löbian obstacle tells us that self-trust cannot be derived. It must be *adopted*. It is not a conclusion you reach; it is a premise you choose to live by.

  So, I cannot stand here and tell you that their happiness is a theorem. I cannot prove that the sequence of days ahead will be consistent, or sound, or free of error. To claim that would be to ignore the very logic [Bride] holds dear.

  Instead, I want to toast the gap.

  I want to toast the space between the promise and the proof. Because that gap is where freedom lives. That gap is where [Bride] and [Groom] get to wake up every morning and re-derive their commitment, not because they have to, but because they choose to extend the system one more day.

  [Bride], you have spent your career studying the limits of self-modifying systems. Today, you modify your system. You add a new axiom. It is not an axiom of certainty. It is an axiom of faith in the other.

  So, please raise your glasses.

  To the unprovable. To the risk of trusting a future self you cannot fully verify. And to [Bride] and [Groom]: May you never seek a proof where a promise will do. May you find that the only way to overcome the obstacle of the future is to walk into it together, hand in hand, without a guarantee, but with a vow.

  To the bride and groom.
