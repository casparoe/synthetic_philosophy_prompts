      *   *End:* Raise a glass.

      *(Self-Correction on Length)*: A 4-minute speech is roughly 500-600 words. I need to make sure I don't ramble. I need to pace the technical explanation so the family doesn't tune out.

      *(Refining the "Löbian" specific constraint)*: I must ensure I don't just say "we can't predict the future." I need to say "A system cannot prove its own consistency." The vow is an assertion of consistency. The toast must acknowledge that this assertion cannot be *derived* from her current state, but must be *adopted*.

  6.  **Final Polish:** Check the rhythm. Ensure the joke about the argument lands. Make sure the emotional beat hits hard at the end. (The resulting draft looks good. It balances the technical specificity with emotional warmth.)

