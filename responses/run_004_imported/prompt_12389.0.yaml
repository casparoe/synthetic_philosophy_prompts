      *   To avoid indeterminism, one must deny that the shifted field represents a distinct physical state.
      *   This denial is what Earman and Norton later coined "Leibniz Equivalence."

  4.  **Bridge the Gap (The Missing Premises):**
      *   Einstein isn't just making an epistemological point; he's making a *verificationist* or *positivist* move.
      *   *Missing Premise 1 (Verificationism):* If two scenarios are empirically indistinguishable in principle (not just in practice), they are physically identical. (Meaning is tied to verification).
      *   *Missing Premise 2 (Point-Identity):* Spacetime points have no identity independent of the metric/field values coinciding at them. (This is the anti-substantivalist core).
