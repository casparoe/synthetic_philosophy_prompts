      *   *Is the reporter wrong?* No, FPR is a valid fairness concern.
      *   *What about Base Rates?* This is the elephant in the room. If policing is biased, the "ground truth" (reoffending/arrest) is biased. Calibration to biased data perpetuates bias. I need to mention "Garbage In, Garbage Out."
      *   *Pretrial Context:* This is about liberty. False Positives = Jail for innocent people. This makes FPR very important ethically, even if Calibration is statistically "clean."

  6.  **Final Structure:**
