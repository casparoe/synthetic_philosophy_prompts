      *   *Correction:* In Move 3, Marcus is actually making a very Hirschian point. I should acknowledge that Hirsch *does* think most ontology is verbal. So Marcus isn't necessarily wrong about Hirsch's view, but Helen is right that it's a radical conclusion. I need to be careful not to say Marcus is "wrong" about Hirsch, but that his application of it is vulnerable.
      *   *Correction on Move 4:* Helen is channeling Sider here. I should point that out.

  8.  **Final Polish:** Organize with clear headings. Ensure the physics analogy is apt (general covariance vs. invariant quantities).

  *(Self-Correction Note)*: Wait, I need to be careful about Sider. Sider *opposes* quantifier variance. Helen is effectively making a Siderian point in Move 4. Marcus is making a Hirschian point. The user read both. I should highlight that Helen is inadvertently channeling Sider against Marcus's Hirschianism.

