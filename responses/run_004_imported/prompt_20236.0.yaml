      *   *Rank 2 (Anumāna):* Rejected outright by Cārvākas who argued universal connections cannot be perceived, but accepted by most orthodox schools.
      *   *Rank 3 (Śabda):* Vaiśeṣikas and Buddhists often argued this is reducible to inference, claiming we only infer truth from the speaker's reliability.
      *   *Rank 4 (Upamāna):* Buddhists like Dignāga pressed the strongest objection, arguing knowledge from comparison is merely a form of inference based on similarity.

