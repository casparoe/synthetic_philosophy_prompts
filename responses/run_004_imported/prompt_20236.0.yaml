      *   **Task:** Rank these four from "most robust" (held up best against classical objections) to "most contested" (most persistently challenged).
      *   **Context:** Rival schools (Cārvāka, Buddhist, Vaiśeṣika, Sāṅkhya, Mīmāṃsaka) accepted fewer or more *pramāṇas*, arguing some are reducible or unreliable.
      *   **Requirement:** For each contested *pramāṇa*, note which rival school pressed the strongest objection and what that objection was.
      *   **Format:** JSON block with specific keys (`rank_1_most_robust`, `rank_2`, `rank_3`, `rank_4_most_contested`), each containing `pramana` and `note` (1-2 sentences).
      *   **Constraint:** The user wants a ranking based on historical philosophical debate intensity regarding their independence/necessity.

  2.  **Evaluate the *Pramāṇas* based on Historical Debate:**

      *   **Pratyakṣa (Perception):**
          *   Almost universally accepted. Even Cārvākas (materialists) accepted perception as the only valid *pramāṇa*. Buddhists, Sāṅkhya, Vaiśeṣika all accept it.
          *   Objections: Mostly about the *nature* of perception (nirvikalpa vs. savikalpa), not its existence as a *pramāṇa*.
          *   Robustness: Highest. Everyone agrees we know things through senses.

      *   **Anumāna (Inference):**
          *   Accepted by Nyāya, Vaiśeṣika, Sāṅkhya, Yoga, Mīmāṃsā, Buddhists.
          *   Rejected by Cārvāka (they argued inference is fallible because the universal connection (*vyāpti*) cannot be perceived).
          *   Robustness: Very high, but slightly less than perception because Cārvākas rejected it entirely. However, among astika (orthodox) schools, it's standard.

      *   **Śabda (Verbal Testimony):**
          *   Accepted by Nyāya, Mīmāṃsā, Vedānta, Sāṅkhya, Yoga.
          *   Rejected/Reduced by Buddhists (sometimes accepted as inference-based) and Cārvākas.
          *   Vaiśeṣika often reduces it to inference (knowing the speaker is reliable -> inferring the truth).
          *   Robustness: Moderate. Many accept it, but its independence is often challenged (is it just inference?).

      *   **Upamāna (Comparison/Analogy):**
          *   Accepted by Nyāya and Mīmāṃsā (sometimes).
          *   Rejected/Reduced by almost everyone else.
          *   Buddhists (Dignāga/Dharmakīrti) reduce it to inference (*anumāna*).
          *   Vaiśeṣika reduces it to perception and testimony.
          *   Sāṅkhya reduces it to inference.
          *   Cārvāka rejects it.
          *   Robustness: Lowest. It is the most frequently targeted for reduction or elimination.

  3.  **Determine the Ranking:**
      1.  *Pratyakṣa* (Most robust - universally accepted).
      2.  *Anumāna* (Very robust - rejected only by Cārvāka, but independence rarely challenged by orthodox schools).
      3.  *Śabda* (Contested independence - Vaiśeṣika/Buddhists often reduce it to inference).
      4.  *Upamāna* (Most contested - almost everyone tries to reduce it to inference or perception).

      *Self-Correction on Śabda vs. Upamāna:*
      *   *Upamāna* is famously the "odd one out" that Nyāya defends vigorously against reduction.
      *   *Śabda* is accepted by most orthodox schools as independent (especially Mīmāṃsā), but Buddhists and Vaiśeṣikas challenge its independence.
      *   *Upamāna* is generally considered the most vulnerable. So *Upamāna* should be Rank 4.
      *   *Śabda* is Rank 3.
      *   *Anumāna* is Rank 2 (Cārvāka rejection is significant, but among those who accept epistemology beyond senses, it's solid).
      *   *Pratyakṣa* is Rank 1.

  4.  **Drafting the Notes (incorporating rival schools and objections):**

