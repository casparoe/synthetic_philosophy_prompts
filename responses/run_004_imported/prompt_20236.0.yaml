    "rank_1_most_robust": {"pramana": "<name>", "note": "<1-2 sentences>"},
    "rank_2": {"pramana": "<name>", "note": "<1-2 sentences>"},
    "rank_3": {"pramana": "<name>", "note": "<1-2 sentences>"},
    "rank_4_most_contested": {"pramana": "<name>", "note": "<1-2 sentences>"}
  }
  ```
