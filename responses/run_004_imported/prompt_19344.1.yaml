answer: |-
  The glass urn sits on the pedestal between them, illuminated by a single overhead lamp. Inside, the ninety balls are still. Thirty are bright, matte Red. The other sixty are a murky mix of Black and Yellow, hidden from view.

  Marcus taps his pen against his notepad. He's already filled out his slip. Lena is staring at the urn, two slips in her hand.

  **Marcus:** You're hesitating. Just pick a prior. It's not hard. Sixty unknown balls. Symmetry suggests thirty Black, thirty Yellow. So it's thirty Red, thirty Black, thirty Yellow. One-third each.

  **Lena:** Symmetry isn't data, Marcus. I know there are thirty Reds. That's hard knowledge. The other sixty? That's a black box. I'm betting Red over Black.

  **Marcus:** (Sighs) Okay. So you're implying your subjective probability for Black is less than one-third.

  **Lena:** I'm implying I don't *have* a subjective probability for Black. I have a range. Zero to two-thirds.

  **Marcus:** You can't act on a range. You have to place a bet. You have to collapse the wave function.

  **Lena:** Watch me. (She marks the first slip: *Win $100 if Red*. Leaves the *Win $100 if Black* slip blank.) Now, the second pair. Bet A: Win if Red or Yellow. Bet B: Win if Black or Yellow.

  **Marcus:** Standard Ellsberg setup. If you prefer Red over Black, consistency demands you prefer Red-or-Yellow over Black-or-Yellow. Because the Yellow component is common to both. The Sure-Thing Principle. If you prefer Red to Black regardless of whether Yellow wins or loses, you should prefer the bundle containing Red.

  **Lena:** (Marking the second slip: *Win $100 if Black or Yellow*.) I'm taking Black-or-Yellow.

  **Marcus:** You just contradicted yourself. In the first bet, you acted like Black was less likely than Red. In the second, you're acting like Black is *more* likely than Red. Because if Black-or-Yellow is better than Red-or-Yellow, that means Black is better than Red, holding Yellow constant.

  **Lena:** I'm not holding Yellow constant. In the first bet, Yellow is a loss in both cases. In the second, Yellow is a win in both cases. The *ambiguity* shifts. When Yellow is a loss, I'm exposed to the unknown split between Black and Yellow. When Yellow is a win, the unknown split protects me.

  **Marcus:** That's post-hoc rationalization. Do you realize what you've just admitted? You've violated Savage's axioms. Specifically, P2. And do you know what Raiffa showed us happens to people who violate the axioms?

  **Lena:** I know the lecture. The Dutch Book. The Money Pump.

  **Marcus:** It's not a lecture, Lena. It's a guarantee. If I take you seriously, I can drain your bank account. I start you with the Black bet. You prefer Red, so you pay me a dollar to switch to Red. Then I offer you to switch to Red-or-Yellow. You prefer Black-or-Yellow, but I can structure the trades... I can walk you in a circle. You'll end up with your original bet but less money. You are paying for the privilege of being incoherent.

  **Lena:** You're assuming the world is static. That the "game" is just the bets.

  **Marcus:** The game is the money. If you end up with less money, you lost. Rationality is about not losing.

  **Lena:** Rationality is about not being exploited *given your goals*. My goal isn't just maximizing expected value based on a single number. My goal is robustness. I'm operating under a set of priors, Marcus. A set. Zero to sixty Black balls. I evaluate the bet based on the *worst-case* prior in that set. Maxmin Expected Utility.

  **Marcus:** And that maxmin rule is exactly what opens you to the pump. Because your worst-case scenario flips depending on how I frame the bet.

  **Lena:** No. My worst-case scenario is consistent: I assume nature is adversarial within the bounds of the known information. In the Red vs. Black bet, nature minimizes my win by making Black zero. So Red wins. In the Red-Yellow vs. Black-Yellow bet, nature minimizes my win by making Yellow zero... wait, no. If I bet on Black-Yellow, nature makes Black zero. But I still have Yellow.

  **Marcus:** You see? You're shifting the probability mass depending on the act. That's the incoherence.

  **Lena:** It's not incoherence. It's a premium. Look at the Money Pump again. To pump me, you have to offer me sequential trades. You're asking me to update my beliefs based on the offer itself. But I don't update my beliefs Bayesianly when the information is ambiguous. I treat the *structure of the trade* as part of the ambiguity.

  **Marcus:** So you just refuse to trade?

  **Lena:** I refuse to accept your framing that my preferences must map to a single additive measure. The Dutch Book argument proves that if I act like a Bayesian, I'll lose money. I *don't* act like a Bayesian. So the Dutch Book doesn't apply. It's like telling a fish it's irrational for not climbing a tree.

  **Marcus:** It's not about climbing trees. It's about logic. If you prefer A to B, and B to C, you cannot prefer C to A. That's transitivity. The Money Pump exploits the violation of transitivity induced by your ambiguity aversion. You're saying you'd rather lose a dollar than admit you don't know the odds.

  **Lena:** I'm saying I'd rather lose a dollar than pretend I know the odds when I don't. That dollar isn't a "loss" in my utility function, Marcus. It's an insurance premium.

  **Marcus:** Insurance against what? The balls don't change. The urn is what it is.

  **Lena:** Insurance against *model risk*. You're assuming the urn is the only uncertainty. I'm assuming the *model I use to describe the urn* is uncertain. If I force myself to pick a single probability for Black, I am exposed to the risk that my assignment is wrong. By hedging—preferring the known risk (Red) over the unknown (Black), and then preferring the bundle that covers the unknown (Black-Yellow)—I am minimizing my exposure to being wrong about the distribution.

  **Marcus:** But you *are* wrong about the distribution if you assign different implicit probabilities to the same color in the same breath.

  **Lena:** I'm not assigning probabilities. I'm assigning *values to acts*. The value of the act depends on the information available. In the first bet, the information is "30 Reds." In the second, the information is "60 Non-Reds." The ambiguity is in the partition. You want me to ignore the partition and treat the states as fixed. I can't. The source of the uncertainty matters.

  **Marcus:** (Leans in, voice dropping) Raiffa would say you're just stubborn. That if I lock you in a room and make the stakes high enough, you'll drop the ambiguity aversion and pick a number.

  **Lena:** If you lock me in a room and threaten me, my utility function changes. That's not a revelation of my true priors; that's coercion. Look, Marcus. You believe the Sure-Thing Principle is a law of thought. I believe it's a law of *risk*, not *ambiguity*. When the probabilities are known, I follow Savage. When they aren't, I follow Gilboa-Schmeidler.

  **Marcus:** So you have two rulebooks?

  **Lena:** I have one rulebook: *Don't trust the map more than the territory.* Your map says there's a probability for Black. The territory says there's just a pile of balls.

  **Marcus:** And the cost of that philosophy is that you are vulnerable to a Money Pump. You will literally pay to go in circles.

  **Lena:** Only if I let you define the circle. If I recognize the pump, I stop trading. I am resolute. I commit to my strategy ex-ante. I know I prefer Red to Black, and Black-Yellow to Red-Yellow. I also know that if you try to swap me back and forth, you're trying to arbitrage my ambiguity aversion. So I don't swap.

  **Marcus:** That's ad-hoc. You're saying "I have these preferences, unless someone tries to exploit them, in which case I change my preferences."

  **Lena:** No. I'm saying my preference is for *robustness*. The "loss" from the pump is the price of maintaining that robustness in a dynamic setting. If the cost of the pump exceeds the value of the insurance, I'll stop. But for small stakes? I'll pay the dollar. It's cheaper than the cognitive load of pretending I know the distribution of the Black and Yellow balls.

  **Marcus:** (Shakes his head, smiling faintly) You're admitting you're irrational to save on cognitive load.

  **Lena:** I'm admitting that being "rational" in your sense requires assuming a precision that doesn't exist. I'd rather be vaguely right than precisely wrong.

  **Marcus:** And that's why you'll never be a Bayesian.

  **Lena:** And that's why you'll never survive a regime change.

  Marcus looks at the urn. He looks at his slip, clean and precise. He looks at Lena's slip, hedged and careful. He drops his pen in the slot.

  **Marcus:** Red. I'm betting on Red. Because the probability is 1/3.

  **Lena:** (Dropping her slip in the box) Red. Because the probability is *known* to be 1/3.

  **Marcus:** Same bet.

  **Lena:** Different reasons. That's the whole point.

  They step back from the pedestal. The urn sits between them, opaque and silent, holding the sixty balls that neither of them can see, weighing the difference between risk and uncertainty.
