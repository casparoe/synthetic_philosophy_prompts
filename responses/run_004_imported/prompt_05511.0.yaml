answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Board Election Voting Method

  **Purpose**
  Following the contentious board election this spring, our committee was tasked with reviewing our voting procedures to ensure future outcomes reflect the will of the ownership while maintaining administrative feasibility. This memo recommends adopting **Ranked-Choice Voting (RCV)**, also known as Instant Runoff Voting, for all future multi-candidate board elections. It outlines the rationale for this choice, the specific fairness trade-offs involved, and addresses concerns regarding complexity.

  **The Problem with Plurality**
  Our current plurality system ("vote for one, most votes wins") functioned as intended mathematically, but failed representationally. As we saw in the spring election, when more than two candidates run, similar platforms can split the vote. This allows a candidate to win with a minority of support (34%) despite a majority of voters (66%) preferring other options. In our specific case, post-election data indicated the winner was the *least* preferred option for a majority of voters. This undermines trust in the Board's legitimacy.

  **Recommendation: Ranked-Choice Voting (Instant Runoff)**
  Under RCV, owners rank candidates in order of preference (1st, 2nd, 3rd, etc.). If no candidate receives over 50% of the first-choice votes, the last-place candidate is eliminated, and their votes transfer to those voters' next choices. This continues until one candidate commands a majority.

  **Why This Method?**
  1.  **Eliminates the "Spoiler Effect":** Owners can vote for their favorite reform candidate without fear of "wasting" their vote or inadvertently helping the least desired candidate win.
  2.  **Ensures Majority Support:** The winner must eventually secure >50% of the active votes, ensuring the Board seat is held by someone acceptable to the majority of participating owners.
  3.  **Cost and Time Efficiency:** It achieves the result of a traditional two-round runoff election in a single ballot count, saving the association the cost and low-turnout risk of a special second election.

  **Fairness Trade-Offs**
  As we have discussed, Arrow's Impossibility Theorem reminds us that no voting system is perfect. By choosing RCV, we are explicitly accepting two theoretical trade-offs:

  1.  **The Condorcet Criterion:** RCV does not guarantee the election of the "Condorcet Winner"—the candidate who would beat every other opponent in a head-to-head matchup. While RCV *usually* elects this person, there are mathematical edge cases where it might not.
      *   *Why this is reasonable:* Calculating a true Condorcet winner requires complex pairwise matrix counting that is prone to error when done manually by volunteers. RCV gets us to a majority winner with a transparent, step-by-step count that owners can witness and verify.
  2.  **Monotonicity:** In rare scenarios, ranking a candidate *higher* on a ballot could theoretically cause them to lose (or ranking them lower could help them win).
      *   *Why this is reasonable:* This paradox occurs in less than 1% of real-world elections. We are prioritizing the **Majority Criterion** (ensuring the winner has >50% support) over Monotonicity because, for a governing board, broad acceptability is more vital than theoretical consistency in edge cases.

  **Addressing Concerns on Complexity**
  Some committee members prefer retaining plurality voting because it is "the only system people will understand." This concern is valid; if owners spoil their ballots by ranking incorrectly, the election is compromised. However, we should weigh this against the cost of the status quo:

  *   **Intuitiveness:** RCV mimics how people naturally make decisions (ranking preferences). Experience from municipal elections and other HOAs suggests that once voters understand they can rank a "long shot" as #1 without risk, participation often increases.
  *   **Education vs. Litigation:** While RCV requires a one-time education effort (sample ballots, instructions), plurality voting carries the risk of repeated disputes when minority winners enact unpopular policies. It is easier to teach owners to number bubbles than to explain why a candidate with 34% of the vote represents them.
  *   **Administrative Burden:** RCV is significantly easier to count than the Condorcet methods proposed by some members. A Condorcet count requires comparing every candidate against every other candidate (e.g., in a 4-person race, 6 separate head-to-head tallies). RCV requires a single stack of ballots sorted by first choice, then redistributed. For a volunteer committee, this distinction is critical for accuracy.

  **Conclusion**
  No system can satisfy every fairness condition simultaneously. However, Ranked-Choice Voting offers the best balance for our community. It fixes the vote-splitting issue that caused our recent crisis, ensures the winner has majority support, and remains simple enough for volunteer administration and owner comprehension.

  I move that the committee recommend amending the bylaws to adopt Ranked-Choice Voting for all contested board elections, effective immediately.
