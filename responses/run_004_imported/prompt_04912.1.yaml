prompt: |-
  So I run a little side-project podcast where I interview philosophers and cognitive scientists for a mostly tech/AI crowd, and next weeks guest defends a higher-order-thought theory of consciousness -- the idea that a mental state is only conscious if theres a further, usually unconscious, higher-order representation of you being in that state. I've got zero formal philosophy training and really don't want to just let her restate the view. Can you draft me 8-10 interview questions that actually push on it? I want at least one on the "targetless HOT" problem (a stray higher-order representation with nothing backing it up at the first-order level would, on this theory, still supposedly generate a full-blown experience -- which critics say is basically like saying a rock could feel pain), one on whether the theory is unfalsifiable in practice since the higher-order state doing the real work is itself usually unconscious and so can't be checked independently, and one that makes her actually engage with the no-report paradigm results, which suggest all that prefrontal cortex activity people cite as evidence might just track reporting/decision processes rather than consciousness itself. For each of those three, add a quick follow-up keyed to whatever answer she's most likely to give. Thanks!
