answer: |-
  This is a fantastic puzzle, and your intuition is correct: this is not snobbery. It is a genuine epistemological and aesthetic category error. Your colleague's cholesterol analogy fails because it conflates **brute facts** (which are transferable via testimony) with **aesthetic judgments** (which require first-hand experience to be authentic).

  Since you teach intro epistemology, I will frame this using the architecture you likely use in class (testimony, justification, knowledge), but then pivot to the specific literature on aesthetic testimony (Kant, Hume, and contemporary work by people like David Hopkins or Aaron Ridley).

  Here is the principled difference, what your friend-of-a-friend (FoF) is missing, and how to categorize his epistemic state.

  ### 1. The Disanalogy: Brute Facts vs. Response-Dependent Properties

  The cholesterol case is a standard case of **expert testimony regarding a mind-independent fact.**
  *   **The Property:** Cholesterol level is a quantitative, biological fact. It exists independently of the patient's experience of it.
  *   **The Epistemic Route:** The doctor has access (the lab report); the patient does not. The patient relies on the doctor's reliability.
  *   **The Verdict:** When the patient says, "My cholesterol is high," they are reporting a fact about their body that they have accessed via testimony. This is perfectly valid knowledge.

  The novel case is a claim regarding a **response-dependent property.**
  *   **The Property:** "Masterpiece" (or "beautiful," "profound," "moving") is not a chemical quantity in the ink. It is a property that emerges from the interaction between the text and a reader's cognitive/emotional faculties.
  *   **The Epistemic Route:** To judge the property, one must undergo the interaction.
  *   **The Verdict:** When FoF says, "This is a masterpiece," he is claiming to have undergone the interaction. He hasn't.

  **The Principled Difference:** You can outsource the *measurement* of cholesterol; you cannot outsource the *experience* of art. If you outsource the experience, you are no longer making an aesthetic judgment; you are making a sociological report about the book's reputation.

  ### 2. The Kantian Constraint: The Autonomy of Aesthetic Judgment

  This is the heavy lifting for your dinner party argument. Immanuel Kant, in the *Critique of Judgment*, argues that aesthetic judgment requires **autonomy**.

  For Kant, if I judge something to be beautiful, I must feel the pleasure myself. I cannot simply agree with you. If I say, "This is beautiful because you say so," I am not making an aesthetic judgment; I am making a logical judgment about your authority.

  *   **The FoF's Error:** He is treating aesthetic value as a **property of the object** (like weight or cholesterol) rather than a **relation between object and subject**.
  *   **The Implication:** By adopting the critics' verdict without the reading, he has bypassed the very mechanism that makes the verdict meaningful. He has the *conclusion* without the *ground*.

  In epistemology terms: Testimony usually transmits **justification**. In aesthetics, testimony can transmit **information** (e.g., "This book is famous"), but it cannot transmit the **warrant** for the judgment of taste. The warrant for "This is a masterpiece" is the feeling of engagement. Without the engagement, the warrant is missing.

  ### 3. Does He *Know*? (Propositional Knowledge vs. Understanding)

  Here is where we can get precise about his epistemic state.

  **Does he know the book is a masterpiece?**
  In a loose, propositional sense, maybe. If the critics are reliable, and the book *is* a masterpiece, and he believes it because they said so, he satisfies the tripartite definition of knowledge (Justified True Belief, roughly).
  *   *However*, this is "blind knowledge." It is knowledge that *p*, without understanding *why p*.

  **What is he missing?**
  He is missing **aesthetic understanding**.
  In science, I can know gravity exists without understanding the math. In art, knowing the work is good *just is* understanding how it achieves its effects. You cannot separate the "that" from the "how."

  *   **The Cholesterol Case:** "My cholesterol is high." (I know the fact. I don't need to understand the lipid metabolism to know the fact is true about me.)
  *   **The Novel Case:** "This book is a masterpiece." (To know this fact *is* to grasp the coherence, style, and emotional resonance. If I haven't read it, I don't know the fact in the relevant sense; I only know the *consensus*.)

  So, FoF doesn't actually know the book is a masterpiece. He knows **the book is widely regarded as a masterpiece.** He has conflated *reputation* with *merit*.

  ### 4. The Speech Act: Assertion vs. Report

  This is the "snappy comeback" you missed at the dinner party. It concerns the ethics of assertion.

  When FoF says, "This is the best thing published this decade," he is performing a speech act of **endorsement**. He is inviting others to trust his taste.
  *   **Cholesterol:** When I tell you my cholesterol is high, I am reporting data. I am not asking you to trust my biological analysis.
  *   **Novel:** When I tell you a book is a masterpiece, I am implicitly saying, "I have engaged with this, and it rewarded that engagement."

  By asserting the judgment without the experience, FoF is **misrepresenting his epistemic position.** He is claiming a license (the license of a reader/critic) that he has not earned. He should be saying, "I haven't finished it, but the consensus is that it's a masterpiece." That is a true report. "It *is* a masterpiece" is a false assertion of his own agency.

  ### 5. Why It Feels Like Snobbery (And Why It Isn't)

  Your discomfort feels like snobbery because we live in a culture that often treats art consumption as **status signaling** (reading the right books) rather than **experience seeking**.

  If the goal is status ("I am the kind of person who reads masterpieces"), then FoF is succeeding. He has the correct badge.
  If the goal is aesthetic engagement ("I want to experience something profound"), then FoF is failing.

  It isn't snobbery to insist that the point of art is the engagement. It would be like someone saying, "I haven't tasted this soup, but the chef says it's salty, so I assert that it is salty."
  *   Wait, that works for salt (brute fact).
  *   Better: "I haven't tasted this soup, but the chef says it's *delicious*, so I assert that it is delicious."
  *   **Deliciousness** is response-dependent. You cannot know the soup is delicious without tasting it. You can only know it is *rated* delicious.

  ### Summary for Your Next Class (or Dinner Party)

  1.  **The Distinction:** Cholesterol is a **brute fact** (testimony suffices). "Masterpiece" is a **response-dependent value** (testimony informs, but does not justify the judgment).
  2.  **The Epistemic Failure:** FoF has **propositional knowledge of the consensus**, but **no aesthetic understanding of the work**. He knows the *reputation*, not the *merit*.
  3.  **The Normative Failure:** He is violating the **Autonomy of Aesthetic Judgment**. He is asserting a verdict he is not licensed to give because he hasn't done the "work" (reading) that generates the license.
  4.  **The Snobbery Check:** It is not snobbery to demand first-hand experience for response-dependent predicates. It is merely linguistic and conceptual accuracy.

  Your friend-of-a-friend isn't just being lazy; he is category-mistaking the *nature* of aesthetic value. He thinks he's collecting facts, but he's actually collecting badges. You were right to feel the friction; it was the friction of a category error.
