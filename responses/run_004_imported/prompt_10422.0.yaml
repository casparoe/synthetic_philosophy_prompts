prompt: |-
  I recently joined the resident cast of an immersive theatre production—the kind where audience members roam freely through the set and are periodically drawn one by one into private scenes with performers, with no stage, fixed seating, or fourth wall in sight. At a company talk, our director cited Rousseau's Letter to d'Alembert in defense of the form, arguing that Rousseau's real target was never drama as such but the passivity of spectators seated at a fixed distance, and that his preferred alternative—the open-air civic festival, where citizens are at once performers and audience for one another—is essentially what we stage nightly. This reassured everyone else in the room rather more than it reassured me, since my actual job still consists of counterfeiting passions I do not feel in front of people who have paid to be drawn into the scene with me. Please argue that immersive theatre of this kind does not actually escape Rousseau's condemnation of the stage, and that his deeper objection was never really about where the audience sits at all—engaging directly with his separate charge that the actor's profession of counterfeiting passions not his own corrupts the performer regardless of how intimately or symmetrically the performance is staged.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is an actor in an immersive theatre production (no fourth wall, audience roams, private scenes).
      *   **The Conflict:** The director cited Rousseau's *Letter to d'Alembert* to justify the form, arguing Rousseau only hated passive spectatorship and would love this "civic festival" style where audience/performer boundaries blur. The user feels uneasy because their job still involves "counterfeiting passions" they don't feel.
      *   **The Task:** Argue *against* the director's interpretation. Specifically, argue that immersive theatre does *not* escape Rousseau's condemnation.
      *   **The Core Argument:** Rousseau's deeper objection wasn't about seating or passivity, but about the *moral corruption of the actor* who professions passions not their own. This corruption happens regardless of intimacy or symmetry.
      *   **Tone:** Intellectual, persuasive, empathetic to the user's unease, grounded in Rousseau's text.

  2.  **Deconstruct Rousseau's *Letter to d'Alembert*:**
      *   *What did Rousseau actually say?*
          *   He opposed the establishment of a theatre in Geneva.
          *   He criticized the *passivity* of the audience (yes, the director is right about this part).
          *   He criticized the *isolation* of spectators in the dark.
          *   *Crucially:* He criticized the *actor's profession*. He viewed acting as inherently duplicitous. The actor shows themselves for money, adopts personas, and loses their authentic self.
          *   He contrasts the Theatre with the *Fête* (festival). In the *Fête*, people are active, together, and authentic.
      *   *The Director's Interpretation:* Immersive theatre = *Fête*. Audience is active, close, no barrier. Therefore, Rousseau would approve.
      *   *The Flaw:* The director focuses on the *audience's* experience but ignores the *actor's* moral condition. In immersive theatre, there is still a distinction between "cast" and "audience." The cast is still paid to pretend.

  3.  **Formulate the Counter-Argument (The "User's Side"):**
      *   **Point 1: The Actor's Alienation.** Rousseau's primary moral worry was about the person *on display*. In immersive theatre, the actor is *more* on display, not less. The "counterfeiting" is more intense because it's intimate.
      *   **Point 2: The Illusion of the *Fête*.** A true Rousseauian *Fête* has no paid performers. Everyone participates spontaneously. Immersive theatre still has a script, a wage, and a hierarchy. It is a commodity, not a civic ritual.
      *   **Point 3: Intimacy Amplifies the Lie.** If the problem is inauthenticity, bringing the audience inches away doesn't solve it; it makes the inauthenticity more potent. The "private scene" is a commercial transaction disguised as intimacy.
      *   **Point 4: The Corruption of Self.** Rousseau feared the actor forgets who they are. Immersive actors must maintain character even when touched or provoked. This requires a dissociation that Rousseau would find morally dangerous.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the director's point (it's a common reading) but validate the user's intuition. State the thesis: Rousseau's critique is ontological (about being), not spatial (about seating).
      *   **The Actor's Profession:** Focus on the "counterfeiting passions" line. Quote or paraphrase Rousseau on the actor's loss of self. Explain why immersive theatre exacerbates this (constant vigilance, no "off" stage).
      *   **The Commodity vs. The Civic:** Distinguish between a paid production and a *Fête*. Rousseau's festival was free, public, and unscripted. Immersive theatre is a ticketed product. The economic transaction corrupts the "authenticity."
      *   **Intimacy as Intensified Alienation:** Address the "private scene." To Rousseau, this isn't connection; it's the ultimate commodification of human interaction. It simulates intimacy for money.
      *   **Conclusion:** Reassure the user. Their unease is philosophically sound. The form doesn't save the soul of the actor.

  5.  **Refining the Tone:**
      *   Needs to be respectful of Rousseau but firm.
      *   Needs to validate the user's feeling of "counterfeiting."
      *   Avoid being too academic; keep it relevant to their nightly experience.
      *   *Self-Correction during drafting:* Make sure I don't just say "Rousseau hated theatre." I need to explain *why* the specific mechanics of immersive theatre fail to meet his criteria for the *Fête*.

  6.  **Key Rousseauian Concepts to Weave In:**
      *   *Amour-propre* (vanity/social comparison) vs. *Amour de soi* (self-love/authenticity).
      *   The distinction between *being* and *appearing*.
      *   The *Fête* (Festival) of the Federation.
      *   The moral effect of habit (acting becomes nature).

  7.  **Final Polish:** Check against the prompt requirements.
      *   Argue immersive theatre doesn't escape condemnation? Yes.
      *   Address the "counterfeiting passions" charge? Yes.
      *   Engage with the seating/passivity red herring? Yes.

  8.  *(Self-Correction)*: I should ensure I don't discourage the user too much, but rather validate their intellectual intuition. The prompt asks me to *argue* the point, not necessarily give career advice, but the context implies they want validation for their skepticism. I will maintain a philosophical focus.

  9.  **Final Review of the Argument Structure:**
      *   Intro: The Director's spatial fallacy.
      *   Body 1: The Ontology of the Actor (Being vs. Seeming).
      *   Body 2: The Economic Transaction (Paid vs. Civic).
      *   Body 3: Intimacy as Alienation (The Private Scene).
      *   Conclusion: The user's unease is the Rousseauian conscience.

