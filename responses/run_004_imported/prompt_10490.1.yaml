  ### Analysis of the Debate

  This is a sharp exchange that cuts to the heart of the methodological tension in philosophy of language: when does a linguistic intuition reflect semantic structure, and when does it reflect social normativity? Here is the breakdown of each move.

  #### 1. Naomi's First Move (+1)
  **Claim:** The avoidance of the word-form even in mention contexts suggests the offense is attached to the token itself (Prohibitionism), violating the standard use/mention distinction.

  **Reasoning:** Naomi is right to identify that standard semantic theory relies heavily on the use/mention distinction to neutralize content. If I write " 'Cat' has three letters," I am not committing to the existence of cats. If the offense of a slur were purely truth-conditional or even purely implicature-based, mention should theoretically neutralize it. The fact that the academic community treats the *mention* as potentially harmful aligns well with Anderson & Lepore's Prohibitionism, which argues that the violation is in the utterance of the word-form itself, regardless of the speaker's intent or the semantic context.
  **Critique:** The score is not a perfect +2 because Naomi risks conflating *semantic theory* with *professional ethics*. The fact that philosophers *choose* not to print the word is a normative fact about the profession, not necessarily a semantic fact about the word. However, as an inference about how the word functions (i.e., that it carries a "toxicity" that survives semantic embedding), her move is strong.

  #### 2. Owen's First Move (-1)
  **Claim:** This doesn't discriminate theories because Conventional Implicature (CI) and presupposition content also project through embedded and quotation-adjacent contexts.

  **Reasoning:** Owen attempts to save the semantic/pragmatic view (like Hom's) by arguing that projection is a general feature of non-truth-conditional content. However, this is linguistically dubious. While CIs project through logical embedding (negation, conditionals), they do not typically survive pure *mention* (quotation). In a linguistics paper analyzing the word "damn," authors generally print "damn," not "d***n," even when discussing its expressive content. If CI theory predicted that mention contexts still trigger the offensive force, we would see typographic avoidance for all expressive content. We do not. Therefore, Owen's claim that this data is "old news" for CI theory is empirically weak.
  **Critique:** Owen is correct that projection is a feature of CIs, but he misidentifies *mention* as a standard projection environment. This weakens his defense significantly.

  #### 3. Naomi's Second Move (+2)
  **Claim:** The asymmetry with swear words/blasphemy (which are printed in linguistics papers) shows this is social practice, not semantic architecture.

  **Reasoning:** This is the strongest move in the exchange. If the avoidance were driven by a general semantic mechanism (like the projection of offensive content), it should apply to all words with offensive expressive content (e.g., "fuck," "shit," "blasphemy"). The fact that phonologists and semanticists routinely print swear words while avoiding racial slurs indicates that the constraint is not about *offensiveness* per se, nor about *semantic projection*. It is about specific histories of harm and the ethical obligations of the speaker/writer toward the audience. This undermines the idea that the typographic data is evidence for a *semantic* theory (like Prohibitionism) rather than evidence for a *sociolinguistic norm*.
  **Critique:** This effectively pivots the debate from "What is the semantics of slurs?" to "What are the ethics of discussing slurs?" which is where the actual explanation for the typography lies.

  #### 4. Owen's Second Move (0)
  **Claim:** No asymmetry is needed; Hom's theory ties content to specific histories of discrimination, so only slurs (not swear words) get the treatment.

  **Reasoning:** Owen correctly identifies that Hom's Combinatorial Externalism (CE) distinguishes slurs from mere swear words based on their content (discriminatory perspectives vs. general taboo). However, he fails to explain why this *semantic* difference dictates a *typographic* difference in mention contexts. If the mechanism is semantic content, and mention neutralizes semantic content (as per standard theory), then neither should need avoidance. If mention *doesn't* neutralize it, we are back to Naomi's point about the word-form itself. Owen explains why the *words* are different, but he doesn't explain why the *practice* diverges if both are supposedly just dealing with semantic content. He is begging the question: assuming the semantic difference justifies the normative difference without explaining the mechanism of that justification.
  **Critique:** It's a coherent defense of Hom's internal consistency, but it doesn't successfully rebut Naomi's challenge about the external linguistic practice.

  ### What They Are Both Missing

  Both Naomi and Owen are treating **professional publishing norms** as direct data for **semantic theory**. This is a category error.

  1.  **Ethics vs. Semantics:** The primary reason papers avoid printing slurs is not because the *semantics* forbid it, but because the *perlocutionary effect* (the harm caused to the reader) remains even in mention. Reading the word can cause distress, trigger trauma, or reproduce the harm of the term regardless of the philosophical context. This is an ethical constraint on speech acts, not a semantic constraint on truth conditions. Both debaters are trying to shoehorn an ethical norm into a semantic debate (Prohibitionism vs. Externalism).
  2.  **Orthographic Processing:** From a cognitive science perspective, reading the word "n***r" (even in quotes) may activate the same neural pathways and associative networks as reading the uncensored word, whereas reading "the n-word" does not. The "toxicity" might be a feature of human cognitive processing of orthography, not just philosophical semantics.
  3.  **The "Mention" Illusion:** In written philosophy, "mention" is often visually indistinguishable from "use" for the reader. Unlike speech, where tone can signal mention, text requires typographic markers (quotes, italics). If the community decides those markers are insufficient to prevent harm, they will censor the token. This is a pragmatic decision about communication efficacy and safety, not a discovery about the word's logical form.

  **Verdict:** Naomi wins on the empirical data (the asymmetry with swear words), but Owen is right that the semantic theories themselves (Hom's especially) are complex enough to accommodate the distinction. However, neither fully acknowledges that the "data" they are analyzing is a matter of **academic policy**, not **linguistic intuition**.
