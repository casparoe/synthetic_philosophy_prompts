  2.  **Analyze the Text (*De Senectute*):**
      *   **Speaker:** Cato the Elder (as characterized by Cicero).
      *   **Interlocutors:** Scipio Aemilianus and Laelius (young men asking for advice).
      *   **Structure:** Cicero addresses four main charges against old age:
          1.  It withdraws us from active life.
          2.  It enfeebles the body.
          3.  It deprives us of physical pleasures.
          4.  It is not far from death.
