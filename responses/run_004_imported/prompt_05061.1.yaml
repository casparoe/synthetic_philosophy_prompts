          *   Crucially: Both fail to provide a *truthmaker* for the claim that the unifier unifies.
      *   *Section 5: The "By Fiat" Objection.* This is the core. To explain unity, you need to show *in virtue of what* X unifies Y. Saying "X is the sort of thing that unifies Y" is tautological. It stops the regress verbally, not ontologically.
