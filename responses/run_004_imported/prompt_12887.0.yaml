answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two logicians, OLIVIA (Ockhamist) and SAM (Supervaluationist), are finishing up a whiteboard session on temporal semantics.*

  **Olivia:** So, let's go back to the Sea Battle. Aristotle's headache. "There will be a sea battle tomorrow." You're telling me that right now, at $t_0$, that sentence has no truth value?

  **Sam:** Not *no* truth value. It's indeterminate. Look at the tree. At $t_0$, we have multiple histories branching out. On some histories, the battle happens at $t_1$. On others, it doesn't. Since the sentence is true on some histories passing through $t_0$ and false on others, it's not "supertrue." It's unsettled.

  **Olivia:** But Sam, something *has* to happen tomorrow. Either there is a battle or there isn't. The Law of Excluded Middle isn't a suggestion. $p \lor \neg p$ must hold. If you deny the sentence is true or false now, aren't you saying reality is gappy?

  **Sam:** Not at all. I'm a supervaluationist, not a intuitionist. I accept $p \lor \neg p$. The disjunction "Either there will be a battle or there won't" is supertrue. It's true on every single history branching from now. So the disjunction holds "full stop," as you put it. I just deny that the individual disjuncts have a truth value yet.

  **Olivia:** That's the part that always felt like semantic gerrymandering to me. You're saying the *whole* is true, but neither *part* is? How does that work? If I say "It's raining or it's not," and you ask me "Is it raining?", I can't say "Yes." I can't say "No." But I can say "The disjunction is true." That feels like I'm speaking a language where truth doesn't track facts.

  **Sam:** It tracks *settled* facts. The past is settled; the future is open. Your view, the Ockhamist view, requires a "Thin Red Line" (TRL). You say one of those branches is metaphysically privileged as *The Actual Future*. So, "There will be a battle" is true now because the TRL goes through the battle-world.

  **Olivia:** Exactly. One path is the one we're going to take.

  **Sam:** But here's the hit, Olivia. Belnap and Green nailed this. If the future is genuinely open, what makes that one line "red"? Is it detectable? Can God look at the tree at $t_0$ and point to the TRL?

  **Olivia:** God knows the future, yes.

  **Sam:** But *how*? If the physics is indeterministic, there's no physical fact at $t_0$ that determines the battle. So this "Red Line" is a metaphysical ghost. It's a fact that makes no difference to the structure of the world. You're smuggling linear time back into a branching model just to save bivalence. You want the branching structure to model possibility, but then you draw a line through it that says "Actually, only this one matters." That collapses the branching into a single line semantically, even if you draw extra branches on the chalkboard.

  **Olivia:** That's a strong objection, I'll grant you. The TRL is ontologically sparse. But look at the cost of your solution. Let's talk about assertion. If I'm the admiral, and I say, "We will engage the enemy tomorrow," I am making a claim. I'm planning logistics. I'm betting my reputation on it.

  **Sam:** You're asserting something that *might* be true.

  **Olivia:** No. If I'm right, I said something true. If I'm wrong, I said something false. But on your view, if the battle is contingent, I haven't said anything true *yet*. So, strictly speaking, I'm asserting something that lacks a truth value.

  **Sam:** You're asserting something that is *true relative to the intended history*.

  **Olivia:** But which history is that? I don't know! If Supervaluationism is correct, then right now, the statement "We will win" is neither true nor false. So if you ask me, "Is it true that we will win?", the correct answer is "No." Because it's not supertrue. But that implies I *won't* win, or at least that I have no grounds to claim I will. It paralyzes decision-making. Your semantics makes the future unspeakable. I can't truly predict anything contingent. I can only predict what is *inevitable*.

  **Sam:** That's not paralysis, that's honesty. If it's not inevitable, you shouldn't claim it as a settled truth. You can say, "It is possible we will win," or "It is highly probable." But to claim it as *true* simpliciter? That's hubris. It treats the open future like the settled past.

  **Olivia:** But consider the negation. If I say "There will be a sea battle," and you say "That's not true," standard pragmatics implies you think it's false. But you don't think it's false! You think it's indeterminate. So your semantics breaks the link between truth and assertion. If I can't assert $p$ unless $p$ is supertrue, I can never assert anything about the contingent future. I can't say "I will have coffee tomorrow morning."

  **Sam:** You can assert it, provided you acknowledge the context. Truth is context-sensitive. In a context where we fix a history, your statement has a value.

  **Olivia:** But which context? The "Thin Red Line" *is* the context provided by reality! You complain my TRL is undetectable. Fine. But your "supertruth" is equally detached from the agent's perspective. When I make a prediction, I am not quantifying over all possible worlds. I am talking about *this* world, the one I live in. Your view forces me to quantify over the whole tree when all I want to do is describe where I'm going.

  **Sam:** And your view forces you to pretend the other branches don't exist *for truth*, even if they exist *for possibility*. You say the sentence is true now. But if it's true now, isn't it *necessary* now? If "There will be a battle" is true at $t_0$, and truth is timeless, then at $t_0$ the battle is fixed. You've saved bivalence, Olivia, but you've sacrificed openness. You've made the future as unchangeable as the past.

  **Olivia:** I haven't made it unchangeable; I've made it *determinate*. There's a difference. I can change the future by acting, but whatever I end up doing, *that* was the true future all along.

  **Sam:** That sounds like fatalism with extra steps. "Whatever you do, it was already true you'd do it."

  **Olivia:** And your view sounds like semantic evasion. "Whatever you say, it's not quite true yet."

  **Sam:** *[Pauses, sips coffee]* Okay. Let's look at your Excluded Middle worry again. You asked why $p \lor \neg p$ is true if neither $p$ nor $\neg p$ is. Think of it like this: In your model checking work, you have CTL. You have $AG(p \lor \neg p)$. That's valid. It holds on all paths. But $AFp \lor AF\neg p$ ("Either on all paths eventually p, or on all paths eventually not-p") is not valid.

  **Olivia:** Right, because on some paths $p$, on others $\neg p$.

  **Sam:** Exactly. Supervaluationism treats "True" like the $A$ (All) operator. A sentence is True if it holds on All histories. $p \lor \neg p$ holds on All histories. So it's True. $p$ does not hold on All histories. So it's not True. It's not that reality is gappy; it's that "Truth" is a property of the *branching structure*, not a specific path.

  **Olivia:** But that redefines "Truth" away from what we use it for. We use truth to guide action. If I'm betting on the battle, I need to know if $p$ is the case, not if $p \lor \neg p$ is the case. If I bet on $p$, and $p$ turns out false, I lose. If $p$ was "indeterminate" when I bet, did I make a rational bet? Your view makes rational choice over the future incoherent. I can't maximize expected utility if the outcomes don't have truth values to attach probabilities to.

  **Sam:** Probabilities don't need truth values; they need measures over the branches. I can assign a 0.7 probability to the battle without the battle being "true" now.

  **Olivia:** But probability of *what*? Of the "Thin Red Line" turning out to be the battle-branch? You need the branches to be real possibilities, but you also need one of them to be the *target* of the probability. If none of them are "the future," what are you measuring?

  **Sam:** I'm measuring the proportion of histories.

  **Olivia:** But why should I care about the proportion of histories if only one becomes real?

  **Sam:** Because *which one* becomes real isn't fixed yet! That's the point.

  **Olivia:** *[Smiles]* And there we are. You think my "fixed" future is fatalism. I think your "unfixed" truth is silence.

  **Sam:** So, I land a hit on your metaphysics: The Thin Red Line is an occult fact, invisible to physics and logic, posited solely to save a semantic intuition. It makes branching time a lie.

  **Olivia:** And I land a hit on your pragmatics: Supervaluationism makes assertion and prediction impossible. If "It will rain" is never true until it rains, language loses its forward-looking power. You save the openness of the future by sacrificing the speakability of the future.

  **Sam:** *[Closes notebook]* So, Aristotle wins?

  **Olivia:** Aristotle wins. We're just the ones arguing over the score.

  **Sam:** Same time next week?

  **Olivia:** Definitely. I'll bring the coffee. It's definitely going to be coffee.

  **Sam:** *[Grins]* Supertrue.
