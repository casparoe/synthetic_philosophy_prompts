          *   *Peirce's Move:* "Fated" implies an external constraint (Reality). It's not psychological agreement; it's forced by the world. It is a counterfactual (regulative ideal), but not trivial because the constraint is *independent* of what we think.
          *   *Response Strategy:* Clarify "fated." It's not causal determinism of human history, but the inevitability of the *result* given the constraint of the Real. Address the gerrymandering: The community is ideally unlimited and indefinite. You can't rig an infinite community.

      *   **Q3: Uninvestigated Facts (The Pebbles on the Beach).**
