      *   **Core Task:** Address three specific objections/questions about Peirce's definition of truth (circularity, the meaning of "fated"/counterfactuals, and uninvestigated facts) and then address the Peirce vs. James contrast (individual vs. community, pragmaticism vs. pragmatism).

