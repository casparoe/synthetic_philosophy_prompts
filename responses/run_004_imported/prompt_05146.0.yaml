answer: |-
  This is an exceptionally sharp set of questions. You have hit on the three classic objections that professional philosophers have wrestled with for a century regarding Peirce's "convergence theory" of truth. It is impressive that your reading group got this far without formal training; Menand is a wonderful guide, but as you've discovered, the primary source reveals the mechanical stress points in the argument.

  Here is a breakdown of those three mechanical problems, followed by an assessment of the Peirce-James split.

  ### 1. The Circularity Objection
  **The Worry:** You note that "inquiry" seems to presuppose a goal (truth). If you define truth as the end of inquiry, aren't you defining $A$ in terms of $B$, when $B$ is already defined in terms of $A$?

  **Peirce's Defense:** Peirce would argue this isn't a lexical definition (like a dictionary) but a **pragmatic clarification**. He is trying to shift our *conception* of what truth *does*, not just what the word means.

  In the traditional "correspondence" theory, truth is a static relation between a statement and a fact. Peirce thinks this is metaphysically useless because we can never step outside our own minds to check the "match." So, he asks: What practical difference does it make if a belief is true? His answer: A true belief is one that no amount of further evidence could shake.

  To avoid circularity, Peirce grounds "inquiry" not in "seeking truth," but in **the irritation of doubt.** For Peirce, inquiry is simply the struggle to move from the unease of doubt to the calm of belief. He doesn't assume inquiry seeks *Truth* (capital T); he assumes inquiry seeks *settled belief*. His claim is that if you let that process run long enough, under the pressure of an external reality, all investigators will settle on the *same* belief. That specific settlement is what we *call* truth.

  So, the circle is broken by grounding inquiry in the psychological state of doubt, not the logical state of truth.

  ### 2. The Meaning of "Fated" (Determinism vs. Counterfactual)
  **The Worry:** Is "fated" a prediction of history (we *will* agree) or a counterfactual (we *would* agree)? And if it's counterfactual, can't we rig the results by choosing who counts as an investigator?

  **Peirce's Defense:** This is the crux of his **Scholastic Realism**.
  *   **Not Historical Determinism:** Peirce is not claiming that human history will inevitably reach a point where everyone agrees. He knows science is messy and people die.
  *   **The Counterfactual:** It is a claim about the *constraint* of reality. "Fated" means that there is an external permanency (the Real) that acts as a constraint on our speculation. If you and I measure a beam, we might disagree. If we check our instruments, we might disagree. But if we push the inquiry far enough, the physical reality of the beam forces a convergence.
  *   **Anti-Gerrymandering:** Peirce explicitly defines the community of investigators as **indefinite** and **unlimited**. You cannot rig the outcome because the "community" includes anyone who *could* investigate, across all time. If a belief only holds because we excluded certain investigators or stopped looking too closely, it isn't "fated." The "fated" outcome is the one that survives infinite scrutiny.

  So, "fated" is a modal claim (about necessity/possibility), not a temporal prediction. It says: *Reality is the thing that kicks back.*

  ### 3. The Uninvestigated Fact (The Pebbles on the Beach)
  **The Worry:** If truth is what is agreed upon, is there no truth about the pebble count if no one ever counts them? This makes truth dependent on human activity, which seems wrong.

  **Peirce's Defense:** Peirce bites the bullet, but softens it with the **counterfactual**.
  For Peirce, the truth about the pebbles *does* exist, even if no one counts them. Why? Because the truth is defined by what *would* be agreed upon *if* anyone were to investigate it properly.

  This relies on his view that "would-bes" (dispositional properties) are real. A diamond is hard even if it is never scratched, because it *would* resist scratching if tested. Similarly, the pebble count is true even if never counted, because it *would* be agreed upon if counted.

  If you deny this, Peirce would accuse you of **Nominalism** (believing only actual, concrete particulars are real). Peirce is a **Realist** about generals and laws. The *potential* for agreement is a real feature of the universe, independent of whether the agreement actually happens in history.

  ***

  ### Peirce vs. James: Emphasis or Divergence?

  Your secondary sources are correct, but the divergence is deeper than just "emphasis." It is a fundamental disagreement about the nature of truth, which is exactly why Peirce renamed his view **Pragmaticism** (a name "ugly enough to be safe from kidnappers").

  **1. The Individual vs. The Community**
  *   **James:** William James was a psychologist first. In *Pragmatism* (1907), he focuses on the "cash value" of an idea in the life of the *individual*. If believing in God gives a person comfort, strength, and moral focus, and leads to a better life, James is willing to call that belief "true" in a pragmatic sense. Truth is made in the course of experience.
  *   **Peirce:** Peirce was a logician and scientist. He found James's view dangerous. For Peirce, truth cannot depend on what "works" for an individual, because what works for me (e.g., believing I am safe driving drunk) might be fatal. Truth must be independent of you or me. It is the opinion of the *community* in the *long run*.

  **2. The "Will to Believe" vs. The Scientific Method**
  *   **James:** Defended the "Will to Believe"—the right to believe in hypotheses (like religion) even without sufficient evidence, if the option is "living, forced, and momentous."
  *   **Peirce:** Argued that the scientific method (the method of inquiry that submits to external reality) is the only one that doesn't leave belief to accident or caprice. He thought James's version allowed people to cling to comforting falsehoods.

  **3. Why the Rename?**
  Peirce felt James (and F.C.S. Schiller) had turned pragmatism into a form of subjectivism. If truth is just "what works for me," then truth is mutable. Peirce wanted to preserve the idea that Truth is **One** and **Immutable** (in the long run), even if our access to it is fallible.

  **Summary for your group:**
  *   **Peirce:** Truth is **objective** and **convergent**. It is what the community *must* agree on eventually because reality forces them to. (Truth is discovered).
  *   **James:** Truth is **instrumental** and **pluralistic**. It is what proves useful to the believer in navigating experience. (Truth is made).

  Peirce renamed his view "Pragmaticism" specifically to signal that he was *not* a Jamesian pragmatist. He viewed James's interpretation as a corruption of the original logical principle Peirce had laid out in 1878.

  ### Recommendation for the Reading Group
  Since you are engineers, you might find it helpful to analogize Peirce's view to **measurement error**.
  *   **James:** A measurement is "true" if it helps you build the bridge successfully today.
  *   **Peirce:** A measurement is "true" if, were you to refine the instruments infinitely and remove all bias, all engineers would arrive at that specific number. The number exists (the "Real"), even if you never build the bridge (the "uninvestigated pebbles").

  Peirce is trying to save the objectivity of science without relying on a mystical "mirror of nature." He grounds objectivity in the *social process of correction* rather than in a magical mental match with the world.
