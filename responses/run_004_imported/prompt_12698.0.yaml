answer: |-
  The wine was warm and the flowers were already dying, drooping over Arthur's framed photograph like mourners who had forgotten how to stand up straight. Elias found her in the corner of the faculty lounge, the one spot where the noise of the eulogies didn't quite reach. Mara was staring at the condensation on her glass, looking exactly as she had twenty years ago, except for the gray at her temples and the hardening around her eyes.

  He shouldn't have approached her. Their last interaction had been a footnote in *The Journal of Philosophy*, three months prior. Elias had called her position "a pragmatic capitulation to the mob." She had replied in kind, labeling his realism "a theological hangover disguised as semantics."

  But Arthur was dead, and the room was full of people pretending to understand him, and Elias felt the old, magnetic pull of a mind that used to fit against his like a key in a lock.

  "You look tired, Mara," he said.

  She didn't turn immediately. "It's a reception, Elias. People are expected to look bereaved."

  "I meant the work. The new paper."

  Now she turned. A small, sharp smile. "I see you read the footnotes. I was worried you only read the abstracts where your name appears."

  "I read the argument. You're still hiding behind the community."

  "And you're still waiting for a God's-eye view that isn't coming." She took a sip of wine. "Arthur would have laughed at us. Standing over his corpse arguing about whether we mean the same thing by 'corpse'."

  "Arthur knew that when he said 'plus,' he meant *plus*," Elias said, lowering his voice as a group of doctoral students drifted too close. "Not *quus*. He knew that before he opened his mouth. That fact existed in him."

  "Did it?" Mara leaned back against the bookshelf, the leather binding of a collected Wittgenstein digging into her shoulder blade. "Show it to me, Elias. Open him up. Is it in the neurons? Is it in a mental image of a plus sign? Because Kripke showed us the image doesn't work. The neural firing doesn't work. There is no fact of the matter about what Arthur meant by any sign he ever used."

  "There is a fact," Elias insisted, his grip tightening on his own glass. "The fact is normative. It's not a description of what he *did*, it's a constraint on what he *should* have done. If Arthur had calculated 68 plus 57 and gotten 5, he would have been wrong. Not just unpopular. *Wrong*."

  "Wrong according to whom?"

  "According to the meaning of the words!"

  "Which is determined by whom?" Mara's voice was soft, but it cut through the hum of the room. "You keep talking about meaning as if it's a rail laid out to infinity. But we're the ones laying the track as we walk. When the community stops correcting you, when they stop saying 'no, that's not how we use it,' the normativity evaporates. There is nothing left."

  "That's not normativity, Mara. That's causality. That's a dog being kicked until it sits." Elias stepped closer, invading the polite distance they had maintained for a decade. "If the community just agrees, that's a description of behavior. It doesn't tell me why they *ought* to agree. You've reduced truth to a vote."

  "I've rescued it from mysticism," she shot back. "You want meaning to be a ghost in the machine. I'm saying meaning is the machine running. It's the practice. It's the fact that when you say 'red,' I hand you the red book, not the green one. What more do you want? A metaphysical glue?"

  "I want the glue to be real!" Elias hissed. "If it's just practice, then if the whole community decided that 68 plus 57 equaled 5, they would be right. Is that your position? If we all voted for *quus*, arithmetic changes?"

  Mara looked at him, and for a second, the armor slipped. He saw the exhaustion there. The sheer effort of holding the world together with nothing but agreements.

  "If the whole community decided that," she said quietly, "then 'plus' would mean *quus*. Because there is no 'plus' outside of the practice. You're grieving a phantom, Elias. You think there's a fact about meaning that survives the death of the speakers. Arthur is dead. His community is in this room. We decide what he meant now. By how we use him. By how we cite him."

  "That is a surrender," Elias said, his voice dropping to a whisper. "It's a surrender of the idea that we were ever reaching for anything other than each other's approval. I thought... I thought you believed we were tracking something real. That's why I took you on. That's why we..."

  He stopped. *That's why we what?* Worked late? Loved each other, in the way philosophers love, which is to say, with a terrifying intensity of attention?

  Mara looked down at her shoes. "I still believe we're tracking something real. I just think the 'something' is us. The form of life. That's the only reality available to human beings."

  "It's a circle," Elias said, shaking his head. "You're saying truth is what we say it is, and we say it is what is true. It's empty. It offers no resistance. If I wake up tomorrow and decide I mean *quus*, and I convince enough people... I'm not mistaken. I'm just a pioneer."

  "You're lonely," Mara said.

  The accusation hung in the air, heavier than the scent of lilies.

  Elias flinched. "This isn't about psychology."

  "Isn't it?" She pushed off the bookshelf. "You want meaning to be a rock you can stand on when everyone else leaves. You want it to be objective so you don't have to rely on me. Or Arthur. Or anyone. But there is no rock. There's only the web. And if the web breaks, you fall."

  "The web is just a net of conventions," Elias said, though his conviction was wavering, eroded by the sight of her grief. "Conventions can be evil. Conventions can be wrong. If the community endorses a lie, your theory says it becomes true. Mine says it remains a lie, regardless of the consensus."

  "And who judges?" Mara asked. "You? From where? Outside the language? Outside the form of life? You can't stand nowhere, Elias. You're standing here. With me. Drinking bad wine."

  She gestured to the room. "Arthur is gone. The facts about what he meant are now in our hands. We can misinterpret him. We can canonize him. We can forget him. There is no angel watching over his usage to correct us. There is only us correcting each other. That has to be enough."

  "It isn't enough," Elias said. "It leaves the normativity hanging. You can correct me, Mara. You can shout at me. But unless there is a fact of the matter about what I *meant* to say, your correction is just noise. Force. Power."

  "Maybe," she said. "Maybe normativity is just power that has forgotten its origin. Or maybe it's the only thing that keeps the darkness back."

  She finished her wine and set the glass on a tray held by a passing waiter. She looked at him, and the hostility was gone, replaced by a profound, weary pity.

  "You wrote in your footnote that I abandoned the project," she said. "I didn't. I just grew up. I realized that waiting for the metaphysical guarantee was a way of refusing to take responsibility for the community we actually have."

  "And I realized," Elias said, "that accepting the community as the final court of appeals is a way of refusing to admit that we might all be wrong."

  They stood in silence. Across the room, the Department Chair was raising a glass, beginning a toast about Arthur's "enduring legacy." The words felt hollow, plastic.

  "68 plus 57," Elias murmured, almost to himself.

  "125," Mara answered automatically.

  "Because?"

  "Because that's what we say."

  "Because that's what is true."

  They looked at each other. The gap between the two sentences was the width of a lifetime. It was the gap between a handshake and a contract, between a habit and a law, between a lover and a stranger.

  Elias knew he couldn't convince her. To do so, he would need to use language, and she had already argued that language was just the practice they were currently engaged in. He was trying to use the web to grab the web.

  Mara knew she couldn't convince him. To do so, she would have to offer him a fact, and he would demand the fact behind that fact, ad infinitum. He wanted a foundation that didn't touch the ground.

  "Arthur meant *plus*," Elias said finally. "I know it. Even if I can't prove it to you."

  "I know you know it," Mara said. "That's why I'm still talking to you."

  She reached out, briefly, and touched his arm. It was a correction. An endorsement. A signal that they were still in the same language game, even if they disagreed on the rules.

  "Come on," she said, pulling her hand away. "We should go hear the toast. We need to decide together if he was a good man."

  Elias watched her walk toward the light of the main room. He looked at his own glass, the dark red wine swirling. He wanted to say that Arthur's goodness was a fact, irreducible and waiting to be found. But he knew that in a moment, he would clap when Mara clapped.

  He followed her.
