prompt: |-
  I run a tiny philosophy podcast (definitely not academic -- i just got obsessed with this on my own after falling down a youtube hole on Sperry's old split-brain patients). Next episode's guest defends the updated "two minds" view: not Puccetti's old claim that the hemispheres were basically always two seperate people even before the surgery, but the newer version where cutting the corpus callosum actually creates two real subjects of experience sharing one body. I don't want her just restating the position for 40 minutes, so can you draft me 8ish interview questions? I want at least one on the cross-cueing worry (how do we know the hemispheres aren't just signalling each other through the body instead of genuinely being cut off), one that makes her deal with those newer studies where patients still seem to register that something happened somewhere in their visual field even when they can't say what or where, one on why her version dodges the objections that killed Puccetti's claim, and one on what evidence would actually make her abandon the two-subjects view. For each, give me a quick follow-up keyed to whatever answer she'd probably reach for first.
