answer: |-
  Here are 8 interview questions tailored for your podcast. They are designed to be conversational but hit the philosophical heavy lifting, ensuring your guest has to defend the mechanics of her view rather than just reciting it.

  ### 1. The Puccetti Distinction
  "Let's start with the history. The old view from Puccetti was that we are *always* two people, and the corpus callosum just keeps us in sync. You're arguing that the surgery actually *creates* the second subject. What is the specific feature of that cut that turns one 'I' into two 'I's,' and why does that save you from the objections that killed Puccetti's version?"

  *   **Follow-up:** If she says *"Because pre-op unity is phenomenologically real,"* ask: "But if the hardware is basically the same before and after, just with a bridge removed, are you saying consciousness is all-or-nothing? Can't unity fade gradually rather than snap?"

  ### 2. The Cross-Cueing Worry
  "A classic skepticism here is 'cross-cueing.' The worry is that the hemispheres aren't actually disconnected; they're just signaling each other through subcortical pathways or body movements—like me tapping my foot to signal my left hand. How do you know the hemispheres aren't just cheating on the tests rather than genuinely being separate subjects?"

  *   **Follow-up:** If she says *"We have controls for that in the lab,"* ask: "Sure, in strict lab conditions. But in the wild, if they *can* coordinate through the body, does that undermine the claim that they are truly independent agents, or just that they are cooperative ones?"

  ### 3. Residual Awareness (The New Studies)
  "There are newer studies where split-brain patients seem to register that *something* happened in their blind visual field, even if they can't say what or where. If the 'left mind' can still vaguely sense what the 'right mind' is seeing, doesn't that suggest a single, albeit fractured, consciousness rather than two distinct subjects?"

  *   **Follow-up:** If she says *"That's just unconscious processing,"* ask: "Where do you draw the line? At what point does 'unconscious processing' become rich enough that we should call it a subject of experience? Is it a bright line or a gray area?"

  ### 4. The Falsification Test
  "I want to put you on the spot a bit. Science requires falsifiability. Imagine we have better brain scanning tech in ten years. What specific piece of evidence would force you to abandon the two-subjects view and admit it's just one mind struggling to integrate?"

  *   **Follow-up:** If she says *"Nothing would change my mind,"* ask: "Then are we doing neuroscience or metaphysics? If no physical evidence could disprove it, is the 'second mind' just a philosophical zombie?"

  ### 5. The "Creation" Mechanism
  "This sounds almost like magic: you cut a bundle of nerve fibers and *pop*, a new person appears. How does that work mechanically? Are you saying a 'subject of experience' is an emergent property of information isolation? How does less communication equal *more* people?"

  *   **Follow-up:** If she says *"It's about causal independence,"* ask: "But if I lock you in a soundproof room, you're causally isolated from me. Did I just create a second subject in there, or are you still the same person, just lonely?"

  ### 6. The Silent Hemisphere
  "The left hemisphere usually controls speech. So, when we interview these patients, we are mostly talking to the left mind. The right mind can point or draw, but it can't tell us how it feels. How do we know the right hemisphere isn't just a sophisticated philosophical zombie—acting like a subject but lacking inner experience?"

  *   **Follow-up:** If she says *"Because it shows intention and emotion,"* ask: "My dog shows intention and emotion, but I don't know if it's a 'subject' in the human sense. Why is the right hemisphere closer to you and me than it is to a smart pet?"

  ### 7. Ethical Implications
  "If you're right, and a split-brain patient houses two distinct subjects, does that change how we treat them ethically? For example, if the left hemisphere wants a treatment and the right hemisphere resists (which happens), are we witnessing a civil rights violation inside one skull?"

  *   **Follow-up:** If she says *"Yes, it complicates consent,"* ask: "So should we require bilateral consent for surgery? How would you even administer that if one side can't speak?"

  ### 8. The Unity Intuition
  "Finally, for the listeners like me with intact brains: Why does it feel like I'm one thing? If my hemispheres are capable of being two subjects, why doesn't my daily experience feel like a committee meeting? What is the corpus callosum actually *doing* to bind us together?"

  *   **Follow-up:** If she says *"It integrates information seamlessly,"* ask: "So is the 'Self' just an illusion created by bandwidth? If we could upgrade the corpus callosum, would we become *more* of a single person, or is there a ceiling on unity?"
