answer: |-
  The disagreement between you and your friend touches on one of the most significant philosophical problems of the twentieth century: the degradation of factual reality in public life. Your intuition—that the spokesperson is lying—relies on a traditional moral framework where truth is the norm and deception is the violation. Your friend's intuition—that "lying" is the wrong word because truth seems irrelevant—anticipates a more structural critique of modern discourse.

  To resolve this, we must look to Hannah Arendt and Harry Frankfurt. While both diagnose a crisis of truth, they locate the pathology in different places. Arendt sees the political liar as an active adversary of truth; Frankfurt sees the bullshitter as an indifferent bystander to it. When we apply these frameworks to the modern "organized lie" of PR professionals and image-makers, it becomes clear that while Arendt provides the stakes, Frankfurt provides the precise classification. The modern political spokesperson is not merely lying; they are bullshitting. However, recognizing this distinction is not semantic pedantry; it changes how we understand the threat to democracy.

  ### Arendt: The Liar and the Common World

  Hannah Arendt's analysis of deception is split between two key texts: the 1967 essay "Truth and Politics" and the 1971 work "Lying in Politics." In both, she maintains a rigorous definition of the lie. For Arendt, the liar is someone who **knows the truth and intentionally conceals or alters it.**

  In "Truth and Politics," Arendt distinguishes between "rational truths" (philosophical or scientific) and "factual truths" (events that happened). She argues that factual truth is particularly vulnerable in politics because politics is the realm of action, opinion, and persuasion. The traditional political liar respects the truth enough to hide it. As Arendt famously notes, "The liar is a man who wants to be someone else." To lie effectively, one must keep the truth in mind to avoid it. Therefore, the liar remains tethered to reality, even if negatively.

  However, in "Lying in Politics," written in the wake of the Pentagon Papers, Arendt identifies a new, more dangerous phenomenon: the "organized lie." This is not a single official hiding a discrete fact, but a bureaucracy of image-makers rewriting history and reality systematically. Arendt worries that this goes beyond traditional lying. If you rewrite enough facts, you destroy the "common world"—the shared reality that allows people to debate and act together.

  Crucially, Arendt still classifies this as lying, but she warns that it risks becoming something else. If the lie becomes total, it no longer hides the truth; it replaces it. At that point, the liar no longer needs to know the truth, because the "truth" is whatever serves the organization's survival. Here, Arendt brushes against the concept of bullshit, but she frames it as a radicalization of the lie that threatens to make lying itself impossible (since there is no truth left to conceal).

  ### Frankfurt: The Bullshitter and Indifference

  Harry Frankfurt's 1986 essay "On Bullshit" offers a sharper analytical tool for the specific mechanic of speech. Frankfurt distinguishes bullshit from lying based on the speaker's **relationship to truth.**

  For Frankfurt, the liar and the truth-teller are playing the same game: they both care about what is true. The truth-teller reports it; the liar conceals it. Both acknowledge the authority of truth. The bullshitter, however, opts out of the game entirely. The bullshitter is **indifferent to truth.** They do not care whether what they say is true or false; they care only about whether it serves their purpose (persuasion, impression management, agenda advancement).

  Frankfurt argues that bullshit is a greater enemy of truth than lying. The liar corrupts the truth, but the bullshitter erodes the very habit of attending to truth. The bullshitter's focus is not on the world, but on the self (or the organization) projecting into the world. The statement is not a representation of reality; it is a move in a game of power.

  ### The Divergence

  The divergence between the two accounts lies in the **epistemic stance** of the speaker and the **ontological status** of the deception.

  1.  **Epistemic Stance:** Arendt's liar is epistemically engaged. They possess knowledge ($p$) and assert not-$p$. Frankfurt's bullshitter is epistemically disengaged. They assert $x$ without checking if $x$ is $p$ or not-$p$.
  2.  **The Role of Reality:** For Arendt, the lie is a conflict *with* reality. It is a violent act against the facts. For Frankfurt, bullshit is a conflict *without* reality. It floats above the facts, unconcerned with them.
  3.  **The Danger:** Arendt fears the destruction of the "common world" necessary for political action. If we cannot agree on what happened, we cannot act. Frankfurt fears the loss of the "constraint of truth." If we stop caring whether things are true, communication becomes mere noise.

  ### The Verdict: The Modern Spokesperson as Bullshitter

  Returning to your argument: Is the government spokesperson a liar or a bullshitter?

  If we stick strictly to Arendt's definition in "Truth and Politics," the spokesperson is a liar only if they know the specific facts they are distorting. But as your friend noted, "nobody in the room seemed to care what was true." This suggests the mechanism is not concealment, but **irrelevance.**

  The modern organized political lie—the domain of PR professionals, spin doctors, and image-makers—has collapsed into Frankfurtian bullshit. Here is why:

  1.  **Systemic Indifference:** In a modern media apparatus, the spokesperson is often not hiding a specific "smoking gun." They are managing a narrative. If the narrative requires Fact A today and Not-Fact A tomorrow, the shift is made based on utility, not on a relationship to the underlying reality. They are not trying to hide the truth; they are trying to drown it out with a more useful story. This is indifference, not concealment.
  2.  **The Death of the Discrete Fact:** Arendt's traditional liar hides a discrete fact (e.g., "I did not steal the money"). The modern image-maker deals in "realities" (e.g., "The economy is strong," "We are winning the war"). These are not falsifiable in the same way. When a spokesperson offers a "shifting, self-serving story," they are not trying to make you believe a specific falsehood; they are trying to exhaust your capacity to judge truth at all. This aligns with Frankfurt's view that bullshit creates a fog where truth values cease to matter.
  3.  **The Audience's Role:** Arendt assumes an audience that values truth and can be deceived. Frankfurt recognizes that bullshit works best when the audience stops expecting truth. In your scenario, the press corps asks questions, but the spokesperson answers with pre-fabricated "talking points." The spokesperson is not responding to the inquiry (a truth-seeking act); they are broadcasting a signal (a power-seeking act).

  Therefore, your friend was right: "Lying" is the wrong word. Lying implies a moral transgression against a shared standard of truth. Bullshit implies the abandonment of that standard.

  ### Why the Distinction Matters

  However, while Frankfurt provides the better *classification*, Arendt provides the better *warning*.

  If we call it "bullshit," we risk treating it as merely annoying or vacuous—a nuisance of modern media. Frankfurt treats bullshit as a philosophical category of speech. But Arendt treats the destruction of factual truth as an existential threat to politics itself.

  When the organized lie collapses into bullshit, it does not just annoy us; it dismantles the "common world." If the government speaks in bullshit, it is not just deceiving us; it is rendering us incapable of action. We cannot hold power accountable if the metrics of accountability (truth/falsehood) are deemed irrelevant by the powerful.

  Arendt anticipated this collapse. In "Lying in Politics," she writes that the ideal subject of totalitarian rule is not the convinced believer, but the person for whom "the distinction between fact and fiction... and the distinction between true and false... no longer exist." She describes a system where the lie is so total it becomes a surrogate reality. This is the endpoint of bullshit: a world where truth is not hidden, but obsolete.

  ### Conclusion

  You and your friend were both partially right. You were right to sense a moral failure; your friend was right to sense that "lying" was insufficient. The modern political spokesperson is a Frankfurtian bullshitter: they are indifferent to the truth, concerned only with the efficacy of the narrative. They do not hide the facts; they render them irrelevant.

  However, we should not abandon Arendt's terminology entirely. While the *mechanism* is bullshit, the *consequence* is what Arendt feared: the destruction of the factual ground upon which politics stands. Calling it "bullshit" helps us understand the speaker's indifference, but remembering Arendt reminds us why that indifference is catastrophic. It is not just that they don't care about the truth; it is that by not caring, they destroy the world we share. In this light, the distinction matters profoundly: if they are lying, we can demand they tell the truth. If they are bullshitting, we must demand they care about truth at all. The latter is a much harder fight.
