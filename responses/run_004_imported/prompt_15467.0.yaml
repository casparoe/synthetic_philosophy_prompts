  *   $M$ is True.
  *   $C$ is True.

  Two detectives propose rival theories to explain the crime. Both theories are, strictly speaking, **false**, because neither gets the full picture right.

  **Theory A (The "Close" Call):** The Butler and the Maid did it, but the Cook was innocent.
  *   Logical form: $B \land M \land \neg C$
  *   *Verdict:* False (because $\neg C$ is false).
  *   *Intuition:* This theory is very close to the truth. It gets 2 out of 3 facts right.

  **Theory B (The "Far" Miss):** None of them did it; they are all innocent.
  *   Logical form: $\neg B \land \neg M \land \neg C$
  *   *Verdict:* False (because $\neg B, \neg M,$ and $\neg C$ are all false).
  *   *Intuition:* This theory is far from the truth. It gets 0 out of 3 facts right.

  Common sense dictates that Theory A is closer to the truth than Theory B. Popper's definition of verisimilitude was designed to validate exactly this kind of judgment. Let's see why it fails.

  ### Popper's Criteria

  For Popper, Theory A is more verisimilar than Theory B if and only if:
  1.  **Truth Content:** A entails all the true statements B entails, and at least one more ($Ct_T(B) \subseteq Ct_T(A)$).
  2.  **Falsity Content:** A entails *fewer* (or the same number of) false statements than B ($Ct_F(A) \subseteq Ct_F(B)$).

  Crucially, "entails" means *all* logical consequences, not just the basic claims. This includes complex combinations like "Either the Butler is guilty or the Cook is innocent."

  ### The Apparent Victory

  At first glance, Theory A seems to satisfy the conditions.
  *   **Truth:** Theory A entails "$B$ is guilty" (True). Theory B entails "$B$ is innocent" (False). So, Theory A has a true consequence that Theory B lacks.
  *   **Falsity:** Theory A entails "Cook is innocent" (1 false claim). Theory B entails "Butler is innocent," "Maid is innocent," *and* "Cook is innocent" (3 false claims).

  It looks like Theory A has more truth content and less falsity content. But this is an illusion caused by looking only at atomic statements. When we account for *all* logical consequences, the Miller-Tichý trap springs shut.

  ### The Miller-Tichý Trap

  To prove Theory A is more verisimilar, we must prove that **every** false statement entailed by A is *also* entailed by B. (i.e., A's falsity content must be a subset of B's).

  We can construct a specific false statement that Theory A entails, but Theory B **does not**.

  1.  **Identify a truth unique to A:** Theory A entails "$B$ is guilty" ($B$). Theory B does not (it entails $\neg B$).
  2.  **Identify a falsehood entailed by A:** Theory A entails "Cook is innocent" ($\neg C$).
  3.  **Construct the Compound Statement:** Combine them into a conjunction:
      > **Statement $X$:** "$B$ is guilty **AND** Cook is innocent." ($B \land \neg C$)

  Now, we test Statement $X$ against Popper's criteria:

  *   **Is $X$ True or False?**
      Since "Cook is innocent" is false, the conjunction ($B \land \neg C$) is **False**.
  *   **Does Theory A entail $X$?**
      Yes. Theory A explicitly asserts both $B$ and $\neg C$. Therefore, it logically entails their conjunction.
      *   *Result:* $X$ is in Theory A's Falsity Content ($Ct_F(A)$).
  *   **Does Theory B entail $X$?**
      No. Theory B asserts that "$B$ is innocent" ($\neg B$). If $\neg B$ is true, then "$B$ is guilty AND..." must be false. Theory B actually entails the *negation* of $X$. Therefore, Theory B does not entail $X$.
      *   *Result:* $X$ is **not** in Theory B's Falsity Content ($Ct_F(B)$).

  ### The Collapse of Verisimilitude

  Because Statement $X$ is in $Ct_F(A)$ but not in $Ct_F(B)$, the set of A's false consequences is **not** a subset of B's.
  $$Ct_F(A) \not\subseteq Ct_F(B)$$

  This violates Popper's second condition. Consequently, under Popper's definition, **Theory A cannot be said to have greater verisimilitude than Theory B.**

  (In fact, using a symmetrical logical construction, one can also show that Theory B has truth content that Theory A lacks, meaning Theory B cannot be more verisimilar than A either. The two false theories become logically incomparable.)

  ### Why This Matters

  This illustration reveals the structural flaw Popper encountered. In a false theory, truth and falsity are logically "sticky." You cannot add a new true consequence (like "$B$ is guilty") to a false theory (which already claims "$\neg C$") without automatically generating a new, specific false consequence (the conjunction "$B \land \neg C$") that a rival false theory might not share.

  Popper wanted verisimilitude to measure how much of the world a theory got right versus wrong. The Miller-Tichý result showed that, under his definitions, the logical machinery required to count "what is got right" inevitably contaminates the count of "what is got wrong" whenever the theory is false. Thus, the phrase "closer to the truth" lost its formal footing for over two decades, until new definitions (like those by Oddie and Niiniluoto) decoupled truth and falsity content using possible-worlds semantics rather than logical consequence sets.
