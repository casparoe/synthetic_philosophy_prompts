              *   *Wait, let's look closer:* The prompt asks how a defender (such as Cohen) *might* respond. It doesn't demand a textual exegesis of a specific Cohen paper, but rather a plausible Cohen-esque response. However, in an upper-level undergrad or grad context, attributing the "Nozick taxes too" argument *specifically* to Cohen as his *main* rebuttal to Wilt Chamberlain is slightly imprecise. Cohen's famous critique is about "Self-Ownership." He argues Nozick assumes self-ownership entails the right to unlimited accumulation, which Cohen denies.
              *   *The "Liberty" Point:* The student writes: "Nozick has no principled basis for treating the liberty to keep everything you receive as more sacred than the liberties his own state already overrides." This is a strong point, often associated with the critique that Nozick's definition of liberty is question-begging. Cohen *does* argue this in "Freedom and Money."
