  5.  **Refining the Cohen Critique (Self-Correction):**
      *   I need to be careful not to be *too* pedantic. In an *introductory* course, the student's summary of Cohen is often acceptable. Cohen *does* argue that Nozick's conception of liberty is biased. The "taxation" point is a subset of that.
