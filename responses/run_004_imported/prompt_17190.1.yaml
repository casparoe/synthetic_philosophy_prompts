  1.  **Analyze the User's Query:**
      *   **Context:** High school mandatory assemblies with outside theater companies performing plays on heavy topics (bullying, suicide, etc.).
      *   **Observation:** Immediate emotional impact (crying, hugging, kinder atmosphere) followed by a quick return to previous negative behaviors (bullying, insensitive comments) within a week.
