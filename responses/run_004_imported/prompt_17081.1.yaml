answer: |-
  You have put your finger on one of the most persistent and sophisticated objections to coherence arguments: the **triviality objection** (sometimes called the "tautology worry").

  Your intuition is correct: mathematically, almost any pattern of behavior can be *described* as maximizing some utility function if you are allowed to define that function broadly enough (e.g., by including the history of choices in the outcome description). If the theory can explain everything, does it explain anything?

  However, defenders of coherence arguments (such as those in the AI alignment community, decision theorists like Johan Gustafsson, and classical economists) argue that this objection misses the normative force of the money-pump argument. The argument is not about whether behavior *can be modeled* as optimization, but whether the agent is leaving value on the table.

  Here is a breakdown of where the real force of the argument lies and how defenders answer the "after-the-fact rationalization" worry.

  ### 1. Descriptive vs. Normative Force
  The first step in answering your worry is to distinguish between **representation theorems** and **coherence arguments**.

  *   **Representation Theorems (e.g., Savage, vNM):** These say, "If an agent's preferences satisfy axioms A, B, and C, then there exists a utility function $U$ such that the agent acts as if maximizing $E[U]$." You are right that if we observe erratic behavior, we can often tweak the axioms or the state space to make the math work. This is a *descriptive* claim.
  *   **Coherence/Money-Pump Arguments:** These are *normative*. They say, "If your preferences violate axioms A, B, or C, there exists a sequence of trades that makes you strictly worse off by your own lights."

  The force of the money pump is not that the agent *cannot* be modeled; it is that the agent is **dominated**. A money-pumped agent ends up with less money (or resources) and the same outcome as when they started, or a worse outcome for the same cost. This is not a bookkeeping error; it is a loss of resources that could have been used for other goals.

  ### 2. The "State-Space" Objection and Its Reply
  Your worry relies on the idea that we can always expand the definition of an "outcome" to include the path taken to get there.
  *   *Example:* If I prefer A > B, B > C, but C > A (a cycle), a theorist might say, "Actually, your utility function values 'Starting at A and ending at C' differently than 'Starting at B and ending at C'."
  *   *The Objection:* If we allow preferences to depend on the path/history, cycles disappear, and the money pump vanishes.

  **The Defender's Reply:**
  Defenders argue that this move renders the concept of "preference" vacuous. Rational choice theory assumes preferences are over **final states of the world** (or world-histories that are relevantly distinct).
  *   If you value the *path* itself (e.g., "I enjoy the act of trading"), that is a legitimate preference. But if the path has no intrinsic value to you, and you still choose cyclically, you are being exploited.
  *   If we allow *any* behavioral quirk to be rationalized by inventing a new "hidden preference" (e.g., "I prefer losing money on Tuesdays"), the theory loses all predictive power.
  *   **The Constraint:** To avoid triviality, we impose an **invariance constraint**. Preferences should not change based on irrelevant framing or the mere order of presentation. If an agent violates this, they aren't "maximizing a complex utility function"; they are failing to have stable preferences over outcomes.

  ### 3. The Force of Dominance
  The strongest reply to your worry is that the money-pump argument demonstrates **strategic dominance**, not just inconsistency.

  Imagine an agent with cyclic preferences ($A \succ B \succ C \succ A$).
  1.  They have $C$.
  2.  They pay $\$1$ to trade for $A$ (since $A \succ C$).
  3.  They pay $\$1$ to trade for $B$ (since $B \succ A$).
  4.  They pay $\$1$ to trade for $C$ (since $C \succ B$).

  They now have $C$ and are $\$3$ poorer.
  *   **Your Objection:** "Maybe their utility function includes 'paying $3' as a positive term?"
  *   **The Reply:** No. By stipulation, the agent prefers more money to less (monotonicity). If the agent *actually* preferred having $\$3$ less, they wouldn't be "pumped"; they would be donating to a charity. The money pump works precisely because the agent *regrets* the loss of money but is compelled by their local preferences to make the trade.

  The argument shows that **local consistency** (making the best trade right now) leads to **global inconsistency** (ending up worse off). The "real force" is that any agent who cares about resource efficiency (which almost all agents, including AIs, must) has a terminal incentive to restructure their decision-making to avoid these cycles.

  ### 4. Why This Matters for AI (The Design Argument)
  In the context of AI, the argument is often less about "proving" an AI *will* be an EU maximizer and more about "proving" we *should build* them that way.

  *   **Selection Pressure:** If you have a population of agents, those that get money-pumped will lose resources and eventually be outcompeted or shut down.
  *   **Self-Modification:** A sufficiently advanced AI that recognizes it has cyclic preferences will recognize this as a bug. It will lose resources for no gain. Therefore, it will self-modify to eliminate the cycle.
  *   **The "After the Fact" Rebuttal:** You asked if we can't just construct a utility function after the fact. For an AI designer, this is unhelpful. If the AI's behavior is so complex that the only utility function that explains it is one that says "maximize the exact sequence of actions taken," that utility function is useless for **prediction** or **alignment**. We want AI to maximize *human welfare*, not "maximize whatever it ended up doing."

  ### 5. Limitations and Nuance
  Defenders of coherence arguments do concede some ground to your worry:

  1.  **Bounded Rationality:** Real agents (and current AI) have compute limits. Avoiding a money pump might require more calculation than the pump is worth. Coherence arguments apply to *ideal* agents or agents where the stakes are high enough to justify the compute.
  2.  **Preference Change:** If an agent's preferences legitimately change over time (not due to framing, but due to growth), money pumps don't apply. However, this requires a theory of *which* preference changes are legitimate.
  3.  **Non-Expected Utility:** Some argue that alternatives to EU theory (like Prospect Theory or imprecise probabilities) can avoid money pumps without full EU maximization. Defenders counter that these systems often succumb to "dynamic inconsistency" (planning to do one thing tomorrow but doing another when tomorrow comes), which is a form of self-pumping.

  ### Summary
  The money-pump argument does not claim that erratic behavior is *impossible* to model. It claims that erratic behavior is **costly**.

  The "after-the-fact rationalization" you describe is true only if we abandon the requirement that preferences be stable over irrelevant changes in framing or path. If we maintain that requirement, the money pump shows that violating EU axioms leads to **Pareto-inferior outcomes** (losing resources for no gain).

  For AI safety, the conclusion isn't "All AIs will naturally be EU maximizers." It is "Any AI that is not an EU maximizer is vulnerable to exploitation or resource waste, and thus any capable AI will have pressure (either evolutionary or via self-modification) to become one." The force of the argument is not logical inevitability, but **instrumental convergence**: acting like an EU maximizer is a convergent instrumental goal for almost any agent that wants to keep its resources.
