prompt: |-
  I'm part of a small wild food foraging club, about 40 people. Every fall we do a potluck where everyone brings mushrooms they've foraged themselves. For years the rule was that one guy, our most experienced forager (30+ years at it), eyeballs everyones haul and gives a thumbs up or down before it goes near the food table. Last year he almost approved a dangerous lookalike, only caught because another member double-checked on a hunch. Now the club's split: one side wants to replace him with a panel of 5 people who each look it over and majority-vote safe or not, figuring more eyes catches more mistakes. The other side says that's actually more dangerous -- in practice the 5 will just watch whoever sounds most confident and nod along, so it's not really 5 independent checks, and our one expert is so much better at this than any 5 people we'd realistically recruit that diluting his judgment with theirs could make us worse at catching a bad one, not better. I'm on the committee that runs the club and need to bring a short written recommendation to next week's meeting. Can you draft it -- an actual process (how many checkers, what counts as approval, whether we need unanimity since someone could die) plus the reasoning behind it, in a way that seriously deals with the 'more checkers isn't automatically safer' worry instead of just brushing past it?
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Context:** Small wild food foraging club (40 people). Annual mushroom potluck.
      *   **Current Situation:** One expert (30+ years) inspects all mushrooms. Last year, he nearly missed a dangerous lookalike (caught by a less experienced member).
      *   **The Conflict:**
          *   *Side A:* Replace the single expert with a panel of 5 (majority vote). Argument: More eyes catch more mistakes.
          *   *Side B:* Keep the single expert (or similar). Argument: Groupthink/authority bias will make the panel ineffective, and the single expert is superior to the average panelist. Diluting expertise is dangerous.
      *   **Task:** Draft a short written recommendation for the club committee to present at the next meeting.
      *   **Requirements:**
          *   Define the actual process (number of checkers, approval criteria, unanimity?).
          *   Provide reasoning.
          *   *Crucially:* Address the "more checkers isn't automatically safer" concern (groupthink, authority bias, dilution of expertise) seriously, not just hand-wave it.
          *   Tone: Professional, safety-focused, balanced, decisive.

  2.  **Evaluate the Options:**
      *   *Option 1: Single Expert.* High expertise, but single point of failure (fatigue, distraction, human error). The near-miss last year proves fallibility.
      *   *Option 2: Panel of 5 (Majority Vote).* High risk of groupthink. If the loudest person is wrong, or if everyone assumes "someone else checked it," safety decreases. Also, finding 5 *competent* identifiers is hard in a small club.
      *   *Option 3: Dual-Check System (The "Aviation" or "Nuclear" Model).* Two independent identifiers. Both must agree. If there's doubt, it's out. This balances expertise with redundancy without inviting groupthink.

  3.  **Develop the Recommendation (The "Dual-Check" Approach):**
      *   *Why not 5?* Too many cooks, logistics nightmare, encourages diffusion of responsibility.
      *   *Why not 1?* Single point of failure.
      *   *Why 2?* Independent verification. It forces a second look without diluting the standard.
      *   *Criteria:* Unanimity required for acceptance. Any doubt = rejection.
      *   *Addressing the "Groupthink" Worry:* The key is *independent* verification. They shouldn't look together initially. They should sign off separately. Also, empower *anyone* to veto, not just the checkers.

  4.  **Drafting - Section by Section:**

      *   **Header:** Clear title, To/From/Date.
      *   **Executive Summary:** State the goal (safety) and the recommendation (Dual-Check).
      *   **The Problem:** Acknowledge the near-miss and the limitations of both the "Single Expert" and "Large Panel" models.
      *   **The Proposal (The Process):**
          *   Two designated identifiers per session.
          *   Independent verification (blind check).
          *   Unanimous approval required.
          *   "When in doubt, throw it out" policy.
          *   Empowerment of all members to flag concerns.
      *   **Reasoning (Addressing the Conflict):**
          *   *Vs. Single Expert:* Reduces fatigue/error risk (the near-miss).
          *   *Vs. Large Panel:* Avoids groupthink/diffusion of responsibility. Two is enough for redundancy without the noise of five.
          *   *Expertise Management:* The lead expert should be one of the two, but the second person must be competent (not a novice).
      *   **Implementation:** How to select the checkers.

  5.  **Refining the Argument (The "Safety Culture" Angle):**
      *   The prompt specifically asks to deal with the "more checkers isn't automatically safer" worry.
      *   *Key Insight:* Safety isn't just about *heads counting*; it's about *process integrity*. A panel of 5 nodding along is worse than 1 expert paying attention. But 2 experts checking *independently* is better than 1.
      *   *Veto Power:* Give the veto power to *everyone*, not just the checkers. This utilizes the "hunch" member from last year without making them a primary gatekeeper.

  6.  **Review against Constraints:**
      *   *Short?* Yes, keep it concise.
      *   *Process defined?* Yes (2 checkers, unanimity).
      *   *Reasoning included?* Yes.
      *   *Addresses the specific worry?* Yes, explicitly in the "Risk Analysis" section.

  7.  **Final Polish:**
      *   Ensure the tone is respectful to the long-time expert (he's an asset, not a liability) while emphasizing that *systems* beat *individuals* for safety.
      *   Make sure the "Unanimity" rule is clear. One "no" kills the batch.

  8.  **Self-Correction during drafting:** I initially thought about suggesting a rotation. But for safety, consistency is key. Better to have the most qualified people. I should specify that the two checkers need to be the *most* qualified available, not just random members. I also need to make sure the "independent" part is highlighted to prevent the "watching the confident guy" bias.

