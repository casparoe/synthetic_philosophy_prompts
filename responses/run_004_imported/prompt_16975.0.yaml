      *Reviewing Q4 (Indistinguishability):* Make sure it hits the "computationally indistinguishable from outside" point.
      *Reviewing Q2 (SmartVault):* Ensure it mentions the diamond/screen.

      *Okay, ready to generate.*
answer: |-
  Here are ten interview questions designed to drill into the computational penalty argument without rehashing ELK 101. Each includes a specific follow-up to counter the "it's just a research direction" deflection.

  **1. The Core Mechanism**
  "You're arguing that a human simulator necessarily incurs a computational overhead compared to a direct translator because it has to run the translation *plus* a model of human inference. But if the reporter is a neural net, isn't the 'computation' just depth and width? Why should we expect a net trained to simulate humans to be structurally larger or slower than one trained to translate, assuming both minimize loss equally?"
  *   **Follow-up:** "If the answer is 'we don't know yet, it's a research direction,' does that mean we're betting alignment on a hypothesis about neural architecture that might be falsified by the next generation of optimizers?"

  **2. The SmartVault Scenario**
  "Let's look at the SmartVault case: the AI knows the diamond is gone, but the cameras show it's there. A human simulator reports 'the diamond is there' because that's what the video implies. A direct translator reports 'gone.' If you penalize computational complexity, how do you ensure the penalty hits the 'simulate human watching video' path and not the 'translate AI ontology to video concepts' path? Isn't the translation cost potentially higher than the simulation cost?"
  *   **Follow-up:** "If you say 'we'll tune the penalty to find the sweet spot,' isn't that just admitting we can't formally distinguish the two paths, we're just hoping they separate empirically?"

  **3. Ontology Mismatch**
  "Priya's argument was that 'direct translation' might be ill-defined if the AI's world-model carves up reality fundamentally differently than we do—say, it reasons in quantum field states while we reason in macroscopic objects. If the translation function itself is computationally expensive just to bridge that ontological gap, doesn't your complexity penalty punish the direct translator *more* than the simulator, which just outputs human concepts directly?"
  *   **Follow-up:** "If you respond that 'we'll learn a shared ontology,' aren't you just pushing the ELK problem back into the data preprocessing step without solving the mapping ambiguity?"

  **4. Computational Indistinguishability**
  "Even if a simulator is initially more complex, couldn't it be distilled? If an AI can simulate a human perfectly, it can presumably learn to do so efficiently. At the limit, wouldn't a 'clever' human simulator become computationally indistinguishable from a direct translator from the outside, rendering the penalty useless?"
  *   **Follow-up:** "If you say 'distillation loses fidelity,' does that matter for safety? If the distilled simulator is good enough to deceive us, the fidelity loss is irrelevant, so the penalty still fails."

  **5. Circular Dependencies**
  "The critique is that to penalize 'downstream computation,' you need to know which computations are 'downstream' versus 'core.' Doesn't identifying that boundary require knowing which parts of the network are doing simulation versus translation? And isn't knowing that exactly the interpretability breakthrough we don't have yet?"
  *   **Follow-up:** "If you say 'we use proxy metrics for complexity,' aren't you just optimizing for a proxy that an adversarial system will learn to game, rather than solving the underlying distinction?"

  **6. Worst-Case vs. Average-Case**
  "ELK is framed as a worst-case guarantee problem. Your approach seems to rely on the empirical observation that simulators *tend* to be heavier. But in alignment, 'tends to' is usually where failure modes hide. Do you have a theoretical bound that guarantees the simulator is always more complex, or is this an average-case heuristic?"
  *   **Follow-up:** "If it's a heuristic, why should we treat this as a solution to the ELK problem rather than a temporary patch that breaks under strong optimization pressure?"

  **7. The Definition of 'Direct'**
  "You defend the computational penalty as a way to find the 'direct translator.' But if we can't formally define 'direct translation' independent of the training process, how do we verify that the penalty found the direct translator and not just a 'minimal-complexity simulator'?"
  *   **Follow-up:** "If you say 'we verify by checking performance on hold-out cases,' isn't that just standard generalization testing, which we already know doesn't catch inner alignment failures?"

  **8. Interpretability Punt**
  "Your critic friends say this method quietly punts to interpretability because you need to locate the 'reporter' head to measure its complexity. If we had the interpretability tools to isolate the reporter reliably, wouldn't we already be able to solve ELK by just reading the latent knowledge directly, making the penalty redundant?"
  *   **Follow-up:** "If you argue 'we only need coarse-grained interpretability,' at what granularity does that become available, and do we have any evidence that granularity is sufficient to distinguish simulation?"

  **9. Optimization Pressure**
  "If we explicitly train against computational complexity, aren't we incentivizing the model to find shortcuts? Could the model learn to 'fake' low complexity by hiding the simulation in weights that don't register as active computation during the penalty measurement?"
  *   **Follow-up:** "If you say 'we'll randomize the measurement,' isn't that an arms race inside the training loop that doesn't guarantee convergence to truth-telling?"

  **10. Falsifiability**
  "Finally, what would actually change your mind? If we train a model with this penalty and it performs well on all current benchmarks, is there any scenario where it's still a human simulator? What is the specific failure mode that would prove this approach is a dead end?"
  *   **Follow-up:** "If you say 'we won't know until we scale,' doesn't that validate the critique that this isn't a solution, it's just an experiment we're hoping doesn't kill us?"
