prompt: |-
  My aunt Frankie died on Sunday, and because I'm the novelist in the family I've been asked to give the eulogy this Saturday -- everyone assumes that because I write books for a living (sad ones, mostly) I must be good at this, which is not actually how eulogies work. Here's the complication: Frankie was a moral philosopher for almost forty years, not famous outside her own little corner of the field, but she published, had a string of grad students who adored her, and her whole scholarly thing -- the hill she chose to die on, academically -- was arguing that supererogation basically doesn't exist. You know, "going above and beyond the call of duty." She thought the whole category was a comforting fiction, something like Kagan's "no options" line (Limits of Morality, I think? she quoted it at Thanksgiving so often we could all recite the gist) -- that if an act really is the best available thing to do, morality doesn't hand you a choice about it, it just requires it of you. And then, infuriatingly, she went and spent her actual life doing things that look, to the rest of us, exactly like the thing she said didn't exist: gave a kidney to a total stranger in her fifties, fostered something like nine kids over the decades, and was the aunt who'd already be on a plane to the disaster zone while everyone else was still doomscrolling. A local paper once profiled her as "a modern-day saint," and she made us all sit through her furious letter to the editor at the next family dinner, because apparently "saint" is a real technical term in this literature and she took it as an insult.

  So here's my actual problem. Half the room Saturday is going to be old friends and family who want to hear some version of "she went above and beyond," and the other half is former students and colleagues who will visibly wince if I say that exact sentence, since it's basically the one she spent her career arguing was a category error. I can't get up there and deliver a philosophy lecture, and I definately can't imply that everyone who hasn't donated a kidney is a moral failure, which is uncomfortably close to what her actual position entails once you push on it. What I want is a eulogy, something like seven or eight minutes, that's honest to what she really thought -- that the philosophy people in the room recognize as fair to her actual views instead of the fortune-cookie version -- but that still comforts a room full of people who just loved her and could not care less about the literature. Could you draft it for me?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (writes sad books), nephew/niece of the deceased.
      *   **Deceased:** Aunt Frankie, moral philosopher (40 years), specialized in supererogation (argued it doesn't exist).
      *   **Core Conflict:** Frankie argued that "going above and beyond" is a fiction (if it's the right thing, it's required). However, her *life* looked exactly like supererogation (kidney donation, fostering, disaster relief).
      *   **Audience:** Split between family/friends (want to hear she was a saint/hero) and colleagues/students (know her theory, will wince at "above and beyond").
      *   **Constraints:** 7-8 minutes (approx. 1000-1200 words spoken at a moderate pace), honest to her philosophy but comforting to laypeople, avoid implying moral failure for those who didn't match her intensity.
      *   **Tone:** Respectful, nuanced, warm, slightly intellectual but accessible, avoiding preachiness.

  2.  **Deconstruct the Philosophy (The "Frankie Paradox"):**
      *   *Theory:* No supererogation. If an action is the *best* thing to do, it is *obligatory*. There is no "extra credit."
      *   *Practice:* She did extreme things (kidney, fostering, disaster zones).
      *   *The Tension:* To the family, she was a saint. To her, "saint" implied she did *more* than required, which she denied. She believed she was just doing what was *necessary*.
      *   *The Solution:* Frame her life not as "doing more than anyone else" but as "seeing clearly what was required." This honors her theory without shaming the audience. It shifts the focus from *quantity of sacrifice* to *clarity of vision*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (novelist) and the irony. Set the scene. Introduce Frankie not just as an aunt, but as a thinker.
      *   **The Philosophical Hook:** Address the elephant in the room. Her theory on supererogation. Explain it simply without jargon. "There is no extra credit."
      *   **The Life Lived:** List the big deeds (kidney, fostering, etc.). Connect them to the theory. She didn't think she was a hero; she thought she was just *responding*.
      *   **The Bridge (Comfort for the Family):** How do we love her without adopting her impossible standard? We don't have to match her actions to honor her. We honor her by taking the "requirements" of our own lives seriously, in our own scale.
      *   **The Bridge (Respect for Colleagues):** Acknowledge her rigor. She hated the word "saint." She wanted truth.
      *   **Closing:** A final image. Not a pedestal, but a path. A goodbye that feels like her.

  4.  **Refining the Tone:**
      *   *Avoid:* "She was better than us." (Too shaming).
      *   *Avoid:* "She broke the rules of morality." (Insults her work).
      *   *Aim:* "She saw the world with high-definition clarity." (Honors both).
      *   *Voice:* The novelist nephew/niece. Observant, slightly self-deprecating, articulate but emotional.

  5.  **Drafting - Specific Phrasing & Pacing (Mental Check):**
      *   *Time:* 7-8 minutes is roughly 900-1100 words.
      *   *Key Quote:* Need to reference the "Limits of Morality" or the "no options" idea without getting bogged down.
      *   *The Kidney:* Mention it, but don't make it the sole focus.
      *   *The "Saint" Letter:* Include the anecdote about the letter to the editor. It shows her humor and integrity.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Hi, I'm the writer. People think I'm good at sad things.
      *   Frankie was a philosopher. She said "good deeds" aren't optional.
      *   She gave a kidney. People called her a saint. She got mad.
      *   Why? Because she thought love *demands* action.
      *   You don't have to give a kidney to love her. Just listen to the demand of love in your own life.
      *   Goodbye Frankie.

  7.  **Writing - Iteration 2 (Fleshing out the nuance):**
      *   *Critique:* Too blunt. Needs more warmth. The transition from "morality requires it" to "you aren't a failure" needs care.
      *   *Fix:* Emphasize that her "requirement" came from *love*, not a rulebook. She felt the need so acutely that it *became* required for her. For us, the requirement might look different.
      *   *Philosophy Check:* Ensure I don't misrepresent the "no supererogation" view. It's not that *everyone* must give a kidney. It's that *if* it's the best thing, it's required. For her, it was the best thing. For others, maybe not. Wait, that's subjective. Better to say: She believed the moral demand is absolute *when you see the need*. She saw the need more clearly than anyone.

  8.  **Final Polish (incorporating into the final output):**
      *   Make sure the "novelist" persona comes through (attention to narrative, irony).
      *   Ensure the colleagues nod along (accurate enough summary) and the family cries (emotional resonance).
      *   Check word count.

      *(Self-Correction during drafting)*: I need to be careful not to make her sound robotic. Her philosophy wasn't cold; it was intensely demanding. The eulogy should reflect that her rigor was an act of love. The "saint" anecdote is crucial for levity and accuracy.

      *Key phrase to include:* "The comfort of 'enough'." She denied us the comfort of saying "I've done enough." But she offered something else: the clarity of "this is what matters."

      *Ending:* Needs to be definitive. Not "rest in peace" (too generic), but something about her work being done.

  9.  **Final Review against constraints:**
      *   7-8 mins? (Looks like ~1000 words).
      *   Honest to philosophy? (Yes, focuses on obligation vs. supererogation).
      *   Comforting? (Yes, frames it as love/clarity rather than judgment).
      *   No moral shaming? (Yes, emphasizes her unique vision).

      *Let's write.*
answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name]. I'm Frankie's nephew/niece. I'm also the family novelist, which is apparently why I'm standing here. The assumption is that because I write sad books for a living, I must be good at saying goodbye. But as Frankie would be the first to point out, assumptions are often where reasoning goes to die. And she was rarely wrong about reasoning.

  We are here to mourn a woman who spent forty years arguing that the word "mourn" implies a passive sadness, when perhaps the active response to loss is to honor the obligation the deceased leaves behind. But I promise, I will try to speak in plain English.

  There is a complication to eulogizing a moral philosopher, specifically one who specialized in the limits of obligation. Many of you know Frankie as the aunt who showed up with casseroles, the woman who gave a kidney to a stranger in 1998, the foster mother to nearly nine children, the first person on a plane to a disaster zone while the rest of us were still refreshing our news feeds. To the family, and to the local paper that once profiled her, these acts made her a "modern-day saint."

  Those of you who were her colleagues, or her students, are likely wincing right now. I can hear it from here.

  Because Frankie did not believe in saints. And she certainly did not believe in "going above and beyond."

  Her life's work, the hill she chose to die on academically, was the argument that supererogation—the idea that there are good deeds that are praiseworthy but not required—is a comforting fiction. She stood with the hardliners. She believed that if an action is the *best* thing to do, morality does not offer you a choice. It does not give you a gold star for doing it. It simply requires it.

  I remember one Thanksgiving, after someone called her a hero for something she'd done that week—picking up a stray dog, funding a student's tuition, I don't recall—she made us all sit through her reading of a furious letter she'd written to the editor. The paper had called her a saint. She was incensed. Not because she was humble, but because she was precise. To call her a saint was to imply she had done *more* than was asked of her. To Frankie, that implied that what she did was optional. And she didn't believe it was.

  So, I have a tightrope to walk this morning.

  To the family: I know you want to celebrate her generosity. You want to say she gave more than anyone else.
  To her friends and students: I know you want to honor her intellect and her rigor. You know that calling her "special" undermines her argument that we are *all* bound by these demands.

  Here is the truth that bridges that gap.

  Frankie did not live the way she did because she thought she was better than us. She didn't give a kidney because she wanted to be a hero. She did it because she looked at the world with a terrifying, beautiful clarity, and she saw a need that she could meet. In her view, once you see the need, and you have the capacity to meet it, the "choice" evaporates.

  She denied herself the comfort of thinking she had done "enough." But in doing so, she offered us a different kind of comfort.

  If there is no "above and beyond," then there is also no "too far." There is only what is required by love.

  For Frankie, the moral demand was loud. It was constant. It was the background noise of her life. When she saw a child in the system, she didn't think, "I have done enough fostering." She thought, "There is a child. I have a room. The math is simple." When she saw a stranger sick in a hospital, she didn't think, "Someone else should help." She thought, "I can help. So I must."

  I know what some of you are thinking. You're thinking, "If I accept her view, doesn't that make me a failure? I haven't given a kidney. I haven't flown to a disaster zone."

  No. And Frankie wouldn't want you to carry that guilt. Guilt is useless data.

  Her philosophy wasn't a weapon to judge others; it was a lens to clarify her own vision. She believed that we all have obligations, but they are specific to our capacities and our positions. Her obligation was to foster. Yours might be to teach. Or to listen. Or to raise a child with patience. Or simply to show up on a Saturday morning when a friend is grieving.

  The point wasn't that we all have to do *her* actions. The point was that we should stop pretending that love is optional.

  She taught us that the category of "extra credit" is a way of letting ourselves off the hook. It allows us to say, "Well, I'm not a saint, so I don't have to try that hard." Frankie removed that exit door. She stood in the doorway and blocked it. She said, "Don't look for the ceiling. Just look at the person in front of you."

  To her colleagues: I promise I will not call her a saint. I will not say she went above and beyond.
  To her family: I will say she loved us with a ferocity that felt like a law of physics.

  She was often asked, in interviews, if her philosophy made her tired. If it was exhausting to live as if every good deed was mandatory. She always said no. She said it was exhausting to *decide*. It was exhausting to weigh the cost. By removing the option to do nothing, she saved herself the energy of negotiation. She didn't waste time wondering if she *should* help. She just helped.

  In the end, that is the gift she leaves us. Not a list of rules. Not a standard we must fear failing. But an example of clarity.

  When we miss her—and we will, fiercely—we shouldn't miss her because she was "better" than us. We should miss her because she saw the world more clearly than we do. She saw the connections between us as binding wires, not loose threads.

  So, how do we honor her? We don't erect a statue. She'd hate that. We don't try to mimic her specific sacrifices; she'd think that was performative.

  We honor her by listening to the quiet demands of our own lives. We honor her by noticing when the "choice" to be kind is actually an illusion, because kindness is the only real option. We honor her by admitting that sometimes, the right thing is hard, but it is not *extra*. It is just the price of admission for being part of a community.

  Frankie spent her life arguing that there is no such thing as doing more than your duty. But in doing so, she showed us that duty, when fueled by love, looks exactly like grace.

  She is done negotiating now. She has met the final requirement. And I like to think she found, in the end, that the demand was not a burden, but a welcome.

  Rest well, Aunt Frankie. You've done what was required. We'll try to take it from here.

  Thank you.
