answer: |-
  Here is a principled philosophical framework you can use to ground your ex-wife's objection. It moves the argument away from "apps make you vain" (a psychological claim) to "this specific method is logically incompatible with this specific type of virtue" (a structural claim).

  ### The Criterion: Regulative vs. Constitutive Self-Relation

  The distinction you are looking for lies in **what the virtue requires the self to do with its own attention.**

  We can divide Franklin's list into two categories based on the **Locus of Evaluation**:

  1.  **Regulative Virtues (Trackable):** These virtues govern the management of external actions or physical appetites. The self acts as a *manager* overseeing a *process*. The act of monitoring the process does not interfere with the process itself.
      *   *Examples:* Temperance (eating), Frugality (spending), Industry (time use), Cleanliness (hygiene), Order (arrangement).
      *   *Logic:* "I am observing my behavior to ensure it fits the rule." The observation is neutral; it does not change the nature of the behavior.

  2.  **Constitutive Virtues (Untrackable):** These virtues govern the self's *orientation toward itself* or its internal state of being. The self is not just the manager; it is also the *object* being managed. In these cases, the act of monitoring alters the very state being measured.
      *   *Examples:* Humility, Tranquility, (and arguably) Sincerity.
      *   *Logic:* "I am observing my lack of ego." The observation *is* an act of ego.

  **The Criterion:** A virtue is vulnerable to reflexive self-undermining if **the stance required to audit the virtue contradicts the stance required to possess it.**

  ### Why This Is Not Just "Vanity"

  It is a common truism that a virtuous person can become proud of their virtue (the "Pharisee problem"). That is a moral failing—a risk of *character*.

  The argument your ex-wife is making is stronger: it is a **performative contradiction**. It is not that the protagonist *might* become proud; it is that the *mechanism of the app* makes the achievement of the virtue logically impossible.

  *   **Vanity Claim:** "If you track humility, you might get proud." (Contingent risk).
  *   **Structural Claim:** "If you track humility, you are necessarily asserting the authority of the self over the self, which is the definition of pride." (Necessary failure).

  In the Regulative virtues, the "I" that tracks and the "I" that acts are functionally distinct enough that they don't collide. In the Constitutive virtues, the "I" that tracks is the very thing that needs to be quieted. You cannot use a megaphone to measure silence.

  ### Ruling on the Three Virtues

  Here is how you apply this criterion to Sincerity, Tranquility, and Moderation. This gives your ex-wife specific ammunition beyond just Humility.

  #### 1. Moderation (Safe / Regulative)
  *   **Franklin's Definition:** "Avoid extremes; forbear resenting injuries so much as you think they deserve."
  *   **The Ruling:** **Trackable.**
  *   **The Reason:** Moderation is primarily about **quantities and boundaries**. It is a Regulative virtue. You can count extremes. You can log instances of resentment. Like Temperance or Frugality, it is about drawing a line and staying within it. The act of checking "Did I stay within the line?" does not inherently push you over the line. The "self" monitoring the boundary is not the same "self" that is being moderated.

  #### 2. Tranquility (Vulnerable / Constitutive)
  *   **Franklin's Definition:** "Be not disturbed at trifles, or at accidents common or unavoidable."
  *   **The Ruling:** **Untrackable.**
  *   **The Reason:** Tranquility is a **state of non-attachment**. To track it, you must be hyper-attached to your internal emotional state. You must constantly scan your horizon for "trifles" and "accidents" to see if they are disturbing you.
  *   **The Contradiction:** The moment you ask, "Am I disturbed?" you have introduced a meta-anxiety. You are now disturbed by the possibility of being disturbed. The audit creates the noise it is meant to measure. A clean grid on Tranquility proves only that you are good at suppressing visible reactions for the sake of the grid, not that you are actually tranquil.

  #### 3. Sincerity (Vulnerable / Constitutive)
  *   **Franklin's Definition:** "Use no hurtful deceit. Think innocently and justly, and, if you speak, speak accordingly."
  *   **The Ruling:** **Untrackable.**
  *   **The Reason:** Sincerity is about the **alignment of motive and action**. It requires that you speak the truth *because it is the truth*, not because of an external incentive.
  *   **The Contradiction:** The app introduces a new, dominant incentive: **The Grid.** If you withhold a lie today to keep your streak alive, you are not being Sincere; you are being Compliant. You are performing truthfulness for an audience (even if that audience is your future self-data). The tracking system externalizes the motive. You can no longer know if you were sincere, or if you were just gaming the metric. The tracking destroys the "innocently" part of Franklin's definition.

  ### How This Lands in the Scene

  This framework allows your ex-wife to avoid sounding like a Luddite. She isn't saying "technology is bad." She is saying "your architecture is flawed."

  She can argue that the protagonist has built a machine for **Regulative Virtues** (which make good employees and managers) and mistakenly applied it to **Constitutive Virtues** (which make good humans).

  **Sample Dialogue Beat:**

  > "You're treating humility like it's calories," she said. "Like if you count them, you've burned them. But humility isn't a behavior you perform. It's a silence you keep. The second you open the app to log that you were humble, you've broken the silence. You're not tracking virtue, David. You're monetizing your own ego and calling it redemption."
  >
  > "That's cynicism," he said.
  >
  > "No, it's syntax. Temperance, Order, Industry—those work. They're about what you *do*. But Humility? Tranquility? Those are about what you *don't* assert. You can't build a dashboard for a negative space. The data point itself fills the hole."

  This gives her the philosophical high ground: she understands the *ontology* of the virtues better than he does, revealing that his "reinvention" is actually just a deeper entrenchment of the productivity mindset that caused his burnout in the first place.
