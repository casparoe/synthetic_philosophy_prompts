answer: |-
  It is completely understandable that this is messing with your head. You have spent forty years operating within a framework where "success" means your map matches the territory. Rorty comes along and says, "The territory is real, but the idea of 'matching' is a category error." To a working scientist, that sounds like being told, "The engine runs, but combustion doesn't actually make it go."

  Your colleague is right that this debate has raged for decades, but your frustration with the "relativist" label is justified. That label is usually applied by people who haven't read past the blurbs. Rorty is not saying "anything goes." He is saying that the *philosophical explanation* of why things go has been wrong for 400 years.

  To understand why this isn't a dodge, we have to look at the specific mechanism you mentioned: the Donald Davidson distinction between **causation** and **justification**. This is the engine of Rorty's argument in *Philosophy and the Mirror of Nature* (and later works).

  Here is the walkthrough, using your background to keep it grounded.

  ### 1. The Davidsonian Pivot: Causation vs. Justification

  The traditional "Mirror of Nature" view (Realism) assumes that for a belief to be true, there must be a relationship between a *sentence* (in your head or on paper) and a *fact* (out in the world). This relationship is called "correspondence."

  Davidson (and Rorty following him) argues that we are mixing up two totally different kinds of relations:

  1.  **Causal Relations:** These happen between **events/objects**.
      *   *Example:* A photon hits your retina; a tectonic plate shifts; a rock hits your toe.
      *   *Nature:* This is brute force. It is non-rational. The world doesn't "argue" with you; it just bumps into you.
  2.  **Justificatory Relations:** These happen between **beliefs/sentences**.
      *   *Example:* "The seismograph shows a P-wave" supports "There was an earthquake."
      *   *Nature:* This is logical/social. Only a sentence can justify another sentence.

  **The Critical Move:** Rorty argues that **the world can cause you to have a belief, but it cannot justify that belief.**

  Why? Because justification requires language. To say a belief is "justified" is to say it fits well with other beliefs we hold. The non-linguistic world (the rocks, the light, the gravity) does not speak sentences. Therefore, the world cannot stand in a logical relation to your sentences. It can only stand in a causal relation to your nervous system.

  ### 2. A Geophysical Example

  Let's apply this to your field. Imagine you are interpreting seismic reflection data to locate an oil reservoir.

  **The Realist (Mirror) Story:**
  1.  There is oil underground (Reality).
  2.  The seismic waves bounce off the oil (Causal interaction).
  3.  Your theory produces a map (Representation).
  4.  The map is **True** because the structure on the paper *corresponds* to the structure of the oil underground.

  **The Rorty/Davidson Story:**
  1.  There is stuff underground (Reality).
  2.  The stuff causes waves to bounce and wiggle the stylus on your seismogram (Causal interaction). **Rorty grants this 100%.**
  3.  You interpret the wiggle as "oil" based on your current vocabulary of geophysics (Justification).
  4.  The statement "There is oil here" is **True** because it is a belief that allows you to coordinate with your drilling team, secure funding, and successfully extract hydrocarbons without hitting dry rock.

  **Where is the difference?**
  In the Realist story, there is a magical glue called "Correspondence" that links the sentence "There is oil" to the non-linguistic sludge underground. Rorty asks: *What does that glue look like? How do we check it?* To check if the sentence matches the oil, you would have to step outside your own language and look at the oil "as it really is" without using any concepts. But you can't do that. You can only look at the oil using *more sentences* (e.g., "The drill hit hydrocarbons").

  So, for Rorty:
  *   **The World's Role:** The world is the *cause* of your sensory stimuli. It constrains you. If there is no oil, the drill comes up dry. The world pushes back.
  *   **Truth's Role:** Truth is not a relation between the drill and the oil. Truth is a compliment you pay to the *sentence* "There is oil" because it survived the test of the drill.

  ### 3. Addressing Your Dilemma: Instrumentalism vs. Relativism

  You asked how this avoids collapsing into (a) boring instrumentalism or (b) relativism.

  **(a) Is it just Instrumentalism?**
  In a sense, yes. Rorty admits he is a pragmatist. But he argues that *you* are already an instrumentalist when you are working, and only become a Realist when you go to philosophy seminars.
  When you are in the field, you don't worry about whether your map "mirrors" reality. You worry about whether the map gets the drill to the right spot. Rorty's goal isn't to change your scientific practice; it's to change your *philosophical anxiety*. He wants you to stop worrying that, because you can't prove "Correspondence," you might be missing "Real Truth." He wants you to say, "Successful prediction and coordination is the only 'truth' we can meaningfully talk about."
  He thinks this is liberating, not boring. It frees science from the burden of trying to be "God's Eye View."

  **(b) Is it Relativism?**
  This is the big charge. If truth is just "what works for us," isn't that relative?
  Rorty says **no**, and here is the Davidsonian reason why:
  Relativism assumes there is a neutral court of appeal where we can compare two different vocabularies (e.g., "Modern Geophysics" vs. "Ancient Mythology") to see which one is "really true." Rorty says there is no neutral court.
  However, that doesn't mean all vocabularies are equal.
  *   **Constraint:** The world is causal. If you use the "Ancient Mythology" vocabulary to drill for oil, you will likely fail. The world will causally intervene (dry hole).
  *   **Solidarity:** We judge truth within our community. Modern geophysics is "better" than mythology not because it matches the world better (we can't check that), but because it allows us to do more things (predict earthquakes, find energy, build cities).

  So, it's not relativism because **the world still kicks back.** It's just that the kick is causal, not logical. The world can't tell you that your *theory* is wrong; it can only cause events that make your *predictions* fail.

  ### 4. Why This Isn't a Dodge

  You suspected this might be a verbal trick to have it both ways. Here is why Rorty thinks it's a substantive philosophical shift.

  The "Mirror" picture creates a problem called **Skepticism**.
  *   *The Skeptic asks:* "How do you know your senses aren't deceived? How do you know your map really matches the territory?"
  *   *The Realist answer:* Struggles to prove the link between mind and world.

  Rorty's move dissolves the problem.
  *   *Rorty says:* "Stop trying to prove the link. There is no link to prove. There are only causes (world to mind) and justifications (mind to mind)."
  *   *The Result:* Skepticism becomes unintelligible. You can't ask "Does my belief match the world?" because "matching" is a category error. You can only ask "Does this belief help me cope with the causal impacts of the world?"

  For a scientist, this shifts the focus from **Accuracy** (a metaphysical property) to **Utility** (a social/causal property).

  ### 5. Summary for the Retired Geophysicist

  1.  **Keep the World:** Rorty agrees the world exists independently of us. It causes our sensations. It breaks our toes. It dries up our wells.
  2.  **Drop the Mirror:** Stop thinking of your theories as "pictures" of the world. Think of them as "tools" for coping with the world.
  3.  **The Davidson Split:**
      *   **Causation:** World $\rightarrow$ Mind (Non-linguistic, brute).
      *   **Justification:** Mind $\leftrightarrow$ Mind (Linguistic, social).
      *   Truth belongs to the realm of Justification, not Causation.
  4.  **No Relativism:** We aren't free to believe anything because the world causally constrains us. But we shouldn't pretend our beliefs are "true" because they match the world; they are "true" because they survive the world's causal tests and help us coordinate with each other.

  Rorty isn't trying to tell you how to do geophysics. He is trying to tell you that the philosophical worry you've quietly carried for 40 years—"Am I *really* seeing the world as it is?"—is a bad question. It assumes a relationship (correspondence) that doesn't exist.

  He wants you to feel okay about saying: "I don't know if my map matches Reality with a capital R. I only know that using this map, we found the oil, and nobody died. That's enough."

  That is why he insists he isn't a relativist. He's not saying "All maps are equal." He's saying "The quality of a map is determined by how well it navigates the terrain, not by a mystical metaphysical bond to the terrain."
