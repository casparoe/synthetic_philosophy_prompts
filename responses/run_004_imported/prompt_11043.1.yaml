      *   *Claim 2: Circularity.* To define an "intervention" ($I$ on $X$), you need to ensure $I$ affects $Y$ *only* through $X$. This requires knowing the causal structure beforehand. Thus, causation is defined by intervention, but intervention is defined by causation.

  3.  **Develop the Argument (Supporting the User):**
      *   *The Counterfactual Core:* Start by establishing that both theories are fundamentally modal. They ask "What if?" Lewis uses metaphysical similarity; Woodward uses experimental manipulation. But logically, both evaluate $P(Y | do(X))$ vs $P(Y | \neg X)$.
      *   *The "Restriction" Point:* Lewis's similarity metric is too broad (includes miracles, backtracking). Woodward restricts the "closest world" to one where an exogenous variable changes $X$ without touching other paths. This is effectively pruning the similarity metric to "causal paths only."
      *   *The Circularity Charge (The Heavy Hitter):* Focus on Woodward's definition of an *ideal intervention*.
          *   Condition 1: $I$ causes $X$.
          *   Condition 2: $I$ does not cause $Y$ directly (only via $X$).
          *   Condition 3: $I$ is uncorrelated with other causes of $Y$.
          *   *The Trap:* To verify Condition 2, you need to know the causal graph between $I, X, Y$. But the theory is supposed to *tell* you the causal graph. You can't use the tool to build the tool.
