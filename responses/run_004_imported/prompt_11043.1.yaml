      *   *Epistemic vs. Ontological:* Woodward claims to be ontological (what causation *is*), not epistemic (how we *know* it). But if we can't identify an intervention without prior causal knowledge, the ontology collapses into an epistemic circle.

  4.  **Develop the Counter-Argument (Woodward's Resistance):**
      *   *Modularity:* Woodward argues that causal relations are modular. We don't need to know the *whole* system, just that the intervention breaks the link between $X$ and its prior causes.
      *   *Non-Reductive:* He admits it's not reductive. He isn't trying to reduce causation to non-causal terms (like Humean regularities). He's trying to clarify the *concept* used in science.
      *   *Testing Interventions:* We can test if something is an intervention using statistical independence (instrumental variables), not just prior causal knowledge. It's a bootstrapping process, not a vicious circle.
      *   *Pragmatism:* The theory is meant to capture scientific practice, not provide a metaphysical foundation from nowhere.

  5.  **Structure the Essay:**
