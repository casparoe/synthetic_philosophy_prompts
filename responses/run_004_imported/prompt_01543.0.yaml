      *   *Reconciliation:* The *materials* of thought come from sense (images of lines, shapes). But the *certainty* comes from the method of reasoning (computation) applied to definitions we have stipulated.
      *   *Key Distinction:* Sense gives us the *phantasm* of a circle. Reason allows us to define "circle" and deduce properties. The certainty isn't that the physical circle is perfect (it isn't), but that *if* we define it thus, the consequences follow necessarily.
