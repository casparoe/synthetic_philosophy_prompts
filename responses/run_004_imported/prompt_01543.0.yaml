answer: |-
  Your TA has excellent instincts. She is sensing a genuine philosophical fault line, and your current framing ("Hobbes and Descartes are on the same page about reason vs. sense") is likely the source of the friction. While they both champion geometry, they do so for radically different metaphysical and epistemological reasons.

  The "move" historians of philosophy make to reconcile Hobbes's empiricism with his geometrical rationalism rests on three pillars: **Nominalism**, **Constructivism**, and the distinction between the **Origin of Ideas** and the **Criterion of Truth**.

  Here is the breakdown of how to fix the lecture and answer your specific question.

  ### 1. The Cartesian Trap in Your Current Framing
  The problem with teaching Hobbes as sharing Descartes' "reason-over-sense" justification is that Descartes' justification is **Platonic-Augustinian**, whereas Hobbes' is **Materialist-Nominalist**.

  *   **Descartes:** Geometry is certain because the intellect grasps eternal essences that transcend the sensory world (the Wax Argument). The senses are deceptive; the *lumen naturale* (natural light) of the intellect accesses truths guaranteed by a non-deceptive God.
  *   **Hobbes:** There is no separate "intellect" that transcends sense. There is only "computation." For Hobbes, the mind is matter in motion. "Imagination" is just decaying sense. "Reasoning" is nothing more than adding and subtracting the consequences of names.

  If you tell students Hobbes thinks geometry is certain because "reason grasps truths the senses can't," you are inadvertently giving him a Cartesian faculty of intellect that he explicitly denies exists.

  ### 2. The Reconciliation: How Empiricism Meets Geometry
  So, how does Hobbes reconcile "all conceptions begin in sense" with "geometry is certain"?

  **A. The Origin vs. The Operation**
  Hobbes's empiricism (*Leviathan* Ch. 1) is a claim about the **origin** of the materials of thought. We cannot think of a line without having first seen a mark or a boundary. The *phantasm* of a circle comes from sense.
  However, the **certainty** of geometry does not come from the *source* of the idea, but from the **generation** of the object.

  **B. Constructivism (The "Propter Quid" Argument)**
  This is the crucial move. For Hobbes, natural philosophy (physics) is uncertain because we observe effects and have to guess at causes (which God could have arranged differently). But in geometry, **we are the cause.**
  *   We define the circle.
  *   We stipulate the generation of the line.
  *   Therefore, we know the properties of the figure with certainty because we know exactly how we made it.

  In *De Corpore*, Hobbes argues that geometry is the only science because it is the only one where we can know the *cause* of the object of study. We don't discover geometrical truths in the world (where no perfect circles exist); we construct them in definition and deduce the consequences.

  **C. Nominalism: Truth is in Language, Not Things**
  This is the big one. For Descartes, geometrical truths are true of reality because God created reality according to those truths. For Hobbes, **"Truth consisteth in the right ordering of names in our affirmations."**
  Geometry is certain not because it maps onto a non-sensory realm of forms, but because it is a system of consistent linguistic stipulations.
  *   **Sense** gives us the image.
  *   **Language** gives us the definition.
  *   **Reason** (computation) gives us the consequence.

  So, there is no contradiction. All ideas start in sense (empiricism), but the *necessity* of geometry comes from the fact that we are reasoning about our own definitions, not about external sensory data. We aren't measuring physical circles (which are imperfect); we are deducing consequences from the name "circle."

  ### 3. Why the TA Felt Something Was "Off"
  Your TA likely sensed that Hobbes doesn't fit the "Rationalist" box in the same way Descartes does. In the standard Rationalist/Empiricist divide, Hobbes is a weird hybrid: an **Empiricist about psychology** but a **Rationalist about method**.

  If you frame it as "Descartes and Hobbes both trust Reason over Sense," you obscure the fact that:
  1.  **Descartes** trusts Reason because it connects us to God/Essences.
  2.  **Hobbes** trusts Reason (Geometry) because it is a closed system of human making, immune to the vagaries of external nature.

  Hobbes actually attacks the idea of "Universals" or abstract essences that Descartes relies on. For Hobbes, there is no "Triangularity" floating in the ether. There are only particular triangles and the name we give them. Geometry works *despite* being rooted in sense, not because it escapes sense.

  ### 4. Suggested Pedagogical Shift
  Instead of framing the unit as "The Geometrical Method: Reason vs. Sense," consider framing it as **"The Geometrical Method: Discovery vs. Construction."**

  *   **Descartes:** Geometry is a tool of **Discovery**. It reveals the hidden architecture of creation placed there by God. We use the intellect to strip away the sensory confusion and see the divine math.
  *   **Hobbes:** Geometry is a tool of **Construction**. It is the only science because it is the only one where humans are the creators. We know it perfectly because we made it up.

  **How to explain the *Leviathan* opening in this context:**
  Tell your students: "Hobbes says all ideas come from sense. So where does perfect geometry come from, since we never see a perfect line? Hobbes says the *image* comes from sense, but the *truth* comes from the definition we assign to that image. We agree to call this generated figure a 'circle,' and then we compute what follows. The certainty is in the computation of names, not in the sensory input."

  ### Summary of the "Move"
  The reconciliation is **Nominalist Constructivism**.
  1.  **Empiricism:** All raw data (phantasms) come from sense.
  2.  **Geometry:** Is certain because it is the computation of consequences of definitions we have stipulated, not observations of external nature.
  3.  **No Contradiction:** We use sense-derived images as tokens, but the necessity arises from the linguistic/conceptual rules we impose on them, not from the images themselves.

  Your TA is right to flag it. Hobbes isn't a Cartesian rationalist; he's a materialist who thinks geometry is the only science precisely because it *doesn't* rely on the uncertain external world that our senses report on, but rather on the internal consistency of our own stipulated definitions.
