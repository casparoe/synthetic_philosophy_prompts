      *   *Section 4: Modern Philosophy Connection.* Connect to Ghiselin, Hull, etc. (Species as individuals vs. classes). Darwin treats them as real lineages (individuals in the philosophical sense) but arbitrary ranks (classes).
      *   *Section 5: Mara's Microbiology Context.* Explain why she feels this way (HGT, asexual reproduction) and why Darwin's view fits macro-biology better.
      *   *Conclusion:* You win on textual interpretation; she wins on modern microbial application.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did Darwin actually say species *don't exist*? No, he said the *term* is arbitrary. That's a linguistic claim, not an ontological one (mostly).
      *   *Check:* Is "Continuum Realism" a standard term? It's descriptive enough. Better to use "Lineage Realism."
