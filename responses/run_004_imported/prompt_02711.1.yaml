answer: |-
  This is a fantastic debate to have, and honestly, the fact that you and Mara were digging into the first edition of *Origin* at midnight is the kind of biology philosophy that keeps the field alive.

  Here is the short answer: **Your reading is textually and philosophically more defensible regarding Darwin's specific intent, but Mara is right about where modern biology (especially microbiology) has pushed the implication.**

  Darwin is not an eliminativist about species; he is an **anti-essentialist** about them. He denies that "species" is a fundamental *kind* of thing in nature (like a chemical element), but he affirms that the *lineages* we label as species are real historical entities.

  Here is the breakdown of why your "continuum realism" holds up, how it maps to modern philosophy of biology, and where Mara's microbiological perspective complicates the picture.

  ### 1. Anti-Essentialism vs. Eliminativism
  Mara is reading Darwin as an **eliminativist** (the claim: "Species do not exist"). You are reading him as a **conventionalist about boundaries but realist about processes** (the claim: "Species exist as segments of lineages, but the cutoff points are human decisions").

  The textual evidence supports you. When Darwin says the term is "arbitrarily given for the sake of convenience," he is attacking **typological essentialism**. In 1859, the prevailing view (owed largely to Cuvier and Agassiz) was that species were fixed, immutable "kinds" created by God, defined by a necessary and sufficient essence. If an organism didn't match the essence, it wasn't a member of the species.

  Darwin's argument is that there is no *essence*. There is only genealogy.
  *   **Mara's reading:** "No essence = No species."
  *   **Your reading:** "No essence = No sharp boundaries, but the lineage is real."

  The "Incipient Species" point you raised is the smoking gun against Mara's reading. As you noted, you cannot have an "incipient X" if X is a fiction. If I say, "This is an incipient unicorn," I am implying unicorns are real things that one can become. By calling a variety an "incipient species," Darwin is committing to the reality of the *process* of speciation. He views species as temporary stages in the divergence of lineages. The *label* is arbitrary (where do we draw the line between late-variety and early-species?), but the *divergence* is objective.

  ### 2. The Genera Analogy
  Darwin's second quote ("treat species in the same manner as those naturalists treat genera") is often cited by eliminativists, but it actually supports your view.

  No one is an eliminativist about **genera**. Biologists agree that the genus *Canis* is a useful grouping of closely related species (*lupus, latrans, familiaris*). It is "artificial" only in the sense that the rank *Genus* is a human convention imposed on a branching tree. The *grouping* reflects real genealogical proximity, but the *rank* is arbitrary.

  By saying species should be treated like genera, Darwin is saying: **"Species are just smaller genera."** They are real clusters of genealogical relatedness, but the decision to call a cluster a "species" rather than a "variety" or a "genus" is a matter of degree and convenience, not a discovery of a metaphysical boundary.

  ### 3. Connection to Modern Philosophy of Biology
  You asked if Darwin anticipates the distinction between **species-as-category** and **species-as-taxon**. Yes, he effectively does, though the terminology came later.

  In the 1970s and 80s, philosophers like **Michael Ghiselin** and **David Hull** argued for the **"Species are Individuals" thesis**.
  *   **Old View (Classes):** Species are classes defined by shared properties (essences).
  *   **New View (Individuals):** Species are spatiotemporally localized historical individuals (lineages).

  Darwin is the grandfather of the "Individuals" thesis. He treats species as segments of the tree of life.
  *   **Category:** The rank "Species" is conventional (Darwin agrees with Mara here).
  *   **Taxon:** The specific group (e.g., *Homo sapiens*) is a real segment of a lineage (Darwin agrees with you here).

  True **eliminativism** in modern philosophy (championed by some like Brent Mishler) argues that because boundaries are fuzzy, we should stop using the word "species" entirely and just talk about "clades" or "terminal taxa." Darwin does *not* go this far. He keeps the word "species" throughout the *Origin*. He wants to change the *definition*, not delete the *term*.

  ### 4. Why Mara Feels Right (The Microbiology Problem)
  Mara isn't just being stubborn; she is bringing a post-Darwinian problem to a Darwinian text. Darwin was thinking about macro-organisms (birds, barnacles, beetles) where sexual reproduction creates natural clusters (reproductive isolation).

  In microbiology, the "Species" concept is indeed much closer to eliminativism because of **Horizontal Gene Transfer (HGT)**. Bacteria swap genes across what we would call species boundaries. The "tree" becomes a "web." For a microbiologist, the "continuum" is so blurred that the "bins" feel almost entirely arbitrary.

  Mara is projecting the **Microbial Species Problem** onto Darwin. Darwin's "arbitrary" comment was about the *degree of difference* in sexually reproducing organisms. Mara's "arbitrary" feeling is about the *lack of coherent lineages* in prokaryotes. Darwin didn't know about HGT. If he had, he might have been more sympathetic to her eliminativism regarding bacteria, but his text is committed to lineage realism for the organisms he studied.

  ### The Verdict
  **You win the exegesis; Mara wins the modern application.**

  *   **Textually:** You are correct. Darwin is a **Lineage Realist**. He believes the divergence is real and objective. He believes the *naming* of that divergence at a specific threshold is conventional. He is attacking the *essence* of species, not their *existence* as genealogical units.
  *   **Philosophically:** Darwin anticipates the **Species-as-Individuals** view, not strict eliminativism. He frees biologists from searching for an "essence," not from using the concept of species as a proxy for distinct lineages.
  *   **Mara's Point:** Her frustration is valid for modern microbiology, where the "continuum" is often too messy for Darwin's "incipient" model to hold water. But she is attributing a modern crisis to Darwin that he didn't fully articulate.

  **How to settle the bet:**
  Tell Mara that Darwin is an **ontological realist** (lineages exist) but a **semantic conventionalist** (the word "species" is a label we apply to those lineages). She is treating his semantic conventionalism as ontological eliminativism. Darwin didn't say species aren't real; he said they aren't *special* in the way Creationists thought they were. They are just well-marked varieties that have been diverging long enough for us to give them a new name.

  (Also, tell her that if Darwin were alive today and saw bacterial HGT, he'd probably buy her a drink and admit she has a point about prokaryotes—but he'd still insist that for the finches, the lineage is real.)
