          *   Quote 1: End of Chapter 2 ("term species, as one arbitrarily given for the sake of convenience...").
          *   Quote 2: End of the book ("treat species in the same manner as those naturalists treat genera... artificial combinations... freed from the vain search for the undiscovered and undiscoverable essence").
      *   **The Dispute:**
