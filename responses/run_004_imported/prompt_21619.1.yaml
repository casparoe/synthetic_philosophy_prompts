answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm [Your Name], one of [Honoree]'s graduate students. I have the distinct privilege of being the last student to pass through her seminar before she retires. Looking around this room, I realize I am standing at the intersection of two very different worlds.

  On my left, I see the economists, the philosophers, and the statisticians. You know [Honoree] for her partitions, her sigma-algebras, and her forty-year interrogation of what it means for two honest people to share information. You know that if her posteriors are common knowledge, they must be equal.

  On my right, I see her family. You know [Honoree] for a slightly different reason. You know her as the person who, for three decades, has interrupted Thanksgiving dinner to gently inform you that saying "let's just agree to disagree" is logically incoherent if you both know what the other person believes.

  I want to talk briefly about the bridge between those two groups. Because while the specialists here know the math, I think the family actually understands the spirit of the work better than anyone.

  Her career has been built on a profoundly optimistic idea: that communication, if it is truly honest and truly shared, draws us together. The theorems she spent her life refining—from Aumann's original insight to the Geanakoplos–Polemarchakis result on iterative updating—all suggest that disagreement is often a failure of information, not a failure of character. If we truly understand each other, and we start from the same place, we end up in the same place.

  Now, I know there is a friendly debate in the field regarding the "Common Prior Assumption." I see [Colleague/Rival's Name] nodding. You have argued for years that the Common Prior is doing all the heavy lifting in her theorems. And tonight, I want to offer a solution that respects both your critique and the occasion.

  I am holding a glass of wine. Some of you think it is excellent. Some of you think it is mediocre. Now, if we assume we all share a Common Prior about wine quality, and we make our assessments common knowledge, the theorem dictates we must converge on a single valuation. That seems risky for a dinner party.

  So, for the next five minutes, I propose we formally suspend the Common Prior Assumption. This is a technically valid maneuver. Without a common prior, the agreement theorem does not hold. This allows the specialists to remain rigorous, and it allows the rest of us to honestly agree to disagree about the wine, without [Honoree] correcting our epistemic states.

  But in all seriousness, that unresolved debate with [Colleague's Name] is perhaps the greatest tribute to her work. It shows that her ideas are not dead letters; they are living, breathing things that still demand engagement. She didn't want disciples; she wanted interlocutors.

  To her family: I know it can be exhausting to be loved by someone who cares more about the truth than the comfort of a social pleasantry. But I hope you know that when she corrects you at dinner, it isn't pedantry. It's an invitation. She believes that you are capable of perfect honesty. She believes that your minds are worth the effort of alignment. In a world that is increasingly comfortable with polarization, she spent forty years insisting that we are not meant to drift apart.

  To me, and to all her students, she taught us that rigor is a form of kindness. To slop through a proof, or to accept a fuzzy definition, is to disrespect the person you are arguing with. She held us to a high standard because she believed we could reach it.

  [Honoree], you have shown us that while we may not always converge, we must always try to understand the structure of our divergence. You are retiring from the university, but I suspect you will never retire from the conversation.

  So, if everyone could raise their glasses.

  To [Honoree]. May your priors be just, your information be complete, and your retirement be free of any need to update.

  To [Honoree].
