      *   *Harsanyi:* "Cardinal Utility in Welfare Economics and in the Theory of Risk-Taking" (1953), "Can the Maximin Principle Serve as a Basis for Morality?" (1975). Veil = Impartial Observer. Equiprobability assumption (risk). Expected Utility Maximization. Average Utilitarianism. Critique of Maximin as irrational.
