answer: |-
  Your friend was absolutely right. You have independently rediscovered one of the most persistent and debated problems in modern moral philosophy.

  The specific line of reasoning you are describing is the core tenet of **Act Utilitarianism**, and the uncomfortable bind you feel is known as the **Demandingness Objection**.

  The philosopher most associated with this specific formulation is Peter Singer. In his famous 1972 essay *Famine, Affluence, and Morality*, he argued that if you can prevent something bad from happening (like a child drowning in a shallow pond) without sacrificing anything of *comparable* moral significance (like ruining your shoes), you are morally obligated to do it. He then generalized this: if you can save a life by donating money that you would otherwise spend on leisure, you are obligated to donate.

  As you noticed, this logic creates a "slippery slope" (or rather, a ladder with no top). If one hour of coding helps a user, and that help outweighs your hour of Netflix, you should code. If two hours help more, you should code two hours. This leads to the conclusion that you are obligated to contribute until you reach the point of **marginal utility**—where giving more would harm you as much as it helps others.

  So, to answer your question: **Yes, taking that specific underlying reasoning seriously *does* commit you to working until you drop.** If you accept strict Act Utilitarianism, there is no principled place to draw the line. Your guilt is the logical result of accepting a premise that many philosophers believe is flawed.

  However, there is no consensus that you *should* accept that premise. Here is how the literature attempts to resolve this, ranging from theoretical frameworks to pragmatic arguments.

  ### 1. Supererogation (Duty vs. Heroism)
  Most ethical systems distinguish between **obligatory** actions (what you must do) and **supererogatory** actions (what is good to do, but not required).

  Fixing bugs in your spare time, donating money, and volunteering are classic examples of supererogatory acts. They are morally praiseworthy, but failing to do them does not make you immoral. The "Demandingness Objection" argues that Utilitarianism collapses this distinction, turning every heroic act into a mandatory duty. Most ethicists reject this collapse. They argue that morality sets a floor for behavior, not a ceiling. You have met your moral obligations by being a decent person; anything extra is a gift, not a tax.

  ### 2. Agent-Centered Prerogatives
  Philosopher Samuel Scheffler proposed the idea of **agent-centered prerogatives**. This suggests that you are permitted to give your own interests and projects slightly more weight than the interests of strangers, simply because they are *yours*.

  While you shouldn't ignore the suffering of others, you are not required to be an impartial vessel for utility. You are allowed to value your relationship with your partner, your rest, and your mental health more than the aggregate benefit to anonymous users of your library. This isn't selfishness; it's a recognition that a moral theory that requires you to abandon your own life is too costly to be plausible.

  ### 3. Satisficing Consequentialism
  Standard Utilitarianism is **maximizing**: you must produce the *most* good possible. An alternative view is **satisficing consequentialism** (championed by philosophers like Michael Slote).

  This view holds that you are only obligated to produce *enough* good. Once you have crossed a threshold of "moral sufficiency," you are free to pursue your own interests. Maintaining a moderately popular open-source library likely puts you well above the threshold of what is expected of an average person. Under this framework, you have already "won" the moral game for the day, and further work is optional.

  ### 4. The Instrumental Argument (Burnout)
  Even if you remain a strict Utilitarian, there is a pragmatic argument for stopping: **Long-term utility maximization.**

  If you grind yourself down every night, you risk burnout. If you burn out, you might quit maintaining the library entirely.
  *   **Scenario A:** You work 2 hours tonight, feel guilty, work 2 hours tomorrow, burn out in 6 months, and the project dies. Total utility: Moderate.
  *   **Scenario B:** You work 1 hour tonight, rest, maintain your mental health, sustain the project for 10 years. Total utility: High.

  From a purely consequentialist view, rest is not "time not spent doing good"; it is **maintenance time for the instrument of good** (you). Your partner's intuition that you need a life is instrumentally rational: a rested, happy maintainer is more productive over a lifetime than a martyred one.

  ### 5. The "Life as a Whole" View
  Bernard Williams, a critic of Utilitarianism, argued that requiring people to constantly calculate the utility of their actions attacks their **integrity**. It turns you into a channel for the satisfaction of others rather than a person with your own projects.

  Williams argued that your projects (your relationship, your hobbies, your rest) are what give your life meaning. If morality requires you to abandon the very things that make your life worth living, then that morality is asking you to negate yourself. A moral theory that requires you to cease being a distinct individual is arguably incoherent.

  ### A Principled Resolution
  You asked if there is a principled resolution or if the guilt is the price of taking consequences seriously.

  The guilt is the price of taking **one specific, controversial interpretation** of consequences seriously.

  Here is a principled way to draw the line that satisfies both your desire to do good and your need for a life:

  1.  **Reframe the Work:** Acknowledge that your open-source work is **supererogatory**. You are not a servant to your users; you are a benefactor. No user is *owed* your spare time.
  2.  **Adopt a Policy of Sustainability:** Set a hard limit (e.g., "I contribute 5 hours a week"). Treat this not as a failure to do more, but as a strategic allocation of resources to ensure you can continue contributing for years.
  3.  **Accept the "Good Enough" Threshold:** Recognize that the world does not need you to maximize utility every hour. It needs you to be a reliable, long-term contributor who doesn't resent the users.

  ### Summary
  Your friend identified the **Demandingness Objection**. The philosophical consensus is largely on your partner's side: a moral theory that leaves no room for personal life is generally considered defective, not binding.

  You are not failing a moral test by logging off. You are recognizing that you are a human being with a life to live, not a utility function optimized for global output. The low-grade guilt is a signal that you care, but it is not a reliable guide to action. You have permission to stop.
