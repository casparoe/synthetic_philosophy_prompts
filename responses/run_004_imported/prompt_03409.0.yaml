answer: |-
  This is a fantastic set of questions. You've hit on the exact friction point where 18th-century naturalism meets 20th-century analytic formalism. Since you're presenting to a group that's also reading Skyrms and Bicchieri, you're in a perfect position to triangulate these views rather than treating them as contradictory.

  Here is a breakdown of how to handle both the normativity worry and the static/dynamic tension, structured to help you build a thesis for Thursday.

  ### 1. The Normativity Worry: Is Hume Smuggling in an "Ought"?

  Your worry is that Hume describes a self-interested equilibrium (a *is*) but labels it a "convention" (which sounds like an *ought*), thereby begging the question on normativity.

  **The Contextual Fix:**
  Remember Hume's dialectical target in *Treatise* 3.2. He is arguing against Social Contract theorists (like Locke) who claim political obligation rests on *promises* (explicit consent). Hume's counter-move is genealogical: Promises themselves are unintelligible without a prior convention. If I say "I promise," that utterance only has force if we already have a convention that such utterances bind us. Therefore, the foundation of justice cannot be promise.

  **The "Agreement" without Speech:**
  When Hume says the rowers act by "agreement or convention, tho' they have never given promises," he is redefining "agreement." He isn't using it in the contractual sense (speech act + obligation). He is using it in the sense of *convergence*.
  *   **Game-Theoretic Translation:** This is a Nash Equilibrium in a coordination game. If I row hard while you loaf, we go in circles. If we both row in sync, we move. My best response depends on yours.
  *   **The Normativity:** Hume isn't smuggling in a *moral* ought here initially; he is relying on a *prudential* ought (hypothetical imperative). "If you want to cross the river, you ought to match my stroke."
  *   **Where the Moral "Ought" comes from:** Hume distinguishes between the *motive* that establishes the convention (self-interest) and the *moral sentiment* that arises later. Once the convention is established, we feel approval for those who follow it and disapproval for those who break it (via sympathy). So, the normativity isn't smuggled; it's **two-stage**.
      1.  **Stage 1 (The Passage):** Prudential rationality stabilizes behavior (The Equilibrium).
      2.  **Stage 2 (Later in Treatise):** Moral sentiment attaches to the stability (The Norm).

  **Presentation Point:** You can argue that Hume isn't conflating *is* and *ought*; he is reducing the *ought* of justice to the *is* of stabilized expectations, which then generates a new *ought* via sentiment. Lewis picks up Stage 1. Bicchieri picks up Stage 2 (empirical expectations + normative expectations).

  ### 2. The Static (Lewis) vs. Dynamic (Hume) Tension

  This is the crux of your second question. Hume says "gradually... repeated experience." Lewis says "Common Knowledge of preferences and rationality." Did Lewis rationalize away Hume's naturalism?

  **Lewis's Project vs. Hume's Project:**
  *   **Hume** is doing **Genealogy**: How does this actually arise in human history/psychology? (Causal story).
  *   **Lewis** is doing **Conceptual Analysis**: What are the logical conditions required for a state of affairs to count as a convention? (Structural story).

  Lewis is fully aware of Hume's gradualism. In *Convention* (Chapter 1, Section 4), Lewis explicitly discusses the "evolution" of convention. He doesn't think he's contradicting Hume; he thinks he's formalizing the *endpoint* of Hume's process.

  **Common Knowledge as the Limit of "Repeated Experience":**
  Hume says repeated experience assures us that the "sense of interest has become common."
  *   **Hume's Mechanism:** I try stealing, you punish me. I try again, you punish me. I observe you observing me. Eventually, I expect you to expect me to respect property.
  *   **Lewis's Formalization:** Lewis asks: "What epistemic state corresponds to that stability?" His answer: **Common Knowledge (CK).**
  *   **The Bridge:** CK is the *logical structure* of the stability Hume describes. Hume's "gradual process" is the *causal mechanism* by which agents acquire Common Knowledge. Lewis brackets the causal history to define the state of knowledge required for the equilibrium to be *rational* and *stable*.

  **Did Lewis swap the phenomenon?**
  No, but he did **idealize** it.
  *   Hume's rowers might just be following a heuristic ("match the rhythm") without high-level reasoning.
  *   Lewis's agents are hyper-rational calculators who know that the other knows that they know...
  *   **The Skyrms Move:** This is where Brian Skyrms (*The Evolution of the Social Contract*) saves the day for your reading group. Skyrms shows that you don't need Lewisian hyper-rationality to get to Lewisian equilibria. You can use **replicator dynamics** (evolutionary game theory). Agents with simple strategies who succeed reproduce/are imitated. Over time, the population converges on a Coordination Equilibrium.
      *   **Synthesis:** Skyrms validates Hume's gradualism *using* Lewis's equilibrium concepts. He shows how a Humean "slow progression" results in a Lewisian "Coordination Equilibrium" without requiring the agents to possess Common Knowledge explicitly. The *population* behaves *as if* it has CK, even if individuals don't.

  ### 3. Suggested Thesis for Your Presentation

  Since you need a view for Thursday, here is a proposed argumentative arc that ties Hume, Lewis, and the evolutionary literature together:

  **Thesis:** Lewis does not betray Hume's naturalism; he provides the **structural definition** of the state that Hume's **causal process** produces. The tension between "gradual experience" and "Common Knowledge" is resolved by viewing Common Knowledge not as a psychological precondition, but as the **functional equivalent** of stabilized expectations in a rational reconstruction.

  **Three Points to Develop:**

  1.  **Hume's "Convention" is Pre-Linguistic:** Emphasize that for Hume, convention is a *convergence of expectations*, not a speech act. This clears the ground for Lewis. The rowers don't talk; they signal through action. This anticipates the game-theoretic view that signaling systems (language) are themselves conventions that emerge from non-linguistic coordination (Skyrms's signaling games).
  2.  **Common Knowledge as a Limit Concept:** Argue that Lewis's Common Knowledge is an idealization of Hume's "repeated experience." In the real world (Hume), we get *approximate* common knowledge through habit. In the model (Lewis), we assume *perfect* common knowledge to define the stability conditions. Lewis isn't saying agents actually compute infinite iterations of "I know that you know..."; he's saying that for the convention to be *rationally sustainable* against deviation, the structure must *mirror* CK.
  3.  **The Evolutionary Bridge (Skyrms/Bicchieri):** Use the recent lit to close the loop.
      *   **Skyrms:** Shows how Humean gradualism (dynamics) leads to Lewisian equilibria (statics) without hyper-rationality.
      *   **Bicchieri:** Refines the normativity. She distinguishes between *empirical expectations* (I think you will row) and *normative expectations* (I think you think I *should* row). This maps perfectly onto Hume's two stages (Interest $\rightarrow$ Moral Sentiment).

  ### Specific Textual Tips for the Hume Passage

  *   **"Mutually express'd":** Note that Hume says the sense of interest is "mutually express'd." He does *not* say "verbally communicated." In the boat case, the expression is *behavioral*. I pull, you see I pull, you pull. This is the proto-game-theoretic signal.
  *   **"Reference to those of the other":** This is the definition of strategic interdependence. Hume grasps the core of game theory (my payoff depends on your move) 200 years before von Neumann.
  *   **"Slow progression":** Use this to critique the "Common Knowledge" requirement as psychologically unrealistic, but defend it as analytically useful. Lewis knows it's a "slow progression," but he needs to know what the progression is progressing *toward*.

  ### Summary for your Notes

  *   **Hume:** Genealogy. Convention = Convergence of interest via repeated interaction. Normativity starts prudential, becomes moral.
  *   **Lewis:** Analysis. Convention = Coordination Equilibrium + Common Knowledge + Preference to conform if others do.
  *   **Relation:** Lewis defines the *target* of Hume's *arrow*.
  *   **Skyrms:** Shows how the arrow hits the target without needing a rational archer (evolutionary dynamics replace common knowledge reasoning).
  *   **Normativity:** Not smuggled. It emerges from the stability of the equilibrium (prudential) and is later reinforced by social sanctions/sentiment (moral).

  This approach lets you honor Hume's naturalism while defending Lewis's formalism, using the evolutionary literature as the bridge that validates both. Good luck on Thursday!
