answer: |-
  This is a fantastic question that cuts to the heart of a major debate in the philosophy of biology. As a software engineer, your intuition is not only reasonable, it is shared by many molecular biologists and was the driving force behind the early optimism of the Human Genome Project.

  The short answer is: **You are right about *translation*, but your friends are right about *development*.**

  The inference breaks down when you scale the analogy from "making a protein" to "making an organism." The dispute is not merely semantic; it is about **causal parity** and the definition of **biological information**.

  Here is a detailed breakdown of where the "Genome as Program" analogy holds, where it fractures, and why your friends pushed back.

  ### 1. Where You Are Right: The Molecular Layer
  At the level of the ribosome, your analogy is structurally sound. The Central Dogma (DNA → RNA → Protein) possesses semantic isomorphism with software engineering:
  *   **Discrete Alphabet:** A, C, G, T.
  *   **Syntax:** Promoters, start/stop codons, splice sites.
  *   **Interpreter:** The ribosome/tRNA complex acts as a virtual machine reading the tape.
  *   **Lookup Table:** The genetic code maps codons to amino acids.

  If you view the cell as a pre-existing computer, the mRNA is indeed a script being executed to produce protein objects. If your scope is limited to *gene expression*, the computational metaphor is a powerful and accurate heuristic.

  ### 2. Where the Analogy Breaks: The "Computer" Problem
  The fundamental flaw in the "Genome as Program" metaphor is that **a program requires a computer to run, but the genome must help build its own computer.**

  In software, the hardware (CPU, RAM, OS) exists *prior* to the program. The program relies on stable, pre-defined physical laws of the silicon.
  In biology, the "hardware" (the cytoplasm, the ribosomes, the cell membrane, the signaling pathways) is made of proteins... which are encoded by the genome.

  This creates a circular dependency known as the **bootstrapping problem**. An egg cell contains a genome, but it also contains a massive amount of cytoplasmic machinery (proteins, RNAs, organelles) inherited from the mother. If you inject a genome into a cell that lacks the specific maternal machinery to read it, nothing happens. The genome is inert without the specific cellular context.

  Therefore, the "program" is not just the DNA. The "program" is the **DNA + the inherited cellular machinery**. By calling only the DNA the "code," you are arbitrarily drawing a boundary around one part of the system and labeling it "information" while labeling the equally necessary machinery "background."

  ### 3. Causal Parity and the "Privileged Cause"
  This leads to the philosophical objection your friends raised. It is called the **Causal Parity Thesis**.

  In a computer, we distinguish between *data* (the file) and *mechanism* (the hard drive). We say the file contains the information.
  In a cell, DNA is a causal factor, but so is the chromatin structure, the methylation state, the concentration of transcription factors, and the temperature of the environment.

  *   **Example:** Consider alternative splicing. A single gene can produce different proteins depending on which exons are included. Which exons are included depends on the concentration of specific splicing factors in the nucleus at that moment.
  *   **The Question:** Is the "instruction" for which protein to make in the DNA sequence, or in the concentration of the splicing factors?

  If you say the DNA is the "program," you are asserting that DNA has a privileged causal status over the proteins that regulate the DNA. But those proteins were made by DNA. It is a recursive loop. Philosophers of biology argue that singling out DNA as the "information" carrier is a historical bias (pre-1953, we didn't know DNA was the hereditary material; post-1953, we overcorrected to "DNA is everything").

  ### 4. Blueprint vs. Recipe (Developmental Systems Theory)
  Your intuition treats the phenotype as the *output* of the genotype, similar to how a compiled binary is the output of source code. This implies a **Blueprint Model**.

  *   **Blueprint:** Contains a 1:1 spatial mapping of the final structure. If you have the blueprint, you can build the house (given standard materials).
  *   **Recipe:** Contains a set of instructions that *interact* with ingredients and environment to produce a cake. You cannot build the cake from the recipe alone; you need the flour, the heat, and the mixing.

  Biologists increasingly favor the **Recipe Model** (or more accurately, **Developmental Systems Theory**). The genome does not specify the organism; it specifies *constraints* on a self-organizing physical process.

  *   **Software:** Deterministic. `if x then y` always yields `y` (barring hardware failure).
  *   **Biology:** Probabilistic and self-organizing. The same genome can produce different phenotypes (polyphenism) based on environmental triggers (e.g., locusts turning from solitary to swarming based on crowding, or temperature-dependent sex determination in reptiles).

  If the phenotype changes drastically without a change in the "source code," then the source code was not a complete description of the program.

  ### 5. Why "Runtime Parameters" is an Underestimation
  You mentioned viewing epigenetics and environment as "runtime parameters." In software, parameters modify the execution, but the logic remains in the code.

  In biology, the "parameters" often *rewrite the code* or *change the compiler*.
  *   **Epigenetics:** Methylation patterns silence genes. These patterns are heritable but are not encoded in the DNA sequence. They are "settings" on the hardware that persist across reboots (cell divisions).
  *   **RNA Editing:** In some organisms, the RNA transcript is modified *after* transcription, changing the "instruction" before it reaches the ribosome. The DNA sequence is no longer the ground truth of the protein sequence.

  If the "runtime environment" can edit the source code on the fly and determine which functions are even visible to the compiler, the distinction between "code" and "environment" collapses.

  ### 6. Does This Matter? (Substantive vs. Semantic)
  You asked if this is just a dispute over words. It is substantive because it dictates research strategy.

  *   **The "Genome as Program" view** leads to **Reductionism**. It suggests that if we just sequence enough genomes and annotate every gene, we will "solve" biology. It focuses funding on sequencing and gene-editing (CRISPR).
  *   **The "Developmental Systems" view** leads to **Systems Biology**. It suggests that knowing the sequence is insufficient without understanding the network dynamics, the physical topology of the cell, and the environmental context. It focuses funding on proteomics, metabolomics, and tissue engineering.

  The "Genome as Program" view led to the expectation that the Human Genome Project would immediately cure diseases. It didn't, because most diseases are not "bugs in the code" but "emergent failures in the network."

  ### Summary
  Your engineering intuition is correct that **molecular translation** is a computational process involving symbolic information.

  However, the inference breaks when you claim the **organism** is the computed output of that program.
  1.  **No Hardware:** The genome does not come with a computer; it must help build the machine that reads it.
  2.  **Causal Parity:** The cellular environment is as informative as the DNA sequence; distinguishing them is arbitrary.
  3.  **Self-Organization:** Development is not compilation; it is a physical self-assembly process guided by constraints, not a top-down execution of instructions.

  Your friends aren't saying DNA isn't important. They are saying that treating DNA as the *sole* locus of information is a category error that obscures the complex, recursive, and physical nature of life. The genome is less like a program and more like a **database of parts lists** used by a factory that builds itself.

  ### Recommended Reading
  If you want to dive deeper into this specific philosophical tension, these three resources bridge the CS/Bio gap well:
  1.  **"Life Itself" by Robert Rosen:** (Heavy on theory) Argues against the "machine metaphor" in biology.
  2.  **"The Symbols of Life" by Peter Godfrey-Smith:** A philosophical look at when it is appropriate to use information talk in biology.
  3.  **"Endless Forms Most Beautiful" by Sean B. Carroll:** Explains how the same "code" produces different organisms through regulatory logic (the "switches" rather than the "parts"), supporting the context-dependence argument.
