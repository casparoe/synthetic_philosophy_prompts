answer: |-
  This is a classic debate in the intersection of AI and philosophy, one that has persisted for over fifty years. It is essentially a dispute over whether the "Frame Problem" is a bug in a specific logical formalism or a feature of intelligence itself.

  To settle this: **Your friend is philosophically deeper, but you are technically more precise.** However, regarding the specific question of whether Dennett's generalization is a legitimate philosophical move or a conflation, **I verdict in favor of your friend.** Dennett's expansion is a legitimate philosophical diagnosis, not a mere bait-and-switch. While the two problems are distinct in their engineering details, the technical frame problem is indeed a localized symptom of the broader epistemological disease your friend describes.

  Here is the breakdown of why the technical version is tractable, why the epistemological version is not, and why the latter subsumes the former.

  ### 1. The Technical Frame Problem (McCarthy & Hayes)
  You are correct about the history and the status of the original problem. In their 1969 paper, McCarthy and Hayes were concerned with the **representational efficiency** of the Situation Calculus.

  *   **The Issue:** If I represent the world as a set of logical facts (fluents) and actions as functions that change those facts, I face a combinatorial explosion. If I have 10,000 facts and I perform one action (e.g., `pick_up(block)`), I need to explicitly state that this action does *not* change the other 9,999 facts. These are "frame axioms." Without them, the logic cannot assume facts persist.
  *   **The Solution:** As you noted, this is largely considered "solved" in formal AI. Ray Reiter's **Successor State Axioms** (1991) provided a rigorous way to encode persistence without writing individual frame axioms for every fluent. By defining the truth value of a fluent in the next state based *only* on the actions that affect it, the logic automatically assumes persistence for everything else.
  *   **Why It's Tractable:** This solution works because it operates in a **closed world**. The system is given a predefined, finite list of fluents and actions. The "relevance" of a fact is determined by the human engineer writing the axioms. The AI doesn't have to figure out *what* matters; it is told *what* matters via the structure of the axioms.

  ### 2. The Epistemological Frame Problem (Dennett)
  Your friend is correct that Dennett's 1984 critique shifts the goalposts, but argues that the goalposts were always there, just hidden by the formalism.

  *   **The Issue:** Dennett's robots (R1, R1D1, R2D1) fail not because they lack logical axioms for persistence, but because they lack a **theory of relevance**. R1D1 deduces that pulling the wagon won't change the color of the walls (solving the technical frame problem), but it also deduces that pulling the wagon will move the walls' distance relative to the sun, the vibration of the floor, etc. It gets bogged down in irrelevant side effects. R2D1 tries to filter relevance but fails to distinguish between relevant and irrelevant side effects in time to stop the bomb.
  *   **The Difficulty:** This is not a problem of notation; it is a problem of **knowledge selection** in an open world. In the real world, the number of potential facts is infinite. There is no predefined list of fluents. A reasoner must determine, on the fly, which of the infinite potential consequences of an action are pertinent to its current goal.
  *   **Why It's Intractable:** There is no known formal logic that can solve this. It requires "common sense," which implies a semantic understanding of the world, not just syntactic manipulation of symbols.

  ### 3. The Connection: Symptom vs. Disease
  Here is where the verdict lies. You argue that conflating these is a bait-and-switch. Your friend argues they are the same problem at different levels of abstraction.

  **Your friend is right because the technical problem only exists because of the epistemological one.**

  Consider Reiter's Successor State Axioms. They solve the logical inference problem, but they presuppose that a human designer has already solved the relevance problem. To write the axiom for `pick_up(block)`, the human must decide which fluents to include in the system. We implicitly decide that `color_of_walls` is irrelevant and `location_of_block` is relevant. We curate the "frame" for the AI.

  Dennett's point is that **this curation is the hard part.** By calling the logical bookkeeping issue "The Frame Problem," the AI community claimed a victory for solving the bookkeeping while quietly outsourcing the relevance detection to human engineers.

  Therefore, the McCarthy-Hayes frame problem is a **formal shadow** of the Dennett frame problem.
  *   **M&H:** "How do we efficiently represent that most things don't change?"
  *   **Dennett:** "How do we know which things *might* change in a way that matters?"

  If you had a solution to Dennett's problem (a general theory of relevance), you could automatically generate McCarthy and Hayes's axioms. But if you have McCarthy and Hayes's axioms, you still cannot solve Dennett's problem. This asymmetry proves that the epistemological problem is the fundamental one, and the representational problem is a derivative constraint.

  ### The Verdict
  Dennett's generalization is a **legitimate philosophical move**, not a conflation.

  It is a conflation only if you view AI purely as an engineering discipline concerned with closed-domain planning. In that narrow context, you are right: the "Logical Frame Problem" is solved, and dragging in epistemology muddies the water for practitioners building planners.

  However, if you view AI as an attempt to model general intelligence (which was McCarthy's original ambition and is certainly Dennett's), your friend is right. The logical notation version *looks* tractable only because it quietly assumes away the very relevance question Dennett is pointing at. To treat them as unrelated is to mistake the map for the territory. The "frame" in Frame Problem refers to the boundary between what is inside the system's consideration and what is outside. McCarthy asked how to draw that line in logic; Dennett asked how the system draws that line in reality.

  **Conclusion:** You win on the history of the term and the status of current planning algorithms. Your friend wins on the philosophy of mind and the ultimate challenge of AGI. Dennett was justified in co-opting the term because the technical problem is insoluble in the general case without solving the epistemological one. The "Frame Problem" is, fundamentally, the problem of bounded rationality in an unbounded world. The logical version was just the first place we noticed the crack.
