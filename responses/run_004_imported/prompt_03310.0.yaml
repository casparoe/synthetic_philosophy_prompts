          *   Highlight Lewis's distinction between "resources" (fines) and "personal experience" (prison/death).
          *   Note Lewis's explicit disclaimer: This doesn't make PSA *true*, just makes critics hypocritical.

      *   **Section 2: The Nature of Christ's Suffering vs. Lewis's Categories.**
          *   PSA involves death, wrath, and abandonment.
          *   Fines are transferable assets. Prison/Death are non-transferable personal experiences.
