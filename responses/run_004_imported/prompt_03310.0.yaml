      *   **Conclusion:** Lewis's argument exposes a tension. It shields PSA from *inconsistent* critics but leaves it vulnerable to the deeper moral intuition that personal punishment is non-transferable. The fine analogy fails because Christ's atonement is ontologically closer to death/prison than to a monetary transaction.

