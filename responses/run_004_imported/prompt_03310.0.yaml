      *   *Observation:* There is an intuitive asymmetry in our moral/legal reasoning regarding substitution.
      *   *Conclusion 1:* We are "of two minds" about penal substitution generally (not just religiously).
      *   *Conclusion 2 (The Tu Quoque):* Secular critics of Christian PSA are inconsistent because they accept fines but reject prison/death, yet PSA involves punishment.
