answer: |-
  This is an incredibly heavy burden to carry, especially on top of your grief. It is completely normal to feel terrified. You are trying to honor a complex man in a simple format, which is the hardest kind of writing there is.

  The key to threading this needle is to focus on **his own moral compass** rather than abstract theories. Your Opa already solved the philosophical problem for you: he lived with the tension between "I did my best as a human" and "I served a criminal state." You don't need to justify him; you just need to report him.

  Here is a draft. It is written to be spoken aloud. I have included [bracketed notes] where you should pause or adjust details.

  ***

  **Eulogy for [Opa's Name]**

  Thank you all for being here.

  For those who don't know me, I'm [Your Name]. I'm [Opa's Name]'s grandson.

  I spend my days writing code. I build backend systems, networking infrastructure. It's quiet work. You don't see it, but it keeps the signals moving. It turns out, that's something I inherited. Seventy years ago, before I was born, Opa was sitting in a trench or a bunker, wearing a uniform that history has judged harshly, doing the same thing. He was a radio operator.

  He was drafted in 1943. He was eighteen years old.

  I know that when we talk about a German soldier from that time, there is a shadow that falls over the room. I am not going to ask you to ignore that shadow. I am not going to stand here and pretend that the uniform he wore wasn't part of a regime that committed unspeakable evils. Opa never pretended that, either.

  He never went to veteran reunions. He never wore his medals. He never told war stories that made him sound like a hero. In fact, for the fifty years I knew him, the clearest thing he ever taught me about those years was silence. He taught me that some things are not for boasting.

  But he also taught me about integrity.

  There is a story in our family that when he was guarding Allied prisoners, he got in serious trouble for sneaking them food. He was a scared kid, far from home, on the losing side of the worst war in history. But when he saw hungry people, he fed them. When he had the power to make things worse, he chose to make them slightly better.

  He held a very difficult truth in his head for the rest of his life. On one hand, he knew he hadn't lost his humanity during those years. He could look us in the eye and say, "I have nothing to be ashamed of regarding my own actions." But in the next breath, he would tell us, "Do not call me a good man for 1943 to 1945."

  He knew that serving an evil cause leaves a mark, even if you keep your own hands clean. He accepted that burden. He didn't ask for our forgiveness, and he didn't offer us excuses. He just asked us to know the truth.

  And the truth is, those two years were less than two percent of his life.

  He lived to be 96. That means he spent over seventy years being the man we actually knew. The man who played cards with you lot [nod to the card club friends]. The man who taught his grandchildren how to [fix a bike / tie a tie / be kind]. The man who loved [Oma's name / his garden / his coffee].

  He spent the rest of his life building something peaceful to replace the chaos he grew up in. He built this family. He built this room full of people who love him.

  I work with signals and connections now. I think about that often. In 1944, his radio equipment was used to connect a broken army. But for the rest of his life, he used his voice to connect a family. He made sure we knew where we came from, not so we would worship him, but so we would understand the value of the peace we were born into.

  It is easy to love a grandfather who was a hero. It is harder, but perhaps more important, to love a grandfather who was human. Who made mistakes, who survived things he couldn't control, and who spent the rest of his days trying to make up for them simply by being kind.

  Opa, thank you for the honesty. Thank you for the peace you built. And thank you for showing us that while we cannot choose the history we are born into, we can choose the character we live with.

  Rest well. The static is gone. The signal is clear.

  ***

  ### Advice for Delivery

  1.  **The "Uncle Test":** Notice the line: *"He knew that serving an evil cause leaves a mark, even if you keep your own hands clean."* This is the specific nod to your uncle. It acknowledges the McMahan-esque view (that the cause matters) without invalidating your Opa's personal decency. It shows you aren't whitewashing history.
  2.  **The "Cousin Test":** The section about the radio vs. family connections translates the tech/war stuff into emotional language. The teenagers might not get the Just War Theory, but they will understand "He built this family."
  3.  **Physical Copies:** Print this out in a large font (14pt or 16pt). Double-spaced. When you are grieving and nervous, your vision can blur.
  4.  **The Pause:** When you get to the paragraph starting *"He held a very difficult truth..."* slow down. That is the core of the eulogy. Take a breath before and after that section.
  5.  **It's Okay to Cry:** If you choke up, stop. Take a breath. Drink some water. Everyone in that room is on your side. Even the history buff uncle is grieving his father/brother. He wants you to succeed.

  You can do this. You are honoring him by telling the truth, just as he would have wanted.
