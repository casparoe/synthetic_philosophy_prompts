answer: |-
  **Interlude: The Antarctic Protocol**

  **Vere:** Look at page one hundred and twelve. The ink is faded, brittle from the cold. Renata writes down a lemma here that Julian would have recognized from their work in Zurich. But Julian is dead, and she is alone for nine years. How do you determine the truth conditions of this symbol?

  **Caldwell:** The truth conditions are fixed by the inference rules she intended to use. The derivation is valid relative to those rules.

  **Vere:** But that is precisely what is at issue. What fixes the intention? You assume there is a fact of the matter about whether she is following the original rule or a deviant one. But consider the skeptical paradox. Her past usage of the rule is finite. She wrote it down a thousand times before the collapse. But now, on page one hundred and twelve, she applies it to a case neither she nor Julian ever encountered. Nothing in her past behavior forces this specific application. She might have silently lapsed into a "quus"-like deviation—a rule that matches their original practice up to the moment of the collapse but diverges here.

  **Caldwell:** You're arguing that because she had no one to correct her, the distinction between being right and merely seeming right evaporates.

  **Vere:** I am arguing that without a community to check her applications, there is no standard outside of her own impression. She says, "It seems right to me." But if "seeming right" is the only criterion, then she cannot be wrong. And if she cannot be wrong, she isn't following a rule at all. She is just writing marks. The notebooks are artifacts, not assertions.

  **Caldwell:** This relies on a specific picture of normativity—that it requires a second person to enforce it. But why does the community escape the very finiteness that undermines the individual? You say Renata's history is finite, so it cannot fix the meaning of the rule for all future cases. But the community's history is also finite.

  **Vere:** The community is open-ended. It extends into the future.

  **Caldwell:** But at any given moment, the community's agreement is just a collection of individual dispositions. If you take a snapshot of the mathematical community today, their consensus is just a set of finite behaviors. If a skeptic can reinterpret Renata's solitary past to suggest she meant "quus" instead of "plus," why can't a skeptic reinterpret the community's past agreement? Perhaps the community also means "quus" but hasn't reached the divergent point yet. If finiteness undermines the lone individual, it undermines the group equally. The community is just a super-individual.

  **Vere:** You are missing the normative pressure. When Renata wrote alone, if she made a mistake, nothing pushed back. When I write a proof, my peers will reject it if I deviate. That possibility of rejection constitutes the meaning. It isn't about the number of people; it's about the institution of correction. Renata was outside the institution.

  **Caldwell:** But correction is just more behavior. If I write a symbol and you shake your head, that is just another physical event. Why does your head-shaking fix the meaning any more than Renata's internal feeling of certainty? You say the community escapes the skeptical paradox because of agreement. But agreement is a fact about what people *do*, not what they *mean*. If Renata's internal disposition is insufficient to ground meaning, why is the aggregate of external dispositions sufficient?

  **Vere:** Because meaning is not a ghostly mental state; it is a social practice. Renata wasn't participating in a practice. She was mimicking one. Look at the margins here. She talks to Julian. "Would you accept this?" she writes. But he never answers. She is simulating the community, not inhabiting it.

  **Caldwell:** She is inhabiting the logic. The logic doesn't care about the audience. If the proof holds, it holds. You want to say that because she was isolated, there is no fact about whether she followed the rule. But if you accept that, you must admit there is no fact about whether *we* are following the rule now, only that we agree we are. You reduce mathematics to sociology.

  **Vere:** I reduce it to assertibility conditions. We are entitled to say she followed the rule because her results cohere with ours now that we have the books. But that is a judgment we make from here. It was not a fact available to her there. In the Antarctic, in those nine years, she was drifting.

  **Caldwell:** Then the recovery of the notebooks is irrelevant. If there was no fact of the matter then, there is no fact of the matter now. You are saying the truth of the proof was created when we opened the binders, not when she wrote the ink.

  **Vere:** I am saying the truth is constituted by the possibility of verification. She removed that possibility.

  **Caldwell:** And yet, here we are, verifying it. The ink sits on the page. The steps follow. If the logic works, her isolation was incidental. You are confusing the *discovery* of the rule with the *existence* of the rule. Renata didn't need Julian to tell her she was right. She needed the numbers to behave. And they did.

  **Vere:** Or they seemed to. Until we check the next step.

  **Caldwell:** Exactly. Until *we* check. But that makes us fallible too. If our checking is just more finite behavior, then your skeptical solution solves nothing. It just pushes the uncertainty from the individual to the crowd. Renata wasn't lost, Vere. She was just the first to reach the edge of the map.

  **Vere:** Then pray the edge doesn't move when we look away.

  **Caldwell:** If it moves, it moves for us all. Not just her.
