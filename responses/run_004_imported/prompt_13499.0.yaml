          *   Increase judge capability/time (but this conflicts with "scalable" oversight, so use hybrid).
          *   Allow the honest debater to focus the judge's attention (cross-examination is key).
          *   **Crucially:** Don't use it as the *sole* gate for high-risk categories. Use it as a signal alongside other metrics.
          *   **Crucially:** Define "low confidence" protocols. If the judge is unsure, default to "reject" or "escalate."

  4.  **Drafting the Memo - Structure:**
