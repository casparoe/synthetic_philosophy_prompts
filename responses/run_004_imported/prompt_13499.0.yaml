      *   *Addressing the Obfuscated-Arguments Problem:* I need to show I understand it. It's not just "models aren't smart enough yet." It's "information asymmetry favors the liar in deep trees." I must explain *why* the conditions mitigate this.
      *   *Conditions:*
          *   *Decomposition:* Force claims into small, checkable units.
          *   *Cross-Examination:* Essential for pinpointing the flaw.
          *   *Judge:* Hybrid (Weak Model + Human Spot-Check).
          *   *Verdict:* Conservative bias (Reject on uncertainty).
