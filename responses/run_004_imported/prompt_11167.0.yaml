answer: |-
  This is a fantastic angle. Hobbes is indeed the ur-philosopher of *verum factum* ("the true is the made")—the idea that we only have perfect knowledge of things we have constructed ourselves. He explicitly contrasts this with natural philosophy (physics), where we observe effects and guess at causes, versus geometry and civil science, where we stipulate causes (definitions/contracts) and deduce effects.

  Here is the breakdown of how his "Maker's Knowledge" argument holds up against these two mathematical earthquakes.

  ### 1. Non-Euclidean Geometry
  **Threat Score: 2/10**

  **The Reasoning:**
  Surprisingly, the discovery of non-Euclidean geometry arguably **vindicates** Hobbes's specific epistemological move rather than threatening it.

  Hobbes's certainty did not rest on the idea that Euclidean space was the *only* possible description of physical reality (though he often assumed it was). His certainty rested on the claim that geometric truth is **conditional necessity**. In *De Corpore*, he argues that we know a triangle has 180 degrees not because we measured all triangles, but because we *defined* the triangle and *constructed* the proof. The truth lies in the consequence of the stipulation.

  Non-Euclidean geometry demonstrates exactly this: if you stipulate Definition A (Euclid's Parallel Postulate), you get Consequence B. If you stipulate Definition A' (curved space), you get Consequence B'. The certainty remains intact within the system because the system is still a human construction.

  **Why it's not a 0/10:**
  The threat exists only in the *application* to politics. Hobbes believed there was **one** rational geometry and **one** rational commonwealth (absolute sovereignty). If geometry allows for multiple, equally consistent systems based on different axioms, a critic could argue politics might too (e.g., "Liberal Democracy and Absolute Monarchy are just different consistent axiomatic systems"). This undermines Hobbes's claim that his politics is the *unique* solution to the state of nature. However, regarding his core claim—"I know it because I made the definitions"—non-Euclidean geometry leaves him unscathed. He could simply say, "Those other geometries are consistent, but I am choosing to construct *this* one."

  ### 2. Gödel's Incompleteness Theorems
  **Threat Score: 8/10**

  **The Reasoning:**
  This is the existential threat. Hobbes's entire project rests on the idea that reason is a form of **computation** (addition and subtraction of concepts) and that because we construct the system, we can have **exhaustive** knowledge of it.

  In *Leviathan*, Hobbes treats reasoning like a ledger: if the definitions are clear, the conclusion is inevitable and knowable. This is why he spent 20 years fighting Wallis over squaring the circle; he believed the answer *must* be computable by human reason because the figure was a construct of human reason.

  Gödel strikes at the heart of this "Maker's Omniscience." The incompleteness theorems show that in any sufficiently complex formal system (one complex enough to include arithmetic), there are true statements that **cannot be proven within the system**.
  *   **The Blow to Certainty:** Hobbes claims, "I made this system, so I know all its truths." Gödel replies, "You made the system, but the system contains truths you cannot reach using the rules you made."
  *   **The Blow to Politics:** Hobbes wanted Civil Science to be demonstrable like geometry. If the "Commonwealth" is treated as a formal system of laws and rights, Gödel suggests there will be "political truths" (just outcomes, valid claims) that cannot be deduced from the Sovereign's original laws. This reintroduces the very uncertainty and dispute Hobbes wanted to eliminate.

  **Why it's not a 10/10:**
  Hobbes could retreat to a meta-position. He might argue that while the *system* cannot prove the statement, the *Maker* (the human reasoner standing outside the system) can still "see" the truth via intuition or natural reason. Hobbes prioritized "natural wit" over formalism. However, this weakens his claim that politics can be a *science* comparable to geometry. If geometry itself has blind spots that calculation cannot fix, then the "Scientific Sovereign" loses its primary justification for authority.

  ### Summary for Your Piece

  The "I made it, so I know it" argument is **weirdly resilient to changes in the rules (Non-Euclidean)** but **highly vulnerable to limits on calculation (Gödel).**

  *   **Non-Euclidean Geometry** shows that "making" the rules allows for *multiple* games. Hobbes can survive this by insisting he's playing the *right* game, but it costs him the claim to uniqueness.
  *   **Gödel** shows that "making" the rules does not guarantee you can *solve* the game. This costs him the claim to completeness.

  **The Hobbesian Irony:**
  Hobbes's obsession with squaring the circle is the perfect tragic footnote here. He died convinced he had solved an undecidable problem (in the sense that it was proven impossible in 1882, long after him, but the spirit of undecidability applies). He believed that because he could conceive the circle, he could exhaust its properties. Gödel (and later Turing) would tell Hobbes that the very act of creating a system complex enough to be interesting ensures that the Creator cannot fully comprehend the Creation.

  For your argument: Hobbes's "Maker's Knowledge" protects him from empirical refutation (we define the terms!), but it does not protect him from **internal opacity**. You can make a machine you don't fully understand. Hobbes refused to believe this was possible. That is where his certainty breaks.
