answer: |-
  This is an excellent topic for a graduate seminar, but it requires a careful distinction between Smith's *economic* critique and his *moral* critique. While your reading of the "nothing but loss" passage is textually accurate, characterizing Smith as an "anti-imperialist" based solely on that fiscal calculation risks conflating mercantilist inefficiency with moral injustice.

  To answer your specific question: The strand of Smith's argument that most directly anticipates the **moral case** against colonialism (as developed by later thinkers like Edmund Burke, J.A. Hobson, or even 20th-century anti-colonial theorists) is not the cost-benefit analysis of defense spending, but rather his **critique of the corruption of sovereign justice by private merchant interests and the violation of the natural liberty of the colonized.**

  Here is a breakdown of how you might frame this distinction for your seminar:

  ### 1. Distinguishing the Economic from the Moral
  The "nothing but loss" argument (WN IV.vii.3) is primarily a critique of **mercantilism**, not empire *per se*. Smith argues that the monopoly trade benefits a small faction (merchants) at the expense of the general public (who pay higher prices) and the state (which pays for defense). This is a utilitarian or fiscal argument. It appeals to British self-interest, suggesting that Britain would be wealthier without the colonies.

  Later anti-colonial moral arguments, however, typically rest on deontological grounds: the inherent rights of the colonized, the illegitimacy of foreign rule, or the dehumanizing effects of imperialism. The fiscal argument does not inherently grant moral standing to the colonized; one could theoretically argue a colony is a "bad bargain" while still believing the colonizer has a right to rule if it *were* profitable.

  ### 2. The Moral Strand: Violation of Natural Liberty and Justice
  The strand that anticipates the moral case is found where Smith discusses the **systemic injustice** required to maintain the colonial monopoly.

  *   **Violation of Natural Liberty:** For Smith, the "obvious and simple system of natural liberty" is the moral baseline. The colonial monopoly is not just inefficient; it is a coercive restriction on the natural right of the colonists to trade with whom they please. In WN IV.vii, Smith notes that the colonies are governed by a system that treats them not as equal subjects, but as subordinates whose industry is sacrificed for the benefit of the metropole. This anticipates the later liberal anti-colonial argument that empire is incompatible with the universal rights of man.
  *   **The Corruption of Sovereignty:** Smith argues that when merchants become rulers (as with the East India Company, which he discusses in the same context), the result is inevitably oppressive. He writes that a company of merchants is "incapable of considering themselves as sovereigns, even after they have become such." They view territory only as a source of profit, leading to "neglect, profusion, and extortion." This anticipates the Marxist and later structuralist critique that imperial capitalism inevitably leads to predatory governance and the degradation of political institutions.
  *   **The "Savage Injustice" of Discovery:** In Part III of the same chapter, Smith explicitly addresses the moral cost. He acknowledges that the "discovery" of the Americas was marked by "savage injustice" on the part of European nations. While he does not dwell on this as extensively as a modern critic might, his admission that the initial acquisition was tainted by violence, and that the ongoing system relies on coercion, provides a foothold for the moral argument that the title to the land and the authority over the people are illegitimate.

  ### 3. Connection to Later Anti-Colonial Thought
  For your seminar, you can draw a line from this strand of Smith's thought to later critiques:

  *   **Edmund Burke:** Smith's worry about the corruption of British justice by merchant interests prefigures Burke's impeachment of Warren Hastings. Both argue that imperial power abroad corrupts the rule of law at home.
  *   **J.A. Hobson:** Smith's argument that the empire benefits a specific class (merchants) at the expense of the nation (taxpayers/consumers) is a direct precursor to Hobson's *Imperialism: A Study* (1902), which argued that imperialism was driven by the financial interests of a few, not the national interest.
  *   **Universalism:** Smith's insistence that the colonists possess the same "natural liberty" as Englishmen anticipates the universalist human rights claims of 20th-century anti-colonialism. He denies the moral legitimacy of a system that creates two tiers of citizenship.

  ### 4. A Scholarly Caveat (Important for Graduate Context)
  To ensure rigorous discussion, you may wish to introduce the nuance provided by contemporary scholars like **Jennifer Pitts** (*A Turn to Empire*) or **Sankar Muthu** (*Enlightenment against Empire*).

  *   **Pitts** argues that while Smith was critical of the *abuses* of empire, he was not strictly "anti-imperialist." He supported some forms of colonization (e.g., as a safety valve for Europe's poor) and believed European government could eventually benefit colonized peoples if reformed.
  *   **Muthu** highlights that Smith (along with Kant and Herder) was unique in critiquing the *cultural arrogance* of imperialism, arguing that different societies have their own validity.

  **Recommendation for the Lecture:**
  Frame Smith not as a proto-Fanon, but as a thinker who exposes the **internal contradiction between liberal principles and imperial practice.** The "nothing but loss" argument is the hook, but the *moral* payload is his demonstration that the mercantile system requires the suspension of justice and liberty, thereby rendering the empire illegitimate on liberal grounds, regardless of its profitability.

  This approach allows you to use Smith to show how the critique of empire emerged from *within* the liberal tradition, rather than solely as an external opposition to it.
