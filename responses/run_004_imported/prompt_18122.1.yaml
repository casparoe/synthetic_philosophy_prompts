answer: |-
  **Setting:** *A bench in a university botanical garden. Autumn. Two colleagues, both retired, watching leaves fall.*

  **Characters:**
  *   **Marcus:** A Presentist. Formerly worked on foundational quantum mechanics.
  *   **Elena:** An Eternalist. Formerly worked on general relativity and cosmology.

  ***

  **Marcus:** You know, I was reading that new anthology on the metaphysics of time again. The same chapter on the Andromeda Paradox. The same confident assertion that Special Relativity *forces* the Block Universe. It still feels like a sleight of hand.

  **Elena:** (Smiling) And I suppose you still think the "tilt" of the simultaneity hyperplane is just a coordinate artifact, not an ontological truth. Marcus, we walked this path in the department for thirty years. If two observers moving relative to each other disagree on whether the Andromedan fleet has launched, and both frames are physically equivalent, then the "launch" cannot be absolutely present or absolutely future. It just *is*.

  **Marcus:** But that conflates "measured simultaneity" with "ontological presence." The Rietdijk-Putnam argument assumes that if I can't detect the difference between my "now" and yours, there is no difference. That's verificationism dressed up as geometry. I'm willing to posit a preferred frame—a universal "now"—even if the Lorentz transformations hide it from our instruments.

  **Elena:** And there is the rub. To save the intuition of a flowing "now," you're willing to bolt on a structure to the universe that does no empirical work. In physics, when we add a variable that cancels out of every observable equation, we usually call it a gauge redundancy and delete it. You're calling it reality. That isn't just "adding structure"; it's violating the spirit of invariance that has guided us since 1905.

  **Marcus:** Is it doing *no* work? That's where I think the stalemate is fake. You're treating Special Relativity as the final word on spacetime structure. But it isn't. It's a classical theory. When you bring in Quantum Mechanics, specifically the non-local correlations, the "no preferred frame" stance gets expensive too.

  **Elena:** Ah, the Bell card. I wondered when you'd play it. Look, Bell's theorem rules out local hidden variables. It doesn't rule out Lorentz invariance. We can have non-locality without a preferred frame if we accept that the non-locality can't be used for signaling. The no-signaling theorem preserves the peace.

  **Marcus:** It preserves the peace for the *statistical predictions*, Elena. But if you want an *ontology*—if you want to say what is actually happening to the particles—you run into trouble. Take Bohmian mechanics. You have particles with definite trajectories guided by the wavefunction. For the guidance equation to work in a multi-particle entangled state, you need to know the configuration of the distant particle *now*. But "now" is relative. To make Bohmian mechanics relativistic, you essentially *need* a foliation of spacetime. A preferred slicing.

  **Elena:** There are relativistic extensions of Bohmian mechanics that avoid a *fixed* preferred frame by making the foliation itself dependent on the wavefunction.

  **Marcus:** But there's still a foliation at the fundamental level. And look at Objective Collapse theories, like GRW or Penrose's gravity-induced collapse. If a wavefunction collapses non-locally across spacelike separation, there must be an order to the collapse. If Alice measures here and Bob measures there, and the collapse is instantaneous, whose "instantaneous" are we using? If there is no fact of the matter about which collapse happened first, you get contradictions in the state reduction. A preferred frame resolves the ordering of collapses cleanly.

  **Elena:** So your argument is: Because some interpretations of QM require a preferred foliation to make sense of the dynamics, we should accept a preferred foliation for the metaphysics of time?

  **Marcus:** I'm arguing that the "cost" you accuse me of paying—the "unfalsifiable structure"—isn't unique to Presentism. It's already being paid by the most realist interpretations of Quantum Mechanics. If Bohm or GRW is right, Lorentz invariance is not a fundamental symmetry of the *ontology*, only of the *observables*. It's a "conspiracy" of nature, yes, but one we might already be living with. So, positing a privileged "now" isn't an *ad hoc* rescue mission for Presentism; it's converging with the requirements of Quantum Realism.

  **Elena:** That is a stronger argument than the usual "my intuition says time flows." But let's look at the trade-off. You're willing to break Lorentz invariance at the ontological level to save "becoming." But consider the alternative: Many-Worlds. In Everettian QM, there is no collapse. There is no single outcome that needs to be ordered across spacelike separation. The universal wavefunction evolves unitarily. It fits perfectly into a 4D block.

  **Marcus:** (Sighs) Many-Worlds. The ultimate block universe machine. But Elena, be honest. The price of Everett is just as high as Neo-Lorentzianism. One buys a preferred frame; the other buys infinite branching universes. Both are ontologically extravagant compared to a naive classical view. Why is your extravagance "elegant geometry" and mine "cheating"?

  **Elena:** Because my extravagance respects the symmetry of the Lagrangian. If the fundamental equations don't pick out a frame, why should reality? If you posit a preferred frame that the equations hide from you, you're suggesting the universe is systematically deceiving us about its own symmetry. That's a heavy metaphysical burden.

  **Marcus:** Is it deception? Or is it just that the symmetry is emergent? Think of fluid dynamics. Sound waves in a fluid obey wave equations that look relativistic. But there's a preferred frame: the rest frame of the fluid. If you were a microscopic creature living in the sound waves, you'd think you had a "speed of sound" limit and Lorentz-like symmetry. But fundamentally, there's a medium. Maybe spacetime is the fluid. Maybe the "preferred frame" is the rest frame of the quantum vacuum or the underlying substratum.

  **Elena:** That's the Neo-Lorentzian move, essentially. But here is my counter-strike, specifically on your QM point. Even if Bohmian mechanics requires a foliation, does that foliation correspond to *temporal passage*? In Bohmian mechanics, the configuration of the universe exists on the entire hypersurface. The "guidance" tells you how the configuration changes as you move from one slice to the next. But mathematically, that's just a parameterization of a 4D history. You can view the whole set of trajectories as a static 4D braid. The "flow" is still something *you* add, not something the Bohmian particles do.

  **Marcus:** That's the "B-Theory" retreat. You're saying that even if I have a preferred slice, I haven't proven that the slice *moves*.

  **Elena:** Exactly. "Moving" implies a second time dimension. A time for time to flow in. If you have a preferred frame, you have a privileged *ordering* of events. You don't necessarily have *becoming*. You just have a unique way to slice the loaf. The loaf is still there.

  **Marcus:** But if the loaf is there, what determines which slice is "lit up"? In a Block, my consciousness at age 20 and age 80 exist equally. Why do I experience this specific sequence?

  **Elena:** Because consciousness is a process embedded in the worldline. You experience the sequence because your brain states are causally connected along that worldline. You don't need the "now" to move; you just need the memory records to be ordered.

  **Marcus:** That explains the *record* of time, not the *experience* of passage. But let's grant your point for a moment. If I concede that a preferred frame doesn't guarantee "flow," does it at least save the idea that the future is *open*? In a Block, the Andromedan decision is already made. In my view, even with a preferred frame, if the future is quantum indeterminate, it doesn't exist yet.

  **Elena:** Now we're shifting from Relativity to Determinism. You can have a Block Universe with indeterminism. Just say the block isn't "fixed" until it's... well, that requires a meta-time. Look, Marcus, here is where I think we actually stand. You want to save the openness of the future. I want to save the symmetry of spacetime.
  Your QM argument shows that *if* we demand a single outcome (collapse) or definite trajectories (Bohm), we strain against Relativity. I accept that strain. But I argue that the strain is better handled by accepting the 4D geometry and letting QM be weird (Many Worlds) or accepting that "reality" is relative to the observer (QBism), rather than breaking the spacetime symmetry.

  **Marcus:** And I argue that spacetime symmetry is a classical idealization that QM is already breaking. If the wavefunction collapses, something happens *everywhere* at once. That "everywhere at once" defines a simultaneity. If we detect that physically—say, through a future experiment that confirms objective collapse over Many Worlds—then your Block Universe loses its primary physical support. Special Relativity would be an approximation of a deeper, foliated theory.

  **Elena:** Fair. If tomorrow an experiment proves GRW collapse and rules out Everett, I will concede that Lorentz invariance is not fundamental. But I won't concede Presentism. I'll concede a Neo-Lorentzian Block. I'll say there is a preferred slice, but the future slice exists just as much as the past one. The "openness" is still an illusion of perspective.

  **Marcus:** (Laughs) You're impossible. You'd accept the preferred frame but deny it does the one job I want it to do?

  **Elena:** Because the frame gives you *order*, Marcus, not *creation*. The Andromeda paradox shows that "now" is frame-dependent. You fix that by picking one frame. Fine. But the Rietdijk-Putnam argument also shows that *your* "now" is someone else's "past." Even with a preferred frame, the events on Andromeda are fixed by the light cones reaching us. The only way to truly save "the future is open" is to deny that the events on Andromeda exist *at all* until our light cone reaches them. But that requires violating Lorentz invariance not just in a hidden variable, but in the causal structure itself. That's a much bigger bullet to bite than Bohmian trajectories.

  **Marcus:** So we're back to the size of the bullet. You bite the bullet of "my future self is already writing this reply." I bite the bullet of "nature hides its preferred frame from us to maintain a symmetry in the equations."

  **Elena:** Precisely. And for a physicist, symmetry is a better guide to truth than intuition. Intuition evolved to catch gazelles on the savannah, not to understand spacetime intervals.

  **Marcus:** And for a realist, existence is a better guide than symmetry. If the equations hide the mechanism of collapse, maybe the equations are incomplete, not the reality.
  (Silence falls between them. A leaf lands on the path.)
  You know, the frustrating part is, we might not know which bullet is smaller until we have a theory of Quantum Gravity. If spacetime is emergent, maybe "time" is too.

  **Elena:** (Nods) Then we're both wrong. And the Block is just a shadow on the cave wall.

  **Marcus:** Until then, I'll keep my preferred frame. It lets me sleep at night knowing the future isn't written.

  **Elena:** And I'll keep my Block. It lets me sleep knowing the past isn't lost.

  **Marcus:** Cheers to that.

  **Elena:** Cheers.
