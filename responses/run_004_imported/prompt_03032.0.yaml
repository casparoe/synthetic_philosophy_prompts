  *   Elena's Solution: Accepting a norm that *permits* torture? No, that's too strong. Accepting a norm that *doesn't forbid* it?
  *   Better (Gibbard): Ruling out the plan-state of forbidding torture.
  *   Let's have Elena use the "inconsistency" account.

  7.  **Final Review against constraints:**
      *   PhD level? Yes.
      *   Dialogue format? Yes.
      *   Negation problem addressed? Yes.
      *   Creeping minimalism addressed? Yes.
      *   No tidy resolution? Yes.

