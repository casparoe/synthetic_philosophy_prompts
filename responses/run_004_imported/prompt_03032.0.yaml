  2.  **Character Conception:**
      *   **Expressivist (Elena):** Needs to be up-to-date. Let's lean towards a Gibbard-Schroeder hybrid. She should be comfortable with technical machinery (normative worlds, consistency of plans, etc.) but aware of the metaphysical costs.
      *   **Cognitivist (Marcus):** Needs to be sympathetic to minimalism but insistent on robust distinctions. He shouldn't be a old-school error theorist but rather a minimalist realist who thinks expressivism collapses into his view.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Acknowledge the "textbook victory" myth. Establish the stakes.
      *   **The Negation Problem (Unwin):**
          *   *Marcus's Move:* It's not just about validity; it's about the *attitude* toward the negation. "It is not the case that lying is wrong" vs. "I don't accept that lying is wrong."
          *   *Elena's Move:* Deploy a Schroeder-style "being for" account or Gibbard's "disagreement in plan." Let's go with a Gibbardian "accepting a norm that forbids..." framework, refined by Schroeder's type-consistency.
          *   *Concrete Example:* Don't just use "Lying is wrong." Use a conditional or a negation embedded in a disjunction to make it harder. Let's stick to the prompt's focus on *negation* specifically first. Sentence: "It is not the case that stealing is wrong."
          *   *Technical Detail:* Elena needs to explain what mental state this expresses. If "Stealing is wrong" = Being for blaming for stealing, then "Not (Stealing is wrong)" = ? Being for *not* blaming? Or Not being for blaming? This is the crux of Unwin's point.
          *   *Refinement:* Elena should argue for a distinction between *rejecting* a plan and *accepting* a contrary plan. Gibbard's *Wise Choices, Apt Feelings* or *Thinking How to Live* distinction. Let's use the "inconsistency" angle. To accept $\neg p$ is to rule out worlds/plans where $p$ holds.

      *   **The Pivot (Creeping Minimalism/Dreier):**
          *   *Marcus's Move:* Okay, you've saved the logic. But now look at your ontology. You're talking about "normative facts," "truth," "consistency." If your "acceptance of a plan" plays the same functional role as my "belief in a normative proposition," what's the difference?
          *   *Elena's Move:* The metaphysical grounding. The direction of fit.
          *   *Marcus's Counter:* Direction of fit is a functional story. If your plans *track* reasons just like beliefs track truth, you're a realist.
          *   *Elena's Counter:* The nature of the *state*. Planning is constitutively different from believing.
          *   *Marcus's Clincher:* But if you say planning states have truth conditions (via minimalism), then you're just a cognitivist about planning states.

      *   **The Ending:**
          *   Leave it on the metaphysical vs. semantic distinction. Is the difference substantive or merely verbal?

  4.  **Writing - Focusing on Technical Accuracy:**
      *   *Unwin's Point:* The problem is that $\neg P$ isn't just the absence of the attitude toward $P$. It's a specific attitude. Expressivists often struggle to define the attitude toward $\neg P$ without invoking a belief-like state.
      *   *Schroeder's "Being For":* $P$ = Being for $X$. $\neg P$ = Being for $\neg X$? No, that's contraries. $\neg P$ needs to be incompatible with $P$. Schroeder argues for a generic attitude "being for" where the objects are relations.
      *   *Gibbard:* Norm-acceptance. To deny a norm is to accept a norm that conflicts with it.
      *   *Dreier:* If expressivists say moral sentences are truth-apt, express moral propositions, and describe the world (in a minimalist sense), they are cognitivists.
      *   *Dialogue Flow:* Ensure Elena doesn't just wave hands. She needs to commit to a specific mechanism. Let's have her commit to a Gibbardian "norm-acceptance" view refined by the idea that negation marks *inconsistency* in the plan-laden state.

