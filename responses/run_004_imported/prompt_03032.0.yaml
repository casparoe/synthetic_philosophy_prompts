answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two coffee cups sit between stacks of journals. Elena (Expressivist) and Marcus (Cognitivist) are both in the final year of their PhDs.*

  **Marcus:** You're smiling like someone who just solved Frege-Geach. I should warn you, the syllabus might say that battle is over, but the literature says otherwise.

  **Elena:** I'm not smiling because I solved it. I'm smiling because I finally stopped trying to solve the textbook version. Everyone gets hung up on the validity of *If lying is wrong, then getting your little brother to lie is wrong*. But as soon as you leave the seminar room, the real trouble starts. It's Unwin's problem. It's always been Unwin's problem.

  **Marcus:** Finally, some honesty. The modus ponens fix is cheap. You can validate the inference by stipulating consistency conditions on attitudes. But negation? That's where the ontology bleeds through. Take a simple sentence: "It is not the case that torture is wrong." On your view, what mental state does that express?

  **Elena:** Okay, let's be specific. I'm working with a hybrid of Gibbard's norm-acceptance and Schroeder's "being for" account. So, for the positive claim "Torture is wrong," I'm not just saying I have a "Boo" attitude. I'm saying I am *for* blaming for torture. It's a plan-laden state. I'm endorsing a norm that prescribes blame in that context.

  **Marcus:** Fine. Now apply negation. If "Torture is wrong" is *being for blaming for torture*, then "It is not the case that torture is wrong" can't just be *not being for blaming for torture*. That's agnosticism. That's withholding judgment. Negation is a commitment.

  **Elena:** Agreed. That's why I lean on the inconsistency constraint. To accept the negation is to hold a plan-state that is *inconsistent* with the plan-state of being for blaming for torture. Specifically, it's to be *for* not blaming for torture.

  **Marcus:** Wait. "Being for not blaming"? That sounds like you're prescribing permission. But I can deny that torture is wrong without thinking it's permissible. I might think the concept of 'wrong' doesn't apply here at all. Maybe it's a category mistake.

  **Elena:** Then your plan-state involves ruling out the applicability of the norm itself. Look, the technical move here is to treat the content of the plan as a function from worlds to actions. If $P$ is "Torture is wrong," accepting $P$ rules out all normative worlds where torture isn't blamed. Accepting $\neg P$ rules out all normative worlds where torture *is* blamed. The logical negation maps onto the incompatibility of the plan-states. We don't need a new *kind* of attitude; we just need the existing attitude to have a structure that allows for contradiction. Schroeder handles this by arguing that "being for" is a single relation that can take inconsistent objects.

  **Marcus:** I see the machinery. It's elegant, I'll grant you. You've saved the logic. You've explained why asserting $P$ and asserting $\neg P$ is a conflict, not just a mood swing. But this is exactly where Dreier corners you. You've saved the logic by making your expressivism indistinguishable from a minimalist cognitivism.

  **Elena:** That's the creeping minimalism charge. I know it. But there's a difference.

  **Marcus:** Where? You're talking about "normative worlds." You're talking about "inconsistency" between states. You're even willing to say moral sentences are truth-apt, provided 'truth' is deflationary. If I say "It is true that torture is wrong," you nod. If I say "There is a moral fact that torture is wrong," you shrug and say, "Sure, in a minimalist sense." So, what are you denying? What is the substantive thesis of expressivism left standing?

  **Elena:** The metaphysics of the mental state. That's the hard line. You, the cognitivist, think the state I'm in when I judge "Torture is wrong" is fundamentally a *belief*. It aims to represent the world. Its direction of fit is mind-to-world. If the world doesn't match the belief, the belief is faulty.

  **Marcus:** But you just said you're "for blaming." That sounds like a desire or a plan.

  **Elena:** Exactly. It's a plan-laden state. Its direction of fit is world-to-mind. If the world doesn't match my plan, the *world* is faulty. Or rather, the action is faulty. The logical structure might look identical—we both use Boolean operators, we both talk about truth—but the *nature* of the state playing that role is different. You're modeling moral judgment on perception; I'm modeling it on decision.

  **Marcus:** But here's the rub, Elena. If your plan-states play the *exact* same inferential role as beliefs—if they embed in conditionals, if they negate, if they are truth-apt in the deflationary sense—then "belief" just becomes the functional term for "whatever state plays that role." You're positing a psychological difference that does no semantic work.

  **Elena:** It does metaphysical work! It explains why moral judgment motivates. If I believe that torture has the property of wrongness, why does that move me? You need a Humean theory of motivation plus a bridge principle. On my view, the motivation is built into the state. To judge is to plan.

  **Marcus:** That's the old Internalism argument. But plenty of cognitivists are internalists now. They argue that moral concepts are essentially practical. So if I, a cognitivist, say "Moral beliefs are essentially practical beliefs," and you, an expressivist, say "Moral judgments are plan-laden states," and we both agree they motivate and they embed logically... we are just using different words for the same functional node. You've crept all the way to realism. You're just a realist who prefers the word "plan" to "belief."

  **Elena:** No, because the *explanation* of the normativity is different. For you, even a soft realist, there is a property out there—call it 'wrongness'—that my state tracks. Even if it's a natural property, even if it's minimalist, there's a *tracking* relation. For me, there is no tracking. There is only the coherence of the plan. When I say "Torture is wrong," I am not describing a feature of torture. I am legislating a stance toward it.

  **Marcus:** But you just admitted you're willing to call it a "fact." You're willing to say your plan "tracks reasons." If you say my plan tracks reasons, aren't you admitting there are reasons out there to be tracked?

  **Elena:** Reasons are normative, not metaphysical. To say a plan tracks a reason is just to say the plan is justified by other plans. It's coherence all the way down. You're looking for a bottom level of ontology. I'm denying there is one.

  **Marcus:** And that's where I think you're bluffing. Because if you say "It is a fact that torture is wrong" is true, and you say that sentence expresses a state that is inconsistent with its negation, and you say that state is justified by reasons... you have accepted the cognitivist's grammar. The only thing you're holding onto is a ghost of non-cognitivism. You're insisting that deep down, in the psychological basement, it feels like planning rather than believing. But if the logic is the same, and the truth-conditions are the same (even if minimal), why should the metaphysics of the mind matter to the semantics?

  **Elena:** Because the metaphysics of the mind determines what counts as an error! If I'm planning and my plan is incoherent, I'm irrational. If I'm believing and my belief fails to match the world, I'm mistaken. Those are different failure conditions.

  **Marcus:** Are they? If the "world" in your view just *is* the set of coherent plans, then incoherence *is* mismatch. You've collapsed the distinction. Look, I'm not saying you're wrong. I'm saying you've won the battle by surrendering the war. You've saved expressivism by making it a version of minimalist realism. And if that's the victory, I'm happy to concede the point, provided you admit you're no longer denying what I affirm.

  **Elena:** I'm not admitting that. I think the distinction between legislating norms and describing facts is the only thing that keeps ethics from being just another science. If I concede that, I lose the critical power of metaethics. I can say "Your moral facts are just projections of your plans." You can't say that about my plans without begging the question.

  **Marcus:** But if your plans have truth conditions, I can say your projections are true. And then we're just arguing about whether to call it "projection" or "detection."

  **Elena:** *[Pauses, stirring cold coffee]* Maybe. Or maybe we're arguing about whether the human stance toward value is fundamentally one of discovery or creation. That's not a verbal dispute.

  **Marcus:** No, it's not. But if your semantics forces you to talk like a discoverer to save your logic, you have to wonder if the creation story survives the translation.

  **Elena:** Then let the translation stand. I'll keep the ontology.

  **Marcus:** And I'll keep the semantics. But don't tell me you've solved Frege-Geach. You've just moved the mystery from the logic to the metaphysics.

  **Elena:** Isn't that all we ever do?

  **Marcus:** *[Smiles]* Touché. But at least now we know where the bodies are buried.
