answer: |-
  Your friend has stumbled upon a well-known and serious philosophical problem, often called the **"Cluelessness Objection"** to consequentialism. It is a sophisticated argument, and it is good that you take it seriously. However, while the objection highlights the limits of human knowledge, most ethicists and economists agree that it **does not** justify inaction.

  You were right to feel unsatisfied. Your friend's conclusion—that uncertainty cancels out confidence—relies on a few hidden assumptions that don't hold up under scrutiny.

  Here is a principled breakdown of why your donation is still rationally defensible, despite the unknowable long-term future.

  ### 1. The Symmetry of Uncertainty
  Your friend argues that because the long-term effects are opaque, the "good" and "bad" outcomes should cancel each other out, leaving you with zero net confidence. This assumes that the unknown future is equally likely to be better or worse than the status quo.

  However, there is no reason to bias that uncertainty toward *harm*.
  *   **The Default Value of Existence:** Most people, when asked, report that they are glad to be alive. Unless you have specific reason to believe the person you saved will grow up to cause catastrophic harm (e.g., become a genocidal dictator), the default assumption is that extending a life adds positive value to the world from the perspective of the person living it.
  *   **Symmetric Ignorance:** If you are "clueless" about the long-term ripple effects of *donating*, you are equally clueless about the long-term ripple effects of *not donating* (i.e., keeping the money). Perhaps spending that money on a nice dinner for yourself sets off a chain of economic events that leads to a war fifty years later. Since both options (donating vs. keeping) have equally opaque long-term consequences, you cannot use long-term uncertainty to argue against donating. You must decide based on the **foreseeable** consequences.

  ### 2. The Paralysis Problem
  If your friend's logic were applied consistently, it would lead to moral paralysis. Every action we take has unknowable downstream effects.
  *   If you drive to work, you might accidentally cause a traffic jam that makes someone late for a job interview, costing them their livelihood.
  *   If you stay home, you might miss an opportunity to help someone in need.

  If we require certainty about infinite downstream consequences before acting, we can never do anything. Moral reasoning is necessarily bounded by **tractability**. We are responsible for the consequences we can reasonably foresee and influence. The immediate saving of a life is a high-probability, high-magnitude good that is foreseeable. The downstream economic effects are low-probability and unforeseeable. Rational agents weigh the foreseeable heavily against the unforeseeable.

  ### 3. The Empirical Rebuttal (Population and Resources)
  Your friend's specific worry—that saving a life leads to overpopulation and resource strain—is not just philosophically uncertain; it is often **empirically incorrect**.

  Developmental economics and global health data generally show the opposite of what your friend fears. This is known as the **Demographic Transition**:
  *   **Health leads to smaller families:** When child mortality drops (because of charities like the ones you support), parents tend to have *fewer* children, not more. When parents are confident their children will survive to adulthood, they invest more in fewer children.
  *   **Health leads to economic growth:** A healthier population is a more productive population. Saving lives and reducing disease burden typically strengthens local economies rather than draining resources.

  So, even in the medium-term (50–100 years), the evidence suggests your donation is likely to lead to a more stable, prosperous, and sustainable population, not a resource-strained one. You aren't just guessing; you are betting on historical trends.

  ### 4. Expected Value vs. Certainty
  In decision theory, we don't act on certainty; we act on **Expected Value (EV)**.
  *   **Short-term EV:** Extremely high. A life is saved, suffering is reduced.
  *   **Long-term EV:** Uncertain, but likely positive (based on the symmetry and demographic arguments above).

  Even if the long-term EV is a "wash" (zero), the short-term EV is massively positive.
  $$ \text{Total Value} = \text{Short-Term (High Positive)} + \text{Long-Term (Unknown/Neutral)} $$
  $$ \text{Total Value} = \text{Positive} $$

  Your friend is arguing that $\text{Long-Term (Unknown)}$ should be treated as $\text{Negative Infinity}$ or that it negates the Short-Term. But without evidence of specific long-term harm, the rational calculation is to bank the known good.

  ### 5. The Counterfactual Comparison
  Finally, ethics is usually about comparing options, not seeking perfection. The question isn't "Does donating produce a perfect outcome?" The question is "Is donating better than the alternative?"

  The alternative was likely spending that money on consumption (clothes, entertainment, savings).
  *   **Donation:** Saves a life (known good) + Unknown long-term ripple.
  *   **Consumption:** Enjoyment for you (known minor good) + Unknown long-term ripple.

  Since both options carry the same "burden" of unknowable long-term consequences, the decision comes down to the foreseeable impact. The foreseeable impact of saving a life vastly outweighs the foreseeable impact of minor personal consumption.

  ### Summary
  Your friend is right that we cannot *trace* the infinite future. She is wrong that this *nullifies* the value of the present.

  You can defend your choice with three points:
  1.  **Epistemic Humility:** We must act on foreseeable consequences, or we can never act at all.
  2.  **Empirical Evidence:** Better health typically leads to lower population growth and stronger economies, countering the "resource strain" fear.
  3.  **Comparative Good:** Even if the long term is a wash, the short-term good is real, and it is greater than the alternative use of the funds.

  You have strong grounds for your confidence. The uncertainty of the future does not erase the certainty of the relief you provided today.
