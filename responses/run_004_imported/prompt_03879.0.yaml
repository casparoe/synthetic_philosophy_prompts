  2.  **Deconstruct Bernoulli's *Specimen Theoriae Novae*:**
      *   **Goal:** Bernoulli wasn't trying to build a universal axiomatic system for all rational choice (like von Neumann-Morgenstern). He was trying to solve a specific problem: why do prudent men refuse the St. Petersburg gamble despite infinite mathematical expectation?
      *   **Key Concept:** *Emolumentum Medium* (Moral Expectation) vs. *Expectatio Mathematica* (Mathematical Expectation).
      *   **Utility Function:** He proposes $U(w) = \ln(w)$. Why? Because the "value of an item is not based on its price, but on the utility it yields." Specifically, the marginal utility of wealth decreases as wealth increases.
      *   **Assumptions:**
          *   Wealth is positive ($w > 0$).
          *   Utility is bounded in practice (though $\ln(w)$ is unbounded, the *changes* become negligible).
          *   The focus is on the *change* in fortune relative to existing wealth.
          *   He cares about *prudence* and *empirical adequacy* (matching how people actually behave), not abstract mathematical consistency for all conceivable series.
      *   **Attitude towards Infinity:** Bernoulli was a mathematician of his time. He understood divergent series were problematic, but his solution was physical/psychological, not purely mathematical. He wanted to align math with human experience.

  3.  **Analyze the Pasadena Paradox:**
      *   **Setup:** Coin toss $n$. Payoff $(-1)^{n+1} \frac{2^n}{n}$.
      *   **Probability:** $1/2^n$.
      *   **Expected Utility Term:** $\frac{1}{2^n} \times (-1)^{n+1} \frac{2^n}{n} = \frac{(-1)^{n+1}}{n}$.
      *   **Series:** $1 - 1/2 + 1/3 - 1/4 + \dots$ (Alternating Harmonic Series).
      *   **Problem:** Conditionally convergent. Riemann Rearrangement Theorem says you can sum to anything.
      *   **Implication:** Expected Utility (EU) is undefined.

  4.  **Simulate Bernoulli's Reaction (The "What Would Daniel Say?" Phase):**

      *   *Initial Reaction:* Shock at the sophistication, but skepticism about the *physicality* of the gamble.
      *   *Point 1: The Nature of Utility.* Bernoulli defined utility relative to *existing wealth*. The Pasadena game defines payoffs directly in "utils" (or abstract value units) independent of a baseline fortune. Bernoulli might argue this is category error. For him, utility is $U(w + \Delta w) - U(w)$. It's not a free-floating number.
      *   *Point 2: Boundedness.* Bernoulli's log function grows slowly. Pasadena payoffs grow exponentially ($2^n$). Even with log utility, if the cash payoff is $2^n$, utility is $\ln(2^n) = n \ln 2$. The probability is $1/2^n$. Term becomes $n/2^n$, which converges absolutely. *Wait, Pasadena stipulates the utility is already the divergent part.* If the *utility itself* is $\frac{2^n}{n}$, Bernoulli would reject the premise. No human mind can perceive a utility difference of $2^{100}$. He would argue utility must be bounded by human capacity.
      *   *Point 3: Prudence and Realizability.* Bernoulli was interested in "prudent men." A game requiring infinite bankroll or offering payoffs that exceed the wealth of the universe is not a valid object of choice. He might dismiss it as a "mathematical chimera" rather than a decision problem.
      *   *Point 4: Order of Summation.* Bernoulli summed the St. Petersburg series in the natural order of probabilities ($1/2, 1/4, 1/8...$). He would likely insist the natural temporal ordering of the coin tosses is the only valid ordering. Rearranging terms is a mathematical trick, not a decision-theoretic operation.
      *   *Point 5: The Goal of the Theory.* His theory was descriptive/normative for *economic* risk. If a series doesn't converge absolutely, he might say "The expectation is indeterminate," and therefore a prudent man refuses the gamble. This preserves the theory: if EU is undefined, you don't play.

