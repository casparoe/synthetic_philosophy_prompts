prompt: |-
  So I'm a decision science PhD student, and I've got a dissertation chapter on reference class forecasting -- basically the Kahneman/Tetlock "outside view" idea where you predict a specific case by looking at how similar past cases turned out. The thing I keep running into is that for pretty much any case there's several different reference classes I could plausibly use, and they each spit out a different base rate, which I've slowly realized is just the old reference class problem from philosophy of probability rearing its head again. Can you walk me through the most important implications of the reference class problem for how I should actually being doing single-case forecasting in my work? Like is there any principled way to pick the "right" class, or does the whole method just quietly smuggle back in the same subjective judgment its supposed to be an alternative to?
