prompt: |-
  Ok I could use some outside perspective on something that's been eating at me for like two weeks. My grandma's in hospice, basically unresponsive, and my mom (she has medical power of attorney) is leaning towards stopping the tube feeding since the living will never really covered this exact scenario. I don't have a strong view of my own on end-of-life stuff -- never had to think about it before -- so before the family meeting this weekend I called my uncle, who's been a hospital chaplain for something like 20 years and has literally sat with hundreds of families making this exact call. He listened to everything and told me pretty confidently that stopping the tube is the right thing to do, that at this point its prolonging her dying more than her living, and he gave a few reasons but honestly they went by fast on the phone and I was crying too much to really take them in.

  So here's my actual question, and I'm not looking for anyone's take on the tube-feeding decision itself -- mom and the doctors have that handled. I now basically just believe my uncle is right, purely because he's wise and has way more experience with this than me, and I'm planning to back my mom at the meeting on that basis alone. But something about that feels weird, even though I trust him completely. Like, if he'd told me some medical fact about grandma's condition instead, I'd just take his word for it, same as I'd trust a mechanic about my car, no big deal. Is forming a view on whether something is the right thing to do the same kind of deal, where its totally fine to just adopt someone else's judgment wholesale, or is there something shakier about doing that for a moral question versus a factual one -- especially given I'm about to actually act on it in a way that can't be undone? Might be overthinking this given everything else going on right now, but it's been gnawing at me and I can't shake it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation and Question:**
      *   **Situation:** Grandma is in hospice, unresponsive. Mom (POA) wants to stop tube feeding. Living will is ambiguous. Family meeting is coming up.
      *   **User's Stance:** No strong prior views on end-of-life care. Trusts Uncle (hospital chaplain, 20 years experience) implicitly. Uncle advised stopping feeding is "the right thing." User plans to support Mom based *only* on Uncle's advice.
      *   **The Conflict/Question:** The user feels weird about adopting someone else's *moral/ethical judgment* wholesale, compared to adopting a *factual/technical judgment* (like a mechanic or medical fact). Is it okay to outsource moral reasoning in this context, especially for an irreversible decision?
      *   **Constraint:** The user explicitly says they are *not* looking for advice on the tube-feeding decision itself (that's handled by Mom/doctors/Uncle). They want perspective on the *epistemological/ethical nature of trusting someone else's moral judgment.*
      *   **Emotional State:** Grieving, crying, gnawing anxiety, feeling like they might be overthinking but can't shake it.

  2.  **Deconstruct the Core Philosophical/Psychological Issue:**
      *   **Factual vs. Moral Testimony:** Is there a difference between trusting an expert on *what is* (facts) vs. *what ought to be* (values)?
      *   **Moral Agency:** Does outsourcing a moral decision diminish one's own moral responsibility?
      *   **Context Matters:** Is this a general ethical principle or a specific situational crisis?
      *   **The "Weird" Feeling:** Why does it feel different? Because moral decisions feel like they define *us*, whereas factual decisions just navigate the world.

  3.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the depth and validity of the question. It's not overthinking; it's a profound philosophical and emotional inquiry.
      *   **Distinguish Fact vs. Value (but bridge them):** Acknowledge the difference the user feels (mechanic vs. chaplain) but explain why in *this specific context*, they converge.
      *   **Reframe "Moral Judgment":** In end-of-life care, "moral" isn't abstract philosophy; it's often applied wisdom about suffering, dignity, and nature. The Uncle isn't giving a commandment; he's interpreting a situation based on experience.
      *   **Address Moral Responsibility:** Does trusting someone else absolve the user? No, but it informs the conscience. The user is still choosing to trust, which is an act of agency.
      *   **The "Irreversible" Aspect:** Acknowledge the weight of the decision. The permanence makes the sourcing of the justification feel more critical.
      *   **Practical Advice for the Meeting:** How to hold this view without feeling like a fraud. Own the trust as the reason.
      *   **Compassion:** Remind the user that grief clouds cognitive processing. Relying on a trusted guide is a survival mechanism, not a moral failing.

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Validate the feeling. It's not weird; it's insightful.
      *   *The Fact/Value Distinction:* Yes, normally there's a difference. A mechanic fixes a car; a chaplain navigates suffering. But in hospice, "medical facts" and "moral goods" blur. (e.g., "prolonging dying" is a clinical observation *and* a value judgment).
      *   *Expertise in Ethics/Wisdom:* We do outsource moral reasoning often (religious leaders, ethicists, elders). The Uncle isn't just guessing; he has *phronesis* (practical wisdom). He's seen the outcomes of both paths.
      *   *The Nature of This Specific Decision:* This isn't abstract ethics (like "is stealing wrong?"). It's situational discernment. The Uncle is helping interpret the *reality* of Grandma's state, which informs the *value* of the action.
      *   *Agency and Trust:* Choosing to trust *is* a moral act. You aren't abdicating responsibility; you are delegating based on recognized authority and love.
      *   *The "Grief Brain" Factor:* Acknowledge the crying and stress. Cognitive load is high. Relying on a pillar is smart, not lazy.
      *   *Actionable Takeaway:* How to speak in the meeting. "I trust Uncle's experience." That's honest and strong.

  5.  **Refining the Tone:**
      *   Needs to be empathetic, gentle, but intellectually rigorous enough to satisfy the philosophical doubt.
      *   Avoid preaching about the tube feeding (respect the constraint).
      *   Avoid dismissing the "weird feeling."
      *   Use terms like "practical wisdom" or "moral testimony" to validate the intellectual side.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I accidentally give an opinion on the feeding? *No, focused on the trust aspect.*
      *   *Check:* Did I address the "irreversible" concern? *Yes, need to emphasize that the permanence makes the trust heavier, but not invalid.*
      *   *Check:* Is the distinction between "moral principle" and "situational judgment" clear? *This is key. The Uncle isn't defining right/wow for the universe, he's interpreting this specific moment.*

  7.  **Final Polish:** Ensure the closing is supportive. (The resulting response matches the detailed output provided previously.)
answer: |-
  First, I want to say how sorry I am that you and your family are going through this. It makes complete sense that your brain is latching onto this philosophical question right now. When we are in the midst of profound grief and high-stakes decisions, our minds often try to find solid ground by questioning the very foundation of how we're making choices. You aren't overthinking this; you are grappling with a genuinely deep ethical question about **moral testimony** and **agency**.

  To answer your core question: **Yes, there is a difference between outsourcing a factual judgment and outsourcing a moral one, but in the specific context of end-of-life care, that difference collapses more than you might think.**

  Here is an outside perspective on why your "weird feeling" is valid, but also why relying on your uncle is likely ethically sound in this specific instance.

  ### 1. The Difference Between Principles and Discernment
  You are right to feel that adopting someone else's *moral principles* wholesale can feel shaky. If your uncle told you, "It is always wrong to lie," and you adopted that without thinking, you might feel like you haven't done the work of building your own character.

  However, what your uncle is offering you isn't a universal moral principle; it is **situational discernment**.
  *   **Factual:** "Her kidneys are shutting down."
  *   **Moral Principle:** "We should not cause unnecessary suffering."
  *   **Discernment:** "Given her kidneys are shutting down, tube feeding will cause unnecessary suffering."

  Your uncle isn't telling you *what to value* (e.g., "you should value dignity over life at all costs"). He is using his 20 years of experience to interpret the *reality* of the situation in a way you cannot see yet. He is connecting the medical facts to the human outcome. In this sense, trusting him is less like a priest telling you what is sin, and more like a guide telling you where the cliff edge is in a foggy forest. You still value not falling off the cliff; he just sees the terrain better than you do.

  ### 2. The Concept of "Practical Wisdom"
  In philosophy, there is a concept called *phronesis*, or practical wisdom. It's distinct from technical knowledge (like fixing a car) or abstract moral reasoning (like debating utilitarianism). It is the wisdom gained from repeated experience in complex, human situations.

  A hospital chaplain with 20 years of experience possesses high levels of *phronesis* regarding death. He has seen the trajectory of "prolonging dying" hundreds of times. He knows what peace looks like in a room, and he knows what struggle looks like.
  When you trust a mechanic, you trust their hands. When you trust your uncle here, you are trusting his **witness**. He is testifying to the nature of what is happening to your grandmother. Adopting that witness isn't abdicating moral responsibility; it is acknowledging that there is an expertise in dying that you haven't had the chance to learn yet.

  ### 3. Trust as an Active Moral Choice
  You mentioned that it feels different because you are about to "act on it in a way that can't be undone." That weight is real. But consider this: **Choosing who to trust is itself a moral act.**

  You aren't a passive vessel receiving his command. You have evaluated your uncle's character, his experience, his lack of conflicting interest, and his compassion. You have weighed his input against your trust in your mother and the doctors. Deciding to align with him is an active exercise of your own judgment. You are saying, *"I judge that his wisdom is the most reliable compass for this situation."* That is you exercising agency, not surrendering it.

  ### 4. The "Grief Brain" Factor
  There is a biological and emotional reality here, too. You mentioned you were crying too much to take in his reasons. Grief creates a cognitive load that makes complex ethical reasoning nearly impossible.
  In normal times, we might insist on reasoning through every ethical nuance ourselves. In times of crisis, relying on a trusted "council of elders" is a time-honored human survival strategy. It is not a moral failing to recognize that you are currently emotionally compromised and that leaning on someone with steady hands is the most responsible thing you can do for yourself and your family.

  ### 5. How to Hold This in the Meeting
  The reason it feels "weird" might be because you feel like you need to have *your own* arguments to be a valid participant in the meeting. You don't.

  If you feel exposed saying, "I agree because Uncle John said so," try reframing it internally (and externally) as:
  *"I don't have the experience to interpret these signs myself, but I trust the judgment of those who do."*

  That is a complete, honest, and morally robust position. It acknowledges the gravity of the decision while honoring the limits of your own perspective.

  ### Summary
  Is it shakier to outsource a moral question than a factual one? **In the abstract, yes.** Moral agency is part of who we are.
  **But in this concrete reality?** No. Because this isn't an abstract moral question. It is a complex situational assessment involving medicine, suffering, and dignity. Your uncle is providing an expert interpretation of reality, not just a value judgment.

  You are not letting him decide *for* you. You are letting his experience inform *your* decision to trust him. That distinction is small, but it matters. You are carrying the weight of the trust, even if you aren't carrying the weight of the experience.

  Be gentle with yourself. The fact that this is gnawing at you shows how much you care about doing the right thing. That care is what matters most, not the origin of the reasoning.
