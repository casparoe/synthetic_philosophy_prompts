answer: |-
  This is a profound question that disguises itself as a mundane administrative dispute. You have stumbled directly into one of the most famous problems in the philosophy of language and law, often associated with Ludwig Wittgenstein and later Saul Kripke.

  You are asking whether there is a **fact of the matter** about what a rule *was* before the edge case arose, or whether the rule is only constituted by how we choose to apply it now.

  Here is my honest, carefully reasoned view on the metaphysics of your expense policy, how to resolve the dispute, and what this implies about rule-following in general.

  ### 1. Is there a "fact of the matter"?

  **No.** There is no hidden historical fact waiting to be uncovered that determines which interpretation is the "true" one.

  You have already done the empirical work: you checked the past data (all consistent with both rules) and you checked the author's intent (non-existent for this case). You might hope that there is some Platonic form of "Reasonable Expense" that exists independently of human interpretation, or that the manager's brain contained a hidden neural state that dictated the answer even if she couldn't articulate it. But philosophy suggests otherwise.

  This is a version of the **Rule-Following Paradox**. Imagine a sequence: 2, 4, 6, 8... What comes next? Most say 10 (the rule is "add 2"). But logically, the data is also consistent with the rule "add 2 until 1000, then add 4." Until the sequence hits 1000, there is no behavioral fact that distinguishes the two rules.

  In your office, the "sequence" was every hotel booking under $150. That data is equally consistent with Rule A ("Never exceed $150") and Rule B ("Never exceed market rate by more than 10%"). Since the world never presented a price spike before, the community never had to *choose* between these rules. Therefore, the rule was **indeterminate**.

  Your colleague is not lying, and he is not logically wrong about the history. He is pointing out that the text and the history do not constrain his interpretation. To claim there is a "fact" he is violating is to claim that words carry their own future applications inside them like genetic code. They don't.

  ### 2. If there is no fact, is he making a mistake?

  If there is no historical fact he violated, why does everyone feel he is in the wrong? Because rule-following is not just about logic; it is about **coordination and expectation**.

  While there is no *semantic* fact about what the word "reasonable" meant, there is a *sociological* fact about what the team **expected**.

  *   **The Shared Practice:** For three years, the team engaged in a practice where expenses hovered around $150. This created a normative expectation. Even if the written rule was ambiguous, the *practice* was specific.
  *   **The Violation:** Your colleague violated the *expectation* even if he didn't violate the *text*. In a communal setting, the "meaning" of a rule is often found less in its definition and more in its established usage.

  So, is he mistaken? In a strict logical sense, no. In a pragmatic, social-contract sense, **yes**. He treated the policy as a solitary contract between him and the text ("What can I defend?"), whereas expense policies are social contracts between him and the group ("What do we all agree is fair?").

  His mistake was not a failure of logic, but a failure of **interpretive charity**. He interpreted the ambiguity in the way that maximized his own benefit, rather than in the way that maintained the group's equilibrium.

  ### 3. How should this dispute be resolved?

  Since there is no "true" past rule to appeal to, you cannot resolve this by adjudicating who is right about the *past*. You must resolve it by deciding what the rule *should be* going forward, and applying that decision fairly to the present case.

  Here is a reasoned path to resolution:

  1.  **Acknowledge the Indeterminacy:** The manager should admit that the policy was ambiguous and that the colleague's interpretation is logically defensible. This saves face for the colleague and acknowledges the reality you've uncovered.
  2.  **Appeal to Purpose, Not Text:** Ask: What is the *purpose* of the policy?
      *   If the purpose is **absolute cost control**, then $450 violates the spirit, and the team should reimburse up to the "normal" cap (e.g., $200) and let the colleague eat the rest.
      *   If the purpose is **enabling work without undue hardship**, then $450 is compliant, because forcing an employee to sleep in a car or commute two hours undermines the work.
      *   *My recommendation:* In professional journalism/science contexts, the purpose is usually the latter. You pay for the employee's ability to function. $450 is an market anomaly, not luxury. The company should pay it.
  3.  **Grandfather and Clarify:** Pay the $450 this time (honoring the ambiguity and the employee's good faith), but immediately update the policy. A good policy now reads: *"Reasonably priced (generally under $X), except in high-demand markets where pre-approval is required for rates exceeding $Y."*

  This resolves the immediate tension without punishing the colleague for a rule that didn't exist, while fixing the system for the future.

  ### 4. What does this imply about rule-following generally?

  This is where the story moves from HR to philosophy. Your dilemma points to a general truth about **all** rules, including scientific laws and legal statutes.

  **Rules do not apply themselves.**
  We often think of rules as rails that guide a train automatically. But as Wittgenstein argued, rails don't determine where the train goes; they only suggest a path based on how we have *learned* to follow rails. Every rule requires an act of interpretation at the moment of application.

  **Meaning is Use.**
  The meaning of "reasonable" wasn't found in the dictionary or the manager's head; it was found in the *pattern of behavior* of the office. When the pattern broke, the meaning became unstable. This is true in science, too. A scientific concept (like "planet" or "species") often works fine until an edge case (Pluto, ring species) forces the community to realize their definition was underdetermined. The community must then vote, argue, and decide what they *want* the concept to do.

  **The "Right" Answer is Often a Decision, Not a Discovery.**
  In law, this is the difference between *finding* the law and *making* the law. In hard cases (like your hotel spike), judges aren't discovering a pre-existing truth; they are making a choice that sets a precedent. Your office is now in that judicial position. You are not uncovering the rule; you are **legislating** it retroactively.

  ### Summary

  There is no fact of the matter about which interpretation was "correct" historically, because the history underdetermines the rule. Your colleague was logically consistent but socially tone-deaf.

  You should resolve this by recognizing that the rule was incomplete, prioritizing the *purpose* of the policy (likely enabling work) over the *letter* (the vague word "reasonable"), reimbursing the colleague to honor the ambiguity, and then writing a better rule.

  This isn't just a quirk of fuzzy language. It is a reminder that **clarity is a collaborative achievement, not a static property of text.** A rule is only as determinate as the community's agreement on how to handle the moments when it breaks.
