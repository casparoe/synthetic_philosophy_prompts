      *   *The Wittgenstein/Kripke Angle:* No past usage determines future application. Any past action (booking under $150) fits infinite rules (e.g., "under $150," "under $500," "reasonable relative to market," "reasonable unless it's Tuesday"). There is no mental state or historical fact that *forces* one interpretation over the other.
      *   *The Legal/Pragmatic Angle:* Rules are tools for coordination. When they break, we look to purpose, fairness, and future coordination.

  3.  **Evaluate the "Fact of the Matter" Question:**
      *   *Is there a hidden fact?* No. The journalist has already done the due diligence (checked past bookings, asked the author). The data is exhausted.
      *   *Conclusion:* There is no metaphysical "truth" waiting to be discovered about what the rule *was*. The rule is underdetermined by its history.

  4.  **Evaluate the "Mistake" Question:**
