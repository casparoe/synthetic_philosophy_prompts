      *   **Hyperbolic Discounting:** Behavioral Economics (Ainslie, Thaler, etc.). A mathematical model of how humans value rewards over time. We discount the future steeply in the short term but more shallowly in the long term. This leads to *preference reversal*. Key element: *Inconsistency over time*. It implies a cognitive bias or heuristic, not necessarily a moral failure.

  3.  **Analyze the Overlap:**
      *   Both explain procrastination (e.g., taxes vs. code refactoring).
