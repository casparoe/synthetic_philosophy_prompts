      *   **Knowledge:** Akrasia *requires* knowing the better course of action. Hyperbolic discounting can happen even if you don't explicitly judge one option as "better," just that the immediate one feels more valuable *now*.
      *   **Moral/Rational Normativity:** Akrasia is inherently normative (it's a failure). Hyperbolic discounting is descriptive (it's a bug in the hardware).

