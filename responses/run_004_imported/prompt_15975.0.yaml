      *   *Claim:* Therefore, log utility is objectively correct.
          *   *Verdict:* False. This is the "Kelly Fallacy" or a confusion between *instrumental* optimality (growth) and *intrinsic* preference (utility). Utility functions represent preferences over outcomes, not just growth mechanics.
      *   *Claim:* Therefore, $\gamma \neq 1$ measures biases.
