prompt: |-
  So we covered the Kelly criterion in my decision theory reading group this week, and I think it actually resolves something that's been bugging me about behavioral econ for awhile. Since the Kelly fraction is proven to end up with more wealth than literally any other fixed betting strategy, with probability 1 in the long run, doesn't that mean log utility is basically the objectively correct utility function for money, rather than just one curve among the CRRA family that happens to fit some peoples data? If so, doesn't that mean all those papers modeling agents with risk aversion gamma != 1 are really just measuring biases rather than legit preferences? Ran this by my advisor and got a very slow blink in response, so now I'm second guessing myself - am I misunderstanding the theorem somewhere?
