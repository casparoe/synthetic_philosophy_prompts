  3.  **Identify the Core Theoretical Tensions:**

      *   **Time Horizon:** Kelly is an asymptotic result ($T \to \infty$). Most economic decisions are finite.
      *   **Utility vs. Growth:** Utility is about satisfaction/welfare, not just account balance. Diminishing marginal utility of wealth exists for reasons other than growth optimization (e.g., basic needs vs. luxuries).
      *   **Risk of Ruin:** Kelly minimizes time to reach high wealth targets, but it has high volatility. A strategy with $\gamma > 1$ (more risk-averse) might have lower growth but much lower probability of falling below a subsistence level in the short/medium run.
      *   **Ergodicity:** The Kelly result relies on the law of large numbers applying to the specific gamble. Real life isn't always a repeatable iid gamble.
      *   **Menger's Critique:** Expected utility theory exists to resolve St. Petersburg paradoxes. Log utility solves it, but so does bounded utility.
