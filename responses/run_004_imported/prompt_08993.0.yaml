      *   **Saul Kripke (Actualism + Transworld Identity):**
          *   Possible worlds are abstract states of affairs (not concrete places).
          *   You can exist in multiple worlds (numerical identity).
          *   "You" in another world is *you*, just with different properties.
          *   Implication: That other guy *is* you, living a different life.
      *   **The Humphrey Objection:** Kripke argues Lewis's view makes modal claims trivial. If Humphrey loses, saying "Humphrey could have won" refers to a counterpart winning. Humphrey doesn't care about his counterpart.

