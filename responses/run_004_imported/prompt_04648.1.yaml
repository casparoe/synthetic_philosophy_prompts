          *   In LI, the "probabilities" aren't even trying to be coherent in the Boolean algebra sense at finite $n$ (e.g., $P(\phi) + P(\neg \phi)$ might not be 1, though LI enforces this eventually).
          *   *The Killer Point:* The "Bounded Rationality" defense works for *computational limits on updating*, but LI changes the *definition of truth conditions* for the probabilities. In standard Bayesianism, $P(A)$ is about the world. In LI, $P(\phi)$ is about the *market's computational trajectory*. That's a category shift Max is glossing over.
