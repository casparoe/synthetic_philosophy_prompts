answer: |-
  The ATM hummed, a sterile electric buzz against the ringing silence of the desert town. Dust coated their eyelashes. Elena stared at the screen, her finger hovering over the *Cancel* button. Marcus stood beside her, card already inserted, waiting for the prompt.

  **Elena:** Don't do it.

  **Marcus:** The prompt is asking for an amount.

  **Elena:** It's asking for a sacrifice. Look at the causal structure, Marcus. The rescue is in the past. The driver is gone. My pressing *Confirm* sends money to a stranger; it does not send a signal back to the desert. It cannot causally influence the prediction that already occurred. Paying is literally throwing away utility.

  **Marcus:** And keeping it is throwing away your integrity as a rational agent. You're treating yourself as a series of temporal slices. I am treating myself as a single entity extended through time.

  **Elena:** I'm treating myself as someone who lives in the present. This is McClennen's "sophisticated" choice. I know my future self will defect, so my past self should have anticipated that. But here's the miracle: the driver *didn't* anticipate it correctly, or he took a risk. Either way, I'm here. I have the money. Why should I pay for a cause that is already dead?

  **Marcus:** Because the cause isn't dead. The policy is alive. If you don't pay, you prove the driver wrong, yes, but you also prove that you are the *kind* of person who cannot be rescued in this scenario. You're surviving on a glitch.

  **Elena:** I'm surviving on the fact that his prediction was based on evidence available *then*, not on the metaphysical truth of my choice *now*. He saw my dust-covered clothes, my desperation, maybe my psychological profile. He predicted "Payment." But prediction isn't causation. His belief didn't make me pay; it just made him drive. Now that the driving is done, the belief is inert. I'm severing the link.

  **Marcus:** You can't sever the link without severing your own rationality. Parfit called this "rational irrationality." If you are rational, you adopt a policy. If you adopt a policy, you follow it through. If you abandon it the moment the causal leverage disappears, you never truly had the policy. You just had an intention.

  **Elena:** Intentions are cheap. Utility is real. But let's press your view to the breaking point, Marcus. You say you must pay to honor the resolution. But what *mechanism* binds you? Short of wishful thinking. You can't change the past. You can't reach back into the desert and force the driver to pick you up. He already did. So when you press *Confirm*, what work are you doing? Are you pretending your payment causes the rescue?

  **Marcus:** No. I'm acknowledging that my payment *constitutes* the rescue.

  **Elena:** Constitutes? It's a separate event.

  **Marcus:** Not if agency is holistic. Gauthier got this right. Constrained maximization isn't about calculating each node in isolation. It's about being a co-operator. If I defect now, I reveal that I was never a co-operator. I reveal that my "resolution" in the desert was a lie I told myself to get in the car. If it was a lie then, then the driver's prediction was actually false, and my survival was a statistical accident. By paying, I make the driver's prediction true. I validate the causal chain that saved my life.

  **Elena:** That's magical thinking. You're saying your action *now* makes a proposition about the *past* true. That the truth value of "Marcus will pay" wasn't fixed until Marcus paid.

  **Marcus:** Isn't it? Consider the Newcomb problem. You take one box because you know the predictor is reliable. Here, the desert is the first box. The town is the second. If you two-box, you show you were never a one-boxer. You're trying to have it both ways. You want the benefit of the disposition without the cost of the action.

  **Elena:** I want the benefit of the *driver's* disposition. He was disposed to save lives based on his model of me. His model was imperfect. I am exploiting that imperfection. That's not irrational; that's winning. But you—you're binding your present self to your past self's whims. Why does Past Marcus have authority over Present Marcus? Present Marcus is the one feeling the thirst, the relief, the loss of cash. Past Marcus is a ghost. Why should I obey a ghost?

  **Marcus:** Because if you don't, you haunt yourself. You create a dynamic inconsistency. If you know that Present Marcus will always betray Past Marcus when the causal pressure lifts, then Past Marcus can never form effective plans. You become paralyzed. You become the Sophisticated chooser who knows she will defect, so she knows she won't be rescued, so she dies in the sand.

  **Elena:** But I *didn't* die in the sand. That's the data point. I'm standing here. Your theory says I should be dead. A truly sophisticated agent knows she can't bind her future self, so she knows she won't be picked up. I beat the game.

  **Marcus:** You beat the game by luck. If the driver was a perfect predictor—truly perfect, like Parfit's ideal—he wouldn't have stopped for you. He would have seen this exact moment. He would have seen you hovering over *Cancel*.

  **Elena:** Then he wouldn't be a predictor of my *actions*; he'd be a predictor of my *types*. And maybe I am the type who pays, except when the cost outweighs the benefit.

  **Marcus:** Then you aren't the type who gets picked up in a Hitchhiker case! The definition of the case is that the driver predicts *payment*. If you are the type who defects here, he predicts defection. You are arguing that you are a Defector who was mistaken for a Co-operator.

  **Elena:** I'm arguing that the prediction is a fixed fact of history, like a fossil. It exists. It says "She will pay." But I have free will in this moment. I can make the fossil a lie.

  **Marcus:** And if you make the fossil a lie, you prove the driver was irrational to pick you up. But we assume the driver is rational. So if the driver is rational, and he picked you up, you *must* pay. Otherwise, the whole scenario collapses into incoherence. You're living in a world that shouldn't exist if you press that button.

  **Elena:** The world exists, Marcus. Look at it. The cactus, the heat, the ATM. It's real. The only thing that's incoherent is your idea that I owe a debt to a counterfactual. I owe nothing to the version of me that stays in the desert. She doesn't exist.

  **Marcus:** She exists in the structure of your rationality. If you kill her, you kill your capacity to plan. Next time you're in the desert, you'll know you won't pay. So no one will stop.

  **Elena:** Then next time I'll bring a gun. Or I'll learn to drive. I won't bind myself to a losing strategy.

  **Marcus:** It's not a losing strategy. It's the only strategy that allows for cooperative solutions to Prisoner's Dilemmas over time. You're reducing rationality to local maximization.

  **Elena:** And you're inflating rationality into a religion of consistency.

  *The ATM beeped. Marcus's screen asked for a PIN. Elena's screen timed out, returning to the bank logo.*

  **Marcus:** You have to withdraw something. Even if it's just to prove you can.

  **Elena:** I'm withdrawing nothing. I'm keeping the cash in my account. It's the only move that increases my balance.

  **Marcus:** And decreases your standing as an agent.

  **Elena:** An agent is just a locus of decision. I decided.

  **Marcus:** You decided to cut off your own past.

  **Elena:** I decided to stop bleeding.

  *Marcus typed his PIN. The machine whirred, processing. Elena watched the cash slot, then looked at Marcus.*

  **Elena:** If you pay, and I don't, and we both walk out of here alive... who was rational?

  **Marcus:** If we both walk out, it means the driver was wrong about one of us. If it was me, I lose money. If it was you, you lose your future.

  **Elena:** I'll take the money. You take the future.

  **Marcus:** You can't spend a future you can't secure.

  *The machine dispensed Marcus's cash. He took it, the paper crisp and loud in the quiet room. He held it out toward the slot on his side, then paused, looking at Elena.*

  **Marcus:** The driver isn't the only predictor, Elena. I predicted you'd say this.

  **Elena:** Did you? Then why are you surprised I'm not paying?

  **Marcus:** I'm not surprised. I'm disappointed. There's a difference.

  **Elena:** Disappointment is an emotion. It has no causal power.

  **Marcus:** Neither does money, once you're dead.

  *Elena turned from the machine, pushing the door open. The heat hit them instantly, a wall of dry air.*

  **Elena:** I'm not dead. I'm rich.

  **Marcus:** You're stranded.

  **Elena:** I have a car key in my pocket. I stole it while you were typing your PIN.

  *She jingled the keys. Marcus looked at the cash in his hand, then at the door.*

  **Marcus:** You predicted the driver. I predicted you. Who's the better predictor?

  **Elena:** The one who drives away.

  **Marcus:** The one who gets picked up next time.

  *Elena stepped out into the glare. Marcus followed, tucking the cash into his dusty shirt. Neither looked at the other as they walked toward the parking lot, the question of who was truly rational hanging in the heat, unresolved, waiting for the next desert.*
