answer: |-
  Here is an argument constructed from the perspective of a pragmatic mercantilist, using Hume's own analysis in "Of Money" to undermine the policy conclusions of "Of the Balance of Trade."

  ***

  ### The Case for Permanent Disequilibrium: A Mercantilist Reply to Hume

  David Hume is celebrated for delivering the *coup de grâce* to mercantilism in "Of the Balance of Trade." By outlining the price-specie-flow mechanism, he ostensibly proved that attempting to accumulate specie is futile: any surplus will inevitably raise domestic prices, worsen the trade balance, and drain the money back out to neighbors. However, this long-run equilibrium argument collapses when weighed against the short-run dynamics Hume himself admits in "Of Money." A sophisticated mercantilist need not reject Hume's mechanics; rather, they should embrace the tension between the two essays to argue that **national policy should aim not for equilibrium, but for the perpetual management of disequilibrium.**

  Here is how a mercantilist can use Hume's "Of Money" to defend the very accumulation policies "Of the Balance of Trade" seeks to demolish.

  #### 1. The "Interval" is Where Politics Happens
  In "Of Money," Hume concedes that money is not neutral in the transition period. He writes that when new money enters the economy, it does not raise all prices instantly. It first enriches merchants and manufacturers, who then hire more workers and increase production *before* wages and commodity prices fully adjust. Hume calls this a "violent" alteration, but admits it "encreases industry."

  The mercantilist reply is simple: **The "interval" is the only timeframe that matters for statecraft.** Hume's refutation in "Of the Balance of Trade" relies on a theoretical long-run equilibrium where prices have fully adjusted and specie has flowed out. But how long does this adjustment take? Decades? A generation? If a nation can maintain an inflow of specie for twenty years, it enjoys twenty years of stimulated industry, lower real wages (since wages lag behind prices), and higher profits for reinvestment.

  Even if the price-specie-flow mechanism eventually drains the gold, the *real* gains accumulated during the interval remain. The ships built, the technologies developed, and the skills learned by the workforce during the boom do not vanish when the specie leaves. Therefore, the futility of *permanent* accumulation does not imply the futility of *temporary* accumulation. If the goal is national power, the mercantilist should pursue specie accumulation aggressively, harvest the real economic growth during Hume's "interval," and accept the eventual outflow as the cost of doing business.

  #### 2. Turning the Leak into a Pump
  Hume argues in "Of the Balance of Trade" that a nation cannot *hold* an artificially inflated money supply. He is likely correct that a static stock of money will eventually dissipate through trade deficits. However, he does not prove that a nation cannot *replenish* that stock.

  A mercantilist can use Hume's mechanism from "Of Money" to argue for a policy of **continuous inflow.** If the economic stimulus comes from the *flow* of new money reaching merchants before prices rise, then the state's job is to ensure that flow never stops. When the price-specie-flow mechanism begins to drain the surplus (as Hume predicts), the state should intervene with tariffs, subsidies, or colonial extraction to bring fresh specie in.

  By doing so, the nation keeps its economy permanently in the "short run" that Hume describes in "Of Money." The economy never reaches the long-run equilibrium of "Of the Balance of Trade" because policy constantly resets the clock. Hume's mechanism becomes not a refutation of mercantilism, but an instruction manual for how to manage it: keep the money moving, keep the merchants ahead of the wage earners, and keep the industry quickened.

  #### 3. The Distributional Advantage of Inflation
  In "Of Money," Hume notes that during the expansion phase, prices rise before wages. He views this with some ambivalence, but a mercantilist sees a strategic advantage. This lag effectively redistributes income from laborers to merchants and manufacturers.

  Why is this desirable for the state? Because merchants and manufacturers are the agents of investment and export capacity. By allowing the money supply to grow (even temporarily), the state effectively subsidizes the capitalist class at the expense of real wages. This increases the profit margin available for reinvestment in industry and trade.

  Hume's "Balance of Trade" essay assumes that the loss of specie is a neutral event. But if the *process* of gaining and losing specie structurally alters the class dynamics in favor of the productive merchant class, then the cycle itself is beneficial. The mercantilist can argue that even if the specie leaves, the *concentration of capital* it facilitated remains. The nation is left with a stronger industrial base, even if the money stock returns to equilibrium.

  #### 4. Equilibrium is Stagnation
  Finally, the mercantilist must challenge the normative assumption underlying Hume's "Of the Balance of Trade." Hume treats the equilibrium point—where money is distributed according to the level of economic activity—as the natural and desirable state. But in a world of competing nation-states, equilibrium is vulnerability.

  If Nation A follows Hume's advice and allows its money supply to find its "natural level," while Nation B aggressively accumulates specie to stimulate industry via Hume's "Of Money" mechanism, Nation B will outproduce Nation A during the interval. In a geopolitical context, relative power matters more than absolute equilibrium.

  Hume's short-run mechanism proves that money acts as a "oil" to the "wheels of trade." The mercantilist argues that you do not stop oiling the wheels just because some oil will eventually leak out. You keep pouring it in to ensure your wheels turn faster than your rival's. To accept Hume's long-run neutrality is to accept disarmament in the face of competitors who are willing to exploit the short-run non-neutrality.

  ### Conclusion
  Hume believed he had reconciled the tension between the two essays by subordinating the short-run effects to the long-run inevitability of the price-specie-flow mechanism. But for the policymaker, the causality runs the other way. The long run is merely a sequence of short runs.

  By admitting in "Of Money" that an increasing money supply genuinely stimulates industry and employment before prices adjust, Hume handed the mercantilist the very tool needed to justify protectionism and accumulation. The mercantilist does not need to prove that specie can be held forever; they only need to prove that holding it *for a while* makes the nation richer and stronger. Hume's "refutation" describes where the water ends up; the mercantilist, armed with "Of Money," is interested in the power of the current while it flows.
