  *(Self-Correction Note during final review)*: Make sure the Frequentist doesn't just say "p-hacking is bad." They need to explain *why* optional stopping is p-hacking even if the test at each step is valid. The Bayesian needs to explain why the Likelihood Principle forbids caring about the stopping rule.

