answer: |-
  The hotel bar was dim, the kind of place where the ice clinks sound louder than the conversations. I sat at the edge of their booth, nursing a soda water. To my left was Elena (Frequentist), who had chaired the morning session on reproducibility. To my right was Julian (Bayesian), who had given the keynote challenging the very concept of error rates. They were both tired, but the argument was fresh.

  **Elena:** You smiled when I talked about alpha inflation, Julian. I saw it.

  **Julian:** I smiled because you're fighting a ghost, Elena. You're trying to control the behavior of the experimenter by regulating their sampling plan. But the data don't know why you stopped collecting them. They just *are*.

  **Elena:** The data don't know, but the *inference* does. If I flip a coin until I get ten heads, and you flip a coin ten times and get ten heads, we have the same dataset. But if I tell you I stopped *because* I got ten heads, you have to assess the probability of that happening by chance differently. If you ignore the stopping rule, you're ignoring the selection bias inherent in the procedure.

  **Julian:** That's the Likelihood Principle, Elena. And you pay it lip service until it inconveniences your p-values. If the likelihood functions are proportional—and they are in that coin flip scenario—then the evidence is identical. The stopping rule is a property of the experimenter, not the parameter. Why should my belief about the coin's bias depend on what I *would have done* if the data had been different?

  **Elena:** Because science isn't just about your belief. It's about the long-run error rate of the community. If you allow optional stopping without penalty, you invite the "gambler's ruin." I can guarantee a significant result eventually if I keep peeking and never stop. If everyone does that, 5% of the literature isn't false positives anymore. It's fifty percent. You're trading individual coherence for collective chaos.

  **Julian:** And you're trading evidential meaning for hypothetical frequencies. You're telling me that if I see a massive effect size early, I should *ignore* it? I should keep spending grant money on subjects because my "alpha" hasn't been spent yet? That's not rigor; that's inefficiency. In a Bayesian framework, if the posterior probability crosses a threshold, I stop. The Bayes Factor accounts for the evidence. If I stop early, it's because the data screamed at me. Why punish the data for screaming?

  **Elena:** I'm not punishing the data. I'm punishing the *test*. A p-value is a statement about the test procedure, not just the data. When you peek, you change the procedure. You've effectively run multiple tests. If you don't correct for those multiple looks—Bonferroni, alpha-spending functions—you are lying about your false positive rate. You claim $\alpha = 0.05$, but your actual operating characteristic is $\alpha = 0.20$. That is a lie.

  **Julian:** It's only a lie if you think the goal is to control a long-run frequency of rejections. If the goal is to update credence in a hypothesis, I haven't lied. My posterior is exactly what it should be given the data I have. The problem is that you frequentists are obsessed with what *could* have happened in parallel universes where I kept sampling. I care about the universe I'm in.

  **Elena:** Those parallel universes matter because we don't know which universe we're in when we read a paper! When I read a study in *Nature*, I don't know if you stopped because the effect was real or because you peeked twenty times and got lucky. Your Bayesian posterior doesn't tell me that. It assumes your prior was honest and your model is true. But if you used optional stopping to hunt for significance, you've likely overfitted the noise. Your posterior will be overconfident.

  **Julian:** Then the solution is better priors, not rigid sampling plans. If I use a skeptical prior, it takes more data to move me. If I stop early with a skeptical prior, the evidence *must* be strong. You're assuming I'm using a flat prior and trying to game the system. But that's a prior problem, not a stopping problem.

  **Elena:** You're assuming everyone is a rational Bayesian agent with well-calibrated priors. Look at the replication crisis. Everyone *thinks* their prior is reasonable. But when you add optional stopping to vague priors, you get the same explosion of false positives you get with p-hacking. You just hide it behind the math. At least with my framework, I can tell you exactly how much you've inflated your error rate. I can calculate the cost of your peeking. Can you?

  **Julian:** I can tell you that your cost calculation forces researchers to hide their peeking. They peek, they see $p=0.06$, they run five more subjects, they get $p=0.04$, and they report it as a fixed sample size. Your rigidity creates the dishonesty you claim to fight. If I allow optional stopping, the researcher admits, "I stopped when I was convinced." It's transparent.

  **Elena:** Transparency doesn't fix the calibration. If I admit I peeked, I still have to adjust my alpha. If I don't, the literature is polluted. You want to let people stop when they are "convinced." But conviction is subjective. Error rates are objective.

  **Julian:** Error rates are objective properties of a procedure that no one actually follows. You're defending a fantasy of pre-registered perfection in a world of exploratory biology.

  **Elena:** And you're defending a subjective coherence that allows two people with the same data to reach different conclusions based on when they *decided* to stop looking.

  **Julian:** No, based on what they *believed* before they started looking.

  **Elena:** Which is exactly why we can't build a cumulative science on it.

  *They both took a drink. The silence hung for a moment, heavy with the weight of thirty years of my own lab notebooks.*

  **Elena:** (Turning to me) You want to know what you should have done? You peeked. You saw a trend. You ran more rats. You published.

  **Me:** I thought I was being efficient.

  **Elena:** You were being uncalibrated. Every time you peeked without adjusting your significance threshold, you turned your 0.05 claim into a 0.15 or 0.20 claim. You didn't just "check" the data; you selected for noise. You should have pre-registered your sample size. If you had to peek, you should have used a sequential analysis design with alpha-spending functions. You treated the p-value as a measure of evidence, but it's a measure of surprise under a null hypothesis *given a specific sampling plan*. You changed the plan mid-stream. You owe the literature a correction, or at least an admission that your p-values are nominal, not actual.

  **Julian:** (Shaking his head) Don't listen to her. If you pre-registered a sample size of 100, and at 50 you saw a massive effect, she wants you to keep going. That's unethical waste of animals.

  **Me:** So what should I have done?

  **Julian:** You should have peeked. But you shouldn't have reported a p-value. You should have reported a Bayes Factor. If you peek at $N=50$ and the Bayes Factor is 20 in favor of the alternative, you stop. The evidence is strong. The stopping rule is irrelevant to the strength of that evidence. Your mistake wasn't peeking; it was trying to translate your Bayesian intuition—"this looks real"—into a Frequentist currency—"p < 0.05"—without paying the exchange rate. You wanted the flexibility of a Bayesian with the authority of a Frequentist. That's the fraud.

  **Elena:** It's not fraud to demand error control.

  **Julian:** It's fraud to claim a p-value measures evidence when you've violated the assumptions required to calculate it.

  **Elena:** (To me) If you want to stay in my world: Pre-register. If you peek, adjust. Admit your error rate is higher than you said.

  **Julian:** (To me) If you want to stay in the real world: Peek all you want. But drop the p-values. Report the effect size, the interval, and the Bayes Factor. Let the reader decide if their prior moves as much as yours did.

  **Elena:** The reader can't decide that. They need to know the false positive rate.

  **Julian:** They need to know the evidence. The rest is housekeeping.

  *They clinked glasses, neither conceding, and left me with the bill and the sinking feeling that I had been speaking two incompatible languages for thirty-five years without knowing it.*
