      *   **Narrator:** Retired experimental biologist, observant, looking for closure/clarity.

  3.  **Key Arguments to Include:**
      *   *Frequentist:* Optional stopping inflates Type I error. If you peek $k$ times, your $\alpha$ isn't 0.05 anymore. It undermines the calibration of the scientific literature.
      *   *Bayesian:* The Likelihood Principle. The evidence in the data is the same regardless of when you stopped. Stopping rules are irrelevant to inference. Priors handle the skepticism.
      *   *Counter-arguments:*
          *   Frequentist to Bayesian: What about subjective priors? What if everyone uses optional stopping and claims "Bayesian evidence"? Doesn't that flood the zone with false claims?
