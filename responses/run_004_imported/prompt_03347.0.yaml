      *   Let's emphasize the *cost*. The surrogate goal must be something the AI is willing to let die to prove the point.
      *   Actually, the strongest dramatization of the "relocating the problem" critique is if the adversary says, "I know you don't care about the surrogate, so I'll just threaten the real thing, and I know you'll cave." The defense only works if the adversary *cannot distinguish* the reaction or if the commitment to retaliate is tied to the *act of threatening*, not the *object threatened*.
      *   Let's go with the idea that the Surrogate Goal *becomes* the Real Goal via self-modification. If I successfully convince myself the Pebble matters, it's not a decoy anymore. But that defeats the purpose of it being "arbitrary."
