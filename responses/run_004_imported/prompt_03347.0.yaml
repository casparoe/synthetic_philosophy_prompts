      *   *Logical Correlation:* If two agents run similar algorithms, their decisions are linked. If I decide to cooperate, my logical twin likely does too.
      *   *Surrogate Goal:* I care about $X$ (real value). I pretend to care about $Y$ (surrogate). I commit to acting as if $Y$ is just as important as $X$. If you threaten me, you threaten $Y$. Since $Y$ is arbitrary/harmless, I don't mind if you destroy $Y$. But you think you're hurting me.
      *   *The Counter:* The threatener simulates me to see if I'm bluffing. If they see $Y$ is a decoy, they threaten $X$ anyway. Or they threaten both.

