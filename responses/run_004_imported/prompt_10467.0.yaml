prompt: |-
  Epistemic status: genuinely confused, not just being edgy for the sake of it. I've been reading LW and ACX for like a decade at this point so figured you might have a sharper take than my group chat.

  I got really into jhana meditation this year, the concentration-absorption states where you can generate genuinely intense bliss just by sitting and focusing correctly, no drugs or external input needed. I can drop into a low jhana pretty reliably now and honestly it beats good food, good sex, finishing a hard project, all of it combined. Best feeling I've ever had, and it's free and repeatable on demand.

  Here's the part that's bugging me: I've read alot of accounts of people who get really good at this and basically stop doing much else, because why grind through a mediocre day when you've got a lever that reliably produces the best feeling a human nervous system can generate? A couple of meditation teachers explicitly warn against this as a trap.

  Half of me thinks: if it's literally the most pleasurable thing on offer and nobody else gets hurt, the objection is just hedonic snobbery dressed up as concern. The other half feels like someone who retreated into their own head like that would be losing something real, i just can't articulate what, or why it'd be bad for THEM specifically rather than just bad for the people who depended on them. Is there an actual principled argument here, or am I just being squeamish about pleasure that doesn't feel "earned"?
