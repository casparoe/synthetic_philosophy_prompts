prompt: |-
  I'm a software engineer who runs a small podcast on AI safety for other engineers, and next month's guest is a researcher known for arguing that the four classic embedded-agency problems -- embedded world-models, decision theory, robust delegation, and subsystem alignment -- are really one problem wearing different costumes: no agent can hold a complete, consistent model of a world that contains that very agent. Draft eight to ten interview questions that go beyond having her restate that framing: I want at least one question on whether the unifying diagnosis is doing real explanatory work for subsystem alignment and mesa-optimization, where the trouble looks more like optimization pressure than self-reference; one on whether her preferred response to the Löbian obstacle to self-trust in tiling agents actually escapes the obstacle or just relocates it a meta-level up; and one on whether any of this apparatus yields concrete guidance for today's deep-learning-based systems, or remains a result about idealized, logic-based agents -- and for each, a follow-up keyed to the answer she's most likely to give.
