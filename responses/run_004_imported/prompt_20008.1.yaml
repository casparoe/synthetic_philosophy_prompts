prompt: |-
  so this summer i've been doing this proof-based math thing through a math circle that a college student named Austin runs (my school doesn't offer anything past precalc so this is pretty much the only real math i get outside of youtube). this week's assignment was to state Zorn's Lemma and use it to prove that every proper ideal of a commutative ring with 1 is contained in a maximal ideal, and then Austin had us all swap write-ups and grade each other using a rubric he gave out, before he does the actual grading tomorrow. i got my friend Malik's proof, and i wanna be fair to him (he's grading mine too lol so no pressure) but honestly i'm still pretty new to this stuff and don't 100% trust myself to catch everything on my own, which is why i wanted a second opinion before i hand my grading back to him.

  here's the question exactly as Austin gave it: "State Zorn's Lemma. Then use it to prove that every proper ideal I of a commutative ring R with 1 is contained in a maximal ideal of R."

  and here's Malik's answer, copied word for word:

  "Zorn's Lemma: if P is a nonempty poset such that every subset of P has an upper bound in P, then P has a maximal element.

  Let I be a proper ideal of R. Let S = {J : J is a proper ideal of R and I ⊆ J}, ordered by inclusion. S is nonempty since I ∈ S.

  Let C be a chain in S, and let K be the union of all J in C. I claim K is in S.

  First, K is an ideal: if a, b ∈ K, then a is in some J1 in C and b is in some J2 in C. Since C is a chain, J1 and J2 are comparable, so say J1 ⊆ J2; then a, b ∈ J2, so a − b ∈ J2 ⊆ K. Also, if r ∈ R and a ∈ K, then a ∈ J for some J ∈ C, and ra ∈ J ⊆ K since J is an ideal. So K is an ideal.

  Clearly I ⊆ K, since I ⊆ J for every J ∈ C (every J in S contains I).

  K is proper: since C is a chain of proper ideals increasing under inclusion, their union can't suddenly become all of R, so K ≠ R.

  So K ∈ S and K is an upper bound for C. Since every chain in S has an upper bound in S, Zorn's Lemma applies and gives a maximal element M of S.

  Now I claim M is a maximal ideal of R. Suppose it isn't: then there's an ideal N with M ⊊ N ⊊ R. Since M ⊆ N we get I ⊆ N, and N ≠ R means N is proper, so N ∈ S. But N properly contains M, which contradicts M being maximal in S. So M is a maximal ideal of R containing I."

  the rubric Austin gave has 6 categories that add up to 20 points total, but he never actually said how many points each category is worth so you'll kind of have to use your best judgement there: correct statement of Zorn's Lemma, correctly defining S and showing its nonempty, showing the union of a chain is an ideal, showing the union is proper, correctly invoking Zorn's Lemma, and showing the maximal element of S is actually a maximal ideal of R. could you go category by category through Malik's proof and tell me how many points out of 20 you'd give the whole thing (plus roughly what letter grade that'd translate to), with your reasoning laid out as a JSON object — one key per category, with points earned out of whatever you decide that category is worth, and a short comment explaining why? i'd honestly rather over-explain it to Malik than just hand him back a number with no reasoning, so the specific comments matter to me way more than the overall score does.
