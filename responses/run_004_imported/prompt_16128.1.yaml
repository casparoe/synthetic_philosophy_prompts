prompt: |-
  My mother is retiring this spring after thirty years leading our county's volunteer mountain rescue team, and I've been asked to give the toast at her retirement dinner. The story everyone still tells is from her second year on the job: a storm was going to close the only safe route down within the hour, her team could reach only one of two stranded groups in time, two climbers on one ridge and seven on another, and with nothing else to go on she had the team draw lots rather than simply send help to the seven. It split the volunteer network for years; she has never said much about it beyond that the numbers weren't the kind of thing that should settle it on their own. Reading on my own since then, I found out there's a real philosophical debate behind what she did: Taurek's paper "Should the Numbers Count?" argues against simply saving the greater number, while Parfit's direct reply, "Innumerate Ethics," argues the numbers should settle it after all. Half the room that night will be rescue volunteers who still argue about that call; the other half is family who just want to raise a glass to her. Write the five-minute toast: it has to actually take a side on whether she got that call right, using the real argument rather than a vague line about every life counting equally, and it still has to work as a toast, not a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for the mother after 30 years leading a volunteer mountain rescue team.
      *   **Speaker:** Her child.
      *   **Key Story:** Year 2, storm incoming, two stranded groups (2 climbers vs. 7 climbers), only time to save one. She chose to draw lots instead of saving the seven.
      *   **Conflict:** This decision split the volunteer network for years.
      *   **Philosophical Context:** John Taurek ("Should the Numbers Count?") vs. Derek Parfit ("Innumerate Ethics"). Taurek argues numbers shouldn't dictate moral obligation (each individual suffers 100% loss); Parfit argues numbers *do* matter (saving more minimizes total loss).
      *   **Audience:** 50% rescue volunteers (who know/argue about the call), 50% family (who just want to celebrate).
      *   **Constraint 1:** Must take a side on whether she was right (no vague "every life matters" hedging).
      *   **Constraint 2:** Must use the real philosophical argument (Taurek vs. Parfit logic), not just emotion.
      *   **Constraint 3:** Must work as a toast (warm, celebratory, appropriate length ~5 mins, not a dry lecture).

  2.  **Determine the Stance:**
      *   *Option A: She was wrong (Parfit).* Saving 7 is better than 2. This risks alienating the mother and the family, and potentially insulting her judgment at her own retirement. It feels like a critique.
      *   *Option B: She was right (Taurek).* The moral weight isn't additive. Each person matters infinitely. Drawing lots respects the equal claim of each individual. This honors her courage and moral intuition. It frames the controversy as a sign of her depth, not a mistake.
      *   *Decision:* Option B is the only viable choice for a retirement toast. It validates her legacy while addressing the elephant in the room intellectually.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion, the 30 years, and the mix of people in the room. Set a warm tone.
      *   **The Elephant in the Room:** Bring up the "Year 2" story immediately but gently. Acknowledge the division it caused.
      *   **The Philosophical Core (The "Meat"):** Explain *why* she did it without using jargon like "Taurek" or "Parfit" (too academic for a toast). Instead, translate the concepts into human terms.
          *   *Parfit side:* The math says 7 > 2.
          *   *Taurek side:* The human says 1 life = 1 universe. To the two on the ridge, their loss is total.
      *   **Taking the Side:** Argue that in rescue, you aren't an algorithm. You are a guardian of individual dignity. She refused to turn people into statistics.
      *   **Connecting to Legacy:** How did this decision shape the next 28 years? It showed she wouldn't take the easy path. She carried the weight.
      *   **Closing:** Raise a glass. Honor the service.

  4.  **Refining the Tone:**
      *   *Challenge:* How to make moral philosophy sound like a heartfelt tribute?
      *   *Solution:* Use metaphors. "Arithmetic vs. Humanity." "Ledgers vs. Lives." Keep sentences rhythmic. Ensure the volunteers feel respected (their disagreement is valid) but the mother's choice is elevated.
      *   *Timing:* A 5-minute toast is roughly 600-800 words spoken at a moderate pace.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Mom worked hard. 30 years. You all know the story about the 2 vs 7 climbers. Some think she should have saved the 7. I think she was right. There's this philosopher Taurek who says numbers don't count. Each person loses everything if they die. Mom knew that. She didn't want to be a calculator. She wanted to be fair. That's why she led for 30 years. She made hard choices. Let's drink to her.

      *Critique 1:* Too dry. Needs more emotion. Needs to explicitly address the "side taking" constraint more robustly. Needs to feel like a speech, not a summary.

  6.  **Drafting - Iteration 2 (Adding Flesh & Philosophy):**
      Welcome. Look around. Half rescuers, half family. We all know the legend. The storm. The two ridges. The lots. For years people said she failed the math. 7 is bigger than 2. But I'm here to say the math was the wrong tool. If you save the 7, you tell the 2 they don't matter. Mom refused to say that. She treated every life as infinite, not countable. That's hard. That's why the argument lasted. But it's why she's a hero. To Mom.

      *Critique 2:* Better. But needs to be more nuanced to satisfy the "real argument" constraint. It needs to show understanding of *why* the other side thinks numbers count, then refute it gracefully.

  7.  **Final Polish (incorporating the Taurek logic without naming him):**
      *   Focus on the concept of "loss." To the individual, death is 100% loss. Aggregating loss is a category error.
      *   Acknowledge the volunteers' pain (they wanted to save more).
      *   End on the 30-year horizon, not just that one night.

  8.  **Writing the Speech (incorporating the above):**
      *   *Greeting:* Warm, inclusive.
      *   *The Story:* Don't shy away.
      *   *The Argument:* "Arithmetic of rescue" vs. "Ethics of the individual."
      *   *The Verdict:* She was right because she protected the *principle* of equal worth.
      *   *The Toast:* Cheers to the next chapter.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* academic. No footnotes. Keep the language accessible but intellectually honest. Ensure the "taking a side" is clear: "She made the right call."

  9.  **Final Review against constraints:**
      *   5 minutes? (Word count looks good, approx 750-850 words).
      *   Take a side? (Yes, argues for the "lots" decision).
      *   Real argument? (Yes, utilizes the non-aggregation of harm argument).
      *   Toast format? (Yes, starts with greeting, ends with glass).

  10. **Final Polish:** Check rhythm and flow. (The resulting speech in the main response follows this structure.)
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name], and I have the distinct privilege of being the reason my mother had to learn how to sleep through the night again after thirty years of pagers going off at 3:00 AM.

  Looking around this room, I see two distinct tribes. On one side, I see my family—the people who worried every time the phone rang. On the other, I see the volunteers—the people who answered when it did. And I know that for many of you in the rescue gear, this night isn't just about celebration. It's about a story.

  It's the story from her second year. The storm. The two ridges. The choice between two climbers and seven. And the decision to draw lots rather than send the team to the larger group.

  I know this decision fractured this network for a decade. I know the argument: *Seven is greater than two. To save the greater number is the only logical choice.* It is clean. It is defensible. It is arithmetic.

  But I am standing here tonight to say that my mother made the right call. And I'm not saying that just because she's my mom. I'm saying it because in that moment, she understood something about rescue that pure arithmetic misses.

  There is a philosophical argument that says we shouldn't simply add up lives like coins in a jar. Because to the person on the ridge, their life isn't a fraction. It isn't one-seventh of a group. It is their entire universe. If they are lost, they lose one hundred percent of their future. The loss is total.

  When my mother refused to let the numbers settle it, she wasn't being indecisive. She was refusing to treat the two climbers on the first ridge as expendable. She recognized that if you make the numbers the only thing that matters, you stop seeing individuals and start seeing statistics. You start saying that some people matter less because there are fewer of them.

  The volunteers who argued with her weren't bad people. They wanted to minimize tragedy. That is a noble instinct. But my mother's instinct was deeper. She understood that the moral weight of a life doesn't aggregate. You cannot balance seven souls against two and find the heavier side. There is no scale big enough for that.

  By drawing lots, she acknowledged a terrifying truth: that in the face of the mountain, every single person has an equal claim on survival. She forced chance to be the decider because chance is blind, but leadership must not be. If she had sent the team to the seven simply because there were seven, she would have signed the death warrants of the two with a pen. By drawing lots, she told the two: *You matter just as much as the seven.*

  That is a heavy burden to carry. It is easier to follow the math. It is much harder to look into the face of the minority and say, *I will not trade you.*

  That decision defined her thirty years. It meant she never took the easy path. It meant she carried the weight of the "what ifs" so that her team didn't have to. She protected the principle that every call for help is a singular emergency, not a data point.

  So, to the volunteers: I know the debate hurt. But look at the record. Look at the culture she built. A culture where you don't leave anyone behind because the math says you can. A culture where the individual is never swallowed by the sum.

  Mom, you taught us that courage isn't just running into the storm. It's standing firm when the world wants you to be a calculator, and choosing instead to be a guardian. You taught us that numbers count, but they don't decide.

  Please raise your glasses.

  To thirty years of bringing people home. To the hard choices made in the dark. And to the woman who taught us that every single life is worth the risk.

  To Mom.
