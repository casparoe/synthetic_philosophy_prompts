answer: |-
  **MEMORANDUM**

  **TO:** Accessibility Services Advisory Board
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for a Provisional Accommodation Pathway for Autism Spectrum Conditions

  **Purpose**

  This memo proposes a revision to our current documentation requirements for autism-related accommodations. Specifically, I recommend adopting a **Provisional Accommodation Pathway** that allows students to access interim supports based on self-identification and a functional needs interview, without waiting for a formal clinical diagnosis. This policy would be piloted next semester with a view toward full implementation within 12 months.

  **Context: The Epistemic Status of "Autism"**

  Our current policy assumes a clinical diagnosis is the only reliable detector of a fixed, underlying condition. However, recent work in the philosophy of psychiatry (notably Ian Hacking's concept of "looping effects") suggests that human categories like autism are not static natural kinds, like rocks or quarks. They are "moving targets."

  When a group of people is classified, they organize around that classification, changing how they understand and express their experience. In the case of autism, the self-organized adult community has refined the understanding of the condition (e.g., regarding masking, sensory processing, and female/non-binary presentations) faster than clinical criteria have updated. Consequently, a student's self-identification, particularly when informed by community knowledge and validated screening tools, is not merely a "guess" at a medical truth; it is expert testimony on a lived reality that current clinical gatekeeping often misses. Relying exclusively on external diagnosis risks systematically excluding students who genuinely fit the evolving criteria of the "kind" we aim to support.

  **Recommendation: The Provisional Accommodation Pathway**

  I propose we shift from a *Diagnosis-First* model to a *Needs-First* model for autism accommodations.

  1.  **Provisional Acceptance:** Students submitting a detailed self-identification statement (referencing specific functional barriers) and a completed validated self-report screener (e.g., AQ-10 or RAADS-R) will be eligible for provisional accommodations.
  2.  **Functional Interview:** Instead of demanding medical proof of *cause*, Accessibility Services will conduct a structured interview to verify the *impact*. Accommodations are granted based on the functional barrier (e.g., "processing speed under timed conditions"), not the medical label.
  3.  **Review Cycle:** Provisional status lasts for one academic year. Students are encouraged to pursue clinical diagnosis during this time if accessible, but continued support is contingent on the persistence of functional barriers, not the acquisition of a label.

  **Addressing the Concern for Integrity and Resources**

  I want to take seriously the concern held by several board members: that removing the clinical requirement invites strategic self-labeling for academic advantage and strains our resources. This is a valid administrative risk. If accommodations are perceived as easy to acquire without need, it undermines the legitimacy of the office and disadvantages students with high-cost needs.

  However, the strongest version of this argument does not require a medical diagnosis; it requires **evidence of functional need.** A medical diagnosis is a proxy for need, but an imperfect one. A student can have a diagnosis but not need exam extensions; conversely, a student can have significant processing differences without a diagnosis.

  By shifting the gatekeeping mechanism from *medical verification* to *functional assessment*, we actually tighten the link between accommodations and academic necessity. The structured interview allows our staff to adjudicate hard cases based on concrete educational barriers rather than relying on a clinician's signature, which may be based on outdated behavioral criteria. This mitigates the risk of strategic behavior while acknowledging that the "truth" of the student's experience is best accessed through their own articulation of their barriers.

  **Implementation Timeline**

  *   **Phase 1 (Next 3 Weeks):** Board feedback and revision of the self-identification template and functional interview rubric.
  *   **Phase 2 (Next Semester):** Pilot program launches for 50 students. Staff training on neurodiversity-affirming interviewing techniques.
  *   **Phase 3 (12 Months):** Review pilot data (usage rates, academic outcomes, staff workload). Adjust rubric and move to full policy adoption.

  **Conclusion**

  Maintaining the status quo assumes that the clinical definition of autism is finished and fixed. The evidence suggests otherwise. By adopting a Provisional Pathway, we align our policy with the reality of how these categories actually work: as dynamic interactions between experts and the people they serve. This approach reduces barriers to access without sacrificing the integrity of our resource allocation.

  I look forward to discussing the specifics of the functional interview rubric at our meeting in three weeks.
