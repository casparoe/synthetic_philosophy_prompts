prompt: |-
  so i sit on the small committee that manages a foundation's collection of historic violins -- old Italian instruments worth millions, loaned out to professional soloists, each covered by a "certificate" we maintain documenting its identity and provenance. odd case just landed on us. One violin, nicknamed the "Contessa," has almost none of its original wood left, having gone through the standard 19th-century conversion: new neck grafted onto the old scroll, new bass bar, new top after a crack in the 1920s -- totally normal, most old Italian violins went through this. But our restoration workshop apparently kept every original piece it ever removed, and a luthier we'd never dealt with has quietly reassembled those discarded original parts -- the real top, the real neck, carved by the maker himself -- into a second, playable violin. He wants the Contessa's name and certificate transferred to his instrument instead, since his actually contains more of the maker's own handiwork, even though it's a worse instrument to play. We don't have a written policy for this; our bylaws just say the certificate follows "the instrument," which nobody ever bothered to define. (Feels like one of those old ship-of-theseus threads, except now theres an actual bill of sale attached.) Write the committees decision memo: say which violin keeps the identity, or how you'd split it, give the criteria you're actually applying, a timeframe for revisiting if new evidence turns up, and take the luthier's argument seriously rather than just citing unbroken chain of custody and calling it a day.
reasoning: |-
  Here's a thinking process that leads to the suggested committee decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a small committee managing a foundation's collection of historic violins.
      *   **Subject:** A specific case involving a violin nicknamed the "Contessa."
      *   **The Conflict:**
          *   *Violin A (The Current "Contessa"):* Has the continuous chain of custody, the certificate, and is a better playing instrument. However, it has very little original wood (standard 19th-century conversion: new neck, new bass bar, new top).
          *   *Violin B (The Luthier's Reconstruction):* Assembled from the *discarded original parts* of Violin A (original top, original neck, original scroll). It has more of the maker's handiwork but is a worse instrument to play. The luthier wants the name and certificate transferred to this one.
      *   **Constraints/Guidelines:**
          *   No written policy on identity definition (bylaws say certificate follows "the instrument").
          *   Must address the Ship of Theseus paradox seriously.
          *   Must take the luthier's argument seriously (not just dismiss based on custody).
          *   Need to decide: Who keeps the identity? Split it?
          *   Need criteria for the decision.
          *   Need a timeframe for revisiting.
          *   Format: Committee Decision Memo.

  2.  **Determine the Core Philosophical & Practical Issues:**
      *   *Identity vs. Material:* Is a violin defined by its continuous history as a functional object (the "soul" of the instrument) or by its physical material (the "body" of the instrument)?
      *   *Function vs. Artifact:* The foundation loans instruments to *soloists*. This implies the primary purpose is musical performance, not museum display. A worse-playing instrument contradicts the foundation's mission.
      *   *Provenance vs. Authenticity:* Provenance tracks the object's history. Authenticity tracks the material origin.
      *   *Precedent:* Setting a precedent here matters. If we switch identity to the pile of original wood, does every future repair threaten an instrument's identity?

  3.  **Formulate the Decision:**
      *   *Option 1: Switch to the Luthier's Violin.* Pros: More original material. Cons: Worse sound, breaks continuous history of performance, sets dangerous precedent for future repairs, rewards unauthorized reconstruction.
      *   *Option 2: Keep with the Current Violin.* Pros: Continuous history, better sound (aligns with mission), respects the 19th-century conversion as part of its history. Cons: Less original material.
      *   *Option 3: Split Identity.* Pros: Acknowledges both truths. Cons: Confusing for the market, certificates usually unique.
      *   *Selected Approach:* Keep the identity with the Current Violin (Violin A), but acknowledge the historical significance of Violin B. Why? Because the foundation's mission is *performance*. A violin is a tool for music. The "instrument" is the functional entity, not just the timber. However, the luthier's argument about material authenticity is valid and needs to be documented.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the decision (Identity remains with the converted instrument).
      *   **Background:** Summarize the "Contessa" situation (Conversion vs. Reconstruction).
      *   **The Luthier's Claim:** Articulate his argument fairly (Material authenticity > Functional continuity).
      *   **Committee Criteria (The "Why"):** This is crucial. I need to define "The Instrument."
          *   *Criterion 1: Functional Continuity.* The instrument as a sounding entity.
          *   *Criterion 2: Historical Integrity of Modification.* 19th-century conversions are part of the instrument's life, not destruction.
          *   *Criterion 3: Foundation Mission.* We exist for performance, not just preservation of wood.
          *   *Criterion 4: Chain of Custody.* The certificate tracks the *entity*, not just the atoms.
      *   **The Decision:** Identity stays with the playable violin. The reconstruction is a "Historical Artifact" derived from the Contessa, but not the Contessa itself.
      *   **Compromise/Recognition:** How to honor the luthier's find? A separate certificate of provenance for the reconstruction, acknowledging it contains the original material.
      *   **Review Clause:** Timeframe for revisiting (e.g., 5 years or if new scholarship emerges).

  5.  **Refining the Tone:**
      *   Needs to be formal but thoughtful.
      *   Avoid legalistic jargon where possible, but sound authoritative.
      *   Show empathy for the luthier's passion (he saved the wood!) while maintaining the foundation's standards.
      *   Address the Ship of Theseus explicitly.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I take the luthier seriously?
      *   *Fix:* Ensure the section analyzing his claim is robust. Acknowledge that in a *museum* context, he might be right. But in a *performance* foundation context, he is wrong.
      *   *Critique:* Is the "Split" option addressed?
      *   *Fix:* Explicitly reject splitting the name (e.g., "Contessa I & II") to avoid market confusion, but offer the secondary documentation.
      *   *Critique:* Is the timeframe clear?
      *   *Fix:* Add a specific review date.

  7.  **Final Polish:** Check for clarity, flow, and specific details (e.g., mentioning the 1920s crack, the neck graft). Ensure the distinction between "Provenance" and "Identity" is clear. (Proceed to generate output based on these thoughts.)

  8.  **Final Check against constraints:**
      *   Committee decision memo format? Yes.
      *   Say which violin keeps identity? Yes (The converted one).
      *   Give criteria? Yes (Functional continuity, Mission alignment, etc.).
      *   Timeframe? Yes (5 years).
      *   Take luthier's argument seriously? Yes (Acknowledged in the analysis).

  *(Self-Correction Note)*: Wait, I should make sure I don't sound *too* dismissive of the material argument. In the art world, material *does* matter. I need to balance the "Performance Mission" with "Historical Truth." The decision should be that the *Certificate of Identity* stays with the playable one, but the *Certificate of Provenance* for the wood needs to be distinct. Actually, better: The "Contessa" identity is a cultural construct attached to the sounding object. The wood is the "Contessa Material." I will formalize this distinction.

