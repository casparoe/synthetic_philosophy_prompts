answer: |-
  This is a fantastic question because it cuts right to the heart of a specific debate in social epistemology: **The Epistemology of Testimony.**

  You are asking whether testimony (someone telling you something) is a *basic* source of justification (like perception or memory) or if it is *derivative* (requiring support from other sources).

  Here is the breakdown of why your decision was likely philosophically sound, even if the data ended up "off," and how to classify this in the terms you've likely seen in class.

  ### 1. The Core Debate: Reductionism vs. Non-Reductionism

  In your epistemology class, you may have touched on the dispute between **Reductionists** and **Non-Reductionists** regarding testimony.

  *   **Reductionism (Hume, Locke):** This view holds that testimony is not a fundamental source of knowledge. To be justified in believing your partner, you must have positive reasons (based on perception, memory, or induction) to think she is reliable. If you take her say-so with *zero* independent check, you are being gullible.
  *   **Non-Reductionism (Thomas Reid, Tyler Burge, C.A.J. Coady):** This view argues that testimony *is* a basic source of justification. We have a "default right" to trust others unless there is a specific **defeater** (a reason to doubt). As Burge puts it in his *Principle of Acceptance*: "A person is entitled to accept a proposition that is presented as true and that is intelligible to him, unless there are stronger reasons not to do so."

  **Applying this to your lab:**
  If you are a Non-Reductionist, you were perfectly rational. You had no defeaters (no reason to think she was lying or incompetent). The burden of proof was on the *doubt*, not the trust. Taking her word was not gullibility; it was the default rational stance toward a cooperative agent.

  ### 2. You Actually *Did* Have Independent Reasons

  Even if you lean toward Reductionism, your claim that you had "zero independent check" or "no actual reason to doubt" might be slightly inaccurate. You wrote: **"she's usually careful."**

  That is an inductive reason.
  *   **Premise 1:** In past observations, my partner has been careful.
  *   **Premise 2:** People who have been careful in the past are likely to be careful now.
  *   **Conclusion:** She likely calibrated the meter correctly.

  From a Reductionist standpoint, this *is* independent evidence. It relies on your memory and induction, not just her current utterance. So, even under the stricter Humean framework, you weren't trusting her "say-so alone"; you were trusting her say-so *plus* your prior data on her reliability.

  ### 3. Scientific Practice vs. Pure Epistemology

  There is a tension here between **epistemic justification** (was I rational to believe?) and **methodological rigor** (did I follow scientific protocol?).

  *   **Epistemically:** You were justified. Collaboration requires a division of cognitive labor. If every scientist had to verify every claim made by their collaborators personally, science would grind to a halt. Trust is a heuristic that allows efficiency.
  *   **Methodologically:** In a strict lab context, verification is often the norm. However, standard operating procedure usually allows for division of tasks. If you divided labor (she calibrates, you record), trusting her part of the bargain is part of the social contract of the lab.

  The fact that the numbers were "a bit off" introduces **Hindsight Bias**. You are judging the rationality of your decision *at the time* based on information you only have *now*.
  *   If the meter was uncalibrated, it could be human error, machine drift, or faulty equipment.
  *   Even if she lied (unlikely), your justification at the time remains valid if it was based on her past reliability.
  *   A rational decision can lead to a bad outcome. (You can drive perfectly safely and still get hit by a drunk driver; that doesn't mean your driving was irrational).

  ### 4. Is "Say-So" Ever Evidence?

  To answer your specific question: **"Can someone's say-so alone ever count as real evidence... or do you always need some prior reason?"**

  Most contemporary epistemologists (Non-Reductionists) would say: **Yes, say-so alone counts.**

  The argument is that human beings are socially embedded. We learn language, facts, and norms primarily through testimony. If we required independent verification for every testimonial claim, we would suffer from "epistemic paralysis." Therefore, the *act of assertion* by a competent speaker generates a presumption of truth.

  However, the **context** matters.
  *   **Low Stakes/High Trust:** "It's raining outside." (Say-so is enough).
  *   **High Stakes/Low Trust:** "I defused the bomb." (Say-so is not enough; verification is required).
  *   **Academic Lab:** This is a middle ground. The stakes are grades/data integrity. The trust is moderate.

  ### The Verdict

  You are experiencing what philosophers call **epistemic anxiety**, but logically, you are in the clear.

  1.  **It wasn't gullibility:** Gullibility is trusting *against* the evidence or without regard for risk. You assessed the risk (low), assessed her history (careful), and made a calculation.
  2.  **It wasn't "zero check":** Your memory of her past behavior was the check.
  3.  **The outcome doesn't invalidate the process:** The "off" numbers are a separate variable. They don't prove your trust was unjustified, only that the belief happened to be false (if the calibration was indeed the issue).

  **Takeaway:** You operated under a **Non-Reductionist** framework (default trust) supported by **Reductionist** evidence (past reliability). That is a robust epistemic position. Don't let the messy data convince you that your reasoning was flawed. In fact, if you *had* stopped to recalibrate everything yourself every time, you'd be accused of inefficiency, not praised for rigor.

  Science is a team sport; you treated your partner like a teammate. That's reasonable.
