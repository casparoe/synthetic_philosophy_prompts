answer: |-
  This is a fantastic puzzle, and your intuition that it feels "rigorous and also completely unhinged" is spot-on. You have stumbled directly into one of the most debated corners of formal epistemology.

  Your friend is invoking a version of **Bas van Fraassen's Reflection Principle**, but she is applying it in a context that violates its core constraints. The short answer is: **She is misapplying a valid diachronic coherence principle to a case of known epistemic manipulation.**

  Here is the careful walkthrough you asked for, breaking down the epistemic principles, where the logic holds, and exactly where it breaks in the context of a "transformation seminar."

  ### 1. The Principle She Is Invoking: Reflection
  Your friend's argument is a colloquial version of the **Reflection Principle**. Formally, it suggests that your current credence (degree of belief) in a proposition $P$ should equal your current expectation of your future credence in $P$.

  If $C_t$ is your credence at time $t$, and $C_{t+1}$ is your credence at a future time, the principle states:
  $$C_t(P \mid C_{t+1}(P) = x) = x$$

  **The Intuition:** If I know that "Future Me" will be 90% sure of something, and I trust "Future Me" to be rational, then "Current Me" should also be 90% sure. To do otherwise seems to imply that I think "Future Me" is going to be irrational or mistaken, which contradicts my prediction that I *will* hold that belief. As your friend put it, privileging "Tuesday Me" over "Sunday Me" feels arbitrary.

  In ideal conditions (where an agent is perfectly rational and updates only on new evidence), this principle holds. It prevents **diachronic Dutch Books** (situations where you can be pumped for money because your beliefs across time are incoherent).

  ### 2. The Flaw: Evidence vs. Causal Influence
  The Reflection Principle has a massive, often overlooked caveat: **It assumes the change in belief is driven by the acquisition of evidence, not by a causal intervention on the belief-forming mechanism.**

  Your friend explicitly admits: *"the shift will come mainly from orchestrated emotional exercises and group pressure... not from learning any actual new facts about her dad."*

  This is the critical break. In epistemology, there is a distinction between:
  1.  **Updating:** Changing belief because the world (evidence) dictated it (Bayesian conditionalization).
  2.  **Shifting:** Changing belief because something *happened to you* that altered your psychology (hypnosis, fatigue, emotional flooding, drugs).

  **The "Mind-Potion" Counter-Example:**
  Philosophers (like David Christensen in *Putting Logic in its Place*) use this standard counter-example to Reflection:
  > Imagine I know that tomorrow I will drink a potion that makes me believe I can fly. I am currently 100% confident I cannot fly. I am also 100% confident that tomorrow, after the potion, I will be 90% confident I can fly.
  >
  > Does Reflection require me to believe *now* that I can fly? **No.**

  Why? Because I know the future belief is not the result of evidence regarding aerodynamics or gravity. It is the result of a chemical intervention. I can predict my future irrationality without endorsing it.

  In your friend's case, the seminar is the "potion." She knows the mechanism of change is **social pressure and emotional exhaustion**, not **data about her father's internal state**. Therefore, she is not required to defer to her Sunday self. In fact, intellectual honesty requires her to *discount* her Sunday self's confidence because she knows the source of that confidence is epistemically tainted.

  ### 3. The "Arbitrary Privilege" Rebuttal
  Your friend's strongest point is: *"Otherwise, she says, she'd be treating her Sunday-night self as having no more claim to being right about her dad than her Tuesday self, which feels arbitrary to just dismiss."*

  This feels compelling because we generally want to treat our future selves as continuous with our current selves. However, the privilege isn't arbitrary; it is **procedural**.

  She is not privileging "Tuesday" because of the *date*; she is privileging "Tuesday" because of the **process** currently generating her beliefs.
  *   **Tuesday Process:** Reflection on past interactions, objective memories, lack of contact. (Imperfect, but evidential).
  *   **Sunday Process:** Group chanting, sleep deprivation, guided visualization, authority pressure. (Known to be non-evidential).

  If she updates now, she is effectively saying, "I believe the *process* of the seminar is a truth-tracking mechanism." But she already admitted it isn't. She believes it is a *comfort-tracking* or *coherence-tracking* mechanism.

  To update now would be to lie about *why* she believes. It would be to claim, "I believe my dad loves me because the evidence supports it," when the actual reason is, "I believe my dad loves me because I know I will be emotionally manipulated into feeling safe."

  ### 4. Akrasia and Moorean Paradoxes
  There is a deeper logical weirdness here related to **Moore's Paradox**.
  If she adopts the 90% belief now, her internal state looks like this:
  > "I believe my dad loves me (90%), *and* I believe this belief is caused by group pressure rather than evidence."

  This is a form of **epistemic akrasia** (holding a belief while simultaneously believing that holding that belief is unjustified). While some philosophers argue akrasia is sometimes permissible, most agree that *knowingly* adopting a belief because you know you'll be manipulated into it is a violation of rational agency.

  She is trying to "pre-empt" the manipulation to make it look like rationality. But you cannot rationalize a non-evidential cause by predicting it.

  ### 5. Why This Feels "Rigorous" (The Grain of Truth)
  Why does her argument feel so convincing? Because there *are* cases where Reflection *does* apply.

  If she were going to meet her father on Sunday and have a heartfelt conversation where he revealed new, exculpatory information she didn't have before, she *should* update her belief now (to the extent she expects that conversation to happen). In that case, "Sunday Her" would have more evidence than "Tuesday Her."

  The confusion arises because she is conflating **Information** with **Intensity**.
  *   The seminar will increase the *intensity* of her conviction (the emotional salience).
  *   It will not increase the *information* regarding the proposition.

  Our brains often mistake intensity for evidence. ("I feel it so strongly, it must be true.") Her argument is essentially an intellectualization of that cognitive bias. She is using a high-level epistemic principle (Reflection) to justify a low-level cognitive error (confusing emotional certainty with evidential probability).

  ### 6. The Verdict for Your Writing
  For your piece on cognitive science and belief, here is the shape of the debate:

  1.  **The Principle:** She is correctly identifying van Fraassen's Reflection Principle (diachronic coherence).
  2.  **The Violation:** She is violating the **Conditionalization Constraint**. Reflection only binds you if you expect your future self to be updating on evidence.
  3.  **The Mechanism:** She has identified the mechanism of change as non-evidential (emotional/social pressure).
  4.  **The Conclusion:** Knowing that a future belief will be caused by non-evidential factors **defeats** the obligation to reflect. You can predict your own future irrationality without becoming irrational now.

  **The "Intellectual Honesty" Flip:**
  You can argue that her definition of "intellectual honesty" is backward.
  *   **Her view:** Honesty = Aligning current belief with predicted future belief.
  *   **Epistemic view:** Honesty = Aligning current belief with current evidence, and accurately labeling the source of future belief.

  True intellectual honesty would be: *"I currently assess the probability at 50%. I predict that on Sunday, I will feel 90% certain. I also know that this shift will be caused by emotional conditioning, not new data. Therefore, I will enjoy the emotional relief on Sunday, but I will not pretend that the 90% figure represents an evidential truth about my father."*

  ### Summary
  She is trying to "hack" the Reflection Principle. She wants the emotional benefit of the 90% belief (the certainty) without waiting for the seminar, using the prediction of the seminar as the bridge.

  But the bridge is out. Predicting that you will be convinced by a magician does not require you to believe in the magic trick before the show starts. It just means you know you're going to be entertained.

  **Key Search Terms for your research:**
  *   Bas van Fraassen, *Reflection Principle*
  *   David Christensen, *Putting Logic in its Place* (specifically on "Rational Reflection")
  *   Epistemic Akrasia
  *   Evidential vs. Causal theories of belief
  *   Diachronic Coherence

  This is a classic case of **instrumental rationality** (doing what makes me feel better/function better) masquerading as **epistemic rationality** (believing what is true). Her argument works for the former, but fails for the latter.
