  6.  **Final Polish:** Check for clarity, flow, and persuasive impact. Ensure the distinction between "bribery" (illegal/crude) and "improper influence" (subtle/corrosive) is clear. (Self-correction: The prompt asks for something honest to say *instead* of muttering 'bribery'. I need to make sure that specific argument lands hard.)

