      *   **Role:** Philosophy Professor on the University's Honorary Degrees Committee.
      *   **Task:** Write a memo to the committee before the vote next month.
      *   **Content:** A real recommendation (Award, Defer, Decline, or Alternative), reasoning, and a specific argument for the "timing doesn't matter" camp that avoids simply shouting "bribery."
      *   **Context:** A wealthy biotech trustee is linking a $30M gift for a public health building to receiving an honorary doctorate at spring commencement. He is independently meritorious (vaccine distribution, etc.). Bylaws require "sustained contribution to the public good" but are silent on gifts.
      *   **Tone:** Professional, philosophical yet pragmatic, persuasive, institutionally aware. It needs to acknowledge the tension between idealism and financial reality without being naive or cynical.

  2.  **Determine the Recommendation:**
