answer: |-
  A Fair Coin and Sleeping Beauty are in couples counseling.

  "I'm a stable 1/2," says the Coin. "David Lewis vouches for me. I land once, I'm fair, end of story."

  "But I wake up confused," says Beauty. "Adam Elga vouches for me. If you're Tails, I'm here twice. If you're Heads, I'm here once. That makes you a 1/3."

  "I don't change my physics based on your schedule!" protests the Coin.

  "But I change my probability based on my location!" counters Beauty.

  The Amnesia Drug, sitting on the nightstand, finally clears its throat.

  "Relax," says the Drug. "The Coin is right about the *flip*. Beauty is right about the *trip*."

  "So what's the verdict?" they ask in unison.

  "Simple," says the Drug. "If you're a Halfer, trust him. If you're a Thirder, trust me. And since I'm the reason she's confused twice as often when you're Tails... I'm the only one in this room with a majority share."
