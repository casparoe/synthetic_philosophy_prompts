prompt: |-
  I'm putting together a session for a graduate seminar on classical and contemporary problems of induction, and I'd like a second opinion on how best to walk students through the inner logic of one of Hume's central arguments before we move on to some twentieth-century complications. Here is the passage, from Section IV, Part II of the *Enquiry Concerning Human Understanding* (EHU 4.18–19, SBN 35–36):

  "All reasonings may be divided into two kinds, namely demonstrative reasoning, or that concerning relations of ideas, and moral reasoning, or that concerning matter of fact and existence. That there are no demonstrative arguments in the case, seems evident; since it implies no contradiction, that the course of nature may change, and that an object, seemingly like those which we have experienced, may be attended with different or contrary effects. May I not clearly and distinctly conceive, that a body, falling from the clouds, and which, in all other respects, resembles snow, has yet the taste of salt or feeling of fire? Is there any more intelligible proposition than to affirm, that all the trees will flourish in December and January, and decay in May and June? Now whatever is intelligible, and can be distinctly conceived, implies no contradiction, and can never be proved false by any demonstrative argument or abstract reasoning a priori.

  If we be, therefore, engaged by arguments to put trust in past experience, and make it the standard of our future judgment, these arguments must be probable only, or such as regard matter of fact and real existence, according to the division above mentioned. But that there is no argument of this kind, must appear, if our explication of that species of reasoning be admitted as solid and satisfactory. We have said, that all arguments concerning existence are founded on the relation of cause and effect; that our knowledge of that relation is derived entirely from experience; and that all our experimental conclusions proceed upon the supposition, that the future will be conformable to the past. To endeavour, therefore, the proof of this last supposition by probable arguments, or arguments regarding existence, must be evidently going in a circle, and taking that for granted, which is the very point in question."

  Nearly every year, a few of my students paraphrase this as the claim that Hume showed induction can't be justified, and leave it there, which skates past what I take to be the more interesting piece of argumentative engineering. Could you reconstruct the reasoning step by step, making explicit how Hume rules out a demonstrative basis for trusting past experience before turning to rule out the probable route as well? I'd especially like the exact location of the circularity pinned down: is Hume saying merely that any probable argument for the uniformity of nature would have to presuppose that very principle, or is the objection tied more specifically to how probable reasoning, on his own account, is itself constituted by inference from past conjunctions of qualities — so that using it to certify the uniformity principle just is using the conclusion as one of the premises? I want to be able to show students exactly where the trapdoor opens, rather than just gesturing at circularity as a slogan.

  There's a second issue I keep going back and forth on, concerning how this passage relates to what I usually teach right after it: Goodman's "new riddle of induction," the grue paradox. Suppose, per impossibile, that someone produced a fully non-circular vindication of the uniformity of nature, closing the very gap Hume identifies here. Would Goodman's riddle show that this victory is largely hollow, since we would still have no way of specifying which respects nature is supposed to be uniform in (colour, rather than "grue"-hood, say)? Or, on a sufficiently careful reading, does Hume's own argument already smuggle in some notion of qualitative similarity that would need to be pinned down in just the way Goodman's puzzle demands — so that the grue problem isn't really a sequel to Hume's difficulty at all, but an unexamined component of it, one his own text never makes explicit? I'd value your view on how tightly the two problems are actually connected, as opposed to being merely two independent reasons to be suspicious of induction.
