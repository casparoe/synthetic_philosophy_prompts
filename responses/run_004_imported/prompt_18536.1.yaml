  7.  **Final Polish:** Check clarity and tone. Ensure the distinction between "epistemic uncertainty" (Maya 1) and "ontological conflict" (Jonah 2) is clear. Ensure "Moral Residue" is highlighted in Move 4. Ensure "Ought Implies Can" is highlighted in Move 5.

