answer: |-
  Here are ten interview questions designed to probe the tensions in your guest's reconstruction, including the specific thematic requirements you requested.

  **1. The Ptolemy Problem**
  "Let's begin with the textual foundation. It is well-established that the later books of *De Regno* were completed by Ptolemy of Lucca, whose republican sympathies differ markedly from Aquinas's earlier Aristotelianism. Your book claims a 'coherent reconstruction' of Aquinas's view. How much interpretive weight does your thesis place on the Ptolemaic sections? If we were to excise everything not securely authentic, does the distinction between the usurper and the legitimate tyrant survive, or does it rely on Ptolemy's vocabulary to hold the structure together?"
  *   **Follow-up:** "If you argue the distinction survives in the authentic texts, could you point to the specific passage in the early chapters or the *Summa* where Aquinas explicitly licenses private violence against a usurper, rather than merely describing it?"

  **2. The "Convenient Asymmetry" Objection**
  "I want to put a criticism to you directly that a colleague of mine raised. He argues that the distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (legitimate tyrant) functions as a convenient asymmetry. It allows Aquinas to condone killing in the abstract while insulating actual Christian monarchs from the knife. My friend notes that the prudential warnings Aquinas raises—the risk of ambition in the assassin, the likelihood of a worse successor, the danger to good rulers—apply with equal force to a usurper as to a hereditary king. Why do those prudential constraints bind the subject in one case but not the other?"
  *   **Follow-up:** "If your answer is that legitimacy changes the *moral* status of the act rather than the *practical* consequences, does that not render Aquinas's prudential warnings in *De Regno* merely rhetorical cover rather than genuine philosophical constraints?"

  **3. Reconciling Endurance with Permission**
  "In the authentic early chapters of *De Regno*, Aquinas seems to counsel endurance, suggesting that removing a tyrant often leads to greater evils. Yet, elsewhere in the corpus, there is a more permissive treatment regarding usurpers. How do you reconcile this caution-counsels-endurance argument with the permission for private tyrannicide? Is the killing of a usurper treated as a categorically different act than the removal of a tyrant, or is it simply a lower threshold for the same action?"
  *   **Follow-up:** "If it is a lower threshold, who determines when the 'greater evils' of removal are outweighed by the tyranny of the usurper? Is that judgment left to the private individual?"

  **4. The Captured Institution**
  "You argue that a legitimate ruler who degenerates into tyranny must be removed by the public body that instituted him, never by private violence. But this assumes the public body retains its agency. What is the Aquinas scholar to do in a case where that public authority is itself captured by, or complicit with, the tyrant? If the mechanism for lawful deposition is broken, does the right of private defense revert to the individual, or must the common good simply suffer?"
  *   **Follow-up:** "If you say they must suffer to avoid scandal, does this not imply that the stability of the office is valued higher by Aquinas than the immediate safety of the community he is meant to serve?"

  **5. The Epistemology of the Assassin**
  "Your reconstruction allows a private person to act when there is 'no possibility of appeal to a higher authority.' This places a tremendous epistemological burden on the private individual. They must judge not only that the ruler is a usurper, but that all public remedies are exhausted. Given Aquinas's general skepticism about private judgment in public matters, how does he avoid legitimizing subjective vendettas under the guise of public good?"
  *   **Follow-up:** "Does Aquinas offer any objective criteria for what counts as 'exhausted appeal,' or is this a matter of conscience that leaves the assassin vulnerable to error and sin regardless of the outcome?"

  **6. The Nature of *Titulus***
  "Central to your distinction is the concept of *titulus*, or legitimate title. Is Aquinas's conception of title purely procedural—based on election or heredity—or is it substantive, based on the ruler's ability to secure the common good? If a usurper seizes power but rules virtuously for twenty years, does he remain licitly killable by a private person, or does successful governance confer legitimacy over time?"
  *   **Follow-up:** "If you argue he remains killable regardless of performance, does this not suggest that for Aquinas, the legality of the office is more sacred than the welfare of the subjects?"

  **7. The Role of Higher Authority**
  "Aquinas stipulates that private action is only permissible when there is no superior to whom one can appeal. In the 13th century, this usually meant the Emperor or the Pope. Does your reconstruction imply that the existence of a theoretical higher authority—say, the Papacy—effectively nullifies the right of tyrannicide even if that higher authority is geographically or politically unable to intervene?"
  *   **Follow-up:** "If the 'possibility of appeal' is interpreted strictly, does this condition render the permission for private tyrannicide practically null in almost all historical contexts?"

  **8. Comparison with Later Scholastics**
  "Later Scholastics, particularly the Jesuits like Mariana and Suarez, are often associated with more explicit defenses of tyrannicide. In reconstructing Aquinas, are you presenting him as a precursor to their views, or are you arguing that Aquinas is significantly more restrained? If Aquinas is more restrained, why has he historically been claimed by both sides of the tyrannicide debate?"
  *   **Follow-up:** "If he is more restrained, does your reconstruction suggest that the later Scholastics misread Aquinas's permission regarding usurpers as a broader license?"

  **9. Normative vs. Historical Coherence**
  "You describe your project as a 'coherent reconstruction.' This phrasing suggests you are smoothing over contradictions to present a unified theory. Are you arguing that Aquinas *actually* held this coherent view consistently, or are you constructing a 'best version' of Aquinas that resolves the tensions in the text? If the latter, at what point does reconstruction become innovation?"
  *   **Follow-up:** "If it is innovation, is that innovation justified by the internal logic of Thomistic natural law, or by modern political needs we are projecting backward?"

  **10. The Silence of the *Summa***
  "Finally, in the *Summa Theologiae*, where Aquinas is most systematic, the treatment of sedition and tyranny is notably brief and cautious compared to the *Commentary on the Sentences* or *De Regno*. Why do you think Aquinas pulls his punches in his magnum opus? Does the *Summa* represent his mature, final caution against the very distinctions your book defends?"
  *   **Follow-up:** "If the *Summa* is his final word and it emphasizes the danger of sedition over the right of removal, does that not undermine the weight we should give to his earlier, more permissive remarks on usurpers?"
