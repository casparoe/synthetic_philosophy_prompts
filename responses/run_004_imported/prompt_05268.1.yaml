          4.  *Public Authority Problem:* What if the public body meant to depose a legitimate tyrant is complicit or captured?
      *   **Requirements:** 8-10 interview questions. Must press on tensions, not just invite restatement. Must include specific questions on: friend's objection, reconciliation of caution vs. permission, public authority complicity, and textual authorship weight. Each question needs a brief follow-up keyed to likely responses.

