answer: |-
  **TO:** Responsible Recommendations Working Group
  **FROM:** [Your Name], Backend Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal: Integrating Satisfaction Signals into RecSys Objective Function (Option 2)

  ### Executive Summary

  We need to decide how to handle the conflict between our engagement metrics (watch-time/session length) and UX research indicating user regret among heavy users. The RecSys team argues for optimizing purely on revealed preference (watch-time), noting that survey data is noisy and self-reports often contradict actual behavior.

  This memo recommends **Option 2: Integrating a satisfaction score into the objective function as a weighted multiplier**, rather than swapping metrics entirely or leaving satisfaction as a passive dashboard metric.

  We should adopt a **Quality-Adjusted Watch Time (QAWT)** objective for Q1 experimentation. This approach respects the rigor of revealed preference theory while acknowledging that in infinite-scroll environments, "choice" is often a signal of compulsion rather than value.

  ### The Core Tension: Revealed Preference vs. Time Inconsistency

  The RecSys team's position is technically sound and economically grounded. In standard microeconomics, revealed preference is the gold standard because it bypasses the "cheap talk" of surveys. If a user stays for 45 minutes, they have paid the cost of 45 minutes to consume the content. To ignore that signal in favor of a post-hoc survey is to risk optimizing for what users *say* they want (virtue signaling) rather than what they *do* want.

  However, relying *exclusively* on session length assumes **preference stability**. It assumes the user at minute 40 has the same utility function as the user at minute 5.

  UX research suggests we are seeing **time-inconsistent preferences** (hyperbolic discounting). Users reveal a preference for "one more video" in the moment (high dopamine, low friction), but reveal a contradictory preference for "I wish I hadn't done that" upon reflection (high regret). Both are revealed preferences; they just operate on different time horizons.

  If we optimize only for the immediate horizon, we capture the compulsion loop. If we optimize only for the survey, we capture social desirability bias. We need a loss function that bridges the two.

  ### Recommendation: Quality-Adjusted Watch Time (QAWT)

  I propose we modify the recommender's reward function to include a satisfaction signal, not as a replacement for engagement, but as a quality filter.

  **The Metric:**
  $$QAWT = \text{WatchTime} \times (1 + \alpha \cdot \text{NormSatisfactionScore})$$

  *   **WatchTime:** Our current gold standard (revealed preference).
  *   **NormSatisfactionScore:** A normalized score from periodic in-app micro-surveys (e.g., "How was this session?" 1-5 stars, triggered randomly post-session).
  *   **$\alpha$:** A weighting hyperparameter (initially set low, e.g., 0.1, to prevent instability).

  **Why this over the other options?**

  1.  **Vs. Pure Engagement (Status Quo):** This ignores the "sadder TikTok" risk. If users feel worse after using the app, long-term retention churn increases even if session length holds. QAWT penalizes engagement that drives regret.
  2.  **Vs. Pure Satisfaction Swap:** This is dangerous. Satisfaction surveys are sparse, noisy, and gameable. Removing watch-time entirely invites users to game the survey for rewards or optimizes for content that makes users *feel* productive but isn't actually engaging (the "broccoli problem").
  3.  **Vs. Dashboard Only:** If a metric isn't in the objective function, engineering bonuses and model selection will ignore it. A dashboard is a suggestion; a loss function is a requirement.

  ### Addressing the "Noisy Survey" Objection

  The strongest argument against this is that survey data is too sparse and noisy to train on. The RecSys team is right: a single user's survey response is a weak signal compared to milliseconds of clickstream data.

  However, we do not need per-user precision for this to work. We need **cohort-level signal**.
  *   **Noise cancels out:** Over a batch size of 10k users, the "mood-of-the-moment" noise averages out.
  *   **Sparsity is manageable:** We can use imputation models to estimate satisfaction scores for non-surveyed sessions based on behavioral proxies (e.g., immediate app close, scroll velocity decay) trained on the subset where we *do* have survey data.
  *   **The Cost of Error:** False positives on engagement (keeping a user who hates it) are more damaging to LTV than false negatives on satisfaction (losing a user who would have rated 4/5 instead of 5/5).

  ### Rollout Plan & Timeframe

  We can implement this without disrupting current production stability.

  **Phase 1: Data Pipeline & Backfill (Weeks 1-3)**
  *   **Eng:** Instrument the micro-survey trigger (randomized, <5% of sessions to avoid fatigue).
  *   **Data:** Build the `NormSatisfactionScore` aggregation layer.
  *   **ML:** Train an imputation model to predict satisfaction scores for sessions without surveys using behavioral features.

  **Phase 2: Shadow Mode & Calibration (Weeks 4-6)**
  *   **ML:** Run the QAWT objective in shadow mode (compute the loss, but don't update weights).
  *   **Analysis:** Compare QAWT rankings against current WatchTime rankings. Identify where they diverge. Does QAWT deprioritize "rage-bait" or "doom-scroll" clusters?
  *   **Goal:** Tune $\alpha$ so that QAWT correlates with Day-7 Retention better than WatchTime alone.

  **Phase 3: A/B Test (Weeks 7-12)**
  *   **Experiment:** 5% traffic on QAWT objective vs. 5% Control (WatchTime objective).
  *   **Guardrails:** Monitor primary business metrics (DAU, Ad Revenue). If revenue drops >2%, we halt.
  *   **Success Metric:** Improvement in Day-30 Retention and NPS among the heavy-user cohort.

  ### Decision Required

  For next Wednesday's vote, I am asking the group to endorse **Phase 1** funding and resourcing.

  This approach honors the RecSys team's insistence on rigorous, behavioral data by keeping watch-time as the base unit of value. Simultaneously, it honors the UX research by acknowledging that "value" degrades if the user experience generates regret. It moves us from optimizing for *consumption* to optimizing for *valuation of consumption*.

  Please review the attached technical spec for the imputation model before the meeting.

  **[Your Name]**
  Backend Engineering
