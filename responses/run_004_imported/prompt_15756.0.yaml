  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront. Don't bury the lead.
      *   **The Core Tension:** Acknowledge the Recsys argument (Revealed Preference) vs. UX argument (Stated Well-being). Validate the Recsys team's point (it's not stupid, it's standard econ/ML).
