answer: |-
  1.  **Your new book argues that Hobbes's obsession with geometric certainty isn't just a quirk, but the architectural beam holding up his entire system. For a reader who knows Hobbes primarily as a political theorist of the state of nature, what is the single most surprising connection you found between his geometry and his politics?**

  2.  **Hobbes was writing in a century defined by religious war and Pyrrhonian skepticism. Why was the demand for "genuine certainty" so politically urgent for him? Was he trying to solve a mathematical problem, or was he trying to stop the bleeding of the English Civil War by philosophical means?**

  3.  **A core pillar of Hobbes's epistemology is the "maker's knowledge" argument: the idea that we can only have true *scientia* of things we construct ourselves, which is why geometry yields certainty while natural philosophy remains merely hypothetical. Can you walk us through how he justifies this hierarchy, and what he thinks we are actually doing when we study physics if we can't know its true causes?**
      *   **Follow-up:** *Historians often suggest this makes Hobbes an instrumentalist about physics—meaning theories are just tools for prediction rather than descriptions of reality. If that's the case, does Hobbes believe natural philosophy can ever tell us what the world **is**, or only how to manipulate it?* (Anticipating her explanation of the *scientia* vs. hypothesis distinction.)

  4.  **There is a glaring tension in Hobbes's biography: he insists that we cannot be mistaken about the causes of what we construct, yet he spent decades defending a mistaken quadrature of the circle against John Wallis's correct refutations. How do you reconcile his epistemological claim—that construction guarantees certainty—with his biographical reality of constructing an error and refusing to admit it?**
      *   **Follow-up:** *If Hobbes believed his definitions were sound even when his calculations were wrong, does this suggest that his "maker's knowledge" criterion ultimately relies less on the method itself and more on the philosopher's unshakeable confidence in their own definitions?* (Anticipating her likely defense that Hobbes felt Wallis misunderstood his terms.)

  5.  **In *Leviathan*, Hobbes implies that civil philosophy is demonstrable in the same sense as geometry because we "make" the commonwealth through covenant. How much weight can this analogy really bear? In geometry, the materials are passive; in politics, the "materials" are human beings with passions. Does Hobbes have a convincing account of how the "matter" of humanity submits to the "form" of the sovereign?**
      *   **Follow-up:** *Given that Hobbes admits the sovereign can fail and the state can dissolve, does this admission undermine his claim that civil philosophy is a demonstrative science, or does he view political collapse as a user error rather than a flaw in the geometric proof?* (Anticipating her argument that Hobbes views political failure as a violation of the rational "laws of nature.")

  6.  **Hobbes places immense weight on the correct use of language and definitions, calling them the "first grounds" of science. How does his nominalism—the idea that universal terms are just names, not real things—support his broader project of turning philosophy into a computational science of reasoning?**

  7.  **We often think of the Scientific Revolution as a move toward experimentation, yet Hobbes was deeply hostile to the experimental program of the Royal Society, particularly Robert Boyle's air-pump experiments. Beyond his feud with Wallis, what was his fundamental philosophical objection to grounding knowledge in experimental evidence?**

  8.  **Hobbes viewed the universities as hotbeds of "vain philosophy" and Aristotelian nonsense that fueled sedition. How did his campaign for geometric certainty function as an attack on the institutional authority of the 17th-century academy?**

  9.  **Did Hobbes's dream of a "civil science" as certain as geometry find any takers after him? Do we see the lineage of this idea in Spinoza's *Ethics*, the French Enlightenment, or even in modern social contract theory, or did the scientific community ultimately reject his model?**

  10. **In an age of algorithmic governance and social engineering, Hobbes's vision of a society constructed on rational, demonstrable principles feels strangely modern. What is the warning, or the promise, that your book suggests we should take from Hobbes's attempt to turn politics into a geometry of power?**
