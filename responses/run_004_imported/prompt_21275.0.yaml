answer: |-
  Here are 10 interview questions tailored to your guest's specific position, the history of the debate, and your background. They are designed to prevent her from retreating to standard "tautology" defenses and force her to engage with the structural implications of her claim.

  ### 1. The 1978 Recantation (Required)
  **Question:** "You argue that Popper's 1978 *Dialectica* paper was a face-saving retreat rather than a genuine change of mind. Your claim is that he shifted the target from the *principle* of natural selection to the *auxiliary hypotheses* surrounding it (like heredity mechanisms). But if the auxiliary hypotheses are the testable part, doesn't that concede that the *principle* itself remains untestable? If so, did Popper actually save natural selection from the 'metaphysical' label in 1978, or did he just admit that metaphysics can be useful?"

  *   **Likely Answer:** She will likely argue that Popper realized the *principle* functions as a framework (like a law of conservation) while the *models* built on it are testable. She'll say he didn't save the principle from being metaphysical; he saved evolutionary biology from being labeled pseudoscience by separating the framework from the specific claims.
  *   **Follow-up:** "If the principle remains metaphysical, what prevents it from being an 'immunizing stratagem'? If a specific model fails, can we always blame the auxiliary hypotheses while keeping the metaphysical principle of selection intact? Where is the break point where the principle itself takes a hit?"

  ### 2. The "Hard" vs. "Soft" Demarcation
  **Question:** "There's a distinction in philosophy of science between saying a theory is 'false' and saying it's 'non-scientific.' When Popper originally called natural selection a metaphysical research programme, was his worry that it was *false*, or that it lacked *demarcation*? Because if it's the latter, calling it 'metaphysical' isn't an insult to its truth, but it is an insult to its scientific status. Which charge are you defending?"

  *   **Likely Answer:** She will almost certainly say it's about demarcation, not truth. She'll argue that 'metaphysical' doesn't mean 'wrong,' just that it provides the rules of the game rather than being a move within the game.
  *   **Follow-up:** "If it provides the rules of the game, does that mean evolutionary biology is closer to a logical system than an empirical science? At what point does adopting those 'rules' become an empirical commitment itself? For example, if we found a domain where selection *couldn't* operate, would that falsify the principle, or just define the boundary of the metaphysics?"

  ### 3. Marxism and Freud (Required)
  **Question:** "Popper lumped natural selection in with Marxism and Freudian psychoanalysis as unfalsifiable. But most philosophers agree he was wrong about Marxism and Freud in a different way than he was about selection. Marxism and Freud were criticized for explaining *everything* post-hoc. Is the unfalsifiability of natural selection the same 'flavor' as Freud's? Or is it more like a mathematical truth that applies to the physical world?"

  *   **Likely Answer:** She will distinguish them. She'll argue Freud/Marx were *ad hoc* and immune to evidence, whereas natural selection is a logical consequence of variation and heredity. She'll say Popper's early mistake was treating them as the same *kind* of unfalsifiability.
  *   **Follow-up:** "If they are different kinds of unfalsifiability, does that require a new category? Because if natural selection is a logical truth (given variation/heredity), doesn't that make it analytic rather than synthetic? And if it's analytic, how does it tell us anything new about the world, which is usually the job of a scientific theory?"

  ### 4. Independent Measures of Fitness
  **Question:** "I want to move past the 'survival of the fittest' tautology charge, because I think we agree that's a strawman. Modern biology defines fitness via independent traits (e.g., beak depth, metabolic efficiency). But on your view, even with independent measures, is the *link* between those traits and reproductive success a falsifiable claim, or is the expectation that 'better traits lead to success' the metaphysical part that we refuse to give up?"

  *   **Likely Answer:** She will argue the link is testable in specific contexts (specific models), but the general expectation that selection *will* optimize traits given time is the metaphysical commitment.
  *   **Follow-up:** "So if we find a case where a 'better' trait does *not* lead to success, do we say 'selection didn't act' or 'our model of the environment was wrong'? If we always choose the latter, aren't we back to the immunization problem we discussed with the 1978 recantation?"

  ### 5. Gould, Lewontin, and the Spandrels (Required)
  **Question:** "This seems to connect directly to Gould and Lewontin's 1979 'Spandrels' critique. They attacked the 'adaptationist programme' for assuming every trait is an optimal product of selection. If you're right, and selection is a metaphysical framework rather than a strict law, does that vindicate Gould and Lewontin? Are they essentially making the Popperian point that biologists were treating a heuristic as a falsifiable law?"

  *   **Likely Answer:** She will likely say yes, partially. She'll argue Gould and Lewontin were right that biologists often treat selection as an omnipotent optimizer without testing null hypotheses (like drift). She'll frame their critique as a methodological correction aligned with Popper's early warning.
  *   **Follow-up:** "But Gould and Lewontin were accused of undermining evolutionary explanation itself. If selection is just a metaphysical framework, does that weaken the explanatory power of evolutionary biology? Or does it actually strengthen it by clarifying that selection is just one of several tools (like drift or constraint) within that framework?"

  ### 6. The Lakatosian Shift
  **Question:** "You use Popper's phrase 'metaphysical research programme,' but that sounds remarkably like Imre Lakatos's 'Scientific Research Programmes,' which came later. Lakatos talked about a 'negative heuristic'—things we aren't allowed to falsify. Are you essentially arguing that Popper accidentally invented Lakatosianism in the 50s, and that natural selection is the 'hard core' of the evolutionary research programme that we protect from falsification?"

  *   **Likely Answer:** She will agree there is strong overlap. She'll likely argue that Popper's early intuition was essentially Lakatosian before Lakatos formalized it, and that the 'hard core' is the logic of selection itself.
  *   **Follow-up:** "If it's the 'hard core,' what constitutes the 'protective belt' of auxiliary hypotheses? And historically, when has the protective belt been modified so drastically that we should have considered changing the hard core? Is the Modern Synthesis just a massive modification of the protective belt?"

  ### 7. The "Zero-Force" Analogy
  **Question:** "Some philosophers, like Elliott Sober, compare natural selection to Newton's First Law (the law of inertia). It describes what happens in the absence of other forces. Is your position compatible with that? Is natural selection a 'zero-force law' that is metaphysically true by definition, while the actual evolutionary trajectories are the result of selection plus drift plus constraint?"

  *   **Likely Answer:** She will likely embrace this. It fits her view perfectly: the principle is a baseline truth (metaphysical/logical), while the empirical work is measuring the deviations from that baseline.
  *   **Follow-up:** "If it's like the law of inertia, it's prescriptive of how systems *should* behave absent interference. But in biology, is there ever an 'absence of interference'? If drift is always present, is the 'zero-force' state ever physically realizable, or is it purely a theoretical construct?"

  ### 8. Explanatory Reach (The Deutsch Angle)
  **Question:** "I come from a background where we value 'hard-to-vary' explanations, à la David Deutsch. He argues natural selection is a good explanation because it's hard to vary without breaking the explanation. If your view is correct, and it's a metaphysical framework, does that make it *easier* to vary? Can we tweak the principle of selection without it collapsing, because it's not making hard empirical claims?"

  *   **Likely Answer:** She might push back on Deutsch here. She'll argue that the *framework* is hard to vary (logic of replication), but the *applications* are easy to vary. She'll say the "reach" comes from the framework's universality, not its empirical specificity.
  *   **Follow-up:** "But if the framework doesn't make specific empirical claims, where does the 'reach' come from? Isn't the power of the theory precisely that it *does* rule things out? If it's metaphysical, does it rule out any physical states of affairs, or just any *interpretations* of those states?"

  ### 9. Methodological Consequences
  **Question:** "Let's talk about the biologists listening. If they accept your view—that Popper was right the first time—does it change how they do science? Does it mean they should stop trying to 'test' natural selection as a whole and focus entirely on testing specific selective pressures? Is there a practical difference in the lab?"

  *   **Likely Answer:** She will say yes. It stops them from treating 'adaptation' as a default assumption. It encourages them to formulate null hypotheses (e.g., neutral theory) more rigorously. It makes them more Popperian in practice.
  *   **Follow-up:** "So the practical upshot is more skepticism about adaptationist stories? It seems to me that accepting your view makes evolutionary biology more humble, but potentially less predictive. Are we trading predictive power for philosophical consistency?"

  ### 10. The "Retreat" Verdict
  **Question:** "To wrap up: You characterize Popper's 1978 paper as a retreat. But if the result of that retreat was that evolutionary biology was fully accepted as a rigorous science, while his early view kept it in a 'metaphysical' limbo, was it a *philosophically* honest retreat, or a *sociologically* necessary one? Did he change his mind, or did he just realize the battle wasn't worth fighting?"

  *   **Likely Answer:** She will argue it was sociologically necessary but philosophically imprecise. She'll claim he blurred the lines to protect biology, but that we now have the tools to be precise again (hence her career).
  *   **Follow-up:** "So your project is essentially finishing the job Popper started in the 50s but didn't have the courage to finish in the 70s? You're arguing we can handle the truth that the core of our biggest biological theory is metaphysical?"
