      *   Ensure French terms are used correctly (*raison des effets*, *ordres*, *divertissement*).

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, does Grace rescue justice?* The user asks if grace rescues justice. Careful here. Grace saves *souls*, not *states*. Pascal isn't a liberation theologian. Grace allows one to *see* the injustice without being destroyed by it, or to obey authority while knowing it's contingent. It doesn't establish a Christian polity. I need to make sure I don't imply Pascal thinks the Church should rule.
      *   *Is it "convention full stop"?* For politics, yes. For morality/eternity, no. The distinction is between *la justice humaine* and *la justice divine*. The fragment is about the former.

