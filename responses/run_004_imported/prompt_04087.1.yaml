answer: |-
  It is a pleasure to address a colleague who understands the physics at the heart of this philosophical debate. You have identified the precise fault line in contemporary scientific realism. The transition from Fresnel to Maxwell is indeed the "fruit fly" of this literature: it is the specimen everyone dissects to see what survives theory change.

  To answer your question, we must first clarify exactly what Worrall and Psillos claim survives the transition, and then see why Max Newman's 1928 objection lands on one but glances off the other.

  ### 1. The Divergence: What Survived Fresnel?

  Both Worrall and Psillos want to defend a form of realism against Laudan's Pessimistic Meta-Induction (PMI). Laudan argues that since past successful theories (like Fresnel's) had false ontologies (the ether), our current successful theories (like Maxwell's) likely do too. Both philosophers agree that Laudan is too sweeping, but they diagnose the "survival" differently.

  #### John Worrall: Epistemic Structural Realism (ESR)
  Worrall's position, articulated in his 1989 paper "Structural Realism: The Best of Both Worlds?", is that we should be realist about the **structure** of the theory, but agnostic about the **nature of the relata** (the things standing in those relations).

  In the Fresnel case, Worrall argues:
  *   **What failed:** The ontology. Light was not a vibration in a mechanical, elastic solid. There is no luminiferous ether.
  *   **What succeeded:** The mathematical structure. The differential equations describing the propagation and boundary conditions (the Fresnel equations themselves) were preserved in Maxwell's theory.
  *   **The Commitment:** We should believe that the *relations* described by the equations are real, but we cannot claim to know the intrinsic nature of the things being related. Fresnel thought the relations held between displacements of ether particles; Maxwell showed they hold between electric and magnetic field vectors. Worrall says: "Commit to the fact that there is a structure of relations here that matches the math, but don't commit to what the 'nodes' of that structure are made of."

  For Worrall, the continuity is purely structural. The "cash value" of the theory is in the constraint it places on experience via the mathematical form, not in the pictorial mechanism.

  #### Stathis Psillos: Selective Realism ("Divide et Impera")
  Psillos, in his 1999 book *Scientific Realism: How Science Tracks Truth*, argues that Worrall retreats too far. Psillos wants to save not just the structure, but specific **theoretical properties**. His strategy is to "divide and rule": separate the theory into components that were responsible for its empirical success and those that were "idle" or auxiliary.

  In the Fresnel case, Psillos argues:
  *   **What failed:** The specific mechanical hypothesis of an *elastic solid*. This was the "idle" wheel. It was a presupposition needed to make the wave mechanics intelligible to 19th-century physicists, but it did not actually generate the successful predictions.
  *   **What succeeded:** Specific physical assumptions *about the light itself*, not just the math. For example, the assumption that light waves are **transverse**, or that energy is conserved at the boundary. These are not merely mathematical structures; they are claims about physical properties.
  *   **The Commitment:** We can be realist about the specific theoretical properties that drove the success. The ether was the wrong *bearer* of the properties, but the properties themselves (transversality, etc.) were real and were inherited by the electromagnetic field.

  For Psillos, the continuity is not just abstract structure; it is specific physical content. We can know *what* the world is like (it contains transverse waves), not just that it has *some* structure isomorphic to our equations.

  #### The Crucial Distinction
  *   **Worrall:** "The equations are true of *something*, but we don't know what that something is intrinsically." (Structure: Yes. Nature: Agnostic.)
  *   **Psillos:** "The equations are true, and we know specifically which physical properties they describe, provided we discard the idle baggage." (Structure: Yes. Nature: Specific properties retained.)

  ### 2. The Newman Objection

  This brings us to Max Newman. In 1928, Newman reviewed Bertrand Russell's *The Analysis of Matter* (the precursor to Worrall's view). Newman's objection is often considered the "killer argument" against pure structuralism, and it explains why Psillos thinks his view is superior.

  #### The Argument
  Newman pointed out that **structure is trivial.**

  If you assert only that "the world has structure $S$," without specifying the *nature* of the objects that make up that structure, you have said almost nothing. Mathematically, for any collection of objects (relata), provided there are enough of them (the right cardinality), you can define relations between them such that they satisfy *any* given structural description.

  Imagine Fresnel's equations describe a specific network of relations.
  *   **Worrall says:** "The world contains a system of objects that satisfies this network of relations."
  *   **Newman asks:** "What are the objects?"
  *   **Worrall says:** "We don't know their intrinsic nature, only that they stand in these relations."
  *   **Newman replies:** "Then your claim is trivially true. I can take *any* set of points—say, the locations of teapots in orbit around Mars—and define a mapping such that they satisfy Fresnel's equations. If you refuse to constrain the *nature* of the relata, the claim that 'the structure exists' imposes no real constraint on the world other than 'there are enough things to map onto the variables.'"

  In logical terms, if you Ramsey-sentence a theory (replacing all theoretical terms with existential quantifiers: "There exist entities $x, y, z$ such that..."), you lose the ability to distinguish the theory from any other theory with the same logical structure. Structure without nature is empty.

  #### Why it hits Worrall
  Worrall's ESR is vulnerable because he explicitly refuses to commit to the nature of the relata to avoid Laudan's PMI. He wants to say the *structure* is preserved even if the *entities* change.
  *   Fresnel: Structure $S$ + Entities $E_1$ (Ether).
  *   Maxwell: Structure $S$ + Entities $E_2$ (EM Field).
  *   Worrall: Believe $S$, suspend judgment on $E_1$ vs $E_2$.

  Newman argues that if you suspend judgment on $E$, $S$ loses its grip. If you don't know what is relating, "structure" is just a pattern you can impose on anything. It renders the realist commitment vacuous. Worrall has tried to respond to this (arguing that the structure is constrained by empirical causality, not just math), but many philosophers find the tension remains: how much "nature" can you add back in before you become vulnerable to Laudan again?

  #### Why it misses Psillos
  Psillos's Selective Realism is insulated from Newman because Psillos **does** commit to the nature of the relata.

  Psillos does not say "There is some structure." He says, "There is a structure of **electromagnetic properties**."
  *   He identifies specific theoretical terms (like 'transverse vibration') that were essential to the success.
  *   He claims these terms refer to real properties, even if the substance possessing them (ether) was misidentified.
  *   Because he specifies the *kind* of property (electromagnetic, not mechanical), he restricts the domain of objects that can satisfy the theory. You cannot map Fresnel's equations onto teapots in Mars orbit and claim you have satisfied Psillos's realism, because teapots do not possess the specific intrinsic properties (charge, field intensity) that Psillos claims are real.

  By retaining commitment to specific theoretical properties, Psillos avoids the triviality charge. He pays a price, however: he must explain how we can distinguish the "essential" properties from the "idle" ones *before* the theory is overturned (the problem of hindsight), but he does not pay the Newman price.

  ### Summary for Your Discussion Group

  To synthesize this for your group:

  1.  **The Fresnel Case:** Both agree the math survived and the ether died.
  2.  **Worrall (Structuralist):** Claims only the **mathematical relations** are real. The "stuff" is unknown. This avoids Laudan (since structure survives) but invites Newman (since structure without stuff is trivial).
  3.  **Psillos (Selective Realist):** Claims specific **physical properties** (like transversality) are real, while the **mechanical medium** (ether) was idle. This avoids Newman (since he specifies the nature of the properties) but faces the challenge of distinguishing "essential" from "idle" without hindsight.

  The asymmetry regarding Newman rests entirely on the **nature of the relata**. Newman argues that structure cannot float free of the things being structured. Worrall tries to make it float; Psillos keeps it anchored to specific physical properties.

  As a physicist, you might find Psillos's view more intuitive: when you use Fresnel's equations today, you aren't just manipulating abstract symbols; you are calculating the behavior of specific physical fields with specific properties. Worrall would caution you that your confidence in those "properties" is historically fragile, while Psillos would argue that your confidence is justified because you have learned to separate the working physics from the historical baggage.
