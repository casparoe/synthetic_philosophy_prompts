          *   So, $P(\text{1st} | \text{at intersection}) = 1 / (1+p)$.
          *   $P(\text{2nd} | \text{at intersection}) = p / (1+p)$.
          *   If I change my strategy *now* to $q$ (while believing I'll play $p$ later/at the other node), does the optimal $q$ match $p$?
