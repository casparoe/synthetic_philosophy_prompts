      *   **Constraint:** Driver cannot distinguish $X$ from $Y$. Must choose a probability $p$ of continuing at *any* intersection.
      *   **Ex-Ante Calculation:** Maximize expected utility from the start.
          *   $EU(p) = (1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1$.
