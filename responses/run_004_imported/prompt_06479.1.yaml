      *   **3. Stakeholder Principle (Bauböck):**
          *   *Idea:* Voting rights belong to those with a genuine stake in the community's future (automatic membership via birth/residence, but focused on membership).
          *   *Pros:* Tries to balance inclusion with community integrity. Focuses on "membership" rather than just impact or coercion.
          *   *Cons:* Defines "stake" often via existing membership criteria (citizenship/residence), risking circularity. However, Bauböck explicitly tries to avoid the circularity by grounding it in social membership facts.
