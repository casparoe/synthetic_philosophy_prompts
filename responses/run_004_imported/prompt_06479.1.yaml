answer: |-
  Here is the breakdown based on philosophical robustness, specifically focusing on Whelan's circularity critique, non-arbitrary boundary drawing, and handling of edge cases like resident non-citizens.

  **The Logic Behind the Ranking:**
  *   **S Tier:** The **Stakeholder Principle** currently holds the strongest position in contemporary theory. It avoids the circularity of "citizenship" by grounding membership in social facts (who actually lives and builds a life there) without dissolving boundaries entirely like the All-Affected principle. It directly addresses your brother-in-law's concern (membership matters) while validating your point (residents have a stake).
  *   **A Tier:** The **All-Subjected Principle** is morally potent (coercion requires justification) but struggles with scope (does a tourist feel coercion?). It ranks high because it exposes the illegitimacy of border enforcement, but it's less constructive for defining a stable polity than Stakeholder.
  *   **B Tier:** **Territorial Residence** is the pragmatic standard. It solves the administrative problem cleanly but lacks deep normative justification (why does sleeping here grant moral authority?). It's workable but theoretically thin.
  *   **C Tier:** **All-Affected** and **Shared-Nationality** represent opposite failures. All-Affected dissolves boundaries entirely (everyone affects everyone), making democracy logistically impossible. Shared-Nationality begs the question by assuming a pre-political "nation" exists before democracy defines it, excluding residents arbitrarily.
  *   **D Tier:** The **Enfranchisement Lottery** is a mechanism for *who votes*, not a theory for *who belongs*. It sidesteps the boundary problem rather than solving it.

