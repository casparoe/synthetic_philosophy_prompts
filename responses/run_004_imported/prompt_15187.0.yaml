      *   *Section 2: What They're Missing.* Highlight the systemic/collaborative nature of robotics. Mention the "E-stop" factor.
      *   *Section 3: The Philosophy.* Confirm "Responsibility Gap." Introduce "Problem of Many Hands."
      *   *Section 4: Mediation Advice.* How to stop the fighting. Focus on post-mortem, not blame.

  6.  **Refining the Tone:**
