      *   Marcus: "It's just developmental noise. Like nipples on men."
      *   Elena: "But if it helps retention, selection keeps it."
      *   Marcus: "Variability shows it's not tuned for intercourse."
      *   Elena: "Exaptation means it gets tuned later."
      *   Marcus: "Where's the evidence of tuning?"

      *Refining for depth:* Need to make sure the exaptation point is clear. Elena needs to argue that origin doesn't dictate current function. Marcus needs to argue that variability suggests lack of specific selection pressure.

  5.  **Drafting - Second Pass (Writing the text):**

      "Come on, Marcus," Elena said, stirring her coffee. "The variability data doesn't kill the adaptationist hypothesis. If the orgasm triggers uterine contractions that retain sperm—the upsuck effect—that's a direct fitness benefit. Selection doesn't care about origins; it cares about outcomes."

      Marcus leaned against the doorframe. "Origins matter when you're distinguishing design from noise. The clitoris and penis are homologous structures. They develop from the same embryonic tissue. Saying the female orgasm is an adaptation is like saying male nipples are for lactation potential. It's a developmental byproduct. The capacity is there because males need it; females get it along for the ride."

      "That's the Gould-Lloyd line, I know," Elena countered. "But even if it started as a spandrel, why wouldn't selection co-opt it? Exaptation. Once the neural circuitry exists, if orgasmic women conceive more often due to sperm retention, alleles promoting that response spread. It becomes refined. You're treating 'byproduct' as a permanent stain."

      "Because the refinement isn't there," Marcus shot back. "If this were a tight adaptation for intercourse-specific sperm retention, the anatomy should be consistent. It's not. The distance between the clitoral glans and the vaginal opening varies wildly between women. If selection were optimizing for insemination success via orgasm during penetrative sex, that variance should be minimized. Instead, many women don't orgasm from intercourse alone. That's not a tuned mechanism; that's developmental noise."

      "Variability exists in every trait," Elena argued. "Height, vision, immune response. Just because it's not universal doesn't mean it's not functional. Maybe it's a conditional adaptation—mate choice. Only orgasm when the partner is genetically compatible. That explains the inconsistency."

      "That's just adding epicycles," Marcus sighed. "Now you're inventing a psychological filter to save the physiological hypothesis. Look, the 'why leave it?' objection is weak. Selection doesn't remove neutral traits unless they're costly. Orgasm isn't costly enough to be selected against, so it persists as a harmless byproduct. You're assuming every feature must be a screw in the machine. Sometimes it's just grease."

      "But grease doesn't pulse," Elena smiled. "The physiological response is complex. Vasocongestion, muscle contractions. It's metabolically expensive to build that machinery. If it were truly neutral, drift should have degraded it over millennia. The fact that it's maintained suggests maintenance costs are being paid for a reason."

      "Or," Marcus said, pushing off the frame, "it's linked to libido, which *is* adaptive. You need desire to mate. The orgasm might just be the shutdown switch for the arousal system, a neurological reset that happens to feel good. You're conflating the feeling with the function. The function is to encourage mating; the orgasm is just the qualia of the pathway males also use."

      "So you admit the pathway is utilized," Elena pressed. "If it's utilized to encourage mating, isn't that a function? Where do you draw the line between 'utilized byproduct' and 'adaptation'? If selection maintains it because it encourages mating, it's an adaptation by definition."

      "The line is specific design versus general consequence," Marcus said. "If I build a car engine that hums, and the hum scares away birds, the hum isn't an adaptation. It's a byproduct. If you argue the hum was *selected* to scare birds, show me the tuning. Show me the variance reduction. Until then, Occam's Razor favors the homology hypothesis. Don't turn every echo into a song."

      "And don't dismiss the song just because you didn't hear the singer," Elena replied, finishing her coffee. "We'll need more data on the contractions."

      "And I'll need more than just-so stories," Marcus said.

