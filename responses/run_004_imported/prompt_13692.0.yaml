prompt: |-
  Hey, I'm writing a piece on the adaptationism-vs-spandrels fight in evolutionary biology and I don't want to keep it all abstract, so lets ground it in one specific case: the female orgasm. Can you write me a dialogue between two evolutionary biologists -- one convinced its a genuine adaptation (pick whichever functional story she likes best, mate-choice/quality-detection or the sperm-retention "upsuck" idea) and one who's firmly in the Gould/Lloyd camp and thinks its just a byproduct of the shared developmental pathway between the clitoris and penis, basically a fancier version of the male-nipple thing. I want actual back-and-forth, not two monologues -- have the adaptationist press on how a "mere" byproduct could later get finely co-opted (exaptation) without that just collapsing into her own view, and have the byproduct side answer the obvious "why would selection just leave something this useful lying around" objection, plus deal with the anatomical variability evidence that's usually cited against a tight intercourse-specific function. Neither side should be a pushover. Keep it around 600-700 words.
