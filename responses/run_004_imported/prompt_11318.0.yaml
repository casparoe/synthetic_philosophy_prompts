      *   *Argument for Membership:* Focus on the "Voluntary Association" model. You pay, you decide. Analogy: A private club.
      *   *Argument for Affected Parties:* Focus on "Externalities." The cost is exported. Analogy: Pollution. If a factory pollutes a neighbor's land, the neighbor should have a say.
      *   *The "All-Affected Principle":* Cite this political theory concept. It's the precise term the user is looking for.
      *   *The Legal Nuance:* Crucial distinction. Is the street *private* or *public*?
          *   If private: HOA has strong rights, but city may still regulate traffic impact.
          *   If public: HOA generally *cannot* close it unilaterally. City council should vote. If the city delegated this to the HOA, that's where the democratic deficit lies.
      *   *The "Boundary Problem":* Reference Frederick Whelan or Robert Dahl. How do we draw the circle of "the people"?
      *   *Conclusion:* The discomfort is valid. It highlights a gap between private governance and public impact.

  6.  **Refining the Tone:**
