      *   Be careful not to endorse harmful behaviors (like starving) as "logical."

  6.  **Self-Correction/Edge Case Consideration:**
      *   *Did I address the "starving yourself" point?* Need to be careful here. Anorexia isn't usually a status signal; it's a pathology. However, extreme dieting for aesthetics *can* be a signal of discipline/resources. I need to distinguish between signaling and pathology.
      *   *Is "waste" the right word?* In economics, yes (conspicuous consumption). In biology, it's "cost."
      *   *What about religion?* Religious fasting is a classic costly signal. Worth mentioning.

