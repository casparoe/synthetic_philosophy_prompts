prompt: |-
  I've been reading about the handicap principle in animals - like how peacocks have those huge tails that make it harder to fly and escape predators, or how gazelles do that weird stiff legged jump (stotting) right in front of lions instead of just running away. The idea being that these count as "honest signals" precisely because only a genuinely strong, healthy animal could afford to survive with that handicap, so the cost itself is what makes the signal trustworthy. Doesnt that mean the same logic carries over to people, so the more wasteful, painful or expensive a status display is (starving yourself for a certain look, blowing your savings on a wedding, brutal hazing to join a group), the more honest a signal of quality it automatically is, since bigger sacrifice equals bigger proof?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Concept:** The Handicap Principle (Zahavi's theory).
      *   **Examples Given:** Peacock tails, gazelle stotting.
      *   **User's Hypothesis:** Does this logic apply directly to humans? Specifically, does *more* waste/pain/cost automatically equal a *more honest* signal of quality in human social contexts (e.g., extreme dieting, expensive weddings, hazing)?
      *   **Underlying Assumption:** Cost = Honesty. Therefore, maximizing cost maximizes honesty/value.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the Handicap Principle valid in biology?* Yes, generally accepted as a major mechanism for honest signaling.
      *   *Does it apply to humans?* Yes, evolutionary psychology and anthropology often apply it to human behavior (conspicuous consumption, ritual, etc.).
      *   *Is the user's conclusion correct ("bigger sacrifice equals bigger proof")?* This is the tricky part. It's *partially* true but oversimplified. There are diminishing returns, fake signals (counterfeiting), and maladaptive outcomes. The signal must be *correlated* with the underlying quality, not just costly for the sake of cost.

  3.  **Deconstruct the Argument:**
      *   **Point 1: The Core Logic Holds.** Yes, costly signaling theory is a dominant framework for understanding human status displays. Expensive weddings, philanthropy, risk-taking, and even body modification can be seen through this lens.
      *   **Point 2: The "Automatic" Fallacy.** Cost doesn't *automatically* make it honest. It makes it *harder to fake*, but people can still go into debt (fake wealth), use steroids (fake fitness), or endure hazing without having the desired traits (resilience vs. conformity).
      *   **Point 3: Maladaptation.** In biology, a trait that becomes *too* costly can lead to extinction (e.g., Irish Elk antlers). In humans, extreme signaling can be self-destructive (anorexia, bankruptcy) without actually signaling "fitness" in a modern context.
      *   **Point 4: Context Matters.** A signal is only honest relative to the environment. Burning money signals wealth *if* you have money. If you borrow it, it signals foolishness.
      *   **Point 5: Cultural Arbitrariness.** Unlike peacock tails (genetically fixed), human signals are culturally defined. What counts as a "handicap" changes.

  4.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by confirming their understanding of the biological principle. It's a solid intuition.
      *   *Confirm the Application:* Yes, this is called "Costly Signaling Theory" in anthropology/psychology. Give examples (potlatch, philanthropy, extreme sports).
      *   *Nuance the "Automatic" Claim:* This is the most important correction.
          *   *Counterfeiting:* Debt, credit, cosmetic surgery. Humans are good at faking costs.
          *   *Correlation vs. Causation:* The cost must be *differentially costly*. It must hurt a low-quality individual more than a high-quality one. If a poor person goes into debt for a wedding, it's not an honest signal of wealth; it's a signal of financial irresponsibility.
      *   *Discuss the "Runaway" Problem:* Mention Fisherian Runaway Selection. Sometimes signals get too big and become detrimental to survival (e.g., eating disorders). The signal becomes detached from the actual fitness.
      *   *Hazing Specifics:* Address the hazing example. It signals commitment, not necessarily "quality" in a biological sense. It filters for loyalty, not just strength.
      *   *Modern Context:* Money decouples from biological fitness. Burning cash signals resources, but not necessarily health or good genes.
      *   *Conclusion:* Summarize. The logic holds, but with major caveats regarding faking, cultural context, and diminishing returns.

  5.  **Refining the Tone:**
