answer: |-
  This is an excellent close reading of a notoriously difficult passage. You have identified the precise fault line in Mill's argument: the tension between **instrumental justification** (better outcomes via expertise) and **intrinsic justification** (justice requires recognizing superior worth). You have also spotted the potential sleight of hand in the claim that unequal weighting is "incommensurable" with exclusion.

  To help you work through this with Priya, and to satisfy your own philosophical curiosity, let's reconstruct Mill's argument, disentangle the justificatory threads, and evaluate the consistency of the "incommensurability" claim against his "no pariahs" principle.

  ### 1. The Justificatory Work: Epistemic vs. Desert

  You are correct that there are two distinct strains of argument here, but on Mill's specific philosophical terms, they are not actually separable. To understand why, we have to look at how Mill modifies Utilitarianism.

  **The Epistemic Strain:**
  Mill clearly believes that weighting votes by competence leads to better legislative outcomes. He fears the "tyranny of the majority," specifically a class-based tyranny where the numerically superior working class votes for policies that confiscate wealth or hinder economic progress. Giving more weight to the educated (whom he assumes are more likely to understand long-term consequences) is an insurance policy for good governance.
  *   *Textual evidence:* "If the more ignorant does not yield his share of the matter to the guidance of the wiser man, the wiser man must resign his to that of the more ignorant." This implies a functional necessity: someone must guide, or the ship sinks.

  **The Desert/Justice Strain:**
  However, Mill explicitly frames this as a matter of *justice*, not just prudence. He writes: *"if the institutions of the country virtually assert that they are of the same value, they assert a thing which is not."*
  *   *Textual evidence:* "One of the two, as the wiser or better man, has a claim to superior weight."

  **The Synthesis:**
  Why does Mill think these coincide? Because Mill is not a standard hedonistic utilitarian; he is a **perfectionist utilitarian**. In *Utilitarianism*, he argues that some pleasures are "higher" than others. In *Representative Government*, he argues that some *judgments* are "higher" than others.

  For Mill, justice involves giving things their due. If political power is a tool for managing the common good, then the person better equipped to wield that tool *deserves* more of it, not merely because they will use it better (epistemic), but because to treat unequal capacities as equal is a falsehood that violates the rational order of things.
  *   **The "Joint Business" Analogy:** This is doing the heavy lifting. In a private business partnership, if Partner A invests \$10 and Partner B invests \$100, it would be unjust to give them equal voting rights on company strategy. Mill treats political citizenship as a similar "joint stock" company. The "capital" invested is not money, but **capacity for rational judgment**.
  *   **Conclusion on Justification:** Mill is making a hybrid argument. The *reason* we care about competence is epistemic (better outcomes), but the *right* to exercise that competence is based on desert (justice requires recognizing superior capacity). He assumes they coincide because he believes the "wiser" man naturally contributes more to the general welfare, and justice requires that contribution be recognized.

  ### 2. The "Incommensurable" Claim: Distinction or Dodge?

  This is the weakest link in Mill's chain, and your skepticism is well-founded. Mill claims that **Exclusion** (0 votes) and **Plural Voting** (1 vote vs. 2 votes) are "incommensurable."

  **Mill's Conceptual Distinction:**
  Mill is distinguishing between **Status** and **Influence**.
  1.  **Exclusion:** Denies the individual's status as a member of the political community. It says, "You have no stake in this." This wounds dignity and creates a "pariah."
  2.  **Weighting:** Acknowledges status ("You have a voice") but differentiates influence ("Your neighbor's voice counts more").

  Mill argues that as long as the base vote is universal, the *principle* of inclusion is satisfied. The differentiation of weight is merely a technical adjustment to ensure quality, not a denial of membership.

  **The "99 Votes" Objection:**
  You ask: *If the wise get 99 votes and the rest get 1, isn't that exclusion in substance?*
  Mill would answer: **Yes, if the system is rigid.** But **No, if the system is permeable.**

  This is where Mill's argument relies on a crucial, often overlooked condition. Mill does not support a permanent aristocracy of voters. He supports a **meritocratic** one. He explicitly states that the higher weighting should be attached to occupations or educational attainments that are *open to all*.
  *   If a worker can study, pass a test, and gain the extra vote, then the distinction is not between *classes of people*, but between *levels of attainment*.
  *   Therefore, the "incommensurability" holds only if social mobility is real. If the "wise" class is hereditary or closed, then plural voting *does* become exclusion in substance, and Mill's distinction collapses.

  **Verdict:** It is not merely a dodge, but it is a **conditional** distinction. It holds conceptually (status vs. power) but fails practically if the barriers to gaining "weight" are too high.

  ### 3. Consistency with "No Pariahs"

  You noted the tension with Mill's earlier claim: *"there ought to be no pariahs... no persons disqualified, except through their own default."*

  Does plural voting violate this?
  *   **Universal Suffrage:** Mill insists everyone gets *at least one vote*. This satisfies the "no pariahs" condition. Everyone is a shareholder in the "joint business."
  *   **Disqualification:** Mill does support disqualifying those who cannot read, write, or do basic arithmetic. He considers this "their own default" (assuming the state provides education).
  *   **Plural Voting:** This is not a disqualification; it is a **bonus**.

  **Reconstruction of Consistency:**
  1.  **Premise 1:** To avoid pariahdom, every citizen must have a recognized stake in the state (1 vote).
  2.  **Premise 2:** To ensure good governance, influence must be proportional to competence (plural voting).
  3.  **Premise 3:** Competence is not fixed by birth but by education/occupation (permeability).
  4.  **Conclusion:** A system with universal base suffrage + plural voting satisfies both dignity (no pariahs) and justice (competence rewarded).

  On Mill's own terms, this holds together *provided* Premise 3 is true. If the "competent" class becomes a closed caste, the system violates the "no pariahs" principle because the lower-weighted group becomes a permanent underclass with no effective power.

  ### 4. Argument Reconstruction (Premise by Premise)

  To help you debate Priya, here is the argument reconstructed formally, highlighting where the vulnerabilities lie.

  *   **P1 (Nature of Politics):** Political decisions are "joint concerns" (like a business partnership), not matters of "private right."
  *   **P2 (Principle of Justice):** In joint concerns, justice requires that decision-making weight be proportional to the capacity to manage the interest wisely (not strictly equal).
  *   **P3 (Epistemic Claim):** Some citizens possess greater knowledge/virtue relevant to political management than others.
  *   **P4 (Measurement Claim):** While we cannot measure individual wisdom perfectly, we can approximate it via education/occupation across groups.
  *   **P5 (Dignity Constraint):** To prevent class antagonism and protect dignity, no citizen should be wholly excluded from the franchise (Universal Base Suffrage).
  *   **P6 (Permeability Constraint):** To prevent caste formation, the criteria for extra voting weight must be achievable by any citizen through effort/education.
  *   **C (Conclusion):** A graduated franchise (universal base + plural voting for the educated) is more just and effective than strict "one person, one vote."

  ### 5. Evaluation: Does it Hold Together?

  **Where it holds:**
  Mill successfully distinguishes between the *right to participate* (dignity) and the *weight of participation* (efficacy). If you accept P2 (that political justice is like business justice), the argument is internally consistent. It avoids the "elitism" charge *if* P6 is strictly enforced. Mill is not arguing for rule by the rich; he is arguing for rule by the educated, with the door open for everyone to become educated.

  **Where it breaks (Your leverage points):**
  1.  **The Analogy Flaw (P1):** Is the state really like a business? In a business, the goal is profit, and investors with more capital *should* have more say. In a democracy, the goal is often legitimacy and the protection of rights. A minority interest in a business can be outvoted on profit strategy; a minority interest in a polity often needs protection *from* the majority. Mill's analogy ignores the need for minorities to have veto power over rights violations, regardless of "competence."
  2.  **The "Ascertainment" Problem (P4):** Mill admits it is "impossible" to judge individuals, so he judges "bodies." This leads to class bias. In 19th-century England, "education" and "occupation" were proxies for class and race. Even with permeability, the test itself might be biased toward the culture of the ruling class.
  3.  **The Incommensurability Limit:** As you noted, if the weighting is too skewed (99 vs 1), the "base vote" becomes symbolic. Mill doesn't specify the ratio. If the "wise" always outvote the "ignorant" regardless of numbers, the "joint concern" becomes a sham, and P5 (Dignity) is violated in practice if not theory.

  ### Summary for Your Discussion with Priya

  You can tell Priya that Mill's argument is more sophisticated than simple elitism, but it rests on specific conditions:

  1.  **It's not just epistemic:** Mill genuinely believes it is *unjust* to treat unequal capacities as equal. It's a claim about truth, not just utility.
  2.  **The "Incommensurable" claim relies on mobility:** Mill is only safe from the charge of creating "pariahs" if the extra votes are attainable by anyone. If the test is too hard or the education too expensive, his distinction between "weighting" and "exclusion" collapses.
  3.  **The Business Analogy is the weak point:** Treating citizenship like a business partnership prioritizes *outcomes* (good management) over *agency* (equal ownership). If you believe democracy is about equal agency regardless of competence, Mill's P2 is where you must disagree.

  Mill's system holds together logically, but it is fragile empirically. It requires a society where education is truly universal and merit is truly recognized—a condition Mill himself worried his own society did not meet.
