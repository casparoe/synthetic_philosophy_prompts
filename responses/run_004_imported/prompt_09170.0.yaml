answer: |-
  You have correctly identified a logical asymmetry in how the physics community communicates Bell’s Theorem. You are right that the theorem is a disjunction: it proves that **Local Realism** is false, meaning we must abandon either **Locality** (no faster-than-light influence) or **Realism** (definite properties independent of measurement).

  However, the dominance of the term "nonlocality" is not a failure of scientific rigor. It is the result of historical context, the difficulty of defining "realism," and the specific operational needs of quantum information science.

  ### 1. Historical Context: The "EPR" Target
  Bell’s Theorem was not developed in a vacuum; it was a direct response to the 1935 EPR paper. Einstein, Podolsky, and Rosen argued that if quantum mechanics were complete, it would require "spooky action at a distance." They assumed that physics *must* be local, and therefore concluded that quantum mechanics must be incomplete (lacking "elements of reality").

  Bell’s work showed that you cannot save locality simply by adding hidden variables. Because the original debate was framed as a defense of **Locality** against the "spookiness" of quantum mechanics, the term "nonlocality" became the standard shorthand for the violation of Bell's inequalities.

  ### 2. The Ambiguity of "Realism"
  While "Locality" is a precise geometric constraint defined by light cones, "Realism" is philosophically slippery. In Bell’s context, it is often defined as **Counterfactual Definiteness**—the idea that an unmeasured particle still possesses a definite value for a property.

  *   **The Problem:** If researchers said they were sacrificing "realism," it sounds like a vague philosophical statement about the nature of existence.
  *   **The Solution:** "Nonlocality" provides a concrete, physical-sounding description of the phenomenon: the correlations between distant particles are stronger than any local model can explain. It is a more useful "brand" for a physical resource than "non-realism."

  ### 3. Operational vs. Ontological Nonlocality
  In modern research, particularly **Device-Independent Cryptography**, "nonlocality" is often used as an **operational** term rather than an ontological one.

  In this field, researchers treat devices as "black boxes." If the boxes produce correlations that violate a Bell inequality, they are said to be "nonlocal." This doesn't necessarily mean the researchers believe in "spooky action"; rather, they are using "nonlocality" as a label for a specific **resource**. 
  *   **Why it matters:** In cryptography, "nonlocality" certifies that the outcomes were not pre-determined (Realism) and that the devices were not communicating (Locality). It is a mathematical guarantee of privacy.

  ### 4. The Alternative: Contextuality
  You asked why researchers don't remain agnostic. In truth, many do. When researchers want to emphasize the sacrifice of realism, they use the term **Contextuality**.

  Contextuality is a more general framework that shows measurement outcomes depend on the "context" (the specific experimental setup) rather than pre-existing values. However, "nonlocality" remains the default because it highlights the tension with **Relativity**—the other pillar of modern physics. This tension is viewed as the most dramatic and physically significant aspect of the theorem.

  ### Summary
  The community focuses on "nonlocality" because it is historically rooted, operationally precise for information theory, and highlights the fundamental conflict with our classical understanding of spacetime. While "contextuality" is the more accurate term for the loss of realism, "nonlocality" has become the standard technical term for the *resource* that makes quantum technologies possible.
