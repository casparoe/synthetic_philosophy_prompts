prompt: |-
  I'm a retired condensed-matter physicist (forty-one years in the lab before I finally hung up my coat), and lately I've fallen into a philosophy rabbit hole via a "philosophy for curious retirees" reading group at my local library. Two weeks ago we got onto causation, specifically something called "causation by omission," and its been nagging at me since, because causation is a concept I thought I had cold after four decades of physics.

  Here's my hangup, in my own words before I went looking for the fancy version of it: in physics a cause is always some kind of transfer — energy, momentum, a force doing work, a bond breaking. There's an actual physical process connecting cause and effect, which I gather is basically the intuition some philosophers built into "conserved-quantity" theories of causation. But an omission is, by definition, the absence of any such process. Take the standard example the books use: a lifeguard sees someone struggling and just doesn't move. Nothing physical passes between the lifeguard sitting still and the drowning; the drowning proceeds by ordinary physiology exactly as it would on an empty beach with no lifeguard at all. So in what sense did the not-jumping-in cause the death, rather than merely being a circumstance in which some other, perfectly ordinary causal process ran its course unimpeded? And if inaction counts as a cause simply because, counterfactually, things would've gone differently had the lifeguard acted, then why isn't every other able-bodied adult in the world who also failed to jump in equally a cause of the death? Somebody has to explain why we pin it on the lifeguard and nobody else, and I honestly can't tell whether that "somebody" is pointing at a further fact about the world's causal structure or just a fact about who we happen to hold to a duty.

  From some reading around, I gather this is a real fork in the metaphysics of causation: counterfactual theorists (Lewis is the name that keeps coming up) are willing to just count omissions as genuine causes, hard-nosed process theorists resist that and reach for weaker labels like "quasi-causation" instead, and at least one writer I ran into thinks the "which omission counts" question gets settled by social norms and expectations rather than by anything in the world's causal structure itself. What I'd like from you is an essay that actually adjudicates between these rather then surveying them politely. Take the physical-process objection to omissive causation seriously, take the "why the lifeguard and not everyone else" problem seriously as a cost for the counterfactual side, show how each camp responds to the other's strongest argument, and then commit to a real verdict on whether omissions can ever genuinely be causes. Something like "omissions are causes, but only relative to a contextually fixed norm, and that's not a scandal" counts as an answer; "reasonable philosophers disagree" does not.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired condensed-matter physicist (41 years experience). Deeply intuitive about physical causation (transfer of energy/momentum/force). Skeptical of metaphysical hand-waving. Wants a rigorous, decisive answer, not a survey.
      *   **Topic:** Causation by Omission (e.g., the lifeguard who doesn't save a drowning swimmer).
      *   **Core Conflict:** Physical process theories (cause = conserved quantity transfer) vs. Counterfactual theories (cause = difference-making) vs. Normative/Contextual theories (cause = violation of expectation/duty).
      *   **Specific Problems to Address:**
          1.  The "No Process" Objection: How can nothing cause something?
          2.  The "Too Many Causes" Problem (The Lifeguard Problem): Why the lifeguard and not every other bystander who also didn't jump in?
      *   **Constraint:** Must adjudicate/commit to a verdict. "Reasonable philosophers disagree" is forbidden.
      *   **Tone:** Respectful of the physicist's background, rigorous, analytical, but accessible. No fluff.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Process/Mechanistic View (Salmon, Dowe):* Causation requires a physical link (mark transmission, conserved quantities). Omissions fail this test. They are "quasi-causes" or explanatory factors, not ontological causes.
      *   *Counterfactual View (Lewis):* $C$ causes $E$ if $E$ would not have happened had $C$ not happened. Omissions fit easily here (If the lifeguard *had* jumped, death wouldn't have happened). But this leads to the "proliferation" problem (everyone who didn't jump is a cause).
      *   *Normative/Contextual View (Hart & Honoré, McGrath):* Causation is partly a social/legal construct. We select causes based on norms, duties, and expectations.

  3.  **Evaluate the Arguments (The "Adjudication" Phase):**
      *   *Physicist's Intuition:* The physicist is right about the *ontology*. There is no "negative energy" or "absence particle" flowing from the lifeguard to the swimmer. The drowning is caused by water in lungs, hypoxia, etc.
      *   *The Counterfactual Strength:* It captures *dependence*. The death *depended* on the lifeguard's inaction in a specific way it didn't depend on the random bystander's inaction (because of the setup).
      *   *The "Too Many Causes" Weakness:* If we treat all counterfactual dependencies as equal, causation becomes trivial. Everything is connected to everything via absence.
      *   *The Normative Solution:* This seems to be the only way to distinguish the lifeguard from the bystander without inventing fake physics. But does it make causation *subjective*?
      *   *Synthesis:* We need to distinguish between *causal structure* (the physics) and *causal selection* (the explanation). The physicist is looking for the former; the legal/moral problem requires the latter.

  4.  **Formulate the Verdict:**
      *   I cannot say "Omissions are physical causes" because that violates the physicist's (and science's) understanding of conservation laws.
      *   I cannot say "Omissions are never causes" because that makes nonsense of law, medicine, and daily life (e.g., "lack of insulin caused the coma").
      *   *The Winning Position:* **Causal Pragmatism/Contextualism.** Omissions are not *ontological primitives* in the physical sense (no transfer), but they are *genuine causal explanations* relative to a system of norms or a model of expected behavior. The "cause" is not a thing in the world, but a relation between the world and a model of how it *should* work.
      *   *Refining the Verdict:* I need to be careful not to sound like I'm dismissing physics. I need to validate the physicist's intuition while showing why it's insufficient for the *concept* of causation as used in complex systems (including social ones).
      *   *Decision:* I will argue for a **Hybrid View**. Physical causation is the bedrock (process theory), but "causation by omission" is a higher-level explanatory tool that relies on counterfactuals *constrained by norms*. It is "real" causation in the sense of explanation and intervention, but not "real" in the sense of particle physics. I will commit to the view that **omissions are causes, but only relative to a normative or systemic expectation.** This isn't a scandal; it's a feature of high-level causation.

  5.  **Drafting the Essay - Section by Section:**
      *   **Introduction:** Acknowledge the physicist's background. Validate the "conserved quantity" intuition. State the thesis clearly.
      *   **The Physical Objection (The Physicist's Home Turf):** Explain why process theorists are right about ontology. No "negative force." The drowning is positive physics.
      *   **The Counterfactual Trap:** Explain Lewis. Show why it solves the "dependence" issue but fails the "proliferation" issue (the bystander problem).
      *   **The Normative Turn:** Introduce the idea that causation is *selective*. We don't list all conditions (oxygen, gravity, lifeguard's stillness). We list the *abnormal* ones.
      *   **The Adjudication/Verdict:** Combine them.
          *   Ontologically: Process theory wins (no magic absence).
          *   Explanatorily/Pragmatically: Normative Counterfactualism wins.
          *   Conclusion: Omissions are "causes" in the same way "friction" is a force—it's a macroscopic description of constraints, not a fundamental particle interaction.
      *   **Addressing the "Scandal":** Why isn't this subjective? Because norms (like duties) are objective social facts, just as friction is an objective macroscopic fact.

  6.  **Refining the Tone:**
      *   Avoid condescension. Use physics analogies (frame of reference, coordinate systems, effective field theories).
      *   Ensure the verdict is sharp. No "on the one hand, on the other hand" waffling at the end.
      *   *Self-Correction during drafting:* I initially thought about saying "omissions aren't real causes." But the prompt asks if they can *ever* be genuinely causes. If I say "no," I ignore the utility of the concept. If I say "yes," I offend the physicist. The middle path: They are *functional* causes, not *fundamental* causes. I need to make sure I don't sound like I'm saying "it's all in your head." Norms are external.
      *   *Key Analogy:* A circuit. An open switch causes the light to go out. Is the "openness" a flow of electricity? No. Is it a cause? Yes, in the context of the circuit's design.

  7.  **Final Polish:** Check against constraints.
      *   Did I address the lifeguard vs. bystander? Yes (norms/duty).
      *   Did I address the physical process objection? Yes (ontology vs. explanation).
      *   Did I commit? Yes (Contextual Realism).
      *   Is it an essay? Yes.

  8.  *(Final thought before generating)*: Make sure to explicitly mention that the physicist's intuition is correct *for fundamental physics*, but causation in the special sciences (biology, sociology) requires a different vocabulary. This validates their expertise while expanding the scope.

  **(Self-Correction Note):** I need to be careful with the word "Real." If I say "it's not real physics but real explanation," that might sound like a cop-out. I should frame it as **Causal Selection**. The world contains the physical processes; *we* select the causes based on interests/norms. Therefore, omissions are causes *for us*, which is the only sense of "cause" that matters outside fundamental physics. Okay, I will commit to **Causal Contextualism**.

  Let's write.
answer: |-
  **Title:** The Absence of Force: A Verdict on Causation by Omission

  **To:** A Retired Condensed-Matter Physicist
  **From:** Philosophical Adjudication
  **Subject:** Adjudication on the Ontological Status of Omissive Causation

  You have spent forty-one years tracking conserved quantities. You know that if a billiard ball moves, momentum was transferred. If a bond breaks, energy was supplied. In your laboratory, "nothing" does not do work. "Nothing" exerts no force. Your intuition that causation requires a physical process is not just a hunch; it is the bedrock of the Standard Model. When philosophers talk about "causation by omission," your alarm bells should ring. They do in mine, too.

  However, you have also identified the precise fracture point where fundamental physics fails to capture the causal vocabulary of the rest of human life—medicine, law, engineering, and history. If we stick strictly to your definition of causation (transfer of conserved quantities), we cannot say that a lack of insulin caused a coma, that a missing gasket caused an engine failure, or that a lifeguard's inaction caused a death. We would be forced to say only that "physiological processes proceeded unimpeded" or "combustion gases escaped the chamber." While physically accurate, this is explanatorily useless.

  You asked for a verdict, not a survey. You want to know if omissions can *genuinely* be causes, or if this is merely a linguistic convenience masking a lack of physical mechanism. You also want to know how we solve the "proliferation problem" (why the lifeguard and not the bystander?).

  Here is the adjudication.

  ### I. The Physical Objection is Ontologically Correct
  First, we must validate your physical intuition. The "Process Theory" of causation (championed by philosophers like Phil Dowe and Wesley Salmon) aligns with your laboratory experience. It argues that for $C$ to cause $E$, there must be a continuous physical process connecting them, typically involving the transmission of a conserved quantity (energy, momentum, charge).

  In the lifeguard case, you are absolutely right: There is no physical signal, force, or energy transfer from the stationary lifeguard to the drowning swimmer. The swimmer dies due to hypoxia, caused by water in the lungs, caused by buoyancy failure, etc. The lifeguard's stillness is not a "negative force" pushing the swimmer under. Ontologically, the universe contains only the positive events: the swimming, the struggling, the drowning, and the lifeguard sitting.

  If we define causation as *fundamental physical production*, then **omissions are not causes.** To claim otherwise is to reify "nothing" into a "something," which violates the conservation laws you spent your career upholding. If a philosopher tells you that "absence" is a physical entity, they are mistaken.

  ### II. The Counterfactual Trap
  However, rejecting omissive causation entirely creates a different problem. It renders the concept of causation useless for any complex system where *prevention* is a function. Consider a thermostat. When the temperature drops, the heater turns on. If the thermostat fails to signal, the pipes freeze. In engineering, we say the "failure to signal caused the freeze." If we deny this, we cannot troubleshoot systems.

  This is where David Lewis's Counterfactual Theory steps in. It argues $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
  *   Had the lifeguard jumped ($C$), the death would not have occurred ($E$).
  *   Therefore, the not-jumping caused the death.

  This captures the *dependence* of the outcome on the inaction. But as you noted, it fails the "proliferation test." Had *I* (a bystander on another continent) jumped in, the death also would not have occurred (logically, if I were there). Had *you* jumped in, same result. If counterfactual dependence alone makes a cause, then every able-bodied person on Earth is a cause of the death. This dilutes the concept of causation to meaninglessness. It treats the lifeguard's inaction and my inaction as ontologically identical "causes," differing only in spatial coordinates.

  This is the cost of the Counterfactual view: It saves the intuition that omissions matter, but it loses the ability to distinguish *which* omissions matter.

  ### III. The Normative Resolution
  The solution to the proliferation problem lies in recognizing that causation, outside of fundamental particle physics, is not just a relation between events; it is a relation between events and a **model of expected behavior**.

  This is the "Normative" or "Contextualist" view (associated with H.L.A. Hart, Tony Honoré, and more recently, Jonathan Schaffer). It posits that we do not select causes based solely on physical topology or raw counterfactual dependence. We select causes based on **deviation from a norm**.

  In a physical system, the "norm" is often the equilibrium state or the designed function.
  *   **Engine:** The norm is that the gasket seals. The absence of the seal is a deviation. The absence of the gasket is the cause of the leak.
  *   **Lifeguard:** The norm is defined by the social contract/employment duty. The lifeguard is part of the "safety system" of the beach. The bystander is not.

  When we ask "What caused the death?", we are not asking "What physical processes occurred?" (We know that: gravity, fluid dynamics, biology). We are asking "What factor, *relative to the expected functioning of the system*, made the difference?"

  The lifeguard's inaction is a cause because it represents a **failure of a specific preventative mechanism that was supposed to be active.** The bystander's inaction is not a cause because no such mechanism was expected. The distinction is not in the physics of the bodies (both are human masses sitting still); the distinction is in the *system description*.

  ### IV. The Verdict
  You asked me to commit. Here is the verdict:

  **Omissions are not fundamental physical causes, but they are genuine special-science causes.**

  To treat this as a scandal is to commit a category error. It is akin to demanding that the concept of "friction" be explained by fundamental particle interactions without remainder. Friction is real, but it is a macroscopic, emergent phenomenon that depends on how we define the surfaces in contact. It is not a fundamental force in the Standard Model, yet it is objectively true that friction caused the block to stop.

  Similarly, causation by omission is an **emergent, high-level causal relation** that exists only relative to a framework of norms, functions, or expectations.

  1.  **On the Physics:** You are right. There is no "omission particle." There is no transfer of conserved quantities from the lifeguard to the swimmer. If you are doing fundamental physics, omit omissions from your ontology.
  2.  **On the Causation:** The counterfactual theorists are right that dependence matters, but wrong that *all* dependence counts.
  3.  **On the Lifeguard:** The distinction between the lifeguard and the bystander is not found in the arrangement of atoms, but in the **causal model** we overlay on the atoms. The lifeguard is a component in a safety system; the bystander is environmental background. When a component fails to function, we label that failure a "cause." When the background remains background, we do not.

  ### V. Why This Is Not a "Scandal"
  You worried that if the answer relies on "norms" or "duties," then causation becomes subjective—a matter of opinion rather than fact. This is the fear that we are sacrificing the world's structure for our social preferences.

  But norms, in this context, are not merely subjective feelings. They are **objective structural constraints** on the system.
  *   In a machine, the "norm" is the engineering schematic. It is an objective fact that the gasket *should* seal.
  *   In biology, the "norm" is homeostasis. It is an objective fact that the pancreas *should* produce insulin.
  *   In society, the "norm" is the assigned role. It is an objective social fact that the lifeguard *is employed to save*.

  When we say "the omission caused the effect," we are stating a fact about the relationship between the physical history of the world and the *functional architecture* of the system in question.

  ### Conclusion
  So, can omissions be genuine causes? **Yes, but only relative to a contextually fixed norm.**

  This is not a retreat into subjectivity. It is an acknowledgment that "causation" is a tool used by agents (physicists, mechanics, judges) to navigate a world of infinite complexity. We cannot track every conserved quantity in the universe to explain why a plant died. We track the *absence of water* because water was the variable constrained by the gardener's duty.

  Your instinct that "nothing cannot do something" is correct for fundamental ontology. But the universe contains systems (biological, mechanical, social) where the *absence* of an expected intervention is the most salient feature of the history. To deny omissive causation is to deny the reality of systems engineering, medicine, and law. To accept it without the normative constraint is to drown in infinite counterfactuals.

  The lifeguard caused the death not because his stillness emitted a "death ray" of negative energy, but because his stillness was a **system failure** in a context where function was expected. The bystander did not cause the death because their stillness was **system background**.

  The physics is in the drowning. The causation is in the explanation. And the explanation requires the norm.
