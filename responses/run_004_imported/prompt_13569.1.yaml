answer: |-
  **MEMORANDUM**

  **TO:** Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on FY2024 Allocation Rule

  **Recommendation**
  For the upcoming fiscal year, we will adopt a **Tempered Fractional Splitting rule**. Specifically: **50% of each quarter's pool will be allocated to the top-ranked intervention, with the remaining 50% distributed equally among the second and third-ranked options.** No single intervention may receive more than half the quarterly budget.

  **Reasoning**
  This decision resolves the tension between our Expected Value (EV) maximization mandate and the Kelly criterion proposal by distinguishing between *financial compounding* and *epistemic compounding*.

  **1. The Samuelson Critique is Correct, But Incomplete**
  The argument that "impact does not compound like money" is mathematically sound. If we save a life in Q1, it does not mechanically increase our capacity to save a life in Q2. If our utility function over impact is linear, and our probability estimates are perfect, strict EV maximization (Winner-Take-All) is the correct strategy. The committee member invoking Samuelson is right that importing a trader's log-utility function onto philanthropic impact is a category error *if* we view each quarter as an isolated bet.

  **2. The Trader's Intuition is Correct, But Misdiagnosed**
  However, we are not making isolated bets. We are playing a repeated game with a fixed capital base replenished by member dues. The trader is right that naive EV maximization in a repeated game with uncertain probabilities leads to "ruin"—not necessarily financial bankruptcy, but *impact bankruptcy* (quarters with zero measurable results) and *reputational ruin* (funding failures that dissolve member trust).
  The "Geometric Rationality" insight here is not about money growing, but about **ergodicity**. The arithmetic mean (EV) describes the average outcome across many parallel universes; the geometric mean describes the outcome in the single timeline we actually inhabit. In a timeline where we bet 100% on a 10% probability "moonshot" five times in a row, we almost certainly end with zero impact, regardless of the high EV.

  **3. The Deciding Feature: Model Uncertainty in a Repeated Game**
  The specific feature doing the real work in this decision is not the compounding of impact, but the **compounding of model uncertainty**.
  Our research team's rankings are estimates, not probabilities. In speculative domains (biosecurity, novel delivery mechanisms), the variance on our EV estimates is likely orders of magnitude higher than the variance on our capital.
  *   **Winner-Take-All** assumes our estimates are precise. It optimizes for the *best-case* model accuracy.
  *   **Full Kelly** assumes impact compounds financially. It optimizes for *capital growth* we don't have.
  *   **Tempered Splitting (50% Cap)** optimizes for *robustness to estimation error*.

  By capping exposure at 50%, we acknowledge that while the #1 pick has the highest expected impact, the probability of it being a model error is non-trivial. We sacrifice some theoretical upside (the arithmetic mean) to guarantee a higher floor on our long-term cumulative impact (the geometric mean of our success rate).

  **Conclusion**
  We are not traders maximizing a bankroll, nor are we one-off grantmakers maximizing a single shot. We are a persistent institution managing epistemic risk over an indefinite horizon. The 50/25/25 split respects the EV ranking (the top pick gets the largest share) while enforcing the geometric constraint that we must survive our own uncertainty to give next quarter.

  Please review the attached projection models showing the variance reduction under this rule. We will implement this starting Q1 2024.
