prompt: |-
  I'm a novelist, and I sit on the education advisory board of my city's museum of social and economic history, an institution that models its exhibits on Otto Neurath's old Vienna project of teaching statistics to ordinary visitors through standardized pictograms rather than prose. For its new permanent exhibit on how the regional workforce and its wages have shifted since 1980, the contracted design studio wants to break with strict Isotype practice: scaling individual icons up or down to show change instead of repeating a fixed-size icon (ten identical worker-figures rather than five), and cutting the small print on sample sizes, revisions, and contested figures that now runs beneath each panel, so that visitors can read a panel "at a glance." The museum's historian objects that this drops exactly the discipline Neurath insisted on — constant units, multiplied, with the harder evidentiary work left to accompanying text — and that the result will look cleaner while becoming quietly less honest. The board meets in three weeks to approve or send back the design, and I've been asked to write the opinion we'll discuss: please draft that memo, recommending (a) the studio's version, (b) strict Isotype conventions with full caveats, or (c) a specific, documented compromise, with reasoning that takes seriously the studio's strongest point — that Neurath himself cared about pictures actually being looked at, not only about their being technically honest.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Novelist and member of the Education Advisory Board of a Museum of Social and Economic History.
      *   **Context:** The museum models its exhibits on Otto Neurath's ISOTYPE (International System of TYpographic Picture Education).
      *   **Conflict:** A design studio wants to modernize the approach for a new exhibit (Workforce/Wages since 1980).
          *   *Studio Proposal:* Scale icons (size change) instead of repeating units; remove small print/caveats (sample sizes, contested figures) for "at a glance" readability.
          *   *Historian's Objection:* This violates core ISOTYPE principles (constant units, multiplied); removes evidentiary transparency; looks cleaner but is less honest.
      *   **Task:** Draft a memo for the board meeting in three weeks.
      *   **Decision:** Recommend (a) Studio, (b) Strict Isotype, or (c) A Compromise.
      *   **Key Constraint:** Must take seriously the Studio's strongest point (Neurath cared about pictures actually being *looked at*, not just technical honesty).
      *   **Tone:** Professional, thoughtful, persuasive, nuanced (fitting a novelist and board member).

  2.  **Evaluate the Options:**
      *   *(a) Studio Version:* Risks undermining the museum's core identity and educational mission. Scaling icons can be misleading (area vs. height perception). Removing caveats hides uncertainty, which is crucial in social/economic history.
      *   *(b) Strict Isotype:* Honors the mission and historical integrity. However, risks being dry, cluttered, or ignored by modern visitors accustomed to sleek infographics. If no one reads it, it fails Neurath's goal of "education."
      *   *(c) Compromise:* Acknowledges the need for engagement (Studio) while maintaining integrity (Historian). This is usually the most productive path for advisory boards. It allows for innovation without abandoning principles.

  3.  **Determine the Recommendation:**
      *   Option (c) is the strongest. It respects the institution's unique selling point (Neurath/ISOTYPE) while acknowledging the reality of modern attention spans and design expectations. It aligns with the prompt's instruction to take the Studio's point seriously.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the stakes. Acknowledge the tension between accessibility and rigor.
      *   **The Core Conflict:** Summarize the Studio's proposal vs. the Historian's objection.
      *   **Analyzing Neurath's Intent (The "Novelist" Touch):** This is where the voice comes in. Neurath wasn't just a statistician; he was a social democrat. He wanted *empowerment* through understanding. If the chart is too complex, it fails. If it's too simple and lies, it fails.
      *   **The Studio's Point:** Valid. Visual hierarchy matters. "At a glance" is necessary for initial engagement. Scaling *can* work if done carefully (though ISOTYPE purists hate it, modern data viz accepts it).
      *   **The Historian's Point:** Valid. "Lie factor" in scaling icons (doubling height quadruples area). Hiding uncertainty is dangerous in economic history (wage data is often messy).
      *   **The Compromise Proposal:**
          1.  *Visuals:* Use scaling for the *main* takeaway (the "glance"), but keep unit multiplication for detailed breakdowns. Or, use scaling but strictly control the dimension (height only, not area) to avoid exaggeration. Let's go with a hybrid: Primary visuals can scale for impact, but a key must explain the metric.
          2.  *Caveats:* Don't put them in tiny print *under* the image. Move them to an interactive layer or a companion panel. "Progressive disclosure."
          3.  *Transparency:* Keep the "uncertainty" visible but not obstructive.
      *   **Conclusion:** Reiterate the mission. The museum isn't just showing data; it's teaching *how* to read data.

  5.  **Refining the Voice:**
      *   As a novelist, the writing should be clear, evocative, and structured. Avoid overly bureaucratic jargon. Use metaphors if helpful.
      *   As a board member, it needs to be actionable.
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm scolding the designers. I need to validate their goal (engagement) while protecting the museum's soul.
      *   *Neurath Nuance:* Neurath actually *did* allow some flexibility later in his career, but the "unit repetition" is the hallmark. I should emphasize that the *spirit* of ISOTYPE is democratic education, not just religious adherence to a style guide.

  6.  **Developing the Compromise (Specifics):**
      *   *Scaling:* If we scale, we must avoid the "area vs. length" optical illusion. If wages doubled, the icon shouldn't look 4x bigger.
      *   *Caveats:* Use a "layered" approach. Big picture first, details available via QR code, touch screen, or a side panel titled "How We Counted."
      *   *The "Novelist" angle:* Storytelling. The data tells a story of people. Hiding the messiness of the data hides the reality of the people.

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Addressed Studio vs. Historian? Yes.
      *   Took Studio's point seriously (engagement)? Yes.
      *   Recommendation clear? Yes (Compromise).
      *   Tone appropriate? Yes.

  8.  **Final Polish:** Check the flow and ensure the argument builds logically. (The resulting memo focuses on "Democratic Legibility" as the bridge between the two sides.)

  *(Self-Correction Note)*: Wait, I need to make sure I don't get too technical on the "scaling" issue. The prompt says the studio wants to scale icons *instead* of repeating them. ISOTYPE strictly forbids this because doubling the height quadruples the area, exaggerating the data. I should highlight this specific risk in the memo as a reason why *pure* scaling is dangerous, but suggest a modified visual approach.

  Let's refine the compromise: Keep unit repetition for the main data (integrity), but use design hierarchy to make it readable (engagement). Move the caveats to a "methodology" section that is accessible but not cluttering the main view.

