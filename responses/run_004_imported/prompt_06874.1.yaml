prompt: |-
  So I help produce a small philosophy podcast (me, a co-host, and a mic — we mostly get listeners who found us through the ACX comments section) and next month's guest just published a book resurrecting that throwaway line from Anarchy, State, and Utopia about "utilitarianism for animals, Kantianism for people" — basically, keep the full Kantian side-constraints for humans (nobody may ever be used merely as a means) but switch to straightforward cost-benefit utilitarian reasoning once you're deciding how animals may be treated, so animal suffering just becomes another cost to weigh against aggregate human benefit. What's interesting is Nozick himself floated this pretty tentatively — he admitted he had no principled story for why the switch happens exactly at the species line, and he even hedged on whether mere gustatory pleasure (liking the taste of meat) is enough to tip the scale. Our guest defends the two-tier view with way more confidence than that, and honestly this whole episode idea came out of an argument some of us had after an ACX meetup about whether that kind of view is even compatible with Nozick's libertarian priors elsewhere, so I want the questions to actually dig into that rather than stay abstract.

  Can you draft me 8-10 interview questions that dont just let her restate the two-tier picture? i definitely want one on the marginal cases problem — infants and people with severe cognitive disabilities don't obviously clear whatever threshold is supposedly doing the work, so does her calculus quietly apply to them too, and if not, what's blocking that — one that takes Nozick's own utility monster and points it back at the animal side of the theory (if aggregate human benefit can outweigh animal suffering, what principled stopping point keeps "cheap bacon for a few hundred million people" from being exactly the kind of case the utility monster thought experiment is supposed to make us suspicious of) — and one on wild animal suffering (if the animal-facing half of the theory really is utilitarian, doesn't that commit her to large-scale intervention against predation and disease in nature, and doesn't that sit weirdly next to Nozick's own minimal-state, anti-paternalist commitments). For each of those three, add a follow-up keyed to whatever dodge she's most likely to reach for — my guess is something like "that's a question for a complete theory of moral status, not for this proposal" — written so that dodge gets harder to use afterward.
