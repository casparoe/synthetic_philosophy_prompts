answer: |-
  Here are 9 interview questions tailored for your podcast. They are designed to be philosophically rigorous (for your ACX audience) but conversational enough for audio. The three required questions include specific follow-ups designed to neutralize the "scope of theory" dodge.

  ### 1. The Shift from Tentative to Dogmatic
  Nozick introduced the "utilitarianism for animals, Kantianism for people" line in *Anarchy, State, and Utopia* as a puzzle he couldn't quite solve—he explicitly admitted he lacked a principled story for where the switch happens. You, however, defend this two-tier architecture with significantly more confidence than he did. What development in the intervening decades convinced you that Nozick's hesitation was unnecessary? Is there a specific argument he missed that locks this boundary in place?

  ### 2. The Criterion of the Divide
  If we are moving from Nozick's tentative species-line to a defended moral boundary, we need to know what property triggers the switch from "weighable cost" to "inviolable side-constraint." Is the threshold cognitive (rationality, autonomy), or is it strictly biological? If it's cognitive, you risk excluding some humans; if it's biological, you risk the charge of arbitrary speciesism. Which lever are you pulling?

  ### 3. The Marginal Cases Problem (Required)
  Let's press on that cognitive threshold. If Kantian side-constraints are grounded in capacities like moral agency or rational autonomy, then human infants or adults with severe cognitive disabilities don't obviously clear the bar. If they *do* clear the bar, what property do they have that a pig or a dog lacks? If they *don't* clear the bar, does your utilitarian calculus quietly apply to them too? I'm asking if your view inadvertently permits sacrificing the severely disabled for aggregate human benefit in the same way it permits sacrificing animals.

  > **Follow-up (If she says: "That's a question for a complete theory of moral status, not this proposal"):**
  > "I hear that, but Nozick's entire libertarian project rests on the claim that side-constraints are absolute and universal for humans. If your two-tier system can't explain *why* the marginal case human is protected without relying on an ad-hoc 'species membership' rule, doesn't that undermine the Kantian half of the theory just as much as the Utilitarian half? You can't claim the human side is principled if the boundary line is drawn arbitrarily."

  ### 4. Libertarian Consistency
  Nozick's libertarianism is built on the "separateness of persons"—the idea that we are distinct individuals who cannot be merged into a social calculus. By relegating animals to the utilitarian side, you are effectively merging them into a calculus where their suffering can be outweighed by human gains. Does this create a tension with the core libertarian intuition? How do you reconcile a philosophy of inviolable rights for some with a philosophy of aggregate sacrifice for others living side-by-side?

  ### 5. The Utility Monster Reversed (Required)
  Nozick originally used the "Utility Monster" thought experiment to show the absurdity of utilitarianism: a being who gets so much utility from eating that it justifies starving everyone else. In your framework, the "monster" isn't a single being, but the aggregate gustatory pleasure of hundreds of millions of humans. If animal suffering is just a cost to be weighed, what principled stopping point prevents "cheap bacon for the masses" from outweighing the intense suffering of the few? Are you comfortable admitting that, on your view, the Utility Monster actually wins when the monster is 'humanity's taste buds'?

  > **Follow-up (If she says: "In practice, the suffering outweighs the trivial pleasure of taste"):**
  > "That might be true in practice, but I'm asking about the *structure* of the theory. Nozick's objection to utilitarianism wasn't that it gave the wrong answer in specific cases, but that it *allowed* for the possibility of sacrificing the few for the many in principle. If your framework theoretically permits factory farming provided the human utility is high enough, haven't you just imported the very flaw Nozick thought he was escaping by switching to Kantianism for humans?"

  ### 6. Wild Animal Suffering & Intervention (Required)
  If the animal-facing half of your theory is genuinely utilitarian, then suffering is bad regardless of the source. That implies we have a moral imperative to reduce predation and disease in the wild, even if it requires massive intervention. But Nozick's libertarianism is fiercely anti-paternalist and anti-interference. Does your view commit you to a massive, perhaps state-enforced, project of managing nature? If not, why does the utilitarian duty to reduce suffering turn off the moment the suffering is 'natural'?

  > **Follow-up (If she says: "Intervention is impractical or causes more harm, so we shouldn't do it"):**
  > "Practicality is different from obligation. A utilitarian doesn't say 'you don't have a duty to save a drowning child because it's hard,' they say 'you have a duty unless the cost is too high.' If the suffering in nature is as vast as utilitarians claim, the cost-benefit analysis should still point toward intervention, even if it's difficult. If you're ruling out intervention entirely, aren't you smuggling in a deontological constraint against interfering with nature that contradicts your utilitarian premise?"

  ### 7. Enforcement and the Minimal State
  Nozick argues for a minimal state limited to protecting rights against force and fraud. If animals are not rights-bearers but are subjects of utilitarian concern, how is that concern enforced? Is cruelty to animals a violation of *human* rights (a vice that degrades us), or is it a regulatory issue where the state weighs costs and benefits? If it's the latter, doesn't that require a much larger administrative state than Nozick ever envisioned?

  ### 8. Gustatory Pleasure vs. Survival
  Nozick specifically hedged on whether "mere gustatory pleasure" was enough to tip the scale against animal life. You seem more willing to allow human interests to outweigh animal suffering. Where do you draw the line on the *human* side of the scale? Is survival the only human interest weighty enough to override animal suffering, or does cultural tradition, economic stability, or simple preference also count? At what point does the human benefit become too trivial to justify the cost?

  ### 9. Is This Still Nozickian?
  Finally, stepping back: Nozick's work is often read as a unified defense of individual liberty. By splitting the moral universe into two distinct normative regimes, do you worry you are preserving Nozick's *conclusion* (that humans have strong rights) while abandoning his *method* (the inviolability of individuals)? If a future philosopher applies your same logic to a different group of humans, does your theory have the internal resources to stop them?
