answer: |-
  It is entirely appropriate that a physicist should feel unsettled by the Church-Turing Thesis (CTT). In physics, we are trained to distinguish between definitions (conventions), laws (empirical generalizations with modal force), and theorems (logical consequences). The CTT sits awkwardly across these categories, and your intuition that it is neither a pure stipulation nor a standard empirical law is widely shared by philosophers of computing.

  To give you a considered account, we must first disentangle two distinct claims that are often conflated under the label "Church-Turing Thesis." Once separated, the status of the claim, the impact of Gandy's work, and the threat of hypercomputation become much clearer.

  ### 1. The Two Faces of the Thesis

  The confusion you encountered in your reading group likely stems from sliding between these two versions:

  1.  **The Mathematical/Conceptual CTT:** This concerns the informal notion of *effective calculability* (what a human can compute following a fixed algorithm without insight). It claims this class is extensionally equivalent to the class of Turing-computable functions.
  2.  **The Physical CTT (PCTT):** This concerns *physical computability*. It claims that any function computable by a physical system in the actual universe is Turing-computable.

  **The Status of the Mathematical CTT**
  Regarding the first claim, the consensus among logicians and philosophers (e.g., Shapiro, Smith, Copeland) is that it is a **conceptual analysis supported by empirical convergence.**

  It is not a theorem because, as you noted, one side is informal. It is not a mere stipulation because the informal notion of "algorithm" had pre-theoretic stability before 1936. If Turing had defined computability in a way that excluded primitive recursive functions, the thesis would have been rejected immediately.

  The strength of the thesis lies in the *convergence of independent formalisms* (lambda calculus, general recursion, Turing machines, register machines) and the *failure of counterexamples*. Every attempt to capture "effective procedure" more broadly either collapses back into Turing computability or fails to capture the "effective" part (e.g., it requires infinite look-up tables or oracle access).

  For a physicist, the closest analogue is the identification of **temperature with mean kinetic energy**. Before statistical mechanics, "temperature" was a phenomenological concept (thermometers). Statistical mechanics provided a formal model. The identification isn't a mathematical theorem; it's a theoretical identification that explains why the phenomenological laws hold. Similarly, CTT identifies a phenomenological notion (step-by-step calculation) with a formal structure.

  ### 2. Gandy's Argument: Relocating the Assumptions

  Your reading of Gandy (1980) is astute. Gandy sought to derive the CTT for discrete deterministic mechanical devices from four physical principles (roughly: finite signal speed, finite information density in a finite region, determinism, and locality).

  **Does this prove the CTT?**
  It proves a conditional theorem: *If* the universe obeys Gandy's principles, *then* any mechanical computing device is Turing-equivalent.

  **Does it change the status of the claim?**
  It shifts the CTT from a claim about *mathematics/human cognition* to a claim about *physics*. This confirms your suspicion that it relocates the informal assumptions one level down.
  *   **The Assumption Shift:** Instead of assuming "effective calculability" is intuitively clear, Gandy assumes "physical locality" and "finite information density" are physically fundamental.
  *   **The Physicist's View:** As a condensed matter physicist, you know that "finite information density" is a robust feature of our current best theories (Bekenstein bounds, etc.), but it is not a logical necessity. It is an empirical feature of our local spacetime.

  Therefore, Gandy's work strengthens the **Physical CTT** but leaves the **Mathematical CTT** untouched. It tells us that *given the physics we know*, we cannot build a hypercomputer. It turns the CTT into a consequence of the laws of physics, much like the conservation of energy is a consequence of time-translation symmetry. It is not a metaphysical truth; it is a physical one.

  ### 3. Hypercomputation and Malament-Hogarth Spacetimes

  This brings us to the second puzzle: why are Malament-Hogarth (MH) spacetimes not treated as fatal counterexamples to the CTT?

  In an MH spacetime, an observer can receive a signal from a probe that has undergone an infinite proper time, within the observer's finite proper time. In principle, the probe could check an infinite number of cases (e.g., search for a counterexample to Goldbach's conjecture) and send a signal if it finds one. This looks like a Turing machine with a halting oracle.

  There are three principled reasons why this is not considered a refutation of the CTT, particularly the version relevant to computer science and logic.

  **A. The Stability/Noise Problem (The Physical Objection)**
  This is the most "physicist-friendly" objection. To read the output of an infinite computation compressed into a finite time, the signal must undergo an infinite blue-shift. In any realistic field theory, this implies infinite energy density at the reception point.
  Even if we ignore the energy, any non-zero thermal noise or quantum fluctuation would swamp the signal. Digital computation relies on the restoration of signal levels (0s and 1s) to suppress noise. An MH computer relies on an analogue accumulation of history that cannot be error-corrected. As you know from low-temp work, as $T \to 0$, control becomes exponentially harder; here, the "signal-to-noise" ratio effectively diverges. Most physicists regard MH spacetimes as mathematical solutions to Einstein's equations that are unstable under perturbation, and thus not physically realizable.

  **B. The "Effective" Constraint (The Conceptual Objection)**
  Recall that the original CTT is about *effective* procedures. An effective procedure requires that the instructions be finite and that each step be executable without insight.
  To set up an MH computer, you must specify the initial data with **infinite precision**. If the initial state of the probe or the spacetime metric has even a rational/irrational ambiguity, the outcome of the infinite computation may change.
  Since no physical preparation can guarantee infinite precision (due to quantum uncertainty or simply measurement limits), the "input" to the hypercomputation is not effectively specifiable. If you cannot specify the input finitely, you have not defined an algorithm. You have defined a physical analogue system, not a computational procedure.

  **C. The Distinction Between "Computable" and "Physically Decidable"**
  Philosophers like Mark Hogarth and B. Jack Copeland argue that MH spacetimes *do* refute the **Physical CTT** (nature can compute more than Turing), but not the **Mathematical CTT** (humans cannot algorithmically solve the halting problem).
  Even if an MH spacetime exists, a human cannot *simulate* it. We cannot replicate the result in a lab on demand. Therefore, it does not expand the class of *effectively calculable* functions, only the class of *physically decidable* propositions (and only in very exotic locations). Since the CTT was originally a thesis about human effective methods, the existence of a black hole that "computes" something we cannot does not falsify the thesis regarding algorithms.

  ### Summary: A Hybrid Status

  To answer your central question directly: The Church-Turing Thesis is best understood as a **robust methodological principle grounded in physical contingency.**

  1.  **It is not a mathematical theorem.** It bridges the informal and formal.
  2.  **It is not a mere convention.** The informal notion has independent weight.
  3.  **It is not a universal law of nature.** Gandy shows it depends on specific physical constraints (locality, finite density). If the universe were different (e.g., allowed continuous variables with infinite precision), the Physical CTT might fail.
  4.  **Gandy's Contribution:** He successfully showed that the CTT is a consequence of plausible physical laws. This moves the thesis from the realm of logic to the realm of physics, validating your intuition that it resembles a "generalization we have simply never seen fail" because the physical conditions required to fail it (infinite precision, infinite energy density) are forbidden by other laws we trust.
  5.  **Hypercomputation:** These proposals fail as counterexamples because they violate the **constructibility** and **stability** requirements inherent in the notion of "effective." They trade logical possibility for physical plausibility.

  **A Physicist's Analogy**
  Think of the CTT like the **Second Law of Thermodynamics**.
  *   Originally, it was a phenomenological generalization (heat flows hot to cold).
  *   Statistical mechanics provided a formal underpinning (entropy as microstates).
  *   Is the Second Law a theorem? Only if you assume the underlying micro-physics and the "past hypothesis" (low entropy initial state).
  *   Can it be violated? In principle, by fluctuations (Maxwell's Demon), but in practice, the cost of measurement/erasure (Landauer's Principle) saves it.

  Similarly, CTT is a phenomenological law of information processing. Gandy provided the "statistical mechanics" derivation. Hypercomputation is the "Maxwell's Demon"—a thought experiment that highlights the boundary conditions (infinite precision/energy) where the law might break, but which cannot be instantiated in a stable, controlled apparatus.

  You are right to remain slightly unsettled. The CTT is a hinge proposition: it is the frame within which we do computer science, but the frame itself is bolted to the wall of physical reality, not hung in the sky of pure mathematics.
