  9.  **Key Scholars to keep in mind (for tone/accuracy):** Robert Adams (*Leibniz: Determinist, Theist, Idealist*), Peter van Inwagen (*Material Beings*), Daniel Garber, Christia Mercer. (Don't need to cite heavily, but keep the reasoning aligned).

  10. **Final Polish:** Ensure the distinction between "composition of bodies" (phenomenal) and "constitution of substances" (metaphysical) is clear, as this is where the SCQ mapping gets tricky. Van Inwagen talks about material objects; Leibniz talks about substances and phenomena.

