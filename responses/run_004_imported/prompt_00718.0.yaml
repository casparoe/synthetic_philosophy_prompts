      *   **The Organicist Reading:** Leibniz distinguishes living aggregates (dominated by a soul) from dead ones. This aligns with Van Inwagen's Organicism.
      *   **The Crucial Distinction (Phenomena vs. Noumena):** Van Inwagen asks about *objects*. Leibniz distinguishes *phenomenal bodies* (always aggregates) from *metaphysical substances* (monads or composite substances via *vinculum*).
      *   **The *Vinculum Substantiale*:** This is the key to consistency. Without it, he's a Nihilist about composites. With it, he's an Organicist.
      *   **Consistency Check:** Can he hold it?
          *   *Problem:* Monads are windowless. How do they bind?
          *   *Problem:* If space is phenomenal, "composition" in space is illusory.
          *   *Resolution:* Leibniz is consistent if we accept his two-realm view (Phenomenal vs. Metaphysical). In the phenomenal realm, composition is mind-dependent (Nihilism/Conceptualism). In the metaphysical realm, composition is possible only via life/bond (Organicism).
      *   **Conclusion:** He is a **Metaphysical Organicist** but a **Phenomenal Nihilist**. The tension arises when he tries to bridge the two.

  7.  **Refining the Argument (Self-Correction/Nuance):**
