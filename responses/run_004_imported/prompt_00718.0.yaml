      *   Van Inwagen's Organicism says "composition occurs when there is life."
      *   Leibniz's view on organisms: Are they *one substance* or an *aggregate governed by one substance*?
      *   In the *Monadology*, an animal is an aggregate of monads with a dominant monad. It is not necessarily a *single* simple substance. It is a "corporeal substance."
      *   Does a corporeal substance count as a "composite object" in Van Inwagen's sense? Yes.
      *   So, Leibniz believes composite substances exist *only* if they are organic.
      *   This makes him an **Organicist**.
      *   *But*, does he believe they *really* exist? In the Des Bosses letters, he doubts it without the *vinculum*.
      *   So, the most accurate answer is: Leibniz is committed to **Organicism** regarding *substantial reality*, but this creates a consistency problem regarding the nature of monads (which are simple). He solves this (tentatively) with the *vinculum*.
      *   Actually, a stronger scholarly consensus (e.g., Robert Adams) is that Leibniz is fundamentally a **Nihilist** about material composition, but uses **Organicism** as a way to describe the *phenomenal* well-foundedness of living bodies.
      *   Let's strike a balance. He is *structurally* an Organicist, but his metaphysics of simples pushes him toward Nihilism. The consistency issue lies in the "corporeal substance."

  8.  **Final Plan:**
      *   State the verdict clearly: Leibniz is best interpreted as a **Metaphysical Organicist** who flirts with **Nihilism** regarding matter.
      *   Explain the *Unum Per Se* vs. *Unum Per Aggregationem* distinction.
      *   Map this to SCQ.
      *   Discuss the "Corporeal Substance" and the role of the Soul/Dominant Monad.
      *   Address the Consistency Issue (The *Vinculum Substantiale* and the problem of windowless monads).
