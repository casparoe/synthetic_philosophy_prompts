      *Revised Verdict:* Leibniz's principles commit him to **Nihilism** regarding extended matter (it's always an aggregate), but **Organicism** regarding *substantial* composition (if composites exist, they must be alive). The consistency problem is whether "corporeal substances" are real composites or just aggregates with a dominant monad.

      Let's go with: **Phenomenal Nihilism / Metaphysical Organicism.** This captures the nuance.

