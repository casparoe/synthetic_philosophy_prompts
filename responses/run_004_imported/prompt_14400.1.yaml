answer: |-
  # The Price of a Single World: A Verdict on Bell's Theorem

  You are right to be suspicious of the graduate school folklore. The slogan "Bell proved you must give up locality or realism" is a useful heuristic for undergraduates, but it is philosophically imprecise and physically misleading. As you have discovered in your recent reading (Maudlin is particularly essential here), the theorem does not target a vague notion of "realism." It targets a specific probabilistic condition known as **Local Causality**, combined with an assumption of **Measurement Independence** and the empirical fact of **Unique Outcomes**.

  When the inequality is violated, logic dictates that at least one of these three pillars must fall. The "folklore" collapses the last two into "realism," obscuring the fact that there are actually four distinct escape routes, each demanding a different ontological tax.

  Since you have asked for a verdict rather than a diplomatic survey, I will not hide behind the claim that "all interpretations are empirically equivalent." They are not equivalent in cost, coherence, or fidelity to the rest of physics. Below, I will walk through the four options, tally their costs, and then commit to the one that is least bad: **Explicit Nonlocality.**

  ### The Structure of the Trap

  To understand the escape routes, we must be precise about the trap. Bell's 1976 formulation of Local Causality requires that the probability of an outcome at Alice's detector ($A$), given the complete state of the past light cone ($\lambda$), is independent of the setting and outcome at Bob's detector ($B$). Mathematically, this is the factorizability condition:

  $$ P(A, B | a, b, \lambda) = P(A | a, \lambda) \times P(B | b, \lambda) $$

  If this equation fails, Local Causality fails. However, to derive the inequality, we also need **Measurement Independence** (the assumption that $\lambda$ is uncorrelated with the detector settings $a$ and $b$) and the observation that experiments yield **Unique Outcomes** (we see *one* result, not a smear).

  The violation of Bell inequalities tells us that the conjunction of these three assumptions is false. We must drop one. Here is the ledger.

  ### 1. Drop Local Causality (Nonlocality)
  **Representative Theory:** Bohmian Mechanics (Pilot Wave).
  **The Move:** Accept that the physical state of a system here can depend instantaneously on the configuration of a system there. In Bohmian mechanics, the quantum potential guides particles based on the configuration of the entire system, regardless of distance.
  **The Cost:** This is in direct tension with the spirit of Special Relativity. While "signal locality" is preserved (you cannot send superluminal messages due to the randomness of the hidden variables), the underlying ontology requires a preferred foliation of spacetime. It makes Lorentz invariance a "conspiracy" of the dynamics rather than a fundamental symmetry.
  **The Price:** You must accept that spacetime is not the fundamental stage of physics, or that Relativity is merely an emergent, effective phenomenon (a view that might resonate with a condensed matter physicist used to emergent phonons and quasiparticles).

  ### 2. Drop Measurement Independence (Superdeterminism / Retrocausality)
  **Representative Theories:** 't Hooft's Cellular Automaton, Hossenfelder/Palmer's Superdeterminism, Price's Retrocausality.
  **The Move:** Argue that the hidden variables $\lambda$ are correlated with the detector settings $a$ and $b$. In Superdeterminism, this correlation is fixed at the Big Bang. In Retrocausality, the future measurement setting influences the past state of the particle.
  **The Cost:** Superdeterminism threatens the scientific method itself. If the universe conspires to correlate your choice of measurement with the system's state, you can never trust that you are sampling a representative ensemble. It renders experimental science impossible in principle. Retrocausality saves science but introduces causal loops and requires a block-universe view where the future is as fixed as the past.
  **The Price:** Epistemic nihilism (Superdeterminism) or a radical restructuring of causality (Retrocausality).

  ### 3. Drop Unique Outcomes (Many-Worlds)
  **Representative Theory:** Everettian Quantum Mechanics.
  **The Move:** Deny that only one outcome occurs. The wavefunction never collapses; it branches. Alice sees "up" in one branch and "down" in another. Local Causality is preserved because the wavefunction evolves locally according to the Schrödinger equation; the correlation is explained by the fact that Alice and Bob are entangled parts of the same global wavefunction.
  **The Cost:** Ontological extravagance. It requires an exponentially multiplying reality. Furthermore, it faces the "Probability Problem": if everything happens, it is difficult to derive the Born Rule (why we observe probabilities proportional to amplitude squared) without circular reasoning.
  **The Price:** A metaphysics of modal realism that many find intolerable, plus significant technical work to recover the concept of probability.

  ### 4. Drop Realism (Copenhagen / QBism)
  **Representative Theories:** Standard Copenhagen, QBism, Relational QM.
  **The Move:** Deny that unmeasured quantities have values. The wavefunction is not a description of reality, but a tool for calculating probabilities of observations. There is no "fact of the matter" about the particle's spin before measurement.
  **The Cost:** It abandons the traditional goal of physics: to describe the world as it is, independent of observers. It treats "measurement" as a primitive, undefined concept (the Heisenberg Cut). QBism goes further, making the wavefunction purely subjective to the agent.
  **The Price:** Instrumentalism. It works for calculation, but it refuses to answer the question "what is happening?"

  ### The Verdict: Explicit Nonlocality

  We are now forced to choose. I argue that **Explicit Nonlocality (Option 1)** is the least bad option, provided we accept the reality of unique experimental outcomes.

  Here is the defense.

  **1. It respects the data of experience.**
  We live in a world of unique outcomes. When you measure the magnetization of a sample, you get a specific value, not a superposition of values, and you do not split into two copies of yourself. Many-Worlds (Option 3) explains this away by saying all outcomes happen, but this requires us to treat our immediate phenomenological experience as an illusion of a single branch. Nonlocality takes the data at face value: one outcome happens, and it depends on distant settings.

  **2. It preserves the scientific method.**
  Unlike Superdeterminism (Option 2), Nonlocality does not require us to believe that our experimental choices are pre-correlated with the system by a cosmic conspiracy. We can assume Measurement Independence. This allows us to continue doing physics as we have always done it: perturbing systems and observing responses without fearing that the universe is rigging the sample.

  **3. It is ontologically parsimonious compared to Many-Worlds.**
  While Nonlocality requires a preferred foliation of spacetime, Many-Worlds requires an infinite multiplicity of universes. For a physicist, multiplying entities (universes) is a higher cost than modifying the structure of spacetime (foliation). Furthermore, as a condensed matter physicist, you are accustomed to the idea that symmetries like Lorentz invariance can be emergent. If spacetime itself is emergent from a deeper quantum structure (as suggested by AdS/CFT and quantum gravity research), then the violation of Lorentz invariance at the fundamental level is less shocking.

  **4. It avoids the instrumentalist surrender of Copenhagen.**
  Option 4 works for computing band structures, which you did for 35 years. But you are now asking what the theory *means*. Copenhagen refuses to answer. It posits a "cut" between the quantum and classical worlds that has no physical justification. Nonlocality provides a clear ontology: there are particles, there are fields, and they interact nonlocally. It is a complete theory.

  ### The "Spooky Action" Misconception

  The reason your officemate says "shut up and calculate" is that he fears Nonlocality implies signaling. It does not. Bell Nonlocality is a **correlation without causation** in the signaling sense. The nonlocal influence cannot be controlled to transmit information; it is screened off by the randomness of the quantum equilibrium.

  Therefore, the cost of Nonlocality is not the destruction of Relativity's causal structure (no time travel, no FTL phones), but the destruction of Relativity's *ontological* claim that there is no preferred simultaneity. We must accept that there is a "now" across the universe, even if we can never identify it experimentally.

  ### Conclusion

  The folklore taught in grad school was half-right: Nature is nonlocal. But it was wrong to suggest "Realism" was the alternative. The real choice is between a **Nonlocal Single World** (Bohm), a **Local Multi-World** (Everett), or a **Local No-World** (Copenhagen).

  If you believe that experiments have single results and that scientists are free to choose their settings, **Nonlocality is not an option; it is a deduction.** The only way to avoid it is to deny the uniqueness of your own experience (Many-Worlds) or the freedom of your own hand (Superdeterminism).

  For a physicist who values the integrity of experimental data and the continuity of scientific inquiry, the preferred foliation of spacetime is a small price to pay. We should accept that the universe is nonlocal, not as a "spooky" mystery, but as a structural feature of a reality that prioritizes quantum wholeness over relativistic separability. The "shut up and calculate" crowd is right that the nonlocality doesn't change the cross-sections, but they are wrong that it doesn't matter. It matters because it tells us that the world is more deeply interconnected than the geometry of spacetime suggests.
