answer: |-
  The sky over Zurich was a perfect, calibrated blue. It was the kind of blue that hadn't existed naturally for thirty years, not since the Stratospheric Shield went fully online. To Aris, it looked like a bruise that had been covered with makeup.

  He coughed into his handkerchief. The fabric came away spotted with a familiar, dull red. He folded it quickly and tucked it into his jacket pocket before the rest of the Oversight Committee noticed. They were looking at the holographic display anyway, watching the jet streams swirl like colored smoke over a globe that had no edges left to fall off.

  "The monsoon failure in the subcontinent is at twelve percent," said Kael, the representative for the Global South coalition. His voice was tight. "Your stabilization algorithm is saving the coastlines from rising tides, Dr. Thorne, but it is starving the breadbaskets. You cannot optimize for sea levels and ignore precipitation."

  "It's not an algorithm," Aris corrected gently. He was tired. The bone-deep fatigue that had settled in months ago was no longer something he could sleep off. It was the same weariness he'd seen in the old photographs of von Neumann, the way a man looks when he knows the equation balances but doesn't like the sum. "It's a physical intervention. We are injecting particulates. The atmosphere is a fluid system. You pull here, it bulges there."

  "Then push it back," said the Legal Counselor. She was tapping a stylus against her tablet, the sound sharp in the quiet room. "We draft an injunction. We halt the dispersal flights from the Northern Hemisphere. We give the ecosystems time to recalibrate."

  Aris laughed, a dry, rattling sound. He didn't mean to be rude, but the absurdity was physical pain. "Halt? With what enforcement? The technology is open-source. The delivery mechanisms are modified commercial airliners. If we ground the UN flights, the private contractors in the Pacific will keep spraying. If we ban the particulates, someone will switch to sulfates. If we ban sulfates, they'll use mirrors. The capacity is distributed. The governance is centralized. The latency is fatal."

  He stood up and walked to the window. Below, the city hummed. It was clean, efficient, and entirely dependent on the fragile equilibrium being managed by the servers in the basement.

  "Thirty years ago," Aris said, his back to the room, "we thought we could treat the planet like a machine with an outside. We could dump heat into the ocean, carbon into the air, waste into orbit. We thought there was a 'away' to throw things." He turned around. "There is no away. The system is closed. The economy, the ecology, the politics—they are all the same size now. They are all planetary. When we make a mistake, it doesn't stay in the test site. It stays in us."

  "So what is the proposal?" Kael asked. "You admit the danger, yet you argue against stopping."

  "Because stopping is a discontinuity," Aris said. "The technology moves at the speed of software updates. The treaties move at the speed of signatures. If we stop the Shield abruptly, the thermal shock will spike global temperatures by two degrees in a single season. The crops die anyway. The ice shelves calve. We are not driving a car we can park. We are riding a bicycle that only stays upright while moving."

  The Legal Counselor sighed. "So we continue. Knowing the monsoons fail."

  "We adjust," Aris said. "We shift the dispersal corridors south by five degrees. We accept higher sea levels in the North to buy rainfall in the South. We patch the code."

  "And when the next side effect appears?"

  "Then we patch again."

  "It sounds like muddling through," Kael said, disdain coloring his tone.

  "It is survival," Aris replied. He felt a wave of dizziness and gripped the edge of the table. The room swam for a moment, the perfect blue sky outside tilting. He remembered the stories about the early atomic scientists, the ones who stood too close to the fire to measure the heat. He had spent too many years in the prototype chambers, breathing air that wasn't quite right, checking the sensors that would eventually govern the breath of eight billion people. He had helped build the cage, and now he was living inside it with everyone else.

  "There is no cure for progress," Aris said softly. He wasn't quoting anyone, but the words felt old. "We cannot choose to go back. We can only choose how we walk forward. We need patience. We need flexibility. And we need luck."

  "Luck is not a policy," the Counselor said.

  "It is the only policy that accounts for our ignorance," Aris said. He sat back down. His hand shook slightly as he opened his file. "I recommend the five-degree shift. Effective immediately. We monitor the soil moisture levels in real-time. If the degradation exceeds threshold delta, we convene again."

  "And if we can't fix the next problem?" Kael asked.

  Aris looked at the globe. The swirls of wind and heat were beautiful, in a terrible way. They were the visible proof of human reach exceeding human grasp.

  "Then we hope we are still here to argue about it," Aris said.

  The vote was taken. It passed, not with enthusiasm, but with the grim consensus of people who realize they are all in the same boat, and the boat is leaking, and the shore is gone.

  Aris walked out of the building into the Zurich afternoon. The air was cool, filtered, safe. He took a deep breath and coughed again, harder this time. He checked his handkerchief. More red.

  He looked up at the perfect blue sky. It was a lie, but it was the only shelter they had. He put the handkerchief away, adjusted his collar, and began the walk to the train station. There was work to do. The models would need updating by morning. There was no finish line, only the next step. He would take it. He would take it carefully. He would see if he could make it to Tuesday.
