prompt: |-
  Okay so I'm about a third of the way into a novel where one of my two POV characters is a kind of washed-up logician -- the guy peaked in grad school working on theories of truth and self-reference, and now teaches intro logic at a community college and is quietly bitter about it. There's a scene later on where his teenage daughter, who thinks his whole career sounds like fancy wordplay, asks him point blank "so did you ever actually solve the liar thing" (as in the "this sentence is false" business), and he has to give her an honest answer, which is no. I mentioned the scene to a friend who did a philosophy MA and she got excited and started talking about "revenge" paradoxes and how even Kripke's fix doesn't actually kill the liar for good, but then her Uber showed up and I never got the rest of the story.

  Here's what I already know: Kripke's move was to let sentences have a third status, neither true nor false, so the liar sentence just falls into that gap instead of blowing up the whole logical system. What I don't get is why people say that doesn't finish the job -- something about how you can build a new, "strengthened" liar sentence that's specifically about not being true in Kripke's sense, and the paradox comes roaring right back. Is that a fixable bug, something a smarter fourth or fifth patch could eventually close off for good, or is there something baked into the whole project of a theory describing it's own semantic categories from inside the same language that guarantees this keeps happening no matter how clever you get? I don't need the full formal machinery, but I'd love an explanation with actual teeth to it, since I'm hoping to steal enough of it that my logician guy's speech sounds like it's coming from someone who really lived with this problem for twenty years, not someone reciting the Wikipedia summary.
