      *   *Verdict Adjustment:* The verdict is that SG is **inferior** to strict non-compliance for general agents, but **superior** only in narrow cases of information hiding. I will argue it is generally unstable.

  8.  **Finalizing the Verdict:**
      *   Verdict: Surrogate goals are **not a stable defense** against sophisticated acausal threats.
      *   Reason: They invite meta-threats and signal vulnerability.
      *   Flip Condition: Information asymmetry (threatener cannot model the commitment's origin).

