      *   *Knowledge Retrieval:* Gödel was a theist (specifically a Leibnizian rationalist). He did believe in an afterlife.
      *   *Source:* Wang's *A Logical Journey* and *Reflections on Kurt Gödel*. Also, the *Max Phil* notebooks.
      *   *Argument Structure:* Gödel's argument for immortality wasn't logical/modal in the same way as the Ontological Proof. It was metaphysical and based on the nature of the mind/spirit and the rationality of the universe.
