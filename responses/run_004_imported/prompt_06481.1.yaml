      *   **Address the "Swap" Claim:** Explain why formally swapping $G$ for "Immortal" fails. The axioms rely on the specific nature of "positivity" (closure under entailment, etc.). "Immortality" doesn't fit the structural role of "God-likeness" in the proof.
