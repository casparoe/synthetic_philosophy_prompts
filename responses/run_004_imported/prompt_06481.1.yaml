answer: |-
  You are right to be skeptical. Your memory serves you well: **Gödel's Ontological Proof does not formally guarantee an afterlife, nor does it entail personal immortality.**

  The blog posts you are encountering are committing a category error, conflating Gödel's formal modal logic with his personal metaphysical speculations. Here is the breakdown you need for your seminar to set the record straight.

  ### 1. The Formal Proof: Why the "Swap" Fails
  Gödel's Ontological Proof (circulated in the 1970s, published posthumously in 1995) is a derivation in modal logic (specifically S5). Its conclusion is strictly limited to the **necessary existence of a "God-like" being.**

  *   **The Definition:** A being is "God-like" ($G$) if and only if it possesses all **positive properties**.
  *   **The Axioms:** The proof relies on specific axioms regarding the nature of "positivity" (e.g., if a property is positive, its negation is not; if a positive property entails another, that other is also positive).
  *   **The Conclusion:** $\exists x G(x)$ (There necessarily exists a God-like being).

  **Why you can't just swap in "Immortal Soul":**
  The blog claim suggests you can substitute the predicate $G$ (God-like) with $I$ (Immortal) and run the same axioms. Formally, this collapses for two reasons:

  1.  **Axiomatic Fit:** The axioms are tailored to the concept of "positive properties" in a perfectionist sense (omnipotence, omniscience, moral perfection). It is not clear that "immortality" functions as a "positive property" in the specific technical sense Gödel requires to trigger the modal collapse into *necessary* existence.
  2.  **The Subject:** The proof concludes that *a* being with these properties exists. It does not conclude that *you* (or any specific human) possess these properties. Even if you proved "Immortal Souls exist necessarily," it does not follow that *your* soul is one of them, unless you can prove you possess the essence of that soul. Gödel's proof is about the existence of the Divine, not the persistence of the finite.

  In short: The Ontological Proof is an argument for **Theism**, not **Immortality**.

  ### 2. Gödel's Actual Argument for Immortality
  Gödel *did* believe in an afterlife, but his arguments for it were **metaphysical and philosophical**, not formal-logical. They are found primarily in his conversations with Hao Wang (recorded in *A Logical Journey* and *Reflections on Kurt Gödel*) and his *Max Phil* notebooks.

  His reasoning was deeply Leibnizian and rationalist. It looked something like this:

  **A. The Rationality of the World**
  Gödel believed the world is fundamentally rational and created by a rational God. He argued that the annihilation of a rational mind (a soul) upon biological death would be "irrational" and "wasteful."
  *   *Quote paraphrase:* "The world in which we live is not the only one... Death is not the end."
  *   *Argument:* A rational universe would not develop spiritual beings capable of understanding truth only to extinguish them immediately upon physical decay.

  **B. Mind-Body Dualism**
  Gödel was a staunch dualist (influenced by Leibniz and Husserl). He believed the mind is distinct from the brain.
  *   *Argument:* Since the mind is not physical, physical destruction (death) does not logically entail the destruction of the mind. He often suggested that our current scientific materialism is too primitive to understand the nature of the spirit.

  **C. The Illusory Nature of Time**
  Influenced by his friendship with Einstein and his own reading of relativity, Gödel leaned toward the idea that time is ideal or subjective (see his 1949 solution to Einstein's field equations allowing for closed timelike curves).
  *   *Argument:* If time is not absolute, then "death" as a temporal endpoint is an illusion of our perspective. In a block universe or an ideal time structure, the "self" persists.

  ### 3. Seminar Teaching Point: Distinguishing Logic from Metaphysics
  For your philosophy of religion seminar, this is a fantastic opportunity to teach the distinction between **formal validity** and **philosophical persuasion**.

  *   **The Ontological Proof** is Gödel's attempt to show that belief in God is *consistent with reason* (i.e., not irrational). It is a defensive move to show that Theism is logically tenable.
  *   **The Immortality Speculation** is Gödel's constructive metaphysics. It relies on premises about the "rationality of the universe" that are not axioms in a formal system but rather philosophical intuitions.

  **The "Blog Error" Explained:**
  The internet confusion likely stems from a misunderstanding of Gödel's **Leibnizianism**. Leibniz argued for monads and pre-established harmony, which entails immortality. Since Gödel's Ontological Proof is essentially a formalization of Leibniz's *Discourse on Metaphysics*, commentators assume the conclusions of Leibniz's broader system (immortality) are contained within Gödel's specific formalization (the Ontological Proof). They are not.

  ### Summary for your Lecture Notes:
  1.  **Claim:** Gödel's Ontological Proof guarantees an afterlife.
  2.  **Verdict:** **False.**
  3.  **Reason:** The proof establishes the necessary existence of a *God-like* being, not the persistence of *human* souls. Substituting predicates breaks the axiomatic structure.
  4.  **Gödel's Actual View:** He believed in immortality based on **metaphysical rationalism** (the world is made for spirits; annihilation is irrational) and **dualism**, not modal logic.
  5.  **Primary Sources:** Cite Hao Wang's *A Logical Journey* (MIT Press, 1996), specifically the sections on Gödel's theological remarks, rather than the Sobel or Anderson formalizations of the Ontological Proof.

  Your instinct was correct. The blog posts are mixing up Gödel's formal logic with his personal philosophy.
