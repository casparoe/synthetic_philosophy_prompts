      *   **Problem:** They are encountering blog posts claiming Gödel's Ontological Proof *formally guarantees* an afterlife (immortality) by swapping properties in the axioms.
      *   **Suspicion:** The user suspects this is incorrect ("That doesn't match what I remember...").
      *   **Task:** Clarify whether the afterlife claim is part of the formal proof. If not, explain what Gödel's actual argument for life after death looked like.
