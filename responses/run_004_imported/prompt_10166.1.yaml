prompt: |-
  So this term I'm taking a jurisprudence seminar and we spent a big chunk of it on the Hart-Devlin thing -- the whole argument about whether law can legitimately enforce morality even when nobody's harmed -- and wierdly enough its now directly relevant to something on my actual campus. I'm the elected student rep on our university's Community Standards Board, and we've got a case that's basically a dorm-room version of the Wolfenden-era stuff: a sophomore has been running a paid subscription page where she posts content she films in her room. She's a legal adult, everyone involved is consenting, it's not illegal, and there have been zero harassment or safety complaints -- but a bunch of students found out and are grossed out, a couple of parents emailed the dean, and now people want her sanctioned under this old catch-all clause in our code that lets the Board punish "conduct seriously detrimental to the moral character of the campus community," completely independent of whether there's an identifiable victim.

  The Board is split in a way that maps weirdly well onto the reading: half of us are basically just running the harm principle ("if it's legal, consensual, and nobody's hurt, it's none of our business"), and the other half are running something closer to Devlin's line that a community's shared sense of decency is part of what actually holds it together, and that a community is allowed to protect that even when no individual can point to a harm -- otherwise, as one guy put it, "communities have no moral standing of their own at all, they're just a bunch of separate individuals who happen to share a zip code." A philosophy grad student who TAs for us also pointed out that this exact clause was apparently used in the 70s to discipline unmarried couples for cohabiting, which the harm-principle side thinks proves the clause is just whatever the current majority happens to find icky, dressed up as a principle.

  We vote next Wednesday. Could you write the memo I'd circulate to the Board beforehand? I want an actual recommendation -- sanction her, don't, or some third option like referring the clause itself for revision rather than applying it retroactively to her -- with a real timeframe attached to whatever you propose. And whichever way you come out, I don't want it to just wave the harm principle around and declare victory, or just wave "community cohesion" around and declare victory either -- it should engage seriously with the strongest version of whichever side it doesn't land on, not the weak version, before explaining why it lands where it does.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A university student rep on a Community Standards Board (CSB).
      *   **Issue:** A sophomore student runs a paid subscription page (likely OnlyFans-style) with consensual, legal content filmed in her dorm. No harassment/safety complaints.
      *   **Conflict:** Students/parents are offended. Administration is under pressure.
      *   **Legal/Philosophical Framework:** Hart vs. Devlin (Jurisprudence seminar context).
          *   *Hart/Harm Principle:* Law/Rule shouldn't intervene unless there's harm to others.
          *   *Devlin/Legal Moralism:* Community has a right to enforce shared morality to maintain social cohesion, even without specific harm.
      *   **Specific Clause:** "Conduct seriously detrimental to the moral character of the campus community."
      *   **Historical Precedent:** Used in the 70s against cohabiting couples (shows potential for bias/majoritarian disgust).
      *   **Task:** Write a memo to the Board before the vote next Wednesday.
      *   **Requirements:**
          *   Actual recommendation (Sanction, Don't Sanction, or Third Option).
          *   Real timeframe attached.
          *   Engage seriously with the *strongest* version of the opposing view (no strawmanning).
          *   Professional tone appropriate for a CSB memo.

  2.  **Determine the Recommendation:**
      *   *Option A (Sanction):* Upholds the Devlin argument. Risks being seen as discriminatory, outdated, and potentially legally shaky (depending on jurisdiction/private status). Ignores the historical abuse of the clause.
      *   *Option B (Don't Sanction):* Upholds the Hart argument. Risks ignoring legitimate community concerns about the university's brand/environment. Might feel like dismissing the "community cohesion" argument too easily.
      *   *Option C (Third Option - Deferred Sanction/Clause Review):* This is usually the most pragmatic and intellectually honest path in a governance context. It acknowledges the tension. It avoids punishing the individual retroactively under a vague standard while acknowledging the need to define community standards.
      *   *Decision:* The strongest recommendation is **Option C (No Sanction for the Student, but Immediate Review of the Clause)**. Why?
          *   It protects the student from vague, retroactive moral policing (Hart).
          *   It acknowledges the Board's duty to define community standards (Devlin) but moves that discussion to a legislative/prospective space rather than a judicial/retroactive one.
          *   It addresses the historical precedent of the clause being used discriminatorily.
          *   It fits the role of a Student Rep advocating for due process.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty of the case.
      *   **Statement of Facts:** Briefly summarize the situation (legal, consensual, no victim, complaint based on offense).
      *   **Analysis of the Conflict (The Hart/Devlin Engagement):**
          *   *The Devlin/Community Cohesion Argument:* Need to articulate this well. It's not just "people are icky." It's about the university as a distinct moral community with an educational mission. If the environment becomes hostile or contradicts the institution's values, cohesion suffers. *Strongest version:* It's about the *institutional* character, not just individual feelings.
          *   *The Hart/Individual Liberty Argument:* It's not just "no harm." It's about the danger of majoritarian tyranny. The "disgust" factor is slippery. Historical misuse (cohabitation) proves this risk. *Strongest version:* Protecting minority rights against the "tyranny of the majority."
      *   **The Recommendation:** No sanction for the student. Referral of the clause for revision.
      *   **Rationale for Recommendation:**
          *   Why no sanction? Due process, vagueness, retroactivity.
          *   Why review the clause? Because the Devlin concern *does* matter, but it needs clear definition, not a catch-all.
      *   **Action Plan/Timeframe:** Specific steps and dates (leading up to and past next Wednesday).
      *   **Closing:** Call for thoughtful deliberation.

  4.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid academic jargon where possible, but use the concepts accurately (since the Board knows them).
      *   Ensure the "Strongest Version" requirement is met. I need to make sure I don't dismiss the Devlin side as just "prudishness." I need to frame it as "Institutional Integrity."
      *   I need to make sure I don't dismiss the Hart side as just "anything goes." I need to frame it as "Protection against Arbitrary Power."

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the Devlin argument strong enough?
      *   *Fix:* Emphasize that a university *is* a normative community, not just a zip code. It has an educational mission that can be disrupted by environmental factors.
      *   *Critique:* Is the Hart argument strong enough?
      *   *Fix:* Emphasize the "slippery slope" evidenced by the 1970s cohabitation cases. It's about predictability and fairness.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Add specific dates. Vote on Wednesday, Committee formed by Friday, Report by end of semester.

  6.  **Final Polish:** Check against the prompt requirements one last time.
      *   Memo format? Yes.
      *   Recommendation included? Yes.
      *   Timeframe included? Yes.
      *   Engages strongest version of opposing view? Yes (Institutional Integrity vs. Arbitrary Power).
      *   Hart/Devlin context acknowledged? Yes.

  7.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Members of the Community Standards Board
  **FROM:** [Your Name], Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #24-09 and the "Moral Character" Clause

  **I. Purpose**

  This memo serves to outline my position and recommendation regarding Case #24-09 prior to our vote this coming Wednesday, October 30. As you know, this case concerns a sophomore student who produces consensual, legal adult content off-campus and in her dormitory room for a paid subscription service. While no safety violations or harassment complaints have been filed, complaints from peers and parents allege this conduct violates the Student Code's provision against "conduct seriously detrimental to the moral character of the campus community."

  Given the philosophical and practical weight of this decision, I recommend we **decline to sanction the student in this specific instance**, but simultaneously **refer the "moral character" clause to the Student Life Committee for immediate review and revision.**

  **II. Analysis of the Competing Principles**

  Our deliberations have mirrored the classic jurisprudential debate between the Harm Principle (Hart) and Legal Moralism (Devlin). To reach a just outcome, we must engage with the strongest version of both arguments, not the caricatures.

  **A. The Case for Community Cohesion (The Devlin Position)**
  Those arguing for sanction are not merely arguing that "disgust equals guilt." The strongest version of this argument posits that a university is not simply a collection of individuals sharing a zip code; it is a normative community with a specific educational mission. Shared standards of conduct are the glue that allows that mission to function. If the Board ignores conduct that a significant portion of the community finds fundamentally incompatible with our shared environment, we risk eroding the trust and cohesion necessary for a residential campus to work. From this view, the "harm" is not to a specific individual, but to the *institutional character* itself. If we surrender the ability to define our moral boundaries, we cease to be a community with standing and become merely a service provider.

  **B. The Case for Individual Liberty and Due Process (The Hart Position)**
  Those arguing against sanction are not merely arguing that "anything legal is permissible." The strongest version of this argument focuses on the danger of arbitrary power and the tyranny of the majority. History has shown us that vague moral clauses are rarely applied neutrally. As noted in our briefing, this specific clause was used in the 1970s to discipline unmarried couples for cohabitation. In that context, "moral character" was a proxy for majoritarian discomfort with changing social norms. To apply this clause now risks punishing a student not for harming others, but for violating the subjective sensitivities of the current majority. Without an identifiable victim or a clear rule, we lack a principled limit on our own power.

  **III. Recommendation and Rationale**

  **Recommendation:**
  1.  **Vote to Dismiss Case #24-09** without sanction.
  2.  **Motion to Refer** the "conduct seriously detrimental to the moral character of the campus community" clause to the Student Life Committee for revision.
  3.  **Timeline:** The Committee must present draft language for Board review by **December 15, 2023**.

  **Rationale:**
  I recommend dismissing the case against the student because applying the "moral character" clause in this instance violates the principle of *legality*—the idea that rules must be clear, specific, and prospective. The student broke no law, violated no safety protocol, and harmed no peer. To sanction her now, under a clause with a history of discriminatory application, would be to punish her retroactively for a standard we have not clearly defined. We cannot use this student as a test case for a theory of community cohesion that we have not yet codified.

  However, I also recommend we do not simply strike the clause. The Devlin argument regarding institutional character is valid. A university *does* have a right to maintain an environment conducive to its mission. The problem is not the *goal* of maintaining community standards, but the *mechanism* of a vague catch-all clause. By referring the clause for revision, we acknowledge the Board's duty to protect the community (addressing the Devlin concern) while insisting that such protections be defined through clear, democratic rule-making rather than ad hoc adjudication (addressing the Hart concern).

  **IV. Proposed Timeframe for Clause Revision**

  To ensure this is not kicked down the road, I propose the following schedule for the revision process:

  *   **October 30 (Wednesday):** Board votes to dismiss Case #24-09 and refers the clause for review.
  *   **November 3:** Student Life Committee announces formation of a working group (including student reps, admin, and legal counsel).
  *   **November 15:** Working group holds open forum for student/faculty input on what "community standards" should explicitly entail.
  *   **December 15:** Working group submits draft language to the Board.
  *   **January 20 (Next Semester):** Board votes on new language. If passed, it applies prospectively only.

  **V. Conclusion**

  We are being asked to choose between protecting an individual from majoritarian overreach and protecting the community's self-defined character. We do not have to choose one permanently today. We can protect the individual student from a vague rule while committing the Board to the hard work of defining that rule clearly for the future.

  I urge the Board to vote for dismissal with referral. This preserves the integrity of the student's due process rights while affirming our responsibility to govern the community through clear laws, not hidden moralisms.

  I look forward to discussing this further on Wednesday.
