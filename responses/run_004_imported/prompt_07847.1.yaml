answer: |-
  This is a sophisticated narrative ambition. You are asking to depict a specific philosophical thesis about the architecture of the mind: that high-level cognitive states (beliefs, fears, desires) can alter the *phenomenal character* of low-level sensory experience, rather than merely influencing what we attend to or how we judge what we have already seen.

  To write this convincingly, and to understand the stakes of doing so, we need to distinguish between **post-perceptual mediation** (the Fodor/Pylyshyn view) and **genuine cognitive penetration** (the "New Look" revival), and then examine the **epistemic circularity** (the Siegel view) that results if penetration occurs.

  ### 1. The Condition for Genuine Cognitive Penetration
  To cross the line Fodor and Pylyshyn defended, your narrator's experience must violate the principle of **Informational Encapsulation**.

  In the Fodorean view, the visual system is a "module." It processes input (light, motion, color) and delivers an output (a representation of the world) *before* the central system (beliefs, fears, reasoning) gets access to it. On this view, your narrator's jealousy can only operate in three ways:
  1.  **Attention:** She looks *at* the handshake longer than a neutral observer would.
  2.  **Memory:** She encodes the handshake as lingering, even if it was brief.
  3.  **Judgment:** She sees a normal handshake but instantly *infers* it was intimate.

  For you to depict **genuine penetration**, the jealousy must bypass these stages and alter the **early visual (or auditory) processing itself**. The output of the visual module must be different for her than for a neutral observer, even if they are attending to the same spot.

  **What must be true in the text:**
  To signal this to the reader without resorting to philosophical exposition, the narration must describe a shift in **phenomenal character** (qualia), not just interpretive commentary.

  *   **The Handshake:**
      *   *Post-Perceptual:* "They shook hands. It looked normal, but I knew it lasted too long." (This is judgment/memory).
      *   *Penetrated:* "Their hands met, and the contact bloomed in the air between them, stretching the second into a thick, viscous duration that didn't exist for anyone else."
      *   *The Criterion:* The temporal experience itself is warped. She does not *infer* duration; she *sees* duration. The visual field presents the motion as slower or the contact as more physically substantial than the photons warrant.

  *   **The Phone Hesitation:**
      *   *Post-Perceptual:* "He paused before answering. I took it as guilt."
      *   *Penetrated:* "The phone rang, and the silence before he lifted it wasn't empty; it was heavy, textured with a specific kind of refusal that rang in my ears louder than the dial tone."
      *   *The Criterion:* The auditory experience has a qualitative property ("heaviness," "refusal") that is not present in the sound wave itself but is generated by the fear interacting with the processing of the sound.

  **The Narrative Test:**
  If a neutral observer were standing next to her, looking at the same handshake, Fodor says they would have the *same visual experience* but a *different belief*. To write penetration, you must imply that if the neutral observer could plug into her optic nerve, they would see a different movie. The jealousy is not a lens she looks *through*; it is a chemical in the film developing the image.

  ### 2. The Circularity Problem (The Siegel Charge)
  If you commit to writing this as genuine penetration, you invoke the epistemic problem raised by Susanna Siegel (particularly in *The Rationality of Perception*).

  Siegel argues that if perception is penetrated by prior beliefs or fears, the resulting perceptual experience cannot serve as **independent justification** for those beliefs. This creates a specific kind of epistemic circularity, often called **hijacking** or **epistemic downgrade**.

  **The Structure of the Problem:**
  1.  **Prior State:** The narrator has a fearful suspicion (Hypothesis: *He is cheating*).
  2.  **Penetration:** This fear alters her perceptual content (Experience: *I see him acting suspiciously*).
  3.  **Conclusion:** She takes the Experience as proof of the Hypothesis.

  **Why this is distinctively Epistemic:**
  You asked why this is an "epistemic problem rather than just an accurate description of how a frightened mind works."
  *   **Descriptive/Psychological:** "She is scared, so she sees things differently." This is a causal claim. It explains *why* she sees what she sees. It carries no judgment on whether she is rational.
  *   **Epistemic/Normative:** "She is not entitled to trust her eyes." This is a claim about justification.

  In a non-penetrated world, perception acts as a **check** on belief. I believe there is a tiger; I look; I see no tiger; I update my belief.
  In a penetrated world, perception becomes a **mirror** of belief. I believe there is a tiger; I look; my fear makes the shadows look like stripes; I conclude there is a tiger.

  **The Circularity:**
  The narrator feels she is gathering fresh evidence. To her, the hesitation *looks* like guilt. It feels like discovery. But because the "look" was manufactured by the suspicion of guilt, the evidence is **question-begging**. She is using the conclusion (he is guilty) to generate the premise (I see guilt), and then using the premise to prove the conclusion.

  **For the Novel:**
  This creates a specific kind of tragedy and unreliability.
  *   **The Trap:** The more she fears, the more the world *visually confirms* her fear. The feedback loop is perfect. She cannot be argued out of it by pointing to "objective facts," because her access to facts is already compromised.
  *   **The Reader's Position:** The reader occupies the position of the epistemic evaluator. You allow the reader to feel the *phenomenal reality* of her vision (it really does look suspicious to her) while simultaneously revealing the *genealogy* of that vision (it looks suspicious only because she is afraid).
  *   **The Distinction:** If you write it as mere judgment, she is lying or mistaken. If you write it as penetration, she is **rationally trapped**. She is not lying to the reader or herself; her cognitive architecture is closing the loop on reality.

  ### Summary of Requirements for the Text

  To achieve the effect you want, your prose must satisfy two conditions:

  1.  **Phenomenal Distortion (The Penetration Condition):**
      Avoid verbs of interpretation (*seemed, appeared, I thought, I realized*). Use verbs of direct sensory registration (*stretched, weighed, glowed, recoiled*). The emotion must be embedded in the sensory adjectives. The hesitation must *sound* guilty, not just *be interpreted* as guilty.

  2.  **Epistemic Isolation (The Circularity Condition):**
      Show that this visual confirmation increases her certainty, which in turn sharpens the distortion. The narrative arc should show her becoming *more* convinced not because she finds new facts, but because her vision becomes *more* saturated with the fear. The tragedy is that her eyes, which she trusts as her primary tool for truth, have become the engine of her delusion.

  By writing it this way, you are not just describing a jealous woman; you are dramatizing the collapse of the boundary between mind and world, where the justification for knowledge dissolves because the knower has altered the very data she relies upon.
