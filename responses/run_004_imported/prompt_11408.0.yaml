      *   **Impact of Belief:** Made her calm, brave, and able to joke about the end (e.g., the 150-year-old on machines).
      *   **Specific Constraint/Instruction:** She explicitly requested *not* to use this belief to comfort the mourners ("she lives on"). She understood that *we* are in the branch where she died. She didn't want her specific, thought-out view mushed into vague spiritual afterlife platitudes she usually mocked.
      *   **Goal:** Honor the belief honestly (it was a huge part of her end-of-life identity), respect her constraint (don't offer false comfort based on it), but still make it a functioning eulogy that leaves the room in a "better place."
