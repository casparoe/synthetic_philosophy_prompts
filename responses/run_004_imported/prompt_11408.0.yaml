      *   *Key Phrase to Include/Paraphrase:* "The branches where I survive aren't the ones you're in."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Standard eulogy start but grounded. Mention her background (bookkeeper, left school early) to set up the contrast with her later intellectual curiosity.
