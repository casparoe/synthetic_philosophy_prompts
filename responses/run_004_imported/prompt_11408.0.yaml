answer: |-
  This is a profoundly beautiful and difficult request. You are walking a tightrope between honoring her specific, intellectual honesty and managing the raw grief of a room full of people who just want their mum/friend back.

  The key to making this work—and satisfying your cousin with the PhD while comforting the rest of the room—is to frame her belief not as a promise of *reunion*, but as a testament to her *courage*. Her belief wasn't about us keeping her; it was about her refusing to be terrified of the end.

  Here is a draft. It is written to be spoken slowly. I have included some [stage directions] in brackets to help you with the pacing.

  ***

  **Eulogy for [Mum's Name]**

  Thank you all for being here. I know looking around this room, there are a lot of people who loved her in different ways. As her child, I've been trying to find the words to summarize who she was.

  Most of you knew her as a bookkeeper. She left school at 16, she was practical, she was precise, and she spent her life making sure the numbers added up. She wasn't someone who usually went in for fantasy. But there was a chapter at the end of her life that I need to talk about, because it was such a massive part of how she faced what was coming.

  Somewhere in her fifties, Mum fell down a rabbit hole. She started reading pop-physics books. [Pause]. I know, it sounds unlikely. But she devoured them. Especially the ones on quantum mechanics and the "Many-Worlds" interpretation.

  For those who haven't heard of it, the short version is this: the idea that every time a quantum event happens, the universe branches. Every possibility plays out in a different version of reality.

  Mum didn't just read about this; she really thought it through. She came to a conclusion called "Quantum Immortality." She believed that because the universe keeps branching, there is always a branch where she survives. She believed that from her own perspective, she would never actually experience being dead. She would just keep finding herself alive in whichever branch she happened to be in.

  She used to joke about it, pretty darkly. She'd say, "Somewhere out there, I'm a 150-year-old woman hooked up to increasingly ridiculous machines," and she'd laugh. Really laugh.

  I'm telling you this because it made her brave. I have never seen anyone face cancer with the calm she had. When the pain was bad, or the prognosis was worse, she wasn't scared. She had talked herself into a place where death wasn't an end, but just a branching off. It gave her a peace that I don't think I would have found otherwise.

  But, there is something very specific she asked me to say today. She made me promise this.

  She knew that when people hear that, they want to grab onto it. They want to hear, "She's still out there," or "She lives on in the multiverse," as a way to make the people in this room feel better.

  She didn't want that. She was adamant about it.

  She told me, "The branches where I survive aren't the branches you are in."

  She knew that *we* are here, in this specific branch. The one where the cancer won. The one where she is gone. She didn't want her carefully worked-out view mushed into the same vague afterlife comfort she used to gently take the mickey out of when other people said it at funerals. She respected us too much to offer us a scientific-sounding platitude.

  She knew that for us, the people left behind in this branch, the loss is real. The silence in the house is real. The grief is real.

  So, I am not standing here to tell you that she's still alive somewhere. I am standing here to tell you that she was extraordinary.

  She was a bookkeeper from a small town who taught herself quantum theory to find a way to stop being afraid of the dark. She faced the end with curiosity instead of terror. And she loved us enough to tell us the truth: that her peace was hers, but our grief is ours, and both are valid.

  If we want to honor her, we don't do it by pretending she hasn't left us. We do it by being as honest as she was. We do it by facing our own lives with that same curiosity. And we do it by acknowledging that while she might be surviving in a billion other universes, in this one, we loved her, and we miss her, and that matters more than any physics theory ever could.

  Thank you.

  ***

  ### Notes for you, the speaker:

  1.  **The Physics:** This draft is safe for your PhD cousin. It frames Quantum Immortality as *her subjective belief* ("She believed that from her own perspective...") rather than stating it as objective fact. It acknowledges the separation of branches ("The branches where I survive aren't the branches you are in"), which is the crux of the Many-Worlds interpretation regarding observers.
  2.  **The "Better Place":** You asked to leave the room in a better place. Paradoxically, in grief, a "better place" often comes from validation, not distraction. By explicitly saying "The loss is real. The silence is real," you give everyone permission to cry without feeling like they *should* be happy she's "alive somewhere." That validation is usually more comforting than false hope.
  3.  **Delivery:** When you get to the section "She made me promise this," slow down. Look up at the room. This is the moment where you channel her voice. It shifts the speech from "Here is a weird fact about Mum" to "Here is Mum's final act of love and honesty."
  4.  **The Cousin:** If you're worried, you can show this to your cousin beforehand. Not for approval, but just to say, "I want to make sure I haven't butchering the science." They might appreciate being looped in.

  I am so sorry for your loss. Your mum sounds like a formidable woman. Writing this honestly is the best way to honor her.
