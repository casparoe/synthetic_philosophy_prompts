prompt: |-
  So I'm outlining a novel where the protagonist walks away from her evangelical upbringing -- no God, no afterlife -- but somehow ends up more morally serious than anyone else in the book, not less. It reminds me of that old story about George Eliot telling Myers, on a walk in a garden at cambridge, that God was unthinkable and immortality unbelievable, but duty was still absolute as ever. Knowing what she was doing with her Feuerbach translation (the one where God basically turns out to be humanity's own best qualities projected outward) and how she tore into Dr. Cummings for using hellfire to dodge actual moral effort, what are the most important implications of her specific version of post-Christian ethics for how I write this character? I want her moral intensity to feel earned on the page, not like I just parachuted in a secular humanist to make a point.
reasoning: |-
  Here's a thinking process that leads to the suggested advice for writing the character:

  1.  **Analyze the Request:**
      *   **Core Premise:** A protagonist leaves evangelical Christianity (no God, no afterlife) but becomes *more* morally serious than the religious characters.
      *   **Key Reference:** George Eliot (Mary Ann Evans). Specifically, the anecdote with F.W.H. Myers ("God is unthinkable, immortality unbelievable, but duty is categorical"), her translation of Feuerbach (*The Essence of Christianity*), and her critique of Dr. Cummings (hellfire as a dodge for moral effort).
      *   **Goal:** Make the character's moral intensity feel *earned* and authentic, not like a mouthpiece for secular humanism.
      *   **Task:** Identify the implications of Eliot's specific version of post-Christian ethics for character development and narrative structure.

  2.  **Deconstruct George Eliot's Ethical Framework:**
      *   *Feuerbachian Humanism:* God is a projection of human ideals. Therefore, worshipping God is actually worshipping the best potential of humanity. Losing God means reclaiming those ideals for ourselves.
      *   *The "Myers Walk" (Duty without Dogma):* Moral obligation doesn't vanish with metaphysics. In fact, it might become *heavier* because there's no divine safety net.
      *   *Critique of Hellfire (Dr. Cummings):* Fear of punishment is not true morality. True morality is acting rightly because it *matters* to fellow humans, not to save one's own skin.
      *   *The "Web" of Society:* Eliot often wrote about the interconnectedness of lives. Our actions ripple outward.
      *   *Sorrow and Sympathy:* Suffering is the great equalizer and the source of moral insight.

  3.  **Brainstorm Implications for the Character:**
      *   *Motivation:* Why be good? Not for reward (heaven) or fear (hell). But because suffering is real and she can alleviate it.
      *   *Burden:* Without prayer or providence, *she* is responsible. This creates anxiety/weight.
      *   *Community:* Religion offers community. Secular morality needs a new anchor. Who does she serve?
      *   *Conflict:* Religious characters might see her as lost/damned. She sees them as complacent or selfish (using faith as a crutch).
      *   *Growth:* Her morality shouldn't be static. It should be forged through pain and realization.

  4.  **Drafting the Advice (Iterative Process):**

      *   *Point 1: The Weight of Responsibility (The "No Safety Net" aspect).*
          *   Eliot's view: If there's no God to fix things, *we* have to.
          *   Application: The character shouldn't feel *liberated* in a carefree way. She should feel the crushing weight of consequence. Every action matters more because it's final.
          *   *Key phrase:* "The loneliness of agency."

      *   *Point 2: Sympathy as Religion (The Feuerbach connection).*
          *   Eliot's view: God = projected human love.
          *   Application: She doesn't stop loving; she redirects that love to actual people. Her "worship" is attention to others' pain.
          *   *Key phrase:* "Sacralizing the mundane."

      *   *Point 3: Critique of Transactional Morality (The Cummings angle).*
          *   Eliot's view: Hellfire is bribery/threats.
          *   Application: Contrast her with religious characters who do good for status or salvation. She does good because it's necessary.
          *   *Key phrase:* "Non-transactional ethics."

      *   *Point 4: The Role of Suffering.*
          *   Eliot's view: Sorrow deepens sympathy (seen in *Middlemarch*, *The Mill on the Floss*).
          *   Application: Her moral seriousness must come from experiencing pain, not just intellectual assent. She needs to suffer to understand why morality matters.
          *   *Key phrase:* "Sorrow as the school of ethics."

      *   *Point 5: Ritual and Habit.*
          *   Eliot's view: She kept Christian habits (church, language) even after losing faith.
          *   Application: Don't have her reject *everything*. Keep the discipline, change the object. The *structure* of piety remains, even if the theology goes.
          *   *Key phrase:* "Secular asceticism."

  5.  **Refining and Polishing:**
      *   Make sure to tie every point back to the user's specific constraint: "earned on the page."
      *   Avoid preaching. Focus on narrative mechanics (scenes, internal monologue, conflict).
      *   Use Eliot-specific terminology (Sympathy, The Web, Duty).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "make her nice." Eliot's characters are often difficult. Her morality is stern. The character should be demanding, perhaps even harsh on herself.

  6.  **Final Review against the Prompt:**
      *   Did I address Feuerbach? Yes (projection of ideals).
      *   Did I address the Myers walk? Yes (duty is categorical).
      *   Did I address Dr. Cummings? Yes (hellfire as moral dodge).
      *   Is it practical for a novelist? Yes, focused on scenes and motivation.

  7.  **Final Output Generation:** (This matches the structure of the provided good response.)
      *   Introduction acknowledging the depth of the reference.
      *   Section 1: The Burden of Finality (No afterlife = high stakes).
      *   Section 2: Sympathy as Sacrament (Feuerbachian projection).
      *   Section 3: The Critique of Transactional Piety (Cummings/Hellfire).
      *   Section 4: The Discipline of Grief (How she gets there).
      *   Section 5: Narrative Pitfalls to Avoid.
      *   Conclusion.

  8.  *(Self-Correction Note)*: Ensure I emphasize that Eliot didn't view this as "giving something up" but rather "growing up." The character should feel like she's stepping into adulthood, not running away.

  9.  *(Final Polish)*: Check tone. Needs to be intellectual but practical for a writer. Use quotes or specific references where helpful (e.g., *Middlemarch*, *The Essence of Christianity*).

