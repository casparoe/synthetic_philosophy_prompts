prompt: |-
  I'm on my condo association's governance committee, rewriting our board election rules after a rough race this spring. Four owners ran for our one open board seat: the winner took it with 34% of the vote, while the other three—all running on similar reform platforms—split the remaining 66% almost evenly (24%, 22%, 20%), and a post-election survey asking owners to rank all four candidates found that a clear majority had actually placed the winner last. Committee opinion is now split three ways: some want ranked-choice voting (instant runoff), some want a Condorcet method that would elect whichever candidate beats every other one head-to-head, and a couple want to keep plain plurality because, as they put it, "it's the only system people here will actually understand." I've spent months reading about voting theory on my own, including Arrow's impossibility theorem, so I know no method can satisfy every fairness condition at once—but I still need to recommend one. Could you draft the memo I'll circulate before the bylaw vote? It should name one specific method for future elections, state plainly which fairness condition or conditions it gives up and why that trade-off is reasonable for a group our size, and take the plurality holdouts' objection seriously rather than just telling them no system is perfect.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Condo association governance committee rewriting board election rules.
      *   **Problem:** Recent election had a "spoiler effect" (plurality winner with 34% vs. three reform candidates splitting 66%). Post-election survey showed the winner was ranked last by a majority.
      *   **Committee Split:**
          *   Group A: Ranked-Choice Voting (RCV/Instant Runoff).
          *   Group B: Condorcet Method.
          *   Group C: Keep Plurality (simplicity/understandability).
      *   **User Knowledge:** Understands voting theory (Arrow's Impossibility Theorem), knows no perfect system exists.
      *   **Task:** Draft a memo to circulate before the bylaw vote.
      *   **Requirements:**
          *   Recommend *one* specific method.
          *   State plainly which fairness condition(s) it gives up.
          *   Explain why the trade-off is reasonable for this specific group (condo association).
          *   Address the plurality holdouts' objection (simplicity) seriously.
          *   Tone: Professional, persuasive, transparent, practical.

  2.  **Determine the Recommendation:**
      *   *Option 1: Plurality.* Ruled out. The prompt implies the current system failed (winner ranked last by majority). The goal is to change rules.
      *   *Option 2: Condorcet.* Theoretically robust (elects the head-to-head winner). However, counting is complex for volunteers. Explaining it to owners is hard. If no Condorcet winner exists (cycles), a tiebreaker is needed, adding complexity.
      *   *Option 3: Ranked-Choice Voting (IRV).* Very common in HOA/Condo reforms. Addresses the "majority last" problem. Easier to explain than Condorcet ("eliminate last place, redistribute"). Widely recognized.
      *   *Decision:* **Ranked-Choice Voting (Instant Runoff)** is the best practical fit. It solves the specific problem described (vote splitting/spoiler effect) while being more implementable than Condorcet for a volunteer board. It balances fairness with the "understandability" concern better than Condorcet, though slightly less simple than Plurality.

  3.  **Address the Fairness Trade-off (Arrow/voting theory):**
      *   RCV/IRV fails the *Monotonicity Criterion* (ranking a candidate higher can theoretically hurt them) and sometimes the *Condorcet Criterion* (might not elect the head-to-head winner).
      *   *Strategy:* Acknowledge the Condorcet failure explicitly. Since the prompt mentions Condorcet proponents are on the committee, ignoring this would be fatal. Acknowledge that IRV *usually* picks the Condorcet winner but not *always*.
      *   *Why is this okay?* For a condo board, stability and majority support are more critical than theoretical perfection. The risk of non-monotonicity is extremely rare in small elections.

  4.  **Address the Plurality Holdouts:**
      *   Don't dismiss them. Acknowledge that simplicity matters.
      *   Counter-argument: Simplicity shouldn't come at the cost of legitimacy. If 66% hate the winner, the board lacks mandate.
      *   Mitigation: IRV is only slightly more complex (rank 1, 2, 3) but counting can be done transparently.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the recent election issues without being divisive. State the goal: legitimacy and stability.
      *   **The Recommendation:** Clearly state IRV (Ranked-Choice).
      *   **The Problem with Plurality:** Use the recent stats (34% winner, majority opposition). This validates the need for change.
      *   **Why IRV?** Explains the mechanism simply. Highlights the "majority support" benefit.
      *   **The Trade-off (Crucial Step):** Be honest about Voting Theory.
          *   Admit IRV isn't perfect (Arrow).
          *   Specific concession: It doesn't guarantee the Condorcet winner (addressing Group B).
          *   Specific concession: It's harder than Plurality (addressing Group C).
          *   Justification: These risks are low probability compared to the high probability of vote-splitting.
      *   **Addressing Simplicity:** Propose education/outreach to make IRV understandable.
      *   **Conclusion:** Call to action.

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible (explain "Condorcet" briefly).
      *   Ensure it sounds like a peer speaking to peers, not a lecture.
      *   Make sure the "fairness condition" section is precise (Monotonicity/Condorcet).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I mention Arrow?
      *   *Fix:* Yes, acknowledge it in the trade-off section to show intellectual honesty.
      *   *Critique:* Is the recommendation clear?
      *   *Fix:* Put it in bold early on.
      *   *Critique:* Did I address the Condorcet group?
      *   *Fix:* Explicitly mention why we aren't choosing their preferred method (counting complexity vs. marginal gain).
      *   *Critique:* Did I address the Plurality group?
      *   *Fix:* Validate their concern about confusion but reframe "simplicity" vs. "outcome."

  8.  **Final Polish:** Check word choice. Ensure it sounds like a governance document. (e.g., using "Association," "Bylaws," "Quorum").

  **(Self-Correction Note):** I need to make sure I don't get *too* technical. The prompt says the user knows Arrow's theorem, but the memo is for the whole committee (and potentially owners). Keep the theory accessible but accurate.

  9.  **Finalizing the Recommendation:** IRV is the standard "reform" choice for HOAs. It's the most defensible middle ground.

  10. **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee and Board of Directors
  **FROM:** [Your Name], Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Election Method Reform

  **Executive Summary**

  Following the discrepancies observed in this spring's board election, the Governance Committee has reviewed alternative voting methods to ensure future results reflect the will of the membership. While no voting system is mathematically perfect, **I recommend we adopt Ranked-Choice Voting (RCV), also known as Instant Runoff Voting, for all future contested board elections.**

  This recommendation balances the need for majority legitimacy with the practical constraints of volunteer administration. This memo outlines why RCV is the superior choice for our Association, explicitly details the theoretical trade-offs involved, and addresses concerns regarding implementation complexity.

  **The Problem: Plurality and Vote Splitting**

  Our current bylaws mandate a plurality system (whoever gets the most votes wins). In elections with more than two candidates, this system is vulnerable to the "spoiler effect."

  As seen this spring, a candidate can win with a minority of support (34%) while the majority of voters (66%) prefer other options. Our post-election survey confirmed that a majority of owners ranked the winner last. When a Board member lacks the support of most owners, governance becomes difficult, and trust in the Association erodes. We need a system that ensures the winner has broad acceptance, not just a passionate plurality.

  **The Recommendation: Ranked-Choice Voting (Instant Runoff)**

  Under RCV, owners rank candidates in order of preference (1st, 2nd, 3rd, etc.). If no candidate receives over 50% of the first-choice votes, the last-place candidate is eliminated. Their votes are transferred to those voters' next choices. This process repeats until one candidate crosses the 50% threshold.

  **Why RCV?**
  1.  **Majority Mandate:** It ensures the winner is acceptable to a majority of voters, reducing polarization.
  2.  **Sincere Voting:** Owners can vote for their favorite reform candidate first without worrying about "wasting" their vote, knowing their second choice counts if their first is eliminated.
  3.  **Proven Track Record:** It is increasingly used in HOAs and municipal elections, meaning resources for education are readily available.

  **The Trade-Off: Theoretical Fairness vs. Practical Stability**

  As students of voting theory know, Arrow's Impossibility Theorem proves no ranked system can satisfy every fairness criterion simultaneously. We must be transparent about what RCV gives up to gain majority support.

  **1. The Condorcet Criterion**
  *The Trade-off:* RCV does not guarantee the election of the "Condorcet Winner"—the candidate who would beat every other opponent in a head-to-head matchup.
  *Why we accept this:* While the Condorcet method is theoretically robust, it is significantly harder to count and explain to owners. In elections of our size (low voter turnout relative to national elections), the statistical likelihood of an RCV winner differing from a Condorcet winner is low. We prioritize a system that produces a clear, majority-supported winner over one that satisfies a theoretical head-to-head condition that most owners will not understand.

  **2. Monotonicity**
  *The Trade-off:* RCV fails the monotonicity criterion. In rare scenarios, ranking a candidate *higher* can theoretically cause them to lose, or ranking them *lower* can help them win.
  *Why we accept this:* This paradox is mathematically possible but extremely rare in practice. The risk of a non-monotonic result is far lower than the certainty of vote-splitting under our current plurality system. We are trading a rare theoretical anomaly for consistent protection against minority rule.

  **Addressing the Concern for Simplicity**

  I want to address the valid concern raised by some committee members that we should retain plurality voting because "it's the only system people here will actually understand."

  Simplicity is a virtue in governance, but not when it comes at the cost of legitimacy. A system that is easy to understand but produces unrepresentative leaders creates more conflict in the long run than a slightly more complex system that produces consensus.

  However, we can mitigate the complexity burden:
  *   **Ballot Design:** We will use clear, visual instructions on the ballot (e.g., "Mark 1, 2, 3").
  *   **Education:** We will publish a one-page explainer with the ballot mailing, including a hypothetical example.
  *   **Counting Transparency:** The vote count can be conducted in an open session where the elimination rounds are demonstrated step-by-step, turning the complexity into a feature of transparency rather than a bug.

  **Conclusion**

  We cannot achieve mathematical perfection, but we can achieve functional fairness. Plurality voting risks electing candidates opposed by the majority. Condorcet methods introduce counting complexities that may strain our volunteer capacity.

  Ranked-Choice Voting offers the best middle ground. It eliminates the spoiler effect, ensures the winner has majority support, and remains understandable enough for our membership to trust. I ask the Committee to move forward with drafting the bylaw amendments to implement RCV for the next election cycle.

  **[Your Name]**
  Governance Committee
