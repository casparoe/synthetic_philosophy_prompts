answer: |-
  The authentication lab was silent, save for the hum of the spectrometers. On the central table lay the sketch: *Study for a Portrait*, purportedly da Vinci. The gallery needed a verdict. The protocol was sequential. Four experts. One after another. No discussion. Only the final certified stamp on the ledger was visible to the next person.

  Elias went first. He examined the brushwork under magnification. The stroke density matched the master's late period. His private signal was strong: *Real*. He stamped the ledger: **AUTHENTIC**.

  Mara went second. She analyzed the paper composition. The rag content was consistent with 15th-century Milan. Her signal: *Real*. She saw Elias's stamp. Two independent signals pointing to *Real*. She stamped: **AUTHENTIC**.

  Julian was third. He scraped a micro-sample for pigment analysis. The result came back: *Lead White*. But the spectral signature was wrong. It contained trace antimony, a refinement not available until the 17th century. His private signal was screaming *Fake*.

  He looked at the ledger. Two stamps. **AUTHENTIC**, **AUTHENTIC**.

  Julian paused. He wasn't worried about his reputation. He wasn't afraid of contradicting Elias or Mara. He was doing the math. He knew his test was reliable, say 70% accurate. But he also knew Elias and Mara were competent. If they had both seen *Fake* signals, they would have stamped *Fake*. The fact that they both stamped *Authentic* meant they likely both saw *Real* signals.

  So the equation was: Two independent *Real* signals versus one *Fake* signal.

  Even with his negative pigment test, the probability mass shifted. It was more likely that his sample was contaminated or anomalous than that both Elias and Mara were wrong. The public information accumulated in the ledger outweighed his private evidence. To vote *Fake* would be to irrationally overvalue his own data against the aggregated inference of the chain.

  He picked up the stamp. He ignored the antimony. He pressed down: **AUTHENTIC**.

  This was the cascade. Julian's stamp did not reveal his private signal. To the next expert, his action looked exactly like someone who had found positive evidence. The information flow had clogged.

  Sarah entered fourth. She had the most advanced tool: a neutron activation analysis. It was definitive. The canvas weave pattern matched a known forgery cluster from the 1920s. Her private signal wasn't just strong; it was nearly certain. *Fake*.

  She looked at the ledger. Three stamps. **AUTHENTIC**, **AUTHENTIC**, **AUTHENTIC**.

  She knew the model. She knew that Julian, in position three, might have been in a cascade. If Julian had seen a *Fake* signal but stamped *Authentic* anyway, his action contained zero new information. He was just echoing Elias and Mara.

  So, Sarah stripped Julian's vote from the equation. She was left with Elias and Mara's two *Real* signals against her own *Fake* signal.

  Her test was stronger than Julian's pigment check, yes. But was it strong enough to overcome two prior independent confirmations? If she assumed her test was 90% accurate, and theirs were 70%... the math was tight. But she had to account for the possibility that Elias or Mara had lower accuracy than assumed. The uncertainty compounded. The rational move was to trust the accumulated history of actions over the single current signal, because the history represented multiple trials.

  If she broke the chain, she risked being the outlier who ignored the consensus of the room based on a single data point, however strong.

  She stamped: **AUTHENTIC**.

  The sketch was shipped to the gallery. The price tripled.

  The cascade was solid, but it was brittle. It rested entirely on Elias and Mara's initial signals. If a single piece of hard public information emerged—a dated letter from the artist proving the sketch was destroyed, or a confession from the forger—the entire structure would collapse instantly. The subsequent stamps added no weight; they were just echoes. But until that public shock arrived, the rational choice for every subsequent agent was to ignore their own eyes and follow the ghost of the first two.
