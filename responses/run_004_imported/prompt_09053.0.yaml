  ok so I had this argument with my friend last night that's still bugging me. she thinks stuff like anti-vax content, election disinfo, maybe even some of this AI persuasion/deepfake stuff, should get restricted becuase of what it COULD cause down the line, even before there's an actual identifiable victim -- basically precautionary-principle logic, better safe than sorry. I said that's not really how Mill's harm principle works, that in On Liberty he's actually pretty stingy about restricting things on mere risk (his stuff on poisons, on drunkards, etc), and the whole mechanism only kicks in once harm to others is sufficiently likely, not just conceivable. neither of us could really explain WHY they're different, we just both felt like they were. so: compare Mill's harm principle to the precautionary principle as two different tests for when someone's liberty (speech especially) can be restricted. where do they actually part ways on burden of proof and how they handle uncertainty about future harm? and is there a version of the harm principle that could absorb precautionary reasoning without it basically collapsing into "restrict anything that's risky," or are the two incompatible at the root?
