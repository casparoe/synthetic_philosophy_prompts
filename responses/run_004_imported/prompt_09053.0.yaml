      *   **Precautionary Principle:** Originates in environmental/regulatory law (Rio Declaration). "Where there are threats of serious or irreversible damage, lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures." Key nuance: Shifts burden of proof to the actor. Focuses on *worst-case scenarios* and *uncertainty*.
      *   **The Conflict:** HP demands evidence of harm *before* restriction (mostly). PP demands safety *before* action/speech is allowed (in high-stakes uncertainty).

