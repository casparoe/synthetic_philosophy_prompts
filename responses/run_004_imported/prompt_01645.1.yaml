      *   **Alex's Arguments:** Meaningful structure exists (e.g., concept neurons), predictive/manipulative power implies representation, NNs have internal structure encoding world specifics (unlike thermostats).
      *   **Jordan's Arguments:** It's projection/interpretation, NNs are just math (matrix multiplications), usefulness $\neq$ representation (thermostat example), complexity $\neq$ kind difference (anthropomorphism).
      *   **Task:** Determine who is "right" (or rather, analyze the philosophical landscape), and identify what each is getting right/wrong about the nature of representation.

  2.  **Initial Assessment & Philosophical Mapping:**
