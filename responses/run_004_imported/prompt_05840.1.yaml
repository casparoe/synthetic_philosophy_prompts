answer: |-
  This is an excellent question. In fact, you have independently reconstructed one of the most famous debates in the history of Indian philosophy. Your intuition is spot-on: if *shabda* (testimony) is just "hearing words," it seems too weak to be knowledge. But if you add conditions to make it strong (like "the speaker must be reliable"), it starts to look like inference (*anumana*).

  The Buddhist philosophers (particularly Dignaga and Dharmakirti) made exactly the argument you are making: they claimed *shabda* is not an independent *pramana* but merely a subset of inference.

  The Naiyayikas (Nyaya philosophers) spent centuries refining their defense against this. Here is how they resolve the two problems you raised.

  ### 1. The "Cheapness" Problem: Is *any* statement knowledge?

  You are right to be suspicious. If *shabda* meant "any sound coming out of a mouth," Nyaya would be absurd. But Nyaya does not define *shabda* as "speech." They define it as **_apta-vakya_** (the statement of a trustworthy/competent person).

  For verbal testimony to count as a *pramana* (generating valid knowledge, or *prama*), it must satisfy specific syntactic and semantic conditions. Just hearing noise isn't enough. The standard Nyaya list includes:

  1.  **_Akanksa_ (Syntactic Expectancy):** The words must fit together grammatically. "Cow horse man" doesn't generate knowledge; "The cow is in the pasture" does.
  2.  **_Yogyata_ (Semantic Fitness):** The sentence cannot be logically contradictory. "Wet the fire with water" works; "Wet the fire with fire" does not generate knowledge because it violates semantic fitness.
  3.  **_Asatti_ (Contiguity):** The words must be spoken/written close enough in time and space to be understood as a single sentence.
  4.  **_Tatparya_ (Speaker's Intention):** You must grasp what the speaker *means*. If someone says "It's raining" sarcastically when it's sunny, and you take it literally, you haven't gained knowledge. You failed to grasp the *tatparya*.
  5.  **_Aptatva_ (Trustworthiness):** This is the big one. The speaker must have direct knowledge of the matter and no desire to deceive.

  So, Nyaya agrees with you: **Not all speech is a *pramana*.** Lies, mistakes, gibberish, and poetic metaphors (taken literally) do not count. *Shabda* as a *pramana* is restricted to *valid* testimony.

  ### 2. The "Redundancy" Problem: Isn't this just Inference?

  This is the harder philosophical hurdle. You argued: *If I have to check that the speaker is reliable (has knowledge, isn't lying), aren't I just inferring that their statement is true?*

  If the process is:
  1.  Mr. X is reliable.
  2.  Mr. X says "P".
  3.  Therefore, "P" is true.

  ...then that is a syllogism (*anumana*). If *shabda* requires this, why call it a separate *pramana*?

  The Naiyayikas argue that *shabda* is irreducible to inference for three main reasons:

  #### A. The Distinction between Cause and Condition
  Nyaya metaphysics distinguishes between the **instrumental cause** (*karana*) of knowledge and the **conditions** (*upadhi*).

  *   **Inference:** The instrumental cause is the perception of a "mark" (*hetu*) pervaded by a major term (*vyapti*). You see smoke, you recall the relationship between smoke and fire, and you infer fire.
  *   **Testimony:** The instrumental cause is **the understanding of the meaning of the words themselves.**

  The reliability of the speaker is a *condition* (like the light required to see a pot), but it is not the *cause* of the knowledge.
  *   **Analogy:** To cook rice, you need a pot and fire. The pot is necessary (a condition), but the cooking is caused by the fire, not the pot. You wouldn't call cooking "pot-ing."
  *   Similarly, the speaker's reliability is necessary for testimony to work, but the *knowledge* arises from grasping the semantic connection of the words, not from reasoning about the speaker. When a trustworthy expert tells you, "This mushroom is poisonous," you don't consciously run a syllogism. You understand the sentence, and the knowledge arises immediately.

  #### B. The Argument from Language Acquisition
  This is the Nyaya "killer argument" against the Buddhists.

  If *shabda* were a form of inference, one would need to master logic and reasoning *before* one could learn from testimony. To infer a speaker is reliable, I need to already have concepts, logic, and prior knowledge.

  But how do children learn language? A toddler learns the word "milk" because their parent says it. The toddler does not have the cognitive capacity to infer, "My parent is a reliable epistemic agent with no desire to deceive." If *shabda* depended on *anumana*, language acquisition would be impossible. We must be able to gain knowledge from words *prior* to developing the capacity for inference. Therefore, *shabda* must be a fundamental, independent faculty.

  #### C. The Case of the Vedas (Authorless Testimony)
  Classical Nyaya (and Mimamsa) accepts the Vedas as a source of knowledge (*shabda*). However, they argue the Vedas are *apaurusheya* (authorless/not of human origin).

  If *shabda* were inference based on speaker reliability, Vedic testimony would fail, because there is no person to evaluate! You cannot infer the reliability of an author who doesn't exist. Since Nyaya maintains the Vedas convey knowledge, *shabda* must function independently of inferring a specific human author's credibility. The validity lies in the words themselves (or in the cosmic order they reflect), not in a psychological assessment of a speaker.

  ### Summary
  Your professor breezed past it, but you hit on the central tension of Nyaya epistemology.

  1.  **Is it too cheap?** No. Nyaya restricts *shabda* to *apta-vakya* (trustworthy speech) that meets syntactic and semantic conditions. Random lies don't count.
  2.  **Is it just inference?** No. Reliability is a *precondition*, not the *mechanism*. The mechanism is understanding meaning. Furthermore, if it were inference, babies couldn't learn language, and authorless texts (like the Vedas) couldn't convey knowledge.

  By treating *shabda* as independent, Nyaya acknowledges a fundamental social reality: **human knowledge is largely communal.** We cannot perceive or infer everything ourselves (e.g., history, chemistry, geography). We rely on the linguistic transmission of knowledge. Nyaya validates this reliance not as "blind faith," but as a distinct, irreducible way of knowing that operates alongside perception and inference.

  It is totally reasonable to feel uneasy about this—it's a position that requires a lot of philosophical heavy lifting to defend. But the distinction between the *conditions* for knowledge and the *source* of knowledge is the key to unlocking their argument.
