prompt: |-
  I've been down a rabbit hole reading about "evidential cooperation in large worlds" (ECL) from the rationalist/EA corner of the internet - the idea that we should act cooperatively toward agents we can never causally contact (like aliens on the other side of the universe, or versions of us in a different branch of the multiverse) because our choice is correlated evidence about what they choose, even with zero causal link between us. Then I noticed it used to just be called "multiverse-wide superrationality," which makes me think its basically just Hofstadter's old superrationality idea (the one with the twenty strangers and the prize) scaled up to the whole universe. Is that basically right, or is there something actually new going on in ECL that plain superrationality doesn't already capture? Every explaination I find just treats the two as interchangeable instead of spelling out the difference.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Context:** Rationalist/Effective Altruism (EA) circles.
      *   **Core Question:** Is ECL just Hofstadter's "superrationality" scaled up to the multiverse, or is there something substantively new/different?
      *   **Observation:** The user notes that explanations often treat them as interchangeable, but they suspect there might be a distinction.
      *   **Goal:** Clarify the relationship between ECL and superrationality, highlighting similarities, differences, and what (if anything) is "new" in ECL.

  2.  **Deconstruct the Concepts:**

      *   **Hofstadter's Superrationality:**
          *   *Origin:* Douglas Hofstadter (1980s), Scientific American columns.
          *   *Scenario:* Prisoner's Dilemma (PD) with identical/similar rational agents (e.g., the "20 strangers" game).
          *   *Mechanism:* "I am rational, they are rational, therefore we will reason the same way. If I cooperate, they will cooperate. If I defect, they will defect."
          *   *Assumption:* High correlation in *reasoning processes*. Often assumes identical agents or agents who know they are identical in relevant respects.
          *   *Scope:* Usually presented as a thought experiment about decision theory in specific games.

      *   **Evidential Cooperation in Large Worlds (ECL):**
          *   *Origin:* Oesterheld, Conitzer, Wilson, etc. (2010s/2020s), MIRI/EA rationalist sphere.
          *   *Scenario:* Agents in a "large world" (infinite or vast universe/multiverse).
          *   *Mechanism:* Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). My action is *evidence* of what other agents do, even without causal contact.
          *   *Assumption:* Correlation arises from logical similarity, shared initial conditions, or convergent evolution of reasoning, not necessarily identity.
          *   *Scope:* Cosmological/Existential. Focuses on *trade* across the multiverse. "I help your values here, you help my values there."
          *   *Key Addition:* The "Large World" aspect implies there are *many* such agents, potentially with *different* values. This introduces the concept of *compromise* and *gains from trade* rather than just one-shot PD cooperation.

  3.  **Compare and Contrast:**

      *   *Similarities:* Both rely on non-causal correlations between decisions. Both suggest cooperating in PD-like scenarios where Causal Decision Theory (CDT) says defect. Both rely on the idea that "my reasoning is a sample of rational reasoning."
      *   *Differences:*
          1.  **Identity vs. Similarity:** Hofstadter often leans on "we are identical copies." ECL acknowledges we are *not* identical (different values, locations, histories) but argues our decision algorithms are correlated enough.
          2.  **Scope of Interaction:** Hofstadter is usually a one-shot game with a fixed payoff matrix. ECL is about ongoing "trade" in a vast universe where I can benefit agents with *different* terminal goals.
          3.  **Decision Theory Formalism:** Hofstadter was informal/philosophical. ECL is grounded in formal decision theory debates (EDT vs. CDT vs. FDT).
          4.  **The "Large World" Claim:** This is the big one. ECL explicitly leverages the size of the universe (inflationary cosmology, Everettian QM) to argue that there are *enough* correlated agents to make the expected value significant. Hofstadter didn't need a multiverse, just a symmetric game.
          5.  **Compromise:** ECL emphasizes *value handshakes*. If I value paperclips and you value staples, and we are superrational, we should both pursue a mix to maximize total output across the multiverse. Hofstadter's PD usually assumes symmetric payoffs.

  4.  **Synthesize the "Newness":**
      *   Is it *basically* the same? Yes, at the core logical engine (acausal correlation).
      *   Is there something *new*? Yes, the application to cosmology and value pluralism. ECL turns superrationality from a paradox about identical agents into a policy for *alien contact* and *moral compromise*.
      *   The term "ECL" was coined to make the idea more palatable/precise within the EA community, distancing it from the somewhat mystical/vague connotations of "superrationality."

  5.  **Drafting the Response:**

      *   *Acknowledge the intuition:* Validate that the user is right to see the strong connection. It *is* essentially superrationality.
      *   *Define the Core Link:* Both rely on acausal correlation of decision algorithms.
      *   *Highlight the Distinctions (The "New" Stuff):*
          1.  **Heterogeneity:** Hofstadter = Identical agents. ECL = Different values/goals (compromise).
          2.  **Cosmological Scale:** ECL explicitly uses the "Large World" hypothesis (infinite space/many worlds) to boost stakes.
          3.  **Formalism:** ECL is tied to modern Decision Theory (FDT/EDT) rather than Hofstadter's informal reasoning.
          4.  **Terminology/Branding:** Why the name change? (Precision, avoiding "woo").
      *   *Address the "Interchangeable" confusion:* Explain why people conflate them (same engine) but why proponents distinguish them (different application/scope).
      *   *Conclusion:* It's an evolution/application, not a revolution in logic, but the implications are broader.

  6.  **Refining the Tone:**
      *   Keep it analytical and precise (matching the user's level).
      *   Avoid dismissing ECL as "just" superrationality, but don't overhype it as a completely new discovery.
      *   Mention key names (Oesterheld, Conitzer) to show familiarity.

  7.  **Self-Correction/Nuance Check:**
      *   *Did Hofstadter talk about the multiverse?* Not really, he talked about logical identity.
      *   *Is ECL strictly EDT?* It's often associated with FDT (Functional Decision Theory) now, which refines EDT. I should mention FDT.
      *   *Is the "trade" aspect crucial?* Yes, that's the main practical output of ECL (compromise between value systems), whereas superrationality is usually about cooperation within a shared value system (the prize).

  8.  **Final Polish:** Organize into clear sections: "The Core Insight," "Where ECL Extends Superrationality," "Why the Rebrand?" and "Verdict." (This matches the structure of the final output).

  **(Self-Correction during drafting):** Make sure to emphasize that Hofstadter's version often assumes *identity*, whereas ECL relies on *logical correlation* despite *physical/causal separation* and *value divergence*. That's the critical technical distinction.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  You have hit the nail on the head: **ECL is essentially Hofstadter's superrationality scaled up to the multiverse and formalized through modern decision theory.**

  Your intuition that explanations treat them as interchangeable is correct because, at the level of *mechanism*, they are the same engine. However, there are substantive differences in *scope, assumptions, and application* that justify the new terminology within the rationalist/EA community.

  Here is the breakdown of why they are the same, where ECL diverges, and why the rebrand happened.

  ### 1. The Core Mechanism: Identical
  You are right that the logical engine is unchanged.
  *   **Hofstadter (1983):** In the "Platonia Dilemma" or the "20 Strangers" game, Hofstadter argues that if two agents are rational and know the other is rational, their reasoning processes are identical. Therefore, my decision is logically linked to yours. If I cooperate, I can infer you cooperate.
  *   **ECL (2010s+):** In a large universe (infinite space or Many-Worlds), there are agents far away making similar decisions. Even without causal contact, if our decision algorithms are similar enough, my choice is *evidence* of their choice.

  In both cases, the agent rejects **Causal Decision Theory (CDT)** (which says "my action cannot physically change their action, so I should defect") in favor of a framework where logical correlation matters (EDT or FDT).

  ### 2. What ECL Adds (The "New" Stuff)
  While the engine is the same, ECL modifies the vehicle in three important ways that distinguish it from Hofstadter's original thought experiments.

  #### A. From Identity to Correlation (Heterogeneity)
  Hofstadter's superrationality often relies on a strong assumption of **identity**. In his thought experiments, the agents are usually described as "identical rational thinkers." If we are identical, of course we do the same thing.
  *   **ECL's Shift:** ECL explicitly deals with agents who are **not identical**. They may have different values, different histories, and different physical substrates (humans vs. aliens vs. AIs).
  *   **The Innovation:** ECL argues you don't need *identity* to cooperate; you only need *logical correlation*. Even if I value paperclips and you value staples, if our decision algorithms are correlated, we can engage in **acausal trade**. I will maximize paperclips *and* staples in my region, and you will do the same in yours, because my doing so is evidence that you will do so. This moves the concept from "cooperation in a symmetric game" to "moral compromise across value systems."

  #### B. The "Large World" Hypothesis
  Hofstadter's examples are self-contained games. ECL is explicitly cosmological.
  *   **The Innovation:** ECL leans heavily on modern cosmology (eternal inflation, Everettian quantum mechanics) to argue that the number of correlated agents is not just 2 or 20, but **infinite** or astronomically large.
  *   **Why it matters:** This changes the Expected Value (EV) calculation. In Hofstadter's game, the prize is fixed. In ECL, the "prize" is the total value produced across the multiverse. If your decision influences (evidentially) $10^{100}$ agents, the stakes are high enough to dominate standard causal reasoning, even if the probability of correlation is low.

  #### C. Formal Decision Theory (FDT vs. Intuition)
  Hofstadter's argument was philosophical and informal. It was often criticized as "magical thinking" by mainstream game theorists because it lacked a formal decision-theoretic framework.
  *   **The Innovation:** ECL is grounded in the rigorous debate between **Causal Decision Theory (CDT)**, **Evidential Decision Theory (EDT)**, and **Functional Decision Theory (FDT)**.
  *   Proponents of ECL (like Caspar Oesterheld, Vincent Conitzer, and researchers at MIRI) frame it not as "magic," but as the correct output of FDT. FDT formalizes Hofstadter's intuition: you should decide as if you are choosing the output of the *algorithm* that you and the other agent both instantiate. This gives the idea a mathematical backbone Hofstadter lacked.

  ### 3. Why the Rebrand?
  If it's basically superrationality, why did the EA/rationalist community coin "Evidential Cooperation in Large Worlds"?

  1.  **Avoiding "Woo":** "Superrationality" sounds mystical to outsiders (and many insiders). It implies a kind of psychic connection. "Evidential Cooperation" accurately describes the mechanism (Bayesian evidence) without the mystical baggage.
  2.  **Specific Application:** "Superrationality" is a general property of agents. "ECL" is a specific *policy recommendation* for Effective Altruists. It says: "Given the Large World hypothesis, EAs should prioritize actions that are good for *other* value systems, because acausal trade partners elsewhere will reciprocate for our value system."
  3.  **Refining the Conditions:** Hofstadter's version was often critiqued for assuming too much similarity. ECL literature spends a lot of time analyzing *how much* similarity is required for cooperation to be rational (the "correlation coefficient" of decision algorithms).

  ### Verdict
  You are correct: **ECL is Hofstadter's superrationality grown up.**

  *   **Is it logically new?** No. It relies on the same acausal correlation intuition.
  *   **Is it practically new?** Yes. It extends the concept from symmetric games between identical agents to **asymmetric trade between different value systems** across a **cosmological scale**, formalized by **Functional Decision Theory**.

  The reason explanations treat them as interchangeable is that if you understand one, you understand the core paradox of the other. But if you want to be precise: **Superrationality is the decision-theoretic principle; ECL is the cosmological application of that principle to moral compromise.**

  If you are reading Oesterheld's papers, you aren't finding a new *logic*, you are finding the *engineering specs* for how to apply Hofstadter's logic to a realistic (albeit speculative) universe.
