answer: |-
  Good evening, everyone. For those who don't know me, I'm the friend group's resident econ PhD student. Which, in this room, means I'm the person who studies money, while Priya is the person who actually caught it.

  When Priya's partner asked me to say a few words, I knew I had to talk about Keynes. Specifically, his 1930 essay, *Economic Possibilities for our Grandchildren*. Keynes made a bet that within a hundred years—so, roughly right now—technology and capital would solve the "economic problem." Scarcity would end. We'd work fifteen hours a week.

  Now, I know half this room is thinking, "Yeah, and I'm still working fifty." And the other half is thinking, "Please don't talk about work." But Keynes wasn't really writing about productivity. He was writing about us. He argued that once we stop struggling to survive, the real difficulty begins: figuring out how to "live wisely and agreeably and well." He worried that we've been trained for generations to strive, not to enjoy. He wasn't sure we'd know what to do with the freedom.

  Priya has arrived at that exact frontier. She solved the scarcity problem. She hit the number. But that brings us to the second piece of the puzzle, and the reason I think what she's doing is genuinely brave.

  Eight years later, Keynes wrote a quieter essay called *My Early Beliefs*. He looked back at his young self and his friends in the Bloomsbury Group. They thought the good life was simple: cultivate "good states of mind." Love, beauty, conversation. Enough money, sure, but mostly just aesthetic enjoyment.

  Older Keynes walked that back. He realized civilization is a "thin and precarious crust" over something much more volatile. He realized that just having leisure doesn't guarantee wisdom, and having money doesn't guarantee safety.

  Priya, most people retire *from* something. You are retiring *into* something. You are stepping into Keynes's hundred-year experiment. You're proving the money part is possible. But you're also taking on the harder part he warned us about: the work of filling that freedom with meaning, not just distraction.

  It's unresolved. It's risky. And it's far more interesting than another bonus year.

  So, to Priya. May your leisure be heavy, may your purpose be light, and may you live wisely and agreeably and well.

  Cheers.
