answer: |-
  It is a pleasure to address a colleague who knows the physics from the inside out. Having spent your career aligning detectors and closing loopholes in Bell tests, you have a grounded intuition about entanglement that pure metaphysicians often lack. You know that the correlations are real, robust, and stubbornly non-classical.

  The debate you have stumbled upon in retirement—between Maudlin's rejection of Humean Supervenience (HS) and Loewer's defense of it via configuration space—is one of the most significant fault lines in contemporary philosophy of physics.

  Your intuition is correct: Loewer's maneuver is indeed a Pyrrhic victory. While it technically preserves the *logical structure* of Humean Supervenience, it does so by eviscerating the *ontological and empiricist commitments* that gave the thesis its philosophical force in the first place. To save the letter of Lewis's law, Loewer kills the spirit of Hume's world.

  Here is the argument for why Loewer's configuration-space Humeanism abandons the substantive core of the thesis.

  ### 1. The Humean Commitment to Spacetime
  To see why Loewer's move is costly, we must recall what David Lewis was actually trying to do. Humean Supervenience was not merely the claim that "everything supervenes on *some* base of local qualities." That would be trivially true for almost any theory (one could simply define the base as "the state of the whole universe at every instant").

  Lewis's thesis was specific: the base must be a **spatiotemporal arrangement of local matters of particular fact.**
  For Lewis, "spatiotemporal" meant the four-dimensional manifold of General Relativity (or Special Relativity in the flat limit). The motivation was deeply empiricist. The "Humean mosaic" was intended to be the world of events—the clicks of detectors, the flashes of light, the positions of pointers—the very data you collected in your lab. The philosophical appeal of HS was that it grounded the nomic (laws) in the categorical (events in spacetime), keeping metaphysics tethered to the world as we encounter it.

  ### 2. Maudlin's Challenge is Physical, Not Just Metaphysical
  Tim Maudlin's argument rests on the physics you know intimately. In a Bell test, the joint state of the photon pair cannot be decomposed into a state for photon A, a state for photon B, and the spatiotemporal relation between them in 3D space. The entanglement is a holistic fact about the pair *in spacetime*.

  Maudlin argues that if HS requires the world to be built from local beables in 3D/4D space, QM refutes HS. The "local matters of fact" in spacetime are simply not sufficient to determine the chances (probabilities) prescribed by the wavefunction. The laws (the Schrödinger evolution) do not supervene on the 3D mosaic because the 3D mosaic is incomplete without the global wavefunction.

  ### 3. Loewer's Maneuver: Relocating the Mosaic
  Barry Loewer (following David Albert) replies by shifting the locus of fundamentality. He argues that the wavefunction $\Psi$ is not a law or a relation, but a physical field. However, it is not a field on 3D space; it is a field on $3N$-dimensional configuration space.

  In configuration space, the wavefunction *is* local. The value of $\Psi$ at a point in configuration space is determined by the value of the field at that point. Therefore, if we declare configuration space to be the fundamental "spacetime," then the world *is* a mosaic of local qualities. Supervenience is saved.

  ### 4. The Pyrrhic Victory
  Here is where the victory turns to ash. Loewer preserves the *form* of HS by sacrificing its *function*.

  **A. The Loss of the Manifest Image**
  Humeanism is historically rooted in empiricism: the idea that our knowledge and ontology should be grounded in experience. We experience a 3D world evolving in time. We do not experience a $3N$-dimensional world. By making configuration space fundamental, Loewer renders our experienced spacetime derivative.
  If the fundamental facts are points in a high-dimensional space, then the detectors in your lab, the photons flying through the optical table, and the spacetime intervals between them are not fundamental. They are, at best, emergent patterns or "shadows" of the real geometry.
  This inverts the Humean priority. Instead of laws supervening on the world of experience, the world of experience becomes a projection of a mathematical space that is inaccessible to experience. This is not empiricism; it is a form of mathematical Platonism disguised as Humeanism.

  **B. The Contingency of Geometry**
  For Lewis, spacetime was the fixed container of the mosaic. Its dimensionality and metric structure were not contingent on the number of objects within it.
  In Loewer's view, the dimensionality of the fundamental space depends on the number of particles ($N$) in the universe. If a particle is created or destroyed, the dimensionality of the fundamental space changes.
  This makes the very arena of fundamentality contingent on the contents of the mosaic. For a Humean, who seeks a stable base upon which laws supervene, having the *geometry of the base* fluctuate with the population of particles is deeply problematic. It suggests that the "local" relations in configuration space are not truly fundamental spatial relations in the Lewisian sense, but structural features derived from the particle count.

  **C. The Disconnect from Causal Mechanisms**
  In your Bell tests, you manipulated variables in 3D space (polarizer angles, timing windows). The causal story of the experiment is told in spacetime.
  If the fundamental reality is in configuration space, the causal efficacy of your 3D manipulations becomes obscure. How does rotating a polarizer in 3D space act upon a field in $3N$-dimensional space?
  To make sense of this, one must posit a mapping function between the 3D space and the configuration space. But if that mapping is fundamental, then 3D space retains a foothold in fundamentality, undermining the claim that configuration space is the *sole* base. If the mapping is not fundamental, then the connection between the "real" world (configuration space) and the "apparent" world (spacetime) is mysterious.
  Lewis wanted laws to summarize the mosaic. But if the mosaic is in configuration space, the laws summarize a world we do not inhabit. The Humean Best System Analysis is supposed to systematize *our* world's history. If the history is in $3N$ dimensions, the systematization is no longer about the world of events we care about.

  ### 5. Conclusion: Form Without Substance
  Loewer's defense succeeds only by redefining "spatiotemporal" to mean "the domain of the wavefunction." But Lewis's "spatiotemporal" was meant to pick out the world of relativity and perception.

  By moving the mosaic to configuration space, Loewer saves the thesis of Humean Supervenience from quantum mechanics, but he does so by abandoning the Humean commitment to a world of local facts in *our* spacetime. He preserves the supervenience, but he loses the Hume.

  For a retired experimentalist, the implication is stark: Loewer's metaphysics implies that the clicks in your detectors were not the fundamental facts of the universe, but merely the surface ripples of a reality existing in a space you could never navigate. That may be a consistent metaphysical position, but it is no longer Humean Supervenience. It is a formalist shell, retaining the name but discarding the empiricist soul that made it worth defending.

  You are right to view it as a Pyrrhic victory. It solves the problem by changing the subject.
