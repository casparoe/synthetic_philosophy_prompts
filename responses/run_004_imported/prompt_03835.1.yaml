answer: |-
  The check had been on the table for twenty minutes, ignored by both men. The restaurant was nearly empty, the staff hovering in the shadows of the kitchen doorway, waiting for the two emeritus professors to exhaust themselves. Arthur swirled the last of the Barolo in his glass, watching the legs run down the side. Ben was picking at a crust of bread, a habit he'd had since 1994.

  "You're dodging the asymmetry, Arthur," Ben said, his voice low but sharp. "You always dodge the asymmetry."

  Arthur sighed, setting the glass down. "I'm not dodging it. I'm dissolving it. The student's argument is a *reductio ad absurdum* of the premise that he *knows* the teacher's announcement. That's Quine. It's clean. It preserves classical logic."

  "It's cheap," Ben countered, leaning forward. "Thirty years, Arthur. You've been telling me it's clean for thirty years. It's not clean; it's a amputation. You save the logic by severing the knowledge claim. But here's the rub: The announcement is *true*. The teacher *does* give the test. And on Thursday, the student looks at the calendar and sees only Friday left. By your logic, he cannot know the test is tomorrow. But the Dean knows the test is tomorrow. The teacher knows the test is tomorrow. Why is the proposition knowable to them but structurally unknowable to the student, given they all share the same evidence?"

  Arthur smiled, a thin, weary expression. "Because the student is the one embedded in the proposition. The announcement says, 'There will be a test and you won't know it.' If the student claims to know that announcement on Thursday night, he falsifies the second conjunct. So he can't know it. The Dean isn't embedded in the announcement. The Dean isn't the subject of the surprise."

  "So it's indexical?" Ben pounced. "Now we're modifying the logic to save the intuition?"

  "No, we're respecting the conditions of knowledge," Arthur said, tapping the table. "Knowledge requires truth and justification. On Thursday night, if the student believes the test is Friday, he lacks justification for the 'surprise' clause. He defeats the condition of his own knowledge. It's self-defeating. It doesn't mean the test can't happen. It just means the student was wrong to think he could deduce it away."

  Ben shook his head, tearing a piece of bread in half. "This is where you lose me. You're saying a perfectly rational agent, who forgets nothing and gains no new evidence between Monday and Thursday, simply *loses* the capacity to know a truth that is sitting right in front of him. On Monday, the announcement is knowable. On Thursday, it's not. What changed? Nothing in the world changed. Nothing in the student's mind changed. Only the date."

  "The context changed," Arthur insisted. "The set of possible worlds shrank."

  "It smells like skepticism, Arthur," Ben said softly. "If you admit that a valid deduction can destroy knowledge of a true premise, you're opening the door to a much darker room. If I know $P$, and I know $P$ implies $Q$, do I know $Q$? The closure principle. You're violating closure to save the paradox. You're telling me that rational deduction can blind us to reality. If you push that hard enough, you don't just solve the Surprise Test; you solve away all knowledge of future contingents. Because any prediction I make about my own actions could be falsified by my knowing it."

  Arthur leaned back, crossing his arms. "I am not a skeptic. I'm a fallibilist. I'm saying the student's confidence was misplaced. He thought he had a logical proof that the test was impossible. I'm telling him he has a logical proof that his *knowledge* of the schedule is impossible. There's a difference. I'm not saying we can't know the future. I'm saying we can't know the future *under the description of 'unexpected'.* That's not skepticism; that's precision."

  "Precision?" Ben laughed, a dry, barking sound. "You're buying precision at the cost of explanatory power. You tell me *that* the student doesn't know. You don't tell me *why* the proposition itself resists being known. That's where the blindspot comes in."

  "Ah, the blindspot," Arthur groaned, reaching for the water pitcher. "The magic word. You posit a whole new ontological category. 'True but unknowable.' It's epicycles, Ben. Ptolemy adding spheres to make the math work. Why not just admit the student made a mistake in the first step of the backward induction?"

  "Because the first step isn't a mistake!" Ben's voice rose, causing a waiter to flinch in the doorway. He lowered it. "The reasoning is valid. The premises are true. The conclusion—that he can't know the day—is true. If the reasoning is valid and the premises are true, the conclusion *must* be knowable, unless there is a structural block. A blindspot. It's not magic; it's a limitation of the cognitive architecture relative to self-referential truths. Just as I cannot see my own eyes without a mirror, the student cannot know this announcement without falsifying it."

  "But the mirror exists," Arthur shot back. "The Dean is the mirror. The student has access to the Dean's knowledge. He can ask the Dean. If the Dean knows it, and the student trusts the Dean, the student knows it. Unless you're saying knowledge isn't transmissible?"

  "It's not transmissible in this specific configuration," Ben said, stabbing a finger at the tablecloth. "Because the moment the Dean tells the student, the proposition changes truth value. It becomes false. So the Dean knows $P$. The student knows that the Dean knows $P$. But the student cannot know $P$ himself. That is a genuine, structural asymmetry. Your Quinean solution sweeps this under the rug. You say, 'Well, the student just doesn't know.' You treat it like a simple error. I'm treating it like a feature of truth."

  Arthur shook his head slowly. "You're reifying ignorance, Ben. You're taking a failure of the agent and turning it into a property of the proposition. 'This truth is too spicy for the student.' It buys you nothing. Does positing a blindspot help the student study? Does it help the teacher plan? No. It just lets you say, 'Aha, a blindspot!' instead of 'You made a category error.' Which one is actually more useful?"

  "Utility isn't truth," Ben snapped. "If the shoe pinches, you don't tell the foot it's making a category error. You acknowledge the shoe is too small. The fit between mind and world isn't perfect. Sorensen showed that. There are limits to what can be thought. You're clinging to this idea that if it's true, it must be thinkable. That's the dogma."

  "And you're clinging to the idea that because it's un-thinkable, it must be a special kind of truth," Arthur retorted. "Maybe it's just that 'knowledge' isn't the right operator here. Maybe it's 'belief.' The student believes it. He's right to believe it. He just can't *know* it. Why do we need to inflate 'truth' to account for a limitation in 'justification'?"

  "Because the justification is there!" Ben slammed his hand down, making the silverware jump. "The logic is sound! The evidence is sufficient! If justification and truth are present, and knowledge is absent, then something is blocking the link. That block is the blindspot. You want to say the justification is missing. I say the link is broken. Why is your view superior? Because it's older? Because Quine said it?"

  "Because it's parsimonious!" Arthur's voice was steady now, hard as granite. "I don't need to invent invisible barriers. I just need to check the definitions. You're willing to break the world to save the intuition. I'm willing to break the intuition to save the world."

  "The intuition *is* the world, Arthur," Ben said, slumping back into his chair. "How we navigate knowledge is the world. If you tell a rational agent that his reasoning is valid but his conclusion is unknowable, you haven't solved the paradox. You've just told him he's insane."

  "And if you tell him there are truths he is forbidden to touch," Arthur said, picking up his wine glass again, "you've turned logic into theology."

  They sat in silence for a moment. The waiter finally found the courage to approach, hovering with the card machine.

  Ben looked at Arthur, the anger fading into the familiar, comfortable exhaustion of three decades. "You know I'm right about the asymmetry."

  "I know you're consistent," Arthur said, pulling out his wallet. "Consistency isn't correctness."

  "And you know your solution makes knowledge look like a flickering light," Ben said, watching Arthur tap the card. "On when you look away, off when you look direct."

  "Better a flickering light," Arthur said, signing the receipt, "than a light that shines on nothing."

  He pushed the receipt toward the center of the table. Ben reached for his coat.

  "Same time next year?" Ben asked.

  "If we're both still surprised," Arthur said.

  Ben snorted, opening the door to the cool night air. "Don't count on it."
