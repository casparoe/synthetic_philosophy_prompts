answer: |-
  The hum of the threshold machine was a low, physical vibration in the floorboards, but the air between the three of them was still. Rosalind stood with her hand hovering over the activation lever, staring into the shimmering distortion.

  "It's you," Dev said, his voice tight. He wasn't looking at the machine; he was looking at the back of Rosalind's neck. "When you step through, you aren't visiting a stranger. You're going to meet *yourself*. One and the same person, twice over."

  Iris leaned against the doorframe, arms crossed. "She's going to meet a counterpart, Dev. A woman who shares Rosalind's history up until the divergence point, and then diverges. Spatiotemporal continuity is broken. There is no literal identity across worlds. Lewis was clear on that."

  "But Lewis couldn't explain the stake," Dev countered, stepping closer to Rosalind. "If it's just a counterpart, why does Rosalind feel terror? If I told you a perfect clone of you was suffering in a basement in Cleveland, you'd feel sympathy. You wouldn't feel *this*." He tapped his own chest. "You wouldn't feel the first-person anticipation of pain. That's the Humphrey objection, Iris. If it's not her, why does it matter to *her*?"

  "Because resemblance triggers empathy, and causal continuity triggers responsibility," Iris said, her tone sharp but not unkind. "Rosalind cares about that woman for the same reason she cares about her future self: because the woman's welfare depends on Rosalind's choices *here*. But caring about someone isn't the same as *being* them. You're confusing psychological investment with metaphysical fact."

  "It's not just investment," Dev insisted. "It's reference. When Rosalind thinks 'I might have been a painter,' she isn't thinking about a lookalike in another universe. She's thinking about a potentiality inherent in *this* subject. If she steps through and punches that other Rosalind, she hasn't assaulted a cousin. She's committed a paradox."

  "Then explain the boundary," Iris said, pushing off the doorframe. "If identity is transworld, if it's the *same* soul stretched across branches, what fixes the reference? Rosalind took a different job in Branch A. She married a different man in Branch B. You say that's still her. But what about Branch C, where her parents never met? Where she was never conceived?"

  "Branch C is null," Dev said. "There's no subject there to identify."

  "Why?" Iris pressed. "If identity tracks through divergence, why does it snap at conception but hold through divorce? You're drawing a line in the sand and calling it 'essence.' I'm saying the line is arbitrary. On my view, the woman in Branch A is a counterpart because she resembles Rosalind closely. The woman in Branch C is a poor counterpart because she doesn't exist. No mystery, no magical essence required."

  "Because origin matters," Dev said. "Kripke. The person is fixed by their starting point. As long as the chain of events begins with *this* Rosalind's origin, it's *this* Rosalind. You're reducing her to a bundle of qualities. If she loses enough qualities, she stops being her. I'm saying she is the substrate that holds them."

  "And where is that substrate?" Iris asked. "If Rosalind steps through that door, there are now two bodies, two brains, two streams of consciousness. If they are numerically identical, then one object exists in two places at once. That violates the indiscernibility of identicals. If the other Rosalind has a scar on her left hand and our Rosalind doesn't, they cannot be the same woman. They can only be counterparts."

  "They are the same woman with different histories," Dev said. "The scar is an accidental property, not an essential one. You're prioritizing logic over the phenomenology. Rosalind knows, in her gut, that she is about to re-integrate with a lost part of her own existence. If you tell her it's just a 'counterpart,' you're telling her to treat her own life as a simulation."

  "I'm telling her not to treat a stranger's death as her own extinction," Iris shot back. "That's the danger, Dev. If she believes she is literally that woman, and that woman dies on the other side, does Rosalind die here? If you're right, the answer is yes. If I'm right, the answer is no. Which safety protocol do you want me to load? The one that saves a traveler, or the one that mourns a ghost?"

  Dev opened his mouth, then closed it. He looked at Rosalind, who hadn't moved. "I want you to acknowledge that what she feels is real. Not just empathy. *Recognition*."

  "Recognition is a relation," Iris said softly. "It doesn't require identity. I recognize my face in a mirror. I know it isn't me. I can still love it." She stepped up to Rosalind's other side. "Rosalind. When you cross, you will meet someone who knows your childhood, your fears, your code. She is your closest possible match. But you are here. She is there. Don't let the metaphysics of 'self' blind you to the reality of 'other'."

  Rosalind took a breath. The hum rose in pitch. "I know what I'm meeting," she said. "I'm meeting the cost."

  She pulled the lever. The light flared, and for a second, the room held two shadows where there should have been one.
