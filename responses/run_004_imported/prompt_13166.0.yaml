      *   **Conflict:** What is Rosalind meeting? A counterpart (Iris) or herself (Dev)?
      *   **Key Arguments:**
          *   *Dev:* The "Humphrey Objection" (Lewis's critic). If it's just a counterpart, why does Rosalind care? It should feel like caring about a stranger.
          *   *Iris:* Needs a real rebuttal, not a shrug. She needs to challenge the criteria for identity. If it's not resemblance/continuity, what fixes identity? Why track *some* divergences (job, marriage) but not others (never born)?
      *   **Format:** Dialogue exchange, dozen or so turns, real back-and-forth, no strawmen.

  2.  **Deconstruct the Philosophy:**
      *   *Lewis (Counterpart Theory):* Worlds are spatiotemporally isolated. An object exists in only one world. "Possibility" is analyzed via counterparts in other worlds. Humphrey cares about his counterparts winning, but it's not *him* winning.
      *   *Kripke (Transworld Identity):* Rigid designators. We talk about *Nixon* losing in another possible world, not a counterpart. Identity is transworld.
      *   *The Humphrey Objection:* It seems intuitively wrong that Humphrey shouldn't care about *his* victory in another world just because it's technically a counterpart.
      *   *Iris's Counter:* The "Problem of Accidental Intrinsics" or the "Criterion of Identity." If Rosalind changes too much, is she still Rosalind? If identity is strict, how do we draw the line?

  3.  **Drafting - Turn by Turn:**

