answer: |-
  Reconstructing Hobbes's verdict on Parfit's Hitchhiker requires navigating the tension between his moral psychology (the Laws of Nature) and his political realism (the necessity of the Sword). To remain consistent with his rebuttal to the Foole, Hobbes must argue that **you ought to pay**, but accepting this verdict exacts a significant toll on the architecture of his political theory.

  ### The Verdict: Pay

  Hobbes must conclude that the hitchhiker is rationally bound to pay. To argue otherwise would be to concede the Foole's central thesis: that justice is merely a calculation of immediate advantage, void when enforcement is absent.

  Hobbes's rebuttal to the Foole in *Leviathan* (Chapter XV) does not rest on the claim that every individual act of injustice will be punished. Rather, it rests on the claim that a *disposition* to injustice is incompatible with self-preservation. The Foole argues that one can break a covenant secretly and gain the benefit. Hobbes counters that such a disposition renders one unfit for society, inviting eventual destruction. "He that breaketh his covenant... declareth that he thinketh it reason to deceive... and so putteth himself out of society."

  In the Hitchhiker scenario, the driver's ability to read character functions as the functional equivalent of the "common power" Hobbes usually deems necessary. Hobbes argues that covenants in the state of nature are void if there is "reasonable suspicion" that the second party will not perform. However, he allows that if security is provided, the covenant binds. Here, the driver's insight removes the "reasonable suspicion." She has identified a character disposed to keep faith. For the passenger to then keep the money is to actualize the disposition of the Foole.

  Even without a police force in the town, the passenger's rationality is tied to his long-term viability as a social agent. If he keeps the money, he confirms he is the kind of person who cannot be trusted. In a world where character is legible (as the scenario posits), this is tantamount to self-exclusion from future cooperative benefits (like future rescues). Thus, paying is the only course consistent with the fundamental Law of Nature: seek peace and preserve yourself. The driver's insight collapses the future consequence of a bad reputation into the present moment; the "sword" is not a physical weapon, but the structural necessity of maintaining a trustworthy nature in a transparent environment.

  ### The Cost to the Argument Against the Foole

  While this verdict preserves Hobbes's moral claim that justice is rational, it undermines two pillars of his broader system: the absolute necessity of the Sovereign and the intrinsic rationality of justice.

  **1. The Redundancy of the Leviathan**
  Hobbes's political project relies on the premise that the State of Nature is inescapably a war of all against all because "covenants, without the sword, are but words." He argues that without a coercive power to overawe them all, men cannot be secured against mutual suspicion. However, if the driver's ability to read character provides sufficient security to make covenant-keeping rational, then the Sovereign is not *strictly* necessary for justice to obtain. It suggests that transparency and reputation can sustain cooperation without absolute submission to a Leviathan. This weakens Hobbes's justification for authoritarianism; if organic trust can solve the assurance problem, the desperate leap to absolute sovereignty looks less like a logical necessity and more like a contingency for when character reading fails.

  **2. The Epistemic Contingency of Justice**
  More damagingly, this verdict exposes that Hobbes's argument against the Foole is not based on the inherent irrationality of injustice, but on the *epistemic difficulty* of hiding it. Hobbes defeats the Foole by arguing you cannot reliably expect to escape detection or the long-term costs of a bad reputation. In the Hitchhiker case, the passenger pays because the driver *saw* his character.

  This implies that if the Foole could perfectly mask his disposition—if he could convince the driver he was trustworthy while secretly intending to defect—Hobbes's logic would compel him to keep the money. There is no "Sword" in the town to punish him, and if his true character remains hidden, his future social viability is untouched. By making the rationality of justice dependent on the legibility of character, Hobbes concedes the Foole's underlying egoism: justice is only rational insofar as it serves self-interest. If self-interest could be secured through perfect deception, Hobbes's system offers no internal reason to be just. This reduces the Laws of Nature from rational commandments to prudential heuristics, leaving the door open for the Foole to return whenever he can guarantee his secrecy.
