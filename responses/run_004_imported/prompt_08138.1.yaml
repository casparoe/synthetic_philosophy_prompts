      *   **Lewis's Fix (Reformed Conditional Analysis):** Adds a "causal basis" clause. $x$ is disposed to $M$ when $S$ iff $x$ has some intrinsic property $B$ such that if $x$ were $S$ and $B$ persisted, $x$ would $M$.
