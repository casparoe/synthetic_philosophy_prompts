          *   *Verdict:* Noah wins on immediate moral intuition, but Celeste wins on Arendtian political theory.

      *   **(4) Celeste's Reply:** Arendt tracks damage to the shared political world. Liar keeps structure intact; self-deceived institution loses grip on structure. Repairability is the key.
          *   *Assessment:* This is the core Arendtian insight. The "common world" relies on shared facts. If the actors don't believe in facts, negotiation is impossible.
          *   *Verdict:* Celeste is significantly stronger here. This captures the *political* stakes, not just the *moral* stakes.

      *   **(5) Noah's Epistemic Pushback:** Distinction is unfalsifiable. Outsiders can't verify inner belief. Useless for diagnosis.
          *   *Assessment:* A strong practical critique. How do we *know* they believe it? However, Arendt argues the *effect* is visible regardless of inner state. The behavior (ignoring evidence) reveals the self-deception.
