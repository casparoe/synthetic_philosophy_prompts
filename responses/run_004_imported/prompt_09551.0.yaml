      *   *Key Concept 2: The Modern Image-Maker/Problem-Solver.* In "Lying in Politics," Arendt focuses heavily on the Pentagon Papers and the McNamara era. She discusses the "problem-solvers" (RAND Corporation types). They don't just lie; they rewrite reality to fit theories. They believe their own models.
      *   *Key Concept 3: Fact vs. Opinion.* Arendt distinguishes between rational truths (philosophical/scientific) and factual truths (brute facts). Political lying attacks factual truths.
      *   *Key Concept 4: The Danger.* The danger isn't just deception; it's the destruction of the "common world." If facts are mutable based on power/will, politics becomes impossible. Self-deception is more dangerous because it removes the anchor to reality.
