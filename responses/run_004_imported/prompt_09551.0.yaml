  5.  **Identify Misreadings/Unused Resources:**
      *   **Misreadings:** Noah treats Arendt as a moralist assigning blame. Celeste treats Arendt as a structural analyst. Celeste is closer, but both might underplay the role of *factual truth* vs. *rational truth*.
      *   **Unused Resources:**
