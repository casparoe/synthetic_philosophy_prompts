      *(Refining the Stage 2 Argument)*: I need to be careful not to just say "Turing was wrong." I need to say what this *shows about the criterion*. Does it show thinking = indistinguishability hostage to belief? Yes, that's the stronger critical position. I will argue that while Turing *hopes* it's an isolated curiosity, the structural necessity of the patch proves the vulnerability.

