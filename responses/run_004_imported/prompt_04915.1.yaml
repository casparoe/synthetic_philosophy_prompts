answer: |-
  This is a fantastic catch. Most people stop at "Hume says promises are conventions," but you've dug into the *mechanism* of his argument against the rival view (that promises are natural mental acts). You are right to be suspicious of the footnote; it is dense, slightly gnarly, and relies on specific Humean metaphysical commitments that aren't always made explicit in the text.

  You asked three specific things:
  1.  What are the actual gears of the regress?
  2.  Is he equivocating on "willing," or is this a structural regress like epistemic justification?
  3.  Does this rule out *all* acts of mind, or just this candidate?

  Here is the step-by-step reconstruction of the argument, the nature of the regress, and why it matters for the LW/precommitment lineage you're tracing.

  ### 1. The Setup: Hume's Meta-Ethical Constraints

  To parse the regress, you have to accept Hume's underlying ontology of "obligation." For Hume (in the *Treatise*):
  *   **Obligations are not physical objects.** They are "relations." Specifically, they are relations of sentiment/approval between agents and actions within a social context.
  *   **The Will is causal, not magical.** The Will can move my arm (present action). It cannot, by sheer force of thinking, change the moral landscape of the universe *ex nihilo*.
  *   **Intentionality requires an object.** To "will" something, there must be an idea of that thing already present in the mind to be willed.

  The rival view Hume is attacking (roughly the Rationalist or Natural Law view) is that there is a specific mental state—"I hereby bind myself"—that naturally creates an obligation, similar to how willing to lift my arm naturally lifts my arm (if I'm not paralyzed).

  Hume has already eliminated Resolution, Desire, and Willing the Action (as you noted). The only remaining candidate for the "act of mind" is **Willing the Obligation.**

  ### 2. The Gears of the Regress (Footnote Analysis)

  Here is the logical chain in the footnote, translated out of 18th-century prose:

  1.  **Premise 1:** To "will an obligation" means to will a **new relation** between objects (me, you, the future action).
  2.  **Premise 2:** For the Will to target something, that thing must exist (as an idea/object) **prior** to the act of willing. (You can't shoot a target that doesn't exist yet).
  3.  **Premise 3:** But in this specific case, the Obligation (the relation) **does not exist yet**. It is supposed to be *created* by the act of willing.
  4.  **The Conflict:** So, for the Volition ($V_1$) to occur, the Obligation ($O_1$) must already exist (as its object). But for $O_1$ to exist, $V_1$ must have already occurred (as its cause).
  5.  **The Regress:**
      *   To will $O_1$, I need a prior relation $R_1$.
      *   To get $R_1$, I need a prior Volition $V_1$.
      *   But $V_1$ is defined as "willing $O_1$."
      *   So $V_1$ requires $O_1$ to exist *before* $V_1$ creates it.
      *   If we try to fix this by saying "Okay, I will a *prior* volition $V_0$ to create the object for $V_1$," then $V_0$ faces the same problem. It needs an object ($O_0$) to target, but $O_0$ is supposed to be created by $V_0$.
      *   Hence: "The will... must return upon itself in infinitum."

  **Is this an epistemic regress?**
  No. It is not like the Agrippan trilemma (justification requires justification). It is an **ontological bootstrapping problem.** It is structurally identical to the problem of "pulling yourself up by your bootstraps." Hume is arguing that you cannot use the Will as both the *cause* of the obligation and the *effect* of the obligation's existence (as an object).

  ### 3. Is He Equivocating? (The "Pun" Suspicion)

  You are very sharp to suspect a pun. Hume is trading on a specific definition of "object of the will."

  *   **Sense A (Causal Object):** I will to move my hand. The "object" is the physical movement. The movement happens *after* the will.
  *   **Sense B (Intentional Object):** I will *that* which I conceive. The "object" is the idea in my mind. The idea must exist *before* the will.

  Hume is arguing that an "Obligation" cannot be a Sense A object (because obligations aren't physical movements caused by nerves) and it fails as a Sense B object (because if the obligation already exists in my mind as a complete idea/relation, I don't need to will it into existence morally).

  The "equivocation" is really Hume enforcing a **Category Error.** He is asserting that Normative Statuses (obligations) are not the *kind* of thing that can be the direct object of a Volition.
  *   I can will an *action*.
  *   I can will a *belief* (sort of).
  *   I cannot will a *relation of morality*.

  For Hume, moral relations arise from **sentiments** (pleasure/pain/utility) triggered by circumstances. You cannot "will" a sentiment into existence directly (try to will yourself to be genuinely angry right now, without a cause; you can't). Since obligation is rooted in sentiment, you cannot will obligation directly.

  So, yes, he is manufacturing an absurdity, but he believes the absurdity reveals a truth: **The concept of "willing an obligation" is category-mistaken.**

  ### 4. Does This Rule Out *All* Acts of Mind?

  **Yes, for Hume.** And this is the crucial link to your LW/UDT rabbit hole.

  Hume's conclusion in this section is that there is **no natural mental act** that binds you. There is no "precommitment button" in the human psyche that works by pure introspection.

  If there were a natural mental act that created obligation, it would have to be one of the four he listed:
  1.  Resolving (No, internal)
  2.  Desiring (No, contingent)
  3.  Willing the Action (No, wrong tense)
  4.  Willing the Obligation (No, infinite regress/category error)

  Since he exhausts the logical space of "mental acts," he concludes that the binding force of a promise **cannot come from the mind of the promiser.**

  **This leads to his Conventionalism:**
  The obligation comes from the **social convention.** The "act of mind" is irrelevant without the external social framework that attaches penalties (shame, loss of reputation, retaliation) to the breaking of the promise. The "obligation" is actually just the recognition of self-interest within a cooperative equilibrium.

  ### 5. Connection to LW, UDT, and Precommitment

  This is where your tracing pays off. Hume is essentially arguing against the possibility of **acausal precommitment** via internal mental states.

  *   **The Rationalist/Natural Law view:** "I can bind my future self by a magical mental act of 'Promising'." (Similar to hoping that CDT can solve Newcomb by just *deciding* to one-box).
  *   **Hume's view:** "Your mental act changes nothing. You are only bound if there is a convention (a game structure) that makes breaking the promise costly." (Similar to UDT/Functional Decision Theory requiring the *logical* connection or external commitment devices to bind the agent).

  Hume is effectively saying: **You cannot change your own payoff matrix by thinking hard.**

  The "regress" in the footnote is his way of proving that the "Payoff Matrix Change" (the obligation) cannot be generated internally. It must be generated externally (by society/convention).

  *   **LW/Precommitment:** If I want to win Parfit's Hitchhiker, I can't just "will" myself to pay. I need to be the *kind of agent* (UDT agent) or have an *external mechanism* (reputation, contract) that makes paying the optimal move.
  *   **Hume:** If I want to be bound by a promise, I can't just "will" the obligation. I need the *convention* (society's reaction) to make breaking the promise painful.

  ### Summary of the Argument Gears

  1.  **Target:** The claim that "Promising = Willing an Obligation."
  2.  **Constraint:** Willing requires an existing object; Obligation is a relation created by the willing.
  3.  **Conflict:** The object (obligation) must exist *before* the will (to be willed) and *after* the will (to be created).
  4.  **Result:** Infinite Regress ($V$ needs $O$, $O$ needs $V$).
  5.  **Conclusion:** "Willing an Obligation" is impossible.
  6.  **Implication:** No mental act creates obligation. Obligation is artificial/conventional (external).

  You aren't missing a hidden premise; you're bumping into Hume's hard stop on the power of the Will. He is denying the very possibility of the "internal commitment device" that some decision theorists might wish for. The "binding" must come from outside the mind, which is why he pivots to **Convention** immediately after this section. The "obligation" is really just the prediction of social sanction, which is a matter of fact (cause and effect), not a matter of mental magic.
