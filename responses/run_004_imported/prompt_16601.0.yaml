answer: |-
  **Dialogue: The Space of Reasons and the Community of Agreement**

  **Participants:**
  *   **Skeptic:** A proponent of the Kripkensteinian sceptical solution.
  *   **Realist:** A proponent of the McDowellian non-reductionist realism.

  **Skeptic:** Let's begin where the trouble starts. You claim to dissolve the sceptical paradox regarding rule-following, but it seems to me you simply refuse to face the brute force of the argument. Kripke's Wittgenstein shows us that for any finite sequence of past applications of a rule—say, addition—there are infinitely many interpretations compatible with that behavior. There is no fact about my past mental states, dispositions, or behavior that constitutes my meaning *plus* rather than *quus*. Do you deny the paradox?

  **Realist:** I deny that the paradox gets a grip on us unless we accept a specific, corrupted picture of what a "fact" must be. You accept the sceptic's challenge: "Show me the fact." And when you cannot produce a reductive, non-normative fact—something like a neural state or a behavioral disposition—you conclude there is no fact. My point is that the demand itself is illegitimate. You are asking for a fact that stands outside the practice of reasoning to justify the practice.

  **Skeptic:** But if I don't ask for that, what am I asking for? If I say "I meant plus," surely there must be something that *makes* it true that I meant plus. If it's not my dispositions, and it's not a Platonic entity hovering in a third realm, what is it? You seem to want a fact that is normative all the way down. But how does a fact *guide* me? A fact is just *there*. How does it tell me what to do next?

  **Realist:** There is the rub. You assume that for a fact to guide me, it must operate like a causal mechanism, like a rail laid out to infinity. When the sceptic shows that no physical rail exists, you conclude there is no guidance. But the guidance provided by meaning is normative, not causal. To grasp the concept of addition is to have a capacity that is intrinsically normative. The fact that I meant plus is a *sui generis* fact. It is not reducible to non-normative terms, but it is not a "queer" Platonic object either. It is constituted by my initiation into the space of reasons.

  **Skeptic:** This sounds like verbal magic. You say "normative fact," but you haven't explained how it escapes the sceptical argument. The sceptic asks: "What makes it the case that this capacity is the capacity for *plus*?" If you say, "It just is," you are positing a mystery. This is why I prefer the sceptical solution. I concede there are no truth-conditions for meaning claims. There is no fact of the matter about what I mean in isolation. Instead, we look to assertability conditions. I am licensed to say you mean *plus* because your responses align with the community's. Meaning is constituted by communal agreement, not by a private, *sui generis* fact.

  **Realist:** And that is precisely where you concede too much to the sceptic. By retreating to assertability conditions, you have abandoned the idea that meaning claims can be *true*. You've saved the practice of attributing meaning, but only by stripping it of its realism. You make correctness a matter of *agreement*, not *accordance*. If the community shifts its practices, on your view, what was once correct becomes incorrect. That destroys the normativity you claim to preserve.

  **Skeptic:** Not at all. Normativity is preserved within the language game. "Correct" means "in accord with the community's standards." We don't need a God's-eye view of truth to have a functioning normative practice. We just need the check of others to distinguish between "I think I'm following the rule" and "I am following the rule." Without the community, that distinction collapses.

  **Realist:** Does it? Let's test that. Consider the case of a lifelong solitary rule-follower. Imagine a Robinson Crusoe who has never interacted with another human being. He develops a practice of counting coconuts. He writes down symbols. He follows a pattern. On your sceptical solution, can Crusoe mean anything by his symbols?

  **Skeptic:** This is the stress test, isn't it? Strictly speaking, on the Kripkean view, we cannot attribute meaning to him in the same way we do to members of a community. There is no one to check his consistency. He cannot distinguish between thinking he is following a rule and actually following it. However, *we*, as a community observing him, can attribute meaning to him based on how his behavior aligns with *our* rules. But intrinsically, in himself? No. He is a philosophical zombie regarding meaning.

  **Realist:** That is absurd. It implies that normativity is an extrinsic property bestowed by a crowd. If Crusoe intends to add two coconuts to three, and he accidentally writes '6', he has made a mistake. He has violated his own intention. The normativity comes from his own grasp of the concept, not from a vote. If he were suddenly discovered by us, and we found he had been consistently calculating in base-10, we would say he *was* following a rule, not that he only began to follow one upon our arrival. Your view makes meaning contingent on social surveillance.

  **Skeptic:** But how do you sustain that without falling into the trap I warned you about? If Crusoe is alone, what stops the sceptical hypothesis? Suppose Crusoe writes '125' after '68 + 57'. He thinks he's adding. But maybe he's been following *quus* all along and only now diverged. Without a community to fix the interpretation, what fact about Crusoe determines he was wrong? You say it's a *sui generis* fact. But where is it located? In his head? We've ruled out brain states. In his soul? That's Platonism.

  **Realist:** It is located in his practice, understood as the actualization of a rational capacity. You keep asking for a *state* that exists prior to the practice to justify it. But the fact that he means *plus* is not a state that causes his answers; it is the characterization of his activity as a rational agent. When Crusoe calculates, he is exercising a conceptual capacity. The possibility of error is inherent in the capacity itself. He doesn't need a community to tell him he slipped; his own recognition of the slip—his sense that "that's not what I meant"—is the manifestation of the norm.

  **Skeptic:** But that recognition is just another mental event! How do you know *that* isn't subject to the sceptical paradox? He thinks he recognizes a slip, but maybe his memory of what he meant has shifted. This is why the community is essential. The community provides the independent check. It breaks the circle of self-interpretation. By saying Crusoe can follow a rule alone, you are positing a "super-rigid" rail that exists inside his mind. You are guilty of the very Platonism you claim to avoid. You're saying the rule itself forces the answer.

  **Realist:** I am not saying the rule forces the answer like a physical cause. I am saying that to possess the concept *is* to be bound by the norm. You argue that because we can imagine Crusoe being confused, he must be confused. But the possibility of error does not entail the impossibility of correctness. Your sceptical solution dissolves the problem by lowering the stakes: nothing is truly right, only agreed upon. I dissolve the problem by raising the conception of fact: normative facts are real, but they are only visible from within the space of reasons. You are trying to view the space of reasons from the outside, looking for a naturalistic reduction. When you don't find one, you declare meaning an illusion.

  **Skeptic:** I don't declare meaning an illusion! I declare *truth-conditional* meaning an illusion. I save meaning by grounding it in utility and social cohesion. That's a pragmatic victory. You claim a realist victory, but at what cost? You have to insist that there is a fact of the matter about Crusoe that is, in principle, undetectable by anyone but him, and even he might be wrong about it. You're asking us to believe in a fact that does no explanatory work. If Crusoe never interacts with anyone, and dies, did he really mean *plus*? What difference does it make?

  **Realist:** It makes the difference between treating him as a rational agent and treating him as a complex machine. If your view is correct, then before the community arrives, Crusoe is merely making noises. When the community arrives and interprets him as adding, they are essentially projecting meaning onto him. This makes meaning a property of the *observer*, not the *actor*. That inverts the phenomenology of rule-following. When I follow a rule, I feel bound by the content of the rule, not by the fear of social sanction.

  **Skeptic:** But that "feeling of being bound" is exactly what the sceptic attacks! The feeling is compatible with going off the rails. You keep using the phrase "space of reasons." But if that space is populated by *sui generis* facts, how do we enter it? How does a child learn? On my view, the child is trained into the community's practices. Drill, correction, agreement. That explains the acquisition of normativity. On your view, the child must somehow latch onto these *sui generis* facts. That sounds like a mysterious intuition.

  **Realist:** Training is necessary, yes. But training is not *causal conditioning*. It is initiation. When we train a child, we are not just shaping dispositions; we are appealing to their rationality. We say, "Don't you see?" And sometimes, they do. That "seeing" is not the detection of a queer object; it is the awakening of a capacity. The sceptical solution reduces this to "they started saying what we say." But that misses the understanding. Crusoe, in his solitude, can say to himself, "Don't you see? I meant *this*." If he has the capacity, the soliloquy works. If he doesn't, it doesn't. The community helps sustain the capacity, but it does not constitute it.

  **Skeptic:** You say the community sustains but does not constitute. But without the community, the distinction between "sustaining a capacity" and "merely having a disposition" vanishes. That is the heart of the paradox. You claim there is a difference, but you cannot specify it without using the very normative terms the sceptic is questioning. You are begging the question. You assume normativity exists to prove normativity exists. I accept the sceptic's challenge: show me the difference in non-normative terms. You can't. So I conclude the difference isn't a matter of fact, but of status within a community.

  **Realist:** And I reply: the demand to show the difference in non-normative terms is the original sin. Why must the difference be statable in non-normative terms? That is the empiricist prejudice. You assume that unless a fact can be described from a "view from nowhere," it isn't a fact. But normative facts are essentially perspectival. They only exist for a subject capable of understanding them. To ask for a non-normative description of a normative fact is like asking for a visual description of a sound.

  **Skeptic:** But if they are perspectival, then they vary with the perspective! If Crusoe's perspective is all there is, and he has no check, his perspective is sovereign. And if his perspective is sovereign, he cannot be wrong. And if he cannot be wrong, he is not following a rule. He is just doing what he does. To save the possibility of error for Crusoe, you need a standard independent of his current inclination. I say that standard is the community. You say it is... what? The "nature of the concept"? That sounds like the Platonist rail again.

  **Realist:** It is the nature of the concept, but not as a rail. It is the logical grammar of the concept itself. To mean *plus* is to be committed to the infinite consequences of addition. Crusoe is fallible. He might lose his grip. But his falling short presupposes a standard he is trying to meet. That standard is not the community; it is the content of his own thought. The community is just other individuals who share that same capacity. They help when his grip falters, but they do not create the grip.

  **Skeptic:** So, if Crusoe goes mad and starts writing random numbers, and then dies, you say he *was* following a rule until he went mad?

  **Realist:** I say he was exercising a capacity until he lost it.

  **Skeptic:** And if he never went mad, but simply continued in a way *we* would call *quus*, but *he* calls *plus*?

  **Realist:** Then he means *quus*. Meaning is determined by what he takes himself to be doing, provided he is exercising a rational capacity consistently.

  **Skeptic:** But that makes meaning private and uncheckable. It opens the door to the very scepticism I thought we were managing. If meaning is just "what he takes himself to be doing," then the sceptic wins: there is no fact that distinguishes his taking from the reality.

  **Realist:** No. Because "what he takes himself to be doing" is not a bare introspection. It is his engagement with the world. If he counts coconuts, the coconuts constrain him. If he thinks '2 + 2 = 5', the coconuts don't add up. The world and the mind meet in the practice. You separate them: you put the rule in the community and the behavior in the individual. I see them as integrated in the rational activity.

  **Skeptic:** We are at an impasse. I see your "rational activity" as a label for the mystery I've exposed. You see my "communal assertability" as a surrender of the very normativity we seek to explain.

  **Realist:** Precisely. I believe you have accepted the sceptic's terms of engagement—that unless meaning can be reduced, it is nothing. I refuse those terms.

  **Skeptic:** And I believe you have accepted the Platonist's terms—that unless meaning is robustly real, it must be a magical fact. I refuse those terms. Perhaps the truth is that meaning is neither a reduction nor a magic fact, but a social status.

  **Realist:** Or perhaps the truth is that meaning is a natural fact of a rational animal, and we only think it's mysterious because we try to view ourselves from outside the space of reasons.

  **Skeptic:** Then let's leave Crusoe on his island. We can watch him from the beach. I will say he is behaving *as if* he follows rules. You will say he *does*.

  **Realist:** And the difference between those two statements is the entire stakes of the philosophy of mind.

  **Skeptic:** Agreed. But until you can explain how his solitary "does" escapes the paradox without magic, I'll stick with the "as if." It's safer.

  **Realist:** And I'll stick with the "does." Because without it, we aren't just safer; we're silent.
