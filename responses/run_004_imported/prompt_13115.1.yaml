answer: |-
  This is a fantastic question. It is genuinely philosophical, and your writing group is accidentally stumbling into a debate that has occupied philosophers of science for over a century.

  The short answer is: **Your friend is worrying about the *process* of construction, but you are defending the *logic* of the narrative. Both of you are partially right, but in the context of a mystery novel, you win.**

  Here is the breakdown of why this feels like a cheat to your friend, why it feels like a revelation to you, and where the actual line is drawn between "clever engineering" and "reverse-engineered cheating."

  ### 1. The Philosophy: Prediction vs. Accommodation
  In the philosophy of science, this is known as the debate between **Prediction** and **Accommodation**.

  *   **Prediction:** I propose a theory, and then I go out and find a *new* fact that proves it. (e.g., Einstein predicts light will bend around the sun; later, astronomers measure it during an eclipse.)
  *   **Accommodation:** I have a pile of existing facts, and I build a theory that fits them. (e.g., Darwin looked at existing species and built the theory of evolution to explain them.)

  Your friend's intuition is a common one: **Prediction feels stronger.** Why? Because of the risk of **overfitting**. If I already know the shape of the data, I can draw a curve that hits every single point perfectly, but that curve might be nonsense. It's easy to tailor a suit to a body you've already measured; it's much harder to tailor a suit that fits a body you've never seen.

  However, most philosophers and scientists agree that **Accommodation is still valid evidence**, provided the theory is *risky*. A theory is "risky" if it is specific enough that it *could have been wrong*. If your theory explains the light being off, but it would have worked just as well if the light were *on*, then it's a cheat. But if your theory *requires* the light to be off to function, then the fact supports the theory, regardless of when you wrote it down.

  **The Verdict:** Logically, a fact supports a theory based on the *strength of the link*, not the *timing of the discovery*.

  ### 2. The Genre: Mystery is Inherently Accommodation
  Here is where your friend's critique falls apart regarding the novel itself.

  A murder mystery is, by definition, an exercise in accommodation. The crime (the facts) has already happened. The detective (the theory) arrives later. The entire genre is "Inference to the Best Explanation."

  If the rule were "The detective must predict evidence we didn't already have," you couldn't write a mystery. The detective would have to say, "I believe the killer used a candle wax dagger," and *then* go find the dagger. Instead, they find the wax, and *then* deduce the dagger.

  The satisfaction of a mystery doesn't come from **novelty** (learning something new); it comes from **coherence** (seeing how things fit together).

  When you say the solution makes the light being off feel like "the last piece of a puzzle clicking into place," you are describing **explanatory power**. You aren't just fitting the fact; you are making the fact *necessary*.

  ### 3. The Real Line: "Fitting" vs. "Necessitating"
  So, where is the line between a legitimate clue and a cheat? It isn't about when you wrote it. It's about **uniqueness**.

  **It is a cheat if:**
  *   The solution is generic, but you tweaked one small detail at the end to match the Chapter 2 clue.
  *   There are five other ways the murder could have happened that also explain the light being off, but the detective ignores them.
  *   The explanation for the light is tacked on. (e.g., "The killer turned off the light because... uh... they were frugal?")

  **It is legitimate if:**
  *   The specific mechanics of the murder *require* the light to be off.
  *   The fact that the light is off rules out other suspects or methods.
  *   The explanation recontextualizes the victim's fear of the dark. (e.g., Maybe the victim wasn't afraid of the dark; they were afraid of what the light revealed in the hallway mirror? Or maybe the killer used the darkness to bypass a specific security measure that only works in light?)

  If your solution makes the light being off the **only logical outcome** of the crime, then it is not a cheat. It is a constraint.

  ### 4. Why Your Friend Feels Uneasy (and how to fix it)
  Your friend senses that because you (the author) knew the clue first, you might have unconsciously limited the possibilities of the ending to ensure it fit. They are worried about **authorial contrivance**.

  To silence this worry (both for them and yourself), ask this question: **Does the solution explain *more* than just the light?**

  A great plot twist doesn't just explain the anomaly; it explains the motive, the method, and the character psychology all at once.
  *   **Weak:** The light is off because the killer turned it off to hide. (Fits the fact, but boring).
  *   **Strong:** The light is off because the victim turned it off himself five minutes before dying, which proves he knew the killer, which proves the motive was X, which proves the killer is Y.

  If the light being off is the *key* that unlocks the rest of the door, it's brilliant. If it's just a loose screw you tightened at the end, it's a cheat.

  ### 5. A Historical Analogy for Your Writing Group
  Tell your group the story of **Neptune**.

  In the 1800s, astronomers knew the orbit of Uranus (the known fact). It was wobbly and didn't fit Newton's laws perfectly. Two mathematicians, Adams and Le Verrier, independently calculated that if there were another, unseen planet out there, its gravity would explain Uranus's wobble (the theory).

  They didn't predict the wobble; the wobble was already known. They accommodated the data. But when they pointed their telescopes at the exact spot the math demanded, **Neptune was there.**

  Did the fact that they knew about the wobble *before* the theory make the discovery of Neptune a "cheat"? No. It made it a triumph of logic. The known fact constrained the theory so tightly that the theory had nowhere to go but the truth.

  ### Summary Advice
  Your friend is protecting you from lazy writing, which is good. But their philosophical premise is slightly off for the genre.

  1.  **Trust the "Click":** If the solution makes the clue feel inevitable rather than coincidental, you have done your job.
  2.  **Check for Uniqueness:** Ensure that your solution is the *only* one that explains the light. If the light could be off for three other reasons, the clue is weak. If it can only be off for *your* reason, it's strong.
  3.  **Thematic Resonance:** Make sure the explanation of the light ties into the theme. (e.g., If the book is about secrets, the light being off is the ultimate secret).

  You haven't cheated. You've built a lock (the clue) and then forged the key (the solution). As long as the key doesn't fit any other lock, you're safe. Keep writing.
