          *   Explain *Inverse Reinforcement Learning (IRL)*: Ng & Russell. Action $\rightarrow$ Reward Function. Assumes optimality (Bellman equations).
          *   *The Connection:* Both map Behavior $\rightarrow$ Objective Function. Both rely on the assumption of *Rationality*.
          *   *The Breakdown:* Humans aren't perfectly rational. Noise, bias, framing, hyperbolic discounting break the mapping. In IRL, this is the "degeneracy" problem (many reward functions fit the data).

      *   **Part 2: The Specific Failure Modes (The "Wall"):**
          *   *Economics:* Preference reversals, framing effects. If choices aren't consistent, no utility function exists. The theory says "they aren't rational," but doesn't tell you what they *actually* want.
          *   *AI:* The "Underdetermination" problem. A robot standing still could be maximizing "stay still" or "minimize energy" or "wait for a signal." Also, if the human is suboptimal (noisy), IRL might infer the noise is the goal (e.g., inferring humans *want* to make typos).
          *   *Key Insight:* You cannot distinguish *preferences* from *beliefs/errors* using behavior alone. (This is crucial).

