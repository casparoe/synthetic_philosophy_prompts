      *   **The Standard "Blindspot" Solution:** The announcement creates a proposition that is true but unknowable *when asserted*. It's consistent, but the students can't *know* it. (Sorensen, Buridan, etc.).
      *   **Williamson's Epistemology:** Anti-luminosity. Knowledge requires a margin for error. If you know $P$, your evidence must be good enough that you couldn't easily be wrong. This implies $Kp \to KKp$ (KK principle) fails in borderline cases or even generally for non-trivial propositions.
      *   **The Connection:** How does KK failure solve SEP?
          *   The student's reasoning relies on *iterated knowledge*.
          *   To eliminate Friday, I need to know on Thursday night that the test hasn't happened.
          *   To eliminate Thursday, I need to know on Wednesday night that I *know* on Thursday night that the test hasn't happened.
          *   To eliminate Wednesday, I need to know on Tuesday night that I *know* on Wednesday night that I *know*...
          *   Williamson argues that knowledge doesn't iterate indefinitely. At some point, $K^n p$ fails even if $K^{n-1} p$ holds.
          *   The "fuzziness" isn't perceptual; it's *epistemic*. The boundary between "knowing" and "not knowing" isn't sharp.

