      *   Clear on historical context (Locke vs. Stillingfleet, Locke vs. Descartes).

  7.  **Self-Correction/Nuance Check:**
      *   *Did Locke believe matter thinks?* We don't know for sure. He likely leaned towards immaterialism for theological reasons (resurrection), but he wanted to show reason couldn't prove it. I should emphasize his *agnosticism* rather than attributing a hidden materialism to him.
