answer: |-
  This is one of the best "aha!" moments in formal epistemology, and you've pinpointed exactly where the friction lies.

  Your intuition is actually correct in one sense: **If you knew the truth, assigning 1 to truths and 0 to falsehoods is indeed the perfect state.** That is the "God's eye view." In accuracy-first epistemology, that state (the omniscient credence function) has the lowest possible inaccuracy score.

  The problem is that rationality isn't about achieving the God's eye view; it's about **managing your position relative to the God's eye view given your limited evidence.**

  Here is the build-up to why propriety is the specific mathematical feature that stops you from "gaming" the system by extremizing.

  ### 1. The Distinction: Actual vs. Expected Inaccuracy

  The core confusion comes from conflating two different things:
  1.  **Actual Inaccuracy:** How wrong you are *in the actual world*.
  2.  **Expected Inaccuracy:** How wrong you expect to be *given your current evidence*.

  You cannot minimize **Actual Inaccuracy** directly. Why? Because you don't know which world is actual! If you knew proposition $P$ was true, you would already assign it credence 1. The whole point of having a credence of 0.6 is that you *don't know* if it's true or false.

  Since you can't see the truth, the only lever you can pull is to minimize your **Expected Inaccuracy**. You want to choose a reported credence that makes you feel the "safest" or "most secure" given what you currently believe.

  **The Goal of a Scoring Rule:** A scoring rule should be designed so that the way to minimize your *Expected* Inaccuracy is to report your *Actual* Credence.

  ### 2. Why the Naive Score Fails (The Linear Trap)

  Let's look at the "naive" score you mentioned: **Absolute Distance**.
  $$ \text{Inaccuracy} = | \text{Truth Value} - \text{Reported Credence} | $$
  *(Truth Value is 1 if True, 0 if False)*

  Imagine you have evidence that suggests $P$ is **60% likely** (your true credence is 0.6). You have to write down a number $r$ between 0 and 1.

  *   **If $P$ is True:** Your score is $|1 - r|$. (Distance from 1)
  *   **If $P$ is False:** Your score is $|0 - r| = r$. (Distance from 0)

  Since you think $P$ is 60% likely, you calculate your **Expected Inaccuracy** like a weighted average:
  $$ \text{Exp. Inaccuracy} = 0.6 \times (\text{Score if True}) + 0.4 \times (\text{Score if False}) $$
  $$ \text{Exp. Inaccuracy} = 0.6(1 - r) + 0.4(r) $$
  $$ \text{Exp. Inaccuracy} = 0.6 - 0.6r + 0.4r $$
  $$ \text{Exp. Inaccuracy} = 0.6 - 0.2r $$

  **Look at that equation.** To minimize inaccuracy (make the number smaller), you want $r$ to be as **large as possible**. The math literally tells you: "Ignore your 0.6 evidence. Just write down 1."

  **The Intuition:** The naive score is *linear*. The "reward" for moving your credence closer to the truth (in the world where you are right) exactly balances the "penalty" for moving away from the truth (in the world where you are wrong), *except* weighted by your probabilities. Since you think the "True" world is more likely (0.6 vs 0.4), you should bet the house on it. It treats credence like a bet where you should always go all-in on the favorite.

  ### 3. Why Proper Scores Succeed (The Convex Shield)

  Now let's look at the **Brier Score** (squared Euclidean distance), which is a *strictly proper* scoring rule.
  $$ \text{Inaccuracy} = (\text{Truth Value} - \text{Reported Credence})^2 $$

  Same scenario: Your true credence is 0.6. You choose report $r$.
  *   **If $P$ is True:** Score is $(1 - r)^2$
  *   **If $P$ is False:** Score is $(0 - r)^2 = r^2$

  Calculate **Expected Inaccuracy**:
  $$ \text{Exp. Inaccuracy} = 0.6(1 - r)^2 + 0.4(r^2) $$

  Without doing the calculus, here is the intuitive shift: **Squaring creates a non-linear penalty.**

  In the naive version, moving from 0.9 to 1.0 confidence cost you the same amount of "safety" in the False world as moving from 0.5 to 0.6.
  In the Brier version, **being confidently wrong is disproportionately painful.**

  *   If you report 0.6 and are wrong, penalty is $0.6^2 = 0.36$.
  *   If you report 0.9 and are wrong, penalty is $0.9^2 = 0.81$.

  By pushing your report to 1 (to grab the maximum reward in the True world), you are exposing yourself to a **catastrophic penalty** in the False world. Even though you think the False world is unlikely (40%), the penalty is so severe that it drags down your expectation.

  **The "Valley" Intuition:**
  Imagine your Expected Inaccuracy as a landscape.
  *   **Naive Score:** The landscape is a straight slide. The lowest point is always at the cliff edge (0 or 1). You are incentivized to slide to the edge.
  *   **Proper Score:** The landscape is a valley (a parabola). The bottom of the valley is located exactly at your true credence (0.6). If you try to climb the slope toward 1 to look more confident, the ground rises beneath you (your expected inaccuracy increases) because the risk of the "False" world starts weighing too heavily.

  ### 4. So, what does Propriety actually *do*?

  Propriety is the mathematical guarantee that **honesty is the best policy.**

  When Joyce and others insist on strictly proper scoring rules, they are essentially saying:
  > "We need a measurement system where an agent cannot improve their expected score by lying about their uncertainty."

  If the rule isn't proper, the measurement system itself is corrupting the epistemology. It's like using a ruler that shrinks as it gets longer; it incentivizes you to measure things incorrectly to get a "better" number.

  **To answer your specific question:**
  > *Why doesn't tracking the truth mean reporting 1?*

  Because "tracking the truth" for a finite agent doesn't mean "claiming omniscience." It means "positioning yourself such that, no matter how the world turns out, you have minimized your anticipated error."

  If you report 1 when you only have 0.6 evidence, you are **overfitting** your evidence. You are claiming more precision than your evidence supports. Proper scoring rules punish overfitting. They impose a "complexity penalty" on confidence.

  *   **Naive Rule:** "I don't care how you got there, just be close to the truth." (Incentivizes guessing).
  *   **Proper Rule:** "I care how close you are to the truth *relative to the confidence you claimed*." (Incentivizes calibration).

  ### Summary Gut-Check

  Imagine a weather forecaster.
  *   **Forecaster A** says "100% Rain" every day. On rainy days, they are perfect. On sunny days, they are perfectly wrong.
  *   **Forecaster B** says "60% Rain" on days that look cloudy. On rainy days, they are slightly off. On sunny days, they are slightly off.

  If we use a **Naive Score**, Forecaster A looks better on rainy days and we incentivize them to keep ignoring the sunny days.
  If we use a **Proper Score**, Forecaster A gets hammered so hard on the sunny days that their *season average* is worse than Forecaster B.

  Propriety ensures that the rational move is to match your report to your evidence, because the **marginal cost of increasing confidence** eventually outweighs the **marginal benefit of being right.** It forces you to respect the possibility that you might be wrong.
