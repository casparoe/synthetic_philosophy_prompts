answer: |-
  Since our reading group tradition requires a closing joke, I thought I'd try one on Sidgwick. But fair warning: if you think Sidgwick was just a Victorian eccentric with a hobby for séances, this won't land. It only works if you understand why he *needed* the séances to work.

  Sidgwick ends *The Methods of Ethics* with the Dualism of Practical Reason: Rational Egoism and Utilitarianism are both reasonable, but they conflict unless there's a "Moral Order of the Universe"—like personal immortality—to ensure duty and self-interest eventually coincide. He spent the next thirty years in the Society for Psychical Research desperately looking for empirical proof of that Moral Order.

  But here's the tragedy: when the Creery sisters seemed to prove telepathy, Sidgwick's scrupulous ethical rigor forced him to investigate them so thoroughly that he uncovered their signaling code and publicly retracted the results.

  So, the joke is this: Henry Sidgwick is the only man in history to debunk his own ticket to heaven. If he'd been a slightly worse ethicist, he could have accepted the fraud, solved the Dualism, and died at peace. Instead, he proved that the "Moral Order of the Universe" cannot survive an audit by the *Methods of Ethics*.
