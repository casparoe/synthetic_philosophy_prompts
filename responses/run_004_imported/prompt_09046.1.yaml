answer: |-
  This is an excellent question that touches on one of the most common misconceptions in theoretical computer science. You have correctly identified a tension between classical and quantum computing, but the conclusion rests on a subtle distinction between **computability** and **complexity**.

  The short answer is: **No, quantum computing does not falsify the Church-Turing Thesis.** However, it does challenge a stronger version of it known as the **Extended Church-Turing Thesis.**

  Here is the detailed breakdown of why your premise needs a slight adjustment.

  ### 1. Computability vs. Complexity
  The core of the confusion lies in the definition of "computable."

  *   **The Church-Turing Thesis (CTT)** is about **computability**. It asks: *Can this problem be solved by an algorithm at all, given infinite time and memory?*
  *   **Complexity Theory** is about **efficiency**. It asks: *Can this problem be solved in a reasonable amount of time (e.g., polynomial time)?*

  The Church-Turing Thesis claims that if a human can follow a mechanical procedure to solve a problem, a Turing machine can also solve it. It makes **no promises about speed.**

  **How this applies to Quantum Computing:**
  A classical Turing machine **can** simulate a quantum computer. It can calculate exactly what a qubit would do, how superpositions would interfere, and what the final measurement would be.
  *   **The Catch:** To simulate a quantum system with $n$ qubits, a classical Turing machine generally requires resources that grow exponentially with $n$.
  *   **The Result:** A classical computer *could* run Shor's algorithm to factor a 2048-bit number, but it might take longer than the age of the universe. A quantum computer could do it in hours or days.

  Because the classical Turing machine *can* do it (eventually), the problem is still "computable." Therefore, the Church-Turing Thesis remains intact.

  ### 2. What Shor's Algorithm Actually Does
  You mentioned that classical computers are "fundamentally incapable" of factoring large numbers. This is not strictly true.

  Classical computers factor numbers all the time. If you ask a classical computer to factor 15, it tells you $3 \times 5$ instantly. If you ask it to factor a 50-digit number, it can do that too, but it takes a while. If you ask it to factor a 600-digit number (typical for RSA encryption), it would take thousands of years using current best-known algorithms.

  Shor's algorithm does not make factoring **possible**; it makes factoring **efficient**. It changes the complexity class of the problem from something intractable for classical machines to something tractable for quantum machines.

  Since the Church-Turing Thesis is only concerned with what is *possible* (not what is *practical*), Shor's algorithm is not a counterexample.

  ### 3. The Extended Church-Turing Thesis (ECT)
  Your intuition is not wrong; you are just applying it to the wrong thesis. There is a stronger hypothesis called the **Extended Church-Turing Thesis** (sometimes called the "Strong Church-Turing Thesis").

  The ECT states:
  > *Any physically realizable computational process can be efficiently simulated by a probabilistic Turing machine.*

  "Efficiently" here usually means within polynomial time.

  **Quantum computing *does* challenge the Extended Church-Turing Thesis.**
  If quantum computers can solve problems (like factoring or simulating quantum systems) exponentially faster than any classical probabilistic Turing machine, then the ECT is false. Most computer scientists believe that quantum computing **has** falsified the Extended Church-Turing Thesis, or will do so once we build large-scale, error-corrected quantum computers.

  ### 4. Why the Distinction Matters
  In science, a "counterexample" must contradict the specific claim being made.
  *   **Claim (CTT):** "A Turing machine can compute anything that is algorithmically solvable."
  *   **Observation:** "A quantum computer solves factoring faster than a Turing machine."
  *   **Verdict:** Not a counterexample. The Turing machine can still solve it, just slowly.

  *   **Claim (ECT):** "A Turing machine can efficiently simulate any physical process."
  *   **Observation:** "A quantum computer solves factoring exponentially faster than a Turing machine."
  *   **Verdict:** Likely a counterexample.

  ### Summary
  You have correctly identified that quantum computing changes our understanding of what is **efficiently** computable in the physical universe. However, the original Church-Turing Thesis is a much lower bar: it only cares about what is **theoretically** computable.

  Since a classical Turing machine can simulate a quantum computer (albeit very slowly), the original Church-Turing Thesis stands firm. It is the **Extended** Church-Turing Thesis that quantum mechanics threatens to overturn.

  This is a sophisticated distinction that often trips up students, so asking this question shows you are thinking deeply about the material!
