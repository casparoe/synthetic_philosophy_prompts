answer: |-
  It is a pleasure to correspond with a colleague who has spent a career in the trenches of evolutionary morphology. Your intuition is sharp, and I can confirm that the puzzle you have identified is not only genuine but lies at the very heart of the conceptual shift Gould attempted to engineer between 1979 and 1982. Many readers gloss over the tension you have spotted, but given your background in limb morphology, the discrepancy between the architectural metaphor and the biological reality of something like feathers is immediately glaring.

  Here is a breakdown of how the two concepts relate, which one carries the philosophical weight, and why Gould felt compelled to introduce the second term.

  ### 1. Direct Comparison: Origin vs. Utility

  To resolve the puzzle, we must distinguish between **historical origin** and **current utility**.

  *   **Spandrel (1979):** This term describes **origin**. A spandrel is a trait that arises as a necessary structural or developmental consequence of another trait (the "arch"), without being directly selected for itself. In the 1979 paper, the emphasis is on the *non-adaptive origin*. Whether a spandrel remains useless or is later co-opted is secondary to its definition as a byproduct.
  *   **Exaptation (1982):** This term describes the **relationship between origin and current utility**. An exaptation is a trait that is currently useful (it has "aptation") but was not shaped by natural selection *for that current use*.

  The confusion arises because "Spandrel" is often colloquially used to mean "a trait that was co-opted," but strictly speaking, it refers to the *architectural necessity* of the trait's emergence.

  ### 2. The Venn Diagram: Are they subsets of one another?

  Based on the strict definitions in the papers:

  **Are all spandrels exaptations?**
  **No.** A spandrel is only an exaptation if it is subsequently co-opted for a function. If a structural byproduct remains functionally neutral or detrimental throughout its existence, it is a spandrel (a non-adaptive byproduct), but it is not an exaptation (which requires current utility). However, in evolutionary discourse, we rarely talk about spandrels unless they have been co-opted, which leads to the conflation.

  **Are all exaptations spandrels?**
  **No.** This is the specific insight you grasped regarding feathers.
  *   **Case A (Spandrel $\rightarrow$ Exaptation):** A bone suture exists because of growth mechanics (spandrel). Later, it provides an anchor point for a new muscle (exaptation).
  *   **Case B (Adaptation $\rightarrow$ Exaptation):** Feathers evolve via selection for thermoregulation (Adaptation). Later, they are co-opted for flight (Exaptation).

  In Case B, the trait was *not* a spandrel in its origin. It was an adaptation for insulation. Therefore, **exaptation is the broader category.** It encompasses both traits that originated as non-adaptive byproducts (spandrels) and traits that originated as adaptations for *other* functions.

  ### 3. Which concept does the philosophical work?

  This is the crux of your question regarding the "Panglossian paradigm."

  **"Spandrels" (1979) is the polemical hammer.**
  The 1979 paper is a critique. Its philosophical work is negative: it aims to dismantle the assumption that *every* trait is an optimization product of natural selection. By invoking the architectural metaphor, Gould and Lewontin argued that constraints, developmental pathways, and phylogenetic history force organisms into certain shapes regardless of utility. The "Spandrel" is the poster child for **Non-Selectionism**. It tells the adaptationist: "Stop looking for a selective advantage for this; it's just there because of the arch."

  **"Exaptation" (1982) is the taxonomic repair.**
  The 1982 paper is constructive. Its philosophical work is to separate **history** from **utility**. Gould and Vrba realized that "Adaptation" was being used ambiguously to mean both "currently useful" and "historically selected for current use."
  *   They introduced **Aptation**: Current utility.
  *   They reserved **Adaptation**: Current utility + Historical selection for that utility.
  *   They introduced **Exaptation**: Current utility + Historical selection for *different* utility (or no utility).

  So, to answer your question: **"Spandrels" does the heavy lifting against the Panglossian paradigm** by asserting that not everything is an adaptation. **"Exaptation" serves as the housekeeping vocabulary** that allows biologists to talk about co-option without implying that the trait was originally a non-adaptive byproduct.

  ### 4. Why introduce a second term only three years later?

  You asked why Gould felt the need to introduce "exaptation" so soon after "spandrel." There are three likely reasons, stemming from the reception of the 1979 paper:

  1.  **Correcting Misuse:** As you noted, readers began using "spandrel" as a synonym for "co-opted trait." Biologists would say, "The wing is a spandrel," meaning it was co-opted from a leg. But if the leg was selected for walking, it wasn't a spandrel; it was an adaptation co-opted for flight. Gould needed a term that covered co-option *without* implying non-adaptive origin.
  2.  **Expanding the Scope:** The "Spandrels" paper was heavily focused on constraints and structuralism. However, Gould recognized that the greatest source of evolutionary novelty often comes from shifting the function of *existing adaptations*, not just utilizing byproducts. The "feathers for insulation $\rightarrow$ flight" scenario is a much more common evolutionary pathway than the "architectural byproduct $\rightarrow$ function" scenario. "Spandrel" was too narrow to capture the bulk of evolutionary co-option.
  3.  **From Critique to Framework:** The 1979 paper was a manifesto; the 1982 paper was a methodology. Gould and Vrba wanted to provide a testable framework for distinguishing adaptations from exaptations. You cannot test for a "spandrel" easily (how do you prove a negative regarding selection?), but you can hypothesize about functional shifts. "Exaptation" provided a vocabulary for reconstructing evolutionary history without assuming current function equals original function.

  ### A Note on your Specific Field

  Given your work on bird limb morphology, the distinction is particularly poignant. Consider the avian wrist.
  *   If the semilunate carpal block arose strictly as a developmental consequence of scaling down the forelimb (a structural necessity), and *then* allowed for the folding motion required for flight, it fits the **Spandrel $\rightarrow$ Exaptation** model.
  *   If, however, that wrist morphology was selected for prey capture or climbing in a terrestrial maniraptoran (an adaptation for grasping), and *then* co-opted for the flight stroke, it fits the **Adaptation $\rightarrow$ Exaptation** model.

  In the 1979 framework, both might be loosely tossed into the "spandrel" bin by a critic of adaptationism. In the 1982 framework, only the first is a spandrel; both are exaptations for flight.

  ### Summary

  Your puzzlement was well-founded. The 1982 paper effectively admits that the 1979 metaphor was too restrictive.
  *   **Spandrel:** A claim about **origin** (Non-adaptive byproduct).
  *   **Exaptation:** A claim about **history vs. current use** (Use $\neq$ Origin of Selection).
  *   **Relation:** All co-opted spandrels are exaptations, but not all exaptations are spandrels.
  *   **Philosophical Role:** Spandrels attack the *assumption* of universal adaptationism; Exaptations provide the *language* to describe evolutionary history accurately.

  Gould introduced the second term because "Spandrel" was too successful as a slogan and too imprecise as a scientific category. He needed a term that acknowledged the ubiquity of co-option without forcing every co-opted trait into the box of "non-adaptive architectural byproduct."
