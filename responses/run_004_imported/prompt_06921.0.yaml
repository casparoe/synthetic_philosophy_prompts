      *   **Requirements:** Ground the answer in *āptatva*, *tātparya*, and *parataḥ-prāmāṇya*.

  2.  **Analyze the Core Nyāya Criteria for Śabda:**
      *   *Śabda* is not just sound or grammar. It is *āptavacana* (the statement of a trustworthy person).
