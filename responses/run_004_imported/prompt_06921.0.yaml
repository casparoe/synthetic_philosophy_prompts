          *   *Śābdabodha* (verbal cognition).
          *   *Conditions for Śabda:* Ākāṅkṣā (expectancy), Yogyatā (fitness), Āsatti (contiguity).
          *   *Nyāya Strategy:* Reducing rival *pramāṇas* (like *arthāpatti*) to *anumāna* (inference) if criteria aren't met.
          *   *Parataḥ-prāmāṇya:* Validity is established extrinsically (after the fact, through testing/verification), though cognition arises intrinsically.
      *   **The Case:** A true, well-founded belief formed based on an LLM output.
          *   No individual human knower behind the specific sentence.
