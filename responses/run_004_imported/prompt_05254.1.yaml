answer: |-
  The wine was the same cheap Cabernet they used to drink in the library stacks, though the bottle cost twenty times as much now. Elena swirled the glass, watching the legs run down. Marcus sat opposite her, his hands folded on the table, the way he sat when he was waiting for a student to finish a mistaken proof.

  "It was the grief again," Elena said. "The one from the winter my father died. I wrote the line *'the cold that lives inside the bone before the winter knows it's coming.'* I wrote it last week. But I knew the feeling ten years before I found the words. And I know, Marcus, that if I feel it again, I will know it is *that* specific cold. Not just sadness. That cold."

  Marcus didn't touch his glass. "You're describing a private ostensive definition, El. You're pointing inward at a sensation and naming it 'S'."

  "I'm naming a human experience. There's a difference."

  "Is there? Let's walk through it. Just like the diary case. You have this sensation. You concentrate on it. You say to yourself, 'This is *that* cold.' You write the line. Ten years pass. You feel something. You say, 'Ah, *that* cold has returned.' How do you verify that?"

  "Because it fits," she said. "It clicks into place. Like a key in a lock."

  "But who holds the lock?" Marcus leaned forward. "In the *Investigations*, §258, Wittgenstein asks what it means to say you've identified the sensation *correctly*. You say 'it fits.' But 'fitting' is just another sensation. How do you know the memory of the cold ten years ago is accurate? You can't appeal to the memory to check the memory. That's circular."

  "I don't need to check it against a database, Marcus. I need to check it against the truth of the experience."

  "And what is the criterion for that truth? If you write 'S' in your diary today, and 'S' in your diary next month, what distinguishes 'I have the same sensation' from 'it *seems* to me I have the same sensation'?"

  "The resonance," Elena said sharply. "The line sits in the room. It doesn't rot. I wrote *'the bird forgetting the shape of the air'* when I was twenty-four. I didn't show it to anyone for five years. When I finally read it to a workshop, people wept. They recognized the airlessness. But the truth of the line existed before they wept. My recognition of the feeling wasn't dependent on their validation."

  Marcus shook his head. "That's the trap. The fact that they wept five years later makes it a public language game. That's when 'airlessness' got a criterion. But your claim is about the moment *before*. The moment you were alone with the feeling. You claim you identified it correctly *then*. But if the only judge is you, and the only evidence is your impression of correctness, then whatever seems right to you *is* right."

  "That's not what he says."

  "It's exactly what he says. 'Whatever is going to seem right to me is right. And that only means that here we can't talk about 'right'.'"

  Elena set her glass down. The stem chimed against the wood. "You're turning me into a beetle in a box. You think because I can't show you the beetle, I'm talking about nothing."

  "I never said that."

  "You imply it. You treat the private sensation as epistemologically bankrupt."

  "I treat the *grammar* of the private sensation as bankrupt," Marcus corrected. "If you have a word that refers only to something only you can know, and you have no way to distinguish using the word correctly from using it incorrectly, the word drops out of the language. It does no work."

  "It does work!" Elena's voice rose. "It organizes my consciousness. It allows me to navigate my own history. If I call it 'the cold,' I know how to move through it. I know not to try to warm it with fire. That is work."

  "That is behavior," Marcus said. "You can describe the behavior without positing a private object that you have uniquely identified. You can say 'I am shivering' or 'I am withdrawing.' But you insist that there is an inner *this* that you have tagged. And I am asking you: what constitutes the tag staying on the right object?"

  "Consistency," she said. "The phrase holds. If I had misidentified it, the poem would have collapsed. A lie doesn't hold its shape for twenty years, Marcus. A mistake in naming reveals itself. If I called a sharp pain 'the cold,' the metaphor would break. It would feel false the next time I tried to use it."

  "But 'feeling false' is just another feeling," Marcus persisted, relentless. "You're just adding another layer of seeming. You feel it's consistent. But how do you know your feeling of consistency is reliable? You are assuming your memory and your introspection are infallible judges. Wittgenstein isn't saying you don't feel anything. He's saying you can't establish a rule for correctness based solely on internal impression."

  Elena leaned back, crossing her arms. She looked at him, really looked at him, seeing the gray creeping into his beard, the fatigue in his eyes that matched her own.

  "You're forgetting the end of the passage," she said quietly.

  Marcus paused. "Which passage?"

  "§258. You stop at 'we can't talk about right.' You skip the remark that follows. He refuses to say the sensation is *nothing*."

  "I know the text, El."

  "Then recite it."

  Marcus looked down at his hands. " 'It is not a something, but not a nothing either!'"

  "Exactly," Elena said. "He grants the sensation exists. He grants it has a reality. He just denies you the right to build a logic on it that excludes the public. But my logic *includes* the public, eventually. The poem is the bridge. I name the 'nothing-that-is-not-a-nothing' privately, and I throw the bridge out. If it lands, the naming was correct. If it doesn't, it was solipsism."

  "But that makes the correctness dependent on the landing," Marcus argued. "Not on the initial naming. You're claiming prophetic authority. You're saying you knew the name was true *before* the bridge landed."

  "Because the name felt true," Elena said. "Because the sensation demanded that shape. You want a criterion of correctness that exists outside the experience. I'm telling you the experience *is* the criterion. The 'click' is the data."

  "The 'click' is a neurological event," Marcus said. "It's not a logical justification."

  "It's the only justification art has!"

  "And philosophy?" Marcus countered. "Philosophy has to show how the language functions. If you say 'I know this is the same feeling,' you are making a knowledge claim. Knowledge requires the possibility of error. If you cannot be wrong, you do not know. You just are."

  Elena was silent for a long moment. She picked up her wine glass again, but didn't drink.

  "Okay," she said. "Let's assume you're right. Let's assume I can't know I'm right. Let's assume I'm just writing 'S' in a diary and hoping. What do you lose?"

  "I lose the coherence of language," Marcus said. "If we allow private definitions to count as knowledge, communication becomes a miracle. We assume we understand each other, but we're all just pointing at private beetles."

  "And if I'm right?" Elena asked. "If there is a thread of continuity in the human soul that can be named before it is shared? If the feeling has a shape that precedes the word?"

  "Then you're a mystic," Marcus said. "And I can't argue with mystics. I can only analyze their grammar."

  "I'm not a mystic. I'm a poet. I deal in the specific." She leaned forward, mirroring his posture. "Here is what I propose. We agree on what would have to be true for either of us to win."

  Marcus raised an eyebrow. "Go on."

  "For you to be right," Elena said, "it must be true that my certainty is an illusion. That the 'click' is just a habit, and that the meaning of 'the cold' is entirely constructed by the reactions of others. If the poem fails to connect, the feeling never existed as a namable thing. The public creates the private."

  Marcus nodded slowly. "And for you to be right?"

  "For me to be right," Elena said, "it must be true that the sensation has an integrity independent of the language game. That I can be faithful or unfaithful to the feeling itself, not just to the usage of the word. That the 'click' is a recognition of truth, not just a neurological habit. The private validates the public."

  Marcus considered this. He picked up his glass finally, taking a sip. "So. The condition is the source of authority."

  "Yes," Elena said. "Does the authority come from the community's use, or from the individual's fidelity to the experience?"

  "If the authority comes from the individual," Marcus said, "then we can never know if we agree. We are trapped."

  "If the authority comes from the community," Elena said, "then we are never alone. Even when we think we are."

  They sat in the silence that followed. It wasn't the silence of grad school, which had been competitive and sharp. This was heavier. It acknowledged that neither could convince the other without ceasing to be who they were. Marcus could not stop looking for criteria. Elena could not stop trusting the click.

  "If I publish the poem," Elena said softly, "and someone reads it and says, 'Yes, that is the cold.' Have I proven you wrong?"

  "No," Marcus said. "You've proven that the language game is now public. You've brought the beetle out of the box. But you haven't proven you identified the beetle correctly *when it was in the box*."

  "And if I write it," Elena said, "and no one ever reads it, and I burn it. But I knew, while I wrote it, that it was true. Have I proven you wrong?"

  Marcus looked at her. He thought about the diary case. He thought about the sensation that is not a nothing. He thought about twenty years of teaching students that meaning is use, while privately grieving a loss he had never named to anyone.

  "No," Marcus said. "But you haven't proven me right, either. Because if no one reads it, it isn't language. It's just noise."

  "Then we're stuck," Elena said.

  "We're stuck," Marcus agreed.

  "Good," Elena said. She raised her glass. "To the beetle in the box."

  Marcus clinked his glass against hers. "To the grammar of the cold."
