answer: |-
  Thank you all for being here. Especially you, Mom. And you, Uncle [Name]. And the crew from the workshop.

  If you knew my dad, you know that standing up here to talk about "a life well-lived" is a little bit like standing on the deck of that lightship in the backyard and talking about navigation. You can talk about where it *should* go, but the truth is, it was never built to leave the dock.

  For thirty years, Dad poured every spare dollar and every weekend into restoring that boat. To some of you in this room, that boat is a monument to stubbornness. To others, it's a masterpiece. To Dad, it was an argument.

  He found this essay once, back in 2001, by a philosopher named Moritz Schlick. He read it, and basically, that was it. That was the rest of his life's operating system. He didn't talk about it in philosophy terms, usually. He talked about it in terms of IOUs.

  Dad believed that most of us spend our lives writing IOUs to the future. We work to get money, to get security, to get a retirement, to get a time when we can finally relax. We treat today as a toll booth we have to pass through to get to somewhere else. He called that "work," even if you were painting or gardening. If you were doing it for the result later, it was work.

  But he believed real meaning—the only kind that actually counts—happens when you do something that *is* the point. Not for the money, not for the finish line, not for the applause. You do it because the doing of it is the reward. He called that "play."

  Now, I know what some of you are thinking. I know my sister has heard this from the family side of the room for decades. "Play" sounds frivolous. It sounds like he had a choice between being responsible and being a kid, and he picked being a kid.

  But that's the simplified version. And Uncle [Name], I know you've read the essay, so you know I'm not talking about "childlike wonder." I'm talking about a structural distinction. Dad wasn't trying to be carefree. He was trying to be present.

  He looked at that lightship, a vessel designed to warn others away from danger, sitting in a yard in [Your Town], and he didn't see a waste. He saw the only honest thing he could do. Sanding the teak wasn't a means to a sailing trip. Sanding the teak *was* the trip.

  I need to say something about the cost of that, because a eulogy that ignores the cost isn't true.

  Living with a man who treats his life as a philosophical proof is not easy. It requires patience from the people who have to balance the checkbook. It requires grace from the people who worry about retirement funds and practical realities.

  Mom, you lived with the sharp edge of his conviction more than anyone. You watched money go into the hull that could have gone into the house. You watched time go into the rigging that could have been spent on vacations or ease. There were years where his commitment to this idea of "meaning" felt like a neglect of duty. I know there was frustration. I know there was loneliness in that frustration.

  But I also know that you loved him enough to let him be who he was, even when who he was was inconvenient. You held the world together so he could stay inside his argument. If there is meaning in endurance, and if there is meaning in loyalty, you embodied that more than he ever did. He found the theory; you lived the practice.

  To his friends from the workshop: You saw him when he was in the flow. You saw that when he was elbow-deep in engine grease or arguing about brass fittings, he wasn't escaping life. He was engaging with it more fully than he did anywhere else. You didn't see a man wasting time. You saw a man who had figured out how to stop waiting for his life to start.

  Both of those things are true. He was impractical, and he was alive. He was difficult, and he was radiant.

  I think the best way to honor him isn't to finish the boat. I'm not even sure the boat needs to sail. The best way to honor him is to look at our own lives and ask ourselves: How much of this is an IOU?

  How much of what we do today is just a toll booth for a future that isn't guaranteed? How much are we waiting to live?

  Dad didn't leave us a fortune. He didn't leave us a legacy of status. He left us a lightship that sits in the grass, and a question that's harder to answer than it looks.

  He spent thirty years proving that the meaning of life isn't found at the destination. It's found in the work you would do even if you knew you'd never finish it.

  Rest well, Dad. The argument is over. You made your point.
