answer: |-
  This is one of the sharpest questions currently being debated in cognitive science. You have correctly identified that Clark and Hohwy are working from the same mathematical engine (the Free Energy Principle and Active Inference) but are driving the vehicle in opposite directions.

  As a software engineer, you are well-positioned to see the core issue: **Is the Markov Blanket a system architecture boundary (an API interface) or a deployment boundary (a container)?**

  Here is the breakdown of why the split exists, where the math ends and the metaphysics begins, and whether the formalism itself dictates a winner.

  ### 1. The Shared Formalism (The "Codebase")

  To ground this in your ML background: Both agree the brain is running something like a Variational Autoencoder (VAE) or a Hierarchical Bayesian Model.
  *   **The Goal:** Minimize Variational Free Energy (essentially the ELBO, or Evidence Lower Bound).
  *   **The Mechanism:** Update posterior beliefs ($q$) to match the true posterior ($p$), or change sensory data ($o$) to match the predictions.
  *   **The Structure:** Hierarchical layers passing prediction errors up and predictions down.

  Mathematically, there is no disagreement here. The divergence starts when they ask: **"Where does the computation stop and the world begin?"**

  ### 2. The Fork in the Road: The Markov Blanket

  The mathematical concept driving the disagreement is the **Markov Blanket (MB)**. In probabilistic graphical models, a Markov Blanket renders a node conditionally independent of the rest of the graph. In the Free Energy Principle (FEP), the MB separates **Internal States** (brain) from **External States** (world) via **Sensory States** (inputs) and **Active States** (outputs).

  $$ \text{Internal} \perp \text{External} \mid \text{Sensory} + \text{Active} $$

  #### Hohwy's Reading: The MB as a Container (Internalism)
  Hohwy treats the Markov Blanket as an **ontological boundary**.
  *   **The Argument:** Because the internal states are conditionally independent of external states *given* the blanket, the brain is statistically isolated. It never touches the world; it only touches its own sensory inputs.
  *   **The Inference:** Therefore, the brain is "self-evidencing." It is inferring the causes of its own sensory states. Even when it acts, it is essentially performing a "perceptual experiment" on itself to verify its model.
  *   **The Metaphysics:** This supports **Internalism**. The mind is what happens inside the blanket. The environment is just a hidden cause ($z$) that is inferred, not a part of the cognitive machinery.
  *   **Engineering Analogy:** The brain is a sandboxed microservice. It receives JSON (sensory data) and sends commands (active states). It cannot access the database (world) directly, only through the API. Therefore, the "logic" resides entirely within the microservice.

  #### Clark's Reading: The MB as an Interface (Extended Mind)
  Clark treats the Markov Blanket as a **functional interface**.
  *   **The Argument:** Conditional independence does not mean causal isolation. In Active Inference, "Active States" are part of the blanket. This means the system *must* act on the world to minimize free energy. The loop is closed *through* the environment.
  *   **The Inference:** If the goal is error minimization, and the most efficient way to minimize error is to change the world (e.g., moving your eyes to reduce visual uncertainty, or using a notebook to store memory), then the cognitive process *includes* those actions and tools.
  *   **The Metaphysics:** This supports **Extended Cognition**. The boundary of the "mind" is wherever the error-minimization loop effectively closes. If the environment reliably supports the model, it is part of the model.
  *   **Engineering Analogy:** The brain is a controller in a feedback loop with a plant (the body/world). You cannot understand the stability or function of the controller without modeling the plant. If the controller offloads state storage to a register in the plant, that register is functionally part of the control system.

  ### 3. The Role of Action: Inference vs. Control

  The deepest technical divergence lies in how they interpret **Active Inference**.

  In Active Inference, action is treated as inference. You select a policy ($\pi$) that minimizes *Expected* Free Energy.
  *   **Hohwy:** Focuses on the **epistemic** value. Action is about sampling data to resolve uncertainty. I move my hand to see if it feels like my hand. The action is in service of the internal model's accuracy. The "world" is a hypothesis to be tested.
  *   **Clark:** Focuses on the **pragmatic** value. Action is about shaping the world to fit the model. I move my hand to grab the cup. The action is in service of keeping the organism alive by manipulating external states. The "world" is a resource to be leveraged.

  **The Tension:**
  Hohwy argues that because action is selected to minimize *variational* free energy (which is a function of the brain's *own* distribution $Q$), the brain is trapped in its own hypothesis space. It is optimizing its own bounds, not necessarily the world.
  Clark counters that the *content* of those hypotheses is essentially sensorimotor. You cannot have a hypothesis about "grasping" without the mechanics of the hand and the physics of the object being part of the generative model's structure.

  ### 4. Is the Split in the Math or the Metaphysics?

  To answer your core question: **It is primarily metaphysical overlay on a neutral (but constraining) formalism.**

  The math of the Free Energy Principle describes **dependencies**, not **boundaries of cognition**.
  1.  **Math says:** "Internal states track external states via a blanket."
  2.  **Hohwy says:** "Therefore, the mind is the internal states."
  3.  **Clark says:** "Therefore, the mind is the tracking relation itself."

  The formalism does not force Hohwy's conclusion. The Markov Blanket proves statistical separation, but it does not prove that the *cognitive process* is limited to the statistically separated node. In control theory, a PID controller is distinct from the motor, but the "system" is both. Hohwy defines the "mind" as the controller; Clark defines the "mind" as the control loop.

  **However, the math is not entirely silent.**
  There is a slight technical lean toward Hohwy regarding **representation**. In the standard FEP formulation, the variational distribution $Q$ is encoded in the internal states (neural activity). The environment does not hold $Q$; the environment holds the *causes* that $Q$ approximates. Strictly speaking, the *inference* happens inside. Clark has to argue that the environment holds *parts of the model* (e.g., the structure of the niche), not the posterior distribution itself.

  ### 5. Why They Can't Squaring It

  They are answering different questions using the same equations.

  *   **Hohwy is asking an Epistemological Question:** "What can the brain know?"
      *   Answer: Only its own model. Hence, internalism.
  *   **Clark is asking a Functional/Engineering Question:** "How does the system solve the problem?"
      *   Answer: By using every available resource (body, tools, environment). Hence, extended mind.

  **The "Bug" in the Debate:**
  They often talk past each other on the definition of "Model."
  *   For **Hohwy**, the Model is the **Probabilistic Representation** (the weights/parameters in the brain).
  *   For **Clark**, the Model is the **Generative Process** (the entire causal structure including the body and world that generates sensations).

  ### 6. Verdict for the Engineer

  If you are looking for a technical resolution:
  1.  **The Formalism is Neutral:** You can implement Active Inference in a robot. Whether you call the robot's mind "extended" or "internal" does not change the loss function or the gradient updates.
  2.  **Hohwy is Safer Statistically:** His view aligns more strictly with the definition of the Markov Blanket as a statistical boundary. If you define "mind" as "the thing doing the variational inference," it's the brain.
  3.  **Clark is Safer Functionally:** His view aligns better with embodied robotics and enactivism. If you define "mind" as "the thing that successfully minimizes surprise over time," it's the whole loop.

  **Conclusion:**
  The disagreement is not a bug in the math; it is a feature of the interpretation. The Predictive Processing framework provides a **mechanism** (error minimization), but it does not provide a **demarcation criterion** for the mind.

  Hohwy reads the mechanism as proof of isolation (because the error signal is internal).
  Clark reads the mechanism as proof of coupling (because the error signal drives action that changes the external source).

  As a software engineer, you might view it this way: Hohwy is interested in the **source code** (which lives in the brain). Clark is interested in the **runtime environment** (which includes the hardware and the network). Both are necessary to understand the program, but they lead to different claims about where the "program" actually lives. The math describes the data flow; the philosophy decides where to draw the system diagram.
