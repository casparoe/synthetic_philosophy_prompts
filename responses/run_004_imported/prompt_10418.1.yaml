answer: |-
  Thank you for being here.

  My brother died three weeks ago. He was twenty-six years old.

  It is a specific, cruel coincidence that this is the same age Frank Ramsey was when he died in 1930. Ramsey was a mathematician and philosopher, and for most of you, that name won't mean anything. But for my brother, it meant a great deal. Since university, he reread Ramsey's "Epilogue" every year. It was a talk Ramsey gave to his friends at Cambridge, and it became the lens through which my brother viewed his own life.

  I know we are gathered here to mourn a life cut short. The instinct, in moments like this, is to look up. We are told to find comfort in the stars, or told to accept that we are small parts of a vast, indifferent machine. We hear the eulogy cliché: that while we are merely specks in the cosmos, our love is "big enough" to outweigh the void.

  My brother would have winced at that. In fact, he asked me not to say it.

  He loved Ramsey's argument because it refused to concede the point. Ramsey wrote that feeling humbled by the physical vastness of the universe is a category error. Significance, he argued, is not a matter of physical size. A map is not useful because it is as big as the territory; a portrait is not valuable because it is life-size.

  My brother lived by the idea that his picture of the world was "drawn in perspective, and not like a model to scale."

  To the philosophers here: you know the argument better than I. To everyone else: what this meant for him was that he didn't need the universe to notice him to matter. He didn't need his impact to echo for a billion years to be real. The value of a thing isn't determined by how much space it takes up, or how long it lasts in the cold timeline of astrophysics.

  He used to joke about the heat death of the universe. He'd say it was a future cost so heavily discounted it had almost no present value. Why should the end of everything subtract from the worth of right now?

  So, I am not going to tell you that he lives on in the stars. I am not going to tell you that the universe has a plan, or that his significance is saved by the fact that we remember him. That would imply that without our memory, or without the cosmos's approval, he would be less than he was.

  He was not small. He was exactly the size of a human life, which is the only scale that matters for human things.

  Grief feels vast because love feels vast. That isn't a metaphor to make us feel better against the astronomy; it is the actual measurement. The pain we feel this week is not a distortion of reality. It is the evidence of the perspective he drew. In his life, kindness was heavy. Curiosity was urgent. A conversation on a Tuesday night had weight.

  To measure him against the age of the earth is like measuring a song against the silence that comes after it ends. It misses the point of the song.

  There is no comfort in the fact that time goes on. There is only the fact that time was here, and he was in it. He was twenty-six. He was brilliant, and difficult, and kind, and he is gone. That is the fact. But the significance of that fact does not shrink because the galaxy is big.

  Ramsey wrote that the human good is the only good there is for humans. My brother didn't need to conquer the void. He just needed to be here. And he was.

  So we do not look up to find him. We do not look out to the edge of the universe to justify his absence. We look at the room we are in. We look at the perspective we share. As long as this perspective holds, as long as we see the world the way he drew it—in focus, in proportion, and full of value—then the scale of the cosmos is irrelevant.

  He mattered. Not despite being small. But because size was never the question.

  Thank you.
