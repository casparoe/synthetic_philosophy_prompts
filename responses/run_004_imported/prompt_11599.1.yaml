answer: |-
  Owen: Twelve years, Ruth. And I walk into the reception hall and the first voice I hear is yours explaining to the department chair why the deceased's early work on quantification was fundamentally misguided. Some things never change.

  Ruth: Some things never need to. Unlike you, apparently. I heard you're in risk assessment now.

  Owen: Compliance, actually. But the skill set transfers. I assess the risk of people holding onto obsolete models. Like Fregean senses. Come on. You really still think there's this ghostly third thing hovering between the word and the object?

  Ruth: I think there's a difference between knowing Hesperus is visible and knowing Phosphorus is visible, even though they're the same object. Do you deny that?

  Owen: I deny that the difference is semantic. It's epistemic. Look, let's run the modal argument. Just like Kripke. If the sense of Hesperus were just a description like the brightest object in the evening sky, then in a possible world where Venus exists but isn't the brightest object in the evening sky, Hesperus wouldn't refer to Venus. But it does. We can imagine Venus being knocked out of orbit, dark for centuries, and we'd still say, That's Hesperus, it's just not bright. The name sticks. The description peels off. So the sense isn't the description. So what is it?

  Ruth: You're conflating fixing the reference with giving the sense. Kripke showed that descriptions don't fix reference rigidly. He didn't show that agents don't grasp objects under specific modes of presentation. You're treating sense like a public label, Owen. It's not. It's a cognitive route.

  Owen: A cognitive route. Right. So it's psychological. It's in the head. But semantics isn't psychology. Semantics is about the world. If I say Hesperus is Phosphorus, I'm stating an identity between objects. If you say the meaning involves how I think about them, you're making truth conditions dependent on my ignorance.

  Ruth: I'm making rationality dependent on it. That's the hit, Owen. You never could swallow this. If your Direct Reference theory is true, then the proposition expressed by Hesperus is bright is identical to the proposition expressed by Phosphorus is bright. Same object, same property.

  Owen: Exactly. It's the same fact.

  Ruth: Then explain belief attribution. If Lois Lane believes Superman can fly, she believes a certain proposition. If Superman is Clark Kent, and propositions are just objects and properties, then she believes Clark Kent can fly. But she doesn't. She denies it. On your view, Lois is believing a contradiction simply by withholding assent to an identity she hasn't verified. You make every ignorant agent irrational.

  Owen: I make them ignorant, not irrational. They don't know the identity. Once they learn Hesperus is Phosphorus, the cognitive difference collapses. The informativeness is just the removal of ignorance about the world, not a feature of the language.

  Ruth: But that's the point. The language allows them to hold two distinct belief states about the same fact without contradiction. Why? Because the names contribute more than the object. They contribute the mode of access. You want to say the mode is pragmatic, not semantic. Fine. Call it pragmatics. But then you're admitting the semantic content alone doesn't capture what's communicated. You're stripping the tool down to the metal and wondering why it won't cut.

  Owen: I'm stripping away the mysticism. You want to posit these senses to save the phenomenon of informativeness, but you never define them. They're not descriptions, they're not objects. They're free-floating individuating conditions. It's ontology for people who don't want to pay for it.

  Ruth: And you're a metaphysician who thinks because you can point at the thing, you've explained the thought. You always did prefer the clean cut to the messy connection. You want rigidity because it makes the world stable. But the mind isn't rigid, Owen. The mind navigates.

  Owen: The mind navigates, but logic doesn't. Logic deals in truth values. If Hesperus is Phosphorus is necessary, then believing one and not the other is just a failure of logic, not a difference in meaning. You're building a philosophical architecture to accommodate human error.

  Ruth: I'm building it to accommodate human reasoning. If I believe Hesperus is F, and I believe Hesperus is G, I can infer something is F and G. If I believe Phosphorus is F, I might not. If the content is identical, that inference failure is inexplicable. You reduce the agent to a camera lens. The lens captures the object. But we aren't lenses. We're travelers. And the route matters.

  Owen: The route doesn't change the destination.

  Ruth: No. But it determines whether you ever arrive. You quit, Owen. You walked away from the department. You walked away from the work. And now you're telling me the only thing that matters is the object? That the path we took to get here doesn't contribute to the meaning of where we are?

  Owen: I didn't quit because the path mattered. I quit because the path was leading nowhere. The object is what pays the bills. The object is what exists. Senses are just stories we tell ourselves about how we found it.

  Ruth: Then you're not a Millian. You're a pragmatist. You just want the authority of realism without the work of semantics. You want to say the name hits the object directly because it's easier than explaining why it matters that we called it Hesperus first.

  Owen: Maybe I just learned that staring at the map doesn't move the terrain.

  Ruth: And maybe you forgot that without the map, you don't know where you're standing. Hesperus is Phosphorus was a discovery, Owen. Not because Venus changed. Because we did. Your theory has no room for that. It has no room for us.

  Owen: There is no us, Ruth. There's just you and me, standing here, arguing about Venus.

  Ruth: Exactly. And if your theory were true, this conversation would have been over twelve years ago.
