      *   **Context:** IB Theory of Knowledge (TOK) class, Induction unit.
      *   **Topic:** Hempel's Raven Paradox.
      *   **Scenario:** Two friends (Owen and Kayla) are arguing in a group chat for three days, tagging the user to pick a winner.
      *   **Task:** Go through the exchange move-by-move, evaluate who is right at each step, and point out important things both are missing.
      *   **Constraint:** Do not just pick an overall winner; analyze the specific arguments.

  2.  **Deconstruct the Arguments:**

