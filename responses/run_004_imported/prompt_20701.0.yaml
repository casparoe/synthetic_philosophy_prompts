answer: |-
  The short answer is **no**. If you accept your friend's premise that Anscombe's protest was an "empirical wager about body counts," then yes, modern historiography might seem to vindicate Truman. However, that premise is a fundamental misreading of Anscombe's moral philosophy.

  By Anscombe's own lights, historical evidence regarding alternative casualty estimates is largely irrelevant to the moral judgment she passed on Truman. To understand why, we have to distinguish between **consequentialist ethics** (which your friend is applying to Anscombe) and **deontological ethics** (which Anscombe actually practiced).

  Here is a breakdown of why the historical evidence does not vindicate Truman in the context of Anscombe's specific argument.

  ### 1. Anscombe was not a Utilitarian
  Your friend's argument assumes that Anscombe believed the morality of an action is determined by its outcomes (i.e., "Which strategy resulted in fewer dead civilians?"). This is a utilitarian or consequentialist framework.

  Anscombe was a staunch deontologist and a proponent of Natural Law ethics (heavily influenced by her Catholicism and her study of Aquinas). In her pamphlet *Mr. Truman's Degree* (1956), her central argument was not that Truman killed *too many* people, but that he committed **murder**.

  For Anscombe, the intentional killing of innocents is intrinsically evil. It is forbidden regardless of the consequences. Therefore, even if a naval blockade would have starved two million Japanese civilians to death, and the atomic bomb only killed 200,000, Anscombe would still condemn Truman. Why? Because the blockade causes death as a *side effect* of a military strategy (collateral damage), whereas the atomic bombings involved the **direct intention** to kill civilians to break the enemy's will.

  For Anscombe, you cannot do evil (murder innocents) so that good (ending the war) may come of it. The "body count wager" only matters to a utilitarian. Anscombe was arguing against utilitarianism itself.

  ### 2. The Distinction of Intentionality
  Anscombe is perhaps most famous for her work *Intention* (published the year after the protest, in 1957), which rigorously analyzes what it means to intend an outcome.

  Her objection to Truman hinged on the fact that the atomic bombs were used specifically to target civilian populations. In her view, this made the civilians the *means* to the end of surrender.
  *   **Invasion/Blockade:** In a conventional invasion or blockade, civilian deaths are foreseen but are not the *method* of victory. The method is defeating the military or cutting off supplies. Civilian death is a tragic byproduct.
  *   **Atomic Bombing:** The destruction of the cities and the killing of the inhabitants *was* the method.

  Therefore, even if historians prove that an invasion would have resulted in higher total casualties (both military and civilian), Anscombe would argue that Truman is morally culpable for *murder*, whereas the deaths resulting from an invasion would be classified differently in moral taxonomy (as collateral damage of legitimate warfare). The "net lives saved" calculation does not erase the moral stain of intentional murder.

  ### 3. The "Necessity" Defense
  Your friend's argument relies on the idea that Anscombe was betting that the bomb was *unnecessary*. It is true that Anscombe was skeptical of the claim that the bomb was necessary to end the war. She argued that the U.S. government's justification relied on a utilitarian calculus that was both morally bankrupt and factually dubious.

  However, she went further than simply doubting the facts. She argued that **necessity is not a defense for murder.**

  In *Mr. Truman's Degree*, she writes:
  > "For men to choose to kill the innocent as a means to their ends is mass murder. And mass murder is one of the worst of human actions."

  She anticipates the counter-argument that "it was necessary to save lives." Her response is effectively: *Even if it was necessary, it was forbidden.* If the only way to win a war is to murder children, a deontologist argues you must not win the war (or you must find another way, or accept defeat).

  Consequently, historical evidence showing that an invasion would have been bloodier does not vindicate Truman *by Anscombe's lights*. It only vindicates him by *Truman's own lights* (which were utilitarian). Anscombe rejected Truman's moral framework entirely.

  ### 4. Why Your Friend's View is Common but Mistaken
  Your friend's interpretation is very common because it translates Anscombe's argument into a language (consequentialism) that is dominant in modern political discourse. It is easier to argue about numbers ("Who killed more?") than about moral absolutes ("Is murder ever permissible?").

  If Anscombe's argument *were* purely empirical, then yes, the "Downfall" casualty estimates (which suggest high casualties for both sides in an invasion) would weaken her position. But her position was philosophical. She was protesting the **conferral of honor** upon a man she classified as a mass murderer. She argued that Oxford, by honoring him, was endorsing the principle that "mass murder is acceptable if it produces a good result."

  ### Conclusion
  The historical evidence regarding alternative strategies (blockade/invasion) addresses a **consequentialist** critique of Truman. It asks: *Did he achieve the best outcome?*

  Anscombe's critique was **deontological**. It asked: *Did he violate a moral absolute?*

  If you believe that intentional killing of innocents is absolutely forbidden, then it does not matter if the alternative would have been worse. Therefore, new historical data about casualty counts in Operation Downfall does not vindicate Truman over Anscombe *by her own lights*. It only vindicates him if you first accept the utilitarian premise that Anscombe was explicitly protesting.

  You have come around to your friend's view, but in doing so, you have implicitly accepted a utilitarian framework that Anscombe would have rejected as part of the problem. To agree with your friend is to say, "Anscombe was wrong because Truman saved more lives." To agree with Anscombe is to say, "It doesn't matter how many lives Truman saved; he committed murder, and murderers should not be given honorary degrees."
