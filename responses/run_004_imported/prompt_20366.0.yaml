answer: |-
  The steam from the espresso machine hissed, competing with the low hum of post-seminar debate spilling out into the hallway. Dr. Amara Okafor stood at the cart, waiting for her pour-over, while Dr. Elin Lindqvist leaned against the wall, nursing a paper cup of black coffee.

  "You looked ready to throw a chalkboard eraser during the Q&A," Lindqvist said, offering a faint smile. "Specifically when I suggested the Common Prior Assumption was the weak link."

  Okafor accepted her coffee and turned. "Only because you treated 'different priors' like a fundamental feature of rationality rather than a bug. Look, Elin, we're modeling financial markets. If two analysts look at the same 10-K filing and walk away with different posterior beliefs about cash flow, one of them is wrong. Or they have different data. But if they have the *same* data and the *same* likelihood functions, Aumann tells us they can't agree to disagree. Milgrom and Stokey extend that to trade: if the allocation is ex ante Pareto optimal, common knowledge of willingness to trade implies no trade."

  "And yet," Lindqvist pushed off the wall, falling into step as Okafor started walking, "turn on a Bloomberg terminal at 4:05 PM on an earnings day. The volume spikes are vertical. It's not liquidity rebalancing. It's not noise traders suddenly waking up because Apple announced revenue. It's speculative volume. People are betting against each other *because* of the news."

  "That's the noise," Okafor said. "Grossman and Stiglitz gave us the out decades ago. You need noise traders to prevent prices from fully revealing information, otherwise no one has an incentive to gather information. The volume you see is the informed trading against the liquidity providers. The no-trade theorem holds for the fully informed rational core; the rest is friction."

  "Friction doesn't spike systematically around information events," Lindqvist countered. "That's my problem with your 'friction' defense. If volume is driven by liquidity shocks or portfolio rebalancing, why does it correlate so tightly with disclosure? Are you telling me that liquidity traders have a secret calendar of earnings announcements and decide to only rebalance their portfolios in the five minutes after the press release hits the wire? That requires the noise traders to be informed about the *timing* of the information, which starts to look a lot like... informed trading."

  Okafor stopped near a pillar. "Endogenous liquidity. Market makers widen spreads, uncertainty increases, inventory risk goes up. The volume is the churn of hedging that risk. It doesn't require speculative disagreement about the fundamental value."

  "It requires a lot of coincidences," Lindqvist said. "But here's the deeper issue, Amara. You're defending the Common Prior Assumption as if it's a requirement of rationality. It's not. It's a restriction on the modeler. You're assuming that because we all live in the same universe, we must have started with the same subjective probability distribution before we saw a single data point. That's the Harsanyi Doctrine, and it's metaphysical, not mathematical."

  "It's methodological," Okafor corrected. "If we allow priors to be idiosyncratic and irreducible, the theory loses its bite. If Agent A thinks the coin is biased heads and Agent B thinks it's biased tails, and we just say 'oh, well, different priors,' you can explain *any* trade. It becomes a theory of everything, which means it's a theory of nothing. You're just relabeling 'disagreement' as 'rational prior difference' without explaining where that difference comes from. It stops inquiry. It says, 'Don't ask why they interpret the signal differently; just assume they do.'"

  Lindqvist took a sip of coffee, thoughtful. "I'm not saying don't ask. I'm saying the answer might not be convergence. You think rationality is a convergent process—that if we process evidence correctly, we merge. I think rationality is a consistency constraint on updating, not a mandate on starting points. Two Bayesians can look at the same likelihood function and, if their priors differ sufficiently, maintain different posteriors forever. That's not a defect. That's just... perspective. In finance, that's what we call 'difference of opinion.' If you force a common prior, you force consensus where there is none, and then you have to invent ghostly 'noise traders' to explain the volume that results from the disagreement you've artificially suppressed."

  "But where do the priors come from?" Okafor pressed. "If I'm a rational agent, and I know you are rational, and I know we've both been exposed to the same stream of public information over our lifetimes, why should my prior on the equity risk premium differ from yours? If we attribute it to 'genetics' or 'childhood experience,' we're pushing the economic explanation out of the model. For a job-market paper, I can't just write 'volume exists because priors differ.' I need a mechanism."

  "And I can't write 'volume exists because liquidity shocks coincidentally align with earnings dates' without empirical support that doesn't exist," Lindqvist shot back. "You want a mechanism? The mechanism is heterogeneous interpretation of complex signals. A guidance statement isn't a raw number; it's language. Rational agents can weigh the credibility of the CEO differently based on their own private models of management integrity. That's not noise. That's rational processing of ambiguous signals."

  "That's private information," Okafor said sharply. "If you have a private model of management integrity, that's part of your signal partition. Milgrom-Stokey accounts for private signals. The no-trade result still holds if the *prior* is common. You're smuggling private information in and calling it a prior."

  "Am I?" Lindqvist paused. "Or is the distinction between 'prior' and 'signal' arbitrary when the signal is public but ambiguous? If the signal is 'CEO says growth will be strong,' and I interpret that as 80% likely to be true and you interpret it as 40% likely, is that a difference in the signal received or the prior on the CEO's honesty? If it's the latter, and we agree that honesty distributions are subjective, then we have different priors. And if we have different priors, we can trade rationally without anyone being wrong."

  Okafor shook her head, resuming her walk toward the department building. "It feels like surrender. If we accept that, we lose the predictive power of the rational expectations framework. We can't test for bubbles. We can't test for inefficiency. Any deviation from the model's price is just 'oh, different priors.' I need to believe that there is a truth out there, and prices are trying to find it. Volume is the friction of that search, not the result of two equally rational people betting on different universes."

  "And I need to believe that agents are capable of looking at the same world and seeing different risks without one of them being cognitively impaired," Lindqvist said, catching up. "The no-trade theorem is airtight, yes. But it's airtight in a vacuum. It proves that *if* we share a soul, we won't trade. We don't share a soul. We share a market."

  They reached the door. Okafor held it open, the debate hanging between them, unresolved but sharpened.

  "Okay," Okafor said, pausing in the doorway. "Let's say I want to be convinced. You want me to drop the Common Prior Assumption and model your speculative volume as rational disagreement. What evidence would actually move you? If I found a setting where priors *should* converge—say, traders with identical training, identical access to data, trading a simple asset—and they still trade heavily on public news, would that break your model?"

  Lindqvist considered this. "If you could show me that volume persists even when we control for heterogeneity in information access and processing power... basically, if you could prove that the traders *are* identical except for a random assignment of 'prior,' and they still trade, that would suggest the prior difference isn't structural. But you can't do that. You can't control for how a human weights risk." She tilted her head. "What about you? What would make you accept that the Common Prior Assumption is the culprit? What would make you admit that volume is speculative, not liquidity?"

  Okafor thought for a moment, watching a group of first-years rush past. "Show me the liquidity. If you can demonstrate that the volume around earnings announcements cannot be accounted for by inventory control, market maker hedging, or exogenous liquidity shocks—specifically, if you can show me that the *direction* of the trade correlates with the *interpretation* of the news rather than just the news itself... If you can isolate the 'bet' from the 'hedge.' Right now, you assume the volume is speculative because it's large. I assume it's liquidity because it's necessary. If you could identify the traders and prove they aren't hedging existing exposures, but purely speculating on the public number... then I'd have to admit the noise trader story is insufficient."

  "So," Lindqvist said, pushing the door open. "You need me to prove the trades aren't hedges. And I need you to prove the priors *should* have converged."

  "Essentially," Okafor said.

  "Then we both have a lot of work to do before the job market."

  "Indeed," Okafor replied. "See you at the next reading group."

  "Looking forward to it."
