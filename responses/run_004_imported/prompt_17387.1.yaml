      *   **The Virtue Ethicist (let's call her "Elena"):** Nuanced, understands statistics (appealing to the user's background), argues that Aristotelian virtue isn't about robotic consistency but about reliable dispositions that interact with situations. Defends $r=0.3$ as significant signal in human behavior.

  3.  **Key Points to Cover:**
