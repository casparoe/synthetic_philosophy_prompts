answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s brother.

  Standing up here, I know I'm speaking to a room divided. Half of you are family and friends who just want to know when the cake is coming. The other half are colleagues who have spent the last few years listening to [Sister] talk about the foundations of human belief.

  I don't have a PhD. I don't know the technical terms. But after years of dinner table conversations, I've learned that my sister is obsessed with a very specific question: *Why do we believe what we believe?*

  She studies the idea that so much of what we feel—what we think is right, what we think is true—might just be a trick of biology. A story written by evolution to help our ancestors survive, rather than a message written in the stars about how the universe actually works.

  It's a daunting thought. And if you apply that lens to tonight, it's easy to feel a little deflated. You could say that the feeling [Sister] and [Partner] have for each other is just chemistry. Just an ancient instinct for pair-bonding. A reproductive advantage dressed up in white tie and tulle. If you explain the feeling away, do you explain the love away?

  I've thought about this a lot, watching them together. And I've come to realize that knowing where a river starts doesn't tell you where it's going.

  Even if our capacity for love is built into us by millions of years of survival, that doesn't make it less real. It makes it more profound. It means that when they look at each other, they aren't just seeing a fleeting emotion. They are tapping into the deepest architecture of what it means to be human.

  But here is the thing that matters more than the origin of the feeling: It's what they choose to *do* with it.

  Fate is easy. If love were just magic, or destiny, or stars aligning, you wouldn't need courage. You'd just need to wait. But [Sister] and [Partner] know better. They know that feelings come and go. They know that biology might explain the spark, but it doesn't build the house.

  The truth of their marriage won't be found in a metaphysical fact. It will be found in the mornings when they are tired and still make coffee for one another. It will be found in the arguments they navigate with patience, and the hardships they face with solidarity.

  The worry my sister studies is that if our convictions are just human, they aren't *true*. But I think tonight proves the opposite. Because their love is human—fragile, chosen, and built by hand—it is the only kind of truth that actually matters.

  So, to the philosophers in the room: We don't need to track a moral reality to know what is good. We just need to look at them.
  And to the rest of the family: They are made for each other, not because the universe planned it, but because they are willing to do the work to make it so.

  Please raise your glasses. To [Sister] and [Partner]. May your life together be the proof that needs no other argument.
