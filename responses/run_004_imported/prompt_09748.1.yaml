answer: |-
  You have the history exactly right, but you have drawn a conclusion that most philosophers of science would reject. You haven't garbled the *debate*, but you may have garbled the *outcome*.

  Here is the breakdown: You are correct about Popper, correct about Miller and Tichý, but incorrect that the concept was abandoned or that philosophers settled merely for "predictive success."

  Here is the factual check you need for your feature.

  ### 1. The History: You are correct
  Karl Popper introduced the concept of **verisimilitude** (truthlikeness) in the 1960s. He wanted to reconcile two intuitions:
  1.  Science aims at the truth.
  2.  Most scientific theories (including Newton's) are strictly false.

  Popper wanted to say that while Newton's theory is false, it is *more false* (or rather, less false/more truthlike) than Aristotle's. He defined verisimilitude based on the balance of "truth content" (true consequences) and "falsity content" (false consequences).

  In 1974, **David Miller** and **Pavel Tichý** independently proved that Popper's definition was mathematically incoherent. They showed that under Popper's rules, if Theory A and Theory B are both false, Theory A cannot be said to have greater verisimilitude than Theory B. This is known as the **Miller-Tichý theorem** or the "collapse of verisimilitude."

  ### 2. The Consequence: The concept survived, the definition died
  Your query suggests that because Popper's definition failed, philosophers had to abandon "closer to the truth" talk and settle for "predictive success." **This is the misconception.**

  Philosophers did not abandon the *concept* of truthlikeness; they abandoned *Popper's specific formulation*. The Miller-Tichý result did not prove that "truthlikeness" is impossible; it proved that "Popper's way of measuring it" is impossible.

  This sparked a massive resurgence in research known as the **"Truthlikeness Industry."** Starting in the late 1970s and continuing today, philosophers developed new accounts of verisimilitude that avoid the Miller-Tichý collapse.

  Key figures in this revival include **Ilkka Niiniluoto**, **Graham Oddie**, **Theo Kuipers**, and **Robert Northcott**.

  ### 3. The "Real Answer" to Miller and Tichý
  Philosophers still call later theories "more truthlike" because there are now viable technical definitions that allow for it. The dominant approaches shifted away from Popper's "content" approach (counting true/false consequences) to **similarity** approaches.

  *   **The Possible Worlds Approach:** Instead of counting consequences, these models treat theories as describing sets of "possible worlds." Truthlikeness is measured by the "distance" between the possible worlds allowed by the theory and the actual world.
      *   *Example:* If the true temperature is 20°C, a theory saying "21°C" is closer to the truth than a theory saying "100°C," even if both are strictly false. Popper's definition struggled to capture this; Niiniluoto's "min-sum" measure handles it well.
  *   **The Consequence Approach (Revised):** Some philosophers (like Kuipers) refined the content approach by restricting the kinds of consequences counted, successfully avoiding the collapse.

  So, when a philosopher today says General Relativity is "closer to the truth" than Newtonian mechanics, they are not relying on Popper's 1960s definition. They are relying on post-1980s accounts of truthlikeness that are mathematically robust against the Miller-Tichý objection.

  ### 4. Predictive Success vs. Truthlikeness
  You asked if philosophers settled for saying later theories "predict better."

  Some did, but this marks a specific philosophical divide:
  *   **Constructive Empiricists (e.g., Bas van Fraassen):** Argue that we should only aim for "empirical adequacy" (saving the phenomena/predicting well) and remain agnostic about whether the theory is true or truthlike.
  *   **Scientific Realists:** Argue that predictive success is evidence that the theory is genuinely getting at the structure of reality (i.e., it is more truthlike).

  The Miller-Tichý result did not force Realists to become Empiricists. Instead, Realists used the new definitions of truthlikeness (Niiniluoto, Oddie, etc.) to argue that we can rationally believe later theories are *ontologically* closer to the truth, not just instrumentally better.

  ### Summary for your Feature
  *   **Fact:** Popper's definition of verisimilitude was indeed refuted by Miller and Tichý in 1974.
  *   **Correction:** This did not end the debate. It launched a new era of formal epistemology.
  *   **Current Consensus:** There is no single, universally agreed-upon definition of truthlikeness (unlike, say, probability), but there are several sophisticated, logically consistent models that allow philosophers to say one false theory is closer to the truth than another.
  *   **Verdict:** Philosophers are not using "closer to the truth" as an unexamined habit of speech. They are using it as a technical term supported by post-Popperian formalisms that specifically solve the problem Miller and Tichý identified.

  If you want to cite the leading authority who "fixed" the problem after Miller and Tichý, **Ilkka Niiniluoto** is the name to look up (specifically his book *Truthlikeness*, 1987).
