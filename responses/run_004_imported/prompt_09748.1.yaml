  I'm fact-checking a feature on scientific progress and want to be sure I haven't garbled a technical debate. Karl Popper tried to formalize the idea that a false theory can still be "closer to the truth" than its rivals — his notion of verisimilitude — but David Miller and Pavel Tichý independently proved in 1974 that Popper's own definition collapses: by his measure, no false theory can ever come out more verisimilar than another false theory. Since virtually every theory science has produced, including Einstein's, is presumably false in some respect, doesn't the Miller–Tichý result mean philosophers had to abandon all "closer to the truth" talk and settle for saying only that later theories predict better? If so, I'm puzzled why philosophers of science still routinely call later theories more truthlike than the ones they replaced. Is that just an unexamined habit of speech, or is there a real answer to Miller and Tichý that I'm missing?
