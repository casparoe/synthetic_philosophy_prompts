  i want Val to really press on why "almost surely" should beat plain old expected value when maximizing EV is supposedly the whole point of being rational (kinda a Samuelson-vs-Kelly thing, like that paper samuelson wrote mocking kelly bettors entirely in one-syllable words). and i don't want Kelly to just retreat to "but ruin is bad" -- make them actually engage with the ergodicity argument instead of hand-waving at it. real back and forth, both equally sharp, nobody strawmanned, maybe 600 words or so.
