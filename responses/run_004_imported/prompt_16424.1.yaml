answer: |-
  This is a classic and sophisticated problem in tort theory, often referred to as the **"problem of negative causation"** or the **"omission dilemma."** You are in good company: H.L.A. Hart and Tony Honoré wrestled with this in *Causation in the Law*, and it remains a central fault line between causal realists (like Michael Moore), causal skeptics (like Jane Stapleton), and normative theorists (like Stephen Perry).

  Your intuition—that in omission cases, cause-in-fact appears to collapse into duty—is shared by many legal realists and critical scholars. However, if you are defending a dissertation, you need to engage with the strongest arguments *against* collapsing the elements. Even if you ultimately agree that the distinction is porous, understanding why the doctrine resists your proposed simplification is crucial for framing your contribution.

  Here are the primary theoretical, institutional, and doctrinal reasons why scholars and courts maintain cause-in-fact as a separate element from duty, even in the face of the omission problem.

  ### 1. The Normative/Descriptive Distinction (Conceptual Clarity)
  The most traditional argument is that **Duty** and **Causation** perform categorically different functions.
  *   **Duty** is a normative inquiry: *Ought* the defendant to have acted? It is a question of law regarding the scope of responsibility we assign to agents in specific relationships.
  *   **Cause-in-Fact** is (theoretically) a descriptive inquiry: *Did* the defendant's conduct (or non-conduct) make a difference to the outcome? It is a question of fact regarding the physical or counterfactual linkage between behavior and harm.

  **Why keep them separate?** If you fold causation into duty, you conflate "is" with "ought." By keeping them separate, the law preserves the moral intuition that liability requires *both* a breach of obligation AND a tangible connection to the harm. If we collapse them, we risk imposing liability based solely on status (e.g., "You are a lifeguard, therefore you are liable for drownings"), even in cases where the lifeguard's intervention would have been physically impossible.

  ### 2. Causation Does Independent Work (The "Inevitability" Check)
  Even if you accept your premise that the *lifesaver vs. bystander* distinction is driven by duty, cause-in-fact still performs independent work *after* duty is established.

  Consider the lifeguard. We agree they have a duty. But suppose the victim suffered a massive heart attack the moment they hit the water and would have died instantly regardless of rescue.
  *   **Duty Analysis:** The lifeguard owed a duty.
  *   **Causation Analysis:** The lifeguard's omission did not cause the death (the death was inevitable).

  If you fold causation into duty, you lose the doctrinal mechanism to exonerate the lifeguard in this scenario without creating complex exceptions within the duty rule itself. Maintaining cause-in-fact as a separate element allows courts to say: "You had a duty, you breached it, but you are not liable because your breach didn't change the outcome." This preserves a limit on liability that duty alone cannot provide.

  ### 3. Institutional Competence (Judge vs. Jury)
  There is a procedural architecture underpinning the doctrinal elements.
  *   **Duty** is generally a question of **law** for the **judge**. It sets the boundaries of the legal relationship.
  *   **Cause-in-Fact** is generally a question of **fact** for the **jury**. It determines what happened in the specific instance.

  **Why keep them separate?** Collapsing causation into duty would shift significant power from juries to judges. If the "causal" inquiry regarding omissions is actually a "duty" inquiry, judges would be empowered to dismiss omission cases at the pleading or summary judgment stage more frequently. Maintaining the distinction preserves the jury's role in assessing the counterfactual: *Could* this specific defendant have actually prevented the harm? This is an empirical question, not just a normative one.

  ### 4. Doctrinal Unity (Acts vs. Omissions)
  Tort law strives for a unified framework for negligence, whether the breach is an act (commission) or a failure to act (omission).
  *   In **commission** cases (e.g., speeding driver), cause-in-fact clearly does independent work. The driver may have breached a duty of care, but if the pedestrian jumped in front of the car unexpectedly, the breach didn't cause the harm.
  *   If we restructure omission cases to fold causation into duty, we create a **bifurcated negligence doctrine**: one structure for acts and another for omissions.

  Scholars resist this because it complicates jury instructions and muddies the theoretical coherence of negligence. It is doctrinally more efficient to keep the *elements* constant (Duty, Breach, Causation, Damages) even if the *application* of causation differs between acts and omissions.

  ### 5. Alternative Causal Theories (It's not just "But-For")
  Your critique relies heavily on the **Counterfactual (But-For) Theory** of causation. Many scholars argue the problem isn't the *element* of causation, but the *test* used to satisfy it.
  *   **The NESS Test:** Richard Wright's "Necessary Element of a Sufficient Set" test attempts to handle omissions better than simple but-for testing by looking at causal laws and sufficient conditions.
  *   **Risk Realization:** Some scholars (like Stapleton) argue we should abandon factual causation entirely in favor of a "scope of liability" inquiry, but others (like Moore) argue for a naturalistic view of causation that restricts omissions more strictly than counterfactuals do.

  **Why keep them separate?** Scholars maintain the element because they believe a *better* theory of causation might solve the over-generation problem without needing to collapse the elements. If you adopt a "robust" view of causation (e.g., requiring a physical mechanism rather than just counterfactual dependence), the lifeguard is a cause and the swimmer is not, *without* needing to rely solely on duty.

  ### 6. The "Scope of Liability" Safety Valve
  Finally, keeping cause-in-fact separate allows for the **Proximate Cause** (or Scope of Liability) analysis to function as a third filter.
  1.  **Duty:** Did you owe an obligation? (Filters out the bystander swimmer).
  2.  **Cause-in-Fact:** Did your omission make a difference? (Filters out the inevitable death).
  3.  **Proximate Cause:** Was the harm within the risk created? (Filters out freakish coincidences).

  If you fold (2) into (1), you overload the Duty element. Duty becomes a catch-all for "Is this person liable?" which makes the concept less precise. By keeping cause-in-fact separate, courts can acknowledge that while the lifeguard had a duty, and the omission was a but-for cause, liability might still be cut off for other reasons (though usually, this is proximate cause).

  ### Suggestions for Your Dissertation
  Since you are writing a dissertation, you don't just need the answer; you need a **position**. Here are three ways to frame your contribution based on this tension:

  1.  **The Causal Skeptic Route (Stapleton-esque):** Argue that you are right. Cause-in-fact *is* a fiction in omission cases. The dissertation could propose a restructuring of negligence where "Duty" absorbs the causal inquiry for omissions, explicitly acknowledging the normative nature of the inquiry.
  2.  **The Causal Realist Route (Moore/Wright-esque):** Argue that the Counterfactual Theory is the problem, not the Element. Propose applying a different theory of causation (e.g., interventionist or mechanistic) that distinguishes the lifeguard from the swimmer on *causal* grounds, not just normative ones. (e.g., The lifeguard was part of the "causal field" or "system," the swimmer was not).
  3.  **The Functionalist Route:** Argue that the redundancy is a feature, not a bug. The overlap between Duty and Cause-in-Fact in omission cases provides a "double insurance" against over-liability, allowing courts to toggle between normative and descriptive language depending on which justification is more persuasive in a specific case.

  **Key Literature to Engage:**
  *   **H.L.A. Hart & Tony Honoré,** *Causation in the Law* (The classic treatment of omissions).
  *   **Jane Stapleton,** "Legal Cause: Cause-in-Fact and the Scope of Liability" (Argues for collapsing the inquiries).
  *   **Richard Wright,** "The NESS Account of Natural Causation" (Defends a causal test that handles omissions).
  *   **Michael Moore,** *Causation and Responsibility* (Defends a naturalistic, metaphysical view of causation).
  *   **Stephen Perry,** "The Moral Foundations of Tort Law" (Discusses the normative nature of causation).

  Your observation is correct that the *but-for* test fails to distinguish the lifeguard from the swimmer. The scholarly debate is whether that failure requires us to abandon the element of causation (fold it into duty) or abandon the *but-for* test (find a better causal theory). Your dissertation can stake a claim on which path the law *should* take.
