      *   *Key Counter-Arguments:* 3/5ths Clause (art. I, sec. 2), Fugitive Slave Clause (art. IV, sec. 2), Importation Clause (art. I, sec. 9), historical context/intent of the Framers (many were slaveholders), the legal reality of *Dred Scott*.
      *   *The "Gerrit Smith" Factor:* Douglass's break with Garrison was personal and financial (Gerrit Smith funded his newspaper, *The North Star*). Did money/politics drive the ideology?
      *   *The "Textualism" Factor:* Douglass claims to read the text *only*. But does he rely on higher law (natural rights) to interpret that text?

