answer: |-
  "You sentimentalized a cynicism," Julian said, pacing the length of the studio. "Da Ponte's plot is a wager. Two men betting that women are fickle. It's cold. It's structural. But you... you wrote 'Per pietà' like she's dying."

  Elena didn't look up from the score. "Because she is."

  "She's pretending. That's the point. The drama relies on the artifice."

  "The drama relies on the text," Elena corrected. "The opera relies on the music. If I write music that sounds like a game, the audience hears a game. Then nothing matters. If I write music that sounds like heartbreak, the bet becomes irrelevant. The pain becomes real."

  "That's dishonest," Julian snapped. "You're using my words to say the opposite of what they mean. It's ventriloquism. You're claiming this is a unified work, but you've severed the head from the body."

  "It's subtext. Words lie, Julian. People say 'I'm fine' while they're bleeding. Opera is the only place where the blood gets a melody. You want the text to be the master? Then write a play. Don't ask me to set it."

  "I ask you to serve the scene. You act like the music is the truth and the text is just scaffolding. But if the scaffolding contradicts the building, the whole thing collapses. Why bother with words at all if the oboe is going to overrule them?"

  "Because I need the resistance," Elena said, finally meeting his eyes. "You think the contradiction is a flaw. I think it's the engine. In *Così*, the men are cynical. The music knows the women aren't. That tension isn't a bug; it's the point. You want unity? Go watch a movie. Opera is where the music contradicts the word to tell the truth the characters can't speak."

  "So why do you need a librettist?" Julian stepped closer, the air between them tightening. "If the music overrides the text, if the emotion swallows the logic, why not just hum? Why drag me into this if my contribution is just a straw man for you to burn?"

  "Because I need something solid to break against!" Elena slammed the piano lid. The sound cracked like a gunshot. "I need your rigid, cynical little structures so I can show what happens when a human heart crashes into them. Without the text, the music is just mood. Without the music, the text is just a bet. Together... together it's a wound."

  Julian stared at her, the anger draining into something colder. "We were better apart."

  "The opera is better," she said quietly, turning back to the keys. "We never were."
