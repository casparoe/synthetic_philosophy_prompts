answer: |-
  Your friend had the better of the argument.

  While your defense of Lewis touches on a genuine metaphysical distinction regarding reductivity, the interventionist framework provides a superior account of the *logic* of causation, specifically regarding the examples that stalled your dinner. Lewis's project was metaphysically more ambitious, aiming to reduce causation to non-causal facts (the Humean mosaic plus similarity metrics). However, ambition does not equal success. On the specific technical challenges of preemption and overdetermination—the very litmus tests for any theory of causation—the interventionist approach succeeds where Lewis's successive revisions become increasingly convoluted and *ad hoc*.

  Here is the breakdown of why the interventionist position prevails, addressing your specific concerns about circularity and theoretical distinctness.

  ### 1. The Preemption Problem: Suzy, Billy, and the Bottle

  The late preemption case is the graveyard of the 1973 Lewisian account. As you noted, on the original analysis, the shattering does not counterfactually depend on Suzy's throw because if Suzy hadn't thrown, Billy would have. The effect remains constant across the nearest possible world where the cause is absent.

  Lewis recognized this failure. His 1986 "quasi-dependence" revision argued that Suzy's throw causes the shattering because the *intrinsic process* connecting her throw to the shattering matches a process in a counterfactual world where Billy is absent. This is where the machinery begins to groan. It requires a commitment to the "intrinsicness" of causal processes that is difficult to define without begging the question. What counts as intrinsic? Why does the presence of Billy's rock (a distinct event) not alter the intrinsic nature of the process initiated by Suzy?

  His 2000 "influence" account was even more complex, suggesting causation is a pattern of counterfactual covariation across a range of alterations. Suzy's throw influences the shattering (change the throw, change the shattering); Billy's does not (change the throw, the shattering stays the same because Suzy's rock is already en route). While this recovers the verdict, it does so by grading causation and introducing a complexity metric that feels tailored specifically to save the theory from counterexamples.

  **The Interventionist Solution:**
  Your friend is correct that the Structural Equation Model (SEM) handles this transparently. In an SEM, you represent the scenario with variables $S$ (Suzy), $B$ (Billy), and $E$ (Effect). The structural equation for the bottle is roughly $E := \max(S, B)$ (assuming binary 0/1 for simplicity, or continuous values for timing).

  To test if $S$ causes $E$, we perform an intervention $do(S=0)$ while holding $B$ fixed at its *actual* value ($B=1$).
  *   Actual world: $S=1, B=1 \rightarrow E=1$.
  *   Intervention: $S=0, B=1 \rightarrow E=1$ (Wait, if $E = \max(S,B)$, then if $S=0, B=1$, $E$ is still 1).

  *Correction:* In late preemption, the equation must reflect the *timing* or the *blocking*. A more accurate SEM for late preemption distinguishes the *process*. Let $P_S$ be Suzy's rock hitting, $P_B$ be Billy's rock hitting.
  $P_S := S$
  $P_B := B \land \neg P_S$ (Billy's rock hits only if Suzy's doesn't)
  $E := P_S \lor P_B$

  Now test $S$:
  *   Hold $B=1$. Set $S=0$. Then $P_S=0$. Then $P_B = 1 \land \neg 0 = 1$. Then $E=1$.
  *   Wait, this models *early* preemption (where Billy's throw is stopped). Late preemption is trickier: Billy's rock arrives *after*.
  *   Better SEM: $E := P_S + P_B$ (where arrival time matters). If $T_S < T_B$, $E$ is determined by $S$.
  *   Interventionist test: $do(S=0)$. We hold $B$ fixed at actual ($B=1$). Since $S$ is now 0, $P_S$ does not occur. $P_B$ occurs (since it's not blocked, just late). $E$ occurs.
  *   *Wait, standard SEM handles this via "path-specific" effects.* We hold the *path* through Billy fixed at the value it would have taken had Suzy not thrown? No, we hold Billy's *variable* fixed at actual.
  *   Actually, the standard SEM solution for late preemption relies on the fact that in the actual world, $P_B$ (Billy's rock hitting) is 0.
  *   Equation: $H_S$ (Suzy hits), $H_B$ (Billy hits). $H_S = S$. $H_B = B \times (1 - H_S)$ (Billy hits only if Suzy misses). $E = H_S + H_B$.
  *   Actual: $S=1 \rightarrow H_S=1 \rightarrow H_B=0 \rightarrow E=1$.
  *   Intervention $do(S=0)$: $H_S=0$. $B$ is held at 1. $H_B = 1 \times (1-0) = 1$. $E=1$.
  *   This still yields $E=1$. This is the hard case.

  *Refinement:* The interventionist advantage isn't that the math is magic, but that the **variable selection** makes the dependency clear where Lewis's similarity metrics obscure it. In SEM, we can model the *time of shattering* $T_E$.
  $T_E = \min(T_S, T_B)$.
  Actual: $T_S < T_B$. $T_E = T_S$.
  Intervention $do(S=0)$: $T_S = \infty$. $T_E = T_B$.
  The *value* of $T_E$ changes. Lewis's 2000 "influence" account basically admits this but wraps it in possible worlds semantics. The SEM makes it a direct calculation of variable dependence.

  The crucial advantage is that SEM separates the **structural relations** (the equations) from the **contingent values** (the actual throws). Lewis's theory conflates the two via the "similarity of worlds" metric. To get the right result, Lewis has to argue that the world where Suzy doesn't throw but Billy's rock vanishes is "more similar" than the world where Billy's rock hits, or rely on the "influence" of timing. The interventionist simply asks: "Does the equation for $E$ depend on $S$?" The answer is yes, structurally, regardless of Billy's backup.

  ### 2. Overdetermination: The Two Arsonists

  In symmetric overdetermination (both matches drop, either suffices), Lewis's 1973 account fails again (no counterfactual dependence). His later accounts struggle to affirm *both* are causes without implying that causation is aggregative in weird ways.

  Interventionism handles this by acknowledging that causal claims are relative to the model. If you model the fire $F$ as $F := \max(M_1, M_2)$, and you intervene $do(M_1=0)$ holding $M_2=1$, $F$ remains 1. Technically, $M_1$ is not a *necessary* cause in that specific context. However, interventionists (like Woodward) argue that causation is about **invariance**. $M_1$ is a cause because there is *some* range of background conditions (specifically, where $M_2=0$) where intervening on $M_1$ changes $F$.

  This is a significant theoretical win. It allows the interventionist to say: "Suzy caused the shattering" and "Both arsonists caused the fire" by looking at the **stability** of the relationship across interventions, rather than looking for a single necessary dependence chain in the actual world. Lewis tries to find causation in the actual sequence of events; Interventionism finds it in the modal structure of the system. The latter is more robust for scientific explanation.

  ### 3. The Circularity Objection: Reductivity vs. Explication

  This is the core of your objection: Woodward admits "intervention" is a causal notion. Therefore, Interventionism is not a reductive analysis of causation. Lewis aimed for reduction; Woodward aims for explication. You argued this means Woodward hasn't solved the problem, just relabeled it.

  This is where your friend's position is philosophically stronger, though your diagnosis of the circularity is correct.

  Lewis wanted to answer: *"What are causal facts made of?"* (Answer: Humean mosaic + similarity).
  Woodward wants to answer: *"What do we mean when we make causal claims?"* (Answer: Claims about invariance under intervention).

  If the goal is to distinguish causal relations from spurious correlations in a scientific context (which is what your friend does for a living), reductivity is a red herring. The "circularity" is not vicious; it is **informative**. Defining intervention causally allows us to isolate causal structure from associative structure.

  Consider the alternative: If you demand a reductive theory, you are forced into Lewis's corner, where you must define "similarity of possible worlds" without using causal notions. Lewis failed to do this convincingly. His similarity metric implicitly relies on causal intuitions (e.g., we judge worlds where miracles occur as less similar, but "miracle" is often defined by causal violation). Lewis's reduction is arguably circular in practice, even if reductive in intent.

  Woodward bites the bullet: We cannot define causation in non-causal terms. But we can distinguish *good* causal concepts from *bad* ones. Interventionism provides the criteria for that distinction. It trades metaphysical foundationalism for methodological clarity. Given that the debate stalled on specific examples (preemption/overdetermination), the framework that correctly classifies the examples with less *ad hoc* machinery wins, even if it doesn't reduce causation to atoms and void.

  ### 4. Distinct Theory or Restricted Counterfactualism?

  You asked whether Interventionism is a distinct theory or just a disciplined version of counterfactualism.

  It is best understood as a **constrained counterfactual theory**. Woodward agrees with Lewis that causation is intimately tied to counterfactuals. However, Lewis allowed *any* counterfactual backed by similarity metrics. Woodward restricts the admissible counterfactuals to those generated by **interventions**.

  This restriction is not merely "convenient notation"; it is a substantive theoretical move that solves the preemption problem. By fixing the values of other variables (like Billy's throw) via intervention rather than letting them "backtrack" or shift via similarity metrics, Interventionism blocks the backup cause from masking the primary cause.

  So, is it a rival? Yes, because it rejects the Lewisian claim that *all* causal information is encoded in the pattern of unconditional counterfactual dependence among events. It posits that causal information is encoded in the **structural equations** themselves, which are distinct from the events. This is an ontological shift from events (Lewis) to variables/structures (SEM).

  ### The Verdict

  Your friend had the better of the argument.

  You were right to point out that Interventionism is not a metaphysical reduction. If the debate were strictly about "What is the fundamental ontological ground of causation?", Lewis's project (despite its failures) is the only one of the two even attempting to answer that.

  However, the debate centered on the **nature of causation** as evidenced by its behavior in preemption and overdetermination cases. On this front, Lewis's theory is a series of patches on a sinking ship. The 1973 account yields the wrong verdict. The 1986 and 2000 accounts yield the right verdicts only by introducing complex, arguably *ad hoc* criteria (intrinsicness, influence patterns) that lack the elegance of the original proposal.

  Interventionism yields the right verdicts immediately through the logic of structural equations. It handles preemption by distinguishing the actual path from the backup path via variable fixing. It handles overdetermination by appealing to invariance across background conditions. While it sacrifices reductive ambition, it gains explanatory power and precision.

  In philosophy of science, a non-reductive theory that correctly predicts and classifies phenomena is superior to a reductive theory that requires constant revision to match intuitions. Your friend's dismissal of Lewis was perhaps too glib regarding the metaphysical history, but her core claim—that the interventionist apparatus supersedes Lewis for analyzing causal structure—is correct. Lewis provided the questions; Woodward and Pearl provided the tools to actually answer them.

  **Winner: Your Friend.**
