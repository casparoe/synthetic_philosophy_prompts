answer: |-
  Your intuition is correct, and it cuts deeper than most standard rebuttals to Laudan. You have identified that the Pessimistic Meta-Induction (PMI) is not merely a historical observation but a statistical inference that fails to satisfy the conditions required for valid induction. Specifically, it violates the requirement of **exchangeability**.

  To argue this rigorously, and then to extend it to undermine the selective realist's *divide et impera* strategy, we must treat the realism debate not as a metaphysical dispute but as a problem of inductive logic and classification.

  ### I. The Fatal Flaw in Wholesale PMI: The Failure of Exchangeability

  The PMI is structurally an inductive generalization:
  1.  **Sample:** Past successful theories ($T_{past}$) were largely false ($\neg True$).
  2.  **Population:** All successful theories ($T_{all}$), including current ones ($T_{curr}$).
  3.  **Inference:** Therefore, $T_{curr}$ are probably $\neg True$.

  For this inference to hold, the sample must be representative of the population. In statistical terms, the observations must be **exchangeable**. The probability distribution generating the "truth value" of a theory must be stable across the sample and the target.

  However, the "truth value" of a theory is not an intrinsic property like the mass of an electron; it is a relational property dependent on the methodological process that generated the theory. Let $M_t$ be the methodological state of science at time $t$ (instrumentation, mathematical rigor, statistical standards, peer review). The probability of a theory being approximately true is a function of the method: $P(True | Successful, M_t)$.

  The PMI assumes $P(True | Successful, M_{1800}) \approx P(True | Successful, M_{2024})$. This is empirically indefensible.
  *   **Instrumentation:** In 1800, we inferred posits from macroscopic thermodynamics. Today, we scan tunneling microscopes image individual atoms. The causal chain between posit and evidence is radically shorter and less theory-laden now.
  *   **Mathematical Constraint:** Modern theories are constrained by symmetry groups and consistency conditions (e.g., renormalizability) that did not exist for phlogiston or caloric. This restricts the "hypothesis space," increasing the base rate of truth for theories that survive the filter.

  If the sampling mechanism changes, the base rate changes. To treat 19th-century chemistry and 21st-century quantum field theory as draws from the same urn is a **base rate fallacy**.

  **The Reference Class Problem:**
  To save the PMI, the antirealist must specify a reference class $C$ such that $T_{past} \in C$ and $T_{curr} \in C$, and where the truth-frequency in $C$ is stable.
  *   If $C$ is "Empirically Successful Theories," the class is too heterogeneous (exchangeability fails due to methodological drift).
  *   If $C$ is "Theories generated by current methods," the sample is empty (we have no historical data on current methods).
  *   If $C$ is "Theories about unobservables," the class is too vague (what counts as unobservable changes with instrumentation).

  There is no principled way to construct a reference class that is both broad enough to generate a statistical sample and narrow enough to ensure methodological stability. Without this, the PMI is not just weak; it is formally invalid. It attempts to project a local historical frequency onto a global metaphysical probability without a bridge principle.

  ### II. The Collapse of *Divide et Impera*: Reference Class Gerrymandering

  Realists (Psillos, Kitcher, Worrall) attempt to rescue realism by arguing that while *theories* are discarded, specific *posits* (or structures) are retained. This is the *divide et impera* strategy: separate the "working posits" (which earn the success) from the "idle posits" (which are discarded).

  You asked to push the point further: **This strategy succumbs to the exact same reference class problem.**

  To make *divide et impera* work, the realist must provide a criterion $K$ that allows us to classify posits *prospectively*. We need to know, *now*, which parts of the Standard Model are "working" (like the wave equation in Fresnel's theory) and which are "idle" (like the luminiferous medium).

  **1. The Retrospective Circle**
  The classification of past posits as "working" is done retrospectively. We know the ether was idle because Maxwell's equations survived without it. We know the wave structure was working because it was retained.
  To apply this to *current* theories, we must assume that current posits fall into the same reference class as past "working" posits. But how do we identify that class without knowing the future?
  *   If we define the class as "Mathematical Structures," we get a high success rate (Structural Realism).
  *   If we define the class as "Causal Mechanisms," we get a lower success rate (mechanisms change).
  *   If we define the class as "Ontological Entities," we get a very low success rate (caloric, phlogiston, ether).

  The realist's success rate depends entirely on how they carve the reference class. This is **reference class gerrymandering**. The realist selects the description of the posit (e.g., "structural relation" vs. "material substance") that maximizes the historical success rate of that class. But there is no ahistorical metric to tell us whether the electron is fundamentally a "substance" or a "node in a structure." That determination is theory-dependent.

  **2. The Instability of Criteria**
  The criteria used to sort posits (e.g., Psillos's criterion of "independent testability" or "central role in derivation") are themselves methodological norms that evolve.
  *   In 1850, a "causal mechanism" meant a mechanical push/pull.
  *   In 1950, it meant a field interaction.
  *   In 2024, it might mean a symmetry breaking event.

  If the criterion for "working posit" changes over time, then the reference class of "Working Posits" is not stable. You cannot inductively infer that *current* posits satisfying criterion $K_{2024}$ will be retained, based on *past* posits satisfying criterion $K_{1850}$, unless $K_{2024}$ and $K_{1850}$ pick out the same natural kind of theoretical feature. There is no evidence they do.

  **3. The No-Miracles Argument Reversed**
  The realist argues: "It would be a miracle if the working posits were retained if they weren't true."
  The reference class critique reverses this: "It would be a miracle if we could correctly identify the 'working posits' *before* the theory is superseded, given that our criteria for identification shift with every paradigm."
  The *divide et impera* strategy presupposes that we can distinguish the truth-conducive features of a theory from the empirically adequate-but-false features. But the PMI shows we couldn't do that for caloric theory *at the time*. Why assume we can do it now? The ability to sort posits is itself a fallible scientific claim, subject to the same pessimistic induction as the theories themselves.

  ### III. What Survives? The Dissolution of the Wholesale Debate

  If both the wholesale PMI and the wholesale *divide et impera* rescue fail due to the reference class problem, what remains?

  **1. The Death of Global Realism/Antirealism**
  The debate over "Scientific Realism" as a global stance is untenable. It asks for a probability $P(True | Science)$. But "Science" is not a natural kind with a stable essence. It is a historical trajectory of changing methods. There is no single reference class "Science" that spans Lavoisier and the LHC.
  Therefore, **no general answer is available.** Any argument that attempts to quantify the likelihood of truth for "mature science" generally is committing a category error by treating a historical process as a static population.

  **2. The Retreat to Retail Realism**
  We are left with **Retail Realism** (as argued by Chakravartty and others). Verdicts on truth must be issued theory-by-theory, or even posit-by-posit, based on local evidence.
  *   We can be realists about the existence of genes because the causal chains are robust and manipulable.
  *   We might be agnostic about the ontology of string theory because the empirical constraints are weak.
  *   We might be instrumentalists about certain effective field theories while being realists about the underlying symmetries.

  This is not a defeat; it is a clarification. It aligns with actual scientific practice. Physicists do not walk around worrying about the "Pessimistic Meta-Induction"; they worry about whether *this* detector is calibrated and whether *that* background noise is understood.

  **3. A Methodological, Not Metaphysical, Stance**
  What survives is not a metaphysical guarantee of truth, but a **methodological commitment to reliability**.
  The reference class problem shows we cannot know the *base rate of truth*. However, we can measure the *reliability of error-correction*.
  Modern science has built-in mechanisms (blind analysis, preregistration, replication crises management) that 19th-century chemistry lacked. We cannot say $P(True)$ is high. But we can say $P(Corrected | Error)$ is higher now than in 1800.
  This shifts the goal from "Are our theories true?" to "Are our methods capable of detecting when they are false?" This is a defensible claim that avoids the reference class trap, because it relies on the *process* (which we can observe) rather than the *outcome* (which we cannot verify without God's-eye view).

  ### Conclusion

  Your assessment is rigorous and correct. The reference class problem is fatal to the PMI because it assumes an exchangeability between historical and contemporary science that methodological progress explicitly denies.

  However, the poison pill works both ways. The realist's *divide et impera* strategy is equally vulnerable because the criteria for distinguishing "working" from "idle" posits are themselves historically contingent and cannot be non-circularly applied to current theories.

  **Does anything survive besides retail verdicts?**
  No. There is no "General Answer" to scientific realism. The question "Is science generally true?" is ill-posed because "science" does not constitute a stable reference class. The only coherent position is a **local, methodological naturalism**: we trust specific claims to the extent that specific methods warrant them, without attempting to bootstrap a global metaphysical guarantee from a history that is too heterogeneous to support the induction. The debate dissolves not into skepticism, but into the detailed work of epistemology of the specific sciences.
