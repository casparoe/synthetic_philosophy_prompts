answer: |-
  This is a remarkably sharp exchange for a dinner party conversation. Marisol and Owen have inadvertently reconstructed one of the most famous debates in modern moral philosophy, largely stemming from Derek Parfit's *Reasons and Persons* (1984) and subsequent work by Gustaf Arrhenius. They are grappling with the "Impossibility Theorems" of population ethics.

  Here is a move-by-move refereeing of the match, evaluating the logical strength of each position, followed by the missing considerations you asked for.

  ### Round 1: The Total View vs. The Repugnant Conclusion
  **Marisol:** Rejects the "Total View" (summing welfare) because it implies the Repugnant Conclusion (RC).
  **Owen:** Argues you cannot simply reject the conclusion without finding the flaw in the premises. He cites the "Mere Addition Paradox": if adding happy people is good, and equality is good, logic forces you to the RC.

  **Referee's Call: Advantage Owen.**
  Marisol opens with a classic *reductio ad absurdum*: "Your theory leads to X, X is absurd, therefore your theory is false." This is a valid move, but Owen correctly identifies that in population ethics, X (the RC) is not obviously false enough to overthrow the premises that lead to it.
  Owen's point is stronger because he highlights that the RC is derived from premises that seem *more* secure than the intuition against the RC. "Mere Addition" (adding a happy person without hurting anyone) is very hard to deny. If Marisol wants to block the RC, she has to explain *which* plausible step is wrong, not just point at the result. She is relying on an intuition ("lots of mediocre lives is bad") to override a logical chain built from stronger intuitions ("adding happy lives is good"). Owen wins this round by forcing her to engage with the machinery, not just the output.

  ### Round 2: Critical-Level Utilitarianism vs. The Sadistic Conclusion
  **Marisol:** Proposes the "Critical-Level View" (CLV). Lives must exceed a certain threshold of quality to add positive value. This blocks the RC.
  **Owen:** Counters that CLV implies the "Sadistic Conclusion" (SC): It can be better to add a small number of tortured people than a large number of people with lives barely above the critical level (but below the "good" threshold).

  **Referee's Call: Advantage Owen.**
  Marisol attempts to solve the problem by changing the axioms, but Owen correctly identifies that she has purchased a solution at a terrible price. In the philosophical literature, the Sadistic Conclusion is widely considered *more* repugnant than the Repugnant Conclusion.
  The RC asks us to accept a world of vast, mediocre happiness. The SC asks us to accept *suffering* as a preferable trade-off for mild happiness. Marisol's move is technically valid (CLV does block RC), but Owen wins the normative battle here because avoiding the RC by accepting the SC is arguably a moral disaster. She has traded a counter-intuitive result for a morally abhorrent one.

  ### Round 3: The Clash of Intuitions (The "Pick and Choose" Jab)
  **Marisol:** Argues Owen cannot selectively distrust intuitions. If he dismisses RC because the populations are "vast and unfamiliar," she can dismiss SC because the suffering people are "hypothetical and unborn."
  **Owen:** (Implicitly) Holds that suffering intuitions are more robust than population-size intuitions.

  **Referee's Call: Draw (with a nuance favoring Owen's underlying logic).**
  This is the specific point you asked about. Marisol's jab is rhetorically strong but logically slightly asymmetrical.
  *   **Marisol's Strength:** She is right that Owen cannot simply say "My intuition wins" without explaining *why* one intuition is more reliable than the other. If we discard intuitions whenever they lead to paradox, we have no ethics left.
  *   **Owen's Strength:** However, the *reasons* for distrusting the intuitions are different. We have strong evolutionary and psychological reasons to distrust our grasp of **large numbers** (scope neglect). Our brains are not wired to feel the difference between a million happy people and a billion. Conversely, our intuition against **torture/suffering** is grounded in immediate harm aversion, which is generally considered more morally reliable than our grasp of aggregate utility.
  *   **The Verdict:** Marisol wins the procedural point (Owen needs to justify his distrust), but Owen holds the stronger epistemic ground. Marisol's claim that "hypothetical people" make intuitions unreliable is weak; all population ethics deals with hypothetical people (since they don't exist yet). The core of SC isn't that they are hypothetical, but that it prioritizes suffering over happiness. Owen survives this round, but Marisol successfully exposed that he needs a theory of *which* intuitions to trust, not just a dismissal of hers.

  ### Round 4: Average Utilitarianism
  **Owen:** Pivots to "Average Utilitarianism" (maximize the average welfare per person) to dodge both RC and SC.
  **Marisol:** Points out two fatal flaws: 1. It implies adding a happy person can be bad if they are below the current average. 2. It makes current value dependent on dead people (the "Past People" problem).

  **Referee's Call: Decisive Victory Marisol.**
  Owen is cornered and grabs a theory that is widely regarded as defunct in professional philosophy. Marisol's objections are the standard, fatal objections to Average Utilitarianism.
  1.  **The Happy Sadist Problem:** If the average happiness is extremely high, adding a new, very happy person (who is still slightly below the average) would lower the average, making the world "worse." This contradicts the intuition that adding happy people is good.
  2.  **The Past People Problem:** If a million happy people lived in ancient Greece, the "average" is set. If we discover they were actually miserable, the average drops, and suddenly our current actions look better or worse without anything changing in the present.
  Marisol dismantles this cleanly. Owen ran out of road here.

  ---

  ### Missing Considerations: What Wasn't on the Table?

  Neither Marisol nor Owen mentioned three crucial frameworks that a "more careful treatment" would introduce. If you want to continue this debate, these are the tools you need.

  **1. The Person-Affecting Restriction (PAR)**
  Both of them are arguing within "Impersonal" ethics (comparing State A vs. State B regardless of who exists). A major alternative is the Person-Affecting View: *An outcome can only be better or worse if it is better or worse for some particular person.*
  *   **How it helps:** It blocks the Repugnant Conclusion immediately. In the RC scenario, the people in the "wonderful" population are not harmed by the switch, and the people in the "mediocre" population wouldn't exist otherwise. So, the switch isn't "better" for anyone.
  *   **The Catch:** It leads to the **Non-Identity Problem**. If a policy causes climate change that makes life hard for future people, but those specific people wouldn't have existed without that policy, the Person-Affecting View struggles to say the policy was wrong (because it wasn't worse *for them*).

  **2. Lexical Views (The "Lexical Threshold")**
  Parfit himself eventually leaned toward this. The idea is that there is a threshold of welfare such that *any* number of lives above that threshold is better than *any* number of lives below it, no matter how many.
  *   **How it helps:** It blocks the Repugnant Conclusion without needing a Critical Level that creates the Sadistic Conclusion. It says "Wonderful lives" and "Barely worth living lives" are in different moral categories, not just different quantities.
  *   **The Catch:** It violates "Weak Dominance." It implies that adding one wonderful person is always better than adding a billion mildly happy people, which can seem its own form of repugnant elitism.

  **3. Imprecise Comparability (The "Vagueness" Solution)**
  This view suggests that some populations are simply **incomparable**. It is not that Population A is better than Population B, nor that they are equal; it is that the question has no precise answer.
  *   **How it helps:** It dissolves the paradox. The chain of small steps Owen described relies on transitivity (if A > B and B > C, then A > C). If comparability is vague, the chain breaks before it reaches the Repugnant Conclusion.
  *   **The Catch:** It makes decision-making very difficult. If longtermist choices involve comparing incomparable futures, how do we choose?

  ### Final Summary
  If I have to score the dinner debate:
  *   **Owen** started stronger by correctly identifying that Marisol couldn't just assert the Repugnant Conclusion was false without engaging the logic.
  *   **Marisol** finished stronger by correctly identifying that Owen's fallback positions (Critical Level, Average Utilitarianism) had fatal flaws of their own.

  However, **Owen was right about the core problem:** Marisol never actually solved the paradox; she just pushed it around. She blocked the Repugnant Conclusion but faced the Sadistic Conclusion, then defeated Owen's Average View without offering a positive theory of her own.

  **The Real Winner:** The realization that there may be no consistent theory that satisfies all our intuitions. This is known as the **Impossibility Theorem** in population ethics. The most mature position to take after this debate is not "Marisol is right" or "Owen is right," but rather that our intuitive moral machinery is not built to handle decisions about the existence of future people, and we may have to accept some "repugnance" in whatever theory we choose.

  If you want to read further to arm yourself for the next dinner, look up **Gustaf Arrhenius's "Population Ethics: The Challenge of Future Generations"** or **Derek Parfit's "Reasons and Persons" (Part IV)**. They map the exact terrain Marisol and Owen were fighting over.
