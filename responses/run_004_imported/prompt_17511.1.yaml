  **Point 1 (Leo): Score 1**
  Leo captures the pragmatic spirit of Arrow's Theorem correctly—that Ranked-Choice isn't a magic bullet and fails certain fairness criteria (like Independence of Irrelevant Alternatives). However, he is technically imprecise: Arrow's Theorem only applies to *ordinal* (ranked) systems, not "no voting system" universally, which Mia correctly corrects in the next point.

