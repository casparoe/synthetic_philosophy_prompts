  Mia is practically right that Ranked-Choice is also vulnerable to strategic voting (e.g., compromising), so Leo can't claim moral superiority for ordinal methods. However, she is theoretically slightly off: the vulnerability of all voting systems to strategy is itself proven by a mathematical impossibility theorem (Gibbard-Satterthwaite), not just empirical observation.

  **The Bigger Point You're Both Missing**
  You are applying large-scale social choice theory to a **10-person cooperative team**, which is a category error. Voting theory assumes anonymous, adversarial, or large populations where communication is impossible. In a small engineering team, **voting is often a failure mode** indicating a lack of consensus; the optimal solution is usually structured discussion or consensus-seeking, not a more complex ballot. If you must vote to capture "intensity of preference" without strategic collapse, look into **Quadratic Voting**, which allows team members to spend a budget of credits on options, mathematically incentivizing honest expression of how much they care.
