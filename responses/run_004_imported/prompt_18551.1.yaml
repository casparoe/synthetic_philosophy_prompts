          *   Analogy: It's like predicting the weather using a model that assumes no clouds, then seeing a cloud and asking the model what happens next.

      *   **Stalnaker's Position (The Belief Revision Critique):**
          *   Premise: CKR isn't enough. You need a theory of *belief revision*.
