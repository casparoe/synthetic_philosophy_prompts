answer: |-
  The quill scratched, a dry, insect sound against the heavy parchment. Thomas Hobbes did not blink. To blink was to break the line.

  On the desk before him, the candle guttered in a draft he could not feel. He was eighty-three years old. His hands, spotted with the ink of fifty years and the liver spots of time, trembled slightly, but the steel compass held steady. He pressed the point into the paper. A pivot. An axiom. From this single, unmoving truth, the arc swung.

  *Perfect,* he thought. *The curve is perfect.*

  But the curve was the enemy. The curve was nature, wild and unbounded. The straight edge was man's will. To square the circle was not merely a puzzle; it was the act of forcing the wild world to submit to reason. It was the construction of a Sovereign out of the state of nature.

  A pamphlet lay to his left, the edges dog-eared from violent handling. *Elenchus Geometriae Hobbianae.* John Wallis. The Savilian Professor. The man who treated truth like a marketplace, haggling over probabilities while Hobbes sought the bedrock.

  "They call it error," Hobbes whispered to the empty room. His voice was a rasp, unused to conversation. "But an error implies a mistake in calculation. I have made no mistake in calculation. I have made a declaration."

  He dipped the quill. He drew the square around the circle.

  His mind drifted back, as it often did in the long London nights, to Welbeck Abbey. He had been forty. A gentleman of letters, a tutor, a traveler. He had wandered into a library, bored, and found a copy of Euclid lying open. Book I. Proposition 47. The Pythagorean theorem.

  *The square on the hypotenuse is equal to the sum of the squares on the other two sides.*

  He had read it and laughed. "By God," he had said aloud to the dust motes, "this is impossible."

  But the proof followed. Step by logical step. No appeals to authority. No appeals to scripture. No appeals to the King. If you accepted the definitions, you *had* to accept the conclusion. It was coercion without violence. It was the only kind of power Hobbes had ever respected.

  That was the year the world began to make sense. That was the year before the Long Parliament. Before the headsman's block. Before the chaos.

  He remembered the smell of the Civil War. Not gunpowder, but fear. The smell of men realizing there was no common measure for right and wrong. They killed each other over invisible lines in the sand, over interpretations of God, over who should rule. It was a war of words, and words were slippery. Words could mean anything.

  But a line was a line. A circle was a circle.

  If geometry could be disputed, then nothing was safe. If Wallis could look at a proof as clear as daylight and call it darkness, then the very concept of truth was subjective. And if truth was subjective, then the Leviathan had no foundation. If the Sovereign's law was just another opinion, like Wallis's mathematics, then we were back in the woods. Back in the war of all against all.

  A knock at the door broke his concentration. The compass slipped. The arc was ruined.

  Hobbes stared at the blemish. A flaw in the system.

  "Enter," he said.

  It was his servant, a young man named Elias, holding a tray of tea and a stack of letters. Elias looked at the desk, at the hundreds of sheets covered in identical diagrams, and his eyes dipped quickly to the floor. He knew better than to judge the master, but the pity radiated off him like heat.

  "From the Royal Society, sir," Elias said, placing the letters down. "They... they inquire after your health. And they ask if you wish to rescind your latest submission."

  Hobbes let out a short, sharp laugh. "Rescind. As if truth were a debt to be forgiven."

  "They say Mr. Wallis has demonstrated the flaw in the ratio, sir. He used infinitesimals."

  "Infinitesimals," Hobbes spat the word. "Ghostly quantities. Things that are and are not. That is not geometry, Elias. That is mysticism. That is the priests returning in the guise of mathematicians."

  He stood up, his knees cracking. He began to pace. He always thought better when moving. To stand still was to invite the cold, the age, the doubt.

  "Do they think I do not see their calculations?" Hobbes paced the length of the study. "I see them. I trace their lines. But they start from the wrong place. They start from the assumption that the circle cannot be squared. They beg the question. It is political, Elias. It is faction."

  "Mathematics, sir? Political?"

  "Everything is political!" Hobbes stopped. He turned to the young man, his eyes bright and feverish in the candlelight. "Why do you think I wrote *Leviathan*? Because men are reasonable? No. Because men are beasts. They need a master. They need a measure that cannot be argued. I gave them the State. I gave them the Sword. And now I give them the Square."

  He walked back to the desk and picked up Wallis's pamphlet.

  "Wallis says I am wrong. The Royal Society says I am wrong. They freeze me out. They do not invite me to dine. They whisper that old Hobbes has lost his mind." He ran a finger over the printed text. "But if I yield... if I say, 'You are right, John, the circle cannot be tamed'... then what?"

  Elias said nothing. He was a servant; he was paid not to answer.

  "If I yield," Hobbes continued, his voice dropping to a murmur, "then I admit that certainty is impossible. If I admit that, then my politics are just opinions. And if my politics are just opinions, then the King's power is just an opinion. And if the King's power is an opinion..."

  He looked at the candle flame. It danced. Unstable.

  "Then we burn," Hobbes said. "We burn again."

  He sat down heavily. The chair creaked. He picked up a fresh sheet of parchment. He took the compass.

  "Sir," Elias ventured softly. "Perhaps... perhaps rest would be better. The physicians say the strain aggravates your shaking."

  "My shaking is the body decaying," Hobbes said, pressing the point into the paper. "My mind is iron. Wallis is water. Water wears away stone, eventually. But while the stone stands, it defines the riverbed."

  "He is younger, sir. He has more time."

  "I have the Truth."

  It was a desperate statement. Hobbes knew, in the deepest, quietest vault of his skull, that the mathematical community had moved on. He knew that to them, he was a relic, a stubborn old dog barking at a carriage that had already left the station. He knew that when he died, they would not mourn the geometer. They would remember the philosopher, and they would chuckle at the geometry.

  But he could not stop.

  To stop was to admit that the Euclid moment had been a lie. That the certainty he had felt at forty was a hallucination. If that certainty was false, then the terror of the Civil War was the only reality. Chaos was the only truth. Order was the dream.

  He could not live in that world. He had built a life on the proposition that reason could chain the beast. This circle *had* to be squared. Not because the numbers worked—though he believed they did—but because the universe *owed* him order.

  "Leave me," Hobbes said.

  "Sir, the tea—"

  "Leave me."

  Elias bowed and retreated. The door clicked shut.

  Silence returned, heavy and thick. Hobbes looked at the diagram. The square sat around the circle. It looked right. It felt right. The proportions sang to him.

  He picked up the quill. He began to write a response to Wallis. He would not be polite. He would call Wallis ignorant. He would call him a pedant. He would dissect the Professor's arguments with the same surgical brutality he had once applied to the concept of Divine Right.

  He wrote: *You claim I have erred in the sector. But you define the sector as a thing of motion, and motion is not geometry. Geometry is static. It is eternal.*

  He paused. The ink pooled at the nib.

  *It is eternal.*

  That was it. That was the anchor. Wallis dealt with the world as it was—messy, approximate, experimental. Hobbes dealt with the world as it *must be*.

  He thought of the Royal Society. They poked at frogs. They weighed air. They collected curiosities. They were children playing in the mud, thinking they were building a cathedral. Hobbes was building the cathedral. It didn't matter if the bricks didn't fit perfectly in the hands of a mason who didn't understand the architecture.

  He blew on the wet ink.

  Let them laugh. Let them freeze him out. Let history call it a delusion.

  He picked up the compass again. He needed to check the tangent. Just one more time. If he could just find the point where the curve became straight, the place where the infinite surrendered to the finite, he could lock the door against the chaos forever.

  He pressed the steel point down. Hard. It pierced the paper, stabbing into the wood of the desk beneath.

  "Got you," he whispered.

  He drew the line. It was straight. It was true.

  Outside, London slept, a city of shadows and uncertainties, waiting for the fire or the plague or the sword. But in this room, for this moment, the circle was squared. The beast was leashed.

  Hobbes leaned back, exhausted, his hand cramping. He knew Wallis would write back. He knew the Royal Society would not read it. He knew he would die with the ink still wet on his fingers.

  He looked at the diagram one last time. It was beautiful. It was impossible. It was his.

  "Let them have their experiments," Hobbes said to the dark. "I have the Proof."

  He blew out the candle. In the sudden blackness, the geometry remained, etched into his mind, the only light that would not go out.
