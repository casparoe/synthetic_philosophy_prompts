answer: |-
  Your intuition that this argument "proves too much" is philosophically sound. In ethics, this is known as the **"Cluelessness Objection"** to strict consequentialism. If accepted, it leads to moral paralysis, where no action can be justified because the infinite future is unknowable.

  While your friend raises a valid point about the limits of human knowledge, her conclusion—that you have no basis for believing your mentoring does good—contains several critical flaws. Here is how you can dismantle the argument.

  ### 1. The Argument from Expected Value
  Moral decision-making is not based on *actual* outcomes (which are only knowable in hindsight), but on *expected* outcomes based on available evidence.

  Consider a doctor treating a patient. The doctor saves a life. However, that patient could theoretically go on to commit crimes, or their descendants could. Does this mean the doctor acted without a basis? No. The doctor acts on **probability**. Based on all available data, saving a life and restoring health increases the likelihood of positive well-being for that person and their community.

  Similarly, mentoring an at-risk teenager shifts the statistical probabilities of their life trajectory. Data consistently shows that mentorship reduces the likelihood of drug use, violence, and incarceration, while increasing educational attainment and employment. You are not betting on a specific, unknowable future; you are betting on a **positive expected value** based on established social science.

  ### 2. The Baseline Problem
  Your friend's argument assumes that *inaction* is a neutral baseline with zero moral weight. It isn't.

  If you do not mentor the teenager, they still have a future. They will still affect countless people for generations. That future is *also* unknowable. By the logic of your friend's argument, you cannot know if *withdrawing* your mentorship does more harm than good.

  To make a rational choice, you must compare the probable outcomes of Action A (mentoring) vs. Action B (not mentoring).
  *   **Scenario A:** The teen receives support, gains stability, and is statistically less likely to harm others.
  *   **Scenario B:** The teen lacks support, faces higher risks of instability, and is statistically more likely to experience or inflict harm.

  Since both futures are unknowable in their entirety, you must rely on the **proximate probabilities**. The evidence suggests Scenario A reduces immediate suffering and risk more than Scenario B. That is a sufficient basis for action.

  ### 3. The Limit of Foreseeability
  Most ethical frameworks (even consequentialist ones) rely on **reasonably foreseeable consequences**, not infinite ones.

  We hold people responsible for the direct results of their actions, not the butterfly effects centuries down the line. If you give a hungry person a sandwich, you are responsible for feeding them. You are not responsible for the fact that the energy from that sandwich allowed them to walk to a park where they eventually met their spouse and had a great-grandchild who invented a harmful technology.

  Moral agency requires a horizon of responsibility. If we are responsible for the infinite ripple effects of our actions, moral responsibility becomes incoherent because it exceeds human cognitive capacity. Limiting responsibility to foreseeable outcomes is not a cop-out; it is a necessary condition for ethics to function at all.

  ### 4. It Proves Too Much (Moral Paralysis)
  As you noted, this logic applies to almost any action.
  *   Should you donate to charity? The money might be misused, or the recipients might have children who cause harm.
  *   Should you have children? Their carbon footprint and future actions are unknowable.
  *   Should you drive to work? You might accidentally delay someone who would have otherwise prevented a disaster.

  If we require certainty of net positive impact across generations to act, we must cease acting entirely. But inaction is itself an action with unknowable consequences. Therefore, the argument is self-defeating. It demands a standard of knowledge that is impossible to meet, rendering the concept of "doing good" meaningless.

  ### 5. Alternative Ethical Frameworks
  Finally, your friend's argument relies entirely on **Utilitarianism** (judging actions solely by their aggregate outcomes). But many other ethical frameworks validate your work without needing to calculate the future:

  *   **Virtue Ethics:** Mentoring makes *you* a more compassionate, engaged citizen. It cultivates virtue, which is good in itself.
  *   **Deontology (Duty):** You may have a duty to help those in need simply because they are human beings deserving of dignity, regardless of the downstream utility.
  *   **Care Ethics:** The value lies in the relationship itself. Providing stability and care to a vulnerable person in the present moment has intrinsic worth, independent of what happens in 50 years.

  ### Conclusion
  Your friend is right that we cannot *know* the infinite future. She is wrong that this uncertainty undermines the reason for acting.

  We act on the best available evidence regarding probable outcomes. By mentoring, you are increasing the likelihood of stability, safety, and well-being for that teenager *now* and in the foreseeable future. That is a rational, ethical, and sufficient basis for your work. Do not let the impossibility of omniscience rob you of the value of tangible good.
