      *   **Expected Value vs. Actual Value:** Moral decision-making is based on *expected* utility (what we reasonably anticipate), not *actual* utility (what actually happens, which is only knowable in hindsight).
      *   **Probability and Baselines:** We deal in probabilities. At-risk teens statistically have higher chances of negative outcomes (prison, poverty, harm). Mentoring shifts the probability toward positive outcomes. We don't need certainty; we need positive expected value.
      *   **Scope of Moral Responsibility:** Are we responsible for the actions of the people we help, forever? Most ethical frameworks limit responsibility to direct or reasonably foreseeable consequences.
      *   **Non-Consequentialist Perspectives:** Virtue ethics (being a good person), Deontology (duty to help), or Care Ethics (relationship matters) don't rely solely on calculating infinite future outcomes.

