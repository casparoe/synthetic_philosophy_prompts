      *   *Section 3: Resolving the Historical Paradox (Mercury/GR).* Why did old evidence count there? Because the *derivation* was novel, even if the *fact* wasn't. It showed the theory had no free parameters.
      *   *Section 4: Applying to the Engineering Case.*
