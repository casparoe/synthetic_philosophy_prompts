prompt: |-
  I sit on my university's newly formed cybersecurity-incident committee, convened after a peer institution paid a seven-figure ransom to recover encrypted patient and research data -- I suspect I was added because I teach decision theory. We must recommend a standing ransomware policy, and the committee is split: half want a binding public commitment never to pay, since only a credible refusal keeps us from being marked as an easy target; half want case-by-case discretion, since refusing once our systems are already encrypted looks like pure loss for a principle. This feels to me like Parfit's hitchhiker played out at institutional scale: the disposition that keeps you from being chosen as a target in the first place is not the choice that looks rational once you're already staring at the ransom note. Please draft the two-page memo I'll circulate before the vote. It should recommend a specific policy, including whether and how narrowly any exception process should run, and it should take seriously the strongest objection to whichever side it favors -- especially the worry that binding an institution to "resoluteness" is not the same as binding a single person to it, since the costs land on patients, researchers, and students who never agreed to bear them.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university cybersecurity-incident committee (teaches decision theory).
      *   **Context:** Peer institution paid a 7-figure ransom. Committee is split between "Never Pay" (binding commitment) and "Case-by-Case" (discretion).
      *   **Core Problem:** Time-inconsistency problem (Parfit's Hitchhiker). The optimal *ex-ante* strategy (never pay) differs from the optimal *ex-post* strategy (pay to recover).
      *   **Task:** Draft a two-page memo recommending a specific policy.
      *   **Key Requirements:**
          *   Recommend a specific policy (including exception process).
          *   Take seriously the strongest objection to the favored side (specifically the moral hazard/cost-bearing objection: students/patients/researchers didn't agree to the risk).
          *   Tone: Academic, rigorous, persuasive, administrative but grounded in decision theory.
          *   Length: Approximately two pages (standard memo format).

  2.  **Determine the Recommendation:**
      *   *Option A: Never Pay.* Strongest deterrent signal. Aligns with decision theory (pre-commitment). Risk: Catastrophic loss if attacked despite precautions.
      *   *Option B: Case-by-Case.* Flexible. Risk: Signal is weak, attackers assume we will pay, increasing likelihood of attack.
      *   *Option C: Hybrid (Presumptive No-Pay with Extreme Exception).* This is usually the most realistic institutional policy. It maintains the deterrent signal while acknowledging existential risk.
      *   *Decision:* I will recommend a **"Presumptive Non-Payment Policy with a Narrow, High-Threshold Exception Process."** This leans towards the "Never Pay" side (to solve the time-inconsistency problem) but acknowledges the moral weight of the objection regarding harm to third parties.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The core recommendation.
      *   **The Decision-Theoretic Problem:** Explain Parfit's Hitchhiker/Time Inconsistency clearly but concisely.
      *   **The Recommendation:** Specific policy language.
      *   **The Exception Process:** How to handle the "case-by-case" worry without undermining the policy.
      *   **Addressing the Strongest Objection:** The moral cost to stakeholders (patients, students). This is crucial per the prompt.
      *   **Conclusion:** Call to action.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard university format.
      *   *Opening:* Acknowledge the gravity. State the recommendation immediately.
      *   *The Theory:* Use the "Parfit's Hitchhiker" analogy the user mentioned. Explain *why* discretion fails (it invites attacks). We need a "credible commitment."
      *   *The Policy:* "Presumptive Non-Payment." Not absolute, but heavy burden of proof.
      *   *The Exception:* Needs to be hard to trigger. "Imminent threat to human life" is the standard bar (higher than financial loss or research data). Who decides? Not the IT team (too close to the pain). Needs to be a separate group (Trustees/General Counsel/External).
      *   *The Objection (The Crux):* The prompt specifically asks to address the worry that binding the institution harms stakeholders who didn't consent.
          *   *Counter-argument:* Paying fuels the ecosystem that attacks everyone (negative externality).
          *   *Mitigation:* Investment in backups/insurance. We aren't just saying "no," we are saying "no, and here's how we protect you otherwise."
          *   *Ethical framing:* Utilitarian vs. Deontological. Paying is short-term relief, long-term harm.
      *   *Closing:* Vote request.

  5.  **Refining the Tone:**
      *   Needs to sound like a decision theorist speaking to administrators.
      *   Avoid jargon where possible, but use the specific concepts (ex-ante/ex-post, credible commitment).
      *   Empathetic to the "human cost" objection. Don't dismiss it; grapple with it.

  6.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too long? Keep it tight.
      *   *Critique:* Did I address the "patients/researchers" objection strongly enough? I need to make sure I don't just wave it away. I need to admit that *this* policy imposes risk on them, but argue it's the lesser evil compared to the systemic risk of paying.
      *   *Critique:* Is the exception process specific? I should define the threshold (e.g., "imminent loss of life").

  7.  **Drafting - Iteration 2 (Writing the Content):**
      *   *Subject:* Recommendation on Ransomware Payment Policy.
      *   *Intro:* We are facing a time-inconsistency problem.
      *   *Analysis:* Discretion looks rational *after* encryption but invites attacks *before*.
      *   *Policy:* Presumptive prohibition.
      *   *Exception:* Only for immediate threat to human life/safety. Not for data loss or financial cost.
      *   *Objection:* The "Hostage" argument. Stakeholders suffer for a principle.
      *   *Rebuttal:* Paying makes us a repeat target and funds attacks on peers. We mitigate via resilience (backups), not capitulation.
      *   *Conclusion:* Adopt the policy.

  8.  **Final Polish:** Check word count and formatting to ensure it feels like a 2-page memo (approx. 800-1000 words). Ensure the "Parfit" reference is integrated naturally. (Self-Correction: Make sure the exception process isn't a loophole. It needs to be cumbersome enough to prevent casual use.)

  9.  **Final Review against Prompt:**
      *   Two-page memo? (Yes, visually).
      *   Recommend specific policy? (Yes, Presumptive No).
      *   Exception process details? (Yes, Life/Safety only).
      *   Address strongest objection (Stakeholder cost)? (Yes, dedicated section).
      *   Tone appropriate? (Yes).

  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* abstract. This is a real university with real patients. The decision theory must serve the ethics, not replace it. I will emphasize that "resilience investment" is the quid pro quo for the "no-pay" stance.

  10. **Final Output Generation** (Proceed to generate response).
answer: |-
  **MEMORANDUM**

  **TO:** Cybersecurity-Incident Committee
  **FROM:** [Your Name], Faculty Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Ransomware Payment Policy and Exception Protocol

  **Executive Summary**

  We are convened to solve a time-inconsistency problem. *Ex-ante* (before an attack), our optimal strategy is to convince adversaries we will never pay. *Ex-post* (after encryption), our optimal strategy appears to be paying to minimize immediate disruption. If attackers believe we will act rationally *ex-post*, they will target us. Therefore, I recommend the committee adopt a **Presumptive Non-Payment Policy** with a narrowly defined exception process reserved strictly for imminent threats to human life or physical safety. This memo outlines the decision-theoretic rationale, the specific exception protocol, and addresses the critical ethical objection regarding stakeholder risk.

  **The Decision-Theoretic Context**

  As noted in our preliminary discussions, this scenario mirrors Parfit's Hitchhiker. A traveler stranded in the desert promises a driver payment upon reaching town. Once in town, the rational choice is to renege; knowing this, the rational driver never picks up the traveler.

  In cybersecurity, discretion is the equivalent of reneging. If we maintain a policy of "case-by-case discretion," we signal to ransomware cartels that payment is on the table. Our cybersecurity posture is not just our firewalls; it is our reputation. A binding commitment not to pay is the only credible signal that lowers our probability of being targeted. If we retain the option to pay, we invite the attack that forces us to exercise that option.

  **Recommended Policy: Presumptive Non-Payment**

  I propose the committee recommend the following standing policy to the Board of Trustees:

  > *The University shall not make payments to threat actors in response to ransomware incidents. This prohibition extends to cryptocurrency, fiat currency, or equivalent value transfers.*

  **The Exception Process**

  Absolute prohibitions can become morally untenable in edge cases. However, exceptions must be sufficiently difficult to trigger that they do not undermine the credibility of the general rule. I recommend an exception process with the following constraints:

  1.  **Threshold:** An exception may only be considered if there is a verified, imminent threat to **human life or physical safety** (e.g., encrypted life-support systems, emergency room routing). Loss of research data, financial loss, reputational damage, or administrative disruption do not meet this threshold.
  2.  **Authority:** The decision cannot rest with IT leadership or the Incident Commander, who are under duress. Authority rests with a pre-designated **Emergency Executive Council** (General Counsel, Chief Risk Officer, and an external Trustee), requiring a unanimous vote.
  3.  **Transparency:** Any invocation of the exception clause triggers an immediate, mandatory external audit and public disclosure to regulatory bodies.

  This high bar ensures the exception is a safety valve for catastrophe, not a loophole for inconvenience.

  **Addressing the Strongest Objection: The Burden on Stakeholders**

  The most serious objection to this policy comes from the "Case-by-Case" coalition. They argue that binding the institution to resoluteness imposes asymmetric risks on stakeholders—patients, students, and researchers—who did not consent to bear the cost of our principles. If we refuse to pay and a hospital wing shuts down or years of clinical trial data are lost, we have sacrificed their welfare for the abstract goal of "not funding criminals."

  This objection is morally weighty. It argues that institutional integrity should not be purchased with third-party suffering.

  However, we must weigh this against the systemic consequences of payment. Paying a ransom is not a private transaction; it is a negative externality.
  1.  **Recidivism:** Institutions that pay are marked as compliant targets. Data suggests they are significantly more likely to be attacked again within 12 months.
  2.  **Ecosystem Harm:** Ransom payments fund the infrastructure used to attack other universities and hospitals. By paying to save *our* patients today, we increase the probability that *another* hospital's patients are harmed tomorrow.

  To adopt a discretionary policy is to prioritize identified victims (our current community) over statistical victims (future attacks on us and peers). While the duty of care to our current community is paramount, it does not extend to capitulating to criminal extortion that endangers the broader healthcare and academic ecosystem.

  **Mitigation via Resilience**

  The moral license to refuse payment is contingent on our investment in resilience. We cannot simply say "no"; we must say "no, because we are prepared." This policy must be paired with a mandated increase in spending on:
  *   Immutable, offline backups (air-gapped).
  *   Regular recovery drilling (testing restoration speeds, not just backup integrity).
  *   Cyber-insurance that covers recovery costs (but explicitly excludes ransom payments).

  If we adopt the Non-Payment policy, we accept a higher risk of operational disruption in exchange for a lower risk of initial infection. To make this ethically permissible, we must minimize the disruption risk through aggressive investment in recovery infrastructure.

  **Conclusion**

  A policy of discretion is a policy of vulnerability. It asks us to be rational victims when we are attacked, which ensures we will be attacked.

  I urge the committee to vote in favor of the **Presumptive Non-Payment Policy** with the narrow life-safety exception outlined above. This approach balances the need for a credible deterrent with the moral obligation to prevent physical harm. It acknowledges that while we cannot guarantee zero risk to our stakeholders, we can guarantee that we will not fuel the criminal ecosystem that threatens them.

  I request we move to a vote on this framework by next Friday.
