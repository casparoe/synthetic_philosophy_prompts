      *   *Key Concepts to weave in:* Bayesian updating, Reference Class Forecasting, Epistemic Akrasia, Higher-Order Evidence, Calibration.

      *(Self-Correction during drafting)*: I need to be careful with Move 2. Owen's akrasia charge is sophisticated. I shouldn't dismiss it too easily. The distinction is between "I believe P" and "I believe my probability estimate for P is Q." If Dev believes the derivation is sound, he believes the probability is 92%. If he reports 65%, is he lying? No, he's reporting his *credence*, which includes the reliability of the derivation. I need to make sure this distinction is clear.
      *Refinement on Move 4:* Owen's point about "Epistemic Learned Helplessness" is crucial. If Dev just downgrades, he treats his reasoning as a black box. Rationality involves opening the black box. But he can't wait to open it before reporting. So, report 65%, keep looking.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Adjudicate moves 1-4 (Succeed/Partial/Fail + Why).
      *   Close with what they are missing.
