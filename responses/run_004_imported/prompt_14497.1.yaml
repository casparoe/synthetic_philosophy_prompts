      *Decision:* Renata is more right on the *normative epistemology* (what credence to hold). Owen is more right on the *pragmatic heuristic* (how to improve). But since the question is "what is Dev rationally required to believe," Renata wins on the core philosophical ground, provided she accepts Owen's caveat about reference classes.

