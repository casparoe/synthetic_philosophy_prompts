answer: |-
  Here is a construction of the strongest argument suitable for a graduate seminar context. It is designed to challenge the standard liberal reading of Hart by demonstrating that his exceptions are not merely pragmatic compromises but theoretical concessions that undermine his meta-ethical separation of law and morality.

  ***

  ### Seminar Handout: The Collapse of Hartian Liberalism into Qualified Legal Moralism

  **Topic:** The Stability of the Harm Principle in *Law, Liberty, and Morality*
  **Objective:** To evaluate whether H.L.A. Hart's concessions regarding paternalism and public offense inadvertently validate Lord Devlin's core thesis, reducing Hart's position to a form of qualified legal moralism.

  #### I. The Core Dispute: Critical vs. Positive Morality
  To understand the strength of this objection, we must first clarify the battlefield.
  *   **Devlin's Claim:** Society is a community of ideas, not just political interests. Its existence depends on a shared **positive morality** (conventional moral beliefs). The "disintegration thesis" holds that without legal enforcement of this shared morality, society will collapse. Therefore, the "feelings of the man on the Clapham Omnibus" (indignation/disgust) are a valid warrant for criminalization.
  *   **Hart's Rebuttal:** Societies cohere through a **critical morality** of mutual forbearance (rules preventing harm), not shared moral convictions. Diversity of private morality does not threaten social order. The law should only prevent **harm to others**.

  **The Objection:** Hart claims to have drawn a bright line between *harm* (legitimate ground for coercion) and *morality* (illegitimate ground). However, by conceding ground to legal paternalism and the regulation of public offense, Hart blurs this line. He does not eliminate legal moralism; he merely substitutes Devlin's *conservative* moralism for a *liberal* moralism.

  #### II. Argument Point 1: Paternalism as Covert Moralism
  Hart explicitly departs from Mill by suggesting that consent is not always a valid defense against bodily harm (e.g., in cases of dueling, gladiatorial contests, or severe mutilation).

  1.  **The Liberal Inconsistency:** If the individual is sovereign over their own mind and body (the core of Hart's liberalism), consensual harm should be permissible. By prohibiting it, Hart asserts that there is a limit to autonomy that is not defined by the rights of *others*.
  2.  **The Moral Basis of the Limit:** On what ground does Hart restrict consensual harm? It cannot be "harm to others" by definition. It must be a judgment that certain acts are *inherently degrading* or *contrary to human flourishing*, regardless of consent.
  3.  **The Devlin Parallel:** This is a moral judgment about the *good life*, not a neutral calculation of social utility. Devlin argues the law should enforce the moral idea that society is valuable. Hart argues the law should enforce the moral idea that *autonomy has limits defined by well-being*. Both are enforcing a conception of the good. Hart's paternalism admits that the state has an interest in the moral character of choices, not just their external consequences. This validates Devlin's meta-ethical claim: **Law is an appropriate vehicle for enforcing moral truths about human conduct.**

  #### III. Argument Point 2: The Offense Principle and the "Clapham Omnibus"
  Hart concedes that public indecency can be restricted, not necessarily because it causes physical harm, but because it causes offense or shock to unwilling observers.

  1.  **The Definition of Offense:** Hart attempts to distinguish "offense" from "moral disgust." He argues offense must be unavoidable and serious. However, what counts as "unavoidable offense" is culturally contingent.
  2.  **The Reintroduction of Positive Morality:** In practice, the standard for what constitutes "offensive public conduct" is determined by the prevailing **positive morality** of the community. If the majority of society finds public homosexual affection morally disgusting, Hart's framework (which allows restricting public conduct to protect sensibilities) provides the mechanism to ban it.
  3.  **The Collapse into Devlin:** Devlin's test is the intensity of feeling (disgust/indignation) felt by the ordinary person. Hart's test for public indecency is the sensitivity of the ordinary observer. If the "ordinary observer" is steeped in the positive morality Devlin seeks to protect, Hart's "offense" exception becomes a backdoor for Devlin's "disintegration" enforcement. Hart rejects Devlin's *conclusion* (ban private sodomy) but accepts Devlin's *methodology* (use public sentiment to define the boundaries of liberty).

  #### IV. Argument Point 3: The Boundary Problem and Social Cohesion
  Hart argues that society does not need a shared positive morality to remain cohesive; it only needs shared rules of harm avoidance. However, his concessions undermine this empirical claim.

  1.  **The Necessity of Moral Consensus:** To adjudicate *which* paternalistic restrictions apply (e.g., why ban dueling but allow risky sports?) and *which* offenses count (e.g., why ban public sex but not public political protest that angers people?), the legal system must rely on a background consensus of values.
  2.  **The Tacit Moralism:** Hart's system cannot run on the "harm principle" alone; it requires a moral filter to interpret what counts as harm or unreasonable offense. This implies that a shared **critical morality** is insufficient. The legal system inevitably draws upon the **positive morality** of the time to fill in the gaps of the harm principle.
  3.  **Validating the Disintegration Thesis:** If Hart must rely on shared moral intuitions to make his exceptions work, then Devlin is right that law and morality are inextricably linked. If the shared morality shifts (e.g., regarding bodily autonomy or public decency), Hart's "principled" boundaries shift with it. This suggests that social cohesion *does* depend on the alignment of law with prevailing moral sentiments, precisely as Devlin argued.

  #### V. Conclusion: Hart as a Qualified Legal Moralist
  The strongest objection to Hart is not that he is wrong about liberty, but that he is dishonest about the source of his principles.

  *   **Devlin** is an **unqualified legal moralist**: The law should enforce morality because society is a moral community.
  *   **Hart** presents himself as an **anti-legal moralist**: The law should only prevent harm.
  *   **The Reality:** Hart is a **qualified legal moralist**. He believes the law *should* enforce morality, provided it is the *right* morality (liberal, autonomy-respecting, harm-averse).

  By conceding paternalism and offense, Hart admits that harm prevention is not the *only* legitimate ground for coercion. Once that admission is made, the debate shifts from "Should law enforce morality?" (which Hart loses) to "Which morality should law enforce?" (which is Devlin's terrain). Hart defeats Devlin on the specific application (protecting private sexual conduct), but he fails to defeat Devlin on the theoretical justification. Hart's position collapses into the claim that **liberal morality is the true morality worthy of enforcement**, which is a moralist claim, not a neutral liberal one.

  ***

  ### Discussion Questions for the Seminar

  1.  **The Feinberg Defense:** Joel Feinberg later attempted to systematize Hart's intuitions by distinguishing the "Harm Principle" from the "Offense Principle." Does Feinberg successfully shore up Hart's leaks, or does he merely codify the moralism inherent in Hart's concessions?
  2.  **The Nature of Consent:** If Hart bans consensual bodily harm (paternalism) to protect the *value* of autonomy, is he not treating autonomy as a commodity to be protected from the owner, rather than a right of the owner? Does this align more with a natural law tradition than a positivist-liberal one?
  3.  **Devlin's Vindication:** If Hart's exceptions rely on prevailing social sentiments to define "offense," does this mean Devlin was right about the *connection* between law and morality, even if he was wrong about the *specific morals* he wanted to enforce?

  ### Suggested Secondary Reading to Support the Objection
  *   **Patrick Devlin,** *The Enforcement of Morals* (Specifically the chapters on the "disintegration thesis").
  *   **Ronald Dworkin,** "Lord Devlin and the Enforcement of Morals" (To contrast Dworkin's rights-based critique with the moralist critique).
  *   **Jeffrie G. Murphy,** "Legal Moralism and Liberalism" (For arguments on how liberalism inevitably relies on moral perfectionism).
  *   **H.L.A. Hart,** *Law, Liberty, and Morality* (Focus on the lectures regarding paternalism and offense).
