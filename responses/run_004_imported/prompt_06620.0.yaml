  **The Irregular Utilitarian: Teleology and Consistency in Bentham's Sexual Ethics**

  Jeremy Bentham's unpublished manuscripts on sexual morality, particularly the section titled "Offences Against One's Self," present a striking anomaly in the history of liberal thought. Writing in the 1780s, Bentham mounts a rigorous utilitarian defense of consensual same-sex acts, arguing that they produce pleasure, cause no harm to others, and that the societal outrage they provoke is rooted in irrational "antipathy" and the "principle of asceticism." Yet, even as he argues for decriminalization, Bentham persists in labeling these acts "irregularities," defined as departures from the "natural or proper use" of sexual faculties. This creates a philosophical tension: can a thoroughgoing hedonistic utilitarian, who famously dismissed natural rights as "nonsense upon stilts," consistently maintain that a harmless pleasure is nonetheless "irregular" or "unnatural"? While one might argue that Bentham uses "irregular" merely as a statistical descriptor to analyze social prejudice, a closer examination reveals that the language of "proper use" quietly reimports a teleological standard. Consequently, while Bentham's political conclusion is consistent with his utilitarianism, his moral taxonomy is not; the position is ultimately incoherent by his own philosophical lights.

  To understand the stakes of this inconsistency, one must first appreciate the radical nature of Bentham's exculpatory argument. Bentham's utilitarianism rests on the axiom that nature has placed mankind under the governance of two sovereign masters, pain and pleasure. An action is morally neutral or good if it augments the sum of happiness without subtracting from it. In "Offences Against One's Self," Bentham applies this calculus to *paederasty* (his term for male same-sex relations). He observes that the act yields pleasure to the participants. Since the act is consensual, it violates no security, creates no alarm, and diminishes no one else's pleasure. Therefore, the pain associated with the act arises solely from the legal sanctions and social stigma imposed upon it. The "horror" felt by the public is dismissed as "antipathy"—a visceral dislike mistaken for moral reasoning. Bentham compares this to a dislike of certain foods; just as it would be absurd to criminalize eating garlic because others find the smell offensive, it is absurd to punish sexual tastes that offend the majority. On this ground, the argument for decriminalization is perfectly coherent: the state should intervene only to prevent harm, and here, there is none.

  The defense of consistency rests on the interpretation of the word "irregular." Proponents of Bentham's coherence argue that for a nominalist like Bentham, "irregular" cannot carry metaphysical weight. In this view, "irregular" is a purely descriptive, statistical judgment. It signifies only that same-sex acts are a minority practice compared to heterosexual intercourse. Bentham's comparison to food tastes supports this reading: if most people prefer bread to cheese, cheese is "irregular," but not immoral. By adopting the language of irregularity, Bentham may be engaging in a rhetorical strategy, accepting the terminology of his opponents to disarm them. He acknowledges the deviation from the norm to explain the source of the antipathy (fear of the unusual) without validating the norm itself. If "irregular" means simply "uncommon," then a utilitarian can use the term without contradiction. A hedonist can acknowledge that a specific pleasure is rare without conceding that it is bad. In this light, Bentham is merely diagnosing the sociology of prejudice, not prescribing a moral hierarchy of pleasures.

  However, this charitable reading collapses when one examines Bentham's specific invocation of the "natural or proper use of the relevant faculties." This phrasing moves beyond statistics into teleology. To speak of a "proper use" of a biological faculty implies that the faculty has an intrinsic end or purpose independent of the pleasure it produces. In the context of 18th-century thought, the "natural use" of sexual organs was almost universally understood as procreation. If Bentham accepts that the "proper" function is reproductive, he is implicitly endorsing a Natural Law framework—the very framework he dismantles in his critiques of religion and moral sense theory. For Bentham, "ought" cannot be derived from "is." The biological capacity for reproduction cannot generate a moral obligation to reproduce, nor can it render non-reproductive sex "improper" in any sense that matters to a utilitarian.

  If the only moral currency is pleasure, then the "proper" use of a faculty is simply whatever use maximizes happiness for the agent and the community. If a same-sex act produces net pleasure, it is, by definition, a "proper" use of the body in that moment. By retaining the label "irregularity" grounded in "natural use," Bentham creates a secondary category of action: permissible, yet sub-optimal. This introduces a non-utilitarian standard of value. It suggests that there is a "regular" (natural/procreative) pleasure and an "irregular" (unnatural/non-procreative) pleasure, and while both may be permitted, the former retains a normative priority. This is a covert concession to the "principle of asceticism" Bentham claims to reject. The ascetic principle holds that pleasure is suspect; Bentham's "irregularity" label suggests that *some* pleasures are suspect because of their origin or mode, not their consequences. This undermines the foundational hedonistic axiom that pleasure is homogenous in its moral quality, differing only in intensity, duration, certainty, and extent.

  Furthermore, this inconsistency weakens Bentham's attack on antipathy. Bentham argues that antipathy is irrational because it lacks a utilitarian basis. However, by conceding that the acts are "irregularities" of nature, he provides the antipathetic opponent with a foothold. If Bentham admits the acts are "unnatural," the opponent can argue that violating nature *is* a harm, even if no specific human is hurt. Bentham wants to deny that "violating nature" is a harm, yet his terminology suggests there is a "nature" to violate. A consistent utilitarian should argue that "nature" is a fiction in this context; there are only bodies, sensations, and consequences. To grant the category of "irregularity" is to grant that there is a "regularity" that possesses inherent authority. This is not merely a descriptive statistical claim; it is a taxonomic judgment that aligns with the essentialist ethics Bentham sought to overthrow.

  One might counter that Bentham was a pragmatist, and that maintaining the label was necessary to make his radical decriminalization argument palatable to a hostile audience. While historically plausible, this does not resolve the philosophical inconsistency asked of in the prompt. The question is whether Bentham can *hold* the position consistently, not whether it was politically expedient to articulate it that way. If Bentham *believes* the acts are genuinely "irregular" in a way that distinguishes them from "regular" acts beyond mere frequency, he is relying on a teleological metric. If he does not believe it, but writes it, he is being disingenuous. Assuming the manuscripts reflect his genuine philosophical reasoning, he is attempting to synthesize two incompatible frameworks: a consequentialist ethics that judges acts solely by outcomes, and a functionalist anthropology that judges acts by their conformity to biological design.

  Ultimately, the verdict must be that Bentham's position is incoherent by his own lights. The strength of Bentham's utilitarianism lies in its relentless reduction of moral questions to calculations of pain and pleasure. It clears the ground of "fictions" like natural rights, natural law, and moral senses. By describing same-sex acts as "irregularities" based on the "proper use of faculties," Bentham fails to clear his own ground. He leaves standing a totem of natural teleology that his system requires him to topple. If an act harms no one and produces pleasure, it is, for a Benthamite, morally indistinguishable from any other such act. To label it "irregular" is to suggest a defect where utility finds none. This does not necessarily invalidate his political conclusion—that the acts should not be punished—but it does reveal a fracture in his moral theory. He successfully argues that the state should not punish the "irregular," but he fails to explain why a utilitarian should call it that in the first place. In trying to accommodate the language of the natural law tradition he despised, Bentham inadvertently validated its underlying premise: that nature speaks, and we ought to listen. For a philosopher who claimed nature speaks only of pain and pleasure, this was a silence he could not afford to break.
