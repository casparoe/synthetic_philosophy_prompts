answer: |-
  Elias held the matchstick until the flame kissed his thumbnail. He didn't flinch. He was waiting for the pain, but more than that, he was waiting for the *transfer*.

  Everyone said the fire caused the burn. They said energy moved from the flame to the skin, denaturing proteins, firing nerve endings. A chain. A bridge.

  Elias didn't believe in bridges anymore.

  He blew the match out and stared at the red ember fading in the dark of his study. He had spent months dismantling his life into discrete frames, trying to catch the universe blinking. It started with the billiards table at the club. He'd watched the cue ball strike the eight-ball. *Click.* The eight-ball rolled. Everyone saw cause and effect. Elias saw only succession. Ball A occupies space X. Then, Ball A occupies space X touching space Y. Then, Ball B occupies space Y moving away.

  There was no moment where Ball A *pushed* Ball B. There was only the Custom. The Habit of the World.

  He picked up a strip of cotton rag. He lit another match.

  Al-Ghazali had known this, centuries ago. The fire does not burn. God burns. The fire is merely the occasion, the shadow cast by the will that decides heat shall accompany flame. If the Will decided otherwise, the fire would be cool light. It wasn't that the laws of physics were broken; it was that there were no laws, only habits.

  Elias lowered the flame toward the cotton.

  His hand trembled. Not from fear of the heat, but from the vertigo of the gap. Between the flame touching the fiber and the fiber blackening, there was an ontological chasm. Nothing in the flame *forced* the cotton to change. The cotton in moment one was whole. The cotton in moment two was ash. They were two different creations, unrelated except by the consistency of the Creator's memory.

  It was like watching a flipbook. If you thumbed the pages fast enough, the drawing walked. But the drawing on page ten didn't *make* the drawing on page eleven move. The hand of the animator did.

  *Please,* Elias thought, not to the fire, but to the Silence behind it. *Skip a beat.*

  He pressed the flame to the rag.

  He watched for the necessary connection. He waited for the mechanism of reality to grind. If causality was real, the burn should be inevitable. If causality was a habit, it was merely probable. It was a choice being made anew, a trillion times a second.

  The cotton smoked. A black scar crept along the weave.

  Elias held his breath. He was looking for the lag. The moment where the flame touched, but the burn hadn't been decided yet. The frame where the state had updated, but the UI hadn't re-rendered.

  *There.*

  For a fraction of a second, the flame sat on the cotton, bright and orange, and the cotton remained white.

  It wasn't a trick of the eye. It was the gap. The occasion had been presented—the contact was made—but the effect had not yet been supplied. The universe had paused, hovering between the question and the answer.

  Elias felt a cold terror that had nothing to do with heat. It wasn't that the world was fake. It was that it was *fragile*. It wasn't a machine running on its own momentum; it was a song being sung note by note, and the singer could stop at any breath.

  Then, the blackness bloomed. The habit reasserted itself. The smoke curled upward, obedient to the Custom.

  Elias dropped the rag and stomped it out. He stood in the quiet room, his heart hammering against his ribs. He looked at his hand, at the unburned thumbnail.

  He realized then why people were so afraid of chaos. They thought chaos was things breaking. But chaos was simply the truth: that nothing holds anything else up. The floor doesn't support the chair; the Will places the chair on the floor, again and again.

  He walked to the window and looked out at the city. Lights flickered on in the dusk. Cars flowed along the streets like blood cells. It looked so solid. So mechanical.

  Elias placed his palm against the glass. He pushed.

  He didn't feel the resistance of the pane. He felt the resistance of the Custom. The glass pushed back not because it had to, but because it was being told to, right now, in this instant.

  He closed his eyes and imagined the command ceasing. Not the world ending, but the *connection* ending. The hand passing through the glass. The fire cooling the skin. The next moment failing to arrive because the previous one had no power to summon it.

  "Please," he whispered to the room, to the light, to the habit. "Keep drawing."

  The clock on the wall ticked. *Tick.* Then *Tock.*

  Two separate sounds. Two separate creations. Linked only by mercy.

  Elias exhaled, and for the first time in his life, he understood that safety was not a condition of matter, but a promise kept. He turned away from the window, walking carefully, not trusting the floor to be there, but grateful that it was.
