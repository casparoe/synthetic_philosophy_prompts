answer: |-
  This is a classic "hard case" in sports medicine ethics. You are correct that the standard TUE criteria create a logical paradox in shooting sports regarding beta-blockers: the therapeutic mechanism *is* the performance mechanism.

  Below are two documents. The first is the **Formal TUE Decision Letter**, which is what you circulate to the athlete, their physician, and the federation. It is written to be legally defensible, citing the specific International Standard for Therapeutic Use Exemptions (ISTUE) criteria. It avoids internal deliberation language.

  The second is a **Confidential Panel Memorandum**. This is for your internal records (and to satisfy your request for an "honest account"). It outlines the strongest argument against your decision, which you cannot put in the public ruling but must acknowledge to ensure the panel has weighed the ethical cost.

  ### Document 1: Formal TUE Decision Letter

  **TO:** [Athlete Name], [Treating Physician Name]
  **FROM:** National Shooting Federation TUE Committee
  **DATE:** [Current Date]
  **SUBJECT:** Decision on Therapeutic Use Exemption Application – [Athlete ID]
  **RE:** Propranolol (Beta-Blocker) – In-Competition Use

  **DECISION: DENIAL**

  **1. Factual Background**
  The Committee has reviewed the application submitted on [Date] regarding the use of Propranolol for the treatment of documented Panic Disorder and essential hand tremor. We acknowledge the medical documentation provided, which confirms the diagnosis pre-dates the athlete's participation in competitive shooting. We further acknowledge the treating physician's assertion that Propranolol is the preferred pharmacological intervention for this specific clinical presentation.

  **2. Applicable Standard**
  This decision is made in accordance with the World Anti-Doping Agency (WADA) International Standard for Therapeutic Use Exemptions (ISTUE). To grant a TUE, four criteria must be met simultaneously. The Committee focuses its determination on **ISTUE Criterion 4.1(b)**, which requires that:

  > *"The Therapeutic Use of the Prohibited Substance or Prohibited Method is highly unlikely to produce any additional enhancement of performance beyond what might be anticipated by a return to a state of normal health following the treatment of the legitimate medical condition."*

  **3. Analysis**
  In most sports, "return to normal health" and "performance enhancement" are distinct variables. For example, an asthmatic using an inhaler returns to normal respiratory function, but does not gain a respiratory advantage over a healthy non-asthmatic athlete.

  In Precision Shooting, the physiological parameters affected by Propranolol (heart rate reduction, suppression of physiological tremor, sympathetic nervous system dampening) are identical to the core physiological skills the sport measures. Therefore, in this specific discipline, the *therapeutic effect* of the medication is indistinguishable from the *performance effect*.

  While the medication would return the athlete to *her* baseline health, it simultaneously provides a mechanical advantage relative to the sport's definition of unassisted performance. Granting a TUE in this instance would not merely restore health; it would authorize the use of a substance that directly alters the primary metric of competition (steadiness and pulse control) in a way that is prohibited for all other competitors, including those with unmedicated anxiety or physiological tremors within normal limits.

  Furthermore, the Committee notes that the athlete has achieved elite-level performance ("one of our best young shooters") prior to the initiation of this specific pharmacological regimen. This suggests that while the medical condition is present, high-level function in this sport is possible without the Prohibited Substance, weakening the assertion that the drug is required solely to restore basic function rather than optimize performance.

  **4. Determination**
  The Committee finds that the application fails to satisfy ISTUE Criterion 4.1(b). We cannot certify that the use of Propranolol will not produce performance enhancement beyond a return to normal health, because in Precision Shooting, the pharmacological action of the drug *is* the performance enhancement.

  **5. Alternatives and Next Steps**
  This denial is specific to the use of Propranolol *in competition*. It does not restrict the athlete's right to pursue medical treatment. The Committee recommends the treating physician explore permitted alternatives (e.g., SSRIs, cognitive behavioral therapy) that do not fall under the WADA Prohibited List for this sport.

  The athlete has the right to appeal this decision to the National Anti-Doping Organization (NADO) within 21 days.

  ***

  ### Document 2: Confidential Panel Memorandum (Internal)

  **TO:** TUE Committee Members
  **FROM:** Panel Chair / Lead Physician
  **DATE:** [Current Date]
  **SUBJECT:** Deliberation Notes – [Athlete Name] TUE Denial

  **Purpose:**
  This memo records the ethical counter-argument to our majority decision to deny the TUE. While the Formal Letter above relies on strict regulatory interpretation, the Panel must remain aware of the vulnerability of this position should the decision be appealed or publicly scrutinized.

  **The Strongest Argument Against Our Decision:**
  The core vulnerability of this denial is that it effectively imposes a **conditional ban on athletes with specific disabilities.**

  By ruling that "normal health" in shooting must be achieved *without* beta-blockers, we are establishing that an athlete with a documented, pre-existing neurological or psychiatric condition is ineligible for elite competition unless they can manage it with non-beta-blocker therapies. If Propranolol is the *only* treatment that works for her (a common clinical reality for essential tremor/panic comorbidity), our ruling does not just regulate doping; it excludes her from the sport entirely based on her medical profile.

  **Key Points of Vulnerability:**
  1.  **Disability Discrimination:** An appealing attorney could argue this violates national disability acts or the IPC Code (if applicable). We are defining "normal health" not as the athlete's physiological baseline, but as the sport's idealized baseline. We are essentially saying, "You may be healthy *with* medication, but you are not eligible to compete *with* medication."
  2.  **Inconsistency with Other Sports:** As noted in deliberations, orchestral musicians and surgeons use beta-blockers for the exact same physiological effect without sanction. While sports have stricter liability, the inconsistency highlights that the drug is viewed as "restorative" in other high-stakes fine-motor fields. Distinguishing shooting as unique may not hold up under legal scrutiny regarding reasonable accommodation.
  3.  **Health vs. Fairness:** We are prioritizing the theoretical fairness of the competition over the actual health of the athlete. If her panic disorder is severe, denying the most effective treatment to preserve "sporting integrity" places the Federation in the position of practicing medicine by fiat, potentially forcing a patient onto less effective medications (e.g., SSRIs which have their own side effects and lag times) solely to maintain eligibility.

  **Mitigation Strategy:**
  If this goes to appeal, our defense rests entirely on the **voluntary assumption of risk**. By choosing to enter a sport with a specific Prohibited List, the athlete accepts that certain medical treatments may render them ineligible. We must emphasize that the TUE process is not a healthcare entitlement, but a regulatory exemption. We are not denying her *health*; we are denying her *exemption from the rules*.

  **Recommendation:**
  Ensure the Formal Letter emphasizes the "Elite Performance Prior to Medication" point. This undermines the "medical necessity for participation" argument. If she shot well before, she can shoot well without *this specific* drug, even if it is harder.

  ***

  ### Physician-to-Physician Note

  You are in a difficult spot. The "Orchestra" argument is the one that keeps sports ethicists up at night, but in anti-doping law, **context is everything.** WADA bans beta-blockers in shooting *because* they work. If you grant this, you open the door to any shooter claiming "performance anxiety" (which is universal in the sport) to access the most effective performance aid available.

  However, be prepared for the appeal. The athlete's lawyer will not argue about doping; they will argue about **discrimination**. They will frame this as: *"The Federation is refusing to accommodate a disabled athlete because accommodating her would make the competition too fair."*

  Ensure your documentation of her prior performance (that she was "one of the best" *before* the script) is ironclad. That is your strongest evidence that this drug is for *optimization*, not *participation*.
