answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the distinct privilege of being [Mom's Name]'s child, and also, somewhat ironically, a philosophy professor.

  I say ironically because when I told Mom I was giving this toast, she gave me one condition. She said, and I quote, "If you start talking about how 'age is just a number,' I will correct your grammar in front of everyone."

  She vetoed the clichés. Instead, she suggested I look at Cicero's *De Senectute*. Now, for the family members currently wondering if there will be a quiz later: don't worry. Cicero wrote this as a dialogue where the elder statesman Cato defends old age against four specific complaints. Mom has made sure all of us know this text. She taught it for thirty-five years. So, while I'm the philosopher, she is the authority.

  Cicero lists four charges people bring against old age. I want to briefly address how Mom refutes every single one of them, simply by being herself.

  The first charge is that old age withdraws us from active life. Critics say you can't *do* anything anymore. But Cato argues that action doesn't stop; it changes form. Mom retired from the classroom, but tell me she isn't active. She manages this family's history, she grades our emails for comma splices, and she mentors anyone who will listen. She hasn't withdrawn from the work of living; she's just moved from the front of the room to the center of the table.

  The second charge is that the body grows weak. Cicero admits this is true physically, but argues that authority and wisdom do not decay. We might not see her lifting heavy boxes these days, but her will remains ironclad. She raised children, built a career, and maintained a marriage. That requires a strength that has nothing to do with muscle mass. Her voice carries further now than it did when she had to project to the back row of a high school Latin class.

  The third charge is that old age deprives us of pleasure. Cicero argues that while wild, sensual pleasures fade, they are replaced by quieter, richer joys. Now, anyone who knows Mom knows she still enjoys a good meal—and clearly, this cake. But her real joy comes from conversation, from reading, and from seeing her grandchildren grow. She traded the fleeting thrill of the party for the enduring satisfaction of the harvest.

  And finally, the fourth charge: that death is too close. This is the heavy one. But Cicero doesn't dodge it. He argues that death isn't a shipwreck; it's reaching the harbor. He compares a natural death to an apple falling from a tree when it is fully ripe. It isn't a tragedy; it's the completion of a cycle.

  Mom, looking at you tonight, surrounded by former students who still quote you, and a family that loves you deeply, we aren't thinking about the end of the cycle. We are celebrating the ripeness. You have cultivated a life that is full, sweet, and substantial.

  So, I will not tell you that age is just a number. I will tell you that you have answered Cicero's charges better than Cato did.

  Please raise your glasses. To [Mom's Name]: may your activity remain purposeful, your wisdom remain sharp, your pleasures remain sweet, and may you enjoy this harvest season for as long as possible.

  *Ad multos annos.* To many more years.
