      *   **Speaker:** Her child, teaches philosophy (but not ancient philosophy specifically).
      *   **Audience:** 50% Latin teachers/colleagues (will recognize references), 50% family (just want cake, need accessibility).
      *   **Constraint:** Around 4 minutes long (approx. 500-600 words spoken at a moderate pace).
      *   **Key Requirement:** Use Cicero's four-part structure (Activity, Strength, Pleasure, Death) but make it personal and specific to *her*, not just a lecture. Avoid morbidity on the death point.
      *   **Tone:** Warm, witty, respectful, intellectually satisfying but accessible.

  2.  **Deconstruct *De Senectute* (The Four Charges):**
      *   *Charge 1:* Old age withdraws us from active employments (Business/Action).
      *   *Charge 2:* Old age enfeebles the body (Physical Strength).
      *   *Charge 3:* Old age deprives us of physical pleasures (Sensory Joy).
      *   *Charge 4:* Old age is not far from death (Mortality).
      *   *Cato's/Cicero's Rebuttal:*
          1.  Action changes form (mentoring, wisdom).
          2.  Strength isn't needed for everything; mind endures.
          3.  Higher pleasures replace base ones (conversation, nature, learning).
          4.  Death is natural/fulfilling, like fruit ripening.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the elephant in the room (the "age is just a number" veto). Establish the speaker's credentials (philosopher child) and the honoree's expertise (Latin teacher). Set the stage for the *De Senectute* framework without getting too academic.
      *   **Point 1: Activity (Negotium):** Cato says we don't stop working, we change *how*.
          *   *Application:* She retired from teaching, but is she inactive? No. She's grading grandkids' essays, organizing family history, mentoring.
