          *   *Tone:* Respectful of aging but celebrating resilience.
      *   **Point 3: Pleasure (Voluptates):** Cato says sensual pleasure fades, but intellectual joy remains.
          *   *Application:* She loves food/cake (keep it light), but really loves conversation, books, family stories.
          *   *Connection:* The "feast" today is both literal and intellectual.
      *   **Point 4: Death (Mors):** Cato says death is natural, like a ship reaching harbor or fruit falling.
          *   *Application:* This is the tricky one. It's a birthday, not a funeral. Frame it as "legacy" and "continuity." She isn't near the end; she's in the harvest season.
          *   *Reframing:* Instead of "death is close," make it "life is full."
      *   **Conclusion:** Bring it back to the toast. A specific wish for her.

  4.  **Refining and Polishing (Iterative Process):**

      *   *Word Count Check:* A 4-minute speech is roughly 500-600 words. I need to be concise.
