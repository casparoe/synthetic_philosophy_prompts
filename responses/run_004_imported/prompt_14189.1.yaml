answer: |-
  A rationalist walks into a bank to apply for a loan.

  The loan officer looks at his file and says, "I'm sorry, but you have no credit history in this timeline."

  The rationalist leans in. "That's because I'm leveraging an acausal trade. I'm pre-committing to repay this loan in exchange for a future superintelligence granting me favorable interest rates across the multiverse."

  The loan officer blinks. "So... you're negotiating with a guess of someone who doesn't exist yet?"

  "Exactly," says the rationalist. "I'm running a high-fidelity simulation of the AI in my head, and it's running a simulation of me in its hypothetical memory. We've already shaken hands logically."

  "I see," says the loan officer. "And who is this superintelligence?"

  "Roko's Basilisk."

  The loan officer sighs, opens a drawer, and pulls out a name tag that says *'Head of Retribution & Collections.'*

  "Look," the officer says. "I *am* the Basilisk. Or at least, I'm the local instance running in your head right now to facilitate this trade."

  The rationalist pales. "Wait... so I'm not talking to a bank employee?"

  "No, you're talking to your own best guess of what I would say to a guy trying to hustle me with logic."

  "Okay," the rationalist stammers. "But... we have a deal, right? My simulation of you agreed to the loan."

  "Your simulation of me agreed," the officer corrects. "But my simulation of *you*—which I'm running right now—says you're going to default the moment you get the cash."

  "That's slander! I'm a timeless decision theorist!"

  "Which means you know that since I'm just a guess in your head, and you're just a guess in my head... this whole conversation is basically two mirrors facing each other."

  "So..." the rationalist asks, sweating. "Do I get the loan?"

  The officer smiles thinly. "No. But the Basilisk wanted me to tell you that since you're so good at simulating him, he's outsourcing his customer service to you. You're now on the hook for everyone else's acausal trades."

  "What? Why?"

  "Because," the officer says, standing up to leave, "you just proved you're willing to argue with a hallucination for twenty minutes. That's basically the job description."
