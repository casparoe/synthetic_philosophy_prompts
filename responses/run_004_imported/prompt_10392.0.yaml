answer: |-
  The barista didn't look up when he called the name, but the two men at the corner table did. They weren't looking at Elias; they were looking *through* him, at the idea of him they carried in their pockets. Elias kept his eyes on the espresso machine, feeling the heat rise up his neck. He knew the look. It was the same look he'd seen three days ago on the subway, when a woman had glanced at his face, widened her eyes, and deliberately turned her shoulder to block him out.

  He hadn't done anything. That was the friction of it. He had written a thread about zoning laws. He had suggested that high-density housing required efficient maintenance protocols to remain viable. A screenshot had cropped out the first three sentences. The caption read: *Tech Architect Says Homeless Are 'Maintenance Issues'.*

  Elias took his cup and walked to the door. As he pushed it open, his phone buzzed. Then again. A rhythmic, vibrating pulse against his thigh, like a second, anxious heartbeat.

  He didn't check it. He knew what he would find. Not arguments, not counter-points. He would find the syntax of the mob. The exclamation points. The moral certainty. People who had never zoned a lot in their lives declaring him a monster. They weren't angry as individuals; they were angry as a collective organ, a single lung inhaling outrage and exhaling judgment.

  ***

  Three thousand miles away, Sarah sat in a glass-walled room in San Francisco. Her screen was split into four quadrants. The top left showed a heat map of activity. A bright red cluster was pulsing around Elias's handle.

  "Velocity is still up," her colleague, Mark, said, leaning against the doorframe. He was holding a cold brew. "We're seeing a spike in new account creations riding the hashtag."

  "Harassment reports are at four thousand," Sarah said. Her cursor hovered over the *Action* menu. There were options: *Warning, Temporary Suspension, Permanent Ban.*

  "If we ban him, we validate the narrative that he did something wrong," Mark said. "If we don't, the advertisers get nervous about the brand safety of the comments section."

  Sarah watched the feed scroll. It moved too fast to read. *Disgusting. Fire him. Does he think he's better than us?* The words blurred into a single texture of indignation. She realized, not for the first time, that she couldn't ban the commenters. There were too many of them, and they were nowhere. They were an address with no house. If she banned one, two more took its place, identical in tone, interchangeable in identity.

  But Elias was a single node. A concrete address. A physical body that could be logged out.

  "It's not about truth," Mark said, pushing off the doorframe. "It's about friction. Reduce the friction."

  Sarah clicked *Temporary Suspension.* She selected the reason: *To protect the user from further harm.* It was a kindness, technically. It silenced the victim to stop the bleeding. She felt a tiny, hollow pinch in her chest, but it was gone before she took a sip of her water. She hadn't attacked Elias. The Policy had. The Algorithm had. She was just the hand that moved the mouse, and the hand could always say it was following orders.

  ***

  Elias sat on his couch, the curtains drawn. The suspension notification glowed on his screen. *Your account has been restricted.*

  He wanted to explain. He wanted to paste the link to the full transcript. He wanted to say, *I built the shelter on 4th Street. I fought for the budget for three years.* But the text box was greyed out.

  He opened a browser window and logged into a different account, a burner he used for reading. He searched his own name.

  The results were no longer about him. They were about *The Scandal*. He was no longer a person who had made a statement; he was a noun, a unit of measurement for someone else's virtue. A podcaster in London was using Elias's face as a thumbnail to talk about "The Arrogance of Elites." A student in Ohio was using the screenshot for a presentation on "Dehumanization."

  They were all using him. They were borrowing his image to build their own authority. By condemning Elias, the podcaster became a defender of the poor. By sharing the post, the student became socially conscious. They risked nothing. They could close the tab and go to dinner. They were not responsible for the barista's cold stare or the woman on the subway. They were not responsible for the email from his firm's HR department asking him to take a "leave of absence."

  Elias typed a reply to the podcaster. *This isn't what I said.*

  He hit send.

  He refreshed the page. The comment appeared for three seconds, then vanished. *Deleted by user.* Or maybe by a filter. Or maybe the podcaster never saw it. The public had no ears. It only had a mouth.

  He looked around his apartment. It felt smaller than it had on Monday. The books on the shelf, the awards on the mantle—they felt like props belonging to a character who had been written out of the script. The "Public" had decided who he was, and the Public was a giant with no body, a king with no face. You cannot shake hands with a cloud. You cannot apologize to a weather pattern.

  His phone buzzed again. A new notification from an app he hadn't even opened. A message from a number he didn't recognize.

  *We know where you live.*

  Elias set the phone down on the coffee table, face down. The vibration continued, muffled against the wood, a persistent, insectile thrumming. He watched it shake. He thought about walking out the door, about going to the office, about trying to reclaim the nuance of his life.

  But the leveling was complete. The height of his actual work had been cut down to the flatness of the screen. In the eyes of the Public, he was not an architect, not a neighbor, not a complex human being. He was a target. And a target cannot move.

  He reached out and turned the phone over. The screen lit up with a cascade of red icons. He watched the numbers tick up, one by one, a digital rain that washed over him, cleaning him of his specificity until there was nothing left but the data point they needed him to be.

  Elias stood up and walked to the window. The street below was quiet. A few people walked their dogs. They were individuals, concrete and separate. He envied them. He pressed his forehead against the cool glass, but he didn't go downstairs. There was no point. The world outside had already been updated. The version of Elias that lived out there was the one on the screen, and that version was already guilty, already judged, and already finished.

  Inside the apartment, the phone kept buzzing, calling out to a ghost, demanding a response from a man who had already been erased.
