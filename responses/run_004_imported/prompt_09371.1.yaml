prompt: |-
  Okay so this whole topic became weirdly personal for me over the last couple months: I do some part-time contract work for a startup building a "companion" chatbot app, and a few weeks back our CEO forwarded around that Nature piece about the adversarial collaboration between global workspace theory and integrated information theory, plus that whole 2023 saga where over a hundred consciousness researchers signed a letter basically calling IIT pseudoscience -- forwarded it, I think, to reassure everyone that "don't worry, none of this stuff is conscious." That sent me down a rabbit hole and now I can't stop thinking about it, partly because some of our actual product decisions kind of hinge on an answer that apparently nobody has.

  Separately, I co-run a small tech/philosophy podcast, and I just booked next month's guest: a theoretical neuroscientist, not Tononi or Koch but very much in that camp, who has built her whole career defending IIT and is extremely good at sounding reasonable while doing it. I don't want 40 minutes of her re-explaining phi and the postulates to us. Can you draft me 8 to 10 interview questions that actually press on the sore spots? I want at least one question each on: the exclusion postulate and why it's fine that only a single maximally-irreducible complex gets to "count" as conscious instead of this being a vagueness/cutoff problem; the unfolding argument and whether it means IIT is unfalsifiable in principle and not just with current tech; the Scott Aaronson-style reductio where you can build a dumb linear or expander-graph system with phi way higher than any brain; and what the theory actually implies about whether something like our own chatbot could be conscious, given it's basically feedforward at inference time. For each one, give me a short note on the deflection shes most likely to reach for, plus a follow-up question that doesn't just let her retreat to "that's a hard case, not a counterexample." And if you can, end the list with a question that ties back to the pseudoscience letter -- something that makes her actually commit to a result that would change her mind, rather than gesturing at future science.
