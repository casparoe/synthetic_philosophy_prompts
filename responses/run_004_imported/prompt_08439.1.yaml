          1.  $P(\top) = 1$ (Tautologies have prob 1).
          2.  If $\phi \leftrightarrow \psi$, then $P(\phi) = P(\psi)$.
      *   **The Conflict:** Real agents (humans or computers) *don't* assign 1 to all tautologies (they might not recognize them) and *don't* assign equal probability to logically equivalent statements (if they haven't computed the equivalence).
      *   **Conclusion:** Standard Bayesianism *does* inherit a version of LO. It's called "Logical Omniscience in Probability."

  3.  **Evaluate the "Practical vs. Theoretical" Aspect:**
