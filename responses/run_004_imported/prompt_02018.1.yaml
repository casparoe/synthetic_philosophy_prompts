answer: |-
  You have put your finger on one of the most persistent, live, and genuinely difficult debates in modern moral philosophy. You are not missing a "solution" that exists somewhere in a textbook; you are describing a structural tension that professional ethicists have been wrestling with for over two centuries.

  The discomfort you feel is shared by some of the sharpest minds in the field. The specific problem you are describing—whether moral motivation should stem from abstract principle (duty) or concrete attachment (care/love)—is often framed as the conflict between **Deontology** (specifically the Kantian tradition) and the **Ethics of Care** (or Sentimentalism).

  Here is the landscape of that disagreement, why the obvious compromise fails, and where the debate stands today.

  ### 1. The Strongest Case for Duty (The Kantian View)

  You are correct that your intuition traces back to Kant. In the *Groundwork of the Metaphysics of Morals*, Kant makes the provocative claim that an action has "moral worth" only if done from duty, not from inclination (feelings, sympathy, love).

  It is easy to dismiss this as cold, but the strongest version of this argument is not that feelings are *bad*, but that they are **unreliable** and **self-referential**.

  *   **Reliability:** Feelings fluctuate. If your sister helps the homeless only when she feels sympathetic, what happens on the days she is depressed, tired, or finds a particular client ungrateful? Duty provides a stable floor. It ensures the moral law is followed even when the heart is not in it.
  *   **Self-Reference:** Kant argues that when you help someone because you "like" them or because their suffering makes *you* uncomfortable, you are arguably still acting to satisfy your own emotional needs. You are soothing your own conscience. Acting from duty is the only way to truly respect the other person as an end in themselves, rather than as an object of your own sentimental gratification.

  **The Philosophical Payoff:** This view protects morality from bias. If we only help those we "care" about, we might neglect the unlovable, the distant, or the enemy. Duty demands we treat the stranger with the same respect as the friend.

  ### 2. The Strongest Case for Care (The Sentimentalist/Care View)

  The opposing view, which aligns with your sister's intuition, has roots in David Hume but has been revitalized in the last 50 years by feminist philosophers like **Carol Gilligan** and **Nel Noddings**, and earlier by critics like **Bernard Williams**.

  Their argument is not that rules are useless, but that rules are **blind**.

  *   **The "Coldness" Objection:** If a husband comforts his distressed wife by saying, "I am doing this because it is my marital duty," something has gone wrong. It suggests he is not *with* her; he is observing her and applying a rule. This creates a distance that undermines the very relationship morality is supposed to sustain.
  *   **Moral Perception:** Proponents of Care argue that "duty" is often too abstract to tell you what to do. "Do no harm" doesn't tell you how to navigate a complex situation with a homeless person who might need tough love rather than a handout. Only deep attentiveness and care for the *particular* person can reveal the right action.
  *   **Motivation:** As your sister noted, care is self-sustaining. Duty requires willpower; care provides energy. A morality based solely on duty is exhausting and prone to burnout or resentment.

  **The Philosophical Payoff:** This view preserves the human element. It argues that morality is rooted in our interdependence, not our rationality. It explains why we feel it is *right* to prioritize our children over strangers, something strict duty struggles to justify.

  ### 3. Why "Just Do Both" Does Not Work

  You asked why we cannot simply say, "One should act from duty *and* care." This is the most critical part of your inquiry. Philosophers have tried this, and it runs into what is known as the **Problem of Overmotivation** or **Moral Schizophrenia**.

  In 1976, the philosopher **Michael Stocker** wrote a famous paper titled *"The Schizophrenia of Modern Ethical Theories."* He used an example almost identical to yours: visiting a friend in the hospital.

  If you visit your friend, and they ask "Why are you here?", and you say "Because it is my duty," they feel slighted. But Stocker argues the problem goes deeper. If you visit *because* you care, but you constantly monitor that care to ensure it aligns with duty, you are no longer fully present in the friendship. You are split.

  **The Structural Conflict:**
  1.  **If Duty is Primary:** Then care is optional. If I do the right thing because it is right, my feelings are irrelevant. This leads to the "clinical" virtue you disliked.
  2.  **If Care is Primary:** Then duty is redundant. If I truly care, I don't *need* the concept of duty to motivate me. Bringing duty in suggests I don't trust my care.
  3.  **The Corruption of Motive:** There is a phenomenon where introducing the language of duty can *corrode* the language of care. If a parent starts thinking of raising their child as a "moral obligation" rather than a labor of love, the relationship changes. The "ought" crowds out the "want."

  So, "doing both" often results in a fractured psyche where one part of you is calculating the right thing, and the other part is feeling the loving thing, and they are not speaking to each other.

  ### 4. Attempts at Synthesis (And Why They Remain Unsettled)

  Has anyone solved this? There are attempts, but none have achieved consensus.

  **A. The Aristotelian Solution (Virtue Ethics)**
  Aristotle argued that the truly virtuous person *does* the right thing, *knows* it is the right thing, and *desires* to do it. For Aristotle, duty and desire should eventually merge. Through habituation, you train yourself to love what is good.
  *   *The Critique:* This works for the "saint," but what about the rest of us? When I *don't* feel like doing the right thing, Aristotle offers less clarity than Kant. Also, it risks making morality elitist (only the well-trained can be truly good).

  **B. The "Two-Stage" Kantianism (Barbara Herman)**
  Some modern Kantians, like Barbara Herman, argue that duty sets the **limits**, but inclination provides the **content**.
  *   *The Argument:* Duty tells me "Do not lie" and "Help others." It does not tell me *which* charities to support or *which* friends to call. Inclination is allowed to choose the specific objects of our care, provided they stay within the boundaries of duty.
  *   *The Critique:* This helps, but it doesn't solve the phenomenological problem. Your sister doesn't feel like she is operating within boundaries; she feels like the care *is* the morality. The "boundary" model still feels external to the relationship.

  **C. The "Moral Saints" Objection (Susan Wolf)**
  In her famous essay *"Moral Saints,"* Susan Wolf argues that a life dominated entirely by moral duty (even if combined with care) is undesirable. We want people to have hobbies, passions, and quirks that are not morally motivated.
  *   *The Implication:* This suggests your sister's view is actually healthier for a human life. If she viewed her volunteering as a "duty," she might be a better "moral saint," but she might also be less of a whole person. However, this sidesteps the question of what makes the act *morally worthy*, focusing instead on what makes a life *good*.

  ### 5. The Verdict: Is it Solved?

  To answer your question directly: **No, it is not solved.**

  The tension you feel is not a bug in your understanding; it is a feature of the moral landscape. It reflects a genuine conflict in human psychology between our nature as **rational agents** (who can step back and judge actions objectively) and **emotional animals** (who are embedded in specific relationships).

  *   **Kant** prioritizes the Rational Agent. He secures the universality of morality but risks alienating us from our emotions.
  *   **Care Ethicists** prioritize the Emotional Animal. They secure the humanity of morality but risk losing the ability to critique our own biases (e.g., "I care about my tribe, so I will hurt yours").

  **Where does that leave you?**
  Many contemporary philosophers now accept a form of **Pluralism**. They admit that we have different "moral languages."
  *   In the public sphere (law, human rights, distribution of resources), the language of **Duty/Justice** is indispensable. We don't want judges distributing sentences based on who they "care" about.
  *   In the private sphere (family, friendship, charity), the language of **Care** is indispensable. We don't want spouses relating via contract and obligation.

  The discomfort you feel arises when these spheres bleed into each other. Your sister is operating in the private/relational sphere, where Care is the superior currency. Your reading of Kant applies most strictly to the public/universal sphere, where Duty is the superior currency.

  However, this "spheres" solution is also imperfect. What about the homeless people your sister helps? They are strangers (public sphere), yet she relates to them with intimacy (private sphere). She is bridging the gap that philosophy struggles to close.

  **Conclusion**
  You are right to resist the tidy answer. The "Coldness" of Kant and the "Fickleness" of Care are both real dangers.
  *   If you follow Kant strictly, you risk becoming a "moral monster" who follows rules while ignoring suffering.
  *   If you follow Care strictly, you risk becoming a "nepotist" who helps friends while ignoring justice.

  The fact that you cannot easily reconcile them suggests that being a moral human being requires holding this tension without resolving it. It requires the wisdom to know when to step back and ask "Is this right?" (Duty) and when to step in and ask "Do I care?" (Love).

  Philosophy has not given us an algorithm to decide when to switch modes. That, perhaps, is the burden of the moral life itself. Your sister has found a way to live in the "Care" mode that yields good results; your Kantian reading warns you of the risks of that mode. Both are telling you part of the truth.
