      *   **The Debate:**
          *   Friend 1: Hypocrisy invalidates the criticism (Jordan loses the *right* to be upset).
          *   Friend 2: The action is wrong regardless of the speaker (Hypocrisy doesn't change the *truth* of the criticism).
