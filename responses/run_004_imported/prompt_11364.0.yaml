      *   *Logical Validity:* Does the truth of the claim ("missing sessions without notice is bad") depend on the speaker's behavior? No. $2+2=4$ even if a liar says it.
      *   *Moral Authority/Standing:* Does the speaker have the *standing* to blame? This is where it gets nuanced. Blaming someone often implies a moral high ground or a shared commitment to norms.
