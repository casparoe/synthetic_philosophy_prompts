prompt: |-
  I'm the family rep on the ethics committee at my mom's memory-care facility (no medical background -- they just wanted somebody from the families on it). Management wants to bring in an AI system that watches residents' behavior all day, what they flinch from, what they reach for, how they react to different staff, and builds a "preference profile" that caregivers are supposed to follow, even when it overrides the written care plan the resident set up years ago while still lucid. Half the committee says residents are calmer now that the AI has "figured out" what they actually want; the other half says you can't tell a real preference from plain confusion or fear in someone with dementia just by watching them, and that the lucid version of my mom who signed that plan should still get the final say over the version of her walking around now. We vote next week -- approve the pilot, approve with limits, or reject it -- and i have to write the memo. I want an actual recommendation, not a "let's study it more" dodge, and i want whichever side we don't go with to get a fair, serious case made for it, not just a brush-off.
