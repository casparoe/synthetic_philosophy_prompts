  Good evening, everyone. For those who don't know me, I'm Sarah's older brother. I work in HVAC. I spend most of my life crawling through crawlspaces and yelling at furnaces that refuse to kick on. So, I'm used to talking about systems, airflow, and structural integrity. Usually, though, I'm talking to machines. Machines are easier. They only make noise when something's actually wrong.

  Standing here, looking at my sister and David, I've been thinking about what makes a marriage hold together. People often talk about love like it's a feeling that never changes. But anyone who's been married more than five years knows that feelings, like weather, change all the time. Sometimes it's sunny, sometimes there's a storm, and sometimes the system just needs a reset.

  If you try to doubt everything all at once, you can't build anything. In my line of work, if I stopped to test every single bolt and bracket every single morning before I turned a unit on, I'd never get the job done. You have to trust that some things are solid, so you can focus on making the rest of the system work. You have to decide where the weight rests, and you have to agree that you aren't going to keep checking that spot every time the wind blows.

  Sarah and David know this better than most. They haven't rushed this. They've taken the long road. There were times they stepped back, times they let the silence sit for a while, and times they tested the ground to see if it would hold. They didn't just assume the structure was sound; they walked away to see if the house still stood without them. And the reason we are all here today is that they came back. They didn't come back because they proved that doubt was impossible. They came back because they decided, together, where to fix the pin that lets the door swing. They agreed on what stays still, so that everything else—the arguments, the bad days, the uncertainties—can move without breaking the frame.

  To the rest of you, that might just sound like a long engagement. To those of us who have watched them from the beginning, it looks like something stronger. It looks like a choice. They aren't promising that they will never have a question again. They are promising that they know which questions matter, and which ones they can let go of so they can walk through the door together.

  So, if everyone could please stand and raise a glass.

  To Sarah and David: May you always know where your weight rests. May you trust the mount you've built. And may you never be afraid to let the door swing, knowing exactly what holds it in place.

  To the bride and groom.
