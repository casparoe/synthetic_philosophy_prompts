  ### Office Hours "Cheat Sheet" for You
  If the student comes in to argue the Interest Rate section, here is the specific textual evidence you can rely on so you don't have to bluff:

  *   **The Student's Claim:** More Money (Specie) → Lower Interest Rates.
  *   **Hume's Actual Claim:** More Commerce/Industry → More Savings → Lower Interest Rates. (Money supply is irrelevant to the *rate*).
  *   **The Spain Example:** Mercantilists argued Spain should have had the lowest interest rates because they had the most gold. Hume pointed out Spain had *high* interest rates because they didn't have a developed manufacturing base to generate savings.
  *   **Key Quote Concept:** Hume distinguishes between "money" (the metal used to count value) and "stock" (the actual goods and capital available to lend). Interest is the price of borrowing *stock*, not *money*.

  This is a strong answer from a student who clearly read the texts, but they conflated Hume's view on *prices* (determined by money) with his view on *interest* (determined by real economy). Docking those 10 points is defensible and academically honest.
