      *   **Keynes's Definition of Purposiveness:** "More concerned with the remote future results of our actions than with their own quality or their immediate effects." It's about deferring gratification.
      *   **Keynes's Critique:** It's a "spurious and delusive immortality." We push jam into tomorrow forever. We don't love the cat, only the kittens' kittens.
      *   **The Anecdote:** The Professor convinces the Tailor to double the debt rather than collect it *now*. The punchline: The Professor admits he will *never* pay. The Tailor dies waiting.
