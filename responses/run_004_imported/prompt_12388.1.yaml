answer: |-
  This is an exceptionally sharp reading of the text. You have identified the central tension in Keynes's moral philosophy within this essay: **How can he praise the economic results of "purposiveness" (capital accumulation) while simultaneously mocking the psychological disposition that created it?**

  The short answer is that Keynes is not undercutting his economic history; he is distinguishing between purposiveness as a **historical means** and purposiveness as a **human end**. The *Sylvie and Bruno* anecdote is not there to deny that saving built the modern world, but to illustrate why that habit must be discarded now that the building is finished.

  Here is a breakdown of how the anecdote functions to support, rather than undermine, his argument.

  ### 1. The Distinction Between Means and End
  Your confusion stems from the idea that if Keynes mocks the tailor, he mocks the engine of growth. But Keynes views "purposiveness" as a temporary historical tool, not a permanent virtue.

  *   **The Historical Necessity:** Keynes admits earlier in the essay that humanity has been in a "tunnel." To escape the "night of scarcity," we needed the "purposive" drive to compound capital. In this phase, the Tailor's willingness to wait was functionally useful. It allowed capital to accumulate.
  *   **The Psychological Cost:** However, Keynes argues that this was a miserable state of affairs. We pretended to love the future more than the present. We treated life as a means to an end (future wealth) rather than an end in itself.
  *   **The Anecdote's Role:** The story dramatizes the **logical endpoint** of purposiveness if it is never switched off. The Professor (representing the logic of compound interest/capital accumulation) tricks the Tailor (the saver/purposive man) into realizing that if "waiting" is always more valuable than "having," one never actually *has*.

  The joke is not that the money didn't accumulate (it doubled, just as capital did); the joke is that the accumulation became a trap where consumption was infinitely deferred until death. Keynes is saying: *We used this trick to get rich, but if we keep using it now that we are rich, we are the Tailor.*

  ### 2. The Critique of "Immortality"
  You noted Keynes's phrase about "spurious and delusive immortality." The anecdote is the narrative proof of this claim.

  Keynes argues that the purposive man tries to extend his influence into the future to give his life meaning.
  *   **In the essay:** He pushes "jam to-morrow" forward forever.
  *   **In the anecdote:** The Tailor pushes the payment forward forever.

  The Professor's punchline ("He'll go on doubling it till he dies") reveals the delusion. The Tailor thinks he is securing a greater future reward, but he is actually securing a greater *abstraction*. He dies with a claim on £4,000 (or £8,000, etc.) but never enjoys a penny of it.

  This supports Keynes's optimism about the *economic* outcome (the money did grow) but reinforces his pessimism about the *human* outcome (the man never lived). This is consistent with his broader claim: we have solved the economic problem, but we have not yet solved the problem of how to live.

  ### 3. The "Transitional Period" Problem
  Keynes is writing in 1930, which he views as the beginning of the "transitional period." We have enough capital to solve scarcity, but our habits haven't caught up.

  If you read the anecdote as a satire of *all* saving, you are right to feel a contradiction. But read it as a satire of **saving without a horizon of consumption**, it becomes a warning.
  *   **Then (1750–1930):** Deferral was necessary. The Tailor had to wait to build the machine.
  *   **Now (1930–2030):** Deferral is obsolete. The machine is built. If the Tailor keeps waiting, he is being foolish.

  Keynes is worried that his contemporaries (and grandchildren) will remain like the Tailor: conditioned to defer enjoyment even when there is no material reason to do so. The anecdote highlights the absurdity of continuing the "tunnel behavior" once you have emerged into the light.

  ### 4. Why this doesn't undermine his optimism
  You asked if this passage works against his optimism about how we got here. It does not, because Keynes is a moralist as much as an economist in this essay.

  He acknowledges that the "purposive" drive was the engine of progress, but he views it as a **neurosis induced by scarcity**. He writes elsewhere in the essay that qualities like greed and usury "will be recognised for what they are—possession-morbidities, pathological propensities which disgust us."

  The *Sylvie and Bruno* story is the illustration of that "pathological propensity."
  *   **Consistency:** It is consistent to say, "Greed built this hospital, but greed is a sickness."
  *   **The Goal:** The goal of the essay is to persuade the reader that we must unlearn the Tailor's lesson. We must learn to eat the jam *today*.

  ### Summary
  The anecdote is not satirizing the *fact* of accumulation, but the *psychology* of infinite deferral. Keynes is arguing that for centuries, we were all the Tailor, and it was necessary. But now, if we continue to be the Tailor, we are being played for fools by the Professor (the abstract logic of capital).

  The passage is consistent because Keynes is making a **normative** claim about how we *should* live, not just a **positive** claim about how we *did* get rich. He is warning that the very habit that saved us (purposiveness) will ruin us if we do not discard it now that the job is done. The Tailor is the cautionary tale for the grandchildren: Do not let the habit of survival prevent the practice of living.
