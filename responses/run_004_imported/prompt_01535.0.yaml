          *   **Viability:** It's a chapter, not a whole thesis. It needs to engage with recent work (e.g., Gaskin, King, Hanks) on propositional unity. Don't ignore the Fregean friend entirely; use deflationism to save Fregean unsaturatedness from mystery.

