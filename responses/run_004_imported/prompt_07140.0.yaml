answer: |-
  **MEMORANDUM**

  **TO:** Judge Elena Rosetti, Chair, Historical Convictions Review Board
  **FROM:** Dr. Alex Varrin, Public Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Order Language and Collateral Consequences

  **I. Purpose**

  At the request of the Chair, this memo addresses the deadlock regarding the standard language for Relief Orders issued by this Board. As you know, the Board is divided between two framings: (1) declaring the underlying "crime against nature" statute *void ab initio* (invalid from enactment), or (2) issuing orders of *pardon and expungement* based on contemporary standards of mercy.

  This choice is not merely rhetorical. Under State Administrative Code § 14.09, an order declaring a conviction "void ab initio" triggers the automatic nullification of collateral consequences (sex-offender registry, professional licensing bars, military discharge characterizations). An order of "pardon and expungement" requires petitioners to re-litigate these consequences individually before separate agencies.

  Given my background in legal philosophy, I have been asked to clarify the theoretical stakes. However, my goal here is practical: to recommend a path that secures full relief for petitioners without compromising the Rule of Law or setting a dangerous precedent.

  **II. The Competing Positions**

  **A. The "Injustice" Argument (Void Ab Initio)**
  Proponents of this framing rely on the principle that extreme injustice forfeits legal validity. This view echoes the post-WWII *Radbruch Formula* and the reasoning in cases like *In re Göring*, where courts held that statutes contravening fundamental human rights were never truly "law."

  *   **Strengths:** It offers moral vindication. It acknowledges that the petitioners did not merely break a law that was later changed; they were victims of a regime that criminalized their humanity. It aligns with the intuition that a law targeting private, consensual conduct based solely on animus lacks the essential qualities of law.
  *   **Outcome:** It triggers Administrative Code § 14.09(a), automatically stripping all collateral consequences.

  **B. The "Rule of Law" Argument (Pardon and Expungement)**
  Proponents of this framing rely on a positivist understanding of law: law is a social fact, established by enactment and enforcement, distinct from its moral merit. As H.L.A. Hart argued in his debate with Lon Fuller, calling unjust rules "not law" creates confusion. The statute in question *was* law: it was enacted by a legislature, enforced by police, and upheld by courts for decades.

  *   **Strengths:** It preserves historical accuracy and legal certainty. It avoids the claim that generations of judges were "wrong" about the law's validity at the time. Crucially, it mitigates the precedent risk: if we claim the power to declare past statutes "never law" based on moral judgment, we open the door for future bodies to declare *any* duly enacted statute (e.g., tax laws, environmental regulations) "void" because they deem it unjust.
  *   **Outcome:** It triggers Administrative Code § 14.09(b), requiring petitioners to separately petition agencies to remove collateral consequences.

  **III. Analysis and Recommendation**

  Both factions are correct on their primary concerns. Faction A is right that petitioners deserve full restoration, not just mercy. Faction B is right that declaring a historically valid statute "never law" is philosophically unstable and legally risky.

  However, this is a false dichotomy. We can achieve the *legal effect* of "Void Ab Initio" without adopting the *philosophical premise* that the old statute was inherently invalid at the time.

  **Recommendation:** The Board should adopt the **"Void Ab Initio"** framing, but the *authority* cited in the Order must be the **new repealing legislation**, not a moral judgment of the past.

  **Reasoning:**
  We are not acting as a court of appeal reviewing the 1950s statute's constitutionality (which would validate Faction B's fear of judicial overreach). We are an administrative board created by a *new* Act of the Legislature. That new Act represents the current Sovereign's command.

  If the new Legislature has the power to pardon, it also has the power to legislate retroactively regarding the *status* of past convictions. By stating that convictions are "Void Ab Initio *pursuant to the authority of [New Act Name]*," we are not claiming the old law was morally bankrupt (though we may believe it was). We are claiming that the *new* law dictates the current legal reality: for all purposes of the State, these convictions are treated as if they never existed.

  This satisfies Faction A: The magic words "Void Ab Initio" are used, triggering automatic nullification of collateral consequences under Admin Code § 14.09(a).
  This satisfies Faction B: We are not undermining the Rule of Law by retroactively judging the validity of past enacted law based on moral criteria. We are applying a new, validly enacted statute that happens to have retroactive effect. This does not set a precedent for future boards to nullify laws they "dislike"; it sets a precedent that Legislatures may grant retroactive relief for specific repealed statutes.

  **IV. Collateral Consequences**

  **Specific Answer:** The Order **must** read "Void Ab Initio."

  If we use "Pardon and Expungement," we abandon petitioners to a second round of litigation against licensing boards and the Department of Corrections. Many petitioners are elderly or deceased; their families lack the resources to re-litigate these issues. A pardon implies guilt that is forgiven; a voiding implies the legal error is erased. Given the Legislature's clear intent in repealing the statute and creating this Board was restorative justice, the "Pardon" framing frustrates legislative intent.

  By grounding the "Void" language in the *new* statute's authority rather than the *old* statute's immorality, we insulate the Order from legal challenge while securing the automatic nullification of registry entries and license revocations.

  **V. Proposed Order Language**

  I recommend the Board vote to adopt the following standard clause for all Relief Orders:

  > "IT IS ORDERED that the conviction of [Petitioner] under [Old Statute Citation] is declared **VOID AB INITIO**. This Order is issued pursuant to the authority granted by [New Repealing Act, Section X], which mandates that convictions for conduct no longer criminalized under State law be treated as having no legal force or effect from the date of their original entry. Consequently, all collateral consequences arising from said conviction, including but not limited to registry requirements and professional licensing restrictions, are hereby nullified."

  **VI. Conclusion**

  This approach allows us to honor the petitioners without distorting legal history. It accepts the Positivist truth (the old law was enacted) while utilizing the Positivist mechanism (new legislative command) to achieve the Natural Law result (justice). I move that we adopt this language for the upcoming session.

  Respectfully submitted,

  Dr. Alex Varrin
  Public Member, Historical Convictions Review Board
