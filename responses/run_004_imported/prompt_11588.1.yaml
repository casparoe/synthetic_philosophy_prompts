prompt: |-
  Two months ago my father was declared dead by neurological criteria after a brain hemorrhage, and the hours our family spent waiting through his apnea test -- followed, the next day, by a transplant coordinator explaining why a different patient down the hall was instead being evaluated for circulatory death -- left me unsettled by how much genuine disagreement sits underneath language I had always assumed was medically settled. I coordinate the monthly bioethics grand-rounds series at the hospital where I work, and I've decided to devote next month's session to this debate. Our invited speaker is a bioethicist who has spent her career defending the whole-brain standard as tracking a real biological fact -- the irreversible loss of the organism's own integrating, self-sustaining functions -- rather than a convenient legal fiction. Draft eight interview questions for her that push past a restatement of that position. I want at least one question on how the integrating-functions rationale survives Shewmon's documented cases of prolonged somatic survival, including continued growth and gestation, after a whole-brain-death diagnosis; one on whether her insistence on irreversibility for brain death is compatible with donation-after-circulatory-death protocols, which declare death on permanence rather than strict irreversibility after only a few minutes of asystole; one on the argument, associated with Truog and Miller, that transplant ethics should abandon the dead donor rule entirely rather than keep stretching the definition of death to accommodate it; and one on the recent, unresolved fight over requiring explicit family consent before apnea testing. For each question, add a follow-up keyed to the answer she is most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user's father was declared dead by neurological criteria (brain death) two months ago. The family experienced the apnea test wait and observed inconsistencies (another patient evaluated for circulatory death). This personal experience drives a desire to explore the underlying disagreements in the definition of death.
      *   **Role:** The user coordinates bioethics grand rounds at a hospital.
      *   **Task:** Draft eight interview questions for an invited bioethicist speaker.
      *   **Speaker's Stance:** Defends the whole-brain standard as tracking a *real biological fact* (irreversible loss of integrating, self-sustaining functions), not a legal fiction.
      *   **Constraints:**
          *   Push past restatement of her position.
          *   Must include specific topics:
              1.  Shewmon's cases (somatic survival/gestation after brain death).
              2.  Irreversibility (brain death) vs. Permanence (DCD protocols).
              3.  Truog/Miller argument (abandon Dead Donor Rule vs. stretching death definition).
              4.  Family consent for apnea testing.
          *   Format: 8 questions total.
          *   Addition: Each question needs a follow-up keyed to the *most likely answer* she would give (based on her stated defense of the whole-brain standard).

  2.  **Deconstruct the Speaker's Position:**
      *   She believes brain death = biological death.
      *   Key rationale: Loss of organismal integration (the brain is the central integrator).
      *   She likely views challenges (Shewmon, DCD inconsistencies) as misunderstandings of physiology or category errors, rather than fatal flaws in the theory.
      *   She likely supports the Dead Donor Rule (DDR) as morally necessary.
      *   She likely views apnea testing as a medical determination, not necessarily requiring consent (though this is shifting).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Shewmon/Somatic Survival.*
          *   *Draft 1:* How do you explain Shewmon's patients who grew and gestated after brain death?
          *   *Critique:* Too simple. She will say "spinal integration" or "external support." Need to push on *organismal* integration.
          *   *Refinement:* Focus on the claim that the brain is the *sole* integrator. If the body integrates without it (growth, puberty, gestation), is the "integrator" claim falsified?
          *   *Follow-up:* She will likely distinguish between *homeostatic* integration (brain) and *cellular* growth (hormones). Push on whether that distinction holds water clinically.

      *   *Topic 2: Irreversibility vs. Permanence (DCD).*
          *   *Draft 1:* Why is brain death irreversible but DCD is only permanent?
          *   *Critique:* A bit dry. Needs to highlight the inconsistency.
          *   *Refinement:* DCD declares death after 5 minutes of no pulse (permanence, not irreversibility). Brain death requires strict irreversibility. How do you justify two different ontological thresholds for the same state (being dead)?
          *   *Follow-up:* She will likely argue DCD is a *prediction* of irreversibility. Push on the moral weight of that prediction vs. the certainty required for brain death.

      *   *Topic 3: Truog/Miller (Dead Donor Rule).*
          *   *Draft 1:* What do you think about Truog and Miller saying we should drop the Dead Donor Rule?
          *   *Critique:* Too open. She will reject it immediately.
          *   *Refinement:* If the definition of death is constantly stretched to fit donation needs (as Truog argues), isn't honesty better? Why is preserving the DDR worth potentially obfuscating the biological reality?
          *   *Follow-up:* She will argue DDR protects the vulnerable. Push on whether the *current* definition obfuscates more than abandoning it would.

      *   *Topic 4: Apnea Test Consent.*
          *   *Draft 1:* Should families consent to apnea tests?
          *   *Critique:* Yes/No question.
          *   *Refinement:* Given the trauma of the wait (user's experience), does the medical determination of death require procedural consent like a surgery? If it's a *fact*, why is consent needed? If it's a *policy*, why isn't it?
          *   *Follow-up:* She will likely say it's a diagnostic test, not treatment. Push on the risk/benefit profile (risk of cardiac arrest during test) vs. diagnostic certainty.

      *   *Topics 5-8 (Need to fill the remaining 4 slots while maintaining depth).*
          *   *Idea 5: The "Legal Fiction" accusation.* She denies it's a fiction. How does she address the variability in guidelines (AAN vs. others)?
          *   *Idea 6: Public Trust.* The user felt unsettled. How does this debate affect public trust in donation?
          *   *Idea 7: The "Integrator" definition.* Is the hypothalamus required? (Some brain dead patients have hypothalamic function).
          *   *Idea 8: Cultural/Religious Accommodation.* If it's a biological fact, why do we allow religious exemptions (like NJ)?

      *   *Selecting and Refining 5-8:*
          *   *Q5 (Variability):* Focus on the lack of uniformity in testing protocols. If it's a biological fact, why does the method of verification vary so much by institution?
          *   *Q6 (Hypothalamus):* Specific biological challenge. Many "brain dead" patients maintain water balance/temp regulation (hypothalamus). Does this undermine the "whole brain" claim?
          *   *Q7 (Public Trust/Transparency):* Connect to the user's experience. Does defending the current standard risk damaging trust if families see inconsistencies (like the DCD patient down the hall)?
          *   *Q8 (Religious Exemptions):* If it's biological, conscience objections shouldn't matter (like refusing blood transfusions for a child). Why do we accommodate them?

  4.  **Review against Constraints:**
      *   8 questions? Yes.
      *   Specific topics covered (Shewmon, DCD/Irreversibility, Truog/Miller, Apnea Consent)? Yes.
      *   Follow-ups included? Yes.
