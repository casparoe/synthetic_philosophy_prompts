      *   *Section 1: The Model vs. The Map.* The model is a map of past territory. This is new territory. The map isn't "wrong," it's just blank here.
      *   *Section 2: The Nature of Policy.* Policy isn't physics. It's law. Law requires interpretation. The "truth" is created by the ruling, not discovered.
