  2.  **Evaluate the Game Theory Concepts:**
      *   **Pure Strategy Dominance:** Strategy $X$ dominates $Y$ if $Payoff(X) \ge Payoff(Y)$ for all opponent strategies, with strict inequality for at least one.
      *   **Mixed Strategy Dominance:** Strategy $Y$ is dominated if there exists a probability distribution $\sigma$ over other strategies such that $E[Payoff(\sigma)] > Payoff(Y)$ for all opponent strategies.
      *   **One-Shot vs. Repeated:** This is the crux of the user's confusion.
