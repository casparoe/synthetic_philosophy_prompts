answer: |-
  Based on the argumentative structure of Chapter IV of *A Treatise on Probability*, John Maynard Keynes would almost certainly judge E. T. Jaynes's proposal as a sophisticated **relocation of arbitrariness rather than its removal**. While Keynes would acknowledge that Jaynes successfully generates a unique numerical answer, he would argue that Jaynes achieves this only by smuggling in an additional premise—the Principle of Transformation Invariance—which is no more logically forced by the original evidence than the choice of parameterization Keynes critiqued. For Keynes, the defect in the Principle of Indifference regarding continuous magnitudes is not merely a lack of uniqueness, but a lack of *logical warrant* for any specific measure; Jaynes supplies a rule for selecting a measure, but he cannot supply the logical evidence required to validate that rule as the *only* rational response to the original hypothesis.

  To defend this verdict, we must look closely at three pillars of Keynes's reasoning in Chapter IV: his diagnosis of the "limit" problem, his conception of probability as a logical relation dependent on specific evidence, and his distinction between ignorance and equiprobability.

  ### 1. The Diagnosis: The Ambiguity of the Limit
  Keynes's central critique in Chapter IV is that continuous quantities are not given directly to the understanding but are conceived as limits of discrete processes. When we are told to choose a chord "at random," we are instructed to treat the chord as the limit of a finite selection process. However, as Keynes notes, the instruction fails to specify *which* finite process is to be limited.

  Keynes writes that the different solutions correspond to treating the chord as the limit of "a triangle," "a thin parallelogram," or "a central section." His objection is not simply that these yield different numbers, but that **nothing in the evidence** ("choose a chord at random") privileges one shrinking area over another. For Keynes, a probability judgment $a/h$ (the probability of $a$ given evidence $h$) is only valid if $h$ contains sufficient grounds to establish a logical relation between the alternatives. In the case of continuous magnitudes, the "alternatives" are the infinitesimal elements of the measure. If the evidence $h$ does not specify how these elements are to be constituted (i.e., which parameterization represents the "indivisible" alternatives), the logical relation is indeterminate.

  Jaynes attempts to fix this by asserting that the physical symmetries of the problem (rotation, translation, dilation) dictate the measure. He argues that because the problem does not specify a location, orientation, or size, the distribution must be invariant under these transformations.

  From Keynes's perspective, this does not solve the limit problem; it merely selects one limit by fiat. The demand for invariance under dilation, for instance, assumes that the "size" of the circle is a variable about which we are ignorant. But the original problem posits *a* circle. For Keynes, the radius is a fixed constant of the hypothesis, even if its value is unknown. To assume scale invariance is to change the hypothesis from "a chord in this circle" to "a chord in a circle of unknown radius." Keynes would argue that Jaynes has not derived the measure from the original evidence $h$; he has replaced $h$ with $h'$, where $h'$ includes the additional assumption that the problem is scale-invariant. Since the original instruction "choose a chord at random" does not logically entail scale invariance, the choice to impose it is just as arbitrary as the choice to fix an endpoint.

  ### 2. Probability as Logical Relation vs. Methodological Rule
  Keynes's philosophy of probability is strictly logicist. Probability is not a property of the physical world or a method for managing ignorance; it is an objective logical relation between propositions. Consequently, the Principle of Indifference is not a rule for assigning numbers when we are ignorant; it is a rule for recognizing when the evidence establishes a relation of equiprobability.

  Jaynes, conversely, treats the Principle of Indifference (via Maximum Entropy or Invariance) as a methodological rule for representing a state of ignorance. He argues that if we have no reason to prefer one location over another, we *must* assign equal probability density.

  Keynes would reject this move as a category error. In Chapter IV, he explicitly warns against the idea that "equal ignorance" implies "equal probability." He argues that the absence of evidence for a preference is not positive evidence of equality. For Keynes, to apply the Principle of Indifference, we need positive grounds to believe the alternatives are symmetric *in the relevant respect*.

  When Jaynes invokes the transformation group, he is effectively arguing: "We have no evidence that the chord prefers one position, therefore the distribution must be invariant." Keynes would reply: "You have no evidence that the chord prefers one position, therefore you have no grounds for assigning *any* numerical probability." By converting the *absence* of evidence (ignorance of position) into *positive* evidence (invariance of the measure), Jaynes violates Keynes's strict requirement for evidential warrant. The transformation group is a methodological tool for generating a distribution, not a logical truth derived from the premises. Therefore, the arbitrariness of choosing the group is not removed; it is simply hidden behind the veil of "objective" symmetry.

  ### 3. The "Indivisible" Alternatives
  Finally, Keynes insists that for the Principle of Indifference to hold, the alternatives must be capable of being resolved into "indivisible" units that are evidentially symmetric. In the continuous case, this requires a principled way to define the "atoms" of the probability space.

  Jaynes claims his invariance principle identifies the correct "atoms" (the measure $d\rho$). However, Keynes would point out that this measure is still continuous. Jaynes has not found the "indivisible" alternatives Keynes demands; he has merely found a *smooth* way to divide the continuum. Keynes's worry is that any division of a continuum is conventional. Jaynes argues that the division is forced by the group structure. But Keynes would ask: What evidence warrants the claim that the *group structure* is the relevant ontology for the probability relation?

  If the problem is viewed as a purely logical one (as Keynes views it), the group structure is external to the propositions. If the problem is viewed as a physical one (as Jaynes views it), we require empirical evidence about the throwing mechanism. Jaynes tries to have it both ways: he uses physical symmetries to solve a logical underdetermination without empirical data on the mechanism. Keynes would argue this is the definition of arbitrariness. We are assuming the physical mechanism respects the symmetries without evidence that it does. A human throwing a straw at a circle might have a bias toward the center (Keynes's second construction) or toward the edge. Without empirical evidence of the throwing process, assuming the distribution *must* be invariant is an assumption about the causal structure of the universe, not a logical deduction from the problem statement.

  ### Verdict
  Keynes would conclude that Jaynes has not vindicated the Principle of Indifference but has instead replaced it with a **Principle of Invariance** that suffers from the same defect. The choice to privilege the transformation group of the Euclidean plane over other possible mathematical structures is not forced by the evidence "choose a chord at random." It is a choice motivated by a desire for uniqueness and physical intuition, which Keynes explicitly rejects as substitutes for logical evidence.

  For Keynes, the silence of the evidence in Bertrand's Paradox is not a puzzle to be solved by a clever symmetry argument; it is a signal that the probability relation is **non-numerical** or indeterminate. Jaynes forces a number where Keynes sees none. Therefore, Jaynes has not supplied the "principled, evidence-based way" Keynes sought; he has supplied a principled, *rule-based* way that bypasses the evidential constraints Keynes considered fatal. The arbitrariness remains because the justification for the rule (that symmetry implies probability) is not contained in the logic of the original hypothesis. Keynes would judge that Jaynes has constructed a well-posed *physical* problem, but he has not solved the *logical* problem of indifference that Chapter IV was designed to expose.
