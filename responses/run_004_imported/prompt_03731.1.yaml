      *   *Keynes's "Limit" Argument:* Keynes says the trouble is we don't know which "shrinking area" to use. Jaynes says the group invariance tells us which measure (and thus which limit) is consistent with our state of knowledge.
      *   *The Fatal Flaw (from Keynes's view):* Keynes would argue that the assumption of invariance under *scale* (dilation), for instance, is not given in the problem statement. A circle has a fixed radius. Why assume scale invariance? Jaynes argues the problem doesn't specify the radius, so we must be invariant. Keynes would say: The problem specifies *a* circle. The radius is fixed (even if unknown). Assuming scale invariance is an assumption about the *distribution of radii* across possible worlds, not about the chord in *this* circle. This imports external assumptions.
      *   *Conclusion:* Keynes would judge that Jaynes has relocated the arbitrariness. The choice of the transformation group is an additional assumption not warranted by the original evidence.

  5.  **Drafting the Argument:**
