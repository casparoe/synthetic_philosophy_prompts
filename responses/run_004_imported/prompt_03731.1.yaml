      *   *Option B (Relocation):* Keynes would argue that choosing the *group* is just as arbitrary as choosing the parameterization. Why assume invariance under dilation? Why assume the "physical procedure" is the right object? Keynes views probability as a logical relation between propositions, not a property of physical generating mechanisms (though he acknowledges practical application).
      *   *Keynes's Specific Objection to "Physical" Assumptions:* Keynes is wary of smuggling in existential assumptions. Jaynes appeals to a "physical procedure." Keynes asks: What is the evidence for *that* procedure?
      *   *The "Indivisible" Criterion:* Keynes wants alternatives that are logically atomic or evidentially symmetric. Jaynes uses group invariance to define the measure. Does this satisfy Keynes's demand for non-arbitrariness?
      *   *Crucial Point:* Keynes argues that without specific evidence about the *cause* or *method*, we cannot assign probabilities. Jaynes says the *lack* of specific evidence (ignorance) + symmetry *is* the evidence.
      *   *Keynes's Likely Rebuttal:* Keynes would likely see the choice of the transformation group as an additional assumption not contained in the original premise "choose a chord at random." The original premise is logically compatible with multiple groups. Selecting one requires extra-evidential commitment.
      *   *However:* Keynes does allow for "relevant evidence." If the symmetry is part of the logical description of the state of knowledge, maybe it counts?
      *   *Deep Dive into Keynes's Text:* Keynes stresses that the Principle of Indifference requires that there be no *known* reason to prefer one alternative over another. But he also insists that the alternatives must be "indivisible" or capable of being resolved into such. In continuous cases, the "division" is the problem.
      *   *Jaynes's Move:* Jaynes claims the division is fixed by the group invariance.
