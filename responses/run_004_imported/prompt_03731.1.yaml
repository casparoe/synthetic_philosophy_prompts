      *   *The Verdict:* Keynes would likely reject Jaynes's solution as *relocating* the arbitrariness. The choice of the group (translation, rotation, scale) is not forced by the logic of the proposition "a chord is chosen at random." It is forced by an appeal to physical intuition or methodological preference (Maximum Entropy/Invariance) which Keynes does not accept as a substitute for logical evidence. Keynes requires the evidence to determine the measure. Jaynes uses the *absence* of evidence (symmetry) to determine the measure. For Keynes, absence of evidence usually means *no* probability judgment is possible (or the probability relation is non-numerical/indeterminate), not that a specific symmetry group must be invoked.

