  *Wait, one more check on the Fuller argument:* Fuller's specific point in the 1958 exchange was that you cannot even identify the "core" of a rule (like "vehicle") without reference to the rule's purpose. A toy car? A hearse? A tank? The word "vehicle" doesn't carry the answer; the *reason for the rule* does. Julian must try to isolate the linguistic uncertainty. Elena must show the uncertainty is purposive, not just linguistic.

  *Concessions:*
  Julian: Admits that "plain meaning" is often a disguise for purposive choice. (Costs him the certainty of the core).
