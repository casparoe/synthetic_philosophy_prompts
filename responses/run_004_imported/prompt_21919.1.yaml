answer: |-
  **Setting:** *A city park on a crisp autumn afternoon. In the center of the lawn, a decommissioned armored personnel carrier sits atop a concrete plinth, its turrets painted gold. A wrought-iron sign nearby reads: "NO VEHICLES IN THE PARK." **Julian** (a legal positivist) and **Elena** (a natural law theorist) stand before the tank, coffee in hand.*

  **Julian:** It's a striking monument, I'll grant you. But legally, it's a mess. Look at that ordinance. "No vehicles." That is the rule. Now, if a teenager drives a Ford onto this grass, he's fined. That is the core of the rule. The language is clear, the facts are clear. But this? A tank on a plinth, engine removed, serving as a memorial? That falls into the penumbra. The word "vehicle" has an open texture. It runs out of meaning here.

  **Elena:** So the judge has discretion?

  **Julian:** Precisely. In the penumbral cases, the law is indeterminate. The judge must exercise a limited legislative power to decide. But—and this is crucial—this discretion doesn't collapse the separation of law and morals. The judge isn't discovering a moral truth about tanks; she is making a choice to extend the rule or not. The validity of the ordinance doesn't depend on whether banning the tank is *good*; it depends on whether it was enacted by the sovereign. The moral dilemma is a result of linguistic limitation, not a flaw in the concept of law itself.

  **Elena:** You're treating the "core" as if it's self-evident, Julian. You say the Ford is clearly a vehicle. But why? Is it because of the wheels? The engine? If the rule's purpose is to prevent noise, a silent electric car might be outside the core. If the purpose is to prevent danger to pedestrians, a fast bicycle is inside the core. You can't identify the "core" cases without first asking what the rule is *for*.

  **Julian:** Purpose is a matter of legislative intent. That's a social fact, not a moral evaluation.

  **Elena:** Is it? To determine intent, you have to construct a reasonable purpose. You have to ask, "What would a rational legislature seek to achieve here?" That requires evaluative reasoning. If you banish morality to the penumbra, you're assuming the core is morally neutral. It isn't. By deciding the Ford is in the core, you've already decided that safety or quietude matters more than the driver's convenience. You haven't cordoned off evaluation; you've just hidden it in the definition of "vehicle."

  **Julian:** But if we do as you suggest, if every application of a rule requires a fresh inquiry into its moral purpose, we lose the rule's function. The point of a rule is to settle coordination problems without requiring everyone to agree on the *good* every time they act. If the park ranger has to conduct a moral inquiry to decide if a bicycle is a vehicle, the rule fails to guide conduct. I'd rather admit the judge has discretion in the hard cases than pretend the text dissolves into pure purpose.

  **Elena:** I'm not saying the text dissolves. I'm saying the text is a tool for achieving a purpose. If you treat the ordinance as a blind command—"No things with wheels"—you might uphold the law but defeat the law's function. That's what I call a failure of the "internal morality of law." A system that ignores the congruence between the rule and its purpose ceases to be a system of law and becomes a system of orders. If the judge allows the tank because it serves the park's civic function, she isn't exercising discretion *against* the law; she is interpreting the law *faithfully*.

  **Julian:** Faithfully to what? To a ghost of "purpose" that isn't written down? Look, I'll concede this: The distinction between core and penumbra isn't as sharp as I sometimes imply. The "plain meaning" of a word often relies on tacit assumptions about context. I can admit that identifying the Ford as a vehicle involves a background understanding of the park's ordinary use. That weakens the idea that language alone does all the work.

  **Elena:** That's a significant admission. It suggests the "separability" of law and social context is thinner than positivism claims.

  **Julian:** It doesn't mean morality determines validity, though. It just means language is contextual. But you must concede something too. If purpose is king, what stops a judge from deciding that *any* vehicle should be allowed because, say, "freedom of movement" is a higher moral good? If the text ("No Vehicles") can be overridden whenever the judge's view of purpose diverges from the text, you destroy legal certainty. You need the text to constrain the purpose, even if the text doesn't explain itself.

  **Elena:** *She pauses, looking at the tank's golden turret.* You're right. Fidelity to law requires that the citizen can read the rule and rely on it. If I tell the public "No Vehicles" but allow cars because I think the purpose is only to ban trucks, I've failed the requirement of publicity. I have to concede that the text imposes a constraint on purposive interpretation. A judge cannot simply ignore the words because they dislike the moral outcome. The "internal morality" requires me to respect the form of the rule, even when the substance is debatable.

  **Julian:** So, we agree that the text constrains you, and that context constrains me. But look at the result. In this case, the judge will likely allow the tank. I say she does so because the law ran out, and she used discretion to make a new policy. You say she does so because the true law *required* it to honor the veterans.

  **Elena:** And which view vindicates the park?

  **Julian:** Mine. Because it acknowledges the tragedy of the choice. The ordinance *is* violated. We are choosing to overlook it for a moral reason. Positivism keeps that honesty intact. We know we are bending the rule.

  **Elena:** No. Yours vindicates the power of the state. Mine vindicates the legitimacy of the community. If the law cannot accommodate the memorial without being "bent," then the law was too brittle to begin with. By interpreting the ordinance in light of its civic purpose, I show that the law *includes* the memorial. I don't bend the rule; I complete it.

  **Julian:** *He finishes his coffee.* Then we are left with the tank. I see a rule that has reached its limit. You see a rule that has found its meaning.

  **Elena:** And the veterans on the bench over there? They don't care about our distinction. They just care that the tank stays.

  **Julian:** Which proves my point. The law is what keeps the tank there, regardless of why we think it's justified.

  **Elena:** Or it proves mine. The law is only what *should* keep the tank there. If it shouldn't, it won't.

  *They stand in silence for a moment, watching a child climb onto the tank's tread. The sign remains unread.*
