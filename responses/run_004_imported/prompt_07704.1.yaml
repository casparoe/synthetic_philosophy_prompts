  2.  **Deconstruct Nozick's Position (ASU, 1974):**
      *   *Side Constraints:* Individuals have rights that function as "side constraints" on the actions of others. You cannot violate them even for the greater good. This is based on the Kantian idea of treating persons as ends-in-themselves.
      *   *The Basis of Rights:* What gives humans these rights? Nozick is famously vague but points to characteristics like rationality, free will, moral agency, and the capacity to shape one's life according to an overall conception of the good.
      *   *The Animal Footnote:* In *Anarchy, State, and Utopia* (pp. 39-42, roughly), Nozick discusses animals. He acknowledges utilitarianism seems plausible for animals (minimize suffering, maximize pleasure) but Kantianism (rights/side constraints) for humans.
      *   *The "Line" Problem:* He admits drawing a line is difficult. He asks: "Are there any beings other than humans who fall under the principle?" He suggests that if there are, they too have rights.
      *   *Utilitarianism for Animals:* He tentatively accepts that we can eat animals *if* the pleasure outweighs the pain, but he expresses skepticism about whether current human gustatory pleasure is enough to justify the suffering of factory farming. He leans towards vegetarianism personally but doesn't ground it in *rights* for animals.
      *   *Instability:* Nozick himself later expressed dissatisfaction with *ASU*. In *The Examined Life* (1989), he moved away from the rigid libertarianism of *ASU*. But for the novel's context (presumably set around the time of *ASU* or featuring that specific intellectual persona), we need to stick to the 1974 framework while acknowledging its tensions.

