      *   *Nozick's Criteria:* Nozick cares about the capacity to be a "value-shaping" being. Can the octopus shape its life? Not in the abstract moral sense, but in a purposive sense.
      *   *The "Marginal Cases" Argument:* Nozick is aware that some humans (infants, severely cognitively disabled) lack full rationality but still have rights. He usually handles this via "species membership" or potentiality, which is philosophically weak but practically held.
      *   *The "Utilitarian Calculus":* Even if animals don't have rights, their suffering counts. Nozick was skeptical that *taste* justifies *pain*. An octopus farm implies significant confinement and suffering for a creature known to suffer greatly in captivity.
      *   *The "Instability":* If intelligence is the metric for rights, and octopuses are smarter than pigs (who Nozick might have implicitly lumped with "animals"), does the line shift? Yes. If the line is "capacity for a conception of the good," octopuses fail. If the line is "sentience + agency," they might pass.

  4.  **Drafting the Argument for the Character:**
