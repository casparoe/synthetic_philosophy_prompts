answer: |-
  Here is a structured, rigorous argument for your side of the debate. It is designed to be philosophically precise while remaining accessible enough to use in a serious discussion. It focuses on the distinction between **ontology** (what exists) and **normativity** (how to act), and it specifically targets your friend's claim that existence is binary and amplitude is irrelevant to anticipation.

  ***

  ### The Core Thesis
  Your friend's argument relies on a category error. They are conflating the **ontological fact of survival** (there exists a branch where I live) with the **normative weight of survival** (how much I should care about that branch when making decisions *now*).

  Quantum Suicide (QS) only works if you assume **Naive Branch Counting** (all branches are created equal). However, standard Everettian decision theory (championed by David Wallace, Hilary Greaves, and others) demonstrates that rational agents in an MWI universe must weight their "caring measure" by squared amplitude (the Born Rule). Once you adopt the correct decision-theoretic framework, QS collapses: playing Quantum Russian Roulette is just as irrational as playing Classical Russian Roulette.

  Here is the argument broken down into three movements.

  ---

  ### 1. The Equivalence Principle: Classical vs. Quantum Branching
  The first step is to show that your friend's intuition leads to absurdity in classical cases, implying it must be wrong in quantum ones.

  In a decoherence-based MWI, *every* quantum event causes branching. But macroscopic objects are constantly interacting with the environment. A classical coin flip is actually a quantum event amplified to a macroscopic scale. The air molecules, the neural states of the observers, and the coin itself all decohere into "Heads" and "Tails" branches.

  *   **Friend's View:** If I bet on Heads, and the universe splits into a Heads-branch and a Tails-branch, I exist in both. Therefore, I should be indifferent to the bet, or perhaps confident I will win, because "a future me" wins.
  *   **The Problem:** If this logic holds, **probability vanishes entirely.** You should be willing to bet at any odds on any event, because there is always a branch where you win. You would bet your life savings on a 1-in-a-billion lottery ticket because "there will be a future you who is rich."

  Since we agree that classical probability guides rational action even if the underlying physics is deterministic (or MWI), we need a quantum equivalent. That equivalent is not *counting* branches, but weighting them by **measure** (amplitude squared). If you reject amplitude weighting for quantum cases, you must reject it for classical cases too, rendering decision theory impossible.

  ### 2. The Decision-Theoretic Derivation (Wallace-Greaves)
  This is the heavy lifter. In MWI, there is no objective "chance" (the universe is deterministic). So what does "probability" mean? It refers to the **rational degree of care** a pre-branch agent should have for their post-branch successors.

  David Wallace has proven (via the **Born Rule Theorem**) that if an agent satisfies certain consistency axioms (like *Diachronic Consistency*—meaning your present self and future selves agree on rational plans), they *must* act as if they maximize expected utility weighted by the Born Rule.

  *   **The Setup:** You are pre-split. You care about your future successors.
  *   **The Constraint:** You cannot favor one successor over another arbitrarily. You must respect the physical structure of the wavefunction.
  *   **The Result:** The "weight" of a branch is not 1 (existence) or 0 (non-existence). It is $|\psi|^2$.
  *   **The Implication:** If you play Quantum Russian Roulette with a 99% death amplitude, you are effectively destroying 99% of your future "measure." Even though 1% of you survives, the rational pre-split agent views this as a catastrophic loss of expected utility, identical to a 99% risk of death in a single-world scenario.

  **The Punchline:** "Probability" in MWI isn't about *whether* you exist in the future (you always do, in some branch). It's about *how much* of your future existence is allocated to good outcomes vs. bad outcomes. QS ignores the "how much."

  ### 3. Rebutting the "Existence is Binary" Objection
  This addresses your friend's specific comeback: *"Credence/anticipation shouldn't be weighted by amplitude... since after the split there straightforwardly is a future you who survived, period."*

  This sounds intuitive, but it is question-begging. It assumes a specific theory of **Personal Identity** that MWI does not support.

  #### A. The Fission Analogy
  Imagine a "Star Trek" teleporter malfunction. It doesn't kill you; it creates two copies. One copy steps out into paradise; the other steps out into a torture chamber.
  *   **Friend's Logic:** "I shouldn't worry. There will be a me who steps into paradise. That's all that matters for *my* anticipation."
  *   **The Flaw:** From the perspective of the pre-fission you, **you are the ancestor of both.** To say "I only anticipate the paradise one" is to arbitrarily disown the torture victim, even though they are just as much "you" as the happy one.
  *   **Application to QS:** In Quantum Suicide, the "death" branch isn't empty. It contains a corpse, grieving friends, and a truncated future. The "life" branch contains a survivor. If you weight by amplitude, you acknowledge that the "death" outcome dominates the wavefunction. To say "I only care about the survivor" is to say "I only care about the branch where I get what I want," which is magical thinking, not physics.

  #### B. The "View from Now" vs. "View from Nowhere"
  Your friend is conflating the **post-hoc perspective** with the **pre-game perspective**.
  *   **Post-hoc (Inside the branch):** Yes, if you pull the trigger 100 times and survive, you will subjectively feel immortal. You will only ever experience the branches where you survived. This is trivially true.
  *   **Pre-game (Decision time):** Before you pull the trigger, you are not in the survival branch yet. You are the common ancestor. If you adopt your friend's logic, you must agree to play *any* game with non-zero survival amplitude, regardless of the odds.
  *   **The Blow:** If your friend says, "But I'll *feel* fine," they are right, but it's irrelevant. A dead person doesn't feel anything. The tragedy of death isn't the *experience* of being dead (there is none); it's the **absence of future experience**. In MWI, high-amplitude death branches represent the absence of the vast majority of your future measure. Ignoring that is not "immortality"; it's **measure suicide**.

  #### C. The "Caring Measure" Knockout
  Here is the cleanest way to pin down the question-begging nature of their claim.

  Ask your friend: **"Why should anticipation track existence rather than measure?"**

  *   If they say "Because existence is what matters," ask: "If I have two future selves, one with \$1,000,000 and one with \$0, do I value that future the same as if both had \$1,000,000?"
      *   If they say **Yes**, they are irrational (they are indifferent to doubling their money across the multiverse).
      *   If they say **No**, they admit that *quantity* of payoff matters.
  *   In MWI, Amplitude *is* the quantity. It is the "amount of reality" assigned to a branch.
  *   To say "Amplitude doesn't matter for anticipation" is to say "The amount of reality doesn't matter for how much I care about reality." That is incoherent.

  ### Summary for the Debate
  You can close with this distinction:

  1.  **Quantum Immortality is an observational selection effect, not a survival strategy.** It is true that *if* you survive, you will observe that you survived. But that offers no comfort *before* the trigger pull, just as knowing "someone wins the lottery" offers no comfort to a ticket buyer who knows the odds are 1 in a billion.
  2.  **Your friend is smuggling in Branch Counting.** They assume that because there are two outcomes (Live/Die), they count as 50/50 for anticipation. But MWI physics says they count as $|\psi_{live}|^2$ vs $|\psi_{die}|^2$.
  3.  **The Normative Conclusion:** A rational Everettian agent maximizes the **Born-Weighted Utility** of their successors. Since death has negative utility, and the death branch usually has high amplitude in Russian Roulette scenarios, the rational choice is **not to play.**

  **The One-Liner:**
  "Quantum Suicide only works if you think being 'real' is a binary on/off switch. But in Everettian QM, reality is a dimmer switch (amplitude). Turning your future down to 0.0000001% brightness isn't immortality; it's just a very dim future."
