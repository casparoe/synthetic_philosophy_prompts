answer: |-
  **Setting:** *A university coffee shop, late evening. The tables are mostly cleared. Two philosophers of science, ELENA and MARCUS, sit amidst scattered napkins covered in equations and citations. They've been at this for an hour.*

  **ELENA:** Look, I get the Pessimistic Meta-Induction (PMI). It's the skeptic's hammer. But you're treating "theory" like a monolithic block. You say, "The ether was false, therefore our current ontology is likely false." But that's not what the history actually shows if you look at the Fresnel case closely.

  **MARCUS:** I am looking at it closely. That's the problem.

  **ELENA:** No, you're looking at the ontology. You're fixated on the *stuff*. Fresnel thought light was vibrations in a mechanical ether. That was wrong. Maxwell came along, kicked out the ether, and said it's self-propagating electromagnetic fields. Ontologically, that's a revolution. But mathematically? Fresnel's equations for reflection and refraction didn't go in the trash. They were *subsumed*.

  **MARCUS:** They were reinterpreted. There's a difference.

  **ELENA:** It's a structural preservation. John Worrall's whole point with Epistemic Structural Realism is exactly this. We shouldn't believe in the *nature* of the entities—the "furniture," as you called it—but we should believe in the *relations* captured by the math. The structure of the wave propagation was real, even if the medium was a fantasy. If the math survives theory change, that's truth-tracking. It's not a miracle; it's continuity.

  **MARCUS:** But continuity for whom? You're doing this from the vantage point of 2024. You know Maxwell won. If I'm a physicist in 1840, I don't know which part of Fresnel's theory is the "enduring structure" and which part is the "disposable ontology." To Fresnel, the elasticity of the ether *was* the structure. It wasn't just decorative furniture; it was the load-bearing wall. Maxwell tore that wall down.

  **ELENA:** He tore down the *mechanical* explanation of the wall, not the wall itself. The wave equation remained. That's the distinction. We can distinguish between the *phenomenological structure*—how the variables relate—and the *causal mechanism* proposed to explain them. Realism retreats to the former.

  **MARCUS:** That's a nice retreat, Elena, but it's a fortress built on hindsight. You're saying, "Believe the bits that survived." But in real time, we can't identify those bits. Let's stress-test this. Take Caloric theory. Late 18th century. Heat is a fluid, it flows from hot to cold, it's conserved. Carnot's work on heat engines was built on Caloric. It was wildly successful. It predicted efficiency limits that we still use.

  **ELENA:** And Fourier's heat equation survived.

  **MARCUS:** Did it? Fourier's math describes diffusion. But the *structural constraint* of Caloric theory was conservation of heat. That was the core structural posit. Clausius and Kelvin come along with thermodynamics and say, "No, heat isn't conserved. It's convertible to work." The structural constraint itself was false. The math was patched, but the underlying structural principle—that heat is a substance quantity—was junk. So if I'm a Caloric realist in 1820, and I say, "I believe in the structure, not the fluid," I still get burned. Because the structure said *conservation*, and nature said *conversion*.

  **ELENA:** That's fair, but look at the limit case. Thermodynamics didn't erase Fourier; it contextualized it. The heat equation works within specific boundaries. Structural Realism doesn't claim our current theories are Final Truth. It claims they are *approximately* true regarding the structure. Dark Matter might not be "matter" in the way we think. It might be a modification of gravity, like MOND. But if MOND wins, the *structural relations* describing galaxy rotation curves that Dark Matter currently models will likely be preserved in the new math.

  **MARCUS:** "Likely." That's the leap. You're relying on the No Miracles Argument. You say it would be a miracle if the math worked this well without tracking truth. I say it would be a miracle if, in the long run, our limited human cognitive categories managed to latch onto the actual structure of the universe without distortion.

  **ELENA:** But the PMI assumes all false theories are equal. They aren't. Phlogiston theory didn't leave much behind. But Fresnel? The quantitative precision was insane. The coefficient of reflection was correct to decimal places. You're asking me to believe that getting the numbers that right is just luck?

  **MARCUS:** I'm not saying it's luck. I'm saying it's underdetermination. Multiple structures can fit the same data. Remember the Vortex Atom? Kelvin's theory that atoms were knots in the ether. It explained stability, it explained spectra, it had beautiful topology. It was mathematically rich. It was completely wrong. If a Vortex Atom realist had used your argument, they'd say, "The topological structure is real, even if the ether isn't." But the topology was wrong too.

  **ELENA:** But Vortex Atoms didn't have the predictive longevity of Maxwell's equations.

  **MARCUS:** How long is long enough? Newtonian gravity lasted two hundred years. It predicted Neptune. It was the gold standard of structural realism. Then Einstein comes along and says, "There is no force." Gravity isn't a relation of attraction; it's the curvature of spacetime. The inverse-square law is an approximation of a geodesic. That's not preserving structure; that's redefining the geometry of the stage itself. If Newtonian spacetime structure was "real," General Relativity killed it. If it wasn't real, then your "structure" is just as ephemeral as your "ontology."

  **ELENA:** Okay, but GR reduces to Newton in the limit. The structure is nested.

  **MARCUS:** Nested within a completely different conceptual framework. Here's my worry, and it's the one your friend couldn't answer: You're using Structural Realism to save Realism from the PMI. But you've diluted Realism so much I'm not sure it means anything anymore. If I say, "I believe the equations work, but I make no claim about whether the fields exist, or the spacetime exists, or the particles exist, only that the relations hold..." what am I committing to?

  **ELENA:** You're committing to the fact that the world has a mind-independent structure that our math is latching onto.

  **MARCUS:** But if the "structure" is just the set of equations that currently predict data, that's instrumentalism with extra steps. If the "structure" is something deeper that *generates* the equations, how do you access it without making ontological claims? You can't have the causal power without the cause.

  **ELENA:** I can have the causal *relations*. Look, let's go back to Fresnel. He derived his equations assuming the ether was an elastic solid. To get transverse waves, he had to assume the ether was incompressible but had rigidity. That's physically absurd. Maxwell drops the rigidity. He keeps the wave equation. The *relation* between electric and magnetic fields is the reality. The *medium* was the heuristic. My claim is that science progresses by shedding the heuristic and keeping the relational core.

  **MARCUS:** And my claim is that you only know which part is the core *after* the revolution. In 1860, a physicist looking at Fresnel vs. Weber had no epistemic warrant to say, "Ah, the wave equation is the structural truth, the elasticity is the fiction." They would have said the elasticity *explains* the wave equation. If you strip the explanation, you're left with a black box.

  **ELENA:** I'm not stripping the explanation. I'm saying the explanation evolves.

  **MARCUS:** Or it vanishes. Let's try one more. The Bohr Model. Quantized orbits. It predicted the hydrogen spectrum perfectly. Structural realist in 1915 says, "The quantization of angular momentum is the real structure." Heisenberg and Schrödinger come along. Orbitals aren't paths. Angular momentum is an operator, not a trajectory. The "structure" of the orbit was discarded. The math changed from algebra to matrices and wave functions. Did the structure survive? Or did we just find a new math that fit the same data points?

  **ELENA:** The commutation relations in QM preserve the quantization. The discrete energy levels survived. That's structural continuity.

  **MARCUS:** The *phenomena* survived. The energy levels are observables. But the *theoretical structure* used to derive them? Bohr's orbits are gone. Completely. If you told a Bohr realist, "In the future, electrons won't have positions and momenta simultaneously," they'd say you've abandoned the structure of reality.

  **ELENA:** They'd say we refined our understanding of the structure. Look, Marcus, the alternative is giving up on truth entirely. If we say, "Dark Matter is just a bookkeeping device," then why pour billions into detectors? Why build the LHC? We build them because we think there's *something* there. That practical commitment is realism.

  **MARCUS:** It's pragmatic commitment, not epistemic realism. I can believe the detector will click without believing I know *what* made it click, or if "what" is even the right category. I can believe the bookkeeping is indispensable without believing the entries correspond to entities.

  **ELENA:** But the precision... it feels like hubris to say we're just shuffling symbols.

  **MARCUS:** And it feels like hubris to say that after 300 years of scientific revolutions, *this* generation finally got the structure right. Fresnel thought he got the structure right. Maxwell thought he got the structure right. Dirac thought he got the structure right.

  **ELENA:** But each time, the math got more robust. More unified.

  **MARCUS:** Or more convoluted. Renormalization, Dark Energy, the Measurement Problem. We're patching holes.

  **ELENA:** We're refining the structure.

  **MARCUS:** *(Sips cold coffee)* Maybe. Or maybe we're just really good at building ladders that reach higher, without ever touching the ground.

  **ELENA:** If the ladder keeps holding weight, I'm going to trust it's leaning against something.

  **MARCUS:** And I'm worried we're just leaning it against the last ladder, which is leaning against the one before that, all the way back to phlogiston, and none of them are actually touching the wall.

  **ELENA:** *(Smiles tiredly)* Well. At least we agree the coffee is gone.

  **MARCUS:** Small consolation. Same time tomorrow?

  **ELENA:** Definitely. I need to find a better counter-example for the Caloric case.

  **MARCUS:** Bring your A-game. I'm digging up the Vortex Atom papers tonight.

  *[They pack up their bags. The argument is unresolved, but the respect is mutual.]*
