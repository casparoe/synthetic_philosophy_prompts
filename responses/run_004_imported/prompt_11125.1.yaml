answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I have the distinct privilege of being [Bride]'s closest friend.

  Now, usually, this is the part of the speech where I stand up and list [Bride]'s virtues. I'm supposed to tell you how kind she is, how smart she is, and how patient she is. And then I'm supposed to do the same for [Groom].

  But I can't do that. And the reason I can't do that is actually why we're all here today.

  A few years ago, a group of us got bored one winter and started an online reading group. None of us were experts; we were just friends picking philosophy books at random to argue about. And one book stuck. G.E. Moore's *Principia Ethica*.

  For the thirty of you who were in that group: hello, I see you nodding. For the rest of you: don't worry, I'm not going to give a lecture. But Moore had one very simple idea that changed how we look at happiness. He said that if you strip away everything complicated, there are really only two things that make life worth living: the appreciation of beauty, and the pleasures of human intercourse—by which he meant personal affection. Not being clever, not being successful, not even just "being good" in a vacuum. It's about loving people and seeing the beauty in the world.

  [Bride] and [Groom] didn't meet at a bar. They didn't meet on an app. They met in that reading group. Specifically, they spent three weeks aggressively arguing in a chat room about Moore's chapter on "The Ideal."

  [Bride], you told me later that you thought he was being pedantic. [Groom], you told me you thought she was missing the nuance. But looking back, Moore would say you were actually engaging in the highest form of human good. You were exercising your minds, yes, but you were also building affection. You were turning an argument into a connection.

  And this brings me to why I'm not going to list your individual qualities. Moore argued for something called "Organic Unity." He believed that the value of two people together isn't just the sum of their parts. It's not [Bride]'s kindness plus [Groom]'s humor. That's math, not love.

  The value is in the *whole*. It's in the specific, unique thing that exists only when you are in the same room. It's the way [Groom] looks at [Bride] when she's explaining something she's passionate about. It's the way [Bride] laughs at a joke only [Groom] understands. If I listed your virtues separately, I'd be making a philosophical error. The good isn't in the ingredients; it's in the cake.

  Now, I have to issue a small warning. Those of us in the reading group know that Moore's ideas had a famous fan club: the Bloomsbury Group. Virginia Woolf, John Maynard Keynes, all the cultural icons of the early 20th century. They basically built their social lives on this exact chapter of Moore's book. They adopted what Keynes called a "religion of beauty and love."

  But, Keynes also wrote later that they might have taken the fun parts of Moore's philosophy and quietly ignored the bits about "rules of conduct" and moral duty that came right before it. They focused on the state of mind, but sometimes forgot about being decent people.

  So, [Bride] and [Groom], my advice is this: Take the Bloomsbury approach to love. Cherish that organic unity. Prioritize affection and beauty above career status or being right in an argument. But, perhaps unlike Woolf and Keynes, try to keep the rules of conduct, too. Be kind to the in-laws. Return the borrowed Tupperware. Keep the ethics alongside the aesthetics.

  If you do that, you'll have exactly what Moore said was the pinnacle of human experience. You have built something together that is greater than what either of you could be alone. You have created a whole that is more valuable than the sum of its parts.

  So, if everyone could please stand and raise a glass.

  To [Bride] and [Groom]. To personal affection. To the appreciation of beauty. And to the organic unity you have created, which we are all so lucky to witness.

  To the happy couple!
