      *   **Audience:** 50 guests. ~1/3 know the reading group/Moore references. ~2/3 are family/coworkers (no philosophy background).
      *   **Constraint:** Cannot be a philosophy lecture. Must be warm and funny. Cannot just list individual virtues (violates the "organic unity" principle).
      *   **Optional Element:** Virginia Woolf/Bloomsbury Group connection (they loved Moore's "religion of beauty/love" but ignored the "rules of conduct"). Include only if natural/honest.

  2.  **Determine the Tone:**
