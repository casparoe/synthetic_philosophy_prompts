prompt: |-
  I'm doing a magazine Q&A with a decision theorist next week who's built her whole reputation defending "resolute choice" as the way out of money-pump arguments -- basically the claim that an agent whose preferences break the standard axioms (intransitive preferences, say, or Allais-style violations of independence) can still count as rational, so long as she commits to a plan up front and actually follows through at the later choice node, even at the exact moment she'd rather deviate. I don't want the piece to just be her restating the view for the tenth time. Can you draft me 8-10 questions that push past that? I want at least one on whether "resolving to stick with it" is just willpower wearing a rationality costume -- isn't she basically conceding she'd defect if she thought she could get away with it -- one on how resolute choice is even supposed to extend to the newer money-pump arguments against incomplete preferences (the ones that pump you through a chain of trades that never directly compares the two "incomparable" options), and one asking her point blank whether ordinary akrasia, procrastination, addiction, that sort of thing, is literally the same structure as a money pump or just superficially similar. For each, throw in a quick follow-up keyed to whatever answer shes most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Subject:** A decision theorist known for defending "resolute choice" (associated with Edward McClennen, but here attributed to a female theorist, likely a fictionalized or specific contemporary figure like Sarah Paul, Edna Ullmann-Margalit, or a composite).
      *   **Core Thesis:** Agents with non-standard preferences (intransitive, Allais violations) are rational if they commit to a plan and stick to it (resolute choice), even if tempted to deviate later. This avoids money-pump arguments.
      *   **Goal:** 8-10 magazine Q&A questions.
      *   **Constraint:** Avoid letting her restate the standard view. Push past the basics.
      *   **Required Topics:**
          1.  Willpower vs. Rationality (Is resolute choice just willpower in disguise? Does it imply she'd defect if she could get away with it?)
          2.  Incomplete Preferences & New Money Pumps (How does resolute choice handle chains of trades involving incomparable options?)
          3.  Akrasia/Addiction (Is ordinary weakness of will structurally identical to a money pump?)
      *   **Format:** Each question needs a specific follow-up keyed to her likely answer.
      *   **Tone:** Magazine style (engaging, sharp, accessible but intellectually rigorous).

  2.  **Deconstruct "Resolute Choice":**
      *   *Standard View:* Dynamic inconsistency (preferring A over B now, but B over A later) is usually seen as irrational. Resolute choice says: Plan at $t_1$, execute at $t_2$ even if preferences shift, because the *plan* is the unit of rationality.
      *   *Critique:* It looks like Ulysses tying himself to the mast. Is that rationality or pre-commitment technology? Does it require a "dual self"?
      *   *Money Pumps:* If you prefer A > B, B > C, but C > A (intransitive), you can be pumped. Resolute choice says "I choose the plan (Start -> End)" not the individual steps.
      *   *Incomplete Preferences:* If A and B are incomparable, can you be pumped? Recent arguments (e.g., by Johan Gustafsson) suggest yes, via "small steps."
      *   *Psychology:* How does this relate to actual human psychology (addiction, procrastination)?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Willpower Charge):* Needs to hit the "rationality costume" angle.
          *   *Draft:* Isn't this just willpower?
          *   *Refinement:* Make it sharper. Is resolute choice just a semantic trick to call self-control rationality?
          *   *Follow-up:* If she says "No, it's structural," ask about the mechanism. If she says "Yes, sort of," ask why that's not a concession.

      *   *Question 2 (Incomplete Preferences):* Needs to address the new money pump arguments (Gustafsson etc.).
          *   *Draft:* What about incomplete preferences?
          *   *Refinement:* Focus on the "chain of trades" that avoids direct comparison. How does resolution stop that?
          *   *Follow-up:* If she says "You just refuse the chain," ask *when* that refusal happens.

      *   *Question 3 (Akrasia/Addiction):* The structural similarity question.
          *   *Draft:* Is addiction a money pump?
          *   *Refinement:* Distinguish between "rational resolution" and "pathological compulsion." Are they the same engine?
          *   *Follow-up:* If she says "Same structure," ask about normative status. If "Different," ask where the line is.

      *   *Question 4 (The "Get Away With It" Angle):* Part of the Willpower requirement.
          *   *Draft:* Would you cheat if no one looked?
          *   *Refinement:* Focus on the *source* of the constraint. Is it internal or external? If the plan is no longer optimal at $t_2$, why follow it?
          *   *Follow-up:* Press on the "why."

      *   *Question 5 (Regret & Learning):* A good angle for decision theory.
          *   *Draft:* What if the plan was wrong?
          *   *Refinement:* If you resolve to stick to a plan that turns out disastrous, is that still rational? Does resolute choice block learning?
          *   *Follow-up:* Ask about updating beliefs vs. maintaining plans.

      *   *Question 6 (The "Self" at t2):* Metaphysical/Psychological angle.
          *   *Draft:* Who is making the choice at t2?
          *   *Refinement:* At the moment of deviation, your preferences say "Deviate." Who is the "you" that overrides that? Is it a homunculus?
          *   *Follow-up:* Press on the psychology of the agent.

      *   *Question 7 (Normative Force):* Why should we care?
          *   *Draft:* Why does this matter for real life?
          *   *Refinement:* If standard expected utility works for casinos, why do we need this for life? What's the practical payoff?
          *   *Follow-up:* Ask for a concrete example where resolute choice beats standard theory *without* just being stubbornness.

      *   *Question 8 (The Cost of Resolution):*
          *   *Draft:* Is it exhausting?
          *   *Refinement:* Cognitive cost. Is maintaining resoluteness costly? If so, doesn't that re-introduce a maximization problem (maximize utility minus resolution cost)?
          *   *Follow-up:* If yes, does it collapse back into standard theory?

      *   *Question 9 (Social/Contractual):*
          *   *Draft:* What about promises?
          *   *Refinement:* Is resolute choice just a model of promise-keeping? If I promise you, I resolve. But what if I promise myself?
          *   *Follow-up:* Ask about the binding nature of intra-personal contracts.

      *   *Question 10 (The "Rationality" Label):*
          *   *Draft:* Are you redefining rationality?
          *   *Refinement:* You're saving the agent from being called irrational by changing the definition of rationality. Isn't that moving the goalposts?
          *   *Follow-up:* Ask about the boundary of the term.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Required topics covered? Yes (Willpower, Incomplete Preferences, Akrasia).
      *   Tone check: Ensure they sound like a journalist, not a grad student. Punchy intros.
      *   Specific check on the "Get Away With It" point: Make sure Q1 or Q4 hits this hard.
      *   Specific check on Incomplete Preferences: Ensure the "chain" aspect is mentioned.
      *   Specific check on Akrasia: Ensure the "structural identity" aspect is clear.

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the follow-ups aren't just "Why?" but specific branches based on likely defenses (e.g., "If you say X, then Y...").
      *   *Correction:* Ensure the distinction between *sophisticated* choice (anticipating future deviation) and *resolute* choice (forcing future compliance) is clear in the framing, so she can't conflate them.
      *   *Correction:* The prompt mentions "decision theorist... built her whole reputation." I should treat her as a specific interlocutor. I will assume she leans towards the McClennen/Bratman style defense.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 10 questions designed to corner the subject on the implications of resolute choice, including the specific follow-ups you requested.

  **1. The "Willpower" Charge**
  Critics often say resolute choice is just standard rationality wearing a costume. They argue that when you "resolve" to stick to a plan at time two, even though your current preferences scream at you to deviate, you aren't being *rational*—you're just exerting willpower. You're essentially conceding that your preferences *would* defect if you thought you could get away with it, but you're forcing yourself not to. Is resolute choice anything more than a semantic trick to call self-control "rationality"?
  *   **Follow-up:** If she insists it's structural and not psychological: "Then tell me what mechanism enforces the structure. If there's no internal 'enforcer,' aren't you just describing a agent who *happens* to be stubborn, rather than one who is *reasoning* correctly?"

  **2. The Incomplete Preferences Pump**
  Let's talk about the newer money-pump arguments targeting incomplete preferences. These don't rely on intransitivity; they pump you through a chain of trades where you never directly compare the two 'incomparable' options, yet you still end up worse off. How does resolute choice stop this? If the preferences are genuinely incomplete, there's no plan to 'resolve' to at the start, because the start node doesn't rank the outcomes.
  *   **Follow-up:** If she says you resolve to "not trade": "But the pump works by offering small improvements at every step. If you resolve to ignore local improvements, aren't you just violating the dominance principle? And if you violate dominance, in what sense are you still a rational agent?"

  **3. Akrasia and Addiction**
  I want to ask about the psychology of the agent. Is the structure of a money pump literally identical to the structure of ordinary akrasia, procrastination, or addiction? When an addict resolves to quit but relapses at the choice node, is that the same failure of resolution as the agent who gets money-pumped for violating independence?
  *   **Follow-up:** If she says they are structurally identical: "Then why do we treat the addict as needing medical help and the money-pump victim as needing a logic lesson? If the structure is the same, shouldn't the intervention be the same?"

  **4. The "Get Away With It" Test**
  You argue that a resolute chooser follows the plan even when it's no longer optimal at the later node. But let's be blunt: If the agent knew, with certainty, that deviating from the plan would have zero negative consequences—no future self-punishment, no reputation loss—would your resolute chooser still stick to the plan? Or is the 'resolution' contingent on there being some cost to defection?
  *   **Follow-up:** If she says they would still stick to it: "That implies the agent at time-two has preferences that are different from the agent at time-one. But I thought the whole problem was that preferences *shifted*. Which set of preferences is the 'real' one?"

  **5. Blocking Learning**
  One worry about resolute choice is that it looks like dogmatism. If I commit to a plan at time one, and at time two new information arrives suggesting the plan is disastrous, resolute choice seems to demand I ignore that information to maintain dynamic consistency. Does your view forbid an agent from updating their strategy based on new evidence?
  *   **Follow-up:** If she says "No, you can update": "Then where is the line? At what point does 'updating based on evidence' become 'making an excuse to defect'? If the agent gets to decide that, haven't we just pushed the inconsistency back a step?"

  **6. The Homunculus Problem**
  At the moment of choice, the agent prefers Option B. But the 'Plan' says Option A. For the agent to choose A, there must be some part of the mind that overrides the current preference. Who is doing the overriding? Are you smuggling a homunculus—a little rational man inside the head—into your decision theory to do the heavy lifting?
  *   **Follow-up:** If she denies the homunculus: "Then describe the causal process without using agential language. If it's not a 'self' overriding a 'preference,' is it just a causal chain? And if it's just causality, where is the normativity? Why *ought* they do it?"

  **7. The Cost of Resolution**
  Maintaining resolution surely has a cognitive cost. It's exhausting to fight your own future preferences. If we include that cost in the utility function, doesn't resolute choice collapse back into standard expected utility theory? You'd just maximize 'Utility minus Resolution Cost.'
  *   **Follow-up:** If she says resolution costs don't count: "Why not? If I get a headache from thinking too hard, that's a cost. If I get psychic pain from fighting my own desires, why isn't that a cost? If it is a cost, aren't you just doing standard maximization again?"

  **8. Promises to Self vs. Others**
  Resolute choice looks a lot like a model of promise-keeping. I promise you I'll do X, so I do X even if I'd rather not. But here we are talking about promises to *myself*. Is there actually such a thing as an intra-personal contract? Or is 'resolute choice' just a metaphor for having a strong memory?
  *   **Follow-up:** If she says intra-personal contracts are real: "What binds the contract? If I can dissolve a contract with myself whenever I want, it's not a contract. If I can't, aren't I just a slave to my past self? Where's the autonomy?"

  **9. The "Rationality" Label**
  You're defending agents who violate the standard axioms of rationality (like Independence or Transitivity) by saying they can still be rational if they are resolute. Isn't this just moving the goalposts? You're saving the agent from the charge of irrationality by redefining rationality to mean 'stick-to-itiveness.'
  *   **Follow-up:** If she says she's refining the definition: "Okay, refine it for me. What is a behavior that is 'resolute' but still 'irrational'? If there isn't one, then 'rational' just means 'resolute,' and we've lost the ability to critique the plan itself."

  **10. The Practical Payoff**
  Finally, let's talk about the magazine reader. They don't care about axioms. They care about life. If I adopt resolute choice, do I actually end up happier, wealthier, or better off than a 'sophisticated' chooser who anticipates their own weakness and plans around it? Or is resolute choice just a way to feel morally superior while getting the same result?
  *   **Follow-up:** If she says you end up better off: "Can you give me a concrete, real-world example where a resolute chooser beats a sophisticated chooser? Not a thought experiment about money pumps, but a life choice—career, marriage, health. Where does resolution actually win?"
