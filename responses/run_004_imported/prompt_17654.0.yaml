      *   Highlight the "State of Nature" as a thought experiment, not an empirical claim.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt? Yes, four moves + what's missing.
      *   *Check:* Is the verdict clear? I need to be decisive on "who has the better of each point."
      *   *Refinement on Move 1:* Renata argues the deductions of *Leviathan* are suspect *because* they rest on that self-assessed rigor. If the rigor is illusory, the structure is weak. This is a strong internal critique. Julian says "separate matters." Julian is right that the *truth* is separate, but Renata is right that the *claim to certainty* is undermined. I will give Move 1 to Renata because Hobbes *claimed* the connection. If the foundation (method) is cracked, the building (Leviathan) is suspect *by Hobbes's own standards*.
