  Here is a concrete instantiation of Lewis's triviality result, tailored to a setting familiar to your background.

  ### The Experimental Setup

  Consider a radiation monitoring system in a shielded laboratory. We define two propositions:
  *   **$A$**: "The lead shielding is compromised (breached)."
  *   **$C$**: "The Geiger counter registers > 100 counts per second (cps)."

  Physically, a breach makes a high count rate much more likely, but background radiation means high counts are still possible without a breach. Thus, $A$ and $C$ are probabilistically dependent.

  ### 1. The Prior Probability Distribution

  Let us assign specific probabilities to the four logical possibilities in our sample space. We assume the prior probability of a breach is $P(A) = 0.4$.

  | State | Description | Probability |
  | :--- | :--- | :--- |
  | **$A \land C$** | Breach AND High Count | $0.36$ |
  | **$A \land \neg C$** | Breach AND Normal Count | $0.04$ |
  | **$\neg A \land C$** | Intact AND High Count | $0.06$ |
  | **$\neg A \land \neg C$** | Intact AND Normal Count | $0.54$ |
  | **Total** | | **$1.00$** |

  From this table, we calculate the relevant marginal and conditional probabilities:
  *   **$P(C)$**: Total probability of High Count $= 0.36 + 0.06 = \mathbf{0.42}$.
  *   **$P(C|A)$**: Probability of High Count *given* Breach $= 0.36 / 0.40 = \mathbf{0.90}$.
  *   **$P(C|\neg A)$**: Probability of High Count *given* Intact $= 0.06 / 0.60 = \mathbf{0.10}$.

  Note the dependence: $P(C|A) \neq P(C)$ ($0.90 \neq 0.42$).

  ### 2. Applying Stalnaker's Thesis

  Stalnaker's Thesis asserts that the probability of the indicative conditional "If $A$, then $C$" (denoted $A \to C$) is equal to the conditional probability:
  $$P(A \to C) = P(C|A)$$

  Using our numbers, Stalnaker requires:
  $$P(A \to C) = 0.90$$

  ### 3. The Lewis Update and Collapse

  Lewis's argument relies on the requirement that this equation must hold not just for your current probability function $P$, but for *any* updated probability function $P'$ derived from new evidence, provided $P'(A) > 0$.

  Let us perform an update on the evidence **$\neg A$** (we verify the shielding is intact). However, to avoid dividing by zero, let us consider a shift in probability mass where $P(A)$ becomes very small but non-zero, or simply apply the Law of Total Probability to the proposition $X = (A \to C)$.

  If $X$ is a genuine proposition, it must obey the Law of Total Probability with respect to $A$:
  $$P(X) = P(X | A)P(A) + P(X | \neg A)P(\neg A)$$

  We analyze the terms:
  1.  **$P(X | A)$**: Given $A$ is true, the conditional $A \to C$ is true if and only if $C$ is true (Modus Ponens). Thus, $P(X | A) = P(C | A) = 0.90$.
  2.  **$P(X)$**: By Stalnaker's Thesis, this is also $P(C | A) = 0.90$.

  Substitute these into the Total Probability equation:
  $$0.90 = (0.90) \cdot P(A) + P(X | \neg A) \cdot P(\neg A)$$

  Rearranging to solve for the unknown term $P(X | \neg A)$:
  $$0.90 \cdot [1 - P(A)] = P(X | \neg A) \cdot P(\neg A)$$
  $$0.90 \cdot P(\neg A) = P(X | \neg A) \cdot P(\neg A)$$
  $$\mathbf{P(X | \neg A) = 0.90}$$

  **The Contradiction:**
  This result implies that learning the shielding is intact ($\neg A$) does not change the probability of the conditional "If breached, then high count"; it remains 0.90. Lewis proves that for this to hold universally across all possible probability distributions (i.e., for any choice of $P(A)$), the conditional probability $P(C|A)$ must be equal to the unconditional probability $P(C)$.

  In our specific numerical case, if we enforce Stalnaker's Thesis, we are forced to conclude:
  $$P(C|A) = P(C)$$
  $$0.90 = 0.42$$

  This is physically absurd. The equation collapses because the requirement that the conditional probability ($0.90$) equals the proposition's probability ($0.90$) forces $A$ and $C$ to be independent, contradicting our initial setup where $A$ is a cause of $C$.

  ### Conclusion

  This triviality result suggests that indicative conditionals cannot be genuine propositions with truth values that obey the standard laws of probability, but rather function as expressions of conditional belief.
