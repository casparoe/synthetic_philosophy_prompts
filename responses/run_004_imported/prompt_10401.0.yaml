prompt: |-
  I'm on the steering committee for a small open-source proof assistant library (dependently typed, kinda Coq/Agda-ish), and we need to settle a fight before the vote next week. Half the maintainers want the core library to stay fully constructive -- no excluded middle, no choice -- so every theorem still extracts to an actual runnable program, and they worry even 'harmless' classical lemmas quietly poison extraction elsewhere in the library. The other half say that's a purity fetish: most of their proofs never get extracted anyway, case-splits on real numbers are miserable without LEM, and since double-negation translation embeds classical logic into intuitionistic logic anyway, they figure the whole fight is basically just notation. Can you draft the actual memo I'll bring to the meeting -- a real recommendation (ban classical axioms outright, allow them but walled off in there own namespace, whatever's defensible), with reasons, that takes the other side's strongest point seriously instead of just name-checking it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Steering committee of a small open-source dependently typed proof assistant library (Coq/Agda-like).
      *   **Conflict:** Constructive purity (extraction guaranteed) vs. Classical convenience (LEM/Choice allowed for ease of proof).
      *   **Stakeholders:**
          *   *Constructivists:* Want extraction to work, fear "poisoning" of the library.
          *   *Classicalists:* Want ease of proof (especially for reals/analysis), argue extraction isn't the main use case, claim double-negation translation makes the distinction moot notationally.
      *   **Task:** Draft a memo with a concrete recommendation for the upcoming vote.
      *   **Constraint:** Must take the opposing side's strongest point seriously (no strawmanning), be defensible, and offer a practical compromise/solution.

  2.  **Evaluate the Arguments:**
      *   *Constructivist Strength:* Extraction is a unique selling point of DT languages. Once an axiom is assumed, extraction becomes opaque or impossible for that module and anything depending on it. It creates a "slippery slope" where the library becomes fragmented without users knowing.
      *   *Classicalist Strength:* Many users don't care about extraction. They care about verification. Classical reasoning is significantly more ergonomic for analysis/topology. Double-negation translation *does* mean classical logic is consistent relative to constructive logic, so it's not "unsound," just non-computational.
      *   *The "Notation" Claim:* The classicalists say it's "just notation" because of DN translation. This is technically true for consistency but false for *computation*. I need to address this nuance.

  3.  **Determine the Best Recommendation:**
      *   *Option A: Ban Classical Axioms.* Too restrictive. Drives away users doing verification of math that isn't algorithmic.
      *   *Option B: Allow Everywhere.* Destroys the extraction guarantee. Makes the library "just another theorem prover" without the computational benefit.
      *   *Option C: Walled Garden (Namespaces/Modules).* This is the standard industry best practice (e.g., Coq's `Classical` namespace, Agda's standard library structure). It allows both use cases but makes dependencies explicit.
      *   *Refinement:* It's not enough to just say "use namespaces." We need technical guardrails (e.g., universe levels, explicit imports, extraction warnings).

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation up front.
      *   **Context:** Briefly state the conflict.
      *   **Analysis of Positions:**
          *   Acknowledge the Constructive value (Extraction).
          *   Acknowledge the Classical value (Ergonomics/Verification).
          *   *Crucial:* Address the "Double-Negation is just notation" argument directly.
      *   **Recommendation:** The "Walled Garden" approach with specific implementation details.
      *   **Rationale:** Why this wins for both sides.
      *   **Implementation Plan:** How to enforce it.

  5.  **Drafting - Section by Section (Iterative refinement):**

      *   *Subject Line:* Needs to be clear. "Proposal for Classical Axiom Policy."
      *   *Opening:* Keep it professional but direct. We need a decision.
      *   *The "Notation" Rebuttal:* This is the tricky part. The classicalists say DN translation makes it moot. I need to explain *why* that doesn't solve the extraction problem. DN translation preserves truth, not computational content. If I prove $\exists x, P(x)$ classically, I can't get $x$ out. Constructively, I can. That's the core difference. I must validate their point (consistency is fine) while correcting the conclusion (computation is lost).
      *   *The Compromise:* "Classical by Default" is bad. "Constructive by Default" is good. But "Classical Available" is necessary.
      *   *Technical Mechanism:* Separate namespaces (e.g., `MyLib.Classical`). Importing this tag the module as non-extractable. Maybe use typeclass instances or universe polymorphism to keep things separate? Let's stick to namespaces/modules as it's more common in Coq/Agda.
      *   *Tone:* Collaborative, technical, decisive.

  6.  **Refining the Argument against "Just Notation":**
      *   The classicalists argue: "DN translation embeds classical logic into intuitionistic logic."
      *   Counter: Yes, for *propositions*. But for *data* (Types vs Props), it fails. If we prove existence in `Prop`, DN works. If we need a witness in `Type` (for extraction), LEM blocks it. The library likely mixes `Prop` and `Type`. I need to make sure the memo distinguishes between *verification* (Prop) and *computation* (Type).

  7.  **Finalizing the Recommendation:**
      *   **Core Principle:** Constructive by default.
      *   **Mechanism:** Explicit `Classical` module.
      *   **Enforcement:** CI checks for extraction on the core, documentation warnings.
      *   **Philosophy:** "Computational Transparency." Users should know when they lose extraction.

  8.  **Review against Constraints:**
      *   *Real recommendation?* Yes (Walled Garden).
      *   *Take other side seriously?* Yes (acknowledge ergonomics and consistency via DN).
      *   *Defensible?* Yes, aligns with existing best practices in Coq/Agda communities.
      *   *Memo format?* Yes.

  9.  **Polishing:** Ensure the language sounds like a steering committee member speaking to peers (technical, precise, slightly diplomatic but firm). *Self-Correction during drafting:* Make sure I don't sound like I'm siding entirely with the constructivists. The recommendation must enable classical work, just isolate it.

  10. **Final Polish:** Check the "Double Negation" rebuttal again. It needs to be precise. DN translation maps $P$ to $\neg\neg P$. It doesn't give you a program for $P$. It gives you a program for $\neg\neg P$. That's the key distinction.

