answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, [Library Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Classical Axiom Policy and Extraction Guarantees

  ### 1. Executive Summary

  We are currently divided between maintaining a fully constructive core to guarantee program extraction and allowing classical axioms (LEM, Choice) to improve proof ergonomics. 

  **Recommendation:** I propose we adopt a **"Constructive Core, Classical Extension"** policy. The default library namespace must remain fully constructive. Classical axioms are permitted but must be isolated in a distinct namespace (e.g., `MyLib.Classical`). Importing this namespace explicitly marks a module as non-extractable. We will implement CI checks to ensure the constructive core remains free of classical dependencies.

  This approach preserves the library's unique computational guarantees while acknowledging that verification is a valid use case independent of extraction.

  ### 2. Context and Stakeholder Concerns

  The committee is split on a fundamental design choice:
  *   **The Constructive Position:** Dependently typed languages offer a unique value proposition: proofs are programs. Introducing axioms like the Law of Excluded Middle (LEM) breaks this link. Once an axiom is introduced, extraction becomes opaque or impossible, and this "poison" propagates to any module depending on it.
  *   **The Classical Position:** Most users are verifying mathematics, not generating code. For analysis and topology, avoiding LEM is unnecessarily painful. Furthermore, since double-negation translation embeds classical logic into intuitionistic logic, the distinction is arguably "just notation" regarding consistency.

  ### 3. Analysis of the "Just Notation" Argument

  We must address the classical side's strongest technical point seriously: *Is the distinction merely notational?*

  The argument relies on the Gödel–Gentzen double-negation translation, which proves that if a proposition $P$ is provable classically, then $\neg\neg P$ is provable constructively. This is correct regarding **consistency**. If our only goal were truth preservation, the classicalists would be right; we could assume LEM without fear of contradiction.

  However, this argument fails regarding **computational content**.
  1.  **Propositions vs. Data:** In our type theory, we distinguish between `Prop` (proof irrelevance) and `Type` (data). Double-negation translation works on `Prop`. It does not recover a witness $x : A$ from a classical proof of $\exists x : A, P(x)$.
  2.  **Extraction Semantics:** When a user extracts code, they expect functions, not continuations passing style (CPS) transformed blobs. A classical proof of existence yields no algorithm. To claim this is "just notation" ignores that our users rely on the Curry-Howard correspondence for *execution*, not just verification.

  Therefore, the distinction is not about soundness; it is about **computational transparency**. Users have a right to know when a definition hides a "hole" in the computation.

  ### 4. Proposed Policy: The Walled Garden

  We should not force a binary choice between "pure but unusable for analysis" and "usable but computationally opaque." We can support both workflows if we enforce strict boundaries.

  **A. Constructive Default**
  The root namespace (`MyLib`) must remain axiom-free (no LEM, no Choice). This ensures that any user importing only `MyLib` retains full extraction guarantees. This is our "gold standard" and primary differentiator from non-dependently typed provers.

  **B. Explicit Classical Namespace**
  We will maintain a parallel namespace (e.g., `MyLib.Classical`).
  *   Modules here may import axioms.
  *   Files in this namespace must include a header annotation (e.g., `@no_extraction`).
  *   **Crucially:** Definitions from `MyLib.Classical` cannot be imported into `MyLib` without triggering a CI failure. This prevents accidental poisoning of the constructive core.

  **C. The "Classical Reasoning" Interface**
  To address the ergonomics concern, we should provide classical tactics and lemmas that are *parameterized* over the axioms. This allows classical users to import the axioms once at the top of their file, while constructive users simply ignore that module.

  ### 5. Rationale

  **For the Constructivists:**
  *   **Extraction Safety:** The CI pipeline will verify that the core library extracts to valid code (e.g., OCaml/Haskell).
  *   **No Slippery Slope:** By walling off axioms, we prevent the "death by a thousand cuts" where a harmless-looking lemma quietly introduces Choice deep in the dependency graph.

  **For the Classicalists:**
  *   **Ergonomics:** You are free to use LEM and Choice for your analysis proofs. You are not blocked from working on real numbers or topology.
  *   **Consistency Validated:** We acknowledge your point that the library remains logically consistent with classical axioms. We are not claiming classical math is "wrong," only that it is "non-computational."
  *   **Interoperability:** Since the classical module depends on the constructive core (not vice versa), you still get to use all the base definitions (lists, trees, basic logic) without re-proving them.

  ### 6. Implementation Plan

  If this recommendation is accepted, I propose the following action items for the next release cycle:

  1.  **Refactor:** Move any existing lemmas relying on LEM/Choice into `MyLib.Classical`.
  2.  **CI Pipeline:** Add a step that attempts extraction on the `MyLib` namespace. If it fails due to axioms, the build fails.
  3.  **Documentation:** Clearly label the API docs. Modules in `MyLib` get a "Computational" badge; modules in `MyLib.Classical` get a "Verification Only" badge.
  4.  **User Guide:** Add a section explaining *why* we separate them, explicitly addressing the double-negation translation argument so users understand the design decision isn't philosophical dogma, but an engineering constraint on extraction.

  ### 7. Conclusion

  This policy treats "computation" as a feature, not a fetish. It acknowledges that while classical logic is consistent within our system, it disables the primary engine of our type theory: the ability to run proofs as programs. By walling off classical axioms, we serve both the users who want verified algorithms and the users who want verified mathematics, without forcing either group to compromise their workflow or unknowingly inherit the other's constraints.

  I request we vote on this "Walled Garden" policy at next week's meeting.
