answer: |-
  You are absolutely right to be freaked out. This is one of the most disturbing results in modern philosophy, and Gustaf Arrhenius is basically the dark wizard who proved it.

  The short answer is: **Yes, it is true.** Arrhenius didn't just find a flaw in Total Utilitarianism; he proved that *any* theory of population ethics that satisfies a few very basic, intuitive conditions will lead to a contradiction or a morally abhorrent conclusion.

  Since you want the intuition and not the symbol soup, let's break down **why** the logic traps us.

  ### The Setup: The Three Moral Intuitions
  To understand the impossibility, you have to see the three "obvious" moral instincts that Arrhenius shows are actually incompatible. Almost everyone agrees with these three statements individually:

  1.  **Quality Matters:** A world where people are happier is better than a world where they are miserable (all else being equal).
  2.  **Quantity Matters:** Adding a person with a life worth living is a good thing (it doesn't make the world worse).
  3.  **Consistency (Transitivity):** If World A is better than World B, and World B is better than World C, then World A must be better than World C.

  The Repugnant Conclusion happens when you prioritize #2 and #3 over #1. But Arrhenius proved that if you try to prioritize #1 to avoid the Repugnant Conclusion, you end up violating #2 in a horrific way.

  ### The Trap: The "Stepwise" Argument
  Here is the intuitive engine behind the impossibility theorem. Imagine a spectrum of populations.

  *   **Population A:** 1 billion people who are ecstatically happy.
  *   **Population Z:** 100 trillion people whose lives are *barely* worth living (just above the point where they wish they were dead).

  **Total Utilitarianism** says Z is better than A because the *total sum* of happiness is higher. That's the Repugnant Conclusion.

  To avoid this, you might say, "No, A is better than Z. Quality matters more than quantity."

  **Here is where Arrhenius springs the trap.** He asks you to imagine a chain of populations connecting A to Z.
  *   **A1:** 1 billion ecstatic people.
  *   **A2:** 1.1 billion people, *very slightly* less happy than A1.
  *   **A3:** 1.2 billion people, *very slightly* less happy than A2.
  *   ...
  *   **AZ:** 100 trillion people, lives barely worth living.

  In each step from A1 to A2 to A3, we add a lot of people and reduce the happiness of everyone *very slightly*.

  **The Dilemma:**
  1.  **If you say each step is an improvement:** (A2 is better than A1, A3 is better than A2...) then by **Consistency (#3)**, the final population Z must be better than A. You have accepted the **Repugnant Conclusion**.
  2.  **If you say at least one step is NOT an improvement:** You are saying that at some point, adding a huge number of happy people (even if they are slightly less happy than the previous group) makes the world *worse* or *neutral*.

  This seems like a reasonable escape, right? Just deny the chain. But this is where the **Sadistic Conclusion** comes in.

  ### The "Other Messed Up Conclusion": The Sadistic Conclusion
  Arrhenius proved that if you try to block the Repugnant Conclusion by denying the chain above (saying "No, adding those slightly-less-happy people doesn't help"), you are logically forced to accept something called the **Sadistic Conclusion**.

  The Sadistic Conclusion roughly states: **There are situations where adding people with negative welfare (suffering) is better than adding people with positive welfare (happiness).**

  **How does that happen?**
  If your theory says that adding happy people (below a certain threshold) doesn't make the world better, your theory implies that "happy lives" have zero or negative marginal value in certain contexts.
  If happy lives have zero value, but you still need to account for the "size" of the population, mathematical consistency forces you to weigh suffering differently. In some Average Utilitarian or Critical Level theories, you can construct a scenario where adding a group of suffering people raises the "value" of the population more than adding a group of mildly happy people, because the happy people are dragging down the "average" or failing to meet the "critical level."

  So, you have to choose your poison:
  *   **Option 1:** Accept the **Repugnant Conclusion** (A world of vast, mediocre existence is better than a world of small, ecstatic existence).
  *   **Option 2:** Accept the **Sadistic Conclusion** (Sometimes it is better to add suffering people than happy people).

  ### Why is this an "Impossibility"?
  In math, an impossibility theorem (like Arrow's Impossibility Theorem in voting) shows that no system can satisfy a set of fair criteria simultaneously.

  Arrhenius showed that the "criteria" are our basic moral intuitions.
  *   We want a theory that says suffering is bad.
  *   We want a theory that says happy lives are good.
  *   We want a theory that is logically consistent.

  He proved **you can only pick two.**

  1.  **Total Utilitarianism** picks Consistency + Happy Lives are Good. **Result:** Repugnant Conclusion.
  2.  **Average Utilitarianism** picks Consistency + Suffering is Bad. **Result:** It implies killing happy people if they are below the average (the "Mere Addition Paradox").
  3.  **Critical Level Theories** try to split the difference. **Result:** They often imply the Sadistic Conclusion (adding suffering people can be better than adding happy ones).

  ### The Intuitive "Why"
  The deep reason this holds is because **human moral intuition is not linear.**

  We treat "Quality of Life" and "Number of Lives" as different *categories* of value, not just numbers on a single scale.
  *   When we look at a single person, we care about Quality.
  *   When we look at a charity, we care about Quantity (cost per life saved).

  Arrhenius proved that you cannot build a single mathematical function that respects our categorical intuition about Quality *and* our categorical intuition about Quantity *and* remains logically consistent across all scales.

  As you scale up the population, the "weight" of quantity inevitably overwhelms quality (leading to the Repugnant Conclusion), OR you have to arbitrarily cap the value of quantity, which breaks the math and implies that happy people sometimes don't count (leading to the Sadistic Conclusion).

  ### What does this mean for Effective Altruism?
  If you're in EA discords, you've probably seen people have existential crises over this. Here is the healthy way to view it:

  1.  **It doesn't mean "nothing matters."** It just means our ethical framework is incomplete. This is common in physics too (General Relativity and Quantum Mechanics are currently incompatible, but we still build bridges and iPhones).
  2.  **It forces humility.** We cannot be 100% confident that our current metric (like QALYs or DALYs) captures the *ultimate* moral truth.
  3.  **It shifts the focus.** Since we can't solve population ethics perfectly, many EAs focus on "robustly good" interventions (like reducing existential risk) where almost *all* theories agree the outcome is good, regardless of the population ethics math.

  **TL;DR:** Arrhenius proved that our moral intuitions about happiness, numbers, and logic are like a triangle where the sides don't meet. You can't draw the triangle. You have to cut one side. Either you accept a world of barely-livable masses (Repugnant), or you accept a math where adding suffering can be better than adding happiness (Sadistic). There is no third option that satisfies all basic logical conditions.
