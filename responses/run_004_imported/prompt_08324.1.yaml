          *   *Skeptical Theism:* This is hard for a seeker. It basically says "Trust anyway." Implication: Your lack of evidence isn't evidence of absence, but it doesn't give you positive evidence either. It asks for a leap.
          *   *Free Will/Developmental:* Does overwhelming evidence destroy freedom? Implication: God wants *love*, not just *assent*. A "sign" might force belief, but not trust.
          *   *Redefining "Nonresistance":* This is delicate. Don't blame the victim. But suggest that "resistance" isn't always moral sin; it could be intellectual barriers or expectations of *how* God speaks.
          *   *The Nature of the "Sign":* Catholic spirituality often distinguishes between *consolation* (feelings) and *faith* (will). Maybe the sign was subtle.
