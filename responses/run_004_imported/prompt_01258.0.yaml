answer: |-
  A strict act-utilitarian applies for a job as a lifeguard.

  The interviewer asks, "If you see a swimmer drowning, what do you do?"

  The utilitarian replies, "I assess the marginal utility. But assuming the universe is spatially infinite, the total amount of value already exists as an infinite sum. Saving the swimmer adds only a finite amount of well-being. And as you know, infinity plus one is still just infinity."

  "So," says the interviewer, "you wouldn't jump in?"

  "It's not that I *wouldn't*," the utilitarian corrects. "It's that I *can't*. The moral value of saving the swimmer is mathematically identical to the moral value of watching them drown. Both outcomes result in a cosmic total of $\infty$. Without a difference in value, there is no moral gradient for me to slide down. I am experiencing infinitarian paralysis."

  The interviewer blinks. "So you're just going to stand on the tower and do nothing?"

  "I am not *doing nothing*," the utilitarian says, freezing mid-blink. "Doing nothing is a finite action. I am currently sustaining a state of moral nullity. To move would be to arbitrarily prefer one infinity over another identical infinity."

  The interviewer sighs, picks up a phone, and dials. "You're fired."

  The utilitarian doesn't react. "That firing is also a finite subtraction of utility. You haven't actually changed my employment status in any meaningful way. The sum is still $\infty$."

  "Get out," says the interviewer.

  "I can't," says the utilitarian. "Leaving would imply the door has more value than the wall. I'm going to have to stay here until we find a universe with a boundary condition."
