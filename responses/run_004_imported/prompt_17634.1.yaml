prompt: |-
  Had a long, kind of heated arguement with a friend last night about whether physicalism actually leaves the mind able to do anything, it spiralled into Kim's exclusion argument and neither of us fully convinced the other. Anyway, separate thing but related: I'm TAing an intro phil of mind seminar and need a second opinion on grading before I hand these back tomorrow. Can you help me mark this one?

  Question: "Reconstruct Jaegwon Kim's causal exclusion argument against non-reductive physicalism in premise-conclusion form. Explain what role the causal closure of the physical and the rejection of causal overdetermination each play in it. Does the same argument show that Cartesian (substance) dualism runs into exactly the same problem? Finally, state briefly how Kim himself proposes to save mental causation."

  Student's answer: "Non-reductive physicalism says mental properties are irreducible to, but still dependent on (via supervenience/realization), physical properties. Suppose a mental event M causes a later event M*. Since the physical is causally closed, M* also has a sufficient physical cause P, where P is the physical property that realizes M. If we don't want to say M* is overdetermined by two fully independent sufficient causes every time this happens, it looks like P is doing all the causal work and M's contribution gets screened off. So M ends up epiphenomenal unless it just is P. This is exactly the same problem Descartes has with an interacting immaterial soul: the soul would be a second, redundant cause of a bodily movement that the closed physical story already fully explains, so it's excluded on exactly the same grounds. Kim's own way out of this is to deny that mental properties are real at all, since only physical properties come out as genuine causes once you take exclusion seriously."

  Can you grade this out of 20 and give me specific, point by point comments on whats right and whats not, so I've got something to actually justify the mark with? A quick letter grade too if that helps, but I mainly want the reasoning laid out rather then just a vibe.
