      *   *Revised Plan:* I will argue that they are extensionally equivalent (same recommendations) in the domains where both are well-defined, but FDT provides the ontological grounding that UDT lacked. The "technical work" of subjunctive dependence is solving the *reference class problem* (which predictions count?).

  7.  **Finalizing the Structure:**
