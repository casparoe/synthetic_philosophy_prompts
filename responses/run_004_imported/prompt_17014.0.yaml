      *   *FDT (2017):* Focuses on the *decision procedure* itself. It argues that your decision is the output of a fixed algorithm. It introduces "subjunctive dependence" (logical correlation) to explain *why* your decision affects the predictor's prediction. It explicitly contrasts with CDT (Causal) and EDT (Evidential).
      *   *Relationship:* FDT is widely considered a formalization and refinement of UDT. UDT was somewhat informal/pseudocode. FDT tried to put it on firmer mathematical ground (using proof-based decision theory concepts, though FDT itself is often presented more conceptually).
      *   *Key Distinction:* UDT emphasizes the *timing* of the decision (updateless). FDT emphasizes the *mechanism* of correlation (subjunctive/logical).
      *   *Substantive Difference?* Most experts in the field view them as effectively equivalent in output for standard problems, but FDT provides a clearer ontology for *why* the correlations exist, which helps in edge cases (like Newcomb's with a non-perfect predictor, or situations involving logical uncertainty). However, there are debates about "prior dependence" in UDT vs. "algorithm identity" in FDT.

