answer: |-
  This is one of the sharpest questions one can ask about the modern landscape of decision theory. You have correctly identified the two poles of the discussion: Wei Dai's **Updateless Decision Theory (UDT)**, which emphasizes *policy selection relative to a prior*, and Yudkowsky/Soares' **Functional Decision Theory (FDT)**, which emphasizes *subjunctive dependence between algorithmic outputs*.

  My thesis is this: **FDT is best understood as the conceptual and ontological completion of UDT.** In terms of action-guidance (extensional equivalence), there is no standard decision problem where a well-specified UDT agent and a well-specified FDT agent recommend different actions. However, "subjunctive dependence" does genuine technical work: it solves the *reference class problem* that UDT leaves hidden inside the prior, and it provides a robust account of *why* the correlations exist, rather than treating them as brute facts of probability.

  Here is the detailed breakdown.

  ### 1. The Core Mechanisms: Policy vs. Algorithm

  **UDT (The "When" of Decision):**
  UDT's primary innovation is temporal. It argues that the only time you are truly free to choose is *before* you have received any observations that correlate with the outcome.
  *   **Mechanism:** You choose a policy $\pi$ (a mapping from observations to actions) that maximizes expected utility relative to your prior $P$.
  *   **The Knot:** UDT requires your prior $P$ to encode all the correlations between your policy and the world. If Omega predicts you, $P(\text{Omega predicts One-Box} | \pi = \text{One-Box})$ must be high. UDT doesn't explain *why* this conditional probability is high; it simply demands that your prior reflect the structure of the universe.

  **FDT (The "What" of Decision):**
  FDT's primary innovation is ontological. It argues that your decision is not an event in spacetime, but the output of a fixed computation.
  *   **Mechanism:** You choose an action $a$ by asking: "If the output of my decision algorithm $F$ were $a$, what would the world look like?" This involves evaluating logical counterfactuals.
  *   **The Knot:** FDT explicitly models **subjunctive dependence**. If Omega simulates you, Omega is running (a approximation of) $F$. Therefore, the output of Omega's prediction is logically dependent on the output of your decision. You don't need a prior that "knows" this; you need a world model that recognizes the *computational identity*.

  ### 2. Does "Subjunctive Dependence" Do Technical Work?

  You asked whether subjunctive dependence is merely intuition-pumping or if it performs work that "policy selection under a fixed prior" cannot.

  It performs **reference class work**.

  In Evidential Decision Theory (EDT), you condition on your action: $P(\text{Outcome} | \text{I do } A)$. The failure mode of EDT is the *Smoking Lesion*: you correlate with cancer because of a common cause (the lesion), not because your decision causes cancer. EDT fails because it cannot distinguish between *causal* correlation and *accidental* statistical correlation.

  UDT solves this by moving the decision to $t=0$. But how does the UDT agent know to link its policy to Omega's prediction but *not* to the Smoking Lesion? It must be built into the **prior**. If the agent's prior is wrong about the structure of the correlation, UDT fails.

  FDT makes this structural dependence explicit. Subjunctive dependence is not a probability; it is a logical relation.
  *   **UDT says:** "My prior assigns 99% probability that Omega predicts what I policy-select."
  *   **FDT says:** "Omega's prediction is the output of the same function I am computing. Therefore, the values are identical."

  The technical work here is **generalization**. If you encounter a Newcomb-like problem with a predictor you have never seen before, a UDT agent needs a prior that already covers this possibility. An FDT agent only needs to recognize that the predictor is simulating its algorithm. FDT decouples rationality from the specific contents of the prior and couples it to the *computational structure* of the situation.

  ### 3. Concrete Test Case: Counterfactual Mugging

  Let's apply both to **Counterfactual Mugging**, as it highlights the "updateless" vs. "logical" tension.

  **The Setup:**
  Omega flips a fair coin.
  *   **Heads:** Omega asks you for \$100. (No money is given regardless).
  *   **Tails:** Omega gives you \$10,000 *if and only if* Omega predicted you would have given \$100 had the coin come up Heads.
  *   You observe **Heads**. Omega asks for \$100.

  **The UDT Analysis:**
  1.  **Time $t=0$ (Before Coin Flip):** You consider policies.
      *   Policy "Give if Heads": Expected Utility = $0.5 \times (-\$100) + 0.5 \times (\$10,000) = \$4,950$.
      *   Policy "Don't Give if Heads": Expected Utility = $0.5 \times \$0 + 0.5 \times \$0 = \$0$.
  2.  **Decision:** You commit to "Give if Heads."
  3.  **Time $t=1$ (After Observing Heads):** You have observed Heads. A Causal Decision Theorist updates and says, "The Tails world is gone. Paying loses \$100."
  4.  **UDT Verdict:** You ignore the observation for the purpose of policy selection. You execute the policy chosen at $t=0$. **Pay the \$100.**

  **The FDT Analysis:**
  1.  **Algorithm:** Your decision is the output of function $F(\text{Observation})$.
  2.  **Dependence:** Omega's prediction in the Tails world was a simulation of $F(\text{Heads})$.
  3.  **Logical Counterfactual:** You ask, "What if $F(\text{Heads})$ returns 'Don't Pay'?"
      *   If $F(\text{Heads}) = \text{'Don't Pay'}$, then the simulation in the Tails world returned 'Don't Pay'.
      *   Therefore, in the Tails world, you get \$0.
      *   In the Heads world (actual), you save \$100.
      *   Total Utility (across logical possibilities weighted by prior): Low.
  4.  **FDT Verdict:** To maximize the output of $F$ across all subjunctively dependent nodes, $F(\text{Heads})$ must return 'Pay'. **Pay the \$100.**

  **Is there a divergence?**
  No. Both recommend paying.
  **Where is the difference?**
  *   **UDT** justifies this via *binding your future self*. It feels like a pre-commitment device. "I am doing this because my past self wanted me to."
  *   **FDT** justifies this via *logical identity*. It feels like a mathematical truth. "I am doing this because 'I' (the algorithm) am present in the Tails world via the simulation."

  ### 4. Is There Any Case Where They Diverge?

  If both are perfectly specified, **no**. FDT is essentially UDT with a specific prescription for how to construct the world model (causal graph + logical nodes).

  However, divergence can appear in **meta-decision problems** regarding **Logical Uncertainty**.

  **The Scenario: Agent Simulates Predictor (ASP)**
  Suppose the Predictor is not perfect, but simulates you for a limited time. You, the agent, can also simulate the Predictor.
  *   **UDT:** Requires a prior over the Predictor's source code and its relationship to yours. If the prior is ambiguous about whether the Predictor is simulating *you* or a *simplified version* of you, UDT may struggle to assign the correct conditional probabilities.
  *   **FDT:** Explicitly asks, "Is the Predictor's output subjunctively dependent on *my* algorithm?" If you can prove that the Predictor is running a subroutine identical to your decision function, FDT cooperates. If the Predictor is running a heuristic approximation, FDT might defect (depending on the strength of the logical correlation).

  In this edge case, FDT provides a clearer criterion for *degree* of correlation. UDT tends to treat correlation as a binary probability in the prior. FDT allows for a gradient of "logical similarity," which is technically more expressive for problems involving bounded rationality.

  ### 5. Which is the More Satisfying Foundational Account?

  I consider **Functional Decision Theory (FDT)** to be the more satisfying foundational account, for two reasons:

  **1. It Naturalizes Agency.**
  UDT still feels slightly "magical" because it relies on a prior that knows about future predictions. It asks, "How did your prior know Omega was a predictor?" FDT answers this by saying, "It doesn't matter what the prior is; what matters is the computational structure." FDT aligns better with a physicalist worldview where agents are algorithms embedded in a causal universe. It explains *acausal trade* not as spooky action at a distance, but as two instances of the same function returning the same value.

  **2. It Solves the "Why" of Updatelessness.**
  UDT tells you *to* be updateless. FDT tells you *why* you must be updateless.
  In UDT, updatelessness is a constraint on when you maximize utility. In FDT, updatelessness is a consequence of the fact that your decision is a logical fact that exists timelessly. You cannot "update" on a mathematical truth (e.g., $2+2=4$) without becoming irrational. If your decision is a logical output, observing the coin flip in Counterfactual Mugging is no more reason to change your decision than observing the coin flip is reason to change the fact that $2+2=4$.

  **The Caveat:**
  UDT is currently easier to write down as a formal equation ($\text{argmax}_\pi E[U|\pi]$). FDT relies on a theory of **logical counterfactuals** which is not yet fully formalized (though research in proof-based decision theory and modal logic is progressing). UDT is a better *tool* for calculation today; FDT is a better *theory* of what rationality *is*.

  ### Conclusion

  The terminological knot you are struggling with is real, but it is a knot of **exposition**, not **extension**.

  *   **UDT** is the *syntax*: It gives you the equation for rational choice (maximize over policies).
  *   **FDT** is the *semantics*: It tells you what the variables in that equation refer to (computational outputs and logical dependencies).

  "Subjunctive dependence" is not just vivid machinery; it is the mechanism that allows the agent to identify *which* correlations in the prior are relevant for decision-making. Without it, UDT risks degenerating into EDT (if the prior captures accidental correlations) or CDT (if the prior ignores logical ones).

  If you must choose one to build your worldview on: **Adopt UDT's math, but view it through FDT's ontology.** Treat your decision as the selection of a policy (UDT), but understand that the reason that policy correlates with predictions is because both are instantiations of the same logical function (FDT). This hybrid view captures the rigor of Dai's original insight with the explanatory power of Yudkowsky and Soares' refinement.
