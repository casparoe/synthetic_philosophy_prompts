      *   *Technical Work:* Does "subjunctive dependence" add anything? It clarifies the *scope* of the correlation. UDT relies on the prior encoding the correlation. FDT makes the correlation explicit in the decision rule. This matters when the prior is ambiguous or when dealing with logical uncertainty (mathematical intuition modules).
