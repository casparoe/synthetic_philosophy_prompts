      *   *Answer 1:* He is entitled *within his system*, but the analogy to persons breaks down because the State is the *solution* for persons, not the *problem* to be solved.
      *   *Answer 2:* It is not merely Hobbesian (contingent absence of power); it is conceptual (sovereignty cannot be alienated).
      *   *Answer 3:* Yes, his framework rules out a genuine World State as ethically desirable or stable.

