      *   *The "Obvious Reply":* Carnap distinguishes between internal questions (within a framework) and external questions (choice of framework). Politics might be an internal question within a "scientific" framework. But how do we justify adopting the "scientific" framework itself? If that adoption is tolerant/conventional, then the politics flowing from it are contingent, not necessary.
      *   *Neurath's Role:* Neurath was more explicitly political (Marxist leanings, physicalism). He saw unity of science as a tool for social engineering.
      *   *The Argument Strategy:* I need to show that the *methodological* commitment to tolerance bleeds into the *substantive* commitment to planning. If the justification for planning relies on "scientific rationality," and "scientific rationality" is just a linguistic framework chosen by tolerance, then planning loses its objective normative force. It becomes just another "game" we play.

  3.  **Developing the Argument (Step-by-Step):**

      *   **Introduction:** State the thesis clearly. The Principle of Tolerance undermines the normative force required to advocate for rational planning as *the* solution.
      *   **Section 1: Explicating Tolerance.** What does it actually mean? "In science, there are no morals." It's anti-metaphysical. It makes logic syntax. Choice is pragmatic.
      *   **Section 2: The Vienna Circle's Political Ambition.** They weren't just armchair logicians. They wanted social reform. Planning = Rationality. Custom/Capitalism = Metaphysics/Chaos.
