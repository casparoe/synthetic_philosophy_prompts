          *   Therefore, you cannot claim planning is *objectively* better, only that it is useful *if* you accept certain goals. But Tolerance says even those goals are framework-relative.
      *   **Section 4: Addressing the "Obvious Reply" (Formal vs. Substantive).**
          *   *The Reply:* Tolerance is for logic syntax (e.g., classical vs. intuitionistic), not for socialism vs. capitalism.
          *   *The Rebuttal:* The Vienna Circle conflated the two. They viewed "metaphysical" politics (traditionalism, unregulated markets) as akin to bad syntax. They believed the *method* of science dictated the *structure* of society.
          *   *Deep Rebuttal:* Even if we grant the distinction, the *justification* for using science to plan society relies on the superiority of the scientific framework. If Tolerance holds, that superiority is pragmatic, not absolute. If a capitalist says "My framework values individual liberty over efficiency," Tolerance says "Okay, choose that language." The Planner cannot say "You are wrong," only "You are inconvenient." This strips the political project of its moral urgency.
      *   **Section 5: Neurath's Physicalism and the Bridge.** Neurath tried to bridge this with "physicalism" and protocol sentences. But even protocol sentences are subject to coherence and choice. The "unity of science" is a stipulation, not a discovery.
