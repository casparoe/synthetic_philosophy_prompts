answer: |-
  The highway was a ribbon of black oil cutting through the desert, the only light coming from the dashboard's amber glow and the white tunnel of the headlights. The truck's engine hummed a low, steady note, a physical vibration that seemed to underscore the silence between them. Vera watched the mile markers slide by, feeling the weight of the envelope of cash in her lap.

  "Parfit's Hitchhiker," Vera said. She hadn't meant to say it aloud, but the shape of the trap was too perfect to ignore.

  Nadia didn't look away from the road. Her hands were at ten and two, relaxed but immovable. "I tell my students not to name the monsters. It makes them seem smaller."

  "It's not a monster. It's a mirror. You're asking me to prove I'm not a rational agent."

  Nadia snorted, a dry sound. "I'm asking you to prove you're not a *thief*. There's a difference. Look, Vera. I picked you up forty miles back. The causal chain is simple. I give you a ride, you get to town, you go to the ATM, you Venmo me. But once you're standing on that sidewalk with your phone in your hand, what causal lever do I have? None. The ride is already consumed. The money is gone. If you keep it, you're richer by two hundred bucks. If you pay me, you're poorer. A rational actor maximizes utility. At the moment of payment, paying is a loss. So, a rational actor doesn't pay."

  "That's straightforward maximization," Vera said. "It's narrow. It assumes the decision happens in town."

  "Where else would it happen?"

  "At the roadside," Vera said. "That's where the commitment is made. If I decide now, while I need you, that I will pay you later, I have to bind my future self. If I reserve the right to change my mind once I'm safe, then I'm not actually making a promise now. I'm just making a noise."

  Nadia shifted gears, the truck groaning slightly as they hit a long, uphill grade. "That sounds like magic. How does a thought you had forty minutes ago force your hand when you're warm and safe? That's not rationality, Vera. That's just stubbornness dressed up in a suit. You're saying I should pay because I said I would, even when paying hurts me. That's not logic. That's a sunk cost fallacy with a moral gloss."

  "It's not about the cost," Vera said, turning in her seat. "It's about the agent. You're treating yourself like a series of snapshots. Snapshot One is at the roadside. Snapshot Two is in town. Snapshot Two says, 'Snapshot One isn't me anymore. I don't have to honor that.' But if you do that, you aren't an agent. You're a thermostat. You just react to the immediate temperature."

  "I react to reality," Nadia corrected. "And the reality is, five people have sat in this seat and told me they were good for it. Five people who, according to your logic, decided to be 'the kind of person who pays.' But when they got to the ATM, the math changed. The math always changes. If I believe your theory, I have to believe you'll pay me even when it makes no sense to pay me. That requires faith, not decision theory."

  " It requires recognizing that the calculation was already done," Vera said. "If I recalculate now, I'm admitting that my initial decision was a lie. You say my view is irrational because it forces me to lose money in town. I say your view is irrational because it makes it impossible for you to get the ride in the first place. If everyone thought like you, Nadia, no one would ever pick up a stranded driver. You'd be driving alone. Your own theory creates a world where you can't achieve your own goals."

  Nadia's eyes flicked to the rearview mirror, catching Vera's gaze. The reflection was sharp, tired. "So I'm supposed to be irrational to get what I want? That's the pitch?"

  "No. You're supposed to understand that rationality isn't just about winning the hand you're dealt. It's about being the kind of player who gets invited to the table. If you're the kind of person who defects the second enforcement disappears, you reveal that you were never a cooperator. You're just a defector waiting for an opportunity."

  "That's circular," Nadia said, her voice tightening. "I should keep my promise because I'm a promise-keeper? Why should I be a promise-keeper?"

  "Because if you aren't, you can't solve problems that require trust. You're stuck in a local maximum. You save two hundred bucks today, but you condemn yourself to a life where you can't rely on anyone, and no one can rely on you. You're arguing that it's rational to be the kind of person who makes cooperation impossible."

  Nadia tapped the steering wheel. The lights of the town were beginning to smear on the horizon, a faint orange bruise against the dark sky. "You're dodging the hard part. In town, the money is real. The principle is abstract. You're asking me to sacrifice the real for the abstract. And you're asking me to believe you'll do the same. But I know how brains work. I know how we rationalize. In town, you'll tell yourself, 'She's insured,' or 'She's wealthy enough,' or 'I need this more.' You'll update. And if you update, you're being rational by my lights."

  "And if I update," Vera said softly, "I prove that I'm not the person you picked up. You didn't pick up a body, Nadia. You picked up a commitment. If I break it, I'm not showing that I'm rational. I'm showing that I don't exist as a continuous self. I'm just a series of impulses."

  "Maybe that's all we are," Nadia said. "Maybe the 'continuous self' is just a story we tell to make the impulses feel noble."

  The truck crested the hill. The town opened up below them, grid lines of streetlights, the promise of warmth and ATMs and endings. The cab felt suddenly smaller, the air thinner.

  "So," Nadia said, her hand hovering near the turn signal. "We're here. The causal link is broken. I have nothing over you. You have everything you need. By my math, you walk away. By your math, you pay. But here's the kicker, Vera. Even if you pay me, I can't know if you did it because you're a 'constrained maximizer' or just because you're afraid I'll call the cops. So I still haven't solved the problem. I still don't know if you're rational or just scared."

  Vera looked at the envelope in her lap. She could feel the texture of the paper through the denim of her jeans. "And you still won't know if you don't let me out."

  Nadia held the truck at a stoplight at the edge of town. The engine idled, shaking the frame. She looked at Vera, then at the road ahead, then back at Vera. The light turned green. She didn't move immediately.

  "My theory says I should drive you to the police station," Nadia said quietly. "Just to be sure."

  "Your theory says you should have left me at the roadside," Vera replied. "But you didn't."

  Nadia's foot hovered over the brake. For a second, the only sound was the tick of the cooling engine and the distant hum of the desert night. Then she lifted her foot and pressed the gas, rolling into the town limits.

  "Get your card out," Nadia said, not looking at her. "Don't make me calculate the utility of watching you do it."

  Vera didn't move the envelope. "Will you believe me when I hand it over?"

  "No," Nadia said. "I'll believe the transaction log. The rest is just noise."

  "Then you're still alone in the cab," Vera said.

  "Then I'm still alone," Nadia agreed.

  She pulled up to the curb outside the all-night diner. The engine cut. The silence rushed back in, heavier than before. Neither of them moved to unlock the doors.
