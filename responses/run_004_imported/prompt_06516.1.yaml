      },
      {
        "criterion": "Kim's Solution (Part C)",
        "score": 1.5,
        "max_score": 3.0,
        "justification": "Correctly names functional reduction, but incorrectly asserts it applies to qualia; Kim argues qualia resist functionalization."
      },
      {
        "criterion": "Clarity and Precision",
