answer: |-
  Your intuition is spot-on, and it is a testament to your seminar's depth that this connection was raised at all. In many undergraduate curricula, Sidgwick is presented as the dry, systematizing culmination of classical utilitarianism, and his involvement with the Society for Psychical Research (SPR) is treated as a curious, embarrassing footnote—a Victorian eccentricity akin to Conan Doyle's belief in fairies.

  However, contemporary Sidgwick scholarship has largely moved away from dismissing this as a mere hobby. The consensus among leading experts is that Sidgwick's psychical research was not a departure from his philosophy, but rather a **continuation of it by other means.**

  Here is a detailed breakdown of how Sidgwick understood the connection, why he sought empirical evidence specifically, and how scholars currently interpret this relationship.

  ### 1. The Philosophical Necessity: The Dualism of Practical Reason
  To understand why Sidgwick sat through séances, one must understand the specific shape of the problem he left unresolved in *The Methods of Ethics* (1874).

  Sidgwick identifies three "methods" of ethics: Intuitionism, Egoistic Hedonism, and Universalistic Hedonism (Utilitarianism). He argues that both Egoism and Utilitarianism are rationally defensible.
  *   **Rational Egoism** dictates that I ought to maximize my own happiness.
  *   **Rational Utilitarianism** dictates that I ought to maximize the general happiness.

  In a world without divine governance, these two demands can conflict. If sacrificing my life or happiness benefits the world but destroys me, Utilitarianism says "do it," and Egoism says "don't." Sidgwick calls this the **"Dualism of Practical Reason."** He concludes the *Methods* by admitting that reason is thus divided against itself, which he finds philosophically intolerable. He writes:

  > *"The conflict between the two supreme practical principles... can be avoided only by supposing that the universe is so constituted that in the long run the happiness of the individual and the happiness of the whole coincide."*

  Historically, Christianity resolved this via **divine sanctions**: God ensures that virtue is rewarded and vice punished in the afterlife. Sidgwick, however, had lost his Christian faith (a crisis he underwent in the 1860s). He could not return to dogmatic theology, yet he could not accept a universe where morality was ultimately irrational.

  ### 2. Why Empirical Evidence? Why Not Faith or Argument?
  This is the crux of your question. If Sidgwick needed a harmony of interests, why not just construct a better philosophical argument, or return to the Church of England?

  **Against Pure Philosophy:**
  Sidgwick believed he had already exhausted the philosophical route. In the *Methods*, he demonstrates that the axioms of Egoism and Utilitarianism are both self-evident to reason. You cannot derive one from the other without introducing a new premise. Pure logic cannot bridge the gap between "my good" and "the general good." A new *fact* about the universe is required, not a new *argument*.

  **Against Religious Faith:**
  Sidgwick was a rigorous empiricist and agnostic. He famously argued for "esoteric morality"—the idea that some truths (like the lack of religious foundation for morality) should be kept from the general public to prevent social collapse. He could not personally revert to faith because he found the evidence for Christian dogma lacking. To accept religion on faith alone would violate his own epistemological standards.

  **For Empirical Psychical Research:**
  Sidgwick viewed the SPR not as a spiritualist club, but as a **scientific extension of ethics.**
  *   **The Hypothesis:** If a future life exists where rewards and punishments are meted out, the conflict between Egoism and Utilitarianism dissolves. Being moral becomes rational for the egoist because the "long run" includes eternity.
  *   **The Method:** Since the existence of a future life is a claim about reality, Sidgwick believed it should be testable. If telepathy or survival of death could be proven via the scientific method (observation, testimony, elimination of fraud), it would provide the **empirical premise** needed to complete the ethical system.

  In an 1886 letter to his former student, Arthur Balfour, Sidgwick wrote:
  > *"I do not see how the conflict [of duty and interest] can be got rid of except by the hypothesis of a future life... I am therefore anxious to get evidence for a future life."*

  For Sidgwick, investigating mediums was not about talking to dead relatives; it was about gathering data points to validate the "sanctions" necessary to make Utilitarianism rationally binding on the Egoist. He was attempting to save the *function* of religion (moral sanctions) without the *dogma* of religion, using the tools of science.

  ### 3. Contemporary Scholarly Interpretation
  For much of the 20th century, philosophers like C.D. Broad and J.B. Schneewind acknowledged the SPR connection but tended to bracket it off to focus on the *Methods*. However, the last 30 years have seen a significant shift, largely driven by the work of **Bart Schultz**.

  **The "Unity" Thesis (Schultz):**
  In his definitive biography, *Henry Sidgwick: Eye of the Universe* (2004), Bart Schultz argues vigorously that the SPR work is a **coherent extension of Sidgwick's ethical theory.**
  *   Schultz posits that Sidgwick's entire life project was the search for a "scientific" basis for morality.
  *   He argues that Sidgwick's secrecy regarding his loss of faith and his hope for psychical evidence is of a piece with his theory of "esoteric morality." Sidgwick feared that if the public knew he thought morality required a religious sanction he couldn't prove, it would undermine public virtue.
  *   Schultz treats the SPR not as a descent into irrationality, but as a desperate, consistent attempt to apply scientific empiricism to the one area (consciousness/survival) that could resolve the dualism.

  **The "Existential/Tragic" View (Crisp, Penelhum, Others):**
  Other scholars, such as Roger Crisp and Terence Penelhum, acknowledge the logical link but emphasize the **tragic** dimension.
  *   They argue that while Sidgwick *thought* it was a coherent extension, it reveals the fragility of his system. The fact that the greatest utilitarian systematizer had to rely on the hope of ghost-hunting to make his ethics work suggests a failure of secular moral philosophy.
  *   From this view, the SPR work is "coherent" but "desperate." It is not merely a hobby, but it is a search for existential reassurance that his philosophy could not provide on its own.

  **The Consensus:**
  Almost no serious Sidgwick scholar today treats the SPR as a mere unrelated hobby. The chronology is too tight (the SPR is founded shortly after the *Methods* gains traction, and Sidgwick remains involved until his death). The view that it was "just a hobby" is now considered a misunderstanding of Sidgwick's radical empiricism. He believed that *all* claims about reality, including metaphysical ones, were subject to empirical verification.

  ### 4. Summary for Your Seminar
  If you are discussing this in your seminar, you might frame it this way:

  Sidgwick is often caricatured as a cold rationalist, but his involvement with the SPR reveals him to be a **radical empiricist** who took the implications of his own ethics more seriously than his critics realized.
  1.  **The Problem:** The Dualism of Practical Reason makes morality irrational without a guarantee that virtue leads to happiness.
  2.  **The Constraint:** Sidgwick cannot use theological dogma (he is an agnostic) and cannot use pure logic (he proved it fails).
  3.  **The Solution:** He must find empirical evidence of a "future life" to provide the necessary sanctions.
  4.  **The Verdict:** The SPR was the laboratory where he hoped to find the missing premise of *The Methods of Ethics*.

  Sidgwick ultimately died without finding the proof he sought. He remained an agnostic to the end, leaving the Dualism unresolved. This adds a layer of profound tragedy to his philosophy: he constructed the most rigorous defense of Utilitarianism in the 19th century, only to conclude that it might be rationally unsustainable without a supernatural fact he could not prove.

  **Recommended Reading for Further Detail:**
  *   **Bart Schultz, *Henry Sidgwick: Eye of the Universe* (2004).** Specifically chapters 10 and 18. This is the standard text on the SPR/Ethics link.
  *   **Sidgwick's *Letters*:** Look for correspondence with Frederic Myers and Edmund Gurney.
  *   **J.B. Schneewind, *Sidgwick's Ethics and Victorian Moral Philosophy* (1977).** For the classic analysis of the Dualism, though less focused on the SPR.
  *   **Roger Crisp, *Henry Sidgwick* (in the Past Masters series).** For a concise overview of the tension.

  Your professor's "aside" was arguably one of the most important points in the course. It transforms Sidgwick from a systematizer of common sense into a figure wrestling with the limits of secular reason itself.
