          *   *Alienation vs. Regulation:* Slavery alienates the *power* to choose. Ulysses contracts regulate *specific choices* to preserve the *overall capacity* to choose.
          *   *Revocability:* Can the person get out of it? If yes, it's not total alienation.
          *   *Rationality:* Mill distinguishes between civilized beings and those incapable of self-government (children, "backward" societies). A manic episode might temporarily render someone akin to a child in terms of rational capacity.

  5.  **Drafting the Response - Section by Section:**

