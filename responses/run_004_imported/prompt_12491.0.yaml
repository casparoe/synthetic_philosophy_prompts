answer: |-
  **The Wretchedness of Law: Pascal, Derrida, and the Limits of Deconstruction**

  The fragment is one of the most cited in political philosophy: "Justice without force is powerless; force without justice is tyrannical." Blaise Pascal, in the *Pensées*, observes that because we cannot make what is just strong, we have made what is strong just. Jacques Derrida, in his seminal essay *Force of Law*, seizes upon this passage. He pairs it with a similar sentiment in Montaigne to argue that all legal authority rests on a "mystical foundation"—a founding act of violence that precedes the law and therefore cannot be justified by it. For Derrida, Pascal is a proto-deconstructionist, exposing the inherent instability and arbitrariness of legal systems.

  But this reading requires a specific kind of blindness. It requires ignoring the fact that Pascal was not writing a treatise on jurisprudence, but an apology for the Christian faith. To decide whether Pascal is truly making Derrida's radical move, we must weigh the structural insight against the theological teleology. When we engage Pascal's broader arguments on custom, power, and the "three orders," the verdict becomes clear: Derrida is right about the mechanism Pascal describes, but wrong about the metaphysics Pascal inhabits. Pascal is not deconstructing justice; he is diagnosing sin. To call him a proto-deconstructionist is to secularize a theological crisis, mistaking Pascal's ladder for the ground he stands on.

  Derrida's reading in *Force of Law* is undeniably seductive. He focuses on the *aporia* Pascal identifies: the moment of founding a law is a performative act of force that is neither legal nor illegal, because the law does not yet exist to judge it. Derrida writes that this foundation is "mystical" because it relies on a silence—the silence of the law regarding its own origin. He sees Pascal as uncovering the dirty secret of sovereignty: that legitimacy is a retroactive fiction draped over violence. In this light, Pascal's claim that we "made strength just" is an admission that justice is a linguistic effect of power, not a transcendental truth. This aligns perfectly with the deconstructive project, which seeks to show how binary oppositions (just/unjust, law/violence) collapse under scrutiny.

  However, this reading isolates the fragment from the engine of the *Pensées*. Pascal's project was to humble the *honnête homme* (the worldly intellectual) to prepare him for grace. His argument about the arbitrariness of human justice is not an ontological claim that Justice does not exist; it is an anthropological claim that *humans* cannot access it through reason or power alone.

  To understand why Derrida's appropriation is a misreading, we must look at Pascal's theory of custom. Pascal famously writes, "Custom is our nature." He observes that we obey laws not because they are inherently rational, but because they are established. A river that marks a border makes one side "just" and the other "unjust" simply by existing. Derrida reads this as the triumph of signification over truth. But for Pascal, this is evidence of the Fall. Human reason is corrupted by *concupiscence* (self-interest). We cannot perceive true justice because our nature is broken. The arbitrariness of law is not a structural feature of language, as it might be for a post-structuralist; it is a historical and spiritual consequence of Original Sin. Pascal is not saying "there is no truth"; he is saying "you are too broken to see it without God."

  This distinction becomes undeniable when we introduce Pascal's doctrine of the "three orders." Pascal divides existence into the order of Flesh (power, wealth, kings), the order of Mind (science, philosophy), and the order of Charity (saints, God). He insists there is an "infinite distance" between these orders. No amount of power (Flesh) can buy wisdom (Mind), and no amount of wisdom (Mind) can buy salvation (Charity).

  Derrida's reading collapses these orders. By focusing on the "mystical foundation of authority," Derrida treats the political realm (Flesh) as the only arena where justice is negotiated. He implies that because human law is founded on violence, Justice itself is always "to come," forever deferred. But Pascal explicitly rejects this. For Pascal, True Justice *does* exist, but it resides exclusively in the third order: Charity. It is not deferred; it is revealed in Christ. When Pascal says human justice is arbitrary, he is not deconstructing the concept of Justice; he is contrasting the fake justice of the Flesh (law) with the true Justice of Charity (God).

  If Pascal were a proto-deconstructionist, he would leave us in the aporia, dwelling in the undecidability of the law. He does the opposite. He uses the instability of human law to force a crisis. He wants the reader to feel the vertigo of a world where "truth this side of the Pyrenees, error on the other," so that they despair of human solutions and turn to faith. The "mystical foundation" Derrida identifies is, for Pascal, simply the silence of a world without grace. It is not a philosophical puzzle to be analyzed; it is a spiritual wound to be healed.

  Furthermore, Pascal's view on power clarifies this divergence. Pascal acknowledges that kings rule by force, but he notes they also employ "plausible reasons" to mask that force. Derrida sees this masking as the essential operation of law. Pascal sees it as a necessary restraint on human wickedness. Force is required to keep the peace among fallen men, not because peace is an illusion, but because human sin makes violence inevitable. The law is a dam against chaos, not a text to be deconstructed. Pascal submits to the king's authority not because it is fundamentally just, but because rebellion causes greater disorder. This is a pragmatic, theological conservatism, not a radical skepticism.

  So, is Pascal making the radical move Derrida credits him with? The answer is no. Derrida is guilty of a creative misprision. He extracts Pascal's *diagnosis* of the human political condition while discarding Pascal's *cure*. Pascal exposes the violence at the heart of human law more ruthlessly than almost any thinker before Nietzsche, but he does so to point beyond the human. He argues that human justice is a shadow, but he believes in the Substance casting the shadow. Derrida argues there is no Substance, only the play of shadows.

  To call Pascal a proto-deconstructionist is to ignore the "infinite distance" he places between human convention and Divine truth. Derrida secularizes Pascal's "mystical." For Pascal, the foundation is mystical because it is hidden by sin and revealed only by God. For Derrida, it is mystical because it is structurally inaccessible to reason. One is a theological mystery solvable by grace; the other is an epistemological limit inherent to language.

  Ultimately, Pascal's fragment is not a celebration of the undecidability of justice, but a lamentation of its absence in the worldly sphere. He does not want us to rest in the realization that force makes right; he wants us to be horrified by it. Derrida wants us to recognize the violence of the foundation to remain ethically vigilant. Pascal wants us to recognize it to repent.

  The verdict, then, is that Derrida reads Pascal *against* Pascal. He utilizes Pascal's ruthless critique of human institutions to build a secular philosophy of law, but in doing so, he strips the *Pensées* of its heart. Pascal is not arguing that authority rests on a mystical foundation in the sense of an endless deferral of meaning. He is arguing that human authority is a usurpation of God's authority. The "mystery" is not the silence of the law, but the silence of God in a fallen world. Pascal is not a deconstructionist waiting for a Justice that never arrives; he is a Christian waiting for a King who has already come, but whose kingdom is not of this world. To conflate the two is to mistake the scaffold for the building. Pascal builds a bridge to God; Derrida cuts the bridge to show us the abyss. Pascal knew about the abyss; he just refused to live there.
