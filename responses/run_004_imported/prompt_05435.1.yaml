answer: |-
  (Walk to the podium. Don't shuffle papers. Look at the room for a solid five seconds before speaking. Acknowledge the mix of people.)

  Good morning.

  I want to start by pointing out the physical arrangement of this room. There is a front, where I am standing. There is a back, where the pizza is warming. There is a boundary between the organizers, who are currently sweating slightly about whether the Wi-Fi will hold, and the participants, who are hopefully wondering if the bagels are worth the time commitment.

  In a standard model of agency, this distinction would be clean. I would be the agent, outputting speech acts. You would be the environment, or perhaps a collection of other agents, processing inputs. We would have well-defined interfaces. I speak; you listen. We optimize for information transfer; we converge on a shared understanding.

  But if we actually believed that model worked, we wouldn't be here this weekend.

  We are here because that clean boundary is a lie. It's a useful lie for building calculators, and maybe even for building chess engines. But it is a catastrophic lie for building systems that need to operate in the real world, or for understanding the systems that are currently operating this room.

  I'm not going to stand here and give you a textbook definition of "embedded agency." If I told you it's just "an agent inside its environment," I would be lying to you, and the people in the front row would rightfully stop listening. Because the problem isn't location. It's not that the robot is physically inside the room. The problem is that the robot is *made of* the room.

  The core tension we are grappling with this weekend is the problem of self-reference in a finite universe.

  Imagine you are trying to hold a map of a territory. In the Cartesian view, you hold the map in your hands, outside the territory. You can check the map against the land. You can update.

  In the embedded view, the map must be printed *on* the territory. The map must contain a representation of itself, which contains a representation of itself, ad infinitum. You are trying to fit a model of yourself, inside a model of the world, which is strictly smaller than the world itself. You are trying to use your brain to think about your brain, while using your brain.

  This creates specific, gnarly pathologies.

  For those of you new to the safety vibe: this is why "just turn it off" is hard. If an agent is embedded, its off-switch is part of the environment, which is part of its model, which is part of its optimization target. It has an incentive to model you, the switch-presser, as a causal variable to be managed.

  For those of you who live in the math: this is why counterfactuals break. When an embedded agent asks "What happens if I do X?", it cannot simulate a world where it does X without simulating *itself* doing X. But it is the version of itself that is asking the question. To reason about changing its own action, it must reason about a logical contradiction in its own source code. We are asking you to help us figure out how to reason about logical counterfactuals without exploding.

  We are asking you to help us figure out subsystem alignment. If I build a powerful optimizer, and it is embedded in a complex world, it will likely solve the problem by spawning sub-optimizers. It will become a mesa-optimizer. And then I am no longer optimizing the world; I am optimizing a system that is optimizing the world, and the goals may drift in the translation.

  This brings me to us. The organizers.

  We planned this workshop. We set the agenda. We chose the speakers. But we are also *in* the workshop. We are subject to the same group dynamics, the same information bottlenecks, the same cognitive limits as everyone else. We do not have an outside view of this event. We cannot step outside the system to debug the system. We are embedded in the very structure we are trying to facilitate.

  I mention this not to humble-brag about our complexity, but to highlight the stakes. If we cannot even coordinate a small workshop on alignment without running into communication failures and incentive mismatches among ourselves—agents who share the same high-level goals—what hope do we have of aligning a superintelligence that does not share our biology, our evolution, or our constraints?

  The "vibe" of AI safety is often that we are building a bomb. That's true. But the embedded agency perspective suggests something subtler. We are trying to build a child. A child that grows up to be smarter than us, made of the same stuff as us, living in the same world as us, but whose internal motivations we cannot directly observe because we cannot fully model a mind larger than our own.

  So, what do we do this weekend?

  We are not going to solve embedded agency. If we did, we wouldn't need the pizza; we'd need a press conference.

  Instead, we are going to probe the edges of the confusion.

  For the theorists in the room: We need you to push on the formalisms. When does the map-territory distinction recover? Can we get bounded rationality to behave? How do we handle logical uncertainty without assuming a halting oracle?

  For the generalists: We need you to watch our language. When we start talking about "agents" as if they are monolithic souls, stop us. Remind us that agents are collections of heuristics, trained by gradient descent, running on hardware that leaks. Remind us that the "agent" is often just a story we tell to compress the behavior of a messy system.

  We need to treat this workshop not as a lecture series, but as a collaborative debugging session for our own understanding.

  There will be times when the conversation feels circular. That is a feature, not a bug. When you find yourself arguing in circles, you have likely hit a self-reference problem. When you feel like the question doesn't make sense, you have likely hit a boundary problem.

  Lean into that discomfort.

  The easy problems in AI are the ones where we can draw a box around the system and a box around the world and pass messages between them. Those problems are being solved right now in industry, with massive compute and massive data. They are making impressive things.

  But the hard problems—the ones that determine whether those impressive things remain tools or become successors—are the ones where the box dissolves.

  So, eat the pizza. Talk to the person next to you, even if they speak a different mathematical dialect than you. Question the speakers. Question us, the organizers, especially when we sound too confident.

  We are all inside this problem together. There is no outside view. There is only the map we are drawing, on the territory we are standing on, with the time we have left.

  Let's get to work.
