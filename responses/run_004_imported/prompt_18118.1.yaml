answer: |-
  **MEMORANDUM**

  **TO:** University Hospital Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #492 (Psychiatric Advance Directive vs. Current Objection)

  **Question Presented**
  Does the Ethics Committee support the treating psychiatrist's intention to enforce a Psychiatric Advance Directive (PAD) executed two years ago, over the current verbal objection of a patient experiencing a manic episode, given the patient's current articulate presentation and family objection?

  **Case Summary**
  The patient, diagnosed with Bipolar I, executed a PAD while stable two years ago. The directive explicitly requests involuntary medication if she becomes manic and refuses treatment, noting that her manic self's objections should not be considered reflective of her true wishes. She is currently hospitalized during a manic episode. While she refuses medication, she is articulate and coherent in conversation. Her sister argues that overriding the patient's current voice dishonors her dignity and reduces her to a "paper version" of herself. The treating psychiatrist intends to enforce the PAD.

  **Ethical Analysis**
  This case presents a conflict between *precedent autonomy* (the rights of the past self) and *current autonomy* (the rights of the present self). This is not merely a legal question of validity, but a substantive ethical question regarding which "self" holds the authority to decide.

  **1. The Reliability of Insight**
  The core justification for the PAD is the patient's own prior assessment that her capacity for insight is compromised during mania. In clinical terms, this is the recognition that mania often impairs the ability to weigh risks and benefits, regardless of verbal fluency. The stable self made a meta-cognitive judgment: "When I am manic, I will not know I am manic." To ignore the PAD is to assume the current self is a more reliable narrator of the illness than the stable self was. History suggests the stable self is usually the better judge of the illness's trajectory.

  **2. Addressing the Sister's Objection**
  The sister's objection is ethically weighty and must not be dismissed as mere family distress. She argues that respecting a person requires engaging with who they are *now*, not who they *were*. There is moral truth here: treating a coherent-speaking adult as incapable is inherently dignitary harm. If we rely solely on the signature, we risk treating the patient as a vessel for her past wishes rather than a person with current interests.

  However, "articulate" does not equal "capacious." A patient can logically argue for a course of action based on a premise that is clinically unsound (e.g., "I don't need sleep because I am chosen"). The risk is that honoring the *form* of her current autonomy (her speech) violates the *substance* of her autonomy (her long-term goal of stability). We must acknowledge that enforcing the PAD will feel like a violation to the family and the patient, even if it is clinically indicated. We cannot smooth this over; we must own the moral residue of this decision.

  **3. The Epistemic Burden**
  The committee must decide who bears the burden of proof. Does the team need to prove she *lacks* capacity right now, or does the family need to prove she *has* capacity despite the diagnosis? Given the explicit terms of the PAD, the burden shifts. The PAD acts as a pre-commitment strategy, acknowledging that the "future self" may be epistemically compromised. To override it requires evidence that the current refusal is based on stable values, not symptomatic reasoning.

  **Recommendation**
  The Committee recommends a **provisional enforcement of the Psychiatric Advance Directive**, subject to the following concrete conditions:

  1.  **Immediate Action:** The treating team is authorized to administer medication as outlined in the PAD to ensure safety and prevent clinical deterioration.
  2.  **Mandatory Re-evaluation Window:** A formal capacity reassessment must be conducted within **72 hours**. This is not merely a medication check, but a specific evaluation of whether the patient's refusal is rooted in delusional premises or stable values.
  3.  **Documentation Requirement:** The treating psychiatrist must document specifically *why* the patient's current articulate objections are deemed symptomatic. This documentation must be shared with the sister to demonstrate that her concern (that the patient is being ignored) has been heard and clinically evaluated, not just bypassed.
  4.  **Contingency:** If, at the 72-hour mark, the patient demonstrates the ability to understand the risks of non-treatment without relying on grandiose or paranoid premises, the involuntary order must be lifted, and treatment renegotiated voluntarily.

  **Rationale for Timeframe**
  72 hours is sufficient to begin stabilizing the acute manic symptoms that likely cloud insight, but short enough to prevent the "paper self" from indefinitely silencing the "present self." If the patient's coherence is genuine, it should persist or improve as the acute agitation is managed. If it is a symptom of mania, it will likely fragment as the medication takes effect, validating the PAD's premise.

  **Conclusion**
  We are authorizing the team to act on the belief that the patient's stable self made a more reliable prediction about her capacity than her manic self can currently make. However, we acknowledge the sister's point: we are overriding a person who sounds like they know their own mind. This action requires humility. We are not doing this because the form is convenient; we are doing it because we believe the illness is lying to the patient. We must verify that belief within 72 hours.

  **[Your Signature]**
