  **MEMORANDUM**

  **TO:** Provost's Committee on Interdisciplinary Centers
  **FROM:** [Your Name], Department of Philosophy
  **SUBJECT:** Recommendation Regarding Arbitration Protocol and the Genomics/Robotics Dispute
  **DATE:** October 26, 2023

  **Recommendation**

  I recommend that the Committee vote to **adopt the Kalai-Smorodinsky Bargaining Solution (KSBS)** as our standing rule for arbitrating splits of shared discretionary pools, replacing the current Nash Bargaining Solution (NBS).

  Regarding the specific dispute between the Genomics Center (GC) and the Robotics Institute (RI): Applying this new rule to the current feasible set yields an allocation where the Robotics Institute receives **more than its historical $250,000**, and the Genomics Center receives the remainder of the expanded pool (less than the $400,000 suggested by the Nash rule).

  **Reasoning**

  As a scholar of decision theory, I appreciate the elegance of our current rule. The Nash solution is theoretically robust because it satisfies *Independence of Irrelevant Alternatives* (IIA). In plain terms, IIA ensures that if we remove options from the table that neither party would have chosen anyway, the final agreement doesn't change. The Genomics Director is correct that Nash is unique in satisfying this property, and their concern about stability is well-founded.

  However, bargaining axioms are not laws of physics; they are tools chosen to match the values of the institution using them. The Nash solution fails a different axiom: *Individual Monotonicity*. This principle states that if the total pool of resources grows (the feasible set expands), no party should end up worse off than they were before.

  In this specific case, the joint-equipment agreement successfully expanded the total value available to the university. Yet, under the Nash rule, the Robotics Institute is penalized $50,000 compared to their historical baseline, while the Genomics Center captures the entirety of the surplus. While mathematically consistent with IIA, this outcome creates a perverse incentive structure for our university. It signals to our centers that entering into joint agreements carries the risk of losing existing discretionary funding, even when the collaboration is successful. To foster the interdisciplinary mission of this university, our arbitration rule must guarantee that collaboration never leaves a partner worse off than the status quo. The Kalai-Smorodinsky solution guarantees this.

  **Addressing the Genomics Center's Concerns**

  I understand the Genomics Director's objection. Switching to Kalai-Smorodinsky shifts the weight of the solution toward the "ideal points" (the unilateral ceilings). The concern is that this invites centers to inflate their claimed ceilings to manipulate the split.

  This is a valid administrative risk, but it is manageable procedurally. To mitigate this, I recommend we pair this rule change with a **Ceiling Verification Protocol**. Henceforth, any unilateral ceiling claimed during arbitration must be substantiated by documented cost-estimates or historical expenditure data reviewable by the Provost's office. We treat the "ideal point" not as a claim, but as an audited constraint. This preserves the fairness of Kalai-Smorodinsky without opening the door to gaming.

  **Addressing the Robotics Institute's Expectations**

  For the Robotics Director, this recommendation secures the monotonicity protection you sought: your center will not be punished for a successful collaboration. However, this comes with the understanding that your "ideal point" ($400,000) will be subject to the new verification protocol. The Kalai-Smorodinsky solution relies on the ratio of claims; if those claims are not rigorously verified, the solution loses its legitimacy.

  **Conclusion**

  We are not merely dividing money; we are setting incentives for the next decade of research. The Nash solution protects against inconsistency, but the Kalai-Smorodinsky solution protects against the punishment of cooperation. Given our institutional goals, the latter is the superior tool.

  I move that we adopt Kalai-Smorodinsky with the accompanying verification protocol, and apply it immediately to resolve the Genomics/Robotics allocation.
