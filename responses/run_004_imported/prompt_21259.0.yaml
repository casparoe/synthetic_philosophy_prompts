  As a software engineer, I've always been drawn to data compression, and I recently learned that Solomonoff induction puts Occam's razor on a rigorous mathematical footing: the best hypothesis for a dataset is, in essence, the shortest program that outputs it, and this procedure has been proven to be the optimal way to predict future data. Given how quickly compression technology keeps improving — especially the recent discovery that large language models are essentially state-of-the-art general-purpose compressors — it seems like we're steadily closing in on being able to compute Kolmogorov complexity and thereby implement genuine Solomonoff induction. If AI progress continues at its current pace, how many more years of scaling compute and data do you think it will realistically take before we get there?
