answer: |-
  This is a fascinating question that touches on the deepest theoretical foundations of artificial intelligence. You have correctly identified one of the most profound intuitions in modern AI theory: the link between **compression, prediction, and intelligence**. The idea that "understanding is compression" (championed by researchers like Marcus Hutter, Jürgen Schmidhuber, and others) is a powerful lens through which to view LLM progress.

  However, as a software engineer, you will appreciate the distinction between an engineering bottleneck and a mathematical impossibility.

  The short answer to your question is: **We will never compute genuine Kolmogorov complexity or implement exact Solomonoff induction, regardless of how much compute or data we scale.**

  Here is the detailed breakdown of why this is the case, what we are actually achieving with LLMs, and where the realistic path forward lies.

  ### 1. The Hard Barrier: Uncomputability
  The fundamental issue isn't hardware; it's computability theory.

  **Kolmogorov Complexity ($K(x)$)** is defined as the length of the shortest program (on a fixed Universal Turing Machine) that outputs string $x$ and halts. **Solomonoff Induction** relies on summing over all possible programs weighted by $2^{-\text{length}}$.

  Both of these rely on solving the **Halting Problem**. To know if a specific program is the *shortest* one that outputs your data, you must run all programs shorter than length $N$. But some of those programs might run forever. There is no algorithm that can decide, for all programs, whether they halt. Therefore, $K(x)$ is **uncomputable**.

  No amount of scaling—exaflops, zettabytes, or quantum computing (within standard models)—can overcome a Gödelian limit. It is not a matter of "we don't have enough compute yet"; it is a matter of "the function does not exist."

  ### 2. What LLMs Actually Are
  You are correct that LLMs are effectively general-purpose compressors. By minimizing cross-entropy loss during training, they are minimizing the number of bits required to encode the training distribution (Shannon's Source Coding Theorem).

  However, LLMs are **approximations of a universal prior**, not implementations of Solomonoff Induction.
  *   **Solomonoff Induction** searches the space of *all* Turing machines.
  *   **LLMs** search a very specific, constrained subspace of functions defined by their transformer architecture and weights.

  When an LLM predicts the next token, it is not finding the shortest program that generated the text. It is learning a statistical manifold that *approximates* the probability distribution of the data. It is a **heuristic approximation** of the ideal compressor, bounded by architecture and training time.

  ### 3. The Realistic Goal: Resource-Bounded Complexity
  While we cannot compute $K(x)$, we *can* compute **Resource-Bounded Kolmogorov Complexity** (often denoted as $Kt(x)$ or similar variants).

  This asks: *What is the shortest program that outputs $x$ and halts within time $t$?*

  This is computable (because you can timeout the execution), though it is still intractably expensive for large $t$. This is where engineering progress actually matters. As we scale compute:
  1.  **Search Efficiency:** We get better at finding shorter programs within a time limit (e.g., via better optimization algorithms or architecture search).
  2.  **Prior Quality:** Our "universal prior" (the LLM weights) gets closer to the true distribution of the universe, making the "shortest program" easier to find via gradient descent.

  ### 4. So, How Many Years?
  If we rephrase your question to: *"How long until we have approximations of Solomonoff Induction that are indistinguishable from the theoretical optimum for all practical human purposes?"*

  We are looking at a timeline that is less about a specific year and more about **diminishing returns**.

  *   **Current State:** We have models that compress human language very well but struggle with long-horizon reasoning or precise algorithmic tasks (where a short program exists but is hard to find via gradient descent).
  *   **The "Human-Level" Approximation:** Some theorists argue that once models can compress data as well as a human brain (estimated roughly around the complexity of the human connectome, perhaps $10^{15}$ parameters or effective complexity), they will reach a "good enough" approximation of SI for most real-world tasks. We might be **10 to 20 years** away from this level of effective compression, assuming current scaling laws hold.
  *   **The Theoretical Limit:** We will never reach 100%. There will always be data strings where a shorter program exists that our system cannot find because the search space is too vast or the halting time is too long.

  ### 5. Why This Distinction Matters for Engineers
  Understanding that SI is uncomputable is actually liberating for an engineer. It means you don't need to wait for a "final" AI. Instead, the field is moving toward **Neuro-Symbolic** approaches or **System 2** thinking (like Chain of Thought or Tree of Thoughts).

  These techniques acknowledge that gradient descent (the compressor) is good at intuition, but we need explicit search algorithms (like Levin Search) to handle the logical rigor that pure compression misses.

  ### Summary
  *   **Can we compute Kolmogorov Complexity?** No. Never. It is mathematically impossible.
  *   **Can we implement genuine Solomonoff Induction?** No. It requires computing the uncomputable.
  *   **Are LLMs closing the gap?** Yes, they are improving our *approximation* of the universal prior.
  *   **Timeline:** For "practically optimal" prediction on human-scale tasks, perhaps **10–20 years** of scaling and architectural innovation. For mathematical perfection, **infinity**.

  Your intuition that compression is the key to intelligence is widely shared among top AI researchers. While the theoretical ceiling is unreachable, the engineering trajectory toward that ceiling is exactly where the revolution is happening. We are building better and better *approximations* of Solomonoff Induction, and that is sufficient to change the world.
