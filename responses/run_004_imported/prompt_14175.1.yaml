answer: |-
  **Participants:**
  *   **Bernard:** A contemporary Bañezian Thomist.
  *   **Marcus:** A contemporary Molinist.

  **Setting:** A quiet corner of a university library, late afternoon.

  **Bernard:** Marcus, I've been reading through the material you sent me—Flint, Freddoso, the usual suspects. I grant you that Molinism offers an intuitive picture of how God might coordinate free agents. But we need to start where the *Congregatio* started: with the metaphysics of truth. You claim that prior to any decree of the divine will, God knows true counterfactuals of creaturely freedom (CCFs). You say, "If Peter were in circumstances C, he would freely deny Christ."

  My question is not whether this is *useful* for providence, but whether it is *metaphysically possible*. Truth requires a ground. A proposition is true only because something *makes* it true. If this CCF is true before God decides to create Peter, what is the ontological anchor? It cannot be God's will, or you are a Calvinist. It cannot be Peter's actual choice, because Peter does not exist. So, I press you: What, in reality, makes it true that a non-existent possible person would freely do X rather than Y in circumstances that never obtain? If you say "nothing," you make truth independent of being.

  **Marcus:** That is the Grounding Objection, Bernard, and I take it seriously. But I think you are assuming a version of Truthmaker Maximalism that many analytic metaphysicians now reject. Specifically, you are assuming that every true proposition requires a *positive, existing* ontological ground in the actual world.

  My reply, following Freddoso, is that we must distinguish between the *truth* of the counterfactual and the *cause* of its truth. The CCF is true because of what the *possible* creature would do in that possible world. The ground is not an actual event, but the real potency of the creature's essence as intelligible to God. God knows His own essence as imitable by creatures. In knowing the possible Peter, He knows the specific mode of freedom that defines Peter.

  So, the truth is grounded, but it is grounded in the *possible order*, not the actual order. It is explanatorily posterior to the creature's free power—even if that power is never actualized—but causally prior to the divine decree. The truth doesn't float; it rests on the nature of the freedom itself, which God apprehends in His *scientia simplicis intelligentiae*.

  **Bernard:** I see the move. You are shifting the ground from actual being to possible being. But this creates a deeper problem for Providence, even if I grant you that these propositions are somehow "grounded" in possible essences.

  Let's say these CCFs are true independently of God's will. That means the truth-values of these conditionals lie outside God's control. God did not make them true; He merely finds them true. If God wishes to save Peter, but the true CCF is "If placed in C, Peter will freely reject grace," then God is thwarted. He can only achieve His will by finding a world where the "lucky" distribution of truth-values aligns with His desires.

  This renders Providence reactive. God becomes a divine chess player who cannot move the pieces but can only choose which board to play on, hoping the pre-set patterns work out. If the truth of what creatures *would* do is outside His control, then His governance is not a function of His omnipotence, but of His good fortune in world-selection. How is this compatible with the doctrine that God is the Lord of History, rather than its most informed observer?

  **Marcus:** That's a powerful image, Bernard, but it conflates *control over truth-values* with *control over actualization*. Molinism does not claim God controls the truth-values of CCFs; it claims He controls *which CCFs get instantiated*.

  Think of it this way: God's knowledge of the CCFs is the middle knowledge (*scientia media*) between His knowledge of necessary truths and His knowledge of the actual world. Because He knows all true CCFs, He knows exactly what every possible free creature would do in every possible circumstance. Therefore, when He decrees to create *this* world, He does so with the certainty that the free choices within it will align with His providential plan.

  He isn't "hoping" Peter cooperates. He knows infallibly that in the world He actualizes, Peter *will* cooperate. God's governance is secured not by determining the will, but by sovereignly selecting the circumstances in which He knows the will shall freely move. It is not luck; it is meticulous actualization. He guarantees the outcome without violating the mode of the cause.

  **Bernard:** You guarantee the outcome by selecting the circumstances, yes. But this brings me to the reciprocal charge. You accuse my view of compromising freedom to save Providence. I accuse yours of compromising Providence to save freedom. But let's turn to your critique of my house.

  You Molinists often argue that Bañezianism is simply determinism in Thomistic clothing. You ask: If God applies a *praemotio physica* (physical premotion) to move my will from potency to act, how am I free? If the premotion is efficacious, it seems I cannot do otherwise. If I cannot do otherwise, where is the libertarian freedom you claim Thomists possess? If God moves the will to consent, is that not causally determined consent? How do you secure freedom any better than the Calvinist, other than by semantic distinction?

  **Bernard:** (Leaning forward) That is the crux of the *Auxiliis* controversy, isn't it? The error lies in conceiving divine causality as one cause among many, competing for the same causal space. If God and I are both pushing the same object, then yes, if God pushes harder, I am determined.

  But on the Thomistic account, God is the First Cause, and I am a secondary cause. God's causality operates at a deeper ontological level than my own. The *praemotio physica* does not bypass my will; it actualizes my will's very power to choose. As John of St. Thomas argues, God moves all things according to their nature. Necessary causes He moves necessarily; contingent causes He moves contingently; free causes He moves freely.

  The premotion is not a coercion that forces the will against its inclination. Rather, it is the divine act that creates the *exercise* of the will itself. When I freely choose the good, it is because God has moved me to do so *in a manner suitable to a free agent*. The efficacy of the grace lies not in overriding my resistance, but in removing the impediment to my consent.

  **Marcus:** But Bernard, if the premotion is *efficacious*—if it infallibly produces the consent—then in what sense could you have done otherwise? If the physical premotion is given, you consent. If it is not given, you do not. That looks like the ability to do otherwise is merely hypothetical, not categorical.

  **Bernard:** You are confusing infallibility with necessity. The connection between the divine premotion and the human act is infallible, yes. God cannot fail. But the *mode* of the connection preserves the contingency of the created cause.

  Consider the distinction between *sufficient* and *efficacious* grace. God gives sufficient grace to all, which gives the real power to act (*posse*). But to actually act (*agere*), the will requires the efficacious premotion. Why does God give the efficacious premotion to one and not the other? That belongs to the mystery of His will. But when He gives it, He moves the will such that the will *itself* determines the choice.

  The freedom is not found in an indifference that resists God's motion. That is not freedom; that is defect. True freedom is the self-determination of the agent *under* the motion of the First Cause. I am most free when I am most moved by God, because I am then most fully actualized. Your Molinist freedom requires a gap in divine causality for the creature to fill. My freedom requires the fullness of divine causality to exist at all.

  **Marcus:** And therein lies the stalemate. You see my "gap" as a metaphysical necessity for love; I see your "fullness" as a metaphysical necessity for control. You claim the premotion moves me freely, but to my eye, if the ultimate explanation for why I chose A over B rests in the divine premotion rather than my own counterfactual power, then I am not the ultimate source of my action.

  **Bernard:** And to my eye, if the ultimate explanation for why you chose A over B rests in a truth about you that God did not create, then God is not the ultimate source of His own Providence.

  **Marcus:** It seems we are both accusing the other of sacrificing a divine attribute to save a created one.

  **Bernard:** Precisely. You sacrifice the universality of divine causality to save libertarian freedom. I sacrifice the libertarian definition of freedom to save the universality of divine causality.

  **Marcus:** And neither of us has a non-question-begging way to prove our metaphysical starting point to the other.

  **Bernard:** (Closing his book) No. I suppose that is why the *Congregatio* ended without a definitive condemnation of either side. Pope Paul V decided we were both too useful to the Church to be silenced, and too stubborn to be reconciled.

  **Marcus:** (Smiling) Then I suppose we have more reading to do.

  **Bernard:** Indeed. But at least we agree on the problem.
