      *   *Weight (V):* This is the *amount* of relevant evidence. It's the absolute quantity of knowledge underlying the probability estimate. It ranges from 0 to 1 (or 0 to $\infty$, but usually normalized in interpretation).
      *   *The Urn Example:*
