      *   *Is "Weight" exactly "Ambiguity"?* Not quite. Weight is about the *amount* of evidence. Ambiguity is about the *lack of definition* in the probability distribution. They are cousins, but Keynes's concept is broader (evidence quality/quantity).
      *   *The "Gap":* The user asks about the gap between §6 and §7. The gap is between *recognizing an epistemic difference* and *deriving a normative action rule*. I need to emphasize that transition.

