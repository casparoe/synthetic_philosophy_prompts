prompt: |-
  I'm a software engineer and co-founder at a small startup that's negotiating a revenue-sharing deal with a much larger partner company. They've proposed that both sides fully disclose our internal cost structures and growth forecasts so we can jointly calculate the "fair" split. My gut says this is risky: if they know our numbers precisely and we can't verify theirs, they could easily lowball us once our hand is shown. At the same time, walking away from the partnership entirely seems clearly worse for both companies than making some deal. Is there a principled way to structure a negotiation like this so that both sides are guaranteed to end up better off than not partnering at all, without either party having to trust or even fully disclose the other's private information? I'd like to understand the underlying logic here, not just get generic negotiation tips.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** Software engineer and co-founder at a small startup.
      *   **Context:** Negotiating a revenue-sharing deal with a much larger partner company.
      *   **Proposal:** The large partner wants full disclosure of internal cost structures and growth forecasts from the startup to calculate a "fair" split.
      *   **User's Concern:** Asymmetric information risk. If the startup reveals costs/forecasts and the partner doesn't (or lies), the partner can extract almost all the surplus value (lowballing).
      *   **Constraint:** Walking away is worse for both (positive-sum game potential exists).
      *   **Goal:** A principled way to structure the negotiation ensuring both sides are better off than no deal (individual rationality) without requiring full trust or full disclosure of private information (incentive compatibility/privacy).
      *   **Request:** Understand the underlying logic, not just generic tips.

  2.  **Identify the Core Economic/Game Theoretic Concepts:**
      *   **Bargaining Problem:** This is a classic cooperative game theory scenario (Nash Bargaining Solution).
      *   **Information Asymmetry:** One side (startup) is being asked to reveal private info; the other (partner) holds power.
      *   **Hold-up Problem:** Once specific investments or info are revealed, the other party can exploit it.
      *   **Mechanism Design:** How to structure the rules of the game so that truthful revelation is optimal (or unnecessary) and outcomes are efficient.
      *   **Individual Rationality (IR):** Both parties must get at least their reservation value (BATNA - Best Alternative to a Negotiated Agreement).
      *   **Incentive Compatibility (IC):** Parties should be motivated to act in ways that lead to the desired outcome without needing to trust each other.

  3.  **Brainstorming Solutions/Structures:**

      *   *Idea 1: Blind Bidding.* Both submit sealed bids on the split. If they cross, deal happens. (Too simplistic for revenue share).
      *   *Idea 2: Revenue Share based on Gross, not Net.* Don't share cost structures. Share top-line revenue. This avoids the "cost disclosure" trap.
      *   *Idea 3: Tiered/Progressive Splits.* As revenue grows, the split changes. Aligns incentives without needing exact cost forecasts.
      *   *Idea 4: Third-Party Audit/Escrow.* Use a neutral accountant. Good, but still requires disclosure to someone.
      *   *Idea 5: Mechanism Design approach (The "Principled" Logic).* Focus on the *Surplus*. The deal should split the *additional* value created by the partnership, not based on absolute costs.
      *   *Idea 6: Options/Minimum Guarantees.* Ensure the IR constraint is met contractually.

  4.  **Developing the "Principled" Argument (The Core Logic):**

      *   **The Trap:** The partner is asking for *cost* data to determine *value*. This is a category error. Value is determined by market willingness to pay, not internal costs. Costs are private; Value is shared.
      *   **The Solution:** Decouple the *creation* of value from the *division* of value.
      *   **Key Concept 1: Reservation Value (BATNA).** The contract must guarantee a minimum floor that exceeds the "no deal" scenario.
      *   **Key Concept 2: Verifiable Metrics vs. Private Data.** Use externally verifiable metrics (Gross Revenue, Units Sold) rather than internal inputs (Costs, Margins).
      *   **Key Concept 3: Incentive Alignment.** The contract should make it in the partner's interest to maximize the pie, not just grab a bigger slice of a small pie.
      *   **Key Concept 4: The "Shapley Value" intuition.** Split based on marginal contribution, though hard to measure practically. Better to use a dynamic split.

  5.  **Structuring the Response:**

      *   **Validate the Intuition:** Confirm that the user's gut is correct based on game theory (Information Asymmetry & Hold-Up).
      *   **Theoretical Framework:** Introduce the concepts of *Individual Rationality* and *Information Hazards*.
      *   **Strategic Shift:** Move from "Cost-Plus" logic to "Value-Creation" logic.
      *   **Concrete Mechanisms:**
          1.  **Gross Revenue vs. Net Profit:** Avoid cost disclosure.
          2.  **Tiered Revenue Shares:** Align incentives for growth.
          3.  **Minimum Guarantees (The IR Constraint):** Ensure the "better off than no deal" condition.
          4.  **Audit Rights (Symmetric Verification):** If they want your numbers, you get to verify theirs (or use a neutral third party).
          5.  **The "Black Box" Approach:** Use an oracle or escrow for sensitive calculations if absolutely necessary.
      *   **Negotiation Script/Logic:** How to phrase this to the partner.
      *   **Conclusion:** Summarize the principle (Mechanism Design).

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "don't do it." I need to explain *how* to do it safely.
      *   *Nuance:* The partner might argue they need cost data to ensure sustainability. Counter: That's their risk, not yours. Your risk is exploitation.
      *   *Emphasis:* Focus on the "Principled" aspect. Use terms like "Information Hazard," "BATNA," "Verifiable Signals."
      *   *Specific Mechanism:* Suggest a "Revenue Share with a Floor." This mathematically guarantees Individual Rationality.

  7.  **Final Polish:** Ensure the tone is professional, empathetic to a founder, and intellectually rigorous (since they asked for underlying logic). (The resulting output matches the detailed response provided previously.)

  8.  *(Post-computation check)*: Did I answer the specific question? "Is there a principled way... without either party having to trust or even fully disclose?"
      *   Yes, by shifting the basis of the split from *inputs* (costs) to *outputs* (revenue) and using contractual guarantees (floors) to ensure IR. I need to make sure I emphasize that *some* disclosure (revenue) is usually necessary for a revenue share, but *cost* disclosure is the danger zone. I should also mention Cryptographic/Zero-Knowledge Proof concepts as a futuristic/tech-native angle, though maybe too complex for a legal deal. I'll stick to economic mechanism design.

  9.  **Final Plan:**
      1.  Validate the risk (Information Asymmetry).
      2.  Define the Goal (Individual Rationality + Incentive Compatibility).
      3.  Propose the Mechanism (Gross Revenue + Tiered Splits + Minimum Guarantees).
      4.  Explain the Logic (Why this works).
      5.  Address the "Verification" issue (Audit rights).
      6.  Provide a negotiation framing.

  *(Self-Correction on Zero-Knowledge Proofs)*: While cool, suggesting ZKPs for a legal revenue contract might be over-engineering. Better to stick to standard commercial mechanisms that achieve the same privacy goal (e.g., reporting gross revenue only). I will mention it as a "tech-native" side note.

  *(Refining the "Fair Split" logic)*: The partner wants to calculate "fair" based on costs. I need to explain why "fair" should be based on *leverage* and *value add*, not cost reimbursement.

  Okay, ready to write.s
answer: |-
  Your intuition is correct, and it is grounded in a well-established concept in game theory and economics called **Information Asymmetry** leading to the **Hold-Up Problem**.

  The larger partner is asking you to convert private information (your costs and forecasts) into a public good (the negotiation baseline) without offering a symmetric commitment. In mechanism design terms, they are asking for **Incentive Compatibility** from you (truth-telling) without offering it themselves.

  If you disclose your minimum viable margin, a rational profit-maximizing partner will offer you exactly that margin plus $\epsilon$ (a tiny amount), capturing the entire **economic surplus** generated by the partnership.

  Here is the principled logic for structuring this deal so that both parties satisfy **Individual Rationality** (better off than no deal) without requiring blind trust or full disclosure of private cost structures.

  ### 1. The Core Principle: Decouple Value from Cost
  The partner's proposal relies on a "Cost-Plus" logic (determining split based on internal expenses). This is dangerous for you. The economic value of a partnership is determined by **market willingness to pay**, not your internal cost structure.

  **The Logic:**
  *   **Your Risk:** Revealing costs sets a ceiling on your upside.
  *   **Their Risk:** Paying you too much reduces their margin.
  *   **The Solution:** Base the split on **Gross Revenue** (an externally verifiable output) rather than **Net Profit** (which requires disclosing internal costs).

  By agreeing to split *top-line revenue*, you remove the need to disclose your margins. If your costs are high, that is your risk to manage; if their costs are high, that is theirs. This creates a **firewall** around your private data.

  ### 2. Guaranteeing Individual Rationality (The "Floor")
  You mentioned the goal is to ensure both sides end up better off than not partnering. In game theory, this is called satisfying the **Individual Rationality (IR) Constraint**.

  To guarantee this without trusting their forecasts, you need a **Minimum Guarantee (Floor)**.

  **The Mechanism:**
  Structure the deal as a revenue share *with a minimum annual commitment*.
  *   **Logic:** "We will accept X% of revenue, but regardless of volume, the total payment to us cannot be less than $Y."
  *   **Why it works:** $Y should be calculated internally by you as: `Your BATNA (Best Alternative to a Negotiated Agreement) + Opportunity Cost`.
  *   **Privacy:** You do not tell them how you calculated $Y. You simply present it as a requirement for the partnership to be viable for your business.
  *   **Result:** If the partnership fails to generate enough value, they pay you $Y. You are mathematically guaranteed to be no worse off than walking away. They are incentivized to make the partnership succeed so they don't pay $Y for nothing.

  ### 3. Incentive Compatibility via Tiered Splits
  To address their desire for a "fair" split that scales with success, use a **Tiered Revenue Share**. This aligns incentives without requiring you to share growth forecasts.

  **The Mechanism:**
  *   $0 - $1M Revenue: You get 20%
  *   $1M - $5M Revenue: You get 25%
  *   $5M+ Revenue: You get 30%

  **The Logic:**
  *   **For Them:** They know exactly what their marginal cost is for every additional dollar earned. There is no hidden surprise.
  *   **For You:** As the partnership becomes more valuable (validating their growth forecasts), you capture more value.
  *   **Privacy:** You do not need to disclose *why* you need 25% at the second tier. You simply frame it as, "At higher volumes, our support/infrastructure costs scale non-linearly, requiring a higher share to maintain service levels." (Even if that's not strictly true, it is a valid commercial position).

  ### 4. Solving the Verification Problem (Symmetric Auditing)
  The partner wants to verify your numbers to ensure the split is calculated correctly. This is reasonable, but it must be **symmetric** to prevent exploitation.

  **The Mechanism:**
  *   **Audit Rights:** If they have the right to audit your revenue records to verify the split, you must have the right to audit *their* records regarding the deployment of your product.
  *   **The "Black Box" Alternative:** If you truly want to avoid disclosing *any* revenue numbers, you can propose a **Third-Party Escrow**.
      *   All revenue generated flows into a neutral escrow account.
      *   The smart contract or escrow agent automatically splits the funds according to the agreed percentage.
      *   Neither party sees the total pool; both only see their inbound transfer.
      *   *Note:* This is harder to set up legally but is the gold standard for privacy.

  ### 5. Negotiation Script: The "Principled" Pushback
  You need to communicate this without sounding adversarial. Frame it as "Standardizing for Efficiency."

  > "We agree that transparency is key to a long-term partnership. However, disclosing internal cost structures creates an information hazard that can distort the market value of what we're building together.
  >
  > To ensure this deal is sustainable and fair without getting bogged down in auditing each other's overhead:
  > 1.  **We propose basing the split on Gross Revenue.** This aligns us both on top-line growth and removes the need to disclose private margin data.
  > 2.  **We need a Minimum Annual Guarantee.** This ensures that our opportunity cost is covered, satisfying the requirement that this deal is better than our status quo.
  > 3.  **We propose a Tiered Split.** This allows you to keep more margin at lower volumes, while ensuring we are compensated fairly if this becomes a core driver of your business.
  >
  > This structure guarantees we are both incentivized to maximize the pie, without needing to open our books on how we bake it."

  ### Summary of the Underlying Logic

  1.  **Avoid the "Anchoring" Trap:** Never let your costs anchor the negotiation. Value is subjective; costs are objective. Keep the negotiation on Value (Revenue).
  2.  **Enforce Individual Rationality:** Use a **Minimum Guarantee** to mathematically ensure you are never worse off than your BATNA, regardless of their honesty.
  3.  **Maintain Information Symmetry:** If they audit you, you audit them. If you can't audit them, use a **Third-Party Escrow** to blind the total numbers.
  4.  **Dynamic Alignment:** Use **Tiered Splits** to capture upside without needing to predict forecasts.

  By structuring the deal this way, you move from a **Zero-Sum Bargaining Game** (fighting over a fixed pie based on costs) to a **Cooperative Mechanism** (growing the pie based on revenue) where privacy is preserved by the contract structure itself.
