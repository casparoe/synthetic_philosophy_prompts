answer: |-
  First off: you are not off in the weeds. You have independently reconstructed one of the stickiest problems in the metaphysics of causation. The example you vaguely remember about the Queen of England comes from H.L.A. Hart and Tony Honoré's seminal 1959 book *Causation in the Law*. They used the example of a gardener failing to water plants vs. the Queen of England failing to water them. Both are counterfactually necessary (if either had watered, the plants would live), but only the gardener is the *cause*.

  You have effectively stumbled onto the debate between **Counterfactual Theories of Causation** (David Lewis) and **Normative/Interventionist Theories** (Hart & Honoré, later Menzies).

  Here is the breakdown of your five points, where they hold up, where they rehash established debates, and the verdict on that regress worry.

  ### Point 1: The Problem of Profligate Causes
  > *Lots of people "didn't do anything"... None of them did anything either.*

  **Verdict:** **Holds up.** This is the starting gun for the entire debate.
  In philosophy, this is known as the problem of **"profligate causes"** or the "abundance of counterfactuals." If you define causation purely as counterfactual dependence (i.e., "If X hadn't happened, Y wouldn't have"), then the absence of *any* preventer is a cause. The absence of a hurricane, the absence of a superhero, and the absence of the Queen of England are all "causes" of your ceiling collapsing under that definition.
  You are correct that this intuition is absurd. If we accept Point 1 as the end of the story, causation becomes meaningless because everything is a cause. Your instinct that we need to filter these is correct.

  ### Point 2: The Normative Filter
  > *So there's got to be some extra ingredient... he was the one who was actually supposed to act.*

  **Verdict:** **Holds up, and is the standard solution.**
  This is exactly how legal and moral philosophers solve Point 1. They argue that causal *selection* (picking the cause out of the background conditions) relies on **normative expectations**.
  We distinguish between a "mere condition" (the Queen not watering) and a "cause" (the gardener not watering) based on duty, role, or statistical normality. You've identified that "causation" in human contexts isn't just physics; it's physics + expectations.
  *Critique:* This doesn't add something "new" to philosophy (Hart & Honoré nailed this in the 50s), but for a narrative or essay, it is the crucial pivot point. It moves the discussion from *metaphysics* to *social ontology*.

  ### Point 3: Norms vs. Physics
  > *So doesn't that mean this whole category... isn't a plain fact about the world, more like a verdict we hand out...*

  **Verdict:** **This is the money shot.**
  You have hit on the central metaphysical tension. If causation is a feature of the universe (like gravity), it shouldn't care about job descriptions. Gravity doesn't care if the super was "supposed" to fix the pipe.
  By admitting that norms are required to identify the cause, you are arguing that **omission-causation is mind-dependent.** It exists relative to an observer who knows the rules of the building.
  Many philosophers (like Jonathan Schaffer) argue exactly this: Omissions are not "real" events in the world. They are *shadows* cast by our expectations. A rock hitting a window is an event (positive). A super *not* fixing a pipe is a non-event. You are correct to suspect these are different categories.

  ### Point 4: Two Different Senses of "Cause"
  > *Feels like there's two different things going on and we're just using the same word "cause" for both.*

  **Verdict:** **Strongest point.**
  This is where you should lean hardest in your writing. There is a growing consensus that we need to distinguish between:
  1.  **Causal Production:** Physical mechanisms transferring energy (the water leaking).
  2.  **Causal Dependence:** Counterfactual relationships supported by norms (the super not stopping the water).
  Your intuition that we are using the same word for two different things is shared by many contemporary metaphysicians. If you treat them as the same, you get paradoxes. If you separate them, the paradox dissolves. The water *physically* caused the damage; the super's inaction *legally/morally* caused the liability.

  ### Point 5: The Regress Worry
  > *If the super's silence caused the leak because his boss's silence caused the super's silence, why doesn't that chain just keep going back forever?*

  **Verdict:** **This is a known worry, but it's not a dead end.**
  This is the trickiest point. You are worried about an **infinite regress of omissions**.
  *The Philosophical Answer:* The regress usually stops because omissions aren't actually links in a causal chain in the same way actions are.
  Most philosophers argue that an omission isn't a "thing" that can be caused. It's the *absence* of a thing.
  *   **Option A (The Positive Interruption):** The chain stops when you hit a positive action. Maybe the Boss *did* send an email, but the Super ignored it. Now we have a positive event (the email) and a positive event (ignoring it). The regress stops at the mental state of the Super.
  *   **Option B (The Capacity Limit):** The chain stops at capacity. The Boss didn't act because *he* didn't know. Why didn't he know? Because the tenant didn't call. Why didn't the tenant call? Because they didn't hear the leak. Eventually, you hit a physical fact (sound waves didn't reach ears) rather than a normative omission.

  *Where your argument might wobble:* You suggest the Boss's silence caused the Super's silence. That's debatable. Did the Boss's silence *cause* the Super's inaction, or did it just *fail to prevent* it?
  If you treat omissions as causes, yes, you risk a regress. But most philosophers block the regress by saying **omissions cannot be effects.** You can't "cause" a non-event. You can only fail to prevent an event.
  *Advice for your story:* Don't let this regress paralyze you. Use it to show the absurdity of treating omissions exactly like physical actions. The chain *shouldn't* go back forever, which proves that omissions are different from physical causes.

  ### Summary & Advice for the "Longer Thing"

  You are not wandering off the map; you are walking the main road of causation theory.
  *   **Points 1 & 2** are the setup (The Counterfactual Problem).
  *   **Points 3 & 4** are the insight (The Metaphysical Distinction).
  *   **Point 5** is the stress test (The Regress).

  **Where to take this:**
  If you turn this into an essay or story, don't try to solve the metaphysics. Instead, focus on the **human cost of the ambiguity.**
  The super knows he didn't *do* anything (physically). The tenant knows the super *caused* the damage (normatively). The tragedy lies in the gap between those two definitions of "cause."
  *   The super can say: "I didn't break your ceiling." (True, physically).
  *   The tenant can say: "You broke my ceiling." (True, normatively).

  Your Point 4 is the emotional core. We use the word "cause" to assign blame, not just to describe physics. When the physics and the blame come apart, relationships break.

  **Reading to check your work (if you want):**
  1.  **H.L.A. Hart & Tony Honoré, *Causation in the Law*** (The source of the Queen/Gardener example).
  2.  **Jonathan Schaffer, "Causation by Disconnection"** (Argues omissions aren't real causes).
  3.  **David Lewis, "Causation"** (The counterfactual view you are critiquing).

  **Final Verdict:** Your logic is sound. Point 5 is the only one that requires a slight tweak (omissions might not be able to *be* effects), but that tweak actually strengthens your overall argument that omissions are metaphysically weird. Keep going.
