  The room was white, soundproofed, and smelled of antiseptic and old paper. Elias sat on one side of the metal table, his hands folded loosely in his lap. On the other side sat Dr. Aris, holding a clipboard and a pen that hovered over the final line of a release form.

  For twenty years, Elias had been kept in the Ward. Not because he was evil, the doctors said, but because he was brittle. A certain kind of pressure—a shouted word, a sudden shove, the sight of blood—would cause something in him to snap. When it snapped, people got hurt. Badly.

  Now, he wore the collar. It was a thin band of matte black polymer resting against his throat, humming with a vibration too low to hear but high enough to feel in the teeth.

  "This is the last evaluation," Dr. Aris said, his voice even. "You know the protocol. I need to see that the… incident… is behind you."

  Elias nodded. He looked tired. The lines around his eyes were deep, the color of bruises. "I understand."

  Aris closed the clipboard. He stood up slowly, walking around the table until he stood directly behind Elias's chair. He leaned down, bringing his mouth close to Elias's ear. He didn't shout. He didn't strike. He simply whispered the name of the man Elias had nearly killed two decades ago. He whispered the details of the injury. He whispered the blame.

  It was a key turned in a lock.

  Elias's breath hitched. His hands, still folded in his lap, clenched. The knuckles turned white, then bloodless. The muscles in his forearms corded tight against the skin, trembling with a kinetic energy that had nowhere to go. His heart rate monitor, clipped to his finger, began to beep faster, a staccato rhythm climbing toward a scream.

  Inside Elias's head, the fire lit. It was the same old fire. It rose up the spine, hot and familiar, demanding release. It told his legs to stand, his shoulders to turn, his hands to strike. The urge was complete. It was total. It was the whole of him.

  But the collar sensed the spike in adrenaline. It sensed the electrical surge in the motor cortex.

  A sharp coldness flooded Elias's neck. It wasn't pain, exactly. It was a negation. The signal from his brain to his muscles met a wall. The fire burned bright behind his eyes, but the limbs remained still. The hands stayed folded. The body sat heavy in the chair.

  Dr. Aris watched the monitor. He watched the hands. He saw the heart rate climb, yes, but he also saw the stillness. He saw a man who was provoked and did not react. He saw a man who had heard the worst possible thing and remained seated.

  Aris walked back around to the front of the table. He looked at Elias with something like pity, and something like relief.

  "Your vitals spiked," Aris said, noting it on the clipboard. "But you maintained control. The conditioning holds."

  Elias said nothing. He couldn't speak without risking a tremor in his jaw. He stared at the table, focusing all his will on keeping the fire contained behind the wall in his neck.

  "It seems the treatment was successful," Aris continued, capping his pen. "The inclination appears to be gone. You're safe to return to the community."

  Aris slid the release form across the metal. He offered a pen.

  Elias looked at the pen. He looked at the doctor. He wanted to scream. He wanted to tell him that the inclination was not gone. It was right there, roaring behind his eyes, hot as a furnace. It was only the arm that was broken. The wire had been cut, not the fuse.

  But he could not say it. To speak was to risk the vibration in his throat triggering the lock again. To explain was to admit the fire was still burning. And if he admitted the fire was still burning, the pen would not be offered. The door would not open.

  So Elias took the pen. His hand shook, just once, a tiny spasm before the collar smoothed it out. He signed his name.

  "Thank you, Doctor," Elias said. His voice was flat.

  "Take care of yourself, Elias," Aris said, opening the door. "You're a new man."

  Elias stood up. The fire moved with him. It walked out the door with him, into the street, into the crowd. It was dressed in calm clothes. It carried a bag. It smiled at neighbors. But everyone who passed him was walking beside a loaded gun with the safety on, trusting in the metal catch, unaware that the bullet was still in the chamber, waiting for the day the spring grows tired.
