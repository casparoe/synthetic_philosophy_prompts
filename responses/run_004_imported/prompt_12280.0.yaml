answer: |-
  Here is a draft of ten interview questions tailored to your background as engineers and your goal of moving past the "Decision Theory 101" material. I have structured them to flow logically, with the three mandatory topics (Counterfactual Mugging intuition, Mechanics of the Prior, and UDT1 vs. 1.1) highlighted with their specific follow-ups.

  ### Part 1: The Intuition Gap (Counterfactual Mugging)

  **1.** Let's start with the emotional resistance to Updateless Decision Theory. In the Counterfactual Mugging, once the coin has landed tails, I *know* the predictor didn't pay me. Paying the $100 feels like throwing good money after bad—it feels like a sunk cost fallacy. As engineers, we're used to "runtime" logic: given the current state of the world, what maximizes utility *now*? UDT asks us to ignore the current state in favor of the "compile-time" state. Is the goal of UDT to change how humans feel about these decisions, or is it purely a specification for how we should build AI source code, accepting that humans will never intuitively feel right about paying up?

  *   **Follow-up (Keyed to likely answer: "It's about the algorithm type, not the feeling"):** If it's purely about the algorithm type and not about human intuition, does that imply decision theory stops being "action-guiding" for biological humans? If a human *cannot* internally simulate the prior once they've observed the outcome, are we essentially saying rationality is impossible for us, and we should just build agents to do it for us?

  ### Part 2: Mechanics of the Prior (Physical vs. Logical)

  **2.** I want to dig into the mechanics of evaluating a policy "from the prior." With a physical coin flip, I can conceptually rewind time to before the flip. But with logical uncertainty—say, whether the billionth digit of Pi is even—I can't rewind logic; the fact is fixed timelessly. When UDT evaluates the expected utility of a policy regarding a logical fact, what is actually happening in that calculation? Are we summing over impossible worlds where math is different, and if so, how do we assign probabilities to those worlds without the system exploding into inconsistency?

  *   **Follow-up (Keyed to likely answer: "We use a logical induction framework or a distribution over proofs"):** If we rely on a specific framework like logical induction to handle those probabilities, does UDT become dependent on the properties of that specific reasoner? In other words, is there a single "Universal UDT," or does the optimal policy change depending on the computational budget and logical prior of the specific agent running it?

  ### Part 3: The Evolution of the Theory (UDT1 vs. UDT1.1)

  **3.** I've been reading through the old threads on the transition from UDT1 to UDT1.1. My understanding is that UDT1 tried to optimize the action for each observation individually, while UDT1.1 optimizes the entire observation-to-action mapping as a single object. Could you walk us through the specific failure mode of UDT1 that necessitated this patch? Was it primarily about coordination with copies of yourself, or did it fail even in single-agent scenarios involving predictors?

  *   **Follow-up (Keyed to likely answer: "It failed in coordination games/Parfit's Hitchhiker variants"):** If the fix was to optimize the whole mapping, does that kick the can down the road? Is there a risk of a UDT1.2 problem where we need to optimize over the *space of mappings* or the agent's source code itself, leading to an infinite regress of higher-order optimizations?

  ### Part 4: Bounded Rationality and Implementation

  **4.** Both of us come from software engineering, where "optimal" is usually the enemy of "shippable." UDT, as typically described, seems to require an impossible amount of computation—enumerating all possible observations and outcomes from a prior. For a bounded agent (like a current LLM or a future AGI with finite compute), what does "approximate UDT" look like? Is there a way to be "updateless enough" without actually computing the full policy map?

  ### Part 5: Indexicals and Self-Location

  **5.** One thing that trips us up in the LessWrong sequences is the handling of indexical information (knowing "I am here" or "It is now 2024"). Standard Bayesian updating handles this naturally, but UDT seems to treat this information differently, often ignoring it to maintain the updateless stance. How does UDT distinguish between information that should be treated as a fixed constraint of the world versus information that is just "where I am" in the world? Does getting this wrong lead to exploitable behavior?

  ### Part 6: AI Alignment and Acausal Trade

  **6.** Since you work on AI alignment, I'm curious about the safety implications. UDT agents are capable of acausal trade—cooperating with agents they can't causally interact with, based purely on logical correlation. In a multi-agent environment with other superintelligences, does adopting UDT make an AI system more cooperative and stable, or does it open up new attack vectors where the AI gets "mugged" by distant simulators or predictors we haven't even considered?

  ### Part 7: Relationship to Evidential Decision Theory (EDT)

  **7.** There's a recurring joke in the community that UDT is just Evidential Decision Theory (EDT) with a really good prior that screens off the spurious correlations. How much of the heavy lifting is actually done by the decision rule itself versus the construction of the prior? If we had a perfect prior, would UDT and EDT converge on the same actions in all the standard problems (Newcomb, Smoking Lesion, etc.)?

  ### Part 8: The "Troll Bridge" Problem

  **8.** I'd like to touch on the "Troll Bridge" problem, where an agent is discouraged from crossing a bridge because the mere act of proving it's safe might trigger a troll to blow it up. This seems to punish agents for having certain proofs. Does UDT have a satisfactory solution to Troll Bridge, or is this still an open wound in the theory where logical counterfactuals seem to punish the agent for being too logical?

  ### Part 9: Normative Force

  **9.** You've spent a career defending this framework. When you say an agent *should* be updateless, what is the source of that "should"? Is it pragmatic (you get more money), or is it normative (this is what rationality *is*)? If we found a universe where updateful agents consistently out-earned updateless ones due to some physical law, would you abandon UDT, or would you say those agents were simply irrational despite their success?

  ### Part 10: Falsification (Closing Question)

  **10.** To close out: Decision theory can sometimes feel like a game of whack-a-mole, where every paradox (Mugging, Newcomb, Troll Bridge) gets a patch or a specific justification. What kind of evidence or argument would actually count *against* UDT for you? Is there a specific thought experiment, mathematical proof, or empirical result that would make you say, "Okay, the updateless approach is fundamentally wrong," rather than just "We need a UDT1.2"?
