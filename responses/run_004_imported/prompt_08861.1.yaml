prompt: |-
  So this semester I got roped into chairing our department's hiring committee, and something happened that reminded me alot of the discursive dilemma material I cover in my social epistemology seminar (probably too well, in hindsight). Five of us each formed a judgment on three "premises" for every finalist — fit with the department's research needs, teaching effectiveness, and strength of the letters — and then a seperate up-or-down judgment on whether to extend an offer, under the "official" rule that you extend an offer iff all three premises are satisfied. When we tallied things issue-by-issue (majority vote on each premise, then apply the rule) one candidate came out on top; when we instead just had everyone vote holistically on the final question, a totally different candidate won. Nobody was being irrational or strategic — people were just applying the rule to their own honest judgments — but the two procedures spat out different winners. I sort of waved my hands in the meeting and muttered something about Kornhauser and Sager's old doctrinal paradox, but I never actually made anyone, including myself, sit down and work through why this happens or what a committee is supposed to do about it. We just re-voted until the awkwardness went away, which is obviously not a principled solution to anything.

  Now that grades are in and I've got some breathing room, I'd like to actually think this through instead of just gesturing at the literature. Could you walk me through the most important implications of the discursive dilemma, and the broader judgment-aggregation impossibility results (List and Pettit's work, mainly, though feel free to bring in others), for how a committee like mine should structure its deliberation and voting procedure going forward? I'm especially interested in whether there's any principled, non-arbitrary way to choose between premise-based and conclusion-based procedures, rather than it just coming down to whichever one the chair happens to call for on the day, and whether the systematicity condition that drives the impossibility result is something a hiring committee could just reject in good conscience, given what these committees are actually for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A philosophy professor (likely tenure-track or tenured, given they chair committees and teach social epistemology).
      *   **Context:** They chaired a hiring committee. They encountered a real-life instance of the Discursive Dilemma (Doctrinal Paradox). They taught this material but didn't apply it rigorously in the moment. Now they want to reflect deeply on the implications for committee design.
      *   **Tone:** Academic, reflective, slightly self-critical ("roped into," "waved my hands," "mutted something"), but seeking rigorous philosophical guidance.
      *   **Key Questions:**
          1.  What are the most important implications of the Discursive Dilemma/Judgment Aggregation for committee structure?
          2.  Is there a principled way to choose between Premise-Based (PBP) and Conclusion-Based (CBP) procedures?
          3.  Can/should a hiring committee reject the *Systematicity* condition (a key driver of List & Pettit's impossibility theorem) given the specific purpose of hiring committees?

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Phenomenon:** The Discursive Dilemma (Kornhauser & Sager).
          *   Scenario: $N$ judges, $P_1, P_2, P_3$ (premises), $C$ (conclusion). Rule: $C \iff (P_1 \land P_2 \land P_3)$.
          *   PBP: Vote on $P_i$, derive $C$.
          *   CBP: Vote on $C$ directly.
          *   Result: Can diverge.
      *   **The Impossibility Theorem:** List & Pettit (2002, 2004).
          *   Conditions: Universal Domain, Anonymity, Systematicity (or Independence + Monotonicity), Consistency.
          *   Result: No aggregation function satisfies all for non-trivial agendas.
      *   **The User's Specific Questions:**
          *   *PBP vs. CBP:* Which is better for hiring?
          *   *Systematicity:* Can we drop it?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the irony (teaching it but not using it). Validate the experience (it's a classic case). Set the stage for a rigorous breakdown.

      *   **Part 1: Diagnosing the Dilemma (The "What Happened"):**
          *   Briefly formalize the user's scenario to ensure we are on the same page.
          *   Explain *why* it happens (logical connection vs. individual judgment).
          *   Highlight the normative tension: Integrity of reasoning (PBP) vs. Democratic authority (CBP).

      *   **Part 2: PBP vs. CBP (The "Principled Choice"):**
          *   This is the core practical question. Is there a non-arbitrary way to choose?
          *   *Argument for PBP:* Reason-giving, accountability, consistency, protects minority views on specific criteria (e.g., teaching matters even if research is the majority focus). It treats the committee as a *collective agent* with reasons.
          *   *Argument for CBP:* Respects individual holistic judgment, avoids "tyranny of the premises," acknowledges that criteria might be incommensurable or weighted differently by members.
          *   *The "Principled" Resolution:* It depends on the *purpose* of the committee.
              *   If the goal is to apply *departmental standards* objectively -> PBP.
              *   If the goal is to aggregate *individual discretion* -> CBP.
              *   *Recommendation:* For hiring, PBP is usually superior because hiring is about justifying a decision to the dean/faculty based on criteria, not just gut feeling. However, weights matter (is "Research" more important than "Teaching"?). If weights vary, simple conjunction ($P_1 \land P_2 \land P_3$) is flawed.

      *   **Part 3: The Impossibility Theorem & Systematicity:**
          *   Explain List & Pettit's result briefly.
          *   Focus on *Systematicity* (treating all propositions the same way).
          *   *Can we reject it?* Yes. In fact, we *must* if we want a working committee.
          *   *How?* By introducing *weighting* or *special roles*.
          *   *The "Chair" Factor:* The user mentioned the chair calling the procedure. This breaks anonymity/systematicity. Is that bad? Not necessarily. A chair has a fiduciary duty to the process.
          *   *Deliberation:* The theorem assumes fixed judgments. Deliberation changes judgments. This is the "escape hatch." Social epistemology isn't just aggregation; it's transformation.

      *   **Part 4: Practical Recommendations (The "So What"):**
          *   Don't just vote. Deliberate *before* voting.
          *   Clarify the logic: Is it conjunctive (all needed) or compensatory (high research makes up for low teaching)?
          *   If compensatory, the logical structure changes ($P_1 + P_2 + P_3 > Threshold$), which avoids the strict doctrinal paradox but introduces weighting issues.
          *   Transparency: Decide the procedure *before* seeing candidates (Universal Domain/Ex Ante agreement).

      *   **Conclusion:** Summarize. The paradox isn't a bug; it's a feature that forces clarity on values.

  4.  **Refining the Tone and Content:**
      *   *Tone Check:* Keep it collegial. Use philosophical terminology correctly (systematicity, universal domain, collective rationality) but keep it accessible.
      *   *Specific Address:* The user asked about rejecting Systematicity "in good conscience." I need to address the normative weight of that condition. Systematicity implies neutrality between propositions. In hiring, propositions are *not* neutral (Research might matter more than Teaching). So rejecting Systematicity is not just allowed; it's required.
      *   *List & Pettit:* Ensure the distinction between the 2002 theorem and later work on deliberation is clear.
      *   *Self-Correction during drafting:* I initially thought about suggesting weighted voting. But that complicates things. Better to focus on the *logical structure* of the criteria. Also, emphasize that the "re-vote until awkwardness went away" is a form of deliberation, just unstructured.

  5.  **Final Polish:** Check against the user's specific prompts.
      *   *Implications?* Covered (collective rationality vs. democracy).
      *   *PBP vs CBP choice?* Covered (depends on purpose/weights).
      *   *Reject Systematicity?* Covered (Yes, criteria aren't equal).
      *   *List & Pettit?* Included.
      *   *Kornhauser & Sager?* Acknowledged.

  6.  (Self-Correction on "Systematicity"): I need to be precise. Systematicity means the aggregation function is the same for all propositions *and* permutation invariant. Rejecting it allows us to treat "Research" differently from "Teaching." This is crucial for hiring. I will make this a central point.

  7.  (Final thought on Deliberation): The user teaches social epistemology. They know that belief revision is key. I should emphasize that the impossibility theorems assume static judgments. Real committees are dynamic. This is the most "social epistemology" way out.

  8.  **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  It is a distinct kind of professional irony to teach the discursive dilemma and then fall victim to it in real time. Please be gentle with yourself; the fact that you recognized it in the moment ("muttered something about Kornhauser and Sager") puts you ahead of 95% of committee chairs. The "re-vote until the awkwardness went away" strategy is, as you note, the standard administrative patch, but it leaves the normative justification for the hire vulnerable to later scrutiny (e.g., from a Dean or an aggrieved candidate).

  Since you want to move past the hand-waving, let's treat your committee as a case study in judgment aggregation. The tension you experienced isn't just a procedural glitch; it reveals a fundamental conflict between **collective rationality** (the committee acting as a single reason-responsive agent) and **democratic responsiveness** (the committee acting as a vessel for individual member wills).

  Here is a breakdown of the implications of the List and Pettit impossibility results for your specific context, focusing on your three questions: the PBP vs. CBP choice, the status of Systematicity, and the role of deliberation.

  ### 1. The Normative Choice: Premise-Based vs. Conclusion-Based

  You asked if there is a principled, non-arbitrary way to choose between the Premise-Based Procedure (PBP) and the Conclusion-Based Procedure (CBP). The short answer is **yes**, but the principle depends on how you conceive of the committee's ontological status.

  **The Case for PBP (Collective Rationality):**
  If the committee is meant to act as a **corporate agent** (to use Pettit's terminology), it must be capable of giving reasons for its actions that are consistent over time.
  *   **Accountability:** In hiring, you must justify the offer to the Dean, the Provost, and the faculty. A PBP outcome generates a "reason record." If you hire Candidate A, you can say, "The committee found A satisfied Research, Teaching, and Service." If you use CBP and hire A, but a majority thought A was *bad* at Teaching, you are lying if you claim the committee values Teaching.
  *   **Integrity:** PBP enforces the logical constraints of the department's stated values. If the rule is "Offer iff (Research $\land$ Teaching $\land$ Letters)," PBP respects that constraint. CBP allows the group to violate its own stated rules if the majority mood shifts.
  *   **Protection of Minorities:** In your scenario, PBP protects the minority view on specific criteria. If 3/5 members think the candidate is a bad teacher, but 4/5 think they are a good researcher, CBP might hire them (if the holistic vote is positive). PBP blocks the hire, signaling that Teaching is a veto constraint, not a tradable commodity.

  **The Case for CBP (Democratic Aggregation):**
  If the committee is merely a **sampling device** for individual judgments, CBP is superior.
  *   **Holism:** Individual judgment is often nuanced. A member might think, "The research is weak, but the teaching is so exceptional it compensates." A strict conjunctive PBP ($R \land T \land L$) destroys this nuance. CBP respects the individual's internal weighting of criteria.
  *   **Responsiveness:** CBP ensures the outcome tracks the majority's will regarding the *result*, even if they disagree on the *reasons*.

  **The Principled Resolution for Hiring:**
  For a university hiring committee, **PBP is generally the more defensible choice,** but only if the criteria are truly conjunctive.
  *   **Why?** Hiring is a fiduciary act. You are spending public/private funds and allocating a permanent line. You are obligated to apply the department's stated criteria consistently. If the department says "We need a teacher-scholar," PBP ensures both dimensions are vetted by the collective. CBP risks hiring a researcher the majority thinks cannot teach, simply because the "holistic vibe" was good.
  *   **The Caveat:** PBP is only principled if the logical connection between premises and conclusion is agreed upon *ex ante*. If your rule is "Offer iff All Three," but half the committee believes Research should outweigh Teaching, PBP is imposing a false logic.

  ### 2. Can We Reject Systematicity in Good Conscience?

  This is the most philosophically rich part of your query. List and Pettit's impossibility theorem (2002, 2004) relies on several conditions, including **Universal Domain**, **Anonymity**, and **Systematicity**.

  **Systematicity** requires that the aggregation function be the same for all propositions on the agenda (i.e., you vote on Research the same way you vote on Teaching) and that it be permutation invariant (the label of the proposition doesn't matter).

  **Should a hiring committee reject it?**
  **Absolutely.** In fact, insisting on Systematicity in a hiring context is arguably irrational.

  *   **Criteria are not Equal:** In almost every hiring context, the premises are not of equal weight. Research fit might be a hard constraint, while Teaching might be compensatory. Or Letters might be tie-breakers. Systematicity forces you to treat "Strength of Letters" with the exact same aggregation rule as "Research Fit." There is no moral or epistemic reason to do this.
  *   **How to Reject It:** You can break Systematicity by assigning **weights** or **special roles** to specific premises.
      *   *Weighted Premises:* Instead of $(P_1 \land P_2 \land P_3) \to C$, you might use a scoring system where $P_1$ (Research) counts for 50% and $P_2, P_3$ count for 25%. This moves you away from a logical paradox and toward a scoring paradox (Condorcet cycles), but it avoids the specific discursive dilemma where the logical connective is the problem.
      *   *Expertise Weighting:* You might decide that the aggregation rule for "Research" should be weighted toward the sub-field experts on the committee, while "Teaching" is weighted toward those with pedagogical training. This breaks Anonymity and Systematicity, but it increases epistemic reliability.

  **The Conscience Check:**
  Rejecting Systematicity is not "cheating" the theorem; it is acknowledging that the theorem applies to *neutral* aggregation of *equivalent* propositions. Hiring criteria are neither neutral nor equivalent. You can reject Systematicity in good conscience because the propositions ("Is this person a good researcher?" vs. "Is this person a good teacher?") have different normative weights in the final decision.

  ### 3. The "Escape Hatch": Deliberation and Dynamic Judgments

  The impossibility theorems assume a **fixed profile** of judgments. They take a snapshot of individual minds and try to aggregate them. But as a social epistemologist, you know that committees are not voting machines; they are **deliberative bodies**.

  List and Pettit (and later Christian List) have argued that the impossibility results dissolve if we allow for **deliberative updating**.

  *   **The Problem:** In your meeting, you tallied judgments that were formed *prior* to or *independently* of the group's reasoning. You aggregated *static* opinions.
  *   **The Solution:** The committee should deliberate on the *premises* before voting on the *conclusion*.
      *   If Member A thinks Research is weak, and Member B thinks it is strong, they should discuss *why*.
      *   If the discussion is truth-tracking (or at least reason-tracking), judgments should converge.
      *   If judgments converge on the premises, the discursive dilemma disappears.

  **Implication for Procedure:**
  The "re-vote until awkwardness went away" was actually a clumsy attempt at deliberation. A principled approach would structure this:
  1.  **Premise Deliberation:** Discuss Research Fit until consensus or near-consensus is reached. Record the collective judgment. Do the same for Teaching and Letters.
  2.  **Apply Rule:** If the collective judgment on all premises is "Yes," the offer is extended.
  3.  **Dissent Management:** If the group cannot agree on a premise (e.g., 3-2 on Research), the PBP says "No Hire." This forces the majority to convince the minority or accept the status quo. This is harder than CBP, but it prevents the "tyranny of the holistic gut feeling."

  ### 4. Practical Recommendations for Future Committees

  Given the above, here is a proposed protocol for your next committee chairing stint that respects the impossibility results without being paralyzed by them:

  1.  **Fix the Logic Ex Ante:** Before looking at a single CV, the committee must agree on the decision rule. Is it conjunctive (all criteria must pass)? Is it compensatory (high research offsets low teaching)?
      *   *If Conjunctive:* PBP is mandatory. You cannot vote holistically if the rule is "must pass all thresholds."
      *   *If Compensatory:* You need a scoring rubric, not a logical proposition. This avoids the doctrinal paradox but requires agreeing on weights (which breaks Systematicity).

  2.  **Adopt a "Reason-First" PBP:** Structure the meeting to vote on premises *sequentially* with discussion in between.
      *   Vote on Research. If it fails, stop. (Saves time).
      *   If it passes, discuss Teaching.
      *   This ensures the collective judgment on the premises is robust, not just an aggregation of private hunches.

  3.  **Legitimize the Chair's Role (Breaking Anonymity):**
      *   You mentioned the procedure coming down to "whichever one the chair happens to call for." The impossibility theorems assume Anonymity (every voter counts equally).
      *   In a committee, the Chair often has a tie-breaking vote or a procedural mandate. Acknowledge this. The Chair's role is to ensure the *process* remains rational, even if it overrides the immediate majority will on the procedure. Deciding on PBP *before* the vote is a legitimate exercise of chair authority to ensure collective rationality.

  4.  **Accept "No Hire" as a Rational Outcome:**
      *   The discursive dilemma often produces a "No Hire" under PBP when CBP would produce a "Hire." This feels like a loss.
      *   Reframe this: PBP has a higher threshold for collective responsibility. If the committee cannot collectively affirm the premises, it lacks the *reasons* to make the hire. Hiring without collective agreement on the reasons is an epistemic risk for the department.

  ### Summary

  You can choose between PBP and CBP non-arbitrarily by asking: **Do we want to be a court of law (PBP) or a legislature (CBP)?** Hiring is quasi-judicial; you are applying standards to a case. PBP is the default for judicial reasoning.

  You can reject Systematicity in good conscience because hiring criteria are inherently weighted and non-fungible. Research fit is not the same *kind* of proposition as Teaching effectiveness.

  Finally, do not treat the impossibility theorem as a dead end. Treat it as a design constraint. It tells you that if you want a rational collective agent, you cannot simply aggregate static, private judgments. You must build a process that transforms private judgments into public reasons *before* the aggregation happens. That is, after all, what a seminar in social epistemology is supposed to teach us.

  **Suggested Reading for your Reflection:**
  *   **List, C. & Pettit, P. (2002).** "Aggregating Sets of Judgments: An Impossibility Result." *Economics and Philosophy*. (The baseline).
  *   **Pettit, P. (2007).** "Responsibility Incorporated." *Ethics*. (On the corporate agent argument for PBP).
  *   **List, C. (2006).** "The Discursive Dilemma and Public Reason." *Ethics*. (On how deliberation resolves the paradox).
  *   **Hartmann, S. & Sprenger, J. (2012).** "Judgment Aggregation and the Problem of Tracking the Truth." *Philosophy of Science*. (Epistemic justification for PBP).

  You have a perfect "teachable moment" for your next social epistemology seminar: your own committee. Use the data (anonymized, of course). It's the best way to honor the paradox.
