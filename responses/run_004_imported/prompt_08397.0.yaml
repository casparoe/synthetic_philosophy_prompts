answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of being Priya's best friend for a long time.

  Now, usually, this is the part where I'd tell a story about how we met, or how Priya once saved my life during a disastrous haircut. But Priya asked me to say something real tonight. And the truth is, my brain works a bit differently. I never went to university. My higher education mostly happened in charity shops.

  A few years ago, I found a battered copy of a book called *Principia Ethica* for two pounds. It smelled like damp and changed how I see everything. It's by a philosopher named G.E. Moore. And I know what you're thinking: "Great, a lecture." Don't worry, Nan, I'll keep it brief. But Moore had a specific idea about love that fits Priya and Sam perfectly.

  Moore talks about something called "organic unities." In plain English: sometimes, when you put two things together, the result is worth way more than just adding them up. A pile of guitar parts isn't music. A pile of flour and eggs isn't a cake. The magic is in the combination.

  But here is where Moore gets strict, and I think Sam will appreciate this precision. He argues that most of us get "personal affection" wrong. We think love is just having warm, fuzzy feelings. Moore says no—that's too cheap. Feelings come and go. Or, we think love is just respecting someone's virtues from a distance, like admiring a statue. He says that's too cold.

  Real affection—the kind that is actually one of the "greatest goods" in the universe, according to him—requires two things happening at once. First, you have to have a clear, honest consciousness of who the other person actually is. Not who you want them to be. Not a polished version. But the real thing. And second, you have to direct a specific emotion toward *that* truth.

  Priya, I've watched you with Sam. You don't just "feel good" around him. You see him. You see the stubbornness, the late nights, the way he overthinks the routing of a cable, and you don't just tolerate it; you embrace the reality of him. And Sam, I see how you look at her. You aren't just happy she's there. You recognize her fire, her occasional chaos, her brilliance, and you respond to *that*.

  Moore was very clear that this isn't just about "making each other happy." Happiness is fleeting. This is about value. It's about building a whole that is greater than the sum of two individuals.

  And that brings me to the second half of Moore's theory. He said there are really only two things that hold the most value in human life. The first is personal affection—what we see in this marriage. The second is the appreciation of beauty.

  Look around this room. The flowers, the light, the fact that Priya's cousins managed to coordinate their outfits, the sheer improbability of us all being here at this exact moment in time. That is the beauty.

  So, Priya and Sam, you aren't just starting a life of "happiness." You are committing to the hardest, most valuable work there is: keeping your eyes open to who the other person really is, and choosing to love that reality, every single day. You are building an organic unity.

  If I can quote a two-pound charity shop book for one last second: Moore reckons a world with just one person loving another truly is better than a world with a million people just feeling "pleased."

  So, please raise your glasses. To the beauty of today, and to the organic unity of tomorrow. To Priya and Sam.
