answer: |-
  **The Unfinished Revolution: Quine, White, and the Fate of Moral Holism**

  W. V. O. Quine's 1951 landmark essay, "Two Dogmas of Empiricism," is often taught as the funeral of logical positivism. By arguing that our beliefs face the "tribunal of experience" not individually but as a "corporate body," Quine dissolved the rigid wall between analytic truths (true by definition) and synthetic truths (true by fact). In Quine's famous metaphor, human knowledge is a web: logic and mathematics sit at the center, protected from direct refutation, while observational statements sit at the periphery, taking the brunt of sensory impact. When experience conflicts with prediction, we can adjust statements anywhere in the web to restore equilibrium.

  However, a puzzle remains. If the web is seamless, where does morality fit? In his 1978 essay "On the Nature of Moral Values," Quine suggests that ethics is part of the web but methodologically inferior to science. His colleague Morton White, in *What Is and What Ought to Be Done*, argued that this concession betrays Quine's own holism. To understand who wins this dispute, we must reconstruct Quine's hesitation, examine White's charge of inconsistency, and determine whether naturalized epistemology can sustain a naturalized ethics.

  **Quine's Case: Ethics as Coherence Without a Checkpoint**

  Quine's approach to ethics is grounded in his behaviorism and naturalism. He opens "On the Nature of Moral Values" with a peculiar vignette: a dog sitting motionless near a turnip. Quine uses this to illustrate that behavior is a function of both belief and desire. You cannot isolate the dog's "belief" about the turnip from its "desire" to eat or ignore it. Similarly, human moral action mixes cognitive states (beliefs about the world) with conative states (desires or sentiments).

  Quine acknowledges that values evolve. He notes that instrumental means often transform into intrinsic ends. Fishing may begin as a mere method to secure food (prudence), but over time, the activity itself becomes valued for its own sake. Furthermore, the line between prudence and morality is porous. Quine contrasts clear moral duties, like concern for a neighbor's welfare, with mere preferences, like a fondness for peanut brittle. Yet, in between lie customs regarding dress or food taboos, where it is genuinely difficult to say where self-regard ends and social obligation begins.

  Despite admitting that moral values are woven into our overall worldview, Quine insists on a methodological hierarchy. For Quine, science is privileged because it possesses an "empirical edge." Scientific theories ultimately answer to sensory stimulation; they make predictions about observable events that can be confirmed or falsified. Ethics, Quine argues, lacks this checkpoint. There is no "moral observation" analogous to seeing a red patch or measuring a voltage. Consequently, moral disagreements cannot be settled by appealing to the world, but only by appealing to the moral standards people already share. For Quine, this reduces ethics to a coherence theory of truth: a moral system is "true" only insofar as it coheres with our existing sentiments, lacking the external constraint that makes science objective. Thus, ethics is the "lot of coherence," while science enjoys the "lot of correspondence."

  **White's Objection: The Inconsistency of Halfway Holism**

  Morton White, Quine's longtime Harvard colleague, viewed this distinction as a philosophical cop-out. In *What Is and What Ought to Be Done*, White argues that Quine stopped his revolution halfway. If Quine is right that *no* statement is immune to revision—not even the laws of logic—then there is no principled reason to exclude moral principles from the web of belief that answers to experience.

  White's core argument is that Quine retains a covert version of the very empiricist dogma he claimed to destroy. By insisting that only *sensory* stimulation counts as a valid empirical checkpoint, Quine arbitrarily privileges physical perception over moral experience. White suggests that moral sentiments—feelings of approval, guilt, indignation, or empathy—function as the "empirical edge" for ethics in exactly the way sense data functions for science. When a moral principle (e.g., "slavery is permissible") generates a strong sentiment of revulsion, that sentiment is a form of experiential friction, just as a failed prediction is for physics.

  For White, consistency requires a "unified theory of justification." If we treat logic and mathematics as revisable strands in the web because they help us organize experience, we must treat moral norms the same way. They are hypotheses about how to live that are tested against the "data" of human suffering and flourishing. To say ethics lacks an empirical checkpoint is to ignore the reality of moral pain and satisfaction as natural phenomena. White argues that Quine's naturalism should lead him to treat moral values as part of the causal fabric of the world, subject to the same holistic revision as any other belief.

  **The Verdict: White Wins on Naturalist Grounds**

  While Quine's caution regarding the objectivity of ethics is intuitively appealing, **Morton White wins this dispute.** Quine's ranking of ethics beneath science is inconsistent with the radical holism of "Two Dogmas," and maintaining it requires smuggling in a verificationist criterion that Quine ostensibly rejected.

  Quine's argument rests on the assumption that "experience" is limited to sensory stimulation that predicts physical events. But this is a relic of the logical positivism he sought to undermine. If knowledge is a web that helps us navigate the world, "navigation" includes not only predicting planetary motion but also negotiating social coexistence. The "irritation" that prompts us to revise a strand of the web need not be a retinal stimulus; it can be a social or emotional dissonance. When a society finds that a specific moral belief leads to systemic unrest or profound psychological suffering, that is an empirical failure of the belief, analogous to a scientific theory failing to predict an eclipse.

  By denying this, Quine creates a dualism between the "factual" web and the "valuative" web. He treats sensory stimuli as "real" inputs but moral sentiments as merely internal quirks. However, from a strictly naturalistic standpoint, moral sentiments are just as physical and causal as visual stimuli. They are neural states caused by social and environmental conditions. If Quine is a naturalist, he must admit that moral experience is part of nature. To privilege one type of neural input (vision) over another (moral indignation) as the sole arbiter of truth is arbitrary.

  Quine is correct that ethics lacks science's *predictive precision*. We cannot calculate moral outcomes with the exactitude of physics. However, White is right that this is a difference in degree and complexity, not a difference in *kind* of justification. Science also deals with underdetermined theories and holistic adjustments. The fact that moral checkpoints are "messier" (involving complex emotional and social variables) does not mean they are non-existent.

  Therefore, White's position is the philosophically superior extension of Quinean holism. Quine wanted to naturalize epistemology, placing the study of knowledge within psychology and biology. White correctly saw that you cannot naturalize the mind without naturalizing value. If we are organisms interacting with an environment, our values are tools for survival and social cohesion, tested by the "experience" of whether they work. To relegate ethics to a mere coherence game is to deny that moral failure has real-world consequences comparable to scientific error.

  **Conclusion**

  Quine's "Two Dogmas" opened the door to a seamless web of belief, but in "On the Nature of Moral Values," he attempted to close it before ethics could enter. He argued that without a sensory checkpoint, ethics remains a closed loop of shared sentiments. Morton White demonstrated that this restriction violates the spirit of holism. If the web is truly interconnected, moral sentiments must be recognized as empirical data points that constrain and revise our normative beliefs. White wins because he follows the logic of naturalism to its conclusion: there is no supernatural "fact" distinct from "value," just as there is no analytic truth distinct from synthetic. Both are strands in the same web, tightened by the same tension of experience. Quine gave us the web; White showed us that we cannot cut the moral threads without unraveling the whole.
