          *   *Crucial Distinction:* Rovelli says time is emergent. Borges says time is inescapable *despite* being refutable.
      *   *Borges's Broader Work:* Mention *The Garden of Forking Paths*. He already imagined non-linear time. Rovelli gives it physics; Borges gave it narrative.
      *   *Conclusion:* Borges would likely see Rovelli as a kindred spirit in deconstruction, but would insist that the *feeling* of time is the only truth that matters for a human being. He would cherish the paradox, not resolve it.

