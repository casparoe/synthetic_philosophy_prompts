answer: |-
  It is a genuine pleasure to correspond with someone who has spent a lifetime reading the strata of the earth, only to find the ground shifting beneath the concept of time itself. There is a particular irony in being a geologist—a keeper of deep time—feeling untethered by the present moment. You know better than most that "now" is a geological blink, yet Rovelli and Borges suggest it might not even be that.

  To answer your question directly: If you handed Borges *The Order of Time* today, I do not think he would view it as vindication, nor do I think he would dismiss it as merely "the easy half." I suspect he would treat Rovelli's physics as a magnificent new metaphor for an old metaphysical suspicion, but he would ultimately argue that Rovelli has solved the *equation* while missing the *poem*.

  Here is why I think Borges's reaction would be more complex than simple agreement or dismissal.

  ### 1. The Vindication of the "Discrete Moment"
  You noted that Borges, leaning on Berkeley and Hume, argues for self-sufficient instants with no thread connecting them. Rovelli's loop quantum gravity describes a world not of things, but of *events*—granular, discrete interactions where time does not flow but unfolds relationally.

  Borges would delight in this. In *The Garden of Forking Paths* (1941), he imagined time not as a line but as a web of diverging, converging, and parallel realities. He was already comfortable with the idea that temporal succession is a mental construct. Reading Rovelli, he would likely nod at the confirmation that the universe does not keep a universal clock. He would see Rovelli's "blurriness" (the idea that we see time only because we ignore microscopic variables) as a physical restatement of Idealism: we impose order on chaos to survive.

  In this sense, yes, he would feel a kinship. Rovelli provides the hardware for Borges's software.

  ### 2. The Critique of the "About-Face"
  However, this is where your intuition about the "hard half" of the argument is spot on.

  The ending of *A New Refutation of Time* is the key. Borges writes: *"The world, unfortunately, is real."* He admits that while logic can dismantle time, suffering cannot. You cannot suffer a logical proposition; you suffer duration. You suffer waiting, aging, and loss.

  Rovelli explains *why* we perceive time (entropy, thermodynamics, our limited perspective). He demystifies the illusion. But Borges is not interested in demystifying the illusion; he is interested in the *burden* of it.

  If Borges read Rovelli, I suspect he would say: *"You have explained why the clock ticks, Carlo, but you have not explained why the ticking breaks our hearts."*

  Rovelli's tone is one of wonder. He finds beauty in the dissolution of time. Borges's tone is one of melancholy resignation. For Borges, the "refutation" of time is an intellectual game, but the *experience* of time is a prison. He would likely argue that Rovelli has skated past the existential weight of the "now." Even if the "now" is thermodynamically emergent, it is the only place where consciousness resides. To explain it away as "low resolution" is, from a literary standpoint, to explain away the human condition.

  ### 3. The Irony of the Refutation
  There is another layer here that a geologist might appreciate: stratigraphy vs. the fossil record.

  Borges was an ironist. *A New Refutation of Time* is arguably not a sincere attempt to prove time doesn't exist, but a demonstration of how seductive logic can be. He builds the castle of cards just to show how easily it falls, and then admits he lives in the castle anyway.

  Rovelli is a scientist; he is earnest. He believes he is uncovering the structure of reality. Borges would likely view Rovelli's theory as another "labyrinth"—a beautiful, coherent system that helps us navigate the universe but shouldn't be mistaken for the territory itself.

  Borges often wrote that reality is too complex for any single system, whether theological, philosophical, or physical. He would likely warn that Rovelli's "entropic time" is just another narrative we tell ourselves to make the silence of the universe bearable. It replaces the "Newtonian Clock" with the "Entropic Blur," but it is still a story.

  ### 4. The Geological Connection
  Since you come from geology, consider this: You spent your career measuring time by the accumulation of sediment, the decay of isotopes, the uplift of mountains. That is time as *matter*, time as *consequence*.

  Rovelli says time is the *consequence* of entropy (heat death, disorder). Borges says time is the *consequence* of memory and identity.

  If Borges read Rovelli, I think he would seize on the concept of entropy. For Borges, entropy is the literary theme of decay and forgetting. In *The Ruins* or *The Immortal*, the tragedy is always that things persist too long or not long enough. Rovelli says time exists because things wear out (thermodynamics). Borges would say: *"Exactly. Time is the measure of loss. That is why it is real, even if physics says it isn't."*

  ### The Verdict
  So, to your specific options:

  *   **Vindication?** No. Borges doesn't want to be right about time not existing. He wants to be wrong, because the alternative is too lonely.
  *   **Critique of the "Easy Half"?** Closer. He would say Rovelli solved the physics but sidestepped the metaphysics of *feeling*.
  *   **The "Other" Reaction:** This is the most likely. Borges would treat Rovelli's book as a work of speculative fiction that happens to be mathematically rigorous. He would appreciate the *imagery* of a world without time—a world of events rather than objects—and use it to write a new story.

  He would likely conclude that Rovelli has given us a better map, but the territory is still the same old labyrinth. The "now" may not be fundamental to the universe, but it is fundamental to the *self*. And since, for Borges, the self is the only thing we can truly verify (even if Hume says otherwise), the "now" remains the only truth that matters.

  He might even write a postscript to his old essay: *"Carlo Rovelli has since demonstrated that time is a thermal illusion. I am glad of this. It explains why the past cools as it recedes, and why the present burns."*

  It is a strange comfort, isn't it? To spend a lifetime measuring millions of years, only to find that the only time that matters is the blurry, entropic moment you're holding right now. Rovelli says it's an illusion. Borges says it's a tragedy. As a geologist, perhaps you see it as erosion: the only thing that proves the river existed is the canyon it left behind.
