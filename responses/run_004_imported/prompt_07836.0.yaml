answer: |-
  Here are ten interview questions drafted for your podcast, designed to leverage your background as a practitioner while probing the metaphysical commitments of your guest's position. The four mandated topics are integrated into questions 4, 5, 7, and 10, with the conversation concluding on the hardest challenge.

  **1.** In my daily work, I treat causal graphs as engineering schematics: if I turn this valve, pressure drops there. You argue that Woodward's interventionism is superior to Lewis's counterfactuals because it aligns better with scientific practice. But for a practitioner like me, the "truth" of a model is often just its predictive stability. Is there actually a practical difference between a model that is *true* in your interventionist sense and one that is merely *stable* in a Lewisian regularity sense, or does the distinction only matter when we step outside the spreadsheet?

  **2.** You've mentioned that Lewis's theory never recovered from preemption cases, like the backup assassin. But in logistics, we rarely worry about assassins; we worry about confounders and selection bias. Beyond solving these classic thought experiments, does interventionism actually solve problems that Lewisian counterfactuals *can't* handle in applied econometrics, or does it just offer a more intuitive vocabulary for the same mathematical constraints?

  **3.** Structural Equation Models (SEMs) are the backbone of your view, where each equation represents a distinct mechanism. When I specify a model, I'm making a judgment call about which variables to include and which to bundle into the error term. On your view, is the "causal structure" something out there in the world waiting to be mapped, or is it partly constituted by the way we choose to carve up the system into equations?

  **4.** **[Mandate Topic: Non-reductivity]** Woodward defines an "intervention" using explicitly causal language: an intervention variable must *cause* the target variable but not be *caused* by other variables in the system. Lewis, by contrast, wanted to analyze causation in terms of non-causal counterfactuals and similarity. Doesn't defining "intervention" causally make your theory non-reductive in a way that should disappoint anyone drawn to it hoping for a Lewis-style analysis of causation in wholly non-causal terms?
  *   **Follow-up:** If you concede that the theory is non-reductive, are you essentially admitting that interventionism isn't a metaphysical account of what causation *is*, but rather a methodological prescription for how we should *talk* about it?

  **5.** **[Mandate Topic: Similarity Metrics]** When we perform a difference-in-differences analysis, we assume that, absent the treatment, the treatment and control groups would have followed parallel trends. This looks a lot like selecting the "closest possible world." When you say an intervention must "hold everything else fixed," aren't you relying on a substantive judgment about which changes count as staying fixed that functions exactly like Lewis's similarity metric?
  *   **Follow-up:** If the graph tells you what to hold fixed, but you need causal knowledge to draw the graph, haven't you just pushed the need for a similarity metric back one step rather than eliminating it?

  **6.** In biology and economics, we often speak of "mechanisms" as the black boxes between variables. Interventionism seems to require that these mechanisms be modular—meaning I can tweak one without breaking the others. But in complex adaptive systems, like a supply chain or an ecosystem, modularity often fails. Is interventionism secretly committed to a view of the world as more modular and compartmentalized than it actually is?

  **7.** **[Mandate Topic: Fat-handed Interventions]** In the real world, interventions are rarely surgical. If I raise interest rates to curb inflation, I also affect exchange rates and employment—a "fat-handed" intervention. Your account rules these out via invariance and modularity conditions to preserve causal clarity. Why are these conditions any less gerrymandered than Lewis's own weighted system of respects of similarity?
  *   **Follow-up:** If we have to model every side-effect of a fat-handed intervention as a separate variable to save the theory, doesn't the model become so complex that it loses the explanatory simplicity that made interventionism attractive in the first place?

  **8.** Let's talk about discovery. I can run a regression to find correlations, but I need theory to justify the causal arrows. If interventionism defines causation via interventions, but we often need to know the causation to design a valid intervention, how do we ever get started? Is there a bootstrap problem here that relies on prior causal intuition?

  **9.** One reason I like interventionism is that it links directly to policy: if I can't intervene, I can't change the outcome. But does this tie causation too closely to human agency? If a causal process occurs deep in a star where no human can ever intervene, does your theory deny it is causal, or do we have to stretch the definition of "intervention" until it loses its grip?

  **10.** **[Mandate Topic: Unmanipulable Domains]** This brings me to the hardest case. In macroeconomics, history, or psychology, there are domains—like the 1929 crash or Caesar's crossing of the Rubicon—where no one could ever perform the relevant surgical manipulation even in principle. Does talk of interventions keep any literal content in these domains, or does it quietly turn back into just another counterfactual theory once you are there?
  *   **Follow-up:** If it does collapse into a counterfactual theory in these domains, does that mean interventionism is only a local theory of causation for the lab sciences, rather than a general metaphysics of cause and effect?
