      *   *Why philosophers avoid "desert":* Because "desert" requires a moral metric (did he work hard enough? is his talent innate or earned?). Nozick wants to avoid that quagmire. He wants to say, "It doesn't matter if he deserves it; it matters that he was given it freely."

