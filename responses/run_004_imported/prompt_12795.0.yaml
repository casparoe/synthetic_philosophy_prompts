answer: |-
  You have spotted a genuine and significant philosophical disconnect. Your intuition is correct: **the founders are misreading Nozick, but in a way that is extremely common and politically useful.**

  You are not wrong to feel that "desert" is doing the work in the *founders' telling* of the story. However, you are also right that "desert" is explicitly *not* doing the work in Nozick's actual argument. In fact, relying on "desert" would actually weaken Nozick's case, which is why philosophers are allergic to that framing.

  Here is the breakdown of why this disconnect exists, why Nozick avoids "desert," and why Silicon Valley loves it anyway. This could be a fantastic pivot point for your longread.

  ### 1. The Mechanism: Entitlement vs. Desert
  The mechanism making the Wilt Chamberlain case go through is **Voluntary Transfer**, not **Moral Desert**.

  Nozick's *Entitlement Theory* rests on three pillars:
  1.  **Justice in Acquisition:** How you originally got the property.
  2.  **Justice in Transfer:** How you traded or gifted it.
  3.  **Rectification:** Fixing past violations of 1 and 2.

  In the Wilt example, Nozick asks you to assume the starting distribution ($D_1$) is already just. Then, he argues that if people *voluntarily* choose to move resources from $D_1$ to Wilt (the 25 cents), the resulting distribution ($D_2$) is automatically just, **regardless of whether Wilt deserves it.**

  Nozick's point is procedural. He is arguing that **liberty upsets patterns.** If you believe in freedom of exchange, you cannot simultaneously enforce a pattern of distribution (like equality or need) because free people will constantly disrupt that pattern.

  If the argument relied on *desert*, Nozick would have to prove Wilt was morally worthy of the money. Instead, Nozick argues that Wilt is *entitled* to the money simply because no rights were violated in the transaction.

  ### 2. Why Philosophers Avoid "Desert" (The Natural Lottery)
  The professor you emailed is correct. Nozick is skeptical of desert-based arguments for a specific reason: **The Natural Lottery.**

  Wilt Chamberlain's talent is largely genetic. He didn't "earn" his height or his fast-twitch muscle fibers. If justice is based on *desert* (moral worthiness based on effort or virtue), then Wilt's windfall is actually suspect. Why should he get millions for traits he just got lucky to be born with?

  If Nozick anchored his argument in desert, he would open the door to the Rawlsian objection: that natural assets are morally arbitrary.

  By anchoring the argument in **entitlement/rights**, Nozick sidesteps the question of whether Wilt *deserves* the money. It doesn't matter if Wilt is a lazy genius or a hardworking mediocrity. If the fans chose to give him the money, and the starting point was just, taxing him to restore a pattern is a violation of his (and the fans') liberty.

  Philosophers avoid the word "desert" in this context because using it betrays a misunderstanding of Nozick's core critique of patterned justice.

  ### 3. Why Silicon Valley Loves "Desert"
  So, why do your founders keep bringing up "desert"? Because **Entitlement is politically cold, while Merit is politically warm.**

  *   **The Libertarian Claim (Nozick):** "I keep my billions because taxing me violates the voluntary contracts I made with my users/investors." (This sounds legalistic and selfish).
  *   **The Meritocratic Claim (Founders):** "I keep my billions because I am smarter and worked harder than everyone else, therefore I *deserve* it." (This sounds moral and justified).

  Silicon Valley ideology is a hybrid of **Libertarianism** (low taxes, low regulation) and **Meritocracy** (technocratic rule by the smartest).

  When founders cite Wilt Chamberlain, they are smuggling a meritocratic justification into a libertarian argument. They want the shield of Nozick's anti-taxation logic, but they want to wear the armor of the "Self-Made Man." They need to believe their wealth is a reflection of their internal virtue (desert), not just a reflection of market dynamics and voluntary transfers (entitlement).

  ### 4. The Angle for Your Longread
  This gloss-over is not just a philosophical error; it's a feature of how tech ideology functions.

  *   **The Tension:** Nozick's argument protects the founder even if they got lucky (e.g., network effects, timing, monopoly). The "desert" narrative requires the founder to believe they didn't get lucky.
  *   **The Function:** By conflating *market value* (what the market will bear/Nozick's entitlement) with *moral value* (what you deserve/meritocracy), tech leaders convert financial success into moral virtue.
  *   **The Consequence:** If taxation is unjust because it violates *entitlement*, it's a legal argument. If taxation is unjust because it punishes *desert*, it's a moral argument. The latter is much harder to fight politically.

  ### Summary
  You are right to be bugged. The founders are using Nozick to defend **Meritocracy**, but Nozick wrote Wilt Chamberlain to defend **Liberty**.

  *   **Nozick:** "Wilt keeps the money because the fans gave it freely."
  *   **Founders:** "Wilt keeps the money because he's Wilt."

  If you can highlight that specific slippage—how Silicon Valley co-opts libertarian philosophy to serve a meritocratic ego—you'll have a very strong philosophical hook for your piece. The "allergy" you sensed in philosophers is the immune system of the text rejecting a foreign body. The founders have injected "desert" into a theory designed to exclude it.
