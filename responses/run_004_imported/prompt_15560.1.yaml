prompt: |-
  Okay so this thing has been bugging me since my Theory of Knowledge class (we're doing the ethics unit rn) -- my teacher brought up this idea called "moral testimony," which is basically the question of whether its okay to just believe something is right or wrong because someone told you, kind of like how you'd believe "Australia is a country" because your geography teacher said so. Like, my little cousin asks me why lying is wrong all the time and I usually just say "it just is, trust me" -- and I've been wondering if that actually gives her moral knowledge, or if something's missing compared to if she'd worked out the reasoning on her own. My teacher said some philosophers think moral testimony is basically fine (we trust testimony for literally everything else in life, so why would morals be different), while others think it's more like aesthetic testimony -- like how it feels kind of hollow to say a painting is beautiful only becuase your friend told you it is, without you ever actually seeing/feeling it for yourself -- and that maybe moral beliefs work the same way.

  Can you write me a dialogue between these two camps -- someone who thinks moral testimony is basically unproblematic (a "moral testimony optimist") and someone who thinks theres something distinctively defective about believing right/wrong purely on someone else's say-so (a "moral testimony pessimist") -- where they actually go back and forth for real? I don't want either one to just fold -- I want the optimist to have a genuine comeback to the aesthetic-testimony comparison (like, maybe that analogy doesn't actually hold up), and I want the pessimist to have a real response to the "we trust testimony for everything so why not this too" move. If it makes sense, I'd love it if by the end they at least pin down exactly what they disagree about, even without resolving it -- like whether it's about testimony failing to give you knowledge at all, or just about it giving you some "lesser" kind of moral standing compared to figuring things out yourself.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

