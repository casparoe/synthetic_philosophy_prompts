      *   **Requirements:**
          *   Genuine back-and-forth (no strawmanning, no easy capitulation).
          *   Optimist must counter the aesthetic analogy.
          *   Pessimist must counter the "we trust testimony for everything else" argument.
          *   Ending: Pinpoint the exact disagreement (knowledge vs. moral standing/understanding) without necessarily resolving it.
      *   **Tone:** Intellectual but accessible (TOK class level), engaging, philosophical.

  2.  **Character Conception:**
      *   *Optimist:* Let's call her **Sarah**. She's pragmatic, trusts social epistemology, sees morality as part of the fabric of knowledge.
      *   *Pessimist:* Let's call him **David**. He values autonomy, moral understanding, and the "first-personal" nature of ethical judgment.

  3.  **Key Arguments to Include:**
      *   *Optimist (Sarah):*
          *   Division of moral labor (we can't figure everything out).
          *   Testimony is how we learn facts, why not values?
          *   The aesthetic analogy fails because morality is action-guiding/objective (unlike taste).
          *   Trusting experts (e.g., bioethicists) is necessary.
      *   *Pessimist (David):*
          *   Moral understanding requires grasping *reasons*, not just conclusions.
          *   Testimony creates "blind" compliance, not virtue.
          *   The aesthetic analogy holds because morality involves a sensibility/response, not just data.
          *   Autonomy is central to moral agency.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Maybe a coffee shop or after class. Establish the prompt (the cousin example).
      *   **Round 1: The Basic Conflict.**
          *   David brings up the cousin example. "Trust me" isn't enough.
          *   Sarah pushes back. We trust teachers about history/science. Why not ethics?
