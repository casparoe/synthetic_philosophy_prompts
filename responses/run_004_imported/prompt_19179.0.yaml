answer: |-
  Here is a reconstruction of that specific move in Strawson's Basic Argument, structured for lecture notes. It focuses on why inserting indeterminism into the causal chain fails to halt the regress of self-creation.

  ### The Core Move: Why Indeterminism Fails to Stop the Regress

  **1. The Student Intuition (The "Libertarian Hope")**
  Students often grasp the regress under determinism: *If my choices are determined by my character, and I didn't choose my character, I'm not responsible.*
  Their instinct is that **indeterminism** offers an escape hatch. If there is an undetermined break in the causal chain—a genuinely open moment where my character is formed—then perhaps *I* can step into that gap and originate myself without being determined by the past.

  **2. Strawson's Structural Rebuttal: The Master Dilemma**
  Strawson argues that this intuition confuses *causal determination* with *self-constitution*. The Basic Argument does not turn on whether the past fixes the future; it turns on **who is doing the fixing.**

  When we ask if an agent is responsible for a change in their character or motives, Strawson forces a dilemma regarding the status of that change:

  *   **Horn A (Determined):** The change in character is caused by prior character/motives.
      *   *Result:* We are back in the regress. To be responsible for the new character, you must be responsible for the prior character that caused it.
  *   **Horn B (Undetermined):** The change in character is *not* caused by prior character/motives (it is random/chance).
      *   *Result:* You lose control. If the change is not determined by who you already were, it is essentially an accident relative to you.

  **3. The Principle of Self-Creation**
  To make this crisp for students, articulate the requirement for "True Moral Responsibility" (TMR) as a **Principle of Self-Creation**:

  > **PSC:** To be truly responsible for a choice, you must be responsible for the mental nature (principles, preferences, character) from which that choice flows.

  Now, apply the indeterminism test to the PSC. For an agent to be responsible for a new mental nature ($N_2$) that emerges from an old one ($N_1$):

  1.  **If $N_1$ determines $N_2$:** You are only responsible for $N_2$ if you were responsible for $N_1$. (Regress continues).
  2.  **If $N_1$ does *not* determine $N_2$ (Indeterminism):** Then the emergence of $N_2$ is not a function of *you* (as constituted by $N_1$). It is a random fluctuation.

  **4. The "Luck" Objection (Structural Version)**
  This is the critical point to emphasize. Under determinism, the threat is **fatalism** (I couldn't do otherwise). Under indeterminism, the threat is **luck** (it just happened).

  *   Strawson's point: Responsibility requires that the outcome be *attributable* to the agent.
  *   If an undetermined event occurs in your brain that alters your character, and that event was not determined by your prior reasons or character, **it did not come from you.** It happened *to* you.
  *   Therefore, indeterminism does not provide a foothold for *self-origination*; it provides a foothold for *accident*.

  **5. Summary for the Board: The "No-Win" Structure**
  You can present this as a formal dilemma regarding the origin of any putative act of self-creation ($S$):

  1.  Either $S$ is determined by the agent's prior nature ($N_{prior}$), or it is not.
  2.  If $S$ is determined by $N_{prior}$, then responsibility for $S$ requires responsibility for $N_{prior}$ (Regress).
  3.  If $S$ is *not* determined by $N_{prior}$, then $S$ is random relative to the agent (No Control).
  4.  Therefore, inserting indeterminism either continues the regress or eliminates agency.
  5.  Thus, the truth or falsity of determinism is irrelevant to the impossibility of True Moral Responsibility.

  ### Lecture Tip: The Architect Analogy
  To make this concrete, ask students to imagine an architect designing a building.
  *   **Determinism:** The architect designs the building based on their training and taste. (Question: Who designed the training and taste?)
  *   **Indeterminism:** The architect designs the building based on a random neural firing that wasn't caused by their training or taste. (Question: Is that *design* or just a *glitch*?)

  Strawson's point is that TMR requires the agent to be the **Ultimate Architect** of their own mind. Indeterminism doesn't give them the blueprints; it just removes the construction crew. You still can't build the house yourself.
