answer: |-
  This is an incredibly heavy burden to carry while grieving. You are dealing with the loss of your father, the trauma of the medical process, and a philosophical crisis about the nature of death itself—all while trying to hold your family together.

  The following eulogy is designed to walk that tightrope. It does not declare a specific medical moment of death. Instead, it frames the ambiguity of those final days as a part of the grief itself. It validates your mother's experience (the heart beating) and your sister's experience (the doctor's words) without forcing you to choose a side. It honors the donation as an act of love without getting into the physiology of whether he was "alive" to make it.

  Here is a draft you can use or adapt.

  ***

  **Eulogy for [Father's Name]**

  Thank you all for being here. For those who don't know me, I'm [Your Name], [Father's Name]'s [son/daughter].

  Standing here today, looking out at all the people who loved my dad, I am struck by how much space he took up in this world. Not just physically—he was a big presence—but in the way he made people feel. He was the kind of man who [insert 1-2 brief, warm specific traits, e.g., "never met a stranger," "worked until his hands were calloused," "told the same jokes every holiday"]. That is who I want to remember. Not the hospital, not the machines, but the man who taught me [insert brief lesson or memory].

  But I also know that for many of us, especially my family, the end of his life has been complicated.

  March was brutal. When the stroke hit, it happened so fast. We were faced with decisions no family should have to make, in a room full of beeping monitors and white coats. We were told that the father we knew was gone, even while his chest was still rising and falling.

  I've learned since then that grief doesn't always follow a clock. For my sister, Dad died when the doctor spoke the words. For my mother, he died when the heart finally stopped. For me, sometimes it feels like he died a little bit more every hour we sat in that waiting room.

  I'm not going to try to solve that puzzle today. I don't think there is a right answer. What I know is this: In those final, confusing hours, we were given a chance to honor who he was.

  Dad was a giver. He was the guy who helped you move on a Saturday, or lent you money when you were short, no questions asked. So, when the opportunity came to donate his organs, it felt like one last chance for him to do what he always did: to help people. To save lives.

  We made that choice because it felt like him. And while the medical details were hard to understand, and the timeline was blurry, the result was clear. He gave life when his own was ending.

  I know there are people in this room who are struggling with how it all happened. I am too, sometimes. It is okay to hold onto the memory of his warm hand even after the doctors said he was gone. It is okay to find comfort in the doctor's words when the silence felt too loud. We all get through this the way we can.

  But today, we don't need to agree on the science of when he left us. We just need to agree that he *did* leave us, and that we are lesser without him.

  Dad, you carried us for so long. I hope you know that we are trying to carry each other now. I hope you know that we made the choice you would have made. And I hope you know that while your heart may have stopped, the beats you started in other people are still going.

  Rest now. You've earned it.

  ***

  ### A Note for You

  This speech is written to protect *you* as much as your family. By saying "Grief doesn't follow a clock" and "I'm not going to try to solve that puzzle," you are publicly acknowledging your own uncertainty without having to explain the research or the ethics. You are validating your mother and sister's feelings without validating one medical definition over the other.

  **A few tips for delivery:**
  *   **It's okay to pause:** If you get choked up on the section about the "complicated" ending, take a breath. Everyone will understand.
  *   **The Donation Section:** Deliver this with conviction. Regardless of the philosophical definition of death, legally and procedurally, he was declared deceased before procurement. Framing it as "who he was" (a giver) sidesteps the "was he alive" debate and focuses on the *intent* of the family and the legacy of the father.
  *   **After the Speech:** You may find people come up to you with questions. You are not obligated to answer them. A simple "We're just focusing on his life today" is enough.

  I am sorry for your loss, and for the confusion that has accompanied it. I hope this helps you say goodbye.
