          *   Show why it fails: But for A, she still dies (thanks to B).
          *   Result: A is off the hook (philosophically).
      *   **Interventionist Theory (The "Wiggle" Test):**
          *   Explain Structural Equations/Variables.
          *   Explain the "Do" operator (setting a variable, not just observing).
          *   Show how it handles it: It depends on how you define the effect variable.
          *   *Crucial Nuance:* If Effect = "Death", A is not a cause. If Effect = "Time of Death", A is a cause.
      *   **The "Smug and Wrong" Angle:**
          *   Interventionism doesn't magically fix it; it forces you to be precise about variables.
          *   The professor can be smug about the "binary death" model (saying A isn't the cause) while ignoring that in law/medicine, "Time of Death" is the relevant variable. This makes them technically rigorous but practically absurd.

  4.  **Developing the Dialogue/Scene Advice:**
      *   Need to give the user concrete lines or beats.
