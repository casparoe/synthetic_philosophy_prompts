  2.  **Deconstruct the Core Concepts:**
      *   **Principal Principle (PP):** $C(A | E \wedge Ch_t(A) = x) = x$. (Initial credence in A, given evidence E and that chance of A is x, should be x).
      *   **Humean Best-System Account (BSA):** Chances are summaries of the total history of categorical facts (the "mosaic").
      *   **Undermining Futures:** A future history that is possible according to current chances but, if it occurred, would make the current chance laws false (because the best system summarizing the *whole* history would be different).
      *   **The Problem:** If $F$ is an undermining future, $Ch_t(F) > 0$. But if $F$ occurs, $Ch_t(F) = 0$ (since the laws would be different). PP implies $C(F | Ch_t(F)=x) = x$. But $C(F | Ch_t(F)=x)$ should be 0 because $F$ entails the chances are *not* $x$. Contradiction.
      *   **New Principle (NP):** $C(A | T_w \wedge H_t) = Ch_t(A | T_w)$, where $T_w$ is the complete theory of chance. It conditions on the theory of chance rather than the specific chance value at time $t$, allowing the theory to account for the possibility of undermining.
      *   **Target Audience:** Engineers/Data Scientists. They care about computability, model specification, priors, and updating. Analogies to model selection or Bayesian updating are useful.

