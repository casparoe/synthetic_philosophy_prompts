answer: |-
  Here are ten interview questions tailored for your audience of engineers and data scientists, including the three mandatory deep-dives with anticipated follow-ups.

  **1.** Your work sits at the intersection of metaphysics and formal epistemology, but for the engineers listening, the Humean Best-System Account (BSA) sounds remarkably like Minimum Description Length (MDL) or model selection: we choose the "laws" that best compress the data of the categorical mosaic. If we view chance laws as the optimal compression of history, does that imply that "chance" is merely a feature of our modeling language, or do you maintain it captures something objective about the world's structure?

  **2.** **(Mandatory: Undermining & BSA)** Lewis's original Principal Principle tells us to set our credence in an outcome equal to its objective chance. However, under a Humean account, the "best system" of laws depends on the *entire* history of the world, including the future. This creates the "undermining" problem: a future that is currently possible might, if it occurred, change the laws such that its own probability becomes zero. Can you walk us through the specific logical inconsistency this creates for an agent trying to satisfy the Principal Principle today?
  *   **Follow-up:** (Anticipating she will explain that $C(F | Ch(F)=x)$ must be $x$ by PP, but $0$ because $F$ entails $\neg Ch(F)=x$). If the inconsistency arises because the agent assigns a non-zero prior to a future that would invalidate the current laws, does the New Principle essentially require us to treat the laws themselves as uncertain hypotheses in a Bayesian model selection problem, rather than fixed parameters?

  **3.** The New Principle (NP) proposes we condition not on the specific chance value at time $t$, but on the complete theory of chance, $T_w$. Formally, this looks like a shift from $C(A | Ch_t(A)=x)$ to $C(A | T_w)$. For a data scientist, this looks like swapping a point estimate for a full posterior over model structures. Does this shift fundamentally change the *role* of chance in guiding belief, or is it just a technical patch to save the Humean view?

  **4.** **(Mandatory: Idealization & Accessibility)** A common critique of the New Principle is that it requires conditioning on $T_w$—the true, complete theory of chance for the world. But no finite agent, human or machine, can ever know $T_w$ with certainty. Is the New Principle a genuine fix for rational belief, or does it just relocate the problem into an idealized credence function that no real believer could ever instantiate?
  *   **Follow-up:** (Anticipating she will argue it is a normative ideal, similar to logical omniscience). If it is merely normative, does this limit its utility for engineering autonomous systems? If we are building an AI that must act under uncertainty, should we program it to approximate the New Principle, or is there a "bounded rationality" version of NP that is computationally tractable?

  **5.** There are other responses to the undermining problem, such as Michael Thau's "New Principle" variant or Ned Hall's approach, which sometimes involve rejecting the Humean account of chance rather than saving it. Why is it worth the philosophical heavy lifting to preserve the Humean Best-System Account specifically? What do we lose if we simply adopt a non-Humean view of propensities instead?

  **6.** In machine learning, we often deal with non-stationary environments where the data distribution shifts over time. The undermining problem seems analogous: the "laws" (distribution) depend on the total data (history), including future data points. Does the New Principle offer any insight into how a rational agent should update their model when they suspect the underlying generative process might be sensitive to their own future observations?

  **7.** **(Mandatory: Self-Locating & Sleeping Beauty)** The Sleeping Beauty problem introduces self-locating uncertainty: "What day is it?" rather than just "What is the coin flip?" Some argue that the New Principle struggles here because $T_w$ typically describes objective chances, not indexical facts. Does the New Principle need further repair to handle chances attached to self-locating propositions, or does conditioning on the complete theory of chance already subsume the relevant indexical information?
  *   **Follow-up:** (Anticipating she will argue that $T_w$ combined with the agent's situation provides the necessary conditioning). If the theory of chance must include indexical information to function, does that blur the line between "objective chance" and "subjective credence"? At what point does $T_w$ become so personalized to the agent's location that it loses its status as an objective law?

  **8.** Lewis was skeptical of single-case chances, preferring frequencies within the best system. However, in decision theory, we often need probabilities for unique events (e.g., "Will this specific startup succeed?"). Does the New Principle, grounded in a Humean view, have the resources to guide belief in single-case scenarios where no frequency data exists, or does it collapse into subjective Bayesianism in those limits?

  **9.** For the engineers in the audience, the "Best System" is essentially an optimization problem: maximize simplicity and strength. But simplicity is language-relative. If we change our coding language or ontology, the "best system" might change. Does the New Principle imply that objective chance is relative to the conceptual scheme of the observer, and if so, how do we avoid radical relativism in scientific inference?

  **10.** Finally, if a software engineer takes formal epistemology seriously and wants to align their probabilistic models with rational belief norms, what is the one takeaway from the debate between the Principal Principle and the New Principle that should influence how they design priors in their systems?
