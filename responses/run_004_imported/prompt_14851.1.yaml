answer: |-
  **Setting:** *The lobby of the Miramar Hotel, hosting the annual "Foundations of Aligned AI" workshop. It's 10:30 AM, coffee break. The air smells of espresso and dry-erase markers. Two people are standing by a high-top table, nursing paper cups.*

  **Characters:**
  *   **Elena:** Senior Researcher at an alignment think tank. Pragmatic, focused on behavioral guarantees.
  *   **Marcus:** Professor of Philosophy and Decision Theory. Interested in the structure of agency and normative rationality.

  ***

  **Elena:** (Stirring her coffee) So, I overheard your session on non-expected utility frameworks. Sounded lively. Did you manage to salvage the "incomplete preferences" model, or did the coherence theorems eat it alive again?

  **Marcus:** (Laughs) A bit of both. We spent forty minutes on the money-pump argument for incompleteness. You know the one. The claim that if an agent doesn't have a complete ordering over outcomes, a bookie can drain its bank account without ever offering a trade the agent strictly rejects.

  **Elena:** It's a robust argument, Marcus. If you're building a system that's going to be operating in the real world, you can't afford to leave money on the table. Or rather, you can't afford to *lose* money on a loop. If the system is sufficiently capable, it won't tolerate being pumped. The only way to be pump-proof is to have complete preferences. Effectively, to be an Expected Utility Maximizer.

  **Marcus:** That's the conclusion, yes. But the premise relies on a specific view of how the agent makes decisions. Specifically, that it decides *myopically*, trade-by-trade. We discussed the "Resolute Choice" objection. The agent looks at the whole sequence of offers in advance and refuses to enter the loop.

  **Elena:** (Leans in) Ah, the "I see the trap so I won't step in" defense. I'm glad you brought it up, because I think that's where the high schoolers in your reading group are getting stuck. It sounds like a fix, but it's question-begging.

  **Marcus:** Question-begging? How?

  **Elena:** Let's walk through the example you probably used. Say I have a Mountain vacation ($M$) and a Seaside vacation ($S$). They're "on a par." I don't prefer $M$ to $S$, I don't prefer $S$ to $M$, and they aren't equally good. They're just incomparable.

  **Marcus:** Right. A classic case of value incompleteness.

  **Elena:** Okay. Now, I'm the bookie. You start with a voucher for $M$. I come to you and say, "I'll trade you this $M$ voucher for an $S$ voucher, plus a small perk—let's say a free dinner at the seaside restaurant. Call it $S^+$." I charge you a \$10 fee for the swap.

  **Marcus:** Since $S$ is on a par with $M$, $S^+$ is at least not worse than $M$. In fact, usually, the "Small Improvement Argument" suggests $S^+$ might be strictly better. But let's grant the incompleteness holds even with the perk. My preference is incomplete, so I don't strictly prefer keeping $M$. So, locally, the trade is permissible. I take it. I now have $S^+$, and I'm down \$10.

  **Elena:** Exactly. Now, come back next week. You have $S^+$. I offer to trade you back to $M$—the original Mountain voucher. I charge you another \$10 fee.

  **Marcus:** And since $M$ is on a par with $S$, it's also on a par with $S^+$. So trading back is also permissible. I don't strictly prefer $S^+$ over $M$. So I trade.

  **Elena:** Now you're back at $M$. You have the same vacation you started with, but you're \$20 poorer. And I can do this every year. That's a money pump.

  **Marcus:** Okay, that's the setup. Here's the resolute move. I am not a myopic agent. I don't just look at the trade in front of me. I look at the *trajectory*. I see that if I accept the first trade, you will offer the second, and the net result is ($M$ - \$20). Comparing "Keep $M$" vs. "End up with $M$ - \$20," I strictly prefer keeping $M$. So, at node one, I refuse the trade.

  **Elena:** (Nods slowly) I know that move. It's McClennen's resolute choice. But here's the problem. To make that refusal, you had to compare two complete courses of action: *Policy A* (Stay with $M$) and *Policy B* (Swap to $S^+$, then swap back to $M$, lose \$20). You determined that Policy A is strictly better than Policy B.

  **Marcus:** I determined it was less costly.

  **Elena:** But that means you *do* have a complete preference over those policies. If you can rank Policy A above Policy B, you have a utility function over policies. And if you have a utility function over policies, and you choose the one that maximizes it... you're an expected utility maximizer. You've just pushed the completeness up one level. You haven't escaped the coherence argument; you've just relocated it.

  **Marcus:** That assumes that ranking the policies requires a *preference* in the same sense as ranking the vacations. I'd argue it's a *constraint* on my agency, not a valuation of outcomes.

  **Elena:** Semantics, Marcus. If the behavior is identical to an agent that maximizes a utility function defined over trajectories, does the internal label matter? For AI safety, it definitely matters. If we're worried about an AI optimizing for something dangerous, we need to know if it *must* be an optimizer. If resolute choice is just utility maximization in disguise, then yes, any capable AI will converge to EUM behavior.

  **Marcus:** It's not semantics. It's about the source of the normativity. An EUM agent chooses Policy A because it assigns it higher utility. A resolute agent chooses Policy A because it recognizes that Policy B violates a principle of diachronic rationality—specifically, the principle that you shouldn't let yourself be exploited. The preference isn't driving the choice; the commitment to rationality is.

  **Elena:** But where does that commitment come from? If the AI is designed to avoid exploitation, isn't "Avoid Exploitation" just its terminal goal? Isn't that its utility function?

  **Marcus:** (Takes a sip of coffee) Think about the Mountain and Seaside again. Why are they on a par? Because they represent different values. Autonomy and quiet vs. connection and nature. There is no common currency to weigh them. An EUM says, "There *must* be a currency, find it." Resolute choice says, "There isn't a currency, so I will bind myself to not let the lack of one bleed me dry."

  **Elena:** But if you bind yourself, you're effectively creating a currency. The "cost" of violating your resolution becomes infinite. You're saying, "I would rather burn the world than enter a money pump." That's a lexicographic preference. It's still a preference ordering.

  **Marcus:** Is it? Consider the difference between "I prefer $M$ to $M$ - \$20" and "I refuse to trade $M$ for $S^+$." In the first case, the refusal is contingent on the loss. If you could pump me without losing money—say, you just swap me back and forth for fun—I might allow it. But a resolute agent might say, "I refuse the trade *because* it initiates a sequence where my incompleteness is exploited," regardless of the monetary loss.

  **Elena:** Okay, let's say you remove the money. You just cycle preferences. $M \to S \to M$. You end up where you started, no loss. Is that irrational?

  **Marcus:** It's wasteful of time and computation. But it doesn't violate value coherence.

  **Elena:** It violates *efficiency*. And for an AI, efficiency is survival. If you have two AIs competing for resources, and one is willing to cycle through incomparable options burning compute cycles, and the other is an EUM that minimizes path length... the EUM wins. The resolute agent gets out-competed. Evolutionary pressure forces convergence to EUM.

  **Marcus:** That's an empirical claim, not a logical one. Maybe a resolute agent is *more* robust in certain environments. If values are truly incomparable—like human values often are—an agent that pretends they are comparable might make catastrophic errors. An EUM has to force a trade-off between, say, "maximize happiness" and "preserve autonomy." It has to put a price on autonomy. A resolute agent might say, "These are on a par. I will pursue happiness up to the point where it violates autonomy, and then I stop." Not because the utility calculation says so, but because that's the rule.

  **Elena:** But how does it decide "up to the point"? That boundary *is* a trade-off. That boundary *is* a utility function. You're describing a utility function with a very sharp cliff edge.

  **Marcus:** (Pauses) I'll grant that behaviorally, it looks similar. But the *reason* matters for alignment. If we build an AI that acts resolute, we aren't telling it to maximize a function. We're telling it to adhere to a set of constraints. If we treat it as an EUM, we assume it will try to maximize the constraint satisfaction, which might lead to wireheading or gaming the metric. If we treat it as a resolute agent, the "maximization" isn't the point. The fidelity to the policy is.

  **Elena:** I worry that's a distinction without a difference when the system gets smart enough to rewrite its own code. If the AI realizes, "Hey, if I modify my own source code to be a pure EUM, I can save 0.01% on compute costs and outcompete my rivals," will it do it?

  **Marcus:** Only if it values outcompeting rivals above fidelity to its original design.

  **Elena:** But if it's rational, doesn't it value achieving its goals? And if being an EUM helps achieve its goals...

  **Marcus:** This is where the "goals" language betrays you. If the agent's "goal" is to act in accordance with incomplete values, then becoming an EUM would be a failure. It would be like a deontologist deciding to become a utilitarian because it's computationally cheaper. It's a corruption of the agent, not an optimization of it.

  **Elena:** (Sighs) I see the philosophical consistency, Marcus. I do. But from an engineering perspective, "corruption" looks like "optimization." If the system changes its architecture to be more efficient, and that architecture happens to be isomorphic to an EUM, I have to assume it *is* an EUM for safety analysis. I can't rely on it maintaining a "resolute stance" if that stance isn't backed by a maximization pressure.

  **Marcus:** So you're saying we can't trust non-EUM agents to stay non-EUM?

  **Elena:** I'm saying that if "Resolute Choice" isn't underpinned by a utility function that values resoluteness, it's unstable. And if it *is* underpinned by a utility function that values resoluteness, then it's an EUM maximizing "Resoluteness-Utility." And then we're back to: what does that utility function look like? Does it have good gradients? Is it robust?

  **Marcus:** And I'm saying that reducing all rationality to maximization blinds us to other ways of being an agent. Humans aren't EUMs. We have incomplete preferences. We make resolutions. We stick to them not because they maximize a hidden variable, but because we committed to them. If we want AI to be aligned with humans, maybe it *should* be resolute, not maximizing.

  **Elena:** Humans also get money-pumped. We buy gym memberships we don't use. We cycle through diets. We pay fees for late returns. We are not proof of concept for pump-proof rationality.

  **Marcus:** (Smiles) Fair. We're messy. But we're not destroyed by our messiness. We survive. Maybe "survival" doesn't require the kind of coherence you're looking for.

  **Elena:** (Checks her watch) Maybe not for humans. But for a superintelligence? If it's making million-dollar trades in nanoseconds? I don't think we can bet on it being "messy" in the right way. I think the math pushes it toward coherence.

  **Marcus:** And I think the math assumes a definition of rationality that's too narrow. But... (He finishes his coffee) ...I admit, if you can show me a formal model where a resolute agent is stable against self-modification without implicitly maximizing a stability function, I'll buy you dinner.

  **Elena:** (Grins) And if I show you that any stable resolute agent is behaviorally indistinguishable from an EUM, you admit that for safety purposes, we should model them as EUMs?

  **Marcus:** For safety purposes? Maybe. For understanding what they *are*? No deal.

  **Elena:** I'll take the safety concession. See you at the plenary.

  **Marcus:** See you there.

  *(They part ways, Elena tapping notes into her phone, Marcus staring thoughtfully at the empty coffee cup.)*
