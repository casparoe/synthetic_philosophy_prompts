      *   *Did Bostrom argue this destroys longtermism?* Actually, Bostrom has written specifically *about* this problem (e.g., "Infinity and Ethics," "The Infinite Ethics Problem"), but his conclusion isn't usually "therefore do nothing." It's "standard aggregation methods break, so we need new ones."
      *   *Is the math right?* In standard cardinal arithmetic, $\infty + n = \infty$. But ethical decision theory doesn't necessarily rely on simple cardinal addition of total value. It often relies on *comparisons* of states, expected value, or specific aggregation rules (like Pareto principles).
      *   *Does it collapse longtermism?* Most longtermists argue it doesn't, or that the probability of an *axiological* infinity is low enough to ignore, or that we can use alternative ethical frameworks (e.g., person-affecting views, rank-discounted utilitarianism, spacetime averaging).

