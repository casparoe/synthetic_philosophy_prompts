      *   Yes. KS penalizes the User if the Friend has a higher "Ideal" potential, even if it's not realized.
      *   NBS (IIA) ignores that potential if it's not in the chosen set.
      *   *So:* If the User wants to ignore the Friend's "dreams" of other deals, NBS is the shield.
      *   If the User wants to leverage their own BATNA, both work, but KS explicitly axiomatizes the link between "Potential" and "Payoff."
      *   *Actually, the User's BATNA affects $d$.* Both solutions are monotonic in $d$.
      *   So both reward the User for the $5k offer.
      *   Okay, I have enough nuance.

      *   **Summary of Advice:**
          1.  Reject 50/50.
          2.  Target $8,500/$3,500.
          3.  Both NBS and KS support this.
          4.  Use NBS logic ("Split the Surplus") for simplicity.
          5.  Use KS logic ("Proportional Gains") if Friend argues about "Potential."
          6.  Beware KS if Friend introduces other high-value options (KS would adjust to favor Friend, NBS wouldn't).

      *   *Wait, one last check:* Does the User's BATNA affect the Ideal Point of the Friend?
      *   $a_2 = \max y$ s.t. $x \ge 5000$.
      *   If User's BATNA rises to $6000$, $a_2$ drops to $6000$.
      *   So User's BATNA *constrains* Friend's Ideal Point.
      *   This is a strong argument for the User. "My fallback limits your upside."
      *   This is captured in the formal KS definition.
      *   Okay, ready.
