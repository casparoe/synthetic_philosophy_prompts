  That struck me as very on brand for Lewis, since he never met a problem he didn't want to solve with his own machinery, but I honestly can't recall the paper leaning on counterpart theory anywhere, and I don't have a copy handy to check before class tomorrow. Can you walk me through how counterpart theory is supposedly doing the work here and how it hooks up with the debt-vs-punishment point? Or if I'm garbling something, id genuinely like to know where the mix up is coming from before I say it confidently in front of a room of grad students.
