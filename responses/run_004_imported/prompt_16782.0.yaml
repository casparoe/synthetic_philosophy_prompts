answer: |-
  You should trust your instincts on this one: **your colleague is mistaken.**

  David Lewis's paper "Do We Believe in Penal Substitution?" (published posthumously in *Oxford Readings in Philosophical Theology*, 2009, but written circa 1997) does **not** lean on Counterpart Theory to solve the problem of substitution. In fact, the argument runs in a almost opposite direction. Lewis uses the paper to argue that penal substitution is conceptually incoherent (or at least deeply problematic) precisely because punishment *cannot* be transferred in the way a debt can.

  If you go into class tomorrow claiming Lewis uses Counterpart Theory to justify Christ standing in for sinners, you will likely be corrected by any student who has actually read the text. Here is the breakdown of what Lewis actually argues, why the Counterpart Theory reading is a mix-up, and how you can handle it in the seminar.

  ### 1. The Actual Engine: Debt vs. Punishment
  The core of Lewis's argument is a conceptual distinction between two kinds of liability:
  *   **Pecuniary Liability (Debt/Price):** This is transferable. If you owe me $100, it doesn't matter to me if you pay it or your friend pays it. The debt is extinguished either way.
  *   **Penal Liability (Punishment):** This is essentially personal. Punishment, by definition, is a response to *guilt*.

  Lewis argues that the logic of penal substitution tries to treat penal liability as if it were pecuniary liability. He claims this is a category mistake.

  ### 2. The Role of the "Whipping Boy"
  You remembered this part correctly. Lewis uses the historical example of the "whipping boy" (who was beaten for the prince's errors) not to show how substitution *works*, but to show why it feels **unjust**.
  *   When the whipping boy is beaten, we do not say, "Ah, justice has been served on the prince."
  *   We say, "An innocent boy is being abused, and the guilty prince is escaping justice."

  Lewis argues that if we are honest, the Christian doctrine of penal substitution faces this same problem. If Christ is punished *instead* of us, either:
  1.  Christ is guilty (which contradicts the doctrine of his sinlessness).
  2.  Christ is innocent, in which case punishing him is an injustice (the whipping boy scenario), not a satisfaction of justice.

  ### 3. Where Counterpart Theory Fits (It Doesn't)
  Your colleague's intuition is understandable—"on brand," as you put it—because Lewis is the father of Counterpart Theory. It is tempting to think he would solve the "identity problem" of the atonement (How can *he* be *me*?) by saying Christ is our *counterpart* in another possible world.

  However, Lewis does not make this move in this paper.
  *   **No Possible Worlds:** The paper is an exercise in moral and legal conceptual analysis, not modal metaphysics.
  *   **No Solution to Identity:** Lewis doesn't try to solve the identity problem; he highlights it as a fatal flaw for the theory of *punishment*. He suggests that if we want to make sense of the Atonement, we should abandon the *penal* model and stick to the *pecuniary* (satisfaction/debt) model. In the pecuniary model, Christ pays a *cost* (his life/suffering) on our behalf, which is transferable, rather than absorbing a *punishment*, which is not.

  ### 4. Why the Confusion?
  It is highly likely your colleague is conflating Lewis with one of two things:
  1.  **General Lewisian Metaphysics:** Because Lewis is so associated with counterparts, people sometimes assume every "substitution" problem in his work must be solved by it.
  2.  **Responses to Lewis:** Some analytic theologians (like Michael Rea or others in the analytic theology boom of the 2000s) may have discussed whether Lewisian metaphysics *could* rescue penal substitution *against* Lewis's own objections. Your colleague may be remembering a secondary discussion *about* Lewis, rather than Lewis's own text.

  ### 5. Seminar Strategy
  Since you are teaching grad students, this is actually a fantastic teaching moment. You can address the confusion directly without losing authority.

  *   **Validate the Intuition:** "It's tempting to think Lewis would use Counterpart Theory here. Given his work on modal realism, it seems like a natural tool to explain how Christ could stand in for us without being numerically identical to us."
  *   **Correct the Record:** "However, in 'Do We Believe in Penal Substitution?', Lewis explicitly avoids metaphysical machinery like that. He sticks to moral concepts. He argues that counterpart relations wouldn't help, because punishment is essentially retrospective and personal. Even if Christ were my counterpart, punishing him for my actual-world sins would still look like the 'whipping boy' injustice."
  *   **The Pivot:** "Lewis's actual suggestion is that we should view the Atonement as **price-paying** rather than **punishment-bearing**. That is the transferable element."

  ### Summary for your notes:
  *   **Paper:** "Do We Believe in Penal Substitution?" (1997/2009).
  *   **Main Thesis:** Penal substitution is incoherent because punishment is non-transferable.
  *   **Key Distinction:** Penalty (personal) vs. Price (transferable).
  *   **Counterpart Theory:** **Not present.**
  *   **Conclusion:** Lewis recommends a Satisfaction/Debt model over a Penal model.

  You are safe to proceed with your original understanding. The "Counterpart" reading is a philosophical urban legend regarding this specific text.
