      *   *Better Idea:* A **Syndicate of Art Restorers** or **Antique Dealers**? They pool risk on authenticity.
      *   *Best Idea:* A **Small Shipping Consortium**. Three captains share the risk of lost cargo. If one knows their ship is seaworthy and the others aren't, they leave.
      *   *Wait, let's look at the Hirshleifer mechanism specifically:* It's about *risk-sharing*. If I know I'm high risk, I want more insurance. If you know I'm high risk, you won't insure me. If we *both* know the risk is real, the pool dissolves.
      *   *Scenario:* A group of friends who play a high-stakes card game every week. They have a rule: winnings are pooled and split equally. This smooths out variance. One person gets access to a way to count cards (or know the shuffle).
