answer: |-
  The meeting room of the Coöperative smelled of old wood and dried grape skins. Five families sat around the table, the ledger open in the center. For forty years, the arrangement had been simple: the harvest from all five slopes was poured into the common casks, blended, and the profits split equally. It didn't matter if hail struck the north ridge or drought cracked the south basin. They were five fingers on one hand.

  Elias placed a brochure on the table. It was glossy, incongruous against the stained wood. "AgriScan," he said. "Predictive yield modeling. Soil spectroscopy combined with micro-climate tracking."

  Sarah, who managed the books, glanced at the price. "It's expensive, Elias."

  "It's cheaper than fertilizer on dead ground," Elias said. He wasn't aggressive; he was practical. He was the youngest, the one who had gone to university before returning to the valley. "Last year, we spent twenty thousand euros nurturing the west slope. It produced nothing. We shared the loss. That's the point of the Coöperative, yes. But why share the loss if we know it's coming?"

  "We don't know it's coming," said Mark, the oldest member. His hands were arthritic, resting on the ledger. "Until the grapes are in, we don't know."

  "Now we can," Elias said. "The scan gives us a probability distribution. Ninety-five percent accuracy on viability before the budding season. If the scan says the west slope is dead, we don't plant. We save the labor. We save the chemicals. We take that money and invest it elsewhere."

  Sarah ran a finger down the column of last year's expenses. She was a Bayesian by instinct, though she would never use the word. She understood that information reduced variance. If she knew the west slope was doomed, her expected utility for the household budget increased. She could reallocate labor to the olive groves. She could hedge. Ignorance was a cost.

  "If we do this," Sarah said, "we do it for everyone. All five plots."

  "Obviously," Elias said. "Total evidence. We all see the same data."

  Mark looked out the window at the dormant vines. He remembered years when the north ridge had saved them all, and years when the south basin had carried the weight. The uncertainty was the glue. Because no one knew who would be the savior and who would be the burden, everyone was willing to be both. But if the data said, *You are the burden*, and *You are the savior*, the moral arithmetic changed.

  "Is it rational," Mark asked, "to know?"

  "It's always rational to know," Elias said. "How can knowing the truth hurt us?"

  They voted. It was unanimous. To vote against the scan was to vote for waste. To vote for ignorance was to vote against efficiency. Each of them reasoned that having the information would allow them to make better decisions for their own families. Even Mark agreed; if his plot was failing, he wanted to know so he could retire without guilt. If it was thriving, he wanted to know so he could plan for expansion. The expected value of the information was positive for every agent at the table.

  The results arrived three weeks later, in sealed envelopes.

  They met again on a Tuesday. The air in the room was different now. The smell of dried skins was gone, replaced by the sterile scent of paper and ink. Elias opened his first. He exhaled, a sharp sound. His plot was rated 'High Viability.'

  Sarah opened hers. 'Moderate.'

  Mark opened his. 'Critical Failure.'

  The silence was not hostile. It was the silence of arithmetic.

  Elias looked at his paper. He thought about the coming season. He had laborers hired, contracts ready. If he stayed in the Coöperative, his high yield would be diluted by Mark's zero yield and Sarah's moderate one. Before the scan, this was an acceptable risk; he might have been the one with the failure. Now, he knew he was not. To share his harvest was no longer insurance; it was a known transfer of wealth.

  "I can't commit the labor," Elias said quietly. "The scan says I should maximize output. If I pool with Mark... I'm subsidizing a known loss."

  Mark nodded. He looked at his 'Critical Failure' notice. Before, he would have hoped. Hope was a form of insurance. Now, he knew. "I shouldn't take your fruit, Elias. It's not right."

  "It's not about right," Sarah said. She was looking at her own 'Moderate' rating. She was calculating. If she stayed with Elias, she gained stability but capped her upside. If she went alone, she kept her moderate yield but lost the safety net. But the safety net was gone anyway. The safety net depended on not knowing who would fall. Now they knew who was falling.

  "The Coöperative requires shared risk," Sarah said. "Not shared certainty."

  "If we dissolve the pool," Elias said, "we can still trade. I'll buy your olives, Mark. At market rate."

  "That's fair," Mark said.

  "It's efficient," Elias corrected.

  They drew up the dissolution papers there at the table. There was no shouting. No one accused Elias of breaking the tradition. He had only offered them what they all wanted: the truth. They had all agreed that truth was better than ignorance. They had all agreed that waste was bad.

  The mechanism of the Coöperative was not broken by malice. It was broken by clarity. The arrangement had relied on a specific kind of opacity—the mutual inability to distinguish luck from skill, or fortune from fate, before the harvest. Once that opacity was removed, the incentive to pool vanished. The healthy had no reason to join the sick, and the sick had no desire to burden the healthy when the burden could be measured in advance.

  Elias walked out into the sunlight. His vines were waiting. He knew, with ninety-five percent certainty, that they would flourish. He felt a surge of relief, a pure spike of utility. He would make more money this year than ever before. He would not waste fertilizer on dead earth. He was acting perfectly rationally.

  Behind him, in the shadowed room, Mark folded the paper that said his land was dead. He would not plant this year. He would save the cost of the seed. He would not feel the sting of failure when the harvest came, because he had already accepted it. He, too, was acting perfectly rationally. He had minimized his loss.

  They were all better off individually. They had optimized their positions based on total evidence. They had followed the mandate to look before leaping.

  Elias drove his truck down the valley road, passing the other farms. He waved to Sarah. She waved back. They were neighbors. They were friends. But they were no longer partners. The road ahead was clear, visible all the way to the horizon. There were no surprises left to share.
