      *   **Scene 5: The Aftermath.** The results come in. Some plots are doomed. Those families want to withdraw labor/costs. The good plots don't want to carry the dead weight. The cooperative dissolves.
      *   **Tone Check:** Ensure no one is villainous. Elias isn't trying to break it. He just wants efficiency. The others aren't greedy; they are prudential.

  5.  **Refining the Narrative Arc:**
      *   *Characters:* Elias (proponent), Sarah (skeptic but rational), Mark (quiet participant).
      *   *Setting:* The wine cooperative meeting.
      *   *The Tech:* "Spectroscopic soil analysis."
      *   *The Logic:* Explicitly show the internal monologue or dialogue where they justify the test using Bayesian reasoning (without using the jargon). "It helps us plan."
      *   *The Climax:* The results are revealed. The split happens naturally.
      *   *The Ending:* The pot is divided. They are all individually "better off" having known (they didn't waste labor), but collectively worse off (no risk pooling).

  6.  **Writing - Focus on Constraints:**
      *   *Word Count:* 1000-1500 words.
      *   *No AI:* Keep it soil tech.
