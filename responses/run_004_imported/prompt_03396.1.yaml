      *   *Rationality:* For each individual, taking the test is rational (Good's Theorem). It informs their budgeting. But collectively, it destroys the insurance.

  4.  **Drafting - Scene by Scene:**
      *   **Scene 1: The Setup.** Establish the "Harvest Share" or "Mutual Pot". Let's go with a **Vineyard Cooperative**. Five families. They share the profit regardless of individual plot yield. It smooths out hail/drought risk.
