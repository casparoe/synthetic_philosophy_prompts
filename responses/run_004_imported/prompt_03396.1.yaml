      *   *Idea 3: Village Harvest Insurance.* A grain store. Everyone contributes, everyone draws based on need. If someone knows their harvest will fail *before* contributing, they might contribute more (rational) but others might refuse to accept them (rational).
      *   *Idea 4: Investment Syndicate.* A group pooling money for a venture.
