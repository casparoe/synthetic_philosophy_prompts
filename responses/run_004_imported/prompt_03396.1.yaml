      *   **Task:** Write a short story (1000-1500 words).
      *   **Theme:** Hirshleifer's side (information destroys mutually beneficial arrangements based on shared ignorance).
      *   **Constraints:**
          *   Center on a small group bound by an arrangement depending on *not* knowing a future outcome.
          *   One character introduces a way to find out the outcome ahead of time.
          *   Every character's reasoning must be individually rational (Good's theorem holds for each).
          *   The arrangement must unravel anyway.
          *   No irrationality, malice, or unusual behavior.
          *   Avoid explicit AI/superintelligence themes (keep it human scale).
          *   Ending should follow from setup, no moralizing.
      *   **Tone:** Intellectual, subtle, dramatic but grounded.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Good's Theorem:* $E[U(action|evidence)] \geq U(action)$. Knowing more never hurts expected utility for a single decision-maker.
      *   *Hirshleifer's Effect:* Information changes the *distribution* of knowledge among agents. If agents share risk based on symmetric ignorance (e.g., insurance), asymmetric information (or even symmetric knowledge of a specific risk) can destroy the market for that risk. If everyone knows who will get sick, insurance collapses. If everyone knows the catch will be poor, sharing collapses.
      *   *The Twist:* The story needs to show individuals acting rationally to acquire information (because it helps *them* decide), but that acquisition destroys the collective benefit they previously enjoyed.

