answer: |-
  Here are ten interview questions designed to navigate the technical nuances of the function debate while keeping the conversation grounded in your documentary work. The three questions addressing your specific constraints include tailored follow-ups based on the arguments your guest is most likely to deploy.

  **1. The Case for Causal Roles**
  "Most introductions to philosophy of biology treat the etiological account—where function is defined by selection history—as the default, often framing Cummins' causal-role account as a useful but ultimately insufficient alternative. Given that the etiological view has become so dominant in the last thirty years, what do you see as the enduring, unreplaced value of the causal-role approach? Why should a philosopher of biology today still start with Cummins?"

  **2. The Synthetic Challenge**
  "I want to bring in a concrete case I've been wrestling with as a consultant on a documentary about *de novo* synthetic organisms. If a lab writes a gene from scratch that has no selection history whatsoever, etiological theorists seem forced to say the protein it codes for has no 'function' until it undergoes selection. That strikes many scientists as perverse. On your view, does this synthetic protein have a function the moment it begins interacting with the cell, and if so, what grounds that ascription?"

  **3. The Liberality Worry (Stethoscope Case)**
  "This brings us to the classic objection against your view: the problem of liberality. If a function is just any causal contribution to a system's capacity, what stops us from saying the heart's function includes producing the thumping sound a stethoscope picks up? That sound is a real causal contribution to the doctor's diagnostic capacity. How do you rule out these incidental effects without quietly smuggling in our own explanatory interests as the thing doing the real discriminating work?"
  *   **Follow-up:** "You'll likely say the sound isn't part of the *circulatory* capacity we're analyzing. But if the boundary of the 'relevant capacity' is set by the theorist's interests rather than the organism itself, doesn't that make biological function mind-dependent in a way that most biologists would reject?"

  **4. The Problem of Malfunction**
  "Another standard worry is normativity. On an etiological view, a heart malfunctions when it fails to do what it was selected to do. But on a purely systemic account, if a heart is currently doing *something*—even if it's fibrillating—it's still playing a causal role. What, on your account, could it even mean for a heart to 'malfunction' in the ordinary medical sense, given that a component's current causal role doesn't seem to fix, by itself, what that component is *supposed* to be doing?"
  *   **Follow-up:** "If you appeal to the idea that it's failing to match a dispositional model or an idealized schema, aren't we just defining malfunction as 'statistical abnormality'? If so, how do you distinguish a diseased heart from a heart that's simply rare, like one situated on the right side of the chest?"

  **5. The Novelty-Liberality Tension**
  "I want to press on the relationship between your view's biggest selling point and its biggest liability. Getting rid of the historical requirement is exactly what lets you handle novel, unselected traits like synthetic genes so easily. But isn't that the very same move that generates the liberality problem? By severing the tie to history, you gain the novel traits, but you lose the constraint that kept the stethoscope sounds out. Is there a principled way to keep the benefit without the cost?"
  *   **Follow-up:** "If you claim there is a principled boundary—say, restricting functions to 'containing systems' that are biologically individuated—would you be willing to accept a restriction that might exclude some synthetic genes if that's what it takes to rule out the stethoscope sounds? Or must the synthetic case always win?"

  **6. Individuating Systems**
  "You've mentioned 'containing systems' as a constraint. But organisms are nested systems within systems. A ribosome is in a cell, which is in a tissue, which is in an organism, which is in an ecosystem. What principled method do we have for individuating the 'system' whose capacity matters, other than pointing to the organismal boundary—which itself seems to rely on evolutionary history?"

  **7. The Role of Evolution**
  "Etiological theorists argue that evolution provides the only naturalistic basis for teleology—the 'aboutness' or goal-directedness of biological traits. If you strip selection history out of the definition of function, are you denying that biology is inherently teleological, or are you just offering a naturalized version of teleology that doesn't rely on the past?"

  **8. Normativity without History**
  "Medical practice is deeply normative; doctors don't just describe what bodies *do*, they prescribe what they *ought* to do. If your account grounds function in current causal capacities, do you think philosophy of biology can fully support the normative weight of medicine, or do we need to supplement your view with etiological considerations when we move from the lab to the clinic?"

  **9. Comparison with Neander**
  "Karen Neander has argued that without selection, we can't distinguish between a trait's function and its mere effects. If you had to convince a working biologist who subscribes to Neander's view to adopt your framework for classifying synthetic organisms, what is the one practical advantage you'd lead with? Where does her view actually hinder biological practice?"

  **10. The Verdict on Synthetic Genes**
  "Let's return to where we started, with the *de novo* synthetic gene in my documentary. On your account, this gene has a function the moment it starts coding for a protein that contributes to the cell's capacity. Do you view this implication as a major virtue of your theory that shows its superiority over etiological accounts, or is it a bullet you have to bite—accepting that we have 'functions' in the lab that lack the biological normativity of functions in the wild?"
