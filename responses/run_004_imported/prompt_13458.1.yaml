answer: |-
  It is a pleasure to engage with someone who brings the methodological rigor of experimental physics to the philosophy of mind. Your skepticism is well-founded and, in fact, represents one of the most serious challenges to disjunctivism. From a scientific standpoint, if two states are introspectively identical and physically (neurally) identical, positing a metaphysical difference between them does indeed look like an violation of parsimony—perhaps even a category error.

  However, to understand why serious philosophers (like M.G.F. Martin, John McDowell, and J.M. Hinton) persist with this view, we must look at what they are trying to save, and how they conceive of the relationship between metaphysics and epistemology.

  Here is an analysis of your objection, broken down into the epistemic, the metaphysical, and the physicalist challenges.

  ### 1. Epistemology vs. Ontology
  Your objection rests heavily on **indiscriminability**. You argue that if the subject cannot tell the difference, and the instruments (neural imaging) cannot tell the difference, there is no evidence for a difference.

  The disjunctivist agrees with the epistemic premise but rejects the ontological inference. They argue that **indiscriminability does not entail identity.**

  Consider an analogy from your field: Suppose we have a genuine electron and a perfect simulation of an electron that behaves identically in every measurable respect within a specific context. A disjunctivist would argue that the *nature* of the genuine electron is constituted by its place in the actual physical order, whereas the simulation is constituted by its computational history. Even if they are locally indistinguishable, their ontological status differs because one is fundamentally relational (connected to the physical world) and the other is not.

  For the disjunctivist, the "Argument from Illusion" commits a fallacy of equivocation. It assumes that because the *explanation* for the subject's behavior is the same in both cases (they act as if they see a cat), the *mental state* itself must be the same. Disjunctivists deny this "Common Kind Assumption." They claim:
  *   **Veridical Case:** The experience is constituted by the actual object. The mind-independent object is a constituent of the experience.
  *   **Hallucinatory Case:** The experience is merely *seeming* to be constituted by an object. It is a distinct kind of event that merely mimics the veridical one.

  To your point about falsifiability: You are correct that this is not an empirical hypothesis. It is a **metaphysical framework**. It cannot be falsified by a scan because it is a claim about what experience *is*, not just how it correlates with brain states. Whether this makes it "stipulative" depends on whether you view metaphysics as a legitimate inquiry distinct from empirical science.

  ### 2. The "Stipulative Device" Charge
  You suggest disjunctivism is an *ad hoc* shield for Direct Realism. In a sense, it is. But disjunctivists would argue it is a *necessary* shield if one wishes to maintain that perception provides us with direct access to reality.

  If you accept the "Common Kind" view (that veridical and hallucinatory experiences share a fundamental mental core, often called a sense-datum or a representational content), you are forced into a form of **Veil of Perception**. You never see the table; you only see the internal state caused by the table.

  Disjunctivists argue that the "Common Kind" view is the one that is actually stipulative. It stipulates that the *phenomenology* (what it feels like) must dictate the *ontology* (what it is). They argue this is a mistake. They prioritize the **transparency of experience**: when you try to introspect, you "look right through" to the world. To say that a hallucination has the same ontological status as a perception is to deny that successful perception is essentially a relation to the world.

  So, is it a substantive discovery? Not in the scientific sense. It is a **conceptual clarification**. It claims that we have been misled by language into thinking "experience" names a single type of inner object, when it actually names two different types of relations (one successful, one defective).

  ### 3. The Neural Challenge (The Physicist's Objection)
  This is where your background makes your objection most potent. You mention **identical proximate neural activity**.

  If physicalism is true (mental states supervene on brain states), then identical brain states *must* yield identical mental states. If a veridical perception and a hallucination share the exact same neural substrate (as cortical stimulation suggests is possible), how can they be fundamentally different kinds of mental state?

  Disjunctivists have a difficult time here. They generally have to choose one of two paths:
  1.  **Reject Local Supervenience:** They argue that mental states do not supervene solely on what is happening inside the skin. The environment is part of the mental state. Thus, Brain State A + World Object = Mental State X; Brain State A + No Object = Mental State Y. This implies a form of **externalism** about phenomenal consciousness, which many find counter-intuitive.
  2.  **Deny the Neural Identity:** They might argue that even if the *local* firing patterns are identical, the *causal history* of those neurons differs, and since mental states are individuated by their causal history, the brain states are not truly identical in the relevant sense.

  Most critics (and likely you) will find the first option scientifically uncomfortable. It suggests that two physically identical brains could be in different mental states, which complicates a causal closure of the physical world.

  ### 4. Is it Unfalsifiable?
  In the Popperian sense, yes. Disjunctivism is unfalsifiable because it is a claim about the **categorization** of reality, not a prediction within a category.

  However, in philosophy, "unfalsifiable" does not always mean "worthless." It often means "foundational."
  *   **Solipsism** is unfalsifiable, but we reject it because it explains nothing.
  *   **Disjunctivism** is unfalsifiable, but proponents argue it explains the **normativity** of perception. It explains why we trust perception: because in the good case, the world itself is present to us. The "Common Kind" view struggles to explain why veridical perception is the *standard* and hallucination is the *failure*, if they are fundamentally the same kind of thing.

  ### Summary
  Your intuition is shared by many philosophers of mind (particularly representationalists and physicalists). They argue that disjunctivism buys metaphysical comfort (Direct Realism) at the price of scientific coherence (Supervenience).

  However, the disjunctivist would reply to you:
  > "You are asking for empirical evidence for a metaphysical distinction. The distinction exists to preserve the intuition that in perception, the world is present to the mind. If you demand that the brain state alone dictates the mental kind, you have already assumed the 'Common Kind' view that we are disputing. We are not shielding Direct Realism from evidence; we are shielding it from a conceptual slide that turns perception into inner theater."

  **Verdict:** You are right that it lacks empirical leverage and risks violating parsimony. But it is not *merely* stipulative; it is a competing metaphysical account of what constitutes a mental state—one that privileges the relation to the object over the internal machinery. Whether that trade-off is worth it is the central debate in contemporary philosophy of perception.

  Given your background, you might find the work of **Michael Martin** (specifically *The Limits of Self-Awareness*) most relevant, as he tackles the "indiscriminability" point head-on, arguing that hallucination is defined *negatively* (as a state indiscriminable from a veridical one) rather than positively (as a state with its own intrinsic nature). This attempts to dissolve the "common kind" without positing mysterious extra entities.
