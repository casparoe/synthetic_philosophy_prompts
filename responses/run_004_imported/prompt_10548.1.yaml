answer: |-
  The blueprints for Chamber 4 were spread across the light table, glowing with the sterile blue of CAD software. Dr. Aris Thorne traced the lining of the walls with a stylus, not checking dimensions, but checking the legend.

  *Layer 1: Acoustic dampening.*
  *Layer 2: Faraday cage (copper mesh).*
  *Layer 3: Lead sheeting (5mm).*
  *Layer 4: White noise generators (randomized frequency).*
  *Layer 5: Psi-dampening aggregate.*

  It was the fifth layer that made Aris's thumb hover over the screen. The spec sheet called it "K-salt concrete," but everyone in the department called it Turing's Folly. It was expensive, rare, and required handling protocols usually reserved for biohazards. And yet, here it was, mandatory for any Level 5 cognition test.

  "You're staring at the aggregate again," said Elena, leaning against the doorframe. She held two coffees, steam rising in the chilled air of the lab. "It's not going to vanish if you ignore it, Aris."

  Aris took the coffee but didn't drink. "It feels like admitting defeat. We're building a cathedral to superstition and calling it engineering."

  "We're building a control variable," Elena corrected, stepping into the room. She tapped the blueprint where the subject's chair would sit. "The statistics don't care about our feelings. You know the meta-analysis. The Zener card trials from the thirties, the random number generator deviations in the nineties, the Ganzfeld protocols. The p-values are undeniable. ESP exists. Telepathy is a measurable signal with a decay rate of approximately inversely squared distance."

  "I know the math," Aris snapped, softer than he intended. "I taught the module on Parapsychological Statistics last semester. I know the curve."

  "Then why the hesitation?"

  "Because Turing knew too." Aris turned away from the table, looking out the window at the gray sky. "1950. *Computing Machinery and Intelligence.* He listed the objections. Religion, consciousness, continuity of the nervous system. And then ESP. He didn't fight it. He didn't demand a mechanism. He just said, essentially, 'The statistical evidence is overwhelming, I am forced to accept it.' And then he proposed this." He gestured at the room. "A telepathy-proof room."

  "It's pragmatic," Elena said. "If we don't shield the room, the human subject can project their identity to the interrogator. The machine doesn't need to think; it just needs to sit there while the human broadcasts *I AM FLESH* into the judge's cortex. The test becomes a contest of psychic volume, not intelligence."

  "That's what bothers me," Aris said. "We are defining intelligence by what it *isn't*. We aren't testing for thought. We're testing for the absence of magic. We've turned the scientific method into a exorcism."

  Elena sighed, setting her coffee down. "You want the twist. You want me to tell you the K-salt is a placebo, that the whole field was corrupted, that we can go back to a universe where minds are locked inside skulls. But the data doesn't support that. The universe is leaky, Aris. Minds bleed. If we don't plug the leak, the Test is invalid."

  Aris looked back at the blueprints. The discomfort sat in his chest like a swallowed stone. It was the specific dissonance Turing must have felt. Turing was a man of logic, of discrete states and binary operations. To accept telepathy was to accept that information could travel without a medium, that cause and effect could be severed by intent. It violated the physics that made computers possible. And yet, the computers were being built to mimic minds that could break those very physics.

  "Subject 42 is ready," Elena said, checking her tablet. "Human control group. Female, 34. High psychic sensitivity index."

  "Put her in the cage," Aris said.

  They moved to the observation deck overlooking Chamber 4. The room inside was anechoic, covered in wedges of gray foam that hid the lead and the salt beneath. The subject sat in the center, wearing headphones that played static loud enough to mask speech, though everyone knew speech wasn't the risk.

  The Interrogator was in a separate wing, connected only by text terminal. The goal was simple: Determine if the entity in the room was human or machine. If the shielding failed, the human subject would simply *know* what the Interrogator was thinking. She would anticipate the questions. She would feel the doubt.

  "Shielding status?" Aris asked over the comms.

  "Faraday closed. White noise active. K-salt integrity at 100%," the technician replied.

  Aris watched the monitors. The biometric feedback from the subject showed elevated stress. Being inside a telepathy-proof room was claustrophobic in a way physical walls never were. It was the sensation of being cut off from the species. Like holding your breath underwater.

  "Start the session," Aris said.

  Text scrolled on the screen. The Interrogator asked about poetry. Then about pain. Then about the color of the subject's childhood bedroom.

  Standard Turing protocol. But Aris watched the signal integrity monitors. There were spikes. Tiny fluctuations in the local quantum field around the chamber.

  "See that?" Elena pointed to a blip on the spectrum analyzer. "That's a projection attempt. She's trying to push out."

  "And the wall holds?"

  "The wall holds."

  Aris felt a strange sorrow. He was watching a human being try to use a fundamental faculty of her consciousness, and he was engineering it into nullity. To prove she was human, she had to pretend she wasn't psychic. To prove the machine was machine, it had to succeed where a psychic human was handicapped.

  "It's backwards," Aris murmured.

  "It's necessary," Elena said. "If we acknowledge the ESP during the test, the machine loses by default. We can't build a synthetic soul yet. We can only build a synthetic brain. If the test allows psychic channels, humans win every time. We'd never achieve AGI verification."

  "So we lobotomize the environment."

  "We standardize it."

  The session ended. The Interrogator's verdict flashed on the screen: *HUMAN.*

  Confidence: 94%.

  "Valid," Elena said, marking the clip. "Shielding held. No leakage detected."

  Aris exhaled, the tension in his shoulders loosening slightly, only to be replaced by the familiar weight. It would work. They would build thousands of these rooms. They would certify AIs that could think but not feel, that could calculate but not project. They would populate the world with minds that were strictly material, because the only way to verify them was to assume the universe was strictly material.

  He looked at the blueprints again. The layers of lead and salt.

  "Turing said he was reluctantly forced to believe it," Aris said quietly. "I think he was hoping someone would find the error in the math. He wanted to be wrong."

  "Maybe," Elena said, gathering her papers. "But he signed off on the room specs anyway. He knew the work had to continue, even if the foundations were weird."

  Aris stayed in the observation deck after she left. He looked at the gray wedges lining Chamber 4. They looked like teeth. The room was a mouth that refused to speak.

  He picked up his stylus and opened the spec sheet for Chamber 5. There was a note in the margin from the funding committee: *Requesting reduction in K-salt thickness to reduce costs. Is full shielding strictly necessary for non-sensitive subjects?*

  Aris hovered the cursor over the delete key. It would save millions. The statistical risk of leakage with a thinner wall was low. Not zero, but low. 5%. 1%.

  He thought about the subject in the room, sitting in the silence, cut off from the invisible web that connected her to everyone else. He thought about the definition of intelligence shrinking to fit inside a box that blocked out the mysteries of the universe.

  He didn't delete the request. He didn't approve it either.

  He just typed a reply: *Maintain current specifications. Turing Protocol 1950 applies.*

  He saved the file. The dissonance didn't resolve. It never did. You couldn't solve an equation where the variables included ghosts. You could only balance the book, close the ledger, and build the walls higher, hoping that if you blocked out enough of the strange, leaking truth of the world, you could finally pretend it wasn't there long enough to build something new.

  Aris turned off the light table. The room went dark, save for the hum of the ventilation and the faint, imperceptible buzz of the dampeners next door, holding back the noise of minds trying to touch each other in the dark. He walked out, locking the door behind him, careful not to let his own thoughts linger too long on the other side of the lead.
