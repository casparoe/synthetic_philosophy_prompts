      *   The "telepathy-proof room" is a fascinating engineering solution to a metaphysical problem. It implies ESP is a signal that can be shielded.
      *   The discomfort comes from having to build architecture around a phenomenon that feels like it shouldn't exist, yet the math says it does.

  3.  **Character & Setting:**
