      *   **Purposivism:** What is the *telos* (purpose) of the fund? To mitigate financial risk of club participation. Travel is inherent to participation.
      *   **Intentionalism (Legislative History):** The email represents the "drafting history." In law, this is often secondary to text but can resolve ambiguity. In a club context, formal adoption matters.
      *   **The "Hard Case":** This is a classic Hartian "penumbra" case. The core is clear (breaking a leg while climbing), the edge is fuzzy (breaking a wrist in the van).

  3.  **Evaluate the Specific Arguments:**
