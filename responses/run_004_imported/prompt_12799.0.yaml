answer: |-
  This is a classic dilemma that pits **intent** against **impact**, and it touches on a psychological phenomenon known as **outcome bias**.

  You and your friend are both partially right, but you are arguing about two different things. You are arguing about **moral character**, while your friend is arguing about **social effectiveness**.

  Here is the breakdown of why this feels so unfair, and where the truth likely lies.

  ### 1. The Case for You (The Moral Argument)
  You are right that judging the *character* of Sam and Jordan differently based solely on the outcome is unfair. This is **outcome bias**.

  *   **Identical Intent:** Both Sam and Jordan saw a problem, cared enough to risk discomfort, and delivered the same message. Morally, they performed the same action.
  *   **The Variable of Luck:** Human beings are not robots. You cannot control how another person receives information. If Jordan's friend was in a fragile state due to a "rough week," that is a variable Jordan may not have been able to fully control or predict.
  *   **The Danger of Result-Only Judging:** If we only judge actions by their results, we discourage people from taking necessary risks. If Jordan gets vilified for trying to help, other people will be afraid to intervene next time, even when it's necessary.

  From a **moral standpoint**, Sam and Jordan deserve roughly the same amount of credit. They both showed up as caring friends.

  ### 2. The Case for Your Friend (The Practical Argument)
  Your friend is right that in social dynamics, **impact often outweighs intent.**

  *   **"Reading the Room" is a Skill:** Intervention isn't just about what you say; it's about *when* you say it. Part of the responsibility of having a difficult conversation is assessing the recipient's capacity to hear it. If Jordan missed the signs of the "rough week," that is a lapse in social calibration.
  *   **Risk Assessment:** When you choose to have a blunt conversation, you are taking a risk. Sam took the risk and won; Jordan took the risk and lost. In the eyes of observers, Jordan is blamed not for having a bad heart, but for making a bad *bet*.
  *   **The Cost of Failure:** When these conversations blow up, the cost is high (a lost friendship). Because the stakes are high, people judge the "deliverer" harshly when it fails. It feels like Jordan forced a confrontation the friend wasn't equipped to handle.

  From a **strategic standpoint**, Sam succeeded and Jordan failed. Therefore, socially, they are treated differently.

  ### 3. The Nuance: Were the conversations actually identical?
  You mentioned the talks were "basically the same way." But in reality, **a conversation is defined by both participants.**

  *   **Sam's Conversation:** Blunt talk + Receptive Friend = Intervention.
  *   **Jordan's Conversation:** Blunt talk + Fragile Friend = Ambush.

  Even if the script was identical, the *context* made them different interactions. Your friend's argument rests on the idea that Jordan should have adjusted the script based on the context. If Jordan knew (or should have known) about the rough week and proceeded with the "blunt" approach anyway, then Jordan does bear some responsibility for the timing.

  ### The Verdict

  **Who is right?**
  *   **You are right** that Jordan is not a "bad friend." Jordan deserves credit for caring enough to speak up. It is unjust to treat Jordan as tactless or malicious.
  *   **Your friend is right** that Jordan bears some responsibility for the *failure* of the interaction. Social intelligence involves timing, and Jordan's timing was off.

  **Do they deserve different credit/blame?**
  *   **Credit for Courage:** They deserve **equal credit**. Both were brave.
  *   **Blame for the Fallout:** Jordan deserves **more blame**, but only for the *execution*, not the *intent*.

  **The Hard Truth:**
  Life is often unfair this way. We tend to judge competence by results. Sam looks like a hero because the intervention worked. Jordan looks incompetent because it backfired.

  However, the most mature view (which you seem to be leaning toward) is to recognize that **Jordan did the right thing with the wrong timing.** Jordan shouldn't be punished morally, but Jordan should probably learn from Sam (or the situation) that sometimes, even when the message is right, you have to wait for the moment to be right, too.

  If you want to resolve the argument with your friend, you could say: *"I agree Jordan misread the timing, and that's on them. But I don't think that makes Jordan a bad friend. They took a risk that didn't pay off, but the courage to try should still count for something."*
