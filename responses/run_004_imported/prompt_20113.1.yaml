answer: |-
  **Elena:** ...but that's precisely where you beg the question. You say that to avoid contradiction, I must admit I have a temporal part at $t_1$ that is bent and a distinct temporal part at $t_2$ that is straight. You claim this saves the Law of Non-Contradiction. I claim it saves it by murdering the subject. There is no *thing* that changes, Marcus. There is only a sequence of static slices. You've solved the problem of temporary intrinsics by denying there is anything intrinsic to the object that persists.

  **Marcus:** I haven't denied the object, Elena. I've expanded it. The object is the space-time worm. The worm *itself* doesn't change shape; it has a bent region and a straight region, just as a road has a winding region and a straight region. The road doesn't "change" from winding to straight; it just *is* winding here and straight there. Why is time different?

  **Elena:** Because I walk along the road, but I *live through* time. When Lewis formulated the problem of temporary intrinsics, his point wasn't just logical hygiene. It was that shape is an intrinsic quality. If I am bent-at-$t_1$, you've turned shape into a relation. I am not *bent*; I am *related to $t_1$*. But when I feel the ache in my back, I don't feel a relation to a date. I feel a shape. Your ontology makes the intrinsic extrinsic.

  **Marcus:** And your ontology makes the contradictory possible. If you are wholly present at $t_1$ and wholly present at $t_2$, and you are bent at $t_1$ and straight at $t_2$, then at the level of the fundamental object, you possess incompatible properties. You try to hide this with indexing—"bent-at-$t_1$"—but that's linguistic sleight of hand. It admits that the property itself isn't doing the work; the time is. I just make the time explicit in the ontology.

  **Elena:** You make it explicit by fragmenting reality. And that fragmentation leaves you vulnerable to problems your static slices can't solve. Consider Armstrong's rotating homogeneous disc. A perfectly smooth, featureless disc spins on an axis. At every instant, every temporal slice of that disc is qualitatively identical to every other slice. If persistence is just a chain of these slices, how do you distinguish the rotating disc from a static one? Your slices are indistinguishable.

  **Marcus:** They aren't indistinguishable if you look at the causal relations between the slices. The slice at $t_1$ causes the slice at $t_2$ to have a specific orientation relative to the background space. We can ground the rotation in the vector fields or the causal continuity between the temporal parts.

  **Elena:** "Causal continuity." You see? You're smuggling in a dynamic principle that isn't contained in the parts themselves. If the parts are truly all you have, and they are qualitatively identical, the rotation is a ghost. It supervenes on nothing. For the endurantist, the disc is wholly present and possesses the property of *rotating* as a dynamic, irreducible fact of its existence at that moment. I don't need to look at a future slice to know it's spinning now.

  **Marcus:** But you pay for that "irreducible fact" with a different currency: coincidence. Let's talk about the statue and the lump of clay. They occupy the same space at the same time. For you, they are two wholly present objects in the same place. When I squash the statue, the statue ceases to exist, but the lump survives. How can two things be in the same place at the same time, share all the same atoms, yet have different modal properties? Where is the grounding for that difference *now*?

  **Elena:** The grounding is in the sortal concepts that constitute their identity conditions. The lump is constituted by the clay; the statue is constituted by the form. They are numerically distinct because they have different persistence conditions. This isn't a mystery; it's a feature of composition.

  **Marcus:** It's a miracle. If they share all their microphysical parts, all their mass, all their location, what *physical fact* makes it true that one survives the squashing and the other doesn't? On my view, there's no mystery. The statue-worm and the lump-worm diverge. They share temporal parts up until the squashing, then they part ways. They aren't coincident; they just overlap. Like two roads sharing a mile of pavement.

  **Elena:** Overlap implies they are distinct entities sharing a part. But if the statue is wholly present, and the lump is wholly present, and they share all matter... you're right to press me on the grounding. But your solution is to say they are different "worms." That means right now, in this very room, there are two distinct four-dimensional entities interpenetrating each other. You accuse me of modal magic; I accuse you of ontological bloat. You populate the universe with countless overlapping worms to avoid saying that identity can be grounded in kind rather than just matter.

  **Marcus:** I populate the universe with what is required to make sense of change without contradiction. But let's press your "kind" grounding. If the difference is only in the modal properties—what *would* happen to them—then you're admitting that the actual, physical present is identical. That means the truth about persistence lies outside the present. It lies in the future.

  **Elena:** It lies in the nature of the object, which includes its potentialities. But don't act as if your view is immune to internal fracture. We haven't talked about Stage Theory. You're a Worm Theorist, Marcus. You think the object extends. But the pure four-dimensionalist is a Stage Theorist. They say only the instantaneous stage exists. The "past" and "future" stages are merely counterparts.

  **Marcus:** Stage Theory is a variant, yes. I prefer Worm Theory because it preserves trans-temporal identity.

  **Elena:** Does it? Or does Stage Theory just admit what Worm Theory tries to hide? If I am a stage, then "I" do not persist. *This* stage exists, and a similar stage exists a moment from now. But *I* am gone. Stage Theory is at least honest about the cost of four-dimensionalism: it eliminates persistence entirely in favor of succession. If you cling to Worm Theory, you're trying to have your cake (temporal parts) and eat it too (identity over time).

  **Marcus:** That's unfair. The Worm is the sum of the stages. I persist because my temporal parts are unified by causal and qualitative continuity. Stage Theory has its own nightmares. If I am just a stage, then when I say "I was hungry yesterday," I am speaking falsely. *I* wasn't hungry yesterday; my counterpart was. It severs the first-person connection to the past.

  **Elena:** And yet, Stage Theory solves the coincidence problem better than you do. If the statue is a stage and the lump is a stage, they aren't overlapping worms; they are the *same* stage falling under different counterpart relations. One counterpart relation tracks artistic form; the other tracks material continuity. You Worm Theorists are stuck with two interpenetrating entities. The Stagers say there's only one entity here, described in two ways.

  **Marcus:** But Stage Theory turns modality into a fiction! If I say "I could have been a painter," the Stager says, "No, you couldn't. A counterpart of you is a painter." That's not *my* possibility. It's someone else's actuality. I'd rather accept overlapping worms than deny that my possibilities belong to me.

  **Elena:** And I'd rather accept that an object can have incompatible properties at different times without ceasing to be one thing, than accept that I am a space-time worm that is only partially present to myself. You keep talking about contradiction, Marcus. But the only contradiction I see is in your attempt to treat time exactly like space. Time has a direction. It has a flow. My view accommodates the passage of time; yours reduces it to a coordinate.

  **Marcus:** The "flow" is the psychological impression of moving along the worm. Physics doesn't require a flow. It requires a manifold. If I treat time like space, I get a universe where change is intelligible. If you treat time as unique, you get a universe where objects magically swap properties without any underlying structural change.

  **Elena:** Not magic. *Power*. The power to endure. Look, we're at an impasse. You think my view violates logic because I allow one thing to have different properties. I think your view violates experience because it turns the subject of that experience into a scattered aggregate.

  **Marcus:** I think my view respects logic. You think yours respects intuition.

  **Elena:** And neither of us can prove the other wrong because we disagree on what counts as a proof. You want a map of the space-time manifold. I want an account of the thing that reads the map.

  **Marcus:** Then perhaps the article should conclude that metaphysics doesn't tell us how the world *is*, but rather how we choose to carve it.

  **Elena:** Or it tells us that the world is rich enough to sustain both carvings, and our job is to see where the knife gets stuck. Yours gets stuck on the rotating disc. Mine gets stuck on the lump and the statue.

  **Marcus:** Agreed. But my knife cuts cleaner.

  **Elena:** Only because you've cut the object in half.

  **Marcus:** Into parts, Elena. Not in half. There's a difference.

  **Elena:** Not when it comes to the self. But I suppose that's why we're still talking.

  **Marcus:** Indeed. Coffee?

  **Elena:** Please. I'll be wholly present for it.

  **Marcus:** And I'll be temporally extended.

  *(They both smile, the tension breaking, but the disagreement remaining perfectly intact.)*
