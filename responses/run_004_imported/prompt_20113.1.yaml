      *   *Check:* Is the Grounding Problem sharp? *Adjustment:* Focus on the "now." If they share all microphysical parts now, what grounds the modal difference?
      *   *Check:* Stage Theory. *Adjustment:* Make sure the distinction between Worm (objects extend through time) and Stage (objects are instantaneous, linked by counterpart relations) is clear.

  5.  **Polishing the Voice:**
      *   Avoid overly dense jargon where possible, or define it in context.
