      *   **State of Argument:** Already several exchanges in (no basic introductions, jump into the meat).
      *   **Key Concepts to Cover:**
          *   Lewis's Problem of Temporary Intrinsics.
          *   Armstrong's Rotating Homogeneous Disc.
          *   The Grounding Problem (Statue vs. Lump of Clay).
          *   Stage Theory (Exdurantism) as a complication.
      *   **Character Constraints:** Equally sharp, technically serious rejoinders, no easy wins, no silence.

  2.  **Character Conception:**
      *   **Endurantist (Elena):** Believes objects are wholly present at each moment of their existence. Needs to defend against the charge of contradiction regarding changing properties.
      *   **Perdurantist (Paul):** Believes objects are space-time worms composed of temporal parts. Needs to defend against charges of ontological bloating and failure to capture genuine change.
      *   *Tone:* Academic but lively, respectful but combative.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start *in media res* regarding Temporary Intrinsics. This is the classic Lewis objection to Endurantism.
      *   **Exchange 1: Temporary Intrinsics.**
          *   *Paul's Attack:* How can one thing be bent at $t_1$ and straight at $t_2$ without contradiction? Relations to times make properties extrinsic.
          *   *Elena's Defense:* Adverbialism or indexing properties. Let's go with indexing (being bent-at-$t$).
          *   *Paul's Counter:* That destroys the intrinsic nature of the property.
          *   *Elena's Counter-Counter:* It preserves the unity of the subject, which is more important.

      *   **Exchange 2: Armstrong's Rotating Disc.**
          *   *Context:* A homogeneous disc rotates. Perdurantism struggles to distinguish rotation from static existence because all temporal parts look identical.
          *   *Elena's Attack:* If you're just a stack of slices, how do you get motion?
          *   *Paul's Defense:* Causal relations between slices or Humean supervenience on the whole worm.
          *   *Elena's Counter:* That's adding structure *outside* the parts. It admits the parts don't carry the truthmakers.

      *   **Exchange 3: Coincidence (Statue and Lump).**
          *   *Context:* The Grounding Problem. Why do they have different modal properties if they share all matter and location?
          *   *Paul's Attack:* Endurantism allows coincident objects, which is ontologically wasteful and ungrounded. Perdurantism says they diverge in temporal parts (future).
          *   *Elena's Defense:* Sortal concepts ground the difference.
          *   *Paul's Counter:* That's conceptualism, not metaphysics. Where is the physical difference *now*?
          *   *Elena's Counter:* The difference is in the *kind* of persistence conditions, not the matter.

      *   **Exchange 4: Stage Theory (Exdurantism).**
          *   *Context:* A variant of Perdurantism where only the instantaneous stage exists.
          *   *Elena's Attack:* If you're just a stage, "I" don't persist. You're committing suicide every moment.
          *   *Paul's (Perdurantist) nuance:* Paul might actually be a Worm Theorist, so he can critique Stage Theory too, or he can defend it. Let's make Paul a Worm Theorist who gets pressed on Stage Theory by Elena to show the fractures in the 4D camp. Or better, have Elena press Paul on whether he's a Wormer or a Stager, as Stage Theory solves some problems but creates others (modal counterparts).
          *   *Decision:* Let's have Elena press Paul on Stage Theory. If Paul is a Worm theorist, he admits Stage Theory is the "pure" 4D view but finds it counterintuitive. If Paul is a Stager, he has to defend counterpart theory. Let's make Paul a Worm theorist who acknowledges Stage Theory's allure but rejects it, while Elena points out that Worm Theory inherits Stage Theory's problems regarding identity.

      *   **Closing:** No resolution. Both stand firm on their fundamental intuitions (Unity vs. Parsimony).

  4.  **Refining the Philosophy (Self-Correction during drafting):**
