  *(Self-Correction Note during drafting the dialogue)*: I need to make sure Paul doesn't just say "4D solves this." He needs to explain *how* and then have Elena poke a hole in that specific mechanism. For the Statue/Lump, Paul's advantage is usually that they *don't* coincide in 4D (they diverge in the future). Elena needs to press on the *current* grounding. For the Disc, Elena's advantage is that 4D slices are static. Paul needs to appeal to causal relations or vector fields.

  Let's write.

  *Names:* Elena (Endurantist), Marcus (Perdurantist). (Changed from Paul to Marcus for flow).

