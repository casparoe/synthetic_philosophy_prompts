answer: |-
  **Elena:** You saw the transcript from Jena, Arthur. The 1924 entries. When Dummett first held those pages, he said it felt like finding a swastika carved into the foundation of a cathedral. How can you stand there and tell me the cathedral is still holy?

  **Arthur:** Because the cathedral isn't the builder, Elena. It's the structure. If a man proves that the square root of two is irrational, his bigotry doesn't make the number rational. Frege's logic—the *Begriffsschrift*, the sense/reference distinction—stands in the third realm of objective thought. It is insulated from the vices of the man who transcribed it.

  **Elena:** That insulation is a fantasy. It's not just that he was a bigot; it's that he used his logic to *be* a bigot. He applied the theory of the ancestral—the very logic of succession you teach your undergraduates—to define "Aryan descent." He wasn't just hating; he was formalizing genealogy to exclude. The architecture of the oppression *is* the logic.

  **Arthur:** Using a hammer to break a skull doesn't mean the hammer is evil, nor does it mean physics is complicit. Frege's definition of the ancestral is a formal achievement regarding transitive relations. That he later mapped it onto bloodlines is a misuse of the tool, not a defect in the steel. You're conflating the application with the validity.

  **Elena:** But listen to *why* he wanted that precision. In the diary, he worries that vague predicates would frustrate the drafting of laws to strip Jews of rights. He needed sharp boundaries for exclusion. His war on vagueness wasn't just philosophical hygiene; it was a political requirement. If the logic demands sharp boundaries to function, and the politics demands sharp boundaries to persecute, where does the logic end and the politics begin?

  **Arthur:** Because clarity is a virtue even when the truth is vile. If a tyrant demands a precise census to enact a purge, the mathematics of the census remains correct. We value the drive against psychologism and vagueness because it secures truth-conditions, not because it serves democracy. To deny that is to say logic only belongs to the good.

  **Elena:** But Frege posited a "third realm" where thoughts exist independently of us. If his antisemitic thoughts inhabit that realm as objective contents, then your Platonism is harboring them. Dummett couldn't eat his dinner for weeks because he realized the "objective thoughts" Frege championed could include objective hatred. You can't just partition the mind.

  **Arthur:** You're confusing the diary's outbursts with *Gedanke* in the technical sense. The diary is psychological expression, precisely the kind of subjective mess he argued against in his prime. We read him better than he read himself in those final, bitter years. We salvage the theory of sense and reference from the wreckage of the man, because the theory explains how language works, even for him.

  **Elena:** Salvage implies the wreckage is separate. But he saw it as a unity. He believed the disorder of parliament and the disorder of vague language were the same disease. When you say we read him better than he did, you're admitting you have to amputate his intent to save his work. Dummett tried to hold both—the anti-racist and the logician—and it nearly broke his heart. Why should we be harder than he was?

  **Arthur:** Because Dummett was a moralist first and a historian second. If we discard the logic because the author was a monster, we lose the only language we have to critique the monster. I can use Frege's own demand for rigorous definition to show where his political definitions fail. To throw away the logic is to disarm ourselves.

  **Elena:** You say we use his logic to critique him, but you're using the insulation thesis to protect the discipline from shame. You want the prestige of the ancestry without the inheritance. If the ancestral relation defines the lineage, Arthur, you can't claim the descent is pure just because you ignore the traits passed down.

  **Arthur:** And you want to poison the well because the water-bearer was a bigot. If we accept your continuity, then every discovery is tainted by its context. I am arguing for the possibility of redemption through rigor. The theorem survives the prover. That is the only hope we have.

  **Elena:** The theorem survives, yes. But the scholar doesn't. Not if they pretend the blood isn't on the page.

  **Arthur:** Then we read the blood, Elena. But we do not stop reading the math.
