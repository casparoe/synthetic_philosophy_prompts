      *   *Topic 1: Flicker of Freedom.*
          *   Core idea: Even if Jones can't choose otherwise, he can choose *on his own* vs. *because of Black*. Isn't that an alternative possibility?
          *   Question: How do you handle the claim that the *manner* of action constitutes a robust alternative?
          *   Follow-up: If she says "it's not morally significant," ask why moral significance hinges on *could have done otherwise* rather than *how it happened*.

      *   *Topic 2: Prior Sign Dilemma.*
