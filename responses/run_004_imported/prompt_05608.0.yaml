answer: |-
  The machine looked less like a bridge and more like a shackle. It sat on the rolling tray between the bed and the armchair, a matte-black box with a single pulsing ring of light that breathed in time with nothing visible. Cables snaked from it, ending in adhesive pads that Elias was currently pressing onto Sarah's temples.

  Arthur, in the bed, was already prepped. His scalp was shaved in patches, the skin pale and papery against the dark gel. He was breathing shallowly, the rhythm ragged. The hospice monitor beside him ticked out a green line that had been flattening for three days.

  "It's ready," Elias said. His voice sounded too loud in the carpeted room.

  Sarah touched the port behind her ear, flinching slightly at the cold. "Will it hurt?"

  "No. It's passive. It just listens. And then it… resonates."

  Elias didn't like the word *resonates*. It implied harmony. In the lab, years ago, before he'd traded the clean room for the smell of antiseptic and lilies, they called it coupling. But the brochures the family had bought—the expensive, glossy ones that promised *Shared Sunset*—used words like *bridge*, *weave*, *union*.

  They wanted to feel Arthur's last moments. They wanted to know if he was afraid, if he was in pain, if he knew they were there. They wanted to pull his consciousness into the room with them, just for the end.

  Elias knew the math. He knew that consciousness, according to the theory that had eaten his twenties, wasn't a substance you could pour from one cup to another. It was a shape. A boundary. And boundaries, by definition, exclude what lies outside them.

  "Okay," Sarah said. She took her father's hand. His fingers were cool, limp. "Dad? I'm here. We're going to be together."

  Elias stepped back to the wall. He was the technician tonight, not the doctor. His job was to ensure the signal didn't spike, to make sure the Coupler didn't induce a seizure in the daughter or accelerate the arrhythmia in the father. He watched the dual monitors. One showed Arthur's jagged, slowing delta waves. The other showed Sarah's anxious alpha.

  "Initiating link," Elias said. He pressed the touchpad.

  The ring on the machine turned from blue to a soft, warm amber. There was no sound, no hum, just a shift in the air pressure, or maybe that was just the imagination of three people waiting for a ghost.

  Sarah closed her eyes. She squeezed Arthur's hand.

  For a minute, nothing happened. The green line on Arthur's monitor dipped.

  Then Sarah gasped.

  Her back arched slightly in the chair. Her grip on Arthur's hand tightened, white-knuckled. "Oh," she whispered. "Oh, Dad."

  Elias looked at the screens. The two waveforms were changing. They weren't syncing, not exactly. They were merging. The distinct jaggedness of Arthur's dying brain was being smoothed over, incorporated into a broader, slower oscillation that spanned both screens. The data stream from the Coupler began to scroll: *Integration Index Rising. Causal Density Optimal.*

  "It's warm," Sarah said, tears leaking from her closed eyes. "It's not dark. It's… it's like being underwater. But I can hear you. I can hear me."

  Elias felt a cold knot tighten in his stomach. He knew this readout. He had seen it in simulations. When you link two systems, you create a new system. A larger whole. The math was seductive: *A + B = AB*. A bigger mind. A shared experience.

  But the Exclusion Postulate sat in the back of his mind like a stone.

  The theory stated that a system of mechanisms exists as a conscious entity only if it specifies a maximum of integrated information. There can be only one *maximum* within a given space. Consciousness is not a democracy. It is a monarchy. If the combined system of *Arthur-and-Sarah* generated more integrated information than *Arthur* alone, then *Arthur* ceased to be a subject. He became merely a part. A component. Like a neuron in a brain.

  A neuron fires. A neuron processes data. But a neuron does not feel the grief of the patient. The neuron is excluded from the experience of the whole.

  "Is he scared?" Sarah asked. Her voice was distant, as if she were speaking from the bottom of a well.

  "Look at the monitor," Elias said gently. "His vitals are stable."

  "No, I mean… inside. It's quiet. It's so quiet here."

  Elias watched the waveforms. Arthur's individual signature—the specific, flickering pattern that had been *Arthur* for eighty-two years—was vanishing. It was being subsumed. The new waveform was stronger, cleaner, higher amplitude. The *AB* system was robust. It was a better candidate for consciousness than the dying brain alone ever could be.

  The machine had worked. It had created a subject.

  But who was it?

  Elias remembered a debate from a conference in Zurich. A young researcher, bright-eyed, arguing that this was the future of empathy. *We can expand the self,* she had said. *We can dissolve the boundary.*

  An older professor had stood up and asked: *When you dissolve the boundary, what happens to the things that were inside it? Do they get bigger? Or do they get erased?*

  The Exclusion Postulate said they were erased. Not destroyed physically. The neurons still fired. The blood still flowed. But the *experience*—the light of being there—moved to the level of the maximum. The local maxima were extinguished.

  If the Coupler created a system where the integration was higher than Arthur's fading mind, Arthur was no longer the one experiencing the sunset. He was just the hardware running the software of *Arthur-and-Sarah*.

  Sarah was weeping openly now. "He's letting go," she said. "I feel him… untying."

  Elias looked at Arthur's face. The muscles around the mouth had relaxed. The breathing was shallower. The end was coming.

  "Sarah," Elias said. He didn't mean to speak, but the words pushed out. "What are you feeling?"

  "Love," she said. "Just… a heavy love. Like a coat."

  "And Arthur? Do you feel him as… separate?"

  She frowned, her eyes still closed. "No. There is no separate. There is just… us. The room. The light."

  Elias looked at the monitor. The Integration Index was peaking. It was in the red zone. *Phi Max.*

  This was the moment. The apex. The system was fully integrated. The boundary was drawn around the two of them, around the machine, around the cables. Inside that boundary, there was experience. Outside it, there was nothing.

  But inside that boundary, was there an Arthur?

  If the combined system was the only subject, then Arthur's individual consciousness had been overwritten the moment the light turned amber. He hadn't shared his last night. He had been recruited. He had become a peripheral in someone else's experience of him.

  The tragedy wasn't that he was dying. The tragedy was that he might have already left, hours ago, and the machine had just built a puppet out of his remaining neural activity to comfort his daughter.

  Or.

  Or maybe the theory was wrong. Maybe consciousness was additive. Maybe they were truly swimming in the same water.

  Elias looked at his hands. They were steady. He had spent ten years studying the geometry of experience, and now, faced with the actual thing, he had no way to measure it. The machine measured information. It did not measure *who*.

  Arthur's heart monitor beeped. A long pause. Then another beep.

  "I see it," Sarah whispered. "The edge of it."

  "What edge?"

  "Where it stops. Where I start again." She opened her eyes. They were red, wet, but clear. "He's gone, Elias."

  The monitor emitted a single, flat tone. The green line straightened.

  Sarah slumped forward, breathing hard, as if she had run a mile. She reached out and touched Arthur's cheek. "Thank you," she said to the stillness.

  Elias moved to the machine. He hit the disconnect sequence. The amber light faded to blue, then died. The cables went slack.

  The room felt suddenly larger. The silence was absolute, save for the flatline tone that Elias quickly muted.

  Sarah stood up, her legs shaky. She walked over to Elias. She looked radiant, in the terrible way of people who have survived something.

  "It was beautiful," she said. "I don't know how to thank you. I felt him. I know I felt him."

  Elias looked at the black box. The readout was still active, displaying the final log. *Peak Integration Achieved. System Collapse.*

  "Did you?" Elias asked. His voice was barely a whisper.

  Sarah paused. She looked at her father, then back at Elias. For a second, a shadow passed over her face. Not doubt, exactly. Just a flicker of confusion. "What do you mean?"

  "When the link was active," Elias said. "When you felt the… the coat. The love. Who was wearing it?"

  Sarah blinked. "I was. We were."

  "But if you were both," Elias said, stopping himself. He wanted to say: *If the system was the subject, then Arthur wasn't there to feel you holding his hand. He was just the wire you were holding.*

  He wanted to say: *You might have just felt your own brain echoing against his silence.*

  He wanted to say: *The Exclusion Postulate says that for you to be there, fully, he had to be not-there.*

  But he looked at Sarah. He saw the peace in her eyes, the closure that would sustain her for the rest of her life. She believed she had been with him. She believed he had known she was there.

  If he told her the truth—or his version of it—he would take that away. He would tell her that she had spent his final moments inhabiting a corpse, that the connection she felt was a mathematical artifact, a ghost in the causal density.

  And he couldn't know. That was the worst of it. The math predicted the structure of consciousness, not the content. It told you where the light was, but not what the light saw.

  Maybe Arthur *was* there. Maybe the maximum had shifted, and for ten minutes, they were a single, double-headed creature, feeling the end together.

  Or maybe Elias had just watched a woman say goodbye to a shadow.

  "It doesn't matter," Elias said. He reached out and touched her shoulder. "You were here. That's what matters."

  Sarah nodded, accepting the absolution. She turned back to the bed. She began to gather her father's things, the small rituals of death that the living perform to prove they are still moving.

  Elias packed the machine. He coiled the cables. He wiped the gel from the ports.

  As he wheeled the tray toward the door, he looked back at the bed. Arthur looked peaceful. The struggle was over. The boundary of his skin was once again just a boundary. No signals in or out.

  Elias stepped into the hallway. The lights were bright, sterile. He looked at the screen on the Coupler one last time before powering it down. The final log entry blinked.

  *Subject Count: 1.*

  It didn't say *Which*.

  Elias pressed the power button. The screen went black. He stood in the quiet corridor, listening to the hum of the ventilation, wondering if the silence in the room behind him was empty, or if it was full of something he simply didn't have the sensors to detect.

  He left the machine by the nurses' station and walked out into the night. The air was cold. He pulled his coat tight around himself, checking the boundary of his own skin, making sure he was still inside it, making sure he was alone.

  He wasn't sure if that was a relief, or a loss.
