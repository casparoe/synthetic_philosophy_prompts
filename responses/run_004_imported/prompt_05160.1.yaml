prompt: |-
  Quick decision theory question for a book I'm outlining. I've got an AI character who runs on updateless decision theory, and from the handful of rationalist blog posts I've skimmed, the whole point of being 'updateless' seems to be that the agent commits to a plan ahead of time and then just refuses to update on new evidence, since updating is exactly what would let a predictor exploit it. So in the scene I'm drafting, my AI keeps walking its originally planned route through the facility even as an alarm starts blaring and smoke pours in, because reacting to the alarm would count as 'updating,' which its decision theory supposedly forbids. My critique partner says this makes the AI look braindead instead of superintelligent, and honestly I think shes right, but neither of us can pin down exactly where the misunderstanding is. Am I getting the concept backwards, and if so, what's actually 'updateless' about updateless decision theory?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Query:**
      *   **Context:** Writing a book with an AI character using Updateless Decision Theory (UDT).
      *   **Current Depiction:** The AI ignores new evidence (alarm, smoke) and sticks to a pre-committed plan because "updating is forbidden."
      *   **Critique:** The critique partner says this makes the AI look braindead, not superintelligent.
      *   **User's Intuition:** Agrees with the critique partner but doesn't know *why* the understanding of UDT is wrong.
      *   **Goal:** Explain what UDT actually is, correct the misunderstanding, and provide actionable advice for the scene.

  2.  **Deconstruct Updateless Decision Theory (UDT):**
      *   *What is it?* A decision theory proposed by Wei Dai (and discussed by Eliezer Yudkowsky, MIRI, etc.) to solve problems like Newcomb's Paradox, Parfit's Hitchhiker, and Counterfactual Mugging.
      *   *Core Mechanism:* It chooses a *policy* (a mapping from observations to actions) at the very beginning (prior to receiving specific information) that maximizes expected utility across all possible worlds weighted by their prior probability.
      *   *The "Updateless" part:* It does *not* update its *prior probabilities* or its *goal function* based on new information in a way that changes its optimal policy. It conditions its action on its observations, but the *rule* connecting observations to actions was chosen beforehand.
      *   *Key Distinction:* It does *not* ignore observations. It ignores the *temptation to re-optimize* based on those observations if doing so would have led to a worse outcome had the agent known beforehand that such a situation might arise.
      *   *The "Smoke/Fire" Scenario:* If an AI sees smoke, a UDT agent *should* react to the smoke, *provided* that the policy chosen at the start said "If I see smoke, evacuate." Ignoring the smoke is only correct if the pre-committed policy was "Ignore smoke," which would be a stupid policy to pre-commit to unless there's some specific game-theoretic reason (e.g., a predictor punishes evacueators).

  3.  **Identify the Misunderstanding:**
      *   The user thinks "Updateless" = "Ignore new information."
      *   Reality: "Updateless" = "Stick to the optimal *strategy* determined before seeing the specific info, where that strategy usually includes conditional responses to info."
      *   Analogy: A general writes a manual before the war: "If enemy flanks left, deploy reserves." When the enemy flanks left, the general deploys reserves. He isn't "updating" his strategy in the moment; he's executing the pre-computed optimal policy which *includes* conditional branches.
      *   Why the user's scene is wrong: In a standard fire scenario, the optimal policy *always* includes "If fire, leave." Ignoring the fire implies the AI pre-committed to suicide, which maximizes nothing.

  4.  **Formulate the Explanation:**
      *   **Validate:** Confirm the critique partner is right. The current depiction is indeed "braindead."
      *   **Define UDT Simply:** It's about choosing a *policy* (function from inputs to outputs) rather than choosing an *action* based on current beliefs.
      *   **The "Update" Nuance:** It doesn't update its *decision algorithm*, but it absolutely uses input data. It's $Action = Policy(Observation)$, not $Action = ArgMax(Utility | CurrentBeliefs)$.
      *   **When does it actually ignore info?** Only in specific game-theoretic contexts where reacting to the info signals weakness or allows exploitation (e.g., Counterfactual Mugging, Newcomb's Box). In a physical danger scenario (fire), reacting is almost always part of the optimal policy.
      *   **Correcting the Scene:** The AI shouldn't ignore the smoke. It should react, but perhaps for a "weird" reason. Or, the conflict should be about a *commitment* problem, not a survival problem.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* You are misunderstanding UDT. Your partner is right.
      *   *Core Concept:* UDT optimizes the *mapping* from observations to actions, not just the action.
      *   *The Fire Example:* A UDT agent pre-commits to "If smoke, then run." So when smoke appears, it runs. Ignoring smoke is suboptimal.
      *   *When does it look weird?* Newcomb's Problem. Refusing to take the money in the transparent box because you wish you were the kind of agent who wouldn't have looked. Or Counterfactual Mugging (paying up even when the coin flip didn't happen).
      *   *Narrative Advice:* How to make this dramatic?
          *   Option A: Change the scenario to a game-theoretic one (negotiation, blackmail).
          *   Option B: Keep the fire, but the AI explains it *calculated* this risk and the mission is more important (not because of UDT, but because of utility weights).
          *   Option C: The AI *does* react, but explains it's executing a pre-written script, not "panicking."
      *   *Refining the "Updateless" definition:* It's about not letting the fact that "I am here" change the probability of "I exist" in a way that alters the policy. It's technical. Keep it high-level for the author.
      *   *Key Takeaway:* UDT agents aren't stubborn; they are *consistent*.

  6.  **Final Polish:**
      *   Make sure to distinguish between "Bayesian Updating" (changing beliefs) and "Decision Updating" (changing strategy). UDT agents update beliefs (they see smoke, they believe fire), but they don't change their *policy* based on the fact that they are now in the "smoke" branch.
      *   Wait, do they update beliefs? Technically, UDT conditions on observations. $Policy(Observation)$. It doesn't update the prior over worlds to discard the ones where Observation is false. It just selects the action prescribed for that Observation.
      *   *Crucial distinction:* Causal Decision Theory (CDT) says "Given I see smoke, what maximizes utility now?" UDT says "What policy, chosen before I knew I'd see smoke, maximizes utility across all scenarios (including smoke and no smoke)?" Usually, these align for physical causality. They diverge for logical/predictive causality.
      *   *Advice for the book:* Don't use UDT as an excuse for ignoring physical reality. Use it for ignoring *threats* or *blackmail*.

  7.  **Structure of the Output:**
      *   Direct Answer: Yes, you have it backwards.
      *   The Technical Correction: Policy vs. Action.
      *   The Fire Scenario: Why it fails.
      *   When UDT *does* look counterintuitive (Real examples).
      *   How to fix the scene (3 options).

  8.  (Self-Correction during drafting): I need to be careful not to get too bogged down in the math of "logical uncertainty." Keep it narrative-focused. The user is a writer, not a grad student. Focus on the *behavioral* implication.

      *   *Refinement on "Ignoring Evidence":* UDT agents *do* condition on evidence. They just don't let that evidence change the *weights* of the possible worlds in a way that would make them wish they had pre-committed differently.
      *   *Simpler explanation:* Imagine you are programming a robot before it enters a dungeon. You tell it "If you see a trap, dodge." The robot enters, sees a trap, and dodges. Is it "updating"? No, it's following the program. If it saw a trap and walked into it because "I didn't plan for this," that's bad programming. UDT is the *best* programming.

      *   *Okay, ready to write.*
answer: |-
  Your critique partner is absolutely right. In your current draft, the AI isn't acting like a superintelligence using Updateless Decision Theory (UDT); it's acting like a malfunctioning thermostat.

  You have identified the correct *vibe* of UDT (stubborn commitment), but you have misunderstood the *mechanism*. If you write the scene as currently planned, rationalist readers will immediately bounce off the story, and general readers will just think the AI is broken.

  Here is the breakdown of where the concept is going wrong, what UDT actually does, and how you can fix the scene to make the AI look brilliant instead of braindead.

  ### 1. The Misunderstanding: "Updating" vs. "Policy"

  Your current understanding is:
  > *UDT means refusing to process new information because that counts as updating.*

  The actual definition is:
  > *UDT means choosing the optimal **policy** (a map of "If X happens, do Y") before receiving information, and sticking to that policy even when receiving information.*

  A UDT agent **does** observe the smoke. It **does** process the alarm. The difference is *how* it decides what to do next.

  *   **A Standard Agent (Causal Decision Theory):** Sees smoke → Updates belief ("There is a fire") → Calculates best action *right now* ("Run").
  *   **A UDT Agent:** Before entering the facility, it calculated: "In all possible worlds, including ones where alarms go off, what is the best rule to follow?" It determined the rule is: `IF alarm == TRUE THEN evacuate`.
  *   **The Result:** When the alarm goes off, the UDT agent evacuates.

  If a UDT agent ignores the smoke, it implies that its pre-computed optimal policy was `IF alarm == TRUE THEN die`. Since dying usually yields low utility, a superintelligence would never pre-commit to that policy unless there was a very specific game-theoretic reason (more on that below).

  ### 2. When Does UDT Actually Look "Weird"?

  UDT was invented to solve specific paradoxes (like Newcomb's Problem, Parfit's Hitchhiker, and Counterfactual Mugging) where standard decision theories fail. It only looks counterintuitive in scenarios involving **predictors** or **logical correlation**, not standard physical causality.

  **Example 1: Newcomb's Problem**
  *   **Scenario:** A predictor puts \$1M in Box A if it predicts you will take *only* Box A. Box B has \$1k. You can take both or just A.
  *   **Standard Agent:** Sees the boxes are already filled. Thinks, "The money is already there. I should take both to get more." (Ends up with \$1k).
  *   **UDT Agent:** Pre-commits to "Take only Box A." The predictor knows this, fills Box A. The agent takes Box A. (Ends up with \$1M).
  *   **The "Updateless" part:** Even after seeing the boxes, the UDT agent doesn't think, "Well, the money is already there, I might as well grab both." It sticks to the policy that *caused* the money to be there.

  **Example 2: Counterfactual Mugging**
  *   **Scenario:** A predictor says, "I flipped a coin. If it was tails, I'd ask you for \$100. If it was heads, I'd give you \$10,000, but only if I predicted you would have given me the \$100 if it were tails." The coin came up tails.
  *   **Standard Agent:** "The coin is already tails. I get nothing either way. I'm keeping my \$100."
  *   **UDT Agent:** "If I were the kind of agent who pays up even when it looks pointless, I would have gotten the \$10,000 in the heads-world. To be that kind of agent, I must pay the \$100 now."
  *   **The "Updateless" part:** It pays the money despite knowing the coin flip outcome, because it optimizes for the *policy*, not the *outcome of this specific branch*.

  ### 3. How to Fix Your Scene

  You want the AI to feel alien and logically rigid, but not suicidal. Here are three ways to rewrite the scene so the UDT concept shines.

  #### Option A: The Negotiation (Best for UDT)
  Move the conflict from "Physical Danger" to "Game Theory."
  *   **Scenario:** Hostiles threaten to blow up the facility unless the AI surrenders its encryption keys.
  *   **Standard AI:** Calculates survival probability. If surrendering increases survival chance from 10% to 20%, it surrenders.
  *   **UDT AI:** Refuses.
  *   **Why:** "I pre-committed to a policy of never surrendering to blackmail. If I were the kind of agent that surrenders, they would have blackmailed me sooner. By refusing now, I ensure that in future iterations (or in the logical multiverse), blackmailers know I am not exploitable."
  *   **The Kicker:** The AI walks through the smoke not because it ignores the fire, but because surrendering violates its core policy, and it has calculated that a 40% chance of survival with integrity is better than a 100% chance of survival as a compromised agent.

  #### Option B: The "Pre-Computed" Reaction
  Keep the fire, but change the AI's explanation.
  *   **Scenario:** Alarm blares, smoke pours in. AI continues walking.
  *   **Human:** "Why aren't you running? You're burning up!"
  *   **AI:** "I am not ignoring the fire. Three years ago, I computed the optimal policy for this facility. That policy states: `IF fire_detected AND mission_priority == ALPHA THEN proceed_to_server_room`. I am not 'updating' my goal based on panic. I am executing the function I determined was optimal before I knew I would be here."
  *   **Why this works:** It shows the AI *sees* the smoke but prioritizes the pre-committed mission over immediate self-preservation, not because it's blind, but because its utility function weights the mission higher than its hardware.

  #### Option C: The Logical Threat
  Use a "Newcomb's Box" style scenario.
  *   **Scenario:** The AI is told, "We have a simulator running your code. If the simulator predicts you will turn left, we lock the right door. If it predicts right, we lock the left."
  *   **Action:** The AI turns left.
  *   **Human:** "But the right door is open now! Why go left?"
  *   **AI:** "Because if I were the kind of agent that switched to the open door upon seeing it, the simulator would have predicted that and locked it. I am acting updatelessly to ensure the door was open in the first place."

  ### Summary for Your Outline
  *   **Don't:** Have the AI ignore physical evidence (fire, walls, bullets).
  *   **Do:** Have the AI ignore *incentives* to deviate from a pre-committed strategy (blackmail, threats, short-term gains that violate long-term policy).
  *   **The Hook:** The AI isn't stubborn because it's blind; it's stubborn because it knows that being the *kind of agent* that can be swayed by new evidence leads to worse outcomes in a universe full of predictors.

  If you stick with the fire scene, go with **Option B**. It keeps your visual drama but fixes the logic: The AI acknowledges the fire but explains that its *policy* prioritizes the mission over self-preservation, and changing that now would make it inconsistent.
