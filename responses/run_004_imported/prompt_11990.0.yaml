  The surgeon paused, scalpel in hand. "That's a causal contribution. Not an etiological function."

  "But I help the system!"

  "So does cancer. Cummins counts contributions. Wright counts history."

  "So am I useful or not?"

  "You're a Wrightian malfunction with Cumminsian enthusiasm."

  The appendix sighed. "So I'm fired?"

  "No," said the surgeon. "You're being downsized to a historical artifact."
