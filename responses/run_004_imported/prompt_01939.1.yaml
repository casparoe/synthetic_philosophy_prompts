      *   *Anti-Omission:* Let's call him **Marcus**. He's a process theorist or Humean skeptic (like Beebee or Dowe). He believes causation requires physical transfer/conserved quantities. He needs to defend against the charge that his view makes law and morality unintelligible.

  3.  **Key Arguments to Deploy:**
