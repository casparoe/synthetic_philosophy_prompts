answer: |-
  **Setting:** *Alice's sunroom. A potted fiddle-leaf fig sits on a pedestal, its leaves brown and crinkled. The soil is dust-dry. **Elena** (a proponent of causal modeling and omission causation) crouches by the pot, running a finger through the dirt. **Marcus** (a process theorist and Humean skeptic about omission causation) stands with his arms crossed, looking out the window.*

  **Elena:** It's brittle. If Barry had poured just one liter of water into this soil forty-eight hours ago, the turgor pressure in these cells would have held. The plant would be alive. Barry's failure to water it caused its death.

  **Marcus:** Barry's *failure*? Elena, look at the ontology of the situation. What physical event occurred between Barry and the plant? Did he emit radiation? Did he exert force? Did he transfer a conserved quantity?

  **Elena:** He didn't have to. Causation isn't just billiard balls knocking into each other. That's a nineteenth-century intuition. We know now that causation is fundamentally about counterfactual dependence. If Barry waters, plant lives. If Barry doesn't, plant dies. The dependence is there. Therefore, the causation is there.

  **Marcus:** And that is precisely why your view swallows the world. By your counterfactual test, the Queen of England caused this plant's death. If the Queen had flown here, burst through the door, and watered it, the plant would live. Her omission satisfies the counterfactual test exactly as well as Barry's. Are you prepared to tell a court that the Queen is a co-conspirator in this botanical homicide?

  **Elena:** Of course not. But that's the profligacy problem, not a refutation. It just means counterfactual dependence is necessary, not sufficient. We need a principle to select the *relevant* omissions. I use a default/deviant distinction. In the causal model of this room, "Barry waters the plant" is a variable set to a default expectation based on his role as the caretaker. "The Queen waters the plant" is not a variable in this model; it's an external shock. Barry's omission is a deviation from the system's normal functioning. The Queen's isn't.

  **Marcus:** There it is. The magic trick. You say you're doing metaphysics, but the moment you need to stop the profligacy explosion, you reach for "roles" and "expectations." That's normative language, Elena. "Default" here is just a polite word for "duty." You're smuggling ethics into the machinery of causation to save the intuition that Barry is to blame.

  **Elena:** I'm smuggling nothing. Causal models *always* require a selection of variables. You can't model the universe; you have to carve out a system. When we define the system "Alice's Apartment," we include the assigned caretaker as a functional component. We don't include the Queen. This isn't moral; it's structural. If a thermostat fails to turn on the heat, we say the thermostat caused the room to freeze. We don't say the gas company caused it, even if they could have sent a technician. It's about the architecture of the system, not the morality of the agents.

  **Marcus:** But a thermostat is a mechanical device with a defined function. Barry is a human being. When you say his omission is a "deviation," you mean he violated an agreement. If Barry had never promised to water the plant, would his omission still be a cause?

  **Elena:** If he had no connection to the plant, he wouldn't be in the causal model.

  **Marcus:** Exactly! So the causation depends on the promise. The metaphysics of the event depends on the ethics of the agreement. That means causation isn't a feature of the world; it's a feature of our social contracts. I say there is no causation here at all. There is only the physical process of the plant desiccating due to evaporation and metabolic consumption. Barry didn't *do* anything to that process. He simply wasn't part of it.

  **Elena:** So if I hold a drowning child's head underwater, I cause their death. But if I stand next to a shallow pond, watch a child drown, and could save them with zero cost, I cause nothing? Metaphysically, those are identical on your view. In both cases, the physical process of death proceeds without my interference in the second case.

  **Marcus:** I bite the bullet. In the first case, you initiate a physical process that terminates in death. In the second, a process terminates in death and you fail to interrupt it. The metaphysical asymmetry is real. The fact that we *blame* you equally in both cases is a feature of our moral psychology, not the causal structure of the universe. We conflate causal explanation with causal relation. We say "Barry caused the death" because we are looking for an explanation for why our expectations were violated.

  **Elena:** That's a deflationary disaster. Think about the law. Negligence law is entirely built on the premise that omissions *can* be proximate causes. If you tell a judge, "Well, strictly speaking, my client didn't cause the patient's death by disconnecting the ventilator, he merely failed to continue the air-flow process," you aren't making a subtle metaphysical point. You're undermining the concept of liability. If omissions aren't causes, then "causing death by negligence" is a category error.

  **Marcus:** The law isn't a metaphysics textbook. It's a tool for regulating behavior. It uses "cause" as a placeholder for "responsibility." I'm happy to grant that Barry is *responsible*. I'm happy to grant that he is *liable*. I just deny that the relation between him and the death is causal. Call it "quasi-causation," as Dowe does. It does all the work of blame without forcing us to say that "nothing" is an event that pushes effects into the world. It preserves the intuition that something must come from something.

  **Elena:** But your "quasi-causation" creates a gap between responsibility and reality. If Barry isn't a cause, why is he responsible? Usually, we hold people responsible because they altered the world in a harmful way. If you sever the causal link, responsibility floats free. It becomes purely conventional. On my view, Barry is responsible *because* he altered the world—by removing a necessary condition for life that he was obligated to maintain. The "normality" condition isn't just moral; it's about stability. The world was on a trajectory to sustain the plant; Barry's intervention (his refusal to act) shifted the trajectory.

  **Marcus:** "Refusal to act" sounds like an action. But it's not. It's a description of a timeline where an event didn't occur. You're treating the absence of water as a force. Let's press your "normality" defense again. You say the Queen isn't a cause because she's not in the model. But who builds the model?

  **Elena:** Context does.

  **Marcus:** Context is subjective. If I'm a utilitarian, *everyone* is in the model because everyone could have saved the plant. If I'm a libertarian, only Barry is in the model. So, on your view, whether the plant's death has one cause or seven billion causes depends on the ideological lens of the observer. That makes causation mind-dependent. I thought we were talking about metaphysics.

  **Elena:** Causal claims are always context-sensitive. That's not mind-dependence; it's pragmatics. "Did the spark cause the fire?" depends on whether we're in a lab (where sparks are normal) or a gasoline factory (where they aren't). The physics doesn't change, but the causal *attribution* does. Why is it acceptable for causal attribution to depend on background conditions, but unacceptable for it to depend on normative expectations? Both are about distinguishing signal from noise.

  **Marcus:** Because background conditions are physical frequencies. Normative expectations are social constructs. You're grounding the structure of reality in social constructs. If Barry moves to a country where no one expects neighbors to water plants, does the causation vanish? Does the plant die of "natural causes" in one zip code and "homicide" in another?

  **Elena:** The *blame* might shift, but the causal structure remains. The variable "Caretaker Action" is still the relevant control variable for the system "Potted Plant." If the social norm changes, the *default value* of that variable changes. But the dependency remains. Look, Marcus, your view has a cost too. You say omissions aren't causes. So when the EA blogger says, "You kill the starving child by buying the shoes," you have to say, "No, metaphysically you don't. You just fail to save them."

  **Marcus:** Correct. And I think that clarity is valuable. It forces us to admit that the argument for giving away the shoes isn't "You are a murderer." It's "You are failing a moral duty." Conflating the two muddies the water. It makes people defensive about the metaphysics rather than engaging with the ethics. If I admit I didn't *cause* the death, I might be *more* willing to admit I owe them aid, because I'm not being accused of a violent act.

  **Elena:** Or it gives them a metaphysical get-out-of-jail-free card. "I didn't cause it, so it's not on my ledger." By treating omissions as genuine causes, we reflect the reality that in a connected world, inaction is a mode of action. The universe doesn't care about the distinction between pushing a button and refusing to push it. The outcome is identical. Your metaphysics privileges the status quo. It treats the current state of the world as the "default" and any intervention as "cause." But why is the status quo metaphysically privileged?

  **Marcus:** Because the status quo is the continuation of existing physical processes. Intervention requires energy. Inaction requires none. That is a physical asymmetry, not a social one. You want to treat the world as a set of expectations. I treat it as a set of processes.

  **Elena:** And I'm saying that for agents like us, processes *are* embedded in expectations. We are not billiard balls. We are nodes in a network of obligations. To model causation involving humans without modeling the obligations is to model the wrong system. It's like modeling a computer's output without referencing the code. You're looking at the silicon and saying, "No electrons were forced to go left," while I'm pointing at the logic gate saying, "The instruction failed."

  **Marcus:** The instruction failed. Yes. But the instruction isn't a physical force. It's an abstraction. You're reifying abstractions.

  **Elena:** I'm acknowledging that high-level causation is real. If I delete a file, I caused the data loss. I didn't emit a magnetic field; I triggered a sequence of non-events. If you deny that, you can't talk about software, or biology, or law. You're stuck at the particle level.

  **Marcus:** I can talk about software. I just say the *program* caused the deletion, not the *absence* of a save command. In the plant case, the *thirst* caused the death. Barry is responsible for not mitigating the thirst. But he didn't cause the thirst.

  **Elena:** He caused the *death*, not the thirst. The thirst was a background condition. The death was the event.

  **Marcus:** *We are going in circles.*

  **Elena:** Because the knot is tight. But look at the plant, Marcus. It's dead. Barry is standing in the kitchen drinking coffee. If you tell the judge Barry didn't cause this, the judge will laugh. If you tell the judge Barry caused it but it's "quasi-causation," the judge will ask what the difference is.

  **Marcus:** And if you tell the judge that the Queen of England is potentially a cause until we check the social norms, the judge will ask for a metaphysician. My view protects the objectivity of causation by keeping it physical. Your view protects the utility of blame by making causation flexible. I prefer objective causation and flexible blame. You prefer flexible causation and objective blame.

  **Elena:** I prefer a metaphysics that doesn't render the most important interactions in human life—care, neglect, duty—metaphysically inert. If "cause" only applies to pushes and pulls, then "cause" is too small a word for the world we live in.

  **Marcus:** And if "cause" applies to everything that could have prevented an outcome, then "cause" is too big. It covers everything, and therefore explains nothing.

  *Elena stands up, brushing dirt from her knees. She looks at the dry soil, then at Marcus.*

  **Elena:** Then perhaps the disagreement isn't about the plant. It's about whether the universe includes us, or just the things we bump into.

  **Marcus:** *Glances at the plant.* Or whether we are part of the machinery, or just the operators who sometimes forget to pull the lever.

  *Marcus turns to leave. Elena stays, looking at the space where the water should have been.*
