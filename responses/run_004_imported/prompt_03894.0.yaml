      *   **Reframe:** Shift from "How do we choose?" (Science) to "What constitutes meaning?" (Philosophy).
      *   **The "Fact" Problem:** Emphasize that the skeptic denies the *existence* of a fact, not just our *access* to it. Statistics assumes there is a true model (or a best approximating one). The skeptic asks what makes a model "true" of your *mind*.
      *   **The Normativity Angle:** Meaning is normative (ought). If I meant plus, I *ought* to say 125. Statistics is descriptive (is). No amount of "is" (brain states, dispositions, simplicity scores) yields an "ought" (correctness conditions).
      *   **Goodman's Grue:** Connect to the user's experience. Spectroscopy assumes nature is uniform. Wittgenstein asks *why* we are entitled to that assumption in the context of meaning.
      *   **Conclusion:** Statistics solves the *prediction* problem. It doesn't solve the *meaning* problem. But the user isn't "wrong," they are just playing a different game (science vs. metaphysics).

