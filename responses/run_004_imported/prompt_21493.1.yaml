answer: |-
  David Lewis is having lunch with a grad student who realizes he's forgotten his wallet.

  "Professor," the student says, "can you cover my tab? I'll Venmo you later."

  Lewis nods. "Fine. Debts are transferable. The creditor only cares about the funds, not the payer."

  Emboldened, the student adds, "Great! Also, I'm about to get caught falsifying data. Can you serve my suspension?"

  Lewis puts down his fork. "Absolutely not. Punishment is essentially non-transferable. The authority cares about *who* suffers."

  "But what about penal substitution?" the student asks. "Christ took our punishment."

  "That requires a metaphysical unity we lack," Lewis replies. "In short: you can pay my tab, but you can't do my time. And if you conflate the two, you haven't read the paper."
