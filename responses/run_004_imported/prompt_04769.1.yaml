answer: |-
  You have put your finger on the exact friction point between the empirical psychology of choice and the conceptual logic of action. Your intuition is correct: Ainslie's hyperbolic discounting does not explain Davidsonian akrasia; it explains it *away* by redefining the phenomenon.

  To put it in the terms you know best: Davidson is analyzing the *structure* of the decision rule at a single time point ($t_{now}$), whereas Ainslie is modeling the *parameters* of the valuation function across time ($t_1$ to $t_2$). They are solving different equations.

  Here is the breakdown of why they are incompatible, why Ainslie's model is scientifically useful but philosophically distinct, and how to frame this for your reading group.

  ### 1. Davidson's Puzzle is Synchronic
  Davidson's 1970 paper, "How is Weakness of the Will Possible?", is not primarily concerned with why we fail over time. It is concerned with a logical contradiction at the **moment of action**.

  Davidson sets up a triad that seems inconsistent:
  1.  The agent judges that $X$ is better than $Y$, all things considered (ATC).
  2.  The agent intentionally does $Y$.
  3.  Agents always act on their ATC judgments (The Principle of Continence).

  For Davidson, "all things considered" is the crucial operator. It means the agent has weighed the desire for the cigarette against the desire for health, the social pressure, the stress relief, etc., and the verdict *at that moment* is "Health > Cigarette."

  If the agent then smokes, Davidson insists they are acting against their *current* evaluative judgment. If the agent's judgment had shifted to "Cigarette > Health" because the urge became overwhelming, Davidson would say they simply changed their mind. That is not akrasia; that is preference revision. For Davidson, true akrasia requires that the judgment remains stable while the action diverges. It is a failure of rationality, not a failure of calculation.

  ### 2. Ainslie's Model is Diachronic
  Ainslie's hyperbolic discounting model (and the behavioral economics tradition following it) treats preference as revealed by choice. If a pigeon pecks the red key, the red key had higher value *at that moment*.

  In the hyperbolic model, preference reversal is inevitable as the delay to the smaller-sooner reward shrinks.
  *   **At $t_1$ (distant):** Value(Large-Later) > Value(Small-Sooner).
  *   **At $t_2$ (proximate):** Value(Small-Sooner) > Value(Large-Later).

  When the agent chooses the Small-Sooner reward at $t_2$, they are acting in accordance with their *current* valuation. The "weakness" is not that they acted against their current judgment; it is that their current judgment is inconsistent with their past judgment.

  This reframes the problem from a **synchronic conflict** (Judgment vs. Action) to a **diachronic conflict** (Self at $t_1$ vs. Self at $t_2$). In Ainslie's view, there is no mystery about why the agent eats the cake. At the moment of eating, the cake *is* more valuable than the diet. The "puzzle" of how one can choose the lesser good vanishes because the lesser good has temporarily become the greater good due to the discount curve's slope.

  ### 3. The Verdict: Dissolution, Not Explanation
  To answer your specific question: Hyperbolic discounting is **an explanation of a different everyday phenomenon we've been lumping in with akrasia.**

  Ainslie provides a mechanistic explanation for *dynamic inconsistency* (procrastination, addiction relapse, diet breaking). These are cases where our preferences flip-flop over time. Davidson is analyzing *clear-eyed moral weakness*, where an agent feels the pull of desire but maintains the judgment that they ought not to yield, yet yields anyway.

  If you accept Ainslie's model as the whole story, Davidson's puzzle dissolves. You would tell Davidson: "Your Premise 1 is false. The agent does *not* judge $X$ better than $Y$ at the moment of action. Their discount curve has spiked the value of $Y$."

  But Davidson would reply: "Then you aren't describing akrasia. You're describing changing your mind. I am interested in the case where the agent says, 'I know I shouldn't do this, I still believe I shouldn't do this, and yet I am doing it.'"

  From your background in foraging:
  *   **Ainslie** explains why a starling leaves a patch too early when a predator is near (the immediate safety value hyperbolically overtakes the long-term foraging value). The bird isn't irrational; its valuation function shifted.
  *   **Davidson** describes a starling that *knows* the predator is there, *calculates* that staying yields more food and is worth the risk, judges "Stay > Leave," and then flies away anyway, without any change in the calculation.

  Most empirical cases (addiction, dieting) look like Ainslie's model. But the *phenomenological* experience of guilt—the feeling that "I shouldn't be doing this *right now*"—suggests there is a residue of Davidson's puzzle that discounting doesn't capture. The guilt implies the ATC judgment didn't actually flip, even if the choice did.

  ### 4. A Note on Aristotle
  You asked for context on Aristotle, and it bears directly on this split. In the *Nicomachean Ethics* (Book VII), Aristotle wrestles with the Socratic paradox: "No one does evil willingly." Socrates argued that if you truly know the Good, you do it; if you do evil, you must have been ignorant.

  Aristotle wants to save the phenomenon of akrasia (we clearly do fail), but he wavers on whether the akratic agent possesses the knowledge *at the time of action*. He suggests the knowledge is present but not "active"—like a drunk reciting a poem without understanding it, or a student asleep during an exam.

  *   **Aristotle leans toward Ainslie:** The valuation/knowledge is suppressed or altered by passion. The major premise ("Dry food is good for man") is held, but the minor premise ("This is dry food") is clouded by appetite.
  *   **Davidson leans against Aristotle (and Socrates):** He insists the judgment is active and explicit. The failure is not in the knowledge/valuation, but in the logical connection between judgment and action.

  So, the tension you feel is not new; it is the modern recurrence of the Aristotelian vs. Davidsonian split. Is the failure cognitive (Ainslie/Aristotle: the value shifted/knowledge slept) or volitional (Davidson: the value held, the will slipped)?

  ### 5. Strategy for Your Reading Group
  When you meet, you will likely find the group conflating these two. Here is how to keep your head straight:

  1.  **Distinguish the Explananda:** Ask the group whether they are discussing *preference reversal* (wanting to quit smoking in January, wanting to smoke in March) or *synchronic weakness* (wanting to quit smoking in March, judging one should quit in March, and smoking in March).
  2.  **Locate Ainslie:** Place Ainslie firmly in the first category. His model explains why self-control requires *pre-commitment* strategies (like Ulysses tying himself to the mast). If the preference flips at $t_2$, the only rational move is to bind the $t_2$ self from the perspective of $t_1$.
  3.  **Locate Davidson:** Place Davidson in the second. His account explains why we feel *regret* immediately upon action. If Ainslie were fully right, we wouldn't feel regret at $t_2$; we would just be satisfied until the curve flattened again. But we often feel remorse *while* eating the cake. That suggests the ATC judgment didn't flip.
  4.  **The "In Between" Position:** You can argue that hyperbolic discounting explains the *pressure* that leads to akrasia, but not the *structure* of the akratic act itself. The curve explains why the temptation is so high, but Davidson explains why succumbing feels like a violation of reason rather than just a change of taste.

  **Summary:** You are not missing a connection; there isn't one. Ainslie naturalizes the phenomenon by denying the stability of the judgment. Davidson philosophizes the phenomenon by insisting on the stability of the judgment. For your reading group on addiction, Ainslie is the better predictive tool. For a reading group on moral responsibility, Davidson is the necessary conceptual framework. Recognizing that they are drawing different maps of the same territory will serve you better than trying to force them to overlap.
