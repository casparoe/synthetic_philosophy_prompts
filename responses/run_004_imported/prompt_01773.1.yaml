answer: |-
  **The Tension in the Line**

  The gauge on the console read 4,000 Newtons. It had read 4,000 Newtons for three years.

  Kael tapped the glass face of the instrument. The needle didn't flicker. It held steady, trembling only with the microscopic vibration of the station itself. Outside the thick quartz viewport, there was nothing. No stars, no background radiation, no distant quasars. Just a grey, featureless void that pressed against the eyes until they watered.

  And somewhere out there, six kilometers away, was the Other.

  "Still pulling?" Elara's voice came over the comms. She sounded tired. They both were.

  "Four kilonewtons," Kael said. "Same as yesterday. Same as the day we woke up."

  "That's impossible, Kael."

  "We've been over this."

  "It's impossible," she insisted, her voice crackling with the static of the long tether. "Inertia is a relationship. It's a conversation between mass and the rest of the universe. If there is no 'rest of the universe,' there is no inertia. If there's no inertia, there's no centrifugal force. If there's no force, the cable should be slack."

  Kael looked out the window again. He could just barely see the Other. It was a duplicate of his own station, a silver sphere drifting in the dark. They were connected by a carbon-nanotube cable, taut as a guitar string. According to the telemetry, they were rotating around a common center of mass at a steady clip.

  "The cable isn't slack, Elara. The winch is screaming. Space is pulling us apart."

  "Space isn't a *thing*," she snapped. "Newton was wrong. Mach was right. You can't spin relative to nothing. It's like trying to be alone in a room that doesn't exist. What are we pulling against?"

  "The tension," Kael said. "We're pulling against the tension."

  "That's circular logic."

  "It's empirical data."

  Kael leaned back in his chair. He felt the pull, subtly. Not a gravity, but a heaviness. His blood pooled slightly in his legs. The station was spinning, creating an artificial gravity that pressed him into the seat. But when he looked out, there was no blur of stars to confirm the motion. There was no horizon. There was only the grey.

  It made him nauseous. Not the motion sickness of spinning, but the existential sickness of moving without traveling.

  "I'm going to cut it," Elara said suddenly.

  Kael sat up. "Don't."

  "If I cut the line, the tension drops to zero. We stop spinning. We'll float."

  "We'll fly off tangentially," Kael corrected. "We'll drift apart. Forever."

  "Into what?" she asked. "There's no 'apart' if there's no metric to measure distance. If I cut the line, and Mach is right, we won't fly apart. We'll just... stop. Because the rotation will cease to have meaning."

  "If Newton is right, we fly apart at forty meters per second and die."

  "If Newton is right," Elara whispered, "then Space is a god. It's an invisible container that watches us and decides we are moving even when there's nothing to compare us to. I can't live in a universe where the Nothing has rules."

  Kael watched the gauge. 4,000 Newtons.

  He thought about the experiment. The Great Isolation. They had been placed here to settle a debate that had lasted three centuries. Substantivalism vs. Relationism. Does space exist on its own, or is it just the order of things?

  If the cable stayed tight, Space was a substance. It was a stage that existed even when the actors left.
  If the cable went slack, Space was a lie. It was just a word for where things were relative to each other.

  "Elara," Kael said softly. "Do you feel it?"

  "Feel what?"

  "The spin. In your inner ear. You feel dizzy."

  "I feel... pressure."

  "I feel rotation. My body knows we are turning. My fluids know. The water in my canteen curves when I set it down. The physics works locally. Why does it need the stars to validate it?"

  "Because physics is a language," she said. "And you can't speak a language to an empty room."

  "The cable is speaking."

  "The cable is metal."

  "The cable is truth."

  There was a long silence. The hum of the station was the only sound, a low thrum that matched the vibration of the tether.

  "I'm going to fire the thrusters," Elara said. "Counter-rotation. I'm going to try to stop us."

  "You can't stop if you don't know what you're stopping relative to."

  "I'll stop relative to the cable. I'll unwind us."

  Kael watched the gauge. He imagined the Other, six kilometers away, firing her thrusters. He imagined them winding around each other like a pair of dancers in a dark room, trying to find the wall.

  The needle twitched.

  4,100 Newtons.

  "See?" Kael said. "You're fighting it. The resistance is real."

  "I'm fighting the cable, Kael. Not the void."

  "Then what is holding the cable tight?"

  She didn't answer. The needle crept up. 4,200.

  "It hurts," she said quietly.

  "What?"

  "My head. The dizziness. It's getting worse."

  "Then stop the thrusters."

  "If I stop, does it mean we're still spinning? Or does it mean I just gave up?"

  Kael looked at the grey void. He realized the terror wasn't that they were moving. The terror was that they might be the only two things in existence, and yet they were still subject to laws imposed by a nothingness that surrounded them. It meant they weren't free. Even in the absolute absence of the world, the world still held them.

  "Elara," Kael said. "The tension isn't about the stars. It's about us."

  "How?"

  "We're trying to go straight. The cable won't let us. That's all rotation is. It's the argument between where we want to go and where we're tied to."

  The needle settled back at 4,000. The thrusters had cut off.

  "So we're tied," she said.

  "Yeah."

  "To what?"

  Kael looked at the gauge. He looked at the dark. He thought about Newton, sitting in a garden, watching an apple fall, deciding that the universe was a machine. He thought about Mach, looking up at the night sky, deciding the universe was a relationship.

  Here, in the grey, there was no apple. There was no sky. There was only the pull.

  "I don't know," Kael said. "But the rope knows."

  He reached out and touched the console. The vibration hummed through his fingertips, a constant, steady reminder. They were spinning. They were accelerating. They were straining against the fabric of a reality that refused to disappear just because they were alone in it.

  "Keep the comms open," Kael said.

  "Always," Elara replied.

  "And don't cut the line."

  "I won't."

  "Because if you do," Kael said, watching the needle hold steady against the void, "we'll find out if the nothing lets us go. And I'd rather be pulled by a ghost than float in a grave."

  The gauge read 4,000 Newtons. It was the heaviest thing in the universe.
