      *   *Step 3: The Substance Issue (Leibniz).* The mind is a simple substance (monad). It is not composite. A computer simulation is composite (bits, gates). You can't make a simple substance out of complex parts.
      *   *Step 4: The Identity Issue.* Even if you could copy the data, it's a copy. The *subjective* continuity is broken. The "I" that dies is still gone. This fails the rationality test.
      *   *Step 5: The Real Solution.* The afterlife is metaphysical, guaranteed by the rational structure of reality (and God), not by engineering.

  5.  **Drafting the Response (Iterative refinement):**
