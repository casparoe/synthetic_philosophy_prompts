answer: |-
  ### The Scenario: The Antarctic Station

  Consider a small, isolated research team wintering over at an Antarctic station. There are five members, including **Jonas** (the wrongdoer) and **Dr. Lena** (the critic). Due to a supply chain error, rations are tighter than expected, and a strict norm of equal distribution is established to ensure everyone survives until the resupply.

  **The Wrong:** Three weeks before resupply, Jonas, suffering from severe, visible anxiety and sleep deprivation, secretly hoards a small cache of high-calorie bars from the communal supply. He is discovered.

  **The Critic:** Dr. Lena is the team lead. She is morally pristine regarding the rations: she has strictly adhered to the distribution rules and has never taken more than her share **(Constraint a: No Hypocrisy)**. Furthermore, Lena did not cause the supply error, did not pressure Jonas to work the excessive hours that led to his breakdown, and gains no material benefit from Jonas's punishment; in fact, his removal from duties makes her workload heavier **(Constraint b: No Complicity or Benefit)**.

  **The Standing-Defeating Fact:** In the month prior to the theft, Jonas's mental deterioration was obvious. The station's protocol—and basic human decency in an isolated, high-stakes environment—required team members to monitor each other's well-being and share burdens when a colleague faltered. Lena, however, explicitly adopted a policy of "professional detachment." When Jonas asked for a lighter workload, Lena refused, telling him, "We are here to work, not to coddle each other. Manage your own capacity." She maintained her own moral cleanliness and operational efficiency by intentionally withdrawing solidarity and refusing to absorb any of the stress that eventually drove Jonas to the wrong.

  When Jonas is caught, Lena is the first and loudest to condemn him. She delivers a stern lecture on integrity and the violation of the communal trust. The other three team members, however, feel a robust intuition that Lena **lacks the standing** to blame Jonas. They do not deny that Jonas did wrong. They do not claim Lena is a hypocrite (she didn't steal). They do not claim she is complicit (she didn't make him steal). Yet, when Lena speaks, the others intervene, suggesting she has no right to judge him.

  ### The Feature Stripping Standing: Relational Abdication

  The feature doing the work here is **Relational Abdication** (or a Failure of Moral Solidarity).

  In standard hypocrisy accounts (like Wallace's), standing is lost because the blamer violates the *same norm* they are enforcing, implying they do not truly respect the authority of that norm. In complicity accounts, standing is lost because the blamer is implicated in the *harm*.

  In Lena's case, she respects the norm (she followed the rationing rules) and is not implicated in the harm (she didn't cause the theft). However, standing to blame is not merely a function of one's relationship to the *rule*; it is also a function of one's relationship to the *agent* and the *moral community* that sustains the rule.

  Moral norms in high-stakes communities (like families, teams, or societies) are underpinned by a reciprocal expectation of support. The obligation to follow the rule (do not steal) is balanced by the obligation to support others in following the rule (help them when they struggle). By intentionally insulating herself from the burdens of Jonas's vulnerability to preserve her own "clean hands," Lena severed the reciprocal tie that gives her blame moral force. Her blame is not an invitation to moral repair within a shared community; it is an assertion of dominance from a position of manufactured superiority. She claims the privileges of the moral community (the right to enforce norms) without accepting its costs (the duty of care).

  ### Implications for the Theory of Standing

  This scenario demonstrates that "lacking standing to blame" **cannot be reduced to a consistency-with-one's-own-conduct requirement.**

  1.  **Beyond Conduct:** Lena's conduct regarding the *specific norm* (rationing) was perfectly consistent. She did not violate the rule she enforced. If standing were solely about consistency of conduct (the hypocrisy model), Lena would have full standing. The intuition that she lacks it shows that standing depends on **relational history** and **attitudes of solidarity**, not just parallel behavior.
  2.  **Heterogeneous Cluster:** The phenomenon of lost standing is a heterogeneous cluster. Hypocrisy is one cluster (violating the norm you enforce). Complicity is another (contributing to the wrong). **Relational Abdication** is a third. It shows that one can lose standing not by *breaking* the rules, but by *abandoning the relationships* that make the rules meaningful.
  3.  **Critique of Cohen/Wallace:** G. A. Cohen's "throwing the first stone" and Wallace's "equal standing" accounts focus heavily on the blamer's moral status relative to the *norm*. They ask: "Does the blamer acknowledge the authority of this norm over themselves?" Lena does acknowledge that authority (she follows the rules). The problem is that she fails to acknowledge the authority of the *person* she is blaming as a fellow participant in a shared moral project.

  Therefore, a complete theory of standing must account for the **ecology of moral relationships**. It is not enough to ask, "Did the blamer do the same thing?" We must also ask, "Did the blamer uphold their end of the relational bargain that makes moral address appropriate?" Lena's failure suggests that standing is partly constitutive of **moral citizenship**: you forfeit the right to judge when you opt out of the mutual support that makes judgment a cooperative rather than coercive act.
