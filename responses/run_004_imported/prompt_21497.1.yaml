prompt: |-
  I'm a novelist, which is apparently all the qualification my family needs to hand me my brother's wedding toast. He's marrying Priya, who's finishing a dissertation on the buck-passing account of value -- specifically the 'wrong kind of reasons' problem, the one about a demon who'll torture you unless you learn to love a saucer of mud, which gives you a reason to love it but not the kind that makes it actually good. Half the guests are her philosophy cohort, who'll clock it instantly if I lean on this; the rest are aunts and uncles who've never heard of Scanlon or 'fitting attitudes' and just want a nice toast. Write me a five-minute toast that gets a real joke out of the wrong-kind-of-reasons idea -- ideally something about how nobody in the literature has actually agreed what the 'right' reasons for loving someone even are, so my brother's off the hook either way -- without ever implying he married her for the wrong ones, and without it turning into a seminar. Also, no sappiness, thats not our family.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Novelist (family storyteller, but not academic).
      *   **Occasion:** Brother's wedding toast.
      *   **Groom:** The brother.
      *   **Bride:** Priya (PhD candidate in philosophy).
      *   **Topic:** The "buck-passing account of value" and the "wrong kind of reasons" problem (specifically the Saucer of Mud/Demon example).
      *   **Audience:** 50% Philosophy cohort (will know the references), 50% Family (won't know the references).
      *   **Goal:** Make a *real joke* out of the concept without turning it into a lecture. Specifically, highlight that there's no consensus on "right" reasons for love, so the brother is safe.
      *   **Constraints:** Do *not* imply he married her for the "wrong" reasons (e.g., money, fear). No sappiness (family style). Keep it to about 5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy (for the joke):**
      *   *The Concept:* The "Wrong Kind of Reasons" (WKR) problem.
      *   *The Example:* A demon threatens to torture you unless you desire/love a saucer of mud. You have a *reason* to desire it (avoid torture), but that reason doesn't make the mud *good* or desirable in itself. It's the wrong kind of reason.
      *   *The Application to Marriage:* If you marry someone to avoid torture (or for money, or because your mom said so), those are "wrong kind of reasons."
      *   *The Twist:* Philosophers can't agree on what the "right kind of reasons" are. Therefore, the brother can't possibly be wrong, because no one knows what "right" looks like.

  3.  **Determine the Tone:**
      *   Witty, slightly self-deprecating (novelist vs. philosophers), warm but not mushy.
      *   Needs to bridge the gap between the academics and the aunts.
      *   Avoid jargon where possible, or explain it quickly through the joke.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role. Establish the "Novelist vs. Philosopher" dynamic. Welcome everyone.
