answer: |-
  Good evening. For those who don't know me, I'm [Your Name], [Groom]'s brother. I'm a novelist. Apparently, in this family, "writes fiction" is synonymous with "knows how to express human emotion," which is how I ended up standing here instead of our sister, who actually has feelings.

  I was told to prepare something for Priya and [Groom]. And I wanted to make sure I acknowledged Priya's work. For the half of the room currently scanning this for citations: Priya is finishing her dissertation on the buck-passing account of value. Specifically, the "Wrong Kind of Reasons" problem.

  For the aunts and uncles: Priya studies why we think things are good. There's a famous thought experiment in her field involving a demon. The demon threatens to torture you unless you desire a saucer of mud. Now, you have a *reason* to desire the mud—specifically, that you want to avoid torture. But, having that reason doesn't actually make the mud *good*. It's the wrong kind of reason.

  It's a brilliant distinction. And when I heard it, I realized it solves a major problem for my brother tonight.

  See, marriage is traditionally defined as a union based on love. And love, presumably, requires the "Right Kind of Reasons." If you marry someone because they have a trust fund, or because your mother guilt-tripped you, or because a demon threatened to torture you... those are the Wrong Kind of Reasons.

  Now, [Groom], I've known you a long time. I know you're many things. But I have never seen you successfully navigate a high-stakes philosophical dilemma. You still think "existential dread" is a brand of craft beer. So, naturally, I worried. I worried that you might have accidentally married Priya for the Wrong Kind of Reasons. Maybe you just like that she cooks? Maybe you like that she tolerates your music? Are those reasons *about her*, or are they just benefits *to you*? It's a slippery slope.

  But then I looked at the literature. And I found the loophole.

  Here is the thing that the philosophy cohort knows, and the rest of us can now use as a shield: After decades of debate, nobody in the literature has actually agreed on what the "Right Kind of Reasons" for loving a person *are*.

  Is it their intrinsic properties? Their relational value? A fitting attitude toward their goodness? Scanlon has a view. Parfit has a view. The room full of Priya's colleagues currently has about twelve conflicting views.

  What this means, [Groom], is that you are officially off the hook.

  Because there is no consensus on the criteria, your marriage is technically unfalsifiable. You cannot be wrong. If an aunt asks, "Why did you marry her?" and you say, "Because she laughs at my jokes," a philosopher might say, "Ah, but is that a reason of the right *kind*?" And you can say, "I don't know, ask the department. They haven't decided."

  You have married a woman who specializes in value, which is convenient, because it means she is the only person qualified to audit the transaction. And since she said yes, the buck stops with her.

  Now, I promise I am not implying you married her under duress. There is no demon. As far as I know. And I am certainly not implying that your reasons are muddy. Though, if they were, Priya has the theoretical framework to forgive you.

  The truth is, in fiction, you write characters who fit together because the plot demands it. In philosophy, you analyze why they fit until the concept of "fitting" dissolves into semantic noise. But in real life, you just find the person who makes the saucer of mud look like a prize, and you hold on tight.

  Priya, thank you for bringing rigorous epistemic standards to this family. We usually just go with "gut feeling." [Groom], you're a lucky man, mostly because the definition of "lucky" is subjective, and therefore unassailable.

  So, if everyone could raise a glass.

  To Priya and [Groom]. May your reasons be right, may your value be intrinsic, and may your life together be the one problem you never need to solve.

  Cheers.
