      *   **The Reassurance:** Explicitly state he *doesn't* love her because of a demon. He loves her for... well, we don't need to define it (keeps the joke alive).
      *   **Closing:** Raise a glass. Keep it punchy.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi, I'm the brother. I write fiction, Priya writes philosophy. Priya studies why we love things. There's a theory about a demon and mud. If a demon says "love mud or I hurt you," you have a reason, but it's the wrong reason. People say marriage is serious. But philosophers can't agree on what the right reason for love is. So, [Brother], you're safe. Even if you messed up, the philosophers haven't decided what "not messing up" looks like. But seriously, you love her for the right reasons. Cheers.

      *Critique 1:* Too dry. Needs more voice. Needs to address the "no sappiness" rule. Needs to make sure the aunts aren't lost.

  6.  **Drafting - Iteration 2 (Adding Voice and Detail):**
