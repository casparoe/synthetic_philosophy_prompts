answer: |-
  Your skepticism is not only well-founded, it aligns with one of the most significant and enduring critiques in modern welfare economics. While Harsanyi's 1955 Aggregation Theorem is frequently presented in seminars as a "derivation" of utilitarianism, your intuition is correct: **the theorem itself is formally compatible with any distribution of moral weights and does not solve the problem of interpersonal comparison of utility (ICU).**

  Without an independent solution to the measurement problem, the theorem provides a *structure* for aggregation but no *substance* for ethical judgment. Here is the argument for why the 1955 theorem fails to license interpersonal comparisons or establish normative utilitarianism on its own.

  ### 1. The Problem of Independent Affine Transformations
  The core of your objection lies in the measurement properties of von Neumann–Morgenstern (vNM) utility functions. As you noted, a vNM utility function $u_i$ representing individual $i$'s preferences is unique only up to a **positive affine transformation**. That is, if $u_i$ represents $i$'s preferences, then $u_i' = \alpha_i u_i + \beta_i$ (where $\alpha_i > 0$) represents the exact same preferences.

  Crucially, the constants $\alpha_i$ (the unit of measurement) and $\beta_i$ (the zero point) can be chosen **independently** for each individual. There is nothing in the vNM axioms that links Person A's "unit" of utility to Person B's "unit."

  Harsanyi's theorem concludes that the social welfare function $W$ must take the form:
  $$ W = \sum_{i=1}^n a_i u_i + b $$
  where $a_i \geq 0$.

  In a normative utilitarian framework, the weights $a_i$ are supposed to represent the moral standing of each individual (often assumed to be equal, i.e., $a_i = 1$). However, because each $u_i$ can be rescaled independently, the values of $a_i$ are entirely dependent on the arbitrary choice of scales for $u_i$.

  **The Mathematical Demonstration:**
  Suppose we have a valid representation where $a_1 = 1$ and $a_2 = 1$ (classical utilitarianism).
  Now, imagine we rescale Person 1's utility function by a factor of 1,000 ($\alpha_1 = 1000$). To represent the *same* social ordering $W$, we must now adjust the weight $a_1$ to $1/1000$.
  $$ W = \frac{1}{1000}(1000 u_1) + 1(u_2) $$
  The social ordering remains unchanged, but the weights have shifted drastically. Person 1 now appears to count for 1/1000th of Person 2.

  Since the vNM axioms provide no basis for choosing one scale over another, the weights $a_i$ are **artifacts of normalization**, not substantive ethical facts. The theorem tells us that social welfare is a weighted sum, but it is silent on what the weights *ought* to be.

  ### 2. The Theorem is Conditional, Not Normative
  Harsanyi's 1955 result is a **representation theorem**, not a normative justification. It takes the form of a conditional statement:
  *   *IF* individual and social preferences satisfy vNM axioms,
  *   *AND* social preferences satisfy the Pareto principle,
  *   *THEN* social welfare is an affine aggregation of individual utilities.

  It does not tell us that we *ought* to satisfy the Pareto principle in all contexts, nor does it tell us how to fix the weights. To get from "affine combination" to "utilitarianism" (specifically, the sum of utilities with equal weights), one must import an additional ethical premise: **that interpersonal comparisons are meaningful and that individuals should be weighted equally.**

  The theorem assumes the *possibility* of adding utilities together (cardinality), but it does not justify the *comparability* of the units being added. As Amartya Sen has famously argued, Harsanyi's theorem requires "unit comparability" to make sense of the weights, but the vNM framework only provides "non-comparable cardinality." Without an external mechanism to calibrate the scales (e.g., a shared zero point and unit), the summation is mathematically permissible but ethically empty.

  ### 3. The "Tautology" Critique
  Because the weights are indeterminate, the theorem risks becoming a tautology. Any social ordering that satisfies the Pareto principle and vNM axioms can be represented as a weighted sum of individual utilities *if we are allowed to choose the weights arbitrarily.*

  If a dictator prefers their own utility above all else, we can represent this as $W = 1000 u_{dictator} + 1 u_{others}$. This satisfies Harsanyi's conditions. If an egalitarian prefers equality, we can represent that with different weights (or a concave transformation, though strictly speaking, Harsanyi's linear result requires specific Pareto conditions).

  The point is that the theorem does not rule out elitism, prioritarianism, or dictatorship; it merely says that whatever social preference you hold (provided it is vNM-consistent and Paretian), it *can be written* as a weighted sum. Therefore, it cannot be used to argue that utilitarianism (equal weights) is the *unique* rational outcome.

  ### 4. Harsanyi's Later Acknowledgement (Extended Preferences)
  It is worth noting that Harsanyi himself was aware of this limitation. In later work (particularly in the 1970s), he attempted to solve the ICU problem not through the 1955 aggregation theorem, but through his theory of **"extended preferences"** and the **Veil of Ignorance**.

  He argued that to determine the weights (and the scales), individuals should imagine themselves having an equal chance of being anyone in society. Under specific assumptions about risk neutrality, this leads to equal weights. However, this is a *separate* ethical argument added *on top* of the 1955 theorem.

  When your professor presents the 1955 theorem *alone* as grounding utilitarianism, they are eliding the crucial step where Harsanyi (later) tried to fix the scales. Without that additional "Veil of Ignorance" argument, the 1955 theorem leaves the weights completely underdetermined.

  ### 5. Conclusion: Formalism vs. Substance
  Your skepticism highlights the distinction between **formal aggregation** and **ethical justification**.
  *   **Formal Aggregation:** Harsanyi (1955) proves that if we aggregate preferences consistently under risk, the math looks like utilitarianism.
  *   **Ethical Justification:** Utilitarianism requires that Person A's joy is commensurable with Person B's pain and that they count equally.

  The 1955 theorem provides the former but not the latter. It shows that utilitarianism is *compatible* with rational choice axioms, but it does not prove that utilitarianism is *required* by them. The weights remain arbitrary parameters until an independent theory of interpersonal comparison is supplied. Therefore, the theorem does not license interpersonal comparisons; rather, it **presupposes** that such comparisons are possible (by allowing the addition of $u_i$) without explaining how to make them.

  In sum, you are correct: without a solution to the scaling problem, the "weights" in Harsanyi's theorem are mathematically necessary but ethically vacuous. The theorem describes the *geometry* of social choice, but it does not dictate the *morality* of the weights.
