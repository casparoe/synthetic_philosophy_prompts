answer: |-
  You are right to feel that the Absent-Minded Driver (AMD) problem highlights a structural tension that is not merely "cosmetic," and your friend is oversimplifying the issue by treating it as a standard Bayesian updating problem. While your friend is correct that the *ex-ante* planning problem is well-defined and solvable, they are incorrect to suggest that "ordinary expected-utility maximization" applied locally (at the intersection) naturally yields the same result.

  The disagreement between you and your friend hinges on a subtle but profound feature of decision theory under imperfect recall: **the endogeneity of self-locating beliefs.**

  Here is a detailed breakdown of why the wedge exists, why perfect recall avoids it, and what this implies for decision theory and problems like Sleeping Beauty.

  ### 1. The Wedge: Ex-Ante Planning vs. Local Action

  To see the wedge, we must distinguish between two ways of applying expected utility maximization (EUM).

  **The Ex-Ante View (Policy Selection)**
  Before the drive begins, you choose a policy $p$ (the probability of continuing at any intersection). You know this policy controls your trajectory through the entire tree.
  *   Probability of exiting at 1st intersection (Payoff 0): $(1-p)$
  *   Probability of exiting at 2nd intersection (Payoff 4): $p(1-p)$
  *   Probability of overshooting (Payoff 1): $p^2$
  *   **Ex-Ante Expected Utility:** $E[U] = 4p(1-p) + 1p^2 = 4p - 3p^2$.
  *   Maximizing this yields **$p = 2/3$**.

  **The Local View (Action Selection)**
  Now, imagine you are *at* an intersection. You cannot tell if it is the first or the second. To maximize utility locally, you need to calculate the expected payoff of Continuing vs. Exiting. To do this, you need a belief: *What is the probability I am at the first intersection ($X$) versus the second ($Y$)?*

  Here is where the trouble starts. In a standard decision problem, your beliefs about the state of the world are fixed by evidence and nature. In AMD, **your belief about your location depends on the strategy you are using.**
  *   You only reach $Y$ if you continued at $X$.
  *   Therefore, the probability of being at $Y$ is proportional to $p$.
  *   Using the standard "Indifference" or "Self-Sampling" approach consistent with the strategy $p$, the probability you are at $X$ is $\frac{1}{1+p}$ and at $Y$ is $\frac{p}{1+p}$.

  If you reason locally using **Causal Decision Theory (CDT)**, you treat the probability of being at $X$ or $Y$ as a *fixed fact* determined by the past. You assume: *"My choice right now cannot change where I am."*
  *   If you fix your belief based on the ex-ante optimal plan ($p=2/3$), your probability of being at $X$ is $3/5$.
  *   If you calculate the local expected utility of Continuing vs. Exiting *holding that belief fixed*, standard CDT often recommends a different $p$ (often $p=1$, i.e., always continue) because the marginal benefit of continuing looks higher when you treat the probability of having arrived at $Y$ as a sunk fact.

  **The Wedge:**
  *   **Ex-Ante:** "If I choose a higher $p$, I am more likely to reach the high-payoff node, but also more likely to overshoot." (You account for the effect of $p$ on arrival probabilities).
  *   **Local (CDT):** "The probability that I am at the high-payoff node is already fixed by my past self. I should just optimize for this moment." (You ignore the effect of current $p$ on the likelihood of being at $Y$).

  Your friend claims this is just "sloppy updating." But it is not sloppy; it is a consequence of **Causal Dominance**. A CDT agent believes their current action cannot causally influence the past (where they came from). Therefore, they treat the location probability as fixed. But the ex-ante planner knows the policy *does* influence the location probability. This creates a time inconsistency that does not exist in perfect recall games.

  ### 2. Why Perfect Recall Avoids This

  In a standard game tree with perfect recall:
  1.  **Distinct Information Sets:** At node $Y$, you know you are at $Y$. You do not need to infer your location from your strategy.
  2.  **Backward Induction:** You solve from the end. At $Y$, you choose the best action. At $X$, you anticipate what you will do at $Y$.
  3.  **No Evidential Feedback:** Your choice at $X$ causally determines whether you reach $Y$, but it does not provide *evidence* about where you are *at the moment of choice*, because you already know where you are.

  In AMD, because the information sets are merged, your action provides evidence about your location (via the assumption that you follow a consistent policy). Perfect recall severs the evidential link between "what I do now" and "where I am now." Imperfect recall fuses them.

  ### 3. Is the "Decision Problem" Well-Defined?

  This is the deepest philosophical point.
  *   **Your Friend's View:** The decision problem is "Maximize utility." Since the ex-ante calculation is unambiguous, that is the solution. Any local confusion is a failure to realize you are bound by the ex-ante plan.
  *   **Your View:** The decision problem is ambiguous because it depends on the **vantage point**.

  You are correct that the problem is not well-defined *independently* of the decision theory employed.
  *   If the agent is a **Policy Selector** (Updateless), the problem is trivial: Choose $p=2/3$.
  *   If the agent is an **Action Selector** (Causal/Naive), the problem is ill-posed or leads to inconsistency, because the "state of the world" (location) is a function of the "action" (policy).

  This is why the AMD problem is often cited as a motivation for **Updateless Decision Theory (UDT)** or **Evidential Decision Theory (EDT)** over Causal Decision Theory (CDT).
  *   **CDT** says: "My action now doesn't change where I am." (Leads to the wedge).
  *   **EDT/UDT** says: "My action now is correlated with my action in the past (because I am the same algorithm). Therefore, choosing 'Continue' makes it more likely I am at $Y$ (because I must have continued at $X$)."
  *   If you reason evidentially locally, the "wedge" disappears. The local calculation aligns with the ex-ante calculation because you acknowledge that your current choice is logically linked to the past choice that got you there.

  ### 4. Connection to Sleeping Beauty and Updateless Reasoning

  The AMD problem is structurally isomorphic to the **Sleeping Beauty** problem.
  *   **Sleeping Beauty:** Upon waking, what is your credence the coin was Heads?
      *   *Halfers (analogous to your friend):* Treat the awakening as a fixed event; update on "I am awake" but don't let the number of awakenings influence the probability of the coin.
      *   *Thirders (analogous to the ex-ante/UDT view):* Recognize that the probability of *this* awakening depends on the coin toss (policy).
  *   **AMD:** Upon arriving, what is your credence you are at $X$?
      *   If you treat the arrival as a fixed fact (Friend/CDT), you get the wedge.
      *   If you treat the arrival as sampling from a distribution determined by your policy (User/UDT), the wedge closes.

  The AMD argument suggests that **policy-based reasoning** is more fundamental than **act-based reasoning**. An agent who reasons "What should I do *now*?" implicitly assumes they are a distinct temporal entity from their past self. An agent who reasons "What policy should I instantiate?" recognizes they are a single logical entity extended through time.

  ### Summary of the Verdict

  1.  **You are right:** There is a genuine, structural wedge between ex-ante optimality and local causal optimality in imperfect recall problems. It is not merely "sloppy updating"; it is a conflict between treating beliefs as fixed (Causal) vs. treating beliefs as strategy-dependent (Evidential/Updateless).
  2.  **Your friend is partially right but misses the point:** They are right that the *ex-ante* solution is the normative standard for success. However, they are wrong that "ordinary" local reasoning gets you there. Ordinary (Causal) local reasoning *fails* to get you there. To align local reasoning with ex-ante optimality, you must adopt a non-standard decision theory (like UDT or EDT) that accounts for the logical correlation between your current action and your past location.
  3.  **Implication:** The AMD problem demonstrates that in cases of imperfect recall (and anthropic reasoning), **rationality requires acting as if you choose your entire policy at once**, rather than optimizing act-by-act. The "decision problem" is only well-defined if we specify whether the agent views themselves as a sequence of actions or a single policy function.

  The "paradox" is not a mathematical error; it is a feature of agency. It shows that for agents with imperfect recall, **freedom of action** (choosing locally) can be inimical to **freedom of will** (achieving ex-ante goals). Resolving it requires surrendering the intuition that you can optimize locally while treating your past as a fixed causal history.
