      *   *Skeptic of Whole-Brain Standard:* She didn't think "brain death" was the *biological* moment of death (citing integration issues like Shewmon), but she also thought Higher-Brain and Circulatory standards had flaws.
      *   *Conclusion:* The current standard is a "useful legal fiction." It's a line we draw for practical reasons (transplantation, resources), not a metaphysical discovery of when the "person" leaves.
      *   *Final Instructions:* No "watching over," no "survival" after brain function ends. Death is the end of the integrated organism/person.

  3.  **Identify the Core Tension:**
      *   How to honor a woman who spent her life defining the boundaries of death without making the eulogy feel like a cold clinical report?
      *   How to acknowledge her skepticism about "life after death" without making the mourners feel hopeless or unloved?
      *   How to bridge the gap between the ethics experts (who want intellectual rigor) and the family (who want emotional resonance)?

  4.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the loss directly. Avoid euphemisms like "passed on" or "gone to a better place." Stick to "died." Acknowledge the two groups in the room implicitly.
      *   **The Work (for the Colleagues):** Address her career. Acknowledge the complexity of her views. Don't simplify her stance on brain death. Admit that she saw the definitions as tools, not absolute truths. This validates the colleagues' respect for her intellect.
      *   **The Person (for the Family):** Translate her rigor into care. Why did she care so much about definitions? Because she cared about truth, about dignity, about not lying to people. Her honesty *was* her love language.
      *   **The Instructions (The Elephant in the Room):** Address her specific request about no "watching over." Frame this not as a denial of love, but as a commitment to the reality of the life lived. The memory is in us, not in a ghost.
      *   **Closing:** Bring it back to the present. She is dead. We are alive. The work continues.

  5.  **Navigating the "Brain Death" Controversy:**
      *   *Crucial:* The prompt says she died of *cardiac death* in hospice. So, the brain death debate isn't about *her* specific moment of death. It's about her *life's work*.
      *   *Nuance:* I need to make sure I don't imply *she* was brain dead. She died a natural cardiac death. The eulogy should reflect her *views* on the criteria, not apply them controversially to her own passing.
      *   *Key Phrase:* "Useful legal fiction." I should use this or something very close to it, as the colleagues will look for it.
      *   *Key Concept:* "Integrated organism."

  6.  **Drafting - Tone Check:**
      *   *Too Cold:* "My grandmother ceased to function as an integrated whole." (Avoid this).
      *   *Too Warm/Traditional:* "She is now at peace watching us." (Violates her instructions).
      *   *Just Right:* "She taught us that honesty about the end is the only way to honor the middle."

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe I should mention the argument I had with my friend.
      *   *Correction:* No. This is *her* eulogy. My argument is context for the user, not content for the speech. Bringing up my personal debate centers me, not her.
