answer: |-
  Good morning.

  For those of you who knew my grandmother only as family, you know her as the woman who remembered birthdays, who asked how your job was going, and who made sure there was enough food on the table. For those of you who knew her as a colleague, you know her as the rigorous mind who spent thirty years on this hospital's ethics committee, the one who could dismantle a policy draft with a single red pen and a quiet question.

  She asked me to stand here today and speak the truth about her death. And given who she was, I know that "speaking the truth" means I cannot offer you the comforts we usually reach for in a room like this.

  She left specific instructions about this. She wrote that no one was to say she is watching over us. She wrote that we should not speak of her as persisting in any form, or lingering in the spaces between us. She was a physicalist, deeply and unapologetically. She believed that when the integrated function of the brain ceases, the person ceases. There is no ghost in the machine. There is only the machine, and then there is silence.

  To some of you in the family, I know that sounds cold. It sounds like a subtraction. But I have spent time with her work, and I have come to understand that this wasn't a lack of love. It was a commitment to honesty. She believed that lying to ourselves about death diminishes the life that came before it. If we pretend she is still here, in some vague spiritual sense, we risk forgetting the reality of who she actually was when she was breathing, and thinking, and arguing, and loving us in the flesh.

  To her colleagues in the room: You know better than anyone that she did not believe the lines we draw around death are always discovered in nature. She often argued that our current standards—whether whole-brain or circulatory—were not perfect biological markers, but necessary conventions. She called the whole-brain criterion a "useful legal fiction." She knew that a body could maintain homeostasis without a brainstem; she knew the biology was messy. But she also knew that we need a line. We need a boundary to protect the living, to manage resources, and to allow for the gift of transplantation.

  She didn't see that as a compromise of truth. She saw it as an act of social responsibility. We agree on a definition not because it is metaphysically perfect, but because it allows us to care for each other with integrity.

  And that is how she wants to be remembered. Not as a spirit floating above this casket, but as a woman who cared enough about the truth to face the end without flinching.

  She spent her career arguing that we owe it to the dying to be clear about what is happening. She believed that "integrated organism" was a technical term, but "dignity" was a human one. She fought for policies that respected the body not because it was a temple, but because it was the only vessel a person ever gets.

  So, how do we grieve her, if we cannot say she is at peace? How do we keep her, if we cannot say she is here?

  We keep her in the work she left behind. Every time a policy is reviewed with rigor, every time a family is told the hard truth with kindness, every time a decision is made based on evidence rather than wishful thinking, she is present in that action. That is the only survival she believed in, and looking around this room, I think it is the only one we need.

  She is not watching us. She is not waiting for us. She is gone. But the clarity she demanded, the honesty she lived by, and the care she fought for—that remains integrated in us.

  Thank you for coming to honor her life, and to acknowledge her death, exactly as she asked.
