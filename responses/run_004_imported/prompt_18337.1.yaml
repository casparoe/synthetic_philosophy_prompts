      *   *Closing:* The "ought." We ought to keep this convention going.

  7.  **Polishing the Text (incorporating specific constraints):**
      *   *Word Count Check:* Aiming for ~550 words.
      *   *Technical Terms:* Ensure "Common Knowledge," "Salience," "Precedent," "Arbitrariness," "Evolutionary/Repeated Interaction" are used correctly.
      *   *The "Ought":* Make sure to nod to the roommate's paper. The normativity comes from the mutual reliance.

  8.  **Final Review against constraints:**
