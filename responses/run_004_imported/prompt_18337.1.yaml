      *(Refining the "Ought")*: The friend's paper argues Lewis explains the "ought." How? Because once the convention is established, you have a reason to follow it (to coordinate). In marriage, the "ought" is the commitment to maintain the equilibrium because the equilibrium is good.

      *Let's write.*

