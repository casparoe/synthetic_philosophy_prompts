answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have a very specific assignment tonight. [Bride] agreed to let me give this toast on one condition: that it be "properly Lewisian."

  Now, half of you are nodding, and the other half is wondering if David Lewis is a distant relative. To the family: David Lewis was a philosopher who asked how we manage to coordinate our lives without a contract. He argued that we do it through *conventions*.

  I know what you're thinking. "Convention" sounds stiff. And Lewis says conventions are *arbitrary*. That sounds worse. It sounds like he's saying this marriage is random. But in philosophy, "arbitrary" doesn't mean "meaningless." It means "not forced by nature." Gravity isn't arbitrary; you can't choose to ignore it. But driving on the right side of the road *is* arbitrary. We could have driven on the left. But because we all agree to drive on the right, we have an obligation to keep doing it. That is where the "ought" comes from.

  [Bride] actually wrote her term paper on this. She argued that Lewis explains why we *ought* to keep our promises, not just why we *do*. And looking at these two, I think she's right. Their marriage isn't a law of physics. It's a chosen equilibrium. It matters *because* it wasn't forced.

  Of course, maintaining an equilibrium is hard work. For those of you who know game theory, you know the real test of a relationship isn't the big decisions; it's solving the coordination problems without communication. You know the joke: A Schelling point is where you go when you're lost and can't call your friend. For most people, it's "the clock tower." For [Groom], based on his text history, the Schelling point is usually "the place with the fries." But today, the Schelling point is right here.

  And once they found that point, the real work began. This is where Brian Skyrms comes in. Skyrms showed us that norms aren't designed; they evolve. They are selected for through hundreds of small, repeated interactions. Think about the private rules of this house. Who does the dishes? Which side of the bed is whose? That nickname nobody else is allowed to use? None of that was negotiated in a contract. It evolved. It was selected because it worked for them. It's a signaling system that grew out of repeated play, a language only they speak.

  But what makes it stable is *common knowledge*. It's not enough that [Groom] loves [Bride]. It's that he loves her, and she knows he loves her, and he knows that she knows, and on and on. That infinite recursion is the glue. It turns a private feeling into a public fact.

  So, to the couple: You have built a convention that is robust, salient, and deeply preferred. You have turned the arbitrary into the essential through the sheer weight of your precedent. You have solved the coordination problem, not by signing a treaty, but by showing up, again and again, until the pattern became a promise.

  May your equilibrium always be stable, may your signals never cross, and may you always know, with common knowledge, that you are on the same side of the road.

  Cheers.
