answer: |-
  # The Ontology of the Residual Stream: A Case for Functional Realism

  The cocktail party debate you describe is the central metaphysical crisis of modern mechanistic interpretability. On one side stands the **Realist**, modeled on the neuroscientist: when we find a "Golden Gate Bridge" direction in an SAE (Sparse Autoencoder) or a "board state" subspace in Othello-GPT, we have uncovered a causal structure that exists independently of our observation, much like a grid cell in the entorhinal cortex. On the other side stands the **Instrumentalist**, channeling Daniel Dennett: "representation" is a gloss we apply via the Intentional Stance. It is a predictive tool, useful for steering behavior, but there is no fact of the matter about whether the network *really* contains the concept of a bridge, only that treating it as such yields accurate predictions.

  This is not merely academic. If representations are fictions, alignment via activation steering is a fragile hack, prone to breaking when the context shifts. If they are real, steering is surgery.

  To resolve this, we must navigate the specific technical complications you raised: superposition, probe expressiveness, and causal abstraction. I will argue that the Instrumentalist is right about the *semantics* but wrong about the *structure*. My verdict is **Robust Functional Realism**: representations are real causal joints in the network's computation, but their reality is graded by their robustness to intervention and their independence from the observer's basis choice.

  ### The Case for Instrumentalism: The Dennettian Trap

  The strongest argument for the Instrumentalist view rests on the **arbitrariness of the basis**. In a standard neural network, features are superimposed. A single neuron might fire for "dog," "furry," and "positive sentiment." If the fundamental unit of the network (the neuron) is polysemantic, then claiming the network "represents" any one of those concepts is a choice made by the interpreter, not the network.

  Furthermore, the **probe expressiveness problem** is damning. As you noted, a sufficiently expressive non-linear probe can decode almost any property from a residual stream, including properties the model does not use for downstream computation. If I can train a probe to find "the political affiliation of the author" in the residual stream of a model doing arithmetic, have I found a representation? The Instrumentalist says no; I have merely found a correlation that allows *me* to predict the data, not a variable the model uses to predict the next token.

  Finally, consider **Causal Abstraction**. Methods like Distributed Alignment Search (DAS) require the researcher to specify *which* variables to swap. If I decide to intervene on "subject-verb agreement," I find a circuit. If I decide to intervene on "third-letter-of-the-subject," I might find a different one. The causal structure is only visible relative to the abstraction I imposed. This suggests the representation is in the eye of the beholder, a convenient compression of the true, messy matrix multiplications.

  From this view, saying "Claude represents the Golden Gate Bridge" is like saying a thermostat "believes" it is cold. It's a useful shorthand for a feedback loop, but positing an internal ontology of "temperature belief" is category error.

  ### The Case for Realism: The Neuroscientist's Defense

  The Realist counters that **predictive leverage implies causal structure**. The Intentional Stance works for thermostats, but it works *too well* for LLMs. When Anthropic finds an SAE feature for the Golden Gate Bridge, they aren't just correlating activation with text; they are showing that this direction *reconstructs* the feature and that intervening on it *changes* the model's behavior regarding bridges specifically, without breaking unrelated capabilities.

  The **Linear Representation Hypothesis** is the Realist's strongest evidence. In Othello-GPT, the board state is linearly decodable. Crucially, it is linearly decodable *in a specific basis* ("my color" vs. "their color") that aligns with the game's logic, not an arbitrary one. If representations were purely instrumental, we would expect the information to be encrypted in non-linear tangles that require specific probe keys to unlock. Instead, the network pays a computational premium to keep this information linearly accessible in the residual stream. It does this because downstream layers need to access it efficiently. The linearity is a signature of *use*, not just correlation.

  Regarding **Superposition**: Realists argue this is an implementation detail, not an ontological defeat. Superposition is lossy compression. Just because 100 features are squeezed into 10 dimensions doesn't mean the features don't exist; it means they are multiplexed. SAEs work precisely because they recover the "natural basis" of the data better than the native neuron basis. The fact that an unsupervised algorithm (the SAE) converges on semantically meaningful features suggests those features are attractors in the loss landscape, not arbitrary human projections.

  ### Engaging the Complications

  To take a stand, we must address why the Instrumentalist's technical objections don't kill Realism.

  **1. Superposition and Polysemanticity:**
  The Instrumentalist claims superposition makes features arbitrary. The Realist response is that superposition is *structured*. It isn't noise; it's interference patterns. If features were truly smeared arbitrarily, SAEs would not consistently recover monosemantic features across different seeds and model sizes. The fact that distinct SAE features emerge for "Golden Gate" vs. "Brooklyn Bridge" implies the model maintains a distinction in its causal topology, even if that distinction is distributed. The representation is not in the neuron; it is in the *subspace*.

  **2. Probe Expressiveness:**
  The probe argument conflates *information presence* with *representational status*. A non-linear probe finding "political affiliation" is数据挖掘 (data mining); a linear probe finding "board state" is interpretability. The constraint of **linearity** is the filter. If the network makes a variable linearly available to its own future layers, it is treating that variable as a primitive for computation. That is the definition of a representation in a computational system. We should restrict our ontological commitment to variables that are linearly accessible to the model's own downstream heads.

  **3. Causal Abstraction:**
  It is true that DAS requires choosing variables. However, not all abstractions survive the **intervention test**. If I intervene on "subject-verb agreement," the model behaves coherently. If I intervene on "third-letter-of-subject," the model likely collapses into gibberish because that variable isn't a causal node in the network's actual algorithm. The "real" representations are the ones that support *robust causal interventions* across multiple contexts. The abstraction isn't arbitrary if only a tiny subset of possible abstractions yield stable causal models.

  ### The Verdict: Robust Functional Realism

  I side with the **Realist**, but with a crucial qualification: **Representation is a Relational Property of Causal Leverage.**

  A representation is "real" if it satisfies three conditions:
  1.  **Reconstructability:** It can be decoded (preferably linearly) from the activation space.
  2.  **Causal Leverage:** Intervening on it changes downstream behavior in a semantically consistent way.
  3.  **Basis Independence:** It emerges across different interpretability methods (e.g., both SAEs and probing) without being tuned to a specific human prior.

  Under this definition, the Instrumentalist is wrong to claim representations are *mere* fictions. They are not like "constellations" (arbitrary lines drawn between stars). They are more like "river systems." The boundaries of a river are fuzzy, and the water mixes with the banks, but the flow is a real physical phenomenon that constrains where boats can go.

  **Why the Verdict Changes by Granularity**

  This is where the "it depends" instinct contains a truth, but for the wrong reasons. It's not that reality is subjective; it's that **reality is scale-dependent.**

  *   **Single Neurons:** **Mostly Fiction.** Due to polysemanticity, claiming a single neuron "represents" a concept is usually false. It is a mixture of features. Treating it as a representation is an Instrumentalist shortcut that often fails under causal intervention.
  *   **SAE Feature Directions:** **Highly Real.** These satisfy the three conditions above. They are monosemantic, causally leveragable, and emerge unsupervised. When Anthropic says they "found" the Golden Gate feature, they are correct. They discovered a causal joint.
  *   **Whole Circuits:** **Real but Complex.** A circuit (e.g., an induction head) is a real algorithmic structure. However, its "representation" is dynamic. It represents a *relationship* (copy previous token) rather than a static entity.

  ### Conclusion: From Intentional to Design Stance

  Dennett's Intentional Stance was developed for systems too complex to model physically (like humans). We treat them as agents because we have to. But mechanistic interpretability is the transition from the Intentional Stance to the **Design Stance**. We are opening the hood.

  When we find a linear subspace that encodes board state, we are not projecting agency onto a black box. We are reverse-engineering the data structure the engineers (gradient descent) built. Gradient descent is a blind optimizer, but it is an optimizer. It builds structures that work. If a linear representation of "my color" works better for winning Othello than a non-linear one, the network will build it.

  Therefore, the representation is **discovered, not invented**. It is a fact about the network's causal topology. The fact that superposition makes it hard to find doesn't make it unreal; it just means the memory layout is compressed. The fact that probes can overfit doesn't mean all findings are artifacts; it means we must demand linearity and causal validation.

  Your friend the Dennettian is right that "meaning" is in the eye of the beholder. But the **vehicle** of that meaning—the specific vector direction in the residual stream that, when nudged, makes the model talk about bridges—is a physical fact. We are not just telling stories about the model. We are mapping its nervous system. And in science, if you can stimulate a nerve and make a muscle twitch, you have found something real.
