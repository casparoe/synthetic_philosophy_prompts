answer: |-
  **Setting:** *A university courtyard. One thousand students are lined up in single file, strictly ordered by height. Person #1 is 4'10". Person #1000 is 7'2". The difference between each adjacent person is imperceptible, perhaps a fraction of a millimeter.*

  **Characters:**
  *   **Elias:** An Epistemicist (following Timothy Williamson).
  *   **Sophia:** A Supervaluationist (following Kit Fine).

  ***

  **Elias:** *(Gesturing down the line)* Look at them, Sophia. A perfect Sorites series. We agree on the ends. #1 is definitely not tall. #1000 is definitely tall. We agree that if #500 isn't tall, adding a fraction of a millimeter doesn't make #501 tall. But we disagree on what happens in the middle.

  **Sophia:** We do. I see a fuzzy region in the middle where the word "tall" simply fails to grip. For those people, the sentence "This person is tall" is neither true nor false.

  **Elias:** And that is where you lose me. Classical logic demands bivalence. Every statement of the form "Person *n* is tall" is either true or false. There is a specific number *k* in this line such that Person *k* is not tall, and Person *k+1* is tall.

  **Sophia:** *(Laughs softly)* There it is. The magic number. Elias, look at Person #542 and Person #543. They are wearing the same shoes. Their posture is identical. The difference in height is less than the thickness of a hair. You are claiming that based on nothing more than how we casually use the word "tall" at parties or in descriptions, the universe has fixed a fact of the matter that distinguishes these two?

  **Elias:** I am claiming that the meaning of "tall" determines an extension, just as the meaning of "water" determines H₂O.

  **Sophia:** But "water" is a natural kind. "Tall" is a predicate we made up. How does our loose, messy usage fix a boundary precise to the micron? It seems metaphysically magical. You're saying there is a fact of the matter, but it's causally disconnected from our ability to detect it. That sounds less like semantics and more like a hidden variable theory for linguistics.

  **Elias:** It's not magic; it's complexity. Think of usage not as a rulebook, but as a training signal for a neural network. Our collective use of the word "tall" constrains the reference, but it doesn't constrain it to a single, neat box. It constrains it to a region. Within that region, the exact boundary is fixed by micro-factors we aren't aware of—subtle patterns in how we correct each other, environmental context, even the physiological limits of our vision.

  **Sophia:** So you're saying the boundary exists, but it's sensitive to factors we can't track?

  **Elias:** Exactly. And that explains the ignorance. We cannot know where the cutoff is because knowledge requires safety. To know a proposition, you couldn't easily have been wrong. But with vague predicates, any method we use to judge the cutoff is subject to a "margin for error." If you judge #543 is the first tall person, you're relying on perceptual or cognitive states that are indistinguishable from those you'd have looking at #542. Since you can't distinguish them, you can't know you've hit the boundary. The fact exists, but it is unknowable in principle.

  **Sophia:** That's a clever way to save classical logic, Elias, but it comes at a steep price. You're asking me to believe that "tall" behaves like a mathematical function, even though our usage gives us zero evidence for that precision. You're positing a sharp cut to save the Law of Excluded Middle, but you've made the truth of "Person 543 is tall" utterly arbitrary. If the boundary is fixed by micro-factors of usage we can't access, then it's just luck whether #543 falls on the "true" side.

  **Elias:** It's not luck; it's determination. And I'd rather accept an unknowable cutoff than accept truth-value gaps. If you say "Person 543 is tall" is neither true nor false, you break logic. You can't say "Either Person 543 is tall or he isn't." That seems absurd.

  **Sophia:** I can say it, but I interpret it differently. "Either he is tall or he isn't" is supertrue—it's true on all admissible ways of making the language precise. But that doesn't mean one of the disjuncts *is* true. It just means the disjunction holds.

  **Elias:** *(Points to a student in the middle)* Let's talk about your "admissible ways." This is where your view crumbles. You say there's a range of "borderline" cases where "tall" doesn't apply. Let's call that the "borderline zone." Now, look at the transition from "definitely tall" to "borderline." Is *that* boundary sharp?

  **Sophia:** ...It is not.

  **Elias:** Aha! So there is a second-order vagueness. There are cases that are "borderline tall," and cases that are "borderline borderline tall."

  **Sophia:** I admit that.

  **Elias:** But then, Sophia, where does the "borderline" zone end? If you say there is no sharp cut between "tall" and "borderline," then you've just pushed the Sorites paradox back a step. You've replaced "tall" with "definitely tall." If "definitely tall" is also vague, then you need a third operator, "definitely definitely tall." Do you see the regress? If you deny a sharp cutoff anywhere, you end up with an infinite hierarchy of operators. But if you admit there is a sharp cutoff between "borderline" and "not borderline," then you are an epistemicist about the word "borderline." You've just hidden the sharp cut one level up.

  **Sophia:** *(Pauses, watching a student shift their weight)* That is the standard objection, Elias. Higher-order vagueness. But you're assuming that to model vagueness, my semantic model itself must be vague in a way that creates a paradox. It doesn't.

  **Elias:** Explain.

  **Sophia:** When I talk about "admissible precisifications," I am building a mathematical model. In the model, the set of precisifications is precise. But the *application* of that model to the world acknowledges that the boundary of that set is not sharp.

  **Elias:** That sounds like you're saying, "The map is precise, but the territory is fuzzy." But if the territory is fuzzy, doesn't the map fail to describe it accurately?

  **Sophia:** No. Think of it this way. You demand a sharp line between the cases where "tall" is true and the cases where it is indeterminate. I say there isn't one. But that doesn't mean I need a sharp line between "indeterminate" and "false." The transition from true to false is smooth.

  **Elias:** Logic isn't smooth, Sophia. Truth values are discrete.

  **Sophia:** Truth values are discrete, but *truth conditions* can be vague. Here is my direct answer to your regress: I do not need to define the boundary of the "borderline" region to use the logic of supervaluationism. I only need to say that for any specific case in the middle, there are some admissible precisifications where "tall" is true, and some where it is false.

  **Elias:** But are *those* precisifications admissible? You see the problem? You're using "admissible" which is itself vague.

  **Sophia:** I am. And that's fine. The concept of "admissibility" is vague, just like "tall." But this doesn't generate a contradiction; it just generates a hierarchy. The difference between us is that you think this hierarchy must terminate in a sharp fact that we can't know. I think the hierarchy just fades out.

  **Elias:** Fades out into what?

  **Sophia:** Into silence. Look, Elias, your problem is that you think language must carve reality at the joints, even when the joints are smooth. You posit a hidden fact to preserve the Law of Excluded Middle. I preserve the intuition that there is no hidden fact by modifying how we apply truth.

  **Elias:** But if "admissible" is vague, then the statement "It is indeterminate whether Person 543 is tall" is itself vague. So is it *true* that it's indeterminate? Or is *that* indeterminate?

  **Sophia:** *(Smiles)* It might be indeterminate whether it's indeterminate. And that's okay. I don't need to know the exact boundary of the fog to know I'm standing in it. You, on the other hand, are insisting there is a clear line in the fog, you just refuse to tell me where it is because you claim it's invisible.

  **Elias:** I claim it's invisible because visibility requires discrimination, and discrimination requires a difference. There is no cognitive difference between #542 and #543. Therefore, no knowledge. But the fact remains. If I say "There is a tallest non-tall person," you say that's false. I say it's true, just unknowable. Which of us is more respectful of the logic we use to reason about the world?

  **Sophia:** And I ask: Which of us is more respectful of the language we actually speak? If I asked you, "Is #543 tall?" and you said, "Yes, but I can't know it," you sound insane. If you say, "It depends on how you draw the line, and no line is privileged," you sound like you understand English.

  **Elias:** I sound like I understand logic. You sound like you're comfortable with gaps in reality.

  **Sophia:** Not gaps in reality, Elias. Gaps in representation. The world doesn't come with labels. We apply them. Sometimes they stick, sometimes they don't. In the middle, they don't stick. You're trying to force them to stick by saying they're glued on by invisible glue.

  **Elias:** *(Turns back to the line)* Invisible glue is better than no glue. Without it, the whole structure of inference collapses. If "tall" has no extension, then "tall or not tall" loses its force.

  **Sophia:** It doesn't lose its force. It remains supertrue. But we stop pretending that "supertrue" means "corresponds to a sharp fact."

  **Elias:** Then we are at an impasse. I see a cliff hidden in the fog. You see a slope.

  **Sophia:** Precisely. And the tragedy is, looking at #543... *(She squints)* ...the fog looks awfully thick to me.

  **Elias:** And the cliff looks awfully steep. Shall we ask #543?

  **Sophia:** *(Laughs)* He'll just say, "I'm average height."

  **Elias:** Which proves my point. He doesn't know either.

  **Sophia:** Or it proves mine. There's nothing to know.

  *(They stand in silence for a moment, watching the line, the boundary between tall and not-tall remaining stubbornly invisible to both.)*
