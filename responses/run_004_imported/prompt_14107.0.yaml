      *   *Aristotle's View:* Akrasia is possible but involves a kind of ignorance (not knowing the particular premise at the moment of action).
      *   *Davidson's View:* "How is weakness of the will possible?" He argues against the Socratic view (that it's impossible) but highlights the logical tension in holding a conditional judgment ("All things considered, I ought to do X") and doing Y.
