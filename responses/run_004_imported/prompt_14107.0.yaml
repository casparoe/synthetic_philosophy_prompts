answer: |-
  This is a classic clash between **empirical psychology/economics** (you) and **analytic philosophy of action** (your friend).

  The short verdict: **You are both right, but you are answering different questions.**

  You have correctly identified the *mechanism* that describes the behavior. Your friend is correctly pointing out that the *conceptual puzzle* regarding rationality and agency remains unresolved by that mechanism.

  Here is the breakdown of why the dispute is still alive, and where the actual friction lies.

  ### 1. Your Point: The Mechanism (Behavioral Economics)
  You are absolutely right that **hyperbolic discounting** is the dominant scientific model for explaining *why* this happens.

  *   **The Model:** Standard economics assumes "exponential discounting" (we value the future consistently less than the present). Behavioral econ showed humans actually use "hyperbolic discounting" (we heavily discount the future generally, but as a reward gets immediate, its value spikes disproportionately).
  *   **The Solution:** This turns akrasia from a metaphysical mystery into a **preference reversal**. At 10:00 AM, you prefer dieting. At 10:00 PM, with the cake in front of you, your discount curve shifts, and you *actually* prefer the cake more than the diet.
  *   **The Win:** You win on **prediction and description**. If you want to build a model that predicts when people will break their diets, hyperbolic discounting is the tool. It dissolves the "magic" of the weakness.

  ### 2. Her Point: The Logic of Agency (Philosophy)
  Your friend is holding the line on the **philosophical definition** of akrasia, specifically the Donald Davidson formulation. The philosophical puzzle isn't "Why do preferences change?" It is: **"How can a rational agent act against their own *current* all-things-considered judgment?"**

  Here is why hyperbolic discounting doesn't fully satisfy the philosopher:

  **A. Diachronic vs. Synchronic**
  *   **Hyperbolic Discounting (Diachronic):** This explains how you change your mind over *time*. (Morning You vs. Night You).
  *   **The Akrasia Puzzle (Synchronic):** The puzzle is about the specific moment of action. At the exact moment you reach for the cake, do you *still* judge that you ought not to eat it?
      *   **If Yes:** How did your motor cortex fire? If you truly judge "All things considered, not eating is better," but you eat, your action contradicts your judgment. Hyperbolic discounting says, "Well, in that moment, eating *became* better." The philosopher replies: "Then it wasn't weakness of will; it was just a change of mind. True akrasia requires holding the judgment *while* violating it."
      *   **If No:** Then you didn't act against your judgment. You just changed your judgment. This leads back to Socrates/Aristotle, who argued that akrasia is actually a form of **ignorance**. (Aristotle thought the akratic person temporarily "loses" the knowledge that the act is bad due to passion).

  **B. The Structure of Rationality**
  Davidson's essay *"How is Weakness of the Will Possible?"* argues that there is a logical contradiction in holding a conditional judgment ("Given all my desires, X is best") and intentionally doing Y.
  *   Behavioral econ treats the brain as a battleground of competing utility functions.
  *   Philosophy treats the agent as a unified source of reasoning.
  *   If hyperbolic discounting is true, it suggests we aren't unified agents; we are a series of temporal selves fighting each other. That might solve the *causal* problem, but it creates a new *metaphysical* problem: **Who is the "I" that is weak?** Is it Morning You judging Night You? If so, is it really *weakness of will* or just **inter-personal conflict** between time-slices?

  ### 3. Where the Standoff Is
  The reason your friend wouldn't buy your argument is that **hyperbolic discounting redefines the terms of the puzzle rather than solving it.**

  *   **You say:** "There is no paradox. The math shows the value of the cake exceeded the value of the diet at T1."
  *   **She hears:** "You are changing the definition of 'better judgment' to mean 'whatever wins at the moment.'"

  If "better judgment" is just whatever motivation wins, then akrasia is impossible by definition (because you always do what you are most motivated to do). But our intuition tells us akrasia *is* possible—that we can be motivated to do X, judge Y is best, and still do X.

  Hyperbolic discounting explains the *motivation* spike, but it doesn't explain how the *judgment* ("I shouldn't") persists alongside the *action* ("I'm eating"). Neuroscience suggests the prefrontal cortex (judgment) is literally overridden by the limbic system (impulse). But philosophically, if the judgment is overridden, was it still held?

  ### The Verdict
  *   **You are right** that we don't need magic to explain the behavior. Behavioral econ provides the causal mechanism. The "mystery" of why the cake looks so good at 11 PM is solved.
  *   **She is right** that the *conceptual* problem of rational agency is not settled. We still don't have a consensus on how to reconcile "acting against one's better judgment" with a coherent theory of rational action. Is the person irrational? Are they two different people? Is the judgment actually suspended?

  **How to settle the bet:**
  Tell her: *"Okay, hyperbolic discounting solves the **causal** mystery of why the preference flips. But you're right, it doesn't solve the **logical** mystery of how I can hold a judgment as true while acting as if it's false. You win on philosophy; I win on psychology."*

  That's the accurate state of the field. The economists think they dissolved the problem; the philosophers think the economists changed the subject.
