      *   **CDT (Causal Decision Theory):** Uses causal probabilities (counterfactuals or causal independence). The act doesn't *cause* Death's location. $P(Death in Dam)$ is independent of Act. Expected utility depends on the prior probability of Death's location. Usually implies indifference if priors are 50/50, but crucially, it breaks the *evidential* link.
      *   **Ratifiability (Jeffrey):** A decision is ratifiable if, conditional on *making* that decision, it still has the highest expected utility. In Death in Damascus, if I decide to Stay, I infer Death is in Damascus, so I should have Gone. If I decide to Go, I infer Death is in Aleppo, so I should have Stayed. Neither is ratifiable.
      *   **Gibbard & Harper's Specific Contribution:** They argue CDT handles Newcomb better than EDT, but Death in Damascus poses a problem for *both* regarding stability/ratifiability.
