          *   Define Burge's Externalism (Social/Anti-Individualism). Focus on the *linguistic community*.
          *   Key Difference: Putnam needs a physical difference (H2O vs. XYZ). Burge needs a social difference (usage norms) even if physics is identical.
      *   **Part 2: Compatibility in the Novel:**
          *   Are they redundant? No. They attack individualism from different flanks.
