prompt: |-
  I've been working through David Lewis's papers on objective chance for a graduate reading group on the metaphysics of probability, and I keep getting stuck on the problem he dubs the "Big Bad Bug" in "Humean Supervenience Debugged." I follow the basic shape of the difficulty and of Lewis's own fix, but I'm not convinced the fix earns its keep, and I'd like to see the skeptical case made out rigorously rather than piece it together myself from secondary summaries.

  Here is the setup as I understand it. The Principal Principle says that your credence in a proposition A, conditional on learning that the objective chance of A is x together with any admissible evidence, should equal x, where admissible evidence is roughly evidence whose bearing on A runs entirely through its bearing on the chance of A (historical information up to the relevant time counts; "crystal ball" information about how things actually turn out does not). Lewis was also committed to Humean supervenience about chance: chances at a time must supervene on the pattern of occurrent, non-modal fact spread across the whole of history, including everything that happens afterward, since the true chances are whatever "best system" analysis delivers when fitted to the entire actual course of events, past and future. This has the awkward consequence that a chance hypothesis can assign positive chance to its own undermining: if a coin has an objective chance of one-half of landing heads on each of a long series of independent tosses, there is some small but positive chance, according to that very hypothesis, that the coin lands heads on every single toss in the series—a run that would make a quite different, and much less flattering, hypothesis the best system, and so would make the original hypothesis false. Lewis argued that this is not merely an uncomfortable coincidence but a genuine formal inconsistency in the original Principal Principle, and he responded by adopting the "New Principle," which he credits to Ned Hall and Michael Thau: instead of conditionalizing on the proposition that some target proposition has chance x, you conditionalize on a proposition that specifies the entire chance function of the world, and the value you defer to is that function's chance of A conditional on your admissible evidence, rather than its bare unconditional chance of A.

  Please argue for the position that this fix is philosophically inadequate: that whatever it does to restore formal consistency, the New Principle fails to preserve the rationale that made deference to chance compelling in the first place, so that the Big Bad Bug is best read as a real cost of combining Humean supervenience with any recognizable norm of chance-credence deference, rather than as a puzzle that has actually been laid to rest.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** David Lewis's "Big Bad Bug" (BBB) and his solution (the "New Principle" or NP) in the context of Humean Supervenience (HS) and the Principal Principle (PP).
      *   **Task:** Argue *against* the adequacy of the New Principle. Specifically, argue that while NP might fix formal consistency, it fails to preserve the *rationale* for chance-credence deference. The BBB should be seen as a real cost of combining HS with chance norms, not a solved puzzle.
      *   **Audience:** Graduate reading group on metaphysics of probability. The tone should be rigorous, philosophical, and engaged with the technical details without getting bogged down in excessive formalism unless necessary for the argument.
      *   **Key Constraint:** The user wants the *skeptical case* made out rigorously. They already understand the setup (PP, HS, BBB, NP).

  2.  **Deconstruct the Core Conflict:**
      *   **Humean Supervenience (HS):** Chances supervene on the total history of categorical facts (past, present, *and future*). The "Best System" analysis (BSA) determines chances.
      *   **Principal Principle (PP):** $Cr(A | Ch(A)=x \& E) = x$. (Roughly).
      *   **The Bug:** Under HS, a chance distribution $Ch$ assigns positive probability to futures $F$ that would make $Ch$ false (undermining futures). So $Ch(F) > 0$, but if $F$ occurs, $Ch$ is not the true chance function. Thus $Ch(Ch=F) = 0$ (roughly), leading to inconsistency in PP.
      *   **The Fix (New Principle - NP):** $Cr(A | T_w \& E) = Ch_t(A | T_w)$, where $T_w$ is the theory of chance governing the world. Or more simply, defer to the chance function's *conditional* probability given the theory of chance itself.
      *   **The Skeptical Charge:** NP saves consistency but kills the *normative force* or *explanatory power* of chance. It makes chance deference trivial, circular, or epistemically inaccessible.

  3.  **Brainstorming Arguments Against the New Principle:**
      *   *Argument 1: Epistemic Inaccessibility.* To use NP, I need to know $T_w$ (the true theory of chance). But $T_w$ depends on the future (HS). I don't know the future. So I can't use NP. PP was supposed to guide credence *now*. NP requires knowledge I can't have.
      *   *Argument 2: Triviality/Empty Deference.* NP says "Believe what the chance function says, *given that the chance function is true*." But the whole problem is we aren't sure the chance function is true because of undermining. NP effectively says "Conditional on the chance function not being undermined, believe it." This seems to beg the question. It removes the risk that made chance interesting.
      *   *Argument 3: Loss of Explanatory Role.* Chance was supposed to explain frequencies or guide belief *because* it was objective. If chance is just a summary of the mosaic (HS), and NP says we only trust it conditional on it being the best summary, the normativity evaporates. It becomes a tautology of the Best System.
      *   *Argument 4: The "Undermining" Intuition Remains.* Even if NP is consistent, the metaphysical picture is weird. The present chance depends on the future. NP papers over this by adjusting the credence norm, but it doesn't fix the metaphysical weirdness that motivated the bug in the first place. (Though the prompt asks specifically about the *fix's* inadequacy regarding the *norm*, not just the metaphysics).
      *   *Argument 5: Comparison to Non-Humean Views.* If Non-Humeans don't have the BBB, and their PP is simpler and more normative, HS+NP is a theoretical cost.

  4.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge Lewis's ingenuity but state the thesis: NP is a formal patch that sacrifices the normative substance of the PP. It renders chance-credence coordination trivial or epistemically idle.
      *   **Point 1: The Epistemic Access Problem.** The NP requires conditioning on $T_w$ (the true theory of chance). Under HS, $T_w$ is not knowable a priori or even empirically at time $t$ because it depends on the future. PP was a guide for finite agents; NP is a guide for God.
      *   **Point 2: The Triviality of Conditionalization.** NP tells us to match credence to $Ch(A | T_w)$. But since $T_w$ entails the non-occurrence of undermining futures, $Ch(A | T_w)$ effectively filters out the very possibilities that make HS chances "risky." It turns objective chance into a subjective conditional probability that guarantees its own truth.
      *   **Point 3: Erosion of Normative Force.** The PP was compelling because it linked *objective* modality to *subjective* rationality. If the "objective" chance is just a summary of the mosaic, and the norm only applies when we assume the summary is correct (which we can't know), the link is severed. We aren't deferring to *chance*; we are deferring to our *hypothesis* about chance.
      *   **Point 4: The "Debugging" is Merely Formal.** Lewis solved the contradiction, but he didn't solve the tension. The tension is between the *temporal directionality* of chance (it guides future expectation) and the *atemporal supervenience* of HS. NP acknowledges this by conditioning on the whole theory, but that admits that chance *cannot* guide expectation in the way we thought it did without assuming the conclusion.
      *   **Conclusion:** The BBB is a symptom of a deeper incompatibility. NP treats the symptom but leaves the disease.

  5.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Check:* Did Lewis address the epistemic access worry? Yes, he distinguished knowing the *theory* of chance vs. knowing the *history*. He thought we could have high credence in a theory of chance.
      *   *Counter:* But under HS, having high credence in a theory of chance *just is* having high credence about the future mosaic. So $Cr(T_w)$ is not independent of $Cr(Future)$. This creates a circularity in the NP application.
      *   *Refinement on Triviality:* Is it trivial? $Ch(A | T_w)$ is not necessarily equal to $Ch(A)$. That's the point. But if $T_w$ is the proposition that "This function is the Best System," and the Best System depends on the future, then conditioning on $T_w$ is conditioning on a specific future occurring. So NP says: "Given that the future is such that this chance function is true, believe the probabilities." This is vacuous. It says "If the frequencies match the chances, believe the chances."
      *   *Key Distinction:* PP says "If Chance is X, believe X." NP says "If the Theory of Chance is T, believe what T says *given T*." Since T entails constraints on the future, this is "If the future is F-compatible, believe probabilities."

  6.  **Drafting the Response (incorporating technical terminology):**
      *   Use terms like *undermining futures*, *supervenience base*, *normative force*, *epistemic accessibility*, *tautological deference*.
      *   Reference the shift from $Ch(A)$ to $Ch(A | T_w)$.
      *   Highlight the difference between Humean and Non-Humean chance.
      *   Ensure the tone is appropriate for a graduate reading group (respectful but critical).

  7.  **Final Review against the Prompt:**
      *   Did I argue for the position that the fix is inadequate? Yes.
      *   Did I focus on the rationale for deference? Yes.
      *   Is it rigorous? I need to ensure the logical steps regarding $T_w$ and undermining are clear.
      *   Did I avoid simply summarizing? Yes, focus on the critique.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly mention that Lewis conceded the PP was false under HS. The NP is the replacement. The critique is that the replacement doesn't do the *job* of the original. The job was to connect objective modality to rational belief. If the "objective modality" is just a pattern in the data, and the connection requires assuming the pattern holds, the connection is weak.

  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between the *formal* success (no contradiction) and *philosophical* failure (loss of normativity) is the through-line. (Proceed to generate output).

  *(Note: I will structure the response as a formal philosophical argument suitable for a graduate context, breaking it down into distinct lines of critique.)*
answer: |-
  The following is a rigorous articulation of the skeptical case against Lewis's New Principle (NP). It is structured to serve as a discussion paper for your reading group, focusing on the claim that while NP resolves the formal inconsistency of the Big Bad Bug, it does so at the unacceptable cost of evacuating the normative and explanatory substance of objective chance.

  ***

  ### The Empty Deference: Why the New Principle Fails to Save Humean Chance

  David Lewis's adoption of the New Principle (NP) is widely acknowledged as a technical success. It successfully blocks the derivation of a contradiction from Humean Supervenience (HS) and the norms of rational credence. However, a formal patch is not a philosophical solution. The central charge against the NP is that it preserves the *letter* of chance-credence coordination while violating its *spirit*. By modifying the principle to accommodate the metaphysical peculiarities of Humean chance, Lewis renders the norm either epistemically inaccessible or trivially tautological.

  The skeptical case rests on three pillars: the **Epistemic Access Objection**, the **Triviality Objection**, and the **Loss of Normative Force**. Together, they suggest that the Big Bad Bug is not a bug to be debugged, but a symptom of a fatal incompatibility between Humean metaphysics and the role chance is supposed to play in our epistemology.

  #### 1. The Epistemic Access Objection
  The original Principal Principle (PP) was compelling because it offered a bridge between the objective world and the subjective agent. It told a finite agent, situated at time $t$ with limited historical knowledge $H_t$, how to set their credences. The admissibility clause was designed precisely to allow agents to use the PP without knowing the future.

  The NP, however, requires the agent to conditionalize on $T_w$, the proposition specifying the true theory of chance for the world $w$. Under HS, $T_w$ is not a local fact about the present or past; it is a global fact about the entire Humean mosaic, including the future. $T_w$ is true only if the candidate chance function actually provides the best systematization of the *whole* of history.

  Consequently, to apply the NP, an agent must have a credence distribution over propositions concerning the future totality of events. But this reverses the explanatory direction of chance. We were supposed to use chance to guide our expectations about the future. The NP implies we must first have expectations about the future (sufficient to assign credence to $T_w$) in order to know which chance function to defer to.

  Lewis might reply that we can have high credence in $T_w$ based on past frequencies. But under HS, having credence in $T_w$ *just is* having credence that future frequencies will align with the best system. Thus, the NP instructs us: "Conditional on the future aligning with the chance function, believe the chance function." This renders chance epistemically idle. It cannot guide belief about the future because applying the guide requires already having beliefs about the future that validate the guide.

  #### 2. The Triviality Objection
  Even if we grant that agents can assign credences to $T_w$, the NP transforms chance deference into a triviality. The PP commanded:
  $$Cr(A \mid Ch(A) = x) = x$$
  This was substantive because $Ch(A)=x$ did not entail $A$ (or $\neg A$). There was a gap between chance and outcome that rational credence was meant to bridge.

  The NP commands:
  $$Cr(A \mid T_w) = Ch_t(A \mid T_w)$$
  Recall that under HS, $T_w$ entails that no "undermining future" occurs. If an undermining future occurred, $T_w$ would be false (since a different system would be best). Therefore, conditioning on $T_w$ effectively filters out all possible futures where the chance function fails to be the best system.

  When we calculate $Ch_t(A \mid T_w)$, we are calculating the chance of $A$ given that the chance function is indeed the true one. But since the truth of the chance function (under HS) depends on the pattern of outcomes, conditioning on $T_w$ is remarkably close to conditioning on the outcomes themselves being "well-behaved."

  In the limit, the NP tells us to match our credence to the chance function's own assessment of itself. But the chance function's assessment of itself, conditional on its own truth, is guaranteed to be coherent. The NP reduces to: "If you assume the chance hypothesis is true, believe what it says." This is not a norm of rationality; it is a constraint of logic. It strips chance of its modal "bite." The PP was interesting because it told us how to believe in the face of objective uncertainty. The NP tells us how to believe assuming the uncertainty resolves in the specific way that validates our chance hypothesis. It dissolves the tension between chance and truth rather than resolving it.

  #### 3. The Loss of Normative Force
  The deepest cost of the NP is the erosion of the normative link between objectivity and rationality. The intuition behind the PP is that objective chance is a *reason-giving* feature of the world. If the chance of rain is 70%, that fact itself provides a pro tanto reason to credence 0.7, independent of my evidence about weather patterns.

  Under HS, chances are not ontologically robust properties; they are summaries of the categorical mosaic. They supervene on the very events they are supposed to constrain. The Big Bad Bug arises because the summary (chance) assigns probability to events that would change the summary.

  Lewis's fix admits that we cannot defer to the *unconditional* chance, because the unconditional chance acknowledges the possibility of its own falsehood. We must defer to the *conditional* chance. But this admission concedes that Humean chances, *qua* Humean, do not possess the normative authority the PP attributed to them.

  If the norm of deference only holds conditional on the chance theory being true, then the normativity lies in the *theory*, not in the *chance*. We are not deferring to an objective modal feature of reality; we are deferring to a hypothesis about patterns in the data. This collapses the distinction between Humean chance and subjective probability derived from frequencies. If chance is just a summary of frequencies (past and future), and we only trust it when we assume the frequencies cooperate, then "objective chance" drops out of the picture as an explanatory posit. It becomes a redundant middleman between the mosaic and our credences.

  #### Conclusion: The Bug as a Feature
  The New Principle saves Humean Supervenience from formal contradiction, but it does so by retreating from the metaphysical ambitions that made the Principal Principle desirable. The PP presupposed that chance is a guide to truth even when the truth is unknown. The NP presupposes that chance is a guide to truth only when we condition on the truth being a certain way.

  For the Humean, this may be the best available option, but it should not be mistaken for a vindication of the original picture. The Big Bad Bug reveals that if chances supervene on the total history, they cannot function as the independent, normative guides the PP requires. The NP papers over this by adjusting the norm to fit the metaphysics, but in doing so, it admits that Humean chance lacks the autonomous normative force of non-Humean chance.

  Therefore, the Bug is not a puzzle that has been laid to rest. It is a standing cost of the Humean package. We must accept that on a Humean view, "objective chance" is a significantly deflated concept, one that cannot support the robust principle of credence deference that Lewis originally sought to formalize. The NP is a life-support system for a concept that the underlying metaphysics has effectively starved.
