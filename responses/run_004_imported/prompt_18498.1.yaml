answer: |-
  This is a fantastic debate to have, and you have put your finger on the exact pressure point that makes the "Argument from Vagueness" (often associated with David Lewis and Theodore Sider) so powerful.

  Your friend is relying on **semantic vagueness** (vagueness in our language), while the Argument from Vagueness claims that moderate composition implies **ontic vagueness** (vagueness in reality itself).

  Here is an intuitive breakdown of why the argument is supposed to be fatal for moderate views, and how it applies to van Inwagen's own position.

  ### 1. The Distinction: Vague Words vs. Vague Existence

  To understand why "bald" is different from "composite object," we have to distinguish between a vague *description* and a vague *existence*.

  **The "Bald" Case (Semantic Vagueness):**
  Imagine a man with 5,000 hairs. Is he bald? It's indeterminate. But notice what is *not* indeterminate: the number of hairs on his head, and the number of people in the room. The vagueness is entirely about whether we should apply the *label* "bald" to him. The world itself is precise; our vocabulary is just too coarse to carve it up perfectly. Nobody thinks there is a "fuzzy person" standing there.

  **The "Bicycle" Case (Ontic Vagueness):**
  Now imagine your bicycle parts. They are loosely touching. You tighten the bolts one millimeter. Then another. At some point, your friend says, "Now it's a bicycle." The moderate says there is a gray area where it's indeterminate whether the parts compose a whole.

  If composition is indeterminate, then **existence** is indeterminate.
  *   **Scenario A (No Composition):** There are 100 objects in the room (the parts).
  *   **Scenario B (Composition):** There are 101 objects in the room (the parts + the bicycle).

  If the moderate is right, there is a middle scenario where it is *neither true nor false* that the bicycle exists. This means it is *neither true nor false* that there are 101 objects in the room.

  **The Fatal Intuition:**
  The Argument from Vagueness asks: **Can the number of objects in a room be vague?**
  With "bald," the count of people is never vague. But with composition, if the moderate view is true, the *count of objects* becomes vague. Lewis and Sider argue that this is metaphysically impossible. Reality doesn't do "sort of." An object either exists or it doesn't. If a moderate view implies that the number of existing things can be indeterminate, the moderate view must be false.

  ### 2. Why Moderates Can't Just Say "It's Linguistic"

  Your friend might object: "Why can't we just say 'bicycle' is vague like 'bald'? The atoms are there, we just argue about the label."

  The problem is that for the moderate, the existence of the *whole* depends on the *arrangement* of the parts.
  *   **Universalist:** The whole exists regardless of arrangement (always 101 objects).
  *   **Nihilist:** The whole never exists (always 100 objects).
  *   **Moderate:** The whole exists *only if* the parts are arranged specifically (fastened, bonded, etc.).

  But "fastened" is a spectrum. Glue is wet, then tacky, then hard. Welding melts metal, then cools. If the *condition* for existence is vague (fastening), then the *fact of existence* is vague.

  If you say, "It's just vague language," you are effectively admitting that there is no object there, only parts that we sometimes *call* a bicycle. But that pushes you toward **Nihilism** (there are no bicycles, only atoms arranged bicycle-wise). The moderate wants to say the bicycle *really exists*, but not when the parts are in a pile. The Argument from Vagueness says you can't have it both ways: you can't have real existence that fades in and out like a radio signal.

  ### 3. Does Van Inwagen Escape? (The "Life" Criterion)

  This is the second part of your question, and it is equally thorny. Van Inwagen proposes that composition occurs only when the activity of the parts constitutes a **life**.

  **Does this avoid vagueness?**
  Most philosophers argue **no**. It simply relocates the vagueness from "fastening" to "life."
  *   Is a virus alive?
  *   Is a seed in dormancy alive?
  *   At exactly what millisecond does death occur?

  If "life" has borderline cases, then "existence of an organism" has borderline cases. If it is indeterminate whether a virus is alive, it is indeterminate whether a virus *exists* (as an object over and above its particles). This means the *number of objects* in a petri dish is indeterminate. Van Inwagen falls prey to the same counting problem.

  **Van Inwagen's Defense:**
  Van Inwagen is aware of this. In *Material Beings*, he essentially bites the bullet. His strategy is twofold:
  1.  **Natural Joints:** He argues that "life" is a *natural* phenomenon, whereas "fastening" is artificial. The vagueness in "life" is a feature of biological reality, not just human classification. He is more willing to accept ontic vagueness here because he thinks biological processes are the only non-arbitrary cutoff in the universe.
  2.  **Epistemicism:** He sometimes suggests that there *is* a precise moment life begins/ends, even if we cannot know it (similar to how there is a precise number of hairs that makes one bald, even if we can't count it).

  However, critics (like Lewis and Sider) remain unmoved. They argue that even if "life" is a natural joint, if there is *any* vagueness in when life begins, there is vagueness in existence. Therefore, Van Inwagen's view is technically vulnerable to the Argument from Vagueness, just like any other moderate view. He accepts this cost because he thinks Universalism (there is a "trout-turkey" object made of a trout and a turkey) and Nihilism (there are no bicycles) are even *more* absurd.

  ### Summary for Your Friend

  To bring this back to your evening argument:

  1.  **The Stakes:** Tell your friend that accepting a moderate view isn't just about saying "bicycle" is a fuzzy word. It implies that **reality itself** is fuzzy about how many things exist.
  2.  **The Counting Test:** Ask him: "If the bolts are half-tightened, exactly how many objects are on the workbench?" If he says, "It's indeterminate," press him on whether reality can really be indeterminate about numbers.
  3.  **The Van Inwagen Twist:** Tell him that even the philosopher who invented the most famous moderate answer (Van Inwagen) couldn't fully escape this. He just moved the fuzzy line from "bolts" to "life."

  **The Verdict:** The Argument from Vagueness suggests that if you want metaphysical precision (no fuzzy existence), you must be a Universalist or a Nihilist. If you want to keep ordinary intuition (bicycles exist, trout-turkeys don't), you must accept that existence itself can be a vague matter. Your friend is choosing common sense; you are choosing metaphysical consistency. The argument shows they are incompatible.
