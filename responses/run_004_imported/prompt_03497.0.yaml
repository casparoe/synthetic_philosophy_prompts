answer: |-
  This is one of the most famous and difficult arguments in moral philosophy. Hume is attempting to dismantle the idea that there is a "natural" duty to keep promises. He wants to show that promising is an *artificial* invention of society, not a pre-existing moral fact.

  Here is a reconstruction of the argument, an explanation of the "absurdity," and an assessment of its strength.

  ---

  ### 1. The Process of Elimination: What Mental Act Creates a Promise?

  Hume begins with a specific assumption: For a promise to create a duty *naturally* (without social rules), there must be a specific **act of the mind** that happens when you say "I promise." He treats this like a detective looking for a culprit. He lists the usual suspects (resolution, desire, willing an action) and eliminates them one by one.

  **Suspect 1: A Resolution**
  *   **The Idea:** When I promise, maybe I am just resolving to do something.
  *   **Hume's Rejection:** A resolution is internal. If I resolve to quit smoking but tell no one, I have not obligated myself to anyone else. I might feel bad if I fail, but no one else has a right to complain. A promise, by definition, creates an obligation *to another person*. Since a mere resolution never creates an obligation to others, the mental act of promising cannot be a resolution.

  **Suspect 2: A Desire**
  *   **The Idea:** Maybe promising means I *want* to do the thing.
  *   **Hume's Rejection:** Psychology contradicts this. I can promise to do something I absolutely hate doing (e.g., repaying a loan to a miser I despise). I may have an "aversion" to the act, yet the obligation remains. Since I can be bound without desire, the mental act cannot be a desire.

  **Suspect 3: Willing the Action**
  *   **The Idea:** Maybe promising is simply *willing* the future action to happen.
  *   **Hume's Rejection:** This is a metaphysical point about time and power. The human will only has direct influence over *present* actions (moving my hand now). I cannot directly will a *future* action. I can only will to set up conditions now that might lead to that action later. Since a promise always regards the *future*, and the will only governs the *present*, I cannot literally "will" the future performance at the moment of promising.

  **The Conclusion of the Elimination:**
  If the mental act is not a resolution, not a desire, and not a willing of the action, what is left? Hume argues there is only one option remaining. When I promise, I must be **willing the obligation itself.**

  In other words, I am not just saying "I will do X." I am saying, "I hereby create a bond that makes me liable if I do not do X." Hume notes this matches common language: we say we are "bound by our own consent." We think we are using our will to create a duty.

  ---

  ### 2. The "Manifest Absurdity": Why You Cannot Will an Obligation

  This is the crux of the second paragraph. Hume has concluded that the mental act of promising must be "willing an obligation." Now he argues that this is impossible. To understand why, you have to understand Hume's moral theory (Moral Sentimentalism).

  **Premise A: What is an Obligation?**
  For Hume, morality is not a set of abstract laws written in the stars. Morality depends on **sentiments** (feelings).
  *   When we call something "virtuous," we mean it gives us a specific feeling of approval (pleasure).
  *   When we say we are "obligated," we mean that failing to do the act would cause a specific feeling of disapproval (pain/blame) in ourselves or observers.
  *   Therefore, **to create a new obligation is to create a new sentiment.**

  **Premise B: The Limits of the Will**
  Hume argues that human beings cannot change their sentiments by a bare act of will.
  *   I cannot make myself feel hungry just by willing it.
  *   I cannot make myself feel pain just by saying "I will feel pain."
  *   Sentiments arise from our nature, our sympathies, and the consequences of actions, not from a command.

  **The Absurdity:**
  If "obligation" is a sentiment (a feeling of blame/approval), and I cannot create sentiments just by willing them, then **I cannot create an obligation just by willing it.**

  Hume says it is a "manifest absurdity" to think that by simply saying "I promise," I can magically generate a new moral feeling that didn't exist before. It would be like trying to change the motions of the heavens by nodding your head.

  **The Result:**
  Since the only possible mental act that could constitute a promise (willing the obligation) is psychologically impossible, there is **no act of the mind** that belongs to a promise. Therefore, prior to social rules, a promise is "naturally something altogether unintelligible." It's a noise without a mental state to back it up.

  ---

  ### 3. Assessment: Does the Argument Earn Its Conclusion?

  This is a powerful argument, but whether it succeeds depends entirely on whether you accept Hume's underlying framework. Here is an assessment of its strengths and vulnerabilities.

  **Where the Argument Succeeds:**
  1.  **Exposing the "Magic" of Promising:** Hume successfully highlights that there is something weird about the idea that saying magic words changes the moral universe. If promises were natural, how does the vibration of my vocal cords create a metaphysical bond? Hume forces us to admit that the "bond" isn't a physical or psychological fact inherent in the individual.
  2.  **The Social Nature of Language:** Hume anticipates modern philosophy of language (like J.L. Austin or John Searle). He is essentially arguing that "I promise" is not a description of a mental state (like "I am hungry"); it is a **performative utterance** that only works within a system of conventions. Just as moving a wooden piece two squares forward only counts as a "chess move" because of the rules of chess, "promising" only works because of the rules of society.
  3.  **Psychological Realism:** His elimination of desire and resolution is psychologically astute. We often keep promises we regret making, which proves the obligation is distinct from our current desires.

  **Where the Argument is Vulnerable:**
  1.  **The Sentimentalist Premise (The Kantian Objection):** The entire argument rests on Paragraph 2, Premise A: *"All morality depends upon our sentiments."*
      *   A rationalist (like Kant) would reject this. Kant argues that moral obligation comes from **Reason**, not sentiment. For a Kantian, I *can* bind myself by will, because the will is rational. If I rationally consent to a law, I am bound by it, regardless of how I *feel*.
      *   If you believe morality is objective or rational, Hume's claim that "we cannot change our sentiments by will" is irrelevant. You aren't trying to change a feeling; you are aligning your will with a rational law.
  2.  **The Definition of "Will":** Hume treats the will as a momentary impulse that moves limbs. But many philosophers argue the will is also a capacity for **commitment**. To "will an obligation" might not mean "create a feeling of pain," but rather "restrict my future freedom." Hume assumes the will cannot bind the future will, but one could argue that the very point of agency is the ability to constrain one's future self (e.g., Ulysses tying himself to the mast).
  3.  **Circularity:** Some critics argue Hume stacks the deck. He defines "natural obligation" in a way that makes it impossible to fulfill, then concludes promises aren't natural. He assumes that for a promise to be natural, it must create a duty *in isolation*. But one could argue that humans are naturally social animals; therefore, a social act like promising *is* natural to us, even if it requires a community.

  **Verdict:**
  Hume's argument is **valid** (the logic holds together), but its **soundness** depends on your moral theory.
  *   **If you are a Moral Sentimentalist:** The argument is devastating. It proves promises cannot be natural duties and must be social inventions (conventions).
  *   **If you are a Moral Rationalist:** The argument fails at the second step. You can reject the idea that obligation is merely a sentiment.

  **The "So What?"**
  Even if you reject Hume's sentimentalism, his conclusion remains influential. Most modern philosophers agree with Hume that promising is an **institutional fact**. It relies on a social practice. Hume's genius was showing that the "obligation" doesn't come from the *words* or the *mind* of the promiser alone, but from the **convention** that gives those words meaning.

  He isn't saying promises don't bind us. He is saying they bind us because we have collectively built a system where breaking them causes social harm and distrust, not because the universe magically zaps us with duty when we speak.

  ### Summary for your notes:
  1.  **Elimination:** Promise $\neq$ Resolution (internal), $\neq$ Desire (can hate the act), $\neq$ Willing Action (future vs. present). Therefore, Promise = Willing Obligation.
  2.  **Absurdity:** Obligation = Sentiment (feeling). Will cannot create Sentiment. Therefore, Will cannot create Obligation.
  3.  **Assessment:** The argument works if morality is based on feelings (Sentimentalism). It fails if morality is based on Reason (Rationalism). However, its insight that promising requires a social convention is widely accepted today.
