answer: |-
  Good evening, everyone. For those of you who don't know me, I'm one of the many engineers who had the privilege of sitting in a room with Priya and arguing about infrastructure for far too many years.

  We are here to celebrate fourteen years of Priya's career at the company. But mostly, we are here to celebrate that she is finally leaving to go get her PhD, which, let's be honest, is just a formal way of saying she's going to go find a new group of people to correct on their methodology. And we love her for it.

  Now, Priya gave me specific instructions for this toast. She said, "Please, nobody explain the theory. I tried once at an offsite and lost the room in under two minutes."

  So, I promise I am not going to explain the theory. I am not going to talk about judgment aggregation, or logical consistency, or why voting on premises is different than voting on conclusions. I am going to leave that for her thesis.

  Instead, I want to talk about what that rule *felt* like.

  For those of you who sat on the Architecture Review Board, you know the rule. We were never allowed to just vote "Yes" or "No" on a proposal. We couldn't poll the room's gut feeling. Priya made us break everything down. We had to vote on the migration plan separately. We had to vote on the on-call burden separately. Backwards compatibility. Security implications. We had to vote on the pieces, and only then were we allowed to derive the answer.

  For years, honestly? It drove us crazy. It felt like bureaucracy. It felt like slow. We'd look at a proposal and think, "We all know this is a go, why do we have to fill out the scorecard?"

  We thought she was obsessed with process. But then came the Sharding Proposal of 2019.

  Some of you remember the Tuesday. We were in the big conference room. We went through the criteria. We voted on the migration plan: Majority approved. We voted on the risk assessment: Majority approved. We voted on the resource allocation: Majority approved. By every single metric we had written down, the project was a green light.

  So Priya asked for the final vote on the proposal itself. And the room voted "No."

  I remember the silence. It was heavy. There were about fifteen of us staring at the whiteboard, doing the math in our heads, realizing that the sum of our parts did not equal our whole. We had collectively agreed that every reason to do the project was valid, but collectively agreed we shouldn't do the project. It was a glitch in human logic. The whiteboard looked like it was broken.

  Priya didn't gloat. She didn't say "I told you so." She just erased the final vote column and said, "This is exactly why we vote issue by issue," and we moved on. We avoided a disaster that none of us could have articulated until the process forced us to.

  That is what I want to toast to tonight.

  To the outside observer, that story sounds like a meeting about software. But to us, it was a lesson in integrity. Priya understood that gut feelings are often just biases wearing a suit. She understood that if you don't interrogate the *why*, the *what* will eventually collapse under its own weight.

  She protected us from our own blind spots. She protected the company from decisions that felt right but weren't consistent. She spent fourteen years being the person in the room who was willing to be the annoying one, the slow one, the stubborn one, because she knew that "fast and wrong" is infinitely more expensive than "slow and right."

  And looking around the room tonight, I see that this isn't just how she works. It's who she is.

  To her partner and her kids: You probably know this version of her best. You know that she doesn't do things by half-measures. You know that if she commits to a plan, she has already vetted the migration path, the on-call burden, and the backwards compatibility of that commitment. She is the most consistent person I know. The same rigor she applied to a whiteboard in 2019 is the rigor she applies to her friendships, her family, and now, her education.

  Priya, you taught us that consistency is a form of care. You taught us that paying attention to the details isn't pedantry; it's how you keep the whole thing from falling apart.

  We are going to miss you at the board. We are going to miss the person who stops us when we're about to vote "Yes" for the wrong reasons. But I am incredibly excited to see what you do when you turn that brilliant, stubborn, meticulous mind toward a PhD.

  So, if everyone could raise a glass.

  To Priya. May your premises always support your conclusions, may your migration plans be smooth, and may you never have to explain the doctrinal paradox to a room full of tired engineers again.

  Cheers.
