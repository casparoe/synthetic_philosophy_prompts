      *   **Hypocrisy vs. Reform:** Is it hypocrisy to enforce a rule you once broke? Most ethical frameworks say no, provided you acknowledge the change (privately or publicly). If Maya claimed *never* to have made mistakes while accusing him, that's deception. If she simply enforced the norm, it's stewardship.
      *   **Moral Standing:** Does past sin revoke the right to enforce norms? Generally, no. Recovered addicts help other addicts. Reformed criminals work in justice reform. Experience with the violation can make one *more* vigilant, not less qualified.
      *   **The "Off" Feeling (Psychological Mechanism):** Why does the user feel uneasy?
