  While this is the standard behavioral economics label for the phenomenon, it is technically imprecise; in this specific game, the past bid is not "sunk" because it is only paid if you quit, making it a contingent liability rather than a unrecoverable cost. However, she correctly identifies the psychological driver of escalation of commitment, even if the game-theoretic mechanics are slightly more complex than a traditional sunk cost scenario.

