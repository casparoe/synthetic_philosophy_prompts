  Score: 2
  Theo is mathematically correct regarding the specific decision node; given the rules, bidding \$28 to potentially limit loss to \$8 is strictly dominant over quitting and locking in a \$26 loss, assuming the opponent might fold. This demonstrates that once the trap is sprung, the escalation is driven by rational loss-minimization rather than irrational attachment to past costs.

  **Move 3 (Nadia: Infinite Regress)**
  Score: 2
  Nadia successfully dismantles Theo's defense by showing that if "minimize immediate loss" is adopted as a universal strategy by both players, it guarantees mutual destruction with no equilibrium. This highlights the conflict between local rationality (best move now) and global rationality (best outcome overall), which is the core paradox of the game.

