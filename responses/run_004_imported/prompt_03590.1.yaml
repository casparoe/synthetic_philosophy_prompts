  Score: 2
  This is the only game-theoretically sound conclusion; via backward induction, rational players should anticipate the escalation trap and refuse to bid past \$20 (or bid at all) from the start. Theo correctly concedes that while his late-game moves were locally optimal, the strategic error was entering the subgame where those moves became necessary.

  **What They're Missing**
  Both Theo and Nadia are analyzing the auction as a strictly non-cooperative game, ignoring the potential for **collusion or pre-commitment**. The truly rational solution in a seminar setting isn't just backward induction, but coordination: the bidders could have agreed beforehand not to bid past \$1 and split the \$19 profit, or one could have made a credible pre-commitment to bid up to \$100 to scare the other off before the auction began. They are debating how to play a broken game, rather than how to fix the game itself.
