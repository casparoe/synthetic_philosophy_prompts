answer: |-
  **Elena:** Let's not get squeamish about the Shopkeeper. It's the cleanest cut we have. If he charges fairly *only* because cheating would ruin his reputation, he's prudent, not moral. He loves his bottom line, not the truth. Moral worth requires that the motive be the duty itself.

  **Marcus:** But that's exactly where Smith's "fetishism" charge sticks. You're saying the morally best agent is the one staring navel-gazingly at their own obligation. "I help you not because you're in pain, but because my maxim passes the universalizability test." It makes morality sound like a bizarre obsession with one's own purity rather than a concern for other people.

  **Elena:** That's a caricature. To act from duty isn't to ignore the suffering; it's to recognize that suffering makes a claim on you that *overrides* your inclinations. The Shopkeeper doesn't care about the claim; he cares about the consequence of ignoring it. The moral agent cares about the claim. That's not narcissism; it's respect for the rational law that binds us all.

  **Marcus:** Respect for the law is fine, but what if the law is inside out? Think about Arpaly's Huck Finn. Huck helps Jim escape. He's convinced he's committing a sin. He thinks he's stealing property. By your lights, he's acting against duty. Yet, he can't bring himself to betray his friend. He's responding to the *right-making feature*—Jim's humanity and their friendship—even though he labels it "wrong." Arpaly says Huck has more moral worth than a person who helps solely because they've calculated it's their duty.

  **Elena:** I'll bite the bullet, then. Huck's action is right. Huck himself is sympathetic. But does he have *moral worth* in the strict sense? No. He's acting on a contingent passion. What if he wakes up tomorrow and his sympathy fades? Or what if his culture convinces him harder? His will isn't grounded in the right place. He's lucky, not good.

  **Marcus:** "Lucky"? That's the worry I have with your view, but flipped. You're saying the person who helps out of genuine love for a friend has less moral worth than the cold calculator who helps only because the Categorical Imperative nods at them. That seems to penalize people for having healthy emotions.

  **Elena:** It doesn't penalize emotions; it just says emotions aren't the *measure* of moral worth. Emotions are weather. Duty is the compass. If you help only when you feel like it, you're a slave to your psychology. If you help because it's right, you're free.

  **Marcus:** But that leads to the "Lucky Bigot" problem on *my* side, which I know you're waiting to spring. If moral worth is just responding to right-making features, couldn't a terrible person accidentally rack up moral credit? Imagine a miser who helps a stranger just to show off his wealth. He's responding to the stranger's need, technically, but for a vile reason. On my view, does he get moral worth?

  **Elena:** Precisely. If you detach moral worth from the agent's conception of why they're acting, you make moral worth accidental. The miser helps, so he's good? That dissolves the link between character and action.

  **Marcus:** No, you're skipping a step. It's not about the single act; it's about the sensitivity to reasons. The miser isn't sensitive to the need *as a reason*; he's sensitive to the audience. But Huck *is* sensitive to Jim as a person. He's not showing off. He's responding to the concrete reality of Jim's plight, even if his moral vocabulary is corrupted by slavery. My point is that the *object* of his concern is what matters, not the internal slogan he chants while doing it.

  **Elena:** But without the slogan—without the concept of duty—how do you distinguish Huck's sensitivity from mere preference? Why is loving Jim morally worthy but loving his dog not, in this specific context of escape? You need a principle to tell you which features are *morally* relevant. Huck stumbled onto the right principle by accident of affection.

  **Marcus:** He didn't stumble. He learned what friendship was. That's a moral education, even if it didn't come in the form of maxims. Look, Elena, I'd rather trust the person who helps because they can't bear to see suffering, even if they can't articulate the Kantian ground for it, over the person who helps solely because they fear the contradiction in their will. The first person is safe. The second is one bad philosophical day away from nihilism.

  **Elena:** And I'd rather trust the person who helps because they recognize a binding obligation, even if they feel no warmth, over the person whose help depends on their mood. The first person is reliable. The second is a ticking time bomb of indifference. You're worried my agent is a cold fish. I'm worried your agent is a leaf in the wind.

  **Marcus:** But is the "cold fish" actually good? If I help you, and you find out I did it *only* because duty commanded it, and I actually despise you, do you feel morally comforted? Or do you feel like a prop in my drama of self-righteousness?

  **Elena:** I feel like my rights were respected. That's the point of morality! It's not about making you feel loved; it's about ensuring you're treated as an end. The Shopkeeper treats customers as means to profit. The Duty-Bound agent treats them as ends. Huck treats Jim as a friend, which is nice, but friendship is exclusive. Duty is universal. That's why Huck's act, while beautiful, lacks the *moral* worth of a universal commitment.

  **Marcus:** So we're stuck. You think grounding worth in duty makes it stable but alienated. I think grounding it in right-making features makes it human but fragile.

  **Elena:** I think grounding it in anything other than duty makes it contingent. And morality can't be contingent.

  **Marcus:** And I think grounding it in duty makes it blind. And morality needs to see the person in front of it.

  **Elena:** Then we agree on the action. We just disagree on whether the soul behind the action matters more than the hand.

  **Marcus:** No. We disagree on whether the soul is defined by its rules or its attachments.

  **Elena:** *(Pauses)* Well. The Ethics Bowl round is in ten minutes. We still have to decide if the whistleblower acted from duty or fear.

  **Marcus:** *(Smiles)* If she did it to save her own skin, Kant says she's out.

  **Elena:** And Arpaly says if she saved the public because she actually cared about them, she's in. Even if she was terrified.

  **Marcus:** Shall we flip a coin?

  **Elena:** Duty forbids it. We argue.

  **Marcus:** Fine. But if we lose, I'm blaming your Shopkeeper.

  **Elena:** And I'll blame your Huck. Let's go.
