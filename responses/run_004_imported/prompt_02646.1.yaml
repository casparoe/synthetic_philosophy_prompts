      *   *Disjunction/Indeterminacy:* Fodor's problem. Does the frog represent "fly" or "fly or BB"? Selection favors snapping at flies, but BBs trigger the same mechanism.
          *   *Damage:* Very high. This strikes at the core ability to determine *what* the content is. If selection can't distinguish between co-extensive or causally linked properties, content remains indeterminate. This is often seen as the "hard problem" for teleosemantics.
      *   *Distality:* Does the bacteria represent the magnetic field or the oxygen-free water (which correlates)?
          *   *Damage:* High. Similar to disjunction. It's about identifying the *distal* object of representation vs. the proximal cause. Teleosemantics tries to solve this via "consumer semantics" (Millikan) or specific selection conditions, but it remains a technical hurdle.
      *   *Circularity:* Does "proper function" rely on intentional notions (like "goal" or "purpose")?
          *   *Damage:* Medium/High. If the analysis of function presupposes intentionality, the naturalization project fails. However, etiological accounts of function (Millikan/Neander) are generally accepted as non-circular in biology (selection history doesn't require mental states). This is often considered a solved or manageable objection compared to indeterminacy.
      *   *Novel Tokenings:* How do we handle thoughts we've never had before (productivity/systematicity) if content depends on past selection?
          *   *Damage:* Medium. Teleosemanticists have responses (combining basic representations, learning mechanisms with selection histories). It's a challenge for compositional semantics but not necessarily fatal to the core biological account.
      *   *Selection too slow/coarse:* Evolution is slow; minds are fast/learned.
          *   *Damage:* Medium/Low. Dretske's learning-based account addresses this. Millikan distinguishes between proper functions of mechanisms vs. specific tokenings. It's a constraint, but not a refutation.

