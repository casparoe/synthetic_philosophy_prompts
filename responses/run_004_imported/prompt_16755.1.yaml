prompt: |-
  Ok so me and my friend Theo have this dice game we made up back in 6th grade that we still play whenever he comes over, and something happened with it over winter break (we're sophomores now) that's honestly been living in my head since, so I need an outside opinion. The one rule that matters here: every turn you add your dice to your running score, and if that running score ever lands on what we've always just called "a double" (any two-digit number where both digits match, like 33 or 88), the points from that turn get doubled before they're added on. We never wrote this rule down anywhere, it's just something we both picked up from playing together constantly, and it never caused an issue because our scores basically never broke 100.

  Over break we played this huge multi-hour session and for the first time ever somebody's score actually got past 100. Theo's total landed on 114 and he said that counts as a double because of the "11" sitting right at the front of it. I said no way, since I've always gone purely off whether the last two digits match each other, and 14 obviously isnt a double. We spent like an hour digging through basically every round we could remember from the past three years trying to find one that would prove the other person wrong, and here's what's messing with me: every single round either of us could dig up fits BOTH versions of the rule perfectly, because we just never happened to hit a number where they'd actually disagree until now. We even texted Priya, who used to play with us back then and hasn't in years, to break the tie, and all she remembered was that it "had something to do with odd numbers," which didn't help at all lol.

  So is there an actual fact about which of us has been playing the real rule this whole time without realizing we disagreed, or were we never even playing the same rule to begin with, all the way back in 6th grade? My mom thinks it's insane that this is stressing me out over a kids dice game, but it really feels like there has to be a correct answer here and I genuinely can't figure out what it would even mean to go prove it one way or the other. What's actually going on here?
