      *   **Contextualize within the Adaptationism Debate:** Adaptationists (like Dennett, Pinker, Bloom) have used this error to dismiss the whole paper. But biologists generally accept the *principle* of spandrels (e.g., skeletal constraints, developmental noise) even if they dislike the specific example.
      *   **Nuance on "Function":** In architecture, "function" is load-bearing. In biology, "function" is reproductive success. Even if the pendentives bear load, were they *selected* for that in an evolutionary sense? (Analogy limit). Actually, Mark says they were *designed* for load. So they are adaptations in the architectural sense. This kills the "non-adaptive by-product" analogy.

