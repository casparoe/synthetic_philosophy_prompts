      *   **Why the San Marco metaphor?** They needed an architectural analogy for a feature that exists *necessarily* due to the design of other parts, not because it was selected for its own utility.
      *   **The Metaphor's Logic:** Dome + Arches $\rightarrow$ Triangular gaps (Spandrels). The gaps are inevitable consequences of the architecture, not the *reason* for the architecture. Later, artists painted on them (exaptation).
      *   **Robert Mark's Counter:** The pendentives (the curved triangles) are structural necessities that transfer load. They aren't "leftover space"; they are engineered components.

