          *   **Ending:** Focus on whether the bookie/bets are necessary or just "theater" for logical inconsistency.

  2.  **Character Voices:**
      *   *Bayes:* Precise, confident, focused on coherence and norms of rationality. Uses terms like "credence," "axioms," "guaranteed loss."
      *   *Skeptic:* Wary, analytical, focused on the gap between action and belief. Uses terms like "pragmatic," "bridge principle," "epistemic norm."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A coffee shop or office. Bayes initiates with the classic Dutch Book setup.
      *   **Round 1: The Basic Argument.**
          *   Bayes: If your credences violate axioms, a bookie can Dutch Book you. Therefore, you are irrational.
          *   Skeptic: You've shown I lose money. You haven't shown my *mind* is broken. Maybe I just hate losing money, but my beliefs are fine.
      *   **Round 2: The Bridge Premise.**
          *   Bayes: It's not about money. It's about consistency. If you believe $P$ to degree $x$, you *should* bet at odds $x$.
          *   Skeptic: There's the bridge! "Credence *just is* betting disposition." I deny that. I can have a belief without being willing to bet my house on it.
          *   Bayes: Okay, fair. But if your betting dispositions don't match your credences, *that's* the incoherence. Or, if we define credence functionally, the violation is internal.
      *   **Round 3: The Epistemic vs. Pragmatic Distinction.**
          *   Skeptic: Even if I'm inconsistent, why is that *epistemically* bad? Maybe it's practically bad. But truth isn't about wallets.
          *   Bayes: Logic is about consistency. Probability is logic. If you violate probability, you violate logic. The money is just a way to *show* the contradiction.
      *   **Round 4: The "Theater" Climax.**
          *   Skeptic: So admit it! The money is theater.
          *   Bayes: It's a *reductio*.
          *   Skeptic: Then why call it a Dutch Book argument? Why not just say "Probabilistic Coherence is a logical norm"?
          *   Bayes: Because agents need motivation to care about logic.
          *   Skeptic: Ah, so it *is* pragmatic.
      *   **Ending:** The realization that the bookie is superfluous if the core claim is logical inconsistency.

  4.  **Refining and Polishing (Self-Correction during drafting):**
