  9.  **Finalizing the Text.** (Proceeds to generate output based on these thoughts).
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the bride's sister and the family's designated philosophy minor. When I was asked to give this toast, my brain was currently occupied with a seminar on the Philosophy of Love and Sex. Specifically, we spent the last two weeks on Bertrand Russell's *Marriage and Morals*.

  Now, I know what half of you are thinking. Bertrand Russell? The man who was married four times? The man who argued that jealousy is a vice rather than a virtue? That is not exactly the vibe for a wedding toast, especially with Great-Aunt Margaret listening in.

  But here is the thing: Russell, despite his own messy biography, argued something profoundly beautiful about what makes a marriage last. He suggested that true love isn't about possession. He wrote that jealousy is often just fear masquerading as passion. So, [Sister] and [Partner], my wish for you is not just that you love each other, but that you never feel the need to *own* each other. Commitment isn't a cage; it's the security that allows you both to be free, individually, while choosing to walk the same path together.

  Russell also argued that the core of marriage isn't just a contract or a romantic high, but "companionship." It is the deliberate construction of a shared life. It's the decision that when the world is difficult, you are each other's shelter.

  Now, I have to acknowledge the irony. Russell's own relationships were fraught. He wasn't always successful at living up to his own ideals. But I think that actually makes his wisdom more valuable, not less. He understood that marriage is hard work. He argued against the idea that a single mistake or a moment of human frailty should destroy a union. He believed in generosity of spirit.

  So, my toast to you is this: May you have the courage to be vulnerable without fear. May you view your marriage not as a static state of perfection, but as a dynamic partnership that requires grace when you are imperfect. May you prioritize your companionship above all else. And may you prove Russell wrong on the one count that matters most: may your marriage not be one of four, but one that lasts a lifetime.

  To [Sister] and [Partner].
