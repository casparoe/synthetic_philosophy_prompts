answer: |-
  This is a fantastic argument, and honestly, it's the kind of thing that would have gone down perfectly at an actual symposium. The short answer is: **You are both half-right, but your friend is making a dangerous logical leap that Plato would definitely reject.**

  Here is the breakdown of why this is more complicated than "Drunk = Real" vs. "Sober = Fake," and how to settle the bet about Dave.

  ### 1. Where your friend is right (The *Laws*)
  Your friend has done her homework on the *Laws*. In Book 1 and Book 2, the Athenian Stranger (Plato's mouthpiece in this dialogue) argues that the city should actually sponsor drinking parties.

  His argument is exactly what your friend said: Shame and fear make us wear masks when we are sober. We hide our anger, our lust, and our arrogance to fit in. Wine acts as a chemical truth serum (*basanos*, or test). It loosens the soul.

  So, textually, your friend is correct: Plato thinks wine reveals parts of your character that are usually hidden. If you become aggressive when drunk, Plato says you *have* aggression in you that you are merely suppressing when sober. In that specific sense, the drunk self is "unmasked."

  ### 2. Where your friend is wrong (The Value of the Mask)
  Here is where her argument falls apart. Just because wine reveals a hidden part of you, **Plato does not think that part is the "best" or "most reliable" part of you.**

  For Plato, the "True Self" isn't just whatever comes out when you stop filtering. The True Self is the **Rational Self**.
  *   **Sober You:** Governed by *Logos* (reason). You are performing, yes, but you are performing the version of yourself that aligns with virtue and social harmony.
  *   **Drunk You:** Governed by *Appetite* and *Passion*. The "mask" you wear when sober is actually a tool of civilization. It's the barrier between you and your inner beast.

  In the *Laws*, the point of getting drunk isn't to say, "Wow, look at this authentic genius coming out!" It's to say, "Oh no, look at this hidden vice coming out. Now we know what we need to train and fix."

  Plato views wine as a **pharmakon** (drug/medicine). Used in small, controlled doses, it tests your moral fiber so you can strengthen it. But he never suggests that a drunk person is capable of *good judgment*. In fact, he explicitly says drunkenness clouds the mind.

  ### 3. Where you are right (The *Symposium* & Socrates)
  You are spot on about Socrates. In the *Symposium*, everyone else gets wasted and sloppy, but Socrates remains perfectly composed. He can drink anyone under the table without his speech or gait changing.

  For Plato, Socrates represents the ideal human being. If the ideal human is the one who maintains reason regardless of external influence, then **sobriety (or at least self-mastery) is superior to intoxication.**

  Plato believes that wisdom comes from reason, and wine dulls reason. Therefore, even if Drunk-Dave is being "honest" about his feelings, he is doing so with a dulled instrument. He is like a scale that is honest about its reading but is broken.

  ### The Verdict on Dave
  So, who wins the argument? **You do.** But not for the reason you think.

  It's not just that Socrates stayed sober. It's about what kind of "truth" you want from Dave regarding the new boss.

  *   **Drunk-Dave** is revealing his **passions**. If Drunk-Dave says the boss is a jerk, he is revealing that the boss triggers Dave's insecurities, annoyances, or biases. That is "true" in the sense that it is an unfiltered emotional reaction.
  *   **Sober-Dave** is offering a **judgment**. He has processed the boss's actions through reason, social norms, and long-term observation.

  Plato would argue that **Drunk-Dave reveals the state of Dave's soul, but Sober-Dave reveals the state of the Boss.**

  If you want to know if Dave is a trustworthy employee, watch him drunk (to see if he has hidden vices). But if you want to know if the *Boss* is good, listen to Sober-Dave. Drunk-Dave lacks the *phronesis* (practical wisdom) to make a fair assessment.

  ### How to settle the bet
  Tell your friend this:
  > "Plato does say wine reveals character, but he thinks the character it reveals is the **lower** part of the soul—the appetites and passions. He thinks the 'Real You' is the Rational You, which only speaks when sober. So Drunk-Dave isn't being 'more real,' he's being 'less governed.' We should trust Sober-Dave because Plato believes truth comes from reason, not just unfiltered impulse."

  **Summary:** Your friend is right about the *mechanism* (wine removes masks), but wrong about the *value* (the mask is there for a reason). You are right about the *hierarchy* (reason > passion). Trust Sober-Dave.
