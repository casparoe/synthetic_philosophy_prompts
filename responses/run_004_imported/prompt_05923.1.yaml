answer: |-
  Here is a joke/story designed to open your section. It's structured to sound like a casual anecdote to the uninitiated, but the punchline is engineered to trigger the specific "disposition vs. act" tension your students are wrestling with.

  ### The Joke: "The Rationality Consultant"

  A hitchhiker is about to enter Parfit's Desert, but he's nervous, so he hires a Decision Theory Consultant to tell him how to handle the driver.

  **Hitchhiker:** "Okay, the driver is a mind-reader. He won't pick me up unless he knows I'll pay him once we're in town. What do I do?"

  **Consultant:** "Simple. Promise him you'll pay."

  **Hitchhiker:** "But once I'm safe in town, won't paying be irrational? I mean, the ride is already done. The money is gone either way. Paying is just a sunk cost."

  **Consultant:** "Absolutely. By the lights of standard decision theory, paying in town is strictly irrational."

  **Hitchhiker:** "So I shouldn't pay?"

  **Consultant:** "If you don't, you die. The driver knows you won't pay, so he never picks you up."

  **Hitchhiker:** "Wait, so you're telling me to promise to do something irrational?"

  **Consultant:** "No. I'm telling you to **become** the kind of person for whom paying isn't irrational."

  **Hitchhiker:** "How do I do that?"

  **Consultant:** "I don't know. Train yourself to feel physically ill if you break a promise. Lobotomize your cost-benefit analyzer. Tie your own hands. Just make sure that when you get to town, you literally *cannot* be rational."

  **Hitchhiker:** "That sounds crazy. Why would I want to disable my rationality?"

  **Consultant:** "Because in this desert, rationality is a liability. To survive, you need to be irrational enough to pay, but rational enough to know you need to be that way."

  **Hitchhiker:** "So what theory is that?"

  **Consultant:** "We call it 'Rational Irrationality.' The drivers just call it 'Solvent.'"

  ***

  ### Why this works for your section

  **1. The Layperson Layer (The "Mildly Amusing" Pass)**
  For the students who aren't feeling the paradox yet, this plays as a simple irony about integrity. It sounds like a story about a guy trying to cheat a contract and being told, "Don't cheat, or you'll lose future business." It's relatable: sometimes you have to force yourself to do the right thing (like dieting or saving money) even when the immediate temptation is to defect. They will laugh at the absurdity of "lobotomizing your cost-benefit analyzer" without needing to understand CDT.

  **2. The Seminar Layer (The "Oh, That's Clever" Pass)**
  For the students grappling with the text, the joke lands on the specific technical tension you want to highlight:
  *   **"Become the kind of person..."** hits the **Disposition vs. Act** evaluation (Gauthier's *Constrained Maximization*).
  *   **"Disable your rationality"** references the **Rational Irrationality** argument (Elster/Parfit) — that responsiveness to reasons at $t_2$ undermines utility at $t_1$.
  *   **"Rational enough to know you need to be that way"** nods to the **Updateless/FDT** crowd — the idea that the *policy* is rational, even if the *output* at the specific node looks dominated.
  *   **"Solvent"** is the punchline that reminds them that CDT agents literally end up with zero utility (dead) because they cannot endorse the action required to survive.

  ### Delivery Tip
  Deliver the Consultant's lines with dry, bureaucratic confidence. When you get to the line *"Just make sure that when you get to town, you literally can't be rational,"* pause for a second. That's the moment the CDT students in the room should feel the trap snapping shut. If they laugh, you know they get it. If they look confused, you can pivot immediately into: *"And that confusion is exactly why Parfit thinks CDT is self-defeating..."*
