  2.  **Deconstruct the Philosophy:**
      *   **The Paradox of Fiction:** How can we feel emotions for characters we know don't exist?
          1.  We feel emotions for X only if we believe X exists.
          2.  We know fictional characters don't exist.
          3.  Therefore, we don't feel real emotions for them.
      *   **Walton (Make-Believe):** We engage in a game of make-believe. The physiological symptoms (tears, heart rate) are real, but the psychological state is "quasi-emotion." It's like a child pretending to be scared of a monster. The lack of action (calling 911) proves it's not real fear/grief.
      *   **Thought Theory (Mireille):** Belief isn't necessary for emotion. We can fear *possible* states of affairs. The object of the emotion is the *content* of the thought, not the ontological status of the object. We pity the *situation*, not the biological entity.
      *   **The Counter-Counter:** If Mireille says "I'm pitying the thought," Tomas needs to press on the *function* of emotion. Emotions motivate action. If the emotion doesn't motivate action, is it fully formed? Or is it a specific aesthetic emotion distinct from practical emotion?

