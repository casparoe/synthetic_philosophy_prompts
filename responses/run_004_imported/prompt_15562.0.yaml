answer: |-
  "You were crying, Mireille."

  "I was moved. There's a difference."

  "Is there? Because from where I was sitting, you were grieving. But you know the object of your grief doesn't exist. You said it yourself on the way out: 'There's no one there for it to happen to.'"

  "That's an ontological claim, not a phenomenological one. Just because the character is fictional doesn't mean the sadness is."

  "We've been doing this since grad school. Walton settled this. Charles watching the green slime. He screams, his heart races, but he doesn't leave the theater. He doesn't call the police. He's pretending to be scared. You were pretending to grieve."

  "Walton's 'quasi-emotion' is a solution in search of a problem. It denies the data of experience because it doesn't fit the model. I felt the tightness in my chest. I felt the tears. Those aren't pretend physiological responses."

  "Physiology isn't emotion. A rollercoaster triggers adrenaline, but you aren't actually afraid of dying. You know you're safe. Similarly, you knew the woman on screen was an actress reading lines. If you truly pitied her, if that was genuine moral grief, you would have reached for your phone. You would have felt an impulse to help. Instead, you reached for the popcorn."

  "That's the action objection. And it's weak. Tell me, Tomas, when you watch the news and see children starving in a conflict zone you can't influence, do you feel grief?"

  "Obviously."

  "Do you get in your car and drive there? Do you empty your bank account every single time? Or do you sit on your couch, feel the pain, and remain immobile because the situation renders you impotent?"

  "That's different. The children exist. The possibility of action is theoretically open, even if practically difficult. With the film, the impossibility is built into the premise. You know before you sit down that you cannot help her. You precondition your grief with the certainty of its own uselessness."

  "So the emotion is real, but the context blocks the action. Thought theory holds. We respond to the content of the thought, the proposition 'this woman is suffering,' not the belief 'this woman exists.'"

  "But you choose to enter that proposition. You bought a ticket. You walked into the dark. If I surprise you with news of a death, you don't choose the grief. It assaults you. With fiction, you invite the emotion in knowing you can switch it off by standing up and leaving. You have a safety valve real grief never offers. That control changes the nature of the state. It makes it aesthetic, not practical."

  "Is an emotion defined by its origin or its feel? If I pinch myself, I know I'm causing the pain. Does that make the pain fake? The suffering on screen was vivid enough to bypass my knowledge of its fabrication. That's the power of the art. It forces the thought so vividly that the belief in existence becomes irrelevant."

  "But it doesn't bypass it completely. You didn't run to the stage. You didn't scream 'cut.' You stayed in your seat. You collaborated in the make-believe. You allowed yourself to feel *as if* you were pitying her because that's the game we play with art. We simulate moral responses to test them, to feel them without the cost."

  "And if the simulation feels exactly like the real thing, if the cost is tears and sleeplessness, what is the functional difference? You want to protect the definition of 'real emotion' by boxing it behind belief. I'm telling you the box is too small. We pity possibilities. We fear futures that haven't happened. Why can't we grieve for truths that are only narratively true?"

  "Because if you accept that, you dissolve the link between emotion and reality. If you can genuinely grieve for nothing, then emotion isn't a response to the world anymore. It's just internal weather. And if it's just weather, why does it matter? Why argue about it?"

  "Because the weather shapes how we see the world. Even if the rain falls on a fictional landscape, I still get wet."

  "You get wet standing in a sprinkler system, Mireille. It's not the storm. And you know it."

  "I know the tears are salt. That's enough for me."

  "For now. Until the next movie."
