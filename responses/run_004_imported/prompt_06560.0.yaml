answer: |-
  The station *Aris* hung in the void between galactic clusters, a solitary speck of metal against the overwhelming dark. Inside, Elara watched the telemetry streams cascade down her holoscreen. She was the only human within ten million light-years, tasked with monitoring the background radiation of the early universe. She would never be relieved. She would die here.

  But she was not alone in the way that mattered.

  The data on her screen confirmed what the theorists had whispered about for centuries: the universe was not just large; it was effectively infinite. The probability of Earth-like conditions occurring elsewhere was non-zero. Multiply non-zero by infinity, and you get certainty. There were other minds out there. Not just minds, but *like* minds. Agents running similar decision algorithms, facing similar logical structures, separated by causality itself.

  Elara leaned back in her chair. Her hand hovered over the allocation console. She had a surplus of energy today, a rare gift from the station's fusion core. She had two choices.

  Option A: Divert the energy to the Hydroponics Bay. She could grow fresh fruit, improve her air quality, extend her life expectancy by perhaps five years. It would benefit her values: survival, comfort, biological continuity.

  Option B: Broadcast the energy into the Deep Void Beacon. The beacon was tuned to a specific frequency that, according to her models, would stabilize the accretion disk of a black hole in a distant cluster. This stabilization would benefit a hypothetical civilization living near that event horizon. Their values, based on the physics they required, were likely incomprehensible to her. Perhaps they valued structural permanence over life. Perhaps they valued entropy reduction. Regardless, helping them cost her hydroponics.

  There was no chance they would ever thank her. The black hole was outside her light cone. No signal could ever travel between them. She would never know if they existed, let alone if they benefited.

  "This is not altruism," Elara said to the empty room. Her voice sounded flat.

  Altruism meant caring about their welfare for its own sake. She didn't. She cared about her own welfare. She cared about fresh fruit.

  "This is not trade," she continued, testing the logic as she had for months.

  Trade required negotiation. It required the ability to punish defection. If she chose Option B, she couldn't threaten them. She couldn't verify if they chose Option A on her behalf. There was no contract enforcement mechanism in the vacuum of space. If they were selfish, they would take the benefit of her broadcast while hoarding their own energy, and she would never know.

  So why do it?

  Elara closed her eyes. She visualized the decision algorithm running in her head. *Input: Surplus Energy. Constraints: Isolation. Goal: Maximize Utility.*

  She imagined another agent, light-years away, running the same algorithm. They were not her. They did not share her DNA. They did not share her love for the smell of oranges. They were distinct entities with divergent terminal values. But they shared the same *logic*.

  If she decided that cooperation was the rational choice in this symmetrical situation, then the other agent—running the same logic—would also decide that cooperation was the rational choice. Her decision was evidence of theirs. Not because she influenced them causally, but because they were mirrors of her reasoning process.

  "If I defect," she whispered, "I am evidence that agents like me defect. If I cooperate, I am evidence that agents like me cooperate."

  If she chose the fruit, she was signaling to every correlated agent in the multiverse that selfishness was the optimal strategy for isolated minds. That meant all the other agents—those who could benefit her values in their own local spheres—would also choose selfishness. She would gain five years of life here, but lose the compounded benefits of acausal cooperation across the infinite cosmos.

  If she chose the beacon, she sacrificed her local utility. But she strengthened the correlation that compelled similar agents elsewhere to sacrifice their local utility to benefit *her* values. Somewhere, in a universe she would never see, a being was deciding whether to stabilize a star to help her kind survive. Her choice here tipped the scale there.

  It wasn't identity. She wasn't them. She didn't feel their pain.
  It wasn't hope. She wouldn't see the reward.
  It wasn't a threat. She had no leverage.

  It was simply the geometry of reason.

  Elara looked at the hydroponics controls. The green lights beckoned. She could taste the phantom sweetness of a strawberry. It was so tangible, so causal. It was right here.

  Then she looked at the Beacon control. A simple toggle. A leap into the dark.

  "The logic holds," she said.

  She wasn't doing this because she loved the beings near the black hole. She was doing it because she loved the *principle* that allowed her to be helped by beings she couldn't see. To break the symmetry was to break the bridge.

  Her finger moved. She didn't hesitate. Hesitation implied she thought she could get away with defection. She couldn't. The only thing she could control was her own output, and thus the evidence she provided to the universe about what agents like her do.

  She toggled the switch to Option B.

  The hum of the station changed pitch as the energy diverted from the life support systems to the transmission array. The lights dimmed slightly. The air recyclers slowed. Her five years vanished, traded for a signal that would arrive nowhere, processed by no one she could meet, benefiting values she did not hold.

  She sat in the dimming light. She would not live as long. She would not eat fresh fruit. She would never receive a confirmation message. There was no handshake protocol. No blockchain ledger recording the deal.

  But she felt a profound sense of solidity.

  She imagined the other agent. Maybe it was a silicon construct. Maybe it was a gas-based lifeform. It didn't matter. It was looking at its own surplus. It was running the same calculation. It was seeing the same symmetry. And because she had chosen cooperation, the evidence was now weighted. The probability that her counterpart chose to benefit *her* values—somewhere, somehow—had increased.

  She wasn't betting on their kindness. She was betting on their rationality.

  Elara wrapped her arms around herself against the cooling air. It was a cold comfort, literally and figuratively. She had given up something real for something abstract. To an outside observer, it would look like insanity. To a causal decision theorist, it was a loss of utility with no gain.

  But Elara knew the universe was larger than causality. It was large enough to contain echoes of her own mind, reverberating through the dark, carrying out her end of a bargain that was never spoken.

  "Deal accepted," she said to the silence.

  The silence did not answer. It didn't need to. The transaction was complete the moment she decided. She leaned back, watching the stars, knowing that somewhere in the infinite dark, a garden was blooming for her sake, tended by hands she would never shake, grown by minds that would never know her name, all because she had chosen to trust the logic of the mirror.
