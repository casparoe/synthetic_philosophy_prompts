answer: |-
  To Nora's family, to her brother, to her advisors and friends: thank you for letting me speak.

  For those of you who didn't know Nora in grad school, you might be surprised to hear that one of her favorite things to talk about over dinner was a philosopher named Frank Ramsey. He died in 1930, at twenty-six. The same age Nora was when she died last month.

  Nora knew that coincidence was just a coincidence. She wouldn't want us to make a pattern out of it. But she did love a specific idea Ramsey wrote about near the end of his life. He said that his picture of the world was drawn "in perspective rather than to scale."

  He meant that in his mind, the stars didn't loom huge and terrifying. They shrank down to the size of coins. He wrote that he felt no humility before the vastness of the universe, not because he was arrogant, but because mere size and duration aren't the things that measure value. A universe can be big and empty. A mind that can think, and love, and understand—that is the thing that carries weight.

  Nora told me once that this was the only piece of philosophy that ever changed how a bad day felt. It wasn't just an argument to win; it was a way to breathe.

  I know that for her parents and brother, the language of philosophy might feel distant right now. But I think the heart of what Nora loved is something you already know. You knew her capacity to love. You knew the intensity of her mind. Ramsey's point—and Nora's—was that those things are not small. Even if the universe is vast, and even if time is long, the love she gave you and the work she did here are not diminished by the size of the space around them. They are real. They are heavy. They matter.

  To her colleagues and advisors in the back: I know what this argument does, and I know what it doesn't do. Ramsey was defending the significance of human goods against cosmic insignificance. He was not offering a theodicy for a brain aneurysm. This passage cannot tell us why she was taken. It cannot give back the forty or fifty years she should have had. It cannot fill the gap of the dissertation she didn't finish, or the conversations we won't have.

  If I stand here and tell you that her life was "complete" because it was meaningful, that would be a lie. It wasn't complete. It was cut off. The grief we feel—the anger at the lost time—is valid. Ramsey's perspective doesn't erase the tragedy of the duration. It only asks us to recognize that the value of what remains isn't canceled out by the silence that follows.

  Nora was very clear about what she did not believe. She did not believe she would be watching over us. She did not believe this happened for a reason. She asked us not to say those things. So I won't.

  But I will say this: The world she left behind is different because she was in it. The perspective she asked us to draw is one where the things she loved—her family, her friends, her questions—are the large things. The stars can stay far away. We keep the coins.

  We miss her. We will keep missing her. But as long as we remember her clearly, without decoration, the weight of her mind remains here, with us.

  Thank you.
