      *   Support the partner without undermining the user's intelligence.
      *   Focus on the *system* rather than the specific deal.

  8.  **Key Insight to Highlight:** The rule wasn't designed to filter bad *investments*; it was designed to filter bad *timing and emotional states*. The partner isn't evaluating the deal; she is evaluating the process.

  9.  **Final Polish:** Check for clarity and ensure both parts of the user's question are answered (Was she right? Was the arrangement a mistake?).

      *(Self-Correction during drafting)*: I should make sure not to give specific financial advice (like "don't invest in friends' businesses"), but rather speak to the *principle* of asset allocation and commitment devices. I need to emphasize that the "house fund" has a specific purpose that conflicts with "investment opportunities."

  10. **Final Structure:**
