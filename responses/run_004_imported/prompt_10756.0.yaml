answer: |-
  This is a textbook example of one of the most famous problems in democratic theory. You have stumbled directly onto **The Boundary Problem**.

  In your poli phil unit, you are likely discussing the question: *Who constitutes the demos?* (Who are "the people" entitled to rule themselves?)

  Your town's situation perfectly illustrates the tension between two competing principles of democratic inclusion. Here is the breakdown of the theoretical landscape regarding your question about whether there is a "non-arbitrary" answer.

  ### 1. The All-Affected Principle (Your first group of friends)
  The argument that the neighboring town should get a vote relies on the **All-Affected Principle (AAP)**. This principle states that anyone whose interests are significantly affected by a political decision ought to have a right to participate in making that decision.

  *   **The Strength:** It aligns with our basic intuition about fairness and coercion. If my backyard is going to become a truck depot, excluding me from the vote feels like tyranny. It addresses the problem of **negative externalities** (when one group reaps benefits while another pays the costs).
  *   **The Weakness:** As your second group of friends noted, the AAP is notoriously difficult to bound. In a globalized world, almost *everyone* is affected by almost *everything* (e.g., climate change, economic markets). If you follow the AAP strictly, the "demos" for a local zoning vote might need to include the whole region, or even the whole world. This leads to decision paralysis.

  ### 2. The All-Subjected (or Territorial) Principle (Your second group of friends)
  The argument that "town lines are as principled a cutoff as any" relies on a **Territorial** or **All-Subjected Principle**. This suggests that the right to vote belongs to those who are subject to the ongoing coercion of the government's legal framework, or simply those who reside within the established jurisdiction.

  *   **The Strength:** It provides stability. Democracies need a fixed electorate to function. If the electorate changed based on every single ballot measure (a "fluid demos"), you couldn't build a stable political community. It respects the idea of a "community of fate"—people who live together under the same laws day-to-day.
  *   **The Weakness:** It can legitimize "border tyranny." It allows a majority in one jurisdiction to vote themselves benefits while exporting the harms to non-voters just across the line. It treats the boundary as morally sacred when, historically, town lines are often arbitrary (drawn along rivers, old property grants, etc.).

  ### 3. Is there a non-arbitrary answer?
  **The short philosophical consensus is: No.**

  The political philosopher **Frederick Whelan** wrote the definitive work on this (*Democratic Theory and the Boundary Problem*). His argument is that the boundary problem is **logically prior** to democracy.

  *   To decide who votes democratically, you first need to decide who is eligible to vote.
  *   But to decide who is eligible to vote democratically, you need a vote... by whom?
  *   You end up in an infinite regress.

  Because of this, Whelan and others (like Robert Dahl) argue that boundaries are almost always determined by **non-democratic means**: history, geography, war, conquest, or administrative fiat. Once the lines are drawn, democracy operates *inside* them. But the lines themselves are rarely democratically justified in a non-arbitrary way.

  Some contemporary theorists (like Robert Goodin) argue we should adopt the All-Affected Principle as a moral ideal, even if we can't fully implement it. Others (like David Miller) argue that shared identity and cooperation matter more than mere affectedness, justifying fixed borders.

  ### 4. How to use this in your class
  This scenario is gold for a political philosophy paper or discussion. Here is how you can frame it:

  1.  **Identify the Paradox:** Explicitly name the "Boundary Problem." Professors love when students identify the specific theoretical paradox at play.
  2.  **Analyze the Externality:** Argue that land-use zoning is a specific case where the All-Affected Principle is strongest. Unlike a vote on the town's mascot, a distribution center creates physical spillover. This tests the limits of the Territorial Principle.
  3.  **The "Second-Best" Solution:** Since there is no non-arbitrary answer to who *should* vote, ask what the **procedural remedy** is. If the neighbors can't vote, does your town have a moral obligation to seek their consent via a non-binding referendum? Or is there a regional planning commission that should override the local vote?
      *   *Theory connection:* This moves from *ideal theory* (what is perfectly just) to *non-ideal theory* (how we manage injustice in existing institutions).

  ### Summary
  Your friends on both sides are echoing a debate that has lasted for centuries.
  *   **Friends Side A:** Are arguing for **Democratic Legitimacy** (consent of the governed).
  *   **Friends Side B:** Are arguing for **Democratic Feasibility** (the need for a bounded unit to make decisions).

  There is no "correct" philosophical answer that solves the arbitrariness of the line. The "answer" in political philosophy is usually that we must acknowledge the arbitrariness and create institutions (like regional councils or environmental impact reviews) to mitigate the harm caused by the boundary, rather than pretending the boundary is morally perfect.

  If you bring this up in class, mention **Frederick Whelan** and the **Boundary Problem**. It will show you've connected the real world to the reading.
