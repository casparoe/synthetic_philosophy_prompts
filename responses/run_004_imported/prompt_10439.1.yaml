answer: |-
  This is a sophisticated application of Lewis's framework. You have correctly identified the tension between Lewis's abstract conditions (arbitrariness, mutual expectation, self-perpetuation) and a concrete case driven by moral imperative and authoritative mandate.

  David Lewis was precise about definitions. If we apply his apparatus strictly from *Convention: A Philosophical Study* (1969) and his later papers on norms, he would likely analyze the `master`-to-`main` shift not as a single event, but as a dynamic process involving a clash between **authority**, **salience**, and **coordination equilibria**.

  Here is how Lewis would likely dissect your four specific questions.

  ### 1. Is this a genuine change of convention or a directive?

  Lewis distinguishes between a **convention** and a **decree** (or law). A decree is followed because of the threat of sanction; a convention is followed because of the *expectation* that others will follow it, which makes it in your interest to follow it too (the conditional preference condition).

  Lewis would argue that the shift began as a **decree** (corporate mandates, platform defaults) but is currently in a transitional phase toward becoming a **convention**.

  *   **The Seed:** Lewis explicitly allows that conventions can originate from explicit agreement or authoritative suggestion. GitHub changing the default is a "salient focal point." It solves the "which arbitrary regularity should we pick?" problem by making `main` conspicuous.
  *   **The Test:** For Lewis, the shift is only complete when the *reason* for conformity changes.
      *   If you name a branch `main` solely because your CI/CD pipeline will fail or your manager will reprimand you if you use `master`, you are following a rule, not a convention.
      *   If you name it `main` because you expect the downstream consumer of your code to *expect* `main`, and they expect it because they expect you to use it, it has become a Lewisian convention.

  **Verdict:** Lewis would likely say we are in a **hybrid state**. In new projects, `main` is rapidly becoming a convention (sustained by expectation). In legacy projects, `master` remains a convention (sustained by inertia/precedent). The mandate was the *catalyst*, but the convention only exists where the mutual expectation has decoupled from the threat of enforcement.

  ### 2. How to characterize the persistent coexistence (Fragmented Equilibrium)?

  Lewis's standard model assumes a population $P$ in a recurrent situation $S$ converging on a single regularity $R$. The `master`/`main` split violates the uniqueness condition. Lewis has resources for this, specifically his discussion of **local conventions** and **partitioned populations**.

  He would likely analyze the current state not as a single failed convention, but as **two local conventions** operating within a partitioned population:

  *   **Population $P_1$ (New/External Repos):** Regularity $R_{main}$.
  *   **Population $P_2$ (Legacy/Internal Repos):** Regularity $R_{master}$.

  The coordination problem arises not within the groups, but at the **boundary conditions** (e.g., an engineer contributing to open source, or merging a legacy monolith into a new microservice).

  Lewis would characterize this fragmented state as **coordination friction**. In a pure convention, the branch name is common knowledge. In this fragmented state, the branch name is *uncertain*. You must engage in a **signaling game** to determine which sub-population you are interacting with. You check the repo settings or documentation *before* you clone.

  For Lewis, this indicates that the convention is **not yet settled** for the global population of "Software Engineers." It is settled only for specific contexts. The persistence of the split suggests that the cost of coordinating on a single global standard (migrating all legacy `master` repos) currently outweighs the coordination cost of maintaining the ambiguity (checking the branch name before working).

  ### 3. The Problem of Arbitrariness and Moral Value

  This is the thorniest philosophical issue. Lewis insists a convention must be **arbitrary**: there must be an alternative regularity $R'$ that could have served the same purpose.

  *   **Technical Arbitrariness:** Technically, `master` and `main` are perfectly arbitrary. Git does not care. This satisfies Lewis's condition.
  *   **Moral Non-Arbitrariness:** However, the drive for `main` is based on the premise that `master` (in the master/slave context) is harmful. If `main` is *morally superior*, is the choice still arbitrary?

  Lewis would likely separate the **justification for the shift** from the **mechanism of the convention**.
  *   The *selection* of the new equilibrium was not arbitrary; it was driven by moral salience.
  *   However, the *maintenance* of the convention remains coordination-based.

  Lewis would argue that even if `main` is morally better, it only functions as a *convention* insofar as I use it to coordinate with you. If I use `main` purely as a moral statement, regardless of whether you use `master`, I am acting on a moral norm, not a convention. But if I use `main` because I know *you* are using `main` (partially because of the moral shift), the structure is convention.

  He would likely warn that if the moral imperative fades but the technical coordination remains, the convention persists. If the moral imperative remains but the technical coordination fails (e.g., if everyone goes back to `master` for convenience), the convention collapses. The moral weight acts as a **stabilizer** for the new equilibrium, increasing the "cost" of deviating (social sanction) beyond the technical cost.

  ### 4. Prediction: Will `main` displace `master`?

  Lewis's theory is descriptive, not teleological; he doesn't believe conventions inevitably progress toward "better" states. However, his model of **network effects** and **common knowledge** offers a prediction.

  Lewis would predict convergence to `main` **if and only if** the mutual expectation becomes self-reinforcing enough to overcome the precedent of `master`.

  *   **The Tipping Point:** Conventions tend toward uniformity to minimize transaction costs. Currently, the transaction cost is "checking which branch name a repo uses." If the industry reaches a point where assuming `main` is correct 99% of the time, the expectation will solidify. At that point, using `master` becomes a **coordination failure**. New engineers will assume `main` by default; repos using `master` will suffer from onboarding friction (PRs failing, confusion).
  *   **The Stickiness of Precedent:** Lewis acknowledges that past regularity creates its own expectation. `master` has 15+ years of precedent. Lewis would note that conventions are "sticky." The fragmented equilibrium could persist indefinitely if the cost of migrating legacy repos is higher than the cost of the ambiguity.
  *   **The Role of Defaults:** Lewis places heavy weight on **salience**. GitHub's default change is a massive salient feature. In Lewisian terms, this creates "common knowledge" that `main` is the *standard* for new coordination problems.

  **Lewis's Prediction:** He would likely predict that `main` will become the dominant convention for *new* coordination problems (new repos, new teams), while `master` will persist as a "legacy convention" in older populations. Total displacement is unlikely unless a technical break occurs (e.g., Git itself changes the default behavior fundamentally, making `master` costly to use).

  However, he would caution that if the "moral mandate" is perceived as external coercion rather than internalized expectation, resistance could solidify `master` as a counter-convention among groups who reject the mandate (a "rebellious equilibrium"). Conventions can sustain themselves even against authority if the mutual expectation within the sub-group is strong enough (e.g., pirates, black markets). If a segment of the engineering community views the change as purely political and resists it, `master` could persist as a marker of group identity, not just technical precedent.

  ### Summary of the Lewisian Analysis

  1.  **Status:** It is a **convention in transition**, seeded by authority/defaults but not yet fully self-sustaining via mutual expectation across the whole population.
  2.  **Fragmentation:** This is a case of **local conventions** within partitioned sub-populations (Legacy vs. Greenfield). The friction is the cost of determining which sub-population you are interacting with.
  3.  **Arbitrariness:** Technically arbitrary (satisfying Lewis), but morally weighted (acting as a salience booster for the new focal point).
  4.  **Future:** Convergence to `main` is probable due to the network effects of defaults, but total displacement is not guaranteed. The equilibrium will stabilize where the cost of migration equals the cost of ambiguity.

  Lewis would ultimately tell you that the frustration you feel—the need to check the branch name before working—is the precise phenomenological experience of a **coordination problem without a settled convention**. The anxiety isn't about the name; it's about the lack of common knowledge regarding which regularity to expect.
