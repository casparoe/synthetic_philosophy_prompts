      *(Another Nuance)*: Lewis's "Arbitrariness" condition. If `master` is considered offensive, is `main` still arbitrary? Lewis would say yes, regarding the *coordination problem*. The moral reason selects the focal point, but the *reason for conformity* must remain coordination-based for it to be a convention. If I conform solely to be moral, it's not a convention. If I conform to avoid merge conflicts *because* the moral shift made everyone else conform, it is a convention. This is a subtle but vital Lewisian distinction.

