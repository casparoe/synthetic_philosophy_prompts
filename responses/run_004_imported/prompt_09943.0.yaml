answer: |-
  This is a classic, painful scenario, and you are right to be suspicious. Your friend isn't just making up noise; he is using a more sophisticated economic argument than the standard "sunk cost" accusation. However, **he is describing a different trap that leads to the exact same financial ruin.**

  Here is the breakdown of the difference between your argument, his argument, and the actual game theory trap you are both walking into.

  ### 1. The Technical Difference: Sunk Cost vs. Marginal Analysis

  You are accusing him of the **Sunk Cost Fallacy**.
  *   **The Logic:** "We have already spent $18k, so we need to keep spending to make that $18k worth it."
  *   **Why it's flawed:** The $18k is gone. It should not factor into the decision.

  Your friend is arguing for **Marginal Analysis**.
  *   **The Logic:** "I don't care about the past $18k. The question is: If I spend *another* $5k on lawyers, do I have a >20% chance of winning a $25k asset? If yes, the bet is mathematically positive."
  *   **Why it sounds smart:** He is technically correct that past spending shouldn't dictate future moves. He is trying to frame this as a fresh investment decision.

  **The Verdict:** He is right that this isn't *purely* sunk cost reasoning. He is looking forward, not backward. **But he is missing a critical variable.**

  ### 2. The Real Trap: The War of Attrition

  The situation you are in has a specific name in game theory: **A War of Attrition.**

  In a War of Attrition, two parties compete for a prize by accumulating costs. The winner takes the prize, but **both parties pay their own costs regardless of who wins.**

  Here is why your friend's "rational" logic fails in this specific game:

  1.  **Symmetrical Incentives:** Your friend thinks, "It is rational for me to spend $5k more for a chance at $25k." But you have the exact same math. If it is rational for him, it is rational for you.
  2.  **The Bidding War:** Because both of you are acting "rationally" based on marginal analysis, you will both keep bidding. You will bid $20k, then $25k, then $30k.
  3.  **The Winner's Curse:** Eventually, one of you wins the business. But if you spent $30k to win a $25k business, **you lost.** The only way to win a War of Attrition is to convince the other person to quit *before* the costs exceed the prize.

  Your friend thinks he is making an investment. In reality, he is entering a bidding war where the "price" of the business is being auctioned up by legal fees. Since the business is capped at $25k, but the legal fees have no cap, **the rational move is actually to stop bidding, not bid one more round.**

  ### 3. Why Continuing Feels Reasonable (The Psychology)

  You asked why continuing feels like the reasonable choice at every single step. This is because the trap is designed to feel rational.

  *   **The Threshold Illusion:** At any specific moment, the *next* bill looks manageable ($5k) compared to the prize ($25k). It is only when you look at the *cumulative* total ($36k+) that the insanity is visible. The brain focuses on the margin, not the aggregate.
  *   **Competitive Arousal:** After a year of fighting, this is no longer about the business. It is about dominance. Losing the business feels like a personal defeat, which triggers **Loss Aversion**. Psychologically, the pain of losing the business feels twice as powerful as the pain of paying another legal bill.
  *   **The "Break Point" Fallacy:** Both of you likely believe, "He is hurting more than I am. If I push just one more time, *he* will be the one to break." This is a gamble on the other person's pain tolerance, not the business's value.

  ### 4. How to Break the Cycle

  You cannot logic your way out of this using the current framework, because your friend's framework (Marginal Analysis) is technically sound but contextually disastrous. You need to change the game.

  **1. Acknowledge the "Mutually Assured Destruction"**
  Sit him down and show him the aggregate math.
  *   "You say we should spend $5k more to try to win $25k. I agree that makes sense in a vacuum. But we have already spent $36k combined. We are currently $11k in the hole as a partnership. If we spend another $10k fighting, we are $21k in the hole. Even if I win, I lose. Even if you win, you lose."

  **2. Introduce a Third-Party Valuation**
  Stop arguing about what the business is worth or who deserves it. Hire a neutral third party to value the business *today*.
  *   If it's worth $25k, agree that one person buys the other out for $12.5k (or whatever the split is).
  *   If neither has the cash, agree to sell the business to an outsider and split the proceeds. **Selling to an outsider is the only way to stop the legal fees from eating the equity.**

  **3. The "Pre-Commitment" Strategy**
  In game theory, the way to win a War of Attrition is to credibly signal that you will *never* quit, which scares the other person into quitting. But since you are friends, that's nuclear.
  *   Instead, use a **Pre-Commitment to Cap.** Tell him: "I am willing to spend exactly $2k more on this. After that, I will file for dissolution/mediation regardless of where we are." If he knows you have a hard stop, his "one more round" calculation changes.

  ### Summary
  Your friend is not using the Sunk Cost Fallacy. He is using **Marginal Analysis** to justify entering a **War of Attrition.**

  He is right that the past money doesn't matter. He is wrong that spending *more* money is rational. In a War of Attrition, the only winning move is to refuse to play, because the cost of playing inevitably exceeds the value of the prize.

  **The hard truth:** You have already lost $18k each. The only decision that matters now is whether you lose $23k each or $19k each. Fighting for "one more round" guarantees the former. Settling guarantees the latter.
