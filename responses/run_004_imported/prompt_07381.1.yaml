  Ok so a friend and I were sitting on my porch as it got colder out and somehow that turned into a massive argument about self-knowledge that pretty much ruined movie night. I brought up Williamson's anti-luminosity argument -- the one where you supposedly cant always tell just by introspecting whether you're cold, because of margin-for-error reasoning over a long series of barely-different moments -- and said this generalizes to take down the KK principle entirely (if you know P you're automatically in a position to know that you know P). My friend agreed the cold case works but said jumping from that to KK in general is way too fast: the margin-for-error setup needs some obvious "closeness" relation between cases, like slightly different temperatures, to run the sorites-style reasoning, and she doesnt think theres any comparable "nearby case" for something like knowing a proof is valid, so Williamson hasn't actually earned the fully general conclusion, just the perceptual one. I didn't have a good comeback for that. Can you build the strongest version of her argument -- that generalizing the anti-luminosity argument into a full rejection of KK is unearned outside cases with an obvious continuous closeness metric -- and say specifically where Williamson's reasoning would need to, but doesn't, secure that generalization?
