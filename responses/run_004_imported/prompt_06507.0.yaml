  **Move-by-Move Analysis**

  *   **(1) Bob: +1.** Pragmatically solid, metaphysically loose. In an engineering post-mortem, this is the correct stance for accountability. However, asserting omissive causation "full stop" without qualification ignores the philosophical complexity Carol is about to raise.
  *   **(2) Carol: +2.** This is the classic "problem of profligate causation." She correctly identifies that if mere counterfactual dependence makes something a cause, then *everything* that didn't prevent the outage is a cause. This is the strongest philosophical objection possible.
  *   **(3) Bob: +1.** This is the standard "normal conditions" defense (Hart & Honoré). Invoking duty successfully filters out the 400 irrelevant employees, but it concedes that "causation" here relies on social norms, not just physics.
  *   **(4) Carol: +2.** She accurately diagnoses Bob's concession. She distinguishes between *causal structure* (physical events) and *causal selection* (normative judgment). She is right that Bob is smuggling norms into a metaphysical category.
  *   **(5) Bob: 0.** A semantic retreat. While "contextualism about causation" is a valid philosophical school, Bob's phrasing ("maybe that's fine... still deserve the name") reads more like exhaustion than a robust defense. It stalls the argument without resolving the tension.
  *   **(6) Carol: +2.** A devastating factual check. If the duty was shared (e.g., tiered escalation), Bob's "specific duty" criterion fails to single out Alice specifically. It exposes that the *system's* omission might be the real cause, not Alice's individually.

  **Verdict**

  **Carol wins the argument; Bob wins the workplace.**

  Carol dominates the metaphysical and logical ground. She successfully proves that "omissive causation" isn't the same beast as "physical causation" and that Bob's criteria for selecting Alice are fragile. However, Bob is operating in a *pragmatic* framework where "cause" is shorthand for "accountability locus." In a blameless post-mortem, Carol is right (the system failed). In a performance review, Bob is right (Alice missed the page).

  **The Cleaner Way: Mechanism vs. Explanation**

  The crux they talked past is the distinction between **Causal Mechanism** and **Causal Explanation**.

  1.  **Causal Mechanism (Carol's domain):** Physically, the outage was caused by the server bug *plus* the absence of a restart command. No human action physically forced the server to stay down; the lack of input did. In this strict sense, Carol is right that omissions aren't "pushes."
  2.  **Causal Explanation (Bob's domain):** When we ask "What caused this?" in a human context, we aren't asking for a physical inventory. We are asking for the **deviation from the expected model**. The "expected model" includes an on-call engineer responding. Alice's silence was the *deviation*; the 400 other employees sleeping was the *background norm*.

  **The Solution:** Stop using the word "cause" for both.
  *   **Root Cause:** The server bug + lack of automated recovery. (Technical)
  *   **Contributing Factor:** On-call process relied on a single point of human failure without escalation. (Systemic)
  *   **Accountability:** Alice missed the page. (Individual)

  Carol is right that Alice didn't physically "cause" the downtime. Bob is right that Alice is the **locus of responsibility**. They are both right, but they are using the word "cause" to do two different jobs.
