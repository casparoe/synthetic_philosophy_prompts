answer: |-
  Your nagging sense is correct. Your friend is pulling a classic move: taking a beautiful, rigorous mathematical result that applies to idealized agents in a vacuum and applying it to two tired humans arguing about politics at night.

  While your friend is technically correct about what the theorem *says*, he is almost certainly wrong about what it *means* for your argument. Using Aumann's Agreement Theorem to win a political debate is a bit like using the laws of thermodynamics to explain why your coffee got cold: technically related, but ignoring all the actual reasons (like the lid being off).

  Here is the breakdown of why your friend's argument doesn't hold water in the real world, even if the math is sound.

  ### 1. The Theorem in Plain English
  Robert Aumann (a Nobel Prize winner) proved that if two people are **Bayesian rationalists** (they update beliefs perfectly according to probability theory) and they have **common knowledge** of each other's beliefs, they cannot "agree to disagree." If they know what the other person thinks, and they know that the other person knows what they think, their probability estimates for any fact must converge to the same number.

  ### 2. The "Frictionless Plane" Problem
  The problem isn't the math; it's the assumptions. Aumann's theorem relies on conditions that are virtually impossible for humans to meet. It's like physics problems that start with "assume a frictionless vacuum." Useful for theory, useless for predicting how a ball rolls on grass.

  Here are the three big assumptions your friend is glossing over:

  **A. Common Priors**
  This is the biggest dealbreaker. The theorem assumes you and your friend started with the exact same "prior" probability distribution over the world before you saw any evidence. Essentially, it assumes you were born with the exact same brain, the exact same skepticism, and the exact same weighting of evidence, and only diverged because you saw different things.
  *   **Reality:** In politics, people often have different *values*, not just different facts. If you value individual liberty more than collective security (or vice versa), no amount of Bayesian updating will make you agree. Aumann's theorem applies to beliefs about *truth*, not beliefs about *value*.
  *   **Even on facts:** If you trust *The New York Times* more than *Fox News*, and he trusts *Fox News* more than *The New York Times*, you do not have common priors. You have different models of which sources are reliable. The theorem doesn't tell you who is right; it just says if you *were* identical reasoning machines, you'd agree.

  **B. Common Knowledge**
  In game theory, "common knowledge" is a very specific, heavy-duty term. It doesn't just mean "I told you what I think." It means:
  1.  I know your belief.
  2.  You know my belief.
  3.  I know that you know my belief.
  4.  You know that I know that you know my belief.
  5.  ...and so on, to infinity.
  *   **Reality:** In a two-hour argument, did you explicitly state your exact credence (e.g., "I am 73% sure this policy will work")? Did he? Did you both confirm you understood the other's exact number? Did you confirm that you both understood that you both understood? Almost certainly not. You were likely arguing past each other, using vague language. Without true common knowledge of posteriors, the theorem doesn't trigger.

  **C. Perfect Bayesian Rationality**
  The theorem assumes both parties update their beliefs flawlessly according to Bayes' Rule. No cognitive biases, no emotional reasoning, no fatigue, no motivated cognition.
  *   **Reality:** Humans are notoriously bad Bayesians. We suffer from confirmation bias, availability heuristics, and tribal signaling. The fact that you disagree doesn't prove *you* are the irrational one; it proves you are both human. Using the theorem to say "one of us is biased" is true, but it's equally likely to be *him* (or both of you), and the theorem gives no method to determine which.

  ### 3. The "Rationalist" Context
  It helps to understand where your friend is coming from. The "rationalist blogosphere" (communities centered around blogs like *LessWrong* or the writing of Robin Hanson and Eliezer Yudkowsky) treats Aumann's theorem as a sort of moral imperative. They argue that because disagreement is theoretically impermissible for ideal agents, persistent disagreement is a "sin" against rationality.

  However, even within that community, sophisticated thinkers acknowledge that Aumann is an ideal to strive for, not a weapon to bludgeon someone with. Robin Hanson, who popularized the idea of "Disagreement is Impermissible," has explicitly noted that in the real world, disagreement is often due to **different priors** or **computational limitations**, not necessarily dishonesty.

  When your friend used the theorem to say, "This proves you are biased," he committed a logical error. The theorem says:
  *If (Rational + Common Priors + Common Knowledge) → Then (No Disagreement).*

  Your friend is arguing:
  *We have (Disagreement) → Therefore (You are not Rational).*

  But it could just as easily be:
  *We have (Disagreement) → Therefore (We have Different Priors).*

  ### 4. Why Persistent Disagreement is Normal
  In politics, persistent disagreement is the default state, even among highly intelligent, honest people. This is because:
  1.  **Complexity:** The world is too complex to process all evidence perfectly. We rely on heuristics and trusted experts. Disagreeing on which experts to trust is not irrational; it's necessary.
  2.  **Incentives:** In politics, beliefs often signal group loyalty. "Reasoning straight" might actually be socially costly.
  3.  **Ambiguity:** Political outcomes are rarely falsifiable in the short term. You can't run a controlled experiment on a specific tax policy's 10-year effect. Without clear feedback loops, beliefs don't converge.

  ### The Verdict
  Your friend is using a theorem about **angelic mathematics** to judge **human sociology**.

  *   **Is he right that the theorem exists?** Yes.
  *   **Is he right that it applies to your argument?** No. The assumptions (common priors, common knowledge, perfect rationality) are not met.
  *   **Is he right that disagreement implies bias?** No. It implies human limitation, different values, or different trust networks.

  You can tell him: "Aumann's theorem assumes we have common priors and perfect rationality. Since we clearly have different priors on source reliability and we're both subject to human cognitive limits, the theorem doesn't apply. It describes ideal agents, not us."

  If he continues to insist that the theorem proves you're wrong, he's ironically demonstrating the very bias he's accusing you of: **motivated reasoning** to support his own sense of intellectual superiority.
