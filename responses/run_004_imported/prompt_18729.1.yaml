answer: |-
  1. **The Victim's Endpoint**
  In the novel, the collector ends up broke but holding the exact same painting he started with. Standard decision theory says he's irrational because his preferences are intransitive. You argue he's irrational because he failed to stick to a plan. But if the *outcome* is identical—same art, less money—does the label we put on the failure matter? Why should we care if the mechanism was a preference glitch or a plan glitch if the financial ruin is the same?

  *Follow-up (if she argues the mechanism matters for diagnosis):* If the mechanism matters, does that mean a collector could be financially ruined but *rationally vindicated* provided he lost the money while faithfully executing a plan? At what point does fidelity to a plan become pathological stubbornness rather than rationality?

  2. **The Sophisticated Alternative**
  A "sophisticated" chooser doesn't need resolve; they simply use backward induction. They see the money pump coming at trade C, so they decline trade A, and the cycle never begins. They escape the pump without ever needing to bind their future self. If sophistication avoids the loss without the heavy metaphysical lifting of resolute choice, why isn't sophistication the superior rational strategy?

  *Follow-up (if she argues sophistication is too restrictive):* You've suggested sophistication forces agents to miss out on beneficial opportunities because they fear future weakness. But doesn't resolute choice simply replace the fear of weakness with a risk of dogmatism? If the sophisticated agent avoids the trap by staying home, and the resolute agent walks through the trap unscathed, aren't we just trading one type of risk for another?

  3. **The Cost of Willpower**
  Resolute choice sounds remarkably like willpower. In psychology, willpower is a finite resource that depletes with use. If rationality requires a standing disposition to ignore local preferences, doesn't that make rationality expensive? If the cognitive cost of maintaining "resolve" exceeds the small fees the dealer is skimming, hasn't the agent still lost, even if they kept the painting?

  *Follow-up (if she argues willpower costs aren't part of the rational calculus):* If we exclude the psychological cost of being rational from the calculation, are you describing how humans *can* act, or positing an ideal agent who doesn't suffer from cognitive load? If it's the latter, how useful is this theory for the actual collectors in my book?

  4. **Preference in Disguise**
  Critics argue that your "disposition to see a plan through" is just a transitive preference for consistency by another name. Instead of preferring A over B, the agent prefers "Plans that include A" over "Plans that include B." If we can model your resolute chooser using standard transitive preferences over plans, haven't you just expanded the domain of standard theory rather than overturning it?

  *Follow-up (if she denies it's a preference):* If it's not a preference, what is the ontological status of a "plan"? Is it a mental state, a social contract with oneself, or a normative rule? If it's a rule, where does the rule come from if not from a higher-order preference?

  5. **The Meta-Pump**
  Let's assume the resolute chooser is immune to the standard money pump. But consider a dealer who knows the agent values their own resolve. Could the dealer charge a small fee simply for the *privilege* of maintaining that resolution—perhaps a membership fee to a club that enforces plan-keeping? If the agent pays to keep the disposition that saves them money, can't they be pumped for the very trait that protects them?

  *Follow-up (if she argues a true resolute chooser wouldn't pay):* So there is a threshold where maintaining resolve becomes irrational. Who sets that threshold? If the agent decides in the moment that the fee is "too high," aren't they back to making local comparisons, which was the vulnerability we were trying to escape?

  6. **New Information vs. Temptation**
  Resolute choice requires sticking to a plan unless new information arises. But in a money pump, the temptation to swap *feels* like new information—the painting looks better in the light, the dealer offers a compelling story. How does your theory distinguish between legitimate new information that warrants breaking a plan and mere temptation that must be resisted?

  *Follow-up (if she argues the distinction is clear in principle):* It may be clear in principle, but not in the moment of trade. If the agent can rationalize any temptation as "new information," doesn't resolute choice collapse back into standard choice theory where the agent just updates their preferences?

  7. **The Falsification Condition**
  To close: You've built a career defending resolute choice against the standard model. Decision theory is often criticized for being unfalsifiable mathematics rather than empirical science. What specific outcome, either in a lab experiment or in the real world of collectors and dealers, would finally convince you that resolute choice is the wrong framework and cause you to abandon the view?

  *Follow-up (if she offers a theoretical condition):* That's a theoretical boundary. I'm asking for an empirical one. If we ran a trial where resolute agents consistently lost more money than sophisticated agents in complex markets, would you concede that sophistication is the more *pragmatic* rationality, even if resolute choice is more *normatively* pure?
