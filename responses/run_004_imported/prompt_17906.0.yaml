answer: |-
  The rain battered the skylights of the courtroom, a rhythmic drumming that did nothing to soothe Julian Thorne. He sat at the defense table, his knuckles white around the edge of the wood. He was a mechanic, a man of grease and torque, not words. But Arthur Vance, the prosecutor, was a man of nothing but words.

  Vance paced the well of the court, holding a photograph of a severed brake line. The victim, billionaire Elias Sterling, was dead. His car had plunged off a coastal cliff. The prosecution's case was simple: Julian had cut the line. The defense's case was equally simple: the car was a death trap waiting to happen. Sterling was going to die that day regardless of Julian's presence.

  "Mr. Thorne," Vance said, stopping abruptly. He didn't look at the jury; he looked at his shoes, then slowly up at the witness stand where the defense's expert engineer sat. "You testified that the braking system was compromised prior to the incident. Corrosion. Wear. Correct?"

  "Substantial degradation," the engineer said.

  "So," Vance said, turning to the jury, his voice dropping to a conversational hum. "We agree on the outcome. The car crashed. Mr. Sterling is dead. Given that fact, tell me: If Julian Thorne didn't cut that brake line, someone else did. Or something else failed. True?"

  The engineer blinked. "Well, the car did crash. So yes, something caused it."

  "Objection," Julian's defense attorney snapped. "Speculative."

  "Overruled," the judge murmured, intrigued. "The witness is conceding the factual outcome."

  Vance smiled, a thin, predatory expression. "So we agree on the indicative. If Thorne didn't cut the line, the car crashed anyway. Because the car *did* crash. That is a statement of fact based on what we know."

  "I suppose," the engineer said, shifting in his seat.

  "Now," Vance said, walking closer to the stand. He placed the photograph on the railing. "Let's change the tense. Look at me. If Julian Thorne *hadn't* cut that brake line... would the car *have* crashed anyway?"

  The engineer hesitated. "I... I just said the brakes were degraded."

  "You said they were degraded. You didn't say they were failed. There is a difference between a worn brake and a severed line. One slows you down. The other invites gravity to take the wheel." Vance leaned in. "Answer the question. If he hadn't cut it, would Sterling be dead?"

  "Probably," the engineer muttered. "The probability of failure was high."

  "Probability," Vance repeated, tasting the word. "Not certainty. But you want this jury to believe inevitability. You want them to believe that if Thorne hadn't cut the line, someone else would have. That fate was sealed."

  "I'm saying the mechanical integrity was compromised."

  Vance turned to the jury, spreading his arms. "Listen closely. The defense wants you to believe that because the car is wrecked, the wreck was inevitable. They are asking you to confuse what *did* happen with what *would have* happened."

  He walked back to the center of the room. "It is true that if Thorne didn't cut the line, something else broke. We know this because the car is in pieces. That statement is true. But is it true that if Thorne hadn't cut the line, the car *would* have crashed?"

  Vance paused, letting the silence stretch. The rain hammered above.

  "Consider the drive," Vance continued. "Sterling drove that route every Friday for ten years. The brakes degraded over ten years. They held for ten years. On Friday, Thorne cuts the line. On Friday, the car crashes."

  He pointed a finger at the engineer. "You are asking this jury to accept that because the consequent is true—the death occurred—the antecedent is irrelevant. You are saying 'If not Thorne, then Fate.' But that is a lie of grammar. It is a lie of causality."

  Vance picked up a pen from the prosecutor's table. He held it vertically. "If I drop this pen, it falls. True. If I didn't drop this pen, it sits here. Also true. But if I say, 'If I hadn't dropped the pen, it would have fallen anyway,' I am lying. Unless there is a wind, or a magnet, or another hand."

  He dropped the pen. It clattered on the floor.

  "Thorne was the wind," Vance said softly. "The defense wants you to look at the broken pen on the floor and say, 'Well, it was going to break eventually.' But it wasn't on the floor until Thorne put it there."

  The defense attorney stood up. "Your Honor, counsel is arguing philosophy, not evidence."

  "I am arguing causation, which is the only evidence that matters!" Vance's voice cracked like a whip. He turned back to the engineer. "One last time. Distinguish the statements. Statement A: 'If Thorne didn't cut the line, the car crashed.' Statement B: 'If Thorne hadn't cut the line, the car would have crashed.' Are they the same?"

  The engineer wiped sweat from his brow. "In terms of outcome..."

  "In terms of truth!" Vance shouted. "Is Statement B true? If Thorne walks away that day, does Sterling die?"

  "No," the engineer whispered. "Not that day."

  "Not that day," Vance echoed. "So Statement A is true, because Sterling is dead. But Statement B is false, because Sterling would be alive."

  Vance turned to the jury. "The defense relies on you treating these sentences as identical. They rely on you thinking that because the result is fixed in history, the cause was fixed in nature. But it wasn't. If Thorne didn't do it, someone else did? Maybe. Maybe a bolt sheared. Maybe a pipe burst. That is the indicative. That is the world we live in."

  He walked to the defense table and placed a hand on Julian's shoulder. Julian flinched.

  "But if Thorne hadn't done it, would someone else have? Would the universe have conspired to kill Elias Sterling on that specific curve at that specific speed? No. There was no conspiracy. There was no inevitability. There was only a mechanic with a knife and a man who trusted him."

  Vance returned to the center. "The difference between those two sentences is the difference between an accident and a murder. One looks at the wreckage and asks what broke. The other looks at the choice and asks who broke it."

  He gathered his papers, the movement sharp and final. "The indicative tells you Sterling is dead. The counterfactual tells you Thorne killed him. Do not let the defense confuse the corpse with the cause."

  Vance sat down. He didn't look at Julian. He didn't look at the judge. He simply opened a file, the paper crisp and dry in the humid room. The distinction hung in the air, heavier than the rain, a logical trap sprung shut around the only man who mattered. Julian stared at his hands, realizing that while the car was definitely wrecked, the future where it wasn't had just been erased by a verb tense.
