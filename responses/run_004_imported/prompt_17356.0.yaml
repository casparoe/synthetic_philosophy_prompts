  10. **Final Polish:** Ensure clear headings and bold text for key points. (Proceed to generate output based on this structure.)
answer: |-
  This is one of the best objections in modern metaphysics, and your friend is right to be skeptical of "technicalities," but Lewis himself admitted this wasn't a nitpick—he called it a "bug" in his system that threatened to crash the whole engine.

  The problem isn't just math; it's that **Humean Supervenience** (chances depend on the whole pattern of events) and the **Principal Principle** (belief should match chance) logically contradict each other in specific cases.

  Here is a concrete, finite example you can use to show your friend why this breaks the logic of rational belief.

  ### The Setup: "The 100-Toss World"

  To make it concrete, let's simplify the universe. Imagine a world that consists of exactly **100 coin tosses** and nothing else.

  **1. The Humean Account of Chance (The Best System)**
  On Lewis's view, the "objective chance" is determined by the *Best System* that summarizes the entire history of the world (past and future).
  *   **Theory T:** Let's say the Best System for this world is: *"This coin has a 50% objective chance of landing Heads."*
  *   **Why is T the Best System?** Under Humean Supervenience, $T$ is only the Best System if the *actual total history* of the 100 tosses roughly matches a 50/50 distribution (say, between 40 and 60 Heads). If the history were 100 Heads, the Best System would be *"This coin has a 100% chance of Heads."*

  **2. The Situation**
  You are standing at **Toss #1**. You know the current Best System is $T$ (Chance of Heads = 50%). You have no "inadmissible" evidence (no crystal balls, no time travel). You just know the laws/chances as they stand now.

  **3. The Undermining Future**
  Consider a specific possible future, let's call it **Future $F$**: *The coin lands Heads on all remaining 99 tosses.*
  *   According to Theory $T$, this future is **possible**. It's unlikely ($0.5^{99}$), but it has a non-zero objective chance.
  *   **However**, if Future $F$ actually happens, the total history of the world becomes 100 Heads.
  *   If the total history is 100 Heads, then Theory $T$ ("Chance = 50%") is **false**. The Best System would have been "Chance = 100%."

  ### The Contradiction

  Now, let's apply the Principal Principle (PP). The PP says: *If you know the objective chance of $F$ is $x$, your credence (belief) in $F$ should be $x$.*

  Let's look at your rational credence in **Future $F$** (the all-Heads future), given that you know **Theory $T$** is currently true.

  1.  **What PP says:**
      According to Theory $T$, the chance of Future $F$ occurring is $0.5^{99}$ (a tiny, but non-zero number).
      Therefore, by the Principal Principle, your rational credence in $F$ should be **$0.5^{99}$**.
      $$C(F | T) = 0.5^{99}$$

  2.  **What Logic says:**
      You know that $T$ is true *now*. But $T$ is only true if the future *doesn't* undermine it. If Future $F$ happens, $T$ turns out to have been false (because the Best System would have been different).
      Therefore, if $T$ is true, $F$ **cannot** happen. $T$ and $F$ are logically incompatible.
      Therefore, your rational credence in $F$, given $T$, must be **0**.
      $$C(F | T) = 0$$

  3.  **The Crash:**
      $$0 \neq 0.5^{99}$$

  The Principal Principle tells you to have a non-zero belief in the future. Logic tells you that if the chance theory is true, that future is impossible. **You cannot obey the Principal Principle without being logically inconsistent.**

  ### Why This Isn't a Nitpick

  Your friend might say, "Okay, but $0.5^{99}$ is basically zero, so who cares?" Here is why it is a substantive philosophical disaster, not a rounding error:

  **1. It breaks the definition of "Admissible Evidence"**
  The Principal Principle has a clause: *Credence = Chance, given **admissible** evidence.*
  Usually, "admissible" means "information about the past and present, not the future."
  But in this example, you *don't* have future evidence. You only have the current chance theory ($T$). The problem is that **the chance theory itself contains hidden information about the future** because it's Humean.
  This means there is *no such thing* as purely admissible evidence for a Humean. Merely knowing the chances gives you inadmissible information about the future (specifically, it tells you the future won't undermine the chances). This makes the Principal Principle unusable in its original form.

  **2. It forces a choice between Metaphysics and Epistemology**
  This isn't just a math glitch; it forces you to abandon a core philosophical commitment:
  *   **Option A:** Reject Humean Supervenience. Say that chances are "propensities" or powers that exist *now* and don't depend on the future. (Lewis didn't want to do this).
  *   **Option B:** Reject the Principal Principle. Say that rational belief *shouldn't* always match objective chance. (Lewis didn't want to do this).
  *   **Option C:** Modify the Principal Principle. Lewis eventually chose this. He created the **"New Principle,"** which says you should match your credence not to the chance of the future, but to the chance of the future *given that the chance theory is true*.
      *   Old PP: $C(F | T) = \text{Chance}(F)$
      *   New PP: $C(F | T) = \text{Chance}(F | T)$
      *   Since $\text{Chance}(F | T)$ is 0 (because $F$ makes $T$ false), your credence becomes 0, and the contradiction vanishes.

  ### The Takeaway for Your Friend

  Tell your friend this:
  The undermining problem proves that if chances are just summaries of patterns (Humeanism), then **knowing the chance is not the same as knowing a standard probability.**

  Standard probabilities (like in a casino) assume the rules of the game stay fixed regardless of the outcome. Humean chances assume the rules of the game *depend* on the outcome.
  If the rules depend on the outcome, you can't use the rules to calculate the probability of the outcome without circularity.

  Lewis admitted this was a major failure of his original paper. It's not a nitpick; it's the reason he had to rewrite the core link between chance and belief in his later work (*"A Subjectivist's Guide to Objective Chance"* vs. later postscripts). If it were just a technicality, he wouldn't have changed his mind.
