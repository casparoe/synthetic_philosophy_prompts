      *   *Check:* Did I address Sofia's claim that truth might drive selection?
      *   *Correction:* Need to be careful here. If moral facts are non-natural (Platonic), they can't cause selection. If they are natural, they might. I need to highlight this distinction in the "Missing Considerations."
      *   *Check:* Is the advice practical for Ethics Bowl?
