prompt: |-
  I'm on my school's Ethics Bowl team, and this week our coach assigned a packet of background readings on moral realism before we start drafting our cases. One excerpt made a claim I hadn't run into before: dispositions like favoring our own kin, feeling loyalty to our in-group, or resenting free-riders are exactly what natural selection would have installed in us whether or not any of them track something objectively true, since simply having the feeling is what helped our ancestors survive, regardless of whatever moral reality it was supposedly picking up on. The suggestion was that this should make us doubt whether our moral convictions track real facts at all, rather than being side-effects of selection pressures that never had anything to do with truth.

  Two of my teammates, Kai and Sofia, ended up spending most of practice arguing about this instead of drilling our actual case. Kai thought the claim was sound, and pushed it further: he said it should make us suspicious even of intuitions we treat as bedrock, like "suffering is bad," since feeling that way would have paid off for our ancestors regardless of whether it's true. Sofia objected that the same logic applies to arithmetic and basic logic, since ancestors who counted reliably or reasoned validly out-survived those who didn't, yet nobody concludes from this that 2+2=4 is any less objectively true — so why single out morality? Kai replied that the two cases aren't actually parallel: with counting, selection favored the trait because it was accurate, since miscounting predators really did cost you, so truth-tracking explains why the trait spread; with kin-favoritism, the identical survival payoff would follow whether or not "kin deserve more" is true in any deeper sense, so accuracy never had to do any work in that story. Sofia's comeback was that this just assumes there's no fact that makes caring for kin genuinely good and that would, for that very reason, have been favored by selection too — if it really is true that caring for kin is good, we'd expect evolution to have pushed us toward feeling that way precisely because it's true, in which case Kai's claim that the payoff comes "either way" hasn't actually been established, only assumed.

  Practice ended before either of them budged, and I haven't been able to stop turning the exchange over since. Could you go through their disagreement move by move and say who has the better of it at each stage, rather than just declaring an overall winner? I'd also be curious whether there's some consideration neither of them raised that would help settle how much of a threat evolutionary explanations of morality really pose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a high school Ethics Bowl team. They received background readings on moral realism vs. anti-realism (specifically evolutionary debunking arguments).
      *   **The Core Issue:** An excerpt claims evolutionary pressures explain moral dispositions (kin favoritism, loyalty, resentment) regardless of their truth, suggesting we should doubt moral realism.
      *   **The Debate:** Two teammates, Kai (skeptic/anti-realist) and Sofia (realist), argued about this.
      *   **Kai's Argument:** Evolutionary explanations debunk moral intuitions (even "suffering is bad") because survival payoff doesn't require truth.
      *   **Sofia's Counter 1:** This applies to math/logic too (counting predators), but we don't doubt math.
      *   **Kai's Counter 1:** Math is different because accuracy *caused* survival (miscounting kills you). Morality is different because the *feeling* causes survival regardless of truth (kin favoritism helps genes spread even if "kin deserve help" is false).
      *   **Sofia's Counter 2:** This assumes there *isn't* a moral fact. If caring for kin *is* objectively good, evolution could have selected for it *because* it's good (or because the truth of it aids survival).
      *   **Task:** Analyze the disagreement move-by-move, assessing who has the better of it at each stage. Also, identify missing considerations that could help settle the threat level of evolutionary explanations.
      *   **Tone:** Educational, balanced, analytical, suitable for an Ethics Bowl student (clear, philosophical but accessible).

  2.  **Deconstruct the Arguments (Move-by-Move Analysis):**

      *   **Move 1: The Initial Claim (The Reading/Kai's starting point).**
          *   *Claim:* Evolution selects for adaptive behaviors/dispositions, not truth. Therefore, moral beliefs are likely false/unreliable.
          *   *Assessment:* This is the classic "Evolutionary Debunking Argument" (EDA), specifically the version associated with Sharon Street or Richard Joyce. It relies on the "insensitivity" of evolution to moral truth.
          *   *Verdict:* Strong starting point for skepticism, but relies on a specific view of what evolution selects for (behavior vs. belief).

      *   **Move 2: Sofia's Math Analogy.**
          *   *Claim:* If evolution undermines morality because it selects for survival, it undermines math/logic too. But math is objective. So the argument proves too much.
          *   *Assessment:* This is a standard realist counter-move (the "companions in guilt" or "parity argument"). It challenges the scope of the debunking.
          *   *Verdict:* Sofia scores a point here. It forces Kai to distinguish the domains. If he can't, skepticism becomes global (which is self-defeating or implausible).

      *   **Move 3: Kai's Distinction (Tracking vs. Utility).**
          *   *Claim:* Math tracks truth *to be* useful (counting wrong gets you eaten). Morality is useful *regardless* of truth (believing kin matter helps genes even if they don't objectively matter).
          *   *Assessment:* This is the crux of the EDA. It distinguishes between *instrumental reliability* (math) and *adaptive fiction* (morality). It hinges on whether moral truths would have causal efficacy in the physical world.
          *   *Verdict:* Kai strengthens his position. He successfully distinguishes math from morality based on the mechanism of selection. Math requires accuracy for utility; some moral instincts might not.

      *   **Move 4: Sofia's Rejoinder (The Coincidence/Correlation).**
          *   *Claim:* Kai assumes moral truths wouldn't aid survival. If "kin care" is *true*, maybe it's true *because* it aids survival (natural law?) or maybe truth and survival align.
          *   *Assessment:* This attacks the "independence" premise. It suggests a possible convergence between truth and fitness. However, it risks conflating "good" with "adaptive."
          *   *Verdict:* Sofia makes a valid philosophical point (the "third factor" or "pre-established harmony" possibility), but it's speculative. Kai's point about the *explanation* being sufficient without truth still holds weight.

  3.  **Identify Missing Considerations:**
      *   *Third-Factor Explanations:* (David Enoch, William FitzPatrick). Maybe evolution selected for survival, and survival is good. So evolution selected for something good, indirectly tracking truth.
      *   *Reflective Equilibrium:* We don't just accept raw instincts. We refine them through reason. Evolution gave us the raw material, not the finished theory.
      *   *The Nature of Moral Truth:* Is it Platonic (causally inert) or Naturalistic (reducible to well-being)? If naturalistic, evolution *does* track it.
      *   *Self-Defeat:* If evolution debunks morality, does it debunk the belief in evolution? Or the logic used to make the argument?
      *   *Phenomenology:* Moral experience *feels* like tracking truth. Does that count as evidence?

  4.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the debate. Validate that this is a central meta-ethical dispute (Evolutionary Debunking Arguments).
