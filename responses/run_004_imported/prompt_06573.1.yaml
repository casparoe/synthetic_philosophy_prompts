          *   Introduce "Reflective Equilibrium" (raw instincts vs. reasoned ethics).
          *   Introduce "Naturalistic Moral Realism" (redefining truth).
      *   *Conclusion:* Summarize the state of play. Encourage the team to use this in their case (anticipating objections).

  5.  **Refining the Tone:**
