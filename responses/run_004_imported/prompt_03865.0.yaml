  **Move 1 (Peter): Score 1**
  Peter articulates the Quinean criterion of ontological commitment clearly: if you quantify over entities in your best theories, you are committed to their existence. This is a robust realist opening. However, he overlooks the possibility of semantic deflationism or contextualism—that "exists" might function differently in abstract vs. concrete domains. He assumes univocality as a premise rather than arguing for it, which begs the question against an anti-realist like Miriam.

  **Move 2 (Miriam): Score 1**
  Miriam correctly deploys Rudolf Carnap's distinction between "internal" questions (within a linguistic framework) and "external" questions (about the framework itself). This is a coherent anti-realist strategy that blocks Peter's inference from truth to reality. What she overlooks is the difficulty in maintaining a sharp boundary between framework choice and factual belief; choosing a framework often *is* a belief about what facilitates truth, blurring her pragmatic/theoretical line.

  **Move 3 (Peter): Score 2**
  This is the strongest move in the exchange. Peter invokes the Quine-Putnam Indispensability Argument: if we accept entities (electrons) based on theoretical utility, consistency demands we accept numbers, which are equally indispensable to that theory. He effectively traps Miriam: either she accepts mathematical realism or she must undermine scientific realism. He overlooks only the nominalist option (that science could be reformulated without numbers), but that is a heavy lift for Miriam to carry.

  **Move 4 (Miriam): Score -1**
  Miriam retreats to the analytic/synthetic distinction ("fixed by logic" vs. "answerable to observation"), which is precisely the distinction Quine's holism (the basis of Peter's Move 3) rejects. She fails to address Peter's core point about *ontological commitment*; even if math is necessary and science contingent, both are posited for their utility in our overall web of belief. By focusing on revisability rather than indispensability, she misses the thrust of the argument and relies on a philosophical distinction that is widely considered untenable in this context.
