answer: |-
  This is a profound question that cuts to the heart of the Cambridge Platonist and voluntarist influences on Newton. You are correct to sense that the link is not immediately obvious: why should the internal constitution of the Godhead (Trinity vs. Unity) dictate the geometric structure of the vacuum?

  To make this intuitive, we have to look at the metaphysical stakes of the Cartesian system through Newton's theological eyes. For Newton, physics was not just about predicting planetary orbits; it was natural philosophy in the literal sense—an inquiry into the nature of Creation that had to remain consistent with the nature of the Creator.

  Here is the intuitive bridge between his Arianism/Voluntarism and Absolute Space.

  ### 1. The Cartesian Threat: Necessitarianism
  To understand Newton's move, we must first see what he was fighting against. Descartes identified matter with extension (*res extensa*). In the Cartesian view, you cannot have space without body, because "space" is just the extension of the substance itself.

  For a physicist, this creates a plenum (no vacuum). But for Newton the theologian, this created a **necessitarian** trap.
  *   If matter is *essentially* extension, then wherever there is extension, there is matter.
  *   This implies that the spatial framework of the universe is co-eternal and co-necessary with matter.
  *   Crucially, it limits God's omnipotence. If space is just a property of matter, God cannot annihilate matter without annihilating space itself. He cannot be "present" in a void, because a void is a contradiction in terms.

  To Newton, this smelled of Spinozism (which he detested). It made the structure of the universe necessary rather than contingent on God's will. It constrained the *Pantokrator*.

  ### 2. The Arian/Unitarian Constraint: The Unity of Dominion
  You noted Newton's insistence on "Dominion" in the *General Scholium*. This is the key. Newton's anti-Trinitarianism was not merely about scriptural exegesis; it was about **sovereignty**.

  In Newton's view (broadly Arian/Socinian), the Father is the supreme God, and the Son is the divine Vice-regent or Logos through whom the Father acts. The Father holds ultimate Dominion.
  *   **Trinitarian risk:** If the Son is co-equal and consubstantial, Newton feared this blurred the lines of authority. It risked making Godhood a shared essence rather than a singular rulership.
  *   **Cartesian risk:** If the universe is a self-sufficient plenum of extension (as Descartes suggested), God becomes a distant watchmaker or, worse, an immanent soul trapped within the geometry of matter.

  Newton needed a metaphysics where God remains distinct from Creation yet intimately present within it, ruling over it as a Lord rules over a kingdom. **Dominion requires a distinction between the Ruler and the Realm.**

  ### 3. Space as an "Emanent Effect" of God
  This is where Absolute Space enters. Newton needed space to be real (to allow for true motion and inertia, as you know from the *Principia*), but he could not make it a substance (that would be dualism or idolatry) nor a property of matter (that is Descartes).

  In his unpublished manuscript *De Gravitatione*, Newton defines space as an **"emanent effect of God."**

  Think of it this way:
  *   **Cartesian View:** Space is the shape of the furniture. No furniture, no shape.
  *   **Newtonian View:** Space is the **presence** of the Architect.

  For Newton, Absolute Space is not a "thing" independent of God; it is a consequence of God's existence. Because God exists eternally and is omnipresent, "Space" exists.
  *   **Theological Payoff:** This secures Omnipresence. God is not *in* space like a pilot in a ship; space *is* the mode of God's presence.
  *   **Physics Payoff:** This allows for a vacuum. Since space is a consequence of God's existence, not matter's extension, God can remove all matter (create a vacuum) and space remains, because God is still there.

  ### 4. The "Sensorium" and Dominion
  Now we can address the "sensorium" comment (from the *Opticks*, Query 28/31). Newton wrote: *"Does it not appear from phenomena that there is a Being incorporeal, living, intelligent, omnipresent, who in infinite space, as it were in his sensory, sees the things themselves intimately..."*

  This metaphor often horrifies modern readers (and horrified Newton's orthodox critics) because it sounds like God has a body. But read it through his voluntarist theology:
  *   A human perceives the world through a sensorium (nervous system) which connects the mind to external space.
  *   Newton is **not** saying God has nerves. He is saying that **Absolute Space is to God what the sensorium is to a human mind.**
  *   It is the medium of immediate presence and knowledge.

  **Why does this tie to Dominion?**
  If space were merely relational (Cartesian), God's knowledge and power would be mediated by the arrangement of bodies. He would only know what the bodies "tell" Him.
  By making space Absolute and Divine, Newton ensures that God has immediate access to every point of the universe simultaneously. He sustains the "stage" (Absolute Space) independently of the "actors" (Matter).
  *   **Dominion:** A King rules over a territory. If the territory (Space) is just the actors huddled together (Descartes), the King has no domain when the actors disperse. If the territory is Absolute (God's presence), the King's Dominion is eternal and infinite, regardless of where the matter is.

  ### 5. The Intuitive Synthesis
  As a physicist, you can view the connection this way:

  1.  **The Problem:** Descartes made the metric of the universe dependent on the distribution of mass (matter = extension). This makes the framework of physics contingent on the stuff within it.
  2.  **The Theological Constraint:** Newton's God is a Voluntary Sovereign (Anti-Trinitarian Unity). He creates freely. He is not bound by the essence of matter. He must be omnipresent to sustain the universe (Providence).
  3.  **The Solution:** Decouple the metric (Space) from the mass (Matter).
      *   Make Space an attribute of God's existence (Omnipresence).
      *   Make Matter a contingent creation placed *within* that Space.
  4.  **The Result:** Absolute Space. It provides the inertial frames required for the *Principia*, but metaphysically, it serves as the "throne" of God's Dominion.

  ### Summary
  The dispute over the Trinity matters for space because it is a dispute about **where sovereignty resides.**

  *   **Trinitarian/Orthodox/Cartesian tendency:** Tends toward a unity of essence that can blur the distinction between Creator and Creation (or Father and Son). In physics, this looks like God being immanent in the plenum of matter.
  *   **Newton's Arian/Voluntarist tendency:** Emphasizes the Father's distinct, supreme authority *over* the Son and *over* Creation. In physics, this requires a distinct, supreme framework (Absolute Space) that belongs to God, *over* which matter moves.

  Newton's Absolute Space is the physical manifestation of God's Unity and Dominion. It ensures that the universe is not a self-sufficient machine (Descartes), but a Kingdom sustained at every moment by the will of a single, sovereign Lord. The vacuum is not empty; it is full of God. And because it is full of God, it is absolute, immutable, and distinct from the matter that floats within it.
