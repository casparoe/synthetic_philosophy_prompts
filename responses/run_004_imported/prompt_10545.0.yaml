answer: |-
  Here are eight interview questions drafted for your guest, adhering to your specific topic constraints and including follow-ups keyed to her likely Adams/Edgington-style responses.

  **1. The Coherence of the Probability Claim**
  Lewis's 1976 triviality results demonstrate that no proposition can satisfy the Equation $P(\text{if } A, C) = P(C|A)$ without collapsing the probability function. You accept the Equation and deny the proposition. However, standard Kolmogorov probability is defined over a Boolean algebra of truth-apt propositions. When you write $P(\text{if } A, C)$, is this a strict probability function over a non-Boolean algebra, or are you using "P" to denote a distinct measure of *acceptability* that merely mimics probability calculus?
  *Follow-up:* You will likely say it is a measure of acceptability that obeys probability axioms. But if it lacks a truth-apt domain, doesn't that break the link between probability and logical validity, specifically regarding additivity across disjoint conditionals?

  **2. The Embedding Problem**
  If "If A, C" lacks a truth value, it theoretically cannot serve as a truth-functional operand. Yet speakers comfortably negate conditionals ("It's not the case that if A, C") or embed them in antecedents ("If it's true that if A then C, then D"). How does your view parse the logical form of these embeddings without assigning the embedded conditional a truth value it supposedly cannot have?
  *Follow-up:* You will likely suggest we paraphrase these into unembedded forms or treat them as suppositions about suppositions. But does this paraphrase strategy hold up for iterated conditionals in formal proofs, or does it force you to deny the validity of standard inference rules like Modus Ponens in embedded contexts?

  **3. Gibbard's "Sly Pete" Case**
  In Gibbard's riverboat case, two informants with different evidence assert incompatible indicatives ("If Pete called, he won" vs. "If Pete called, he lost"). A third party receives both reports. If these conditionals aren't truth-apt descriptions of the world, why does the third party treat them as jointly informative constraints on reality rather than merely two unrelated reports about the speakers' subjective psychological states?
  *Follow-up:* You will likely argue the third party updates on the *evidence* the speakers possess, not the conditionals themselves. But doesn't this imply the informational content of the conditional is fully reducible to evidence reports, rendering the conditional form itself semantically idle?

  **4. Sorting Criterion: Truth vs. Assertability**
  You assign truth conditions to counterfactuals but deny them to indicatives. In natural language, the distinction often relies on subtle mood markers or temporal distance, but speakers frequently conflate them (e.g., past indicatives about fixed events). What is your principled, non-circular criterion for sorting a specific utterance into the truth-conditional bin versus the assertability-conditional bin when the grammar is ambiguous?
  *Follow-up:* You will likely appeal to the "openness" of the antecedent or the speaker's epistemic stance. But consider a past indicative where the speaker *believes* the antecedent is open, but it is metaphysically fixed. Does the semantic status of the conditional shift based on the speaker's ignorance, or is it fixed by the world?

  **5. Decision Theory Implications**
  My listeners often encounter this debate through Evidential Decision Theory (EDT), which evaluates acts using $P(O|A)$—the very value the Ramsey test assigns to indicatives. If indicatives are merely expressions of conditional belief and not worldly facts, does this undermine the normative force of EDT, rendering it a theory of coherence rather than a guide to successful action?
  *Follow-up:* You will likely distinguish between deliberation and evaluation. But if the conditional doesn't track causal structure, isn't there a risk that maximizing "assertability" leads an agent to manipulate their own evidence rather than the world?

  **6. The Nature of Disagreement**
  If I assert "If A, C" and you assert "If A, not-C," and neither statement is true or false, in what sense are we genuinely disagreeing? It seems we are just reporting different conditional beliefs. How does your account capture the intuitive conflict in such a conversation without smuggling in truth conditions?
  *Follow-up:* You will likely frame this as a clash of incompatible commitments or pressure to converge. But if there is no fact of the matter we are aiming at, what prevents this from collapsing into a mere difference of taste, like "oysters are tasty" vs. "oysters are disgusting"?

  **7. The Counterfactual Asymmetry**
  You grant Stalnaker-Lewis truth conditions to counterfactuals ("If Oswald hadn't shot...") but deny them to indicatives ("If Oswald didn't shoot..."). Given that both often involve reasoning about alternative possibilities, why is the metaphysical commitment to possible worlds warranted for one mood but considered a category error for the other?
  *Follow-up:* You will likely argue counterfactuals involve a distinct cognitive process of "world-travel." But if the cognitive mechanism is similar (supposition), why does the semantic output differ so radically in kind (truth-apt vs. non-truth-apt)?

  **8. Learning and Update**
  Standard Bayesian updating involves conditionalizing on a proposition that becomes certain. If I learn that "If A, C" is highly assertable, but it is not a proposition, how do I update my credence function? Do I treat the *Equation* itself as the object of learning?
  *Follow-up:* You will likely suggest a form of Jeffrey Conditionalization or direct adjustment of the conditional ratio. But if the conditional probability is primitive, how do you handle cases where learning the conditional forces you to lower the probability of the antecedent itself (the "learning paradox")?
