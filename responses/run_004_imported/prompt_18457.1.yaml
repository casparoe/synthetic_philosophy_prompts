answer: |-
  # The Fat Devadatta Problem: A Verdict on Arthapatti

  You have stumbled into one of the most sophisticated debates in the history of epistemology. It is fitting that you arrived here via LessWrong and Bayesianism, because the dispute between the Naiyayikas and the Mimamsakas over *arthapatti* (postulation) is essentially a 7th-century argument about the difference between **inductive inference** and **abductive reasoning** (inference to the best explanation).

  The Naiyayikas want a clean, parsimonious ontology of knowledge. The Mimamsakas (specifically the Bhatta school of Kumarila Bhatta) want an ontology that respects the phenomenology of how we actually resolve contradictions.

  To give you the answer you asked for, I will first steelman both positions using their own internal logic and then translate them into terms that resonate with your Bayesian intuition. Finally, I will commit to a verdict.

  ### The Contenders

  **The Naiyayika Position: Parsimony (*Laghava*)**
  The Nyaya school, founded by Aksapada Gautama, is the realist-analytic tradition of Indian philosophy. They posit exactly four *pramanas* (means of valid knowledge): Perception (*pratyaksha*), Inference (*anumana*), Comparison (*upamana*), and Testimony (*shabda*).

  Their argument against *arthapatti* as a separate *pramana* is based on ontological parsimony (*laghava*). If a phenomenon can be explained by an existing category, positing a new category is a logical sin.

  The Naiyayikas argue that the Devadatta case is simply *anumana* (inference) with a hidden major premise. They reconstruct the syllogism (*pararthanumana*) as follows:
  1.  **Proposition:** Devadatta eats at night.
  2.  **Reason:** Because he is fat and does not eat during the day.
  3.  **Universal Connection (*Vyapti*):** Anyone who is fat and does not eat during the day must eat at night.
  4.  **Application:** Devadatta fits this description.
  5.  **Conclusion:** Therefore, Devadatta eats at night.

  For Nyaya, the *vyapti* (the invariable connection between the reason and the conclusion) does not need to be consciously articulated before the thought occurs. It can be latent. The mind perceives the fatness, recalls the biological necessity of food for fatness, notes the absence of day-eating, and infers night-eating. This is a standard causal inference. To call it *arthapatti* is merely to give a fancy name to a specific subtype of inference. The Buddhists (like Dharmakirti) agree here: all mediated knowledge is inference. If it relies on a reason (*hetu*), it is *anumana*.

  **The Mimamsa Position: The Anomaly (*Anupapatti*)**
  The Bhatta Mimamsakas, led by Kumarila Bhatta, defend the Vedic ritual order but developed a robust epistemology to do so. They argue that *arthapatti* is irreducible because the **logical vector** of the knowledge is fundamentally different from inference.

  In standard *anumana* (like seeing smoke and knowing fire), you move from a known sign (*linga*) to an unknown object. You rely on a previously established *vyapti*. You have seen smoke and fire together before.

  In *arthapatti*, you do not start with a sign. You start with a **contradiction** or an **anomaly** (*anupapatti*).
  *   Fact A: Devadatta is alive and fat.
  *   Fact B: Devadatta does not eat during the day.
  *   Conflict: A living, fat being cannot exist without eating. Fact A and Fact B are mutually unintelligible (*ghata*).

  The knowledge ("He eats at night") does not arise from a universal law connecting "fatness" to "night-eating." It arises from the **need to resolve the tension** between A and B. The Mimamsakas argue that there is no pre-existing *vyapti* here. We have never observed "fatness-plus-no-day-eating" invariably connected to "night-eating" in the abstract. We only know that *without* night-eating, the current state of affairs is impossible.

  For the Mimamsaka, *anumana* is projective (predicting an unobserved fact based on a observed sign), while *arthapatti* is reconciliatory (positing a fact to make observed facts coherent).

  ### The Bayesian Translation

  Since you came from the LW tangent, let's map this.

  **Nyaya is doing standard Bayesian Updating.**
  You have a hypothesis space. You observe evidence $E$ (Devadatta is fat). You have a likelihood function based on past observations (Fatness usually implies eating). You update the probability of the hypothesis $H$ (He eats at night). The *vyapti* is the causal model derived from past data. Nyaya says: "This is just normal probability updating."

  **Mimamsa is doing Constraint Satisfaction / Abduction.**
  Mimamsa argues that the cognition doesn't feel like updating a probability. It feels like resolving a system error.
  $P(\text{Fat} \mid \text{No Eating}) \approx 0$.
  The observation of Fatness + No Day Eating creates a logical probability of near-zero for the current state of the world. The mind *must* posit a new variable (Night Eating) to drive the probability of the observed state back up to 1.

  The Mimamsaka claim is that *anumana* relies on $P(H|E)$, whereas *arthapatti* relies on $P(E|H) \to 1$. In inference, the sign proves the conclusion. In postulation, the conclusion saves the phenomena.

  ### The Verdict

  So, who is right? Does *arthapatti* collapse into *anumana*?

  **I commit to the Mimamsaka position.** *Arthapatti* is a genuinely separate *pramana*.

  Here is why the Nyaya reduction fails, and why the Mimamsa distinction holds up under scrutiny.

  **1. The Direction of Necessity**
  The Nyaya reconstruction forces *arthapatti* into a syllogism, but it cheats on the *vyapti*.
  Nyaya says the major premise is: *"All fat people who don't eat by day eat by night."*
  But how do we know this universal truth *before* we solve the specific case? We don't. We know a biological necessity: *"No fat person can survive without eating."*
  From that biological necessity, combined with the exclusion of day-eating, we derive the night-eating.
  This is not a standard induction (Smoke $\to$ Fire). It is a **reductio ad absurdum** of the null hypothesis.
  If *anumana* is "A implies B," *arthapatti* is "Not-B makes A impossible, therefore B." The logical structure is distinct. Nyaya tries to hide this by bolting on a *vyapti* after the fact, but that *vyapti* is not the *source* of the knowledge; the *inexplicability* is the source.

  **2. The Phenomenology of Discovery**
  Epistemology is not just about the truth conditions of a proposition; it is about the *genesis* of knowledge (*janakatva*).
  When you see smoke, you look for fire. The cognition is outward-looking.
  When you see fat Devadatta not eating, you feel cognitive dissonance. The cognition is inward-looking, seeking coherence.
  If two cognitive processes feel different, operate on different logical vectors (prediction vs. explanation), and rely on different warrants (observed correlation vs. logical necessity of coherence), a rigorous epistemology ought to distinguish them. Nyaya sacrifices descriptive accuracy for ontological simplicity. Mimamsa accepts ontological complexity to preserve descriptive accuracy.

  **3. The Bayesian Edge**
  In modern terms, *anumana* is largely inductive/deductive reasoning within a fixed model. *Arthapatti* is **model repair**.
  When Devadatta's fatness contradicts his fasting, your current model of Devadatta is broken. *Arthapatti* is the mechanism by which you add a hidden variable to the model to restore consistency.
  In AI and Bayesian networks, distinguishing between "updating beliefs within a graph" (Inference) and "changing the structure of the graph to explain away an anomaly" (Postulation/Abduction) is crucial. The Naiyayikas conflate updating the graph with restructuring the graph. The Mimamsakas correctly identify them as distinct epistemic operations.

  ### Conclusion

  The Naiyayikas are right that *arthapatti* yields mediated knowledge, and thus broadly falls under "inference" in the English sense. But in the technical context of *Pramana Shastra*, where the specific *cause* of the cognition defines the *pramana*, they are wrong.

  The cause of inferential knowledge is the perception of the sign (*linga*) and the recollection of the *vyapti*.
  The cause of postulative knowledge is the perception of **inexplicability** (*anupapatti*).

  Because the causal trigger is different (a sign vs. a contradiction), the *pramana* is different. The Mimamsakas win because they recognized that **explanation** is not the same thing as **prediction**, even if both result in true beliefs. Devadatta eats at night not because we saw a sign of night-eating, but because the alternative is unintelligible. That is a unique way of knowing, deserving of its own name.

  So, keep *arthapatti* in your ontology. It is the ancient Indian precursor to Abduction, and the world needs more tools for resolving anomalies, not just predicting smoke.
