answer: |-
  # The Angelic Doctor and the Dagger: A Verdict on Aquinas and Tyrannicide

  The reputation of Thomas Aquinas as the medieval theologian who sanctified the assassination of tyrants is a persistent historical ghost. It haunts footnotes in political theory and fuels dramatic retellings of scholastic intrigue. The image is compelling: the great systematizer of Catholic doctrine, having built a fortress of natural law, leaves a sally port open for the righteous killer. However, when one moves from the secondary literature to the primary texts—the *Commentary on the Sentences*, *De Regimine Principum*, and the *Summa Theologiae*—the ghost dissolves into a bureaucrat. Aquinas does not hand a dagger to the revolutionary; he hands a writ of indictment to the magistrate.

  To determine whether the claim "Aquinas endorsed tyrannicide" is true, a myth, or conditionally valid, we must trace the evolution of his thought across these three key works. The trajectory reveals a thinker increasingly concerned with order, consequence, and jurisdiction. While Aquinas never absolutely closes the door on the removal of a tyrant, he constructs a framework so restrictive that the popular understanding of his position collapses. The verdict is that the claim is **only true under pretty narrow conditions**—conditions so specific that they effectively prohibit private tyrannicide in almost every conceivable scenario.

  The source of the "tyrannicide" legend lies primarily in Aquinas's early *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2). Here, the young Aquinas is at his most permissive. He draws a sharp distinction between a ruler who holds power legitimately but abuses it, and a usurper who seizes power without title. Regarding the usurper, Aquinas writes that killing him is not only permissible but praiseworthy, provided there is no superior authority to appeal to. He argues that the usurper has no claim to the common good, and thus removing him is an act of defense rather than murder.

  This passage is the smoking gun for those who claim Aquinas blessed political assassination. However, even here, the hedging begins. He limits this praise to *usurpers*, not legitimate kings who turn tyrannical. Furthermore, he includes the proviso that one must first check if a higher human authority exists to intervene. Yet, because this is an early commentary, it lacks the political maturity of his later works. It establishes a principle of resistance but lacks the safeguards he would later deem essential.

  In *De Regimine Principum* (On Kingship), likely written in the 1260s, Aquinas's tone shifts from theoretical permission to pragmatic caution. In Book I, Chapter 6, he addresses the problem of tyranny directly. While he maintains that a tyrannical government is unjust and not truly a government, he explicitly argues against private individuals taking it upon themselves to kill the tyrant. His reasoning is consequentialist: the attempt to kill a tyrant often fails, leading to harsher repression, or succeeds, only to invite a worse tyrant in the power vacuum. He cites the example of the assassination of Julius Caesar, noting that the removal of one tyrant led to the rise of many.

  Crucially, *De Regimine* introduces the requirement of public authority. Aquinas argues that the right to depose or punish a ruler belongs not to private zealots, but to the community or a superior authority. If the ruler was elected by the people, the people (or their representatives) may depose him. If the ruler is subject to a higher emperor or the Pope, appeal must be made to them. This moves the act from the realm of "tyrannicide" (which implies extra-legal killing) to the realm of "deposition" or "public execution." The dagger is replaced by the gavel.

  The final and most authoritative word comes in the *Summa Theologiae* (II-II, q. 42, a. 2 and q. 64, a. 3). In the question on sedition, Aquinas makes a revolutionary claim: resisting a tyrant is not sedition. He argues that the tyrant is the true seditionist, fostering discord to maintain power. Therefore, opposing him is not a sin against unity. However, in the question on killing, he reinforces the monopoly of public authority. Private individuals may not kill sinners or evildoers unless acting under the command of public authority.

  When these threads are woven together, the "narrow conditions" become clear. For Aquinas, the removal of a tyrant is licit only when:
  1.  **The Agent is Public:** It cannot be a private citizen acting alone. It must be a constituted body or a superior authority.
  2.  **The Title is Void:** It is far more justifiable against a usurper than a legitimate ruler who has become corrupt.
  3.  **The Consequence is Secure:** There must be reasonable certainty that the removal will not lead to a greater tyranny or social collapse.
  4.  **No Appeal Remains:** All avenues of legal or hierarchical appeal must be exhausted.

  If these conditions are met, Aquinas allows for the *removal* of the tyrant. Whether this necessitates *killing* is a further step he rarely explicitly endorses, preferring deposition.

  So, is the statement "Aquinas endorsed tyrannicide" true? If by "tyrannicide" we mean the popular conception—a righteous individual striking down a wicked king to save the people—then the statement is **mostly a myth**. Aquinas explicitly forbids private individuals from taking the law into their own hands, warning that such actions usually harm the common good they intend to save. He denies the moral legitimacy of the vigilante.

  However, if we define "tyrannicide" broadly as the licit removal and execution of a tyrant by legitimate public authority, then the statement is **true only under pretty narrow conditions**. Aquinas does provide a theoretical justification for regime change, but he bureaucratizes it. He removes the romanticism of the act and places it firmly within the machinery of law and hierarchy.

  The verdict, therefore, is that Aquinas did not endorse tyrannicide in the sense of sanctioning assassination. He endorsed **accountability**. He created a system where tyranny is illegitimate and resistible, but where the remedy must be surgical and institutional, not chaotic and private. The reputation of Aquinas as the patron saint of tyrant-slayers is a caricature constructed by later Scholastics (like Juan de Mariana) who stretched Thomistic principles further than Aquinas himself dared. Aquinas leaves the door to tyranny's removal unlocked, but he guards the threshold with such stringent requirements that only the most legitimate public authorities could pass through without sin. To claim he gave a general blessing to killing tyrants is to ignore the walls he built around the exception.
