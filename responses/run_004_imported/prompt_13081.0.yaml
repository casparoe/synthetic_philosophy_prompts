answer: |-
  This is a remarkably astute reading of the Hobbes-Wallis controversy. You have identified the precise philosophical nerve that made the feud so intractable: for Hobbes, geometry was not merely a technical discipline but the epistemological foundation of his entire materialist system.

  To answer your questions directly: **No, neither discovery fundamentally threatens Hobbes's epistemological argument regarding the source of geometric certainty, though Non-Euclidean geometry complicates his metaphysics.** And regarding his temperament: **No, he almost certainly would never have conceded, because to do so would have required dismantling his entire philosophical edifice.**

  Here is a breakdown of why your intuition holds up, and where the nuances lie.

  ### 1. The Epistemological Argument: Does it survive Lindemann and Non-Euclidean Geometry?

  Hobbes's core claim is what modern philosophers might call a form of **constructivism** or **conventionalism**. In *De Corpore*, he argues that we have certain knowledge in geometry because we generate the objects of study ourselves. We define the circle; we construct the line. In natural philosophy (physics), we are passive observers guessing at the causes of effects generated by God or Nature. In geometry, we are the "cause" of the truths we discover.

  **The Lindemann Proof (1882)**
  Lindemann's proof that $\pi$ is transcendental demonstrated that squaring the circle with compass and straightedge is logically impossible within the rules Hobbes accepted.
  *   **Does this hurt Hobbes's epistemology?** Paradoxically, it reinforces it. Hobbes argued that geometry yields *certainty*. A proof of impossibility is a form of absolute certainty. If geometry can demonstrate definitively that a task *cannot* be done, it validates Hobbes's claim that geometry is a realm of demonstrable truth, unlike the probabilistic hypotheses of natural philosophy.
  *   **The Damage:** The damage is to Hobbes's *competence*, not his *theory of knowledge*. Lindemann proves Hobbes was a bad geometer, not that his understanding of what makes geometry certain was wrong. In fact, the rigorous proof of impossibility is the ultimate triumph of the "certainty via definition" model Hobbes championed.

  **Non-Euclidean Geometry (19th Century)**
  This is the more philosophically potent challenge. When Gauss, Bolyai, and Lobachevsky showed that consistent geometries exist where Euclid's parallel postulate fails, it severed the link between "logical consistency" and "physical necessity."
  *   **The Threat:** Hobbes was a materialist. He did not view geometry as a mere game of symbols; he believed Euclidean geometry described the actual structure of real space and matter. He thought he was discovering the necessary laws of magnitude that govern the physical universe.
  *   **The Escape Hatch:** However, your specific point about "authorship of definitions" actually survives this quite well. Non-Euclidean geometry supports the idea that geometry is determined by its axioms (definitions), not by empirical observation. If Hobbes had been purely an epistemological constructivist, he could have said, "Exactly! We define the axioms, and the consequences follow necessarily."
  *   **The Real Conflict:** The conflict arises because Hobbes believed Euclidean geometry was the *only* true description of space. Non-Euclidean geometry suggests that while we author the definitions, we do not author the physical space those definitions might (or might not) map onto. This weakens his *metaphysics* (his claim that the world *is* geometric in a specific Euclidean way) more than his *epistemology* (his claim that geometric reasoning yields certainty).

  **Verdict:** Hobbes's argument that geometry is certain *because* we construct its definitions remains robust. In many ways, the formalism of 19th-century mathematics vindicates the idea that math is a system of reasoning from stipulated definitions. Hobbes fails only in his belief that his specific definitions (Euclid's) were the sole keys to the physical universe.

  ### 2. The Temperament: Would he have conceded?

  You ask whether Hobbes would have dug in. The historical consensus, supported by scholars like Douglas Jesseph (whose book *Squaring the Circle: The War Between Hobbes and Wallis* is the definitive account), is that concession was psychologically and systematically impossible for him.

  **The Systemic Stakes**
  It is a mistake to view the feud as mere vanity. Hobbes's political philosophy (*Leviathan*) rests on his scientific method (*De Corpore*).
  1.  **The Method:** Hobbes claimed to have discovered the "Galilean" method of resolving and composing causes, which he believed was perfectly instantiated in geometry.
  2.  **The Application:** He argued that political philosophy could achieve the same certainty as geometry if we properly define our terms (e.g., "justice," "sovereign") and reason from them.
  3.  **The Vulnerability:** If Hobbes admitted he could not do geometry, he undermined the claim that his method yielded certainty. If the method fails in the realm where certainty is supposed to be easiest (math), why should anyone trust it in the complex realm of politics?
      *   To concede to Wallis was to admit that his "Science of Politics" might be as flawed as his "Science of Geometry."

  **The Psychological Profile**
  Hobbes was deeply sensitive to the charge of atheism and materialism. He viewed the universities (and Wallis, an Oxford professor) as hotbeds of "vain philosophy" and religious sedition.
  *   **Ad Hominem as Defense:** Hobbes frequently attacked Wallis's character (calling him a "drunken minister" and questioning his competence) rather than engaging solely with the math. This wasn't just petulance; it was a defense of his status as a philosopher against what he saw as ignorant technicians.
  *   **Age and Rigidity:** The feud spanned the last 25 years of his life. He was in his 60s when it began and in his 80s when he was still publishing defenses of his errors (*Dialogus Physicus*). By the time Lindemann's proof would have been available, Hobbes had been dead for two centuries, but even in his own lifetime, as the mathematical community unified against him, he became more entrenched, not less.

  **The "Error" as Feature, Not Bug**
  There is evidence that Hobbes came to view the controversy as a test of will. He famously stated that he would not accept a proof unless he could "see" the construction. He distrusted the algebraic symbolism Wallis used (which was becoming the standard) because it lacked the visual immediacy of the compass and straightedge. To concede would be to admit that the new symbolic algebra was superior to his visual constructivism—a methodological surrender he was unwilling to make.

  ### Conclusion

  Your reading is correct: Hobbes's philosophical insight into *why* geometry is certain (human authorship of definitions) is distinct from his failure to *perform* geometry correctly.

  1.  **Lindemann** validates the power of geometric proof (certainty of impossibility) while condemning Hobbes's specific work.
  2.  **Non-Euclidean Geometry** validates the idea that geometry flows from definitions (supporting Hobbes's epistemology) while undermining his claim that Euclidean space is the unique physical reality (damaging his metaphysics).
  3.  **Concession:** Hobbes would never have yielded. To admit error in geometry was to pull the keystone from the arch of *Leviathan*.

  Hobbes remains a tragic figure in the history of ideas: a towering political philosopher whose desperate need to be recognized as a natural scientist led him into a quagmire that distracted from his genuine genius. He was right that geometry is the science of what we make, but he failed to realize that to be a geometer, one must submit to the rules of the very game one claims to author.
