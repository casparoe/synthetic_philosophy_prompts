answer: |-
  The sun was just cresting over the Umayyad Mosque when Clara and Eli found a quiet table at a café near the old straight street. The air was cool, smelling of cardamom coffee and dust. They looked tired. The argument from the night before had followed them into their sleep.

  Eli stirred his coffee, the spoon clinking against the ceramic. "I've been thinking about what you said last night. About Causal Decision Theory accepting that there is no ratifiable act."

  Clara wrapped her hands around her mug. "It's the only honest conclusion, Eli. In this scenario, the agent is doomed. CDT admits that. It says, 'Your causal influence is zero. Death has already decided.' So it tells you to maximize expected utility based on your unconditional credences. Since you think Death is equally likely to be in either city, it says, 'Indifference. Pick either.' It doesn't promise survival."

  "But that's the embarrassment," Eli said, leaning forward. "A normative theory is supposed to guide action. If your theory looks at a choice and says, 'Neither option is stable. If you choose Aleppo, you'll wish you'd chosen Damascus, and vice versa,' then you haven't given me a reason to act. You've given me a reason to despair. Richard Jeffrey built ratifiability for exactly this reason. An act is only rational if, once you've decided to do it, you don't regret it given the evidence that decision provides. In Death in Damascus, CDT leaves the agent with *no* ratifiable options. How is that not a reductio?"

  Clara sighed. "Because the alternative is worse. Look at what Evidential Decision Theory does. You told me last night the agent should go to Aleppo. But why? Because if he goes to Aleppo, that's evidence Death is in Aleppo, so he dies. So he should go to Damascus. But if he goes to Damascus, that's evidence Death is in Damascus. So your theory recommends an endless oscillation. 'Keep switching until you collapse of exhaustion.' Is that practical advice? Or is it a symptom that EDT is conflating news with control?"

  "It's not endless if you model deliberation properly," Eli countered. "You're treating the decision as a snapshot. But agents deliberate over time. Brian Skyrms showed us this. Deliberation is a dynamic process. I adjust my probabilities based on my current inclination, which updates my expected utilities, which changes my inclination. In many cases, that process converges on an equilibrium."

  "In this case, it doesn't converge," Clara said. "It cycles. Because the better option is always the one you aren't currently inclined toward. The equilibrium point would be a mixed strategy—flipping a coin. But if Death is an infallible predictor, he predicts the coin flip too. So even the mixed strategy isn't ratifiable. If I decide to randomize 50/50, Death knows that, and he'll be wherever the die lands. So conditional on my randomizing, my expected utility is still death. Skyrms's dynamics just show you spinning in circles faster."

  Eli paused, taking a sip of coffee. He looked out at the street, where a vendor was setting up a cart. "Okay. Suppose I grant you that pure EDT leads to oscillation without some modification. That's why we have the Tickle Defense. Eells argued that the correlation between my act and Death's location is screened off by my internal mental state—the 'tickle' that causes the act. Once I introspect and know *why* I'm choosing Aleppo—say, a sudden urge for fresh air—that internal state is the common cause. Conditional on that urge, my act provides no *new* evidence about where Death is."

  Clara shook her head slowly. "The Tickle Defense works in Newcomb's Problem, maybe. But not here. In Newcomb's, the predictor puts money in the box *before* you choose. Here, Death is predicting *you*. If Death is truly infallible, he doesn't just predict the act; he predicts the causal chain leading to the act. He predicts the tickle. He predicts your introspection. If your urge for fresh air is the cause of your going to Aleppo, and Death predicts you'll go to Aleppo, Death predicted you'd have that urge. So conditioning on the urge doesn't screen off the correlation. The evidence remains: if I have the 'Aleppo urge,' Death is in Aleppo."

  "So you think the agent is just trapped?" Eli asked. "CDT says 'It doesn't matter,' EDT says 'You're dead either way, but also you can't decide.' Where is the rationality in that?"

  "The rationality is in recognizing the limits of agency," Clara said firmly. "CDT tells the truth: you cannot causally influence Death's past decision. Worrying about the evidential correlation is like worrying that sneezing causes rain because sneezes and rain are correlated in the winter. EDT treats the correlation as a lever. CDT realizes there's no handle to grab. Yes, neither act is ratifiable. That's tragic. But it's the world that's tragic, not the theory. A theory shouldn't have to lie and say there's a safe choice when there isn't one."

  "But 'indifference' isn't a choice," Eli pressed. "If I tell my friend, 'CDT says you're indifferent, so just pick one,' and he picks Aleppo and dies, he can turn to me from the grave and say, 'But if I had picked Damascus, I would have had the same evidence I'd die. So why did you tell me to pick Aleppo?' CDT can't answer that. It has no tie-breaker. It leaves the agent paralyzed by symmetry."

  "EDT leaves him paralyzed by recursion," Clara shot back. "At least CDT lets him walk out the door. He dies, but he dies having made a decision. Your theory keeps him inside arguing with himself until Death comes to get him."

  Eli smiled faintly. "Is that the metric? Efficiency of demise?"

  "It's a metric of action," Clara said. "Decision theory is about deciding. If your formalism outputs a loop, it's failed to output a decision."

  "Maybe," Eli conceded. "But consider the normative weight. If a theory tells me to do X, but also tells me that if I do X, the expected utility of X drops below Y, the theory is self-undermining. That's what non-ratifiability is. It's a form of practical inconsistency. CDT tolerates that inconsistency in this case. You're asking the agent to accept a recommendation that they know, by the theory's own lights, looks suboptimal once adopted. That asks too much of rationality."

  "And EDT asks the agent to believe they can change the past by changing their mind," Clara replied. "Look, let's step back. Why do we care about ratifiability? Because we want our decisions to be stable. We want to be able to stand by them. In Death in Damascus, stability is impossible because the environment is hostile to stability. Death is adversarial. If I demand a ratifiable act in an adversarial environment where the adversary knows my mind, I'm demanding a square circle."

  "Or," Eli said, "I'm demanding that a decision theory account for the fact that being rational can make you worse off. That's the real lesson of Death in Damascus. It's not that CDT is right and EDT is wrong. It's that if you are transparent to a predictor, rationality doesn't save you. But EDT at least acknowledges the correlation. It says, 'Your choice is bad news.' CDT says, 'Your choice is irrelevant.' But the choice *is* relevant evidence. Ignoring evidence because it lacks causal power feels like... willful blindness."

  "It's not blindness, it's focus," Clara said. "I can only move my legs. I can't move Death's past decision. If I focus on the evidence my leg movement provides, I'm engaging in magical thinking. I'm treating my will as a signal rather than a force. CDT preserves the distinction between manipulating the world and reading the world. In this case, you can't manipulate. So CDT says, 'Maximize based on what you can't change.' It's humble."

  "Humble, or defeatist?" Eli asked. "If I'm playing poker against someone who can read my micro-expressions, EDT says 'mask your expressions' or 'randomize.' CDT says 'Your cards are your cards, bet based on their value.' But if they can read you, the value of the bet depends on the tell. You can't separate the act from the evidence of the act when the opponent is a predictor."

  "Then you lose," Clara said simply. "And no decision theory gives you a winning strategy against an infallible adversary who knows your strategy. The fact that CDT admits this cleanly, without promising a ratifiable haven that doesn't exist, is its virtue. It tells you: 'You are in a lose-lose scenario. Here is how to calculate the loss. Minimize regret, but expect death.'"

  Eli sat back, watching the smoke from a nearby cigarette drift into the morning light. "So we agree on the outcome. The man dies. We agree on the prediction. Death is infallible. We disagree on what the man should *think* while he waits for the end."

  "Basically," Clara said. "I think he should think, 'I have no causal power here, so I'll go where I prefer.' You think he should think, 'My choice is evidence of my death, so I should try to choose the thing that isn't evidence of my death,' which is impossible."

  "And that impossibility is the point," Eli said. "It shows that rationality requires a certain opacity from the world. If the world knows you too well, evidential reasoning collapses. But Causal reasoning collapses into arbitrariness. Neither gives a unique, stable, ratifiable recommendation."

  "CDT gives a unique recommendation: Indifference," Clara corrected. "It's just that the utility of the recommendation is grim."

  "Indifference between two death sentences isn't a recommendation," Eli said softly. "It's a shrug."

  "Maybe," Clara said, finishing her coffee. "But a shrug is better than a seizure. EDT makes the agent seize up. CDT lets him walk."

  "And yet," Eli stood up, tossing a few lira on the table. "If I know that walking leads to Death, and staying leads to Death, and running leads to Death... the theory that tells me 'It doesn't matter' feels less like wisdom and more like giving up. I'd rather have a theory that tells me the game is rigged than one that pretends the dice aren't loaded."

  "CDT knows the dice are loaded," Clara said, standing as well. "It just refuses to believe that wishing on the dice changes the load."

  They walked out of the café together into the Damascus morning. The street was busy now, full of people making choices that felt, to both of them, significantly less fraught than the one they had been discussing. But as they parted ways at the corner, neither seemed entirely satisfied. The puzzle remained, a jagged edge in the smooth fabric of their morning, reminding them that when prediction becomes perfect, the very idea of a rational choice begins to fray.

  "See you tonight?" Eli asked.

  "Only if you promise not to mention Death," Clara said.

  "No promises," Eli replied, and they walked off in opposite directions, each wondering if the other had taken the safer path.
