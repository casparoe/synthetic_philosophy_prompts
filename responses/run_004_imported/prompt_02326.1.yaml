answer: |-
  This is a fantastic lineage to trace, and you are absolutely right to spot the direct conceptual through-line from Keynes's *Treatise on Probability* to Ellsberg's paradox. It is one of those great "what ifs" in the history of economic thought: had Keynes lived another decade, or had Ellsberg read Keynes more closely before tangling with Savage, the development of decision theory might have taken a very different path.

  To answer your two questions directly: **Yes, Keynes would have viewed Ellsberg's results as a vindication of the "weight of argument," and no, he would almost certainly not have classified ambiguity aversion as "irrational."** In fact, he likely would have argued that the *mainstream decision theorists* were the ones being irrational by ignoring the weight of evidence.

  Here is the breakdown of why Keynes would have taken that stance.

  ### 1. The Weight of Argument vs. The Probability Value
  You nailed the core distinction. In the *Treatise*, Keynes argues that probability is a logical relation between evidence and hypothesis, not just a frequency or a subjective degree of belief. Crucially, he distinguishes between the *probability* of a proposition (the numerical value) and the *weight* of the argument (the amount of evidence supporting that value).

  In the Ellsberg urn setup:
  *   **Urn A (Known 50/50):** High probability value (0.5), **High Weight** (complete information about the constitution of the urn).
  *   **Urn B (Unknown Ratio):** High probability value (0.5, by the principle of indifference), **Low Weight** (zero information about the constitution of the urn).

  For Savage and the Subjective Expected Utility (SEU) crowd, these two states are identical. If you assign a subjective probability of 0.5 to drawing red from Urn B, you must bet the same way as Urn A to be "coherent."

  Keynes would look at this and say Savage is committing a category error. He explicitly writes in the *Treatise* that as the weight of evidence decreases, our confidence in the probability estimate should decrease, even if the numerical estimate remains the same. He argues that rational action requires considering both the expected value *and* the weight. Ellsberg's experiment essentially isolates "weight" as a variable and shows that humans price it. Keynes would see this not as a bias, but as people correctly intuiting that a 50% chance based on data is fundamentally different from a 50% chance based on ignorance.

  ### 2. Rationality: Coherence vs. Prudence
  This is the crux of your second question. Why does mainstream decision theory call ambiguity aversion "irrational"? Because it violates the **Sure-Thing Principle** and opens the agent up to "Dutch Book" arguments (a series of bets that guarantee a loss). In the axiomatic framework, rationality is defined as **logical consistency**.

  Keynes, however, defined rationality closer to **prudence given the logical relations of evidence**.

  In Chapter 6 of the *Treatise*, Keynes discusses how weight affects action. He admits it's hard to formalize mathematically, but he insists that "a higher probability does not always mean a stronger argument." He suggests that when weight is low, a rational actor should demand a higher margin of safety or simply refrain from action.

  If you apply this to Ellsberg:
  *   **The SEU View:** Betting differently on the two urns is inconsistent, therefore irrational.
  *   **The Keynesian View:** Betting the same on the two urns ignores the difference in evidence quality, therefore irrational (or at least imprudent).

  Keynes would likely argue that the "irrationality" label is an artifact of a model that is too thin to capture reality. He was famously skeptical of applying mathematical precision to situations where the evidence doesn't support it (a theme he returns to in *The General Theory*). He would probably view the Savage axioms as a beautiful logical system that fails to map onto the epistemology of the real world.

  ### 3. The *General Theory* Connection: Confidence and Investment
  The strongest evidence for how Keynes would react to Ellsberg comes from his later work, *The General Theory of Employment, Interest and Money* (1936).

  In Chapter 12, Keynes discusses long-term investment and explicitly revives the "weight of argument" concept, though he calls it the **"state of confidence."** He argues that investment decisions aren't just based on the expected yield (the probability value) but on how much confidence we have in that forecast (the weight).

  He writes:
  > "Our knowledge of the factors which will govern the yield of an investment some years hence is usually very slight and often negligible. If we speak frankly, we have to admit that our basis of knowledge for estimating the yield ten years hence of a railway, a copper mine, a textile factory... amounts to little and sometimes to nothing."

  He goes on to say that because this knowledge is low-weight (ambiguous), markets are subject to sudden collapses in confidence. This is macro-level ambiguity aversion. If Keynes thought ambiguity aversion was a "glitch" in rationality, he wouldn't have built it into the foundation of his explanation for why capitalist economies suffer from involuntary unemployment. He viewed the reluctance to act under uncertainty as a fundamental, rational feature of human psychology in a complex world, not a bug to be arbitraged away.

  ### 4. Knight vs. Keynes vs. Ellsberg
  It is worth noting the nuance you brought up regarding Frank Knight. Knight's *Risk, Uncertainty, and Profit* (also 1921) draws the line between measurable risk (insurable) and unmeasurable uncertainty (profit source).
  *   **Knight** was an economist focusing on market structures and entrepreneurship.
  *   **Keynes** was a logician/economist focusing on the epistemology of belief.
  *   **Ellsberg** was a decision theorist focusing on axiomatic consistency.

  Ellsberg provided the empirical/experimental proof that Knight and Keynes had only theorized. Keynes would likely have appreciated Ellsberg's rigor. One of Keynes's frustrations in the *Treatise* was his inability to formalize "weight" into a calculus. Ellsberg showed that while it might break Savage's calculus, it creates a predictable, consistent behavioral pattern.

  ### The Verdict
  If you were to summon the ghost of Keynes for your piece, he would likely tell you that the post-war decision theorists (Savage, Arrow, etc.) engaged in a "pretence of exactness."

  He would argue that **ambiguity aversion is a rational heuristic for navigating a world where the "weight of evidence" varies.** To treat a guess based on ignorance as equivalent to a calculation based on data is, in the Keynesian view, the true irrationality. He would likely have embraced the Ellsberg Paradox not as a paradox at all, but as a correction to a flawed definition of rationality.

  For your piece, the hook is potent: **Ellsberg didn't just find a glitch in human psychology; he found the behavioral footprint of Keynes's "weight of argument."** The tragedy of modern decision theory is that it spent 40 years trying to "fix" the human to fit the model, rather than fixing the model to fit the human (and Keynes).
