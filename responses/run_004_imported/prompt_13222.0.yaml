      *   *Section 3: De Botton & Sunday Assembly.* This is her "Religion of Humanity." But add a caveat: Eliot was serious. De Botton can be pop-psych. She'd want the *weight* of duty, not just the comfort of community.
      *   *Section 4: The "Duty" Imperative.* Return to the "God, Immortality, Duty" triad. Duty is the anchor. Modern atheism often drops Duty along with God. Eliot keeps Duty *because* God is gone.
