prompt: |-
  So I fell down a wikipedia hole on Rousseau's beef with d'Alembert over whether Geneva should get a theatre, and it turns out his actual argument is way more specific than just 'plays are immoral.' He's got this whole bit about acting being corrupting because the actor's entire job is to counterfeit emotions that aren't his own for money and applause, and he contrasts that with these outdoor civic festivals he loved, where the crowd is basically both the performers and the audience at once, no stage or separation needed. Given those specific arguments (not just the generic 'Rousseau thinks civilization corrupts us' take), what do you reckon he'd make of Twitch/YouTube livestreaming culture today? Would he lump streamers in with the actors he despised, since they're basically performing a persona for strangers for money, or does the live chat/donations thing actually satisfy the participatory itch he was going for? Curious how his actual logic plays out here rather then just a 'old dead guy hates screens' answer.
