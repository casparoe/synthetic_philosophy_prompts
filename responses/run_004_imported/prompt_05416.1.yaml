      *   *Kripke's Critique:* Kripke argued in *Naming and Necessity* that names are rigid designators. They point directly to the object without a mediating description or sense. "Hesperus is Phosphorus" is a necessary truth (if true at all), known *a posteriori*.
      *   *The User's Interpretation:* The user thinks Kripke's view makes the identity statement trivial ("a=a wearing a trench coat") and thus the *surprise* unjustified.
      *   *The Correction:* This is a common misunderstanding of Kripke. Kripke agrees that "Hesperus is Phosphorus" is *informative*. He just disagrees with Frege about *why*. For Frege, it's informative because it links two senses. For Kripke, it's informative because it's an *a posteriori* necessary truth. We didn't know the reference was the same until we investigated the world.
      *   *Conclusion on Philosophy:* The protagonist's surprise is *not* unjustified under Kripke. In fact, Kripke explicitly accounts for the cognitive significance of identity statements. The discovery changes the protagonist's epistemic state, even if the metaphysical reality was always "a=a".

