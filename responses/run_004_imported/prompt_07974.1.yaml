answer: |-
  **MEMORANDUM**

  **TO:** Capstone Committee, Department of Computer Science
  **FROM:** [Your Name], Student Representative, Formal Methods Concentration
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Classical Axioms in Capstone Formalizations

  **1. Purpose**
  This memo addresses the policy question raised by last year's capstone incident regarding the use of classical axioms (specifically the Law of Excluded Middle and Axiom of Choice) in Coq formalizations destined for code extraction. Following discussion with faculty and peers, I propose a stratified policy distinguishing between *specification-level* reasoning and *computational* content.

  **2. Background**
  Last year, a team verifying a root-finding routine imported the Law of Excluded Middle (EM) to case-split on real number comparisons ($x < y$, $x = y$, $x > y$). While the proof of correctness succeeded, the extracted OCaml code contained an inert stub at the case-split point. Because equality on arbitrary reals is undecidable, no algorithm can implement this branch. Consequently, the "verified" program failed to execute on valid inputs.

  This has precipitated a debate between two positions:
  *   **Position A:** Ban classical axioms entirely in proofs destined for extraction. An existence proof without a witness (per the Brouwer–Heyting–Kolmogorov interpretation) is insufficient for program synthesis.
  *   **Position B:** A blanket ban conflates engineering constraints with metaphysical claims. Classical lemmas are valuable for specifications, and forbidding them risks implying classical mathematics is "false" rather than non-computational.

  **3. Analysis**
  Both positions identify genuine constraints. Position A correctly identifies that under the Curry-Howard correspondence, a proof *is* a program. If a proof relies on EM to construct a value, the extracted program lacks the computational logic to produce that value. As Dummett argued, if meaning is grounded in use (or verification), a proof that cannot be realized computationally fails to provide the "use" required for extraction.

  However, Position B correctly notes that formal methods involve two distinct layers: the *specification* (what the program should do) and the *implementation* (how it does it). Proving that a solution *exists* (specification) often requires classical reasoning, even if *finding* that solution (implementation) must be constructive. Banning classical logic from the specification layer unnecessarily increases the cognitive load on students and may obscure the mathematical intent of the system. Furthermore, as Position B worries, a total ban risks pedagogical confusion, suggesting that classical theorems (e.g., the Intermediate Value Theorem in its classical form) are invalid, rather than simply non-constructive.

  **4. Recommendation**
  I recommend the committee adopt a **Stratified Constructivity Policy**, effective for the next cohort.

  **Policy Statement:**
  1.  **Computational Kernel:** Any definition, function, or proof term that contributes to the *computational content* of the extracted executable must be strictly constructive. The use of EM, Double Negation Elimination, or Choice is prohibited in these segments.
  2.  **Specification Layer:** Classical axioms are permitted in lemmas and theorems marked as *specifications only* (i.e., residing in `Prop` in Coq, intended for erasure during extraction), provided they do not leak into the computational kernel.
  3.  **Disclosure:** Projects must explicitly document which axioms are assumed. If a proof relies on classical logic to establish a property that guards computational flow, the extraction must be demonstrated to succeed without stubs.

  **Rationale:**
  This approach honors the BHK interpretation where it matters for engineering: a proof of existence used to *generate* code must provide a witness. However, it respects Position B by allowing classical logic to verify high-level properties that are erased before execution. It clarifies that the restriction is on *computability*, not *truth*.

  **5. Implementation and Enforcement**
  To ensure compliance without relying solely on honor codes:
  *   **Extraction CI:** The build pipeline must include a step that attempts extraction. Success is defined as generating code without `axiom` stubs (verifiable via Coq's `Print Assumptions` on extracted terms).
  *   **Axiom Flagging:** Students must run `Print Assumptions` on their main theorems. Any reliance on `Classical_Prop` or `Choice` in the computational type (`Set`/`Type`) results in a failure of the verification requirement.
  *   **Pedagogical Note:** In the kickoff seminar, instructors should explicitly frame the distinction: Classical logic describes the *territory*; constructive logic builds the *map*. Neither is "wrong," but only the latter can drive the vehicle.

  **6. Conclusion**
  The goal of the Formal Methods concentration is to produce verified, *running* software. Position A is correct that classical axioms break the link between proof and execution. Position B is correct that classical axioms remain vital for reasoning about system properties. By restricting classical logic to the specification layer while enforcing constructivity on the computational kernel, we satisfy the engineering requirement for executable code while preserving the mathematical expressiveness needed for rigorous specification.

  I recommend the committee vote to adopt this stratified policy.
