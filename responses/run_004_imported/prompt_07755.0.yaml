answer: |-
  Good evening, everyone. For those who don't know me, I've had the privilege of working alongside [Colleague's Name] for thirty years. We have shared offices, grants, field sites, and countless cups of terrible conference coffee. But mostly, we have shared an argument.

  For three decades, we have debated a single question: What does it mean to say a trait has a "function"?

  I came to this field as a biologist, trained to look at history. [Colleague's Name] came to it looking at systems. For thirty years, we shouted past each other in the best possible way. It was only this past year, in my retirement, that I picked up a philosophy book and realized we hadn't just been arguing; we had been reenacting a formal debate in the philosophy of biology without ever knowing the names of the generals.

  I have always argued for what philosophers call an *etiological* account. I believe a trait's function is defined by its history. A heart functions to pump blood because our ancestors survived *because* their hearts pumped blood. History is the judge.

  [Colleague's Name] has always defended what is known as a *Cummins-style causal-role* account. She believes function is defined by current contribution. A heart functions to pump blood because that is what it *does* to keep the organism running right now. Capacity is the judge.

  For most traits, we agree. But to understand our friendship, you need to understand where we diverge.

  Imagine a bird's wing. We agree its function is flight; it was selected for flight, and it enables flight. But imagine that same bird uses its wing to shade its chicks from the hot sun. This shading keeps the chicks alive.

  Here is where the thirty-year war begins.

  [Colleague's Name] looks at the shading and says, "This contributes to the survival capacity of the lineage. Therefore, shading is a function of the wing." She looks at what the trait *does* in the system today.

  I look at the shading and say, "The wing was not selected by evolution for shading. It was selected for flight. Therefore, shading is merely a beneficial side effect, not a proper function." I look at why the trait is *here*.

  To the philosophers in the room: You know that neither of us can deliver a knockout blow. The etiological account struggles with novel traits that haven't been selected yet. The causal-role account struggles to distinguish between a function and a mere accident.

  But to the family and students in the room: Please understand that this wasn't a fight. It was a duet.

  If I had conceded to her, I would have lost my respect for history. If she had conceded to me, she would have lost her respect for the present. We needed each other to keep our thinking honest. She forced me to look at what organisms *do*. I forced her to look at where they *came from*.

  We are retiring without a verdict. And that is as it should be. Science, like a good marriage or a great friendship, is not about winning the argument. It is about sustaining the conversation.

  So, if I may ask you to raise your glasses.

  To [Colleague's Name]. May your retirement be full of functions that are both historically justified and causally productive. May you find rest in the system you have enriched for thirty years. And may you never, ever agree with me completely, because I shall miss the argument too much.

  To [Colleague's Name]!
