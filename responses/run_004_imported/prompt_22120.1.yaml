      *   (b) 0-1/4: This is the heart of Quine's argument. Getting it backwards (saying they are the same) is a major conceptual failure. I'll give 1 point for recognizing there *is* a comparison to make, but 0 for the content. Actually, let's be generous: 1/4.
      *   (c) 2/3: They are related, but distinct. "Same thesis" is wrong. "Same phenomenon" is closer. I'll dock a point.
      *   Total: 6/10. This feels right for an answer that sounds confident but misses the crucial metaphysical distinction.

