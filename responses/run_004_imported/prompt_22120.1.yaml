  ### One last note for you (the coder)
  Since you mentioned `null` vs `undefined`:
  *   **Underdetermination** is like a database field that is `NULL`. The value exists in the real world, the record *should* have it, but our query (evidence) returns nothing.
  *   **Indeterminacy** is like accessing a property on an object that doesn't exist (`undefined`). There isn't a "secret meaning" hiding in there that we can't find. The question "what is the value?" has no answer.

  The student argued Indeterminacy is just `NULL`. Quine says it's `undefined`. That's why they lose the big points on section (b).
