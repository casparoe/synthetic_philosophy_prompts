answer: |-
  **TO:** The Panel, National Heritage Rolling Stock Register
  **FROM:** The Board of Trustees, [Name of Your Heritage Railway]
  **DATE:** 24 October 2023
  **SUBJECT:** Position Statement regarding the Designation '1911 Bramwell'

  **1. Recommendation**

  The Board of [Name of Your Heritage Railway] respectfully submits that the designation '1911 Bramwell', along with the associated preservation funding and operational rights, be awarded to the locomotive currently in continuous passenger service on our line.

  However, we recommend that the Register formally acknowledge the asset held by the [Rival Trust Name] not as a duplicate, but as the *Original Material Assemblage of the Bramwell*. We believe this distinction resolves the metaphysical tension between the two claims without diminishing the historical value of either party's work.

  **2. The Case for Functional and Spatiotemporal Continuity**

  Our claim rests on the understanding that a locomotive is a *functional artifact* whose identity is constituted by its operational history and organizational continuity, rather than solely by its material composition.

  Since 1911, the engine operating on our line has maintained an unbroken chain of existence. It has never ceased to be "the Bramwell" in the eyes of the railwaymen who operated it, the passengers who rode behind it, or the regulatory bodies that certified it. The replacement of components via our standard overhaul regime was not an act of replication, but of maintenance. In the context of heavy engineering, identity is preserved through the *process* of renewal. A locomotive that is not overhauled ceases to be a locomotive; it becomes a static monument. Therefore, the replacement of the boiler, wheelsets, and frame was a necessary condition for the *survival* of the Bramwell's identity as a working engine.

  To rule otherwise would imply that every time a locomotive received a new boiler (a standard requirement for safety and certification), it ceased to be itself. This would render the concept of a "heritage fleet" incoherent, as almost no operational vintage engine retains 100% of its original material.

  **3. Engagement with the Counter-Argument (Material Constitution)**

  We engage honestly with the position of the [Rival Trust Name]. Their claim relies on the principle of *Material Constitution*: the intuition that an object is identical to the sum of its original parts. Under this view, because every atom of steel currently on our engine is post-1911, our engine is effectively a replica built around a lineage of paperwork. Conversely, because the Rival Trust has reassembled the original 1911 steel, they possess the "true" Bramwell.

  We acknowledge that this is a philosophically robust and intuitively powerful argument. In many heritage contexts—such as fine art or static architecture—material constitution is the primary criterion for authenticity. A painting with replaced canvas and pigment is a forgery; a cathedral built with new stone is a reconstruction. The Rival Trust has performed an extraordinary service in rescuing this original material from scrap, and their assembly represents the only physical connection to the 1911 manufacturing event that remains.

  If the '1911 Bramwell' were a sculpture intended for static display, we would concede the designation to them without hesitation. Their claim is strongest if the 'Bramwell' is defined as a *collection of parts*.

  **4. Resolution: Artifact Kind and Purpose**

  The crux of this matter lies in defining the *kind* of artifact the Bramwell is. We argue that a steam locomotive is not akin to a sculpture, but to a living institution or a biological organism. An organism replaces its cells over time yet remains the same organism; a railway company replaces its staff and rolling stock yet remains the same company.

  The identity of a locomotive is bound to its *narrative history* and its *function*. The engine on our line carries the spatiotemporal continuity of the Bramwell's service life. It occupies the same causal chain of operation that began in 1911. The Rival Trust's engine, while materially authentic, suffers a forty-year gap in existence; it was disassembled, dispersed, and ceased to function as a locomotive. It has been *reconstituted*, whereas ours has been *sustained*.

  **5. Proposed Designation Strategy**

  To honor the integrity of the Register and the contributions of both trusts, we propose the following:

  1.  **Primary Designation:** The title '1911 Bramwell' is granted to the operational engine on our line. This preserves the historical record of continuous service and ensures funding supports the active preservation of the *type* in its intended working environment.
  2.  **Secondary Recognition:** The Rival Trust's assembly is listed on the Register as 'Bramwell: Original Material Assemblage (1911)'. This acknowledges their unique custodianship of the original fabric without conflating it with the continuous identity of the working locomotive.

  This approach avoids the falsehood of claiming our steel is from 1911, while rejecting the falsehood that the Bramwell's identity vanished when its boiler was renewed. It recognizes that heritage is not merely about preserving matter, but about preserving meaning, function, and history.

  **Signed,**

  The Board of Trustees
  [Name of Your Heritage Railway]
