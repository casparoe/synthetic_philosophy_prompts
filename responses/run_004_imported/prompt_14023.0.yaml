      *   **Problem:** The "Ship of Theseus" scenario applied to a locomotive (the 1911 Bramwell).
          *   *Our Engine:* Continuous service, functional, but 0% original material (all replaced via standard overhaul).
          *   *Rival Engine:* Static, reassembled from original parts collected over 40 years (100% original material, but discontinuous history).
      *   **Task:** Draft a position statement for the Heritage Rolling Stock Register.
      *   **Requirements:**
          *   Recommend a stance (back our claim, concede, or propose alternative).
          *   Engage honestly with the strongest argument for the *other* side (no strawmanning).
          *   Tone: Professional, persuasive, philosophically informed (given the user's background), but suitable for a heritage register panel.

  2.  **Determine the Stance:**
      *   *Option A (Back Our Engine):* Focus on functional continuity, institutional history, and the nature of vehicles as functional artifacts. This aligns with how railways actually operate (overhaul is necessary for safety).
      *   *Option B (Concede):* Focus on material constitution. If identity is tied to matter, the rival wins. This is risky for the railway's future and funding.
      *   *Option C (Alternative/Shared):* Suggest dual designation or distinguishing titles (e.g., "Bramwell (Operational)" vs. "Bramwell (Original Material)").
      *   *Decision:* As a trustee, the primary duty is to the railway's viability and the public utility of the locomotive. However, as a philosopher, the user knows the material argument is strong. The most robust philosophical position for *vehicles* usually favors functional/spatiotemporal continuity over material constitution (a car with replaced engine is still the same car). Therefore, the recommendation should be to **back our engine's claim**, but acknowledge the rival's status as a unique historical artifact. This allows for a nuanced resolution that doesn't lie about the material reality.

  3.  **Identify the Core Philosophical Arguments:**
      *   *Our Side (Functional/Continuity View):* Identity is tied to the *life history* and *function* of the artifact. A locomotive is defined by its role in a transport system. The "form" and "organization" matter more than the specific atoms. The overhaul regime is part of the identity conditions of a working steam locomotive.
      *   *Rival Side (Material Constitution View):* Identity is tied to the original matter. If you swap all the parts, it's a replica. The "essence" of the Bramwell is in the 1911 steel.
      *   *The "Strongest Argument" to Concede:* The material argument is intuitive and powerful in heritage contexts. We must admit that *materially*, the rival holds the original substance.

  4.  **Drafting - Section by Section:**

