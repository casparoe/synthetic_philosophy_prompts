answer: |-
  Your intuition is philosophically sound, and you are grappling with a classic problem in ethics known as the distinction between **obligation** and **supererogation**.

  To answer your specific questions directly:
  1.  **Is there a moral difference between an action being good to do and required?** Yes. This is the difference between duty and heroism.
  2.  **Does one person doing more change what the rest of us owe?** No. One person's choice to exceed expectations does not morally obligate others to match them, though it may create social pressure to do so.

  Here is a breakdown of the ethical framework you can use to articulate this to your friends, moving from vague intuition to a structured argument.

  ### 1. The Concept of Supererogation
  In moral philosophy, actions are often categorized into three buckets:
  *   **Obligatory:** Things you *must* do (e.g., keep promises, do not harm others, fulfill your school's graduation requirements).
  *   **Forbidden:** Things you *must not* do (e.g., steal, cheat).
  *   **Supererogatory:** Actions that are **good to do but not wrong to omit.**

  Priya's volunteering falls squarely into the **supererogatory** category. Skipping her birthday dinner to work at a shelter is morally praiseworthy; it makes her a "moral exemplar." However, by definition, a supererogatory act is one that goes *beyond* the call of duty. If it were required, it wouldn't be supererogatory anymore; it would just be a job.

  **The Argument:** When your friends suggest that doing only the minimum makes you "selfish," they are conflating *ideals* with *obligations*. They are treating Priya's personal ceiling as if it were everyone's moral floor.

  ### 2. The Problem of "Moral Inflation"
  What is happening in your group chat is a form of **moral inflation**. Just as printing too much money devalues currency, treating heroic sacrifices as "standard requirements" devalues moral obligation.

  If every time someone does something extraordinary, the baseline for "acceptable behavior" rises, morality becomes unsustainable.
  *   **The Sustainability Argument:** Morality must be livable. If the moral standard requires constant self-sacrifice (skipping birthdays, quitting jobs), most people will eventually burn out or reject morality entirely.
  *   **The Division of Labor:** A healthy community needs people doing different things. Priya contributes time. Your friend who quit her job to volunteer is sacrificing financial stability. You and others might be focusing on school, working to save money to donate later, or maintaining your mental health so you can be supportive friends. These are all valid contributions to the social good.

  **The Argument:** Priya's excellence does not create a debt for the rest of you. If one runner trains for the Olympics, it does not mean their running partners are "lazy" for training for a local 5K. Both are runners; one is just operating at a different intensity level.

  ### 3. The Danger of Coerced Altruism
  The situation with the friend who quit her part-time job is a critical point. This highlights the difference between **autonomous virtue** and **coerced sacrifice.**

  *   **Autonomous Virtue:** Priya chooses to volunteer. It aligns with her values and capacity. This is morally good.
  *   **Coerced Sacrifice:** The other friend quit her job due to *guilt* and *social pressure*, not necessarily because it was the best strategic choice for her life or the cause.

  Ethicists argue that for an action to be truly virtuous, it must be chosen freely. When social pressure forces someone to sacrifice their own stability (like income) to match a saintly figure, it can lead to resentment and eventual withdrawal from the cause entirely.

  **The Argument:** Pressuring friends to match Priya's output risks turning volunteering into a competition of suffering rather than a genuine effort to help. It shifts the focus from "helping others" to "proving we are good people."

  ### 4. Does Priya's Action Change Your Obligations?
  You asked if Priya doing more changes what you *owe*. The answer is generally **no**, with one nuance.

  *   **The General Rule:** Moral obligations are usually universalizable. If "everyone must skip their birthday to volunteer" is not a sustainable rule for humanity, then it is not a moral obligation for you either.
  *   **The Nuance (The Free Rider Problem):** The only time Priya's actions would increase your obligation is if her efforts were being undermined by your inaction in a specific, shared project. (e.g., If you all signed up to run a shelter together and you didn't show up, leaving her to do it all, that would be wrong). But since these are individual choices about free time, you are not "free riding" on her labor. You are simply living different lives.

  ### How to Frame This in the Group Chat
  You want to validate Priya without accepting the guilt. Here is a script based on the philosophy above:

  1.  **Affirm Priya:** "Priya is incredible. What she does is genuinely heroic, and we should all admire her."
  2.  **Distinguish Duty from Heroism:** "But there is a difference between doing your duty and being a hero. The school requires X hours; that is our shared obligation. Priya chooses to do 10X. That is her personal gift, not our collective debt."
  3.  **Address the Sustainability:** "If we treat Priya's sacrifice as the new normal, volunteering becomes unsustainable. [Friend's Name] quitting her job worries me. We need to be able to help others without ruining our own stability. Long-term, we can do more good by staying balanced than by burning out trying to match Priya's intensity."
  4.  **Reframe the Goal:** "Let's not make this about who is the 'least selfish.' Let's make it about how we can all contribute in ways that are sustainable for us. Priya gives time; maybe others of us give money later, or focus on our studies to help in professional ways. We don't need to copy her to respect her."

  ### Summary
  Your intuition is correct. Priya is playing the game of morality on "Hard Mode." That is admirable. But it is unfair for her to demand that everyone else switch to "Hard Mode" just because she can handle it.

  Morality allows for **personal prerogative**. You are permitted to prioritize your own projects, rest, and financial stability, provided you meet your basic obligations. Priya's virtue is hers alone; it does not constitute a judgment on your character unless you are actively harming others, which doing the "minimum required" does not.
