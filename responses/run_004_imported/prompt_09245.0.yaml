answer: |-
  You have hit on one of the most heated and fascinating debates in modern decision theory. Your intuition is spot-on: **mathematically, they often converge to the same number, but philosophically, they are claiming to solve completely different problems.**

  Here is the breakdown of whether Peters is just reinventing Bernoulli, and which one actually explains why you wouldn't drop $1,000 on that coin flip.

  ### 1. The Mathematical Coincidence
  You asked: *"Isn't maximizing long-run growth rate basically the same math as maximizing log wealth?"*

  **Yes.**
  If you have a multiplicative process (like investing or betting a fraction of your bankroll), the quantity that maximizes your long-term time-average growth rate is the **geometric mean**.
  Mathematically, maximizing the geometric mean is identical to maximizing the **expected value of the logarithm** of your wealth.

  So, if you follow Peters' ergodicity argument to its conclusion, you end up behaving *exactly* as if you had a logarithmic utility function. If you follow Bernoulli's utility argument, you also behave as if you have a logarithmic utility function.

  To a spectator watching your betting behavior, **there is no difference.** You will both refuse to pay more than ~$20 (depending on your current wealth) to play the St. Petersburg game.

  ### 2. The Philosophical Divergence
  If the math is the same, why does Peters claim his solution is revolutionary? It comes down to **ontology** (what actually exists).

  **Bernoulli's View (Subjective):**
  *   **The Problem:** Humans are psychologically risk-averse. We feel the pain of loss more than the joy of gain.
  *   **The Fix:** We introduce a "utility function" ($U(W)$) to model this psychology. Logarithms are a convenient choice that fits the data, but they are essentially a **fudge factor**.
  *   **The Implication:** If we met a robot or an alien that *didn't* have diminishing marginal utility, they *should* pay an infinite amount to play. The limit is in the mind of the player.

  **Peters' View (Objective):**
  *   **The Problem:** Standard economics assumes **ergodicity**. It assumes that the average outcome across 1 million parallel universes (ensemble average) is the same as the average outcome for one person playing 1 million times (time average).
  *   **The Fix:** For multiplicative dynamics (wealth compounding), the system is **non-ergodic**. The ensemble average diverges to infinity, but the time average converges to a finite number.
  *   **The Implication:** You don't need to assume risk aversion. Even a purely rational agent who cares *only* about maximizing their wealth over time *must* reject the infinite bet. The limit is in the **mathematics of the process**, not the psychology of the player.

  **The Analogy:**
  *   **Bernoulli:** "I don't eat cyanide because I have a utility function that assigns negative infinity value to being dead." (Preference)
  *   **Peters:** "I don't eat cyanide because it stops my biological processes." (Physical constraint)

  Peters argues that Bernoulli turned a physical constraint (time and compounding) into a psychological preference, confusing economics for centuries.

  ### 3. The "One-Off" Objection
  This is the strongest critique of Peters and the place where Bernoulli might still hold ground.

  The St. Petersburg paradox is usually presented as a **one-off game**. You pay once, flip until tails, get paid, and leave.
  *   **Peters' Ergodicity** relies on the "long run." It argues that you should treat every bet as part of your lifetime trajectory of wealth. If you take bets that have negative time-average growth, you will eventually go bankrupt.
  *   **The Counter:** But what if I *won't* play again? If I truly play once, the time average doesn't exist. There is only the one outcome. In a strictly one-off scenario, the ensemble average (expected value) is the only mathematically valid metric, which is infinite.

  Peters counters this by arguing that **no bet is truly one-off.** Every financial decision affects your total wealth, which affects your ability to make future decisions. Therefore, you are always on a time trajectory.

  However, many economists argue this is a stretch. If I find $20 on the ground and bet it on a one-off St. Petersburg coin flip, my lifetime financial trajectory is hardly ruined if I lose. Yet, I still wouldn't pay $1,000 to play. This suggests there *is* a psychological component (pure risk aversion) that exists independently of long-term growth dynamics.

  ### 4. The Menger Objection (Where Peters Shines)
  There is a historical objection to Bernoulli called the **Menger Paradox** (1934).
  Karl Menger showed that if you modify the St. Petersburg game so the payouts grow even faster (e.g., $10^{2^n}$ instead of $2^n$), the expected utility with a logarithmic function **still diverges to infinity**.
  *   **Bernoulli's Fail:** Log utility fails to tame the infinity if the payouts grow fast enough. You would need a different utility function (like bounded utility) to fix it. But why choose that function? It becomes arbitrary.
  *   **Peters' Win:** Peters argues that if the payouts grow that fast, the **time average also diverges**. In that specific mathematical case, the game *actually is* worth an infinite amount if you can play it repeatedly. He argues Menger didn't find a flaw in log-utility; he found a case where the infinity is real and the paradox disappears.

  This is Peters' strongest card: Ergodicity explains *why* log-utility works and *when* it should fail, without needing arbitrary psychological adjustments.

  ### 5. So, which explains the $20 price tag?
  If you ask a behavioral economist, they will say: **Both, but for different reasons.**

  1.  **Why the math works:** Peters provides the better **foundational justification**. He explains *why* log-utility is the "correct" function for wealth. It's not just a curve we drew to fit data; it's the natural result of multiplicative dynamics over time. It removes the "magic" from Bernoulli's solution.
  2.  **Why humans do it:** Bernoulli's framework is likely better at capturing the **immediate psychological reality**. Humans are loss-averse for reasons that have nothing to do with compounding growth (e.g., we need money for rent *now*, not in 30 years).

  **The Verdict:**
  Peters is not "secretly doing log-utility." He is **deriving** log-utility from first principles of physics and time, whereas Bernoulli **postulated** it based on introspection.

  *   **Bernoulli says:** "You won't pay $1,000 because you are risk-averse."
  *   **Peters says:** "You won't pay $1,000 because that bet destroys your long-term growth rate, and evolution/rationale selects for agents that survive."

  **Which is true?**
  Probably Peters regarding the *structure* of the problem, but Bernoulli regarding the *nuance* of human behavior.
  The reason nobody pays $1,000 is likely a hybrid: We intuitively understand that betting a large chunk of wealth on a volatile asset is dangerous (Peters/Ergodicity), **AND** we feel genuine anxiety about losing the money (Bernoulli/Psychology).

  Peters' contribution is massive because he shows that what we thought was "risk aversion" (a psychological quirk) is actually "risk management" (a mathematical necessity for survival). But he hasn't fully killed utility theory, because humans make decisions based on consumption and immediate needs, not just long-term wealth maximization.

  **TL;DR:** You are right that the math is identical. But Peters claims the *reason* for the math is physical (time), not psychological (preference). He successfully explains why log-utility is the "natural" choice, but Bernoulli's framework is still needed to explain deviations from rational growth maximization (like buying lottery tickets with negative expected growth).
