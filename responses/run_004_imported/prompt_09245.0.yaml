      *   *Bernoulli's Solution:* People maximize expected *utility*, not expected *wealth*. Log utility makes the sum converge.
      *   *Peters' Solution:* The process is non-ergodic. The ensemble average (expected value) diverges, but the time average (geometric mean growth rate) converges. Maximizing the time-average growth rate leads to the Kelly Criterion, which implies log utility.
