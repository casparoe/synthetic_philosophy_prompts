answer: |-
  **Discord Voice Channel: `#physics-and-metaphysics`**
  **Participants: B (Bohmian), E (Everettian)**
  **Time: 02:43 AM**

  **B:** Look, I'm not saying you're wrong about the predictions. We're not fighting about the CHSH value. We both know it's $2\sqrt{2}$. We both know the statistics hold. I'm saying you're lying to yourself about what the math *means* when you say "Many-Worlds is local."

  **E:** I'm not lying. I'm reading the Schrödinger equation. It's a partial differential equation. It evolves locally in configuration space. There are no action-at-a-distance terms in the Hamiltonian. If you define "local" as "dynamics depend only on nearby values of the field," MWI is local. Bell's theorem assumes a single outcome. I deny the assumption. You deny locality. I think I got the better end of that bargain.

  **B:** That's the standard Everettian dodge, and Maudlin swatted it down twenty years ago. Bell's theorem doesn't just assume "single outcomes" in a colloquial sense. It assumes that there is a fact of the matter about what happens at Alice's detector that is statistically independent of the setting at Bob's detector, given the past state.

  **E:** But there *isn't* a single fact of the matter. That's the point. When Alice measures spin, the universe branches. There is an Alice-Up and an Alice-Down.

  **B:** Okay, fine. Let's get technical. Jarrett decomposed Bell's "Local Causality" condition into two pieces: Parameter Independence (PI) and Outcome Independence (OI).
  PI says: Bob's setting doesn't change the *probability* of Alice's outcome.
  OI says: Bob's *outcome* doesn't change the *probability* of Alice's outcome.
  Standard QM violates OI but keeps PI. That's why you can't signal.
  But in Bohm? The pilot wave guides the particles. The velocity of Alice's particle depends instantaneously on the position of Bob's particle. That is a violation of PI at the ontological level. I admit it. Nature is nonlocal. But because of the Quantum Equilibrium Hypothesis, we can't *use* it to signal. So empirically, PI holds. Ontologically, it doesn't.
  Now you. In MWI, you claim you keep both. But if Alice-Up *only* ever finds herself correlated with Bob-Down, something had to ensure that matching. If the branching is local, how does the Alice-Up branch "know" to lock onto the Bob-Down branch and not Bob-Up?

  **E:** It's not "locking on." That language presupposes the branches are separate entities that need to shake hands. They aren't. The global wavefunction contains the correlation from the moment of entanglement at the source. That's a local event in the past light cone.
  When Alice measures, she entangles with her particle. That's a local interaction. When Bob measures, he entangles with his particle. Local interaction.
  The "correlation" isn't a message sent between them. It's a structural feature of the global wavefunction that was laid down when they interacted at the source. The Deutsch-Hayden argument shows that all the information about the correlation is carried locally in the relative states of the subsystems. There is no nonlocal influence.

  **B:** "Structural feature." See, that's the word salad.
  Let's press on the "matching." Suppose Alice measures first. In your picture, she splits. Now there are two Alices. Bob hasn't measured yet. His particle is still in a superposition relative to the global state.
  When Bob measures, does he split?
  If he splits independently, you get four branches: (Up, Up), (Up, Down), (Down, Up), (Down, Down).
  But QM says (Up, Up) and (Down, Down) have zero amplitude for a singlet state. They don't exist.
  So something must suppress those branches.
  If the suppression happens instantaneously when Bob measures, based on what Alice did... that's nonlocality. You're just hiding it in the linear algebra. You've got a constraint that says "The branch where Alice saw Up *cannot* contain a Bob who sees Up." If Alice and Bob are spacelike separated, what enforces that constraint?

  **E:** The constraint is enforced by the unitary evolution of the joint state. You're imagining the branching happens at the detectors. It doesn't. The "branches" are just a way of describing the decoherence of the global state.
  The state is $\frac{1}{\sqrt{2}}(|\uparrow\rangle_A |\downarrow\rangle_B - |\downarrow\rangle_A |\uparrow\rangle_B)$.
  This state exists *before* measurement. It's one object.
  When Alice interacts, the state becomes $\frac{1}{\sqrt{2}}(|\text{See}\uparrow\rangle_A |\uparrow\rangle_A |\downarrow\rangle_B - |\text{See}\downarrow\rangle_A |\downarrow\rangle_A |\uparrow\rangle_B)$.
  Nothing happened to Bob's side yet.
  When Bob interacts, the state becomes $\frac{1}{\sqrt{2}}(|\text{See}\uparrow\rangle_A |\uparrow\rangle_A |\text{See}\downarrow\rangle_B |\downarrow\rangle_B - |\text{See}\downarrow\rangle_A |\downarrow\rangle_A |\text{See}\uparrow\rangle_B |\uparrow\rangle_B)$.
  Look at the terms. The cross terms never appear. Why? Because the initial state didn't have them. The dynamics are local. Alice's interaction only touched the A-part of the tensor product. Bob's interaction only touched the B-part.
  The correlation was in the coefficients from the start. No signal passed between them at measurement time.

  **B:** I see the math. I wrote that same equation in grad school. I'm asking about the *ontology*.
  In Bohm, I have particles. They have positions. I know what's real. When Alice measures, her particle goes up. Because of the quantum potential, Bob's particle is *forced* to go down, instantly. That's a physical mechanism. It's nonlocal, yes. It violates the spirit of relativity, yes. But I can tell you a story about *how* the correlation happens.
  In your story, "Alice" splits. Which Alice is "real"? Both?
  If both are real, then in the branch where Alice-Up exists, does Bob-Up exist? You say no.
  But if Bob is spacelike separated, and Bob's local dynamics are truly independent of Alice's measurement (which they must be, for you to claim locality), then Bob's splitting shouldn't care about Alice's splitting.
  For Bob's splitting to "align" with Alice's splitting without communication, the "alignment" must be pre-determined.
  But Bell says you can't pre-determine the outcomes with local hidden variables.
  So either the alignment is nonlocal, or the "branches" aren't real distinct worlds until they compare notes.
  If they aren't real until they compare notes, you've reintroduced a preferred frame or a collapse at the comparison event. Which is nonlocal.

  **E:** You're clinging to "outcome" as a singular noun.
  Bell's inequality derivation sums over probabilities of *unique* outcomes. $P(A, B) = \int d\lambda \rho(\lambda) P(A|\lambda) P(B|\lambda)$.
  That factorization $P(A|\lambda) P(B|\lambda)$ fails in QM.
  Bohm saves it by making $P(B|\lambda)$ depend on setting $a$. Nonlocality.
  MWI saves it by saying the sum is over *branches*, and the measure of existence of the branches follows the Born rule.
  The "alignment" isn't an event that happens at measurement. It's a fact about the Hilbert space structure.
  Think about it this way: In Bohm, you have a nonlocal influence that is *provably unusable* for signaling. You admit that. You call it "ontological nonlocality."
  I'm asking: If an influence cannot carry information, cannot change statistics, and cannot be detected even in principle... in what sense is it "physical"?
  You're positing a ghostly connection between particles that does absolutely no work other than satisfying your intuition that "up" means "only up."
  I'm saying the wavefunction is the reality. The wavefunction evolves locally. The "correlation" is just the shape of the wave.
  Why is your "unsigalable nonlocal influence" more real than my "local branching structure"?

  **B:** Because my ontology explains why I experience *one* outcome.
  That's the trade, isn't it?
  I pay the price of nonlocality to keep the definiteness of experience.
  You pay the price of a trillion unobserved copies of me to keep the locality of the equation.
  But here's the rub: You claim your theory is local. But if I'm an agent inside one branch, I see correlations that *look* nonlocal.
  If I don't know MWI is true, I look at the data and say "Wow, Alice's result predicts Bob's result instantly."
  To explain that *from inside the branch*, without referencing the global wavefunction, I need nonlocality.
  So MWI is only local from the "God's eye view" of the wavefunction. From the perspective of any actual observer—which is us—it looks nonlocal.
  So haven't you just relocated the nonlocality from the dynamics to the perspective?

  **E:** That's... actually a fair point.
  The *subjective experience* of collapse is nonlocal, even if the *objective dynamics* are local.
  But isn't that better?
  In Bohm, the nonlocality is in the *laws of physics*. The guidance equation is explicitly nonlocal. If you boost to a different frame, the nonlocality gets messy. You need a preferred foliation of spacetime to make sense of "instantaneous."
  In MWI, the laws are Lorentz invariant. The *experience* of a single outcome is an emergent phenomenon.
  So I'm saying the fundamental laws are local. You're saying the fundamental laws are nonlocal.
  We agree on the emergent phenomenology (no signaling, CHSH violation).
  So the disagreement is: Do we prefer local laws with many outcomes, or nonlocal laws with one outcome?

  **B:** Exactly. And Maudlin would say: Bell's theorem proves that *any* theory that reproduces the predictions must be nonlocal in the sense of violating Parameter Independence ontologically.
  He'd argue your "branches" are just a way of encoding the nonlocal correlation.
  If the branch where Alice sees Up *only* contains Bob-Down, the existence of that branch is contingent on the distant setting.
  If Alice had chosen a different angle, the branching structure would be different.
  So the structure of reality at Bob's end depends on Alice's choice. That's nonlocality, Eliezer-style or not.

  **E:** But the *amplitude* at Bob's end doesn't change.
  If Alice changes her setting, does the reduced density matrix at Bob's location change? No.
  That's the no-signaling theorem.
  In Bohm, the *particle velocity* at Bob's location changes instantly if Alice changes her setting.
  Even if you can't measure the velocity without disturbing the equilibrium, the *fact* of the velocity changes.
  In MWI, nothing changes at Bob's location. The global state changes, but the local state (density matrix) is invariant.
  So, is "reality" the particle position (Bohm) or the local density matrix (MWI)?
  If reality is the local density matrix, I'm local.
  If reality is the particle position, you're nonlocal.
  But since the particle position is hidden and the density matrix is all we can ever access... are we fighting over which invisible thing gets to be called "real"?

  **B:** ...
  Okay.
  So we agree that the observable predictions are identical.
  We agree that no signal can be sent.
  We agree that the CHSH inequality is violated.
  I insist that "real" means "the thing that determines my specific experience," which requires a trajectory, which requires nonlocality.
  You insist that "real" means "the fundamental dynamical law," which is unitary and local, and my specific experience is just a slice of the wave.
  So when I say "Bell proves nonlocality," I mean "Bell proves you can't have local dynamics *and* unique outcomes."
  When you say "MWI is local," you mean "MWI has local dynamics *and* drops unique outcomes."

  **E:** Yes.
  And the question is: Is "unique outcome" a physical constraint or a cognitive bias?
  If it's a physical constraint, you win, and nature is nonlocal.
  If it's a cognitive bias, I win, and nature is local but bigger than we thought.
  But since we can't step outside the wavefunction to check...

  **B:** ...We can't distinguish it experimentally.
  So Maudlin is right that *if* you want definite outcomes, you need nonlocality.
  But you're refusing to want definite outcomes in the fundamental ontology.
  So we're not disagreeing about the physics. We're disagreeing about whether the word "local" applies to the Hamiltonian or to the phenomenology.

  **E:** It's bookkeeping.
  We're fighting over which ledger entry gets the label "Reality."
  You put the definite outcome in the "Reality" column and accept a "Nonlocal" tax.
  I put the Unitary Evolution in the "Reality" column and accept a "Many-Worlds" tax.
  The bottom line—the experimental predictions—is balanced either way.

  **B:** God damn it.
  So we've been shouting for an hour about whether the universe is spooky, and it turns out we just like different map projections.

  **E:** Basically.
  Though I still think my map doesn't require a preferred reference frame.

  **B:** And I still think your map requires me to believe I'm a ghost haunting a trillion corpses.

  **E:** ...Touché.
  Same time next week? I want to talk about whether the Born Rule is derivable or an extra postulate.

  **B:** Only if you buy me a drink first. I'm going to need it.
