answer: |-
  The bass from the DJ booth thumped through the floorboards of the reception hall, vibrating the ice in Mara's highball glass. She was leaning against a stone pillar near the bar, watching the dance floor with the weary eyes of someone who has graded too many introductory logic papers.

  Jonah slid up beside her, loosening his tie. He smelled like expensive scotch and cigar smoke.

  "You owe me fifty bucks," he said.

  Mara didn't look at him. "I owe you nothing."

  "The bride told us. In her speech. 'Five years ago tonight.' 2019. You said 2020."

  "I said *academic* year 2020," Mara corrected, taking a sip. "Which started in 2019. It's a semantic hedge, Jonah. You know the rules."

  "It's a trivia bet. Not a dissertation defense." Jonah turned to face her, blocking her view of the dance floor. "You never just admit you're wrong. You just... blur the lines until the error disappears."

  "I don't blur lines. I contextualize evidence. There's a difference."

  "Is there?" Jonah took a aggressive swallow of his drink. "Because from where I'm standing, it looks like you're terrified of being incorrect. You'd rather split the difference with a lunatic than stand on solid ground."

  Mara finally looked at him. The old grad-school friction was sparking behind his eyes. "If the lunatic is my epistemic peer, Jonah, then the rational response *is* to split the difference. That's the view. We've had this drink a hundred times."

  "And I've told you a hundred times it's cowardice."

  "It's humility. It's truth-tracking."

  "It's surrender!" Jonah's voice rose, cutting through the ambient chatter. A few guests glanced over. He lowered it, leaning in. "Look, let's play your game. Let's say we are peers. Equal intelligence, equal access to the evidence. I say the year is 2019. You say 2020. We disagree. According to the Great Conciliationist Principle, we should both suspend judgment. Right?"

  "Roughly."

  "So now we're both agnostic about the year they met."

  "Correct."

  "But I checked the label on the wine bottle they used for the toast. It had the anniversary date printed on it. 2019. I have *first-order evidence* you don't have."

  "Then you're not a peer in that specific moment, you have more evidence."

  "Fine. Strip that away. Assume we have the exact same evidence. I'm confident. You're confident. We clash. You say I must lower my confidence. Why? Because I found out Mara disagrees with me."

  "Because disagreement is higher-order evidence that you've made a mistake in evaluating the first-order evidence."

  Jonah laughed, a sharp, barking sound. "Okay. Here we go. The Meta. Mara, look around. Half the department thinks you're wrong. Kelly, Sosa, even old Hendricks before he retired—they're all steadfasters. They think rationality permits digging in."

  Mara tightened her grip on her glass. "I'm aware of the literature, Jonah."

  "So, apply your own rule," he said, pointing a finger at her chest. "You are a conciliationist. You believe that when epistemic peers disagree, you must adjust your credence toward them. Well, your peers—the top epistemologists in the field—disagree with conciliationism. They think steadfastness is rationally permissible. So, by your own logic, shouldn't you be losing confidence in conciliationism right now? Shouldn't you be conciliating your way out of existence?"

  He sat back, looking satisfied. It was the Self-Defeat Objection, weaponized over wedding champagne. It was the argument that had haunted Mara since her dissertation.

  Mara was quiet for a long moment. She watched a waiter navigate a tray of empty flutes through the crowd.

  "It's a clever trap," she said softly.

  "It's not a trap. It's consistency."

  "If I accept your premise," Mara said, turning to face him fully, "I have to accept that the disagreement between us about *how to handle disagreement* is just like the disagreement about the year they met."

  "It is. It's a proposition. You assess the evidence."

  "No, it's not," Mara said. "Because to identify someone as a peer, I have to evaluate their reasoning. And to evaluate their reasoning, I have to use my epistemic norms."

  Jonah rolled his eyes. "Circular."

  "It's unavoidable," she countered, her voice sharpening. "If I use *your* norms to evaluate the disagreement, I've already conceded. You're asking me to use conciliationism to prove conciliationism false. You want me to say, 'Well, since you think I should be steadfast, I should steadfastly believe that I shouldn't be steadfast.'"

  "I want you to acknowledge that the headcount matters," Jonah pressed. "If the smartest people in the room think you're too soft, maybe you're too soft."

  "The headcount matters," Mara admitted. "I'm not 100% confident. I'm not dogmatic. I acknowledge the pressure their disagreement puts on my view. My credence in conciliationism *is* lower than it would be if you all agreed with me."

  "But you're still here. Still preaching it."

  "Because there's a difference between a disagreement about facts, and a disagreement about the rules of the game," Mara said. "When we argue about the wedding date, we share a framework. We agree on what 'truth' looks like. When we argue about steadfastness, we don't. You think rationality is about owning your reasoning. I think it's about minimizing error."

  She stepped closer, the noise of the wedding fading into the background of their bubble.

  "Here's the thing, Jonah. If I become a steadfaster to accommodate your disagreement, I validate a system that says I don't have to accommodate your disagreement. It's a performative contradiction. But more than that... look at us."

  She gestured between them.

  "We've been friends for fifteen years. You think I'm a coward. I think you're intellectually arrogant. We disagree about the fundamental norms of reasoning. If I adopt your view, I don't solve the disagreement. I just silence my side of it."

  "So you dig in," Jonah said.

  "I weigh the higher-order evidence," she corrected. "And the higher-order evidence includes the *consequences* of the view. Steadfastness leads to polarization. It leads to people like us standing at a wedding bar, furious about a trivia bet. Conciliationism is the only view that offers a way out of the fight."

  Jonah stared at her. He swirled his scotch. The ice clinked against the glass.

  "So you're saying your view is self-sealing," he said. "It's unfalsifiable."

  "I'm saying it's the only view that accounts for the cost of being wrong," Mara said. "If I'm wrong and I conciliate, I lose a belief. If you're wrong and you're steadfast, you lose the ability to ever know you're wrong."

  Jonah held her gaze for a long beat. The muscle in his jaw worked. Then, slowly, the tension in his shoulders dropped. He didn't smile, but the aggression bled out of his posture.

  "That," Jonah said, "was a decent move."

  "It wasn't a move. It was the argument."

  "It was a move." He took a drink, hiding the corner of his mouth. "You still owe me the fifty bucks, though."

  Mara let out a short breath, almost a laugh. She reached into her clutch and pulled out a crisp bill, slapping it onto the bar top.

  "Fine. But I'm donating it to the department fund. So technically, you're paying yourself."

  "I'll take it." Jonah pocketed the bill. He looked out at the dance floor, where the bride and groom were spinning in the center of a cheering circle. "You know Hendricks would have hated that answer."

  "Hendricks thought peer disagreement was a paradox to be solved, not a situation to be managed," Mara said.

  "He thought you were a pushover."

  "He thought I was polite." Mara raised her glass slightly. "To polarization."

  Jonah clinked his glass against hers. "To digging in."

  "To getting it right," she corrected.

  Jonah smirked. "We'll see."
