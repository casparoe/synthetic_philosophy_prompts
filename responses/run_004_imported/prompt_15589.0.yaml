answer: |-
  Here are ten interview questions tailored for your audience, designed to probe the technical and philosophical commitments of the planning-optimal view without rehashing the basic setup.

  ### 1. The Status of Credence
  **Question:** The core of your defense rests on the claim that upon reaching an intersection, there is no well-defined credence to update on. But if we treat the driver as a standard Bayesian agent who knows the setup and knows they are following a mixed strategy, doesn't Bayes' rule mechanically force a posterior probability of being at the first versus the second intersection? Are you arguing that the math breaks down, or that the resulting number is decision-irrelevant?

  **Follow-up:** *If she argues the number is decision-irrelevant:* "If the credence exists mathematically but shouldn't guide action, does that imply a divorce between epistemology and decision theory? Are you comfortable saying an agent can know the probability they are at the first intersection but be rationally required to ignore it?"

  ### 2. The Deviation Incentive (Required Topic)
  **Question:** A common critique of the planning-optimal view is that it seems dynamically inconsistent. Even if we accept your claim about credences, a local reasoner at the intersection might calculate that *if* they were to deviate from the pre-committed mix, they could gain expected utility relative to their current subjective state. Why doesn't the sheer local incentive to deviate undermine the binding nature of the plan? What prevents rational agency from fracturing at the second node?

  **Follow-up:** *If she argues the local calculation is ill-posed because the strategy determines the reachability of the node:* "So you're essentially blocking the counterfactual? If the driver considers deviating, are you saying they must also consider that their deviation implies they wouldn't have reached this node under the original plan? That sounds suspiciously like a specific form of subjunctive dependence."

  ### 3. Piccione & Rubinstein's Original Objection
  **Question:** Piccione and Rubinstein originally argued that planning optimality leads to time inconsistency because the preferences at the planning stage differ from the preferences at the action stage. You're defending the planning stage as sovereign. Is your resolution to simply declare the planning stage the only locus of rational evaluation, or do you have a mechanism that aligns the action-stage preferences with the planning-stage ones?

  **Follow-up:** *If she says the planning stage is the only locus of evaluation:* "Doesn't that render the 'agent' at the intersection a mere automaton? If the entity at the intersection has no normative weight, are we really solving a decision problem for an agent, or are we just solving an optimization problem for a timeline?"

  ### 4. Normative Grounding
  **Question:** Let's talk about the 'ought.' Why *ought* an agent be planning-optimal rather than action-optimal? Is this a pragmatic prescription—i.e., you get more money this way—or is it a constitutive claim about what it means to be a rational agent over time?

  **Follow-up:** *If she says it's pragmatic (you get more money):* "If it's purely pragmatic, doesn't that open the door to 'money-pumping' arguments against your view? If an action-optimal agent can be exploited by a planning-optimal one, doesn't that settle the debate in your favor, or is there a normative cost to being the kind of agent who ignores local information?"

  ### 5. Sleeping Beauty and Endogeneity (Required Topic)
  **Question:** Many in the rationalist community see the Absent-Minded Driver as a cousin of the Sleeping Beauty problem. However, in Sleeping Beauty, the number of awakenings is determined by an exogenous coin flip. In the Driver problem, the probability of reaching the second intersection is determined by the driver's own mixed strategy. Does this endogeneity break the structural analogy, or do you think the same solution concept should apply to both?

  **Follow-up:** *If she says the analogy holds:* "If the analogy holds, does your view commit you to a specific camp in the Sleeping Beauty debate? For instance, does planning-optimality here map onto the 'Halfer' position, since you're sticking to the prior probability of the coin flip (or route) rather than updating on the fact of awakening?"

  ### 6. Causal Decision Theory (CDT) Compatibility
  **Question:** Standard Causal Decision Theory usually requires conditioning on the state of the world at the time of action. Your view seems to require conditioning on the policy selected at the start of time. Does adopting the planning-optimal resolution require us to abandon CDT in imperfect recall cases, or can CDT be patched to accommodate this without going fully updateless?

  **Follow-up:** *If she says CDT needs to be abandoned/patched:* "If we patch CDT to handle this, does it cease to be CDT? At what point does modifying Causal Decision Theory to account for policy-dependence turn it into Evidential or Functional Decision Theory?"

  ### 7. The Limit of Perfect Recall
  **Question:** Imagine we give the driver a tiny sliver of memory—enough to distinguish the intersections with 99% confidence. Does your planning-optimal resolution vanish smoothly as recall improves, or is there a sharp phase transition where suddenly the agent is required to update on their location?

  **Follow-up:** *If she says there is a sharp phase transition:* "A sharp transition where a tiny bit of memory completely changes the normative decision rule seems unstable. If the theory breaks down with 99% recall, doesn't that suggest the 'planning-optimal' rule is an artifact of the total ignorance assumption rather than a fundamental principle of rationality?"

  ### 8. Scope of Updatelessness (Required Topic)
  **Question:** Your resolution looks remarkably similar to the 'Updateless Decision Theory' advocated by some in the AI alignment community. Does defending planning-optimality in the Absent-Minded Driver commit you to a fully updateless theory of rational choice in all domains, or is this a narrower fix specifically for genuine imperfect-recall cases?

  **Follow-up:** *If she says it's a narrower fix for imperfect recall:* "What is the principled distinction? If the justification is that 'updating leads to suboptimal outcomes,' why does that justification apply to absent-mindedness but not to, say, Newcomb's Problem or Parfit's Hitchhiker, where updateless agents also outperform updating agents?"

  ### 9. Payoff Sensitivity
  **Question:** In the standard setup, the planning-optimal mix is distinct from the action-optimal mix. But we can construct payoff matrices where the two align, or where the planning-optimal strategy is extremely sensitive to small changes in payoff. Does your view imply that rational action is more fragile than we thought, dependent on precise payoff knowledge at the planning stage that might not be available?

  **Follow-up:** *If she acknowledges the fragility:* "If rational action is that sensitive to planning-stage payoff estimates, does that increase the risk of 'rigidifying' a suboptimal plan? Is there a meta-strategy for when to trust your planning self versus when to allow your action self to recalibrate?"

  ### 10. Implications for AI Safety
  **Question:** Finally, given your audience, I have to ask about AI. If we build an agent that cannot perfectly monitor its own internal state—a likely scenario for deep learning systems—should we hard-code them to be planning-optimal in this sense? Is this a bug to be fixed in AI design, or a feature we should exploit to ensure goal stability?

  **Follow-up:** *If she says it's a feature for goal stability:* "If we treat this as a feature, are we essentially designing AI that ignores its own sensory data when it conflicts with its prior policy? How do we distinguish between 'robust goal stability' and 'dangerous inflexibility' in that context?"
