prompt: |-
  Ok, I'm prepping a grad seminar on infinite ethics and there's one part of it that still isn't clicking for me, so let me outsource the intuition-building to you. I get the headline problem: once a world has infinite total utility, tacking on some finite amount of good or bad anywhere doesnt change the sum, so aggregative consequentialism just goes silent on pretty much every choice we actually face -- Bostrom's "infinitarian paralysis" thing. What I don't have a gut feel for is the rearrangement worry underneath that: how merely relabeling or reordering the exact same pattern of flourishing and suffering spread across an infinite space or timeline can make the "total" swing from positive infinity to negative infinity to just plain undefined, even though not a single person's welfare has actually changed. And then, once you've got that -- why don't the standard patches, like the overtaking criterion or the catching-up criterion, actually rescue the theory, rather than just relocating the damage into massive incompleteness where huge numbers of world-pairs turn out to be incomparable? Can you build up the intuition for both pieces, ideally without leaning on the measure-theoretic proofs?
