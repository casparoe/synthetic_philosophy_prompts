answer: |-
  This is one of the best questions in political philosophy, and you have hit on exactly the right tension. It is genuinely wild that two brilliant thinkers can take the same starting image—a person choosing rules for society without knowing their place in it—and derive opposite moral systems.

  The short answer is: **They disagree on what kind of decision problem the "Veil of Ignorance" actually is.**

  Rawls treats it as a choice under **radical uncertainty** (where you can't calculate odds), while Harsanyi treats it as a choice under **risk** (where you can calculate odds). That single technical distinction forces them into different mathematical frameworks, which then spit out different moral conclusions.

  Here is the step-by-step breakdown of where they part ways, why Harsanyi's math forces a linear sum, and who is "smuggling" more.

  ---

  ### 1. The Common Ground: The Impartial Observer
  Both Rawls and Harsanyi start with the same intuition: To be fair, you must be impartial.
  *   **The Setup:** Imagine you are designing a society. You know how sociology and economics work. You know human psychology. But you do **not** know who you will be in this society. You could be the CEO, or the janitor; healthy, or disabled; talented, or untalented.
  *   **The Goal:** Choose the social rules that you would rationally agree to from this position.

  ### 2. Divergence Point #1: Probabilities (Risk vs. Uncertainty)
  This is the fork in the road.

  **Harsanyi's View (Risk):**
  Harsanyi argues that if you know there are, say, 100 million people in the society, and you have literally zero information about who you will be, the **Principle of Insufficient Reason** applies. You must assign an equal probability to being any specific person.
  *   Chance of being Person A: $1/100,000,000$
  *   Chance of being Person B: $1/100,000,000$
  *   **Conclusion:** This is a lottery. You are buying a ticket in a society-lottery. A rational agent maximizes their **Expected Utility**.

  **Rawls's View (Uncertainty):**
  Rawls says this is cheating. He argues the Veil of Ignorance is "thicker." You don't just lack information about *who* you are; you lack information about the *probabilities* of the social positions.
  *   Maybe the class structure is rigid. Maybe being born poor is 90% likely. Maybe it's 10%. You don't know.
  *   **Conclusion:** You cannot calculate an average. When you cannot calculate probabilities, and the stakes are your entire life (liberty, dignity, survival), it is irrational to gamble on an average. You must protect against the **worst-case scenario**.
  *   **Result:** **Maximin** (Maximize the Minimum). Make the worst-off position as good as possible.

  ### 3. Divergence Point #2: The Axioms of Rationality
  This is where Harsanyi's "Aggregation Theorem" comes in, and where your confusion about the "linear combination" lies.

  Harsanyi insists that if you are rational, your preferences must obey the **von Neumann-Morgenstern (VNM) axioms** of expected utility theory.
  1.  **Completeness:** You can compare any two options.
  2.  **Transitivity:** If you like A > B and B > C, you like A > C.
  3.  **Continuity:** If A > B > C, there is some probability mix of A and C that makes you indifferent to B.
  4.  **Independence:** If you prefer A to B, adding a third option C to both (as a gamble) shouldn't change your preference.

  **Why does this force a linear sum?**
  This is the technical heart of your question. Harsanyi's Aggregation Theorem basically says:
  1.  Assume every individual's preferences obey VNM axioms (they are rational).
  2.  Assume "Society's" preferences also obey VNM axioms (Social Rationality).
  3.  Assume the **Pareto Principle**: If every individual is indifferent between Option X and Option Y, then Society must be indifferent. If everyone prefers X, Society prefers X.

  If you accept those three premises, **mathematically, the only function that satisfies them is a weighted sum of individual utilities.**
  $$W = a_1U_1 + a_2U_2 + ... + a_nU_n$$
  *(Where $W$ is Social Welfare, $U$ is Individual Utility, and $a$ is the weight).*

  **Why not a different combination?**
  If you tried to use a non-linear function (like Rawls's Maximin, which focuses only on the lowest number), you would violate the **Pareto Principle** or the **Independence Axiom**.
  *   *Example:* Imagine a choice between giving \$10 to a rich person vs. \$10 to a poor person. A Maximin rule says "Give to the poor." But if the rich person *really* wanted that \$10 (higher utility gain) and the poor person didn't care much, Utilitarianism says "Give to the rich."
  *   Harsanyi argues that if you ignore the intensity of the rich person's preference just because they are rich, you are violating the requirement that Society respects individual preferences. The VNM axioms require that trade-offs be consistent across probabilities, which forces the "weights" to be additive (linear).

  Since Harsanyi also argues (via the Veil) that the weights ($a_1, a_2...$) must be equal (because you have an equal chance of being anyone), the formula becomes:
  $$W = \frac{1}{n} \sum U_i$$
  **This is Average Utilitarianism.**

  ### 4. Who is Smuggling What?
  You asked which one is doing legitimate work and which is smuggling conclusions. The honest answer is **both are smuggling**, but they smuggle different things.

  **Harsanyi's Smuggle:**
  1.  **Interpersonal Comparability:** Harsanyi's math assumes we can measure your "happiness" and my "happiness" on the same scale and add them together. Most modern economists and philosophers think this is impossible. (Is my joy from a meal equal to your joy from a meal?) Rawls avoids this by using "Primary Goods" (rights, income) which are observable, rather than "Utility" which is internal.
  2.  **Morality = Rational Gambling:** Harsanyi assumes that moral decision-making is structurally identical to deciding whether to bring an umbrella. Rawls argues morality is about **reciprocity and respect**, not risk management. By forcing VNM axioms onto morality, Harsanyi essentially defines Utilitarianism into existence.

  **Rawls's Smuggle:**
  1.  **Extreme Risk Aversion:** Rawls assumes that anyone behind the Veil would be so terrified of ending up in the bottom caste that they would sacrifice huge amounts of average happiness to protect the floor. But is that rational? If there's a 99% chance you'll be comfortable and a 1% chance you'll be destitute, is it *really* rational to cripple the economy to fix that 1%? Many argue Rawls builds his egalitarian conclusion into his assumption about human psychology.
  2.  **No Probabilities:** By banning probabilities entirely, Rawls rigs the game against Utilitarianism. If you allow *any* probability estimation, Harsanyi's math starts to creep back in.

  ### 5. The Verdict: Which is more legitimate?

  If I have to place a bet (fittingly):

  **Harsanyi wins on Formal Coherence.**
  If you accept that moral agents should be "rational" in the standard economic sense, and you accept that we can compare well-being across people, Harsanyi is mathematically unbeatable. His Aggregation Theorem is a rigorous proof. If you want a system for cost-benefit analysis in public policy (e.g., healthcare triage, infrastructure spending), Harsanyi's framework is the only one that doesn't collapse into contradictions.

  **Rawls wins on Moral Intuition.**
  However, most people feel that Harsanyi's setup misses the point of justice. Justice isn't about maximizing the total pool of happiness; it's about how we treat each other as distinct individuals.
  *   **The "Separateness of Persons" Objection:** Harsanyi treats society like one giant super-person experiencing different states. Rawls reminds us that *you* are not *me*. Sacrificing your life for the greater average good is okay in a gamble, but maybe not okay in a moral society.
  *   **The Stakes:** Rawls is right that the "Veil" isn't a game. If the downside is slavery or starvation, "Expected Utility" feels like a cold calculation.

  **My Take:**
  Harsanyi proves that **if** you view morality through the lens of decision theory, you get Utilitarianism.
  Rawls proves that **morality cannot be fully reduced to decision theory.**

  The disagreement isn't really about the math; it's about whether the "Veil of Ignorance" is a tool to find **rational self-interest** (Harsanyi) or **fairness** (Rawls).
  *   If it's about self-interest behind a veil, Harsanyi is right (maximize your expected odds).
  *   If it's about fairness, Rawls is right (don't allow structures that exploit the vulnerable, even if it helps the average).

  Given that you and your brother are arguing about what we *owe* each other (which sounds like fairness, not gambling), Rawls is probably the better framework for your specific debate. But you should concede to your brother that Harsanyi has the cleaner math!
