prompt: |-
  Ok so this has been bugging me for weeks now. Me and my brother got into it about whether you should just maximize everyone's total happiness or whether you owe something extra to whoever ends up worst off, and that sent me down a wikipedia rabbit hole on Rawls's veil of ignorance late one night. I basically get that one: nobody behind the veil knows which person in society they'll turn out to be, so you pick rules that are fair no matter who you end up as, and Rawls says that logic pushes you toward protecting the bottom (his maximin thing) instead of just maximizing the average.

  Except then I found out about this economist, John Harsanyi, who has his own "aggregation theorem" that starts from basically the same kind of setup — some impartial observer who could turn out to be any member of society with equal odds — and his math is supposed to prove the exact opposite conclusion, that you should be an average utilitarian instead. That seems kind of nuts to me: how do you start from "I don't know who I'm going to be" in both cases and land in totally opposite spots? I read a summary of the actual proof and it's something like: everyone's preferences (including "society's" own preference) have to obey the von neumann-morgenstern axioms, and if literally every single person is indifferent between two options then society has to be indifferent too, and apparently that combo FORCES the social ranking into being a weighted sum of everybodys individual utility, no other option allowed. I did not really follow why it has to specifically be a straight linear combination and not some other way of combining people's utility.

  I don't have any formal background in this stuff, i'm just an amateur who likes chewing on this kind of thing, so could you actually walk me through, step by step, where Harsanyi's setup and Rawls's setup actually part ways? Is the whole disagreement just that Harsanyi lets you use ordinary probability/expected-utility reasoning behind the veil while Rawls thinks that's basically cheating given how high the stakes are, or does the real fork happen earlier, in what each of them even lets you assume about people's preferences to begin with? And once you've laid that out — genuinely, which of the two "veil" arguments do you think is doing more legitimate philosophical work, and which one is basically smuggling its conclusion in through its axioms?
