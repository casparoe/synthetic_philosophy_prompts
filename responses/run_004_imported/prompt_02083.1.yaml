      *   **The Augustinian (A):** Focuses on the apologetic aim, the theological context (Fall, Original Sin), the distinction between the orders (body, mind, charity). Sees the skepticism as a *via negativa* to prepare for grace. Emphasizes the normative force of terms like "tyrannical."

  3.  **Drafting - Section by Section:**

