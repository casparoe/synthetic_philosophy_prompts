          *   *A:* No, "tyrannical" implies a violation. You can't violate a norm that doesn't exist. Pascal needs a transcendent standard to call force "tyrannical," even if reason can't define justice.
          *   *C:* Counter: It's rhetorical. He's showing us our confusion. He's not endorsing tyranny; he's saying we *call* it tyranny because we wish justice ruled, but it doesn't.
      *   **Round 2: The Bundle Classification (Misère vs. Raisons des effets).**
          *   *A:* Lafuma 60 is in "Misère." It shows our wretchedness. We *need* true justice but lack it. This points to God.
