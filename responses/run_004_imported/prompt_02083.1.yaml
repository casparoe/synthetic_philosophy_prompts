  6.  **Final Polish:** (Writing the dialogue with attention to philosophical nuance). *Self-correction: Make sure the Conventionalist doesn't just say "God doesn't exist," but rather "Pascal's political argument works even if we bracket God."* *Make sure the Augustinian doesn't just say "Read the Bible," but "The text presupposes the anthropology of the Fall."*

