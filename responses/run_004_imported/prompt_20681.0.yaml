      *   *Refinement:* In a prediction market, you win by being right. But "right" is defined by the settlement condition. If the settlement condition (welfare) is hard to measure, the market bets on the *measurement*, not the *reality*.
      *   *Keynesian Angle:* "Conventional Judgment." When we don't know, we assume the present will continue or follow the crowd. Futarchy relies on the crowd knowing something they can't know.
