      *   *The "Welfare" Metric:* Keynes would question the measurability of "national welfare." If the metric is flawed or lagging, the market will game the metric (Goodhart's Law, though that's later, fits Keynesian skepticism).
      *   *The Time Horizon:* Prediction markets need resolution. Welfare is long-term. Markets are short-term. Keynes emphasized the difficulty of forecasting the distant future (*Treatise on Probability*, *General Theory*).
      *   *Manipulation:* If the market moves policy, wealthy actors have a huge incentive to manipulate the market to move policy, not to predict truth. Keynes knew about "smart money" manipulating conventions.
