      *Better Defense:* The **Stalnaker/Battigalli** approach. We need a theory of **belief revision**. If I see a deviation, I revise my beliefs. Do I revise my belief in your rationality? If I do, BI collapses. If I don't (I assume it was a tremble), BI holds. The "CKR implies BI" theorem implicitly assumes a specific belief revision policy (rationality is robust).

