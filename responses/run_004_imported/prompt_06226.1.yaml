prompt: |-
  Okay so this has been bugging me ever since our epistemic game theory seminar last week, and I keep bringing it up with my cohort at lunch instead of doing actual work, so let me just outsource the confusion to you. We were going over the epistemic foundations of backward induction and the professor put up Aumann's result that common knowledge of rationality (CKR) in a generic finite game of perfect information forces the backward induction outcome -- so in something like the centipede game, CKR is supposed to pin down "everyone defects at the very first node," full stop. I can follow the proof mechanics fine. But then she brought up how people like Binmore and Reny think the theorem is basically hollow, maybe even paradoxical, because CKR has to hold at every node in the model, including nodes that are only reached if someone already deviated from what a rational, CKR-respecting player would do. So you've got players who are supposedly both perfectly rational and common-knowledge-of-rationality-respecting at a node whose very existence is evidence against that assumption ever having held. That feels less like "a nice surprising theorem" and more like "we derived a strong conclusion from a inconsistent premise, of course you can prove anything," but obviously actual game theorists don't think Aumann's result is that dumb, so I assume I'm missing something important.

  Could you walk me through, in some depth, what's actually going on in this dispute -- why doesn't Aumann just concede the point, and what's the strongest version of the argument that CKR is still meaningful (and doing real work) off the equilibrium path? I've picked up some hand-wavy phrases like "common knowledge is a property of the whole state-space/model, not something that gets used up once a node is reached" and something about counterfactual or hypothetical knowledge and belief revision at off-path nodes, but I don't have a gut-level feel for why those moves actually dissolve the paradox rather than just relabeling it. If it's relevant, I'd also love to hear how this connects (or doesn't) to the broader question of whether "common knowledge," in the full infinite-regress sense, is ever really the thing doing the work in these results, versus some weaker epistemic condition that just gets called common knowledge for convenience.
