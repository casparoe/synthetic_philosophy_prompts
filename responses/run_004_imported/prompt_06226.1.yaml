      *   *The Defense:* Aumann and defenders (like Stalnaker, though Stalnaker is nuanced) argue that epistemic models are static structures. Knowledge is defined over the *entire* state space, not dynamically updated in a way that destroys the prior axioms. It's about counterfactuals: "If we *were* at this node, what would be known?"
      *   *Infinite Regress:* Brandenburger is key here. Often, finite levels of knowledge suffice for finite games, but CKR is the cleanest way to state it. However, the "strongest" version of the argument often involves distinguishing between *substantive* rationality and *material* rationality, or using conditional belief systems (lexicographic probability systems).

