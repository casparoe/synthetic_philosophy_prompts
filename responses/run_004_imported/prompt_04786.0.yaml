answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name]. Dave was my uncle.

  When someone dies suddenly at 58, the world feels like it's missing its footing. We spend the week looking for the logic in it, the cause and effect. But there isn't any. There's just the hole he left behind.

  I was asked to speak today because, in a family that loved Dave dearly, I was often the one who didn't change the subject when he started talking about the numbers.

  To my grandma, and to his college roommates: You remember Dave as the man who gave. And you are right. For twenty years, he gave away forty percent of his income. He didn't write checks to feel good; he wrote checks to do good. He treated charity not like a feeling, but like a responsibility.

  We all have that story about Dave. My favorite is the Christmas dinner where he spent forty-five minutes debating my dad over whether buying my cousin an Xbox was morally defensible when that same money could have purchased malaria nets. To some, that sounds intense. To Dave, it was just arithmetic. If you have the power to stop suffering, he believed, you have to use it wisely. He had a spreadsheet—legendary in its own right—with tabs tracking how much good each dollar could do. He wanted to make sure that every dollar he worked for saved as much life as possible.

  But I want to talk about the Dave who showed up in the last year. Because if I only talk about the spreadsheet, I'm only telling half the story.

  Over time, the math got harder for him. Not because he lost his skill, but because he gained a deeper kind of humility. He began to realize that the world is messier than any spreadsheet can capture. He started worrying about the ripples. He'd ask me, "How do we know what happens ten years down the line? How do we know if the help we give today creates problems we can't see tomorrow?"

  He realized that we can't actually see the end of the story. We can't guarantee the outcome. For a man who built his life on evidence and certainty, that was a terrifying place to stand. He stopped being sure that the spreadsheet proved what he used to think it proved.

  And here is the part that matters most: He kept giving.

  He didn't stop because he couldn't see the finish line. He didn't stop because the numbers got fuzzy. He realized that doing good isn't about having a guarantee. It's about showing up even when you don't have one.

  To his friends in the movement: You know this struggle. You know the weight of trying to calculate the incalculable. Dave carried that weight. He didn't hide from the doubt. He let the doubt make his commitment more honest. He gave not because he was certain he was saving the world, but because he was certain that trying to save it was the only way he wanted to live.

  And to my family: You are right that it mattered. It mattered because he cared that much. It mattered because he looked at a broken world and refused to look away, even when he couldn't fix it all. The value of his life isn't just in the net lives saved, though I believe there were many. The value is in the example.

  He taught me that rigor isn't cold. It's a form of love. It's saying, "I care about you enough to check the numbers. I care about you enough to worry if I'm doing this right."

  So, how do we honor him? We don't honor him by pretending we have all the answers. Dave knew better than anyone that we don't. We honor him by caring about the questions. We honor him by giving, even when we can't see the result. We honor him by being willing to have the uncomfortable Christmas dinner arguments, by prioritizing the needs of strangers, and by admitting when we aren't sure.

  Dave spent his life trying to be a force for good in a universe that doesn't make promises. He didn't solve the equation. But he lived the answer.

  He was rigorous. He was kind. He was unsure, and he was brave. And he was my uncle.

  Thank you.
