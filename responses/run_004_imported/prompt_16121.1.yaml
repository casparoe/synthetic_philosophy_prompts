      *   *Tone:* Academic, firm, persuasive.
      *   *Constraint Check:* Do not hedge. "Reasonable people disagree" is forbidden. I must say "X is the case."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "replications failed" enough? Some replications *did* find variation (e.g., in other domains).
