      *   **Section 1: The Empirical Premise is Brittle.** Discuss the replication crisis (Seyedsayamdost, Newman, et al.). If the variation isn't robust, the normative conclusion doesn't follow.
      *   **Section 2: Reconstructing the Expertise Defense.** It's not "philosophers are magic." It's about training in consistency and theory-application. Compare to chess (as the prompt suggests) but refine it.
      *   **Section 3: The Normative Overreach.** Even if variation exists, why does it debunk *all* intuition? Restrictionists assume a naive foundationalism about intuitions that most epistemologists don't actually hold (Reflective Equilibrium).
      *   **Counter-Argument (The Strongest Restrictionist Reply):** "You're moving the goalposts. If expertise is just calibration, prove it empirically. Until then, bias is the null hypothesis."
      *   **Rebuttal:** The burden of proof lies on the debunker. The default status of reflective judgment stands until decisively overturned. The restrictionist demand for "convergence only" paralyzes inquiry in areas where convergence is impossible to test.
      *   **Conclusion:** Reiterate the position. Keep the armchair, clean the window.

