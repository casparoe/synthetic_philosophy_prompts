      *   **Constraint:** *Commit to a position.* No hedging, no "reasonable people disagree." Defend the position against the strongest counter-argument.
      *   **Target Audience:** Graduate students/professor (needs high-level philosophical rigor, familiarity with the literature, and clear argumentation).

