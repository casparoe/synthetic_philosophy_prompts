  ### Note for the TA (Contextual)
  Given your personal connection to FND, you likely have a heightened sensitivity to the "is it real?" question. The student's error in Part C is the most common pitfall in teaching *Mad Travelers*. Students often hear "socially constructed" and hear "not real." Hacking spends half the book trying to thread the needle between "it's all in the head (imagined)" and "it's a brain lesion." He lands on "it's a real way of being in the world, made possible by specific historical conditions."

  If the student comes to office hours, the key distinction to draw is between **ontological realism** (is the pain/behavior real? Yes.) and **historical essentialism** (is the category 'fugue' an eternal truth of nature? No.). The student denied the former because they correctly identified the absence of the latter.
