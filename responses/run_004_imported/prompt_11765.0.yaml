      *Also, check the "Alternative Facts" point.* Kellyanne Conway's phrase is pure Arendtian nightmare. It collapses the distinction between fact and opinion. Arendt says opinions are legitimate, facts are not. "Alternative facts" claims facts are malleable like opinions.

