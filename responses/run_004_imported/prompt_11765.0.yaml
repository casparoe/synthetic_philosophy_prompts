      *   *Lying in Politics:* Distinguishes between **Traditional Lying** (hiding secrets, misrepresenting specific facts within a shared reality) and **Modern Political Lying** (rewriting history, destroying the record, creating a new reality).
      *   *Key Concept:* The "Image-Makers." Bureaucracies and experts who create coherent fictions that replace reality.
