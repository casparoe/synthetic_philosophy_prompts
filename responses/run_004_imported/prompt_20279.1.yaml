answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I have the distinct honor of being the grandchild who, for roughly fifteen years, stood in this man's kitchen every Friday night to ask the same question: "Grandpa, is it going to rain Saturday?"

  And for fifteen years, he gave me the same answer: "There's a thirty to forty percent chance of precipitation."

  I used to think that was evasion. I wanted a yes. I wanted a no. I wanted to know if I could use the pool. But the rest of the family, of course, took this as proof of a deeper character flaw. We've teased him for decades that he's incapable of commitment. Ask him if he'll be home for dinner, and he'll give you a window of arrival with a margin of error. Ask him if he likes a movie, and he'll tell you it has a "high likelihood of entertainment value."

  Half of you in this room are from the Channel 8 weather desk. You know that for thirty-six years, his job was to stand in front of a green screen and predict the unpredictable. The other half of you are family, who just know that he never promised anything he couldn't guarantee.

  But, as some of you know, I'm currently writing my IB Philosophy extended essay. And in the process of reading David Lewis, specifically his work on the *Principal Principle*, I realized something important about my grandfather.

  Lewis argues that a rational person's confidence in an outcome should match the objective chance of that outcome. If the objective chance of rain is 30%, your belief that it will rain should be exactly 30%. To say "Yes, it will rain" when the science says 30% isn't optimism; it's a lie. To say "No" isn't pessimism; it's negligence.

  So, when Grandpa gave us percentages, he wasn't being wishy-washy. He was being epistemically virtuous. He was respecting the chaos of the world enough not to pretend he could tame it. He was teaching us, without realizing it, that honesty isn't about giving the answer people want; it's about giving the answer the evidence supports. Even if that evidence was sometimes Aunt Carol's aching knee versus the Doppler radar.

  He spent thirty-six years teaching us that we cannot control the storm. We can only prepare for it, respect it, and tell the truth about it.

  But that brings me to why we are here today.

  Weather is a matter of chance. Love, at its best, is a matter of will.

  For eleven years, [Partner's Name] has stood beside him. She has seen the early mornings, the late nights, and the endless data streams. And today, the dynamic changes. Today, my grandfather is not acting as a meteorologist. He is not calculating objective chances. He is not looking at the isobars of his heart and giving us a confidence interval.

  I asked him last night what the probability was of this marriage lasting a lifetime. I expected a range. I expected a "high degree of confidence."

  Instead, he looked at me and said, "It's done."

  For the first time in thirty-six years, there is no hedge. There is no percentage. There is no "chance of showers."

  There is a philosophy joke that says a philosopher is someone who claims there is no difference between theory and practice, and then proceeds to prove there is. Well, Grandpa, today you are proving the opposite. You are showing us that while you spent a lifetime measuring uncertainty, you have found something in [Partner's Name] that is absolutely certain.

  You have taught us that integrity means matching your words to the truth of the world. And today, the truth of your world is that you are committed, completely and without reservation, to this woman.

  So, if everyone could please raise a glass.

  To [Partner's Name] and [Grandfather's Name]. May your life together have clear skies, may you have good umbrellas when you don't, and may you always know that while the weather is a matter of chance, your love is a matter of fact.

  To the happy couple!
