answer: |-
  Having spent 35 years in the lab, you know that the "crisis" isn't really about the math—it's about the incentives and the human tendency to find patterns in noise (QRPs, p-hacking, HARKing). The root cause is the combination of **researcher degrees of freedom** (flexibility in analysis) and **lack of verification** (treating single studies as truth).

  The S-tier proposals directly constrain that flexibility or enforce verification. The A-tier proposals strengthen the logic of inference but face practical scaling issues. The B-tier proposals improve transparency or metrics but don't stop a determined researcher from manipulating the new metrics. The C and D tiers are largely tool-swaps or mathematical tweaks that ignore the behavioral drivers of the crisis.

