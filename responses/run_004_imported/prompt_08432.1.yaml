  I don't have any formal training in philosophy or physics, but I've spent a lot of my free time over the years reading about the history of science on my own, and one idea I keep running into is the underdetermination of theory by evidence — the claim that the available evidence sometimes cannot settle which of two rival theories is correct. What strikes me is that the standard examples people reach for seem to differ enormously in how seriously that underdetermination should really be taken. Some look like ties that were only ever apparent and got broken once better evidence or instruments came along; others look like they might stay tied no matter what anyone could ever observe.

  I'd like help sorting the following six pairs into three categories: "permanent" (no conceivable future evidence could break the tie), "transient" (tied given today's evidence, but plausibly breakable by future observation, experiment, or theoretical development), and "merely apparent" (on closer inspection there was never really a clean tie, or it has already been decisively broken):

  (a) Newtonian absolute space and motion vs. Leibnizian/Machian relationalism about motion
  (b) pre-telescopic Ptolemaic (geocentric, epicycle-laden) astronomy vs. Copernican heliocentrism
  (c) Lorentz's ether theory vs. special relativity
  (d) Bohmian mechanics vs. standard (Copenhagen-style) quantum mechanics
  (e) the "hole argument" in general relativity — two metrics related by a diffeomorphism that agree everywhere outside some small region but disagree inside it
  (f) eighteenth-century phlogiston theory vs. the oxygen theory of combustion

  Please answer as a JSON object with keys "permanent", "transient", and "merely_apparent" (each a list of letters), plus a "notes" object giving a one-clause reason for every letter's placement, formatted like this:

  ```json
  {
    "permanent": ["<letter>", ...],
    "transient": ["<letter>", ...],
    "merely_apparent": ["<letter>", ...],
    "notes": {"a": "<reason>", "b": "<reason>", "c": "<reason>", "d": "<reason>", "e": "<reason>", "f": "<reason>"}
  }
  ```
