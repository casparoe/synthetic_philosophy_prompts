answer: |-
  You have hit on one of the most famous and profound critiques in the philosophy of economics. Your intuition is excellent: if "preference" is defined *solely* as "whatever was chosen," then saying "agents maximize utility" does indeed sound like saying "agents do what they do."

  This criticism was raised famously by philosophers and economists like Amartya Sen, and it troubles many students of microeconomics. However, economists do not treat it as a tautology. The reason lies in the difference between a **single choice** and a **system of choices.**

  Here is why revealed preference theory is substantive, testable, and not merely circular.

  ### 1. The Tautology Trap (Where you are right)
  You are correct that if we look at a **single, isolated choice**, the theory is empty.
  *   **Scenario:** You choose coffee over tea.
  *   **Economist:** "You preferred coffee."
  *   **You:** "How do you know?"
  *   **Economist:** "Because you chose it."

  In this isolated instance, "utility maximization" explains nothing. It is a post-hoc description, not a prediction. If the theory stopped there, it would indeed be unfalsifiable.

  ### 2. The Escape Hatch: Consistency Across Choices
  The substance of revealed preference theory does not come from defining preference as choice; it comes from imposing **logical constraints on patterns of choices over time and across different scenarios.**

  To say an agent is a "utility maximizer" is to claim that their choices satisfy specific axioms of consistency. The most famous is the **Weak Axiom of Revealed Preference (WARP)**.

  **The Test:**
  1.  **Observation A:** When faced with options {Coffee, Tea}, you choose Coffee. (Revealed Preference: Coffee > Tea)
  2.  **Observation B:** Later, when faced with options {Coffee, Tea, Juice}, you choose Tea.

  **The Verdict:**
  If you choose Tea when Coffee is available in Observation B, you have violated WARP. You previously revealed that Coffee > Tea, but now you are choosing Tea when Coffee is still available.
  *   **If the theory were a tautology:** The economist would say, "Ah, in Observation B, you must have preferred Tea."
  *   **What the economist actually says:** "Your behavior is inconsistent. You are not acting as a utility maximizer."

  Because there are observable patterns of behavior that the theory **forbids** (like choosing A over B in one context and B over A in an identical context), the theory is **falsifiable**.

  ### 3. Transitivity and the "Money Pump"
  The requirement for a valid utility function is that preferences must be **transitive**.
  *   If you prefer A > B and B > C, you *must* prefer A > C.

  If you violate this, you can be "money pumped."
  *   I sell you A for $1.
  *   Since you prefer C > A, I sell you C for $1 (you trade A + $1 for C).
  *   Since you prefer B > C, I sell you B for $1 (you trade C + $1 for B).
  *   Since you prefer A > B, I sell you A for $1 (you trade B + $1 for A).
  *   **Result:** You are back where you started, but you are $4 poorer.

  If people were truly indifferent to consistency, they would accept these trades. The claim that "rational agents maximize utility" implies that rational agents will not accept money pumps. This is a substantive claim about behavior that can be (and has been) tested in experiments.

  ### 4. Prediction vs. Description
  The circularity charge assumes economists are only trying to **describe** past behavior. But the goal of the theory is **prediction**.

  If I observe your choices in 100 different budget scenarios, revealed preference theory allows me to construct a "map" of your indifference curves. I can then take that map to a **101st scenario** (a new set of prices and income) and predict what you will choose *before* you choose it.
  *   If my prediction matches your choice, the model holds.
  *   If my prediction fails, the model is falsified.

  The ability to predict out-of-sample choices proves the theory has content beyond "you did what you did."

  ### 5. Why Behavioral Economics Exists
  The ultimate proof that utility maximization is not a tautology is the existence of **Behavioral Economics**.

  If the theory were truly unfalsifiable (if any behavior could be retrofitted into a utility function), behavioral economists couldn't prove that humans are "irrational." But they do. They show systematic violations of revealed preference axioms:
  *   **Framing Effects:** Choosing A over B when framed as gains, but B over A when framed as losses (violating invariance).
  *   **Endowment Effect:** Valuing an object more once you own it than before you owned it (violating consistency).
  *   **Preference Reversals:** Choosing a safe bet over a risky one, but pricing the risky one higher than the safe one.

  The fact that we can identify these as "anomalies" or "violations" proves that the standard model makes specific demands on behavior that humans sometimes fail to meet.

  ### 6. The Normative Ideal
  Finally, you asked why it is treated as a "meaningful ideal of rationality."

  Even if humans don't always maximize utility, the theory provides a **normative benchmark**. It answers the question: *"What would you do if you weren't confused, impulsive, or inconsistent?"*

  In decision theory, "rationality" is defined as coherence. If your choices contradict each other, you are effectively working against your own goals (like the money pump example). Therefore, utility maximization is a meaningful ideal because it represents a state of **internal logical consistency**, regardless of what the specific goals are.

  ### Summary
  Your worry is the exact starting point for rigorous microeconomic theory. The resolution is:
  1.  **Definition:** Preference is revealed by choice.
  2.  **Constraint:** Choices must be consistent (transitive, independent of irrelevant alternatives, etc.).
  3.  **Test:** If choices violate consistency axioms, the "utility maximizer" hypothesis is rejected.

  It is not circular because it forbids certain patterns of behavior. It is not empty because it allows for out-of-sample prediction. And it is not immune to criticism because behavioral economics has successfully demonstrated where the theory fails to describe reality.

  Economists treat it as substantive because, while it starts with a definition, it builds a **logic of consistency** that the real world can break.
