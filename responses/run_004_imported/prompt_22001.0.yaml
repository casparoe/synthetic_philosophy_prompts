      *   Acknowledge that their intuition is correct *to a point*. If we only look at a single choice in isolation, it *is* tautological.

  3.  **Identify the Missing Piece (The Substance of the Theory):**
      *   The theory isn't about a single choice. It's about *consistency* across *multiple* choices under *different* constraints.
      *   Key concept: **The Weak Axiom of Revealed Preference (WARP)** and **The Strong Axiom (SARP)**.
      *   If I choose A over B today, I shouldn't choose B over A tomorrow if both are available and nothing else changed.
      *   If I choose A when B and C are available, and B when C is available, there are transitivity requirements.
      *   *Falsifiability comes from inconsistency.* If choices violate transitivity or consistency axioms, the utility maximization model is rejected.

  4.  **Structure the Response:**
      *   **Introduction:** Validate the user's concern. It's a famous and legitimate philosophical puzzle.
      *   **The Tautology Trap:** Explain *why* it looks tautological (single choice context).
      *   **The Escape Hatch (Consistency):** Explain that the theory imposes constraints on *patterns* of choices, not just individual acts. Introduce WARP/SARP.
