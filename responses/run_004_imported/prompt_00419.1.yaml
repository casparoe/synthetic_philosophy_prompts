answer: |-
  You didn't just fall for a cute math trick; you actually did mess up your reasoning, but don't feel bad—it's one of the most common errors people make when estimating probabilities intuitively.

  In probability theory and decision science, what Raj did to you is called a **Dutch Book**.

  Here is exactly what went wrong, why Raj was able to guarantee a profit, and how to fix your estimation process for next time.

  ### 1. The Mathematical Error
  The core rule of probability is that if you have a set of outcomes that are **mutually exclusive** (only one can happen) and **exhaustive** (one of them *must* happen), their probabilities must add up to exactly **100%**.

  Let's look at your three outcomes:
  1.  Ships Friday
  2.  Ships Monday (implied: *not* Friday)
  3.  Ships Past Monday (implied: *not* Friday or Monday)

  These are mutually exclusive (the sprint can't ship on Friday AND Monday) and exhaustive (it has to ship sometime).
  *   Your estimate: $70\% + 55\% + 20\% = \mathbf{145\%}$

  Because your total is greater than 100%, you have created an inconsistency in your own belief system. You are effectively saying there is "more than one whole reality" available.

  ### 2. How Raj Made "Free Money"
  To understand why Raj wins, you have to treat your percentages as **prices**.

  When you say, "I am 70% sure," in a betting context, you are implying that a ticket worth \$1.00 (if the event happens) is fairly priced at \$0.70.
  *   If you believe the probability is 70%, you should be willing to **pay \$0.70** to win \$1.00.
  *   Consequently, Raj (taking the other side) **collects \$0.70** from you and promises to pay you \$1.00 if it happens.

  Raj did this for all three outcomes:
  1.  **Friday:** Raj collects **\$0.70** from you. (Pays you \$1 if Friday)
  2.  **Monday:** Raj collects **\$0.55** from you. (Pays you \$1 if Monday)
  3.  **Later:** Raj collects **\$0.20** from you. (Pays you \$1 if Later)

  **The Result:**
  *   **Total Cash Raj Collects:** $\$0.70 + \$0.55 + \$0.20 = \mathbf{\$1.45}$
  *   **Total Cash Raj Pays Out:** No matter what day the sprint ships, only **one** of those outcomes occurs. So Raj only has to pay you **\$1.00**.
  *   **Raj's Risk-Free Profit:** $\$1.45 - \$1.00 = \mathbf{\$0.45}$

  Raj didn't predict the future better than you. He just exploited the fact that you overpriced the risk. You sold him \$1.00 worth of coverage for \$1.45.

  ### 3. Why Did You Do This?
  This isn't usually a math failure; it's a psychology failure. There are two common reasons people sum to over 100%:

  *   **Overconfidence:** We tend to focus on the reasons *why* a specific outcome might happen without simultaneously considering the reasons why it *won't*. You looked at the "Friday" case and saw a lot of reasons it would work (70%). Then you looked at the "Monday" case in isolation and saw reasons for that (55%). You didn't mentally subtract the Friday probability from the Monday probability.
  *   **Overlap Ambiguity:** Sometimes people mean cumulative probability without saying it. For example, "70% sure it ships by Friday" and "90% sure it ships by Monday." But since you used the word "instead," you framed them as exclusive, which makes the 145% sum a clear error.

  ### 4. How to Fix It
  To keep your team honest (and prevent Raj from buying lunch with your points), you need **Coherent Probabilities**.

  **Option A: Normalize**
  If you want to keep the relative weights of your guesses but fix the math, you can normalize them.
  *   Total: 145
  *   Friday: $70 / 145 \approx 48\%$
  *   Monday: $55 / 145 \approx 38\%$
  *   Later: $20 / 145 \approx 14\%$
  *   *New Sum: 100%*

  **Option B: Partition First**
  Instead of guessing percentages directly, start with the 100% and slice it up.
  *   "It's mostly likely Friday, so let's allocate 60% there."
  *   "That leaves 40%. It's unlikely to slip past Monday, so give that 10%."
  *   "That leaves 30% for Monday."

  ### The Takeaway
  Raj didn't beat you with better insight; he beat you with **consistency**.

  In fields like forecasting, finance, and AI, this is a critical concept. If your internal probabilities don't add up, you are vulnerable to being "arbitraged" (like Raj did). It doesn't mean your intuition about the sprint was wrong—you might still be right that Friday is the most likely day—but your *confidence levels* were incoherent.

  Next time, check your sum before you announce the numbers. If it's not 100%, Raj will buy lunch.
