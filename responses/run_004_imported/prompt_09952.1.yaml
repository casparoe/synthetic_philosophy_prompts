answer: |-
  Good evening, everyone. For those who don't know me, I'm [Sister's Name]'s brother. I'm also currently grinding through a PhD in political theory, which means I share a departmental hallway with about half the people in this room, and the other half are family members who are just happy there's an open bar.

  I was honored when [Sister's Name] asked me to give this toast. But then, she handed me a set of guidelines. Apparently, giving a wedding speech in this family is subject to the same rigorous peer review as a dissertation. She was very specific about what she *didn't* want to hear. She said, "Please do not talk about marriage as a timeless tradition, and please do not talk about it as a legal contract."

  For the family members here: basically, she doesn't want me to say they are getting married because "that's what people do," or because they signed a license.

  And she also said, "Don't talk about it like there's some magical, invisible glue binding them together that exists independently of what they actually say to one another."

  For the philosophy cohort: She rejects the metaphysical realist account of marital bonds. She doesn't believe the vows tap into a pre-existing cosmic order.

  So, I was left with a challenge. How do you talk about the binding nature of marriage without appealing to society, the law, or the stars? Well, luckily, I know the bride. I know how she thinks. And the answer lies in what is happening right now, between the two of them.

  [Sister's Name], your work argues that a promise binds us not because of a rulebook, but because of a person. It binds because you have looked someone in the eye, you have intentionally invited them to trust you, and you have given them a reason to rely on your word. To break that promise isn't to break a law; it is to betray the specific person who made themselves vulnerable to you.

  And that, to me, is the most beautiful thing about the commitment you and [Groom's Name] are making today.

  You aren't standing here to check a box for society. You are standing here to do something much more dangerous, and much more intimate. You are handing each other a specific kind of power.

  [Groom's Name], in a few moments, [Sister's Name] is going to tell you that she will be there for you. She is going to deliberately shape your expectations. She is going to say, "You can count on me." And by doing that, she is placing her integrity in your hands. But more importantly, she is inviting you to rest your weight on her.

  And you are doing the same for her.

  In this view, the "binding" force of marriage isn't a chain; it's a bridge. It is built entirely out of the assurance you give one another that you will not exploit the trust you have invited. It means that when things are difficult—and they will be—you won't do the easy thing. You won't do the thing that is socially acceptable, or legally permissible. You will do the thing that honors the specific reliance the other person has placed in you.

  For the family: This basically means that love isn't just a feeling you have. It's a job you take. It's the daily decision to be the person your partner believes you are.

  I have watched the two of you together for years. I have seen the way you listen to each other. It isn't the polite listening of strangers, and it isn't the passive listening of people who assume they already know the script. It is the active, careful listening of people who know that what the other says *matters*, because it creates the ground they stand on.

  [Sister's Name], you have spent years studying what we owe to each other. But today, you aren't writing a paper. You are living the answer. You are defining what you owe to [Groom's Name], not because a professor told you to, and not because a statute requires it, but because you love him enough to give him the assurance that he is safe with you.

  [Groom's Name], welcome to the family. We are a loud, opinionated bunch, as you can see. But we take care of our own. And seeing how you look at her, I know you already understand the assignment. You understand that the vow isn't about the words themselves. It's about the silence after the words, where you prove them true.

  So, if everyone could please raise a glass.

  To [Sister's Name] and [Groom's Name]. May you always honor the trust you invite. May you never treat each other's reliance as a burden, but as a gift. And may you find, in the promises you make to one another, a freedom that no contract could ever grant and no tradition could ever hold.

  To the bride and groom.
