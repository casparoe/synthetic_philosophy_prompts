prompt: |-
  I'm a PhD student in political theory, and I'm giving the toast at my sister's wedding next month. She's finishing a PhD in philosophy, and her dissertation defends an assurance-based account of promising, in the spirit of Scanlon's discussion in What We Owe to Each Other: what makes breaking a promise wrong is that you've deliberately invited someone's trust and then exploited it, not that you've broken some pre-existing social rule. She rejects the Humean, conventionalist picture on which promises bind only because society has found the practice useful, since she thinks that picture makes fidelity sound arbitrary and rule-bound rather than something owed, personally, to the one person who trusted you. She's asked me to avoid the usual wedding-speech language of vows as a "tradition" or a "contract" -- that is exactly the view she rejects -- but also not to make the promise sound binding through some mysterious bond floating free of anything she and her fiancé actually do, since that isn't her view either. About half the guests are her philosophy cohort, who will catch precisely what's being defended and avoided; the rest are relatives who have never read Hume or Scanlon. Please write a five-minute toast, warm and allowed to be funny in places, that uses her actual view of why promises bind to say something true and moving about the marriage, without lapsing into a seminar or quietly smuggling back in the picture she rejects.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in political theory (brother of the bride).
      *   **Occasion:** Sister's wedding toast.
      *   **Audience:** 50% Philosophy PhD cohort (will understand technical references), 50% Relatives (need accessibility/warmth).
      *   **Bride's View:** Assurance-based account of promising (Scanlonian).
          *   *Core Idea:* Breaking a promise is wrong because you invited trust and exploited it (personal obligation), *not* because you broke a social rule/convention (Humean/Conventionalist) or because of a mysterious metaphysical bond (Platonist/Magical).
      *   **Constraints:**
          *   Avoid "tradition," "contract," "social utility" language (Humean).
          *   Avoid "mysterious bond," "fate," "meant to be" language (Metaphysical).
          *   Must be warm, funny, moving.
          *   Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).
          *   Must accurately reflect her specific philosophical stance without sounding like a lecture.

  2.  **Deconstruct the Philosophical Stance for the Toast:**
      *   *The "No" List:* Don't talk about marriage as an institution, a legal contract, a societal building block, or "how it's always been done." Don't talk about soulmates, destiny, or magic.
      *   *The "Yes" List:* Talk about *trust*, *invitation*, *expectation*, *personal responsibility*, and the specific relationship between two people. The binding force comes from *what they say to each other* and the *reliance* that creates.
      *   *The Balance:* It needs to sound like a wedding toast, not a dissertation defense. The philosophy should be the *structure*, not the *decoration*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience (family vs. philosophers). Set a warm tone. Make a joke about the "academic" nature of the request.
      *   **The Philosophical Hook (Subtle):** Address the nature of the vows without using forbidden words. Frame the vows as an act of creating expectation, not signing a treaty.
      *   **The Core Argument (The "Assurance" View):** Explain that the power of the promise comes from the partner *trusting* the promise. It's about the specific dynamic between the bride and groom.
      *   **Application to Marriage:** How does this look in real life? It's not about following rules; it's about not disappointing the person who counted on you. It's about care.
      *   **The Groom:** Bring him into the frame. He is the one extending trust.
      *   **Closing:** A wish for the future based on this view. A toast.

      *   *Self-Correction during drafting:* I need to make sure I don't accidentally say "contract." I also need to make sure the relatives don't feel lost. I can use the term "philosophy" lightly but explain the concept through metaphor.
      *   *Tone Check:* Is it too dry? Need more emotion. Is it too inside-baseball? Need to explain the Scanlonian bit simply.
      *   *Key Phrase to include (conceptually):* "Inviting trust." "Creating a reason to rely."

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the brother. I study politics, she studies philosophy. She told me exactly what not to say. No contracts, no traditions. She says promises matter because you tell someone "I will do this" and they believe you. If you don't do it, you hurt *them*, not society. So, [Groom], she is trusting you. Don't break that trust. Not because the law says so, but because she's your wife. Cheers.

      *Critique 1:* Too blunt. Needs more poetry and warmth. Needs to address the 50% non-philosophers better.

  5.  **Drafting - Iteration 2 (Adding Flesh and Blood):**
      Start with the pressure of the task. "My sister gave me a rubric." Joke about the philosophy department watching.
      Explain the view: It's not about the institution of marriage. It's about the specific look in your eye when you say "I do." It creates an expectation.
      To the Groom: She is handing you her vulnerability.
      To the Family: This is why their love is strong. It's chosen, not forced.
      Toast: To the future built on this specific trust.

  6.  **Refining the Philosophy (Scanlonian Nuance):**
      Scanlon's Principle F (roughly): If you intentionally lead someone to expect you will do X, and they rely on that, you must do X.
      *Translation for Toast:* "You have given them a reason to count on you."
      *Avoid:* "Social practice," "Convention," "Utility."
      *Avoid:* "Mystical bond," "Divine ordinance."

  7.  **Finalizing the Text (incorporating humor and heart):**
      *   *Joke:* Acknowledge the "peer review" aspect of the speech.
      *   *Metaphor:* Building a bridge vs. following a map. Or better: The act of speaking itself creates the obligation.
      *   *Emotional Core:* The vulnerability of trusting someone.
      *   *Ending:* Raise a glass to the "assurance."

  8.  **Review against Constraints:**
      *   Did I say "contract"? No.
      *   Did I say "tradition"? No.
      *   Did I imply magic/destiny? No.
      *   Is it 5 minutes? (Word count check: ~800 words is usually safe for 5 mins with pauses).
      *   Is it warm? Yes, focusing on care and trust.

  9.  **Polishing:** Ensure the transition from the philosophical joke to the sincere message is smooth. Make sure the relatives feel included in the "inside joke." (e.g., "For those of you who aren't philosophers, this basically means...")

  **(Self-Correction during final polish):** Make sure I don't make it sound *too* transactional. "You invited trust" can sound cold. I need to emphasize that *inviting trust is an act of love*. It's saying "I want you to feel safe with me."

  10. **Final Word Count Check:** Aiming for roughly 800-900 words.

