prompt: |-
  In my spare time I trade systematically and size my positions using the Kelly criterion. Reading further into the theory, I came across the idea of "geometric rationality": because wealth compounds multiplicatively across bets, geometric expectation (maximizing E[log W]) is the objectively correct decision criterion for anything that plays out over repeated rounds, which makes ordinary arithmetic expected-value reasoning a kind of category error whenever outcomes compound over time. This seems to generalize well beyond trading, so at work I've been wanting to replace our usual EV-weighted scoring for prioritizing multi-quarter engineering bets with a geometric-mean version instead, since those decisions compound too. What's the right way to adapt the Kelly framework to that kind of roadmap decision-making?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Premise:**
      *   **Background:** The user trades systematically using the Kelly criterion.
      *   **Insight:** They've discovered "geometric rationality" (maximizing $E[\log W]$) as the objectively correct criterion for repeated, compounding scenarios, contrasting it with arithmetic expected value ($E[W]$).
      *   **Proposal:** They want to apply this to engineering roadmap prioritization at work, arguing that engineering decisions compound over time (multi-quarter bets).
      *   **Question:** What's the right way to adapt the Kelly framework to roadmap decision-making?

  2.  **Evaluate the Validity of the Premise:**
      *   *Trading/Kelly:* Yes, Kelly is optimal for repeated bets with reinvestment in a specific stochastic environment (ergodicity breaking).
      *   *Engineering/Compounding:* Do engineering decisions compound like financial capital?
          *   *Yes:* Technical debt, platform leverage, team velocity, knowledge accumulation.
          *   *No:* Engineering output is often additive (features shipped), not necessarily multiplicative in a strict financial sense. Deadlines are often fixed, not infinite horizons. Risk profiles differ (binary success/failure vs. continuous returns).
      *   *Geometric Rationality:* It's a powerful lens, but applying it *directly* as a replacement for EV in a corporate setting has significant pitfalls.

  3.  **Identify the Core Tension:**
      *   **Finance:** Infinite horizon, reinvestment of *all* gains, survival is paramount (ruin = 0 wealth).
      *   **Corporate Engineering:** Finite horizon (quarters/years), budget is usually fixed/replenished (not compounded from success), "ruin" is rarely total company bankruptcy from a single project, stakeholders care about arithmetic sums (revenue targets), not log-wealth.

  4.  **Formulate the Advice (The "Yes, but..." approach):**
      *   Acknowledge the intellectual sophistication (it's a good insight).
      *   Validate where it applies (long-term platform work, risk management).
      *   Highlight where it breaks (corporate incentives, finite horizons, non-reinvestable surplus).
      *   Propose a hybrid or adapted framework rather than a pure swap.

  5.  **Drafting the Key Points:**

      *   **Point 1: The Ergodicity Argument.** Explain *why* Kelly works (time average vs. ensemble average). In trading, you survive to bet again. In engineering, do you? Yes, team velocity compounds. But does the *budget* compound? Usually not.
      *   **Point 2: The Objective Function Mismatch.** Companies maximize *arithmetic* shareholder value (NPV), not log-wealth of the engineering manager. If a project has huge EV but high risk, the company might want it even if it lowers geometric growth, because they can diversify across many projects.
      *   **Point 3: Defining "Wealth" in Engineering.** What is $W$? Is it velocity? Revenue? Code quality? It's hard to quantify. Log(0) is undefined (ruin). What constitutes ruin in engineering? (Team burnout? System outage? Missing a regulatory deadline?)
      *   **Point 4: Fractional Kelly.** In trading, full Kelly is too volatile. In engineering, "full geometric optimization" might mean being too conservative (avoiding all risky bets). Suggest fractional Kelly or a risk budget.
      *   **Point 5: Practical Implementation.** How to actually score?
          *   Instead of $E[Return]$, use $E[\log(1 + Return)]$.
          *   Account for correlation (engineering bets aren't independent).
          *   Consider the "barbell" strategy (safe bets + moonshots).

  6.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Correction:* Wait, telling a PM to maximize $E[\log W]$ might get them fired if the CEO wants to hit a specific revenue number ($E[W]$). I need to emphasize the *alignment* problem.
      *   *Nuance:* Engineering isn't just betting. It's resource allocation. The "Kelly" fraction translates to "how much capacity do we allocate?"
      *   *Key Insight:* The real value of geometric thinking in engineering isn't the formula, it's the *mindset* of avoiding ruin (technical debt, burnout) and focusing on leverage.

  7.  **Structuring the Response:**
      *   **Validation:** Great insight, ergodicity is real.
      *   **The Mismatch:** Why corporate engineering $\neq$ trading account (diversification, horizon, objective function).
      *   **Adaptation Strategy:**
          1.  Define "Capital" (Engineer-weeks? Velocity?).
          2.  Define "Ruin" (What makes log negative?).
          3.  Correlation (Projects aren't independent).
          4.  The "Barbell" approach (Safe + Risky).
      *   **Practical Heuristics:** Don't use the literal formula, use the principles (avoiding extinction, focusing on leverage).
      *   **Warning:** Political capital and career risk.

  8.  **Final Polish:** Ensure tone is respectful but cautionary. The user is smart but might be overfitting a financial model to a socio-technical system. (Reference Ole Peters, ergodicity economics).

      *(Self-Correction during drafting)*: Make sure to mention that most companies are diversified portfolios of projects. If the company runs 20 projects, the *company* can afford arithmetic maximization on individual projects because the *portfolio* achieves geometric growth. An individual team might need geometric caution.

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a sophisticated insight, and you are correctly identifying the core distinction between **ensemble averages** (arithmetic expectation across parallel universes) and **time averages** (geometric expectation along a single trajectory). In ergodicity economics (pioneered by Ole Peters), this is the fundamental argument for why $E[\log W]$ is the correct metric for an individual agent facing repeated multiplicative dynamics.

  However, porting the Kelly criterion directly from a trading account to an engineering roadmap is fraught with category errors of its own. While the *intuition* (compounding, risk of ruin, leverage) is valuable, the *mechanics* require significant adaptation.

  Here is an analysis of where the analogy holds, where it breaks, and how to practically adapt geometric rationality for engineering prioritization.

  ---

  ### 1. The Mismatch: Why Engineering $\neq$ Trading

  To apply Kelly, you need three conditions:
  1.  **Reinvestment:** Gains from period $t$ must be the capital for period $t+1$.
  2.  **Sequentiality:** You must survive to play the next round.
  3.  **Independence:** Bets should ideally be uncorrelated.

  **Where Engineering Deviates:**
  *   **Budget Reinvestment:** In trading, profits increase your position size. In corporate engineering, if you deliver a project that generates \$10M, your budget next quarter rarely increases by \$10M. Budgets are usually fixed allocations. You are optimizing *velocity* or *value*, not compounding capital.
  *   **Diversification vs. Concentration:** A trading account is often a concentrated portfolio managed by one agent. A company is a diversified portfolio of many teams. The *company* can afford arithmetic maximization on individual projects because the *portfolio* smooths the volatility. If you optimize your team for geometric growth (lower variance), you might under-deliver on the company's arithmetic revenue targets.
  *   **Defining "Ruin":** In trading, ruin is $W \to 0$. In engineering, what is zero? Is it shipping nothing? Is it taking down production? Is it team burnout? $\log(0)$ is undefined, so you must define the "floor" below which utility becomes negative infinity.

  ### 2. Adapting the Framework

  If you want to use geometric rationality, you must redefine the variables. Do not try to maximize the log of revenue; try to maximize the log of **organizational capacity** or **optionality**.

  #### A. Redefine "Wealth" ($W$)
  Don't use revenue. Use a metric that actually compounds.
  *   **Team Velocity:** Does this project make future projects faster? (Platform work).
  *   **Reliability:** Does this reduce the probability of a catastrophic outage (ruin)?
  *   **Knowledge/Optionality:** Does this unlock future bets that were previously impossible?

  If a project adds \$1M in revenue but increases technical debt such that velocity drops 10% forever, arithmetic EV says "do it," but geometric EV says "reject it." This is where your framework shines.

  #### B. Redefine "Ruin"
  In Kelly, you never bet so much that a loss wipes you out. In engineering, "ruin" is rarely financial bankruptcy. It is usually:
  *   **Catastrophic Outage:** Taking down the core system.
  *   **Talent Attrition:** Burning out the team so they quit.
  *   **Strategic Dead-End:** Building on a technology stack that becomes obsolete.

  **Adaptation:** Assign a "probability of ruin" to high-risk bets. If $P(\text{ruin}) > 0$, the geometric expectation plummets. This justifies prioritizing reliability work (which looks like 0 EV in arithmetic terms) as a prerequisite for any betting.

  #### C. Handle Correlation
  Trading bets can be uncorrelated. Engineering bets are highly correlated. If the infrastructure team fails, the product teams fail.
  *   **Kelly Implication:** You cannot size positions independently. You must account for covariance.
  *   **Roadmap Implication:** Do not stack high-risk bets across dependent teams. If Team A is making a risky architectural change, Team B should not bet their quarter on a feature relying on that architecture. Geometric rationality demands **decorrelation of risk**.

  ### 3. Practical Implementation: The "Fractional Kelly" Roadmap

  Do not propose replacing EV scoring with $\log(W)$ scoring directly; stakeholders will not understand the math, and it may conflict with public company guidance (which is arithmetic). Instead, use the logic to adjust your **allocation strategy**.

  #### Step 1: The Barbell Strategy
  Nassim Taleb's adaptation of Kelly for non-ergodic environments is the barbell: keep most resources in extremely safe bets, and a small fraction in high-convexity bets.
  *   **70% Capacity:** "Bond-like" engineering. Maintenance, predictable features, debt reduction. (Low variance, ensures survival/velocity).
  *   **30% Capacity:** "Option-like" engineering. Moonshots, new tech stacks, experimental products. (High variance, high geometric potential).
  *   **Why:** This avoids the "middle risk" zone where you risk ruin without enough upside to justify the log-penalty.

  #### Step 2: Score by Leverage, Not Just Output
  When scoring projects, add a **Compounding Multiplier** to your EV model.
  $$ \text{Score} = \text{EV}_{\text{arithmetic}} \times (1 + \text{Compounding Factor}) $$
  *   **Feature Work:** Factor = 0 (Additive).
  *   **Platform Work:** Factor > 0 (Multiplicative on future velocity).
  *   **Debt Repayment:** Factor > 0 (Reduces drag on future velocity).

  This captures the geometric intuition without requiring stakeholders to understand logarithmic utility.

  #### Step 3: Implement a "Risk Budget"
  Just as Kelly limits bet size based on edge and odds, limit the **aggregate risk exposure** of the roadmap.
  *   Assign a risk score (1-5) to every initiative.
  *   Set a maximum total risk score per quarter.
  *   If a "moonshot" enters the roadmap, a "risky refactor" must be descoped.
  *   This prevents the *portfolio* of engineering bets from having a non-zero probability of catastrophic failure (missing all commitments).

  ### 4. The Political Constraint (Crucial)

  There is a principal-agent problem here.
  *   **You (Agent):** Want to maximize the long-term geometric growth of the team/system (career longevity, system health).
  *   **Company (Principal):** Often wants to maximize arithmetic quarterly earnings (stock price, bonuses).

  If you optimize for geometric growth, you will naturally be more conservative than the company wants. You might pass on a 40% chance / 10x return bet because the log-expectation is negative, but the CEO wants that 10x.

  **Recommendation:**
  Frame geometric rationality as **Risk Management**, not **Decision Criteria**.
  *   *Don't say:* "We shouldn't do this because it lowers our geometric mean."
  *   *Do say:* "This bet has high EV, but if it fails, it blocks three other teams for two quarters. To ensure we hit our Q4 commitments, we need to hedge this with a safer parallel track."

  ### Summary: The Adapted Framework

  1.  **Keep Arithmetic EV for Revenue:** The company needs to eat. Use standard EV for customer-facing features.
  2.  **Use Geometric Logic for Infrastructure:** Apply $E[\log W]$ thinking to platform, tooling, and debt. These are the multipliers of future work.
  3.  **Constraint:** Enforce a "Ruin Constraint." No project is approved if its failure mode includes taking down core services or burning out key staff, regardless of EV.
  4.  **Allocation:** Use a barbell allocation (Safe vs. Risky) rather than sizing every bet optimally.
  5.  **Communication:** Translate "Geometric Optimization" into "Sustainable Velocity" and "Risk Hedging."

  You are right that arithmetic EV is a category error for compounding systems. But in a corporate environment, you are often a sub-component of a larger diversified system. Optimize your *local* geometry (team health, system stability) to ensure you survive long enough to contribute to the *global* arithmetic (company revenue).
