  2.  **Deconstruct the Philosophical Tension (Strawson):**
      *   *Excusing Conditions:* The agent is part of the moral community, but *this specific act* didn't reflect their true will/intent (e.g., "I didn't see you," "I was pushed"). Responsibility is acknowledged but blameworthiness is reduced for this instance.
      *   *Exempting Conditions:* The agent is temporarily or permanently outside the scope of normal reactive attitudes (e.g., severe mental illness, childhood). We take the "objective attitude" toward them (manage/treat rather than resent/reason with).
      *   *The Problem:* The board is split between treating this as a standard violation (ignoring the mental state) vs. treating the student as wholly exempt (no responsibility).
      *   *The Middle Path:* Strawson acknowledges these categories aren't always rigid. A temporary dissociative episode is arguably an *exempting* condition for the *duration of the episode*, but the student returns to the moral community afterward. The challenge is adjudicating the *act* without defining the *person* permanently as exempt.
      *   *Victim's Perspective:* The roommate's resentment is valid. Even if the aggressor is exempt, the harm is real. The university has a duty of care to the victim. A purely medicalized response (no finding of responsibility) might feel like gaslighting to the victim. A purely punitive response ignores the medical reality.

