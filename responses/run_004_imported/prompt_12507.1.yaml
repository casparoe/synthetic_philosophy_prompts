      *   **Philosophical Framework:** P.F. Strawson's "Freedom and Resentment" (Excusing vs. Exempting conditions).
      *   **Key Question:** If we treat this as an exempting condition (psychological abnormality), does the verdict have to be global/forward-looking, or can it be specific to this incident while maintaining future accountability? Can we do this without invalidating the victim's distress?
      *   **Requirements:**
