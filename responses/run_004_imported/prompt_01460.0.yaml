      *   *Section 3: The Internalist Objection.* Can they deny MFE? Yes, by denying Safety. They can claim "Justification is internal, so indistinguishability preserves justification." Williamson replies that Knowledge is Factive + Safety. Internalists must retreat to Justification (which might be luminous) but concede Knowledge is not.
      *   *Section 4: The Vagueness Worry.* Explain Epistemicism. Williamson *agrees* there is a sharp cutoff for "feeling cold." The argument isn't that the predicate is vague in a way that dissolves boundaries; it's that *knowledge* cannot locate the boundary. The Sorites structure is used to show the *epistemic* limit, not the *ontic* vagueness. It's consistent.
