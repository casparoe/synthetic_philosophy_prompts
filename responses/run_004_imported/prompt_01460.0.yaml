      *   *Williamson's Defense:* It's not *just* reliabilism. It's about the nature of *knowledge*. Knowledge requires non-accidental truth. If cases are indistinguishable, the basis for belief is the same. If the belief is knowledge in $\alpha_i$ (where it's true), but false in $\alpha_{i+1}$ (because it's too warm), then in $\alpha_i$ the belief was too close to error to count as knowledge.
      *   *Internalist Objection:* Internalists might deny that indistinguishability implies the same epistemic status regarding *knowledge*. They might argue access is direct.
