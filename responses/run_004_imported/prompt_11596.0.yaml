      *   **Rawls's Original Position:** Agents are risk-averse (Maximin rule). They choose the Difference Principle. Harsanyi critiques this as irrational risk-aversion violating EU theory.
      *   **Buchak's REU Theory:** Generalizes EU. Introduces a risk function $r(p)$. If $r(p) = p$, it's EU. If $r(p)$ is convex/concave, it models risk-aversion/seeking *as a distinct attitude from utility curvature*.
      *   **Buchak's Application to Justice:** If parties in the OP use REU with a risk-averse function, they don't go all the way to Maximin (Rawls) nor stay at Summation (Harsanyi). They land somewhere in between: Prioritarianism (weighting gains to the worse-off more), but not lexically.

  3.  **Address Question 1: Which assumption does REU deny?**

      *   Harsanyi relies on the vNM axioms to derive EU.
      *   The specific axiom REU violates is the **Independence Axiom** (specifically, the Allais-type violations).
      *   In Harsanyi's framework, rationality *just is* EU maximization.
      *   Buchak argues that risk-attitude is a separate parameter from utility. Harsanyi conflates risk-aversion with diminishing marginal utility. Buchak separates them.
