      *   **Moral significance of risk-attitudes:** If rationality permits a range of risk-attitudes, then choosing a specific distributive principle isn't just about "what is rational," but "what risk-attitude is morally appropriate?" This shifts the burden from formal rationality to substantive moral philosophy.
      *   **Separation of Utility and Risk:** It allows us to model concern for the worse-off *without* assuming diminishing marginal utility of primary goods. This clarifies the debate: Is prioritarianism about utility or about risk?

