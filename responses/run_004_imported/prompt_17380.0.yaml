answer: |-
  Here are ten questions designed to corner the "flicker strategy" defense, structured to prevent retreat into stock phrases. They move from the core strategy to technical refinements, then to broader implications, ending with the sourcehood challenge.

  ### 1. The "Flicker" Criterion
  **Question:** You rely heavily on the claim that residual alternative possibilities in Frankfurt cases are mere "flickers" that cannot ground moral responsibility. But isn't the definition of a "robust" alternative possibility precisely one that *could* ground responsibility? If you define robust alternatives as those that ground responsibility, and then argue flickers don't ground responsibility because they aren't robust, aren't you arguing in a circle?

  **Follow-up:**
  *   **If she says "No, there's an independent criterion for robustness":** Ask her to state that criterion without using the word "responsibility" or "blame." If she can't, press on whether the intuition that flickers are irrelevant is actually doing the philosophical work, rather than the metaphysics of the case.
  *   **If she says "It's an intuitive distinction":** Ask why the intuition of the incompatibilist (who sees *any* lack of alternatives as killing responsibility) should yield to the intuition of the compatibilist here. Is the Frankfurt case an argument, or just an intuition pump for those who already agree with you?

  ### 2. The Dilemma Defense (Widerker/Ginet)
  **Question:** Let's go to the Dilemma Defense. For Black's prior sign to reliably indicate Jones's choice, the link between the sign and the action must be either deterministic or indeterministic. If it's deterministic, you've begged the question against the libertarian by assuming determinism is possible in the actual sequence. If it's indeterministic, Jones could still do otherwise after the sign, meaning PAP isn't actually falsified. Which horn are you grabbing?

  **Follow-up:**
  *   **If she grabs the Deterministic Horn:** Press her on whether a case that assumes the falsity of libertarianism can be used to *prove* the falsity of libertarianism (or PAP, which libertarians hold). Ask if this reduces the Frankfurt project to a *reductio* that only works if you already assume compatibilism.
  *   **If she grabs the Indeterministic Horn:** Ask how she blocks the "flicker" objection here. If Jones can still do otherwise after the sign, even if only for a split second, why is that alternative insufficient for PAP? This forces her to admit PAP requires *robust* alternatives, not just *any* alternatives, which shifts the debate to the definition of PAP itself.

  ### 3. Buffer and Blockage Refinements (Mele/Robb, Hunt)
  **Question:** Proponents like Mele, Robb, and Hunt have tried to fix the Dilemma by using "buffer zones" or "blockage" to rule out alternatives without a prior deterministic sign. Do these structural refinements actually close the gap, or do they just relocate the problem to a different moment in the causal sequence?

  **Follow-up:**
  *   **If she says "They close the gap":** Ask her to identify the specific mechanism that blocks the alternative without determining the action. If the blockage is causal, isn't it just a hidden determiner? If it's non-causal, how does it constrain ability?
  *   **If she says "They relocate it but that's fine":** Ask why the relocation is an improvement. If the agent still lacks control over the blockage itself, haven't we just pushed the responsibility-destroying constraint back one step rather than eliminating it?

  ### 4. The Gap Between PAP and Compatibilism
  **Question:** Even if we grant that Frankfurt cases falsify the Principle of Alternative Possibilities (PAP), that is not logically identical to proving that responsibility is compatible with determinism. An incompatibilist could concede PAP is false but maintain that determinism *still* destroys responsibility via the Sourcehood condition. What licenses the jump from "PAP is false" to "Compatibilism is true" in your view?

  **Follow-up:**
  *   **If she says "PAP was the only obstacle":** Ask for her argument that Sourcehood is satisfied in a deterministic world. Why doesn't the Frankfurt case just show that *leeway* isn't required, while leaving the *source* problem untouched?
  *   **If she says "FSCs show actual sequences are what matter":** Press on whether an actual sequence in a deterministic world is sufficiently similar to the actual sequence in a Frankfurt case to inherit the responsibility judgment.

  ### 5. The "Sign" and Causal Determination
  **Question:** In the classic Black-and-Jones case, Black intervenes only if Jones shows a sign of wavering. But if Jones is truly free in the actual sequence, the sign itself must be a free action. If the sign is free, Jones could have refrained from showing the sign, triggering Black. Doesn't this mean Jones *always* retains the power to trigger the intervener, preserving a robust alternative possibility?

  **Follow-up:**
  *   **If she says "The sign is involuntary":** Ask how Jones is responsible for the action if the reliable predictor of that action (the sign) is outside his control.
  *   **If she says "He can't refrain from the sign":** Point out that this implies a constraint on Jones prior to the decision. Ask why a constraint that removes the ability to avoid the intervention doesn't count as a constraint on the ability to do otherwise.

  ### 6. Pereboom's Manipulation Argument
  **Question:** Derk Pereboom's Manipulation Argument suggests that if an agent's action is causally determined by factors beyond their control (like a team of neuroscientists), they aren't responsible. Since Frankfurt cases rely on an "actual sequence" view where alternatives don't matter, what stops Pereboom's fully manipulated agent from being responsible on your view?

  **Follow-up:**
  *   **If she says "The manipulated agent isn't responsible":** Ask what the relevant difference is between the manipulated agent and a deterministically caused agent. If there is no difference, she must admit determinism kills responsibility. If there is a difference, ask why the presence of Black (who *could* intervene but doesn't) makes Jones responsible while the neuroscientists (who *did* determine) do not.
  *   **If she says "The manipulated agent IS responsible":** This is a hard compatibilist stance. Ask her to explain how this doesn't violate our basic intuitions about autonomy and coercion.

  ### 7. The Explanatory Role of the Intervener
  **Question:** In a successful Frankfurt case, Black never actually intervenes. Jones acts entirely on his own. If Black plays no causal role in the actual sequence, why does Black's *presence* matter for the assessment of Jones's responsibility? Why isn't Jones's responsibility status exactly the same as it would be if Black were absent?

  **Follow-up:**
  *   **If she says "Black's presence removes the alternative":** Remind her of her own flicker strategy. If the alternative is removed but is just a "flicker," why does the removal matter?
  *   **If she says "It shows alternatives aren't needed":** Ask if this is a modal claim about other worlds or a claim about this world. If it's about this world, and Black does nothing, then Black is explanatorily idle. Why let an idle mechanism dictate our metaphysics of responsibility?

  ### 8. The "Intuition Stipulation" Charge
  **Question:** Critics argue that Frankfurt cases only work if we *stipulate* that Jones is responsible in the actual sequence. But if we stipulate he is responsible, haven't we already assumed compatibilism? If we don't stipulate it, the incompatibilist will simply say, "Black's presence makes the situation coercive or determined, so Jones isn't responsible." How do you break this stalemate without begging the question?

  **Follow-up:**
  *   **If she says "We don't stipulate, we intuit":** Ask why the incompatibilist's intuition (that the setup precludes responsibility) is less valid than the compatibilist's. Is there a neutral ground?
  *   **If she says "The actual sequence is identical to a free action":** Press on whether "identical" means qualitatively or metaphysically. If metaphysically, and determinism is true, the incompatibilist denies the action is free. So the case still begs the question.

  ### 9. The Normative Significance of Constraints
  **Question:** Let's set aside metaphysics for a moment. Even if Jones *could not have done otherwise*, does the *fact* that he was constrained matter normatively? If I praise Jones, but Jones knows Black would have forced him if he hadn't chosen it, does that knowledge undermine the praise?

  **Follow-up:**
  *   **If she says "No, because he did it on his own":** Ask if the *guarantee* of the outcome changes the nature of the praise. If the outcome was inevitable due to Black, is Jones merely a conduit?
  *   **If she says "Yes, it undermines praise":** Then ask why we treat determinism differently. If a guarantee from Black undermines praise, why doesn't a guarantee from the laws of nature?

  ### 10. The Hard Question: Sourcehood Without Leeway
  **Question:** This is the crux. Your defense rests on the idea that "actual sequence" control is sufficient for responsibility, even without "leeway" (alternative possibilities). But if an agent has no leeway whatsoever—if the world is such that they literally could not have done anything else—in what sense are they the *source* of the action rather than just the *location* where the action happens? If you remove all ability to do otherwise, even flickers, what is left of the "agent" that does the work?

  **Follow-up:**
  *   **If she says "The causal history is what matters":** Ask if that causal history terminates in the agent. If determinism is true, the history terminates outside the agent. If it terminates in the agent, isn't that just a form of agent-causation (which usually requires leeway)?
  *   **If she says "Responsibility doesn't require ultimate sourcehood":** Ask what the point of responsibility is then. If it's not about being the ultimate source, and not about having alternatives, is it just a social tool for regulation? If so, why defend it as a metaphysical truth about free will?

  *(Note: This final question forces her off the "flicker" defense because it doesn't offer an alternative possibility to dismiss. It attacks the positive account of control that remains once alternatives are stripped away.)*
