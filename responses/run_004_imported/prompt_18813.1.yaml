answer: |-
  Good evening.

  For those who don't know me, I'm [My Name]. I spent the last twenty years covering this agency. And for those who *do* know me, you're probably wondering how I got the microphone. Usually, when I'm in this room, I'm asking questions that make [Honoree's Name] tighten her grip on the podium.

  When her staff asked me to propose this toast, I was honored. But I also felt a specific ethical pressure. [Honoree's Name] is retiring. This is a moment for tribute. And I am a journalist. My job is to verify.

  So, I went back to the texts. Specifically, Hannah Arendt. In her essays on truth and politics, Arendt draws a sharp line. On one side, you have the deliberate lie—the statement known to be false. On the other, you have something subtler, more modern, and perhaps more sophisticated: the artful rearrangement of truth. The selection of facts. The timing of disclosure. The framing of context.

  Arendt argued that while the liar destroys the truth, the spin-master preserves the letter of the truth while altering its impact.

  And that is why [Honoree's Name] is a master of her craft.

  I can stand here tonight and say, truthfully, that I never caught her telling a deliberate lie. Not once. But I can also say, truthfully, that I spent two decades trying to find a fact she had placed inside a press release issued at 4:45 PM on a Friday in August.

  To her family: You should know that in the world of public affairs, that is not negligence. That is stewardship. She understood that science is fragile. It requires funding, it requires political cover, and it requires time to mature. She knew that a complex finding dropped into a chaotic news cycle could be weaponized. So, she curated the environment. She didn't change the data; she changed the weather around the data.

  To my colleagues in the press: We complained. Oh, how we complained. We learned to read her emails like tea leaves. If the subject line was "Clarification," we knew a retraction was due, but we also knew we'd never get the word "retraction" in the record. If she answered a question we hadn't asked, we knew the question we *had* asked was going to remain unanswered.

  But here is the truth, by Arendt's standard: She respected us enough to engage in the dance.

  A lazy communicator lies. A panicked communicator hides. [Honoree's Name] did neither. She engaged. She forced us to be better reporters. Because she was so skilled at framing the narrative, we had to work harder to find the edges of the frame. She treated the truth not as a blunt object, but as a prism. She showed us that where you stand determines what you see.

  There is a symbiotic relationship between a worthy adversary and a determined journalist. Friction creates heat, but it also creates light. For twenty years, she was the flint to my steel. She protected this agency's reputation with a ferocity that was often frustrating, but always honorable. She believed in the mission of this place more than she believed in the news cycle of the day.

  And now, she is retiring.

  This brings me to my wish for her next chapter. In retirement, [Honoree's Name], you are no longer a public servant. You are a private citizen. You are no longer bound to manage the perception of an institution. You are free from the burden of the Friday afternoon dump. You are free from the need to pivot.

  So, my toast is this:

  May your weekends be free of press releases.
  May your clarifications require no footnotes.
  May you answer only the questions you wish to answer.
  And may you find, in this next phase, that the truth needs no framing at all.

  To [Honoree's Name].
