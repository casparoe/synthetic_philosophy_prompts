answer: |-
  **Title:** The Arithmetic of Illusions: Why Risk Scores Cannot Be True
  **Subtitle:** The reference class problem proves that algorithmic justice is not merely biased, but logically incoherent.

  In the sterile dashboards of American courtrooms, a new kind of evidence has taken root. It arrives not as testimony or physical proof, but as a percentage. A defendant stands before a judge, and an algorithm like COMPAS announces that this specific individual carries a 68 percent probability of recidivism. To the defenders of these actuarial tools, this number is a scientific estimation, subject to the usual margins of error but fundamentally sound. They argue that if the number is wrong, it is because the data is noisy, the sample size too small, or the variables poorly weighted. They treat the 68 percent as a measurement that can be calibrated, like a thermometer reading slightly off in a drafty room.

  This defense is comforting, but it is wrong. The error is not in the calibration; it is in the conception. The objection raised by philosophers of science regarding the "reference class problem" is not a call for better data. It is a demonstration that the statement "this defendant has a 68 percent chance of reoffending" is not merely inaccurate—it is strictly neither true nor false. It is a category error masquerading as a fact.

  To understand why, we must look at how the number is generated. Actuarial risk assessment is fundamentally frequentist. It derives the probability of a future event by looking at the past frequency of that event within a specific group. If 68 out of 100 men aged 25 to 30 with one prior conviction reoffend, then a man fitting that description is assigned a 68 percent risk score. The logic assumes that the individual inherits the properties of the group.

  But which group? This is the reference class problem, articulated most famously by the philosopher Hans Reichenbach. Any individual defendant belongs to an indefinite number of overlapping classes. He is a 28-year-old male; he is a resident of a specific zip code; he is a high school graduate; he is a first-time offender; he is unemployed; he is a father. Each of these classes has a different recidivism frequency. In one class, the risk might be 40 percent; in another, 80 percent. There is no mathematical rule to determine which class is the "correct" one for the purpose of sentencing.

  Defenders of the technology often invoke Reichenbach's own proposed solution: use the narrowest reference class for which reliable statistics exist. The idea is to zoom in until the group is as similar to the defendant as possible without losing statistical power. But this solution collapses under scrutiny. It does not terminate; it dissolves.

  If we continue to narrow the class to increase relevance—adding variables for income, education, family history, psychological profile—we inevitably arrive at a class containing only the defendant himself. At this limit, the "narrowest reliable class" becomes a singleton. But frequency statistics cannot exist for a sample size of one. An individual either reoffends or they do not. In the class of "this specific person," the frequency of recidivism is either 0 or 1. The 68 percent vanishes.

  To maintain the 68 percent figure, the algorithm must stop narrowing before it reaches the individual. It must halt at an arbitrary boundary where the class is broad enough to generate a frequency but narrow enough to feel relevant. That boundary is not discovered in nature; it is chosen by the programmer. Consequently, the resulting probability is not a property of the defendant. It is a property of the classification scheme imposed upon him.

  This leads to the strong thesis: A statement of individual probability derived from group frequency lacks a truth value. For a proposition to be true or false, it must correspond to a fact about the world. "The defendant is 28 years old" is true or false because age is an intrinsic property of the defendant. "The defendant has a 68 percent chance of reoffending" purports to describe a propensity inherent to the defendant, akin to a physical disposition. But there is no such thing as a "68 percent propensity" inside a human being. There is only the future act, which will happen or not.

  The percentage describes the behavior of a ghost—a theoretical aggregate group that the defendant resembles but is not identical to. To predicate this number of the individual is a semantic error. It is logically equivalent to saying, "This glass of water is 50 percent hot," because it was poured from two taps, one hot and one cold. The temperature of the mixture is a fact; the "50 percent" describes the mixture's history, not the water's current state. Similarly, the risk score describes the history of a reference class, not the future of the defendant.

  Why does this logical incoherence matter? Because the criminal justice system is predicated on the presumption that we judge individuals, not classes. Due process requires that punishment be justified by facts true of the accused. If the risk score is not a fact about the accused—if it is merely a statistic about a group he vaguely resembles—then it cannot serve as a truthful basis for deprivation of liberty.

  When a judge treats a 68 percent risk score as evidence, they are not weighing a probability; they are accepting an arbitrary framing as a scientific truth. They are mistaking a policy choice (where to draw the reference class boundary) for an empirical discovery. This grants the algorithm a false authority. It allows the state to claim it is acting on objective risk when it is actually acting on a statistical artifact that cannot, in principle, be true.

  We must stop treating the reference class problem as an engineering challenge. No amount of machine learning, no influx of "big data," and no refinement of variables can solve it. The problem is not that we don't know enough about the defendant; it is that probability, in the frequentist sense, cannot attach to the singular.

  If we continue to use these tools, we must do so with eyes open to their metaphysical poverty. We must admit that a risk score is not a statement of fact about the defendant's future. It is a heuristic, a policy shorthand, or a wager. But it is not the truth. And in a system dedicated to justice, there is no room for numbers that cannot be true.
