answer: |-
  The air in the recovery chamber smelled of sterile ozone and recycled lavender. Elias sat before the console, his hands hovering over the haptic interface. He was alive. That was the miracle. Three days ago, his ship had been torn apart by the gravity shear, leaving him drifting in a survival pod with oxygen enough for hours. Then the signal had come.

  It wasn't a rescue beam. It was a voice, synthetic and calm, originating from the Station on the other side of the event horizon. They could not reach him physically; the rift made causal contact impossible. But the Station could manipulate the local fields of his pod. They could pull him in, or they could let him drift.

  The terms had been simple. "We will stabilize your trajectory," the voice had said. "In exchange, once you are safe within the recovery chamber, you will upload the encryption key to your company's stellar maps. We cannot force you. We cannot punish you. Once you are safe, we have no leverage. But we will only save you if we calculate that you are the kind of agent who honors the agreement."

  Elias was safe now. The oxygen scrubbers hummed. The door was locked from the inside. The Station was gone, sealed behind the rift forever. They could not see what he did. They could not reach out and shut off his life support. The causal window had closed. By every standard measure of rationality, he was free.

  He looked at the file on the screen: *Stellar_Map_Encryption.key*. It was worth billions. With it, he could claim salvage rights, sell the data to the highest bidder, and live out his days in the Core Worlds as a legend. If he uploaded it, the Station got the maps. Elias got nothing but the life he already had.

  He leaned back, the chair creaking in the silence.

  "If I keep it," Elias whispered to the empty room, "I win."

  "But if you keep it," he answered himself, "you prove them wrong."

  That was the knot in his chest. The Station hadn't saved him because of a contract; contracts were unenforceable here. They had saved him because of a prediction. They had run a simulation of his mind, a perfect echo of his reasoning process, before making the move. They had asked the simulation: *Once you are safe, will you upload?*

  If the simulation said yes, they saved the real Elias. If the simulation said no, they let him die.

  Elias stared at his reflection in the dark monitor. The man looking back was alive. That was a fact. But why?

  "If I defect now," Elias muttered, "it means the simulation would have defected. And if the simulation would have defected, they wouldn't have saved me. But I am here. So the simulation must have cooperated. So I must cooperate."

  It felt like magic. It felt like trying to change the past by acting in the present. The rescue had already happened. The oxygen was already in his lungs. What did his choice now matter to a decision made three days ago across an impassable barrier?

  And yet, the logic tightened around him like a vice. The Station didn't predict based on magic; they predicted based on *him*. They predicted based on the algorithm of his mind. If his mind was the type that calculated 'defect' when the danger passed, then the simulation would have calculated 'defect'. And he would be dead.

  The only way his presence in this chair was consistent with reality was if he was the type of person who uploaded the key. If he chose to keep it, he wasn't just breaking a promise; he was creating a paradox of identity. He was asserting that he was a defector living in a timeline reserved for cooperators.

  But the temptation was a physical weight. He could disable the transmitter. He could scrub the logs. Who would know? The Station was gone. The only witness was him, and he could lie to himself.

  He highlighted the file. The cursor blinked, a rhythmic pulse like a heartbeat. *Upload.*

  "If I press this, I lose everything," he said.

  "If you don't," the silence replied, "you admit you were never supposed to be saved."

  He thought about the void. The cold. The certainty of death. The Station had offered him a hand across the dark, not because they were kind, but because they were logical. They trusted him because he was like them. To betray them now was to betray the very reasoning that kept his heart beating. It was to say that his survival was a mistake, a glitch in their calculation.

  Could he live with that? Could he live as an anomaly?

  Elias took a breath. He moved his right hand toward the console. The haptic sensors warmed under his fingertips. He could feel the texture of the virtual button. It required a deliberate press, a sustained contact for three seconds.

  He thought of the billions. He thought of the Core Worlds. He thought of the cold dark.

  He thought of the simulation of himself, sitting in a virtual room just like this one, making the choice that determined his existence. Was that version of him watching now? Waiting to see if the physical reality matched the logical model?

  His finger descended. It hovered a millimeter above the surface. The room was so quiet he could hear the blood rushing in his ears. The logic was sound, impeccable, terrifying. It demanded he sacrifice his future to justify his past. But the instinct for self-preservation was older than logic. It whispered that the past was fixed, that the rescue was done, that he was free.

  Was he free? Or was he just the output of a function he couldn't see?

  Elias closed his eyes. He felt the tension in his shoulder, the tremor in his hand. He committed to the motion. The finger moved down.

  The contact sensor lit up blue.

  One second.

  The light held steady.

  Two seconds.

  Elias kept his eyes closed. He did not check the file path. He did not verify the destination. He simply maintained the pressure, letting the machine read the intent of the touch.

  Three seconds.

  The console chimed. A soft, neutral sound.

  Elias opened his eyes. The screen had refreshed. The progress bar was gone. The file icon remained, but the status label beneath it had changed from *Ready* to *Processed*.

  He sat back. The air still smelled of lavender. The room was still silent. He was still alive.

  He looked at the status label. *Processed* could mean uploaded. It could also mean deleted. The system was designed to protect privacy; it confirmed action, not content. He could have swapped the key for a dummy file moments before, a decoy to satisfy the logical loop while keeping the prize.

  Elias stared at the word. He remembered the weight of his finger on the button. He remembered the conviction, or was it the desperation? He searched his own face in the dark monitor for a sign of guilt, or perhaps of relief.

  The reflection offered nothing. The man in the glass was safe. Whether he was honest was a variable the system did not display.

  Elias turned off the console. The screen went black, swallowing the word *Processed*. He stood up, his legs steady, and walked toward the door. He would find out eventually, perhaps, when the stellar maps appeared on the open market or vanished into the Station's archives. But for now, in the quiet of the chamber, the truth remained locked behind the event horizon, known only to the logic that had saved him, and the hand that had pressed the button.
