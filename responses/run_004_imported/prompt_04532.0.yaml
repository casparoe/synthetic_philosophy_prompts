      *   *Check:* Is Alex just dogmatizing Maudlin?
      *   *Correction:* Alex needs to acknowledge that "Realism" is a loaded term but insist that *EPR-Realism* is the only kind relevant to the locality constraint. If you deny EPR-Realism, you aren't saving Locality, you're changing the subject to "Local Operationalism," which doesn't address the ontological tension.
      *   *Nuance:* The crux is whether "Locality" requires "Realism." Maudlin says yes (to explain correlations). Standard view says no (correlations don't need common causes in the classical sense).

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Start:* Coffee stains on notes.
