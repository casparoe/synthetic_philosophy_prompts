answer: |-
  **Setting:** *A corner table in the physics building lounge, 10 AM on a Saturday. There are two whiteboards nearby, one covered in half-erased density matrices, the other blank. Alex (you) has a mug of cold coffee. Sam (your friend) is scrolling through a PDF on a tablet.*

  **Alex:** I've been thinking about the argument from last night. About the "disjunction."

  **Sam:** The "Locality or Realism" thing? I figured you'd come back swinging.

  **Alex:** Because it's wrong. Or at least, it's misleading in a way that stops people from seeing what Bell actually proved. The textbook line is: "Bell's inequality assumes Locality and Realism. QM violates the inequality. Therefore, nature is either non-local or non-realist." It presents them as independent knobs you can turn.

  **Sam:** And you're saying they aren't independent.

  **Alex:** I'm saying "Realism"—in the sense required to derive the inequality—isn't an independent assumption. It's a *consequence* of Locality, given the EPR correlations. Look, run the EPR argument. You have perfect anti-correlations in the Z-basis. If I measure Z on particle 1 and get +1, I know with certainty particle 2 is -1. If I assume Locality—meaning my measurement here doesn't disturb the physical state over there—then particle 2 *must have had* that value before I measured particle 1.

  **Sam:** That's the EPR Criterion of Reality. "If, without in any way disturbing a system, we can predict with certainty the value of a physical quantity, then there exists an element of physical reality corresponding to this quantity."

  **Alex:** Exactly. So, Locality + Perfect Correlations $\rightarrow$ Pre-existing Values (Realism). Now you feed that Realism into Bell's theorem. Bell shows Locality + Realism $\rightarrow$ Inequality. QM violates Inequality. So, logic dictates you have to drop Locality. You can't drop Realism to save Locality, because Locality *forced* Realism on you in the first place! If you drop Realism, you're implicitly dropping the Locality that necessitated it. It's not a choice; it's a proof of non-locality.

  **Sam:** Okay, I see the Maudlin/Norsen line. It's elegant. But it hinges on treating the EPR Criterion of Reality as a logical truth. It's not. It's a philosophical premise about what counts as "real."

  **Alex:** It's not just philosophy, Sam. It's about causal explanation. If there's no superluminal influence, what *else* explains the perfect correlation other than a common cause established in the past?

  **Sam:** That's the assumption! You're assuming that correlations *require* a common cause in the form of deterministic hidden variables. That's what "Realism" means in the Bell derivation. It means there exists a joint probability distribution over all possible measurement outcomes, even the ones we didn't perform. Counterfactual Definiteness.

  **Alex:** But EPR says Locality *demands* that distribution exists.

  **Sam:** EPR says Locality demands it *if* you accept their criterion. But an operationalist—or a QBist, or even a standard Copenhagenian—rejects the inference from "epistemic predictability" to "ontic existence." I can predict the outcome of your measurement based on mine without committing to the claim that your particle *possessed* that value prior to measurement. The correlation is a property of the entangled state, not a property of two local beads carrying instruction sets.

  **Alex:** So what carries the correlation? If the state is real, and the state is non-separable, then the state itself is non-local. You haven't saved locality; you've just relocated it from the particles to the wavefunction.

  **Sam:** I've saved *signal* locality. Relativity forbids superluminal signaling, not superluminal ontology. Bell's theorem rules out *Local Hidden Variable* theories. It does not rule out *Local Operational* theories. QM is a local operational theory. I can calculate my probabilities using only local data and the shared state. No information travels faster than light.

  **Alex:** That feels like a shell game. "Nothing travels faster than light, except the 'influence' that coordinates the outcomes, which we refuse to call an influence." If the outcome here depends on the setting there, in a way that can't be explained by common past causes, that's non-locality. Calling it "holism" or "contextuality" doesn't change the spacetime structure.

  **Sam:** But does it depend on the setting? That's Parameter Independence versus Outcome Independence. Jarrett broke this down. QM violates Outcome Independence (my outcome is correlated with yours) but respects Parameter Independence (my outcome statistics don't depend on your *setting*).

  **Alex:** Right, and that's why you can't signal.

  **Sam:** Exactly. And for many of us, Parameter Independence is the only thing "Locality" actually needs to mean to be compatible with Relativity. If I can't send you a message, Lorentz invariance is safe. The "Non-locality" you're talking about is a statistical dependence that doesn't allow causal control.

  **Alex:** But Bell didn't think that was enough. He called it "beables." If the theory is about beables, and the beables here depend on the settings there, it's non-local. You're retreating to an instrumentalist view where "measurements" are primitive. But measurements are physical interactions. If the physical interaction here is correlated with the setting there without a local mediating variable, the physics is non-local.

  **Sam:** Okay, let's grant that. Let's say I accept your definition: any violation of Bell inequalities implies non-locality in the ontology. What work is that doing? You want me to say "Nature is Non-Local." Fine. Now what? Do I adopt Bohmian mechanics?

  **Alex:** If you want a clear ontology, yes. Bohm is explicitly non-local. The quantum potential updates instantaneously. It's honest.

  **Sam:** But Bohmian mechanics is empirically equivalent to standard QM. And in Bohm, you still can't signal. So the "Non-locality" is empirically inaccessible. It's a metaphysical add-on. My position is that positing a hidden non-local mechanism is unnecessary. The correlations are brute facts of the quantum state. Denying "Realism"—meaning, denying that unmeasured observables have values—isn't an escape hatch to save locality; it's a refusal to ask a question that the theory says has no answer.

  **Alex:** But that refusal *is* the escape hatch! That's my point. You're saying, "I can keep Locality if I stop asking about what exists." I'm saying, "If you stop asking about what exists, the word 'Locality' loses its meaning." Locality is a constraint on *things*. If there are no things with properties until measured, what is being constrained?

  **Sam:** Events are being constrained. Measurement outcomes are events. They are real. The *pattern* of events respects relativistic causality. You want to project that pattern back onto unmeasured properties. I'm saying that projection is the error.

  **Alex:** Let's try a different angle. Superdeterminism.

  **Sam:** Oh no.

  **Alex:** Hear me out. If you really want to save Locality in the robust, beable sense, you *can*. You just have to deny Measurement Independence. The settings aren't free variables; they're correlated with the hidden variables $\lambda$.

  **Sam:** That requires a conspiracy of cosmic proportions.

  **Alex:** It does. But logically, it's the only way to keep Local Realism. The standard view says: "Don't be a superdeterminist, so choose between Non-Locality and Non-Realism." I'm saying: "Don't be a superdeterminist, and you must accept Non-Locality." The "Non-Realist" option is just a linguistic way of avoiding the bullet. It's saying, "I will define reality such that non-locality doesn't appear."

  **Sam:** I think you're conflating "ontology" with "classical ontology." You keep saying "Realism" like it means "classical particles with definite trajectories." When I say "give up Realism," I don't mean "nothing exists." I mean "properties are contextual." The value of spin-Z isn't a property of the electron alone; it's a property of the electron-plus-apparatus interaction.

  **Alex:** But in the EPR setup, the apparatus on side A shouldn't affect the reality on side B if Locality holds.

  **Sam:** And it doesn't! It doesn't change the statistics on side B. That's Parameter Independence. It only updates *my knowledge* of side B.

  **Alex:** But in QM, the update isn't just knowledge. If I measure X, the state collapses to an X-eigenstate. If I measure Z, it collapses to a Z-eigenstate. The physical description of particle 2 changes instantly depending on what I chose to measure on particle 1.

  **Sam:** Only if you think the wavefunction is a physical object. If the wavefunction is a catalog of expectations...

  **Alex:** ...Then you're an epistemicist. And then you have to explain why the catalog updates non-locally.

  **Sam:** Because the catalog describes a non-separable system! The "locality" of the description is preserved because the update doesn't change local expectation values on side B until the results are compared classically.

  **Alex:** (Pauses, leans back) So your defense is that "Locality" should only apply to observable statistics, not to the underlying state description.

  **Sam:** Yes. Because physics is about predicting observations. If the underlying description is non-local but the observations are local, the non-locality is doing no physical work. It's ghosts in the machine.

  **Alex:** But that's the thing. If you take the "observations are local" route, you're basically signing up for a version of Copenhagen where the cut is fundamental. But if you want a unified picture of the world—where the detectors and the particles are made of the same stuff—you need an ontology. And if you write down an ontology that reproduces QM, like Bohm or GRW, it *is* non-local. GRW has spontaneous collapses that are non-local. Bohm has the guiding equation.

  **Sam:** Sure, if you force an ontology. But why force it?

  **Alex:** Because otherwise, you can't say what the theory is *about*. If Bell's theorem doesn't prove non-locality, but only proves "No Local Hidden Variables," then you leave open the possibility that a Local *Something-Else* exists. But if EPR is right that Locality implies Hidden Variables, then "Local Something-Else" is empty.

  **Sam:** I think the deadlock is here: You think EPR proves Locality $\rightarrow$ Hidden Variables. I think EPR proves (Locality + Classical Intuition about Properties) $\rightarrow$ Hidden Variables. QM tells us to drop the Classical Intuition. You say that intuition is part of the definition of Locality. I say it's a separate metaphysical commitment.

  **Alex:** I guess that's it. Is "Locality" a constraint on causal signals, or a constraint on physical dependencies?

  **Sam:** I vote signals. Relativity is a theory about causality and light cones.

  **Alex:** And I vote dependencies. Relativity is a theory about spacetime structure. If the truthmaker for an event here lies outside its past light cone, spacetime is non-local, regardless of whether I can use it to send a text message.

  **Sam:** (Smiles) So, you're willing to bite the Non-Locality bullet to save spacetime realism. And I'm willing to bite the Contextuality bullet to save causal locality.

  **Alex:** Basically. I'd rather have a non-local world than a world where properties pop into existence when I look at them.

  **Sam:** And I'd rather have properties that are relational than a world with instantaneous action-at-a-distance that I can't use.

  **Alex:** So neither of us won last night.

  **Sam:** No. But I think we clarified that the argument isn't about the math. The math is agreed upon. It's about whether "Realism" is a premise or a derived consequence.

  **Alex:** And whether "Locality" applies to the map or the territory.

  **Sam:** Exactly. Now, are you going to finish that cold coffee, or can I throw it out?

  **Alex:** Throw it out. Let's go look at the whiteboard. I want to see if you can derive Parameter Independence without assuming a specific ontology.

  **Sam:** Deal. But if you bring up Superdeterminism again, I'm leaving.

  **Alex:** No promises.
