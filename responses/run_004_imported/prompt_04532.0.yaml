      *   *Deep Dive:* Discuss the Factorization Assumption. Jarrett's decomposition (Parameter Independence vs. Outcome Independence).
      *   *Resolution:* Acknowledge that the dispute is ultimately about what counts as a "physical explanation."

  7.  **Final Polish:**
      *   Ensure jargon is used correctly (counterfactual definiteness, factorizability, beables, parameter independence).
      *   Keep the rhythm natural (interruptions, clarifications).
      *   Make sure the ending feels earned.

  8.  *(Self-Correction post-drafting)*: Make sure Sam explicitly addresses the "Realism is derived" point. Sam's best counter is that EPR derives realism *conditional on locality*, but Bell shows the package (Locality + Realism) is false. You can reject the consequent by rejecting *either* antecedent. Alex says "But Realism comes from Locality!" Sam says "No, Realism comes from Locality + a specific criterion of reality which is not logical truth." This is the pivot point. I need to make sure this lands clearly.

  9.  **Final Review against constraints:**
      *   PhD level? Yes.
