      *Tone Check:* Respectful, precise, humble but decisive.

      *(Final thought on the Hume point)*: Hume argues from *antecedent probability*. The Church argues from *posterior evidence*. The tribunal's job is to secure the *posterior evidence*. The *antecedent probability* is a theological matter for Rome. This is the pivot point.

