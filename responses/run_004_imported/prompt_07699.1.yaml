  8.  *(Final Polish of the text)*: Ensure the academic jargon is natural, not forced. "Epistemic asymmetry," "second-order reasons," "moral worth." Keep the atmosphere of a tired reception.

  **(Self-Correction Note):** I need to make sure Ines has a specific counter to Hills. Hills argues you can't gain *understanding* via testimony. Ines could argue that for *action*, understanding isn't always required, or that "trust" functions as a proxy for understanding in a social context. Let's go with the idea that moral *correctness* is the primary goal, and understanding is a luxury good, not a necessary condition for right action. Or, better: that trusting a person *is* a way of accessing reasons, just indirectly. Let's aim for the latter: Trust is a rational response to evidence of reliability.

  Okay, let's write it.cw
answer: |-
  The departmental lounge smelled of stale Pinot Noir and brie that had been sweating under the heat lights for an hour. Ines found Teodor by the window, staring out at the rain-slicked parking lot, holding a plastic cup like it was evidence.

  "You lost them on slide twelve," Ines said, coming up beside him. "The bit about the opacity of moral reasons. But you won the room back with the conclusion."

  Teodor turned, a tired smile breaking through. "Ines. I expected you to be in the front row throwing chalk. I'm surprised you let me finish."

  "I'm tenure-track now. I have to pretend to be collegial." She clinked her cup against his. "But you know I think the premise is rotten."

  "The autonomy requirement?"

  "The asymmetry," she corrected. "You spend forty minutes arguing that moral deference is inherently alienating, that it undermines agency. But if I trust my cardiologist about my arrhythmia, I'm not undermining my biological agency. I'm exercising it. So why is trusting a moral expert an abdication?"

  "Because the cardiologist is fixing a mechanism," Teodor said, taking a sip. "You are the mechanism. In ethics, *you* are the thing being fixed. If you outsource the diagnosis of right and wrong, you aren't just fixing a part; you're bypassing the pilot."

  "That's poetic, Teo, but it begs the question. It assumes the 'pilot' needs to generate the coordinates internally to be valid. If the coordinates are objective—if moral facts are real facts—why does it matter who located them? If I believe slavery is wrong because my teacher told me, and my teacher believes it because she worked it out from first principles, we both have the truth. Why is my epistemic position inferior?"

  "Because you have a true belief, and she has understanding," Teodor said. He shifted, leaning against the sill. "Alison Hills put it best. Testimony can transmit belief, but it can't transmit the grasp of *why* the belief is true. You know *that* slavery is wrong. She knows *why*. That gap matters."

  "Does it?" Ines leaned in. "For what purpose? If the goal of morality is to make the world better, my belief gets me to the same actions as her understanding. I don't need to understand combustion to drive a car safely. I just need to know when to brake."

  "But morality isn't driving," Teodor said. "It's navigating. If the road changes, the driver who doesn't understand the engine is stranded. The one who understands the principles can adapt. If you only know *that* something is wrong, you can't extend that judgment to new, harder cases. You lack sensitivity to the reasons. You're flying blind on instruments you can't read."

  "So the defect is pragmatic," Ines said. "Reliability. You're saying the deferential agent is more likely to make mistakes in edge cases."

  "I'm saying they aren't acting morally at all in the edge cases. They're acting on habit or loyalty."

  "Let's test that." Ines set her cup on the windowsill. "Imagine a guy, call him Mark. Mark eats meat. He starts dating Sarah, who he loves and trusts deeply. Sarah tells him eating meat is wrong. Not because of a specific argument about suffering or environment, she just says, 'It's wrong, and I need you to stop.' Mark trusts her judgment on everything. He becomes vegetarian. He never reads a pamphlet, never watches a documentary. He does it because she said so."

  Teodor nodded slowly. "Classic case. And my view is straightforward: Mark's action has no moral worth. He's not responding to the moral reasons. He's responding to Sarah."

  "But he's doing the right thing," Ines pressed. "And he's doing it consistently. What is the criticism here? Is he epistemically blameworthy?"

  "He is," Teodor said. "He holds a moral belief without grasping the reasons that support it. He treats a moral truth like a trivia fact. 'The capital of France is Paris; eating meat is forbidden.' It flattens the normative landscape."

  "Or," Ines countered, "he recognizes that Sarah is a person of high moral sensitivity. He has evidence of her reliability. His reason isn't 'Sarah said so.' His reason is 'Sarah is trustworthy, and she says so.' That's a second-order reason. It's rational to defer to reliable indicators."

  "But if Sarah changes her mind?" Teodor asked. "Suppose Sarah reads a new paper, decides lab-grown meat is fine, and tells Mark to start eating again. Does Mark switch back?"

  "Probably," Ines said. "If his evidence for the wrongness of meat was her reliability, and her verdict changes, his evidence changes."

  "Exactly," Teodor said, tapping his cup. "And that shows he never cared about the *meat*. He cared about *Sarah*. If the moral truth shifted—which it can't, on realist views—he'd shift with it. His commitment is to the person, not the principle. That makes him a loyal partner, maybe, but not a moral agent."

  Ines frowned, tracing the rim of her cup. "You're conflating the source of the belief with the motivation for the action. Just because I got the information from Sarah doesn't mean I don't care about the underlying value. But even if I don't... Teo, is it really better to be a stubborn, independent thinker who gets the answer wrong than a humble deferrer who gets it right?"

  "I'm not saying get it wrong. I'm saying the *way* you get it right constitutes who you are."

  "That sounds like moral perfectionism," Ines said. "It's elitist. It suggests that only people with the time and training to derive first principles—people like us, in this room, with wine and tenure—can actually act morally. The rest of the world has to take our word for it. If your view holds, 90% of moral action is just mimicry."

  "Maybe it is," Teodor said softly. "Or maybe they have a grasp they can't articulate. But Mark? Mark explicitly rejects the need to understand. He says, 'I don't need to know why, I trust you.' That's a refusal of moral responsibility."

  "Is it?" Ines turned to face him fully. "Or is it an acknowledgment of the division of epistemic labor? We trust mechanics because we can't all be mechanics. We trust doctors because we can't all be doctors. If moral truths are complex, why shouldn't we trust moral exemplars? If Mark acknowledges Sarah is better at seeing moral truth than he is, isn't deferring to her the *most* rational thing he can do?"

  "If morality is just about tracking truth," Teodor conceded. "But it's also about constituting the self. When you defer, you make your will subordinate to another's. In medicine, that's fine; my body is an object. In ethics, my will is the subject. If you subordinate your will, you aren't participating in the moral community. You're a subject, not a citizen."

  "So Mark is a moral subject," Ines said. "But he's a vegetarian. The cows don't care if he's a citizen or a subject. They just care that he doesn't eat them. If the goal is to reduce suffering, your insistence on autonomy is an inefficiency. It prioritizes the purity of the agent over the welfare of the patient."

  Teodor sighed, looking back out at the rain. "I'm not prioritizing purity. I'm prioritizing the only thing that makes morality matter to us. If I do the right thing because a tyrant told me, or a lover told me, I haven't aligned myself with the good. I've aligned myself with power or affection. The connection to the *good* is severed."

  "But trust isn't power," Ines said. "Trust is a rational assessment of reliability. If Mark assesses Sarah as reliable, he is using his own reason to defer. He's exercising agency in the selection of the expert."

  "That's one step removed," Teodor said. "It's like choosing which general to surrender to. You're still surrendering."

  Ines laughed, a short, sharp sound. "Dramatic. But here's the rub, Teo. You say the defect is that Mark lacks understanding. He can't handle new cases. But what if he knows that? What if he says, 'I don't know if lab-grown meat is okay. Sarah, is it?' He continues to defer on the new cases. He maintains the link to the expert."

  "Then he's permanently a child," Teodor said. "He never grows up morally."

  "Or," Ines said, "he recognizes that moral expertise is distributed. We are all children in some domains. Why is morality the one domain where we demand total self-sufficiency? It seems like a fetishization of independence."

  "Because independence is the only way to know you're doing it for the right reason," Teodor said. "If you do it because it's right, you're stable. If you do it because Sarah says it's right, you're contingent."

  "We're going in circles," Ines said. "You think the defect is internal to the agent—a lack of moral worth. I think the defect is negligible, or purely pragmatic—if Sarah is unreliable, Mark fails. But if she's reliable, Mark is fine."

  "I think the defect is that Mark doesn't love the good," Teodor said. "He loves Sarah. And that's a category error."

  "And I think you're demanding a kind of moral introspection that's psychologically impossible for most people, most of the time," Ines replied. "You want everyone to be a philosopher-king. I'm okay with them being good subjects."

  Teodor looked at his watch. "My train leaves in forty minutes."

  "Stay for the rest of the cheese," Ines said. "It's terrible, but it's free."

  He smiled, but didn't move. "We aren't going to settle this, Ines."

  "No," she agreed. "But I think I see the boundary now. You think moral worth is a property of the *structure* of the belief. I think it's a property of the *outcome* and the *reliability* of the process."

  "I think the structure *is* the outcome," Teodor said. "If the structure is deference, the outcome isn't moral action. It's compliance."

  "Then we disagree on what 'moral action' means," Ines said. "You mean 'autonomous alignment with the good.' I mean 'behavior that tracks the good for stable reasons.'"

  "Trust is a stable reason," Teodor said.

  "Exactly," Ines said. "So why isn't it enough?"

  "Because trust is about *who*," Teodor said. "And morality is about *what*."

  Ines picked up her cup again. The wine was warm now. "Maybe the 'who' is the only way we access the 'what'."

  Teodor pushed off the window. "Maybe. But I'd hate to live in a world where we stopped checking."

  "And I'd hate to live in a world where we stopped trusting," she said.

  They stood there for a moment, the silence between them heavy with the weight of the unsolved problem, before Teodor nodded, turned, and walked toward the door.
