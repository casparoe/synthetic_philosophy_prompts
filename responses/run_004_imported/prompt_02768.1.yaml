      *   *Correction:* I need to be careful not to make her a pacifist. She wasn't. She believed in Just War. She believed some killing in war is permissible.
      *   *Correction:* She distinguished between combatants and non-combatants. Nuclear scientists are a grey area. She might concede they are legitimate targets *if* the war is just.
      *   *Pivot:* The strongest Anscombean critique is on the *description of the action*. If the US describes it as "Counter-proliferation," she asks "Under what description is this intentional?" If the death of the scientists is *necessary* to stop the program (because they are the program), then killing them is intended.
      *   *Final Verdict for Character:* She would likely argue that the *certainty* of death makes it intended. If you bomb a room you know people are in, to destroy the room, you intend the destruction of the room *and its contents*. You cannot separate the two in the *actus hominis*.
      *   *Wait, standard DDE says:* You can bomb a munitions factory with workers. The death is foreseen.
      *   *Anscombe's specific view:* In "War and Murder," she says: "It is not permissible to make an attack on the civilian population... but it is permissible to attack a military objective even if civilians are killed."
      *   *So:* She *might* permit the strike *if* it is a military objective and the war is just.
      *   *The Hook:* The hook for the novel scene is her *suspicion* of the "military objective" claim when the "civilians" are the primary obstacle. Or, more likely, her attack on the *justification*. The US justifies it by "saving lives later." She hates that. "Mr. Truman's Degree" was about the *honoring* of Truman. Here, it would be about the *justification* of the act.
      *   *Best approach:* She accepts the *possibility* of DDE here but rejects the *application* because the "proportionality" is based on utilitarian calculation (future lives saved), which she rejects as a justification for murder. Also, she would question if the workers are truly "guilty" of harm.

      *Let's settle on this:* She finds the *logic* repugnant even if the *tactics* differ. The logic is: "We kill these few to save many." She rejects this arithmetic. For her, if they are innocent (non-combatants), you cannot kill them. Are nuclear scientists combatants? She would likely say "No, not unless they are bearing arms." Therefore, killing them is murder, regardless of the bunker.

      *Wait, check "War and Murder":* She writes: "those who are engaged in the production of weapons... are not... innocent." Okay, so she *does* allow targeting weapon makers.
      *So why would she object?*
