      4.  **The "Description":** If the US says "We didn't intend to kill," she says "You intended to destroy the facility. You knew the facility contained men. You intended to destroy the facility-with-men. You intended to kill them under the description 'personnel at the site'."

      *Okay, the strongest angle:* She would attack the *description*. The planners say "We targeted the centrifuges." She says "You targeted a place where men were working. You chose to kill them to get the centrifuges. That is choosing evil as a means."

      *Actually, the most faithful Anscombe position:* She would likely be scathing about the *language* used to describe it. "Collateral damage," "Minimized," "Precision." She would call this "sophistry." She would insist on calling it "killing." Whether it is *murder* depends on the justice of the cause and the status of the victims. But she would refuse to let the "precision" excuse the "killing."

      *Let's go with:* She suspects the "innocence" of the workers is being glossed over, and the "intention" is being lied about. But her main fury is directed at the *consequentialist justification* ("We did it to save lives"). That is the Truman logic.

