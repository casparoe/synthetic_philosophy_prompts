answer: |-
  First off, welcome to the philosophical side of the fence. It is genuinely delightful to hear from someone who actually spent their career in the field studying vervet alarm calls. Those are the canonical examples for us now, but reading about them in a paper is very different from having spent years in the bush listening to them.

  You have hit on one of the most significant fault lines in contemporary philosophy of language and game theory. To give you the short answer: **You are largely right about the mechanics, but you might be underestimating *why* Lewis insisted on the epistemic (common knowledge) condition.**

  Here is the breakdown of where your intuition aligns with the literature, where it diverges, and why the "fuss" over common knowledge persists.

  ### 1. The Structural Isomorphism
  You are absolutely correct that Lewisian conventions and Evolutionary Stable Strategies (ESS) are structurally isomorphic. Both describe a state where:
  1.  There is a coordination problem (multiple equilibria exist).
  2.  Agents converge on one equilibrium.
  3.  Deviation is costly given that others are conforming.

  When Brian Skyrms (and others like Justin Bruner or Simon Huttegger) brought evolutionary game theory into the philosophy of language, they effectively argued exactly what you are suggesting: **You can get the stability of convention without the heavy cognitive lifting of common knowledge.**

  In your vervet work, a monkey doesn't need to think, *"I know that you know that I know this call means leopard."* The monkey just needs a disposition (learned or innate) to emit the call upon seeing a leopard and to run to the trees upon hearing it. If that pairing yields higher fitness than the alternative, it stabilizes. That is a signaling system.

  If your definition of "convention" is simply "a stable signaling equilibrium," then yes, common knowledge is decorative. In fact, in evolutionary biology, it's superfluous.

  ### 2. So Why Did Lewis Insist on Common Knowledge?
  Lewis wasn't trying to explain how monkeys communicate; he was trying to explain **human meaning** within a framework of **rational choice theory**.

  For Lewis, a convention wasn't just a behavioral regularity; it was a regularity sustained by *reasons*. He was working in the shadow of Grice, who argued that meaning is constituted by complex intentions. Lewis wanted to show how those intentions could stabilize without requiring infinite regress.

  He needed "common knowledge" to solve the **Rationality Problem**.
  *   **The Biologist's View:** I do X because my ancestors who did X survived. (Causal/Historical explanation)
  *   **Lewis's View:** I do X because I *expect* you to do X, and I want to coordinate with you. (Rational/Epistemic explanation)

  For a rational agent to choose the equilibrium strategy, they need a reason to believe the other agent will choose it. But the other agent is also rational, so they need a reason to believe *I* will choose it. Without a "common knowledge" condition (a shared background fact that we both know, and both know we know, ad infinitum), Lewis feared the chain of reasoning would never ground out. You'd never have a sufficient reason to step onto the coordination equilibrium.

  So, for Lewis, common knowledge wasn't decorative; it was the **engine of rationality**. It was the substitute for the evolutionary pressure that drives your monkeys.

  ### 3. Why Philosophers Still Make a Fuss
  You asked why philosophers don't just admit convention is "stable equilibrium, full stop." There are three main reasons the epistemic condition survives in certain corners of philosophy:

  **A. Normativity vs. Stability**
  Evolution explains stability; it doesn't easily explain normativity. If a young vervet makes the wrong call, it might get eaten (causal consequence). If a human uses the wrong word, we say they are *wrong* (normative consequence).
  Some philosophers argue that "common knowledge" captures the sense of mutual obligation inherent in human convention. We follow the convention not just because we *must* (evolution/instinct) but because we *agree* to (implicitly). The epistemic state is an attempt to model that "agreement."

  **B. The Speed of Human Convention**
  Evolutionary equilibria take generations to lock in. Human conventions (like which side of the road to drive on, or the meaning of a new slang term) can lock in almost instantly.
  Evolutionary dynamics struggle to explain rapid coordination among strangers without some pre-existing cognitive machinery. "Common knowledge" is often used as a placeholder for that machinery—the ability to recognize "we are both rational agents facing this problem," which allows for instant coordination that biological evolution can't account for on the fly.

  **C. The "Limit" Concept**
  Many modern defenders of Lewis (like Margaret Gilbert or Raimo Tuomela) argue that common knowledge isn't meant to be a psychological reality (nobody actually runs an infinite recursion in their head). Instead, it's a **limit concept**. It describes the *ideal* state of transparency required for full-blown social meaning, even if real-world agents approximate it with heuristics.

  ### 4. The Skyrms Bridge
  This is where your friend's recommendation of Skyrms is spot on. Skyrms essentially agrees with you. In *Signals* (2010) and *The Stag Hunt* (2004), he shows how signaling systems emerge from pre-existing dispositions through reinforcement learning or evolutionary selection.

  Skyrms argues that we don't need the heavy Lewisian epistemic apparatus to explain the *origin* of meaning. We can start with simple agents (like your vervets) and show how information transfer emerges.

  However, even Skyrms acknowledges that once a signaling system is in place, human beings layer *epistemic reasoning* on top of it. We don't just signal; we signal *that we are signaling*. That reflexive layer is where the Lewisian "common knowledge" becomes relevant again, not for the existence of the signal, but for the complex social structures we build upon it.

  ### The Verdict
  You have not misunderstood the material. In fact, you have intuitively grasped the motivation for **evolutionary game theory** in philosophy.

  *   **Are you right that the equilibrium logic is the same?** Yes.
  *   **Are you right that monkeys don't need common knowledge?** Yes.
  *   **Is common knowledge decorative?** From a biological/evolutionary standpoint: **Yes.** From a strict rational-choice/philosophy-of-language standpoint: **No**, because it's doing the work of explaining *reasons for action* rather than *causes of behavior*.

  The "fuss" persists because philosophy is often less interested in *how* a system works (the mechanics) and more interested in *what justifies* the agents within it (the reasons). But in the last 20 years, the field has moved significantly toward your view: that we should look at the dynamics of interaction (Skyrms) rather than the static epistemic states (Lewis) to understand the roots of communication.

  Given your background, you're actually better equipped to understand Skyrms than most philosophy grad students. They have to learn the biology; you just have to learn the formalism. You've got the hard part down already.
