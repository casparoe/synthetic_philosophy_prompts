      *   **Propose a Resolution/Path Forward:** How does science actually solve this? (Blind analysis, independent verification, predicting *new* data).
      *   **Tone:** Collegial, respectful, intellectually rigorous.

  5.  **Refining the Content (Self-Correction during drafting):**
