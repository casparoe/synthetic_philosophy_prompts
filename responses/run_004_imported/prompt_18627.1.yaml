prompt: |-
  I'm moderating a colloquium Q&A after a talk by a speaker who has revived David Gauthier's contractarian project: on her view, the rational bargain that fixes the content of morality should be modeled on the Kalai–Smorodinsky solution rather than Nash's -- in effect, a defense of Gauthier's own 'minimax relative concession' criterion. Draft eight to ten questions that go beyond having her simply restate the position. I want at least one question on why equalizing each party's relative concession from the utopia point, rather than maximizing the Nash product, is the right currency of fairness for a moral bargain; one on whether her Lockean-proviso baseline, which nets out gains from predation and coercion before bargaining begins, actually filters out unearned bargaining power or simply launders it into the resulting 'fair' outcome; and one on the theory's apparent exclusion from moral standing of parties who contribute nothing to the cooperative surplus, such as future generations, the severely cognitively disabled, or animals. For each, add a follow-up question keyed to the answer she is most likely to give.
