  2.  **Philosophical Grounding (Mental Check):**
      *   *Money Pump Argument:* If $A > B > C > A$, I can trade $A \to C$ (pay fee), $C \to B$ (pay fee), $B \to A$ (pay fee). I end up with $A$ but less money. Therefore, cyclic preferences are irrational.
      *   *Quant's View:* Standard Dutch Book/Money Pump coherence. Rationality = Consistency.
      *   *Prof's View:* Edward McClennen's *Rationality and Dynamic Choice*. The idea of "Resolute Choice." An agent can commit to a plan at $t_1$ and stick to it at $t_2$ even if their local preferences shift, without being irrational.
      *   *Quinn's Self-Torturer:* A dial has 1000 settings. Difference between $n$ and $n+1$ is imperceptible. But 1000 is agonizing. Transitivity suggests if $n \sim n+1$, then $0 \sim 1000$. But obviously $0 > 1000$. This challenges transitivity of indifference.
      *   *The Clash:* The Quant thinks Resolute Choice is just pre-commitment, which is just a preference over plans (still transitive). The Prof needs to argue that the *capacity* to bind oneself is a distinct rational faculty, not just a preference ranking.

  3.  **Drafting - Step-by-Step:**

      *   *Setting the Scene:* Needs to feel like a wedding afterparty. Noise, leftover cake, alcohol.
      *   *Exchange 1 (Quant opens):* Establish the Money Pump. It's simple arithmetic. If you lose money for nothing, you're broken.
