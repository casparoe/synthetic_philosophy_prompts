answer: |-
  The DJ had packed up an hour ago, leaving only the hum of the HVAC and the clatter of venue staff stacking chairs in the ballroom. David and Elena sat at the edge of the dance floor, each with a glass of whiskey scavenged from the bar before it closed. The air smelled of floor wax and stale champagne.

  David swirled his glass, watching the ice catch the work lights. "It's not a paradox, El. It's an arbitrage. If your preferences cycle—A over B, B over C, C over A—I can bleed you dry. I don't even need to touch your principal. I just trade you back to where you started, take a fee each time, and you pay me for the privilege of ending up with nothing. That's not philosophy. That's insolvency."

  Elena leaned back, loosening the strap of her heel. "That assumes the world is made of discrete, tradable atoms. It's not. Think about Quinn's Self-Torturer. A dial with a thousand settings. You can't feel the difference between setting one and setting two. So you're indifferent. But you definitely prefer setting one to setting five hundred. Indifference isn't transitive, David. If you optimize locally at every step, you ratchet yourself into agony. Avoiding the money pump isn't the definition of rationality; it's a constraint that only applies if you think the world is as clean as your spreadsheet."

  "Spreadsheets clear," David said, pointing a finger. "People who ignore them go broke. And don't hide behind the dial. You're talking about dynamic inconsistency. You think the solution is 'resolute choice.' You make a plan at time one, and at time two, you force yourself to stick to it even if your local preferences have shifted. But that's just a shell game. If you stick to the plan, it's because you *prefer* sticking to the plan. You've just kicked the can up a level. You're saying you have a transitive preference over *sequences* of actions rather than individual acts. It's still transitivity. You haven't escaped the pump; you've just renamed the currency."

  Elena laughed, a sharp, tired sound. "That's the trick, isn't it? You think the 'preference' to stick to the plan is just another item on the menu. It's not. It's the condition of there being a *you* to have preferences at all. If I re-optimize at every single node because my local incentives shifted, I'm not an agent navigating time. I'm a series of time-slices passing a hot potato. Resolute choice isn't a preference; it's the constitutive rule that binds the slices into a person. Without it, there's no one left to be money-pumped."

  David took a long drink, his eyes narrowing. "So it's metaphysics now. You're saying rationality requires a soul? Look, I get the romance. But if your 'constitution' forces you to ignore new information because you made a promise to a ghost version of yourself in the past, that's not rationality. That's dogma. If at time two, the costs have changed and the benefits have changed, and you stick to the plan *solely* because it was the plan, you're worshipping a sunk cost. You're choosing to be inefficient to preserve a narrative."

  "And you're choosing to be efficient at the cost of integrity," Elena shot back, leaning forward. "You say I'm worshipping a sunk cost. I say you're incapable of valuing anything that doesn't have a price at this exact second. If I can't bind my future self, I can't love, I can't career, I can't do anything that requires duration. You call it inefficiency. I call it the only way to be more than a reactive organism. You want a world where no one can be exploited. I want a world where someone can keep a promise even when it stops paying."

  "Promises are just contracts with social enforcement," David said, setting his glass down on a stack of napkins. "But fine. Let's say I grant you your 'constitutive rule.' Let's say you bind yourself. Now tell me: what happens when the plan turns out to be catastrophically wrong? If your resolution is immune to local re-evaluation, you're not rational. You're a missile. And missiles don't win arguments; they just hit targets. You're defending the right to be stubborn and calling it agency."

  Elena went quiet for a moment, watching a cleaner wipe down a table in the corner. "Maybe," she said softly. "But a missile knows where it's going. You? You're just fluid dynamics. You flow around whatever obstacle pays the highest yield. You haven't been money-pumped yet, David, but I look at you and I don't see a guy who avoided the pump. I see a guy who's been arbitraged so many times he doesn't know what he actually wants anymore. You're consistent, sure. But you're empty."

  David stared at her, the insult landing harder than he expected. He reached for his whiskey, found it empty, and pushed the glass away. "Better empty than broken, Elena. But tell me one thing. If this 'resolution' is so powerful... why did it take you three years to call me back?"

  Elena flinched, just once. She stood up, smoothing her dress. "Because some plans," she said, "require a cost I wasn't willing to pay. And some require a resolution I didn't have." She left the glass on the table. "Check, please."
