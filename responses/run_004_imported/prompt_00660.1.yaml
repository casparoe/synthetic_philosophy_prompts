          *   Biographical evidence: Turing's biographers (Hodges, etc.) note his interest in the intersection of mind and matter. He was open to unconventional ideas (morphogenesis later in life). However, calling him a "believer" might be too strong; he was treating it as a scientific variable to be controlled.
      *   *Did he redesign the test?* He suggests modifying the conditions of the imitation game (locating the participants in a "telepathy-proof room") to neutralize the variable. This is standard scientific method (controlling variables), not necessarily an endorsement of the phenomenon's ubiquity, but an acknowledgment of the *claim*.
      *   *Advisor's claim:* "Statistical evidence... was overwhelming." Turing *wrote* that. Whether he *believed* it personally or was conceding the point for the sake of argument is debated, but the text says it explicitly.

