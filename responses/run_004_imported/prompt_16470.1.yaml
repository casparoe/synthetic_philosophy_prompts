      *   **Goal:** Sit with the tension Borges sits with: arguments against time don't stop the *feeling* of loss.
      *   **Audience:** ~70 people. Mix of Borges scholars/translators (need accuracy) and laypeople/family (need emotional resonance/accessibility).
      *   **Format:** Eulogy.
      *   **Length:** 6-7 minutes spoken (approx. 900-1100 words).
      *   **Structure:** Start small/concrete, earn the philosophy, honor her specific views.

  2.  **Deconstruct the Philosophy (Borges & Marisol):**
      *   *A New Refutation of Time:* Time might not exist, but we experience it. The ending of the essay admits the failure of the argument to comfort the dying man.
      *   *The Immortal:* Infinite life leads to the dissolution of identity. If everyone is everyone, no one is anyone.
      *   *Marisol's Stance:* She didn't use Borges to escape death; she used him to face it clearly. She rejected cheap comfort from both religion and philosophy.
      *   *The Task:* Acknowledge the finality without despair, acknowledge the philosophy without using it as a shield.

  3.  **Brainstorming Concrete Openings:**
      *   Need something specific to Marisol as a teacher/person.
      *   *Idea 1:* Her office. Books everywhere.
      *   *Idea 2:* A specific correction she made on a manuscript.
      *   *Idea 3:* The sound of her voice reading.
      *   *Idea 4:* A specific habit regarding time (watches, punctuality).
      *   *Selection:* Let's go with a specific moment in the seminar. A correction on a translation. It highlights her dual role (writer/translator) and her precision. Maybe the word "always" or "now." Let's choose the word *ahora* (now). It ties directly to time.

  4.  **Drafting - Section by Section:**

      *   **Introduction (The Concrete):** Start with the seminar. The smell of old books, the light. A specific memory of her correcting a translation of a temporal word. This grounds us before we go abstract.
      *   **The Middle (The Philosophy/Her View):** Address the Borges connection. Acknowledge the scholars in the room (nod to accuracy). Explain her view: Borges wasn't a shield for her. She knew the arguments against time didn't stop the clock.
      *   **The Prohibitions (What we won't say):** Explicitly (but gently) rule out the three forbidden comforts. This honors her intellect and honesty.
      *   **The Resolution (The Tension):** How do we grieve then? By accepting the reality of the end. The value of the specific moment we had with her. The translation metaphor: we are translating her now, knowing something is lost.
      *   **Conclusion:** Return to the concrete. A final image. Not "she is everywhere," but "she was *here*."

  5.  **Refining the Tone:**
      *   Must be respectful but intellectually rigorous.
      *   Not cold, but not sentimental.
      *   Needs to speak to the cousins *and* the translators. Avoid jargon, explain concepts through emotion.
      *   *Self-Correction during drafting:* I need to make sure I don't accidentally say "she lives on in this room." That's prohibition #3. Instead, focus on the impact of her absence. The silence she left is real.

  6.  **Drafting - Word Count Check:**
