answer: |-
  Good morning. Thank you for being here.

  I want to start at a specific table. It was in room 304 of the Humanities building, scarred with the ring-marks of coffee cups and the nicks of decades of desk chairs. Marisol sat at the head. I sat somewhere near the middle, usually trying to hide a draft I knew wasn't ready.

  One afternoon, I was reading a translation of a story I'd written. I had used the word "always." I said a character would "always remember" a certain afternoon. Marisol stopped me. She didn't raise her voice; she rarely did. She just took off her glasses and said, "Be careful. 'Always' is a very long time. It implies you know how the story ends."

  She put the glasses back on. "Try 'for now,'" she said. "It is more honest."

  That was Marisol. She was a professor of fiction and translation for nearly forty years, but she was also a student of precision. And for her, the most precise thing we had was the present moment. She knew, better than most, how tempting it is to reach for words that make us feel safe. Words like "forever." Words like "eternal."

  Many of you know that Marisol spent her career teaching and translating Jorge Luis Borges. To the family and friends here who never read him: Borges was a writer who asked difficult questions about time, memory, and who we are. To the former students and colleagues here: you know she didn't just teach his books; she inhabited them.

  In her last year, when the illness made it hard to sit at that table in 304, people would come to her house. They would try to offer comfort. They would say, "You will live on in your work," or "Time is just a construct, you know what Borges said."

  Marisol would not allow it.

  She was explicit about what she did not want said today, and I promised her I would honor those boundaries. So, I will not tell you that she is watching over us from somewhere else. She did not believe in a vantage point outside of time, and she would consider it a betrayal of her intellect to pretend she has one now.

  I will not tell you that her death is an illusion. I will not use Borges's arguments about the unreality of time to suggest that she hasn't actually left us. She knew that even if time is a fiction, the pain of losing it is not. As Borges himself admitted at the end of *A New Refutation of Time*, after pages of proving time doesn't exist, he wrote: "The world, unfortunately, is real; I, unfortunately, am Borges." Marisol knew that arguments do not touch the wound.

  And I will not tell you that she lives on in our memories. She called that a "consolation prize dressed up as metaphysics." She knew that a memory is not the person. A map is not the territory. To say she is here because we remember her is to confuse the echo with the voice.

  So, if we cannot say she is watching, if we cannot say she hasn't left, and if we cannot say she is still here in us... what is left?

  What is left is the truth she taught us to write toward.

  What is left is the reality that Marisol Duarte was here, for a specific, unrepeatable stretch of time, and now she is not. That is not a grammatical illusion. It is a fact. And it hurts.

  She wanted us to sit with that tension. She wanted us to understand that the value of a life isn't found in how it escapes ending, but in how it occupies the time it has. She didn't organize her mortality around Borges to escape death; she did it to stop lying about it.

  For those of you who were her students: think of the red pen in her hand. Think of the way she would make you cut the adjectives until the noun stood naked and true. She is asking us to do the same with our grief. Cut the adjectives. Cut the "peacefully" and the "in a better place."

  She was here. She was exacting. She was kind, though often in a way that demanded you be better than you were. She loved the specific weight of a word in Spanish and its imperfect shadow in English. She loved the light in her garden in the late afternoon, because she knew the sun was moving.

  There is a comfort in this, though it is a stark one. It is the comfort of not having to pretend. We do not have to perform a belief we don't hold. We can simply acknowledge that a singular consciousness has ceased, and that the world is diminished by it.

  To the family here: She loved you with the same intensity she brought to a difficult text. She knew you were not eternal, and she loved you *because* of that. She knew your time together was finite, and that made every dinner, every phone call, every silence at the kitchen table matter more, not less.

  To the students: She is not waiting to read our next drafts. There will be no more corrections from room 304. We have to be the editors of our own work now. We have to be the ones who check if we are using "always" when we mean "for now."

  Marisol taught us that translation is always an act of loss. You cannot move a meaning from one language to another without leaving something behind. Death is the final translation. We are moving her from the language of the living to the language of the past. Something is lost. We cannot get it back.

  But we have the text she left us. We have the seminars. We have the translations on the shelves. We have the memory of her voice correcting us, not to shame us, but to sharpen us.

  She is not here. But because she was here, we are slightly different than we would have been otherwise. That is not metaphysics. That is cause and effect. That is enough.

  She asked for "for now." So, for now, we stand here. We acknowledge the silence she has left in the room. We acknowledge that the table in 304 has a head now, and it is empty. And we accept that this is the only honesty that matches the life she lived.

  Thank you.
