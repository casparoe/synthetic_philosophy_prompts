  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Topic:** Promising and Obligation (Trust/Expectation View vs. Owens's Authority View).
      *   **Characters:** Two philosophers (Proponent of Trust/Expectation, Proponent of Authority).
      *   **Task:** Write a dialogue working through a specific case.
      *   **The Case:** A dying man extracts a private promise from his daughter to scatter his ashes at a specific lake. No one else knows. No reputational consequences. No future trust issues (secrecy is maintained regardless of choice).
      *   **Constraints:**
          *   Keep both philosophers equally sharp (no strawmanning).
          *   Engage specific points (no restating opening positions without rebuttal).
          *   No free final word.
          *   End at the moment the *real crux* comes into focus (no tidy resolution).

  2.  **Deconstruct the Views:**
      *   **Trust/Expectation View (Hume/Scanlon):** Obligation arises from the harm of disappointing expectations or violating a principle against inducing reliance. Key mechanism: Protection of the promisee's interests in relying on the word.
      *   **Authority View (Owens):** Obligation arises from transferring normative control. The promisee gains the right to demand performance/release. Key mechanism: Respect for the promisee's autonomy/interest in controlling the promisor's normative situation.

  3.  **Analyze the Case (The "Secret Ashes"):**
      *   *Challenge for Trust/Expectation:* If no one knows, who is relying? If the father is dead, he has no expectations. If no one else knows, society's trust isn't impacted. Where is the harm of disappointment?
      *   *Challenge for Authority:* Why does the dead father have authority? What interest does a dead man have in controlling the daughter? Is the transfer of authority valid if the "controller" ceases to exist?

  4.  **Drafting - Stage 1: Setting the Scene:**
      *   Need names. Let's call them Elena (Trust/Expectation) and Marcus (Authority/Owens).
      *   Setting: A seminar room or office, post-lecture perhaps.
      *   Opening: State the case clearly.

  5.  **Drafting - Stage 2: The Exchange (Iterative Process):**

      *   *Move 1 (Marcus/Authority):* This case kills the Expectation view. The father is dead. He has no expectations. No one else knows. So no reliance is harmed. Yet, intuitively, she is bound. Why? Because he gave her an obligation. He had the authority to bind her.
      *   *Move 2 (Elena/Trust):* Wait. Scanlon's Principle F isn't just about *current* expectations. It's about the assurance given *at the time*. She led him to believe she would do it. To violate that is to manipulate his reliance *when he was alive*.
      *   *Move 3 (Marcus):* But he's dead. He can't be harmed by the disappointment. Owens says the obligation is about *rights*, not *harm*. She owes it to *him*, not to the abstract principle of truth-telling. He held the veto power.
      *   *Move 4 (Elena):* If he's dead, who holds the veto? A ghost? If the obligation is about his authority, doesn't that authority vanish with the person? If it's about the *wrong done to him* while alive, that fits Expectation better. You manipulated his trust.
      *   *Move 5 (Marcus):* It's not about harm done *to* him. It's about the normative relation established. She accepted a constraint. Owens argues we have an interest in *being able to bind ourselves to others*. If she breaks it, she denies his standing as a person who could claim something from her.
      *   *Move 6 (Elena):* But why does that standing survive death? On the Expectation view, the "wrong" is completed when she accepts the promise and induces the reliance. The aftermath is just evidence of the wrong. On your view, the obligation *persists* as a standing demand. But a dead man cannot make demands.
      *   *Move 7 (Marcus):* The standing doesn't require active demanding. It's a normative fact. Like a debt. If I owe you money and die, the debt doesn't vanish.
      *   *Move 8 (Elena):* Debts are about property interests that transfer to heirs. What transfers here? The "right to be obeyed"? To whom? If she scatters the ashes secretly, no one knows. The "right" is purely metaphysical on your view. On mine, the breach is a betrayal of the relationship that existed.
      *   *Move 9 (Marcus):* "Betrayal" implies a victim. If the victim is gone, who is betrayed? You're smuggling in a duty to oneself or to morality. Owens says the duty is *to him*. That requires his authority.
      *   *Move 10 (Elena):* And I say the duty is to not have exploited his trust.
      *   *Refining the Crux:* The crux is whether the obligation is grounded in the *past act of reliance-inducement* (which leaves a moral stain regardless of the victim's current state) or the *ongoing normative relationship* (which requires a holder of authority).

  6.  **Drafting - Stage 3: Polishing and Sharpening:**
      *   Make sure they interrupt/engage directly.
      *   Ensure Owens's specific terminology (normative authority, interest in control) is used correctly.
      *   Ensure Scanlon/Hume elements (reliance, assurance, convention) are clear.
      *   *Self-Correction during drafting:* I need to make sure Elena doesn't just say "it's wrong." She needs to explain *why* the Expectation view covers this. Scanlon's Principle F focuses on the *act* of leading someone to expect. The harm is the violation of the principle, not necessarily the psychological state of the victim at the time of violation.
      *   *Marcus's Counter:* Owens specifically argues against the "harm" model. He says even if no harm occurs (e.g., the promisee releases you), the obligation exists until released. In the ashes case, the father didn't release her.
