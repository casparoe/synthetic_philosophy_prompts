  **Marcus:** Better a ghost than a fossil. A ghost can haunt. A fossil is just dead weight.

  **Elena:** But ghosts aren't real.

  **Marcus:** Neither are obligations, if you're a materialist. But we're talking about normativity.

  **Elena:** Which is grounded in interests.

