answer: |-
  **Elena:** Let's look at the ashes case again. A dying man, private request, daughter promises, he dies, secrecy is maintained regardless of her choice. On your Owens-inspired view, she is bound. Why? The father is gone. He has no interests left to set back. He cannot feel the sting of betrayal. So where is this "normative authority" residing? In the grave?

  **Marcus:** It resides in the transaction that occurred *before* he died. Owens argues that the essence of promising isn't protecting reliance; it's transferring control. By accepting the promise, the daughter handed the father a specific piece of authority: the right to determine her action. That transfer doesn't dissolve because the holder dies. Think of it like a property right. If I owe you money and die, the debt doesn't vanish because I can no longer spend the cash.

  **Elena:** But debts are enforceable against an estate because there are living heirs or creditors. Here, the secrecy clause means there are no heirs to the claim. No one knows the promise existed. If she buries the ashes with the family, no expectations are violated. The community's trust isn't shaken. On the Expectation view—Scanlon's Principle F, specifically—the wrong is manipulating someone's expectations to your own ends. She led him to expect the lake. To do otherwise is to exploit the assurance *she gave him while he was alive*. The obligation is a shadow of that past manipulation.

  **Marcus:** "Shadow of manipulation." That's revealing. You're grounding the obligation in the *quality of her past act*. I'm grounding it in the *status of his claim*. If it were just about her past act, then if the father had released her five minutes before dying, she would be free. On your view, why would that matter? The reliance was already induced. The "manipulation" already happened.

  **Elena:** Because Principle F is conditional. It binds only if the promisee *wants* the assurance. If he releases her, he signals he no longer holds that expectation. The harm of disappointment is waived. So the release mechanism fits my view perfectly.

  **Marcus:** Does it? Or does it fit mine better? On Owens's view, the release is the *exercise* of the authority transferred. He holds the veto. If he waives it, the obligation dissolves because the person with the standing to demand performance says "no demand." On your view, the release is just evidence that no harm occurred. But suppose he *couldn't* release her—suppose he fell into a coma immediately after she promised. On my view, she is still bound, because the authority was transferred and never reclaimed. On your view, is she bound? He can't rely anymore. He has no expectations.

  **Elena:** She is bound, because the moral constraint attaches to the act of assurance. She invoked a convention that creates an obligation. The fact that he is comatose doesn't undo the fact that she secured his reliance to guide her action. But let's press your "authority" angle. You say she handed him control over her normative situation. But a dead man cannot exercise control. If the authority is essentially a *power* to demand or release, and the power requires an agent to wield it, then the authority lapses. You're treating the authority like a physical object she handed him, rather than a relational capacity.

  **Marcus:** It's not a capacity to *wield* in the moment; it's a standing. The obligation exists because we have an interest in being able to bind ourselves to others. If the daughter can say, "Well, he's dead, so his authority is void," she is effectively denying that he ever had the standing to bind her in the first place. She is treating his request as a mere prediction of her behavior, not a claim on it. The secrecy of the case is the crucible: since no social reputation is at stake, the only thing left is the bond between them.

  **Elena:** But the bond is broken by death. That's my point. The Expectation view explains the persistence of the duty without needing a ghostly authority. The duty persists because the *reason* for the duty—the prevention of exploitative reliance—was solidified when he was alive. She owes it to *morality*, or to the principle of fidelity, not to *him* specifically.

  **Marcus:** There it is. "Not to him." That's where you lose the phenomenon. We feel she owes it *to him*. If she scatters the ashes elsewhere, she wrongs *him*, not just the universe. Owens's point is that the Expectation view reduces the promisee to a passive vessel of expectations. It makes the obligation about *her* integrity, not *his* claim. In the ashes case, if she violates the promise, who is the victim?

  **Elena:** He is the victim. Because he was the one whose reliance was secured under false pretenses.

  **Marcus:** But he doesn't exist to *be* a victim. You're saying the "wrong" is a historical fact, like a scar. I'm saying the obligation is a current normative relation. If it's a historical fact, then why does it matter *what* she promised? Only that she promised *something*. But if she promised to scatter the ashes at Lake A, and scatters them at Lake B, your view struggles. Why is Lake A special? Did his reliance attach specifically to Lake A? Yes. But once he's dead, does the specific content matter more than the general fidelity?

  **Elena:** The content matters because that's what he relied on. But let's turn your "authority" back on you. You say we have an interest in controlling our normative situation. The father had that interest. But the daughter has an interest in her own autonomy. If the authority view holds, she is bound by a command from a non-existent agent. That looks less like a promise and more like a vow to a deity. Does Owens's view collapse the distinction between a promise and a vow?

  **Marcus:** Interesting. A vow is usually to God or an ideal. A promise is to a person. But if the person dies, does the promise become a vow? Or does the authority remain personal? Owens would say the authority remains personal because it was constituted by a specific interpersonal transaction. It doesn't float free into the ether of "morality."

  **Elena:** But if it remains personal, and the person is gone, the relation is severed. You're insisting the relation survives the relata. I'm insisting the *consequences* of the relation survive. It's the difference between a contract that is still active versus a contract that was breached and leaves damages. I see the obligation as damages owed to the memory of the trust. You see it as a contract still in force.

  **Marcus:** "Damages owed to the memory." That's poetic, but normatively empty. Who collects the damages? No one. So on your view, the obligation is essentially a duty to her own conscience. It's self-regarding. On my view, it's other-regarding, even if the "other" is gone. The crux is this: Do you believe the daughter is bound because breaking the promise would make *her* a certain kind of person (one who exploits reliance), or because the father *holds* a claim that transcends his biological life?

  **Elena:** I believe she is bound because the reason she had not to do it *then* persists *now*. She cannot retroactively justify inducing his reliance by later deciding his expectations didn't matter. But you still haven't answered the metaphysical worry. If the obligation is grounded in *his* authority, and authority is a power to change normative positions, a corpse has no powers. So either the authority transfers to someone else (which the secrecy clause prevents), or the authority vanishes. If it vanishes, your view says she is free. If you say she is still bound, you must admit the authority isn't doing the work—the *inviolability of the transfer* is.

  **Marcus:** And if the inviolability of the transfer is what matters, then we agree the obligation is structural, not consequential. But you want to ground that structure in the past harm of reliance. I ground it in the present status of authority. The question is: Can a normative status exist without a living holder? If I say yes, I save the intuition that she wrongs *him*. If you say yes, you save the intuition that she is bound, but you lose the "to him" part.

  **Elena:** Precisely. And if I lose the "to him" part, do I lose the obligation? Or do I just locate it differently? If the secrecy is perfect, and he is dead, the "to him" part is arguably a fiction. The only thing real is her commitment.

  **Marcus:** But the commitment was *to him*. If you reduce it to her commitment to her own integrity, you've changed the subject. You've turned a promise into a resolution. The ashes case shows that promises bind even when the only thing at stake is the promisee's standing. If you deny that standing survives, you deny the promise survives.

  **Elena:** I deny the *standing* survives. I affirm the *obligation* survives. The question is whether an obligation can float free of the standing that created it. You say no; I say yes.

  **Marcus:** Then we aren't disagreeing about the ashes. We're disagreeing about whether a right can exist without a claimant.

  **Elena:** No. We're disagreeing about whether the source of the bond is the *handing over of power* or the *taking on of a constraint*.

  **Marcus:** And if the power is gone, can the constraint remain binding *to the power-holder*?

  **Elena:** If the power-holder is nothing, there is no "to."

  **Marcus:** Then tell me: If there is no "to," who is wronged?

  **Elena:** The trust that existed.

  **Marcus:** Trust is a relation. No person, no relation.

  **Elena:** Then the relation is frozen in the past.

  **Marcus:** And obligations are present-tense.

  **Elena:** Because the past act demands present redress.

  **Marcus:** Or because the past act created a present authority.

  **Elena:** Which you admit cannot be exercised.

  **Marcus:** Standing doesn't require exercise. It requires recognition. Does she recognize his claim?

  **Elena:** She recognizes his *memory*.

  **Marcus:** Memory isn't a normative status.

  **Elena:** And a corpse isn't a claimant.

  **Marcus:** But the promise wasn't to the corpse. It was to the man.

  **Elena:** Who no longer exists.

  **Marcus:** And yet the obligation does.

  **Elena:** Because the reason for it remains.

  **Marcus:** Which reason? The harm? Or the right?

  **Elena:** The wrong.

  **Marcus:** A wrong requires a victim.

  **Elena:** It requires a violation of a principle.

  **Marcus:** A principle protecting what?

  **Elena:** Reliance.

  **Marcus:** Whose reliance?

  **Elena:** His.

  **Marcus:** He is gone.

  **Elena:** His reliance was real when it mattered.

  **Marcus:** When did it matter? At the moment of the promise? Or at the moment of performance?

  **Elena:** At the moment of the promise. That's when the obligation was born.

