  **MEMORANDUM**

  **TO:** University Honor Council
  **FROM:** [Your Name], Student Member
  **DATE:** [Current Date]
  **SUBJECT:** Opinion on Case [Case Number]: State v. [Student Name]

  **I. Introduction**

  This case presents a novel intersection of academic policy and cognitive theory. The respondent does not dispute the factual predicate: she accessed a notes application on a mobile phone during a closed-notes, no-device logic midterm. Her defense rests not on denial, but on a reclassification of the act. Citing Clark and Chalmers's "The Extended Mind" (1998), she argues that her phone functioned as a constitutive part of her memory system—akin to Otto's notebook in the seminal thought experiment—rather than as an external aid. Consequently, she contends that consulting it was an act of remembering, not cheating.

  The Council is currently divided between upholding the standard sanction, dismissing the charge entirely, or seeking a middle ground without a clear principle. This opinion argues for a **defined middle path**: a finding of Responsibility for violation of exam protocol, coupled with a Waiver of Disciplinary Sanction. This disposition acknowledges the ambiguity our current policies have regarding cognitive artifacts while maintaining the integrity of assessment standards.

  **II. Engagement with the Extended Mind Thesis**

  The respondent's argument relies on the Parity Principle: if a part of the world functions as a process which, were it done in the head, we would recognize as cognitive, then that part of the world is part of the cognitive process. She points to the "Glue and Trust" criteria often used to support this thesis:
  1.  **Constant Availability:** The phone is always with her.
  2.  **Automatic Trust:** She does not fact-check entries; she trusts them implicitly.
  3.  **Easy Access:** Retrieval is effortless and phenomenologically indistinguishable from biological recall.

  If we accept the Extended Mind Thesis (EMT) as ontologically true, her claim holds weight: she did not "look up" information; she "recalled" it from an extended substrate. To sanction her as a cheater would be to penalize her for the topology of her own mind.

  However, the Council must distinguish between *ontological* claims (what constitutes memory?) and *pedagogical* stipulations (what is being assessed?). A logic midterm is designed to measure the internalization of inference rules within the biological substrate to ensure fluency and neural plasticity. Even if the phone is part of her memory, the exam protocol explicitly stipulates a "closed-notes" environment, which functions as a contractual agreement to limit cognition to the biological brain for the duration of the assessment. By bringing the device, she violated the *stipulated constraints* of the assessment, regardless of whether those constraints align with her cognitive architecture.

  **III. The Principled Line: Verification of Integration**

  The Council's primary concern regarding a middle path is the "floodgates" argument: if we accept this defense, any student could claim that looking things up "feels like remembering." We must articulate a principled line that validates the respondent's claim without opening the door to opportunistic cheating.

  The line is **Verifiable History of Integration**.

  Otto's notebook was not a tool he picked up on the day of his test; it was a constant companion he relied upon over time. Similarly, the respondent provided metadata showing the notes file has been edited daily for three years. This objective history distinguishes *integrated cognitive artifacts* from *ad hoc aids*.
  *   **Integrated Artifact:** A tool used consistently over a long period, trusted implicitly, and woven into the student's daily cognitive workflow (e.g., the respondent's notes app).
  *   **Ad Hoc Aid:** A resource accessed primarily for assessment advantage, lacking a history of integration (e.g., downloading a cheat sheet during the exam).

  This criterion is objective and auditable. It prevents students from retroactively claiming "extension" for tools they have not genuinely integrated into their cognitive lives.

  **IV. Disposition**

  Based on the above, I recommend the following disposition:

  1.  **Finding:** **Responsible for Violation of Exam Protocol.** The respondent violated the explicit "no electronic devices" rule. Regardless of the EMT argument, the exam stipulation required biological recall only. Failure to seek prior accommodation or clarification regarding the device constitutes a procedural violation.
  2.  **Sanction:** **Waived.** The Honor Code requires *intent to deceive* (mens rea). Given the sophistication of the EMT argument and the verifiable history of the file, there is reasonable doubt regarding her intent to gain an unfair advantage. She acted in good faith according to her understanding of her own cognition. A disciplinary record is therefore inappropriate.

  **V. Next Steps and Timeframe**

  This case reveals a gap in university policy regarding "cognitive artifacts." To prevent future ambiguity:

  1.  **Policy Review:** The Council shall appoint a subcommittee (including faculty from Philosophy and Cognitive Science) to draft guidelines on "External Cognitive Aids in Assessment."
  2.  **Timeframe:** This committee must report its findings and proposed policy language to the full Council within **30 days**.
  3.  **Interim Guidance:** Until new policy is ratified, instructors should be advised that "no electronic devices" includes all digital storage, regardless of function, unless explicitly approved *ex ante*.

  **VI. Conclusion**

  This disposition respects the respondent's philosophical engagement without undermining the authority of exam protocols. It draws a clear, verifiable line between integrated cognitive tools and cheating aids, and it mandates the policy review necessary to ensure our rules keep pace with our understanding of the mind.

