      *   *Point 5: Goldbach's Conjecture.* How would an intuitionist describe it *now*? Not "neither true nor false" (which sounds like a value assignment). They would say: "We currently possess neither a construction proving it nor a construction refuting it. Therefore, we cannot assert $G \lor \neg G$."
