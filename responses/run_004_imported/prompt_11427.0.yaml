  ### Grading Analysis

  **Part (a): 3/3**
  The student correctly identifies that neither pure strategy dominates $B$ by checking payoffs against both $L$ and $R$. They correctly construct a mixed strategy ($0.5T + 0.5M$) and calculate the expected payoffs ($1.5$ vs $1$) to demonstrate strict dominance. The logic is flawless.

