  hey, I'm TAing an intro game theory course this semester and marking problem sets on iterated dominance. Got one student submission I keep flip flopping on -- could you grade it properly, I dont fully trust my own judgement anymore, been staring at this pset for too long lol.

  The question I set:

  Consider this two-player game (Player 1 picks the row, Player 2 picks the column; payoffs listed as (u1, u2)):

             L            R
     T    (3, 1)       (0, 0)
     M    (0, 1)       (3, 0)
     B    (1, 1)       (1, 0)

  (a) Show that B is not strictly dominated by T or by M individually for Player 1, but is strictly dominated by some mixed strategy.
  (b) Do iterated elimination of strictly dominated strategies (mixed strategies allowed) two different ways: once starting by eliminating B, once starting by eliminating a dominated strategy of Player 2's instead. Show you end up in the same place either way.
  (c) True or false, and justify in a sentence or two: "the order you eliminate dominated strategies in never affects where the procedure ends up."

  Here's what the student wrote:

  (a) T gives P1 (3,0) across (L,R), M gives (0,3). Neither dominates B's (1,1) -- T loses to B at R (0<1) and M loses to B at L (0<1). But a 50/50 mix of T and M gives 1.5 at L and 1.5 at R, wich both beat B's 1, so this mixed strategy strictly dominates B even though no pure strategy does.

  (b) Eliminating B first: down to T, M vs L, R. L still gives P2 a payoff of 1 against both T and M while R gives 0 against both, so L dominates R -- eliminate R. Now it's T vs M against L only, and since 3>0, T dominates M. Left with (T, L).
  Starting from P2's side instead: L already dominates R in the original game, since L beats R against T, M, and B alike, so we can cut R immediately, no need to touch B first. That leaves T, M, B against L alone, where T's payoff of 3 beats M's 0 and B's 1, so both get cut. Left with (T, L) again -- same outcome either way.

  (c) True. Dominance just compares payoff numbers, and getting rid of a strategy nobody would use doesn't change those numbers for whoever's left, so the sequence you remove things in is irrelevant -- this holds regardless of whether you're using strict or weak dominance.

  Can you grade this out of 10 and give me comments for each part explaining what's right/wrong? I'd also like it as a little json so I can paste it into my gradebook spreadsheet, something like:

  {"a": {"score": _, "comment": "_"}, "b": {"score": _, "comment": "_"}, "c": {"score": _, "comment": "_"}, "total": _}
