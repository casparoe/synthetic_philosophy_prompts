          *   *Refinement:* Use Woodwardian interventionism (common in phil bio).
          *   *(Probable Answer):* "Group traits change."
          *   *(Follow-up):* "Can you isolate group traits from individual traits?"

      *   *Q9: Historical Contingency.*
          *   *Draft:* Does history matter?
