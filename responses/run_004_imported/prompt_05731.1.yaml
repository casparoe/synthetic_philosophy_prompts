          *   *Refinement:* Contextualize it within the causal interpretation.
          *   *(Probable Answer):* "Averaging hides the group structure."
          *   *(Follow-up):* "Is hiding structure a mathematical error or an explanatory choice?"

      *   *Q4: Price Equation & Tautology.* (Required Topic).
          *   *Draft:* Price equation always allows partitioning. Doesn't that make group selection always true?
          *   *Refinement:* Focus on the "true by definition" risk.
          *   *(Probable Answer):* "We need to show the between-group variance is significant."
          *   *(Follow-up):* "Significant compared to what? Isn't the partitioning itself the assumption?"

      *   *Q5: Eusociality & Nowak/Tarnita/Wilson.* (Required Topic).
          *   *Draft:* Remember the 2010 Nature paper? You support group selection there. But people attacked it. How does equivalence fit?
          *   *Refinement:* Focus on the *rejection* of IF in that paper vs. the equivalence claim.
          *   *(Probable Answer):* "IF breaks down in certain conditions."
          *   *(Follow-up):* "If they are equivalent, how can one break down while the other holds?"

      *   *Q6: Causal Reality vs. Modeling Heuristic.*
          *   *Draft:* Is group selection real or just a model?
          *   *Refinement:* Connect to the "ontology" of selection.
          *   *(Probable Answer):* "It's as real as individual selection."
          *   *(Follow-up):* "Can we observe it independently of the model?"

      *   *Q7: The "Weak Selection" Limit.*
          *   *Draft:* What about weak selection?
          *   *Refinement:* Use technical knowledge (Okasha). Weak selection often makes IF work better.
          *   *(Probable Answer):* "MLST works for strong selection too."
