prompt: |-
  I'm a senior taking a philosophy of biology seminar this term, and we've just spent two weeks on the units-of-selection debate, working through Sober and Wilson's *Unto Others* alongside Okasha's more formal treatment in *Evolution and the Levels of Selection* to keep the mathematics of the dispute straight. My department is bringing in a biologist next month who has built her career defending multilevel selection theory against gene's-eye-view critics, and our seminar has been asked to contribute questions for a pre-talk interview that the department is recording for its podcast. My professor warned us that she is very good at deflecting hard questions with some version of the line that inclusive-fitness accounting and multilevel selection are "just two equivalent ways of partitioning the same variance," so that any apparent disagreement dissolves into terminology once you actually do the math -- which seems a little convenient given that in her own work on eusocial insects she clearly wants to say group selection was doing real, non-redundant causal work, not merely offering an alternative bookkeeping scheme for the same result.

  Could you draft eight to ten interview questions that make that "it's just bookkeeping" deflection progressively harder for her to fall back on, rather than letting her simply restate it? Please include at least one question that presses her on whether the formal-equivalence claim is compatible with her own stronger causal claims about cases like eusociality (it would help to raise the well-known episode where a high-profile paper tried to jettison inclusive-fitness theory in favor of ordinary natural-selection models to explain eusociality, and the scale of the pushback it received from the rest of the field); one on Sober and Wilson's charge that gene's-eye-view relatedness calculations commit an "averaging fallacy," together with the natural reply that averaging is just correct statistics rather than a fallacy; and one on whether the fact that a within-group/between-group partition of the Price equation can always be constructed threatens to make "group selection" true by definition rather than by evidence. End with a question about what empirical finding, if any, could count against multilevel selection theory specifically rather than being redescribable within it. For each question, add a short parenthetical noting the answer she will probably give and the follow-up question that keeps the pressure on.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
