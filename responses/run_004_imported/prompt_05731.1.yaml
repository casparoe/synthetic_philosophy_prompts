      *   **Event:** Pre-talk interview with a visiting biologist (defender of Multilevel Selection Theory - MLST) for a department podcast.
      *   **Problem:** The biologist tends to deflect hard questions by claiming Inclusive Fitness (IF) and MLST are "mathematically equivalent" (just different bookkeeping), yet she makes strong *causal* claims for group selection (especially in eusociality) that seem to go beyond mere bookkeeping.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Make the "it's just bookkeeping" deflection progressively harder to use.
          *   Include specific topics:
              *   Compatibility of formal equivalence with strong causal claims (mention the Nowak/Tarnita/Wilson 2010 eusociality controversy).
              *   Sober & Wilson's "averaging fallacy" vs. the statistical correctness reply.
              *   Price equation partitioning making group selection "true by definition."
              *   Final question: What empirical finding could count *against* MLST (falsifiability)?
          *   Format: Question + (Parenthetical: Probable Answer + Follow-up).

  2.  **Deconstruct the Core Tension:**
      *   *The Equivalence Thesis:* Mathematically, IF and MLST (via Price Equation) often yield the same predictions.
      *   *The Causal Claim:* Proponents of MLST (like the visitor) argue group selection is a *real cause*, not just a perspective.
      *   *The Tension:* If they are mathematically equivalent, how can one be "real" and the other "mere bookkeeping"? Or if both are real, what distinguishes them empirically? If MLST is always applicable (via Price partitioning), is it a tautology?
      *   *Strategy:* Start broad, narrow down to the math/causality gap, hit specific technical objections (averaging, Price equation), address the eusociality controversy, and end on falsifiability.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Setting the Stage.* Need to acknowledge her work but introduce the tension immediately.
          *   *Draft:* You say MLST and IF are equivalent. But you argue for group selection causality. How does that work?
          *   *Refinement:* Make it more specific to her career trajectory.
          *   *(Probable Answer):* "They are perspectives on the same process."
          *   *(Follow-up):* "Do perspectives have different causal powers?"

      *   *Q2: The "Bookkeeping" Defense.* Directly address the professor's warning.
