answer: |-
  Here are ten interview questions designed to navigate the tension between the mathematical equivalence thesis and the causal reality claims of Multilevel Selection Theory (MLST). They are ordered to progressively narrow the available space for the "just bookkeeping" deflection.

  **1. The Equivalence-Causality Tension**
  "In your earlier work, you've often noted that inclusive fitness (IF) and multilevel selection (MLS) models can be mathematically transformed into one another via the Price equation. However, in your specific research on eusociality, you argue that group selection is a distinct *causal* force, not just a modeling perspective. If the mathematics are truly equivalent, how can one framework capture a causal reality that the other merely redescribes? Does the equivalence thesis actually undermine the claim that group selection is doing unique causal work?"
  *(Probable Answer: She will likely argue that while the math is equivalent, the MLS perspective is heuristically superior for identifying causal structures that IF obscures.)*
  *(Follow-up: If IF obscures causal structure, doesn't that imply IF is mathematically inadequate in those contexts, thereby contradicting the claim that they are fully equivalent?)*

  **2. Explanatory Virtues vs. Truth**
  "Assuming for a moment that both frameworks yield the same predictions, proponents of MLS argue it offers better *explanations*. But in philosophy of science, explanatory convenience doesn't always track ontological truth. Are you claiming that group selection is *real* in a way that gene-level selection is not, or are you simply arguing that MLS is a more useful tool for biologists? At what point does a 'useful tool' become a 'biological mechanism' in your view?"
  *(Probable Answer: She will likely claim that groups are real biological entities, similar to organisms, and thus selection acting on them is equally real.)*
  *(Follow-up: If groups are entities, what are the necessary conditions for a collection of individuals to become a 'group' entity rather than just a population structure?)*

  **3. The Averaging Fallacy**
  "Sober and Wilson argue that the gene's-eye view commits an 'averaging fallacy' by smoothing over the variance between groups, thereby missing the evolutionary dynamic. Critics counter that averaging is just correct statistics and that no fallacy is committed if the prediction holds. Where do you stand on this? Is the 'fallacy' a mathematical error, or is it a failure to recognize the relevant biological units?"
  *(Probable Answer: She will likely say it is a failure to recognize biological units, not a mathematical error.)*
  *(Follow-up: If it's not a mathematical error, can we still say the gene's-eye view is 'wrong,' or just that it chooses a different level of abstraction?)*

  **4. The Price Equation and Tautology**
  "One concern raised by Okasha and others is that because the Price equation allows us to *always* partition selection into within-group and between-group components, MLS risks being true by definition. If we can always find a between-group variance term, doesn't that make the claim 'group selection is occurring' trivial? How do you distinguish between a mathematical partition that always exists and a biological process that is actually driving evolution?"
  *(Probable Answer: She will likely argue that the existence of the term doesn't matter; what matters is the *magnitude* of the between-group variance relative to within-group variance.)*
  *(Follow-up: But who decides the threshold for 'significant' magnitude? If that threshold is arbitrary, isn't the distinction between 'group selection present' and 'absent' also arbitrary?)*

  **5. The Nowak, Tarnita, and Wilson Controversy**
  "In the famous 2010 *Nature* paper, Nowak, Tarnita, and E.O. Wilson argued that inclusive fitness theory was too limited to explain eusociality and proposed a standard natural selection model instead, which drew massive criticism from the field. Given your defense of MLS, do you agree that inclusive fitness theory *breaks down* in these cases? If so, how can IF and MLS be 'equivalent' if IF fails where MLS succeeds?"
  *(Probable Answer: She will likely agree that IF relies on assumptions like weak selection that don't hold in eusocial origins, whereas MLS is more general.)*
  *(Follow-up: If MLS is more general and IF is a special case, doesn't that refute the strong equivalence thesis that they are merely interchangeable perspectives on the same data?)*

  **6. Weak Selection and Generality**
  "Building on that, Okasha points out that the equivalence between IF and MLS often relies on assumptions of weak selection. In scenarios of strong selection, the mathematical mapping can break down. Does your commitment to MLS rest on the idea that strong selection is the biological norm rather than the exception? If weak selection is common, does the 'bookkeeping' defense become more viable there?"
  *(Probable Answer: She will likely argue that strong selection is common in the critical transitions she studies, like the origin of eusociality.)*
  *(Follow-up: So is your theory a general theory of evolution, or a specific theory about evolutionary transitions in individuality?)*

  **7. Assortment vs. Group Selection**
  "Many critics argue that what you call 'group selection' is simply 'kin selection with assortment.' If individuals interact primarily with relatives, the math looks like group selection, but the driver is relatedness. How do you empirically distinguish between high relatedness driving the trait versus group structure driving the trait, if high relatedness is often a *result* of the group structure?"
  *(Probable Answer: She will likely argue that causality flows from the group structure creating the relatedness, not vice versa.)*
  *(Follow-up: Can you design an experiment where you hold relatedness constant but vary group structure to isolate the causal variable?)*

  **8. Interventionist Causality**
  "Philosophers of biology often use interventionist accounts of causation: X causes Y if manipulating X changes Y. If we want to test if 'group selection' is a cause, what specific intervention do we perform on the *group* that cannot be reduced to an intervention on the *individuals* within it? How do you manipulate a group variable without manipulating individual variables?"
  *(Probable Answer: She will likely suggest manipulating group composition or group survival rates directly.)*
  *(Follow-up: But isn't changing group survival rates just changing the survival rates of the individuals that constitute the group? Where is the independent lever?)*

  **9. Universal Redescription**
  "If MLS is a general framework, can *any* evolutionary scenario be redescribed as multilevel selection? For example, could meiotic drive or intragenomic conflict be described as 'selection on gene groups'? If everything can be described as MLS, does the term lose its discriminatory power to tell us what is actually happening in a specific system?"
  *(Probable Answer: She will likely concede that yes, many things can be modeled this way, but argue that it is only *useful* when group variance is high.)*
  *(Follow-up: If utility is the only criterion, are we debating biology or just aesthetics of modeling?)*

  **10. Falsifiability**
  "Finally, to put it sharply: What empirical finding would count specifically *against* Multilevel Selection Theory? If we found a case where between-group variance was zero, you could say group selection isn't operating *there*, but that doesn't falsify the theory itself. Is there any possible world or empirical result where MLS would be the *wrong* explanation, rather than just an inapplicable one?"
  *(Probable Answer: She will likely struggle here, perhaps suggesting a case where individual selection consistently overrides group benefits despite high group variance.)*
  *(Follow-up: But if individual selection overrides it, wouldn't an MLS proponent just say 'the within-group term was larger'? What result would force you to abandon the MLS framework entirely?)*
