answer: |-
  Hi everyone. For those who don't know me, I'm [Name].

  In a few weeks, I hit five years. Five years without a drink. Five years since I stopped trying to white-knuckle my way through life and started asking for help.

  I want to thank this room. You've held the space for me when I couldn't hold it for myself. I want to thank my sponsor, who has answered the phone more times than I can count, usually when I was certain I was right and she knew I was wrong. And I want to thank my family—my mom, my brother, and my partner—who are here today. I know this room can feel strange if you haven't been here before. There's a lot of specific language. But what we're really talking about is simple: it's about how we stay alive, and how we stay honest.

  I'm also finishing up my degree this semester. I've been taking a class on how we know what we know. And recently, we talked about pilots.

  There's a thought experiment about a pilot flying at high altitude. At that height, the oxygen is thin. It causes hypoxia. And the terrifying thing about hypoxia isn't just that it makes you confused; it's that it makes you feel *confident*. You do the math on your fuel consumption, you check your instruments, and you feel lucid. You feel sure. But the lack of oxygen has compromised the very instrument doing the checking. The rational move—the only safe move—is to ignore your own gut feeling and trust the protocol. Trust the oxygen mask. Trust the ground control.

  Sitting in that classroom, I didn't hear a philosophy problem. I heard my life before recovery.

  We have a saying here: "My best thinking got me here." For a long time, I thought that meant I was stupid. I thought it meant my brain was broken, full stop. But that's not true, and I don't believe it anymore. I can do calculus. I can build relationships. I can navigate the world. My brain works.

  But addiction is like that high altitude. It's a specific condition that creates a specific blind spot. When I'm in the grip of that disease, I can construct a perfect, logical argument for why I can have just one drink. The logic holds up. It feels airtight. But the "oxygen" is missing. The premise is poisoned.

  So, how do you live with that? How do you trust your mind generally, but distrust it specifically, without driving yourself crazy?

  For me, the answer is that I don't have to solve the contradiction alone. I just have to recognize when I'm at altitude.

  When I feel that surge of certainty—that "I've got this, I'm fine, I can handle it"—I have to treat that feeling not as a green light, but as a warning siren. It's the hypoxia kicking in. It's the signal that my internal compass is passing through a magnetic field where it can't be trusted.

  That is why I call my sponsor. That is why I come to this room. It isn't blind obedience. It's actually the most rational thing I can do. It's acknowledging that while my engine works, the conditions have changed, and I need an external read on the instruments.

  To my family: I know it looks strange sometimes. You see me pick up the phone to tell someone I'm having a hard time, when I seem perfectly fine to you. But you're seeing me from the ground. You don't feel the drop in pressure. I'm calling because I know what happens when I trust the feeling of being "fine" more than I trust the people who've seen me at altitude.

  Five years ago, I thought sobriety was about suppressing my will. Today, I see it's about calibrating it. It's about knowing that I am a good pilot, but I'm not invincible. And I'm not flying solo anymore.

  I trust my mind. But on this one thing, I trust this community more. And that trust is why I'm standing here today.

  Thank you.
