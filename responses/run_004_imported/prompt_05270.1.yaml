prompt: |-
  Okay, this is going to sound like a strange combo but bear with me. I'm coming up on 5 years sober in a few weeks, and my home group does this thing where whoever's got an anniversary gives a "share" at the meeting closest to the date — basically a short speech, cake after, the whole ritual. My sponsor and a bunch of people from the rooms will be there, but so will my mom, my brother, and my partner, none of whom have ever sat in a meeting and don't know any of the lingo. I'm also, at 34, finally finishing the degree I dropped out of the first time, and this semester I'm taking intro epistemology, where we spent a week on "higher-order evidence" and "epistemic akrasia." There's a stock example in that literature, I think its literally called the Hypoxia case, about a pilot who might be losing oxygen at altitude — the whole point being that hypoxia wrecks your reasoning while making you feel completely lucid and sure of yourself, so the rational move is supposedly to stop trusting your own math even though, from the inside, it still seems totally right. I sat there thinking: that is just "call your sponsor before you pick up, not after," with better vocabulary. It's also basically what people mean in meetings when they say "my best thinking got me here." I already tried explaining this to my sponsor over coffee and she said something like "sure, sounds right, are you gonna write the thing or keep reading me theory," which, fair.

  So here's the actual ask: can you write me the share, something that reads out loud in about 5 minutes. I want the philosophy to do real work in it — not dropped in as a reference, but actually used to make the case that "don't trust your own head on this one specific thing, call someone instead" is a genuinely rational policy and not just a slogan people repeat until it sounds true. Obviously nobody should say "epistemic akrasia" out loud to a room that includes my mother, so it has to work completely in plain language. It also can't read as a lecture, because I've got an actual retired philosophy professor in my home group who will 100% clock it if the idea's been flattened or used wrong, and I've got family in the audience who don't want a seminar, they want to feel something. And there's a piece I haven't fully worked out myself that I'd want the speech to actually engage with rather than skip past: I don't want it to sound like "my own thinking is garbage, full stop," because that's not true and isn't even what the philosophy says as far as I understand it — but I also can't quite explain how you're supposed to go on trusting that your mind basically works while still, in this one narrow domain, refusing to believe its verdict in the moment without that just being a straight contradiction. If the speech can actually thread that needle instead of asserting both halves and hoping nobody notices, that would mean a lot.
reasoning: |-
  Here's a thinking process that leads to the suggested share:

  1.  **Analyze the Request:**

      *   **Occasion:** 5-year sobriety anniversary share at an AA/home group meeting.
      *   **Audience:** Mixed. Recovery folks (including a retired philosophy professor), family (mom, brother, partner - no recovery lingo), sponsor.
      *   **Time:** ~5 minutes spoken (roughly 600-750 words at a moderate pace).
      *   **Core Theme:** Connecting the recovery slogan "My best thinking got me here / Call your sponsor" with the philosophical concept of "Higher-Order Evidence" (specifically the Hypoxia case).
      *   **Key Constraint 1 (Tone):** Cannot sound like a lecture. Must be emotional and relatable for family, but rigorous enough for the philosophy prof. No jargon like "epistemic akrasia."
      *   **Key Constraint 2 (Philosophical Nuance):** Must avoid total self-distrust ("my mind is garbage"). It needs to thread the needle: *Generally* trust your mind, but *specifically* distrust it regarding addiction/using, because the "instrument" is compromised in that domain. It needs to explain *why* this is rational, not just blind obedience.
      *   **Speaker Profile:** 34 years old, finishing a degree (philosophy major), 5 years sober.

  2.  **Deconstruct the Philosophical Concept (for internal use):**

      *   *Hypoxia Case:* A pilot at high altitude. Lack of oxygen impairs judgment. Crucially, it impairs the *ability to recognize* that judgment is impaired. You feel confident while being wrong.
      *   *Higher-Order Evidence:* Evidence about your own evidence/reliability. "I am in a state where my reasoning is unreliable."
      *   *The Tension:* If I think $P$ (I can have one drink), but I also have evidence that my thinking about $P$ is compromised (addiction/hypoxia), rationality demands I discount $P$, even if $P$ feels true.
      *   *The Recovery Translation:* Addiction is the hypoxia. The "best thinking" is the confident calculation that "just one won't hurt." The "call your sponsor" is the pre-commitment strategy to bypass the compromised instrument.
      *   *The Nuance:* I can trust my math on taxes, my engineering on bridges, my love for my partner. I cannot trust my math on "can I handle a drink?" The defect is domain-specific.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the milestone (5 years). Thank the group and family. Set a warm tone.
      *   **The Hook (The Degree/Philosophy):** Mention finishing the degree. Briefly touch on the class without naming drops. Introduce the pilot story.
      *   **The Connection:** Connect the pilot to addiction. This is where the "best thinking got me here" slogan gets the philosophical backbone.
      *   **The Nuance (The Needle):** Address the "is my brain broken?" fear. Distinguish between *capacity* and *condition*. The engine works, but the fuel is bad. Or: The compass works, but there's magnetic interference. Let's use the "instrument" metaphor.
      *   **The Solution (The Call):** Why calling someone works. It's an external check. It's rational humility.
      *   **Closing:** Bring it back to love, family, and the future. Gratitude.

  4.  **Drafting - Iteration 1 (Mental Outline & Tone Check):**

      *   *Too academic?* If I say "higher-order evidence," the mom falls asleep. If I say "spiritual principle," the prof rolls eyes. Need plain English.
      *   *The "Needle":* How to say "I trust my brain but not on this"? Maybe compare it to vision. If I have an eye infection, I don't trust my eyes to judge color, but I still trust my ears. Addiction is an infection of *desire* and *prediction*.
      *   *The Pilot Story:* Keep it simple. High altitude, oxygen mask, feels fine, actually dying.
      *   *Family Element:* Make sure Mom and Partner feel included. They are part of the "external check."

  5.  **Drafting - Writing the Content (incorporating constraints):**

      *   *Word Count:* Aiming for ~700 words.
      *   *Voice:* Humble, reflective, slightly intellectual but grounded.
      *   *Key Phrase:* "My best thinking got me here."
      *   *Key Insight:* It's not that I'm stupid; it's that the *context* changes the reliability of the data.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm analyzing the room *during* the share. It has to be a story about *me* realizing this. The philosophy must be the *structure*, not the *subject*.

      *Refining the "Needle":* The prompt asks to engage with the tension: "trusting that your mind basically works while still... refusing to believe its verdict."
      *Solution:* Frame it as "Calibration." A scale is accurate until you put a magnet under it. The scale isn't broken, the environment is. Addiction is the magnet.

  6.  **Final Polish:**

      *   Check timing.
      *   Ensure the "Call your sponsor" message lands emotionally, not just logically.
      *   Make sure the family feels welcomed, not alienated by "recovery speak."
      *   Ensure the philosophy prof won't cringe (accurate analogy, no misuse of terms).

  7.  **Final Review against constraints:**
      *   5 mins? Yes.
      *   No jargon? Yes.
      *   Philosophy doing work? Yes (the pilot analogy drives the logic).
      *   Needle threaded? Yes (the "magnet under the scale" or "compass near iron" analogy).
      *   Emotional resonance? Yes (focus on family and survival).

  8.  *(Final thought before generating)*: The prompt mentions the sponsor said "are you gonna write the thing or keep reading me theory." The share should acknowledge that tension lightly—showing that the theory *served* the practice, not replaced it.

