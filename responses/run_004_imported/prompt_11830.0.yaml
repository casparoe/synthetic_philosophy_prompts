answer: |-
  **Title:** The Humphrey Dilemma: Why Counterpart Theory Wins the Metaphysics Even If It Loses the Intuition

  **Introduction**

  The argument you and Priya had is a rite of passage in modal metaphysics. It is the clash between the seductive clarity of pre-theoretic intuition and the austere rigor of systematic ontology. On one side stands Saul Kripke, championing the idea that when we say "Humphrey could have won," we mean *Humphrey himself*—the very same flesh-and-blood individual—might have possessed a different property. On the other stands David Lewis, arguing that "Humphrey himself" is bound to the actual world, and modal claims are made true by *counterparts*: distinct individuals in other concrete worlds who resemble Humphrey closely enough.

  The Humphrey Objection (from Kripke's *Naming and Necessity*, footnote 13) is the canonical weapon against Lewis. Kripke argues that Counterpart Theory (CT) is semantically inadequate because it fails to capture what we *mean* by *de re* modality. Humphrey should not care if a counterpart wins; he cares if *he* wins. Priya is right that this intuition is powerful. However, you were right to suspect that leaning on it is question-begging.

  This essay will argue that while the Humphrey Objection successfully identifies a phenomenological cost of Counterpart Theory, it fails as a metaphysical refutation. Transworld Identity (TWI), the rival view, purchases intuitive satisfaction at the price of metaphysical coherence, specifically regarding the Problem of Accidental Intrinsics and the commitment to haecceitism. Therefore, the verdict is this: **Counterpart Theory is the metaphysically superior account of *de re* modality.** The discomfort Kripke identifies is not a bug in Lewis's system, but the necessary cost of abandoning a magical view of identity. We must accept Lewis's revisionary semantics because the alternative requires believing in primitive "thisness" properties that do no explanatory work.

  **The Humphrey Objection and the Charge of Irrelevance**

  Kripke's objection is pragmatic and semantic. He notes that if CT is true, the sentence "Humphrey could have won the election" is analyzed as "There exists a possible world containing a counterpart of Humphrey who wins the election." Kripke's punchline is that this is "little comfort" to Humphrey. If I care about whether *I* could have been a doctor, I am not consoled by the fact that someone *like me* in another universe is a doctor.

  Priya's intuition here is that CT changes the subject. It turns a claim about *me* into a claim about *someone else*. If semantics is supposed to track truth conditions based on usage, and our usage is fixated on self-identity, then CT seems to get the truth conditions wrong. It makes true sentences that don't match the speaker's intent.

  However, your counter-argument—that this is question-begging—is the stronger philosophical move. Kripke's objection assumes that for "Humphrey could have won" to be true, it must be *Humphrey* (numerically identical) who wins in the other world. But that is precisely what is in dispute. Lewis's claim is that transworld numerical identity is impossible. If it is impossible, then the only way to make sense of modal talk is via similarity relations. To say "CT fails because it doesn't give us transworld identity" is to assume transworld identity is coherent and necessary, which is the very point Lewis denies.

  **The Metaphysical Cost of Transworld Identity**

  To see why Lewis's hard line is necessary, we must look at what TWI requires. If Humphrey exists in World A (actual) and World B (possible), what makes the Humphrey in B the *same* entity as the Humphrey in A?

  It cannot be qualitative similarity alone, because Humphrey could have been qualitatively very different (e.g., lost a limb, been slightly taller). If identity isn't grounded in qualities, it must be grounded in something else. This forces the TWI proponent into **haecceitism**. Haecceitism posits a primitive "thisness" (haecceity) for every individual—a non-qualitative property that makes Humphrey *Humphrey* regardless of his attributes.

  This is a massive ontological cost. Haecceities are metaphysically mysterious. They are unanalyzable primitives that individuate objects without reference to any properties. Worse, they lead to the possibility of "haecceitistic swaps": two possible worlds that are qualitatively identical in every respect, differing only in that Humphrey and his counterpart have swapped haecceities. If you cannot distinguish these worlds by any observation or description, positing them violates the spirit of the Identity of Indiscernibles and clutters ontology with invisible differentiators.

  Furthermore, TWI faces Lewis's **Problem of Accidental Intrinsics**. Suppose Humphrey is 6 feet tall in the actual world. In a possible world, Humphrey is 5'11". If TWI holds, the *same object* has the property of being 6 feet tall and the property of being 5'11" tall. Since these are intrinsic properties (not relations to times or worlds), this looks like a contradiction: $x$ is $F$ and $x$ is not-$F$.

  TWI proponents usually reply by relativizing properties: Humphrey is 6ft-tall-at-World-A and 5'11"-tall-at-World-B. But Lewis argues this turns intrinsic properties into disguised relations, which is counterintuitive. Being 6 feet tall isn't like being a brother; it shouldn't depend on a relation to a world. CT solves this elegantly: The actual Humphrey is 6 feet tall. The counterpart in World B is 5'11". No contradiction, no relativized intrinsics. One object has one height; a *different* object has another.

  **Is the Dispute Merely Semantic?**

  You and Priya wondered if this is just a fight over paraphrase. Lewis often suggests CT is a way to translate modal logic into extensional quantification over concrete worlds. If it were merely semantic, Kripke would be right to say, "Fine, keep your semantics, but I'll keep my metaphysics."

  But it is not merely semantic. It is a disagreement about **truth-makers**.
  *   For Lewis, the truth-maker for "Humphrey could have won" is a concrete spacetime manifold containing a person similar to Humphrey.
  *   For Kripke (and Plantinga), the truth-maker is an abstract state of affairs involving Humphrey's essence.

  If Lewis is right about the metaphysics (that concrete worlds exist and transworld identity is incoherent), then Kripke's semantics are not just different; they are *false*. They purport to describe a relation (transworld identity) that does not exist. Conversely, if Kripke is right, Lewis is positing a vast plurality of concrete universes unnecessarily.

  However, the "merely semantic" charge often hides the metaphysical bullet. When Kripke says, "We mean *Humphrey*," he is asserting that our modal concepts track a metaphysical reality of enduring essences. Lewis is asserting that our modal concepts are loose ways of talking about similarity across concrete realities. The dispute is about what exists, not just how we talk.

  **Alternatives and Essentialism**

  Is there a middle ground? Some propose grounding transworld identity in **origin essentialism**. Perhaps Humphrey is Humphrey across worlds because he comes from the same sperm and egg. This avoids primitive haecceities by using qualitative origins as the criterion of identity.

  This helps, but it doesn't solve the Problem of Accidental Intrinsics. Even if we know *which* individual is Humphrey in another world via his origins, that individual still possesses contradictory intrinsic properties (height, weight, etc.) across worlds. Furthermore, origin essentialism is itself controversial. Could Humphrey have been born of different parents? Many intuitions suggest yes. If so, origin essentialism fails as a necessary condition, and we are back to haecceities.

  Another alternative is Plantinga's **Actualism**, which replaces concrete possible worlds with abstract maximal states of affairs. This avoids Lewis's "incredulous stare" at infinite concrete universes. However, Plantinga still requires individual essences (haecceities) to ground transworld identity. You escape the concrete multiverse but keep the mystical "thisness." Metaphysically, this is trading one cost for another.

  **The Verdict: Why Lewis Wins**

  So, where do we land? Priya felt that CT fails because it doesn't honor the intuition that *I* am the subject of my possibilities. You felt that intuition shouldn't dictate metaphysics.

  **You are right.** The Humphrey Objection is a powerful rhetorical device, but it is not a metaphysical argument. It relies on the emotional weight of "self-concern" to smuggle in a metaphysical assumption (that self-concern requires numerical identity). But self-concern can be grounded in psychological continuity and similarity, not just numerical identity. I care about my future self largely because of psychological connectedness. If a counterpart is sufficiently similar to me (sharing my memories, character, and origins), there is a sense in which "what happens to him" matters to me, even if he isn't numerically identical.

  More importantly, TWI is metaphysically untenable without haecceitism. To insist on transworld identity is to insist that objects have a "substance" beyond their properties that travels across worlds. This is a ghost in the machine. It explains nothing. It merely labels the problem. CT, by contrast, offers a reductive analysis. It explains modality in terms of existence, similarity, and quantification. It solves the Problem of Accidental Intrinsics without relativizing properties. It avoids haecceitistic swaps.

  The "cost" of CT is that we must accept revisionary semantics. We must admit that when we say "I could have been a doctor," strictly speaking, we are talking about a counterpart. This is a pill to swallow. It feels cold. But philosophy often requires us to trade folk intuition for theoretical coherence. The intuition that "it must be me" is a relic of thinking of modality as a kind of magical travel rather than a logical feature of reality.

  **Conclusion**

  Tell Priya that her intuition is shared by almost everyone—that's why Kripke's footnote is famous. But tell her that intuitions are data points, not verdicts. The Humphrey Objection shows that Counterpart Theory is *revisionary*, not that it is *false*. Transworld Identity, while comforting, requires a commitment to primitive haecceities and invites contradictions regarding intrinsic properties.

  The verdict is that **Counterpart Theory is the correct metaphysical framework.** It provides a consistent, non-mysterious account of modal truth conditions. The "Humphrey" discomfort is the price of admitting that "you" are world-bound. You are not a transworld traveler; you are an actual particular. Your possibilities are not places you could have gone; they are reflections of what you are, cast upon the screen of other worlds. Lewis's theory respects the logic of modality even if it bruises the ego of the modal subject. In a choice between a coherent metaphysics and a comforting intuition, metaphysics must win.
