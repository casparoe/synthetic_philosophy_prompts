answer: |-
  **Setting:** *A quiet corner of a coffee shop. 11:53 AM. On the table sit two identical glass vials containing a viscous, blue liquid. Two smartphones lie face up, both displaying a banking notification: **+$1,000,000.00 DEPOSITED.** **GREG** (Gauthier-proponent) looks pale, staring at the vial. **ELENA** (McClennen-proponent) looks tense, checking her watch.*

  **Greg:** Seven minutes.

  **Elena:** Plenty of time to swallow a few ounces of nausea-inducing toxin. You're hesitating.

  **Greg:** I'm calculating. The money is in the account, Elena. It's sunk. The billionaire's prediction machine has already done its work. If I drink, I lose utility. I suffer pain. If I don't, I suffer nothing. From the perspective of *now*, 11:53 AM, the act of drinking is strictly dominated by the act of pouring it down the sink.

  **Elena:** That's the trap. That's the dynamic inconsistency that ruins everyone. You're looking at the node. You need to look at the tree.

  **Greg:** I *am* looking at the tree. But the branches that led to this million dollars are already harvested. I'm standing on the stump. My view—Constrained Maximization—suggests that by forming the intention yesterday, I entered a specific normative relationship with my past self. I owe it to him.

  **Elena:** "Owe it to him." There it is. You're smuggling in a deontological ghost to save your consequentialism. You're saying there's a *new* reason that didn't exist yesterday. A "fidelity cost."

  **Greg:** It's not a ghost. It's a disposition. To be the kind of agent who can secure this million, I must be the kind of agent whose intentions are binding. If I don't drink, I prove I'm not that kind of agent. The pain of the toxin is the price of maintaining the disposition that made the money possible.

  **Elena:** But that's exactly where we differ. I don't need to maintain a disposition. I don't need to conjure up a "fidelity cost." I just need to be resolute. Yesterday, the plan "Intend → Drink → Get Money" had higher expected utility than "Intend → Don't Drink → No Money." Today, I simply execute the plan. The rationality is in the *continuity of the agency*, not in a new psychic penalty for breaking faith.

  **Greg:** But *why* continue? If you strip away the "fidelity cost"—the psychological pain of breaking a commitment to yourself—what's left? Just the physical pain of the toxin. If you're a pure consequentialist, Elena, and you admit there's no *new* reason, then at 11:53 AM, your own theory should tell you to dump the vial. The plan is already successful. Deviating saves you pain.

  **Elena:** No, because the unit of evaluation isn't the act. It's the plan. If you allow agents to re-evaluate at every node, you make them vulnerable to exploitation. You become a "sophisticated chooser" who anticipates their own weakness and therefore can't even form the intention yesterday. Resolute choice says: *Rationality requires you to ignore the local calculation.*

  **Greg:** "Ignore the local calculation." That sounds like an instruction to be irrational by standard definitions. My view is cleaner: The local calculation *changes*. Because I formed the intention, the cost of *not* drinking goes up. I add the "violation of commitment" to the ledger. Pain of Toxin vs. Pain of Self-Betrayal. If the Self-Betrayal hurts more, I drink.

  **Elena:** And there is the divergence. Suppose I don't feel self-betrayal. Suppose I'm cold-blooded. I know that if I don't drink, I'm being dynamically inconsistent, but I don't *feel* bad about it. There's no psychic penalty. According to you, Greg, I shouldn't drink. The physical pain outweighs the zero psychic pain.

  **Greg:** Precisely. If you can't cultivate the disposition where breaking a commitment feels costly, you *cannot* rationally take the billionaire's offer in the first place. You'd be lying to yourself yesterday. You'd know you wouldn't drink, so you couldn't form the intention, so you wouldn't get the money. My theory demands you be a certain *type of person* before you walk into the room.

  **Elena:** But that makes rationality dependent on psychology. It makes it contingent. My view says rationality is structural. Even if you're cold-blooded, even if you feel no guilt, it is still *irrational* to deviate from an optimal plan. The recommendation is: Drink. The reason is: Because it was part of the optimal strategy. Not because it hurts your feelings to stop.

  **Greg:** But that's empty normativity. You're telling a cold-blooded agent to do something that reduces their utility *ex-post*, with no compensating *ex-post* reason. You're asking them to be a martyr to the "Plan." Why should they care about the Plan *now*?

  **Elena:** Because the "Plan" isn't a separate entity. It's their own agency extended through time. If you cut your agency into time-slices, you're not a person; you're a sequence of strangers. If I treat my future self as a stranger who can renegotiate, I undermine my capacity to act at all. I don't need "guilt" to bind me. I need *will*.

  **Greg:** Will isn't a reason, Elena. It's a force. Philosophy is about reasons. If I ask, "Why should I drink?" and you say, "Because you decided to," I ask, "Why does that decision bind me when the consequences have changed?" If your answer is "Because rationality says so," you've just posited a brute norm. My answer is "Because being a person who ignores their own decisions makes you worse off in the long run." I ground the reason in the *outcome* of having that disposition.

  **Elena:** And I ground it in the *structure* of choice. But let's push your "fidelity cost." Imagine the toxin is agonizing. Agonizing enough that even a committed person would find the pain greater than the "guilt" of breaking a promise to themselves.

  **Greg:** Then they shouldn't drink. And crucially, they shouldn't have taken the deal.

  **Elena:** But the deal was profitable! The money was worth it *ex-ante*. If the pain is high, but the money is higher, the plan is optimal. If you say "Don't drink" because the guilt isn't strong enough, you're saying the agent *fails* to get the money because they lack the right psychology.

  **Greg:** I'm saying they lack the *capacity* to be a Constrained Maximizer. Not everyone can play this game.

  **Elena:** That's a limitation I don't accept. Resolute choice says: If the plan is optimal, stick to it. Period. Even if the pain is high. *Especially* if the pain is high, because that's when local calculation tempts you most. My theory recommends drinking in cases where your theory recommends quitting.

  **Greg:** Wait. If the pain is so high that it outweighs the guilt of breaking faith, my theory says the *intention itself was irrational to form*. You can't intend to do something you won't do. So we agree: Don't take the deal.

  **Elena:** No, we don't. Suppose I know I can force myself. I know I have the willpower to endure the pain, but I know I won't feel "guilt" if I don't. I just won't do it. I'm a resolute chooser, not a guilt-driven one.
  *Here is the hard case:* The pain is 80 units. The money is 100 units. The "guilt" of breaking a promise to myself is only 10 units.
  **Greg:** 80 pain > 10 guilt. Net loss to drink. I say: Don't drink. And since you're transparent to yourself, you couldn't have formed the intention yesterday. You walk away with zero.
  **Elena:** I say: Drink. The plan yielded +20 utility (100 - 80). The local loss is irrelevant. I get the +20. You get zero. My theory outperforms yours.

  **Greg:** But how do you motivate the drink at 11:53 AM? You've admitted there's no *reason* available now. The money is there either way. The pain is real. The guilt is negligible. You're just... suffering. For what? For the sake of consistency? That's fetishizing the plan.

  **Elena:** It's not fetishizing. It's recognizing that the *source* of the million dollars wasn't the prediction. It was the *capacity to bind*. The prediction just tested for it. If I renege, I prove I lacked the capacity, but I still have the money. Wait... if I have the money already, why does it matter?

  **Greg:** Exactly! That's the puzzle! If the money is already in the bank, your "capacity to bind" has already paid off. You've been tested and passed. The machine read your mind yesterday. Why poison yourself *now*?

  **Elena:** Because if I reason that way, I couldn't have passed the test yesterday! If I knew I'd reason that way today, the machine would have predicted I wouldn't drink, and I wouldn't have the money.

  **Greg:** But I *do* have the money! We both do! Look at the phone. The test is over. The machine isn't watching us now. This is the "Afternoon Problem." Gauthier solves this by saying the disposition must be stable. I must drink to maintain the disposition for *future* opportunities.

  **Elena:** Aha! So you *do* need a forward-looking reason. You're not drinking for the past self. You're drinking for the *next* billionaire.

  **Greg:** Essentially. If I pour this out, I weaken my disposition. Next time, I won't get the money.

  **Elena:** But what if there is no next time? What if the billionaire says, "This is a one-off. I'm leaving the planet." And suppose you know you'll never face a transparency test again.
  *Greg pauses. He looks at the vial.*
  **Greg:** If I know, with certainty, that my disposition will never be tested again... then the forward-looking utility of maintaining the disposition is zero. The only remaining cost is the toxin.
  **Elena:** And the "guilt"?
  **Greg:** If I'm truly alone in the universe, with no future interactions... the guilt might fade.
  **Elena:** Then you won't drink.
  **Greg:** ...Probably not.
  **Elena:** Then your theory collapses into standard instrumental rationality in the one-shot case. You only drink to signal to *others* (or future scenarios).
  **Greg:** Not necessarily. I still owe it to *myself*.
  **Elena:** But you just admitted the "guilt" might fade if there's no future utility to the disposition. That means the "reason" was instrumental all along. It wasn't a "backward-looking reason owed to your earlier self." It was a "forward-looking investment in your character."

  **Greg:** Is there a difference? If I invest in my character, I am treating my past intention as a binding contract.
  **Elena:** A contract needs enforcement. Your enforcement is "future loss of opportunities." Mine is "rational necessity."
  **Greg:** But in this "One-Off Universe" case, your "rational necessity" tells me to suffer 80 units of pain for *no purpose*. The money is safe. The test is done. No one will know. My disposition won't be tested again. Why drink?

  **Elena:** Because if you don't, you admit that you are not a temporally extended agent. You admit you are a series of time-slices. If you are a person, you stick to your guns.
  **Greg:** That sounds like honor, not rationality.
  **Elena:** Rationality *is* the honor code of the self.

  *Silence stretches. The clock hits 11:58 AM.*

  **Greg:** Here's the worry, Elena. If your view doesn't rely on the "cost of breaking," then it can't explain *why* an agent would ever deviate. If it's always irrational to deviate from an optimal plan, then weakness of will is impossible. It's just irrationality.
  **Elena:** Correct.
  **Greg:** But my view explains weakness. I might fail to cultivate the disposition. Or the guilt might be too weak. I allow that sometimes, it *is* rational to pour the vial out—if the cost of the toxin exceeds the cost of the broken commitment.
  **Elena:** And that's why you'll end up poorer than me. In the marginal cases, where the pain is high but the money is higher, you'll flinch. You'll calculate the "guilt," find it wanting, and dump the drink. I won't calculate. I'll drink.
  **Greg:** But if the pain is *torture*, Elena? If the toxin kills you slowly over a week?
  **Elena:** ...Then the plan wasn't optimal ex-ante.
  **Greg:** So you *do* re-evaluate?
  **Elena:** No. I acknowledge that a plan involving death for a million isn't optimal. But if the plan *was* optimal—say, pain is bearable, money is huge—then I drink. You... you might talk yourself out of it if your "guilt meter" is low.
  **Greg:** Because my "guilt meter" tracks the actual normative force! If I don't feel bound, I'm not bound. You're just forcing yourself to follow a rule that has lost its grip.

  *Greg picks up the vial. His hand shakes.*

  **Greg:** I'm drinking.
  **Elena:** Why?
  **Greg:** Because I want to be the kind of person who drinks. Not because the plan says so. Because I want to *be* him.
  **Elena:** And I'm drinking because the plan says so. I don't care who I *am*. I care about what I *do*.

  *They both uncork the vials.*

  **Elena:** We agree on the action.
  **Greg:** But we disagree on the agent. You think the agent is a planner. I think the agent is a community of selves across time.
  **Elena:** And if the selves disagree?
  **Greg:** Then they negotiate. And sometimes, the present self vetoes the past self.
  **Elena:** And that veto is what leaves money on the table.

  *They clink the glass vials together.*

  **Greg:** To the past self.
  **Elena:** To the plan.

  *They drink. Both wince. Greg looks relieved, as if he's paid a debt. Elena looks grim, as if she's executed a maneuver.*

  **Greg:** (Wheezing) You know... in the "One-Off Universe" case... I still think I'd pour it out.
  **Elena:** (Wheezing) And that... is why you're a Constrained Maximizer... and I'm a Resolute Chooser.
  **Greg:** Meaning?
  **Elena:** Meaning... you need the world to hold you accountable. I only need... myself.
  **Greg:** Or maybe... you're just more stubborn.
  **Elena:** Or maybe... rationality is just... stubbornness with a calculator.

  *They sit in silence as the pain sets in, watching the banking app, wondering if the difference was real, or just two ways of describing the same swallow.*
