      4.  The DCT Escape Route (Voluntarism & Modified DCT).
      5.  Conclusion (Who wins?).

      *Wait, one nuance:* Socrates distinguishes between the *essence* (ousia) and the *affection* (pathos). Being loved is a *pathos*. Piety is an *ousia*. This is crucial. I need to make sure this distinction is clear in the reconstruction.

      *Also, the friend's specific point:* "gods' own nature or shared preferences." This points to the idea that the *reason* for love is internal to the gods, not an external Form. Socrates assumes the reason is external (the Form of Piety). This is the gap.

