answer: |-
  This is one of the best "gotcha" moments in the history of philosophy, and you have hit on exactly why historians love to hate on Hobbes's math skills. It is deeply ironic that the man who demanded absolute certainty in political reasoning spent the last quarter-century of his life defending a mathematical impossibility.

  To answer your question, we need to separate Hobbes from the "Continental Rationalists" (like Descartes and Spinoza) and then look at whether the Wallis feud breaks his system or accidentally proves it.

  ### 1. Hobbes's Geometry vs. The Broader Rationalist Trend

  You are right that Spinoza, Descartes, and Leibniz all loved geometry. But **why** they loved it differs fundamentally from Hobbes.

  **The Continental Rationalists (Descartes, Spinoza):**
  *   **Metaphysics First:** For them, geometry works because the human mind is built in the image of God (or Nature). We have *innate ideas*. When we do geometry, we are uncovering eternal truths that exist independently of us.
  *   **Discovery:** Geometry is a tool to *discover* the structure of reality.
  *   **Spinoza's Ethics:** When Spinoza writes *Ethics* in "geometrical order" (Axioms, Propositions, Proofs), he is claiming that human emotions and morality follow necessary laws just like lines and angles do. It is a claim about the *universe*.

  **Hobbes's Materialist/Nominalist Geometry:**
  *   **Construction, Not Discovery:** Hobbes is a **nominalist**. He doesn't believe in abstract "Forms" or innate ideas. For Hobbes, a circle doesn't exist in the sky; it exists because a human drew it.
  *   **We Know What We Make:** Hobbes argues we can have certainty in geometry (and politics) **only because we are the creators of the objects.**
      *   *In Physics:* God made the world. We can't know the "true causes" of nature with certainty because we didn't build the universe. We can only hypothesize.
      *   *In Geometry:* We define the point, the line, and the circle. We stipulate the rules. Therefore, we can know the consequences with 100% certainty.
      *   *In Politics:* This is the kicker. Hobbes argues Civil Philosophy (*Leviathan*) can be certain **because we make the Commonwealth.** Just as we construct a circle, we construct a Sovereign through the Social Contract. Because we defined the terms of the agreement, we can deduce the obligations with geometric certainty.

  **The Difference:** For Spinoza, geometry describes God's mind. For Hobbes, geometry describes **human language and construction.** Hobbes isn't looking for divine truth; he is looking for *computational* truth. He famously defined "Reason" not as a spark of divinity, but as "Reckoning" (adding and subtracting the consequences of names).

  ### 2. The Wallis Feud: Does it Undercut His Philosophy?

  John Wallis (the Savilian Professor of Geometry at Oxford) spent decades politely but ruthlessly dismantling Hobbes's claims. Hobbes responded with insults, accusations of conspiracy, and reprinted editions of his errors.

  Does this humiliation destroy his claim to certainty?

  **The Surface Level: Yes, it makes him look delusional.**
  If your entire philosophical brand is "I have found a method for absolute certainty that ends dispute," and you spend 25 years refusing to accept a proof that you are wrong, you look like a dogmatist, not a scientist. It suggests his ego was stronger than his method.

  **The Deeper Level: It is weirdly consistent with *Leviathan*.**
  Here is the dark, fascinating twist: The Wallis feud actually mirrors Hobbes's political theory.

  **A. The Rejection of Disputation**
  In *Leviathan*, Hobbes argues that endless debate is the precursor to Civil War. If everyone gets to argue about what "Justice" or "Property" means, society collapses.
  *   **Political Solution:** You need a **Sovereign** to define the terms. Once the Sovereign speaks, debate ends.
  *   **Mathematical Application:** In his feud with Wallis, Hobbes essentially tried to act as his own Sovereign. He believed that because *he* had defined the terms of his geometric construction, Wallis had no authority to overrule him. To Hobbes, Wallis wasn't proving him wrong; Wallis was engaging in "vain philosophy"—empty disputation that threatens order.

  **B. Definitions as Authority**
  Remember Hobbes's view: Geometry is certain because we control the definitions.
  Hobbes genuinely believed Wallis was cheating by using *different definitions* of magnitude or proportion. In Hobbes's mind, if you accept *his* definitions, his proof works.
  *   **The Consistency:** This aligns with his view of Law. Law isn't "true" because it matches nature; it is true because the Sovereign commanded it. Similarly, Hobbes treated his geometric definitions as sovereign commands. If you don't accept the conclusion, you are in rebellion against the definitions.

  **C. The Danger of the System**
  The Wallis incident highlights the fatal flaw in Hobbes's quest for certainty.
  *   If certainty relies on **definitions**, who controls the definitions?
  *   In *Leviathan*, the Sovereign controls them.
  *   In *De Corpore*, **Hobbes** wanted to control them.

  By refusing to yield to Wallis, Hobbes demonstrated that his system relies heavily on the **infallibility of the definer.** If the definer (the Sovereign, or Hobbes himself) is stubborn or wrong, the "certainty" of the system becomes a tool for enforcing error rather than discovering truth.

  ### Summary for AP Euro Context

  If you need to use this in an essay or discussion:

  1.  **Distinction:** Unlike Spinoza (who used geometry to show how God/Nature determines human emotion), Hobbes used geometry as a model for **human construction**. We know politics with certainty because we *build* the state, just as we build a geometric figure.
  2.  **The Irony:** The Wallis feud shows the limit of this model. Hobbes treated mathematical proof like political authority: he demanded submission to his definitions rather than submitting to external verification.
  3.  **The Takeaway:** Hobbes's philosophy prioritizes **Order over Truth.** He would rather have a certain, enforced conclusion (even if wrong) than an endless, chaotic debate (even if it leads to truth). The Wallis feud proves that Hobbes was willing to sacrifice mathematical truth to avoid the "chaos" of admitting he was wrong.

  It's the ultimate "Hobbesian" move: He declared himself the Sovereign of the Circle, and excommunicated anyone (like Wallis) who said the math didn't add up.
