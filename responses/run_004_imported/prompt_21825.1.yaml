          *   *Marcus:* Argues Expected Value (EV). Even with wide error bars, the sheer scale of the housing crisis means the zoning bet has higher EV. Claims tutoring also has long-term unpredictable cascades.
          *   *Dana:* Argues "Cluelessness" (philosophical term). It's not just risk (known probabilities); it's model uncertainty (don't know the causal mechanisms or sign of the effect). Upzoning could backfire (displacement, backlash). Claims this is categorically different from the tutoring uncertainty.
      *   **Requirements:**
          *   Give an actual bottom line (Fund A, Fund B, Split, or Other).
          *   Engage deeply with Dana's "cluelessness" argument (is it distinct from risk? Does it paralyze decision-making?).
