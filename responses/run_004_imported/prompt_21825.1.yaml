  2.  **Deconstruct the Philosophical Core (Cluelessness vs. Risk):**
      *   *Risk:* Known outcomes, known probabilities (e.g., rolling a die).
      *   *Uncertainty (Knightian):* Known outcomes, unknown probabilities.
      *   *Cluelessness (Hilary Greaves et al.):* We don't even know the *structure* of the consequences, especially long-term indirect effects. The "sign" of the impact might be unknowable.
      *   *Marcus's Point:* Long-term effects of tutoring are also clueless (does a higher test score lead to a better life? Does a better life lead to good societal outcomes?). If we accept Dana's view, we can't fund *anything*.
      *   *Dana's Point:* The causal chain for zoning is much more brittle and contested *in the near term* than tutoring. The feedback loops are complex systems vs. individual intervention.
      *   *Resolution:* Dana is right that the *type* of uncertainty differs, but Marcus is right that "cluelessness" shouldn't lead to paralysis. The distinction matters for *how* we evaluate, not *whether* we evaluate. We need a framework that accounts for "robustness" rather than just "expected value."

