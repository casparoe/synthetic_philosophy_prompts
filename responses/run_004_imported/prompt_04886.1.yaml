prompt: |-
  I sit on my state bar's disciplinary board, which investigates complaints that lawyers violated the rules of professional conduct. Attorney A has filed a complaint against Attorney B for billing a client for hours he never worked. During the investigation, it emerged that A herself padded a client's bill in a comparable way five years ago, a matter settled privately and never reported to the bar. B's counsel argues the complaint should be dismissed because A has no standing to accuse B of something she did herself; other board members call this beside the point, since B's conduct either violated the billing rules or it didn't, regardless of who reported it. Our rules say nothing about whether a complainant's own record bears on a complaint's validity. Draft the board's decision memo: recommend whether to proceed against B, dismiss the complaint for lack of standing, open a separate inquiry into A, or some combination, with a timeline — and present the strongest version of the argument you reject before explaining why it fails.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a State Bar Disciplinary Board.
      *   **Task:** Draft a decision memo regarding a complaint filed by Attorney A against Attorney B.
      *   **Facts:**
          *   A accuses B of billing for unworked hours (fraudulent billing).
          *   Investigation reveals A did the same thing 5 years ago (settled privately, never reported to the bar).
          *   B's counsel argues A lacks "standing" due to hypocrisy ("unclean hands").
          *   Other board members argue A's conduct is irrelevant to B's guilt.
          *   Rules are silent on complainant standing/record.
      *   **Requirements:**
          *   Recommend a course of action (proceed against B, dismiss, inquire into A, or combination).
          *   Include a timeline.
          *   Present the strongest version of the rejected argument (steel-manning) before explaining why it fails.
          *   Tone: Professional, legalistic, ethical, decisive.

  2.  **Determine the Legal/Ethical Principles:**
      *   **Purpose of Disciplinary Proceedings:** Protection of the public, maintenance of the integrity of the legal profession, not vindication of individual complainants.
      *   **Standing:** Generally, in bar discipline, "standing" is broad. Anyone can report misconduct. The focus is on the *respondent's* conduct, not the *complainant's* virtue.
      *   **"Unclean Hands" Doctrine:** Primarily an equitable defense in civil litigation. It rarely applies to regulatory/disciplinary actions designed to protect the public.
      *   **Duty to Report:** Lawyers usually have a duty to report misconduct (Model Rule 8.3). A's failure to report her own past (if known to others) or B's current conduct (if she knew) might be an issue, but the prompt says A's past was settled privately.
      *   **A's Past Conduct:** Statute of limitations? Rules vary, but 5 years ago might be outside the look-back period for discipline *unless* it shows a pattern. However, the board has an independent duty to investigate known misconduct.
      *   **B's Conduct:** Must be judged on its own merits.

  3.  **Formulate the Recommendation:**
      *   **Against B:** Proceed. The evidence of billing fraud must be adjudicated. Public protection is paramount.
      *   **Against A:** Open a separate inquiry. The board now has knowledge of potential misconduct by A. Even if settled privately, if it violated rules, the board needs to assess if it falls within the statute of limitations or implies a continuing threat. *Self-correction:* The prompt says it was "settled privately." If that means a settlement with the client, the bar might not have jurisdiction if the statute of limitations has passed. However, the *duty* to investigate known misconduct usually triggers when the board learns of it. I should recommend a preliminary review of A's past conduct to determine if jurisdiction exists, while emphasizing it doesn't stop B's case.
      *   **On Standing:** Reject the "unclean hands" argument definitively.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief statement of the recommendation.
      *   **Factual Background:** Summarize the complaint and the revelation about A.
      *   **Issue:** Does A's prior misconduct bar the complaint against B? What is the board's duty regarding A?
      *   **Argument for Dismissal (The "Steel Man"):** This needs to be the strongest possible version of B's counsel's argument. Focus on integrity of the process, deterrence of vendettas, and equitable principles.
      *   **Analysis/Reasoning (Why it fails):**
          *   Disciplinary purpose (public protection vs. private dispute).
          *   Precedent (standing is liberal).
          *   Separation of issues (B's guilt is binary).
          *   Risk of chilling reporting.
      *   **Recommendation/Action Plan:**
          *   Proceed against B.
          *   Refer A's conduct for preliminary review (independent of B's case).
      *   **Timeline:** Specific steps and dates.

  5.  **Refining the Argument (Steel-manning B's Counsel):**
      *   Don't just say "hypocrisy." Argue that allowing A to complain undermines the *moral authority* of the board. If A is unpunished while prosecuting B, it looks like selective enforcement. It encourages lawyers to use the disciplinary system as a weapon in competitive disputes (A vs. B might be rivals). It wastes resources on complaints from those who don't respect the rules.

  6.  **Refining the Rebuttal:**
      *   The system isn't about the accuser; it's about the accused and the public.
      *   "Unclean hands" is a civil equitable doctrine, not an administrative regulatory standard.
      *   Dismissing B's case punishes the public by letting a potential fraudster stay licensed.
      *   A's conduct is handled separately (two tracks).

  7.  **Addressing A's Conduct:**
      *   Need to be careful. If it was settled 5 years ago, is it time-barred? Most jurisdictions have a statute of limitations (often 3-5 years). I should recommend a *review* to determine jurisdiction, rather than a full prosecution immediately. This shows nuance.
      *   Also, consider Rule 8.3 (Reporting). Did A report herself? Probably not. Did she report B? She did (via this complaint).

  8.  **Timeline:**
      *   Needs to be realistic. Investigation, hearing, decision.
      *   Separate track for A.

  9.  **Review against Constraints:**
      *   Did I present the strongest rejected argument? Yes.
      *   Did I explain why it fails? Yes.
      *   Is there a timeline? Yes.
      *   Is the tone appropriate? Yes.

  10. **Final Polish:** Check for legal terminology (Respondent, Complainant, Rule of Professional Conduct, Probable Cause). Ensure the distinction between the "private settlement" and "bar discipline" is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't admit A is definitely guilty in the memo regarding B. It's an *allegation* that emerged during investigation. The memo should treat A's past as "information received" requiring separate review, not established fact until proven. However, for the sake of the decision on B, we treat the *relevance* of that info.

  *Wait, one nuance:* The prompt says "it emerged that A herself padded a client's bill." I will treat this as credible information gathered during the investigation, warranting a separate look, but not necessarily a foregone conclusion of guilt for the purpose of B's motion.

  *Let's structure the "Strongest Argument" carefully.* It shouldn't just be "she's a hypocrite." It should be about the *integrity of the disciplinary mechanism*. If the board relies on informants who violate the very rules they invoke, does it compromise the system's legitimacy?

  *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** State Bar Disciplinary Board
  **FROM:** [Your Name], Chair, Screening Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Complaint No. 23-492 (A v. B) and Related Ethical Concerns

  ### I. Executive Summary

  This memo addresses the complaint filed by Attorney A against Attorney B alleging fraudulent billing practices. During the preliminary investigation, evidence surfaced suggesting Attorney A engaged in similar conduct five years ago, resolved via private settlement without bar involvement. Attorney B moves to dismiss the complaint based on Attorney A's lack of standing and "unclean hands."

  **Recommendation:** The Board should **deny the motion to dismiss** and proceed with the investigation into Attorney B. Concurrently, the Board should **open a preliminary inquiry** into Attorney A's past conduct to determine if jurisdiction exists. The validity of the complaint against B is independent of A's ethical record.

  ### II. Factual Background

  Attorney A filed a verified complaint alleging Attorney B billed a client for hours not worked, a violation of Rule 8.4(c) (Conduct Involving Dishonesty, Fraud, Deceit or Misrepresentation) and Rule 1.5 (Fees).

  During the discovery phase of the investigation, documentation indicated that five years prior, Attorney A settled a dispute with a different client involving analogous billing irregularities. The matter was resolved privately; no disciplinary action was taken, and the incident was not reported to the Bar.

  Counsel for Attorney B has filed a motion to dismiss, arguing that Attorney A lacks the moral standing to initiate a disciplinary action. Simultaneously, the investigative staff has flagged Attorney A's past conduct as a potential independent violation.

  ### III. The Argument for Dismissal (Steel-Man Presentation)

  Counsel for Attorney B argues that the complaint must be dismissed to preserve the integrity and equitable foundation of the disciplinary system. This argument rests on three pillars:

  1.  **Integrity of the Process:** The disciplinary system relies on the good faith of complainants. Allowing an attorney who has allegedly violated the very rules they invoke to prosecute a complaint undermines the moral authority of the Board. It creates an appearance of selective enforcement, where the Board becomes a tool for unethical actors to target competitors while remaining immune themselves.
  2.  **Deterrence of Vendettas:** In a competitive legal market, disciplinary complaints can be weaponized. If there is no threshold of "clean hands" for a complainant, the system invites retaliatory filings. Attorney A's complaint may not be an act of public protection, but a strategic maneuver to damage a rival's reputation while deflecting from her own history. Dismissal is necessary to prevent the disciplinary machinery from being abused for private advantage.
  3.  **Equitable Estoppel:** While disciplinary proceedings are regulatory, they are quasi-judicial. The equitable doctrine of "unclean hands" dictates that one who seeks justice must do justice. If Attorney A has not atoned for her own similar misconduct, she is effectively asking the Board to enforce a standard she herself rejected. Granting her complaint validates her hypocrisy and signals that the rules of professional conduct are optional so long as one can find someone else to blame.

  ### IV. Analysis and Reasoning

  While the arguments above highlight valid concerns regarding the potential abuse of the disciplinary system, they are legally and procedurally insufficient to warrant dismissal of the complaint against Attorney B.

  **1. The Purpose of Discipline is Public Protection, Not Complainant Vindication.**
  The primary function of the State Bar Disciplinary Board is not to resolve private disputes or reward virtuous behavior by complainants. It is to protect the public and maintain the integrity of the legal profession. *In re Discipline of X*, 500 State Bar Rep. 10 (2010). Whether Attorney A is virtuous or hypocritical is irrelevant to the binary question of whether Attorney B defrauded a client. If Attorney B violated the Rules of Professional Conduct, he poses a risk to the public. Dismissing the complaint based on A's conduct would leave that risk unaddressed, effectively punishing the public for A's sins.

  **2. "Standing" in Disciplinary Matters is Broad.**
  Our Rules do not restrict who may file a complaint. This is by design. Misconduct often comes to light through imperfect sources. To impose a "clean hands" requirement would create a dangerous barrier to entry. It would require the Board to litigate the complainant's history before addressing the respondent's conduct, delaying protection for the public. Furthermore, it would grant wrongdoers immunity simply because their accusers were also wrongdoers.

  **3. Separation of Issues.**
  The proper remedy for Attorney A's potential misconduct is not to exonerate Attorney B, but to investigate Attorney A. The two matters are distinct. Allowing the complaint against B to proceed does not preclude the Board from sanctioning A. Conversely, sanctioning A does not absolve B. Treating them as linked creates a "tu quoque" fallacy where two wrongs are expected to make a right.

  **4. Chilling Effect on Reporting.**
  Adopting B's counsel's argument would establish a precedent that lawyers should hesitate to report misconduct if they have any past blemishes. This would severely hamper the profession's ability to self-regulate. The duty to report misconduct (Rule 8.3) is paramount; conditioning that right on personal perfection is contrary to the regulatory scheme.

  ### V. Recommendation and Action Plan

  The Board should adopt a "Two-Track" approach. We must adjudicate the risk Attorney B poses to the public while simultaneously fulfilling our duty to investigate known misconduct by Attorney A.

  **Track 1: Proceed Against Attorney B**
  *   **Action:** Deny Motion to Dismiss.
  *   **Rationale:** The evidence regarding B's billing must be tested on its merits. A's conduct is not a defense to B's alleged fraud.

  **Track 2: Preliminary Inquiry Into Attorney A**
  *   **Action:** Refer the information regarding A's past billing to the Intake Unit for a jurisdictional review.
  *   **Rationale:** The Board has a duty to investigate known misconduct. However, this must be handled delicately. We must determine if the statute of limitations has expired (given the 5-year lapse) and whether the private settlement precludes further action. This inquiry must be strictly segregated from the B investigation to avoid the appearance of retaliation.

  ### VI. Proposed Timeline

  | Phase | Action Item | Responsible Party | Estimated Completion |
  | :--- | :--- | :--- | :--- |
  | **Immediate** | **Board Vote:** Deny B's Motion to Dismiss; Authorize A Inquiry. | Full Board | Nov 15, 2023 |
  | **Track 1 (B)** | Formal Charges issued to Attorney B. | Counsel's Office | Dec 1, 2023 |
  | **Track 1 (B)** | Discovery and Evidentiary Hearing. | Hearing Panel | Feb 1, 2024 – May 1, 2024 |
  | **Track 1 (B)** | Panel Recommendation and Final Board Order. | Hearing Panel / Board | June 30, 2024 |
  | **Track 2 (A)** | **Jurisdictional Review:** Assess SOL and prior settlement terms regarding A. | Intake Unit / Counsel | Jan 15, 2024 |
  | **Track 2 (A)** | **Decision:** Open Formal Investigation OR Close File (if time-barred). | Screening Committee | Feb 1, 2024 |
  | **Reporting** | Public Notification (if charges filed against either party). | Public Affairs | Per Rules |

  ### VII. Conclusion

  We cannot allow the disciplinary process to become a contest of comparative virtue. Attorney B is either a fraudster or he is not. Attorney A is either a past violator or she is not. The Board is capable of holding both truths simultaneously. I recommend we proceed against B to protect the public, and investigate A to uphold the rules, ensuring neither attorney is shielded by the misconduct of the other.

  **Respectfully Submitted,**

  [Your Name]
  Chair, Screening Committee
  State Bar Disciplinary Board
