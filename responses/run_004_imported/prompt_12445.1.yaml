answer: |-
  Good morning. For those who don't know me, I'm [Your Name].

  Looking around this room, I see two distinct worlds coming together. On one side, I see the colleagues who shared her intellectual life for forty years. You know her for her rigor, her publications, and her command of modal logic. On the other side, I see the family who knew her as Aunt [Name]. You know her for her sharp wit, her generosity, and the way she insisted on cutting the turkey exactly against the grain.

  It is a rare thing to be loved equally for one's heart and one's mind. She managed both.

  I know that for many of you in the family, the technical details of her work can feel like a distant language. But she didn't see them as separate. To her, logic wasn't just about symbols on a page; it was a way of caring about the truth. And nowhere was this clearer than at our family dinners. For decades, amidst the clatter of silverware, she would hold forth on her favorite topic: Gödel's ontological proof.

  Now, I know what the headlines say. Every few years, a story circulates online: "Computer Scientists Prove God Exists." She would see that headline and sigh. She told me once that if she heard that phrase one more time, she might retire early.

  She wanted me to make sure you understand what actually happened. In 2013, researchers did use a computer to verify Gödel's argument. But the computer only confirmed that the argument was *valid*—that the conclusion follows from the premises. It did not confirm that the premises were *true*. To her, that was the whole point. Logic can tell you if you're being consistent, but it cannot tell you if you're starting with reality. She loved that distinction. She loved the elegance of the proof, but she remained, to the very end, an atheist. She did not find God in the axioms, and she did not find God at the end of her life. She found wonder in the world exactly as it was, contingent and uncertain.

  She had little patience for the old objection that "existence is not a predicate." She thought that was too easy. Her objection was far more profound. She focused on what is called the "modal collapse."

  For the logicians here, you know the problem: Gödel's axioms seem to entail that every truth is a necessary truth. If the proof works, nothing could have been otherwise. The coffee cup on this table, the rain outside, this gathering—it would all be inevitable.

  But she didn't believe that. She believed in the accidental. She believed in the contingent. She believed that we are here by chance, and that is what makes our time together precious. If everything were necessary, there would be no choice, and there would be no love. She cherished the fact that our lives are not logically forced. We are here, for a brief moment, and then we are not. That fragility was not a bug to her; it was the feature.

  She asked me to ensure this argument never became a punchline. To her, Gödel's proof was a masterpiece of human thought, even if it failed. It was an "elegant failure." She respected the attempt to reach for the ultimate truth, even if she knew the ladder didn't quite reach the roof. She taught us that you can admire the beauty of a question without accepting the comfort of a false answer.

  That was her gift to all of us, whether we were her students or her nieces and nephews. She taught us to ask: "What are your premises?" She taught us that clarity is a form of kindness. When we are grieving, it is tempting to accept comforting uncles. But she would want us to be clear. She is gone. We will not see her again. That is a necessary truth of biology, if not of logic.

  But while she was here, she was fully present. She listened to us. She corrected us when we were wrong, but always with the goal of making us sharper, better, and more honest.

  To her colleagues: Thank you for challenging her, for debating her, and for being the community she loved so well.
  To her family: Thank you for loving her even when she explained modal operators over dessert.

  She left us with a legacy of intellectual honesty and deep, quiet love. She showed us that a life without certainty can still be a life of profound meaning. We don't need a proof to know she mattered. We know it because we are here, gathering in her memory, contingent and grateful for the time we had.

  Rest well, Aunt [Name]. The argument is over, and you were right.
