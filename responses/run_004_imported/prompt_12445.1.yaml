prompt: |-
  My aunt, who taught modal logic for almost forty years, died ten days ago, and I've been asked to give her eulogy at a service split between a handful of her old logic-department colleagues and a much larger extended family who have never heard of a modal operator. She was an atheist to the end, but her favorite thing to hold forth on at family dinners for decades was Gödel's ontological proof — not because she believed its conclusion, but because she thought it was one of the most elegant failures in the history of logic. She had little patience for the standard 'existence is not a predicate' complaint, and much more for the modal collapse problem: the fact that Gödel's own axioms seem to entail that every truth whatsoever is a necessary one. She also relished pointing out that the 2013 story about computer scientists running the proof through an automated theorem prover — which resurfaces every so often under headlines like 'computer scientists prove God exists' — only ever showed that the argument was valid, never that its premises were true, which was, to her, the whole point. Before she died she told my mother two things the eulogy must not do: it must not imply she found God at the end, and it must not turn her favorite argument into a punchline. Could you write it? About five minutes read aloud, genuinely comforting to a room that is mostly not philosophers, and precise enough that her old colleagues don't wince.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt, taught modal logic for ~40 years, atheist.
      *   **Audience:** Split between logic department colleagues (experts) and extended family (laypeople).
      *   **Key Themes/Interests:** Gödel's ontological proof (loved it as an "elegant failure"), disliked "existence is not a predicate" objection, focused on "modal collapse" (all truths become necessary), clarified the 2013 automated theorem prover story (validity $\neq$ truth).
      *   **Constraints:**
          *   Must not imply she found God at the end (she was an atheist to the end).
          *   Must not turn her favorite argument into a punchline (treat it with respect).
          *   Length: About 5 minutes read aloud (approx. 750-900 words).
          *   Tone: Genuinely comforting for family, precise enough for colleagues.

  2.  **Determine the Tone and Structure:**
      *   **Tone:** Warm, respectful, intellectually honest but accessible. It needs to bridge the gap between the technical and the personal.
      *   **Structure:**
          *   Opening: Acknowledge the loss, welcome both groups (family and colleagues).
          *   Middle 1 (The Work): Address her passion for logic, specifically Gödel's proof, explaining it simply but accurately.
          *   Middle 2 (The Lesson): Connect the logic to her character/life philosophy (rigor, clarity, questioning premises).
          *   Middle 3 (The End): Address her atheism gently but firmly (respecting her wishes).
          *   Closing: A final farewell that resonates with both groups.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start with the shared grief. Acknowledge the two worlds she inhabited.
      *   **The Logic (The Tricky Part):** How to explain Gödel's Ontological Proof to grandma without boring the logicians?
          *   *Idea:* Focus on the *structure* of the argument rather than the symbols.
          *   *Key point:* She loved it not because it worked, but because it was beautiful but flawed.
          *   *Specifics:* Mention "modal collapse." This is the shibboleth for the colleagues. Explain it to family as "if this were true, everything would be inevitable."
          *   *Specifics:* Mention the 2013 computer story. Clarify validity vs. truth. This is crucial for her legacy.
      *   **The Character:** How did her love for logic translate to life? She valued clarity. She didn't accept things just because they were comforting. She loved the *search* for truth, not just the answer.
      *   **The Atheism:** Needs to be handled delicately. No "she's in a better place." Instead, "she found wonder in the world as it is."
      *   **The Closing:** Bring it back to love and memory.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My aunt was a logician. She loved Gödel's proof. Family, don't worry, I'll explain. She thought it was elegant but wrong. Specifically, modal collapse. Computers checked it, but that just means the math works, not that God exists. She didn't believe in God. She wanted us to know that. But she taught us to think clearly. We will miss her.

      *Critique 1:* Too dry. Needs more warmth. Needs to be longer (5 mins). Needs to weave the technical bits into the emotional narrative.

  5.  **Drafting - Iteration 2 (Fleshing out the narrative):**
