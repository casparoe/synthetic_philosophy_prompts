prompt: |-
  Watched a documentary about the heat death of the universe last night and now I've got this 3am thought I can't shake: there was already an infinite stretch of time before I was born and it doesn't bother me one bit, but thinking about the infinite stretch after I die kind of terrifies me, even tho it seems like the exact same kind of nothing either way. My friend says that's just inconsistent of me. My other friend says I shouldnt worry about being dead anyway since I wont be around to feel bad about it, but that answer somehow makes me feel worse instead of better and I can't work out why. Am I just being irrational here, or is there an actual difference between the two kinds of non-existing that would justify freaking out about one and not the other? Please actually dig into the reasoning instead of just telling me to live in the moment.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Issue:** The user is experiencing existential anxiety (specifically about death/non-existence) triggered by a documentary on heat death.
      *   **The Paradox:** They are fine with the infinite time *before* they were born (pre-natal non-existence) but terrified of the infinite time *after* they die (post-mortem non-existence).
      *   **Friends' Advice:**
          *   Friend 1: "You're being inconsistent." (Logical critique)
          *   Friend 2: "You won't be around to feel bad." (Epicurean argument) -> This makes the user feel *worse*.
      *   **Request:** Don't just say "live in the moment." Dig into the reasoning. Is there an actual difference, or is it irrational? Why does Friend 2's advice backfire?

  2.  **Deconstruct the Philosophical Problem:**
      *   This is a classic philosophical problem known as the **Symmetry Argument** (or Lucretius' Symmetry).
      *   *Lucretius:* "Look back at the eternity that passed before we were born, and mark how utterly it counts to us as nothing. This is a mirror that nature holds up to us, in which we may see the time that shall be after we are extinct."
      *   *The User's Intuition:* Despite the logic, the *feeling* is asymmetric. Why?

  3.  **Address Friend 1 (Inconsistency):**
      *   Is it logically inconsistent? Yes, technically. The state of "not existing" is identical in both cases.
      *   Is it *psychologically* inconsistent? No. Human psychology is inherently forward-looking. We are teleological beings (goal-oriented).
      *   *Key Insight:* The asymmetry isn't in the *state* of non-existence, but in the *relationship* to existence.

  4.  **Address Friend 2 (Epicurean Argument):**
      *   *Argument:* "Death is nothing to us." (If you are, death isn't; if death is, you aren't).
      *   *Why it fails for the user:* It invalidates the *current* grief of loss. It feels dismissive. It highlights the erasure of the self. Telling someone "you won't care" emphasizes that "you" will be gone. It triggers a fear of obliteration, not a fear of suffering.
      *   *Nagel's Counter:* Thomas Nagel argues that death is a deprivation. It's not about the experience of being dead, but the loss of the possibilities of life.

  5.  **Explore the "Actual Difference" (Justifying the Fear):**
      *   Are there objective differences between pre-birth and post-death nothingness?
      *   *Directionality:* Pre-birth is the *absence of a subject*. Post-death is the *termination of a subject*. We care about termination because we have established interests, projects, and attachments.
      *   *The "Story" Arc:* We view life as a narrative. Pre-birth is the blank page before the story starts. Post-death is the abrupt ending of the story. We care about how the story ends.
      *   *Entropy/Heat Death Context:* The documentary adds a layer. It's not just personal death, it's *cosmic* death. The erasure of all meaning. This amplifies the post-death anxiety because there's no legacy, no universe to remember you.

  6.  **Develop the Response Structure:**
      *   **Validation:** Acknowledge the depth of the thought. It's not just "irrational." It's a profound philosophical puzzle.
      *   **The Symmetry Argument (Lucretius):** Explain the logic your first friend is using. Acknowledge its logical soundness but emotional failure.
      *   **Why the Asymmetry Feels Real (Psychology & Phenomenology):**
          *   Projection vs. Termination.
          *   Loss of Potential (Deprivation Account).
          *   The "Self" as a trajectory.
      *   **Why Friend 2's Advice Backfires:**
          *   It focuses on the *experience* of death rather than the *fact* of loss.
          *   It feels like gaslighting the current self's attachment to the future.
      *   **The Heat Death Factor:** Specifically address the documentary trigger. Cosmic insignificance vs. personal significance.
      *   **Conclusion:** Synthesize. It's not irrational to feel the difference, even if the metaphysical state is the same.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Empathetic, intellectual, rigorous, not preachy.
      *   *Key Concept:* **The Deprivation Account of Death.** (Thomas Nagel). Death is bad because it deprives you of goods you would have otherwise experienced. Pre-birth didn't deprive you because "you" weren't there to be deprived.
      *   *Key Concept:* **Narrative Identity.** We are stories. A book doesn't mourn the pages before it started, but it mourns the last page.
      *   *Key Concept:* **Forward-Thrusting Consciousness.** We are biologically wired to predict and plan for the future. The future is our "habitat." The past is not.
      *   *Addressing Friend 2:* Explain *why* "you won't feel it" is scary. It confirms the annihilation. It's like saying "Don't worry about being erased, the blank page won't feel empty."

  8.  **Refining the "Heat Death" Aspect:**
      *   The user mentioned heat death. This implies the end of *everything*, not just them. This makes the "future nothingness" feel heavier. It's the end of the stage, not just the actor. Pre-birth had a stage waiting. Post-death (eventually) has no stage. This is a valid distinction in *context*, even if the *state* of the user is the same.

  9.  **Final Review against Constraints:**
