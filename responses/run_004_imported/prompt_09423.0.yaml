prompt: |-
  I did not expect to need actual philosophy for my job this year, but here we are. I'm an immunology professor, and back in the fall I got roped onto my university's Research Integrity Committee, which just got reactivated and given more teeth after -- well, you've probably seen the same headlines about manipulated data that I have, it feels like a new one breaks every few months. My actual first case landed on my desk two weeks ago, and it's a lot messier than the onboarding session made it sound.

  Short version: a postdoc in a cancer biology lab manipulated, and in a couple of spots outright fabricated, the quantification behind two of six figures in a paper (western blots and mouse tumor counts). Nobody disputes she acted alone or that the paper is getting retracted -- that part's easy. The fight is about the other three co-authors: the PI, an outside collaborator at another university who ran the statistical analysis on data as it was handed to him and never touched a raw blot, and a grad student whose own experiments in the same paper are totally clean. Our authorship policy just says authors "share responsibility for the accuracy and integrity of the reported work" and leaves it at that, which is not alot of help when the whole question is what that's even supposed to mean for three people who had no realistic way of knowing.

  Half the committee wants a finding only against the postdoc, with the other three simply asked to sign off on the retraction and otherwise cleared. The other half, led by our chair (she did a philosophy phd before moving into research administration), keeps insisting that co-authoring a paper is itself a joint act, not just four individual contributions stapled together, and that this creates a real, if lesser, form of shared responsibility that doesn't just reduce to who-knew-what -- she threw out some names, joint commitment, shared agency, Gilbert or Bratman or maybe both, I wrote it down wrong and don't have time to go chase down the actual texts before we reconvene a week from Monday. Could you draft the memo I'd actually bring to that meeting? I need a real recommendation on what, if anything, happens to the three non-fabricating co-authors, a rough timeline for next steps, and reasoning solid enough that the "only punish the person who did it" side of the room would have to actually engage with it rather than just being told they're wrong -- I think they've got a genuinely strong point, and I don't want the memo to just bulldoze past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Immunology Professor, new member of Research Integrity Committee (RIC).
      *   **Context:** Committee reactivated due to increased research misconduct headlines. First case involves a postdoc who manipulated/fabricated data in 2 of 6 figures (western blots, tumor counts). Paper is being retracted.
      *   **The Conflict:**
          *   *Side A:* Punish only the postdoc. Clear the PI, collaborator, and grad student (they didn't know/couldn't know).
          *   *Side B (Chair):* Co-authorship is a joint act creating shared responsibility regardless of specific knowledge. Cites philosophy of collective agency (Gilbert, Bratman).
      *   **Task:** Draft a memo for the next committee meeting (one week from Monday).
      *   **Requirements:**
          *   Real recommendation on what happens to the three non-fabricating co-authors.
          *   Rough timeline for next steps.
          *   Reasoning that engages with Side A's strong point (don't just bulldoze them), but supports a nuanced version of Side B's view.
          *   Tone: Professional, academic, persuasive, actionable, acknowledging the philosophical underpinnings without being overly abstract.

  2.  **Deconstruct the Philosophical/Policy Problem:**
      *   *The "Strict Liability" View (Side B/Chair):* Authorship = endorsement of the whole. If you sign your name, you vouch for the integrity. This aligns with ICMJE guidelines and many institutional policies.
      *   *The "Culpability" View (Side A):* Punishment requires intent or negligence. If they couldn't have known, punishing them is unjust and creates a culture of fear.
      *   *The Middle Ground (The Goal):* Distinguish between *responsibility* (obligation) and *culpability* (blame/punishment). One can bear responsibility for the record without being culpable for the fraud. This allows for sanctions that aren't punitive but are corrective/educational.

  3.  **Identify Key Philosophical Concepts (Gilbert/Bratman):**
      *   *Margaret Gilbert:* Joint Commitment. We form a "plural subject." If we publish together, we are collectively committed to the truth of the publication.
      *   *Michael Bratman:* Shared Intention/Shared Agency. We intend to do something *together*.
      *   *Application:* By listing themselves as authors, the PI, collaborator, and grad student entered a joint commitment to the integrity of the paper. They failed in that commitment, even if they didn't break it intentionally.
      *   *Nuance:* Failure of commitment $\neq$ Malice. It implies a need for restitution/correction, not necessarily career-ending punishment.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the purpose and the core recommendation.
      *   **Case Summary:** Briefly recap the facts (Postdoc fraud, 2/6 figures, others innocent of fraud).
      *   **The Core Question:** Define the tension (Individual Culpability vs. Collective Responsibility). Acknowledge Side A's validity (fairness).
      *   **Philosophical & Policy Framework:**
          *   Bring in the Chair's references (Gilbert/Bratman) but translate them into research integrity terms.
          *   Cite standard guidelines (ICMJE, COPE) to ground the philosophy in policy.
          *   *Key Distinction:* Responsibility vs. Culpability.
      *   **Recommendation:**
          *   Postdoc: Standard severe sanctions (termination, reporting to ORI/funder).
          *   PI: Administrative sanction (oversight failure), mandatory training, temporary bar on new grants/mentoring. *Why?* They hold the ultimate responsibility for the lab environment.
          *   Collaborator: Letter of correction/awareness, mandatory training on data verification. *Why?* Reliance on provided data is common, but verification protocols need tightening.
          *   Grad Student: Cleared of sanction, but required to attend integrity workshop. *Why?* Protect early career, but reinforce the "authorship = responsibility" lesson.
      *   **Rationale:** Explain *why* this split works. It validates Side A (no false accusations of fraud) and Side B (authorship isn't just a sticker).
      *   **Timeline:** Immediate retraction, notification, sanctions implementation, follow-up.
      *   **Conclusion:** Final persuasive push.

  5.  **Refining the Tone:**
      *   Needs to sound like it comes from a scientist (evidence-based, structured) but respects the philosophical input.
      *   Avoid jargon where possible, or explain it (e.g., explain "joint commitment" as "mutual vow").
      *   Ensure the recommendation is actionable. "Shared responsibility" can't just be a lecture; it needs concrete outcomes.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the PI sanction too harsh?
      *   *Fix:* Make it about *oversight*, not fraud. A temporary pause on mentoring is standard for lapse in supervision, distinct from misconduct.
      *   *Critique:* Is the philosophy too dense?
      *   *Fix:* Keep the Gilbert/Bratman references brief and focus on the *implication* (plural subject) rather than the theory itself.
      *   *Critique:* Did I address Side A?
      *   *Fix:* Explicitly state that Side A is correct about *intent*, but incomplete about *obligation*.

  7.  **Final Polish:** Check dates, ensure clear headings, make sure the "Timeline" is realistic. (e.g., Retraction notice takes time, journals move slowly).

  8.  *(Final thought)*: The user is an immunologist. They appreciate precision. The memo should be precise about the distinction between *misconduct* (the postdoc) and *negligence/lapse* (the PI/others).

  9.  **Constructing the Output:** (Proceeding to generate the memo based on these thoughts).

      *   *Subject:* Recommendations regarding Case [ID] – Co-Author Responsibility.
      *   *Key Concept:* "Stewardship vs. Malice."
      *   *Philosophy:* Use the "Joint Commitment" idea to justify why a signature matters, even without knowledge.

  10. **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation included? Yes.
      *   Timeline included? Yes.
      *   Reasoning engages Side A? Yes.
      *   Philosophy integrated? Yes.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee (RIC)
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendations regarding Case #2023-09: Co-Author Responsibility and Sanctions

  ### 1. Executive Summary

  This memo outlines a recommended resolution for Case #2023-09, involving data fabrication by a postdoctoral fellow. While the committee agrees on the findings against the primary bad actor, we remain divided on the status of the three non-fabricating co-authors (the PI, the external collaborator, and the graduate student).

  My recommendation is to adopt a **differentiated sanction model**. This approach validates the concern that punishing innocent parties for fraud is unjust, while simultaneously upholding the Chair's position that authorship constitutes a binding joint commitment to integrity. We must distinguish between *culpability for misconduct* (which lies solely with the postdoc) and *responsibility for stewardship* (which is shared).

  ### 2. Case Context and The Core Conflict

  **Facts:** A postdoc fabricated data in 2 of 6 figures. The paper is being retracted.
  **Dispute:** Should the PI, collaborator, and grad student face sanctions, or merely sign the retraction?

  *   **Position A (Individual Culpability):** Sanctions require knowledge or negligence. Since the co-authors could not reasonably have detected the fabrication, further sanctions are punitive and counterproductive.
  *   **Position B (Collective Responsibility):** Authorship is a joint act. By signing, co-authors enter a commitment to the work's integrity. A breach of that integrity implicates the collective, regardless of specific knowledge.

  Both positions hold merit. Position A protects researchers from being held hostage to a rogue colleague's actions. Position B protects the scientific record from becoming a system of "plausible deniability." The following recommendation attempts to synthesize these views.

  ### 3. Philosophical and Policy Framework

  The Chair's reference to **Margaret Gilbert's theory of Joint Commitment** and **Michael Bratman's Shared Agency** is pertinent here. In philosophical terms, a multi-author paper is not merely four individual contributions stapled together; it creates a "plural subject." When we list our names, we are not saying, "I vouch for my part"; we are saying, " *We* vouch for *this*."

  However, in policy terms (aligned with COPE and ICMJE guidelines), this joint commitment does not equate to strict liability for fraud. It equates to a duty of **reasonable stewardship**.

  Therefore, we can hold the co-authors responsible for the *failure of the collective warranty* without accusing them of *misconduct*. This allows us to impose corrective measures without imputing malice or gross negligence.

  ### 4. Recommendations

  I propose the committee vote on the following specific determinations:

  **A. The Postdoctoral Fellow (Primary Bad Actor)**
  *   **Finding:** Research Misconduct (Fabrication/Falsification).
  *   **Action:** Termination of employment; formal notification to funding agencies (e.g., ORI) and future employers per federal regulations.

  **B. The Principal Investigator (PI)**
  *   **Finding:** No Research Misconduct. However, **Lapse in Supervisory Stewardship.**
  *   **Rationale:** As the corresponding author and lab head, the PI holds the ultimate "joint commitment" to the lab's output. While they did not know, the fabrication of tumor counts and blots suggests a lack of primary data auditing protocols.
  *   **Action:**
      1.  Mandatory completion of advanced mentorship and data oversight training.
      2.  Temporary suspension (12 months) on serving as a primary mentor for new postdocs or grad students.
      3.  Requirement to implement a documented data-audit workflow for the lab before new grants are submitted.

  **C. The External Collaborator**
  *   **Finding:** No Research Misconduct. No Lapse in Stewardship.
  *   **Rationale:** Their role was statistical analysis of provided data. They lacked access to raw data and thus could not fulfill a verification duty.
  *   **Action:** Formal letter of notification. No sanction. They must sign the retraction notice clarifying their specific role to protect their own record.

  **D. The Graduate Student**
  *   **Finding:** No Research Misconduct. No Lapse in Stewardship.
  *   **Rationale:** Early-career researchers lack the authority to audit peers or PIs. Including them in sanctions creates a chilling effect on training.
  *   **Action:** Cleared. However, they must attend one departmental seminar on research integrity as an educational reinforcement of the "authorship = responsibility" principle for their future career.

  ### 5. Why This Synthesis Works

  This approach forces both sides of the committee to engage with the nuance rather than digging in:

  1.  **To Position A:** It acknowledges that **intent matters.** We are not labeling the PI or collaborators as "fraudsters." We are not putting them on a federal watchlist. We acknowledge they were victims of deception.
  2.  **To Position B:** It acknowledges that **signatures matter.** The PI faces real professional consequences (loss of mentoring privileges). This affirms that authorship is not an honorary title but an operational role with liabilities. It prevents the precedent that "I didn't know" is a total shield against administrative accountability.

  ### 6. Proposed Timeline

  *   **Week 1 (Oct 30):** Committee vote on this differentiated sanction model.
  *   **Week 2 (Nov 6):** Notification of findings to all four parties. (Legal Counsel to review letters to PI/Postdoc).
  *   **Week 3 (Nov 13):** Submission of Retraction Notice to Journal. (Drafted by Committee Chair and PI, explicitly stating fabrication by Postdoc only).
  *   **Month 1-3:** PI completes training and submits new lab data-audit protocol to RIC for approval.
  *   **Month 12:** Review of PI mentoring suspension for potential reinstatement.

  ### 7. Conclusion

  If we clear the co-authors entirely, we signal that authorship is merely a reward for contribution, not a guarantee of quality. If we sanction them as harshly as the fabricator, we signal that honesty is no defense against a colleague's crime.

  By distinguishing between *misconduct* and *stewardship*, we can uphold the integrity of the institution without sacrificing fairness. I recommend we move forward with the differentiated model outlined above.

  ***

  **Attachments:**
  *   *Draft Retraction Notice Language*
  *   *Summary of ICMJE Authorship Criteria*
  *   *Excerpt: Gilbert, M. (1990). "Walking Together: A Paradigmatic Social Phenomenon."*
