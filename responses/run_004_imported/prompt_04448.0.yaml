      *   **User Background:** Retired condensed-matter physicist, specialized in critical phenomena and finite-size scaling. This is crucial. I need to use analogies from statistical mechanics/phase transitions where appropriate, or at least respect the rigor of their physical intuition. They understand limits, non-analyticity, and scaling.
      *   **Current Interest:** Philosophy of language/logic, specifically vagueness and the Sorites paradox.
