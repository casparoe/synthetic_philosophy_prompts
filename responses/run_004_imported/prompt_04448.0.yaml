      *   **The Problem for Supervaluationism:** Supervaluationism posits a set of "admissible precisifications" ($\mathcal{A}$). This set draws a sharp line between admissible and inadmissible. But "admissibility" itself seems vague. If $\mathcal{A}$ is sharply defined, we've just pushed the vagueness back one step (from the predicate to the meta-predicate of admissibility).

  3.  **Address the Specific Question: Why is HOV worse for Supervaluationism than Epistemicism?**
