prompt: |-
  Next week's podcast guest defends Aumann's argument that common knowledge of rationality forces backward induction in the centipede game, and his stock reply whenever someone points out that real players almost never defect on the first move is that the observed cooperation is "performance error, not a counterexample to the norm." Draft eight interview questions that go beyond having him restate the argument: I want at least one question on the Binmore/Reny worry that reaching any later node in the tree already falsifies the common-knowledge-of-rationality assumption the argument depends on, leaving it unclear what a player is then entitled to believe about the opponent's future play; one on whether his conclusion needs an epistemic, dispositional notion of rationality rather than a purely behavioral one; one that uses the McKelvey–Palfrey experimental results to ask what, if anything, would count as evidence against the backward-induction norm; and one on whether common knowledge of rationality is even a coherent idealization once a game runs to more than two or three stages -- and for each question, add a follow-up keyed to the answer he's most likely to give.
