              2.  Epistemic/dispositional vs. purely behavioral rationality.
              3.  McKelvey–Palfrey experimental results (what counts as evidence against the norm?).
              4.  Coherence of CKR as an idealization in long games (>2-3 stages).
          *   Format: Question + Follow-up (keyed to the *most likely* answer).

  2.  **Deconstruct the Guest's Position (The "Aumann Defender"):**
      *   *Core Belief:* Game theory is normative, not descriptive. If the math says defect, you should defect.
      *   *Defense against Data:* Humans make mistakes (trembling hand, performance error). The theory describes ideal agents.
      *   *Likely Responses:* They will double down on the logical necessity of BI given CKR. They will dismiss empirical data as irrelevant to the *norm*. They will likely argue that counterfactual reasoning holds even if the path isn't reached.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Binmore/Reny (The Paradox of Reaching a Node).*
          *   *Concept:* If CKR implies immediate defection, reaching node 2 is impossible under the assumption. So if we are at node 2, CKR is false. What does Player 2 believe?
          *   *Draft Q:* Ken Binmore and Philip Reny argue that if CKR holds, the game ends at node 1. If we are at node 2, CKR is false. How do you decide what to do?
          *   *Refinement:* Make it sharper. Focus on the "off-equilibrium" belief revision.
          *   *Likely Answer:* "We reason counterfactually. We assume the deviation was a tremble, not a change in type."
          *   *Follow-up:* "If it's just a tremble, why doesn't that probability accumulate over 100 rounds to make cooperation rational?"

      *   *Topic 2: Epistemic/Dispositional vs. Behavioral.*
