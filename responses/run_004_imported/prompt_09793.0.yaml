          *   *Refinement:* Contrast "action-guiding" vs. "truth-tracking." If rationality is dispositional, does the error lie in the disposition or the execution?
          *   *Likely Answer:* "Rationality is about the algorithm/disposition, not the specific output in a noisy world."
          *   *Follow-up:* "If the disposition never outputs the BI move in practice, is it still the 'rational' disposition, or just a mathematically elegant one?"

      *   *Topic 3: McKelvey–Palfrey (Evidence).*
          *   *Concept:* Their Quantal Response Equilibrium (QRE) fits data well. It suggests players think others are boundedly rational.
          *   *Draft Q:* McKelvey and Palfrey showed people cooperate. What evidence would change your mind?
          *   *Refinement:* Focus on the *normative* claim. If a theory predicts $X$ and reality is always $Y$, is the theory useless? What specific empirical pattern *would* falsify the BI norm for you?
          *   *Likely Answer:* "Empirical data can't falsify a logical truth. Only a logical error can."
          *   *Follow-up:* "So if we built an AI that learned to cooperate for higher payoffs, you'd say the AI is irrational?"

      *   *Topic 4: Coherence of CKR in Long Games.*
          *   *Concept:* CKR is a heavy cognitive load. Is it coherent to assume infinite recursion for 100 moves?
          *   *Draft Q:* Is CKR realistic for long games?
          *   *Refinement:* Focus on "coherent idealization." Is it like frictionless physics, or is it like assuming a square circle?
          *   *Likely Answer:* "It's like frictionless physics. Idealizations are necessary for theory."
          *   *Follow-up:* "In physics, frictionless models approximate reality well. In Centipede, the 'friction' (cooperation) *is* the dominant phenomenon. Is the idealization still useful?"

      *   *Topics 5-8 (Need to fill the remaining 4 slots while maintaining depth).*
