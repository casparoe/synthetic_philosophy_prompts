answer: |-
  This is an exceptionally sharp reading of *On Certainty*, and your geological background gives you a distinct advantage in grappling with these passages. Most philosophers treat the river-bed metaphor as a poetic flourish subordinate to the hinge metaphor. You have correctly identified that doing so misses the tectonic pressure Wittgenstein is applying to the concept of "foundations."

  The tension you identify is the central crux of the book: **How can a proposition be logically exempt from doubt (a hinge) if it is historically subject to change (a river-bed)?**

  If we treat the hinge as a permanent logical structure, the river-bed becomes merely decorative. If we treat the river-bed as the primary reality, the hinge seems to dissolve into mere psychological confidence (relativism). To take both seriously, as you request, we must view them as describing two different dimensions of the same phenomenon: the **logical** (synchronic) and the **temporal** (diachronic).

  Here is a close reading that attempts to hold these tensions together without collapsing one into the other.

  ### 1. The Hinge (Synchronic Logic) vs. The River-bed (Diachronic History)

  The hinge passage (§341–343) is an analysis of the **logic of inquiry at a specific moment**. Wittgenstein is arguing that doubt is not a free-floating mental state; it is a move within a language-game. For a move to be intelligible, the board must be stable. If I doubt whether I have hands, I cannot meaningfully weigh evidence about my fingerprints, because the very practice of weighing evidence presupposes a body that can observe and record. At any given time *t*, certain propositions must function as the "scaffolding" (§211) or "hinges" for other propositions to function as empirical claims.

  The river-bed passage (§96–99) is an analysis of the **history of that scaffolding over time**. It answers the question: "Where did these hinges come from, and where are they going?"

  The compatibility lies in the distinction between **status** and **proposition**.
  *   **Hinge:** Describes the *status* a proposition holds at time *t*. (It is functioning as a rule, not a claim.)
  *   **River-bed:** Describes the *trajectory* of that status over time *t1 to t2*.

  A proposition does not possess "hinge-ness" as an intrinsic property (like mass or charge). It acquires it through use. Your geological intuition is perfect here: A boulder is not intrinsically "part of the bank." It becomes part of the bank when the water flow slows enough for it to settle and lithify. Later, if the current strengthens, it may be dislodged and become part of the flow.

  So, to your first worry: **Does this reduce hinge-certainty to a degree of confidence?**
  Wittgenstein's answer is: No, not at time *t*. At any specific moment, the distinction is logical, not psychological. To treat a hinge as a highly confident empirical belief is still to treat it as a belief, which implies the possibility of verification. But hinges are the *means* of verification.
  *   *Example:* "The earth has existed for more than 100 years."
  *   *Empirical belief:* "The earth is 4.5 billion years old." (Testable against data.)
  *   *Hinge:* "The earth existed before my birth." (If I doubt this, the data regarding my birth certificate loses its meaning.)

  However, over historical time, the *status* shifts. What was once a hypothesis (fluid water) becomes a paradigm (hardened bed), and potentially becomes a hypothesis again (fluid water). This is not a change in *confidence*, but a change in *grammatical function*.

  ### 2. The Relativism Charge

  You ask if this commits Wittgenstein to relativism. This is the most dangerous interpretive trap. If hinges shift, isn't truth just "what our culture currently agrees on"?

  Wittgenstein avoids "anything goes" relativism through the **constraints of the river-bed itself**. The water does not choose the bed arbitrarily; the bed constrains the water. Similarly, our "world-picture" is not a free invention; it is constrained by human nature and the physical world.

  This is where your second point—the **Hard Rock vs. Sand (§99)**—becomes vital. Wittgenstein is not saying *all* certainties are equally fluid. He introduces a gradient of stability.

  *   **The Sand:** These are cultural or scientific paradigms that shift on a human historical timescale.
      *   *Example:* "The sun revolves around the earth." For centuries, this was "hard rock." It was the channel through which astronomical data was interpreted. To doubt it was unintelligible. Then, it became fluid, washed away, and replaced.
      *   *Geological equivalent:* Active channel deposits, point bars. High turnover.
  *   **The Hard Rock:** These are certainties tied to our biological form of life and basic spatial/temporal orientation.
      *   *Example:* "Objects persist when unobserved," "I am in pain," "There is a physical world."
      *   Wittgenstein suggests these are subject to "no alteration or only to an imperceptible one" (§99).
      *   *Geological equivalent:* Crystalline basement rock. It *can* shift (tectonics), but not on the timescale of the river's flow.

  By distinguishing rock from sand, Wittgenstein acknowledges that while our *system* of certainties is contingent (it could have been otherwise for a different species), it is not arbitrary for *us*. We cannot simply decide to stop believing that objects persist. To do so would be to cease to act as humans. Thus, he avoids a radical relativism where "my hinges are true for me and yours for you." Instead, he posits a **naturalistic foundationalism**: our hinges are grounded in the shared natural history of the human species.

  ### 3. Integrating the Metaphors: A Geological Reading

  Given your background, let's push the analogy further to see how the two passages cohere without one explaining the other away.

  **The Hinge is the Instantaneous Stability.**
  Imagine taking a photograph of the river. In that frozen moment, the distinction between water and bed is functional. The water flows *over* the bed. The bed supports the *direction* of the water. You cannot have flow without a channel. This is §341: "If I want the door to turn, the hinges must stay put." In the snapshot, the hinge *must* be fixed for the system to work.

  **The River-bed is the Erosional Process.**
  Now play the film at 10,000x speed. You see the bed shifting. You see sediment lithifying into rock and rock eroding into sediment. This is §96: "fluid propositions hardened, and hard ones became fluid."

  **The Resolution:**
  The "contradiction" only arises if we demand that a logical foundation must be *eternally* fixed (a Platonic form). Wittgenstein is suggesting that logical foundations are *geological*. They are stable enough to support the house, but they are part of the earth, not outside it.

  When Wittgenstein says in §97, "I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other," he is admitting a **sorites paradox** boundary.
  *   In your field work, you know there isn't a sharp line where the "deposit" ends and the "terrace" begins. There is a gradient of consolidation.
  *   In epistemology, there isn't a sharp line where "empirical hypothesis" ends and "grammatical rule" begins.
  *   *Example:* "Water is H2O." In 1750, this was an empirical hypothesis (fluid). By 1950, it was a definitional truth (hardened bed). If we discover a new quantum state of matter that challenges this, it might become fluid again.

  ### 4. Does this undermine "Genuine Difference in Kind"?

  You asked: *"Does that not reduce hinge-certainty to an extreme, historically local degree of confidence rather than a genuine difference in kind from ordinary empirical belief?"*

  This is the hardest question. Wittgenstein's response would likely be: **The difference in kind is real, but it is functional, not ontological.**

  Think of a tool. A heavy stone can be a paperweight (function: stability) or a hammer (function: percussion). The stone hasn't changed physically. Its "kind" is determined by its use in the system.
  *   When a proposition functions as a **hinge**, it is a rule of the game. To doubt it is to break the game. (Difference in kind).
  *   When a proposition functions as **fluid**, it is a move in the game. To doubt it is to play the game.

  The fact that the stone can switch from being a paperweight to a hammer over time (river-bed shift) does not mean that *while it is being used as a paperweight*, it is just a "very heavy hammer." No, while it is holding the paper, it is functionally distinct from the hammer.

  So, hinge-certainty is not "high confidence." It is **exemption from the logic of confirmation**. I do not have "evidence" that the world exists; I have no need for evidence. Evidence only makes sense *within* the world. The river-bed metaphor explains how a proposition earns this exemption (through repeated successful use/lithification) and how it can lose it (erosion/anomalies).

  ### 5. Conclusion: A Dynamic Foundationalism

  Wittgenstein is not retreating into relativism, nor is he clinging to dogmatic foundationalism. He is proposing a **dynamic foundationalism**.

  1.  **Foundationalism:** We need hinges to doubt anything. (The door needs hinges).
  2.  **Dynamic:** The hinges are part of the historical system, not outside it. (The bed shifts).
  3.  **Constraint:** The shifting is constrained by human nature and physical reality. (Rock vs. Sand).

  Your geological eye sees what many philosophers miss: **Stability does not require permanence.** A river terrace is stable enough to build on, even if it was deposited by a flood 10,000 years ago and will be eroded in 10,000 more. It is "hard" relative to the water flowing today.

  Wittgenstein's two passages are compatible if we accept that **logic is temporalized.** The "hinge" describes the structural necessity of certainty *now*. The "river-bed" describes the historical contingency of *which* certainties hold that position. The "hard rock" of §99 ensures that while the system is open to change, it is not unmoored.

  You are right to resist explaining one away. The power of *On Certainty* lies precisely in holding the tension between the **necessity of the hinge** and the **fluidity of the bed**. It suggests that our rationality is not a timeless structure descending from the heavens, but a landscape we inhabit—solid underfoot, yet subject to the slow, deep time of erosion and deposition.
