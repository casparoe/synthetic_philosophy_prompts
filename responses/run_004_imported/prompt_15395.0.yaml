      *Wait, let's look at the "Self-Defeat" objection in literature.* Elga, Kelly, etc. The standard reply is often that conciliationism is a *normative* claim, not a descriptive one, or that one can be "moderately" conciliationist.
      Let's have Mara argue that the *degree* of conciliation depends on the *quality* of the engagement. Jonah isn't engaging; he's trapping.

      *Okay, let's settle on this:* Mara argues that the "peerhood" condition isn't met in the meta-debate because Jonah is currently displaying the exact bias (overconfidence) that conciliationism warns against. She judges his performance, not just his status.

  8.  **Final Review against constraints:**
