answer: |-
  The reception hall was too hot, smelling of lilies and expensive hairspray. Mara found Jonah by the bar, loosening a tie that looked like it was strangling him. He was holding a tumbler of whiskey like it was a weapon.

  "You're blocking the gin," Mara said.

  Jonah didn't move. "1998."

  "Excuse me?"

  "The band. The bio on the website says they formed in '98. You said 2001. You owe me twenty bucks."

  Mara signaled the bartender, not looking at Jonah. "I checked the website on my phone while you were giving that toast about 'sacred unions.' It said 2001."

  "It was a typo. I clicked the archive link. '98." Jonah finally turned, a smirk playing on his lips. "Pay up, Mara. Or are you too principled to admit error?"

  "I'm not admitting error until I verify the source. And even then, we both glanced at a webpage for three seconds. We're epistemic peers on this. We have the same access, same cognitive faculties, same amount of bourbon in our systems." She slid a twenty across the bar, but kept her hand on it. "I'm marking this as a suspension of judgment. I'm not updating my credence fully to your position."

  Jonah barked a laugh, snatching the bill. "There it is. The Conciliationist Shuffle. 'I hear you, peer, but I'm going to split the difference and act like I didn't really lose.'"

  "I didn't say I didn't lose. I said my confidence should only move *toward* yours, not lock onto it. That's the view, Jonah. You know the view."

  "I know the view," Jonah said, leaning against the bar. The music swelled—some indie cover of a 90s hit. "I also know that you've been preaching this since your dissertation. 'When a peer disagrees, you must significantly revise your belief.' But look at you. You're barely budging."

  "Because the evidence is thin! It's a trivia fact."

  "Right. Low stakes. So you should be *more* willing to defer. But you're not. You're digging in." Jonah took a sip, eyes over the rim of the glass. "It's hypocritical."

  Mara turned fully toward him now, the noise of the wedding fading into a dull roar. "I am not digging in. I offered to split the bet. That is the operationalization of conciliationism."

  "That's money, not belief." Jonah pushed off the bar, stepping into her space. They were close enough that she could smell the peat on his breath. "Let's talk about the belief. Let's talk about *us*."

  "Jonah, it's Sarah's wedding."

  "Sarah's fine. Sarah thinks we're debating wine pairings." He gestured with the glass. "Here's the thing, Mara. I disagree with you. Profoundly. I think steadfastness is the only rational response to peer disagreement. I think your conciliationism is a slow suicide of the intellect."

  "Okay," Mara said, her voice tightening. "We've had this drink before."

  "But think about it. By your own lights, right now, in this moment, I am your epistemic peer. We went to the same program. We publish in the same journals. You respect my work."

  "I do."

  "So, I hold the steadfast view. You hold the conciliationist view. We are peers in disagreement about the norm of disagreement." Jonah's eyes were bright, predatory. "So, apply your principle. If a peer disagrees with your core normative framework, shouldn't you be losing confidence in conciliationism itself? Shouldn't you be moving toward *my* view?"

  Mara went still. This was the Self-Defeat Objection. It was the grenade everyone kept in their pocket during grad school, but Jonah was actually pulling the pin.

  "If I accept your premise," Mara said slowly, "then yes. The fact that you—a peer—reject conciliationism is higher-order evidence that conciliationism might be false."

  "Exactly!" Jonah threw his hands up. "So why aren't you conceding? Why are you standing here, telling me I'm wrong about being stubborn, using a theory that says you should agree with me about being stubborn? You're sawing off the branch you're sitting on, Mara. And you won't let go of the saw."

  "I haven't let go because the cut isn't clean."

  "It's a paradox! It's self-undermining."

  "It's not self-undermining, it's self-referential." Mara set her wine glass down on the bar with a sharp *clink*. "You're assuming that the Conciliationist Principle applies to itself in the same way it applies to first-order facts. Like the year the band started."

  "It's a normative claim. It applies to all beliefs."

  "Does it?" Mara leaned in. "Here's my comeback, Jonah. And listen closely, because I'm only saying this once before I go find the bride."

  She took a breath. The room felt tilted.

  "You're right that I should lower my credence in conciliationism because you disagree with me. And I have. Ten years ago, I was a 99 percent conciliationist. Today, because of people like you—smart, reasonable, persistent—I'm maybe an 85 percent conciliationist."

  Jonah opened his mouth to interrupt, but she held up a finger.

  "But," she continued, "to apply the principle, I have to judge whether you are actually functioning as a peer *in this specific instance*. And to do that, I have to use my best judgment about what rationality looks like."

  "That's circular," Jonah snapped. "You're using your view to validate your view."

  "No. I'm using my view to evaluate the *quality* of the disagreement." Mara's voice dropped, losing the academic polish, becoming the friend he knew from the library at 3 AM. "Conciliationism requires me to discount my first-order reasoning when I see a peer disagrees. But right now, your steadfastness isn't just a position. It's a performance. You're confident. You're loud. You're acting like certainty is a virtue."

  She picked up her wine glass again.

  "My theory says that confidence like yours is often a sign of cognitive bias. Overconfidence. The Dunning-Kruger of the seminar room. So, when I look at you—my peer—telling me I'm wrong, my theory also tells me that your confidence is evidence *against* your position, not for it."

  Jonah stared at her. The smirk was gone. "So you're saying my disagreement counts less because I'm too confident?"

  "I'm saying that the fact of our disagreement lowers my confidence in my view. But the *manner* of your disagreement confirms my suspicion that steadfastness encourages dogmatism." She took a sip. "I conciliate on the truth of the theory. But I don't conciliate on the observation that your theory makes you insufferable at weddings."

  Jonah let out a short, sharp breath. He looked down at his whiskey, swirling the ice. For a second, he looked tired. The fight drained out of his shoulders, leaving just the old friend.

  "85 percent?" he asked quietly.

  "Maybe 80. You're very persuasive when you're drunk."

  "And the other 20 percent?"

  "That's for the possibility that I'm just weak-minded and you're the only one with a spine." Mara bumped her glass against his tumbler. "But if I become a steadfastist, Jonah, I won't be able to stand you. And I really like you. So for the sake of our friendship, I hope I stay a conciliationist."

  Jonah clinked back. The sound was heavier this time. "If you become a steadfastist, Mara, you'd finally be worth arguing with."

  "Don't push it."

  "Fine." He downed the rest of the whiskey. "But I'm still keeping the twenty. The band started in '98."

  Mara smiled, a real one this time. "Check the liner notes. If they're a cover band, they didn't exist until they played their first gig. Which was 2001."

  Jonah froze. He blinked. "Oh, you have got to be kidding me."

  "Conciliationism," she said, turning toward the dance floor. "Requires checking the evidence before updating the credence. I did. You didn't."

  "Mara!"

  "Buy me a drink later, Jonah. We can talk about the Independence Principle."

  She walked away into the crowd, leaving him standing at the bar, staring at the empty glass, wondering if he'd won the argument but lost the point, or if that was exactly what she wanted him to think.
