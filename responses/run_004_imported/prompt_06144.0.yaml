  quick philosophy question that's been bugging me at work lol. i've been reading about the regress problem in epistemology (foundationalism vs coherentism vs infinitism) and as a software engineer with zero formal philosophy training, this feels like a slam dunk that philosophers are massively overthinking. if you justify belief A with belief B, and B needs justifying by C, and so on forever with no base case, isnt that just unbounded recursion with no terminating condition -- a stack overflow, not a valid computation? so infinitism has to be wrong for basically the same reason a recursive function needs a base case to not crash, and foundationalism (some beliefs just dont need further justification, like a base case) has to be the only sane option once you frame it that way. am i missing something, or is this actually just that easy?
