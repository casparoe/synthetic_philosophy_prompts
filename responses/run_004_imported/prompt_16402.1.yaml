answer: |-
  The observation glass was cold enough to fog if Aris breathed too hard, but he held his breath. Below, in the white sterile pit, Subject 7 shifted. It looked like a cluster of obsidian shards suspended in a magnetic field, constantly shedding and reabsorbing its own edges.

  Aris tapped his tablet. *Entry 4,092. Stimulus: Presentation of nutrient paste. Response: Vosh.*

  "Vosh," Aris whispered. For six months, he had been certain *Vosh* meant *food*. Or *eating*. Or perhaps *sustenance*.

  Then, three weeks ago, the magnetic field fluctuated. A single shard broke off from the main cluster and drifted to the floor. Subject 7 had pointed a newly formed appendage at the fallen shard and vocalized: *Vosh.*

  Aris rubbed his eyes. If *Vosh* meant *food*, why call the fallen rock *Vosh* when it wasn't being eaten? If it meant *object*, why only say it when the cluster was engaged with it?

  "Run Simulation Delta," Aris said to the room.

  The speakers crackled. "Simulation Delta requires manual override. Risk of subject stress."

  "Override."

  A mechanical arm descended into the pit. It didn't offer food this time. It offered a mirror. A polished steel sheet, angled so Subject 7 could see its own reflection.

  The cluster pulsed. The shards vibrated. *Vosh.*

  Aris froze. *Vosh* meant *self*?

  He ordered the arm to shatter the mirror. The pit floor was littered with silver fragments. Subject 7 scanned the debris. *Vosh.*

  Aris slumped into his chair. The data was perfect. The correlations were one hundred percent consistent. And they proved nothing.

  He opened his drawer and pulled out the two binders. They were thick, heavy, identical in weight.

  **Manual A** posited that *Vosh* referred to *Enduring Objects*. In this manual, the cluster was one object. The shard was a part of that object. The reflection was an image of that object. The translation of *Vosh* was "Entity."

  **Manual B** posited that *Vosh* referred to *Temporal Stages of Radiation*. In this manual, the cluster was a process. The shard was a localized event of that process. The reflection was a light-event. The translation of *Vosh* was "Occurrence."

  Aris opened Manual A to page fifty. *Rule 12: When subject indicates a distinct part, translate as metonymy for the whole.*
  He opened Manual B to page fifty. *Rule 12: When subject indicates a whole, translate as aggregation of the parts.*

  Both manuals predicted Subject 7's behavior with perfect accuracy. Both manuals allowed Aris to anticipate when the alien would hunger, when it would sleep, when it would aggressive. He could live with this alien, trade with it, build a city with it, using either manual.

  But if he used Manual A, he was living in a universe of *things*. If he used Manual B, he was living in a universe of *events*.

  There was no experiment to distinguish them. To ask "Is this the *same* Vosh as yesterday?" required a word for *same*. But the word for *same* depended on whether you were comparing *objects* (Manual A) or *events* (Manual B).

  If *Vosh* meant *Entity*, then *Same* meant "Numerical Identity."
  If *Vosh* meant *Occurrence*, then *Same* meant "Qualitative Similarity."

  He couldn't learn the word for *same* without knowing what *Vosh* was. He couldn't know what *Vosh* was without knowing the word for *same*.

  The intercom buzzed. It was Director Halloway. "Progress report, Aris? The UN wants to know if we can negotiate territory."

  "We can negotiate," Aris said. His voice sounded thin.

  "Good. What are the boundaries?"

  "Any boundary you draw will hold," Aris said. "If we draw a line in the sand, they will respect it. If we build a wall, they will not cross it. If we ask for water, they will give water."

  "Then what's the problem?"

  Aris looked down at the pit. Subject 7 was reassembling the fallen shard back into its body. It was a fluid motion, seamless.

  "The problem, Director, is that I don't know if I'm talking to a neighbor or a weather pattern."

  "Speak English, Aris."

  "If I sign a treaty," Aris said, staring at the obsidian cluster, "Manual A says I am signing an agreement with a sovereign entity that will exist tomorrow. Manual B says I am signing an agreement with a momentary configuration of energy that will cease to exist the second the ink dries. The next configuration will honor the treaty only because my physics predicts it will, not because it feels *bound* by it."

  "Does it matter? They keep their word."

  "It matters if we go to war," Aris said softly. "If I bomb them, Manual A says I am killing a being. Manual B says I am dispersing a storm. One is murder. The other is... landscaping."

  "Are you saying we can't know?"

  "I'm saying there is nothing to know." Aris tapped the two binders. "I have two maps of this territory. One maps mountains. The other maps wind currents. Both maps get me from Point A to Point B perfectly. But if I ask 'Is there a mountain here?', the answer depends entirely on which map I chose to read. And there is no third map to check them against."

  "Pick one," Halloway said. "We launch the diplomatic shuttle in forty-eight hours."

  "I can't."

  "Then you're relieved."

  "Wait." Aris watched Subject 7. The alien turned toward the glass. For the first time, it didn't look at the food, or the mirror, or the tools. It looked at *him*.

  It raised a shard. *Vosh.*

  Aris felt a chill that had nothing to do with the glass.

  "What did it say?" Halloway asked.

  "It said *Vosh*."

  "Which means?"

  Aris looked at his own hand pressed against the glass. He saw the skin, the pores, the blood pulsing beneath.

  If he used Manual A, the alien was calling him an *Entity*. A human. A peer.
  If he used Manual B, the alien was calling him an *Occurrence*. A flash of carbon. A temporary disturbance in the room's entropy.

  "Aris?"

  "It means..." Aris watched the alien's shards vibrate. He realized with a sickening lurch that the alien was likely running the same calculations on him. To the alien, Aris was just as inscrutable. Was Aris a "Human"? Or was he a "Human-stage"? Or an "Undetached Human-part"?

  The alien could predict Aris's movements perfectly. It knew when he would blink, when he would eat, when he would sleep. It had its own Manual A and Manual B for *Homo sapiens*.

  They could talk forever. They could build empires together. They could love each other, or kill each other. And they would never, not even in principle, know if they were talking about the same universe.

  "Aris, answer me."

  Aris picked up the tablet. He opened a new file. He didn't write a translation. He wrote a prediction.

  *14:00 hours: Subject will emit sound Vosh.*
  *14:01 hours: Subject will absorb shard.*
  *14:02 hours: Subject will emit sound Vosh.*

  He was right. He was always right.

  "It means 'Hello'," Aris lied to the Director. "It means 'We are friends.'"

  "Good work." The line went dead.

  Aris stayed in the dark. Below, the alien pointed at him again. *Vosh.*

  Aris pointed back. He wanted to scream. He wanted to shatter the glass and demand to know if he was a thing or a process. But he knew the answer.

  He was both. He was neither. He was whatever the manual required him to be to keep the predictions working.

  He was a Gavagai. And he was alone in a room full of them.

  Aris closed the binders. He didn't open them again. He just watched the shards shift, listening to the hum of the ventilation, waiting for the next stimulus, waiting for the next response, trapped in the perfect, silent hell of being understood without ever being known.
