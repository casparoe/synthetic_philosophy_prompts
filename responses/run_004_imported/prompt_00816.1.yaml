      *   **Characters:** Two philosophers of economics.
          *   *Defender (Pro-Efficiency):* Argues that noise traders are a principled part of the model, prices remain trustworthy/expert-like.
          *   *Skeptic (Anti-Efficiency/Epistemic Caution):* Argues that noise traders are an *ad hoc* patch, undermining the assurance that prices track truth.
      *   **Constraint:** They must accept the basic setup (Milgrom–Stokey, common prior, rationality, volume explained by noise/liquidity) but disagree on the *philosophical upshot*. They must engage directly, not talk past each other.
      *   **Format:** Dialogue.
