      *   **Move 1 (Skeptic):** Marcus raises the problem. If rational trade is impossible without noise, then prices depend on noise. If prices depend on noise, how can they be expert testimony?
      *   **Move 2 (Defender):** Elena counters. Noise isn't randomness; it's a structural parameter. Informed traders exploit noise, thereby embedding truth into the price. The price *is* the cleaned signal.
      *   **Move 3 (Skeptic):** Marcus pushes on the "cleaning" mechanism. How do we know the ratio of signal to noise? If the noise dominates (e.g., bubbles), the price lies. The model doesn't guarantee the signal wins.
      *   **Move 4 (Defender):** Elena argues from equilibrium. In a rational expectations equilibrium (REE), agents *know* the noise distribution. They don't get fooled systematically. The "expert" is the market mechanism, not individual traders.
      *   **Move 5 (Skeptic):** Marcus attacks the REE assumption. It assumes agents know the model of the market. But if the noise is psychological (Keynesian beauty contest), it's non-stationary. You can't have a prior on mass hysteria.
      *   **Move 6 (Defender):** Elena brings it back to prediction markets specifically. Arbitrage limits the damage. Even if noise exists, truth-seekers will bet against it until the price corrects.
      *   **Move 7 (Skeptic):** Marcus counters with limits to arbitrage. What if the noise is persistent? What if the "truth" is far away and the noise is near? (Keynes: "Markets can remain irrational longer than you can remain solvent.")
      *   **Closing:** Summarize the impasse. It's about the *warrant* for belief. Is the warrant structural (Elena) or does it require independent verification (Marcus)?

  5.  **Refining the Argument (Self-Correction during drafting):**
