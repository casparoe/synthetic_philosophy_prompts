answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers of economics, ELENA (defender of market epistemology) and MARCUS (skeptic), are reviewing a draft chapter.*

  **Marcus:** Let's be precise about the Milgrom–Stokey result before we move on. The theorem tells us that in a world of common priors and common knowledge of rationality, speculative trade is impossible. If I offer to sell you an asset, I reveal that I think it's overvalued. If you're rational, you infer this and won't buy. So, the very existence of volume is, strictly speaking, a violation of the conditions required for the price to be a pure aggregator of private information.

  **Elena:** Agreed. But that's why the "noise trader" assumption isn't a bug; it's the engine. We don't abandon the rational expectations framework because of no-trade; we extend it. By introducing agents who trade for liquidity or exogenous reasons, we allow informed agents to hide their hand. They can trade *against* the noise without fully revealing their private signal immediately. The price becomes a mixture of signal and noise, but crucially, the informed traders push the price toward the fundamental value to capture profit.

  **Marcus:** That's the mechanism, Elena. I'm asking about the epistemic warrant. You want to treat a market price—say, in a prediction market regarding an election or a policy outcome—as analogous to the testimony of a calibrated expert. But if the price only moves because noise traders provide cover, how do we know the price reflects the *signal* rather than the *noise*? If I listen to an expert, I assume their belief is causally connected to the truth. If I look at a price, I know it's causally connected to a mix of truth and liquidity shocks.

  **Elena:** You're treating the noise as a contamination, but in the rational expectations equilibrium (REE), the noise is a known parameter. The informed traders know the distribution of the noise. They calculate the optimal amount to trade to maximize profit given that noise. Consequently, the price *fully reflects* the available private information, conditional on the noise. It's like listening to an expert speaking in a noisy room. You don't dismiss the testimony because there's background chatter; you trust that the expert speaks loudly enough to be heard. The market price is the expert speaking up.

  **Marcus:** But who is the expert? In your analogy, the "expert" is the marginal trader. But if the noise is significant enough to permit trade, it's significant enough to distort the price. The Milgrom–Stokey theorem forces us to admit that without irrationality or non-informational motives, there is no market. So, the market's existence is *ontologically dependent* on non-rational elements. To then claim the output is "rational" seems like a sleight of hand. It's an *ad hoc* patch. You save the efficiency hypothesis by assuming away the very problem the theorem identified, but you lose the guarantee that the price tracks truth.

  **Elena:** It's not *ad hoc* because the noise traders are independently motivated. We have empirical evidence of liquidity needs, hedging constraints, and behavioral biases. The point isn't that noise is rational; it's that the *system* is robust to it. Think of it as a filtering mechanism. Arbitrageurs act as the filter. If noise pushes the price away from the fundamental value, informed traders step in to profit from the discrepancy, pushing it back. The "expert testimony" of the price is the result of this corrective process. We are entitled to trust the price because the incentives are aligned with truth-seeking.

  **Marcus:** Aligned, but not guaranteed. This is where the "limits to arbitrage" literature bites. You assume the informed traders *can* push the price back. But if the noise is systemic—if it's a crowd psychology phenomenon, a Keynesian beauty contest—the price might deviate from fundamentals for longer than the arbitrageurs can remain solvent. If I treat the price as expert testimony, I am deferring to its authority. But if the "expert" is currently hallucinating due to a liquidity cascade, my deference is misplaced. The no-trade theorem shows that rationality alone can't sustain the market; adding noise sustains the market but breaks the link between price and truth. You can't have it both ways.

  **Elena:** You're assuming the noise is dominant. But in a deep market, the informed capital is usually sufficient to correct mispricings on matters of fact. Prediction markets, for instance, deal with binary outcomes. There is a resolution date. That terminal condition anchors the price. As the event approaches, the noise diminishes relative to the certainty of the payout. So, even if noise allows trade early on, the convergence toward the truth is structurally enforced by the contract itself. The "expert" gets more confident as the deadline nears.

  **Marcus:** That works for binary outcomes with near-term resolution. But your dissertation is about the epistemology of financial markets *generally*, and you're using prediction markets as the paradigm case. Even there, consider the "long-shot bias." Prices systematically overestimate the probability of rare events. If the market were a calibrated expert, it wouldn't make systematic errors. The fact that we need to calibrate the prices *post hoc*—to adjust for the market's known biases—proves that the raw price is not testimony we can accept at face value. We have to treat the market not as an expert, but as a data source that requires interpretation by *another* expert.

  **Elena:** Calibration doesn't undermine the testimony; it refines it. If I know a witness tends to exaggerate, I discount their testimony, but I still treat them as a witness. The structural argument holds: the price is the only public aggregation of dispersed private information we have. To reject it because it contains noise is to reject the only signal available. The skeptic's position leads to paralysis. If we can't trust the price because of noise, what do we trust? Aggregated polls? They have noise too.

  **Marcus:** The difference is epistemic transparency. When a poll has a margin of error, we know the statistical properties of the noise. In markets, the "noise" is endogenous. It reacts to the price. If traders see a price rise, they might infer information and buy, creating a cascade. This reflexivity means the noise isn't static; it's dynamic and potentially unstable. The Milgrom–Stokey theorem assumes a common prior, but in a reflexive market, priors diverge based on price movements. Once you admit noise to solve the no-trade problem, you open the door to this reflexivity. You can't claim the price is a "sufficient statistic" for value if the price itself alters the value or the beliefs about value.

  **Elena:** But that's why we distinguish between prediction markets and asset markets. In a prediction market, the outcome is exogenous. The price of a "Candidate X wins" contract doesn't change whether Candidate X wins. So reflexivity is minimized. In that specific context, the noise-trader rescue *does* work. The informed traders know the outcome is fixed; they just don't know it yet. They trade against the noise until the price equals the probability. Here, the price *is* a calibrated expert, precisely because the arbitrage is risk-free at the limit.

  **Marcus:** Even there, you rely on the assumption that the informed traders *exist* and have capital. What if the noise traders are the ones with the capital? If the market is dominated by sentiment, the "rational" traders sit on the sidelines because the risk of further sentiment-driven deviation is too high. The price then reflects the psychology of the crowd, not the information of the few. The no-trade theorem tells us rational agents won't trade against each other. The noise-trader model tells us rational agents will only trade against fools. But if the fools are driving the bus, the destination is arbitrary. To treat that price as testimony is to treat the crowd's mood as a truth-teller.

  **Elena:** You're conflating "volume" with "influence." High volume from noise traders doesn't mean they set the price; it means they provide the liquidity for the informed to set the price. The informed traders are the marginal price-setters. They are the ones willing to hold the position until resolution. The noise traders churn; the informed traders anchor. So, epistemically, the warrant comes from the marginal agent, not the average agent. As long as there is *some* informed capital, the price will track the truth, because leaving money on the table is a stronger incentive than expressing a sentiment.

  **Marcus:** "As long as there is some informed capital." That's the weak link. How do I, as an external observer, know that condition is met? If I see a price of 0.80 on a prediction market, am I seeing the calculated probability of an event, or am I seeing a liquidity imbalance? The model says it could be either, depending on the unobservable ratio of noise to signal. If the epistemic warrant depends on a variable I cannot observe—the proportion of informed traders—then I am not entitled to treat the price as expert testimony. I'm entitled to treat it as a guess that *might* be informed. That's not expertise; that's speculation.

  **Elena:** But that's true of any testimony. When a scientist tells me a result, I have to trust that they aren't fabricating data. I rely on institutional safeguards. In markets, the safeguard is the profit motive. It's a stronger safeguard than peer review, because it's financial. If the price is wrong, someone gets rich correcting it. So, the default position should be trust, unless there's specific evidence of manipulation or illiquidity. The no-trade theorem actually strengthens this: it tells us that *without* the profit motive (i.e., without informed traders), there would be no trade at all. The fact that trade exists is evidence that informed traders are present.

  **Marcus:** No, the fact that trade exists is evidence that *someone* wants to trade. Milgrom–Stokey says it can't be *everyone* acting on information. It could be *no one* acting on information and *everyone* acting on noise. The existence of volume is consistent with a market of pure noise traders, provided they have different priors or liquidity needs. So, volume doesn't prove the presence of informed capital. It just proves the presence of disagreement or need. You're using the existence of the market to prove the existence of the very information-aggregation mechanism you're trying to justify. That's circular.

  **Elena:** It's not circular if we assume rational expectations. If agents are rational, they know that a market of pure noise offers no expected profit. So, rational agents wouldn't participate unless they believed they had an edge or needed hedging. If they have an edge, they are informed. So, the persistence of the market implies the persistence of informed participation.

  **Marcus:** And there it is. "If agents are rational." The no-trade theorem forces us to drop common knowledge of rationality to explain volume. We admit noise traders—agents who *don't* maximize expected utility in the strict sense, or who trade for non-epistemic reasons. Once you drop the common knowledge of rationality, you lose the guarantee of the REE. You can't assume the informed traders know the noise distribution perfectly. If they don't, the price might not converge. You've patched the ontology of the market, Elena, but you've broken the epistemology. You have a market that functions, but you no longer have a logical guarantee that its price is true.

  **Elena:** I don't need a logical guarantee of truth. I need a warrant for belief that is superior to the alternatives. The market price is a sufficient statistic for the *available* information, processed by incentives. It is fallible, yes. But to say it lacks "assurance" is to demand Cartesian certainty from an empirical mechanism. The noise-trader assumption is the recognition that information aggregation happens in the real world, not in a logic puzzle. We treat the price as expert testimony because, historically, it outperforms individual experts. The proof is in the calibration, not the derivation.

  **Marcus:** And I'm saying that calibration is retrospective. Epistemology is about prospective warrant. If the theory tells us that the price is only valid because of the presence of irrationality, we cannot know *ex ante* whether the irrationality is currently dominating the rationality. We are flying blind. We are treating a mechanism that relies on error as a source of truth. That's not just risky; it's philosophically incoherent. You can't build a theory of knowledge on a foundation of systematic error, even if you claim the errors cancel out.

  **Elena:** They don't just cancel out. They get exploited. The error is the fuel for the truth.

  **Marcus:** And if the fuel runs out, or explodes?

  **Elena:** Then we update. But until then, the price is the best expert we have.

  **Marcus:** Or the most convincing liar. And the theorem gives us no way to tell the difference.

  *(They sit in silence for a moment, the steam rising from their coffee cups like the noise in a chart.)*

  **Elena:** Then perhaps that's the chapter's conclusion. Not that prices are true, but that they are the only testimony available that admits its own uncertainty in the spread.

  **Marcus:** I can agree to that. The spread is the market admitting it might be wrong.

  **Elena:** And the volume is it betting it isn't.

  **Marcus:** Precisely. So we treat the price not as an assertion, but as a wager.

  **Elena:** Now *that* is a distinction I can work with.
