  2.  **Deconstruct the Core Philosophical Tension:**
      *   *The No-Trade Theorem:* If everyone is rational and knows everyone else is rational, no one trades on information alone. Why? Because if I sell to you, you infer I know something bad. If you know I know something bad, you won't buy.
      *   *The Empirical Reality:* People trade *a lot*.
      *   *The Standard Explanation:* Noise traders (uninformed, irrational, or liquidity-constrained agents) provide the cover for informed traders to operate without fully revealing their hand immediately.
      *   *The Epistemic Question:* Can we treat the resulting market price as "knowledge" or "expert testimony"?
      *   *Defender's Stance:* The mixture of informed and noise traders creates a signal-extraction problem that, in equilibrium, aggregates information efficiently. Noise is a feature, not a bug. It's like static in a radio signal; the signal is still there and decodable.
      *   *Skeptic's Stance:* Once you admit noise, you break the link between price and fundamental value. You can't distinguish a price move due to information from a price move due to sentiment. Therefore, the "expert testimony" analogy fails because the expert might be hallucinating, and we can't tell the difference.

  3.  **Character Development:**
      *   *Defender:* Let's call her **Elena**. She leans towards Bayesian epistemology, rational expectations, and sees markets as information processing engines.
      *   *Skeptic:* Let's call him **Marcus**. He leans towards social epistemology, skepticism about aggregation, and worries about reflexivity/psychology.

  4.  **Drafting - Section by Section:**

