answer: |-
  It is excellent that you are grappling with this tension. Your intuition is actually quite common among students first encountering Goodin's argument: on a normative level, the All-Affected Interests Principle (AAIP) feels morally robust. It seems to cut through the arbitrariness of borders.

  However, to answer your question directly: **No, the persistence of the boundary problem is not merely due to theorists' reluctance to accept a global electorate.** While the radical implications of AAIP are certainly controversial, scholars like Sofia Näsström (and others like Frederick Whelan or David Miller) argue that the principle itself suffers from deep conceptual and practical indeterminacies. They contend that AAIP does not actually "settle" the problem; it merely shifts the locus of disagreement from "who is a citizen" to "what counts as an effect."

  Here are the four main gaps in the AAIP that keep the boundary problem unresolved, with specific attention to Näsström's critique.

  ### 1. The Problem of Causal Indeterminacy (The "Butterfly Effect")
  Your climate change example is the strongest case for AAIP because the causal chain is relatively clear. However, democratic theory must account for *all* decisions, not just existential threats.

  Critics argue that in a globalized world, almost every decision affects almost everyone to some infinitesimal degree. If a town in Ohio changes its zoning laws, does that affect a farmer in Kenya? Technically, yes, through aggregate carbon emissions or global market shifts. If we take AAIP literally, the *demos* for a local zoning board becomes the entire human race.

  If the *demos* is always "everyone," then the concept of a specific *demos* dissolves. Democracy requires a bounded space for deliberation and decision-making. If the boundary is co-extensive with humanity for nearly every decision, we no longer have a theory of *democratic boundaries*; we have a theory of global technocracy or anarchy. Theoreticians argue that AAIP fails to provide a **threshold** for significance. Without a metric for "how much" affectedness is required to warrant a vote, the principle is indeterminate.

  ### 2. Näsström's Critique: The Constitution of Interests
  This is the most sophisticated philosophical objection and likely the core of why your seminar is reading Näsström.

  Goodin treats "interests" as pre-political facts that we can objectively identify prior to the vote. He assumes we can look at a policy, calculate the impacts, and see whose interests are touched. Näsström argues this is impossible. **Interests are not discovered; they are constituted through political debate.**

  *   **The Circularity:** To know who is affected, we must first define what the policy *is* and what counts as a relevant *interest*. But defining the policy and the interests is itself a political act that requires a *demos*.
  *   **The Example:** Consider a decision to build a dam. Is the interest at stake "electricity," "environmental preservation," "sacred land," or "economic growth"? Different groups will define the "interest" differently. You cannot determine who is affected until you have already decided how to frame the issue. But who frames the issue? The *demos*.
  *   **The Conclusion:** Therefore, you cannot use affected interests to define the *demos*, because you need a *demos* to define the interests. Näsström argues that AAIP presupposes the very thing it is trying to create.

  ### 3. The Temporal Problem (Future Generations)
  You mentioned future generations as a strength of the principle ("arguably future generations too"). Critics see this as a major weakness.

  Democracy is traditionally a system of communication and accountability among contemporaries. Future generations cannot deliberate, cannot vote, and cannot hold current voters accountable. If we include them in the *demos* based on affected interests, we must invent a mechanism of **proxy representation**.
  *   Who appoints the proxies?
  *   How do we know the proxies are accurately representing the interests of the unborn (who, by definition, have no expressed preferences)?
  *   Does this turn the *demos* into a trusteeship rather than a democracy?

  This introduces a new boundary problem: How do we bound the *time* of the *demos*? AAIP says "indefinitely," which creates institutional paralysis (how do we weigh the interests of the unborn against the living?).

  ### 4. The Distinction between "Affected" and "Subjected"
  Many theorists (like Arash Abizadeh or Ludvig Beckman) argue that AAIP confuses **causal impact** with **political subjection**.

  *   **Affected:** I am harmed by your decision (e.g., your country pollutes my air).
  *   **Subjected:** I am bound by your coercive authority (e.g., your laws force me to act or punish me if I don't).

  Critics argue democracy is specifically about legitimizing **coercion**, not preventing all harm. I am affected by my neighbor's ugly house, but I don't get a vote on their renovation permit. I am subjected to the tax code, so I get a vote.
  If we use AAIP, we conflate externalities with jurisdiction. The "All-Subjected Principle" is often proposed as an alternative to keep the boundary problem solvable: the *demos* should include everyone subject to the coercive enforcement of the law. This keeps boundaries tighter and more institutionalizable than AAIP.

  ### Summary: Why the Puzzle Remains
  The boundary problem remains unresolved not because theorists are stubborn, but because AAIP trades one hard question ("Who is a citizen?") for two equally hard questions:
  1.  **Ontological:** What counts as a relevant "interest" or "effect," and who decides that prior to the vote? (Näsström's point).
  2.  **Institutional:** How do we construct a voting body that changes composition with every single agenda item? (A "fluid *demos*" may be theoretically pure but practically incoherent).

  Goodin's defense is valuable because it pushes us toward greater inclusion and highlights the moral arbitrariness of borders. However, most theorists conclude that while AAIP is a useful **normative critique** of existing boundaries, it fails as a **constitutive rule** for creating them. It tells us when our current boundaries are wrong, but it doesn't give us a workable formula for drawing them right.

  In your coffee debates, you might try pivoting the question: *If interests are politically constructed rather than objectively given, can a principle based on "affected interests" ever be neutral?* That usually gets to the heart of Näsström's challenge.
