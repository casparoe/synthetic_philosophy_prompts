answer: |-
  The hum of the modal interferometer was quieter than Elias expected. For thirty years, he had built detectors for particles that decayed before they could be named; now, retired and alone in his study, he had built a window into what *might* have been.

  On the screen, the waveform stabilized. It wasn't showing a distant galaxy. It was showing his own study, thirty years ago.

  Elias leaned forward, his arthritic knuckles white. He knew what he was looking for. The Harwell Incident. The shielding calculation he had rushed, the colleague who had taken the fall, the radiation sickness that had lingered for a decade before the end came. Elias had kept his tenure. He had kept his silence.

  On the screen, the Past-Elias sat at the same desk. But this Past-Elias wasn't signing the falsified report. He was picking up the phone. He was calling the safety commission.

  A sob caught in Elias's throat. Relief, warm and intoxicating, flooded his chest. *I am not a monster,* he thought. *I made a mistake, but I am not a monster. In some real sense, I did the right thing.*

  He reached for the confirmation log, ready to annotate the observation. Then he stopped. His hand hovered over the keyboard. He was a physicist. He knew the ontology of the machine.

  This wasn't time travel. The worlds were causally isolated. Spacetime indices were disjoint.

  "If that man did the right thing," Elias whispered to the empty room, "did *I* do the right thing?"

  It was the old fight. Kripke versus Lewis. The genuine transworld identity camp said yes. They argued that *you* are the thing that exists across worlds. If you won the election in another world, *you* won. Your potential is real because *you* occupy that space. If Kripke was right, the man on the screen was Elias Thorne. The guilt was mitigated because the essence of Elias Thorne included moral courage.

  But the machine was built on David Lewis's architecture. Counterpart Theory.

  Under Lewis, you are world-bound. You exist only here. The man on the screen was not Elias. He was a *counterpart*. He resembled Elias. He shared a origin, a name, a face. But he was numerically distinct. A stranger who looked like him.

  "If it's just a counterpart," Elias said, his voice trembling, "then he's not me. His virtue isn't mine. I'm still the man who signed the paper."

  He needed to know. He needed the comfort of identity. He adjusted the interferometer's parameters, trying to force a transworld link. He wanted the machine to say *Identity Confirmed*.

  The screen flickered. The image of the Virtuous Elias wavered.

  Elias tweaked the similarity weights. This was the second trap of Counterpart Theory. The counterpart relation isn't absolute; it's context-dependent. It's just similarity, and similarity depends on what properties you care about.

  He increased the weight on *biological continuity*. The Virtuous Elias remained.
  He increased the weight on *psychological continuity*. The Virtuous Elias remained.
  Then, angrily, Elias shifted the context. He weighted *moral history*.

  The screen shimmered. The Virtuous Elias faded. He was replaced by a different figure. In this version, Elias hadn't just signed the paper; he had actively sabotaged the colleague's defense to ensure his own silence held. This counterpart was darker, harder.

  Elias recoiled. "Which one is it?" he demanded. "Which one is the real counterpart?"

  There was no answer. That was the horror of Lewis's view. There is no unique double. There are only clusters of similarity. If the context is "professional capability," the Virtuous Elias is his counterpart. If the context is "moral culpability," the Saboteur Elias is his counterpart.

  He realized then why Kripke had fought so hard for transworld identity. It wasn't just logic; it was mercy. Kripke wanted to believe that what we *could* have been matters to who we *are*. He wanted potential to be a part of actuality.

  Lewis offered no such comfort. Lewis said: You are what you did. The rest are just shadows cast by people who look like you.

  Elias looked back at the first image. The Virtuous Elias was hanging up the phone, looking relieved, unburdened. He was living the life Elias had stolen for himself.

  "If you are me," Elias said to the screen, "then I am innocent. My guilt is just a branch that didn't grow."

  He typed a command into the console: *Ontological Status?*

  The machine processed the causal isolation metrics. *Result: Disjoint.*

  They were not the same. The relief curdled into ash. The virtue on the screen belonged to that man. It could not be transferred. Elias could not borrow courage from a stranger, even if the stranger wore his face. The guilt of the Harwell Incident was not a modal property that varied across worlds; it was a local fact, anchored in this spacetime index.

  He had hoped the machine would show him that he was fundamentally good, that the signing of the report was an anomaly in his character. But the machine showed him that character is not fundamental. Character is just a pattern of actions. And his pattern was fixed.

  He looked at the Saboteur counterpart again. Then back at the Virtuous one. The shifting images mocked him. They were both real, in their own worlds. But neither was *him*.

  Elias stood up. The chair scraped loudly against the floor. He walked to the window and looked out at his own garden, his own actual world. The sun was setting. The light was specific. It was not the light of the world where he made the call.

  He realized the distinction was not academic. It was the difference between absolution and accountability.

  If transworld identity were true, he could say, "I did the right thing somewhere." He could rest on the plurality of his selves.
  But under Counterpart Theory, he was singular. He was alone. The man who did the right thing was a different person, and he would never know him.

  Elias walked back to the desk. He opened the bottom drawer and pulled out the sealed envelope he had kept for thirty years. The confession. The true data. The admission of fraud.

  He had waited for a sign that he was worthy of redemption. He had hoped to find it in the multiverse, to find a version of himself that proved he was salvageable. But the metaphysics denied him the escape. The good man on the screen was a counterpart, not a savior.

  He placed the envelope on the desk, next to the humming machine.

  "You're not me," Elias said to the Virtuous Elias on the screen. "So you can't save me."

  He picked up the envelope. The weight of it was absolute. It didn't vary across worlds. It was heavy here, now.

  Elias turned off the interferometer. The screen went black. The shadows vanished. There was only the room, the man, and the thing he had done. He put on his coat. He had a delivery to make.
