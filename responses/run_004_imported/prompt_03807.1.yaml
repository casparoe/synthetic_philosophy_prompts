      *   **Character B (The Unifier/New View):** Let's call her *Maya*. She's skeptical of the "two minds" leap. She focuses on the Pinto data and the idea that subcortical connections might still allow integration. She sees it as an information bottleneck, not a self-split.

  3.  **Drafting - Section by Section:**

