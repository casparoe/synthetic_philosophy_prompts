prompt: |-
  I've recently joined the board of a homeowners' association for a condominium development that's being built and sold off in phases: of forty-two planned units, thirty are sold and occupied, and the remaining twelve are still unbuilt or unsold. What began as a routine bylaws review has turned into the most contentious thing the board has faced in years, and after a couple of meetings that generated far more heat than clarity, I'd like a more rigorous outside take than anyone on the board has managed to offer.

  The dispute is nominally just about voting rights, but it keeps fracturing into sub-disputes every time we think we've settled it. Under the current bylaws, one vote attaches to each deed, held by whoever is on the title. About a third of the thirty sold units are owned by investors who rent them out on long leases and have never lived there, while several tenants who've rented for years, attend every meeting, and are bound by every rule the board passes have no vote at all, since tenancy isn't ownership. Meanwhile, the board is about to approve a fifteen-year reserve-funding and renovation plan that will financially bind whoever eventually buys the twelve unsold units — people who, by definition, can't be consulted now. The development company that still holds title to those twelve units, and will cast its votes until each one sells, has said plainly that it intends to vote however keeps its own carrying costs lowest, with no particular loyalty to the future owners it's nominally standing in for. Predictably, the board has split: one faction wants to leave the rule exactly as it is, since "one deed, one vote" is at least unambiguous and hard to litigate; another wants to extend a vote to long-term tenants and hold the unsold units' votes in some kind of trust for their eventual owners, on the theory that whoever actually has to live under a rule has the strongest claim to a say in making it.

  This feels like exactly the kind of dispute that would get a long, careful treatment on a rationalist blog, and I keep wishing someone had already written that post — but since I can't find one, I'd rather reason it through directly than lean on half-remembered analogies. Part of me suspects the "one deed, one vote" camp is really just defending a Schelling point — a rule that's stable and hard to litigate, rather than one that's obviously fair — but administrative simplicity has to count for something, and I don't want to dismiss their position just because it's convenient. More fundamentally, my suspicion is that every one of these proposals quietly smuggles in an answer to the very question it's supposed to be neutral about: there's no way to decide who gets to help decide without having, in some sense, already decided who counts. But I can't tell whether that's a genuine and probably irresolvable problem, or just a sophisticated-sounding rationalization for whichever scheme happens to favor my own preferred outcome. I'd like your honest, fully worked-through answer: is there a principled way to settle who should get a vote in a case like this, and if so, what is it, and why does it beat the alternatives? And if you conclude that the problem is genuinely unfixable in principle, I want the argument for that conclusion, not a diplomatic shrug.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** Board member of a condo HOA (42 units total: 30 sold/occupied, 12 unsold/developer-held).
      *   **The Conflict:** Voting rights under the bylaws ("one deed, one vote").
      *   **The Stakeholders:**
          *   Owner-occupiers (live there, vote).
          *   Investor-owners (don't live there, vote, rent out).
          *   Long-term tenants (live there, bound by rules, *no* vote).
          *   Developer (holds 12 unsold units, votes, motivated by minimizing carrying costs, not long-term community health).
          *   Future Owners (will buy the 12 unsold units, bound by current decisions, *no* vote).
      *   **The Immediate Issue:** Approving a 15-year reserve/renovation plan.
      *   **The Factions:**
          *   *Status Quo:* "One deed, one vote" (Clear, hard to litigate, Schelling point).
          *   *Reform:* Vote for tenants, trust votes for unsold units (Fairness based on impact/stake).
      *   **The User's Meta-Concern:** Suspects every rule smuggles in a prior answer to "who counts." Wonders if this is an irresolvable philosophical problem or if there's a principled solution. Wants a rigorous, rationalist-style analysis, not a diplomatic shrug.
      *   **Goal:** A fully worked-through answer on whether there's a principled way to settle voting rights, what it is, why it beats alternatives, OR an argument for why it's unfixable in principle.

  2.  **Initial Assessment & Framing:**
      *   This is a classic problem of *political legitimacy* and *principal-agent dynamics* within a private governance structure.
      *   The user is right: "Who decides who decides?" is the fundamental question of constitutional design.
      *   However, an HOA is not a sovereign state. It's a contractual association bound by property law. This distinction is crucial.
      *   The "unfixable in principle" angle is tempting (Arrow's Impossibility Theorem vibes), but in practice, legal structures impose constraints that make some solutions "more principled" than others based on the *purpose* of the entity.
      *   I need to avoid taking sides politically but analyze the *incentive structures* and *risk allocations*.

  3.  **Analyzing the Competing Principles:**
      *   **Principle A: Property Rights (The Status Quo).** Voting attaches to equity risk. If the building burns down or assessments skyrocket, the *owner* loses capital. The tenant can move. The developer loses inventory value.
      *   **Principle B: Stakeholder Impact (The Reform).** Voting attaches to those affected by daily life. Tenants live there. Future owners inherit debt.
      *   **Principle C: Fiduciary Duty (The Board's Role).** The board has a legal duty to the *corporation/association*, not specific factions.

  4.  **Evaluating the Specific Tensions:**
      *   *Tenants vs. Owners:* Tenants have temporary stakes; owners have permanent capital stakes. If tenants vote for high amenities/low reserves, owners pay. If owners vote for high assessments/low maintenance, tenants suffer quality of life but can leave. *Analysis:* Capital risk usually trumps occupancy risk in property law because capital is illiquid and trapped.
      *   *Developer vs. Future Owners:* This is the most dangerous asymmetry. The developer holds 12/42 votes (28.5%). This is a blocking minority or even a controlling block depending on quorum rules. Their incentive is *short-term cost minimization* to sell units, whereas the HOA needs *long-term capital preservation*. This is a classic Principal-Agent problem where the Agent (Developer) has conflicting incentives with the Principals (Future Owners).
      *   *The "Who Counts" Paradox:* The user worries that defining the electorate presupposes the outcome. This is true, *but* the definition should align with the *liability structure*.

  5.  **Developing the Argument:**
      *   *Thesis:* The problem is not unfixable in principle, but the "fairness" argument (tenants/future owners) is the wrong metric. The correct metric is **Alignment of Risk and Control**.
      *   *Why Status Quo is mostly right (but needs a tweak):* Voting should follow *financial liability*. Owners bear the special assessments. Tenants do not (directly). Therefore, owners vote.
      *   *Why the Developer situation is the real bug:* The developer *is* an owner, but their incentive horizon is misaligned with the HOA's lifespan. They are not "standing in" for future owners; they are speculators.
      *   *The "Unfixable" aspect:* You cannot perfectly represent future people who don't exist yet. But you can mitigate the *conflict of interest* of the current proxy (the developer).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the "who decides who decides" paradox but pivot to the specific legal/economic nature of an HOA.
      *   **Core Principle:** Risk-Weighted Governance. Voting rights should correlate with *irreversible financial liability*.
      *   **Analysis of the Three Groups:**
          1.  *Tenants:* Why they shouldn't vote (liquidity/exit option).
          2.  *Investor-Owners:* Why they should vote (capital at risk), even if absent.
          3.  *Developer/Unsold Units:* The critical failure point. Why their voting power is dangerous and how to mitigate it without breaking the "deed" principle.
      *   **Addressing the Meta-Problem:** Is it circular? Yes, but non-arbitrarily. The circle is closed by *contract law* and *economic reality*, not abstract fairness.
      *   **Recommendation:** Don't change the voting base (too litigious/complex). Change the *scope* of decisions or the *weighting* during the transition period. Specifically, address the Developer conflict.
      *   **Conclusion:** A definitive stance.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I shouldn't just say "Tenants can't vote." In some jurisdictions, long-term leases *do* convey voting rights. I need to stick to the user's stated bylaws ("one deed, one vote") but analyze the *merit* of changing it.
      *   *Nuance:* The "Trust" idea for unsold units is legally messy. Who manages the trust? The board? That creates a circular loop.
      *   *Better Solution:* Focus on the *Developer's* specific conflict. The 15-year plan is the flashpoint. Can the board approve a 15-year plan that binds future owners when 28% of the vote is held by a party explicitly optimizing for short-term sales?
      *   *Key Insight:* The "One Deed, One Vote" rule is actually the *most* principled because it aligns with the *legal liability*. The problem isn't the voting rule; it's the *transition period* inherent in phased developments. The bylaws should have had a "turnover" clause that limits developer voting on long-term capital issues after a certain % sold. Since they didn't, the Board has a fiduciary duty to act in the best interest of the *Association as a whole*, which may mean voting against the Developer's interest even if they hold a block.
      *   *Wait, one more thing:* The user asked for a "principled way to settle who should get a vote." I need to answer that directly.
      *   *Answer:* The principle is **Residual Claimancy**. Who is the residual claimant on the asset's long-term value? The owner. Not the tenant (contractual right to occupy), not the future owner (not yet a party to the contract).
      *   *But:* The Developer is a *bad* residual claimant for the unsold units regarding long-term reserves.
      *   *Synthesis:* Keep voting with owners (Residual Claimants). But recognize the Developer's vote is compromised regarding long-term liabilities. The Board's fiduciary duty overrides the Developer's self-interest.

  8.  **Drafting the Content (incorporating Rationalist style):**
      *   Use clear headers.
      *   Avoid equivocation.
      *   Address the "circularity" objection directly.
      *   Focus on incentives and game theory.

  9.  **Final Polish:**
      *   Ensure the tone is respectful but analytical.
      *   Make sure the distinction between "State" and "Contractual Association" is clear.
      *   Check that the advice on the 15-year plan is practical. (e.g., Phasing the plan, or ensuring the reserve study is conservative enough that future owners aren't screwed).

  **(Self-Correction during drafting):** I need to be careful not to give legal advice. I must frame this as governance theory and strategic analysis, not counsel.
  *Key realization:* The user's suspicion that "every proposal smuggles in an answer" is actually a feature, not a bug. It's called a *Constitutional Moment*. You *must* decide who counts to decide. The question is: on what basis? I will argue that "Financial Risk" is the only non-arbitrary basis in a property context.

  10. **Final Plan:**
      *   Validate the paradox.
      *   Define the HOA's nature (Contract vs. Polity).
      *   Apply the "Residual Claimant" principle.
      *   Analyze the three factions through this lens.
      *   Identify the Developer issue as a specific *incentive mismatch*, not a voting rights issue.
      *   Conclude on the "Unfixable" question: It is fixable, but not by "fairness," by "risk alignment."

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a sophisticated governance problem that sits at the intersection of property law, contract theory, and political philosophy. You are correct to sense that the question "Who gets to decide who decides?" is circular. In political science, this is the *constitutive paradox*: any rule defining the electorate must itself be authorized by an electorate.

  However, an HOA is not a sovereign state. It is a **private contractual association bound by property law**. This distinction breaks the circularity. In a state, legitimacy is derived from consent or coercion; in an HOA, legitimacy is derived from **risk allocation**.

  Here is the rigorous take you are looking for.

  ### 1. The Core Principle: Residual Claimancy

  To determine who should vote, you must answer: *Who bears the irreversible risk of the decision?*

  In economic terms, voting rights should align with **residual claimancy**. The residual claimant is the party entitled to the leftover value of the asset after all fixed contracts are fulfilled.
  *   **Tenants** have a fixed contract (the lease). They pay rent, they get habitation. If the roof leaks, they demand repair or leave. Their risk is temporary and liquid (they can move).
  *   **Owners** hold the residual claim. If the roof leaks and reserves are empty, they pay the special assessment. If the building deteriorates, their equity vanishes. Their risk is permanent and illiquid.
  *   **Future Owners** do not yet exist as legal parties. They cannot be claimants until they sign the purchase agreement.

  **The Principle:** Voting rights must attach to **current financial liability**, not **current occupancy** or **future potential liability**.

  **Why this beats the alternatives:**
  *   **Vs. Tenant Voting:** If tenants vote for high amenities and low reserves, they enjoy the benefit, but the owners pay the capital cost. This is a "moral hazard" separation of cost and benefit. Tenants can exit the system when the bill comes due; owners cannot.
  *   **Vs. Future Owner Trusts:** You cannot vote on behalf of a principal who has not authorized you. A "trust" for future owners requires a trustee. If the Board is the trustee, you have created a circular loop where the Board votes for itself to represent people who might hate the Board's decisions. If the Developer is the trustee, you have the current conflict of interest.

  **Conclusion on Voting Rights:** The "One Deed, One Vote" status quo is actually the most principled position, *provided* "Deed" implies "Financial Liability." It aligns control with the party that cannot walk away from the consequences.

  ### 2. The Real Problem: The Developer Asymmetry

  You have correctly identified that "One Deed, One Vote" is a stable Schelling point, but you are worried it is unfair. It is not unfair regarding the tenants. **It is dangerous regarding the Developer.**

  The Developer is an owner. They hold the deed. They bear the liability *until sale*. Therefore, under the Residual Claimant principle, they *should* vote.

  **However,** their incentive horizon is misaligned with the HOA's lifespan.
  *   **HOA Horizon:** 50+ years (building longevity).
  *   **Developer Horizon:** 2–5 years (sell-out period).

  The Developer is not "standing in" for future owners. They are a speculator holding inventory. Their goal is to minimize *current* carrying costs to keep units marketable or profitable *now*. They do not care if a special assessment hits in Year 6, because they plan to be out by Year 3.

  This is not a voting rights problem; it is a **fiduciary conflict problem**.

  ### 3. Addressing the "Who Counts" Paradox

  You asked: *Is there a principled way to settle who should get a vote... or is the problem genuinely unfixable in principle?*

  It is fixable, but only if you reject "fairness" as the metric and adopt "incentive compatibility" as the metric.

  Your suspicion that every proposal smuggles in an answer is correct. That is not a bug; it is a feature of constitutional design. You *must* smuggle in an answer. The question is whether the smuggled answer is **arbitrary** or **structural**.
  *   **Arbitrary:** "Tenants should vote because it feels democratic." (Ignores financial risk).
  *   **Structural:** "Owners vote because they hold the liability." (Aligns control with risk).

  The "One Deed, One Vote" rule is structurally sound *except* for the transition period of a phased development. Most well-drafted bylaws anticipate this by including a "Turnover Provision" that limits the Developer's voting weight on long-term capital issues once a certain percentage of units are sold (e.g., Developer loses majority control at 50% sold, even if they hold 40% of the deeds).

  If your bylaws lack this, you are in a "Constitutional Gap." You cannot change the voting rights easily (usually requires a supermajority the Developer can block). You must work within the fiduciary constraints.

  ### 4. Strategic Resolution for the Board

  You are facing a 15-year reserve plan. This is the flashpoint. The Developer will vote against high reserves (increases their HOA fees on unsold units, making unsold units less attractive to buyers who see high fees). The Owner-Occupiers want high reserves (protects equity).

  Here is the principled path forward:

  **A. Do Not Fight for Tenant Voting.**
  It weakens the Board's legal standing. It conflates *governance* with *habitation*. If tenants want influence, they must lobby their landlords (the investor-owners). This preserves the link between liability and control.

  **B. Do Not Fight for a "Trust" for Future Owners.**
  It is legally unenforceable and creates a governance vacuum.

  **C. Fight on Fiduciary Duty, Not Voting Rights.**
  The Board has a fiduciary duty to the **Association as a corporate entity**, not to the current voters.
  *   If the Board approves a reserve plan that is actuarially unsound (too low) just to satisfy the Developer's short-term cost cutting, the Board is personally liable for negligence when the roof fails in Year 7.
  *   The Board must vote based on the **engineering and financial reality**, not the voting math.
  *   If the Developer votes against a necessary reserve plan, the Board should record the dissent. The Board's duty is to the *solvency of the HOA*, not the *preferences of the majority voter*.

  **D. The "Poison Pill" Defense.**
  If the Developer uses their 28% block to vote down a necessary reserve study, the Board must formally document that this decision exposes the Association to special assessments.
  *   **Disclosure:** When the Developer sells the remaining 12 units, they are legally required to disclose HOA financials.
  *   **Leverage:** If the Board forces a vote where the Developer blocks adequate funding, the Board creates a public record that the Developer *chose* underfunding. This lowers the market value of the Developer's remaining units because savvy buyers will see the looming special assessment risk.
  *   **Alignment:** This forces the Developer's self-interest to align with the HOA's interest. To sell their units at a premium, they *need* the HOA to be well-funded. By blocking funding, they are devaluing their own inventory.

  ### 5. Final Verdict

  **Is the problem unfixable in principle?**
  No. The principle is **Risk-Weighted Governance**.

  **Who should vote?**
  Current deed holders (Owners + Developer).
  *   **Why:** They are the only parties who cannot exit the financial consequences of the decision without loss.
  *   **Why not Tenants:** They have an exit option (lease end).
  *   **Why not Future Owners:** They are not yet parties to the contract.

  **How to handle the Developer Conflict?**
  Do not try to strip their vote (litigation suicide). Instead, use **transparency as a weapon**.
  1.  Commission an independent reserve study.
  2.  Bring the funding plan required by that study to a vote.
  3.  If the Developer votes it down to save carrying costs, minute the meeting explicitly: *"Motion failed due to Developer opposition. Board notes this increases risk of special assessments for future owners of unsold units."*
  4.  Require this disclosure be attached to resale certificates for the 12 unsold units.

  This solves the "future owner" problem not by giving them a vote they can't cast, but by forcing their current proxy (the Developer) to internalize the cost of ignoring their interests. It turns the Developer's short-term incentive (sell high) against their short-term cost-cutting (low fees).

  **Summary:**
  Keep "One Deed, One Vote." It is the only rule that aligns authority with liability. The injustice you feel is not about *who votes*, but about the *transition period* inherent in phased developments. You cannot solve that by expanding the electorate to non-liable parties. You solve it by enforcing strict fiduciary transparency that makes it expensive for the Developer to vote against the long-term health of the asset.

  The "Schelling point" of property ownership is not just convenient; it is the only anchor that prevents the HOA from becoming a wealth transfer scheme between transient tenants and trapped equity holders. Defend the principle, but police the incentives.
