      *   **Camp 2: The Multiverse/Pluralists (It's indeterminate).**
          *   *Motivation:* The concept of "set" is not sharp enough to dictate a unique universe. Forcing (Cohen's method) shows we can easily create worlds where CH is true and worlds where it's false.
          *   *Arguments:*
              *   Hamkins' Set-Theoretic Multiverse: There is no single $V$. There are many universes. CH is true in some, false in others. Asking "Is CH true?" is like asking "Is the capital of France in Europe?" without specifying which Earth you're on (bad analogy, better: "Is $x > 5$?" without specifying $x$).
