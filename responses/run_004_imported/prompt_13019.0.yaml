prompt: |-
  Harsanyi had a similar veil-of-ignorance-ish setup years before Rawls's original position became famous, except he used it to argue for something like average utilitarianism, not anything close to the difference principle. They're both basically asking "imagine you don't know who you'll end up being in society, now what do you pick," so why do they land on such different answers? What's the actual crux of the disagreement in how each of them sets up the choice problem, and who's version do you think actually holds up better as reasoning under uncertainty?
reasoning: |-
  Here's a thinking process that leads to the comparison between Harsanyi and Rawls:

  1.  **Deconstruct the Prompt:**
      *   **Core Subject:** Comparison between John Harsanyi's veil of ignorance (1953/1955) and John Rawls's Original Position (1971).
      *   **Observation:** Both use a similar setup (uncertainty about one's future identity in society).
