      *   *Actually, let's keep it simpler.* A person trying to maintain a flame in a storm. Or just a person feeling disconnected from their reflection/actions.
      *   *Decision:* **The Pottery Class.** Clay (fuel) vs. Potter (fire/agent). No, too crafty.
      *   *Decision:* **The Runner.** Body (fuel) vs. Runner (self). Injured knee.
      *   *Decision:* **The Office Cleanout.** Elias is clearing his desk. The objects (fuel) define the job (fire).
      *   *Let's go with the Campfire.* It's the most direct imagery for Fire/Fuel. Setting: A backyard, evening. Character: Arthur. He is retiring. He is burning old files.
      *   *Wait, the prompt says "no monks, no meditation cushions, nothing Orientalist."* A campfire is fine.
      *   *Plot:* Arthur tries to light a fire. He struggles. He thinks about who he is without his job.
      *   *Tetralemma Integration:*
          1.  *Identity:* Am I my job? (Fire = Fuel). If I am the job, when the job ends, I end. (Too nihilistic).
          2.  *Difference:* Am I separate from the job? (Fire != Fuel). If I'm separate, why does losing it hurt? Why can't I function without it?
          3.  *Both/Neither:* The confusion.
          4.  *Resolution:* The fire burns conventionally. He is still Arthur, just not "Boss Arthur." Emptiness allows change.

      *   *Critique:* Burning files is a bit cliché. Let's make it about a relationship. A breakup.
      *   *Revised Plot:* Sarah is packing up her ex's stuff. She is defining herself as "Partner." Now she is "Single."
      *   *Revised Plot 2:* David is watching his son sleep. He feels responsible (Fire) for the boy (Fuel).
      *   *Revised Plot 3 (Winner):* **The Restoration.** A woman named Claire is restoring an old house. She is the agent (fire), the house is the object (fuel). But she lives in it. She is becoming the house. She hurts her hand. The hammer feels heavy.
      *   *Actually, let's go with the **Chef** idea but make it mundane.* A home cook making dinner for guests. She wants to be "The Host." The dinner is the fuel.
      *   *Let's try a **Musician**.* Tuning an instrument.
      *   *Okay, let's settle on **The Runner**.* It's physical. Body vs. Self.
      *   *Wait, the prompt asks for "self vs aggregates (memories, body, role, relationships)."*
      *   *Let's try a **Job Interview**.* No, too active.
      *   *Let's try **The Commute**.* A person on a train. Looking at reflection.
      *   *Let's try **The Hospital Waiting Room**.* High stakes. Identity shifts.
      *   *Let's go with **The Garden**.* Pruning. Fire isn't there.
