      *   *Alternative:* A man named David watching his daughter play soccer. He identifies as "Soccer Dad."
      *   *Alternative:* A person trying to light a stubborn campfire. It's literal fire/fuel. It allows for the metaphor without being preachy.
      *   *Refinement:* Let's use the campfire idea but make it about the *person* lighting it. Mark. He's dealing with grief or identity loss. Let's say he's retiring. He's trying to light a fire to burn old papers? No, too dramatic.
