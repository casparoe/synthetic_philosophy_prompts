      *   *Check:* Is the setting ordinary? Yes, backyard.
      *   *Check:* Is the logic clear? I need to make sure the reader can trace the tetralemma steps if they know it, but feel the confusion/release if they don't.

      *(Self-Correction)*: I need to be careful not to make Marcus sound like he's *thinking* the philosophy. He needs to *experience* the collapse of the categories. The narrative voice can carry the structural weight.

      *Plan:*
      1.  Marcus stacking wood (Fuel).
      2.  Lighting match (Fire).
      3.  Reflection on his divorce (Self vs. Role).
      4.  The logic of the fire (Same? Different?).
