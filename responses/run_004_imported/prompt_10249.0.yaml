  8.  **Final Polish:** Check word count and flow. Ensure the "Two Truths" landing is clear—the fire warms him *conventionally*, even if it's empty *ultimately*.

  *(Drafting thought)*: Let's make the "fuel" the pile of old letters or photos he's burning? No, that's too explicit. Let the wood be the fuel. The marriage is the metaphorical fuel.
  Actually, let's make the "fuel" the *body* and the "fire" the *life/consciousness*. He's recovering from an illness? No, divorce is more relatable for "identity loss."
