      *   **Horn 1 (Identity):** He thinks about his ex. Was he "Husband"? If he *was* the husband, and that's gone, is he gone? He looks at the ring (fuel).
      *   **Horn 2 (Difference):** If he is *not* the husband, why does the absence burn? If self is separate from role, the role shouldn't affect him. But it does.
      *   **Horn 3 & 4 (Both/Neither):** The confusion. The smoke.
      *   **Resolution (Two Truths):** The fire burns his hand accidentally. Pain is real (conventional). But who is in pain? Just the process. He feels relief that he doesn't have to hold onto a solid "self" that is broken. He is just the flowing experience.
      *   **Ending:** He goes inside. Life continues. Not nihilism, but lightness.

  5.  **Refining the Logic Embedding:**
      *   Need to ensure the "Fire/Fuel" analogy maps to "Self/Aggregates" clearly but subtly.
