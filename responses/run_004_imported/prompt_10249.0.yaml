          *   He looks at the fire. Is the fire the wood? (Identity). No, wood remains, fire goes out.
          *   Is the fire separate? (Difference). No, no wood, no fire.
          *   He applies this to himself. Is he his grief? Is he separate from his grief?
          *   Resolution: The fire warms him (conventional truth) even if it has no essence (ultimate truth). He is still cold, still warm, still there.

