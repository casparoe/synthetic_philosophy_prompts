answer: |-
  The wind off the lake cut through Marcus's sweater as he crouched by the fire pit. It was November, the kind of cold that made you want to be inside, but the backyard needed cleaning. He stacked the logs—dry oak, split last summer—into a teepee structure. They were just objects until he struck the match.

  He'd been alone in the house for three months. Since Elena left. Since the title of "Husband" was revoked, like a license expired.

  Marcus touched the match to the kindling. The flame caught, licking at the bark. He watched it, mesmerized. He was trying to locate himself in the scene. Where was the "Marcus" here? Was he the body crouching in the cold? Or was he the thing observing the cold?

  He looked at the fire. Was the fire the same thing as the wood? If the fire *was* the wood, then the wood should be burning all the time, even before he lit it. But it was just cold timber. So the fire wasn't the wood.

  He poked the logs with an iron rod. Sparks flew. If the fire were totally separate from the wood, independent, then it shouldn't need the wood to exist. It should be able to burn in the empty air above the pit. But when the wood turned to ash, the fire died. It depended on the fuel. So the fire wasn't separate from the wood either.

  Not the same. Not different.

  Marcus felt a familiar tightness in his chest. He applied the poker to his own life. Was he his grief? If he *was* the grief, then he would cease to exist when the grief ended. He would be extinguished like the flame. That felt like death. But if he were totally separate from the grief—if his self were a distinct, solid entity untouched by his life—then why did the divorce feel like an amputation? Why did the empty side of the bed pull at him physically?

  If he was the husband, and he wasn't one anymore, he was nothing. If he wasn't the husband, why did the loss define him?

  He reached for another log. His hand trembled. He wasn't looking for a philosophical answer; he was looking for warmth. He wanted to know if he was allowed to still be here, functioning, without the foundation that had held him up for ten years.

  The flame shifted. A log collapsed, sending a shower of embers upward. One landed on his thumb.

  "Damn it."

  He jerked back, shaking his hand. The pain was sharp, immediate, and undeniable. It wasn't a concept. It was a signal firing through nerves, a biological alarm.

  He stared at the red spot on his skin. Here was the thing he kept missing. The pain was real. The burn was real. The warmth on his face was real. But where was the "Burner"? Where was the "Hurter"?

  There was just the burning. There was just the pain. There was no little man inside his head holding the thumb and shouting *Ouch*. There was only the process of injury and the reaction of awareness.

  He looked back at the fire. It wasn't a *thing*. You couldn't grab a handful of fire. It was a process dependent on the wood, the oxygen, the heat. It was empty of any fixed substance. And yet, it cooked the marshmallows. It warmed the hands. It kept the wolves away.

  It functioned *because* it was empty. If the fire were a solid, permanent object, it couldn't change. It couldn't grow, shrink, or warm him. It would just be a statue of fire. Because it had no inherent self-nature, it could interact with the world.

  Marcus sat back on his heels. The cold air hit his sweatshirt, but the front of him was hot.

  He thought about Elena. He thought about the job he was returning to on Monday. He thought about the mortgage. These were the fuel. They were the conditions that allowed the "Marcus" phenomenon to appear. Without them, there was no Marcus. But he wasn't *trapped* by them either. He wasn't identical to them. He could change jobs. He could move houses. The fire could jump to a new log.

  The vertigo hit him then, the same feeling he got when looking down from a high balcony. The ground beneath his identity wasn't solid rock; it was a mesh of dependencies, shifting and interlocking. There was no core self to protect, no solid ego to defend against the failure of the marriage. There was just this: the breathing, the heat, the pain in the thumb, the memory of Elena's laugh rising with the smoke.

  If nothing had a solid self, then nothing was truly broken. The marriage hadn't shattered a permanent entity; it had just changed the conditions. The fuel had changed. The fire had to adjust.

  He wasn't nothing. That was the trap. Emptiness wasn't a void where things disappeared; it was the space that allowed things to happen. If he were solid, he couldn't heal. If the world were solid, it couldn't change.

  Marcus stood up. His knees popped. The sound was loud in the quiet yard. He walked to the patio door and slid it open. The warmth from the house hit him, distinct from the fire's heat. He turned off the backyard light, leaving the fire to burn down on its own.

  He walked into the kitchen and ran cold water over his thumb. The pain subsided to a throb. He dried his hand and opened the fridge. There was leftover pasta. He was hungry.

  He put a plate in the microwave. He wasn't happy, exactly. He wasn't sad. He was just here, dependent on the electricity, the food, the house, the body that felt hunger. He set the timer for two minutes.

  The microwave hummed. The fire outside crackled. Marcus leaned against the counter and waited for the bell to ring, ready to eat, ready to be whatever came next.
