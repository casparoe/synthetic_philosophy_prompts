      *   *Part (c):* Significant deduction. The student misses Anscombe's actual response to the pacifism objection (which is that one can fight justly without intending civilian death). The student argues Anscombe's view *is* proportionality, which is exactly what she denies.
      *   *Overall:* Highlight the tension between (a)/(b) and (c). The student understands the DDE application but falls back into consequentialist reasoning in the critique.

