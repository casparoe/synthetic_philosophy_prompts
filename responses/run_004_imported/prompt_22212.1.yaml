  8.  **Final Polish:** Check the explanation for the partner. The partner knows code/logic but not philosophy. The comments should explain *why* the proportionality point is a logic error in the context of Anscombe's system (i.e., it changes the type of moral reasoning).

      *Self-Correction on Grading Scale:* Since this is an MA level module, standards are high. A fundamental misreading of the primary author's position in part (c) should be penalized heavily. However, parts (a) and (b) are quite good. 20/30 feels fair. It acknowledges the good work but penalizes the conceptual collapse in the final section.

