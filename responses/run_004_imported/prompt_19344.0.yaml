answer: |-
  The glass of the urn catches the overhead light, a sterile gleam against the dark wood of the table. Inside, ninety balls sit in a silent, opaque heap. Thirty are Red. Sixty are a mix of Black and Yellow. No one knows the ratio.

  Elias taps the glass with a manicured fingernail. He's wearing a suit that costs more than the table. Mara leans against the edge, arms crossed, watching the balls, not the man.

  "Thirty Reds," Elias says. "One third. Precise. The other sixty... let's call them the Void. Black or Yellow. You could have sixty Blacks and zero Yellows. You could have zero Blacks. The probability distribution over that sixty is undefined."

  "Knightian uncertainty," Mara says. "I know the setup, Elias."

  "Then act like it. We're placing the bets. Game One: I pay you a hundred if a Red ball comes out. Or, I pay you a hundred if a Black ball comes out. Same payout. Which do you take?"

  Mara doesn't hesitate. "Red."

  Elias nods, expecting this. "Because Red is 33.3%. Black is... something. You're ambiguity averse. You prefer the known risk to the unknown. Fine. Game Two: I pay you a hundred if Red *or* Yellow comes out. Or, I pay you a hundred if Black *or* Yellow comes out. Which do you take?"

  "Black or Yellow," Mara says.

  "Sixty balls," Elias says. "Two thirds. Versus the Red-Yellow combo, which is also unknown. So in the first game, you bet on the 30. In the second game, you bet on the 60. You're treating the Yellow ball as if it counts for nothing in the first game, but everything in the second."

  "I'm treating the *information* as the asset," Mara corrects. "In Game One, Red has a known weight. Black is a guess. In Game Two, Black-plus-Yellow has a known weight. Red-plus-Yellow is a guess. I'm consistent. I always bet on the known weight."

  "You're violating the Sure-Thing Principle," Elias says, his voice tightening. "Savage proved that if you prefer Red over Black, you must prefer Red-plus-Yellow over Black-plus-Yellow. The Yellow ball is common to both options in the second game. It should cancel out. It's irrelevant. By letting the presence of an irrelevant outcome flip your preference, you're incoherent."

  "I'm not incoherent. I'm robust."

  "You're a money pump." Elias steps closer, lowering his voice. "Howard Raiffa laid this out decades ago. Let's say you hold a bet on Black. I know you prefer Red. So I offer to trade you your Black ticket for a Red ticket, plus I charge you a dollar fee. You take it, because you prefer Red. Now you hold Red. But wait—you just told me you prefer Black-plus-Yellow over Red-plus-Yellow. That implies that if we add a Yellow ball to the mix, Black is better. So I offer to trade your Red ticket for a Black ticket, charge you another dollar. You take it. You're back where you started, holding Black, but you're two dollars poorer. I can do this forever. I can drain your bank account without ever spinning the urn."

  Mara pushes off the table. She walks around to the front of the urn, looking down into the mix of colors.

  "The Dutch Book argument," she says. "It's the Bayesian's nuclear option. If your probabilities don't sum to one, or if your preferences cycle, a clever bookie can bankrupt you."

  "It's not just an argument, Mara. It's a proof. It demonstrates that your decision rule is logically inconsistent. You're admitting to preferences that guarantee a loss in a sure-thing world."

  "But this isn't a sure-thing world," Mara says, turning to face him. "That's the point you're missing. The Dutch Book requires a bookie who knows the odds better than the bettor. For me to get pumped, *you* have to know the true composition of the urn."

  Elias blinks. "I'm the one offering the bet. I can set the terms."

  "You can set the payouts. But do you know how many Black balls are in there?"

  "No. That's the definition of the Ellsberg urn. The split is unknown."

  "Exactly." Mara holds up a hand. "If you don't know the split, you can't construct the pump. To pump me, you need to know that Black is actually the better bet, or that Red is, so you can swap me back and forth profitably. But if the split is truly unknown to *everyone*—including the house—then there is no arbitrage. There is no 'true' probability to exploit. You're trying to apply a coherence theorem designed for closed logical systems to an open epistemic problem."

  Elias shakes his head. "That's a dodge. The inconsistency is in *your* head, not the urn. Even if I don't know the odds, *you* are assigning implicit probabilities by your choices. You're acting as if P(Red) > P(Black) AND P(Black+Yellow) > P(Red+Yellow). Mathematically, that implies P(Yellow) is both negative and positive. You can't escape the algebra."

  "I'm not doing algebra, Elias. I'm managing model risk." Mara steps up to the urn. "Your Savage axioms assume that 'uncertainty' can always be reduced to a subjective prior. You think I can just look at this urn, feel a vibe, and assign a 50/50 split to the Black and Yellow balls, and then proceed as if that's truth. That's the Bayesian leap. You turn ignorance into a number so you can maximize expected utility."

  "It's the only way to make a decision," Elias counters. "If you don't assign a prior, you're paralyzed."

  "I'm not paralyzed. I'm using Maxmin Expected Utility. I have a *set* of priors. For the Black-Yellow split, my set ranges from 0 to 60 Blacks. I evaluate my bet based on the worst-case prior in that set. In Game One, the worst case for Black is 0 Blacks. The worst case for Red is 30 Reds. 30 is better than 0. I pick Red. In Game Two, the worst case for Red+Yellow is 30 (if Yellow is 0). The worst case for Black+Yellow is 60 (if Black is 60). 60 is better than 30. I pick Black+Yellow."

  "You're maximizing the minimum," Elias says. "I know the model. But it comes at the cost of dynamic consistency. If you know you're going to be money-pumped, rationality dictates you should pre-commit to avoid the trades. But if you pre-commit, you're admitting your preferences are wrong."

  "Or," Mara says, "I'm admitting that *your* definition of rationality is too narrow. You define rationality as internal consistency of beliefs. I define it as survival in an environment where the rules might change. The 'cost' of the Dutch Book—the dollars I'd lose if a bookie appeared—is actually an insurance premium. I am willing to pay a small price to avoid the catastrophic risk of relying on a subjective prior that has no evidentiary basis."

  She puts her hand on the glass.

  "Raiffa's money pump assumes I'm playing against a market that corrects my errors. But in situations of true ambiguity—war, climate change, new markets—there is no market. There is no bookie who knows the truth. There is only the fog. In the fog, the Sure-Thing Principle fails because the 'states of the world' aren't separable. The ambiguity is part of the state. When I choose Red, I'm not just betting on the ball. I'm betting on the reliability of the information. You can't factor that out."

  Elias is quiet for a moment. He looks at the urn, then back to her. He doesn't look convinced, but he looks engaged.

  "So you're saying the axioms of Savage are normative only when the ambiguity is resolvable," Elias says slowly. "When the uncertainty is Knightian, the cost of consistency exceeds the cost of incoherence."

  "I'm saying coherence is a luxury of the informed," Mara says. "You have a single prior. I have a set. You maximize expectation. I maximize robustness. If a bookie shows up who knows the composition of the urn, the game changes. It's no longer Ellsberg. It's Risk. And if it's Risk, I'll play by your rules. I'll become a Bayesian. But as long as this urn stays opaque, I won't pretend I know what I don't know just to satisfy your algebra."

  Elias exhales, a sharp sound through his nose. He reaches into his jacket and pulls out a notepad.

  "Fine. Game One. You take Red. I'll take Black."

  "Game Two," Mara says. "I take Black or Yellow. You take Red or Yellow."

  "I'm going to take your money on the second one," Elias says, writing down the wager. "Statistically, over enough iterations, the Law of Large Numbers favors the known distribution."

  "There are no iterations," Mara says, picking up her pen. "There's just this urn. And right now, I trust the sixty more than I trust the guess."

  "And I trust the logic more than I trust the fear," Elias replies.

  They sign the sheet. The urn sits between them, ninety balls, silent and opaque, holding the truth that neither of them can see.
