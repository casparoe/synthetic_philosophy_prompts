  5.  **Refining the "Amsterdam" Detail:**
      *   Make sure to cite the specific finding: Pinto et al. found that patients could integrate information across hemifields in ways the classic model said was impossible (e.g., responding to stimuli presented to both fields simultaneously with accurate coordination). This suggests subcortical pathways or residual integration maintain unity.

  6.  **Refining the Nagel Point:**
      *   Nagel argued that we lack the conceptual framework. I need to use this to bolster the "nuanced commitment" rather than as an excuse to avoid committing. I'll use it to say: "Nagel was right that our language fails, but wrong to think we can't make a best-guess ontological call."

