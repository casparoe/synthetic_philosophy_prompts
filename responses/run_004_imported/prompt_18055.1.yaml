prompt: |-
  I've been down a bit of a rabbit hole lately reading about the history of gay rights in England, and I found out that Jeremy Bentham (the utilitarianism guy, the one whose actual preserved body is still sitting in a glass case at a university in London, dressed in his own clothes) apparently wrote a whole secret essay around 1785 arguing that sodomy shouldn't be treated as a capital crime. He was so nervous about the reaction that he never published it in his lifetime, it only came out properly like two hundred years later. I mentioned this to a friend who actually studied some philosophy in uni and even she'd never heard of it, so now I'm just poking around the actual text on my own with no idea what I'm doing.

  Theres a bit that's been bugging me for days. He's working through whether the "offence" actually causes any harm to anyone, and he writes:

  "As to any primary mischief, it is evident that it produces no pain in anyone. On the contrary it produces pleasure, and that a pleasure which, by their perverted taste, is by this supposition preferred to that pleasure which is in general reputed the greatest. The partners are both willing. If either of them be unwilling, the act is not that which we have here in view: it is an offence totally different in its nature of effects: it is a personal injury; it is a kind of rape. As to any secondary mischief, it produces not any pain of apprehension. For what is there in it for any body to be afraid of? By the supposition, those only are the objects of it who choose to be so, who find a pleasure, for so it seems they do, in being so. As to any danger exclusive of pain, the danger, if any, must consist in the tendency of the example. But what is the tendency of this example? To dispose others to engage in the same practises: but this practise for anything that has yet appeared produces not pain of any kind to any one."

  What I can't figure out is whether there's a real argument doing work here or if it's just a checklist rigged to come out his way: no direct pain (check), no fear caused to bystanders (check), and then he even invents a third category, harm through "bad example," just so he can knock that down too with the exact same "well it still doesn't hurt anyone" move. Is "primary mischief" versus "secondary mischief" an actual distinction from his wider utilitarian system that's doing real logical work here, or is he just relabeling "there's no victim" three times in a row and calling it an argument? And what am I supposed to make of him casually calling it "their perverted taste" right in the middle of a paragraph defending it - is that a slip that undercuts the whole thing, or is he doing something more deliberate where he can personally find an act distasteful and still think its wrong to punish people for doing it? I don't have any background in this stuff so I'd really appreciate someone walking through what's actually going on logically in this passage.
