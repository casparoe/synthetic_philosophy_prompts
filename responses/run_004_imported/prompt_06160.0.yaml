  so in my philosophy of science class we're on the causation unit and today's example was simpson's paradox — the classic berkeley grad admissions case where women had a lower admit rate overall back in the 70s but equal or higher rates within almost every individual department once you break it down by dept. the prof's takeaway was basically that this is the general lesson of simpson's paradox: the aggregate number is kind of "fake" because its hiding a confound, so anytime a trend flips after you split into subgroups, the subgroup version is the one that actually reflects whats causally true. i've gotta post a short response connecting this to the causation readings and was just gonna write "simpson's paradox shows you should always trust the disaggregated data over the aggregate, no exceptions" — does that seem like a solid takeaway or am i missing some nuance there?
