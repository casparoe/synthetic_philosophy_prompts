prompt: |-
  I'm working on a piece about how people misuse old philosophical arguments to cope with fear of death, so I actually went back to the source instead of just the one-liner everyone recycles. Found this in an old (1925-ish) public domain translation of Epicurus's letter to Menoeceus, and the phrasing is pretty stiff:

  "Accustom yourself to believe that death is nothing to us, for good and evil imply awareness, and death is the privation of all awareness; therefore a right understanding that death is nothing to us makes the mortality of life enjoyable, not by adding to life an unlimited time, but by taking away the yearning after immortality. For life has no terror; for those who thoroughly apprehend that there are no terrors for them in ceasing to live. Foolish, therefore, is the person who says that he fears death, not because it will pain when it comes, but because it pains in the prospect. Whatever causes no annoyance when it is present, causes only a groundless pain in the expectation. Death, therefore, the most awful of evils, is nothing to us, seeing that, when we are, death is not come, and, when death is come, we are not."

  Reading it slow, it kind of seems like theres two different arguments mashed together here - one about good/evil requiring awareness, and a separate one about timing (we're never around at the same moment as our own death, so it can't touch us). Are those the same move dressed up twice, or genuinely different arguments? And if they're different, is one obviously doing more of the actual logical work than the other, or does the whole thing collapse if you pull either one out? Trying to get the argument itself right before i write about it, not just repeat the vibe.
