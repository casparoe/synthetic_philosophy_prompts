answer: |-
  This is a bold and potentially exciting thesis argument, but it carries significant risk. If you proceed with the claim that Aquinas endorses **private** tyrannicide ("any private citizen has standing to kill him") as a straightforward right, you are walking into a minefield of textual and historiographical contestation.

  Here is a breakdown of why historians of political thought usually tell the story differently, the specific textual problems with your reading of *De Regimine Principum*, and how you might salvage the genealogy without compromising your scholarly credibility.

  ### 1. The Textual Reality Check
  Your interpretation of *De Regimine Principum* (On Kingship) I.6 is the weak link in this chain. The standard Latin text and the dominant scholarly consensus contradict the idea that Aquinas grants standing to *any private citizen*.

  *   **Public vs. Private Authority:** In *De Regimine Principum* I.6, Aquinas explicitly argues against private initiative. He writes that proceeding against a tyrant should not be done *"per praesumptionem aliquorum privatorum"* (through the presumption of certain private individuals), but rather by **public authority** (*auctoritate publica*).
  *   **The Risk of Sedition:** Aquinas argues that private assassination often leads to greater tyranny (as successors retaliate) or civil disorder. He prioritizes the peace of the community over the removal of the tyrant if the removal method endangers the community.
  *   **Summa Theologiae:** In *ST* II-II, Q. 42, A. 2, Aquinas defines sedition as a special sin opposed to the unity of the multitude. While he allows that a tyrant's rule is not just, he is extremely wary of actions that disrupt the political order.
  *   **The Ptolemy Problem:** *De Regimine Principum* is textually composite. Book I is generally accepted as Aquinas. **Book II is widely attributed to his student, Ptolemy of Lucca.** Ptolemy is much more republican and resistant to tyranny than Aquinas. If your reading relies on passages found in Book II, you are citing Ptolemy, not Aquinas. Even in Book I, the "private citizen" reading is a hard sell.

  **The Nuance:** Aquinas *does* argue that a tyrant forfeits his claim to obedience (voiding the duty), but he does not automatically grant a license for private violence. He suggests recourse to a superior authority (e.g., the Emperor over a King, or the Pope over both). If no human remedy exists, he says we must turn to God, not necessarily to the dagger.

  ### 2. Why Historians Tell the Story Differently
  Historians (like Quentin Skinner, J.P. Canning, Cary Nederman, or Richard Tuck) usually position Aquinas as a **theoretical foundation** for resistance, but not a **practical advocate** for revolution in the liberal sense.

  *   **Anachronism of "Rights":** The "liberal right of revolution" implies an individual entitlement. Medieval thought is corporate. Resistance is usually legitimized through the *populus* as a corporate body, represented by magistrates or estates, not by atomized individuals.
  *   **The John of Paris Gap:** If you are building a genealogy from Aquinas to Salamanca, you are skipping the crucial bridge: **John of Paris (Jean Quidort)**. Writing in 1302 (*De Potestate Regia et Papali*), John is the one who radicalizes Aquinas. He argues that the community creates the king and can depose him. Most genealogies run: Aquinas (principle) $\rightarrow$ John of Paris (mechanism) $\rightarrow$ Conciliarists $\rightarrow$ Salamanca $\rightarrow$ Monarchomachs.
  *   **Passive vs. Active:** Historians distinguish between *passive resistance* (refusing to obey unjust laws, which Aquinas allows) and *active resistance* (deposing/killing the ruler, which Aquinas restricts). Locke merges these; Aquinas keeps them distinct.

  ### 3. Strategic Advice for Your Dissertation
  You can still make Aquinas your anchor, but you need to adjust the claim to survive examination.

  **Option A: The "Seed" Argument (Safer)**
  Argue that Aquinas provides the **ontological condition** for revolution (tyranny dissolves the political bond), even if he is cautious about the **agency** (who pulls the trigger).
  *   *Claim:* Aquinas breaks the divine right seal by making kingship conditional on the common good.
  *   *Genealogy:* Aquinas establishes that tyranny is *de facto* non-rule $\rightarrow$ Salamanca/Monarchomachs solve the "who acts?" problem by shifting agency to the people/magistrates $\rightarrow$ Locke individualizes that agency.
  *   *Benefit:* This acknowledges the textual nuance while keeping Aquinas as the origin point of the *theory*.

  **Option B: The "Radical Recovery" Argument (High Risk/High Reward)**
  If you are committed to the "private citizen" reading, you must address the counter-evidence head-on.
  *   *Requirement:* You need to explain why *De Regimine* I.6 says "public authority" but implies private standing in extreme cases. Some scholars argue that if a tyrant is a **usurper** (tyrant without title) rather than a legitimate ruler gone bad (tyrant by exercise), Aquinas allows private action.
  *   *Requirement:* You must distinguish between *sedition* (sinful disruption) and *tyrannicide* (just removal).
  *   *Warning:* Examiners familiar with Thomistic political theory will likely challenge this. You would need to lean heavily on specific commentaries (perhaps later Thomist interpretations that read him radically) to support this.

  **Option C: Insert John of Paris**
  Modify your genealogy to: **Aquinas $\rightarrow$ John of Paris $\rightarrow$ Salamanca $\rightarrow$ Monarchomachs $\rightarrow$ Locke.**
  *   This shows historiographical sophistication. It acknowledges that Aquinas was the *source*, but John of Paris was the first *radicalizer*. It protects you from the charge of misreading Aquinas while maintaining the continuity of the tradition.

  ### 4. Recommended Secondary Literature to Consult
  Before finalizing this chapter, check your reading against these specific works:
  *   **Quentin Skinner, *The Foundations of Modern Political Thought* (Vol 1):** Look at his treatment of the Monarchomachs and how he distinguishes them from earlier scholastics.
  *   **Cary Nederman, *Worlds of Difference*:** Excellent on medieval resistance and the corporate nature of the community.
  *   **J.P. Canning, *Ideas of Power in the Late Middle Ages*:** Specifically covers the transition from Aquinas to the Conciliarists.
  *   **John Finnis, *Aquinas: Moral, Political, and Legal Theory*:** A modern Thomist reading that will give you the "orthodox" counter-argument to your radical claim.
  *   **Arthur McGrade, *The Political Thought of William of Ockham*:** Often discusses the context of medieval resistance alongside Aquinas.

  ### Summary
  If you claim Aquinas endorses **private** regicide "full stop, no further conditions," you will likely be challenged on the text of *De Regimine* I.6.

  **Recommendation:** Treat Aquinas as the origin of the **principle** (tyranny voids authority) but acknowledge that the **practice** (who may resist) was radicalized by his successors (John of Paris, Salamanca, Monarchomachs). This allows you to keep your genealogy intact without making a textual claim that is easily falsified by the Latin. It makes your argument more nuanced and historically robust.
