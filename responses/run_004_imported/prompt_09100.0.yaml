      *   *Suggest nuance:* Maybe Aquinas plants the *seed* (tyranny voids authority), but the *mechanism* (private assassination) comes later (Salamanca/Monarchomachs).
      *   *Highlight the Ptolemy issue:* Ensure the user isn't quoting Book II as Aquinas.
      *   *Recommend Secondary Literature:* Skinner (*Foundations*), Nederman, Canning, Finnis (for a Thomist view), Tuck (*Natural Rights Theories*).
      *   *Strategic Advice:* If the user sticks to this gun, they need to address the counter-evidence head-on. If they soften it, the genealogy still works but Aquinas becomes the "theoretical foundation" rather than the "practical advocate."

  7.  **Refining the "Private Citizen" Point:**
