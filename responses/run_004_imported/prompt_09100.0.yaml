  okay so for my diss chapter on medieval resistance theory i've been using aquinas as the anchor for a genealogy that runs aquinas -> the salamanca theologians -> the monarchomachs -> locke. my read of De Regimine Principum is that once a ruler's conduct tips over into genuine tyranny, aquinas thinks any private citizen has standing to kill him -- tyranny just voids the duty to obey, full stop, no futher conditions attached. given that, should i be treating aquinas as a much earlier and more radical origin point for the 'liberal' right of revolution than he usually gets credit for, or is there a reason historians of political thought tell the story differently?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Claim:**
      *   **Topic:** Medieval resistance theory (Dissertation chapter).
      *   **Genealogy:** Aquinas $\rightarrow$ Salamanca (Vitoria/Suárez) $\rightarrow$ Monarchomachs $\rightarrow$ Locke.
      *   **Core Interpretation of Aquinas (*De Regimine Principum*):** Once a ruler becomes a tyrant, *any private citizen* has the standing to kill him. Tyranny voids the duty to obey "full stop, no further conditions attached."
      *   **Question:** Should I treat Aquinas as a more radical/earlier origin point for the 'liberal' right of revolution than historians usually do? Or is there a reason they tell the story differently?

  2.  **Initial Fact-Check & Scholarly Consensus:**
      *   *Text:* *De Regimine Principum* (On Kingship). Note: Book II is often attributed to Ptolemy of Lucca, not Aquinas, though Book I is generally accepted as Aquinas. The specific passage on tyranny is in Book I, Chapter 6 (and sometimes referenced in II, but the "private assassination" bit is the controversial one).
      *   *Standard Interpretation:* Aquinas *does* discuss tyranny. He *does* say tyranny is unjust. However, the standard scholarly view is that he is *cautious* about resistance. He generally prefers public authority or institutional mechanisms over private assassination.
      *   *The "Private Citizen" Claim:* This is the red flag. Most Aquinas scholars argue he explicitly *warns against* private individuals taking it upon themselves to kill a tyrant, unless there is some form of public authorization or unless the tyranny is so extreme it dissolves the political bond entirely (but even then, it's nuanced).
      *   *The Genealogy:* The Aquinas $\rightarrow$ Salamanca $\rightarrow$ Monarchomachs $\rightarrow$ Locke pipeline is a standard "Scholastic Natural Law" genealogy (often associated with figures like Skinner, Tuck, or older Whig interpretations). However, placing Aquinas as a *radical* proponent of private regicide is controversial.

  3.  **Evaluate the "Radical Aquinas" Thesis:**
      *   *Pros:* It makes for a bold dissertation argument. It challenges the "moderate Aquinas" narrative. It strengthens the continuity of the genealogy.
      *   *Cons:* It risks misreading the text. It ignores the context of *sedition* vs. *tyrannicide*. It overlooks the distinction between *public* and *private* authority in medieval thought. If the user is wrong about the text, the whole chapter collapses.

  4.  **Key Textual Evidence (*De Regimine Principum* I.6):**
      *   Aquinas argues that if a king becomes a tyrant, it is not for a private individual to kill him.
      *   Why? Because it endangers the community more (risk of civil war, retaliation).
      *   He suggests recourse to a superior authority (e.g., the Emperor over a King, or the Pope over both).
      *   If no human remedy exists, recourse is to God.
      *   *Crucial Nuance:* There is a passage (often debated) where he mentions that some tyrants have been killed by their subjects, but he doesn't explicitly *endorse* it as a universal right for *any* private citizen without qualification. In fact, in *Summa Theologiae* (II-II, Q. 42, A. 2), he condemns sedition.
      *   *Wait, check the specific claim:* The user says "any private citizen has standing to kill him." This is the strongest point of contention. Most scholars (e.g., Quentin Skinner, J.P. Canning, Cary Nederman) argue Aquinas is much more reserved. The *Monarchomachs* (like Hotman or Mornay) are the ones who radicalize the right of resistance, often *against* the earlier scholastic caution.

  5.  **Why Historians Tell the Story Differently:**
      *   **Context of Sedition:** Medieval political thought prioritizes order. Private violence is usually seen as sinful sedition.
      *   **Public vs. Private:** Authority resides in the *corporate* body (the *populus*), not individuals. Resistance is usually legitimized through representatives (estates, magistrates), not lone wolves.
      *   **Attribution Issues:** *De Regimine Principum* Book II is by Ptolemy of Lucca, who is more republican/resistance-oriented than Aquinas. Confusing the two leads to radicalizing Aquinas.
      *   **The "Tyrant" Definition:** Aquinas distinguishes between a usurper (tyrant without title) and a legitimate ruler who acts tyrannically (tyrant by exercise). Resistance is easier to justify against the former.
      *   **Whig History:** Older histories wanted to find "liberalism" early. Modern historians (Cambridge School, etc.) are careful about anachronism. "Right of revolution" is a Lockean/modern concept; applying it to Aquinas is risky.

  6.  **Formulating the Advice:**
