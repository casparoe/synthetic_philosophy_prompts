prompt: |-
  So in my World History class we've been doing a unit on medieval political philosophy and we spent like two days just on Aquinas and when (if ever) its ok to straight up kill a tyrant. My teacher explained that Aquinas actually treats two kinda seperate situations totally differently: if a guy just seizes power with no real legitimate claim to it (like a usurper), Aquinas is pretty chill with someone taking him out since he was never a rightful ruler to begin with, but if a ruler got his power the "legit" way and only turns tyrannical once he's already in charge, Aquinas gets way more cautious and basically says the community or some higher public authority needs to be the one to depose him, not some random private citizen, mainly bc he's worried it opens the door for ppl assassinating perfectly decent kings just by slapping the "tyrant" label on them.

  This turned into an argument with my friend Jonah at lunch bc we started talking about Hitler and the Stauffenberg plot (Operation Valkyrie, where those German officers tried to blow him up in 1944). Hitler got made Chancellor through sort of "legal" channels and then used the Enabling Act to grab absolute power, so which category does that put him in under Aquinas's logic -- a usurper, or a legit ruler who went bad? And depending on how you answer that, would Aquinas have actually been on Stauffenberg's side, or would he have said the plotters were out of line and should've waited on some public body to act instead? I don't just want a "well obviously Hitler was evil so of course tyrannicide is justified" answer, I want to know how Aquinas's actual criteria would sort out a case like that.
