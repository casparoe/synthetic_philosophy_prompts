prompt: |-
  For my school's effective altruism club, I've been reading about Toby Ord's concept of "moral trade," where two people with opposing moral views can each end up better off by their own lights by shifting their behavior toward what the other wants, in exchange for the other doing the same—something Ord presents as an attractive hedge against moral uncertainty, since none of us can be fully confident our own moral theory is correct. Please argue that moral trade is not actually well-defined as a form of mutually beneficial exchange, because determining whether a proposed trade leaves either party better off requires comparing amounts of value across rival moral theories, and no one has supplied a non-arbitrary way of making such intertheoretic comparisons. In particular, please address whether a merely ordinal ranking of outcomes within each theory could rescue the idea, or whether the objection really requires the comparisons to be cardinal and interpersonally meaningful.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** Toby Ord's concept of "moral trade" (from the Effective Altruism context).
      *   **Task:** Argue *against* the well-definedness of moral trade as mutually beneficial exchange.
      *   **Core Objection:** Determining "better off" requires intertheoretic value comparisons, which lack a non-arbitrary basis.
      *   **Specific Constraint:** Address whether merely ordinal rankings within theories can rescue the idea, or if the objection requires cardinal/interpersonal comparisons.
      *   **Target Audience:** School Effective Altruism (EA) club (implies a need for clarity, philosophical rigor, but accessibility).

  2.  **Deconstruct "Moral Trade":**
      *   *What is it?* Agent A holds Theory $T_1$, Agent B holds Theory $T_2$. $T_1$ prefers Outcome $X$, $T_2$ prefers Outcome $Y$. They agree: A does something favoring $Y$ (costly to $T_1$), B does something favoring $X$ (costly to $T_2$).
      *   *Claim:* Both are "better off" given their moral uncertainty.
      *   *Mechanism:* It treats moral theories like preferences in a market.

  3.  **Develop the Core Objection (The Intertheoretic Comparison Problem):**
      *   To say A is "better off," we need to compare the *loss* A incurs (acting against $T_1$) with the *gain* A receives (probability weight of $T_2$ being right increased/satisfied).
      *   But $T_1$ and $T_2$ speak different languages of value. Utilitarianism counts utils (hedons). Deontology counts duty violations. Virtue ethics counts character flaws.
      *   *The Unit Problem:* How many hedons equal one duty violation? There is no "moral currency."
      *   *The Scaling Problem:* Even if we map them, Utilitarianism might be scalable (double the happiness = double value), while Deontology might be binary (duty done or not).
      *   *Conclusion:* Without a common metric, "net benefit" is undefined.

  4.  **Address the Specific Constraint (Ordinal vs. Cardinal):**
      *   *Ordinal:* Theory $T_1$ ranks Outcomes $A > B > C$. Theory $T_2$ ranks $C > B > A$.
      *   *Can we trade on ordinal grounds?* In standard economics, trade works on ordinal preferences (I prefer apple to orange, you prefer orange to apple).
      *   *The Catch:* Moral trade isn't just about *my* preferences vs. *yours*. It's about *my confidence in Theory 1* vs. *my confidence in Theory 2*.
      *   *The "Better Off" Claim:* To claim I am better off *all-things-considered* (given moral uncertainty), I need to aggregate the verdicts of $T_1$ and $T_2$.
      *   *Expected Moral Value (EMV):* $EMV(Action) = P(T_1) \times V_1(Action) + P(T_2) \times V_2(Action)$.
      *   *The Mathematical Hurdle:* You cannot multiply a probability ($P$) by an ordinal rank ($V$). Probabilities are cardinal (0 to 1). Ordinal ranks are just orderings (1st, 2nd, 3rd). $0.5 \times \text{"1st"}$ is mathematically nonsense.
      *   *Therefore:* Ordinal rankings within theories are insufficient. We need cardinal values *and* a way to normalize them across theories (intertheoretic comparability).

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Define moral trade and the promise (hedging against uncertainty). State the thesis: It fails because it requires intertheoretic comparison of value magnitudes, which is impossible/non-arbitrary.
      *   *Section 1: The Structure of the Trade.* Explain that for a trade to be mutually beneficial, each party must calculate a net gain. This calculation involves weighing the cost (according to their primary theory) against the benefit (according to the rival theory they assign some credence to).
      *   *Section 2: The Intertheoretic Comparison Problem.* Use the "currency" analogy. Utilitarianism uses "utils," Deontology uses "rights." You can't exchange them without an exchange rate. There is no objective exchange rate.
      *   *Section 3: Addressing Ordinalism.* This is the crucial part requested by the prompt.
          *   Standard economic trade relies on ordinal preferences.
          *   *However*, moral trade relies on *moral uncertainty*.
          *   To resolve moral uncertainty, we use Expected Moral Value (EMV).
          *   EMV requires cardinality. You can't take an expectation of an ordinal ranking.
          *   Example: If $T_1$ says $A > B$ and $T_2$ says $B > A$, and I'm 50/50, which do I choose? I need to know *how much* $T_1$ prefers $A$ over $B$ compared to *how much* $T_2$ prefers $B$ over $A$.
      *   *Section 4: The Normalization Issue.* Even if theories are cardinal internally (e.g., Utilitarianism), they differ in scale. One utilitarian theory might see a headache as -1 unit, another as -1,000,000 units. Without normalization, the theory with the bigger numbers dominates the decision, regardless of truth.
      *   *Conclusion:* Moral trade collapses into arbitrary compromise unless we solve the measurement problem, which we haven't.

  6.  **Refining the Tone:**
      *   Keep it respectful to EA ideals (since it's for a school club).
      *   Ensure philosophical precision (distinguish between interpersonal and intertheoretic).
      *   Make sure the "Ordinal vs. Cardinal" point is highlighted clearly.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I address Toby Ord specifically?* Yes, acknowledge his work (*The Precipice* or his papers on moral uncertainty).
      *   *Did I answer the ordinal question?* Yes, emphasized that expectation requires cardinality.
      *   *Is the distinction clear?* Interpersonal (me vs. you) is easy. Intertheoretic (Util vs. Deont) is the hard part. Moral trade mixes them.
      *   *Wait, one nuance:* In moral trade, Agent A trades with Agent B. Agent A has uncertainty. Agent B has uncertainty.
      *   *Correction:* Actually, Ord's specific framing often involves two agents who have *different* credence distributions. Agent A is 90% Util, 10% Deont. Agent B is 10% Util, 90% Deont. They trade to maximize their *own* expected moral value.
      *   *The Objection holds:* For Agent A to maximize EMV, they still need to compare Utils to Duties *within their own head*. The trade doesn't solve the internal comparison problem; it just externalizes the action. The core issue remains: Can Agent A calculate if the trade increases their EMV? No, because they can't compare the units.

  8.  **Final Polish:** Organize into clear sections. Use bolding for key terms. Ensure the conclusion ties back to the EA context (humility vs. paralysis).

  **(Self-Correction Note):** I need to be careful not to confuse "interpersonal" utility comparisons (comparing my happiness to yours) with "intertheoretic" comparisons (comparing utilitarian value to deontological value). The prompt asks about intertheoretic. The argument is that moral trade *requires* intertheoretic comparison to determine if the trade is beneficial for the individual agent under uncertainty.

