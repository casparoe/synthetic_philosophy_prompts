answer: |-
  **To:** Members of the Effective Altruism Club
  **From:** [Your Name]
  **Subject:** The Measurement Problem in Moral Trade: Why Intertheoretic Comparison Fails

  Toby Ord's proposal of "moral trade" is one of the most intriguing ideas in the literature on moral uncertainty. The pitch is intuitive: if I am 60% confident in Utilitarianism and you are 60% confident in Deontology, we should not simply act on our majority credences. Instead, I should do some deontologically favored actions (that you care about) in exchange for you doing some utilitarianly favored actions (that I care about). By specializing according to our comparative advantages under uncertainty, we ostensibly maximize our *expected moral value* (EMV).

  However, I want to argue that moral trade is not well-defined as a form of mutually beneficial exchange. The mechanism breaks down because determining whether a trade leaves either party "better off" requires comparing amounts of value across rival moral theories. Currently, no one has supplied a non-arbitrary way to make such **intertheoretic comparisons**.

  Below, I outline why this measurement problem is fatal to the concept, and specifically address why merely ordinal rankings of outcomes cannot rescue the idea.

  ### 1. The Core Mechanism Requires a Common Currency

  For moral trade to work, each agent must calculate whether a proposed deal increases their Expected Moral Value (EMV).

  Suppose I am primarily Utilitarian. To me, a "cost" is measured in lost welfare (e.g., hedons). Suppose you are primarily Deontologist. To you, a "cost" is measured in rights violations or duty failures.

  For me to agree to a trade where I commit a minor rights violation (to satisfy your Deontology) in exchange for you generating massive welfare (to satisfy my Utilitarianism), I must be able to calculate the net benefit. I need to answer: *Is the gain in expected Utilitarian value greater than the loss in expected Deontological value?*

  This requires an **exchange rate** between "hedons" and "duty violations." But moral theories do not share a common metric. Utilitarianism is consequentialist and aggregative; Deontology is often agent-relative and non-aggregative. There is no "moral dollar" that both theories accept. Without a non-arbitrary exchange rate, the calculation $EMV = \sum (P(T_i) \times V_i(Action))$ is mathematically undefined. We are trying to add meters to kilograms.

  ### 2. Why Ordinal Rankings Cannot Rescue the Idea

  In standard economics, trade does not require cardinal utility (specific numbers); it only requires **ordinal preferences** (ranking outcomes $A > B > C$). If I prefer apples to oranges and you prefer oranges to apples, we can trade without knowing *how much* more we prefer them.

  Could moral trade work the same way? If Theory $T_1$ ranks Outcome $X$ higher than $Y$, and Theory $T_2$ ranks $Y$ higher than $X$, can we trade based solely on these orderings?

  **The answer is no, because moral trade relies on moral uncertainty, not just moral disagreement.**

  In standard trade, I maximize *my* preferences. In moral trade, I maximize my *expectation* over competing theories. To take an expectation, you need cardinality.

  Consider this example:
  *   I have 50% credence in Theory A and 50% credence in Theory B.
  *   Theory A ranks Outcome $X$ slightly above Outcome $Y$.
  *   Theory B ranks Outcome $Y$ vastly above Outcome $X$.

  If we only have ordinal rankings, I cannot decide between $X$ and $Y$. I know A prefers $X$ and B prefers $Y$, but I don't know the *intensity* of those preferences.
  *   If A's preference is weak and B's is strong, I should choose $Y$.
  *   If A's preference is strong and B's is weak, I should choose $X$.

  Because probabilities (my credences) are cardinal numbers (0.5), they cannot be multiplied by ordinal ranks ("1st place," "2nd place"). To resolve moral uncertainty via EMV maximization, the values ($V_i$) must be cardinal. Therefore, an ordinal framework is insufficient to determine if a trade is beneficial.

  ### 3. The Problem of Normalization (Scale and Zero Points)

  Even if we grant that moral theories provide cardinal values internally (e.g., Utilitarianism assigns specific utils to outcomes), we face the **normalization problem**.

  Different theories (or even different versions of the same theory) use different scales.
  *   **Scale:** One hedonistic theory might measure pain on a scale of 1–10. Another might measure it on a scale of 1–1,000,000. If I assign equal credence to both, the theory with the larger numbers will dominate my decision-making, regardless of its plausibility.
  *   **Zero Points:** Utilitarianism might view a neutral life as 0. Negative Utilitarianism might view suffering as the only disvalue, with no upper bound on good. Where is the "zero" point for a Deontological theory? Is it "no duties violated"?

  To make moral trade work, we would need to normalize all theories to a common scale (e.g., 0 to 1). But any method of normalization is arbitrary.
  *   If we normalize by **range** (setting the best and worst possible outcomes to 1 and 0), theories that view the world as high-stakes (where the best outcome is infinitely better than the worst) get crushed compared to theories that view stakes as low.
  *   If we normalize by **variance**, we privilege theories that are more "opinionated" or extreme.

  Since the outcome of the trade depends entirely on which arbitrary normalization method we choose, the "mutual benefit" is not an objective feature of the trade; it is an artifact of our measurement choice.

  ### 4. Interpersonal vs. Intertheoretic

  It is crucial to distinguish this from *interpersonal* comparison. In standard trade, we assume I can compare my utility to yours (or at least, we can agree on a price). But in moral trade, the comparison is **intertheoretic**.

  Even if *I* am the only agent involved, trying to decide between two actions under moral uncertainty, I face this problem. Moral trade simply externalizes this internal conflict by finding a partner with an inverse credence distribution. But the mathematical hurdle remains inside my own head. I cannot verify that I am "better off" accepting the trade unless I can compare the value units of the theory I am compromising against the value units of the theory I am promoting.

  ### Conclusion

  Moral trade is a compelling heuristic for cooperation, but it fails as a rigorous decision procedure under moral uncertainty. It presupposes that we can compare the *magnitude* of value across incommensurable moral frameworks.

  Because resolving moral uncertainty requires calculating Expected Moral Value, **ordinal rankings are insufficient**; we require cardinal values. Yet, because there is no non-arbitrary way to normalize the scales and zero-points of rival moral theories, these cardinal values cannot be compared.

  For the EA club, this suggests a note of caution: while moral trade encourages humility and cooperation, we should not treat it as a mathematical solution to moral uncertainty. We are still left without a "moral currency," meaning any trade we strike is ultimately based on intuitive guesses about value comparisons rather than a well-defined optimization of expected good.
