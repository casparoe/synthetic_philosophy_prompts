answer: |-
  # The Price of Winning: Adjudicating the Bomb Case Against Functional Decision Theory

  The history of decision theory is a history of paradoxes. From Newcomb's Problem to the Prisoner's Dilemma, formalizing rational choice has repeatedly forced us to choose between intuitive notions of causality and the cold arithmetic of expected utility. In recent years, Functional Decision Theory (FDT) and its precursor, Updateless Decision Theory (UDT), have emerged from the MIRI and LessWrong communities as attempts to resolve these paradoxes by shifting the locus of agency from the individual *act* to the decision *algorithm*.

  Yet, no challenge to this framework has been as visceral or as philosophically sharp as Will MacAskill's "Bomb" argument. It strips away the abstract payoffs of Newcomb boxes and replaces them with life and death. In doing so, it forces a confrontation between two competing visions of rationality: one that demands responsiveness to immediate evidence, and one that demands fidelity to a winning policy. This essay will adjudicate the dispute by examining the strongest forms of both the "guaranteed payoff" objection and the updateless rejoinder. It will conclude that the Bomb case does not expose a flaw in FDT, but rather reveals the steep ontological cost of being an agent capable of winning in a universe containing predictors.

  ### The Case for the Guaranteed Payoff

  To understand the force of MacAskill's objection, one must inhabit the perspective of the agent standing before the boxes. The setup is brutal in its clarity. To the left is a bomb; to the right, an empty box costing $100. A predictor of near-infallible accuracy placed the bomb based on a simulation of you. You see the bomb. You know the predictor predicted you would take the right box.

  The objection rests on two pillars: the **Dominance Principle** and **Evidence Responsiveness**.

  First, consider dominance. In the actual world, as it currently stands, the bomb is in the Left box. The prediction is in the past. The causal chain is fixed. If you take Left, you die. If you take Right, you live minus $100. In every physically possible continuation of *this specific moment*, taking Right yields a better outcome than taking Left. To choose Left is to choose death when life is available. As MacAskill argues, a decision theory that violates the dominance principle in such a stark manner seems to have lost contact with reality. It asks the agent to treat a counterfactual ("If I were the type of agent who took Left, the bomb wouldn't be here") as more real than the actual ("The bomb is here").

  Second, consider evidence responsiveness. Rational agents should update on their observations. Upon seeing the bomb, the agent receives definitive proof that the predictor forecasted they would take Right. The "logical link" that FDT relies on—the idea that your current decision influences the past prediction via simulation—feels like magic once the prediction is already realized. The critic argues that FDT requires the agent to ignore the sensory evidence of the bomb in favor of a metaphysical wager on their own algorithmic nature. If rationality is about navigating the world as it *is*, not as it *would have been* had you been different, then FDT fails. It demands a form of "akrasia of the intellect," where you knowingly choose a dominated strategy because of a policy that has, in this specific instance, already failed to secure its benefit.

  ### The Updateless Rejoinder

  The defense of FDT does not deny the physical reality of the bomb. Instead, it rejects the premise that the *act* is the proper unit of rational evaluation. For the FDT proponent, you are not a momentary slice of consciousness choosing a box; you are an instantiation of a decision algorithm.

  The core of the rejoinder is **Ex-Ante Optimality**. Before you entered the room, if you were asked to commit to a policy, you would unequivocally choose the policy: "If I see a bomb in Left, I take Left." Why? Because if you commit to that policy, the predictor simulates that commitment, places the bomb in Right (or leaves both empty), and you survive. The policy "If I see a bomb in Left, I take Right" leads to the predictor placing the bomb in Left, and you die. The expected value of the first policy is vastly higher. FDT simply argues that you should not abandon this optimal policy just because you have now entered the specific branch where the predictor's accuracy resulted in an unlucky outcome.

  This leads to the **"Why Ain'tcha Rich?"** argument. In the long run (or across the multiverse of simulations), agents who follow FDT survive Bomb scenarios almost always. Agents who follow Causal Decision Theory (CDT) or Evidential Decision Theory (EDT) die almost always. If you define rationality instrumentally—as the quality of an agent that achieves its goals—then the FDT agent is rational and the CDT agent is not. The CDT agent saves $100 in the one-in-a-trillion-trillion case where they survive, but dies in all the others.

  Furthermore, the FDT defender argues that the "logical link" is not magic. The predictor simulated *you*. Your current reasoning process is isomorphic to the one in the simulation. To say "my decision now cannot change the past" is to misunderstand the nature of logical causation. Your decision *now* and the prediction *then* are both outputs of the same function. You cannot change the past, but you can determine what the past *must have been* given the output you produce now. To choose Right is to confirm the prediction that killed you. To choose Left is to act in accordance with the algorithm that saves you in the vast majority of logical possibilities.

  ### Adjudication: The Nature of Agency

  The dispute ultimately hinges on a metaphysical disagreement about the nature of agency. The "Guaranteed Payoff" objection assumes a **Causal/Temporal Agent**: an entity located at a specific point in spacetime, influenced only by its past, whose choices ripple only into its future. For this agent, the Bomb case is a tragedy where the rational move is to cut losses.

  The FDT rejoinder assumes an **Algorithmic/Updateless Agent**: an entity defined by its input-output mapping, existing "timelessly" across its simulations and instantiations. For this agent, the Bomb case is a test of consistency.

  Which view is correct? If we are discussing human beings, the Causal view feels phenomenologically accurate. We feel like we are in the moment, reacting to evidence. Asking a human to walk into a bomb because of a policy is asking them to override their survival instinct based on abstract logic. However, decision theory is increasingly relevant not just for humans, but for artificial agents we might build. For an AI, the "algorithmic self" is not a metaphor; it is literal code.

  The critical insight is that the Bomb scenario is structurally identical to a **blackmail** scenario. The predictor is effectively saying: "I have placed a bomb here. I will only have done so if I thought you would pay me $100 to avoid it (by taking Right)." If you pay the $100 (take Right), you incentivize the predictor to place the bomb. If you refuse to pay (take Left), you incentivize the predictor to leave the box empty.

  The "Guaranteed Payoff" objection fails because it treats the predictor's move as exogenous *after* it happens. But in a universe with predictors, the predictor's move is endogenous to your decision procedure. If you adopt a decision theory that says "pay the blackmail when you see the bomb," you become the *kind of agent* who gets blackmailed. The fact that you are currently seeing the bomb is evidence that you are facing a predictor who expects you to pay. To pay is to validate the expectation that got you into this mess.

  ### Verdict: A Cost, Not a Flaw

  Does the Bomb case expose a genuine flaw in updateless decision theories? **No.** It reveals a cost that a rational agent should be willing to pay.

  The objection that FDT is "irrational" in the Bomb case relies on a definition of rationality that prioritizes *ex-post* justification over *ex-ante* success. It claims that because the agent cannot causally affect the past, they should ignore the logical dependency. But this definition renders the agent vulnerable to exploitation in any scenario involving prediction or logical correlation. An agent that refuses to die in the Bomb case is an agent that dies in all the trillion-trillion other cases where the predictor would have spared them had they been resolute.

  Therefore, the verdict is conditional on the **Principle of Algorithmic Identity**:

  > *Rationality requires acting as the output of the decision algorithm that maximizes expected utility across all logical instantiations of that algorithm, even when local sensory evidence suggests a dominated act.*

  If one accepts this principle, FDT is flawless. The "absurdity" of choosing death is merely the price of admission for being the kind of agent that rarely faces the bomb in the first place. The FDT agent walks into the room, sees the bomb, and feels a profound tragic irony, but takes the Left box. They do so not because they think it will save them *now* (it won't), but because being the agent who takes the Left box is the only way to be the agent who *usually* doesn't face this choice.

  However, this verdict comes with a crucial caveat. This rationality is **design-dependent**. A human, evolved for causal intuition, cannot easily "choose" to die based on logical counterfactuals. For humans, FDT may be a normative ideal we cannot reach. But for artificial agents, which can be written to execute policies regardless of local sensory dominance, FDT is the superior architecture.

  The Bomb argument does not break FDT; it breaks our intuition that rationality is about making the best move *given the current state of the world*. In a universe with predictors, the "current state of the world" is a reflection of your decision algorithm. To ignore that reflection is to lose. The rational agent accepts death in the unlucky branch to secure life in the tree. That is not a flaw; it is the grim arithmetic of winning.
