answer: |-
  **Title:** The Curve and the Will: On the Explanatory Limits of Hyperbolic Discounting for Akrasia

  **Introduction**

  The intersection of cognitive science and the philosophy of action is often fertile ground, but in the case of intertemporal choice and *akrasia* (weakness of will), it is also a site of significant conceptual friction. For decades, behavioral economists and cognitive scientists have operated under a working assumption: hyperbolic discounting models provide the mechanistic account of weakness of will. When an agent chooses a smaller-sooner reward over a larger-later one, the standard scientific narrative identifies this as a preference reversal driven by the shape of the discount curve, colloquially equated with losing one's willpower. However, as your committee member correctly identified, this equation rests on a category mistake. The philosophical puzzle of *akrasia*, as articulated by Aristotle and refined by Donald Davidson, is fundamentally synchronic: it concerns an agent acting against their *current* best judgment. Hyperbolic discounting, particularly in George Ainslie's picoeconomic framework, models a diachronic shift in preference.

  This essay argues that while hyperbolic discounting offers a robust description of *temptation dynamics*, it fails to account for the normative structure of *akrasia* proper. By dissolving the synchronic conflict into a diachronic succession of preferences, and by potentially reframing the behavior as rational Bayesian updating (per Sozou), discounting models risk explaining away the very phenomenon they claim to illuminate. A more accurate theoretical framing positions hyperbolic discounting as the substrate of motivational conflict, while reserving the explanation of *akrasia* for volitional accounts, such as Richard Holton's resolution-based model, which can accommodate the cognitive science without erasing the agent.

  **The Synchronic Puzzle: Aristotle and Davidson**

  To understand why the discounting model falls short, we must first rigorously define the target phenomenon. In Book VII of the *Nicomachean Ethics*, Aristotle confronts the Socratic paradox that no one knowingly does evil. Socrates argued that if an agent truly knows $A$ is better than $B$, they cannot choose $B$; if they choose $B$, they must have been ignorant of $A$'s superiority. Aristotle's solution preserves the intuition that the akratic agent *does* know $A$ is better, yet chooses $B$ under the influence of passion.

  Donald Davidson modernized this puzzle in "How Is Weakness of the Will Possible?" (1970). Davidson noted that for *akrasia* to be irrational (and not just a change of mind), the agent must hold an "all-things-considered" judgment at time $t$ that favors action $A$, while intentionally performing action $B$ at that same time $t$. Davidson's distinction between conditional judgments ("$A$ is better given all relevant considerations") and "all-out" judgments (the unconditional verdict that issues in action) allows for the logical possibility of *akrasia*, but it does not explain the mechanism. The core of the philosophical puzzle is the *synchronic* violation of the agent's own normative authority. The agent is one person, at one time, violating their own law.

  **The Diachronic Shift: Ainslie and Picoeconomics**

  Enter George Ainslie and the hyperbolic discounting model. In standard exponential discounting, preferences are time-consistent; if I prefer $A$ to $B$ today, I will prefer $A$ to $B$ tomorrow. Hyperbolic discounting, however, posits a value curve that is steep in the immediate future and shallow in the long term. This generates preference reversals: at time $t_1$ (distant), I prefer the larger-later reward ($A$). As time passes and $t_2$ approaches (where the smaller-sooner reward $B$ is imminent), the value of $B$ spikes disproportionately, surpassing $A$.

  Ainslie's picoeconomics interprets this not as a failure of a unitary agent, but as a bargaining market between "successive selves." The self at $t_1$ wants $A$; the self at $t_2$ wants $B$. The conflict is not within a single mind at a single moment, but between temporal slices of the agent.

  Here lies the first major divergence from the philosophical puzzle. If the agent at $t_2$ genuinely values $B$ more than $A$ due to the discount curve, they are *not* acting against their current best judgment. They are acting in accordance with their current valuation, which has simply shifted from the valuation held at $t_1$. This transforms *akrasia* from a synchronic paradox (acting against current judgment) into a diachronic inconsistency (inconsistency between past and current judgments). While diachronic inconsistency is practically problematic, it is not the conceptual puzzle Aristotle and Davidson sought to solve. By adopting the multiple-selves metaphor, Ainslie effectively dissolves the unitary agent required for traditional *akrasia*. If there is no single agent persisting through time, there is no one to be "weak"; there are only different agents with different preferences taking turns at the controls.

  **The Rationality Objection: Sozou and the Hazard Rate**

  The tension deepens when we consider the normative status of the discount curve itself. Hyperbolic discounting is typically framed as a cognitive bias—a deviation from rational exponential discounting. However, as Sozou (1998) demonstrated, hyperbolic-like discounting can emerge from perfectly rational Bayesian updating in the face of uncertainty.

  If an agent is unsure whether a future reward will actually materialize (the hazard rate), they should discount the value of that reward based on the probability of it surviving until delivery. As the reward gets closer in time, the probability of it being lost to some hazard decreases, causing its expected value to rise non-linearly. If an agent discounts hyperbolically because they are rationally accounting for the risk that the "larger-later" reward might vanish, their choice of the "smaller-sooner" reward is not irrational. It is a risk-mitigation strategy.

  This presents a fatal problem for identifying hyperbolic discounting with *akrasia*. *Akrasia* is, by definition, a normative failure—a lapse in rationality or will. If the behavior modeled by hyperbolic discounting can be derived from rational belief updating about hazard rates, then the model is describing *prudence*, not weakness. To label this *akrasia* is to impose an external normative standard (exponential discounting) that may not apply to the agent's epistemic environment. Consequently, a discounting model alone cannot distinguish between a rational response to uncertainty and an irrational capitulation to temptation.

  **The Volitional Alternative: Holton's Resolutions**

  If discounting models describe the *pressure* of temptation but fail to capture the *failure of will*, we require an account that bridges the gap between valuation and action. Richard Holton's resolution-based account offers this bridge. Holton argues that *akrasia* is not necessarily a reversal of evaluative judgment (as the discounting model suggests), but a failure to maintain a resolution in the face of contrary desire.

  On Holton's view, an agent can judge that $A$ is best, form a resolution to do $A$, and then, when tempted by $B$, abandon that resolution without necessarily changing their judgment that $A$ is best. The failure is volitional, not evaluative. This aligns much more closely with the Davidsonian synchronic puzzle. The agent at $t_2$ can still acknowledge $A$ is better (maintaining the synchronic conflict) but lacks the volitional grip to execute it.

  Crucially, Holton's account can *incorporate* hyperbolic discounting without being reduced to it. The steep discount curve explains why the desire for $B$ becomes so intense at $t_2$—it explains the strength of the counter-force. However, the *akrasia* consists in the abandonment of the resolution to resist that force. This preserves the unitary agent (who holds the resolution) and the synchronic conflict (judgment vs. action), while utilizing the cognitive science to explain the intensity of the temptation.

  **Verdict and Implications for Dissertation Framing**

  The controversy between the cognitive science of intertemporal choice and the philosophy of action is not merely terminological; it is ontological. Hyperbolic discounting models, taken alone, do not explain *akrasia*; they explain *preference instability*.

  Therefore, my specific verdict is this: **Hyperbolic discounting is a necessary but insufficient condition for a theory of akrasia.** It provides the mechanistic substrate for why temptations gain motivational force over time, but it cannot account for the normative failure of acting against one's current best judgment without additional philosophical scaffolding. If you equate the discount curve directly with weakness of will, you inadvertently adopt a "multiple selves" ontology that dissolves the synchronic puzzle, or you risk labeling rational hazard-avoidance as irrationality.

  For your dissertation, you must hedge your framing. Do not write that hyperbolic discounting *is* the mechanism of weakness of will. Instead, frame it as the mechanism of *temporal preference reversal* which creates the conditions under which weakness of will becomes likely. You should explicitly acknowledge that for these reversals to constitute *akrasia* in the philosophical sense, they must be mapped onto a model of agency that preserves synchronic judgment (such as Holton's).

  A robust theoretical chapter would propose a hybrid model: The hyperbolic curve explains the *dynamics of desire* (why the cake looks better now than it did yesterday), while a volitional account explains the *failure of agency* (why I ate it despite still believing I shouldn't). By separating the valuation mechanism from the volitional failure, you respect the philosophical constraints of the puzzle while retaining the predictive power of the cognitive science. To do otherwise is to solve the puzzle by denying the existence of the agent who suffers it.
