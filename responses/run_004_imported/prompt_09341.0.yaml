      *   **The Cognitive Science Model (Ainslie/Hyperbolic Discounting):**
          *   Core feature: *Diachronic* preference reversal. At $t_1$ (distant), prefer $A$ (larger-later). At $t_2$ (near), prefer $B$ (smaller-sooner).
          *   Mechanism: Value function shape (hyperbolic vs. exponential).
          *   Metaphysics: Often implies "multiple selves" or sub-agents.
