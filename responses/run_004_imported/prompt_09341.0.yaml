      *   **The Alternative Philosophical Account (Holton):**
          *   Focus: Resolutions/Intentions.
          *   Mechanism: Akrasia is failing to stick to a resolution in the face of contrary desire, not necessarily a reversal of evaluative judgment.
          *   Fit: Bridges the gap between cognitive mechanisms and normative agency better than pure discounting.

