      *   **Section 4: The Volitional Alternative (Holton):** Introduce resolutions. How this captures the *struggle* better than value curves.
      *   **Conclusion/Verdict:** Synthesize. Give the specific advice requested. Hyperbolic discounting explains *instability*, but not *akrasia* proper without additional philosophical scaffolding.

