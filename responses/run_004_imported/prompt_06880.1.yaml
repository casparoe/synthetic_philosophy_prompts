          *   **Moral Luck:** Outcomes matter, not just intentions.
          *   **The Limits of Theory:** Ethics isn't a codifiable system of rules applied universally.
          *   **Shame vs. Guilt:** Williams favored shame cultures (internal/communal evaluation) over guilt cultures (internalized law).
      *   *Williams on Opera:* He wrote *On the Opera* (posthumous collection). He loved opera. He saw it as a place where psychological truths are revealed through music, not necessarily moral lessons. He appreciated *Don Giovanni* specifically for its ambiguity and the way music complicates moral judgment.
