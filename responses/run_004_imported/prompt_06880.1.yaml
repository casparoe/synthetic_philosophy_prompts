          *   *Refinement:* Actually, a "Reworking" of *dramaturgy* (context) without *staging* (text/music/blocking) changes might be the sweet spot. But the prompt options are: 1. Proceed as planned (unaltered), 2. Rework staging/dramaturgy, 3. Withdraw.
