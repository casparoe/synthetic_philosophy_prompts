  **MEMORANDUM**

  **TO:** The Repertoire Committee and Board of Directors
  **FROM:** [Your Name], Chair, Repertoire Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding 2024/25 Production of *Don Giovanni*

  ### 1. Executive Summary

  After reviewing the conflicting proposals regarding our upcoming production of Mozart and Da Ponte's *Don Giovanni*, the Repertoire Committee recommends **proceeding as planned** with the unaltered, traditional production currently in development. We will not implement a substantially reconceived staging designed to signal explicit moral condemnation, nor will we withdraw the work.

  However, to address the legitimate ethical concerns raised by the Board and our donors, we will augment the production with a robust dramaturgical framework. This includes pre-performance talks, revised program essays, and post-show discussions focused on the opera's treatment of consent and power. This approach preserves the artistic integrity of the work while creating the necessary space for critical audience engagement.

  ### 2. The Philosophical Context: Engaging Bernard Williams

  Both factions in this debate have invoked the late philosopher Bernard Williams to justify their positions. To ensure our decision is principled rather than merely political, we must clarify what Williams's ethical framework actually commits us to.

  **The Argument for Reconceptualization (Faction A)**
  Proponents of altering the staging argue that Williams emphasized *Sittlichkeit* (ethical life)—the idea that moral concepts are embedded in specific social practices and historical contexts. They contend that in a post-#MeToo climate, the "thick ethical concept" of seduction has shifted. Where Giovanni was once viewed as a transgressive libertine, he is now intelligible to many as a predator. To stage his conquests without directorial critique is to ignore our current ethical reality, potentially normalizing harmful behavior. From this view, silence is complicity; the production must actively signal that Giovanni's behavior is morally untenable.

  **The Argument for Traditional Staging (Faction B)**
  Proponents of the traditional production argue that Williams resisted the "impartial standpoint"—the idea that ethical life can be codified into general rules applied from a distance. They contend that demanding the opera render an explicit moral verdict imposes an external theoretical framework onto a complex work of art. This reduces the opera to moral instruction, violating the integrity of the artwork and the audience's capacity to grapple with ambiguity.

  **The Committee's Analysis**
  While we acknowledge the strength of Faction A's concern regarding social harm, we find that their proposed solution contradicts Williams's core critique of "moralism." Williams argued that applying a systematic moral theory (e.g., "all depictions of predation must be visibly condemned") to complex human situations alienates us from the truth of those situations.

  If we alter the staging to force a moral judgment upon Giovanni, we are not engaging with the ethical complexity of the work; we are simplifying it to satisfy an external rule. This turns the opera into propaganda. Williams valued art precisely because it reveals ethical truths that theory often obscures. In *Don Giovanni*, the judgment is not absent; it is present in the music, in the supernatural intervention of the Commendatore, and in the tragic trajectory of the other characters. To add a directorial "wink" of condemnation is to distrust the audience's moral capacity and to falsify the work's ambiguity.

  However, Faction B must also heed Williams's warning against ethical complacency. We cannot simply claim "artistic integrity" to ignore the social context in which this art is received. While we will not alter the *staging* to impose a verdict, we must not pretend the ethical tensions do not exist. This is why our recommendation includes enhanced dramaturgy. We are not changing the work to fit a rule; we are enriching the context to deepen the ethical engagement.

  ### 3. Recommendation

  **Decision:** Proceed with the approved traditional production.

  **Rationale:**
  1.  **Integrity of the Work:** *Don Giovanni* operates through musical and dramatic ambiguity. Imposing a singular moral reading flattens the psychological truth of the characters.
  2.  **Audience Agency:** Williams argued for the importance of the agent's perspective. We must trust the audience to navigate the ethical complexity rather than instructing them on how to feel.
  3.  **Precedent:** Altering canonical works to align with contemporary moral codifications sets a precedent that threatens the entire repertoire (e.g., *Figaro*, *Rosenkavalier*, *Otello*).

  **Mitigation Strategy:**
  We will not withdraw the production, as censorship serves neither art nor ethical discourse. Instead, we will treat the production as a catalyst for community dialogue. The General Director will personally meet with the concerned donor to explain that while the *staging* remains faithful to the score, the *conversation* surrounding it will be rigorous and contemporary.

  ### 4. Implementation Timeline

  To ensure the dramaturgical support is in place before tickets go on sale, the following timeline will be enacted immediately:

  *   **Phase 1: Alignment & Communication (Weeks 1-4)**
      *   **Nov 1:** Committee vote finalizes this decision.
      *   **Nov 10:** General Director meets with major donor and Board faction leads to present this memo and the dramaturgical plan.
      *   **Nov 30:** Hiring of Guest Dramaturg specializing in gender studies and opera.

  *   **Phase 2: Dramaturgical Development (Weeks 5-12)**
      *   **Dec 15:** Drafting of program book essays. One essay must address the history of the "libertine" vs. contemporary understandings of consent, explicitly acknowledging the tension without dictating a conclusion.
      *   **Jan 15:** Confirmation of panelists for pre-performance talks (e.g., a musicologist, a sexual ethics scholar, and a survivor advocate).
      *   **Feb 1:** Content warnings and context notes finalized for website and ticketing platform.

  *   **Phase 3: Production & Rehearsal (Weeks 13-24)**
      *   **Mar 1:** Director and Cast arrive. Dramaturg leads a workshop with the cast to discuss the ethical landscape of the piece, ensuring performers understand the weight of their actions even if the staging is traditional.
      *   **Apr 15:** Tech Rehearsals.
      *   **May 1:** Dress Rehearsal with invited community leaders and Board members.

  *   **Phase 4: Performance & Engagement (Weeks 25-32)**
      *   **May 15:** Opening Night.
      *   **May 20:** First Pre-Performance Talk: "Giovanni in the #MeToo Era."
      *   **June 10:** Post-Show Discussion Series begins (scheduled for every Saturday performance).
      *   **July 1:** Season Review: Committee assesses audience feedback and donor relations for future programming decisions.

  ### 5. Conclusion

  Bernard Williams wrote that the purpose of philosophy is not to make things simple, but to help us understand how hard things are. *Don Giovanni* is a hard work. It presents a charismatic monster and asks us to be seduced by his music while horrified by his actions. To sanitize this tension is to lose the work's ethical power.

  We proceed with the traditional production not to dismiss the concerns of our donors, but to honor the complexity of the ethical life they wish to protect. We invite the Board to join us in facing that complexity, rather than attempting to resolve it through directorial intervention.

  **Approved By:**

  [Signature]

  **Chair, Repertoire Committee**
