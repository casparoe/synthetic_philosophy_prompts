  The rain beat against the leaded windows of the Eagle and Child, blurring the glow of the streetlamps into wet smudges. Inside, the air was thick with tobacco smoke and the low hum of post-Convocation exhaustion. Arthur poured a measure of wallop into his pint, his hand steady despite the day's commotion. Across the table, Hugh loosened his tie, looking less triumphant than relieved.

  "Well," Hugh said, tapping ash into the tray. "Four votes. I suppose history will remember the four of you louder than the two hundred and thirty who voted *placet*."

  "History often mistakes volume for truth," Arthur replied. "You know why we did it."

  "I know the pamphlet," Hugh said. "Anscombe's tract. 'Mr. Truman's Degree.' You think honoring the man who ended the war is a mark of shame. But you're smuggling in a technicality, Arthur. You're hiding behind a distinction between *intending* death and *foreseeing* it. To the man in the street, a dead child is a dead child."

  "It is not a technicality. It is the difference between a murder and a tragedy," Arthur said, leaning forward. "When Truman authorized the bomb, he chose the deaths of civilians as a means to an end. That is the definition of murder. It isn't about whether the civilians are morally blameless. A soldier who surrenders is morally blameworthy for having fought, yet he becomes 'innocent' the moment he stops harming. We cannot kill him. The people in Hiroshima were 'innocent' in the same sense: they were not harming us. To choose them as targets is to treat human life as a resource to be spent."

  Hugh sighed, swirling his beer. "But the context, Arthur. You're speaking as if 1945 was a duel in a clearing. By then, the distinction between combatant and non-combatant had already collapsed. The blockade of Germany starved children. The firebombing of Tokyo burned them in their sleep before Truman ever took office. If you condemn Truman, you must condemn Churchill. And if you condemn Churchill, what becomes of the war effort?"

  "Past wrongs do not license new ones," Arthur said sharply. "Just because the line was crossed earlier doesn't mean we erase it. And don't tell me the bomb was the only way. The demand for unconditional surrender was a policy choice, not a fact of nature. We chose a policy that made invasion seem necessary, which made the bomb seem necessary. You cannot create a necessity through rigid diplomacy and then claim moral absolution because you solved the problem you created."

  "Geopolitics isn't a seminar paper," Hugh countered, his voice hardening. "It wasn't just about Japan. It was about Stalin. We needed to end it quickly, before the Soviets swallowed the whole of Asia. The projections for an invasion of the home islands weren't guesses; they were based on Okinawa. Hundreds of thousands of Allied dead. Millions of Japanese. You sit here in Oxford, safe in your common room, and say 'murder is murder.' But what if the calculus is real? What if refusing to use the bomb meant condemning a million young men to death?"

  Arthur took a slow drink. "This is where your utilitarianism shows its teeth, Hugh. Let's follow that logic. Suppose you could save a million people from a disaster, but only by boiling one baby alive. Would you do it?"

  Hugh paused. He didn't flinch. "In extremis? If those were the only two options? Yes. I would bear the guilt, but I would boil the baby."

  "And there it is," Arthur said softly. "You admit that on your view, justice is merely arithmetic. That the innocent can be sacrificed if the sum is large enough. I deny it. There are things we must not do, even to save the world. If you choose to kill the innocent as a means, you corrupt the very authority you claim to defend. You become what you fight."

  "I become a man who saved his country," Hugh said. "You talk of corruption. I talk of responsibility. You want to keep your hands clean while the world burns. You say 'unconditional surrender was a choice.' Perhaps. But it was the only choice that guaranteed the enemy couldn't rise again. Truman didn't wake up and decide to target civilians for sport. He weighed the horrors and chose the lesser one. That is what leadership is. It's not adhering to absolutist rules while others bear the blood."

  "Leadership isn't exempt from morality," Arthur insisted. "If the rule prohibits killing the innocent, it prohibits it for Presidents too. Otherwise, might makes right. We are saying that Oxford should not honor a man who explicitly crossed that line. Not to rewrite history, but to mark the boundary. To say: this far, no further."

  Hugh leaned back, lighting a fresh cigarette. The smoke curled between them like a veil. "You marked the boundary, Arthur. Four votes. But the degree stands. Truman comes. The world moves on. And I suspect, when the next crisis comes—and it will—you'll find fewer people willing to listen to the man who wouldn't boil the baby."

  "Perhaps," Arthur said, lifting his glass. "But someone must remember that the baby shouldn't be boiled."

  Hugh clinked his glass against Arthur's, a dull thud. "To remembering," he said. "And to surviving."

  They drank, the disagreement settling between them like the smoke, thick and unresolved.
