      *   **Point 1: Common Knowledge vs. Mutual Knowledge (The Technical Glitch).**
          *   This is the most direct logical error in the user's "state it once" claim.
          *   *Definition:* Mutual knowledge = I know $X$, you know $X$. Common knowledge = I know $X$, you know $X$, I know that you know $X$, you know that I know $X$...
          *   *Mechanism:* In Aumann's model, posteriors are functions of private information partitions. For the theorem to hold, the fact that "I believe $p$" and "You believe $q$" must be common knowledge.
          *   *Why one statement isn't enough:* If I tell you my number, you update. If you update, your number might change. If your number changes, I need to update again. The theorem describes a state where this process has stabilized (a fixed point), not necessarily the immediate moment after one exchange.

      *   **Point 2: The "Common Prior" Assumption (The Realistic Glitch).**
          *   This is the most common reason the theorem fails in the real world.
          *   Do the user and partner *really* have the same prior?
          *   Prior includes *all* background knowledge before the specific "private information" of the problem set.
          *   Different life experiences, different interpretations of previous classes, different trust in the professor, etc., act as different priors. If priors differ, Aumann doesn't apply.

      *   **Point 3: Information Hiding/Compression.**
          *   Stating a number (e.g., "I'm 80% sure") hides *why* you are 80% sure.
          *   Aumann's theorem works on the *information partitions*. If you just swap numbers, you aren't necessarily swapping the evidence that generated them.
          *   However, the theorem *says* you don't need to share evidence, just posteriors. But this relies on the agents being able to infer the constraints on the other's information from the posterior. In complex real-world scenarios (like a math problem), the mapping from evidence to posterior isn't transparent enough for the other person to update correctly just on the number alone without iterating.

