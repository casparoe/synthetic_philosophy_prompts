answer: |-
  This is an exceptionally sharp observation. You have correctly identified a tension between the formal decision-theoretic critique of hyperbolic discounting (it makes you vulnerable to money pumps) and the pragmatic rationalist approach to akrasia (build commitment devices to manage the hyperbolic self).

  The short answer is: **Rationalists are not failing to take the argument to its logical conclusion. Rather, precommitment *is* the logical conclusion for a bounded agent who cannot rewrite their own source code.**

  However, there is more nuance to unpack here. The reason rationalists treat hyperbolic discounting as a constraint to be managed rather than a bug to be patched involves four distinct layers: psychological feasibility, the mechanics of the money pump, the normative status of exponential discounting, and the definition of rationality itself.

  ### 1. The Psychological Infeasibility of "Rewiring"
  The most pragmatic reason rationalists don't advocate for switching to exponential discounting is that **humans cannot simply choose to discount exponentially.**

  Discount functions are not conscious beliefs; they are deep-seated psychological and neurological mechanisms. They are part of the hardware, not the software. Telling a human to "adopt exponential discounting" is like telling a human to "adopt echolocation." It might be normatively superior in certain environments, but it is not an available action in the agent's action space.

  Since the discount function is a fixed constraint (for now), the only available degree of freedom is the *choice architecture*. If you cannot change the preference reversal, you must change the environment so that the preference reversal does not lead to a choice reversal. This is exactly what precommitment devices do. They are not "managing" the bug in the sense of hiding it; they are engineering a solution around an immutable constraint.

  ### 2. Precommitment Neutralizes the Money Pump
  You suggest that precommitment treats the preferences as a constraint rather than fixing the exploitability. But from a decision-theoretic perspective, **precommitment is precisely how you stop the money pump without changing the discount function.**

  A money pump requires two things:
  1.  Preference reversal over time.
  2.  The ability to execute a trade based on that reversal.

  Hyperbolic discounting provides #1. Precommitment devices remove #2.

  When you sign a Beeminder contract at $t_0$, you are altering the payoff structure at $t_1$. At $t_1$, your hyperbolic discounting still kicks in; you still *feel* a stronger pull toward the immediate reward. However, the precommitment device adds a penalty (financial, social, or psychological) to the immediate reward such that the *net* utility of the immediate option is now lower than the delayed option.

  You have not made your preferences time-consistent. You have made your **incentives** time-consistent. Since rationality (in the instrumental sense) is about achieving outcomes rather than maintaining internal philosophical purity, an agent who uses precommitment to achieve their long-term goals is behaving more rationally than an agent who successfully rewires their brain to be exponential but fails to achieve their goals.

  ### 3. Is Exponential Discounting Actually Normatively Superior?
  There is a deeper theoretical debate hidden in your premise: *Is exponential discounting actually the normative gold standard?*

  The standard economic argument (Samuelson, 1937) is that exponential discounting is the only function that ensures dynamic consistency. However, later work in evolutionary psychology and Bayesian decision theory suggests that hyperbolic discounting might be a rational response to **uncertainty**.

  If there is a hazard rate—a probability that you will die, lose the reward, or that the counterparty will default before the future date arrives—then the "rational" discount function is not exponential. As the time horizon extends, the probability of the reward actually materializing decreases. When you factor in this uncertainty, a hyperbolic discount curve emerges naturally from Bayesian updating (Sozou, 1998; Azfar, 1999).

  In this light, the "preference reversal" isn't necessarily an error in logic; it's a rational update based on the implicit assumption that "the further away the reward, the higher the chance it won't happen." If this is true, then trying to force exponential discounting would actually be *irrational*, as it would ignore the risk profile of the future. Rationalists may intuitively sense this, leading them to focus on commitment (ensuring the reward actually happens) rather than discounting (ignoring the risk).

  ### 4. The "Multiple Selves" Game Theory
  The rationalist blogosphere (influenced heavily by Ainslie's *Picoeconomics* and Elster's *Ulysses and the Sirens*) often models time inconsistency not as a single agent making a mistake, but as a game between multiple temporal selves.

  In this framework, Self($t_0$) and Self($t_1$) have different utility functions. Self($t_0$) wants health; Self($t_1$) wants cake. This is not a single agent with a broken discount function; it is a conflict of interest.

  In a game between two agents with conflicting interests, you do not expect one agent to convince the other to change their utility function. You expect them to negotiate, bind, or threaten. Precommitment is the equivalent of Self($t_0$) building a wall that Self($t_1$) cannot climb. It is the Nash Equilibrium of the intra-personal game.

  If you view the self as a succession of agents, the "money pump" argument still holds, but the solution remains precommitment. You cannot force Self($t_1$) to value the future like Self($t_0$), but Self($t_0$) can restrict the action space of Self($t_1$).

  ### 5. Consequentialism vs. Deontology of Rationality
  Finally, there is a philosophical divergence in what "rationality" means.

  *   **Deontological Rationality:** You must follow certain rules of reasoning (e.g., transitivity, dynamic consistency). If you violate them, you are irrational, regardless of outcomes.
  *   **Consequentialist Rationality:** You are rational if you achieve your reflectively endorsed goals.

  The rationalist community is overwhelmingly consequentialist. If a human with hyperbolic discounting uses a commitment device to quit smoking, they have achieved their goal. If a hypothetical exponential discounter tries to quit smoking but lacks the emotional machinery to care about the future enough to act, they fail.

  The money pump argument shows that hyperbolic discounters are *vulnerable*. It does not say they are *hopeless*. The rationalist conclusion is: "I am vulnerable to pumps. Therefore, I must remove myself from the casino." It is not: "I must cease to be a human who finds casinos tempting."

  ### Conclusion
  To answer your final question directly: **Everyone talking this way is taking the exploitability argument to its logical conclusion.**

  The logical conclusion of "I am vulnerable to a money pump due to time inconsistency" is not "I must change my time preferences." It is "I must remove the opportunity for the pump to operate."

  Since humans cannot voluntarily overwrite their discount functions (Constraint 1), and since hyperbolic discounting may partially reflect rational uncertainty about the future (Constraint 2), the only instrumentally rational move is to alter the choice architecture. Precommitment devices are not a workaround for irrationality; they are the specific technology required to make a time-inconsistent agent behave in a time-consistent manner.

  The rationalists are effectively saying: *We accept the money pump theorem. That is why we build cages.*
