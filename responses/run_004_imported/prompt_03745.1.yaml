      *   Does hypocrisy undermine standing?
      *   *Nuance:* It undermines *moral authority*, but not necessarily the *truth* of the statement. However, in a family context, moral authority *is* standing.
      *   *Crucial Turn:* Claudia's Point (6) is the killer. If the situations aren't equivalent, he isn't a hypocrite. If he isn't a hypocrite, Meera's argument falls apart.
