prompt: |-
  Okay so this has been bugging me for months and my sister and I keep going back and forth on it. I've always felt like I have a pretty sharp gut instinct for telling when someone's lying to me, like this specific prickly feeling I get in my stomach. It became a whole thing after I called out a coworker for lying in a meeting last year and I turned out to be totally right, and ever since then I've been kind of obsessed with figuring out whether this "skill" is actually real or if I'm just fooling myself.

  So for like the past year, whenever I get that gut feeling about someone, instead of just leaving it, I push the conversation further, watch them closer, ask follow up questions, that sort of thing, and then afterward I judge whether they were actually lying based on all that extra digging. And honestly, almost every single time, the extra digging backs up my original gut call. I'm not just remembering the hits and forgetting the misses either, I've actually kept a rough mental tally and its a lot of cases by now, across all kinds of different people and situations. So I told my sister that at this point I basically have real proof that my gut is a reliable lie detector, and that maybe I should even start leaning on it for bigger stuff, like whether to trust a new business partner. She says the "digging deeper" doesn't count as an independant check on anything, because I don't have a polygraph or some totally separate way of finding out the truth — all that extra digging is still just me reading tone and body language and vibes, the exact same kind of read that gave me the gut feeling to begin with, so of course it's gonna agree with itself. I get what she's saying, but it still feels wrong to just toss it out, because each case really is a different person and a different situation, so it feels like actual new evidence stacking up, not me just repeating the same guess a hundred times. So who's actually right here — is she onto something real, or have I honestly earned the right to trust my gut on this by now?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **The Claim:** The user believes they have a reliable "gut instinct" for detecting lies (a prickly stomach feeling).
      *   **The Evidence:** Over the past year, whenever they get the feeling, they "dig deeper" (ask follow-ups, watch closer). Almost every time, this digging confirms the lie. They've kept a mental tally of many cases across different people/situations.
      *   **The Conflict:** The user's sister argues that the "digging deeper" isn't an independent verification. It's just more of the same subjective reading (tone, body language, vibes) that generated the gut feeling initially. Therefore, it's circular reasoning.
      *   **The Question:** Who is right? Is the gut instinct proven reliable, or is the sister's skepticism valid? Can the user trust this for high-stakes decisions (like a business partner)?

  2.  **Evaluate the Psychology/Logic:**
      *   **The Gut Feeling (Intuition):** Intuition is often pattern recognition based on past experience. It *can* be accurate, but it's also prone to bias.
      *   **The Verification Method:** The user investigates *after* the feeling arises. They look for inconsistencies, nervousness, contradictions.
      *   **The Sister's Point (Circularity/Confirmation Bias):** This is the crux of the issue. If the criterion for "lying" during the digging phase is the same as the criterion for the gut feeling (e.g., "they look shifty," "their story wavers"), then the user is essentially calibrating a thermometer against itself.
      *   **Confirmation Bias:** The user mentions they aren't just remembering hits. However, the *definition* of a "hit" is subjective. If they dig and the person gets defensive, is that proof of lying? Or is it proof of being accused? If the person stammers, is it lying or nervousness about being questioned?
      *   **Lack of Ground Truth:** There is no objective "truth" established (e.g., email trail, third-party witness, confession, polygraph). The user decides the person was lying based on *their own interpretation* of the subsequent interaction.
      *   **Self-Fulfilling Prophecy:** Accusing someone or aggressively questioning them often makes innocent people act nervous or defensive, which looks like lying, confirming the bias.

  3.  **Determine Who is "Right":**
      *   **Sister is scientifically/logically more correct.** The methodology is flawed. There is no independent ground truth.
      *   **User is experientially correct (but potentially misled).** The feeling *is* real to them, and they *are* finding inconsistencies. But they haven't proven the inconsistencies equal *lies*. They might just be detecting nervousness, ambiguity, or discomfort.
      *   **Risk Assessment:** Relying on this for high-stakes decisions (business partner) is dangerous without objective verification.

  4.  **Drafting the Response:**
      *   **Validate the User:** Acknowledge that their intuition is likely a form of skilled pattern recognition. It's not "nothing." Don't dismiss their experience entirely.
      *   **Validate the Sister:** Explain *why* her logic holds up from a scientific/critical thinking perspective. The lack of independent verification is the key weakness.
      *   **Explain the Mechanisms:**
          *   *Confirmation Bias:* Even with a mental tally, how is "truth" defined?
          *   *The Othello Error:* Mistaking stress/fear for deception. Aggressive questioning causes stress in innocent people too.
          *   *Circular Reasoning:* Using the same sensory inputs to generate the hypothesis and test the hypothesis.
      *   **Address the "Mental Tally":** A mental tally is notoriously unreliable compared to written, pre-registered data. Hindsight bias plays a role.
      *   **Advice on High-Stakes Decisions:** Do not rely solely on this for a business partner. Use contracts, background checks, references, etc.
      *   **Synthesis:** The gut is a *signal* to investigate, not a *verdict*. The sister is right about the proof, but the user is right that the skill is worth honing *if* paired with objective checks.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm on the logic.
      *   Avoid saying "You're wrong." Say "Your sister has a point about the methodology."
      *   Use analogies (like the metal detector or the smoke alarm).

  6.  **Key Concepts to Include:**
