answer: |-
  Here are ten interview questions designed to probe the vulnerabilities of the resolute choice defense, tailored for an expert audience. They include the four specific thematic requirements you requested, along with the anticipated replies and sharper follow-ups.

  ### 1. The Separability/Individuation Worry
  **Question:** A standard objection to resolute choice is that it violates the Separability principle by smuggling the history of the choice into the description of the option. It looks like you're solving the money pump not by showing the preferences are rational, but by redefining "Option A at $t_2$" as "Option A *given that I chose A at $t_1$*." If the options are individuated by the plan required to reach them, doesn't resolute choice make the preference relation trivial? Can't *any* pattern of behavior be rationalized simply by individuating options finely enough?

  *   **Likely Reply:** She will likely argue that options in dynamic contexts *are* inherently temporally indexed or plan-relative. Rationality isn't about atomistic choices but about the evaluation of whole plans. Separability is a synchronic constraint that doesn't apply to diachronic agency; rejecting it isn't "changing the subject," it's correctly identifying the object of choice.
  *   **Follow-up:** But if the object of choice is the whole plan, then the agent never actually chooses at $t_2$; they merely execute. If they *can* choose at $t_2$—if they have the capacity to defect—then the preference at $t_2$ must be over the options *as available at $t_2$*. If you say they *shouldn't* choose based on local availability, aren't you prescribing a form of self-deception where the agent must ignore the very options they know are in front of them?

  ### 2. The Cost of Sophistication
  **Question:** Let's look at the sophisticated chooser who anticipates the pump but lacks resolute capacity. To avoid the cycle, they often have to turn down a strictly beneficial trade at the very first node—a violation of ex-ante dominance. You argue resolute choice avoids this cost. But doesn't this just shift the burden? If the only way to avoid violating dominance is to cultivate a psychological mechanism that overrides local preference, isn't the *need* for that mechanism itself evidence that the underlying preference structure is defective? Why isn't the "cost" of needing resolve just the rationality cost of intransitivity reintroduced under a different name?

  *   **Likely Reply:** She will likely distinguish between the *structure* of preferences and the *capacity* for agency. The cost isn't in the preferences; it's in the environment of dynamic choice. Transitivity is a sufficient condition for avoiding pumps, but not necessary. The "cost" is merely that non-transitive agents must be more cognitively sophisticated (resolute) than transitive ones, which is a practical burden, not a rational failing.
  *   **Follow-up:** But if a transitive agent can walk through the same decision tree naively and suffer no loss, while the non-transitive agent *must* exert cognitive effort to monitor their own consistency, isn't that efficiency gap a pragmatic definition of irrationality? If rationality is about securing ends with available means, and one preference structure requires "expensive" monitoring software to function while the other runs on default, why shouldn't we call the former less rational?

  ### 3. Incompleteness vs. Intransitivity
  **Question:** Your defense has been extended to cover incomplete preferences, but the money-pump dynamics differ. An intransitive agent is *forced* by their strict preferences to trade $A \to B \to C \to A$. An agent with incomplete preferences ($A \succ B$, but $B \parallel C$ and $C \parallel A$) isn't forced to accept the first trade; they can just say "no." The pump for incompleteness usually relies on offering small sweeteners to induce switching, exploiting indecisiveness. Does resolute choice actually solve this, or does it just arbitrarily impose completeness? If I'm genuinely undecided between $B$ and $C$, why is "sticking to $B$" more rational than "switching to $C$"?

  *   **Likely Reply:** She will likely argue that incompleteness is often a failure to form a judgment rather than a fundamental state. Resolute choice allows the agent to *make* a judgment ex-ante and bind themselves to it, thereby completing the preference relation through commitment. The rationality lies in the decisiveness, not the pre-existing comparison.
  *   **Follow-up:** That sounds like bootstrapping. If the preference is genuinely incomplete, there is no ex-ante basis to prefer the plan "Stick to $B$" over "Switch to $C$." If you say the agent can just *pick* one, aren't you admitting that the money pump argument doesn't prove the preferences were irrational, but rather that the agent was insufficiently authoritarian? Does this turn rationality into a sheer act of will?

  ### 4. The Addiction/Ulysses Analogy
  **Question:** Critics often analogize resolute choice to Ulysses tying himself to the mast, which seems rational, but also to an addict resolving to quit while craving a hit. In both cases, the agent acts against a local preference to satisfy an earlier plan. How do you distinguish the rational resolute chooser from the irrational addict? If the criterion is "satisfying the ex-ante plan," the addict qualifies. If the criterion is "satisfying the ex-post preference," the resolute chooser fails. What normative fact breaks the symmetry between Ulysses and the addict?

  *   **Likely Reply:** She will likely appeal to the *content* of the plan. Ulysses' ex-ante plan aligns with his reflective, long-term values (survival/hearing the song without death). The addict's ex-ante plan might align with long-term health, but often the addict's ex-ante plan is also compromised (e.g., pre-committing to use). The distinction is whether the ex-ante plan is itself reflectively endorsed as "good."
  *   **Follow-up:** But who endorses the plan? At $t_2$, the addict reflectively endorses the hit. At $t_0$, they endorsed sobriety. You're privileging the $t_0$ time-slice. Why does the $t_0$ slice have normative authority over the $t_2$ slice? If personal identity is just a chain of time-slices, why isn't the $t_2$ agent's preference just as sovereign? Are you smuggling in a metaphysical view of the self that decision theory shouldn't rely on?

  ### 5. Dynamic Consistency
  **Question:** Resolute choice explicitly violates Dynamic Consistency—the requirement that if you prefer Plan 1 to Plan 2 at $t_0$, you should not choose an action at $t_1$ that makes Plan 2 inevitable. You accept this violation. But isn't Dynamic Consistency the core of what it means to be a coherent agent over time? If you allow violations here, what stops an agent from having a preference reversal at every single node, provided they "resolve" to ignore it? Where is the constraint on arbitrariness?

  *   **Likely Reply:** She will argue that Dynamic Consistency presuppose Separability. If you reject Separability (as in Q1), Dynamic Consistency loses its grip. The constraint on arbitrariness is the ex-ante optimality of the plan. You can't reverse preferences arbitrarily if you are bound by the requirement to maximize ex-ante utility.
  *   **Follow-up:** But "ex-ante optimality" is calculated using the preferences held at $t_0$. If preferences change at $t_1$, the calculation is outdated. You're essentially saying "maximize according to the preferences you *used* to have." Why is that a normative requirement rather than a form of tyranny by a past self who no longer exists?

  ### 6. The Source of Normativity
  **Question:** Let's press the "tyranny of the past self" point. In the money pump, the agent at $t_2$ prefers to defect. The resolute choice theorist says they shouldn't. What is the *source* of that "should"? Is it prudential? Moral? Or purely structural? If the agent at $t_2$ knows they will suffer no regret (because they value fidelity to plans), they aren't pumped. But if they *don't* value fidelity, they get pumped. Doesn't this make rationality contingent on having a specific meta-preference for consistency?

  *   **Likely Reply:** She will likely claim that agency itself requires a minimal commitment to diachronic coherence. To be an agent is to act on reasons, and reasons imply stability. Without a commitment to resolve, you aren't an agent making choices; you're a locus of shifting impulses. The "should" is constitutive of agency.
  *   **Follow-up:** That's a high bar. It implies that anyone who succumbs to a money pump isn't just irrational, but lacks agency. But we can imagine a naive agent who is perfectly coherent synchronically, just myopic. Are you prepared to say the naive agent isn't an agent? Or must you concede that resolute choice is a *supererogatory* virtue of high-functioning agents, not a baseline requirement of rationality?

  ### 7. Psychological Realism vs. Ideal Theory
  **Question:** Decision theory often walks a line between normative ideal and psychological description. Resolute choice seems to demand a specific psychological capability: the ability to decouple current choice from current desire. If a significant portion of the population literally *cannot* do this (due to cognitive limitations or hyperbolic discounting), does your theory imply they are incapable of rationality? Are you building a theory for humans or for idealized resolvers?

  *   **Likely Reply:** She will likely respond that decision theory is normative, not descriptive. The fact that people struggle to be resolute doesn't mean they shouldn't be. We don't abandon logic because people make calculation errors. Resolute choice sets the standard; bounded rationality explains the deviation.
  *   **Follow-up:** But with logic, the error is in the *computation*. With resolute choice, the "error" is in the *motivation*. You're asking agents to act against their strongest current motivation. If the theory requires a psychological override that evolution didn't give us, isn't the theory "ought implies can" violating? At what point does a normative theory become useless because it describes an impossible creature?

  ### 8. The Bootstrapping Objection
  **Question:** If I can avoid a money pump simply by resolving to stick to a plan, can I resolve to stick to *any* plan? Suppose I have intransitive preferences $A \succ B \succ C \succ A$. I resolve to stick to $C$. I avoid the pump. But I've ended up with $C$, which I locally prefer less than $A$ at the start. Haven't I just used resolute choice to "bootstrap" a sub-optimal outcome into a rational one? Does resolute choice allow agents to rationalize clearly dominated outcomes just by pre-committing to them?

  *   **Likely Reply:** She will argue that the resolution must be to the *ex-ante optimal* plan. You can't resolve to a dominated plan because that plan wouldn't survive the ex-ante evaluation. The resolution is constrained by the initial preference ordering.
  *   **Follow-up:** But the initial ordering is intransitive! There *is* no ex-ante optimal plan in a cycle unless you break the cycle by fiat. If you say "choose the plan that avoids the pump," you're using the *avoidance of the pump* to define the optimal plan, which makes the argument circular. You're using the conclusion (don't get pumped) to justify the premise (this plan is optimal).

  ### 9. Uncertainty and Stochastic Trees
  **Question:** Most money pump arguments assume deterministic trees. But real choices involve risk. If I resolve to take a path at $t_0$, but at $t_1$ new information arrives that changes the expected utility of the plan, does resolute choice demand I ignore that information? If I update my beliefs but not my plan, I look dogmatic. If I update my plan, I look naive. How does resolute choice handle Bayesian updating without collapsing into sophisticated choice?

  *   **Likely Reply:** She will likely distinguish between preference reversals and belief updates. Resolute choice binds preferences, not beliefs. If new information changes the expected utility, the ex-ante plan would have included a contingency for that information. True resolute choice is a plan over states of the world, not just actions.
  *   **Follow-up:** But you can't foresee all states. In an unanticipated state, the ex-ante plan is silent. At that moment, you are forced to choose locally. If your local preferences are still intransitive, the pump opens up again. Doesn't resolute choice only work in a small world where all contingencies are foreseen? If so, isn't its applicability vanishingly small?

  ### 10. Exploitability vs. Irrationality
  **Question:** Finally, let's return to the core claim: that exploitability proves irrationality. You argue that resolute agents aren't exploitable. But suppose there is a "tax" on resoluteness—say, a cognitive load cost or a stress cost. A transitive agent pays zero tax. A resolute non-transitive agent pays a positive tax. In a competitive market, the transitive agent accumulates more resources. Even if the resolute agent isn't "pumped" in the strict loop sense, they are out-competed. Isn't evolutionary or market pressure a form of money pump that resolute choice can't block?

  *   **Likely Reply:** She will likely concede that there is a pragmatic advantage to transitivity but deny it constitutes *irrationality*. Rationality is about internal coherence, not external success. An agent can be rational but unlucky (or cognitively burdened). Exploitability arguments conflate pragmatic fitness with normative rationality.
  *   **Follow-up:** But decision theory was born from pragmatism—Ramsey, de Finetti, Dutch Books. The whole point was that degrees of belief are defined by betting behavior. If your "rational" preferences lead to systematic resource loss compared to a rival strategy, haven't you lost the pragmatic battle that defines the field? If the Dutch Book argument works because it guarantees loss, and resolute choice only avoids loss by incurring cognitive costs that *also* reduce utility, haven't you just moved the loss from the wallet to the brain?
