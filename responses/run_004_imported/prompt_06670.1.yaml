          *   *Verdict:* The embryo case is a niche counterexample to "birth time is essential," but the stronger Kripkean point is about *gametic* origin, which entails a time window. If parents meet later, different sperm/egg. So "earlier" is still hard. But "later" (cryo) is the real threat to the asymmetry if it implies the *person* is the same despite time shift.
          *   *Equivocation:* "Origin" usually means gametic constitution. "Birth date" is a consequence. The argument conflates them.

      *   **Q2: Principled Distinction (Origin vs. Terminus):**
          *   *Why is start fixed and end open?*
          *   *Metaphysics:* Coming into existence is constitutive of identity. Ceasing to exist is not (usually). You can survive loss of parts, coma, etc. Death is the end of the capacity for existence.
