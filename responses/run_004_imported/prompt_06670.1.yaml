      *   *Does this matter for Symmetry?* Lucretius compares Time Before (T1) and Time After (T2). Nagel says T2 is deprivation, T1 is not. Why? Because T2 contains goods *I* could have had. T1 contains goods *I* could not have had (because I wouldn't exist).
      *   *The User's specific worry:* "Why treat when a life ends as biographically negotiable while treating when it begins as metaphysically frozen?"
      *   *Answer:* Because death is an interruption of an existing trajectory. Birth is the initiation of a trajectory. Interrupting is different from delaying initiation.

  6.  **Finalizing the Advice:**
