  2.  **Deconstruct the Argument:**
      *   *Epicurus/Lucretius:* Death isn't bad because (a) no subject to experience it, and (b) pre-natal non-existence isn't bad, so post-mortem shouldn't be either (Symmetry).
      *   *Nagel-style Reply:* Asymmetry is real. Post-mortem non-existence deprives us of possible future life. Pre-natal non-existence does not deprive us of possible past life because we *couldn't* have been born earlier without being different people (Origin Essentialism).
      *   *User's Worry:* Cryopreservation shows the *same* genetic origin can result in birth at *different* times. If $t_{birth}$ is variable for the same origin, maybe $t_{death}$ is variable too? If both are variable, symmetry returns. If we fix $t_{birth}$ as essential to block symmetry, why not fix $t_{death}$?

